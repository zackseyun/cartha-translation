  variant: modern literary Russian
source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: ru
  text: 'Тогда пророк Шемая пришёл к Ровоаму и правителям Иудеи, собравшимся в Иерусалиме из-за Шишака[a], и сказал им: «Так говорит Яхве: Вы оставили Меня, и Я тоже оставил вас в руках Шишака».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица Шишака»; то есть из-за его наступления или из страха перед ним.'
    reason: Лексический вариант поясняет образный еврейский оборот מִפְּנֵי и сохраняет возможный оттенок угрозы или страха.
lexical_decisions:
- source_word: וּ/שְׁמַעְיָה הַ/נָּבִיא
  choice: И пришёл пророк Шемая
  rationale: Союз ו продолжает повествование; естественный русский порядок слов сохраняет имя и определение נָבִיא без архаизации.
- source_word: וְ/שָׂרֵי יְהוּדָה
  choice: и правителям Иудеи
  rationale: שָׂרִים здесь обозначает лиц, обладающих политической властью; «правители» передаёт статус яснее, чем архаичное «князья».
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: собравшимся в Иерусалиме
  rationale: Причастная конструкция естественно передаёт значение нифаля; «в Иерусалиме» указывает на место, где они собрались.
- source_word: מִ/פְּנֵי שִׁישָׁק
  choice: из-за Шишака
  rationale: Буквально «от лица Шишака»; в контексте оборот выражает причину их сбора, вызванного его наступлением, не уточняя сверх текста, был ли главным мотивом страх или бегство.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена традиционная формула речи посланника, а тетраграмматон передан личным именем «Яхве».
- source_word: עֲזַבְתֶּם אֹתִי ... עָזַבְתִּי אֶתְכֶם
  choice: Вы оставили Меня, и Я тоже оставил вас
  rationale: Одинаковый перевод повторённого глагола עזב сохраняет намеренную риторическую симметрию. «Оставили» звучит естественно и допускает как смысл отступничества, так и ответного лишения защиты.
- source_word: בְּ/יַד שִׁישָׁק
  choice: в руках Шишака
  rationale: Русский устойчивый оборот сохраняет образ «руки» как власти и контроля, при этом множественное число идиоматично для современного русского языка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; «Яхве» прямо передаёт тетраграмматон, не заменяя его титулом.
- issue: Взаимность суда в וְאַף אֲנִי
  choice: и Я тоже
  alternative: поэтому и Я; так и Я
  rationale: «И Я тоже» сохраняет соответствие между поступком народа и ответом Бога, не усиливая причинную связь сверх явной формы текста.
- issue: Смысл עזב в словах Бога
  choice: оставили / оставил
  alternative: покинули / покинул; отвернулись от / предал
  rationale: Повтор одного русского глагола удерживает богословски значимую симметрию и не превращает образ лишения защиты в более узкое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена переданы как Шемая, Ровоам и Шишак; пророческая формула сохранена. В прямой речи использованы вложенные кавычки, чтобы ясно отделить вступление пророка от слов Яхве.
