base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: ru
  text: И царь Ровоам сделал вместо них[a] бронзовые щиты и поручил их начальникам стражи[b], охранявшей вход во дворец царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть взамен золотых щитов, которые забрал Шишак (см. предыдущий стих).
    reason: cross_reference
  - marker: b
    text: 'Буквально: «бегунов». Вероятно, имеются в виду царские гонцы, также служившие дворцовой стражей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычное значение глагола עשה в данном контексте — изготовить или сделать; простой русский глагол естественно соответствует повествовательному стилю.
- source_word: תַּחְתֵּיהֶם
  choice: вместо них
  rationale: 'Оборот с תחת выражает замену: бронзовые щиты были изготовлены взамен золотых щитов, упомянутых в предыдущем стихе.'
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: бронзовые щиты
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; применительно к оружию и доспехам наиболее вероятно и естественно значение «бронза».
- source_word: וְהִפְקִיד עַל יַד
  choice: поручил их
  rationale: Сочетание каузативной формы פקד с עַל יַד означает передать под чью-либо ответственность или на хранение; «поручил» передаёт это без буквального, неестественного оборота «в руки».
- source_word: שָׂרֵי
  choice: начальникам
  rationale: שָׂרֵי обозначает руководителей или командиров; «начальники» естественно подходит для руководителей дворцовой стражи.
- source_word: הָרָצִים
  choice: царских телохранителей
  rationale: Буквально слово означает «бегущие» или «бегуны», но в царском окружении обозначает особую группу служителей, выполнявших обязанности гонцов и дворцовой охраны. Функциональный перевод делает смысл понятным, а буквальное значение сохранено в сноске.
- source_word: הַשֹּׁמְרִים
  choice: охранявших
  rationale: Причастие указывает на постоянную обязанность этих людей охранять вход.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: вход во дворец царя
  rationale: Буквально — «вход в дом царя»; в контексте царской резиденции современное русское «дворец царя» ясно передаёт подразумеваемое значение.
