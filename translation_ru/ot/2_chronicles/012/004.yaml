  text: וַ/יִּלְכֹּ֛ד אֶת עָרֵ֥י הַ/מְּצֻר֖וֹת אֲשֶׁ֣ר לִֽ/יהוּדָ֑ה וַ/יָּבֹ֖א עַד יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/004.yaml
  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: ru
  text: Он захватил укреплённые города, принадлежавшие Иудее, и дошёл до Иерусалима[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и продвинулся до самого Иерусалима». Буквально в еврейском тексте: «и дошёл до Иерусалима»; подчёркивается, что после взятия укреплённых городов Иудеи он достиг Иерусалима.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: Глагол לכד в военном контексте означает взятие или захват городов; «захватил» естественно и точно передаёт этот смысл.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: укреплённые города
  rationale: Сочетание прямо обозначает города, снабжённые укреплениями; перевод сохраняет существительное «города» и не заменяет его менее точным словом «крепости».
- source_word: אֲשֶׁר לִיהוּדָה
  choice: принадлежавшие Иудее
  rationale: Предлог ל выражает здесь принадлежность или политическую отнесённость. Формулировка не сужает смысл до одного лишь географического расположения.
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: и дошёл до Иерусалима
  rationale: Сочетание בוא с עַד обозначает достижение предела движения. «Дошёл до» естественно по-русски передаёт прибытие к Иерусалиму, не утверждая однозначно, что войско вошло в город.
