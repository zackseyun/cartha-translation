id: 2CH.12.9
reference: 2 Chronicles 12:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: ru
  text: И Шишак, царь Египта, выступил против Иерусалима и забрал сокровища дома Яхве[a] и сокровища царского дома[b]. Он забрал всё; забрал и золотые щиты, которые сделал Соломон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храма Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царского дворца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: выступил против Иерусалима
  rationale: В военном контексте עלה с עַל обозначает поход или наступление на город. «Выступил против» естественно передаёт военный смысл, не добавляя прямо не названного штурма.
- source_word: שִׁישַׁק
  choice: Шишак
  rationale: Имя передано традиционной русской транслитерацией, близкой к еврейской форме.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царь Египта
  rationale: Конструктивное сочетание прямо указывает на сан и страну Шишака; в русском приложении определённость выражается без артикля.
- source_word: אֹצְרוֹת
  choice: сокровища
  rationale: В контексте разграбления храма и дворца речь идёт о хранившихся ценностях. «Сокровища» естественнее по-русски как прямое дополнение к «забрал», чем «сокровищницы», и сохраняет возможный смысл содержимого хранилищ.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранён буквальный библейский образ «дома» как обозначения храма; более явное «храм Яхве» дано в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Передаёт буквальное «дом царя» и сохраняет параллель с «домом Яхве»; контекстуальное значение «царский дворец» указано в сноске.
- source_word: אֶת־הַכֹּל לָקָח
  choice: Он забрал всё
  rationale: Отдельная обобщающая фраза сохраняет усиление и полноту разграбления.
- source_word: מָגִנֵּי הַזָּהָב
  choice: золотые щиты
  rationale: Естественное русское соответствие сочетанию «щиты из золота».
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: которые сделал Соломон
  rationale: Прямо и без лишнего временного уточнения передаёт относительное придаточное еврейского текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога — тетраграмматон. Транслитерация сохраняет различие между именем и титулом.
- issue: Значение בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Основной текст сохраняет исходную метафору «дом», тогда как сноска поясняет её обычное контекстуальное значение и не навязывает конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным тоном. Повтор глагола «забрал» намеренно сохранён, чтобы передать риторическое усиление еврейского текста. Сноски поставлены непосредственно после выражений, к которым относятся.
