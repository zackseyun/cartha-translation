source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: ru
  text: И всякий раз, когда царь входил в дом Яхве, телохранители приходили и несли их[a], а потом возвращали в помещение телохранителей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть бронзовые щиты, упомянутые в предыдущем стихе.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «бегущих»; здесь имеется в виду царская охрана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: всякий раз, когда … входил
  rationale: Оборот מִדֵּי с инфинитивом выражает повторяющееся действие; эта формулировка естественно передаёт итеративный смысл.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранён обычный древнееврейский оборот «дом Яхве» как обозначение храма, без замены образа пояснительным словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: הָרָצִים
  choice: телохранители
  rationale: Буквально слово связано с «бегущими», но в контексте царского двора обозначает отряд царской охраны; «телохранители» ясно передаёт функцию.
- source_word: וּנְשָׂאוּם
  choice: несли их
  rationale: Форма означает, что охранники брали и несли названные ранее бронзовые щиты; местоименная отсылка сохранена в тексте и разъяснена в сноске.
- source_word: וֶהֱשִׁיבוּם
  choice: возвращали
  rationale: Каузативная форма שוב здесь означает возвращение предметов на место после использования.
- source_word: תָּא
  choice: помещение
  rationale: Слово обозначает отдельную комнату или камеру; нейтральное «помещение» естественно в данном контексте и не уточняет устройство комнаты сверх текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В древнееврейском тексте стоит тетраграмматон — личное имя Бога. Передача «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Повторяемость действия передана явно; местоименная связь с предыдущим стихом сохранена, а не заменена существительным в основном тексте.
