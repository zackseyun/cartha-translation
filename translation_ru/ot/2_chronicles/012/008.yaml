base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his servants[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: ru
  text: Ибо они станут его рабами, чтобы узнали, что значит служить Мне и служить царствам земным[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое здесь как «служить», может означать служение, труд или подневольную работу; применительно к Богу оно также может обозначать богослужебное служение или поклонение.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим Божьим решением и естественно звучит по-русски.
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: они станут его рабами
  rationale: Конструкция с היה выражает переход в новое состояние, а עֲבָדִים в контексте подчинения Шишаку обозначает не просто добровольных слуг, а людей, оказавшихся под чужой властью.
- source_word: וְיֵדְעוּ
  choice: чтобы узнали
  rationale: 'В данном контексте форма допускает целевое или результативное значение: подчинение должно дать им на опыте понять различие между двумя видами служения.'
- source_word: עֲבוֹדָתִי … וַעֲבוֹדַת
  choice: каково служить Мне … и служить
  rationale: Повтор одного русского глагола сохраняет намеренный параллелизм и широкий смысл עֲבוֹדָה — служение, труд, подчинение, а применительно к Богу также богослужебное почитание.
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: царствам других земель
  rationale: Естественная русская формулировка передаёт множественное число и контекстуальный смысл чужеземных политических держав, не придавая выражению универсального значения «всей земли».
theological_decisions:
- issue: Следует ли передавать עֲבוֹדָתִי исключительно как богослужение или поклонение
  choice: служить Мне
  alternative: поклоняться Мне
  rationale: Основной текст сохраняет смысловую широту еврейского слова и противопоставление служения Господу политическому порабощению земными царствами, не сводя первое лишь к обряду.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инфинитивная конструкция «каково служить» делает повтор корня естественным и сохраняет заложенный в оригинале контраст; прописное «Мне» принято как уважительное обозначение говорящего Бога.
