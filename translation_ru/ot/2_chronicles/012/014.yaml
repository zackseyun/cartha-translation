revisions:
- from: И он поступал дурно, потому что не настроил своё сердце[a] на то, чтобы искать Яхве.
  to: Он делал зло, потому что не подготовил своего сердца к тому, чтобы искать Яхве.
  rationale: Перевод уточнён ради более прямой передачи еврейского повествовательного глагола и основного значения הֵכִין. Причинная связь, образ сердца, инфинитив цели и личное имя Яхве сохранены. Сноска снята, поскольку исправленный основной текст сам передаёт буквальное значение без необходимости в лексическом альтернативном варианте.
