  text: וַ/יַּ֖עַשׂ הָ/רָ֑ע כִּ֣י לֹ֤א הֵכִין֙ לִבּ֔/וֹ לִ/דְר֖וֹשׁ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: ru
  text: Он делал зло, потому что не подготовил своего сердца к тому, чтобы искать Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרָע
  choice: И он поступал дурно
  rationale: 'Сочетание עשה с субстантивированным הָרָע выражает нравственную оценку поведения: «делать зло, поступать дурно». Несовершенный вид естественно передаёт итоговую характеристику царствования в данном контексте.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину отрицательной нравственной оценки.
- source_word: לֹא הֵכִין לִבּוֹ
  choice: не настроил своё сердце
  rationale: Hифиль глагола כון означает «подготовить, утвердить, направить». В сочетании с «сердцем» речь идёт о сознательной внутренней решимости; «настроил своё сердце» ясно и естественно передаёт этот смысл, а более буквальные варианты отмечены в сноске.
- source_word: לִדְרוֹשׁ
  choice: искать
  rationale: דרשׁ с Богом в качестве объекта обозначает обращение к нему, стремление к нему и поиск его воли; краткое «искать» сохраняет широту значения.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет различие между личным именем и титулом.
- issue: Смысл выражения «подготовить сердце»
  choice: сознательно настроить сердце на поиск Яхве
  alternative: приготовить или утвердить сердце
  rationale: Перевод передаёт намерение и внутреннюю направленность, не сводя «сердце» только к чувствам или только к разуму.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены образ «сердца» и глагол «искать», важные для богословской лексики Летописей.
