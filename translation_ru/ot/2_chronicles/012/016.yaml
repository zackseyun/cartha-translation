lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: В составе устойчивой царской формулы глагол означает смерть. «Почил» сохраняет образ сна и торжественный характер формулы, оставаясь понятным в современном литературном русском языке.
- source_word: עִם אֲבֹתָיו
  choice: со своими предками
  rationale: «Предки» естественно передаёт родовую связь и в современном русском звучит яснее, чем буквальное формульное «с отцами своими».
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Страдательная конструкция прямо передаёт форму древнееврейского глагола и естественна по-русски.
- source_word: בְּעִיר דָּוִיד
  choice: в городе Давида
  rationale: Традиционное и ясное русское обозначение этого места.
- source_word: וַיִּמְלֹךְ
  choice: стал царствовать
  rationale: В сообщении о престолонаследии выражение передаёт вступление на царство, а не только последующее правление.
- source_word: אֲבִיָּה
  choice: Авия
  rationale: Принятая русская передача данной древнееврейской формы имени.
- source_word: בְנוֹ
  choice: его сын
  rationale: Прямая и естественная передача родственного обозначения.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Точно передаёт занятие сыном царского места Ровоама; постановка в начале предложения делает русскую фразу естественной.
