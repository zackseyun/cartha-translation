  source_fidelity: 'Смысловой каркас передан точно: Яхве видит смирение, сообщает Шемаии о неполном смягчении суда и о том, что гнев не будет излит на Иерусалим через Шишака. Однако «поэтому» эксплицирует причинную связь, не выраженную отдельным союзом в прямой речи, а «рукой Шишака» менее естественно в современном русском. Формула «слово Яхве было к Шемаии» слишком калькирована.'
