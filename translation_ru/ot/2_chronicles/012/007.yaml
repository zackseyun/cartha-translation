source:
  edition: WLC
  text: וּ/בִ/רְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר יְהוָ֨ה אֶל שְׁמַֽעְיָ֧ה לֵ/אמֹ֛ר נִכְנְע֖וּ לֹ֣א אַשְׁחִיתֵ֑/ם וְ/נָתַתִּ֨י לָ/הֶ֤ם כִּ/מְעַט֙ לִ/פְלֵיטָ֔ה וְ/לֹא תִתַּ֧ךְ חֲמָתִ֛/י בִּ/ירוּשָׁלִַ֖ם בְּ/יַד שִׁישָֽׁק־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: ru
  text: 'Когда Яхве увидел, что они смирились, слово Яхве пришло к Шемаии: «Они смирились; Я не погублю их, а дам им небольшое избавление[a]. Мой гнев не изольётся на Иерусалим через Шишака».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дам им немного спасения»; возможно также: «оставлю им немного уцелевших». Еврейское выражение кратко и может подчёркивать либо ограниченность избавления, либо сохранение некоторого числа уцелевших.'
    reason: Существительное פְלֵיטָה может обозначать избавление, спасение, возможность уцелеть или уцелевших; краткая конструкция не позволяет однозначно предпочесть одно из этих значений.
lexical_decisions:
- source_word: וּבִרְאוֹת
  choice: Когда … увидел
  rationale: Предлог ב при инфинитиве ראה образует временную конструкцию; такой перевод естественно передаёт последовательность событий.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: נִכְנָעוּ
  choice: они смирились
  rationale: Нифаль глагола כנע в данном контексте обозначает добровольное смирение и покорность в ответ на пророческое обличение.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: слово Яхве было к
  rationale: Сохранена характерная древнееврейская формула получения пророческого слова; она понятна и уместна в русском библейском повествовании.
- source_word: לֹא אַשְׁחִיתֵם
  choice: Я не погублю их
  rationale: Форма породы хифиль от שׁחת означает уничтожение или погубление; «погублю» сохраняет высокий, но понятный регистр.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: а дам им некоторое избавление
  rationale: Компактная конструкция допускает значения ограниченного спасения, возможности уцелеть или некоторого числа уцелевших. Основной текст передаёт ограниченность избавления, а примечание сохраняет альтернативы.
- source_word: תִתַּךְ חֲמָתִי
  choice: Мой гнев не изольётся
  rationale: Сохранён образ гнева как изливаемой силы, обычный для пророческой речи.
- source_word: בְּיַד שִׁישָׁק
  choice: рукой Шишака
  rationale: Буквально сохранён древнееврейский оборот со значением действующего орудия; по-русски он остаётся понятным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Причинная связь между смирением и отменой полного уничтожения
  choice: «поэтому Я не погублю их»
  alternative: «Я не погублю их» без явной связки
  rationale: Причинная связь следует из непосредственного повторения נִכְנָעוּ и решения Бога, хотя отдельного причинного союза в прямой речи нет; «поэтому» ясно передаёт ход мысли, не превращая ограниченное избавление в полную отмену суда.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис пророческой формулы и образ «излияния гнева» сохранены, но фраза остаётся понятной обычному читателю. Имена переданы как Шемаия и Шишак.
