  source_fidelity: 'Смысл передан в целом верно: сохранены 400 гранатов, две сетчатые конструкции, распределительные два ряда на каждой, цель действия и архитектурные части капителей на вершинах столбов. Однако «решётчатые плетения» тавтологично и неестественно для современного русского, а «чаши капителей» без поясняющего определения воспринимается как отдельные сосуды, а не как округлые части капителей.'
  naturalness: Предлагаемая редакция использует естественные для архитектурного описания сочетания «сетчатые украшения», «чашеобразные части капителей» и «на вершинах столбов». Двойное тире в исходном варианте не нужно.
