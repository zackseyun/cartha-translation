base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: ru
  text: и четыреста гранатов для двух сетчатых украшений — по два ряда гранатов на каждом, чтобы покрыть две чашеобразные части капителей, находившиеся на вершинах столбов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: гранаты
  rationale: Существительное буквально обозначает плоды граната; здесь речь о декоративных изображениях, однако предметный образ следует сохранить.
- source_word: אַרְבַּע מֵאוֹת
  choice: четыреста
  rationale: Прямая передача количественного числительного.
- source_word: שְּׂבָכוֹת
  choice: решётчатые плетения
  rationale: Слово обозначает сетчатую или решётчатую декоративную конструкцию на капителях; сочетание передаёт и форму, и характер работы.
- source_word: שְׁנַיִם טוּרִים
  choice: по два ряда
  rationale: טוּרִים означает упорядоченные ряды; частица «по» естественно выражает распределение между двумя плетениями.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: на каждом плетении
  rationale: Формально выражение стоит в единственном числе («на одном плетении»), но в контексте имеет распределительное значение.
- source_word: לְכַסּוֹת
  choice: чтобы покрывать
  rationale: Инфинитив выражает назначение; «покрывать» прямо передаёт значение корня.
- source_word: גֻּלּוֹת
  choice: чаши
  rationale: Сохранён буквальный образ округлых, чашеобразных частей капителей без превращения существительного в прилагательное.
- source_word: כֹּתָרוֹת
  choice: капителей
  rationale: В архитектурном контексте речь идёт о верхних частях столбов; «капитель» — точный современный термин.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: наверху столбов
  rationale: Буквально «на поверхности/лице столбов»; наличие капителей ясно указывает на верхнюю часть столбов.
