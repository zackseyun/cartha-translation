base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/014.yaml
  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: ru
  text: Он сделал подставки[a] и сделал умывальники на подставках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «основания»; еврейское слово обозначает опорные конструкции для умывальников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: подставки
  rationale: В данном контексте слово обозначает изготовленные опорные конструкции для умывальников. «Подставки» ясно передаёт их функцию и не добавляет спорного указания на подвижность.
- source_word: עָשָׂה
  choice: сделал
  rationale: Обычный глагол עשה здесь естественно передаётся нейтральным «сделал», без дополнительной стилистической окраски.
- source_word: הַכִּיֹּרוֹת
  choice: умывальники
  rationale: כִּיּוֹר обозначает храмовый сосуд для омовений. «Умывальники» сохраняет культовую функцию предметов и соответствует современной русской библейской лексике.
- source_word: עַל
  choice: на
  rationale: Предлог указывает на расположение умывальников на опорных конструкциях; естественный русский эквивалент — «на».
- source_word: וְאֶת ... וְאֶת
  choice: и
  rationale: Повторяющиеся союзы при показателях прямого дополнения связывают два однородных сообщения; по-русски связь естественно передаётся союзом «и».
