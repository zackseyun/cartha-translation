  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: ru
  text: А котлы, лопатки, вилки и всю принадлежавшую к ним утварь Хурам-Ави[a] изготовил для царя Соломона, для дома Яхве, из полированной бронзы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «Хурам-Ави»; возможно также: «Хурам, его отец». Здесь это сочетание, вероятнее всего, является именем или титулом мастера.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из начищенной бронзы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: котлы
  rationale: Слово обозначает котлы или иные ёмкости; в перечне храмовой утвари «котлы» — точный и естественный русский эквивалент.
- source_word: הַיָּעִים
  choice: лопатки
  rationale: Речь об орудиях для удаления золы или обращения с углями; «лопатки» естественно передаёт их назначение в храмовом контексте.
- source_word: הַמִּזְלָגוֹת
  choice: вилки
  rationale: Слово обозначает орудия с зубцами; нейтральное «вилки» сохраняет форму предмета, не уточняя без достаточных оснований его назначение.
- source_word: כָּל כְּלֵיהֶם
  choice: всю принадлежавшую к ним утварь
  rationale: Местоименный суффикс сохранён по смыслу, а широкое כְּלִי передано словом «утварь», подходящим для совокупности храмовых сосудов и орудий.
- source_word: חוּרָם אָבִיו
  choice: Хурам-Ави
  rationale: В данном контексте сочетание вероятнее всего служит именем или титулом мастера; слитное смысловое восприятие обозначено дефисом, а альтернативный буквальный разбор вынесен в примечание.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: для царя Соломона
  rationale: 'Предлог ל выражает отношение поручения или предназначения: изделия изготовлены для царя Соломона.'
- source_word: לְבֵית יְהוָה
  choice: для дома Яхве
  rationale: Сохранён буквальный и традиционно понятный образ «дома» как храма, а имя יהוה передано как «Яхве».
- source_word: נְחֹשֶׁת מָרוּק
  choice: из полированной бронзы
  rationale: В контексте храмового литья נְחֹשֶׁת естественно означает бронзу, а מָרוּק — полированную или начищенную поверхность.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Понимание חוּרָם אָבִיו
  choice: Хурам-Ави как имя или титул мастера
  alternative: Хурам, его отец
  rationale: Контекст перечисляет работу известного мастера; буквальный синтаксический разбор возможен, но создаёт неясную отсылку местоимения. Неопределённость сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Перечень передан ясно и без архаизмов; начальное «А» сохраняет связь стиха с предшествующим контекстом. Подлинная неоднозначность имени мастера и значения מָרוּק отмечена в сносках.
