lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: светильники
  rationale: מְנוֹרָה обозначает храмовый светильник на подставке; «светильники» естественно для современного русского языка и не требует транслитерации «меноры».
- source_word: וְנֵרֹתֵיהֶם
  choice: с их лампадами
  rationale: נֵר здесь означает отдельную лампаду светильника. Оборот «с их лампадами» ясно передаёт принадлежность и позволяет отличить лампады от самих светильников.
- source_word: לְבַעֲרָם
  choice: чтобы зажигать их
  rationale: 'Инфинитив с местоименным суффиксом выражает назначение: лампады должны были зажигать, чтобы они горели. Перевод сохраняет объектное значение суффикса и звучит естественно.'
- source_word: כַּמִּשְׁפָּט
  choice: как предписано
  rationale: В культовом контексте מִשְׁפָּט указывает на установленный порядок. «Как предписано» передаёт нормативный смысл без тяжеловесного канцеляризма.
- source_word: לִפְנֵי הַדְּבִיר
  choice: перед внутренним святилищем
  rationale: דְּבִיר обозначает внутреннее помещение храма. Формулировка сохраняет пространственный смысл и не подменяет исходное слово более истолковывающим традиционным названием.
- source_word: זָהָב סָגוּר
  choice: из чистого золота
  rationale: Сочетание обозначает золото высокого качества, очищенное от примесей. «Чистое золото» — ясная и принятая русская формулировка.
- source_word: וְאֶת
  choice: и
  rationale: Союз продолжает перечень храмовой утвари, а непереводимый отдельно показатель прямого дополнения учитывается синтаксически.
theological_decisions:
- issue: Значение הַדְּבִיר
  choice: внутреннее святилище
  alternative: Святое святых
  rationale: Исходное слово называет внутреннее храмовое помещение; основной текст сохраняет это пространственное обозначение, а традиционное отождествление приведено как допустимый вариант в примечании.
