  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: ru
  text: Он устроил двор священников и большой двор, а также двери для двора; их двери он обложил бронзой[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их двери». Форма местоименного суффикса — множественного числа; возможно, имеются в виду двери упомянутых дворов или соответствующих храмовых сооружений.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Или: «медью». Еврейское слово может обозначать как медь, так и бронзу, то есть медный сплав.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: устроил
  rationale: Глагол עשה имеет широкое значение «делать, создавать». В описании храмового комплекса «устроил» естественно передаёт сооружение и обустройство дворов, не уточняя способ работы.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: двор священников
  rationale: חָצֵר обозначает двор или внутренний двор; конструкция принадлежности прямо и естественно передаётся как «двор священников».
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: и большой двор
  rationale: В храмовом контексте עֲזָרָה означает двор или ограждённое пространство. Слово «двор» понятно современному читателю, а «большой» точно передаёт גְּדוֹלָה без искусственной архаизации.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: а также двери для двора
  rationale: דֶּלֶת обычно означает «дверь» или «створка», а не ворота; повтор слова далее в стихе поддерживает последовательный перевод «двери».
- source_word: וְדַלְתוֹתֵיהֶם
  choice: двери их
  rationale: Местоименный суффикс имеет форму третьего лица мужского рода множественного числа — буквально «их». Перевод сохраняет эту грамматическую особенность и возможную отсылку к ранее названным частям храмового комплекса, не заменяя её однозначным «его».
- source_word: צִפָּה
  choice: обложил
  rationale: В сочетании с названием металла צפה означает покрыть поверхность, облицевать или обложить металлом. «Обложил бронзой» — естественное и традиционное русское выражение для храмовых конструкций.
- source_word: נְחֹשֶׁת
  choice: бронзой
  rationale: נְחֹשֶׁת может обозначать медь или медный сплав; в описаниях храмовой утвари и конструкций «бронза» является уместным общим соответствием, при сохранении альтернативы в сноске.
