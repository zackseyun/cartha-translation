  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: ru
  text: На равнине Иордана царь отлил их в глинистой почве[a], между Суккотом и Цередой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте, 3 Царств 7:46, это место названо Царетаном. Здесь в Паралипоменон стоит форма «Цереда» — вероятно, вариант названия того же места.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: на равнине Иордана
  rationale: כִּכָּר обозначает округлую область, равнину или долину; в данном географическом контексте «равнина Иордана» естественно и точно передаёт топографический смысл.
- source_word: יְצָקָם
  choice: отлил их
  rationale: Глагол יצק здесь относится к изготовлению бронзовых предметов посредством литья; «отлил» ясно передаёт металлургический смысл и сохраняет местоименный объект во множественном числе.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное указывает в контексте на Соломона; русский определённый смысл передаётся без артикля.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: в формах из плотной глины
  rationale: Буквально выражение связано с толщиной или плотностью земли. По контексту литья оно, вероятно, обозначает плотную глинистую почву, в которой делали литейные формы; перевод передаёт практический смысл, не утверждая лишних технических подробностей.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: между Суккотом и Цередой
  rationale: Топонимы переданы транслитерацией формы Масоретского текста; направительный суффикс в צְרֵדָתָה не требует отдельного выражения после предлога «между».
