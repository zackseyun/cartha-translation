base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: ru
  text: 'Он сделал десять золотых светильников по установленному для них образцу[a] и поставил их в храмовом зале[b]: пять справа и пять слева[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по установленному для них порядку»; еврейское слово может обозначать предписание, установленный порядок или образец.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в храме», «в главном зале» или «в святилище»; еврейское слово обозначает собственно храмовое здание, а не весь храмовый комплекс.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пять справа и пять слева». В соответствии с ориентацией храма речь может идти соответственно о южной и северной сторонах.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Обычный повествовательный глагол עשה в породе qal; союз естественно передан русским повествовательным продолжением без начального «и».
- source_word: מְנֹרוֹת הַזָּהָב
  choice: золотых светильников
  rationale: מְנוֹרָה обозначает подставку для светильников, однако в русском библейском употреблении естественный и понятный эквивалент — «светильник»; הַזָּהָב передано качественным прилагательным «золотых».
- source_word: עֶשֶׂר
  choice: десять
  rationale: Прямое соответствие количественному числительному.
- source_word: כְּמִשְׁפָּטָם
  choice: по установленному для них образцу
  rationale: מִשְׁפָּט может означать установленное правило, предписание, порядок или нормативный образец. В контексте изготовления храмовой утвари формулировка сохраняет как идею заданной нормы, так и возможную связь с конструкцией.
- source_word: וַיִּתֵּן
  choice: и поставил
  rationale: נתן буквально означает «дать, положить, поместить»; для размещения храмовой утвари по-русски естественно «поставил».
- source_word: בַּהֵיכָל
  choice: в храмовом зале
  rationale: הֵיכָל здесь относится к самому храмовому зданию, особенно его главному помещению, а не ко всему храмовому комплексу.
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: пять справа и пять слева
  rationale: Сохранены буквальные пространственные обозначения «справа» и «слева» без толковательного преобразования в «на юге» и «на севере».
