base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: ru
  text: Под ним со всех сторон находились изображения волов[a], опоясывавшие его, — по десять на локоть[b]; они окружали Море двумя рядами. Эти изображения были отлиты вместе с ним как одно целое[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобия волов»; еврейское слово указывает на изображения животных, а не на живых волов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «десять на локоть», то есть, вероятно, по десять изображений на каждый локоть окружности.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «при его отливке»; изображения были частью той же литой конструкции.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: изображения волов
  rationale: דְּמוּת обозначает подобие, форму или изображение, поэтому речь идёт не о живых животных, а о декоративных рельефных фигурах. בָּקָר — собирательное обозначение крупного рогатого скота; «волы» естественно для храмовой утвари и согласуется с ближайшим контекстом.
- source_word: תַּחַת לוֹ
  choice: под ним
  rationale: Передаёт пространственное положение украшений под Морем или его выступающей частью без излишней конкретизации.
- source_word: סָבִיב סָבִיב
  choice: со всех сторон
  rationale: Повтор усиливает значение полного охвата; по-русски это естественно передаётся выражением «со всех сторон».
- source_word: סוֹבְבִים אֹתוֹ
  choice: опоясывавшие его
  rationale: Причастие описывает непрерывный декоративный пояс вокруг сосуда и сохраняет зрительный образ.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: по десять на локоть
  rationale: Сохраняет краткость и структуру еврейского выражения, обозначающего число фигур на единицу длины, не устраняя возможную неясность способа подсчёта.
- source_word: מַקִּיפִים אֶת הַיָּם סָבִיב
  choice: они окружали Море
  rationale: Явно называет храмовый сосуд и естественно передаёт повторяющийся мотив окружения. «Море» оформлено как традиционное название большого храмового резервуара.
- source_word: שְׁנַיִם טוּרִים
  choice: в два ряда
  rationale: טוּרִים означает ряды; предложная конструкция ясно описывает расположение фигур.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: были отлиты вместе с ним как одно целое
  rationale: В контексте металлообработки יצק означает литьё, а выражение בְּמֻצַקְתּוֹ указывает, что фигуры были сформированы при отливке самого Моря, а не прикреплены позднее.
