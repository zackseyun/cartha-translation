revisions:
- from: 'Он сделал десять умывальников[a] и поставил пять справа и пять слева, чтобы омывать в них: в них ополаскивали всё, что предназначалось для всесожжения[b]. А море предназначалось для омовения священников[c].'
  to: Он сделал десять умывальных сосудов[a] и поставил пять справа и пять слева, чтобы в них омывали; в них ополаскивали то, что относилось к всесожжению[b]. А море было для того, чтобы священники совершали омовения в нём[c].
