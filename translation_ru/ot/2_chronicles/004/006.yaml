review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы число сосудов, их размещение, различное назначение сосудов и «моря», а также повторное указание «в них». Однако «предназначалось для всесожжения» несколько сужает и переосмысляет эллиптическое מַעֲשֵׂה הָעוֹלָה как целевое назначение предметов. Формулировка «то, что относилось к всесожжению» сохраняет исходную широту. Конструкцию о море следует сформулировать так, чтобы ясно передать: именно священники омывались в нём.'
  naturalness: «Умывальники» в современном русском прежде всего вызывает образ бытового сантехнического устройства; «умывальные сосуды» точнее в храмовом и историческом контексте. В исходном тексте двоеточие после «чтобы омывать в них» синтаксически неуместно. «Чтобы священники совершали омовения в нём» естественно, однозначно и сохраняет умеренно возвышенный регистр.
  terminology: «Всесожжение» — установленный и уместный термин для עֹלָה. Название «море» следует сохранить как отличительное название большого резервуара. «Умывальные сосуды» передаёт כִּיּוֹרִים без неуместной бытовой окраски и без утверждения спорной точной формы предметов.
  issues:
