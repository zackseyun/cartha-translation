    issue: «Умывальники» имеет сильную современную бытовую/сантехническую окраску.
    rationale: Киоры были крупными храмовыми сосудами; нейтральное «умывальные сосуды» точнее обозначает их функцию и исторический характер.
  - severity: medium
    issue: После «чтобы омывать в них» поставлено двоеточие.
    rationale: Двоеточие не связывает целевую конструкцию с последующим самостоятельным сообщением и создаёт синтаксический сбой.
  - severity: medium
    issue: «Всё, что предназначалось для всесожжения» чрезмерно конкретизирует мַעֲשֵׂה הָעוֹלָה как предметы с целевым назначением.
    rationale: Еврейское выражение эллиптично; более широкое «то, что относилось к всесожжению» не устраняет эту неопределённость.
  - severity: medium
    issue: «Для омовения священников» может пониматься как омовение, совершаемое над священниками.
    rationale: В оригинале священники являются теми, кто моется в море; это следует выразить явно.
