base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: ru
  text: Он сделал десять умывальных сосудов[a] и поставил пять справа и пять слева, чтобы в них омывали; в них ополаскивали то, что относилось к всесожжению[b]. А море было для того, чтобы священники совершали омовения в нём[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умывальников»; традиционно: «умывальники».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дело всесожжения». Выражение эллиптично и может обозначать то, что было связано с приготовлением или совершением жертвы всесожжения.'
    reason: lexical_alternative
  - marker: c
    text: То есть большой бронзовый резервуар, называемый «морем», был предназначен для омовений священников.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: умывальников
  rationale: Обозначает большие сосуды для омовений при храмовом служении. «Умывальники» сохраняет культовую функцию предметов и понятно современному читателю; вариант «чаны» возможен, но менее точно выражает назначение.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: справа / слева
  rationale: Естественно и точно передаёт пространственное расположение без избыточного слова «сторона».
- source_word: לְרָחְצָה
  choice: чтобы омывать
  rationale: Инфинитив цели передан целевой конструкцией. Глагол «омыть/омывать» уместен в храмовом контексте и отличает действие от обычного бытового мытья.
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: всё, что предназначалось для всесожжения
  rationale: Буквально выражение означает «дело/работа всесожжения» и эллиптично указывает на то, что было связано с приготовлением жертвы всесожжения. Перевод сохраняет некоторую широту референции, не ограничивая её самовольно утварью или мясом.
- source_word: יָדִיחוּ
  choice: ополаскивали
  rationale: Форма Hiphil передаёт смывание или ополаскивание; имперфект в данном описании естественно понимается как обычное, повторявшееся действие.
- source_word: וְהַיָּם
  choice: А море
  rationale: Сохранено установленное название большого бронзового резервуара — «море»; союз передан как контраст с назначением десяти умывальников.
- source_word: לַכֹּהֲנִים
  choice: для омовения священников
  rationale: Дательный назначения передан естественной русской конструкцией; она ясно показывает, что море служило для омовения священников.
