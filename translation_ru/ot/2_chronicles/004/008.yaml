  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: ru
  text: 'Он сделал десять столов и поставил их в храме: пять с правой стороны и пять с левой. Ещё он сделал сто золотых чаш[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотых тазов»; возможно, имеются в виду чаши для кропления. Еврейское слово обозначает сосуды, использовавшиеся при храмовом служении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: столов
  rationale: Обычное значение существительного — «столы»; в описании храмовой утвари это точный и естественный вариант, не уточняющий без основания их назначение.
- source_word: וַיַּנַּח
  choice: поставил
  rationale: Глагол обозначает размещение предметов на определённом месте; «поставил» естественно передаёт конкретное действие в данном контексте.
- source_word: בַּהֵיכָל
  choice: в храме
  rationale: В контексте храмовой утвари הֵיכָל означает храмовое здание или святилище, а не царский дворец.
- source_word: מִיָּמִין
  choice: с правой стороны
  rationale: Передаёт явное пространственное указание текста и не вводит подразумеваемую ориентацию по сторонам света.
- source_word: מִשְּׂמֹאול
  choice: с левой
  rationale: Естественно образует пару с «с правой стороны» и сохраняет пространственное значение еврейского слова.
- source_word: מִזְרְקֵי זָהָב
  choice: золотых чаш
  rationale: מִזְרָק обозначает чашу или таз, употреблявшиеся при храмовом служении. «Золотые чаши» — ясный общий вариант; ритуальный оттенок и иные возможные соответствия отмечены в сноске.
- source_word: מֵאָה
  choice: сто
  rationale: Прямое и стилистически естественное воспроизведение количественного числительного.
