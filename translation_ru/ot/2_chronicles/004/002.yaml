  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: ru
  text: 'Он сделал литое Море: от края до края — десять локтей; оно было круглым со всех сторон, высотой пять локтей, и шнур в тридцать локтей охватывал его кругом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Море» — название большого резервуара среди храмовой утвари. Еврейский текст говорит о шнуре (линии) в тридцать локтей, которым измеряется окружность сосуда.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: Море
  rationale: Буквально «море»; в контексте храмовой утвари это название большого водного резервуара. Прописная буква показывает, что речь идёт о названном предмете, а не об обычном море.
- source_word: מוּצָק
  choice: литое
  rationale: Страдательное причастие указывает на предмет, изготовленный литьём; краткое русское определение естественно передаёт способ изготовления, не добавляя отсутствующего в тексте названия металла.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: десять локтей
  rationale: Сохранена древняя мера длины; направление измерения уточняется следующими словами «от края до края».
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: от края до края
  rationale: שָׂפָה означает «губа, край»; применительно к большому сосуду «край» звучит естественно и ясно.
- source_word: עָגוֹל סָבִיב
  choice: круглое со всех сторон
  rationale: Переданы и указание на круглую форму, и усилительное пространственное выражение, без архаичной тяжеловесности.
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: высотой оно было пять локтей
  rationale: Русская связочная конструкция естественно передаёт именное древнееврейское предложение.
- source_word: וְקָו
  choice: мерная верёвка
  rationale: קַו обозначает шнур или линию, используемые при измерении. Конкретный образ сохранён, а назначение предмета ясно из определения «мерная».
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: охватывала его по окружности
  rationale: Передано значение «обходить, окружать»; выражение естественно описывает измерение круглого предмета верёвкой.
