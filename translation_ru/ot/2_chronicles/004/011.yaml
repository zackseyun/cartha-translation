base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: ru
  text: 'Хурам[a] сделал котлы, лопатки и чаши. Так Хурам завершил работу, которую он делал для царя Соломона в Божьем доме:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Хурам в родственных отрывках и в традиции также передаётся как «Хирам».
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: Хурам
  rationale: В данном стихе масоретская огласовка основной формы соответствует имени «Хурам»; написание חירם отражено тем же русским именем без внесения текстовой неоднородности.
- source_word: הַסִּירוֹת
  choice: котлы
  rationale: Слово обозначает крупные сосуды; в контексте храмовых принадлежностей традиционное и конкретное «котлы» не уточняет их функцию сверх текста.
- source_word: הַיָּעִים
  choice: лопатки
  rationale: Речь об орудиях для удаления золы или перемещения материала у жертвенника; «лопатки» естественно передаёт название храмовой утвари.
- source_word: הַמִּזְרָקוֹת
  choice: чаши
  rationale: Слово обозначает ритуальные сосуды; «чаши» ясно и не добавляет спорного указания на конкретный способ их употребления.
- source_word: וַיְכַל
  choice: завершил
  rationale: Глагол в данной конструкции означает окончить, довести до завершения.
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה אֲשֶׁר עָשָׂה
  choice: завершил работу, которую он выполнял
  rationale: Формулировка естественно передаёт сочетание инфинитива с «работой» и повтор глагола עשה, избегая тяжеловесного буквального повтора «делать… которую сделал».
- source_word: בְּבֵית הָאֱלֹהִים
  choice: в Божьем доме
  rationale: Сохраняет обычное значение предлога בְּ «в» и образное библейское обозначение храма как Божьего дома.
theological_decisions:
- issue: Значение בְּ в выражении בְּבֵית הָאֱלֹהִים
  choice: в Божьем доме
  alternative: для Божьего дома
  rationale: Основное пространственное значение предлога — «в»; вариант «для» возможен по контексту заказа, но менее прямо передаёт еврейскую конструкцию.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранено обозначение храма как «Божьего дома», а не заменено словом «храм». Двоеточие оставлено, поскольку стих вводит последующий перечень.
