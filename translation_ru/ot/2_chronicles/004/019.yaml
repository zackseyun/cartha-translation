  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָנ֔וֹת וַ/עֲלֵי/הֶ֖ם לֶ֥חֶם הַ/פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: ru
  text: 'И Соломон сделал все принадлежности для Божьего дома: золотой жертвенник, столы, а на них — хлеб Присутствия[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «хлеб предложения»; буквально: «хлеб лица», то есть хлеб, находящийся перед Богом, в Его присутствии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычное значение глагола עשה — «делать, изготовлять»; в перечне храмовой утвари «сделал» звучит естественно и точно.
- source_word: כָּל הַכֵּלִים
  choice: все принадлежности
  rationale: כֵּלִים обозначает предметы и принадлежности, используемые при служении. Русское «принадлежности» естественнее здесь, чем «сосуды», поскольку далее перечислены также жертвенник и столы.
- source_word: אֲשֶׁר בֵּית הָאֱלֹהִים
  choice: для Божьего дома
  rationale: Краткая древнееврейская конструкция указывает на принадлежность или предназначение предметов для храма, а не только на их местонахождение. «Божий дом» сохраняет образ исходного выражения.
- source_word: מִזְבַּח הַזָּהָב
  choice: золотой жертвенник
  rationale: Естественная русская передача сочетания «жертвенник золота».
- source_word: הַשֻּׁלְחָנוֹת
  choice: столы
  rationale: Прямая передача формы множественного числа; речь о храмовых столах для священного хлеба.
- source_word: וַעֲלֵיהֶם
  choice: а на них
  rationale: Сохраняет пространственную связь хлеба со столами; союз «а» и тире естественно передают безглагольную конструкцию.
- source_word: לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  rationale: Передаёт культовое выражение через смысл Божьего присутствия и сохраняет его богословскую образность; традиционное название вынесено в примечание.
theological_decisions:
- issue: Передача בֵּית הָאֱלֹהִים
  choice: Божий дом
  alternative: храм Божий
  rationale: Буквальный образ «дома Бога» понятен по-русски и сохраняет древнееврейское храмовое обозначение без доктринального уточнения.
- issue: Передача לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  alternative: хлеб предложения
  rationale: Выбранный вариант прозрачно передаёт связь священного хлеба с пребыванием перед Богом, тогда как традиционный русский термин менее понятен современному читателю. Традиционная передача сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового контекста. Начальное «И» сохраняет повествовательную связь стиха; тире естественно восполняет отсутствующую в древнееврейском глагольную связку.
