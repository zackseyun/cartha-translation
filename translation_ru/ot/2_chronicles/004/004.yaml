base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: ru
  text: 'Оно стояло на двенадцати волах: три были обращены на север[a], три — на запад, три — на юг и три — на восток. Море находилось над ними, а задние части всех волов были обращены внутрь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три — лицом к северу… три — к морю». В данном перечислении сторон света выражение «к морю» означает «на запад».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: стояло
  rationale: Причастие qal от עמד здесь предикативно описывает положение Моря; русская личная форма естественно передаёт это состояние.
- source_word: בָּקָר
  choice: быках
  rationale: Слово обозначает двенадцать скульптурных изображений крупного рогатого скота; «быки» — естественное традиционное обозначение таких опор в данном храмовом описании.
- source_word: פֹנִים
  choice: были обращены
  rationale: Буквально связано с «лицом», но в этой конструкции указывает на пространственную ориентацию фигур.
- source_word: צָפוֹנָה
  choice: на север
  rationale: Направительный суффикс передаёт ориентацию к северу; по-русски естественно «обращены на север».
- source_word: יָמָּה
  choice: на запад
  rationale: Буквально «к морю», но в системе сторон света это обычное древнееврейское обозначение запада; буквальная образность отмечена в сноске.
- source_word: נֶגְבָּה
  choice: на юг
  rationale: В перечислении сторон света означает юг, а не собственно область Негев.
- source_word: מִזְרָחָה
  choice: на восток
  rationale: Стандартное указание восточного направления.
- source_word: הַיָּם
  choice: Море
  rationale: Это установленное в контексте название большого храмового резервуара; прописная буква показывает, что речь не о географическом море.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: находилось над ними
  rationale: Передаёт пространственное положение Моря над быками, не повторяя дословно уже использованное «стояло на».
- source_word: אֲחֹרֵיהֶם
  choice: задние части всех быков
  rationale: Буквально «их задние части»; добавление «быков» ясно обозначает референт местоимения и сохраняет нейтральный регистр.
- source_word: בָּיְתָה
  choice: были обращены внутрь
  rationale: Направительная форма означает ориентацию внутрь, то есть к центру под резервуаром.
