    text: 'Или: «медный жертвенник». Еврейское נְחֹשֶׁת может обозначать медь или медный сплав; в описаниях храмовой утвари традиционно переводится как «бронза».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol от עשה продолжает повествовательную последовательность; простое прошедшее время естественно передаёт её по-русски, а начальный союз можно не выражать.
- source_word: מִזְבַּח
  choice: жертвенник
  rationale: Устоявшееся и понятное русское обозначение сооружения для жертвоприношений.
- source_word: נְחֹשֶׁת
  choice: бронзовый
  rationale: В описаниях храмовой утвари слово обычно обозначает медь или медный сплав; «бронзовый» соответствует современной библейской и исторической терминологии, при сохранении варианта в сноске.
- source_word: עֶשְׂרִים אַמָּה
  choice: двадцать локтей
  rationale: Древняя мера длины сохранена без пересчёта, чтобы не создавать ложной точности и удержать исторический характер описания.
- source_word: אָרְכּוֹ / רָחְבּוֹ / קוֹמָתוֹ
  choice: в длину / в ширину / в высоту
  rationale: Идиоматичная русская конструкция для перечисления размеров точно передаёт существительные с местоименными суффиксами.
