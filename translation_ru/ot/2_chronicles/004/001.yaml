  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: ru
  text: 'Он сделал бронзовый жертвенник[a]: двадцать локтей в длину, двадцать локтей в ширину и десять локтей в высоту.'
