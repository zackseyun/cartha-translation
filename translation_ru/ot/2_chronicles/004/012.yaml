  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: ru
  text: два столба; две чашеобразные части[a] и две капители на вершинах столбов; две решётки[b] для покрытия двух чашеобразных частей капителей на вершинах столбов;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
