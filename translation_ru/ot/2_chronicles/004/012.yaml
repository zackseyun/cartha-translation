    reason: lexical_alternative
  - marker: b
    text: Или «сетки».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: столба
  rationale: Обычный и ясный русский архитектурный термин; речь идёт о двух храмовых столбах.
- source_word: גֻּלּוֹת
  choice: чашеобразные части
  rationale: Передаёт округлую, вероятно чашеобразную форму архитектурных деталей, не создавая ложного впечатления, будто речь идёт об отдельных сосудах; точная форма остаётся неясной.
- source_word: כֹּתָרוֹת
  choice: капители
  rationale: Точный современный архитектурный термин для украшенной верхней части столба.
- source_word: רֹאשׁ
  choice: вершинах
  rationale: В данном архитектурном контексте естественно обозначает верх столбов.
- source_word: שְּׂבָכוֹת
  choice: решётки
  rationale: Понятно передаёт плетёную или сетчатую декоративную конструкцию; возможный вариант «сетки» отмечен в сноске.
- source_word: לְכַסּוֹת
  choice: покрывавшие
  rationale: Передаёт назначение решёток естественной русской причастной конструкцией в рамках перечня.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: два / две
  rationale: Все повторения числительного сохранены, поскольку еврейский текст последовательно перечисляет храмовые детали.
