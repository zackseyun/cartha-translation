  text: А Море он поставил на юго-восточной стороне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «на правой стороне, к востоку, напротив юга». В древнееврейских пространственных обозначениях обычно предполагается ориентация лицом на восток; поэтому правая сторона соответствует югу, а указание «к востоку» вместе с этим обозначает юго-восточную сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: А
  rationale: Союз связывает сообщение о размещении Моря с предыдущим описанием; показатель прямого дополнения אֵת отдельно не переводится.
- source_word: הַיָּם
  choice: Море
  rationale: Так назван большой литой бронзовый резервуар храмового комплекса; прописная буква передаёт употребление слова как устойчивого наименования этого предмета.
- source_word: נָתַן
  choice: поставил
  rationale: Глагол естественно обозначает размещение предмета в определённом месте.
- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  choice: с юго-восточной стороны
  rationale: כָּתֵף в пространственном описании означает «сторона»; «правая» при обычной древнееврейской ориентации лицом на восток указывает на юг, а קֵדְמָה добавляет восточное направление. Совокупно выражение указывает на юго-восточную сторону.
- source_word: מִמּוּל נֶגְבָּה
  choice: к югу
  rationale: Передаёт направленность или расположение относительно юга естественным русским оборотом, не превращая выражение в неясное «напротив юга».
