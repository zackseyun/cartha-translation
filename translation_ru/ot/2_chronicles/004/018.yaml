  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: ru
  text: Соломон изготовил всю эту утварь в чрезвычайно большом количестве, ибо вес бронзы не был определён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вес бронзы не был установлен». Еврейский глагол может означать «исследовать», «выяснять» или «устанавливать»; в контексте это может означать, что из-за обилия бронзы её вес не подсчитывали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: изготовил
  rationale: Глагол עשה здесь обозначает изготовление храмовой утвари; «изготовил» естественно и точно передаёт ремесленный контекст.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: всю эту утварь
  rationale: כֵּלִים — общее обозначение предметов и принадлежностей; собирательное «утварь» уместно в контексте храмового оснащения.
- source_word: לָרֹב מְאֹד
  choice: в чрезвычайно большом количестве
  rationale: Фраза указывает на исключительное изобилие, а מְאֹד усиливает значение רֹב.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит пояснение к утверждению об огромном количестве; «ибо» сохраняет причинно-пояснительную связь и достоинство повествовательного регистра.
- source_word: לֹא נֶחְקַר
  choice: не поддавался определению
  rationale: Форма от חקר буквально связана с исследованием или установлением; в сочетании с весом выражение означает, что его не удалось либо не пытались точно установить. Основной текст естественно передаёт контекстуальный смысл, а примечание сохраняет более нейтральную альтернативу.
- source_word: מִשְׁקַל
  choice: вес
  rationale: Слово обозначает именно вес как измеряемую величину.
- source_word: הַנְּחֹשֶׁת
  choice: бронзы
  rationale: В описаниях храмовой утвари נְחֹשֶׁת обычно обозначает бронзу; это соответствует материалу перечисленных предметов.
