lexical_decisions:
- source_word: הַיָּם
  choice: Море
  rationale: Слово יָם буквально означает «море», но здесь служит названием большого литого храмового бассейна. Прописная буква сохраняет значение названия предмета и связь с еврейским словом.
- source_word: אֶחָד
  choice: одно
  rationale: Числительное непосредственно определяет «Море» и сохраняет перечневый стиль контекста.
- source_word: הַבָּקָר
  choice: быков
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; здесь имеются в виду двенадцать скульптурных опор. «Быки» естественно передаёт их облик, не предполагая, что речь идёт о тягловых кастрированных животных.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Прямое соответствие составному числительному.
- source_word: תַּחְתָּיו
  choice: под ним
  rationale: Местоименный суффикс мужского рода относится к слову «Море»; краткая русская формулировка естественно передаёт пространственное отношение.
- source_word: אֶת ... וְאֶת
  choice: отдельно не переводится
  rationale: אֶת обозначает прямые дополнения и в русском передаётся падежной формой и синтаксисом.
