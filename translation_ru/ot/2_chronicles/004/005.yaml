  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: ru
  text: Толщиной оно было в ладонь[a], а край его был сделан подобно краю чаши — как цветок лилии. Оно вмещало три тысячи батов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ладонь — древняя мера длины, примерно равная ширине четырёх пальцев.
    reason: cultural_note
  - marker: b
    text: Бат — древнееврейская мера объёма жидкостей. В параллельном описании, 3 Царств 7:26, указано две тысячи батов; возможно, там названа обычная рабочая вместимость, а здесь — полная, либо различие связано с текстовой традицией.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: толщина его
  rationale: Существительное обозначает толщину стенки литого бассейна; такой перевод точен и естественен в данном описании.
- source_word: טֶפַח
  choice: в ладонь
  rationale: Древнееврейская малая мера длины передана традиционным и понятным русским соответствием; пояснение дано в сноске.
- source_word: שְׂפָתוֹ
  choice: край
  rationale: Применительно к сосуду слово означает край или обод; «край» естественно сочетается и с большим бассейном, и с чашей.
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: был выделан, как край чаши
  rationale: Передаёт как сравнительную конструкцию, так и указание на искусно выполненную форму, не сводя выражение лишь к внешнему сходству.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: в виде цветка лилии
  rationale: Фраза образно уточняет форму края. Русская конструкция сохраняет связь и с краем чаши, и с цветком, не вводя ботанической конкретизации сверх текста.
- source_word: מַחֲזִיק ... יָכִיל
  choice: вмещало
  rationale: Причастие и личная форма вместе подчёркивают вместимость; единый русский глагол позволяет избежать неестественного повтора.
- source_word: בַּתִּים שְׁלֹשֶׁת אֲלָפִים
  choice: три тысячи батов
  rationale: Сохранены исходное число и древнееврейская единица жидкой меры; значение единицы поясняется в сноске.
theological_decisions:
- issue: Расхождение с 3 Царств 7:26 в указании вместимости
  choice: Сохранить чтение масоретского текста «три тысячи батов» и отметить параллельное чтение в сноске
  alternative: Согласовать число с 3 Царств 7:26 и перевести «две тысячи»
  rationale: WLC однозначно читает «три тысячи»; исправление основного текста по параллельному месту устранило бы реальное текстовое напряжение без рукописного основания в данном свидетельстве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис близок к еврейскому описанию, но устранены неестественные для русского повторы. Местоимение «оно» согласовано с подразумеваемым «море» — названием большого храмового бассейна из контекста.
