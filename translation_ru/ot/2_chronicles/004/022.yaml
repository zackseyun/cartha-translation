base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: ru
  text: Щипцы для светильников, чаши, чашечки и совки были из чистого золота. Вход в храм, его внутренние двери, ведущие в Святое святых, и двери храма, ведущие в святилище[a], были из золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в главный зал храма, находившийся перед Святым святых.
    reason: Уточнение значения הֵיכָל, которое здесь обозначает главное помещение храма, а не внутреннее Святое святых.
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: щипцы для светильников
  rationale: В перечне храмовой утвари слово обозначает приспособления для ухода за фитилями. Такой перевод понятнее современному читателю, чем редкое «щипцы для снятия нагара», и не вводит неподтверждённого значения «ножи».
- source_word: מִּזְרָקוֹת
  choice: чаши
  rationale: Слово обозначает храмовые сосуды, вероятно использовавшиеся в том числе для жертвенной крови. Нейтральное «чаши» сохраняет форму предмета без излишнего уточнения функции.
- source_word: כַּפּוֹת
  choice: чашечки
  rationale: Уменьшительная форма по-русски естественно отличает эти небольшие сосуды от предшествующих מִזְרָקוֹת, не навязывая более узкого назначения.
- source_word: מַּחְתּוֹת
  choice: совки
  rationale: Речь идёт о сосудах или приспособлениях для углей и огня. «Совки» соответствует храмовому инвентарю и не предполагает обязательно кадильного употребления.
- source_word: זָהָב סָגוּר
  choice: чистое золото
  rationale: Устойчивое сочетание указывает на золото высокого качества, очищенное или рафинированное; «чистое золото» — ясный и традиционно понятный русский эквивалент.
- source_word: פֶּתַח הַבַּיִת
  choice: вход в храм
  rationale: בַּיִת в данном контексте обозначает храм, а פֶּתַח — его вход или дверной проём. «Вход в храм» звучит естественно и сохраняет предметное значение.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: его внутренние двери
  rationale: Передаётся множественное число и противопоставление следующему комплекту дверей; местоимение сохраняет связь со входом храма.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: ведущие в Святое святых
  rationale: Предлог לְ здесь естественно выражает назначение или направление дверей. «Святое святых» точно сохраняет еврейскую превосходную конструкцию и привычно в русском библейском языке.
- source_word: וְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: и двери храма, ведущие в святилище
  rationale: הֵיכָל здесь обозначает главный зал храма в отличие от внутреннего Святого святых. Основной текст сохраняет привычное «святилище», а сноска уточняет пространственное значение.
- source_word: זָהָב
  choice: были золотыми
  rationale: Заключительное существительное выступает сказуемым о материале дверей; связка и творительный оттенок переданы естественной русской предикативной конструкцией.
theological_decisions:
- issue: Различение קֹדֶשׁ הַקֳּדָשִׁים и הֵיכָל
  choice: «Святое святых» для внутреннего помещения и «святилище» для главного зала
  alternative: Передать הֵיכָל как «храмовый зал»
  rationale: Текст различает два помещения. Перевод сохраняет это различие, а сноска не позволяет понять «святилище» как весь храм или как Святое святых.
translation_notes:
  register: Современный литературный русский с умеренно традиционной храмовой лексикой. Синтаксис сохраняет инвентарный характер еврейского перечня, но проясняет подразумеваемое направление дверей посредством «ведущие в». Маркер [a] помещён непосредственно после слова, требующего пояснения.
