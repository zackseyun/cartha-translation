base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: ru
  text: 'Прочие дела Иосии и проявления его верности[a], как написано в Законе Яхве:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его верные дела», «проявления его преданности» или «его милости». Еврейское слово может обозначать милость, преданность или верность обязательствам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: Прочие дела Иосии
  rationale: В царской итоговой формуле דְּבָרִים обозначает не только слова, но дела и события царствования; «прочие дела» естественно передаёт формулу и значение יֶתֶר.
- source_word: וַחֲסָדָיו
  choice: и дела его верности[a]
  rationale: חֶסֶד может выражать милость, преданность и верность обязательствам. В данном контексте речь, вероятно, о поступках Иосии, соответствовавших Закону; формулировка сохраняет смысл верности, не добавляя в основной текст слова «завет», которого здесь нет.
- source_word: כַּכָּתוּב
  choice: как написано
  rationale: Кратко и непосредственно передаёт сочетание сравнительного предлога с пассивным причастием.
- source_word: בְּתוֹרַת יְהוָה
  choice: в Законе Яхве
  rationale: Здесь תּוֹרָה указывает на авторитетный письменный Закон; личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Значение חֶסֶד применительно к Иосии
  choice: дела его верности
  alternative: его милости; его благочестивые дела; проявления его преданности
  rationale: Выбранный вариант удерживает идею деятельной преданности Богу и Закону, но не сужает многозначное חֶסֶד исключительно до доброты или благочестия. Сноска сохраняет реальные лексические альтернативы.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Двоеточие сохранено, поскольку стих представляет собой первую часть итоговой формулы, продолженной в следующем стихе.
