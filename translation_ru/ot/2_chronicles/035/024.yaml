base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: ru
  text: Его слуги сняли его с колесницы, пересадили его во вторую колесницу, которая была у него[a], и доставили в Иерусалим. Он умер и был похоронен в гробницах своих предков. Вся Иудея и Иерусалим оплакивали Иосию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в колесницу вторую, которая была у него»; вероятно, имеется в виду вторая, возможно запасная, колесница Иосии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: сняли его
  rationale: Порода hифиль указывает на перемещение; в данном контексте слуги снимают раненого царя с боевой колесницы.
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: Широкое значение слова охватывает царских слуг и сопровождающих; контекст не требует уточнять их должность.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: переложили
  rationale: Глагол означает помочь взойти или поместить для езды; применительно к раненому естественное русское выражение — «переложили в колесницу».
- source_word: רֶכֶב הַמִּשְׁנֶה אֲשֶׁר לוֹ
  choice: в другую его колесницу
  rationale: Выражение буквально обозначает «колесницу второго [порядка], которая была у него»; «другая его колесница» естественно передаёт противопоставление первой, не утверждая сверх текста, что она была запасной.
- source_word: וַיּוֹלִיכֻהוּ
  choice: доставили его
  rationale: Hифиль от הלך здесь обозначает транспортировку раненого к названному месту назначения.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: в гробницах своих предков
  rationale: «Предки» передаёт родовое и династическое значение אבות в погребальном контексте и звучит естественнее буквального «отцов».
- source_word: מִתְאַבְּלִים
  choice: оплакивали
  rationale: Причастная форма описывает продолжавшийся траур; русское несовершенное прошедшее сохраняет длительный характер действия.
