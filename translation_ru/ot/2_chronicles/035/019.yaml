  text: בִּ/שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לְ/מַלְכ֖וּת יֹאשִׁיָּ֑הוּ נַעֲשָׂ֖ה הַ/פֶּ֥סַח הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/019.yaml
  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: ru
  text: В восемнадцатый год царствования Иосии была совершена эта Пасха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эту Пасху праздновали»; букв.: «эта Пасха была сделана».'
    reason: 'Лексическая альтернатива: נַעֲשָׂה буквально означает «была сделана», а в данном контексте идиоматически обозначает совершение или празднование Пасхи.'
lexical_decisions:
- source_word: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: В восемнадцатый год
  rationale: Предлог בְּ с числительным и словом «год» образует обычное обозначение времени; русская порядковая конструкция естественно передаёт древнееврейскую датировку.
- source_word: לְמַלְכוּת יֹאשִׁיָּהוּ
  choice: царствования Иосии
  rationale: Сочетание לְ с מַלְכוּת указывает на период царской власти; родительная конструкция является естественной русской формулой датировки по годам правления.
- source_word: נַעֲשָׂה
  choice: была совершена
  rationale: Форма нифаля буквально означает «была сделана», но в сочетании с פֶּסַח речь идёт о совершении или праздновании Пасхи. «Была совершена» сохраняет пассивную форму и остаётся понятной в торжественном повествовательном контексте.
- source_word: הַפֶּסַח
  choice: Пасха
  rationale: Это установленное русское соответствие названию праздника פֶּסַח; добавление слова «праздник» отсутствует в исходном тексте.
- source_word: הַזֶּה
  choice: эта
  rationale: Указательное местоимение отсылает к конкретной Пасхе, описанной в предшествующем контексте.
