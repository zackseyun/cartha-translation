  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: ru
  text: 'Он сказал левитам, наставлявшим весь Израиль[a] и посвящённым Яхве: «Поставьте священный ковчег в доме[b], который построил Соломон, сын Давида, царь Израиля. Вам больше не нужно носить его на плечах[c]. Теперь служите Яхве, вашему Богу, и Его народу Израилю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «левитам, дававшим понимание всему Израилю»; возможно также: «левитам, наставленным для всего Израиля». Еврейская форма может обозначать как обладание пониманием или обученностью, так и наставление других.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть в храме, построенном Соломоном. Буквально: «в доме».'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «нет для вас ноши на плече». Речь идёт о переноске ковчега.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּבוֹנִים לְכָל־יִשְׂרָאֵל
  choice: наставлявшим весь Израиль
  rationale: Причастие от בין допускает значения понимания, обладания познанием и сообщения понимания. В контексте служения левитов наиболее вероятен деятельный смысл наставления народа; примечание сохраняет грамматико-лексическую неоднозначность.
- source_word: הַקְּדוֹשִׁים לַיהוָה
  choice: посвящённым Яхве
  rationale: Сочетание обозначает священный статус и принадлежность Яхве. «Посвящённым» естественно передаёт культовый смысл, не подразумевая нравственного совершенства.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: תְּנוּ אֶת־אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: Поставьте священный ковчег в доме
  rationale: Глагол נתן в данной конструкции означает помещение предмета на место. «Дом» сохраняет образное обозначение храма, а примечание разъясняет референт.
- source_word: אֲרוֹן הַקֹּדֶשׁ
  choice: священный ковчег
  rationale: Естественная русская передача выражения, характеризующего ковчег как святыню.
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: Вам больше не нужно носить его на плечах
  rationale: Контекстуально выражение говорит о переноске ковчега левитами. Русская формулировка ясно передаёт смысл; буквальный образ отмечен в сноске.
- source_word: עַתָּה עִבְדוּ
  choice: Теперь служите
  rationale: עבד охватывает служение Богу, включая храмовое служение, и подходит к двум последующим объектам — Богу и Его народу.
- source_word: וְאֶת־עַמּוֹ יִשְׂרָאֵל
  choice: и Его народу Израилю
  rationale: Формулировка сохраняет принадлежность Израиля Яхве и естественно звучит как второй объект глагола «служите».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Роль левитов в הַמְּבוֹנִים
  choice: левиты, наставлявшие весь Израиль
  alternative: левиты, обладавшие пониманием; левиты, наставленные для всего Израиля
  rationale: Форма допускает как состояние понимания/обученности, так и сообщение понимания. Контекст Хроник поддерживает наставническую роль левитов, но альтернативы сохранены в примечании.
- issue: Святость левитов в הַקְּדוֹשִׁים לַיהוָה
  choice: посвящённые Яхве
  alternative: святые для Яхве
  rationale: Выбрана формулировка, подчёркивающая культовое отделение и принадлежность Богу, без добавления конфессионального смысла.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Синтаксис умеренно формальный; культовые термины переданы привычно и без архаизации. Все сноски обозначены в основном тексте.
