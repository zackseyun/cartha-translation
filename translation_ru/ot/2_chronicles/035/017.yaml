  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: ru
  text: И присутствовавшие израильтяне отпраздновали в то время Пасху и Праздник пресных хлебов, длившийся семь дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: совершили / праздновали
  rationale: Глагол עשה буквально означает «делать, совершать», но с названиями священных праздников передаёт их соблюдение или празднование. По-русски сочетание «совершили Пасху» сохраняет культовый оттенок, а «праздновали праздник» естественно передаёт продолжительное соблюдение семидневного праздника.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Устойчивое современное обозначение народа Израиля; буквальное «сыны Израиля» здесь звучало бы архаично.
- source_word: הַנִּמְצְאִים
  choice: находившиеся там
  rationale: Причастие от מצא в данном контексте обозначает присутствовавших на месте людей, а не тех, кого буквально «нашли».
- source_word: הַפֶּסַח
  choice: Пасху
  rationale: Здесь слово охватывает пасхальное установление и его совершение; «Пасха» — традиционное и понятное русское соответствие, не сводящее значение только к жертвенному животному.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Прямо передаёт временное значение выражения, не добавляя отсутствующей в тексте идеи особо назначенного срока.
- source_word: חַג הַמַּצּוֹת
  choice: праздник Пресных хлебов
  rationale: Передаёт חַג как праздник и сохраняет узнаваемое библейское название; прописные буквы отмечают название установленного праздника.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: В русском языке при глаголе «праздновали» форма без предлога естественно выражает продолжительность.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. Перестройка второй части устраняет неестественное русское управление, сохраняя общий еврейский глагол עשה по смыслу. Синтаксис ясно различает совершение Пасхи и семидневное празднование праздника Пресных хлебов.
