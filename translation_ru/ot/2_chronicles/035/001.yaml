  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: ru
  text: Иосия отпраздновал в Иерусалиме Пасху в честь Яхве, и в четырнадцатый день первого месяца они закололи пасхальную жертву[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пасху»; здесь это слово обозначает пасхальное жертвенное животное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: отпраздновал
  rationale: Буквально глагол означает «сделал, совершил», но с פֶּסַח он идиоматически обозначает соблюдение или празднование Пасхи. «Отпраздновал» естественно передаёт этот смысл по-русски.
- source_word: פֶּסַח
  choice: Пасху
  rationale: Первое употребление обозначает пасхальное празднование в целом; «Пасха» — общепринятое и контекстуально точное соответствие.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל выражает направленность или посвящение Яхве. Такой оборот естественен по-русски и передаёт религиозную посвящённость праздника, не заменяя личное имя титулом.
- source_word: בִירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямое обозначение места действия.
- source_word: וַיִּשְׁחֲטוּ
  choice: они закололи
  rationale: «Закололи» точно передаёт ритуальный убой, не сводя действие к общему «убили» и не добавляя более широкого значения «принесли в жертву».
- source_word: הַפֶּסַח
  choice: пасхальную жертву
  rationale: Во втором употреблении существительное метонимически обозначает пасхальное жертвенное животное, которое закалывают. Перевод проясняет конкретный референт, а примечание сохраняет буквальную форму оригинала.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: в четырнадцатый день первого месяца
  rationale: Естественная русская календарная формулировка, точно передающая еврейское указание даты.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно употреблён тетраграмматон; форма «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение второго употребления פֶּסַח
  choice: пасхальная жертва
  alternative: Пасха
  rationale: Глагол «закололи» показывает, что здесь слово относится к жертвенному животному. При этом примечание сохраняет метонимическую краткость еврейского текста и не уточняет животное как ягнёнка, поскольку этого слова в стихе нет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок обстоятельств слегка перестроен ради естественности; связь обеих частей и календарная точность сохранены.
