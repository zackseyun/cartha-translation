source:
  edition: WLC
  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: ru
  text: Иосия предоставил народу[a] — всем присутствовавшим — из мелкого скота тридцать тысяч ягнят и козлят, всех для пасхальных жертв[b], а также три тысячи голов крупного скота. Всё это было из имущества царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам народа»; возможно также: «простому народу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для пасх»; множественное число, вероятно, собирательно обозначает пасхальных животных или жертвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: выделил
  rationale: Порода hифиль от רום в данном контексте означает предоставить или пожертвовать из собственных средств. «Выделил» естественно передаёт царское обеспечение праздника, не утверждая, что Иосия лично совершил жертвоприношение.
- source_word: לִבְנֵי הָעָם
  choice: народу
  rationale: Буквально «сынам народа»; здесь выражение обозначает участников праздника из народа, вероятно в отличие от священников и левитов. Буквальный русский оборот был бы неестественным, поэтому возможный оттенок отмечен в сноске.
- source_word: צֹאן
  choice: из мелкого скота
  rationale: Собирательное צֹאן охватывает овец и коз; «мелкий скот» точно передаёт категорию, которая далее уточняется словами «ягнята и козлята».
- source_word: כְּבָשִׂים וּבְנֵי עִזִּים
  choice: ягнят и козлят
  rationale: כְּבָשִׂים обозначает ягнят или овец, а буквальное «сыновья коз» — молодых коз, то есть козлят. Такой перевод ясен и естественен по-русски.
- source_word: הַכֹּל לַפְּסָחִים
  choice: всех их для пасхальных жертв
  rationale: Множественное פְּסָחִים здесь, вероятнее всего, собирательно обозначает пасхальных животных или жертвы. Формулировка сохраняет указание, что весь мелкий скот предназначался для Пасхи.
- source_word: לְכָל הַנִּמְצָא
  choice: для всех присутствовавших
  rationale: Причастие нифаль от מצא в этом контексте относится ко всем собравшимся и присутствовавшим на празднике.
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: числом тридцать тысяч
  rationale: Оборот передаёт общее число перечисленных ягнят и козлят и сохраняет несколько торжественный повествовательный строй оригинала.
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: и три тысячи голов крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; счётное слово «голов» делает русский перевод естественным, не уточняя пол или назначение животных.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: Всё это было из имущества царя
  rationale: רְכוּשׁ означает имущество, собственность или достояние. Перевод показывает, что животные были предоставлены из царских ресурсов.
theological_decisions:
- issue: Значение множественного числа פְּסָחִים
  choice: пасхальные жертвы
  alternative: пасхи; пасхальные животные
  rationale: Контекст перечисления животных указывает на жертвенные приношения для празднования Пасхи. Сноска сохраняет формальную особенность еврейского множественного числа и не сужает его исключительно до одного вида животных.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Синтаксис близок к еврейской последовательности, но пунктуация проясняет, что число тридцать тысяч относится к ягнятам и козлятам, а три тысячи — к крупному скоту.
