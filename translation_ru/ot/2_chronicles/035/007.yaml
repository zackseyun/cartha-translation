  rationale: Перестроен порядок слов, чтобы недвусмысленно связать «тридцать тысяч» с ягнятами и козлятами, а «всем присутствовавшим» — с адресатами предоставления. «Выделил» заменено на более естественное в данном контексте «предоставил». Значение, регистр, терминология и оба сносочных якоря сохранены.
