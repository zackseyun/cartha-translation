  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: ru
  text: Они закололи пасхальных жертв[a], а священники кропили кровью, принимая её из их рук[b]; левиты же снимали шкуры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасхальных животных». Еврейское слово здесь обозначает пасхальную жертву, то есть животное, закалываемое на Пасху.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из их руки». По контексту кровь передавали священникам те, кто закалывал жертв.'
    reason: clarification
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: закололи
  rationale: Глагол שׁחט обозначает заклание животных, особенно в жертвенном контексте; «закололи» сохраняет обрядовый смысл и звучит естественно по-русски.
- source_word: הַפָּסַח
  choice: пасхальных жертв
  rationale: Здесь פֶּסַח обозначает пасхальных жертвенных животных как совокупность; множественное число согласуется с последующим снятием шкур и не сужает значение только до ягнят.
- source_word: וַיִּזְרְקוּ
  choice: кропили кровью
  rationale: В жертвенном контексте זרק — установленный термин нанесения крови на жертвенник посредством броска или окропления. «Кропили кровью» передаёт обрядовое действие без излишней бытовой окраски.
- source_word: מִיָּדָם
  choice: которую получали из их рук
  rationale: Буквально «из их руки»; местоимение относится к закалывавшим животных. Развёрнутая передача проясняет, что священники принимали у них кровь, не устраняя неоднозначность личности исполнителей.
- source_word: מַפְשִׁיטִים
  choice: снимали шкуры
  rationale: Причастие פשט в данном контексте означает снятие шкур с заколотых животных; несовершенный вид передаёт сопутствующее, продолжавшееся действие.
