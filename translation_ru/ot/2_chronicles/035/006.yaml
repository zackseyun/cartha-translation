base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: ru
  text: Заколите пасхальную жертву[a], освятитесь и приготовьте для своих братьев, чтобы совершить это согласно слову Яхве, данному через Моисея[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пасху». Здесь еврейское слово обозначает пасхальную жертву, то есть предназначенное для заклания животное.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Моисея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: Заколите
  rationale: Глагол שׁחט обозначает заклание животного, особенно в жертвенном контексте; «заколите» сохраняет обрядовый смысл и звучит естественно в библейском повествовании.
- source_word: הַפָּסַח
  choice: пасхальную жертву
  rationale: Здесь термин обозначает пасхальное жертвенное животное, которое надлежит заколоть. «Пасхальная жертва» точнее, чем «пасхальный ягнёнок», поскольку в ближайшем контексте упомянуты также козлята.
- source_word: וְהִתְקַדְּשׁוּ
  choice: освятитесь
  rationale: Возвратная форма указывает на ритуальное приготовление к священному служению; «освятитесь» кратко передаёт как возвратность, так и сакральный характер действия.
- source_word: וְהָכִינוּ
  choice: приготовьте всё
  rationale: В еврейском тексте объект не назван. Русское «приготовьте всё» естественно передаёт подразумеваемые приготовления, не ограничивая их только одной жертвой.
- source_word: לַאֲחֵיכֶם
  choice: для своих братьев
  rationale: Буквально употреблено мужское множественное «ваших братьев»; в контексте это собратья-израильтяне, которым левиты помогают совершить Пасху.
- source_word: לַעֲשׂוֹת
  choice: чтобы исполнить
  rationale: Инфинитив עשה связывает приготовления с исполнением предписанного. «Исполнить» в русском языке естественно сочетается со «словом» как властным повелением.
- source_word: כִּדְבַר יְהוָה
  choice: слово Яхве
  rationale: דבר здесь означает данное Богом предписание, однако «слово» сохраняет форму еврейского выражения и его властный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: בְּיַד מֹשֶׁה
  choice: переданное через Моисея
  rationale: Буквально «рукой Моисея» — устойчивое еврейское обозначение посредничества. Смысл идиомы ясно и естественно выражен по-русски.
theological_decisions:
- issue: Объём значения לַאֲחֵיכֶם
  choice: для своих братьев
  alternative: для своих соплеменников
  rationale: Сохранено буквальное родственное обозначение, хотя по контексту оно охватывает собратьев по народу и завету.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В основном тексте сохранено личное имя Бога, непосредственно присутствующее в еврейском источнике.
- issue: Связь инфинитива לַעֲשׂוֹת с участниками действия
  choice: чтобы исполнить слово Яхве
  alternative: чтобы они исполнили слово Яхве
  rationale: Еврейская конструкция не выражает подлежащее инфинитива явно. Формулировка без местоимения не закрепляет однозначно, относится ли исполнение прежде всего к левитам или к их братьям.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной обрядовой лексикой. Синтаксис сделан плавным, при этом сохранены последовательность повелений и неопределённость подлежащего при «исполнить».
