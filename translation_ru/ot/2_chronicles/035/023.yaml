lexical_decisions:
- source_word: וַיֹּרוּ
  choice: поразили
  rationale: Глагол ירה в породе хифиль в военном контексте означает стрельбу; по-русски сочетание «стрелки поразили» естественно передаёт успешный выстрел, не добавляя указания на конкретное оружие.
- source_word: הַיֹּרִים
  choice: стрелки
  rationale: Причастие буквально обозначает стреляющих. «Стрелки» сохраняет более широкое значение исходного слова, тогда как «лучники» конкретизировало бы оружие, прямо здесь не названное.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: царя Иосию
  rationale: Предлог ל при глаголе стрельбы обозначает цель; в естественном русском это передано прямым дополнением.
- source_word: הַעֲבִירוּנִי
  choice: Уведите меня
  rationale: Каузативная форма עבר означает переместить кого-либо, удалить с места. «Уведите меня» естественно в прямой речи и не предполагает непременно, что царя несли.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину приказа; современное «потому что» ясно и естественно передаёт эту связь.
- source_word: הָחֳלֵיתִי
  choice: я тяжело ранен
  rationale: חלה обычно связано с болезнью, слабостью или тяжёлым состоянием, однако после попадания в бою контекст указывает на ранение.
- source_word: מְאֹד
  choice: тяжело
  rationale: Интенсивность מְאֹד естественно выражается по-русски устойчивым сочетанием «тяжело ранен».
