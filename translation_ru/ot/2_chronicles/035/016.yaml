  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: ru
  text: В тот день всё служение Яхве было приведено в порядок, чтобы совершить Пасху и вознести всесожжения на жертвеннике Яхве, согласно повелению царя Иосии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: было приведено в порядок
  rationale: Нифаль от כון выражает состояние готовности или надлежащего устройства; этот вариант сохраняет результативно-пассивный оттенок и естественно звучит по-русски.
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: всё служение Яхве
  rationale: В храмовом контексте עֲבוֹדָה обозначает богослужебное служение или связанные с ним работы; «служение» передаёт культовый смысл без неоправданного сужения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямой и естественный русский эквивалент временного оборота.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: совершили Пасху
  rationale: Буквально «сделать Пасху» означает исполнить пасхальный обряд; «совершить Пасху» сохраняет ритуальный смысл и достойный современный регистр.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: и вознесли всесожжения
  rationale: Это обычное жертвенное выражение с Hiphil עלה; «вознести всесожжения» точно и естественно передаёт принесение жертв, полностью сжигаемых на жертвеннике.
- source_word: עַל מִזְבַּח יְהוָה
  choice: на жертвеннике Яхве
  rationale: Сохраняет прямое пространственное и принадлежностное значение еврейского оборота.
- source_word: כְּמִצְוַת
  choice: согласно повелению
  rationale: Здесь מִצְוָה относится к конкретному распоряжению царя; «повеление» соответствует контексту и регистру.
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: царя Иосии
  rationale: Естественная русская форма титула и имени после существительного «повеление».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Отнесение повеления в заключительной фразе
  choice: повеление царя Иосии
  alternative: Божья заповедь, переданная царём Иосией
  rationale: Грамматически הַמֶּלֶךְ יֹאשִׁיָּהוּ зависит от מִצְוַת и прямо называет царя Иосию источником данного распоряжения; не следует превращать эту фразу в отдельное утверждение о происхождении заповеди.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Синтаксис слегка перестроен после двоеточия, чтобы естественно выразить цель и её фактическое исполнение в контексте, не меняя последовательности действий.
