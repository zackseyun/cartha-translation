base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: ru
  text: Иеремия оплакал Иосию, и все певцы и певицы доныне вспоминают Иосию в своих плачах. Их установили как обычай в Израиле; и вот, они записаны в «Плачах»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «записаны среди плачей», если речь идёт не о сборнике под названием «Плачи», а о плачах вообще.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: оплакал
  rationale: Глагол קונן обозначает исполнение или произнесение погребального плача. «Оплакал» естественно звучит по-русски и не уточняет без достаточных оснований, сочинил ли Иеремия плач или исполнил его.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: Иосию
  rationale: При русском глаголе «оплакать» объект естественно выражается винительным падежом; значение еврейского предлога передано конструкцией глагола.
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: певцы и певицы
  rationale: Еврейский текст прямо различает певцов мужского и женского пола; перевод сохраняет это различие и не смешивает שׁרים с созвучным словом «князья».
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: доныне вспоминают
  rationale: Буквально «говорят ... до сего дня». Настоящее время передаёт продолжающийся до времени повествователя обычай, а «вспоминают ... в плачах» естественно выражает контекст песенного поминовения, не утверждая прямо, что глагол значит «поют».
- source_word: בְּקִינוֹתֵיהֶם
  choice: в своих плачах
  rationale: קִינוֹת — траурные плачи или погребальные песни. «Плачи» сохраняет жанровое значение и высокий, но понятный регистр.
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: Эти плачи сделали установлением в Израиле
  rationale: Местоимение, вероятнее всего, относится к плачам. חֹק может означать установленное предписание или закреплённый обычай; «установление» сохраняет эту широту лучше, чем более узкое «закон».
- source_word: וְהִנָּם
  choice: и вот, они
  rationale: «И вот» сохраняет указательную и акцентирующую функцию הִנֵּה и соответствует возвышенному повествовательному стилю.
- source_word: כְּתוּבִים עַל הַקִּינוֹת
  choice: записаны в «Плачах»
  rationale: Фраза может указывать на известный сборник плачей; кавычки сигнализируют название, а альтернативное родовое понимание сохранено в сноске.
