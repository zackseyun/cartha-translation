    issue: Неудачная передача וַיִּתְּנוּם לְחֹק
    rationale: 'Фраза «Эти плачи сделали установлением в Израиле» грамматически приписывает действие плачам. Еврейское местоимение -ם является дополнением («их»), а субъект действия не назван. Следует сохранить плачи как объект: «Их установили как обычай в Израиле».'
  revised_text: Иеремия оплакал Иосию, и все певцы и певицы доныне вспоминают Иосию в своих плачах. Их установили как обычай в Израиле; и вот, они записаны в «Плачах»[a].
