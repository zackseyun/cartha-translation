  text: ו/כונניהו וּ/שְׁמַֽעְיָ֨הוּ וּ/נְתַנְאֵ֜ל אֶחָ֗י/ו וַ/חֲשַׁבְיָ֧הוּ וִ/יעִיאֵ֛ל וְ/יוֹזָבָ֖ד שָׂרֵ֣י הַ/לְוִיִּ֑ם הֵרִ֨ימוּ לַ/לְוִיִּ֤ם לַ/פְּסָחִים֙ חֲמֵ֣שֶׁת אֲלָפִ֔ים וּ/בָקָ֖ר חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: ru
  text: Хонания, Шемаия и Нетанел, его братья, а также Хашавия, Иеиел и Иозавад, начальники левитов, пожертвовали левитам для пасхальных жертв[a] пять тысяч голов мелкого скота[b] и пятьсот голов крупного скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для Пасх»; вероятно, имеются в виду животные, предназначенные для пасхальных жертвоприношений.'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «голов мелкого скота» восполнены по смыслу. В еврейском тексте: «пять тысяч, и крупного скота — пятьсот».'
    reason: textual_clarity
lexical_decisions:
- source_word: כונניהו
  choice: Хонания
  rationale: Личное имя передано в форме, укоренившейся в русской библейской традиции; конечный теофорный элемент -יהו не развёрнут в отдельный слог.
- source_word: שְׁמַעְיָהוּ
  choice: Шемаия
  rationale: Транслитерация еврейского личного имени в естественной для русского библейского текста форме.
- source_word: נְתַנְאֵל
  choice: Нетанел
  rationale: Передаёт именно еврейскую форму имени, не заменяя её новозаветной формой «Нафанаил».
- source_word: אֶחָיו
  choice: его братья
  rationale: Сохранено прямое значение родственного термина и неоднозначность местоименного отнесения, присутствующая в еврейском синтаксисе.
- source_word: חֲשַׁבְיָהוּ
  choice: Хашавия
  rationale: Транслитерация личного имени с сохранением начального ח через традиционное русское «х».
- source_word: יעיאל
  choice: Иеиел
  rationale: Русская передача еврейского личного имени без смыслового перевода.
- source_word: יוֹזָבָד
  choice: Иозавад
  rationale: Устоявшаяся русская библейская форма имени, близкая к еврейскому звучанию.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: начальники левитов
  rationale: Передаёт официальный руководящий статус שׂרים и звучит естественно в современном русском языке.
- source_word: הֵרִימוּ
  choice: пожертвовали
  rationale: В данном контексте Hiphil от רום означает внесение дара или пожертвования, а не буквальное «подняли».
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Дательный падеж ясно обозначает получателей пожертвования.
- source_word: לַפְּסָחִים
  choice: для пасхальных жертв
  rationale: Множественное число פְּסָחִים здесь обозначает животных, предназначенных для совершения Пасхи; перевод не сужает значение до одних ягнят.
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: пять тысяч голов мелкого скота и пятьсот голов крупного скота
  rationale: Перед «пять тысяч» в еврейском тексте подразумевается наименование ранее упомянутого мелкого скота, тогда как בָקָר прямо обозначает крупный рогатый скот. Русский перевод восполняет эллипсис для ясности и не объединяет обе цифры в одно количество крупного скота.
theological_decisions:
- issue: Что обозначает множественное число פְּסָחִים
  choice: пасхальные жертвы
  alternative: Пасхи; пасхальные животные
  rationale: Контекст распределения жертвенных животных указывает на жертвоприношения для празднования Пасхи, но перевод не уточняет сверх текста вид каждого животного.
- issue: Не названный после числа 5000 вид животных
  choice: восполнить как «голов мелкого скота» с примечанием
  alternative: оставить только «пять тысяч» или отнести обе цифры к крупному скоту
  rationale: Сопоставление с בָקָר «крупный скот» и ближайший контекст стиха 7 показывают эллиптическое противопоставление мелкого и крупного скота. Примечание делает восполнение прозрачным.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена транслитерированы последовательно; административный и культовый контекст передан без архаического буквального калькирования. Союз «а также» разграничивает две группы названных лиц, не устраняя неоднозначности оборота «его братья».
