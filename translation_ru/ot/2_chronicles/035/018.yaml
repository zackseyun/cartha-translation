  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: ru
  text: Такой Пасхи не совершали в Израиле со дней пророка Самуила[a], и ни один из царей Израиля не совершал такой Пасхи, какую совершил Иосия вместе со священниками, левитами, всей Иудеей, присутствовавшими израильтянами[b] и жителями Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подобной Пасхи не праздновали в Израиле со дней пророка Самуила».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Израилем, находившимся [там]», то есть теми израильтянами, которые присутствовали на празднике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה
  choice: не совершали / не совершал / совершил
  rationale: В сочетании с פֶסַח глагол עשה означает праздновать или соблюдать Пасху. «Совершать Пасху» — естественное и достойное русское выражение, охватывающее весь обряд и праздник.
- source_word: פֶסַח
  choice: Пасха
  rationale: Здесь слово обозначает пасхальное празднование в целом, а не только жертву; традиционное русское «Пасха» сохраняет эту широту.
- source_word: כָּמֹהוּ / כַּפֶּסַח
  choice: такой Пасхи / такой Пасхи, какую
  rationale: Сравнение относится к Пасхе Иосии. Русская конструкция передаёт сравнение естественно, не добавляя основания для её уникальности.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: со дней пророка Самуила
  rationale: מִן с «днями» указывает исходную точку ретроспективного сравнения; «со дней» точно и идиоматично.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא
  choice: и ни один из царей Израиля не
  rationale: Всеобщая группа под отрицанием по-русски естественно передаётся конструкцией «ни один ... не».
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: вместе со священниками, левитами
  rationale: Перечисленные группы выступают участниками Пасхи Иосии. «Вместе с» ясно передаёт эту связь, подразумеваемую еврейским рядом с союзом וְ.
- source_word: וְכָל יְהוּדָה
  choice: всей Иудеей
  rationale: Сохраняется коллективное обозначение народа/области и всеобщность כָּל.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: присутствовавшими израильтянами
  rationale: Буквально — «Израилем, который находился [там]». Выбор естественно выражает коллективный смысл и относит определение к тем из Израиля, кто присутствовал на празднике.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: и жителями Иерусалима
  rationale: Обычное русское соответствие причастному обозначению постоянных жителей города.
theological_decisions:
- issue: Историческое сравнение с прежними празднованиями Пасхи
  choice: Сохранено прямое утверждение, что со дней Самуила такой Пасхи не совершали, без пояснения, в чём именно состояло её превосходство.
  alternative: Понять это как абсолютное отрицание любого сопоставимого празднования или явно назвать сравнение качественным и гиперболическим.
  rationale: Еврейский текст утверждает уникальность Пасхи Иосии, но не раскрывает точный критерий сравнения. Перевод не должен ни ослаблять утверждение, ни вводить гармонизирующее объяснение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён лишь настолько, чтобы длинное перечисление оставалось ясным; повтор «Пасхи» сохранён ради смысловой точности.
