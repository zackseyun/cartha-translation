base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: ru
  text: И служение было подготовлено[a]; священники стояли на своих местах[b], а левиты — по своим чередам[c], согласно повелению царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «было устроено»; «было приведено в порядок».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на месте своего стояния», то есть на назначенных им местах.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по своим отделениям»; то есть по установленным служебным группам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: было устроено
  rationale: Форма от כון передаёт приведение в готовность и надлежащий порядок. «Было устроено» естественно выражает оба оттенка в контексте пасхального служения.
- source_word: הָעֲבוֹדָה
  choice: служение
  rationale: В храмовом контексте עֲבוֹדָה обозначает священное служение, а не работу вообще.
- source_word: וַיַּעַמְדוּ ... עַל עָמְדָם
  choice: заняли свои места
  rationale: Русское выражение естественно передаёт буквальное «встали на месте своего стояния», то есть на назначенных местах.
- source_word: הַלְוִיִּם עַל מַחְלְקוֹתָם
  choice: левиты расположились по своим отделениям
  rationale: מַחְלְקוֹת обозначает установленные служебные группы или череды; формулировка сохраняет организационный смысл еврейского текста.
- source_word: כְּמִצְוַת הַמֶּלֶךְ
  choice: согласно повелению царя
  rationale: Речь идёт о конкретном распоряжении царя; «повеление» соответствует достоинству повествовательного регистра.
theological_decisions:
- issue: Культовое значение עֲבוֹדָה
  choice: служение
  alternative: работа; обрядовое служение
  rationale: «Служение» сохраняет храмовый смысл без сужения до отдельного обряда и без привнесения поздней конфессиональной терминологии.
- issue: Организация священников и левитов
  choice: заняли свои места ... расположились по своим отделениям
  alternative: стояли на своих местах ... по своим чередам
  rationale: Выбранный вариант ясно передаёт установленный порядок служения, не добавляя сведений, отсутствующих в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис сохраняет последовательность еврейского текста, но избегает неестественных буквальных оборотов.
