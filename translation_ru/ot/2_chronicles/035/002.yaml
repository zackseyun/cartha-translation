base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: ru
  text: Он назначил священников на их места служения[a] и укрепил их[b] для служения в доме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по их сменам», «на их посты»; букв.: «над их дежурствами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ободрил их», «поддержал их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: расставил
  rationale: Порода hифиль глагола עמד означает «поставить, расположить на назначенном месте». «Расставил» естественно передаёт организацию священников для храмовой службы.
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Обычный русский эквивалент; определённость ясна из контекста.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: по их местам служения
  rationale: מִשְׁמָרוֹת может обозначать смены, посты, установленные обязанности или места несения службы. Выбранная формулировка сохраняет конкретный образ назначенных мест и подходит к храмовому контексту.
- source_word: וַיְחַזְּקֵם
  choice: и укрепил их
  rationale: Пиэль חזק допускает значения «укрепить, поддержать, ободрить». «Укрепил» сохраняет основное значение и не устраняет контекстуальную неоднозначность.
- source_word: לַעֲבוֹדַת
  choice: для служения
  rationale: עֲבוֹדָה здесь означает работу или служение, совершаемое при храме; «служение» точно и естественно в данном контексте.
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняется еврейское выражение «дом Яхве», обозначающее храм, а личное имя יְהוָה передаётся как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога — тетраграмматон. «Яхве» прямо передаёт личное имя, не заменяя его титулом.
- issue: Характер действия וַיְחַזְּקֵם
  choice: укрепил их
  alternative: ободрил их; поддержал их
  rationale: Контекст не уточняет, было ли это прежде всего ободрение, наделение полномочиями или практическая поддержка; буквальное «укрепил» сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка «дом Яхве» сохраняет образ исходного текста, а не заменяет его пояснительным словом «храм».
