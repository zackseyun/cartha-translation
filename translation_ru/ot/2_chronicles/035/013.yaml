  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: ru
  text: Пасхальную жертву приготовили на огне, как предписано[a], а священные приношения сварили в горшках, котлах и мисках и поспешно подали всему народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, точнее: «зажарили пасхальную жертву на огне». Еврейский глагол может иметь общее значение «готовить», однако закон о Пасхе предписывал зажарить жертву на огне, а не варить (см. Исх. 12:8–9).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ הַפֶּסַח
  choice: Пасхальную жертву приготовили
  rationale: Глагол בשׁל может обозначать приготовление пищи в широком смысле, а הַפֶּסַח здесь конкретно относится к пасхальному жертвенному животному. «Пасхальная жертва» ясно передаёт референт, не добавляя указания на вид животного.
- source_word: בָּאֵשׁ
  choice: на огне
  rationale: Естественное русское обозначение способа приготовления; в данном контексте оно подразумевает установленное законом запекание на огне.
- source_word: כַּמִּשְׁפָּט
  choice: как предписано
  rationale: Передаёт нормативный смысл установленного порядка современным и естественным русским выражением.
- source_word: וְהַקֳּדָשִׁים
  choice: священные приношения
  rationale: Речь идёт об освящённых жертвенных частях, противопоставленных пасхальной жертве.
- source_word: בִּשְּׁלוּ
  choice: сварили
  rationale: Перечисленные далее сосуды указывают на варку и создают контраст с приготовлением пасхальной жертвы на огне.
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: в котлах, чанах и мисках
  rationale: Передаёт три разновидности сосудов естественными современными словами; точная форма последнего сосуда остаётся не вполне определённой.
- source_word: וַיָּרִיצוּ
  choice: быстро раздали
  rationale: Порода глагола выражает быстрое перемещение; в контексте пищи для народа естественно подразумевается её оперативная раздача.
- source_word: לְכָל בְּנֵי הָעָם
  choice: всему народу
  rationale: Идиоматически передаёт буквальное «всем сынам народа», то есть всем участникам из народа.
theological_decisions:
- issue: Соотношение בשׁל с предписанием готовить пасхальную жертву на огне
  choice: Сохранить широкий глагол «приготовили», а законный способ обозначить словами «на огне, как предписано».
  alternative: 'Перевести прямо: «запекли пасхальную жертву на огне».'
  rationale: Так сохраняется широта еврейского глагола и одновременно ясно передаётся отличие от приношений, сваренных в сосудах; кажущееся противоречие с пасхальным законом не создаётся.
- issue: Референт הַקֳּדָשִׁים
  choice: Понимать как другие священные приношения, отличные от пасхальной жертвы.
  alternative: Понимать как общее обозначение всей священной пищи, включая пасхальную жертву.
  rationale: Синтаксический контраст и разные способы приготовления указывают на две различаемые категории.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Как предписано» естественнее канцелярского «согласно установлению», а «пасхальная жертва» точнее контекстуального референта без неявного добавления слова «агнец».
