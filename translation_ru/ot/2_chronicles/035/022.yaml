  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: ru
  text: Но Иосия не отвернулся от него[a], а переоделся, чтобы вступить с ним в бой. Он не послушал слов Нехо, исходивших из уст Бога[b], и пришёл, чтобы вступить в бой в долине Мегиддо[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отвратил от него своего лица».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из уст Бога».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на равнине Мегиддо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: не отвернулся от него
  rationale: Естественно передаёт еврейскую идиому об обращении лица в сторону, не утяжеляя современный русский буквальным «не отвратил от него лица».
- source_word: כִּי
  choice: а
  rationale: 'В данном контексте частица вводит противопоставленное пояснение: Иосия не отступил, а замаскировался для боя.'
- source_word: לְהִלָּחֵם בּוֹ
  choice: чтобы сразиться с ним
  rationale: Инфинитив выражает цель, а контекст ясно показывает враждебное военное столкновение.
- source_word: הִתְחַפֵּשׂ
  choice: переоделся
  rationale: Глагол означает изменить внешний облик, выступить под видом другого; «переоделся» естественно и ясно в повествовательном русском.
- source_word: שָׁמַע אֶל
  choice: не послушал
  rationale: Сохраняет как значение слушания, так и контекстуальный оттенок неповиновения, не сводя выражение исключительно к «не подчинился».
- source_word: דִּבְרֵי נְכוֹ
  choice: слов Нехо
  rationale: Прямо и естественно передаёт конструкцию, не заменяя «слова» более интерпретирующим «посланием».
- source_word: מִפִּי אֱלֹהִים
  choice: исходивших из уст Бога
  rationale: Сохраняет образ еврейского выражения и показывает, что именно слова Нехо представлены летописцем как имеющие божественный источник.
- source_word: וַיָּבֹא לְהִלָּחֵם
  choice: вышел на сражение
  rationale: В военном контексте это естественнее по-русски, чем буквальное «пришёл сражаться», и верно передаёт переход к бою.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: в долине Мегиддо
  rationale: בִּקְעָה обозначает широкую долину или долинную равнину; «долина» является точным и понятным основным вариантом.
theological_decisions:
- issue: Представлены ли слова Нехо как действительно исходящие от Бога
  choice: Сохранено утверждение, что слова Нехо исходили «из уст Бога».
  alternative: 'Можно передать проще: «слов Нехо от Бога»; также некоторые толкователи ставят под сомнение божественное происхождение речи Нехо.'
  rationale: Сам стих представляет слова Нехо как исходящие от Бога. Перевод сохраняет это утверждение и возникающее богословское напряжение, не подтверждая и не опровергая его внешним толкованием.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно торжественный. Синтаксис сделан естественным для повествования; образ «из уст Бога» сохранён, а менее привычная идиома об обращении лица вынесена в примечание.
