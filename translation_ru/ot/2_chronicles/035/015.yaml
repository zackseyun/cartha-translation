  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: ru
  text: Певцы, сыновья Асафа, стояли на своих местах согласно повелению Давида, Асафа, Емана и Идифуна, царского провидца[a]. Привратники стояли у каждых ворот. Им не было нужды отходить от своего служения[b], потому что их братья, левиты, приготовили для них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «царский провидец» естественнее всего относится к Идифуну.
    reason: Синтаксически единственное число выражения חוֹזֵה הַמֶּלֶךְ наиболее естественно связывается с непосредственно предшествующим именем Идифун, хотя возможно и более свободное отнесение к предшествующему перечню.
  - marker: b
    text: 'Возможно также: «им нельзя было отходить от своего служения» или «они не должны были отходить от своего служения». Однако последующая причина скорее указывает на то, что им не требовалось уходить, поскольку левиты приготовили для них.'
    reason: Конструкция אֵין + לְ + инфинитив может быть понята более строго, но причинная часть поддерживает значение отсутствия необходимости.
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: певцы
  rationale: Причастная форма от שׁיר обозначает поющих; в контексте храмового служения это точнее, чем более широкое «музыканты».
- source_word: בְּנֵי אָסָף
  choice: сыновья Асафа
  rationale: Сохраняет форму еврейского выражения и узнаваемое обозначение рода или певческой группы Асафа.
- source_word: עַל מַעֲמָדָם
  choice: стояли на своих местах
  rationale: מַעֲמָד обозначает установленное место или пост; выбранная формулировка естественна по-русски и передаёт организованный порядок служения.
- source_word: כְּמִצְוַת
  choice: согласно повелению
  rationale: Передаёт значение авторитетного предписания без излишней юридизации.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: царского прозорливца
  rationale: חוֹזֶה — исторический термин для человека, получающего откровения или видения; «прозорливец» сохраняет отличие от общего слова «пророк».
- source_word: הַשֹּׁעֲרִים
  choice: привратники
  rationale: Точное и традиционно понятное обозначение служителей, приставленных к храмовым воротам.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: у каждых ворот
  rationale: 'Передаёт распределительное значение еврейского оборота: у каждых ворот по отдельности.'
- source_word: אֵין לָהֶם לָסוּר
  choice: им не было нужды отходить
  rationale: Конструкция אֵין + ל с инфинитивом здесь естественно выражает отсутствие необходимости; следующая причинная часть объясняет, почему им не требовалось уходить.
- source_word: מֵעַל עֲבֹדָתָם
  choice: от своего служения
  rationale: В культовом контексте עֲבֹדָה обозначает именно служение или исполнение храмовых обязанностей.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: их братья-левиты
  rationale: Сохраняет явное «братья» и одновременно естественно передаёт приложение «левиты».
- source_word: הֵכִינוּ לָהֶם
  choice: приготовили всё для них
  rationale: Глагол означает «приготовили»; добавленное «всё» создаёт требуемый русским языком объект, не уточняя, что именно было приготовлено.
theological_decisions:
- issue: Синтаксическая связь выражения «царский прозорливец»
  choice: 'Отнесено непосредственно к Идифуну: «Идифуна, царского прозорливца».'
  alternative: Возможно более свободное отнесение выражения ко всему предшествующему перечню названных лиц.
  rationale: Единственное число חוֹזֵה הַמֶּלֶךְ естественнее всего относится к ближайшему имени в единственном числе — Идифуну.
- issue: Смысл אֵין לָהֶם לָסוּר
  choice: 'Отсутствие необходимости: «им не было нужды отходить».'
  alternative: 'Более сильное предписание: «им нельзя было отходить» или «они не должны были отходить».'
  rationale: Причинная часть «потому что их братья-левиты приготовили…» поддерживает смысл отсутствия необходимости покидать место служения, хотя более строгая модальная трактовка грамматически возможна.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены храмовые термины «певцы», «привратники», «служение» и историческое «прозорливец». Имена переданы в привычной русской библейской форме: Асаф, Еман, Идифун.'
