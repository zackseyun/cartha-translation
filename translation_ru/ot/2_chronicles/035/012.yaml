review_pass:
  verdict: revise
  source_fidelity: 'Фраза «предназначенное для всесожжения» ослабляет значение הָעֹלָה: речь идёт о самих жертвах всесожжения (собирательно), а не просто о чём-то, предназначенном для них. Целевую связь с принесением жертв лучше выразить явно, не оставляя в русском тексте неестественного безличного оборота.'
  naturalness: «По подразделениям отцовских домов» звучит чрезмерно канцелярски и не вполне естественно для современного литературного русского. «По группам отцовских домов» сохраняет древний родовой термин и яснее передаёт распределительный смысл. Явное «чтобы они принесли их» делает синтаксис прозрачным.
  terminology: «Яхве» верно передаёт тетраграмматон. «Отцовские дома» уместно как устойчивый древний родовой термин. «Сынам народа» допустимо как близкая к оригиналу собирательная формула при поясняющей сноске; «жертвы всесожжения» точнее передаёт עֹלָה, чем «предназначенное для всесожжения».
  issues:
  - severity: medium
    issue: «Предназначенное для всесожжения» вместо «жертвы всесожжения»
    rationale: Еврейское הָעֹלָה называет жертвоприношение; исходная формулировка переводит его как неопределённый материал, лишь предназначенный для ритуала.
  - severity: low
    issue: Неестественная формулировка «по подразделениям отцовских домов»
    rationale: Она создаёт современно-бюрократический оттенок. «По группам отцовских домов» естественнее и сохраняет структуру исходного выражения.
  - severity: low
    issue: Неясная синтаксическая связь «для принесения Яхве»
    rationale: Русский отглагольный оборот не выражает явно, кто приносит жертвы. Добавление минимально подразумеваемого субъекта проясняет целевую конструкцию без смыслового расширения.
