  to: Они отделили жертвы всесожжения, чтобы раздать их сынам народа[a] по группам отцовских домов, чтобы те принесли их Яхве, как написано в книге Моисея. Так же поступили и с крупным скотом.
  rationale: Исправление восстанавливает прямое обозначение жертв всесожжения, делает распределение по родовым группам естественным по-русски и проясняет цель действия. Эллиптическое заключение о крупном скоте сохранено с минимальным восполнением действия.
