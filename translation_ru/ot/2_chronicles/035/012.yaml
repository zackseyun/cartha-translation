source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: ru
  text: Они отделили жертвы всесожжения, чтобы раздать их сынам народа[a] по группам отцовских домов, чтобы те принесли их Яхве, как написано в книге Моисея. Так же поступили и с крупным скотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам народа»; то есть людям из народа, в отличие от священников и левитов.'
    reason: Поясняет буквальную родовую формулу и её контекстное значение; не ограничивает выражение только лицами мужского пола или непосредственными сыновьями.
lexical_decisions:
- source_word: וַיָּסִירוּ הָעֹלָה
  choice: Они отделили предназначенное для всесожжения
  rationale: Глагол в породе хифиль означает удалить или отделить, а עֹלָה здесь имеет собирательное значение. Такая формулировка естественно передаёт отделение жертвенных частей, не создавая впечатления, будто речь обязательно идёт о нескольких целых жертвах всесожжения.
- source_word: לְתִתָּם
  choice: чтобы раздать его
  rationale: Инфинитив выражает цель действия. Глагол נתן буквально означает «дать», но в данном распорядительном контексте русское «раздать» яснее передаёт распределение среди групп.
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: по подразделениям отцовских домов
  rationale: 'Сохраняется административно-родовой смысл: выдача производилась по группам, соответствующим отцовским домам.'
- source_word: לִבְנֵי הָעָם
  choice: сынам народа
  rationale: Сохранена буквально выраженная мужская собирательная формула, отличающая простой народ от священников и левитов; её значение поясняется в сноске.
- source_word: לְהַקְרִיב לַיהוָה
  choice: для принесения Яхве
  rationale: В жертвенном контексте הקריב означает принести или представить жертву. «Для принесения» сохраняет целевую конструкцию и не уточняет сверх текста, кто именно совершал завершающее действие.
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: как написано в книге Моисея
  rationale: Формула прямо отсылает к письменному Моисееву установлению; строчная буква в слове «книга» соответствует обычной современной русской орфографии для описательного названия.
- source_word: וְכֵן לַבָּקָר
  choice: Так же поступили и с крупным скотом
  rationale: В еврейском тексте оборот эллиптический. Русская формулировка восполняет только подразумеваемое действие и ясно относит ту же процедуру к крупному рогатому скоту.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя Бога, стоящее в исходном тексте, без замены титулом.
- issue: Мужская собирательная формула לִבְנֵי הָעָם
  choice: сынам народа
  alternative: народу; мирянам
  rationale: Основной текст сохраняет форму оригинала и её социальное разграничение, а сноска предотвращает ошибочное понимание, будто речь идёт исключительно о несовершеннолетних или только о непосредственных сыновьях.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис упрощён до двух предложений ради ясности; эллипсис заключительной фразы раскрыт минимально. Выражение «отцовские дома» сохранено как древний родовой термин.
