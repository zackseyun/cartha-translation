base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: ru
  text: После этого они приготовили для себя и для священников[a], потому что священники, сыновья Аарона, до ночи приносили всесожжения и жировые части. Так левиты приготовили для себя и для священников, сыновей Аарона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для них» — в обоих случаях, где переведено «для себя». Еврейское местоимение само по себе не возвратное; однако по контексту оно, вероятно, относится к левитам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: После этого
  rationale: Передаёт временную последовательность и естественно связывает стих с предыдущим контекстом.
- source_word: הֵכִינוּ
  choice: приготовили
  rationale: Hiphil глагола כון означает «приготовить, сделать готовым»; контекст подразумевает пищу, но дополнение не выражено и потому не добавлено.
- source_word: לָהֶם
  choice: для себя
  rationale: Хотя местоимение формально значит «для них», субъектом являются левиты, и контекст убедительно указывает на возвратное значение; неоднозначность отмечена в сноске.
- source_word: וְלַכֹּהֲנִים
  choice: и для священников
  rationale: Прямо передаёт группу, для которой левиты также совершили приготовление.
- source_word: כִּי
  choice: потому что
  rationale: Вводит причину, по которой левиты готовили за священников.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: священники, сыновья Аарона
  rationale: Сохраняет пояснительное родословное обозначение исходного текста без конфессионально окрашенной замены.
- source_word: בְּהַעֲלוֹת
  choice: были заняты вознесением
  rationale: Передаёт длительную занятость священников принесением жертвы на алтарь; «вознесением» сохраняет образ глагола עלה и его культовое значение.
- source_word: הָעוֹלָה
  choice: всесожжения
  rationale: Устоявшийся и точный русский термин для жертвы עֹלָה, целиком сжигавшейся на алтаре.
- source_word: וְהַחֲלָבִים
  choice: и тука
  rationale: В жертвенном контексте обозначает предназначенные для сожжения жировые части; «тук» — точный и узнаваемый библейский культовый термин.
- source_word: עַד לָיְלָה
  choice: до самой ночи
  rationale: Передаёт продолжительность служения вплоть до наступления ночи; частица «самой» естественно подчёркивает длительность, не меняя смысла.
- source_word: וְהַלְוִיִּם
  choice: Поэтому левиты
  rationale: Союз возобновляет главную мысль после объяснения причины; «поэтому» ясно выражает результирующую связь в современном русском.
