  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: ru
  text: И вот[b], все дела его[a] — от первых до последних — записаны в Книге[c] царей Израиля и Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слова его», «события его» или «деяния его»; еврейское слово может обозначать слова, дела, события или обстоятельства.'
    reason: lexical_alternative
  - marker: b
    text: Еврейская частица «вот» привлекает внимание к упомянутой письменной записи.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на книге (или свитке) царей Израиля и Иудеи»; по-русски о сведениях, содержащихся в письменном источнике, естественно говорить «в книге».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: дела его
  rationale: דבר может означать «слово», «дело», «событие» или «обстоятельство». В итоговой формуле о царе «дела» естественно передаёт совокупность его поступков и событий правления, не сводя выражение только к словам.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: от первых до последних
  rationale: Эта формула охватывает весь ход описываемой жизни или правления. Русская конструкция «от первых до последних» сохраняет образ исходного текста и ясно выражает полноту временного охвата.
- source_word: הִנָּם
  choice: вот
  rationale: Частица привлекает внимание к указанию на письменный источник. «Вот» сохраняет её эмфатическую и указательную функцию без архаизации.
- source_word: כְּתוּבִים
  choice: записаны
  rationale: Причастие כתב буквально связано с письмом; в формуле ссылки на летопись «записаны» звучит естественнее, чем «написаны», и точно передаёт внесение сведений в письменный источник.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Предлог עַל буквально означает «на», однако применительно к письменному источнику современный русский требует «в книге». «Книга» — традиционное и понятное обозначение документа, хотя исторически речь могла идти о свитке.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: царей Израиля и Иудеи
  rationale: Сочетание передано как название цитируемого письменного источника. Родительный падеж естественно связывает обоих географических наименований с царями.
