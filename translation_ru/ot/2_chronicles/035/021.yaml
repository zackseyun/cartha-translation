base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: ru
  text: 'Но Нехо послал к нему вестников со словами: «Что мне до тебя, царь Иудеи? Не против тебя я выступаю сегодня, а против дома, с которым веду войну.[a] Бог велел мне торопиться. Не противься Богу, который со мной, чтобы он не погубил тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к дому моей войны». Еврейское выражение неясно; возможны также переводы: «против места, где я воюю» или «против дома (державы, царства), с которым я воюю».'
    reason: Сохранение лексической и синтаксической неоднозначности בֵּית מִלְחַמְתִּי без преждевременного отождествления «дома» с царством в основном тексте.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В повествовательном контексте речь идёт о людях, посланных Нехо; «вестники» естественно и точно передаёт значение.
- source_word: מַה לִּי וָלָךְ
  choice: Что мне до тебя
  rationale: Устойчивое русское выражение передаёт еврейскую формулу невмешательства и разграничения интересов.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: Не против тебя я выступаю сегодня
  rationale: В еврейском тексте выражение эллиптическое; «выступаю» естественно восполняет военный смысл, не добавляя нового содержания.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: против царства, с которым воюю
  rationale: Необычное сочетание буквально содержит «дом» и допускает значение дома, державы или царства, являющегося целью похода. Основной текст передаёт вероятный смысл, а неоднозначность отмечена в сноске.
- source_word: וֵאלֹהִים
  choice: Бог
  rationale: Слово אֱלֹהִים согласовано с глаголом в единственном числе; последующий контекст летописца также представляет эти слова как исходящие от Бога.
- source_word: לְבַהֲלֵנִי
  choice: велел мне торопиться
  rationale: Передаёт побуждение к безотлагательному действию и естественно связывается с субъектом «Бог».
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: Не противься Богу
  rationale: Еврейская идиома призывает прекратить вмешательство в Божье действие или сопротивление ему.
- source_word: אֲשֶׁר עִמִּי
  choice: Который со мной
  rationale: Сохраняет прямую формулировку источника, не уточняя характера Божьей поддержки.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: чтобы Он не погубил тебя
  rationale: После предостережения выражает предотвращаемый результат; «погубил» соответствует серьёзности угрозы и естественно звучит по-русски.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים в речи Нехо
  choice: «Бог» в единственном числе и с прописной буквы
  alternative: «бог» как божество Нехо или «боги» по внешней форме существительного
  rationale: Глагол אָמַר стоит в единственном числе, а в следующем стихе летописец характеризует сказанное как слова из уст Бога. Такой перевод следует повествовательной рамке, не уточняя сверх текста личность или способ откровения.
- issue: Толкование בֵּית מִלְחַמְתִּי
  choice: «царство, с которым воюю» с примечанием
  alternative: «дом моей войны», «место моей войны» или «дом, с которым я воюю»
  rationale: Выражение трудно и допускает несколько пониманий. В основном тексте выбран понятный вероятный смысл, а подлинная лексическая неопределённость сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Реплика Нехо звучит прямо и естественно; синтаксическая эллиптичность раскрыта лишь там, где это необходимо для ясности. Формы «Который» и «Он» написаны с прописной буквы согласно традиционному русскому библейскому регистру.
