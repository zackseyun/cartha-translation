  - severity: low
    issue: Сноска b создаёт видимость существенной синтаксической альтернативы
    rationale: Её вариант не даёт иного осмысленного перевода и не нужен для сохранения текстовой неоднозначности; смысловое уточнение «животных» уже прозрачно включено в основной текст.
