source:
  edition: WLC
  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: ru
  text: И его сановники внесли добровольное пожертвование для народа, священников и левитов[a]. Хелкия, Захария и Иехиил, руководители Божьего дома, дали священникам 2 600 животных для пасхальных жертв и 300 голов крупного скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внесли добровольный дар для народа, для священников и для левитов».'
    reason: Сохраняет конкретное значение существительного נְדָבָה и повторение предлога в еврейском тексте.
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: И его сановники
  rationale: שָׂרִים обозначает высокопоставленных правителей или должностных лиц. «Сановники» передаёт их статус и естественно звучит в историческом повествовании, не создавая буквального смысла царских сыновей, возможного у слова «князья».
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: добровольно пожертвовали
  rationale: Сочетание существительного נְדָבָה, обозначающего добровольный дар, с каузативной формой רום описывает внесение пожертвования. Русская глагольная конструкция сохраняет добровольный характер дара и звучит естественно.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: для народа, священников и левитов
  rationale: Повторяющийся предлог ל обозначает тех, для кого предназначалось пожертвование. В русском его естественно передать одним общим «для».
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: Хелкия, Захария и Иехиил
  rationale: Использованы укоренившиеся в русской библейской традиции формы этих личных имён.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: руководители Божьего дома
  rationale: נְגִידֵי указывает на лиц, облечённых руководящими полномочиями; «руководители» ясно передаёт их храмовую административную роль. «Божий дом» сохраняет древнееврейское обозначение храма.
- source_word: לַפְּסָחִים
  choice: животных для пасхальных жертв
  rationale: Множественное число פְּסָחִים в данном контексте обозначает животных, предназначенных для пасхального жертвоприношения. Слово «животных» восполняет подразумеваемый объект счёта, не смешивая их с отдельно названным крупным скотом.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 2 600
  rationale: Цифровая запись облегчает чтение и точно передаёт число.
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: и 300 голов крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; счётное слово «голов» делает русскую фразу ясной, а «крупный скот» не сужает значение до волов.
