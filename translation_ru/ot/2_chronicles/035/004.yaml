base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: ru
  text: Приготовьтесь, распределившись по вашим родовым домам[a] и по вашим отделениям[b], в соответствии с письменным указанием Давида, царя Израиля, и письменным указанием Соломона, его сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по домам ваших отцов». Имеются в виду родовые группы, объединённые происхождением по отцовской линии.'
    reason: lexical_alternative
  - marker: b
    text: 'Также: «по вашим чередам». Термин обозначает установленные подразделения, особенно в священнической и левитской организации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: Приготовьтесь
  rationale: Побудительная форма породы хифиль от כון призывает активно подготовиться и занять надлежащее место; возвратное «приготовьтесь» естественно передаёт подразумеваемый объект действия.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: по вашим родовым домам
  rationale: בֵית אָבוֹת обозначает отцовский, то есть родовой, дом как общественную и родословную группу; «родовой дом» понятнее современному русскому читателю, чем буквальное «дом отцов».
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: согласно вашим отделениям
  rationale: מַחְלְקוֹת — установленные группы или подразделения служителей. «Отделения» ясно передаёт организационный смысл, а традиционное «череды» приведено в сноске.
- source_word: בִּכְתָב
  choice: как предписано в писании
  rationale: כְּתָב буквально означает «письмо, письменный документ»; предлог ב здесь указывает на соответствие авторитетному письменному установлению. Формулировка передаёт эту функцию, не отождествляя документ с конкретной канонической книгой.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: Давида, царя Израиля
  rationale: Естественная русская передача приложения при имени с сохранением царского титула.
- source_word: וּבְמִכְתַּב שְׁלֹמֹה בְנוֹ
  choice: и в письменном распоряжении его сына Соломона
  rationale: מִכְתָּב обозначает письменный документ или запись. «Письменное распоряжение» передаёт документальный и нормативный характер выражения; местоимение «его» недвусмысленно относит сыновство к Давиду.
