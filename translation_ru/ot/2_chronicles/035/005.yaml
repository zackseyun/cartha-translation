base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: ru
  text: И станьте в святилище по отделениям отцовских домов ваших братьев — сынов народа[a] — и по отделению отцовского дома левитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов народа»; здесь так названы израильтяне, не являвшиеся левитами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: И станьте
  rationale: Повелительная форма множественного числа прямо обращена к левитам; союз «и» сохраняет связь с предыдущими наставлениями.
- source_word: בַקֹּדֶשׁ
  choice: в святилище
  rationale: Предлог с определённым существительным указывает на священное место; «святилище» естественно передаёт конкретный культовый смысл, не уточняя отдельную часть храмового комплекса.
- source_word: לִפְלֻגּוֹת
  choice: по отделениям
  rationale: Существительное обозначает организованные группы, а предлог выражает распределение или соответствие этим группам.
- source_word: בֵּית הָאָבוֹת
  choice: отцовских домов
  rationale: Устойчивое родословно-общественное обозначение семейных объединений по отцовской линии; формулировка сохраняет образ и структуру оригинала.
- source_word: לַאֲחֵיכֶם
  choice: ваших братьев
  rationale: Сохраняется родственный язык, которым левиты связаны с остальными израильтянами; в данном сочетании естественна принадлежностная связь с «отцовскими домами».
- source_word: בְּנֵי הָעָם
  choice: сынов народа
  rationale: Буквальная формулировка сохранена как поясняющее приложение к «вашим братьям»; её контекстуальное значение разъясняется в сноске.
- source_word: וַחֲלֻקַּת
  choice: и по отделению
  rationale: Единственное число оригинала сохранено; повтор «по» ясно передаёт параллельную организационную конструкцию, не устраняя возможную синтаксическую неоднозначность.
- source_word: בֵּית אָב לַלְוִיִּם
  choice: отцовского дома левитов
  rationale: Сохраняются единственное число и родовое устройство по отцовской линии; русская родительная конструкция естественно выражает отношение этого отделения к левитам.
theological_decisions:
- issue: Родственная и общественная терминология
  choice: Сохранить в основном тексте «ваших братьев — сынов народа»
  alternative: «ваших соплеменников» или «остальных израильтян»
  rationale: Мужские родственные обозначения отражают устройство Израиля по отцовским домам. Их сохранение не сглаживает социальное различие между нелевитами и левитами; контекстуальный смысл поясняется сноской.
- issue: Соотношение подразделений народа и левитов
  choice: Передать обе части параллельно, повторив «по», но сохранить единственное число во второй части
  alternative: «и пусть каждому отцовскому дому соответствует отделение левитов»
  rationale: Оригинал краток и допускает некоторую синтаксическую напряжённость. Выбранный вариант показывает параллель, не вводя явно идею соответствия «каждому», которой в тексте нет.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Термин «отцовский дом» сохранён как значимое обозначение родового объединения; тире показывает, что «сыны народа» поясняют выражение «ваши братья».
