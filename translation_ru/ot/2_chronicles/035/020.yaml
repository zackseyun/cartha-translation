  text: אַחֲרֵ֣י כָל זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת הַ/בַּ֔יִת עָלָ֞ה נְכ֧וֹ מֶֽלֶךְ מִצְרַ֛יִם לְ/הִלָּחֵ֥ם בְּ/כַרְכְּמִ֖ישׁ עַל פְּרָ֑ת וַ/יֵּצֵ֥א לִ/קְרָאת֖/וֹ יֹאשִׁיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: ru
  text: После всего этого, когда Иосия приготовил храм, Нехо, царь Египта, выступил, чтобы сразиться у Кархемиша на Евфрате, и Иосия вышел ему навстречу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вышел против него».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: приготовил
  rationale: Глагол в породе хифиль означает «приготовить, привести в готовность, утвердить». «Приготовил» близко передаёт форму оригинала и в данном контексте подразумевает, что храм был приведён в надлежащее состояние и порядок.
- source_word: הַבַּיִת
  choice: храм
  rationale: Буквально «дом», но в контексте Паралипоменон это дом Господа, то есть храм. Русское «храм» ясно и естественно передаёт подразумеваемый референт без двусмысленности слова «дом».
- source_word: עָלָה
  choice: выступил
  rationale: Буквально «поднялся, пошёл вверх». Здесь речь о военном походе египетского царя; «выступил» естественно передаёт движение войска, не уточняя сверх текста способ похода.
- source_word: לְהִלָּחֵם
  choice: чтобы сразиться
  rationale: Инфинитив обозначает вступление в бой. «Сразиться» соответствует военному контексту и звучит естественно в русском повествовании.
- source_word: בְּכַרְכְּמִישׁ
  choice: у Кархемиша
  rationale: Предлог ב здесь указывает на место военных действий. «У Кархемиша» естественно обозначает сражение возле города.
- source_word: עַל פְּרָת
  choice: на Евфрате
  rationale: Обычное географическое обозначение города, расположенного у реки; русское «на Евфрате» кратко и идиоматично.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: вышел ему навстречу
  rationale: Выражение буквально означает выход навстречу кому-либо, но в военном контексте может подразумевать выступление против него. Основной текст сохраняет формальную неоднозначность, а примечание раскрывает возможный враждебный смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Храм» употреблено вместо буквального «дом» ради ясности референта; военная направленность последней фразы не усилена в основном тексте, чтобы сохранить неоднозначность еврейского выражения.
