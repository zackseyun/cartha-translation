  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: ru
  text: Всякий раз, когда левиты приносили сундук[a] для царского надзора и видели, что в нём много денег[b], приходили царский писец и представитель первосвященника. Они опорожняли сундук, уносили его и возвращали на прежнее место. Так поступали изо дня в день и собрали очень много денег.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально это слово может означать «ковчег», но здесь речь идёт о сундуке для сбора пожертвований, а не о ковчеге завета.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «серебра»; в данном контексте имеются в виду собранные деньги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: сундук
  rationale: В данном контексте это ёмкость для пожертвований, а не ковчег завета. «Сундук» точно передаёт назначение предмета и естественно звучит по-русски.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: под царский надзор
  rationale: פְּקֻדָּה здесь обозначает надзор, официальное ведение или проверку. Формулировка сохраняет административный смысл, не уточняя без достаточных оснований конкретное учреждение или должность.
- source_word: בְּיַד הַלְוִיִּם
  choice: левиты приносили
  rationale: Оборот בְּיַד указывает на исполнителей действия. Активная русская конструкция ясно передаёт, что сундук доставляли левиты.
- source_word: רַב הַכֶּסֶף
  choice: в нём много денег
  rationale: כֶּסֶף буквально означает «серебро», но в контексте сбора пожертвований обозначает денежные средства; добавленное «в нём» естественно выражает подразумеваемое содержимое сундука.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: царский писец
  rationale: Сохраняется историческое наименование административной должности без модернизирующего переосмысления как секретаря.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: уполномоченный первосвященника
  rationale: פְקִיד обозначает назначенного должностного представителя. «Уполномоченный» передаёт подчинённую административную роль, не приписывая ему точного ранга.
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: опорожняли сундук
  rationale: Глагол обозначает удаление содержимого; «опорожняли» точно и естественно описывает действие.
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: затем относили его и возвращали на место
  rationale: 'Сохранена последовательность двух глаголов: сундук поднимали или уносили, после чего возвращали на прежнее место.'
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: так поступали изо дня в день
  rationale: Русский устойчивый оборот передаёт повторяемость действия.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: собрали очень много денег
  rationale: Передаёт результат многократного сбора и усилительное значение לָרֹב естественным современным русским языком.
