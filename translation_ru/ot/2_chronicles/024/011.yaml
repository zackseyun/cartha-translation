  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Административные реалии переданы понятно, но без неоправданной модернизации. Разделение на два предложения после упоминания должностных лиц устраняет перегруженность длинной еврейской фразы, сохраняя последовательность действий.
