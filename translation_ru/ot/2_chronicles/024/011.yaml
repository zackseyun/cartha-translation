revisions:
- from: Всякий раз, когда левиты приносили сундук[a] под царский надзор и видели, что в нём много денег[b], приходили царский писец и уполномоченный первосвященника. Они опорожняли сундук, затем относили его и возвращали на место. Так поступали изо дня в день и собрали очень много денег.
  to: Всякий раз, когда левиты приносили сундук[a] для царского надзора и видели, что в нём много денег[b], приходили царский писец и представитель первосвященника. Они опорожняли сундук, уносили его и возвращали на прежнее место. Так поступали изо дня в день и собрали очень много денег.
  rationale: Уточнён субъект действий с сундуком повторным употреблением «они» непосредственно после обозначения царского писца и представителя первосвященника; добавлено «на прежнее место» для передачи суффикса «его место». Формулировка о царском надзоре сделана более прозрачной. Значение, исторический регистр и сноски сохранены.
