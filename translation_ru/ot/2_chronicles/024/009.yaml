  text: וַ/יִּתְּנוּ ק֞וֹל בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֗ם לְ/הָבִ֤יא לַֽ/יהוָה֙ מַשְׂאַ֞ת מֹשֶׁ֧ה עֶֽבֶד הָ/אֱלֹהִ֛ים עַל יִשְׂרָאֵ֖ל בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: ru
  text: И провозгласили по Иудее и Иерусалиму, чтобы принесли Яхве сбор, предписанный Моисеем, слугой Бога, Израилю в пустыне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приношение». Еврейское слово может обозначать установленное приношение или обязательный сбор; буквально конструкцию можно передать: «сбор Моисея, слуги Бога, возложенный на Израиль в пустыне».'
    reason: Лексически мַשְׂאַת может означать как приношение, так и установленный обязательный взнос; сноска также показывает буквальную конструкцию с עַל יִשְׂרָאֵל, не скрывая её оттенок возложенной обязанности.
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: провозгласили
  rationale: Еврейская идиома буквально означает «подали голос» и здесь обозначает публичное объявление; «провозгласили» естественно передаёт официальный и всеобщий характер призыва.
- source_word: בִּיהוּדָה וּבִירוּשָׁלַם
  choice: по Иудее и Иерусалиму
  rationale: Предлог ב обозначает область распространения объявления; русское «по» естественно передаёт провозглашение на всей указанной территории.
- source_word: לְהָבִיא
  choice: чтобы приносили
  rationale: Инфинитив выражает цель и содержание провозглашения; несовершенный вид уместен для призыва к сбору средств от множества людей.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, не заменяя его титулом.
- source_word: מַשְׂאַת
  choice: сбор
  rationale: Слово обозначает взимаемое или установленное приношение. «Сбор» сохраняет обязательный общественный характер, не сужая значение до современного государственного налога.
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: установленный Моисеем, слугой Бога
  rationale: Связь сбора с Моисеем по-русски нуждается в смысловом уточнении; контекст указывает на предписанный им сбор. Титул «слуга Бога» сохранён прямо.
- source_word: עַל יִשְׂרָאֵל
  choice: для Израиля
  rationale: Предлог עַל допускает понимание как возложения обязанности на Израиль, так и установления относительно Израиля. Основной текст сохраняет более нейтральное «для Израиля», а обязательный характер раскрывается в сноске.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и понятное русское обозначение местопребывания Израиля во времена Моисея.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и соответствует предоставленному доктринальному решению.
- issue: Характер предписания Моисея
  choice: сбор, установленный Моисеем, для Израиля
  alternative: сбор Моисея, возложенный на Израиль
  rationale: Синтаксис допускает оттенок обязательного сбора, возложенного на народ, однако выражение עַל יִשְׂרָאֵל не требует однозначно вносить «возложенный» в основной текст. Неопределённость отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; официальный характер объявления и установленного сбора сохранён без канцеляризма.
