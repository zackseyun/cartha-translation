base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: ru
  text: Работники трудились, и ремонт продвигался благодаря их усилиям[a]. Они привели дом Божий в его надлежащее состояние[b] и укрепили его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое «ремонт», может означать также «исцеление» или «восстановление»; здесь оно относится к восстановлению здания.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «согласно его установленному устройству»; возможно также: «к его первоначальному виду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: Работники трудились
  rationale: Передаёт идиоматическое сочетание глагола «делать» с выражением «исполнители работы» естественным современным русским языком, сохраняя акцент на деятельном труде.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: восстановление продвигалось
  rationale: אֲרוּכָה обозначает исцеление или восстановление, а в контексте ремонта здания — восстановительные работы; עלה здесь выражает успешное продвижение.
- source_word: בְּיָדָם
  choice: благодаря их усилиям
  rationale: Еврейская идиома буквально говорит «их рукой» и указывает на действующее посредство работников. Русская формулировка естественно передаёт смысл, не создавая неуместного образа одной общей руки.
- source_word: וַיַּעֲמִידוּ
  choice: Они привели
  rationale: Каузативная форма буквально означает «поставили» или «дали стоять»; применительно к ремонту речь идёт о восстановлении здания до устойчивого состояния.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Сохраняет буквальное и традиционно понятное обозначение храма, не заменяя его толкованием.
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: в надлежащее состояние
  rationale: מַתְכֹּנֶת может обозначать установленный вид, устройство или должное состояние. В контексте ремонта эта формулировка естественна, при этом возможное значение «первоначальный вид» вынесено в примечание.
- source_word: וַיְאַמְּצֻהוּ
  choice: и укрепили его
  rationale: Точно передаёт значение интенсивной формы אמץ — сделать крепким, усилить — в строительном контексте.
