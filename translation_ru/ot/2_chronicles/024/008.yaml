  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: ru
  text: Царь приказал, и сделали один ящик[a] и поставили его снаружи у ворот дома Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один ящик». Числительное, вероятно, подчёркивает, что для сбора был назначен один общий ящик.'
    reason: Пояснение явного числительного אֶחָד без ложного обозначения уже выбранного слова как альтернативы.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: приказал
  rationale: Буквально глагол означает «сказал», но в данном административном контексте последующее исполнение показывает, что слова царя имели силу распоряжения.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Прямой и естественный перевод определённого существительного.
- source_word: וַיַּעֲשׂוּ
  choice: сделали
  rationale: Обычное значение עשה при изготовлении физического предмета; неопределённый субъект во множественном числе сохранён.
- source_word: אֲרוֹן אֶחָד
  choice: один ящик
  rationale: אֲרוֹן здесь обозначает вместилище для сбора пожертвований, поэтому «ящик» яснее, чем «ковчег» или «сундук»; אֶחָד передано явно словом «один».
- source_word: וַיִּתְּנֻהוּ
  choice: поставили его
  rationale: נתן в данном пространственном контексте означает помещение предмета в определённое место; «поставили» естественно по-русски применительно к ящику.
- source_word: בְּשַׁעַר
  choice: у ворот
  rationale: Предлог ב здесь выражает местонахождение; русское «у ворот» естественно передаёт размещение возле входа, не уточняя точку сверх еврейского текста.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется образ «дома» как обозначения храма и непосредственно передаётся личное имя Бога.
- source_word: חוּצָה
  choice: снаружи
  rationale: Наречие указывает, что ящик находился с внешней стороны; положение слова в русском предложении ясно связывает его с местом установки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и повествовательный. Формулировка сохраняет неопределённость исполнителей и явное числительное אֶחָד, не вводя конфессиональной терминологии.
