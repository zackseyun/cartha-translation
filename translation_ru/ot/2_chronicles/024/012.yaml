  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: ru
  text: Царь и Иехояда передали эти деньги[a] тем, кто выполнял работы по обслуживанию дома Яхве[b], а те наняли каменотёсов и ремесленников, чтобы восстановить дом Яхве, а также мастеров по железу и бронзе[c], чтобы укрепить дом Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «передали это» или «передали его»; из контекста ясно, что речь идёт о собранных деньгах.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть в храме Яхве. Буквально: «в доме Яхве».'
    reason: clarification
  - marker: c
    text: 'Или: «кузнецов, работавших с железом и бронзой». Еврейское слово נְחֹשֶׁת может обозначать бронзу или медь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: передали эти деньги
  rationale: Глагол נתן с местоименным суффиксом буквально означает «передали это/его»; по контексту речь идёт о собранных деньгах. Явное существительное делает русскую фразу естественной, а буквальная форма отмечена в сноске.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: тем, кто выполнял работы по служению в доме Яхве
  rationale: Передана многослойная конструкция исходного текста без добавления не выраженного прямо значения «надзиратели» или «распорядители».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, переданное тетраграмматоном, транслитерировано, а не заменено титулом «Господь».
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: они нанимали
  rationale: Сочетание היה с причастием обозначает продолжавшееся или обычное действие; несовершенный вид естественно передаёт это по-русски.
- source_word: חֹצְבִים
  choice: каменотёсов
  rationale: В контексте восстановления здания речь идёт о специалистах, обрабатывавших камень.
- source_word: חָרָשִׁים
  choice: ремесленников
  rationale: Слово обозначает квалифицированных мастеров и само по себе не ограничивает их работу плотницким ремеслом.
- source_word: לְחַדֵּשׁ
  choice: восстановить
  rationale: Порода пиэль здесь выражает обновление повреждённого здания, то есть его восстановление, а не просто абстрактное «обновление».
- source_word: חָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: мастеров по железу и бронзе
  rationale: Фраза обозначает квалифицированных работников по металлу; «мастера» сохраняет широту еврейского термина, не сужая его до кузнецов.
- source_word: לְחַזֵּק
  choice: укрепить
  rationale: Прямо передаёт каузативное значение «сделать прочным, укрепить» в строительном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Буквальное «дом Яхве» сохраняет образ и повтор исходника; сноска поясняет, что здесь имеется в виду храм.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным ритмом. Повтор «дом Яхве» сохранён как намеренная особенность еврейского текста. Имя Иехояда передано близко к еврейской форме יְהוֹיָדָע; синтаксис упрощён лишь настолько, насколько требуется для естественной русской речи.
