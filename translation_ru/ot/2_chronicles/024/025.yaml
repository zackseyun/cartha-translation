source:
  edition: WLC
  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: ru
  text: Когда они ушли от него — ведь они оставили его, поражённого многими болезнями, — его слуги составили против него заговор из-за крови сыновей священника Иодая[a]. Они убили его на постели, и он умер. Его похоронили в городе Давида, но не в гробницах царей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «из-за крови сыновей священника Иодая». В контексте речь может идти именно о сыне Иодая — Захарии (24:20–22).'
    reason: Масоретский текст содержит множественное число «сыновей», тогда как ближайший контекст позволяет понимать это как указание на Захарию, сына Иодая.
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: Когда они ушли от него
  rationale: Конструкция с инфинитивом передаёт временное значение «когда они ушли»; местоименный суффикс относится к Иоасу.
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: ведь они оставили его тяжело больным
  rationale: כִּי имеет пояснительно-причинный оттенок. Естественное русское выражение «тяжело больным» передаёт усиленное состояние, обозначенное сочетанием с רַבִּים, хотя формальный множественный образ болезней в русском не сохраняется.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: его слуги составили против него заговор
  rationale: Форма hitpael глагола קשר обычно обозначает участие в заговоре; עֲבָדָיו непосредственно передано как «его слуги».
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: из-за крови сыновей священника Иодая
  rationale: Предлог בְּ перед דָּמִים здесь выражает причину или мотив мести. «Кровь» сохраняет библейскую метонимию кровопролития, а множественное «сыновей» следует масоретскому тексту.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: Они убили его на постели, и он умер
  rationale: Сохраняются прямое значение הרג, обстоятельство места и отдельное повествовательное указание на смерть.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד
  choice: Его похоронили в городе Давида
  rationale: Естественная русская пассивно-неопределённая конструкция точно передаёт факт погребения, не вводя нового субъекта.
- source_word: וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: но не в царских гробницах
  rationale: Краткая контрастная конструкция естественна по-русски; «царские гробницы» передаёт погребальный комплекс царей и подчёркивает оказанную Иоасу посмертную немилость.
theological_decisions:
- issue: Множественное «сыновей Иодая» в масоретском тексте при контекстуальном ожидании единственного числа
  choice: В основном тексте сохранено «сыновей священника Иодая».
  alternative: «сына священника Иодая», то есть Захарии
  rationale: Предоставленный еврейский текст содержит множественное число בְּנֵי. Контекст 24:20–22 прямо называет Захарию, сына Иодая, поэтому напряжение между формой текста и ближайшим контекстом отмечено в сноске, а не устранено молча.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис упрощён для ясности, но причинная вставка и последовательность событий сохранены. Имя יְהוֹיָדָע передано в принятой русской библейской форме «Иодай».
