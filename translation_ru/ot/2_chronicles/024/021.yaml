base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: ru
  text: И они составили против него заговор и по приказу царя побили его камнями во дворе дома Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: составили против него заговор
  rationale: Глагол קשר с предлогом עַל здесь обозначает враждебный сговор против человека; эта формулировка естественна в современном русском языке.
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: побили его камнями
  rationale: רגם обозначает побивание камнями, а אֶבֶן выражает орудие действия. Русская формулировка передаёт и способ убийства, и упоминание камня без неестественного буквализма.
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: по приказу царя
  rationale: מִצְוָה в данном контексте — властное распоряжение; выражение сохраняет прямую ответственность царя.
- source_word: בַּחֲצַר
  choice: во дворе
  rationale: חָצֵר означает ограждённый двор; в храмовом контексте «двор» звучит естественно и точно.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохраняется образное наименование святилища как «дома» и передаётся личное имя יהוה, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господа
  rationale: Масоретский текст содержит тетраграмматон, поэтому личное имя передано прямо; титульный вариант возможен по традиции, но менее непосредственно отражает исходную форму.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; начальное «И» сохраняет повествовательную связь еврейского текста.
