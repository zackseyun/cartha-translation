base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: ru
  text: Но Он послал к ним пророков, чтобы вернуть их к Яхве; пророки свидетельствовали против них[a], но те не слушали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предостерегали их». Еврейский глагол может означать торжественное предостережение, но здесь также имеет оттенок свидетельства против них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם
  choice: Но Он посылал к ним
  rationale: Глагол שלח передан обычным «посылал». Предлог ב при направлении пророков к народу естественно выражен по-русски как «к ним». Начальное «но» передаёт смысловой контраст с предшествующим повествованием.
- source_word: נְבִאִים
  choice: пророков
  rationale: Прямой и общепринятый эквивалент.
- source_word: לַהֲשִׁיבָם
  choice: чтобы вернуть их
  rationale: Каузативная форма שוב означает побудить или привести к возвращению; «вернуть» кратко и естественно передаёт эту силу.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל обозначает направленность возвращения, а имя Яхве передаёт личное имя Бога в исходном тексте.
- source_word: וַיָּעִידוּ בָם
  choice: Те свидетельствовали против них
  rationale: Так сохраняется возможный судебный оттенок глагола עוד в породе hифиль и значение предлога ב как направленного против адресатов свидетельства; местоимение «те» ясно указывает на пророков.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: но они не внимали
  rationale: «Не внимали» передаёт не просто физическое неслышание, а отсутствие внимательного и послушного отклика; формулировка краткая, литературная и уместная для библейского повествования.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, явно присутствующее в еврейском тексте, не подменяя его титулом.
- issue: Смысл וַיָּעִידוּ בָם
  choice: свидетельствовали против них
  alternative: предостерегали их
  rationale: Основной текст сохраняет судебно-заветный оттенок пророческого свидетельства, а сноска отмечает также возможный смысл торжественного предупреждения, не устраняя лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён для ясности, при этом сохранены контраст, личное имя Бога и неоднозначность пророческого действия.
