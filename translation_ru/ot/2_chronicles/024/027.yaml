base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: ru
  text: Его сыновья и многочисленные пророчества против него[a], а также устроение основания дома Божьего — всё это записано в «Мидраше Книги царей»[b]. Амасия, его сын, царствовал после него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна для понимания. Возможны также переводы: «величина бремени, лежавшего на нём», «множество изречений о нём» или «тяжёлая дань, возложенная на него». Слово מַשָּׂא может означать «бремя», «пророчество» или, в некоторых контекстах, возложенную повинность.'
    reason: lexical_alternative
  - marker: b
    text: «Мидраш» здесь, вероятно, означает толковую запись, изложение или комментарий, связанный с Книгой царей.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: Его сыновья
  rationale: Прямо передаёт форму множественного числа с местоименным суффиксом; начальный союз естественно выражен связью элементов перечисления.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: и многочисленные пророчества против него
  rationale: מַשָּׂא может обозначать пророческое изречение, нередко возвещающее суд; רֹב указывает на многочисленность или изобилие, а עָלָיו в данном контексте допускает значение направленности против Иоаса. Неуверенность в значении всей трудной фразы отражена в сноске.
- source_word: וִיסוֹד בֵּית הָאֱלֹהִים
  choice: а также основание дома Божьего
  rationale: Сохраняет корневое значение יסד — «основывать, закладывать основание» — и не подменяет его более контекстуальным, но менее буквальным «восстановлением».
- source_word: הִנָּם כְתוּבִים
  choice: всё это записано
  rationale: Русское указательное выражение «всё это» естественно передаёт дейктическое усиление הִנָּם и согласует перечисленные сведения с формой множественного числа כְּתוּבִים.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: в «Мидраше Книги царей»
  rationale: Транслитерация «Мидраш» не сужает неопределённый жанр древнего источника до современного комментария; значение пояснено в сноске. Предлог передан идиоматически по-русски.
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַּחְתָּיו
  choice: Вместо него воцарился его сын Амасия
  rationale: Естественно передаёт стандартную формулу царского преемства и сохраняет значение תַּחְתָּיו — «вместо него, на его месте».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Дом Божий» сохранён как понятная традиционная передача древнееврейского оборота; «вот» не воспроизводится механически, поскольку его указательная функция естественно выражена словами «всё это».
