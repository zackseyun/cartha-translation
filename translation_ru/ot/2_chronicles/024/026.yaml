base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: ru
  text: 'Вот те, кто составил против него заговор: Завад, сын аммонитянки Шимеат, и Иегозавад, сын моавитянки Шимрит.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот те
  rationale: Естественно вводит перечисление и отождествление участников заговора в русском повествовании.
- source_word: הַמִּתְקַשְּׁרִים עָלָיו
  choice: кто составил против него заговор
  rationale: Причастная форма от קשר в данном контексте обозначает совместный заговор, а עָלָיו указывает на его цель; перевод сохраняет значение и звучит естественно по-русски.
- source_word: זָבָד
  choice: Завад
  rationale: Передача личного имени по еврейской форме.
- source_word: בֶּן
  choice: сын
  rationale: Обычная и точная передача родственного обозначения.
- source_word: שִׁמְעָת הָעַמּוֹנִית
  choice: аммонитянки Шимеат
  rationale: Женская форма этнонима показывает, что Шимеат — женщина; такой порядок слов ясно выражает это в современном русском языке.
- source_word: וִיהוֹזָבָד
  choice: и Иегозавад
  rationale: Союз сохранён, личное имя передано в узнаваемой русской библейской форме.
- source_word: שִׁמְרִית הַמּוֹאָבִית
  choice: моавитянки Шимрит
  rationale: Женская форма этнонима указывает на женщину; формулировка точна и не требует архаического обозначения.
