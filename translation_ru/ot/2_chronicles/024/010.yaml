  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: ru
  text: Тогда все сановники и весь народ обрадовались, приносили пожертвования и бросали их в ящик, пока не закончили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока он не наполнился». Еврейское выражение в более общем смысле означает «до завершения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: обрадовались
  rationale: Глагол שׂמח обозначает радость; «обрадовались» естественно передаёт реакцию всей общины в современном русском повествовании.
- source_word: כָל הַשָּׂרִים
  choice: все сановники
  rationale: שׂרים здесь — представители власти при царе. «Сановники» сохраняет историко-государственный оттенок и не создаёт впечатления, будто речь непременно идёт о царских сыновьях.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: Прямо передаёт собирательное значение и полный охват еврейского выражения.
- source_word: וַיָּבִיאוּ
  choice: они приносили пожертвования
  rationale: Сам глагол означает «приносили»; дополнение не выражено, но из ближайшего контекста ясно, что речь идёт о пожертвованиях на храм. Его добавление делает русскую фразу естественной.
- source_word: וַיַּשְׁלִיכוּ
  choice: бросали
  rationale: Сохраняет конкретное и энергичное значение глагола שלך — «бросать, кидать», не ослабляя его до общего «клали».
- source_word: לָאָרוֹן
  choice: в ящик
  rationale: אָרוֹן может обозначать ковчег, сундук или ящик. Здесь это ёмкость для сбора пожертвований, поэтому «ящик» ясно передаёт предмет и исключает смешение с ковчегом завета.
- source_word: עַד לְכַלֵּה
  choice: пока он не наполнился
  rationale: Оборот буквально указывает на достижение конца или завершения. В контексте сбора пожертвований вероятен смысл наполнения ящика, однако грамматически возможно и «пока не закончили», поэтому альтернатива вынесена в сноску.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным звучанием. «Сановники» соответствует монархическому контексту, а «ящик» понятно обозначает ёмкость для пожертвований. Маркер сноски поставлен при неоднозначном заключительном обороте.
