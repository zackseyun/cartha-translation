base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: ru
  text: На рубеже года[a] против него выступило войско Арама[b]. Оно пришло в Иудею и Иерусалим, истребило всех вождей народа, из среды народа, и всю свою добычу отправило царю Дамаска.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в конце года»; еврейское выражение указывает на поворот годового или сезонного цикла.'
    reason: lexical_alternative
  - marker: b
    text: Арам — еврейское название страны, которую нередко называют Сирией.
    reason: cultural_note
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: На рубеже года
  rationale: תְּקוּפָה обозначает круговорот или поворотный момент; выражение указывает на смену годового либо сезонного цикла. «На рубеже года» сохраняет образ поворота и не сводит его однозначно к концу года.
- source_word: עָלָה עָלָיו
  choice: против него выступило
  rationale: В военном контексте עָלָה עַל означает выступить или пойти против кого-либо. Русское выражение естественно передаёт начало военного похода.
- source_word: חֵיל אֲרָם
  choice: войско Арама
  rationale: חֵיל здесь означает военную силу или войско. Историческое название «Арам» сохраняется вместо позднейшего географического обозначения «Сирия».
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: Оно пришло в Иудею и Иерусалим
  rationale: Обычное значение בוא — «приходить, входить». Военный характер прибытия уже ясен из контекста, поэтому глагол не усилен до «вторглось».
- source_word: וַיַּשְׁחִיתוּ
  choice: истребило
  rationale: В породе хифиль שׁחת означает губить или уничтожать. При обозначении людей «истребило» ясно передаёт смертельное уничтожение и соответствует возвышенному историческому регистру.
- source_word: כָּל שָׂרֵי הָעָם
  choice: всех вождей народа
  rationale: שָׂרִים может обозначать правителей, начальников или вождей. «Вожди» здесь понятно указывает на руководящий слой, не создавая ложного впечатления, будто речь обязательно идёт о царских сыновьях.
- source_word: מֵעָם
  choice: из среды народа
  rationale: Предлог מִן с עָם выражает выделение из более широкой общности. Формулировка сохраняет заметное повторение исходного текста и не устраняет возможный смысловой акцент.
- source_word: וְכָל שְׁלָלָם
  choice: и всю добычу
  rationale: שָׁלָל — военная добыча. В русском контексте принадлежность добычи участникам похода понятна без тяжеловесного местоимения, референция которого могла бы стать неясной.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: отправило царю Дамаска
  rationale: Выражение естественно обозначает правителя, чья власть была сосредоточена в Дамаске; «царь Дамаска» является точной и привычной исторической формулой.
