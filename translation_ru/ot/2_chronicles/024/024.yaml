  rationale: Правка устраняет невыраженное в оригинале уточнение «иудеи», сохраняет множественное число שְׁפָטִים в основном тексте, добавляет пропущенную сноску к идиоме «в их руки» и делает первый оборот более естественным по-русски. Причинная связь и судебно-карательный смысл стиха сохранены без конфессионального истолкования.
