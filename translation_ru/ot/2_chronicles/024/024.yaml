  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: ru
  text: Ибо войско Арама пришло с немногими людьми[a], но Яхве отдал весьма многочисленное войско в их руки[b], потому что они оставили Яхве, Бога своих отцов. И над Иоасом они совершили суды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с небольшим числом людей».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в их руки»; еврейский оборот означает «в их власть».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское слово стоит во множественном числе и может обозначать кары, исполненные над Иоасом. Или: «совершили суд над Иоасом».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְמִצְעַר אֲנָשִׁים
  choice: с малым числом людей
  rationale: Передаёт малочисленность пришедшего арамейского войска и сохраняет явный контраст с весьма многочисленным войском Иудеи.
- source_word: חֵיל אֲרָם
  choice: войско Арама
  rationale: В данном военном контексте חֵיל обозначает войско; имя Арам передано непосредственно, без замены на более позднее географическое название «Сирия».
- source_word: נָתַן בְּיָדָם
  choice: отдал в их руки
  rationale: Сохранён прозрачный для русского читателя древнееврейский образ передачи противника под чью-либо власть.
- source_word: חַיִל לָרֹב מְאֹד
  choice: весьма многочисленное войско
  rationale: Сочетание לָרֹב מְאֹד подчёркивает численное превосходство; такой перевод естественнее по-русски, чем буквальное «очень великое войско».
- source_word: עָזְבוּ
  choice: оставили
  rationale: Глагол обозначает отступление от Яхве; «оставили» сохраняет серьёзность разрыва, не добавляя отсутствующего в тексте пояснения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Бога своих отцов
  rationale: Сохраняется родовая и заветная формулировка оригинала.
- source_word: וְאֶת יוֹאָשׁ עָשׂוּ שְׁפָטִים
  choice: А над Иоасом арамеи совершили суд
  rationale: Русская формулировка передаёт карательно-судебный смысл שְׁפָטִים. Явное «арамеи» естественно восстанавливает подлежащее из контекста и устраняет неясность русского местоимения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Богословское осмысление победы арамеев
  choice: Яхве отдал иудейское войско в руки арамеев, а те совершили суд над Иоасом
  alternative: Арамеи лишь одержали победу и наказали Иоаса
  rationale: Текст прямо связывает поражение с тем, что иудеи оставили Яхве, и описывает действия над Иоасом судебной лексикой; перевод сохраняет эту причинную связь, не уточняя сверх текста, каким именно образом был совершён суд.
- issue: Референт подлежащего עָזְבוּ
  choice: иудеи
  alternative: они
  rationale: По контексту Яхве оставило многочисленное войско, отданное арамеям, то есть сторона Иоаса. Экспликация необходима в русском переводе, поскольку два множественных участника делают местоимение «они» двусмысленным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для обычного читателя; сохранены имя Яхве, образ «в руки» и судебная напряжённость заключительной фразы.
