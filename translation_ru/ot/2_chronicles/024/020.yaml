  source_fidelity: 'Основной смысл передан точно: Дух Божий наделяет Захарию силой, он обращается к народу с пророческим обличением, а повтор «оставили / оставил» сохраняет ответную симметрию еврейского עזב. Однако «на возвышении перед народом» превращает пространственное «над/выше народа» в конкретизацию, которой в тексте нет, и одновременно ослабляет вертикальный смысл מֵעַל.'
