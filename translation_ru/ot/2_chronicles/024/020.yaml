  to: 'И Дух Божий облёк Захарию[a], сына священника Иодая; тот встал над народом и сказал им: «Так говорит Бог: почему вы преступаете заповеди Яхве, так что не преуспеваете[b]? Вы оставили Яхве — и Он оставил вас».'
