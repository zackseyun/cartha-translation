source:
  edition: WLC
  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: ru
  text: 'И Дух Божий облёк Захарию[a], сына священника Иодая; тот встал над народом и сказал им: «Так говорит Бог: почему вы преступаете заповеди Яхве, так что не преуспеваете[b]? Вы оставили Яхве — и Он оставил вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух Божий сошёл на Захарию»; буквально: «облёк Захарию».'
    reason: Лексическая альтернатива поясняет необычную метафору, не устраняя её из основного текста.
  - marker: b
    text: 'Или: «и не будете преуспевать».'
    reason: Еврейский союз допускает как результативное прочтение, так и присоединение отдельного следствия; форма глагола может относить его к будущему.
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: И Дух Божий
  rationale: Сочетание обозначает действующего Божьего Духа, наделяющего пророка силой; прописная буква передаёт личную божественную деятельность, не превращая выражение в безличный порыв.
- source_word: לָבְשָׁה אֶת זְכַרְיָה
  choice: облёк Захарию
  rationale: Сохранён яркий образ глагола לבשׁ — «одевать, облекать». Необычность русской конструкции намеренно отражает необычность еврейской метафоры; более ясное смысловое соответствие дано в сноске.
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: Захарию, сына священника Иодая
  rationale: Определение «священник» по наиболее естественному синтаксическому прочтению относится к Иодаю. Русский порядок слов устраняет ненужную грамматическую двусмысленность.
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: встал на возвышении перед народом
  rationale: 'Так естественно передаётся пространственный смысл מֵעַל: Захария находился выше собравшихся, вероятно на возвышенном месте, и обращался к ним. Перевод «над народом» по-русски мог бы ошибочно указывать на власть или господство.'
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: Так говорит Бог
  rationale: Сохранена традиционная торжественная формула пророческого послания при естественном современном русском синтаксисе.
- source_word: לָמָה אַתֶּם עֹבְרִים אֶת מִצְוֺת יְהוָה
  choice: почему вы преступаете заповеди Яхве
  rationale: Глагол עבר при заповедях означает переход установленной границы, то есть нарушение. «Преступаете» сохраняет как образ, так и нравственно-заветную силу выражения.
- source_word: וְלֹא תַצְלִיחוּ
  choice: так что не имеете успеха
  rationale: В контексте союз ו может вводить результат нарушения заповедей. Настоящее время подходит к продолжающемуся обличению; возможное прочтение как отдельного следствия в будущем отмечено в сноске.
- source_word: כִּי עֲזַבְתֶּם אֶת יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: Вы оставили Яхве — и Он оставил вас
  rationale: Одинаковый русский глагол сохраняет намеренную взаимность еврейского עזב в обеих частях. Тире подчёркивает причинно-ответную связь без добавления слова «также», которого в тексте нет.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон — личное заветное имя Бога. Форма «Яхве» передаёт его как имя и не заменяет титулом.
- issue: Характер действия רוּחַ אֱלֹהִים
  choice: Дух Божий как действующий божественный субъект
  alternative: дух от Бога; божественный порыв
  rationale: В повествовании Дух является грамматическим субъектом, который овладевает пророком и наделяет его силой для провозглашения. Перевод не сводит это действие к настроению человека, но и не добавляет позднейших догматических формулировок.
- issue: Взаимность оставления Бога и народа
  choice: сохранить одинаковый глагол «оставить»
  alternative: «вы отступили от Яхве, и Он покинул вас»
  rationale: 'Повтор עזב создаёт богословски значимую симметрию: действие Бога представлено как ответ на действие народа. Разные русские глаголы ослабили бы эту связь.'
translation_notes:
  register: Современный литературный русский с торжественностью пророческой речи. Архаизмы ограничены словом «облёк», необходимым для сохранения исходной метафоры, и глаголом «преступаете», который остаётся понятным в сочетании с «заповедями». Прямая речь ритмически подчёркивает обвинение и ответное оставление.
