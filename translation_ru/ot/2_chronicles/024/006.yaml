base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: ru
  text: 'Тогда царь призвал Иодая, стоявшего во главе[a], и сказал ему: «Почему ты не потребовал от левитов принести из Иудеи и Иерусалима сбор Моисея, слуги Господа, и общины Израиля для Шатра свидетельства[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Иодая, главного» или «Иодая, главу».'
    reason: Еврейское הָרֹאשׁ означает «главный, глава»; в этом стихе оно само по себе не называет Иодая первосвященником.
  - marker: b
    text: 'Буквально: «сбор Моисея, слуги Господа, и общины Израиля для Шатра свидетельства». Синтаксис допускает также понимание: «сбор, установленный Моисеем для общины Израиля».'
    reason: Еврейская цепочка существительных не уточняет однозначно, как именно связаны Моисей, община Израиля и сбор. Сноска поясняет возможное истолкование, не выдавая его за единственное.
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: стоявшего во главе
  rationale: Передаёт значение «глава, главный» естественным современным русским языком, не добавляя отсутствующее в данном стихе слово «священник».
- source_word: דָרַשְׁתָּ עַל
  choice: потребовал от
  rationale: В сочетании с предлогом עַל и последующим поручением глагол означает настойчиво потребовать или взыскать исполнение обязанности.
- source_word: מַשְׂאַת
  choice: сбор
  rationale: В данном контексте речь идёт об обязательном денежном приношении на святилище; «сбор» сохраняет связь и с налогом, и с религиозным приношением.
- source_word: אֹהֶל הָעֵדוּת
  choice: Шатёр свидетельства
  rationale: Формально передаёт оба элемента еврейского выражения и сохраняет установленную библейскую образность.
- source_word: עֶבֶד יְהוָה
  choice: слугой Господа
  rationale: «Слуга» естественно и точно передаёт עֶבֶד в почётном обозначении Моисея; традиционная передача имени יהוה как «Господь» уместна в русском библейском регистре.
theological_decisions:
- issue: Кем был установлен сбор
  choice: «установленный Моисеем … и общиной Израиля»
  alternative: «сбор Моисея … и общины Израиля»
  rationale: Еврейская конструкция с מַשְׂאַת допускает буквальное притяжательное прочтение, но по контексту обозначает сбор, предписанный Моисеем и принятый общиной. Добавленное «установленный» делает связь ясной, не превращая её в частное богословское толкование.
- issue: Статус Иодая
  choice: не добавлять титул «первосвященник»
  alternative: «первосвященника Иодая»
  rationale: Хотя контекст связывает Иодая со священством, в этом стихе стоит только הָרֹאשׁ, «главный/глава»; перевод сохраняет формулировку источника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён ровно настолько, чтобы длинная исходная фраза оставалась понятной; терминология не привязана к отдельной конфессиональной традиции.
