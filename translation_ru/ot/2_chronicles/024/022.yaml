base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: ru
  text: 'Но царь Иоас не помнил о милости[a], которую оказал ему Иодай, его отец[b], и убил сына Иодая. Умирая, сын Иодая сказал: «Пусть Яхве увидит и взыщет за это[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о верности», «о преданной любви».'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «его отец», вероятно, указывают не на биологическое отцовство, а на отцовскую роль Иодая: он сохранил Иоасу жизнь и помог ему взойти на престол.'
    reason: cultural_note
  - marker: c
    text: 'Или: «и призовёт к ответу». Еврейский глагол может означать, что Бог разыщет виновного или расследует вину, чтобы потребовать ответа за неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא זָכַר
  choice: не помнил
  rationale: Сохраняет прямое значение глагола זכר, не превращая подразумеваемую неблагодарность в явное толкование.
- source_word: הַחֶסֶד
  choice: о милости
  rationale: חֶסֶד здесь обозначает проявленную к человеку доброту и верность; «милость» естественно передаёт весомое благодеяние, сохраняя более широкий смысл слова в примечании.
- source_word: יְהוֹיָדָע אָבִיו
  choice: Иодай, его отец
  rationale: Буквально сохраняет אָבִיו («его отец»), хотя в контексте речь, вероятно, идёт об отцовской роли Иодая по отношению к Иоасу, а не о биологическом отцовстве.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: и убил сына Иодая
  rationale: В контексте суффикс указывает на сына Иодая, Захарию. Повтор имени устраняет нежелательную русскую двусмысленность местоимения «его», не добавляя нового содержания.
- source_word: וּכְמוֹתוֹ
  choice: Умирая
  rationale: 'Передаёт временное значение конструкции: слова были произнесены при наступлении смерти, а не после неё.'
- source_word: יֵרֶא יְהוָה
  choice: Пусть Яхве увидит
  rationale: Юссив выражает обращённое к Богу пожелание или призыв, а не простое утверждение о будущем.
- source_word: וְיִדְרֹשׁ
  choice: и взыщет за это
  rationale: דרש в контексте вины может обозначать расследование и привлечение к ответу. «Взыщет за это» кратко передаёт судебный оттенок, не сводя его исключительно к мести.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, непосредственно присутствующее в еврейском тексте, а не заменяет его титулом.
theological_decisions:
- issue: Смысл предсмертного обращения Захарии
  choice: призыв к Яхве увидеть совершённую несправедливость и взыскать за неё
  alternative: прямая просьба об отмщении либо простое утверждение, что Господь видит
  rationale: Формы יֵרֶא и וְיִדְרֹשׁ выражают пожелание или призыв к Божьему судебному вмешательству, но сам текст не уточняет форму воздаяния; эта напряжённость сохранена.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис сделан ясным для обычного читателя; умеренно возвышенное «взыщет» поясняется в сноске. Имя Яхве транслитерировано из יהוה.
