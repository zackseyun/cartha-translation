base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: ru
  text: После смерти Иодая пришли правители Иудеи[a] и поклонились царю. Тогда царь прислушался к ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князья Иудеи»; или: «вельможи Иудеи».'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение может также означать: «послушался их» или «согласился с ними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת יְהוֹיָדָע
  choice: После смерти Иодая
  rationale: Временная конструкция естественно передаётся по-русски без начального союза; личное имя дано в принятой русской библейской форме.
- source_word: בָּאוּ
  choice: пришли
  rationale: Обычный глагол движения; не уточняет место или характер прибытия сверх сказанного в контексте.
- source_word: שָׂרֵי יְהוּדָה
  choice: вельможи Иудеи
  rationale: שָׂרִים обозначает высокопоставленных правителей, начальников или князей. «Вельможи» ясно передаёт их высокий общественно-политический статус, не утверждая наследственного княжеского титула.
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: и поклонились царю
  rationale: Передаёт жест почтения перед человеческим царём, не истолковывая его как религиозное поклонение.
- source_word: אָז
  choice: Тогда
  rationale: Отмечает следующий, связанный с предшествующим, шаг повествования.
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: царь прислушался к ним
  rationale: Идиома שׁמע אל может означать как внимательное слушание, так и принятие совета или уступку. «Прислушался к ним» сохраняет этот смысловой диапазон лучше, чем нейтральное «выслушал» или однозначное «повиновался».
theological_decisions:
- issue: Характер поклона вельмож царю
  choice: поклонились царю
  alternative: простёрлись перед царём; воздали царю почести; поклонились царю как божеству
  rationale: Еврейский глагол обозначает поклон или простирание ниц и в разных контекстах может выражать почтение либо поклонение. Поскольку действие обращено к человеческому царю, перевод сохраняет физический жест и не вводит утверждение о религиозном поклонении.
- issue: Степень согласия царя с вельможами
  choice: прислушался к ним
  alternative: выслушал их; послушался их
  rationale: Фраза допускает оттенок принятия их предложения, но сам стих не формулирует степень согласия отдельно; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. «Вельможи» употреблено как понятное обозначение высокопоставленных руководителей; синтаксис краток и естественен.
