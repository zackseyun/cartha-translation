base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/003.yaml
  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: ru
  text: Иодай взял для него двух жён[a], и он стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятнее всего, Иодай взял двух жён для Иоаса, и Иоас стал отцом сыновей и дочерей. Менее вероятно: «Иодай взял себе двух жён и стал отцом сыновей и дочерей», если субъектом всего стиха считать Иодая.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: взял
  rationale: В сочетании с נָשִׁים глагол נשׂא обозначает взятие в жёны; оборот с לֹו показывает, что Иодай устроил брак для другого лица.
- source_word: לֹו
  choice: для него
  rationale: Предлог с местоименным суффиксом обозначает лицо, в пользу которого действует Иодай; по контексту это царь Иоас.
- source_word: יְהוֹיָדָע
  choice: Иодай
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: נָשִׁים שְׁתָּיִם
  choice: двух жён
  rationale: В брачном контексте נָשִׁים означает жён, а числительное явно сохранено.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד при мужском субъекте означает «произвести на свет, стать отцом»; современная формулировка естественна и сохраняет указание на мужского родителя.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновей и дочерей
  rationale: Перевод сохраняет явное различение сыновей и дочерей в еврейском тексте.
theological_decisions:
- issue: Кто является субъектом וַיּוֹלֶד и к кому относится לֹו
  choice: Иодай взял двух жён для Иоаса, а Иоас стал отцом сыновей и дочерей.
  alternative: Иодай сам взял двух жён и стал отцом сыновей и дочерей.
  rationale: Местоимение «для него» и общий контекст повествования об Иоасе поддерживают отнесение брака и детей к Иоасу. Однако ближайшим прямо названным субъектом остаётся Иодай, поэтому грамматически возможно и альтернативное прочтение; оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Формулировка «и тот» естественно указывает на ранее подразумеваемого Иоаса и не приписывает отцовство Иодаю без оговорки; сноска сохраняет грамматическую неоднозначность исходного текста.
