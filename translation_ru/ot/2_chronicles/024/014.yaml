base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: ru
  text: Когда они закончили, то принесли царю и Иехояде оставшееся серебро[a]. Из него он[b] изготовил утварь для дома Яхве — утварь для служения и для возношения[c], чаши, а также золотые и серебряные предметы. Во все дни Иехояды в доме Яхве постоянно возносили всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «деньги»; здесь оно передано как «серебро», поскольку далее речь идёт об изготовлении предметов из золота и серебра.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и он сделал его». Деятель прямо не назван; единственное число глагола и суффикса сохранено в переводе. «Его» относится к оставшемуся серебру.'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Буквально: «для возношения»; что именно возносили с помощью этих предметов, здесь не уточняется. Далее в стихе прямо названы всесожжения.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: Когда они закончили
  rationale: Временная конструкция с инфинитивом и местоименным суффиксом множественного числа. Дополнение в еврейском тексте не названо, поэтому перевод не добавляет «работу».
- source_word: שְׁאָר הַכֶּסֶף
  choice: оставшиеся деньги
  rationale: כֶּסֶף означает как серебро, так и деньги. Контекст сбора средств и последующего изготовления золотых и серебряных предметов делает значение «деньги» наиболее связным; буквальное значение отмечено в сноске.
- source_word: וַיַּעֲשֵׂהוּ
  choice: На них он изготовил
  rationale: Еврейская форма буквально означает «и он сделал его». Русская формулировка передаёт употребление оставшихся средств на изготовление храмовых предметов, сохраняя единственное число деятеля; невыраженный субъект пояснён в сноске.
- source_word: כֵלִים
  choice: принадлежности
  rationale: Широкое обозначение предметов и утвари. «Принадлежности» естественно охватывает разные храмовые предметы, не сужая значение до сосудов.
- source_word: כְּלֵי שָׁרֵת
  choice: принадлежности для служения
  rationale: שָׁרֵת обозначает служение, здесь храмовое. Формулировка сохраняет культовый смысл и понятна современному читателю.
- source_word: וְהַעֲלוֹת
  choice: для возношения
  rationale: Инфинитив עלה указывает на действие возношения, но его объект здесь не назван. Открытая формулировка не подставляет заранее «жертвы» или «всесожжения».
- source_word: וְכַפּוֹת
  choice: чаши
  rationale: כַּפּוֹת — культовые сосуды неопределённой точной формы; «чаши» является ясным и достаточно широким соответствием.
- source_word: וּכְלֵי זָהָב וָכָסֶף
  choice: золотые и серебряные принадлежности
  rationale: Передаёт материал предметов естественной русской конструкцией и сохраняет повтор широкого слова כֵלִים.
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: постоянно возносили всесожжения
  rationale: Сочетание формы היה с причастием и תָּמִיד описывает продолжительное или регулярно повторявшееся действие; «постоянно» сохраняет этот аспект.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога; транслитерация «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Продолжительность жертвоприношений
  choice: Во все дни Иехояды ... постоянно возносили всесожжения
  alternative: Приносили всесожжения во все дни Иехояды
  rationale: Формулировка сохраняет указание еврейской конструкции на устойчивую, регулярно продолжавшуюся практику, не утверждая непрерывность в буквальном поминутном смысле.
- issue: Не названный субъект וַיַּעֲשֵׂהוּ
  choice: он, с пояснением в сноске
  alternative: были изготовлены / изготовили
  rationale: Еврейский глагол стоит в единственном числе, но субъект прямо не назван. Перевод сохраняет число, а сноска не позволяет безоговорочно отождествить деятеля с Иехоядой.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Синтаксис упрощён до двух ясных предложений без утраты последовательности. Имя Иехояда передано близко к еврейской форме; термин «всесожжения» сохранён как общепонятное библейское культовое обозначение.
