  source_fidelity: 'Перевод точно передаёт последовательность и основные элементы еврейского текста: Иоас собирает священников и левитов, посылает их в города Иудеи, поручает собирать серебро «со всего Израиля», велит поспешить и затем отмечает, что левиты не поспешили. Повтор «поспешите / не поспешили» удачно воспроизводит повтор глагола מהר. «Из года в год» корректно передаёт ежегодную регулярность, а «восстанавливать» в данном строительном контексте приемлемо передаёт לְחַזֵּק.'
