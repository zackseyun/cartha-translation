  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: ru
  text: 'И собрал он священников и левитов и сказал им: «Отправляйтесь в города Иудеи и собирайте со всего Израиля серебро[a], чтобы из года в год восстанавливать дом вашего Бога[b]. Поспешите с этим делом». Но левиты не поспешили.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деньги». В еврейском тексте буквально «серебро»; серебро использовалось как средство платежа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «укреплять дом вашего Бога». В данном строительном контексте речь идёт о ремонте и восстановлении храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Глагол קבץ в породе qal означает собрать людей; русский глагол «собрал» естественно сочетается со священниками и левитами.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: отправляйтесь в города Иудеи
  rationale: Императив יצא передаёт начало движения; «отправляйтесь» естественно выражает это значение, а предложная конструкция сохраняет указание места назначения.
- source_word: וְקִבְצוּ מִכָּל יִשְׂרָאֵל כֶּסֶף
  choice: и собирайте со всего Израиля серебро
  rationale: «Собирайте» уместно для регулярного сбора, «со всего Израиля» сохраняет широту исходного выражения, а «серебро» передаёт конкретное כֶּסֶף, которое могло служить деньгами.
- source_word: לְחַזֵּק אֶת בֵּית אֱלֹהֵיכֶם
  choice: чтобы ... восстанавливать дом вашего Бога
  rationale: В строительном контексте חזק означает укреплять или приводить здание в исправное состояние. «Восстанавливать» ясно передаёт практический смысл, тогда как «дом» сохраняет образ исходного текста.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: из года в год
  rationale: Устойчивое русское выражение точно передаёт регулярную ежегодную повторяемость.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר ... וְלֹא מִהֲרוּ
  choice: Поспешите с этим делом. Но левиты не поспешили
  rationale: Повтор одного корня מהר намеренно сохранён повтором «поспешите / не поспешили», что передаёт словесную связь и контраст оригинала.
theological_decisions:
- issue: Объём выражения מִכָּל יִשְׂרָאֵל («со всего Израиля»)
  choice: Сохранить «со всего Израиля»
  alternative: «со всех израильтян» или более узкое «со всей Иудеи»
  rationale: Текст прямо говорит об Израиле, хотя поручение связано с городами Иудеи. Буквальная формулировка сохраняет историко-богословское напряжение и не сужает значение до Иудеи.
- issue: Обозначение святилища как בֵּית אֱלֹהֵיכֶם
  choice: «дом вашего Бога»
  alternative: «храм вашего Бога»
  rationale: «Дом» сохраняет исходную метафору и обращение «вашего Бога», не заменяя их более истолковывающим словом «храм».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя; лексический повтор «поспешите / не поспешили» сохранён как значимый приём оригинала.
