base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: ru
  text: Иоасу было семь лет, когда он стал царём, и сорок лет он царствовал в Иерусалиме. Его мать звали Цивья; она была из Беэр-Шевы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: Иоасу было семь лет
  rationale: Еврейская формула возраста буквально означает «сын семи лет»; современная русская идиома точно и естественно передаёт её смысл.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция с ב отмечает время вступления на царство; выбранный перевод естественен по-русски и ясно выражает начало царствования.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол означает «царствовать, быть царём»; «царствовал» сохраняет его глагольную форму и соответствует формуле царских хроник.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог ב имеет обычное местное значение.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественный современный русский эквивалент формулы «имя его матери» без потери информации.
- source_word: צִבְיָה
  choice: Цивья
  rationale: Транслитерация еврейского личного имени с передачей согласной ב как «в» и конечного יה как «ья».
- source_word: מִבְּאֵר שָׁבַע
  choice: из Беэр-Шевы
  rationale: Префикс מ указывает на происхождение; название передано близкой к еврейской форме русской транслитерацией.
