  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: ru
  text: Они оставили дом Яхве, Бога своих отцов, и служили ашерам[a] и идолам. За эту их вину гнев обрушился на Иудею и Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столбам Ашеры». Еврейское слово обозначает культовые предметы, связанные с Ашерой, и может также отсылать к самой богине Ашере.'
    reason: Лексическая неоднозначность культурно-религиозного термина אֲשֵׁרִים.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: оставили
  rationale: Глагол עזב означает «оставить, покинуть». В контексте слово передаёт отступничество, оставаясь естественным для современного русского языка.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквально «дом Яхве»; выражение сохраняет образ оригинала и в данном контексте ясно обозначает храм.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие имени יהוה от титула «Господь».
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Бога своих отцов
  rationale: Сохраняется обычное для библейского повествования родовое и заветное выражение без модернизирующего истолкования.
- source_word: וַיַּעַבְדוּ
  choice: стали служить
  rationale: עבד применительно к божествам и культовым предметам означает религиозное служение или поклонение. «Служить» ближе к форме оригинала, а «стали» естественно передаёт последовательность повествования.
- source_word: הָאֲשֵׁרִים
  choice: ашерам
  rationale: 'Транслитерация сохраняет неоднозначность: множественное число может обозначать культовые предметы Ашеры и одновременно вызывать ассоциацию с самой богиней. Пояснение дано в сноске.'
- source_word: הָעֲצַבִּים
  choice: идолам
  rationale: Слово обозначает идолов или культовые изображения и несёт отрицательную религиозную оценку; «идолы» ясно передаёт эту силу.
- source_word: וַיְהִי קֶצֶף
  choice: гнев обрушился
  rationale: Еврейское выражение буквально сообщает, что «был/возник гнев». Русское «гнев обрушился» естественно передаёт наступление суда, не добавляя прямо не названного субъекта гнева.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: на Иудею и Иерусалим
  rationale: Предлог עַל при слове «гнев» указывает, на кого направлен или на кого нисходит гнев. Конструкция «обрушился на» естественна по-русски.
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: за эту их вину
  rationale: אַשְׁמָה выражает вину или виновное деяние, а בְּ имеет причинное значение. Формулировка сохраняет указательное «эту» и принадлежность вины им.
theological_decisions:
- issue: Чей именно гнев подразумевается
  choice: В основном тексте оставлено просто «гнев», без добавления «Божий» или «гнев Яхве».
  alternative: «Гнев Яхве обрушился» или «Божий гнев обрушился».
  rationale: Из контекста ясно, что имеется в виду Божий суд, однако еврейский текст прямо не называет обладателя гнева. Неявность оригинала сохранена.
- issue: Значение אֲשֵׁרִים
  choice: Сохранён транслитерированный термин «ашеры».
  alternative: «столбы Ашеры», «священные столбы» или «изваяния Ашеры».
  rationale: Еврейский термин может относиться к культовым предметам, связанным с богиней Ашерой, но их точный вид не назван. Транслитерация не разрешает эту неоднозначность за текст.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксис сделан естественным для повествования; культурно специфический термин сохранён и пояснён. Форма «Иудея» употреблена как привычное русское название страны/области, параллельное Иерусалиму.
