source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: ru
  text: И похоронили его в Городе Давида среди царей[a], потому что он делал добро в Израиле — для Бога и для Его дома[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе с царями».'
    reason: lexical_alternative
  - marker: b
    text: То есть для Бога и для Божьего дома — храма.
    reason: clarification
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: И похоронили его
  rationale: Еврейская форма — активный глагол во множественном числе с местоименным суффиксом 3-го лица мужского рода единственного числа; неопределённый субъект сохранён.
- source_word: בְעִיר דָּוִיד
  choice: в Городе Давида
  rationale: Сохранено традиционное географическое название; прописная буква подчёркивает функцию собственного имени.
- source_word: עִם הַמְּלָכִים
  choice: среди царей
  rationale: Буквально עִם означает «с», но в контексте погребения «среди царей» естественно передаёт погребение рядом с ними или в месте их захоронения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину оказанной ему погребальной чести.
- source_word: עָשָׂה טוֹבָה
  choice: он делал добро
  rationale: Выражение обозначает совершение добрых, благотворных дел; несовершенный вид по-русски естественно передаёт общую характеристику его деятельности.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог передан как указание на сферу, в которой совершалось добро.
- source_word: וְעִם הָאֱלֹהִים
  choice: для Бога
  rationale: Буквальное «с Богом» в современном русском здесь двусмысленно; «для Бога» естественно выражает направленность добрых дел и согласуется с последующим упоминанием Божьего дома.
- source_word: וּבֵיתוֹ
  choice: и для Его дома
  rationale: Местоименный суффикс сохранён; ближайший антецедент — Бог. Предлог «для» распространяется на однородный член и делает русскую фразу ясной.
theological_decisions:
- issue: К кому относится местоимение в וּבֵיתוֹ («его дом»)
  choice: 'К Богу: «Его дом», то есть храм'
  alternative: 'К Иодаю: его собственный дом или род'
  rationale: Ближайший грамматический антецедент — Бог, а повествовательный контекст подчёркивает служение Иодая храму. В основном тексте сохранено местоимение, а пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский, ясный и торжественно-сдержанный. Синтаксис близок к еврейскому, но направленность сочетания וְעִם הָאֱלֹהִים וּבֵיתוֹ передана естественным русским оборотом «для Бога и для Его дома».
