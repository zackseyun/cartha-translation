  terminology: «Город Давида», «цари», «Бог» и «Его дом» употреблены последовательно и понятно. Заглавная буква в «Городе Давида» допустима для устойчивого географического названия. Сноска корректно раскрывает «Его дом» как Божий дом, храм, не внося это толкование в основной текст.
