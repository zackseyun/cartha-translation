  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: ru
  text: Ведь нечестивая Гофолия и её сыновья разорили дом Бога, а все святыни дома Яхве использовали для Ваалов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделали для Ваалов». По контексту, вероятно, имеется в виду, что храмовые святыни использовали в культе Ваалов.'
    reason: Сохраняет буквальное значение глагола עשה и поясняет вероятный контекстуальный смысл, не добавляя представления о передаче или присвоении как несомненного факта.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущим контекстом естественным современным русским союзом.
- source_word: עֲתַלְיָהוּ הַמִּרְשַׁעַת
  choice: нечестивая Гофолия
  rationale: Сохраняет женский род характеристики и использует закрепившуюся в русской библейской традиции форму имени.
- source_word: בָּנֶיהָ
  choice: её сыновья
  rationale: Точно передаёт значение «сыновья», не заменяя его более общим словом «дети».
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: разорили дом Бога
  rationale: Глагол פרץ здесь обозначает насильственное нарушение целости и разорение храма; «разорили» лучше передаёт результат, чем узкое «ворвались».
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: все святыни дома Яхве
  rationale: «Святыни» естественно обозначает посвящённые храмовые предметы и сохраняет связь с буквальным значением святости.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: отдали на служение Ваалам
  rationale: В контексте речь идёт не об изготовлении святынь, а об их присвоении или употреблении для культа Ваалов; буквальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; форма «Яхве» прозрачно передаёт его как имя.
- issue: Множественное число בְּעָלִים
  choice: Ваалам
  alternative: Ваалу; идолам Ваала
  rationale: Сохранено множественное число исходного текста, которое может указывать на различные местные формы, изображения или культы Ваала.
- issue: Роль Гофолии в разорении храма
  choice: Гофолия и её сыновья разорили
  alternative: сыновья нечестивой Гофолии разорили
  rationale: Еврейская конструкция с вынесенным именем допускает синтаксическую напряжённость; контекст и согласование сказуемого во множественном числе позволяют включить Гофолию вместе с её сыновьями, не устраняя её ответственность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Выражение «дом Бога» сохраняет образ исходного текста, а не заменяет его словом «храм»; «дом Яхве» поддерживает лексическую связь внутри стиха.
