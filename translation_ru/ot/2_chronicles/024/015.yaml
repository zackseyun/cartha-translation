- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: ему было сто тридцать лет
  rationale: Древнееврейская возрастная формула с буквальным значением «сын ста тридцати лет» передана обычной современной русской конструкцией.
- source_word: בְּמוֹתוֹ
  choice: при смерти
  rationale: Предлог ב при существительном «смерть» с местоименным суффиксом имеет здесь временное значение и указывает возраст на момент смерти.
