  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: ru
  text: Иоас делал то, что было правильным в глазах Яхве, в течение всей жизни Иодая, священника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: делал
  rationale: Глагол עשה означает «делать, совершать». В сочетании с הַיָּשָׁר естественно передаётся как «делал то, что было правильно»; несовершенный вид уместен для продолжительного поведения на протяжении указанного времени.
- source_word: הַיָּשָׁר
  choice: то, что было правильно
  rationale: Субстантивированное прилагательное יָשָׁר означает «прямое, правильное, праведное». Формулировка «то, что было правильно» ясно передаёт оценочную царскую формулу, не усиливая её до более узкого понятия личной праведности.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранена понятная в современном русском языке древнееврейская метафора оценки с чьей-либо точки зрения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: כָּל יְמֵי
  choice: во все дни
  rationale: Близко передаёт буквальное временное выражение и сохраняет связь оценки Иоаса с периодом жизни Иодая.
- source_word: יְהוֹיָדָע
  choice: Иодай
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: הַכֹּהֵן
  choice: священника
  rationale: Титул Иодая передан прямо и без добавочного уточнения его сана.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; форма «Яхве» сохраняет отличие имени от титула.
- issue: Характер положительной оценки Иоаса
  choice: Оценка ограничена словами «во все дни священника Иодая»
  alternative: Обобщённая оценка всего царствования Иоаса
  rationale: Временное ограничение в еврейском тексте сохранено без сглаживания, поскольку оно существенно для богословского и повествовательного напряжения дальнейшего контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранена древнееврейская метафора «в глазах», понятная обычному читателю; порядок слов слегка адаптирован к русской норме.
