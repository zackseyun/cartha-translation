source:
  edition: WLC
  text: וַ/יְהִ֖י אַחֲרֵי כֵ֑ן הָיָה֙ עִם לֵ֣ב יוֹאָ֔שׁ לְ/חַדֵּ֖שׁ אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: ru
  text: После этого Иоас задумал восстановить[a] дом Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обновить»; возможно также: «отремонтировать».'
    reason: lexical_alternative
  - marker: b
    text: То есть храм Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временной переход к следующему этапу повествования, не воспроизводя избыточно буквально вводную конструкцию «и было».
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: Иоас задумал
  rationale: Передаёт внутреннее намерение Иоаса современным и естественным русским языком, не усиливая его до более решительного «твёрдо решил».
- source_word: לְחַדֵּשׁ
  choice: восстановить
  rationale: В контексте существующего храмового здания обозначает его обновление и приведение в прежнее состояние; это шире, чем отдельный ремонт.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет образ и форму еврейского выражения «дом Яхве», тогда как по контексту речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Образное выражение בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Основной текст сохраняет исходную метафору «дом», а сноска поясняет её конкретное значение в данном контексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Идиома о сердце передана естественным глаголом намерения; буквальный образ «дом Яхве» сохранён и пояснён в сноске.
