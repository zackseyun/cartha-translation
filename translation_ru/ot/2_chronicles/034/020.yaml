base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: ru
  text: 'И царь повелел Хелкии, Ахикаму, сыну Сафана, Авдону, сыну Михи[a], писцу Сафану и Асаии, слуге царя[b], сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В масоретском тексте здесь: «Авдон, сын Михи». В параллельном месте, 4 Царств 22:12, стоит: «Ахбор, сын Михея».'
    reason: textual_variant
  - marker: b
    text: 'Или: «Асаии, царскому служащему». Буквально по-еврейски: «слуге царя»; это выражение могло обозначать придворного должностного лица.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: И царь повелел
  rationale: Глагол צוה выражает властное распоряжение; «повелел» естественно передаёт силу царского приказа и сохраняет повествовательную связь וַ־.
- source_word: חִלְקִיָּהוּ
  choice: Хелкии
  rationale: Традиционная русская передача личного имени; дательный падеж обусловлен управлением глагола «повелел».
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ахикаму, сыну Сафана
  rationale: Патроним передан явно и естественно для современного русского повествования.
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: Авдону, сыну Михи
  rationale: Перевод следует масоретскому тексту Паралипоменон; отличие параллельного места отмечено в сноске.
- source_word: שָׁפָן הַסּוֹפֵר
  choice: писцу Сафану
  rationale: סֹפֵר может обозначать писца или царского секретаря; «писец» сохраняет прямое лексическое значение без излишнего уточнения должности.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Асаии, слуге царя
  rationale: Буквальное значение עֶבֶד — «слуга»; в придворном контексте слово может обозначать царского служащего или сановника, что отмечено в сноске.
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Сохранена еврейская формула введения прямой речи; двоеточие показывает, что содержание повеления следует в следующем стихе.
