  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: ru
  text: Перед ним разрушили жертвенники Ваалов, а курильные алтари[a], стоявшие над ними, он срубил. Ашеры[b], резные изваяния и литые изображения он разбил, истолок в прах и рассеял их прах по поверхности могил тех, кто приносил им жертвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «солнечные столбы». Значение еврейского слова не вполне ясно; возможно, оно обозначает культовые столбы, связанные с поклонением солнцу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «столбы Ашеры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: разрушили
  rationale: Форма множественного числа сохранена; глагол נתץ обозначает разрушение или снос сооружений.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Естественно передаёт буквальное значение «перед его лицом», то есть в присутствии Иосии.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: жертвенники ваалов
  rationale: Множественное בְּעָלִים сохранено как указание на местные проявления или культовые образы Ваала.
- source_word: הַחַמָּנִים
  choice: курильные алтари
  rationale: Термин не вполне ясен; выбран контекстуально возможный смысл, а альтернатива, связанная с солнечным культом, вынесена в сноску.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: стоявшие над ними
  rationale: Относительное предложение отнесено к курильным алтарям и передано естественно по-русски.
- source_word: גִּדֵּעַ
  choice: срубил
  rationale: Глагол означает отсечь или срубить и подчёркивает уничтожение возвышавшихся культовых предметов.
- source_word: הָאֲשֵׁרִים
  choice: Ашеры
  rationale: Транслитерация сохраняет неоднозначность между культовыми предметами и объектами, связанными с богиней Ашерой.
- source_word: הַפְּסִלִים
  choice: резные изваяния
  rationale: Передаёт конкретное значение высеченных или вырезанных культовых изображений, не сводя его к общему слову «идолы».
- source_word: הַמַּסֵּכוֹת
  choice: литые изображения
  rationale: Точно указывает на изображения, изготовленные литьём из металла.
- source_word: שִׁבַּר
  choice: разбил
  rationale: Передаёт энергичное разрушение предметов без стилистического преувеличения.
- source_word: וְהֵדַק
  choice: истолок в прах
  rationale: Выражает значение измельчения до мелких частиц или порошка полнее, чем нейтральное «раздробил».
- source_word: וַיִּזְרֹק
  choice: рассыпал
  rationale: По контексту речь идёт о рассеивании измельчённых остатков; русский глагол естественно передаёт результат предыдущего действия.
theological_decisions:
- issue: Передача הָאֲשֵׁרִים
  choice: Ашеры
  alternative: столбы Ашеры
  rationale: Транслитерация не ограничивает значение только деревянными столбами и сохраняет неопределённость относительно точного вида культовых предметов.
- issue: Передача הַחַמָּנִים
  choice: курильные алтари
  alternative: солнечные столбы
  rationale: Лексическое значение спорно. В основном тексте дан подходящий контексту вариант, а возможная связь с солнечным культом отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксическое различие между множественным «разрушили» и единственным «он срубил… разбил» сохранено; редкие культовые термины пояснены сносками.
