  source_fidelity: В целом перевод точно передаёт смену множественного действия («разрушили») и последующих действий в единственном числе, а также перечисление культовых предметов. Однако в последнем действии полезно явно назвать рассеянный прах и передать על־פני как «по поверхности», чтобы не оставлять в русском тексте неясный эллипсис и несколько точнее отразить еврейский предлог.
  naturalness: Стиль современный и литературный. Перестановка определения при «курильных алтарях» делает фразу легче для чтения. Формула «рассеял их прах по поверхности могил» яснее, чем «рассыпал по могилам», где объект глагола в русском остаётся неназванным.
  terminology: «Ваалы», «ашеры», «резные изваяния» и «литые изображения» уместно сохраняют различия еврейских терминов. Неопределённое הַחַמָּנִים передано контекстуально, а значимая альтернатива надлежащим образом сохранена в сноске. «Ашеры» не следует уточнять в основном тексте как столбы, поскольку это сузило бы значение спорного термина.
