  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: ru
  text: Тогда царь послал за всеми старейшинами Иудеи и Иерусалима и собрал их[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Тогда царь послал и собрал всех старейшин Иудеи и Иерусалима».'
