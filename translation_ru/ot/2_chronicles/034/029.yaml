lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал за
  rationale: Глагол שׁלח буквально означает «послал». В данном контексте русское «послал за» естественно передаёт подразумеваемый вызов старейшин, не уточняя, кого именно царь отправил.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное передано обычным русским титулом. Хотя из контекста ясно, что речь об Иосии, еврейский текст здесь сохраняет титул.
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: Глагол אָסף означает «собирать, созывать». «Собрал» сохраняет самостоятельное действие царя и последовательность двух глаголов.
- source_word: אֶת כָּל
  choice: всеми … их
  rationale: כָּל передано словом «всеми», сохраняющим полноту охвата; местоимение «их» добавлено по нормам русского синтаксиса как прямое дополнение к «собрал» и относится к тем же старейшинам.
- source_word: זִקְנֵי
  choice: старейшинами
  rationale: Здесь זָקֵן обозначает признанных общественных руководителей, а не просто пожилых мужчин; «старейшины» — точный и устойчивый русский эквивалент.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Иудеи и Иерусалима
  rationale: Родительный падеж естественно обозначает принадлежность старейшин обеим названным областям — Иудее и Иерусалиму.
theological_decisions: []
