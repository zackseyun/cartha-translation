source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: ru
  text: «Пойдите и вопросите Яхве обо мне и об остатке Израиля и Иуды — о словах найденной книги[a], потому что велик гнев Яхве, излившийся на нас за то, что наши отцы[b] не соблюдали слово Яхве и не исполняли всего написанного в этой книге».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «найденного свитка». Еврейское סֵפֶר может обозначать книгу, письменный документ или свиток.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наши предки». Буквально: «наши отцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: вопросите Яхве
  rationale: В контексте царского повеления глагол דרשׁ означает обращение к Богу за ответом и руководством; «вопросите» передаёт целенаправленное обращение, а не только благочестивое искание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: בַּעֲדִי
  choice: обо мне
  rationale: Предлог בעד обозначает действие в чьих-либо интересах или от чьего-либо имени; при глаголе «вопросить» русское «обо мне» естественно выражает предмет ходатайственного вопрошания.
- source_word: וּבְעַד הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: и об остатке Израиля и Иуды
  rationale: הנשאר — собирательное обозначение тех, кто остался; «остаток» сохраняет историко-богословский оттенок и краткость оригинала.
- source_word: עַל דִּבְרֵי הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: о словах найденной книги
  rationale: Передаёт предмет вопрошания и естественно свёртывает относительную конструкцию «книги, которая была найдена», не меняя смысла.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: велик гнев Яхве
  rationale: Сохраняет вынесенное вперёд сказуемое и усиленный, торжественный строй еврейской фразы.
- source_word: נִתְּכָה בָנוּ
  choice: излившийся на нас
  rationale: Nifal от נתך здесь образно описывает гнев как излитый; причастный оборот естественно связывает выражение с существительным «гнев».
- source_word: אֲבוֹתֵינוּ
  choice: наши отцы
  rationale: Буквально сохраняет грамматически мужское обозначение предшествующих поколений; современное «предки» отмечено как допустимая альтернатива.
- source_word: לֹא שָׁמְרוּ ... לַעֲשׂוֹת
  choice: не соблюдали ... и не исполняли
  rationale: שׁמר означает хранить или соблюдать, а инфинитив עשׂה раскрывает практическое исполнение. Координация по-русски ясно передаёт тесную смысловую связь, не превращая её в отвлечённую цель.
- source_word: כְּכָל הַכָּתוּב עַל הַסֵּפֶר הַזֶּה
  choice: всего написанного в этой книге
  rationale: Русский идиом требует «написанного в книге», хотя еврейский использует על; «всего» сохраняет полный охват предписаний.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Передача אֲבוֹתֵינוּ
  choice: наши отцы
  alternative: наши предки
  rationale: Основной текст сохраняет конкретную мужскую форму оригинала, а более широкая современная передача вынесена в примечание.
- issue: Связь לַעֲשׂוֹת с «соблюдали»
  choice: и не исполняли всего написанного
  alternative: чтобы поступать по всему написанному
  rationale: Инфинитив может раскрывать содержание соблюдения или его практическую направленность. Выбранная формулировка передаёт смысл исполнения, не вводя причинно-целевого оттенка сильнее, чем позволяет текст.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Вопросите» выбрано как понятное в контексте официального обращения за Божьим ответом; синтаксис упрощён лишь там, где буквальное воспроизведение было бы неестественно по-русски.
