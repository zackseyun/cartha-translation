  language: ru
  text: И в городах Манассии, Ефрема и Симеона, вплоть до Неффалима, среди окрестных развалин.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная фраза еврейского текста трудна; её буквальное чтение и синтаксическая связь не вполне ясны. Многие переводы понимают её как указание на окрестные развалины или опустошённые места.
    reason: textual_variant
  - marker: b
    text: Согласный текст допускает более буквальное прочтение «их дома», однако контекст разрушения культовых мест лучше согласуется со значением «развалины» или «опустошённые места».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: и в городах
  rationale: Переданы и союз, и предлог. «Города» — обычный и естественный эквивалент עָרִים в историческом повествовании.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: Манассии, Ефрема и Симеона
  rationale: Использованы закрепившиеся в русской библейской традиции формы географических и родоплеменных названий; цепочка союзов естественно передана русским перечислением.
- source_word: וְ/עַד נַפְתָּלִי
  choice: вплоть до Неффалима
  rationale: עַד обозначает предел распространения действия; «вплоть до» ясно передаёт подчёркнутую географическую протяжённость.
- source_word: ב/הר בתי/הם
  choice: среди развалин в их окрестностях
  rationale: Конечная фраза еврейского текста трудна. Контекст разрушения культовых мест поддерживает значение «развалины, опустошённые места», тогда как местоименная связь естественно отнесена к названным территориям.
- source_word: סָבִיב
  choice: в их окрестностях
  rationale: סָבִיב указывает на окружающее пространство; такое выражение современно и естественно по-русски, не создавая искусственного образа «окружающих развалин».
