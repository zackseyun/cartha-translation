base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: ru
  text: Люди добросовестно выполняли работу. Над ними были поставлены Иахат и Овадия, левиты из потомков Мерари, а также Захария и Мешуллам, из потомков каафитян, чтобы руководить[a]; также были поставлены левиты — все, кто умел играть на музыкальных инструментах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осуществлять надзор». Еврейский глагол может обозначать руководство и надзор за работой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все разумеющие в орудиях песни», то есть умевшие пользоваться музыкальными инструментами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: добросовестно
  rationale: Существительное употреблено наречно и характеризует надёжность и честность работников, а не их субъективную веру. «Добросовестно» естественно передаёт этот смысл по-русски.
- source_word: בַּמְּלָאכָה
  choice: выполняли работу
  rationale: מְלָאכָה обозначает порученную работу, здесь — восстановление храма. Глагольно-именная конструкция звучит естественно в современном русском.
- source_word: מֻפְקָדִים
  choice: были поставлены
  rationale: Пассивная форма глагола פקד указывает на назначение ответственными; перевод сохраняет пассивность, не подменяя её заранее конкретным названием должности.
- source_word: יַחַת
  choice: Иахат
  rationale: Передача собственного имени в форме, привычной для русской библейской традиции.
- source_word: עֹבַדְיָהוּ
  choice: Овадия
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: מִן בְּנֵי מְרָרִי
  choice: из потомков Мерари
  rationale: «Потомки» естественно передаёт генеалогическое значение בְּנֵי, не создавая впечатления, будто речь только о непосредственных сыновьях.
- source_word: זְכַרְיָה
  choice: Захария
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Транслитерация собственного имени в соответствии с его еврейской формой.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: из потомков Каафа
  rationale: Еврейское выражение указывает на каафитский род. Такая формулировка ясна современному читателю и сохраняет генеалогическую связь.
- source_word: לְנַצֵּחַ
  choice: чтобы руководить
  rationale: В контексте храмовых ремонтных работ глагол обозначает руководство или надзор. Выбран общий смысл, а близкая альтернатива отмечена в сноске.
- source_word: כָּל מֵבִין
  choice: все, кто владел
  rationale: Причастие обозначает практическое знание и умение; в сочетании с инструментами русское «владеть» идиоматично выражает навык.
- source_word: בִּכְלֵי שִׁיר
  choice: музыкальными инструментами
  rationale: Буквально «орудиями песни»; в данном контексте речь идёт об инструментах для исполнения музыки.
