base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: ru
  text: Когда выносили серебро, принесённое в дом Яхве, священник Хелкия нашёл книгу Закона Яхве, данного через Моисея.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моисея»; это выражение может означать «через Моисея» или «переданного через Моисея».'
    reason: Сноска сохраняет буквальный образ еврейской идиомы בְּיַד и показывает смысловой диапазон, не перегружая основной текст.
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: Когда выносили
  rationale: Конструкция с инфинитивом и суффиксом образует временную придаточную часть. Русское «когда выносили» естественно передаёт происходившее в тот момент действие, не уточняя названный ранее субъект.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: כֶּסֶף может означать серебро или деньги; «серебро» сохраняет конкретный образ исходного текста и уместно в контексте храмовых сборов.
- source_word: הַמּוּבָא בֵּית יְהוָה
  choice: принесённое в дом Яхве
  rationale: Пассивное причастие от בוא обозначает то, что было внесено или принесено внутрь; «дом Яхве» буквально и понятно передаёт обозначение храма.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: священник Хелкия
  rationale: Естественная русская аппозиция; имя передано в принятой русской библейской форме.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: книгу Закона Яхве
  rationale: סֵפֶר может обозначать книгу или свиток, а תּוֹרָה — наставление или закон. В данном контексте традиционное «книга Закона» ясно и не требует необоснованного уточнения материальной формы документа.
- source_word: בְּיַד מֹשֶׁה
  choice: данного через Моисея
  rationale: Буквально «рукой Моисея»; оборот בְּיַד с лицом обычно выражает посредничество или действие через кого-либо. Русское «данного через Моисея» передаёт идиоматический смысл и сохраняет возможность понимать Моисея как посредника передачи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное заветное имя, непосредственно стоящее в еврейском тексте, а не заменяющий его титул.
- issue: Связь Закона с Моисеем в обороте בְּיַד מֹשֶׁה
  choice: данного через Моисея
  alternative: написанного Моисеем; рукой Моисея
  rationale: Еврейский оборот обозначает агентность или посредничество, но сам по себе не требует более узкого утверждения о собственноручном написании. Формулировка сохраняет эту смысловую сдержанность.
translation_notes:
  register: Современный литературный русский язык, простой и достойный по тону. Причастный оборот оставлен компактным; «дом Яхве» сохраняет исходную метафору, а «книга Закона» следует устойчивому библейскому словоупотреблению.
