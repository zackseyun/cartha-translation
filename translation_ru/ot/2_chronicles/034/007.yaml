  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: ru
  text: Он разрушил жертвенники и ашеры[a], истёр резные изваяния в порошок и срубил все солнечные столбы[b] по всей земле Израиля. Затем он возвратился в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столбы Ашэры». Еврейское слово обозначает культовые предметы, связанные с богиней Ашэрой; их точная форма могла различаться.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «жертвенники для благовоний». Точное назначение обозначенных этим еврейским словом культовых предметов остаётся спорным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: Он разрушил
  rationale: Глагол נתץ обозначает разрушение или снос сооружений; «разрушил» естественно сочетается с жертвенниками.
- source_word: הַמִּזְבְּחוֹת
  choice: жертвенники
  rationale: Обычный и точный русский эквивалент для מזבחות.
- source_word: הָאֲשֵׁרִים
  choice: ашеры
  rationale: Транслитерация сохраняет конкретное название культовых предметов, связанных с Ашэрой, не предрешая их точную форму; пояснение дано в сноске.
- source_word: הַפְּסִלִים
  choice: резные изваяния
  rationale: Передаёт значение изготовленных резьбой культовых изображений и конкретнее общего слова «идолы».
- source_word: כִּתַּת לְהֵדַק
  choice: истёр ... в порошок
  rationale: Сочетание выражает раздробление до мелких частиц; русская формулировка ясно передаёт и действие, и результат.
- source_word: הַחַמָּנִים
  choice: солнечные столбы
  rationale: Точное назначение предметов спорно; «солнечные столбы» сохраняет вероятную связь термина с солнечным культом, а альтернативное понимание указано в сноске.
- source_word: גִּדַּע
  choice: срубил
  rationale: Глагол גדע означает отсечь или срубить и подходит для вертикально стоящих культовых предметов.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: по всей земле Израиля
  rationale: Естественно передаёт всеохватность действия, выраженную בְּכָל.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: Затем он возвратился в Иерусалим
  rationale: «Затем» передаёт последовательность повествования; «возвратился» соответствует dignified modern literary register.
theological_decisions:
- issue: Передача названий предметов языческого культа
  choice: 'Сохранены отдельные конкретные обозначения: «ашеры», «резные изваяния», «солнечные столбы».'
  alternative: Обобщить их как «идолы» или «языческие святыни».
  rationale: Лексическая конкретность отражает еврейский текст и не вводит конфессионального истолкования.
- issue: Идентификация הַחַמָּנִים
  choice: В основном тексте — «солнечные столбы», с альтернативой в сноске.
  alternative: «Жертвенники для благовоний» или «курильницы».
  rationale: Точное значение спорно. Выбранный вариант отражает вероятную этимологическую и культовую связь, но сноска сохраняет реальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность действий оригинала, но избегает архаизмов и чрезмерной буквальности.
