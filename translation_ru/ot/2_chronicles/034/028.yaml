base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: ru
  text: «Вот, Я соберу тебя к твоим отцам[a], и ты будешь погребён в родовой усыпальнице[b] с миром[c]. Твои глаза не увидят всего бедствия, которое Я наведу на это место и на его жителей». И они передали царю этот ответ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к твоим предкам». Буквально: «к твоим отцам» — обычное еврейское выражение о присоединении после смерти к умершим предкам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к твоим гробницам». Множественное число может обозначать родовое место погребения или погребальный комплекс.'
    reason: source_form
  - marker: c
    text: Слова «с миром» в данном контексте прежде всего связаны с тем, что Иосия не увидит грядущего бедствия; они не обязательно означают, что сама его смерть будет ненасильственной.
    reason: theological_tension
lexical_decisions:
- source_word: הִנְנִי אֹסִפְךָ
  choice: Вот, Я приобщу тебя
  rationale: «Вот» сохраняет торжественный указательный маркер הִנְנִי, а «приобщу» передаёт погребальную идиому אָסַף в сочетании с упоминанием предков, не превращая её просто в сообщение о смерти.
- source_word: אֶל אֲבֹתֶיךָ
  choice: к твоим отцам
  rationale: Сохранён традиционный образ исходного текста; речь идёт о присоединении после смерти к предкам.
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: и ты будешь положен в своих гробницах
  rationale: Пассивная конструкция и погребальный смысл переданы естественно по-русски. Множественное число «гробницах» отражает קִבְרֹתֶיךָ и может указывать на родовое место погребения.
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: Формулировка сохраняет широкое значение שָׁלוֹם и связь со следующим пояснением о том, что Иосия не увидит грядущего бедствия.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Твои глаза не увидят
  rationale: Сохранено выразительное телесное обозначение, в котором именно глаза выступают подлежащим.
- source_word: בְּכֹל הָרָעָה
  choice: всего бедствия
  rationale: В контексте суда רָעָה обозначает не нравственное зло, а грядущее несчастье или бедствие.
- source_word: אֲשֶׁר אֲנִי מֵבִיא
  choice: которое Я наведу
  rationale: Русское будущее естественно выражает предстоящее и уже определённое Богом действие, переданное еврейским причастием.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: И они передали царю этот ответ
  rationale: Передан идиоматический смысл возвращения к царю с полученным словом или ответом.
theological_decisions:
- issue: Значение обещания «с миром» с учётом последующей гибели Иосии в сражении
  choice: Сохранить выражение «с миром» и пояснить, что непосредственно в стихе оно связано с тем, что Иосия не увидит грядущего бедствия.
  alternative: Понимать эти слова как безусловное обещание ненасильственной смерти либо исключительно мирного погребения.
  rationale: Следующая фраза сама поясняет обещание через избавление Иосии от созерцания будущего суда. Перевод не устраняет напряжение с дальнейшим повествованием и не навязывает гармонизацию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены образы «отцов», «глаз» и «мира», но заключительная идиома передана естественным русским выражением.
