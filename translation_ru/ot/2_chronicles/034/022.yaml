translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены повествовательное «И», родословная цепочка и буквальное название должности; синтаксис упрощён лишь там, где еврейская эллиптичность была бы неясна русскому читателю.
