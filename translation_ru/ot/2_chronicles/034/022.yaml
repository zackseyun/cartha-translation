base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: ru
  text: 'И пошёл Хелкия вместе с теми, кого послал царь, к пророчице Хулде, жене Шаллума, сына Токхата, сына Хасры, хранителя одежд[a]. Она жила в Иерусалиме, во Втором квартале[b], и они сказали ей вот что:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хранителя гардероба». Буквально: «хранителя одежд».'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. Мишне — вероятно, название одного из районов Иерусалима; традиционно: «вторая часть города».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ חִלְקִיָּהוּ וַאֲשֶׁר הַמֶּלֶךְ
  choice: И пошёл Хелкия вместе с теми, кого послал царь
  rationale: Эллиптическое выражение после имени Хелкии по контексту обозначает других членов царской делегации; глагол «послал» восполняет подразумеваемый смысл без указания их должностей.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: к пророчице Олде
  rationale: Женская форма названия служения сохранена; имя передано в принятой русской библейской форме.
- source_word: אֵשֶׁת שַׁלֻּם בֶּן תוקהת בֶּן חַסְרָה
  choice: жене Шаллума, сына Токхата, сына Хасры
  rationale: Супружеская связь и генеалогическая цепочка переданы прямо, без перестройки.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: хранителя одежд
  rationale: Буквальный смысл сохранён в основном тексте; возможное обозначение придворной должности отмечено в сноске.
- source_word: וְהִיא יוֹשֶׁבֶת בִּירוּשָׁלִַם בַּמִּשְׁנֶה
  choice: Она жила в Иерусалиме, во Втором квартале
  rationale: Причастная конструкция сообщает постоянное место жительства; מִשְׁנֶה, вероятно, является названием части города.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: Они передали ей всё это
  rationale: Формула вводит последующее сообщение и буквально допускает значение «говорили ей подобное/такое»; «передали ей всё это» естественно связывает стих с поручением предыдущего контекста, не предвосхищая содержание ответа.
