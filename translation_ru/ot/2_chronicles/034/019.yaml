  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: ru
  text: Когда царь услышал слова закона[a], он разодрал на себе одежду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставления». Еврейское слово тора может иметь более широкое значение — «наставление», хотя здесь оно относится к закону завета, который читали царю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда ... услышал
  rationale: Повествовательная формула וַיְהִי вместе с временной конструкцией כִּשְׁמֹעַ естественно передаётся по-русски придаточным времени без архаичного «и было».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён титул исходного текста; имя Иосии, известное из контекста, не добавляется.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: слова закона
  rationale: דִּבְרֵי указывает на услышанное содержание, а הַתּוֹרָה в данном контексте — на заветное установление, читавшееся царю.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: он разодрал на себе одежду
  rationale: קרע обозначает разрывание одежды как знак потрясения, скорби или покаяния. Русское устойчивое выражение «разодрал на себе одежду» ясно передаёт жест, не уточняя его мотив сверх текста.
theological_decisions:
- issue: Передача הַתּוֹרָה в контексте реформы Иосии
  choice: закон
  alternative: наставление; Тора
  rationale: «Закон» естественно обозначает здесь содержание найденной книги завета. Более широкое значение «наставление» сохраняется в сноске, чтобы не сужать смысл еврейского слова без оговорки.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Союз «и» перед главным действием опущен как необязательный для естественного русского синтаксиса; последовательность событий полностью сохранена.
