id: 2CH.34.25
reference: 2 Chronicles 34:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: ru
  text: За то, что они оставили Меня и воскуряли другим богам[a], чтобы прогневать Меня всеми делами своих рук[b], изольётся ярость Моя на это место и не угаснет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужим богам». Буквально по-еврейски: «другим богам».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «дела своих рук» может обозначать всё, что они изготовили или совершили, особенно рукотворных идолов и связанное с ними служение.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: За то, что
  rationale: Естественно передаёт причинное основание объявленного суда и сохраняет торжественный характер речи.
- source_word: עֲזָבוּנִי
  choice: они оставили Меня
  rationale: Глагол עזב означает «оставить, покинуть»; в контексте завета выражение передаёт отступничество без добавочного толкования.
- source_word: וַיַּקְטִירוּ
  choice: и воскуряли
  rationale: Порода Hiphil глагола קטר здесь обозначает ритуальное возжигание благовоний или курений; «воскуряли» точно и привычно для русского библейского регистра.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Буквально передаёт אֲחֵרִים («другим»), не подменяя его более истолковывающим «чужим».
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: чтобы прогневать Меня
  rationale: Сохраняет возможный оттенок цели или результата конструкции לְמַעַן и каузативное значение «вызвать гнев».
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: всеми делами своих рук
  rationale: Сохраняет еврейский образ, который может охватывать как изготовленные ими предметы, особенно идолов, так и совершённые ими поступки.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: изольётся ярость Моя
  rationale: Глагол נתך создаёт образ излияния, а חֵמָה обозначает сильный гнев или ярость в контексте суда.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на это место
  rationale: Предлог «на» естественно сочетается в русском с образом изливающейся ярости и передаёт направленность суда.
- source_word: וְלֹא תִכְבֶּה
  choice: и не угаснет
  rationale: Сохраняет метафору огня, заложенную в כבה, и естественно относится в русском к «ярости».
theological_decisions:
- issue: Передача речи о Божьем суде без смягчения или догматического расширения
  choice: изольётся ярость Моя на это место и не угаснет
  alternative: изольётся гнев Мой на это место и не будет потушен
  rationale: Формулировка сохраняет прямой язык Божьего суда, образ излияния и метафору неугасающего огня, не вводя более поздних богословских категорий.
- issue: Первое лицо в прямой Божьей речи
  choice: Меня / Моя
  alternative: Господа / Господня
  rationale: Еврейские суффиксы стоят в первом лице; их прямая передача точнее источника, чем замена именем или титулом.
- issue: Цель или результат идолопоклонства в לְמַעַן
  choice: чтобы прогневать Меня
  alternative: так что они прогневали Меня
  rationale: Русское «чтобы» сохраняет целевую формулировку оригинала и присущую ей напряжённость, не устраняя возможный оттенок результата.
translation_notes:
  register: Современный литературный русский с достоинством библейской прямой речи. Слова «воскуряли» и инверсия «ярость Моя» поддерживают возвышенный регистр, оставаясь понятными; местоимения Божьей прямой речи написаны с прописной буквы по устойчивой русской издательской традиции.
