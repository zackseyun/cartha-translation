source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: ru
  text: Иосия удалил все мерзости из всех земель, принадлежавших сынам Израиля[a], и заставил всех, кто находился в Израиле[b], служить Яхве, их Богу. Во все дни Иосии они не отступали от Яхве[c], Бога своих отцов[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из всех областей народа Израиля». Буквально: «из всех земель, которые у сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всех найденных в Израиле», то есть всех находившихся там.'
    reason: idiom_note
  - marker: c
    text: 'Буквально: «не отступали от следования за Яхве».'
    reason: source_form_note
  - marker: d
    text: Выражение «Бог своих отцов» указывает на Бога, Которому поклонялись их предшествующие поколения, и подчёркивает преемственность завета.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסַר
  choice: удалил
  rationale: Каузативная форма глагола סור означает «убрать, удалить». Этот вариант ясно передаёт целенаправленное устранение предметов и практик ложного культа.
- source_word: הַתּוֹעֵבוֹת
  choice: мерзости
  rationale: תּוֹעֵבוֹת обозначает отвратительные перед Богом, особенно идолопоклоннические, предметы или обычаи. «Мерзости» сохраняет сильную культовую и нравственную окраску слова.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: из всех земель, принадлежавших сынам Израиля
  rationale: Переданы множественное число אֲרָצוֹת («земли») и конструкция принадлежности с לְ; формулировка сохраняет семейное обозначение Израиля.
- source_word: וַיַּעֲבֵד
  choice: заставил ... служить
  rationale: 'Hiphil от עבד имеет каузативный смысл: Иосия добился того, чтобы народ служил Яхве. «Заставил» сохраняет распорядительную силу действия, не добавляя указания на физическое насилие.'
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: всех, кто находился в Израиле
  rationale: Причастие נִמְצָא буквально связано со значением «быть найденным», но здесь идиоматически обозначает всех находившихся или присутствовавших в стране; русский вариант не создаёт ложного впечатления о поиске людей.
- source_word: לַעֲבוֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: служить Яхве, их Богу
  rationale: עבד в отношении Бога включает поклонение и верное заветное служение; «служить» сохраняет более широкий смысл, чем одно лишь культовое поклонение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: כָּל יָמָיו
  choice: во все дни Иосии
  rationale: Фраза означает всё время жизни или правления Иосии. Имя повторено по-русски ради ясной связи местоимений при сохранении временной формулы.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: не отступали от Яхве
  rationale: Еврейское выражение буквально описывает отказ перестать следовать за кем-либо. Русская заветная формула «не отступали от» естественно передаёт верность, а буквальный образ отмечен в сноске.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Бога своих отцов
  rationale: Сохранено буквальное семейное обозначение אֲבוֹת («отцы»), характерное для формулы о Боге предыдущих поколений Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное заветное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Степень принуждения в וַיַּעֲבֵד
  choice: заставил всех ... служить
  alternative: побудил всех ... служить
  rationale: Каузативная форма представляет действие царя как властное установление служения Яхве. «Побудил» могло бы неоправданно смягчить этот смысл до убеждения или вдохновения.
- issue: Передача родственных обозначений לִבְנֵי יִשְׂרָאֵל и אֲבוֹתֵיהֶם
  choice: сыны Израиля / отцы
  alternative: народ Израиля / предки
  rationale: В основном тексте сохранены конкретные семейные образы источника; более обобщённый смысл первого выражения указан в сноске.
- issue: Смысл утверждения о верности народа во дни Иосии
  choice: они не отступали от Яхве
  alternative: они не переставали следовать за Яхве
  rationale: Формулировка сохраняет утверждение текста о внешне наблюдаемой заветной верности народа, не добавляя оценки искренности этой верности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок первой еврейской связки слегка сглажен; сильные слова «мерзости» и «заставил» сохранены ради культовой и распорядительной силы исходного текста. Повтор имени Иосии устраняет неясную русскую местоименную отсылку, не меняя смысла.
