  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: ru
  text: Царь поднялся в дом Яхве[a], а с ним — все мужчины Иудеи, жители Иерусалима, священники, левиты и весь народ, от большого до малого. Он прочитал им вслух все слова книги завета, найденной в доме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (YHWH).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Сохраняет направительное значение עלה — «подниматься»; храм находился на возвышенности.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Передаёт буквально «дом YHWH», не заменяя образ более истолковывающим словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כָל אִישׁ יְהוּדָה
  choice: все мужи Иудеи
  rationale: Естественно передаёт дистрибутивное сочетание «каждый муж Иудеи» и сохраняет выраженное в еврейском тексте мужское обозначение.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: жители Иерусалима
  rationale: Современное и точное обозначение тех, кто живёт в Иерусалиме.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Стандартный эквивалент в культовом контексте.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Стандартное наименование племенной и культовой группы.
- source_word: כָל הָעָם
  choice: весь народ
  rationale: Передаёт собирательность и полноту охвата.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: от большого до малого
  rationale: Сохраняет образность и меризм исходного текста, обозначающий людей всех положений.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: он прочитал им вслух
  rationale: В контексте книги קרא означает чтение, а выражение «в их уши» указывает на слышимое публичное чтение.
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: все слова книги завета
  rationale: Сохраняет текстуальный акцент существительного דְּבָרִים — «слова» — и конструкцию «книга завета».
- source_word: הַנִּמְצָא
  choice: найденной
  rationale: Причастие согласовано по смыслу с «книгой завета» и указывает на ранее описанную находку.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя YHWH. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Мужское обозначение в כָל אִישׁ יְהוּדָה
  choice: все мужи Иудеи
  alternative: все жители Иудеи
  rationale: Сохраняется явно употреблённое אִישׁ («муж, мужчина»), тогда как далее весь собравшийся народ назван отдельно.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис слегка упрощён для ясного публичного чтения; добавление «с ним» эксплицирует совместное движение перечисленных групп, подразумеваемое еврейской конструкцией.
