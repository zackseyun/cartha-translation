base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: ru
  text: Он велел всем, кто находился в Иерусалиме и Вениамине, встать[a], и жители Иерусалима поступили согласно завету Бога, Бога их предков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «велел всем… твёрдо стоять за завет», то есть обязал их хранить верность завету. В еврейском тексте буквально сказано: «поставил всех…» — без указания, на чём или за что они должны были стоять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: велел … встать
  rationale: Каузативная форма глагола עמד буквально означает «поставил; велел встать». Перевод сохраняет образ стояния и не делает неявное упоминание завета частью основного текста; возможный смысл обязательства хранить завет пояснён в сноске.
- source_word: אֵת כָּל הַנִּמְצָא
  choice: всем, кто находился
  rationale: Пассивное причастие נמצא в данном контексте обозначает всех находившихся или присутствовавших там; выбранная формулировка близка к еврейскому тексту и естественна по-русски.
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: в Иерусалиме и Вениамине
  rationale: Названия мест переданы непосредственно. «Вениамин», вероятно, означает территорию колена Вениамина, однако это уточнение не внесено в основной текст.
- source_word: וַיַּעֲשׂוּ
  choice: поступали
  rationale: Глагол עשה с последующим כִּבְרִית выражает действие в соответствии с заветом. «Поступали» передаёт это значение естественно, не сужая его до одного обряда.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: жители Иерусалима
  rationale: Краткий и современный русский эквивалент причастной конструкции со значением постоянных жителей города.
- source_word: כִּבְרִית
  choice: согласно завету
  rationale: 'Предлог כ здесь указывает на соответствие: жители действовали в согласии с требованиями завета.'
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Бога, Бога их предков
  rationale: Повтор слова «Бог» сохраняет еврейское приложение и подчёркивает, что Бог завета — Бог их предков.
theological_decisions:
- issue: Смысл действия Иосии при обновлении завета
  choice: 'Сохранён буквальный образ: Иосия велел народу встать; возможный смысл принятия обязательства по завету вынесен в сноску.'
  alternative: 'Передать прямо: «обязал всех твёрдо держаться завета» или «ввел всех в завет».'
  rationale: В еврейском предложении за глаголом «поставил/велел встать» нет явного дополнения «в завете» или «за завет». Контекст допускает расширенный смысл верности завету, но прямое внесение этого смысла в текст устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировки просты и понятны; архаизмы и конфессионально окрашенные уточнения исключены.
