base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: ru
  text: Он делал то, что было правильно в глазах Яхве[a], и шёл путями Давида, отца своего[b], не уклоняясь ни вправо, ни влево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пред Яхве».'
    reason: Лексическая альтернатива для древнееврейского идиоматического выражения בְּעֵינֵי.
  - marker: b
    text: 'Буквально: «Давида, отца своего»; слово «отец» здесь употреблено в значении династического предка.'
    reason: Культурно-генеалогическое пояснение употребления אָב.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Он делал то, что было правильно
  rationale: Субстантивированное הַיָּשָׁר выражает нравственную оценку поступков царя; эта формулировка естественна по-русски и сохраняет значение исходного оборота.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён прозрачный древнееврейский образ божественной оценки; имя יְהוָה передано как «Яхве».
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: шёл путями
  rationale: Сохранена метафора пути, обозначающая образ жизни и поведение; по-русски сочетание звучит ясно и достойно.
- source_word: דָּוִיד אָבִיו
  choice: Давида, своего праотца
  rationale: Здесь אָב обозначает не непосредственного отца Иосии, а династического предка; «праотец» точно передаёт смысл без генеалогической ошибки.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: не уклоняясь ни вправо, ни влево
  rationale: Передан устойчивый образ отсутствия отклонения от правильного пути в любую сторону.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога; транслитерация сохраняет различие между именем יְהוָה и титулом «Господь».
- issue: Характер следования путями Давида
  choice: не уклоняясь ни вправо, ни влево
  alternative: не отступая ни направо, ни налево
  rationale: Формулировка сохраняет нравственно-религиозную метафору пути, не конкретизируя сверх текста, от какой именно заповеди или нормы Иосия не уклонялся.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры пути. Формулировка рассчитана на обычного читателя; синтаксис плавный, торжественный, но не архаичный.
