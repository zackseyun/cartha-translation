  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: ru
  text: Они пришли к первосвященнику Хилкии и передали деньги, принесённые в дом Божий. Эти деньги левиты — хранители порога[a] — собрали у жителей Манассии и Ефрема, у всего остатка Израиля, у всех жителей Иудеи и Вениамина и у жителей Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привратники»; буквально: «хранители порога».'
    reason: 'Лексическая альтернатива: выражение может обозначать храмовую должность привратников, тогда как основной текст сохраняет буквальный образ.'
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Они пришли
  rationale: Форма wayyiqtol продолжает последовательное повествование; в русском связь с предыдущим контекстом естественно передаётся без обязательного добавления «тогда».
- source_word: חִלְקִיָּהוּ
  choice: Хилкии
  rationale: Традиционная русская библейская передача личного имени с необходимым падежным окончанием.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященнику
  rationale: Устоявшееся и точное русское название высшей священнической должности; естественнее буквального «великому священнику».
- source_word: וַיִּתְּנוּ
  choice: и передали
  rationale: В контексте доставки собранных средств «передали» точнее передаёт практический смысл действия, чем общее «дали».
- source_word: הַכֶּסֶף
  choice: деньги
  rationale: Существительное буквально может означать «серебро», но здесь обозначает храмовые денежные средства.
- source_word: הַמּוּבָא בֵית אֱלֹהִים
  choice: внесённые в дом Божий
  rationale: Сохраняется пассивное значение причастия и формальный образ «дома Божьего», а не заменяется толкованием «храм».
- source_word: אָסְפוּ
  choice: собрали
  rationale: Прямое и естественное обозначение сбора денежных средств; предшествование передаче ясно из порядка предложений.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Устоявшееся русское наименование этой группы храмовых служителей.
- source_word: שֹׁמְרֵי הַסַּף
  choice: хранители порога
  rationale: Сохраняет буквальный образ еврейского выражения; функциональные варианты даны в сноске.
- source_word: מִיַּד מְנַשֶּׁה וְאֶפְרַיִם
  choice: в Манассии и Ефреме
  rationale: Идиома «из руки» указывает на источник сбора; названия здесь могут обозначать племенные области, поэтому по-русски естественно указать место сбора, не добавляя отсутствующего в тексте слова «жители».
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: остатка Израиля
  rationale: Передаёт значение оставшейся части Израиля и сохраняет возможный богословский оттенок слова «остаток».
- source_word: וּמִכָּל יְהוּדָה וּבִנְיָמִן
  choice: по всей Иудее и Вениамину
  rationale: Названия поняты как племенные территории; оборот естественно выражает широкий охват сбора.
- source_word: וישבי יְרוּשָׁלִָם
  choice: и у жителей Иерусалима
  rationale: Передаёт упомянутую в еврейском тексте группу людей и по смыслу продолжает перечень источников собранных средств.
theological_decisions:
- issue: Возможный богословский оттенок שְׁאֵרִית («остаток»)
  choice: остатка Израиля
  alternative: остальных израильтян
  rationale: «Остаток» непосредственно соответствует еврейскому слову и может обозначать уцелевших представителей северных колен, сохраняя возможный заветный оттенок без его усиления или устранения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Длинное еврейское предложение разделено на два для ясности; повтор «эти деньги» устраняет возможную неясность относительной конструкции. Маркер сноски поставлен непосредственно после выражения, к которому относится.
