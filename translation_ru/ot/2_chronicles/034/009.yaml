    issue: Источник сбора передан как место сбора
    rationale: מִיַּד буквально означает «из руки, от» и управляет рядом Манассия—Ефрем, остаток Израиля, Иудея—Вениамин и жители Иерусалима. Формы «в Манассии» и «по всей Иудее» ослабляют эту синтаксическую и смысловую связь.
  revised_text: Они пришли к первосвященнику Хилкии и передали деньги, принесённые в дом Божий. Эти деньги левиты — хранители порога[a] — собрали у жителей Манассии и Ефрема, у всего остатка Израиля, у всех жителей Иудеи и Вениамина и у жителей Иерусалима.
