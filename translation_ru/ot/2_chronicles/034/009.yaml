  to: Они пришли к первосвященнику Хилкии и передали деньги, принесённые в дом Божий. Эти деньги левиты — хранители порога[a] — собрали у жителей Манассии и Ефрема, у всего остатка Израиля, у всех жителей Иудеи и Вениамина и у жителей Иерусалима.
