  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: ru
  text: 'И писец Шафан доложил царю: «Священник Хелкия дал мне книгу[a]». И Шафан читал из неё перед царём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свиток». Еврейское слово может обозначать письменный документ или книгу вообще; в то время такой текст часто имел форму свитка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: доложил
  rationale: В породе хифиль глагол נגד означает «сообщить, доложить». В контексте обращения придворного писца к царю «доложил» естественно передаёт официальную обстановку, не усиливая смысл до торжественного провозглашения.
- source_word: הַסֹּפֵר
  choice: писец
  rationale: Слово סֹפֵר может обозначать писца или царского секретаря. «Писец» сохраняет историческую лексику и остаётся понятным современному читателю.
- source_word: סֵפֶר
  choice: книгу
  rationale: Слово סֵפֶר широко обозначает письменный текст, документ или книгу и само по себе не определяет физическую форму; поэтому в тексте выбрано общее слово «книга», а возможное «свиток» отмечено в сноске.
- source_word: נָתַן לִי
  choice: дал мне
  rationale: 'Русское прошедшее время естественно передаёт завершённое действие, результат которого актуален в момент речи: книга находится у Шафана.'
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: священник Хелкия
  rationale: Имя передано в принятой русской библейской форме «Хелкия», а титул הַכֹּהֵן — словом «священник»; русский порядок слов звучит естественно.
- source_word: וַיִּקְרָא בוֹ
  choice: читал из неё
  rationale: Предлог בְּ указывает на чтение из письменного источника. Несовершенный вид «читал» уместно изображает само происходившее перед царём чтение, не уточняя, был ли прочитан весь текст.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: перед царём
  rationale: Оборот буквально и естественно передаёт присутствие и действие в непосредственном присутствии царя.
