base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: ru
  text: 'И встал царь на своём месте и заключил завет перед Яхве: следовать за Яхве и соблюдать Его заповеди, свидетельства и постановления всем сердцем и всей душой, исполнять слова завета, записанные в этой книге[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом исторической формы документа: «записанные в этом свитке». Древнееврейское слово может обозначать письменный документ в форме свитка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ
  choice: И встал царь на своём месте
  rationale: Передаёт обычное значение עמד и идиому עַל־עָמְדוֹ как указание на отведённое царю место, не уточняя архитектурную деталь, которой текст прямо не называет.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: заключил завет
  rationale: Естественный русский эквивалент устойчивого древнееврейского выражения «резать завет»; определённость завета сохранена контекстом.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет торжественный заветный регистр и значение действия в присутствии Яхве.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: следовать за Яхве
  rationale: Естественно передаёт древнееврейскую метафору хождения за кем-либо как верного следования, не превращая её в отвлечённое заявление о лояльности.
- source_word: לִשְׁמוֹר
  choice: соблюдать
  rationale: В контексте заповедей и установлений שמר означает хранить их посредством исполнения; «соблюдать» точно и естественно по-русски.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: Его заповеди, свидетельства и постановления
  rationale: Сохраняет три различных правовых термина исходного текста, не сводя их к одному общему понятию.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: всем сердцем и всей душой
  rationale: Сохраняет традиционную заветную формулу и её связь с языком Второзакония.
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: исполняя слова завета
  rationale: «Исполняя» естественно передаёт деятельное осуществление сказанного; «слова завета» сохраняет буквальный и богословски значимый оборот.
- source_word: הַסֵּפֶר הַזֶּה
  choice: эта книга
  rationale: סֵפֶר обозначает письменный документ и в данном историческом контексте мог относиться к свитку; основной текст использует понятное современному читателю слово, а историческая форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды стоит личное заветное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Заветный образ в לָלֶכֶת אַחֲרֵי יְהוָה
  choice: следовать за Яхве
  alternative: ходить вслед за Яхве
  rationale: Выбранная формулировка сохраняет направленность и личную верность, выраженные древнееврейской метафорой, но звучит естественно в современном литературном русском языке.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаизированным заветно-правовым регистром. Местоимение «Его» написано с прописной буквы по принятой русской религиозной традиции; синтаксис остаётся ясным для обычного читателя.
