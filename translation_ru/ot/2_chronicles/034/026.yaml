source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: ru
  text: 'А царю Иудеи, который послал вас вопросить Яхве[a], скажите так: «Так говорит Яхве, Бог Израиля: что до слов, которые ты услышал…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искать Яхве»; также возможно: «обратиться за ответом к Яхве». Еврейский глагол может означать как поиск, так и вопрошание Бога в пророческом контексте.'
    reason: Лексическая многозначность דרשׁ с предлогом ב.
lexical_decisions:
- source_word: וְאֶל מֶלֶךְ יְהוּדָה
  choice: А царю Иудеи
  rationale: Союз וְ вводит переход к отдельному адресату; русское «А» естественно передаёт смену адреса без чрезмерно сильного противопоставления. Конструкция сохраняет направительное אֶל.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: который послал вас
  rationale: Определённое причастие имеет атрибутивную функцию; в современном русском естественно передаётся придаточным определительным.
- source_word: לִדְרוֹשׁ בַּיהוָה
  choice: вопросить Яхве
  rationale: В контексте обращения за пророческим ответом דרשׁ с ב означает искать ответа или вопрошать Бога. «Вопросить» сохраняет религиозно-пророческий оттенок, оставаясь понятным в возвышенном повествовании.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: скажите так
  rationale: Передаёт предписание и формулу посланнической речи кратко и естественно.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Устойчивая русская передача древнееврейской пророческой формулы; настоящее время уместно при введении следующего изречения.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: что до слов, которые ты услышал…
  rationale: «Что до» сохраняет вынесенную тему и синтаксическую незавершённость еврейской фразы, продолжение которой находится в следующем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя в соответствии с представленной актуальной редакционной установкой.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное заветное имя и соответствует предоставленному последнему доктринальному решению.
- issue: Характер действия לִדְרוֹשׁ בַּיהוָה
  choice: вопросить Яхве
  alternative: искать Яхве; обратиться за советом к Яхве
  rationale: Контекст пророческой консультации указывает на запрос Божьего ответа, однако примечание сохраняет более широкий смысловой диапазон глагола.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Формула «Так говорит Яхве» сохранена как торжественная пророческая формула. Многоточие в конце обозначает намеренно незавершённую конструкцию, продолжающуюся в следующем стихе.
