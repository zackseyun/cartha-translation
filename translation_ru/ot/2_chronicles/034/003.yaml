base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: ru
  text: На восьмом году своего царствования, когда он был ещё юношей, Иосия начал искать Бога Давида, своего отца[a], а на двенадцатом году начал очищать Иудею и Иерусалим от высот, Ашеров[b], резных изваяний и литых изображений[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть своего предка. В языке царских родословий Давид назван «отцом» Иосии.
    reason: lexical_alternative
  - marker: b
    text: Ашеры — культовые предметы, связанные с богиней Ашерой; возможно, священные столбы, шесты или деревья.
    reason: lexical_alternative
  - marker: c
    text: 'То есть изображения, изготовленные литьём из металла; также можно перевести: «литые идолы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: На восьмом году своего царствования
  rationale: Предлог ב с обозначением года задаёт временную рамку, а לְמָלְכוֹ указывает на отсчёт от начала царствования. Формулировка естественна для современного русского языка.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: когда он был ещё юношей
  rationale: נַעַר допускает значения «отрок», «юноша», «молодой человек». В данном контексте «юноша» передаёт возраст Иосии без излишнего омоложения; עוֹדֶנּוּ отражено словом «ещё».
- source_word: הֵחֵל לִדְרוֹשׁ
  choice: начал искать
  rationale: דרשׁ применительно к Богу означает не просто расспрашивать, а обращаться к Нему и стремиться познать Его волю. «Искать Бога» сохраняет религиозный смысл и естественно звучит по-русски.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: Бога Давида, своего отца
  rationale: Сохранено буквальное династическое обозначение אָבִיו — «его отца». Поскольку Давид был предком Иосии, а не его непосредственным отцом, это пояснено в сноске.
- source_word: וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: а на двенадцатом году
  rationale: Из контекста ясно, что речь по-прежнему идёт о годе царствования. Союз «а» естественно обозначает переход ко второму этапу деятельности Иосии.
- source_word: הֵחֵל לְטַהֵר
  choice: начал очищать
  rationale: טהר здесь означает устранение культовой нечистоты посредством удаления предметов и мест чуждого культа. «Очищать» сохраняет как конкретный, так и религиозный оттенок.
- source_word: מִן הַבָּמוֹת
  choice: от святилищ на высотах
  rationale: במות обозначает местные культовые места, нередко располагавшиеся на возвышенностях. Одно слово «высоты» в современном русском могло бы быть ошибочно понято лишь географически.
- source_word: וְהָאֲשֵׁרִים
  choice: ашер
  rationale: Транслитерированное название не сводит неоднозначный термин к одной конкретной форме предмета. Сноска поясняет его связь с богиней Ашерой и возможные физические формы.
- source_word: וְהַפְּסִלִים
  choice: резных изваяний
  rationale: פסילים — изображения, изготовленные резьбой или высеканием. «Резные изваяния» конкретнее общего слова «идолы» и не архаично.
- source_word: וְהַמַּסֵּכוֹת
  choice: литых изображений
  rationale: מסכות обозначает изображения, изготовленные литьём, обычно из металла. Перевод передаёт способ изготовления и остаётся понятным современному читателю.
theological_decisions:
- issue: Династическое значение выражения «Давид, его отец»
  choice: Сохранить «своего отца» в основном тексте
  alternative: «своего предка» или «своего праотца»
  rationale: Еврейское אָבִיו сохраняет значимую для повествования связь Иосии с Давидом и употреблено в обычном библейском династическом смысле. Сноска предупреждает, что речь не о непосредственном отце.
- issue: Точная природа אֲשֵׁרִים
  choice: Передать как «ашер» с пояснением
  alternative: «столбов Ашеры», «священных шестов» или «культовых символов Ашеры»
  rationale: Форма и характер обозначаемых предметов не во всех контекстах определимы однозначно. Транслитерация с пояснением сохраняет эту неопределённость и не навязывает единственную реконструкцию.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Имя «Иосия» эксплицировано как подлежащее для ясности отдельного стиха. Термин «святилища на высотах» выбран вместо буквальных «высот», чтобы обычный читатель распознал культовое значение. Редкое «ашеры» оставлено ради сохранения лексической неоднозначности и снабжено пояснением.
