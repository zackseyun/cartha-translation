  text: וּ/בִ/שְׁנַ֨ת שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ לְ/מָלְכ֔/וֹ לְ/טַהֵ֥ר הָ/אָ֖רֶץ וְ/הַ/בָּ֑יִת שָׁ֠לַח אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֜הוּ וְ/אֶת מַעֲשֵׂיָ֣הוּ שַׂר הָ/עִ֗יר וְ֠/אֵת יוֹאָ֤ח בֶּן יֽוֹאָחָז֙ הַ/מַּזְכִּ֔יר לְ/חַזֵּ֕ק אֶת בֵּ֖ית יְהוָ֥ה אֱלֹהָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: ru
  text: В восемнадцатый год своего царствования, очистив землю и храм[a], Иосия послал Шафана, сына Ацалии, Маасею, начальника города, и Иоаха, сына Иоахаза, летописца, чтобы восстановить[b] храм Яхве, своего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «землю и дом». Здесь «дом» означает храм. Выражение «очистив» можно также понять как «для очищения».'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: 'Или: «укрепить», то есть отремонтировать и привести здание в исправное состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: В восемнадцатый год своего царствования
  rationale: Естественная русская передача формулы датировки по годам правления; начальное וּ выражает продолжение повествования и не требует отдельного «и».
- source_word: לְטַהֵר
  choice: очистив
  rationale: 'Инфинитив с ל допускает целевое прочтение («для очищения»), однако контекст предшествующего очищения страны поддерживает временно-обстоятельственное понимание: отправка состоялась после очищения.'
- source_word: הָאָרֶץ וְהַבָּיִת
  choice: землю и храм
  rationale: בַּיִת буквально означает «дом», но здесь обозначает храм; явное «храм» предотвращает ложное понимание в современном русском.
- source_word: שַׂר הָעִיר
  choice: начальника города
  rationale: שַׂר обозначает высокопоставленного руководителя или должностное лицо; «начальник города» сохраняет широту титула, не приписывая ему более конкретную современную должность.
- source_word: הַמַּזְכִּיר
  choice: летописца
  rationale: Название царского чиновника, отвечавшего за записи и напоминание о государственных делах; традиционное русское «летописец» понятно читателю, хотя точный круг обязанностей не вполне известен.
- source_word: לְחַזֵּק
  choice: чтобы восстановить
  rationale: Буквально «укрепить»; применительно к зданию слово означает привести его в исправное состояние, отремонтировать или восстановить.
- source_word: בֵּית יְהוָה אֱלֹהָיו
  choice: храм Яхве, своего Бога
  rationale: «Храм» передаёт контекстуальное значение «дома», а местоимение «своего» относится к Иосии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Связь לְטַהֵר с основным глаголом
  choice: очистив
  alternative: для очищения
  rationale: Форма допускает целевой оттенок, но ближайший повествовательный контекст описывает уже совершавшееся очищение; примечание сохраняет грамматическую альтернативу.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Имя Иосии добавлено вместо местоимения для ясности в отдельно цитируемом стихе; остальные имена переданы в формах, привычных русской библейской традиции.
