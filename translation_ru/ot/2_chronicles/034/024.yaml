  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יוֹשְׁבָ֑י/ו אֵ֤ת כָּל הָ/אָלוֹת֙ הַ/כְּתוּב֣וֹת עַל הַ/סֵּ֔פֶר אֲשֶׁ֣ר קָֽרְא֔וּ לִ/פְנֵ֖י מֶ֥לֶךְ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Вот, Я наведу бедствие на это место и на его жителей — все проклятия[a], записанные в книге[b], которые прочитали перед царём Иудеи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клятвенные проклятия» — то есть проклятия, служащие санкциями за нарушение обязательств.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать также свиток.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, общепринятой современной русской транслитерацией.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная и торжественная передача устойчивой пророческой формулы вестника.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет указательно-усилительную функцию формулы и подчёркивает непосредственность предстоящего действия.
- source_word: מֵבִיא רָעָה
  choice: наведу бедствие
  rationale: В данном контексте רָעָה означает губительное судебное бедствие, а не нравственное зло; русский глагол «наведу» естественно передаёт каузативный смысл причастия מֵבִיא.
- source_word: הַמָּקוֹם הַזֶּה
  choice: это место
  rationale: Буквальная и естественная передача без уточнения референта сверх сказанного в стихе.
- source_word: יוֹשְׁבָיו
  choice: его жители
  rationale: Краткая современная передача причастного существительного с местоименным суффиксом.
- source_word: אֵת כָּל הָאָלוֹת
  choice: все проклятия
  rationale: אָלָה обозначает проклятие, в том числе санкцию, связанную с клятвой или заветом; основной текст использует ясный общеупотребительный эквивалент.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: записанные в книге
  rationale: Русское «в книге» идиоматично обозначает содержание письменного документа; סֵפֶר может также означать свиток, что отмечено в сноске.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: которую читали перед
  rationale: Сохраняет активную форму множественного числа еврейского глагола и не вводит не названного в стихе субъекта; «перед» естественно передаёт чтение в присутствии царя.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царём Иудеи
  rationale: Прямая и обычная русская передача еврейской сопряжённой конструкции.
theological_decisions:
- issue: Значение רָעָה как действия Бога в суде
  choice: бедствие
  alternative: зло; несчастье
  rationale: Контекст говорит о наказании согласно проклятиям закона. «Бедствие» сохраняет суровый судебный смысл, не создавая ложного впечатления, будто речь идёт о нравственном зле, совершаемом Богом.
- issue: Заветный оттенок אָלוֹת
  choice: проклятия с пояснением в сноске
  alternative: клятвенные проклятия; кары за нарушение завета
  rationale: Основной вариант не перегружает текст терминологией, а сноска сохраняет возможный оттенок санкций, закреплённых клятвой, не сужая значение до одной богословской формулы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим тоном. Синтаксис сохраняет нарастание исходного высказывания, но остаётся ясным для обычного читателя. Личное имя יְהוָה передано как «Яхве», а не заменено титулом.
