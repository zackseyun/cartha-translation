base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: ru
  text: Потому что сердце твоё было восприимчивым[a] и ты смирился перед Богом, услышав Его слова против этого места и его жителей, и потому что ты смирился передо Мной, разорвал свои одежды и плакал предо Мной, Я также услышал тебя, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоё сердце было мягким». Это еврейское выражение обозначает восприимчивое и смиренное внутреннее состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: За то, что
  rationale: Передаёт причинное основание последующего ответа Бога и естественно связывается с формулой «Я тоже услышал тебя».
- source_word: רַךְ לְבָבְךָ
  choice: твоё сердце смягчилось
  rationale: Сохраняет образ мягкости сердца, но по-русски ясно выражает восприимчивость, сокрушение и готовность откликнуться, а не слабость.
- source_word: וַתִּכָּנַע
  choice: ты смирился
  rationale: Нифаль глагола כנע в данном контексте обозначает добровольное смирение перед Богом; одинаковый перевод обоих повторений сохраняет риторику текста.
- source_word: מִלִּפְנֵי אֱלֹהִים
  choice: перед Богом
  rationale: Естественно передаёт еврейскую пространственно-реляционную идиому и идею смирения в Божьем присутствии.
- source_word: בְּשָׁמְעֲךָ
  choice: услышав
  rationale: Деепричастная конструкция естественно и кратко передаёт временное значение ב с инфинитивом.
- source_word: דְּבָרָיו
  choice: Его слова
  rationale: Суффикс относится к Богу; «слова» сохраняет конкретность исходного выражения, не сводя его к более общему «весть».
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: против этого места и его жителей
  rationale: В контексте суда עַל имеет направленно-враждебный оттенок; «против» сохраняет силу пророчества, не нейтрализуя её до «о».
- source_word: לְפָנַי
  choice: передо Мной / предо Мной
  rationale: Сохранён повтор выражения в прямой Божьей речи; варианты формы выбраны ради естественного русского звучания и ритма.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: разорвал свои одежды
  rationale: Передаёт традиционный жест скорби и покаяния; «одежды» звучит достойно и остаётся понятным современному читателю.
- source_word: וַתֵּבְךְּ
  choice: плакал
  rationale: Точно и естественно передаёт выражение глубокой скорби.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: Я тоже услышал тебя
  rationale: «Тоже» сохраняет ответное соответствие между тем, что царь услышал Божьи слова, и тем, что Бог услышал его; объект «тебя» восполнен из контекста для ясности по-русски.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и сохраняет личное имя יהוה как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Направленность Божьих слов о месте и жителях
  choice: против этого места и его жителей
  alternative: об этом месте и его жителях
  rationale: Контекст пророчества о суде поддерживает отрицательно-направленное значение עַל, однако перевод не уточняет сверх текста характер или меру суда.
- issue: Значение смягчившегося сердца
  choice: сердце смягчилось
  alternative: сердце было мягким
  rationale: Формулировка выражает внутреннюю восприимчивость и сокрушение Иосии, не вводя специальной доктринальной терминологии и не превращая образ в абстрактное толкование.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для прямой Божьей речи. Синтаксический повтор «смирился» и «передо Мной» сохранён ради смыслового и риторического акцента. Прописные местоимения в обращении Бога к человеку и при указании на Бога применены согласно принятой русской библейской стилистике.
