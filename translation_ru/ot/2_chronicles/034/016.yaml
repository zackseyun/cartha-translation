base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: ru
  text: 'Шафан принёс книгу царю и также доложил ему: «Всё, что поручено твоим слугам[a], они исполняют».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Всё, что дано в руку твоих слуг». Это еврейский оборот со значением «вверено, поручено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: принёс
  rationale: 'Форма породы hифиль от בוא выражает внесение или доставление: Шафан принёс книгу царю.'
- source_word: הַסֵּפֶר
  choice: книгу
  rationale: Слово סֵפֶר может обозначать книгу, свиток или письменный документ; «книга» естественно соответствует контексту и не уточняет без необходимости материальную форму.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: также доложил ему
  rationale: Оборот означает сообщить или доложить в ответ; עוֹד передано словом «также». Местоимение «ему» естественно избегает тяжёлого повтора слова «царю», не меняя референта.
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: Всё, что поручено твоим слугам
  rationale: Пассивная форма נתן с בְיַד — идиома передачи чего-либо в чьё-либо ведение. «Поручено» естественно передаёт смысл, а буквальный образ сохранён в примечании.
- source_word: עֲבָדֶיךָ
  choice: твоим слугам
  rationale: В контексте царского двора עבד обозначает служащих царю людей; «слуги» сохраняет исходную лексику, тогда как «рабы» здесь было бы чрезмерно узко, а «чиновники» — более толковательно.
- source_word: הֵם עֹשִׂים
  choice: они исполняют
  rationale: Явное местоимение с причастием подчёркивает продолжающееся выполнение порученного. «Исполняют» по-русски естественно сочетается с подразумеваемым поручением.
