base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: ru
  text: Они руководили носильщиками и надзирали за всеми работниками, занятыми на различных видах работ[a]. Некоторые из левитов были писцами, надзирателями и привратниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для работы и работы». Повтор, вероятно, имеет распределительное значение: для каждого вида работы.'
    reason: Сноска сохраняет формальную особенность еврейского текста и отмечает вероятное значение повтора, не выдавая толкование за несомненную форму оригинала.
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: руководили носильщиками
  rationale: Предлог עַל в данном административном контексте указывает на руководство, а סַבָּלִים — на работников, переносивших тяжести. «Носильщики» точно и естественно передаёт эту конкретную обязанность.
- source_word: וּמְנַצְּחִים
  choice: и надзирали
  rationale: Причастие от נצח здесь обозначает руководство и надзор за работами. Глагольная форма естественно согласуется с подразумеваемым субъектом из предыдущего стиха.
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: за всеми, кто выполнял … работу
  rationale: Сохраняется всеохватность כֹל и причастный характер עֹשֵׂה, при этом фраза звучит естественно по-русски.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: ту или иную работу
  rationale: 'Повтор עֲבוֹדָה имеет, вероятнее всего, распределительное значение: речь идёт о каждом отдельном виде порученной работы. Русская конструкция передаёт это значение без неестественного буквального повтора; сам повтор отмечен в сноске.'
- source_word: וּמֵהַלְוִיִּם
  choice: Некоторые из левитов
  rationale: 'Предлог מִן имеет частичное значение: перечисленные обязанности исполняла часть левитов, а не обязательно все они.'
- source_word: סוֹפְרִים
  choice: писцами
  rationale: סוֹפְרִים обозначает писцов, занимавшихся письмом и ведением записей; это устоявшийся и точный русский эквивалент.
- source_word: שֹׁטְרִים
  choice: распорядителями
  rationale: שֹׁטְרִים — должностные лица с административными и надзорными обязанностями. «Распорядители» хорошо соответствует контексту организации храмовых работ.
- source_word: שׁוֹעֲרִים
  choice: привратниками
  rationale: Термин обозначает служителей, отвечавших за ворота или входы; «привратники» — традиционный и понятный русский эквивалент.
