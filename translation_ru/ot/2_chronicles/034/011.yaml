  text: וַֽ/יִּתְּנ֗וּ לֶ/חָֽרָשִׁים֙ וְ/לַ/בֹּנִ֔ים לִ/קְנוֹת֙ אַבְנֵ֣י מַחְצֵ֔ב וְ/עֵצִ֖ים לַֽ/מְחַבְּר֑וֹת וּ/לְ/קָרוֹת֙ אֶת הַ/בָּ֣תִּ֔ים אֲשֶׁ֥ר הִשְׁחִ֖יתוּ מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: ru
  text: Их передали мастерам и строителям, чтобы те купили камень из каменоломен[a] и древесину для соединительных работ[b] и для покрытия зданий кровлей[c], которые разрушили цари Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тёсаный камень». Еврейское выражение означает строительный камень, добытый в каменоломне.'
    reason: lexical_alternative
  - marker: b
    text: Значение еврейского термина не вполне ясно; он может обозначать соединения, крепления или элементы каркаса.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «для балок»; еврейский глагол может означать покрытие или перекрытие строения балками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: И передали их
  rationale: Глагол נתן означает «дать, передать». Местоимение «их» восполняет подразумеваемый из предыдущего контекста объект — деньги — и согласуется с русским употреблением слова «деньги».
- source_word: חָרָשִׁים
  choice: мастерам
  rationale: Слово обозначает квалифицированных ремесленников без ограничения одной профессией; «мастера» естественно и достаточно широко передаёт этот смысл.
- source_word: בֹּנִים
  choice: строителям
  rationale: Причастная форма от בנה обозначает людей, занятых строительством; прямое и естественное соответствие — «строители».
- source_word: לִקְנוֹת
  choice: чтобы купить
  rationale: Инфинитив קנה выражает цель передачи денег; конструкция «чтобы купить» естественна в современном русском языке.
- source_word: אַבְנֵי מַחְצֵב
  choice: камень из каменоломен
  rationale: Сочетание буквально указывает на камень, добываемый в каменоломне. Такой перевод не предполагает сверх текста, что камень уже был полностью отёсан.
- source_word: עֵצִים
  choice: древесину
  rationale: В строительном контексте «древесина» точнее общего слова «дерево» обозначает материал.
- source_word: לַמְחַבְּרוֹת
  choice: для соединительных конструкций
  rationale: Редкий и не вполне ясный термин связан с соединением или скреплением и, вероятно, обозначает конструктивные соединения, крепления либо элементы каркаса. Перевод сохраняет функциональный смысл, не называя один конкретный архитектурный элемент.
- source_word: וּלְקָרוֹת
  choice: и перекрытия
  rationale: Глагол קרה в строительном употреблении означает покрывать или перекрывать строение балками. Существительное действия «перекрытия» естественно выражает назначение древесины, сохраняя возможность как кровельного, так и балочного понимания.
- source_word: הַבָּתִּים
  choice: зданий
  rationale: В контексте ремонта храма форма множественного числа относится к храмовым строениям, а не к обычным жилым домам; «здания» не сужает значение до жилищ.
- source_word: הִשְׁחִיתוּ
  choice: разрушили
  rationale: Порода hифиль глагола שחת может означать «испортить, погубить, разрушить». Здесь «разрушили» ясно передаёт причинённый строениям серьёзный ущерб, не утверждая полного уничтожения.
- source_word: מַלְכֵי יְהוּדָה
  choice: цари Иудеи
  rationale: Прямой перевод сочетания в сопряжённой конструкции.
