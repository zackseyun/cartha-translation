translation_notes:
  register: Современный литературный русский язык с ясной, dignified библейской интонацией. Синтаксис близок к еврейской последовательности действий, но естественен по-русски. Технически неопределённые строительные термины переданы функционально, а существенные альтернативы вынесены в примечания.
