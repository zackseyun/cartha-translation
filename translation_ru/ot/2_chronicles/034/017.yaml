source:
  edition: WLC
  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: ru
  text: Они высыпали[a] серебро, найденное в доме Яхве[b], и передали его в руки надзирателей и в руки тех, кто выполнял работу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опорожнили, вынув серебро»; еврейский глагол здесь может означать, что собранные деньги вынули или выдали. В данном контексте речь, вероятно, не о переплавке серебра.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Яхве» — храм.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: высыпали
  rationale: Глагол может передавать выливание, опорожнение или выдачу содержимого. В контексте храмовых средств речь, вероятнее всего, об извлечении собранного серебра для передачи распорядителям, а не о его переплавке. «Высыпали» сохраняет конкретный образ и допускает пояснение в сноске.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: כֶּסֶף буквально означает «серебро» и также употребляется в значении денег. Здесь буквальное обозначение естественно для храмовых денежных сборов.
- source_word: הַנִּמְצָא
  choice: найденное
  rationale: Причастие нифаля обозначает серебро, которое было найдено или обнаружено; русское причастие кратко и точно воспроизводит определительную конструкцию.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохранено исходное храмовое обозначение «дом Яхве», а не заменено в основном тексте толкованием «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: וַיִּתְּנֻהוּ
  choice: передали его
  rationale: В административном контексте נתן обозначает передачу серебра ответственным лицам; «передали» естественнее по-русски, чем буквальное «дали» или «положили».
- source_word: עַל יַד
  choice: в руки
  rationale: Сохранён понятный русский эквивалент еврейской идиомы, обозначающей передачу в распоряжение или под ответственность.
- source_word: הַמֻּפְקָדִים
  choice: надзирателей
  rationale: Пассивное причастие указывает на назначенных ответственных лиц; в данном контексте они надзирают за работами или средствами.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: тех, кто выполнял работу
  rationale: Широкая формулировка отражает исходное выражение и не сужает его до конкретной ремесленной профессии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение выражения «дом Яхве»
  choice: сохранить «дом Яхве» с пояснением в сноске
  alternative: храм Яхве
  rationale: Формальное храмовое обозначение сохранено в основном тексте, а его референт пояснён без скрытой интерпретационной замены.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Синтаксис прямой и понятный; повтор «в руки» сохранён ради структуры и образности еврейского текста.
