base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: ru
  text: 'И она сказала им: «Так говорит Яхве[a], Бог Израиля: скажите человеку, который послал вас ко мне:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH) — личное имя Бога; традиционно переводится как «Господь».
    reason: Пояснение передачи божественного имени и указание традиционного варианта.
lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: И она сказала им
  rationale: Последовательная глагольная форма продолжает повествование, а местоименный суффикс прямо указывает на собравшихся посланников.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена устойчивая пророческая формула передачи Божьих слов; настоящее время естественно звучит по-русски в формуле прямого послания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо и естественно передаёт конструкцию принадлежности и обозначение Бога Израиля.
- source_word: אִמְרוּ לָאִישׁ
  choice: скажите человеку
  rationale: Форма повелительного наклонения во множественном числе обращена к посланникам; איש здесь обозначает конкретного мужчину — царя Иосию, — но текст называет его человеком.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: который послал вас ко мне
  rationale: Сохранены относительное определение, объект во множественном числе и направление действия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация сохраняет это различие, а традиционная замена титулом отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с сохранением торжественной пророческой формулы. Двоеточие перед закрывающей кавычкой отражает незавершённость вводной формулы: само порученное высказывание следует в следующем стихе.'
