  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: ru
  text: Кости священников он сжёг на их жертвенниках[a] и очистил Иудею и Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на жертвенниках». Еврейская форма здесь необычна; по смыслу Иосия сжёг кости священников на связанных с ними жертвенниках.'
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: Кости священников
  rationale: עַצְמוֹת — форма множественного числа в сопряжённом состоянии со значением «кости»; כֹּהֲנִים означает «священники». В контексте речь идёт о служителях уничтожаемых культов, однако определение «идольские» в самом стихе отсутствует и потому не добавляется. Начальный союз не воспроизводится отдельно, поскольку связь с предыдущим повествованием естественно передаётся последовательностью русской фразы.
- source_word: שָׂרַף
  choice: сжёг
  rationale: Qal, перфект 3-го лица мужского рода единственного числа от שׂרף, «сжигать». Совершенный вид соответствует завершённому повествовательному действию.
- source_word: עַל מזבחותים
  choice: на их жертвенниках
  rationale: עַל передаёт значение «на», а необычная форма существительного по контексту понимается как «их жертвенники», то есть жертвенники, связанные с упомянутыми священниками. Необычность формы и возможное чтение без местоименного значения отмечены в сноске.
- source_word: וַ/יְטַהֵר
  choice: и очистил
  rationale: Порода piel глагола טהר здесь обозначает устранение культового осквернения. «Очистил» сохраняет ритуально-нравственный оттенок и естественно звучит по-русски.
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: Иудею и Иерусалим
  rationale: Оба имени являются прямыми дополнениями; употреблены традиционные современные русские формы географических названий.
theological_decisions:
- issue: Характер очищения Иудеи и Иерусалима
  choice: Очищение земли и города от осквернения, связанного с идолопоклонством
  alternative: Только обрядовое очищение либо лишь физическое уничтожение культовых объектов
  rationale: Контекст реформы и значение טהר указывают на устранение культового осквернения. Глагол «очистил» сохраняет ритуально-нравственную широту выражения, не навязывая более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык; краткий, dignified повествовательный стиль. Инверсия «Кости священников он сжёг» сохраняет смысловой акцент исходной фразы на костях и остаётся понятной современному читателю.
