  terminology: «Яхве» последовательно передаёт יהוה. «Дом Яхве» сохраняет образ и повтор слова בַּיִת; сноска корректно поясняет, что имеется в виду храм. Альтернативная сноска к «отремонтировать и укрепить» обоснованно отмечает возможное «восстановить и упрочить».
