  source_fidelity: 'Перевод точно передаёт последовательность передачи средств: деньги передаются поставленным над домом Яхве работникам, а затем — работникам, выполняющим ремонт. «В руки», «поставленных над», «отремонтировать и укрепить» адекватно отражают עַל־יַד, הַמֻּפְקָדִים, לִבְדּוֹק и לְחַזֵּק. Экспликация «деньги» оправдана ближайшим контекстом и не меняет смысла.'
