source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: ru
  text: Они передали деньги в руки работников, поставленных над домом Яхве[a], а те отдали их работникам, трудившимся в доме Яхве, чтобы отремонтировать и укрепить дом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм Яхве.
    reason: cultural_note
  - marker: b
    text: 'Или: «чтобы восстановить и упрочить дом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: передали / отдали
  rationale: נתן означает «дать, передать, вручить». Разные русские глаголы естественно передают две последовательные передачи одних и тех же средств.
- source_word: עַל יַד
  choice: в руки
  rationale: Еврейская идиома обозначает передачу под чьё-либо управление; русский оборот сохраняет её образность и смысл.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: работников
  rationale: Форма единственного числа имеет здесь собирательное значение и относится к людям, выполняющим строительные работы.
- source_word: הַמֻּפְקָדִים
  choice: поставленных над
  rationale: Страдательное причастие от פקד указывает на возложенную надзорную ответственность.
- source_word: אֹתוֹ
  choice: деньги / их
  rationale: Местоимение отсылает к собранным деньгам из предыдущего контекста. В первой части существительное выражено для ясности по-русски, затем употреблено местоимение.
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: работникам, трудившимся
  rationale: Передаёт повтор корня עשה без тяжеловесного русского повтора «работникам, выполнявшим работу».
- source_word: לִבְדּוֹק
  choice: отремонтировать
  rationale: В контексте храмовых работ בדק означает устранение повреждений, то есть ремонт или восстановление здания.
- source_word: וּלְחַזֵּק
  choice: укрепить
  rationale: חזק в этой конструкции означает сделать строение прочным, усилить его.
- source_word: הַבָּיִת
  choice: дом
  rationale: Сохраняется буквальное обозначение храма как дома, согласованное с выражением «дом Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Дом Яхве как обозначение святилища
  choice: сохранить «дом Яхве» с пояснением
  alternative: перевести прямо как «храм Яхве»
  rationale: Буквальный образ «дома» важен для лексической связи внутри стиха, а сноска делает референт понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского повествования тоном. Для ясности восстановлено слово «деньги» из ближайшего контекста; буквальное «дом Яхве» сохранено и пояснено в сноске.
