base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: ru
  text: 'Хелкия сказал в ответ писцу Шафану: «Я нашёл в доме Яхве книгу Закона[a]». И Хелкия передал книгу Шафану.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свиток Закона»; еврейское слово сефер может обозначать книгу, документ или свиток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: сказал в ответ
  rationale: Сочетание двух глаголов буквально означает «ответил и сказал». Русское «сказал в ответ» сохраняет значение ответной реплики, но избегает неестественного удвоения глаголов речи.
- source_word: הַסּוֹפֵר
  choice: писцу
  rationale: Слово סֹפֵר может обозначать писца или должностного секретаря. «Писец» сохраняет широту значения и уместно для придворно-административного контекста.
- source_word: סֵפֶר הַתּוֹרָה
  choice: книгу Закона
  rationale: סֵפֶר может означать книгу, документ или свиток, а תּוֹרָה здесь относится к авторитетному своду Божьего Закона. Традиционное и понятное выражение «книга Закона» не уточняет материальную форму находки.
- source_word: מָצָאתִי
  choice: я нашёл
  rationale: Еврейский перфект сообщает о завершённой находке, непосредственно значимой в момент речи. В современном русском это естественно передаётся прошедшим временем.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Перевод сохраняет образное наименование храма как «дома» и прямо передаёт личное имя יְהוָה.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: передал книгу Шафану
  rationale: Хотя נתן обычно значит «дать», в этой сцене русское «передал» естественно выражает физическую передачу найденной книги из рук в руки.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. «Яхве» передаёт личное заветное имя, не подменяя его традиционным титулом.
- issue: Значение תּוֹרָה в выражении סֵפֶר הַתּוֹרָה
  choice: Закон
  alternative: наставление
  rationale: «Наставление» лексически возможно, однако контекст находки авторитетного заветного текста поддерживает обычное библейское обозначение «Закон»; конкретный объём найденного текста стих не определяет.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Имена переданы как «Хелкия» и «Шафан». Формула речи сделана естественной по-русски без утраты значения ответа; метафора «дом Яхве» сохранена.
