  text: וּ/מִ/בְּנֵ֖י בָּנִ֑י מְשֻׁלָּ֤ם מַלּוּךְ֙ וַ/עֲדָיָ֔ה יָשׁ֖וּב וּ/שְׁאָ֥ל ירמות׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/029.yaml
  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
translation:
  language: ru
  text: 'Из сыновей Бания: Мешуллам, Маллух, Адая, Яшув, Шеал и Иеремоф.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בָּנִי
  choice: Из сыновей Бания
  rationale: Предлог מִן обозначает выделение лиц из рода Бания; «сыновей» сохраняет формальный язык еврейского перечня. Начальное ו естественно не воспроизводить отдельным союзом в русском продолженном списке.
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Передача личного имени по масоретской огласовке с принятой русской формой.
- source_word: מַלּוּךְ
  choice: Маллух
  rationale: 'Имя передано непосредственно с еврейского: конечная буква כ здесь обозначает звук «х», поэтому русское «Маллух» точнее английской графической формы Malluk.'
- source_word: וַ/עֲדָיָה
  choice: Адая
  rationale: Личное имя передано в естественной русской форме; союз включён в структуру перечисления и отдельно не повторяется.
- source_word: יָשׁוּב
  choice: Яшув
  rationale: Транслитерация соответствует масоретской огласовке; конечное ב без дагеша передаётся как «в».
- source_word: וּ/שְׁאָל
  choice: Шеал
  rationale: Передача следует масоретской огласовке שְׁאָל; союз оформлен русским «и» перед последним бесспорным элементом списка с учётом следующего имени.
- source_word: ירמות
  choice: Ремоф
  rationale: Согласный текст допускает неоднозначность. В WLC дано непунктированное ירמות, тогда как масоретская помета/традиция чтения и параллельная форма имени поддерживают чтение Ремоф; неопределённость отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Краткий генеалогический перечень передан современным литературным русским языком с сохранением формулы «из сыновей». Имена транслитерированы прежде всего по еврейскому тексту, а не через английские формы. Сноска отмечает реальную неоднозначность последнего непунктированного имени.
