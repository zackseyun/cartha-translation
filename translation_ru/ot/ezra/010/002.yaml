source:
  edition: WLC
  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: ru
  text: 'Тогда Шехания, сын Иехиила, из потомков Елама, ответил Ездре: «Мы поступили вероломно по отношению к нашему Богу[a], взяв себе в жёны чужеземок из народов этой земли[b]. И всё же теперь у Израиля есть надежда в этом деле[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы нарушили верность нашему Богу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поселив у себя чужеземных женщин»; по контексту речь идёт о том, что их взяли в жёны.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «относительно этого»; возможно также: «несмотря на это».'
    reason: ambiguity_preservation
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: В повествовательной формуле сочетание «ответил и сказал» естественно передаётся по-русски одним глаголом «ответил», без потери смысла.
- source_word: שְׁכַנְיָה בֶן־יְחִיאֵל
  choice: Шехания, сын Иехиила
  rationale: Имена переданы принятой русской библейской транслитерацией; конструкция родства сохранена буквально.
- source_word: מִבְּנֵי עוֹלָם
  choice: из потомков Елама
  rationale: בְּנֵי здесь обозначает родовую группу, поэтому естественное русское соответствие — «потомки»; עולם в данном контексте является именем Елам.
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: мы поступили вероломно по отношению к нашему Богу
  rationale: Глагол מעל обозначает неверность и нарушение обязательств; «вероломно» сохраняет смысл измены доверию или заветной верности, а не сводит признание к общему «согрешили».
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: взяв себе в жёны чужеземок
  rationale: Контекст и употребление глагольной формы указывают на заключение браков. Такая формулировка ясна современному читателю и сохраняет прямое обозначение женщин как чужеземок.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: из народов этой земли
  rationale: Множественное עַמֵּי передано словом «народов», а единственное הָאָרֶץ — «этой земли»; указательное слово делает русскую фразу естественной в контексте.
- source_word: וְעַתָּה יֵשׁ מִקְוֶה לְיִשְׂרָאֵל
  choice: И всё же теперь у Израиля есть надежда
  rationale: מִקְוֶה означает надежду или основание надеяться. «И всё же» естественно выражает риторический переход от признания вины к возможности исправления.
- source_word: עַל־זֹאת
  choice: в этом деле
  rationale: Предлог עַל с указательным местоимением допускает значение «относительно этого, по этому поводу». «В этом деле» звучит естественно и не определяет заранее, состоит ли надежда в разрешении ситуации или существует вопреки ей.
theological_decisions:
- issue: Заветный оттенок глагола מָעַל
  choice: «поступили вероломно по отношению к нашему Богу»
  alternative: «согрешили против нашего Бога»; «оказались неверны нашему Богу»
  rationale: Выбранный вариант сохраняет особый смысл нарушения верности Богу и не заменяет его более общим понятием греха.
- issue: Характер чужеземных браков
  choice: «взяв себе в жёны чужеземок из народов этой земли»
  alternative: «женившись на чужеземных женщинах»; «поселив у себя чужеземных женщин»
  rationale: Брачный смысл подтверждается контекстом, но перевод не добавляет утверждений о мотивах, вере или нравственном состоянии этих женщин сверх сказанного в стихе.
- issue: Значение עַל־זֹאת в заключении
  choice: «есть надежда в этом деле»
  alternative: «есть надежда относительно этого»; «есть надежда, несмотря на это»
  rationale: Еврейская конструкция допускает разные смысловые оттенки. Основной текст сохраняет связь надежды с возникшей ситуацией, не превращая её однозначно в уступительное «несмотря на это».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Устранено неестественное для русского удвоение «ответил и сказал», но сохранены родовая принадлежность, признание неверности Богу и неоднозначность заключительной конструкции.
