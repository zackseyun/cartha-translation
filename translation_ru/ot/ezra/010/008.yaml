  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: условие неявки в установленный трёхдневный срок, постановление начальников и старейшин, санкция в отношении имущества и отделение человека от общины сохранены. «Предано заклятию» удачно удерживает техническую неоднозначность יחרם; сноска корректно поясняет возможность конфискации либо уничтожения.'
  naturalness: Начальное «А у всякого» в современном русском звучит несколько тяжеловесно и неестественно для нормативного условия. Более прямое «У всякого, кто…» сохраняет структуру и делает фразу литературно естественнее. «По решению» также естественнее, чем «согласно решению», в контексте обязательного постановления.
  terminology: «Начальники и старейшины» приемлемо для שרים и זקנים. «Собрание переселенцев» возможно, но «община переселенцев» в русском яснее передаёт קהל как коллектив людей, не создавая впечатления разового собрания. Термин «заклятие» оставлен в основном тексте, а сноска предотвращает сведение חרם к одному значению.
  issues:
