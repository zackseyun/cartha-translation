language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: ru
  text: У всякого, кто не явится в течение трёх дней, по решению начальников и старейшин всё его имущество будет предано заклятию[a], а сам он будет отделён от общины переселенцев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет конфисковано»; возможно также: «будет предано уничтожению». Еврейский глагол означает предать что-либо херему — заклятию или запрету, который мог предполагать уничтожение либо изъятие имущества.'
    reason: Сохраняет смысловую широту технического термина חרם и отмечает наиболее вероятный практический смысл в данном административном контексте.
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: А у всякого, кто
  rationale: Передаёт обобщённо-условное и распределительное значение оборота и естественно связывается с последующим наказанием имущества.
- source_word: לֹא יָבוֹא
  choice: не явится
  rationale: В контексте обязательного созыва глагол означает не просто прибытие, а явку по требованию.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: в течение трёх дней
  rationale: Ясно выражает установленный срок, не уточняя сверх текста, отсчитывается ли он как три полных суток или как календарный предел.
- source_word: כַּעֲצַת
  choice: согласно решению
  rationale: עֵצָה может означать совет, замысел или решение; административно-правовой контекст указывает здесь на властное постановление.
- source_word: הַשָּׂרִים וְהַזְּקֵנִים
  choice: начальников и старейшин
  rationale: «Начальники» передаёт административный статус שרים без архаического «князья»; «старейшины» является устойчивым соответствием זקנים.
- source_word: יָחֳרַם
  choice: будет предано заклятию
  rationale: Сохраняет специальное значение חרם — помещение под запрет/заклятие с возможным следствием уничтожения или конфискации — и не сводит его безоговорочно к современной юридической конфискации.
- source_word: כָּל רְכוּשׁוֹ
  choice: всё имущество
  rationale: Точно и естественно обозначает совокупность владений в правовом контексте.
- source_word: וְהוּא יִבָּדֵל
  choice: а сам он будет отделён
  rationale: Передаёт усиленное явным местоимением личное последствие и сохраняет значение Niphal בדל без привнесения позднейшего термина «отлучён».
- source_word: מִקְּהַל הַגּוֹלָה
  choice: от собрания переселенцев
  rationale: קהל передано нейтральным «собрание», а הגולה — как община людей переселения/плена; «переселенцы» подходит к возвратившейся послепленной общине и не сужает значение до находящихся в изгнании.
theological_decisions:
- issue: Смысл наказания חרם, налагаемого на имущество
  choice: «будет предано заклятию» в основном тексте с пояснением возможной конфискации или уничтожения в сноске
  alternative: «будет конфисковано»; «будет предано уничтожению»; «будет подвергнуто запрету»
  rationale: Еврейский технический термин шире простой конфискации. Контекст допускает изъятие имущества, но не позволяет безоговорочно устранить оттенки посвящения под заклятие и уничтожения.
- issue: Характер удаления из общины
  choice: «будет отделён»
  alternative: «будет исключён»; «будет отлучён»
  rationale: Текст говорит об отделении от собрания переселенцев, не определяя его через более поздние церковно-институциональные категории.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-повествовательного контекста. Синтаксис близок к еврейскому, но естественен по-русски; архаизмы и конфессионально нагруженные термины исключены.
