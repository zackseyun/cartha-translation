    rationale: Еврейское וְכֹל может передаваться без отдельного русского союза; «У всякого, кто…» звучит естественнее и не меняет условно-обобщённого смысла.
  - severity: low
    issue: «Собрание переселенцев» может восприниматься как конкретное мероприятие, а не как коллектив/сообщество.
    rationale: קְהַל הַגּוֹלָה обозначает общину людей изгнания/переселения. «Община переселенцев» лучше работает в современном русском, не добавляя конфессионального значения.
  revised_text: У всякого, кто не явится в течение трёх дней, по решению начальников и старейшин всё его имущество будет предано заклятию[a], а сам он будет отделён от общины переселенцев.
