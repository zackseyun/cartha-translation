base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: ru
  text: 'Тогда священник Ездра встал и сказал им: «Вы поступили вероломно: взяли себе в жёны чужеземок и тем умножили вину Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Передаёт физическое и публичное действие Ездры в собрании естественным современным русским языком.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Прямо передаёт титул Ездры; препозитивное положение естественно для русского литературного синтаксиса.
- source_word: מְעַלְתֶּם
  choice: вы поступили вероломно
  rationale: Глагол מעל обозначает нарушение верности, особенно в заветном контексте. «Поступили вероломно» сохраняет нравственную и заветную окраску без узкоконфессиональной терминологии.
- source_word: וַתֹּשִׁיבוּ
  choice: взяли себе в жёны
  rationale: Хифиль от ישב буквально связан с поселением или введением в дом; в данном контексте речь идёт о женщинах, взятых в брачный союз. Формулировка естественна по-русски и сохраняет контекстуальный смысл.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: чужеземок
  rationale: В сочетании с «взяли себе в жёны» слово однозначно обозначает чужеземных женщин в брачном контексте. «Чужеземок» точнее передаёт принадлежность к иным народам, чем более широкое «иностранок».
- source_word: לְהוֹסִיף
  choice: и тем умножили
  rationale: Инфинитив выражает следствие совершённого проступка. «И тем умножили» ясно передаёт причинно-результативную связь.
- source_word: אַשְׁמַת
  choice: вину
  rationale: Здесь слово обозначает вину или виновность, а не жертву повинности. Русское «вина» сохраняет юридико-нравственный смысл.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Обозначает народ Израиля как единую общину, несущую совокупную ответственность.
theological_decisions:
- issue: Совокупная заветная виновность общины
  choice: умножили вину Израиля
  alternative: прибавили вины Израилю
  rationale: Формулировка сохраняет мысль о том, что действия отдельных людей увеличивают виновность всего Израиля, не расширяя и не сглаживая богословское напряжение текста.
- issue: Характер проступка, выраженный מעל
  choice: поступили вероломно
  alternative: оказались неверны
  rationale: Выбрана активная формулировка, соответствующая форме глагола и подчёркивающая нарушение верности; при этом не уточняется сверх текста, кому именно была нарушена верность.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Сохранена прямая речь и корпоративный смысл «вины Израиля». Двоеточие после «вероломно» естественно связывает общее обвинение с его конкретным проявлением.
