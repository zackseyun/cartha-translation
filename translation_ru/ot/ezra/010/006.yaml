base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: ru
  text: Тогда Ездра поднялся от дома Божьего и пошёл в помещение Иоханана, сына Елиашива[a]. Придя туда, он не ел хлеба и не пил воды, потому что скорбел о неверности[c] общины возвратившихся из плена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская форма имени может быть передана как «Йехоханан».
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает послепленную общину, возвратившуюся из изгнания.
    reason: cultural_note
  - marker: c
    text: 'Или: «вероломстве», «нарушении верности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: с места перед домом Божьим
  rationale: Предлог מִלִּפְנֵי передаёт исходную точку «от/из места перед», а «дом Божий» сохраняет конкретную еврейскую формулировку, обозначающую храм.
- source_word: לִשְׁכַּת
  choice: в комнату
  rationale: לִשְׁכָּה обозначает отдельное помещение при храмовом или служебном комплексе; современное «комната» здесь яснее архаичного «палата».
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: Иоханана, сына Елиашива
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; примечание сообщает более близкую к еврейскому звучанию форму первого имени.
- source_word: וַיֵּלֶךְ שָׁם
  choice: Придя туда
  rationale: 'Еврейский текст буквально повторяет глагол движения: «и пошёл туда». Деепричастная конструкция сохраняет движение к названному месту и устраняет неестественный для русского буквальный повтор.'
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: не ел хлеба и не пил воды
  rationale: Сохранены оба конкретных существительных и параллельное построение, выражающие полный пост.
- source_word: מִתְאַבֵּל
  choice: скорбел
  rationale: Форма глагола אָבַל обозначает пребывание в скорби, нередко выражаемой постом; «скорбел» естественно передаёт это состояние по-русски.
- source_word: מַעַל
  choice: неверности
  rationale: מַעַל означает вероломное нарушение верности, в данном контексте — общинную и заветную неверность. Выбор сохраняет нравственную и богословскую весомость, не сужая смысл до юридической вины.
- source_word: הַגּוֹלָה
  choice: переселенцев
  rationale: Слово обозначает общину плена, то есть в контексте Ездры возвратившихся из вавилонского плена. Краткое традиционное обозначение сохранено и разъяснено в примечании.
theological_decisions:
- issue: Передача מַעַל в контексте нарушения верности завету
  choice: неверность
  alternative: вероломство; преступление; вина
  rationale: «Неверность» охватывает сознательное нарушение обязательств перед Богом и не сводит выражение ни к одному только юридическому проступку, ни к эмоциональному состоянию.
- issue: Передача בֵּית הָאֱלֹהִים
  choice: дом Божий
  alternative: храм Божий
  rationale: Буквальный образ остаётся понятным русскому читателю и сохраняет лексику источника, тогда как «храм» верно указывает референт, но устраняет исходную метафору дома.
- issue: Понимание הַגּוֹלָה
  choice: переселенцы, то есть возвратившаяся из плена община
  alternative: изгнанники; пленники
  rationale: Речь идёт не о людях, всё ещё находящихся в изгнании, а о послепленной общине; пояснение предотвращает исторически неверное прочтение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным, но сохранены конкретные образы источника: дом Божий, хлеб и вода. Архаизмы и конфессионально окрашенные толкования не вводятся.'
