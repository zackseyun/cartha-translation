- from: Тогда Ездра поднялся с места перед домом Божьим и пошёл в комнату Иоханана, сына Елиашива[a]. Придя туда, он не ел хлеба и не пил воды, потому что скорбел о неверности[c] переселенцев[b].
  to: Тогда Ездра поднялся от дома Божьего и пошёл в помещение Иоханана, сына Елиашива[a]. Придя туда, он не ел хлеба и не пил воды, потому что скорбел о неверности[c] общины возвратившихся из плена[b].
