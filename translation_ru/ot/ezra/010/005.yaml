lexical_decisions:
- source_word: וַיָּקָם
  choice: и встал
  rationale: Передаёт повествовательную форму глагола קום и решительный переход Ездры к действию, сохраняя характерное для еврейского рассказа соединение предложений союзом «и».
- source_word: וַיַּשְׁבַּע
  choice: взял ... клятву
  rationale: Каузативная форма от שׁבע означает, что Ездра побудил названных людей поклясться. Русское выражение «взял с ... клятву» ясно передаёт этот смысл без излишнего оттенка принуждения, возможного у «заставил поклясться».
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: начальников священников
  rationale: שָׂרֵי обозначает руководителей или глав среди священников. Такой перевод сохраняет структуру исходного выражения и не смешивает их с особым новозаветным обозначением «первосвященники».
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Устоявшееся русское обозначение группы לְוִיִּם.
- source_word: וְכָל יִשְׂרָאֵל
  choice: и всего Израиля
  rationale: Сохраняет собирательное, заветное обозначение народа, а падеж обусловлен русской конструкцией «взял с ... клятву».
- source_word: לַעֲשׂוֹת
  choice: поступить
  rationale: В данном контексте עשה означает исполнить принятое решение; «поступить» естественно сочетается с оборотом «согласно этому слову» и сохраняет идею действия.
- source_word: כַּדָּבָר הַזֶּה
  choice: согласно этому слову
  rationale: Близко передаёт буквальное значение דָּבָר, при этом примечание сохраняет уместные в контексте значения «дело» и «предложение».
- source_word: וַיִּשָּׁבֵעוּ
  choice: и они поклялись
  rationale: Прямо передаёт возвратную/пассивную форму от שׁבע и сохраняет намеренное повторение корня после каузативного глагола.
