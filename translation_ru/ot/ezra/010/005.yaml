  - severity: low
    issue: «Начальников священников» менее естественно, чем «глав священников».
    rationale: Оба варианта возможны, но «главы священников» — обычное современное литературное обозначение руководителей среди священников и ясно отражает שָׂרֵי הַכֹּהֲנִים.
