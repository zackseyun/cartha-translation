  rationale: Правка устраняет неоднозначность каузативного действия «привёл к присяге», заменяет менее естественное «начальники священников» на «главы священников» и передаёт контекстуальное значение דָּבָר как «дело», сохраняя лексическую неоднозначность в сноске. Союз перед заключительным действием сохранён, а точка с запятой делает длинное русское предложение читаемым.
