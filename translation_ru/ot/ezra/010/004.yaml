lexical_decisions:
- source_word: קוּם
  choice: Встань
  rationale: Повелительная форма призывает Ездру немедленно подняться и приступить к делу; прямой и естественный русский эквивалент сохраняет побудительную силу.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего повеления и в современном русском ясно передаёт причинную связь.
- source_word: עָלֶיךָ הַדָּבָר
  choice: это дело лежит на тебе
  rationale: Сохранён образ еврейского оборота על + лицо, обозначающего возложенную ответственность; смысл разъяснён в сноске без замены образа толкованием в основном тексте.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: а мы — с тобой
  rationale: Фраза выражает поддержку и солидарность; противительно-сопоставительное «а» естественно связывает личную ответственность Ездры с готовностью общины поддержать его.
- source_word: חֲזַק
  choice: Будь твёрд
  rationale: В данном призыве передаёт стойкость и решимость; вариант «будь силён» был бы менее естественен по-русски, а «мужайся» звучит более традиционно и несколько архаично.
- source_word: וַעֲשֵׂה
  choice: и действуй
  rationale: Повеление требует конкретно приступить к исполнению обсуждаемого дела. «Действуй» естественно передаёт подразумеваемый объект, не добавляя его повторно.
