  source_fidelity: 'Перевод точно передаёт повелительные формы и основные элементы еврейского текста: «воздайте хвалу», «Богу ваших отцов», «исполните Его волю», «отделитесь», а также множественное «народов» и буквальное «чужеземных женщин». Формулировка «этой земли» является естественным русским способом передать הָאָרֶץ в данной речевой ситуации и не навязывает более узкого географического определения.'
