source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: ru
  text: Итак, воздайте хвалу ГОСПОДУ[a], Богу ваших отцов, и исполните Его волю. Отделитесь от народов этой земли и от чужеземных женщин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признайтесь перед ГОСПОДОМ». Еврейский оборот может в данном контексте означать как воздаяние хвалы или благодарности, так и исповедание вины.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «чужеземных жён». В более широком контексте речь идёт о браках, хотя здесь в еврейском тексте буквально сказано «чужеземных женщин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: воздайте хвалу
  rationale: Оборот буквально связан с благодарением или хвалой, но в данном контексте может также подразумевать исповедание вины. Основной вариант сохраняет естественную русскую формулу, а возможный смысл исповедания отмечен в сноске.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Тетраграмматон передан традиционным русским библейским соответствием «ГОСПОДЬ».
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Богу ваших отцов
  rationale: Формальная передача сохраняет заветный и родовой оттенок еврейского выражения.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: и исполните Его волю
  rationale: По-русски «исполнить волю» естественно выражает повеление поступить согласно Божьему желанию.
- source_word: וְהִבָּדְלוּ
  choice: Отделитесь
  rationale: Возвратная форма передаёт активное требование самим отстраниться.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: от народов этой земли
  rationale: Сохранены множественное число «народы» и пространственное обозначение земли без уточнения, которого нет в тексте.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: и от чужеземных женщин
  rationale: Еврейский текст прямо говорит о женщинах, хотя из более широкого контекста ясно, что речь идёт о жёнах; эта контекстуальная возможность вынесена в сноску.
theological_decisions:
- issue: Означает ли תְּנוּ תוֹדָה здесь хвалу/благодарение или исповедание
  choice: воздайте хвалу
  alternative: признайтесь перед ГОСПОДОМ / исповедайтесь ГОСПОДУ
  rationale: Сам оборот допускает значение хвалы или благодарения, тогда как контекст покаяния поддерживает значение исповедания. Неоднозначность сохранена посредством сноски.
- issue: Следует ли конкретизировать הַנָּשִׁים הַנָּכְרִיּוֹת как жён
  choice: чужеземных женщин
  alternative: чужеземных жён
  rationale: Основной текст следует непосредственной лексической форме, а брачный контекст отражён в сноске без внесения уточнения в сам стих.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис ясен и повелителен; сохранены исходная неоднозначность תּוֹדָה и различие между буквальным «женщины» и контекстуальным «жёны».
