  rationale: Личное имя передано русской транслитерацией; конечная буква каф здесь произносится как фрикативный звук и естественно передаётся через «х».
- source_word: שְׁמַרְיָה
  choice: Шемарья
  rationale: Личное имя передано близко к еврейскому звучанию; написание «-ья» отражает конечный элемент יָה и остаётся удобочитаемым по-русски.
