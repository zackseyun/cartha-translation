lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: ответило
  rationale: В данном повествовательном контексте ענה вводит ответ собрания на обращение Ездры; «ответило» естественно передаёт эту функцию.
- source_word: כָל הַקָּהָל
  choice: всё собрание
  rationale: קָהָל обозначает собравшуюся общину; «собрание» сохраняет корпоративный смысл, а «всё» прямо передаёт כָל.
- source_word: וַיֹּאמְרוּ קוֹל גָּדוֹל
  choice: громким голосом
  rationale: Буквально «сказали великим/громким голосом». В русском сочетание «ответило громким голосом» естественно объединяет два глагола речи без избыточного «ответило и сказало» и сохраняет публичность и силу ответа.
- source_word: כֵּן
  choice: Да! … так
  rationale: כֵּן выражает решительное согласие и одновременно соотносится с последующим образом действия. Русская конструкция «Да! Как… так…» передаёт обе стороны выражения.
- source_word: כִדְבָרֶיךָ
  choice: как ты сказал
  rationale: Буквально «согласно твоим словам». Идиоматическое «как ты сказал» точно передаёт отсылку к сказанному Ездрой и звучит естественно по-русски.
- source_word: עָלֵינוּ לַעֲשׂוֹת
  choice: мы и должны сделать
  rationale: Оборот с עַל выражает лежащую на говорящих обязанность. «Мы и должны сделать» ясно и естественно передаёт это обязательство, сохраняя акцент на самих отвечающих.
