  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: ru
  text: 'И всё собрание ответило громким голосом: «Да! Как ты сказал, так мы и должны сделать».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Да, согласно твоим словам, на нас лежит обязанность сделать [это]».'
