base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: ru
  text: Вернувшиеся изгнанники[a] так и сделали. Ездра-священник и мужчины — главы родов[c], по своим родовым домам, все поимённо, — отделились[b]. В первый день десятого месяца они сели, чтобы расследовать это дело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны изгнания» или «сыны переселения» — общее название общины, вернувшейся из изгнания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, в контексте: «Ездра-священник отобрал мужчин, глав родов». Еврейский глагол стоит во множественном числе и буквально означает «отделились»; поэтому текст также можно понимать как указание на Ездру и этих мужчин, отделившихся для разбора дела.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «главы отцов»; то есть главы родовых домов (родов).'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: переселенцы
  rationale: Буквально выражение означает «сыны переселения (изгнания)» и служит общим обозначением вернувшейся общины. «Переселенцы» естественно передаёт этот корпоративный смысл, а буквальная форма отмечена в сноске.
- source_word: וַיִּבָּדְלוּ
  choice: отделились
  rationale: Нифаль глагола בדל имеет множественное число и наиболее прямо означает «отделились». Такое прочтение согласует сказуемое с перечисленными далее Ездрой и главами родов и сохраняет формальную неоднозначность текста; контекстуальное понимание как отбора представителей дано в сноске.
- source_word: עֶזְרָא הַכֹּהֵן
  choice: Ездра-священник
  rationale: Передаёт только явно названное в стихе звание; слово «книжник» из соседнего контекста не добавляется.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת
  choice: мужчины — главы родов
  rationale: Сохраняет явно выраженное אֲנָשִׁים «мужчины» и передаёт רָאשֵׁי הָאָבוֹת как руководителей родовых объединений.
- source_word: לְבֵית אֲבֹתָם
  choice: каждый от своего рода
  rationale: Естественно по-русски выражает распределение глав по их родовым домам, не повторяя тяжеловесно слово «род».
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: все названные поимённо
  rationale: Указывает на индивидуальное определение или перечисление участников.
- source_word: וַיֵּשְׁבוּ
  choice: они сели
  rationale: Сохраняет прямое значение ישב и в данном административном контексте естественно вводит заседание для расследования.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: в первый день десятого месяца
  rationale: Стандартная русская передача еврейского календарного выражения «в день один месяца десятого».
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: чтобы расследовать это дело
  rationale: דרש здесь обозначает тщательное рассмотрение или расследование вопроса; «это дело» связывает выражение с рассматриваемым случаем.
theological_decisions:
- issue: Кто является субъектом וַיִּבָּדְלוּ и означает ли глагол назначение представителей
  choice: Ездра и названные главы родов «отделились»
  alternative: «Ездра-священник отобрал мужчин, глав родов»
  rationale: Масоретский текст содержит глагол во множественном числе в Нифале и не содержит показателя прямого дополнения перед אֲנָשִׁים. Поэтому чтение с составным субъектом формально сильнее. Контекст допускает смысл выделения комиссии, но перевод не превращает пассивно-возвратную форму без оговорки в переходное «отобрал».
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прояснён тире, но сохранена необычная структура исходного текста и его неоднозначность относительно отделения или отбора комиссии.
