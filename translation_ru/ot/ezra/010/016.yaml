  source_fidelity: 'Первая и последняя фразы в целом передают еврейский текст верно. Однако «каждый от своего рода» неточно передаёт לְבֵית אֲבֹתָם: речь о классификации/представительстве «по их родовым домам», а не просто о происхождении каждого. Формально множественное וַיִּבָּדְלוּ естественно позволяет передать Ездру и мужчин как составной субъект: «отделились». Контекст допускает также понимание об отборе представителей, но его следует отмечать именно как контекстуальное истолкование, а не как грамматический эквивалент формы «были выделены».'
  naturalness: Текст понятен и имеет уместный библейский регистр, но вставка «каждый от своего рода и все названные поимённо» тяжеловесна и несколько размывает отношение слов в оригинале. «По своим родовым домам» точнее и достаточно естественно; «все поимённо» кратко передаёт индивидуальное именование/регистрацию.
  terminology: '«Ездра-священник», «главы родов» и «расследовать дело» приемлемы. «Переселенцы» может обозначать любых переселенцев и ослабляет исторически определённый смысл הַגּוֹלָה; «вернувшиеся изгнанники» точнее в основном тексте, при сохранении буквального варианта в сноске. Сноска b нуждается в исправлении: «были выделены» не является прямым переводом множественного возвратно-пассивного глагола в данной синтаксической конструкции.'
