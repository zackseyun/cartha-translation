base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: ru
  text: Только Ионафан, сын Асаила, и Яхзея, сын Тиквы, выступили против этого[a], а Мешуллам и Шаббетай, левит, поддержали их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заняли позицию по этому делу». Еврейское выражение допускает также понимание, при котором речь идёт не о противодействии, а о позиции или участии в деле, о котором идёт речь.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: В контексте частица ограничивает число исключений из общего согласия и естественно передаётся словом «только».
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: Ионафан, сын Асаила
  rationale: Имена переданы в принятой русской библейской форме; בֶּן передано как «сын».
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: Яхзея, сын Тиквы
  rationale: Транслитерация следует масоретской огласовке יַחְזְיָה; падежное оформление соответствует русскому синтаксису.
- source_word: עָמְדוּ עַל זֹאת
  choice: выступили против этого
  rationale: В данном контексте оборот означает занять позицию против предложенного порядка действий; перевод сохраняет смысл противодействия естественным современным русским выражением.
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: а Мешуллам и левит Шаббетай
  rationale: Определение הַלֵּוִי по еврейскому порядку слов относится непосредственно к Шаббетаю; союз передан как «а», чтобы ясно выразить различие ролей.
- source_word: עֲזָרֻם
  choice: поддержали их
  rationale: Форма означает «помогли им»; в процедурном контексте «поддержали их» естественно передаёт содействие позиции двух названных людей.
