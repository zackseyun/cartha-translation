  text: וּ/מִֽ/יִּשְׂרָאֵ֑ל מִ/בְּנֵ֣י פַרְעֹ֡שׁ רַ֠מְיָה וְ/יִזִּיָּ֤ה וּ/מַלְכִּיָּה֙ וּ/מִיָּמִ֣ן וְ/אֶלְעָזָ֔ר וּ/מַלְכִּיָּ֖ה וּ/בְנָיָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: ru
  text: 'А из израильтян, из сыновей Пароша: Рамия, Иззия, Малхия, Миямин, Елеазар, Малхия[a] и Ванея.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте имя Малхия в этом перечне названо дважды; вероятно, речь идёт о двух разных людях с одинаковым именем.
    reason: Повтор имени может показаться ошибкой переписчика или перевода, поэтому примечание поясняет, что он присутствует в исходном тексте и сохранён.
lexical_decisions:
- source_word: וּמִיִּשְׂרָאֵל
  choice: А из израильтян
  rationale: Союз передаёт продолжение списка, а сочетание «из израильтян» естественно обозначает людей из народа Израиля и отличает их от ранее названных групп.
- source_word: מִבְּנֵי פַרְעֹשׁ
  choice: из сыновей Пароша
  rationale: Сохранена формальная родословно-списочная конструкция בְּנֵי; здесь она может обозначать сыновей, потомков или членов рода Пароша, поэтому буквальная формулировка не устраняет эту смысловую широту.
- source_word: רַמְיָה
  choice: Рамия
  rationale: Передача еврейского личного имени средствами русской библейской ономастики.
- source_word: יִזִּיָּה
  choice: Иззия
  rationale: Транслитерация сохраняет удвоенный согласный и форму еврейского имени без отождествления с иным именем.
- source_word: מַלְכִּיָּה
  choice: Малхия
  rationale: Традиционная и узнаваемая русская передача имени; одинаковая форма сохранена в обоих его появлениях.
- source_word: מִיָּמִן
  choice: Миямин
  rationale: Близкая к еврейской форме русская транслитерация имени.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: בְנָיָה
  choice: Ванея
  rationale: Устоявшаяся русская библейская форма имени.
