base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: ru
  text: 'Из сыновей Нево: Иеиел, Маттифия, Завад, Зевина, Иаддай[a], Иоиль и Ванея.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское написание этого имени не вполне ясно; его также можно передать как Иддо или Йедо.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Из сыновей
  rationale: Предлог מִן при בְּנֵי вводит представителей одной из родовых групп; формула «из сыновей» естественна для русского библейского перечня и сохраняет структуру исходного текста.
- source_word: נְבוֹ
  choice: Нево
  rationale: Имя собственное передано принятой русской библейской транслитерацией.
- source_word: יְעִיאֵל
  choice: Иеиел
  rationale: Транслитерация еврейского личного имени в узнаваемой русской библейской форме.
- source_word: מַתִּתְיָה
  choice: Маттифия
  rationale: Форма передаёт еврейское личное имя и соответствует устойчивой русской библейской традиции.
- source_word: זָבָד
  choice: Завад
  rationale: Прямая передача личного имени с учётом русской библейской традиции.
- source_word: זְבִינָא
  choice: Зевина
  rationale: Личное имя передано естественной для русского языка формой.
- source_word: ידו
  choice: Иаддай[a]
  rationale: Написание имени в представленном еврейском тексте не вполне ясно. В основном тексте сохранена традиционная идентификация «Иаддай», а неопределённость и возможные варианты отражены в сноске.
- source_word: וְ/יוֹאֵל
  choice: Иоиль
  rationale: Союз וְ передан в структуре русского перечисления перед последним именем, а личное имя — принятой русской формой.
- source_word: בְּנָיָה
  choice: Ванея
  rationale: Использована устойчивая русская библейская форма еврейского имени Беная.
