lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: объявили
  rationale: Сочетание каузативной формы עבר с קוֹל — идиома о распространении публичного объявления. Русское «объявили» естественно и точно передаёт действие в данном административном контексте.
- source_word: בִּיהוּדָה וִירוּשָׁלִַם
  choice: по всей Иудее и Иерусалиму
  rationale: Предлог ב обозначает территорию распространения объявления; «по всей» ясно передаёт охват, подразумеваемый контекстом.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: всем вернувшимся из плена
  rationale: Буквально «всем сынам изгнания»; это устойчивое обозначение общины бывших пленников, возвратившихся в Иудею. В современном русском буквальная калька звучала бы неестественно, поэтому смысл передан идиоматически, а буквальная форма отмечена в сноске.
- source_word: לְהִקָּבֵץ
  choice: чтобы они собрались
  rationale: Инфинитив нифаля с ל выражает содержание или цель объявления; конструкция «чтобы они собрались» естественна для русского языка.
- source_word: יְרוּשָׁלִָם
  choice: в Иерусалиме
  rationale: При глаголе «собраться» форма с «в» естественно обозначает место общего собрания, не исключая движения к нему.
