  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: ru
  text: И объявили по Иудее и Иерусалиму всем возвратившимся из изгнания[a], чтобы они собрались в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всем сыновьям изгнания»; обозначение общины возвратившихся из изгнания.'
