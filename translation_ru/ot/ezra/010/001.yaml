base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: ru
  text: Когда Ездра молился и исповедовался, плача и падая ниц перед домом Божьим, к нему собралось великое множество израильтян — мужчин, женщин и детей, — ибо народ плакал, проливая много слёз.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא וּכְהִתְוַדֹּתוֹ
  choice: Когда Ездра молился и исповедовался
  rationale: Конструкция с כְּ обозначает сопутствующее, фоновое действие; «когда» естественно вводит его по-русски. Возвратные формы передают молитву и покаянное исповедание Ездры без уточнения, что именно он исповедовал.
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: плача и повергаясь
  rationale: Причастные формы описывают продолжающиеся действия Ездры. «Повергаясь» сохраняет рефлексивный оттенок и позу смиренной мольбы, не добавляя прямо не названного в тексте «ниц».
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: перед домом Божьим
  rationale: Сохранён образный еврейский титул храма — «дом Божий», а не подставлено поясняющее «храм».
- source_word: נִקְבְּצוּ אֵלָיו מִיִּשְׂרָאֵל קָהָל רַב מְאֹד
  choice: к нему собралось великое множество израильтян
  rationale: Фраза передаёт многочисленность собравшегося сообщества и происхождение его участников из Израиля, избегая неестественного повтора «собралось собрание».
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: мужчин, женщин и детей
  rationale: Полностью сохранён явно перечисленный состав собравшихся.
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: потому что народ горько плакал
  rationale: כִּי вводит причину, а сочетание наречия с однокоренным существительным усиливает глагол плача. «Горько плакал» естественно передаёт сильный плач; буквальная форма приведена в сноске.
