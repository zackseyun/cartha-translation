base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/027.yaml
  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: ru
  text: 'И из сыновей Затту: Элиоэнай, Эльяшив, Маттания, Иеремот, Завад и Азиза.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: И из сыновей
  rationale: Сохранены соединительное значение ו, предлог מן и прямое значение формы множественного числа בנים. В данном родовом перечне «сыновья» может также подразумевать потомков или представителей рода.
- source_word: זַתּוּא
  choice: Заттуя
  rationale: Родовое имя передано транслитерацией; окончание -я обусловлено русским родительным падежом после «сыновей».
- source_word: אֶלְיוֹעֵנַי
  choice: Элиоэнай
  rationale: Имя передано близко к масоретскому звучанию и в форме, естественной для современного русского языка.
- source_word: אֶלְיָשִׁיב
  choice: Эльяшив
  rationale: Транслитерация сохраняет основные согласные и членение еврейского имени без замены исторически русифицированной формой.
- source_word: מַתַּנְיָה
  choice: Маттания
  rationale: Передача отражает удвоенный согласный и конечный теофорный элемент имени; выбрана понятная русская форма.
- source_word: וִירֵמוֹת
  choice: Иремот
  rationale: Имя передано по данной масоретской форме; присоединительный союз учтён в естественном русском оформлении перечисления.
- source_word: וְזָבָד
  choice: Завад
  rationale: Имя транслитерировано по еврейскому тексту; союз оформлен по правилам русского перечисления.
- source_word: וַעֲזִיזָא
  choice: Азиза
  rationale: Имя передано близко к еврейской форме; предшествующий союз выражен русским «и» перед последним элементом списка.
