  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: ru
  text: Они обязались отослать своих жён[a] и, будучи виновными, принесли барана из стада за свою вину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дали свою руку» — древнееврейская идиома, означающая, что они дали обещание или приняли на себя обязательство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более явно: «принесли барана из стада как жертву за свою вину».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: они обязались
  rationale: Буквально «дали свою руку» — древнееврейская идиома, обозначающая торжественное обещание или принятие обязательства. «Обязались» естественно передаёт её смысл по-русски.
- source_word: לְהוֹצִיא
  choice: отослать
  rationale: Каузативная форма глагола יצא означает «заставить выйти, удалить». В данном брачном контексте «отослать» точно передаёт действие, не вводя в текст более специального юридического термина.
- source_word: נְשֵׁיהֶם
  choice: своих жён
  rationale: В контексте речь идёт именно о жёнах, а не о женщинах вообще; возвратное «своих» естественно для современного русского синтаксиса.
- source_word: וַאֲשֵׁמִים
  choice: и, будучи виновными
  rationale: Прилагательное אָשֵׁם описывает их виновность. Деепричастно-обстоятельственный оборот сохраняет связь между признанной виной и последующим жертвенным действием.
- source_word: אֵיל צֹאן
  choice: барана из стада
  rationale: Сочетание обозначает барана как животное из мелкого скота, предназначенное здесь для жертвоприношения. «Из стада» звучит ясно и естественно.
- source_word: עַל אַשְׁמָתָם
  choice: за свою вину
  rationale: Предлог עַל с существительным указывает на основание принесения жертвы — их вину. Формулировка сохраняет смысл без избыточного внесения технической жертвенной терминологии в основной текст.
theological_decisions:
- issue: Следует ли прямо назвать барана «жертвой повинности» в основном тексте
  choice: 'Сохранено: «принесли барана из стада за свою вину»'
  alternative: «принесли барана из стада как жертву повинности за свою вину»
  rationale: В еврейской фразе названы баран и вина, но отдельного существительного со значением «жертва» в этой части стиха нет. Глагол «принесли» восполняется по смыслу для связности; техническое название жертвы оставлено в примечании, чтобы не конкретизировать текст сверх меры.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Идиома передана по смыслу, а её буквальная форма сохранена в сноске; жертвенная терминология не усилена в основном тексте сверх выраженного в еврейском оригинале.
