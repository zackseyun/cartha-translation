lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: И из сыновей
  rationale: Сочетание союза ו, предлога מִן и слова בְּנֵי вводит очередную семейную подгруппу в перечне. Перевод сохраняет соединительное «и» и партитивное значение «из» и при этом естественно звучит по-русски.
- source_word: חָרִם
  choice: Харима
  rationale: Личное или родовое имя передано транслитерацией и поставлено в родительный падеж по нормам русского языка.
- source_word: מַעֲשֵׂיָה
  choice: Маасея
  rationale: Имя передано в форме, близкой к еврейскому звучанию и узнаваемой в русской библейской традиции.
- source_word: וְ/אֵלִיָּה
  choice: Илия
  rationale: Использована устоявшаяся русская форма библейского имени; союз выражен структурой перечисления.
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: Шемаия
  rationale: Имя транслитерировано с сохранением его основных согласных и окончания -ия.
- source_word: וִ/יחִיאֵל
  choice: Иехиил
  rationale: Выбрана узнаваемая русская библейская форма, достаточно близкая к еврейскому יְחִיאֵל.
- source_word: וְ/עֻזִיָּה
  choice: Уззия
  rationale: Форма «Уззия» непосредственно отражает еврейское עֻזִּיָּה и избегает менее прозрачной традиционной передачи через «Озиия».
