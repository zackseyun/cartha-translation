base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/033.yaml
  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: ru
  text: 'Из сыновей Хашума: Маттенай, Маттатта, Завад, Элифелет, Еремай, Манассия и Шимей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי חָשֻׁם
  choice: Из сыновей Хашума
  rationale: Предлог מִן с בְּנֵי в контексте списка указывает на представителей семейства; оборот «из сыновей» сохраняет структуру и смысл исходного текста.
- source_word: מַתְּנַי
  choice: Маттенай
  rationale: Передача собственного имени русской транслитерацией с сохранением конечного дифтонга.
- source_word: מַתַּתָּה
  choice: Маттатта
  rationale: Русская транслитерация передаёт согласный состав и удвоение ת; отдельная сноска об английских вариантах написания для русского текста не нужна.
- source_word: זָבָד
  choice: Завад
  rationale: Прямая русская транслитерация еврейского собственного имени.
- source_word: אֱלִיפֶלֶט
  choice: Элифелет
  rationale: Прямая транслитерация имени в естественной для русского библейского текста форме.
- source_word: יְרֵמַי
  choice: Еремай
  rationale: Русская форма передаёт еврейское произношение имени и его окончание.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Использована узнаваемая русская библейская форма имени.
