  yaml_path: translation/ot/ezra/010/017.yaml
  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: ru
  text: И к первому дню первого месяца они закончили разбирать дела всех мужчин, взявших себе чужеземных жён.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «До первого дня первого месяца». Еврейское выражение допускает передачу как срока, к которому работа была завершена, так и предела, до которого она продолжалась.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: они закончили
  rationale: Форма от כלה обозначает завершение продолжавшегося разбирательства; «закончили» естественно звучит по-русски.
- source_word: בַכֹּל אֲנָשִׁים
  choice: разбирать дела всех мужчин
  rationale: Буквально конструкция означает «закончили со всеми мужчинами»; процедурный контекст позволяет ясно и естественно передать подразумеваемое рассмотрение их дел.
- source_word: הַהֹשִׁיבוּ
  choice: взявших себе
  rationale: Каузатив от ישב буквально значит «поселивших», но здесь это брачная идиома. «Взявших себе» сохраняет её образность и не уточняет юридическую форму союза сверх текста.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: чужеземных жён
  rationale: נָשִׁים в данном контексте означает жён, а נָכְרִיּוֹת — женщин из чужого народа; «чужеземных» точнее и нейтральнее, чем двусмысленное современное «чужих».
- source_word: עַד יוֹם אֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: к первому дню первого месяца
  rationale: עַד задаёт временную границу. Русское «к» естественно указывает срок завершения, тогда как буквальное «до» может пониматься как исключающее названный день.
