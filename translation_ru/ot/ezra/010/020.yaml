  language: ru
  text: 'Из сыновей Иммера: Ханани и Зевадия.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Из сыновей
  rationale: Сочетание предлога מִן с בְּנֵי вводит представителей очередного рода в перечне. Русское «из сыновей» сохраняет и структуру списка, и родовое значение формулы; начальное ו естественно не передаётся отдельным союзом после предыдущего пункта перечня.
- source_word: אִמֵּר
  choice: Иммера
  rationale: Имя священнического рода передано традиционной русской библейской формой и поставлено в родительный падеж после слова «сыновей».
- source_word: חֲנָנִי
  choice: Ханани
  rationale: Личное имя транслитерировано в форме, близкой к еврейскому звучанию и принятой в русской библейской традиции.
- source_word: וּ/זְבַדְיָה
  choice: и Зевадия
  rationale: Префиксальный союз ו соединяет последнее имя с предыдущим; имя передано традиционной русской формой «Зевадия».
