lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: Из левитов
  rationale: Предлог מִן имеет здесь партитивное значение и вводит группу левитов в составе общего перечня; краткая русская формулировка естественна для списка.
- source_word: יוֹזָבָד
  choice: Иозавад
  rationale: Традиционная русская библейская передача личного имени.
- source_word: וְשִׁמְעִי
  choice: Шимей
  rationale: Устоявшаяся русская форма личного имени, соответствующая еврейскому שִׁמְעִי.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: Келая (он же Келита)
  rationale: Местоимение הוּא связывает два именования одного лица; «он же» кратко сохраняет пояснительно-идентифицирующую конструкцию оригинала, не уточняя сверх текста характер второго имени.
- source_word: פְּתַחְיָה
  choice: Петахия
  rationale: Прямая и благозвучная русская транслитерация еврейского личного имени.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: В контексте перечня это личное имя; использована традиционная русская библейская форма.
- source_word: וֶאֱלִיעֶזֶר
  choice: и Элиезер
  rationale: Традиционная русская передача имени אֱלִיעֶזֶר; союз перед последним элементом списка сохранён.
