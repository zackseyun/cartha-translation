lexical_decisions:
- source_word: מִבְּנֵי
  choice: Из сыновей
  rationale: Предлог מִן при форме בְּנֵי имеет здесь партитивный смысл и вводит представителей рода; «из сыновей» естественно для русского перечня.
- source_word: בָנִי
  choice: Бания
  rationale: Личное имя передано в традиционной русской библейской форме; после слова «сыновей» употреблён родительный падеж.
- source_word: מַעֲדַי
  choice: Маадай
  rationale: Личное имя транслитерировано с сохранением различимых элементов еврейской формы.
- source_word: עַמְרָם
  choice: Амрам
  rationale: Личное имя передано в устойчивой русской библейской форме.
- source_word: וְאוּאֵל
  choice: и Уэл
  rationale: Союз וְ передан как «и»; имя אוּאֵל транслитерировано как «Уэл», что отражает последовательность гласных исходной формы.
