  text: All these had married foreign women, and some of them had wives by whom they had children.
translation:
  language: ru
  text: Все они женились на чужеземках, и у некоторых из них были жёны, от которых у них были дети.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в конце стиха: «и были среди них жёны, и они поставили сыновей». Еврейская фраза кратка и трудна для понимания; субъект и точный смысл глагола «поставили» неясны. Слово, переведённое как «дети», буквально означает «сыновья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י נָשִׁים
  choice: женились
  rationale: В сочетании с «женщинами» глагол נשׂא употреблён в брачном смысле. Русское «женились» естественно и точно передаёт этот смысл, не воспроизводя буквально идиому «взяли женщин».
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: чужеземках
  rationale: נָכְרִיּוֹת обозначает женщин из другого народа, находящихся вне общины Израиля. «Чужеземки» сохраняет этническую и общинную окраску и звучит достойно в современном русском.
- source_word: וְיֵשׁ מֵהֶם נָשִׁים
  choice: и у некоторых из них были жёны
  rationale: Так передаётся экзистенциальная конструкция יֵשׁ с מֵהֶם и сохраняется повторное упоминание жён, присутствующее в трудном еврейском окончании стиха.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: родившие детей
  rationale: Еврейское выражение буквально необычно и, вероятно, эллиптично. По контексту речь идёт о том, что в этих браках появились дети; причастный оборот естественно связывает это сообщение с жёнами, не вводя лишнего уточнения.
- source_word: בָּנִים
  choice: детей
  rationale: Хотя формально слово означает «сыновья», оно может обозначать потомство шире. Здесь «детей» естественно передаёт контекст; буквальный вариант отмечен в сноске.
theological_decisions:
- issue: Характер обозначения чужеземных женщин
  choice: чужеземки
  alternative: иноплеменные жёны
  rationale: Текст указывает на их принадлежность к другому народу или общине, но сам по себе не формулирует более узкого конфессионального определения; перевод не усиливает богословскую оценку сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно книжным библейским достоинством. Трудность заключительной еврейской конструкции сохранена в сноске, тогда как основной текст передаёт наиболее вероятный контекстуальный смысл.
