  source_fidelity: 'Первая часть передана точно. В заключительной трудной конструкции еврейское וַיָּשִׂימוּ («и они поставили») не даёт грамматических оснований прямо приписывать рождение детей жёнам: субъект глагола в маскулинском множественном числе, а сама фраза эллиптична. Контекстуальная передача потомства допустима, но лучше не делать жён субъектом «родившие».'
  naturalness: «Все они женились на чужеземках» — естественно и соответствует современному литературному регистру. «У некоторых из них были жёны, родившие детей» звучит гладко, но создаёт неоправданно определённое прочтение. «От которых у них были дети» естественно и ближе к смыслу, отражённому в английском аудите.
  terminology: «Чужеземки» удачно передаёт נָכְרִיּוֹת без архаизации или излишней конфессиональной интерпретации. «Дети» допустимо для בָּנִים в данном контексте при сноске, отмечающей буквальное «сыновья».
