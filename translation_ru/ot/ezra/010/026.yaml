  text: וּ/מִ/בְּנֵ֖י עֵילָ֑ם מַתַּנְיָ֤ה זְכַרְיָה֙ וִ/יחִיאֵ֣ל וְ/עַבְדִּ֔י וִ/ירֵמ֖וֹת וְ/אֵלִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/026.yaml
  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: ru
  text: 'И из сыновей Елама: Маттания, Захария, Иехиил, Авдий, Иеремоф и Илия.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: И из сыновей
  rationale: Сохраняет союз, предлог и родословную формулу исходного текста. В данном перечне «сыновья» может обозначать членов рода, но буквальная форма ясна и естественна по-русски.
- source_word: עֵילָם
  choice: Елама
  rationale: Личное имя родоначальника передано традиционной русской библейской формой и поставлено в родительный падеж после «сыновей».
- source_word: מַתַּנְיָה
  choice: Маттания
  rationale: Традиционная русская передача еврейского личного имени.
- source_word: זְכַרְיָה
  choice: Захария
  rationale: Устоявшаяся русская библейская форма этого личного имени.
- source_word: וִ/יחִיאֵל
  choice: Иехиил
  rationale: Передача еврейского личного имени в соответствии с русской библейской традицией; соединительный союз выражен синтаксисом перечня.
- source_word: וְ/עַבְדִּי
  choice: Авдий
  rationale: В структуре перечня это личное имя, а не нарицательное выражение «мой раб»; выбрана традиционная русская форма имени.
- source_word: וִ/ירֵמוֹת
  choice: Иеремоф
  rationale: Традиционная русская библейская передача данного личного имени.
- source_word: וְ/אֵלִיָּה
  choice: Илия
  rationale: Устоявшаяся русская форма еврейского имени; союз перед последним элементом перечня сохранён как «и».
