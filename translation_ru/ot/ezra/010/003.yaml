source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: ru
  text: Итак, заключим теперь завет с нашим Богом, чтобы отослать всех жён и рождённых ими детей[a], по совету моего господина и тех, кто трепещет перед заповедью нашего Бога. Пусть будет сделано по Закону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и рождённое от них», то есть их потомство.'
    reason: Сохраняет доступ к собирательной и несколько безличной формулировке еврейского текста, тогда как основной перевод употребляет естественное русское «детей».
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: заключим завет
  rationale: Еврейская идиома буквально означает «срежем завет», но её естественный и точный русский эквивалент — «заключим завет».
- source_word: לְהוֹצִיא
  choice: чтобы отослать
  rationale: Глагол означает «вывести, удалить, отослать». В данном контексте речь идёт об удалении жён из общины; «отослать» передаёт это без добавления идеи юридического развода, которой сам глагол прямо не выражает.
- source_word: כָל נָשִׁים
  choice: всех жён
  rationale: נָשִׁים может означать как «женщин», так и «жён». Контекст Ездры 9–10 ясно указывает на жён, поэтому контекстуальное значение выражено в основном тексте.
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: и рождённых ими детей
  rationale: 'Буквально: «и рождённое от них». Русское «детей» естественно раскрывает собирательное обозначение потомства; буквальная форма отмечена в сноске.'
- source_word: אֲדֹנָי
  choice: моего господина
  rationale: В данной морфологической разметке это אֲדֹנַי — «мой господин», обращение к Ездре, а не божественное имя. Строчная буква сохраняет это различие.
- source_word: וְכַתּוֹרָה
  choice: в соответствии с Законом
  rationale: Здесь תּוֹרָה обозначает обязательное Божье установление, на основании которого должно быть принято решение. «В соответствии с Законом» естественно передаёт нормативный смысл оборота.
theological_decisions:
- issue: Кого обозначает אֲדֹנָי
  choice: моего господина
  alternative: Господа
  rationale: Суффиксальная форма и синтаксис фразы поддерживают обращение к человеческому руководителю, вероятнее всего к Ездре. Перевод «Господа» устранил бы важное различие и сделал бы следующий союз синтаксически менее прозрачным.
- issue: Характер удаления жён
  choice: отослать
  alternative: развестись со всеми жёнами
  rationale: Текст требует удаления жён и детей, но не использует здесь специальную юридическую лексику развода. Поэтому перевод не уточняет правовой механизм сверх сказанного в источнике.
- issue: Связь совета с двумя сторонами
  choice: по совету моего господина и тех, кто трепещет
  alternative: по совету моего господина, при поддержке тех, кто трепещет
  rationale: Еврейский союз естественно координирует «моего господина» и «тех, кто трепещет» как участников совета; перевод сохраняет эту конструкцию, не перераспределяя их роли.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис разделён на два предложения ради ясности; повелительно-желательное «Пусть всё будет сделано» сохраняет значение еврейского יֵעָשֶׂה. Термин «Закон» написан с прописной буквы как обозначение данного Богом нормативного учения в контексте книги Ездры.
