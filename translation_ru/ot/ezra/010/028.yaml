  text: וּ/מִ/בְּנֵ֖י בֵּבָ֑י יְהוֹחָנָ֥ן חֲנַנְיָ֖ה זַבַּ֥י עַתְלָֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/028.yaml
  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: ru
  text: 'И из сыновей Бевая[a]: Иегоханан[b], Ханания, Заббай и Афлай.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «сыновья Бевая» может здесь означать шире: потомки или члены рода Бевая.'
    reason: lexical_alternative
  - marker: b
    text: 'Имя Иегоханан также передают в сокращённой форме: «Иоханан».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: И из сыновей
  rationale: Сохраняет союз, предлог и буквальное значение формы בְּנֵי; в данном списке выражение может обозначать не только непосредственных сыновей, но и потомков либо членов рода.
- source_word: בֵּבָי
  choice: Бевая
  rationale: Имя Бевай передано транслитерацией и поставлено в родительный падеж после «сыновей».
- source_word: יְהוֹחָנָן
  choice: Иегоханан
  rationale: Передаёт полную еврейскую форму имени с начальным теофорным элементом; более краткая форма «Иоханан» также употребительна.
- source_word: חֲנַנְיָה
  choice: Ханания
  rationale: Транслитерация еврейского имени в привычной для русского библейского регистра форме.
- source_word: זַבַּי
  choice: Заббай
  rationale: Транслитерация сохраняет удвоенный согласный, обозначенный дагешем в еврейском написании.
- source_word: עַתְלָי
  choice: Афлай
  rationale: Буква ת без дагеша передана как «ф» в соответствии с традиционной русской передачей этого имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичной структуры именного списка. Союз «и» перед последним именем добавлен по нормам естественного русского перечисления. Конечная буква ס в предоставленном тексте WLC понята как масоретский знак закрытого раздела, а не как часть стиха.
