  text: И из певцов — Елиашив; и из привратников — Шаллум, Телем и Урий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַמְשֹׁרְרִים
  choice: Из певцов
  rationale: Предлог מִן выделяет представителей очередной группы в перечне; причастие от שׁיר обозначает певцов, служивших при храме. Союз וּ естественно передан самой последовательностью однородных частей, без повторения «и» в русском.
- source_word: אֶלְיָשִׁיב
  choice: Елиашив
  rationale: Традиционная русская библейская передача личного имени.
- source_word: וּמִן הַשֹּׁעֲרִים
  choice: из привратников
  rationale: В храмовом контексте שֹׁעֲרִים — служители, отвечавшие за ворота; «привратники» точно и естественно передаёт эту должность.
- source_word: שַׁלֻּם
  choice: Шаллум
  rationale: Транслитерация еврейского личного имени с сохранением удвоенного согласного.
- source_word: טֶלֶם
  choice: Телем
  rationale: Прямая транслитерация еврейского личного имени.
- source_word: אוּרִי
  choice: Урий
  rationale: Традиционная русская библейская форма личного имени.
