source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֛י פַּחַ֥ת מוֹאָ֖ב עַדְנָ֣א וּ/כְלָ֑ל בְּנָיָ֤ה מַעֲשֵׂיָה֙ מַתַּנְיָ֣ה בְצַלְאֵ֔ל וּ/בִנּ֖וּי וּ/מְנַשֶּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: ru
  text: 'И из сыновей Пахат-Моава: Адна, Келал, Беная, Маасея, Маттания, Бецалел, Биннуй и Манассия.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: И из сыновей
  rationale: Передаёт союз וְ, предлог מִן и форму בְּנֵי, сохраняя структуру родового перечня. «Сыновей» здесь может обозначать также потомков или членов рода.
- source_word: פַּחַת מוֹאָב
  choice: Пахат-Моава
  rationale: Родовое имя передано транслитерацией; дефис показывает единство составного наименования, а форма «Моава» естественно воспринимается по-русски как вторая часть имени.
- source_word: עַדְנָא
  choice: Адна
  rationale: Близкая к еврейской форме русская транслитерация личного имени.
- source_word: וּ/כְלָל
  choice: Келал
  rationale: Имя транслитерировано непосредственно с еврейского; начальная буква כ здесь передаётся как «к».
- source_word: בְּנָיָה
  choice: Беная
  rationale: Транслитерация сохраняет звучание еврейского имени и его конечный элемент -я.
- source_word: מַעֲשֵׂיָה
  choice: Маасея
  rationale: Русская передача отражает основные слоги еврейского имени без искусственного усложнения написания.
- source_word: מַתַּנְיָה
  choice: Маттания
  rationale: Удвоенное «т» отражает дагеш в תּ, а окончание «-ия» естественно передаёт конечную форму имени.
- source_word: בְצַלְאֵל
  choice: Бецалел
  rationale: 'Источник передан непосредственно: צ обозначено буквой «ц»; форма ближе к еврейскому имени, чем традиционное «Веселеил».'
- source_word: וּ/בִנּוּי
  choice: Биннуй
  rationale: Удвоенное «н» отражает усиленный согласный, а «уй» — конечное звучание имени.
- source_word: וּ/מְנַשֶּׁה
  choice: и Манассия
  rationale: Союз передан перед последним элементом списка; имя дано в укоренившейся русской форме.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена краткая структура именного перечня. Имена преимущественно переданы непосредственно с еврейского, при этом для хорошо укоренившейся формы «Манассия» сохранено традиционное русское написание.
