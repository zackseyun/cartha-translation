lexical_decisions:
- source_word: מַתַּנְיָה
  choice: Маттания
  rationale: Личное имя передано принятой русской библейской транслитерацией; конечный элемент имени отражён как «-ия».
- source_word: מַתְּנַי
  choice: Маттенай
  rationale: Личное имя транслитерировано с сохранением отличия от предшествующего имени и конечного дифтонга «-ай».
- source_word: ו/יעשו
  choice: и Яасай
  rationale: Префикс ו передан союзом «и». В контексте перечня форма понимается как редкое личное имя; огласовка и передача имени варьируются, поэтому вариант отмечен в сноске.
