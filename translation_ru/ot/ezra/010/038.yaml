lexical_decisions:
- source_word: וּ/בָנִי
  choice: и Бани
  rationale: Префикс וּ передан союзом «и», сохраняющим структуру перечня; личное имя בָנִי передано принятой русской библейской формой «Бани».
- source_word: וּ/בִנּוּי
  choice: и Биннуй
  rationale: Префикс וּ передан союзом «и»; имя בִנּוּי транслитерировано как «Биннуй» с передачей удвоенного נּ и конечного согласного йод.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Личное имя שִׁמְעִי передано традиционной русской библейской формой «Шимей». Поскольку союза перед именем в еврейском тексте нет, по-русски он также не добавлен.
