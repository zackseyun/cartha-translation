base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: ru
  text: И все мужчины[b] Иудеи и Вениамина собрались[a] в Иерусалиме в течение трёх дней. Это был девятый месяц, двадцатый день месяца. Весь народ сидел на площади[c] у дома Божьего, дрожа из-за этого дела и из-за дождя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сошлись».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все мужи Иудеи и Вениамина»; грамматически речь идёт о мужчинах, вероятно о призванных на собрание мужчинах или представителях.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на открытом пространстве при доме Божьем». Еврейское слово обозначает широкую открытую площадь, не обязательно внутренний двор храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: собрались
  rationale: Нифаль глагола קבץ обозначает собирание людей в одном месте; «собрались» прямо и естественно передаёт форму и повествовательное действие.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: все мужчины Иудеи и Вениамина
  rationale: Слово אַנְשֵׁי грамматически означает «мужчины»; формулировка не расширяется до всего населения и сохраняет вероятную отсылку к призванным мужчинам или представителям.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: за три дня
  rationale: В контексте ранее установленного трёхдневного срока выражение указывает, что собрание состоялось в пределах этого срока. Русское «за три дня» передаёт срок естественнее, чем двусмысленное «в течение трёх дней».
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: Это было в девятом месяце, в двадцатый день месяца
  rationale: Сохранена древнееврейская календарная формула без подстановки названия месяца, которого в тексте нет.
- source_word: וַיֵּשְׁבוּ
  choice: сидел
  rationale: Глагол ישׁב здесь имеет основное значение «сидеть»; единственное число согласовано с русским собирательным существительным «народ».
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: на площади у дома Божьего
  rationale: רְחוֹב — широкое открытое пространство или площадь, а не обязательно внутренний храмовый двор. Предлог «у» естественно выражает связь площади с домом Божьим, не уточняя архитектуру сверх источника.
- source_word: מַרְעִידִים
  choice: дрожа
  rationale: Причастие от רעד описывает физическую дрожь; деепричастие естественно связывает её с двумя названными причинами.
- source_word: עַל הַדָּבָר
  choice: из-за этого дела
  rationale: Определённое הַדָּבָר отсылает к уже известному кризису; «это дело» сохраняет контекстуальную отсылку, не разъясняя её внутри стиха.
- source_word: וּמֵהַגְּשָׁמִים
  choice: и из-за дождя
  rationale: Предлог מִן указывает причину дрожи. Хотя גְּשָׁמִים имеет форму множественного числа, по-русски погодное явление в данном контексте естественно обозначается единственным числом «дождь»; характеристика «сильный» не добавлена, поскольку непосредственно в тексте её нет.
