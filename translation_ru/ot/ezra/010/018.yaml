base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: ru
  text: 'Среди священнических родов, взявших себе в жёны иноплеменных женщин[a], нашлись из сыновей Иисуса, сына Иоседека, и его братьев: Маасея, Елиезер, Иарив и Годолия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взявших себе иноплеменных жён».'
    reason: 'Лексическая альтернатива: נָשִׁים буквально означает «женщины», но в данном контексте относится к брачным союзам и может быть передано как «жёны».'
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: нашлись следующие
  rationale: Форма глагола единственного числа вводит перечень нескольких лиц. Русская конструкция во множественном числе естественно передаёт собирательно-вводное значение, а слово «следующие» ясно предваряет список.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: среди сыновей священников
  rationale: Сохраняется родословное выражение «сыновья», а предлог «среди» естественно обозначает принадлежность к группе.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: взявших себе иноплеменных жён
  rationale: В контексте Ездры 10 оборот обозначает брачные союзы. «Взявших себе жён» сохраняет семитскую формулу и остаётся понятным современному читателю; «иноплеменных» указывает на принадлежность женщин к другим народам, не добавляя оценки сверх текста.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: из сыновей Иисуса, сына Иоседека
  rationale: Повторное מִן выделяет подгруппу внутри священнических родов. Родословная формула сохранена; имена переданы в укоренившейся русской библейской форме.
- source_word: וְאֶחָיו
  choice: и его братьев
  rationale: Местоименный суффикс относится к Иисусу; прямое значение «братья» сохранено без неоправданного расширения до «родственников».
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: Маасея, Елиезер, Иарив и Годолия
  rationale: Личные имена переданы в традиционных русских библейских формах, обеспечивающих узнаваемость и согласованность с русской библейской традицией.
