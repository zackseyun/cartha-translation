  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: ru
  text: Пусть же наши начальники выступят от имени всего собрания, а все жители наших городов, взявшие себе чужеземных жён[a], приходят в назначенные сроки вместе со старейшинами каждого города и его судьями, пока пылающий гнев нашего Бога не будет отвращён от нас в связи с этим делом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поселившие у себя чужеземных женщин»; в данном контексте речь идёт о том, что их взяли в жёны.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока пылающий гнев нашего Бога не будет отвращён от нас из-за этого дела». Заключительная еврейская конструкция допускает разные способы передачи связи с «этим делом».'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: Пусть же ... выступят
  rationale: Юссив с частицей נָא выражает вежливое предложение. «Пусть же» передаёт побудительный оттенок, а «выступят» естественно описывает принятие официальной роли.
- source_word: שָׂרֵינוּ
  choice: наши начальники
  rationale: שָׂרִים здесь обозначает руководителей или должностных лиц общины; «начальники» — ясное и уместное для административного контекста обозначение.
- source_word: לְכָל הַקָּהָל
  choice: от имени всего собрания
  rationale: Предлог לְ в контексте указывает на представительную функцию начальников. Перевод делает эту связь понятной, не меняя состава действующих лиц.
- source_word: וְכֹל אֲשֶׁר בֶּעָרֵינוּ
  choice: а все жители наших городов, ...
  rationale: Относительный оборот буквально говорит обо «всех, кто в наших городах». Добавление «жители» естественно по-русски выражает подразумеваемую принадлежность к городам.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: взявшие себе жён из чужеземок
  rationale: Каузатив от ישׁב буквально связан с поселением женщин в доме, но в данном контексте обозначает принятие их в качестве жён. Формулировка сохраняет брачный и бытовой оттенки выражения.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: в назначенное время
  rationale: Сочетание означает заранее определённые сроки явки. Русское единственное число может иметь распределительное значение и звучит естественно в официальном контексте.
- source_word: וְעִמָּהֶם זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: вместе со старейшинами каждого города и его судьями
  rationale: עִיר וָעִיר имеет распределительное значение «каждого города», а местоименный суффикс относит судей к соответствующему городу.
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: пылающий гнев нашего Бога
  rationale: Выражение обозначает сильный, разгоревшийся гнев. «Пылающий гнев» сохраняет образность еврейской идиомы и остаётся понятным современному читателю.
- source_word: עַד לְהָשִׁיב ... מִמֶּנּוּ
  choice: пока ... не будет отвращён от нас
  rationale: Инфинитив שוב выражает прекращение или отведение гнева. Пассивная конструкция не уточняет сверх текста, кто именно совершает это действие.
- source_word: עַד לַדָּבָר הַזֶּה
  choice: из-за этого дела
  rationale: Заключительное выражение связывает Божий гнев с рассматриваемым нарушением. Конструкция необычна, поэтому возможное более нейтральное понимание отмечено в сноске.
theological_decisions:
- issue: Передача образа Божьего гнева
  choice: пылающий гнев нашего Бога
  alternative: яростный гнев нашего Бога; гнев нашего Бога
  rationale: Текст прямо называет Божий חרון אף в связи с нарушением общины. Образная передача не смягчает утверждение и не вводит в него дополнительной догматической схемы.
- issue: Агент отвращения Божьего гнева
  choice: не будет отвращён от нас
  alternative: не отвратится от нас; мы не отвратим от себя
  rationale: Пассив сохраняет результативный смысл לְהָשִׁיב и не определяет явно агента там, где еврейский текст его не называет.
translation_notes:
  register: Современный литературный русский язык с умеренно официальной интонацией, соответствующей собранию и судебно-административному разбирательству. Синтаксис сделан плавным, но сохранены коллективное предложение, местное представительство и сильная образность слов о Божьем гневе.
