id: EZR.10.31
reference: Ezra 10:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בְנֵ֖י חָרִ֑ם אֱלִיעֶ֧זֶר יִשִּׁיָּ֛ה מַלְכִּיָּ֖ה שְׁמַֽעְיָ֥ה שִׁמְעֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/031.yaml
  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: ru
  text: 'И из сыновей Харима[a]: Елиезер, Ишшия[b], Малхия, Шемаия и Шимон[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «И сыновья Харима: …» — если понимать эти слова как простое заглавие списка, не добавляя подразумеваемого «из».'
    reason: lexical_alternative
  - marker: b
    text: Имя Ишшия также передают как Ишия или Иешия.
    reason: lexical_alternative
  - marker: c
    text: Традиционная русская форма имени Шимон — «Симеон».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: И из сыновей
  rationale: Союз וּ передаётся как «и», а בְנֵי в контексте перечня обозначает представителей рода; добавление «из» естественно показывает, что далее названы отдельные сыновья или потомки Харима.
- source_word: חָרִם
  choice: Харима
  rationale: Имя главы рода передано принятой русской транслитерацией и поставлено в родительный падеж после «сыновей».
- source_word: אֱלִיעֶזֶר
  choice: Елиезер
  rationale: Устоявшаяся русская форма еврейского имени.
- source_word: יִשִּׁיָּה
  choice: Ишшия
  rationale: Транслитерация близко отражает масоретское чтение имени и удвоенный согласный; варианты передачи отмечены в сноске.
- source_word: מַלְכִּיָּה
  choice: Малхия
  rationale: Устоявшаяся русская библейская форма имени, достаточно близкая еврейскому произношению.
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Традиционная и понятная русская передача краткой формы еврейского имени.
- source_word: שִׁמְעוֹן
  choice: Шимон
  rationale: Форма «Шимон» непосредственно отражает еврейское שִׁמְעוֹן; традиционный русский вариант приведён в сноске.
theological_decisions: []
