  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: ru
  text: 'А из сыновей Пашхура: Елиоенай, Маасея, Измаил, Нафанаил, Иозавад и Еласа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: А из сыновей
  rationale: Сочетание союза, предлога и формы множественного числа от בֵּן продолжает перечень и вводит часть рода Пашхура; русский оборот естественно передаёт обе функции.
- source_word: פַּשְׁחוּר
  choice: Пашхур
  rationale: Имя передано транслитерацией, близкой к еврейской форме и принятой в русской библейской традиции.
- source_word: אֶלְיוֹעֵינַי
  choice: Элиоэнай
  rationale: Транслитерация собственного имени с сохранением его основных звуковых элементов.
- source_word: מַעֲשֵׂיָה
  choice: Маасея
  rationale: Использована узнаваемая русская библейская форма имени.
- source_word: יִשְׁמָעֵאל
  choice: Измаил
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: נְתַנְאֵל
  choice: Нафанаил
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: יוֹזָבָד
  choice: Иозавад
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: וְ/אֶלְעָשָׂה
  choice: и Еласа
  rationale: Союз וְ передан явно; имя транслитерировано в краткой русской форме, соответствующей еврейскому звучанию.
