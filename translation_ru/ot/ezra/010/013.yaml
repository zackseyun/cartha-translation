base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: ru
  text: Но народу много, и время дождей, и нет сил стоять под открытым небом. И эта работа не на один и не на два дня[a], ведь мы много согрешили в этом деле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эту работу нельзя выполнить за один или два дня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы много преступали в этом деле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Но
  rationale: Передаёт противопоставление предложению предыдущего стиха естественным современным русским союзом.
- source_word: הָעָם רָב
  choice: народу много
  rationale: Сохраняет предикативный смысл רָב при собирательном עָם и звучит естественно по-русски.
- source_word: וְהָעֵת גְּשָׁמִים
  choice: сейчас время дождей
  rationale: Близко передаёт буквальное «время дождей»; «сейчас» естественно выражает контекстуальное значение определённого הָעֵת.
- source_word: וְאֵין כֹּחַ לַעֲמֹד בַּחוּץ
  choice: так что нет сил стоять под открытым небом
  rationale: Сохраняет безличную конструкцию «нет сил»; «под открытым небом» ясно передаёт пребывание снаружи под дождём.
- source_word: וְהַמְּלָאכָה
  choice: эта работа
  rationale: Обозначает практическую задачу разбирательства; указательное «эта» естественно связывает её с обсуждаемым делом.
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: не на один и не на два дня
  rationale: Сохраняет еврейскую структуру и смысл продолжительности, не превращая её в развёрнутую парафразу.
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: ведь мы тяжко согрешили
  rationale: הִרְבִּינוּ усиливает действие инфинитива; «тяжко» передаёт значительную меру проступка, а «согрешили» естественно выражает פשׁע в данном контексте.
- source_word: בַּדָּבָר הַזֶּה
  choice: в этом деле
  rationale: Идиоматично обозначает обсуждаемое нарушение, не сужая значение до отдельного поступка.
theological_decisions:
- issue: Характер проступка, выраженного לִפְשֹׁעַ
  choice: «тяжко согрешили» без дальнейшей догматической классификации
  alternative: «совершили тяжкое преступление» или «тяжко нарушили»
  rationale: פשׁע указывает на серьёзное нарушение и может нести оттенок мятежности. Русское «согрешили» сохраняет нравственно-заветную тяжесть контекста, не вводя более узкую юридическую либо политическую категорию.
translation_notes:
  register: Современный литературный русский язык, умеренно формальный и пригодный для публичного чтения. Синтаксис следует ходу еврейского текста, но причинная связь погодных условий передана естественным русским «так что».
