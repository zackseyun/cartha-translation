  - marker: a
    text: 'Или: «потомки» — во всех трёх случаях; еврейская формула בְּנֵי в подобных списках часто обозначает род или семейную линию, а не только непосредственных сыновей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Сохраняет повторяющуюся формулу еврейского списка и её родословный оттенок; в данном контексте слово может обозначать не только непосредственных сыновей, но и потомков или членов рода.
- source_word: בַצְלוּת
  choice: Бацлута
  rationale: Имя передано транслитерацией с учётом еврейского произношения; родительный падеж естественно включён в русскую синтаксическую конструкцию.
- source_word: מְחִידָא
  choice: Мехиды
  rationale: Имя транслитерировано как «Мехида» и поставлено в родительный падеж после слова «сыновья».
- source_word: חַרְשָׁא
  choice: Харши
  rationale: Имя транслитерировано как «Харша»; конечный алеф отдельно не передаётся, а форма родительного падежа соответствует русской грамматике.
