lexical_decisions:
- source_word: אַנְשֵׁי
  choice: жителей
  rationale: Форма сопряжённого состояния множественного числа от אִישׁ в перечне возвратившихся обозначает мужчин, относящихся к данному поселению. Русское «жителей» естественно для краткого списочного контекста и не добавляет отсутствующего в оригинале родственного значения «сыновья».
- source_word: עֲנָתוֹת
  choice: Анафофа
  rationale: Географическое название передано в принятой русской библейской форме «Анафоф»; родительный падеж обусловлен словом «жителей».
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: сто двадцать восемь
  rationale: Количественное числительное передано словами в естественной современной русской форме.
theological_decisions: []
