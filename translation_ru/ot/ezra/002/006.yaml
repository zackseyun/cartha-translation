lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В перечне возвратившихся это слово обозначает родовую группу. «Сыновей» сохраняет генеалогическую форму оригинала и естественно звучит в контексте списка.
- source_word: פַחַת מוֹאָב
  choice: Пахат-Моава
  rationale: Составное собственное имя передано транслитерацией; падежное окончание оформлено по нормам русского языка.
- source_word: לִבְנֵי
  choice: из сыновей
  rationale: Предлог ל связывает род Пахат-Моава с более узкой или соотнесённой родовой линией; «из сыновей» передаёт эту связь, не уточняя её сверх оригинала.
- source_word: יֵשׁוּעַ
  choice: Иешуи
  rationale: Послепленное имя יֵשׁוּעַ передано как «Иешуа» с необходимой падежной формой, чтобы отличить его краткую еврейскую форму от имени «Иисус» в русской традиции.
- source_word: יוֹאָב
  choice: Иоава
  rationale: Общепринятая русская передача библейского личного имени с падежным окончанием.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: 2 812
  rationale: Число передано цифрами для удобства чтения переписного списка; пробел как разделитель тысяч соответствует современной русской типографике.
