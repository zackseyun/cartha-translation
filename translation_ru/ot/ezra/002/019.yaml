lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В перечне вернувшихся это слово обозначает членов рода, ведущего происхождение от названного предка. «Сыновей» сохраняет краткую генеалогическую форму еврейского списка и естественно связано с контекстом предыдущих стихов.
- source_word: חָשֻׁם
  choice: Хашума
  rationale: Имя передано современной русской транслитерацией с сохранением начального гортанного согласного через «х»; родительный падеж обусловлен словом «сыновей».
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: двести двадцать три
  rationale: Еврейская последовательность числительных означает 223; запись словами соответствует форме источника и звучит естественно в русском перечне.
