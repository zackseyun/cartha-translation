base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: ru
  text: И поселились священники, левиты, некоторые из народа, певцы, привратники и храмовые служители[a] в своих городах, и весь Израиль поселился в своих городах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. нетиним — особая группа людей, назначенных для служения при храме.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: поселились
  rationale: В данном повествовательном контексте глагол יָשַׁב обозначает обустройство и проживание на определённом месте; «поселились» естественно передаёт переход к жизни в своих городах.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное обозначение священнослужителей в послепленном храмовом контексте.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Передаёт название группы левитов, отличаемой в тексте от священников.
- source_word: וּמִן הָעָם
  choice: некоторые из народа
  rationale: 'Предлог מִן имеет здесь частичное значение: речь идёт о части народа наряду с перечисленными храмовыми группами.'
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Форма обозначает людей, исполнявших служение пением; «певцы» — прямой и понятный современный эквивалент.
- source_word: הַשּׁוֹעֲרִים
  choice: привратники
  rationale: Термин обозначает служителей, отвечавших за ворота; традиционное русское слово остаётся ясным в данном храмовом контексте.
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Это специальное обозначение группы, назначенной для храмового служения. Функциональный перевод понятен современному читателю, а еврейский термин сохранён в сноске.
- source_word: בְּעָרֵיהֶם
  choice: в своих городах
  rationale: Местоимение естественно передано русским возвратным «своих»; עָרִים здесь уместно переводить как «города».
- source_word: וְכָל יִשְׂרָאֵל
  choice: и весь Израиль
  rationale: Сохранено коллективное библейское обозначение общины Израиля без сужения его значения.
theological_decisions:
- issue: Передача специального термина הַנְּתִינִים
  choice: храмовые служители
  alternative: нетинимы
  rationale: Функциональный перевод раскрывает роль этой группы и не приписывает ей дополнительных обязанностей или статуса; традиционная транслитерация приведена в сноске.
- issue: Значение выражения וְכָל יִשְׂרָאֵל
  choice: весь Израиль
  alternative: весь народ Израиля
  rationale: Сохранена формулировка оригинала и присущая ей коллективная широта без попытки точнее определить состав названной общины.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повтор глагола «поселился» во второй части делает еврейский эллипсис ясным по-русски. Маркер сноски помещён непосредственно после соответствующего выражения «храмовые служители».
