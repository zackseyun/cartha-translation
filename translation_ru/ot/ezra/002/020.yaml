- source_word: בְּנֵי
  choice: сыновей
  rationale: В перечне возвратившихся это слово сохраняет буквальную формулу «сыновья» и одновременно обозначает род или потомков; форма родительного падежа естественно продолжает структуру списка.
- source_word: גִבָּר
  choice: Гивбара
  rationale: Собственное имя передано транслитерацией с удвоенной буквой «б», отражающей дагеш в בּ; форма родительного падежа обусловлена сочетанием «сыновей Гивбара».
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: девяносто пять
  rationale: Современная русская форма числительного точно передаёт буквальное еврейское «девяносто и пять» и звучит естественно.
