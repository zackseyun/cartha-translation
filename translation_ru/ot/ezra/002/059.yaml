base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: ru
  text: Вот те, кто пришли из Тел-Мелаха, Тел-Харши, Херува, Аддана и Иммера, но не могли указать свой род по отцовской линии и своё происхождение — израильтяне ли они.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלִים
  choice: те, кто пришёл
  rationale: В контексте списка возвратившихся глагол עלה обозначает прибытие в землю Израиля; «пришёл» естественно передаёт смысл, не добавляя прямо отсутствующего в тексте понятия возвращения.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: из Тел-Мелаха, Тел-Харши, Херува, Аддана и Иммера
  rationale: Названия переданы транслитерацией; компоненты сложных топонимов с Тел- оформлены через дефис по нормам русского письма.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: не могли указать
  rationale: В административно-родословном контексте נגד означает сообщить или удостоверительно назвать; «указать» звучит естественно и сохраняет официальный оттенок.
- source_word: בֵּית אֲבוֹתָם
  choice: свой род
  rationale: Выражение буквально означает «дом своих отцов» и обозначает родовую группу по отцовской линии. «Свой род» понятно современному читателю, а буквальный образ сохранён в сноске.
- source_word: וְזַרְעָם
  choice: и своё происхождение
  rationale: זרע здесь относится к родословной принадлежности. В сочетании с вопросом об израильском происхождении такой перевод естественнее буквального «семя» и не создаёт ошибочного впечатления, будто речь идёт об их потомках.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: израильтяне ли они
  rationale: Фраза выражает неустановленность принадлежности к Израилю по происхождению; вопросительная конструкция с «ли» точно сохраняет её смысл.
theological_decisions:
- issue: Характер принадлежности к Израилю
  choice: Формулировка оставляет речь о не подтверждённой родословной принадлежности к Израилю.
  alternative: Передать как сомнение в религиозной или гражданской принадлежности.
  rationale: Ближайший контекст и выражения о роде и происхождении указывают именно на невозможность документально подтвердить родословную; текст не следует расширять до вероисповедного суждения.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-административного перечня. Синтаксис упрощён лишь настолько, чтобы родословная формула была понятна обычному читателю; тире сохраняет напряжение заключительного вопроса о принадлежности к Израилю.
