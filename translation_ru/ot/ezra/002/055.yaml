  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: ru
  text: 'Потомки слуг Соломона: потомки Сотая, потомки Гассоферета, потомки Перуды[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте книги Ездры — «Перуда»; в параллельном списке в Неемии 7:57 — «Перида».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: потомки
  rationale: В родословно-административном перечне слово обозначает не только непосредственных сыновей, но и членов рода. «Потомки» естественно передаёт это собирательное значение и сохраняет повторяющийся ритм еврейского текста.
- source_word: עַבְדֵי
  choice: слуг
  rationale: עֶבֶד может означать как слугу, так и раба; здесь это устойчивое наименование группы «слуг Соломона», а не описание их правового положения, поэтому нейтральное «слуг» уместнее.
- source_word: שְׁלֹמֹה
  choice: Соломона
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительный падеж согласно русскому синтаксису.
- source_word: סֹטַי
  choice: Сотая
  rationale: Имя транслитерировано с учётом русской библейской традиции и поставлено в родительный падеж после слова «потомки».
- source_word: הַסֹּפֶרֶת
  choice: Гассоферета
  rationale: Форма передана как собственное имя с сохранением начального элемента הַ и удвоенного согласного; русское окончание отражает родительный падеж.
- source_word: פְרוּדָא
  choice: Перуды
  rationale: Основной текст следует масоретскому чтению книги Ездры פְרוּדָא; имя оформлено в родительном падеже. Отличающееся чтение параллельного списка вынесено в сноску.
