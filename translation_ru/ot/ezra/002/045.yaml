  text: the sons of Lebanah[a], the sons of Hagabah, the sons of Akkub.
translation:
  language: ru
  text: сыновья Леваны[a], сыновья Хагавы, сыновья Аккува.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «сыновья» может обозначать не только непосредственных сыновей, но также потомков или членов рода.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Буквально означает «сыновья», но в данном перечне может обозначать потомков или членов рода. Буквальный выбор сохраняет повторяющуюся структуру еврейского текста, а примечание поясняет более широкий смысл.
- source_word: לְבָנָה
  choice: Левана
  rationale: Собственное имя передано транслитерацией с учётом масоретской огласовки; форма родительного падежа в тексте — «Леваны».
- source_word: חֲגָבָה
  choice: Хагава
  rationale: Собственное имя передано транслитерацией, отражающей еврейское произношение; форма родительного падежа в тексте — «Хагавы».
- source_word: עַקּוּב
  choice: Аккув
  rationale: Собственное имя передано принятой русской библейской формой, сохраняющей удвоение согласного; форма родительного падежа в тексте — «Аккува».
