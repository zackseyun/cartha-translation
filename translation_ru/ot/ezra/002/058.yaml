lexical_decisions:
- source_word: כָּל
  choice: Всего
  rationale: В данном перечне слово вводит совокупный итог двух названных групп; «всего» естественно передаёт эту функцию по-русски.
- source_word: הַנְּתִינִים
  choice: храмовых служителей
  rationale: Это специальное послепленное обозначение группы людей, назначенных для служения при храме. Функциональный перевод понятнее современному читателю, чем транслитерация.
- source_word: וּבְנֵי
  choice: и потомков
  rationale: Буквально — «и сыновей», но здесь выражение обозначает наследственную группу; «потомков» точно и естественно передаёт смысл без ограничения ближайшим поколением.
- source_word: עַבְדֵי
  choice: слуг
  rationale: עֶבֶד может означать как слугу, так и раба. В названии традиционной группы административного списка нейтральное «слуг» сохраняет присущую слову неоднозначность лучше, чем более узкое «рабов».
- source_word: שְׁלֹמֹה
  choice: Соломона
  rationale: Использована устоявшаяся русская форма имени; родительный падеж передаёт еврейскую сопряжённую конструкцию.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: триста девяносто два
  rationale: Прямое и нормативное русское выражение количественного числительного.
