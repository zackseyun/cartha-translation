  text: the sons of Asnah[a], the sons of Meunim[b], the sons of Nephisim.
translation:
  language: ru
  text: потомки Асны, потомки Меунима[a], потомки Нефисима[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможная передача имени: «Маоним».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможная передача имени: «Нефусим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: потомки
  rationale: В перечне возвратившихся это слово обозначает род или группу, связанную с предком либо родоначальником; «потомки» естественно передаёт корпоративный смысл и не ограничивает речь непосредственными сыновьями.
- source_word: אַסְנָה
  choice: Асна
  rationale: Собственное имя передано транслитерацией; после слова «потомки» употреблена нормативная форма родительного падежа «Асны».
- source_word: מעינים
  choice: Меуним
  rationale: Название рода передано транслитерацией как «Меуним»; в основном тексте после слова «потомки» стоит родительный падеж «Меунима». Вариант «Маоним» сохранён в примечании.
- source_word: נפיסים
  choice: Нефисим
  rationale: Название рода передано близкой транслитерацией как «Нефисим»; в основном тексте употреблён родительный падеж «Нефисима». Вариант «Нефусим» приведён в примечании.
theological_decisions: []
translation_notes:
  register: Сохранён лаконичный ритм родословного перечня. «Потомки» выбрано вместо буквального «сыновья», поскольку речь идёт о родовых группах. Все имена оформлены по нормам современного русского склонения; маркеры примечаний поставлены при тех именах, к которым относятся варианты.
