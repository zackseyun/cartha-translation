lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Формально точная передача сопряжённой формы множественного числа בֵּן; в данном перечне слово обозначает также потомков или родовую группу, однако повтор «сыновья» сохраняет структуру еврейского текста.
- source_word: גִדֵּל
  choice: Гиддел
  rationale: Личное имя передано транслитерацией с сохранением удвоенного согласного, отражённого дагешем.
- source_word: גַחַר
  choice: Гахар
  rationale: Личное имя транслитерировано; еврейская буква ח передана через «х».
- source_word: רְאָיָה
  choice: Реая
  rationale: Личное имя передано близко к масоретской огласовке rəʾāyā; сочетание гласных сохраняет различимость элементов имени без искусственного разрешения зияния.
