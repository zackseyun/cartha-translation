lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: Форма сопряжённого множественного числа от בֵּן вводит родовую группу в перечне возвратившихся. «Сыновей» прямо передаёт структуру еврейского списка и естественно продолжается после подразумеваемого счётного оборота предыдущего контекста.
- source_word: עֵילָם
  choice: Элама
  rationale: Собственное имя передано традиционной русской транслитерацией; родительный падеж обусловлен словом «сыновей».
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1 254
  rationale: Еврейская последовательность числительных означает 1 254; цифровая запись с пробелом как разделителем тысяч соответствует современной русской типографике и удобна для переписного списка.
