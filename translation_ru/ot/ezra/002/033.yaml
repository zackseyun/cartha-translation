  text: 'The sons of Lod[a], Hadid[b], and Ono: seven hundred twenty-five.'
translation:
  language: ru
  text: Сыновья[a] Лода[b], Хадида и Оно — семьсот двадцать пять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потомки Лода, Хадида и Оно». В этом списке возвратившихся слово «сыновья» может обозначать не только непосредственных потомков по мужской линии, но и более широкую родовую или общинную группу.'
    reason: lexical_alternative
  - marker: b
    text: Позднее Лод стал известен под названием Лидда.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Формально передаёт еврейское слово и сохраняет характерную для списка формулу. Здесь оно может обозначать не только непосредственных сыновей, но и потомков либо группу людей, связанную с названными селениями; эта широта значения отмечена в сноске.
- source_word: לֹד
  choice: Лода
  rationale: Еврейское географическое название передано транслитерацией «Лод» и поставлено в родительный падеж после слова «сыновья».
- source_word: חָדִיד
  choice: Хадида
  rationale: Географическое название транслитерировано с еврейского и грамматически согласовано с конструкцией стиха.
- source_word: וְאוֹנוֹ
  choice: и Оно
  rationale: Союз וְ передан обычным русским «и», а географическое название — транслитерацией «Оно»; несклоняемая форма естественна в современном русском.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: семьсот двадцать пять
  rationale: Точно передаёт указанное в еврейском тексте число 725.
