  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Причастная форма от שׁיר обозначает тех, кто поёт. В контексте списка «певцы» прямо и естественно передаёт значение; «музыканты» было бы шире, а «храмовые певцы» добавляло бы не выраженное здесь уточнение.
- source_word: בְּנֵי
  choice: сыновья
  rationale: В родословных и клановых списках בְּנֵי может обозначать сыновей, потомков или членов рода. «Сыновья» сохраняет форму еврейского текста и в данном перечне понятно как название рода или певческой семьи.
- source_word: אָסָף
  choice: Асафа
  rationale: Использована устоявшаяся русская библейская форма имени; родительный падеж обусловлен сочетанием «сыновья Асафа».
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: сто двадцать восемь
  rationale: 'Точно передаёт последовательность еврейских числительных: 100 + 20 + 8.'
