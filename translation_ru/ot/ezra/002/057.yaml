lexical_decisions:
- source_word: בְּנֵי
  choice: потомки
  rationale: В перечне родов это слово обозначает членов рода или потомков названного предка. «Потомки» естественно для современного русского языка и не ограничивает группу непосредственными сыновьями, при этом повтор сохраняет структуру еврейского текста.
- source_word: שְׁפַטְיָה
  choice: Шефатия
  rationale: Собственное имя передано транслитерацией; после слова «потомки» употреблена форма родительного падежа «Шефатии».
- source_word: חַטִּיל
  choice: Хаттил
  rationale: Собственное или родовое имя передано транслитерацией; в тексте стоит родительный падеж «Хаттила».
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Похерет-Хаццеваим
  rationale: Сочетание сохранено как сложное родовое имя с дефисом, без окончательного решения, является ли второй элемент частью имени или определением; возможное иное прочтение отмечено в сноске.
- source_word: אָמִי
  choice: Амий
  rationale: Собственное или родовое имя передано транслитерацией; в тексте употреблён родительный падеж «Амия».
