lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: Форма множественного числа в сопряжённом состоянии буквально означает «сыновья/сыновей» и в данном списке обозначает потомков или род Бевая. Русская форма родительного падежа естественно продолжает конструкцию перечня.
- source_word: בֵבָי
  choice: Бевая
  rationale: Собственное имя передано транслитерацией как «Бевай»; здесь употреблена требуемая русской синтаксической конструкцией форма родительного падежа «Бевая».
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וּשְׁלֹשָׁה
  choice: шестьсот двадцать три
  rationale: 'Точно передаёт еврейское числительное: 600 + 20 + 3 = 623; формулировка соответствует современному русскому употреблению.'
