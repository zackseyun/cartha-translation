  yaml_path: translation/ot/ezra/002/066.yaml
  text: Their horses were seven hundred thirty-six; their mules, two hundred forty-five.
translation:
  language: ru
  text: Коней у них было семьсот тридцать шесть, а мулов — двести сорок пять.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: коней у них
  rationale: Существительное סוּס означает «конь, лошадь»; форма множественного числа с местоименным суффиксом 3-го лица мужского рода множественного числа выражает принадлежность. Оборот «коней у них» естественно вводит перечень имущества и сохраняет смысл «их кони».
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: семьсот тридцать шесть
  rationale: Последовательность числительных однозначно обозначает число 736; выбран нормативный современный русский способ его передачи.
- source_word: פִּרְדֵיהֶם
  choice: мулов
  rationale: פֶּרֶד точно обозначает мула. Притяжательное значение суффикса ясно из общей конструкции «у них было» и не требует повторения.
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: двести сорок пять
  rationale: Цепочка числительных обозначает число 245 и передана нормативной русской формой.
