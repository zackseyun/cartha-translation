  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: ru
  text: По мере своих возможностей они внесли в сокровищницу для работ 61 000 золотых дариков[a], 5 000 мин серебра[b] и 100 священнических хитонов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотых монет»; еврейское слово обозначает персидские дарики.'
    reason: lexical_alternative
  - marker: b
    text: Мина — древняя единица веса и денежного счёта.
    reason: cultural_note
lexical_decisions:
- source_word: כְכֹחָם
  choice: По мере своих возможностей
  rationale: Передаёт меру и соразмерность пожертвований возможностям дающих, не сохраняя неестественное буквальное «по их силе».
- source_word: נָתְנוּ
  choice: внесли
  rationale: В контексте пожертвования в сокровищницу естественное русское «внесли» точно передаёт действие, не добавляя лишней богословской окраски.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: в сокровищницу на работы
  rationale: אוֹצָר обозначает сокровищницу или хранилище, а הַמְּלָאכָה — осуществляемые работы; формулировка ясно указывает назначение средств и сохраняет конкретный образ сокровищницы.
- source_word: דַּרְכְּמוֹנִים
  choice: дариков
  rationale: Исторически конкретное название персидской золотой монеты точнее общего «золотых монет» и традиционного, но менее точного «драхм».
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: 61 000
  rationale: Точно передаёт еврейское «шесть десятков тысяч и одна тысяча» в ясной современной числовой записи.
- source_word: מָנִים
  choice: мин
  rationale: Сохраняет древнюю единицу веса и денежного счёта, не подменяя её неточным современным эквивалентом.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: и 100 священнических хитонов
  rationale: כָתְנֹת обозначает конкретно нижние длинные одежды, туники; «хитоны» — узнаваемый и точный русский библейский термин, а не более широкое «одежды».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Числа даны цифрами для ясности перечня; специальные древние термины сохранены и кратко пояснены в сносках.
