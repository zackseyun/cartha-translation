lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Сопряжённая форма множественного числа от בֵּן в переписном списке обозначает сыновей или потомков, принадлежащих к роду. «Сыновья» сохраняет лаконичную формулу еврейского текста и соответствует стилю перечня.
- source_word: יוֹרָה
  choice: Иоры
  rationale: Имя передано по форме יוֹרָה в масоретском тексте Езд 2:18; родительный падеж естественно обусловлен русской конструкцией «сыновья Иоры». Отличающаяся форма параллельного места отмечена в сноске.
- source_word: מֵאָה וּשְׁנֵים עָשָׂר
  choice: сто двенадцать
  rationale: Точное и естественное воспроизведение количественного числительного в современном литературном русском языке.
