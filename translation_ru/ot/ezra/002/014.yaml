lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В перечне вернувшихся это слово обозначает представителей рода или потомков; «сыновей» сохраняет форму еврейского текста и естественно звучит в данном списке.
- source_word: בִגְוָי
  choice: Бигвая
  rationale: Личное имя, выступающее также как обозначение рода; передано транслитерацией и поставлено в родительном падеже по нормам русского языка.
- source_word: אַלְפַּיִם
  choice: две тысячи
  rationale: Точное и естественное соответствие еврейскому числительному.
- source_word: חֲמִשִּׁים
  choice: пятьдесят
  rationale: Передаёт числительное в составе общей суммы.
- source_word: וְשִׁשָּׁה
  choice: шесть
  rationale: Соединительное וְ в последовательности числительных по-русски естественно не воспроизводится; вся сумма передана как «две тысячи пятьдесят шесть».
