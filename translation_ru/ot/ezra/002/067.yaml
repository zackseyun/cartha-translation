- source_word: שֵׁשֶׁת אֲלָפִים שְׁבַע מֵאוֹת וְעֶשְׂרִים
  choice: 6 720
  rationale: Числительное обозначает точное количество — шесть тысяч семьсот двадцать; пробел как разделитель тысяч соответствует современной русской типографике.
