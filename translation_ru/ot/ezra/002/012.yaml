- source_word: בְּנֵי
  choice: сыновей
  rationale: Форма сопряжённого множественного числа от בֵּן в перечне вернувшихся обозначает членов рода или потомков; «сыновей» сохраняет формальную структуру еврейского списка и естественно продолжает подразумеваемую конструкцию подсчёта.
- source_word: עַזְגָּד
  choice: Азгада
  rationale: Собственное имя передано традиционной русской транслитерацией; родительный падеж обусловлен сочетанием «сыновей Азгада».
- source_word: אֶלֶף מָאתַיִם עֶשְׂרִים וּשְׁנָיִם
  choice: 1 222
  rationale: Еврейская последовательность числительных означает 1 222; запись цифрами с пробелом как разделителем разрядов удобна и нормативна для современного русского перечня.
