  text: сыновья Яалы, сыновья Даркона, сыновья Гиддела.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма множественного числа в сопряжённом состоянии буквально означает «сыновья». В данном перечне она обозначает группы потомков или роды, но буквальная передача сохраняет форму еврейского текста и естественно звучит по-русски.
- source_word: יַעְלָה
  choice: Яалы
  rationale: Имя передано транслитерацией; родительный падеж обусловлен сочетанием «сыновья Яалы».
- source_word: דַרְקוֹן
  choice: Даркона
  rationale: Собственное имя передано транслитерацией с учётом еврейских согласных и огласовки; родительный падеж обусловлен синтаксисом.
- source_word: גִדֵּל
  choice: Гиддела
  rationale: Собственное имя передано транслитерацией с удвоенным «д», отражающим дагеш; родительный падеж обусловлен сочетанием «сыновья Гиддела».
