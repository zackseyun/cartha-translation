lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Священники
  rationale: Определённое существительное во множественном числе вводит перечисление священнических родов; прямой перевод сохраняет форму еврейского текста.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Буквально «сыновья»; в родословных и списках слово может обозначать потомков или членов рода. Прямая передача сохраняет характер формулировки, а возможный более широкий смысл отмечен в сноске.
- source_word: יְדַעְיָה
  choice: Иедаия
  rationale: Традиционная русская библейская передача личного имени, соответствующая еврейской форме.
- source_word: לְבֵית
  choice: из дома
  rationale: Предлог לְ здесь выражает принадлежность к дому или родовой линии. «Из дома» естественно передаёт эту связь по-русски.
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Транслитерация послепленного личного имени יֵשׁוּעַ, позволяющая отличить данную форму от родственного имени Иисус Навин.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: '973'
  rationale: Еврейское числительное означает девятьсот семьдесят три; цифры удобны и уместны в переписном списке.
