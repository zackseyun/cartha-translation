base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: ru
  text: Это жители провинции[a], которые поднялись из плена изгнанников[b], которых Навуходоносор, царь Вавилона, увёл в Вавилон. Они вернулись в Иерусалим и Иудею, каждый в свой город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья провинции» — еврейское выражение, означающее жителей или людей, принадлежащих к провинции.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение буквально сочетает два понятия: «плен» и «изгнанники»; возможен более краткий перевод: «из плена» или «из изгнания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: жители области
  rationale: Буквальное «сыновья области» в современном русском звучит неясно; еврейская идиома обозначает людей, принадлежащих к данной административной области. Слово «область» передаёт значение персидской административной единицы без излишне специальной терминологии.
- source_word: הָעֹלִים
  choice: которые поднялись
  rationale: Сохранён образ восхождения, выраженный причастием от עלה. Он отличён от последующего וַיָּשׁוּבוּ — «вернулись».
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: из плена изгнанников
  rationale: 'Перевод сохраняет оба элемента насыщенного еврейского выражения: שְׁבִי — «плен» и גּוֹלָה — изгнанники, то есть община уведённых в изгнание.'
- source_word: אֲשֶׁר הֶגְלָה
  choice: уведённых
  rationale: Причинная форма глагола גלה обозначает насильственное удаление в изгнание. Причастный оборот по-русски естественно связывает определение с «изгнанниками» и сохраняет Навуходоносора как деятеля.
- source_word: נבוכדנצור
  choice: Навуходоносор
  rationale: Использована устоявшаяся русская форма имени, хорошо известная читателю.
- source_word: וַיָּשׁוּבוּ
  choice: Они вернулись
  rationale: Глагол שׁוב прямо обозначает возвращение. Новое предложение делает длинную генеалогико-историческую формулу яснее, не меняя её смысловой связи.
- source_word: לִירוּשָׁלַם וִיהוּדָה
  choice: в Иерусалим и Иудею
  rationale: Оба названия переданы как направления возвращения; повтор предлога в русском не требуется.
- source_word: אִישׁ לְעִירוֹ
  choice: каждый в свой город
  rationale: Передана распределительная сила אִישׁ и принадлежность, выраженная местоименным суффиксом, в естественной современной русской форме.
