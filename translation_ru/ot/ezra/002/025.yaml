  text: 'The sons of Kiriath-arim[a], Kephirah, and Beeroth: 743.'
translation:
  language: ru
  text: Сыновья Кириат-Арима, Кефиры и Беэрота — 743 человека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Сохраняет формальную структуру еврейского текста; в данном перечне слово может обозначать потомков либо жителей названных мест.
- source_word: קִרְיַת עָרִים
  choice: Кириат-Арима
  rationale: Собственное географическое название передано транслитерацией и поставлено в родительный падеж после слова «сыновья».
- source_word: כְּפִירָה
  choice: Кефиры
  rationale: Собственное географическое название передано в форме, естественной для современного русского текста, и согласовано с синтаксисом перечисления.
- source_word: וּבְאֵרוֹת
  choice: и Беэрота
  rationale: Союз выражен явно; раздельное «э» сохраняет различимость гласных в транслитерации топонима.
- source_word: שְׁבַע מֵאוֹת וְאַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743 человека
  rationale: Цифровая запись удобна для списочного текста; добавление «человека» естественно обозначает исчисляемую группу и не меняет количества.
