  text: the sons of another Elam[a], 1,254.
translation:
  language: ru
  text: сыновья другого Елама[a] — 1 254 человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыновья Елама — другая группа»; этот род отличен от рода Елама, названного выше в этой главе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן в родословно-перечневом контексте обозначает членов рода; «сыновья» сохраняет формальную структуру еврейского текста.
- source_word: עֵילָם
  choice: Елама
  rationale: Имя собственное передано традиционной русской транслитерацией и поставлено в родительный падеж после слова «сыновья».
- source_word: אַחֵר
  choice: другого
  rationale: Определение отличает эту группу Елама от уже упомянутой ранее (Езд. 2:7); конструкция допускает понимание как «другого Елама», так и «другой группы Елама».
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1 254 человека
  rationale: Еврейская последовательность числительных точно передана цифрами; слово «человека» естественно уточняет счёт участников списка по-русски.
