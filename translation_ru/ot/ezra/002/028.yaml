  text: Мужчин из Вефиля и Гая — двести двадцать три.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: жителей
  rationale: Форма сопряжённого множественного числа от אִישׁ обозначает в этой переписной записи мужчин, связанных с названными городами. По-русски «жителей» естественно передаёт принадлежность к населённым пунктам и не создаёт ошибочного впечатления, будто речь лишь о взрослых мужчинах, хотя грамматическая форма оригинала мужская.
- source_word: בֵית אֵל
  choice: Вефиля
  rationale: Традиционная русская библейская форма названия Вефиль; родительный падеж обусловлен словом «жителей».
- source_word: וְהָעָי
  choice: и Гая
  rationale: Передано традиционным русским библейским названием Гай. Еврейский артикль при топониме отдельно не воспроизводится; родительный падеж обусловлен словом «жителей».
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: двести двадцать три
  rationale: Точная и естественная передача количественного числительного в современном русском языке.
