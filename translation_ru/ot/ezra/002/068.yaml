base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: ru
  text: Некоторые из глав родов[a], придя к дому Яхве в Иерусалиме, сделали добровольные пожертвования[b] на дом Бога, чтобы воздвигнуть его на его основании[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главы отеческих домов». Или: «главы семейств». «Отеческий дом» — родовая общественная единица в древнем Израиле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «добровольно пожертвовали». Еврейский глагол подчёркивает добровольный характер дара.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на его месте» или «на отведённом ему месте». Еврейское выражение может указывать как на основание храма, так и на место, где он должен стоять.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Некоторые главы отеческих домов
  rationale: 'Предлог מִן имеет партитивное значение: речь идёт о некоторых, а не обо всех главах. «Отеческие дома» сохраняет название израильской родовой единицы, не сводя его просто к семьям.'
- source_word: בְּבוֹאָם
  choice: придя
  rationale: Предлог ב с инфинитивом и местоименным суффиксом выражает время; деепричастная конструкция естественно передаёт смысл «когда они пришли».
- source_word: לְבֵית יְהוָה
  choice: к дому Яхве
  rationale: Сохранено буквальное «дом», а тетраграмматон передан личным именем «Яхве».
- source_word: הִתְנַדְּבוּ
  choice: сделали добровольные пожертвования
  rationale: Форма хитпаэль от נדב подчёркивает добровольность даяния; контекст показывает, что речь идёт о пожертвованиях.
- source_word: לְבֵית הָאֱלֹהִים
  choice: на дом Бога
  rationale: Предлог ל указывает назначение пожертвований. Повтор слова «дом» сохраняет лексическую связь с «домом Яхве».
- source_word: לְהַעֲמִידוֹ
  choice: чтобы воздвигнуть его
  rationale: Каузативная форма от עמד означает «поставить, утвердить, воздвигнуть». В контексте восстановления храма «воздвигнуть» звучит естественно и не описывает конкретный способ строительства.
- source_word: עַל מְכוֹנוֹ
  choice: на его основании
  rationale: מָכוֹן может обозначать основание, установленное место или площадку. Основной текст передаёт конкретный строительный образ, а примечание сохраняет смысловую неоднозначность.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; передача «Яхве» сохраняет личное имя Бога и отличает его от титула.
- issue: Передача родовой структуры רָאשֵׁי הָאָבוֹת
  choice: главы отеческих домов
  alternative: главы родов; главы семейств
  rationale: Формулировка сохраняет патрилинейную социальную структуру исходного выражения, а примечание разъясняет её современному читателю.
- issue: Значение עַל מְכוֹנוֹ
  choice: на его основании
  alternative: на его месте; на отведённом ему месте
  rationale: Контекст допускает как физическое основание храма, так и его установленное место; основной вариант не устраняет альтернативное понимание, которое вынесено в примечание.
