  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: ru
  text: 'которые пришли с Зоровавелем: Иешуа, Неемия, Сераия, Реелаия[a], Мардохей, Билшан, Миспар[b], Бигвай, Рехум[c] и Баана. Число людей из народа Израиля[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном списке в Неемии 7:7 вместо «Реелаия» стоит «Раамия».
    reason: alternative_reading
  - marker: b
    text: В параллельном списке в Неемии 7:7 вместо «Миспар» стоит «Мисперет».
    reason: alternative_reading
  - marker: c
    text: В параллельном списке в Неемии 7:7 вместо «Рехум» стоит «Нехум».
    reason: alternative_reading
  - marker: d
    text: Эта фраза вводит численные данные, приведённые в следующих стихах.
    reason: cross_reference
