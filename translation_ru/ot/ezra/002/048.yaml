    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Формула со множественным числом слова בֵּן в перечне родов буквально означает «сыновья» и может обозначать не только непосредственных сыновей, но и потомков либо членов рода. Основной текст сохраняет форму оригинала, а более широкое значение отмечено в сноске.
- source_word: רְצִין
  choice: Рецина
  rationale: Имя רְצִין передано традиционно и в форме родительного падежа после слова «сыновья».
- source_word: נְקוֹדָא
  choice: Некоды
  rationale: Имя נְקוֹדָא транслитерировано как «Некода» и поставлено в родительный падеж в соответствии с русским синтаксисом.
- source_word: גַזָּם
  choice: Газзама
  rationale: Удвоение согласной в еврейском написании отражено формой «Газзам»; здесь употреблён родительный падеж «Газзама».
