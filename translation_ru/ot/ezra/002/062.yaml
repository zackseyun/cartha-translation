base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: ru
  text: Они искали свою запись в родословных списках, но их там не нашли, и потому их признали непригодными для священства[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их сочли осквернёнными и отстранили от священства». Еврейский глагол означает, что из-за неподтверждённой родословной их признали не соответствующими требованиям к священникам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Они
  rationale: Местоимение естественно отсылает к названным в предыдущем стихе претендентам на священство; добавление «эти люди» по-русски было бы излишне тяжеловесным.
- source_word: בִּקְשׁוּ
  choice: искали
  rationale: Передаёт обычное значение «искать, разыскивать» и уместно для поиска документального подтверждения.
- source_word: כְתָבָם
  choice: свою запись
  rationale: כְּתָב обозначает письменный документ или запись; «запись» ясно передаёт официальный письменный след, не уточняя без основания вид документа.
- source_word: הַמִּתְיַחְשִׂים
  choice: в родословных списках
  rationale: Форма от יחס связана с установлением и регистрацией происхождения. В сочетании с «искали свою запись» естественный русский перевод выражает место поиска — списки родословий.
- source_word: וְלֹא נִמְצָאוּ
  choice: но их там не нашли
  rationale: Сохраняет множественное число еврейского глагола и его отнесённость к людям, одновременно по-русски ясно указывая на отсутствие их имён в списках.
- source_word: וַיְגֹאֲלוּ
  choice: их признали непригодными
  rationale: Редкая форма выражает признание осквернёнными или утратившими допустимый статус. «Признали непригодными» сохраняет смысл официальной дисквалификации, не сводя его лишь к физическому удалению и не усиливая без необходимости ритуальную окраску.
- source_word: מִן הַכְּהֻנָּה
  choice: для священства
  rationale: В сочетании с «признали непригодными» это идиоматически передаёт отстранение от священнического статуса и служения.
theological_decisions:
- issue: Значение וַיְגֹאֲלוּ применительно к священническому статусу
  choice: их признали непригодными для священства
  alternative: их сочли осквернёнными и отстранили от священства
  rationale: Еврейский глагол допускает оттенок осквернения, однако ближайший контекст подчёркивает утрату права на священнический статус из-за неподтверждённой родословной. Основной перевод передаёт эту дисквалификацию, а примечание сохраняет более буквальную возможность.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное. Административный характер проверки родословной передан без канцелярской тяжеловесности, а редкий оттенок осквернения сохранён в примечании.
