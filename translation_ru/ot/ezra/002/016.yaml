lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В контексте списка возвратившихся форма может обозначать сыновей, потомков или членов рода. «Сыновей» сохраняет повторяющуюся форму еврейского перечня и естественно звучит как продолжение списка.
- source_word: אָטֵר
  choice: Атера
  rationale: Личное или родовое имя передано принятой русской библейской транслитерацией.
- source_word: לִיחִזְקִיָּה
  choice: из рода Езекии
  rationale: Предлог ל здесь, вероятно, указывает на принадлежность или уточняет ветвь семьи Атера. «Из рода Езекии» ясно передаёт эту связь, не превращая сочетание имён в одно сложное имя.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: девяносто восемь
  rationale: Количественное числительное передано обычной современной русской формой.
