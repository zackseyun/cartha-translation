- source_word: פַשְׁחוּר
  choice: Пашхур
  rationale: Имя передано принятой русской библейской транслитерацией, соответствующей еврейской форме.
- source_word: אֶלֶף מָאתַיִם אַרְבָּעִים וְשִׁבְעָה
  choice: 1 247
  rationale: Числовая запись ясно и точно передаёт еврейскую последовательность «тысяча, двести, сорок и семь» и естественна для переписного списка.
