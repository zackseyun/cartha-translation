lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: В перечне возвратившихся это устойчивое родословное обозначение семейной или родовой группы. Буквальное «сыновья» сохраняет лаконичную повторяющуюся форму еврейского текста и естественно звучит по-русски.
- source_word: חָגָב
  choice: Хагав
  rationale: 'Собственное имя передано транслитерацией; конечная буква ב без дагеша отражена как «в». В составе конструкции בְּנֵי имя поставлено в русский родительный падеж: «Хагава».'
- source_word: שמלי
  choice: Шамлай
  rationale: Собственное имя передано по согласному составу масоретского текста как «Шамлай». В стихе употреблена падежная форма «Шамлая»; вариант «Шалмай» сохранён в сноске из-за иной традиции прочтения.
- source_word: חָנָן
  choice: Ханан
  rationale: 'Собственное имя передано прямой транслитерацией. После «сыновья» употреблена форма родительного падежа: «Ханана».'
