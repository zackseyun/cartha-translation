  rationale: Собственное имя передано традиционной русской библейской формой; здесь оно обозначает родоначальника семейной группы.
- source_word: תָמַח
  choice: Фемах
  rationale: Собственное имя передано традиционной русской библейской формой, соответствующей огласованному еврейскому тексту.
