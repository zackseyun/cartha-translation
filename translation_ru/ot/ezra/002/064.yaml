lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: всё собрание
  rationale: Сочетание כָּל с определённым существительным выражает полноту состава; «всё собрание» естественно и точно передаёт собранное сообщество переселенцев.
- source_word: כְּאֶחָד
  choice: вместе
  rationale: Буквально «как один»; в данном контексте оборот указывает на совокупный итог подсчёта. «Вместе» естественно передаёт его функцию, а буквальная форма сохранена в сноске.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  choice: сорок две тысячи триста шестьдесят
  rationale: 'Точная передача еврейской числовой последовательности: четыре десятка тысяч, две тысячи, триста и шестьдесят.'
- source_word: היה (подразумевается именной конструкцией)
  choice: насчитывало … человек
  rationale: В русском для сообщения общей численности естественен глагол «насчитывало»; слово «человек» ясно обозначает единицу счёта и не меняет смысла.
