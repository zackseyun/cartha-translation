lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: Форма сопряжённого множественного числа от בֵּן буквально означает «сыновья/сыновей». В данном перечне она обозначает людей, принадлежавших к роду или общине, связанной с местностью; буквальная передача сохраняет лаконичный реестровый стиль и не устраняет эту неоднозначность.
- source_word: בֵית לָחֶם
  choice: Вифлеема
  rationale: Название населённого пункта передано в принятой русской библейской форме «Вифлеем», здесь в родительном падеже после «сыновей».
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: сто двадцать три
  rationale: Еврейское числительное обозначает общее число 123; русская форма естественно и точно передаёт его в переписном перечне.
theological_decisions: []
translation_notes:
  register: Лаконичный, dignified реестровый стиль. Начальная форма «сыновей» синтаксически продолжает вводную конструкцию перечня в предыдущих стихах; тире естественно отделяет название группы от её численности.
