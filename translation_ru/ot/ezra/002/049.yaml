lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Формально передаёт повторяющуюся конструктивную форму множественного числа от בֵּן и сохраняет лаконичный ритм списка; в генеалогическом контексте слово может обозначать также потомков или род.
- source_word: עֻזָּא
  choice: Уззы
  rationale: Транслитерация личного имени עֻזָּא в форме родительного падежа после слова «сыновья».
- source_word: פָסֵחַ
  choice: Пасеаха
  rationale: Транслитерация личного имени פָסֵחַ с передачей конечного гортанного согласного через сочетание «ах»; форма родительного падежа обусловлена русским синтаксисом.
- source_word: בֵסָי
  choice: Бесая
  rationale: Транслитерация личного имени בֵסָי с конечным -ай; употреблена форма родительного падежа.
