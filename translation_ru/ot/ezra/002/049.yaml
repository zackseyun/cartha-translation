  text: сыновья Уззы[a], сыновья Пасеаха, сыновья Бесая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «сыновья» здесь может обозначать не только непосредственных сыновей, но также потомков или представителей рода.
