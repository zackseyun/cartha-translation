  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: ru
  text: 'Храмовые служители[a]: сыновья[b] Цихи, сыновья Хасуфы, сыновья Таббаота.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «нетиним»; особая группа служителей, приставленных к служению при храме.
    reason: lexical_alternative
  - marker: b
    text: Или «потомки» во всех трёх случаях; в родословных перечнях еврейское «сыновья» может обозначать не только непосредственных сыновей, но и потомков или членов рода.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Название особой группы людей, предназначенных для служения при святилище, передано по функции, чтобы избежать непонятной без пояснения транслитерации «нефинеи».
- source_word: בְּנֵי
  choice: сыновья
  rationale: Буквально сохраняет повторяющуюся формулу родового списка; в данном контексте слово может обозначать также потомков или членов рода, что отмечено в сноске.
- source_word: צִיחָא
  choice: Циха
  rationale: Имя транслитерировано с еврейского с естественным для русского языка окончанием.
- source_word: חֲשׂוּפָא
  choice: Хасуфа
  rationale: Имя транслитерировано непосредственно с еврейского; начальная ח передана русской буквой «х».
- source_word: טַבָּעוֹת
  choice: Таббаот
  rationale: В этом перечне форма выступает как имя родоначальника или рода, поэтому она транслитерирована, а не переведена как созвучное нарицательное слово.
