lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В контексте перечня вернувшихся בְּנֵי обозначает членов рода, происходящего от названного предка. «Сыновей» формально передаёт еврейское выражение и естественно сочетается с подразумеваемой рамкой списка.
- source_word: אָרַח
  choice: Араха
  rationale: Личное имя передано транслитерацией; родительный падеж обусловлен словом «сыновей».
- source_word: שְׁבַע מֵאוֹת חֲמִשָּׁה וְשִׁבְעִים
  choice: семьсот семьдесят пять
  rationale: Еврейское числительное означает 700 + 5 + 70, то есть 775; порядок компонентов приведён к естественному современному русскому употреблению, число записано словами ради литературной последовательности списка.
theological_decisions: []
translation_notes:
  register: Лаконичный, достоинственный стиль родословно-переписного списка. Начальная форма «сыновей» предполагает синтаксическую рамку предыдущего стиха («вот люди...» / «число их было...»), как и в еврейском тексте.
