base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: ru
  text: И правитель сказал им, чтобы они не вкушали от особо святых приношений[a][b], пока не появится священник с Уримом и Туммимом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тиршафа» — персидский административный титул.'
    reason: lexical_alternative
  - marker: b
    text: То есть от особо святых долей жертвоприношений, предназначенных священникам; речь не о Святом святых как помещении.
    reason: cultural_note
  - marker: c
    text: Урим и Туммим служили священными средствами вопрошания Бога через священника; их точный вид и порядок применения неизвестны.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: правитель
  rationale: Персидский административный титул передан по смыслу современным и понятным русским словом; традиционная транслитерация «тиршафа» отмечена в сноске.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: чтобы они не ели
  rationale: Оборот естественно передаёт содержание распоряжения и его запретительную силу, не усиливая её сверх текста.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: от величайших святынь
  rationale: Формула выражает высшую степень святости и в данном контексте обозначает священные доли пищи, а не внутреннее помещение святилища. Предлог «от» сохраняет конструкцию исходного текста.
- source_word: עַד עֲמֹד כֹּהֵן
  choice: пока не появится священник
  rationale: Передаёт будущий предел действия запрета; «появится» в современном русском естественнее буквального «встанет» и сохраняет смысл прихода подходящего священника.
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: с уримом и туммимом
  rationale: Технические культовые термины сохранены транслитерацией, а предлог передан идиоматически без уточнения не вполне известной процедуры.
theological_decisions:
- issue: Значение קֹדֶשׁ הַקֳּדָשִׁים в данном контексте
  choice: Особо святые доли жертвенной пищи, положенные священникам
  alternative: Святое святых как внутреннее помещение святилища
  rationale: Речь идёт о праве людей с неподтверждённым священническим происхождением есть священную пищу; глагол «есть» исключает пространственное понимание выражения.
- issue: Передача урима и туммима
  choice: Сохранить традиционные культовые названия без истолковывающего перевода
  alternative: Перевести предположительно как «светы и совершенства» или описать способ получения ответа
  rationale: Точная форма этих предметов и процедура их использования неизвестны; транслитерация сохраняет историческую и богословскую неопределённость текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прямой и понятный; культовые термины сохранены, а административный титул переведён функционально.
