  source_fidelity: 'В целом смысл передан верно: правитель запрещает лицам с неподтверждённым священническим происхождением есть от особо святых приношений до решения через священника, связанного с уримом и туммимом. Однако «величайшие святыни» в современном русском обычно обозначает предметы или места почитания и неестественно сочетается с «ели от»; оно недостаточно ясно передаёт съедобные священнические доли.'
  naturalness: «Не ели от величайших святынь» звучит тяжеловесно и семантически неудачно. «Не вкушали от особо святых приношений» сохраняет высокий, но понятный библейский регистр и контекст пищи. «Урим» и «туммим» следует писать с прописной буквы как наименования традиционных культовых реалий.
  terminology: «Правитель» удачно передаёт титул הַתִּרְשָׁתָא; вариант «тиршафа» корректно дан в сноске. «Особо святые приношения» передаёт קֹדֶשׁ הַקֳּדָשִׁים без ложной ассоциации со Святым святых как помещением. Технические названия «Урим и Туммим» сохранены без догматического уточнения.
