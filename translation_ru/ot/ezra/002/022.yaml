lexical_decisions:
- source_word: אַנְשֵׁי
  choice: жителей
  rationale: Сопряжённая форма множественного числа от אִישׁ в перечне выходцев из населённого пункта. Русское «жителей» естественно передаёт принадлежность людей к данной местности, не добавляя отсутствующего в еврейском тексте слова «сыновья».
- source_word: נְטֹפָה
  choice: Нетофы
  rationale: Топоним передан принятой русской библейской транслитерацией «Нетофа» и поставлен в родительный падеж после слова «жителей».
- source_word: חֲמִשִּׁים וְשִׁשָּׁה
  choice: пятьдесят шесть
  rationale: Обычная современная русская форма составного количественного числительного 56; союз וְ не требуется передавать отдельным «и», поскольку в русском это звучало бы архаично и неестественно.
