base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/040.yaml
  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: ru
  text: 'Левиты: сыновья Иешуи и Кадмиила, из сыновей Годавии[a], — семьдесят четыре человека.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит «Годавия»; в параллельном списке в Неемии 7:43 — «Годева».
    reason: textual_variant
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Левиты
  rationale: Определённая групповая номинация открывает новую категорию переписного списка; краткий заголовок естественен по-русски.
- source_word: בְּנֵי
  choice: сыновья
  rationale: В родословно-переписном контексте слово обозначает членов рода; формальное «сыновья» прозрачно сохраняет образ оригинала.
- source_word: יֵשׁוּעַ
  choice: Иешуи
  rationale: Послепленный вариант имени передан транслитерацией «Иешуа» и поставлен в требуемый русским синтаксисом родительный падеж.
- source_word: וְקַדְמִיאֵל
  choice: и Кадмиила
  rationale: Союз и личное имя переданы прямо, с русским падежным оформлением.
- source_word: לִבְנֵי
  choice: из сыновей
  rationale: Предлог לְ здесь выражает родовую принадлежность; «из сыновей» естественно связывает названные семьи с более широким родом, не уточняя сверх текста точную структуру родства.
- source_word: הוֹדַוְיָה
  choice: Годавии
  rationale: Основной текст следует форме масоретского текста данного стиха; имя оформлено в родительном падеже.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: семьдесят четыре человека
  rationale: Число передано современным русским способом; «человека» добавлено для естественной ясности переписного списка.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством переписного перечня. Двоеточие сохраняет функцию рубричного заголовка, а тире отделяет итоговое число. Родословная связь передана без попытки устранить краткость и возможную структурную неоднозначность еврейского текста.
