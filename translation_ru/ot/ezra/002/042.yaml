  text: בְּנֵ֣י הַ/שֹּֽׁעֲרִ֗ים בְּנֵי שַׁלּ֤וּם בְּנֵֽי אָטֵר֙ בְּנֵי טַלְמ֣וֹן בְּנֵי עַקּ֔וּב בְּנֵ֥י חֲטִיטָ֖א בְּנֵ֣י שֹׁבָ֑י הַ/כֹּ֕ל מֵאָ֖ה שְׁלֹשִׁ֥ים וְ/תִשְׁעָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: ru
  text: 'Сыновья привратников: сыновья Шаллума, сыновья Атера, сыновья Талмона, сыновья Аккува, сыновья Хатиты, сыновья Шовая — всего сто тридцать девять человек.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: В родословно-перечневом контексте слово обозначает потомков или членов родовой группы. Буквальное «сыновья» сохраняет повторяющуюся структуру еврейского текста и остаётся понятным по-русски.
- source_word: הַשֹּׁעֲרִים
  choice: привратников
  rationale: Слово обозначает служителей, охранявших ворота, в данном контексте — храмовых. «Привратники» — естественный и традиционно понятный русский эквивалент.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Личное имя передано транслитерацией с учётом масоретской огласовки.
- source_word: אָטֵר
  choice: Атер
  rationale: Личное имя передано транслитерацией.
- source_word: טַלְמוֹן
  choice: Талмон
  rationale: Личное имя передано транслитерацией.
- source_word: עַקּוּב
  choice: Аккув
  rationale: Личное имя передано в форме, отражающей удвоение согласного и традиционную русскую передачу конечного ב без дагеша как «в».
- source_word: חֲטִיטָא
  choice: Хатита
  rationale: Личное имя передано транслитерацией в соответствии с масоретской огласовкой.
- source_word: שֹׁבָי
  choice: Шовай
  rationale: Личное имя передано близко к масоретской форме; конечное сочетание отражено как «ай».
- source_word: הַכֹּל
  choice: всего
  rationale: В итоговой строке списка слово вводит общую численность; «всего» кратко и естественно выражает эту функцию по-русски.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: сто тридцать девять человек
  rationale: Число передано обычной русской формой; добавление «человек» делает итог переписи естественным и не меняет смысла.
theological_decisions: []
