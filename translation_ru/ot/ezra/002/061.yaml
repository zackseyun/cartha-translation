base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: ru
  text: 'А из сыновей священников: сыновья Ховаии, сыновья Гаккоца, сыновья Варзиллая, который взял в жёны одну из дочерей Варзиллая галаадитянина и был назван их именем.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более естественно: «и принял их имя». Буквально: «и был назван их именем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: А из сыновей священников
  rationale: Сочетание מן с בְּנֵי имеет партитивный смысл — речь идёт о некоторых представителях священнических родов. «Сыновья» сохраняет генеалогическую форму списка.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: сыновья Ховаии, сыновья Гаккоца, сыновья Варзиллая
  rationale: Повтор בְּנֵי сохранён для прозрачной передачи структуры перечня; имена переданы в формах, соответствующих русской библейской традиции и еврейскому тексту.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: который взял в жёны одну из дочерей
  rationale: Оборот לקח אשה означает вступление в брак; партитивное מן перед множественным «дочери» естественно передано как «одну из дочерей».
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: Варзиллая галаадитянина
  rationale: Определение הַגִּלְעָדִי передано традиционным русским обозначением жителя или уроженца Галаада.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: и стал называться их именем
  rationale: Передаёт страдательную форму еврейского глагола и сохраняет множественное местоимение, не уточняя сверх текста социальный механизм принятия имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением лаконичного генеалогического строя. Формула «взял в жёны» понятна современному читателю и сохраняет библейскую торжественность; буквальность последней фразы вынесена в основной текст, а более идиоматичный вариант — в сноску.
