- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7 337
  rationale: Цифровая запись удобна для восприятия в переписном перечне и точно сохраняет число.
- source_word: וְלָהֶם
  choice: у них было
  rationale: Еврейская конструкция принадлежности естественно передаётся современным русским оборотом «у них было».
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: певцов и певиц
  rationale: Сохраняется явное различение мужского и женского рода в исходном тексте.
- source_word: מָאתָיִם
  choice: '200'
  rationale: Цифровая запись соответствует оформлению других переписных данных и точно передаёт число.
