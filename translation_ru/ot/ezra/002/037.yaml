lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В послепленном родовом списке слово обозначает потомков или членов рода; буквальное и привычное «сыновей» сохраняет еврейскую форму перечня и естественно продолжается после подразумеваемого вводного оборота о возвратившихся.
- source_word: אִמֵּר
  choice: Иммера
  rationale: Личное имя, ставшее обозначением рода; передано традиционной русской транслитерацией и поставлено в родительный падеж после слова «сыновей».
- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: 1 052
  rationale: Еврейская последовательность буквально означает «тысяча пятьдесят и два»; цифровая запись уместна и ясна в переписном списке.
