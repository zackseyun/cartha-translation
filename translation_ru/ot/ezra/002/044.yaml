  text: the sons of Keros[a], the sons of Siaha, the sons of Padon.
translation:
  language: ru
  text: сыновья Кероса[a], сыновья Сиахи, сыновья Падона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В родословных перечнях слово «сыновья» может означать также «потомки» или членов рода, а не только непосредственных сыновей.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: В родословных и родовых перечнях это обычная формула, обозначающая сыновей, потомков или членов названного рода. «Сыновья» сохраняет структуру еврейского текста, а более широкий контекстуальный смысл поясняется в сноске.
- source_word: קֵרֹס
  choice: Керос
  rationale: Собственное имя передано транслитерацией в соответствии с масоретской огласовкой.
- source_word: סִיעֲהָא
  choice: Сиаха
  rationale: Собственное имя передано транслитерацией; форма отражает согласный состав и огласовку масоретского текста.
- source_word: פָדוֹן
  choice: Падон
  rationale: Собственное имя передано транслитерацией в соответствии с еврейской огласовкой.
