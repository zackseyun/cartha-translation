  rationale: Сопряжённая форма множественного числа от אִישׁ буквально указывает на мужчин, связанных с данным местом, но в переписном списке естественно обозначает исчисленных представителей населения; «жителей» точно и естественно передаёт функцию выражения по-русски.
- source_word: מִכְמָס
  choice: Михмаса
  rationale: Название места передано русской библейской транслитерацией, близкой к еврейской форме; после слова «жителей» употреблён родительный падеж.
- source_word: מֵאָה עֶשְׂרִים וּשְׁנָיִם
  choice: сто двадцать два
  rationale: Еврейское числительное имеет ясную аддитивную структуру 100 + 20 + 2 и передано обычной современной русской формой.
