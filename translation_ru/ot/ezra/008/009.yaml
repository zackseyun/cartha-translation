  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: ru
  text: 'Из сыновей Иоава: Овадия, сын Иехиила, и с ним 218 мужчин.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי יוֹאָב
  choice: Из сыновей Иоава
  rationale: Предлог מִן с בְּנֵי вводит одну из родовых групп в перечне. Формулировка сохраняет структуру еврейского списка и не исключает более широкого значения «потомки».
- source_word: עֹבַדְיָה
  choice: Овадия
  rationale: Традиционная русская передача еврейского личного имени.
- source_word: בֶּן יְחִיאֵל
  choice: сын Иехиила
  rationale: Буквально передаёт обычную родословную формулу; имя יְחִיאֵל дано в принятой русской библейской форме.
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Сохранены как соединительный союз, так и указание на людей, сопровождавших названного главу рода.
- source_word: מָאתַיִם וּשְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: Цифровая запись удобна и естественна в перечне и точно передаёт еврейское числительное «двести восемнадцать».
- source_word: הַזְּכָרִים
  choice: человек мужского пола
  rationale: Еврейское слово указывает именно на пол и не обязательно означает только взрослых мужчин; выбранная формулировка сохраняет эту точность.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены краткость, перечислительная структура и родословный характер исходного текста. Английская сноска к имени Иехиил не отражена, поскольку её содержание («или двести восемнадцать») не связано с отмеченным словом и не имеет основания в данном еврейском тексте.
