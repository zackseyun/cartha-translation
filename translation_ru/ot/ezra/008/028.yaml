base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: ru
  text: 'И я сказал им: «Вы посвящены Яхве, и сосуды также посвящены Яхве; серебро и золото — добровольное приношение Яхве, Богу ваших отцов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: И я сказал
  rationale: Форма от אמר продолжает повествовательную последовательность и вводит прямую речь; союз передан без дополнительного истолкования.
- source_word: אַתֶּם קֹדֶשׁ לַיהוָה
  choice: Вы посвящены Яхве
  rationale: Предикативное קֹדֶשׁ обозначает священный статус и принадлежность Яхве. «Посвящены» естественно передаёт этот смысл применительно к людям и сохраняет отличие от последующего «святы» о сосудах.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом; форма «Яхве» общепринята в современной русской библеистической передаче.
- source_word: הַכֵּלִים
  choice: эти сосуды
  rationale: В храмовом контексте כֵּלִים означает священные предметы, в частности сосуды. Указательное «эти» в русском естественно обозначает уже присутствующие в контексте определённые предметы.
- source_word: קֹדֶשׁ
  choice: святы
  rationale: Сохраняется культовый смысл отделённости и посвящённости Богу; краткое прилагательное естественно в русском предикативном обороте.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: серебро и золото
  rationale: Русский язык не имеет артиклей; определённость данных ценностей устанавливается контекстом.
- source_word: נְדָבָה
  choice: добровольное приношение
  rationale: Слово обозначает дар, принесённый добровольно. «Приношение» сохраняет культовый контекст, а «добровольное» — смысл отсутствия принуждения.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Богу ваших отцов
  rationale: Сохранена грамматически мужская форма и традиционная формула, связывающая Яхве с предками адресатов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл קֹדֶשׁ применительно к адресатам
  choice: посвящены Яхве
  alternative: святы для Яхве
  rationale: Оба варианта передают культовую отделённость; «посвящены Яхве» яснее выражает принадлежность и назначение, не добавляя нравственной оценки.
- issue: Формула אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Богу ваших отцов
  alternative: Богу ваших предков
  rationale: «Отцов» точно сохраняет мужской множественный род исходного выражения и его заветную формульность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохраняет параллелизм исходного текста, но избегает архаизмов вроде «пред Господом» и «доброхотное даяние».
