source:
  edition: WLC
  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: ru
  text: 'Пришедшие из плена — возвратившиеся изгнанники[a] — принесли всесожжения Богу Израиля: двенадцать быков за весь Израиль[b], девяносто шесть баранов, семьдесят семь ягнят и двенадцать козлов в жертву за грех. Всё это было всесожжением Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны изгнания» — то есть возвратившиеся изгнанники.'
    reason: cultural_note
  - marker: b
    text: 'Или: «от имени всего Израиля».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст гласит: «Всё это было всесожжением Яхве», хотя непосредственно перед этим упомянуты козлы в жертву за грех.'
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: пришедшие из плена
  rationale: Субстантивированное причастие обозначает уже прибывшую группу, а שְׁבִי — состояние плена; формулировка естественна для русского повествования.
- source_word: בְנֵי הַגּוֹלָה
  choice: возвратившиеся изгнанники
  rationale: Буквальное «сыны изгнания» в современном русском неясно; контекстуальный эквивалент передаёт обозначение вернувшихся из изгнания людей. Тире сохраняет приложительный характер фразы.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: принесли всесожжения
  rationale: «Принесли» естественно передаёт жертвенное употребление הקריב, а «всесожжение» является точным и устоявшимся названием жертвы עֹלָה.
- source_word: פָּרִים שְׁנֵים עָשָׂר עַל כָּל יִשְׂרָאֵל
  choice: двенадцать быков за весь Израиль
  rationale: Предлог עַל здесь допускает представительское значение «за, от имени»; краткое «за весь Израиль» сохраняет эту смысловую ёмкость.
- source_word: צְפִירֵי חַטָּאת
  choice: козлов в жертву за грех
  rationale: צְפִירֵי указывает на козлов мужского пола, а חַטָּאת в жертвенном контексте обозначает жертву за грех.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: Всё это было всесожжением Яхве
  rationale: Перевод прямо сохраняет итоговую формулировку еврейского текста и не сглаживает её напряжение с только что упомянутой жертвой за грех.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет явное присутствие заветного имени в исходном тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» передаёт его как личное заветное имя и не заменяет титулом.
- issue: Соотношение жертвы за грех и заключительного «всё это было всесожжением»
  choice: Сохранить итоговое утверждение без гармонизации
  alternative: Отнести «всё» лишь к животным, предназначенным для всесожжения, или пояснительно перефразировать
  rationale: Масоретский текст содержит оба выражения. Перевод сохраняет подлинное текстовое и богословское напряжение, не разрешая его молча.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Термины «всесожжение» и «жертва за грех» сохранены как понятные устоявшиеся культовые обозначения; тяжёлый гебраизм «сыны изгнания» вынесен в примечание.
