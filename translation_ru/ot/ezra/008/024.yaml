  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: ru
  text: 'Затем я выделил двенадцать человек из числа руководителей среди священников[a]: Шеревию, Хашавию и вместе с ними десятерых из их братьев[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из числа глав среди священников».'
    reason: lexical_alternative
  - marker: b
    text: Слово «братья» может здесь обозначать также сородичей или собратьев по служению; в еврейском тексте употреблено мужское слово со значением «братья».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: Затем я отделил
  rationale: Порода hифиль глагола בדל означает «отделить, выделить». «Отделил» сохраняет образ исходного текста и естественно передаёт назначение людей для особого поручения; союз ו передан наречием «затем» как указание на последовательность повествования.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: из начальников священников
  rationale: Предлог מִן имеет партитивное значение («из числа»), а שׂרים обозначает начальников, руководителей или глав. Формулировка прямо сохраняет синтаксис и не превращает этих лиц в отдельную категорию «главных священников».
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать человек
  rationale: Числительное передано прямо; слово «человек» добавлено для естественности русского языка и ясно показывает, что последующие два имени и десять братьев вместе составляют двенадцать.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: Шеревию, Хашавию
  rationale: 'Личные имена транслитерированы в принятой русской библейской форме. Необычный предлог לְ перед первым именем не воспроизведён отдельно: в данном перечислении он не имеет естественного формального соответствия в русском и не меняет идентификацию названных лиц.'
- source_word: וְעִמָּהֶם
  choice: и с ними
  rationale: Союз и предложная конструкция сохранены, чтобы передать присоединительную структуру еврейского текста.
- source_word: מֵאֲחֵיהֶם
  choice: из их братьев
  rationale: אָח с суффиксом буквально означает «их братья», тогда как מִן обозначает выбор из их числа. Более широкое контекстуальное значение возможно, но не внесено в основной текст.
- source_word: עֲשָׂרָה
  choice: десятерых
  rationale: Форма числительного естественно согласована в русском с подразумеваемым одушевлённым существительным мужского рода.
