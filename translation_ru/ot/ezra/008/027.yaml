  - marker: b
    text: 'Или: «два сосуда из добротной полированной бронзы». Редкое выражение, описывающее бронзу, вероятно, указывает на её исключительное качество и блеск.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי זָהָב
  choice: золотых чаш
  rationale: כְפֹרֵי обозначает чашеобразные сосуды; «чаши» естественно и уместно в перечне храмовых ценностей.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: стоимостью в тысячу дариков
  rationale: Предлог לְ здесь, вероятнее всего, указывает на оценочную стоимость; «дарик» сохраняет историческое название персидской денежно-весовой единицы.
- source_word: כְלֵי נְחֹשֶׁת
  choice: сосуда из ... бронзы
  rationale: כְלִי — широкое обозначение предмета или сосуда; в данном инвентарном контексте подходит «сосуд». נְחֹשֶׁת может означать медь или бронзу, но для искусно изготовленных сосудов вероятнее «бронза».
- source_word: מֻצְהָב טוֹבָה
  choice: превосходной сверкающей бронзы
  rationale: Редкое и трудное выражение, по-видимому, описывает высокое качество и блеск металла или отделки. Перевод не утверждает, что сосуды были позолочены.
- source_word: חֲמוּדֹת כַּזָּהָב
  choice: драгоценных, как золото
  rationale: חֲמוּדֹת выражает ценность и желанность, а כַּזָּהָב содержит прямое сравнение с золотом.
