lexical_decisions:
- source_word: מִבְּנֵי
  choice: Из сыновей
  rationale: Сохраняет формулу родословного перечня и значение принадлежности к группе; «из потомков» было бы более гладко, но менее формально близко.
- source_word: שְׁכַנְיָה
  choice: Шехания
  rationale: Передача еврейского личного имени в форме, естественной для русской библейской традиции.
- source_word: בֶּן
  choice: сын
  rationale: В данном перечне слово обозначает названного представителя рода Шехании — сына Яхазиила. Пунктуация помогает не принять Шеханию за сына Яхазиила.
- source_word: יַחֲזִיאֵל
  choice: Яхазиил
  rationale: Транслитерация еврейского личного имени с сохранением элемента «Ях».
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Прямо сохраняет координацию и указывает, что перечисленная группа сопровождала названного человека.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: триста
  rationale: Прямая передача количественного числительного.
- source_word: הַזְּכָרִים
  choice: мужчин
  rationale: В русском перечне людей «мужчин» звучит естественнее буквального «лиц мужского пола», при этом сноска уточняет, что еврейское слово выделяет именно пол, а не возраст или общественное положение.
