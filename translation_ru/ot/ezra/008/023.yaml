base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/023.yaml
  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: ru
  text: Итак, мы постились и просили нашего Бога об этом, и Он услышал нашу мольбу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: мы постились
  rationale: Форма 1-го лица множественного числа от צום прямо обозначает соблюдение поста; добавлять идею провозглашения поста оснований нет.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: просили ... нашего Бога
  rationale: בקשׁ с מן в данном молитвенном контексте означает обращаться с просьбой к тому, от кого ожидают ответа. По-русски «просили нашего Бога» естественнее буквального «искали от нашего Бога».
- source_word: עַל זֹאת
  choice: об этом
  rationale: Оборот указывает на ранее названное дело — просьбу о благополучном пути; «об этом» сохраняет отсылку, не поясняя её сверх текста.
- source_word: וַיֵּעָתֵר לָנוּ
  choice: Он услышал нашу мольбу
  rationale: Нифаль от עתר с ל выражает благосклонный ответ на прошение. Русское «услышал нашу мольбу» естественно передаёт именно положительный отклик, а не одно лишь физическое слышание.
theological_decisions:
- issue: Характер Божьего ответа в וַיֵּעָתֵר
  choice: Он услышал нашу мольбу
  alternative: Он внял нам; Он ответил на нашу молитву
  rationale: Перевод сохраняет смысл благосклонного ответа Бога на пост и прошение, не уточняя способ исполнения и не добавляя обещаний, которых нет в стихе.
translation_notes:
  register: Современный литературный русский язык; фраза звучит достойно и понятно. Синтаксис близок к еврейскому, но молитвенный оборот передан естественно для русского читателя.
