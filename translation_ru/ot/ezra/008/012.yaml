  text: וּ/מִ/בְּנֵ֣י עַזְגָּ֔ד יוֹחָנָ֖ן בֶּן הַ/קָּטָ֑ן וְ/עִמּ֕/וֹ מֵאָ֥ה וַ/עֲשָׂרָ֖ה הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/012.yaml
  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: ru
  text: 'Из потомков Азгада: Иоханан, сын Гаккатана[a], и с ним сто десять мужчин.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын младшего», если הַקָּטָן понимать как описание, а не как имя Гаккатан.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Из потомков
  rationale: В перечне בְּנֵי обозначает не только непосредственных сыновей, но и более широкую родовую группу; «из потомков» естественно и точно передаёт эту функцию по-русски.
- source_word: עַזְגָּד
  choice: Азгада
  rationale: Собственное имя передано принятой русской библейской транслитерацией и поставлено в родительный падеж после слова «потомков».
- source_word: יוֹחָנָן
  choice: Иоханан
  rationale: Транслитерация еврейского имени, сохраняющая его ветхозаветную форму и отличающая её от русского эквивалента «Иоанн».
- source_word: בֶּן הַ/קָּטָן
  choice: сын Гаккатана[a]
  rationale: В контексте родового списка сочетание вероятнее всего служит отчеством; форма с артиклем отражена традиционной передачей имени «Гаккатан». Возможное описательное понимание сохранено в сноске.
- source_word: וְ/עִמּוֹ
  choice: и с ним
  rationale: Сохранена стандартная формула списка и еврейский союз.
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: сто десять
  rationale: Число передано словами в естественном для связного русского библейского текста виде.
- source_word: הַ/זְּכָרִים
  choice: мужчин
  rationale: Слово זְכָרִים прямо указывает на лиц мужского пола; «мужчин» в данном учётном перечне звучит естественнее, чем субстантивированное «мужского пола», хотя может подразумеваться не только возрастная категория взрослых.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма родового перечня. Родовое значение בְּנֵי раскрыто в основном тексте как «потомки», без ненужной буквальности. Неоднозначность הַקָּטָן сохранена в сноске.
