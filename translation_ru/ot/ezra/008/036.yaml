base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: ru
  text: Они передали царские указы царским сатрапам и наместникам Заречья[a], а те поддержали народ[b] и дом Божий[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Заречье» — персидское административное название области к западу от реки Евфрат.
    reason: cultural_note
  - marker: b
    text: 'Или: «оказали помощь». Еврейский глагол буквально означает «подняли» или «понесли», а здесь — оказали поддержку.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «храм Божий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: передали
  rationale: Глагол נתן буквально означает «дать», но при официальном вручении царских документов естественное русское «передали» точно выражает действие без лишнего уточнения.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: царские указы
  rationale: В административном контексте персидской эпохи דָּת обозначает официальное постановление; «указы» звучит естественно и не подразумевает полный свод законов.
- source_word: אֲחַשְׁדַּרְפְּנֵי
  choice: сатрапам
  rationale: «Сатрап» — исторически точное и принятое русское наименование правителя крупной области Персидской державы.
- source_word: פַחֲוֹת
  choice: наместникам
  rationale: Термин פחה обозначает областных правителей или администраторов; «наместники» сохраняет различие между ними и сатрапами и соответствует историческому регистру.
- source_word: עֵבֶר הַנָּהָר
  choice: Заречья
  rationale: Это персидское административно-географическое название территории к западу от Евфрата. «Заречье» кратко и естественно передаёт взгляд из центра Персидской державы.
- source_word: וְנִשְּׂאוּ
  choice: поддержали
  rationale: נשא буквально значит «поднимать, нести», но здесь обозначает оказание содействия. «Поддержали» сохраняет широту смысла и не уточняет не названный в тексте вид помощи.
- source_word: הָעָם
  choice: народ
  rationale: Еврейский текст говорит просто «народ»; перевод не добавляет более узкого определения.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Буквальное выражение «дом Бога» является обозначением храма; традиционная и понятная русская форма «дом Божий» сохраняет исходный образ.
theological_decisions:
- issue: К кому относится подлежащее глагола וְנִשְּׂאוּ («поддержали»)
  choice: «а те» — сатрапы и наместники
  alternative: «они» — лица, доставившие указы
  rationale: Ближайшие названные участники — сатрапы и наместники, а царские указы естественно объясняют их последующую поддержку народа и храма. Формулировка «а те» делает эту синтаксическую связь ясной, не придавая ей дополнительного богословского смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историческим регистром. Термины «сатрапы», «наместники» и «Заречье» передают персидскую административную обстановку; синтаксис сделан ясным и доступным без разговорных оборотов.
