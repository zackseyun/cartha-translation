base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: ru
  text: В двенадцатый день первого месяца мы отправились от реки Агавы, направляясь в Иерусалим. Рука нашего Бога была над нами, и он избавил нас от руки врага и от подстерегавшего в пути[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от засады в пути». Еврейское причастие может обозначать как человека, который подстерегает, так и саму опасность нападения из засады.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: мы отправились
  rationale: Глагол נסע в контексте путешествия означает сняться с места и пуститься в путь; «отправились» естественно передаёт начало пути.
- source_word: מִנְּהַר אֲהֲוָא
  choice: от реки Агавы
  rationale: Сохраняется обозначение водного объекта נָהָר и традиционная русская передача географического названия Агава.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: в двенадцатый день первого месяца
  rationale: Слово «день», подразумеваемое в еврейской датировочной формуле, добавлено для ясности по нормам русского языка.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: чтобы идти в Иерусалим
  rationale: Инфинитив выражает цель отправления; «чтобы идти» прямо передаёт эту синтаксическую связь.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: Рука Бога нашего была над нами
  rationale: Сохранён значимый для книги Ездры образ Божьей руки как выражение Его деятельного благоволения и защиты.
- source_word: וַיַּצִּילֵנוּ
  choice: и Он избавил нас
  rationale: Глагол נצל обозначает избавление или спасение от грозящей опасности; «избавил» соответствует контексту.
- source_word: מִכַּף אוֹיֵב
  choice: от руки врага
  rationale: Буквальный образ כַּף передаёт власть или хватку врага и создаёт намеренное смысловое сопоставление с рукой Бога.
- source_word: וְאוֹרֵב
  choice: и от подстерегавшего нас
  rationale: Еврейское причастие в единственном числе прежде всего обозначает того, кто таится или подстерегает. Объект «нас» естественно восполняется из контекста; возможное собирательное или абстрактное понимание отмечено в сноске.
- source_word: עַל הַדָּרֶךְ
  choice: в пути
  rationale: Выражение обозначает угрозу, возникшую на дороге во время путешествия; «в пути» естественно по-русски и не расширяет смысл.
theological_decisions:
- issue: Антропоморфный образ Божьей защиты
  choice: Сохранить выражение «Рука Бога нашего была над нами»
  alternative: «Бог наш защищал нас»
  rationale: В исходном тексте прямо употреблён образ руки Бога, повторяющийся в книге Ездры и обозначающий Его действенное благоволение и защиту. Его сохранение поддерживает литературную и богословскую связь, не навязывая дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сделан ясным для обычного читателя, при этом сохранены ключевые еврейские образы «рука Бога» и «рука врага».
