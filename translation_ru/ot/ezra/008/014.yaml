  yaml_path: translation/ot/ezra/008/014.yaml
  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: ru
  text: Из потомков Бигвая — Уфай и Заббуд[a]; с ним[b] — семьдесят мужчин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых текстовых традициях и древних переводах здесь отражено другое второе имя; в масоретском тексте — «Заббуд».
    reason: textual_variant
  - marker: b
    text: 'Буквально по еврейскому тексту: «с ним» — в единственном числе, хотя названы два человека. В некоторых переводах по смыслу стоит «с ними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בִגְוַי
  choice: Из потомков Бигвая
  rationale: Оборот מִבְּנֵי в родословном перечне обозначает представителей рода или потомков; «из потомков» естественнее по-русски и не сужает значение до непосредственных сыновей.
- source_word: עוּתַי
  choice: Уфай
  rationale: Традиционная русская передача этого собственного имени, соответствующего еврейскому עוּתַי.
- source_word: ו/זבוד
  choice: и Заббуд
  rationale: Передаёт имя, засвидетельствованное масоретским текстом, вместе с присоединительным союзом.
- source_word: וְ/עִמּ/וֹ
  choice: с ним
  rationale: Местоименный суффикс в еврейском тексте стоит в единственном числе; перевод сохраняет эту грамматическую особенность, хотя перед ним названы два человека.
- source_word: שִׁבְעִים הַ/זְּכָרִים
  choice: семьдесят мужчин
  rationale: זְכָרִים прямо указывает на лиц мужского пола; «мужчин» — точная и естественная современная русская передача в контексте списка переселенцев.
