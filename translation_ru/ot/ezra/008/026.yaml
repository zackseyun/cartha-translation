    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  choice: я отвесил
  rationale: Глагол שׁקל обозначает взвешивание ценностей при их передаче; «отвесил» естественно передаёт и измерение по весу, и выдачу установленного количества.
- source_word: עַל יָדָם
  choice: им
  rationale: Буквально «на их руку»; здесь идиома означает передачу в распоряжение или под ответственность. Русское «им» кратко и естественно передаёт смысл в данном контексте.
- source_word: כֶּסֶף
  choice: серебра
  rationale: Речь идёт о драгоценном металле, измеряемом по весу, а не о деньгах как валюте.
- source_word: כִּכָּרִים
  choice: талантов
  rationale: כִּכָּר — крупная древняя мера веса; традиционное «талант» уместно в перечне храмовых ценностей.
- source_word: וּכְלֵי כֶסֶף
  choice: серебряные сосуды
  rationale: כְּלִי может означать сосуд, предмет или утварь; в контексте храмовых ценностей «сосуды» звучит естественно и достойно.
- source_word: מֵאָה לְכִכָּרִים
  choice: весом в сто талантов
  rationale: Эллиптическое еврейское выражение, вероятнее всего, указывает на совокупный вес серебряных сосудов. Перевод восполняет подразумеваемую связь, не представляя число сто как количество сосудов.
- source_word: זָהָב מֵאָה כִכָּר
  choice: сто талантов золота
  rationale: Прямое обозначение количества золота в единицах веса.
