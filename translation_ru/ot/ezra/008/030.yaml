  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Порядок фразы перестроен ради естественности: оборот «всё по весу» относится ко всему перечню ценностей. Маркеры сносок размещены непосредственно после соответствующих выражений.'
