base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: ru
  text: Итак, священники и левиты приняли взвешенное количество серебра, золота и сосудов[a], чтобы доставить их в Иерусалим, в дом нашего Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приняли вес серебра, золота и сосудов». Еврейское слово может обозначать как сам вес, так и количество, определённое взвешиванием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в храм нашего Бога». Буквально: «в дом нашего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: приняли
  rationale: Форма Qal перфекта 3-го лица множественного числа обозначает принятие ценностей под ответственность; «приняли» естественно передаёт передачу на хранение и для доставки.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священники и левиты
  rationale: Прямое и общепринятое соответствие определённым формам множественного числа.
- source_word: מִשְׁקַל
  choice: всё по весу
  rationale: Слово может обозначать вес либо количество, определённое взвешиванием. Конструкция «всё по весу» естественно выражает, что перечисленные ценности были переданы в учтённом по весу количестве, не ограничивая определение одним серебром.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: серебро, золото и сосуды
  rationale: Названия металлов переданы буквально; «сосуды» уместно для כֵּלִים в контексте храмовых принадлежностей, хотя еврейское слово имеет более широкое значение.
- source_word: לְהָבִיא
  choice: чтобы доставить их
  rationale: Инфинитив с לְ выражает цель. «Доставить» естественно передаёт перенос вверенных ценностей к месту назначения; местоимение «их» восполняется из контекста.
- source_word: לִירוּשָׁלַם
  choice: в Иерусалим
  rationale: Нормальная русская передача направления движения к городу.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: в дом нашего Бога
  rationale: Сохраняет буквальный образ еврейского выражения и не заменяет его интерпретирующим словом «храм» в основном тексте.
