  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: ru
  text: и Хашавию, и с ним Иешаю — из сыновей Мерари, его братьев[a] и их сыновей — двадцать человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
