    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת חֲשַׁבְיָה
  choice: и Хашавию
  rationale: Союз продолжает перечень прямых дополнений из предыдущего стиха; показатель прямого дополнения отдельно не переводится. Имя передано принятой русской библейской транслитерацией.
- source_word: וְאִתּוֹ יְשַׁעְיָה
  choice: а с ним Иешаю
  rationale: Предлог с местоименным суффиксом выражает сопровождение; союз «а» естественно вводит связанного с Хашавией участника, не меняя смысла еврейского וְ.
- source_word: מִבְּנֵי מְרָרִי
  choice: из сыновей Мерари
  rationale: Сохранена еврейская родословная формула, обозначающая принадлежность к линии потомков Мерари.
- source_word: אֶחָיו
  choice: его братьев
  rationale: Сохранено основное значение существительного с суффиксом 3-го лица; возможный более широкий родственный смысл пояснён в сноске.
- source_word: וּבְנֵיהֶם
  choice: и их сыновей
  rationale: Мужской род и контекст списка служителей позволяют конкретно передать «сыновей», а не более общее «детей».
- source_word: עֶשְׂרִים
  choice: двадцать человек
  rationale: Число естественно понимается как итог для названной группы; слово «человек» добавлено для ясности по-русски без изменения референции.
