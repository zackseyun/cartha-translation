lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Из сыновей
  rationale: Буквально сочетает союз, предлог и слово «сыновья». В родословном перечне обозначает представителей рода; буквальная форма сохранена, а значение пояснено в сноске. Начальный союз в русском не выражен отдельно, поскольку связь с продолжающимся списком передаётся самой конструкцией.
- source_word: שְׁלוֹמִית
  choice: Шеломифа
  rationale: Имя передано транслитерацией, близкой к еврейской форме и принятой русской библейской традиции.
- source_word: בֶּן
  choice: сына
  rationale: Форма передаёт родственную характеристику Шеломифа по отношению к Иосифии, не добавляя отсутствующих в еврейском тексте пояснений.
- source_word: יוֹסִפְיָה
  choice: Иосифии
  rationale: Еврейское личное имя передано в традиционной для русского библейского регистра форме; родительный падеж обусловлен словом «сына».
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Сохранены и соединительный союз, и указание на людей, сопровождавших названного представителя рода.
- source_word: מֵאָה וְשִׁשִּׁים
  choice: сто шестьдесят
  rationale: Число записано словами, что естественно для связного русского библейского текста.
- source_word: הַזְּכָרִים
  choice: мужчин
  rationale: Еврейское слово прямо указывает на лиц мужского пола. «Мужчин» естественно звучит по-русски в перечне, хотя формально слово может охватывать не только взрослых.
