  text: וּ/מִ/בְּנֵ֣י עָדִ֔ין עֶ֖בֶד בֶּן יוֹנָתָ֑ן וְ/עִמּ֖/וֹ חֲמִשִּׁ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/006.yaml
  text: 'And from the sons of Adin: Ebed son of Jonathan[a], and with him fifty males.'
translation:
  language: ru
  text: из сыновей Адина — Эвед, сын Ионафана, и с ним пятьдесят мужчин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: из сыновей
  rationale: Формально передаёт родословно-списочную формулу בְּנֵי; начальный союз естественно не воспроизводить после границы стиха, поскольку по-русски он утяжелил бы продолжение перечня.
- source_word: עָדִין
  choice: Адина
  rationale: Личное имя передано принятой русской библейской транслитерацией и поставлено в родительный падеж после «сыновей».
- source_word: עֶבֶד
  choice: Эвед
  rationale: Здесь это личное имя, а не нарицательное «слуга» или «раб»; передана еврейская форма имени.
- source_word: בֶּן יוֹנָתָן
  choice: сын Ионафана
  rationale: Обычная русская форма родословного указания; имя יוֹנָתָן передано в традиционной русской библейской форме.
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Сохраняет союз и прямо связывает названного предводителя с сопровождавшей его группой.
- source_word: חֲמִשִּׁים
  choice: пятьдесят
  rationale: Прямое соответствие количественному числительному.
- source_word: הַזְּכָרִים
  choice: мужчин
  rationale: В данном перечне переселенцев естественное русское «мужчин» передаёт обозначение лиц мужского пола; буквальное «самцов» применительно к людям в современном русском звучит уничижительно и неуместно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; лаконичная структура перечня сохранена. Тире помогает ясно отделить название рода от имени его представителя.
