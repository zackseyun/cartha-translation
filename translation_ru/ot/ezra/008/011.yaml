translation:
  language: ru
  text: 'Из сыновей Бевая[a]: Захария, сын Бевая, и с ним двадцать восемь мужчин.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «сыновья Бевая» может иметь более широкое значение: потомки или представители рода Бевая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Из сыновей
  rationale: Буквально передаёт еврейскую формулу списка; в данном родословном контексте «сыновья» может обозначать также потомков или представителей рода.
- source_word: בֵבַי
  choice: Бевая
  rationale: Имя בֵבַי передано принятой русской библейской формой «Бевай»; родительный падеж — «Бевая».
- source_word: זְכַרְיָה
  choice: Захария
  rationale: Употреблена традиционная и узнаваемая русская форма личного имени.
- source_word: בֶּן
  choice: сын
  rationale: В непосредственной патронимической конструкции это естественное и точное соответствие.
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Сохраняет соединительный союз и указывает на сопровождавших Захарию.
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: двадцать восемь
  rationale: Прямое и естественное обозначение количества по-русски.
- source_word: הַזְּכָרִים
  choice: мужчин
  rationale: Еврейское слово указывает на лиц мужского пола. В русском перечне людей «мужчин» звучит естественнее, чем формально точное, но канцелярское «лиц мужского пола»; возможное различие по возрасту здесь не подчёркивается.
