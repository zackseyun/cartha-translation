  text: Всё было пересчитано и взвешено, и общий вес был записан тогда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: пересчитано
  rationale: Существительное מִסְפָּר означает «число, счёт»; в данном контексте русское «пересчитано» естественно передаёт проверку количества переданных ценностей.
- source_word: בְּמִשְׁקָל
  choice: взвешено
  rationale: מִשְׁקָל означает «вес»; в паре с проверкой количества глагольная передача «взвешено» ясна и естественна по-русски.
- source_word: לַכֹּל
  choice: всё
  rationale: Оборот указывает, что подсчёт и взвешивание охватывали всё переданное имущество.
- source_word: וַיִּכָּתֵב
  choice: был записан
  rationale: Форма нифаля от כתב имеет пассивное значение «был написан»; «был записан» точно соответствует административному контексту.
- source_word: כָּל הַמִּשְׁקָל
  choice: весь вес
  rationale: Буквально «весь вес». Такая формулировка сохраняет выражение оригинала и может обозначать полный результат взвешивания, не уточняя сверх текста способ его сведения.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Прямо передаёт временное выражение с указательным компонентом «то».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая административная формулировка сохраняет последовательность проверки и записи. «Пересчитано и взвешено» естественно передаёт еврейские предложные обороты, а «весь вес» удерживает буквальную широту כָּל הַמִּשְׁקָל.
