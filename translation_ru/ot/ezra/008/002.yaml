  rationale: Традиционная русская библейская форма личного имени.
- source_word: דָּנִיֵּאל
  choice: Даниил
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: דָוִיד
  choice: Давид
  rationale: Устоявшаяся русская библейская форма имени; здесь оно указывает на род Давида.
- source_word: חַטּוּשׁ
  choice: Хаттуш
  rationale: Передача личного имени, близкая к еврейскому звучанию и согласующаяся с современными русскими библейскими формами.
