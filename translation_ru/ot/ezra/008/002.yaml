lexical_decisions:
- source_word: מִבְּנֵי
  choice: из сыновей
  rationale: Сочетание предлога מִן с формой בְּנֵי обозначает принадлежность к роду в перечне вернувшихся. «Из сыновей» сохраняет повторяющуюся родословную формулу оригинала; по смыслу возможно «из потомков».
- source_word: פִינְחָס
  choice: Финеес
  rationale: Традиционная русская библейская форма личного имени.
- source_word: גֵּרְשֹׁם
  choice: Гирсом
  rationale: Традиционная русская библейская форма личного имени.
- source_word: אִיתָמָר
