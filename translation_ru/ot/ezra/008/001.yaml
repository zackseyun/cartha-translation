lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Естественно вводит новый перечень и передаёт указательно-связующую функцию выражения без добавления временного «теперь».
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: главы их родовых домов
  rationale: Сохраняет метафору «глав» и передаёт אבות как патрилинейные семейно-родовые объединения, а не просто отдельных отцов.
- source_word: וְהִתְיַחְשָׂם
  choice: и родословная запись
  rationale: Термин обозначает генеалогическую запись или регистрацию; такая передача точнее абстрактного «родословие» и сохраняет административный оттенок.
- source_word: הָעֹלִים
  choice: тех, кто вышел
  rationale: В данном контексте עלה обозначает отправление из Вавилона в Иудею; русское «вышел» звучит естественно и не навязывает буквальное пространственное «поднялся».
- source_word: עִמִּי
  choice: со мной
  rationale: Прямая передача предлога с суффиксом первого лица; сохраняется повествование Ездры от первого лица.
- source_word: בְּמַלְכוּת
  choice: в царствование
  rationale: Идиоматически обозначает период правления монарха и соответствует формальному историческому регистру.
- source_word: אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: царя Артаксеркса
  rationale: Нормальная русская форма царского имени и естественная перестройка еврейского сочетания «Артаксеркс, царь».
- source_word: מִבָּבֶל
  choice: из Вавилона
  rationale: Стандартная передача исходной точки движения.
