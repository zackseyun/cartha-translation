  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: ru
  text: Будьте бдительны и оберегайте всё это, пока не взвесите всё это перед начальниками священников, левитами и главами родов Израиля[a] в Иерусалиме — в кладовых[b] дома Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главами отеческих домов Израиля», то есть руководителями родов или больших семей.'
    reason: cultural_note
  - marker: b
    text: 'Или: «в помещениях дома Яхве». Еврейское слово может обозначать комнаты или кладовые храмового комплекса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁקְדוּ וְשִׁמְרוּ
  choice: Будьте бдительны и храните всё это
  rationale: Два повелительных глагола передают соответственно неослабную внимательность и бережную охрану доверенных ценностей. «Всё это» естественно восстанавливает объект из предыдущего стиха.
- source_word: עַד תִּשְׁקְלוּ
  choice: пока не взвесите
  rationale: שׁקל обозначает взвешивание ценностей при их официальной передаче и проверке.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: начальниками священников
  rationale: Буквально речь идёт о руководителях священников; эта передача не смешивает их с позднейшим устойчивым обозначением «первосвященники».
- source_word: וְהַלְוִיִּם
  choice: левитами
  rationale: Прямое традиционное обозначение данной храмовой группы.
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: и главами родов Израиля
  rationale: Еврейское выражение обозначает руководителей отеческих, то есть родовых, домов; «главы родов» понятно современному читателю и сохраняет общественную структуру текста.
- source_word: הַלִּשְׁכוֹת
  choice: в кладовых
  rationale: В данном контексте храмовые помещения служат местом приёма и хранения передаваемых ценностей, поэтому контекстуальное «кладовые» точнее общего «комнаты».
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохраняется образ «дома» и личное имя Бога, представленное тетраграмматоном.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Синтаксическая связь הַלִּשְׁכוֹת
  choice: «в кладовых» как место взвешивания в Иерусалиме
  alternative: Понимать как отдельное или присоединённое наименование помещений без явной синтаксической связи
  rationale: Форма исходного текста синтаксически шероховата, но по контексту помещения дома Яхве естественно обозначают место официального взвешивания. Тире сохраняет некоторую присоединённость фразы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Императивы сохранены; канцелярская тяжеловесность уменьшена. Тире перед обстоятельством места отражает присоединённый характер заключительной еврейской фразы.
