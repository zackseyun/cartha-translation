  text: וּ/בַ/יּ֣וֹם הָ/רְבִיעִ֡י נִשְׁקַ֣ל הַ/כֶּסֶף֩ וְ/הַ/זָּהָ֨ב וְ/הַ/כֵּלִ֜ים בְּ/בֵ֣ית אֱלֹהֵ֗י/נוּ עַ֠ל יַד מְרֵמ֤וֹת בֶּן אֽוּרִיָּה֙ הַ/כֹּהֵ֔ן וְ/עִמּ֖/וֹ אֶלְעָזָ֣ר בֶּן פִּֽינְחָ֑ס וְ/עִמָּ/הֶ֞ם יוֹזָבָ֧ד בֶּן יֵשׁ֛וּעַ וְ/נֽוֹעַדְיָ֥ה בֶן בִּנּ֖וּי הַ/לְוִיִּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: ru
  text: На четвёртый день серебро, золото и утварь[b] были взвешены в доме нашего Бога и переданы под ответственность[a] священника Меремофа, сына Урии. С ним был Елеазар, сын Финееса, а с ними — левиты Иозавад, сын Иешуа, и Ноадия, сын Виннуя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переданы в руки священника Меремофа, сына Урии». Буквально еврейская идиома означает «в руку».'
    reason: lexical_alternative
  - marker: b
    text: То есть храмовые сосуды и другие предметы храмовой утвари.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: На четвёртый день
  rationale: Естественно передаёт временное продолжение повествования, не добавляя отсутствующего в еврейском тексте уточнения «после этого».
- source_word: נִשְׁקַל
  choice: были взвешены
  rationale: Форма нифаля выражает пассивное действие. Хотя еврейский глагол стоит в единственном числе, русское согласование с однородными подлежащими требует множественного числа.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: серебро, золото и утварь
  rationale: «Утварь» уместна в храмовом контексте и обозначает сосуды и другие предметы, предназначенные для богослужения.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: в доме нашего Бога
  rationale: Сохраняет буквальный образ еврейского выражения и его религиозный тон; по контексту речь идёт о храме.
- source_word: עַל יַד
  choice: переданы в руки
  rationale: Еврейская идиома обозначает вручение под ответственное попечение. Формулировка сохраняет образ «руки», а добавление «переданы» делает административное действие ясным по-русски.
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: священника Меремофа, сына Урии
  rationale: Определение «священник» по контексту относится к Меремофу; порядок слов выбран ради ясного современного русского синтаксиса.
- source_word: וְעִמּוֹ אֶלְעָזָר בֶּן פִּינְחָס
  choice: С ним был Елеазар, сын Финееса
  rationale: Сохраняет координацию исходного текста и ясно обозначает сопровождавшего Меремофа человека.
- source_word: יוֹזָבָד בֶּן יֵשׁוּעַ וְנוֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: левиты Иозавад, сын Иисуса, и Ноадия, сын Виннуя
  rationale: Заключительное множественное «левиты» относится к двум последним названным лицам. В русском языке постановка определения перед именами устраняет возможную синтаксическую неясность.
