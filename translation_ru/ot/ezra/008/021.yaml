source:
  edition: WLC
  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: ru
  text: Там, у реки Агавы, я объявил пост, чтобы нам смириться перед нашим Богом[a] и просить у Него прямого пути[b] для нас, наших детей[c] и всего нашего имущества.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергнуть себя лишениям». Еврейское выражение обозначает самоограничение и смирение, особенно в посте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верного пути»; в данном контексте выражение может также подразумевать благополучное путешествие. Буквально: «прямого пути».'
    reason: alternative_reading
  - marker: c
    text: Еврейское слово может обозначать малых детей или зависимых членов семьи.
    reason: lexical_scope
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: я объявил
  rationale: В данном контексте קרא означает публично объявить о посте; повествовательный союз естественно передан порядком и связностью русского предложения без отдельного «тогда».
- source_word: צוֹם
  choice: пост
  rationale: Существительное обозначает установленное соблюдение поста; «объявил пост» — естественное современное русское сочетание.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: у реки Агавы
  rationale: Предлог עַל при названии реки указывает на местонахождение у реки. Название передано принятой русской библейской формой «Агава».
- source_word: לְהִתְעַנּוֹת
  choice: чтобы нам смирить себя
  rationale: Форма хитпаэль глагола ענה в контексте поста выражает добровольное самоумаление, смирение и воздержание пред Богом; перевод сохраняет религиозный смысл, не создавая впечатления намеренного причинения себе вреда.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: пред нашим Богом
  rationale: Краткая и достойная передача устойчивого выражения о положении человека перед Богом.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: просить у Него
  rationale: בקש с מִן здесь обозначает обращённую к Богу просьбу. Русское «просить у Него» естественнее буквального «искать у Него» и сохраняет смысл молитвенной зависимости.
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: прямого пути
  rationale: Буквально — «прямой путь». Формулировка сохраняет образ и не сужает его до одной лишь безопасности в дороге.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: для нас, наших детей и всего нашего имущества
  rationale: טף обозначает малых детей либо зависимых членов семьи, особенно уязвимых в пути; רְכוּשׁ — имущество и пожитки. Выбранная формулировка ясна современному читателю.
theological_decisions:
- issue: Значение לְהִתְעַנּוֹת в связи с постом
  choice: смирить себя пред нашим Богом
  alternative: изнурить себя / подвергнуть себя лишениям пред нашим Богом
  rationale: Еврейское выражение включает самоограничение и смирение в посте. Основной перевод передаёт духовную направленность действия, а сноска сохраняет более буквальную сторону выражения, не вводя учения о самоповреждении.
- issue: Значение דֶּרֶךְ יְשָׁרָה
  choice: прямой путь
  alternative: верный путь / благополучное путешествие
  rationale: Контекст допускает просьбу о безопасной дороге, но сама еврейская метафора шире и может включать правильное направление и Божье водительство; поэтому она сохранена без сужения смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Форма «пред нашим Богом» сохраняет достоинство и ритм, оставаясь понятной. Синтаксис следует движению еврейской фразы, но не воспроизводит его механически.
