  rationale: Сохраняет предлог מִן («из») и обычное для родословных обозначение рода через «сыновей», не сводя его к более общему слову «потомки».
- source_word: פַּחַת מוֹאָב
  choice: Пахат-Моава
  rationale: Передаёт составное собственное имя транслитерацией; форма родительного падежа естественна после «сыновей».
- source_word: אֶלְיְהוֹעֵינַי
  choice: Элиегоэнай
  rationale: Транслитерация личного имени с учётом еврейских согласных и огласовки.
- source_word: בֶּן זְרַחְיָה
  choice: сын Зерахии
  rationale: Прямо передаёт указанное в тексте родство и естественно звучит в русском перечне.
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Сохраняет как союз, так и указание на людей, сопровождавших названного главу рода.
- source_word: מָאתַיִם
  choice: двести
  rationale: Прямая передача количественного числительного.
- source_word: הַזְּכָרִים
  choice: мужчин
  rationale: Естественное русское обозначение лиц мужского пола в списке; более узкое значение еврейского слова пояснено в сноске.
