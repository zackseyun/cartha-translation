base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: ru
  text: Я собрал их у реки, текущей к Ахаве[a], и мы стояли там лагерем три дня. Я осмотрел народ и священников, но никого из сыновей Левия там не нашёл.
  philosophy: optimal-equivalence
  footnotes:
