    text: 'Или: «у канала, ведущего к Ахаве». В этом контексте еврейское слово может обозначать как реку, так и искусственный водный путь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: Я собрал их
  rationale: Глагол קבץ означает «собирать, созывать»; этот перевод естественен по-русски и сохраняет активную роль Ездры.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: у реки, текущей к Ахаве
  rationale: נָהָר обычно обозначает реку, но в месопотамском контексте может означать канал; причастие הַבָּא передано естественным выражением «текущей к».
- source_word: וַנַּחֲנֶה
  choice: мы стояли там лагерем
  rationale: חנה означает располагаться или стоять лагерем. Такая формулировка передаёт длительное пребывание в течение трёх дней.
- source_word: וָאָבִינָה
  choice: Я осмотрел
  rationale: В данном контексте форма от בין выражает внимательное рассмотрение состава собравшейся группы; «осмотрел» передаёт практический смысл проверки.
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: народ и священников
  rationale: Прямой и естественный перевод двух названных групп; предлог ב при глаголе внимательного рассмотрения по-русски отдельно не воспроизводится.
- source_word: וּמִבְּנֵי לֵוִי לֹא מָצָאתִי שָׁם
  choice: но никого из сыновей Левия там не нашёл
  rationale: Сохраняется родословное выражение «сыны Левия», а отрицательная конструкция передаётся естественным русским оборотом «никого… не нашёл».
