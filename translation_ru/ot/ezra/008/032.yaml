lexical_decisions:
- source_word: וַנָּבוֹא
  choice: Итак, мы пришли
  rationale: Форма wayyiqtol от בוא продолжает последовательность повествования. «Пришли» передаёт основное значение глагола, а «итак» естественно связывает прибытие с предшествующим рассказом.
- source_word: יְרוּשָׁלִָם
  choice: в Иерусалим
  rationale: Употреблена общепринятая русская форма названия города; предлог «в» требуется русским глаголом движения.
- source_word: וַנֵּשֶׁב
  choice: и пробыли
  rationale: Глагол ישב может означать «сидеть», «жить», «оставаться». В контексте завершившегося путешествия и указанного срока «пробыли» ясно выражает временное пребывание.
- source_word: שָׁם
  choice: там
  rationale: Естественное русское соответствие наречию места, отсылающему к Иерусалиму.
- source_word: יָמִים שְׁלֹשָׁה
  choice: три дня
  rationale: Сочетание обозначает продолжительность времени; с глаголом «пробыли» по-русски естественно употребляется без дополнительного предлога.
