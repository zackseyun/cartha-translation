base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: ru
  text: И я отвесил им серебро, золото и сосуды — приношение[a] для дома нашего Бога, которое пожертвовали царь, его советники, его сановники и все присутствовавшие израильтяне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пожертвование». Еврейское слово обозначает дар, отделённый для священного употребления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  choice: И я отвесил им
  rationale: Глагол שקל прямо обозначает взвешивание; дательный оборот передаёт передачу взвешенных ценностей назначенным хранителям.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: серебро, золото
  rationale: В перечне храмовых ценностей כֶּסֶף означает металл, а не деньги; русские названия материалов естественно употребляются без артиклевой определённости.
- source_word: הַכֵּלִים
  choice: сосуды
  rationale: В храмовом контексте традиционное и точное «сосуды» передаёт предметы и принадлежности без неоправданного уточнения их назначения.
- source_word: תְּרוּמַת בֵּית אֱלֹהֵינוּ
  choice: приношение для дома нашего Бога
  rationale: «Приношение» передаёт дар, отделённый для священного употребления, а «дом нашего Бога» сохраняет образность еврейского выражения, относящегося к храму.
- source_word: הֵרִימוּ
  choice: пожертвовали
  rationale: В хифиле глагол буквально связан с поднятием или вознесением, но здесь идиоматически означает предоставление священного дара; «пожертвовали» естественно выражает совершённое действие доноров.
- source_word: יֹעֲצָיו וְשָׂרָיו
  choice: его советники, его вельможи
  rationale: «Советники» непосредственно передаёт יֹעֲצָיו; в персидском придворно-административном контексте «вельможи» обозначает высокопоставленных שָׂרִים, не утверждая их царского происхождения.
- source_word: וְכָל יִשְׂרָאֵל הַנִּמְצָאִים
  choice: и все присутствовавшие израильтяне
  rationale: Еврейское собирательное «весь Израиль» с уточнением «находившиеся» естественно передано по-русски как совокупность присутствовавших израильтян.
theological_decisions:
- issue: Культовое значение תְּרוּמָה
  choice: приношение
  alternative: пожертвование; возношение
  rationale: «Приношение» сохраняет священную направленность дара, не вводя более узкого значения определённого жертвенного обряда; возможная семантика отделённого пожертвования отмечена в сноске.
- issue: Передача בֵּית אֱלֹהֵינוּ
  choice: дом нашего Бога
  alternative: храм нашего Бога
  rationale: Буквальный образ «дома» понятен в контексте и сохраняет формулировку источника, тогда как «храм» явно называет подразумеваемый референт.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Тире показывает, что «приношение» поясняет весь предшествующий перечень ценностей. Синтаксис сохраняет коллективный ряд дарителей, но избегает неестественного буквального оборота «весь Израиль, находившийся».
