base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: ru
  text: И из храмовых служителей[a], которых Давид и начальники назначили для левитского служения, было 220 человек; все они были указаны поимённо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. נְתִינִים (нетини́м) — специальное название группы храмовых служителей.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все они были внесены в список поимённо».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: храмовые служители
  rationale: Это техническое обозначение особой группы, связанной с храмовым служением; функциональный перевод понятен современному читателю и не смешивает их с левитами.
- source_word: שֶׁנָּתַן
  choice: которых … назначили
  rationale: Буквально глагол означает «дал», но здесь речь идёт о людях, предоставленных или определённых для исполнения служебных обязанностей; «назначили» естественно передаёт административный смысл.
- source_word: וְהַשָּׂרִים
  choice: начальники
  rationale: Слово обозначает лиц высокого положения или руководителей; «начальники» сохраняет широкий административный смысл без монархического оттенка слова «князья».
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: для служения левитам
  rationale: Формулировка близко передаёт конструкцию с עֲבֹדָה и сохраняет возможный смысл служебной помощи левитам, не уточняя сверх текста характер подчинения.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: Цифровая запись точно передаёт число и соответствует современной издательской практике.
- source_word: כֻּלָּם
  choice: все они
  rationale: Передаёт собирательное значение слова и местоименного суффикса.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: были названы поимённо
  rationale: Пассивная форма указывает на конкретное называние или обозначение каждого человека; перевод сохраняет эту административную определённость, не сводя выражение однозначно к письменному списку.
