    rationale: Конечный элемент יה в этом имени требует передачи «Шемаия»; форма «Шемая» неточно отражает исходное имя.
  - severity: low
    issue: «Людьми разумными» недостаточно естественно и несколько сужает смысл מְבִינִים.
    rationale: Слово характеризует Иоярива и Элнатана как понимающих, сведущих людей; «сведущими людьми» точнее и литературно естественнее.
