base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: ru
  text: Тогда я послал за Элиэзером, Ариэлем, Шемаией, Элнатаном, Яривом, Элнатаном, Натаном, Захарией и Мешулламом — главами[a], а также за Иояривом и Элнатаном — сведущими людьми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руководителями»; буквально: «головами».'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «людьми проницательными» или «людьми учёными».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Тогда я послал за
  rationale: Форма продолжает последовательность повествования. Русское «послал за» естественно передаёт вызов названных людей, а не отправку им чего-либо.
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: за Элиэзером ... за Элнатаном
  rationale: Повторяющийся предлог ל обозначает людей, которых Ездра вызвал; при русском «послал за» он передаётся предлогом «за» с творительным падежом.
- source_word: רָאשִׁים
  choice: главами
  rationale: 'Сохранён конкретный образ еврейского слова «головы» в его переносном значении: люди, занимавшие ведущее положение. Альтернатива пояснена в сноске.'
- source_word: מְבִינִים
  choice: людьми разумными
  rationale: Причастие от בין характеризует этих людей как обладающих пониманием и проницательностью, не утверждая более узкой официальной роли, например учителей.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: а также за Иояривом и Элнатаном — людьми разумными
  rationale: Заключительное приложение естественнее всего относится к двум последним именам и отличает их от предшествующей группы, названной главами.
- source_word: אֶלְנָתָן
  choice: Элнатан
  rationale: Имя передано одинаково во всех трёх случаях; повторение сохранено, поскольку оно присутствует в исходном тексте и, вероятно, обозначает разных людей с одним именем.
