base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: ru
  text: 'А из сыновей Адоникама — последние[a]; вот их имена: Елифелет, Иеиел и Шемаия, и с ними шестьдесят мужчин.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позднейшие». Еврейское слово, вероятно, обозначает последнюю группу из рода Адоникама, возможно в отличие от группы, упомянутой ранее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: А из сыновей
  rationale: Сохраняет буквальный образ еврейского выражения и связь со структурой перечня; в данном контексте «сыновья» может обозначать потомков или представителей рода.
- source_word: אֲדֹנִיקָם
  choice: Адоникама
  rationale: Личное имя передано принятой русской библейской транслитерацией и поставлено в родительный падеж по синтаксису фразы.
- source_word: אַחֲרֹנִים
  choice: последние
  rationale: 'Передаёт основное значение «последние, позднейшие», не устраняя неоднозначность: речь, вероятно, о последней группе потомков Адоникама.'
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: вот их имена
  rationale: Естественная русская формула введения перечня; подразумеваемая в еврейском связка не требует буквального воспроизведения.
- source_word: אֱלִיפֶלֶט
  choice: Елифелет
  rationale: Личное имя передано принятой русской библейской формой.
- source_word: יְעִיאֵל
  choice: Иеиел
  rationale: Личное имя транслитерировано в соответствии с русской библейской традицией.
- source_word: וּשְׁמַעְיָה
  choice: и Шемаия
  rationale: Личное имя транслитерировано; союз сохранён как естественное завершение перечисления.
- source_word: וְעִמָּהֶם
  choice: а с ними
  rationale: Передаёт сопровождение и естественно присоединяет число остальных участников группы; русское «а» здесь стилистически плавнее повторного «и».
- source_word: שִׁשִּׁים הַזְּכָרִים
  choice: шестьдесят мужчин
  rationale: Передаёт число и мужской пол участников без канцелярского оборота «лиц мужского пола».
