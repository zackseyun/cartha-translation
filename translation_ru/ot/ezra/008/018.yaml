base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: ru
  text: И благодаря благой руке нашего Бога, пребывавшей над нами[a], они привели к нам человека, наделённого разумением, из потомков Махли, сына Левия, сына Израиля, — Шеревию, его сыновей и братьев, всего восемнадцать человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поскольку благая рука нашего Бога была над нами». Еврейское выражение говорит о Божьем благоволении и попечении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: они привели
  rationale: Каузативная форма глагола בוא означает «привести» или «доставить». В данном контексте речь идёт о людях, поэтому «привели» звучит естественнее, чем «принесли».
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: по благой руке нашего Бога, бывшей над нами
  rationale: Перевод сохраняет характерный для Ездры образ Божьей руки как выражение благоволения и деятельного попечения; причастный оборот делает еврейскую конструкцию понятной по-русски.
- source_word: אִישׁ שֶׂכֶל
  choice: человека разумного
  rationale: Слово שֶׂכֶל указывает на разумение, рассудительность и проницательность. «Разумный» сохраняет широкий смысл и не сводит качество человека лишь к учёности или профессиональному умению.
- source_word: מִבְּנֵי מַחְלִי
  choice: из потомков Махли
  rationale: В родословном контексте בְּנֵי обозначает не только непосредственных сыновей, но и потомков; буквальное «из сыновей» в современном русском могло бы ошибочно сузить смысл.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: сына Левия, сына Израиля
  rationale: Сохранена повторяющаяся родословная формула оригинала и связь Махли с коленом Левия и Израилем.
- source_word: וְשֵׁרֵבְיָה
  choice: — Шеревию
  rationale: Имя понято как приложение, уточняющее, кто именно был назван «человеком разумным». Тире естественно передаёт это отношение в русском синтаксисе.
- source_word: וּבָנָיו וְאֶחָיו
  choice: его сыновей и братьев
  rationale: Местоимение относится к Шеревии; семейные отношения переданы прямо и без пояснительных добавлений.
- source_word: שְׁמֹנָה עָשָׂר
  choice: всего восемнадцать человек
  rationale: Слово «всего» ясно связывает число со всей названной группой, а «человек» восполняет подразумеваемое существительное, необходимое для естественного русского выражения.
theological_decisions:
- issue: Передача образного выражения о Божьей руке
  choice: по благой руке нашего Бога, бывшей над нами
  alternative: поскольку благая рука нашего Бога была над нами
  rationale: Основной вариант сохраняет метафору руки и допускает смысл Божьего благоволения и действенного попечения, не заменяя его отвлечённым богословским термином.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Родословная формула сохранена, тогда как «сыновья Махли» передано как «потомки Махли» во избежание ложного впечатления о непосредственном родстве.
