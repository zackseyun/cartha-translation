base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: ru
  text: 'Мне было стыдно просить у царя войско и всадников для защиты от врага в пути[a], ведь мы сказали царю: «Рука нашего Бога — над всеми, кто ищет Его, им во благо[b], а Его сила и гнев — против всех, кто оставляет Его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод: «от врага в дороге». Здесь имеется в виду военная защита во время пути.'
    reason: lexical_alternative
  - marker: b
    text: «Рука нашего Бога» — древнееврейский образ Его деятельной силы и благоволения.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: мне было стыдно
  rationale: Глагол выражает стыд, а не просто неловкость; безличная русская конструкция естественно передаёт состояние говорящего.
- source_word: חַיִל וּפָרָשִׁים
  choice: войско и всадников
  rationale: חַיִל здесь означает предоставляемую царём вооружённую силу, а פָרָשִׁים — конных воинов. Такое сочетание ясно и не предполагает непременно всю царскую армию.
- source_word: לְעָזְרֵנוּ מֵאוֹיֵב בַּדָּרֶךְ
  choice: для защиты от врага в пути
  rationale: Буквально речь идёт о помощи «от врага»; в контексте просьбы о войске естественный русский оборот уточняет защитный характер этой помощи, не меняя смысла.
- source_word: יַד אֱלֹהֵינוּ
  choice: Рука нашего Бога
  rationale: Сохранён древнееврейский образ руки как деятельной силы и благоволения Бога, а не заменён отвлечённым понятием.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: над всеми, кто ищет Его, им во благо
  rationale: Формулировка сохраняет и пространственный образ עַל при слове «рука», и целевое значение לְטוֹבָה — благотворное действие для ищущих Бога.
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: Его сила и гнев
  rationale: 'Два сочинённых существительных переданы раздельно: речь одновременно о Божьей мощи и Его гневе.'
- source_word: עַל כָּל עֹזְבָיו
  choice: против всех, кто оставляет Его
  rationale: עזב обозначает оставление Бога и разрыв верности Ему; «оставляет» понятно современному читателю и сохраняет relationalный смысл без архаизма «покидает/оставляет завет».
theological_decisions:
- issue: Антропоморфный образ יַד אֱלֹהֵינוּ
  choice: Сохранить выражение «Рука нашего Бога».
  alternative: Передать как «сила нашего Бога» или «благоволение нашего Бога».
  rationale: Исходный текст не сводит образ только к силе или только к благоволению. Сохранение метафоры удерживает полноту Божьего деятельного присутствия, а продолжение фразы поясняет его благой характер.
- issue: Соотношение Божьей силы и гнева в וְעֻזּוֹ וְאַפּוֹ
  choice: 'Передать как два самостоятельных понятия: «Его сила и гнев».'
  alternative: 'Объединить в одно выражение: «Его могучий гнев».'
  rationale: В еврейском тексте стоят два однородных существительных. Их раздельная передача сохраняет напряжение между Божьей действенной мощью и Его гневом.
- issue: Объект Божьего противодействия в עֹזְבָיו
  choice: «все, кто оставляет Его»
  alternative: «все, кто отступает от Него» или «все, кто покидает Его».
  rationale: Перевод не уточняет сверх текста, идёт ли речь исключительно о заветном отступничестве, и сохраняет общий relationalный смысл оставления Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для обычного читателя; ключевой древнееврейский образ «руки» сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
