base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: ru
  text: 'Я послал их к Иддо, начальнику в местности Касифья, и дал им слова, чтобы они передали Иддо и его братьям[c] — храмовым служителям[a] в местности Касифья: пусть приведут нам служителей[b] для дома нашего Бога.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально название этой группы можно понять как «отданные»; традиционно их называют нефинеями. Это была особая группа людей, назначенных для служения при храме.
    reason: lexical_alternative
  - marker: b
    text: Здесь «служители» — люди, исполняющие служение при храме; слово не обязательно обозначает носителей поздней формальной религиозной должности.
    reason: cultural_note
  - marker: c
    text: Еврейский текст здесь труден. По контексту речь, вероятно, идёт об Иддо и его собратьях; форма слова сама по себе может быть понята и как «его брату».
    reason: textual_ambiguity
lexical_decisions:
- source_word: וָאֹוצִיאָה
  choice: Я послал
  rationale: Каузативная форма от יצא в контексте поручения посланцам означает «велел отправиться, послал»; буквальное «вывел» здесь звучало бы неестественно.
- source_word: אִדּוֹ הָרֹאשׁ
  choice: Иддо, начальнику
  rationale: רֹאשׁ буквально означает «глава» и здесь обозначает человека, стоящего во главе местной группы. «Начальник» ясно передаёт должностной смысл, не уточняя характер власти сверх текста.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: в местности Касифья
  rationale: Так сохраняется существительное מָקוֹם («место, местность») и одновременно получается естественное русское обозначение географического пункта.
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  choice: и вложил в их уста слова
  rationale: Сохранён выразительный еврейский образ передачи посланцам точного поручения; продолжение разъясняет его смысл современному читателю.
- source_word: אֶל אִדּוֹ אָחִיו
  choice: Иддо и его братьям
  rationale: Множественное число следующего определения и общий синтаксис стиха позволяют понимать выражение как обращение к Иддо вместе с его собратьями. Трудность формы אָחִיו отмечена в сноске, а альтернативное чтение не скрыто.
- source_word: הַנְּתוּנִים
  choice: храмовым служителям
  rationale: В книгах Ездры и Неемии это название особой группы людей, отданных для храмовой службы. Функциональный перевод понятнее транслитерации «нефинеи», которая приводится в сноске.
- source_word: מְשָׁרְתִים
  choice: служителей
  rationale: Причастие от שרת обозначает людей, исполняющих служение при святилище. Более общее слово отличает требуемых работников от названной ранее особой группы храмовых служителей, хотя в русском корни неизбежно совпадают.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: для дома нашего Бога
  rationale: Сохранено библейское выражение «дом Бога», а не заменено истолковывающим словом «храм».
theological_decisions:
- issue: Передача названия הַנְּתוּנִים
  choice: храмовые служители
  alternative: нефинеи; отданные
  rationale: Функциональное обозначение передаёт историческую роль группы без привнесения поздней церковной должности; традиционное название сохранено в примечании.
- issue: Различение הַנְּתוּנִים и מְשָׁרְתִים
  choice: «храмовые служители» для особой группы и «служители» для искомых работников
  alternative: нефинеи и прислужники; храмовые рабы и служители
  rationale: Текст, вероятно, различает признанную группу и более общее обозначение необходимых для дома Бога людей. Выбор не превращает последних в носителей поздней формальной церковной должности.
- issue: Число и синтаксис אָחִיו
  choice: Иддо и его братьям
  alternative: Иддо, его брату
  rationale: Множественное определение הַנְּתוּנִים и контекст группы адресатов поддерживают множественное понимание, но вокализация אָחִיו допускает формально единственное «его брату»; неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Образ «вложил в их уста слова» сохранён как понятный и выразительный семитизм; географическая формула передана естественно как «в местности Касифья». Термины храмовой службы сформулированы без поздней конфессиональной окраски.
