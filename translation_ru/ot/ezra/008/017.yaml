  terminology: «Храмовые служители» уместно передаёт נתינים как особую группу; «служителей» для משרתים сохраняет различение, хотя лексическая близость неизбежна. «Дом нашего Бога» точно сохраняет библейское выражение. Сноска о нефинеях полезна. Примечание к «его братьям» корректно сохраняет отмеченную в данных традиции неоднозначность, не выдавая одно решение за несомненное.
