  verdict: revise
  source_fidelity: 'Основной смысл передан точно: посланцы направлены к Иддо в Касифье, им дано поручение обратиться к Иддо и связанным с ним храмовым служителям, чтобы те привели людей для дома Бога. Однако «вложил в их уста слова, которые они должны были сказать» несколько тяжеловесно и ослабляет целевую конструкцию оригинала; более прямое «дал им слова, чтобы они передали…» ясно сохраняет образ и синтаксическую связь поручения.'
