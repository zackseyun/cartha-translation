  text: וּ/מִ/בְּנֵ֣י עֵילָ֔ם יְשַֽׁעְיָ֖ה בֶּן עֲתַלְיָ֑ה וְ/עִמּ֖/וֹ שִׁבְעִ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/007.yaml
  text: 'And from the sons of Elam: Jeshaiah son of Athaliah[a], and with him seventy males.'
translation:
  language: ru
  text: 'И из сыновей Елама: Иешая, сын Атальи, и с ним семьдесят мужчин[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лиц мужского пола».'
    reason: Еврейское слово прямо указывает на мужской пол; в основном тексте употреблено более естественное русское «мужчин».
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: И из сыновей
  rationale: Сохраняет соединительный союз и родословную формулу перечня; здесь «сыновья» обозначают представителей рода Елама, а не обязательно его непосредственных детей.
- source_word: עֵילָם
  choice: Елама
  rationale: Передача имени собственного в форме, привычной для русской библейской традиции.
- source_word: יְשַׁעְיָה
  choice: Иешая
  rationale: Транслитерация еврейского личного имени, отличающая исходную форму от более привычной русской формы имени пророка Исаии.
- source_word: בֶּן
  choice: сын
  rationale: В непосредственной патронимической конструкции это точная и естественная передача.
- source_word: עֲתַלְיָה
  choice: Атальи
  rationale: Транслитерация еврейского личного имени с естественным русским склонением.
- source_word: וְ/עִמּ/וֹ
  choice: и с ним
  rationale: 'Передаёт и союз, и значение сопровождения, сохраняя структуру перечня: названный глава и число сопровождавших его.'
- source_word: שִׁבְעִים
  choice: семьдесят
  rationale: Прямая передача количественного числительного.
- source_word: הַ/זְּכָרִים
  choice: мужчин
  rationale: В данном учётном перечне естественное русское «мужчин» сохраняет указание на мужской пол без канцелярского оборота «лиц мужского пола».
