    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Из сыновей
  rationale: Буквально сочетает союз, предлог и слово «сыновья». В данном родословно-списочном контексте выражение может обозначать более широкую родовую линию; союз не передан отдельно, поскольку начальное «и из» в изолированном русском стихе звучит тяжеловесно, а связь с перечнем сохраняется самой конструкцией.
- source_word: שְׁפַטְיָה
  choice: Сафатии
  rationale: Традиционная и узнаваемая русская передача личного имени в форме родительного падежа.
- source_word: זְבַדְיָה
  choice: Зевадия
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: בֶּן
  choice: сын
  rationale: При имени названного отца обычное непосредственное значение «сын» наиболее естественно и точно.
- source_word: מִיכָאֵל
  choice: Михаила
  rationale: Устоявшаяся русская передача имени с необходимым родительным падежом.
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: 'Сохраняет союз и структуру записи: назван предводитель, затем сопровождавшая его группа.'
- source_word: שְׁמֹנִים
  choice: восемьдесят
  rationale: Прямое соответствие количественному числительному.
- source_word: הַזְּכָרִים
  choice: мужчин
  rationale: Естественное современное русское обозначение лиц мужского пола; в контексте перечня переселенцев оно точнее общего слова «людей» и менее канцелярское, чем «лиц мужского пола».
