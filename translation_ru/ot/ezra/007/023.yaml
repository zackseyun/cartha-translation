  rationale: 'Правка сохраняет смысл и официальный регистр, но точнее передаёт два нюанса арамейского текста: тщательность исполнения и предупреждение о возможном гневе без добавления образа гнева, «постигающего» адресата. Сноски сохранены у соответствующих фраз и уточнены в соответствии с буквальной конструкцией источника.'
