  source_fidelity: 'Основной смысл передан верно: всеохватное распоряжение Бога небес, его тщательное исполнение для Его дома и предупреждение о гневе на царское царство и сыновей сохранены. Однако «гнев не постиг» несколько конкретизирует исходное «быть/возникнуть гневу на», представляя гнев как событие, постигающее адресата. Более нейтральная конструкция точнее сохраняет образ и синтаксическую неопределённость оригинала.'
