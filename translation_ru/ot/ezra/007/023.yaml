  terminology: «Бог небес» и «дом Бога небес» удачно сохраняют библейский титул и исходное обозначение храма. Сноска к «дому Бога небес» уместна. Формулировка альтернативы в сноске должна отражать «на царство», а не более интерпретирующее «против царства».
