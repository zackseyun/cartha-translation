source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: ru
  text: Всё, что повелено Богом небес, пусть будет со всем усердием исполнено для дома Бога небес[a], чтобы не было гнева на царство царя и его сыновей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «домом Бога небес» подразумевается храм.
    reason: cultural_note
  - marker: b
    text: 'Или, более буквально: «ибо зачем быть гневу на царство царя и его сыновей?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: Всё, что
  rationale: Передаёт всеохватное значение арамейского относительного оборота естественным современным русским языком.
- source_word: מִן טַעַם אֱלָהּ שְׁמַיָּא
  choice: повелено Богом небес
  rationale: טַעַם в административном контексте означает повеление или указ, а מִן указывает на источник. Пассивная конструкция точно и естественно передаёт смысл.
- source_word: יִתְעֲבֵד
  choice: пусть будет исполнено
  rationale: Пассивный имперфект здесь имеет побудительную силу; формулировка сохраняет официальный тон распоряжения.
- source_word: אַדְרַזְדָּא
  choice: неукоснительно
  rationale: Редкое административное наречие выражает тщательность, точность и усердие при исполнении; «неукоснительно» естественно передаёт обязательность точного исполнения.
- source_word: לְבֵית אֱלָהּ שְׁמַיָּא
  choice: для дома Бога небес
  rationale: Сохранён исходный образ «дома», хотя по контексту речь идёт о храме; предлог передан как указание на то, ради чего исполняется распоряжение.
- source_word: דִּי לְמָה
  choice: чтобы … не
  rationale: В контексте оборот вводит предупреждение о нежелательном последствии. Более буквальная риторическая формулировка приведена в примечании.
- source_word: לֶהֱוֵא קְצַף
  choice: гнев не постиг
  rationale: Буквально говорится о возникновении или наличии гнева; русский глагол «постиг» естественно выражает угрозу гнева, направленного на царство и царскую семью.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: царство царя
  rationale: 'Сохранены оба существительных оригинала: речь идёт о владении или державе царя, а не только о нём лично.'
- source_word: וּבְנוֹהִי
  choice: и его сыновей
  rationale: Это прямое значение слова; возможный династический оттенок не требует замены на более широкое «потомков».
theological_decisions:
- issue: Обозначение храма выражением בֵית אֱלָהּ שְׁמַיָּא
  choice: дом Бога небес
  alternative: храм Бога небес
  rationale: Основной текст сохраняет метафору оригинала и не подменяет её контекстуальным истолкованием; значение поясняется в примечании.
- issue: Передача предупреждения דִּי לְמָה לֶהֱוֵא קְצַף
  choice: чтобы гнев не постиг
  alternative: ибо зачем гневу быть против царства царя и его сыновей?
  rationale: Основной вариант ясно передаёт предупредительно-целевую силу высказывания, а примечание сохраняет возможность понимать форму как риторический вопрос.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского указа. Сочетание «Бог небес» сохранено как устойчивый библейский титул; «неукоснительно исполнено» поддерживает административный регистр без архаизации.
