source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: ru
  text: 'Вот копия документа[a], который царь Артаксеркс дал священнику Ездре, книжнику, знатоку слов заповедей Яхве и Его постановлений для Израиля[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «текст письма», «список с документа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «об Израиле», «в отношении Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: копия документа
  rationale: Сочетание обозначает копию или текст официального письменного документа. Такой перевод естественен по-русски и не сужает значение до частного письма.
- source_word: וְזֶה
  choice: Вот
  rationale: «Вот» естественно вводит приводимый далее официальный текст и передаёт указательное значение זֶה; начальный союз не выражен отдельно, поскольку в русском он здесь необязателен.
- source_word: נָתַן
  choice: дал
  rationale: Сохранено основное значение глагола без уточняющей официально-деловой перефразировки вроде «выдал» или «даровал».
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: царь Артаксеркс
  rationale: Титул переведён, личное имя передано в принятой русской библейской форме.
- source_word: הַכֹּהֵן
  choice: священнику
  rationale: Прямое обозначение священнического служения Ездры.
- source_word: הַסֹּפֵר סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה
  choice: книжнику, сведущему в словах заповедей Яхве
  rationale: Первое סֹפֵר передано названием должности «книжник», а повторное — естественной русской характеристикой его компетентности. Это сохраняет пояснительную функцию повтора, не создавая тяжеловесного «книжнику, книжнику слов».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, а не заменяющий его титул.
- source_word: וְחֻקָּיו
  choice: и в Его постановлениях
  rationale: «Постановления» естественно передаёт חֻקִּים в контексте обязательных установлений; повтор предлога делает русскую связь с «сведущему» ясной.
- source_word: עַל יִשְׂרָאֵל
  choice: для Израиля
  rationale: Предлог עַל здесь, вероятно, указывает на адресованность или применимость заповедей и постановлений к Израилю, но допускает и иные оттенки.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Связь постановлений с Израилем в выражении עַל יִשְׂרָאֵל
  choice: для Израиля
  alternative: об Израиле; действующих в отношении Израиля
  rationale: Основной текст передаёт вероятную адресованность установлений Израилю, а примечание сохраняет более широкие возможные отношения, выражаемые предлогом עַל.
translation_notes:
  register: 'Современный литературный русский язык с умеренно официальным тоном, соответствующим введению к царскому документу. Сохранено двоеточие, поскольку далее следует текст документа. Аппозиции оформлены без добавочного союза: «священнику Ездре, книжнику…».'
