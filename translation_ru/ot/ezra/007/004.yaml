- source_word: בֶּן
  choice: сын
  rationale: В родословной форме сопряжённое существительное естественно передаётся словом «сын». Хотя библейские родословия иногда пропускают поколения, буквальная формула сохраняет структуру еврейского текста.
- source_word: זְרַחְיָה
  choice: Зерахии
  rationale: Личное имя передано принятой русской библейской формой «Зерахия» и поставлено в родительный падеж после слова «сын».
- source_word: עֻזִּי
  choice: Уззия
  rationale: Личное имя передано принятой русской библейской формой «Уззий»; родительный падеж — «Уззия».
- source_word: בֻּקִּי
  choice: Буккия
  rationale: Личное имя передано принятой русской библейской формой «Буккий»; родительный падеж — «Буккия».
