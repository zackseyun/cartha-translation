lexical_decisions:
- source_word: בֶּן
  choice: сын
  rationale: В родословии это наиболее прямое соответствие еврейскому слову; при этом בֶּן может обозначать и более отдалённого потомка, что отмечено в сноске.
- source_word: אֲבִישׁוּעַ
  choice: Авишуй
  rationale: Имя передано в принятой русской библейской форме; в конструкции родительного падежа — «Авишуя».
- source_word: פִּינְחָס
  choice: Финеес
  rationale: Использована устоявшаяся русская библейская форма имени; в родительном падеже — «Финееса».
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Использована устоявшаяся русская библейская форма имени; в родительном падеже — «Елеазара».
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Использована устоявшаяся русская библейская форма имени; в родительном падеже — «Аарона».
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: главный священник
  rationale: Так естественно передаётся сочетание «священник» и רֹאשׁ («глава, главный»), не подменяя его обычным еврейским выражением, буквально означающим «великий священник».
theological_decisions:
- issue: Передача священнического титула Аарона
  choice: главный священник
  alternative: первосвященник
  rationale: В исходном тексте стоит הַכֹּהֵן הָרֹאשׁ — буквально «священник, глава/главный», а не более обычное הַכֹּהֵן הַגָּדוֹל. Выбранный вариант сохраняет это лексическое различие, не отрицая традиционного понимания титула.
