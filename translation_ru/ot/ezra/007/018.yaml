base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: ru
  text: И всё, что тебе и твоим братьям покажется правильным[a] сделать с оставшимся серебром и золотом, делайте по воле вашего Бога.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что будет угодно тебе и твоим братьям». Арамейское выражение допускает более буквальную передачу: «что будет хорошо тебе и твоим братьям»; идиоматически: «что покажется правильным» или «что будет угодно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по желанию вашего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: А … поступите так
  rationale: Неопределённо-относительное значение передано естественной русской конструкцией, охватывающей любое решение о том, что сделать с остатком средств.
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: как покажется правильным тебе и твоим братьям
  rationale: Арамейская идиома с יטב и על обозначает то, что представляется хорошим или приемлемым кому-либо; перевод сохраняет совещательный оттенок разрешения.
- source_word: אַחַיִךְ
  choice: твоим братьям
  rationale: Сохранён буквальный термин родства; контекст может подразумевать соплеменников или соратников Ездры, но не требует сужения значения.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: с остальным серебром и золотом
  rationale: שְׁאָר указывает на оставшуюся часть ранее упомянутых серебра и золота; русская формулировка ясна и естественна.
- source_word: לְמֶעְבַּד
  choice: поступите
  rationale: Инфинитив עבד имеет широкое значение действия; в сочетании со средствами русское «поступить с» передаёт смысл естественнее буквального «сделать».
- source_word: כִּרְעוּת
  choice: по воле
  rationale: Слово означает волю, желание или угодное намерение; «по воле» соответствует официальному тону указа и не устраняет лексическую многозначность, отмеченную в сноске.
- source_word: אֱלָהֲכֹם
  choice: вашего Бога
  rationale: Речь идёт о Боге Ездры и его спутников; прописная буква обозначает конкретного референта.
- source_word: תַּעַבְדוּן
  choice: поступите
  rationale: Имперфект здесь выражает разрешение-предписание; повелительная форма естественно передаёт директивную силу в русском языке.
theological_decisions:
- issue: Написание обозначения אֱלָהֲכֹם
  choice: вашего Бога
  alternative: вашего бога
  rationale: Контекст конкретно указывает на Бога Ездры и его спутников; прописная буква отражает определённость референта, не добавляя конфессионального толкования.
- issue: Значение כִּרְעוּת применительно к Богу
  choice: по воле вашего Бога
  alternative: по желанию вашего Бога
  rationale: «Воля» уместна в официальном указе, тогда как возможное значение «желание» сохранено в примечании, чтобы не скрывать смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Перестройка предложения устраняет тяжеловесное буквальное «что покажется хорошим… сделать», сохраняя содержание и официальный характер царского разрешения. Маркеры сносок размещены после относящейся ко всему предписанию фразы.
