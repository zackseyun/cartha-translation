  source_fidelity: 'Смысл в целом передан верно: речь о свободе Ездры и его братьев распорядиться оставшимися серебром и золотом в согласии с волей их Бога. Однако исходная перестройка «поступите так ... — по воле вашего Бога» несколько размывает синтаксическую связь: в арамейском «что сделать с остатком средств» является содержанием решения, а заключительное предписание относится к совершению этого действия.'
  naturalness: Фраза понятна и выдержана в современном литературном регистре, но более прямой порядок слов естественнее и точнее передаёт структуру условно-относительного оборота.
  terminology: «Серебро и золото», «братья», «воля вашего Бога» уместны. Написание «Бог» с прописной буквы соответствует конкретному референту в контексте. Сноска к идиоме должна быть привязана к словам, которые она поясняет, а не к концу всего предложения.
  issues:
