revisions:
- from: А с остальным серебром и золотом поступите так, как покажется правильным тебе и твоим братьям, — по воле вашего Бога.[a][b]
  to: И всё, что тебе и твоим братьям покажется правильным[a] сделать с оставшимся серебром и золотом, делайте по воле вашего Бога.[b]
  rationale: Исправление сохраняет открытую формулу «всё, что», явно связывает «сделать» с распоряжением оставшимися средствами и передаёт заключительное распоряжение как «делайте по воле вашего Бога». Сноски сохранены по содержанию, а их маркеры поставлены у соответствующих выражений.
  reviewer_model: gpt-5.6-terra
