    issue: Синтаксическая перестройка ослабляет связь «что сделать с оставшимся серебром и золотом».
    rationale: В оригинале לְמֶעְבַּד («сделать») относится к тому, что покажется хорошим Ездре и его братьям, тогда как תַּעַבְדוּן составляет заключительное предписание. Формулировка с явным «сделать» сохраняет это членение.
  - severity: low
