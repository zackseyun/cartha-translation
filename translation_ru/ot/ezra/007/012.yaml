  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: ru
  text: 'Артаксеркс, царь царей, — Ездре, священнику, писцу закона[a] Бога небес: полный мир[b]. А теперь —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «писцу установления Бога небес» или «писцу указа Бога небес»; арамейское слово может означать закон, установление или указ.'
    reason: lexical_alternative
  - marker: b
    text: 'Это сжатая арамейская формула приветствия; более свободно: «приветствие». Слово «мир» не выражено отдельным словом в тексте, но традиционно восполняется в этой формуле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: Артаксеркс
  rationale: Общепринятая русская передача имени персидского царя.
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: царь царей
  rationale: Сохраняет имперский титул и конструкцию исходного текста, оставаясь естественным по-русски.
- source_word: לְעֶזְרָ֣א
  choice: Ездре
  rationale: Предлог לְ обозначает адресата письма; в русском это естественно передаётся дательным падежом.
- source_word: כָהֲנָא
  choice: священнику
  rationale: Определённая форма существительного обозначает должность Ездры; русская аппозиция согласована с именем в дательном падеже.
- source_word: סָפַר דָּתָא
  choice: писцу закона
  rationale: סָפַר означает «писец», а דָּתָא здесь вероятнее всего указывает на Божий закон, хотя возможно более широкое значение «установление, указ».
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: Бога небес
  rationale: Прямо передаёт родительное отношение и устойчивый библейский титул Бога.
- source_word: גְּמִיר
  choice: совершенный
  rationale: Передаёт значение полноты или совершенства в сжатой официальной формуле приветствия.
- source_word: וּכְעֶנֶת
  choice: А теперь —
  rationale: Официальная переходная формула вводит основную часть указа; тире показывает, что мысль продолжается в следующем стихе.
theological_decisions:
- issue: Значение דָּתָא при описании служения Ездры
  choice: закон
  alternative: установление (или указ)
  rationale: Связь с Богом небес и роль Ездры поддерживают значение Божьего закона, однако административное значение слова остаётся возможным и отмечено в сноске.
- issue: Передача сжатой формулы גְּמִיר וּכְעֶנֶת
  choice: совершенный мир. А теперь —
  alternative: приветствие. А теперь —
  rationale: Так сохраняются как буквальная идея полноты, так и переход к основной части письма, без чрезмерного сглаживания формулы.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного официального тона царского письма. Конструкция с тире отделяет отправителя от адресата, а конечное тире передаёт незавершённый переход к следующему стиху.
