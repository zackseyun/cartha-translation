  text: וַ/יָּבֹ֥א יְרוּשָׁלִַ֖ם בַּ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֑י הִ֛יא שְׁנַ֥ת הַ/שְּׁבִיעִ֖ית לַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/008.yaml
  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: ru
  text: И пришёл он в Иерусалим в пятом месяце[a] — это был седьмой год царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И прибыл он в Иерусалим в пятом месяце; это был седьмой год царя».'
    reason: Лексически возможен перевод וַיָּבֹא как «прибыл»; пунктуация также может яснее разделять сообщение о прибытии и датировку.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: И пришёл он
  rationale: Глагол בוא с последовательным וַ повествует о следующем событии. «Пришёл» прямо передаёт основное значение, не добавляя оттенка, хотя по-русски возможно и «прибыл».
- source_word: יְרוּשָׁלִַם
  choice: в Иерусалим
  rationale: Название города передано в принятой русской библейской форме; направление движения естественно выражено винительным падежом с предлогом «в».
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: в пятом месяце
  rationale: Предлог ב имеет временное значение; буквальное календарное обозначение ясно и естественно звучит по-русски.
- source_word: הִיא
  choice: это был
  rationale: Местоимение связывает указание месяца с датировкой по году царствования. «Это был» сохраняет пояснительную функцию и не вынуждает определять точный грамматический антецедент.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: седьмой год
  rationale: Сочетание в сопряжённой конструкции обозначает порядковый год царствования; это обычная русская форма датировки.
- source_word: לַמֶּלֶךְ
  choice: царя
  rationale: Предлог ל выражает отношение в формуле датировки, естественно передаваемое русским родительным падежом. Имя Артаксеркса не добавляется, поскольку в самом стихе его нет.
