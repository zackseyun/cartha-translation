  yaml_path: translation/ot/ezra/007/003.yaml
  text: son of Amariah[a], son of Azariah, son of Meraioth,
translation:
  language: ru
  text: сын Амарии[a], сын Азарии, сын Мераиофа,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейских родословиях слово «сын» может означать потомка по прямой линии, а не только непосредственного сына.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן
  choice: сын
  rationale: В родословном перечне בֶּן естественно передаётся традиционным словом «сын». В библейских родословиях оно может обозначать и более отдалённого потомка, поэтому примечание сохраняет жанровую широту значения.
- source_word: אֲמַרְיָה
  choice: Амария
  rationale: 'Личное имя передано принятой в русской библейской традиции формой; после слова «сын» употреблён родительный падеж: «Амарии».'
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Личное имя передано принятой русской библейской формой; в тексте стоит родительный падеж «Азарии».
- source_word: מְרָיוֹת
  choice: Мераиоф
  rationale: Имя транслитерировано с учётом традиционной русской библейской передачи; в тексте употреблён родительный падеж «Мераиофа».
