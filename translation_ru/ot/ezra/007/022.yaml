  source_fidelity: 'Перевод точно передаёт структуру арамейского административного перечня: повторяющееся עַד передано как «до», все количества сохранены, серебро и продукты названы без неоправданной конкретизации, а древние меры («таланты», «коры», «баты») не заменены предположительными современными эквивалентами. «Без установленного количества» адекватно передаёт דִּי לָא כְתָב как отсутствие записанной нормы, не превращая это в абсолютную безграничность.'
