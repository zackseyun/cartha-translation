source:
  edition: WLC
  text: עַד כְּסַף֮ כַּכְּרִ֣ין מְאָה֒ וְ/עַד חִנְטִין֙ כֹּרִ֣ין מְאָ֔ה וְ/עַד חֲמַר֙ בַּתִּ֣ין מְאָ֔ה וְ/עַד בַּתִּ֥ין מְשַׁ֖ח מְאָ֑ה וּ/מְלַ֖ח דִּי לָ֥א כְתָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/022.yaml
  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: ru
  text: до ста талантов серебра, до ста коров пшеницы, до ста батов вина, до ста батов масла, а соли — без установленного количества.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «соли, для которой не записано», то есть без указанного количества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: до
  rationale: В перечне предельных ассигнований слово указывает на максимальное количество; русское «до» естественно передаёт этот административный смысл.
- source_word: כְּסַף
  choice: серебро
  rationale: Назван именно металл, количество которого измеряется талантами; поэтому «серебро» точнее общего «деньги».
- source_word: כַּכְּרִין
  choice: таланты
  rationale: Сохранена древняя весовая единица без приблизительного пересчёта в современные меры.
- source_word: חִנְטִין
  choice: пшеница
  rationale: Арамейское слово обозначает именно пшеницу, а не зерно вообще.
- source_word: כֹּרִין
  choice: коры
  rationale: Сохранено название древней меры сыпучих тел; русская форма множественного числа после «ста» — «коров».
- source_word: חֲמַר
  choice: вино
  rationale: Прямое значение слова в перечне припасов для храмового служения.
- source_word: בַּתִּין
  choice: баты
  rationale: Сохранено название древней меры жидкостей; русская форма после «ста» — «батов».
- source_word: מְשַׁח
  choice: масло
  rationale: Исходный текст не уточняет вид масла, поэтому добавление «оливковое» не внесено.
- source_word: מְלַח
  choice: соль
  rationale: Прямое наименование последнего продукта в перечне.
- source_word: דִּי לָא כְתָב
  choice: без установленного количества
  rationale: Буквально выражение означает «которое не записано»; в административном контексте речь идёт об отсутствии указанной нормы. Формулировка передаёт смысл, не усиливая его до категорического «без ограничений».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением мерного, указного характера перечня. Древние единицы «талант», «кор» и «бат» оставлены без приблизительных современных пересчётов; повтор предлога «до» сохраняет ритм и точность оригинала.
