base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: ru
  text: и оказал мне неизменную милость[a] перед царём, его советниками и всеми могущественными сановниками царя. Я же укрепился, потому что рука Яхве, Бога моего, была надо мной[b], и собрал из Израиля руководителей[c], чтобы они пошли со мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «явил мне благоволение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «я укрепился сообразно руке Яхве, Бога моего, надо мной».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово буквально означает «головы», то есть руководителей.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: простёр ко мне Свою неизменную милость
  rationale: Сохраняет образ направленного к человеку благоволения и содержательную весомость חֶסֶד; местоимение «Свою» проясняет, что милость исходит от Бога, названного в предшествующем контексте.
- source_word: לִפְנֵי
  choice: перед
  rationale: Прямо передаёт пространственно-социальное значение предлога в придворном контексте, не превращая Божье действие в психологическое воздействие на царя.
- source_word: יֹעֲצָיו
  choice: его советниками
  rationale: Естественное современное обозначение членов царского совета.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: могущественными сановниками царя
  rationale: «Сановники» соответствует высокопоставленным придворным и государственным служащим, а «могущественные» сохраняет характеристику הַגִּבֹּרִים.
- source_word: הִתְחַזַּקְתִּי
  choice: я же укрепился
  rationale: Передаёт возвратно-среднее значение формы и связь обретённой силы с последующим упоминанием руки Бога, не сводя смысл только к эмоциональной смелости.
- source_word: כְּיַד יְהוָה אֱלֹהַי עָלַי
  choice: потому что рука Яхве, Бога моего, была надо мной
  rationale: Сохраняет библейскую метафору Божьей руки и естественно выражает обусловленность укрепления Ездры Божьим содействием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: רָאשִׁים
  choice: глав
  rationale: Сохраняет конкретную древнееврейскую метафору «голов», в русском библейском и общественном употреблении обозначающую признанных руководителей.
- source_word: לַעֲלוֹת עִמִּי
  choice: чтобы они отправились со мной в Иерусалим
  rationale: В данном контексте направление восхождения — Иерусалим; экспликация делает фразу понятной современному читателю, хотя буквальное направление отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер חֶסֶד
  choice: неизменная милость
  alternative: благоволение
  rationale: Выбранная формулировка сохраняет оттенки верности, любви и милости, не ограничивая слово только придворным расположением.
- issue: Связь укрепления Ездры с рукой Бога
  choice: 'причинная: «потому что»'
  alternative: 'формальная: «сообразно тому, как рука… была надо мной»'
  rationale: Контекст указывает на Божье содействие как основание укрепления Ездры, однако более буквальная конструкция остаётся возможной и приведена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Сохранены метафоры Божьей руки и «глав» народа. Начальное «и» и относительная зависимость мысли отражают продолжение предыдущего стиха. Экспликация «в Иерусалим» передаёт контекстуально однозначное направление выражения «идти вверх» и избегает неестественного русского оборота.
