  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: ru
  text: а также всё серебро и золото, которое ты найдёшь по всей области Вавилона, вместе с добровольным пожертвованием[a] народа и священников, которые добровольно жертвуют для дома их Бога, который находится в Иерусалиме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добровольным даром». Арамейское слово означает дар, принесённый по собственной воле, особенно в связи с храмом.'
    reason: lexical_alternative
  - marker: b
    text: «Дом их Бога» — храм в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל כְּסַף וּדְהַב
  choice: а также всё серебро и золото
  rationale: Передаёт присоединение к предыдущему перечислению и всеохватность כֹל; «а также» естественно связывает стих с контекстом.
- source_word: דִּי תְהַשְׁכַּח
  choice: которое ты найдёшь
  rationale: Сохраняет прямое обращение к Ездре и обычное значение глагола, не превращая конструкцию без необходимости в пассивную.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: по всей области Вавилона
  rationale: מְדִינָה обозначает административную область; «по всей» естественно выражает распространённость поиска в её пределах.
- source_word: הִתְנַדָּבוּת
  choice: добровольным пожертвованием
  rationale: Передаёт добровольный характер дара и его храмовый контекст без архаизации.
- source_word: עַמָּא וְכָהֲנַיָּא מִתְנַדְּבִין
  choice: народа и священников, которые добровольно жертвуют
  rationale: Причастная форма соотнесена с народом и священниками; повтор «добровольным… добровольно» сохраняет заметную связь двух однокоренных арамейских форм.
- source_word: לְבֵית אֱלָהֲהֹם
  choice: на дом своего Бога
  rationale: «Дом» сохраняет исходный храмовый образ, а предлог «на» естественно обозначает назначение пожертвования.
- source_word: דִּי בִירוּשְׁלֶם
  choice: в Иерусалиме
  rationale: Кратко и естественно указывает местонахождение дома Бога, сохраняя смысл относительной конструкции.
