base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: ru
  text: И я, царь Артаксеркс, повелеваю всем казначеям Заречья:[b] всё, чего попросит у вас священник Ездра, книжник закона Бога небес, пусть будет исполнено в точности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть будет исполнено тщательно (или незамедлительно)»; арамейское наречие подчёркивает точное и полное исполнение распоряжения.'
    reason: lexical_alternative
  - marker: b
    text: «Заречье» — персидское административное название области к западу от реки Евфрат.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: И от меня — я
  rationale: Сохраняет подчёркнутое личное удостоверение царя и явное местоимение исходного текста, оставаясь понятным по-русски.
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: царь Артаксеркс
  rationale: Естественный для современного русского порядок царского титула и имени.
- source_word: שִׂים טְעֵם
  choice: даётся повеление
  rationale: Передаёт официальный характер устанавливаемого царского распоряжения; пассивная конструкция естественно сочетается с вводным «от меня».
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: всем казначеям
  rationale: Кратко и точно обозначает должностных лиц казначейства.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: Заречья
  rationale: Передаёт персидское административное название области к западу от Евфрата; прописная буква указывает на название региона.
- source_word: כָל דִּי יִשְׁאֲלֶנְכוֹן
  choice: всё, чего попросит у вас
  rationale: Сохраняет широкий охват относительной конструкции и значение просьбы, не усиливая его до требования.
- source_word: עֶזְרָא כָהֲנָה
  choice: священник Ездра
  rationale: Естественная русская аппозиция с традиционной формой имени.
- source_word: סָפַר דָּתָא
  choice: книжник закона
  rationale: Сохраняет как учёную, так и официальную сторону титула, не сводя его только к переписчику.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: Бога небес
  rationale: Близко передаёт арамейский имперский титул Бога Израиля и звучит естественно в русском библейском регистре.
- source_word: אָסְפַּרְנָא
  choice: в точности
  rationale: Передаёт требование тщательного, полного и точного исполнения; возможные оттенки быстроты и усердия отмечены в сноске.
