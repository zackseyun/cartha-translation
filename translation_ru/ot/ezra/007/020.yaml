lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: А всё прочее, что потребуется
  rationale: Сочетание обозначает всякую дополнительную, заранее не уточнённую нужду. Такая передача естественно выражает смысл «остальной потребности», не сужая его до одних денежных расходов.
- source_word: בֵּית אֱלָהָךְ
  choice: для дома твоего Бога
  rationale: Сохранён исходный храмовый образ «дом Бога» без поясняющей замены словом «храм».
- source_word: דִּי יִפֶּל לָךְ לְמִנְתַּן
  choice: что тебе надлежит предоставить
  rationale: Оборот יִפֶּל לָךְ выражает возложенную на адресата обязанность; «надлежит» передаёт это значение естественнее буквального «выпадет тебе».
- source_word: תִּנְתֵּן
  choice: предоставляй
  rationale: Повтор глагола «дать» имеет предписывающую силу. «Предоставляй» соответствует административному контексту снабжения и сохраняет связь с предыдущим инфинитивом.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: из царской казны
  rationale: Идиоматичная русская передача обозначения царского казначейства; более буквальное устройство арамейского выражения приведено в сноске.
