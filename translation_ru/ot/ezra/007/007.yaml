  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: ru
  text: В Иерусалим поднялись некоторые из сынов Израиля[a] и некоторые из священников, а также левиты, певцы, привратники и храмовые служители[b]. Это было в седьмой год правления царя Артаксеркса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «некоторые из израильтян». Буквально: «некоторые из сынов Израиля»; еврейская конструкция указывает на часть этой группы.'
    reason: lexical_alternative
  - marker: b
    text: Буквально здесь употреблено название «нетинимы» — особая группа храмовых служителей.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Глагол עלה буквально означает движение вверх и традиционно описывает путь в Иерусалим; «поднялись» сохраняет географический и культовый оттенок.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: некоторые из сынов Израиля
  rationale: 'Предлог מִן имеет партитивное значение: речь идёт о части этой группы. Выражение «сыны Израиля» сохраняет образность еврейского оборота, а слово «некоторые» ясно передаёт партитивность.'
- source_word: וּמִן הַכֹּהֲנִים
  choice: и из священников
  rationale: Повторённый מִן указывает, что в путь отправилась часть священников; связь с «некоторые» естественно понятна из русской конструкции.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое обозначение данной храмовой и родовой группы.
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Термин обозначает служителей, исполнявших пение при храме; «певцы» точнее более широкого слова «музыканты».
- source_word: הַשֹּׁעֲרִים
  choice: привратники
  rationale: Естественное русское обозначение храмовых служителей, отвечавших за ворота.
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Функциональный перевод делает понятной роль особой группы нетинимов, не вводя в основной текст малоизвестную транслитерацию.
- source_word: אֶל יְרוּשָׁלִָם
  choice: в Иерусалим
  rationale: Естественная русская передача направления движения к городу.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: в седьмой год
  rationale: Нормальная русская форма датировки по году царствования.
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: царя Артаксеркса
  rationale: Современный литературный порядок слов, сохраняющий царский титул и традиционную русскую форму имени.
