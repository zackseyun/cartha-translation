base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: ru
  text: После этих событий, во время царствования Артаксеркса, царя Персии, Ездра, сын[a] Сераии, сына Азарии, сына Хелкии —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В родословиях еврейское слово «сын» может обозначать не только непосредственного сына, но и более отдалённого потомка.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: После
  rationale: Сочетание связывает новый раздел с предшествующим повествованием и указывает на последующее время; по-русски естественно передать его словом «После», не добавляя отсутствующего в оригинале наречия «теперь».
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: этих событий
  rationale: В данном повествовательном контексте דְּבָרִים обозначает произошедшие ранее события; «событий» звучит естественнее буквального «вещей» и не сужает смысл до слов или речей.
- source_word: בְּ/מַלְכוּת
  choice: во время царствования
  rationale: Здесь существительное указывает на период правления царя, а не на территорию царства.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: Артаксеркса
  rationale: Использована устоявшаяся русская форма имени персидского царя.
- source_word: מֶלֶךְ פָּרָס
  choice: царя Персии
  rationale: 'Приложение естественно согласовано с родительным падежом имени: «Артаксеркса, царя Персии».'
- source_word: עֶזְרָא
  choice: Ездра
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בֶּן
  choice: сын
  rationale: Сохранена традиционная генеалогическая формула; в родословиях слово может обозначать и более отдалённого потомка, что отмечено в сноске.
- source_word: שְׂרָיָה
  choice: Сераии
  rationale: Использована устоявшаяся русская библейская форма имени с необходимым падежным оформлением.
- source_word: עֲזַרְיָה
  choice: Азарии
  rationale: Использована устоявшаяся русская библейская форма имени с необходимым падежным оформлением.
- source_word: חִלְקִיָּה
  choice: Хелкии
  rationale: Использована устоявшаяся русская библейская форма имени с необходимым падежным оформлением.
