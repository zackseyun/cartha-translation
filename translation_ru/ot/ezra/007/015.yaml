base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: ru
  text: и чтобы доставить серебро и золото, которые царь и его советники добровольно пожертвовали Богу Израиля[a], чья обитель — в Иерусалиме,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который обитает в Иерусалиме». Буквально по-арамейски: «чья обитель — в Иерусалиме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: и чтобы доставить
  rationale: Арамейский инфинитив с союзом и предлогом выражает цель в царском поручении. «Доставить» естественно передаёт перевозку ценностей в Иерусалим, не уточняя способ.
- source_word: כְּסַף וּדְהַב
  choice: серебро и золото
  rationale: Названия драгоценных металлов естественно употребляются по-русски без артиклевой определённости; последующее придаточное уточняет, о каких именно ценностях идёт речь.
- source_word: דִּי
  choice: которое
  rationale: Относительная частица вводит определительное придаточное к сочетанию «серебро и золото». Единственное число среднего рода соответствует обычному русскому согласованию при таком сочетании как совокупном даре.
- source_word: מַלְכָּא
  choice: царь
  rationale: Прямой эквивалент арамейского существительного в определённом значении.
- source_word: וְיָעֲטוֹהִי
  choice: и его советники
  rationale: Слово обозначает советников при царе; этот вариант сохраняет придворный контекст и звучит естественно в современном русском языке.
- source_word: הִתְנַדַּבוּ
  choice: добровольно пожертвовали
  rationale: Глагол указывает на добровольное приношение. «Пожертвовали» ясно выражает передачу ценностей Богу, а наречие сохраняет оттенок свободного волеизъявления.
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Устойчивое и точное обозначение Бога, которому предназначено приношение.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: чья обитель — в Иерусалиме
  rationale: Сохраняет именную конструкцию оригинала со значением места пребывания и храмовую направленность, не превращая её в более прямое утверждение «который обитает».
theological_decisions:
- issue: Отношение Бога к Иерусалиму в выражении מִשְׁכְּנֵהּ
  choice: чья обитель — в Иерусалиме
  alternative: который обитает в Иерусалиме
  rationale: Именная формулировка следует арамейскому тексту и сохраняет храмово-местный акцент, не поясняя и не устраняя возможное напряжение между особым присутствием Бога в Иерусалиме и его непространственной природой.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского поручения. Причастно-канцелярские обороты сведены к минимуму; «обитель» сохраняет возвышенный храмовый оттенок, оставаясь понятным обычному читателю.
