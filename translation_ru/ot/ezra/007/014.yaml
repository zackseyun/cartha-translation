  text: поскольку ты послан от царя[a] и семи его советников, чтобы исследовать положение в Иудее и Иерусалиме согласно закону твоего Бога, который у тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из присутствия царя». Арамейский придворный оборот подчёркивает, что поручение Ездры исходит от царского двора.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «который находится в твоём распоряжении»; возможно также: «который тебе вверен». Буквально: «который в твоей руке».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: поскольку
  rationale: Арамейский оборот вводит основание царского распоряжения; «поскольку» естественно передаёт причинную связь и сохраняет достоинство официальной речи.
- source_word: מִן קֳדָם מַלְכָּא
  choice: от царя
  rationale: Буквально «от лица/из присутствия царя»; в придворном контексте это устойчивое обозначение полномочия, исходящего от царя. Буквализм «от лица царя» в современном русском мог бы ошибочно означать «от имени царя».
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: и семи его советников
  rationale: Существительное обозначает членов царского совета; «советники» является точным и современным соответствием.
- source_word: שְׁלִיחַ
  choice: ты послан
  rationale: Пассивное причастие указывает на официальный статус и поручение Ездры, не требуя более интерпретирующего «уполномочен».
- source_word: לְבַקָּרָא
  choice: чтобы исследовать положение
  rationale: Глагол означает разузнать, проверить или исследовать. Добавление «положение» создаёт естественное русское управление и не ограничивает предмет проверки одной конкретной сферой.
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: в Иудее и Иерусалиме
  rationale: В сочетании с идеей исследования предлог указывает на область проверки. Русское «исследовать положение в…» естественно передаёт смысл «относительно Иудеи и Иерусалима».
- source_word: בְּדָת אֱלָהָךְ
  choice: согласно закону твоего Бога
  rationale: Предлог может обозначать норму или критерий исследования; «согласно» ясно передаёт эту функцию.
- source_word: דִּי בִידָךְ
  choice: который у тебя в руках
  rationale: Сохранён образ оригинала «в твоей руке», при этом естественное русское множественное число допускает значения физического наличия, владения и вверенного полномочия.
