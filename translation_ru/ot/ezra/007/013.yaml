base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: ru
  text: 'Мною издан указ: всякий в моём царстве из народа Израиля, из его[a] священников и левитов, кто добровольно захочет пойти с тобой в Иерусалим, может идти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть священников Израиля. Местоименный суффикс можно также отнести к царю: «его, то есть царских, священников»; однако контекст скорее указывает на Израиль.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: Мною издан указ
  rationale: Официальная арамейская формула обозначает исходящий от царя указ; русская страдательная конструкция естественно передаёт административно-правовой стиль.
- source_word: כָל מִתְנַדַּב
  choice: всякий ... кто добровольно пожелает
  rationale: Порода Hitpael и причастная форма подчёркивают личное, добровольное решение, а не обязанность.
- source_word: בְּמַלְכוּתִי
  choice: в моём царстве
  rationale: Передаёт область царской власти ясно и без архаизации.
- source_word: מִן עַמָּה יִשְׂרָאֵל וְכָהֲנוֹהִי וְלֵוָיֵא
  choice: из народа Израиля, его священников и левитов
  rationale: Перечень охватывает израильский народ, священников и левитов; местоимение «его» естественнее всего соотнести с народом Израиля, при сохранении альтернативы в примечании.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: идти с тобой в Иерусалим
  rationale: Естественный русский порядок слов ясно передаёт движение к Иерусалиму вместе с Ездрой.
- source_word: יְהָךְ
  choice: может идти
  rationale: В контексте указа форма выражает разрешение, а не простое предсказание или повеление.
