  text: וּ/מָֽאנַיָּ/א֙ דִּֽי מִתְיַהֲבִ֣ין לָ֔/ךְ לְ/פָלְחָ֖ן בֵּ֣ית אֱלָהָ֑/ךְ הַשְׁלֵ֕ם קֳדָ֖ם אֱלָ֥הּ יְרוּשְׁלֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: ru
  text: А сосуды, которые даны тебе для служения в доме твоего Бога[a], передай в полном объёме перед Богом Иерусалима[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для богослужения в доме твоего Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полностью представь перед Богом Иерусалима».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: А сосуды
  rationale: Арамейское слово обозначает сосуды или принадлежности; в храмовом контексте «сосуды» — естественный и традиционный русский эквивалент.
- source_word: דִּי
  choice: которые
  rationale: Относительная частица вводит определительное придаточное; форма «которые» согласуется с русским множественным числом.
- source_word: מִתְיַהֲבִין לָךְ
  choice: дают тебе
  rationale: Пассивное причастие выражает совершаемую передачу. Русская неопределённо-личная конструкция естественно передаёт смысл без добавления субъекта.
- source_word: לְפָלְחָן
  choice: для служения
  rationale: Слово обозначает служение, в данном контексте храмовое. «Служение» сохраняет широту исходного значения, не сводя его только к обрядовому поклонению.
- source_word: בֵּית אֱלָהָךְ
  choice: в доме твоего Бога
  rationale: В сочетании с «для служения» русский предложный оборот естественно выражает предназначение сосудов для храмовой службы, не меняя их связи с домом Бога.
- source_word: הַשְׁלֵם
  choice: в целости доставь
  rationale: Повелительная форма несёт смысл полной, неискажённой передачи. «В целости доставь» применимо к сосудам и сохраняет оттенок полноты.
- source_word: קֳדָם
  choice: пред
  rationale: Предлог означает «перед, в присутствии». Краткое «пред» уместно в торжественном тексте указа и не требует уточнять характер действия.
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: Бога Иерусалима
  rationale: Прямая передача арамейского обозначения Бога через Его связь с Иерусалимом; формулировка сохраняет административный стиль персидского периода.
theological_decisions:
- issue: Храмовая терминология
  choice: для служения в доме твоего Бога
  alternative: для богослужения в доме твоего Бога
  rationale: «Служение» сохраняет более широкое значение арамейского существительного и храмовый контекст, не сужая его до собственно обряда.
- issue: Характер передачи сосудов
  choice: в целости доставь пред Бога Иерусалима
  alternative: полностью представь перед Богом Иерусалима
  rationale: Основной вариант передаёт как физическую доставку сосудов, так и требование полноты; альтернативный вариант сохраняет возможный оттенок официального представления в Божьем присутствии.
translation_notes:
  register: Современный литературный русский с умеренно торжественной окраской, соответствующей царскому указу. Архаизирующее «пред» сохранено как естественная библейская форма, тогда как остальная фраза остаётся понятной современному читателю.
