base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: ru
  text: 'А всякого, кто не станет исполнять закон твоего Бога и закон царя, пусть без промедления постигнет судебное наказание: смерть, изгнание[a], конфискация имущества или заключение под стражу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высылка»; букв. «искоренение». Редкое арамейское слово, вероятно, означает удаление человека из его места или общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל דִּי
  choice: А всякого, кто
  rationale: Вводит неопределённое относительное условие и естественно связывает этот стих с предшествующим указом.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: не станет исполнять
  rationale: Буквально выражает неделание, но при слове «закон» обозначает отказ соблюдать или исполнять его; выбранная формулировка сохраняет юридический оттенок.
- source_word: דָּתָא
  choice: закон
  rationale: В имперском арамейском слово может означать закон, постановление или указ; повтор «закон Бога… закон царя» сохраняет параллелизм источника.
- source_word: אָסְפַּרְנָא
  choice: без промедления
  rationale: Передаёт значение быстрого и неотложного исполнения судебного решения естественным современным русским языком.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: следует … предать суду
  rationale: Передаёт безлично-пассивную юридическую конструкцию о применении суда к нарушителю, не уточняя сверх текста, идёт ли речь о приговоре или его исполнении.
- source_word: לְמוֹת
  choice: на смерть
  rationale: Сохраняет лаконичную формулу перечня наказаний и прямо обозначает смертную казнь.
- source_word: לשרשו
  choice: на изгнание
  rationale: Редкий термин, вероятно связанный с «искоренением» или «вырыванием с корнем»; в перечне наказаний наиболее вероятен смысл удаления человека из его места или общины.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: на конфискацию имущества
  rationale: Фраза обозначает имущественное взыскание; «конфискация имущества» ясно передаёт вероятный юридический смысл, хотя возможен более общий смысл имущественного штрафа.
- source_word: וְלֶאֱסוּרִין
  choice: на заключение под стражу
  rationale: Существительное связано с узами и в юридическом контексте обозначает тюремное заключение.
theological_decisions:
- issue: Соотношение закона Бога и закона царя
  choice: 'Оба закона переданы как однородные и координированные: «закон твоего Бога и закон царя».'
  alternative: Истолковать царский закон как подчинённый Божьему или только обеспечивающий его исполнение.
  rationale: Арамейский текст ставит два выражения рядом и не формулирует между ними богословской иерархии; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством официально-юридического указа. Формулировка остаётся понятной широкому читателю; редкий термин отмечен сноской, а координация Божьего и царского закона сохранена без богословского сглаживания.
