  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: ru
  text: Ведь Ездра твёрдо решил[a] исследовать[b] Закон Яхве[c], исполнять его и наставлять израильтян в постановлениях и правовых нормах[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подготовил (или утвердил) своё сердце» — древнееврейский оборот выражает сознательную внутреннюю решимость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «искать», «вопрошать о» или «изучать». Здесь слово может включать как тщательное исследование, так и преданное стремление постичь Божий Закон.'
    reason: lexical_alternative
  - marker: c
    text: Яхве — личное имя Бога, переданное в древнееврейском тексте четырьмя согласными יהוה (ЙХВХ).
    reason: alternative_reading
  - marker: d
    text: 'Буквально формы стоят в единственном числе: «постановлению и правовой норме (судебному решению)»; они могут иметь собирательное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение благоволения и успеха Ездры, о которых говорится в ближайшем контексте; «ведь» естественно передаёт эту пояснительную связь.
- source_word: הֵכִין לְבָבוֹ
  choice: всем сердцем решил
  rationale: Оборот с «сердцем» обозначает обдуманную и твёрдую внутреннюю решимость. Выбранная формулировка сохраняет образ сердца и звучит естественно по-русски.
- source_word: לִדְרוֹשׁ
  choice: исследовать
  rationale: דרש охватывает значения поиска, вопрошания и тщательного изучения. В контексте деятельности книжника «исследовать» передаёт целенаправленное обращение к Закону, не сводя его к простому чтению.
- source_word: תּוֹרַת יְהוָה
  choice: Закон Яхве
  rationale: В священническом и книжническом контексте Ездры תּוֹרָה обозначает прежде всего данный Богом заветный Закон, а не наставление вообще.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: וְלַעֲשֹׂת
  choice: исполнять его
  rationale: Объект подразумевается из предыдущего словосочетания «Закон Яхве». «Исполнять» естественно передаёт практическое осуществление требований Закона.
- source_word: וּלְלַמֵּד
  choice: и учить
  rationale: Порода пиэль глагола למד означает «учить, наставлять»; прямое русское соответствие сохраняет последовательность целей Ездры.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог обозначает сферу, в которой Ездра должен был учить; перевод не превращает Израиль в прямое дополнение.
- source_word: חֹק וּמִשְׁפָּט
  choice: постановлениям и правовым нормам
  rationale: Парные юридические термины обозначают установленные предписания и нормы разрешения дел. Русское множественное число естественно передаёт собирательное значение древнееврейских форм единственного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» прямо передаёт тетраграмматон и не подменяет его титулом.
- issue: Объём значения תּוֹרָה
  choice: Закон
  alternative: наставление; Тора
  rationale: В послепленном священническо-книжническом контексте речь идёт о заветном Законе, однако более широкое значение «наставление» остаётся лексически возможным.
- issue: Соотношение изучения и исполнения
  choice: 'Сохранена последовательность: исследовать, исполнять, учить'
  alternative: Объединить действия в общее описание служения Ездры
  rationale: Три инфинитива исходного текста подчёркивают неразрывную, но различимую связь личного постижения Закона, его практического исполнения и общественного наставления.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис остаётся прозрачным для обычного читателя; древнееврейская идиома о сердце передана естественно, а её буквальная форма вынесена в примечание. Юридическая пара сохранена без архаизмов «устав» и «суд» в неясном для современного читателя значении.
