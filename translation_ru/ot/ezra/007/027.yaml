id: EZR.7.27
reference: Ezra 7:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: ru
  text: Благословен Яхве, Бог наших отцов, вложивший в сердце царя намерение украсить[a] дом Яхве в Иерусалиме,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделать великолепным»; возможен также перевод: «прославить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Краткая и естественная по-русски доксологическая формула, соответствующая предикативному страдательному причастию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: Бог наших отцов
  rationale: Сохраняет традиционное заветное выражение и буквально передаёт אבותינו.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: вложивший в сердце царя намерение
  rationale: Русский оборот «вложить в сердце» естественно передаёт внутреннее побуждение; «намерение» эксплицирует подразумеваемое содержание כָּזֹאת без тяжеловесного «такое».
- source_word: לְפָאֵר
  choice: украсить
  rationale: В данном контексте порода piel обозначает придание храму красоты и великолепия; «украсить» конкретно и естественно.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома», тогда как «храм» был бы контекстуальной конкретизацией.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: По-русски расположение определительного оборота после «дом Яхве» ясно и не требует отдельного относительного местоимения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Смысл לְפָאֵר применительно к дому Яхве
  choice: украсить
  alternative: прославить; сделать великолепным
  rationale: Выбрано конкретное значение, подходящее к храмовому зданию, при сохранении более широких оттенков в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской доксологии. Синтаксис сделан плавным для продолжения предложения в следующем стихе; конечная запятая отражает незавершённость фразы.
