  rationale: Личное имя передано транслитерацией, близкой к еврейской форме и принятой русской библейской традиции.
- source_word: צָדוֹק
  choice: Садок
  rationale: Использована узнаваемая традиционная русская форма еврейского личного имени.
- source_word: אֲחִיטוּב
  choice: Ахитув
  rationale: Использована традиционная русская библейская форма имени, соответствующая еврейскому произношению.
