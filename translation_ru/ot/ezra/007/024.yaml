  text: וּ/לְ/כֹ֣ם מְהוֹדְעִ֗ין דִּ֣י כָל כָּהֲנַיָּ֣/א וְ֠/לֵוָיֵ/א זַמָּ֨רַיָּ֤/א תָרָֽעַיָּ/א֙ נְתִ֣ינַיָּ֔/א וּ/פָ֣לְחֵ֔י בֵּ֖ית אֱלָהָ֣/א דְנָ֑ה מִנְדָּ֤ה בְלוֹ֙ וַ/הֲלָ֔ךְ לָ֥א שַׁלִּ֖יט לְ/מִרְמֵ֥א עֲלֵי/הֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: ru
  text: 'И сообщаем вам: ни на кого из священников, левитов, певцов, привратников, храмовых служителей[a] и тех, кто служит при этом доме Божьем, не разрешается налагать дань, налог или пошлину[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нефинимов» — традиционная передача арамейского названия נְתִינַיָּא.'
    reason: lexical_alternative
  - marker: b
    text: 'Три финансовых термина, вероятно, обозначают разные виды государственных сборов; возможный перевод: «дань, таможенный сбор или дорожная пошлина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: сообщаем
  rationale: Причастная форма в официальной административной формуле; «сообщаем» естественно передаёт деловой и юридический тон.
- source_word: כָל
  choice: ни на кого из
  rationale: В сочетании с отрицательным юридическим предписанием эта конструкция ясно показывает, что запрет распространяется на каждого представителя перечисленных групп.
- source_word: כָהֲנַיָּא
  choice: священников
  rationale: Стандартное обозначение священнического сословия.
- source_word: לֵוָיֵא
  choice: левитов
  rationale: Устоявшееся русское наименование левитского сословия.
- source_word: זַמָּרַיָּא
  choice: певцов
  rationale: Прямо передаёт роль участников храмового музыкального служения.
- source_word: תָרָעַיָּא
  choice: привратников
  rationale: Устоявшееся и понятное обозначение служителей, охранявших и обслуживавших ворота.
- source_word: נְתִינַיָּא
  choice: храмовых служителей
  rationale: Функциональный перевод понятнее непрозрачной транслитерации «нефинимы»; традиционный термин сохранён в примечании.
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: тех, кто служит при этом доме Божьем
  rationale: Передаёт широкое значение причастия «служащие» и не добавляет отсутствующего в источнике слова «другие»; «при» естественно обозначает служение, связанное с храмом.
- source_word: מִנְדָּה
  choice: дань
  rationale: Обозначает установленную властью подать; отдельный перевод сохраняет трёхчленную финансовую формулу.
- source_word: בְלוֹ
  choice: налог
  rationale: Широкий финансовый термин, отличимый в русском от «дани» и «пошлины».
- source_word: וַהֲלָךְ
  choice: пошлина
  rationale: Вероятно, дорожный, транзитный или таможенный сбор; «пошлина» кратко и естественно сохраняет отличие от остальных сборов.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: не разрешается налагать
  rationale: Передаёт юридическое отсутствие полномочия или разрешения на взимание перечисленных платежей.
