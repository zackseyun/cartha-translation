  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: ru
  text: Этот Ездра поднялся из Вавилона. Он был книжником, сведущим в Законе Моисея, который дал Яхве, Бог Израиля. Царь исполнил все его просьбы, ибо рука Яхве, его Бога, была над ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «рука Яхве… была над ним» образно указывает на действие Бога; оно может подразумевать его благоволение, силу или промыслительную помощь.
    reason: Поясняет древнееврейскую идиому, сохраняя её смысловую многозначность.
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: поднялся из Вавилона
  rationale: Сохраняет обычное для еврейского текста представление о пути к Иерусалиму как о восхождении и не добавляет не названного в стихе пункта назначения.
- source_word: סֹפֵר מָהִיר
  choice: искусный книжник
  rationale: «Книжник» передаёт роль знатока и хранителя письменного Закона, а «искусный» — значение опытности и умелости, а не физической быстроты.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: в Законе Моисея
  rationale: В данном послепленном контексте תּוֹרָה обозначает данное через Моисея установление; «Закон» понятно широкому читателю и соответствует функции выражения.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: который дал Яхве, Бог Израиля
  rationale: Относительное местоимение относится к Закону; простое прошедшее время естественно по-русски и сохраняет утверждение о его божественном источнике.
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: Царь даровал ему всё, о чём он просил
  rationale: 'Так естественно передаётся буквальное «дал ему всю его просьбу»: удовлетворил просьбу полностью. «Даровал» поддерживает достойный повествовательный регистр.'
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: поскольку рука Яхве, его Бога, была над ним
  rationale: Сохраняется конкретный образ Божьей руки над Ездрой; союз выражает обусловленность царского решения Божьим действием, не сводя сам образ только к благоволению, силе или провидению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога Израиля; транслитерация «Яхве» сохраняет его как имя и отличает от титула.
- issue: Истолкование выражения о руке Бога над Ездрой
  choice: Сохранить образ руки в основном тексте
  alternative: потому что Яхве благоволил к нему; силой Яхве; благодаря помощи Яхве
  rationale: Оборот может одновременно подразумевать благоволение, силу и промыслительную помощь. Конкретный образ не позволяет переводу без основания выбрать лишь один оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён для ясности, но ключевой образ «руки Яхве» сохранён; слово «добрая» не добавлено, поскольку в этом стихе его нет.
