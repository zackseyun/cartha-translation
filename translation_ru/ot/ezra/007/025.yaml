  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: ru
  text: А ты, Ездра, по мудрости Бога твоего, которая в твоей руке[a], назначь судебных чиновников и судей, чтобы они судили весь народ, живущий в Заречье[b], — всех, кто знает законы Бога твоего; а тех, кто их не знает, обучайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которой ты обладаешь». Арамейское выражение буквально означает «в твоей руке» и может указывать на обладание или на вверенную власть.'
    reason: lexical_alternative
  - marker: b
    text: «Заречье» — персидское административное название территории к западу от Евфрата.
    reason: cultural_note
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: по мудрости Бога твоего
  rationale: Предлог כְּ указывает на соответствие или руководство чем-либо. Формулировка передаёт это отношение естественно и без сведения мудрости лишь к средству действия.
- source_word: דִּי בִידָךְ
  choice: которая в твоей руке
  rationale: Сохранён образ арамейского выражения; он может обозначать как обладание мудростью, так и вверенную Ездре власть, поэтому неоднозначность пояснена в сноске.
- source_word: מֶנִּי
  choice: назначь
  rationale: В административном контексте глагол означает официальное поставление должностных лиц.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: правителей и судей
  rationale: Два близких, но различных обозначения должностных лиц переданы раздельно; «правители» отражает административную функцию первой группы, а «судьи» — собственно судебную.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: чтобы они судили
  rationale: Придаточное естественно выражает назначение поставленных должностных лиц.
- source_word: לְכָל עַמָּה
  choice: весь народ
  rationale: Собирательное существительное с כָּל передано русским собирательным выражением.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: живущий в Заречье
  rationale: «Заречье» передаёт устойчивое персидское административно-географическое обозначение территории за Евфратом; пояснение дано в сноске.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: всех, кто знает законы Бога твоего
  rationale: Сохранено множественное число דָּתֵי и значение знания Божьих установлений.
- source_word: וְדִי לָא יָדַע
  choice: а тех, кто их не знает
  rationale: Местоимение «их» естественно указывает на только что упомянутые законы, не меняя смысла относительной конструкции.
- source_word: תְּהוֹדְעוּן
  choice: обучайте
  rationale: Каузативная форма означает «дайте узнать, научите». Русское «обучайте» естественно в контексте законов и, в отличие от единственного числа в начале стиха, сохраняет множественное число арамейской формы.
theological_decisions:
- issue: Переход от обращения к Ездре в единственном числе к форме множественного числа תְּהוֹדְעוּן в конце стиха
  choice: «а тех, кто их не знает, обучайте»
  alternative: «а тех, кто их не знает, обучай»
  rationale: Арамейский текст действительно переходит к форме множественного числа, вероятно включая Ездру и назначенных им должностных лиц. Перевод сохраняет этот грамматический сдвиг, не устраняя возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены обращение «Ездра», порядок «Бога твоего» и образ «в твоей руке», но синтаксис сделан понятным современному читателю. Маркеры сносок размещены непосредственно при поясняемых выражениях.
