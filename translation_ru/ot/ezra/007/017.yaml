translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Прямое распоряжение передано формами единственного числа («купи», «принеси»), тогда как множественное «вашего» сохранено по арамейскому тексту. Термин «возлияния» оставлен как точный и достаточно узнаваемый культовый термин.
