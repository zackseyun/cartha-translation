  variant: modern literary Russian
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָה֩ אָסְפַּ֨רְנָא תִקְנֵ֜א בְּ/כַסְפָּ֣/א דְנָ֗ה תּוֹרִ֤ין דִּכְרִין֙ אִמְּרִ֔ין וּ/מִנְחָתְ/ה֖וֹן וְ/נִסְכֵּי/ה֑וֹן וּ/תְקָרֵ֣ב הִמּ֔וֹ עַֽל מַדְבְּחָ֔/ה דִּ֛י בֵּ֥ית אֱלָהֲ/כֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: ru
  text: Поэтому тщательно[a] купи на это серебро[b] быков, баранов и ягнят вместе с соответствующими им приношениями из зерна и возлияниями и принеси всё это в жертву на жертвеннике дома[c] вашего Бога в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «старательно» или «в точности»; арамейское наречие подчёркивает тщательность и точность исполнения распоряжения.'
    reason: lexical_alternative
  - marker: b
    text: В данном контексте «серебро» служит деньгами, однако в тексте буквально сказано «серебро».
    reason: lexical_alternative
  - marker: c
    text: 'То есть храма; буквально: «дома вашего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Поэтому
  rationale: Арамейский оборот выражает следствие или вывод; «поэтому» кратко и естественно передаёт эту связь.
- source_word: אָסְפַּרְנָא
  choice: тщательно
  rationale: Наречие подчёркивает старательное и точное исполнение распоряжения; «тщательно» понятно современному читателю и не усиливает значение сверх источника.
- source_word: תִקְנֵא
  choice: купи
  rationale: Форма второго лица единственного числа передаёт прямое предписание Ездре; глагол означает «покупать, приобретать».
- source_word: בְּכַסְפָּא דְנָה
  choice: на это серебро
  rationale: כַּסְפָּא буквально означает «серебро», а здесь обозначает выделенные денежные средства. Русское «купить на это серебро» сохраняет и буквальный образ, и финансовый смысл.
- source_word: תּוֹרִין דִּכְרִין אִמְּרִין
  choice: быков, баранов и ягнят
  rationale: Это естественные русские наименования перечисленных жертвенных животных.
- source_word: מִנְחָתְהוֹן
  choice: соответствующими им приношениями из зерна
  rationale: В жертвенном контексте מִנְחָה обозначает сопровождающее хлебное или зерновое приношение; формулировка «из зерна» яснее современному читателю, а местоименный суффикс передан словами «соответствующими им».
- source_word: נִסְכֵּיהוֹן
  choice: возлияниями
  rationale: Устоявшийся и точный русский термин для жидких приношений, выливаемых при жертвоприношении; принадлежность к перечисленным жертвам выражена общей конструкцией «соответствующими им».
- source_word: וּתְקָרֵב הִמּוֹ
  choice: и принеси всё это в жертву
  rationale: Глагол означает ритуально «приблизить, представить, принести». Добавление «в жертву» естественно обозначает действие у жертвенника, а «всё это» охватывает животных и сопровождающие приношения.
- source_word: עַל מַדְבְּחָה
  choice: на жертвеннике
  rationale: Точно передаёт место совершения жертвоприношения и естественно сочетается с выражением «принести в жертву».
- source_word: בֵּית אֱלָהֲכֹם
  choice: дома вашего Бога
  rationale: Сохранён буквальный образ «дома Бога», при этом форма «вашего» отражает арамейский суффикс второго лица множественного числа.
