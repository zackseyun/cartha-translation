  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: ru
  text: В первый день первого месяца он начал путь из Вавилона, а в первый день пятого месяца прибыл в Иерусалим благодаря благой руке его Бога над ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: отправился
  rationale: Редкое сочетание буквально связано с «основанием/началом восхождения»; в данном повествовательном контексте естественно означает начало пути из Вавилона в Иерусалим.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: потому что благая рука его Бога была над ним
  rationale: Сохраняется библейский образ благой Божьей руки и передаётся причинный смысл כְּ, объясняющий успешное прибытие.
- source_word: הַמַּעֲלָה
  choice: путь … в Иерусалим
  rationale: «Восхождение» здесь обозначает путешествие из Вавилона в Иерусалим; направление названо явно для ясности по контексту.
theological_decisions:
- issue: Образ Божьей руки
  choice: сохранить выражение «благая рука его Бога была над ним»
  alternative: «Бог благоволил к нему»
  rationale: Образный язык оригинала выражает Божье благоволение, защиту и содействие, не сводя смысл лишь к одному из этих аспектов.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно, но сохраняет характерный библейский образ «руки Бога».
