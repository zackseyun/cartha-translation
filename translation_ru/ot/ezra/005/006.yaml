  register: Современный литературный русский с официально-документальным оттенком. Конструкция «Вот копия письма» сохраняет характер вводной формулы перед последующим текстом документа. Тире выделяют пояснительное обозначение группы чиновников и не устраняют лексическую неопределённость, отмеченную в сноске.
