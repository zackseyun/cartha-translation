base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: ru
  text: Вот копия письма, которое Таттенай, наместник Заречья, Шетар-Бознай и его сотрудники — чиновники[a], находившиеся в Заречье, — послали царю Дарию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «афарсахеи», если это слово обозначает народ или административную группу, а не должностных лиц.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: копия
  rationale: Слово обозначает письменную копию или воспроизведение документа; «копия» естественно звучит в современном русском административном контексте.
- source_word: אִגַּרְתָּא
  choice: письмо
  rationale: Речь идёт об официальном письменном сообщении; «письмо» точно и понятно передаёт значение.
- source_word: שְׁלַח
  choice: послали
  rationale: Форма единственного числа в имперском арамейском может употребляться при составном подлежащем; по-русски требуется множественное число, поскольку перечислены несколько отправителей.
- source_word: תַּתְּנַי
  choice: Таттенай
  rationale: Имя передано транслитерацией, близкой к арамейской форме.
- source_word: פַּחַת
  choice: наместник
  rationale: В ахеменидском административном контексте слово обозначает правителя области; «наместник» передаёт должность естественно и без отождествления с более узким титулом сатрапа.
- source_word: עֲבַר נַהֲרָה
  choice: область Заречье
  rationale: Это официальное обозначение персидской территории к западу от Евфрата. Добавление «область» делает административный смысл ясным, а «Заречье» сохраняет значение названия.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Шетар-Бознай
  rationale: Личное имя передано транслитерацией; дефис отражает составную форму имени.
- source_word: וּכְנָוָתֵהּ
  choice: и его соратники
  rationale: Существительное обозначает связанных с названным лицом людей; «соратники» подходит официальному контексту, а «его» сохраняет единственное число местоименного суффикса.
- source_word: אֲפַרְסְכָיֵא
  choice: чиновники
  rationale: Неясный термин может обозначать служебную категорию либо этническую или административную группу. Функциональный перевод уместен в контексте, а альтернативное понимание сохранено в сноске.
- source_word: עַל דָּרְיָוֶשׁ מַלְכָּא
  choice: царю Дарию
  rationale: При глаголе отправки предлог естественно передаёт адресата; русский порядок слов «царю Дарию» современен и сохраняет титул.
