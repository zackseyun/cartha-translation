base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: ru
  text: 'В то время к ним пришли Таттенай, наместник Заречья[a], Шетар-Бознай и их спутники и сказали: «Кто дал вам указ строить этот храм[b] и завершить это сооружение[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Заречье» — персидское административное название области к западу от Евфрата.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «этот дом»; имеется в виду храм.'
    reason: lexical_alternative
  - marker: c
    text: Арамейское слово имеет не вполне ясное значение; его также понимают как «стена» или «каркас».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: В то время
  rationale: Естественно передаёт арамейское временное выражение и сохраняет повествовательную связь.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: к ним пришли
  rationale: Передаёт приближение должностных лиц к строителям без излишне враждебного оттенка.
- source_word: תַּתְּנַי
  choice: Таттенай
  rationale: Транслитерация личного имени в форме, соответствующей русской библейской традиции и исходному звучанию.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: наместник Заречья
  rationale: Паха — провинциальный правитель; «Заречье» кратко передаёт официальное персидское название области за Евфратом.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Шетар-Бознай
  rationale: Транслитерация составного личного имени с сохранением дефиса.
- source_word: וּכְנָוָתְהוֹן
  choice: и их соратники
  rationale: Обозначает связанных с ними людей; «соратники» достаточно широко и естественно в данном официальном контексте.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: и спросили их
  rationale: Последующая прямая речь представляет собой вопрос; такой перевод естественнее буквального «сказали им так» и сохраняет функцию оборота.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Кто дал вам разрешение
  rationale: טְעֵם здесь означает официальное распоряжение или постановление; в контексте проверки полномочий «разрешение» звучит естественно, не исключая смысла властного указа.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: строить этот храм
  rationale: Буквально «строить этот дом»; референтом является храм, поэтому явное обозначение делает современный русский текст понятным.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: это сооружение
  rationale: Значение существительного не вполне определённо; широкое «сооружение» не навязывает более узкое толкование «стена» или «каркас».
- source_word: לְשַׁכְלָלָה
  choice: завершить
  rationale: Точно передаёт доведение строительной работы до конца.
