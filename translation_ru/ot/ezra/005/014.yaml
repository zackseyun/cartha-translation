  terminology: «Сосуды дома Божьего», «храм», «царь», «правитель» и имя «Шешбацар» употреблены последовательно и в уместном современном литературном регистре. Сноска корректно показывает более формальную структуру формулы שְׁמֵהּ, не навязывая интерпретации.
