  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: ru
  text: Кроме того, золотые и серебряные сосуды дома Божьего, которые Навуходоносор вынес из храма в Иерусалиме и принёс в храм Вавилона, царь Кир вынес из храма Вавилона и передал человеку по имени Шешбацар, которого назначил правителем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и передал их Шешбацару — таково его имя, — которого поставил правителем».'
    reason: Сохраняет для читателя более формальную структуру арамейской формулы שְׁמֵהּ и буквальное значение שָׂמֵהּ.
lexical_decisions:
- source_word: וְאַף
  choice: Кроме того
  rationale: Передаёт добавочное значение арамейской связки и естественно вводит ещё одну часть донесения.
- source_word: מָאנַיָּא דִי בֵית אֱלָהָא
  choice: сосуды дома Божьего
  rationale: «Сосуды» уместно обозначает храмовые принадлежности, а «дом Божий» сохраняет буквальное выражение источника и отличает его от последующего הֵיכְלָא — «храм».
- source_word: דִי דַהֲבָה וְכַסְפָּא
  choice: золотые и серебряные
  rationale: Естественно передаёт материал, из которого были сделаны сосуды.
- source_word: הֵיכְלָא
  choice: храм
  rationale: В контексте речь идёт о святилищах в Иерусалиме и Вавилоне; «храм» точно и понятно передаёт значение.
- source_word: הַנְפֵּק ... וְהֵיבֵל הִמּוֹ
  choice: вынес ... и принёс
  rationale: Сохраняет последовательность действий Навуходоносора и явную отсылку местоимения к сосудам без ненужного усложнения русской фразы.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: царь Кир
  rationale: Нормальный русский порядок титула и имени.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: передал человеку по имени Шешбацар
  rationale: Естественно передаёт формулу именования «Шешбацару — имя его», не устраняя её смысл.
- source_word: פֶחָה
  choice: правитель
  rationale: Доступное современному читателю обозначение персидской административной должности; возможен более специальный вариант «наместник».
- source_word: שָׂמֵהּ
  choice: назначил
  rationale: По контексту глагол означает поставление на официальную должность.
