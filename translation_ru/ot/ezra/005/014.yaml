  source_fidelity: Перевод точно передаёт добавочную связку וְאַף, храмовые «сосуды» из золота и серебра, различие между «домом Божьим» (בֵית אֱלָהָא) и «храмом» (הֵיכְלָא), а также последовательность перенесения сосудов Навуходоносором и их передачи Киром. «Царь Кир», «Шешбацар» и «правитель» соответствуют тексту и русской библейской традиции. Относительное «которого назначил правителем» естественно соотносится с Киром как подлежащим главного предложения.
