reference: Ezra 5:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: ru
  text: 'И вот какой ответ они дали нам[a]: «Мы — слуги Бога небес и земли. Мы восстанавливаем[b] дом, построенный много лет назад; его построил и завершил великий царь Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вот какие слова они передали нам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «строим». Арамейское причастие обозначает продолжающееся действие; перевод «восстанавливаем» делает явным, что этот храм существовал прежде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: И вот какой ответ они дали нам
  rationale: Оборот вводит содержание ответа. פִתְגָם может означать «слово», «сообщение» или «ответ», а הֲתִיבוּנָא буквально выражает возвращение ответа; по-русски естественно передать весь оборот как «какой ответ они дали нам».
- source_word: לְמֵמַר
  choice: двоеточие перед прямой речью
  rationale: Арамейский инфинитив «сказать» служит формулой введения цитаты; в современном русском его функцию естественно выполняют двоеточие и прямая речь без избыточного «сказав».
- source_word: עַבְדוֹהִי
  choice: слуги
  rationale: Слово обозначает находящихся на службе или в подчинении. Здесь это обозначение верности и служения Богу, поэтому «слуги» уместнее, чем «рабы», которое в современном русском сильнее подчеркивает несвободу.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: Бога небес и земли
  rationale: Так сохраняется универсальный титул Бога и множественная форма «небеса», при этом выражение звучит естественно и торжественно по-русски.
- source_word: וּבָנַיִן
  choice: Мы восстанавливаем
  rationale: Причастная форма обозначает продолжающееся строительство. Контекст ясно показывает, что дом существовал прежде, поэтому «восстанавливаем» естественно выражает повторное строительство, не скрывая буквальную возможность перевода «строим».
- source_word: בַּיְתָא
  choice: дом
  rationale: Сохранено буквальное слово «дом», хотя по контексту речь идет о храме.
- source_word: דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: построенный много лет назад
  rationale: Идиоматично передает буквальный временной оборот «до этого — много лет» и относительное описание прежней постройки.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: великий царь Израиля
  rationale: רַב обозначает величие или выдающееся положение, а сочетание с לְיִשְׂרָאֵל указывает на царя Израиля; имя Соломона текст прямо не называет.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: его построил и завершил
  rationale: Пара глаголов различает возведение здания и доведение работ до полного завершения.
theological_decisions:
- issue: Божественный титул в официальной переписке
  choice: Бога небес и земли
  alternative: Бога небесного и земного
  rationale: Родительная конструкция передает утверждение о Боге как Владыке небес и земли, а не как об одном из местных божеств; перевод не добавляет конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский с ясным, достойным повествовательным строем. Прямая речь оформлена естественно; буквальное «дом» сохранено вместо поясняющего «храм». Повтор местоимения «его» устраняет синтаксическую двусмысленность и ясно связывает последнюю часть с домом.
