base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: ru
  text: 'Они послали ему донесение[a], и вот что было в нём написано: «Дарию, царю: полного благополучия!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «официальное сообщение», «документ» или «письмо». Арамейское פִּתְגָמָא может обозначать различные виды официального письменного сообщения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «весь мир». Это официальная форма приветствия в письме, выражающая пожелание полного мира и благополучия.'
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: донесение
  rationale: В имперском арамейском слово обозначает официальное сообщение, документ или доклад; в данном административном контексте «донесение» естественно передаёт официальный характер послания.
- source_word: שְׁלַחוּ
  choice: они послали
  rationale: Прямо передаёт форму Peal, перфект, 3-е лицо множественного числа, без ненужного усиления.
- source_word: עֲלֹוהִי
  choice: ему
  rationale: При глаголе «послать» предлог עַל с местоименным суффиксом здесь указывает на адресата; из продолжения ясно, что речь идёт о Дарии.
- source_word: וְכִדְנָה
  choice: и вот что
  rationale: Естественно вводит содержание документа и сохраняет указательное значение выражения «и так / и вот как».
- source_word: כְּתִיב
  choice: было написано
  rationale: Передаёт пассивное значение формы и соответствует русскому способу вводить цитату из документа.
- source_word: בְּגַוֵּהּ
  choice: в нём
  rationale: Указывает на содержание письменного донесения; это краткое и естественное русское соответствие.
- source_word: לְדָרְיָוֶשׁ
  choice: Дарию
  rationale: Дательный падеж отмечает адресата в заголовке письма.
- source_word: מַלְכָּא
  choice: царю
  rationale: Приложение к имени адресата; форма дательного падежа согласована с «Дарию».
- source_word: שְׁלָמָא כֹלָּא
  choice: полного благополучия
  rationale: В официальном эпистолярном приветствии שְׁלָם означает мир, благополучие и благоденствие, а כֹּל усиливает значение полноты. Русская формула передаёт функцию и смысл выражения без неестественного буквального оборота «весь мир».
