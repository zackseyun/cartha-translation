  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: ru
  text: Однако в первый год правления Кира, царя Вавилона, царь Кир издал указ о том, чтобы заново построить этот дом Божий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «построить этот дом Божий». Сам арамейский глагол означает «строить»; перевод «заново построить» отражает контекст восстановления храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Однако
  rationale: Арамейский противительный союз обозначает контраст с предыдущим утверждением; «однако» естественно передаёт этот поворот мысли.
- source_word: בִּשְׁנַת חֲדָה
  choice: в первый год правления
  rationale: Это формула датировки по году царствования. Добавление «правления» ясно передаёт её смысл по-русски.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: Кира, царя Вавилона
  rationale: Предлог ל при имени царя в формуле датировки указывает, к чьему царствованию относится названный год.
- source_word: שָׂם טְעֵם
  choice: издал указ
  rationale: Буквально сочетание означает «установил распоряжение»; в царском административном контексте естественный русский эквивалент — «издал указ».
- source_word: בֵּית אֱלָהָא דְנָה
  choice: этот дом Божий
  rationale: Сохраняется буквальный образ «дома Бога» и библейское обозначение храма, без подмены исходной формулировки словом «храм».
- source_word: לִבְנֵא
  choice: заново построить
  rationale: Сам арамейский глагол значит «строить», тогда как значение восстановления разрушенного храма следует из контекста. Формулировка «заново построить» передаёт контекст, а сноска сохраняет лексическую неоднозначность.
