base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: ru
  text: Пророк Аггей и Захария, сын Иддо, — оба пророка — пророчествовали иудеям[a], находившимся в Иудее и Иерусалиме, именем[b] Бога Израиля, который был над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жителям Иудеи». Арамейское слово может обозначать как иудейский народ, так и, в более географическом смысле, жителей Иудеи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по полномочию Бога Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: пророчествовали
  rationale: Форма глагола вводит основное повествовательное действие. Начальный союз не требует отдельного слова «тогда» или «теперь»; связь с контекстом естественно передаётся порядком повествования.
- source_word: חַגַּי נביאה
  choice: пророк Аггей
  rationale: Определённая арамейская форма стоит в приложении к имени. Русский порядок «пророк Аггей» естественен и сохраняет титул.
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: и Захария, сын Иддо
  rationale: בַר означает «сын»; имена переданы в традиционной русской библейской форме.
- source_word: נביאיא
  choice: оба пророка
  rationale: Множественное приложение относится к Аггею и Захарии. Слово «оба» делает эту повторную характеристику понятной по-русски, не опуская её как избыточную.
- source_word: עַל יְהוּדָיֵא
  choice: иудеям
  rationale: С предикатом «пророчествовать» предлог обозначает адресатов речи. Существительное может называть как еврейский народ, так и жителей Иудеи; основной вариант «иудеи» привычен в данном контексте, а географический оттенок отмечен в сноске.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: жившим в Иудее и Иерусалиме
  rationale: Относительная конструкция указывает, где находились адресаты. «Иудея» ясно обозначает послепленную область Иуды и естественно сочетается с названием города.
- source_word: בְּשֻׁם
  choice: именем
  rationale: Устойчивое выражение означает выступление от имени и с полномочиями Бога. Краткая русская форма «именем» естественна, а оттенок полномочия вынесен в сноску.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая передача определённой по смыслу генитивной конструкции.
- source_word: עֲלֵיהוֹן
  choice: который был над ними
  rationale: Фраза наиболее вероятно относится к Богу Израиля. Буквальный пространственный образ «над ними» сохраняет возможные оттенки власти, попечения и присутствия, не сводя выражение только к одному из них.
theological_decisions:
- issue: Связь и смысл заключительного עֲלֵיהוֹן
  choice: 'Фраза отнесена к Богу Израиля: «который был над ними».'
  alternative: 'Возможно более сжатое понимание как обстоятельства при пророчествовании: «именем Бога Израиля — над ними / к ним».'
  rationale: Синтаксически наиболее естественно видеть здесь определение к «Богу Израиля». Формулировка «был над ними» сохраняет напряжение между Божьей властью, защитой и присутствием и не уточняет то, чего прямо не уточняет арамейский текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повторное приложение נביאיא сохранено оборотом «оба пророка», а не устранено. Местоимение «который» написано со строчной буквы согласно современной нейтральной русской орфографической практике; это не умаляет божественного референта.
