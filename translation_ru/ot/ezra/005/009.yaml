base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/009.yaml
  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: ru
  text: 'Тогда мы спросили тех старейшин и сказали им следующее: «Кто дал вам указ строить этот дом и завершить это сооружение?»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «строить этот дом и это сооружение»; это более буквальная передача. Под «домом» подразумевается храм.'
    reason: lexical_alternative
  - marker: b
    text: Арамейское слово, переведённое как «сооружение», может обозначать собственно конструкцию здания, его каркас или связанную с ним строительную часть.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейское наречие обозначает последовательность событий в повествовании; «тогда» естественно передаёт этот переход.
- source_word: שְׁאֵלְנָא
  choice: мы спросили
  rationale: Прямое и нейтральное обозначение заданного вопроса; соответствует официальному контексту донесения.
- source_word: לְשָׂבַיָּא אִלֵּךְ
  choice: тех старейшин
  rationale: Указывает на ранее названных иудейских старейшин; «тех» естественно передаёт дейктическую отсылку в отчёте.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: и сказали им
  rationale: Формула вводит содержание прямой речи. Отдельное «следующее» по-русски избыточно, поскольку далее непосредственно следует цитата.
- source_word: מַן
  choice: Кто
  rationale: Вопросительное местоимение относится к лицу, давшему официальное разрешение.
- source_word: שָׂם לְכֹם טְעֵם
  choice: дал вам указ
  rationale: טְעֵם в имперском арамейском может обозначать официальное распоряжение или указ; выбран административно точный и естественный русский эквивалент.
- source_word: בַּיְתָא דְנָה
  choice: этот дом
  rationale: Сохранено буквальное «дом»; из контекста ясно, что речь идёт о храме.
- source_word: לְמִבְנְיָה
  choice: строить
  rationale: Глагол означает «строить»; контекст восстановления не требует добавлять в переводе приставку «воз-».
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: это сооружение
  rationale: Редкое существительное связано с возводимой конструкцией или строительной частью здания; широкое «сооружение» сохраняет лексическую неопределённость.
- source_word: לְשַׁכְלָלָה
  choice: завершить
  rationale: Передаёт доведение строительной работы до полного окончания и соответствует официальному регистру.
