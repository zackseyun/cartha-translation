base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: ru
  text: Тогда этот Шешбаццар пришёл и заложил основания[a] дома Божьего, который в Иерусалиме; с того времени и доныне он строится[b], но ещё не закончен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дал основания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его продолжают строить»; арамейская форма обозначает продолжающийся процесс в страдательном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Передаёт арамейское наречие, обозначающее последовательность событий в повествовании.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: этот Шешбаццар
  rationale: Сохраняет указательное значение דֵּךְ и отсылку к ранее названному человеку.
- source_word: אֲתָא
  choice: пришёл
  rationale: Прямой и естественный эквивалент простого повествовательного глагола.
- source_word: יְהַב אֻשַּׁיָּא
  choice: заложил основания
  rationale: Естественная русская строительная идиома, точно передающая действие; буквальное «дал основания» по-русски неестественно.
- source_word: בֵית אֱלָהָא
  choice: дом Божий
  rationale: Сохраняет исходный образ «дома Бога», не заменяя его более толковательным словом «храм».
- source_word: דִּי בִירוּשְׁלֶם
  choice: что в Иерусалиме
  rationale: Кратко и естественно передаёт относительное определение с указанием места.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: С того времени и доныне
  rationale: Передаёт непрерывный временной промежуток от закладки основания до момента речи.
- source_word: מִתְבְּנֵא
  choice: он строится
  rationale: Настоящее время страдательно-возвратной формы в сочетании с временным оборотом выражает продолжающийся процесс строительства.
- source_word: וְלָא שְׁלִם
  choice: но ещё не закончен
  rationale: Ясно передаёт отсутствие завершения к настоящему моменту; «но» естественно выражает контраст с продолжающимся строительством.
