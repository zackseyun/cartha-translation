id: EZR.5.2
reference: Ezra 5:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: ru
  text: Тогда Зоровавель, сын Шеалтиэля, и Иешуа[b], сын Иоцадака, поднялись и начали строить дом Бога в Иерусалиме[a]. Вместе с ними были Божьи пророки, которые поддерживали их[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм Бога». Буквально по-арамейски: «дом Бога».'
    reason: lexical_alternative
  - marker: b
    text: Здесь употреблена краткая форма имени Иешуа; полная родственная форма этого имени в других местах передаётся как Иехошуа.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «помогали им», «содействовали им». Причастие передаёт активную, продолжавшуюся поддержку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: קָמוּ
  choice: поднялись
  rationale: Сохраняет прямое значение «встали, поднялись» и одновременно передаёт решительное начало действия.
- source_word: זְרֻבָּבֶל
  choice: Зоровавель
  rationale: Устоявшаяся в русской библейской традиции форма имени.
- source_word: בַּר
  choice: сын
  rationale: Прямой и естественный эквивалент арамейского обозначения родства.
- source_word: שְׁאַלְתִּיאֵל
  choice: Шеалтиэль
  rationale: Передаёт представленную в источнике форму имени, не заменяя её традиционным вариантом «Салафиил».
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Сохраняет краткую форму личного имени в источнике и отличает её от полной родственной формы.
- source_word: יוֹצָדָק
  choice: Иоцадак
  rationale: Передаёт краткую форму имени в данном арамейском тексте, не разворачивая её в более полную форму.
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: и начали строить
  rationale: Естественно по-русски передаёт вспомогательный глагол «начали» с инфинитивом «строить».
- source_word: בֵּית אֱלָהָא
  choice: дом Бога
  rationale: Сохраняет буквальный образ «дома Бога»; контекстуальное «храм Бога» вынесено в примечание.
- source_word: דִּי בִירוּשְׁלֶם
  choice: в Иерусалиме
  rationale: Кратко и естественно передаёт определительную конструкцию, указывающую местонахождение дома Бога.
- source_word: נביאיא די אלהא
  choice: Божьи пророки
  rationale: Естественный русский эквивалент сочетания «пророки Бога» без изменения его смысла.
- source_word: מְסָעֲדִין לְהוֹן
  choice: которые поддерживали их
  rationale: Причастие выражает продолжающееся активное содействие; придаточное предложение звучит естественно в современном русском языке.
theological_decisions:
- issue: Обозначение святилища как «дома Бога»
  choice: дом Бога
  alternative: храм Бога
  rationale: В основном тексте сохранён буквальный библейский образ, а более контекстуальное обозначение «храм» дано как допустимая альтернатива.
- issue: Характер участия пророков
  choice: поддерживали их
  alternative: помогали им
  rationale: Формулировка сохраняет достаточно широкий смысл активного содействия и не уточняет без основания, было ли оно исключительно словесным или практическим.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён без потери содержания; имена переданы близко к форме исходного текста, а не механически по традиционным русским вариантам.
