  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: ru
  text: Поэтому, поскольку наши предки прогневили Бога небес, Он отдал их в руки Навуходоносора, царя Вавилона, халдеянина. Тот разрушил этот дом[a] и увёл народ в Вавилон, в изгнание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм.
    reason: cultural_note
lexical_decisions:
- source_word: לָהֵן מִן דִּי
  choice: Но за то, что
  rationale: לָהֵן здесь вводит противопоставление прежнему величию царства, а מִן דִּי — причину последовавшего суда. Сочетание «Но за то, что» естественно передаёт обе связи.
- source_word: הַרְגִּזוּ
  choice: прогневили
  rationale: Каузативная форма обозначает вызванный гнев; «прогневили» сохраняет прямую причинность и уместный высокий регистр.
- source_word: אֲבָהֳתַנָא
  choice: наши предки
  rationale: В контексте имеется в виду предшествующее поколение народа. «Предки» точно и понятно современному читателю, не ограничивая значение непосредственными отцами.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: Он отдал их в руки
  rationale: Сохранён библейский образ передачи людей под чужую власть; русское множественное «в руки» звучит естественно.
- source_word: כסדיא
  choice: халдеянина
  rationale: Единственное число является приложением к имени Навуходоносора; перевод не заменяет этноним толкованием «вавилонянин».
- source_word: וּבַיְתָה דְנָה סַתְרֵהּ
  choice: Тот разрушил этот дом
  rationale: Местоимение «тот» ясно относит действие к Навуходоносору, а «дом» сохраняет лексику источника, где речь идёт о храме.
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: и увёл народ в изгнание в Вавилон
  rationale: Каузатив глагола גלה обозначает насильственное переселение в изгнание; формулировка сохраняет и движение, и статус изгнанников.
theological_decisions:
- issue: Прямая причинность Божьего суда
  choice: Он отдал их в руки Навуходоносора
  alternative: Он допустил, чтобы они попали в руки Навуходоносора
  rationale: Арамейский текст прямо называет Бога действующим лицом и не смягчает Его действие до простого позволения.
- issue: Обозначение храма
  choice: этот дом
  alternative: этот храм
  rationale: Источник говорит «дом». Буквальное обозначение сохраняет богословски значимый образ дома Божьего, а референт поясняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Архаичное «отцы» заменено на ясное «предки», но формула «Бог небес» и образ «отдал в руки» сохранены. Разбиение на два предложения устраняет двусмысленность субъекта при естественном русском синтаксисе.
