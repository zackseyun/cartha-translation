  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: ru
  text: 'И он сказал ему: «Возьми эти сосуды, ступай и поставь их в храм, что в Иерусалиме, а дом Божий пусть будет вновь построен на своём месте[a]».'
