    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: И он сказал ему
  rationale: Передаёт стандартное арамейское повествовательное введение; местоимения ясно выражают лицо подлежащего и адресата.
- source_word: אֵלֶּה מָאנַיָּא
  choice: эти сосуды
  rationale: В контексте речь идёт о священных храмовых предметах; «сосуды» — естественное и традиционно понятное русское обозначение такой утвари.
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: возьми эти сосуды, ступай и поставь их
  rationale: Сохранена последовательность трёх повелений. «Ступай» соответствует глаголу движения, а «поставь» передаёт действие помещения сосудов в храм, не сливая два отдельных глагола.
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: в храме, что в Иерусалиме
  rationale: По контексту הֵיכְלָא означает именно храм, а относительная конструкция с דִּי сохранена в естественной русской форме.
- source_word: וּבֵית אֱלָהָא יִתְבְּנֵא
  choice: а дом Божий пусть будет вновь построен
  rationale: Пассивная форма передана конструкцией «пусть будет построен». Наречие «вновь» выражает очевидный из контекста смысл восстановления разрушенного храма, тогда как примечание сохраняет более буквальный вариант.
- source_word: עַל אַתְרֵהּ
  choice: на своём месте
  rationale: Передаёт значение אַתְרָא «место, местоположение» и местоименный суффикс, относящийся к дому Божьему; выражение подчёркивает строительство на принадлежащем ему месте.
