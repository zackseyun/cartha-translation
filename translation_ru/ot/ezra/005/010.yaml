  yaml_path: translation/ot/ezra/005/010.yaml
  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: ru
  text: Мы также спросили у них их имена, чтобы сообщить тебе[a] и записать имена людей, которые стояли у них во главе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы сделать их известными тебе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которые были у них во главе», то есть главные среди них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Мы также
  rationale: Сочетание союза и наречия добавляет ещё один пункт к донесению чиновников; «мы также» естественно передаёт эту связь.
- source_word: שְׁמָהָתְהֹם שְׁאֵלְנָא לְּהֹם
  choice: спросили у них, как их зовут
  rationale: 'Буквально: «спросили у них их имена». Русская идиома «спросить, как зовут» точно и естественно передаёт смысл.'
- source_word: לְהוֹדָעוּתָךְ
  choice: чтобы сообщить тебе
  rationale: 'Каузативный инфинитив от ידע выражает цель: сделать сведения известными адресату. «Сообщить тебе» естественно передаёт это по-русски.'
- source_word: דִּי נִכְתֻּב
  choice: и записать
  rationale: Частица вводит дальнейшую цель, а глагол имеет документальный смысл «записать». Союз «и» делает связь двух тесно сопряжённых целей ясной в современном русском.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: имена людей
  rationale: Существительное «имя» формально стоит в единственном числе, но употреблено собирательно при множественном «людей»; русское множественное «имена» необходимо по смыслу.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: стоящих во главе их
  rationale: Перевод сохраняет исходный образ «быть у них во главе» и не подменяет его более истолковывающим словом «руководители».
