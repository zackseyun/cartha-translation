base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: ru
  text: Но око их Бога было устремлено на старейшин иудеев[a], и им не дали остановить их, пока решение не дойдёт до Дария[b]; затем они должны были послать письмо по этому поводу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их Бог наблюдал за старейшинами иудеев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока распоряжение не дойдёт до Дария».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «затем они пошлют обратно письмо по этому поводу»; возможно: «затем они ответят письменно по этому поводу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: Но око их Бога было над
  rationale: Сохранена конкретная метафора божественного надзора и явное местоименное значение «их». Союз «но» естественно передаёт противопоставление действиям чиновников в предыдущем контексте.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: старейшинами иудеев
  rationale: שָׂבֵי обозначает именно старейшин; конструктивная связь передана без обобщения до «руководителей».
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: и их не заставили прекратить работу
  rationale: Порода Pael выражает причинение прекращения. Слово «работу» добавлено по непосредственному контексту строительства, чтобы русская фраза не звучала оборванно.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: пока дело не будет представлено Дарию
  rationale: טַעְמָא допускает административные значения «дело, решение, распоряжение». В данном контексте движение к Дарию естественнее понимать как передачу дела на его рассмотрение; варианты «решение» и «распоряжение» сохранены в примечании.
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא
  choice: и затем они не пришлют письменный ответ
  rationale: יְתִיבוּן может означать «возвратят, пошлют обратно, ответят», а נִשְׁתְּוָנָא — официальное письменное сообщение. Перевод передаёт административный обмен, не уточняя сверх текста адресата ответа.
- source_word: עַל דְּנָה
  choice: об этом
  rationale: Кратко и естественно передаёт указательное выражение, относящееся к рассматриваемому делу.
theological_decisions:
- issue: Антропоморфный образ Божьего надзора
  choice: Сохранить в основном тексте выражение «око их Бога было над»
  alternative: «их Бог наблюдал за старейшинами иудеев»
  rationale: Арамейский текст использует конкретный образ ока. Его сохранение передаёт литературную силу утверждения о Божьем попечении, не превращая перевод в богословское толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «око… было над». Административная последовательность изложена ясно, при этом лексическая неоднозначность טַעְמָא и יְתִיבוּן вынесена в примечания.
