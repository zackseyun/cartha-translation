source:
  edition: WLC
  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: ru
  text: А теперь, если царю будет угодно, пусть поищут в царском хранилище там, в Вавилоне, действительно ли царь Кир издал повеление отстроить этот дом Божий в Иерусалиме[a]. И пусть царь сообщит нам своё решение по этому делу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «построить этот дом Божий в Иерусалиме». Арамейский глагол буквально означает «строить»; перевод «отстроить» учитывает контекст восстановления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть царь пошлёт нам свою волю об этом»; возможно также: «своё желание» или «своё благоволение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: А теперь
  rationale: Передаёт арамейский связующий дискурсивный оборот и естественно вводит заключительную просьбу.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: если царю будет угодно
  rationale: Естественная современная русская формула почтительного придворного обращения, сохраняющая условность оригинала.
- source_word: יִתְבַּקַּר
  choice: пусть поищут
  rationale: Передаёт побудительное значение формы и конкретный поиск документа; неопределённо-личная конструкция звучит естественнее буквального пассива.
- source_word: בְּבֵית גִּנְזַיָּא
  choice: в царском хранилище
  rationale: Буквально «в доме сокровищ»; в контексте это место хранения царских ценностей и документов. «Хранилище» не сужает значение исключительно до казны или архива.
- source_word: דִּי מַלְכָּא תַמָּה דִּי בְּבָבֶל
  choice: там, в Вавилоне
  rationale: Сохраняет указание на местонахождение хранилища без тяжеловесной относительной конструкции.
- source_word: הֵן אִיתַי דִּי
  choice: действительно ли
  rationale: Естественно передаёт проверочный и подтверждающий смысл оборота.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: царь Кир издал повеление
  rationale: טְעֵם обозначает официальное распоряжение; активная русская конструкция ясна и сохраняет названного деятеля.
- source_word: לְמִבְנֵא
  choice: отстроить
  rationale: Формально глагол значит «строить», но контекст восстановления разрушенного храма допускает «отстроить»; буквальная альтернатива отмечена в сноске.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: этот дом Божий
  rationale: Сохраняет метафору «дом Бога» и указательное местоимение, не заменяя её более интерпретирующим словом «храм».
- source_word: וּרְעוּת מַלְכָּא
  choice: решение царя / своё решение
  rationale: В административном контексте רְעוּת означает волю, угодное царю решение. В основном тексте «своё решение» естественно связано с подлежащим «царь».
- source_word: עַל דְּנָה
  choice: по этому делу
  rationale: Передаёт официальный характер выражения и уточняет предмет царского решения.
- source_word: יִשְׁלַח עֲלֵינָא
  choice: пусть царь сообщит нам
  rationale: Глагол буквально означает «пошлёт», но по-русски решение естественно «сообщают»; смысл отправки царского ответа сохранён.
