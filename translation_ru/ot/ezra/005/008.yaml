base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: ru
  text: Да будет известно царю, что мы отправились в провинцию Иудею, к дому великого Бога. Он строится из крупных камней[a], а древесину укладывают в стены. Эта работа ведётся усердно[b] и успешно продвигается в их руках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из больших камней». Арамейское выражение, вероятно, обозначает очень крупные строительные камни; точный оттенок первого слова обсуждается.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «тщательно» или, вероятно, «быстро». Точный оттенок арамейского наречия неясен, но оно описывает успешное и действенное ведение работ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: Да будет известно
  rationale: Сохраняет официальную арамейскую формулу донесения и звучит естественно в русском административно-повествовательном контексте.
- source_word: לְמַלְכָּא
  choice: царю
  rationale: Дательный падеж естественно обозначает адресата донесения.
- source_word: אֲזַלְנָא
  choice: мы отправились
  rationale: Передаёт движение докладчиков; глагол «отправились» литературно естественнее, чем буквальное «пошли», в официальном сообщении.
- source_word: לִיהוּד מְדִינְתָּא
  choice: в область Иудеи
  rationale: מְדִינְתָּא обозначает административную область империи; «Иудея» — привычное русское наименование.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: к дому великого Бога
  rationale: Сохранено буквальное «дом», хотя по контексту речь идёт о храме; это удерживает лексику и почтительный тон источника.
- source_word: מִתְבְּנֵא
  choice: Он строится
  rationale: Возвратно-пассивная форма передана русским страдательным оборотом настоящего времени; местоимение относится к дому Бога.
- source_word: אֶבֶן גְּלָל
  choice: из крупных камней
  rationale: Сочетание, вероятно, обозначает массивные строительные камни. «Крупных» ясно передаёт величину, не навязывая спорного представления о способе обработки или перемещения.
- source_word: וְאָע
  choice: а … дерево
  rationale: Существительное обозначает древесину или лесоматериал. «Дерево» понятно современному читателю; союз «а» естественно связывает второй элемент описания строительства.
- source_word: מִתְּשָׂם בְּכֻתְלַיָּא
  choice: в стены укладывают
  rationale: Безличная активная конструкция по-русски естественно передаёт арамейскую пассивную форму и помещение древесины в кладку стен.
- source_word: וַעֲבִידְתָּא דָךְ
  choice: Эта работа
  rationale: Прямо и без излишнего уточнения передаёт существительное с указательным словом.
- source_word: אָסְפַּרְנָא
  choice: усердно
  rationale: Передаёт энергичное и эффективное ведение работ, сохраняя в примечании возможность значений «тщательно» и «быстро».
- source_word: מִתְעַבְדָא
  choice: ведётся
  rationale: Естественная русская страдательная конструкция для продолжающейся работы.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: и успешно продвигается в их руках
  rationale: Сохраняет как значение успешного хода дела, так и образ «в их руках», не заменяя его истолкованием вроде «благодаря их усилиям».
theological_decisions:
- issue: Обозначение святилища как «дома великого Бога»
  choice: Сохранить «дом великого Бога»
  alternative: «храм великого Бога»
  rationale: «Храм» верно поясняет референт, но источник буквально говорит «дом»; сохранение этого образа не создаёт неясности и избегает ненужного истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством официального донесения. Начальная формула намеренно слегка торжественна; остальной синтаксис сделан ясным и естественным. Сохранён образ дела, которое успешно продвигается «в их руках».
