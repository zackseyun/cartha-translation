  text: אֱדַ֥יִן כְּנֵ֖מָא אֲמַ֣רְנָא לְּ/הֹ֑ם מַן אִנּוּן֙ שְׁמָהָ֣ת גֻּבְרַיָּ֔/א דִּֽי דְנָ֥ה בִנְיָנָ֖/א בָּנַֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/004.yaml
  text: 'Then we told them this: “What are the names of the men who are building this building?”[a]'
translation:
  language: ru
  text: 'Тогда мы сказали им так: «Как зовут мужчин, которые строят это здание?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Тогда мы сказали им так: “Каковы имена мужчин, которые строят это здание?”»'
    reason: Более формальная передача оборота, спрашивающего об именах.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Последовательное наречие вводит следующее действие повествования; «тогда» естественно передаёт временную связь.
- source_word: כְּנֵמָא
  choice: так
  rationale: Наречие означает «так, таким образом» и естественно вводит последующую прямую речь.
- source_word: אֲמַרְנָא לְּהֹם
  choice: мы сказали им
  rationale: Сохранены первое лицо множественного числа и обычное значение глагола «сказать»; вопросительный характер реплики ясен из прямой речи, поэтому не требуется заменять его глаголом «спросили».
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: Как зовут
  rationale: Это естественный современный русский способ спросить об именах людей; он передаёт смысл буквального «каковы имена» без канцелярской тяжеловесности.
- source_word: גֻּבְרַיָּא
  choice: мужчин
  rationale: Существительное имеет явно мужское значение; «мужчин» сохраняет эту конкретность, не заменяя её нейтральным «людей».
- source_word: דִּי
  choice: которые
  rationale: Относительное местоимение связывает мужчин с их продолжающимся действием.
- source_word: דְנָה בִנְיָנָא
  choice: это здание
  rationale: Переданы указательное местоимение и существительное, обозначающее строящееся сооружение.
- source_word: בָּנַיִן
  choice: строят
  rationale: Причастная форма выражает продолжающееся действие; русское настоящее время естественно передаёт этот аспект. Значение «восстанавливают» не добавлено, поскольку его нет в самом слове.
theological_decisions:
- issue: Лицо говорящего в повествовании
  choice: мы сказали
  alternative: они сказали / их спросили
  rationale: Масоретский арамейский текст прямо содержит форму первого лица множественного числа אֲמַרְנָא. Необычность смены повествовательной перспективы не устраняется толкованием или согласованием с контекстом.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной повествовательной интонацией. Формула «Как зовут…?» выбрана ради естественности, тогда как сноска сохраняет более буквальное строение вопроса. Мужской референт исходного גֻּבְרַיָּא передан явно.
