base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: ru
  text: И теперь, что нам сказать[a], Боже наш, после этого? Ведь мы оставили Твои заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что же мы скажем?» Еврейский имперфект допускает более формальную передачу будущим временем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительный ו, так и временно-дискурсивное עתה, не уточняя сверх текста характер перехода.
- source_word: מַה נֹּאמַר
  choice: что нам сказать
  rationale: Естественная русская конструкция передаёт совещательно-риторический оттенок имперфекта первого лица множественного числа и бессилие исповедующегося.
- source_word: אֱלֹהֵינוּ
  choice: Боже наш
  rationale: Русская звательная форма естественно выражает прямое обращение в молитве и сохраняет значение суффикса первого лица множественного числа.
- source_word: אַחֲרֵי זֹאת
  choice: после этого
  rationale: Кратко и идиоматично передаёт временную отсылку к уже описанным греху и бедствию.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание риторической невозможности говорить; в современном русском молитвенном контексте звучит естественнее формального «ибо».
- source_word: עָזַבְנוּ
  choice: мы оставили
  rationale: Сохраняет основной образ עזב — оставления или покидания — и его тяжесть в контексте нарушения заветных обязательств, не заменяя его более узким «нарушили».
- source_word: מִצְוֺתֶיךָ
  choice: Твои заповеди
  rationale: «Заповеди» — точный и укоренившийся русский эквивалент для מצוות в контексте Божьих установлений.
theological_decisions:
- issue: Тон исповедания Ездры
  choice: Риторическое признание вины и невозможности оправдаться перед Богом
  alternative: Простой вопрос о том, что следует сказать дальше
  rationale: Объясняющая часть «ведь мы оставили Твои заповеди» показывает, что вопрос выражает покаянную растерянность, однако перевод не добавляет отсутствующего в еврейском тексте толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи, без архаизма «ибо». Написание местоимения «Твои» с прописной буквы поддерживает уважительный молитвенный регистр.
