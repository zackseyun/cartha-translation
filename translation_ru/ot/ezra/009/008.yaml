source:
  edition: WLC
  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: ru
  text: 'Но теперь, на краткий миг, Яхве, Бог наш, явил нам милость: оставил нам остаток спасшихся и дал нам колышек[a] в Своём святом месте, чтобы Бог наш дал свет нашим глазам[b] и дал нам немного ожить в нашем рабстве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надёжную опору». Еврейское слово буквально означает колышек или крепёжный штырь и создаёт образ чего-то прочно закреплённого.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дать свет нашим глазам» — образ возвращения жизненных сил и надежды.'
    reason: idiom_explanation
  - marker: c
    text: 'Или: «в нашей подневольности», «в нашей зависимости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: милость
  rationale: В конструкции הָיְתָה ... מֵאֵת речь идёт не о мольбе Израиля, а о благосклонности, явленной Богом. «Милость» естественно передаёт этот смысл по-русски, не устраняя оттенка незаслуженного благоволения.
- source_word: פְּלֵיטָה
  choice: уцелевший остаток
  rationale: Сочетание сохраняет как значение спасшихся от гибели людей, так и образ малого остатка общины после изгнания.
- source_word: יָתֵד
  choice: колышек
  rationale: Сохранён конкретный образ прочно вбитого колышка, а переносный смысл устойчивого места или опоры пояснён в сноске.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: в Своём святом месте
  rationale: Прямо передаёт еврейское выражение и допускает храмовый смысл, не сужая его до более конкретного толкования.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: просветлил наши глаза
  rationale: Сохранён образ света для глаз; в данном контексте идиома обозначает возвращение жизненных сил и надежды.
- source_word: מִחְיָה מְעַט
  choice: дал нам немного ожить
  rationale: Естественная русская передача восстановления и сохранения жизни; она удерживает ограничительный оттенок מְעַט — это лишь некоторое оживление, а не полное избавление.
- source_word: בְּעַבְדֻתֵנוּ
  choice: в нашем рабстве
  rationale: «Рабство» сохраняет силу обозначения зависимого, подчинённого положения народа под чужой властью.
- source_word: כִּמְעַט רֶגַע
  choice: на краткий миг
  rationale: Передаёт краткость предоставленной передышки и звучит естественно в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит Тетраграмматон; личное имя сохранено, чтобы не подменять его титулом.
- issue: Смысл образа יָתֵד в святом месте
  choice: сохранить образ «колышка» в основном тексте
  alternative: 'передать только переносный смысл: «надёжная опора» или «прочное место»'
  rationale: Еврейский текст допускает метафорическое понимание устойчивости и закреплённости, но выражает его конкретным образом; перевод не должен молча устранять этот образ.
- issue: Степень восстановления, выраженная מִחְיָה מְעַט
  choice: «немного ожить»
  alternative: «возрождение» или «полное восстановление»
  rationale: Народ всё ещё пребывает в рабстве, поэтому текст говорит об ограниченном даровании жизни и передышке, а не о завершённом избавлении.
translation_notes:
  register: Современный литературный русский с молитвенно-библейской торжественностью без архаических форм. Порядок фраз слегка сглажен для естественности, но сохранены конкретные образы, краткость передышки и напряжение между частичным оживлением и продолжающимся рабством.
