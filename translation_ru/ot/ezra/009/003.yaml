lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: Как только я услышал
  rationale: Сочетание союза, временного предлога и инфинитивной конструкции вводит временное придаточное; перевод передаёт непосредственность реакции, естественно звуча по-русски.
- source_word: הַדָּבָר הַזֶּה
  choice: об этом
  rationale: דָּבָר может означать слово, сообщение, дело или обстоятельство. В контексте местоименная формулировка естественно отсылает к только что сообщённому, не сужая значение до одних лишь слов.
- source_word: קָרַעְתִּי
  choice: я разорвал
  rationale: Глагол обозначает разрывание одежды как традиционное выражение скорби и ужаса; «разорвал» точно и стилистически уместно.
- source_word: בִּגְדִי
  choice: свою одежду
  rationale: בֶּגֶד — общее обозначение предмета одежды. Русское собирательное «одежду» здесь звучит естественнее буквального единственного «одеяние» и сохраняет отличие от следующего מְעִיל.
- source_word: וּמְעִילִי
  choice: и верхнее одеяние
  rationale: מְעִיל обозначает верхнюю одежду, мантию или накидку; «верхнее одеяние» понятно современному читателю и отличает этот предмет от общего בֶּגֶד.
- source_word: וָאֶמְרְטָה
  choice: вырвал
  rationale: Глагол описывает насильственное выдёргивание волос. «Вырвал» кратко и ясно передаёт физическое действие.
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: волосы на голове и в бороде
  rationale: Предлог מִן допускает партитивный смысл — волосы были вырваны из общей массы, а не обязательно целиком. Русская формулировка естественна и сама по себе не требует понимать действие как удаление всех волос.
- source_word: וָאֵשְׁבָה
  choice: и сел
  rationale: Простой глагол «сел» точно передаёт последовательность действий без лишнего уточнения.
- source_word: מְשׁוֹמֵם
  choice: потрясённый
  rationale: Причастие выражает состояние оцепенения, ужаса и опустошённости. «Потрясённый» естественно передаёт сильный эмоциональный шок, не сводя его к нейтральному удивлению.
