base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: ru
  text: Когда я услышал об этом[a], я разорвал свою одежду и верхнее одеяние, вырвал часть волос с головы и из бороды[b] и сел в оцепенении.
