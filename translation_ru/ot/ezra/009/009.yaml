  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: ru
  text: Хотя мы и рабы, Бог наш не оставил нас в нашем рабстве, но явил нам верную любовь[a] в глазах царей Персии, чтобы даровать нам оживление, воздвигнуть дом нашего Бога, восстановить его развалины и дать нам ограду[b] в Иудее и Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неизменную любовь», «милость», «благоволение» или «заветную верность». Еврейское חֶסֶד выражает верную, милостивую любовь и преданность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стену», «защитное ограждение». Здесь этот образ может обозначать не только буквальную стену, но и безопасность и защиту, дарованные Иудее и Иерусалиму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: рабы / в рабстве нашем
  rationale: Сохраняется смысл подневольного положения под властью империи и однокоренная связь двух еврейских слов.
- source_word: עֲזָבָנוּ
  choice: не оставил нас
  rationale: Естественная современная русская передача значения «оставить, покинуть»; в контексте молитвы выражение сохраняет заветный оттенок.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: явил нам верную любовь
  rationale: חֶסֶד обозначает деятельную, неизменную милость и преданную любовь. Формулировка передаёт богословскую насыщенность слова, не вводя в основной текст отсутствующее в нём существительное «завет».
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: перед царями Персии
  rationale: Сохраняет пространственно-реляционную формулировку לִפְנֵי и допускает смысл благоволения в присутствии или в глазах персидских царей.
- source_word: מִחְיָה
  choice: оживление
  rationale: Существительное может обозначать сохранение жизни или возвращение жизненных сил; «оживление» сохраняет оба оттенка в контексте восстановления общины.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: воздвигнуть дом нашего Бога
  rationale: «Воздвигнуть» передаёт образ поднятия и естественно описывает восстановление храма; «дом нашего Бога» сохраняет исходную метафору.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: восстановить его развалины
  rationale: Каузатив глагола выражает поставление или восстановление, а חָרְבוֹת — разрушенные места или развалины. Русская формулировка ясна и не создаёт неестественного образа буквального «поставления развалин».
- source_word: גָדֵר
  choice: ограду
  rationale: Слово обозначает ограждение, стену или защитную преграду. «Ограда» сохраняет конкретный образ и одновременно допускает метафорический смысл защиты.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִָם
  choice: в Иудее и Иерусалиме
  rationale: Прямо передаёт местное значение предлога и не превращает образ ограды в утверждение о стене, буквально окружающей всю Иудею.
theological_decisions:
- issue: Передача חֶסֶד
  choice: верная любовь
  alternative: неизменная любовь; милость; благоволение; заветная верность
  rationale: Выбранное выражение передаёт и милосердие, и постоянную преданность Бога своему народу, но не уточняет сверх текста, что речь непременно идёт о техническом понятии заветной верности. Значимые альтернативы сохранены в сноске.
- issue: Характер גָדֵר
  choice: ограда
  alternative: стена; защитное ограждение
  rationale: Конкретный образ сохранён, однако слово не ограничено буквальной городской стеной и может обозначать дарованную общине безопасность. Эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Синтаксис упрощён до двух предложений для ясности, при этом сохранена цепочка целевых инфинитивов. Формы «рабы» и «рабство» намеренно оставлены сильными; архаизмы вроде «пред» и искусственные кальки наподобие «простёр милость» не используются.
