base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: ru
  text: Потому что они взяли их дочерей в жёны — себе и своим сыновьям[a], и святое семя смешалось с народами этих земель[b]. А начальники и правители были главными виновниками этой неверности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взяли из их дочерей себе и своим сыновьям».'
    reason: lexical_alternative
  - marker: b
    text: «Святое семя» можно также перевести как «святое потомство». Еврейское выражение сохраняет язык заветной преемственности.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «рука начальников и правителей была первой в этой неверности». Это еврейская идиома, указывающая на их ведущее участие и основную ответственность.'
    reason: idiom_clarification
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: брали их дочерей
  rationale: Глагол буквально означает «брать», а в данном контексте подразумевает взятие женщин в жёны. Предлог מִן имеет партитивный оттенок («из числа их дочерей»), который по-русски естественно передаётся без обязательного добавления слова «некоторых».
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: себе и своим сыновьям
  rationale: Передаёт значение получателя и ясно показывает, что речь идёт о браках как самих мужчин, так и их сыновей.
- source_word: וְהִתְעָרְבוּ
  choice: смешалось
  rationale: Форма хитпаэль выражает смешение; согласование в единственном числе следует за подлежащим זֶרַע («семя»).
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: святое семя
  rationale: Формально близкая передача сохраняет сильный заветно-родовой образ оригинала и не подменяет его расовой интерпретацией.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: с народами этих земель
  rationale: Предлог передаёт участие в смешении, а множественное число «земель» сохраняет особенности послепленного исторического контекста.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: начальников и правителей
  rationale: Современная и достаточно широкая передача двух обозначений административных руководителей без необоснованного приписывания им царского статуса.
- source_word: מַּעַל
  choice: неверности
  rationale: Слово обозначает нарушение верности, особенно верности завету; «неверность» сохраняет нравственный и заветный смысл.
- source_word: וְיַד ... רִאשׁוֹנָה
  choice: рука ... была первой
  rationale: Сохранена еврейская метафора деятельного участия и ведущей вины; примечание поясняет её смысл для современного читателя.
theological_decisions:
- issue: Смысл выражения «святое семя» в контексте смешанных браков
  choice: Сохранить выражение «святое семя» как заветно-родовой образ без дополнительного истолкования.
  alternative: Передать как «святое потомство» либо истолковать выражение как утверждение этнической или расовой чистоты.
  rationale: Оригинал говорит об обособленности святой общины в послепленном заветном контексте. Перевод не должен ни ослаблять этот образ, ни привносить в него позднейшие расовые категории.
- issue: Ответственность руководителей
  choice: Сохранить образ руки, которая «была первой», и пояснить, что руководители несли главную ответственность.
  alternative: 'Полностью раскрыть идиому в тексте: «начальники и правители были главными виновниками».'
  rationale: Так сохраняются и выразительность еврейской идиомы, и её смысл, раскрытый в примечании, без сведения слова רִאשׁוֹנָה лишь к хронологической первоочерёдности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Необычные, но значимые образы «святое семя» и «рука ... была первой» сохранены, а их смысл разъяснён в примечаниях.
