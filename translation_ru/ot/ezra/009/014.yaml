source:
  edition: WLC
  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: ru
  text: Неужели мы снова станем нарушать Твои заповеди и вступать в брачные союзы с народами, совершающими эти мерзости?[a] Разве Ты не разгневаешься на нас, пока не истребишь нас полностью, так что не останется ни остатка, ни уцелевшего?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с народами этих мерзостей»; вероятно, имеются в виду народы, для которых характерны такие мерзкие обычаи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «так, что не останется ни остатка, ни спасшегося бегством».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: неужели мы снова станем
  rationale: שוב буквально означает «возвращаться», но вместе с последующими инфинитивами здесь выражает возобновление прежнего непослушания; такая передача естественно звучит в риторическом вопросе.
- source_word: לְהָפֵר מִצְוֺתֶיךָ
  choice: нарушать Твои заповеди
  rationale: הפר в правовом и заветном контексте означает нарушать установленное обязательство; «заповеди» сохраняет библейскую и заветную окраску מצוה.
- source_word: וּלְהִתְחַתֵּן
  choice: и вступать в браки
  rationale: Форма хитпаэль от חתן обозначает установление брачных связей между группами. Русское выражение передаёт смысл без неестественного оттенка слова «смешанные».
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: с народами, совершающими эти мерзости
  rationale: 'Буквально: «с народами этих мерзостей». Развёрнутая формулировка передаёт вероятную характеристику народов по их практикам, не превращая этническую принадлежность в сущностное осуждение; буквальная конструкция отмечена в сноске.'
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: Разве Ты не разгневаешься на нас
  rationale: אנף обозначает сильный гнев. «Разгневаешься» сохраняет торжественный молитвенный регистр и ожидаемый утвердительный ответ риторического вопроса.
- source_word: עַד כַּלֵּה
  choice: и не истребишь нас так
  rationale: כלה здесь выражает доведение уничтожения до конца. Конструкция с «так, что» естественно связывает действие с последующим результатом לְאֵין.
- source_word: לְאֵין שְׁאֵרִית וּפְלֵיטָה
  choice: что не останется ни остатка, ни уцелевшего
  rationale: לְאֵין вводит результат — полное отсутствие оставшихся. «Остаток» сохраняет важную библейскую лексику, а «уцелевший» передаёт конкретное значение פליטה в параллельной паре.
theological_decisions:
- issue: Характеристика народов через הַתֹּעֵבוֹת
  choice: 'Связать осуждение с совершаемыми мерзостями: «с народами, совершающими эти мерзости».'
  alternative: «с народами этих мерзостей»
  rationale: Еврейская конструкция сжата и допускает буквальную передачу, однако в контексте речь идёт о религиозно-нравственных практиках. Основной текст проясняет этот вероятный смысл, а сноска сохраняет формальную неоднозначность.
- issue: Сохранение понятия «остаток»
  choice: «ни остатка, ни уцелевшего»
  alternative: «никого из оставшихся или спасшихся»
  rationale: «Остаток» — значимый библейский термин в контексте суда и сохранения народа; при этом пара с «уцелевшим» остаётся понятной современному читателю.
- issue: Степень окончательности Божьего суда
  choice: «не истребишь нас так, что не останется…»
  alternative: «не будешь гневаться на нас до полного уничтожения»
  rationale: Передача сохраняет напряжение риторического вопроса и выраженный в עַד כַּלֵּה результат полного уничтожения, не добавляя утверждения о том, что такой исход непременно наступит.
translation_notes:
  register: Современный литературный русский язык с достоинством покаянной молитвы. Местоимения, обращённые к Богу, написаны с прописной буквы. Риторические вопросы сохранены; синтаксис слегка развёрнут ради ясности при сохранении смыслового напряжения оригинала.
