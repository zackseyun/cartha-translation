base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: ru
  text: 'которые Ты заповедал через Своих слуг — пророков, сказав: «Земля, в которую вы входите, чтобы овладеть ею, — земля нечистая[a] из-за нечистоты народов тех земель, из-за их мерзостей, которыми они наполнили её своей нечистотой от края до края[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля, полная нечистоты». Еврейское слово может обозначать осквернение как в ритуальном, так и в нравственном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от устья до устья»; еврейская идиома означает «целиком, от одного края до другого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ הַנְּבִיאִים
  choice: через Своих слуг — пророков
  rationale: Еврейская идиома «рукой» обозначает посредничество. В современном русском «через» естественно передаёт значение, а приложение «пророков» сохраняет связь между слугами и пророками.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: Передаёт значение вступления во владение землёй, не сводя глагол исключительно к юридическому наследованию.
- source_word: אֶרֶץ נִדָּה
  choice: земля нечистая
  rationale: Сохраняет сильный язык осквернения и допускает как ритуальные, так и нравственные оттенки исходного термина.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: из-за нечистоты народов тех земель
  rationale: Предлог понят причинно; множественное «земель» сохранено, а указательное «тех» делает сочетание естественным по-русски.
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: из-за их мерзостей
  rationale: «Мерзости» сохраняет сильную нравственно-религиозную оценку תועבה и библейскую торжественность без уточнения конкретных практик.
- source_word: מִפֶּה אֶל־פֶּה
  choice: от края до края
  rationale: Передаёт пространственную идиому, буквально «от устья до устья», то есть полную протяжённость земли.
- source_word: בְּטֻמְאָתָם
  choice: своей нечистотой
  rationale: Возвратное притяжательное местоимение ясно относит нечистоту к народам; термин сохраняет намеренный повтор темы осквернения.
theological_decisions:
- issue: Характер нечистоты земли
  choice: Сохранить лексику нечистоты и мерзостей без сведения её только к ритуальному или только к нравственному смыслу.
  alternative: Передать весь фрагмент исключительно как описание нравственного развращения либо исключительно как ритуальную нечистоту.
  rationale: נִדָּה, טֻמְאָה и תּוֹעֵבָה совместно несут ритуальные и нравственно-заветные оттенки; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис разделён на два предложения внутри цитаты ради ясности, при сохранении логических связей оригинала.
