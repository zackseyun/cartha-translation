  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: ru
  text: 'И сказал я: «Боже мой! Мне стыдно, и я посрамлён поднять лицо к Тебе, Боже мой, потому что беззакония наши умножились выше нашей головы[a], а вина наша возросла до небес».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выше наших голов». В еврейском тексте стоит единственное число «голова», употреблённое в собирательном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: И сказал я
  rationale: Передаёт повествовательное продолжение с еврейским waw-консекутивом; порядок слов сохраняет возвышенный, но естественный библейский регистр.
- source_word: בֹּשְׁתִּי וְנִכְלַמְתִּי
  choice: Мне стыдно и совестно
  rationale: Два близких выражения сохраняют усиление исходного текста. Настоящее время естественно передаёт состояние Ездры в момент молитвы; «совестно» выражает нравственный стыд без тяжеловесного «унижен».
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: поднять лицо к Тебе
  rationale: Сохраняет явный образ лица и направление обращения к Богу, не заменяя его глазами или взглядом.
- source_word: עֲוֺנֹתֵינוּ
  choice: беззакония наши
  rationale: Передаёт нравственную тяжесть עָוֹן и позволяет отличить этот термин от последующего אַשְׁמָה — «вина».
- source_word: רָבוּ
  choice: умножились
  rationale: Сохраняет динамическое значение увеличения и накопления, а не только статическое «многочисленны».
- source_word: לְמַעְלָה רֹאשׁ
  choice: выше головы
  rationale: Близко передаёт вертикальную метафору и сохраняет собирательное единственное число «голова», как в масоретском тексте.
- source_word: אַשְׁמָתֵנוּ
  choice: вина наша
  rationale: В контексте речь идёт о виновности, а не о жертве повинности; перевод также сохраняет отличие от עֲוֺנֹתֵינוּ.
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: возросла до небес
  rationale: Естественно по-русски передаёт гиперболический образ роста до небес и еврейскую форму множественного числа.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Естественная русская форма прямого обращения; повтор сохранён ради эмоционального и риторического акцента оригинала.
