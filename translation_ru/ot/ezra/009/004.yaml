  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: ru
  text: И собрались ко мне все, кто трепетал при словах Бога Израиля из-за неверности изгнанников[a], а я сидел ошеломлённый до вечернего приношения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за неверности общины возвратившихся из изгнания».'
    reason: lexical_alternative
  - marker: b
    text: «Вечернее приношение» — евр. минха; это слово нередко обозначает хлебное приношение, а здесь также указывает на время регулярного вечернего храмового приношения.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: собрались
  rationale: Нифаль глагола אסף здесь описывает схождение людей к Ездре; возвратное «собрались» естественно по-русски и не переуточняет пассивный оттенок формы.
- source_word: כֹּל חָרֵד
  choice: все, кто трепетал
  rationale: Единственное число חָרֵד после כֹּל имеет собирательное значение. «Все, кто трепетал» передаёт благоговейный страх и звучит естественно в современном русском языке.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: перед словами Бога Израиля
  rationale: Предлог ב при חרד указывает на предмет или причину трепета. «Перед словами» сохраняет множественное число דִבְרֵי и выражает благоговейную реакцию на Божьи слова.
- source_word: עַל מַעַל הַגּוֹלָה
  choice: из-за неверности переселенцев
  rationale: מַעַל обозначает вероломное нарушение верности, особенно по отношению к Богу; «неверность» сохраняет нравственно-заветный оттенок. הַגּוֹלָה здесь относится к общине вернувшихся из изгнания; «переселенцы» передаёт людей, а не абстрактное состояние плена.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: сидел потрясённый
  rationale: Сочетание причастий описывает продолжающееся сидячее положение Ездры и его оцепенение от ужаса. «Потрясённый» понятно современному читателю и не вводит отсутствующего в контексте значения физического опустошения.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: до вечернего приношения
  rationale: מִנְחָה может означать хлебное приношение, а здесь также служит обозначением времени регулярного вечернего храмового приношения. Общая формулировка сохраняет эту широту.
theological_decisions:
- issue: Заветный оттенок מַעַל
  choice: неверность
  alternative: преступление; вероломство
  rationale: «Неверность» выражает нарушение верности Богу, не сводя его к общему правонарушению и не привнося более поздние богословские категории.
- issue: Значение הַגּוֹלָה
  choice: переселенцы
  alternative: изгнанники; община возвратившихся из плена
  rationale: Слово обозначает общину людей, переживших изгнание и вернувшихся. «Переселенцы» естественно по-русски, тогда как более буквальное «изгнание» могло бы ошибочно обозначать состояние или событие.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность еврейского текста, но остаётся естественным; культовые и заветные понятия переданы без конфессионального уточнения.
