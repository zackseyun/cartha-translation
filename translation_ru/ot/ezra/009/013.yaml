  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: ru
  text: И после всего, что постигло нас за наши злые дела и за нашу великую вину, — хотя Ты, Боже наш, наказал нас меньше, чем заслуживали наши беззакония,[a] и даровал нам такой остаток,[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейское выражение говорит, что Бог удержал кару ниже меры наших беззаконий; иначе: «пощадил нас больше, чем заслуживала наша вина».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «таких уцелевших»; возможно также: «такое избавление». Еврейское слово может обозначать спасение от бедствия или людей, которые уцелели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: И после
  rationale: Сохраняет соединительный союз и продолжение молитвы Ездры.
- source_word: כָּל הַבָּא עָלֵינוּ
  choice: всего, что постигло нас
  rationale: Естественно передаёт еврейское выражение о бедствиях, обрушившихся на народ.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים
  choice: за наши злые дела
  rationale: Предлог ב имеет здесь причинное значение; «за» кратко и ясно связывает бедствия с поступками народа.
- source_word: וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: и за нашу великую вину
  rationale: אַשְׁמָה обозначает объективную виновность, а не только чувство вины.
- source_word: כִּי
  choice: ведь
  rationale: 'Допускает пояснительно-уступительный оттенок: при всей тяжести вины Бог проявил милость; не делает синтаксическую связь чрезмерно однозначной.'
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: наказал нас меньше, чем заслуживали наши беззакония
  rationale: 'Передаёт смысл идиомы: Бог удержал заслуженную кару и не воздал в полной мере, соответствующей вине.'
- source_word: עָוֺן
  choice: беззакония
  rationale: Сохраняет тяжесть нравственной виновности и позволяет отличить это слово от אַשְׁמָה — «вина».
- source_word: וְנָתַתָּה לָּנוּ
  choice: и сохранил для нас
  rationale: В сочетании с פְּלֵיטָה по-русски естественно выражает дарование Богом уцелевшей части народа.
- source_word: פְּלֵיטָה כָּזֹאת
  choice: таких уцелевших
  rationale: פְּלֵיטָה может обозначать уцелевших после суда; формулировка не навязывает исключительно богословский термин «остаток».
theological_decisions:
- issue: Божья милость по отношению к заслуженному суду
  choice: наказал нас меньше, чем заслуживали наши беззакония
  alternative: пощадил нас сверх того, чего позволяли наши беззакония
  rationale: Выбранный вариант ясно сохраняет одновременно реальность суда и его милостивое ограничение, не добавляя позднейшей догматической схемы.
- issue: Значение פְּלֵיטָה в послепленном контексте
  choice: таких уцелевших
  alternative: такой остаток; такое избавление
  rationale: «Уцелевшие» непосредственно передаёт сохранённых после суда людей и сохраняет лексическую многозначность в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис оставлен незавершённым, поскольку стих образует условно-вопросительный период, продолжающийся в Езд 9:14.
