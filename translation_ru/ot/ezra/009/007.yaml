source:
  edition: WLC
  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: ru
  text: Со дней наших отцов и доныне на нас лежит тяжкая вина. За наши беззакония мы, наши цари и наши священники были отданы в руки царей земель — под меч, в плен, на разграбление и на посрамление[a], как и ныне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на стыд лица», то есть на открытый позор и унижение.'
    reason: Лексическая альтернатива и пояснение еврейского образного выражения.
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: Со дней наших отцов
  rationale: Предлог מִן с יָמִים обозначает исходную точку во времени; русская формула сохраняет историческую преемственность и библейское достоинство.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: мы несём великую вину
  rationale: אַשְׁמָה означает объективную виновность, а не только чувство стыда. Русское «несём вину» естественно передаёт продолжающееся состояние без добавления неявной связки во временной форме.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и доныне
  rationale: Передаёт непрерывность вплоть до настоящего дня кратко и естественно для современного литературного русского языка.
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: За наши беззакония
  rationale: Предлог ב здесь имеет причинное значение, а עָוֹן обозначает нравственное беззаконие и связанную с ним вину; «за» ясно выражает причину наказания.
- source_word: נִתַּנּוּ
  choice: были отданы
  rationale: Страдательная форма породы нифаль от נָתַן передаётся русской страдательной конструкцией без уточнения действующего лица.
- source_word: בְּיַד מַלְכֵי הָאֲרָצוֹת
  choice: в руки царей других земель
  rationale: Сохранён образ «в руки», означающий передачу во власть. Добавление «других» естественно проясняет контекстуальное значение множественного אֲרָצוֹת как чужих стран, а не всей земли.
- source_word: בַּחֶרֶב
  choice: под меч
  rationale: Краткая русская формула сохраняет образ гибели и разорения от войны.
- source_word: בַּשְּׁבִי
  choice: в плен
  rationale: שְׁבִי прямо обозначает плен; этот вариант современнее и естественнее отвлечённого «в пленение».
- source_word: וּבַבִּזָּה
  choice: на разграбление
  rationale: Передаёт вражеское расхищение имущества и синтаксически согласуется с рядом бедствий.
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: на посрамление
  rationale: Идиома буквально означает «стыд лица» и указывает на явное, публичное унижение; основной текст передаёт смысл естественным русским словом, а буквальный образ отмечен в сноске.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: как это и есть ныне
  rationale: Формула соотносит описанное наказание с нынешним положением общины и сохраняет указательную силу исходного выражения.
theological_decisions:
- issue: Различение אַשְׁמָה и עָוֹן в покаянной речи
  choice: Передать как «вина» и «беззакония» соответственно
  alternative: Оба термина передать общим словом «грех»
  rationale: Различение сохраняет сочетание объективной виновности и совершённых беззаконий, не вводя дополнительной конфессиональной трактовки.
- issue: Корпоративная солидарность в исповедании
  choice: Сохранить ряд «мы, наши цари и наши священники»
  alternative: Перестроить фразу так, чтобы отделить народ от его руководителей
  rationale: Еврейский текст прямо объединяет общину, царей и священников как участников общей исторической вины и суда.
- issue: Неуказанный деятель в נִתַּנּוּ
  choice: Сохранить страдательное «были отданы» без называния деятеля
  alternative: 'Уточнить: «Бог отдал нас»'
  rationale: Хотя контекст подразумевает Божий суд, в самом предложении деятель грамматически не назван; перевод не должен устранять эту формальную сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены лаконичность исповедания, параллельный перечень бедствий и корпоративное «мы»; архаизмы используются лишь там, где они остаются прозрачными («доныне», «посрамление»).
