  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: ru
  text: О Яхве, Боже Израиля! Ты праведен, ибо мы остались уцелевшим остатком и поныне. Вот мы перед Тобой в своей вине, ибо из-за этого никто не может устоять перед Тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении употреблена традиционная русская передача тетраграмматона «Господь» в звательной форме; примечание сообщает личное имя.
- source_word: צַדִּיק
  choice: праведен
  rationale: Передаёт широкое нравственно-судебное значение слова, не сужая его только до справедливости суда.
- source_word: נִשְׁאַרְנוּ פְלֵיטָה
  choice: мы уцелели как остаток
  rationale: Сочетание сохраняет идею людей, оставшихся после бедствия и избежавших гибели, а также образ остатка.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Естественная русская передача выражения о нынешнем, наблюдаемом положении; слегка возвышенный оборот уместен в молитве.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: Вот мы пред Тобою
  rationale: «Вот» передаёт указательное הִנְנוּ, а «пред Тобою» сохраняет торжественный молитвенный регистр.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: с нашей виной
  rationale: Описывает состояние народа, представшего перед Богом обременённым виной.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל זֹאת
  choice: и потому никто из нас не может устоять пред Тобою
  rationale: Передаёт причинное отношение и еврейскую безличную конструкцию как невозможность виновных выдержать Божье присутствие; «из нас» делает контекстуальный субъект явным, не превращая высказывание в универсальное утверждение обо всех людях.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господи с примечанием «Евр. Яхве»
  alternative: Яхве
  rationale: Основной текст следует укоренённой русской библейской и молитвенной норме, а примечание сохраняет прозрачность личного заветного имени в оригинале.
- issue: Связь Божьей праведности с уцелевшим остатком
  choice: «Ты праведен, ведь мы уцелели как остаток»
  alternative: «Ты справедлив, хотя мы уцелели»
  rationale: כִּי естественнее понимать как пояснительно-причинное «ведь/ибо»; текст оставляет рядом Божью праведность, сохранение остатка и признание вины, не разрешая их богословское напряжение.
- issue: Субъект невозможности устоять перед Богом
  choice: никто из нас
  alternative: никто
  rationale: Безличное еврейское выражение относится прежде всего к исповедующему вину сообществу; контекстуальное ограничение не превращает его в отвлечённое всеобщее положение.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Формы «пред Тобою» и прописные местоимения поддерживают возвышенный регистр, не делая синтаксис архаичным.
