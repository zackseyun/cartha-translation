source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: ru
  text: А теперь не отдавайте ваших дочерей за их сыновей и не берите их дочерей за ваших сыновей. Никогда не ищите для них мира и благополучия[a], чтобы вы укрепились, могли пользоваться благами этой земли и навеки оставить её в наследие вашим сыновьям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не ищите их мира и их добра вовек».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте объект глагола не назван; по контексту подразумевается земля. Возможный перевод: «и навеки передали её в наследие вашим сыновьям».'
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּנוֹתֵיכֶם אַל־תִּתְּנוּ לִבְנֵיהֶם
  choice: не отдавайте ваших дочерей за их сыновей
  rationale: Глагол «отдавать» с предлогом «за» естественно передаёт по-русски брачный смысл еврейского выражения и сохраняет его краткость.
- source_word: וּבְנֹתֵיהֶם אַל־תִּשְׂאוּ לִבְנֵיכֶם
  choice: не берите их дочерей за ваших сыновей
  rationale: נשא в этом контексте означает брать в жёны; формулировка сохраняет параллелизм двух запретов и прямо передаёт לִבְנֵיכֶם.
- source_word: וְלֹא תִדְרְשׁוּ שְׁלֹמָם וְטוֹבָתָם עַד־עוֹלָם
  choice: никогда не ищите для них мира и благополучия
  rationale: דרש передано как «искать»; שׁלום сохраняет прямое значение «мир», а טובה в данном сочетании — более широкое «благополучие». «Никогда» естественно выражает абсолютную длительность запрета עַד־עוֹלָם.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: чтобы вы укрепились
  rationale: Форма חזק допускает значение «стать сильными, укрепиться»; русский возвратный глагол сохраняет динамический оттенок и целевое значение לְמַעַן.
- source_word: וַאֲכַלְתֶּם אֶת־טוּב הָאָרֶץ
  choice: вкушали блага этой земли
  rationale: «Вкушать» сохраняет конкретный образ еврейского «есть», тогда как множественное «блага» естественно передаёт собирательное טוּב и подразумеваемое изобилие земли.
- source_word: וְהוֹרַשְׁתֶּם לִבְנֵיכֶם
  choice: передали её в наследие вашим сыновьям
  rationale: Каузативная форма ירש означает дать унаследовать или передать во владение. Местоимение «её» соотнесено с землёй, естественным подразумеваемым объектом, а примечание отмечает его отсутствие в еврейском тексте.
- source_word: עַד־עוֹלָם
  choice: навеки
  rationale: В заключительной фразе выражение обозначает непреходящий характер наследования и естественно передаётся наречием «навеки».
theological_decisions:
- issue: Запрет смешанных браков и поиска благополучия окружающих народов в послепленном контексте завета
  choice: Передать повеление прямо, без смягчения его суровости и без расширения до универсального предписания об отношении ко всем чужеземцам.
  alternative: Истолковать текст как общее предостережение против вредных духовных связей либо как вневременной запрет отношений с людьми иной этнической принадлежности.
  rationale: Стих относится к конкретному историческому и заветному контексту Ездры. Перевод должен сохранять формулировку текста, не подменяя её ни обобщающей моралью, ни более широкой доктриной.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм запретов сохранён; архаизмы сведены к минимуму, но «вкушали» оставлено ради конкретного образа исходного текста.
