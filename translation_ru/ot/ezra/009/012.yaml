  source_fidelity: 'Смысл и структура еврейского текста в целом переданы точно: сохранены взаимные брачные запреты, «мир и благо» окружающих народов, целевое следствие и указание на сыновей. Не названный в еврейском тексте объект при וְהוֹרַשְׁתֶּם обоснованно передан местоимением с примечанием; наиболее вероятная отсылка — к земле.'
  naturalness: Фраза «чтобы вы укрепились, вкушали блага этой земли и навеки передали…» понятна, но сочетание личной формы «укрепились» с формами «вкушали» и «передали» без повторения «чтобы» звучит синтаксически неровно. Кроме того, «вкушали» несколько архаизирует современный литературный регистр. Координация инфинитивов после «чтобы» делает фразу естественнее, не меняя смысла.
  terminology: «Отдавать ... за», «брать ... за», «мир и благополучие», «наследие» и «сыновья» удачны. Терминологической или богословской корректировки не требуется; текст не должен расширяться до универсального предписания.
