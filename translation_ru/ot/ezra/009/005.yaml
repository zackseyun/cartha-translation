  text: וּ/בְ/מִנְחַ֣ת הָ/עֶ֗רֶב קַ֚מְתִּי מִ/תַּֽעֲנִיתִ֔/י וּ/בְ/קָרְעִ֥/י בִגְדִ֖/י וּ/מְעִילִ֑/י וָֽ/אֶכְרְעָ/ה֙ עַל בִּרְכַּ֔/י וָ/אֶפְרְשָׂ֥/ה כַפַּ֖/י אֶל יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: ru
  text: Во время вечернего приношения[a] я поднялся после поста; одежда и плащ на мне были разорваны. Я опустился на колени и простёр руки к Яхве, моему Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, точнее: «вечернего хлебного приношения». Еврейское слово часто обозначает хлебное приношение, но здесь может шире указывать на время вечернего жертвоприношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: Во время вечернего приношения
  rationale: מִנְחָה может означать дар или хлебное приношение; в данном храмовом контексте всё выражение обозначает время регулярного вечернего приношения. Более узкое значение сохранено в сноске.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: я поднялся после поста
  rationale: קום означает «встать, подняться», а תַּעֲנִית здесь, вероятнее всего, обозначает пост как выражение скорби и смирения. Предлог מִן передаёт выход из этого состояния; по-русски естественно «после поста».
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: одежда и плащ на мне были разорваны
  rationale: Конструкция с בְּ при инфинитиве выражает сопутствующее обстоятельство. «Одежда» и «плащ» сохраняют различие между בֶּגֶד и מְעִיל и показывают, что Ездра оставался в разорванных в знак скорби вещах.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: Я опустился на колени
  rationale: כרע означает преклониться или встать на колени. Выражение естественно по-русски и передаёт молитвенную позу без добавления отсутствующей в тексте идеи внезапного падения.
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: и простёр руки
  rationale: פרשׂ с כף описывает раскрытие и протягивание ладоней в молитве. «Простёр руки» — понятное и dignified русское обозначение этого жеста.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: к Яхве, моему Богу
  rationale: Предлог אֶל указывает направление молитвенного жеста, а имя יהוה передано как «Яхве», сохраняя личное имя Бога в исходном тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон. Транслитерация «Яхве» сохраняет различие между личным именем и титулом אֲדֹנָי и не вводит конфессионально обусловленную замену.
- issue: Значение תַּעֲנִית
  choice: пост
  alternative: самоизнурение; смирение себя
  rationale: Слово связано с самоумалением и скорбью, но в данном повествовательном контексте конкретно указывает на пост. Более отвлечённые варианты могли бы неоправданно скрыть подразумеваемую практику.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Простёр» сохраняет достоинство молитвенной сцены, оставаясь понятным; синтаксис разделён на два предложения для ясности. Маркер сноски поставлен при выражении, к которому относится примечание.
