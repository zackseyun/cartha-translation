  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: ru
  text: 'Когда всё это было завершено, ко мне подошли начальники и сказали: «Народ Израиля, священники и левиты не отделились от народов земель, поступая по мерзостным обычаям[a] хананеев, хеттов, ферезеев, иевусеев, аммонитян, моавитян, египтян и амореев».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно их мерзостям». Еврейское слово имеет сильную окраску и часто обозначает религиозно неприемлемые, в том числе идолопоклоннические, обычаи.'
    reason: Лексическая альтернатива сохраняет более буквальную конструкцию и поясняет силу термина תּוֹעֵבוֹת.
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: Когда всё это было завершено
  rationale: Сочетание כְּ с инфинитивом כַּלּוֹת образует придаточное времени. Пассивная формулировка сохраняет результативный оттенок и не добавляет отсутствующего в еврейском тексте наречия «теперь».
- source_word: נִגְּשׁוּ אֵלַי
  choice: ко мне подошли
  rationale: Nifal глагола נגשׁ здесь обозначает приближение; «подошли» естественно передаёт это движение в современном русском повествовании.
- source_word: הַשָּׂרִים
  choice: начальники
  rationale: שׂרים — лица, наделённые властью или руководящими полномочиями. «Начальники» соответствует древнему административному контексту и не привносит наследственного титула «князья».
- source_word: לֹא נִבְדְּלוּ
  choice: не отделились
  rationale: Nifal глагола בדל выражает отделение или обособление. Русская возвратная форма передаёт значение без уточнения мотивов или конкретного способа отделения.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: от народов этих земель
  rationale: Сохранены оба множественных числа — «народы» и «земли»; указательное «этих» естественно обозначает упомянутый региональный контекст, не превращая земли в современные государства.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: и следуют их мерзостным обычаям
  rationale: Префикс כְּ допускает значение соответствия или следования образцу. Такая формулировка по-русски ясно связывает отсутствие отделения с усвоением осуждаемых практик; сильная религиозно-нравственная окраска תועבות сохранена словом «мерзостным».
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: хананеев, хеттов, ферезеев, иевусеев, аммонитян, моавитян, египтян и амореев
  rationale: Еврейские формы — собирательные названия народов в единственном числе; в русском перечислении они естественно передаются названиями этнических групп во множественном числе.
theological_decisions:
- issue: Сила религиозно-нравственного термина תועבות
  choice: мерзостным обычаям
  alternative: отвратительным обычаям; мерзостям
  rationale: «Мерзостным» сохраняет резкость обвинения и религиозный оттенок слова, а «обычаям» показывает, что речь идёт о практиках, не ограничивая их исключительно идолопоклонством.
- issue: Объём обвинения
  choice: одно сказуемое относится к народу Израиля, священникам и левитам
  alternative: понимать священников и левитов как второстепенно добавленные группы
  rationale: Еврейский синтаксис координирует все три группы как общее подлежащее при לֹא נִבְדְּלוּ; перевод не сужает обвинение до мирян.
- issue: Связь перечисленных народов с выражением מֵעַמֵּי הָאֲרָצוֹת
  choice: перечень помещён непосредственно после «народов этих земель»
  alternative: связывать перечень непосредственно с «мерзостными обычаями»
  rationale: Дательный показатель לַ перед первым этнонимом допускает пояснительное перечисление. Перестановка в русском делает референтов «народов» прозрачными, не исключая того, что последующее обвинение относится к их обычаям.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён для ясного чтения, но последовательность событий, административный статус говорящих, полный охват обвиняемых групп и резкость ключевого нравственно-религиозного термина сохранены.
