  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: ru
  text: И они нанимали против них советников, чтобы расстроить их замысел[a], во все дни Кира, царя Персии, вплоть до царствования Дария, царя Персии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расстроить их совет». Еврейское עֲצָה может означать «совет», «план» или «замысел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: и они нанимали
  rationale: 'Причастная форма в контексте передаёт продолжавшееся действие: противники платили советникам за их услуги. «Нанимали» естественно по-русски и, в отличие от «подкупали», не вносит отсутствующего в тексте указания на коррупцию.'
- source_word: עֲלֵיהֶם
  choice: против них
  rationale: Враждебный контекст и следующая цель действия придают предлогу противительное значение.
- source_word: יוֹעֲצִים
  choice: советников
  rationale: Слово обозначает людей, дающих советы; «советники» сохраняет административно-политический оттенок контекста.
- source_word: לְהָפֵר
  choice: чтобы расстроить
  rationale: Глагол может означать нарушение, отмену или срыв. С дополнением «замысел» выражение «расстроить замысел» точно и естественно передаёт намеренное воспрепятствование.
- source_word: עֲצָתָם
  choice: их замысел
  rationale: עֵצָה допускает значения «совет», «план», «замысел». Здесь речь идёт о намерении восстановить храм, поэтому «замысел» ясно передаёт смысл, а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: כָּל יְמֵי
  choice: во все дни
  rationale: Формально близкая и понятная временная формула, обозначающая весь период правления Кира.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Кира, царя Персии
  rationale: Имя передано в принятой русской библейской форме, а титул — современным и литературным русским выражением.
- source_word: וְעַד
  choice: вплоть до
  rationale: Выражение ясно обозначает непрерывную протяжённость периода до следующей названной эпохи.
- source_word: מַלְכוּת
  choice: царствования
  rationale: В данной временной конструкции слово означает период царского правления, а не территорию царства.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: Дария, царя Персии
  rationale: Имя передано в принятой русской библейской форме; титул переведён последовательно с упоминанием Кира.
