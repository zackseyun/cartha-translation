  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: ru
  text: И в царствование Ахашвероша, в начале его царствования, написали обвинение[a] против жителей Иудеи и Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жалобу»; возможно также: «враждебное обвинение». Еврейское слово обозначает противодействие, выраженное в обвинении или официальной жалобе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: И в царствование
  rationale: Сочетание союза, предлога и существительного задаёт время действия. «В царствование» естественно и точно обозначает период правления царя.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Сохранена транслитерация еврейской формы имени, без подмены историческим отождествлением с Ксерксом.
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: в начале его царствования
  rationale: Конструктивное сочетание обозначает начальный период его правления; русский оборот точно передаёт временное значение.
- source_word: כָּתְבוּ
  choice: написали
  rationale: Глагол буквально означает «написали». Неопределённый субъект, выраженный формой третьего лица множественного числа, не уточняется.
- source_word: שִׂטְנָה
  choice: обвинение
  rationale: Существительное обозначает враждебное выступление, выраженное здесь в письменном обвинении или жалобе. «Обвинение» передаёт официальный и направленный против кого-либо характер действия, не уточняя жанр документа сверх текста.
- source_word: עַל
  choice: против
  rationale: В сочетании с письменным обвинением предлог указывает на тех, против кого оно направлено.
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: жителей Иудеи и Иерусалима
  rationale: Субстантивированное причастие означает живущих в названных местах; «жители» — точный и естественный современный эквивалент.
