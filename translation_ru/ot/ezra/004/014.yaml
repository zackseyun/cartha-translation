revisions:
- from: Поскольку мы едим дворцовую соль[a] и нам не подобает видеть бесчестие царя, мы послали это донесение, чтобы известить царя.
  to: Итак, поскольку мы едим дворцовую соль[a] и нам не подобает видеть позор царя, мы отправили письмо и сообщили царю.
  rationale: Исправлена передача заключительных глаголов, чтобы не добавлять указательное «это» и не заменять сочинение целевой конструкцией. Добавлено ненавязчивое «Итак» для כְּעַן; «позор царя» устраняет двусмысленность русского «бесчестие царя». Сноска и идиоматический образ сохранены.
