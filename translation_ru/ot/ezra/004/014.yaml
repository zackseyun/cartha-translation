translation_notes:
  register: 'Современный литературный русский язык с официально-придворным оттенком, соответствующим письму царю. Начальное כְּעַן передано причинным «поскольку», а не временным «теперь»: здесь оно вводит основание обращения. Маркер сноски [a] помещён непосредственно после идиомы.'
