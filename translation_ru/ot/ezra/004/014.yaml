  text: כְּעַ֗ן כָּ/ל קֳבֵל֙ דִּֽי מְלַ֤ח הֵֽיכְלָ/א֙ מְלַ֔חְנָא וְ/עַרְוַ֣ת מַלְכָּ֔/א לָ֥א אֲֽרִֽיךְ לַ֖/נָא לְ/מֶֽחֱזֵ֑א עַ֨ל דְּנָ֔ה שְׁלַ֖חְנָא וְ/הוֹדַ֥עְנָא לְ/מַלְכָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: ru
  text: Итак, поскольку мы едим дворцовую соль[a] и нам не подобает видеть позор царя, мы отправили письмо и сообщили царю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть мы состоим на содержании царского дворца и потому обязаны хранить верность царю.
    reason: Арамейская идиома «есть соль дворца» может быть непонятна современному читателю без пояснения.
lexical_decisions:
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: мы едим дворцовую соль
  rationale: Сохранён яркий арамейский идиоматический образ, означающий зависимость от дворца и обязанность быть ему верными; смысл пояснён в сноске.
- source_word: עַרְוַת מַלְכָּא
  choice: бесчестие царя
  rationale: Буквально выражение связано с «наготою» царя, но в контексте означает его унижение, ущерб его достоинству или позор; «бесчестие» естественно передаёт этот смысл, не сводя его только к материальному убытку.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  choice: мы послали это донесение, чтобы известить
  rationale: В русском явно выражен подразумеваемый объект глагола «послали» — письмо или донесение; сочетание передаёт последовательность действий без неестественного «послали и известили».
