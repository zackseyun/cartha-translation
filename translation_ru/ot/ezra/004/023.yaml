  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: ru
  text: Как только копия письма царя Артаксеркса была прочитана перед Рехумом, Шимшаем, писцом, и их товарищами, они поспешно отправились в Иерусалим к иудеям[a] и силой и мощью заставили их остановиться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против иудеев». Арамейский предлог может обозначать как движение к кому-либо, так и враждебное выступление против него.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «заставили их прекратить рукой и силой»; это выражение обозначает принуждение силой.'
    reason: idiom_clarification
lexical_decisions:
- source_word: אֱדַיִן מִן דִּי
  choice: Как только
  rationale: Сочетание вводит немедленное следствие после прочтения документа; «как только» естественно передаёт временную связь в русском повествовании.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: копия письма
  rationale: פַּרְשֶׁגֶן обозначает копию или список, а נִשְׁתְּוָנָא — официальное письменное послание.
- source_word: קֱרִי קֳדָם
  choice: была прочитана перед
  rationale: Форма в контексте имеет пассивное значение, а קֳדָם указывает на чтение в присутствии названных должностных лиц.
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: Рехумом, писцом Шимшаем и их товарищами
  rationale: Титул סָפְרָא синтаксически относится к Шимшаю; «писец» сохраняет прозрачный традиционный титул, а «товарищи» передаёт коллег или соратников.
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: поспешно отправились
  rationale: Переданы как движение, так и подчёркнутая срочность действия.
- source_word: עַל יְהוּדָיֵא
  choice: против иудеев
  rationale: У עַל здесь вероятен враждебный оттенок, подтверждаемый последующим насильственным прекращением работ; вариант направления «к иудеям» сохранён в примечании.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: заставили их прекратить работу
  rationale: Порода глагола выражает понуждение к прекращению. Дополнение «работу» ясно из контекста и делает русскую фразу завершённой.
- source_word: בְּאֶדְרָע וְחָיִל
  choice: силой
  rationale: Парное выражение буквально говорит о «руке/мощи и силе» и идиоматически обозначает принуждение; сжатое русское «силой» естественно передаёт этот смысл, а более буквальный вариант дан в примечании.
