revisions:
- from: Как только копия письма царя Артаксеркса была прочитана перед Рехумом, писцом Шимшаем и их товарищами, они поспешно отправились в Иерусалим против иудеев[a] и силой заставили их прекратить работу[b].
  to: Как только копия письма царя Артаксеркса была прочитана перед Рехумом, Шимшаем, писцом, и их товарищами, они поспешно отправились в Иерусалим к иудеям[a] и силой и мощью заставили их остановиться[b].
  rationale: Перевод уточнён так, чтобы не устранять лексическую неоднозначность предлога עַל. Не выраженное в стихе слово «работу» удалено, а идиома בְּאֶדְרָע וְחָיִל передана полно, но естественно для современного русского языка. Пунктуация при приложении «писцом» уточняет, что титул относится к Шимшаю.
