  yaml_path: translation/ot/ezra/004/008.yaml
  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: ru
  text: 'Рехум, начальник[a], и писец Шимшай написали царю Артаксерксу письмо против Иерусалима. В нём говорилось следующее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «управитель». Арамейское выражение בְּעֵל טְעֵם — официальное звание, точное соответствие которого в персидской системе управления неизвестно.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  choice: начальник
  rationale: Арамейское официальное звание буквально связано с властью распоряжаться или давать указания, однако его точное соответствие в персидской администрации неизвестно. «Начальник» естественно передаёт руководящий статус, не приписывая должности чрезмерно узкого значения.
- source_word: סָפְרָא
  choice: писец
  rationale: Слово обозначает писца или секретаря как должностное лицо. «Писец» сохраняет прямое лексическое значение и уместно в историческом повествовании.
- source_word: כְּתַבוּ
  choice: написали
  rationale: Прямо передаёт форму множественного числа и основное значение глагола.
- source_word: אִגְּרָה חֲדָה
  choice: письмо
  rationale: Хотя חֲדָה буквально означает «одно», в имперском арамейском сочетание естественно вводит неопределённый предмет. Русское «письмо» не создаёт ненужного акцента на количестве.
- source_word: עַל יְרוּשְׁלֶם
  choice: против Иерусалима
  rationale: Контекст письма обвинительный и враждебный, поэтому «против» лучше передаёт здесь значение предлога, чем нейтральное «об Иерусалиме».
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: царю Артаксерксу
  rationale: Естественный русский порядок слов сохраняет имя и царский титул адресата.
- source_word: כְּנֵמָא
  choice: 'В нём говорилось следующее:'
  rationale: Оборот вводит содержание письма, которое начинается в следующем стихе. Выбранная формулировка ясна и естественна по-русски.
- source_word: רְחוּם
  choice: Рехум
  rationale: Передача личного имени по принятой русской библейской традиции.
- source_word: שִׁמְשַׁי
  choice: Шимшай
  rationale: Передача личного имени по принятой русской библейской традиции.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: Артаксеркс
  rationale: Традиционная русская форма имени персидского царя.
