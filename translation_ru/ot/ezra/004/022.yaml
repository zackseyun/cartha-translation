  text: 'Будьте внимательны: не проявляйте небрежности в исполнении этого[a]. Почему ущерб должен возрастать, причиняя вред царям[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Смотрите же, не пренебрегайте исполнением этого».'
    reason: lexical_alternative
  - marker: b
    text: 'В арамейском тексте стоит множественное число: «царям»; вероятно, имеется в виду более широкий интерес царской власти или династии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: Смотрите же
  rationale: Сочетание прилагательного со вспомогательным глаголом образует настойчивое предостережение; «смотрите же» естественно передаёт побудительную силу в современном литературном русском.
- source_word: שָׁלוּ לְמֶעְבַּד עַל דְּנָה
  choice: не пренебрегите исполнением этого
  rationale: Передаёт запрет на небрежность или промедление при исполнении только что данного царского распоряжения.
- source_word: לְמָה יִשְׂגֵּא
  choice: Зачем допускать, чтобы… возрастал
  rationale: Риторический вопрос выражает не только вопрос о причине, но и призыв не позволять ущербу увеличиваться.
- source_word: חֲבָלָא
  choice: ущерб
  rationale: Слово обозначает вред или урон и уместно в административно-политическом контексте.
- source_word: לְהַנְזָקַת מַלְכִין
  choice: во вред царям
  rationale: Сохраняет значение результата или неблагоприятного последствия и явственное множественное число арамейского текста.
