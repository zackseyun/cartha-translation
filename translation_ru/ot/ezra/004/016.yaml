base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: ru
  text: 'Доводим до сведения царя: если этот город будет отстроен и его стены будут достроены, то из-за этого у тебя не останется никакой доли[a] в Заречье[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Арамейское слово может означать «часть», «долю», а в данном административном контексте — также «владение» или «доход».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «за Рекой». Заречье — официальное персидское название области к западу от Евфрата.'
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא
  choice: Доводим до сведения царя
  rationale: Официальная эпистолярная формула; сохраняет формальный регистр арамейского выражения и естественно звучит по-русски.
- source_word: דִּי הֵן
  choice: если
  rationale: Частицы вводят содержание сообщения как реальное условие; отдельное «что» в русской конструкции после двоеточия не требуется.
- source_word: קִרְיְתָא דָךְ
  choice: этот город
  rationale: Передаёт указательное местоимение без замены перспективы авторов письма.
- source_word: תִּתְבְּנֵא
  choice: будет отстроен
  rationale: Пассивная форма в будущем условии; «отстроен» указывает на восстановительное строительство города.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: и его стены будут завершены
  rationale: Передаёт доведение укреплений до полного завершения и явно связывает стены с городом.
- source_word: לָקֳבֵל דְּנָה
  choice: то из-за этого
  rationale: Сохраняет как следственный характер выражения, так и явную отсылку «этого» к названному условию.
- source_word: חֲלָק
  choice: доля
  rationale: Ближайшее широкое соответствие арамейскому «часть, доля»; не сужает смысл до налоговых поступлений и не усиливает его до полного владения.
- source_word: בַּעֲבַר נַהֲרָא
  choice: в Заречье
  rationale: Передаёт официальное персидское наименование области к западу от Евфрата естественным русским библейско-историческим термином, не добавляя отсутствующее в тексте слово «провинция».
- source_word: לָא אִיתַי לָךְ
  choice: у тебя не останется никакой
  rationale: Русская конструкция обладания естественно передаёт арамейское бытийное выражение с дательным лицом; будущее значение определяется условным контекстом.
