base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/018.yaml
  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: ru
  text: Документ, который вы прислали нам, был ясно прочитан передо мной[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Письмо, которое вы прислали нам, было отчётливо прочитано в моём присутствии».'
    reason: 'Лексические варианты: נִשְׁתְּוָנָא может означать официальное письмо, а מְפָרַשׁ — ясное или отчётливое прочтение.'
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: документ
  rationale: Имперско-арамейское обозначение официального письменного сообщения. «Документ» сохраняет административный оттенок и не сужает значение до частного письма.
- source_word: דִּי
  choice: который
  rationale: Относительная частица вводит определительное придаточное; «который» естественно для современного русского языка.
- source_word: שְׁלַחְתּוּן
  choice: вы прислали
  rationale: Форма перфекта второго лица множественного числа; прошедшее время естественно передаёт завершённое действие в ответе царя.
- source_word: עֲלֶינָא
  choice: нам
  rationale: 'В контексте официальной переписки предлог обозначает адресата: документ был направлен царю и его двору.'
- source_word: מְפָרַשׁ
  choice: ясно
  rationale: Передаёт ясность или отчётливость прочтения, не уточняя без достаточных оснований, шла ли речь о переводе либо разъяснении.
- source_word: קֱרִי
  choice: был прочитан
  rationale: 'Контекст требует пассивного значения: документ прочитали перед царём, вероятно вслух.'
- source_word: קָדָמָי
  choice: передо мной
  rationale: Сохраняет обычную придворную формулу и близко следует арамейскому выражению.
