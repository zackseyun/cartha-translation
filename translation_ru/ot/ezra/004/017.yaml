base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: ru
  text: 'Царь послал ответ Рехуму, начальнику[a], писцу Шимшаю, прочим их соратникам, живущим в Самарии, и остальным в Заречье[b]: «Мир вам[c]. А теперь —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «правителю» или «главному советнику». Точное значение арамейского административного титула неясно.'
    reason: lexical_alternative
  - marker: b
    text: Заречье — персидская административная область к западу от реки Евфрат.
    reason: cultural_note
  - marker: c
    text: 'Или: «Приветствие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: ответ
  rationale: В имперском арамейском слово обозначает официальное сообщение; поскольку оно отвечает на предыдущее письмо, «ответ» естественно передаёт контекст.
- source_word: שְׁלַח
  choice: послал
  rationale: Обычное значение глагола; форма прошедшего времени соответствует повествованию.
- source_word: מַלְכָּא
  choice: царь
  rationale: Определённая форма указывает на уже упомянутого персидского царя.
- source_word: עַל
  choice: кому (передано дательным падежом)
  rationale: После глагола «послал» предлог вводит адресатов; в русском это естественно передаётся дательным падежом.
- source_word: בְּעֵל טְעֵם
  choice: начальник
  rationale: Не вполне ясный административный титул буквально связан с властью или полномочиями распоряжаться. «Начальник» сохраняет общий служебный смысл без чрезмерной конкретизации.
- source_word: סָפְרָא
  choice: писец
  rationale: Устойчивое обозначение административного служащего, занимавшегося письменными документами.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: прочие их соратники
  rationale: Выражение обозначает остальных лиц, связанных с названными чиновниками; «соратники» передаёт принадлежность к одной стороне без уточнения должностей.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: живущие в Самарии
  rationale: Причастная конструкция обозначает постоянное или обычное место жительства.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: и в других местах Заречья
  rationale: Буквально речь идёт об «остальных» за Рекой; по контексту это остальные соратники или адресаты, находящиеся в регионе Заречья. Формулировка не добавляет отсутствующего в источнике слова «провинция».
- source_word: שְׁלָם
  choice: Мир вам
  rationale: Эпистолярное приветствие; «мир» сохраняет прямое лексическое содержание, а «вам» естественно выражает адресованность приветствия по-русски.
- source_word: וּכְעֶת
  choice: А теперь —
  rationale: Формула вводит основную часть царского ответа; тире показывает продолжение мысли в следующем стихе.
