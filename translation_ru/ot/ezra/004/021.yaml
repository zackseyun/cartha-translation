  naturalness: Фраза естественна для современного литературного русского и сохраняет официальный административный регистр. «Пусть этот город не отстраивают» понятно, но «этот город не должен быть восстановлен» точнее передаёт страдательную форму и характер официального запрета.
  terminology: «Издайте указ» удачно передаёт שִׂימוּ טְּעֵם. Для последнего טַעְמָא следует сохранить «указ» без добавления «новый».
