  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: ru
  text: Итак, издайте указ, чтобы остановить этих людей, и этот город не должен быть восстановлен, пока от меня не будет издан указ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока от меня не будет установлен указ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Итак
  rationale: Арамейское наречие вводит непосредственное царское распоряжение; «итак» естественно связывает его с предшествующим решением.
- source_word: שִׂימוּ טְּעֵם
  choice: издайте указ
  rationale: Арамейская административная идиома буквально означает «установите решение/повеление»; по-русски в царском контексте естественно «издайте указ».
- source_word: לְבַטָּלָא גֻּבְרַיָּא אִלֵּךְ
  choice: чтобы остановить этих людей
  rationale: Передаёт направленность приказа на прекращение действий конкретной группы, не добавляя не выраженного в тексте объекта работ.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: и пусть этот город не отстраивают
  rationale: Сохраняет соединительный союз, запретительно-распорядительную силу фразы и значение повторного строительства.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: до тех пор, пока я не издам нового указа
  rationale: Естественно передаёт буквально пассивную конструкцию «пока от меня не будет установлен указ»; «нового» проясняет, что речь идёт о последующем распоряжении, а не о текущем.
