base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: ru
  text: Тогда работа над домом Божьим в Иерусалиме прекратилась[a][b] и не возобновлялась[c] до второго года царствования Дария, царя Персии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остановилась»; арамейский корень בטל означает прекращение или остановку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «над храмом Божьим». Буквально: «над домом Божьим».'
    reason: lexical_alternative
  - marker: c
    text: Слова «не возобновлялась» передают продолжающееся состояние, а не просто повторно сообщают об остановке.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейское наречие связывает событие с предшествующим повествованием и указывает на временную последовательность.
- source_word: בְּטֵלַת
  choice: прекратилась
  rationale: Корень בטל означает прекращение или остановку. Возвратная форма по-русски естественно передаёт наступление остановки, не исключая внешнего воздействия, ясного из контекста.
- source_word: עֲבִידַת
  choice: работа
  rationale: Существительное означает «работа, труд»; контекст уточняет, что речь идёт о работах над храмом, поэтому добавлять «строительство» не требуется.
- source_word: בֵּית אֱלָהָא
  choice: дом Божий
  rationale: Сохраняет буквальный образ исходного выражения; по контексту это храм.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: в Иерусалиме
  rationale: В русском языке местоположение естественно присоединяется непосредственно к сочетанию «дом Божий» без тяжеловесного относительного оборота.
- source_word: וַהֲוָת בָּטְלָא
  choice: и оставалась приостановленной
  rationale: Сочетание глагола бытия с формой от בטל передаёт продолжающееся состояние после первоначального прекращения работ.
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: до второго года
  rationale: Естественная русская формула обозначения года царствования.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: царствования Дария
  rationale: Точно и идиоматично передаёт датировку по правлению монарха.
- source_word: מֶלֶךְ פָּרָס
  choice: царя Персии
  rationale: Сохраняет приложение и обычное русское наименование царского титула.
