base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: ru
  text: Враги Иуды и Вениамина услышали, что сыны изгнания[a] строят храм Яхве, Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны изгнания»; то есть община тех, кто был уведён в изгнание и вернулся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: услышали
  rationale: Последовательная повествовательная форма передаёт простое событие в прошлом; «услышали» прямо и естественно выражает смысл.
- source_word: צָרֵי
  choice: враги
  rationale: Форма сопряжённого множественного числа обозначает враждебно настроенных противников; «враги» естественно в современном русском и не обязательно подразумевает военные действия.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: Иуды и Вениамина
  rationale: Имена переданы традиционными русскими библейскими формами и поставлены в родительном падеже по управлению слова «враги».
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного, а не причину.
- source_word: בְנֵי הַגּוֹלָה
  choice: сыны изгнания
  rationale: 'Сохранён образный состав еврейского выражения: בני — «сыны», הגולה — «изгнание/переселение». Сноска поясняет, что речь идёт об общине изгнанников, возвратившихся из плена.'
- source_word: בּוֹנִים
  choice: строят
  rationale: Причастие обозначает продолжающееся действие, одновременное моменту, когда противники о нём услышали; русское настоящее после «услышали, что» естественно передаёт эту одновременность.
- source_word: הֵיכָל
  choice: храм
  rationale: Хотя слово может означать также дворец, упоминание Яхве, Бога Израиля, однозначно указывает здесь на храм.
- source_word: לַיהוָה
  choice: храм Яхве
  rationale: Предлог ל выражает предназначение или принадлежность; русская конструкция с родительным падежом звучит естественнее, чем «храм для Яхве», и не меняет смысла.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Приложение отождествляет Яхве с Богом Израиля; дательный падеж согласован с подразумеваемым посвящением храма и естественно продолжает конструкцию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; форма «Яхве» сохраняет личное имя и наиболее близка к принятой научной реконструкции, не подменяя его титулом.
- issue: Обозначение вернувшейся общины
  choice: сыны изгнания
  alternative: изгнанники; возвратившиеся изгнанники
  rationale: Буквальный образ сохранён в основном тексте, а историческая референция пояснена в сноске без внесения в стих отсутствующего в выражении глагольного понятия возвращения.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. «Сыны изгнания» намеренно сохраняет необычный еврейский образ и сопровождается пояснением; остальной синтаксис сделан естественным для современного читателя.
