base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: ru
  text: и остальные народы, которых великий и досточтимый Оснаппар[a] переселил и поселил в городе Самарии и в остальной части Заречья[b] — а теперь:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Оснаппара часто отождествляют с ассирийским царём Ашшурбанипалом, однако в переводе сохранена арамейская форма имени, стоящая в тексте.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «за Рекой». Это персидское административное название области к западу от Евфрата.'
    reason: cultural_note
  - marker: c
    text: 'Это заключительная арамейская формула в заголовке письма; возможны также переводы: «и так далее» или «в такое-то время».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: остальные народы
  rationale: Передаёт оставшуюся часть перечисляемых этнических групп и естественно продолжает перечень предыдущего стиха.
- source_word: הַגְלִי
  choice: переселил
  rationale: В контексте имперской политики глагол обозначает принудительное перемещение населения; «переселил» естественно сочетается с последующим «поселил», хотя оттенок изгнания несколько сильнее выражен в примечании не требуется.
- source_word: אָסְנַפַּר
  choice: Оснаппар
  rationale: Сохранена арамейская форма имени, представленная в тексте, без подмены предполагаемым историческим отождествлением.
- source_word: רַבָּא וְיַקִּירָא
  choice: великий и славный
  rationale: Сохраняет придворный почётный характер двух определений; «славный» здесь означает прославленный, высокочтимый.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: и поселил
  rationale: Каузативная форма указывает, что переселённые народы были размещены на новом месте.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: в городе Самарии
  rationale: Сохраняет единственное число «город» в масоретском тексте и отличает город Самарию от более широкой области.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: и в других местах Заречья
  rationale: Эллиптическое «остаток Заречья» по-русски естественно передано как остальные места административной области; «Заречье» обозначает персидскую область к западу от Евфрата.
- source_word: וּכְעֶנֶת
  choice: 'А теперь:'
  rationale: Передаёт функцию арамейской эпистолярной формулы, вводящей основную часть письма, и сохраняет двоеточием её переходный характер.
