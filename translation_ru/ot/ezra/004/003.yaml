  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: ru
  text: 'Но Зоровавель, Иешуа и остальные главы родов Израиля сказали им: «Не вам строить вместе с нами дом[a] для нашего Бога, ибо мы сами сообща[b] построим его для Яхве, Бога Израиля, как повелел нам царь Кир, царь Персии».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом» здесь означает храм.
    reason: культурно-контекстуальное пояснение
  - marker: b
    text: 'Буквально: «мы вместе построим». По контексту речь о том, что израильтяне будут строить сами, без предложивших им помощь.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ответили
  rationale: В данном диалогическом контексте стандартный глагол אמר естественно передаётся как «ответили», хотя буквально означает «сказали».
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: Зоровавель, Иешуа
  rationale: «Зоровавель» — закрепившаяся русская форма имени; «Иешуа» непосредственно отражает еврейскую форму יֵשׁוּעַ и отличает её от полной формы «Иисус Навин».
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: и остальные главы родов Израиля
  rationale: Выражение обозначает руководителей родовых объединений; «главы родов» сохраняет социальную структуру оригинала и звучит естественно по-русски.
- source_word: לֹא לָכֶם וָלָנוּ
  choice: Не вам вместе с нами
  rationale: 'Формулировка сохраняет синтаксическую сжатость и исключающий смысл: адресатам отказывают в совместном участии.'
- source_word: לִבְנוֹת בַּיִת לֵאלֹהֵינוּ
  choice: строить дом нашему Богу
  rationale: «Дом» прямо передаёт בַּיִת; из контекста ясно, что имеется в виду храм, что пояснено в сноске.
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: Мы сами сообща построим
  rationale: יַחַד буквально означает «вместе, сообща». Добавление «сами» передаёт контекстуальное противопоставление просителям, не устраняя буквальный оттенок совместного труда законной общины.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном יהוה, а не заменено титулом.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: как повелел нам
  rationale: «Повелел» сохраняет официальный и властный характер царского распоряжения.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: Кир, царь Персии
  rationale: Естественная русская титулатура передаёт имя и царское достоинство без стилистически тяжёлого повтора слова «царь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит собственное имя Бога; «Яхве» сохраняет его как имя и не смешивает с титулом.
- issue: Смысл יַחַד в контексте отказа от сотрудничества
  choice: сами сообща
  alternative: только мы
  rationale: Буквальное «сообща» относится к руководителям и общине Израиля, тогда как «сами» выражает контекстуальное исключение предложивших помощь. Так сохраняются и лексическое значение, и прагматический смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены лаконичность ответа, родовая терминология и личное имя Бога; неестественный для русского повтор царского титула устранён.
