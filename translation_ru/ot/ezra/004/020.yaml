  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: ru
  text: Над Иерусалимом властвовали могущественные цари, и они правили всем Заречьем[a]; им платили дань, подать и пошлину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над всем Заречьем». «Заречье» — официальное название имперской территории к западу от Евфрата.'
    reason: cultural_note
  - marker: b
    text: '«Дань, подать и пошлина» — три различные категории имперских сборов; возможный перевод: «дань, налог и таможенная пошлина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: могущественные цари
  rationale: Сочетание обозначает царей, обладавших значительной силой и властью; «могущественные» естественно звучит в современном литературном русском.
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: были над Иерусалимом
  rationale: Предлог עַל в контексте выражает власть над городом; формулировка сохраняет структуру оригинала и отличается от простого указания местонахождения.
- source_word: שַׁלִּיטִין
  choice: владычествовавшие
  rationale: Передаёт продолжающееся осуществление власти и естественно связывается с предшествующим упоминанием царей.
- source_word: בְּכֹל עֲבַר נַהֲרָה
  choice: над всей областью Заречья
  rationale: «Заречье» передаёт официальное название имперской территории к западу от Евфрата; добавление «областью» проясняет географически-административный смысл, не превращая название в обычное описание.
- source_word: מִדָּה
  choice: дань
  rationale: Первый термин стандартной арамейской фискальной триады обозначает установленный властями сбор или дань.
- source_word: בְלוֹ
  choice: подать
  rationale: Отдельная категория налогообложения; «подать» сохраняет отличие от дани и пошлины и соответствует историко-административному контексту.
- source_word: הֲלָךְ
  choice: пошлина
  rationale: Вероятно, дорожный, транспортный или таможенный сбор; «пошлина» достаточно широко передаёт этот смысл.
- source_word: מִתְיְהֵב לְהוֹן
  choice: им платили
  rationale: Естественная русская передача пассивной конструкции «давалось им» в контексте денежных повинностей; множественный ряд сборов представлен как совокупность платежей.
