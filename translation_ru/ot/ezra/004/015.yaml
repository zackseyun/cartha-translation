base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: ru
  text: Пусть поищут в книге записей твоих предшественников[a]. В книге записей ты найдёшь и узнаешь, что этот город — мятежный, наносящий ущерб царям и областям и что с давних времён в нём происходили мятежи[b]. Поэтому этот город был разрушен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоих отцов»; здесь возможно также: «твоих предков» или «прежних царей».'
    reason: lexical_alternative
  - marker: b
    text: Трудное арамейское выражение может также означать, что в городе разжигали мятеж или занимались подстрекательством к восстанию.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: пусть поищут
  rationale: Интенсивная форма в контексте официального прошения имеет побудительно-безличный смысл; неопределённо-личная конструкция естественна для русского административного стиля.
- source_word: סְפַר דָּכְרָנַיָּא
  choice: книга памятных записей
  rationale: Сочетание обозначает официальный письменный свод прежних сведений; перевод сохраняет образ книги и значение записей, предназначенных для памяти и справки.
- source_word: אֲבָהָתָךְ
  choice: твоих предшественников
  rationale: Буквально «твоих отцов», но в обращении к царю речь, вероятнее всего, идёт о прежних правителях; неоднозначность отмечена в сноске.
- source_word: וּתְהַשְׁכַּח וְתִנְדַּע
  choice: ты найдёшь и узнаешь
  rationale: Последовательность глаголов передана прямо и естественно, сохраняя обещанный результат поиска.
- source_word: קִרְיָא מָרָדָא
  choice: город мятежный
  rationale: Передаёт обвинение в непокорности имперской власти и сохраняет торжественно-официальный оттенок исходной именной конструкции.
- source_word: מְהַנְזְקַת מַלְכִין וּמְדִנָן
  choice: причинявший ущерб царям и областям
  rationale: Причастие указывает на нанесение вреда или ущерба; прошедшее длительное значение соответствует историческому обвинению.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: поднимали восстания
  rationale: Трудное арамейское сочетание обозначает совершение или разжигание мятежной деятельности; русский оборот сохраняет общий смысл, не уточняя сверх текста конкретный механизм.
- source_word: מִן יוֹמָת עָלְמָא
  choice: с давних времён
  rationale: Идиома означает глубокую историческую древность, а не метафизическую вечность.
- source_word: עַל דְּנָה ... הָחָרְבַת
  choice: За это тот город и был разрушен
  rationale: Переданы причинная связь и арамейский пассив; «тот город» отражает смену указательного слова в заключительной части стиха.
