  source_fidelity: 'Начальная побудительная формула и последующее обращение во 2-м лице в целом передают арамейскую последовательность: распорядиться о розыске, после чего адресат сможет обнаружить и узнать. Однако «причинявший» неоправданно переводит характеристику в прошедшее время, а «поднимали восстания» вводит не выраженный в оригинале субъект и множественность восстаний. Заключительное «тот город» не отражает повторное дָךְ, соотносимое с тем же «этим городом».'
