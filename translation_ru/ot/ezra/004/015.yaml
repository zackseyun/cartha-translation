  terminology: '«Предшественники» допустимо передаёт контекстуальный смысл «отцов» применительно к царю, а сноска корректно сохраняет буквальное значение и альтернативы. «Мятежный город», «цари и области» и «с давних времён» соответствуют исходному обвинительному административному регистру. Трудное выражение אֶשְׁתַּדּוּר עָבְדִין лучше передать без неуказанного деятеля: «в нём происходили мятежи»; сноска отмечает возможный оттенок разжигания.'
