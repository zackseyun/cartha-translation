base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: ru
  text: Тогда Рехум, начальник[a], писец Шимшай и остальные их товарищи — динеи[b], афарсафхеи[c], тарпелеи, персы, архевеи, вавилоняне, жители Суз, то есть эламитяне, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точный смысл административного титула неясен; возможны также переводы «советник», «управитель» или «распорядитель».
    reason: alternative_reading
  - marker: b
    text: 'Возможно: «судьи». Арамейскую форму דִּינָיֵא можно понимать как название группы — «динеи» — либо как обозначение должностных лиц.'
    reason: alternative_reading
  - marker: c
    text: Значение арамейского אֲפַרְסַתְכָיֵא неясно. Возможно, это название народа или группы должностных лиц.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейское наречие вводит следующий этап повествования или текста письма; «тогда» естественно передаёт последовательность.
- source_word: רְחוּם
  choice: Рехум
  rationale: Личное имя передано транслитерацией.
- source_word: בְּעֵל טְעֵם
  choice: начальник
  rationale: Спорный персидско-арамейский административный титул буквально связан с распоряжением или повелением. Нейтральное «начальник» передаёт властные полномочия, не уточняя недоказанную должность.
- source_word: שִׁמְשַׁי
  choice: Шимшай
  rationale: Личное имя передано транслитерацией.
- source_word: סָפְרָא
  choice: писец
  rationale: Слово обозначает писца или секретаря; «писец» сохраняет прямое значение и уместно в официальном контексте.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: остальные их сообщники
  rationale: Выражение обозначает прочих участников той же группы. «Сообщники» естественно для совместно действующих лиц и не превращает их обязательно в штатных коллег.
- source_word: דִּינָיֵא
  choice: динеи
  rationale: В контексте перечня переселённых групп форма может быть этнонимом; транслитерация сохраняет эту вероятную функцию и не устраняет лексическую неоднозначность.
- source_word: אֲפַרְסַתְכָיֵא
  choice: афарсафхеи
  rationale: Трудное название группы не имеет надёжно установленного перевода, поэтому передано транслитерацией.
- source_word: טַרְפְּלָיֵא
  choice: тарпелеи
  rationale: Не вполне идентифицированное название группы передано транслитерацией.
- source_word: אֲפָרְסָיֵא
  choice: персы
  rationale: Наиболее естественное понимание ясного этнонима — персы.
- source_word: ארכוי
  choice: архевеи
  rationale: Название жителей Эреха (Урука) передано традиционной этнонимической формой.
- source_word: בָבְלָיֵא
  choice: вавилоняне
  rationale: Ясное обозначение жителей Вавилона.
- source_word: שׁוּשַׁנְכָיֵא דהוא עֵלְמָיֵא
  choice: жители Суз, то есть эламитяне
  rationale: Переданы как географическое обозначение жителей Суз и следующее за ним поясняющее отождествление с эламитянами.
