base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: ru
  text: По моему указу провели расследование и установили, что этот город издревле восставал против царей[a] и что в нём совершались мятеж и смута[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превозносился над царями». Арамейский глагол может указывать на самовозвышение, но здесь, вероятно, означает выступление против царской власти.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в нём совершались мятеж и восстание». Значения двух арамейских слов частично совпадают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: По моему повелению
  rationale: Арамейская административная формула буквально означает, что повеление было установлено или издано царём. Русская конструкция естественно передаёт источник официального распоряжения.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: провели расследование и установили
  rationale: Глаголы описывают официальный поиск по записям и его результат; эта пара естественна для русского административного контекста.
- source_word: קִרְיְתָא דָךְ
  choice: этот город
  rationale: Указательное слово относится к обсуждаемому в письме городу.
- source_word: מִן יוֹמָת עָלְמָא
  choice: издревле
  rationale: Кратко и литературно передаёт арамейское выражение «с древних дней».
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: восставал против царей
  rationale: Возвратная форма может означать самовозвышение или выступление против кого-либо. В политическом контексте «восставал» сохраняет значение непокорности, не отождествляя его полностью со следующим словом «мятеж».
- source_word: וּמְרַד וְאֶשְׁתַּדּוּר
  choice: мятежи и смуты
  rationale: 'Два близких политических термина переданы различными словами: первый обозначает открытый бунт против власти, второй — подрывные волнения или беспорядки.'
- source_word: מִתְעֲבֶד בַּהּ
  choice: в нём поднимали ... и устраивали
  rationale: Арамейская безлично-пассивная форма указывает на совершавшиеся в городе действия; активная неопределённо-личная конструкция звучит по-русски естественно.
