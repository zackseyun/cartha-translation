base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: ru
  text: 'Итак, да будет известно царю: если этот город будет отстроен и его стены будут достроены, жители не будут платить ни дань, ни подать, ни пошлину, и в конечном счёте это нанесёт ущерб доходам царей.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и в итоге это причинит убыток царям». Арамейское выражение предельно кратко; указание именно на доходы выводится из контекста неуплаты дани, подати и пошлины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Итак
  rationale: Арамейское наречие вводит предупреждение и вывод; «итак» естественно передаёт переходную, отчасти итоговую функцию.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: да будет известно царю
  rationale: Сохранена официальная формула имперской арамейской переписки и её dignified administrative register.
- source_word: דִּי הֵן
  choice: если
  rationale: Сочетание вводит условное содержание официального уведомления; двоеточие в русском языке естественно передаёт связь с предшествующей формулой.
- source_word: קִרְיְתָא דָךְ
  choice: этот город
  rationale: Указательное слово непосредственно обозначает упоминаемый авторами город, Иерусалим.
- source_word: תִּתְבְּנֵא
  choice: будет отстроен
  rationale: Пассивная форма в условной конструкции описывает восстановление уже существовавшего города; «отстроен» сохраняет строительный смысл без излишнего уточнения.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: и его стены завершены
  rationale: Глагол означает доведение работ до конца; притяжательное «его» ясно связывает укрепления с городом.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: дань, подать, пошлина
  rationale: 'Три различных административно-фискальных термина переданы тремя понятными русскими наименованиями: государственная дань, налоговый сбор и таможенная либо проездная пошлина.'
- source_word: לָא יִנְתְּנוּן
  choice: жители не будут платить
  rationale: Буквально глагол значит «давать», но в налоговом контексте естественно «платить»; подразумеваемый субъект во множественном числе раскрыт как жители города.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: и в конечном счёте это нанесёт ущерб доходам царей
  rationale: Сжатое и трудное выражение истолковано в ближайшем фискальном контексте как ущерб царским доходам; неоднозначность отмечена в сноске.
