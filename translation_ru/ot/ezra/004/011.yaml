  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: ru
  text: 'Вот копия письма, которое они послали царю Артаксерксу: «Твои слуги, люди Заречья, и ныне…»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди из области за Рекой». «Заречье» — персидское название провинции к западу от Евфрата.'
    reason: lexical_alternative
  - marker: b
    text: Арамейское выражение в конце стиха — официальная формула письма; его также переводят «и так далее» или, традиционно, «и прочее». Текст письма продолжается в следующем стихе.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה פַּרְשֶׁגֶן
  choice: Вот копия
  rationale: Указательное слово вводит цитируемый документ, а существительное обозначает копию или текст официального письма; сочетание естественно по-русски и сохраняет предъявительный характер формулы.
- source_word: אִגַּרְתָּא
  choice: письма
  rationale: В административном контексте речь идёт об официальном письменном сообщении; «письмо» — ясный современный эквивалент.
- source_word: דִּי שְׁלַחוּ
  choice: которое они послали
  rationale: Сохраняет относительную связь и простое значение глагола отправления документа.
- source_word: עֲלוֹהִי עַל אַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: царю Артаксерксу
  rationale: Дательный падеж естественно передаёт адресата; царский титул в русском языке ставится перед именем.
- source_word: עַבְדָיךְ
  choice: Твои слуги
  rationale: Сохраняет формальное самоуничижительное обозначение подданных при обращении к царю, не заменяя его толкованием «чиновники».
- source_word: אֱנָשׁ
  choice: люди
  rationale: Коллективное употребление существительного естественно передаётся русским «люди»; более буквальное «мужи» звучало бы архаично.
- source_word: עֲבַר נַהֲרָה
  choice: Заречья
  rationale: Это персидское административно-географическое обозначение области к западу от Евфрата с точки зрения имперского центра; «Заречье» кратко сохраняет буквальный образ и функцию названия.
- source_word: וּכְעֶנֶת
  choice: И ныне…
  rationale: Передаёт начальную часть формальной эпистолярной формулы, остающейся синтаксически открытой перед продолжением в следующем стихе.
