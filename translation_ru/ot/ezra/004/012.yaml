base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: ru
  text: 'Да будет известно царю: иудеи[a], которые пришли от тебя к нам, прибыли в Иерусалим. Они отстраивают этот мятежный и злой город, завершают строительство стен и восстанавливают основания[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи». Арамейское слово может обозначать как иудеев в более широком смысле, так и людей из Иуды (Иудеи).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «закладывают основания». Арамейское выражение не вполне ясно и может относиться либо к восстановлению существующих оснований, либо к их закладке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: Да будет известно царю
  rationale: Сохраняет официальную арамейскую эпистолярную формулу и звучит естественно в русском тексте царского донесения.
- source_word: יְהוּדָיֵא
  choice: иудеи
  rationale: Передаёт как этническое, так и областное значение термина в персидском административном контексте; возможное значение «жители Иудеи» отмечено в сноске.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: пришли от тебя к нам
  rationale: Передаёт направление движения с точки зрения авторов письма; буквальный оттенок восхождения здесь несущественен для естественного русского выражения.
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: прибыли в Иерусалим
  rationale: Второй глагол конкретизирует место прибытия и позволяет избежать неуклюжего повтора «пришли».
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: этот мятежный и злой город
  rationale: Сохраняет враждебную политико-нравственную характеристику Иерусалима, вложенную в уста обвинителей.
- source_word: בָּנַיִן
  choice: отстраивают
  rationale: Контекст говорит о восстановлении ранее существовавшего города; «отстраивают» естественно выражает это без чрезмерного уточнения.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: заканчивают стены
  rationale: Передаёт значение завершения или доведения стен до готовности, сохраняя аспектуальную неопределённость арамейской формы в связном русском перечислении.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: восстанавливают основания
  rationale: Соответствует контексту восстановительных работ, но трудность выражения и возможность значения «закладывают основания» отражены в сноске.
