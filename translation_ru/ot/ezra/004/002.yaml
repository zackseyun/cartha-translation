base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: ru
  text: 'Тогда они подошли к Зоровавелю и главам родов и сказали им: «Давайте строить вместе с вами, потому что мы, как и вы, ищем[a] вашего Бога и приносим Ему жертвы[b] со времён Асархаддона, царя Ассирии, который привёл нас сюда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «ищем», в религиозном контексте может также означать «обращаемся к» или «почитаем».
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «и не мы приносим жертвы». Многие понимают написанное здесь «не» как графический вариант выражения «Ему» либо истолковывают оборот по контексту в утвердительном смысле.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: подошли
  rationale: Естественно передаёт повествовательную форму глагола נגשׁ и движение к Зоровавелю и главам родов.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главам родов
  rationale: Выражение обозначает руководителей родовых объединений; такой перевод точен по смыслу и естественен в современном русском.
- source_word: נִבְנֶה עִמָּכֶם
  choice: мы будем строить вместе с вами
  rationale: Передаёт предложение присоединиться к строительству. Русская форма с будущим временем в прямой речи звучит естественнее буквального «давайте строить», не превращая строительство в простую вспомогательную роль.
- source_word: כִּי כָכֶם נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: потому что, как и вы, ищем вашего Бога
  rationale: Сохраняет религиозную широту דרשׁ — искать, обращаться к, почитать — и не подменяет её более узким толкованием «поклоняемся».
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: и приносим Ему жертвы
  rationale: Следует контекстуально ожидаемому положительному смыслу и традиционному пониманию לא как графического варианта לו, отмечая текстовую трудность в сноске.
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: со времён Асархаддона
  rationale: Идиоматически передаёт временную отправную точку, продолжающуюся до момента речи.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: который переселил нас сюда
  rationale: В данном историческом контексте каузатив глагола עלה означает организованное перемещение населения; «переселил» естественно и ясно передаёт смысл.
theological_decisions:
- issue: Религиозное утверждение переселенцев
  choice: «ищем вашего Бога» и «приносим Ему жертвы» переданы как нейтрально сообщённые слова говорящих
  alternative: «поклоняемся вашему Богу» или «обращаемся к вашему Богу»
  rationale: Текст сообщает их притязание, не удостоверяя его искренность или правоверность; повествовательное напряжение не следует разрешать внутри перевода их речи.
- issue: Трудное чтение отрицания לא
  choice: В основном тексте дан контекстуально ожидаемый утвердительный смысл, а масоретское написание раскрыто в сноске
  alternative: 'Буквально: «и не мы приносим жертвы»'
  rationale: Буквальное отрицание синтаксически и контекстуально затруднительно; прозрачная сноска сохраняет исходное свидетельство, не делая основной текст непонятным.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. «Главы родов» сохраняет общественно-родовой смысл без тяжеловесного калькирования. Маркеры сносок размещены непосредственно после соответствующих выражений.
