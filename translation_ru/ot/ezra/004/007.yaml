base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: ru
  text: Во дни Артаксеркса Бишлам, Митредат, Тавеел и прочие его соратники[a] написали Артаксерксу, царю Персии. Текст письма был написан арамейским письмом и передан на арамейском языке[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и прочие их соратники». Суффикс в выражении «его соратники» имеет форму единственного числа, однако может относиться ко всей названной группе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Текст письма был написан по-арамейски и переведён (или истолкован) по-арамейски». Формулировка подлинника трудна: возможно, речь идёт о различии между письменностью и языком либо между написанием и переводом (истолкованием).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: Во дни
  rationale: Сохраняет временную формулу и связь с предшествующим повествованием, не превращая её в более узкое «в царствование».
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: Артаксеркс
  rationale: Устоявшаяся русская форма имени персидского царя.
- source_word: כָּתַב
  choice: написали
  rationale: Передаёт простое значение глагола, не добавляя отсутствующих в стихе слов «обвинение» или «донос».
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: Бишлам, Митредат, Тавеел
  rationale: Традиционные и узнаваемые русские формы личных имён.
- source_word: וּשְׁאָר כנותו
  choice: и остальные его соратники
  rationale: Передаёт значение «остальные товарищи/сообщники» и сохраняет формально единственное число местоименного суффикса; возможное коллективное понимание отмечено в сноске.
- source_word: עַל ארתחששתא מֶלֶךְ פָּרָס
  choice: Артаксерксу, царю Персии
  rationale: В административном контексте предлог указывает адресата письма; русская конструкция с дательным падежом естественна и не навязывает оттенка враждебности.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: Текст письма
  rationale: Передаёт сочетание слов со значениями «письменный текст/документ» и «письмо/послание» без избыточной канцелярской тяжеловесности.
- source_word: כָּתוּב אֲרָמִית וּמְתֻרְגָּם אֲרָמִית
  choice: был написан арамейским письмом и изложен на арамейском языке
  rationale: Следует распространённому пониманию различия между письменностью и языком и даёт связный русский текст; неоднозначность трудной формулировки сохранена в сноске.
