lexical_decisions:
- source_word: וַיְהִי
  choice: Тогда
  rationale: Последовательная форма вводит следующий этап повествования; «тогда» естественно передаёт развитие событий без архаического «и было».
- source_word: עַם הָאָרֶץ
  choice: жители той земли
  rationale: В контексте выражение обозначает местное население, противодействовавшее возвратившимся иудеям. Такой перевод естественнее по-русски, чем буквальное «народ земли».
- source_word: מְרַפִּים יְדֵי
  choice: ослабляли руки
  rationale: Сохранён выразительный еврейский образ, означающий лишать силы, решимости и мужества; несовершенный вид передаёт продолжавшееся воздействие.
- source_word: עַם יְהוּדָה
  choice: народу Иудеи
  rationale: Передана коллективная община Иудеи, занятая восстановительными работами, без сведения выражения только к этническому обозначению.
- source_word: וּמְבַלְהִים
  choice: и запугивали
  rationale: Причастная форма от בהל выражает наведение страха и тревоги; «запугивали» естественно передаёт целенаправленное враждебное действие.
- source_word: אוֹתָם
  choice: его
  rationale: Еврейское местоимение множественного числа относится к людям, составляющим «народ Иудеи»; в русском согласование с собирательным существительным в единственном числе требует «его».
- source_word: לִבְנוֹת
  choice: чтобы он не строил
  rationale: Инфинитив с ל соотносит запугивание со строительством; контекст указывает на попытку воспрепятствовать работам, что естественно выражено отрицательной целевой конструкцией.
