source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: ru
  text: Когда строители заложили основание храма Яхве, они поставили священников в облачениях с трубами, а левитов, сыновей Асафа, — с кимвалами, чтобы славить Яхве согласно указанию Давида[a], царя Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукою Давида»; то есть согласно указанию или предписанию Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: Когда строители заложили основание
  rationale: Глагол יסד в строительном контексте означает закладывание основания; придаточная конструкция естественно передаёт временную связь с последующим расставлением служителей.
- source_word: הֵיכַל יְהוָה
  choice: храма Яхве
  rationale: הֵיכָל здесь обозначает храмовое здание, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: וַיַּעֲמִידוּ
  choice: поставили
  rationale: Каузативная форма глагола עמד означает, что священникам и левитам отвели их места для богослужебного служения; русское «поставили» сохраняет это значение без добавления явно не названного субъекта.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: священников в облачениях
  rationale: Причастие означает «одетые»; в культовом контексте «в облачениях» естественно указывает на одежду священников, не конкретизируя её сверх исходного текста.
- source_word: בַּחֲצֹצְרוֹת
  choice: с трубами
  rationale: חֲצֹצְרוֹת — церемониальные трубы, употреблявшиеся в богослужении.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: а левитов, сыновей Асафа
  rationale: Сохранено родовое обозначение «сыновья Асафа»; союз «а» ясно разграничивает две группы служителей.
- source_word: בַּמְצִלְתַּיִם
  choice: с кимвалами
  rationale: מְצִלְתַּיִם обозначает парные ударные металлические инструменты; традиционное и понятное в библейском регистре русское соответствие — «кимвалы».
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: чтобы славить Яхве
  rationale: Инфинитив с לְ выражает цель расстановки служителей.
- source_word: עַל יְדֵי דָּוִיד
  choice: по установлению Давида
  rationale: Буквально «рукою Давида»; в данном богослужебном контексте идиома указывает на порядок или предписание, восходящее к Давиду.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Прямое и естественное воспроизведение царского титула.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохранено личное заветное имя, а не заменяющий его титул; форма «Яхве» является принятой современной русской транслитерацией.
- issue: Смысл עַל יְדֵי דָּוִיד в контексте храмового богослужения
  choice: по установлению Давида
  alternative: рукою Давида; по указанию Давида; как предписал Давид
  rationale: Перевод раскрывает вероятный идиоматический смысл — богослужебный порядок, установленный через Давида, — а буквальная образность сохранена в примечании, чтобы не скрывать неоднозначность выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность исходного текста, а тире устраняет ненужное повторение глагола. Термин «кимвалы» сохранён как точное и укоренившееся название храмового инструмента.
