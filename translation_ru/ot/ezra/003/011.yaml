base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: ru
  text: 'И они пели попеременно[a], славя и благодаря Яхве: «Ибо Он благ, ибо навеки неизменна Его любовь[b] к Израилю». И весь народ издал громкий возглас, восхваляя Яхве, потому что был основан Дом Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвечали». Еврейский глагол может означать ответ; здесь, вероятно, имеется в виду попеременное, ответное пение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верная любовь»; также возможно: «милость». Еврейское слово обозначает стойкую любовь, благосклонность и верность.'
    reason: lexical_alternative
  - marker: c
    text: То есть было положено основание храма. Буквально еврейский текст говорит, что Дом Яхве был основан.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: пели попеременно
  rationale: В богослужебном контексте глагол ענה указывает на ответное, антифонное исполнение; перевод передаёт как значение ответа, так и песенный характер хвалы.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: славя и благодаря
  rationale: Две параллельные формы обозначают сопутствующие действия; глагольная передача естественна по-русски и сохраняет различие между хвалой и благодарением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя, непосредственно стоящее в еврейском тексте.
- source_word: כִּי טוֹב
  choice: ибо Он благ
  rationale: Сохраняет традиционную формулу исповедальной хвалы и восполняет подразумеваемое местоимение ради ясного русского синтаксиса.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ עַל יִשְׂרָאֵל
  choice: ибо навеки Его неизменная любовь к Израилю
  rationale: «Неизменная любовь» передаёт устойчивую благосклонность и верность חסד, не сужая слово только до милости или до специального богословского термина; עַל передано естественным «к».
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: громко восклицал
  rationale: Еврейский оборот с однокоренным дополнением усиливает возглас; естественный русский оборот передаёт его громкость и общенародный характер без искусственного повтора.
- source_word: בְּהַלֵּל לַיהוָה
  choice: восхваляя Яхве
  rationale: Передаёт характер и направленность общего возгласа как хвалы Яхве.
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: потому что был заложен дом Яхве
  rationale: Форма Hophal от יסד означает, что дом был основан или заложен. Русское «был заложен» сохраняет образ начала строительства и соответствует контексту закладки основания храма.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст употребляет собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Значение חֶסֶד в формуле хвалы
  choice: неизменная любовь
  alternative: милость; верная любовь; заветная любовь
  rationale: Выбор сохраняет сочетание любви, постоянства и верности, не ограничивая многозначное слово одной конфессионально окрашенной трактовкой.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным богослужебным звучанием. Синтаксис сохраняет повтор «ибо» и поэтическую формулу хвалы; архаизмы и конфессионально узкая терминология не используются.
