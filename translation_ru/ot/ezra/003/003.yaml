  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: ru
  text: Они установили жертвенник на его основаниях[a], потому что боялись народов тех земель, и приносили на нём Яхве всесожжения[b] — утром и вечером.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на его опорах»; возможно также: «на его прежнем месте».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейской масоретской традиции написано: «и он принёс», но предписанное чтение: «и они принесли».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: установили
  rationale: Порода hифиль глагола כון здесь обозначает водружение и подготовку жертвенника к употреблению; «установили» естественно передаёт это действие.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычное русское обозначение מִזְבֵּחַ в контексте жертвоприношений.
- source_word: עַל מְכוֹנֹתָיו
  choice: на его основании
  rationale: מְכוֹנוֹתָיו может обозначать основания, опоры либо постоянное место. Единственное число по-русски звучит естественно и сохраняет конкретный образ основания; варианты отмечены в сноске.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת
  choice: потому что боялись народов окрестных земель
  rationale: Естественная русская передача безглагольной идиомы «страх был на них» и причинно-источникового значения מִן. «Окрестных» проясняет контекст, не сводя множественное הָאֲרָצוֹת к одной земле.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: и стали приносить на нём … всесожжения
  rationale: Hифиль עלה с עֹלוֹת — устойчивое выражение о принесении всесожжений. Русское множественное число продолжает явный множественный субъект первой части и согласуется с контекстом; формальное единственное число масоретского глагола отмечено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт собственное заветное имя יהוה, не заменяя его титулом.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: всесожжения — утром и вечером
  rationale: Сохраняет повторное указание на всесожжения и ясно выражает два регулярных времени ежедневной жертвы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В еврейском тексте стоит собственное имя יהוה; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Число субъекта при וַיַּעַל
  choice: 'множественный субъект: «стали приносить»'
  alternative: 'единственный субъект: «он стал приносить»'
  rationale: Масоретская форма глагола имеет единственное число, однако непосредственно предшествующий субъект — множественный, и древние версии и многие переводы продолжают его. Чтобы не создавать в основном тексте неясного «он», выбран контекстуальный множественный субъект, а подлинная грамматическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексикой («жертвенник», «всесожжения»). Синтаксис упрощён ради ясности, но повтор жертвенного термина и регулярность утреннего и вечернего приношения сохранены.
