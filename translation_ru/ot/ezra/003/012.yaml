base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: ru
  text: Но многие из священников, левитов и глав родовых домов[a] — старики, видевшие прежний храм[b], — громко плакали, когда на их глазах закладывали основание этого храма[c], тогда как многие громко восклицали от радости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Главы родовых домов» — руководители больших родственных групп, или родов.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «первый дом»; имеется в виду прежний храм.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный перевод: «когда был основан этот храм».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים
  choice: Но многие
  rationale: Союз ו допускает значение «и», однако «но» естественно передаёт противопоставление радостным возгласам предыдущего стиха.
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: из священников, левитов и глав родовых домов
  rationale: Предлог מִן имеет партитивное значение «из числа». «Главы родовых домов» понятно передаёт руководителей больших родственных групп, сохраняя социальную структуру оригинала.
- source_word: הַזְּקֵנִים
  choice: старики
  rationale: В данном контексте подчёркнут возраст людей, которые ещё видели прежний храм, а не официальная должность старейшин.
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: видевшие прежний храм
  rationale: הָרִאשׁוֹן буквально означает «первый», но в сопоставлении с нынешним зданием имеет смысл «прежний». בַּיִת здесь обозначает храм; русское «храм» устраняет неестественную двусмысленность слова «дом».
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  choice: когда закладывали основание этого храма
  rationale: Форма от יסד обозначает основание или закладку основания. Такая формулировка точно соответствует строительному контексту и сохраняет возможную неопределённость относительно действующего лица.
- source_word: בְּעֵינֵיהֶם
  choice: на их глазах
  rationale: Естественный русский эквивалент идиомы, подчёркивающий непосредственное присутствие свидетелей.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: громко плакали
  rationale: Причастие описывает продолжавшееся действие, а בְּקוֹל גָּדוֹל буквально указывает на сильный, громкий голос; по-русски это естественно передаётся наречием.
- source_word: וְרַבִּים ... בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: тогда как многие другие громко восклицали от радости
  rationale: 'Оборот передаёт одновременную контрастную реакцию: поднятие голоса в радостном крике. «Другие» эксплицирует подразумеваемое различие групп и обеспечивает ясность по-русски.'
