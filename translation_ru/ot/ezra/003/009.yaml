  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: ru
  text: Тогда Иешуа, его сыновья и братья, Кадмиил и его сыновья, потомки Иуды[a], а также потомки Хенадада, их сыновья и братья — левиты — все как один встали, чтобы руководить работниками в доме Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Иуды». В некоторых древних переводах и ряде современных переводов: «сыновья Годавии».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: И встали
  rationale: Глагол עמד буквально означает «стоять, встать, занять место»; множественное число в русском согласовано со всем составным подлежащим.
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Имя передано транслитерацией с еврейского, в форме, отличающей его от более привычной русской формы «Иисус».
- source_word: בָּנָיו וְאֶחָיו
  choice: его сыновья и братья
  rationale: Сохранены прямые термины мужского родства и структура исходного текста.
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: Кадмиил и его сыновья
  rationale: Сохранена параллельная семейная группа; имя транслитерировано в естественной русской форме.
- source_word: בְּנֵי יְהוּדָה
  choice: потомки Иуды
  rationale: Конструкция בני в родословно-групповом значении естественно передаётся словом «потомки»; переведено масоретское чтение «Иуда», а вариант отражён в сноске.
- source_word: כְּאֶחָד
  choice: все как один
  rationale: Передаёт единство совместного действия и является ясным современным русским выражением.
- source_word: לְנַצֵּחַ
  choice: чтобы надзирать
  rationale: В данном строительном контексте порода пиэль указывает на руководство и надзор за исполнителями работы.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: за теми, кто выполнял работу
  rationale: Собирательное причастие передано придаточной конструкцией, сохраняющей процессуальный оттенок.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: в доме Божьем
  rationale: Сохранён храмовый образ «дома Бога» в естественной и достойной русской форме.
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: с ними были потомки Хенадада, их сыновья и братья — левиты
  rationale: Фраза включена в общий перечень надзиравших; заключительное «левиты» сохранено как поясняющее наименование группы. Добавление «с ними были» проясняет синтаксическую связь без изменения смысла.
theological_decisions:
- issue: Текстуальная неопределённость в בְּנֵי יְהוּדָה
  choice: Перевести масоретское чтение как «потомки Иуды».
  alternative: «потомки Годавии»
  rationale: Предоставленный еврейский текст WLC прямо содержит «Иуда». Иное древнее чтение не подменяет основной текст, но отмечается в сноске для сохранения текстуальной прозрачности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Перечислительная структура оригинала сохранена, но пунктуация и связка «с ними были» делают длинную фразу понятной обычному читателю.
