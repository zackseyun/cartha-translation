revisions:
- from: И встали Иешуа, его сыновья и братья, Кадмиил и его сыновья, потомки Иуды[a], — все как один, чтобы надзирать за теми, кто выполнял работу в доме Божьем; с ними были потомки Хенадада, их сыновья и братья — левиты.
  to: Тогда Иешуа, его сыновья и братья, Кадмиил и его сыновья, потомки Иуды[a], а также потомки Хенадада, их сыновья и братья — левиты — все как один встали, чтобы руководить работниками в доме Бога.
  rationale: Заключительная группа включена в единое подлежащее при «встали», как в еврейской перечислительной конструкции, без добавления отдельного сказуемого. Формулировка о руководстве работниками передаёт контекстуальное значение לְנַצֵּחַ и остаётся современной и литературной. Текстологическая сноска сохранена без изменения.
