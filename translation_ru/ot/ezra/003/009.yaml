  - severity: low
    issue: «Надзирать за теми, кто выполнял работу» стилистически тяжеловесно.
    rationale: Пиэль נצח в этом контексте обозначает надзорное руководство работниками. «Руководить работниками» передаёт функцию яснее и естественнее в современном русском.
