  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: ru
  text: Когда наступил седьмой месяц и сыны Израиля находились по городам, народ как один человек собрался туда, в Иерусалим.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «как один человек» означает, что народ действовал сообща, в единстве.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: наступил
  rationale: С обозначением времени глагол נגע («достигать, касаться») идиоматически указывает на наступление месяца; «наступил» естественно для современного русского языка.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: седьмой месяц
  rationale: Прямой перевод еврейского обозначения месяца без подстановки позднейшего названия.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет мужскую форму и корпоративное выражение оригинала; «сыны» уместно в возвышенном библейском регистре и понятно современному читателю.
- source_word: בֶּעָרִים
  choice: находились по городам
  rationale: Предложная конструкция дана предикативно; «по городам» естественно выражает расселение в разных городах, не добавляя отсутствующего в тексте притяжательного местоимения.
- source_word: וַיֵּאָסְפוּ הָעָם
  choice: народ собрался
  rationale: Глагол Niphal от אסף обозначает собрание, а собирательное существительное הָעָם естественно согласуется в русском с единственным числом.
- source_word: כְּאִישׁ אֶחָד
  choice: как один человек
  rationale: Буквально и ясно передаёт образ единства в совместном действии, сохраняя мужской единственный образ оригинала.
- source_word: אֶל יְרוּשָׁלִָם
  choice: в Иерусалим
  rationale: Предлог אֶל обозначает направление движения к месту; русское «собрался в Иерусалим» передаёт эту направленность.
theological_decisions:
- issue: Корпоративный мужской язык в בְּנֵי יִשְׂרָאֵל и כְּאִישׁ אֶחָד
  choice: Сохранить «сыны Израиля» и «как один человек»
  alternative: «израильтяне» и «единодушно»
  rationale: Формулировка сохраняет заметные формы исходного текста и образ корпоративного единства, не превращая их в нейтральный пересказ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Синтаксис упрощён до естественной русской конструкции, при этом сохранены образность и направленность еврейского текста.
