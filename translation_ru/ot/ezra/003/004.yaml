  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: ru
  text: Они совершили праздник Шалашей, как написано, и каждый день приносили положенное число всесожжений по установленному порядку — сколько требовалось на тот день.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: праздник Шалашей
  rationale: Передаёт название праздника естественным современным русским языком и сохраняет образ временных жилищ.
- source_word: כַּכָּתוּב
  choice: как предписано
  rationale: Буквально «как написано»; в данном контексте речь о соблюдении записанного предписания, поэтому выбран естественный функциональный эквивалент.
- source_word: עֹלַת יוֹם בְּיוֹם
  choice: каждый день приносили ... всесожжения
  rationale: Сохраняет и вид жертвы, и ежедневную периодичность, не превращая выражение в отдельный технический термин.
- source_word: בְּמִסְפָּר
  choice: положенное число
  rationale: Передаёт требование приносить установленное для каждого дня количество жертв.
- source_word: כְּמִשְׁפַּט
  choice: по установленному порядку
  rationale: В культовом контексте מִשְׁפָּט обозначает предписанный порядок или установление, а не судебное решение.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: сколько требовалось на тот день
  rationale: Естественно передаёт идиому о ежедневной норме или обязанности каждого конкретного дня.
theological_decisions:
- issue: Основание совершения праздника
  choice: как предписано
  alternative: как написано
  rationale: Формулировка указывает на нормативный письменный текст, не уточняя и не привнося сверх оригинала его конкретное место или богословское толкование.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Синтаксис слегка сглажен для естественного чтения, при этом сохранены культовые термины, ежедневность, установленное количество и порядок приношений.
