  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: ru
  text: Во второй год после того, как они пришли к дому Божьему в Иерусалиме, во втором месяце, Зоровавель, сын Шеалтиэля, Иешуа, сын Иоцадака, остальные их братья — священники и левиты — и все пришедшие из плена[a] в Иерусалим приступили к работе и поставили левитов от двадцати лет и старше руководить работами в доме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из изгнания».'
    reason: Лексема שְׁבִי может обозначать как плен, так и состояние изгнания; оба смысла уместны в контексте возвращения.
lexical_decisions:
- source_word: לְבוֹאָם
  choice: после того, как они пришли
  rationale: Инфинитив с לְ и местоименным суффиксом имеет временное значение; такой перевод естественно передаёт предшествование прихода событиям стиха.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Сохраняет образное и заветное обозначение святилища, не подменяя его более толковательным словом «храм».
- source_word: הֵחֵלּוּ
  choice: приступили к делу
  rationale: Глагол означает «начали», но прямое дополнение в еврейском не выражено. Русская формулировка передаёт эллиптический смысл и избегает неестественного «начали и поставили».
- source_word: וַיַּעֲמִידוּ
  choice: поставили
  rationale: Hiphil от עמד обозначает постановку людей на определённую обязанность; «поставили» сохраняет конкретность исходного образа и административный смысл.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога.
- source_word: לְנַצֵּחַ
  choice: надзирать
  rationale: В данном контексте глагол обозначает руководство и контроль над работами, а не музыкальное служение.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: работы в доме Яхве
  rationale: מְלָאכָה означает труд или работы; нейтральная формулировка не сужает значение исключительно до строительства, хотя контекст его предполагает.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֲחֵיהֶם
  choice: их братья
  rationale: Сохраняет явное мужское множественное число и родственное обозначение исходного текста.
- source_word: מֵהַשְּׁבִי
  choice: из плена
  rationale: Кратко и естественно передаёт состояние и место вынужденного пребывания; возможное значение «из изгнания» отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация сохраняет различие между личным именем и титулом.
- issue: Обозначение святилища בֵּית הָאֱלֹהִים
  choice: дом Божий
  alternative: храм Бога
  rationale: «Дом Божий» следует форме исходного текста и не устраняет его богословски значимый образ; «храм» был бы контекстуальным уточнением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским регистром. Длинное еврейское предложение разделено на два русских для ясности; состав действующих лиц и последовательность действий сохранены. Имена переданы близко к еврейской форме.
