  text: וַ/יִּ֨תְּנוּ כֶ֔סֶף לַ/חֹצְבִ֖ים וְ/לֶ/חָרָשִׁ֑ים וּ/מַאֲכָ֨ל וּ/מִשְׁתֶּ֜ה וָ/שֶׁ֗מֶן לַ/צִּֽדֹנִים֙ וְ/לַ/צֹּרִ֔ים לְ/הָבִיא֩ עֲצֵ֨י אֲרָזִ֤ים מִן הַ/לְּבָנוֹן֙ אֶל יָ֣ם יָפ֔וֹא כְּ/רִשְׁי֛וֹן כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרַ֖ס עֲלֵי/הֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: ru
  text: И дали они деньги каменотёсам и ремесленникам[a], а пищу, питьё и масло — сидонянам и тирянам, чтобы те доставили кедровую древесину из Ливана к морю у Яффы[b], согласно разрешению Кира, царя Персии, полученному ими[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебро каменотёсам и ремесленникам». Еврейское слово может означать как металл, так и деньги в контексте оплаты.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к морю Яффы»; возможно также: «к порту Яффы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по дозволению Кира, царя Персии, для них». Еврейская формулировка допускает оттенки официального разрешения или пожалования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: И дали они
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; русский союз «и» естественно сохраняет её связность.
- source_word: כֶסֶף
  choice: деньги
  rationale: Хотя слово буквально может означать «серебро», в контексте оплаты труда оно естественно обозначает деньги.
- source_word: לַחֹצְבִים
  choice: каменотёсам
  rationale: Причастие от חצב обозначает тех, кто вырубает или обтёсывает камень; этот профессиональный термин ясен в строительном контексте.
- source_word: וְלֶחָרָשִׁים
  choice: и ремесленникам
  rationale: חָרָשׁ обозначает квалифицированного мастера и не уточняет здесь конкретный материал или ремесло.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: а пищу, питьё и масло
  rationale: Передаёт перечень предоставленных припасов; «а» по-русски ясно обозначает смену получателей, не меняя смысла еврейского соединительного союза.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: сидонянам и тирянам
  rationale: Естественные русские названия жителей Сидона и Тира.
- source_word: לְהָבִיא
  choice: чтобы те доставили
  rationale: Инфинитив выражает цель; добавленное местоимение проясняет, что доставку должны осуществить сидоняне и тиряне.
- source_word: עֲצֵי אֲרָזִים
  choice: кедровый лес
  rationale: В строительном контексте сочетание означает заготовленную кедровую древесину; «лес» сохраняет собирательный характер выражения и звучит литературно.
- source_word: מִן הַלְּבָנוֹן
  choice: с Ливана
  rationale: Обычное русское обозначение исходного места доставки.
- source_word: אֶל יָם יָפוֹא
  choice: к морю у Яффы
  rationale: Близко передаёт буквальное «к морю Яффы», не подменяя его более истолковывающим словом «порт».
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ פָּרַס עֲלֵיהֶם
  choice: согласно разрешению, данному им Киром, царём Персии
  rationale: Естественно передаёт царское разрешение и относит местоимение עֲלֵיהֶם к тем, кто получил разрешение, не воспроизводя неестественное русское «на них».
