translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; географическое имя יָפוֹא передано традиционной русской формой «Яффа». Подлинная неоднозначность כֶסֶף, יָם יָפוֹא и רִשְׁיוֹן отмечена в сносках.
