  text: מִ/יּ֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י הֵחֵ֕לּוּ לְ/הַעֲל֥וֹת עֹל֖וֹת לַ/יהוָ֑ה וְ/הֵיכַ֥ל יְהוָ֖ה לֹ֥א יֻסָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: ru
  text: С первого дня седьмого месяца они начали приносить всесожжения Яхве, хотя основание храма Яхве ещё не было заложено.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но основание храма Яхве ещё не было заложено»; буквальнее союз можно передать как «и». Жертвоприношения начались до закладки основания храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: С первого дня седьмого месяца
  rationale: Предлог מִן обозначает исходную точку во времени; «с первого дня» сохраняет этот оттенок точнее, чем «в первый день».
- source_word: הֵחֵלּוּ
  choice: они начали
  rationale: Прямое и естественное соответствие форме со значением начала действия.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: приносить всесожжения
  rationale: Устойчивый русский эквивалент жертвенного оборота; передаёт жертвы, целиком сжигаемые на жертвеннике, без буквального и неестественного «возносить».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя יהוה.
- source_word: וְהֵיכַל יְהוָה
  choice: храма Яхве
  rationale: В контексте восстановления святилища הֵיכָל естественно означает «храм».
- source_word: לֹא יֻסָּד
  choice: основание ... ещё не было заложено
  rationale: Пассив глагола יסד означает закладку основания; существительное «основание» грамматически подразумевается и естественно восполняется по-русски.
- source_word: וְ
  choice: хотя
  rationale: 'В контексте союз выражает уступительное противопоставление: жертвоприношения начались до закладки основания храма.'
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл союза וְ перед упоминанием незаложенного основания
  choice: хотя
  alternative: и / но
  rationale: «Хотя» ясно передаёт вероятную уступительную связь, однако буквальная соединительная и противительная трактовки остаются возможными и отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Термин «всесожжения» сохранён как привычное библейское культовое обозначение. Маркер сноски поставлен после всего предложения, к которому относится пояснение о союзе.
