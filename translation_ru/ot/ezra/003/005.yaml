  - severity: low
    issue: «Освящённые праздники» менее ясно передаёт составное культовое определение.
    rationale: מוֹעֲדֵי יהוה הַמְקֻדָּשִׁים обозначает установленные священные времена Яхве. Формулировка «священные установленные праздники Яхве» естественнее в русском и не сужает значение до светского празднования.
