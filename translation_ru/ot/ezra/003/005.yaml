  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: ru
  text: После этого приносили постоянное всесожжение[a], а также жертвы в новомесячия[b], во все священные установленные праздники Яхве[c] и приношения от каждого, кто добровольно приносил Яхве добровольную жертву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непрестанное всесожжение»; по смыслу речь может идти о ежедневном всесожжении.'
    reason: lexical_alternative
  - marker: b
    text: Новомесячия — священные дни в начале каждого месяца, определявшиеся по появлению новой луны.
    reason: cultural_note
  - marker: c
    text: 'Или: «во все освящённые установленные времена»; еврейское слово может обозначать назначенные священные времена или праздники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временной переход и последовательность, выраженные союзом и обстоятельственным оборотом.
- source_word: עֹלַת תָּמִיד
  choice: постоянное всесожжение
  rationale: «Всесожжение» точно обозначает жертву, целиком сжигаемую на жертвеннике; תָּמִיד указывает на её регулярный, непрестанно повторяющийся характер, не требуя в основном тексте более узкого «ежедневное».
- source_word: וְלֶחֳדָשִׁים
  choice: жертвы в новомесячия
  rationale: В культовом контексте חֳדָשִׁים обозначает празднование начала каждого месяца при появлении новой луны. Слово «жертвы» подразумевается контекстом и добавлено для ясности русского синтаксиса.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה הַמְקֻדָּשִׁים
  choice: во все освящённые праздники Яхве
  rationale: מוֹעֲדִים здесь — установленные священные времена, отмечаемые как праздники; причастие הַמְקֻדָּשִׁים передано как «освящённые», то есть отделённые для священного назначения.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: приношения каждого, кто добровольно приносил… добровольную жертву
  rationale: Сохранена смысловая связь однокоренных еврейских слов, выражающих добровольность; «приношения» добавлено как подразумеваемое существительное в перечне жертв.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и согласуется с предоставленным актуальным решением консультационного слоя.
- issue: Характер עֹלַת תָּמִיד
  choice: постоянное всесожжение
  alternative: ежедневное всесожжение
  rationale: Контекст может относить выражение к ежедневной установленной жертве, однако само תָּמִיד шире и означает регулярность или постоянство; основной текст не сужает эту смысловую возможность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Глагол «приносили» и существительные «жертвы/приношения» восстановлены из жертвенного контекста, поскольку еврейский стих представляет собой эллиптическое продолжение перечня. Повтор «добровольно… добровольную» сохраняет заметную однокоренную конструкцию оригинала.
