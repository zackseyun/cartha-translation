base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: ru
  text: Тогда поднялись Иешуа, сын Иоцадака, и его братья-священники[a], а также Зеруббавель, сын Шеалтиэля, и его братья. Они построили жертвенник Бога Израиля, чтобы возносить на нём всесожжения, как написано в Законе[b] Моисея, человека Божьего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его братья, священники». Еврейское слово может также обозначать близких родственников или соратников.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово тора может означать также «наставление».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: поднялись
  rationale: Глагол קום здесь вводит решительное совместное действие названных далее лиц. Множественное число естественно по-русски согласует сказуемое с составным подлежащим.
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Передача послепленного еврейского имени транслитерацией позволяет отличить данную форму имени и держаться исходного текста.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: его братья-священники
  rationale: Сохраняется основное значение אָח — «брат», а приложение «священники» ясно определяет группу Иешуа; возможный расширенный смысл отмечен в сноске.
- source_word: זְרֻבָּבֶל
  choice: Зеруббавель
  rationale: Имя передано близкой к еврейской форме русской транслитерацией.
- source_word: שְׁאַלְתִּיאֵל
  choice: Шеалтиэль
  rationale: Имя транслитерировано непосредственно с еврейской формы.
- source_word: וַיִּבְנוּ
  choice: построили
  rationale: בנה означает «строить»; исторически возможное восстановление жертвенника не выражено самим глаголом, поэтому значение «восстановили» не внесено.
- source_word: מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל
  choice: жертвенник Богу Израиля
  rationale: Естественная русская передача принадлежности и посвящения жертвенника при сохранении выражения «Бог Израиля».
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: чтобы возносить на нём всесожжения
  rationale: Сакральная идиома с Hiphil עלה передана обычным русским выражением «возносить всесожжения»; местоименная ссылка на жертвенник сохранена.
- source_word: כַּכָּתוּב
  choice: как написано
  rationale: Краткая естественная формула соответствия письменному предписанию.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человека Божьего
  rationale: Традиционное и понятное русское обозначение Моисея, прямо сохраняющее конструкцию исходного текста.
theological_decisions:
- issue: Значение אחים в обозначении представительной группы
  choice: братья
  alternative: родственники; соплеменники; соратники
  rationale: Основное родственное значение сохранено в тексте, однако сноска предупреждает о возможном расширенном употреблении слова в отношении близких родственников или соратников.
- issue: Передача תּוֹרָה в контексте письменных жертвенных предписаний
  choice: Закон
  alternative: наставление; Тора
  rationale: В данном контексте речь идёт о записанном предписании, которому следуют при жертвоприношении. «Закон» естественно передаёт эту функцию, а более широкий диапазон значения указан в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Имена переданы близко к еврейским формам; культовые термины «жертвенник» и «всесожжение» сохранены как точные и общеупотребительные в библейском контексте.
