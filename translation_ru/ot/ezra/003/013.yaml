  text: וְ/אֵ֣ין הָ/עָ֗ם מַכִּירִים֙ ק֚וֹל תְּרוּעַ֣ת הַ/שִּׂמְחָ֔ה לְ/ק֖וֹל בְּכִ֣י הָ/עָ֑ם כִּ֣י הָ/עָ֗ם מְרִיעִים֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וְ/הַ/קּ֥וֹל נִשְׁמַ֖ע עַד לְ/מֵ/רָחֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: ru
  text: И народ не мог отличить звук радостных возгласов от звука плача народа[a], ибо народ издавал громкий крик, и этот звук был слышен далеко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не мог распознать звук радостных возгласов и звук плача народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: не мог отличить
  rationale: В породе hифиль глагол נכר здесь означает способность различить два одновременно звучащих проявления.
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: радостные возгласы
  rationale: תְּרוּעָה обозначает громкий крик или возглас, а הַשִּׂמְחָה передаёт его радостный характер; множественное число естественно по-русски для общего крика множества людей.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: от плача народа
  rationale: Буквально — «от звука плача народа»; в русском слове «плач» уже заключён смысл слышимого проявления, поэтому повтор слова «звук» не требуется.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему два звука невозможно было различить.
- source_word: מְרִיעִים תְּרוּעָה גְדוֹלָה
  choice: громко восклицал
  rationale: Еврейская однокоренная конструкция буквально означает «восклицал великим возгласом»; естественный русский оборот передаёт силу и громкость крика без тяжеловесного повтора.
- source_word: וְהַקּוֹל נִשְׁמַע עַד לְמֵרָחוֹק
  choice: и этот шум был слышен издалека
  rationale: קוֹל здесь охватывает смешанный гул возгласов и плача, поэтому «шум» точнее русского «голос»; пассивная форма נִשְׁמַע сохранена.
