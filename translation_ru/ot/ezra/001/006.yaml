base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: ru
  text: Все окружавшие их поддержали их серебряными сосудами, золотом, имуществом, скотом и ценными вещами[a], помимо всего, что было принесено добровольно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отборными вещами»; возможно также: «лакомствами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «помимо всех добровольных приношений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: все, кто жил вокруг них
  rationale: Передаёт людей из ближайшего окружения, не сужая значение до непосредственных соседей.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: поддержали их
  rationale: Еврейская идиома буквально говорит об укреплении рук, но в данном контексте означает практическую материальную помощь; естественный русский перевод передаёт её смысл.
- source_word: בִּכְלֵי כֶסֶף
  choice: серебряными сосудами
  rationale: כְּלִי обозначает сосуд, предмет или принадлежность; в перечне ценностей «сосуды» сохраняет конкретность и традиционную образность.
- source_word: בַּזָּהָב
  choice: золотом
  rationale: Самостоятельное существительное естественно продолжает перечень пожертвованных ценностей без добавления отсутствующего в тексте слова «изделия».
- source_word: בָּרְכוּשׁ
  choice: имуществом
  rationale: רְכוּשׁ означает имущество или пожитки, преимущественно движимые; «имущество» здесь ясно и уместно в перечне средств.
- source_word: וּבַבְּהֵמָה
  choice: скотом
  rationale: Собирательное בְּהֵמָה в хозяйственном контексте обозначает домашних животных как собственность.
- source_word: וּבַמִּגְדָּנוֹת
  choice: ценными дарами
  rationale: מִגְדָּנוֹת может обозначать драгоценные, отборные вещи или лакомства; широкий перевод не ограничивает значение пищей.
- source_word: לְבַד
  choice: помимо
  rationale: Ясно выражает добавление к уже перечисленной помощи.
- source_word: עַל כָּל הִתְנַדֵּב
  choice: всего, что было принесено добровольно
  rationale: Сжатая еврейская конструкция указывает на добровольное приношение, не называя явно того, кто его принёс.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Еврейская идиома חִזְּקוּ בִידֵיהֶם передана по смыслу ради естественности; неоднозначность редкого מִגְדָּנוֹת и сжатой заключительной конструкции сохранена в примечаниях.
