base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: ru
  text: Пусть всякий из его народа, кто находится среди вас, — да будет с ним его Бог! Пусть он поднимется в Иерусалим, который в Иудее, и заново построит[a] дом Яхве, Бога Израиля. Он — Бог, который в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «построит». «Заново построит» поясняет, что речь идёт о восстановлении разрушенного храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Кто бы ни был среди вас из всего его народа
  rationale: מִי в контексте царского воззвания выражает открытое приглашение, поэтому передано конструкцией «кто бы ни был». Местоименный суффикс сохранён как «его» без уточнения референта.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: да будет с ним его Бог
  rationale: Юссив יְהִי передан как благопожелание; сохранён торжественный тон указа.
- source_word: וְיַעַל
  choice: пусть он поднимется
  rationale: Глагол עלה буквально означает движение вверх и традиционно употребляется о пути в Иерусалим; «поднимется» сохраняет географический и культовый оттенок.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: в Иерусалим, который в Иудее
  rationale: Относительное придаточное сохранено как географическое уточнение.
- source_word: וְיִבֶן
  choice: и заново построит
  rationale: בנה буквально означает «строить»; добавление «заново» естественно выражает восстановительный контекст после разрушения, а буквальный вариант указан в сноске.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранён образ «дома», а тетраграмматон передан личным именем «Яхве».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая передача древнееврейской сопряжённой конструкции.
- source_word: הוּא הָאֱלֹהִים
  choice: Он — тот Бог
  rationale: Указательное «тот» в русском языке передаёт определённость существительного הָאֱלֹהִים и эмфатическое отождествление.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: Который в Иерусалиме
  rationale: Локативная формулировка сохранена без богословского сглаживания; эллиптическая русская конструкция близка сжатости оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Высказывание о Боге, «Который в Иерусалиме»
  choice: Сохранить прямую локативную формулировку
  alternative: Смягчить как «Которому поклоняются в Иерусалиме» или опустить локативный смысл
  rationale: Это историческая формулировка указа Кира. Перевод сохраняет присущее тексту напряжение и не привносит позднейшего богословского пояснения.
- issue: Определённость в הוּא הָאֱלֹהִים
  choice: Он — тот Бог
  alternative: Он — Бог
  rationale: Вариант с «тот» заметно передаёт артикль и отождествляющее ударение, не превращая фразу в отвлечённое утверждение.
translation_notes:
  register: Современный литературный русский с торжественной интонацией царского воззвания. Синтаксис сделан понятным для широкого читателя, но сохранены образ «дома Яхве», движение «вверх» к Иерусалиму и древняя локативная формулировка о Боге.
