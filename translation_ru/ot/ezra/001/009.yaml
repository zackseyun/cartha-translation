lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: И вот их число
  rationale: Естественно вводит перечень, сохраняя значение буквального «и вот их число».
- source_word: אֲגַרְטְלֵי
  choice: чаш
  rationale: Редкое слово обозначает храмовые сосуды; «чаши» ясно и уместно передаёт вид ёмкости, не приписывая ей чрезмерно узкой функции.
- source_word: זָהָב / כֶסֶף
  choice: золотых / серебряных
  rationale: Материал сосудов естественно выражен в русском языке относительными прилагательными.
- source_word: מַחֲלָפִים
  choice: ножей
  rationale: Традиционное и правдоподобное понимание редкого термина как храмовых или жертвенных ножей; лексическая неуверенность и другие возможные значения сохранены в сноске.
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1 000 / 29
  rationale: Цифры удобны для чтения инвентарного перечня; пробел в числе 1 000 соответствует современной русской типографике.
