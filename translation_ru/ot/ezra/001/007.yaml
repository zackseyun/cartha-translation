base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: ru
  text: И царь Кир вынес сосуды дома Яхве[a], которые Навуходоносор вынес из Иерусалима и поместил в доме своего бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуды храма Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: царь Кир
  rationale: Естественный для современного русского языка порядок титула и имени; определённость передаётся контекстом.
- source_word: הוֹצִיא ... הוֹצִיא
  choice: вынес ... вынес
  rationale: Одинаковый перевод двух употреблений одного глагола сохраняет намеренный словесный повтор и противопоставление действий Кира и Навуходоносора.
- source_word: כְּלֵי
  choice: сосуды
  rationale: В храмовом контексте это традиционное и понятное обозначение священной утвари без излишнего уточнения её видов.
- source_word: בֵית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» и лексическую параллель с домом бога Навуходоносора; значение «храм» указано в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיִּתְּנֵם
  choice: поместил
  rationale: В сочетании с указанием места נתן означает, что предметы положили или поставили туда; «поместил» естественно передаёт этот смысл.
- source_word: בְּבֵית אֱלֹהָיו
  choice: в доме своего бога
  rationale: Сохраняет единственное число еврейского текста и параллель с «домом Яхве»; возвратное «своего» ясно относит бога к Навуходоносору.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это отличие от титула.
- issue: Число в выражении אֱלֹהָיו
  choice: своего бога
  alternative: своих богов
  rationale: Форма в данном контексте грамматически единственного числа с суффиксом третьего лица мужского рода; перевод не расширяет её до вавилонского пантеона.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «вынес ... вынес» сохранён как значимая черта оригинала; «дом» оставлен ради образа и параллелизма, а более привычное «храм» вынесено в сноску.
