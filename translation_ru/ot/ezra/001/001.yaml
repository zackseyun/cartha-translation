base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: ru
  text: 'В первый год правления Кира, царя Персии, чтобы исполнилось слово Яхве[a], изречённое устами Иеремии[b], Яхве пробудил дух Кира, царя Персии, и тот велел огласить по всему своему царству, а также изложить письменно[c], следующее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы завершилось слово Яхве». Здесь речь идёт об осуществлении пророческого слова.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из уст Иеремии» — еврейский оборот, указывающий, что Иеремия был тем, через кого прозвучало слово Яхве.'
    reason: idiom_explanation
  - marker: c
    text: Еврейский текст говорит о распространении официального объявления по всему царству и добавляет, что оно было дано также письменно.
    reason: idiom_explanation
