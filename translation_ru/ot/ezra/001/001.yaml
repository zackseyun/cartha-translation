- source_word: מִפִּי יִרְמְיָה
  choice: изречённое устами Иеремии
  rationale: Сохраняется образ исходного текста — буквально «из уст Иеремии», — но оборот оформлен как естественная русская характеристика пророческого слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: הֵעִיר ... אֶת רוּחַ כֹּרֶשׁ
  choice: побудил дух Кира
  rationale: Передаёт божественное побуждение к действию и сохраняет широту רוּחַ — дух, внутренний настрой или побуждение, — не сводя его только к мысли либо решению.
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: тот велел огласить по всему своему царству
  rationale: Еврейская идиома буквально описывает распространение голоса или объявления; русский оборот ясно передаёт официальное публичное провозглашение.
- source_word: וְגַם בְּמִכְתָּב
  choice: а также изложить письменно
  rationale: Фраза добавляет письменную форму к публичному объявлению; перевод сохраняет это смысловое дополнение.
- source_word: לֵאמֹר
  choice: 'следующее:'
  rationale: Естественное русское введение последующей прямой речи официального указа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; «Яхве» передаёт его прямо и не подменяет титулом.
- issue: Значение исполнения пророческого слова
  choice: чтобы исполнилось слово Яхве
  alternative: чтобы завершилось слово Яхве; для завершения слова Яхве
  rationale: Контекст связывает указ Кира с осуществлением слова, данного через Иеремию. «Исполнилось» выражает эту связь, не уточняя сверх текста способ её осуществления.
- issue: Действие Бога на רוּחַ Кира
  choice: Яхве побудил дух Кира
  alternative: Яхве побудил Кира; Яхве пробудил решимость Кира
  rationale: Формулировка сохраняет прямое упоминание «духа» и божественную инициативу, не определяя точнее, означает ли רוּחַ дух, внутренний настрой или волю.
