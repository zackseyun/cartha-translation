source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: ru
  text: 'Так говорит Кир, царь Персии: «Яхве, Бог небес, отдал мне все царства земли, и Он поручил мне[a] построить ему дом[b] в Иерусалиме, который находится в Иудее».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возложил на меня обязанность».'
    reason: lexical_alternative
  - marker: b
    text: То есть храм в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет торжественную формулу официального провозглашения и естественно звучит в современном литературном русском языке.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: Кир, царь Персии
  rationale: Передаёт имя по принятой русской форме, а царский титул — как приложение к имени.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: все царства земли
  rationale: Сохраняет множественное число מַמְלְכוֹת и передаёт הָאָרֶץ в широком, соответствующем имперскому провозглашению значении.
- source_word: נָתַן לִי
  choice: отдал мне
  rationale: Глагол совершенного вида выражает завершённое дарование власти, результат которого сохраняется к моменту указа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Бог небес
  rationale: Естественная русская передача устойчивого титула; множественная форма שָׁמַיִם отражена собирательным «небес».
- source_word: וְהוּא פָקַד עָלַי
  choice: и поручил мне
  rationale: Передаёт идею возложения поручения или ответственности; повторное местоимение в русском опущено как избыточное, поскольку субъект остаётся ясным.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: построить Ему дом
  rationale: Сохраняет буквальное значение בַיִת «дом», не подменяя его в основном тексте контекстуальным толкованием «храм».
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: в Иерусалиме, который находится в Иудее
  rationale: Явно сохраняет относительное придаточное и географическое уточнение исходного текста.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Значение בַיִת в контексте восстановления святилища
  choice: дом
  alternative: храм
  rationale: Основной текст сохраняет непосредственное лексическое значение и не устраняет образ «дома» Бога; контекстуальное значение пояснено в сноске.
- issue: Степень обязательности в פָקַד עָלַי
  choice: поручил мне
  alternative: возложил на меня обязанность
  rationale: Еврейское выражение допускает оттенки назначения, поручения и властного предписания; выбранная формулировка сохраняет комиссивный смысл без чрезмерного усиления.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном царского указа. Синтаксис остаётся ясным для широкого читателя; буквальное «дом» сохранено, а подразумеваемый храм пояснён сноской.
