  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: ru
  text: А всякого, кто останется[a], где бы он ни жил, пусть местные жители[b] поддержат[c] серебром и золотом, имуществом и скотом, а также добровольным приношением для дома Божьего, который в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто остался»; также возможно понимание: «где бы он ни проживал как переселенец».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мужи его места»; выражение может обозначать местных жителей или соседей.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «помогут». Еврейский глагол буквально означает «поднимать, нести», а здесь — оказывать практическую помощь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: всякого, кто останется
  rationale: Причастие нифаля от שׁאר обозначает того, кто остался или был оставлен; в контексте указа речь идёт об иудее, остающемся в месте своего проживания.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: где бы он ни жил
  rationale: Естественно передаёт обобщённое указание на любое место проживания; גָר здесь может означать как временное пребывание, так и проживание.
- source_word: יְנַשְּׂאֻהוּ
  choice: пусть ... поддержат
  rationale: Буквальное значение корня נשׂא — «поднимать, нести», но перечисление материальных средств указывает на практическую помощь и снабжение.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: местные жители
  rationale: Буквально «мужи его места»; по функции выражение обозначает людей той местности, возможно соседей. Современное русское выражение передаёт общественный референт без неоправданного ограничения только взрослыми мужчинами.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: серебром и золотом
  rationale: Сохраняет обычные названия драгоценных металлов и не сужает серебро до монет или денег.
- source_word: וּבִרְכוּשׁ
  choice: имуществом
  rationale: רְכוּשׁ означает имущество или пожитки, прежде всего движимые ценности; «имущество» естественно в перечне средств помощи.
- source_word: וּבִבְהֵמָה
  choice: скотом
  rationale: Собирательное בְּהֵמָה обозначает домашних животных, представляющих имущество и пригодных для перевозки.
- source_word: עִם הַנְּדָבָה
  choice: а также добровольным приношением
  rationale: נְדָבָה — добровольный дар или приношение. «А также» естественно присоединяет его к прочим видам помощи, сохраняя возможность понимать его как отдельный дар для храма.
- source_word: לְבֵית הָאֱלֹהִים
  choice: для дома Божьего
  rationale: Передаёт буквальное выражение «дом Бога» и сохраняет его культовое значение без замены толкованием «храм».
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: который в Иерусалиме
  rationale: Простое относительное придаточное локализует дом Божий; опущенная русская связка соответствует современному употреблению.
theological_decisions:
- issue: Круг лиц в выражении אַנְשֵׁי מְקֹמוֹ
  choice: местные жители
  alternative: мужи того места; его соседи
  rationale: Хотя אַנְשֵׁי формально имеет мужской род, устойчивое сочетание может обозначать население местности шире. «Местные жители» естественно передаёт общественную функцию выражения, а буквальная форма отмечена в сноске.
- issue: Значение יְנַשְּׂאֻהוּ
  choice: пусть ... поддержат
  alternative: пусть ... помогут; пусть ... снабдят; пусть ... понесут его
  rationale: Материальный перечень делает буквальное «понесут/поднимут» неестественным. «Поддержат» сохраняет образ содействия, не уточняя сверх текста, предназначены ли все средства для пути, переселения или строительства.
- issue: Соотношение материальной помощи и добровольного приношения
  choice: а также добровольным приношением
  alternative: вместе с добровольным приношением; помимо добровольного приношения
  rationale: Предлог עִם буквально означает «с, вместе с». Русское «а также» сохраняет присоединение приношения к перечню, не утверждая категорически, включено ли оно в личную поддержку возвращающегося или является отдельным храмовым даром.
translation_notes:
  register: Современный литературный русский язык с достоинством царского указа. Синтаксис упрощён до естественной русской конструкции, при этом сохранены «серебро и золото», «дом Божий» и неоднозначность характера поддержки. Все сноски отмечены в основном тексте.
