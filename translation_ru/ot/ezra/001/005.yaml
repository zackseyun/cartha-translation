  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: ru
  text: Тогда встали главы родов Иуды и Вениамина[a], священники и левиты — все, чей дух пробудил Бог[b], — чтобы подняться в Иерусалим и построить дом Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главы отеческих домов»; то есть главы родов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чей дух Бог возбудил»; возможен также смысл: «кого Бог побудил в духе».'
    reason: lexical_alternative
  - marker: c
    text: «Дом Яхве» — храм.
    reason: clarification
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: встали
  rationale: Глагол קום обозначает начало ответного действия. «Встали» сохраняет повествовательное движение, не подменяя его самим отправлением в путь.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главы родов
  rationale: Это обозначение руководителей родовых объединений. Русское «главы родов» естественно и сохраняет социально-родственную структуру выражения.
- source_word: לִיהוּדָה וּבִנְיָמִן
  choice: Иуды и Вениамина
  rationale: Предлог ל здесь выражает принадлежность; родительный падеж естественно передаёт связь с племенами Иуды и Вениамина.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священники и левиты
  rationale: Общепринятые русские обозначения соответствующих культовых и родовых групп.
- source_word: לְכֹל הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: все, чей дух пробудил Бог
  rationale: Распределительная конструкция охватывает каждого из названных людей. «Пробудил» передаёт внутреннее побуждение, а «дух» сохраняет явное רוּחַ и не сужает его до чувств или намерения.
- source_word: לַעֲלוֹת
  choice: подняться
  rationale: עלה — традиционный глагол движения в Иерусалим; «подняться» сохраняет географический и паломнический оттенок.
- source_word: לִבְנוֹת
  choice: построить
  rationale: В еврейском тексте употреблено простое «строить». Хотя по контексту речь идёт о восстановлении, приставка «вос-» отсутствует и потому не добавлена.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквально «дом Яхве». Такой перевод сохраняет исходный образ; по контексту речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: что в Иерусалиме
  rationale: Кратко и естественно передаёт относительное придаточное, указывающее местонахождение дома.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Степень истолкования Божьего воздействия в הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: чей дух пробудил Бог
  alternative: кого Бог побудил
  rationale: Выбранная формулировка прямо приписывает внутреннее пробуждение Богу, но не уточняет его механизм и сохраняет упоминание человеческого духа.
- issue: Передача בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: «Дом» воспроизводит образ исходного текста, тогда как «храм» верно поясняет референт, но является более истолковывающим вариантом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет перечисление и вставное уточнение еврейского текста; лексика остаётся понятной широкому читателю.
