  terminology: «Предметы из золота и серебра» сохраняет широту כֵּלִים без добавления храмовой характеристики. «Изгнанники» приемлемо передаёт הַגּוֹלָה в данном контексте. Имя дано в обычной русской библейской форме «Шешбацар».
