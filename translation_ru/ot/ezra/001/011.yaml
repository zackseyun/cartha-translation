  text: כָּל כֵּלִים֙ לַ/זָּהָ֣ב וְ/לַ/כֶּ֔סֶף חֲמֵ֥שֶׁת אֲלָפִ֖ים וְ/אַרְבַּ֣ע מֵא֑וֹת הַ/כֹּ֞ל הֶעֱלָ֣ה שֵׁשְׁבַּצַּ֗ר עִ֚ם הֵעָל֣וֹת הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל לִ/ירוּשָׁלִָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: ru
  text: Всех предметов из золота и серебра было пять тысяч четыреста[a]. Всё это Шешбацар доставил вместе с изгнанниками[c], при их возвращении из Вавилона в Иерусалим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосудов» или «утвари». Еврейское слово может обозначать сосуды, утварь и различные предметы.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь дважды употреблён глагол со значением «поднимать, вести вверх» — традиционное выражение для движения в Иерусалим.
    reason: cultural_note
  - marker: c
    text: 'Или: «с общиной изгнанников». Еврейское слово может обозначать как изгнанников, так и изгнанническую общину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: всего … храмовых предметов
  rationale: כֵּלִים — широкое обозначение сосудов, утвари и иных предметов. В данном контексте речь идёт о предметах Иерусалимского храма; «храмовые предметы» естественно и достаточно широко передаёт смысл.
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: золотых и серебряных
  rationale: Предлоги לְ здесь распределяют предметы по материалу; русские прилагательные передают это кратко и естественно.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת הַכֹּל
  choice: Всего … было пять тысяч четыреста
  rationale: הַכֹּל указывает на общий итог; конструкция с «всего» естественна в современном русском повествовании.
- source_word: הֶעֱלָה שֵׁשְׁבַּצַּר
  choice: Шешбаццар доставил
  rationale: Каузатив עלה буквально выражает движение вверх. В русском «поднял предметы в Иерусалим» звучит неестественно, поэтому в тексте выбран контекстуально ясный глагол, а исходный образ отмечен в сноске.
- source_word: עִם הֵעָלוֹת הַגּוֹלָה
  choice: вместе с изгнанниками, когда их вели
  rationale: הַגּוֹלָה здесь обозначает общину возвращавшихся изгнанников, а инфинитивная конструкция описывает обстоятельство их перемещения.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: из Вавилона в Иерусалим
  rationale: Прямое и естественное соответствие названиям мест и направлению движения.
theological_decisions:
- issue: Образ восхождения в двукратном употреблении עלה
  choice: Передать движение естественными русскими глаголами и сохранить образ в сноске
  alternative: 'Буквально: «поднял … когда поднимали изгнанников»'
  rationale: Дважды употреблённый корень עלה отражает обычное представление о восхождении в Иерусалим. Буквальная русская конструкция была бы тяжеловесной и могла бы затемнить смысл, но сноска сохраняет географический и литературный оттенок без догматического расширения.
- issue: Значение הַגּוֹלָה
  choice: изгнанники
  alternative: изгнание; община изгнанников; переселенцы
  rationale: В данном контексте слово обозначает возвращавшихся людей, а не отвлечённое состояние изгнания.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. «Храмовые предметы» уточняет подразумеваемый контекст, не сужая широкого значения כֵּלִים; возможные более буквальные варианты вынесены в сноску. Числительное дано словами в соответствии со стилем библейской прозы.
