base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: ru
  text: Кир, царь Персии, велел вынести их через казначея Митредата[a] и пересчитал их для Шешбацара, предводителя Иудеи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Митредата, казначея»; то есть при его посредстве или через него.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «князя Иудеи»; возможно также: «правителя Иудеи». Еврейское слово обозначает главу или руководителя, не уточняя здесь его должность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: велел вынести их
  rationale: Хифиль от יצא выражает каузативное действие. В контексте речь идёт о храмовых сосудах из предыдущего стиха; формулировка показывает, что Кир распорядился вынести их.
- source_word: עַל יַד
  choice: через
  rationale: Идиома буквально означает «рукой» и здесь указывает на посредника, через которого Кир исполнил распоряжение.
- source_word: מִתְרְדָת
  choice: Митредат
  rationale: Принята естественная для русского языка транслитерация персидского личного имени.
- source_word: הַגִּזְבָּר
  choice: казначей
  rationale: Слово обозначает должностное лицо, ведавшее казной; краткий русский эквивалент точно соответствует контексту хранения и передачи сосудов.
- source_word: וַיִּסְפְּרֵם
  choice: тот пересчитал их
  rationale: Глагол ספר здесь означает считать или перечислять предметы. Явное «тот» естественно связывает действие с ближайшим названным участником — Митредатом, не меняя еврейского субъекта; «пересчитал» подходит к передаче учтённых ценностей.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: для Шешбацара
  rationale: Предлог ל обозначает адресата счёта или передачи. «Для» сохраняет эту связь без добавления отсутствующего в тексте глагола «передал».
- source_word: הַנָּשִׂיא
  choice: предводитель
  rationale: נָשִׂיא обозначает главу, вождя или правителя. «Предводитель» сохраняет широкий смысл и не приписывает Шешбацару более специальный персидский административный титул.
- source_word: לִיהוּדָה
  choice: Иудеи
  rationale: В сочетании с обозначением главы предлог выражает его отношение к Иудее; родительный падеж звучит по-русски естественно.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Кир, царь Персии
  rationale: Русский порядок слов и приложение естественно передают имя, царский титул и державу.
theological_decisions:
- issue: Значение титула נָשִׂיא применительно к Шешбацару
  choice: предводитель Иудеи
  alternative: князь Иудеи; правитель Иудеи
  rationale: Исходное слово имеет широкий диапазон значений и само по себе не устанавливает ни царское происхождение, ни конкретную персидскую должность; нейтральный перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис проясняет смену действующего лица, подразумеваемую еврейскими формами, а сноски сохраняют буквальную идиому и широту титула.
