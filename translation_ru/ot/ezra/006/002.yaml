  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: ru
  text: 'И в Экбатане[a], в крепости[b], которая находится в провинции Мидия, был найден свиток, и вот что было записано в нём как памятная запись[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ахмета» — более близкая передача арамейского названия Экбатаны.'
