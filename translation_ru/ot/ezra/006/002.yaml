  - marker: b
    text: 'Или: «цитадель». Арамейское слово обозначает укреплённый царский или административный комплекс.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «документ» или «памятная записка». Имеется в виду официальная архивная запись.'
