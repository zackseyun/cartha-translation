lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: был найден
  rationale: Страдательное значение арамейского глагола точно соответствует контексту поиска в царских архивах.
- source_word: אַחְמְתָא
  choice: Экбатане
  rationale: «Экбатана» — принятое в русском языке историческое название столицы Мидии; форма «Ахмета» ближе к арамейскому звучанию и отмечена в сноске.
- source_word: בִּירְתָא
  choice: крепости
  rationale: Слово обозначает укреплённый царский или административный комплекс; «крепость» понятно современному читателю и не сужает значение до дворца.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: которая находится в области Мидии
  rationale: Явно передаёт относительное предложение и административное значение מְדִינָה; настоящее время сохраняет форму арамейского текста.
- source_word: מְגִלָּה חֲדָה
  choice: один свиток
  rationale: Передаёт существительное «свиток» и сохраняет выраженное в источнике חֲדָה «один» без чрезмерного смыслового усиления.
- source_word: וְכֵן כְּתִיב
  choice: и в нём было написано следующее
  rationale: Естественно вводит содержание обнаруженного документа и передаёт указательную функцию כֵּן.
- source_word: בְּגַוַּהּ
  choice: в нём
  rationale: Прямое и естественное обозначение текста, находившегося внутри свитка.
- source_word: דִּכְרוֹנָה
  choice: как памятная запись
  rationale: Сохраняет идею официального письменного напоминания или архивной записи, не отождествляя термин однозначно с современным жанром служебной записки.
