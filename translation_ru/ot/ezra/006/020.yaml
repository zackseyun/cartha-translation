base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: ru
  text: Ведь священники и левиты очистились как один — все они были чисты. Они закололи пасхальную жертву для всех возвратившихся из плена, для своих братьев-священников и для самих себя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: как один
  rationale: Сохраняет буквальный образ единства и согласованности действий, не сводя выражение лишь к временному значению «вместе».
- source_word: בְנֵי הַגּוֹלָה
  choice: возвратившиеся из плена
  rationale: В данном контексте обозначает общину бывших изгнанников, вернувшуюся в Иудею; естественная русская формулировка передаёт исторический смысл выражения.
- source_word: הַפֶּסַח
  choice: пасхального ягнёнка
  rationale: Здесь слово обозначает пасхальную жертву, которую закалывают, а не сам праздник.
- source_word: לְ
  choice: за
  rationale: При глаголе «закололи» передаёт совершение жертвенного действия в интересах и от имени перечисленных групп.
theological_decisions:
- issue: Ритуальная чистота священников и левитов
  choice: «очистились… были чисты»
  alternative: «освятились… были чисты»
  rationale: Корень טהר непосредственно относится к очищению и состоянию ритуальной чистоты; перевод не расширяет его до более общего понятия освящения.
- issue: Единство очищения
  choice: «как один»
  alternative: «вместе» или «все без исключения»
  rationale: 'Сохранён образ כְאֶחָד и его возможная смысловая напряжённость: совместность, единодушие и отсутствие разделения не сведены к одному толкованию.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без потери параллелизма; «братья-священники» ясно указывает, что речь идёт о собратьях левитов и других служителей, упомянутых в общей группе.
