    issue: «Пасхального ягнёнка»
    rationale: Существительное הַפֶּסַח в данном контексте относится к пасхальной жертве. Исходный текст не уточняет вид животного, тогда как «ягнёнок» исключает допустимого козлёнка и тем самым сужает смысл.
  revised_text: Ведь священники и левиты очистились как один — все они были чисты. Они закололи пасхальную жертву для всех возвратившихся из плена, для своих братьев-священников и для самих себя.
