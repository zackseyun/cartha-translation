  source_fidelity: 'В целом структура и смысл переданы точно: כְאֶחָד сохранено как «как один», а טהורים — как «чисты». Однако הַפֶּסַח обозначает пасхальную жертву, а не обязательно именно ягнёнка: жертвенное животное могло быть и козлёнком. Поэтому «пасхального ягнёнка» неоправданно сужает исходный текст.'
  naturalness: Текст звучит естественно для современного литературного русского. Замена «ягнёнка» на «жертву» сохраняет ясность и устраняет неточность; «для самих себя» несколько ровнее в параллельном перечислении, чем «за самих себя».
  terminology: «Очистились», «чисты», «как один» и «пасхальная жертва» точно передают ритуальную и повествовательную лексику без конфессионального истолкования. «Возвратившиеся из плена» является контекстуально понятной передачей בני הגולה, хотя это собирательное обозначение общины изгнания.
  issues:
