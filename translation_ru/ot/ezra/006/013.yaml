  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: ru
  text: Тогда Таттенай, наместник Заречья[a], Шетар-Бознай и их соратники в точности исполнили[b] то, что прислал царь Дарий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Заречье» — персидское административное название области к западу от Евфрата, если смотреть со стороны Месопотамии и Персии.
    reason: cultural_note
  - marker: b
    text: 'Или: «тщательно исполнили»; арамейское выражение подчёркивает точное, тщательное исполнение царского распоряжения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Обычный арамейский повествовательный маркер последовательности; «тогда» естественно передаёт переход к следующему событию.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: наместник Заречья
  rationale: פַּחַת обозначает правителя провинции, а עֲבַר נַהֲרָה — официальное персидское название области к западу от Евфрата. «Заречье» сохраняет форму исторического административного наименования.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Шетар-Бознай
  rationale: Имя передано транслитерацией; дефис отражает традиционное восприятие составного имени.
- source_word: וּכְנָוָתְהוֹן
  choice: и их соратники
  rationale: Слово обозначает связанных с ними лиц, участвующих в официальных действиях; «соратники» здесь естественнее, чем бытовое «товарищи».
- source_word: לָקֳבֵל דִּי
  choice: то, что
  rationale: В сочетании с «исполнили» передаёт соответствие полученному царскому распоряжению без тяжеловесного буквального оборота.
- source_word: שְׁלַח
  choice: прислал
  rationale: Сохранено прямое значение глагола «послал»; подразумеваемое распоряжение не внесено в основной текст как явное дополнение.
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: в точности
  rationale: Сочетание подчёркивает тщательное и точное исполнение; краткий русский оборот естественно выражает эту усиленную характеристику.
- source_word: עֲבַדוּ
  choice: исполнили
  rationale: Буквально глагол означает «сделали», но в административном контексте речь идёт об исполнении присланного царём предписания; «исполнили» делает связь ясной без добавления слова «указ».
