  source_fidelity: 'Текст точно передаёт арамейскую последовательность и смысл: Таттенай, наместник области «за Рекой», Шетар-Бознай и связанные с ними лица исполнили царское повеление с полной точностью. «В точности исполнили то, что прислал царь Дарий» естественно выражает לָקֳבֵל דִּי ... כְּנֵמָא אָסְפַּרְנָא עֲבַדוּ, не добавляя в основной текст невыраженного существительного («указ», «приказ»).'
