base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: ru
  text: 'В первый год царя Кира царь Кир издал указ: «Что касается дома Божьего в Иерусалиме: пусть этот дом будет построен как место для принесения жертв, и пусть будут заложены его основания[a]. Высота его — шестьдесят локтей, и ширина его — шестьдесят локтей;»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть его основания будут сохранены (или возведены)». Арамейское выражение неясно, и переводы расходятся; вариант «пусть будут заложены его основания» лучше всего соответствует строительному контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: издал указ
  rationale: Арамейское административное выражение буквально означает «установил повеление»; русский оборот «издал указ» естественно передаёт официальный характер решения.
- source_word: בֵּית אֱלָהָא
  choice: дом Божий
  rationale: Сохранено буквальное «дом Божий», а не пояснительное «храм Божий», поскольку далее в стихе повторяется слово «дом».
- source_word: יִתְבְּנֵא
  choice: пусть этот дом будет отстроен заново
  rationale: Форма имеет предписывающую силу в контексте указа. Сам глагол означает «быть построенным», а «заново» ясно передаёт обусловленное историческим контекстом восстановление разрушенного храма.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: как место, где приносят жертвы
  rationale: Естественно передаёт арамейскую однокоренную конструкцию «место, где жертвуют жертвы», не утрачивая назначения дома.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: и пусть будут заложены его основания
  rationale: Трудная арамейская фраза допускает разные толкования; в строительном контексте наиболее вероятно предписание заложить или прочно устроить основания.
- source_word: רוּמֵהּ
  choice: Высота его
  rationale: Прямой и естественный архитектурный эквивалент.
- source_word: אַמִּין שִׁתִּין
  choice: шестьдесят локтей
  rationale: Историческая мера длины сохранена без приблизительного пересчёта в современные единицы.
- source_word: פְּתָיֵהּ
  choice: ширина его
  rationale: Современный и точный архитектурный эквивалент значения «ширина, протяжённость вширь».
