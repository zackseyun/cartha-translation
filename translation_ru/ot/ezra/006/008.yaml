  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: ru
  text: 'Кроме того, я издаю указ о том, что вам надлежит сделать для этих иудейских старейшин при восстановлении этого дома Бога: пусть расходы этих людей без промедления оплачиваются из царских доходов — из дани, собираемой в Заречье[a], — чтобы работы не останавливались.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Заречье» — персидское административное название территорий к западу от Евфрата.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Кроме того, я повелеваю
  rationale: Арамейская официальная формула означает установление царского распоряжения; активная конструкция естественна по-русски и сохраняет говорящего царя.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: эти иудейские старейшины
  rationale: Обозначены руководители иудейской общины; «иудейские» соответствует историческому контексту и современному литературному русскому.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: когда они восстанавливают этот дом Бога
  rationale: דֵךְ — указательное «этот», а не притяжательное «вашего»; контекст говорит о восстановлении уже существовавшего храма, при сохранении буквального образа «дом Бога».
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: из царских доходов — из дани, собираемой в Заречье
  rationale: מִדַּת означает дань или налог, а не провинцию; оборот указывает на источник средств царя. «Заречье» передаёт персидское административное название территории за Евфратом.
- source_word: אָסְפַּרְנָא
  choice: без промедления
  rationale: Административный термин выражает оперативное и тщательное исполнение; в контексте выплат естественнее всего передать требование своевременности.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: пусть расходы этих людей ... оплачиваются
  rationale: Пассивная конструкция предписывает выдавать этим людям средства на расходы; русский вариант ясно выражает обязательную оплату проекта.
- source_word: דִּי לָא לְבַטָּלָא
  choice: чтобы работы не останавливались
  rationale: Целевая конструкция требует не допустить прекращения или задержки; множественное «работы» естественно обозначает восстановительные работы, не приписывая инфинитиву явного личного субъекта.
