base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: ru
  text: И пусть также золотые и серебряные сосуды дома Божьего, которые Навуходоносор вынес из храма в Иерусалиме и принёс в Вавилон, будут возвращены; пусть каждый из них будет доставлен в храм в Иерусалиме, на своё место[a]; а ты помести их в доме Божьем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть их возвратят, и пусть каждый из них отправится в храм в Иерусалиме, на своё место». Арамейская формулировка в этом месте несколько трудна, однако общий смысл состоит в возвращении храмовых сосудов на отведённые им места в Иерусалиме.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: И пусть также
  rationale: Передаёт добавочное значение частицы и естественно вводит следующий пункт царского повеления.
- source_word: מָאנֵי
  choice: сосуды
  rationale: В храмовом контексте обозначает предметы утвари; традиционное широкое русское соответствие «сосуды» подходит лучше, чем общее «предметы».
- source_word: בֵית אֱלָהָא
  choice: дом Божий
  rationale: Сохраняет буквальное выражение и отличие от הֵיכְלָא — «храм».
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: золотые и серебряные
  rationale: Естественно по-русски обозначает материал, из которого сделаны сосуды.
- source_word: הַנְפֵּק
  choice: вынес
  rationale: Передаёт каузативное значение удаления предметов из храма.
- source_word: הֵיכְלָא
  choice: храм
  rationale: В данном контексте речь несомненно идёт об Иерусалимском храме; перевод сохраняет отличие от «дома Божьего».
- source_word: וְהֵיבֵל
  choice: принёс
  rationale: Передаёт перемещение сосудов в Вавилон и соответствует направленности исходного глагола.
- source_word: יַהֲתִיבוּן
  choice: будут возвращены
  rationale: Передаёт значение восстановления на прежнем месте в форме распоряжения.
- source_word: וִיהָךְ
  choice: доставлены
  rationale: Форма и синтаксис трудны; по контексту слово продолжает повеление о возвращении сосудов в Иерусалим. Пассивная формулировка естественна по-русски, но неоднозначность отмечена в сноске.
- source_word: לְאַתְרֵהּ
  choice: каждый на своё место
  rationale: Распределительная формулировка согласуется с местоименным суффиксом единственного числа и подразумевает надлежащее место каждого сосуда.
- source_word: וְתַחֵת
  choice: а ты помести их
  rationale: Сохраняет обращённое к одному должностному лицу прямое повеление; местоимение «их» естественно восполняет подразумеваемое дополнение.
