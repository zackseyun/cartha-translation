base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: ru
  text: Итак, Таттенай, правитель Заречья[b], Шетар-Бознай и их товарищи — Афарсахеи[c], находящиеся в Заречье, — держитесь подальше от этого места[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будьте далеко оттуда».'
    reason: lexical_alternative
  - marker: b
    text: «Заречье» — персидское административное название области к западу от Евфрата.
    reason: cultural_note
  - marker: c
    text: Значение слова «Афарсахеи» не вполне ясно; возможно, так назывались персидские чиновники.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּעַן
  choice: Итак
  rationale: Арамейский связующий маркер вводит распоряжение царя. «Итак» естественно передаёт переход к предписанию, не делая причинно-следственную связь чрезмерно жёсткой.
- source_word: תַּתְּנַי
  choice: Таттенай
  rationale: Личное имя передано транслитерацией в форме, близкой арамейскому звучанию.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: правитель Заречья
  rationale: פַּחַת обозначает областного правителя в имперской администрации, а עֲבַר נַהֲרָה — устойчивое название территории за Евфратом с персидской точки зрения. Краткая форма «Заречье» сохраняет характер административного наименования.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Шетар-Бознай
  rationale: Составное личное имя передано транслитерацией.
- source_word: וּכְנָוָתְהוֹן
  choice: и их соратники
  rationale: Суффикс третьего лица множественного числа буквально означает «их», а существительное — спутников, товарищей или коллег. «Соратники» естественно в контексте совместной служебной деятельности.
- source_word: אֲפַרְסְכָיֵא
  choice: афарсахеи
  rationale: Значение редкого административно-этнического термина не вполне достоверно. Транслитерация сохраняет неопределённость оригинала; возможное понимание как названия персидских чиновников вынесено в примечание.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: находящиеся в Заречье
  rationale: Относительное придаточное указывает местонахождение названной группы в административной области Заречье.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: держитесь подальше оттуда
  rationale: Идиоматическая русская формулировка передаёт повелительную силу арамейского выражения, буквально означающего «будьте далеко оттуда».
