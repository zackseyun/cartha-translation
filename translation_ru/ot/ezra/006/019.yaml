  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: ru
  text: А люди изгнания отпраздновали Пасху в четырнадцатый день первого месяца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья изгнания». Это собирательное обозначение общины изгнанников; также возможно: «изгнанники».'
    reason: 'Лексическая альтернатива: еврейское собирательное выражение בְנֵי הַגּוֹלָה буквально означает «сыновья изгнания» и относится к общине, связанной с изгнанием.'
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: отпраздновали
  rationale: В сочетании с הַפָּסַח глагол עשה имеет идиоматический смысл соблюдения или празднования Пасхи; «отпраздновали» естественно звучит по-русски и передаёт обрядово-праздничное действие.
- source_word: בְנֵי הַגּוֹלָה
  choice: переселенцы
  rationale: Буквально «сыновья переселения/изгнания» — собирательное обозначение общины, пережившей изгнание. «Переселенцы» кратко и естественно передаёт этот корпоративный смысл, не ограничивая группу мужчинами; буквальный оборот сохранён в примечании.
- source_word: הַפָּסַח
  choice: Пасху
  rationale: Слово обозначает пасхальное установление в широком смысле и здесь не требует уточнения «жертва» или «трапеза».
- source_word: בְאַרְבָּעָה עָשָׂר
  choice: в четырнадцатый день
  rationale: В еврейской формуле даты употреблено числительное «четырнадцать»; слово «день» естественно восполняется в русском языке.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: первого месяца
  rationale: Естественное завершение календарной формулы, точно передающее еврейскую конструкцию.
