source:
  edition: WLC
  text: וְ/שֵׁיצִיא֙ בַּיְתָ֣/ה דְנָ֔ה עַ֛ד י֥וֹם תְּלָתָ֖ה לִ/ירַ֣ח אֲדָ֑ר דִּי הִ֣יא שְׁנַת שֵׁ֔ת לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מַלְכָּֽ/א־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: ru
  text: И этот дом был завершён к третьему дню месяца адара[a], в шестой год царствования царя Дария.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в третий день месяца адара». Выражение может обозначать сам день завершения работ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: был завершён
  rationale: Арамейский глагол в данном контексте обозначает доведение строительных работ до конца; пассивная конструкция сохраняет внимание на храме, а не на строителях.
- source_word: בַּיְתָה דְנָה
  choice: этот дом
  rationale: Буквально «этот дом»; в контексте Ездры так обозначается храм. Сохранение слова «дом» передаёт лексику источника и остаётся понятным из контекста.
- source_word: עַד יוֹם תְּלָתָה
  choice: к третьему дню
  rationale: Предлог עַד с датой может указывать на срок, к которому работа была окончена. Перевод сохраняет это значение, не превращая его без основания в простое указание дня события.
- source_word: לִירַח אֲדָר
  choice: месяца адара
  rationale: Естественная русская форма датировки, точно передающая арамейское выражение.
- source_word: דִּי הִיא שְׁנַת שֵׁת
  choice: в шестой год
  rationale: Относительная конструкция указывает, что названная дата приходилась на шестой год царствования; по-русски это естественно выражается обстоятельственным оборотом.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ מַלְכָּא
  choice: царствования царя Дария
  rationale: В хронологической формуле מַלְכוּת означает период царского правления; титул «царь» явно присутствует в источнике.
theological_decisions: []
