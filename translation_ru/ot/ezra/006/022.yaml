revisions:
- from: И семь дней они с радостью праздновали Праздник опресноков, потому что Яхве даровал им радость и расположил к ним сердце ассирийского царя[a], чтобы тот поддержал их в работе над домом Бога, Бога Израиля.
  to: И они семь дней с радостью праздновали Праздник опресноков, потому что Яхве даровал им радость и расположил к ним сердце царя Ассирии[a], чтобы поддержать их в работе для дома Бога, Бога Израиля.
  rationale: Убрано «тот», чтобы не предрешать, относится ли цель «поддержать их» непосредственно к царю либо к действию Яхве через расположение царского сердца. Также восстановлены более близкая исходнику форма «царь Ассирии» и более широкое «работа для дома Бога».
