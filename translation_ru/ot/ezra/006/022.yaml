base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: ru
  text: И они семь дней с радостью праздновали Праздник опресноков, потому что Яхве даровал им радость и расположил к ним сердце царя Ассирии[a], чтобы поддержать их в работе для дома Бога, Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «царь Ассирии». Хотя в эпоху Ездры правил персидский царь, здесь употреблено более древнее имперское обозначение, вероятно связанное с властью над землями бывшей Ассирийской державы.'
    reason: historical_note
lexical_decisions:
- source_word: וַיַּעֲשׂוּ חַג מַצּוֹת
  choice: праздновали Праздник опресноков
  rationale: С глаголом עשה название праздника означает его совершение или празднование, а не буквальное «делали». «Праздновали» естественно передаёт этот смысл по-русски.
- source_word: שִׁבְעַת יָמִים בְּשִׂמְחָה
  choice: семь дней ... с радостью
  rationale: Сохраняется длительность и именная форма שִׂמְחָה; русская конструкция звучит ясно и естественно.
- source_word: שִׂמְּחָם
  choice: даровал им радость
  rationale: Порода пиэль выражает причинение радости. Формулировка передаёт каузативный смысл и сохраняет словесную связь с предшествующим «с радостью».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: וְהֵסֵב לֵב ... עֲלֵיהֶם
  choice: расположил к ним сердце
  rationale: Оборот означает поворот или направление внутреннего расположения царя в их сторону. «Расположил к ним сердце» сохраняет образ сердца и хорошо передаёт благосклонность, не устраняя Божье действие.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ассирийского царя
  rationale: Сохраняется прямое обозначение исходного текста, хотя исторически речь идёт о правителе Персидской державы.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: чтобы тот поддержал их
  rationale: Буквально «чтобы укрепить их руки» — древнееврейская идиома оказания силы и содействия. В современном русском «поддержал их» ясно передаёт её функцию; подразумеваемый субъект — царь, чьё сердце расположил Яхве.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: в работе над домом Бога
  rationale: מְלָאכָה обозначает труд или работу; по контексту речь идёт о работах, связанных с храмом. «Над домом» естественно для русского языка и не сужает выражение до богослужения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Историческое обозначение מֶלֶךְ אַשּׁוּר
  choice: ассирийский царь
  alternative: персидский царь; царь над Ассирией
  rationale: Еврейский текст прямо называет правителя «царём Ассирии». Историческое пояснение вынесено в сноску, а формулировка источника сохранена.
- issue: Субъект инфинитива לְחַזֵּק
  choice: 'царь: «чтобы тот поддержал их»'
  alternative: 'Яхве: «укрепив их руки»'
  rationale: Синтаксис допускает некоторую неоднозначность, однако ближайшим действующим лицом является царь, чьё расположение практически содействовало работе. Формулировка делает принятое прочтение ясным, не приписывая царю самостоятельной инициативы вне Божьего действия.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Устранены неестественные кальки вроде «укрепить их руки», при этом сохранены имя Яхве, исторически напряжённое обозначение «ассирийский царь» и образ сердца.
