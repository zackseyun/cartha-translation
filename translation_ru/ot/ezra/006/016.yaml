  text: וַ/עֲבַ֣דוּ בְנֵֽי יִ֠שְׂרָאֵל כָּהֲנַיָּ֨/א וְ/לֵוָיֵ֜/א וּ/שְׁאָ֣ר בְּנֵי גָלוּתָ֗/א חֲנֻכַּ֛ת בֵּית אֱלָהָ֥/א דְנָ֖ה בְּ/חֶדְוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: ru
  text: И сыны Израиля — священники, левиты и остальные вернувшиеся из плена[a] — с радостью отпраздновали посвящение этого дома Божьего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «остальные сыны изгнания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: отпраздновали
  rationale: В данном арамейском контексте глагол означает совершить или провести обрядовое событие; при прямом дополнении «посвящение» естественное русское соответствие — «отпраздновали посвящение».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт образное выражение оригинала и сохраняет торжественный, но понятный современному читателю стиль.
- source_word: כָּהֲנַיָּא
  choice: священники
  rationale: Стандартное и контекстуально точное обозначение священнической группы.
- source_word: וְלֵוָיֵא
  choice: левиты
  rationale: Устоявшееся русское обозначение членов храмовой служебной группы.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: и остальные вернувшиеся из плена
  rationale: Фраза буквально говорит об «остальных сынах изгнания» и обозначает остальную часть общины бывших изгнанников; контекст книги показывает, что речь идёт о вернувшихся. Буквальный образ сохранён в примечании.
- source_word: חֲנֻכַּת
  choice: посвящение
  rationale: Прямое и естественное обозначение торжественного введения дома Божьего в священное употребление; «освящение» могло бы сильнее сузить смысл.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: этого дома Божьего
  rationale: Сохраняет исходное храмовое наименование «дом Божий» и указательное значение слова «этот», не заменяя образ толкованием «храм».
- source_word: בְּחֶדְוָה
  choice: с радостью
  rationale: Близко передаёт сочетание предлога с существительным и естественно звучит по-русски.
