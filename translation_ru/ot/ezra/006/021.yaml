  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: ru
  text: Сыны Израиля[a], вернувшиеся из изгнания, ели вместе со всеми, кто отделился от нечистоты[c] народов этой земли и присоединился к ним[b], чтобы искать Господа, Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть израильтяне; буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к ним», то есть к общине вернувшихся из изгнания.'
    reason: lexical_clarification
  - marker: c
    text: 'Или: «осквернения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: ели
  rationale: Глагол означает «ели»; предмет — пасхальная жертва или трапеза — ясен из ближайшего контекста и потому не добавлен.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет еврейское выражение, не подразумевая, что в трапезе участвовали только мужчины; идиоматический смысл пояснён в сноске.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: вернувшиеся из изгнания
  rationale: Естественно и точно обозначает возвратившихся из вавилонского изгнания.
- source_word: וְכֹל הַנִּבְדָּל
  choice: вместе со всеми, кто отделился
  rationale: Передаёт собирательное значение כֹל и возвратную семантику причастия нифаля; «вместе» ясно показывает участие второй группы в трапезе.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: от нечистоты народов этой земли
  rationale: «Нечистота» сохраняет как ритуальный, так и нравственный оттенок טֻמְאָה; множественное «народы» соответствует גּוֹיֵי.
- source_word: אֲלֵהֶם
  choice: присоединился к ним
  rationale: Буквально «к ним»; в данном контексте предлог указывает на присоединение к общине возвратившихся. Буквальная форма отмечена в сноске.
- source_word: לִדְרֹשׁ
  choice: искать
  rationale: Сохраняет широкий заветный смысл обращения к Богу и стремления к Нему, не сужая его до поклонения или вопрошания.
- source_word: לַיהוָה
  choice: Господа
  rationale: Традиционное русское обозначение тетраграмматона в связном библейском тексте.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямо передаёт конструкцию и заветное наименование Бога.
theological_decisions:
- issue: Кем были дополнительные участники Пасхи
  choice: Они описаны широко как все отделившиеся от нечистоты народов земли и присоединившиеся к возвратившейся общине.
  alternative: Считать их исключительно прозелитами из других народов или исключительно израильтянами, остававшимися в земле.
  rationale: Еврейский текст не устанавливает их этническую принадлежность, поэтому перевод не сужает эту группу до одной из предложенных категорий.
- issue: Характер нечистоты народов земли
  choice: Сохранено общее слово «нечистота».
  alternative: Уточнить её как исключительно обрядовую или исключительно нравственную испорченность.
  rationale: טֻמְאָה допускает ритуальный и нравственный оттенки, а контекст не требует устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до естественного русского порядка слов, но ключевые повторы, коллективные обозначения и смысловая открытость оригинала сохранены.
