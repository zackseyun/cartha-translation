source:
  edition: WLC
  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: ru
  text: чтобы они приносили Богу небес благоуханные жертвы[a] и молились о жизни царя и его сыновей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приятные благоухания»; также возможно: «умиротворяющие благоухания». Речь идёт о благоухании угодных Богу жертв.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о благополучии царя и его сыновей». Буквально: «о жизни царя и его сыновей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי
  choice: чтобы
  rationale: Частица вводит цель предписанного царём снабжения; «чтобы» естественно передаёт целевое значение.
- source_word: לֶהֱוֺן מְהַקְרְבִין
  choice: они приносили
  rationale: Сочетание формы глагола «быть» с причастием выражает целевое или модальное действие, а корень קרב в жертвенном контексте означает принесение даров или жертв.
- source_word: נִיחוֹחִין
  choice: благоуханные жертвы
  rationale: Арамейское слово буквально обозначает приятные, умиротворяющие благоухания от принимаемых жертв. В русском языке «благоуханные жертвы» естественно сохраняет жертвенный образ, хотя слово «жертвы» выводится из контекста.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: Богу небес
  rationale: Предлог ל указывает адресата приношений, а титул «Бог небес» сохранён в его обычной для книги Ездры форме.
- source_word: וּמְצַלַּיִן
  choice: и молились
  rationale: Причастие обозначает молитву и согласовано по синтаксической функции с предыдущим целевым действием.
- source_word: לְחַיֵּי
  choice: о жизни
  rationale: Буквальное значение — «о жизни»; в контексте молитвы оно может охватывать сохранность и благополучие, но основной текст сохраняет более формальное соответствие.
- source_word: מַלְכָּא
  choice: царя
  rationale: Обычное арамейское обозначение царя сохранено без замены на пояснительное «император».
- source_word: וּבְנוֹהִי
  choice: и его сыновей
  rationale: Исходное слово прямо обозначает сыновей во множественном числе, поэтому его гендерная конкретность сохранена.
theological_decisions:
- issue: Жертвенное выражение נִיחוֹחִין в персидском царском указе
  choice: благоуханные жертвы
  alternative: приятные благоухания; умиротворяющие благоухания
  rationale: Перевод сохраняет образ благоухания принимаемой жертвы и не заменяет его отвлечённым понятием «угодные жертвы». Добавление слова «жертвы» делает выражение естественным по-русски и явно передаёт культовый контекст.
- issue: Просьба לְחַיֵּי о царе и его сыновьях
  choice: о жизни царя и его сыновей
  alternative: о благополучии царя и его сыновей
  rationale: Буквальное «о жизни» сохраняет открытым диапазон смысла — жизнь, сохранность и благополучие — не сводя его к одному толкованию.
- issue: Обозначение царских потомков мужского пола
  choice: его сыновей
  alternative: его детей
  rationale: Источник использует конкретное слово «сыновья», поэтому более общее «дети» неоправданно нейтрализовало бы текст.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Порядок слов «Богу небес» подчёркивает адресата приношений и сохраняет устойчивый титул книги Ездры. Формы сослагательно-целевой конструкции переданы прошедшим временем несовершенного вида после «чтобы», что естественно для русского синтаксиса.
