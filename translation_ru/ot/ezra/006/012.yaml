  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: ru
  text: И пусть Бог, поселивший там Своё имя[a], низложит любого царя и любой народ, если они протянут руку, чтобы изменить это[b] и разрушить этот дом Божий в Иерусалиме. Я, Дарий, издал указ. Пусть это будет исполнено без промедления[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «положивший там Своё имя». Это арамейское выражение говорит об особой связи Бога с храмом, не ограничивая Бога этим местом.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, речь идёт об указе; в арамейском тексте объект глагола «изменить» не назван.
    reason: source_ambiguity
  - marker: c
    text: 'Или: «со всей тщательностью». Арамейское наречие может подчёркивать как быстроту, так и усердие исполнения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: поселил там Своё имя
  rationale: Сохраняет каузативную силу арамейского выражения и библейскую храмовую идиому, не сводя её просто к владению храмом или пространственному пребыванию Бога.
- source_word: יְמַגַּר
  choice: низложит
  rationale: Передаёт низвержение в контексте царского проклятия и подходит как к царю, так и к народу.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: всякого царя и народ
  rationale: Передаёт обобщённо-дистрибутивный смысл угрозы, обращённой к любому возможному нарушителю.
- source_word: יִשְׁלַח יְדֵהּ
  choice: протянет руку
  rationale: Сохраняет семитскую метафору решительного действия против постановления и храма.
- source_word: לְהַשְׁנָיָה
  choice: изменить это постановление
  rationale: В арамейском местоименный объект не выражен явно; в административном контексте наиболее вероятна отсылка к царскому постановлению. Добавленное существительное делает русскую фразу ясной.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא דֵךְ
  choice: разрушить этот дом Божий
  rationale: Передаёт тяжесть действия и сохраняет указательное местоимение при храме.
- source_word: שָׂמֶת טְעֵם
  choice: издал указ
  rationale: Естественная современная русская формула для официального царского распоряжения.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: пусть он будет исполнен незамедлительно
  rationale: Сохраняет властный побудительный оттенок пассивной формы, а наречие передаёт прежде всего требование быстрого исполнения.
theological_decisions:
- issue: Богословие имени Бога в храме
  choice: сохранить идиому «поселил там Своё имя»
  alternative: «положил там Своё имя» или «обитает там»
  rationale: Так сохраняется заветная связь имени Бога с храмом без утверждения, будто Сам Бог пространственно ограничен храмом.
- issue: Объект изменения в לְהַשְׁנָיָה
  choice: «изменить это постановление»
  alternative: «изменить это» или связать действие непосредственно с храмом
  rationale: Контекст царского указа поддерживает отсылку к постановлению, однако арамейский текст оставляет объект подразумеваемым; поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным тоном царского указа. Метафора «протянет руку» и храмовая идиома об имени Бога сохранены; административные выражения переданы естественными русскими формулами.
