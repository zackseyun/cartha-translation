lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер обозначает переход к следующему событию; «тогда» естественно передаёт последовательность.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: царь Дарий
  rationale: Такой порядок титула и имени соответствует норме современного литературного русского языка.
- source_word: שָׂם טְעֵם
  choice: издал указ
  rationale: Буквально — «установил приказ/указ»; выбранное выражение естественно описывает официальное распоряжение царя.
- source_word: וּבַקַּרוּ
  choice: провели поиск
  rationale: Форма третьего лица множественного числа имеет неопределённого деятеля; русская неопределённо-личная конструкция сохраняет активность формы, не называя исполнителей.
- source_word: בְּבֵית סִפְרַיָּא
  choice: в хранилище документов
  rationale: Буквально — «в доме книг/документов»; в административном контексте речь идёт об официальном архивном хранилище.
- source_word: גִנְזַיָּא
  choice: сокровища
  rationale: Слово обозначает спрятанные или хранимые ценности и может шире относиться к ценным запасам или вложениям.
- source_word: מְהַחֲתִין
  choice: хранились
  rationale: Причастная форма передаёт состояние предметов, помещённых на хранение.
- source_word: תַּמָּה בְּבָבֶל
  choice: где в Вавилоне
  rationale: Сохраняется явное указание места, хотя русский синтаксис естественно объединяет наречие «там» с относительным оборотом.
