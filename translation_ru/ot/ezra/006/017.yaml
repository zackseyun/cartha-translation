  text: וְ/הַקְרִ֗בוּ לַ/חֲנֻכַּת֮ בֵּית אֱלָהָ֣/א דְנָה֒ תּוֹרִ֣ין מְאָ֔ה דִּכְרִ֣ין מָאתַ֔יִן אִמְּרִ֖ין אַרְבַּ֣ע מְאָ֑ה וּ/צְפִירֵ֨י עִזִּ֜ין ל/חטיא עַל כָּל יִשְׂרָאֵל֙ תְּרֵֽי עֲשַׂ֔ר לְ/מִנְיָ֖ן שִׁבְטֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: ru
  text: И для посвящения этого дома Божьего принесли сто быков, двести баранов, четыреста ягнят и двенадцать козлов в жертву за грех за весь Израиль[a] — по числу колен Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «от имени всего Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Двенадцать козлов соответствовали двенадцати коленам Израиля, показывая, что жертва относилась ко всему Израилю.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: И принесли
  rationale: Каузативная форма глагола קרב в жертвенном контексте означает принести или представить жертву. «Принесли» естественно по-русски и сохраняет конкретность действия.
- source_word: לַחֲנֻכַּת
  choice: при посвящении
  rationale: חנכה обозначает торжественное посвящение или введение в употребление. «При посвящении» ясно передаёт церемониальный контекст и не смешивает его с самим жертвоприношением.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: этого дома Божьего
  rationale: Перевод сохраняет исходный образ «дома Божьего» вместо пояснительной замены словом «храм».
- source_word: תּוֹרִין
  choice: быков
  rationale: В перечне жертвенных животных слово обозначает крупный рогатый скот мужского пола; «быки» — точный и понятный русский эквивалент.
- source_word: דִּכְרִין
  choice: баранов
  rationale: Арамейское слово означает самцов овец; в жертвенном перечне естественный русский эквивалент — «бараны».
- source_word: אִמְּרִין
  choice: ягнят
  rationale: Слово обозначает ягнят или молодых овец; «ягнята» естественно и точно передаёт значение.
- source_word: וּצְפִירֵי עִזִּין
  choice: козлов
  rationale: Сочетание прямо указывает на коз мужского пола; русское «козлы» передаёт это без лишней описательности.
- source_word: לחטיא
  choice: в жертву за грех
  rationale: Это специальное жертвенное обозначение, связанное с грехом и очищением. Традиционное и понятное выражение «жертва за грех» сохраняет культовый смысл.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: за весь Израиль
  rationale: Предлог выражает направленность, пользу или представительство. «За весь Израиль» сохраняет корпоративный охват и допускает значение «от имени всего Израиля».
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: по числу колен Израиля
  rationale: Краткая русская формулировка точно объясняет число двенадцать и сохраняет связь козлов с двенадцатью коленами.
theological_decisions:
- issue: Объём выражения «весь Израиль» после возвращения из плена
  choice: Сохранено буквальное «за весь Израиль» без ограничения только вернувшимися переселенцами.
  alternative: «за всех возвратившихся из плена» или пояснительное «за весь народ завета»
  rationale: Сам текст говорит обо всём Израиле и связывает двенадцать козлов с числом колен. Перевод не сужает и не истолковывает этот корпоративный охват.
- issue: Характер жертвы, обозначенной לחטיא
  choice: «жертва за грех»
  alternative: «очистительная жертва»
  rationale: Термин может подчёркивать как грех, так и очищение. Основной текст использует широко понятное культовое наименование, не исключая очистительного аспекта.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным, но последовательность жертвенного перечня и образ «дома Божьего» сохранены. Тире перед пояснением подчёркивает связь числа двенадцать с коленами Израиля.
