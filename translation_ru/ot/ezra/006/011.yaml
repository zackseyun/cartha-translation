id: EZR.6.11
reference: Ezra 6:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: ru
  text: 'И от меня исходит указ: если кто-либо изменит это постановление, из его дома вырвут балку и его посадят на неё[a], а дом его за это превратят в место для нечистот[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повесят на ней»; возможно также: «пригвоздят к ней».'
    reason: alternative_reading
  - marker: b
    text: 'Возможно: «в навозную кучу» или «в груду отбросов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: исходит указ
  rationale: Арамейская административная формула буквально говорит об установлении повеления; выбранное выражение естественно передаёт официальный характер царского указа.
- source_word: יְהַשְׁנֵא
  choice: изменит
  rationale: Глагол обозначает изменение или подмену официального постановления, а не просто неповиновение ему.
- source_word: פִּתְגָמָא דְנָה
  choice: это постановление
  rationale: В данном имперском контексте речь идёт об официальном предписании; «постановление» ясно передаёт административный смысл.
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: из его дома вырвут балку
  rationale: אָע — древесина, брус или балка; контекст указывает на деревянную часть дома, которую извлекут для исполнения наказания. «Балка» конкретна и естественна по-русски.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: его посадят на неё
  rationale: Фраза описывает поднятие и закрепление тела на извлечённой балке, вероятно посредством насаживания. Русское выражение передаёт древний вид казни, не создавая образа более поздней виселицы.
- source_word: נְוָלוּ
  choice: место для нечистот
  rationale: Слово обозначает осквернённое место, кучу отбросов или навоза. Выбранный вариант понятен современному читателю и сохраняет идею публичного унижения дома.
- source_word: יִתְעֲבֵד
  choice: превратят
  rationale: Пассивно-безличная форма в юридической формуле естественно передана русской неопределённо-личной конструкцией.
- source_word: כָל אֱנָשׁ
  choice: кто-либо
  rationale: Универсальное условие указа естественно передаётся гендерно нейтральным русским местоимением без потери значения арамейского выражения «всякий человек».
theological_decisions:
- issue: Характер казни в формуле имперского наказания
  choice: его посадят на неё
  alternative: его повесят на ней; его пригвоздят к ней
  rationale: Арамейская формулировка допускает представление о поднятии, насаживании или подвешивании на деревянной балке. Основной текст передаёт вероятную древневосточную практику насаживания, а сноска сохраняет реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского указа. Синтаксис сохранён кратким и суровым; архаизмы и конфессионально окрашенные формулы не используются.
