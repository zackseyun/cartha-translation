  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
translation:
  language: ru
  text: Три ряда из тёсаного камня[a] и один ряд из нового дерева, а расходы пусть покрываются из царского дома[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «три слоя из обработанного камня».'
    reason: lexical_alternative
  - marker: b
    text: Под «царским домом», вероятно, подразумевается царская казна или средства царя.
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: три ряда / один ряд
  rationale: Строительный термин обозначает горизонтальные ряды или слои кладки; «ряд» естественно звучит по-русски и сохраняет повтор одного и того же арамейского слова.
- source_word: אֶבֶן גְּלָל
  choice: тёсаный камень
  rationale: В строительном контексте сочетание, вероятнее всего, обозначает обработанный камень для кладки; буквальное «катаный камень» по-русски было бы неясным и могло бы ввести в заблуждение.
- source_word: תְּלָתָא
  choice: три
  rationale: Точное соответствие арамейскому количественному числительному.
- source_word: אָע חֲדַת
  choice: новое дерево
  rationale: Сохраняет общее обозначение нового строительного лесоматериала, не уточняя без достаточных оснований его форму как балки или брёвна.
- source_word: נִפְקְתָא
  choice: расходы
  rationale: Естественный русский административный термин для затрат или издержек.
- source_word: מִן בֵּית מַלְכָּא
  choice: из царского дома
  rationale: Сохраняет буквальный образ «дома царя», тогда как вероятное значение царской казны поясняется в сноске.
- source_word: תִּתְיְהִב
  choice: пусть покрываются
  rationale: Передаёт распорядительную силу формы и естественно сочетается в русском языке со словом «расходы».
