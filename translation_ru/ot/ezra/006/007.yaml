- from: Не вмешивайтесь в работы над этим домом Бога[a]. Пусть правитель Иудеи и старейшины иудеев отстроят этот дом Бога на прежнем месте.
  to: Не препятствуйте работе над этим домом Бога. Пусть правитель Иудеи и старейшины иудеев строят этот дом Бога на его месте.
  rationale: Исправлены добавленные значения «прежнем» и «отстроят», единственное число «работе» приведено в соответствие с арамейским, а избыточная сноска удалена. Сохранены деиктическое «этим», официально-разрешительная форма «пусть» и различение Иудеи как области и иудеев как народа.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:03:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Первая часть верно передаёт запрет препятствовать строительству, однако множественное «работы» не отражает единственное число עֲבִידַת («работа»). «На прежнем месте» добавляет временной оттенок («прежнем»), которого в עַל אַתְרֵהּ нет: текст говорит «на его месте / на этом месте». «Строят» точнее передаёт יִבְנוֹן, не внося дополнительного значения восстановления, хотя контекст действительно связан с восстановлением храма.'
  naturalness: «Не препятствуйте работе над этим домом Бога» — естественная современная литературная формулировка с подходящим официальным тоном. «На его месте» ясно и не добавляет деталей. «Дом Бога» сохраняет образ и терминологию оригинала; в данном кратком декретном контексте это приемлемо.
  terminology: '«Правитель Иудеи» и «старейшины иудеев» адекватно передают соответственно פַּחַת יְהוּדָיֵא и שָׂבֵי יְהוּדָיֵא. Разное русское оформление родительного отношения обоснованно: первое обозначает область управления, второе — общину. Сноска к запрету не сообщает существенной текстологической или лексической альтернативы и может быть снята.'
  issues:
  - severity: medium
    issue: «На прежнем месте»
    rationale: Слово «прежнем» добавляет временное значение, отсутствующее в арамейском עַל אַתְרֵהּ («на его месте/на месте его»).
  - severity: low
    issue: «работы» вместо «работе»
    rationale: עֲבִידַת стоит в единственном числе; единственное число также естественно по-русски в этом значении.
  - severity: low
    issue: «отстроят»
    rationale: Глагол «отстроят» вносит значение восстановления и завершённости. Контекст допускает мысль о восстановлении, но сам יִבְנוֹן означает «пусть строят/построят».
  - severity: low
    issue: Сноска a не нужна
    rationale: Её вариант лишь перефразирует основное значение запрета и не фиксирует значимой альтернативы; удаление не уменьшает точности перевода.
