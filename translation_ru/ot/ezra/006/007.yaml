base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: ru
  text: Не препятствуйте работе над этим домом Бога. Пусть правитель Иудеи и старейшины иудеев строят этот дом Бога на его месте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: Не вмешивайтесь в работы
  rationale: Множественное повелительное שְׁבֻקוּ в данном указе требует прекратить помехи; естественная русская формулировка «не вмешивайтесь» передаёт этот смысл. Множественное «работы» обычно для строительства.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: этим домом Бога
  rationale: Указательное דֵךְ указывает на конкретный обсуждаемый храм; «этот дом Бога» сохраняет форму и понятность исходного выражения.
- source_word: פַּחַת יְהוּדָיֵא
  choice: правитель Иудеи
  rationale: פַּחַת обозначает провинциального правителя, а зависимое יְהוּדָיֵא здесь естественно понимать географически — как название управляемой области.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: и старейшины иудеев
  rationale: שָׂבֵי — старейшины как руководители общины; יְהוּדָיֵא здесь обозначает народ Иудеи и передано нейтральным историческим словом «иудеи».
- source_word: יִבְנוֹן
  choice: Пусть ... отстроят
  rationale: Имперфект в языке указа имеет разрешительно-повелительную силу. «Отстроят» естественно выражает восстановление уже существовавшего ранее храма, не перегружая фразу.
- source_word: עַל אַתְרֵהּ
  choice: на прежнем месте
  rationale: Буквально «на его месте»; русский оборот «на прежнем месте» ясно передаёт строительство храма там, где он находился прежде.
theological_decisions: []
translation_notes:
