base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: ru
  text: И поставили священников по их отделениям и левитов по их отделениям для служения Богу в Иерусалиме, как написано в книге Моисея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: поставили
  rationale: Арамейская каузативная форма от קום означает «поставить, определить на место, назначить»; «поставили» сохраняет конкретный образ и естественно описывает распределение служителей.
- source_word: כָהֲנַיָּא
  choice: священников
  rationale: Обычное обозначение священников; определённость в русском языке передаётся контекстом.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: по их отделениям
  rationale: Существительное обозначает организационные отделения или группы; предлог ב здесь естественно передаётся как распределение «по» отделениям.
- source_word: וְלֵוָיֵא
  choice: и левитов
  rationale: Стандартное современное русское обозначение храмовых служителей из колена Левия.
- source_word: בְּמַחְלְקָתְהוֹן
  choice: по их разрядам
  rationale: Слово обозначает организованные подразделения. «Разряды» передаёт близкий, но не обязательно полностью тождественный первому термину организационный смысл.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: для служения Богу
  rationale: Сочетание указывает на назначение к исполнению храмовой службы; такой перевод естественен по-русски и не сужает значение до одного конкретного вида обязанностей.
- source_word: דִּי בִירוּשְׁלֶם
  choice: в Иерусалиме
  rationale: Относительная конструкция определяет место Божьего служения. В русском языке простое обстоятельство места точно и естественно передаёт её смысл.
- source_word: כִּכְתָב
  choice: как предписано
  rationale: Выражение буквально связано с написанным и указывает на соответствие письменному установлению. «Как предписано» ясно выражает нормативную функцию текста, не добавляя содержания к самому предписанию.
- source_word: סְפַר מֹשֶׁה
  choice: в книге Моисея
  rationale: סְפַר может означать книгу, свиток или письменный документ; «книга Моисея» — понятное и традиционно нейтральное обозначение названного письменного источника.
theological_decisions:
- issue: Связь устройства храмового служения с письменным авторитетом Моисея
  choice: Распределение священников и левитов представлено как соответствующее предписанию в книге Моисея.
  alternative: Понять заключительную фразу лишь как общее сопоставление с написанным, не подчёркивая нормативного характера.
  rationale: כִּכְתָב прямо связывает устройство служения с письменным установлением. Перевод сохраняет эту связь, не делая дополнительных утверждений о составе, каноническом статусе или авторстве книги.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Отделения» и «разряды» сохраняют близость двух родственных организационных терминов, не стирая их формального различия. Синтаксис упрощён естественным для русского языка способом без потери содержания.
