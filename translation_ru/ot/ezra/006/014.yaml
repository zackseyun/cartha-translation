base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: ru
  text: Старейшины иудеев строили, и дело у них шло успешно[a] благодаря пророчеству пророка Аггея и Захарии, сына Иддо. Они завершили строительство по повелению Бога Израиля и по указам[b] Кира, Дария и Артаксеркса, царя Персии[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «они преуспевали» или «дело продвигалось».'
    reason: lexical_alternative
  - marker: b
    text: Арамейское слово можно также передать как «повеление» или «распоряжение».
    reason: lexical_alternative
  - marker: c
    text: Завершение строительства здесь связывается и с повелением Бога Израиля, и с указами персидских царей; Божье повеление названо первым.
    reason: theological_tension
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: старейшины иудеев
  rationale: Передаёт общественную роль руководителей общины и этническое обозначение, не сужая смысл до географического «Иудеи».
- source_word: בָּנַיִן
  choice: продолжали строить
  rationale: Причастие выражает продолжающееся действие; «продолжали» естественно передаёт это значение в русском повествовании, не добавляя прямо не выраженного «восстанавливать».
- source_word: וּמַצְלְחִין
  choice: работа у них шла успешно
  rationale: Передаёт успех и продвижение строительного дела естественным современным русским языком, не утверждая непременно материальное процветание самих старейшин.
- source_word: בִּנְבוּאַת
  choice: благодаря пророчеству
  rationale: 'Предлог указывает на средство или действенную причину: пророческое слово содействовало успешному ходу работ.'
- source_word: חַגַּי נביאה
  choice: пророка Аггея
  rationale: Сохраняет имя и прямо выраженный в источнике титул.
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: и Захарии, сына Иддо
  rationale: Точно и естественно передаёт арамейское обозначение происхождения.
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: они завершили строительство
  rationale: Сводит тесно связанные глаголы строительства и доведения до конца в естественную русскую формулировку, сохраняя итоговый смысл завершения работ.
- source_word: מִן טַעַם אֱלָהּ יִשְׂרָאֵל
  choice: по повелению Бога Израиля
  rationale: «Повеление» уместно по отношению к Богу и передаёт властное распоряжение, выраженное арамейским טעם.
- source_word: וּמִטְּעֵם כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: и по указам Кира, Дария и Артаксеркса
  rationale: «Указ» естественно обозначает официальное царское распоряжение; множественное число ясно соотносит разрешение с тремя названными правителями.
- source_word: מֶלֶךְ פָּרָס
  choice: царя Персии
  rationale: По форме единственное число непосредственно относится к последнему имени — Артаксерксу; русская пунктуация сохраняет это приложение, не мешая понимать общий персидский контекст списка.
theological_decisions:
- issue: Соотношение Божьего повеления и указов персидских царей
  choice: Завершение строительства прямо связано как с повелением Бога Израиля, так и с указами земных царей, причём Божье повеление названо первым.
  alternative: Считать царские указы лишь неявными проявлениями Божьего повеления и выразить это подчинение непосредственно в переводе.
  rationale: Источник сохраняет двойное основание и не поясняет его метафизическое соотношение; перевод не устраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировки рассчитаны на широкого читателя; избегаются архаизмы, конфессиональная терминология и лишние контекстуальные добавления.
