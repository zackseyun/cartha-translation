source:
  edition: WLC
  text: וּ/מָ֣ה חַשְׁחָ֡ן וּ/בְנֵ֣י תוֹרִ֣ין וְ/דִכְרִ֣ין וְ/אִמְּרִ֣ין לַ/עֲלָוָ֣ן לֶ/אֱלָ֪הּ שְׁמַיָּ֟/א חִנְטִ֞ין מְלַ֣ח חֲמַ֣ר וּ/מְשַׁ֗ח כְּ/מֵאמַ֨ר כָּהֲנַיָּ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לֶהֱוֵ֨א מִתְיְהֵ֥ב לְ/הֹ֛ם י֥וֹם בְּ/י֖וֹם דִּי לָ֥א שָׁלֽוּ׀׀׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: ru
  text: И всё необходимое — молодых быков, баранов и ягнят для всесожжений Богу небес, пшеницу, соль, вино и масло — пусть выдают им изо дня в день, по указанию[a] священников, которые находятся в Иерусалиме, неукоснительно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по слову священников».'
    reason: Сноска сохраняет буквальную форму арамейского выражения, которое в контексте означает указание или распоряжение.
  - marker: b
    text: 'Или: «без упущений»; то есть снабжение не должно прерываться.'
    reason: Заключительная арамейская формула допускает передачу через отсутствие упущения, небрежения или перерыва.
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: и всё необходимое
  rationale: Сочетание вводит открытый перечень требуемого снабжения; цельная передача естественна по-русски и сохраняет административный смысл.
- source_word: בְנֵי תוֹרִין
  choice: молодых быков
  rationale: Арамейская идиома буквально означает «сыновья быков/крупного скота» и обозначает молодых быков, пригодных для жертвоприношения.
- source_word: דִכְרִין
  choice: баранов
  rationale: Слово обозначает взрослых самцов овец; в перечне жертвенных животных точным русским соответствием служит «бараны».
- source_word: אִמְּרִין
  choice: ягнят
  rationale: Прямое и естественное обозначение ягнят в жертвенном перечне.
- source_word: לַעֲלָוָן
  choice: для всесожжений
  rationale: Термин обозначает жертвы, полностью сжигаемые на жертвеннике; «всесожжение» — точный и устоявшийся русский культовый термин.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: Богу небес
  rationale: Сохранён характерный для арамейских разделов Ездры титул Бога; дательный падеж естественно выражает адресата жертвоприношений.
- source_word: חִנְטִין מְלַח חֲמַר וּמְשַׁח
  choice: пшеницу, соль, вино и масло
  rationale: Переданы конкретные предметы снабжения без неоправданного расширения «масло» до «оливковое масло».
- source_word: כְּמֵאמַר
  choice: по указанию
  rationale: Буквально «по слову»; в данном административном контексте речь идёт об авторитетном указании священников. Буквальный оттенок отмечен в сноске.
- source_word: יוֹם בְּיוֹם
  choice: изо дня в день
  rationale: Естественная русская передача регулярного ежедневного снабжения.
- source_word: דִי לָא שָׁלוּ
  choice: неукоснительно
  rationale: Заключительная формула требует, чтобы ежедневное снабжение не прерывалось и не оставалось без исполнения; наречие передаёт обязательность и отсутствие упущений.
