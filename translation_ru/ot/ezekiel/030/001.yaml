lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Стандартная повествовательная формула вводит новое пророческое откровение; «И было» сохраняет связь с предшествующим текстом и естественно сочетается с устойчивой русской формулой.
- source_word: דְבַר
  choice: слово
  rationale: В формуле דְבַר יְהוָה обозначает конкретное Божье возвещение; «слово» сохраняет повторяющуюся пророческую терминологию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно и естественно передаёт направление речи к пророку.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В русском языке содержание последующей прямой речи естественно вводится двоеточием; отдельное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и узнаваемой пророческой формулы. Двоеточие передаёт функцию לֵאמֹר и вводит речь следующего стиха.
