  source_fidelity: 'Первое действие передано точно: וְשָׁפַכְתִּי חֲמָתִי — «изолью свой гнев». Син верно оставлен топонимом, а «крепость Египта» правильно передаёт приложение מָעוֹז מִצְרָיִם. Во втором действии «истреблю» адекватно передаёт судебную силу הִכְרַתִּי. Однако добавление «людей» конкретизирует הֲמוֹן («множество, масса; многолюдие») сильнее, чем это делает еврейский текст. Более нейтральное «множество Но» сохраняет конструкцию оригинала и не исключает иных оттенков слова.'
