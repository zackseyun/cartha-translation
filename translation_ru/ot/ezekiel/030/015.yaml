    reason: cross_reference
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: И изолью
  rationale: Сохраняет образ излияния и присоединительное וְ; форма естественна для торжественной пророческой речи.
- source_word: חֲמָתִי
  choice: Мой гнев
  rationale: חֵמָה обозначает сильный, пылающий гнев. «Гнев» передаёт тяжесть Божьего суда без излишне эмоциональной окраски слова «ярость».
- source_word: עַל
  choice: на
  rationale: Передаёт основное пространственно-направительное значение предлога, сохраняя образ излияния гнева на город.
- source_word: סִין
  choice: Син
  rationale: В основном тексте сохранено древнееврейское название; вероятное отождествление с Пелусием вынесено в примечание.
- source_word: מָעוֹז מִצְרָיִם
  choice: крепость Египта
  rationale: מָעוֹז здесь обозначает укреплённый опорный пункт; «крепость» ясно и естественно передаёт приложение к названию Син.
- source_word: וְהִכְרַתִּי
  choice: и истреблю
  rationale: Каузативная форма כרת выражает решительное устранение. Буквальное «отсеку» по-русски рядом с населением звучало бы неясно, тогда как «истреблю» сохраняет суровую силу судебного высказывания.
- source_word: אֶת הֲמוֹן
  choice: множество людей
  rationale: הָמוֹן может означать множество, людскую массу, шумное скопление или изобилие. В контексте города наиболее вероятны его многочисленные жители; формулировка сохраняет идею множества, не вводя более узкой социальной категории.
- source_word: נֹא
  choice: Но
  rationale: Сохранено древнееврейское название города; общепринятое отождествление с Фивами дано в примечании.
theological_decisions:
- issue: Прямота языка Божьего суда
  choice: 'Сохранены прямые действия Бога: «изолью Мой гнев» и «истреблю».'
  alternative: Смягчить формулировку словами «изолью негодование» или «положу конец».
  rationale: Еврейский текст изображает суд как непосредственное и решительное действие Бога; перевод не смягчает и не усиливает это утверждение.
- issue: Референт הֲמוֹן
  choice: Понять как множество людей в городе Но.
  alternative: Передать как «богатство», «изобилие» или оставить более абстрактное «множество Но».
  rationale: В данном контексте людское множество наиболее естественно, однако лексическая широта слова отмечена в обосновании и не превращена в специальное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис сохраняет параллельность двух действий, а древние топонимы оставлены в основном тексте и пояснены в примечаниях.
