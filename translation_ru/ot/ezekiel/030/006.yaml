revisions:
- from: 'Так говорит Яхве: падут те, кто поддерживает Египет, и будет низложена гордыня его могущества[a]. От Мигдола до Сиены[b] они падут в нём от меча[c], — возвещает Владыка Яхве.'
  to: 'Так говорит Яхве: падут те, кто поддерживает Египет, и сойдёт гордыня его мощи[a]. От Мигдола до Сиены[b] они падут от меча в его пределах[c], — возвещает Владыка Яхве.'
  rationale: Исправлена неоправданная страдательная передача וְיָרַד на непереходное «сойдёт». «Могущество» заменено на более естественное здесь «мощь», без смыслового сдвига. Заключительный оборот перестроен для ясности; сноска сохраняет близкий к еврейскому порядку слов как вариант.
