source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה וְ/נָֽפְלוּ֙ סֹמְכֵ֣י מִצְרַ֔יִם וְ/יָרַ֖ד גְּא֣וֹן עֻזָּ֑/הּ מִ/מִּגְדֹּ֣ל סְוֵנֵ֗ה בַּ/חֶ֨רֶב֙ יִפְּלוּ בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/006.yaml
  text: 'Thus says Yahweh: The supporters of Egypt will fall[a], and the pride of her strength will come down. From Migdol to Syene they will fall by the sword within her[c][b], declares the Lord GOD.'
translation:
  language: ru
  text: 'Так говорит Яхве: падут те, кто поддерживает Египет, и сойдёт гордыня его мощи[a]. От Мигдола до Сиены[b] они падут от меча в его пределах[c], — возвещает Владыка Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «величие его мощи».'
    reason: lexical_alternative
  - marker: b
    text: Мигдол и Сиена обозначают протяжённость Египта с севера на юг.
    reason: cultural_note
  - marker: c
    text: 'Или: «они падут в нём от меча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула; личное имя יהוה передано как «Яхве».
- source_word: סֹמְכֵי מִצְרַיִם
  choice: те, кто поддерживает Египет
  rationale: Причастие от סמך означает поддерживающих или служащих опорой; формулировка не сужает смысл до одних лишь военных союзников.
- source_word: וְנָפְלוּ
  choice: падут
  rationale: Пророческий контекст суда придаёт форме значение предстоящего события.
- source_word: גְּאוֹן עֻזָּהּ
  choice: гордыня его могущества
  rationale: גאון может обозначать гордость, величие или возвышенность, а עז — силу и могущество. Род местоимения согласован с русским словом «Египет», хотя в еврейском страна представлена как существительное женского рода.
- source_word: וְיָרַד
  choice: будет низложена
  rationale: Идиоматически передаёт нисхождение с высоты и утрату возвышенного положения; каузативный субъект при этом не называется.
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: От Мигдола до Сиены
  rationale: Топонимы обозначают географический охват Египта с севера на юг; русские формы имён переданы в принятой библейской традиции.
- source_word: בַּחֶרֶב
  choice: от меча
  rationale: Естественная русская передача устойчивого выражения о гибели в войне.
- source_word: יִפְּלוּ בָהּ
  choice: они падут в нём
  rationale: Местоименный суффикс буквально отсылает к стране, представленной в еврейском как женский референт; русское «в нём» согласовано с «Египет» и сохраняет эту отсылку.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: Передана торжественная пророческая формула; אֲדֹנָי различено как титул «Владыка», а יהוה — как личное имя «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя и отличает его от титула אֲדֹנָי.
- issue: Смысл גְּאוֹן в сочетании גְּאוֹן עֻזָּהּ
  choice: гордыня его могущества
  alternative: величие его могущества
  rationale: Контекст суда допускает отрицательную окраску «гордыня», однако слово может обозначать и нейтральное либо положительное величие; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; сохранены повтор глагола «падут», географический охват и прямое местоименное указание на Египет.
