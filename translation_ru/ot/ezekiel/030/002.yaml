base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/002.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Wail[b], “Alas for the day!”’'
translation:
  language: ru
  text: 'Сын человеческий[a], пророчествуй и скажи: «Так говорит Владыка Яхве: „Рыдайте[b]: ‘Увы, день!’[c]“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын человека». Это обычное обращение к Иезекиилю.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Вопите». Повеление обращено к нескольким людям и обозначает громкий плач или вопль скорби.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Ах, день!» Междометие выражает скорбь или ужас перед грядущим днём суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Это постоянное обращение Бога к Иезекиилю. Традиционная русская формулировка сохраняет образ и повторяемость исходного выражения, не сводя его смысл лишь к слову «смертный».
- source_word: הִנָּבֵא
  choice: пророчествуй
  rationale: Императив от נבא означает повеление произнести пророческую весть; русский глагол точно передаёт и действие, и торжественный пророческий регистр.
- source_word: וְאָמַרְתָּ
  choice: и скажи
  rationale: 'Сохраняет последовательность двух повелений: пророчествовать и сказать.'
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся формула пророческого посланничества, естественная и узнаваемая в современном русском литературном языке.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה, избегая искусственного сочетания «Господь Господь» и сохраняя различие двух элементов титула.
- source_word: הֵילִילוּ
  choice: Рыдайте
  rationale: Форма множественного числа повелительного наклонения от ילל обозначает громкий плач или вопль. «Рыдайте» естественно по-русски передаёт силу скорби; возможное «войте» звучит более грубо и может вызвать преимущественно животные ассоциации.
- source_word: הָהּ לַיּוֹם
  choice: Увы, этот день!
  rationale: Передаёт краткий возглас скорби и ужаса перед грядущим днём. Указательное «этот» естественно выражает определённость еврейского הַ без добавления сведений о самом дне.
theological_decisions:
- issue: Передача Божьего имени в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Исходный текст содержит личное имя יהוה, а не нарицательное אֱלֹהִים. Передача «Яхве» сохраняет это различие, тогда как «Владыка» ясно выражает титул אֲדֹנָי.
- issue: Характер возгласа הָהּ לַיּוֹם
  choice: 'возглас скорби и ужаса: «Увы, этот день!»'
  alternative: 'формула осуждения: «Горе этому дню!»'
  rationale: הָהּ является междометием плача или тревоги. Перевод «горе» мог бы сильнее, чем допускает текст, превратить эмоциональный возглас в формальную формулу приговора.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Вложенные кавычки разграничивают слова пророка, речь Яхве и предписанный плач; лексика остаётся понятной без снижения эмоциональной силы оригинала.
