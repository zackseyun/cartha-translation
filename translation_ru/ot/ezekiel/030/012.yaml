base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/012.yaml
  text: And I will make the Nile channels dry[a], and I will sell the land into the hand of evil men; and I will devastate the land and its fullness by the hand of foreigners. I am Yahweh[c][b]; I have spoken.
translation:
  language: ru
  text: И Я иссушу рукава Нила[a], и продам землю в руки злодеев[b]; опустошу землю и всё, что её наполняет[c], руками чужеземцев. Я, Яхве, сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каналы Нила»; еврейское слово может означать реки, каналы или водные протоки, а здесь относится к водным путям Нила.'
    reason: lexical_alternative
  - marker: b
    text: То есть отдам землю во власть злодеев; еврейский глагол буквально означает «продам».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «землю со всем, что в ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְאֹרִים
  choice: рукава Нила
  rationale: В египетском контексте слово обозначает водные пути Нила — его рукава и каналы, а не реки вообще.
- source_word: חָרָבָה
  choice: иссушу
  rationale: В сочетании с נתן выражает превращение водных путей в сухие; русский глагол естественно передаёт результативное значение конструкции.
- source_word: וּמָכַרְתִּי
  choice: продам
  rationale: Сохранено буквальное значение מכר и сильный образ Божьего суда — передачи земли во власть врагов.
- source_word: בְּיַד רָעִים
  choice: в руки злодеев
  rationale: Сохраняется библейская метафора руки как власти; субстантивированное רָעִים передано без уточнения национальности или роли этих людей.
- source_word: וַהֲשִׁמֹּתִי
  choice: опустошу
  rationale: Передаёт каузативное значение породы hifil от שמם и соответствует современному литературному русскому языку.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: землю и всё, что её наполняет
  rationale: 'Естественно и достаточно близко передаёт меризм: землю вместе со всем её содержимым.'
- source_word: בְּיַד זָרִים
  choice: руками чужеземцев
  rationale: Зָרִים в данном контексте обозначает чужеземных захватчиков; образ руки сохранён, хотя по-русски использован творительный оборот.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, непосредственно стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: דִּבַּרְתִּי
  choice: сказал это
  rationale: Пророческая формула выражает окончательность и несомненность произнесённого решения; местоимение «это» делает формулу естественной по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Образ продажи земли Богом
  choice: продам эту землю
  alternative: отдам эту землю
  rationale: Буквальный образ продажи сохранён, поскольку он выражает судебную передачу земли под вражескую власть и не требует устранения как простая идиома.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Сохранены повтор образа руки, буквальная метафора продажи и личное имя Яхве; синтаксис слегка сглажен ради ясности.
