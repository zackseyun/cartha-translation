base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/022.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against Pharaoh king of Egypt, and I will break his arms, both the strong one and the broken one, and I will make the sword fall from his hand.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Вот, Я — против фараона, царя Египта. Я сломаю обе его руки[a] — и сильную, и сломанную, — и сделаю так, что меч выпадет из его руки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его руки — сильную и сломанную». Оба определения в еврейском тексте стоят в женском роде и единственном числе и относятся к подразумеваемому слову «рука».'
    reason: Уточняет грамматическую связь определений с каждой из двух рук, не навязывая временной оттенок «уже сломанную».
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего пророчества о суде и сохраняет логическую связь.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: так говорит Владыка Господь
  rationale: Сохраняет торжественную пророческую формулу и различает оба элемента составного Божьего титула без неестественного повтора «Господь Господь».
- source_word: הִנְנִי אֶל
  choice: Вот, Я — против
  rationale: «Вот» передаёт эмфатическое הִנְנִי, а «против» выражает враждебную направленность אֶל в данном контексте.
- source_word: זְרֹעֹתָיו
  choice: обе его руки
  rationale: Буквальный образ рук сохраняет метафору военной силы; последующие определения в единственном числе указывают на каждую из двух рук.
- source_word: אֶת הַחֲזָקָה וְאֶת הַנִּשְׁבָּרֶת
  choice: и сильную, и сломанную
  rationale: 'Женский род определений соотносится с подразумеваемым единственным числом «рука». Формулировка не устраняет напряжение образа: Бог сломает как ещё сильную руку, так и уже сломанную.'
- source_word: וְהִפַּלְתִּי אֶת הַחֶרֶב מִיָּדוֹ
  choice: и сделаю так, что меч выпадет из его руки
  rationale: Передаёт каузативную форму глагола נפל и ясно сохраняет Божье действие как причину падения меча.
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Выбранное сочетание естественно для русского библейского стиля, избегает повтора «Господь Господь» и сохраняет различие между אֲדֹנָי и именем יהוה.
- issue: Образ двух рук фараона
  choice: Сохранить конкретный образ рук
  alternative: Передать истолкованно как «военная сила»
  rationale: Текст связывает руки с удерживаемым мечом, поэтому конкретная метафора должна оставаться в основном тексте, не сводясь к отвлечённому понятию силы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис сделан ясным, но конкретные образы рук и падающего меча сохранены.
