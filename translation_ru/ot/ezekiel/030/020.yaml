base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/020.yaml
  text: And it happened in the eleventh year, in the first month, on the seventh day of the month, that the word of Yahweh came to me, saying,
translation:
  language: ru
  text: 'В одиннадцатый год, в первом месяце, в седьмой день месяца ко мне пришло слово Яхве:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: В
  rationale: В русской датировочной формуле начальное וַיְהִי естественно не выражать отдельным глаголом; повествовательная связь и наступление события передаются всей конструкцией.
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: в одиннадцатый год
  rationale: Количественная конструкция древнееврейского текста обозначает порядковый номер года; это её естественное русское соответствие.
- source_word: בָּרִאשׁוֹן
  choice: в первом месяце
  rationale: Субстантивированное «в первом» в датировочной формуле подразумевает первый месяц; существительное добавлено для ясности.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: в седьмой день месяца
  rationale: Буквально «в семь [дней] месяца»; русская календарная формула требует порядкового числительного и слова «день».
- source_word: הָיָה דְבַר יְהוָה
  choice: было ... слово Яхве
  rationale: Сохранена характерная пророческая формула с глаголом «быть»; порядок слов слегка приспособлен к русскому синтаксису.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, без замены титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямое и идиоматичное соответствие предлогу с суффиксом первого лица.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит последующую прямую речь по-русски и передаёт функцию еврейского инфинитива «сказать», избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Форма «Яхве» прямо передаёт тетраграмматон и не заменяет его титулом; «Иегова» основано на более позднем смешении согласных имени с традиционными гласными для чтения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и ритма пророческой датировочной формулы. Архаическое «и было» в начале опущено как неестественное; формула «было ко мне слово Яхве» сохранена ради жанровой узнаваемости. Двоеточие ясно показывает продолжение речи в следующем стихе.
