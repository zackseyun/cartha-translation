source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה וְ/הַאֲבַדְתִּ֨י גִלּוּלִ֜ים וְ/הִשְׁבַּתִּ֤י אֱלִילִים֙ מִ/נֹּ֔ף וְ/נָשִׂ֥יא מֵ/אֶֽרֶץ מִצְרַ֖יִם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/נָתַתִּ֥י יִרְאָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/013.yaml
  text: 'Thus says the Lord GOD: I will destroy the idols and put an end to the images from Noph[a], and there will no longer be a prince from the land of Egypt[b]; and I will put fear in the land of Egypt.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Я уничтожу идолов и положу конец идольским изваяниям в Нофе[a]. Больше не будет правителя из земли Египта[b], и Я наведу страх на землю Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ноф — еврейское название египетского города, позднее известного под греческим именем Мемфис.
    reason: cross_reference
  - marker: b
    text: 'Или: «князя из земли Египта». Еврейское слово может также означать вождя или правителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: אֲדֹנָי передаётся как «Владыка», а личное имя יהוה — как «Яхве»; сочетание сохраняет различие между титулом и именем и естественно звучит по-русски.
- source_word: וְהַאֲבַדְתִּי גִלּוּלִים
  choice: Я уничтожу мерзких идолов
  rationale: Каузативная форма אבד выражает решительное уничтожение, а презрительное גִלּוּלִים требует по возможности сохранить уничижительный оттенок, переданный словом «мерзких».
- source_word: וְהִשְׁבַּתִּי אֱלִילִים
  choice: положу конец ложным богам
  rationale: Hiphil שׁבת означает «заставить прекратиться, устранить», а אֱלִילִים обозначает бессильных, ничтожных божеств. Формулировка отличает это слово от предшествующего גִלּוּלִים, не превращая два близких термина в полные синонимы.
- source_word: מִנֹּף
  choice: в Нофе
  rationale: Предлог מן здесь указывает на место, откуда будут устранены идолы; по-русски естественно «в Нофе». Сохранено древнееврейское название города, а его общеизвестное греческое название пояснено в сноске.
- source_word: וְנָשִׂיא מֵאֶרֶץ מִצְרַיִם לֹא יִהְיֶה עוֹד
  choice: Не будет больше правителя из земли Египетской
  rationale: נָשִׂיא может означать князя, вождя или правителя. «Правитель» естественно передаёт функцию носителя власти, тогда как конструкция «из земли Египетской» сохраняет возможный смысл местного египетского правителя.
- source_word: וְנָתַתִּי יִרְאָה
  choice: Я наведу страх
  rationale: Буквальное «дам страх» по-русски неестественно; «наведу страх» сохраняет каузативный смысл, не усиливая יִרְאָה до более узкого «ужаса».
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: на землю Египетскую
  rationale: Выбор падежного управления обусловлен русским выражением «навести страх на» и передаёт область, охваченную страхом, без добавления значения «по всей».
theological_decisions:
- issue: Передача составного божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Передача личного имени как «Яхве» сохраняет его отличие от титула אֲדֹנָי. «Владыка» позволяет избежать неясного повтора «Господь Яхве» и не подменяет имя словом «Бог».
- issue: Характер египетской власти, обозначенной словом נָשִׂיא
  choice: правитель
  alternative: князь; вождь
  rationale: Контекст предрекает прекращение местной власти, но не уточняет её точный титул. Общее слово «правитель» сохраняет эту неопределённость; формальная альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным и естественным, при этом сохранены повтор «земля Египетская», образ наведения страха и различие между двумя обозначениями идолов.
