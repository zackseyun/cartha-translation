  - marker: b
    text: Но обычно отождествляют с Фивами.
    reason: cross_reference
  - marker: c
    text: Ноф обычно отождествляют с Мемфисом.
    reason: cross_reference
  - marker: d
    text: 'Буквально: «а Ноф — враги днём» или «а у Нофа — враги днём». Еврейская фраза очень кратка; «днём» может подчёркивать открытый, происходящий при свете дня характер угрозы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֵשׁ בְּמִצְרַיִם
  choice: И Я зажгу огонь в Египте
  rationale: Сочетание נתן с «огнём» и указанием места идиоматически означает предать место огню или зажечь там огонь. Перевод сохраняет значение суда и естественно звучит по-русски; предлог ב передан своим прямым пространственным значением.
- source_word: חוּל תחיל סִין
  choice: Син будет корчиться в муках
  rationale: Формы от חול создают усиленное выражение и могут обозначать дрожь, родовые муки или мучительные судороги. «Корчиться в муках» сохраняет яркий телесный образ и усиление.
- source_word: סִין
  choice: Син
  rationale: Сохранена транслитерация древнееврейского названия; распространённое отождествление с Пелусием вынесено в сноску.
- source_word: וְנֹא תִּהְיֶה לְהִבָּקֵעַ
  choice: Но будет взломан
  rationale: Nifal от בקע означает быть расколотым, прорванным или взломанным. В отношении укреплённого города «будет взломан» передаёт конкретный образ насильственного прорыва.
- source_word: וְנֹף
  choice: Ноф
  rationale: Сохранена форма древнееврейского топонима; историческое отождествление с Мемфисом дано в сноске.
- source_word: צָרֵי יוֹמָם
  choice: нападут враги среди бела дня
  rationale: צָרֵי понято как «враги, противники», а יוֹמָם — как «днём». Поскольку еврейская фраза предельно кратка и не содержит явного глагола, «нападут» естественно выражает подразумеваемое в контексте открытое вражеское действие; буквальная структура отмечена в сноске.
