  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ/י אֵ֣שׁ בְּ/מִצְרַ֔יִם וְ/נִשְׁבְּר֖וּ כָּל עֹזְרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/008.yaml
  text: Then they will know that I am Yahweh[a], when I set fire to Egypt and all her helpers are broken.
translation:
  language: ru
  text: Тогда они узнают, что Я — Яхве, когда Я зажгу огонь в Египте и будут сокрушены все его помощники[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все его союзники». Буквально: «все его помощники»; речь может идти о народах или силах, поддерживающих Египет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Тогда они узнают
  rationale: Союз ו связывает это знание с предшествующим судом как его результатом; «тогда» естественно передаёт ход мысли.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: כִּי вводит содержание знания, а личное имя יהוה передано транслитерацией «Яхве», без замены титулом.
- source_word: בְּתִתִּי אֵשׁ בְּמִצְרַיִם
  choice: когда Я зажгу огонь в Египте
  rationale: Инфинитив с בְּ обозначает время сопутствующего действия; выражение сохраняет образ огня и местное значение предлога בְּ перед «Египтом».
- source_word: וְנִשְׁבְּרוּ
  choice: и будут сокрушены
  rationale: Нифаль от שׁבר выражает пассивное разрушение или сокрушение; будущее время соответствует пророческому контексту.
- source_word: כָּל עֹזְרֶיהָ
  choice: все его помощники
  rationale: עֹזְרֶיהָ буквально означает «её помощники»; в русском род местоимения согласован с существительным «Египет», а буквальное «помощники» сохраняет неоднозначность относительно союзных народов или поддерживающих сил.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит собственное божественное имя, поэтому оно передано распространённой научной транслитерацией, а не заменено титулом.
- issue: Кто такие «помощники» Египта
  choice: помощники
  alternative: союзники
  rationale: Буквальная передача не ограничивает круг обозначаемых лиц или сил только формальными союзниками и сохраняет широту исходного слова.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для широкого читателя; образность и неопределённость еврейского текста сохранены.
