base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/005.yaml
  text: Cush and Put and Lud and all the mixed people and Cub and the sons of the land of the covenant—with them they will fall by the sword[a][b][c].
translation:
  language: ru
  text: Куш, Пут, Луд, всё смешанное население[a], Кув[b] и сыны земли завета[c] — вместе с ними падут от меча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вся Аравия», «все наёмники» или «всё смешанное множество»; значение еврейского слова עֶרֶב здесь спорно.'
    reason: lexical_alternative
  - marker: b
    text: «Кув» — редкое название места или народа; точное отождествление неизвестно. Возможна также передача «Куб».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «люди земли завета». Возможно, речь идёт о людях, связанных союзным договором; некоторые понимают это выражение как указание на иудеев, живших в Египте.'
    reason: alternative_reading
lexical_decisions:
- source_word: כּוּשׁ
  choice: Куш
  rationale: Сохранено древнееврейское этногеографическое имя без отождествления с современной Эфиопией.
- source_word: פּוּט
  choice: Пут
  rationale: Транслитерация собственного имени в соответствии с формой еврейского текста.
- source_word: לוּד
  choice: Луд
  rationale: Транслитерация сохраняет еврейскую форму и не навязывает отождествление с Лидией или лидийцами.
- source_word: כָל הָעֶרֶב
  choice: весь смешанный народ
  rationale: Передаёт наиболее вероятное значение смешанной группы населения; спорность слова и возможные значения отражены в сноске.
- source_word: כּוּב
  choice: Кув
  rationale: Редкое и неуверенно идентифицируемое географическое или этническое имя передано транслитерацией.
- source_word: בְנֵי אֶרֶץ הַבְּרִית
  choice: сыны земли завета
  rationale: Формально близкий перевод сохраняет образное выражение и неопределённость его референта.
- source_word: אִתָּם
  choice: вместе с ними
  rationale: Естественно передаёт значение совместности и связь с ранее названными народами.
- source_word: בַּחֶרֶב
  choice: от меча
  rationale: Устойчивый русский библейский оборот сохраняет образ смерти в войне или при суде.
- source_word: יִפֹּלוּ
  choice: падут
  rationale: Сохраняет буквальный пророческий образ глагола נפל, который в контексте подразумевает гибель.
theological_decisions:
- issue: Кого обозначают «сыны земли завета»
  choice: Не уточнять референта в основном тексте
  alternative: Передать как людей, связанных союзным договором, либо как иудеев, живущих в Египте
  rationale: Древнееврейская фраза допускает разные понимания; конкретизация необоснованно устранила бы её подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого ритма. Повтор союза «и» отражает перечислительную структуру древнееврейского текста; «падут от меча» сохраняет традиционный, но понятный современному читателю библейский образ.
