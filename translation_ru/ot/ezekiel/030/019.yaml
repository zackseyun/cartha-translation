  text: וְ/עָשִׂ֥יתִי שְׁפָטִ֖ים בְּ/מִצְרָ֑יִם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/019.yaml
  text: Thus I will execute judgments on Egypt[a], and they will know that I am Yahweh.
translation:
  language: ru
  text: Так Я совершу суды над Египтом, и они узнают, что Я — Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (YHWH), личное имя Бога; традиционно переводится: «Господь».'
    reason: Пояснение передачи тетраграмматона и традиционного варианта.
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: Так Я совершу
  rationale: Глагол עשה буквально означает «делать», но в сочетании с שְׁפָטִים естественно передаётся как «совершить суды». Союз וְ в данном контексте выражает итог предшествующего пророчества, поэтому переведён словом «так».
- source_word: שְׁפָטִים
  choice: суды
  rationale: Форма множественного числа обозначает совершаемые Богом судебные и карательные действия. «Суды» сохраняет число, пророческий регистр и намеренную многозначность.
- source_word: בְּמִצְרָיִם
  choice: над Египтом
  rationale: Предлог בְ буквально может означать «в», однако при совершении суда русский оборот «суды над Египтом» естественно передаёт направленность Божьих действий против страны.
- source_word: וְיָדְעוּ
  choice: и они узнают
  rationale: Сохранена характерная для Иезекииля формула узнавания. Местоимение «они» делает невыраженное в еврейском тексте подлежащее множественного числа ясным по-русски, не уточняя его референт сверх контекста.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: כִּי вводит содержание познания, а יהוה передано как личное Божье имя «Яхве», а не заменено титулом. Тире соответствует естественной русской именной конструкции.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В основном тексте сохранено личное имя, непосредственно стоящее в еврейском оригинале. Традиционная передача титулом «Господь» указана в сноске, чтобы не скрывать текстологическую основу и богослужебную традицию.
- issue: Характер שְׁפָטִים
  choice: суды
  alternative: наказания
  rationale: Более широкое слово «суды» сохраняет как судебный, так и карательный смысл пророческого выражения и не сводит его только к наказанию.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Формула узнавания и множественное число «суды» сохранены; синтаксис сделан естественным для современного читателя.
