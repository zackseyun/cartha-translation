base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/011.yaml
  text: He and his people with him—the ruthless of the nations—will be brought in to destroy the land[a]. They will draw their swords against Egypt and fill the land with the slain.
translation:
  language: ru
  text: Он и его народ с ним — безжалостные из народов[a] — будут приведены, чтобы разорить землю. Они обнажат свои мечи против Египта и наполнят землю убитыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «жестокие из народов» или «наводящие ужас среди народов». Еврейское выражение характеризует захватчиков как безжалостных и внушающих ужас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוֹ
  choice: его народ
  rationale: Сохраняет обычное значение עַם и не уточняет без необходимости, идёт ли речь исключительно о войске, хотя в данном контексте народ сопровождает завоевателя как военная сила.
- source_word: עָרִיצֵי גוֹיִם
  choice: безжалостные среди народов
  rationale: עָרִיץ обозначает жестоких, насильственных и внушающих ужас людей. Формулировка передаёт характеристику захватчиков, не вводя отсутствующую в еврейском тексте явную превосходную степень.
- source_word: מוּבָאִים
  choice: будут приведены
  rationale: Страдательная форма сохраняет каузативно-пассивный смысл глагола и не называет того, кто приведёт захватчиков; будущее время соответствует пророческому контексту.
- source_word: לְשַׁחֵת
  choice: чтобы разорить
  rationale: В контексте нападения на страну глагол означает привести землю в гибельное, разорённое состояние; «разорить» естественно по-русски и не требует понимания как буквального полного уничтожения.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Речь идёт о территории Египта, а не обо всей земле; повтор одного и того же слова сохраняет повтор еврейского текста.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם עַל
  choice: они обнажат свои мечи против
  rationale: Сочетание ריק с «мечами» является военным оборотом со значением вынуть мечи из ножен и направить их против кого-либо.
- source_word: מָלְאוּ אֶת־הָאָרֶץ חָלָל
  choice: наполнят землю убитыми
  rationale: חָלָל здесь обозначает павших от насильственной смерти, прежде всего убитых в бою; перевод сохраняет суровый образ без добавления слова «трупы».
theological_decisions:
- issue: Неназванный деятель при страдательной форме מוּבָאִים
  choice: сохранить страдательную конструкцию «будут приведены»
  alternative: «придут» или «Бог приведёт их»
  rationale: Еврейский стих не называет действующее лицо непосредственно. Перевод не устраняет возможный намёк на Божье действие, но и не делает его явным сверх текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной пророческой интонацией. Пассивная конструкция и повтор слова «земля» сохранены ради смысловой близости к еврейскому тексту; явная превосходная степень не вводится.
