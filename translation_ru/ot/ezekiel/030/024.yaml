  source_fidelity: 'Будущие формы и центральная метафора сохранены верно: Господь укрепляет «руки» царя Вавилона, вручает ему Свой меч и сокрушает руки фараона. Однако «сражённый» в современном русском обычно воспринимается как уже убитый, поэтому образ его стонов звучит внутренне противоречиво. חָלָל в данном контексте может описывать тяжело, смертельно поражённого в бою; «тяжело раненный» естественно передаёт образ страдальца, который стонет, не снимая военного характера выражения.'
