  terminology: «Руки», «царь Вавилона», «фараон» и «меч» уместны. Заглавное «Мой» соответствует русской библейской редакционной традиции. Неоднозначный референт לְפָנָיו корректно оставлен в основном тексте и оговорён в сноске.
