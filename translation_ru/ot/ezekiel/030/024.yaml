  text: וְ/חִזַּקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נָתַתִּ֥י אֶת חַרְבִּ֖/י בְּ/יָד֑/וֹ וְ/שָׁבַרְתִּי֙ אֶת זְרֹע֣וֹת פַּרְעֹ֔ה וְ/נָאַ֛ק נַאֲק֥וֹת חָלָ֖ל לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/024.yaml
  text: And I will strengthen the arms of the king of Babylon[a], and I will put my sword into his hand; but I will break the arms of Pharaoh, and he will groan before him with the groanings of a slain man.
translation:
  language: ru
  text: И укреплю руки царя Вавилона и вложу Мой меч в его руку; а руки фараона сокрушу, и он будет стонать перед ним[a], как стонет тяжело раненный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передо Мной», если местоимение относится к Господу, а не к царю Вавилона.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: И укреплю
  rationale: Перфект с союзом в пророческой последовательности естественно передаётся будущим временем; глагол сохраняет образ дарованной военной силы.
- source_word: זְרֹעוֹת
  choice: руки
  rationale: 'Буквальное значение сохраняет сквозной образ: руки вавилонского царя укрепляются, а руки фараона сокрушаются.'
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Естественная передача еврейской сопряжённой конструкции без добавления не названного в тексте имени.
- source_word: וְנָתַתִּי אֶת חַרְבִּי בְּיָדוֹ
  choice: и вложу Мой меч в его руку
  rationale: Сохраняет конкретный образ вручения царю Вавилона орудия Божьего суда и звучит естественно по-русски.
- source_word: חַרְבִּי
  choice: Мой меч
  rationale: 'Притяжательное местоимение существенно: меч в руке вавилонского царя остаётся орудием суда Господа.'
- source_word: וְשָׁבַרְתִּי
  choice: а ... сокрушу
  rationale: «Сокрушу» естественно сочетается с образом поражённой военной мощи и передаёт сильное значение глагола; союз передан противопоставлением.
- source_word: זְרֹעוֹת פַּרְעֹה
  choice: руки фараона
  rationale: Сохраняется буквальный образ и его намеренная симметрия с руками царя Вавилона.
- source_word: וְנָאַק נַאֲקוֹת
  choice: и тот застонет ... как стонет
  rationale: Повтор корня נ־א־ק передан повтором русского глагола, что сохраняет усилительную родственную конструкцию без неестественного «застонет стонами».
- source_word: חָלָל
  choice: сражённый
  rationale: Обозначает поражённого, пронзённого или павшего в бою; «сражённый» сохраняет военный контекст и допускает смертельный исход, не превращая образ в громоздкое пояснение.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: В основном тексте местоимение отнесено к ближайшему уместному участнику — царю Вавилона; подлинная неоднозначность отмечена в сноске.
theological_decisions:
- issue: К кому относится местоимение в לְפָנָיו
  choice: 'К царю Вавилона: фараон застонет перед ним.'
  alternative: 'К Господу: фараон застонет перед Ним.'
  rationale: Ближайший подходящий референт в развитии фразы — царь Вавилона, в чью руку вложен меч. Однако грамматически возможна отсылка к говорящему Господу, поэтому неоднозначность не устраняется, а сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Повтор «руки» намеренно сохранён как центральная метафора военной силы. Заглавная буква в «Мой» обозначает речь Господа; местоимение «его» оставлено со строчной как относящееся к царю Вавилона.
