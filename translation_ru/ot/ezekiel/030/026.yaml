  yaml_path: translation/ot/ezekiel/030/026.yaml
  text: I will scatter Egypt among the nations[a], and I will disperse them through the lands. Then they will know that I am Yahweh.
translation:
  language: ru
  text: Я рассею Египет среди народов[a] и развею их по странам. И узнают они, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сначала назван «Египет», а затем употреблено местоимение «их», относящееся к египтянам.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: Я рассею
  rationale: Глагол פוץ означает «рассеивать, разгонять». «Рассею» естественно передаёт образ принудительного расселения и сохраняет отличие от следующего глагола.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: В еврейском тексте прямо назван Египет как страна или народ в собирательном смысле; название сохранено, а последующее множественное местоимение указывает на египтян.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם обычно обозначает народы или нации; «среди народов» естественно для контекста рассеяния.
- source_word: וְזֵרִיתִי
  choice: и развею
  rationale: זרה может означать «веять, развеивать, рассеивать». «Развею» сохраняет образ широкого рассеяния и не повторяет первый глагол.
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение стоит во множественном числе и переводится буквально, хотя его собирательный антецедент — «Египет»; имеются в виду жители Египта.
- source_word: בָּאֲרָצוֹת
  choice: по разным странам
  rationale: Множественное אֲרָצוֹת означает «земли, страны». Добавление «разным» естественно выражает распределение по множеству стран, уже заложенное в контексте.
- source_word: וְיָדְעוּ
  choice: И узнают они
  rationale: Сохранено сочинительное וְ без усиления причинно-следственного оттенка; инверсия звучит торжественно, но остаётся понятной в современном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога. Форма «Яхве» представляет общепринятую научную реконструкцию произношения и не подменяет имя титулом.
- issue: Переход от «Египта» к местоимению множественного числа
  choice: Сохранить «Египет» и последующее «их»
  alternative: Заменить на «египтян» ради грамматического согласования
  rationale: Так сохраняется смысловой переход оригинала от страны или народа как целого к его людям, не устраняя присущую тексту смену числа.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Смена «Египет» — «их» намеренно сохранена и пояснена сноской; пара «рассею — развею» отражает два разных еврейских глагола.
