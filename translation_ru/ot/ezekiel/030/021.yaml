source:
  edition: WLC
  text: בֶּן אָדָ֕ם אֶת זְר֛וֹעַ פַּרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם שָׁבָ֑רְתִּי וְ/הִנֵּ֣ה לֹֽא חֻ֠בְּשָׁה לָ/תֵ֨ת רְפֻא֜וֹת לָ/שׂ֥וּם חִתּ֛וּל לְ/חָבְשָׁ֥/הּ לְ/חָזְקָ֖/הּ לִ/תְפֹּ֥שׂ בֶּ/חָֽרֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/021.yaml
  text: Son of man[a], I have broken the arm of Pharaoh king of Egypt, and behold, it has not been bound up to apply remedies, to put on a bandage, to bind it, to strengthen it so that it may grasp the sword.
translation:
  language: ru
  text: 'Сын человеческий, Я сломал руку фараона, царя Египта; и вот, её не перевязали: не применили лечебных средств[a], не наложили повязку, чтобы перевязать её, укрепить её, чтобы она могла держать меч.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лекарств»; еврейское выражение обозначает применение лечебных средств к сломанной руке.'
    reason: 'Лексическая альтернатива для רְפֻאוֹת: слово может обозначать лекарства или лечебные средства, а в данном контексте — медицинское лечение повреждённой руки.'
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено устойчивое пророческое обращение, многократно повторяющееся в книге Иезекииля; оно передаёт еврейский образ без излишнего истолкования.
- source_word: זְרוֹעַ
  choice: руку
  rationale: Буквальное обозначение руки сохраняет политико-военную метафору силы фараона; более отвлечённое «мощь» сделало бы образ менее конкретным.
- source_word: שָׁבָרְתִּי
  choice: Я сломал
  rationale: Русское прошедшее время естественно передаёт совершённое действие, последствия которого описаны далее.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохранён выразительный пророческий указатель, привлекающий внимание к нынешнему состоянию сломанной руки.
- source_word: חֻבְּשָׁה
  choice: её так и не перевязали
  rationale: Активная неопределённо-личная конструкция естественна по-русски и передаёт еврейский пассив; «так и» подчёркивает сохраняющееся отсутствие лечения.
- source_word: לָתֵת רְפֻאוֹת
  choice: не приложили к ней лекарств
  rationale: Передан конкретный медицинский смысл множественного רְפֻאוֹת. Формулировка естественна в контексте лечения повреждённой руки и сохраняет отличие от повязки.
- source_word: חִתּוּל
  choice: повязки
  rationale: Ясный современный медицинский эквивалент для обёртывающего перевязочного материала.
- source_word: לְחָזְקָהּ
  choice: чтобы укрепить её
  rationale: Сохранена цель лечения — вернуть руке силу и устойчивость.
- source_word: לִתְפֹּשׂ בֶּחָרֶב
  choice: дать ей возможность держать меч
  rationale: Сохранён конкретный образ возвращённой военной способности; «держать» ближе к буквальному «схватить, держать», чем более истолковывающее «владеть мечом».
theological_decisions:
- issue: Образ сломанной руки фараона
  choice: Сохранён как телесная военно-политическая метафора без пояснения в основном тексте
  alternative: Передать прямо как уничтоженную военную мощь Египта
  rationale: Еврейский текст выражает суд над силой фараона через конкретный образ руки; раскрывать метафору вместо её перевода означало бы снять её образность и напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Медицинский образ передан понятно и конкретно; синтаксис слегка упорядочен ради естественности, без устранения последовательности лечения и конечного военного образа.
