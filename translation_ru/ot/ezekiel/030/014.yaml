  yaml_path: translation/ot/ezekiel/030/014.yaml
  text: I will make Pathros desolate[a], and I will set fire in Zoan[c][b], and I will execute judgments on No.
translation:
  language: ru
  text: Я опустошу Патрос[a], зажгу огонь в Цоане[b] и совершу суд над Но[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превращу Патрос в пустыню».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разведу огонь в Цоане». Буквально: «дам огонь в Цоане».'
    reason: lexical_alternative
  - marker: c
    text: Но — египетский город, известный также как Фивы.
