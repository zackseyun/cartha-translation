lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: Я опустошу
  rationale: Каузативная форма от שׁמם означает привести место в состояние запустения. «Опустошу» естественно и ёмко передаёт как действие, так и его результат.
- source_word: פַּתְרוֹס
  choice: Патрос
  rationale: Географическое название передано принятой русской транслитерацией.
- source_word: וְנָתַתִּי אֵשׁ
  choice: зажгу огонь
  rationale: Буквально «дам огонь»; в данном контексте это идиома разрушительного пожара. Выбранная формулировка естественна по-русски и сохраняет прямое действие говорящего.
- source_word: בְּצֹעַן
  choice: в Цоане
  rationale: Предлог בְּ здесь естественно обозначает место действия — огонь будет зажжён в городе.
- source_word: וְעָשִׂיתִי שְׁפָטִים
  choice: совершу суды
  rationale: Множественное שְׁפָטִים обозначает карательные судебные действия. Формулировка сохраняет множественное число и судебный оттенок исходного выражения.
- source_word: בְּנֹא
  choice: над Но
  rationale: При русском сочетании «совершить суд» предлог «над» естественно обозначает объект судебного действия, передавая направленность еврейского בְּ в данном обороте.
theological_decisions:
- issue: Характер Божьего действия в пророчестве о суде
  choice: 'Все глаголы первого лица переданы как прямые действия: «опустошу», «зажгу», «совершу».'
  alternative: Смягчить формулировки так, чтобы они выражали лишь допущение бедствия.
  rationale: Еврейский текст прямо представляет говорящего исполнителем суда; перевод не должен ослаблять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм трёх прямых действий сохранён; географические названия переданы традиционными русскими формами.
