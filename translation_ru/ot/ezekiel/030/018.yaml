base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/018.yaml
  text: And in Tahpanhes the day will grow dark when I break there the bars of Egypt[a], and the pride of her strength will cease in her. As for her, a cloud will cover her[b], and her daughters will go into captivity.
translation:
  language: ru
  text: И в Тафнисе померкнет день, когда Я сокрушу там перекладины Египта[a], и прекратится в нём гордость его силы. Его покроет облако, и его дочерние города[b] пойдут в плен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перекладины египетского ярма». Еврейский образ может обозначать опоры могущества или владычества Египта.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его дочери» — обычное в пророческой речи обозначение зависимых городов или окрестных поселений.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבִתְחַפְנְחֵס
  choice: И в Тафнисе
  rationale: Название города передано в принятой русской библейской форме; ב выражает местонахождение.
- source_word: חָשַׂךְ הַיּוֹם
  choice: померкнет день
  rationale: Естественно и образно передаёт наступление тьмы как знак суда, не уточняя сверх текста, идёт ли речь буквально о дневном свете или метафорически о бедствии.
- source_word: בְּשִׁבְרִי
  choice: когда Я сокрушу
  rationale: Инфинитив с суффиксом первого лица имеет временное значение; «сокрушу» передаёт силу שׁבר и сочетается с образом перекладин.
- source_word: מֹטוֹת מִצְרַיִם
  choice: перекладины Египта
  rationale: מֹטוֹת может обозначать шесты, перекладины или части ярма. «Перекладины» сохраняет конкретную, но неоднозначную метафору опор власти; вариант с ярмом отмечен в сноске.
- source_word: וְנִשְׁבַּת בָּהּ
  choice: и прекратится в нём
  rationale: Нифаль глагола שבת означает прекращение или конец. Местоимение передано в мужском роде по грамматическому роду русского названия города, без устранения возможной отсылки к Египту.
- source_word: גְּאוֹן עֻזָּהּ
  choice: гордость его силы
  rationale: 'Сохранены оба существительных конструктивной цепочки: высокомерная гордость, связанная с силой или могуществом.'
- source_word: הִיא עָנָן יְכַסֶּנָּה
  choice: Его покроет облако
  rationale: Самостоятельное הִיא подчёркивает объект, однако отдельное «что до него» по-русски тяжеловесно; вынесенное в начало дополнение «его» естественно сохраняет фокус.
- source_word: וּבְנוֹתֶיהָ
  choice: его дочерние города
  rationale: Буквально «его дочери»; в пророческой речи это зависимые города или окрестные поселения. Основной текст раскрывает устойчивую древнееврейскую идиому, а сноска сообщает буквальный образ.
- source_word: בַּשְּׁבִי תֵלַכְנָה
  choice: пойдут в плен
  rationale: Близко передаёт движение в состояние плена и последующее насильственное переселение.
theological_decisions:
- issue: К кому относятся местоимения единственного числа во второй половине стиха
  choice: В русском тексте они грамматически соотнесены с Тафнисом, при сохранении контекстуальной возможности видеть за городом олицетворённый Египет.
  alternative: Понимать все местоимения исключительно как относящиеся к олицетворённому Египту.
  rationale: Ближайший антецедент — Тафнис, а выражение о дочерних городах соответствует образу главного города с зависимыми поселениями; вместе с тем всё пророчество направлено против Египта, поэтому перевод не вводит узкого пояснения в основной текст.
- issue: Образ מֹטוֹת Египта
  choice: Сохранить метафору «перекладины Египта» и указать вариант «перекладины ярма» в сноске.
  alternative: Сразу истолковать выражение как «власть Египта» или «египетское ярмо».
  rationale: Исходное слово допускает образ шестов, перекладин и деталей ярма; буквальный образ сохраняет намеренную смысловую ёмкость и не навязывает конкретное богословско-политическое толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенной пророческой интонацией. Использованы ясные, но не разговорные формулировки; сохранены образы тьмы, сломанных перекладин и покрывающего облака. Божественное «Я» написано с прописной буквы согласно русской библейской издательской традиции.
