base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/010.yaml
  text: 'Thus says the Lord GOD: I will put an end to the multitude of Egypt by the hand of Nebuchadnezzar king of Babylon[a][b].'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Я положу конец множеству Египта рукой[a] Навуходоносора[b], царя Вавилона».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой»; это еврейский оборот со значением «через», «посредством».'
    reason: lexical_alternative
  - marker: b
    text: Еврейская форма имени здесь ближе к «Невухадреццар»; «Навуходоносор» — традиционная русская форма.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка пророческая формула, сохраняющая торжественный тон и значение еврейского выражения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: «Владыка» передаёт אֲדֹנָי, а «Господь» — традиционное русское обозначение имени יהוה; сочетание различает оба элемента и звучит естественнее, чем «Господь Господь».
- source_word: וְהִשְׁבַּתִּי
  choice: Я положу конец
  rationale: 'Передаёт каузативное значение породы hифиль: говорящий заставит нечто прекратиться, устранит его.'
- source_word: הֲמוֹן מִצְרַיִם
  choice: множеству Египта
  rationale: הָמוֹן может обозначать множество, массу населения, полчище или изобилие. Обобщённое «множество» сохраняет широту и некоторую неоднозначность исходного слова.
- source_word: בְּיַד
  choice: рукой
  rationale: Сохранён еврейский образ, обозначающий действие через посредника или орудие; смысл пояснён в сноске.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносора
  rationale: Употреблена общепринятая и легко узнаваемая русская форма имени; более близкая к данному еврейскому написанию форма отмечена в сноске.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции, называющей титул и царство.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה, включающего личное имя Бога
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Основной текст следует устойчивой русской библейской норме, при этом словом «Владыка» отдельно передаёт титул אֲדֹנָי. Вариант «Владыка Яхве» нагляднее различает титул и имя, но менее привычен в русском литературном библейском регистре.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис краток и ясен; исходный образ «рукой» сохранён, а его идиоматический смысл вынесен в сноску. Слово «множество» намеренно не сужено до одного значения — только населения, войска или богатства.
