lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительно-причинную связь с предшествующим пророчеством и соответствует возвышенному, но современно понятному регистру.
- source_word: קָרוֹב יוֹם וְקָרוֹב יוֹם
  choice: близок день, близок день
  rationale: Сохраняет троекратное употребление слова «день» в стихе и настойчивый повтор близости дня без добавления отсутствующего в еврейском тексте усилителя.
- source_word: יוֹם לַיהוָה
  choice: день Яхве
  rationale: Передаёт пророческую формулу с личным именем יהוה и естественной для русского языка родительной конструкцией.
- source_word: יוֹם עָנָן
  choice: день облачный
  rationale: Естественно передаёт краткое сочетание существительных и сохраняет зловещий образ облака, не конкретизируя его как обычную пасмурную погоду.
- source_word: עֵת גּוֹיִם
  choice: время народов
  rationale: Близко передаёт намеренно краткую и неоднозначную еврейскую фразу, не уточняя без достаточных оснований, идёт ли речь о суде над народами, их сроке или эпохе, связанной с ними.
- source_word: יִהְיֶה
  choice: это будет
  rationale: Явно выражает будущую связку, подразумеваемую русским предложением, и относит последующие характеристики к приближающемуся дню.
theological_decisions:
- issue: Передача пророческой формулы יוֹם לַיהוָה
  choice: день Яхве
  alternative: день Господа
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл עֵת גּוֹיִם
  choice: время народов
  alternative: время для народов
  rationale: Родительная конструкция лучше сохраняет лаконичность и подлинную неопределённость оригинала, тогда как «для народов» сильнее предполагает направленность события на них.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Сохранены повтор слова «день», личное имя Яхве и смысловая сжатость заключительной фразы; архаизмы и конфессионально окрашенные пояснения не добавлены.
