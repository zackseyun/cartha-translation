  yaml_path: translation/ot/ezekiel/030/017.yaml
  text: The young men of Aven and Pi-beseth will fall by the sword[b][a], and these cities will go into captivity.
translation:
  language: ru
  text: Юноши Авена[a] и Пи-Бесета[b] падут от меча, а эти города пойдут в плен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Авен, вероятно, относится к Ону, то есть к египетскому Гелиополю.
    reason: alternative_reading
  - marker: b
    text: Пи-Бесет обычно отождествляют с Бубастисом.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּח֥וּרֵי
  choice: юноши
  rationale: בַּחוּרִים обозначает молодых мужчин в расцвете сил; «юноши» естественно передаёт возраст и не добавляет значения избранности или воинского статуса.
- source_word: אָ֛וֶן
  choice: Авена
  rationale: Топоним передан транслитерацией с естественным русским склонением; вероятное отождествление с Оном (Гелиополем) вынесено в сноску.
- source_word: וּ/פִי בֶ֖סֶת
  choice: и Пи-Бесета
  rationale: Еврейская форма топонима передана транслитерацией и склоняется по-русски; традиционное отождествление с Бубастисом отмечено в сноске.
- source_word: בַּ/חֶ֣רֶב
  choice: от меча
  rationale: Устойчивое русское библейское выражение ясно передаёт гибель посредством оружия.
- source_word: יִפֹּ֑לוּ
  choice: падут
  rationale: Сохраняет образ еврейского נפל и его контекстуальное значение гибели в сражении.
- source_word: וְ/הֵ֖נָּה
  choice: а сами эти города
  rationale: Местоимение женского рода множественного числа относится к названным городам; существительное «города» добавлено для ясности. «Сами» естественно передаёт контраст между гибелью юношей и пленением населения городов.
- source_word: בַּ/שְּׁבִ֥י
  choice: в плен
  rationale: Краткое и естественное русское соответствие, обозначающее состояние плена и насильственное переселение.
- source_word: תֵלַֽכְנָה
  choice: пойдут
  rationale: Сохраняет буквальный образ глагола הלך; в сочетании «пойдут в плен» ясно выражает депортацию.
