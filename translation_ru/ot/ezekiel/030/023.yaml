lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: И Я рассею
  rationale: 'Форма породы хифиль от פוץ выражает действие, совершаемое говорящим: он рассеивает людей. Русское «рассею» естественно передаёт причинительный смысл в данном контексте.'
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Сохранено название страны, как в еврейском тексте; здесь оно метонимически обозначает население Египта.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם означает народы или нации; «среди народов» естественно для контекста изгнания и рассеяния.
- source_word: וְזֵרִיתִם
  choice: и развею их
  rationale: Глагол זרה может означать «веять» или «рассеивать». «Развею» сохраняет образность и лексическое различие с פוץ, а суффикс множественного числа передан местоимением «их».
- source_word: בָּאֲרָצוֹת
  choice: по разным землям
  rationale: Множественное אֲרָצוֹת указывает на множество земель или стран. «По разным землям» идиоматично выражает широкое географическое рассеяние, не сводя предлог ב к статичному местонахождению.
theological_decisions:
- issue: Переход от названия «Египет» к местоимению множественного числа «их»
  choice: Сохранить «Египет» в первой части и «их» во второй.
  alternative: Передать название как «египтян» и согласовать обе части по множественному числу.
  rationale: 'Еврейский текст ставит название народа/страны מִצְרַיִם рядом с суффиксом множественного числа. Это позволяет сохранить метонимию: «Египет» обозначает его жителей, не устраняя присущую оригиналу смену грамматического оформления.'
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Местоимение «Я» написано с прописной буквы как речь Бога. Пара «рассею / развею» сохраняет параллелизм и различие двух еврейских глаголов.
