id: EZK.30.25
reference: Ezekiel 30:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַחֲזַקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וּ/זְרֹע֥וֹת פַּרְעֹ֖ה תִּפֹּ֑לְנָה וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בְּ/תִתִּ֤/י חַרְבִּ/י֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/נָטָ֥ה אוֹתָ֖/הּ אֶל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/025.yaml
  text: I will strengthen the arms of the king of Babylon[a], but Pharaoh’s arms will fall. Then they will know that I am Yahweh[b], when I put my sword into the hand of the king of Babylon and he stretches it out against the land of Egypt.
translation:
  language: ru
  text: Я укреплю руки царя Вавилона, а руки фараона падут[a]. Тогда они узнают, что Я — Яхве[b], когда Я вложу Мой меч в руку царя Вавилона и тот прострёт его против земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руки фараона ослабеют». Буквально: «падут»; этот образ передаёт военный крах.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское יהוה (YHWH) — личное имя Бога; здесь оно передано как «Яхве».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲזַקְתִּי
  choice: Я укреплю
  rationale: Каузативная порода глагола חזק выражает действие Яхве, придающего силу; «укреплю» естественно передаёт это значение и сохраняет военный контекст.
- source_word: זְרֹעוֹת
  choice: руки
  rationale: Сохранён конкретный телесный образ, метафорически обозначающий военную силу; он связывает укрепление царя Вавилона с падением рук фараона.
- source_word: וּזְרֹעוֹת פַּרְעֹה תִּפֹּלְנָה
  choice: а руки фараона падут
  rationale: Союз передан как противопоставление, очевидное из контекста. Буквальное «падут» сохраняет яркий образ военного краха, не заменяя его толкованием «ослабеют».
- source_word: וְיָדְעוּ
  choice: Тогда они узнают
  rationale: «Тогда» естественно выражает последующий результат описанного суда; неопределённое множественное подлежащее сохранено, поскольку в стихе оно прямо не названо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: בְּתִתִּי חַרְבִּי בְּיַד מֶלֶךְ בָּבֶל
  choice: когда Я вложу Мой меч в руку царя Вавилона
  rationale: Формулировка сохраняет образ меча Яхве, вручённого вавилонскому царю как орудию суда.
- source_word: וְנָטָה אוֹתָהּ
  choice: и тот прострёт его
  rationale: Глагол נטה передан близко к значению «простирать, протягивать». Указательное «тот» естественно обозначает царя Вавилона и устраняет возможную неясность русского подлежащего; местоимение «его» относится к мечу.
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: против земли Египта
  rationale: Предлог אֶל буквально задаёт направление, но в военном контексте «против» естественно выражает направленность враждебного действия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя YHWH. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Вавилон как орудие Божьего суда
  choice: Сохранён образ меча Яхве в руке царя Вавилона
  alternative: Передать лишь то, что Вавилон нападёт на Египет
  rationale: Еврейский текст прямо удерживает вместе Божью власть над судом и действие вавилонского царя; перевод не ослабляет ни одну из этих сторон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Конкретные образы «руки», «меч» и «падут» сохранены; форма «прострёт» выбрана ради точности образа и уместного библейского достоинства без общей архаизации.
