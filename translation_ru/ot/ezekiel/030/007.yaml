  text: וְ/נָשַׁ֕מּוּ בְּ/ת֖וֹךְ אֲרָצ֣וֹת נְשַׁמּ֑וֹת וְ/עָרָ֕י/ו בְּ/תוֹךְ עָרִ֥ים נַחֲרָב֖וֹת תִּֽהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/007.yaml
  text: They will be desolated among desolated lands[a], and its cities will be among ruined cities.
translation:
  language: ru
  text: Они будут опустошены среди опустошённых земель[a], и его города будут среди разрушенных городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посреди опустошённых земель ... посреди разрушенных городов».'
    reason: Лексема בְּתוֹךְ в обоих вхождениях может передаваться как «среди» или с более пространственным оттенком «посреди».
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: они будут опустошены
  rationale: Нифаль от שׁמם передаёт пассивное состояние как результат разорения; форма множественного числа сохранена без уточнения неявного субъекта.
- source_word: בְּתוֹךְ
  choice: среди
  rationale: Естественно передаёт нахождение внутри ряда подобных земель или городов, сохраняя возможность понимания «посреди».
- source_word: אֲרָצוֹת נְשַׁמּוֹת
  choice: опустошённых земель
  rationale: «Земли» обозначают территории или страны, а повтор корня שׁמם отражён повтором «опустошены — опустошённых».
- source_word: וְעָרָיו
  choice: а его города
  rationale: Суффикс 3-го лица мужского рода единственного числа относится к Египту; в русском названию «Египет» соответствует местоимение «его».
- source_word: עָרִים נַחֲרָבוֹת
  choice: разрушенных городов
  rationale: Причастная форма от חרב описывает города, обращённые в руины; «разрушенных» ясно отличает этот корень от שׁמם.
- source_word: תִּהְיֶינָה
  choice: окажутся
  rationale: В данном сравнительном построении «окажутся среди» естественно выражает будущее состояние, обозначенное היה.
theological_decisions:
- issue: Неявный субъект глагола וְנָשַׁמּוּ и переход к суффиксу единственного числа в וְעָרָיו
  choice: Сохранить «они» и затем «его», не отождествляя явно множественный субъект с Египтом.
  alternative: 'Сгладить согласование: «Египет будет опустошён… и его города…»'
  rationale: В еврейском тексте намеренно стоят глагол множественного числа и затем местоименный суффикс мужского рода единственного числа. Уточняющая перестройка устранила бы подлинную грамматическую напряжённость текста.
translation_notes:
  register: Современный литературный русский с торжественной пророческой сдержанностью. Лексический повтор «опустошены — опустошённых» сохранён ради соответствия повтору корня שׁמם; неоднозначное согласование оригинала не сглажено.
