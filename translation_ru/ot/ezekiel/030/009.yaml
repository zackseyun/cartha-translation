  text: בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֨וּ מַלְאָכִ֤ים מִ/לְּ/פָנַ/י֙ בַּ/צִּ֔ים לְ/הַחֲרִ֖יד אֶת כּ֣וּשׁ בֶּ֑טַח וְ/הָיְתָ֨ה חַלְחָלָ֤ה בָ/הֶם֙ בְּ/י֣וֹם מִצְרַ֔יִם כִּ֥י הִנֵּ֖ה בָּאָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/009.yaml
  text: On that day messengers will go out from before me in ships to terrify Cush[a], secure as she is, and trembling will come upon them on the day of Egypt, for behold[c][b], it is coming.
translation:
  language: ru
  text: В тот день посланники[a] выйдут от лица Моего на кораблях, чтобы устрашить Куш[b], пребывающий в безопасности. Его жителей охватит трепет в день Египта[c], ибо вот — близится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «вестники». Еврейское слово может также означать «ангелы», но здесь, вероятнее всего, имеются в виду люди, несущие весть о падении Египта.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Эфиопию». Куш — еврейское название древней страны к югу от Египта.'
    reason: alternative_reading
  - marker: c
    text: То есть в день, когда суд постигнет Египет.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאָכִים
  choice: посланники
  rationale: В контексте суда над народами речь, вероятнее всего, идёт о людях, несущих весть о падении Египта. «Посланники» сохраняет широту еврейского слова, не вводя здесь без необходимости значение «ангелы».
- source_word: מִלְּפָנַי
  choice: от Меня
  rationale: Еврейское выражение буквально означает «от Моего лица / из Моего присутствия». По-русски «от Меня» естественно передаёт исходящую от Бога миссию посланников, тогда как буквальная калька звучала бы архаично.
- source_word: בַּצִּים
  choice: на кораблях
  rationale: Слово обозначает суда; предлог естественно передаётся по-русски как способ передвижения — «на кораблях».
- source_word: לְהַחֲרִיד
  choice: чтобы устрашить
  rationale: Каузативная форма означает вызвать страх, дрожь или панику. «Устрашить» кратко и ясно передаёт эту силу.
- source_word: כּוּשׁ
  choice: Куш
  rationale: Сохранено еврейское название древней страны, поскольку отождествление с современной Эфиопией было бы географически неточным и излишне толковательным.
- source_word: בֶּטַח
  choice: чувствующий себя в безопасности
  rationale: 'Слово обозначает состояние безопасности или уверенности. Такая формулировка сохраняет иронию: даже спокойный и уверенный в своей защищённости Куш будет устрашён.'
- source_word: חַלְחָלָה
  choice: трепет
  rationale: Существительное выражает дрожь, содрогание или мучительный страх. «Трепет» передаёт одновременно телесную и эмоциональную реакцию.
- source_word: בָהֶם
  choice: их охватит
  rationale: Еврейское местоимение стоит во множественном числе и относится к людям Куша. Конструкция «их охватит трепет» естественно выражает наступление страха.
- source_word: בְּיוֹם מִצְרַיִם
  choice: в день Египта
  rationale: Сохранено сжатое и несколько загадочное выражение оригинала; в контексте оно указывает на день суда над Египтом.
- source_word: כִּי הִנֵּה בָּאָה
  choice: потому что вот — он наступает
  rationale: Частица הִנֵּה подчёркивает близость и несомненность события. Мужской род русского местоимения обусловлен словом «день», хотя еврейская форма женского рода может подразумевать наступающее бедствие.
theological_decisions:
- issue: Божественный источник пророческого суда
  choice: Посланники отправляются «от Меня», так что Господь остаётся непосредственным говорящим и источником миссии.
  alternative: 'Передать обезличенно: «отправятся посланники», без указания на исходящую от Бога миссию.'
  rationale: Форма מִלְּפָנַי прямо сохраняет первое лицо Божественного говорящего. Суд представлен не как безличный исторический процесс, а как действие, исходящее от Господа.
- issue: Референт в заключении «он наступает»
  choice: Местоимение связано с ближайшим выражением «день Египта».
  alternative: 'Понимать подразумеваемое существительное как «беда» или «кара» и переводить: «она уже близка».'
  rationale: Еврейский глагол женского рода допускает подразумеваемое бедствие, однако непосредственный контекст называет день Египта. Русский текст сохраняет эту связь, а примечание объясняет смысл дня.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; сохранены краткое выражение «день Египта», указание на Божественного говорящего и образ внезапного трепета. Архаизмы вроде «от лица Моего» не использованы.
