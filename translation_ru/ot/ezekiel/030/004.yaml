  text: וּ/בָאָ֥ה חֶ֨רֶב֙ בְּ/מִצְרַ֔יִם וְ/הָיְתָ֤ה חַלְחָלָה֙ בְּ/כ֔וּשׁ בִּ/נְפֹ֥ל חָלָ֖ל בְּ/מִצְרָ֑יִם וְ/לָקְח֣וּ הֲמוֹנָ֔/הּ וְ/נֶהֶרְס֖וּ יְסוֹדֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/004.yaml
  text: And a sword will come against Egypt[a], and there will be anguish in Cush, when the slain fall in Egypt, and they take away her wealth[c][b], and her foundations are torn down.
translation:
  language: ru
  text: И придёт меч на Египет, и в Куше[a] будет содрогание[b], когда в Египте падут убитые. Его богатство[c] унесут, и основания его будут разрушены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Куш — область к югу от Египта, в основном соответствующая древней Нубии; её не следует безоговорочно отождествлять с современной Эфиопией.
    reason: cultural_note
  - marker: b
    text: 'Или: «будет мучительный трепет». Еврейское слово может обозначать дрожь, содрогание или мучительное смятение перед лицом бедствия.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «его множество» или «его изобилие». Еврейское слово может обозначать население, многочисленность, изобилие или богатство; здесь оно понято как имущество, уносимое завоевателями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאָה חֶרֶב בְּמִצְרַיִם
  choice: придёт меч на Египет
  rationale: Пророческий перфект передан будущим временем. Образ меча сохранён как обозначение войны и вражеского нашествия; сочетание «на Египет» естественно выражает направленность удара.
- source_word: וְהָיְתָה חַלְחָלָה
  choice: будет содрогание
  rationale: «Содрогание» сохраняет телесный и эмоциональный оттенки еврейского слова, которое может обозначать дрожь, мучительное корчение или ужас перед бедствием.
- source_word: בְּכוּשׁ
  choice: в Куше
  rationale: Историческое название передано транслитерацией, без отождествления с современным государством Эфиопия.
- source_word: בִּנְפֹל חָלָל
  choice: когда падут убитые
  rationale: Инфинитивная конструкция передана временным придаточным; военный термин חָלָל здесь означает павших, убитых.
- source_word: וְלָקְחוּ הֲמוֹנָהּ
  choice: его богатство унесут
  rationale: הָמוֹן допускает значения «множество», «изобилие» и «богатство». В контексте завоевания выбран смысл захватываемой добычи; неопределённый деятель сохранён формой третьего лица множественного числа.
- source_word: וְנֶהֶרְסוּ יְסוֹדֹתֶיהָ
  choice: основания его будут разрушены
  rationale: Страдательная форма исходного текста сохранена. Образ оснований допускает как буквальное, так и переносное понимание.
