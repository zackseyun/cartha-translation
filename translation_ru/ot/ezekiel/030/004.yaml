  source_fidelity: 'Текст точно передаёт последовательность еврейского оригинала: грядущее вторжение («меч» на Египет), потрясение в Куше, падение убитых в Египте, унесение его богатства и разрушение его оснований. «На Египет» уместно раскрывает враждебную направленность בְּמִצְרַיִם в данном контексте, не добавляя нового содержания. Неопределённый субъект глагола «унесут» обоснованно сохранён.'
  naturalness: Перевод звучит естественно и достойно в современном литературном русском, с надлежащей пророческой сжатостью. «Содрогание» и «падут убитые» несколько возвышенны, но не архаичны и хорошо соответствуют жанру.
  terminology: Историческое имя «Куш» передано последовательно и снабжено аккуратным пояснением, не смешивающим древний регион с современным государством. «Меч», «богатство» и «основания» сохраняют образность и широту исходного текста. Примечание к «богатству» корректно отмечает лексическую многозначность הֲמוֹנָהּ, не выдавая спорный оттенок за единственно возможный.
