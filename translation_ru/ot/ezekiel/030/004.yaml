  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; образные выражения «меч», «падут убитые» и «основания» сохранены. Женские местоименные суффиксы еврейского названия Египта переданы мужским родом согласно русской грамматике.
