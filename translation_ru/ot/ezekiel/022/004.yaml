  to: Из-за крови, которую ты пролила, ты стала виновной, и из-за идолов[a], которых ты сделала, ты осквернилась. Ты приблизила свои дни и достигла своих лет[b]. Поэтому Я сделал тебя предметом поношения для народов и объектом насмешек для всех стран.
  rationale: Правка устраняет добавленную каузативность в передаче «осквернилась», делает связь с идолами явной посредством естественного для русского «из-за» и различает «поношение» и «насмешки». Сноски поставлены у соответствующих слов и поясняют соответственно уничижительный термин и неоднозначную временную формулу, не превращая вероятное толкование в основной текст.
