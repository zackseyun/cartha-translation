  text: בְּ/דָמֵ֨/ךְ אֲשֶׁר שָׁפַ֜כְתְּ אָשַׁ֗מְתְּ וּ/בְ/גִלּוּלַ֤יִ/ךְ אֲשֶׁר עָשִׂית֙ טָמֵ֔את וַ/תַּקְרִ֣יבִי יָמַ֔יִ/ךְ וַ/תָּב֖וֹא עַד שְׁנוֹתָ֑יִ/ךְ עַל כֵּ֗ן נְתַתִּ֤י/ךְ חֶרְפָּה֙ לַ/גּוֹיִ֔ם וְ/קַלָּסָ֖ה לְ/כָל הָ/אֲרָצֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/004.yaml
  text: By your blood that you have shed[a], you have become guilty, and by your idols that you have made, you have become unclean. You have brought your days near and have come to your years[b]. Therefore I have made you a reproach to the nations and a mockery to all the lands.
translation:
  language: ru
  text: Из-за крови, которую ты пролила, ты стала виновной, и из-за идолов[a], которых ты сделала, ты осквернилась. Ты приблизила свои дни и достигла своих лет[b]. Поэтому Я сделал тебя предметом поношения для народов и объектом насмешек для всех стран.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «идолы», имеет презрительную окраску и у Иезекииля служит уничижительным обозначением ложных богов.
    reason: cultural_note
  - marker: b
    text: Вероятно, речь о приближении назначенного Иерусалиму срока и наступлении времени суда. Образное выражение еврейского текста не называет суд прямо.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדָמֵךְ אֲשֶׁר שָׁפַכְתְּ
  choice: Из-за крови, которую ты пролила
  rationale: Предлог ב здесь имеет причинное значение; сочетание с «пролила» ясно выражает вину Иерусалима в кровопролитии и сохраняет образ крови.
- source_word: אָשַׁמְתְּ
  choice: ты стала виновной
  rationale: Передаёт наступившее вследствие кровопролития состояние виновности.
- source_word: גִלּוּלַיִךְ
  choice: идолами
  rationale: Это обычный для Иезекииля презрительный термин для ложных богов; нейтрально понятное «идолы» оставлено в основном тексте, а уничижительный оттенок отмечен в сноске.
- source_word: טָמֵאת
  choice: ты осквернила себя
  rationale: Русская возвратная конструкция естественно передаёт приобретённую нечистоту, вызванную изготовлением идолов; речь идёт о женском образе города.
- source_word: וַתַּקְרִיבִי יָמַיִךְ
  choice: Ты приблизила свои дни
  rationale: Сохраняет каузативное значение «приблизить» и намеренную образность еврейской фразы, не подставляя прямо «дни суда».
- source_word: וַתָּבֹוא עַד שְׁנוֹתָיִךְ
  choice: и достигла своих лет
  rationale: Близко передаёт идиоматическую и несколько неоднозначную параллельную фразу; вероятное указание на назначенный срок объяснено в сноске.
- source_word: חֶרְפָּה
  choice: посмешищем
  rationale: В контексте обозначает объект поношения и презрения среди народов; русская конструкция естественна после «сделал тебя».
- source_word: קַלָּסָה
  choice: предметом насмешек
  rationale: Передаёт публичное осмеяние и сохраняет смысловое усиление после «посмешищем».
- source_word: הָאֲרָצוֹת
  choice: стран
  rationale: В параллели с народами речь идёт о землях или странах, а не о земле как целом.
theological_decisions:
- issue: Характер вины и осквернения Иерусалима
  choice: Кровопролитие влечёт судебную виновность, а идолопоклонство — осквернение; обе пророческие категории сохранены.
  alternative: Свести осквернение лишь к обрядовой нечистоте либо понимать вину только метафорически.
  rationale: Еврейский текст параллельно предъявляет Иерусалиму конкретные обвинения в кровопролитии и идолопоклонстве, не позволяя устранить ни нравственно-судебное, ни культовое измерение.
- issue: Смысл приближения дней и достижения лет
  choice: Сохранить образную неоднозначность основного текста и пояснить вероятную связь с назначенным сроком суда в сноске.
  alternative: Прямо перевести как «ты ускорила наступление конца своих дней».
  rationale: Контекст указывает на приближение суда над Иерусалимом, однако слова «суд» и «конец» не выражены в еврейской фразе явно.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Иерусалим представлен как женщина, поэтому сохранены формы женского рода. Образная временная формула передана близко к источнику, а её вероятный смысл пояснён в сноске.
