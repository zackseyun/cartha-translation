lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт эмфатическое привлечение внимания естественным и современным русским словом.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: князья Израиля
  rationale: Сохраняет обозначение правящей знати и традиционную возвышенную лексику пророческого обличения; более общее «вожди» или «руководители» ослабило бы оттенок политического положения.
- source_word: אִישׁ לִזְרֹעוֹ
  choice: каждый по своей силе
  rationale: אִישׁ имеет распределительное значение «каждый», а «рука» здесь метонимически обозначает силу или власть. Русская формулировка сохраняет краткость и смысл еврейской идиомы.
- source_word: הָיוּ בָךְ
  choice: были в тебе
  rationale: Сохраняет прямое обращение к Иерусалиму в женском роде и глагольную конструкцию исходного текста.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: чтобы проливать кровь
  rationale: Передаёт целевое значение לְמַעַן без усиления до «были полны решимости» или «стремились», которого прямо нет в исходном тексте.
