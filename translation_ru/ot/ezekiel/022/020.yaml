  text: קְבֻ֣צַת כֶּ֡סֶף וּ֠/נְחֹשֶׁת וּ/בַרְזֶ֨ל וְ/עוֹפֶ֤רֶת וּ/בְדִיל֙ אֶל תּ֣וֹךְ כּ֔וּר לָ/פַֽחַת עָלָ֥י/ו אֵ֖שׁ לְ/הַנְתִּ֑יךְ כֵּ֤ן אֶקְבֹּץ֙ בְּ/אַפִּ֣/י וּ/בַ/חֲמָתִ֔/י וְ/הִנַּחְתִּ֥י וְ/הִתַּכְתִּ֖י אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/020.yaml
  text: As silver and bronze and iron and lead and tin are gathered into the midst of a furnace[a], to blow fire on it in order to melt it, so I will gather you in my anger and in my wrath[b], and I will place you there and melt you.
translation:
  language: ru
  text: Как серебро, бронзу[a], железо, свинец и олово собирают в плавильную печь, чтобы раздувать в ней огонь и расплавить их, так Я соберу вас в гневе Моём и ярости Моей, помещу вас туда и расплавлю вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «медь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «переплавлю вас»; глагол продолжает образ плавильной печи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְבֻצַת
  choice: как ... собирают
  rationale: Отглагольное существительное вводит сравнение, завершённое כֵּן; безличная русская конструкция естественно передаёт процесс собирания металлов, не добавляя определённого действующего лица.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В библейских перечнях металлов слово часто обозначает бронзу; значение «медь» остаётся возможным и отмечено в сноске.
- source_word: אֶל־תּוֹךְ כּוּר
  choice: в плавильную печь
  rationale: כּוּר — печь для плавки металла; русское выражение передаёт назначение и внутреннее пространство печи без тяжеловесного «в середину».
- source_word: לָפַחַת עָלָיו אֵשׁ
  choice: чтобы раздуть на них огонь
  rationale: Сохраняется образ направленного на собранные металлы огня; множественное местоимение естественно согласуется с перечнем металлов.
- source_word: לְהַנְתִּיךְ / וְהִתַּכְתִּי
  choice: расплавить / расплавлю
  rationale: Повтор одного русского корня сохраняет словесную перекличку и суровый образ плавки; возможный оттенок «переплавить» отмечен в сноске.
- source_word: בְּאַפִּי וּבַחֲמָתִי
  choice: в гневе Моём и ярости Моей
  rationale: Переданы два накапливающихся обозначения Божьего негодования без сглаживания их интенсивности.
- source_word: וְהִנַּחְתִּי
  choice: оставлю вас там
  rationale: Форма от נוח допускает смысл «помещу» или «оставлю»; в последовательности собирания и плавки «оставлю вас там» звучит естественно и сохраняет возможную неоднозначность.
theological_decisions:
- issue: Характер образа плавильной печи
  choice: 'Сохранён образ карательного суда: «соберу вас... и расплавлю вас».'
  alternative: 'Передать как очищение или испытание: «очищу вас», «испытаю вас».'
  rationale: Ближайший контекст говорит прежде всего о суде над Иерусалимом; замена плавления очищением неоправданно смягчила бы текст.
- issue: Два обозначения Божьего негодования
  choice: «в гневе Моём и ярости Моей»
  alternative: Объединить в одно выражение, например «в великом гневе».
  rationale: Раздельная передача сохраняет риторическое усиление еврейского текста и не ослабляет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Синтаксис сравнения сохранён, но формулировки сделаны понятными обычному читателю; образ суда не смягчён.
