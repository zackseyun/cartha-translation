base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/015.yaml
  text: I will scatter you among the nations and disperse you through the lands[a], and I will purge your uncleanness from you.
translation:
  language: ru
  text: Я рассею тебя среди народов, развею по разным землям и положу конец[a] твоей нечистоте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удалю из тебя твою нечистоту»; возможно также: «истреблю твою нечистоту».'
    reason: Еврейский глагол допускает значения доведения до конца, полного удаления или истребления, а предлог буквально означает «от тебя».
lexical_decisions:
- source_word: וַהֲפִיצוֹתִי
  choice: Я рассею
  rationale: Глагол выражает рассеяние как суд и изгнание; «рассею» естественно передаёт этот образ в современном русском языке.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Речь идёт о чужих народах, среди которых окажется олицетворённый Иерусалим; такой перевод точен и не вносит лишней конфессиональной окраски.
- source_word: וְזֵרִיתִיךְ
  choice: развею
  rationale: זרה может означать «веять» или «рассеивать». «Развею» сохраняет образ и параллелизм, не повторяя дословно предыдущий глагол.
- source_word: בָּאֲרָצוֹת
  choice: по разным землям
  rationale: Множественное число указывает на широкое географическое рассеяние; добавление «разным» естественно выражает распределение по многим землям.
- source_word: וַהֲתִמֹּתִי
  choice: положу конец
  rationale: Каузативная форма от תמם означает доведение до конца или прекращение. Этот перевод сохраняет широту значения и не делает очищение более явным, чем в еврейском тексте.
- source_word: טֻמְאָתֵךְ
  choice: твоей нечистоте
  rationale: Слово может обозначать ритуальную и нравственную нечистоту; «нечистота» сохраняет обе стороны значения.
- source_word: מִמֵּךְ
  choice: твоей нечистоте
  rationale: Предлог буквально означает «от тебя». В основной формулировке его смысл естественно включён в конструкцию «положу конец твоей нечистоте»; буквальная связь отражена в примечании.
theological_decisions:
- issue: Характер очищения посредством суда
  choice: «положу конец твоей нечистоте»
  alternative: «удалю из тебя твою нечистоту» или «истреблю твою нечистоту»
  rationale: Еврейская фраза связывает рассеяние и прекращение нечистоты, но не уточняет, является ли очищение нравственным, обрядовым или метафорическим. Формулировка сохраняет напряжение между карающим и очищающим действием суда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Женский род местоимения подразумевает олицетворённый Иерусалим. Пара «рассею — развею» сохраняет поэтический параллелизм еврейского текста.
