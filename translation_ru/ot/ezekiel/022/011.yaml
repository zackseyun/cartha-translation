source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֶת אֵ֣שֶׁת רֵעֵ֗/הוּ עָשָׂה֙ תּֽוֹעֵבָ֔ה וְ/אִ֥ישׁ אֶת כַּלָּת֖/וֹ טִמֵּ֣א בְ/זִמָּ֑ה וְ/אִ֛ישׁ אֶת אֲחֹת֥/וֹ בַת אָבִ֖י/ו עִנָּה בָֽ/ךְ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/011.yaml
  text: One man commits an abomination with his neighbor’s wife[a], another defiles his daughter-in-law with lewdness, and another violates his sister, his father’s daughter[c][b], within you.
translation:
  language: ru
  text: Один совершает мерзость с женой своего ближнего[a], другой оскверняет свою невестку развратом[b], а третий надругается над своей сестрой, дочерью своего отца[c], в тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делает мерзость с женой своего ближнего»; возможно также: «совершает отвратительный поступок с женой своего ближнего».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «постыдным распутством»; еврейское слово обозначает злонамеренное, постыдное сексуальное поведение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «унижает» либо «насилует». Еврейский глагол в сексуальном контексте может обозначать сексуальное надругательство, сопряжённое с унижением и жестоким обращением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: один… другой… а третий
  rationale: Троекратное וְאִישׁ перечисляет отдельных виновников; такая конструкция естественно передаёт повтор в современном русском языке.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: женой своего ближнего
  rationale: רֵעַ обозначает ближнего, товарища или соплеменника; «ближний» сохраняет широкий характер отношений.
- source_word: עָשָׂה תּוֹעֵבָה
  choice: совершает мерзость с
  rationale: Формулировка сохраняет буквальный образ «делать мерзость» и сильную нравственную оценку, не сводя выражение к нейтральному обозначению прелюбодеяния.
- source_word: כַלָּתוֹ
  choice: свою невестку
  rationale: Обычное и точное русское обозначение жены сына.
- source_word: טִמֵּא
  choice: оскверняет
  rationale: Передаёт одновременно нравственный и культовый оттенки нечистоты в данном сексуальном контексте.
- source_word: בְזִמָּה
  choice: развратом
  rationale: זִמָּה здесь обозначает постыдное сексуальное беззаконие; «разврат» естественно и достаточно сильно передаёт этот смысл.
- source_word: אֲחֹתוֹ בַת אָבִיו
  choice: свою сестру, дочь своего отца
  rationale: Сохранена юридически значимая аппозиция исходного текста без уточнения «единокровную», которое могло бы сузить неоднозначную формулировку.
- source_word: עִנָּה
  choice: насилует
  rationale: В сексуальном контексте глагол выражает не только связь, но унижение и надругательство; «насилует» ясно передаёт тяжесть нарушения, хотя степень явно выраженного принуждения остаётся предметом толкования.
- source_word: בָּךְ
  choice: у тебя
  rationale: Местоимение женского рода обращено к олицетворённому Иерусалиму; «у тебя» естественно по-русски указывает на происходящее внутри города.
theological_decisions:
- issue: Нравственная сила обозначений сексуальных преступлений
  choice: Сохранены сильные слова «мерзость», «оскверняет», «насилует».
  alternative: Смягчённые формулировки вроде «вступает в связь» или «поступает безнравственно».
  rationale: Еврейский текст представляет эти действия как тяжкие проявления заветного и общественного разложения; нейтральные эвфемизмы ослабили бы обвинительный характер стиха.
- issue: Степень принуждения в עִנָּה
  choice: «насилует» с примечанием о диапазоне значения
  alternative: «унижает», «надругается над» или нейтральное «вступает в связь с»
  rationale: Контекст кровосмесительного сексуального преступления и семантика унижения поддерживают сильный перевод, но сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обвинения. Синтаксический ряд «один… другой… а третий» делает перечисление ясным; сильная нравственная лексика исходного текста сохранена. Все сноски отмечены в основном тексте.
