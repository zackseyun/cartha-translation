base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/025.yaml
  text: 'A conspiracy of her prophets is in her midst[a], like a roaring lion tearing prey: they have devoured lives, they take wealth and precious things, they have multiplied her widows in her midst.'
translation:
  language: ru
  text: 'В ней — заговор её пророков, словно рыкающий лев, терзающий добычу: они пожирают людей[a], забирают богатство и драгоценности, умножают в ней число вдов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пожирают жизни»; буквальнее: «пожирают души». Еврейское не́феш часто означает живого человека или жизнь, а не только нематериальную душу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר
  choice: заговор
  rationale: Существительное обозначает заговорщический союз или совместный преступный умысел; «заговор» прямо и естественно передаёт этот смысл.
- source_word: נְבִיאֶיהָ
  choice: её пророков
  rationale: Форма с суффиксом 3-го лица женского рода указывает на пророков города, олицетворённого как женщина.
- source_word: בְּתוֹכָהּ
  choice: среди неё
  rationale: Сохранены женский образ города и повтор, обрамляющий стих; оборот намеренно слегка возвышенный, но понятный.
- source_word: כַּאֲרִי שׁוֹאֵג טֹרֵף טָרֶף
  choice: словно рыкающий лев, терзающий добычу
  rationale: Передаёт хищный образ и сочетание причастия с однокоренным дополнением без неестественной для русского тавтологии.
- source_word: נֶפֶשׁ אָכָלוּ
  choice: они пожирают жизни
  rationale: נֶפֶשׁ здесь означает жизнь или живого человека; «жизни» сохраняет метафору пожирания и не навязывает узкого представления о нематериальной душе.
- source_word: חֹסֶן וִיקָר
  choice: богатство и драгоценности
  rationale: В контексте грабежа первое слово обозначает материальное достояние, а второе — ценные вещи; эта пара естественна в современном русском.
- source_word: יִקָּחוּ
  choice: забирают
  rationale: Имперфект описывает характерное действие; «забирают» в данном контексте яснее передаёт присвоение, не усиливая глагол до явно не выраженного «похищают».
- source_word: אַלְמְנוֹתֶיהָ הִרְבּוּ
  choice: умножают число вдов
  rationale: Русская конструкция ясно передаёт буквальный образ увеличения числа вдов вследствие насилия и звучит естественнее, чем «умножают её вдов».
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте суда и насилия
  choice: жизни
  alternative: души; людей
  rationale: Речь идёт об убийственном насилии над живыми людьми, а не о специальном учении о нематериальной душе. Основной текст сохраняет образ пожирания жизней, а сноска отмечает допустимые соответствия.
- issue: Референт женского суффикса в «её пророков» и «среди неё»
  choice: сохранить женское олицетворение города
  alternative: 'эксплицировать: «в городе»'
  rationale: Так сохраняются грамматический образ и повтор исходного текста без добавления отсутствующего в стихе существительного.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены резкая львиная метафора, женское олицетворение города и начально-конечный повтор «среди неё»; синтаксис слегка упорядочен для ясности.
