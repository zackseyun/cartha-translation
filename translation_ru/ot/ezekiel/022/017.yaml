  text: 'И пришло ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH); традиционно передаётся «Господь».
    reason: Указывает написание Божьего имени в еврейском тексте, его транслитерацию и традиционную переводческую замену.
lexical_decisions:
- source_word: וַיְהִי
  choice: И пришло
  rationale: Последовательная форма глагола היה вводит новое пророческое сообщение; вместе с существительным «слово» естественно передаётся по-русски формулой «И пришло… слово».
- source_word: דְבַר
  choice: слово
  rationale: В устойчивом пророческом выражении דְבַר יְהוָה слово «слово» сохраняет лексическую прозрачность и формульный характер Божьего откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Естественный русский эквивалент предлога с суффиксом первого лица единственного числа.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь; в современном русском эту функцию естественно и точно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» передаёт имя, не заменяя его титулом; традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой и торжественной пророческой формулы. Двоеточие естественно вводит речь следующего стиха.
