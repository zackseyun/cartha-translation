  text: I will gather you[a], and I will blow on you with the fire of my wrath, and you will be melted within it.
translation:
  language: ru
  text: Я соберу вас, обдам вас огнём Моего гнева, и вы расплавитесь там[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «внутри неё». Местоимение может указывать на город в более широком контексте или на плавильный горн в образе переплавки.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִנַּסְתִּי
  choice: Я соберу
  rationale: Глагол означает собирание людей в одном месте для суда и продолжает образ плавильного горна; «соберу» естественно и не добавляет лишнего толкования.
- source_word: נָפַחְתִּי עֲלֵיכֶם
  choice: раздую над вами
  rationale: נפח обозначает дуть или раздувать; в металлургическом образе речь идёт о раздувании огня. «Над вами» передаёт עַל и сохраняет направленность действия без чрезмерно буквального и менее естественного «дуну на вас».
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: огонь Моего гнева
  rationale: אֵשׁ — «огонь», а עֶבְרָה — сильный, переполняющий гнев. В сочетании с «раздую» русский винительный падеж естественно выражает объект действия, сохраняя образ огня как проявления Божьего гнева.
- source_word: נִתַּכְתֶּם
  choice: вы расплавитесь
  rationale: В контексте обработки металла נתך означает плавиться, становиться жидким. «Расплавитесь» ясно и естественно передаёт результат действия, не вводя более технического термина.
- source_word: בְּתוֹכָהּ
  choice: в нём
  rationale: Местоименный суффикс женского рода допускает связь как с городом, так и с плавильной средой в развёрнутой метафоре. Русское «в нём» грамматически соотносится с ближайшим «огнём», поэтому неоднозначность исходного указания дополнительно отмечена в сноске.
theological_decisions:
- issue: К чему относится местоименный суффикс в בְּתוֹכָהּ
  choice: В основном тексте оставить местоименное «в нём», а неоднозначность пояснить в сноске.
  alternative: «в городе» или «в плавильном горне»
  rationale: Контекст намеренно совмещает Иерусалим и плавильный горн. Прямое называние одного референта устранило бы сохраняющееся в еврейском тексте метафорическое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка сохраняет конкретный металлургический образ и не конкретизирует окончательно референт בְּתוֹכָהּ; прописная буква в «Моего» следует принятой русской библейской традиции обозначения речи Бога.
