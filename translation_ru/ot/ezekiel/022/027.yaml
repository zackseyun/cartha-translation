  terminology: «Князья» оправданно сохраняет политический вес שָׂרֶיהָ. «Людей» не навязывает представления о нематериальных душах; сноска сохраняет варианты «жизни» и «души». «Нечестная нажива» передаёт корыстную, неправедную выгоду без конфессионального истолкования.
