base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/027.yaml
  text: Her princes within her are like wolves tearing prey[a], to shed blood, to destroy lives[b], in order to gain dishonest profit.
translation:
  language: ru
  text: 'Её князья в её среде — как волки, терзающие добычу: они проливают кровь и губят людей[a] ради нечестной наживы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «губят жизни» или «губят души». Еврейское слово נֶפֶשׁ в зависимости от контекста может означать человека, жизнь или душу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради неправедной выгоды»; возможно также: «чтобы нажиться грабежом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: князья её
  rationale: Слово שַׂר обозначает князя, правителя или высокопоставленного начальника; «князья» сохраняет политический и возвышенный оттенок пророческого обличения.
- source_word: בְקִרְבָּהּ
  choice: среди неё
  rationale: Буквально «в её среде»; выражение указывает, что правители находятся внутри города или общины, представленной как женщина.
- source_word: כִזְאֵבִים טֹרְפֵי טָרֶף
  choice: как волки, терзающие добычу
  rationale: Сравнение и сочетание однокоренных слов передают яркий образ хищнического насилия; по-русски «терзающие добычу» звучит естественно и выразительно.
- source_word: לִשְׁפָּךְ דָּם
  choice: проливают кровь
  rationale: Устойчивый библейский оборот означает насильственное убийство. Русская личная форма естественно раскрывает действие, выраженное еврейским инфинитивом при образе волков.
- source_word: לְאַבֵּד נְפָשׁוֹת
  choice: губят жизни
  rationale: В данном контексте נְפָשׁוֹת означает человеческие жизни или самих людей, а не обязательно нематериальные души; «губят жизни» сохраняет конкретность обвинения.
- source_word: לְמַעַן בְּצֹעַ בָּצַע
  choice: чтобы нажиться нечестным путём
  rationale: לְמַעַן выражает цель, а сочетание от корня בצע подчёркивает корыстную, неправедную выгоду. «Нажиться» передаёт жадную корысть, а уточнение — её нравственно порочный характер.
theological_decisions:
- issue: Значение נְפָשׁוֹת в контексте суда и общественного насилия
  choice: «жизни», то есть человеческие жизни
  alternative: «души» или «людей»
  rationale: Контекст говорит о кровопролитии и насильственной деятельности правителей. Перевод «жизни» не превращает стих в утверждение о природе души, но сноска сохраняет реальный диапазон еврейского слова.
- issue: Связь инфинитивов לִשְׁפָּךְ и לְאַבֵּד с образом волков
  choice: 'передать как последовательные действия: «они проливают… губят…»'
  alternative: «чтобы проливать кровь, чтобы губить жизни»
  rationale: Еврейские инфинитивы могут указывать на характерное действие или цель. Русская личная конструкция естественнее и сохраняет последовательность обвинений, тогда как конечная цель ясно обозначена отдельным לְמַעַן — корыстная нажива.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены женские местоимения, относящиеся к городу или общине; образ хищных волков передан без архаизмов. Двоеточие делает ясным, что последующие действия раскрывают сравнение.
