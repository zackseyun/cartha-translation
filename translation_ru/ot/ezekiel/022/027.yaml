  source_fidelity: Перевод верно передаёт образ правителей как хищных волков, кровопролитие, гибель людей и корыстный мотив. Однако «среди неё» при отсылке к городу звучит менее точно и естественно, чем «в её среде», а «нажиться нечестным путём» переносит акцент с неправедной выгоды (בָּצַע) на способ её получения. «Губят людей» точнее и естественнее передаёт נְפָשׁוֹת в контексте насилия.
