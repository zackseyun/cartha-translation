source:
  edition: WLC
  text: קָדָשַׁ֖/י בָּזִ֑ית וְ/אֶת שַׁבְּתֹתַ֖/י חִלָּֽלְתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/008.yaml
  text: You have despised my holy things[a], and you have profaned my Sabbaths.
translation:
  language: ru
  text: Ты презрела Мои святыни[a] и осквернила Мои субботы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мои святилища»; «Мои святые места». Еврейское слово может обозначать священные места более конкретно, но здесь переведено шире: «Мои святыни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדָשַׁי
  choice: Мои святыни
  rationale: Форма множественного числа с суффиксом 1-го лица означает то, что свято и принадлежит Богу. Русское «святыни» сохраняет широкий смысл и не ограничивает речь одним храмом или святыми местами.
- source_word: בָּזִית
  choice: ты презрела
  rationale: Глагол выражает презрение и пренебрежение. Женский род соответствует обращению к Иерусалиму в ближайшем контексте.
- source_word: שַׁבְּתֹתַי
  choice: Мои субботы
  rationale: Множественное число с суффиксом 1-го лица прямо передаёт заветный и культовый термин.
- source_word: חִלָּלְתְּ
  choice: осквернила
  rationale: Пиэль глагола חלל означает лишить священного статуса, обойтись со святым как с обычным. «Осквернила» естественно и точно передаёт это обвинение по-русски.
theological_decisions:
- issue: Объём значения קָדָשַׁי
  choice: широкое обозначение принадлежащих Богу святынь
  alternative: конкретное указание на святилища или святые места Бога
  rationale: Еврейское множественное число допускает широкий собирательный смысл. «Мои святыни» сохраняет эту открытость и не сводит значение исключительно к храму.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой пророческого обвинения. Заглавные буквы в «Мои» отражают традиционное русское оформление местоимения, относящегося к Богу; женский род глаголов передаёт обращение к Иерусалиму.
