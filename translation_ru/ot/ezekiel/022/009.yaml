lexical_decisions:
- source_word: אַנְשֵׁי רָכִיל
  choice: клеветники
  rationale: Сочетание буквально обозначает «людей клеветы» — тех, кто распространяет порочащие сведения или обвинения. «Клеветники» естественно звучит по-русски и сохраняет нравственно-правовой оттенок контекста, не сужая значение исключительно до официальных доносчиков.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: чтобы проливать кровь
  rationale: Конструкция выражает цель или следствие; оборот сохраняет конкретную пророческую идиому, обозначающую убийственное насилие.
- source_word: וְאֶל הֶהָרִים אָכְלוּ
  choice: на горах у тебя ели
  rationale: Перевод сохраняет образ исходного текста и повторное обращение к олицетворённому Иерусалиму. Культовый смысл трапез на высотах разъяснён в сноске, а не внесён непосредственно в текст.
- source_word: זִמָּה
  choice: распутство
  rationale: Слово может обозначать постыдное злодеяние, часто сексуального характера. В данном перечне грехов «распутство» передаёт вероятный сексуально-нравственный смысл, не устраняя более широкого оттенка бесстыдной мерзости.
- source_word: עָשׂוּ בְתוֹכֵךְ
  choice: среди тебя творили
  rationale: С абстрактным дополнением עשה означает «делать, совершать». Формулировка естественна по-русски и сохраняет обращение к Иерусалиму как к городу, внутри которого совершается зло.
theological_decisions:
- issue: Культовый характер еды на горах
  choice: Сохранить буквальный образ в основном тексте и пояснить вероятную связь с языческим культом в сноске.
  alternative: 'Перевести прямо: «ели у святилищ на высотах».'
  rationale: Сам стих говорит о еде на горах, а культовый характер подразумевается контекстом. Сноска передаёт историко-религиозный смысл, не превращая вероятную импликацию в явное содержание текста.
- issue: Смысл זִמָּה
  choice: «распутство» с указанием более широкого значения в сноске.
  alternative: «мерзость» или «злодеяние».
  rationale: Ближайший контекст главы содержит сексуальные преступления, поэтому сексуально-нравственный оттенок вероятен; однако сноска сохраняет присущую слову более широкую возможность значения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и прямое обращение к олицетворённому Иерусалиму сохранены; архаизмы и конфессионально окрашенная терминология не используются.
