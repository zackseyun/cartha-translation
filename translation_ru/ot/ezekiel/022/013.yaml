base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/013.yaml
  text: And behold[a], I strike my hand against your unjust gain that you have made[b], and against the bloodshed that has been in your midst.
translation:
  language: ru
  text: И вот, Я бью в ладоши в негодовании из-за твоей неправедной наживы[a], которую ты нажила, и из-за кровопролития[b], которое было среди тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесчестной прибыли» или «алчности». Еврейское слово может обозначать выгоду, добытую несправедливостью или насилием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вины за пролитую кровь». Еврейское слово «кровь» может собирательно обозначать кровопролитие и связанную с ним вину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет вводную частицу, привлекающую внимание и придающую пророческому заявлению живость.
- source_word: הִכֵּיתִי כַפִּי
  choice: Я ударяю ладонью
  rationale: Сохраняет конкретный антропоморфный жест негодования и суда. Перфект передан ярким настоящим временем; «ладонью» точнее отражает כף, не превращая жест в аплодисменты.
- source_word: אֶל
  choice: из-за
  rationale: В русском сочетание «ударять ладонью против наживы» неестественно; «из-за» ясно связывает жест негодования с названными преступлениями, сохраняя обвинительный смысл контекста.
- source_word: בִּצְעֵךְ
  choice: твоей неправедной наживы
  rationale: בצע обозначает выгоду, нередко приобретённую насилием или несправедливостью. «Неправедная нажива» передаёт как материальный, так и нравственный оттенок.
- source_word: אֲשֶׁר עָשִׂית
  choice: которую ты нажила
  rationale: Согласование в женском роде сохраняет обращение к Иерусалиму как к городу; глагол естественно сочетается с русским словом «нажива» и передаёт смысл приобретения.
- source_word: דָּמֵךְ
  choice: кровопролития
  rationale: Форма «кровь/крови» в пророческом обвинении собирательно обозначает совершённые убийства и связанную с ними вину. «Кровопролитие» ясно и естественно выражает этот смысл.
- source_word: אֲשֶׁר הָיוּ בְּתוֹכֵךְ
  choice: бывшего среди тебя
  rationale: Сохраняет указание на преступления, происходившие внутри города, к которому обращаются в женском роде.
theological_decisions:
- issue: Характер жеста Божьей руки при возвещении суда
  choice: «Я ударяю ладонью» — конкретный жест негодования и суда
  alternative: «Я хлопаю в ладоши» или отвлечённое «Я выражаю негодование»
  rationale: Перевод сохраняет антропоморфный образ, но не истолковывает жест как одобрительные аплодисменты и не устраняет его посредством абстрактной формулировки.
- issue: Смысл דָּמֵךְ в обвинении Иерусалима
  choice: кровопролитие
  alternative: твоя кровь; вина за кровь
  rationale: Контекст допускает связь как с убийствами, так и с виной за них. Основной текст называет совершённое насилие, а примечание сохраняет возможный оттенок кровной вины.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Женский род («нажила», «среди тебя») сохраняет обращение к Иерусалиму как к персонифицированному городу. Необычный образ удара ладонью намеренно сохранён, поскольку он значим в исходном тексте.
