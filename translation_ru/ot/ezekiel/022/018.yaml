id: EZK.22.18
reference: Ezekiel 22:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הָיוּ לִ֥/י בֵֽית יִשְׂרָאֵ֖ל ל/סוג כֻּלָּ֡/ם נְ֠חֹשֶׁת וּ/בְדִ֨יל וּ/בַרְזֶ֤ל וְ/עוֹפֶ֨רֶת֙ בְּ/ת֣וֹךְ כּ֔וּר סִגִ֥ים כֶּ֖סֶף הָיֽוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/018.yaml
  text: Son of man[a], the house of Israel has become dross to me; all of them are bronze and tin and iron and lead in the midst of a furnace; they are the dross of silver.
translation:
  language: ru
  text: Сын человеческий, дом Израиля стал для Меня шлаком; все они — медь[a], олово, железо и свинец внутри плавильной печи; они — шлак серебра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронза».'
    reason: Древнееврейское נְחֹשֶׁת может обозначать как медь, так и бронзу.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет характерную для Иезекииля древнееврейскую форму обращения и её узнаваемое библейское звучание.
- source_word: הָיוּ לִי
  choice: стал для Меня
  rationale: Передаёт наступившее состояние с точки зрения говорящего Бога; единственное число согласовано с собирательным выражением «дом Израиля».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет заветное и собирательное обозначение народа, не упрощая его до одного имени «Израиль».
- source_word: לְסוּג
  choice: шлаком
  rationale: Современное и понятное обозначение металлургических отходов, точно поддерживающее образ переплавки.
- source_word: כֻּלָּם
  choice: все они
  rationale: Явно передаёт охват всей названной общности.
- source_word: נְחֹשֶׁת
  choice: медь
  rationale: Обычное русское соответствие, уместное в перечне металлов; древнееврейское слово может также обозначать бронзу, что отражено в сноске.
- source_word: בְדִיל
  choice: олово
  rationale: Стандартное название данного металла в металлургическом контексте.
- source_word: בַרְזֶל
  choice: железо
  rationale: Прямое лексическое соответствие.
- source_word: עוֹפֶרֶת
  choice: свинец
  rationale: Прямое лексическое соответствие.
- source_word: בְּתוֹךְ כּוּר
  choice: внутри плавильной печи
  rationale: Передаёт как пространственное значение בְּתוֹךְ, так и специальное значение כּוּר — печи для плавки металла.
- source_word: סִגִים כֶּסֶף
  choice: шлак серебра
  rationale: 'Сохраняет конструкцию и смысл образа: Израиль уподоблен не драгоценному серебру, а отходам, отделяемым при его очистке.'
theological_decisions:
- issue: Отношение к Богу, выраженное местоимением לִי
  choice: «для Меня» без поясняющего расширения
  alternative: «предо Мной» или «в Моих глазах»
  rationale: Древнееврейский текст обозначает оценочное отношение Бога к Израилю, но не формулирует его подробнее; перевод не добавляет толкования.
- issue: Металлургическая метафора суда и очищения
  choice: Сохранён буквальный образ шлака, металлов и плавильной печи
  alternative: Передача общей характеристикой нравственной испорченности
  rationale: Богословская напряжённость стиха заключена в самом пророческом образе; разъясняющий пересказ ослабил бы его и преждевременно истолковал.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Технически понятное слово «шлак» предпочтено архаичному «изгарь»; пунктуация сохраняет тесную связь трёх частей металлургического образа.
