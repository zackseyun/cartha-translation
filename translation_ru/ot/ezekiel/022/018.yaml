  source_fidelity: Перевод точно передаёт обращение «Сын человеческий», собирательное «дом Израиля», оценочное «для Меня», образ металлургических отходов, перечень металлов, плавильную печь и заключительное «шлак серебра». Единственное число в «дом Израиля стал» естественно для русского собирательного выражения; последующее «все они» верно раскрывает множественность членов этого дома.
