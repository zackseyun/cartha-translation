  rationale: 'Исправлены формы лица в соответствии с еврейскими суффиксами третьего лица и восстановлена неблагоприятная направленность изготовления идолов. «Чтобы» сохранено: инфинитив с ל допускает целевое либо результативное прочтение, и перевод не снимает этой неоднозначности.'
