  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עִ֣יר שֹׁפֶ֥כֶת דָּ֛ם בְּ/תוֹכָ֖/הּ לָ/ב֣וֹא עִתָּ֑/הּ וְ/עָשְׂתָ֧ה גִלּוּלִ֛ים עָלֶ֖י/הָ לְ/טָמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/003.yaml
  text: 'And say, ‘Thus says the Lord GOD: O city that sheds blood in her midst, so that her time may come, and that makes idols against herself to defile herself!’'
translation:
  language: ru
  text: 'И скажи: «Так говорит Владыка ГОСПОДЬ: о город, проливающий кровь в своей среде, чтобы наступило его время, и делающий идолов против себя, чтобы осквернить себя!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Передаёт сочетание титула «Владыка» и личного имени Бога; написание «ГОСПОДЬ» прописными буквами традиционно отличает יהוה.
- source_word: עִיר שֹׁפֶכֶת דָּם
  choice: о город, проливающий кровь
  rationale: Причастная конструкция сохранена как прямое обращение; единственное число «кровь» естественно по-русски и соответствует דָּם.
- source_word: בְּתוֹכָהּ
  choice: посреди себя
  rationale: Сохраняет возвратную соотнесённость с олицетворённым городом, не сужая значение до отдельных жителей.
- source_word: לָבוֹא עִתָּהּ
  choice: чтобы пришло твоё время
  rationale: Инфинитив с ל допускает целевое или результативное понимание; «чтобы» сохраняет напряжение формулировки, а обращение требует второго лица.
- source_word: גִּלּוּלִים
  choice: идолов
  rationale: Контекстуально ясный эквивалент уничижительного обозначения культовых изображений; более буквальное «мерзости» было бы недостаточно определённым.
- source_word: עָלֶיהָ
  choice: себе
  rationale: В данном контексте выражает действие, обращённое против самого города или навлекающее на него вину; русское «себе» сохраняет эту направленность без чрезмерного истолкования.
- source_word: לְטָמְאָה
  choice: чтобы осквернить себя
  rationale: Передаёт инфинитивную конструкцию и ритуально-нравственный оттенок корня טמא.
theological_decisions:
- issue: Связь кровопролития с наступлением «времени» города
  choice: чтобы пришло твоё время
  alternative: так что пришло твоё время
  rationale: Еврейское לָבוֹא может обозначать цель или результат. Основной текст следует формальной целевой конструкции и не уточняет сверх источника, понимается ли «время» как срок суда.
- issue: Направленность изготовления идолов
  choice: делающий себе идолов
  alternative: делающий идолов против себя
  rationale: עָלֶיהָ допускает оттенок «на себе/для себя» и неблагоприятного действия «против себя». «Себе» звучит естественно и сохраняет саморазрушительную направленность в сочетании с последующим «осквернить себя».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим регистром. Олицетворённый город назван в мужском роде согласно русской грамматике, поэтому местоименные формы переведены вторым лицом мужского рода. Прямое обращение «о город» сохраняет риторическую силу еврейского текста.
