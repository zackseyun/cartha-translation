  yaml_path: translation/ot/ezekiel/022/031.yaml
  text: So I poured out my indignation on them[a]; with the fire of my wrath I consumed them. I have put their way on their own heads[c][b], declares the Lord GOD.
translation:
  language: ru
  text: Поэтому Я излил на них Моё негодование[a], огнём Моей ярости истребил их. Их путь Я возложил на их же головы[b], — возвещает Владыка Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой гнев». Еврейское слово обозначает сильное негодование, вызванное осуждаемым злом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их путь на их головы Я возложил». Это образ воздаяния: последствия их собственного поведения обратились на них самих.'
    reason: idiom_explanation
  - marker: c
    text: 'В еврейском тексте: אֲדֹנָי יְהוִה — «Владыка Яхве»; Яхве — личное имя Бога, обозначенное четырьмя согласными יהוה.'
    reason: divine_name
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: излил
  rationale: Сохраняет конкретную метафору глагола שׁפך («лить, изливать») и естественно сочетается с обозначением Божьего гнева.
- source_word: זַעְמִי
  choice: Моё негодование
  rationale: «Негодование» передаёт не просто эмоциональный гнев, но нравственно обусловленное и судебное возмущение, выраженное словом זַעַם.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: огнём Моей ярости
  rationale: Творительный падеж естественно передаёт инструментальное значение предлога בְּ; «огонь» сохраняет образ суда, а «ярость» — силу עֶבְרָה.
- source_word: כִּלִּיתִים
  choice: истребил их
  rationale: Порода пиэль глагола כלה здесь означает доведение до конца, уничтожение. «Истребил» сохраняет суровость судебного высказывания и хорошо согласуется с образом огня.
- source_word: דַּרְכָּם
  choice: их путь
  rationale: Сохранён собирательный единственный образ «пути» как образа поведения, а не заменён толкованием «поступки».
- source_word: בְּרֹאשָׁם נָתַתִּי
  choice: Я возложил на их же головы
  rationale: Формулировка близко сохраняет еврейский образ воздаяния, при котором собственный путь людей возвращается на них; частица «же» подчёркивает направленность последствий на самих виновных.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт устойчивую пророческую формулу авторитетного Божьего изречения современным и торжественным русским языком.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» различает титул אֲדֹנָי и личное имя יהוה, а «Яхве» открыто передаёт присутствующее в исходном тексте Божье имя.
theological_decisions:
- issue: Язык Божьего суда
  choice: Сохранить прямое указание на Божье негодование, ярость и уничтожающий суд.
  alternative: Смягчить выражения до «неудовольствия» и «наказания».
  rationale: Исходный текст намеренно использует сильные личные и судебные выражения; их смягчение ослабило бы смысл пророчества.
- issue: Образ воздаяния «на голову»
  choice: 'Сохранить непривычный, но понятный с примечанием образ: «их путь Я возложил на их же головы».'
  alternative: 'Полностью истолковать: «Я заставил их испытать последствия своих поступков».'
  rationale: Буквенный образ выражает воздаяние, но не уточняет его философскую или доктринальную схему; примечание помогает читателю, не устраняя метафору.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Этот вариант различает титул и личное Божье имя и избегает повторения «Господь Господь».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Синтаксис остаётся ясным для широкого читателя; непривычный еврейский образ «путь на головы» намеренно сохранён и пояснён в сноске. Заглавные буквы в местоимениях, относящихся к Богу, использованы как допустимая русская издательская конвенция.
