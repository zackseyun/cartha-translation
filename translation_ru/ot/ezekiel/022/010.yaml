  yaml_path: translation/ot/ezekiel/022/010.yaml
  text: In you they uncover a father's nakedness[c][b][a]; in you they violate a woman in her menstrual impurity.
translation:
  language: ru
  text: В тебе открывают наготу отца[a][b]; в тебе унижают женщину, находящуюся в состоянии менструальной нечистоты[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открывают наготу отца» — выражение библейского законодательства о недозволенных половых отношениях; ср. Лев 18:7.'
    reason: cross_reference
  - marker: b
    text: 'Или: «среди вас». Иерусалим олицетворён как женщина, поэтому буквально сказано: «в тебе».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «нечистую менструации»; речь идёт о женщине в состоянии ритуальной нечистоты, связанной с менструацией. Глагол «унижают» в этом контексте имеет сексуальный смысл, но не уточняет характера принуждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת אָב
  choice: наготу отца
  rationale: Сохранено буквальное выражение, принадлежащее языку библейских запретов на недозволенные половые отношения. Более конкретное «жену отца» устранило бы сохраняющуюся в данной формулировке неоднозначность.
- source_word: גִּלָּה
  choice: открывают
  rationale: Единственное число в еврейском тексте имеет неопределённо-коллективный смысл в ряду обвинений жителей Иерусалима; русское неопределённо-личное предложение естественно передаёт этот смысл. Настоящее время представляет обвинение как характерное для города поведение.
- source_word: בָךְ
  choice: в тебе
  rationale: Буквально сохранено обращение во втором лице женского рода к олицетворённому Иерусалиму. В данном контексте это также означает «среди твоих жителей».
- source_word: טְמֵאַת הַנִּדָּה
  choice: женщину во время её менструальной нечистоты
  rationale: Формулировка ясно выражает подразумеваемую женщину и сохраняет культовое понятие нечистоты, связанной с менструацией, не сводя его к медицинскому описанию.
- source_word: עִנּוּ
  choice: насилуют
  rationale: В половом контексте глагол обозначает унижение и жестокое нарушение телесной неприкосновенности. «Насилуют» передаёт тяжесть деяния; более буквальное «унижают» по-русски не прояснило бы его сексуального характера.
theological_decisions:
- issue: Передача левитского выражения об открытии наготы
  choice: Сохранить в основном тексте выражение «открывают наготу отца», пояснив его в сноске.
  alternative: 'Передать истолкованно: «вступают в половую связь с женой отца» или «совершают кровосмешение».'
  rationale: Устойчивая формула связывает стих с запретами Лев 18:7 и сама по себе не называет конкретную женщину. Развёрнутый пересказ внёс бы в текст более узкое толкование.
- issue: Степень принуждения в עִנּוּ
  choice: Передать как «насилуют».
  alternative: «унижают» или «вступают в половую связь с».
  rationale: Контекст полового преступления и семантика глагола поддерживают значение насильственного унижения. При этом перевод не добавляет подробностей о форме насилия.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Юридико-библейский оборот «открывать наготу» намеренно оставлен ради межтекстовой связи и снабжён пояснением; остальные формулировки сделаны понятными обычному современному читателю.
