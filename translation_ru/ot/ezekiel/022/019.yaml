  text: 'Therefore thus says the Lord GOD: Because all of you have become dross[a], therefore behold, I am gathering you into the midst of Jerusalem.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Поскольку все вы стали шлаком[a], то вот, Я собираю вас в самое сердце Иерусалима».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «металлическими отходами» или «примесями». Еврейское слово обозначает ненужный материал, отделяемый от металла при плавке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента составного божественного титула: אֲדֹנָי как «Владыка», а личное имя יהוה — как «Яхве», не создавая повтора «Господь Господь».'
- source_word: יַעַן הֱיוֹת
  choice: За то, что… стали
  rationale: Оборот вводит основание предстоящего суда и указывает на наступившее состояние; такая формулировка естественна по-русски и сохраняет причинную связь.
- source_word: כֻּלְּכֶם
  choice: все вы
  rationale: Сохраняет явное указание на всю группу и форму второго лица множественного числа.
- source_word: לְסִגִים
  choice: шлаком
  rationale: Слово סִיגִים обозначает отходы или примеси, отделяемые от металла при плавке; «шлак» точно сохраняет металлургический образ контекста.
- source_word: הִנְנִי קֹבֵץ
  choice: вот, Я собираю
  rationale: «Вот» передаёт усилительную указательную формулу הִנְנִי, а настоящее время сохраняет живость причастной конструкции и выражает уже решённое, неотвратимое действие.
- source_word: אֶל תּוֹךְ יְרוּשָׁלִָם
  choice: внутрь Иерусалима
  rationale: Передаёт направительное אֶל и значение внутреннего пространства у תּוֹךְ, полнее, чем простое «в Иерусалим», и звучит естественно по-русски.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь; Господь Бог
  rationale: Вариант сохраняет различие между титулом אֲדֹנָי и личным именем יהוה, не подменяя имя общим титулом и не привнося дополнительное слово «Бог».
- issue: Временная сила הִנְנִי קֹבֵץ
  choice: вот, Я собираю
  alternative: вот, Я соберу
  rationale: Причастие при הִנְנִי может обозначать близкое и несомненное будущее; настоящее время сохраняет формальную живость высказывания, не исключая его направленности на предстоящее исполнение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Металлургический образ сохранён прямо; синтаксис сделан понятным без устранения emphатической формулы «вот» и без сглаживания направительного выражения «внутрь Иерусалима».
