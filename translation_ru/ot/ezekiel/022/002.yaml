id: EZK.22.2
reference: Ezekiel 22:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/תִשְׁפֹּ֥ט הֲ/תִשְׁפֹּ֖ט אֶת עִ֣יר הַ/דָּמִ֑ים וְ/ה֣וֹדַעְתָּ֔/הּ אֵ֖ת כָּל תּוֹעֲבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/002.yaml
  text: And you[a], son of man, will you judge, will you judge the bloody city? Then make known to her all her abominations.
translation:
  language: ru
  text: А ты, сын человеческий, будешь ли судить, будешь ли судить город кровопролития?[a] Тогда объяви ему все его мерзости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «город, виновный в пролитии крови»; буквально: «город кровей».'
    reason: Лексическое выражение עִיר הַדָּמִים может указывать как на кровопролитие, так и на вину за пролитую кровь.
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и форма еврейского выражения; в данном контексте оно подчёркивает человеческую природу пророка.
- source_word: הֲתִשְׁפֹּט הֲתִשְׁפֹּט
  choice: будешь ли судить, будешь ли судить
  rationale: Дословное повторение передаёт усиленный риторический вопрос еврейского текста.
- source_word: עִיר הַדָּמִים
  choice: город кровопролития
  rationale: Еврейское множественное דָּמִים («крови») здесь обозначает насильственное пролитие крови и, возможно, связанную с ним вину; выбранная формулировка естественна по-русски, а неоднозначность отмечена в сноске.
- source_word: וְהוֹדַעְתָּהּ
  choice: Тогда объяви ему
  rationale: Каузативная форма ידע означает «дать узнать, объявить». «Тогда» естественно связывает повеление с предшествующим риторическим вопросом.
- source_word: תּוֹעֲבוֹתֶיהָ
  choice: его мерзости
  rationale: «Мерзости» сохраняет сильную нравственно-религиозную окраску пророческого термина; мужской род местоимения обусловлен русским словом «город».
- source_word: כָּל
  choice: все
  rationale: Сохранено явно выраженное в исходном тексте значение полноты.
theological_decisions:
- issue: Значение בֶן אָדָם как постоянного обращения к пророку
  choice: сын человеческий
  alternative: смертный; человек
  rationale: Традиционная формула точно отражает строение еврейского выражения и обеспечивает последовательность в книге Иезекииля, не придавая обращению здесь позднейшего титульного смысла.
- issue: Смысл עִיר הַדָּמִים
  choice: город кровопролития
  alternative: город, виновный в пролитии крови
  rationale: Контекст допускает оттенки как совершаемого кровопролития, так и вины за кровь; основной текст не сужает выражение исключительно до одного из них, а сноска сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор риторического вопроса намеренно сохранён; согласование местоимений изменено с еврейского женского рода на русский мужской по слову «город».
