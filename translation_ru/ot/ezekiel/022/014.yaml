  source_fidelity: «Устоит ли твоё сердце» и «останутся ли крепкими твои руки» точно передают риторический параллелизм еврейского текста. Однако «когда Я поступлю с тобой» в современном русском недостаточно ясно выражает направленность грозящего действия; в данном контексте естественнее и точнее «когда Я буду действовать против тебя». Заключительное «и сделаю это» непосредственно передаёт וְעָשִׂיתִי и не сужает действие до исполнения только ранее сказанного.
  naturalness: Текст в целом литературен и сохраняет пророческую торжественность. «Буду действовать против тебя» звучит по-русски яснее, чем «поступлю с тобой», а «сказал — и сделаю это» образует естественную формулу заверения.
  terminology: «Яхве» последовательно передаёт יהוה. Образы «сердце» и «руки» сохранены; богословски нагруженных добавлений нет.
