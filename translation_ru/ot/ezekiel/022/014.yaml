  rationale: 'Уточнена русская передача эллиптического «когда Я делаю тебя»: «буду действовать против тебя» ясно отражает контекст суда, не навязывая технический термин «судить». «Сделаю это» передаёт завершающее божественное обещание действия без дополнительного смыслового сужения. Сноска не требуется: существенная неоднозначность в итоговом русском тексте не остаётся, а вариант не нуждается в отдельном пояснении.'
