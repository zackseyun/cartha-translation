  text: הֲ/יַעֲמֹ֤ד לִבֵּ/ךְ֙ אִם תֶּחֱזַ֣קְנָה יָדַ֔יִ/ךְ לַ/יָּמִ֕ים אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה אוֹתָ֑/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/014.yaml
  text: Will your heart endure[a], or will your hands remain strong, in the days when I deal with you? I, Yahweh, have spoken, and I will do it.
translation:
  language: ru
  text: Устоит ли твоё сердце и останутся ли крепкими твои руки в те дни, когда Я буду действовать против тебя? Я, Яхве, сказал — и сделаю это.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיַעֲמֹד לִבֵּךְ
  choice: Устоит ли твоё сердце
  rationale: Глагол עמד буквально означает «стоять», а здесь выражает способность выдержать грядущий суд. «Устоит» естественно передаёт этот смысл и сохраняет еврейский образ сердца как средоточия мужества и решимости.
- source_word: תֶּחֱזַקְנָה יָדַיִךְ
  choice: останутся ли крепкими твои руки
  rationale: Оборот обозначает сохранение силы и способности действовать. Перевод сохраняет телесный образ и параллелизм с сердцем.
- source_word: לַיָּמִים
  choice: в те дни
  rationale: Предлог имеет временное значение; указательное «те» естественно связывает дни с последующим определительным придаточным.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה אוֹתָךְ
  choice: когда Я поступлю с тобой
  rationale: Буквально эллиптическая конструкция «которые Я делаю тебя/с тобой» в контексте означает направленное против Иерусалима действие Бога. «Поступлю с тобой» сохраняет широту формулировки, не подменяя её более узким словом «судить».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: דִּבַּרְתִּי
  choice: сказал
  rationale: Совершенный вид передаёт уже произнесённое и непреложное Божье слово; в русском формула «Я сказал» звучит естественно и торжественно.
- source_word: וְעָשִׂיתִי
  choice: и исполню
  rationale: Форма перфекта в пророческой формуле выражает несомненность будущего совершения. «Исполню» ясно соотносит действие с ранее сказанным словом.
theological_decisions:
- issue: Характер действия Бога в אֲנִי עֹשֶׂה אוֹתָךְ
  choice: когда Я поступлю с тобой
  alternative: когда Я выступлю против тебя; когда Я буду судить тебя
  rationale: Контекст однозначно связан с наказанием, однако сам глагол широк по значению. Выбранный вариант передаёт угрожающий контекст, не добавляя к глаголу прямо не названного судебного термина.
- issue: Временное значение וְעָשִׂיתִי
  choice: и исполню
  alternative: и сделал; и сделаю
  rationale: Хотя морфологически употреблён перфект, заключительная пророческая формула заверяет в будущем исполнении уже произнесённого слова. Будущее время передаёт функцию формы, а «исполню» подчёркивает связь слова и действия.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной, но понятной пророческой речи. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому регистру. Риторический параллелизм «сердце — руки» сохранён.
