  text: Those who are near and those who are far from you will mock you[a], defiled of name[b], full of turmoil.
translation:
  language: ru
  text: Близкие к тебе и далёкие от тебя будут насмехаться над тобой — осквернённой именем[a], полной смуты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нечистая именем». Возможно также: «с запятнанным именем», «осквернившая своё имя», «чьё имя осквернено» или «с опороченной репутацией». Древнееврейское выражение предельно сжато.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полной смятения», «полной сумятицы» или «изобилующей беспорядком».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרֹבוֹת וְהָרְחֹקוֹת מִמֵּךְ
  choice: Близкие к тебе и далёкие от тебя
  rationale: Субстантивированные формы женского рода обозначают близкие и далёкие народы или города. Повтор предлога в русском ясно передаёт пространственное противопоставление, не добавляя конкретных субъектов.
- source_word: יִתְקַלְּסוּ בָךְ
  choice: будут насмехаться над тобой
  rationale: Глагол выражает насмешку и издевательство; русская предложная конструкция естественно передаёт сочетание глагола с ב.
- source_word: טְמֵאַת הַשֵּׁם
  choice: с запятнанным именем
  rationale: Сжатое древнееврейское выражение буквально связано с нечистотой имени; «запятнанное имя» естественно указывает на опороченную репутацию, а примечание сохраняет возможные варианты понимания.
- source_word: רַבַּת הַמְּהוּמָה
  choice: полной смуты
  rationale: רַבַּת обозначает изобилие или наполненность, а מְהוּמָה — смятение, беспорядок, шумную сумятицу. «Полной смуты» кратко сохраняет образ и женское согласование с олицетворённым городом.
theological_decisions:
- issue: Толкование сжатого выражения טְמֵאַת הַשֵּׁם
  choice: с запятнанным именем
  alternative: нечистая именем; осквернившая имя; чьё имя осквернено
  rationale: Основной текст должен быть понятен современному читателю, но не должен окончательно решать, означает ли выражение нечистое имя, опороченную славу или действие самой адресатки. Варианты отмечены в сноске.
- issue: Называть ли адресата Иерусалимом
  choice: сохранить обращение во втором лице без добавления названия
  alternative: добавить «Иерусалим» или «город»
  rationale: Адресат определяется контекстом; в самом стихе его название отсутствует. Женские формы «запятнанным» и «полной» поддерживают олицетворение города.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся компактным; тире вводит два обращённых к олицетворённому городу определения. Архаизмы и конфессионально окрашенная терминология не используются.
