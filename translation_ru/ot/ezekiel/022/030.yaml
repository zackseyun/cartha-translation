base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/030.yaml
  text: And I sought among them for a man who would build up a wall and stand in the breach before me on behalf of the land[a], so that I would not destroy it[b], but I found none.
translation:
  language: ru
  text: И Я искал среди них человека[b], который восстановил бы стену и встал бы предо Мной в проломе[a] за землю, чтобы Я не погубил её, но не нашёл никого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встал бы в бреши». Еврейский образ — занять место в пробоине стены, защищая землю и заступаясь за неё.'
    reason: lexical_alternative
  - marker: b
    text: Буквально еврейское слово стоит в мужском роде и единственном числе; здесь оно может иметь представительное значение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבַקֵּשׁ מֵהֶם
  choice: И Я искал среди них
  rationale: בקש означает искать; מן с местоименным суффиксом указывает на поиск внутри названной группы. Русское «среди них» естественно передаёт этот смысл, а начальное «И» сохраняет связь с предшествующей пророческой речью.
- source_word: אִישׁ
  choice: человека
  rationale: Существительное стоит в мужском роде и единственном числе. В данном контексте русское «человека» сохраняет единственное число и не исключает представительного значения формы.
- source_word: גֹּדֵר גָּדֵר
  choice: который восстановил бы стену
  rationale: Сочетание причастия с однокоренным существительным буквально описывает того, кто ограждает стеной. В контексте пролома речь идёт о восстановлении защитной преграды; «восстановил бы стену» сохраняет образ и звучит естественно по-русски.
- source_word: וְעֹמֵד בַּפֶּרֶץ
  choice: и встал бы … в проломе
  rationale: פֶּרֶץ — брешь или пролом в защитной стене. Перевод сохраняет конкретный оборонительный образ, который одновременно допускает смысл заступничества.
- source_word: לְפָנַי
  choice: предо Мной
  rationale: Прямо передаёт положение человека перед Богом и сохраняет торжественный, но понятный библейский регистр.
- source_word: בְּעַד הָאָרֶץ
  choice: за эту землю
  rationale: בְּעַד выражает действие в защиту или от имени кого-либо. Русское «за эту землю» кратко и естественно передаёт заступнический оттенок.
- source_word: לְבִלְתִּי שַׁחֲתָהּ
  choice: чтобы Я не погубил её
  rationale: Конструкция выражает цель или предотвращаемый результат; местоименный суффикс относится к земле. Явно названное «Я» устраняет неестественную для русского синтаксическую неясность, не меняя субъекта действия.
- source_word: וְלֹא מָצָאתִי
  choice: но не нашёл никого
  rationale: Формальное «и» в данном месте выражает трагический контраст между поиском и его результатом; по-русски он естественно передаётся союзом «но». «Никого» указывает, что искомого человека не оказалось.
theological_decisions:
- issue: Оборонительный образ и заступничество
  choice: Сохранить одновременно образы стены и пролома и выражение «предо Мной … за эту землю».
  alternative: 'Передать всё выражение отвлечённо: «кто заступился бы за землю».'
  rationale: Еврейский текст соединяет конкретный образ защиты города с предстоянием перед Богом ради земли. Сведение фразы лишь к молитвенному заступничеству или лишь к ремонту стены устранило бы намеренную смысловую напряжённость.
- issue: Передача אִישׁ
  choice: человека
  alternative: кого-нибудь; мужчину
  rationale: «Человека» сохраняет форму единственного числа и её возможную представительную функцию. «Мужчину» неоправданно подчёркивало бы биологический пол, а «кого-нибудь» ослабило бы образ одного искомого человека.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Форма «предо Мной» сохраняет достоинство библейской речи, оставаясь понятной; синтаксис прямой и пригодный для публичного чтения.
