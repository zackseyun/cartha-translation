  text: שֹׁ֥חַד לָֽקְחוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם נֶ֧שֶׁךְ וְ/תַרְבִּ֣ית לָקַ֗חַתְּ וַ/תְּבַצְּעִ֤י רֵעַ֨יִ/ךְ֙ בַּ/עֹ֔שֶׁק וְ/אֹתִ֣/י שָׁכַ֔חַתְּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/012.yaml
  text: In you they have taken bribes to shed blood; you have taken interest and profit[a], and you have extorted your neighbors by oppression, and you have forgotten me, declares the Lord GOD.
translation:
  language: ru
  text: У тебя берут взятки, чтобы проливать кровь; ты брала проценты и прибыль[a], наживалась на своих ближних, притесняя их, и забыла Меня, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лихву и прирост». В еврейском тексте стоят два близких слова, обозначающие процент по займу и получаемый прирост.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד לָקְחוּ בָךְ
  choice: У тебя берут взятки
  rationale: Безлично-обобщённая русская конструкция естественно передаёт 3-е лицо множественного числа и בָךְ, сохраняя обращение к Иерусалиму как к олицетворённому городу.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: чтобы проливать кровь
  rationale: Конструкция выражает цель; традиционное русское выражение сохраняет тяжесть обвинения и может охватывать как насилие, так и неправедное осуждение на смерть.
- source_word: נֶשֶׁךְ וְתַרְבִּית
  choice: проценты и наживу
  rationale: Первое слово обозначает процент по займу, второе — прирост или прибыль. «Нажива» в данном обвинительном контексте ясно передаёт неправедный характер выгоды, не сливая два еврейских термина.
- source_word: וַתְּבַצְּעִי רֵעַיִךְ בָּעֹשֶׁק
  choice: притесняешь ближних ради выгоды
  rationale: בצע указывает на корыстное приобретение, а עשׁק — на угнетение или вымогательство. Формулировка передаёт одновременно способ действия и корыстную цель, оставаясь естественной по-русски.
- source_word: וְאֹתִי שָׁכַחַתְּ
  choice: и забыла Меня
  rationale: Женский род сохраняет прямое обращение к олицетворённому Иерусалиму; вынесенное дополнение передано прописной буквой по русской библейской традиции.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передаёт пророческую формулу торжественного заявления. «Владыка» различает אֲדֹנָי и личное имя יְהוִה, переданное как «Яхве».
theological_decisions:
- issue: Передача имени יְהוִה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Транслитерация сохраняет личное заветное имя, а «Владыка» передаёт אֲדֹנָי и не создаёт неестественного повтора «Господь Господь».
- issue: Характер финансового проступка в נֶשֶׁךְ וְתַרְבִּית
  choice: проценты и наживу
  alternative: рост и прибыль; лихву и прирост
  rationale: Текст осуждает получение дохода от займа в контексте угнетения, однако перевод не добавляет ограничения «чрезмерные» и тем самым не сужает смысл до современного определения ростовщичества.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранено обращение к Иерусалиму в женском роде; синтаксис сделан естественным для обычного читателя без устранения коллективного смысла обвинения.
