  text: Son of man[a], say to her[c][b], ‘You are a land not cleansed and not rained on in the day of indignation.’
translation:
  language: ru
  text: 'Сын человеческий, скажи ей: «Ты — земля, не очищенная[a] и не политая дождём[b] в день гнева».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечистая», «не очищенная». Еврейское причастие может обозначать как состояние нечистоты, так и отсутствие очищения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение редко; возможно также: «не получившая дождя» или «без дождя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устоявшееся пророческое обращение в книге Иезекииля; сохраняет форму и возвышенный регистр еврейского выражения.
- source_word: אֱמָר לָהּ
  choice: скажи ей
  rationale: Прямо передаёт повелительное наклонение и местоименный суффикс женского рода, относящийся к земле.
- source_word: אַתְּ אֶרֶץ
  choice: Ты — земля
  rationale: Сохраняет прямое метафорическое отождествление адресата с землёй; тире естественно для русского именного сказуемого.
- source_word: לֹא מְטֹהָרָה
  choice: не очищенная
  rationale: Передаёт пассивное значение причастия от טהר и допускает как нравственный, так и ритуальный оттенок чистоты, не сводя выражение лишь к состоянию «нечистая».
- source_word: לֹא גֻשְׁמָהּ
  choice: не орошённая дождём
  rationale: Редкая форма, вероятнее всего связанная с גשם, «дождь». Русская формулировка сохраняет пассивный образ дождя, не добавляя идеи омовения, которой нет в явном виде.
- source_word: בְּיוֹם זָעַם
  choice: в день гнева
  rationale: זעם означает гнев, ярость, негодование. «День гнева» естественен в современной литературной русской речи и сохраняет язык пророческого суда, не уточняя прямо носителя гнева.
theological_decisions:
- issue: Соотношение нечистоты земли и отсутствия дождя
  choice: 'Сохранены два параллельных образа: земля не очищена и не орошена дождём в день суда.'
  alternative: Понимать отсутствие дождя исключительно как метафору отсутствия очищения либо только как буквальную засуху.
  rationale: Еврейский текст допускает одновременное нравственно-ритуальное и природное звучание образов; перевод не устраняет эту напряжённость.
- issue: Чей гнев подразумевается
  choice: «в день гнева» без добавления притяжательного определения
  alternative: «в день Божьего гнева»
  rationale: Контекст указывает на Божий суд, однако в самом стихе субъект гнева прямо не назван, поэтому он не добавлен в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Традиционное обращение «Сын человеческий» оставлено без модернизирующего пересказа. Формулировка краткая и образная; двусмысленность между буквальным дождём и символикой очищения не снята.
