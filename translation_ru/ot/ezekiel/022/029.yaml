lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: жители этой земли
  rationale: Передаёт всё население страны, подразумеваемое в данном контексте, и при этом звучит по-русски естественнее буквального «народ земли».
- source_word: עָשְׁקוּ עֹשֶׁק
  choice: совершали притеснения
  rationale: Глагольно-именное сочетание с однокоренными словами усиливает и характеризует действие; русское выражение сохраняет этот смысл без неестественного повтора.
- source_word: וְגָזְלוּ גָּזֵל
  choice: и грабежи
  rationale: В сочетании со сказуемым «совершали» передаёт вторую однокоренную конструкцию как явные, неоднократные акты насильственного присвоения чужого.
- source_word: וְעָנִי וְאֶבְיוֹן
  choice: бедного и нуждающегося
  rationale: Сохраняет две связанные, но не полностью тождественные категории социально уязвимых людей и число единственного собирательного значения оригинала.
- source_word: הוֹנוּ
  choice: обижали
  rationale: Передаёт причинение вреда и несправедливое обращение, не смешивая этот глагол с עשק, переведённым как «притеснять/угнетать».
- source_word: הַגֵּר
  choice: пришельца
  rationale: Обозначает человека чужеземного происхождения, постоянно или длительно живущего среди местного народа; «пришелец» сохраняет библейскую социально-правовую категорию.
- source_word: עָשְׁקוּ
  choice: угнетали
  rationale: Сохраняет прямое значение эксплуатации и притеснения, а также связь с первым однокоренным оборотом стиха.
- source_word: בְּלֹא מִשְׁפָּט
  choice: вопреки справедливости
  rationale: Сохраняет существительное מִשְׁפָּט и его здесь одновременно правовой и нравственный смысл, не сужая выражение только до судебной процедуры.
theological_decisions:
- issue: Конкретность пророческого обличения социальной несправедливости
  choice: 'Сохранены конкретные действия и категории пострадавших: притеснения, грабежи, обида бедных и угнетение пришельца.'
  alternative: Обобщить обвинение словами о зле или нечестии.
  rationale: Еврейский текст перечисляет определённые общественные злоупотребления; обобщение ослабило бы содержание пророческого обвинения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Параллельные обвинения переданы ритмично, без архаической буквальности; конкретная социально-правовая лексика оригинала сохранена.
