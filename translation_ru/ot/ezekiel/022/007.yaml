    issue: Слабая и расплывчатая передача הוֹנוּ
    rationale: Фраза «поступали несправедливо с сиротой и вдовой» сообщает лишь общую несправедливость, тогда как глагол ינה в хифиле указывает на причиняемое притеснение, вред или эксплуатацию. «Обижали» сохраняет широту, но передаёт направленное неправомерное обращение.
  - severity: low
    issue: Не вполне точная формулировка культурной сноски c
    rationale: 'В русском тексте повторяется не буквально выражение «у тебя»: средний член содержит «среди тебя». Речь идёт о повторяющемся обращении к городу посредством пространственных форм.'
  - severity: low
