- from: У тебя[c] с презрением относились к отцу и матери; среди тебя притесняли пришельца[a]; у тебя поступали несправедливо с сиротой[b] и вдовой.
  to: У тебя презирали отца и мать; среди тебя притесняли пришельца[a]; у тебя обижали сироту[b] и вдову.
  rationale: 'Исправления делают обвинительный стиль более прямым и уточняют передачу последнего глагола, не сужая его до финансового обмана и не отождествляя его полностью с предшествующим «притесняли». Сохранены порядок трёх обвинений, единственное число обращения к Иерусалиму и названные в еврейском тексте категории людей. Сноска c сохраняется в наборе, хотя в данном варианте текста её маркер не обязателен для понимания; для соответствия сноскам её можно поставить после первого «У тебя»: «У тебя[c] презирали…».'
  reviewer_model: gpt-5.6-terra
