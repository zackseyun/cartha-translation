review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сохраняются прямое обращение к городу, конкретные группы людей и три обвинения. Однако «поступали несправедливо с» слишком обобщённо для הוֹנוּ, которое обозначает причинение вреда, притеснение или эксплуатационное обращение.'
  naturalness: «С презрением относились к отцу и матери» грамматически возможно, но более прямое «презирали отца и мать» естественнее, энергичнее и лучше соответствует пророческому обвинению. «Обижали сироту и вдову» — современная литературная и достаточно широкая передача последнего глагола.
  terminology: «Пришелец», «сирота» и «вдова» уместно сохраняют установившиеся библейские социально-правовые категории. Сноску о повторе пространственного обращения следует сформулировать точнее, поскольку в тексте чередуются «у тебя» и «среди тебя», а не буквально повторяется только фраза «у тебя».
