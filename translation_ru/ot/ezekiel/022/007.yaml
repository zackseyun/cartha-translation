base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/007.yaml
  text: In you they have treated father and mother with contempt[a]; in your midst they have oppressed the sojourner[c][b]; in you they have defrauded the fatherless and the widow.
translation:
  language: ru
  text: У тебя презирали отца и мать; среди тебя притесняли пришельца[a]; у тебя обижали сироту[b] и вдову.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземца» или «поселенца». Здесь имеется в виду человек не из местных, живущий среди народа.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может особо указывать на ребёнка, лишившегося отца.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקַלּוּ
  choice: с презрением относились
  rationale: Форма породы hифиль от קלל означает считать незначительным, бесчестить, проявлять презрение. Русское выражение передаёт и пренебрежение, и нравственную тяжесть обвинения.
- source_word: אָב וָאֵם
  choice: к отцу и матери
  rationale: Сохранено явное называние обоих родителей, а не обобщённое «к родителям»; так остаётся слышна связь с языком заповеди.
- source_word: בָךְ
  choice: у тебя
  rationale: Местоимение женского рода обращено к олицетворённому Иерусалиму. Повтор «у тебя» сохраняет прямое обвинительное обращение и естественно звучит по-русски.
- source_word: לַגֵּר
  choice: пришельца
  rationale: גֵּר обозначает переселенца не из местных, постоянно живущего среди народа. «Пришелец» сохраняет особую общественно-правовую категорию библейского текста; возможны также «чужеземец» и «поселенец».
- source_word: עָשׂוּ בָעֹשֶׁק
  choice: притесняли
  rationale: Буквально выражение говорит о действии посредством угнетения или вымогательства. «Притесняли» кратко и естественно передаёт эксплуатационный характер обращения.
- source_word: בְּתוֹכֵךְ
  choice: среди тебя
  rationale: תוֹךְ указывает на внутреннюю среду города или общины; формулировка подчёркивает, что беззаконие совершается внутри Иерусалима.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: с сиротой и вдовой
  rationale: Сохранена традиционная пара конкретно названных беззащитных людей. יָתוֹם может точнее обозначать ребёнка без отца, однако современное «сирота» естественнее и не исключает этого значения.
- source_word: הוֹנוּ
  choice: поступали несправедливо
  rationale: Hифиль от ינה охватывает причинение вреда, притеснение и эксплуатацию. Выбор сохраняет широту значения и не сводит обвинение исключительно к финансовому обману.
theological_decisions:
- issue: Социально-этические обозначения защищаемых законом людей
  choice: 'Сохранить конкретные категории: пришелец, сирота и вдова'
  alternative: Обобщить как «беззащитные» или передать גֵּר как «чужеземец»
  rationale: Стих обвиняет город в нарушении обязанностей по отношению к отдельно названным группам. Их сохранение поддерживает межтекстовую связь с законом и не вносит дополнительного конфессионального толкования.
- issue: Адресат повторяющегося בָךְ
  choice: 'Передать как прямое обращение к городу: «у тебя»'
  alternative: Обобщить как «среди вас»
  rationale: Еврейские формы стоят в женском единственном числе и олицетворяют Иерусалим. Единственное число сохраняет эту риторическую особенность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обвинения. Параллелизм и повтор пространственных формул сохранены; редкое «пришелец» оставлено ради библейской общественно-правовой категории и пояснено в сноске.
