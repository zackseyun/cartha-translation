  yaml_path: translation/ot/ezekiel/022/016.yaml
  text: And you will be profaned through yourself before the eyes of the nations[a], and you will know that I am Yahweh.
translation:
  language: ru
  text: Ты будешь осквернена в самой себе на глазах у народов[a] и узнаешь, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станешь нечистой»; возможно также: «будешь обесчещена в самой себе». Еврейский глагол допускает оттенки осквернения, нечистоты и публичного бесчестья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַלְתְּ
  choice: осквернишься
  rationale: Нифаль, 2-е лицо женского рода единственного числа, в контексте Иезекииля естественно передаёт состояние осквернения или лишения святости; возвратная форма по-русски сохраняет возможный пассивно-рефлексивный оттенок.
- source_word: בָּךְ
  choice: сама
  rationale: Краткое בָּךְ указывает, что осквернение относится к самому Иерусалиму; «сама» звучит естественно и не навязывает более сильного причинного смысла «по собственной вине».
- source_word: לְעֵינֵי
  choice: перед глазами
  rationale: Сохраняет зрительный образ еврейской идиомы и подчёркивает публичность происходящего.
- source_word: גוֹיִם
  choice: народов
  rationale: В пророческом контексте речь идёт об окружающих иноземных народах; это обычный и ясный русский эквивалент.
- source_word: וְיָדַעַתְּ
  choice: и узнаешь
  rationale: Пророческий перфект здесь имеет будущее, результативное значение; «узнаешь» естественно передаёт обретение знания через суд.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Значение חלל в данном стихе
  choice: судебно-культовое осквернение Иерусалима перед народами
  alternative: лишение владения либо просто публичное бесчестье
  rationale: Ближайший контекст нечистоты, вины и суда, а также характерная для Иезекииля тема святости поддерживают значение «оскверниться», не сводя его к общей утрате чести.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Женский род сохраняет обращение к Иерусалиму. Формула «перед глазами народов» намеренно удерживает образность оригинала.
