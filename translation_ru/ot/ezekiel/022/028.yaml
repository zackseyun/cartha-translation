  text: וּ/נְבִיאֶ֗י/הָ טָח֤וּ לָ/הֶם֙ תָּפֵ֔ל חֹזִ֣ים שָׁ֔וְא וְ/קֹסְמִ֥ים לָ/הֶ֖ם כָּזָ֑ב אֹמְרִ֗ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וַֽ/יהוָ֖ה לֹ֥א דִבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/028.yaml
  text: And her prophets have plastered for them with whitewash[a], seeing falsehood and divining lies for them, saying[b], ‘Thus says the Lord GOD,’ when Yahweh has not spoken.
translation:
  language: ru
  text: 'А её пророки покрывают их непрочной обмазкой[a], видят ложные видения и гадают им, возвещая ложь; они говорят: «Так говорит Владыка Яхве[b]», — хотя Яхве не говорил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «побелкой», «непрочным раствором» или «ненадёжной обмазкой». Еврейский образ говорит о покрытии, которое скрывает изъяны, но не устраняет их.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское אֲדֹנָי יְהוִה — «Владыка Яхве»; первое слово является титулом, второе — личным именем Бога.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְבִיאֶיהָ
  choice: А её пророки
  rationale: Суффикс 3-го лица женского рода относится к городу; современное русское «её пророки» естественно передаёт эту связь.
- source_word: טָחוּ לָהֶם תָּפֵל
  choice: покрывают для них всё непрочной штукатуркой
  rationale: Сохранён строительный образ поверхностного покрытия, скрывающего изъяны. Слово «всё» эксплицирует подразумеваемый объект глагола ради естественности по-русски, не уточняя, что именно пророки прикрывают.
- source_word: חֹזִים שָׁוְא
  choice: видят ложные видения
  rationale: Передаёт пророческое значение причастия חֹזִים и ложный, обманный характер שָׁוְא; повтор корня «вид-» естественен для русского языка.
- source_word: וְקֹסְמִים לָהֶם כָּזָב
  choice: и предсказывают им ложь
  rationale: קֹסְמִים обозначает гадательное предсказание; «предсказывают» понятно современному читателю, а «ложь» сохраняет прямую характеристику כָּזָב.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула передана узнаваемо и без излишней архаичности.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: אֲדֹנָי передано титулом «Владыка», а личное имя יהוה — формой «Яхве»; это избегает неестественного сочетания «Господь Господь».
- source_word: וַיהוָה לֹא דִבֵּר
  choice: хотя Яхве не говорил
  rationale: Союз וַ здесь выражает резкое фактическое противопоставление заявлению пророков; «хотя» естественно передаёт его по-русски. Совершенный вид сохраняет категоричность отрицания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, прямо присутствующее в еврейском тексте, и отличает его от титула אֲדֹנָי.
- issue: Образ תָּפֵל
  choice: непрочная штукатурка
  alternative: побелка
  rationale: 'Выбор сохраняет неоднозначность строительного образа: речь может идти не только о косметической побелке, но и о ненадёжном растворе или покрытии, скрывающем дефекты.'
- issue: Характер ложной пророческой речи
  choice: ложные видения и предсказывают им ложь
  alternative: видят пустое и гадают им ложь
  rationale: Формулировка ясно различает видения и гадательное предсказание, не приписывая тексту дополнительной доктринальной оценки сверх прямого обвинения во лжи.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Строительная метафора оставлена зримой; синтаксис сделан естественным для обычного читателя. Имя Яхве последовательно отличено от титула «Владыка».
