lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма וַיְהִי служит обычным повествовательным введением. Русская библейская формула «И было… слово» естественна, понятна и сохраняет событийный оттенок еврейского выражения.
- source_word: דְבַר
  choice: слово
  rationale: В сочетании דְבַר יְהוָה это традиционное и точное обозначение пророческого откровения; «весть» возможно, но слабее передаёт повторяющуюся формулу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица прямо указывает, что слово было обращено к пророку.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь, начинающуюся в следующем стихе. В современном русском эту функцию естественно и без смысловой потери выражает двоеточие; буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя YHWH. Форма «Яхве» непосредственно передаёт имя и не подменяет его титулом; примечание сообщает читателю традиционный русский вариант.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Двоеточие естественно вводит речь следующего стиха; имя «Яхве» снабжено примечанием.
