  text: כֹּהֲנֶ֜י/הָ חָמְס֣וּ תוֹרָתִ/י֮ וַ/יְחַלְּל֣וּ קָדָשַׁ/י֒ בֵּֽין קֹ֤דֶשׁ לְ/חֹל֙ לֹ֣א הִבְדִּ֔ילוּ וּ/בֵין הַ/טָּמֵ֥א לְ/טָה֖וֹר לֹ֣א הוֹדִ֑יעוּ וּ/מִ/שַׁבְּתוֹתַ/י֙ הֶעְלִ֣ימוּ עֵֽינֵי/הֶ֔ם וָ/אֵחַ֖ל בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/026.yaml
  text: Her priests have done violence to my law and have profaned my holy things[a]. They have not distinguished between the holy and the common, and they have not made known the difference between the unclean and the clean. They have hidden their eyes from my Sabbaths[b], and I have been profaned among them.
translation:
  language: ru
  text: Её священники совершают насилие над Моим законом и оскверняют Мои святыни. Они не отличают священное от обычного[a] и не объясняют различия между нечистым и чистым. Они закрывают глаза на Мои субботы, и Я осквернён среди них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священное от несвященного». Еврейское слово означает обычное, обыденное, в отличие от священного, и не обязательно несёт значение нравственной порочности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Я был осквернён среди них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמְסוּ
  choice: попирают
  rationale: Глагол выражает грубое, насильственное нарушение. «Попирают» сохраняет силу образа и естественно сочетается с «законом» в современном литературном русском.
- source_word: תוֹרָתִי
  choice: Мой закон
  rationale: В контексте обвинения священников תּוֹרָה обозначает данное Богом нормативное наставление; «закон» кратко и естественно передаёт эту роль.
- source_word: וַיְחַלְּלוּ
  choice: оскверняют
  rationale: Порода пиэль глагола חלל означает лишать святого должного священного статуса, осквернять.
- source_word: קָדָשַׁי
  choice: Мои святыни
  rationale: Форма множественного числа охватывает принадлежащее священной сфере Бога — предметы, места, приношения и установления — без неоправданного сужения.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: священное от обычного
  rationale: חֹל здесь означает несвященное, обыденное, а не обязательно порочное или осквернённое. «Обычное» ясно сохраняет культовое противопоставление.
- source_word: הִבְדִּילוּ
  choice: не отличают
  rationale: Передаёт обязанность священников различать и классифицировать священное и несвященное.
- source_word: וּבֵין הַטָּמֵא לְטָהוֹר
  choice: между нечистым и чистым
  rationale: «Нечистое» и «чистое» — установившиеся русские обозначения категорий ритуальной чистоты; они не сводят их к нравственной оценке.
- source_word: הוֹדִיעוּ
  choice: не объясняют различия
  rationale: Буквально глагол значит «дать знать, сделать известным». В контексте священнической обязанности естественное русское выражение «объясняют различия» сохраняет как информативный, так и наставительный оттенок.
- source_word: וּמִשַׁבְּתוֹתַי
  choice: на Мои субботы
  rationale: Сохранено множественное число, обозначающее повторяющиеся священные дни; предлог обусловлен русской идиомой «закрывать глаза на».
- source_word: הֶעְלִימוּ עֵינֵיהֶם
  choice: закрывают глаза на
  rationale: Естественная русская идиома передаёт еврейский образ и намеренное пренебрежение.
- source_word: וָאֵחַל
  choice: Я осквернён
  rationale: 'Форма в данном контексте лучше всего понимается пассивно: из-за поведения священников к Божьей святости относятся как к чему-то несвященному.'
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Прямо и естественно передаёт нахождение внутри сообщества.
theological_decisions:
- issue: Значение חֹל в противопоставлении священному
  choice: обычное
  alternative: несвященное; мирское; осквернённое
  rationale: Речь идёт прежде всего о культовом статусе, а не о противопоставлении святости нравственному злу. «Обычное» не приписывает всему несвященному порочность.
- issue: Залог и смысл וָאֵחַל
  choice: 'пассивное: «Я осквернён среди них»'
  alternative: 'рефлексивный оттенок: «Я Сам оказался осквернён среди них»; толкования с активным значением при иной вокализации'
  rationale: 'Масоретская форма и контекст подводят итог проступкам священников: Божья святость подвергается осквернению внутри общины. Пассивная передача сохраняет это утверждение без развития спорного толкования.'
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Настоящее время передаёт последовательность древнееврейских форм как актуальное обвинение. Сохранены термины святости и ритуальной чистоты; синтаксис сделан ясным для широкого читателя.
