- from: Как серебро плавится в плавильной печи, так и вы будете расплавлены в ней[a]. И вы узнаете, что это Я, Яхве, излил на вас Мою ярость.
  to: Как серебро плавится в плавильной печи, так и вы будете расплавлены в ней[a]. И вы узнаете, что Я, Яхве, излил на вас Мою ярость.
