    rationale: 'Русское «это Я» не может непосредственно быть подлежащим при «излил» в данной конструкции. Это не отражает особенность еврейского текста, а создаёт синтаксическую ошибку. Следует убрать «это», сохранив эмфазу и имя: «что Я, Яхве, излил...».'
