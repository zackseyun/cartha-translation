  source_fidelity: Образ плавления серебра в плавильной печи, повтор «так ... так», пассивное «будете расплавлены», референт женского местоимения («в ней») и формула узнавания переданы верно. «Ярость» адекватно передаёт חֲמָתִי; «излил» допустимо передаёт еврейский перфект в контексте будущего узнавания.
  naturalness: 'В первой части текст звучит естественно и сохраняет пророческую интонацию. Однако конструкция «что это Я, Яхве, излил» грамматически и стилистически неудачна: после «что это Я» требуется именная, а не глагольная конструкция. Эмфатическое אֲנִי можно естественно передать простым «что Я, Яхве, излил».'
  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. «Плавильная печь» уместно передаёт כּוּר, а «ярость» сохраняет силу лексемы חֵמָה без доктринального добавления. Сноска корректно поясняет, что «ней» относится к городу (Иерусалиму).
