base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/022.yaml
  text: As silver is melted in the midst of a furnace[a], so you will be melted in the midst of it; and you will know that I, Yahweh, have poured out my wrath on you.
translation:
  language: ru
  text: Как серебро плавится в плавильной печи, так и вы будете расплавлены в ней[a]. И вы узнаете, что Я, Яхве, излил на вас Мою ярость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в городе, Иерусалиме; местоимение женского рода отсылает к ближайшему контексту.
    reason: Уточнение референта местоименного суффикса בְתוֹכָהּ при сохранении местоимения в основном тексте.
lexical_decisions:
- source_word: כְּהִתּוּךְ כֶּסֶף
  choice: Как серебро плавится
  rationale: Сравнительная конструкция с כְּ передаёт образ плавления серебра; личная глагольная форма звучит по-русски естественно и сохраняет пассивный смысл процесса.
- source_word: בְּתוֹךְ כּוּר
  choice: в плавильной печи
  rationale: כּוּר обозначает печь для плавки металла. Уточнение «плавильной» ясно передаёт металлургический образ без тяжеловесного буквального «посреди печи».
- source_word: תֻּתְּכוּ
  choice: вы будете расплавлены
  rationale: Пассивная форма сохраняет образ суда как плавления металла и не превращает его в нейтральное очищение.
- source_word: בְתוֹכָהּ
  choice: в ней
  rationale: Женский суффикс единственного числа указывает на город, то есть Иерусалим, из ближайшего контекста; местоименный характер исходного текста сохранён.
- source_word: וִידַעְתֶּם
  choice: И вы узнаете
  rationale: Сохранена характерная для Иезекииля формула узнавания и последовательность событий.
- source_word: אֲנִי יְהוָה
  choice: это Я, Яхве
  rationale: Оборот сохраняет эмфатическое אֲנִי и передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: שָׁפַכְתִּי חֲמָתִי
  choice: излил на вас Мою ярость
  rationale: Глагол שׁפך буквально передаёт излияние, а חֵמָה здесь обозначает пылающую ярость; прошедшее совершенного вида уместно как действие, которое адресаты осознают после суда.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Характер образа плавления
  choice: суд, изображённый как расплавление
  alternative: очищение или облагораживание серебра
  rationale: В данном стихе народ уподоблен расплавляемому металлу, а кульминацией названо излияние ярости. Перевод не добавляет идеи благотворного очищения, которой сам стих прямо не выражает.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Металлургический образ сохранён ясно и без архаической конструкции «посреди печи»; отдельное предложение подчёркивает формулу узнавания.
