  text: וַ/אֲנִ֗י נָתַ֤תִּֽי לְ/ךָ֙ אֶת שְׁנֵ֣י עֲוֺנָ֔/ם לְ/מִסְפַּ֣ר יָמִ֔ים שְׁלֹשׁ מֵא֥וֹת וְ/תִשְׁעִ֖ים י֑וֹם וְ/נָשָׂ֖אתָ עֲוֺ֥ן בֵּֽית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/005.yaml
  text: And I have assigned to you the years of their iniquity according to the number of days[a], three hundred and ninety days, and you shall bear the iniquity of the house of Israel.
translation:
  language: ru
  text: Я же назначил тебе годы их беззакония[a] по числу дней — триста девяносто дней, — и ты понесёшь беззаконие дома Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вины» либо «наказания за их беззаконие»; еврейское слово может обозначать беззаконие, вину или наказание, следующее за виной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: назначил
  rationale: Буквально глагол означает «дал», но в контексте символического действия речь идёт о назначении Иезекиилю определённого срока; «назначил» естественно передаёт эту функцию, не добавляя отсутствующего в тексте смысла.
- source_word: שְׁנֵי עֲוֺנָם
  choice: годы их беззакония
  rationale: Сохранена буквальная связь «годы их беззакония», поскольку последующая фраза устанавливает символическое соответствие годов числу дней.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: Еврейское слово может обозначать беззаконие, вину и последствие вины. «Беззаконие» сохраняет нравственный смысл и не устраняет намеренно оставленную в оригинале многозначность.
- source_word: לְמִסְפַּר יָמִים
  choice: по числу дней
  rationale: Кратко и естественно передаёт соотношение годов и дней, выраженное еврейской конструкцией.
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: триста девяносто дней
  rationale: Прямая передача количественного выражения современным литературным русским языком.
- source_word: וְנָשָׂאתָ
  choice: ты понесёшь
  rationale: Сочетание נשא с עָוֹן традиционно выражает несение беззакония, вины или её последствий. «Понесёшь» сохраняет образную и пророческую силу выражения.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранена корпоративная формула оригинала, обозначающая народ Израиля как единое целое.
theological_decisions:
- issue: Значение עָוֹן в символическом пророческом действии
  choice: В обоих случаях переведено как «беззаконие», а примечание указывает на возможные оттенки вины и наказания.
  alternative: «вина» или «наказание за вину»
  rationale: Контекст допускает смысл греха, возникшей из него вины и её тяжёлых последствий. Перевод не должен искусственно выбирать только один из этих взаимосвязанных смыслов.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Частица «же» передаёт акцент וַאֲנִי; порядок фразы и тире ясно показывают, что триста девяносто дней соответствуют годам беззакония.
