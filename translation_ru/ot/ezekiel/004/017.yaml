lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результирующее значение, связывающее этот стих с предшествующим знамением.
- source_word: יַחְסְרוּ
  choice: у них не стало
  rationale: Естественно передаёт недостаток и ожидаемое следствие, выраженное имперфектом; речь идёт об отсутствии самых необходимых припасов.
- source_word: לֶחֶם וָמָיִם
  choice: хлеба и воды
  rationale: Сохраняет конкретную еврейскую пару, обозначающую основные средства пропитания, не обобщая «хлеб» до «пищи».
- source_word: וְנָשַׁמּוּ
  choice: был в ужасе
  rationale: Нифаль глагола שמם применительно к людям может обозначать потрясение, оцепенение или ужас; выбранное выражение естественно по-русски и сохраняет силу реакции.
- source_word: אִישׁ וְאָחִיו
  choice: каждый … при виде своего брата
  rationale: Сохраняет распределительное значение и мужскую форму оригинала. Оборот «при виде» естественно выражает взаимную потрясённость, не представляя брата причиной или источником угрозы.
- source_word: וְנָמַקּוּ
  choice: изнемогали
  rationale: Передаёт постепенное истощение и угасание; звучит естественно и достойно, не сужая образ исключительно до телесного разложения.
- source_word: בַּעֲוֺנָם
  choice: в своём беззаконии
  rationale: Сохраняет краткость и смысловую широту עָוֹן, которое может обозначать беззаконие, вину и последствие вины.
theological_decisions:
- issue: Мужская распределительная формула אִישׁ וְאָחִיו
  choice: каждый … при виде своего брата
  alternative: друг при виде друга; друг перед другом
  rationale: Выбранный вариант сохраняет грамматически мужскую и родственную лексику исходного текста, оставаясь понятным в современном русском языке.
- issue: Смысловой диапазон עָוֹן
  choice: в своём беззаконии
  alternative: в своей вине; из-за наказания за своё беззаконие
  rationale: Основной текст не сводит многозначное слово только к субъективной виновности или только к наказанию, сохраняя связь греха, вины и гибельного последствия.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Повтор «чтобы» ясно передаёт последовательность ожидаемых последствий. Формулировка избегает конфессионально окрашенных толкований и сохраняет смысловую неоднозначность ключевых еврейских слов.
