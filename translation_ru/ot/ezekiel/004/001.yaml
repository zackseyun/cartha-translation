  text: וְ/אַתָּ֤ה בֶן אָדָם֙ קַח לְ/ךָ֣ לְבֵנָ֔ה וְ/נָתַתָּ֥ה אוֹתָ֖/הּ לְ/פָנֶ֑י/ךָ וְ/חַקּוֹתָ֥ עָלֶ֛י/הָ עִ֖יר אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/001.yaml
  text: And you[a], son of man, take for yourself a brick, set it before you, and engrave on it a city, Jerusalem.
translation:
  language: ru
  text: А ты, сын человеческий, возьми себе кирпич, положи его перед собой и изобрази[a] на нём город — Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вырежи на нём»; «начертай на нём». Еврейский глагол может обозначать вырезание или нанесение знаков; здесь речь идёт об изображении Иерусалима на кирпиче.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Буквально передаёт устойчивое обращение к пророку в книге Иезекииля, не заменяя его толковательными вариантами «человек» или «смертный».
- source_word: לְבֵנָה
  choice: кирпич
  rationale: Обычное значение еврейского существительного; контекст допускает использование кирпича как поверхности, но не требует уточнения «табличка».
- source_word: וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ
  choice: положи его перед собой
  rationale: Естественно передаёт נתן в сочетании с «перед собой» и сохраняет конкретность действия.
- source_word: וְחַקּוֹתָ עָלֶיהָ
  choice: изобрази на нём
  rationale: В данном контексте результатом действия является изображение города на кирпиче. Перевод сохраняет смысл, а конкретные способы нанесения вынесены в примечание из-за широты значения חקק.
- source_word: עִיר אֶת יְרוּשָׁלָם
  choice: город — Иерусалим
  rationale: 'Тире естественно передаёт пояснительное приложение: изображаемый город — Иерусалим, при этом неопределённость существительного не усиливается до «этот город».'
- source_word: יְרוּשָׁלָם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
