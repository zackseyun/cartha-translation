  text: וְ/אַתָּ֤ה שְׁכַב֙ עַל צִדְּ/ךָ֣ הַ/שְּׂמָאלִ֔י וְ/שַׂמְתָּ֛ אֶת עֲוֺ֥ן בֵּֽית יִשְׂרָאֵ֖ל עָלָ֑י/ו מִסְפַּ֤ר הַ/יָּמִים֙ אֲשֶׁ֣ר תִּשְׁכַּ֣ב עָלָ֔י/ו תִּשָּׂ֖א אֶת עֲוֺנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/004.yaml
  text: And you[a], lie on your left side, and place the iniquity of the house of Israel upon it; for the number of the days that you lie on it, you shall bear their iniquity.
translation:
  language: ru
  text: А ты ляг на левый бок и возложи на него беззаконие дома Израиля. Сколько дней ты будешь лежать на нём, столько и будешь нести их беззаконие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их вину» или «наказание за их беззаконие». Еврейское слово עָוֹן, дважды употреблённое в этом стихе, может обозначать сам грех, вину за него или его последствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכַב
  choice: ляг
  rationale: Повелительная форма описывает принятие физического положения; «ляг» прямо и естественно передаёт действие.
- source_word: צִדְּךָ הַשְּׂמָאלִי
  choice: на левый бок
  rationale: По-русски при описании положения тела естественно сказать «лечь на левый бок»; значение צַד сохраняется.
- source_word: וְשַׂמְתָּ
  choice: возложи
  rationale: В контексте символического действия «возложи» передаёт помещение нравственного бремени на бок и сочетается с последующим «нести», не уточняя природу этого бремени.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: עָוֹן может обозначать сам грех, вину за него или его последствия. «Беззаконие» сохраняет нравственную сторону значения, а неоднозначность отмечена в сноске.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено коллективное обозначение народа и близкая к еврейской формулировка.
- source_word: עָלָיו
  choice: на него / на нём
  rationale: Местоимение мужского рода естественно соотносится с «боком» и сохраняет пространственный образ символического действия.
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר
  choice: сколько дней… столько
  rationale: Русская соотносительная конструкция естественно выражает продолжительность, определяемую числом дней, и сохраняет количественную связь.
- source_word: תִּשָּׂא
  choice: будешь нести
  rationale: נשא в сочетании с עָוֹן означает несение беззакония, вины или их последствий; «нести» сохраняет образ бремени.
- source_word: עֲוֺנָם
  choice: их беззаконие
  rationale: Местоименный суффикс относится к дому Израиля как совокупности; повтор того же русского слова сохраняет лексическую связь внутри стиха.
theological_decisions:
- issue: Смысл символического несения Израилева עָוֹן Иезекиилем
  choice: Сохранить формулировку «нести их беззаконие» как описание пророческого символического действия.
  alternative: «нести их вину» или «нести наказание за их беззаконие»
  rationale: Еврейский текст допускает значения греха, вины и последствия или наказания, но сам стих не требует истолковывать действие в категориях заместительного искупления. Основной текст и сноска сохраняют эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сделан естественным для русского читателя; соотношение числа дней передано конструкцией «сколько… столько». Все местоименные связи и неоднозначность ключевого термина сохранены.
