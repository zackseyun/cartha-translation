  terminology: «Железная сковорода», «железная стена», «осада», «осадишь» и «дом Израиля» удачны. В сноске «жаровня» менее точна как альтернатива для плоской кухонной утвари; безопаснее указать «противень» или «плита». «Знамение» уместно для אוֹת в пророческом знаковом действии.
