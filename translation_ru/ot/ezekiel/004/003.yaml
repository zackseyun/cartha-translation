  verdict: revise
  source_fidelity: 'Основной смысл передан верно: пророку велено использовать железную кухонную утварь как стену между собой и городом, обратить к городу лицо, изобразить осаду, и это служит знамением для дома Израиля. Однако «поставь её как железную стену» может звучать как простое сравнение, тогда как еврейская конструкция назначает предмету роль железной стены; настоящее «Это — знамение» ближе к אֹות הִיא, чем будущее «Это будет знамением».'
