base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/003.yaml
  text: And you[a], take for yourself an iron griddle and set it as an iron wall between yourself and the city, and set your face toward it; and it will be under siege, and you shall besiege it. It is a sign for the house of Israel.
translation:
  language: ru
  text: 'А ты возьми себе железную сковороду[a] и поставь её железной стеной между собой и городом. Обрати к нему лицо: он будет в осаде, и ты осадишь его. Это — знамение для дома Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «железный противень» или «железную плиту». Еврейское слово обозначает плоскую металлическую кухонную утварь, которая здесь символически служит стеной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲבַת בַּרְזֶל
  choice: железная сковорода
  rationale: מַחֲבַת обозначает плоскую металлическую кухонную утварь — сковороду или жаровню. «Сковорода» естественно для современного русского языка и сохраняет предметный, бытовой характер символического действия.
- source_word: קִיר בַּרְזֶל
  choice: железная стена
  rationale: קִיר обычно означает конкретно «стена». Такой перевод сохраняет образ инсценированного пророческого знамения, не заменяя его толкованием «преграда».
- source_word: וַהֲכִינֹתָה אֶת־פָּנֶיךָ אֵלֶיהָ
  choice: обрати лицо своё к нему
  rationale: Выражение передаёт намеренную направленность пророка к изображённому городу. Сохранён библейский телесный образ, при этом фраза понятна по-русски.
- source_word: וְהָיְתָה בַמָּצוֹר
  choice: он будет в осаде
  rationale: מָצוֹר обозначает осаду или положение осаждённого города. Местоимение «он» относится к городу и устраняет неестественную для русского языка смену грамматического рода вслед за еврейским словом עִיר.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: ты осадишь его
  rationale: Глагол צור в данном контексте означает «осаждать». Прямой глагольный перевод сохраняет краткость и параллелизм исходного текста.
- source_word: אוֹת הִיא
  choice: это будет знамением
  rationale: אוֹת — видимый знак с пророческим значением. «Знамение» сохраняет сакрально-пророческий оттенок, не разъясняя символ сверх сказанного.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Предлог ל указывает на адресата или назначение знамения. Формула «дом Израиля» сохранена как коллективное библейское обозначение народа.
theological_decisions:
- issue: Образ пророческого символического действия
  choice: Сохранены конкретные образы «железная стена» и «дом Израиля» без истолковывающего пересказа.
  alternative: Передать как «железная преграда» и просто «Израиль».
  rationale: Богословская сила эпизода связана с самим разыгрываемым знамением. Конкретная образность позволяет читателю увидеть символ, не навязывая ему его расширенного толкования.
- issue: Временное значение וְהָיְתָה и וְצַרְתָּ
  choice: будет в осаде, и ты осадишь
  alternative: пусть окажется в осаде, и осади его
  rationale: Формы допускают оттенок предписания или последовательного будущего действия. Будущее время естественно продолжает повеление и сохраняет некоторую модальную открытость исходной конструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Конкретная образность оригинала сохранена; синтаксис слегка расчленён для ясности. Местоимения, относящиеся к городу, согласованы с русским мужским родом.
