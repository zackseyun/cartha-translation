  source_fidelity: 'Смысл в целом передан точно: כָּכָה — «так», בְּנֵי יִשְׂרָאֵל — «сыны Израиля», לַחְמָם — «свой хлеб», בַּגּוֹיִם — «среди народов», а אַדִּיחֵם — «изгоню их». Однако «хлеб нечистым» в творительном падеже синтаксически возможно, но в современном русском звучит неестественно и создаёт кратковременную неясность относительно того, характеризует ли «нечистым» хлеб или едоков. Атрибутивное «нечистый хлеб» ясно сохраняет характеристику хлеба и её ритуальный оттенок.'
