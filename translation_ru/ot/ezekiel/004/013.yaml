base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/013.yaml
  text: And Yahweh said[c][b][a], “Thus the sons of Israel will eat their bread unclean among the nations where I will drive them.”
translation:
  language: ru
  text: 'И сказал Яхве: «Так сыны Израиля будут есть нечистый хлеб среди народов, куда Я изгоню их».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осквернённый». Речь идёт прежде всего о ритуальной нечистоте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассею их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, прямо стоящее в еврейском тексте.
- source_word: כָּכָה
  choice: Так
  rationale: Естественно передаёт указание на образ действия, связанный с предшествующим символическим действием.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет семейно-корпоративный образ еврейского выражения, не сводя его просто к этнониму.
- source_word: לַחְמָם
  choice: свой хлеб
  rationale: Конкретное значение «хлеб» важно в контексте символического действия; возвратное «свой» естественно по-русски при совпадении обладателя с подлежащим.
- source_word: טָמֵא
  choice: нечистым
  rationale: Сохраняет ритуально-культовый оттенок нечистоты. Творительный падеж передаёт состояние, в котором хлеб будут есть.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Обозначает чужие народы, среди которых окажется Израиль, без привнесения более поздней терминологии.
- source_word: אַדִּיחֵם
  choice: изгоню их
  rationale: 'Передаёт каузативную силу глагола: Яхве заставит их удалиться со своей земли; возможен также смысл рассеяния.'
- source_word: שָׁם
  choice: куда
  rationale: В сочетании с глаголом движения «изгоню» русское «куда» естественно передаёт еврейское «там» как место назначения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл טָמֵא применительно к хлебу
  choice: нечистым
  alternative: осквернённым
  rationale: Форма допускает характеристику хлеба как ритуально нечистого; перевод не уточняет сверх текста конкретный механизм осквернения.
- issue: Образ изгнания в אַדִּיחֵם
  choice: изгоню их
  alternative: рассею их; удалю их
  rationale: Сохраняется действие Бога как причина изгнания, а возможность оттенка рассеяния отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Сыны Израиля» намеренно сохраняет исходный корпоративно-родственный образ; порядок слов сделан естественным для русского языка.
