  text: וְ/אֶל מְצ֤וֹר יְרוּשָׁלִַ֨ם֙ תָּכִ֣ין פָּנֶ֔י/ךָ וּֽ/זְרֹעֲ/ךָ֖ חֲשׂוּפָ֑ה וְ/נִבֵּאתָ֖ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/007.yaml
  text: And toward the siege of Jerusalem you shall set your face[a], with your arm bared, and you shall prophesy against it.
translation:
  language: ru
  text: Обрати лицо к осаде Иерусалима, обнажи руку и пророчествуй против него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о нём». Еврейский предлог может иметь более широкое значение, но контекст осады и суда поддерживает перевод «против него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצוֹר
  choice: осада
  rationale: Существительное обозначает осаду или состояние осаждения; здесь речь идёт о символически изображаемой осаде Иерусалима, без необходимости конкретизировать осадные сооружения.
- source_word: תָּכִין פָּנֶיךָ
  choice: обрати лицо
  rationale: Сочетание выражает намеренное, решительное направление лица к объекту действия. «Обрати лицо» естественно для современного литературного русского и сохраняет торжественный пророческий тон.
- source_word: זְרֹעֲךָ חֲשׂוּפָה
  choice: обнажи руку
  rationale: Еврейская безглагольная конструкция буквально описывает руку как открытую или обнажённую. Русская повелительная форма согласуется с рядом предписаний и ясно сохраняет образ готовности к действию.
- source_word: וְנִבֵּאתָ עָלֶיהָ
  choice: пророчествуй против него
  rationale: В контексте суда נבא с עַל имеет направленный против объекта оттенок. Местоимение женского рода в еврейском относится к Иерусалиму; по-русски название города требует формы «него».
theological_decisions:
- issue: Направленность пророчества об Иерусалиме
  choice: пророчествуй против него
  alternative: пророчествуй о нём
  rationale: Предлог עַל допускает более широкое значение «о, относительно», однако контекст символического действия, осады и суда поддерживает значение «против». Сноска сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с краткими повелительными формами, соответствующими функции еврейских форм в последовательности Божьих предписаний. Тон торжественный, но понятный; образность исходного текста сохранена.
