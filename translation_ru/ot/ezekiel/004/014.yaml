  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הִנֵּ֥ה נַפְשִׁ֖/י לֹ֣א מְטֻמָּאָ֑ה וּ/נְבֵלָ֨ה וּ/טְרֵפָ֤ה לֹֽא אָכַ֨לְתִּי֙ מִ/נְּעוּרַ֣/י וְ/עַד עַ֔תָּה וְ/לֹא בָ֥א בְּ/פִ֖/י בְּשַׂ֥ר פִּגּֽוּל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/014.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I have never defiled myself. From my youth until now I have not eaten what dies of itself or what is torn by beasts[c][b], and no defiled meat has entered my mouth.”
translation:
  language: ru
  text: 'И я сказал: «Ах, Владыка Яхве! Вот, я никогда не осквернял себя[a]. От юности моей и доныне я не ел ни падали, ни мяса животного, растерзанного зверями[b], и осквернённое мясо[c] не входило в мои уста».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «моя душа (или жизнь) не осквернена»; здесь это означает: «я не делал себя нечистым».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть он не ел туш животных, умерших сами по себе, и животных, растерзанных хищниками: такая пища была запрещена законом Израиля.'
    reason: cultural_note
  - marker: c
    text: 'Или: «мерзостное мясо». Еврейское слово обозначает мясо, ставшее ритуально неприемлемым или осквернённым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: О
  rationale: Междометие выражает тревогу и протест Иезекииля; русское «О» естественно вводит почтительное и взволнованное обращение.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה, сохраняя различие между титулом и именем.
- source_word: הִנֵּה
  choice: Вот
  rationale: Слово привлекает внимание к заверению пророка и естественно звучит в современной русской речи.
- source_word: נַפְשִׁי לֹא מְטֻמָּאָה
  choice: я никогда не осквернял себя
  rationale: 'Буквально говорится: «моя душа/жизнь не осквернена»; по контексту это заявление пророка о собственной ритуальной чистоте. «Никогда» уместно в свете последующего уточнения «от юности моей и доныне».'
- source_word: נְבֵלָה
  choice: падаль
  rationale: Обозначает тушу животного, умершего без надлежащего заклания; «падаль» кратко и точно передаёт пищевой запрет.
- source_word: טְרֵפָה
  choice: мясо животного, растерзанного зверями
  rationale: Термин обозначает животное, задранное или растерзанное хищниками; развёрнутая формулировка понятна современному читателю.
- source_word: מִנְּעוּרַי וְעַד עַתָּה
  choice: от юности моей и доныне
  rationale: Сохраняет временной охват и подчёркивает неизменность поведения пророка на протяжении жизни.
- source_word: וְלֹא בָא בְּפִי
  choice: не входило в мои уста
  rationale: Сохраняет конкретный образ исходного текста, оставаясь понятным русским выражением со значением «я не ел».
- source_word: בְּשַׂר פִּגּוּל
  choice: осквернённое мясо
  rationale: Передаёт культовую и ритуальную неприемлемость мяса, не сужая значение до одной конкретной причины такой неприемлемости.
theological_decisions:
- issue: Передача составного божественного именования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант прямо передаёт титул и личное имя, не заменяя יהוה общим титулом и не создавая сочетания двух почти одинаковых титулов.
- issue: Характер осквернения в נַפְשִׁי לֹא מְטֻמָּאָה и בְּשַׂר פִּגּוּל
  choice: Сохранена ритуальная категория осквернения
  alternative: Передать как нравственную нечистоту или просто испорченную пищу
  rationale: Контекст пищевых предписаний указывает прежде всего на ритуальную неприемлемость; перевод не превращает заявление ни исключительно в нравственную оценку, ни исключительно в санитарное описание.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к еврейскому оригиналу, но перечисление уточнено ради ясности. Архаизирующее «доныне» сохранено как общеупотребительное в возвышенном библейском регистре; выражение «не входило в мои уста» сохраняет образ оригинала.
