  text: וְ/נָתַתָּ֨ה עָלֶ֜י/הָ מָצ֗וֹר וּ/בָנִ֤יתָ עָלֶ֨י/הָ֙ דָּיֵ֔ק וְ/שָׁפַכְתָּ֥ עָלֶ֖י/הָ סֹֽלְלָ֑ה וְ/נָתַתָּ֨ה עָלֶ֧י/הָ מַחֲנ֛וֹת וְ/שִׂים עָלֶ֥י/הָ כָּרִ֖ים סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/002.yaml
  text: And set a siege against it[a], and build a siege wall against it, and heap up a ramp against it, and set camps against it[b], and place battering rams against it all around.
translation:
  language: ru
  text: И устрой против него осаду, возведи против него осадное укрепление[a], насыпь против него осадный вал[b], расположи против него военные лагеря и поставь вокруг него тараны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осадную башню»; еврейское слово обозначает осадное сооружение, точный вид которого неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «осадную насыпь» — земляное сооружение, насыпанное у городской стены для штурма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצוֹר
  choice: осаду
  rationale: Существительное обозначает осаду или осадное окружение; сочетание «устроить осаду» естественно передаёт конкретное символическое действие.
- source_word: דָּיֵק
  choice: осадное укрепление
  rationale: Редкое слово обозначает сооружение, возводимое при осаде; более широкое «осадное укрепление» сохраняет неопределённость относительно точного вида конструкции.
- source_word: סֹלְלָה
  choice: осадный вал
  rationale: Речь идёт о насыпанной земляной конструкции для штурма города; «осадный вал» точно и понятно передаёт образ.
- source_word: מַחֲנוֹת
  choice: военные лагеря
  rationale: Форма множественного числа обозначает лагеря осаждающих войск; уточнение «военные» ясно воссоздаёт контекст.
- source_word: כָּרִים
  choice: тараны
  rationale: В осадном контексте слово обозначает стенобитные орудия, а не животных.
- source_word: עָלֶיהָ
  choice: против него
  rationale: Повторяющаяся конструкция выражает направленное против изображённого города враждебное действие; местоимение согласовано с русским словом «город» из контекста предыдущего стиха.
- source_word: סָבִיב
  choice: вокруг него
  rationale: Наречие указывает на окружение города со всех сторон.
- source_word: וְנָתַתָּה / וּבָנִיתָ / וְשָׁפַכְתָּ / וְנָתַתָּה / וְשִׂים
  choice: устрой / возведи / насыпь / расположи / поставь
  rationale: Последовательность повелительных форм передана конкретными русскими глаголами, естественно сочетающимися с соответствующими осадными действиями.
