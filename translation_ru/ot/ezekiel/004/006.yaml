base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/006.yaml
  text: When you have finished these[a], you shall lie down a second time on your right side, and you shall bear the iniquity of the house of Judah for forty days. I have assigned you a day for each year.
translation:
  language: ru
  text: Когда ты закончишь это, во второй раз ляг на правый бок и сорок дней неси беззаконие дома Иуды. Я назначил тебе по одному дню за каждый год[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «день за год, день за год». Повтор подчёркивает символическое соответствие между днями, в течение которых Иезекииль лежит на боку, и обозначаемыми ими годами.'
    reason: Передача буквального повтора и его смысловой функции.
lexical_decisions:
- source_word: וְכִלִּיתָ אֶת־אֵלֶּה
  choice: Когда ты закончишь это
  rationale: Связанный перфект в данном контексте вводит следующее действие после завершения предыдущего символического периода; единственное число «это» естественно передаёт совокупность ранее предписанного.
- source_word: וְשָׁכַבְתָּ עַל־צִדְּךָ הַיְמָנִי שֵׁנִית
  choice: во второй раз ляг на правый бок
  rationale: «Во второй раз» явно передаёт שֵׁנִית, а повелительная форма естественно выражает продолжающееся Божье предписание.
- source_word: וְנָשָׂאתָ אֶת־עֲוֺן
  choice: неси на себе беззаконие
  rationale: 'Оборот сохраняет широту еврейского выражения: речь может охватывать как само беззаконие и вину, так и связанное с ними бремя последствий; «на себе» делает русское выражение понятным, не сужая смысла до одного лишь наказания.'
- source_word: בֵּית יְהוּדָה
  choice: дома Иуды
  rationale: Сохранено устойчивое пророческое обозначение народа и южного царства.
- source_word: אַרְבָּעִים יוֹם
  choice: сорок дней
  rationale: Продолжительность естественно присоединена в русском языке непосредственно к глаголу «неси».
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: по одному дню за каждый год
  rationale: Так ясно выражено символическое соответствие одного дня одному году; буквальный повтор приведён в сноске.
- source_word: נְתַתִּיו לָךְ
  choice: Я назначил тебе
  rationale: Глагол נתן здесь обозначает установленную Богом меру символического действия; «назначил» точнее по контексту, чем общее «дал».
theological_decisions:
- issue: Значение עָוֺן в символическом действии
  choice: «беззаконие» с оборотом «нести на себе»
  alternative: «вина» или «наказание за грех»
  rationale: Еврейское слово и весь оборот допускают связь как с грехом и виной народа, так и с их последствиями. Перевод не сводит смысл исключительно к вине либо наказанию.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным звучанием. Повелительные формы передают последовательность Божьих предписаний; избегнуты как архаическая тяжеловесность, так и разговорная упрощённость.
