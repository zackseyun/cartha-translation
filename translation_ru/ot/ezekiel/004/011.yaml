lexical_decisions:
- source_word: וּמַיִם
  choice: И воду
  rationale: Существительное означает «вода», а союз ו продолжает последовательность повелений и естественно передаётся как «и».
- source_word: בִּמְשׂוּרָה
  choice: по мере
  rationale: מְשׂוּרָה обозначает отмеренное количество; выражение «по мере» сохраняет краткость и смысл строгого нормирования.
- source_word: תִשְׁתֶּה
  choice: пей
  rationale: Форма qal imperfect 2 м. ед. ч. в данном предписании имеет повелительное значение; русский императив звучит естественно и передаёт прямое распоряжение.
- source_word: שִׁשִּׁית הַהִין
  choice: шестую часть гина
  rationale: Сохранена древняя единица объёма без приблизительного пересчёта, чтобы не утратить конкретность исходного текста.
- source_word: מֵעֵת עַד עֵת
  choice: время от времени
  rationale: Буквально «от времени до времени»; выражение указывает на периодичность и сохраняет некоторую неопределённость относительно точного распорядка.
- source_word: תִּשְׁתֶּה
  choice: пей
  rationale: Повтор глагола сохранён вслед за еврейским текстом, подчёркивая регламентированный характер питья.
