base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/015.yaml
  text: Then he said to me[a], “See, I have given you cow dung instead of human dung, and you shall prepare your bread over it.”
translation:
  language: ru
  text: 'Тогда Он сказал мне: «Смотри, Я дал тебе коровий навоз вместо человеческих испражнений, и на нём ты будешь готовить свой хлеб».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Тогда Он сказал мне
  rationale: Вав с последовательным имперфектом продвигает повествование; «тогда» естественно передаёт последовательность. Местоимение указывает на Бога из ближайшего контекста.
- source_word: רְאֵה
  choice: Смотри
  rationale: Императив служит для привлечения внимания; «смотри» современно и непосредственно, без архаического оттенка.
- source_word: נָתַתִּי לְךָ
  choice: Я даю тебе
  rationale: Перфект обозначает уже принятое Богом решение и предоставленную замену; русское настоящее естественно звучит как совершаемое здесь дозволение.
- source_word: צפועי הַבָּקָר
  choice: коровий навоз
  rationale: Речь о помёте крупного рогатого скота, используемом как топливо. «Коровий навоз» — ясное и обычное русское обозначение.
- source_word: תַּחַת
  choice: вместо
  rationale: Предлог выражает замену, а не пространственное положение.
- source_word: גֶּלְלֵי הָאָדָם
  choice: человеческие испражнения
  rationale: גֶּלְלֵי обозначает кал, экскременты; הָאָדָם здесь относится к людям вообще и противопоставлено скоту. Формулировка точна и не сужает значение до мужчины.
- source_word: וְעָשִׂיתָ אֶת לַחְמְךָ
  choice: ты будешь готовить свой хлеб
  rationale: עשה имеет широкое значение «делать, готовить»; «готовить» сохраняет общность и не уточняет способ как непременно выпекание.
- source_word: עֲלֵיהֶם
  choice: на нём
  rationale: Хотя еврейский суффикс имеет множественное число и соотносится с отдельными кусками помёта, по-русски собирательное «навоз» требует единственного числа. «На нём» естественно передаёт использование навоза как топлива.
theological_decisions:
- issue: Значение הָאָדָם
  choice: человеческие
  alternative: мужские / человека
  rationale: В данном противопоставлении скоту слово обозначает людей как вид, а не отдельного мужчину; родовое значение сохранено без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык, прямой и достойный по тону. Конкретность неприятного образа сохранена без эвфемистического устранения; синтаксис остаётся понятным обычному читателю.
