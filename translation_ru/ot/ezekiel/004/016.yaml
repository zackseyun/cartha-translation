  text: Then he said to me[a], “Son of man, behold, I am breaking the staff of bread in Jerusalem, and they will eat bread by weight and with anxiety, and they will drink water by measure and with horror.”
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий, вот, Я сокрушаю в Иерусалиме опору хлеба[a]. Они будут есть хлеб по весу и в тревоге и пить воду по мере и в ужасе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посох хлеба» — образ запаса пищи, поддерживающего жизнь.'
    reason: Пояснение еврейской идиомы מַטֵּה לֶחֶם.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет характерное для книги Иезекииля обращение и образность еврейского выражения; здесь это обращение к пророку как к человеку, а не христологический титул.
- source_word: הִנְנִי שֹׁבֵר
  choice: Вот, Я сокрушаю
  rationale: «Вот» передаёт указательно-эмфатическую силу הִנְנִי, а настоящее время с глаголом «сокрушаю» сохраняет яркость и неизбежность близкого действия.
- source_word: מַטֵּה לֶחֶם
  choice: опору хлеба
  rationale: Передаёт метафору хлеба как опоры, от которой зависит жизнь, и звучит понятнее по-русски, чем буквальное «посох хлеба»; идиоматический смысл пояснён в сноске.
- source_word: וְאָכְלוּ לֶחֶם בְּמִשְׁקָל
  choice: Они будут есть хлеб по весу
  rationale: Сохраняет конкретный образ взвешивания скудных пайков.
- source_word: וּבִדְאָגָה
  choice: в тревоге
  rationale: Передаёт значение беспокойства и тревожного ожидания, сопровождающего нехватку пищи.
- source_word: וּמַיִם בִּמְשׂוּרָה
  choice: пить воду по мере
  rationale: Сохраняет синтаксический параллелизм с «хлеб по весу» и образ строго отмеряемой воды.
- source_word: וּבְשִׁמָּמוֹן
  choice: в ужасе
  rationale: В данном контексте передаёт состояние потрясения и ужаса перед бедствием, не сводя многозначное слово к физическому запустению.
theological_decisions:
- issue: Передача метафоры מַטֵּה לֶחֶם
  choice: Сохранить метафору как «опору хлеба» и пояснить её в сноске.
  alternative: Передать идиому непосредственно как «запас хлеба» или «источник пропитания».
  rationale: Метафора подчёркивает, что Бог лишает Иерусалим того, что поддерживает жизнь; сноска делает идиоматический смысл прозрачным, не устраняя пророческий образ.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены конкретные параллельные образы: хлеб по весу и вода по мере.'
