base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/009.yaml
  text: And you[a], take for yourself wheat and barley, beans and lentils, millet and spelt, and put them into one vessel, and make them into bread for yourself. For the number of the days that you lie on your side—three hundred and ninety days—you shall eat it.
translation:
  language: ru
  text: А ты возьми себе пшеницу и ячмень, бобы и чечевицу, просо и полбу[a], сложи всё это в один сосуд и приготовь себе из этого хлеб. Ешь его столько дней, сколько будешь лежать на боку, — триста девяносто дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эммер»; возможно, имеется в виду один из древних видов пшеницы. Точная идентификация растения, названного еврейским словом כֻסְּמִים, неизвестна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: возьми себе
  rationale: Императив с дательным местоимением имеет бенефактивный оттенок; русское «возьми себе» передаёт его ясно и естественно.
- source_word: חִטִּין וּשְׂעֹרִים
  choice: пшеницу и ячмень
  rationale: Общепринятые современные названия указанных злаков.
- source_word: פּוֹל וַעֲדָשִׁים
  choice: бобы и чечевицу
  rationale: «Бобы» не сужает значение до конкретного современного сорта, а «чечевица» точно передаёт название культуры.
- source_word: דֹחַן
  choice: просо
  rationale: Наиболее вероятное и понятное современному читателю соответствие древнему названию злака.
- source_word: כֻסְּמִים
  choice: полбу
  rationale: Традиционное и правдоподобное русское соответствие; неопределённость точной ботанической идентификации отмечена в сноске.
- source_word: בִּכְלִי אֶחָד
  choice: в один сосуд
  rationale: Сохраняет конкретное значение כְּלִי и подчёркнутое объединение всех продуктов в одной ёмкости.
- source_word: וְעָשִׂיתָ אוֹתָם לְךָ לְלָחֶם
  choice: приготовь себе из этого хлеб
  rationale: Естественно передаёт буквальную конструкцию «сделай их себе в хлеб», сохраняя и результат, и значение предназначенности для пророка.
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר אַתָּה שׁוֹכֵב עַל צִדְּךָ
  choice: столько дней, сколько будешь лежать на боку
  rationale: Идиоматично выражает длительность, соотнесённую с числом дней символического действия.
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם תֹּאכֲלֶנּוּ
  choice: триста девяносто дней
  rationale: Число передано полностью; повелительная форма «ешь» естественно выражает предписание, а местоимение «его» соотносится с хлебом.
