  text: You shall eat it as a barley cake, and you shall bake it over human dung in their sight.
translation:
  language: ru
  text: Ешь её как ячменную лепёшку и пеки её на человеческих испражнениях у них на глазах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֻגַת שְׂעֹרִים
  choice: ячменную лепёшку
  rationale: Передаёт плоское хлебное изделие из ячменя естественным современным русским выражением.
- source_word: בְּגֶלְלֵי צֵאַת הָאָדָם
  choice: на человеческих испражнениях
  rationale: Сохраняет резкость исходного образа; предлог ב здесь указывает на материал, используемый как топливо при выпечке, поэтому «на» естественно передаёт приготовление над горящими испражнениями без утверждения, что они входят в тесто.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Современный идиоматический эквивалент буквального «перед их глазами», подчёркивающий публичность действия.
theological_decisions:
- issue: Ритуальное осквернение символической пищи
  choice: Сохранена прямая формулировка «на человеческих испражнениях» без смягчения.
  alternative: «на человеческом навозе» или пояснительное «над огнём из человеческих испражнений»
  rationale: Шокирующий характер повеления существенен для знамения; при этом перевод не должен добавлять отсутствующее в стихе слово «огонь» и тем самым устранять образную напряжённость.
translation_notes:
  register: Современный литературный русский язык; повелительная форма на «ты» соответствует непосредственному обращению Бога к Иезекиилю. Формулировка лаконична, наглядна и сохраняет суровый тон текста.
