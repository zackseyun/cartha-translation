review_pass:
  verdict: revise
  source_fidelity: В черновике глагол «свяжу» стоит в будущем времени и заменяет еврейское совершенное נָתַתִּי («Я положил/наложил»), а также делает действие более эксплицитным, чем исходный текст. Кроме того, עַד כַּלּוֹתְךָ требует, чтобы завершителем был адресат («пока ты не окончишь»), а не сами дни («пока не окончатся дни»).
  naturalness: «И вот» и «с одного бока на другой» естественны для современного литературного русского и уместны в описании телесного положения. «Наложил на тебя верёвки» сохраняет образ исходника и звучит достаточно ясно в пророческом регистре.
  terminology: «Верёвки» — допустимая основная передача עֲבוֹתִים; возможны также «шнуры» или «путы». «Осада» точно передаёт מָצוֹר, а притяжательное «твоя» сохраняет нераскрытую в самом стихе отсылку к символически изображаемой осаде.
  issues:
  - severity: high
    issue: Будущее время «Я свяжу тебя» вместо совершенного «Я наложил/положил на тебя».
    rationale: Нָתַתִּי — совершенная форма первого лица; перевод в будущее время изменяет временную перспективу и заменяет обозначенное действие его предполагаемым результатом.
  - severity: medium
    issue: «Пока не окончатся дни твоей осады» меняет субъект действия в עַד כַּלּוֹתְךָ.
    rationale: 'Суффикс второго лица при инфинитиве обозначает, что адресат завершит дни осады: «пока ты не окончишь дни твоей осады».'
  revised_text: И вот, Я наложил на тебя верёвки, и ты не повернёшься с одного бока на другой, пока ты не окончишь дни твоей осады.
