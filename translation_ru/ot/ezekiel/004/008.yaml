base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/008.yaml
  text: And behold[a], I have put ropes on you[b], and you will not turn yourself from your side to your other side until you have completed the days of your siege.
translation:
  language: ru
  text: И вот, Я наложил на тебя верёвки, и ты не повернёшься с одного бока на другой, пока ты не окончишь дни твоей осады.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательно-эмфатическую функцию оборота и сохраняет торжественность пророческой речи без излишней архаики.
- source_word: נָתַתִּי עָלֶיךָ עֲבוֹתִים
  choice: Я свяжу тебя верёвками
  rationale: Буквально речь идёт о том, что Бог кладёт на пророка верёвки; по-русски «свяжу тебя верёвками» естественно и ясно выражает результат действия в данном контексте.
- source_word: וְלֹא תֵהָפֵךְ
  choice: и ты не повернёшься
  rationale: Сохраняет прямую отрицательную формулировку древнееврейского текста; физическая невозможность движения понятна из упоминания верёвок и не вводится в текст дополнительно.
- source_word: מִצִּדְּךָ אֶל צִדֶּךָ
  choice: с одного бока на другой
  rationale: Естественный русский способ обозначить переворачивание тела; «бок» здесь точнее анатомического «сторона».
- source_word: עַד כַּלּוֹתְךָ יְמֵי מְצוּרֶךָ
  choice: пока не окончатся дни твоей осады
  rationale: Передаёт временной предел порученного действия. Такая синтаксическая перестройка естественна по-русски и сохраняет образ конкретно отсчитываемых дней.
theological_decisions:
- issue: Значение выражения «твоей осады»
  choice: Сохранить притяжательное местоимение без пояснения в основном тексте
  alternative: 'Уточнить: «осады, которую ты изображаешь»'
  rationale: Контекст главы показывает, что Иезекииль символически изображает осаду Иерусалима. Однако древнееврейский текст оставляет это неразъяснённым внутри самого стиха, поэтому перевод сохраняет его форму и не добавляет толкование.
- issue: Связь верёвок с невозможностью повернуться
  choice: 'Передать буквально: «и ты не повернёшься»'
  alternative: 'Передать результативно: «так что ты не сможешь повернуться»'
  rationale: Контекст допускает понимание физического ограничения, однако союз וְ и отрицательная глагольная форма прямо не выражают целевое «так что» или модальное «не сможешь». Более формальная передача сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавная буква в «Я» указывает на говорящего Бога согласно русской библейской издательской традиции. Формулировка избегает как церковнославянизмов, так и разговорной стилистики.
