base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/010.yaml
  text: And your food that you shall eat shall be by weight[a], twenty shekels a day[b]; from time to time you shall eat it.
translation:
  language: ru
  text: 'А пищу, которую будешь есть, ешь по весу: двадцать шекелей[a] в день; ешь её от времени до времени[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шекель здесь — мера веса, а не обязательно монета.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «от времени до времени»; возможно, речь идёт о приёмах пищи через определённые промежутки времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכָלְךָ
  choice: пищу
  rationale: Слово обозначает пищу, то, что едят; «пища» естественно и достойно звучит в данном предписании.
- source_word: אֲשֶׁר תֹּאכֲלֶנּוּ
  choice: которую будешь есть
  rationale: Относительное придаточное уточняет пищу, а будущее время передаёт предписывающую силу еврейского имперфекта.
- source_word: בְּמִשְׁקוֹל
  choice: по весу
  rationale: מִשְׁקוֹל прямо указывает на вес; выражение передаёт нормирование рациона взвешиванием.
- source_word: עֶשְׂרִים שֶׁקֶל
  choice: двадцать шекелей
  rationale: Сохранена древняя единица веса без приблизительного пересчёта в основном тексте.
- source_word: לַיּוֹם
  choice: в день
  rationale: Естественно передаёт распределительное значение суточной нормы.
- source_word: מֵעֵת עַד עֵת
  choice: в назначенное время
  rationale: Идиома указывает на определённые, установленные моменты приёма пищи; перевод не создаёт современного значения «иногда», возможного у буквального русского выражения «время от времени».
- source_word: תֹּאכֲלֶנּוּ
  choice: ешь её
  rationale: Повтор глагола сохранён и передаёт заключительное повелительное предписание.
