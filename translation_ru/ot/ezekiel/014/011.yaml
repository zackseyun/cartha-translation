base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/011.yaml
  text: so that the house of Israel may no longer go astray from me[a], and may no longer defile themselves with all their transgressions, but may be my people, and I may be their God, declares the Lord GOD.
translation:
  language: ru
  text: чтобы дом Израиля больше не уклонялся от следования за Мной[a] и больше не осквернял себя всеми своими преступлениями, и чтобы они были Моим народом, а Я был их Богом, — возвещает Господь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не блуждал больше от Меня»; еврейское выражение «от позади Меня» означает отступление от следования за Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение союза и естественно связывает стих с предшествующим контекстом.
- source_word: יִתְעוּ ... מֵאַחֲרַי
  choice: не уклонялся от следования за Мной
  rationale: Сохраняет значение תעה «сбиваться, блуждать, уклоняться» и образ следования, выраженный буквально как «из-за/от позади Меня».
- source_word: יִטַּמְּאוּ
  choice: не осквернял себя
  rationale: 'Передаёт рефлексивное значение формы: нечистота навлекается самим Израилем; выражение допускает нравственный и культовый оттенки.'
- source_word: בְּכָל פִּשְׁעֵיהֶם
  choice: всеми своими преступлениями
  rationale: Творительный падеж естественно передаёт инструментальное ב; «преступления» сохраняет серьёзный смысл פשׁע как нарушения и мятежа против Бога.
- source_word: וְהָיוּ לִי לְעָם
  choice: чтобы они были Моим народом
  rationale: Сохраняет формулу заветных отношений и зависимость от целевого לְמַעַן.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: а Я был их Богом
  rationale: Продолжает целевую конструкцию в естественном русском сослагательном оформлении и сохраняет формулу завета.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם; «Владыка» различает אֲדֹנָי от личного имени Яхве и избегает неестественного сочетания «Господь Господь».
theological_decisions:
- issue: Формула завета
  choice: Моим народом ... их Богом
  alternative: народом для Меня ... Богом для них
  rationale: Привычная русская формула точно выражает взаимные отношения завета, не добавляя доктринального истолкования.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача личного имени как «Яхве» сохраняет различие между титулом אֲדֹנָי и тетраграмматоном; «Владыка» звучит достойно и ясно.
- issue: Целевой или будущий оттенок формулы
  choice: чтобы они были ... а Я был
  alternative: и будут ... и Я буду
  rationale: Грамматическая зависимость от לְמַעַן поддерживает целевой оттенок; простой будущий также возможен по смыслу, но слабее обозначает синтаксическую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Единственное число у сказуемых «уклонялся», «осквернял» согласовано с собирательным «дом Израиля»; далее множественное «они» естественно раскрывает народ как совокупность людей. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому регистру.
