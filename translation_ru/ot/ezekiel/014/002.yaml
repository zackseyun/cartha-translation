lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит очередное пророческое откровение; «И было» естественно сочетается в русском языке с устойчивой библейской формулой «слово ... ко мне».
- source_word: דְבַר
  choice: слово
  rationale: В сочетании דְבַר יְהוָה это стандартная пророческая формула; «слово» сохраняет её лексическую и богословскую выразительность, не заменяя его более толковательным «посланием».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, а не заменяет её титулом «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица единственного числа непосредственно означает «ко мне».
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данной формуле לֵאמֹר вводит следующую прямую речь; в современном русском его функцию естественно и точно передаёт двоеточие без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя. «Яхве» сохраняет это имя; традиционная замена «Господь» отмечена в сноске, а «Иегова» является менее вероятной формой произношения.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. Инфинитив לֵאמֹר функционально передан двоеточием, поскольку далее следует прямая речь.
