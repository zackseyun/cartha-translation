language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/הָיוּ שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ בְּ/תוֹכָ֔/הּ נֹ֖חַ דנאל וְ/אִיּ֑וֹב הֵ֤מָּה בְ/צִדְקָתָ/ם֙ יְנַצְּל֣וּ נַפְשָׁ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/014.yaml
  text: even if these three men were in its midst—Noah[a], Daniel, and Job—they would deliver only themselves by their righteousness, declares the Lord GOD.
translation:
  language: ru
  text: Даже если бы в ней находились эти три человека — Ной, Даниил[a] и Иов, — своей праведностью они спасли бы лишь себя, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское написание דנאל можно передать и как «Данел»; некоторые считают, что здесь имеется в виду древневосточный праведник Данел, а не библейский Даниил.
    reason: Альтернативное чтение и неустранимая неоднозначность идентификации имени.
lexical_decisions:
- source_word: וְהָיוּ
  choice: даже если бы… находились
  rationale: В контексте речи о суде сочетание союза с перфектом имеет уступительно-условный смысл; русская конструкция естественно передаёт нереальное условие.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: эти три человека
  rationale: Передаёт указательность и конкретное число; «человека» здесь естественно по-русски и не устраняет мужской пол названных лиц.
- source_word: בְּתוֹכָהּ
  choice: среди неё
  rationale: Суффикс женского рода отсылает к земле в ближайшем контексте; выражение сохраняет местоименную связь и звучит естественно.
- source_word: נֹחַ
  choice: Ной
  rationale: Традиционная русская форма библейского имени.
- source_word: דנאל
  choice: Даниил[a]
  rationale: В основном тексте сохранена привычная библейская форма; отсутствие йода в еврейском написании и возможное чтение «Данел» отмечены в сноске.
- source_word: וְאִיּוֹב
  choice: и Иов
  rationale: Традиционная русская форма имени с сохранением союза.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение несёт эмфазу; в русском она дополнительно выражена сочетанием «только самих себя».
- source_word: בְצִדְקָתָם
  choice: своей праведностью
  rationale: «Праведность» точно передаёт личную нравственную правоту, а творительный падеж — инструментальное значение предлога בְּ.
- source_word: יְנַצְּלוּ
  choice: спасли бы
  rationale: Глагол означает избавить или вырвать из опасности. «Спасли бы» здесь относится к избавлению от суда и естественно сочетается с возвратным выражением, не требуя узкого догматического смысла.
- source_word: נַפְשָׁם
  choice: только самих себя
  rationale: נֶפֶשׁ здесь обозначает самих людей или их жизнь; контекст подчёркивает, что их праведность не избавила бы других.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם; «Владыка Яхве» различает титул אֲדֹנָי и личное имя יהוה, избегая повтора «Господь Господь».
theological_decisions:
- issue: Передача составного божественного именования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה. Такое различение сохраняет структуру исходного выражения и не подменяет имя общим титулом.
- issue: Идентификация דנאל
  choice: Даниил в основном тексте со сноской
  alternative: Данел
  rationale: Написание דנאל допускает передачу «Данел» и возможную связь с древневосточным персонажем; текст не решает вопрос однозначно. Традиционная форма оставлена в тексте, а реальная неоднозначность явно сохранена в сноске.
- issue: Характер избавления посредством праведности
  choice: своей праведностью они спасли бы только самих себя
  alternative: они сохранили бы свои жизни благодаря своей праведности
  rationale: Формулировка сохраняет прямую инструментальную связь праведности с избавлением в данном суде, не превращая её ни в общее учение о вечном спасении, ни в отвлечённую нравственную оценку.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Условная конструкция сделана естественной, тире выделяют перечень и заключительную формулу. Слово «праведность» сохранено как ключевой богословский термин, а имя Яхве передано явно.
