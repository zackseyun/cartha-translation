source:
  edition: WLC
  text: וְ/נֹ֨חַ דנאל וְ/אִיּוֹב֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בֵּ֥ן אִם בַּ֖ת יַצִּ֑ילוּ הֵ֥מָּה בְ/צִדְקָתָ֖/ם יַצִּ֥ילוּ נַפְשָֽׁ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/020.yaml
  text: Even if Noah[a], Daniel, and Job were in it, as I live, declares the Lord GOD, they would deliver neither son nor daughter; by their righteousness they would deliver only themselves.
translation:
  language: ru
  text: 'Даже если бы в ней были Ной, Даниил[a] и Иов, — жив Я! — возвещает Владыка Яхве: ни сына, ни дочь они не спасли бы; своей праведностью они спасли бы только самих себя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское דנאל можно также прочитать как «Данэл»; возможно, имеется в виду древний праведник, а не известный библейский Даниил.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹכָהּ
  choice: в ней
  rationale: Местоименный суффикс женского рода отсылает к земле в ближайшем контексте; «в ней» естественно передаёт и референцию, и местное значение.
- source_word: חַי אָנִי נְאֻם אֲדֹנָי יְהוִה
  choice: жив Я! — возвещает Владыка Яхве
  rationale: Формула передаёт торжественную божественную клятву. «Возвещает» уместно для пророческого נְאֻם, а «Владыка Яхве» различает титул אֲדֹנָי и личное имя יהוה.
- source_word: אִם בֵּן אִם בַּת
  choice: ни сына, ни дочь
  rationale: После клятвенной формулы конструкция אִם...אִם выражает решительное отрицание; русская конструкция с повтором «ни» сохраняет эту эмфазу.
- source_word: יַצִּילוּ
  choice: спасли бы
  rationale: Hiphil глагола נצל означает избавить или спасти от грозящего суда. Сослагательное наклонение естественно связано с гипотетическим условием в начале стиха.
- source_word: בְצִדְקָתָם
  choice: своей праведностью
  rationale: Предлог ב обозначает средство или основание спасения; творительный падеж естественно передаёт инструментальный оттенок.
- source_word: נַפְשָׁם
  choice: самих себя
  rationale: נֶפֶשׁ здесь обозначает самих людей, то есть их жизнь, а не отдельно мыслимую нематериальную душу. Такое выражение также передаёт эмфатическое הֵמָּה.
- source_word: דנאל
  choice: Даниил
  rationale: Традиционное понимание имени сохранено в основном тексте, однако необычное написание без йода допускает чтение «Данэл»; эта реальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה, не смешивая два элемента сочетания.
- issue: Личность דנאל
  choice: Даниил в основном тексте с вариантом «Данэл» в сноске
  alternative: Данэл как имя древнего праведника
  rationale: Само написание допускает обе идентификации и не решает вопрос окончательно; основной текст следует узнаваемой традиции, а сноска сохраняет подлинную историко-лексическую неоднозначность.
- issue: Действие праведности трёх мужей
  choice: их праведность спасает только их самих
  alternative: их заслуга распространяется на детей или окружающих
  rationale: Повтор יַצִּילוּ и объект נַפְשָׁם прямо ограничивают избавление самими праведниками; перевод не расширяет это действие на других.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Инверсия «жив Я» сохранена как формула клятвы; синтаксис остаётся ясным для широкого читателя.
