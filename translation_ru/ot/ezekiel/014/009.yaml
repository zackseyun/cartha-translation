  text: וְ/הַ/נָּבִ֤יא כִֽי יְפֻתֶּה֙ וְ/דִבֶּ֣ר דָּבָ֔ר אֲנִ֤י יְהוָה֙ פִּתֵּ֔יתִי אֵ֖ת הַ/נָּבִ֣יא הַ/ה֑וּא וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עָלָ֔י/ו וְ/הִ֨שְׁמַדְתִּ֔י/ו מִ/תּ֖וֹךְ עַמִּ֥/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/009.yaml
  text: And if the prophet is deceived and speaks a word[a], I, Yahweh, have deceived that prophet; and I will stretch out my hand against him and destroy him from the midst of my people Israel.
translation:
  language: ru
  text: А если пророк будет обманут и произнесёт слово, то Я, Яхве, обманул того пророка[a]. Я простру руку против него и истреблю его из среды Моего народа Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обольстил того пророка»; некоторые понимают это в более допускающем смысле: «допустил, чтобы тот пророк был обманут».'
    reason: Сохраняет альтернативный оттенок корня פתה и отмечает допускающее толкование, не подменяя им прямое утверждение основного текста.
lexical_decisions:
- source_word: יְפֻתֶּה
  choice: будет обманут
  rationale: 'Пуаль глагола פתה имеет пассивное значение: пророк подвергается обману или обольщению. «Будет обманут» ясно передаёт форму и соответствует контексту суда.'
- source_word: וְדִבֶּר דָּבָר
  choice: и скажет слово
  rationale: Сохраняет краткость еврейского выражения и характерную пророческую лексику; в современном русском звучит естественно.
- source_word: אֲנִי יְהוָה
  choice: Я, Яхве
  rationale: Отдельное местоимение перед Божьим именем создаёт эмфазу. Транслитерация «Яхве» прямо передаёт имя יהוה и согласуется с предоставленным английским текстом стиха.
- source_word: פִּתֵּיתִי
  choice: обманул
  rationale: Пиэль того же корня פתה прямо приписывает действие Яхве. Перевод не смягчает причинную формулировку и сохраняет богословское напряжение исходного текста.
- source_word: וְנָטִיתִי אֶת יָדִי עָלָיו
  choice: Я протяну руку против него
  rationale: Близко передаёт устойчивый образ Божьего действия в суде и остаётся понятным современному читателю.
- source_word: וְהִשְׁמַדְתִּיו
  choice: и истреблю его
  rationale: Глагол שׁמד в хифиле обозначает уничтожение или истребление; «истреблю» передаёт силу выражения без разговорной окраски.
- source_word: מִתּוֹךְ עַמִּי יִשְׂרָאֵל
  choice: из среды Моего народа Израиля
  rationale: Сохраняет пространственный образ удаления изнутри народа и торжественный библейский регистр, оставаясь понятным.
theological_decisions:
- issue: Божественное действие в обмане пророка
  choice: 'Сохранено прямое утверждение: «Я, Яхве, обманул того пророка».'
  alternative: «Я допустил, чтобы тот пророк был обманут» или «Я обольстил того пророка».
  rationale: Еврейский текст прямо называет Яхве субъектом глагола того же корня, которым описано состояние пророка. Основной текст сохраняет эту напряжённую формулировку, а возможные смысловые оттенки вынесены в сноску.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис в основном следует еврейскому тексту, но разделение на два предложения облегчает чтение. Прямое «обманул» намеренно сохраняет неоднозначность и богословское напряжение.
