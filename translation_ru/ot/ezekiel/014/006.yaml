  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה שׁ֣וּבוּ וְ/הָשִׁ֔יבוּ מֵ/עַ֖ל גִּלּֽוּלֵי/כֶ֑ם וּ/מֵ/עַ֥ל כָּל תּוֹעֲבֹתֵי/כֶ֖ם הָשִׁ֥יבוּ פְנֵי/כֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/006.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: Turn back, and turn away from your idols[b], and turn your faces away from all your abominations.’'
translation:
  language: ru
  text: 'Поэтому скажи дому Израиля: «Так говорит Владыка Яхве: обратитесь и отвернитесь от ваших идолов; отверните лица от всех ваших мерзостей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Сохраняет логический вывод из предшествующего обличения и естественно вводит пророческое повеление.
- source_word: אֶל־בֵּית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Формально сохраняет заветно-национальное обозначение «дом Израиля», не заменяя его словом «израильтяне».
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся и точная русская передача пророческой формулы посланника.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Передаёт сочетание титула אֲדֹנָי и личного имени יהוה, избегая неестественного повтора «Господь ГОСПОДЬ»; прописные буквы отмечают божественное имя.
- source_word: שׁוּבוּ
  choice: обратитесь
  rationale: Передаёт одновременно направительный образ возвращения и контекстуальный призыв к покаянию, не сводя многозначный глагол к одному техническому термину.
- source_word: וְהָשִׁיבוּ מֵעַל גִּלּוּלֵיכֶם
  choice: и отвернитесь от ваших идолов
  rationale: Естественно передаёт каузативную форму שׁוב как сознательное удаление от идолов; «идолы» сохраняет устойчивое контекстуальное значение презрительного גִּלּוּלִים.
- source_word: וּמֵעַל כָּל תּוֹעֲבֹתֵיכֶם הָשִׁיבוּ פְנֵיכֶם
  choice: и от всех ваших мерзостей отвратите свои лица
  rationale: Сохраняет эмфатический порядок заключительной фразы, полноту «всех» и телесно-направительный образ обращения лица.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  alternative: Владыка Яхве
  rationale: Основной текст следует распространённому русскому типографскому обозначению Тетраграмматона прописными буквами, одновременно различая титул и имя. Возможная передача имени «Яхве» не вносится без необходимости.
- issue: Смысл שׁוּבוּ в пророческом призыве
  choice: обратитесь
  alternative: покайтесь / возвратитесь
  rationale: «Обратитесь» сохраняет как буквальный образ перемены направления, так и смысл заветного покаяния, не устраняя заложенную в еврейском слове многозначность.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм и повтор глаголов обращения сохранены; архаические формы и конфессионально маркированная терминология не используются.
