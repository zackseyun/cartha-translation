base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/013.yaml
  text: Son of man[a], if a land sins against me by acting unfaithfully, and I stretch out my hand against it and break its supply of bread, and send famine upon it, and cut off from it man and beast[b],
translation:
  language: ru
  text: Сын человеческий, если страна согрешит против Меня, совершив вероломство, и Я простру на неё руку, лишу её хлебного снабжения[a], пошлю на неё голод и истреблю в ней людей и животных[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сломаю ей посох хлеба» — еврейский образ прекращения хлебного снабжения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человека и скот»; устойчивое выражение, охватывающее людей и животных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устойчивая формула обращения к Иезекиилю; сохраняет пророческий стиль и буквальный образ исходного текста.
- source_word: אֶרֶץ
  choice: какая-нибудь земля
  rationale: Существительное употреблено без артикля в общем условном высказывании; такая передача ясно выражает неопределённость, не сужая значение до современного государства.
- source_word: תֶחֱטָא לִי
  choice: согрешит против Меня
  rationale: Передаёт грех как направленный против Бога и естественно звучит по-русски.
- source_word: לִמְעָל מַעַל
  choice: вероломно нарушив верность
  rationale: Сочетание однокоренных слов усиливает мысль о неверности и предательском нарушении обязательств; перевод сохраняет эту интенсивность, не уточняя сверх текста форму проступка.
- source_word: וְנָטִיתִי יָדִי עָלֶיהָ
  choice: и Я простру на неё руку
  rationale: Сохраняет образ Божьего суда и возвышенный библейский регистр; местоимение относится к земле.
- source_word: וְשָׁבַרְתִּי לָהּ מַטֵּה לָחֶם
  choice: сокрушу у неё хлебную опору
  rationale: Сохраняет необычный еврейский образ «посоха хлеба» в понятной русской форме; смысл прекращения продовольственного обеспечения пояснён в сноске.
- source_word: וְהִשְׁלַחְתִּי בָהּ רָעָב
  choice: пошлю на неё голод
  rationale: רָעָב обозначает губительный голод; конструкция естественно передаётся по-русски как бедствие, посланное на землю.
- source_word: וְהִכְרַתִּי מִמֶּנָּה
  choice: истреблю на ней
  rationale: В контексте суда כרת означает решительное устранение или уничтожение; русское «истреблю» ясно передаёт тяжесть действия.
- source_word: אָדָם וּבְהֵמָה
  choice: людей и животных
  rationale: Передаёт собирательное אָדָם без гендерного сужения и сохраняет охват человеческих и животных обитателей земли.
theological_decisions:
- issue: Характер проступка, выраженного מַעַל
  choice: вероломное нарушение верности Богу
  alternative: общий грех или проступок в узком юридическом смысле
  rationale: Сочетание «согрешит против Меня» с усилительной однокоренной конструкцией указывает на серьёзную неверность Богу. Перевод сохраняет эту направленность и напряжение, не определяя конкретную форму отступничества.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим регистром. Формулы «Сын человеческий» и «простру руку» сохранены как узнаваемые библейские обороты; менее понятный образ «посоха хлеба» слегка прояснён в тексте и буквально приведён в сноске. Все маркеры сносок присутствуют в основном тексте.
