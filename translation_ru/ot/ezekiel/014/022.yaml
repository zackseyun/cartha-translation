  text: וְ/הִנֵּ֨ה נֽוֹתְרָה בָּ֜/הּ פְּלֵטָ֗ה הַֽ/מּוּצָאִים֮ בָּנִ֣ים וּ/בָנוֹת֒ הִנָּ/ם֙ יוֹצְאִ֣ים אֲלֵי/כֶ֔ם וּ/רְאִיתֶ֥ם אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וְ/נִחַמְתֶּ֗ם עַל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר הֵבֵ֖אתִי עָלֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/022.yaml
  text: Yet behold[a], a remnant will be left in it—those brought out, sons and daughters. Behold, they are coming out to you, and you will see their way and their deeds; and you will be comforted concerning the disaster that I brought upon Jerusalem[c][b], all that I brought upon it.
translation:
  language: ru
  text: 'Но вот, в нём останутся уцелевшие[a] — те, кого выведут оттуда: сыновья и дочери[b]. Вот, они выйдут к вам, и вы увидите их образ жизни и их поступки. Тогда вы будете утешены из-за бедствия[c], которое Я навёл на Иерусалим, — то есть из-за всего, что Я навёл на него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «останется спасшаяся группа» или «останется остаток».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыновья и дочери»; еврейский текст явно называет и тех и других, а не употребляет общее слово «дети».'
    reason: lexical_alternative
  - marker: c
    text: Здесь «бедствие» означает несчастье, постигшее Иерусалим как суд, а не нравственное зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Но вот
  rationale: Сочетание передаёт контекстуальный поворот после описания суда и сохраняет указательно-эмфатическую силу הִנֵּה.
- source_word: נוֹתְרָה בָּהּ פְּלֵטָה
  choice: в нём останутся уцелевшие
  rationale: פְּלֵטָה здесь обозначает уцелевших или спасшихся бегством людей; множественная форма по смыслу естественна по-русски. Местоимение «нём» согласовано с русским родом слова «Иерусалим».
- source_word: הַמּוּצָאִים
  choice: которых выведут оттуда
  rationale: 'Хофал-причастие от יצא имеет каузативно-пассивное значение: этих людей не просто описывают как выходящих, их выводят. «Оттуда» естественно обозначает исход из Иерусалима.'
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Сохранена явно названная в еврейском тексте пара, без обобщения словом «дети».
- source_word: הִנָּם יוֹצְאִים אֲלֵיכֶם
  choice: Вот, они выйдут к вам
  rationale: Сохраняются повторное эмфатическое הִנָּם, активное движение наружу и направленность к адресатам.
- source_word: דַּרְכָּם
  choice: их образ жизни
  rationale: В нравственно-пророческом контексте דֶּרֶךְ означает не только путь, но и поведение, уклад жизни. Выбор ясно передаёт смысл современному читателю.
- source_word: עֲלִילוֹתָם
  choice: их поступки
  rationale: Слово обозначает действия и деяния, здесь с нравственной оценкой; «поступки» звучит естественно и достаточно весомо.
- source_word: וְנִחַמְתֶּם עַל הָרָעָה
  choice: вы найдёте утешение в связи с бедствием
  rationale: Нифаль от נחם передаёт утешение, а עַל указывает на предмет или основание реакции. Формулировка не уточняет сверх текста, означает ли это утешение по поводу бедствия или в отношении него.
- source_word: הֵבֵאתִי עַל יְרוּשָׁלִַם
  choice: Я навёл на Иерусалим
  rationale: Русское «навести бедствие на» естественно передаёт судебный контекст идиомы בוא על и прямо сохраняет Божье действие.
- source_word: אֵת כָּל אֲשֶׁר הֵבֵאתִי עָלֶיהָ
  choice: со всем, что Я навёл на него
  rationale: Сохранено итоговое повторение, подчёркивающее полноту суда. Мужское местоимение соответствует грамматическому роду русского названия «Иерусалим».
theological_decisions:
- issue: Значение הָרָעָה применительно к Божьему суду
  choice: бедствие
  alternative: зло; несчастье
  rationale: В данном контексте слово обозначает постигшее Иерусалим губительное бедствие как суд, а не нравственное зло. Перевод сохраняет прямое указание на то, что бедствие навёл Бог, не приписывая Ему совершение нравственного зла.
- issue: Причина будущего утешения адресатов
  choice: Не разъяснять её внутри стиха
  alternative: Добавить, что поведение уцелевших докажет справедливость суда
  rationale: Следующий стих раскрывает связь между увиденным поведением и утешением. Здесь перевод сохраняет напряжение исходного текста и не вносит пояснение из контекста непосредственно в стих.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «Вот» и заключительное повторение «навёл» сохранены как элементы еврейской риторики. Формула «найдёте утешение в связи с» выбрана ради смысловой точности при некоторой неизбежной официальности; она не снимает неоднозначность предлога עַל.
