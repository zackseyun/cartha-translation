  text: א֛וֹ חֶ֥רֶב אָבִ֖יא עַל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אָמַרְתִּ֗י חֶ֚רֶב תַּעֲבֹ֣ר בָּ/אָ֔רֶץ וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/017.yaml
  text: Or if I bring a sword against that land and say[a], ‘Let a sword pass through the land,’ and I cut off from it man and beast,
translation:
  language: ru
  text: 'Или если Я наведу меч на ту землю и скажу: «Пусть меч пройдёт по этой земле», — и истреблю из неё людей и животных[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека и скот»; это устойчивое выражение означает уничтожение на земле и человеческой, и животной жизни.'
    reason: Пояснение буквальной формы и совокупного значения устойчивой еврейской пары.
lexical_decisions:
- source_word: אוֹ
  choice: Или если
  rationale: В контексте вводит ещё один условный случай суда; добавление «если» естественно передаёт условную силу последовательности.
- source_word: חֶרֶב
  choice: меч
  rationale: Сохраняет пророческий образ меча как обозначения войны и насильственного суда, не заменяя его толкованием.
- source_word: אָבִיא
  choice: наведу
  rationale: Каузативная форма означает «приведу, наведу»; «наведу меч» естественно по-русски выражает действие Бога и угрозу земле.
- source_word: עַל הָאָרֶץ הַהִיא
  choice: на ту землю
  rationale: Предлог в контексте суда передаёт направленность бедствия против земли; оборот «навести меч на землю» звучит естественно и сохраняет образ.
- source_word: וְאָמַרְתִּי
  choice: и скажу
  rationale: Будущее время согласуется с условной конструкцией и сохраняет прямую речь как властное Божье повеление.
- source_word: חֶרֶב תַּעֲבֹר בָּאָרֶץ
  choice: Пусть меч пройдёт по этой земле
  rationale: «Пусть» передаёт повелительно-желательное значение; образ проходящего по земле меча сохранён. Отсутствие артиклей в русском не требует решать английское различие между «a sword» и «the sword».
- source_word: וְהִכְרַתִּי
  choice: и истреблю
  rationale: В формуле суда глагол כרת означает удаление или уничтожение жизни; «истреблю» передаёт силу выражения естественнее, чем буквальное «отсеку».
- source_word: מִמֶּנָּה
  choice: на ней
  rationale: Местоимение относится к земле; русское «истреблю на ней» идиоматично выражает устранение её обитателей, обозначенное еврейским «из неё».
- source_word: אָדָם וּבְהֵמָה
  choice: людей и животных
  rationale: Передаёт совокупное значение устойчивой пары — человеческую и животную жизнь — современным понятным русским языком.
theological_decisions:
- issue: Обобщающее значение אָדָם в формуле суда
  choice: людей
  alternative: человека
  rationale: Здесь אָדָם обозначает людей вообще, а не отдельного мужчину или конкретного человека. Множественное число ясно передаёт обобщающий смысл, не сужая объём суда.
- issue: Образ меча как орудия Божьего суда
  choice: сохранён буквальный образ «меч»
  alternative: война
  rationale: Источник допускает понимание меча как метонимии войны, но прямо называет меч; перевод сохраняет образ и не устраняет его богословскую и поэтическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавное «Я» обозначает говорящего Бога. Пунктуация сохраняет незавершённость стиха как части более длинного условного предложения.
