  text: לָ/כֵ֣ן דַּבֵּר א֠וֹתָ/ם וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה אִ֣ישׁ אִ֣ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֡ל אֲשֶׁר֩ יַעֲלֶ֨ה אֶת גִּלּוּלָ֜י/ו אֶל לִבּ֗/וֹ וּ/מִכְשׁ֤וֹל עֲוֺנ/וֹ֙ יָשִׂים֙ נֹ֣כַח פָּנָ֔י/ו וּ/בָ֖א אֶל הַ/נָּבִ֑יא אֲנִ֣י יְהוָ֗ה נַעֲנֵ֧יתִי ל֦/וֹ ב/ה בְּ/רֹ֥ב גִּלּוּלָֽי/ו־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/004.yaml
  text: 'Therefore speak to them and say to them[a], ‘Thus says the Lord GOD: Any man of the house of Israel who brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet—I, Yahweh[c][b], will answer him according to the multitude of his idols.’'
translation:
  language: ru
  text: 'Поэтому говори с ними и скажи им: «Так говорит Владыка Яхве: всякий из дома Израиля, кто вознесёт своих идолов в своём сердце, поставит перед собой преткновение своего беззакония и придёт к пророку, — Я, Яхве, отвечу ему сообразно множеству его идолов[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская фраза в конце стиха трудна для истолкования. В ней есть неясное слово, буквально означающее «в ней» или «ею»; поэтому возможны переводы «отвечу ему ею» или «через неё», а не только «сообразно множеству его идолов».
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего обличения.
- source_word: דַּבֵּר אוֹתָם וְאָמַרְתָּ אֲלֵיהֶם
  choice: говори с ними и скажи им
  rationale: Сохраняет два еврейских глагола; конструкция דִּבֵּר אֶת допускает значение «говорить с».
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка Яхве
  rationale: Естественная пророческая формула; אֲדֹנָי передано титулом «Владыка», а יהוה — личным именем «Яхве».
- source_word: אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל
  choice: если кто-либо из дома Израиля
  rationale: Повтор אִישׁ имеет дистрибутивный смысл; «кто-либо» естественно передаёт условно-обобщающее значение без ненужного ограничения только мужчинами.
- source_word: יַעֲלֶה אֶת גִּלּוּלָיו אֶל לִבּוֹ
  choice: возведёт своих идолов в своё сердце
  rationale: «Возведёт» сохраняет направленную вверх образность Hiphil от עלה и необычный образ внутреннего возвышения идолов.
- source_word: גִּלּוּלָיו
  choice: своих идолов
  rationale: Передаёт основной смысл термина; его презрительная окраска по-русски не усиливается добавочным определением.
- source_word: וּמִכְשׁוֹל עֲוֺנוֹ יָשִׂים נֹכַח פָּנָיו
  choice: поставит перед собой преткновение, ведущее его к беззаконию
  rationale: Сохраняет метафору מכשול и делает понятной связь с עוון, не отождествляя полностью преткновение и само беззаконие.
- source_word: וּבָא אֶל הַנָּבִיא
  choice: и придёт к пророку
  rationale: Прямо передаёт последовательность действий без добавочного толкования мотива.
- source_word: אֲנִי יְהוָה נַעֲנֵיתִי לוֹ
  choice: то Я, Яхве, Сам отвечу ему
  rationale: Русское будущее соответствует характеру божественного постановления; «Сам» передаёт эмфатическое אֲנִי.
- source_word: בָהּ בְּרֹב גִּלּוּלָיו
  choice: сообразно множеству его идолов
  rationale: Передаёт вероятный судебный смысл ответа, соответствующего идолопоклонству, при этом трудность конструкции отмечена в сноске.
theological_decisions:
- issue: Передача יהוה
  choice: Яхве
  alternative: Господь
  rationale: Сохраняется собственное covenantное имя, отличное от титула אֲדֹנָי; выражение אֲדֹנָי יְהוִה поэтому передано как «Владыка Яхве».
- issue: Адресат выражения אִישׁ אִישׁ
  choice: кто-либо из дома Израиля
  alternative: каждый мужчина из дома Израиля
  rationale: Повтор имеет дистрибутивную функцию. Контекст формулирует правило для отдельного израильтянина; нейтральное русское местоимение сохраняет обобщённость, не добавляя богословского ограничения по полу.
- issue: Характер ответа Бога в трудной фразе נַעֲנֵיתִי לוֹ בָהּ בְּרֹב גִּלּוּלָיו
  choice: Сам отвечу ему сообразно множеству его идолов
  alternative: дам ему ответ через это / позволю ему вопросить Меня, несмотря на множество его идолов
  rationale: Контекст поддерживает судебный ответ, соответствующий идолопоклонству человека, однако синтаксическая роль בָהּ действительно неясна и потому не скрыта от читателя.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим регистром. Сохранены конкретные образы сердца, преткновения и множества идолов; тяжеловесные кальки смягчены лишь там, где они затемняли бы смысл.
