source:
  edition: WLC
  text: וְ/נָתַתִּ֨י פָנַ֜/י בָּ/אִ֣ישׁ הַ/ה֗וּא וַ/הֲשִֽׂמֹתִ֨י/הוּ֙ לְ/א֣וֹת וְ/לִ/מְשָׁלִ֔ים וְ/הִכְרַתִּ֖י/ו מִ/תּ֣וֹךְ עַמִּ֑/י וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/008.yaml
  text: And I will set my face against that man[a], and I will make him a sign and a proverb, and I will cut him off from the midst of my people. Then you will know that I am Yahweh.
translation:
  language: ru
  text: Я обращу Своё лицо против этого человека, сделаю его знамением и предметом поговорок и отсеку его из среды Моего народа. Тогда вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּאִישׁ הַהוּא
  choice: Я обращу Своё лицо против этого человека
  rationale: Сохранён конкретный древнееврейский образ лица как выражение решительного противодействия и суда; предлог «против» передаёт враждебную направленность оборота.
- source_word: הָאִישׁ הַהוּא
  choice: этого человека
  rationale: Еврейская форма — мужского рода, единственного числа и указывает на конкретного человека, о котором говорится в контексте.
- source_word: וַהֲשִׂמֹתִיהוּ
  choice: сделаю его
  rationale: В сочетании с последующими именными характеристиками глагольная форма естественно передаётся по-русски как придание человеку определённого значения или положения.
- source_word: לְאוֹת
  choice: знамением
  rationale: '«Знамение» сохраняет широкий смысл אוֹת: видимый знак, который в данном контексте становится свидетельством Божьего суда; уточнение «предостерегающим» не внесено в основной текст.'
- source_word: וְלִמְשָׁלִים
  choice: и предметом притч
  rationale: Оборот сохраняет множественное число еврейского слова и передаёт мысль, что судьба человека станет содержанием общеизвестных изречений. Возможные оттенки насмешки и позора отмечены в сноске.
- source_word: וְהִכְרַתִּיו
  choice: и отсеку его
  rationale: «Отсеку» сохраняет образ и суровость глагола כרת, не сужая его заранее до физического уничтожения или только до исключения из общины.
- source_word: מִתּוֹךְ עַמִּי
  choice: из среды Моего народа
  rationale: Формулировка сохраняет пространственный образ пребывания внутри народа и соответствует торжественному контексту суда.
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: '«Тогда» естественно выражает результативную связь: совершившийся суд приведёт адресатов к признанию того, кто есть Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является принятой современной русской транслитерацией тетраграмматона.
theological_decisions:
- issue: Антропоморфный образ Божьего лица в формуле суда
  choice: Я обращу Своё лицо против этого человека
  alternative: Я выступлю против этого человека
  rationale: Основной вариант сохраняет образность исходного текста и выражает активное Божье противодействие, не сводя выражение к отвлечённому отношению.
- issue: Смысл מְשָׁלִים в контексте суда
  choice: предметом притч
  alternative: притчей во языцех; посмешищем; предметом поговорок
  rationale: Выбранный вариант удерживает основное значение слова и его еврейское множественное число. Более узкий оттенок позорной поговорки или насмешки возможен, но не навязан основному тексту и отражён в сноске.
- issue: Характер наказания в וְהִכְרַתִּיו
  choice: отсеку его из среды Моего народа
  alternative: истреблю его из среды Моего народа; удалю его из Моего народа
  rationale: '«Отсеку» сохраняет намеренную многозначность формулы: она несомненно означает суровое устранение из народа, но сама по себе не требует молча уточнять способ наказания.'
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаизированной интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы. Конкретные образы «лица», «знамения» и «отсечения» сохранены; выражение «притчей во языцех» отвергнуто как архаичное.
