  source_fidelity: В целом перевод точно передаёт формулу суда, образ «лица», знамение, отсечение из народа и заключительную формулу познания Яхве. Однако מְשָׁלִים в данном контексте естественнее передать как общественные поговорки/присловья о наказанном человеке, а не как «притчи» в обычном современном значении повествовательных или поучительных притч.
  naturalness: «Я обращу Своё лицо против этого человека» и «отсеку его из среды Моего народа» звучат литературно и соответствуют торжественному регистру. Оборот «предметом притч» понятен, но в современном русском менее естественен и способен вызвать неверную ассоциацию с жанром притчи. «Предметом поговорок» яснее в данном контексте.
  terminology: «Знамение», «отсеку», «из среды Моего народа» и «Яхве» сохранены удачно. Прописное написание местоимений, относимых к Богу, последовательно в рамках выбранной редакционной нормы.
