  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Вав-последовательный с היה вводит очередное событие повествования; формула «И было…» естественно сохраняет последовательность и возвышенный пророческий регистр.
- source_word: דְבַר
  choice: слово
  rationale: В пророческой формуле דָּבָר означает обращённое к пророку Божье слово; «слово» точно передаёт устойчивую формулу, не усиливая толкование до «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица обозначает направленность речи к пророку; «ко мне» — нормативная русская форма в сочетании «слово было ко мне».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь. В современном русском двоеточие передаёт эту функцию естественнее буквального «говоря» и избегает тяжеловесности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом; «Иегова» отражает более позднее смешанное чтение.
translation_notes:
  register: Современный литературный русский с сохранением краткой торжественной формулы пророческой речи. Двоеточие функционально передаёт לֵאמֹר и непосредственно вводит продолжение откровения в следующем стихе.
