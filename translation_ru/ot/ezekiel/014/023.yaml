  text: וְ/נִחֲמ֣וּ אֶתְ/כֶ֔ם כִּֽי תִרְא֥וּ אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וִֽ/ידַעְתֶּ֗ם כִּי֩ לֹ֨א חִנָּ֤ם עָשִׂ֨יתִי֙ אֵ֣ת כָּל אֲשֶׁר עָשִׂ֣יתִי בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/023.yaml
  text: And they will comfort you when you see their ways and their deeds[a], and you will know that I have not done without cause all that I did in it[c][b], declares the Lord GOD.
translation:
  language: ru
  text: Они утешат вас, когда вы увидите их пути и поступки[a], и вы узнаете, что Я не без причины сделал всё, что сделал в нём[b][c], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они станут для вас утешением»; еврейская форма допускает понимание, при котором уцелевшие служат источником утешения, когда становится виден их образ жизни.'
    reason: lexical_alternative
  - marker: b
    text: То есть в Иерусалиме.
    reason: referent_clarification
  - marker: c
    text: 'Возможный контекстуальный перевод: «Я не без причины сделал с Иерусалимом всё, что сделал». Буквально: «в нём».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִחֲמוּ אֶתְכֶם
  choice: они утешат вас
  rationale: 'Сохранена наиболее прямая синтаксическая связь: уцелевшие выступают теми, через кого изгнанники получают утешение. Примечание отражает допустимый оттенок значения — они станут для адресатов источником утешения.'
- source_word: כִּי תִרְאוּ
  choice: когда вы увидите
  rationale: כִּי здесь естественно понимать как указание на обстоятельство и момент, при котором наступит утешение; причинный оттенок при этом остаётся понятен из контекста.
- source_word: דַּרְכָּם וְאֶת עֲלִילוֹתָם
  choice: их пути и поступки
  rationale: «Пути» сохраняет образное обозначение образа жизни, а «поступки» передаёт конкретные действия и их нравственную окраску, не добавляя в основной текст оценки, выраженной лишь контекстом.
- source_word: לֹא חִנָּם
  choice: не без причины
  rationale: В данном контексте речь не о бесполезности Божьих действий, а о том, что суд над Иерусалимом не был произвольным или необоснованным. Поэтому «не без причины» точнее, чем двусмысленное «не напрасно».
- source_word: עָשִׂיתִי אֵת כָּל אֲשֶׁר עָשִׂיתִי
  choice: Я ... сделал всё, что сделал
  rationale: Повтор глагола сохранён как средство смыслового усиления и указания на всю совокупность совершённого Богом.
- source_word: בָהּ
  choice: в нём
  rationale: Предлог ב передан буквально; местоимение согласовано в русском с Иерусалимом как городом. Возможное контекстуальное значение «с ним» или «против него» вынесено в примечание.
- source_word: נְאֻם אֲדֹנָי יְהוָה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт устойчивую пророческую формулу נְאֻם, «Владыка» — титул אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и отличает его от титула.
theological_decisions:
- issue: Каким образом уцелевшие утешат изгнанников
  choice: Их видимый образ жизни и поступки покажут обоснованность суда над Иерусалимом и тем самым принесут адресатам утешение.
  alternative: Они утешат адресатов просто самим фактом своего спасения либо адресаты утешатся сами при виде их.
  rationale: Последующая фраза прямо связывает увиденное поведение уцелевших с признанием того, что действия Бога имели причину. Перевод сохраняет эту суровую, судебную природу утешения, не превращая его в сентиментальное утешение.
- issue: Передача אֲדֹנָי יְהוָה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה без введения конфессионально обусловленного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис оставлен ясным и сравнительно близким к еврейскому; сохранены повтор глагола «сделал» и выражение «пути и поступки». Формула «Владыка Яхве» передаёт различие между титулом и личным именем.
