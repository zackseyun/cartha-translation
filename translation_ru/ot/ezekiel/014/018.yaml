  to: И если бы эти три человека находились в ней — жив Я, возвещает Господь Яхве, — они не избавили бы ни сыновей, ни дочерей; были бы избавлены только они сами.
  rationale: Исправлен составной божественный титул, чтобы передать אֲדֹנָי и יהוה без добавления постороннего титула и последовательно отразить имя Яхве. «Спасли / спаслись» заменено на «избавили / были бы избавлены» ради более точного контекстуального значения נצל и сохранения повтора корня. Остальная структура сохраняет условный характер, торжественный регистр и исключительное «только они сами».
