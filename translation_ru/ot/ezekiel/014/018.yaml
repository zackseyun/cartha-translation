  text: וּ/שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֥א יַצִּ֖ילוּ בָּנִ֣ים וּ/בָנ֑וֹת כִּ֛י הֵ֥ם לְ/בַדָּ֖/ם יִנָּצֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/018.yaml
  text: And if these three men were in its midst[a], as I live, declares the Lord GOD, they would not deliver sons or daughters[b]; they alone would be delivered.
translation:
  language: ru
  text: И если бы эти три человека находились в ней — жив Я, возвещает Господь Яхве, — они не избавили бы ни сыновей, ни дочерей; были бы избавлены только они сами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: И если бы эти три человека
  rationale: Союз ו связывает стих с повторяющейся в контексте условной конструкцией; по-русски подразумеваемое условие естественно передаётся словами «если бы». אֲנָשִׁים обозначает именно трёх названных ранее мужчин, однако сочетание «три человека» звучит по-русски естественнее, чем «три мужчины», и не меняет референцию.
- source_word: בְּתוֹכָהּ
  choice: находились в ней
  rationale: Местоименный суффикс женского рода отсылает к земле, о которой говорится в контексте. Формулировка естественно передаёт значение «быть посреди неё», не добавляя нового референта.
- source_word: חַי אָנִי
  choice: жив Я
  rationale: Сохранена торжественная форма божественной клятвы и характерный для неё порядок слов.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Господь
  rationale: נְאֻם передано принятым для пророческой формулы глаголом «возвещает». Сочетание «Владыка Господь» различает אֲדֹנָי и יהוה и избегает неестественного повтора «Господь Господь».
- source_word: לֹא יַצִּילוּ בָּנִים וּבָנוֹת
  choice: они не спасли бы ни сыновей, ни дочерей
  rationale: Условное наклонение следует из синтаксического контекста. Парная отрицательная конструкция «ни… ни…» естественна по-русски и точно сохраняет прямое упоминание сыновей и дочерей.
- source_word: כִּי הֵם לְבַדָּם יִנָּצֵלוּ
  choice: спаслись бы только они сами
  rationale: '«Только они сами» передаёт исключительное значение לְבַדָּם и резкий контраст: избавление коснулось бы лишь этих троих. «Спаслись» сохраняет корневую связь с предшествующим «спасли».'
theological_decisions:
- issue: Характер спасения в данном контексте
  choice: спасли / спаслись
  alternative: избавили / были бы избавлены
  rationale: Формы נצל здесь относятся к избавлению от наступающего суда, а не уточняют вопрос вечного спасения. Русское «спасти» допускает такое конкретное значение, а повтор одного корня сохраняет связь между Hiphil и Niphal в еврейском тексте.
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Господь Яхве
  rationale: Выбранное чтение передаёт оба элемента титула, соответствует достоинству пророческой речи и не вводит конфессионально маркированного решения относительно произношения тетраграмматона.
- issue: Подразумеваемое условие
  choice: если бы
  alternative: и эти три человека находились бы
  rationale: Хотя отдельной частицы «если» в стихе нет, условный смысл задаётся параллельными формулами ближайшего контекста. Явное «если бы» делает русскую фразу понятной, не устраняя содержательной напряжённости стиха.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя; сохранены божественная клятва, условность, гендерно конкретная пара «сыновья и дочери» и лексическая связь двух форм נצל.
