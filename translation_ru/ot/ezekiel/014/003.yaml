  terminology: '«Сын человеческий» и «беззаконие» оправданно сохраняют терминологию книги. Для גִּלּוּלִים оставлено понятное «идолы», а его намеренно уничижительный оттенок вынесен в примечание. Вопрос передан без догматического усиления: отрицательный ожидаемый ответ остаётся имплицитным.'
