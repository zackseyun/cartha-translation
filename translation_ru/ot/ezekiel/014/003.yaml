base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/003.yaml
  text: Son of man[a], these men have set up their idols in their hearts and have placed the stumbling block of their iniquity before their faces[b]. Should I indeed let myself be consulted by them?
translation:
  language: ru
  text: Сын человеческий, эти люди установили своих идолов[a] в своих сердцах и поставили перед собой соблазн своего беззакония. Неужели Я позволю им вопрошать Меня?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «идолы», имеет резко уничижительный оттенок.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Неужели Я действительно дам им вопрошать Меня?» Повтор однокоренных форм в еврейском тексте усиливает вопрос и подразумевает отрицательный ответ.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивую форму обращения к Иезекиилю и её пророческое звучание.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: эти люди
  rationale: В контексте речь идёт о мужчинах-старейшинах, однако русское «люди» естественно передаёт אֲנָשִׁים и не меняет референт.
- source_word: הֶעֱלוּ גִלּוּלֵיהֶם עַל לִבָּם
  choice: возвели своих идолов в своих сердцах
  rationale: «Возвели» сохраняет образ поднятия или установления, а «в сердцах» естественно выражает внутреннюю приверженность; גִלּוּלִים — презрительное обозначение идолов.
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: преткновение своего беззакония
  rationale: Сохраняет образ причины падения и нравственную тяжесть עָוֹן, не сводя выражение только к вине или наказанию.
- source_word: נָתְנוּ נֹכַח פְּנֵיהֶם
  choice: поставили перед собой
  rationale: Естественная русская передача пространственного образа «перед их лицами» без ненужной буквальности.
- source_word: הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם
  choice: Неужели Я позволю им вопрошать Меня?
  rationale: Передаёт усиленный риторический вопрос, ожидающий отрицательного ответа, и значение обращения к Богу за ответом или пророческим указанием.
theological_decisions:
- issue: Ответ Бога идолопоклонникам, ищущим откровения
  choice: Неужели Я позволю им вопрошать Меня?
  alternative: Неужели Я дам им вопросить Меня?
  rationale: Риторическая форма сохраняет подразумеваемый отказ, не превращая его в отсутствующее в еврейском тексте прямое «нет».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим регистром. Традиционное обращение «Сын человеческий» и термин «беззаконие» сохранены; синтаксис сделан понятным для современного читателя.
