revisions:
- from: Сын человеческий, эти люди возвели своих идолов в своих сердцах и поставили перед собой преткновение своего беззакония. Неужели Я позволю им вопрошать Меня?[a]
  to: Сын человеческий, эти люди установили своих идолов[a] в своих сердцах и поставили перед собой соблазн своего беззакония. Неужели Я позволю им вопрошать Меня?[b]
