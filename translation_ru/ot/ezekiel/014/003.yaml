  source_fidelity: 'Основной смысл передан верно: обращение к пророку, внутреннее идолопоклонство, образ поставленного перед собой препятствия и усиленный риторический вопрос сохранены. Однако «возвели идолов в сердцах» по-русски неестественно для внутреннего, метафорического действия; «установили» точнее передаёт הֶעֱלוּ в данном контексте. Также следует отразить в примечании презрительную окраску גִּלּוּלִים.'
