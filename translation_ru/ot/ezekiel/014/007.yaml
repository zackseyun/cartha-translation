  text: כִּי֩ אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מֵ/הַ/גֵּר֮ אֲשֶׁר יָג֣וּר בְּ/יִשְׂרָאֵל֒ וְ/יִנָּזֵ֣ר מֵֽ/אַחֲרַ֗/י וְ/יַ֤עַל גִּלּוּלָי/ו֙ אֶל לִבּ֔/וֹ וּ/מִכְשׁ֣וֹל עֲוֺנ֔/וֹ יָשִׂ֖ים נֹ֣כַח פָּנָ֑י/ו וּ/בָ֤א אֶל הַ/נָּבִיא֙ לִ/דְרָשׁ ל֣/וֹ בִ֔/י אֲנִ֣י יְהוָ֔ה נַֽעֲנֶה לּ֖/וֹ בִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/007.yaml
  text: For any man from the house of Israel[a], or from the foreigner who sojourns in Israel, who separates himself from following me and brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet to inquire of me through him, I, Yahweh[d][c][b], will answer him myself.
translation:
  language: ru
  text: Ведь если кто-либо из дома Израиля[a] или из пришельцев, живущих в Израиле[b], отступит от Меня[c], вознесёт своих идолов в своём сердце и поставит перед собой камень преткновения своего беззакония, а затем придёт к пророку, чтобы через него вопросить Меня, то Я, Яхве, Сам отвечу ему[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек, человек»; повторение означает каждого отдельного человека, то есть «кто бы то ни было».'
    reason: lexical_alternative
  - marker: b
    text: «Пришелец» — не израильтянин, постоянно живущий среди народа Израиля.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «отделится от следования за Мной», то есть перестанет следовать за Яхве.'
    reason: lexical_alternative
  - marker: d
    text: 'Конец фразы можно передать также: «Я, Яхве, отвечу ему лично». Еврейское выражение кратко и подчёркивает, что ответ даст Сам Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: если кто-либо
  rationale: 'Повтор существительного имеет дистрибутивное значение: речь идёт о каждом отдельном человеке. Русское «кто-либо» естественно передаёт эту силу в условной конструкции.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: из дома Израиля
  rationale: Сохранено заветно-национальное выражение «дом Израиля», а не упрощённое «из Израиля».
- source_word: הַגֵּר ... יָגוּר
  choice: из пришельцев, живущих
  rationale: «Пришелец» обозначает не израильтянина, постоянно проживающего среди Израиля; причастный оборот естественно передаёт родственный глагол יָגוּר.
- source_word: וְיִנָּזֵר מֵאַחֲרַי
  choice: отступит от Меня
  rationale: Передаёт сознательное отделение и прекращение следования за Яхве; буквальное «отделится от следования за Мной» по-русски тяжеловесно.
- source_word: וְיַעַל גִּלּוּלָיו אֶל לִבּוֹ
  choice: возведёт своих идолов в своём сердце
  rationale: Сохранена пространственная метафора עלה и внутреннее средоточие приверженности — сердце.
- source_word: מִכְשׁוֹל עֲוֺנוֹ
  choice: преткновение, ведущее его к беззаконию
  rationale: Связь двух существительных допускает оттенки причины греха, вины и падения. Такой перевод сохраняет образ преткновения и делает вероятную причинную связь понятной, не отождествляя полностью препятствие с беззаконием.
- source_word: יָשִׂים נֹכַח פָּנָיו
  choice: поставит перед собой
  rationale: Естественный русский эквивалент буквального «перед своим лицом», сохраняющий образ намеренно помещённой перед собой причины падения.
- source_word: לִדְרָשׁ לוֹ בִי
  choice: чтобы через него вопросить Меня
  rationale: Пророк выступает посредником обращения; местоимение לוֹ соотнесено с человеком, который ищет для себя ответ, но в русском это не требуется выражать отдельно.
- source_word: נַעֲנֶה לוֹ בִּי
  choice: Сам отвечу ему
  rationale: Конечное בִּי компактно и неоднозначно, но подчёркивает личный ответ Яхве. «Сам» передаёт эмфазу без искусственного «посредством Себя».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ / Иегова
  rationale: В исходном тексте непосредственно стоит Тетраграмматон. «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Смысл מִכְשׁוֹל עֲוֺנוֹ
  choice: преткновение, ведущее его к беззаконию
  alternative: преткновение его беззакония / соблазн своего греха
  rationale: Еврейское сочетание допускает понимание как препятствия, связанного с беззаконием, так и причины дальнейшего греха и вины. Основной текст сохраняет нравственную причинность, а примечание отмечает буквальную неоднозначность.
- issue: Характер ответа Яхве в נַעֲנֶה לוֹ בִּי
  choice: Я, Яхве, Сам отвечу ему
  alternative: Я, Яхве, отвечу ему посредством Себя / отвечу ему о Себе
  rationale: Синтаксис подчёркивает, что ответ исходит непосредственно от Яхве, однако способ или содержание ответа в этой краткой формуле не следует уточнять сверх текста.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Сохранены выражения «дом Израиля», «сердце», «преткновение» и личное имя «Яхве»; синтаксис упрощён лишь настолько, чтобы длинное условное предложение оставалось ясным.
