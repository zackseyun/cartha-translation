base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/015.yaml
  text: If I cause dangerous wild animals to pass through the land[a], and they bereave it, and it becomes a desolation, without anyone passing through because of the animals[b],
translation:
  language: ru
  text: Если Я пущу по земле опасных диких зверей[a], и они лишат её жителей[b], и она станет пустыней, так что никто не будет проходить по ней из-за этих зверей,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «диких зверей»; буквально: «злого (губительного) зверя». Единственное число употреблено собирательно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и они сделают её бездетной». Земля олицетворена как мать, лишившаяся своих жителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֽוּ
  choice: Если
  rationale: Вводит гипотетическое условие в последовательности примеров суда; «если» естественно передаёт условность по-русски.
- source_word: חַיָּה רָעָה
  choice: хищных зверей
  rationale: Единственное число имеет собирательное значение и обозначает опасных диких животных; «хищные звери» звучит естественно и ясно передаёт угрозу.
- source_word: אַעֲבִיר בָּאָרֶץ
  choice: проведу по этой земле
  rationale: 'Каузативная форма глагола עבר сохраняет прямое действие Бога: Он заставляет зверей пройти по земле. Русское «проведу по земле» передаёт движение через её пределы.'
- source_word: וְשִׁכְּלָתָּהּ
  choice: и они лишат её жителей
  rationale: Глагол שׁכל означает лишение детей или утрату потомства; применительно к олицетворённой земле речь идёт о лишении её населения. Основной текст делает смысл понятным, а примечание сохраняет образ.
- source_word: וְהָיְתָה שְׁמָמָה
  choice: так что она станет безлюдной
  rationale: Передаёт итоговое опустошённое состояние земли естественным современным русским языком.
- source_word: מִבְּלִי עוֹבֵר
  choice: и никто не будет проходить по ней
  rationale: Причастная конструкция обозначает полное прекращение движения через землю; личная русская конструкция наиболее ясна.
- source_word: מִפְּנֵי הַחַיָּה
  choice: из-за зверей
  rationale: Предлог выражает причину, а звери отсылают к уже названной собирательной категории.
theological_decisions:
- issue: Действие Бога в суде
  choice: «Если Я проведу по этой земле хищных зверей»
  alternative: «Если Я пошлю на землю хищных зверей»
  rationale: Каузативная форма прямо представляет Бога действующим лицом суда; перевод не смягчает это до простого допущения.
- issue: Олицетворение земли как лишившейся детей
  choice: В основном тексте раскрыть значение как «лишат её жителей», сохранив буквальный образ в примечании
  alternative: «и они сделают её бездетной»
  rationale: Так читателю ясен реальный результат, но необычная и богословски выразительная метафора исходного текста не скрывается.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Стих является незавершённой условной частью предложения, поэтому в конце сохранена запятая. Все маркеры примечаний стоят непосредственно при соответствующих выражениях.
