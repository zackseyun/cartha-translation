  text: כִּי֩ כֹ֨ה אָמַ֜ר אֲדֹנָ֣/י יְהֹוִ֗ה אַ֣ף כִּֽי אַרְבַּ֣עַת שְׁפָטַ֣/י הָ/רָעִ֡ים חֶ֠רֶב וְ/רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וָ/דֶ֔בֶר שִׁלַּ֖חְתִּי אֶל יְרוּשָׁלִָ֑ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/021.yaml
  text: 'For thus says the Lord GOD: How much more when I send my four disastrous judgments against Jerusalem—sword and famine and wild beasts and plague—to cut off from it man and beast![a][b]'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: тем более, когда Я пошлю на Иерусалим четыре Моих губительных суда — меч, голод, диких зверей и мор, — чтобы истребить в нём людей и скот![a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четыре Моих суровых суда». Еврейское прилагательное здесь может означать «бедственные», «вредоносные» или «губительные».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моровую язву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента составного божественного титула, сохраняя личное имя Яхве и избегая неестественного «Господь Господь».
- source_word: אַף כִּי
  choice: тем более, когда
  rationale: Выражает усиленный вывод a fortiori из предыдущего стиха, а не простое условие.
- source_word: אַרְבַּעַת שְׁפָטַי הָרָעִים
  choice: четыре Моих губительных суда
  rationale: שְׁפָטִים обозначает здесь Божьи карательные действия, а רָעִים — их бедственный, разрушительный характер, не нравственное зло.
- source_word: חֶרֶב
  choice: меч
  rationale: Сохранён конкретный традиционный образ суда, без замены более общим словом «война».
- source_word: רָעָב
  choice: голод
  rationale: Обычное и естественное обозначение бедствия в данном пророческом контексте.
- source_word: חַיָּה רָעָה
  choice: лютые звери
  rationale: Передаёт опасность и губительность диких хищных животных, не приписывая им нравственного зла.
- source_word: דֶבֶר
  choice: моровая язва
  rationale: Сохраняет особое обозначение повальной смертоносной болезни в пророческой формуле; современная альтернатива отмечена в сноске.
- source_word: שִׁלַּחְתִּי
  choice: Я пошлю
  rationale: Хотя форма глагола перфектная, в пророческом высказывании она относится к предстоящему действию и естественно передаётся будущим временем.
- source_word: לְהַכְרִית
  choice: чтобы истребить
  rationale: Передаёт решительное уничтожение населения и животных; буквальное «отсечь» по-русски здесь неестественно.
- source_word: אָדָם וּבְהֵמָה
  choice: людей и скот
  rationale: Естественно передаёт устойчивую пару, охватывающую человеческое население и домашних животных.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Сохраняется явное личное имя Бога, присутствующее в еврейском тексте, тогда как «Владыка» естественно передаёт אֲדֹנָי.
- issue: Характер «четырёх судов»
  choice: губительные суды
  alternative: злые суды
  rationale: Прилагательное описывает бедствие и разрушительное действие наказаний, не подразумевая нравственного зла в Боге.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет усиленный переход от предыдущего стиха; перечисление оформлено тире. Заглавные местоимения при обращении Бога к Себе использованы согласно принятой русской библейской традиции.
