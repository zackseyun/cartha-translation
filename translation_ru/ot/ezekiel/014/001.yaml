  text: וַ/יָּב֤וֹא אֵלַ/י֙ אֲנָשִׁ֔ים מִ/זִּקְנֵ֖י יִשְׂרָאֵ֑ל וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/001.yaml
  text: Then some of the elders of Israel came to me and sat before me[a].
translation:
  language: ru
  text: И пришли ко мне некоторые из старейшин Израиля[a] и сели передо мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужи из старейшин Израиля»; то есть люди из числа старейшин, а не весь их состав.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: И пришли
  rationale: Нарративный וַ передан союзом «и». Хотя глагол в еврейском стоит в единственном числе перед подлежащим во множественном, по-русски требуется согласование во множественном числе.
- source_word: אֵלַי
  choice: ко мне
  rationale: Естественная передача направления движения, выраженного предлогом אֶל с суффиксом первого лица единственного числа.
- source_word: אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: некоторые из старейшин Израиля
  rationale: Сочетание אֲנָשִׁים с מן указывает на мужчин, принадлежавших к более широкой группе старейшин. По-русски «некоторые из старейшин» естественно передаёт выборочную, а не исчерпывающую отсылку.
- source_word: וַיֵּשְׁבוּ
  choice: и сели
  rationale: Передано основное контекстуальное значение ישׁב — принять сидячее положение; длительность пребывания дополнительно не подразумевается.
- source_word: לְפָנָי
  choice: передо мной
  rationale: Сохраняет пространственно-присутственное значение еврейского выражения и естественно звучит в сцене встречи с пророком.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение краткое и повествовательное. Формулировка «некоторые из старейшин» избегает неестественного буквального оборота «мужи из старейшин», сохраняя значение принадлежности к этой группе.
