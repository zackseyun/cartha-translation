  yaml_path: translation/ot/ezekiel/014/005.yaml
  text: so that I may seize the house of Israel by their heart[b][a], because all of them have turned away from me through their idols.
translation:
  language: ru
  text: чтобы овладеть домом Израиля через их сердце[a], ведь все они отвернулись от Меня посредством своих идолов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овладеть домом Израиля в их сердце». Еврейское выражение неоднозначно: сердце может обозначать сферу или средство Божьего действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ведь все они отчуждились от Меня своими идолами».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение союза естественным современным русским языком.
- source_word: תְּפֹשׂ
  choice: Мне схватить
  rationale: Сохраняет сильный образ захвата или удержания; первое лицо ясно из контекста речи Господа.
- source_word: אֶת בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет корпоративное и заветное обозначение народа, не сводя его просто к имени «Израиль».
- source_word: בְּלִבָּם
  choice: за сердце
  rationale: Русское выражение сохраняет образ того, что Бог хватает Израиль на уровне внутреннего человека. Единственное число отражает собирательную форму еврейского текста, хотя значение предлога остаётся неоднозначным.
- source_word: אֲשֶׁר
  choice: ведь
  rationale: В данном контексте вводит основание или поясняющее обстоятельство; «ведь» естественно связывает цель Божьего действия с отступничеством народа.
- source_word: נָזֹרוּ
  choice: отвернулись
  rationale: Ясно передаёт удаление и разрыв отношений, выраженные формой нифаль от זור, не устраняя оттенок отчуждения, отмеченный в сноске.
- source_word: מֵעָלַי
  choice: от Меня
  rationale: Точно выражает отделение от Господа.
- source_word: בְּגִלּוּלֵיהֶם
  choice: из-за своих идолов
  rationale: Передаёт идолов как средство или причину отчуждения естественным русским языком; возвратное «своих» ясно соотносит идолов с Израилем.
- source_word: כֻּלָּם
  choice: все они
  rationale: Сохраняет подчёркнутую всеобщность отступничества.
theological_decisions:
- issue: Образ Божьего действия по отношению к внутреннему человеку Израиля
  choice: схватить дом Израиля за сердце
  alternative: схватить дом Израиля в их сердце; овладеть домом Израиля через их сердце
  rationale: Основной текст сохраняет резкий образ Божьего захвата и связь с сердцем, не превращая его в простое убеждение. Неоднозначность предлога ב раскрывается в сноске.
- issue: Характер отступничества Израиля
  choice: отвернулись от Меня из-за своих идолов
  alternative: отчуждились от Меня посредством своих идолов
  rationale: «Отвернулись» понятно современному читателю и выражает сознательное удаление, а сноска сохраняет возможный результативный оттенок отчуждения в форме нифаль.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены корпоративное выражение «дом Израиля», сильная метафора глагола «схватить» и неоднозначность связи с сердцем; синтаксис сделан понятным без конфессионального истолкования.
