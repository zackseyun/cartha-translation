  source_fidelity: 'Основная проблема — «схватить дом Израиля за сердце»: русское «схватить за сердце» создаёт иной, почти телесный либо эмоционально-экспрессивный образ и не передаёт неопределённую функцию בְּלִבָּם («в/через их сердце»). Уместнее сохранить «дом Израиля» прямым объектом и выразить связь с сердцем как средство, отметив альтернативу в сноске. בְּגִלּוּלֵיהֶם естественнее передать как средство («с помощью/посредством идолов»), а не только как причину.'
