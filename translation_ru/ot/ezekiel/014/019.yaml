base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/019.yaml
  text: Or if I send a plague against that land and pour out my wrath on it with blood[a], to cut off from it man and beast,
translation:
  language: ru
  text: Или если Я пошлю мор на ту землю и изолью на неё мою ярость в крови[a], чтобы истребить с неё людей и животных,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кровопролитием». Буквально: «в крови».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Или если
  rationale: В последовательности условных описаний суда союз вводит ещё один возможный случай; «или если» естественно передаёт эту связь по-русски.
- source_word: דֶּבֶר
  choice: мор
  rationale: Слово обозначает губительную эпидемию как орудие суда. «Мор» краток, выразителен и соответствует возвышенному библейскому контексту.
- source_word: אֲשַׁלַּח אֶל־הָאָרֶץ הַהִיא
  choice: Я пошлю мор на ту землю
  rationale: Предлог אֶל буквально указывает направление; при глаголе «послать» русское «на ту землю» естественно и не требует добавлять враждебное «против».
- source_word: וְשָׁפַכְתִּי חֲמָתִי
  choice: и изолью ... Мою ярость
  rationale: Сохраняется исходная метафора излияния и сильная степень гнева, выраженная חֲמָה.
- source_word: בְּדָם
  choice: в крови
  rationale: Буквальная, намеренно сжатая формулировка сохраняет образ и неоднозначность еврейского выражения; возможное инструментальное понимание вынесено в примечание.
- source_word: לְהַכְרִית מִמֶּנָּה
  choice: чтобы истребить на ней
  rationale: В данном контексте הכרת означает уничтожить, устранить из земли. Русское «на ней» естественно указывает на исчезновение обитателей с этой земли.
- source_word: אָדָם וּבְהֵמָה
  choice: людей и животных
  rationale: Формула охватывает человеческую и животную жизнь. Множественные собирательные существительные звучат ясно и современно, не сужая אָדָם до мужчин, а בְּהֵמָה — только до домашнего скота.
theological_decisions:
- issue: Объём суда в формуле אָדָם וּבְהֵמָה
  choice: людей и животных
  alternative: человека и скот
  rationale: Выбранный вариант передаёт всеохватность суда над человеческой и животной жизнью, не вводя полового ограничения и не сужая категорию животных без достаточного основания.
- issue: Значение בְּדָם как способа проявления ярости
  choice: в крови с примечанием
  alternative: кровопролитием
  rationale: Еврейский текст допускает как яркий образ «в крови», так и инструментальное понимание «посредством кровопролития». Основной текст сохраняет напряжённую буквальность, а примечание — смысловую альтернативу.
translation_notes:
  register: Современный литературный русский с достоинством и сжатостью пророческой речи. Сохранены условное начало, метафора излияния ярости и неоднозначность בְּדָם; архаическое, но понятное «мор» уместно в контексте торжественного пророческого суда.
