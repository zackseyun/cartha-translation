  text: שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בָּנִ֥ים וְ/אִם בָּנ֖וֹת יַצִּ֑ילוּ הֵ֤מָּה לְ/בַדָּ/ם֙ יִנָּצֵ֔לוּ וְ/הָ/אָ֖רֶץ תִּהְיֶ֥ה שְׁמָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/016.yaml
  text: Even if these three men were in its midst[a], as I live, declares the Lord GOD, they would deliver neither sons nor daughters; they alone would be delivered, and the land would become a desolation.
translation:
  language: ru
  text: Даже если бы эти три человека находились в ней, — жив Я, возвещает Владыка Яхве, — они не спасли бы ни сыновей, ни дочерей; только они сами спаслись бы, а земля стала бы опустошённой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: эти три человека
  rationale: Точно передаёт указательное словосочетание; в контексте речь идёт о трёх названных ранее мужчинах, при этом современное русское «человека» звучит естественнее, чем «мужа».
- source_word: בְּתוֹכָהּ
  choice: находились в ней
  rationale: Передаёт присутствие внутри земли, о которой говорится в контексте; местоимение женского рода сохраняет связь со словом «земля».
- source_word: חַי אָנִי
  choice: жив Я
  rationale: Сохраняет торжественную формулу божественной клятвы и её традиционно понятную русскую форму.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם, «Владыка» — אֲדֹנָי, а «Яхве» непосредственно представляет личное имя יהוה без смешения двух титулов.
- source_word: אִם בָּנִים וְאִם בָּנוֹת יַצִּילוּ
  choice: они не спасли бы ни сыновей, ни дочерей
  rationale: В контексте клятвы повторённое אִם выражает решительное отрицание. «Спасли» естественно передаёт каузативную форму נצל и сохраняет связь с последующим пассивом.
- source_word: הֵמָּה לְבַדָּם יִנָּצֵלוּ
  choice: только они сами спаслись бы
  rationale: «Только» и «сами» совместно передают эмфатическое местоимение и לְבַדָּם, подчёркивая исключительность их спасения.
- source_word: וְהָאָרֶץ תִּהְיֶה שְׁמָמָה
  choice: а земля стала бы пустынной
  rationale: Передаёт результирующее состояние опустошённой земли естественным современным русским языком; противительное «а» ясно обозначает контраст между спасением людей и участью земли.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Передача «Яхве» сохраняет личное заветное имя, непосредственно присутствующее в еврейском тексте, а «Владыка» отличает предшествующий титул אֲדֹנָי.
- issue: Предел спасительного влияния праведников
  choice: они не спасли бы сыновей и дочерей, но спаслись бы лишь сами
  alternative: понимать сыновей и дочерей как неопределённых детей без возможной семейной связи
  rationale: Текст подчёркивает индивидуальный характер избавления при этом суде. Перевод не уточняет притяжательным местоимением, чьи именно это дети, и тем самым сохраняет формальную неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский с торжественным пророческим оттенком. Формула «жив Я» намеренно сохраняет библейскую возвышенность; остальной синтаксис сделан ясным и естественным для широкого круга читателей.
