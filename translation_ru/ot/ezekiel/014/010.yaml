    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: И понесут они
  rationale: Сочетание נשׂא с עון означает «нести вину» или «нести наказание за вину». Глагол «понесут» сохраняет еврейский образ и естественно звучит по-русски.
- source_word: עֲוֺנָם
  choice: наказание за свою вину
  rationale: עון охватывает проступок, виновность и последствие вины. В судебном контексте речь идёт о понесённой каре, однако добавление «за свою вину» сохраняет нравственно-правовую составляющую слова.
- source_word: כַּעֲוֹן
  choice: наказание ... будет таким же, как наказание
  rationale: Префикс כ выражает сравнение и соответствие. Такая формулировка ясно передаёт равенство участи вопрошающего и пророка.
- source_word: הַדֹּרֵשׁ
  choice: вопрошающего
  rationale: В контексте דרש обозначает человека, обращающегося к пророку за ответом. «Вопрошающий» точно и достаточно естественно передаёт это значение, не добавляя отсутствующего в тексте прямого дополнения.
- source_word: הַנָּבִיא
  choice: пророка
  rationale: Обычный и контекстуально точный эквивалент נביא.
- source_word: יִהְיֶה
  choice: будет
  rationale: Простая связочная форма будущего времени, естественно передаваемая русским «будет».
theological_decisions:
- issue: Значение עון в формуле суда
  choice: В основном тексте — «наказание за вину» с повторением «наказание» во второй части.
  alternative: '«И понесут они свою вину: вина вопрошающего будет такой же, как вина пророка».'
  rationale: В сочетании «нести עון» слово может указывать как на вину, так и на её карательное последствие. Контекст Божьего суда поддерживает значение наказания, но формулировка «за свою вину» и сноска сохраняют присущую еврейскому слову неоднозначность и не разрывают связь между виновностью и последствием.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой судебной речи. Инверсия «понесут они» слегка подчёркивает приговор, не создавая чрезмерно архаического звучания. Симметрия между вопрошающим и пророком сохранена.
