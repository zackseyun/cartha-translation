source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן דַּבֶּרְ/כֶ֣ם שָׁ֔וְא וַ/חֲזִיתֶ֖ם כָּזָ֑ב לָ/כֵן֙ הִנְ/נִ֣י אֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/008.yaml
  text: 'Therefore thus says the Lord GOD: Because you have spoken falsehood and seen a lie[a], therefore behold, I am against you, declares the Lord GOD.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «За то, что вы говорили пустые слова и видели ложные видения, — вот, Я против вас, — возвещает Владыка Яхве».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому / за то
  rationale: Первое употребление вводит итоговое пророческое объявление; повторное употребление естественно передано причинно-следственной конструкцией «за то, что… — вот…», сохраняющей оба звена еврейского текста без тяжеловесного повтора.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Устойчивая и естественная формула пророческой речи.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное Божье имя יהוה, сохраняя различие между титулом и именем.
- source_word: יַעַן דַּבֶּרְכֶם
  choice: за то, что вы говорили
  rationale: יַעַן вводит основание суда, а инфинитив с местоименным суффиксом естественно разворачивается в русском как личная глагольная конструкция.
- source_word: שָׁוְא
  choice: пустое
  rationale: Слово обозначает пустоту, тщетность и ложность; «пустое» сохраняет более широкий образ, не сводя его исключительно к фактической лжи.
- source_word: וַחֲזִיתֶם כָּזָב
  choice: и видели ложь
  rationale: Сохранён буквальный глагол пророческого видения חזה и прямое обозначение ложного содержания видения.
- source_word: הִנְנִי אֲלֵיכֶם
  choice: вот, Я против вас
  rationale: Передаёт торжественную формулу угрозы и явное Божье противостояние адресатам.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт авторитетную формулу божественного изречения в достойном, но понятном современном русском регистре.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог / Господь Яхве
  rationale: Выбранный вариант прозрачно различает титул и личное имя, не создаёт повтора «Господь Господь» и не подменяет имя יהוה нарицательным «Бог».
- issue: Соотношение שָׁוְא и כָּזָב
  choice: пустое … ложь
  alternative: ложь … обман
  rationale: Разные русские слова сохраняют лексическое различие оригинала и напряжение между пустотой сказанного и ложностью увиденного.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис слегка приподнят, но остаётся понятным; сохранены формула посланника, формула угрозы и заключительная формула божественного изречения.
