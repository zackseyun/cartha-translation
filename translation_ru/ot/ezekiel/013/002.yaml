base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/002.yaml
  text: Son of man[a], prophesy against the prophets of Israel who are prophesying, and say to those who prophesy from their own hearts, ‘Hear the word of Yahweh.’
translation:
  language: ru
  text: 'Сын человеческий, пророчествуй против пророков Израиля, которые пророчествуют, и скажи тем, кто пророчествует из собственного сердца[a]: «Слушайте слово Яхве!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пророкам из их сердца»; также возможно: «пророкам своего сердца». Необычное древнееврейское выражение указывает, что они говорят от себя, а не получают слово от Яхве.'
    reason: Уточнены множественное число притяжательного суффикса и синтаксическая неоднозначность исходного выражения; пояснение сохранено.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и его литературная связь с остальной книгой; форма передаёт единственное число и мужской род.
- source_word: הִנָּבֵא אֶל
  choice: пророчествуй против
  rationale: Глагол прямо обозначает пророческую речь, а предлог אֶל в контексте обличительного пророчества естественно передаётся как «против», хотя буквально часто означает «к».
- source_word: נְבִיאֵי יִשְׂרָאֵל הַנִּבָּאִים
  choice: пророков Израиля, которые пророчествуют
  rationale: Сохранены и принадлежность к Израилю, и причастная форма, указывающая на продолжающееся или характерное действие.
- source_word: לִנְבִיאֵי מִלִּבָּם
  choice: тем, кто пророчествует из собственного сердца
  rationale: Передан смысл самопроизвольного, исходящего от самих пророков сообщения, при этом сохранён древнееврейский образ сердца как источника мысли и намерения.
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма множественного числа требует внимательного восприятия; «слушайте» звучит естественно в современном русском и сохраняет повелительную силу.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена стандартная пророческая формула со словом «слово» и передано личное имя יהוה транслитерацией «Яхве».
theological_decisions:
- issue: Значение предлога אֶל в обличительном поручении
  choice: «против пророков»
  alternative: «к пророкам» / «пророкам»
  rationale: Дальнейший контекст содержит осуждение ложных пророков, поэтому «против» передаёт направленность пророчества, не добавляя нового содержания.
- issue: Источник пророчеств осуждаемых пророков
  choice: «из собственного сердца»
  alternative: «пророкам своего сердца»
  rationale: Выбранная формулировка ясно показывает, что их речь исходит от них самих, а не от Яхве, но сохраняет образ сердца и не устраняет образность исходного текста.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим регистром. Повтор «пророков… пророчествуют» намеренно сохранён вслед за древнееврейским текстом.
