base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/006.yaml
  text: They have seen falsehood and lying divination[a], those who say, ‘Declaration of Yahweh,’ though Yahweh has not sent them[b]; yet they hope for the fulfillment of the word.
translation:
  language: ru
  text: 'Они видели ложь и лживое прорицание, говоря: «Изречение Яхве»[a], хотя Яхве не посылал их; и всё же они надеются, что слово исполнится[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Речение Яхве»; формула также может передаваться как «Слово Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ждут, что слово подтвердится»; буквально: «надеются на утверждение (осуществление) слова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוּ שָׁוְא
  choice: видели ложь
  rationale: Глагол חזה сохраняет язык пророческого видения, а שָׁוְא в данном обличительном контексте обозначает ложное и пустое. Буквальная конструкция оставлена без добавления отсутствующего в еврейском тексте существительного «видение».
- source_word: קֶסֶם כָּזָב
  choice: лживое прорицание
  rationale: קֶסֶם означает прорицание или гадание, а כָּזָב характеризует его как ложное и вводящее в обман. «Прорицание» соответствует торжественному пророческому регистру лучше, чем бытовое «гадание».
- source_word: הָאֹמְרִים
  choice: те, кто говорит
  rationale: Субстантивированное причастие обозначает людей, для которых такое утверждение является характерным или продолжающимся действием.
- source_word: נְאֻם יְהוָה
  choice: Таково слово Яхве
  rationale: Формульное выражение передано естественной современной русской пророческой формулой; сноска сохраняет более буквальную возможность «Изречение Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, переданное тетраграмматоном, транслитерировано, а не заменено титулом.
- source_word: לֹא שְׁלָחָם
  choice: их не посылал
  rationale: Прямая передача отрицательной перфектной формы с объектным суффиксом; в русском контексте несовершенный вид естественно выражает отсутствие Божьего поручения.
- source_word: וְיִחֲלוּ
  choice: и всё же надеются
  rationale: יחל допускает значения ожидания и надежды. «Всё же» передаёт контекстуальное противопоставление, не превращая его в отдельное богословское утверждение.
- source_word: לְקַיֵּם דָּבָר
  choice: что это слово сбудется
  rationale: Конструкция означает, что слово будет утверждено, подтверждено осуществлением или исполнится. Выбран естественный русский оборот, а альтернативы отражены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Пророческая формула נְאֻם יְהוָה в устах ложных пророков
  choice: Таково слово Яхве
  alternative: Изречение Яхве; Речение Яхве
  rationale: 'Формула сохранена как притязание на Божий авторитет, чтобы не ослаблять иронию текста: говорящие используют подлинную пророческую формулу, не будучи посланы Богом.'
- issue: Ожидание исполнения ложного слова
  choice: надеются, что это слово сбудется
  alternative: ждут, что слово подтвердится
  rationale: Текст описывает их ожидание, но не уточняет, является ли оно искренней надеждой или самоуверенным расчётом; перевод не разрешает эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Синтаксис сохраняет резкое обличение и вставную характеристику ложных пророков; формула с именем Яхве остаётся заметной и торжественной.
