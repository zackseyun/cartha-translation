    rationale: 'Еврейская форма в данном обвинительном высказывании лучше передаётся русским прошедшим временем: «осквернили». Настоящее время возможно как стилистическое оживление, но не имеет достаточного основания и расходится с более прямым аспектуальным прочтением.'
  - severity: high
    issue: Синтаксис заключительного оборота
    rationale: Фраза «своей ложью Моему народу» не выражает ясно, что женщины лгут именно народу. Нужно добавить глагольную конструкцию, например «тем, что лжёте Моему народу».
