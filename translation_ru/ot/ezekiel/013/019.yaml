source:
  edition: WLC
  text: וַ/תְּחַלֶּלְ֨נָה אֹתִ֜/י אֶל עַמִּ֗/י בְּ/שַׁעֲלֵ֣י שְׂעֹרִים֮ וּ/בִ/פְת֣וֹתֵי לֶחֶם֒ לְ/הָמִ֤ית נְפָשׁוֹת֙ אֲשֶׁ֣ר לֹֽא תְמוּתֶ֔נָה וּ/לְ/חַיּ֥וֹת נְפָשׁ֖וֹת אֲשֶׁ֣ר לֹא תִֽחְיֶ֑ינָה בְּ/כַ֨זֶּבְ/כֶ֔ם לְ/עַמִּ֖/י שֹׁמְעֵ֥י כָזָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/019.yaml
  text: And you have profaned me among my people for handfuls of barley and for pieces of bread[a], putting to death persons who should not die and keeping alive persons who should not live, by your lying to my people[b], who listen to lies.
translation:
  language: ru
  text: И вы осквернили Меня среди Моего народа за горсти ячменя и кусочки хлеба[a], предавая смерти людей[b], которые не должны умереть, и сохраняя жизнь тем, кто не должен жить, тем, что лжёте Моему народу, слушающему ложь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крохи хлеба». Еврейское выражение обозначает отломленные куски или малые порции и подчёркивает ничтожность платы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «души» или «жизни» — в обеих частях фразы. Здесь еврейское слово обозначает живых людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחַלֶּלְנָה
  choice: и вы оскверняете
  rationale: Пиэль от חלל выражает профанацию Божьей святости. Настоящее время передаёт продолжающееся действие в пророческом обличении; форма обращена к нескольким женщинам.
- source_word: אֹתִי אֶל־עַמִּי
  choice: Меня среди Моего народа
  rationale: Гибкое אֶל здесь описывает осквернение Бога в среде Его народа и в его глазах; русское «среди» естественно передаёт общественный контекст.
- source_word: בְּשַׁעֲלֵי שְׂעֹרִים
  choice: за горсти ячменя
  rationale: שַׁעֲלֵי обозначает небольшие количества, набираемые рукой; предлог передан как указание на ничтожную плату.
- source_word: וּבִפְתוֹתֵי לֶחֶם
  choice: и кусочки хлеба
  rationale: פְּתֹתֵי — отломленные куски или малые порции хлеба. Уменьшительная форма естественна по-русски и подчёркивает ничтожность платы.
- source_word: לְהָמִית נְפָשׁוֹת
  choice: предавая смерти людей
  rationale: נְפָשׁוֹת здесь означает живых людей, а не отделённые от тела души. «Предавая смерти» сохраняет каузативную силу и судебный оттенок.
- source_word: אֲשֶׁר לֹא תְמוּתֶנָה
  choice: которые не должны умереть
  rationale: Формулировка сохраняет нормативно-судебное напряжение текста и не превращает высказывание ни в простое предсказание, ни в утверждение о предопределении.
- source_word: וּלְחַיּוֹת נְפָשׁוֹת
  choice: и сохраняя жизнь тем
  rationale: Каузативный инфинитив противопоставлен преданию смерти; «сохраняя жизнь» ясно передаёт активное поддержание или объявление в живых.
- source_word: אֲשֶׁר לֹא תִחְיֶינָה
  choice: кто не должен жить
  rationale: Сохранён строгий параллелизм с предыдущей оговоркой и её судебно-нормативная сила.
- source_word: בְּכַזֶּבְכֶם
  choice: своей ложью
  rationale: Предлог ב обозначает средство, а форма с суффиксом указывает на ложь самих пророчиц.
- source_word: שֹׁמְעֵי כָזָב
  choice: который слушает ложь
  rationale: Причастие характеризует народ как воспринимающий и принимающий ложные слова, а не просто слышащий их.
theological_decisions:
- issue: Значение נְפָשׁוֹת в контексте суда
  choice: людей
  alternative: души; жизни
  rationale: В данном месте נֶפֶשׁ обозначает самих живых людей. Перевод «души» мог бы привнести не требуемое еврейским текстом противопоставление души и тела.
- issue: Смысл формул о смерти и жизни
  choice: не должны умереть / не должен жить
  alternative: не умрут / не будут жить; не заслуживают смерти / заслуживают смерти
  rationale: Модальная формулировка передаёт неправомерное переворачивание должных судеб, не сводя текст к предсказанию и не уточняя сверх оригинала основание Божьего суда.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной пророческой интонацией. Заглавные местоимения при обращении к Богу сохранены по русской библейской издательской традиции. Обращение к пророчицам передано множественным «вы» без искусственного маркирования рода.
