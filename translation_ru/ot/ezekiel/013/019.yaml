review_pass:
  verdict: revise
  source_fidelity: 'Смысл основных выражений передан точно: осквернение Бога, ничтожная плата, неправомерное предание смерти и сохранение жизни, а также ложь народу. Однако начальная форма וַתְּחַלֶּלְנָה естественнее передаётся русским прошедшим временем («осквернили»), как завершённое/вменяемое действие в пророческом обвинении, а не настоящим «оскверняете».'
  naturalness: 'В исходном тексте завершающий оборот «— своей ложью Моему народу» синтаксически неудачен: творительный падеж «своей ложью» обозначает средство, но дательный «Моему народу» требует явно выраженного глагола речи. Перестройка с «тем, что лжёте Моему народу» делает связь ясной и сохраняет значение.'
  terminology: «Осквернили», «горсти ячменя», «предавая смерти», «сохраняя жизнь» и «людей» уместны в современном литературном библейском русском. Передача נְפָשׁוֹת как «людей» не навязывает позднего дуалистического смысла слову «души».
