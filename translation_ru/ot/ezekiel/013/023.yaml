  source_fidelity: 'Смысл передан точно: обращение остаётся во множественном числе, «ложные видения» передаёт שָׁוְא в данном контексте, а «заниматься гаданием» — сочетание קֶסֶם ... תִקְסַמְנָה. «Больше не будете» корректно выражает עוֹד.'
  naturalness: Фраза в целом современна и ясна. Однако в русском при избавлении кого-либо из-под чужой власти устойчивее и точнее сказать «из ваших рук», а не «от ваших рук».
  terminology: «Гадание», «избавлю», «ГОСПОДЬ» и формула «вы узнаете, что Я — ГОСПОДЬ» уместны и сохраняют библейский регистр без навязывания толкования.
  issues:
  - severity: low
    issue: Предлог в выражении о спасении от власти адресатов
    rationale: Еврейское מִיַּדְכֶן буквально означает «из вашей руки» и метафорически — из-под вашей власти. Русское «из ваших рук» является обычным библейско-литературным соответствием; «от ваших рук» здесь менее идиоматично и слабее передаёт образ.
  revised_text: Поэтому вы больше не будете видеть ложных видений и не будете заниматься гаданием. Я избавлю Мой народ из ваших рук, и вы узнаете, что Я — ГОСПОДЬ.
