source:
  edition: WLC
  text: לָ/כֵ֗ן שָׁ֚וְא לֹ֣א תֶחֱזֶ֔ינָה וְ/קֶ֖סֶם לֹא תִקְסַ֣מְנָה ע֑וֹד וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/023.yaml
  text: Therefore you will no longer see false visions or practice divination anymore, and I will deliver my people from your hand. Then you will know that I am the LORD.
translation:
  language: ru
  text: Поэтому вы больше не будете видеть ложных видений и не будете заниматься гаданием. Я избавлю Мой народ из ваших рук, и вы узнаете, что Я — ГОСПОДЬ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁוְא
  choice: ложных видений
  rationale: Существительное означает ложь, тщету или обман; вместе с глаголом «видеть» естественно передаётся как «видеть ложные видения».
- source_word: קֶסֶם לֹא תִקְסַמְנָה
  choice: не будете заниматься гаданием
  rationale: Сочетание существительного и однокоренного глагола обозначает совершение гадательных практик; современная русская формулировка сохраняет смысл без излишней буквальности.
- source_word: וְהִצַּלְתִּי
  choice: Я избавлю
  rationale: Глагол в породе hифиль выражает спасение или избавление от власти и опасности.
- source_word: מִיַּדְכֶן
  choice: от ваших рук
  rationale: Сохранён телесный образ еврейского выражения, обозначающего власть или контроль; формы обращения во всём стихе относятся к женщинам.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Тетраграмматон передан традиционным русским эквивалентом прописными буквами.
theological_decisions:
- issue: Значение формулы узнавания וִידַעְתֶּן כִּי אֲנִי יְהוָה
  choice: и вы узнаете, что Я — ГОСПОДЬ
  alternative: и поймёте, что Я — Господь
  rationale: «Узнаете» ближе к глаголу ידע и сохраняет характерную для Иезекииля формулу признания Яхве через Его действие.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Женский род адресатов грамматически не виден во множественном числе русского будущего времени, однако контексту не противоречит. Повтор отрицания с עוֹד естественно выражен словом «больше».
