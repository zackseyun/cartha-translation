  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ה֖וֹי עַל הַ/נְּבִיאִ֣ים הַ/נְּבָלִ֑ים אֲשֶׁ֥ר הֹלְכִ֛ים אַחַ֥ר רוּחָ֖/ם וּ/לְ/בִלְתִּ֥י רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/003.yaml
  text: 'Thus says the Lord GOD: Woe to the foolish prophets[a], who follow their own spirit and have seen nothing.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Горе неразумным пророкам, которые следуют за собственным духом[a] и ничего не видели!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «идут вслед за своим духом».'
    reason: Сноска сохраняет конкретный образ еврейской идиомы, тогда как основной текст передаёт её естественным русским выражением.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка передача устойчивой пророческой формулы, сохраняющая её торжественный характер.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה; тем самым сохраняется сочетание титула и имени без их слияния.
- source_word: הוֹי
  choice: Горе
  rationale: В данном пророческом изречении слово выражает одновременно осуждение и возвещение бедствия.
- source_word: הַנְּבִיאִים הַנְּבָלִים
  choice: неразумным пророкам
  rationale: «Неразумным» передаёт не недостаток умственных способностей как таковой, а нравственную и духовную несостоятельность, заключённую в נבל.
- source_word: הֹלְכִים אַחַר רוּחָם
  choice: которые следуют за собственным духом
  rationale: Идиома «идти вслед за» естественно передаётся глаголом «следовать»; רוּחָם оставлено как «собственный дух», что сохраняет указание на внутренний, самопроизвольный источник их речей.
- source_word: וּלְבִלְתִּי רָאוּ
  choice: и ничего не видели
  rationale: 'Сохраняется присоединительная конструкция еврейского текста и пророческий смысл видения: эти пророки заявляют о вдохновении, не получив видения.'
theological_decisions:
- issue: Передача составного именования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה и не скрывает наличие Божьего имени в исходном тексте.
- issue: Характер «духа» лжепророков
  choice: собственный дух
  alternative: собственные побуждения
  rationale: Более буквальная передача сохраняет богословски значимое противопоставление самопроизвольного внутреннего источника подлинному откровению, не сводя רוּחַ к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис краток и прям; лексика понятна широкому читателю, но сохраняет достоинство библейской речи.
