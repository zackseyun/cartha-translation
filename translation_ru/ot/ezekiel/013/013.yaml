  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/בִקַּעְתִּ֥י רֽוּחַ סְעָר֖וֹת בַּֽ/חֲמָתִ֑/י וְ/גֶ֤שֶׁם שֹׁטֵף֙ בְּ/אַפִּ֣/י יִֽהְיֶ֔ה וְ/אַבְנֵ֥י אֶלְגָּבִ֖ישׁ בְּ/חֵמָ֥ה לְ/כָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/013.yaml
  text: 'Therefore thus says the Lord GOD: I will unleash a storm wind in my wrath[a], and there will be a flooding rain in my anger, and hailstones in fury to bring complete destruction.'
translation:
  language: ru
  text: 'Поэтому так говорит Господь Яхве: «В ярости Моей Я дам вырваться ветру бурь[a]; в гневе Моём хлынет проливной дождь, и град в ярости — для уничтожения».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я рассеку (или: прорву) ветер бурь»; вероятный смысл: Бог даст бурному ветру вырваться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי как титул верховной власти, а «Яхве» сохраняет личное имя Бога и избегает неестественного удвоения «Господь Господь».
- source_word: וּבִקַּעְתִּי
  choice: Я обрушу
  rationale: Глагол буквально означает «расколоть, прорвать». В сочетании с ураганным ветром речь идёт о том, что Бог заставляет бурю вырваться наружу; «обрушу» естественно передаёт начало её разрушительного действия и Божью инициативу.
- source_word: רוּחַ סְעָרוֹת
  choice: ураганный ветер
  rationale: Конструктивное сочетание буквально имеет вид «ветер бурь» и обозначает исключительно сильный, бурный ветер. Русское «ураганный ветер» ясно и естественно передаёт эту интенсивность.
- source_word: בַּחֲמָתִי
  choice: в ярости Моей
  rationale: חֵמָה обозначает пылающую ярость или сильный гнев. «Ярость» сохраняет интенсивность пророческой речи о суде.
- source_word: גֶּשֶׁם שֹׁטֵף
  choice: хлынет ливень
  rationale: Причастие שֹׁטֵף описывает поток, который разливается и сметает. Сочетание «хлынет ливень» естественно выражает внезапную и разрушительную силу дождя.
- source_word: בְּאַפִּי
  choice: в гневе Моём
  rationale: אַף буквально значит «нос», но устойчиво обозначает гнев. Перевод передаёт здесь именно идиоматический эмоциональный смысл.
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: обрушится град
  rationale: Буквально — «камни града». В русском языке собирательное «град» естественно обозначает множество градин; глагол «обрушится» делает эллиптическую еврейскую конструкцию понятной.
- source_word: בְּחֵמָה
  choice: в ярости Моей
  rationale: Повтор того же существительного поддерживает настойчивый акцент на Божьей ярости. Местоимение «Моей» восстанавливается по параллельным выражениям стиха.
- source_word: לְכָלָה
  choice: чтобы всё уничтожить
  rationale: כָּלָה указывает на полный конец, истребление или окончательное уничтожение, а предлог לְ выражает цель или результат. Добавленное «всё» естественно передаёт полноту разрушения, не уточняя его объект сверх текста.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и имя יְהוִה, сохраняя личное имя в тексте и не вводя конфессионально обусловленную замену имени словом «Бог».
- issue: Отнесение ярости в выражении בְּחֵמָה
  choice: в ярости Моей
  alternative: в ярости
  rationale: В еврейском тексте при третьем обозначении ярости притяжательный суффикс отсутствует, однако параллелизм с «в ярости Моей» и «в гневе Моём» ясно указывает на ярость говорящего Бога. Русский вариант делает эту связь явной, не меняя участника действия.
- issue: Объём уничтожения в לְכָלָה
  choice: чтобы всё уничтожить
  alternative: для полного уничтожения
  rationale: Фраза выражает полноту суда, но не называет непосредственно его объект. Перевод сохраняет эту неопределённость и не утверждает богословски более широкого всеобщего уничтожения за пределами контекста.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Эмоциональные термины сохранены повторно, чтобы передать нарастающий ритм Божьего суда; синтаксический эллипсис оригинала умеренно раскрыт ради ясности.
