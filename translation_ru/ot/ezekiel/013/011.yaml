  text: Tell those who plaster it with whitewash that it will fall[a]. There will be a flooding rain, and you, O hailstones, will fall[b], and a windstorm will break it open.
translation:
  language: ru
  text: 'Скажи тем, кто обмазывает её непрочным раствором[a]: «Она рухнет! Вот хлынет ливень, и вы, градины, падёте, а штормовой ветер расколет её».'
  philosophy: optimal-equivalence
  footnotes:
