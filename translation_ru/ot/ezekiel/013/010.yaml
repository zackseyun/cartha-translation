base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/010.yaml
  text: Because[a], yes, because they have led my people astray, saying, ‘Peace,’ when there is no peace, and when someone builds a wall, behold, they plaster it with whitewash.
translation:
  language: ru
  text: 'За то, да, за то, что они ввели Мой народ в заблуждение, говоря: «Мир», — а мира нет; когда кто-то строит стену, они, вот, обмазывают её побелкой[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обмазывают непрочным раствором». Значение еврейского слова здесь не вполне определённо: оно может обозначать поверхностную побелку либо непригодную, ненадёжную обмазку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן וּבְיַעַן
  choice: За то, именно за то, что
  rationale: Передаёт усиленную причинную формулу и сохраняет её повтор, оставаясь естественной в современном русском языке.
- source_word: הִטְעוּ אֶת עַמִּי
  choice: вводят Мой народ в заблуждение
  rationale: Причинная форма глагола означает, что лжепророки заставляют народ сбиться с верного пути. Русское выражение ясно передаёт значение, не добавляя прямого обвинения в сознательном обмане.
- source_word: שָׁלוֹם וְאֵין שָׁלוֹם
  choice: «Мир», — когда мира нет
  rationale: «Мир» сохраняет широкий смысл שָׁלוֹם — мир, благополучие и безопасность — и естественно звучит в пророческом обличении ложной уверенности.
- source_word: וְהוּא בֹּנֶה חַיִץ
  choice: и когда кто-нибудь строит стену
  rationale: Местоимение с причастием допускает обобщённое, неопределённо-личное понимание. «Кто-нибудь» не превращает строителя в конкретное лицо.
- source_word: וְהִנָּם טָחִים אֹתוֹ
  choice: они тут же покрывают её
  rationale: הִנָּם привлекает внимание к немедленному действию группы. «Тут же» естественно передаёт эту наглядную, указательную силу в русском контексте.
- source_word: תָּפֵל
  choice: побелкой
  rationale: В данном строительном образе слово обозначает поверхностное покрытие или ненадёжную обмазку. «Побелка» ясно передаёт видимость благоустроенности, скрывающую недостатки стены; материальная природа покрытия остаётся не вполне определённой.
theological_decisions:
- issue: Смысл образа стены и её покрытия в обличении лжепророков
  choice: Сохранить конкретный образ стены, которую покрывают побелкой, не разъясняя метафору в основном тексте.
  alternative: 'Передать толкование непосредственно: «строят непрочную стену» или «прикрывают ложь».'
  rationale: Еврейский текст сначала даёт сам образ; его прямое истолкование в переводе преждевременно устранило бы образность и сузило бы смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим тоном. Усиленный причинный повтор сохранён без архаичного «ибо». Прописная буква в «Мой» подчёркивает, что говорит Господь, согласно принятой русской библейской издательской практике.
