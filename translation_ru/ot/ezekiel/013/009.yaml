  text: וְ/הָיְתָ֣ה יָדִ֗/י אֶֽל הַ/נְּבִיאִ֞ים הַ/חֹזִ֣ים שָׁוְא֮ וְ/הַ/קֹּסְמִ֣ים כָּזָב֒ בְּ/ס֧וֹד עַמִּ֣/י לֹֽא יִהְי֗וּ וּ/בִ/כְתָ֤ב בֵּֽית יִשְׂרָאֵל֙ לֹ֣א יִכָּתֵ֔בוּ וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָבֹ֑אוּ וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/009.yaml
  text: And my hand will be against the prophets who see falsehood and who practice lying divination[a]. They will not be in the council of my people, nor will they be written in the register of the house of Israel, nor will they enter the land of Israel[c][b]. Then you will know that I am the Lord Yahweh.
translation:
  language: ru
  text: И рука Моя будет против пророков, которые видят ложь и гадают ложь. Они не будут в совете Моего народа[a], не будут вписаны в список дома Израиля[b] и не войдут в землю Израиля. И узнаете, что Я — Господь Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в собрании Моего народа»; возможно также: «в доверительном кругу Моего народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в запись (реестр) дома Израиля».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское אֲדֹנָי יְהוִה: титул «Господь» и имя «Яхве»; традиционный вариант — «Господь Бог».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה יָדִי אֶל
  choice: И рука Моя будет против
  rationale: Еврейская идиома обозначает деятельное противостояние и суд; «против» ясно передаёт враждебную направленность действия.
- source_word: הַחֹזִים שָׁוְא
  choice: которые видят ложь
  rationale: Сохранён образ пророческого видения и многозначность שָׁוְא, которая здесь прежде всего указывает на ложь и обманчивость.
- source_word: וְהַקֹּסְמִים כָּזָב
  choice: и предсказывают обман
  rationale: Глагольное выражение передаёт практику гадательного предсказания; «обман» сохраняет обвинительный смысл כָּזָב без тяжеловесного буквального оборота.
- source_word: בְּסוֹד עַמִּי
  choice: в совете Моего народа
  rationale: סוֹד может обозначать доверительный круг, совет или собрание. «Совет» сохраняет идею принадлежности к признанному кругу народа, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: וּבִכְתָב בֵּית יִשְׂרָאֵל לֹא יִכָּתֵבוּ
  choice: не будут вписаны в список дома Израиля
  rationale: Контекст указывает на официальный письменный перечень или реестр; пассивная форма «будут вписаны» естественно передаёт יִכָּתֵבוּ.
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל לֹא יָבֹאוּ
  choice: и не войдут в землю Израиля
  rationale: אַדְמַת буквально означает землю или почву, а здесь речь идёт о возвращении и допуске в землю Израиля.
- source_word: וִידַעְתֶּם
  choice: И узнаете
  rationale: Сохранён соединительный союз исходного текста; форма второго лица множественного числа передана без добавления явного местоимения.
- source_word: אֲנִי אֲדֹנָי יְהוִה
  choice: Я — Владыка Яхве
  rationale: «Владыка» отличает אֲדֹנָי от личного имени יְהוִה, переданного как «Яхве», и избегает неясного повторения «Господь Господь».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יְהוִה, прямо сохраняя имя «Яхве» и не вводя в исходный текст слово «Бог».
- issue: Характер исключения лжепророков
  choice: Три параллельных последствия оставлены без богословского пояснения
  alternative: Истолковать их как отлучение, утрату гражданства или окончательное осуждение
  rationale: Текст говорит об отсутствии в совете, невнесении в список и невхождении в землю; перевод не сужает эти образы до одной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Богу, использованы как русская издательская конвенция. Параллелизм трёх форм исключения сохранён.
