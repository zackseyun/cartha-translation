  naturalness: Текст в целом литературный и ясный. «Владыка Яхве» звучит менее идиоматично, тогда как «Господь Яхве» — естественный современный библейский вариант. Оборот «гадают ложь» намеренно сохраняет краткий параллелизм оригинала и понятен в данном обвинительном контексте.
