base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/014.yaml
  text: I will tear down the wall that you plastered with whitewash[a], and bring it down to the ground, so that its foundation is laid bare. It will fall, and you will perish within it. Then you will know that I am Yahweh.
translation:
  language: ru
  text: Я разрушу стену, которую вы покрыли побелкой[a], сровняю её с землёй, и обнажится её основание. Она рухнет, и вы погибнете в ней. Тогда вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрыли непрочным раствором». Еврейское слово может обозначать негодное, непрочное покрытие; в данном контексте оно также подразумевает обманчивую внешнюю отделку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרַסְתִּי
  choice: Я разрушу
  rationale: Глагол הרס означает разрушение или снос сооружения; «разрушу» естественно и точно передаёт действие.
- source_word: אֶת הַקִּיר
  choice: стену
  rationale: Сохранён конкретный образ стены, который развивается в ближайшем контексте.
- source_word: אֲשֶׁר טַחְתֶּם תָּפֵל
  choice: которую вы обмазали побелкой
  rationale: Глагол טח выражает нанесение покрытия, а תפל допускает понимание как непрочного или обманчивого поверхностного слоя. «Побелкой» естественно передаёт образ внешнего прикрытия, а неоднозначность отмечена в сноске.
- source_word: וְהִגַּעְתִּיהוּ אֶל הָאָרֶץ
  choice: сровняю её с землёй
  rationale: Каузативная форма передаёт доведение стены до земли; русская идиома ясно выражает её полное разрушение.
- source_word: וְנִגְלָה יְסֹדוֹ
  choice: и обнажится её основание
  rationale: Пассивная форма גלה указывает на то, что прежде скрытое основание станет открытым.
- source_word: וְנָפְלָה
  choice: Она рухнет
  rationale: Форма женского рода относится к стене; «рухнет» естественно описывает падение разрушенного сооружения.
- source_word: וּכְלִיתֶם בְּתוֹכָהּ
  choice: и вы погибнете под её обломками
  rationale: כלה здесь означает гибель, а בְתוֹכָהּ буквально указывает на нахождение «внутри неё». В русском применительно к падающей стене буквальная формулировка неясна, поэтому смысл пространственного образа выражен естественно; буквальная возможность сохранена в сноске.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Тогда вы узнаете, что Я — Яхве
  rationale: Результативное «тогда» естественно связывает узнавание с судом; личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; личное имя передано как «Яхве», без замены титулом.
- issue: Отнесение гибели к падающей стене
  choice: под её обломками
  alternative: внутри неё
  rationale: Контекст связывает гибель адресатов с падением стены. Перевод не уточняет духовный смысл образа, но делает физическую сцену понятной; более буквальный вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык; пророческая речь передана кратко и торжественно. Конкретный образ стены сохранён, а неоднозначность תָּפֵל и буквальный пространственный оборот отмечены сносками.
