source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הוֹי֩ לִֽ/מְתַפְּר֨וֹת כְּסָת֜וֹת עַ֣ל כָּל אַצִּילֵ֣י יָדַ֗/י וְ/עֹשׂ֧וֹת הַ/מִּסְפָּח֛וֹת עַל רֹ֥אשׁ כָּל קוֹמָ֖ה לְ/צוֹדֵ֣ד נְפָשׁ֑וֹת הַ/נְּפָשׁוֹת֙ תְּצוֹדֵ֣דְנָה לְ/עַמִּ֔/י וּ/נְפָשׁ֖וֹת לָ/כֶ֥נָה תְחַיֶּֽינָה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/018.yaml
  text: 'And say, ‘Thus says the Lord GOD: Woe to the women who sew magic bands on every wrist and make veils for the head of persons of every height, to hunt souls! Will you hunt the souls of my people and keep your own souls alive?'
translation:
  language: ru
  text: 'И скажи: «Так говорит Владыка ГОСПОДЬ: горе женщинам, которые шьют повязки на все запястья и делают покрывала на головы людей любого роста, чтобы ловить души! Неужели вы будете ловить души Моего народа, а свои души сохранять в живых?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּסָתוֹת
  choice: повязки
  rationale: Редкое слово, по контексту обозначающее сшитые предметы, закрепляемые у запястий или на руках; нейтральное «повязки» не добавляет отсутствующего в самом существительном определения «магические».
- source_word: עַל כָּל אַצִּילֵי יָדַי
  choice: на все запястья
  rationale: Буквально выражение связано с суставами/сочленениями рук; в данном контексте «запястья» — естественная и традиционно вероятная локализация, хотя точная часть руки спорна.
- source_word: הַמִּסְפָּחוֹת
  choice: покрывала
  rationale: Редкое существительное обозначает некое покрытие для головы; «покрывала» сохраняет предметную неопределённость лучше, чем более конкретное «вуали».
- source_word: כָּל קוֹמָה
  choice: людей любого роста
  rationale: קוֹמָה означает рост или телосложение; конструкция, вероятно, указывает на людей всякого роста, то есть на покрывала соответствующих размеров.
- source_word: לְצוֹדֵד נְפָשׁוֹת
  choice: чтобы ловить души
  rationale: Сохраняется намеренно резкая метафора охоты; נֶפֶשׁ может означать жизнь или человека, но повторение позволяет передать единообразно как «души».
- source_word: וּנְפָשׁוֹת לָכֶנָה תְחַיֶּינָה
  choice: а свои души сохранять в живых
  rationale: Передаёт контраст между жертвами из народа Бога и выгодой/самосохранением самих женщин, сохраняя повтор נְפָשׁוֹת.
theological_decisions:
- issue: Характер повязок и покрывал
  choice: Не называть их прямо магическими
  alternative: «магические повязки»
  rationale: Контекст главы связывает действия женщин с ложным пророчеством и оккультной практикой, однако соответствующее еврейское существительное само по себе не содержит прилагательного «магические». Перевод не должен превращать контекстуальный вывод в явное лексическое значение.
- issue: Значение «ловить души»
  choice: Сохранить буквальную метафору
  alternative: «ловить людей» или «лишать людей жизни»
  rationale: Фраза допускает связь как с захватом людей, так и с угрозой их жизни. Буквальная метафора сохраняет напряжение и повтор ключевого слова נֶפֶשׁ.
- issue: Финальный вопрос и судьба пророчиц
  choice: «а свои души сохранять в живых?»
  alternative: «чтобы самим жить?»
  rationale: Сохраняется противопоставление «душ» народа и «душ» самих женщин без уточнения, идёт ли речь только о физическом выживании или также о выгоде от практики.
translation_notes:
  register: Современный литературный русский с торжественной пророческой формулой. «Владыка ГОСПОДЬ» различает אֲדֹנָי и יהוה. Синтаксис сделан ясным, но редкие культовые предметы и метафора охоты не конкретизированы сверх еврейского текста.
