lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Стандартное повествовательное введение пророческой формулы; в русском языке «И было… слово» сохраняет библейскую формулу без архаического «и случилось».
- source_word: דְבַר
  choice: слово
  rationale: Передаёт устойчивое пророческое выражение דְבַר יְהוָה и сохраняет конкретный образ божественной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога, непосредственно стоящего в еврейском тексте.
- source_word: אֵלַי
  choice: ко мне
  rationale: Естественная русская передача направления речи к пророку.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь; в современном русском эту функцию естественно передаёт двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Основной текст сохраняет личное имя, данное в еврейском оригинале; традиционная замена титулом отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. Двоеточие функционально передаёт לֵאמֹר и подготавливает прямую речь следующего стиха.
