  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י אֶל כִּסְּתוֹתֵי/כֶ֨נָה֙ אֲשֶׁ֣ר אַ֠תֵּנָה מְצֹדְד֨וֹת שָׁ֤ם אֶת הַ/נְּפָשׁוֹת֙ לְ/פֹ֣רְח֔וֹת וְ/קָרַעְתִּ֣י אֹתָ֔/ם מֵ/עַ֖ל זְרוֹעֹֽתֵי/כֶ֑ם וְ/שִׁלַּחְתִּי֙ אֶת הַ/נְּפָשׁ֔וֹת אֲשֶׁ֥ר אַתֶּ֛ם מְצֹדְד֥וֹת אֶת נְפָשִׁ֖ים לְ/פֹרְחֹֽת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against your magic bands with which you hunt the lives there like birds, and I will tear them from your arms[c][b], and I will let the lives go free—the ones you hunt like birds.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка ГОСПОДЬ: «Вот, Я — против ваших повязок[a], которыми вы там ловите людей[b], словно птиц[c]. Я сорву их с ваших рук и выпущу на свободу тех, кого вы ловите, словно птиц».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подушечек», «амулетов». Еврейское слово редкое; вероятно, имеются в виду ритуальные предметы, которые пророчицы носили на руках.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «души» или «жизни»; здесь имеются в виду люди как живые существа.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально выражение связано с полётом: «чтобы летали» или «летающих». Вероятно, людей здесь уподобляют птицам, попавшим в ловушку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Передаёт сочетание титула אֲדֹנָי и божественного имени יהוה, сохраняя их различие и избегая неестественного «Господь ГОСПОДЬ».
- source_word: הִנְנִי אֶל
  choice: Вот, Я — против
  rationale: Сохраняет указательную силу הִנְנִי и ясно выражает Божье противостояние.
- source_word: כִּסְּתוֹתֵיכֶנָה
  choice: ваших повязок
  rationale: Редкое слово обозначает, вероятно, надевавшиеся на руки ритуальные предметы; «повязки» естественно согласуется с последующим снятием с рук, но неопределённость сохранена в сноске.
- source_word: מְצֹדְדוֹת
  choice: ловите
  rationale: Глагол выражает охоту или улавливание; «ловите» поддерживает образ птиц и одновременно применимо к людям.
- source_word: הַנְּפָשׁוֹת / נְפָשִׁים
  choice: людей / тех
  rationale: נפש здесь обозначает живых людей, ставших добычей, а не обязательно нематериальные души; такой перевод не навязывает тексту позднейшую антропологическую схему.
- source_word: לְפֹרְחוֹת / לְפֹרְחֹת
  choice: словно птиц
  rationale: Форма от פרח буквально связана с полётом; в контексте ловли вероятен образ охоты на птиц, хотя сжатый еврейский синтаксис допускает и иное понимание.
- source_word: וְקָרַעְתִּי אֹתָם מֵעַל זְרוֹעֹתֵיכֶם
  choice: Я сорву их с ваших рук
  rationale: Передаёт резкость קָרַע и указывает, что ритуальные предметы будут силой сняты с рук пророчиц.
- source_word: וְשִׁלַּחְתִּי
  choice: выпущу на свободу
  rationale: В данном контексте глагол означает освобождение пойманных людей, а не просто их отправление.
- source_word: שָׁם
  choice: там
  rationale: Наречие сохранено, несмотря на не вполне ясную синтаксическую связь в еврейском тексте.
theological_decisions:
- issue: Значение נֶפֶשׁ в образе оккультной ловли
  choice: людей
  alternative: души / жизни
  rationale: Речь идёт о людях как живых существах, которых пророчицы ловят и которых Бог освобождает. «Людей» избегает необоснованного сведения נֶפֶשׁ к отделимой нематериальной душе.
- issue: Смысл образа לְפֹרְחוֹת
  choice: ловите людей, словно птиц
  alternative: отпускаете души летать / заставляете души улетать
  rationale: Охотничий глагол מְצֹדְדוֹת делает птичий образ вероятным, однако буквальная связь с «полётом» отмечена в сноске, чтобы не скрывать трудность текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Прямая речь оформлена ясно; женский род адресатов передан контекстом «ваших», без тяжеловесного добавления. Неясные названия ритуальных предметов и трудный образ полёта не догматизированы, а пояснены сносками.
