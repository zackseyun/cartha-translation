  text: יַ֣עַן הַכְא֤וֹת לֵב צַדִּיק֙ שֶׁ֔קֶר וַ/אֲנִ֖י לֹ֣א הִכְאַבְתִּ֑י/ו וּ/לְ/חַזֵּק֙ יְדֵ֣י רָשָׁ֔ע לְ/בִלְתִּי שׁ֛וּב מִ/דַּרְכּ֥/וֹ הָ/רָ֖ע לְ/הַחֲיֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/022.yaml
  text: Because you have disheartened the heart of the righteous with falsehood[a], though I had not caused him grief, and because you have strengthened the hands of the wicked so that he does not turn from his evil way to preserve his life[b],
translation:
  language: ru
  text: За то, что вы ложью огорчали сердце праведника[a], хотя Я не причинял ему скорби, и укрепляли руки нечестивого, чтобы он не обратился от своего злого пути и не остался в живых[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лживыми речами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы он жил»; буквально: «чтобы сохранить ему жизнь».'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: За то, что
  rationale: Передаёт причинное основание последующего приговора и естественно связывает стих с продолжением.
- source_word: הַכְאוֹת לֵב צַדִּיק
  choice: вы огорчали сердце праведника
  rationale: Сохраняет каузативный смысл глагола и образ сердца; форма множественного числа соответствует обращению к лжепророчицам в контексте.
- source_word: שֶׁקֶר
  choice: ложью
  rationale: Передаёт абстрактное существительное и его инструментальный смысл; конкретизация «ложными речами» также возможна.
- source_word: וַאֲנִי לֹא הִכְאַבְתִּיו
  choice: хотя Я не причинял ему скорби
  rationale: Сохраняет контраст и каузативное значение повторённого корня כאב, не отождествляя действие Бога с действием лжепророчиц.
- source_word: וּלְחַזֵּק יְדֵי רָשָׁע
  choice: и укрепляли руки нечестивого
  rationale: Сохраняет прозрачный древнееврейский образ поддержки и ободрения нечестивца.
- source_word: לְבִלְתִּי שׁוּב מִדַּרְכּוֹ הָרָע
  choice: чтобы он не обратился со своего злого пути
  rationale: Передаёт цель или результат поддержки нечестивого и сохраняет этический образ пути.
- source_word: לְהַחֲיֹתוֹ
  choice: и не сохранил себе жизнь
  rationale: В русской синтаксической конструкции отрицание естественно распространяется на итог обращения; выражение не уточняет, идёт ли речь исключительно о физической или вечной жизни.
theological_decisions:
- issue: Смысл заключительного инфинитива לְהַחֲיֹתוֹ
  choice: и не сохранил себе жизнь
  alternative: чтобы он жил / и жил
  rationale: Чтение связывает сохранение жизни с обращением от злого пути, но не вводит узкого учения о характере этой жизни. В сноске сохранено более буквальное прочтение.
translation_notes:
  register: Современный литературный русский с сохранением пророческой образности «сердце» и «укреплять руки». Незавершённая пунктуация запятой отражает зависимость причинного придаточного от приговора в следующем стихе.
