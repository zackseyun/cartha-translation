reference: Ezekiel 13:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹ֤א עֲלִיתֶם֙ בַּ/פְּרָצ֔וֹת וַ/תִּגְדְּר֥וּ גָדֵ֖ר עַל בֵּ֣ית יִשְׂרָאֵ֑ל לַ/עֲמֹ֥ד בַּ/מִּלְחָמָ֖ה בְּ/י֥וֹם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/005.yaml
  text: You have not gone up into the breaches or built up a wall for the house of Israel[a], so that it might stand in the battle on the day of Yahweh.
translation:
  language: ru
  text: Вы не поднялись к проломам[a] и не возвели стену для дома Израиля, чтобы он устоял в битве в день Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в проломы». Еврейское слово обозначает бреши в стене и продолжает образ оборонительных укреплений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלִיתֶם
  choice: поднялись
  rationale: Сохранено конкретное значение глагола עלה — «подниматься, восходить» — и образ защитников, направляющихся к повреждённому месту укрепления.
- source_word: בַּפְּרָצוֹת
  choice: к проломам
  rationale: Слово обозначает бреши или проломы в стене. Русское «к проломам» естественно передаёт движение защитников к уязвимым местам, сохраняя военный образ; более буквальное «в проломы» отмечено в сноске.
- source_word: וַתִּגְדְּרוּ גָדֵר
  choice: возвели стену
  rationale: Однокоренная конструкция «ограждать ограду» усиливает действие. «Возвели стену» звучит естественно и сохраняет образ оборонительного укрепления.
- source_word: עַל בֵּית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Предлог עַל здесь допускает значение действия ради защиты или в пользу дома Израиля. Такой перевод не навязывает чисто пространственное «вокруг» и сохраняет метафорический смысл.
- source_word: לַעֲמֹד
  choice: чтобы он устоял
  rationale: Инфинитив выражает цель. Местоимение «он» относится к собирательному выражению «дом Израиля» и передаёт идею стойкости перед нападением.
- source_word: בַּמִּלְחָמָה
  choice: в битве
  rationale: «Битва» сохраняет конкретный образ предстоящего столкновения и согласуется с образами проломов и стены.
- source_word: בְּיוֹם יְהוָה
  choice: в день Яхве
  rationale: Сохранена устойчивая пророческая формула дня Божьего суда; русское «в день» естественно для временного обозначения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом, в соответствии с исходным текстом и консультационным слоем.
theological_decisions:
- issue: Военно-оборонительный образ как описание ответственности пророков
  choice: Сохранить конкретные образы проломов, стены и битвы.
  alternative: 'Передать смысл отвлечённо: «вы не защитили Израиль, чтобы он пережил суд».'
  rationale: Исходный текст выражает обличение через последовательную метафору обороны. Её сохранение позволяет читателю увидеть пророческий смысл без внесения толкования непосредственно в текст.
- issue: К чему относится подразумеваемое подлежащее при לַעֲמֹד
  choice: 'К «дому Израиля»: «чтобы он устоял».'
  alternative: 'К стене: «чтобы она устояла».'
  rationale: По смыслу стену должны были возвести для дома Израиля, чтобы именно народ как единое целое мог устоять в битве; при этом синтаксическая краткость оригинала не расширена дополнительным толкованием.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в еврейском тексте, и соответствует предоставленному консультационному решению.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и прямой; конкретная оборонительная метафора сохранена без конфессионального истолкования.
