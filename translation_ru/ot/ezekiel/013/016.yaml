base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/016.yaml
  text: the prophets of Israel who prophesy concerning Jerusalem and who see for her a vision of peace[a], when there is no peace, declares the Lord GOD.
translation:
  language: ru
  text: пророки Израиля, которые пророчествуют о Иерусалиме и видят для него видение мира[a], а мира нет, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «видение благополучия»; еврейское слово шалом может означать мир, целостность и благополучие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֵי יִשְׂרָאֵל
  choice: пророки Израиля
  rationale: Конструктивное сочетание прямо обозначает пророков, принадлежащих Израилю или связанных с ним.
- source_word: הַנִבְּאִים אֶל יְרוּשָׁלִַם
  choice: которые пророчествуют о Иерусалиме
  rationale: Причастие передано определительным придаточным с продолжающимся действием; אֶל при глаголе пророчества в данном контексте естественно передаётся как «о», не навязывая значения враждебного пророчества.
- source_word: וְהַחֹזִים לָהּ
  choice: и видят для него
  rationale: Сохранены зрительный смысл חזה и дательный оттенок לָהּ; местоимение относится к Иерусалиму, который в русском языке мужского рода.
- source_word: חֲזוֹן שָׁלוֹם
  choice: видение мира
  rationale: Повтор слова «мир» сохраняет намеренный контраст со следующим утверждением; более широкий смысл שָׁלוֹם отмечен в сноске.
- source_word: וְאֵין שָׁלוֹם
  choice: хотя мира нет
  rationale: Союз «хотя» ясно выражает противоречие между видением лжепророков и действительностью, заложенное контекстом.
- source_word: נְאֻם
  choice: возвещает
  rationale: Достоинственная и понятная передача устойчивой пророческой формулы божественного речения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное заветное имя יהוה и избегает сочетания «Господь Господь».
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Текст непосредственно содержит тетраграмматон; транслитерация «Яхве» сохраняет различие между божественным именем и титулом אֲדֹנָי, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим регистром. Начало оставлено синтаксически зависимым, поскольку стих продолжает приговор из предыдущего контекста; тире перед формулой речения облегчает чтение.
