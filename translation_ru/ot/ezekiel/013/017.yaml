  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל בְּנ֣וֹת עַמְּ/ךָ֔ הַ/מִּֽתְנַבְּא֖וֹת מִֽ/לִּבְּ/הֶ֑ן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/017.yaml
  text: And you[a], son of man, set your face against the daughters of your people who prophesy out of their own hearts[b], and prophesy against them.
translation:
  language: ru
  text: А ты, сын человеческий, обрати лицо против дочерей твоего народа, которые пророчествуют из собственных сердец[a], и пророчествуй против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть их пророческие речи исходят от них самих, а не от Господа.
    reason: cultural_note
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и его повторяющуюся риторическую силу в книге.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: обрати лицо против
  rationale: Передаёт образ еврейской идиомы и её значение противостояния в контексте пророческого суда.
- source_word: בְּנוֹת עַמְּךָ
  choice: дочерей твоего народа
  rationale: Буквально сохраняет конкретное родственное обозначение בְּנוֹת, не заменяя его общим словом «женщины».
- source_word: הַמִּתְנַבְּאוֹת
  choice: которые пророчествуют
  rationale: Естественно передаёт причастие, обозначающее продолжающуюся или характерную деятельность, без добавления слова «ложно».
- source_word: מִלִּבְּהֶן
  choice: от собственного сердца
  rationale: Сохраняет антропологически ёмкое слово «сердце» и подчёркивает, что источник их речей находится в них самих.
- source_word: וְהִנָּבֵא עֲלֵיהֶן
  choice: и пророчествуй против них
  rationale: Прямо передаёт повеление и враждебное значение עַל в данном контексте.
theological_decisions:
- issue: Характер пророческой деятельности женщин
  choice: «которые пророчествуют» без добавления «ложно»
  alternative: «которые лжепророчествуют» или «которые притворяются пророчицами»
  rationale: Сам стих осуждает источник их речей — собственное сердце, — но не употребляет отдельного слова «ложно». Перевод сохраняет формулировку и напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной пророческой формулы «сын человеческий» и образной идиомы «обрати лицо против». Местоимения, относящиеся к Иезекиилю, даны со строчной буквы по нормам современного русского текста.
