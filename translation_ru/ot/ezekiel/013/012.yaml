  yaml_path: translation/ot/ezekiel/013/012.yaml
  text: And look[a], when the wall falls, will it not be said to you, ‘Where is the plaster with which you plastered it?’
translation:
  language: ru
  text: 'И вот, когда стена рухнет, разве не скажут вам: «Где же штукатурка[a], которой вы покрыли её?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «побелка». Речь идёт о покрытии, нанесённом на стену; в контексте главы этот образ связан с обманчивой внешней отделкой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательную и оживляющую повествование силу выражения естественным современным русским оборотом.
- source_word: נָפַל
  choice: когда ... рухнет
  rationale: Хотя форма глагола — перфект, в контексте она изображает предстоящее событие; будущее время после «когда» естественно передаёт эту перспективу. «Рухнет» уместно для разрушения стены.
- source_word: הַקִּיר
  choice: стена
  rationale: Прямое и общепонятное соответствие в контексте строительного образа.
- source_word: הֲלוֹא
  choice: разве не
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: יֵאָמֵר אֲלֵיכֶם
  choice: не скажут вам
  rationale: Русская неопределённо-личная конструкция естественно передаёт еврейский безличный пассив, не добавляя конкретного действующего лица.
- source_word: אַיֵּה
  choice: Где же
  rationale: Передаёт прямой вопрос о том, что осталось от покрытия, а частица «же» естественно подчёркивает насмешливо-обличительный оттенок контекста.
- source_word: הַטִּיחַ
  choice: обмазка
  rationale: Обозначает нанесённый на стену покрывающий состав и позволяет сохранить связь с однокоренным глаголом; не сужает смысл исключительно до побелки или строительного раствора.
- source_word: אֲשֶׁר טַחְתֶּם
  choice: которой вы её обмазали
  rationale: Сохраняет этимологическую связь существительного и глагола оригинала; местоимение «её» ясно отсылает к стене, подразумеваемой в еврейском тексте.
theological_decisions:
- issue: Характер покрытия как образа обмана
  choice: В основном тексте сохранён буквальный строительный образ «обмазка».
  alternative: «Побелка» или «обманчивая побелка».
  rationale: Сам стих называет покрывающий материал, но не выражает его обманчивость отдельным прилагательным; этот смысл возникает из контекста главы, поэтому его не следует вносить непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «И вот» сохраняет живость указания без архаического «се»; неопределённо-личное «скажут» звучит естественнее буквального пассива. Повтор «обмазка — обмазали» намеренно отражает однокоренные слова оригинала.
