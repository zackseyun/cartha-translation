  text: So I will spend my wrath against the wall and against those who plastered it with whitewash[a], and I will say to you, ‘The wall is no more, and those who plastered it are no more,’
translation:
  language: ru
  text: 'Так Я до конца изолью Мою ярость на стену и на тех, кто покрыл её побелкой[a], и скажу вам: «Не стало стены, и не стало тех, кто её покрывал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «негодным раствором». Еврейское слово может обозначать непрочное или недоброкачественное покрытие; в данном образе оно также допускает перевод «побелкой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלֵּיתִי אֶת־חֲמָתִי
  choice: Так Я до конца изолью Мою ярость
  rationale: Пиэль כלה с חמה выражает доведение ярости до конца, её полное исчерпание. «До конца изолью» естественно по-русски передаёт завершённость действия и привычный библейский образ излития гнева.
- source_word: בַּקִּיר
  choice: на стену
  rationale: Предлог ב обозначает здесь объект, на который обращена кара. В сочетании «изолью ярость» русское «на стену» точнее и естественнее, чем «против стены».
- source_word: וּבַטָּחִים אֹתוֹ תָּפֵל
  choice: и на тех, кто обмазывал её побелкой
  rationale: טוח означает обмазывать или покрывать, а תפל в контексте указывает на негодное, поверхностное покрытие. Формулировка сохраняет конкретный образ, не раскрывая метафору прямо в тексте.
- source_word: אֵין הַקִּיר וְאֵין הַטָּחִים אֹתוֹ
  choice: Не стало стены, и не стало тех, кто её обмазывал
  rationale: אֵין выражает отсутствие или небытие; повтор «не стало» сохраняет торжественный параллелизм обеих частей.
theological_decisions:
- issue: Образ стены и её покрытия
  choice: Сохранить конкретный образ стены и побелки без пояснительного истолкования в основном тексте.
  alternative: Прямо назвать стену ложной надеждой, а обмазывавших — лжепророками.
  rationale: Контекст раскрывает смысл образа, однако сам стих произносит суд в метафорической форме. Её сохранение не привносит толкование в перевод.
- issue: Направленность Божьей ярости
  choice: Передать ярость как полностью изливаемую на стену и обмазывавших её.
  alternative: «Истреблю стену и тех, кто её обмазывал, в Моей ярости».
  rationale: Так сохраняется грамматическая структура, где прямым объектом כלה является «Моя ярость», а не стена или люди.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавные местоимения при обращении Бога к Самому Себе сохранены согласно принятой русской библейской традиции; синтаксис сделан ясным для широкого читателя.
