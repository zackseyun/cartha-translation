  text: כְּ/שֻׁעָלִ֖ים בָּ/חֳרָב֑וֹת נְבִיאֶ֥י/ךָ יִשְׂרָאֵ֖ל הָיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/004.yaml
  text: Your prophets, O Israel, have been like foxes[a] among ruins.
translation:
  language: ru
  text: Твои пророки, Израиль, были как лисицы[a] среди развалин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шакалы». Еврейское слово может обозначать более широкий круг похожих на лисицу диких псовых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֻׁעָלִים
  choice: как лисицы
  rationale: Еврейское слово обозначает лисиц либо сходных с ними диких псовых. «Лисицы» — обычный и естественный основной перевод; возможное значение «шакалы» отмечено в сноске.
- source_word: בָּחֳרָבוֹת
  choice: среди развалин
  rationale: Форма множественного числа указывает на разрушенные, опустошённые места. «Среди развалин» естественно передаёт среду обитания названных животных.
- source_word: נְבִיאֶיךָ
  choice: твои пророки
  rationale: Сочетание существительного во множественном числе с местоименным суффиксом второго лица мужского рода единственного числа. Перевод сохраняет принадлежность адресату, не добавляя отсутствующего в тексте определения «лжепророки».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя употреблено как прямое обращение; в русском тексте оно обособлено запятыми.
- source_word: הָיוּ
  choice: были
  rationale: Перфект глагола היה описывает уже сложившееся состояние. В современном русском простое прошедшее время передаёт это естественнее, чем тяжеловесное «были подобны».
theological_decisions:
- issue: Следует ли явно назвать пророков ложными
  choice: Сохранить «твои пророки» без добавления «ложные»
  alternative: твои лжепророки
  rationale: Контекст осуждает этих пророков, однако в самом стихе сказано только «твои пророки». Добавление определения устранило бы намеренно сохранённую формулировку исходного текста.
translation_notes:
  register: Современный литературный русский язык; прямое пророческое обращение сохранено без архаической инверсии. Сравнение передано ясно и кратко, а лексическая неопределённость названия животного вынесена в сноску.
