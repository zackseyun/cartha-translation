source:
  edition: WLC
  text: וְ/קָרַעְתִּ֞י אֶת מִסְפְּחֹֽתֵי/כֶ֗ם וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וְ/לֹֽא יִהְי֥וּ ע֛וֹד בְּ/יֶדְ/כֶ֖ן לִ/מְצוּדָ֑ה וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/021.yaml
  text: I will tear off your magic bands[a], and I will deliver my people from your hand, and they will no longer be in your hand as prey[b]; then you will know that I am Yahweh.
translation:
  language: ru
  text: Я разорву ваши магические повязки[a] и вырву Мой народ из ваших рук. Они уже не будут в ваших руках добычей[b], и вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повязки», «амулеты»; возможно, «покрывала». Еврейское слово редкое, и его точное значение неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для ловли», «для захвата». Еврейское выражение рисует людей как объект поимки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַעְתִּי
  choice: Я сорву с вас
  rationale: Глагол קרע означает «рвать, разрывать»; в данном контексте речь идёт о насильственном снятии предметов, которыми пользуются женщины. Добавление «с вас» естественно для русского языка и не меняет образа.
- source_word: מִסְפְּחֹתֵיכֶם
  choice: ваши магические повязки[a]
  rationale: Редкое слово, точное значение которого неизвестно. «Повязки» передаёт вероятный вид предмета, а «магические» — его функцию в контексте 13:18–21, не выдавая конкретную идентификацию за несомненную.
- source_word: הִצַּלְתִּי
  choice: избавлю
  rationale: Форма נצל выражает спасение или освобождение из чужой власти; «избавлю» естественно сочетается с последующим «от вашей власти».
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямая передача устойчивого заветного выражения.
- source_word: מִיֶּדְכֶן / בְּיֶדְכֶן
  choice: от вашей власти / в ваших руках
  rationale: Первое выражение передано по смыслу, поскольку «избавлю от вашей руки» неестественно по-русски; во втором сохранён образ рук, связанный с удержанием добычи.
- source_word: לִמְצוּדָה
  choice: добычей[b]
  rationale: В контексте слово обозначает объект ловли или захвата. «Добычей» ясно передаёт положение людей, подвергаемых хищническому захвату, при сохранении альтернатив в сноске.
- source_word: וִידַעְתֶּן
  choice: и вы узнаете
  rationale: Сохраняет сочинительную связь еврейского текста; итоговый смысл понятен из последовательности действий.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» прямо передаёт тетраграмматон и не заменяет его титулом.
- issue: Характер предметов מִסְפְּחֹתֵיכֶם
  choice: магические повязки
  alternative: повязки; амулеты; покрывала
  rationale: Контекст указывает на ритуально-магическое применение, однако форма самих предметов не вполне ясна; неопределённость отмечена в сноске.
- issue: Образ לִמְצוּדָה
  choice: добычей
  alternative: для ловли; для захвата
  rationale: Выбран результат хищнического захвата, не уточняя спорный способ ловли; возможные более буквальные понимания сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Заглавные буквы в «Мой» и «Я» обозначают речь Бога. Сохранены обращение к женщинам во множественном числе и повтор образа власти/рук без архаизмов.
