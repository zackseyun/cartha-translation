source:
  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א וְ/אָמַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֣עַן בְּ/יַ֡עַן שַׁמּוֹת֩ וְ/שָׁאֹ֨ף אֶתְ/כֶ֜ם מִ/סָּבִ֗יב לִֽ/הְיוֹתְ/כֶ֤ם מֽוֹרָשָׁה֙ לִ/שְׁאֵרִ֣ית הַ/גּוֹיִ֔ם וַ/תֵּֽעֲל֛וּ עַל שְׂפַ֥ת לָשׁ֖וֹן וְ/דִבַּת עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/003.yaml
  text: 'Therefore prophesy and say[a], Thus says the Lord GOD: Because, indeed because they have made you desolate and have snapped at you from every side, so that you became a possession for the remnant of the nations, and you have come up on the lips of the tongue and in the slander of the people[b],'
translation:
  language: ru
  text: 'Поэтому пророчествуй и скажи: «Так говорит Владыка Яхве: за то, именно за то, что вас опустошали и жадно преследовали[a] со всех сторон, чтобы вы стали владением остальных народов, и вы оказались у людей на устах и предметом людского злословия[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейский глагол труден; он может обозначать жадное, хищническое стремление к добыче, тяжёлое дыхание или попытку поглотить.
    reason: Пояснение спорного значения שָׁאֹף без навязывания одного толкования.
  - marker: b
    text: 'Буквально: «вы взошли на край языка и в злословие народа». Это образное выражение означает, что они стали предметом разговоров и порочащих речей людей.'
    reason: Пояснение древнееврейской идиомы «взойти на край языка» и отрицательного значения דִּבָּה.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логический вывод и вводит пророческий ответ на описанное ранее положение.
- source_word: הִנָּבֵא וְאָמַרְתָּ
  choice: пророчествуй и скажи
  rationale: Сохраняет повеление Иезекиилю и последовательность двух древнееврейских глаголов.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» естественно передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя, представленное тетраграмматоном.
- source_word: יַעַן בְּיַעַן
  choice: за то, именно за то, что
  rationale: Повтор передаёт усиленный характер двойного причинного оборота.
- source_word: שַׁמּוֹת
  choice: вас опустошали
  rationale: Форма от שמם обозначает разорение и превращение земли в пустынное место; множественное «вас» обращено к горам Израиля.
- source_word: שָׁאֹף
  choice: жадно преследовали
  rationale: Трудный глагол передаёт тяжёлое дыхание, алчное стремление или хищнический напор; формулировка сохраняет образ настойчивой враждебной погони без чрезмерной конкретизации.
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Естественно передаёт нападение окружающих народов.
- source_word: לִהְיוֹתְכֶם מוֹרָשָׁה
  choice: чтобы вы стали владением
  rationale: Сохраняет возможный оттенок цели или результата и имущественный смысл מוֹרָשָׁה.
- source_word: לִשְׁאֵרִית הַגּוֹיִם
  choice: остальных народов
  rationale: В данном контексте שְׁאֵרִית обозначает прочие или оставшиеся окружающие народы, а не богословски нагруженный «остаток» Израиля.
- source_word: וַתֵּעֲלוּ עַל שְׂפַת לָשׁוֹן
  choice: вы оказались у всех на устах
  rationale: Естественная русская идиома передаёт буквальный образ выхода «на край языка» и значение предмета всеобщих разговоров.
- source_word: וְדִבַּת עָם
  choice: стали предметом людской молвы
  rationale: דִבָּה может означать дурную молву, злой слух или поношение; «молва» сохраняет некоторую смысловую широту, а контекст сообщает ей отрицательный оттенок.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה, при этом избегается неестественное повторение «Господь Господь».
- issue: Значение שְׁאֵרִית применительно к народам
  choice: остальные народы
  alternative: остаток народов
  rationale: Контекст говорит об окружающих народах, захватывающих землю; перевод не вносит сюда особого богословского смысла понятия «остаток».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет длинную причинную конструкцию исходного стиха, который продолжается далее. Обращение передано во множественном числе, поскольку оно направлено к горам Израиля. Единственная сноска отмечена в основном тексте.
