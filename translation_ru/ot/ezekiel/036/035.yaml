base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/035.yaml
  text: And they will say, ‘This land that was desolate has become like the garden of Eden, and the cities that were ruined, desolate, and torn down are fortified and inhabited.’
translation:
  language: ru
  text: 'И скажут: «Эта земля, прежде опустошённая, стала подобна Эдемскому саду, а разрушенные, опустевшие и снесённые города укреплены и заселены».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָרֶץ הַלֵּזוּ הַנְּשַׁמָּה
  choice: эта земля, прежде опустошённая
  rationale: Передаёт указательное выражение и состояние запустения; «прежде» естественно выражает контраст с последующим «стала».
- source_word: כְּגַן עֵדֶן
  choice: подобна Эдемскому саду
  rationale: Сохраняет прямое сравнение с садом Эдема и естественный русский порядок слов.
- source_word: הֶעָרִים הֶחֳרֵבוֹת וְהַנְּשַׁמּוֹת וְהַנֶּהֱרָסוֹת
  choice: города, лежавшие в развалинах, опустевшие и разрушенные
  rationale: Сохраняет тройную характеристику городов, различая разорённость, безлюдность и физическое разрушение.
- source_word: בְּצוּרוֹת יָשָׁבוּ
  choice: теперь укреплены и населены
  rationale: בְּצוּרוֹת означает укреплённое состояние, а יָשָׁבוּ здесь — заселённость; «теперь» ясно передаёт подразумеваемый контраст состояний.
