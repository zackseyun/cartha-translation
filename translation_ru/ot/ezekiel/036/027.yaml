source:
  edition: WLC
  text: וְ/אֶת רוּחִ֖/י אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וְ/עָשִׂ֗יתִי אֵ֤ת אֲשֶׁר בְּ/חֻקַּ/י֙ תֵּלֵ֔כוּ וּ/מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/027.yaml
  text: And I will put my Spirit within you[a], and I will cause you to walk in my statutes[b], and you will keep my judgments and do them.
translation:
  language: ru
  text: И вложу в вас Мой Дух, и сделаю так, что вы будете ходить по Моим установлениям[a], соблюдать Мои постановления[b] и исполнять их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Моим предписаниям».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мои законы» или «Мои судебные решения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: Мой Дух
  rationale: В контексте обновления народа речь идёт о Божьем Духе, а не о дыхании или ветре. Написание с прописной буквы естественно передаёт божественный референт в русском тексте.
- source_word: בְּקִרְבְּכֶם
  choice: в вас
  rationale: Выражение обозначает пребывание внутри адресатов. В сочетании с дарованием Божьего Духа краткое «в вас» естественно передаёт внутренний характер обещанного обновления.
- source_word: וְעָשִׂיתִי אֵת אֲשֶׁר
  choice: и сделаю так, что
  rationale: 'Оборот с последующими личными глаголами выражает результативное действие Бога: Он устроит так, что народ будет повиноваться. Русская конструкция ясно передаёт этот смысл, не усиливая его сверх еврейского текста.'
- source_word: בְּחֻקַּי תֵּלֵכוּ
  choice: будете ходить по Моим установлениям
  rationale: Сохранён заветный образ «ходить», обозначающий образ жизни и поведение; «по Моим установлениям» звучит понятно и литературно.
- source_word: חֻקַּי
  choice: Моим установлениям
  rationale: חֹק/חֻקָּה обозначает предписанное установление. Этот вариант сохраняет юридико-заветный оттенок и отличается от следующего מִשְׁפָּטַי.
- source_word: מִשְׁפָּטַי
  choice: Мои постановления
  rationale: В паре с חֻקִּים слово обозначает обязательные правовые постановления или нормы. «Постановления» сохраняет юридический смысл и различие между двумя еврейскими терминами.
- source_word: תִּשְׁמְרוּ
  choice: соблюдать
  rationale: В контексте заповедей שׁמר означает хранить и исполнять предписанное; «соблюдать» — наиболее естественный современный русский эквивалент.
- source_word: וַעֲשִׂיתֶם
  choice: и исполнять их
  rationale: Заключительный глагол подчёркивает практическое осуществление постановлений. «Исполнять их» избегает неестественного русского «делать их» и сохраняет прямоту исходного текста.
theological_decisions:
- issue: Божественное действие и человеческое послушание
  choice: и сделаю так, что вы будете ходить
  alternative: и буду действовать, чтобы вы ходили
  rationale: 'Еврейский текст представляет послушание народа как результат действенного Божьего вмешательства, одновременно сохраняя за людьми действие: они будут ходить, соблюдать и исполнять. Формулировка не сводит эту напряжённость к более поздней конфессиональной схеме.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранена метафора «ходить», а синтаксис сделан естественным для широкого круга читателей. Местоимение «Мой» написано с прописной буквы как принятое в русском библейском регистре обозначение Бога.
