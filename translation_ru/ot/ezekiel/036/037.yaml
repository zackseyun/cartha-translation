source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ע֗וֹד זֹ֛את אִדָּרֵ֥שׁ לְ/בֵֽית יִשְׂרָאֵ֖ל לַ/עֲשׂ֣וֹת לָ/הֶ֑ם אַרְבֶּ֥ה אֹתָ֛/ם כַּ/צֹּ֖אן אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/037.yaml
  text: 'Thus says the Lord GOD: Yet in this also I will let the house of Israel ask me to act for them: I will multiply them like a flock of men[a][b].'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «И ещё Я позволю дому Израиля просить Меня сделать это для них[a]: Я умножу их, словно стадо людей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И ещё об этом дом Израиля будет вопрошать Меня, чтобы Я сделал это для них».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «как стадо людей» — то есть как многочисленное стадо, состоящее из людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента составного божественного титула и сохраняет личное имя Яхве, избегая неестественного повторения «Господь Господь».
- source_word: עוֹד זֹאת
  choice: И ещё ... об этом
  rationale: «Ещё» передаёт продолжение и добавочность, а «об этом» указывает на только что названное дело восстановления.
- source_word: אִדָּרֵשׁ
  choice: Я позволю ... просить Меня
  rationale: Нифаль глагола דרש здесь допускает значение «дать вопрошать себя, быть доступным для обращения». Формулировка естественна по-русски и сохраняет сочетание Божьего обещания с обращением Израиля к Нему.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохранено корпоративное заветное обозначение народа, присутствующее в еврейском тексте.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: чтобы Я сделал это для них
  rationale: Контекстуально восполняет подразумеваемый объект действия, при этом сохраняет направленность Божьего действия на благо Израиля.
- source_word: אַרְבֶּה אֹתָם
  choice: Я умножу их
  rationale: Каузативная форма רבה означает сделать многочисленными; «умножу» также сохраняет связь с языком заветных обещаний.
- source_word: כַּצֹּאן אָדָם
  choice: словно стадо людей
  rationale: Сохраняет намеренно необычный образ оригинала, где «стадо» непосредственно сочетается с собирательным אָדָם — «люди, человечество».
theological_decisions:
- issue: Передача имени יהוה в составном титуле
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Прямая передача имени Яхве сохраняет различие между титулом אֲדֹנָי и заветным именем יהוה.
- issue: Связь обещанного Божьего действия с молитвенным обращением Израиля
  choice: Я позволю дому Израиля просить Меня
  alternative: дом Израиля будет вопрошать Меня
  rationale: Основной текст отражает возможное разрешительное значение нифаля, не превращая Бога в пассивного адресата; сноска сохраняет более формальное прочтение и присущую тексту напряжённость между Божьей инициативой и прошением народа.
- issue: Собирательное значение אָדָם
  choice: людей
  alternative: человеческое
  rationale: В данном сочетании אָדָם обозначает множество людей, а не только мужчин; «людей» точно передаёт собирательный смысл без устранения необычной метафоры.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Необычный образ «стадо людей» намеренно сохранён; архаизмы вроде «взыщут Меня» и «дам вопросить Себя» не использованы.
