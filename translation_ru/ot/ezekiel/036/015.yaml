  text: וְ/לֹא אַשְׁמִ֨יעַ אֵלַ֤יִ/ךְ עוֹד֙ כְּלִמַּ֣ת הַ/גּוֹיִ֔ם וְ/חֶרְפַּ֥ת עַמִּ֖ים לֹ֣א תִשְׂאִי ע֑וֹד ו/גוי/ך לֹא תַכְשִׁ֣לִי ע֔וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/015.yaml
  text: And I will no longer let you hear the disgrace of the nations[a], and you will no longer bear the reproach of the peoples, and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: ru
  text: И Я больше не дам тебе слышать позор от народов; ты больше не будешь сносить поношение племён и больше не заставишь свой народ спотыкаться[a], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не приведёшь свой народ к падению». Согласно иной традиции истолкования: «не будешь больше лишать свой народ детей». Еврейский согласный текст этого места труден; масоретская огласовка поддерживает перевод «заставлять спотыкаться».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁמִיעַ
  choice: дам тебе слышать
  rationale: Каузативная форма глагола שׁמע буквально означает «сделаю так, что ты услышишь»; отрицательная конструкция естественно передана как «не дам тебе слышать», то есть больше не подвергну вражеским насмешкам.
- source_word: כְּלִמַּת
  choice: позор
  rationale: Слово обозначает публичный стыд, унижение или бесчестье; «позор» естественно сочетается с указанием на народы как источник унижения.
- source_word: הַגּוֹיִם
  choice: народов
  rationale: Речь идёт об окружающих народах, а не о позднейшем религиозном противопоставлении «язычников».
- source_word: חֶרְפַּת
  choice: поношение
  rationale: Передаёт насмешку, оскорбление и презрение, сохраняя отличие от כְּלִמָּה и возвышенный пророческий регистр.
- source_word: עַמִּים
  choice: племён
  rationale: Так сохраняется лексическое различие с גּוֹיִם («народы») без изменения общего смысла — речь о чужих этнических сообществах.
- source_word: תִשְׂאִי
  choice: сносить
  rationale: נשׂא в сочетании с «поношением» означает терпеть или нести его; «сносить поношение» звучит естественно по-русски.
- source_word: וגויך
  choice: свой народ
  rationale: Согласуется с обращением к земле Израиля в женском роде и передаёт единственное число גוי с суффиксом второго лица; возвратное «свой» естественно для русского синтаксиса.
- source_word: תַכְשִׁלִי
  choice: заставишь ... спотыкаться
  rationale: Масоретская огласовка поддерживает каузативное значение породы hифиль от כשל — «заставлять спотыкаться, приводить к падению».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передаёт формулу пророческого изречения; «возвещает» сохраняет её торжественный характер. אֲדֹנָי передано как титул «Владыка», а יהוה — как личное имя «Яхве», без неестественного повтора «Господь Господь».
theological_decisions:
- issue: Передача имени יהוה в формуле אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: Перевод сохраняет различие между титулом אֲדֹנָי и личным заветным именем יהוה, не смешивая их и не создавая повтора.
- issue: Смысл תַכְשִׁילִי при трудном согласном тексте
  choice: заставишь свой народ спотыкаться
  alternative: приведёшь свой народ к падению; лишишь свой народ детей
  rationale: Основной текст следует масоретской огласовке и обычному каузативному значению כשל, а иная древняя интерпретационная традиция честно отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение к земле сохраняется в женском роде. Параллельные понятия כְּלִמָּה и חֶרְפָּה различены как «позор» и «поношение»; גּוֹיִם и עַמִּים — как «народы» и «племена».
