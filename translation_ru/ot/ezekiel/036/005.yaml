  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֠א בְּ/אֵ֨שׁ קִנְאָתִ֥/י דִבַּ֛רְתִּי עַל שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם וְ/עַל אֱד֣וֹם כֻּלָּ֑/א אֲשֶׁ֣ר נָתְנֽוּ אֶת אַרְצִ֣/י לָ֠/הֶם לְ/מ֨וֹרָשָׁ֜ה בְּ/שִׂמְחַ֤ת כָּל לֵבָב֙ בִּ/שְׁאָ֣ט נֶ֔פֶשׁ לְמַ֥עַן מִגְרָשָׁ֖/הּ לָ/בַֽז־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/005.yaml
  text: 'Therefore thus says the Lord GOD: Surely in the fire of my jealousy I have spoken against the remnant of the nations and against all Edom[a], who gave my land to themselves as a possession with wholehearted joy and with contempt of soul[c][b], in order to make its pastureland plunder.'
translation:
  language: ru
  text: '«Поэтому так говорит Владыка Яхве: истинно, в огне Моей ревности Я говорил против остатка народов[a] и против всего Эдома, которые с ликованием от всего сердца и с презрением в душе присвоили себе Мою землю как владение[b], чтобы отдать её пастбища на разграбление[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остальных народов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отдали Мою землю самим себе во владение»; возможен перевод: «в наследственное владение».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст заключительной части стиха труден; возможен также смысл: «чтобы разграбить её открытые земли».'
    reason: textual_difficulty
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента титула: אֲדֹנָי как «Владыка», а личное имя יהוה — как «Яхве», избегая неестественного повтора «Господь Господь».'
- source_word: אִם לֹא
  choice: истинно
  rationale: В пророческой речи сочетание служит усилительной формулой, близкой к клятвенному заверению, а не обычным условием «если не».
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: в огне Моей ревности
  rationale: Сохранены образ огня и напряжённое значение קִנְאָה — ревностная, защищающая свои права решимость.
- source_word: דִבַּרְתִּי עַל
  choice: Я выступил против
  rationale: В данном контексте דִבֵּר עַל означает враждебное пророческое высказывание; «выступил против» естественно выражает и речь, и направленность суда.
- source_word: שְׁאֵרִית הַגּוֹיִם
  choice: остатка народов
  rationale: Сохраняет основное значение שְׁאֵרִית без придания слову положительного богословского смысла; возможное контекстуальное значение — «остальных народов».
- source_word: אֱדוֹם כֻּלָּהּ
  choice: всего Эдома
  rationale: Естественно передаёт охват всей страны или народа Эдома.
- source_word: נָתְנוּ אֶת אַרְצִי לָהֶם לְמוֹרָשָׁה
  choice: присвоил себе Мою землю
  rationale: Передаёт передачу земли самим себе во владение и подчёркивает неправомерное завладение; מוֹרָשָׁה допускает также «наследственное владение».
- source_word: בְּשִׂמְחַת כָּל לֵבָב
  choice: с ликованием от всего сердца
  rationale: Идиоматично выражает полную, искреннюю радость захватчиков.
- source_word: בִּשְׁאָט נֶפֶשׁ
  choice: с презрением в душе
  rationale: Сохраняет значение презрения или пренебрежения и указывает на внутреннее расположение, выраженное словом נֶפֶשׁ.
- source_word: לְמַעַן מִגְרָשָׁהּ לָבַז
  choice: чтобы сделать её пастбища добычей
  rationale: Следует наиболее прямому разбору מִגְרָשׁ как «пастбище, открытая земля» и לָבַז как указанию на добычу, не скрывая трудности сжатой еврейской конструкции.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул и личное имя Бога и прямо сохраняет тетраграмматон, не добавляя конфессионально специфического толкования.
- issue: Значение קִנְאָה применительно к Богу
  choice: ревность
  alternative: рвение
  rationale: «Ревность» сохраняет личностно-заветный и судебный оттенок исходного слова, тогда как «рвение» могло бы чрезмерно ослабить его напряжённость.
- issue: Характер действий народов по отношению к земле
  choice: присвоил себе Мою землю
  alternative: взял Мою землю в наследственное владение
  rationale: Контекст подчёркивает незаконный захват Божьей земли; при этом альтернативное наследственное значение מוֹרָשָׁה отмечено в сноске, а не исключено.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конкретные образы «огонь» и «ревность» сохранены, а тяжеловесные буквальные обороты сглажены лишь там, где это необходимо для ясности. Род множественного подлежащего («остаток… и весь Эдом») передан собирательным относительным оборотом «тех, кто».
