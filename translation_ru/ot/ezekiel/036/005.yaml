  source_fidelity: 'В целом смысл передан верно: сохранены усилительная клятвенная формула, огонь Божьей ревности, направленность речи против окружающих народов и Эдома, незаконное присвоение земли и трудный заключительный оборот. Однако «Я выступил против» несколько размывает исходное דִבַּרְתִּי («Я говорил/сказал»), а «сделать её пастбища добычей» по-русски звучит не вполне естественно и может неясно передавать цель разграбления.'
