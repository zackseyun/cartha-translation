base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/023.yaml
  text: I will sanctify my great name[a], which has been profaned among the nations, which you have profaned among them. Then the nations will know that I am Yahweh, declares the Lord GOD[b], when I show myself holy through you before their eyes.
translation:
  language: ru
  text: Я явлю святость Моего великого имени[a], которое было осквернено среди народов и которое вы осквернили среди них. И узнают народы, что Я — Яхве, — возвещает Владыка Яхве, — когда Я явлю Себя святым через вас у них на глазах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Я освящу Моё великое имя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда Я явлю Себя святым в вас у них на глазах»; более буквально: «когда Я освящусь в вас у них на глазах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: Я явлю святость
  rationale: Пиэль от קדשׁ здесь означает публично утвердить и показать святость имени Бога, а не сделать священным то, чему прежде недоставало святости.
- source_word: שְׁמִי הַגָּדוֹל
  choice: Моего великого имени
  rationale: Естественно передаёт сочетание существительного с определением и сохраняет идеи величия и публичной славы Божьего имени.
- source_word: הַמְחֻלָּל
  choice: которое было осквернено
  rationale: Причастие пуаля от חלל обозначает обращение со святым как с обыденным, то есть поругание или осквернение Божьего имени.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: В контексте Иезекииля גוים — окружающие Израиль народы; перевод не привносит более позднее противопоставление иудеев и язычников.
- source_word: אֲשֶׁר חִלַּלְתֶּם בְּתוֹכָם
  choice: которое вы осквернили среди них
  rationale: Относительное предложение вновь относится к Божьему имени; ישראל осквернил его, находясь среди народов.
- source_word: וְיָדְעוּ
  choice: И узнают
  rationale: Союз сохраняется, а последовательность фраз ясно выражает результат Божьего действия без излишнего уточнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передано современной торжественной формулой пророческого изречения; אֲדֹנָי и יהוה сохранены соответственно как титул и имя.
- source_word: בְּהִקָּדְשִׁי בָכֶם
  choice: когда Я явлю Свою святость через вас
  rationale: Инфинитив нифаля описывает публичное проявление Божьей святости в Его действиях по отношению к Израилю; בָכֶם допускает как локально-относительное «в вас», так и инструментальное «через вас».
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Естественная русская идиома, подчёркивающая открытый и видимый характер события.
theological_decisions:
- issue: Значение קדשׁ применительно к Божьему имени
  choice: Я явлю святость Моего великого имени
  alternative: Я освящу Моё великое имя
  rationale: Контекст говорит не о приобретении Богом или Его именем святости, а о её публичном утверждении после осквернения имени Израилем. Более формальная альтернатива сохранена в сноске.
- issue: Значение ב в выражении בְּהִקָּדְשִׁי בָכֶם
  choice: когда Я явлю Свою святость через вас
  alternative: когда Я явлю Свою святость в вас / когда освящусь в вас
  rationale: В контексте Бог открывает народам Свою святость посредством того, что совершает с Израилем. Еврейская формулировка остаётся неоднозначной, поэтому более буквальное прочтение приведено в сноске.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Так сохраняются и титул אֲדֹנָי, и личное имя יהוה без смешения двух разных элементов исходного выражения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. «Явлю святость» понятно обычному читателю и точнее раскрывает публичный смысл קדשׁ в данном контексте. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
