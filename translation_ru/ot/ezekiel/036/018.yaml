  text: So I poured out my wrath upon them for the blood that they had poured out on the land[a], and because they had defiled it with their idols.
translation:
  language: ru
  text: И Я излил на них мой гнев за кровь, которую они пролили на землю, и за то, что они осквернили её своими идолами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово גִּלּוּלִים — резко презрительное обозначение идолов; эту уничижительную окраску иногда передают как «мерзкие идолы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: Я излил
  rationale: Форма глагола שׁפך передаёт последовательное действие; «излил» естественно сочетается с «гнев» и сохраняет образ излияния.
- source_word: חֲמָתִי
  choice: Мой гнев
  rationale: חֵמָה обозначает сильный, пылающий гнев; в контексте Божьего суда русское «гнев» звучит торжественно и не сводит смысл к неконтролируемой эмоции.
- source_word: עַל הַדָּם אֲשֶׁר שָׁפְכוּ
  choice: за кровь, которую они пролили
  rationale: «За» ясно выражает основание суда, а «пролили кровь» естественно передаёт שׁפך и отчасти сохраняет повтор корня с «излил».
- source_word: עַל הָאָרֶץ
  choice: на эту землю
  rationale: В данном контексте הָאָרֶץ означает землю Израиля, а не весь мир; указательное «эту» естественно отсылает к уже названной в контексте земле.
- source_word: וּבְגִלּוּלֵיהֶם
  choice: своими идолами[a]
  rationale: Предлог בְ передан инструментально. «Идолы» ясно и естественно выражает предмет референции, а уничижительная окраска גִּלּוּלִים отмечена в сноске.
- source_word: טִמְּאוּהָ
  choice: осквернили её
  rationale: Пиэль глагола טמא означает сделать нечистым, осквернить; местоимение женского рода отсылает к земле.
theological_decisions:
- issue: Характер Божьего суда
  choice: «излил на них Мой гнев»
  alternative: «излил на них Мою ярость»
  rationale: «Гнев» сохраняет образ Божьего судебного ответа на кровопролитие и идолопоклонство, не представляя его просто эмоциональным порывом.
- issue: Основания суда и синтаксическая связь второй причины
  choice: «за кровь… и за то, что своими идолами осквернили её»
  alternative: «за кровь… и своими идолами осквернили её»
  rationale: Формулировка ясно показывает два связанных основания излияния гнева — кровопролитие на земле и её осквернение идолами, не меняя причинной логики еврейского текста.
- issue: Значение הָאָרֶץ
  choice: «эта земля» — земля Израиля
  alternative: «земля» в универсальном смысле, весь мир
  rationale: Ближайший контекст книги Иезекииля говорит об осквернении земли Израиля; перевод не расширяет референцию до всей земли.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повтор образа излияния передан сочетанием «излил… кровь, которую… пролили»; параллельность двух оснований суда выражена явно.
