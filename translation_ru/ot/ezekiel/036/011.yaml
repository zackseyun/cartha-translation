  text: וְ/הִרְבֵּיתִ֧י עֲלֵי/כֶ֛ם אָדָ֥ם וּ/בְהֵמָ֖ה וְ/רָב֣וּ וּ/פָר֑וּ וְ/הוֹשַׁבְתִּ֨י אֶתְ/כֶ֜ם כְּ/קַדְמֽוֹתֵי/כֶ֗ם וְ/הֵטִֽבֹתִי֙ מֵ/רִאשֹׁ֣תֵי/כֶ֔ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/011.yaml
  text: And I will multiply upon you man and beast[a], and they will multiply and be fruitful; and I will settle you as in your former times, and I will do better for you than at your beginnings[c][b]. Then you will know that I am Yahweh.
translation:
  language: ru
  text: Я умножу на вас людей и скот[a]; они станут многочисленными и плодовитыми. Я заселю вас, как в прежние времена[b], и сделаю для вас больше добра, чем вначале[c]. И вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека и скот»; это собирательное обозначение человеческого и животного населения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, если «вас» понимается как народ: «поселю вас» или «снова поселю вас». В контексте непосредственное обращение направлено к горам Израиля.'
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: 'Или: «облагодетельствую вас больше, чем вначале».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי עֲלֵיכֶם
  choice: Я умножу на вас
  rationale: Каузативная форма רבה передаёт увеличение численности, а עֲלֵיכֶם сохраняет образ людей и скота, умножающихся на горах Израиля, к которым обращена речь.
- source_word: אָדָם וּבְהֵמָה
  choice: людей и скот
  rationale: אָדָם здесь имеет собирательное значение человеческого населения, а בְּהֵמָה обозначает животных, прежде всего домашний скот. Русская пара естественно передаёт противопоставление людей и животных.
- source_word: וְרָבוּ וּפָרוּ
  choice: они станут многочисленными и плодовитыми
  rationale: 'Оба глагола относятся к людям и скоту вместе: רבה выражает рост численности, פרה — способность плодиться. Формулировка сохраняет оба смысловых компонента без искусственного повтора «умножатся».'
- source_word: וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: Я заселю вас
  rationale: Hiphil глагола ישב означает сделать обитаемыми, поселить или вновь заселить. Поскольку обращение направлено к горам Израиля, «заселю вас» естественно выражает восстановление их населённости.
- source_word: כְּקַדְמֹתֵיכֶם
  choice: как в прежние времена
  rationale: Слово указывает на прежнее состояние или прежние времена адресатов; перевод не утверждает полного тождества с прошлым.
- source_word: וְהֵטִבֹתִי מֵרִאשֹׁתֵיכֶם
  choice: и сделаю вам больше добра, чем прежде
  rationale: Hiphil יטב выражает благодеяние или улучшение, а сравнительное מִן указывает, что будущее благо превзойдёт прежнее состояние.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: И вы узнаете, что Я — Яхве
  rationale: Сохранена характерная для Иезекииля формула узнавания и личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное заветное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: К кому относится местоимение «вас» в וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: к горам Израиля, которые Бог вновь сделает населёнными
  alternative: к народу, которого Бог поселит
  rationale: Непосредственные адресаты в контексте — горы Израиля, и выражение «заселю вас» допускает естественный смысл наполнения земли жителями. Сноска отмечает возможную глагольную формулировку, не устраняя грамматическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранён необычный пространственный образ «на вас», поскольку речь обращена к горам Израиля; более трудные лексические и синтаксические варианты вынесены в сноски.
