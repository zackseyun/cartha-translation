  text: וִ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֹֽתֵי/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/028.yaml
  text: You will dwell in the land that I gave to your fathers[a], and you will be my people, and I will be your God.
translation:
  language: ru
  text: И будете жить на земле, которую Я дал вашим отцам[a]. Вы будете Моим народом, а Я буду вашим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предкам». Буквально: «отцам»; это выражение перекликается с обещаниями, данными праотцам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִישַׁבְתֶּם
  choice: будете жить
  rationale: Глагол ישׁב здесь обозначает постоянное проживание; в пророческом контексте форма имеет будущее значение. «Будете жить» естественно передаёт смысл по-русски, не добавляя оттенка первоначального заселения.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: В контексте заветного обещания אֶרֶץ означает обещанную землю. Русское управление «жить на земле» естественно и сохраняет библейский мотив земли.
- source_word: אֲשֶׁר נָתַתִּי
  choice: которую Я дал
  rationale: Форма נָתַתִּי указывает на совершившийся дар; прошедшее время точно и естественно передаёт еврейскую конструкцию.
- source_word: לַאֲבֹתֵיכֶם
  choice: вашим отцам
  rationale: Буквально «вашим отцам». Такой перевод сохраняет мужской род исходного выражения и его связь с обещаниями, данными праотцам; более общее «предкам» отмечено в сноске.
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: вы будете Моим народом
  rationale: Это устойчивая формула завета. Притяжательная конструкция естественно передаёт буквальное «будете Мне народом» и сохраняет богословскую насыщенность формулы.
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: а Я буду вашим Богом
  rationale: Устойчивая русская передача формулы завета «Я буду вам Богом». Союз «а» естественно подчёркивает взаимное соответствие двух частей, а явное «Я» передаёт акцент местоимения אָנֹכִי.
theological_decisions:
- issue: Передача формулы завета
  choice: «Вы будете Моим народом, а Я буду вашим Богом»
  alternative: «Вы будете Мне народом, и Я буду вам Богом»
  rationale: Идиоматическая русская формулировка сохраняет взаимность, смысл и каноническое звучание классической формулы завета, не превращая её в толкование.
- issue: Обозначение прежних поколений
  choice: «отцам» в основном тексте
  alternative: «предкам»
  rationale: Еврейское אֲבוֹת буквально означает «отцы» и здесь отсылает к заветным обещаниям праотцам. Вариант «предкам» допустим по смыслу и приведён в сноске, чтобы не скрывать лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранена краткая формула завета; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
