base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/032.yaml
  text: It is not for your sake that I am acting[a], declares the Lord GOD; let it be known to you. Be ashamed and humiliated because of your ways, O house of Israel.
translation:
  language: ru
  text: Не ради вас Я это делаю, — возвещает Господь Яхве. — Пусть это будет вам известно. Устыдитесь и покройтесь позором из-за своих путей, дом Израиля!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַנְכֶם
  choice: ради вас
  rationale: Оборот естественно передаёт значение цели или пользы; отрицание подчёркивает, что действия Бога совершаются не ради Израиля.
- source_word: אֲנִי עֹשֶׂה
  choice: Я это делаю
  rationale: Причастие עֹשֶׂה обозначает совершаемое действие; местоимение «это» естественно отсылает к действиям, описанным выше.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передано как торжественная пророческая формула, а сочетание титула אֲדֹנָי с личным именем יהוה сохранено без их слияния.
- source_word: יִוָּדַע לָכֶם
  choice: Пусть это будет вам известно
  rationale: Сохраняет страдательную форму и побудительный оттенок еврейского имперфекта в данном контексте.
- source_word: בּוֹשׁוּ וְהִכָּלְמוּ
  choice: Устыдитесь и покройтесь позором
  rationale: Два повелительных глагола переданы различно, чтобы сохранить нарастание от внутреннего стыда к переживаемому бесчестию.
- source_word: מִדַּרְכֵיכֶם
  choice: из-за своих путей
  rationale: Предлог מִן указывает на причину стыда, а образ «путей» сохраняет библейское обозначение образа жизни и поступков.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено собирательное обозначение народа и его функция прямого обращения.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה и не превращает их в два сходных титула.
- issue: Основание Божьего действия
  choice: Не ради вас Я это делаю
  alternative: Не ради вашей пользы Я это делаю
  rationale: Формулировка сохраняет широту לְמַעַנְכֶם и не уточняет сверх текста, идёт ли речь исключительно о заслугах, выгоде или иной причине, связанной с Израилем.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; метафора «пути» и коллективное обращение «дом Израиля» сохранены как значимые библейские образы.
