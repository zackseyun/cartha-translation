  yaml_path: translation/ot/ezekiel/036/013.yaml
  text: 'Thus says the Lord GOD: Because they say of you[b][a], ‘You devour people and have bereaved your nation,’'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «За то, что о тебе говорят: „Ты пожираешь людей[a] и лишаешь свой народ детей[b]“,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пожираешь человека»; слово «человек» употреблено здесь в собирательном значении — люди, человечество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оставляешь свой народ без детей», «делаешь свой народ бездетным».'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула, естественная и торжественная в современном русском языке.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и позволяет избежать сочетания «Господь Господь».
- source_word: יַעַן
  choice: За то, что
  rationale: Причинная конструкция относится к последующему объявлению суда; незавершённость фразы в пределах стиха отражает синтаксическую связь со следующим стихом.
- source_word: אֹמְרִים לָכֶם
  choice: о тебе говорят
  rationale: Предлог ל здесь вводит содержание высказывания о земле; единственное число в русском согласовано с олицетворённой землёй, к которой обращена речь.
- source_word: אֹכֶלֶת אָדָם
  choice: пожираешь людей
  rationale: Глагол сохраняет сильный образ пожирания, а собирательное אָדָם естественно передано множественным «людей».
- source_word: וּמְשַׁכֶּלֶת גּוֹיִךְ
  choice: оставляешь свой народ без детей
  rationale: Порода piel глагола שׁכל означает лишать детей, делать бездетным; «народ» здесь естественнее русского «нация» и сохраняет корпоративный смысл גוי.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь; Господь Яхве
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, не заменяя имя конфессионально обусловленным титулом.
- issue: Образ земли, лишающей народ детей
  choice: оставляешь свой народ без детей
  alternative: лишаешь свой народ детей; делаешь свой народ бездетным
  rationale: Формулировка сохраняет буквальный образ утраты детей и не сужает значение до выкидыша или естественного бесплодия.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы и яркой метафоры. Форма «За то, что…» намеренно оставляет предложение незавершённым, поскольку причинная конструкция продолжается в следующем стихе.
