base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/033.yaml
  text: 'Thus says the Lord GOD: On the day I cleanse you from all your iniquities[a], I will cause the cities to be inhabited[c][b], and the ruins will be rebuilt.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве[a]: «В день, когда Я очищу вас от всех ваших беззаконий, Я сделаю города обитаемыми[b], и руины будут восстановлены[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Владыка Господь». Еврейское אֲדֹנָי יְהוִה — составной божественный титул.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Я заселю города», «Я сделаю так, что в городах будут жить люди».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «разрушенные места», «опустошённые места».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт составной божественный титул естественным и торжественным русским выражением, различая אֲדֹנָי и имя יהוה; возможная более буквальная передача имени отмечена в сноске.
- source_word: בְּיוֹם טַהֲרִי אֶתְכֶם
  choice: В тот день, когда Я очищу вас
  rationale: Сохраняет временной образ «в день» и естественно раскрывает еврейскую конструкцию с инфинитивом и субъектом первого лица.
- source_word: מִכֹּל עֲוֺנוֹתֵיכֶם
  choice: от всех ваших беззаконий
  rationale: «Беззакония» передаёт нравственную тяжесть עָוֹן и сохраняет множественное число; предлог «от» выражает очищение и освобождение от них.
- source_word: וְהוֹשַׁבְתִּי אֶת הֶעָרִים
  choice: Я сделаю города обитаемыми
  rationale: Каузативная форма ישׁב означает, что Бог сделает так, чтобы города снова были населены; формулировка не вводит отсутствующего в тексте прямого обозначения жителей.
- source_word: וְנִבְנוּ הֶחֳרָבוֹת
  choice: развалины будут отстроены
  rationale: Сохраняет пассивную форму глагола и естественно передаёт חֳרָבוֹת как разрушенные места или строения.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Основной вариант следует укоренившейся русской благоговейной передаче тетраграмматона словом «Господь», не превращая сочетание в неестественное «Господь Господь». В сноске сохранена возможность прямо передать личное имя как «Яхве».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; каузативность и пассивная форма еврейского текста сохранены без излишней буквальности.
