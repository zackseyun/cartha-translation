base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/019.yaml
  text: So I scattered them among the nations[a], and they were dispersed through the lands; I judged them according to their ways and according to their deeds.
translation:
  language: ru
  text: Я рассеял их среди народов, и они были рассеяны по странам. Я судил их по их путям и по их делам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָפִיץ
  choice: Я рассеял
  rationale: 'Каузативная форма породы hифиль от פוץ прямо выражает действие Бога: он рассеял народ. «Рассеял» естественно звучит по-русски и не уточняет способ изгнания сверх сказанного в тексте.'
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם обозначает здесь чужие народы, среди которых оказались изгнанники. «Народы» сохраняет ветхозаветное словоупотребление без более поздних ассоциаций слова «язычники».
- source_word: וַיִּזָּרוּ
  choice: они были развеяны
  rationale: Страдательная форма дополняет предшествующее действие Бога и описывает наступившее рассеяние. «Развеяны» сохраняет образ и позволяет избежать дословного повтора «рассеял — рассеяны».
- source_word: בָּאֲרָצוֹת
  choice: по разным странам
  rationale: Множественное число אֲרָצוֹת в контексте изгнания указывает на ряд земель или стран. Добавление «разным» естественно передаёт распределённость, уже выраженную множественным числом и глаголом рассеяния.
- source_word: כְּדַרְכָּם
  choice: по их путям
  rationale: Сохраняется пророческая метафора «пути» как образа поведения и образа жизни; оборот «судить по» в современном русском понятен.
- source_word: וְכַעֲלִילוֹתָם
  choice: и по их делам
  rationale: עֲלִילוֹת обозначает поступки или деяния, здесь с нравственной оценкой. «Дела» кратко и весомо передаёт этот смысл.
- source_word: שְׁפַטְתִּים
  choice: Я судил их
  rationale: שׁפט прежде всего означает «судить». Такой перевод сохраняет судебную рамку и не сужает значение до одного лишь наказания.
theological_decisions:
- issue: Связь Божьего суда с изгнанием
  choice: Изгнание представлено как совершённое Богом действие, соответствующее путям и делам народа.
  alternative: Можно было бы сильнее подчеркнуть лишь состояние рассеяния, ослабив явное указание на Божье действие.
  rationale: Первое лицо в «Я рассеял» и «Я судил» прямо связывает рассеяние с Божьим судебным действием. Перевод сохраняет это утверждение, не развивая его дальше самого стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для широкого читателя; сохранены ключевые образы «пути» и «дела», а также различие между активным рассеянием Богом и последующим состоянием народа.
