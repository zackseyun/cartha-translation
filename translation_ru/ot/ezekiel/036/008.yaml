source:
  edition: WLC
  text: וְ/אַתֶּ֞ם הָרֵ֤י יִשְׂרָאֵל֙ עַנְפְּ/כֶ֣ם תִּתֵּ֔נוּ וּ/פֶרְיְ/כֶ֥ם תִּשְׂא֖וּ לְ/עַמִּ֣/י יִשְׂרָאֵ֑ל כִּ֥י קֵרְב֖וּ לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/008.yaml
  text: But you[a], mountains of Israel, shall put forth your branches and bear your fruit for my people Israel, for they are about to come.
translation:
  language: ru
  text: А вы, горы Израиля, пустите свои ветви и принесёте плоды для Моего народа Израиля, ведь они скоро придут[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь их возвращение близко».'
    reason: Сочетание קֵרְבוּ לָבוֹא буквально связывает приближение с приходом и допускает как личную формулировку «они скоро придут», так и естественную по-русски именную формулировку о близком возвращении.
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: горы Израиля
  rationale: Конструктивное сочетание естественно обозначает «горы Израиля»; у Иезекииля это повторяющееся олицетворённое обращение к земле через её рельеф.
- source_word: עַנְפְּכֶם תִּתֵּנוּ
  choice: пустите свои ветви
  rationale: Глагол נתן буквально означает «давать», но в сочетании с ветвями по-русски естественно «пустить ветви»; образ оживающей и плодородной земли сохранён.
- source_word: וּפֶרְיְכֶם תִּשְׂאוּ
  choice: принесёте плоды
  rationale: נשא — «нести»; в сочетании с плодом соответствует русскому выражению «приносить плоды» и сохраняет параллелизм с ветвями.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: для Моего народа Израиля
  rationale: Предлог ל выражает пользу или предназначение; перевод сохраняет заветное «Мой народ» и название Израиль.
- source_word: כִּי קֵרְבוּ לָבוֹא
  choice: ведь они скоро придут
  rationale: כִּי вводит основание обещания, а сочетание קרב с инфинитивом выражает близость предстоящего прихода. «Скоро придут» естественно передаёт эту мысль, не устраняя личного референта множественного глагола.
theological_decisions:
- issue: К кому относится подразумеваемое «они» в заключительной фразе
  choice: К народу Израиля, то есть к возвращающимся изгнанникам
  alternative: Безличное указание на близость их возвращения
  rationale: Ближайший смысловой антецедент — «Мой народ Израиля»; множественное число еврейского глагола допускает понимание народа как множества людей. Альтернативная формулировка сохранена в сноске, поскольку конструкцию можно естественно передать и существительным «возвращение».
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Олицетворение гор сохранено; тяжеловесный буквализм «дадите ветви» устранён. Местоимение при Боге написано с прописной буквы по принятой русской библейской традиции.
