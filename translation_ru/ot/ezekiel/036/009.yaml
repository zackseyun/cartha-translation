  yaml_path: translation/ot/ezekiel/036/009.yaml
  text: For behold[a], I am for you, and I will turn to you, and you will be cultivated and sown.
translation:
  language: ru
  text: 'Ибо вот: Я к вам благосклонен[a]; Я обращусь к вам, и вас будут возделывать и засевать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я обращён к вам». Еврейское выражение передаёт благосклонную направленность говорящего к адресатам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего обещания и сохраняет явную логическую связь с контекстом.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Передаёт указательно-привлекающую внимание формулу и сохраняет торжественность пророческой речи без архаического «се».
- source_word: אֲלֵיכֶם
  choice: за вас
  rationale: В данном контексте предлог выражает благосклонную направленность Господа к земле и горам Израиля, а не только пространственное движение.
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: Я обращусь к вам
  rationale: Сохраняет образ поворота к адресату и передаёт благосклонное внимание и последующее действие.
- source_word: וְנֶעֱבַדְתֶּם
  choice: вас будут возделывать
  rationale: Нифаль глагола עבד здесь имеет пассивный сельскохозяйственный смысл применительно к земле.
- source_word: וְנִזְרַעְתֶּם
  choice: и засевать
  rationale: Передаёт пассивный смысл нифаля от זרע в естественной русской конструкции с неопределённо-личным сказуемым.
theological_decisions:
- issue: Направленность Бога, выраженная אֲלֵיכֶם после הִנְנִי
  choice: Я — за вас
  alternative: Я обращён к вам; Я направляюсь к вам
  rationale: Контекст обещает благосклонное возвращение Господа к земле Израиля. Формулировка «за вас» выражает поддержку, но не добавляет к тексту более узких богословских утверждений; буквальная направленность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Вместо архаического «се» употреблено «вот»; сельскохозяйственные пассивы переданы естественной неопределённо-личной конструкцией.
