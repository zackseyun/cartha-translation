  text: וְ/יָדְע֣וּ הַ/גּוֹיִ֗ם אֲשֶׁ֣ר יִֽשָּׁאֲרוּ֮ סְבִיבוֹתֵי/כֶם֒ כִּ֣י אֲנִ֣י יְהוָ֗ה בָּנִ֨יתִי֙ הַ/נֶּ֣הֱרָס֔וֹת נָטַ֖עְתִּי הַ/נְּשַׁמָּ֑ה אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/036.yaml
  text: Then the nations that remain around you will know that I[a], Yahweh, have rebuilt the ruined places and planted what was desolate. I, Yahweh, have spoken, and I will do it.
translation:
  language: ru
  text: Тогда народы, которые останутся вокруг вас, узнают, что Я, Яхве, отстроил разрушенное и засадил опустошённую землю. Я, Яхве, сказал — и сделаю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказал и сделал». Последний еврейский глагол формально стоит в перфекте, но здесь, вероятно, подчёркивает несомненность того, что Яхве совершит.'
    reason: 'Лексико-грамматическая альтернатива: пророческий перфект допускает формально прошедшую передачу.'
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Тогда ... узнают
  rationale: Форма продолжает предшествующее обещание восстановления и указывает на его результат; «тогда» естественно передаёт ход мысли и будущее значение.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Речь идёт об окружающих Израиль народах; «народы» точнее и нейтральнее позднейшего религиозного термина «язычники».
- source_word: אֲשֶׁר יִשָּׁאֲרוּ סְבִיבוֹתֵיכֶם
  choice: которые останутся вокруг вас
  rationale: Нифаль глагола נשׁאר означает «остаться, быть оставленным»; перевод сохраняет обращение во множественном числе и пространственное значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בָּנִיתִי הַנֶּהֱרָסוֹת
  choice: отстроил разрушенное
  rationale: Глагол בנה буквально означает «строить», но при объекте «разрушенное» контекст требует значения восстановления; собирательная формулировка не сужает объект до одних городов.
- source_word: נָטַעְתִּי הַנְּשַׁמָּה
  choice: засадил опустошённую землю
  rationale: נטע означает «сажать, насаждать»; субстантивированная форма הַנְּשַׁמָּה обозначает опустошённую местность. Добавление «землю» делает выражение естественным по-русски и соответствует контексту восстановления страны.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: сказал — и сделаю
  rationale: Первый перфект передан прошедшим временем, а заключительный перфект — будущим как выражение несомненного исполнения пророческого обещания. Тире передаёт энергичность формулы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Временное значение וְעָשִׂיתִי в пророческой формуле
  choice: и сделаю
  alternative: и сделал
  rationale: Хотя форма морфологически является перфектом, в обещании она может представлять будущее действие как несомненное. Основной текст передаёт эту силу будущим временем, а формальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной пророческой интонацией. Параллелизм и двукратное «Я, Яхве» сохранены; неоднозначность заключительного перфекта отмечена сноской.
