base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/006.yaml
  text: 'Therefore prophesy concerning the land of Israel, and say to the mountains and the hills, to the ravines and the valleys, ‘Thus says the Lord GOD: Look, I have spoken in my jealousy and in my wrath, because you have borne the disgrace of the nations.’'
translation:
  language: ru
  text: 'Поэтому пророчествуй о земле Израиля и скажи горам и холмам, оврагам и долинам: «Так говорит Владыка Господь: вот, в Моей ревности и в Моём гневе Я сказал: вы терпели поношение от народов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנָּבֵא עַל
  choice: пророчествуй о
  rationale: Естественно передаёт повеление и предмет пророчества, не сужая значение предлога עַל.
- source_word: לָאֲפִיקִים
  choice: оврагам
  rationale: В данном ряду форм рельефа слово обозначает русла, лощины или овраги; «оврагам» ясно и естественно по-русски.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Сохраняет различие двух божественных наименований и принятую благоговейную передачу тетраграмматона без введения конфессионально спорной транслитерации.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Сохраняет эмфатический указательный элемент и его связь с речью Бога.
- source_word: בְקִנְאָתִי
  choice: в Моей ревности
  rationale: Передаёт קנאה как горячую, исключительную Божью ревность, не подменяя её более узким словом «зависть».
- source_word: כְּלִמַּת גּוֹיִם נְשָׂאתֶם
  choice: вы терпели поношение от народов
  rationale: Идиома буквально говорит о несении позора; «терпели поношение» естественно выражает пережитое унижение, а «от народов» сохраняет вероятное субъектное значение сочетания.
theological_decisions:
- issue: Обращение к земле через формы рельефа
  choice: 'Сохранено прямое обращение во множественном числе: «вы терпели»'
  alternative: Переформулировать как описание страданий жителей Израиля
  rationale: Персонификация земли присутствует в еврейском тексте и не должна быть устранена толкованием.
- issue: Божья קנאה
  choice: «ревность»
  alternative: «рвение» или «зависть»
  rationale: «Ревность» сохраняет богословское напряжение образа и широкий смысл пламенной исключительной преданности и защиты, тогда как альтернативы либо ослабляют, либо искажают его.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет торжественную формулу посланнического слова, но избегает архаизмов вроде «се» и «рёк».
