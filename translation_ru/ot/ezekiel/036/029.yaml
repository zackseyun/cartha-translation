base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/029.yaml
  text: I will save you from all your uncleannesses[a], and I will call for the grain and multiply it[b], and I will not bring famine upon you.
translation:
  language: ru
  text: Я спасу вас от всех ваших нечистот[a], и призову зерно, и умножу его[b], и не наведу на вас голода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всех ваших осквернений». Еврейское слово относится к нечистоте, которая может пониматься и в обрядовом, и в нравственном смысле.'
    reason: lexical_alternative
  - marker: b
    text: Буквальный образ — Бог призывает зерно и умножает его, то есть Своим повелением дарует обильный урожай.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: Я спасу
  rationale: Порода Hiphil глагола ישׁע обозначает совершаемое Богом избавление. «Спасу» прямо передаёт смысл и сохраняет богословскую значимость слова, не уточняя сверх текста характер избавления.
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: от всех ваших нечистот
  rationale: Сохранены множественное число и язык нечистоты, который у Иезекииля может охватывать как обрядовое, так и нравственное осквернение.
- source_word: וְקָרָאתִי אֶל הַדָּגָן
  choice: и призову зерно
  rationale: Оборот קרא אל буквально изображает Бога призывающим зерно и тем самым подчёркивает Его власть над урожаем. «Призову» естественнее по-русски, чем буквальное «воззову к».
- source_word: הַדָּגָן
  choice: зерно
  rationale: דגן обозначает зерно и зерновые культуры вообще; это точнее, чем указание на какой-либо один вид злака.
- source_word: וְהִרְבֵּיתִי אֹתוֹ
  choice: и умножу его
  rationale: Hiphil глагола רבה означает сделать многочисленным или изобильным. Формулировка сохраняет образ умножения урожая и местоименную связь с «зерном».
- source_word: וְלֹא אֶתֵּן עֲלֵיכֶם רָעָב
  choice: и не наведу на вас голода
  rationale: Сочетание נתן על с רָעָב означает подвергнуть голоду или навести голод. Выбранная формулировка ясна в современном русском и сохраняет выраженную в тексте Божью власть над бедствием.
theological_decisions:
- issue: Характер спасения в контексте
  choice: Заветное избавление от нечистоты и её последствий с сохранением более широкого богословского звучания
  alternative: Только духовное спасение от греха либо исключительно обрядовое очищение
  rationale: В Иезекииле 36 обещание объединяет очищение, новое сердце и дух, восстановление земли и урожай. «Спасу» не сужает сказанное до одной из этих сторон.
- issue: Смысл языка нечистоты
  choice: Сохранить категорию нечистоты без сведения её только к нравственной или только к обрядовой сфере
  alternative: Передать исключительно как «грехи» или исключительно как «обрядовые осквернения»
  rationale: Термин טֻמְאָה у Иезекииля способен включать обе сферы; перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повторение союза «и» сохраняет последовательный ритм еврейского текста; необычный, но ясный образ «призову зерно» оставлен ради исходной метафоры.
