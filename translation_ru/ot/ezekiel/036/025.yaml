lexical_decisions:
- source_word: וְזָרַקְתִּי
  choice: И окроплю
  rationale: В контексте обрядового очищения глагол זרק естественно передаётся как «окроплю», а не буквально «брошу» или «разбрызгаю».
- source_word: עֲלֵיכֶם
  choice: вас
  rationale: По-русски сочетание «окроплю вас» естественно передаёт действие, направленное на людей; буквальное «на вас» было бы менее идиоматично.
- source_word: מַיִם טְהוֹרִים
  choice: чистой водой
  rationale: «Чистая вода» сохраняет как непосредственный смысл, так и связь с образом очищения; творительный падеж требуется русским глаголом «окропить».
- source_word: וּטְהַרְתֶּם
  choice: и вы станете чисты
  rationale: Форма описывает наступившее состояние адресатов. Эта передача отличает результат — «станете чисты» — от последующего Божьего действия «Я очищу вас».
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: от всех ваших нечистот
  rationale: «Нечистоты» сохраняет множественное число и повторяющуюся в стихе лексику чистоты и очищения, не ограничивая смысл только обрядовой или только нравственной сферой.
- source_word: וּמִכָּל גִּלּוּלֵיכֶם
  choice: и от всех ваших идолов
  rationale: «Идолы» ясно передаёт референт презрительного слова גִּלּוּלִים. Его намеренно уничижительный оттенок сохранён в сноске, чтобы основной текст оставался естественным.
- source_word: אֲטַהֵר אֶתְכֶם
  choice: Я очищу вас
  rationale: Форма выражает активное Божье действие по удалению нечистоты. «Очищу» прямо и естественно передаёт смысл и сохраняет лексическую связь с «станете чисты».
theological_decisions:
- issue: Характер образа очищения
  choice: Сохранён язык обрядового и нравственного очищения без указания на конкретный сакраментальный механизм.
  alternative: Истолковать выражение в основном тексте исключительно как национальное восстановление либо прямо как указание на крещение.
  rationale: В еврейском тексте Бог обещает очистить народ от нечистот и идолов в контексте восстановления. Перевод сохраняет возможность последующего типологического прочтения, но не вводит его в сам текст и не устраняет исходную многозначность образа.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической структурой. Повтор корня «чист-» сохранён для передачи ключевой словесной связи еврейского текста; прописное «Я» подчёркивает смену подлежащего в заключительной части стиха.
