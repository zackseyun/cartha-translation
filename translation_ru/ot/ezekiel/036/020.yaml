  text: וַ/יָּב֗וֹא אֶל הַ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וַֽ/יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י בֶּ/אֱמֹ֤ר לָ/הֶם֙ עַם יְהוָ֣ה אֵ֔לֶּה וּ/מֵ/אַרְצ֖/וֹ יָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/020.yaml
  text: And when they came to the nations where they went[a], they profaned my holy name, in that people said of them, ‘These are the people of Yahweh[b], and yet they had to go out of his land.’
translation:
  language: ru
  text: 'Придя к народам, среди которых они оказались[a], они осквернили Моё святое имя: о них говорили[b]: «Это народ Яхве, и всё же им пришлось уйти из Его земли»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальный еврейский глагол стоит в единственном числе, вероятно согласуясь с Израилем как собирательным целым; следующий глагол — во множественном.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Буквально: «когда им говорили»; по смыслу речь идёт о том, что среди народов говорили об израильтянах.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный более буквальный перевод: «и они вышли из Его земли». Еврейский текст подразумевает позор изгнания, но прямо не говорит, кто заставил их уйти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא אֶל־הַגּוֹיִם אֲשֶׁר־בָּאוּ שָׁם
  choice: Придя к народам, среди которых они оказались
  rationale: Начальный глагол формально стоит в 3-м лице единственного числа, но далее употреблено множественное число, а подразумеваемый Израиль мыслится собирательно. Русская конструкция во множественном числе естественно передаёт эту связь; «оказались» выражает пребывание изгнанников среди чужих народов, не уточняя, каким именно образом они туда попали.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Речь идёт о чужеземных народах, а не о позднейшей религиозной категории «язычников».
- source_word: וַיְחַלְּלוּ
  choice: осквернили
  rationale: Порода piel глагола חלל означает обращение со святыней как с несвятой, её профанацию. «Осквернили» сохраняет сакральный и нравственный вес выражения и понятно современному читателю.
- source_word: שֵׁם קָדְשִׁי
  choice: Моё святое имя
  rationale: Естественный русский эквивалент, сохраняющий связь Божьего имени с Его святостью, репутацией и открытой людям личностью.
- source_word: בֶּאֱמֹר לָהֶם
  choice: о них говорили
  rationale: Буквально предлог при местоимении может быть понят как «им», однако по смыслу народы говорят об Израиле. Безлично-активная русская формулировка показывает, каким образом Божье имя подвергалось осквернению, не делая народы единственными виновниками.
- source_word: עַם יְהוָה אֵלֶּה
  choice: Это народ Яхве
  rationale: Сохраняются указательное ударение, заветное обозначение Израиля как Божьего народа и личное имя יהוה.
- source_word: וּמֵאַרְצוֹ יָצָאוּ
  choice: и всё же им пришлось уйти из Его земли
  rationale: В еврейском прямо сказано, что они вышли из Его земли; контекст изгнания придаёт словам оттенок позора и вынужденности. «Пришлось уйти» передаёт этот подтекст, не добавляя прямо не названного деятеля изгнания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» отличает его от титула אֲדֹנָי и не заменяет имя титулом.
- issue: Кто осквернил Божье имя
  choice: Грамматическим субъектом оставлен Израиль, а высказывание народов показано как обстоятельство осквернения
  alternative: Народы сами осквернили имя своими словами; либо субъект намеренно оставлен полностью неопределённым
  rationale: Множественное «они осквернили» в ближайшем контексте естественно относится к израильтянам, однако фраза народов раскрывает, как их изгнание навлекло бесчестие на имя Яхве. Перевод сохраняет эту сжатость причин и ответственности.
- issue: Характер ухода из земли Яхве
  choice: «им пришлось уйти» как контекстуально вынужденный и постыдный уход
  alternative: «они вышли»; «их изгнали»
  rationale: Еврейский текст не называет того, кто их вывел или изгнал, но контекст ясно говорит об изгнании. Выбранная формулировка передаёт вынужденность, не превращая активный глагол в явный пассив.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской религиозно-издательской норме. Двоеточие ясно связывает осквернение имени с последующей речью народов, не устраняя богословского напряжения между виной Израиля и реакцией окружающих.
