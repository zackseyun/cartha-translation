id: EZK.36.1
reference: Ezekiel 36:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֖א אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/001.yaml
  text: And you[a], son of man, prophesy to the mountains of Israel, and say, ‘Mountains of Israel[c][b], hear the word of Yahweh.’
translation:
  language: ru
  text: 'А ты, сын человеческий, пророчествуй горам Израиля и скажи: «Горы Израиля, слушайте слово Яхве[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ), личное имя Бога; традиционно переводится «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохранена устойчивая форма обращения к Иезекиилю и литературная связь её повторений по всей книге; здесь это обращение к пророку как к человеку, а не христологический титул.
- source_word: הִנָּבֵא
  choice: пророчествуй
  rationale: Точно передаёт повелительную форму стандартной формулы пророческого поручения.
- source_word: אֶל
  choice: горам
  rationale: Предлог обозначает адресата речи; в данном стихе нет необходимости придавать ему враждебное значение «против».
- source_word: הָרֵי יִשְׂרָאֵל
  choice: горы Израиля
  rationale: Буквальная и естественная передача сохраняет олицетворённый географический образ, дважды использованный в стихе.
- source_word: וְאָמַרְתָּ
  choice: и скажи
  rationale: Естественно передаёт продолжение повеления после «пророчествуй».
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Передаёт обращённый к олицетворённым горам призыв внять пророческой вести; в современном русском это естественнее, чем отдельное «услышьте».
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена стандартная пророческая формула и личное имя Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» сохраняет его как имя; традиционная замена «Господь» отмечена в сноске.
- issue: Передача обращения בֶן אָדָם у Иезекииля
  choice: сын человеческий
  alternative: смертный; человек
  rationale: Сохранение повторяющейся формулы поддерживает литературную цельность книги и не устраняет различие между Богом и человеческим пророком, не превращая при этом выражение здесь в христологический титул.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис близок к еврейскому, но естественен по-русски; сохранены прямое обращение и олицетворение гор.
