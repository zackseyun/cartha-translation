base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/017.yaml
  text: Son of man[a], when the house of Israel was dwelling on their own land, they defiled it by their way and by their deeds; their way before me was like the uncleanness of a menstruating woman.
translation:
  language: ru
  text: Сын человеческий, когда дом Израиля жил на своей земле, они оскверняли её своим путём и своими делами; их путь предо Мною был как нечистота женщины во время менструации[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «как менструальная нечистота» или «как нечистота при менструации». Еврейский текст сравнивает поведение Израиля с ритуальной нечистотой, связанной с менструацией.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устойчивое пророческое обращение в книге Иезекииля; сохраняет еврейский образ и литературную преемственность.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет собирательный, корпоративный смысл традиционного еврейского выражения.
- source_word: יֹשְׁבִים עַל אַדְמָתָם
  choice: жил на своей земле
  rationale: Причастие передаёт продолжающееся проживание, а собирательное «дом Израиля» естественно согласуется в русском с единственным числом.
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: они оскверняли её
  rationale: Глагол טמא обозначает ритуально-нравственное осквернение земли; несовершенный вид естественно передаёт поведение в описываемый период.
- source_word: בְּדַרְכָּם וּבַעֲלִילוֹתָם
  choice: своим путём и своими делами
  rationale: «Путь» сохраняет метафору образа жизни, а «дела» передаёт её практическое выражение.
- source_word: כְּטֻמְאַת הַנִּדָּה
  choice: как нечистота женщины во время месячных
  rationale: Явно сохраняет сравнение с ритуальной нечистотой, связанной с менструацией, не заменяя его общим понятием загрязнения.
- source_word: הָיְתָה דַרְכָּם לְפָנָי
  choice: был их путь предо Мной
  rationale: Сохраняет метафору «пути» и буквальный образ пребывания перед Богом, включающий оценочный оттенок.
theological_decisions:
- issue: Характер образа нечистоты
  choice: Сохранить прямую отсылку к ритуальной нечистоте женщины во время менструации.
  alternative: Передать обобщённо как «скверна» или «грязь», не называя менструацию.
  rationale: Еврейский текст использует конкретный культовый образ для нравственного осквернения земли; его обобщение ослабило бы богословскую метафору.
- issue: Временное значение начальной конструкции
  choice: 'Ввести союз «когда»: «когда дом Израиля жил…».'
  alternative: Оставить причастную конструкцию без явной временной связи.
  rationale: Причастная конструкция задаёт обстоятельственный фон последующего действия; союз делает эту связь естественной по-русски, не устраняя смысловой неоднозначности.
- issue: Согласование собирательного обозначения Израиля
  choice: Сочетать «дом Израиля жил» с последующим местоимением «они».
  alternative: Всюду выдержать только единственное число либо заменить выражение на «народ Израиля».
  rationale: Так сохраняется формальное выражение «дом Израиля» и одновременно отражается еврейский переход к множественному числу, подчёркивающий людей, составляющих этот дом.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формы «Сын человеческий» и «предо Мной» сохраняют узнаваемый пророческий регистр; остальная синтаксика остаётся доступной современному читателю.
