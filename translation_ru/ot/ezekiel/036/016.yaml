lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: В устойчивой пророческой формуле естественное для русской библейской речи «И было ко мне слово…» передаёт наступление нового откровения и сохраняет формальную структуру еврейского оборота.
- source_word: דְבַר
  choice: слово
  rationale: Существительное обозначает Божье слово или послание; «слово» точно и традиционно передаёт формулу пророческого откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», без замены титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с местоименным суффиксом указывает на пророка как адресата откровения; «ко мне» естественно в данной русской формуле.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «сказать» вводит последующую прямую речь; в современном русском эту функцию естественно и без смысловой потери выполняет двоеточие.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой пророческой формулы. לֵאמֹר передано пунктуационно, поскольку следующий стих содержит саму речь.
