review_pass:
  verdict: revise
  source_fidelity: 'Смысловой каркас передан верно: сохранены выводное «поэтому», обращение к дому Израиля, отрицание мотива («не ради вас»), противопоставление святому имени Бога и осквернение этого имени среди народов. Однако «Владыка Господь» неудачно передаёт אֲדֹנָי יְהוִה: второе слово не отражает личное имя יהוה, а сноска фактически признаёт иной, более точный вариант.'
  naturalness: Фраза в целом литературна и понятна. «Дом Израиля» в повторном обращении звучит уместно в пророческом регистре. Оборот «среди народов, куда вы пришли» естественнее и точнее передаёт שָׁם («туда/там»), чем «к которым пришли».
  terminology: Следует последовательно передать יהוה как «Яхве», в соответствии с указанным английским аудитом и непосредственно с еврейским текстом. Составное наименование אֲדֹנָי יְהוִה естественно передаётся как «Владыка Яхве». «Святое имя» и «осквернили» точно сохраняют ключевую лексику.
  issues:
  - severity: medium
    issue: «Владыка Господь» вместо передачи יהוה личным именем.
    rationale: 'В еврейском сочетании אֲדֹנָי יְהוִה второй элемент — тетраграмматон, а не нарицательное «Господь». Сноска «буквально: „Владыка Яхве“» не устраняет неточность основного текста и к тому же создаёт ненужное расхождение с принятой политикой передачи имени.'
  - severity: low
    issue: «Среди народов, к которым пришли» несколько ослабляет указательное «туда/там» (שָׁם).
    rationale: «Среди народов, куда вы пришли» сохраняет направление прихода и звучит по-русски более плавно.
