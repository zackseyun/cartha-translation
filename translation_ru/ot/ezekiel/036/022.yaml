  text: לָ/כֵ֞ן אֱמֹ֣ר לְ/בֵֽית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֧א לְמַעַנְ/כֶ֛ם אֲנִ֥י עֹשֶׂ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל כִּ֤י אִם לְ/שֵׁם קָדְשִׁ/י֙ אֲשֶׁ֣ר חִלַּלְתֶּ֔ם בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אתֶם שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/022.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: It is not for your sake that I am acting, O house of Israel, but for my holy name[b], which you have profaned among the nations where you went.’'
translation:
  language: ru
  text: 'Поэтому скажи дому Израиля: «Так говорит Владыка Яхве: не ради вас Я действую, дом Израиля, а ради Моего святого имени, которое вы осквернили среди народов, куда вы пришли».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего контекста и сохраняет связь пророческой речи.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохраняет корпоративное и заветное обозначение Израиля, не упрощая его до одного имени.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для русского библейского регистра передача формулы пророческого вестника.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт оба элемента составного Божественного наименования и избегает неестественного повтора «Господь Господь»; личное имя пояснено в сноске.
- source_word: לֹא לְמַעַנְכֶם אֲנִי עֹשֶׂה
  choice: не ради вас Я действую
  rationale: Точно выражает отрицаемое основание или побуждение Божественного действия; настоящее время допускает начавшееся или предстоящее действие.
- source_word: כִּי אִם לְשֵׁם קָדְשִׁי
  choice: а ради Моего святого имени
  rationale: Контрастная конструкция после отрицания естественно передана союзом «а»; образ Божьего святого имени сохранён без толкования.
- source_word: חִלַּלְתֶּם
  choice: осквернили
  rationale: Глагол в породе пиэль означает лишить святости, профанировать; «осквернили» сохраняет сакральную силу выражения и понятно современному читателю.
- source_word: בַּגּוֹיִם אֲשֶׁר בָּאתֶם שָׁם
  choice: среди народов, к которым пришли
  rationale: Передаёт народы как место пребывания рассеянного Израиля и сохраняет буквальный образ прихода к ним.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Господь[a]
  alternative: Владыка Яхве
  rationale: Основной текст использует понятное и укоренённое русское наименование, а сноска сохраняет прозрачность личного имени יהוה в еврейском тексте.
- issue: Основание Божьего действия
  choice: не ради вас ... а ради Моего святого имени
  alternative: не ради ваших заслуг ... но для восстановления чести Моего имени
  rationale: Сохранено резкое противопоставление исходного текста без добавления отсутствующих в стихе понятий заслуг или восстановления чести.
- issue: Осквернение Божьего имени
  choice: которое вы осквернили
  alternative: которому вы навлекли бесчестие
  rationale: Относительное местоимение грамматически связывает действие непосредственно с именем, как в еврейском тексте, не разрешая образ посредством пояснительной перефразировки.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Повтор обращения «дом Израиля» сохранён ради смыслового нажима оригинала; архаичные обороты и искусственная частица «о» перед обращением не использованы.
