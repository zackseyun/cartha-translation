base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/002.yaml
  text: 'Thus says the Lord GOD: Because the enemy said against you, ‘Aha!’ and, ‘The ancient heights have become our possession,’'
translation:
  language: ru
  text: 'Так говорит Владыка Господь: поскольку враг сказал против вас: «Ага! Древние высоты стали нашим владением!»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт сочетание титула אדני и божественного имени יהוה, избегая неестественного повтора «Господь Господь» и сохраняя различие компонентов.
- source_word: הָאוֹיֵב
  choice: враг
  rationale: Прямой эквивалент собирательного единственного числа; контекст допускает врага как коллективного противника.
- source_word: הֶאָח
  choice: Ага!
  rationale: Передаёт злорадное междометие ликования над чужой бедой.
- source_word: בָמוֹת עוֹלָם
  choice: вековые высоты
  rationale: במות означает «высоты»; עולם здесь естественно указывает на их древность и давность, а не обязательно на бесконечную продолжительность.
- source_word: לְמוֹרָשָׁה הָיְתָה לָּנוּ
  choice: стали нашим владением
  rationale: Естественно передаёт переход высот во владение врага; מורשה обозначает наследственное или закреплённое владение.
theological_decisions:
- issue: Передача божественного имени в формуле אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Господь Яхве
  rationale: Основной текст сохраняет традиционно узнаваемое русское обозначение יהוה и одновременно различает его с אדני; транслитерация имени остаётся возможной альтернативой, но не требуется самим стихом.
- issue: Значение עוֹלָם при «высотах»
  choice: вековые
  alternative: вечные
  rationale: В данном хвастливом заявлении врага речь вероятнее о древних, издавна существующих высотах; перевод «вечные» мог бы привнести метафизический оттенок, которого контекст не требует.
translation_notes:
  register: 'Современный литературный русский с торжественной пророческой формулой. Конечное тире сохраняет синтаксическую незавершённость стиха: основание приговора продолжается в следующем стихе.'
