base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/007.yaml
  text: 'Therefore thus says the Lord GOD: I have lifted up my hand in oath that surely the nations that are around you will bear their disgrace[a].'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Я поднял руку в клятве: народы вокруг вас непременно понесут свой позор[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я поднял свою руку»; это древнееврейский оборот, выражающий принесение клятвы.'
    reason: Поясняет сохранённый в переводе образ поднятой руки и его клятвенное значение.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Сочетание передаёт оба элемента титула и избегает неестественного русского «Господь Господь»; «Господь» служит традиционной благоговейной передачей имени יהוה.
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: Я поднимаю руку и клянусь
  rationale: Сохранён образ поднятой руки и одновременно ясно выражено значение древнееврейской формулы клятвы. Настоящее время в прямой речи естественно передаёт перфект торжественного речевого акта.
- source_word: אִם לֹא
  choice: непременно
  rationale: После формулы клятвы конструкция имеет усилительно-утвердительное, а не условное значение.
- source_word: הַגּוֹיִם אֲשֶׁר לָכֶם מִסָּבִיב
  choice: народы, живущие вокруг вас
  rationale: «Народы» соответствует גוים; добавление «живущие» естественно связывает относительное предложение с пространственным оборотом, не меняя смысла.
- source_word: כְּלִמָּתָם יִשָּׂאוּ
  choice: понесут свой позор
  rationale: Сохранена метафора נשׂא «нести» и притяжательное значение суффикса; «позор» передаёт публичный стыд и унижение в пророческом контексте.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Выбрана укоренённая в русской библейской речи благоговейная передача, при этом первый титул передан как «Владыка», чтобы различить оба элемента и избежать повтора.
- issue: Чей позор обозначает כְּלִמָּתָם
  choice: свой позор, то есть позор окружающих народов
  alternative: позор, который они причинили Израилю
  rationale: Грамматический суффикс третьего лица множественного числа естественно относится к ближайшему подлежащему «народы»; перевод не подменяет это возможной контекстуальной интерпретацией.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис прямой и понятный; образ клятвенно поднятой руки сохранён, а его смысл раскрыт в тексте и сноске.
