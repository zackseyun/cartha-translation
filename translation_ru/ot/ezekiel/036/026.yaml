  text: וְ/נָתַתִּ֤י לָ/כֶם֙ לֵ֣ב חָדָ֔שׁ וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י אֶת לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשַׂרְ/כֶ֔ם וְ/נָתַתִּ֥י לָ/כֶ֖ם לֵ֥ב בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/026.yaml
  text: And I will give you a new heart[a], and I will put a new spirit within you; and I will remove the heart of stone from your flesh and give you a heart of flesh.
translation:
  language: ru
  text: И дам вам новое сердце и вложу в вас новый дух[a]; и удалю из вашей плоти каменное сердце, и дам вам сердце из плоти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обновлённый дух»; некоторые понимают здесь «дух» как предвосхищение дара Божьего Духа, о котором говорится в следующем стихе.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Прямой и естественный эквивалент, сохраняющий широкий древнееврейский смысл внутреннего центра мысли, воли и расположения.
- source_word: חָדָשׁ / חֲדָשָׁה
  choice: новое / новый
  rationale: Прилагательное прямо означает «новый»; вариант «обновлённый» был бы более толковательным.
- source_word: רוּחַ
  choice: дух
  rationale: В контексте внутреннего преображения речь идёт о духе или внутреннем настрое человека; перевод сохраняет связь со следующим стихом, не отождествляя их явно.
- source_word: בְּקִרְבְּכֶם
  choice: в вас
  rationale: Передаёт внутреннюю направленность образов сердца и духа и естественно звучит по-русски.
- source_word: וַהֲסִרֹתִי
  choice: удалю
  rationale: Точно передаёт устранение прежнего сердца перед дарованием нового.
- source_word: לֵב הָאֶבֶן
  choice: каменное сердце
  rationale: Естественный русский эквивалент конструкции «сердце камня», сохраняющий исходную метафору.
- source_word: מִבְּשַׂרְכֶם
  choice: из вашей плоти
  rationale: Сохраняет конкретный телесный образ и лексическую связь со словом בָּשָׂר в заключительной фразе.
- source_word: לֵב בָּשָׂר
  choice: сердце из плоти
  rationale: Сохраняет буквальный контраст между камнем и плотью, не заменяя метафору толкованием вроде «мягкое сердце».
- source_word: וְנָתַתִּי ... אֶתֵּן ... וְנָתַתִּי
  choice: дам ... вложу ... дам
  rationale: Повтор «дам» сохранён в обрамляющих фразах, а «вложу» естественно передаёт נתן в сочетании «в вас».
theological_decisions:
- issue: Значение выражения «новый дух»
  choice: Новый человеческий дух или внутренний настрой, даруемый Богом
  alternative: Святой Дух
  rationale: Параллелизм с «новым сердцем» указывает на внутреннее обновление человека, тогда как в следующем стихе отдельно сказано «Мой Дух». Строчная буква и примечание сохраняют смысловое напряжение, не исключая связи с даром Божьего Духа.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены телесные метафоры «плоть», «каменное сердце» и «сердце из плоти»; синтаксис сделан ясным без устранения смысловой неоднозначности слова «дух».
