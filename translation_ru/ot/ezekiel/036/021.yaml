  text: וָ/אֶחְמֹ֖ל עַל שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֤ר חִלְּל֨וּ/הוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אוּ שָֽׁמָּ/ה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/021.yaml
  text: But I had pity for my holy name[a], which the house of Israel had profaned among the nations where they had gone.
translation:
  language: ru
  text: Но Я позаботился о Моём святом имени[a], которое дом Израиля осквернил среди народов, куда они пришли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «пощадил Моё святое имя» или «пожалел Моё святое имя». Еврейский глагол может означать «щадить» или «жалеть»; здесь он выражает заботу Господа о святости и чести Его имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחְמֹל
  choice: Я позаботился
  rationale: Глагол חמל может означать «щадить», «жалеть», «проявлять сострадание или заботу». Поскольку его прямой объект здесь — святое имя Бога, выражение «позаботился о» естественно передаёт заботу о его святости и чести, не создавая неуместного впечатления жалости к имени.
- source_word: עַל
  choice: о
  rationale: При חמל предлог обозначает предмет заботы или сострадания; по-русски сочетание «позаботился о» звучит естественно.
- source_word: שֵׁם קָדְשִׁי
  choice: Моём святом имени
  rationale: Сохраняется устойчивое библейское выражение, обозначающее Божью явленную сущность, честь и славу.
- source_word: אֲשֶׁר חִלְּלוּהוּ
  choice: которое ... осквернил
  rationale: Порода пиэль глагола חלל означает обращение со святым как с обыденным, его профанацию. «Осквернил» естественно сохраняет противопоставление святости имени.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено характерное для пророческой речи собирательное обозначение народа Израиля.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Речь идёт о чужих народах, среди которых оказался Израиль; это точнее и нейтральнее, чем конфессионально окрашенное «язычники».
- source_word: אֲשֶׁר בָּאוּ שָׁמָּה
  choice: куда они пришли
  rationale: Буквально передаёт בוא и שמה и естественно относится к народам как к местам, куда пришли изгнанники.
theological_decisions:
- issue: Отношение Бога к Своему святому имени в וָאֶחְמֹל
  choice: Бог проявил заботу о святости и чести Своего имени.
  alternative: Бог пощадил Своё святое имя; Бог пожалел Своё святое имя; Бог проявил жалость ради Своего святого имени.
  rationale: Грамматически непосредственным объектом חמל выступает «Моё святое имя», а контекст 36:20–23 сосредоточен на освящении Божьего имени среди народов. Перевод сохраняет этот акцент, не перенося сострадание на Израиль и не устраняя лексическую неоднозначность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные местоимения при обращении Бога к Себе сохранены как издательская норма проекта. Формула «дом Израиля» оставлена ради текстовой и жанровой последовательности.
