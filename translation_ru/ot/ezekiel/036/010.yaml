  text: וְ/הִרְבֵּיתִ֤י עֲלֵי/כֶם֙ אָדָ֔ם כָּל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה וְ/נֹֽשְׁבוּ֙ הֶֽ/עָרִ֔ים וְ/הֶ/חֳרָב֖וֹת תִּבָּנֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/010.yaml
  text: And I will multiply people upon you—all the house of Israel[a], all of it. The cities will be inhabited[b], and the ruins will be rebuilt.
translation:
  language: ru
  text: И Я умножу на вас людей[a] — весь дом Израиля, целиком. Города будут заселены, а разрушенные места[b] будут вновь отстроены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. адам — собирательное обозначение людей; возможны также переводы: «человечество», букв. «человек».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «развалины»; «опустошённые места».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: И Я умножу
  rationale: Каузативная порода гифиль от רבה означает «сделать многочисленным, умножить». «Умножу» сохраняет каузативность и естественно звучит в библейском контексте.
- source_word: עֲלֵיכֶם
  choice: на вас
  rationale: 'Предлог עַל с местоименным суффиксом сохраняет пространственный образ: люди будут умножены на обращённых здесь горах/земле Израиля.'
- source_word: אָדָם
  choice: людей
  rationale: Здесь אָדָם употреблено собирательно и обозначает человеческое население, поэтому множественное «людей» естественно передаёт смысл по-русски.
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: весь дом Израиля, весь целиком
  rationale: Сочетание כָּל и последующего כֻּלֹּה дважды подчёркивает полноту; перевод сохраняет это намеренное усиление.
- source_word: וְנֹשְׁבוּ הֶעָרִים
  choice: Города будут заселены
  rationale: Нифаль от ישׁב передаёт состояние городов, вновь получивших жителей; «будут заселены» точно и естественно выражает пассивно-результативный смысл.
- source_word: וְהֶחֳרָבוֹת
  choice: и развалины
  rationale: חֳרָבוֹת обозначает разрушенные, опустошённые места. «Развалины» создаёт конкретный образ и хорошо сочетается с последующим восстановлением.
- source_word: תִּבָּנֶינָה
  choice: будут отстроены
  rationale: Нифаль от בנה имеет пассивное значение; в отношении ранее разрушенных мест «отстроены» естественно передаёт восстановление, подразумеваемое контекстом.
theological_decisions:
- issue: Адресат и характер обещанного восстановления
  choice: 'Сохранено прямое обращение к горам/земле Израиля и конкретный образ национального восстановления: возвращение населения, заселение городов и восстановление развалин.'
  alternative: Понимать стих как исключительно метафорическое духовное восстановление, не связанное с землёй.
  rationale: Ближайший контекст прямо обращён к земле и горам Израиля, а лексика городов, населения и отстраиваемых развалин имеет конкретный территориальный смысл. Перевод не устраняет возможных богословских применений, но и не подменяет ими непосредственный смысл текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сохраняет еврейское усиление «весь… весь целиком», не становясь непонятным. Заглавная буква в «Я» обозначает говорящего Бога по принятой русской библейской норме.
