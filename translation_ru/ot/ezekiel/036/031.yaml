base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/031.yaml
  text: Then you will remember your evil ways and your deeds that were not good[a], and you will loathe yourselves for your iniquities and your abominations.
translation:
  language: ru
  text: Тогда вы вспомните свои злые пути и свои недобрые дела и будете гнушаться самих себя[a] из-за своих беззаконий и мерзостей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете гнушаться себя в собственных глазах».'
    reason: 'Лексико-синтаксическая альтернатива для בִּפְנֵיכֶם: оборот сохраняет смысл самоотвращения и выражает перспективу «в собственных глазах», не превращая её в утверждение о том, что люди сами по себе «отвратительны».'
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  choice: Тогда вы вспомните
  rationale: Форма с присоединённым waw в последовательности пророческих обещаний имеет будущее, следственное значение. «Тогда» естественно передаёт связь с предшествующим восстановлением, а «вспомните» сохраняет основное значение корня זכר.
- source_word: דַּרְכֵיכֶם הָרָעִים
  choice: свои злые пути
  rationale: דֶּרֶךְ метафорически обозначает образ жизни и поведение. «Пути» сохраняет еврейский образ, а «злые» ясно передаёт нравственную оценку הָרָעִים.
- source_word: וּמַעַלְלֵיכֶם אֲשֶׁר לֹא טוֹבִים
  choice: свои недобрые дела
  rationale: מַעֲלָל означает поступки или дела. «Недобрые» сохраняет выраженное в еврейском отрицание добра и не усиливает его повторным словом «злые».
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  choice: будете гнушаться самих себя
  rationale: В данном сочетании נקט выражает сильное отвращение, а בִּפְנֵיכֶם придаёт высказыванию рефлексивный смысл. Выбранная формулировка естественна для литературного русского языка; более буквальная передача образа сохранена в сноске.
- source_word: עַל עֲוֺנֹתֵיכֶם
  choice: из-за своих беззаконий
  rationale: עָוֹן может обозначать беззаконие, вину или последствие вины. Здесь множественное число указывает на совершённые беззакония, а עַל естественно передаётся причинным «из-за».
- source_word: וְעַל תּוֹעֲבֹתֵיכֶם
  choice: и мерзостей
  rationale: תּוֹעֵבָה обозначает нечто нравственно или культово отвратительное. «Мерзости» сохраняет силу и возвышенно-библейский оттенок слова, оставаясь понятным современному читателю.
theological_decisions:
- issue: Характер реакции Израиля после восстановления
  choice: Стих описывает воспоминание о прежних грехах и глубокое отвращение к себе как последствие Божьего восстановительного действия в контексте.
  alternative: Понимать эту реакцию либо только как психологическое раскаяние, либо как исчерпывающее изложение позднее разработанного учения о покаянии.
  rationale: Текст прямо говорит о нравственном воспоминании и самоотвращении, но не вводит специальной богословской терминологии. Перевод сохраняет эту напряжённость и не расширяет утверждение стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Образы «пути», «беззакония» и «мерзости» сохранены ввиду их смысловой и богословской нагрузки; синтаксис сделан ясным и естественным.
