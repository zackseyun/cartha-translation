source:
  edition: WLC
  text: לָ/כֵן֙ הָרֵ֣י יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים וְ/לַ/גֵּאָי֗וֹת וְ/לֶ/חֳרָב֤וֹת הַ/שֹּֽׁמְמוֹת֙ וְ/לֶ/עָרִ֣ים הַ/נֶּעֱזָב֔וֹת אֲשֶׁ֨ר הָי֤וּ לְ/בַז֙ וּ/לְ/לַ֔עַג לִ/שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם אֲשֶׁ֥ר מִ/סָּבִֽיב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/004.yaml
  text: 'Therefore[a], mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys[b], to the desolate ruins and to the abandoned cities that have become plunder and mockery to the remnant of the nations that are all around:'
translation:
  language: ru
  text: 'Поэтому, горы Израиля, слушайте слово Владыки Яхве! Так говорит Владыка Яхве горам и холмам, руслам[a] и долинам, опустошённым развалинам и покинутым городам, которые стали добычей и посмешищем для остатка окрестных народов[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оврагам», «водотокам». Еврейское слово может обозначать русла, потоки или прорезанные водой ложбины.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для остальных окрестных народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего пророческого обвинения и естественно связывает стихи.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: горы Израиля
  rationale: Сохранено прямое обращение и олицетворение земли.
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Повелительное множественного числа; в современном русском при обращении естественнее, чем буквальное «услышьте».
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: слово Владыки Яхве
  rationale: «Слово» сохраняет пророческую формулу; «Владыка Яхве» различает אֲדֹנָי и личное имя יהוה без неестественного удвоения титула.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся и точная русская передача формулы посланника.
- source_word: אֲפִיקִים
  choice: руслам
  rationale: Слово обозначает русла или водотоки, нередко сухие; выбор сохраняет топографический смысл без излишнего уточнения.
- source_word: גֵּאָיוֹת
  choice: долинам
  rationale: Широкое и естественное обозначение низинных форм рельефа в данном перечислении.
- source_word: חֳרָבוֹת הַשֹּׁמְמוֹת
  choice: опустошённым развалинам
  rationale: 'Переданы оба компонента: разрушенное место и его запустение.'
- source_word: עָרִים הַנֶּעֱזָבוֹת
  choice: покинутым городам
  rationale: Современная литературная передача городов, оставленных жителями.
- source_word: לְבַז וּלְלַעַג
  choice: добычей и посмешищем
  rationale: Сохраняет параллель материального разграбления и унизительных насмешек.
- source_word: שְׁאֵרִית הַגּוֹיִם אֲשֶׁר מִסָּבִיב
  choice: остатка окрестных народов
  rationale: Сохраняет буквальное «остаток», а «окрестных» кратко и естественно передаёт пространственное מִסָּבִיב.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Личное имя יהוה передано как «Яхве», а אֲדֹנָי — как «Владыка», что позволяет ясно представить оба элемента и избежать двусмысленного понимания יהוה как общего титула.
- issue: Возможный богословский оттенок שְׁאֵרִית
  choice: остаток народов
  alternative: остальные народы
  rationale: Буквальное значение сохранено, но контекст не требует приписывать «остатку» особый спасительный или заветный смысл.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический ряд и олицетворённое обращение к земле сохранены; двоеточие указывает, что пророческое высказывание продолжается в следующем стихе.
