  text: וְ/הוֹלַכְתִּי֩ עֲלֵי/כֶ֨ם אָדָ֜ם אֶת עַמִּ֤/י יִשְׂרָאֵל֙ וִֽ/ירֵשׁ֔וּ/ךָ וְ/הָיִ֥יתָ לָ/הֶ֖ם לְ/נַחֲלָ֑ה וְ/לֹא תוֹסִ֥ף ע֖וֹד לְ/שַׁכְּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/012.yaml
  text: And I will cause people—my people Israel—to walk upon you[a], and they will possess you, and you will be their inheritance[c][b], and you will no longer bereave them.
translation:
  language: ru
  text: И Я дам Моему народу Израилю ходить по вам[a]. Они овладеют вами[b], и вы станете их наследственным уделом; впредь вы уже не будете лишать их детей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я приведу на вас людей — Мой народ Израиль». Буквально: «Я дам людям ходить по вам»; далее уточняется, что речь идёт о Божьем народе, Израиле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они унаследуют вас». Употреблённый глагол применительно к земле может означать как овладение ею, так и получение её в наследие.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «делать их бездетными»; то есть отнимать у народа детей или потомство.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  choice: Я проведу
  rationale: Порода hифиль глагола הלך выражает каузативное действие. «Проведу по вам» естественно передаёт то, что Бог даст людям вновь ходить и жить на обращённых к Нему горах, сохраняя образ движения по земле.
- source_word: עֲלֵיכֶם
  choice: по вам
  rationale: Местоимение во множественном числе относится к горам Израиля, к которым обращена речь. Русское «по вам» естественно сочетается с глаголом движения и сохраняет прямое обращение.
- source_word: אָדָם אֶת־עַמִּי יִשְׂרָאֵל
  choice: людей — Мой народ Израиль
  rationale: אָדָם употреблено собирательно, а последующее «Мой народ Израиль» уточняет, кто имеется в виду. «Людей» понятно современному читателю и не создаёт ошибочного впечатления об одном мужчине.
- source_word: וִירֵשׁוּךָ
  choice: они овладеют вами
  rationale: ירשׁ в контексте земли может означать вступление во владение или получение в наследие. «Овладеют» сохраняет смысл фактического обладания, тогда как следующая фраза передаёт наследственную сторону образа.
- source_word: וְהָיִיתָ לָהֶם לְנַחֲלָה
  choice: вы станете их наследственным уделом
  rationale: נַחֲלָה обозначает наследие или наследственный удел. «Наследственный удел» сохраняет устойчивую библейскую связь Израиля с дарованной Богом землёй и согласуется с множественным адресатом — горами.
- source_word: וְלֹא תוֹסִף עוֹד
  choice: впредь вы уже не будете
  rationale: Сочетание תוֹסִף עוֹד подчёркивает прекращение и неповторение действия. Русская конструкция «впредь уже не будете» передаёт усиление без ненормативной избыточности.
- source_word: לְשַׁכְּלָם
  choice: лишать их детей
  rationale: Пиэль שׁכל означает делать бездетным, лишать детей, исторгать потомство. Явная русская формулировка точнее раскрывает объект утраты, чем более широкое «осиротить» или «причинять утраты».
theological_decisions:
- issue: Сохранение богословски значимого языка наследия земли
  choice: вы станете их наследственным уделом
  alternative: вы станете их владением
  rationale: «Наследственный удел» сохраняет идею земли как данного Израилю наследия, не сводя высказывание лишь к праву собственности.
- issue: Метафорическое изображение земли как лишающей народ детей
  choice: впредь вы уже не будете лишать их детей
  alternative: впредь вы уже не будете губить их жителей
  rationale: Исходный глагол прямо связан с утратой детей или потомства. Более общее «губить жителей» могло бы преждевременно снять напряжение персонифицированного обращения к земле.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранено прямое обращение к горам во множественном числе и их олицетворение; местоимения Бога оформлены с прописной буквы согласно принятой русской библейской традиции.
