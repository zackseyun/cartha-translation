review_pass:
  verdict: revise
  source_fidelity: В целом переданы возделывание опустошённой земли, контраст с прежним состоянием и публичная видимость этого состояния. Однако «вместо того чтобы ей оставаться пустыней» представляет прежнее состояние как предполагаемое дальнейшее «оставание» и использует «пустыня», которое в современном русском прежде всего обозначает природную пустыню. В еврейском тексте сказано, что земля была «запустением/опустошением».
  naturalness: Неопределённо-личное «будут возделывать» естественно и хорошо передаёт пассивную форму. Оборот «ей оставаться пустыней» несколько тяжеловесен и менее точно выражает временной контраст. Перестройка с «тогда как прежде она была запустением» звучит современно и ясно.
  terminology: «Земля» и «возделывать» точны в данном контексте. «Запустение» лучше, чем «пустыня», передаёт שְׁמָמָה как состояние разорения, не внося значения географической пустыни. «На глазах у всех проходивших мимо» адекватно передаёт לְעֵינֵי כָּל עוֹבֵר.
