  text: And the desolate land will be cultivated instead of being a desolation in the sight of all who pass by[a].
translation:
  language: ru
  text: Опустошённую землю будут возделывать, тогда как прежде она была запустением на глазах у всех проходивших мимо.[a]
  philosophy: optimal-equivalence
  footnotes:
