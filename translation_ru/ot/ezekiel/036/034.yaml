    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте восстановления речь идёт о земле Израиля, а не обо всей земле как мире или планете.
- source_word: הַנְּשַׁמָּה
  choice: опустошённую
  rationale: Страдательное причастие употреблено как определение к слову «земля» и обозначает её разорённое состояние.
- source_word: תֵּעָבֵד
  choice: станут возделывать
  rationale: Нифаль глагола עבד здесь означает сельскохозяйственную обработку земли; неопределённо-личная конструкция естественно передаёт пассив в современном русском языке.
- source_word: תַּחַת אֲשֶׁר
  choice: вместо того чтобы
  rationale: Конструкция выражает смену прежнего состояния новым; такой перевод ясно передаёт контраст.
- source_word: הָיְתָה שְׁמָמָה
  choice: ей оставаться пустыней
  rationale: Существительное שְׁמָמָה буквально обозначает пустынное, опустошённое место; слово «пустыней» сохраняет именную форму и контраст с возделыванием.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Естественная русская идиома сохраняет зрительный образ и значение публичной видимости.
- source_word: כָּל עוֹבֵר
  choice: всех проходящих мимо
  rationale: Сочетание כָּל с причастием имеет собирательное значение и относится ко всякому, кто проходит мимо.
