  rationale: 'Исправлены два связанных нюанса: состояние שְׁמָמָה передано словом «запустение», а противопоставление будущего возделывания прежнему запустению выражено прямо, без оттенка предполагаемого дальнейшего состояния. Сохранены пассивный смысл תֵּעָבֵד посредством неопределённо-личной конструкции, временной контраст и образ наблюдения проходящих мимо.'
