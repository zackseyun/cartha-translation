source:
  edition: WLC
  text: לָ/כֵ֗ן אָדָם֙ לֹא תֹ֣אכְלִי ע֔וֹד ו/גוי/ך לֹ֣א תכשלי ע֑וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/014.yaml
  text: Therefore you will no longer devour people[a], and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: ru
  text: Поэтому ты больше не будешь пожирать людей[a] и больше не будешь приводить свой народ к падению, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно иной огласовке и текстовой традиции: «больше не будешь лишать свой народ детей».'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Сохраняет ясную причинно-следственную связь с предшествующим обещанием.
- source_word: אָדָם
  choice: людей
  rationale: Собирательное обозначение людей; естественное русское множественное число передаёт смысл объекта при олицетворённой земле.
- source_word: תֹאכְלִי
  choice: пожирать
  rationale: Сохраняет образ земли, которая метафорически поглощает своих жителей, и звучит естественнее буквального «есть».
- source_word: עוֹד ... לֹא
  choice: больше не
  rationale: Естественно выражает прекращение действия отныне.
- source_word: וְגוֹיִךְ
  choice: свой народ
  rationale: В данном обращении к земле גוי обозначает принадлежащую ей общность; «народ» по-русски точнее и естественнее, чем «нация».
- source_word: תכשלי
  choice: заставишь ... спотыкаться
  rationale: Следует масоретскому чтению от корня כשל и сохраняет причинительное значение формы.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт пророческую формулу; «Владыка» различает אֲדֹנָי, а «Яхве» непосредственно передаёт личное имя יהוה без сочетания «Господь Господь».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбор различает титул אֲדֹנָי и личное имя יהוה, не подменяя имя общим титулом и избегая неестественного повтора.
- issue: Неоднозначное чтение תכשלי
  choice: заставишь свой народ спотыкаться
  alternative: будешь лишать свой народ детей
  rationale: Основной текст следует согласному тексту и масоретской вокализации от כשל; контекст и некоторые древние свидетельства поддерживают альтернативу, поэтому она вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с сохранением олицетворения земли в женском роде. Пророческая формула передана торжественно, но понятно; метафора «пожирать людей» сохранена.
