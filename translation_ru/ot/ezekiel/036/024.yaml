  text: וְ/לָקַחְתִּ֤י אֶתְ/כֶם֙ מִן הַ/גּוֹיִ֔ם וְ/קִבַּצְתִּ֥י אֶתְ/כֶ֖ם מִ/כָּל הָ/אֲרָצ֑וֹת וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/024.yaml
  text: For I will take you from the nations[a], and gather you from all the lands[c][b], and bring you into your own land.
translation:
  language: ru
  text: Я возьму вас из среды народов, соберу вас из всех стран и приведу вас на вашу землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Я возьму
  rationale: Прямо передаёт личное и целенаправленное действие Бога; в данном контексте речь идёт об избавлении рассеянного народа.
- source_word: מִן הַגּוֹיִם
  choice: из среды народов
  rationale: גּוֹיִם означает «народы»; оборот «из среды» естественно показывает, что изгнанники находятся среди чужих народов.
- source_word: וְקִבַּצְתִּי
  choice: соберу
  rationale: Кבץ — обычный пророческий глагол собирания рассеянного народа; русский глагол сохраняет и прямой смысл, и мотив восстановления.
- source_word: מִכָּל הָאֲרָצוֹת
  choice: из всех стран
  rationale: Множественное число אֲרָצוֹת здесь обозначает разные страны рассеяния; «страны» в современном русском точнее и естественнее, чем «земли» в этом месте фразы.
- source_word: וְהֵבֵאתִי
  choice: приведу
  rationale: Порода hифиль глагола בוא имеет каузативное значение «привести». Добавление «обратно» контекстуально возможно, но в еврейском тексте прямо не выражено.
- source_word: אֶל אַדְמַתְכֶם
  choice: на вашу землю
  rationale: В контексте восстановления אַדָמָה обозначает родную землю народа; предлог «на» идиоматичен по-русски, а «вашу» непосредственно передаёт притяжательный суффикс.
theological_decisions:
- issue: Восстановление народа и принадлежность земли
  choice: на вашу землю
  alternative: на вашу собственную землю
  rationale: Притяжательное «вашу» сохраняет выраженную текстом принадлежность, не усиливая её добавочным словом «собственную» и не привнося позднейших богословских построений.
translation_notes:
  register: 'Современный литературный русский язык; торжественный, но ясный пророческий стиль. Три последовательных действия Бога переданы параллельными глаголами будущего времени: «возьму — соберу — приведу».'
