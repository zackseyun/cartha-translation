  text: כְּ/צֹ֣אן קָֽדָשִׁ֗ים כְּ/צֹ֤אן יְרוּשָׁלִַ֨ם֙ בְּ/מ֣וֹעֲדֶ֔י/הָ כֵּ֤ן תִּהְיֶ֨ינָה֙ הֶ/עָרִ֣ים הֶ/חֳרֵב֔וֹת מְלֵא֖וֹת צֹ֣אן אָדָ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/038.yaml
  text: Like the holy flock[a], like the flock of Jerusalem at her appointed feasts, so the ruined cities will be filled with flocks of people. Then they will know that I am Yahweh.
translation:
  language: ru
  text: Подобно священному стаду, подобно стаду в Иерусалиме во время установленных праздников, так разорённые города будут наполнены стадами людей[a]. И узнают, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стада людей». Это образ множества людей, уподобленных овечьим стадам; в контексте он соотнесён со священным стадом в Иерусалиме во время праздников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֹאן קָדָשִׁים
  choice: Как священных овец
  rationale: צֹאן — собирательное обозначение мелкого скота; в культовом контексте קָדָשִׁים указывает на овец, посвящённых для жертвоприношений. В русском множественное «овец» естественно передаёт массовый образ.
- source_word: כְּצֹאן יְרוּשָׁלִַם בְּמוֹעֲדֶיהָ
  choice: как овец в Иерусалиме во время её установленных праздников
  rationale: מוֹעֵד здесь обозначает установленные праздничные времена богослужения. Формулировка сохраняет отнесённый к Иерусалиму суффикс женского рода и проясняет культовый контекст.
- source_word: כֵּן תִּהְיֶינָה
  choice: так ... наполнят
  rationale: Передана соотносительная конструкция «как… так…»; будущее значение выражено формой «наполнят» в сочетании с именной частью исходного сказуемого.
- source_word: הֶעָרִים הֶחֳרֵבוֹת
  choice: опустевшие города
  rationale: חֳרֵבוֹת описывает города, лежащие в запустении после разорения. «Опустевшие» естественно сочетается с последующим образом их наполнения, не исключая значения разорённости.
- source_word: מְלֵאוֹת צֹאן אָדָם
  choice: наполнят стадами людей
  rationale: 'Сохранена резкая метафора буквального еврейского выражения «стада людей»: множество жителей уподоблено праздничным жертвенным стадам. «Людей» в современном русском естественно передаёт родовое אָדָם без ненужного ограничения мужчинами.'
- source_word: וְיָדְעוּ
  choice: И узнают
  rationale: Союз ו передан прямо; совершенная форма в пророческом контексте имеет будущее значение. «Узнают» соответствует устойчивой формуле узнавания Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Культовый смысл כְּצֹאן קָדָשִׁים
  choice: священных овец
  alternative: священного стада; овец для святынь
  rationale: Контекст установленных праздников указывает на посвящённых жертвенных животных, однако перевод не уточняет сверх текста вид жертвы.
- issue: Образ צֹאן אָדָם
  choice: стадами людей
  alternative: людскими стадами; людьми, словно стадами
  rationale: Сохранена богословски напряжённая метафора умноженного народа, сопоставленного с множеством жертвенных овец, без сведения её к нейтральному «множеству людей».
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Параллелизм «как… как… так…» и необычный образ «стада людей» сохранены; синтаксис слегка упорядочен для ясности.
