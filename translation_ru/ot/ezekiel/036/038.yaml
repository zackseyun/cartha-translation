revisions:
- from: Как священных овец, как овец в Иерусалиме во время её установленных праздников, так опустевшие города наполнят стадами людей[a]. И узнают, что Я — Яхве.
  to: Подобно священному стаду, подобно стаду в Иерусалиме во время установленных праздников, так разорённые города будут наполнены стадами людей[a]. И узнают, что Я — Яхве.
  rationale: Исправлена синтаксическая ошибка, чтобы города были наполнены, а не выступали деятелем. «Разорённые» точнее передаёт хֳרֵבוֹת, чем «опустевшие», поскольку включает запустение вследствие разрушения. Сравнительный параллелизм и метафора человеческих стад сохранены без излишнего истолкования.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:36:07Z'
