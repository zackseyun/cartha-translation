source:
  edition: WLC
  text: וְ/הִרְבֵּיתִי֙ אֶת פְּרִ֣י הָ/עֵ֔ץ וּ/תְנוּבַ֖ת הַ/שָּׂדֶ֑ה לְמַ֗עַן אֲ֠שֶׁר לֹ֣א תִקְח֥וּ ע֛וֹד חֶרְפַּ֥ת רָעָ֖ב בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/030.yaml
  text: And I will multiply the fruit of the tree and the produce of the field[a], so that you will no longer bear the reproach of famine among the nations.
translation:
  language: ru
  text: И умножу плоды деревьев и урожай полей, чтобы вам больше не нести среди народов позор голода.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: И умножу
  rationale: Хифиль перфекта 1-го лица ед. числа в пророческом обещании передаёт будущее действие Бога; «умножу» сохраняет каузативный смысл и звучит естественно.
- source_word: פְּרִי הָעֵץ
  choice: плоды деревьев
  rationale: Оба существительных стоят в единственном числе с собирательным значением; в современном русском множественное число естественно передаёт сельскохозяйственную реальность.
- source_word: וּתְנוּבַת הַשָּׂדֶה
  choice: и урожай полей
  rationale: תְּנוּבָה означает плодородный продукт или урожай; «урожай полей» — ясное и естественное соответствие собирательному выражению.
- source_word: לְמַעַן אֲשֶׁר
  choice: чтобы
  rationale: Сочетание вводит цель или результат; русский союз «чтобы» сохраняет эту допустимую смысловую широту.
- source_word: לֹא תִקְחוּ עוֹד
  choice: вам больше не нести
  rationale: Хотя לקח обычно значит «брать, принимать», в сочетании с חֶרְפָּה выражает переживание или несение позора. Формулировка сохраняет образ исходного глагола и остаётся понятной.
- source_word: חֶרְפַּת רָעָב
  choice: позор голода
  rationale: Сопряжённая конструкция обозначает позор или поношение, связанное с голодом; «позор» хорошо передаёт публичный аспект утраты чести.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Речь идёт об окружающих народах, перед которыми голод Израиля становился предметом позора; «народы» здесь точнее и нейтральнее, чем конфессионально окрашенное «язычники».
theological_decisions:
- issue: Обещание земного изобилия и восстановление чести перед народами
  choice: 'Сохранены обе стороны: Бог умножает плоды и урожай, вследствие чего Израиль больше не несёт среди народов позор, вызванный голодом.'
  alternative: Свести стих либо только к хозяйственному благополучию, либо только к восстановлению чести.
  rationale: Еврейский текст прямо связывает сельскохозяйственное изобилие с прекращением публичного позора; перевод не должен устранять ни одну из этих сторон.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Собирательные еврейские формы переданы естественными русскими формами множественного числа; краткий параллелизм сохранён.
