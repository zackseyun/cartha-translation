translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Синтаксический параллелизм и последовательность траурных действий сохранены; архаизирующее «возопят» здесь уместно как выразительный глагол громкого плача, тогда как остальная лексика остаётся общепонятной.
