translation:
  language: ru
  text: Они поднимут свой голос над тобой и горько закричат; посыплют пылью свои головы и будут кататься в пепле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁמִיעוּ עָלַיִךְ בְּקוֹלָם
  choice: они громко возопят над тобой
  rationale: Хифиль от שׁמע буквально означает «сделают слышным свой голос». По-русски «громко возопят» естественно передаёт звучный, нарочито слышимый плач; עָלַיִךְ в контексте погребального плача означает «над тобой», а не враждебное «против тебя».
- source_word: וְיִזְעֲקוּ מָרָה
  choice: и горько зарыдают
  rationale: זעק обозначает громкий крик, а מָרָה наречно выражает горечь. «Горько зарыдают» естественно передаёт плач скорбящих, не ослабляя его силы.
- source_word: וְיַעֲלוּ עָפָר עַל רָאשֵׁיהֶם
  choice: посыплют головы пылью
  rationale: Буквально речь идёт о поднятии или набрасывании пыли на головы как знаке траура. Русский оборот «посыпать голову пылью» ясно и естественно передаёт этот жест.
- source_word: בָּאֵפֶר יִתְפַּלָּשׁוּ
  choice: будут валяться в пепле
  rationale: Редкий хитпаэль от פלשׁ в данном контексте описывает катание или валяние в пепле как знак скорби. «Валяться» сохраняет телесную выразительность образа без добавочного толкования.
