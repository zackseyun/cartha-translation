base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/021.yaml
  text: Arabia and all the princes of Kedar—they were your traders[a]; in lambs, rams, and male goats[b], in these they traded with you.
translation:
  language: ru
  text: Аравия[a] и все князья Кедара были твоими торговыми партнёрами[b]; ягнятами, баранами и козлами — этим они торговали с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арабы». Еврейское название может обозначать как Аравию, так и её жителей.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «торговцами твоей руки» — идиоматическое выражение о тех, кто торговал с тобой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲרַב
  choice: Аравия
  rationale: Еврейское название может обозначать область или населяющих её арабов. В перечне торговых народов и земель географическое название «Аравия» естественно для русского текста, а примечание сохраняет возможное личное значение.
- source_word: נְשִׂיאֵי
  choice: князья
  rationale: Слово обозначает племенных правителей или вождей. «Князья» сохраняет высокий политический оттенок и хорошо сочетается с названием Кедара.
- source_word: קֵדָר
  choice: Кедар
  rationale: Собственное имя передано принятой русской библейской транслитерацией.
- source_word: סֹחֲרֵי יָדֵךְ
  choice: твоими торговцами
  rationale: Буквально «торговцами твоей руки»; это идиоматическое обозначение тех, кто торговал с Тиром. Естественная русская формулировка передаёт смысл без неясного буквализма.
- source_word: כָרִים
  choice: ягнятами
  rationale: Обозначает ягнят или молодых откормленных овец; перевод «ягнятами» сохраняет отличие от следующих баранов.
- source_word: אֵילִים
  choice: баранами
  rationale: Стандартное значение слова и отдельная категория скота в перечне.
- source_word: עַתּוּדִים
  choice: козлами
  rationale: Слово обозначает самцов коз; русское «козлами» точно и естественно.
- source_word: בָּם
  choice: этим
  rationale: Местоимение отсылает к перечисленным видам скота как предметам торговли и сохраняет повторную, подчёркивающую конструкцию оригинала.
- source_word: סֹחֲרָיִךְ
  choice: они торговали с тобой
  rationale: Форма с тем же торговым корнем передана глагольно ради естественности русского синтаксиса; женский суффикс второго лица относится к Тиру как к городу.
