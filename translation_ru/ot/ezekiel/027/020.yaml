  rationale: Собственное географическое имя передано принятой русской библейской транслитерацией.
- source_word: רֹכַלְתֵּךְ
  choice: торговал с тобой
  rationale: Форма от רכל с суффиксом 2-го лица женского рода обращена к Тиру и обозначает торговые отношения; эта формулировка естественна по-русски.
- source_word: בְּבִגְדֵי חֹפֶשׁ
  choice: попонами
  rationale: Сочетание обозначает особый вид ткани или покрытия, связанный с ездой; «попоны» кратко и естественно передаёт наиболее вероятный предмет торговли, при этом неопределённость отмечена в сноске.
- source_word: לְרִכְבָּה
  choice: для верховой езды
  rationale: Слово от רכב указывает на езду; контекст тканевых изделий делает вероятной связь со снаряжением верховых животных, хотя еврейское выражение не называет конкретное животное.
