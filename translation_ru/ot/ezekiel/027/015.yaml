  text: בְּנֵ֤י דְדָן֙ רֹֽכְלַ֔יִ/ךְ אִיִּ֥ים רַבִּ֖ים סְחֹרַ֣ת יָדֵ֑/ךְ קַרְנ֥וֹת שֵׁן֙ ו/הובנים הֵשִׁ֖יבוּ אֶשְׁכָּרֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/015.yaml
  text: The sons of Dedan were your merchants[a]. Many coastlands were the market of your hand[c][b]; they brought back ivory tusks and ebony as your payment.
translation:
  language: ru
  text: Сыны Дедана были твоими купцами. Многие приморские земли[a] были рынком твоей торговли; бивни из слоновой кости[b] и эбеновое дерево[c] они доставляли тебе в качестве платы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многие острова». Буквально: «были торговлей твоей руки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рога из слоновой кости».'
    reason: lexical_alternative
  - marker: c
    text: То есть чёрное дерево.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דְדָן
  choice: сыны Дедана
  rationale: Сохранена форма еврейского сочетания «сыны Дедана»; в данном контексте она обозначает жителей или народ Дедана.
- source_word: רֹכְלַיִךְ
  choice: твои купцы
  rationale: Слово обозначает торговцев; «купцы» естественно звучит в описании международной торговли Тира.
- source_word: אִיִּים רַבִּים
  choice: многие приморские земли
  rationale: אִיִּים может обозначать как острова, так и удалённые морские побережья; в основном тексте выбран широкий географический смысл, а более узкий вариант отмечен в сноске.
- source_word: סְחֹרַת יָדֵךְ
  choice: торговали с тобой
  rationale: Буквальное выражение «торговля твоей руки» неестественно по-русски и неоднозначно; контекстуальная передача ясно выражает участие этих земель в торговой сети Тира, не превращая их определённо ни в рынок, ни в товар.
- source_word: קַרְנוֹת שֵׁן
  choice: бивни из слоновой кости
  rationale: Буквально «рога кости/слоновой кости»; речь идёт о бивнях как предмете торговли. Буквальный образ сохранён в сноске.
- source_word: וְהוֹבְנִים
  choice: эбеновое дерево
  rationale: Традиционно слово понимается как обозначение эбенового, то есть чёрного, дерева — ценного привозного товара.
- source_word: הֵשִׁיבוּ
  choice: доставляли
  rationale: Каузативная форма שוב буквально связана с возвращением или принесением обратно; в торговом контексте она описывает доставку товаров в ответ или в обмен.
- source_word: אֶשְׁכָּרֵךְ
  choice: тебе в уплату
  rationale: Существительное означает плату или вознаграждение; оборот передаёт коммерческий обмен и сохраняет обращение к Тиру.
