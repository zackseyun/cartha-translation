base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/007.yaml
  text: Fine embroidered linen from Egypt was your sail[a], serving as your banner[b]; blue and purple from the coasts of Elishah was your covering.
translation:
  language: ru
  text: Тонкий вышитый лён из Египта был твоим парусом и служил тебе знаменем[a]; голубая и пурпурная ткань с побережий Элиши[b] была твоим покрытием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опознавательным знаком» либо «штандартом». Еврейское נֵס обозначает знамя, штандарт или заметный издалека сигнал.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с островов Элиши». Еврейское אִיִּים может обозначать острова или приморские земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ בְּרִקְמָה
  choice: тонкий вышитый лён
  rationale: שֵׁשׁ обозначает высококачественный тонкий лён, а רִקְמָה — вышивку или богато узорчатую работу; сочетание передаёт и материал, и искусность изготовления.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог указывает на происхождение ткани.
- source_word: מִפְרָשֵׂךְ
  choice: твоим парусом
  rationale: В развёрнутом образе Тира как корабля слово естественно обозначает парус.
- source_word: לִהְיוֹת לָךְ לְנֵס
  choice: служил тебе знаменем
  rationale: נֵס может обозначать знамя, штандарт или заметный издалека опознавательный знак; функциональная формулировка сохраняет образ паруса как видимого символа.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: голубая и пурпурная ткань
  rationale: Названия красителей метонимически обозначают окрашенные ими дорогие ткани; добавление слова «ткань» делает русскую фразу ясной в данном контексте.
- source_word: מֵאִיֵּי אֱלִישָׁה
  choice: с побережий Элиши
  rationale: אִיִּים может означать как острова, так и приморские земли; в контексте морской торговли «побережья» звучит естественно, а альтернативное значение отмечено в сноске.
- source_word: מְכַסֵּךְ
  choice: твоим покрытием
  rationale: Слово обозначает то, что покрывает; общий термин сохраняет корабельный образ, не вводя неявно конкретную конструкцию вроде навеса.
