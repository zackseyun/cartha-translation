  rationale: Географическое или этническое название передано традиционной русской библейской формой.
- source_word: אַשּׁוּר
  choice: Ашшур
  rationale: Сохраняется форма собственного имени в еврейском тексте; контекстуальное «Ассирия» дано как вариант.
- source_word: כִּלְמַד
  choice: Килмад
  rationale: Редкое и не вполне определённое географическое название передано транслитерацией.
- source_word: רֹכַלְתֵּךְ
  choice: торговали с тобой
  rationale: Естественная русская передача коммерческого значения глагола с суффиксом второго лица женского рода, относящимся к Тиру.
