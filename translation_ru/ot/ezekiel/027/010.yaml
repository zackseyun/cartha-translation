base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/010.yaml
  text: Persia[a], Lud, and Put were in your army as your men of war. They hung shield and helmet in you[b]; they gave you splendor.
translation:
  language: ru
  text: Персы, Луд и Пут служили в твоём войске как твои воины. Они развесили у тебя щиты и шлемы[a] и придали тебе великолепие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «развесили на тебе щиты и шлемы» — возможно, речь об оружии, выставленном на стенах Тира.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «создавали твоё великолепие» или «придавали тебе величие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַס
  choice: персы
  rationale: Название народа передано общепринятой русской формой; в данном перечислении естественно обозначает персидских воинов.
- source_word: לוּד
  choice: Луд
  rationale: Сохранена транслитерация еврейского этнонима, поскольку отождествление с Лидией возможно, но не бесспорно.
- source_word: פוּט
  choice: Пут
  rationale: Этноним передан близкой к еврейской форме русской транслитерацией.
- source_word: בְחֵילֵךְ
  choice: в твоём войске
  rationale: Хотя חַיִל может означать силу, доблесть или богатство, непосредственное упоминание воинов требует военного значения.
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: как твои воины
  rationale: Передаёт буквальное «люди твоей войны» естественным современным русским выражением и согласуется с функцией перечисленных народов в войске Тира.
- source_word: מָגֵן וְכוֹבַע
  choice: щиты и шлемы
  rationale: Обычные русские соответствия названиям защитного вооружения; множественное число естественно при собирательном описании снаряжения многих воинов.
- source_word: תִּלּוּ בָךְ
  choice: развешивали у тебя
  rationale: Глагол означает «вешать», а בָךְ буквально указывает «в тебе». Формулировка «у тебя» сохраняет обращение к городу и допускает размещение оружия на стенах либо внутри Тира.
- source_word: הֵמָּה נָתְנוּ הֲדָרֵךְ
  choice: придавали тебе великолепие
  rationale: Еврейская конструкция буквально связана с «дать твоё великолепие»; по-русски естественно выражает, что присутствие воинов и выставленное оружие усиливали величественный облик Тира.
