  yaml_path: translation/ot/ezekiel/027/014.yaml
  text: From Beth-togarmah they traded horses[a], horsemen[b], and mules for your wares.
translation:
  language: ru
  text: Из Бет-Тогармы[a] в обмен на твои товары давали коней, всадников[b] и мулов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из дома Тогармы»; выражение может обозначать народ или область, связанную с Тогармой.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «верховых коней» или «боевых коней». Обычно еврейское слово означает всадников или конницу, однако в этом перечне товаров оно может обозначать коней для верховой езды.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֵּית תּוֹגַרְמָה
  choice: Из Бет-Тогармы
  rationale: Сочетание буквально означает «из дома Тогармы», но в перечне торговых партнёров обозначает народ или область, связанную с Тогармой. Передача «Бет-Тогарма» сохраняет форму географического названия и не сводит её к буквальному домашнему хозяйству.
- source_word: סוּסִים
  choice: коней
  rationale: Обычное множественное число от слова «конь, лошадь»; слово «кони» естественно звучит в перечне животных и отличается по форме от следующего спорного термина.
- source_word: וּפָרָשִׁים
  choice: всадников
  rationale: Наиболее прямое значение существительного — «всадники, конники». Хотя торговый контекст позволяет понимать его как обозначение верховых или боевых коней, основной текст сохраняет обычное лексическое значение, а контекстуальная альтернатива вынесена в сноску.
- source_word: וּפְרָדִים
  choice: и мулов
  rationale: Стандартное значение названия животного; оно естественно продолжает перечисление.
- source_word: נָתְנוּ
  choice: давали
  rationale: Сохранено основное значение глагола «давать». Оборот «в обмен на» ясно передаёт его торговую функцию в контексте главы, не превращая глагол в более узкое «продавали».
- source_word: עִזְבוֹנָיִךְ
  choice: в обмен на твои товары
  rationale: Существительное относится к товару или предмету обмена. Русский оборот передаёт коммерческую взаимность фразы и обращение к Тиру во втором лице женского рода.
