  text: הוֹנֵ/ךְ֙ וְ/עִזְבוֹנַ֔יִ/ךְ מַעֲרָבֵ֕/ךְ מַלָּחַ֖יִ/ךְ וְ/חֹבְלָ֑יִ/ךְ מַחֲזִיקֵ֣י בִדְקֵ֣/ך וְֽ/עֹרְבֵ֣י מַ֠עֲרָבֵ/ךְ וְ/כָל אַנְשֵׁ֨י מִלְחַמְתֵּ֜/ךְ אֲשֶׁר בָּ֗/ךְ וּ/בְ/כָל קְהָלֵ/ךְ֙ אֲשֶׁ֣ר בְּ/תוֹכֵ֔/ךְ יִפְּלוּ֙ בְּ/לֵ֣ב יַמִּ֔ים בְּ/י֖וֹם מַפַּלְתֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/027.yaml
  text: Your wealth[a], your wares, your merchandise, your sailors, and your pilots, those who repair your damage, and those who trade in your merchandise, and all your men of war who are in you, with all your assembly that is in your midst[b], will fall into the heart of the seas on the day of your downfall.
translation:
  language: ru
  text: Твоё богатство, твои грузы и товары, твои моряки и кормчие, те, кто заделывает твои пробоины[a], торговцы твоими товарами, все твои воины, находящиеся в тебе, и всё множество людей среди тебя — все они падут в сердце морей[b] в день твоего падения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто конопатит твои швы»; или: «те, кто чинит твои повреждения».'
    reason: lexical_alternative
  - marker: b
    text: То есть посреди морей или в морской глубине.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹנֵךְ
  choice: твоё богатство
  rationale: הוֹן обозначает богатство или состояние; «богатство» естественно звучит в торговом плаче о Тире.
- source_word: עִזְבוֹנַיִךְ
  choice: твои грузы
  rationale: В торгово-морском контексте главы слово обозначает перевозимое имущество или товары; «грузы» сохраняет связь с образом корабля и отличает это слово от следующего מַעֲרָב.
- source_word: מַעֲרָבֵךְ
  choice: товары / твоими товарами
  rationale: В Иезекииле 27 существительное относится к предметам торговли; «товары» ясно передаёт коммерческий смысл и естественно сочетается с глаголом «торговать».
- source_word: מַלָּחַיִךְ
  choice: твои моряки
  rationale: Современное и понятное обозначение членов судовой команды.
- source_word: חֹבְלָיִךְ
  choice: твои кормчие
  rationale: В контексте слово обозначает тех, кто управляет судном; «кормчие» сохраняет морскую точность и dignified biblical register without being obscure.
- source_word: מַחֲזִיקֵי בִדְקֵךְ
  choice: те, кто заделывает твои пробоины
  rationale: Буквально речь о тех, кто укрепляет или чинит повреждённое место. В корабельном образе «заделывает пробоины» конкретно и понятно; возможное указание на конопатку швов вынесено в сноску.
- source_word: עֹרְבֵי מַעֲרָבֵךְ
  choice: торговцы твоими товарами
  rationale: Причастие имеет здесь коммерческий смысл и обозначает людей, ведущих торговлю товарами Тира.
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: все твои воины
  rationale: Кратко и естественно передаёт буквальное «люди твоей войны», сохраняя военное значение.
- source_word: קְהָלֵךְ
  choice: всё множество людей
  rationale: קָהָל означает собравшуюся группу. В данном перечне речь, вероятно, обо всех людях, находящихся в Тире или на символическом корабле; формулировка не сужает их до официального собрания.
- source_word: יִפְּלוּ
  choice: падут
  rationale: Сохранён основной образ глагола «падать», который в морском контексте подразумевает гибель и погружение, но не сводится к пояснительному «утонут».
- source_word: בְּלֵב יַמִּים
  choice: в сердце морей
  rationale: Сохранена яркая еврейская метафора центра или глубины морей; её значение пояснено в сноске.
- source_word: מַפַּלְתֵּךְ
  choice: твоего падения
  rationale: Однокоренное русское существительное естественно передаёт катастрофический крах Тира и перекликается с «падут».
