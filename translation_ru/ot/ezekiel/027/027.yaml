translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Женский род местоимений соответствует обращению к Тиру как к олицетворённому городу-кораблю. Перечислительная структура и метафора «сердце морей» сохранены; тире перед итоговым «все они» облегчает восприятие длинного ряда.
