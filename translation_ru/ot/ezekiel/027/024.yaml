base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/024.yaml
  text: They were your merchants in choice wares[a], in wraps of blue and embroidered cloth, and in treasuries of multicolored fabrics, bound with cords and secured[b], among your merchandise.
translation:
  language: ru
  text: 'Они были твоими торговцами отборными товарами: свёртками синей ткани и вышитыми тканями, а также запасами пёстрых тканей[b], перевязанными шнурами и надёжно упакованными[a], среди твоих товаров.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изделиями из кедра» / «в кедровых ящиках». Еврейское слово трудно для истолкования; некоторые связывают его со словом «кедр», а не считают ещё одним описанием упаковки товаров.'
    reason: alternative_reading
  - marker: b
    text: Выражение, переведённое как «запасами пёстрых тканей», неясно; оно может обозначать ценные запасы, сундуки или тюки богато окрашенных тканей.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלַיִךְ
  choice: торговали у тебя
  rationale: Причастная форма обозначает участников торговой сети Тира; русская глагольная конструкция естественнее буквального «были твоими торговцами» и сохраняет обращение к городу.
- source_word: מַכְלֻלִים
  choice: отборными товарами
  rationale: В торговом контексте слово, вероятно, обозначает высококачественные, искусно изготовленные или ценные изделия; «отборные товары» передаёт смысл без чрезмерного уточнения.
- source_word: גְלוֹמֵי תְּכֵלֶת
  choice: свёртками синей ... ткани
  rationale: גְלוֹמֵי, вероятно, указывает на свёрнутые или упакованные ткани, а תְּכֵלֶת — на дорогой синий либо сине-пурпурный краситель; краткое «синей» сохраняет естественность.
- source_word: רִקְמָה
  choice: вышитой ткани
  rationale: В перечне товаров речь идёт о вышитом материале или вышитой работе; «вышитая ткань» ясно называет предмет торговли.
- source_word: גִנְזֵי בְּרֹמִים
  choice: хранилищами пёстрых тканей
  rationale: 'Оба слова трудны: первое может означать хранилища, запасы или сундуки, второе — разноцветные либо богато окрашенные ткани. Перевод оставляет образ ценного запаса, а неопределённость отмечена сноской.'
- source_word: חֲבָלִים חֲבֻשִׁים
  choice: перевязанными шнурами
  rationale: 'Сочетание описывает упаковку товаров: они связаны или стянуты шнурами.'
- source_word: אֲרֻזִים
  choice: надёжно упакованными
  rationale: В последовательности упаковочных терминов форма естественно понимается как описание плотно упакованных или закреплённых грузов; возможная связь с «кедром» сохранена в сноске.
- source_word: מַרְכֻלְתֵּךְ
  choice: среди твоих товаров
  rationale: Существительное в Иезекииля 27 относится к товарам или торговому обороту Тира; здесь конкретное «товары» соответствует инвентарному характеру стиха.
