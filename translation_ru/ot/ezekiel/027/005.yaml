base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/005.yaml
  text: With cypresses from Senir they built all your planking[b][a]; they took a cedar from Lebanon to make a mast for you.
translation:
  language: ru
  text: Из кипарисов[b] с Сенира[a] построили для тебя всю твою обшивку; взяли кедр с Ливана, чтобы сделать для тебя мачту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сенир — название местности, связанной с горой Ермон (ср. Втор. 3:9).
    reason: cross_reference
  - marker: b
    text: 'Или: «можжевельников» либо «елей»; точный вид дерева, обозначенного еврейским словом בְּרוֹשִׁים, неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹשִׁים
  choice: кипарисы
  rationale: Еврейское слово обозначает хвойные деревья, но точный вид не установлен. «Кипарисы» — традиционный и естественный вариант для корабельного леса; неопределённость отмечена в сноске.
- source_word: מִשְּׂנִיר
  choice: с Сенира
  rationale: Географическое название передано транслитерацией; Сенир — региональное название, связанное с горой Ермон.
- source_word: בָּנוּ לָךְ
  choice: построили для тебя
  rationale: Глагол בנה обычно означает «строить». Сочетание сохраняет образ строительства корабля и обращение к Тиру как к кораблю.
- source_word: אֵת כָּל לֻחֹתָיִם
  choice: всю твою обшивку
  rationale: В кораблестроительном контексте לוּחַ обозначает доски; собирательное «обшивка» естественно передаёт корпусные доски судна.
- source_word: אֶרֶז מִלְּבָנוֹן
  choice: кедр с Ливана
  rationale: Единственное число позволяет понимать конкретное кедровое дерево, предназначенное для одной мачты.
- source_word: לָקָחוּ
  choice: взяли
  rationale: Прямое значение глагола לקח сохранено без пояснительного расширения.
- source_word: לַעֲשׂוֹת תֹּרֶן
  choice: чтобы сделать ... мачту
  rationale: Точно передаёт целевую конструкцию и обычное значение תֹּרֶן — «мачта».
- source_word: עָלָיִךְ
  choice: для тебя
  rationale: Буквально предлог может значить «на тебе», однако применительно к изготовлению части корабля русское «для тебя» естественно передаёт отношение к олицетворённому судну и сохраняет женский адресат.
