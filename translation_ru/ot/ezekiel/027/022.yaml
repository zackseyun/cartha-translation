  yaml_path: translation/ot/ezekiel/027/022.yaml
  text: The merchants of Sheba and Raamah—they were your merchants; with the finest of every spice[a], with every precious stone, and gold, they paid for your wares.
translation:
  language: ru
  text: Купцы Савы и Раамы — они были твоими купцами; отборными благовониями всех видов, всевозможными драгоценными камнями и золотом они платили[a] за твои товары.
  philosophy: optimal-equivalence
  footnotes:
