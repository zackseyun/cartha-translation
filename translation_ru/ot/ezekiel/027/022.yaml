    text: 'Буквально: «давали». Здесь глагол употреблён в торговом смысле: они отдавали перечисленные ценности в обмен на товары.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלֵי שְׁבָא וְרַעְמָה
  choice: Купцы из Савы и Раамы
  rationale: רכל обозначает людей, занимающихся торговлей; «купцы» естественно звучит в русском описании международной торговли. Географические имена переданы в привычной русской библейской форме.
- source_word: הֵמָּה רֹכְלָיִךְ
  choice: были твоими торговцами
  rationale: Сохранены независимое местоимение и обращение к Тиру; конструкция подчёркивает, что именно эти народы участвовали в его торговле.
- source_word: בְּרֹאשׁ כָּל־בֹּשֶׂם
  choice: лучшими благовониями всех видов
  rationale: רֹאשׁ здесь имеет идиоматическое значение «лучшее, отборное», а בֹּשֶׂם охватывает ароматические вещества и благовония. Формулировка передаёт и качество, и разнообразие товара.
- source_word: וּבְכָל־אֶבֶן יְקָרָה
  choice: всевозможными драгоценными камнями
  rationale: Собирательная конструкция со значением полноты естественно передаётся русским множественным числом.
- source_word: וְזָהָב
  choice: и золотом
  rationale: Прямое обозначение товара; творительный падеж согласован с коммерческой конструкцией русского предложения.
- source_word: נָתְנוּ עִזְבוֹנָיִךְ
  choice: они расплачивались за твои товары
  rationale: נָתְנוּ буквально означает «давали», но в данном торговом контексте выражает передачу перечисленных ценностей в оплату или обмен на товары Тира. «Расплачивались» ясно передаёт коммерческий смысл, не превращая обмен в современную денежную покупку.
