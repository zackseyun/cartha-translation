  text: יָוָ֤ן תֻּבַל֙ וָ/מֶ֔שֶׁךְ הֵ֖מָּה רֹֽכְלָ֑יִ/ךְ בְּ/נֶ֤פֶשׁ אָדָם֙ וּ/כְלֵ֣י נְחֹ֔שֶׁת נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/013.yaml
  text: Javan[a], Tubal, and Meshech—they were your traders; they exchanged human lives and articles of bronze for your wares.
translation:
  language: ru
  text: Яван[a], Тувал и Мешех были твоими купцами; в обмен на твои товары они отдавали людей и бронзовые изделия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Греция»; Яван — древнее название греков и населённой ими страны.'
    reason: historical_identification
lexical_decisions:
- source_word: יָוָן
  choice: Яван
  rationale: Сохранено древнееврейское название народа и страны посредством принятой русской библейской транслитерации; отождествление с Грецией не внесено в основной текст.
- source_word: תֻּבַל
  choice: Тувал
  rationale: Передано как собственное имя народа и области в форме, традиционной для русского библейского употребления.
- source_word: מֶשֶׁךְ
  choice: Мешех
  rationale: Передано как собственное имя народа и области без подмены историко-географическим отождествлением.
- source_word: רֹכְלָיִךְ
  choice: торговали с тобой
  rationale: Естественно передаёт значение торговых партнёров Тира и сохраняет обращение к городу во втором лице.
- source_word: בְּנֶפֶשׁ אָדָם
  choice: людей
  rationale: В торговом контексте выражение обозначает людей как предмет обмена. Перевод остаётся формально точным и не уточняет их правовой статус прямо в основном тексте.
- source_word: כְלֵי נְחֹשֶׁת
  choice: бронзовые изделия
  rationale: Общее обозначение изготовленных из бронзы предметов; слово «сосуды» неоправданно сузило бы смысл.
- source_word: נָתְנוּ
  choice: отдавали
  rationale: Буквальное значение «давали» в данном торговом контексте означает предоставление товаров в обмен; «отдавали» естественно сочетается с конструкцией «за твои товары».
- source_word: מַעֲרָבֵךְ
  choice: твои товары
  rationale: В контексте перечня международной торговли обозначает товары, получаемые при обмене; русское «товары» ясно и естественно.
