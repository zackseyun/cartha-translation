  yaml_path: translation/ot/ezekiel/027/006.yaml
  text: They made your oars of oaks from Bashan[c][b][a]; they made your deck of ivory from the coasts of Kittim.
translation:
  language: ru
  text: Из дубов Башана делали твои вёсла; твои корабельные доски[a] делали из слоновой кости и ашшурима[b], доставленных с островов Киттима[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твою обшивку»; еврейское слово обозначает доски или обшивочные элементы корабля, но точная часть конструкции неясна.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст здесь труден; буквально: «слоновая кость, дочь ашшурим». Возможно, речь идёт о слоновой кости, оправленной в ценную древесину; ашшурим по-разному отождествляют, например с кипарисом или самшитом.'
    reason: alternative_reading
  - marker: c
    text: «Киттим» первоначально связывали с Кипром, а позднее этим названием могли обозначать и другие западные островные и приморские земли.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוֹנִים
  choice: дубы
  rationale: Слово обозначает крупные твёрдолиственные деревья и может также пониматься как «теревинфы»; в связи с известной древесиной Башана и изготовлением вёсел естественно «дубы».
- source_word: מִבָּשָׁן
  choice: башанские
  rationale: Географическое указание на происхождение древесины передано естественным русским прилагательным без утраты топонима.
- source_word: מִשּׁוֹטָיִךְ
  choice: твои вёсла
  rationale: В развёрнутом образе корабля речь идёт о приспособлениях для гребли; «вёсла» точно и понятно передаёт контекст.
- source_word: קַרְשֵׁךְ
  choice: твои палубные доски
  rationale: Существительное означает доску или обшивочную деталь. Сочетание «палубные доски» сохраняет предметное значение, не сводя его безоговорочно ко всей палубе.
- source_word: שֵׁן
  choice: слоновая кость
  rationale: Буквально «зуб», но при обозначении материала это обычное название слоновой кости.
- source_word: בַּת אֲשֻׁרִים
  choice: оправленной в древесину ашшурим
  rationale: Масоретское чтение буквально неясно («дочь ашшурим»). В контексте роскошного корабельного убранства вероятен материал-основа, в который была оправлена слоновая кость; редкое название древесины оставлено транслитерацией, чтобы не выдавать спорное отождествление с кипарисом, самшитом или другим деревом за достоверное.
- source_word: מֵאִיֵּי כִתִּים
  choice: с островов Киттима
  rationale: אִיִּים буквально обозначает острова, а иногда приморские земли; Киттим сохранён как древний географический термин.
