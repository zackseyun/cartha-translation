lexical_decisions:
- source_word: וְ/אַתָּה
  choice: А ты
  rationale: Союз с самостоятельным местоимением обозначает переход и прямое обращение; «А ты» естественно передаёт этот дискурсивный поворот по-русски.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Устойчивое обращение к Иезекиилю; традиционная и понятная русская формулировка сохраняет образность и форму еврейского выражения.
- source_word: שָׂא
  choice: подними
  rationale: Глагол буквально означает «поднять, понести», а в сочетании с קִינָה служит устойчивым оборотом, означающим начало плача. «Подними плач» сохраняет исходную метафору и остаётся понятным в возвышенной пророческой речи.
- source_word: עַל
  choice: о
  rationale: При обозначении плача предлог указывает на его предмет. Русское «о Тире» естественно и не вносит оттенка враждебности, возможного у варианта «против».
- source_word: צֹר
  choice: Тире
  rationale: Стандартная русская форма названия города Тир в предложном падеже после предлога «о».
- source_word: קִינָה
  choice: плач
  rationale: Слово обозначает формальный скорбный плач или погребальную песнь. «Плач» — ясный, устоявшийся и стилистически достойный русский эквивалент.
