  yaml_path: translation/ot/ezekiel/027/025.yaml
  text: The ships of Tarshish were your carriers for your merchandise[b][a], and you were filled and became very heavy in the heart of the seas.
translation:
  language: ru
  text: Фарсисские корабли перевозили твои товары[a], и ты наполнилась и стала очень тяжёлой в сердце морей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение еврейского слова, переданного «перевозили», не вполне ясно; буквально: «были твоими перевозчиками».'
