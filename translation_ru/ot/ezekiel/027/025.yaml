  - marker: b
    text: «В сердце морей» — то есть посреди морей, среди морских просторов.
    reason: cultural_note
lexical_decisions:
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: Фарсисские корабли
  rationale: Сохраняет связь кораблей с Фарсисом и естественно передаёт еврейское сочетание в современном русском языке.
- source_word: שָׁרוֹתַיִךְ מַעֲרָבֵךְ
  choice: перевозили твои товары
  rationale: В торговом контексте речь идёт о кораблях, служивших для перевозки товаров Тира. Глагольная передача звучит по-русски естественнее, чем буквальное «были твоими перевозчиками», при этом спорность редкого слова שָׁרוֹתַיִךְ отмечена в сноске.
- source_word: וַתִּמָּלְאִי
  choice: Ты наполнилась
  rationale: Сохраняет результативное значение формы и женский род обращения к Тиру.
- source_word: וַתִּכְבְּדִי מְאֹד
  choice: стала очень тяжёлой
  rationale: Передаёт буквальный образ тяжести от обилия груза, не заменяя его отвлечённым значением славы или почёта.
- source_word: בְּלֵב יַמִּים
  choice: в сердце морей
  rationale: Сохраняет яркую еврейскую метафору; её пространственный смысл поясняется в сноске.
