base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/012.yaml
  text: Tarshish was your trader because of your abundant wealth[a]; with silver, iron, tin[c][b], and lead they paid for your wares.
translation:
  language: ru
  text: Тарсис[a] торговал с тобой из-за обилия всевозможных богатств; серебром, железом, оловом и свинцом расплачивались за твои товары[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тарсис может обозначать далёкий торговый регион; некоторые исследователи отождествляют его с Тартессом в Испании.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «давали за твои товары»; в торговом контексте это означает расчёт или обмен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְשִׁישׁ
  choice: Тарсис
  rationale: Название передано традиционной русской транслитерацией; возможное отождествление с Тартессом не внесено в основной текст.
- source_word: סֹחַרְתֵּךְ
  choice: торговал с тобой
  rationale: Форма обозначает участника торговли с Тиром. Глагольная передача звучит естественно по-русски и сохраняет обращение к Тиру в единственном числе.
- source_word: מֵרֹב כָּל הוֹן
  choice: из-за обилия всевозможных богатств
  rationale: מִן в данном контексте имеет причинное значение, а כָּל הוֹן подчёркивает многочисленность и разнообразие богатств.
- source_word: בְּכֶסֶף בַּרְזֶל בְּדִיל וְעוֹפֶרֶת
  choice: серебром, железом, оловом и свинцом
  rationale: Предлог בְּ передаёт средство расчёта или обмена; перечень металлов сохранён без перестройки.
- source_word: נָתְנוּ
  choice: расплачивались
  rationale: Основное значение глагола — «давали», но в торговом контексте речь идёт о передаче металлов в обмен на товары.
- source_word: עִזְבוֹנָיִךְ
  choice: твои товары
  rationale: Коммерческий термин в Иезекииле 27 обозначает товары или имущество, участвующее в обмене.
