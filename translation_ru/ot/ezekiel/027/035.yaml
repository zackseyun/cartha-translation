lexical_decisions:
- source_word: כֹּל יֹשְׁבֵי הָאִיִּים
  choice: Все жители приморских земель
  rationale: Причастие в сопряжённой конструкции означает «жители», а אִיִּים может обозначать как острова, так и более широко приморские земли; в пророчестве о морском Тире более широкое значение уместно, при этом альтернативу следует сохранить в сноске.
- source_word: שָׁמְמוּ עָלָיִךְ
  choice: ужаснулись из-за тебя
  rationale: Глагол передаёт потрясение и ужас перед участью Тира, а עַל указывает на причину или повод этой реакции.
- source_word: שָׂעֲרוּ שַׂעַר
  choice: содрогнулись от ужаса
  rationale: Однокоренное дополнение усиливает глагол, описывающий сильнейшее волнение или дрожь; русская формулировка естественно передаёт интенсивность выражения.
- source_word: רָעֲמוּ פָּנִים
  choice: лица их исказились
  rationale: Трудная фраза описывает заметную на лицах сильную дрожь или потрясение; «исказились» сохраняет яркий телесный образ, не уточняя его сверх текста.
