  text: דַּמֶּ֧שֶׂק סֹחַרְתֵּ֛/ךְ בְּ/רֹ֥ב מַעֲשַׂ֖יִ/ךְ מֵ/רֹ֣ב כָּל ה֑וֹן בְּ/יֵ֥ין חֶלְבּ֖וֹן וְ/צֶ֥מֶר צָֽחַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/018.yaml
  text: Damascus traded with you because of your many products[a], because of your abundant wealth, with wine of Helbon and white wool.
translation:
  language: ru
  text: Дамаск торговал с тобой[a] из-за множества твоих изделий и обилия всякого богатства — вином из Хелбона и белой шерстью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дамаск был твоим торговцем… с вином из Хелбона и светлой шерстью».'
    reason: Еврейскую форму סֹחַרְתֵּךְ можно передать именной конструкцией «был твоим торговцем», а צָחַר — как «светлая» или «яркая».
lexical_decisions:
- source_word: דַּמֶּשֶׂק
  choice: Дамаск
  rationale: Общепринятая русская форма названия города.
- source_word: סֹחַרְתֵּךְ
  choice: торговал с тобой
  rationale: Форма от корня סחר с суффиксом 2-го лица женского рода обращена к Тиру. Русское выражение естественно передаёт торговые отношения; именная конструкция «был твоим торговцем» сохранена в сноске как допустимая альтернатива.
- source_word: בְּרֹב מַעֲשַׂיִךְ
  choice: из-за множества твоих изделий
  rationale: מַעֲשֶׂה буквально обозначает сделанное или произведённое; в торговом перечне главы речь идёт об изделиях, служащих предметом торговли. Предлог בְּ понят как указывающий на причину.
- source_word: מֵרֹב כָּל הוֹן
  choice: и обилия всякого богатства
  rationale: הוֹן означает богатство, состояние. «Всякого богатства» сохраняет обобщающее כָּל и усилительное значение оборота, не устраняя некоторой необычности исходной формулировки.
- source_word: בְּיֵין חֶלְבּוֹן
  choice: привозя вино из Хелбона
  rationale: Хелбон — географическое название, связанное с известным вином. Добавленное по контексту «привозя» ясно связывает названные товары с торговлей и не представляет их как богатство Тира.
- source_word: וְצֶמֶר צָחַר
  choice: и белую шерсть
  rationale: צֶמֶר — «шерсть»; צָחַר здесь обычно понимается как «белый, светлый, яркий». «Белая шерсть» — ясное и естественное обозначение товара.
