    reason: textual_variant
  - marker: b
    text: 'Или: «приведённому к безмолвию», «опустошённому» или «разорённому». Еврейское слово может передавать состояние безмолвия, прекращения или опустошения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: они поднимут
  rationale: Сочетание נשׂא с קינה означает начать или исполнить плачевную песнь; «поднимут» сохраняет образ еврейского выражения и естественно сочетается с последующим дополнением.
- source_word: אֵלַיִךְ
  choice: о тебе
  rationale: Хотя буквально предлог направленности может означать «к тебе», в контексте погребального плача речь идёт о песне, посвящённой Тиру.
- source_word: בְּנִיהֶם
  choice: в своих рыданиях
  rationale: Масоретская форма трудна и буквально может быть понята как «с их сыновьями»; однако окружение, насыщенное лексикой плача, поддерживает понимание как указание на скорбный крик или рыдание.
- source_word: קִינָה
  choice: погребальную песнь
  rationale: קינה обозначает формальный плач, нередко исполняемый как скорбная песнь; перевод передаёт жанр и остаётся понятным современному читателю.
- source_word: וְקוֹנְנוּ
  choice: и будут оплакивать
  rationale: Глагол обозначает исполнение плача по погибшему; «оплакивать» естественно передаёт действие и избегает тяжеловесного повтора слова «плач».
- source_word: עָלָיִךְ
  choice: тебя
  rationale: С глаголом оплакивания русский язык требует прямого дополнения, тогда как еврейский использует על.
- source_word: מִי כְצוֹר
  choice: Кто подобен Тиру
  rationale: Сохранён риторический вопрос и традиционная русская форма названия города.
- source_word: כְּדֻמָה
  choice: умолкшему
  rationale: Форма передаёт состояние того, кто сделан безмолвным или неподвижным; «умолкшему» сохраняет поэтический образ, не сводя его однозначно к полному уничтожению.
- source_word: בְּתוֹךְ הַיָּם
  choice: посреди моря
  rationale: Краткое и поэтичное соответствие пространственному выражению, сохраняющее морской образ пророчества.
