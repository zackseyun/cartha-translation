base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/033.yaml
  text: When your wares went out from the seas[a], you satisfied many peoples[b]; with your abundant wealth and your merchandise you enriched the kings of the earth.
translation:
  language: ru
  text: Когда твои грузы шли с морей[a], ты насыщала многие народы; обилием своих богатств и товаров ты обогащала царей земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда твои товары выходили из морей». Этот образ говорит об отправке торговых грузов Тира морскими путями.'
    reason: translation_clarity
  - marker: b
    text: 'Или: «царей страны»; еврейское אֶרֶץ может означать как землю вообще, так и отдельную страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת ... מִיַּמִּים
  choice: Когда ... поступали с морей
  rationale: Оборот с инфинитивом задаёт время действия. Буквальное «выходили из морей» по-русски неестественно; «поступали с морей» сохраняет образ доставки тирских грузов морскими путями.
- source_word: עִזְבוֹנַיִךְ
  choice: твои грузы
  rationale: В плаче о Тире слово обозначает перевозимые торговые товары. «Грузы» естественно для морской торговли и позволяет отличить его от последующего מַעֲרָבַיִךְ.
- source_word: הִשְׂבַּעַתְּ
  choice: ты насыщала
  rationale: Порода hифиль глагола שבע означает «насыщать, удовлетворять». «Насыщала» сохраняет яркую метафору изобилия и не сводит смысл лишь к снабжению.
- source_word: עַמִּים רַבִּים
  choice: многие народы
  rationale: «Народы» прямо передаёт множественное עַמִּים и соответствует международному размаху торговли Тира.
- source_word: בְּרֹב הוֹנַיִךְ
  choice: обилием своего богатства
  rationale: Творительный падеж естественно передаёт инструментальное значение בְּ; «обилие богатства» сохраняет усилительное רֹב.
- source_word: וּמַעֲרָבַיִךְ
  choice: и товаров
  rationale: В Иезекииля 27 слово относится к предметам торговли или обмена. «Товары» ясно передаёт коммерческий смысл, а «грузы» ранее помогает избежать буквального повтора разных еврейских слов.
- source_word: הֶעֱשַׁרְתְּ
  choice: ты обогащала
  rationale: Hифиль от עשר означает «делать богатым»; несовершенный вид по-русски согласуется с повторяющимся торговым действием в контексте.
- source_word: מַלְכֵי אָרֶץ
  choice: царей земли
  rationale: В контексте широкой международной торговли «земли» естественно передаёт всеобщий масштаб, не исключая возможного значения «страны».
