  yaml_path: translation/ot/ezekiel/027/009.yaml
  text: The elders of Gebal and her skilled men were within you[a], repairing your damage[c][b]. All the ships of the sea and their sailors were within you to trade for your merchandise.
translation:
  language: ru
  text: Старейшины Гевала[a] и его умельцы были у тебя и устраняли твои повреждения[b]. Все морские корабли и их моряки были у тебя, чтобы торговать твоими товарами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Гевал — финикийский город, позднее известный под греческим названием Библ.
    reason: historical_identification
  - marker: b
    text: 'Или: «заделывали твои проломы». Еврейское слово может обозначать повреждения, трещины или разошедшиеся швы, требующие ремонта.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы обменивать твои товары».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: старейшины
  rationale: В данном общественно-политическом контексте слово обозначает признанных руководителей общины, а не просто пожилых мужчин.
- source_word: גְבַל
  choice: Гевал
  rationale: Сохранено древнееврейское название финикийского города; его позднейшее греческое название указано в сноске.
- source_word: חֲכָמֶיהָ
  choice: его умельцы
  rationale: В контексте ремонта судна речь идёт о людях, обладающих практическим мастерством; «умельцы» передаёт это без излишнего уточнения их ремесла.
- source_word: הָיוּ בָךְ
  choice: были у тебя
  rationale: Тир представлен одновременно городом и кораблём. Естественное русское выражение сохраняет обращение к олицетворённому Тиру, не делая пространственный образ неясным.
- source_word: מַחֲזִיקֵי בִּדְקֵךְ
  choice: устраняли твои повреждения
  rationale: Сочетание глагольной формы от חזק с בדק обозначает укрепление или ремонт повреждённых мест; перевод сохраняет широкий смысл и не сводит его только к пробоинам либо швам.
- source_word: כָּל אֳנִיּוֹת הַיָּם
  choice: все морские корабли
  rationale: Краткий и естественный русский эквивалент сохраняет всеохватность выражения и морской образ.
- source_word: מַלָּחֵיהֶם
  choice: их моряки
  rationale: Современное общеупотребительное обозначение людей, служащих на кораблях.
- source_word: לַעֲרֹב מַעֲרָבֵךְ
  choice: чтобы обменивать твои товары
  rationale: Однокоренные еврейские слова подчёркивают обмен товарами. «Обменивать» передаёт этот оттенок, а «товары» естественно обозначает предмет торговли.
