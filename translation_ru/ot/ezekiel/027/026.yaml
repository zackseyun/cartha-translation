lexical_decisions:
- source_word: בְּמַיִם רַבִּים
  choice: в большие воды
  rationale: Предлог ב при глаголе движения допускает направительное значение «в». Сочетание מַיִם רַבִּים здесь обозначает обширные, глубокие воды; формулировка сохраняет поэтический образ оригинала.
- source_word: הֱבִיאוּךְ
  choice: завели тебя
  rationale: Каузативная форма от בוא означает «привести, завести». В морском контексте «завели» естественно передаёт движение судна, направляемого гребцами.
- source_word: הַשָּׁטִים
  choice: твои гребцы
  rationale: Причастие в данном морском контексте обозначает людей, приводящих судно в движение вёслами. Притяжательное «твои» естественно выражает их отношение к олицетворённому кораблю-Тиру.
- source_word: רוּחַ הַקָּדִים
  choice: восточный ветер
  rationale: Определённое словосочетание обозначает известный своей разрушительной силой восточный ветер.
- source_word: שְׁבָרֵךְ
  choice: разбил тебя
  rationale: Глагол שׁבר передаёт насильственное разрушение. «Разбил» точно и естественно описывает гибель корабля, не усиливая значение до полного раздробления без необходимости.
- source_word: בְּלֵב יַמִּים
  choice: в сердце морей
  rationale: Буквальное сохранение метафоры לֵב передаёт поэтическую силу текста; выражение означает внутреннюю часть, самую середину морского пространства.
