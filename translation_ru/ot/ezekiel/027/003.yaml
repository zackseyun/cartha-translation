base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/003.yaml
  text: 'and say to Tyre[a], who dwells at the entrances of the sea, trader of the peoples to many coastlands: Thus says the Lord GOD: Tyre, you have said, ‘I am perfect in beauty.’'
translation:
  language: ru
  text: 'и скажи Тиру, обитающему у морских входов, ведущему торговлю с народами многих побережий[a]: Так говорит Владыка Яхве: «Тир, ты сказал: „Я — совершенство красоты“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многих островов». Еврейское слово может обозначать как острова, так и в более широком смысле приморские земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הישבתי
  choice: обитающему
  rationale: Причастие женского рода характеризует олицетворённый Тир; в русском согласование естественно следует за названием города мужского рода. «Обитающему» передаёт устойчивое местонахождение.
- source_word: מְבוֹאֹת יָם
  choice: у входов в море
  rationale: Сохраняется конкретный образ морских входов или подступов и стратегического положения Тира; более свободное «у морских путей» было бы толкованием.
- source_word: רֹכֶלֶת הָעַמִּים
  choice: торговцу среди народов
  rationale: Причастие обозначает торговую деятельность Тира. «Среди народов» естественнее по-русски, чем буквальное «торговцу народов», и не создаёт ложного смысла торговли людьми.
- source_word: אֶל אִיִּים רַבִּים
  choice: на многих побережьях
  rationale: אִיִּים обозначает острова либо более широко приморские земли; здесь выбран широкий географический смысл, а альтернативное чтение отмечено в сноске.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и избегает неестественного повтора «Господь Господь».
- source_word: כְּלִילַת יֹפִי
  choice: совершенство красоты
  rationale: Именная формулировка естественно передаёт притязание Тира на полноту и совершенство красоты, не ослабляя хвастливого тона.
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Текст прямо содержит личное имя יהוה. Его транслитерация сохраняет различие между титулом אֲדֹנָי и Божьим именем, не добавляя конфессионального толкования.
- issue: Характер заявления Тира כְּלִילַת יֹפִי
  choice: «Я — совершенство красоты»
  alternative: «Я совершенен красотой»
  rationale: Обе передачи возможны; именная формула сохраняет предельность самовосхваления и не превращает образное выражение в отвлечённое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис сохраняет обращение к олицетворённому городу, но грамматически согласован с русским названием «Тир» мужского рода.
