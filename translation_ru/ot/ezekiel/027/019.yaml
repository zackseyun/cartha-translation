  text: וְדָ֤ן וְ/יָוָן֙ מְ/אוּזָּ֔ל בְּ/עִזְבוֹנַ֖יִ/ךְ נָתָ֑נּוּ בַּרְזֶ֤ל עָשׁוֹת֙ קִדָּ֣ה וְ/קָנֶ֔ה בְּ/מַעֲרָבֵ֖/ךְ הָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/019.yaml
  text: Dan and Javan from Uzal traded with you[a]; they exchanged wrought iron, cassia[c][b], and cane for your wares.
translation:
  language: ru
  text: 'Дан[a] и Яван из Узала[b] торговали с тобой: кованое железо, кассию и благовонный тростник[c] они отдавали в обмен на твои товары.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Дан»; некоторые читают «Ведан» или иначе исправляют это имя, поскольку текст здесь труден.
    reason: textual_variant
  - marker: b
    text: Связь слов «Яван» и «Узал» в еврейском тексте неясна; возможно также иное членение или понимание этого выражения.
    reason: alternative_reading
  - marker: c
    text: 'Или: «каламус», «ароматический аир».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדָן
  choice: Дан
  rationale: Сохранено чтение масоретского текста как название народа или местности; возможное чтение «Ведан» вынесено в сноску.
- source_word: וְיָוָן
  choice: Яван
  rationale: В перечне торговых партнёров уместно традиционное библейское имя собственное, без истолковывающей замены на «Греция» или «ионийцы».
- source_word: מְאוּזָּל
  choice: из Узала
  rationale: Форма понята как топоним с предлогом «из»; это наиболее связно читается в контексте перечня торговых партнёров, хотя синтаксическая связь остаётся трудной.
- source_word: בְּעִזְבוֹנַיִךְ
  choice: торговали с тобой
  rationale: Существительное обозначает товар или предметы торговли; по-русски коммерческий смысл естественно передаётся глагольным оборотом.
- source_word: נָתָנּוּ
  choice: они отдавали в обмен
  rationale: Буквально «давали», но в торговом контексте речь идёт о передаче товаров при обмене.
- source_word: בַּרְזֶל עָשׁוֹת
  choice: кованое железо
  rationale: Сочетание указывает не на сырой металл, а на обработанное железо.
- source_word: קִדָּה
  choice: кассию
  rationale: Обычное отождествление слова — кассия, ценное ароматическое сырьё.
- source_word: וְקָנֶה
  choice: благовонный тростник
  rationale: В перечне торговых товаров имеется в виду ароматический тростник; перевод понятнее общего «тростник», а ботаническая идентификация уточнена в сноске.
- source_word: בְּמַעֲרָבֵךְ
  choice: в обмен на твои товары
  rationale: Слово относится к товарам или предметам торговли; оборот ясно передаёт коммерческую взаимность сделки.
