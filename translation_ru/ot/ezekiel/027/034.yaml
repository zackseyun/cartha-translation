  text: עֵ֛ת נִשְׁבֶּ֥רֶת מִ/יַּמִּ֖ים בְּ/מַֽעֲמַקֵּי מָ֑יִם מַעֲרָבֵ֥/ךְ וְ/כָל קְהָלֵ֖/ךְ בְּ/תוֹכֵ֥/ךְ נָפָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/034.yaml
  text: At the time you were broken by the seas in the depths of the waters[b][a], your merchandise and all your assembly in your midst fell.
translation:
  language: ru
  text: В то время, когда ты была сокрушена морями в глубинах вод[a], твои товары и всё твоё собрание[b], находившееся в тебе, пали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда ты была сокрушена морями в глубинах вод».'
    reason: Слово עֵת может быть передано либо именной конструкцией «в то время, когда», либо более кратким союзом «когда».
  - marker: b
    text: 'Под «собранием» могут подразумеваться все находившиеся в Тире: его жители, торговцы и мореходы.'
    reason: Собирательное קהל обозначает собравшуюся общность, но контекст не позволяет точно ограничить её состав.
lexical_decisions:
- source_word: עֵת
  choice: В то время, когда
  rationale: Сохраняет временное существительное «время», вводя придаточное естественным для современного русского языка способом.
- source_word: נִשְׁבֶּרֶת
  choice: ты была сокрушена
  rationale: Страдательная форма женского рода соответствует обращению к Тиру; «сокрушена» передаёт широкий смысл שׁבר и не сводит образ исключительно к кораблекрушению.
- source_word: מִיַּמִּים
  choice: морями
  rationale: Творительный падеж передаёт возможное значение действующей силы при страдательной конструкции и сохраняет множественное число еврейского слова.
- source_word: בְּמַעֲמַקֵּי מָיִם
  choice: в глубинах вод
  rationale: Близко воспроизводит конструкцию «в глубинах вод», сохраняя конкретный морской образ и поэтическую множественность.
- source_word: מַעֲרָבֵךְ
  choice: твои товары
  rationale: В контексте торгового Тира слово обозначает его товары или груз; «товары» ясно, широко и естественно по-русски.
- source_word: וְכָל קְהָלֵךְ
  choice: и всё твоё множество
  rationale: «Множество» сохраняет собирательный и широкий характер קהל, не ограничивая его только экипажем, торговцами либо жителями.
- source_word: בְּתוֹכֵךְ
  choice: находившееся внутри тебя
  rationale: Передаёт пространственное значение выражения и сохраняет двойной образ Тира как города и корабля.
- source_word: נָפָלוּ
  choice: пали
  rationale: Передаёт основное значение נפל и сохраняет возможность понимать событие как гибель или падение, не заменяя его более узким «утонули».
