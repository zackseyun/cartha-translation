lexical_decisions:
- source_word: לְקוֹל זַעֲקַת
  choice: От крика
  rationale: Сочетание буквально означает «от звука крика». Русское «от крика» естественно передаёт причинное значение предлога לְ и вопль бедствия, выраженный словом זַעֲקָה, без тяжеловесного повтора «от звука крика».
- source_word: חֹבְלָיִךְ
  choice: твоих моряков
  rationale: В морском контексте существительное обозначает людей, управляющих судном или работающих на нём; широкое «моряки» понятно современному читателю и не сужает значение до кормчих либо гребцов. Более узкий вариант отмечен в сноске.
- source_word: יִרְעֲשׁוּ
  choice: содрогнутся
  rationale: Глагол רעש передаёт сильное сотрясение или дрожь. «Содрогнутся» сохраняет яркий поэтический образ плача о Тире и естественно сочетается с землями.
- source_word: מִגְרֹשׁוֹת
  choice: окрестные земли
  rationale: מִגְרָשׁ обозначает открытые угодья вокруг поселения, а не современные жилые пригороды. «Окрестные земли» сохраняет пространственный смысл и подходит контексту Тира, не добавляя прямо отсутствующего в слове значения «побережье».
