  text: אֲרָ֥ם סֹחַרְתֵּ֖/ךְ מֵ/רֹ֣ב מַעֲשָׂ֑יִ/ךְ בְּ֠/נֹפֶךְ אַרְגָּמָ֨ן וְ/רִקְמָ֤ה וּ/בוּץ֙ וְ/רָאמֹ֣ת וְ/כַדְכֹּ֔ד נָתְנ֖וּ בְּ/עִזְבוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/016.yaml
  text: Aram traded with you because of your many products[a], giving turquoise, purple, embroidered cloth, fine linen, coral[c][b], and rubies for your wares.
translation:
  language: ru
  text: 'Арам торговал с тобой благодаря множеству твоих изделий: в обмен на твои товары тебе отдавали бирюзу[a], пурпур, вышитые ткани, тонкий лён, кораллы[b] и рубины[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «изумруды» или «карбункулы»; точное значение еврейского названия камня неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: Возможно, имеется в виду другой дорогой материал, например перламутр; значение еврейского слова неизвестно.
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «агаты», «гранаты» или другой драгоценный камень; точное значение еврейского слова неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено древнее географическое название без отождествления с современной Сирией; в контексте оно может собирательно обозначать страну и её торговцев.
- source_word: סֹחַרְתֵּךְ
  choice: торговал с тобой
  rationale: Естественно передаёт торговую деятельность и сохраняет обращение к Тиру в женском роде.
- source_word: מֵרֹב מַעֲשָׂיִךְ
  choice: благодаря множеству твоих изделий
  rationale: Буквально речь идёт об изобилии сделанного; в торговом контексте имеются в виду производимые Тиром изделия. «Благодаря» передаёт причинное значение מִן.
- source_word: נֹפֶךְ
  choice: бирюза
  rationale: Вероятное, но не бесспорное обозначение драгоценного или поделочного камня; неопределённость отмечена в сноске.
- source_word: אַרְגָּמָן
  choice: пурпур
  rationale: Термин обозначает дорогой пурпурный краситель или окрашенный им материал; обобщённое «пурпур» не устраняет эту смысловую широту.
- source_word: רִקְמָה
  choice: вышитые ткани
  rationale: В перечне предметов торговли речь, вероятнее всего, идёт о текстильных изделиях с вышивкой.
- source_word: בוּץ
  choice: тонкий лён
  rationale: Понятное современному читателю обозначение высококачественной льняной ткани.
- source_word: רָאמֹת
  choice: кораллы
  rationale: Редкое слово, вероятно обозначающее дорогой природный материал; точное значение неизвестно и отмечено в сноске.
- source_word: כַדְכֹּד
  choice: рубины
  rationale: Вероятное название драгоценного камня, точная идентификация которого остаётся спорной; это отражено в сноске.
- source_word: נָתְנוּ
  choice: тебе отдавали
  rationale: Безлично-неопределённая русская конструкция естественно передаёт форму множественного числа «они давали», не добавляя в основной текст отсутствующее существительное «купцы».
- source_word: בְּעִזְבוֹנָיִךְ
  choice: в обмен на твои товары
  rationale: Передаёт коммерческий смысл редкого существительного и значение обмена, выраженное предлогом בְּ.
