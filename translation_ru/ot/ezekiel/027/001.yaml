  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И пришло ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ); традиционно переводится как «Господь».
    reason: Уточнение формы оригинала и традиционного варианта передачи Божьего имени.
lexical_decisions:
- source_word: וַיְהִי
  choice: И пришло
  rationale: Последовательная форма глагола היה вводит очередное пророческое откровение. По-русски в этой устойчивой формуле естественно сказать «И пришло… слово», не воспроизводя буквально «и было».
- source_word: דְבַר
  choice: слово
  rationale: В сочетании דְבַר יְהוָה это стандартная пророческая формула. «Слово» сохраняет её смысл и библейское звучание, не сужая значение до более истолковывающего «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога, обозначенного тетраграмматоном יהוה; она сохраняет отличие имени от титула «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица указывает на направленность слова к пророку; «ко мне» — точная и естественная русская передача.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לֵאמֹר вводит следующую прямую речь. В современном русском эту функцию естественно и полно передаёт двоеточие.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя יהוה, а не титул אֲדֹנָי. Поэтому в основном тексте сохранено имя «Яхве»; традиционная замена «Господь» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемой пророческой формулы. Оборот «пришло ко мне слово» звучит естественнее буквального «было ко мне слово», а двоеточие без лишнего «говоря» ясно вводит речь следующего стиха.
