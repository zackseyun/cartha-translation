  text: וְֽ/יָרְד֞וּ מֵ/אָנִיּֽוֹתֵי/הֶ֗ם כֹּ֚ל תֹּפְשֵׂ֣י מָשׁ֔וֹט מַלָּחִ֕ים כֹּ֖ל חֹבְלֵ֣י הַ/יָּ֑ם אֶל הָ/אָ֖רֶץ יַעֲמֹֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/029.yaml
  text: And all who handle the oar will come down from their ships[a]; the sailors, all the mariners of the sea[b], will stand on the land.
translation:
  language: ru
  text: И сойдут со своих кораблей все, кто держит весло,[a] моряки, все мореплаватели,[b] встанут на суше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все гребцы». Буквально: «все держащие весло».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все мореходы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: И сойдут
  rationale: Qal от ירד продолжает пророческую сцену; будущее время естественно в контексте плача и передаёт движение с кораблей вниз, на сушу.
- source_word: מֵאָנִיּוֹתֵיהֶם
  choice: со своих кораблей
  rationale: מִן обозначает движение от/с чего-либо, а אֳנִיּוֹת — морские корабли; «со своих кораблей» естественно по-русски.
- source_word: כֹּל תֹּפְשֵׂי מָשׁוֹט
  choice: все, кто держит весло
  rationale: 'Сохраняется конкретный еврейский образ: תפשׂ — держать, браться за; מָשׁוֹט — весло. Более краткое «все гребцы» возможно, но менее буквально.'
- source_word: מַלָּחִים
  choice: моряки
  rationale: Современное и общепонятное обозначение людей, служащих на корабле.
- source_word: כֹּל חֹבְלֵי הַיָּם
  choice: все мореплаватели
  rationale: Выражение обозначает людей, занятых мореплаванием. «Мореплаватели» сохраняет морской смысл и не создаёт по-русски тяжеловесной тавтологии «моряки моря».
- source_word: אֶל הָאָרֶץ
  choice: на суше
  rationale: В морском контексте הָאָרֶץ противопоставлена кораблям и означает сушу; при глаголе «встанут» русская норма требует «на суше».
- source_word: יַעֲמֹדוּ
  choice: они встанут
  rationale: Передано основное значение עמד — «стоять, встать»; местоимение делает синтаксическую связь после перечисления ясной.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Конкретный образ весла сохранён, а морская терминология передана понятно и без архаизмов. Точка с запятой отражает переход от сходящих с кораблей к их положению на суше.
