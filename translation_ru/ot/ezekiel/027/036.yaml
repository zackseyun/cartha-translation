lexical_decisions:
- source_word: סֹחֲרִים
  choice: торговцы
  rationale: Причастие от סחר обозначает людей, занимающихся торговлей; «торговцы» естественно звучит по-русски и соответствует торговому контексту плача о Тире.
- source_word: בָּעַמִּים
  choice: среди народов
  rationale: Множественное число עַמִּים широко обозначает различные народы; перевод сохраняет международный охват, не сводя его к политическим государствам.
- source_word: שָׁרְקוּ עָלָיִךְ
  choice: свистят вслед тебе
  rationale: שׁרק может обозначать свист или шипение как выражение изумления либо презрения. Русское «свистят вслед тебе» естественно передаёт направленную на Тир насмешливо-презрительную реакцию.
- source_word: בַּלָּהוֹת
  choice: ужасом
  rationale: Существительное имеет форму множественного числа и может означать «ужасы» или собирательно нечто ужасающее; в русском предикативное единственное число звучит естественно, а альтернативная форма отмечена в сноске.
- source_word: הָיִית
  choice: стала
  rationale: Перфект описывает состояние, наступившее в результате суда; «стала» кратко и естественно передаёт этот результат.
- source_word: וְאֵינֵךְ עַד עוֹלָם
  choice: и исчезла навеки
  rationale: Отрицательная экзистенциальная конструкция с עַד עוֹלָם выражает окончательное прекращение существования Тира как изображённого города. «Исчезла навеки» сохраняет итоговый характер еврейского перфекта и не добавляет метафизических утверждений.
theological_decisions:
- issue: Смысл заключительной формулы пророческого суда
  choice: «и исчезла навеки» как окончательный итог гибели олицетворённого Тира
  alternative: «и не будет тебя вовеки» / «тебя больше нет навеки»
  rationale: Еврейское וְאֵינֵךְ עַד עוֹלָם выражает необратимый конец. Прошедшее время согласуется с пророческим изображением уже свершившейся катастрофы и женским олицетворением Тира, не превращая слова о городе в более широкое метафизическое утверждение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого плача. Женский род местоименного обращения подразумевает олицетворённый Тир. Формула «свистят вслед тебе» идиоматична, тогда как точная лексическая неоднозначность сохранена в сноске.
