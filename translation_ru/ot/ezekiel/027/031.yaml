  text: They will make themselves bald for you[a], and put on sackcloth, and they will weep over you with bitterness of soul, with bitter mourning.
translation:
  language: ru
  text: Они обреют себе головы в знак скорби о тебе, наденут одежды из мешковины и будут плакать о тебе с горечью в душе, горько причитая.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיחוּ אֵלַיִךְ קָרְחָה
  choice: обреют головы наголо в знак скорби о тебе
  rationale: Конструкция выражает совершение обряда облысения или бритья по случаю гибели Тира. Добавление «головы» естественно для русского языка, а «в знак скорби» ясно передаёт функцию действия в данном контексте.
- source_word: וְחָגְרוּ שַׂקִּים
  choice: наденут рубище
  rationale: Буквально речь идёт о том, чтобы опоясаться тканью из мешковины. «Наденут рубище» — понятное современному читателю обозначение траурной одежды, сохраняющее торжественный регистр.
- source_word: וּבָכוּ אֵלַיִךְ
  choice: будут плакать о тебе
  rationale: Сочетание глагола בכה с אֶל здесь обозначает плач по Тиру; русский предлог «о» естественно передаёт направленность скорби.
- source_word: בְּמַר נֶפֶשׁ
  choice: с горечью в душе
  rationale: Передаёт буквально выраженную внутреннюю горечь, сохраняя слово «душа» и не сводя образ к общему понятию печали.
- source_word: מִסְפֵּד מָר
  choice: с горькими причитаниями
  rationale: מִסְפֵּד обозначает траурный плач или причитание. Формулировка сохраняет усиление посредством повторения корня со значением горечи и остаётся естественной по-русски.
