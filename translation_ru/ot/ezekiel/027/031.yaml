revisions:
- from: Они обреют головы наголо в знак скорби о тебе, наденут рубище и будут плакать о тебе с горечью в душе, с горькими причитаниями.
  to: Они обреют себе головы в знак скорби о тебе, наденут одежды из мешковины и будут плакать о тебе с горечью в душе, горько причитая.
  rationale: Правка устраняет русскую тавтологию и уточняет материальный и ритуальный смысл שַׂקִּים. Сохранены обращённость плача к Тиру, повтор мотива горечи и образ внутренней горечи; добавление «в знак скорби» остаётся оправданным явным контекстом траурного обряда.
