review_pass:
  verdict: revise
  source_fidelity: Смысл и последовательность траурных действий переданы верно. Однако «рубище» означает скорее лохмотья/бедную одежду и не вполне точно передаёт שַׂקִּים — траурную одежду из грубой мешковины. «Обрeют головы наголо» избыточно по-русски; возвратное «себе» также лучше отражает значение действия над собой.
  naturalness: Текст в целом литературен, но «обреют головы наголо» звучит тяжеловесно и тавтологично. «Одежды из мешковины» — ясная современная формулировка; «горько причитая» естественно передаёт заключительное существительное «горестный плач/причитание» без неоправданного множественного числа.
  terminology: «Мешковина» точно обозначает материал, связанный с древним траурным обычаем, не прибегая к архаичному «вретище». «Горечь в душе» уместно сохраняет образ נֶפֶשׁ как внутреннего существа/души. Имён и специальных богословских терминов в стихе нет.
  issues:
  - severity: medium
    issue: «Наденут рубище»
    rationale: «Рубище» в современном русском прежде всего означает ветхую, рваную одежду, тогда как еврейское שַׂקִּים называет мешковину/траурное облачение из грубой ткани.
  - severity: low
    issue: «Обрeют головы наголо»
    rationale: Сочетание «обреют» и «наголо» семантически повторяется; «обреют себе головы» достаточно и точнее выражает действие, совершаемое над собой.
  - severity: low
    issue: «С горькими причитаниями»
    rationale: Мִסְפֵּד מָר стоит в единственном числе и означает горький траурный плач; деепричастный оборот естественно передаёт его связь с «будут плакать».
  revised_text: Они обреют себе головы в знак скорби о тебе, наденут одежды из мешковины и будут плакать о тебе с горечью в душе, горько причитая.
