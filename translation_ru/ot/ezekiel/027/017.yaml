base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/017.yaml
  text: Judah and the land of Israel—they were your merchants; they traded for your merchandise with wheat of Minnith[a], pannag, honey, oil, and balm.
translation:
  language: ru
  text: Иудея и земля Израиля были твоими торговцами; за твои товары они давали пшеницу из Миннита, паннаг[a], мёд, масло и бальзам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение слова «паннаг» неясно; среди предлагаемых толкований — лакомство, пряность или выпечка.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה וְאֶרֶץ יִשְׂרָאֵל
  choice: Иудея и земля Израиля
  rationale: Сохраняется явное различие в еврейском тексте между Иудеей и «землёй Израиля», без сокращения до «Иудея и Израиль».
- source_word: רֹכְלָיִךְ
  choice: твоими торговцами
  rationale: Слово обозначает людей, занимающихся торговлей; «торговцы» естественно вписывается в описание торговых связей Тира.
- source_word: בְּחִטֵּי מִנִּית
  choice: пшеницу из Миннита
  rationale: Предлог בְּ указывает на товар, использованный при обмене, а конструкция с Миннитом, вероятнее всего, обозначает происхождение пшеницы.
- source_word: פַנַּג
  choice: паннаг
  rationale: Это редкое слово с неустановленным значением; транслитерация не создаёт ложной определённости, а основные варианты значения вынесены в сноску.
- source_word: דְבַשׁ
  choice: мёд
  rationale: Передаёт обычное лексическое значение слова.
- source_word: שֶׁמֶן
  choice: масло
  rationale: Сохраняет общее значение исходного слова, не добавляя отсутствующего в тексте уточнения «оливковое».
- source_word: צֹרִי
  choice: бальзам
  rationale: Передаёт название ценного ароматического смолистого вещества понятным и традиционным русским словом.
- source_word: נָתְנוּ מַעֲרָבֵךְ
  choice: за твои товары они давали
  rationale: Формулировка сохраняет буквальный образ «давали» и ясно выражает обмен перечисленных продуктов на товары Тира.
