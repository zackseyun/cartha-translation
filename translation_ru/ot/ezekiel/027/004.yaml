lexical_decisions:
- source_word: בְּלֵב
  choice: в сердце
  rationale: Сохраняет буквальный и поэтически выразительный пространственный образ еврейского לֵב; по-русски сочетание «в сердце морей» естественно означает внутреннюю часть или средоточие.
- source_word: יַמִּים
  choice: морей
  rationale: Передаёт форму множественного числа и сохраняет широкую морскую образность описания Тира.
- source_word: גְּבוּלַיִךְ
  choice: твои пределы
  rationale: «Пределы» естественно передаёт границы или пространственный охват города; вариант не сужает значение до берегов.
- source_word: בֹּנַיִךְ
  choice: твои строители
  rationale: Прямо передаёт причастную форму от בנה и сохраняет двойной образ Тира как города и великолепного корабля, не уточняя его до «кораблестроителей».
- source_word: כָּלְלוּ
  choice: довели ... до совершенства
  rationale: Передаёт значение завершения и приведения к полноте, сохраняя более сильный оттенок, чем простое «завершили».
- source_word: יָפְיֵךְ
  choice: твою красоту
  rationale: Прямой и естественный эквивалент, сохраняющий поэтическое олицетворение Тира.
