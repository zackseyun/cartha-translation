base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/011.yaml
  text: The sons of Arvad[a], along with your army, were on your walls all around, and the Gammadites were in your towers. They hung their shields on your walls all around; they perfected your beauty.
translation:
  language: ru
  text: Сыны Арвада и твоё войско стояли на твоих стенах со всех сторон, а гаммадеи[a] — в твоих башнях. Они развешивали свои щиты на твоих стенах со всех сторон и тем довершали твою красоту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение еврейского слова גַמָּדִים неясно. Здесь оно передано как название народа — «гаммадеи»; возможно также понимание «воины».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אַרְוַד
  choice: Сыны Арвада
  rationale: Буквально «сыны Арвада»; это обычное древнееврейское обозначение жителей или мужчин из данной местности. Формулировка сохраняет поэтическую форму оригинала и понятна по контексту.
- source_word: חֵילֵךְ
  choice: твоё войско
  rationale: חַיִל здесь обозначает военную силу или войско, размещённое на городских стенах.
- source_word: חוֹמוֹתַיִךְ סָבִיב
  choice: на твоих стенах со всех сторон
  rationale: Передаёт размещение защитников по всему периметру стен и естественно звучит по-русски.
- source_word: גַמָּדִים
  choice: гаммадеи
  rationale: Значение слова неясно; вероятнее всего, это название народа или группы людей. Транслитерация не устраняет заложенную в оригинале неопределённость.
- source_word: בְּמִגְדְּלוֹתַיִךְ
  choice: в твоих башнях
  rationale: Предлог ב допускает значения «в» и «на»; для воинов, находящихся внутри оборонительных башен, по-русски естественно «в башнях».
- source_word: שִׁלְטֵיהֶם
  choice: свои щиты
  rationale: Существительное обозначает щиты, вероятно крупные; общее слово «щиты» ясно и не добавляет неуверенных подробностей.
- source_word: תִּלּוּ
  choice: развешивали
  rationale: Глагол означает «вешать, подвешивать». Несовершенный вид в русском передаёт описательное изображение щитов, размещённых по стенам.
- source_word: כָּלְלוּ
  choice: довершали
  rationale: Глагол выражает завершение или доведение до совершенства. «Довершали» сохраняет возвышенный поэтический смысл и связь с красотой Тира.
- source_word: יָפְיֵךְ
  choice: твою красоту
  rationale: Прямое соответствие слову, обозначающему красоту; метафорически относится к великолепию города.
