  text: וַ/יֹּאמֶר֮ אֵלַ/י֒ בֶּן אָדָ֕ם הָ/עֲצָמ֣וֹת הָ/אֵ֔לֶּה כָּל בֵּ֥ית יִשְׂרָאֵ֖ל הֵ֑מָּה הִנֵּ֣ה אֹמְרִ֗ים יָבְשׁ֧וּ עַצְמוֹתֵ֛י/נוּ וְ/אָבְדָ֥ה תִקְוָתֵ֖/נוּ נִגְזַ֥רְנוּ לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/011.yaml
  text: Then he said to me, “Son of man, these bones are the whole house of Israel. Look, they are saying, ‘Our bones have dried up, and our hope has perished; we are cut off.’”
translation:
  language: ru
  text: 'И сказал Он мне: «Сын человеческий, эти кости — весь дом Израиля. Вот, они говорят: „Высохли наши кости, погибла наша надежда; мы отсечены“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Сын человеческий
  rationale: Устоявшаяся и точная передача обращения к Иезекиилю; сохраняет буквальный образ еврейского выражения.
- source_word: כָּל־בֵּית יִשְׂרָאֵל
  choice: весь дом Израиля
  rationale: Сохраняет коллективный библейский образ, обозначающий народ Израиля в целом.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую функцию частицы и естественно вводит цитату.
- source_word: וְאָבְדָה תִקְוָתֵנוּ
  choice: погибла наша надежда
  rationale: Глагол אבד выражает утрату или гибель; формулировка сохраняет силу отчаяния без добавочного толкования.
- source_word: נִגְזַרְנוּ לָנוּ
  choice: мы отсечены
  rationale: Передаёт образ отделения или отсечения. Неоднозначное לָנוּ не развёрнуто толковательно, поскольку по-русски естественная краткая формула сохраняет общий смысл и напряжение оригинала.
theological_decisions:
- issue: Соотношение образа костей и Израиля
  choice: «Эти кости — весь дом Израиля»
  alternative: «Эти кости изображают весь дом Израиля»
  rationale: Оригинал использует прямую именную идентификацию; пояснительное «изображают» сделало бы метафорическое толкование более явным, чем в исходном тексте.
- issue: Смысл заключительного נִגְזַרְנוּ לָנוּ
  choice: «мы отсечены»
  alternative: «с нами покончено»
  rationale: Выбрана образная передача, сохраняющая семантику отсечения и не сводящая высказывание к окончательной гибели, что важно в контексте последующего восстановления.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; традиционные библейские выражения «Сын человеческий» и «дом Израиля» сохранены.
