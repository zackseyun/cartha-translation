  text: Then bring them near to each other for yourself as one stick[b][a], so that they may become one in your hand.
translation:
  language: ru
  text: И соедини их один с другим, чтобы у тебя получился один кусок дерева[a] и чтобы в твоей руке они стали единым целым.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как один кусок дерева». Еврейский предлог допускает оттенок как результата («в один кусок дерева»), так и состояния («как один кусок дерева»).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и они будут как единые в твоей руке». Необычная форма выражает, что два предмета становятся единым целым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַב
  choice: И сложи
  rationale: Императив от קרב требует приблизить два предмета друг к другу. В описании наглядного действия естественное русское «сложи» передаёт это сближение, не вводя прямо значение «соедини».
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к двум кускам дерева из предыдущего стиха.
- source_word: אֶחָד אֶל אֶחָד
  choice: один с другим
  rationale: Буквальное взаимное выражение «один к одному» по-русски естественно передаётся как «один с другим».
- source_word: לְךָ
  choice: у себя
  rationale: Дательный отношения подчёркивает личное участие Иезекииля; в сочетании с последующим «в руке» русское «у себя» передаёт это без тяжеловесного «для себя».
- source_word: לְעֵץ אֶחָד
  choice: одним куском дерева
  rationale: עֵץ здесь обозначает деревянный предмет, использованный в знамении. Предикативное выражение допускает понимание состояния или результата; формулировка связана с последующим «стали одним» и сохраняет конкретный образ.
- source_word: וְהָיוּ לַאֲחָדִים
  choice: чтобы они стали одним
  rationale: В контексте повеления конструкция выражает предполагаемый результат. Необычное еврейское множественное לַאֲחָדִים идиоматически сообщает единство двух предметов.
- source_word: בְיָדֶךָ
  choice: у себя в руке
  rationale: 'Сохраняется конкретная картина пророческого знамения: два деревянных предмета выглядят единым целым в руке Иезекииля.'
theological_decisions:
- issue: Характер единства, изображаемого двумя кусками дерева
  choice: 'Передать конкретное пророческое действие: два предмета становятся одним в руке Иезекииля.'
  alternative: Истолковать непосредственно в стихе как объединение народа или царств.
  rationale: Сам стих описывает наглядное действие, а его значение раскрывается далее. Перевод не предваряет контекст богословским или политическим толкованием.
translation_notes:
  register: Современный литературный русский с конкретной, наглядной образностью. «Кусок дерева» точнее нейтрального «палка» отражает диапазон עֵץ и не создаёт лишнего представления о форме предмета; синтаксис сделан естественным, при этом неоднозначность לְעֵץ אֶחָד отмечена в сноске.
