id: EZK.37.1
reference: Ezekiel 37:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הָיְתָ֣ה עָלַ/י֮ יַד יְהוָה֒ וַ/יּוֹצִאֵ֤/נִי בְ/ר֨וּחַ֙ יְהוָ֔ה וַ/יְנִיחֵ֖/נִי בְּ/ת֣וֹךְ הַ/בִּקְעָ֑ה וְ/הִ֖יא מְלֵאָ֥ה עֲצָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/001.yaml
  text: The hand of Yahweh was upon me[a], and he brought me out by the Spirit of Yahweh and set me down in the middle of the valley[b]; it was full of bones.
translation:
  language: ru
  text: Рука Яхве была на мне, и Он вывел меня Духом Яхве[a] и поставил посреди долины[b]; она была полна костей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Духе Яхве». Еврейское выражение может указывать либо на средство действия («Духом»), либо на сферу или состояние («в Духе»).'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «долина», может также означать «равнина» или «широкая долина».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохранён конкретный образ устойчивого пророческого выражения, обозначающего властное воздействие Яхве на пророка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וַיּוֹצִאֵנִי
  choice: Он вывел меня
  rationale: Порода хифиль глагола יצא имеет каузативное значение «вывести»; русский вариант краток и естественен.
- source_word: בְּרוּחַ יְהוָה
  choice: Духом Яхве
  rationale: В контексте пророческого перенесения רוּחַ вероятнее означает «Дух»; творительный падеж естественно выражает средство или действующую силу, при этом возможное значение сферы действия отмечено в сноске.
- source_word: וַיְנִיחֵנִי
  choice: и поставил
  rationale: Передаёт каузативное действие — пророк был помещён в определённое место — без неестественного буквального «дал мне покой».
- source_word: בְּתוֹךְ הַבִּקְעָה
  choice: посреди долины
  rationale: בִּקְעָה обозначает долину или широкую равнину; «посреди долины» естественно и сохраняет пространственный образ.
- source_word: מְלֵאָה עֲצָמוֹת
  choice: была полна костей
  rationale: Прямая и лаконичная передача резкого зрительного образа еврейского текста.
theological_decisions:
- issue: Значение רוּחַ при пророческом перенесении
  choice: Дух Яхве
  alternative: ветер Яхве
  rationale: Контекст властного божественного действия и пророческого переживания поддерживает личностно-теологическое значение «Дух», хотя широкая семантика רוּחַ допускает значения «ветер» и «дыхание».
- issue: Значение предлога בְּ в בְּרוּחַ יְהוָה
  choice: посредством Духа — «Духом Яхве»
  alternative: в состоянии или сфере Духа — «в Духе Яхве»
  rationale: Инструментальное понимание хорошо соответствует последовательности действий, но грамматика допускает локативно-сферическое понимание, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Сохранены конкретный образ «руки» и личное имя Яхве; синтаксис сделан ясным и естественным без устранения смысловой неоднозначности.
