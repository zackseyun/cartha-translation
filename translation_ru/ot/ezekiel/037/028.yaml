  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ הַ/גּוֹיִ֔ם כִּ֚י אֲנִ֣י יְהוָ֔ה מְקַדֵּ֖שׁ אֶת יִשְׂרָאֵ֑ל בִּ/הְי֧וֹת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/028.yaml
  text: Then the nations will know that I am Yahweh who sanctifies Israel[c][b][a], when my sanctuary is in their midst forever.
translation:
  language: ru
  text: Тогда[a] народы узнают, что Я — Яхве, освящающий Израиль[b], когда Моё святилище будет посреди них[c] вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И народы узнают». Еврейский союз может иметь простое соединительное значение «и», хотя здесь, вероятно, выражает следствие предшествующих обетований о восстановлении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «делающий Израиль святым».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «среди них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Тогда … узнают
  rationale: Перфект с союзом וְ в пророческом контексте выражает будущий результат предшествующих обетований. «Тогда» естественно передаёт эту следственную связь, не скрывая возможности простого соединительного значения.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: В Иезекииле множественное גּוֹיִם обычно обозначает народы вне Израиля; «народы» — точный и нейтральный современный эквивалент.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: Сохраняется характерная для Иезекииля формула узнавания и личное имя יהוה, переданное транслитерацией «Яхве».
- source_word: מְקַדֵּשׁ
  choice: освящающий
  rationale: Причастие описывает постоянное, характерное действие Яхве по отношению к Израилю. «Освящающий» сохраняет связь с темой святости и со словом «святилище».
- source_word: בִּהְיוֹת
  choice: когда … будет
  rationale: Инфинитивная конструкция с בְּ обозначает временное или сопутствующее обстоятельство. Будущее «будет» естественно согласуется с пророческим контекстом.
- source_word: מִקְדָּשִׁי
  choice: Моё святилище
  rationale: מִקְדָּשׁ означает святое место или святилище; это шире, чем «храм», и не сужает образ до одного здания.
- source_word: בְּתוֹכָם
  choice: посреди них
  rationale: Передаёт пространственное и общинное присутствие Бога внутри Своего народа, сохраняя библейское звучание без неестественной буквальности.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: В контексте окончательного восстановления слово обозначает непрекращающуюся длительность; «вовеки» точно и достойно передаёт этот смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное заветное имя, а не титул. Транслитерация «Яхве» сохраняет это различие, не подменяя имя толкованием.
- issue: Смысл מְקַדֵּשׁ применительно к Израилю
  choice: освящающий Израиль
  alternative: делающий Израиль святым; посвящающий Израиль
  rationale: «Освящающий» сохраняет как идею наделения святостью и отделения для Бога, так и словесную связь со святилищем; перевод не ограничивает смысл только ритуальным посвящением.
- issue: Связь пребывания святилища с узнаванием Яхве народами
  choice: когда Моё святилище будет посреди них
  alternative: поскольку Моё святилище будет посреди них
  rationale: Конструкция בִּהְיוֹת допускает обстоятельственный оттенок, но прямо не требует причинного толкования. «Когда» сохраняет временную связь и не устраняет возможный смысл основания или свидетельства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «Яхве», «святилище», «освящающий» и «вовеки» сохраняют ключевые смысловые связи исходного текста; синтаксис остаётся ясным для широкого читателя. Местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы согласно принятой русской библейской издательской традиции.
