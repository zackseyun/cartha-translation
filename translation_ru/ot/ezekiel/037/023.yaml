  text: וְ/לֹ֧א יִֽטַמְּא֣וּ ע֗וֹד בְּ/גִלּֽוּלֵי/הֶם֙ וּ/בְ/שִׁקּ֣וּצֵי/הֶ֔ם וּ/בְ/כֹ֖ל פִּשְׁעֵי/הֶ֑ם וְ/הוֹשַׁעְתִּ֣י אֹתָ֗/ם מִ/כֹּ֤ל מוֹשְׁבֹֽתֵי/הֶם֙ אֲשֶׁ֣ר חָטְא֣וּ בָ/הֶ֔ם וְ/טִהַרְתִּ֤י אוֹתָ/ם֙ וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/023.yaml
  text: They will no longer defile themselves with their idols[a], with their detestable things, or with any of their transgressions. I will save them from all their dwelling places in which they sinned, and I will cleanse them. Then they will be my people[b], and I will be their God.
translation:
  language: ru
  text: Они больше не будут осквернять себя ни своими идолами[a], ни своими мерзостями, ни какими бы то ни было своими преступлениями. Я спасу их из всех мест их обитания, где они грешили[b], и очищу их. Они будут Моим народом, а Я буду их Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «идолы», имеет здесь резко презрительную окраску.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из всех их поселений, где они грешили». Трудное еврейское выражение некоторые понимают шире — как спасение от всех мест или обстоятельств, связанных с их грехом; другие понимают его как избавление от их отступничеств, которыми они грешили.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַמְּאוּ
  choice: будут осквернять себя
  rationale: Возвратное значение формы передаёт сознательное самоосквернение и сохраняет нравственно-культовый оттенок.
- source_word: גִּלּוּלֵיהֶם
  choice: своими идолами
  rationale: В основном тексте выбрано ясное современное обозначение ложных богов; резко презрительная окраска еврейского слова отмечена в сноске.
- source_word: שִׁקּוּצֵיהֶם
  choice: своими мерзостями
  rationale: Слово обозначает отвратительные предметы или обычаи, особенно связанные с идолопоклонством; «мерзости» сохраняет сильную отрицательную окраску.
- source_word: פִּשְׁעֵיהֶם
  choice: своими преступлениями
  rationale: Передаёт нарушение и бунт против законной власти, не ограничивая смысл только отдельными проступками.
- source_word: וְהוֹשַׁעְתִּי
  choice: Я спасу их
  rationale: Точно передаёт действие Бога по избавлению и сохраняет богословскую весомость глагола.
- source_word: מוֹשְׁבֹתֵיהֶם
  choice: мест их обитания
  rationale: Формально передаёт масоретский текст и сохраняет его пространственный образ, не заменяя его интерпретационным «отступничествами».
- source_word: אֲשֶׁר חָטְאוּ בָהֶם
  choice: где они грешили
  rationale: Естественно связывает относительное предложение с местами обитания, одновременно оставляя трудность выражения для сноски.
- source_word: וְטִהַרְתִּי
  choice: очищу их
  rationale: Сохраняет как культовый, так и нравственный смысл очищения.
- source_word: וְהָיוּ לִי לְעָם
  choice: Они будут Моим народом
  rationale: Естественная русская форма традиционной формулы завета.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: а Я буду их Богом
  rationale: Точно и естественно передаёт вторую часть формулы завета.
theological_decisions:
- issue: Связь спасения с грехом и местами обитания
  choice: Бог спасает Израиль из мест его обитания, где народ грешил, затем очищает его и восстанавливает отношения завета.
  alternative: Фраза может пониматься как избавление от отступничеств или, шире, от всех мест и обстоятельств, связанных с грехом.
  rationale: Масоретский текст содержит слово «места обитания», хотя выражение трудно в данном контексте. Основной текст сохраняет его образ и последовательность Божьих действий — спасение, очищение и восстановление завета — не навязывая более узкого догматического толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но общепонятным библейским регистром. Местоимения, относящиеся к Богу, оформлены с прописной буквы. Синтаксис сохраняет последовательность еврейского текста без излишней буквальности.
