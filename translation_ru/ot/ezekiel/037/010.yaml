base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/010.yaml
  text: So I prophesied as he commanded me[a], and the breath entered into them, and they lived and stood on their feet, an exceedingly great army.
translation:
  language: ru
  text: И я пророчествовал, как Он повелел мне, и вошло в них дыхание[a]. Они ожили и встали на ноги — великое, чрезвычайно великое войско.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух». Еврейское слово רוּחַ может означать «дыхание», «ветер» или «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנַּבֵּאתִי
  choice: я пророчествовал
  rationale: Возвратная порода глагола נבא здесь обозначает исполнение Иезекиилем пророческого повеления; это точный и привычный русский эквивалент.
- source_word: כַּאֲשֶׁר צִוָּנִי
  choice: как Он повелел мне
  rationale: Сохраняет сравнительную конструкцию и не добавляет имени говорящего, оставленного в еврейском тексте подразумеваемым. Прописная буква указывает на Бога согласно норме русского библейского стиля.
- source_word: וַתָּבוֹא בָהֶם
  choice: вошло в них
  rationale: Глагол בוא с предлогом ב передаёт вхождение внутрь; русская конструкция естественна и сохраняет образ движения.
- source_word: הָרוּחַ
  choice: дыхание
  rationale: В непосредственном контексте это животворящее дыхание, вошедшее в мёртвых, однако многозначность «дыхание / ветер / дух» сохранена в сноске.
- source_word: וַיִּחְיוּ
  choice: они ожили
  rationale: «Ожили» естественно передаёт переход от смерти к жизни, выраженный формой глагола חיה в данном повествовании.
- source_word: וַיַּעַמְדוּ עַל רַגְלֵיהֶם
  choice: встали на ноги
  rationale: Это естественный современный русский эквивалент еврейского выражения; он сохраняет конкретный и зримый образ.
- source_word: חַיִל
  choice: войско
  rationale: В контексте выстроившихся оживших людей חַיִל обозначает организованную военную силу; «войско» звучит естественнее и величественнее, чем «армия».
- source_word: גָּדוֹל מְאֹד מְאֹד
  choice: великое, чрезвычайно многочисленное
  rationale: Повтор מְאֹד выражает предельное усиление. Сочетание передаёт и величину, и подразумеваемую многочисленность войска, не прибегая к неестественному «очень, очень великое».
theological_decisions:
- issue: Многозначность רוּחַ в видении долины костей
  choice: дыхание
  alternative: дух; ветер
  rationale: Непосредственная функция רוּחַ здесь — оживить тела, поэтому в основном тексте выбрано «дыхание». Сноска сохраняет намеренный резонанс со значениями «дух» и «ветер», не разрешая богословскую и литературную многозначность однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; тире подчёркивает итоговую картину войска. Местоимение «Он» оформлено по принятой русской библейской норме.
