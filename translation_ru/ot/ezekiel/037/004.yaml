base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/004.yaml
  text: Then he said to me[a], “Prophesy over these bones, and say to them, ‘Dry bones, hear the word of Yahweh.’”
translation:
  language: ru
  text: 'И сказал Он мне: «Пророчествуй над этими костями и скажи им: „Сухие кости! Слушайте слово Яхве[a]!“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (יהוה); традиционно переводится «Господь».'
    reason: Уточнение формы Божьего имени и указание традиционного варианта перевода.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И сказал Он мне
  rationale: Последовательная форма с waw продолжает повествование; русское «И сказал» естественно сохраняет связь с предыдущим контекстом. Заглавная буква в местоимении указывает на Бога как говорящего, что ясно из контекста.
- source_word: הִנָּבֵא
  choice: Пророчествуй
  rationale: Императив породы нифаль от נבא обозначает произнесение пророческого слова; «пророчествуй» — точный и традиционно понятный русский эквивалент.
- source_word: עַל הָעֲצָמוֹת הָאֵלֶּה
  choice: над этими костями
  rationale: Предлог עַל допускает значения «о», «против» и «над». В видении пророк обращается к лежащим перед ним костям; «над» сохраняет пространственный образ и не придаёт речи оттенка осуждения.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: и скажи им
  rationale: Прямо передаёт обычное значение אמר и множественное местоимение, относящееся к костям.
- source_word: הָעֲצָמוֹת הַיְבֵשׁוֹת
  choice: Сухие кости!
  rationale: Определённая именная группа употреблена как обращение. Восклицательный знак естественно обозначает звательный характер без добавления отсутствующего в еврейском тексте междометия «о».
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Императив множественного числа שמע требует от адресатов воспринять провозглашаемое слово. В современном русском повелительное «слушайте» в прямом обращении звучит естественнее, чем буквальное «услышьте», сохраняя силу приказа.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: דָּבָר в пророческой формуле передано как «слово», а тетраграмматон — транслитерацией «Яхве», чтобы сохранить личное заветное имя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо содержит тетраграмматон. «Яхве» передаёт личное имя, не заменяя его титулом; сноска сообщает читателю еврейскую форму и традиционный вариант.
- issue: Обращение к мёртвым костям
  choice: 'Сохранено как прямое повеление: «Слушайте слово Яхве»'
  alternative: Ослабить как риторическое обращение или передать «выслушайте весть»
  rationale: Текст намеренно изображает пророческое слово, обращённое к безжизненным костям. Перевод не объясняет заранее, как это возможно, и сохраняет богословское напряжение видения.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис краток и повелителен; сохранены повтор слова «кости», прямое обращение и образ речи, произносимой «над» ними.
