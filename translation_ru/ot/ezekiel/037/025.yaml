  text: וְ/יָשְׁב֣וּ עַל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָתַ֨תִּי֙ לְ/עַבְדִּ֣/י לְ/יַֽעֲקֹ֔ב אֲשֶׁ֥ר יָֽשְׁבוּ בָ֖/הּ אֲבֽוֹתֵי/כֶ֑ם וְ/יָשְׁב֣וּ עָלֶ֡י/הָ הֵ֠מָּה וּ/בְנֵי/הֶ֞ם וּ/בְנֵ֤י בְנֵי/הֶם֙ עַד עוֹלָ֔ם וְ/דָוִ֣ד עַבְדִּ֔/י נָשִׂ֥יא לָ/הֶ֖ם לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/025.yaml
  text: They will dwell in the land that I gave to my servant Jacob[a], where your fathers dwelt; and they will dwell on it, they and their sons and their sons' sons, forever[c][b]. And David my servant will be prince for them forever.
translation:
  language: ru
  text: Они будут жить на земле, которую Я дал Моему слуге Иакову, где жили ваши отцы[a]; и будут жить на ней — они, их сыновья и сыновья их сыновей — вовеки. А Давид[b], слуга Мой, будет их князем[c] вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши предки». В еврейском тексте буквально: «ваши отцы».'
    reason: lexical_alternative
  - marker: b
    text: «Давид» может обозначать обещанного правителя из рода Давида; текст не уточняет, имеется ли в виду возвращённый к жизни исторический Давид или будущий Давидов правитель.
    reason: alternative_reading
  - marker: c
    text: 'Или: «правителем» или «вождём». Еврейский титул означает «князь», а не «царь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ עַל הָאָרֶץ
  choice: будут жить на земле
  rationale: Глагол ישׁב обозначает проживание или поселение, а сочетание с עַל הָאָרֶץ естественно передаётся по-русски как «жить на земле»; повтор глагола сохранён.
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: которую Я дал Моему слуге Иакову
  rationale: Перфект נתתי обозначает совершённое дарование земли, а два оборота с ל передают адресата и его поясняющее имя.
- source_word: אֲשֶׁר יָשְׁבוּ בָהּ אֲבוֹתֵיכֶם
  choice: где жили ваши отцы
  rationale: «Где» естественно вводит определительное придаточное о земле; «отцы» формально сохраняет אבותיכם, не исключая более широкого значения «предки».
- source_word: הֵמָּה וּבְנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: они, их сыновья и сыновья их сыновей
  rationale: Сохранена явная цепочка поколений и буквальное «сыновья сыновей», а не сглаженное «потомки» или «внуки».
- source_word: עַד עוֹלָם / לְעוֹלָם
  choice: вовеки
  rationale: Обе формулы выражают непрекращающуюся длительность; единообразное «вовеки» сохраняет повтор и придаёт тексту достойное, но понятное звучание.
- source_word: וְדָוִד עַבְדִּי
  choice: И слуга Мой Давид
  rationale: Передано без истолковывающего дополнения; русский порядок слов сохраняет выделение обозначения «Мой слуга» и имени Давид.
- source_word: נָשִׂיא לָהֶם
  choice: будет их князем
  rationale: «Князь» сохраняет отличие נשיא от «царя»; русская именная конструкция естественно выражает отношение правителя к народу, не усиливая титул до царского.
theological_decisions:
- issue: Кого обозначает «Давид»
  choice: В основном тексте оставлено имя «Давид» без поясняющей подстановки.
  alternative: Восстановленный исторический Давид; будущий правитель из рода Давида; Мессия как Давидов царь.
  rationale: Еврейский текст прямо называет Давида и не уточняет способ исполнения обещания; перевод не должен устранять эту богословскую многозначность.
- issue: Значение אֲבוֹתֵיכֶם
  choice: ваши отцы
  alternative: ваши предки
  rationale: Формулировка сохраняет грамматическую и лексическую форму источника, тогда как возможный широкий смысл указан в сноске.
- issue: Титул נָשִׂיא
  choice: князь
  alternative: вождь; правитель
  rationale: «Князь» позволяет сохранить особый титул Иезекииля и не заменяет его более сильным словом «царь».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повторы оригинала сохранены там, где они подчёркивают землю, поколения и вечность обещания. Местоимение Бога «Я» и притяжательное «Мой» написаны с прописной буквы согласно распространённой русской библейской традиции.
