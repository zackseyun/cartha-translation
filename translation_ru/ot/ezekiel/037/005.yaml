  yaml_path: translation/ot/ezekiel/037/005.yaml
  text: 'Thus says the Lord GOD to these bones: Behold[a], I am bringing breath into you, and you shall live.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве этим костям: «Вот, Я вложу в вас дыхание[a], и вы оживёте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово רוּחַ может также означать «дух» или «ветер». Здесь образу оживающих костей лучше всего соответствует «дыхание», но в этой главе значимы все оттенки слова.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула; настоящее время естественно передаёт перформативный смысл еврейского перфекта אָמַר.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: «Владыка» передаёт אֲדֹנָי, а «ГОСПОДЬ» — традиционное заместительное написание имени יהוה; сочетание сохраняет различие двух элементов титула и избегает неестественного «Господь ГОСПОДЬ».
- source_word: לָעֲצָמוֹת הָאֵלֶּה
  choice: этим костям
  rationale: Предлог ל־ обозначает адресата речи; русский дательный падеж передаёт это непосредственно.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет функцию привлечения внимания и торжественность объявления, оставаясь естественным для современного русского языка.
- source_word: אֲנִי מֵבִיא בָכֶם
  choice: Я введу в вас
  rationale: Причастная конструкция с הִנֵּה выражает близкое и уверенное действие. «Введу в вас» естественно описывает направленное внутрь дарование дыхания; местоимение «Я» сохраняет эмфатически выраженное אֲנִי.
- source_word: רוּחַ
  choice: дыхание
  rationale: В непосредственном образе безжизненных костей значение «дыхание» яснее всего выражает оживление, тогда как возможные значения «дух» и «ветер» сохраняются в примечании.
- source_word: וִחְיִיתֶם
  choice: и вы оживёте
  rationale: Форма обозначает будущий результат Божьего действия; «оживёте» в данном контексте точнее и естественнее, чем буквальное «будете жить».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  alternative: Владыка Яхве
  rationale: Основной текст следует узнаваемой русской библейской традиции передачи тетраграмматона словом «ГОСПОДЬ», а «Владыка» ясно отличает אֲדֹנָי. Вариант с «Яхве» фонетически прямее, но менее привычен для широкой русскоязычной аудитории.
- issue: Многозначность רוּחַ
  choice: дыхание
  alternative: дух; ветер
  rationale: Образ оживления костей непосредственно требует дыхания, однако в развитии видения слово перекликается также с духом и ветром; эта богословски значимая многозначность не устраняется, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Кавычки обозначают прямую божественную речь; прописное «ГОСПОДЬ» традиционно указывает на тетраграмматон.
