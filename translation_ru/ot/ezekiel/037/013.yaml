base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/013.yaml
  text: Then you will know that I am Yahweh[a], when I open your graves and bring you up from your graves[b], O my people.
translation:
  language: ru
  text: Тогда вы узнаете, что Я — Яхве[a], когда Я открою ваши могилы и подниму вас из ваших могил[b], народ Мой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Я — Господь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выведу вас из ваших могил». Древнееврейский глагол буквально означает «поднять» или «вывести наверх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: Форма с prefixed waw в пророческом контексте выражает будущий результат; «тогда» естественно передаёт следственную связь с обещанным действием Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: בְּפִתְחִי
  choice: когда Я открою
  rationale: Предлог ב с инфинитивом и суффиксом здесь имеет временное значение; личное местоимение добавлено ради ясного и естественного русского синтаксиса.
- source_word: קִבְרוֹתֵיכֶם
  choice: ваши могилы
  rationale: קבר обозначает могилу или место погребения; «могилы» прямо и естественно сохраняет конкретный образ текста.
- source_word: וּבְהַעֲלוֹתִי
  choice: и подниму вас
  rationale: Каузативная форма глагола עלה означает «заставить подняться, вывести наверх». «Подниму вас» сохраняет направленность движения вверх и не устраняет присущую контексту связь с образом воскресения.
- source_word: מִקִּבְרוֹתֵיכֶם
  choice: из ваших могил
  rationale: Предлог מן указывает на исходную точку; «из» наиболее естественно передаёт выход из могил.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Обращение сохраняет принадлежность народа Богу и заветный оттенок; постпозиция местоимения придаёт фразе достоинство без чрезмерной архаизации.
theological_decisions:
- issue: Следует ли истолковать открытие могил исключительно как национальное восстановление или исключительно как телесное воскресение
  choice: Сохранить конкретные образы открытия могил и поднятия из них без поясняющего сужения
  alternative: Передать образ метафорически как возвращение из изгнания либо явно истолковать его как телесное воскресение
  rationale: Древнееврейский текст использует язык, напоминающий воскресение, внутри видения о восстановлении Израиля. Прямая передача образов сохраняет эту богословскую напряжённость и не навязывает единственного уровня толкования.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной интонацией. Повтор «ваши могилы… из ваших могил» сохранён как значимый параллелизм оригинала; обращение «народ Мой» передаёт непосредственность и заветный характер речи.
