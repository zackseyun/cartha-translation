  language: ru
  text: И дощечки, на которых ты напишешь, будут в твоей руке у них на глазах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куски дерева». Еврейское слово имеет более широкое значение и может обозначать дерево или древесину, но здесь речь идёт о деревянных предметах, которые Иезекииль держит и надписывает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: И … будут
  rationale: Форма совершенного вида с союзом в контексте пророческого повеления описывает ожидаемый результат; будущее время естественно передаёт этот смысл по-русски.
- source_word: הָעֵצִים
  choice: дощечки
  rationale: В данном знаковом действии речь идёт о деревянных предметах, на которых можно написать и которые Иезекииль держит в руке. «Дощечки» естественнее в русском контексте, чем буквальное и неясное «деревья» или общее «дерево».
- source_word: אֲשֶׁר תִּכְתֹּב עֲלֵיהֶם
  choice: на которых ты напишешь
  rationale: Сохраняется относительное придаточное и значение предлога עַל; будущее время согласуется с последовательностью данного пророку повеления.
- source_word: בְּיָדְךָ
  choice: в твоей руке
  rationale: Сохранено единственное число и конкретный смысл физического удерживания предметов, а не значение действующего лица.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Современный русский идиом ясно передаёт видимое, публичное совершение действия и сохраняет образ глаз.
