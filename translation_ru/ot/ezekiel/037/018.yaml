lexical_decisions:
- source_word: וְכַאֲשֶׁר
  choice: И когда
  rationale: Сохраняет связь с предшествующим повествованием и временное значение оборота.
- source_word: יֹאמְרוּ אֵלֶיךָ
  choice: скажут тебе
  rationale: Прямо передаёт обычное значение אָמַר и естественно вводит цитату.
- source_word: בְּנֵי עַמְּךָ
  choice: люди из твоего народа
  rationale: В данном устойчивом обозначении речь идёт о представителях народа пророка; современный русский оборот передаёт смысл естественнее, чем буквальное «сыны твоего народа».
- source_word: לֵאמֹר
  choice: передано двоеточием и прямой речью
  rationale: Инфинитив служит формулой введения речи и не требует отдельного слова «говоря» в современном русском.
- source_word: הֲלוֹא תַגִּיד לָנוּ
  choice: Не объяснишь ли ты нам
  rationale: Отрицательная вопросительная форма сохраняет ожидающий утвердительного ответа оттенок הֲלוֹא; «объяснишь» естественно передаёт Hiphil נגד в контексте просьбы раскрыть значение символического действия.
- source_word: מָה אֵלֶּה לָּךְ
  choice: что это у тебя
  rationale: 'Оборот близок к буквальному строению еврейской фразы и по-русски сохраняет её контекстуальную открытость: спрашивается о значении предметов или действия для пророка.'
