base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/019.yaml
  text: 'tell them[a], ‘Thus says the Lord GOD: Behold, I am taking the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel associated with him, and I will place them with it, with the stick of Judah, and make them one stick[b], and they will be one in my hand.’'
translation:
  language: ru
  text: 'Скажи им: «Так говорит Господь Яхве: вот, Я беру кусок дерева Иосифа, который в руке Ефрема, и колена Израиля, связанные с ним[a]. Я приложу их к нему, к куску дерева Иуды[b], и сделаю их одним куском дерева; и они будут одним в Моей руке».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «колена Израиля, его союзники» или «колена Израиля, присоединённые к нему». Вероятнее всего, имеются в виду колена, связанные с Иосифом, представленным Ефремом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я положу их на него, кусок дерева Иуды». Еврейская конструкция допускает разные способы соотнести местоимения с двумя кусками дерева, но ясно изображает их соединение в один.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֲלֵהֶם
  choice: Скажи им
  rationale: Императив сохраняет прямую силу Божьего повеления и естественно вводит пророческую речь по-русски.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка Яхве
  rationale: Сохранена традиционная пророческая формула; אֲדֹנָי передано как «Владыка», а личное имя יהוה — как «Яхве», без смешения титула и имени.
- source_word: הִנֵּה אֲנִי לֹקֵחַ
  choice: вот, Я беру
  rationale: «Вот» передаёт торжественный указатель הִנֵּה, а настоящее время сохраняет наглядную, непосредственно разворачивающуюся силу причастия לֹקֵחַ.
- source_word: עֵץ
  choice: кусок дерева
  rationale: עֵץ здесь обозначает деревянный предмет символического действия. «Кусок дерева» не уточняет его форму как жезл, дощечку или палку сверх того, что сообщает еврейский текст.
- source_word: אֲשֶׁר בְּיַד אֶפְרַיִם
  choice: который в руке Ефрема
  rationale: 'Сохранён буквальный образ руки, важный для смыслового обрамления стиха: вначале дерево находится в руке Ефрема, а в конце объединённое целое — в руке Бога.'
- source_word: וְשִׁבְטֵי יִשְׂרָאֵל חברו
  choice: и колена Израиля, связанные с ним
  rationale: Форма חברו соотносит остальные колена с Иосифом/Ефремом как присоединённые или связанные с ним; формулировка сохраняет политико-племенной смысл без излишней конкретизации.
- source_word: וְנָתַתִּי אוֹתָם עָלָיו אֶת עֵץ יְהוּדָה
  choice: Я приложу их к нему — к куску дерева Иуды
  rationale: Глагол נתן и предлог על переданы в соответствии с наглядным действием соединения. Тире помогает отразить трудную конструкцию с אֶת עֵץ יְהוּדָה, не скрывая её неоднозначности; буквальная форма отмечена в сноске.
- source_word: וַעֲשִׂיתִם לְעֵץ אֶחָד
  choice: и сделаю их одним куском дерева
  rationale: Передано превращение двух символических предметов в одно целое, при этом сохранён повтор ключевого слова עֵץ.
- source_word: וְהָיוּ אֶחָד בְּיָדִי
  choice: и они будут одним в Моей руке
  rationale: Сохранено необычное единственное число сказуемого «одним» при подлежащем во множественном числе, выражающее единство, а также ключевой образ Божьей руки.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: В еврейском тексте стоят титул אֲדֹנָי и личное имя יהוה. Вариант «Владыка Яхве» различает их и открыто сохраняет личное имя, не добавляя конфессионального толкования.
- issue: Единство колен в Божьей руке
  choice: они будут одним в Моей руке
  alternative: они станут едины в Моей руке
  rationale: Более буквальная конструкция сохраняет напряжение между грамматическим множественным числом «они» и предикативным единственным אֶחָד — «одним», не объясняя заранее природу обещанного единства.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «Так говорит» и указательное «вот» сохраняют торжественный регистр; «кусок дерева» выбран вместо более традиционного «жезл», чтобы не приписывать предмету форму или функцию, прямо не названную в исходном тексте. Заглавные местоимения при обращении Бога к Себе использованы как издательская норма данного проекта.
