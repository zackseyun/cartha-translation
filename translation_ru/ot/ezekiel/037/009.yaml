  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א אֶל הָ/ר֑וּחַ הִנָּבֵ֣א בֶן אָ֠דָם וְ/אָמַרְתָּ֨ אֶל הָ/ר֜וּחַ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה מֵ/אַרְבַּ֤ע רוּחוֹת֙ בֹּ֣אִי הָ/ר֔וּחַ וּ/פְחִ֛י בַּ/הֲרוּגִ֥ים הָ/אֵ֖לֶּה וְ/יִֽחְיֽוּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/009.yaml
  text: 'Then he said to me[a], “Prophesy to the breath; prophesy, son of man, and say to the breath, ‘Thus says the Lord GOD: Come from the four winds, O breath, and breathe on these slain, so that they may live.’”'
translation:
  language: ru
  text: 'И Он сказал мне: «Пророчествуй, обращаясь к дыханию[a]; пророчествуй, сын человеческий, и скажи дыханию: „Так говорит Владыка Господь: приди от четырёх ветров, дыхание, и подуй на этих убитых, чтобы они ожили“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское רוּחַ может означать «дыхание», «ветер» или «дух». Здесь в единственном числе оно передано как «дыхание», а в выражении «от четырёх ветров» — как «ветры»; вместе с тем возможно понимание «дух», сохраняющее многослойность образа.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּבֵא
  choice: пророчествуй
  rationale: Повелительная форма глагола נבא обозначает пророческое провозглашение; традиционный русский глагол краток, понятен и сохраняет силу речевого действия.
- source_word: הָרוּחַ / רוּחוֹת
  choice: дыхание / ветры
  rationale: רוּחַ может означать дыхание, ветер или дух. Единственное число передано как «дыхание» ввиду оживляющего действия, а сочетание מֵאַרְבַּע רוּחוֹת — естественным выражением «от четырёх ветров». Многозначность отмечена в сноске.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Характерное для книги Иезекииля обращение к пророку, подчёркивающее его человеческое положение; сохранена прозрачная и укоренившаяся русская форма.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: «Владыка» передаёт אֲדֹנָי, а «Господь» — священное имя יהוה, не смешивая два элемента составного божественного титула.
- source_word: בֹּאִי
  choice: приди
  rationale: Прямое повеление, обращённое к רוּחַ; форма «приди» естественно звучит в русском призыве.
- source_word: וּפְחִי
  choice: и подуй на
  rationale: Глагол נפח означает «дуть, веять, дышать». «Подуй на» непосредственно передаёт глагол и предлог ב, не добавляя отсутствующего в тексте слова «жизнь».
- source_word: בַּהֲרוּגִים הָאֵלֶּה
  choice: на этих убитых
  rationale: הֲרוּגִים прямо обозначает убитых, что сохраняет образ павших в долине и не ослабляет его более общим словом «умершие».
- source_word: וְיִחְיוּ
  choice: чтобы они ожили
  rationale: В контексте форма выражает цель или ожидаемый результат; «ожили» точнее описывает возвращение убитых к жизни, чем простое «жили».
theological_decisions:
- issue: Многозначность רוּחַ в видении долины
  choice: В единственном числе переводить как «дыхание», а во множественном в выражении о четырёх сторонах — как «ветры», отметив значение «дух» в сноске.
  alternative: Последовательно переводить все случаи как «дух» или как «ветер».
  rationale: Контекст оживления поддерживает значение «дыхание», тогда как «четыре ветра» — естественное обозначение сторон света. Сноска сохраняет намеренное наложение образов дыхания, ветра и духа, не сводя его к одному богословскому толкованию.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным синтаксисом. Сохранены повтор «пророчествуй» и прямое обращение к дыханию. Форма «Владыка Господь» различает оба элемента древнееврейского божественного титула.
