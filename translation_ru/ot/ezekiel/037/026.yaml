  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם בְּרִ֥ית עוֹלָ֖ם יִהְיֶ֣ה אוֹתָ֑/ם וּ/נְתַתִּי/ם֙ וְ/הִרְבֵּיתִ֣י אוֹתָ֔/ם וְ/נָתַתִּ֧י אֶת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/026.yaml
  text: I will make with them a covenant of peace[a]; it will be an everlasting covenant with them. And I will place them and multiply them[c][b], and I will set my sanctuary in their midst forever.
translation:
  language: ru
  text: Я заключу с ними завет мира; это будет вечный завет с ними[a]. Я поселю их[b] и умножу их, и помещу мое святилище среди них навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это будет для них вечный завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «водворю их»; буквальнее: «помещу их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: Я заключу ... завет
  rationale: Обычная русская передача древнееврейской идиомы «срезать завет»; она естественна и сохраняет явный заветный характер обещания.
- source_word: בְּרִית שָׁלוֹם
  choice: завет мира
  rationale: 'Формальная конструкция сохраняет многозначность שָׁלוֹם: мир, благополучие, целостность и безопасность.'
- source_word: בְּרִית עוֹלָם
  choice: вечный завет
  rationale: В контексте завета עוֹלָם обозначает неограниченную, непреходящую длительность; «вечный» звучит естественно и торжественно.
- source_word: יִהְיֶה אוֹתָם
  choice: это будет ... с ними
  rationale: Передача сохраняет связь завета с народом, не сводя оборот исключительно к значению пользы; возможное «для них» отмечено в сноске.
- source_word: וּנְתַתִּים
  choice: Я утвержу их
  rationale: При народе в роли дополнения נתן здесь допускает смысл прочного водворения или утверждения. «Утвержу» передаёт устойчивость восстановления, а более буквальная пространственная передача дана в сноске.
- source_word: וְהִרְבֵּיתִי אוֹתָם
  choice: и умножу их
  rationale: Побудительная форма רבה означает сделать многочисленными; краткая формулировка сохраняет перекличку с обещаниями умножения народа.
- source_word: מִקְדָּשִׁי
  choice: Моё святилище
  rationale: «Святилище» точнее более узкого слова «храм» и не предрешает конкретный архитектурный облик святого места.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Оборот указывает прежде всего на Божье присутствие посреди народа как общины, а не на внутреннее пребывание в отдельных людях.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Естественная литературная передача длительности без конца в данном обещании.
theological_decisions:
- issue: Сила заветной формулы в контексте восстановления
  choice: Сохранены прямые выражения «завет мира» и «вечный завет».
  alternative: Передать их описательно как обещание благополучия или безопасности.
  rationale: Стих прямо описывает обязательное заветное отношение Бога к восстановленному народу; парафраз ослабил бы эту смысловую основу.
- issue: Местонахождение Божьего святилища
  choice: «среди них» как присутствие посреди общины
  alternative: «внутри них» как преимущественно внутреннее пребывание в отдельных людях
  rationale: בְּתוֹכָם в этом храмовом контексте естественнее обозначает корпоративное присутствие среди народа и не требует позднейших богословских уточнений.
- issue: Значение וּנְתַתִּים по отношению к восстановленному народу
  choice: «утвержу их»
  alternative: «поселю их» или «помещу их»
  rationale: Контекст допускает как пространственное водворение, так и смысл прочного утверждения. Основной текст передаёт восстановительную устойчивость, а сноска сохраняет более буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; ключевая заветная и храмовая терминология сохранена без конфессионального переосмысления.
