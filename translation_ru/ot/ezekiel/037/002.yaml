lexical_decisions:
- source_word: וְהֶעֱבִירַנִי
  choice: Он провёл меня
  rationale: Каузативная форма глагола עבר обозначает, что Бог заставил пророка пройти или направлял его движение; «провёл меня» естественно передаёт это по-русски.
- source_word: עֲלֵיהֶם
  choice: среди них
  rationale: Буквально предлог может означать «над ними» или «по ним», но в данном пространственном контексте речь, вероятнее всего, о движении пророка среди разбросанных костей; формальная альтернатива сохранена в сноске.
- source_word: סָבִיב סָבִיב
  choice: кругом, со всех сторон
  rationale: Повтор усиливает идею всестороннего обхода; русская формулировка сохраняет эмфазу без неестественного буквального повтора.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица привлекает внимание к увиденному в пророческом видении; «и вот» сохраняет её живую повествовательную функцию.
- source_word: רַבּוֹת מְאֹד
  choice: чрезвычайно много
  rationale: Форма женского рода относится к подразумеваемым костям из предыдущего стиха; наречие «чрезвычайно» передаёт сильную степень מְאֹד.
- source_word: עַל־פְּנֵי הַבִּקְעָה
  choice: на поверхности долины
  rationale: Выражение буквально означает «на лице долины» и описывает кости, рассеянные по её видимой поверхности; выбранный вариант сохраняет образ и остаётся понятным.
- source_word: יְבֵשׁוֹת מְאֹד
  choice: совершенно сухими
  rationale: Сочетание прилагательного с מְאֹד подчёркивает крайнюю иссушенность костей. «Совершенно сухими» естественно выражает это усиление, не добавляя идеи сверх текста.
