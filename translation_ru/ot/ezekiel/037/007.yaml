  text: וְ/נִבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צֻוֵּ֑יתִי וַֽ/יְהִי ק֤וֹל כְּ/הִנָּֽבְאִ/י֙ וְ/הִנֵּה רַ֔עַשׁ וַ/תִּקְרְב֣וּ עֲצָמ֔וֹת עֶ֖צֶם אֶל עַצְמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/007.yaml
  text: So I prophesied as I was commanded[a], and as I prophesied, there was a sound, and behold, a rattling, and the bones came together[b], bone to its bone.
translation:
  language: ru
  text: 'И я пророчествовал, как мне было велено. Когда я пророчествовал, раздался звук, и вот — грохот[a]: кости стали сходиться[b], кость к своей кости.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шум», «сотрясение» или «землетрясение». Еврейское רַעַשׁ допускает эти значения; контекст сходящихся костей поддерживает перевод «грохот».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кость к своей кости» — распределительное выражение, означающее, что каждая кость сходилась с соответствующей ей костью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֵּאתִי / כְּהִנָּבְאִי
  choice: я пророчествовал / когда я пророчествовал
  rationale: Глагол נבא в нифале у Иезекииля обозначает пророческую речь. «Пророчествовал» точно и естественно передаёт повтор исходного глагола; временная конструкция с כ передана словом «когда».
- source_word: כַּאֲשֶׁר צֻוֵּיתִי
  choice: как мне было велено
  rationale: Сохраняет пассивное значение формы צוה и естественно звучит по-русски.
- source_word: וַיְהִי קוֹל
  choice: раздался звук
  rationale: Идиоматично передаёт появление слышимого явления, не сливая קוֹל со следующим словом רַעַשׁ.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет яркий указательный характер еврейского выражения и внезапно привлекает внимание к происходящему.
- source_word: רַעַשׁ
  choice: грохот
  rationale: Слово может обозначать шум, сотрясение или землетрясение; в непосредственном контексте движения сухих костей «грохот» естественно передаёт слышимый шум, не исключая идеи сильного сотрясения.
- source_word: וַתִּקְרְבוּ עֲצָמוֹת
  choice: кости стали сходиться
  rationale: קרב буквально означает приближение; здесь кости движутся к своим соответствующим местам. «Стали сходиться» передаёт и движение, и временное развитие сцены.
- source_word: עֶצֶם אֶל עַצְמוֹ
  choice: кость к своей кости
  rationale: 'Сохранена необычная и наглядная распределительная конструкция оригинала: каждая кость соединяется с соответствующей ей костью.'
