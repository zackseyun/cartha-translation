  text: וְ/הָיָ֤ה מִשְׁכָּנִ/י֙ עֲלֵי/הֶ֔ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵֽ/אלֹהִ֑ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/027.yaml
  text: My dwelling place will be over them[a], and I will be their God, and they will be my people.
translation:
  language: ru
  text: Моё жилище будет над ними[a], и Я буду их Богом, а они будут Моим народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моя скиния будет над ними»; или: «Моя обитель будет над ними».'
    reason: 'Лексическая альтернатива: מִשְׁכָּן может означать жилище, обитель или скинию.'
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: Моё жилище
  rationale: Слово מִשְׁכָּן обозначает место пребывания, жилище или скинию. «Жилище» передаёт конкретный образ и звучит естественно в современном русском языке, не сужая значение исключительно до Моисеевой скинии.
- source_word: עֲלֵיהֶם
  choice: над ними
  rationale: Предлог עַל прежде всего означает «на, над». Перевод «над ними» сохраняет пространственный образ исходного текста и не сглаживает его до толковательного «с ними».
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: и Я буду их Богом
  rationale: Естественная русская передача устойчивой формулы завета; творительный падеж после «буду» сохраняет смысл и узнаваемую библейскую формулировку.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: а они будут Моим народом
  rationale: Естественная русская передача второй части формулы завета. Союз «а» ясно обозначает соотнесённость двух сторон, не вводя смыслового противопоставления.
- source_word: וְהָיָה
  choice: будет
  rationale: В данном пророческом контексте форма выражает будущее; простое «будет» точно и не требует архаического или развёрнутого оборота.
theological_decisions:
- issue: Формула завета
  choice: «Я буду их Богом, а они будут Моим народом»
  alternative: «Я буду для них Богом, и они будут для Меня народом»
  rationale: Выбрана традиционно узнаваемая и естественная по-русски форма, сохраняющая взаимную принадлежность в отношениях завета и не добавляющая к тексту конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Сохранён непривычный, но подлинный образ «над ними»; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской практике.
