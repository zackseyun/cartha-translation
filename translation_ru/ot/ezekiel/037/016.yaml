base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/016.yaml
  text: And you[a], son of man, take for yourself one stick and write on it, ‘For Judah and for the sons of Israel, his companions.’ Then take one stick and write on it, ‘For Joseph, the stick of Ephraim, and all the house of Israel[c][b], his companions.’
translation:
  language: ru
  text: 'А ты, сын человеческий, возьми себе один кусок дерева[a] и напиши на нём: «Иуде и сынам Израиля, связанным с ним[b]». Затем возьми другой кусок дерева и напиши на нём: «Иосифу — дереву Ефрема — и всему дому Израиля, связанному с ним[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деревянную дощечку»; еврейское слово может обозначать дерево, древесину или деревянный предмет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его союзникам», «тем, кто с ним»; буквально речь идёт о связанных или объединённых с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохранено обычное для книги Иезекииля обращение и устойчивый еврейский оборот, буквально означающий «сын человека».
- source_word: קַח לְךָ
  choice: возьми себе
  rationale: Личное местоимение с предлогом לְ передаёт оттенок действия для себя; по-русски он естественно выражается словом «себе».
- source_word: עֵץ
  choice: кусок дерева
  rationale: עֵץ может обозначать дерево, древесину или деревянный предмет. В данном символическом действии речь идёт о предмете, на котором можно писать и который можно соединить с другим; «кусок дерева» сохраняет широту значения и не уточняет форму без достаточных оснований.
- source_word: וּכְתֹב עָלָיו
  choice: напиши на нём
  rationale: Прямо и естественно передаёт физическое нанесение надписи на деревянный предмет.
- source_word: לִיהוּדָה / לְיוֹסֵף
  choice: Иуде / Иосифу
  rationale: Дательный падеж передаёт לְ как указание, кому принадлежит или кому предназначен подписанный предмет, сохраняя краткую форму надписи.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено буквальное «сыны Израиля», а не более обобщённое «народ Израиля».
- source_word: חברו
  choice: присоединившимся к нему
  rationale: Форма обозначает связанных или объединённых с названной стороной людей. Этот вариант естественнее русского «его товарищам» и особенно уместен в контексте последующего соединения двух частей.
- source_word: עֵץ אֶפְרַיִם
  choice: это дерево Ефрема
  rationale: Сохранена конструкция, отождествляющая предмет Иосифа с Ефремом, ведущим северным племенем; вставное оформление позволяет не превращать три элемента надписи в простой перечень.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: всему дому Израиля
  rationale: Сохранён характерный пророческий оборот «дом Израиля» и значение целостности, выраженное כָּל.
theological_decisions:
- issue: Две части разделённого Израиля в символическом действии
  choice: Иуда и связанные с ним сыны Израиля противопоставлены Иосифу/Ефрему и связанному с ним дому Израиля, без дальнейшего догматического отождествления.
  alternative: Свести все названия к общему обозначению «израильтяне» либо истолковать их через более позднюю конфессиональную схему.
  rationale: Еврейский текст намеренно сохраняет исторически и риторически значимые названия обеих групп; перевод не устраняет это различие и не выходит за пределы самого пророческого знамения.
- issue: Отнесение местоименного суффикса в חברו
  choice: Передать буквально-неопределённо как «к нему», позволяя контексту соотнести его соответственно с Иудой и Иосифом.
  alternative: Явно заменить местоимение названиями «к Иуде» и «к Иосифу» или истолковать его как отношение к деревянному предмету.
  rationale: В исходном тексте стоит мужской суффикс единственного числа. Сохранение местоимения не устраняет подлинную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Устойчивые выражения «сын человеческий» и «дом Израиля» сохранены; синтаксис надписей оставлен кратким и несколько формульным, как в источнике.
