source:
  edition: WLC
  text: וְ/דַבֵּ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֨ה אֲנִ֤י לֹקֵ֨חַ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/בֵּ֥ין הַ/גּוֹיִ֖ם אֲשֶׁ֣ר הָֽלְכוּ שָׁ֑ם וְ/קִבַּצְתִּ֤י אֹתָ/ם֙ מִ/סָּבִ֔יב וְ/הֵבֵאתִ֥י אוֹתָ֖/ם אֶל אַדְמָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/021.yaml
  text: 'Then say to them[a], ‘Thus says the Lord GOD: Behold, I am taking the children of Israel from among the nations where they have gone[b], and I will gather them from all around and bring them to their own land.’'
translation:
  language: ru
  text: 'И скажи им: «Так говорит Владыка Яхве: вот, Я возьму сынов Израиля из среды народов, куда они ушли, соберу их отовсюду и приведу их на их землю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדַבֵּר אֲלֵיהֶם
  choice: И скажи им
  rationale: Императив דַבֵּר буквально означает «говори», но в контексте передачи пророческого слова естественное русское «скажи» точно выражает функцию повеления; союз וְ продолжает предыдущее наставление.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся пророческая формула, сохраняющая торжественный посланнический регистр и естественная для современного литературного русского языка.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי и избегает неестественного удвоения «Господь Господь», а «Яхве» передаёт личное имя יְהוִה, ясно различая оба элемента титула.
- source_word: הִנֵּה
  choice: вот
  rationale: Кратко и естественно сохраняет функцию привлечения внимания и торжественную наглядность объявления.
- source_word: אֲנִי לֹקֵחַ
  choice: Я возьму
  rationale: Причастие после הִנֵּה представляет грядущее действие как близкое и несомненное. Русское будущее время естественно согласуется с последующими перфектами с waw, имеющими здесь значение обещанного будущего.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально передаёт родственно-заветное выражение «сыны Израиля». В данном контексте это обозначение всего народа, а не только мужчин.
- source_word: מִבֵּין הַגּוֹיִם
  choice: из среды народов
  rationale: Сохраняет составное пространственное значение «из среды» и передаёт גּוֹיִם нейтральным «народы», без позднейшей конфессиональной окраски слова «язычники».
- source_word: אֲשֶׁר הָלְכוּ שָׁם
  choice: куда они ушли
  rationale: שָׁם буквально «там», однако при русском глаголе движения относительная конструкция естественно передаётся наречием направления «куда»; перфект הָלְכוּ обозначает совершившееся рассеяние.
- source_word: וְקִבַּצְתִּי אֹתָם מִסָּבִיב
  choice: соберу их отовсюду
  rationale: מִסָּבִיב обозначает сбор со всех окружающих сторон. «Отовсюду» естественно и ёмко передаёт всеохватность собирания.
- source_word: וְהֵבֵאתִי אוֹתָם אֶל אַדְמָתָם
  choice: и приведу их в их землю
  rationale: אֶל обозначает направленность к цели, а אַדְמָתָם — принадлежащую им землю. «Приведу ... в их землю» естественно для возвращения людей на родную территорию и не усиливает смысл сверх оригинала.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Раздельная передача титула и личного имени сохраняет различие двух еврейских элементов. «Владыка» уместно передаёт אֲדֹנָי, а «Яхве» — тетраграмматон, не смешивая имя с нарицательным «Бог».
- issue: Временная форма обещанных действий
  choice: 'будущее время: «возьму… соберу… приведу»'
  alternative: 'настоящее время: «беру»'
  rationale: Причастие לֹקֵחַ при הִנֵּה создаёт живую картину начинающегося или близкого действия, но последующая последовательность форм выражает божественное обещание. Единое русское будущее время ясно передаёт пророческую перспективу, не превращая обещание в уже завершённое событие.
- issue: Объём выражения «сыны Израиля»
  choice: сохранено «сынов Израиля» как название народа
  alternative: народ Израиля; израильтян
  rationale: Буквальная родственно-заветная формула сохранена без вывода, будто обещание относится только к мужчинам; в еврейском контексте она обозначает совокупный народ Израиля.
translation_notes:
  register: 'Современный литературный русский с торжественным пророческим звучанием. Синтаксис оставлен ясным и ритмичным; архаизмы вроде «се» и «глаголи» не используются. Сноски не требуются: существенные особенности исходного текста переданы непосредственно в основном тексте.'
