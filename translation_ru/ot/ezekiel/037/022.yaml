  text: וְ/עָשִׂ֣יתִי אֹ֠תָ/ם לְ/ג֨וֹי אֶחָ֤ד בָּ/אָ֨רֶץ֙ בְּ/הָרֵ֣י יִשְׂרָאֵ֔ל וּ/מֶ֧לֶךְ אֶחָ֛ד יִֽהְיֶ֥ה לְ/כֻלָּ֖/ם לְ/מֶ֑לֶךְ וְ/לֹ֤א יהיה עוֹד֙ לִ/שְׁנֵ֣י גוֹיִ֔ם וְ/לֹ֨א יֵחָ֥צוּ ע֛וֹד לִ/שְׁתֵּ֥י מַמְלָכ֖וֹת עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/022.yaml
  text: And I will make them one nation in the land[a], on the mountains of Israel, and one king will be king over all of them. They will no longer be two nations[b], and they will no longer be divided into two kingdoms.
translation:
  language: ru
  text: Я сделаю их одним народом в земле[a], на горах Израиля, и один царь будет царём над всеми ими. Они больше не будут двумя народами и больше не будут разделены на два царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране, в горной области Израиля».'
    reason: 'Лексико-географическая альтернатива: הָאָרֶץ может быть передано как «страна», а בְּהָרֵי יִשְׂרָאֵל — как обозначение горной области Израиля.'
lexical_decisions:
- source_word: וְעָשִׂיתִי אֹתָם לְגוֹי אֶחָד
  choice: Я сделаю их одним народом
  rationale: Конструкция עשה с прямым дополнением и לְ обозначает превращение во что-либо. «Одним народом» естественно передаёт גּוֹי אֶחָד и сохраняет связь с последующим «двумя народами».
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: В данном контексте הָאָרֶץ означает конкретную землю Израиля, а не землю вообще; указательное «этой» естественно выражает контекстуальную определённость еврейского артикля.
- source_word: בְּהָרֵי יִשְׂרָאֵל
  choice: на горах Израиля
  rationale: Буквальный и характерный для Иезекииля географический оборот; возможное смысловое понимание как горной области вынесено в сноску.
- source_word: וּמֶלֶךְ אֶחָד יִהְיֶה לְכֻלָּם לְמֶלֶךְ
  choice: и один царь будет царём над всеми ними
  rationale: Повтор слова «царь» отражает подчёркнутую именную конструкцию оригинала, а «над всеми ними» естественно передаёт значение царской власти.
- source_word: וְלֹא יִהְיֶה עוֹד לִשְׁנֵי גוֹיִם
  choice: Они больше не будут двумя народами
  rationale: Хотя еврейская глагольная форма формально стоит в единственном числе, речь идёт о собирательной общности ранее упомянутых людей; русское множественное число ясно и естественно передаёт смысл.
- source_word: וְלֹא יֵחָצוּ עוֹד לִשְׁתֵּי מַמְלָכוֹת
  choice: и больше не разделятся на два царства
  rationale: Нифаль глагола חצה допускает пассивно-рефлексивное значение. «Не разделятся» лаконично передаёт прекращение политического разделения, а повтор «больше не» сохраняет повторение עוֹד.
theological_decisions:
- issue: Характер обещанного объединения Израиля
  choice: Сохранить прямые национальные, территориальные и царские образы пророчества.
  alternative: Прямо назвать царя Мессией либо истолковать объединение исключительно духовно.
  rationale: Сам стих говорит об одном народе, земле, одном царе и двух царствах, но не называет царя Мессией. Перевод не должен заранее разрешать дальнейшее богословское толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Лексика «народ», «царь», «царство» сохраняет политико-историческую конкретность текста; синтаксис близок к оригиналу без неестественного буквализма.
