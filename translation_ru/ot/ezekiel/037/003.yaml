  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִחְיֶ֖ינָה הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וָ/אֹמַ֕ר אֲדֹנָ֥/י יְהוִ֖ה אַתָּ֥ה יָדָֽעְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/003.yaml
  text: And he said to me[a], “Son of man, can these bones live?” And I said, “Lord GOD, you know.”
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий, оживут ли эти кости?» Я ответил: «Владыка Яхве[a], Ты знаешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский титул: «Владыка Яхве» (אֲדֹנָי יְהוִה). В некоторых переводах: «Господь Бог».'
    reason: Пояснение составного божественного титула и распространённого варианта его передачи.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И Он сказал мне
  rationale: Последовательная форма с וַ продвигает повествование; союз «и» сохраняет еврейское повествовательное течение, а «мне» прямо передаёт אֵלַי.
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Это устойчивое обращение к Иезекиилю. Традиционная русская формулировка сохраняет еврейский образ и литературные связи, не привнося в данный контекст более позднего христологического толкования.
- source_word: הֲתִחְיֶינָה
  choice: оживут ли
  rationale: Вопросительная частица с имперфектом допускает вопрос как о возможности, так и о будущем исходе. Естественное русское «оживут ли» сохраняет эту перспективную неопределённость лучше, чем однозначно модальное «могут ли ожить».
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  choice: эти кости
  rationale: Переданы все и только выраженные здесь элементы. Определение «сухие», хотя оно известно из контекста, в этом стихе отсутствует.
- source_word: וָאֹמַר
  choice: Я ответил
  rationale: В диалогическом русском «ответил» естественно передаёт последующую реплику пророка; последовательность уже ясна из структуры предложения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» различает אֲדֹנָי и личное имя יְהוִה, а «Яхве» прозрачно сохраняет божественное имя без неестественного повтора «Господь Господь».
- source_word: אַתָּה יָדָעְתָּ
  choice: Ты знаешь
  rationale: Перфект глагола знания здесь естественно имеет настоящее стативное значение. Местоимение передано явно и с эмфатическим порядком; слово «один» не добавляется, поскольку его нет в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוִה в составном титуле אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь; Господь Бог
  rationale: В тексте прямо употреблено личное имя Бога. Выбор «Яхве» сохраняет его как имя, а «Владыка» передаёт отдельный титул אֲדֹנָי и устраняет двусмысленный либо неестественный повтор.
- issue: Передача בֶּן אָדָם как обращения к Иезекиилю
  choice: Сын человеческий
  alternative: человек; смертный
  rationale: Формулировка сохраняет повторяющийся еврейский оборот и его литературную функцию, не превращая его ни в отвлечённое обозначение человечности, ни в прямое христологическое наименование.
- issue: Модальность вопроса הֲתִחְיֶינָה
  choice: оживут ли
  alternative: могут ли ожить
  rationale: Еврейский имперфект в вопросе может касаться возможности или ожидаемого исхода. Русская формулировка не сводит вопрос исключительно к способности и сохраняет напряжение перед ответом пророка.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и ясен; традиционное обращение «Сын человеческий» сохранено ради устойчивости и межтекстовых связей. Прописные «Он» и «Ты» употреблены как уважительное обозначение Бога.
