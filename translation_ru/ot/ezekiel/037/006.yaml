base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/006.yaml
  text: I will put sinews on you[a], and I will bring flesh up over you, and I will cover you with skin, and I will put breath in you, and you will live. Then you will know that I am Yahweh.
translation:
  language: ru
  text: Я облеку вас жилами, наращу на вас плоть, покрою вас кожей и вложу в вас дыхание[a] — и вы оживёте. Тогда вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух» или «ветер». Еврейское слово רוּחַ может иметь все три значения, и в 37-й главе книги Иезекииля используется эта многозначность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדִים
  choice: жилы
  rationale: В данном описании восстановления тела слово обозначает соединительные ткани, скрепляющие кости. «Жилы» — понятный и традиционный русский анатомический термин, не сужающий значение до одних сухожилий.
- source_word: וְהַעֲלֵתִי עֲלֵיכֶם בָּשָׂר
  choice: наращу на вас плоть
  rationale: Каузативная форма עלה передаёт появление и нарастание плоти поверх костей. Выражение сохраняет последовательную и зримую картину воссоздания тела и естественно звучит по-русски.
- source_word: וְקָרַמְתִּי עֲלֵיכֶם עוֹר
  choice: покрою вас кожей
  rationale: Глагол означает покрыть или обтянуть сверху; выбранная формулировка ясна и соответствует последовательности телесного восстановления.
- source_word: רוּחַ
  choice: дыхание
  rationale: Непосредственный результат — оживление тел, поэтому здесь наиболее уместно «дыхание». Многозначность еврейского слова, которое также может означать дух или ветер, сохранена в примечании.
- source_word: וִחְיִיתֶם
  choice: вы оживёте
  rationale: В контексте мёртвых костей русское «оживёте» естественно передаёт переход к жизни, подразумеваемый формой חיה.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Тогда вы узнаете, что Я — Яхве
  rationale: «Тогда» ясно выражает последовательность и результат восстановления; имя יְהוָה передано транслитерацией «Яхве» в соответствии с проектной практикой.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, не заменяя его титулом, и соответствует указанному английскому консультационному тексту и проектной установке.
theological_decisions:
- issue: 'Многозначность רוּחַ: дыхание, дух или ветер'
  choice: дыхание
  alternative: дух; ветер
  rationale: В этой фразе רוּחַ завершает телесное восстановление и приводит к оживлению, что поддерживает значение «дыхание». Однако вся глава намеренно использует широкий смысловой диапазон слова, поэтому другие значения отмечены, а не исключены.
translation_notes:
  register: Современный литературный русский с торжественным, но доступным библейским звучанием. Образная последовательность восстановления тела сохранена; местоимение «Я» при речи Бога написано с прописной буквы по русской издательской традиции.
