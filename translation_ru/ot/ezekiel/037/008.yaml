base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/008.yaml
  text: And I looked[a], and behold, there were sinews on them, and flesh had come up, and skin covered them from above; but there was no breath in them.
translation:
  language: ru
  text: 'И увидел я: вот, на них появились сухожилия, наросла плоть, и кожа покрыла их сверху, но дыхания в них не было[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское ру́ах может означать «дыхание», «ветер» или «дух». Здесь, в описании безжизненных тел, лучше всего подходит значение «дыхание», но в более широком контексте обыгрываются все три значения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: И увидел я
  rationale: Форма ראה обозначает зрительное восприятие; инверсия сохраняет достоинство и ритм пророческого повествования, оставаясь понятной по-русски.
- source_word: וְהִנֵּה
  choice: вот
  rationale: הִנֵּה привлекает внимание к внезапно открывшейся картине; «вот» естественно передаёт эту функцию в современном литературном русском.
- source_word: עֲלֵיהֶם גִּדִים
  choice: на них появились сухожилия
  rationale: גִּדִים — соединительные ткани, сухожилия; добавление «появились» естественно выражает подразумеваемое наличие в именной конструкции и развитие видения.
- source_word: וּבָשָׂר עָלָה
  choice: наросла плоть
  rationale: עָלָה здесь описывает появление и нарастание плоти поверх костей; «наросла» передаёт процесс компактно и зримо.
- source_word: וַיִּקְרַם עֲלֵיהֶם עוֹר מִלְמָעְלָה
  choice: и сверху их покрыла кожа
  rationale: קרם означает покрытие или образование наружного слоя, а מִלְמָעְלָה указывает на покрытие сверху, с внешней стороны.
- source_word: וְרוּחַ אֵין בָּהֶם
  choice: но дыхания в них не было
  rationale: В непосредственном контексте уже сложившихся, но ещё безжизненных тел רוּחַ уместнее всего передать как «дыхание»; противительное «но» ясно выражает контраст, подразумеваемый контекстом.
theological_decisions:
- issue: Многозначность רוּחַ в видении долины сухих костей
  choice: дыхание
  alternative: дух; ветер
  rationale: Непосредственно речь идёт о телах, которые сформировались, но ещё не ожили, поэтому «дыхание» наиболее естественно. Однако дальнейший контекст намеренно задействует значения «дыхание», «ветер» и «дух», и эта смысловая напряжённость сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Формулировки конкретны и зримо передают последовательное восстановление тел; архаизмы и излишне медицинская терминология исключены.
