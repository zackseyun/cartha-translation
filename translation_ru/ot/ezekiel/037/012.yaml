  text: לָ/כֵן֩ הִנָּבֵ֨א וְ/אָמַרְתָּ֜ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י פֹתֵ֜חַ אֶת קִבְרֽוֹתֵי/כֶ֗ם וְ/הַעֲלֵיתִ֥י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּ֑/י וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/012.yaml
  text: 'Therefore prophesy and say to them[a], ‘Thus says the Lord GOD: Behold, I am opening your graves and will bring you up from your graves, my people[b], and I will bring you into the land of Israel.’'
translation:
  language: ru
  text: 'Поэтому пророчествуй и скажи им: «Так говорит Господь Бог: вот, Я открываю ваши могилы и подниму вас из ваших могил[a], народ Мой, и приведу вас в землю Израиля[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выведу вас из ваших могил». Буквально еврейское выражение передаёт движение вверх: «подниму вас из ваших могил».'
    reason: lexical_alternative
  - marker: b
    text: Этот образ может описывать восстановление Израиля и возвращение из изгнания языком открытия могил; вместе с тем он созвучен последующей надежде на воскресение.
    reason: cross_reference
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего видения и повеления, сохраняя логическую связь.
- source_word: הִנָּבֵא
  choice: пророчествуй
  rationale: Прямой и общепонятный эквивалент повелительной формы глагола נבא.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: и скажи им
  rationale: Естественно передаёт формулу введения пророческой речи.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет узнаваемую и торжественную формулу посланнической речи пророка.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт оба элемента составного божественного титула и избегает неестественного повтора «Господь Господь».
- source_word: הִנֵּה אֲנִי פֹתֵחַ
  choice: вот, Я открываю
  rationale: «Вот» передаёт הִנֵּה, а настоящее время отражает живое, подчёркнутое и близкое действие, выраженное причастием.
- source_word: קִבְרוֹתֵיכֶם
  choice: ваши могилы
  rationale: Прямой и естественный русский эквивалент, сохраняющий конкретность образа.
- source_word: וְהַעֲלֵיתִי אֶתְכֶם מִקִּבְרוֹתֵיכֶם
  choice: и подниму вас из ваших могил
  rationale: Глагол עלה в породе Hiphil означает побуждение к движению вверх; «подниму» сохраняет этот образ и не устраняет его связь как с восстановлением Израиля, так и с надеждой воскресения.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Передано как обращение с традиционным для возвышенного русского библейского стиля порядком слов.
- source_word: וְהֵבֵאתִי אֶתְכֶם
  choice: и приведу вас
  rationale: Точно и естественно передаёт каузативную форму בוא в контексте возвращения народа.
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: в землю Израиля
  rationale: В данном контексте אַדְמָה обозначает территорию, куда Бог возвращает народ; «земля Израиля» звучит естественно и точно.
theological_decisions:
- issue: Смысл образа открытия могил
  choice: Сохранить конкретный язык открытия могил и поднятия из них, не сводя его только к метафоре возвращения из изгнания или только к прямому учению о всеобщем телесном воскресении.
  alternative: Истолковать образ исключительно как национальное восстановление Израиля либо исключительно как прямое предсказание индивидуального телесного воскресения.
  rationale: В ближайшем контексте речь идёт о восстановлении и возвращении Израиля, однако намеренно конкретный образ могил и поднятия из них несёт более широкий резонанс. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Формулы «Так говорит» и «Владыка Господь» сохраняют достоинство и узнаваемость библейской речи, а синтаксис остаётся понятным современному читателю.
