  text: וְ/נָתַתִּ֨י רוּחִ֤/י בָ/כֶם֙ וִ/חְיִיתֶ֔ם וְ/הִנַּחְתִּ֥י אֶתְ/כֶ֖ם עַל אַדְמַתְ/כֶ֑ם וִ/ידַעְתֶּ֞ם כִּי אֲנִ֧י יְהוָ֛ה דִּבַּ֥רְתִּי וְ/עָשִׂ֖יתִי נְאֻם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/014.yaml
  text: I will put my Spirit within you[a], and you will live, and I will settle you on your own land. Then you will know that I am Yahweh. I have spoken, and I have done it, declares Yahweh.
translation:
  language: ru
  text: Я вложу в вас Мой Дух[a], и вы оживёте. Я поселю вас на вашей земле, и вы узнаете, что Я — Яхве. Я сказал и сделал это, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё дыхание» или «мой дух»; еврейское слово רוח также может означать «ветер». В 37-й главе книги Иезекииля намеренно обыгрывается этот ряд значений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: Мой Дух
  rationale: רוּחַ может означать «дух», «дыхание» или «ветер». В данном стихе форма с суффиксом первого лица и действие Бога естественно допускают перевод «Мой Дух», а намеренная многозначность главы отмечена в сноске.
- source_word: וִחְיִיתֶם
  choice: вы оживёте
  rationale: חיה здесь продолжает образ возвращения к жизни; «оживёте» естественно передаёт как непосредственный образ оживления, так и более широкий смысл восстановления.
- source_word: וְהִנַּחְתִּי אֶתְכֶם עַל אַדְמַתְכֶם
  choice: Я поселю вас на вашей земле
  rationale: Каузативная форма выражает помещение, водворение или дарование покоя. «Поселю» ясно и естественно передаёт восстановление народа на принадлежащей ему земле.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: и вы узнаете, что Я — Яхве
  rationale: Союз сохранён как «и», без добавления явно не выраженной временной связки; формула узнавания передана прямо.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: Я сказал — и исполню
  rationale: В пророческом контексте перфекты выражают решительность и гарантированность Божьего действия. Русское сочетание «сказал — и исполню» естественно передаёт обещанное действие как несомненное, не создавая впечатления, будто восстановление уже исторически завершилось.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана современно и торжественно; «возвещает» сохраняет авторитетность божественного речения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
theological_decisions:
- issue: Личное или безличное понимание רוּחִי
  choice: Мой Дух
  alternative: Моё дыхание; мой дух; мой ветер
  rationale: Притяжательная форма и контекст божественного восстановления поддерживают «Мой Дух», однако сквозная игра значений רוּחַ в Иезекииля 37 не устраняется и отражена в сноске.
- issue: Передача пророческих перфектов דִּבַּרְתִּי וְעָשִׂיתִי
  choice: Я сказал — и исполню
  alternative: Я сказал и сделал; Я сказал — и сделал
  rationale: Форма представляет слово и действие Яхве как твёрдо установленные. Будущее «исполню» соответствует русской формуле обещания и ближайшему будущему контексту, сохраняя напряжение между заявленной уверенностью и предстоящим осуществлением.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется личное имя Бога, непосредственно стоящее в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и ясный; тире подчёркивает торжественную формулу неизбежного исполнения. Заглавная буква в «Мой Дух» отражает выбранное понимание как Божьего Духа, а сноска сохраняет исходную многозначность.
