  text: וְ/עַבְדִּ֤/י דָוִד֙ מֶ֣לֶךְ עֲלֵי/הֶ֔ם וְ/רוֹעֶ֥ה אֶחָ֖ד יִהְיֶ֣ה לְ/כֻלָּ֑/ם וּ/בְ/מִשְׁפָּטַ֣/י יֵלֵ֔כוּ וְ/חֻקֹּתַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֥וּ אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/024.yaml
  text: My servant David will be king over them[a], and there will be one shepherd for all of them. They will walk in my judgments[b], and they will keep my statutes and do them.
translation:
  language: ru
  text: Мой слуга Давид будет царём над ними[a], и у всех них будет один пастырь[b]. Они будут следовать Моим установлениям, соблюдать Мои постановления и исполнять их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под именем «Давид» здесь можно понимать самого Давида, будущего правителя из его рода или, в мессианском прочтении, Мессию. Перевод сохраняет имя, не выбирая одно толкование.
    reason: alternative_reading
  - marker: b
    text: 'Или: «и он будет для всех них одним пастырем». В таком прочтении слова о пастыре прямо относятся к Давиду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: Мой слуга
  rationale: עֶבֶד может означать слугу или раба, но здесь это почётное обозначение Давида в царском и заветном контексте; «слуга» передаёт смысл без неуместного акцента на подневольном положении.
- source_word: דָוִד
  choice: Давид
  rationale: Имя передано в его общепринятой русской библейской форме.
- source_word: מֶלֶךְ עֲלֵיהֶם
  choice: будет царём над ними
  rationale: מֶלֶךְ прямо означает «царь», а עַל с местоименным суффиксом выражает власть над ними.
- source_word: וְרֹעֶה אֶחָד יִהְיֶה לְכֻלָּם
  choice: и у всех них будет один пастырь
  rationale: Сохранён образ пастыря как обозначение единого попечительного правления. Русская конструкция естественно передаёт еврейское именное предложение, не исключая связи пастыря с Давидом.
- source_word: בְמִשְׁפָּטַי יֵלֵכוּ
  choice: будут следовать Моим установлениям
  rationale: הלך здесь метафорически описывает образ жизни и поведение, а מִשְׁפָּטִים — обязательные Божьи установления. «Следовать» естественнее для современного русского языка, чем буквальное «ходить», при этом смысл соблюдения нормы сохранён.
- source_word: חֻקֹּתַי יִשְׁמְרוּ
  choice: соблюдать Мои постановления
  rationale: שׁמר в правовом контексте означает соблюдать, а חֻקּוֹת — предписанные постановления; формулировка сохраняет юридико-заветный оттенок и отличие от предыдущего термина.
- source_word: וְעָשׂוּ אוֹתָם
  choice: и исполнять их
  rationale: עשה с местоименным дополнением означает осуществлять предписанное на деле; «исполнять» звучит естественно по-русски и сохраняет акцент на практическом послушании.
theological_decisions:
- issue: Кого обозначает имя «Давид» в пророчестве о восстановлении
  choice: В основном тексте сохранено имя «Давид» без истолковывающего дополнения.
  alternative: Исторический Давид, будущий правитель из дома Давида или Мессия как Давидов Царь-Пастырь.
  rationale: Еврейский текст прямо называет Давида и не уточняет здесь характер исполнения пророчества. Перевод не должен подменять это имя одним из возможных толкований.
- issue: Связь «одного пастыря» с Давидом
  choice: Использована конструкция «у всех них будет один пастырь», сохраняющая отдельное именное предложение.
  alternative: «Он будет для всех них одним пастырем», где пастырь прямо отождествляется с Давидом.
  rationale: Еврейская конструкция допускает понимание пастыря как того же Давида, но грамматически не требует выраженного местоимения «он». Основной текст сохраняет эту открытость, а примечание сообщает альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Юридико-заветная лексика передана словами «установления» и «постановления»; архаичное буквальное «ходить в судах Моих» заменено естественным «следовать Моим установлениям». Образ «пастыря» сохранён как значимый царско-пастырский образ.
