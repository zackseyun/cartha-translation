revisions:
- from: Но сыновья восстали против Меня. Они не поступали по Моим установлениям и не соблюдали Моих законов, исполняя их, — тех, исполняя которые человек будет жить благодаря им.[a] Они оскверняли Мои субботы. Тогда Я сказал, что изолью на них Мою ярость и до конца изолью на них Мой гнев в пустыне.[b]
  to: Но сыновья восстали против Меня. Они не поступали по Моим установлениям и не соблюдали Моих законов, чтобы исполнять их, — законов, исполняя которые, человек будет жить благодаря им.[a] Они оскверняли Мои субботы. Тогда Я сказал, что изолью на них Мою ярость, чтобы обрушить на них весь Мой гнев[b] в пустыне.
  rationale: Исправлена синтаксическая связь относительного предложения с «законами» и сохранён целевой оттенок сочетания «соблюдать ... чтобы исполнять». Заключительная формула различает образ «излить ярость» и выражение полноты осуществления гнева, не предполагая его эмоционального истощения. Сноски сохранены, а их якоря уточнены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:44:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно, однако в середине стиха исходная русская конструкция синтаксически нарушена: «соблюдали ... исполняя их, — тех» не образует ясного соотнесения. Кроме того, повторное «изолью ... изолью» не отражает различие между לשפך («излить») и לכלות אפי («довести гнев до полного осуществления»).'
  naturalness: 'Нужна правка для современного литературного русского: исправленная фраза ясно связывает соблюдение, исполнение и обещание жизни; заключительная формула избегает неестественного и избыточного повтора.'
  terminology: «Сыновья», «установления», «законы», «оскверняли», «субботы», «ярость» и «пустыня» допустимы в данном регистре. Родовое «человек» корректно передаёт הָאָדָם. «Жить благодаря им» сохраняет инструментальное בָהֶם, не навязывая богословского уточнения.
  issues:
  - severity: high
    issue: Нарушенная синтаксическая связь в формуле о законах и жизни
    rationale: Фраза «не соблюдали Моих законов, исполняя их, — тех, исполняя которые...» смешивает деепричастный оборот и относительное определение; местоимение «тех» не имеет ясного существительного-референта. Еврейский текст говорит о судах/законах, которые человек исполняет и живёт ими.
  - severity: medium
    issue: Повтор «изолью» в передаче двух разных еврейских выражений
    rationale: לשפך חמתי означает «излить ярость», тогда как לכלות אפי בם выражает доведение гнева до полной меры/осуществления против них. «До конца изолью» затемняет это различие.
  - severity: low
    issue: Расположение сноски к Левиту 18:5
    rationale: Сноску лучше поставить непосредственно после формулы «человек будет жить благодаря им», к которой относится межтекстовая перекличка.
