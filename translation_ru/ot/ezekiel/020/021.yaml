  text: וַ/יַּמְרוּ בִ֣/י הַ/בָּנִ֗ים בְּ/חֻקּוֹתַ֣/י לֹֽא הָ֠לָכוּ וְ/אֶת מִשְׁפָּטַ֨/י לֹא שָׁמְר֜וּ לַ/עֲשׂ֣וֹת אוֹתָ֗/ם אֲשֶׁר֩ יַעֲשֶׂ֨ה אוֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֥וֹת אַפִּ֛/י בָּ֖/ם בַּ/מִּדְבָּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/021.yaml
  text: But the children rebelled against me[a]. They did not walk in my statutes, and they did not keep my judgments so as to do them—the judgments that, if a man does them, he will live by them. They profaned my Sabbaths. So I said I would pour out my wrath on them[b], to spend my anger against them in the wilderness.
translation:
  language: ru
  text: Но сыновья восстали против Меня. Они не поступали по Моим установлениям и не соблюдали Моих законов, чтобы исполнять их, — законов, исполняя которые, человек будет жить благодаря им.[a] Они оскверняли Мои субботы. Тогда Я сказал, что изолью на них Мою ярость, чтобы обрушить на них весь Мой гнев[b] в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Левит 18:5.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «чтобы довести до конца Мой гнев на них».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּמְרוּ בִי הַבָּנִים
  choice: Но сыновья восстали против Меня
  rationale: מרה с ב выражает направленный против Бога мятеж, а не просто непослушание. הַבָּנִים обозначает сыновей, то есть следующее поколение, в противопоставлении отцам.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: Они не поступали по Моим установлениям
  rationale: Еврейская метафора «ходить в» передаёт образ жизни; по-русски естественнее «поступать по», сохраняя этический смысл. חֻקּוֹת — установления, предписанные Богом.
- source_word: וְאֶת מִשְׁפָּטַי לֹא שָׁמְרוּ לַעֲשׂוֹת אוֹתָם
  choice: и не соблюдали Моих законов, исполняя их
  rationale: Сочетание שׁמר с инфинитивом עשׂה удерживает как соблюдение, так и практическое исполнение. «Законы» естественно передаёт юридическое значение מִשְׁפָּטִים.
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם
  choice: тех, исполняя которые человек будет жить благодаря им
  rationale: Сохранены условно-обобщающий смысл, родовое הָאָדָם и неоднозначность בָּהֶם; «благодаря им» естественно передаёт средство или основание жизни, не уточняя характер самой жизни.
- source_word: אֶת שַׁבְּתוֹתַי חִלֵּלוּ
  choice: Они оскверняли Мои субботы
  rationale: Пиэль חלל означает лишать святости, осквернять; несовершенный вид уместен для повторявшегося поведения поколения.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: изолью на них Мою ярость
  rationale: Сохранена метафора излияния; חֵמָה передано как «ярость», что выражает пылающий гнев.
- source_word: לְכַלּוֹת אַפִּי בָּם
  choice: до конца изолью на них Мой гнев
  rationale: כלה с אַף означает довести проявление гнева до полноты. Русская формулировка сохраняет полноту суда и параллелизм с предшествующим «изолью», не предполагая, будто у Бога исчерпывается способность гневаться.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: В повествовании об исходе מִדְבָּר обозначает пустынную местность; «в пустыне» — традиционный и понятный русский эквивалент.
theological_decisions:
- issue: Родовое значение הָאָדָם в формуле о жизни через исполнение законов
  choice: человек
  alternative: тот, кто
  rationale: Существительное употреблено в единственном числе обобщённо и не ограничивает высказывание мужчинами; русское «человек» сохраняет число и универсальность.
- issue: Значение וָחַי בָּהֶם
  choice: будет жить благодаря им
  alternative: будет жив ими / будет жить, исполняя их
  rationale: Фраза перекликается с Левитом 18:5, но стих сам не уточняет, идёт ли речь только о сохранении земной жизни или о более широком даре жизни. Перевод не разрешает эту богословскую напряжённость.
- issue: Полнота Божьего гнева в לְכַלּוֹת אַפִּי
  choice: до конца изолью на них Мой гнев
  alternative: утолю на них Мой гнев
  rationale: Выбранный вариант выражает полное осуществление суда, не внося антропоморфное представление об эмоциональном удовлетворении или истощении Бога.
translation_notes:
  register: Современный литературный русский с торжественным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис несколько приподнят, но избегает архаизмов; повтор корней «соблюдали / исполняя» намеренно передаёт два еврейских глагола.
