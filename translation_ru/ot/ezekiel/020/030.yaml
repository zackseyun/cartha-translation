  verdict: approve
  source_fidelity: 'Текст точно передаёт еврейский оригинал: выводное לכן («Поэтому»), пророческая формула, корпоративное «дом Израиля», риторический вопрос, самоосквернение по образцу отцов и резкая метафора זנה сохранены. «Мерзости» удачно не сужает שקוצים исключительно до идолов.'
  naturalness: Перевод звучит естественно на современном литературном русском при сохранении возвышенного пророческого регистра. «Неужели вы оскверняете себя» и «следуя путём ваших отцов» ясны и идиоматичны. «Блудодействуете вслед за их мерзостями» намеренно резко, но соответствует образности оригинала.
  terminology: «Господь Яхве» различает титул אֲדֹנָי и личное имя יהוה. «Дом Израиля», «оскверняете себя», «мерзости» и «блудодействуете» терминологически уместны. Сноска имеет корректную привязку [a] и ясно маркирует варианты, включая контекстуальную возможность «идолы» без навязывания её основному тексту.
