source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הַ/בְּ/דֶ֥רֶךְ אֲבֽוֹתֵי/כֶ֖ם אַתֶּ֣ם נִטְמְאִ֑ים וְ/אַחֲרֵ֥י שִׁקּוּצֵי/הֶ֖ם אַתֶּ֥ם זֹנִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/030.yaml
  text: 'Therefore say to the house of Israel[a], Thus says the Lord Yahweh: Are you defiling yourselves in the way of your fathers[b], and whoring after their detestable things?'
translation:
  language: ru
  text: 'Поэтому скажи дому Израиля: Так говорит Господь Яхве: неужели вы оскверняете себя, следуя путём ваших отцов, и блудодействуете вслед за их мерзостями?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неужели вы делаете себя нечистыми, поступая, как ваши отцы, и распутничаете вслед за их отвратительными идолами?»'
    reason: Лексические варианты для נטמא, דרך, זנה и שקוצים; последнее слово в данном контексте может обозначать идолов.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего обличения.
- source_word: אֱמֹר אֶל־בֵּית יִשְׂרָאֵל
  choice: скажи дому Израиля
  rationale: Сохраняет пророческое поручение и корпоративное обозначение Израиля.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Господь Яхве
  rationale: Передаёт оба божественных наименования и сохраняет личное имя יהוה.
- source_word: הַבְּדֶרֶךְ אֲבוֹתֵיכֶם
  choice: следуя путём ваших отцов
  rationale: Естественно выражает следование образу жизни и практике предков.
- source_word: אַתֶּם נִטְמְאִים
  choice: неужели вы оскверняете себя
  rationale: Причастная форма обозначает продолжающееся действие; возвратная конструкция передаёт ритуально-нравственное самоосквернение, а «неужели» — вопросительно-обличительную силу ה.
- source_word: שִׁקּוּצֵיהֶם
  choice: их мерзостями
  rationale: Сохраняет оценочное значение отвратительных культовых предметов или практик, не сужая его безусловно до идолов.
- source_word: אַתֶּם זֹנִים
  choice: блудодействуете
  rationale: Сохраняет резкую пророческую метафору заветной неверности и идолопоклонства.
theological_decisions:
- issue: Передача אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка Господь; Господь Бог
  rationale: В исходном тексте стоят титул אֲדֹנָי и личное имя יהוה; выбранная форма различает их и не скрывает имя.
- issue: Характер вопроса в הַבְּדֶרֶךְ ... אַתֶּם נִטְמְאִים
  choice: 'риторический вопрос: «неужели вы…?»'
  alternative: 'утверждение: «вы оскверняетесь…»'
  rationale: Начальное ה естественнее всего понимать как вопросительную частицу; русский перевод сохраняет обличительную вопросительную форму.
- issue: Метафора זנה
  choice: блудодействуете вслед за
  alternative: изменяете Мне, следуя за
  rationale: Прямой образ намеренно сохранён без добавления отсутствующего в стихе дополнения «Мне».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Дом Израиля» сохраняет библейское корпоративное обозначение; «отцы» оставлено как уместное в данном торжественном регистре. Резкость метафоры блудодейства не смягчена.
