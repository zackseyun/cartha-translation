  text: וָ/אֲבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לָ/הֶ֑ם וַ/יִּרְאוּ֩ כָל גִּבְעָ֨ה רָמָ֜ה וְ/כָל עֵ֣ץ עָבֹ֗ת וַ/יִּזְבְּחוּ שָׁ֤ם אֶת זִבְחֵי/הֶם֙ וַ/יִּתְּנוּ שָׁם֙ כַּ֣עַס קָרְבָּנָ֔/ם וַ/יָּשִׂ֣ימוּ שָׁ֗ם רֵ֚יחַ נִיח֣וֹחֵי/הֶ֔ם וַ/יַּסִּ֥יכוּ שָׁ֖ם אֶת נִסְכֵּי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/028.yaml
  text: So I brought them into the land that I had lifted up my hand to give to them[a], and they saw every high hill and every leafy tree, and there they sacrificed their sacrifices, and there they presented the provocation of their offering, and there they set their pleasing aromas[c][b], and there they poured out their drink offerings.
translation:
  language: ru
  text: Я привёл их в землю, которую Я, подняв руку, поклялся дать им[a]. Они увидели всякий высокий холм и всякое густолиственное дерево; там они приносили свои жертвы, там совершали приношения, вызывавшие гнев[b], там приносили благоухания своих жертв[c] и там выливали свои возлияния.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в землю, чтобы дать её им, Я поднял Свою руку». Поднятие руки — жест, сопровождающий клятву.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «раздражение (или: оскорбление) их приношения»; то есть приношение, вызывавшее гнев.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «благоухания их жертв». Это устойчивое выражение из языка жертвоприношений; в данном контексте оно относится к их неправомерному культу.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲבִיאֵם
  choice: Я привёл их
  rationale: Каузативная форма глагола בוא означает «привести». Союз ו продолжает повествование; по-русски связь естественно передаётся без отдельного «и».
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: подняв руку, поклялся
  rationale: Оборот буквально означает «поднять руку» и обозначает принесение клятвы. Перевод сохраняет образ и одновременно ясно передаёт его смысл.
- source_word: כָל גִּבְעָה רָמָה וְכָל עֵץ עָבֹת
  choice: всякий высокий холм и всякое густолиственное дерево
  rationale: Сохранено конкретное описание мест, связанных с незаконным культом. עָבֹת значит «густой, с плотной листвой», а не буквально «зелёный».
- source_word: וַיִּזְבְּחוּ שָׁם אֶת־זִבְחֵיהֶם
  choice: они стали приносить там свои жертвы
  rationale: Естественный русский культовый оборот передаёт однокоренное сочетание глагола и существительного без тяжеловесного «жертвовали жертвы».
- source_word: כַּעַס קָרְבָּנָם
  choice: свои оскорбительные приношения
  rationale: Сжатая еврейская конструкция буквально говорит о «раздражении/оскорблении их приношения»; прилагательное передаёт, что эти приношения вызывали Божий гнев, не добавляя отсутствующего в тексте прямого дополнения.
- source_word: רֵיחַ נִיחוֹחֵיהֶם
  choice: благоухание своих жертв
  rationale: Это жертвенная формула о приятном благоухании. Добавление «жертв» делает русский оборот понятным; притяжательный суффикс сохранён словом «своих».
- source_word: וַיַּסִּיכוּ שָׁם אֶת־נִסְכֵּיהֶם
  choice: выливали свои возлияния
  rationale: נסכים — жидкие жертвенные приношения; «возлияния» является точным и устоявшимся русским культовым термином.
theological_decisions:
- issue: Передача клятвенного оборота נָשָׂא יָד
  choice: подняв руку, поклялся
  alternative: поднял руку, чтобы отдать
  rationale: Выбранный вариант сохраняет исходный образ и раскрывает его общепризнанный клятвенный смысл, не оставляя современному читателю неясной связи между поднятием руки и обещанием.
- issue: Характер идольских приношений в выражении כַּעַס קָרְבָּנָם
  choice: оскорбительные приношения
  alternative: приношения, вызывавшие гнев
  rationale: 'Сохранена богословская напряжённость: формально культовые действия названы тем, чем они являются перед Богом, — оскорблением и причиной гнева. При этом в текст не вставлено отсутствующее местоимение «Меня».'
- issue: Формула רֵיחַ נִיחוֹחַ в контексте идолослужения
  choice: благоухание своих жертв
  alternative: приятное благоухание
  rationale: Формула сохранена как культовая речь, но слово «приятное» не использовано, чтобы перевод не утверждал, будто эти идольские жертвы были приятны Богу; притяжательное «своих» поддерживает ироническую дистанцию исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сделан плавным, а повтор «там» сохранён для передачи настойчивого ритма еврейского текста. Термины «приношения» и «возлияния» точны и понятны в религиозном контексте; неестественные кальки устранены.
