  text: וַ/יַּמְרוּ בִ֗/י וְ/לֹ֤א אָבוּ֙ לִּ/שְׁמֹ֣עַ אֵלַ֔/י אִ֣ישׁ אֶת שִׁקּוּצֵ֤י עֵֽינֵי/הֶם֙ לֹ֣א הִשְׁלִ֔יכוּ וְ/אֶת גִּלּוּלֵ֥י מִצְרַ֖יִם לֹ֣א עָזָ֑בוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֤וֹת אַפִּ/י֙ בָּ/הֶ֔ם בְּ/ת֖וֹךְ אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/008.yaml
  text: But they rebelled against me and refused to listen to me. None of them cast away the detestable things before their eyes[a] or abandoned the idols[b] of Egypt. So I said that I would pour out my wrath on them, bringing my anger against them to its full measure in the midst of the land of Egypt.
translation:
  language: ru
  text: Но они восстали против Меня и отказались слушать Меня. Никто из них не отбросил мерзостей, находившихся перед их глазами[a], и не оставил египетских идолов[b]. Тогда Я сказал, что изолью на них Свою ярость, чтобы до конца обрушить на них Мой гнев в пределах земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мерзостей их глаз». Еврейское выражение может означать отвратительные предметы, находившиеся перед их глазами, и вместе с тем намекать на их пристрастие к этим предметам.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово, переведённое как «идолы», намеренно презрительно и может вызывать представление о чём-то нечистом и отвратительном.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: восстали против Меня
  rationale: Глагол מרה с ב обозначает неповиновение и противление кому-либо; «восстали против Меня» ясно передаёт осознанный мятеж.
- source_word: וְלֹא אָבוּ לִשְׁמֹעַ אֵלַי
  choice: отказались слушать Меня
  rationale: Отрицательная волевая конструкция выражает не простую неспособность, а сознательный отказ.
- source_word: אִישׁ
  choice: никто из них
  rationale: Единственное число имеет распределительное значение внутри всей группы; по-русски это естественно передаётся выражением «никто из них».
- source_word: שִׁקּוּצֵי עֵינֵיהֶם
  choice: мерзостей, бывших у них перед глазами
  rationale: Сочетание допускает как пространственный смысл — отвратительные предметы перед глазами, — так и намёк на идолопоклонническую привязанность; основной текст не устраняет эту неоднозначность.
- source_word: הִשְׁלִיכוּ
  choice: не отбросил
  rationale: Глагол означает физически или решительно отбросить, отвергнуть; «отбросил» сохраняет образ и силу выражения.
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: египетских идолов
  rationale: גִּלּוּלִים — презрительное обозначение идолов у Иезекииля. В основном тексте употреблено ясное «идолы», а уничижительный оттенок отмечен в сноске.
- source_word: עָזָבוּ
  choice: не оставил
  rationale: עזב здесь означает оставить или отказаться от идолов; согласование с распределительным «никто» естественно сохраняет единственное число.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: изолью на них Свою ярость
  rationale: Сохраняется яркий исходный образ излияния חֵמָה; «ярость» позволяет отличить это слово от последующего אַף — «гнев».
- source_word: לְכַלּוֹת אַפִּי בָּהֶם
  choice: дам Моему гневу исполниться над ними до конца
  rationale: Фраза выражает доведение гнева и связанного с ним суда до завершения; перевод сохраняет идею полноты, не сводя её к эмоциональной разрядке.
- source_word: בְּתוֹךְ אֶרֶץ מִצְרָיִם
  choice: посреди земли Египетской
  rationale: Передаёт как בְּתוֹךְ — «посреди, внутри», так и полную географическую формулу «земля Египетская».
theological_decisions:
- issue: Антропопатический язык Божьего суда
  choice: 'Сохранить два близких, но различных выражения: «ярость» и «гнев»'
  alternative: Свести оба слова к «гневу» либо смягчить их до «наказания» или «суда»
  rationale: В еврейском тексте рядом стоят חֵמָה и אַף, усиливая описание Божьего противодействия идолопоклонству. Различение русских слов сохраняет риторическую насыщенность, не навязывая им искусственного догматического разграничения.
- issue: Неоднозначность שִׁקּוּצֵי עֵינֵיהֶם
  choice: Передать как «мерзости, бывшие у них перед глазами» и пояснить возможный смысл в сноске
  alternative: Однозначно истолковать как предметы, на которых были сосредоточены их желания
  rationale: Конструкция может обозначать видимые предметы и одновременно подразумевать пристрастие к ним. Перевод не должен без необходимости устранять эту напряжённость.
- issue: Распределительное значение אִישׁ
  choice: «Никто из них»
  alternative: «Ни один мужчина» или «ни один человек»
  rationale: В данном контексте грамматически мужская форма охватывает каждого члена названной группы; «никто из них» точно передаёт распределительное значение без необоснованного ограничения по полу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Синтаксис сделан доступным для обычного читателя, при этом сохранены повтор, суровость судебной лексики и географическая формула оригинала.
