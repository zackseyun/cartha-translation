  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/יוֹם֙ בָּחֳרִ֣/י בְ/יִשְׂרָאֵ֔ל וָ/אֶשָּׂ֣א יָדִ֗/י לְ/זֶ֨רַע֙ בֵּ֣ית יַֽעֲקֹ֔ב וָ/אִוָּדַ֥ע לָ/הֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אֶשָּׂ֨א יָדִ֤/י לָ/הֶם֙ לֵ/אמֹ֔ר אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/005.yaml
  text: 'And say to them[a], ‘Thus says the Lord GOD: On the day when I chose Israel, I lifted up my hand to the offspring of the house of Jacob and made myself known to them in the land of Egypt; I lifted up my hand to them, saying, “I am Yahweh your God.”’'
translation:
  language: ru
  text: 'И скажи им: «Так говорит Владыка Яхве: в тот день, когда Я избрал Израиль, Я поднял руку[a], обращаясь к потомкам дома Иакова, и открылся им в земле Египта. Я поднял руку, обращаясь к ним, говоря: „Я — Яхве, ваш Бог“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднял Мою руку». Это древнееврейский оборот, часто обозначающий клятву или торжественное обещание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сочетание сохраняет оба элемента титула: אֲדֹנָי передано как «Владыка», а личное имя יְהוָה — как «Яхве». Это позволяет избежать неестественного повтора «Господь Господь».'
- source_word: בְּיוֹם בָּחֳרִי בְיִשְׂרָאֵל
  choice: в тот день, когда Я избрал Израиль
  rationale: Передаёт временную конструкцию буквально и естественно, сохраняя значение избрания без привнесения позднейших богословских систем.
- source_word: וָאֶשָּׂא יָדִי
  choice: Я поднял руку
  rationale: В основном тексте сохранён конкретный образ древнееврейской идиомы; её значение торжественной клятвы пояснено в сноске.
- source_word: לְזֶרַע בֵּית יַעֲקֹב
  choice: обращаясь к потомкам дома Иакова
  rationale: זֶרַע обозначает потомство; «потомки» звучит естественно по-русски. Оборот «обращаясь к» ясно передаёт направленность действия, не заменяя образ поднятой руки толкованием.
- source_word: וָאִוָּדַע לָהֶם
  choice: и открылся им
  rationale: Форма Niphal выражает Божье самооткровение. «Открылся им» кратко и естественно передаёт это значение.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохранено явно присутствующее в еврейском тексте слово אֶרֶץ; традиционный русский оборот остаётся понятным и литературным.
- source_word: לֵאמֹר אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 'и сказал: „Я — Яхве, ваш Бог“'
  rationale: Ковенантная формула передана прямо; личное имя יְהוָה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное заветное имя и отличает его от титула אֲדֹנָי, не связывая перевод с конфессионально предпочтительным заменителем.
- issue: Следует ли заменять וָאֶשָּׂא יָדִי словом «поклялся»
  choice: Сохранить в тексте образ «поднял руку», пояснив клятвенный смысл в сноске
  alternative: поклялся; дал торжественное обещание
  rationale: Образная форма исходного текста сохраняется, а её вероятная идиоматическая сила сообщается читателю без устранения различия между буквальным выражением и его смыслом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис слегка упрощён ради ясности, при этом сохранены повтор выражения «поднял руку», образность оригинала и вложенная прямая речь.
