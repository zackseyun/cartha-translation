source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֞ר אֶת זִקְנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/לִ/דְרֹ֥שׁ אֹתִ֖/י אַתֶּ֣ם בָּאִ֑ים חַי אָ֨נִי֙ אִם אִדָּרֵ֣שׁ לָ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/003.yaml
  text: 'Son of man[a], speak to the elders of Israel and say to them, Thus says the Lord GOD: Is it to inquire of me that you have come? As I live, I will not be inquired of by you[b], declares the Lord GOD.'
translation:
  language: ru
  text: 'Сын человеческий, обратись к старейшинам Израиля и скажи им: «Так говорит Господь Яхве: вы пришли, чтобы вопрошать Меня[a]? Жив Я: не дам вам вопрошать Меня[b], — возвещает Господь Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы обратиться ко Мне за ответом». Здесь глагол означает обращение к Богу за пророческим ответом или решением.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Жив Я, если буду вопрошаем вами». Это еврейская формула клятвы, выражающая решительное отрицание: «не дам вам вопрошать Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет характерную для книги Иезекииля форму обращения и еврейский образ, оставаясь понятным в современном литературном русском языке.
- source_word: דַּבֵּר אֶת זִקְנֵי יִשְׂרָאֵל
  choice: обратись к старейшинам Израиля
  rationale: В данном контексте глагол требует речи, направленной к признанным руководителям народа; «обратись» звучит естественнее буквального «говори старейшин».
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка Яхве
  rationale: Сохраняет пророческую формулу посланника, передаёт אֲדֹנָי как титул «Владыка» и יְהוִה как личное имя Яхве, не сливая два элемента.
- source_word: הֲלִדְרֹשׁ אֹתִי אַתֶּם בָּאִים
  choice: Разве вы пришли, чтобы вопрошать Меня
  rationale: דרשׁ здесь означает обращение к Богу за ответом или пророческим решением, а не просто духовное искание. Конструкция с «чтобы» естественно передаёт цель прихода.
- source_word: חַי אָנִי
  choice: Жив Я
  rationale: Кратко и торжественно передаёт традиционную формулу божественной клятвы, сохраняя её исходный образ.
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: не позволю вам вопрошать Меня
  rationale: После клятвенной формулы אִם выражает решительное отрицание, а нифаль глагола указывает на отказ Бога быть доступным для их вопрошания. Русская формулировка передаёт этот смысл естественно.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: Передаёт авторитетную пророческую формулу заключения речи и отличает её от начального «Так говорит».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Вариант сохраняет и титул אֲדֹנָי, и личное имя יְהוִה, избегая как замены имени общим титулом, так и тяжеловесного повторения «Господь Господь».
- issue: Сила конструкции клятва + אִם
  choice: 'прямое решительное отрицание: «не позволю вам вопрошать Меня»'
  alternative: 'условная или риторически-вопросительная форма: «если Я дам вам вопросить Меня»; «неужели Я позволю вам вопрошать Меня?»'
  rationale: В еврейской клятвенной формуле частица אִם после «Жив Я» служит аподосисом с подразумеваемым проклятием и выражает категорическое отрицание. Прямое отрицание яснее передаёт её прагматическую силу по-русски.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис упрощён лишь там, где буквальное воспроизведение еврейской конструкции было бы неестественным; повтор корня דרשׁ передан повтором «вопрошать», чтобы сохранить смысловую связь между вопросом и отказом.
