base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/043.yaml
  text: There you will remember your ways and all your deeds by which you defiled yourselves[b][a], and you will loathe yourselves in your own sight for all the evils that you have done.
translation:
  language: ru
  text: Там вы вспомните свои пути и все свои поступки, которыми вы осквернили себя, и будете гнушаться самих себя[a][b] из-за всех злых дел, которые совершили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытаете отвращение к самим себе». Еврейский глагол выражает сильное отвращение к себе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед своими лицами»; смысл выражения — «в собственных глазах», по собственной оценке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  choice: вы вспомните
  rationale: Форма в данном пророческом контексте имеет будущее значение; «вспомните» естественно передаёт זכר.
- source_word: שָׁם
  choice: там
  rationale: Наречие указывает на место, о котором говорится в предшествующем контексте.
- source_word: דַּרְכֵיכֶם
  choice: свои пути
  rationale: Сохранена еврейская метафора образа жизни и поведения, понятная в современном русском языке.
- source_word: עֲלִילוֹתֵיכֶם
  choice: все свои поступки
  rationale: Слово обозначает совершённые действия; «поступки» естественно сочетается с нравственной оценкой текста и не сливается полностью с более широким «пути».
- source_word: אֲשֶׁר נִטְמֵאתֶם בָּם
  choice: которыми вы осквернили себя
  rationale: Nifal от נטמא выражает состояние осквернения; возвратная русская конструкция передаёт личную причастность и средство, обозначенное предлогом ב.
- source_word: וּנְקֹטֹתֶם
  choice: и почувствуете отвращение
  rationale: קוט обозначает сильное отвращение, а не только сожаление или стыд; выбранная формулировка ясна современному читателю.
- source_word: בִּפְנֵיכֶם
  choice: к самим себе
  rationale: Буквально выражение связано с «лицами», но в контексте означает собственную отрицательную оценку себя; естественная русская формулировка передаёт подразумеваемый возвратный смысл.
- source_word: בְּכָל רָעוֹתֵיכֶם
  choice: за всё зло
  rationale: Множественная форма רָעוֹת охватывает злые дела в их совокупности; русское собирательное «всё зло» естественно связывается с последующим относительным предложением.
- source_word: אֲשֶׁר עֲשִׂיתֶם
  choice: которое совершили
  rationale: Глагол עשה передан нейтральным «совершили»; прошедшее время соответствует будущему воспоминанию о прежних делах.
theological_decisions:
- issue: Характер реакции Израиля после восстановления
  choice: Глубокое отвращение к самим себе из-за совершённого зла
  alternative: Лишь сожаление или стыд за прошлое
  rationale: Сильное значение קוט и воспоминание об оскверняющих поступках требуют более сильной формулировки, но перевод не добавляет отсутствующих в стихе догматических категорий.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Метафора «пути» сохранена, а трудная еврейская идиома בִּפְנֵיכֶם передана естественно и пояснена в сноске.
