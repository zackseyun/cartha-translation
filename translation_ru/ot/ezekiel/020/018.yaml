base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/018.yaml
  text: And I said to their children in the wilderness[a], ‘Do not walk in the statutes of your fathers, and do not keep their judgments, and do not defile yourselves with their idols.’
translation:
  language: ru
  text: 'И Я сказал их детям в пустыне: «Не поступайте по установлениям ваших отцов, не соблюдайте их предписаний и не оскверняйте себя их идолами[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово גִּלּוּלִים — резко презрительное обозначение идолов; возможны переводы «мерзкие идолы» и даже «навозные идолы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: И сказал Я
  rationale: Ваййиктоль передаёт последовательное действие в прошлом; инверсия сохраняет возвышенный, но понятный библейский слог и ясно указывает на говорящего Бога.
- source_word: בְּנֵיהֶם
  choice: их сыновьям
  rationale: בנים буквально означает «сыновья» и здесь обозначает следующее поколение; русский контекст естественно допускает такое поколенческое употребление без нейтрализации рода.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «в пустыне» — традиционное и естественное обозначение места странствий Израиля.
- source_word: בְּחֻקֵּי ... אַל תֵּלֵכוּ
  choice: не поступайте по установлениям
  rationale: Буквальное «не ходите в установлениях» неестественно по-русски; «поступать по» передаёт идиоматический смысл הלך — строить своё поведение согласно нормам.
- source_word: אֲבוֹתֵיכֶם
  choice: ваших отцов
  rationale: Сохраняется мужская форма и поколенческий контраст исходного текста; речь идёт о предыдущем поколении.
- source_word: מִשְׁפְּטֵיהֶם
  choice: их предписаний
  rationale: «Предписания» естественно передаёт юридико-нормативный смысл מִשְׁפָּטִים и сохраняет отличие от חֻקִּים, переведённого как «установления».
- source_word: תִּשְׁמֹרוּ
  choice: не соблюдайте
  rationale: В сочетании с нормами שׁמר означает соблюдать или исполнять; «соблюдать предписания» — точная современная русская сочетаемость.
- source_word: גִּלּוּלֵיהֶם
  choice: их идолами
  rationale: В основном тексте выбрано ясное «идолы»; присущая слову резко презрительная окраска отмечена в сноске.
- source_word: תִּטַּמָּאוּ
  choice: не оскверняйте себя
  rationale: Рефлексивная форма передаёт навлечение на себя нечистоты; перевод сохраняет как ритуальный, так и нравственный оттенок осквернения.
theological_decisions:
- issue: Передача אֲבוֹתֵיכֶם
  choice: ваших отцов
  alternative: ваших предков
  rationale: «Отцов» сохраняет грамматическую и риторическую конкретность еврейского текста, где противопоставлены отцы и их сыновья; контекст показывает, что имеется в виду предыдущее поколение.
- issue: Презрительная окраска גִּלּוּלִים
  choice: идолами с пояснительной сноской
  alternative: мерзкими идолами / навозными идолами
  rationale: Резко уничижительный смысл подлинен, однако его буквальное воспроизведение в основном тексте звучало бы по-русски неестественно или чрезмерно интерпретирующе; поэтому напряжение сохраняется посредством сноски.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Еврейские правовые термины разведены как «установления» и «предписания»; метафорическое «ходить» передано естественным русским «поступать по».
