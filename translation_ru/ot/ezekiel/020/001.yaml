  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ית בַּֽ/חֲמִשִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ בָּ֧אוּ אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י יִשְׂרָאֵ֖ל לִ/דְרֹ֣שׁ אֶת יְהוָ֑ה וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/001.yaml
  text: And it happened in the seventh year[a], in the fifth month, on the tenth day of the month, that some of the elders of Israel came to inquire of Yahweh[b], and they sat before me.
translation:
  language: ru
  text: В седьмой год, в пятый месяц, в десятый день месяца, несколько старейшин Израиля пришли вопросить Яхве[a] и сели передо мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «вопросить Яхве» можно также перевести как «искать Яхве» или «обратиться к Яхве за ответом»; здесь речь, вероятно, идёт об официальном обращении за Божьим указанием.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: В седьмой год
  rationale: Еврейская повествовательная формула вводит новый датированный эпизод. В современном русском отдельное «И случилось» здесь избыточно; начало с обстоятельства времени естественно передаёт её функцию.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִית
  choice: в седьмой год
  rationale: Сохранена точная формулировка стиха без добавления подразумеваемого отсчёта от пленения Иехонии.
- source_word: בַּחֲמִשִׁי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: в пятый месяц, в десятый день месяца
  rationale: Формальная датировка передана близко к еврейской структуре и при этом ясно по-русски.
- source_word: בָּאוּ אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: несколько старейшин Израиля пришли
  rationale: Буквально «люди из старейшин Израиля» указывает на отдельных представителей из их числа. «Несколько старейшин» естественно передаёт это значение, не подразумевая весь совет.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: вопросить Яхве
  rationale: В данном контексте דרש означает официальное обращение за Божьим ответом или указанием; «вопросить» сохраняет эту специальную окраску.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: וַיֵּשְׁבוּ לְפָנָי
  choice: и сели передо мной
  rationale: Прямо передаёт как позу старейшин, так и их официальное присутствие перед пророком.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя сохранено как имя, а не заменено титулом.
- issue: Уточнение точки отсчёта «седьмого года»
  choice: Не добавлять пояснение в основной текст
  alternative: в седьмой год пленения царя Иехонии
  rationale: Исторический контекст позволяет установить вероятную систему датировки, однако сам стих её прямо не называет.
- issue: Характер обращения старейшин к Богу
  choice: вопросить Яхве
  alternative: искать Яхве
  rationale: Контекст прихода к пророку указывает на ожидание ответа или указания от Бога, но примечание сохраняет более широкую лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Формула даты сохранена в несколько торжественном виде; архаизирующее «вопросить» употреблено осознанно как краткий термин для официального обращения за Божьим ответом.
