id: EZK.20.12
reference: Ezekiel 20:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/גַ֤ם אֶת שַׁבְּתוֹתַ/י֙ נָתַ֣תִּי לָ/הֶ֔ם לִ/הְי֣וֹת לְ/א֔וֹת בֵּינִ֖/י וּ/בֵֽינֵי/הֶ֑ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/012.yaml
  text: I also gave them my Sabbaths to be a sign between me and them[a], so that they might know that I am Yahweh who sanctifies them.
translation:
  language: ru
  text: И ещё Я дал им Мои субботы, чтобы они были знамением между Мной и ими, чтобы они знали, что Я — Яхве, освящающий их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делающий их святыми».'
    reason: Лексическая альтернатива передаёт смысл קדשׁ более разъяснительно.
lexical_decisions:
- source_word: וְגַם
  choice: И ещё Я
  rationale: Сохраняет присоединительное значение сочетания и естественно продолжает перечисление в русском тексте.
- source_word: שַׁבְּתוֹתַי
  choice: Мои субботы
  rationale: Прямо передаёт форму множественного числа с суффиксом первого лица и допускает значение как отдельных суббот, так и совокупности субботних установлений.
- source_word: נָתַתִּי לָהֶם
  choice: дал им
  rationale: Естественная и точная передача глагола נתן с косвенным дополнением.
- source_word: לִהְיוֹת לְאוֹת
  choice: чтобы они были знамением
  rationale: Передаёт целевое значение инфинитивной конструкции; местоимение во множественном числе согласовано с «субботы», тогда как «знамением» сохраняет единственное число еврейского אוֹת.
- source_word: בֵּינִי וּבֵינֵיהֶם
  choice: между Мной и ими
  rationale: Формально сохраняет обе стороны отношения и близко следует еврейской формуле; несколько торжественный оборот уместен для библейского регистра.
- source_word: לָדַעַת
  choice: чтобы они знали
  rationale: Ясно выражает цель, заложенную в конструкции с לְ, без добавления оттенков возможности или предположительности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מְקַדְּשָׁם
  choice: освящающий их
  rationale: Причастная форма сохраняет характеристику продолжающегося или постоянного действия Бога и ключевой смысл קדשׁ — делать святыми, отделять как святых.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение מְקַדְּשָׁם в контексте завета
  choice: освящающий их
  alternative: делающий их святыми; отделяющий их как святых
  rationale: «Освящающий» сохраняет богословскую ёмкость корня קדשׁ, не уточняя сверх текста, идёт ли речь прежде всего о придании святости или об отделении для Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Заглавные буквы в местоимениях, относящихся к Богу, использованы как принятая русская религиозно-издательская норма; синтаксис остаётся ясным для широкого читателя.
