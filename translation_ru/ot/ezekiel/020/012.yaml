  source_fidelity: Перевод точно передаёт присоединительное וְגַם («И ещё»), множественное «Мои субботы», дарование Израилю, функцию суббот как знамения между Яхве и народом и целевую конструкцию «чтобы они знали». Причастие «освящающий их» адекватно передаёт מְקַדְּשָׁם как характеристику продолжающегося действия.
  naturalness: Текст звучит как современный литературный русский с уместным умеренно библейским регистром. Повтор «чтобы» несколько подчёркивает две целевые конструкции оригинала и не препятствует пониманию. Связь первого «они» с «субботами», а второго — с народом определяется смыслом и контекстом.
  terminology: «Яхве» последовательно передаёт тетраграмматон как имя. «Субботы», «знамение» и «освящающий» сохраняют ключевую лексику и регистр исходного текста. Сноска предлагает допустимое разъясняющее соответствие для קדשׁ, не навязывая богословского истолкования.
