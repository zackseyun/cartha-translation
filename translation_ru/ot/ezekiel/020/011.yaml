  text: וָ/אֶתֵּ֤ן לָ/הֶם֙ אֶת חֻקּוֹתַ֔/י וְ/אֶת מִשְׁפָּטַ֖/י הוֹדַ֣עְתִּי אוֹתָ֑/ם אֲשֶׁ֨ר יַעֲשֶׂ֥ה אוֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֥י בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/011.yaml
  text: I gave them my statutes[a], and I made my judgments known to them, which, if a man does them, he will live by them.
translation:
  language: ru
  text: Я дал им Мои установления и возвестил им Мои законы, исполняя которые человек будет жить благодаря им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Я дал
  rationale: Прямо передаёт обычное значение נתן в контексте дарования народу Божьих предписаний.
- source_word: חֻקּוֹתַי
  choice: Мои установления
  rationale: Сохраняет смысл предписанных норм и отличается от следующего юридического термина מִשְׁפָּטַי.
- source_word: מִשְׁפָּטַי
  choice: Мои законы
  rationale: Естественно передаёт здесь нормативно-правовой смысл מִשְׁפָּטִים, не сливая его полностью с «установлениями».
- source_word: הוֹדַעְתִּי אוֹתָם
  choice: возвестил им
  rationale: Передаёт каузативное значение «сделал известными» в естественной и достойной русской форме; местоименное дополнение ясно из «Мои законы».
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם
  choice: исполняя которые
  rationale: Передаёт относительную связь с предписаниями и обычный для закона смысл עשׂה — соблюдать, исполнять — без добавления явно выраженного условия.
- source_word: הָאָדָם
  choice: человек
  rationale: Русское «человек» естественно передаёт собирательно-представительный единственный род еврейского הָאָדָם без неоправданного ограничения только мужчинами.
- source_word: וָחַי בָּהֶם
  choice: будет жить ими
  rationale: Сохраняет формулу жизни, связанной с исполнением предписаний, и воспроизводит неоднозначность בָּהֶם, не уточняя её как временную, духовную или эсхатологическую.
theological_decisions:
- issue: Характер жизни, обещанной в формуле послушания
  choice: будет жить ими
  alternative: обретёт благодаря им земное благополучие; получит через их исполнение вечную жизнь
  rationale: Еврейский текст не уточняет полный объём понятия «жить». Буквенно естественная формулировка сохраняет возможные личный, общинный, временный и эсхатологический оттенки, не разрешая богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством библейской юридико-заветной речи. Прописные буквы в «Мои» отражают обращение Бога к Израилю. Причастно-деепричастная конструкция делает длинное еврейское относительное предложение естественным по-русски.
