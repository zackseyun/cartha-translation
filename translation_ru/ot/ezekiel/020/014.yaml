base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/014.yaml
  text: But I acted for the sake of my name[a], so that it would not be profaned in the sight of the nations[b], in whose sight I had brought them out.
translation:
  language: ru
  text: Но Я поступил так ради Моего имени[a], чтобы оно не было осквернено перед народами[b], на глазах у которых Я вывел их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради чести Моего имени».'
    reason: lexical_alternative
  - marker: b
    text: «Осквернить» здесь означает обойтись со святым как с чем-то обычным.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱשֶׂה
  choice: Но Я поступил так
  rationale: Широкое значение עשה здесь передаёт решительное действие Бога; союз ו по контексту противопоставляет это действие ранее объявленному суду.
- source_word: לְמַעַן שְׁמִי
  choice: ради Моего имени
  rationale: Сохраняет еврейскую формулу, указывающую на святость и публичную честь Божьего имени, без избыточного истолкования.
- source_word: לְבִלְתִּי הֵחֵל
  choice: чтобы оно не было осквернено
  rationale: Конструкция выражает предотвращаемый результат; пассивная форма естественна по-русски при подразумеваемом объекте «имя» и сохраняет смысл лишения святости.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: на глазах у народов
  rationale: Естественная современная формулировка сохраняет образ видимого, публичного действия.
- source_word: הַגּוֹיִם
  choice: народов
  rationale: В данном контексте речь идёт об окружающих народах; вариант «язычников» мог бы привнести более поздние религиозные оттенки.
- source_word: אֲשֶׁר הוֹצֵאתִים לְעֵינֵיהֶם
  choice: на глазах у которых Я вывел их
  rationale: Каузатив от יצא передан как «вывел»; повтор выражения «на глазах» сохраняет намеренный акцент еврейского текста на публичности исхода.
theological_decisions:
- issue: Смысл действия Бога «ради Моего имени»
  choice: Сохранена формула «ради Моего имени», подразумевающая защиту святости и публичной чести Божьего имени среди народов.
  alternative: Развернуть смысл как действие ради Божьей репутации.
  rationale: В книге Иезекииля имя Бога связано с Его явленным характером и святостью, а не с поверхностной заботой о репутации; буквенно-идиоматическая передача сохраняет богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Написание «Я», «Моего» и «оно» отражает традиционное почтительное оформление речи Бога; повтор «на глазах» сознательно сохраняет риторический акцент исходного текста.
