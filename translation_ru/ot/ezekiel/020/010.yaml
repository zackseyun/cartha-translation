  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹוצִיאֵם
  choice: И Я вывел их
  rationale: Глагол יצא в породе хифиль с субъектом 1-го лица ед. числа и объектом 3-го лица мн. числа означает «вывести». Союз ו передаёт последовательность повествования естественным русским «и».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняется явно выраженное אֶרֶץ («земля»); традиционная и понятная формула «земля Египетская» поддерживает библейскую перекличку с повествованием об исходе.
- source_word: וָאֲבִאֵם
  choice: и привёл их
  rationale: Глагол בוא в породе хифиль означает «привести, доставить». «Привёл» естественно по-русски и сохраняет направленное действие, не добавляя идеи сопровождения, которой форма сама по себе не требует.
- source_word: אֶל הַמִּדְבָּר
  choice: в пустыню
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; сочетание אֶל с глаголом движения естественно передаётся русским «в пустыню».
