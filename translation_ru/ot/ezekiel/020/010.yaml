translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавное «Я» указывает на говорящего Бога в непосредственном контексте. Синтаксический параллелизм двух действий сохранён, при этом выбраны разные естественные русские глаголы: «вывел» и «привёл».'
