  text: וַ/יַּמְרוּ בִ֨/י בֵֽית יִשְׂרָאֵ֜ל בַּ/מִּדְבָּ֗ר בְּ/חֻקּוֹתַ֨/י לֹא הָלָ֜כוּ וְ/אֶת מִשְׁפָּטַ֣/י מָאָ֗סוּ אֲשֶׁר֩ יַעֲשֶׂ֨ה אֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם וְ/אֶת שַׁבְּתֹתַ֖/י חִלְּל֣וּ מְאֹ֑ד וָ/אֹמַ֞ר לִ/שְׁפֹּ֨ךְ חֲמָתִ֧/י עֲלֵי/הֶ֛ם בַּ/מִּדְבָּ֖ר לְ/כַלּוֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/013.yaml
  text: But the house of Israel rebelled against me in the wilderness[a]. They did not walk in my statutes, and they rejected my judgments, which if a person does them, he will live by them. They greatly profaned my Sabbaths. Then I said I would pour out my wrath on them in the wilderness[c][b], to put an end to them.
translation:
  language: ru
  text: Но дом Израиля восстал против Меня в пустыне. Они не следовали Моим установлениям и отвергли Мои законы[b] — те, исполняя которые, человек[a] будет жить[c]. Они тяжко оскверняли Мои субботы. Тогда Я сказал, что изолью на них Мою ярость в пустыне, чтобы истребить их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте употреблено слово «человек» в единственном числе, имеющее здесь обобщающий смысл: жить будет всякий, кто исполняет эти законы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мои правовые постановления».'
    reason: lexical_alternative
  - marker: c
    text: Эта формулировка перекликается с Левитом 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: восстал против Меня
  rationale: Глагол מרה с предлогом ב выражает направленный против Бога мятеж; «восстал против Меня» сохраняет силу заветного неповиновения.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено характерное для пророческой речи собирательное наименование народа.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и естественное русское соответствие для מִדְבָּר в контексте странствования Израиля.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: не следовали Моим установлениям
  rationale: Русское «следовали» естественно передаёт древнееврейскую метафору хождения, а «установления» отражает חֻקּוֹת без архаической тяжеловесности.
- source_word: מִשְׁפָּטַי
  choice: Мои законы
  rationale: В данном заветно-правовом контексте «законы» понятно современному читателю и сохраняет нормативный смысл; возможное более буквальное «судебные решения» отмечено в сноске.
- source_word: מָאָסוּ
  choice: отвергли
  rationale: Передаёт сознательный отказ без излишнего усиления до эмоционального презрения.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָּהֶם
  choice: те, исполняя которые человек будет жить
  rationale: Сохранены общий смысл единственного числа и открытость выражения «будет жить»; формулировка не сужает обещание до одной заранее выбранной богословской трактовки.
- source_word: הָאָדָם
  choice: человек
  rationale: Русское «человек» естественно передаёт родовое единственное число и включает всякого исполняющего эти предписания.
- source_word: שַׁבְּתֹתַי
  choice: Мои субботы
  rationale: Сохранены множественное число и значение суббот как знака завета.
- source_word: חִלֵּלוּ מְאֹד
  choice: тяжко оскверняли
  rationale: «Оскверняли» точно передаёт значение חלל в пиэле, а «тяжко» — усилитель מְאֹד в достойном пророческом регистре.
- source_word: לִשְׁפֹּךְ חֲמָתִי
  choice: изолью на них Мою ярость
  rationale: Сохранён образ излияния и интенсивность חֵמָה; русская конструкция ясно выражает намерение после וָאֹמַר.
- source_word: לְכַלּוֹתָם
  choice: чтобы истребить их
  rationale: Передаёт значение полного уничтожения или прекращения существования, выраженное כלה в данном контексте.
theological_decisions:
- issue: Родовое единственное число הָאָדָם в формуле жизни
  choice: человек будет жить
  alternative: кто исполнит их, тот будет жить
  rationale: «Человек» сохраняет грамматическое единственное число и одновременно естественно выражает общий, а не исключительно мужской смысл.
- issue: Смысл וָחַי בָּהֶם
  choice: будет жить
  alternative: обретёт через них жизнь
  rationale: Более краткая формулировка сохраняет заветную формулу и её богословское напряжение, не уточняя без достаточных оснований характер или пределы обещанной жизни.
- issue: Степень окончательности לְכַלּוֹתָם
  choice: чтобы истребить их
  alternative: чтобы положить им конец
  rationale: Выбран прямой смысл глагола в контексте излияния Божьей ярости, без добавления представлений о посмертной участи.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Метафора «ходить в установлениях» передана естественным «следовать установлениям»; традиционные термины «дом Израиля», «субботы», «изолью ярость» сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы.
