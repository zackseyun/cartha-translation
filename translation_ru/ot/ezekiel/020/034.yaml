base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/034.yaml
  text: I will bring you out from the peoples and gather you from the lands where you have been scattered[c][b][a], with a strong hand and an outstretched arm and with wrath poured out.
translation:
  language: ru
  text: Я выведу вас из среды народов и соберу вас из стран, по которым вы были рассеяны, — могучей рукой и простёртой мышцей[a], с излитой яростью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёртой рукой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с излитым гневом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Я выведу
  rationale: Hiphil от יצא имеет каузативное значение «вывести»; русский глагол естественно передаёт действие Бога и сохраняет отзвук исхода.
- source_word: הָעַמִּים
  choice: из среды народов
  rationale: עַמִּים — множественное число «народы»; оборот «из среды» ясно выражает исход из их окружения, не отождествляя народы с современными государствами.
- source_word: וְקִבַּצְתִּי
  choice: и соберу
  rationale: קבץ — обычный глагол собирания рассеянных; «соберу» точно и естественно в данном контексте.
- source_word: הָאֲרָצוֹת
  choice: из стран
  rationale: Во множественном числе אֲרָצוֹת обозначает территории или страны рассеяния; «страны» звучит в современном русском естественнее, чем «земли».
- source_word: אֲשֶׁר נְפוֹצֹתֶם בָּם
  choice: по которым вы были рассеяны
  rationale: Niphal от פוץ передаёт пассивное рассеяние; предлог בָּם здесь естественно выражен как «по которым».
- source_word: בְּיָד חֲזָקָה
  choice: рукою крепкою
  rationale: Буквально «крепкой/сильной рукой». Слегка возвышенная форма сохраняет узнаваемую формулу исхода и параллелизм со «простёртою мышцею».
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: и простёртою мышцею
  rationale: Устойчивое библейское выражение решительного Божьего действия; «мышца» здесь обозначает силу и сохраняет традиционный образ, пояснённый в сноске.
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: изливая Свой гнев
  rationale: חֵמָה означает гнев или ярость, а שְׁפוּכָה — «излитый». Деепричастный оборот естественно передаёт еврейскую инструментальную конструкцию, сохраняя образ излияния гнева.
theological_decisions:
- issue: Образ нового исхода в контексте одновременно собирания и суда
  choice: Сохранены формула «рукою крепкою и простёртою мышцею» и прямое указание на изливаемый Божий гнев.
  alternative: Передать собирание только как спасительное избавление и смягчить упоминание гнева.
  rationale: В Иезекииле 20 образ исхода соединяет освобождение с Божьим судом. Перевод не должен устранять эту намеренную напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской ритмикой. Архаизирующие формы «рукою… простёртою мышцею» употреблены точечно ради устойчивой формулы исхода; значение «мышцы» пояснено в сноске.
