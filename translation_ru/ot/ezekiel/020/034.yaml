revisions:
- from: Я выведу вас из среды народов и соберу вас из стран, по которым вы были рассеяны, — рукою крепкою и простёртою мышцею[a], изливая Свой гнев[b].
  to: Я выведу вас из среды народов и соберу вас из стран, по которым вы были рассеяны, — могучей рукой и простёртой мышцей[a], с излитой яростью[b].
  rationale: Исправление восстанавливает в русском тексте трёхчастный параллелизм еврейских инструментальных оборотов и буквально передаёт «ярость/гнев, излитый». Современные падежные формы заменяют точечную архаизацию, не устраняя традиционный библейский образ «могучей руки и простёртой мышцы».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:44:46Z'
review_pass:
  verdict: revise
  source_fidelity: Начальные два глагола и указание на народы/страны переданы точно. Однако וּבְחֵמָה שְׁפוּכָה — именная инструментальная конструкция «с излитой яростью/гневом», а не деепричастие «изливая Свой гнев»; последнее несколько меняет синтаксический образ и явнее приписывает действие субъекту. Исправленный вариант сохраняет три параллельных обстоятельства с предлогом «с».
  naturalness: «Рукою крепкою и простёртою мышцею» намеренно библейски возвышенно, но для современного литературного русского чрезмерно архаично по формам. «Могучей рукой и простёртой мышцей» сохраняет образ и высокий пророческий регистр без устаревших окончаний.
  terminology: «Народы», «страны», «соберу», «могучая рука», «простёртая мышца» и «излитая ярость» адекватно передают лексику и исходный образ. «Ярость» — допустимый эквивалент חֵמָה; она сохраняет силу суда. Сноска к «мышце» должна быть сугубо лексической, без избыточного толкования.
  issues:
  - severity: medium
    issue: «изливая Свой гнев» вместо «с излитой яростью/гневом»
    rationale: Еврейское וּבְחֵמָה שְׁפוּכָה состоит из предлога בְּ, существительного и причастия; оно параллельно «сильною рукой» и «простёртой мышцей». Деепричастная конструкция допустима как толкование, но менее точно передаёт форму и параллелизм.
  - severity: low
    issue: Архаические формы «рукою крепкою… простёртою мышцею»
    rationale: Они понятны и традиционны, но не вполне соответствуют заявленному современному литературному варианту. Современные формы сохраняют возвышенный библейский регистр.
  - severity: low
    issue: Сноска a содержит толковательное пояснение
    rationale: Анкер предназначен для лексической альтернативы; достаточно указать вариант «простёртая рука». Объяснение образа не необходимо для понимания и выходит за пределы лексической сноски.
