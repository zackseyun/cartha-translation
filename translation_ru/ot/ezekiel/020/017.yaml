  text: But my eye spared them from destroying them[a], and I did not make a complete end of them in the wilderness.
translation:
  language: ru
  text: Но Моё око пощадило их, не дав Мне уничтожить их, и Я не истребил их полностью в пустыне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּחָס עֵינִי עֲלֵיהֶם
  choice: Моё око пощадило их
  rationale: 'Сохранён конкретный антропоморфный образ еврейского текста: подлежащее — «Моё око», а глагол חוס выражает жалость, пощаду и сострадательное удержание от кары.'
- source_word: מִשַּׁחֲתָם
  choice: не дав погубить их
  rationale: Предлог מן с инфинитивом שׁחת и суффиксом 3-го лица множественного числа указывает на удержание от их погубления. Такая передача естественна по-русски и связывает оборот с предшествующим «пощадило».
- source_word: וְלֹא עָשִׂיתִי אוֹתָם כָּלָה
  choice: и Я не истребил их полностью
  rationale: Идиома עשה כלה означает довести уничтожение до конца, полностью истребить. Русская формулировка передаёт смысл ясно и без ненужной архаизации.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: «Пустыня» — естественное и традиционно понятное русское обозначение מדבר в контексте исхода Израиля.
theological_decisions:
- issue: Антропоморфный образ Божьего сострадания
  choice: Сохранить выражение «Моё око пощадило их».
  alternative: «Я пощадил их»; «Я взглянул на них с жалостью».
  rationale: В еврейском тексте сострадательное удержание Бога от суда намеренно выражено телесным образом. Его сохранение поддерживает риторическую выразительность и не устраняет заложенное в тексте напряжение между судом и милостью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Слово «око» сохранено ради устойчивого и выразительного антропоморфного образа; остальная фраза сформулирована естественно и ясно.
