source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/עֲשׂוֹתִ֥/י אִתְּ/כֶ֖ם לְמַ֣עַן שְׁמִ֑/י לֹא֩ כְ/דַרְכֵי/כֶ֨ם הָ/רָעִ֜ים וְ/כַ/עֲלִילֽוֹתֵי/כֶ֤ם הַ/נִּשְׁחָתוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/044.yaml
  text: Then you will know that I am Yahweh[a], when I deal with you for the sake of my name, not according to your evil ways or according to your corrupt deeds, O house of Israel[b], declares the Lord GOD.
translation:
  language: ru
  text: И тогда вы узнаете, что Я — Яхве, когда Я поступлю с вами[a] ради Моего имени[b], а не по вашим злым путям и порочным делам, о дом Израиля, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Я буду действовать по отношению к вам». Еврейское выражение имеет широкий смысл и здесь не уточняет характер Божьего действия.'
    reason: lexical_alternative
  - marker: b
    text: То есть ради чести и доброй славы, связанных с Его именем.
    reason: cultural_note
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: И тогда вы узнаете
  rationale: Форма с союзом в пророческой речи передаёт будущий результат; «тогда» естественно выражает следствие, а «и» сохраняет связь с предшествующим контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בַּעֲשׂוֹתִי אִתְּכֶם
  choice: когда Я поступлю с вами
  rationale: Оборот описывает действие Бога по отношению к Израилю, не уточняя, является ли оно наказанием, восстановлением или сочетает оба аспекта.
- source_word: לְמַעַן שְׁמִי
  choice: ради Моего имени
  rationale: Сохраняет образ имени как выражения Божьей чести и репутации.
- source_word: לֹא כְדַרְכֵיכֶם הָרָעִים
  choice: а не по вашим злым путям
  rationale: «Пути» в пророческом нравственном контексте означают образ жизни и поведение; «по» передаёт меру, согласно которой Бог не станет воздавать.
- source_word: וְכַעֲלִילוֹתֵיכֶם הַנִּשְׁחָתוֹת
  choice: и растленным делам
  rationale: עֲלִילוֹת обозначает дела или поступки, а הַנִּשְׁחָתוֹת характеризует их как нравственно испорченные.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет коллективное обращение к народу Израиля; звательный смысл ясно выражен позицией обращения.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: Передаёт устойчивую пророческую формулу и различает титул אֲדֹנָי и личное имя יְהוָה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его отличие от титула אֲדֹנָי.
- issue: Характер Божьего действия в בַּעֲשׂוֹתִי אִתְּכֶם
  choice: когда Я поступлю с вами
  alternative: когда Я сделаю вам; когда Я поступлю с вами благосклонно
  rationale: Еврейский оборот широк по значению и сам по себе не определяет действие исключительно как наказание или милость; перевод сохраняет эту смысловую и богословскую напряжённость.
- issue: Смысл действия «ради Моего имени»
  choice: ради Моего имени
  alternative: ради чести Моего имени
  rationale: Буквенный образ сохранён в основном тексте, а подразумеваемая честь и репутация пояснены в сноске без сужения самого перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим регистром. Сохранены обращение «дом Израиля», образ «путей» и различие между титулом «Владыка» и именем «Яхве». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
