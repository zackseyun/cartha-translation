lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит очередное событие повествования. Формула «И было… слово» естественна для возвышенного современного русского языка и сохраняет структуру еврейского пророческого введения.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר יְהוָה обозначает конкретное Божье откровение; «слово» точнее сохраняет формулу оригинала, чем более толковое «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямое и естественное соответствие предлогу с суффиксом первого лица единственного числа.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит содержание последующей речи. В современном русском языке эту функцию естественно выполняет двоеточие; буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом; примечание сообщает читателю о традиционной передаче.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Устойчивая формула сохранена без архаизмов; לֵאמֹר передано функционально двоеточием.
