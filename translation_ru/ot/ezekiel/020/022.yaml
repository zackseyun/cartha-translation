  text: וַ/הֲשִׁבֹ֨תִי֙ אֶת יָדִ֔/י וָ/אַ֖עַשׂ לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/022.yaml
  text: But I held back my hand[a], and I acted for the sake of my name, so that it would not be profaned in the sight of the nations[b], before whose eyes I had brought them out.
translation:
  language: ru
  text: Но Я удержал Свою руку[a] и действовал ради Моего имени, чтобы оно не было осквернено[b] перед глазами народов — тех, перед глазами которых Я вывел их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвёл Свою руку» / «вернул Свою руку». Еврейская идиома означает, что Бог воздержался от исполнения суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы не осквернять [его]»; подразумевается Божье имя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי אֶת־יָדִי
  choice: Я удержал Свою руку
  rationale: Еврейская идиома буквально говорит о возвращении или отведении руки, а в данном контексте означает воздержание от исполнения объявленного суда. Перевод сохраняет образ руки и естественно передаёт сдерживание действия.
- source_word: וָאַעַשׂ
  choice: и поступил так
  rationale: Глагол עשה имеет широкое значение «делать, поступать». Здесь он обозначает избранный Богом образ действий; «поступил так» естественно связывает его с удержанием руки, не добавляя новых смыслов.
- source_word: לְמַעַן שְׁמִי
  choice: ради Моего имени
  rationale: Сохранено прямое упоминание Божьего имени и связанный с ним смысл Его чести перед народами; оно не заменено толкованием «ради Моей репутации».
- source_word: לְבִלְתִּי הֵחֵל
  choice: чтобы оно не было осквернено
  rationale: Подразумеваемый объект — Божье имя из предыдущей фразы. Пассивная формулировка ясна по-русски и сохраняет религиозный смысл осквернения святого имени.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: на глазах у народов
  rationale: Передаёт публичность происходящего и сохраняет исходный образ глаз.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם לְעֵינֵיהֶם
  choice: на глазах у которых Я вывел их
  rationale: Сохранены значение каузативной формы «вывел» и повтор образа «на глазах», присутствующий в еврейском тексте.
theological_decisions:
- issue: Удержание Божьей руки после угрозы суда
  choice: Бог удержал Свою руку, то есть воздержался от исполнения объявленного суда.
  alternative: Бог отвёл или возвратил Свою руку.
  rationale: Перевод сохраняет метафору руки, но не превращает её в буквальное физическое движение и не добавляет доктринального объяснения.
- issue: Значение выражения «Моё имя»
  choice: Сохранено «Моё имя».
  alternative: Моя честь; Моя репутация.
  rationale: Так передаётся буквальное и богословски значимое выражение оригинала, а контекст народов показывает его публичный аспект.
- issue: Подразумеваемый объект осквернения
  choice: Местоимение «оно» прямо относится к Божьему имени.
  alternative: 'Оставить объект невыраженным: «чтобы не осквернить».'
  rationale: Русское предложение требует большей ясности; явное местоимение раскрывает грамматически подразумеваемую связь, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Образ руки и повтор выражения «на глазах» сохранены, хотя повтор слегка тяжелее обычной русской прозы, поскольку он заметен и смыслообразующ в оригинале.
