  text: אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/חֻקּוֹתַ֖/י לֵ֑כוּ וְ/אֶת מִשְׁפָּטַ֥/י שִׁמְר֖וּ וַ/עֲשׂ֥וּ אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/019.yaml
  text: I am Yahweh your God; walk in my statutes[a], and keep my judgments and do them.
translation:
  language: ru
  text: Я — Яхве, ваш Бог. Живите по Моим установлениям, соблюдайте Мои постановления и исполняйте их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: В сочетании с Яхве и при обращении к Израилю форма означает единственного Бога; суффикс указывает на второе лицо множественного числа.
- source_word: בְּחֻקּוֹתַי לֵכוּ
  choice: живите по Моим установлениям
  rationale: Сочетание הלך с בְּ и חֻקּוֹת описывает образ жизни, сообразный Божьим предписаниям. Буквальное «ходите» в современном русском здесь звучало бы менее естественно и могло бы восприниматься пространственно.
- source_word: מִשְׁפָּטַי
  choice: Мои постановления
  rationale: Слово обозначает обязательные правовые решения и нормы; «постановления» сохраняет юридический оттенок и естественно звучит по-русски.
- source_word: שִׁמְרוּ
  choice: соблюдайте
  rationale: В контексте заповедей שׁמר означает хранить верность предписаниям, то есть соблюдать их.
- source_word: וַעֲשׂוּ אוֹתָם
  choice: и исполняйте их
  rationale: Передаёт требование не только признавать предписания, но и осуществлять их на деле.
- source_word: אֲנִי
  choice: Я —
  rationale: Самостоятельное местоимение имеет подчёркнутый характер; конструкция с тире естественно передаёт именное предложение в современном русском.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст прямо употребляет личное имя Бога. «Яхве» передаёт его как имя, тогда как «Господь» является заменой титулом, а «Иегова» отражает более позднюю гибридную традицию произношения.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Сохранён повелительный и заветный характер речи; еврейская идиома «ходить в установлениях» естественно передана как «жить по установлениям».
