base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/031.yaml
  text: And when you present your gifts[a], when you make your sons pass through the fire, you defile yourselves with all your idols to this day. And shall I be inquired of by you, O house of Israel? As I live, declares the Lord GOD[c][b], I will not be inquired of by you.
translation:
  language: ru
  text: Принося свои дары и проводя своих сыновей через огонь[a], вы оскверняете себя всеми своими идолами по сей день[b]. И позволю ли Я вам вопрошать Меня, дом Израиля? Жив Я, — возвещает Владыка Яхве, — не позволю вам вопрошать Меня![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «проводить сыновей через огонь» обычно понимают как указание на детское жертвоприношение в идолопоклонническом культе; точный ритуальный механизм сам оборот не уточняет.
    reason: cultural_note
  - marker: b
    text: Еврейское слово, переведённое как «идолы», имеет резко презрительную окраску.
    reason: lexical_note
  - marker: c
    text: 'Буквально в еврейском тексте стоит клятвенная формула с «если»; здесь она выражает категорическое отрицание: «не позволю вам вопрошать Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׂאֵת מַתְּנֹתֵיכֶם
  choice: Принося свои дары
  rationale: Сочетание נשׂא с מַתָּנוֹת в культовом контексте означает преподнесение даров; «принося» естественно передаёт действие, а «дары» сохраняет прямое значение существительного.
- source_word: בְּהַעֲבִיר בְּנֵיכֶם בָּאֵשׁ
  choice: проводя своих сыновей через огонь
  rationale: Сохранена образная формулировка еврейского текста и мужской род בָּנִים; примечание поясняет связь выражения с жертвоприношением детей, не подменяя текст толкованием.
- source_word: אַתֶּם נִטְמְאִים
  choice: вы оскверняете себя
  rationale: Возвратная конструкция естественно передаёт становление ритуально и нравственно нечистыми вследствие собственных действий.
- source_word: לְכָל גִּלּוּלֵיכֶם
  choice: всеми своими идолами
  rationale: «Идолы» ясно передаёт референт; резко презрительная окраска характерного для Иезекииля слова גִּלּוּלִים отмечена в сноске.
- source_word: עַד הַיּוֹם
  choice: и по сей день
  rationale: Современное и естественное русское соответствие, указывающее на продолжение практики до времени пророческой речи.
- source_word: וַאֲנִי אִדָּרֵשׁ לָכֶם
  choice: И допущу ли Я, чтобы вы вопрошали Меня?
  rationale: Нифаль глагола דרשׁ применительно к Богу означает быть вопрошаемым, то есть позволить обращаться за божественным наставлением. Риторический вопрос сохранён, но выражен естественно по-русски.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено традиционное собирательное обращение к народу Израиля без добавочного междометия.
- source_word: חַי אָנִי
  choice: Жив Я!
  rationale: Формально и выразительно передана древнееврейская формула божественной клятвы.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передано глаголом торжественной пророческой речи; אֲדֹנָי — «Владыка», а личное имя יהוה транслитерировано как «Яхве».
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: Не допущу, чтобы вы вопрошали Меня!
  rationale: После формулы клятвы частица אִם вводит эллиптическое клятвенное отрицание. Явное отрицание передаёт его реальный смысл и силу, не создавая ложного условного значения.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Транслитерация сохраняет личное заветное имя, присутствующее в исходном тексте, а «Владыка» различает предшествующий титул אֲדֹנָי.
- issue: Пол обозначенных словом בְּנֵיכֶם жертв
  choice: своих сыновей
  alternative: своих детей
  rationale: Еврейский текст прямо употребляет форму мужского рода «сыновья»; более широкое «дети» не требуется контекстом.
- issue: Смысл проведения сыновей через огонь
  choice: образ исходного текста сохранён, а жертвенный смысл пояснён в сноске
  alternative: сжигая своих сыновей в огне
  rationale: Формулировка относится к детскому жертвоприношению, однако её точный ритуальный механизм в самом обороте не разъяснён; перевод не должен устранять эту формальную особенность.
- issue: Сила конструкции клятва + אִם
  choice: категорическое отрицание
  alternative: если Я позволю вам вопрошать Меня
  rationale: В древнееврейской клятвенной формуле условная часть эллиптически выражает решительное отрицание; буквальное «если» без подразумеваемого проклятия исказило бы смысл для современного читателя.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан понятным для широкого читателя, при этом сохранены риторический вопрос, формула клятвы, обращение «дом Израиля» и напряжение между желанием народа вопрошать Бога и Его категорическим отказом.
