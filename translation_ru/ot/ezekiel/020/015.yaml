source:
  edition: WLC
  text: וְ/גַם אֲנִ֗י נָשָׂ֧אתִי יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/בִלְתִּי֩ הָבִ֨יא אוֹתָ֜/ם אֶל הָ/אָ֣רֶץ אֲשֶׁר נָתַ֗תִּי זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/015.yaml
  text: Yet I myself also raised my hand to them in the wilderness[a], that I would not bring them into the land that I had given them, flowing with milk and honey[b], the glory of all lands.
translation:
  language: ru
  text: Но и Я поклялся им в пустыне[a], что не введу их в землю, которую дал им, — землю, текущую молоком и мёдом, красу всех земель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднял им (или: перед ними) Свою руку»; это жест принесения клятвы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «великолепие всех земель»; возможный смысл: «прекраснейшая среди всех земель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Но и Я
  rationale: Сохраняет добавочное значение גַם и лёгкий контраст с предшествующим контекстом; местоимение «Я» передаёт эмфатическое אֲנִי.
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: поклялся им
  rationale: Это устойчивый древнееврейский жестовый оборот со значением принесения клятвы. В современном русском буквальное «поднял им руку» не передаёт это значение ясно и может быть понято неверно.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и понятное обозначение необжитой пустынной местности, где находился Израиль.
- source_word: לְבִלְתִּי הָבִיא אוֹתָם
  choice: что не введу их
  rationale: Передаёт содержание клятвы и направленное движение в землю естественным русским оборотом.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי
  choice: землю, которую дал им
  rationale: «Дал» прямо передаёт נָתַתִּי; дополнение «им» естественно восстанавливает из контекста получателей обещанной земли.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: текущую молоком и мёдом
  rationale: Сохраняет образное выражение оригинала в устойчивой и понятной русской форме.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: красу всех земель
  rationale: «Краса» передаёт красоту, великолепие и желанность земли, не превращая образную характеристику в явную превосходную степень.
theological_decisions:
- issue: Передавать ли נָשָׂאתִי יָדִי буквально как жест или раскрыть значение клятвы
  choice: В основном тексте передать как «поклялся им»
  alternative: «поднял руку перед ними»
  rationale: Клятвенное значение идиомы устойчиво, тогда как буквальная калька в современном русском двусмысленна и способна вызвать ложную ассоциацию с угрозой или голосованием. Буквальный образ сохранён в сноске.
- issue: Понимание נָתַתִּי как совершившегося дара или обещанного дара
  choice: «дал им»
  alternative: «обещал им дать»
  rationale: Перевод сохраняет прямое значение глагола «дать» и не сводит его исключительно к обещанию; контекст допускает представление земли как уже дарованной Божьим постановлением.
- issue: Степень сравнения в צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: «краса всех земель»
  alternative: «прекраснейшая из всех земель»
  rationale: Предикативная конструкция возвышает эту землю среди прочих, но формально не содержит явной превосходной степени; образное выражение сохраняет напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Идиома клятвы раскрыта ради ясности, а её буквальный образ вынесен в сноску; образ «текущей молоком и мёдом» сохранён.
