  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/הֲבִיאִ֥/י אֶתְ/כֶ֖ם אֶל אַדְמַ֣ת יִשְׂרָאֵ֑ל אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לַ/אֲבֽוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/042.yaml
  text: Then you will know that I am Yahweh[a], when I bring you into the land of Israel, into the land that I lifted up my hand to give to your fathers.
translation:
  language: ru
  text: И узнаете, что Я — Яхве, когда приведу вас в землю Израиля — в ту землю, которую Я, подняв руку, поклялся отдать вашим отцам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: И узнаете
  rationale: Форма с союзом в пророческом контексте выражает будущий результат предшествующего Божьего действия; русское «и узнаете» естественно сохраняет связь с контекстом, не добавляя отсутствующее в тексте наречие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога и сохраняет его заветное значение.
- source_word: בַּהֲבִיאִי
  choice: когда приведу
  rationale: Инфинитивная конструкция с ב обозначает время или обстоятельство, при котором народ узнает Яхве.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: в землю Израиля
  rationale: В контексте возвращения אַדְמָה обозначает территорию, а не почву как вещество.
- source_word: הָאָרֶץ
  choice: в ту землю
  rationale: Указательное «ту» естественно связывает повторное обозначение земли с последующим определительным придаточным и сохраняет еврейский повтор.
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: Я, подняв руку, поклялся
  rationale: Сохраняет конкретный образ поднятой руки и одновременно ясно передаёт его устойчивое значение — принесение клятвы.
- source_word: לָתֵת אוֹתָהּ
  choice: отдать
  rationale: Передаёт נתן в значении дарования обещанной земли; отдельное местоимение избыточно, поскольку объект назван непосредственно перед этим.
- source_word: לַאֲבוֹתֵיכֶם
  choice: вашим отцам
  rationale: Точно сохраняет конкретное обозначение праотцов словом אָבוֹת, не заменяя его более широким «предкам».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Передача клятвенной формулы נָשָׂאתִי אֶת־יָדִי
  choice: 'Совместить образ и значение: «подняв руку, поклялся»'
  alternative: 'Буквально: «поднял руку, чтобы отдать»; идиоматически: «поклялся отдать»'
  rationale: Буквальная калька по-русски не обязательно сообщает читателю смысл жеста, а одно «поклялся» устраняет исходный образ. Совмещённая передача сохраняет оба элемента без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для широкого читателя; повтор слова «земля» сохранён. Местоимение «Я» написано с прописной буквы в соответствии с принятой русской библейской традицией.
