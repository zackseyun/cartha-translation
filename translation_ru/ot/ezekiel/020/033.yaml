  text: As I live[a], declares the Lord GOD, surely with a strong hand and an outstretched arm and with wrath poured out, I will reign over you.
translation:
  language: ru
  text: «Жив Я, — возвещает Владыка Яхве, — непременно крепкой рукой и простёртой рукой, излитым гневом Я буду царствовать над вами[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду править вами»; или: «буду Царём над вами». Еврейский глагол имеет значение царской власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Живу Я
  rationale: Сохраняет форму торжественной пророческой клятвы; её усилительное значение дополнительно передано словом «непременно» при אִם לֹא.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передаёт формулу божественного провозглашения, а сочетание титула אֲדֹנָי с личным именем יְהוִה — «Владыка Яхве», без неестественного повтора «Господь Господь».
- source_word: אִם לֹא
  choice: непременно
  rationale: В составе клятвы это не буквальное условие, а усилительная формула уверенного утверждения.
- source_word: בְּיָד חֲזָקָה
  choice: крепкой рукой
  rationale: Сохраняет инструментальный смысл и устойчивый исходный образ Божьей силы.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: простёртой мышцей
  rationale: Передаёт отдельный от יָד образ זרוע, избегая повтора слова «рука» и сохраняя традиционно-библейскую, но понятную лексику.
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: и излитым гневом
  rationale: Сохраняет образ гнева, который изливается, и инструментальную связь со сказуемым.
- source_word: אֶמְלֹךְ עֲלֵיכֶם
  choice: Я буду царствовать над вами
  rationale: Глагол מלך имеет именно царский смысл; «царствовать» яснее сохраняет его, чем более общее «править».
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул и личное имя Бога и непосредственно отражает наличие тетраграмматона в еврейском тексте.
- issue: Царская сила глагола אֶמְלֹךְ
  choice: буду царствовать над вами
  alternative: буду править вами; буду Царём над вами
  rationale: «Царствовать» сохраняет утверждение Божьей царской власти и не сглаживает напряжение контекста, где эта власть осуществляется посредством силы и гнева.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим строем. Инверсия «Живу Я» сохраняет формулу клятвы; «мышца» употреблена в традиционном возвышенном значении «рука, сила руки», чтобы различить два еврейских образа.
