  text: И Я также поднял Свою руку[a] в пустыне, поклявшись рассеять их среди народов и развеять по землям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднял Свою руку». Еврейская идиома принесения клятвы; возможно: «поклялся в пустыне рассеять их среди народов и развеять по землям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: И Я также
  rationale: Передаёт добавочное значение גַּם и эмфатически выраженное местоимение אֲנִי в последовательности Божьих заявлений.
- source_word: נָשָׂאתִי אֶת יָדִי לָהֶם
  choice: поднял им руку
  rationale: Сохраняет конкретный образ еврейской идиомы принесения клятвы; её смысл поясняется в сноске.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Естественное современное русское обозначение места странствования Израиля.
- source_word: לְהָפִיץ אֹתָם בַּגּוֹיִם
  choice: рассеять их среди народов
  rationale: Инфинитив выражает содержание клятвы; «народы» не привносит более поздних конфессиональных оттенков слова «язычники».
- source_word: וּלְזָרוֹת אוֹתָם בָּאֲרָצוֹת
  choice: и развеять по разным землям
  rationale: «Развеять» сохраняет образный оттенок זרה и отличает второй параллельный глагол от הפיץ; «по разным землям» естественно передаёт множественное число и пространственное распределение.
theological_decisions:
- issue: Передать ли идиому поднятия руки прямо как клятву
  choice: Сохранить в основном тексте образ «поднял им руку» и пояснить смысл клятвы в сноске
  alternative: «поклялся им»
  rationale: Так сохраняются и буквальный образ исходного текста, и его юридико-заветный смысл без молчаливой замены идиомы толкованием.
- issue: Синтаксическая роль לְהָפִיץ и וּלְזָרוֹת
  choice: 'Передать как содержание принесённой клятвы: «поклявшись рассеять… и развеять…»'
  alternative: 'Целевое прочтение: «чтобы рассеять… и развеять…»'
  rationale: В контексте поднятия руки инфинитивы естественно обозначают то, что Бог поклялся сделать; добавление «поклявшись» делает связь ясной по-русски, не устраняя сохранённую идиому.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским регистром. Заглавное «Я» обозначает говорящего Бога. Пара «рассеять… развеять» сохраняет параллелизм и различие двух еврейских глаголов.
