base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/007.yaml
  text: And I said to them[a], ‘Each man, throw away the detestable things before his eyes, and do not defile yourselves with the idols of Egypt[b]. I am Yahweh your God.’
translation:
  language: ru
  text: 'И Я сказал им: «Пусть каждый из вас отбросит мерзости, что у него перед глазами, и пусть не оскверняет себя идолами Египта. Я — Яхве, ваш Бог».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר אֲלֵהֶם
  choice: И Я сказал им
  rationale: Последовательная повествовательная форма передаёт продолжение рассказа; местоимение «Я» уместно как указание на говорящего Бога.
- source_word: אִישׁ ... הַשְׁלִיכוּ
  choice: Пусть каждый из вас отбросит
  rationale: אִישׁ употреблено дистрибутивно при обращении ко многим. Такая конструкция естественно передаёт личную ответственность каждого и согласуется с последующим множественным числом.
- source_word: שִׁקּוּצֵי עֵינָיו
  choice: мерзости, к которым обращены его глаза
  rationale: Сохраняется образ глаз и резко отрицательная оценка שִׁקּוּצִים, но неясная для современного русского буквальная конструкция «мерзости его глаз» раскрывается минимально. Контекст указывает на предметы идолопоклонства, однако это не подставлено прямо в данную фразу.
- source_word: הַשְׁלִיכוּ
  choice: отбросит
  rationale: Глагол выражает решительный отказ; «отбросить» звучит современно и сохраняет физическую образность исходного слова.
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: идолами Египта
  rationale: Основное значение передано ясно, а присущий слову презрительный оттенок отмечен в сноске, чтобы не навязывать спорную буквальную этимологизацию в основном тексте.
- source_word: אַל תִּטַּמָּאוּ
  choice: не оскверняйте себя
  rationale: Возвратная конструкция передаёт рефлексивный оттенок формы и сохраняет культово-нравственный смысл осквернения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: В сочетании с именем Яхве форма означает единственного Бога Израиля и подчёркивает отношения завета.
theological_decisions:
- issue: Толкование выражения שִׁקּוּצֵי עֵינָיו
  choice: мерзости, к которым обращены его глаза
  alternative: мерзости его глаз; отвратительные идолы, на которые он смотрит
  rationale: Выбранный вариант сохраняет образность и вероятную связь с предметами, привлекающими взгляд или желание, но не сводит неоднозначный оборот исключительно к зрительному действию либо к уже названным прямо идолам.
- issue: Передача полемического слова גִּלּוּלִים
  choice: идолы
  alternative: мерзкие идолы; навозные идолы
  rationale: «Идолы» ясно передаёт референт. Резко презрительная окраска слова сообщается в сноске; буквальное «навозные идолы» зависит от этимологического толкования и чрезмерно конкретизировало бы основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохраняет переход от дистрибутивного «каждый» к обращению во множественном числе, присутствующий в еврейском тексте.
