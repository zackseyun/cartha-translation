  text: וְ/הַעֲבַרְתִּ֥י אֶתְ/כֶ֖ם תַּ֣חַת הַ/שָּׁ֑בֶט וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם בְּ/מָסֹ֥רֶת הַ/בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/037.yaml
  text: I will make you pass under the rod[b][a], and I will bring you into the bond of the covenant.
translation:
  language: ru
  text: Я проведу вас под жезлом[a] и введу вас в узы завета[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «провести под жезлом», вероятно, напоминает о том, как пастух считал или осматривал овец, когда они проходили под его жезлом.
    reason: cultural_note
  - marker: b
    text: 'Или: «в оковы завета» либо «под обязательство завета». Редкое еврейское слово передаёт представление о том, что связывает или удерживает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: Я проведу
  rationale: Порода hифиль глагола עבר имеет каузативное значение. Русское «проведу вас» естественно передаёт действие, при котором Господь заставляет народ пройти указанным путём.
- source_word: תַּחַת הַשָּׁבֶט
  choice: под жезлом
  rationale: Слово שֵׁבֶט может означать жезл, посох или розгу. В данном образе речь, вероятно, идёт о пастушеском жезле, под которым проходили животные при подсчёте или осмотре; «жезл» сохраняет также оттенок власти и суда.
- source_word: וְהֵבֵאתִי
  choice: и введу
  rationale: Hифиль глагола בוא означает «привести, ввести». «Введу» естественно сочетается с направительным смыслом предлога בְּ и сохраняет параллелизм двух частей стиха.
- source_word: בְּמָסֹרֶת
  choice: в узы
  rationale: Редкое מָסֹרֶת обозначает то, что связывает или удерживает. «Узы» сохраняют метафору связанности и не сводят её только к физическим оковам либо к отвлечённой обязанности.
- source_word: הַבְּרִית
  choice: завета
  rationale: בְּרִית — обычное библейское обозначение завета; этот выбор сохраняет установленное богословское значение слова.
theological_decisions:
- issue: Смысл образа прохождения под жезлом и введения в узы завета
  choice: Сохранены одновременно мотивы властного испытания народа и его связывания обязательствами завета.
  alternative: Истолковать образ исключительно как карательное подчинение либо исключительно как восстановительное принятие в общение завета.
  rationale: Контекст и образы допускают как суд и отбор, так и возвращение под власть завета. Сам стих не требует устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. «Жезл» выбран вместо более бытового «посох», поскольку сохраняет пастушеский образ и оттенок власти; редкость исходного выражения передана сочетанием «узы завета» и пояснена в сноске.
