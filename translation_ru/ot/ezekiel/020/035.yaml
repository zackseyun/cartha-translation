  yaml_path: translation/ot/ezekiel/020/035.yaml
  text: I will bring you into the wilderness of the peoples[b][a], and there I will enter into judgment with you face to face.
translation:
  language: ru
  text: Я приведу вас в пустыню народов[a] и там буду судиться с вами, лицом к лицу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Пустыня народов» может означать подобное пустыне место среди народов, среди которых был рассеян Израиль.
    reason: cultural_note
  - marker: b
    text: 'Или: «буду судить вас». Еврейский глагол можно передать более просто как «судить», но данная конструкция также передаёт смысл судебного разбирательства с кем-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Я приведу
  rationale: Каузативная порода глагола בוא означает «привести, доставить». Будущее время естественно передаёт действие в данном пророческом контексте.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Местоименный суффикс прямого дополнения второго лица множественного числа.
- source_word: אֶל מִדְבַּר
  choice: в пустыню
  rationale: Предлог אֶל обозначает направление, а מִדְבָּר — пустынную, необрабатываемую местность, не обязательно песчаную пустыню. Формулировка также сохраняет связь с темой исхода.
- source_word: הָעַמִּים
  choice: народов
  rationale: Буквальное множественное число от עַם — «народ». Родительный падеж сохраняет необычный и допускающий несколько толкований образ «пустыни народов».
- source_word: וְנִשְׁפַּטְתִּי אִתְּכֶם
  choice: вступлю с вами в суд
  rationale: Нифаль глагола שׁפט с предлогом совместности выражает судебное разбирательство или тяжбу с кем-либо. Эта формулировка передаёт юридическую взаимонаправленность конструкции лучше, чем простое «буду судить вас».
- source_word: שָׁם
  choice: там
  rationale: Наречие места отсылает к только что названной пустыне.
- source_word: פָּנִים אֶל פָּנִים
  choice: лицом к лицу
  rationale: Буквально сохранён устойчивый оборот, подчёркивающий прямую, личную встречу.
theological_decisions:
- issue: Судебный оттенок действия Бога
  choice: вступлю с вами в суд
  alternative: буду судить вас
  rationale: Еврейская конструкция указывает не только на вынесение приговора, но и на непосредственное судебное разбирательство. Перевод сохраняет тон заветной тяжбы, не превращая образ в чрезмерно специальный юридический термин.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Необычный образ «пустыня народов» сохранён, а юридический оборот передан естественным русским выражением. Местоимение первого лица написано со строчной буквы по современной нейтральной орфографической норме.
