source:
  edition: WLC
  text: וָ/אֲטַמֵּ֤א אוֹתָ/ם֙ בְּ/מַתְּנוֹתָ֔/ם בְּ/הַעֲבִ֖יר כָּל פֶּ֣טֶר רָ֑חַם לְמַ֣עַן אֲשִׁמֵּ֔/ם לְמַ֨עַן֙ אֲשֶׁ֣ר יֵֽדְע֔וּ אֲשֶׁ֖ר אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/026.yaml
  text: And I defiled them through their gifts[a], by making every firstborn pass through the fire, so that I might devastate them[d][c][b], so that they might know that I am Yahweh.
translation:
  language: ru
  text: И Я осквернил их их же дарами, заставляя их проводить каждого первенца[a], чтобы привести их в запустение[b], чтобы они узнали, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждого открывающего утробу», то есть каждого первенца. Выражение «проводить» обозначает ритуальное действие и, вероятно, подразумевает проведение через огонь — принесение детей в жертву; ср. Иез 20:31.'
    reason: Буквальный смысл идиомы и её вероятный культовый контекст важны для понимания, однако слово «огонь» в самом стихе отсутствует.
  - marker: b
    text: 'Или: «чтобы опустошить их»; возможно также: «чтобы привести их в ужас».'
    reason: Глагол שמם допускает как значение опустошения, так и значение ужаса или потрясения.
lexical_decisions:
- source_word: וָאֲטַמֵּא
  choice: И Я осквернил
  rationale: Каузативная форма глагола טמא прямо приписывает действие Богу. «Осквернил» сохраняет культово-нравственный оттенок и не ослабляет трудную формулировку оригинала.
- source_word: בְּמַתְּנוֹתָם
  choice: их же дарами
  rationale: מַתָּנוֹת означает «дары» и в данном культовом контексте может подразумевать приношения. Частица «же» естественно подчёркивает, что средством осквернения стали их собственные дары.
- source_word: בְּהַעֲבִיר
  choice: заставляя проводить
  rationale: Инфинитив каузативной породы от עבר передаёт побуждение к проведению или перенесению. В основном тексте не добавлено отсутствующее здесь слово «огонь»; ритуальный смысл пояснён в сноске.
- source_word: כָּל פֶּטֶר רָחַם
  choice: каждого первенца
  rationale: Буквально выражение означает «каждого открывающего утробу» и служит устойчивым обозначением первенца. Естественный русский эквивалент помещён в текст, буквальный образ — в сноску.
- source_word: לְמַעַן אֲשִׁמֵּם
  choice: чтобы привести их в запустение
  rationale: Каузатив от שמם допускает значения «опустошить, привести в запустение» и «привести в ужас». Выбранное выражение сохраняет результат суда и не сводит смысл лишь к эмоциональному потрясению.
- source_word: לְמַעַן אֲשֶׁר יֵדְעוּ
  choice: и чтобы они узнали
  rationale: Передаёт целевую формулу, характерную для книги Иезекииля; повтор цели сохранён, но по-русски связан союзом «и».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Божественное действие в осквернении Израиля и в контексте принесения первенцев
  choice: 'Сохранено прямое высказывание от первого лица: «Я осквернил», а следующий каузатив передан как «заставляя проводить».'
  alternative: Смягчить до «Я допустил, чтобы они осквернились» или «Я предал их осквернению».
  rationale: Еврейский текст выражает божественное действие прямо и каузативно. Перевод не превращает его без явного основания лишь в допущение и тем самым сохраняет богословское напряжение текста.
- issue: Ритуальное «проведение» первенцев
  choice: В основном тексте оставлено «проводить», а вероятная связь с жертвоприношением детей и огнём пояснена в сноске.
  alternative: Добавить в основной текст «через огонь» либо перевести прямо как «приносить в жертву».
  rationale: В данном стихе слово «огонь» отсутствует, хотя контекст книги (в частности, Иез 20:31) поддерживает такую ритуальную ассоциацию. Сноска позволяет не скрывать контекст и одновременно не вносить его в текст как явно выраженное слово.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохраняет повтор целевых оборотов оригинала. Прямое божественное действие не смягчено; отсутствующее в еврейском тексте упоминание огня вынесено в сноску.
