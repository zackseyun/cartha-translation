  yaml_path: translation/ot/ezekiel/020/004.yaml
  text: Will you judge them? Will you judge[b][a], son of man? Make known to them the abominations of their fathers.
translation:
  language: ru
  text: Будешь ли ты судить их? Будешь ли судить, сын человеческий[a]? Дай им знать о мерзостях их отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Сын человеческий» — обычное обращение к Иезекиилю в этой книге; возможно также: «смертный» или «человек».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их предков». Буквально: «их отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁפֹּט / הֲתִשְׁפּוֹט
  choice: станешь ли ты судить / станешь ли судить
  rationale: Глагол שׁפט в породе qal здесь имеет судебное значение. Повтор сохранён как намеренное риторическое усиление.
- source_word: אֹתָם
  choice: их
  rationale: Прямое дополнение, в контексте указывающее на старейшин.
- source_word: בֶּן אָדָם
  choice: сын человеческий
  rationale: Сохранено характерное для книги Иезекииля обращение к пророку и его мужская форма; оно не истолковывается здесь как мессианский титул.
- source_word: תּוֹעֲבוֹת
  choice: мерзости
  rationale: Слово передаёт сильную нравственную и культовую оценку תּוֹעֵבָה, особенно значимую у Иезекииля.
- source_word: אֲבוֹתָם
  choice: их отцов
  rationale: Передана буквальная мужская родственная формулировка; более общее «предков» отмечено в сноске.
- source_word: הוֹדִיעֵם
  choice: дай им знать
  rationale: 'Оборот естественно передаёт каузативное значение породы hифиль: «сделай так, чтобы они узнали».'
theological_decisions:
- issue: Значение обращения בֶּן אָדָם
  choice: сын человеческий
  alternative: смертный; человек
  rationale: Это постоянное обращение Бога к Иезекиилю, подчёркивающее его человеческое положение. Формулировка сохраняет исходный образ, не привнося в этот стих позднейшего христологического смысла.
- issue: Передача אֲבוֹתָם
  choice: их отцов
  alternative: их предков
  rationale: Основной текст сохраняет буквальный родственный термин и тему унаследованной неверности; более широкое значение возможно и указано в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Намеренный повтор вопроса не сглажен; синтаксис слегка упорядочен для естественного русского звучания.
