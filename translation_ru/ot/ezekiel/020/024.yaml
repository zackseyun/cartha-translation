source:
  edition: WLC
  text: יַ֜עַן מִשְׁפָּטַ֤/י לֹֽא עָשׂוּ֙ וְ/חֻקּוֹתַ֣/י מָאָ֔סוּ וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וְ/אַחֲרֵי֙ גִּלּוּלֵ֣י אֲבוֹתָ֔/ם הָי֖וּ עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/024.yaml
  text: because they did not practice my judgments[a], and they rejected my statutes, and they profaned my Sabbaths, and their eyes were after the idols of their fathers.
translation:
  language: ru
  text: за то, что они не исполняли Моих постановлений, отвергли Мои установления, оскверняли Мои субботы, а их глаза были устремлены к идолам[a] их отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово גִּלּוּלִים — резко презрительное обозначение идолов; его можно передать как «мерзкие идолы» или даже «навозные идолы».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: за то, что
  rationale: Оборот вводит основание для предшествующего Божьего действия; по-русски «за то, что» естественно сохраняет причинно-обосновывающую связь фрагмента с контекстом.
- source_word: מִשְׁפָּטַי
  choice: Моих постановлений
  rationale: Слово обозначает обязательные правовые нормы завета. «Постановления» сохраняет юридический оттенок и отличается от следующего חֻקּוֹתַי.
- source_word: לֹא עָשׂוּ
  choice: не исполняли
  rationale: При объекте, обозначающем нормы и предписания, «исполнять» естественно передаёт смысл осуществления на деле.
- source_word: חֻקּוֹתַי
  choice: Мои установления
  rationale: Это устойчивый термин для предписанных норм завета; выбранное слово сохраняет отличие от מִשְׁפָּטַי без архаичного «уставы».
- source_word: מָאָסוּ
  choice: отвергли
  rationale: Глагол выражает сознательное неприятие и отвержение, а не просто неисполнение.
- source_word: שַׁבְּתוֹתַי
  choice: Мои субботы
  rationale: Прямо передаёт множественное число и заветное значение субботних дней.
- source_word: חִלֵּלוּ
  choice: оскверняли
  rationale: В породе пиэль глагол означает лишать святости, обращаться со святым как с обычным; «оскверняли» естественно сохраняет культовый и богословский вес.
- source_word: הָיוּ עֵינֵיהֶם אַחֲרֵי
  choice: их глаза были устремлены к
  rationale: Русский образный оборот передаёт буквальный образ глаз и выражаемую им внутреннюю направленность и влечение.
- source_word: גִּלּוּלֵי
  choice: идолам
  rationale: В основном тексте употреблено ясное современное обозначение; присущий еврейскому слову резко презрительный оттенок отражён в сноске.
- source_word: אֲבוֹתָם
  choice: их отцов
  rationale: Сохранено конкретное мужское родственное обозначение исходного текста, а не расширенное «предков».
theological_decisions:
- issue: Передача презрительного оттенка גִּלּוּלִים
  choice: идолам с пояснительной сноской
  alternative: мерзким идолам; навозным идолам
  rationale: Исходное слово намеренно уничижительно, но включение толкования непосредственно в строку сделало бы перевод более эксплицитным, чем текст. Сноска сохраняет значимый оттенок и не перегружает основной текст.
- issue: Передача אֲבוֹתָם
  choice: их отцов
  alternative: их предков
  rationale: Еврейский текст прямо употребляет форму «отцы»; её сохранение точнее передаёт семейно-поколенческую формулировку и не вводит более широкое понятие.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет зависимость стиха от предшествующего контекста; начальная строчная буква отражает то, что это продолжение предложения. Пара «постановления / установления» передаёт два близких, но различных термина закона завета.
