source:
  edition: WLC
  text: וְ/אַתֶּ֨ם בֵּֽית יִשְׂרָאֵ֜ל כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אִ֤ישׁ גִּלּוּלָי/ו֙ לְכ֣וּ עֲבֹ֔דוּ וְ/אַחַ֕ר אִם אֵינְ/כֶ֖ם שֹׁמְעִ֣ים אֵלָ֑/י וְ/אֶת שֵׁ֤ם קָדְשִׁ/י֙ לֹ֣א תְחַלְּלוּ ע֔וֹד בְּ/מַתְּנֽוֹתֵי/כֶ֖ם וּ/בְ/גִלּוּלֵי/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/039.yaml
  text: 'But as for you[a], house of Israel, thus says the Lord GOD: Go, each man, serve his idols—if afterward you will not listen to me[b]; but you shall no longer profane my holy name with your gifts and with your idols.'
translation:
  language: ru
  text: 'А вы, дом Израиля, — так говорит Владыка ГОСПОДЬ: «Идите, служите каждый своим идолам[a], если и впредь не будете слушать Меня[b]. Но святого имени Моего больше не оскверняйте своими дарами и своими идолами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «идолы», имеет резко презрительный оттенок; возможны передачи «мерзкие идолы» или «навозные идолы».
    reason: lexical_alternative
  - marker: b
    text: 'Или, при иной пунктуации: «Идите, служите каждый своим идолам; а после, если не будете слушать Меня…» Синтаксис еврейского текста после слова «служите» труден.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Самостоятельное местоимение с союзом вводит контрастное прямое обращение; «А вы» естественно передаёт этот поворот в русском.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет традиционное коллективное, заветное обозначение народа.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Передаёт составной титул без неестественного повтора «Господь ГОСПОДЬ» и отличает אֲדֹנָי от имени יהוה.
- source_word: אִישׁ גִּלּוּלָיו
  choice: каждый служите своим идолам
  rationale: Дистрибутивное אִישׁ передано словом «каждый»; множественное «своим идолам» естественно по-русски и соответствует собирательно-множественному גִּלּוּלָיו.
- source_word: גִּלּוּלִים
  choice: идолы
  rationale: Ясный основной эквивалент; резко презрительный оттенок еврейского слова отмечен в сноске.
- source_word: וְאַחַר אִם אֵינְכֶם שֹׁמְעִים אֵלָי
  choice: если и впредь не будете слушать Меня
  rationale: «И впредь» сохраняет временную направленность אַחַר, а условная конструкция и трудность синтаксиса не устраняются; שׁמע передано как «слушать», сохраняя подразумеваемый оттенок послушания.
- source_word: שֵׁם קָדְשִׁי
  choice: святого имени Моего
  rationale: Естественная русская формула, сохраняющая богословскую значимость имени Бога.
- source_word: לֹא תְחַלְּלוּ עוֹד
  choice: больше не оскверняйте
  rationale: Передаёт сильное запрещающее значение; «осквернять имя» идиоматично и точно для חלל.
- source_word: בְּמַתְּנוֹתֵיכֶם וּבְגִלּוּלֵיכֶם
  choice: своими дарами и своими идолами
  rationale: Сохраняет параллельные предложные обороты и прямое значение «даров», не уточняя сверх текста, что это жертвенные приношения.
theological_decisions:
- issue: Смысл повеления служить идолам
  choice: Сохранено как резкое судебное допущение или ироническое повеление, обусловленное отказом слушать Бога.
  alternative: Понимать как одобрение идолослужения либо полностью устранять повелительную форму как чистый сарказм.
  rationale: Контекст исключает одобрение идолопоклонства, однако еврейские императивы должны оставаться слышимыми; перевод сохраняет напряжение между повелением и последующим запрещением осквернять имя Бога.
- issue: Синтаксическая связь וְאַחַר אִם
  choice: «если и впредь не будете слушать Меня» отнесено к предшествующему повелению.
  alternative: 'Пунктуационно связать условную фразу иначе: «Идите, служите каждый своим идолам; а после — если не будете слушать Меня…»'
  rationale: Еврейский синтаксис труден и допускает различную пунктуацию, поэтому альтернативная связь явно отмечена в сноске.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  alternative: Господь Яхве; Владыка Яхве
  rationale: Так составной титул передаётся различимо и благозвучно, без навязывания произношения тетраграмматона.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Прямое обращение и резкие императивы сохранены; архаизмы сведены к традиционно узнаваемому «дом Израиля». Заглавное «ГОСПОДЬ» обозначает имя יהוה, а «Владыка» передаёт אֲדֹנָי.
