    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: за то, что
  rationale: Вводит причину суда, описанного в контексте; по-русски естественно продолжает предшествующее высказывание.
- source_word: מִשְׁפָּטַי
  choice: Мои постановления
  rationale: Передаёт юридический характер слова и сохраняет отличие от חֻקּוֹתַי.
- source_word: מָאָסוּ
  choice: отвергли
  rationale: Выражает сознательный отказ без добавления необязательного эмоционального оттенка презрения.
- source_word: חֻקּוֹתַי
  choice: Мои уставы
  rationale: Традиционный и понятный термин, отличающийся от «постановлений» в той же фразе.
- source_word: לֹא הָלְכוּ בָהֶם
  choice: не поступали по
  rationale: Естественно передаёт еврейскую метафору хождения как образа поведения, не создавая в современном русском неясной буквальности.
- source_word: שַׁבְּתוֹתַי
  choice: Мои субботы
  rationale: Сохраняет явно выраженное в еврейском тексте множественное число.
- source_word: חִלֵּלוּ
  choice: оскверняли
  rationale: Передаёт обращение со святыней как с чем-то несвятым и сохраняет повторяющийся характер действия.
- source_word: גִלּוּלֵיהֶם
  choice: их идолами
  rationale: Основной текст остаётся ясным и естественным, а резко презрительный оттенок еврейского слова отмечен в сноске.
- source_word: לִבָּם הֹלֵךְ
  choice: сердце их следовало
  rationale: Сохраняет единственное число «сердце», внутреннюю направленность людей и образ движения вслед за объектом поклонения.
theological_decisions:
- issue: Различение терминов заветного закона מִשְׁפָּטַי и חֻקּוֹתַי
  choice: «Мои постановления» и «Мои уставы»
  alternative: Передать оба слова общим термином «законы»
  rationale: Разные русские соответствия сохраняют лексическую структуру еврейского текста и не сглаживают его язык.
- issue: Антропологическая метафора לִבָּם הֹלֵךְ
  choice: «сердце их следовало за их идолами»
  alternative: «они были преданы своим идолам» или «их влекло к идолам»
  rationale: Выбранный вариант сохраняет сердце как средоточие внутренней направленности и образ следования, не сводя смысл лишь к внешнему поведению.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Заглавные буквы в притяжательных местоимениях, относящихся к Богу, соответствуют принятой русской библейской практике. Синтаксис сохраняет причинную связь с предыдущим контекстом; маркер сноски поставлен непосредственно после слова «идолами», к которому относится примечание.
