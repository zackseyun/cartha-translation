base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/016.yaml
  text: because they rejected my judgments[a], and did not walk in my statutes, and profaned my Sabbaths; for their heart went after their idols.
translation:
  language: ru
  text: за то, что они отвергли Мои постановления, не поступали по Моим уставам и оскверняли Мои субботы, потому что сердце их следовало за их идолами[a].
  philosophy: optimal-equivalence
  footnotes:
