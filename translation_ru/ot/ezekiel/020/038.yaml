  text: וּ/בָרוֹתִ֣י מִ/כֶּ֗ם הַ/מֹּרְדִ֤ים וְ/הַ/פּֽוֹשְׁעִים֙ בִּ֔/י מֵ/אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ אוֹצִ֣יא אוֹתָ֔/ם וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָב֑וֹא וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/038.yaml
  text: I will purge from among you the rebels and those who transgress against me[a]. I will bring them out of the land where they sojourn, but they will not enter the land of Israel[c][b]. Then you will know that I am Yahweh.
translation:
  language: ru
  text: Я отделю из вашей среды мятежников и тех, кто преступает против Меня[a]. Я выведу их из страны, где они живут как пришельцы[b], но на землю Израиля они не войдут[c]. И вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я отсею из вашей среды мятежников и тех, кто преступает против Меня». Еврейский глагол передаёт отделение и удаление посредством отбора.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из страны их странствий (проживания на чужбине)».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте глагол стоит в единственном числе: буквально «он не войдёт»; по отношению ко всей группе это имеет распределительный смысл: никто из них не войдёт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוֹתִי
  choice: Я отделю
  rationale: Глагол ברר здесь означает выделение и удаление из сообщества посредством отбора. «Отделю» сохраняет образ отделения негодных, не добавляя к нему отсутствующего в форме прямого указания на очищение.
- source_word: מִכֶּם
  choice: от вас
  rationale: Предлог מן обозначает отделение от группы; в сочетании с «отделю» русский оборот естественно передаёт значение «из вашей среды».
- source_word: הַמֹּרְדִים
  choice: мятежников
  rationale: Субстантивированное причастие от מרד обозначает тех, кто упорно противится законной власти; «мятежники» кратко и ясно передаёт это значение.
- source_word: וְהַפּוֹשְׁעִים בִּי
  choice: и тех, кто восстаёт против Меня
  rationale: פשע с ב указывает на сознательный проступок как бунт против Бога. Формулировка сохраняет личную направленность действия, хотя по-русски частично сближается с предшествующим «мятежников».
- source_word: מֵאֶרֶץ מְגוּרֵיהֶם
  choice: из страны, где они живут как пришельцы
  rationale: מְגוּרִים обозначает проживание вне родной земли, положение пришельцев. Развёрнутый русский оборот сохраняет эту смысловую особенность.
- source_word: אוֹצִיא אוֹתָם
  choice: Я выведу их
  rationale: Каузативная форма יצא означает «заставить выйти, вывести»; «выведу» точно и естественно передаёт действие.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: землю Израиля
  rationale: Хотя אֲדָמָה буквально означает почву или землю, здесь это территориальное обозначение.
- source_word: לֹא יָבוֹא
  choice: они не войдут
  rationale: 'В еврейском стоит глагол единственного числа при коллективно понимаемой группе. Русское множественное число естественно передаёт распределительный смысл: никто из них не войдёт.'
- source_word: וִידַעְתֶּם
  choice: И вы узнаете
  rationale: Союз сохранён без усиления причинно-следственного оттенка, поскольку простое продолжение в русском остаётся ясным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Сила судебного действия в וּבָרוֹתִי
  choice: Я отделю
  alternative: Я очищу вас от / Я отсею
  rationale: Контекст явно подразумевает удаление мятежников из сообщества, однако исходный глагол прежде всего выражает отбор и отделение. «Отделю» сохраняет судебную строгость в контексте, не делая метафору очищения обязательной.
- issue: Соотношение מרד и פשע
  choice: мятежников и тех, кто восстаёт против Меня
  alternative: непокорных и согрешающих против Меня
  rationale: Оба слова относятся к бунту и нарушению верности, и полностью развести их значения невозможно. Перевод сохраняет два параллельных обозначения, не превращая второе в общее понятие греха.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное covenantное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому религиозному регистру. Синтаксис остаётся близким к еврейской последовательности высказывания, но избегает архаизмов.
