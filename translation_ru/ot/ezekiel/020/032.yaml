  text: וְ/הָֽ/עֹלָה֙ עַל ר֣וּחֲ/כֶ֔ם הָי֖וֹ לֹ֣א תִֽהְיֶ֑ה אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִֽהְיֶ֤ה כַ/גּוֹיִם֙ כְּ/מִשְׁפְּח֣וֹת הָ/אֲרָצ֔וֹת לְ/שָׁרֵ֖ת עֵ֥ץ וָ/אָֽבֶן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/032.yaml
  text: What is coming up in your mind will certainly not happen—that you say[a], ‘We will be like the nations, like the clans of the lands[d][c][b], serving wood and stone.’
translation:
  language: ru
  text: 'То, что приходит вам на ум[a], никогда не осуществится — то, о чём вы говорите: «Будем как народы, как племена разных стран, служить дереву и камню[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что восходит на ваш дух»; речь идёт о возникающей мысли или намерении.'
    reason: lexical_alternative
  - marker: b
    text: Имеются в виду деревянные и каменные идолы; «служить» здесь означает воздавать им религиозное почитание.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָעֹלָה עַל רוּחֲכֶם
  choice: то, что приходит вам на ум
  rationale: Оборот с רוּחַ здесь обозначает возникающую внутреннюю мысль или намерение. «Приходит вам на ум» естественно передаёт идиому, не превращая «дух» в специальный антропологический термин.
- source_word: הָיוֹ לֹא תִהְיֶה
  choice: ни за что не сбудется
  rationale: Инфинитив абсолютный перед личной формой усиливает категорическое отрицание. Эта формулировка сохраняет будущую направленность и подчёркнутую невозможность исполнения замысла.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: вы говорите
  rationale: Оборот вводит содержание высказанного намерения; в русском естественно поставить его после двоеточия перед прямой речью.
- source_word: נִהְיֶה
  choice: Будем
  rationale: Форма первого лица множественного числа выражает намерение относительно будущего состояния; краткое «Будем» естественно в прямой речи.
- source_word: כַגּוֹיִם
  choice: как другие народы
  rationale: גּוֹיִם обозначает окружающие Израиль народы. Добавление «другие» делает подразумеваемое противопоставление ясным и не вносит позднего значения «язычники».
- source_word: כְּמִשְׁפְּחוֹת הָאֲרָצוֹת
  choice: как племена разных стран
  rationale: מִשְׁפָּחוֹת здесь указывает на родовые или племенные группы, а множественное הָאֲרָצוֹת — на страны или земли. «Разных» естественно передаёт распределённость этих групп по странам.
- source_word: לְשָׁרֵת
  choice: служить
  rationale: Глагол буквально означает «служить»; контекст придаёт служению религиозный, идолопоклоннический смысл, но основной текст сохраняет лексическую форму источника.
- source_word: עֵץ וָאָבֶן
  choice: дереву и камню
  rationale: Устойчивое полемическое обозначение идолов по материалу, из которого они сделаны. Единственное число и вещественное значение сохранены.
theological_decisions:
- issue: Религиозный смысл לְשָׁרֵת
  choice: служить дереву и камню
  alternative: поклоняться деревянным и каменным идолам
  rationale: Основной текст сохраняет значение глагола «служить» и метонимию «дерево и камень», не скрывая при этом очевидного из контекста идолопоклонства; пояснение дано в сноске.
- issue: Внутренняя способность, обозначенная רוּחַ
  choice: приходит вам на ум
  alternative: восходит на ваш дух
  rationale: В данном обороте речь идёт о мысли или намерении, а не о точном разграничении «ума» и «духа». Идиоматический русский вариант не вносит лишнего богословского определения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Категоричность Божьего отрицания выражена оборотом «ни за что не сбудется». Прямая речь звучит естественно, а буквальная образность «дерево и камень» сохранена.
