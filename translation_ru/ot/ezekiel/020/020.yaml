  text: וְ/אֶת שַׁבְּתוֹתַ֖/י קַדֵּ֑שׁוּ וְ/הָי֤וּ לְ/אוֹת֙ בֵּינִ֣/י וּ/בֵֽינֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/020.yaml
  text: Keep my Sabbaths holy[a], and let them be a sign between me and you, so that you may know that I am Yahweh your God.
translation:
  language: ru
  text: Освящайте Мои субботы, и пусть они будут знамением между Мной и вами, чтобы вы знали, что Я — Яхве[a], ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (YHWH), личное имя Бога; в традиционных переводах часто заменяется словом «Господь», также встречается передача «Иегова».
    reason: Поясняет передачу тетраграмматона, различая личное имя и традиционную титульную замену.
lexical_decisions:
- source_word: שַׁבְּתוֹתַי
  choice: Мои субботы
  rationale: Форма множественного числа с суффиксом первого лица единственного числа; множественное число сохраняет представление о регулярно повторяющихся днях субботы.
- source_word: קַדֵּשׁוּ
  choice: соблюдайте ... как святые
  rationale: Пиэль глагола קדשׁ здесь означает признавать субботы святыми и обращаться с ними соответственно. Формулировка передаёт повеление естественным современным русским языком.
- source_word: וְהָיוּ
  choice: и пусть они будут
  rationale: После повеления форма продолжает увещевание и допускает волитивный оттенок; «пусть они будут» сохраняет его лучше, чем простое будущее время.
- source_word: לְאוֹת
  choice: знамением
  rationale: אוֹת обозначает знак или знамение. «Знамение» уместно в контексте видимого знака заветных отношений и сохраняет достойный библейский регистр.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: между Мной и вами
  rationale: Прямо передаёт устойчивое еврейское выражение взаимной, в данном случае заветной, связи.
- source_word: לָדַעַת
  choice: чтобы вы знали
  rationale: Инфинитив с ל выражает цель; русский придаточный оборот ясно и естественно передаёт эту связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Хотя אֱלֹהִים имеет морфологическую форму множественного числа, здесь оно обозначает единого Бога Израиля; суффикс второго лица множественного числа передан словом «ваш».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное заветное имя יהוה. Транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом; примечание поясняет традиционные способы передачи.
- issue: Функция суббот как знамения
  choice: знамение между Мной и вами
  alternative: знак отношений между Мной и вами
  rationale: Перевод сохраняет краткость и богословскую ёмкость исходного выражения, не уточняя сверх текста характер обозначаемых отношений.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Оборот «соблюдайте ... как святые» выбран вместо архаичного «святите», а «знамение» сохраняет заветный оттенок слова אוֹת. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют распространённой русской религиозной издательской практике.
