base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/041.yaml
  text: I will accept you like a pleasing aroma when I bring you out from the peoples and gather you from the lands where you have been scattered, and I will show myself holy through you before the eyes of the nations.
translation:
  language: ru
  text: Я приму вас как благоухание, приятное Мне, когда выведу вас из среды народов и соберу вас из стран, по которым вы были рассеяны; и явлю Свою святость в вас перед глазами народов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֵיחַ נִיחֹחַ אֶרְצֶה אֶתְכֶם
  choice: Я приму вас как приятное благоухание
  rationale: Конструкция связывает принятие народа с образом благоугодного жертвенного аромата. «Как» естественно передаёт образное сопоставление по-русски, не утверждая буквального отождествления людей с благоуханием.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מִן הָעַמִּים
  choice: когда выведу вас из среды народов
  rationale: Инфинитивная конструкция с בְּ передана временным придаточным; «из среды народов» ясно выражает исход из рассеяния среди многих народов.
- source_word: וְקִבַּצְתִּי אֶתְכֶם מִן הָאֲרָצוֹת
  choice: и соберу из стран
  rationale: Сохраняется параллелизм «выведу… и соберу» и множественное число «стран».
- source_word: אֲשֶׁר נְפֹצֹתֶם בָּם
  choice: по которым вы были рассеяны
  rationale: Пассивная форма сохранена без уточнения действующего лица, как и в еврейском тексте.
- source_word: וְנִקְדַּשְׁתִּי בָכֶם
  choice: Через вас Я явлю Свою святость
  rationale: Нифаль קדש здесь означает явление или подтверждение Божьей святости, а בָכֶם допускает инструментальное «через вас». Формулировка естественна и сохраняет богословскую направленность действия.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: перед глазами народов
  rationale: Формальное соответствие устойчивому еврейскому выражению, подчёркивающее публичный характер события.
theological_decisions:
- issue: Значение וְנִקְדַּשְׁתִּי בָכֶם
  choice: Через вас Я явлю Свою святость
  alternative: Я явлю Свою святость среди вас / на вас
  rationale: Предлог ב допускает несколько оттенков. В контексте публичного собирания Израиля перед народами инструментальное «через вас» лучше выражает, что Божья святость станет видимой посредством Его действий с народом, не исключая оттенка «на вас».
- issue: Жертвенный образ רֵיחַ נִיחֹחַ
  choice: как приятное благоухание
  alternative: как благоугодное благоухание / с приятным благоуханием
  rationale: Перевод сохраняет культовый образ принятия Богом, но не добавляет прямого упоминания жертвы, которого в стихе нет.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Синтаксис упрощён до двух предложений для ясности; повтор местоимения «вас» во второй однородной конструкции опущен как естественно подразумеваемый. Заглавные местоимения о Боге применены последовательно.
