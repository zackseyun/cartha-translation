revisions:
- from: Я приму вас как приятное благоухание, когда выведу вас из среды народов и соберу из стран, по которым вы были рассеяны. Через вас Я явлю Свою святость перед глазами народов.
  to: Я приму вас как благоухание, приятное Мне, когда выведу вас из среды народов и соберу вас из стран, по которым вы были рассеяны; и явлю Свою святость в вас перед глазами народов.
  rationale: Уточнён русский образ «приятного благоухания» и восстановлен второй объект при «соберу» для ясности параллелизма. «В вас» намеренно сохраняет диапазон значения בָּכֶם, не исключая проявления Божьей святости через Его действия с народом и среди него. Английская формулировка «through you» учтена как допустимое контекстуальное прочтение, но не должна сужать русский перевод относительно еврейского текста.
  reviewer_model: gpt-5.6-terra
