source:
  edition: WLC
  text: כִּ֣י בְ/הַר קָדְשִׁ֞/י בְּ/הַ֣ר מְר֣וֹם יִשְׂרָאֵ֗ל נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה שָׁ֣ם יַעַבְדֻ֜/נִי כָּל בֵּ֧ית יִשְׂרָאֵ֛ל כֻּלֹּ֖/ה בָּ/אָ֑רֶץ שָׁ֣ם אֶרְצֵ֔/ם וְ/שָׁ֞ם אֶדְר֣וֹשׁ אֶת תְּרוּמֹֽתֵי/כֶ֗ם וְ/אֶת רֵאשִׁ֛ית מַשְׂאוֹתֵי/כֶ֖ם בְּ/כָל קָדְשֵׁי/כֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/040.yaml
  text: For on my holy mountain[a], on the high mountain of Israel, declares the Lord GOD, there all the house of Israel, all of them in the land, will serve me. There I will accept them, and there I will require your contributions and the firstfruits of your offerings[c][b], with all your holy things.
translation:
  language: ru
  text: Ибо на Моей святой горе, на высокой горе Израиля, — возвещает Владыка Яхве, — там будет служить Мне весь дом Израиля, весь, без остатка, в земле. Там Я благосклонно приму их и там потребую ваши приношения, начатки ваших даров вместе со всем, что вы посвящаете Мне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со всеми вашими святынями»; речь обо всём освящённом или посвящённом Богу.'
    reason: Лексически широкое выражение בְּכָל קָדְשֵׁיכֶם допускает как предметное «святыни», так и контекстуальное описание посвящённых даров.
lexical_decisions:
- source_word: בְהַר קָדְשִׁי
  choice: на Моей святой горе
  rationale: Предлог בְ здесь имеет естественное локативное значение; выражение сохраняет культовый образ горы как места служения.
- source_word: בְהַר מְרוֹם יִשְׂרָאֵל
  choice: на высокой горе Израиля
  rationale: מְרוֹם обозначает высоту или возвышенность; перевод сохраняет параллелизм с «Моей святой горой».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передаёт пророческую формулу провозглашения; «Владыка» различает אֲדֹנָי и личное имя Яхве, не создавая сочетания «Господь Господь».
- source_word: יַעַבְדֻנִי
  choice: будет служить Мне
  rationale: עבד охватывает служение и поклонение; «служить» сохраняет более широкий смысл, подходящий к последующему контексту приношений.
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: весь дом Израиля, весь целиком
  rationale: Повторное указание на полноту намеренно сохранено как эмфатическое.
- source_word: בָּאָרֶץ
  choice: на этой земле
  rationale: Определённая форма указывает на конкретную землю; указательное «этой» естественно передаёт определённость в русском контексте.
- source_word: אֶרְצֵם
  choice: Я благосклонно приму их
  rationale: רצה в культовом и relational контексте означает благосклонное принятие; наречие передаёт положительную окраску глагола.
- source_word: אֶדְרוֹשׁ
  choice: потребую
  rationale: В контексте того, что должно быть принесено Богу, דרש означает требовать или взыскивать причитающееся.
- source_word: תְּרוּמֹתֵיכֶם
  choice: ваши приношения
  rationale: תְּרוּמָה — выделенная и представленная Богу доля; «приношения» понятно современному читателю и не вводит узкий технический термин.
- source_word: רֵאשִׁית מַשְׂאוֹתֵיכֶם
  choice: начатки ваших даров
  rationale: רֵאשִׁית сохраняет идею первого или начальной доли, а מַשְׂאוֹת — принесённых даров; «начатки» уместны в культовом контексте.
- source_word: בְּכָל קָדְשֵׁיכֶם
  choice: и всё, что вы посвящаете Мне
  rationale: Выражение широко обозначает принадлежащие адресатам священные, посвящённые предметы; развернутая формулировка естественна по-русски и не сужает смысл до одного вида жертв.
theological_decisions:
- issue: Передача Божественного имени в אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Так сохраняется различие между титулом אֲדֹנָי и собственным заветным именем יהוה без их слияния в два титула.
- issue: Смысл служения יַעַבְדֻנִי
  choice: будет служить Мне
  alternative: будет поклоняться Мне
  rationale: «Служить» сохраняет как культовый, так и более широкий заветный смысл и не ограничивает действие только поклонением.
- issue: Полнота восстановленного Израиля
  choice: весь дом Израиля, весь целиком
  alternative: весь дом Израиля
  rationale: Сохранено удвоенное כָּל...כֻּלֹּה, не определяя сверх текста, как именно соотносится это обещание с богословскими моделями Израиля.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис сохраняет повтор «там» и эмфатическую полноту исходного текста; культовая лексика передана понятно, без излишне архаичных или конфессионально маркированных терминов.
