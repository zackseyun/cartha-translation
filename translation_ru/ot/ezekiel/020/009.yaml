source:
  edition: WLC
  text: וָ/אַ֨עַשׂ֙ לְמַ֣עַן שְׁמִ֔/י לְ/בִלְתִּ֥י הֵחֵ֛ל לְ/עֵינֵ֥י הַ/גּוֹיִ֖ם אֲשֶׁר הֵ֣מָּה בְ/תוֹכָ֑/ם אֲשֶׁ֨ר נוֹדַ֤עְתִּי אֲלֵי/הֶם֙ לְ/עֵ֣ינֵי/הֶ֔ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/009.yaml
  text: But I acted for the sake of my name[a], so that it should not be profaned in the sight of the nations among whom they were[c][b], to whom I had made myself known in their sight by bringing them out of the land of Egypt.
translation:
  language: ru
  text: Но Я поступил так ради Моего имени[a], чтобы оно не было осквернено перед народами, среди которых они находились и которым Я явил Себя на их глазах, выведя их из земли Египта[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради Своего имени».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которым Я открылся»; буквально: «которым Я стал известен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: Но Я поступил так
  rationale: Глагол עשה широк по значению; в контексте обозначает решительное действие Бога. Союз передаёт противопоставление предыдущему стиху.
- source_word: לְמַעַן שְׁמִי
  choice: ради Моего имени
  rationale: Сохраняет библейский образ имени как явленного характера и чести Бога и естественно звучит по-русски.
- source_word: לְבִלְתִּי הֵחֵל
  choice: чтобы оно не было осквернено
  rationale: Пассивная формулировка сохраняет вероятный результативный смысл инфинитива חלל и его сакральную окраску; подразумеваемый объект — Божье имя.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: перед народами
  rationale: Передаёт публичность происходящего без тяжеловесного буквального «в глазах народов».
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: среди которых они находились
  rationale: Близко передаёт пространственно-социальное значение выражения, не добавляя прямо глагола «жили».
- source_word: אֲשֶׁר נוֹדַעְתִּי אֲלֵיהֶם
  choice: Я открылся им
  rationale: Нифаль ידע здесь выражает Божье самораскрытие; русский возвратный глагол кратко и естественно сохраняет этот смысл.
- source_word: לְעֵינֵיהֶם
  choice: перед ними
  rationale: Сохраняет отдельное указание на публичный, видимый характер откровения и не сливает его с אֲלֵיהֶם «им».
- source_word: לְהוֹצִיאָם
  choice: выведя их
  rationale: 'Деепричастие естественно передаёт обстоятельственно-инструментальный смысл: Бог открылся посредством исхода.'
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Устоявшееся, понятное и стилистически достойное русское библейское выражение.
theological_decisions:
- issue: Смысл Божьего действия ради Своего имени
  choice: Сохранить выражение «ради Моего имени» без поясняющей вставки.
  alternative: Ради Своей чести или репутации.
  rationale: В книге Иезекииля имя включает явленный характер, святость и заветную честь Бога; узкий пересказ через «репутацию» обеднил бы смысл.
- issue: Значение חלל применительно к Божьему имени
  choice: «не было осквернено»
  alternative: «не было обесчещено» или «чтобы не осквернить его»
  rationale: Пассивный вариант сохраняет грамматическую и богословскую напряжённость текста, а «осквернено» передаёт сакральный аспект обращения со святым как с несвятым.
- issue: Соотношение אֲלֵיהֶם и לְעֵינֵיהֶם
  choice: 'Передать оба элемента раздельно: «открылся им» и «перед ними».'
  alternative: Слить их в оборот «открылся у них на глазах».
  rationale: Раздельная передача сохраняет как адресата Божьего откровения, так и его публичную видимость, хотя по-русски возникает намеренный смысловой повтор.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Прописные местоимения при обращении Бога к Себе сохранены как русская издательская конвенция. Повтор «им — перед ними» оставлен ради различения двух еврейских оборотов; тире помогает читателю распознать присоединённое пояснение.
