revisions:
- from: Но Я поступил так ради Моего имени[a], чтобы оно не было осквернено перед народами, среди которых они находились, — перед ними Я открылся им[b], выведя их из земли Египетской.
  to: Но Я поступил так ради Моего имени[a], чтобы оно не было осквернено перед народами, среди которых они находились и которым Я явил Себя на их глазах, выведя их из земли Египта[b].
  rationale: 'Перестроена заключительная относительная конструкция: «которым Я явил Себя на их глазах» естественно передаёт самораскрытие Бога народам (אֲלֵיהֶם) и его публичность перед их глазами (לְעֵינֵיהֶם). Сохранена возможная референция местоимений без пояснительных добавлений. Обновлена сноска и заменён неоправданный архаизм «земли Египетской» на «земли Египта».'
