  text: וָ/אֹמַ֣ר אֲלֵ/הֶ֔ם מָ֣ה הַ/בָּמָ֔ה אֲשֶׁר אַתֶּ֥ם הַ/בָּאִ֖ים שָׁ֑ם וַ/יִּקָּרֵ֤א שְׁמָ/הּ֙ בָּמָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/029.yaml
  text: Then I said to them, ‘What is this high place where you are going?’ So its name is called Bamah to this day.
translation:
  language: ru
  text: 'И Я сказал им: «Что это за высота, куда вы ходите?» Поэтому она и по сей день называется Бама[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Бама» по-еврейски означает «высота», то есть культовое возвышение.
    reason: Поясняет игру слов, которую невозможно полностью сохранить при переводе первого употребления и транслитерации второго.
lexical_decisions:
- source_word: הַבָּמָה
  choice: высота
  rationale: Обычное для Иезекииля обозначение культового возвышения; русское «высота» сохраняет связь с последующим названием Бама и не перегружает текст пояснением.
- source_word: הַבָּאִים שָׁם
  choice: куда вы ходите
  rationale: Передаёт направительное שָׁם и причастную форму как продолжающуюся практику, естественно по-русски.
- source_word: בָּמָה
  choice: Бама
  rationale: Во втором употреблении слово функционирует как собственное название; транслитерация сохраняет заложенную в еврейском тексте игру между нарицательным «высота» и названием.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и по сей день
  rationale: Устойчивый современный русский эквивалент временной формулы.
theological_decisions:
- issue: Характер вопроса מָה הַבָּמָה
  choice: «Что это за высота?»
  alternative: «Что за высота?» / «Что такое высота?»
  rationale: Формулировка сохраняет риторический оттенок порицания и указание на конкретное культовое место, не вводя отсутствующего в тексте богословского объяснения.
- issue: Временная форма названия וַיִּקָּרֵא שְׁמָהּ
  choice: «она и по сей день называется»
  alternative: «ей было дано имя»
  rationale: Русское настоящее время в сочетании с «по сей день» естественно передаёт результат наречения, сохраняющийся до момента повествования.
translation_notes:
  register: Современный литературный русский, с лаконичной пророческой интонацией. «Куда вы ходите» выбрано вместо более буквального, но тяжеловесного «куда вы приходите». Местоимение «Я» написано с прописной буквы, поскольку в контексте говорит Господь.
