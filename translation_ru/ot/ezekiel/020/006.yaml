  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָשָׂ֤אתִי יָדִ/י֙ לָ/הֶ֔ם לְ/הֽוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל אֶ֜רֶץ אֲשֶׁר תַּ֣רְתִּי לָ/הֶ֗ם זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/006.yaml
  text: On that day I raised my hand to them[a], to bring them out from the land of Egypt into a land that I had searched out for them, flowing with milk and honey[c][b]; it is the glory of all lands.
translation:
  language: ru
  text: В тот день Я поднял руку, давая им клятву[a], что выведу их из земли Египетской в землю, которую высмотрел для них[b], — землю, текущую молоком и мёдом, красу всех земель[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднял им руку» — жест, которым подтверждали клятву.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которую избрал для них»; еврейское слово буквально означает «осмотрел», «высмотрел».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «великолепие всех земель», «самую прекрасную из всех земель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: Я поднял руку, давая им клятву
  rationale: Сохраняется конкретный еврейский образ поднятой руки, а добавленное пояснение естественно передаёт его клятвенный смысл и не оставляет современному читателю неясного жеста.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: что выведу их из земли Египетской
  rationale: Каузатив глагола יצא передан обычным русским «выведу»; конструкция с «что» естественно продолжает выражение клятвы.
- source_word: אֲשֶׁר תַּרְתִּי לָהֶם
  choice: которую высмотрел для них
  rationale: «Высмотрел» сохраняет смысл поиска, осмотра и выбора в תור, включая антропоморфную образность, но не привносит военной окраски слова «разведал».
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: землю, текущую молоком и мёдом
  rationale: Устойчивый библейский образ плодородия сохранён в понятной и литературной русской форме.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: красу всех земель
  rationale: «Краса» ёмко передаёт צְבִי как красоту, великолепие и предмет восхищения; именная конструкция сохраняет приподнятый пророческий регистр и не превращает фразу в простой суперлатив.
theological_decisions:
- issue: Клятвенный смысл жеста נָשָׂאתִי יָדִי
  choice: Сохранить образ поднятой руки и пояснить, что это клятва
  alternative: Передать только «Я поклялся им»
  rationale: Так сохраняются и буквальный образ исходного текста, и его прагматическое значение без конфессионального истолкования.
- issue: Антропоморфное описание Божьего действия в תַּרְתִּי
  choice: которую высмотрел для них
  alternative: которую избрал для них
  rationale: Перевод сохраняет необычную образность еврейского глагола и не сглаживает её до абстрактного решения или предопределения.
- issue: Оценочное значение צְבִי
  choice: красу всех земель
  alternative: прекраснейшую из всех земель
  rationale: Метафорическое выражение сохранено без однозначного сведения к сравнительной превосходной степени.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Заглавное «Я» обозначает говорящего Бога. Формула «земля Египетская» и образ «текущая молоком и мёдом» сохраняют узнаваемую библейскую торжественность; «высмотрел» намеренно удерживает антропоморфизм оригинала.
