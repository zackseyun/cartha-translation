base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/027.yaml
  text: 'Therefore speak to the house of Israel[a], son of man, and say to them, ‘Thus says the Lord Yahweh: In this also your fathers blasphemed me[b], by acting treacherously against me.’'
translation:
  language: ru
  text: 'Поэтому говори дому Израиля, сын человеческий, и скажи им: «Так говорит Господь Яхве: и этим ваши отцы также хулили Меня[a], вероломно поступая против Меня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поносили Меня»; «проявляли ко Мне презрение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изменяя Мне»; «нарушая верность, данную Мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: поэтому
  rationale: Передаёт вывод, следующий из предшествующего обличения.
- source_word: דַּבֵּר אֶל בֵּית יִשְׂרָאֵל
  choice: говори дому Израиля
  rationale: Сохраняет пророческую формулу обращения и собирательное выражение «дом Израиля».
- source_word: בֶּן אָדָם
  choice: сын человеческий
  rationale: Сохраняет буквальное и последовательное обращение к Иезекиилю, характерное для всей книги.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: так говорит Господь Яхве
  rationale: Передаёт оба элемента еврейской формулы и сохраняет личное имя יהוה.
- source_word: עוֹד זֹאת
  choice: ещё и этим
  rationale: Передаёт одновременно добавочное значение עוֹד и указательное значение זֹאת, связывая проступок с последующим описанием.
- source_word: גִּדְּפוּ אוֹתִי
  choice: хулили Меня
  rationale: Глагол גדף обозначает тяжкое оскорбление или поношение Бога; «хулили» естественно передаёт религиозную направленность выражения.
- source_word: אֲבוֹתֵיכֶם
  choice: ваши отцы
  rationale: Сохраняет конкретный мужской родственный термин исходного текста; здесь имеются в виду прежние поколения Израиля.
- source_word: בְּמַעֲלָם בִּי מָעַל
  choice: поступая со Мной вероломно
  rationale: Естественно по-русски выражает заложенные в מעל неверность, предательство доверия и нарушение обязательств перед Богом.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Господь Бог
  rationale: «Яхве» прямо передаёт личное заветное имя, тогда как «Господь» соответствует אֲדֹנָי; различие двух слов не сглаживается.
- issue: Передача обращения בֶּן אָדָם
  choice: сын человеческий
  alternative: смертный; человек
  rationale: Традиционное буквальное выражение сохраняет повторяющееся обращение книги Иезекииля, не придавая ему здесь дополнительного христологического значения.
- issue: Заветный оттенок מעל
  choice: поступая со Мной вероломно
  alternative: изменяя Мне; нарушая верность Мне
  rationale: Формулировка сохраняет идею сознательной неверности и предательства отношений с Богом, не сужая её до одного конкретного нарушения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим регистром. Сохранены формулы «дом Израиля», «сын человеческий» и «так говорит». Заглавная буква в «Меня/Мной» следует принятой русской практике при прямой речи Бога.
