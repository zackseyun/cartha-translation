  yaml_path: translation/ot/ezekiel/020/025.yaml
  text: Moreover[b][a], I myself gave them statutes that were not good and ordinances by which they could not live.
translation:
  language: ru
  text: Более того, Я Сам дал им недобрые постановления и установления, через исполнение которых они не могли обрести жизнь.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в истолковательном переводе: «Я предал их недобрым постановлениям». Такое понимание подчёркивает судебное действие Бога, а не издание Им нравственно порочных законов.'
    reason: alternative_reading
  - marker: b
    text: Выражение «обрести жизнь через исполнение» перекликается с языком завета, согласно которому исполнение Божьих постановлений ведёт к жизни (ср. Лев. 18:5). Здесь эта формула намеренно обращена в свою противоположность.
    reason: cross_reference
lexical_decisions:
- source_word: וְגַם
  choice: Более того
  rationale: Передаёт присоединительно-усилительное значение выражения и естественно связывает стих с предыдущим рассуждением.
- source_word: אֲנִי
  choice: Я Сам
  rationale: Самостоятельное местоимение усиливает уже выраженное глагольной формой первое лицо; по-русски это естественно передаётся словом «Сам».
- source_word: נָתַתִּי
  choice: дал
  rationale: Сохраняет прямое основное значение נתן и не подменяет его толкованием «предал» или «позволил иметь».
- source_word: חֻקִּים
  choice: постановления
  rationale: Современное и достаточно торжественное обозначение предписаний в юридическом и заветном контексте.
- source_word: לֹא טוֹבִים
  choice: которые не были добры
  rationale: Сохраняет точное отрицание «не добры», не усиливая его до «злы» или «дурны».
- source_word: וּמִשְׁפָּטִים
  choice: установления
  rationale: Передаёт нормативно-правовой смысл слова и позволяет различить два параллельных еврейских термина без неестественной буквальности.
- source_word: לֹא יִחְיוּ בָּהֶם
  choice: исполняя которые они не могли жить
  rationale: Передаёт инструментальный смысл ב и естественно воспроизводит по-русски перевёрнутую формулу о жизни через исполнение установлений; модальное «не могли» уместно выражает невозможность обрести посредством них жизнь.
theological_decisions:
- issue: Следует ли смягчать утверждение, что Бог «дал» недобрые постановления
  choice: В основном тексте сохранено прямое «Я Сам дал им».
  alternative: «Я предал их постановлениям, которые не были добры».
  rationale: В еврейском тексте Бог прямо выступает субъектом глагола נתן — «дал». Замена на разрешение или предание была бы богословским истолкованием, поэтому возможное судебное понимание вынесено в примечание.
- issue: Соотношение стиха с библейским учением о благости Божьего закона
  choice: Выражение «не были добры» переведено без гармонизирующего пояснения в основном тексте.
  alternative: Понимать сказанное как судебное предание пагубным или идолопоклонническим предписаниям, а не как характеристику закона завета.
  rationale: Сам стих намеренно сохраняет резкое богословское напряжение; перевод не должен устранять его за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Заглавные «Я Сам» передают акцент независимого местоимения. Термины «постановления» и «установления» сохраняют юридико-заветную окраску, оставаясь понятными обычному читателю.
