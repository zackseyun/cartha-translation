base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/036.yaml
  text: Just as I entered into judgment with your fathers in the wilderness of the land of Egypt[a], so I will enter into judgment with you, declares the Lord GOD.
translation:
  language: ru
  text: Как Я вступил в суд с вашими отцами в пустыне земли Египта[a], так вступлю в суд с вами, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как Я судил ваших отцов… так буду судить и вас». Еврейский глагол допускает более краткий перевод «судить», однако выражение «вступить в суд» яснее передаёт оттенок судебного разбирательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Как ... так
  rationale: Естественно и точно передаёт сопоставление прежнего и будущего действия Бога.
- source_word: נִשְׁפַּטְתִּי
  choice: Я вступил в суд
  rationale: Форма глагола שׁפט здесь выражает судебное разбирательство с другой стороной, а не только вынесение приговора.
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: с вашими отцами
  rationale: При судебном значении глагола конструкция естественно передаётся по-русски предложным оборотом «с вашими отцами».
- source_word: בְּמִדְבַּר אֶרֶץ מִצְרָיִם
  choice: в пустыне земли Египетской
  rationale: Сохранены оба элемента еврейского выражения — «пустыня» и «земля Египетская» — без географического упрощения.
- source_word: אִשָּׁפֵט אִתְּכֶם
  choice: вступлю в суд и с вами
  rationale: Сохраняет параллель с первым полустишием и не усиливает предлог до более однозначного «против вас».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם; «Владыка» отличает титул אֲדֹנָי от личного имени Яхве.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача личного имени как «Яхве» сохраняет различие между титулом אֲדֹנָי и тетраграмматоном и избегает слияния двух наименований.
- issue: Судебное значение форм נִשְׁפַּטְתִּי и אִשָּׁפֵט
  choice: вступил/вступлю в суд с
  alternative: судил/буду судить
  rationale: Более развёрнутый оборот сохраняет взаимно-судебную форму и напряжение образа судебного разбирательства, не сводя его лишь к приговору.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён; «земли Египетской» выбрано как понятное и слегка возвышенное библейское выражение.
