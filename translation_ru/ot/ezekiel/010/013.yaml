lexical_decisions:
- source_word: לָאֹופַנִּים
  choice: А колёса
  rationale: Предлог לְ здесь вводит тему высказывания о колёсах; русская конструкция с «а» естественно передаёт тематическое выделение.
- source_word: לָהֶם קוֹרָא
  choice: назывались
  rationale: 'Сочетание допускает безлично-пассивное понимание: речь идёт о названии, данном колёсам. Возвратная пассивная форма естественна по-русски и не вводит неназванного действующего лица.'
- source_word: הַגַּלְגַּל
  choice: коловратом
  rationale: Редкое русское слово передаёт образ вращения и позволяет отличить singular גַּלְגַּל от уже упомянутого plural אֹופַנִּים «колёса»; творительный падеж требуется после «назывались».
- source_word: בְּאָזְנָי
  choice: как я слышал
  rationale: Естественно передаёт еврейскую идиому «в моих ушах», подчёркивая, что пророк лично услышал это название.
