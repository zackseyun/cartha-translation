  yaml_path: translation/ot/ezekiel/010/014.yaml
  text: 'And each one had four faces: the face of the first was the face of the cherub[a], and the face of the second was the face of a man, and the third the face of a lion[b], and the fourth the face of an eagle.'
translation:
  language: ru
  text: 'И у каждого было по четыре лица: лицо первого было лицом херувима, лицо второго — лицом человека, лицо третьего — лицом льва, а лицо четвёртого — лицом орла[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «стервятника». Еврейское слово может обозначать крупную хищную птицу в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה פָנִים לְאֶחָד
  choice: И у каждого было по четыре лица
  rationale: Еврейская именная конструкция буквально означает «и четыре лица у каждого». Добавление «было» необходимо для естественного русского синтаксиса, а сочетание «у каждого... по четыре» ясно передаёт распределительное значение.
- source_word: פְּנֵי הָאֶחָד
  choice: лицо первого
  rationale: В последовательности «первого... второго... третьего... четвёртого» אֶחָד употреблено в порядковом значении; выбранный вариант сохраняет структуру перечисления.
- source_word: הַכְּרוּב
  choice: херувима
  rationale: Передаёт прямо засвидетельствованное чтение еврейского текста и не гармонизирует его с «быком» в Иезекииля 1:10.
- source_word: אָדָם
  choice: человека
  rationale: Здесь слово обозначает человеческое лицо в ряду лиц живых существ. «Лицо человека» — естественный и точный современный русский оборот без ненужного уточнения пола.
- source_word: אַרְיֵה
  choice: льва
  rationale: Прямое обозначение животного; родительный падеж естественно обусловлен словом «лицо».
- source_word: נָשֶׁר
  choice: орла
  rationale: Традиционное и контекстуально уместное соответствие для крупной хищной птицы; более широкое возможное значение отмечено в сноске.
theological_decisions:
- issue: Соотношение «лица херувима» здесь с «лицом быка» в Иезекииля 1:10
  choice: Сохранить чтение «херувима» без согласования с Иезекииля 1:10.
  alternative: Перевести «быка» или пояснить в основном тексте как «херувима, подобного быку».
  rationale: Масоретский текст данного стиха прямо содержит הַכְּרוּב, «херувим». Перевод сохраняет текстуальное и истолковательное напряжение, а параллель сообщает в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-нейтральный. Эллипсис в последних двух членах перечисления сохраняет ритм оригинала, не нарушая понятности; союз «а» перед последним членом естественно завершает ряд.
