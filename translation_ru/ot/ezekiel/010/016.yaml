base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/016.yaml
  text: When the cherubim moved[a], the wheels moved beside them; and when the cherubim lifted up their wings to rise from the earth, the wheels also did not turn away from beside them.
translation:
  language: ru
  text: Когда херувимы двигались, колёса двигались рядом с ними; и когда херувимы поднимали свои крылья, чтобы подняться от земли, колёса также не отворачивались от них[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сворачивали прочь от них». Еврейский текст подчёркивает, что при подъёме херувимов колёса не удалялись от них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלֶכֶת ... יֵלְכוּ
  choice: Когда ... двигались, ... двигались
  rationale: Конструкция ב с инфинитивом вводит временное придаточное; «двигались» естественно описывает согласованное движение существ и колёс в видении.
- source_word: הַכְּרוּבִים
  choice: херувимы
  rationale: Устоявшаяся русская передача еврейского множественного числа כְּרוּבִים, уместная в контексте видения.
- source_word: הָאוֹפַנִּים
  choice: колёса
  rationale: Прямое значение существительного אוֹפַן; единообразно передаёт образ во всём видении.
- source_word: אֶצְלָם
  choice: рядом с ними
  rationale: Передаёт пространственную близость, выраженную אצל, естественным современным русским оборотом.
- source_word: וּבִשְׂאֵת ... אֶת כַּנְפֵיהֶם
  choice: и когда ... поднимали крылья
  rationale: Вторая конструкция ב с инфинитивом также имеет временное значение; נשׂא с «крыльями» естественно передаётся глаголом «поднимать».
- source_word: לָרוּם מֵעַל הָאָרֶץ
  choice: чтобы подняться над землёй
  rationale: Инфинитив רום выражает цель или результат поднятия крыльев, а מֵעַל הָאָרֶץ указывает на подъём с поверхности земли в пространство над ней.
- source_word: לֹא יִסַּבּוּ ... מֵאֶצְלָם
  choice: не отклонялись от них
  rationale: Передаёт как значение поворота или уклонения у סבב, так и выраженную מן идею удаления от находящихся рядом херувимов, не перегружая русскую фразу.
- source_word: גַּם הֵם
  choice: тоже
  rationale: Сохраняет акцент на том, что колёса двигались согласованно с херувимами.
