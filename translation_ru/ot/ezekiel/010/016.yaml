  source_fidelity: Первая временная конструкция и согласованное движение херувимов и колёс переданы верно. Однако «подняться над землёй» может означать лишь положение в пространстве над землёй, тогда как מֵעַל הָאָרֶץ с לָרוּם описывает подъём от земли. «Не отклонялись от них» несколько ослабляет образ поворота/отворачивания и не вполне сохраняет исходную пространственную связь «от их стороны».
