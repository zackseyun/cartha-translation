lexical_decisions:
- source_word: וַיֵּרָא
  choice: было видно
  rationale: 'Нифаль глагола ראה передаёт пассивное зрительное восприятие: в видении у херувимов можно было увидеть названную форму.'
- source_word: לַכְּרֻבִים
  choice: у херувимов
  rationale: Предлог ל при пассивной форме ראה указывает на тех, у кого видна эта особенность; русское «у херувимов было видно» естественно сохраняет эту связь.
- source_word: תַּבְנִית
  choice: подобие
  rationale: Слово обозначает видимую форму или очертание; «подобие» уместно в контексте пророческого видения и не утверждает полного тождества.
- source_word: יַד אָדָם
  choice: человеческой руки
  rationale: Буквально «руки человека». В современном русском «человеческая рука» естественно обозначает анатомический облик и не вводит не требуемого контекстом противопоставления по полу.
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: под их крыльями
  rationale: Прямое и естественное выражение пространственного положения.
theological_decisions:
- issue: Передача אָדָם в описании облика руки
  choice: человеческой руки
  alternative: руки человека
  rationale: Здесь אָדָם определяет вид руки как человеческий, в отличие от иных форм в видении. Вариант не добавляет конфессионального толкования и сохраняет предмет описания.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет зрительный, пассивный характер еврейского выражения и возвышенный тон видения без излишней архаизации.
