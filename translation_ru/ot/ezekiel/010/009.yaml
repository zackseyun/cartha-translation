base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/009.yaml
  text: And I looked[a], and behold, four wheels beside the cherubim, one wheel beside each cherub; and the appearance of the wheels was like beryl stone.
translation:
  language: ru
  text: 'И я увидел: вот четыре колеса рядом с херувимами — по одному колесу рядом с каждым херувимом. Вид колёс был подобен камню таршиш[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «камень таршиш»; точное отождествление этого камня неизвестно. Возможно, имеется в виду берилл, хризолит или другой минерал.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: И увидел я
  rationale: Обычное значение ראה — «видеть»; инверсия сохраняет возвышенный, но понятный тон рассказа о видении.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Передаёт непосредственность и указательную силу הִנֵּה естественным современным русским словом.
- source_word: אַרְבָּעָה אוֹפַנִּים
  choice: четыре колеса
  rationale: Прямое и контекстуально устойчивое соответствие в видении Иезекииля.
- source_word: אֵצֶל הַכְּרוּבִים
  choice: рядом с херувимами
  rationale: אֵצֶל обозначает близкое расположение, не уточняя его точнее.
- source_word: אוֹפַן אֶחָד אֵצֶל הַכְּרוּב אֶחָד
  choice: по одному колесу рядом с каждым херувимом
  rationale: Повтор «один… один» имеет распределительное значение; русская конструкция ясно и естественно его выражает.
- source_word: וּמַרְאֵה הָאוֹפַנִּים
  choice: Видом колёса
  rationale: Передаёт מַרְאֶה как внешний, видимый облик без тяжеловесного «вид колёс был».
- source_word: כְּעֵין
  choice: были подобны
  rationale: Идиома указывает на зрительное сходство; перевод не добавляет отсутствующего в тексте указания на блеск или только цвет.
- source_word: אֶבֶן תַּרְשִׁישׁ
  choice: камню таршиш
  rationale: Сохраняет древнее название минерала, поскольку его точное современное отождествление не установлено; неопределённость пояснена в сноске.
