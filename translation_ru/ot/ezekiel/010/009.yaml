  source_fidelity: 'Смысл в целом передан точно: четыре колеса находятся возле херувимов, по одному у каждого, а их вид уподоблен камню таршиш. Однако оборот «Видом колёса были подобны» стилистически тяжеловесен и менее естественно передаёт מַרְאֵה («вид, внешний облик»).'
