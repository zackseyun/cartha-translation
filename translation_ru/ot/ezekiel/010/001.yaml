base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/001.yaml
  text: Then I looked[a], and behold, on the expanse that was above the heads of the cherubim there appeared over them something like a sapphire stone, in appearance like the likeness of a throne.
translation:
  language: ru
  text: 'И увидел я: вот, на своде, который был над головами херувимов, над ними появилось нечто, подобное камню сапфиру[a], — на вид как подобие престола.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «камню лазуриту»; еврейское слово, традиционно переводимое как «сапфир», могло обозначать другой драгоценный камень насыщенного синего цвета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: И увидел я
  rationale: Последовательная форма с וַ־ продолжает повествование; инверсия естественна для возвышенного повествовательного регистра и сохраняет непосредственность рассказа от первого лица.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к внезапно открывшейся детали видения; «вот» передаёт её живость без архаизма.
- source_word: הָרָקִיעַ
  choice: свод
  rationale: В видении Иезекииля слово обозначает протяжённую небесную поверхность над херувимами. «Свод» сохраняет пространственную конкретность образа и звучит естественно по-русски.
- source_word: הַכְּרֻבִים
  choice: херувимов
  rationale: Устоявшееся русское библейское наименование этих небесных существ.
- source_word: כְּאֶבֶן סַפִּיר
  choice: нечто, подобное камню сапфиру
  rationale: Формулировка сохраняет сравнительный характер видения; традиционное «сапфир» сопровождается примечанием о возможной идентификации минерала.
- source_word: כְּמַרְאֵה דְּמוּת כִּסֵּא
  choice: с виду как подобие престола
  rationale: Сохранены наслаивающиеся слова приблизительного описания — «с виду», «как», «подобие», — чтобы не превращать образ в прямое отождествление.
- source_word: נִרְאָה
  choice: появилось
  rationale: Нифаль передаёт явление или становление видимым; средний род согласуется с неопределённым «нечто».
- source_word: עֲלֵיהֶם
  choice: над ними
  rationale: Местоимение относится к херувимам и продолжает вертикальную пространственную картину стиха.
theological_decisions:
- issue: Степень определённости образа в видении
  choice: 'Сохранить цепочку приблизительных сравнений: «нечто, подобное… с виду как подобие престола».'
  alternative: 'Упростить до прямого утверждения: «над ними был сапфировый престол».'
  rationale: Еврейский текст намеренно наслаивает сравнительные выражения и не отождествляет увиденное с престолом напрямую; перевод сохраняет трансцендентность и неопределённость видения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис остаётся ясным, а повтор сравнительных формул намеренно сохраняет характер видения.
