    text: 'Возможно также: «из места над херувимом». В еврейском тексте здесь стоит единственное число: «херувим».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дома»; здесь имеется в виду здание храма. Возможно также: «на порог храма».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָם
  choice: поднялась
  rationale: Форма от רוּם обозначает движение вверх; возвратная форма естественно передаёт это движение, не уточняя внешнего деятеля.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: כָּבוֹד здесь означает явленную славу и присутствие Бога; имя יהוה передано как «Яхве».
- source_word: מֵעַל הַכְּרוּב
  choice: от места над херувимом
  rationale: מֵעַל указывает на движение от положения над чем-либо или на чём-либо; формулировка сохраняет пространственный смысл, а единственное число כְּרוּב передано буквально.
- source_word: עַל מִפְתַּן הַבָּיִת
  choice: к порогу храма
  rationale: При глаголе движения עַל может обозначать направленность к месту или на него; מִפְתָּן — «порог», а הַבַּיִת в данном контексте обозначает храмовое здание.
- source_word: וַיִּמָּלֵא הַבַּיִת אֶת הֶעָנָן
  choice: храм наполнился облаком
  rationale: Естественная русская конструкция передаёт заполнение здания определённым облаком, связанным с богоявлением.
- source_word: וְהֶחָצֵר מָלְאָה
  choice: а двор — сиянием
  rationale: חָצֵר — храмовый двор; эллиптическая конструкция с тире по-русски ясно передаёт повтор глагольной идеи «наполнился».
- source_word: נֹגַהּ
  choice: сияние
  rationale: Слово обозначает яркий свет, блеск или сияние; «сияние» естественно сочетается со «славой» и не добавляет лишней образности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер движения славы
  choice: поднялась
  alternative: была поднята
  rationale: Еврейская форма допускает описание подъёма без названного внешнего деятеля; выбранный вариант не вводит неуказанного действующего лица.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным библейским звучанием. «Храм» употреблено вместо буквального «дом», чтобы контекст святилища был понятен обычному читателю; буквальный вариант отмечен в сноске. Повтор «слава Яхве» сохранён как смысловой акцент еврейского текста.
