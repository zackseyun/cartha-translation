lexical_decisions:
- source_word: וַיֵּצֵא
  choice: отошла
  rationale: Глагол יצא обозначает движение наружу или удаление от прежнего места. В данном пространственном контексте «отошла от порога» естественно передаёт движение, не усиливая его до окончательного ухода.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: Сохраняет конструкцию исходного текста и обозначение явленной славы и присутствия Яхве в видении Иезекииля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: מֵעַל מִפְתַּן
  choice: от порога
  rationale: מֵעַל указывает на удаление с позиции над порогом. В русском «отошла от порога» звучит естественнее буквального «вышла из пространства над порогом», при этом пространственная деталь частично подразумевается контекстом.
- source_word: הַבָּיִת
  choice: Дома
  rationale: Буквально «дом»; в контексте имеется в виду храм. Заглавная буква помогает обозначить конкретный Дом Яхве, не подменяя исходное слово толкованием «храм».
- source_word: וַיַּעֲמֹד
  choice: остановилась
  rationale: עמד может означать «стать, остановиться, находиться стоя». Поскольку подлежащее «слава» в русском не вполне естественно «стоит», «остановилась» ясно передаёт завершение движения без добавления идеи покоя.
- source_word: עַל הַכְּרוּבִים
  choice: над херувимами
  rationale: עַל здесь выражает пространственное положение над херувимами. «Херувимы» — закрепившаяся русская форма множественного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Передача הַבָּיִת
  choice: Дом
  alternative: храм
  rationale: Хотя речь идёт о храме, еврейский текст буквально говорит «дом». Основной текст сохраняет эту лексику, а примечание сообщает контекстуальную альтернативу.
- issue: Характер удаления славы
  choice: отошла
  alternative: покинула
  rationale: «Покинула» могло бы преждевременно придать движению оттенок окончательного оставления. «Отошла» сохраняет последовательное перемещение славы в рамках видения.
translation_notes:
  register: Современный литературный русский с достоинством пророческого повествования. Союз «И» сохраняет последовательность видения. Термин «Дом» оставлен близким к еврейскому тексту и пояснён сноской.
