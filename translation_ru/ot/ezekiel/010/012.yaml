lexical_decisions:
- source_word: בְּשָׂרָם
  choice: их тело
  rationale: Буквально «их плоть»; в перечислении частей живых существ собирательное «их тело» естественно передаёт физический облик и сохраняет единственное число еврейского выражения.
- source_word: גַבֵּיהֶם
  choice: их спины
  rationale: В ряду частей тела значение «спины» наиболее уместно; возможные в иных контекстах значения, связанные с высотой или ободом, здесь маловероятны.
- source_word: וִידֵיהֶם
  choice: руки
  rationale: Обычное и прямое соответствие יָד; контекст не требует расширять значение до «предплечий» или «рук целиком».
- source_word: וְכַנְפֵיהֶם
  choice: крылья
  rationale: Стандартное конкретное значение כָּנָף в описании видения.
- source_word: וְהָאוֹפַנִּים
  choice: а также колёса
  rationale: אוֹפַן обозначает колесо. Союз перед последним членом длинного ряда естественно передан сочетанием «а также».
- source_word: מְלֵאִים עֵינַיִם
  choice: были ... полны глаз
  rationale: Сохраняет буквальный образ «полны глаз», не заменяя его более толковательным «покрыты глазами».
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Современное естественное выражение со значением «кругом, повсюду вокруг».
- source_word: לְאַרְבַּעְתָּם אוֹפַנֵּיהֶם
  choice: колёса, принадлежавшие всем четверым
  rationale: Конечная фраза вновь называет колёса и соотносит их со всеми четырьмя существами; пояснительная конструкция сохраняет это возобновление и делает отношение ясным по-русски.
