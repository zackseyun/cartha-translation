base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/006.yaml
  text: And it happened[a], when he commanded the man clothed in linen, saying, “Take fire from between the wheelwork, from between the cherubim,” that he went in and stood beside the wheel.
translation:
  language: ru
  text: 'И когда он повелел человеку, одетому в льняные одежды: «Возьми огонь из колесной конструкции, из среды херувимов», тот вошёл и остановился у колеса.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּצַוֺּתוֹ
  choice: И когда он повелел
  rationale: Конструкция וַיְהִי с инфинитивом и ב передаёт наступление события во времени. По-русски естественное «И когда» сохраняет повествовательную связь без тяжеловесного «И было». Подлежащее оставлено местоимением, как в еврейском тексте.
- source_word: הָאִישׁ לְבֻשׁ הַבַּדִּים
  choice: человеку, одетому в льняные одежды
  rationale: Передаёт определённого участника видения и смысл לְבֻשׁ; множественное «одежды» естественно отражает הַבַּדִּים и звучит современно.
- source_word: קַח אֵשׁ
  choice: Возьми огонь
  rationale: Прямое соответствие императиву קַח и дополнению אֵשׁ без добавления отсутствующего в оригинале количественного оттенка.
- source_word: מִבֵּינוֹת לַגַּלְגַּל
  choice: из пространства между колёсами
  rationale: Редкое גַּלְגַּל в контексте видения обозначает колесную структуру; оборот с מִבֵּינוֹת пространственный. Множественное число по-русски ясно выражает пространство внутри совокупности колёс, а примечание сохраняет лексическую неоднозначность.
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: из пространства между херувимами
  rationale: Сохраняется повтор пространственного оборота оригинала и его визуальная выразительность.
- source_word: וַיָּבֹא
  choice: тот вошёл
  rationale: В контексте движение направлено внутрь описанного пространства. Указательное «тот» естественно снимает русскую местоименную двусмысленность, не меняя референта — человека в льняных одеждах.
- source_word: וַיַּעֲמֹד אֵצֶל הָאוֹפָן
  choice: остановился у колеса
  rationale: אֵצֶל передано естественным пространственным «у», а единственное число הָאוֹפָן сохранено. «Остановился» в данной последовательности движения идиоматично выражает וַיַּעֲמֹד.
theological_decisions:
- issue: Кто отдаёт повеление
  choice: Сохранено местоимение «он»
  alternative: «Господь» или «Сидящий на престоле»
  rationale: В данном стихе субъект выражен лишь местоименным суффиксом. Его явное отождествление добавило бы толкование, которого в этой фразе нет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до естественной русской временной конструкции; пространственный повтор оригинала намеренно сохранён.
