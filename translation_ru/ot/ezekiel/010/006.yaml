revisions:
- from: 'И когда он повелел человеку, одетому в льняные одежды: «Возьми огонь из пространства между колёсами[a], из пространства между херувимами», тот вошёл и остановился у колеса.'
  to: 'И когда он повелел человеку, одетому в льняные одежды: «Возьми огонь из колесной конструкции, из среды херувимов», тот вошёл и остановился у колеса.'
  rationale: 'Исправлен перевод גַּלְגַּל и связанный с ним якорь примечания: основной текст отражает вероятный структурный смысл в контексте видения, а примечание сохраняет возможное значение «колесо». Пространственный повтор передан по-русски естественнее, без добавления «пространства».'
  reviewer_model: gpt-5.6-terra
