base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/007.yaml
  text: Then the cherub stretched out his hand from among the cherubim to the fire that was among the cherubim[a], and he lifted it up and put it into the palms of the one clothed in linen[b], who took it and went out.
translation:
  language: ru
  text: Тогда херувим протянул руку из среды херувимов к огню, который был среди херувимов[a], поднял его и положил в ладони облачённого в льняные одежды[b]. Тот взял его и вышел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «из среды (между) херувимами» и «к огню, который был между херувимами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в ладони облачённого в льняные одежды». В контексте это тот же человек, который в 10:2 и 10:6 назван человеком, одетым в льняные одежды.'
    reason: cross_reference
lexical_decisions:
- source_word: הַכְּרוּב
  choice: херувим
  rationale: Существительное стоит в единственном числе с артиклем; речь идёт об одном из херувимов, совершающем действие.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: протянул руку
  rationale: В сочетании с «рукой» глагол передаёт физическое движение — протягивание руки.
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: из среды херувимов
  rationale: Передаёт исходное местоположение внутри группы; буквальное пространственное «между» отмечено в сноске.
- source_word: הָאֵשׁ אֲשֶׁר בֵּינוֹת הַכְּרֻבִים
  choice: огню, который был среди херувимов
  rationale: Сохраняет повтор пространственного описания и определённость огня.
- source_word: וַיִּשָּׂא
  choice: взял огонь
  rationale: Глагол означает «поднять, взять, понести»; объект в еврейском подразумевается из ближайшего контекста. Повтор «огонь» устраняет неясное местоимение, не уточняя вещество как угли.
- source_word: וַיִּתֵּן
  choice: положил его
  rationale: В данной сцене глагол «дать» обозначает помещение передаваемого огня в пригоршни получателя.
- source_word: חָפְנֵי
  choice: пригоршни
  rationale: Слово обозначает сложенные чашей ладони и конкретнее общего «руки».
- source_word: לְבֻשׁ הַבַּדִּים
  choice: облачённого в льняные одежды
  rationale: В самом стихе лицо названо описательно, без повторения слова «мужчина»; множественная форма допускает значение льняных одежд.
- source_word: וַיִּקַּח וַיֵּצֵא
  choice: Тот взял его и вышел
  rationale: Смена подлежащего выражена отдельным предложением, чтобы по-русски ясно отнести последние действия к облачённому в льняные одежды.
theological_decisions:
- issue: Кто получает огонь
  choice: облачённый в льняные одежды
  alternative: мужчина в льняной одежде
  rationale: Контекст 10:2, 6 отождествляет его с мужчиной, но в данном стихе еврейский текст буквально содержит лишь причастное описание; основной текст не добавляет отсутствующее существительное.
- issue: Что именно передаётся
  choice: огонь
  alternative: горящие угли
  rationale: В непосредственном тексте назван אֵשׁ, «огонь», тогда как контекст говорит также об углях. Перевод сохраняет лексику данного стиха и не снимает напряжение между описаниями.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Херувим» сохраняет специальный термин; «облачённый» уместно передаёт торжественный регистр, а синтаксис остаётся понятным обычному читателю.
