  text: וּ/מַ֨רְאֵי/הֶ֔ם דְּמ֥וּת אֶחָ֖ד לְ/אַרְבַּעְתָּ֑/ם כַּ/אֲשֶׁ֛ר יִהְיֶ֥ה הָ/אוֹפַ֖ן בְּ/ת֥וֹךְ הָ/אוֹפָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/010.yaml
  text: As for their appearance[a], the four of them had one likeness[b], as when a wheel is within a wheel.
translation:
  language: ru
  text: 'Вид у всех четырёх был одинаковый: словно одно колесо находилось внутри другого.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַרְאֵיהֶם
  choice: Вид у всех четырёх
  rationale: מַרְאֶה обозначает внешний вид, видимую форму. Союз ו передан естественным продолжением описания без отдельного «и»; принадлежность четырём выражена совместно со следующей фразой.
- source_word: דְּמוּת אֶחָד לְאַרְבַּעְתָּם
  choice: был одинаковый
  rationale: Буквально «одно подобие у четырёх их» подчёркивает полное сходство всех четырёх. Русское «у всех четырёх был одинаковый [вид]» ясно и естественно передаёт эту мысль, не добавляя толкования.
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: словно ... находилось
  rationale: Сравнительная конструкция вводит зрительный образ. «Словно» естественно звучит в современном русском повествовании; прошедшее время согласовано с описанием видения.
- source_word: הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: одно колесо находилось внутри другого
  rationale: Определённые формы в еврейском буквально означают «колесо внутри колеса», однако русская сравнительная конструкция с «одно ... другого» естественно и точно передаёт взаимное расположение, не уточняя его механику.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, наглядная формулировка сохраняет загадочность устройства колёс и не пытается объяснить, каким именно образом одно колесо находилось внутри другого.
