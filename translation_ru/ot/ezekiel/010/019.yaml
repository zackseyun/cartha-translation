  text: וַ/יִּשְׂא֣וּ הַ/כְּרוּבִ֣ים אֶת כַּ֠נְפֵי/הֶם וַ/יֵּר֨וֹמּוּ מִן הָ/אָ֤רֶץ לְ/עֵינַ/י֙ בְּ/צֵאתָ֔/ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וַֽ/יַּעֲמֹ֗ד פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הַ/קַּדְמוֹנִ֔י וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/019.yaml
  text: Then the cherubim lifted up their wings and rose from the earth before my eyes as they went out[a], with the wheels beside them; and it stood at the entrance of the eastern gate of the house of Yahweh[c][b], and the glory of the God of Israel was above them, from above.
translation:
  language: ru
  text: Тогда херувимы подняли свои крылья и поднялись от земли у меня на глазах, когда выходили; колёса были рядом с ними[a]. Оно остановилось[c] у входа в восточные ворота дома Яхве[b], а слава Бога Израиля была над ними, свыше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «колёса находились напротив них» или «колёса были рядом с ними». Еврейское выражение указывает на соответствующее взаимное положение.'
    reason: lexical_alternative
  - marker: b
    text: «Яхве» передаёт еврейское имя יהוה.
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте глагол «остановилось» стоит в мужском роде единственного числа. Возможно, подразумевается всё явление — престол-колесница; возможен и перевод по смыслу: «они остановились».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׂאוּ הַכְּרוּבִים אֶת־כַּנְפֵיהֶם
  choice: херувимы подняли крылья
  rationale: Глагол נשׂא с «крыльями» обозначает их поднятие; традиционное «херувимы» сохраняет особый библейский образ.
- source_word: וַיֵּרוֹמּוּ מִן־הָאָרֶץ
  choice: оторвались от земли
  rationale: Передаёт видимое восхождение естественным современным русским языком, не уточняя, поднялись ли они сами или были подняты.
- source_word: לְעֵינַי
  choice: у меня на глазах
  rationale: Естественный русский эквивалент, сохраняющий свидетельскую перспективу Иезекииля.
- source_word: בְּצֵאתָם
  choice: когда они выходили
  rationale: Передаёт одновременность действия, выраженную инфинитивной конструкцией с ב.
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: колёса двигались рядом с ними
  rationale: לְעֻמָּה обозначает соответствующее или соотнесённое положение. Глагол «двигались» восстановлен по контексту выхода, чтобы фраза была ясна по-русски; альтернативная пространственная трактовка отмечена в сноске.
- source_word: פֶּתַח שַׁעַר ... הַקַּדְמוֹנִי
  choice: у входа в восточные ворота
  rationale: Естественно передаёт входное пространство восточных ворот храмового комплекса.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: «Дом» сохраняет храмовую метафору исходного текста, а «Яхве» передаёт личное Божье имя.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: над ними, в вышине
  rationale: Переданы оба пространственных элемента еврейской фразы без их избыточно буквального удвоения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Подлежащее при וַיַּעֲמֹד
  choice: «оно остановилось» с поясняющей сноской
  alternative: «они остановились» — херувимы и колёса
  rationale: Еврейский глагол стоит в мужском роде единственного числа, хотя ближайшие явно названные участники имеют форму множественного числа. Перевод не исправляет это напряжение и допускает собирательное обозначение престола-колесницы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис разделён на ясные фразы; необычное единственное число исходного текста сознательно сохранено и пояснено. Пространственное удвоение в конце передано как «над ними, в вышине».
