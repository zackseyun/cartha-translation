  text: הִ֣יא הַ/חַיָּ֗ה אֲשֶׁ֥ר רָאִ֛יתִי תַּ֥חַת אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּֽ/נְהַר כְּבָ֑ר וָ/אֵדַ֕ע כִּ֥י כְרוּבִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/020.yaml
  text: This was the living creature that I saw beneath the God of Israel by the Kebar Canal[a], and I knew that they were cherubim.
translation:
  language: ru
  text: Это было живое существо, которое я видел под Богом Израиля у реки Кевар[a], и я понял, что они — херувимы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у канала Кевар»; еврейское слово может обозначать как реку, так и канал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִיא הַחַיָּה
  choice: Это было то живое существо
  rationale: Женское местоимение указывает на ранее описанное חַיָּה. Конструкция с «то» естественно выражает ретроспективное отождествление, а единственное число сохраняет грамматическую форму еврейского текста.
- source_word: אֲשֶׁר רָאִיתִי
  choice: которое я видел
  rationale: Прямо и естественно передаёт относительное придаточное и прошедшее время.
- source_word: תַּחַת
  choice: под
  rationale: Сохраняет пространственный образ и звучит естественно в современном русском языке.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богом Израиля
  rationale: Точно передаёт определённое сочетание в конструктивном состоянии и традиционное библейское именование.
- source_word: בִּנְהַר כְּבָר
  choice: у реки Кевар
  rationale: Предлог בְּ здесь имеет локативное значение. נְהַר допускает значения «река» и «канал»; основной текст сохраняет привычное широкое обозначение «река», а вариант отмечен в сноске. Имя передано как «Кевар» по еврейской форме.
- source_word: וָאֵדַע
  choice: и я понял
  rationale: В контексте видения глагол описывает момент распознания или осознания; «понял» естественнее русского «узнал» и яснее передаёт развитие повествования.
- source_word: כִּי
  choice: что
  rationale: Вводит содержание того, что понял Иезекииль.
- source_word: כְרוּבִים הֵמָּה
  choice: это херувимы
  rationale: Сохраняет переход еврейского текста от единственного собирательного обозначения к множественному числу и прямо выражает отождествление. «Херувимы» — нормативная русская библейская форма.
theological_decisions:
- issue: Отождествление существ у престола
  choice: 'Сохранить прямое утверждение: «это херувимы»'
  alternative: Передать более обобщённо как «живые существа», ослабив момент распознания
  rationale: Сам стих сообщает, что Иезекииль распознал ранее увиденных существ как херувимов; перевод не должен сглаживать это повествовательно-богословское отождествление.
- issue: Единственное и множественное число
  choice: Сохранить «живое существо» в единственном числе и «херувимы» во множественном
  alternative: 'Согласовать обе части во множественном числе: «живые существа… они были херувимами»'
  rationale: Необычный переход числа присутствует в еврейском тексте и, вероятно, отражает собирательное обозначение видения с последующим распознанием отдельных существ; его не следует без необходимости устранять.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Термины «живое существо» и «херувимы» сохраняют образность видения; синтаксис остаётся ясным для обычного читателя.
