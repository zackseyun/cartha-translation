  text: וְ/הַ/כְּרֻבִ֗ים עֹֽמְדִ֛ים מִ/ימִ֥ין לַ/בַּ֖יִת בְּ/בֹא֣/וֹ הָ/אִ֑ישׁ וְ/הֶ/עָנָ֣ן מָלֵ֔א אֶת הֶ/חָצֵ֖ר הַ/פְּנִימִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/003.yaml
  text: The cherubim were standing on the right side of the house when the man went in[a], and the cloud filled the inner court.
translation:
  language: ru
  text: Херувимы стояли с правой стороны храма[a], когда вошёл человек, и облако наполнило внутренний двор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с правой стороны храма». При храмовой ориентации это южная сторона.'
    reason: Уточняет буквальное направление и его пространственное значение в храмовом контексте.
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: херувимы
  rationale: Сохранено традиционное библейское наименование небесных существ и определённость, выраженная артиклем.
- source_word: עֹמְדִים
  choice: стояли
  rationale: Причастие описывает продолжающееся положение херувимов в данной сцене; русское несовершенное прошедшее естественно передаёт этот смысл.
- source_word: מִימִין לַבַּיִת
  choice: с правой стороны храма
  rationale: Передано буквальное пространственное значение «справа/с правой стороны» без замены его истолкованием «с южной стороны»; в контексте בַּיִת обозначает храм.
- source_word: בְּבֹאוֹ הָאִישׁ
  choice: когда вошёл человек
  rationale: Инфинитивная конструкция с בְּ имеет временное значение. В русском придаточное с «когда» звучит естественно и сохраняет завершённость входа.
- source_word: הָאִישׁ
  choice: человек
  rationale: Исходный текст говорит просто «человек» с артиклем; уточнение «одетый в льняную одежду» не внесено из контекста.
- source_word: הֶעָנָן
  choice: облако
  rationale: Прямой перевод существительного с сохранением контекстуальной определённости; богословское истолкование облака в основной текст не добавлено.
- source_word: מָלֵא
  choice: наполнило
  rationale: Форма qatal передаёт завершённое действие, продвигающее повествование.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: внутренний двор
  rationale: Обычное и ясное обозначение внутреннего храмового двора в современном русском языке.
theological_decisions:
- issue: Направление, обозначенное מִימִין в храмовом контексте
  choice: с правой стороны храма
  alternative: с южной стороны храма
  rationale: Еврейский текст прямо говорит о правой стороне. При принятой ориентации храма это соответствует южной стороне, однако перевод сохраняет исходное пространственное выражение, а контекстуальное уточнение вынесено в сноску.
- issue: Идентификация הָאִישׁ
  choice: человек
  alternative: человек, одетый в льняную одежду
  rationale: Стих использует лишь существительное с артиклем. Более полная идентификация ясна из контекста, но её добавление здесь сделало бы перевод расширительным.
translation_notes:
  register: Современный литературный русский язык, сдержанный и ясный библейский регистр. Начальное וְ передано связностью повествования без добавления отдельного вводного слова. Термины «херувимы» и «внутренний двор» сохраняют привычную храмовую лексику.
