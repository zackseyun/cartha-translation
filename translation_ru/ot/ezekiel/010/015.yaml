  text: And the cherubim rose up[a]. They were the living creature that I had seen by the Kebar Canal.
translation:
  language: ru
  text: И поднялись херувимы. Это было живое существо, которое я видел у реки Кевар[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте «живое существо» стоит в единственном числе, хотя говорится о херувимах; это может представлять их как единое целое или как один класс существ. Название водного пути также можно передать: «канал Кевар».'
    reason: Сохраняет необычное единственное число оригинала и отмечает допустимое значение נְהַר, не навязывая интерпретацию.
lexical_decisions:
- source_word: וַיֵּרֹמּוּ
  choice: поднялись
  rationale: Форма глагола רוּם описывает движение вверх; «поднялись» естественно передаёт его без добавления внешнего действующего лица.
- source_word: הַכְּרוּבִים
  choice: херувимы
  rationale: Общепринятая русская библейская передача множественного כְּרוּבִים, сохраняющая узнаваемость и возвышенный регистр.
- source_word: הִיא הַחַיָּה
  choice: это были те живые существа
  rationale: В еврейском тексте местоимение и существительное стоят в женском роде единственного числа, хотя соотносятся с множественным «херувимы». В основном тексте употреблено естественное русское множественное число, а формальная особенность оригинала отмечена в сноске.
- source_word: אֲשֶׁר רָאִיתִי
  choice: которых я видел
  rationale: Контекст ясно указывает на прежнее видение; простое прошедшее время по-русски естественно выражает эту временную связь.
- source_word: בִּנְהַר כְּבָר
  choice: у реки Кевар
  rationale: נְהַר допускает значения «река» и «канал». «Река Кевар» сохраняет традиционно понятную форму, не исключая более точного для вавилонского контекста понимания как канала; имя передано современной транслитерацией «Кевар».
theological_decisions:
- issue: Отождествление херувимов с существами из видения в Иезекииле 1
  choice: 'Передать отождествление прямо во множественном числе: «Это были те живые существа, которых я видел…»'
  alternative: «Это было то живое существо, которое я видел…»
  rationale: Еврейское единственное число может представлять группу как единое целое или класс существ. Русское множественное число ясно связывает фразу с «херувимами», а сноска сохраняет грамматическое напряжение оригинала и не навязывает метафизического объяснения.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской торжественности. Формулировка проста и понятна; необычное единственное число оригинала вынесено в сноску, чтобы основной текст оставался естественным.
