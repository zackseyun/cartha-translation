source:
  edition: WLC
  text: בְּ/עָמְדָ֣/ם יַעֲמֹ֔דוּ וּ/בְ/רוֹמָ֖/ם יֵר֣וֹמּוּ אוֹתָ֑/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/017.yaml
  text: When they stood still[a], these stood still; and when they were lifted up, these were lifted up with them, for the spirit of the living creature was in them.
translation:
  language: ru
  text: Когда они останавливались, останавливались и те; когда они поднимались, те поднимались вместе с ними, потому что дух живого существа[a] был в них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух жизни был в них», если הַחַיָּה понимать более отвлечённо; еврейское слово רוּחַ также может означать «дыхание» или «ветер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָמְדָם
  choice: когда они останавливались
  rationale: Предлог ב с инфинитивом и суффиксом 3-го лица множественного числа образует временную конструкцию. В контексте согласованного движения существ и колёс «останавливались» естественнее и точнее, чем буквальное «стояли».
- source_word: יַעֲמֹדוּ
  choice: останавливались и те
  rationale: Имперфект продолжает описание повторяющегося согласованного действия. Указательное «те» обозначает подразумеваемый субъект — колёса — и отличает его от живых существ.
- source_word: וּבְרוֹמָם
  choice: когда они поднимались
  rationale: Параллельная временная конструкция с инфинитивом רום обозначает здесь физическое движение вверх, а не возвеличивание.
- source_word: יֵרוֹמּוּ אֹתָם
  choice: те поднимались вместе с ними
  rationale: Контекст показывает, что колёса поднимались одновременно с живыми существами. «Вместе с ними» естественно передаёт соотнесённость, выраженную необычной еврейской конструкцией с אֹתָם.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину согласованного движения; «потому что» ясно передаёт объяснительную связь.
- source_word: רוּחַ
  choice: дух
  rationale: В видении слово может обозначать дух, дыхание или движущую силу. «Дух» сохраняет широту и таинственность образа.
- source_word: הַחַיָּה
  choice: живого существа
  rationale: Форма единственного числа сохранена как в еврейском тексте; в контексте она может иметь собирательное значение. «Живое существо» соответствует устойчивой лексике видения Иезекииля и не сводит образ к обычному животному.
- source_word: בָּהֶם
  choice: был в них
  rationale: Простое местное выражение; местоимение относится к колёсам, названным в предшествующем контексте.
theological_decisions:
- issue: Значение רוּחַ הַחַיָּה в видении
  choice: дух живого существа
  alternative: дух жизни; дыхание или дух живого существа
  rationale: Наиболее непосредственно выражение указывает на одушевляющий дух, связанный с живым существом и объясняющий согласованное движение колёс. Вариант не устраняет присущую еврейскому выражению неоднозначность; абстрактное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Параллелизм двух частей сохранён; «те» помогает различить живых существ и колёса без внесения отсутствующего в стихе существительного.
