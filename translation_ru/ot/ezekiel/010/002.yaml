base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/002.yaml
  text: And he said to the man clothed in linen[a], “Go in among the wheelwork, under the cherub, and fill your hands with coals of fire from among the cherubim, and scatter them over the city.” And he went in before my eyes.
translation:
  language: ru
  text: 'Он сказал человеку в льняных одеждах: «Войди между колёсами[a], под херувима, набери полные горсти горящих углей из среды херувимов и разбросай их по городу». И тот вошёл у меня на глазах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутрь колёсной конструкции». Еврейское слово может обозначать всю колёсную систему как единое целое, а не отдельное колесо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשׁ הַבַּדִּים
  choice: одетому в льняную одежду
  rationale: Причастный оборот определяет ранее упомянутого человека по его одежде. Русская формулировка естественна и сохраняет указание на лён, не перегружая текст буквальным воспроизведением формы множественного числа.
- source_word: בֵּינוֹת לַגַּלְגַּל
  choice: между колёсами[a]
  rationale: Фраза имеет пространственный смысл. Множественное «колёсами» естественно по-русски в контексте видения; возможное собирательное значение колесной конструкции отмечено в сноске.
- source_word: אֶל תַּחַת לַכְּרוּב
  choice: под херувима
  rationale: Сохранены пространственное значение и единственное число еврейского текста без замены на обобщающее множественное.
- source_word: וּמַלֵּא חָפְנֶיךָ
  choice: наполни пригоршни
  rationale: חָפְנַיִם обозначает сложенные ладони или количество, которое ими можно зачерпнуть. «Пригоршни» конкретно и естественно передаёт образ.
- source_word: גַחֲלֵי אֵשׁ
  choice: горящими углями
  rationale: Так передаётся образ раскалённых огнём углей на естественном современном русском языке без дополнительного толкования.
- source_word: מִבֵּינוֹת לַכְּרֻבִים
  choice: из пространства между херувимами
  rationale: Формулировка ясно указывает на происхождение углей из пространства, находящегося среди херувимов, и избегает двусмысленного русского «из-за херувимов».
- source_word: וּזְרֹק עַל הָעִיר
  choice: рассыпь их над городом
  rationale: Местоимение «их» естественно восстанавливает подразумеваемый объект — угли. «Рассыпь» передаёт распределённое бросание множества углей, а «над городом» сохраняет пространственную образность עַל.
- source_word: לְעֵינָי
  choice: у меня на глазах
  rationale: Современный русский идиом точно сохраняет свидетельскую перспективу Иезекииля.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Он сказал ...
  rationale: Повтор глагола речи не воспроизведён механически, поскольку в русском он звучал бы как ненужный сбой; единый глагол естественно вводит прямую речь и передаёт функцию еврейской конструкции.
theological_decisions:
- issue: Смысл рассыпания углей
  choice: Передать действие прямо, не объясняя его символику в основном тексте.
  alternative: Явно истолковать угли как знак суда или очищения.
  rationale: В ближайшем контексте действие связано с судом над Иерусалимом, однако сам стих не даёт прямого толкования образа. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис сделан ясным для обычного читателя; образность видения и пространственные отношения сохранены без конфессионального истолкования.
