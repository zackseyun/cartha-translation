base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/011.yaml
  text: When they went, they would go in any of their four directions; they did not turn as they went, for to the place where the head faced, they followed after it; they did not turn as they went.
translation:
  language: ru
  text: Когда они двигались, они шли по любому из четырёх направлений; двигаясь, они не поворачивали. Куда обращалась голова, туда они шли за ней; двигаясь, они не поворачивали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל אַרְבַּעַת רִבְעֵיהֶם
  choice: в любую из четырёх сторон
  rationale: Выражение буквально указывает на «четыре стороны»; с учётом контекста четырёхстороннего движения естественное русское «в любую из» передаёт возможность движения по каждому из этих направлений.
- source_word: הָרֹאשׁ
  choice: голова
  rationale: Сохранено прямое значение определённого существительного без уточнения, кому именно принадлежит голова, поскольку исходный текст этого явно не разрешает.
- source_word: אַחֲרָיו יֵלֵכוּ
  choice: они и следовали за ней
  rationale: Передано буквальное пространственное отношение «за ним/вслед за ним»; в русском местоимение согласовано со словом «голова» и не заменено толкованием вроде «колёса следовали».
theological_decisions:
- issue: Референт слова «голова» и подлежащего множественного числа
  choice: 'Сохранить неопределённость: «голова» и «они» без поясняющих вставок'
  alternative: 'Уточнить: «куда направлялось переднее колесо, туда шли остальные» или отнести голову к живому существу'
  rationale: Еврейский стих не называет референты достаточно явно; пояснение внесло бы в текст спорное толкование видения.
translation_notes:
  register: Современный литературный русский язык; повтор заключительной формулы сохранён как значимая черта оригинала. «Двигались» позволяет естественно описать движение виденных существ и колёс, не сужая референт.
