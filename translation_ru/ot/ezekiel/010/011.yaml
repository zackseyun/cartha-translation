revisions:
- from: Когда они двигались, они могли идти в любую из четырёх сторон; двигаясь, они не поворачивали. Куда обращалась голова, туда они и следовали за ней; двигаясь, они не поворачивали.
  to: Когда они двигались, они шли по любому из четырёх направлений; двигаясь, они не поворачивали. Куда обращалась голова, туда они шли за ней; двигаясь, они не поворачивали.
  rationale: Убрана не выраженная в оригинале модальность «могли». Сохранены повтор, образный характер описания и синтаксическая неопределённость относительно того, чья это «голова» и кто именно обозначен словом «они».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'В первой части «могли идти» добавляет модальность возможности, которой в еврейском тексте нет: несовершенные формы описывают обычный способ движения. Следует передать движение без «могли». Повтор «не поворачивали, двигаясь» и неуточнённый референт «головы» сохранены. Во второй части «шли за ней» ближе к אַחֲרָיו יֵלֵכוּ («шли за ним/ней»), чем несколько более интерпретирующее «следовали за ней».'
  naturalness: Предлагаемая редакция остаётся современным литературным русским. «По любому из четырёх направлений» естественно передаёт возможность выбора направления как характеристику движения, не превращая её в явно выраженную модальность.
  terminology: «Голова» корректно сохраняет буквальное הָרֹאשׁ и не навязывает спорный референт. Терминологических или богословских добавлений нет.
  issues:
  - severity: medium
    issue: Добавлена модальность в «они могли идти».
    rationale: Исходный текст говорит, что они шли в направлении своих четырёх сторон, а не прямо утверждает их способность идти; русское «могли» вносит дополнительный смысл.
  - severity: low
    issue: «Следовали за ней» несколько сильнее подразумевает отношение ведущего и следующих.
    rationale: אַחֲרָיו יֵלֵכוּ буквально выражает движение «за ним/ней»; «шли за ней» сохраняет пространственную формулировку и неопределённость референта.
  revised_text: Когда они двигались, они шли по любому из четырёх направлений; двигаясь, они не поворачивали. Куда обращалась голова, туда они шли за ней; двигаясь, они не поворачивали.
