  yaml_path: translation/ot/ezekiel/010/022.yaml
  text: And the likeness of their faces was the same as the faces that I had seen by the Kebar River—their appearances and themselves[b][a]. Each one went straight ahead.
translation:
  language: ru
  text: Облик их лиц был таким же, как у лиц, которые я видел у реки Ховар; их облик и они сами были теми же.[a] Каждый шёл прямо вперёд.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их облик и они сами»; эта сжатая формула подчёркивает, что это были те же существа, которых Иезекииль видел прежде у реки Ховар.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый шёл в сторону своего лица»; то есть двигался прямо вперёд, не сворачивая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת פְּנֵיהֶם
  choice: И вид их лиц
  rationale: דְּמוּת означает подобие, образ или вид. В данном описании «вид их лиц» естественно по-русски передаёт зрительное сходство и сохраняет конкретное упоминание лиц.
- source_word: הֵמָּה הַפָּנִים אֲשֶׁר רָאִיתִי
  choice: был таким же, как у тех лиц, которые я видел
  rationale: Эмфатическое местоимение הֵמָּה устанавливает тождество с лицами из прежнего видения; русская сравнительно-отождествляющая конструкция передаёт смысл без неестественного буквального синтаксиса.
- source_word: עַל נְהַר כְּבָר
  choice: у реки Кевар
  rationale: Предлог עַל здесь обозначает местонахождение у реки. Имя כְּבָר передано транслитерацией «Кевар».
- source_word: מַרְאֵיהֶם וְאוֹתָם
  choice: тот же облик, и это были те же существа
  rationale: 'Сжатое еврейское выражение буквально соединяет «их облик» и «их самих». Развёрнутая русская формулировка сохраняет усиленное утверждение: совпадал не только внешний вид — это были те же самые существа.'
- source_word: אִישׁ אֶל עֵבֶר פָּנָיו יֵלֵכוּ
  choice: Каждый шёл прямо перед собой
  rationale: Буквально каждый двигался «в сторону своего лица». В контексте видения это означает движение вперёд без поворота; выбранная формулировка естественна для современного русского языка.
