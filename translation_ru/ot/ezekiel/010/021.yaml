  text: אַרְבָּעָ֨ה אַרְבָּעָ֤ה פָנִים֙ לְ/אֶחָ֔ד וְ/אַרְבַּ֥ע כְּנָפַ֖יִם לְ/אֶחָ֑ד וּ/דְמוּת֙ יְדֵ֣י אָדָ֔ם תַּ֖חַת כַּנְפֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/021.yaml
  text: Each one had four faces[a], and each one had four wings, and the likeness of human hands was under their wings.
translation:
  language: ru
  text: У каждого было по четыре лица и по четыре крыла, а под крыльями у них было подобие человеческих рук[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «рук человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה אַרְבָּעָה ... לְאֶחָד
  choice: у каждого было по четыре
  rationale: Повторение числительного и сочетание с לְאֶחָד выражают распределительное значение. Русская конструкция «у каждого было по четыре» передаёт его ясно и естественно.
- source_word: פָנִים
  choice: лица
  rationale: Форма множественного числа в контексте видения обозначает четыре лица у каждого существа.
- source_word: וְאַרְבַּע כְּנָפַיִם לְאֶחָד
  choice: и по четыре крыла
  rationale: Сохраняет параллелизм первого и второго описаний, не повторяя избыточно «у каждого».
- source_word: וּדְמוּת
  choice: а ... было подобие
  rationale: «Подобие» сохраняет характерный для видений Иезекииля язык сходства, не отождествляя увиденное с человеческими руками без оговорки. Союз «а» естественно вводит следующую особенность существ.
- source_word: יְדֵי אָדָם
  choice: человеческих рук
  rationale: אָדָם здесь обозначает человека как вид, а не конкретного мужчину; прилагательное «человеческих» естественно передаёт противопоставление другим чертам существ.
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: под крыльями у них
  rationale: Передаёт пространственное отношение и множественный суффикс, относящийся к живым существам.
theological_decisions:
- issue: Значение אָדָם в выражении יְדֵי אָדָם
  choice: человеческих рук
  alternative: рук человека
  rationale: Речь идёт о человеческом облике рук, а не о мужском поле. Основной вариант точнее и естественнее выражает видовое значение, а буквальная конструкция отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной образности видения. Распределительная конструкция передана идиоматически, а термин «подобие» сохранён ради смысловой осторожности оригинала.
