  text: וְ/קוֹל֙ כַּנְפֵ֣י הַ/כְּרוּבִ֔ים נִשְׁמַ֕ע עַד הֶ/חָצֵ֖ר הַ/חִיצֹנָ֑ה כְּ/ק֥וֹל אֵל שַׁדַּ֖י בְּ/דַבְּרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/005.yaml
  text: And the sound of the wings of the cherubim was heard as far as the outer court[a], like the sound of God Almighty when he speaks.
translation:
  language: ru
  text: И шум крыльев херувимов был слышен до внешнего двора — словно голос Бога Всемогущего, когда Он говорит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-еврейски: «словно голос Эль-Шаддая, когда Он говорит». «Эль-Шаддай» здесь переведено как «Бог Всемогущий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹל
  choice: И шум
  rationale: קוֹל может означать «звук», «голос» или «шум». Применительно к крыльям естественно русское «шум»; союз וְ передаёт продолжение повествования.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: крыльев херувимов
  rationale: Сохраняется конкретный образ крыльев и традиционное библейское обозначение небесных существ — «херувимы».
- source_word: נִשְׁמַע
  choice: был слышен
  rationale: Нифаль передаёт пассивное значение; формулировка естественна по-русски и не добавляет оттенка возможности.
- source_word: עַד הֶחָצֵר הַחִיצֹנָה
  choice: до внешнего двора
  rationale: עַד указывает на предел распространения звука, а «внешний двор» является ясным обозначением храмового пространства.
- source_word: כְּקוֹל
  choice: словно голос
  rationale: В сравнении קוֹל уже относится к говорящему Богу, поэтому «голос» точнее русского «звук» и подготавливает выражение «когда Он говорит».
- source_word: אֵל שַׁדַּי
  choice: Бога Всемогущего
  rationale: Божественный титул переведён, а не транслитерирован. Такое сочетание сохраняет компоненты «Бог» и «Всемогущий» и естественно включается в родительную конструкцию.
- source_word: בְּדַבְּרוֹ
  choice: когда Он говорит
  rationale: Предлог בְּ с инфинитивом и местоименным суффиксом выражает временное обстоятельство. Настоящее время описывает характерный голос Бога, не ограничивая сравнение единичным прошлым событием.
theological_decisions:
- issue: Передача божественного титула אֵל שַׁדַּי
  choice: Бог Всемогущий
  alternative: Эль-Шаддай
  rationale: Перевод титула делает смысл доступным читателю и не вводит дополнительных вероучительных уточнений; сноска сохраняет исходную еврейскую форму.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Шум крыльев» звучит естественно, тогда как «голос» в сравнении подчёркивает речь Бога. Тире делает длинное сравнение ясным без изменения синтаксической связи.
