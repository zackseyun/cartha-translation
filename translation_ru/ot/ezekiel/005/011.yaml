  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א יַ֚עַן אֶת מִקְדָּשִׁ֣/י טִמֵּ֔את בְּ/כָל שִׁקּוּצַ֖יִ/ךְ וּ/בְ/כָל תּוֹעֲבֹתָ֑יִ/ךְ וְ/גַם אֲנִ֤י אֶגְרַע֙ וְ/לֹא תָח֣וֹס עֵינִ֔/י וְ/גַם אֲנִ֖י לֹ֥א אֶחְמֽוֹל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, surely because you have defiled my sanctuary with all your detestable things and with all your abominations, I also will diminish you; my eye will not spare, and I also will show no pity.
translation:
  language: ru
  text: 'Поэтому, так же верно, как Я жив, — говорит Владыка Яхве, — непременно: за то, что ты осквернила Моё святилище всеми своими мерзостями и всеми своими гнусностями, Я тоже умалю тебя[a]; Мой глаз не пощадит, и Я тоже не сжалюсь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Я тоже убавлю (уменьшу)». Еврейский глагол краток, а его дополнение в тексте не названо.'
    reason: Сохраняет лексическую неопределённость אֶגְרַע и отмечает, что дополнение «тебя» в русском переводе подразумевается, но в еврейском тексте не выражено.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и переход к приговору на основании предшествующего контекста.
- source_word: חַי אָ֗נִי
  choice: жив Я!
  rationale: Сохраняет торжественную формулу божественной клятвы и естественно звучит в возвышенной современной русской речи.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Господь
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם, а сочетание «Владыка Господь» различает אֲדֹנָי и יהוה без неестественного повтора «Господь Господь».
- source_word: אִם לֹא יַעַן
  choice: За то, что
  rationale: В контексте клятвы אִם לֹא усиливает неизбежность приговора, а יַעַן вводит его причину; русская конструкция передаёт их совокупную силу без буквального ложного условия.
- source_word: מִקְדָּשִׁי טִמֵּאת
  choice: ты осквернила Моё святилище
  rationale: Сохраняет культовый смысл осквернения святого места; женский род отражает обращение к Иерусалиму.
- source_word: שִׁקּוּצַיִךְ
  choice: своими мерзостями
  rationale: Передаёт сильное обозначение отвратительных предметов, нередко идолов, но не сужает значение там, где сам текст этого прямо не уточняет.
- source_word: תּוֹעֲבֹתָיִךְ
  choice: своими отвратительными делами
  rationale: Отличает второй термин от שִׁקּוּצַיִךְ и естественно передаёт религиозно-нравственные деяния, вызывающие отвращение.
- source_word: אֶגְרַע
  choice: умалю тебя
  rationale: Передаёт основное значение «уменьшить, убавить»; дополнение «тебя» ясно из обращения и контекста, хотя в еврейском оно прямо не выражено.
- source_word: לֹא תָחוֹס עֵינִי
  choice: Мой глаз не пощадит
  rationale: Сохраняет выразительный еврейский образ глаза, который не проявит жалости.
- source_word: לֹא אֶחְמוֹל
  choice: Я не сжалюсь
  rationale: Передаёт отсутствие сострадания и сохраняет смысловой параллелизм без полного словесного повтора.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Выбранное чтение сохраняет различие между титулом אֲדֹנָי и именем יהוה в привычном русском библейском регистре, не создавая повтора «Господь Господь».
- issue: Характер суда в אֶגְרַע
  choice: Я тоже умалю тебя
  alternative: Я тоже отниму / сокращу
  rationale: Глагол допускает оттенки уменьшения, убавления или отнятия, а его дополнение в масоретском тексте не названо. Основной текст передаёт вероятный контекстуальный смысл, а примечание сохраняет грамматическую и лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Обращение передано в женском роде, поскольку в контексте адресатом выступает Иерусалим. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый русский библейский регистр.
