  verdict: revise
  source_fidelity: 'В целом смысл передан точно: причинная связь, осквернение святилища, двойная формула отсутствия пощады и женский род обращения сохранены. Однако составной титул אֲדֹנָי יְהוִה должен различать титул и личное имя; «Владыка Господь» не передаёт יהוה как имя. Кроме того, «отвратительные дела» необоснованно сужает תּוֹעֲבוֹתַיִךְ до действий, тогда как слово может охватывать мерзости/гнусности вообще.'
  naturalness: «Жив Я!» возможно в высоком регистре, но «Так же верно, как Я жив» естественнее передаёт клятвенную формулу в современном литературном русском. «Умалю тебя» литературно допустимо, но может восприниматься как «унижу»; примечание необходимо для сохранения более буквального значения и неявного дополнения.
