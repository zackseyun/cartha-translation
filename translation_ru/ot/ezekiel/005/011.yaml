revisions:
- from: Поэтому, жив Я! — возвещает Владыка Господь. За то, что ты осквернила Моё святилище всеми своими мерзостями и всеми своими отвратительными делами, Я тоже умалю тебя[a]. Мой глаз не пощадит, и Я не сжалюсь.
  to: 'Поэтому, так же верно, как Я жив, — говорит Владыка Яхве, — непременно: за то, что ты осквернила Моё святилище всеми своими мерзостями и всеми своими гнусностями, Я тоже умалю тебя[a]; Мой глаз не пощадит, и Я тоже не сжалюсь.'
  rationale: 'Перевод уточнён там, где это безопасно и необходимо: имя יהוה передано как «Яхве», усилительная клятвенная формула отражена словом «непременно», а «гнусности» не ограничивает תּוֹעֲבוֹתַיִךְ значением одних лишь поступков. «Умалю тебя» сохранено как сжатое литературное соответствие אֶגְרַע; примечание удерживает неявный объект и возможный буквальный оттенок «уменьшу/убавлю».'
