base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/009.yaml
  text: And I will do in you what I have not done[a], and the like of which I will never do again, because of all your abominations.
translation:
  language: ru
  text: И Я сделаю в тебе то, чего прежде не делал, и ничего подобного уже никогда не сделаю — за все твои мерзости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против тебя» или «с тобой». Еврейский предлог буквально означает «в»; в контексте суда возможны и более интерпретативные переводы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: И Я сделаю
  rationale: Широкое значение עשה передано без излишней конкретизации характера суда; будущее время естественно выражает грядущее действие Бога.
- source_word: בָךְ
  choice: среди тебя
  rationale: Предлог ב буквально указывает на действие «в» Иерусалиме. По-русски «среди тебя» сохраняет внутреннюю локализацию суда и звучит естественнее, чем буквальное «в тебе»; возможные контекстуальные значения отмечены в сноске.
- source_word: אֵת אֲשֶׁר לֹא עָשִׂיתִי
  choice: то, чего ещё не делал
  rationale: Отрицательная перфектная форма говорит об отсутствии такого действия до настоящего момента. «Ещё не делал» передаёт это без усилительного «никогда» в первой части.
- source_word: וְאֵת אֲשֶׁר לֹא אֶעֱשֶׂה כָמֹהוּ עוֹד
  choice: и подобного чему уже никогда не сделаю
  rationale: Формулировка сохраняет сравнительную силу כָמֹהוּ и значение будущего неповторения, выраженное עוֹד.
- source_word: יַעַן כָּל תּוֹעֲבֹתָיִךְ
  choice: за все твои мерзости
  rationale: יַעַן вводит основание суда, а «мерзости» сохраняет сильную пророческую и религиозно-нравственную окраску תּוֹעֵבָה.
theological_decisions:
- issue: Беспримерность объявленного суда
  choice: 'Сохранено абсолютное утверждение: прежде Бог такого не делал и впредь не сделает ничего подобного.'
  alternative: Передать лишь как указание на чрезвычайно суровый суд.
  rationale: Еврейский текст подчёркивает не только тяжесть, но и беспримерность суда; смягчающий пересказ устранил бы эту риторическую и богословскую напряжённость.
- issue: Направленность действия в בָךְ
  choice: «среди тебя»
  alternative: «против тебя» или «с тобой»
  rationale: Так сохраняется исходный пространственный образ суда, совершающегося внутри города, без внесения более толковательного значения «против».
translation_notes:
  register: Современный литературный русский язык с возвышенной пророческой интонацией. Местоимение «Я» выделено прописной буквой как речь Бога. Тире подчёркивает переход к основанию суда, не меняя синтаксического отношения.
