  text: שְׁלִשִׁ֗ית בָּ/א֤וּר תַּבְעִיר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר כִּ/מְלֹ֖את יְמֵ֣י הַ/מָּצ֑וֹר וְ/לָֽקַחְתָּ֣ אֶת הַ/שְּׁלִשִׁ֗ית תַּכֶּ֤ה בַ/חֶ֨רֶב֙ סְבִ֣יבוֹתֶ֔י/הָ וְ/הַ/שְּׁלִשִׁית֙ תִּזְרֶ֣ה לָ/ר֔וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/002.yaml
  text: A third you shall burn in the fire in the midst of the city[a], when the days of the siege are completed; and you shall take a third and strike it with the sword all around the city, and a third you shall scatter to the wind[c][b], and I will draw out a sword after them.
translation:
  language: ru
  text: Одну треть сожги в огне посреди города, когда окончатся дни осады; другую треть возьми и изруби мечом вокруг города; а последнюю треть развей по ветру[a]. И Я обнажу меч вслед за ними[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «развей к ветру»; возможно также: «развей по ветрам», хотя в еврейском тексте слово «ветер» стоит в единственном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «И Я извлеку меч вслед за ними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁית / הַשְּׁלִשִׁישִׁית
  choice: одну треть / другую треть / последнюю треть
  rationale: Субстантивированное обозначение каждой из трёх частей волос. Варьирование определителей естественно для русского языка и сохраняет ясную трёхчастную последовательность.
- source_word: בָּאוּר תַּבְעִיר
  choice: сожги в огне
  rationale: Каузативная форма глагола передаёт повеление предать огню; сочетание сохраняет упоминание огня из еврейского текста.
- source_word: בְּתוֹךְ הָעִיר
  choice: посреди города
  rationale: Передаёт пространственную образность תּוֹךְ и звучит естественно в современном литературном русском.
- source_word: כִּמְלֹאת יְמֵי הַמָּצוֹר
  choice: когда окончатся дни осады
  rationale: Инфинитивная конструкция с כ имеет временное значение; перевод сохраняет образ полного завершения назначенного срока осады.
- source_word: תַּכֶּה בַחֶרֶב
  choice: изруби мечом
  rationale: В контексте волос буквальное «порази» по-русски не вполне естественно; «изруби» ясно передаёт многократное нанесение ударов мечом и силу знакового действия.
- source_word: סְבִיבוֹתֶיהָ
  choice: вокруг города
  rationale: Суффикс женского рода относится к городу; явное повторение существительного устраняет неясность русского местоимения.
- source_word: תִּזְרֶה לָרוּחַ
  choice: развей по ветру
  rationale: Глагол זרה допускает значения рассеивания и веяния; русское выражение естественно передаёт образ разлетающихся волос, сохраняя единственное число «ветер».
- source_word: וְחֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: И Я обнажу меч вслед за ними
  rationale: Глагол ריק в сочетании с мечом обозначает его извлечение из ножен; «обнажу меч» — естественная русская идиома, а «вслед за ними» сохраняет образ преследования.
theological_decisions:
- issue: Смена говорящего в заключительной части
  choice: 'Сохранено прямое божественное первое лицо: «И Я обнажу меч вслед за ними»'
  alternative: Передать суд безлично или продолжить повеление Иезекиилю
  rationale: Форма אָרִיק — первое лицо единственного числа и намеренно переводит речь от повелений пророку к непосредственному действию Бога. Прописная «Я» по русской библейской традиции помогает обозначить божественного Говорящего, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повелительные формы естественно передают еврейские формы второго лица; заключительное «Я» сохраняет резкую смену к прямому божественному действию.
