base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I myself am against you, and I will execute judgments in your midst before the eyes of the nations.'
translation:
  language: ru
  text: 'Поэтому так говорит Господь Яхве: «Вот, я сам против тебя и совершу в твоей среде суды на глазах у народов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего обвинения.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Сохраняет устойчивую пророческую формулу в естественном для современного русского языка виде.
- source_word: אֲדֹנָי יְהוִה
  choice: Господь Яхве
  rationale: Передаёт и титул אֲדֹנָי, и личное имя יהוה, не сливая их и не создавая сочетания «Господь Господь».
- source_word: הִנְנִי עָלַיִךְ גַּם אָנִי
  choice: Вот, Я Сам — против тебя
  rationale: «Вот» отмечает торжественное объявление, «против тебя» передаёт враждебную направленность עַל в контексте суда, а «Я Сам» сохраняет эмфазу גַּם אֲנִי.
- source_word: וְעָשִׂיתִי ... מִשְׁפָּטִים
  choice: и совершу ... суды
  rationale: Идиоматично передаёт буквальное «сделаю суды», сохраняя множественное число и смысл конкретных актов суда.
- source_word: בְתוֹכֵךְ
  choice: среди тебя
  rationale: Иерусалим представлен как лицо женского рода; выражение указывает, что суды совершатся внутри города, среди его жителей.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: на глазах у народов
  rationale: Сохраняет образность и подчёркивает публичность происходящего перед окружающими народами.
theological_decisions:
- issue: Передача Божьего имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка Господь / Господь Бог
  rationale: Форма «Господь Яхве» открыто передаёт личное Божье имя и одновременно сохраняет отдельный титул אֲדֹנָי; контекст не требует скрывать имя за заменой «Бог» или «Господь».
- issue: Направленность слов הִנְנִי עָלַיִךְ
  choice: Я Сам — против тебя
  alternative: вот Я на тебя
  rationale: В контексте грядущего наказания оборот выражает Божье противостояние Иерусалиму, а не только пространственную направленность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся близким к еврейскому, но не становится неестественно буквальным; обращение к Иерусалиму сохранено в женском роде.
