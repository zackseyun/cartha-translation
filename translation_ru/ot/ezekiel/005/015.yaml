id: EZK.5.15
reference: Ezekiel 5:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה חֶרְפָּ֤ה וּ/גְדוּפָה֙ מוּסָ֣ר וּ/מְשַׁמָּ֔ה לַ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ בַּ/עֲשׂוֹתִ/י֩ בָ֨/ךְ שְׁפָטִ֜ים בְּ/אַ֤ף וּ/בְ/חֵמָה֙ וּ/בְ/תֹכְח֣וֹת חֵמָ֔ה אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/015.yaml
  text: And you shall become a reproach and a taunt[a], a warning and a horror, to the nations that are around you, when I execute judgments on you in anger and in wrath and with wrathful rebukes. I am Yahweh[c][b]; I have spoken.
translation:
  language: ru
  text: И ты станешь позором и предметом поношения, предостережением[a] и ужасом[b] для народов вокруг тебя, когда Я совершу над тобой суды в гневе и ярости, с яростными обличениями[c]. Я, Яхве, сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставлением», «взысканием» или «исправлением». Здесь Иерусалим становится наглядным предостерегающим примером для окружающих народов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предметом ужаса», «опустошением» или «изумлением».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «с обличениями ярости».'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהָיְתָה
  choice: и ты станешь
  rationale: Форма женского рода относится к Иерусалиму, к которому обращена речь; прямое обращение сохранено.
- source_word: חֶרְפָּה
  choice: позором
  rationale: Передаёт как бесчестье, так и публичное презрение в контексте пророческого суда.
- source_word: וּגְדוּפָה
  choice: предметом поношения
  rationale: Сохраняет значение оскорбительной, хулительной речи и не сливается полностью со значением חֶרְפָּה.
- source_word: מוּסָר
  choice: предостережением
  rationale: В данном перечне Иерусалим становится для соседних народов наглядным предостерегающим примером; возможные значения «наставление», «взыскание» и «исправление» отмечены в сноске.
- source_word: וּמְשַׁמָּה
  choice: ужасом
  rationale: Передаёт потрясение и ужас, которые постигшая город участь вызывает у окружающих народов.
- source_word: לַגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: для народов вокруг тебя
  rationale: Естественно передаёт отношение к соседним народам и конкретный пространственный образ.
- source_word: בַּעֲשׂוֹתִי בָךְ שְׁפָטִים
  choice: когда Я совершу над тобой суды
  rationale: Инфинитивная конструкция понята как временная; множественное число и судебный характер שְׁפָטִים сохранены.
- source_word: בְּאַף וּבְחֵמָה
  choice: в гневе и ярости
  rationale: Два близких слова переданы разными русскими соответствиями, чтобы сохранить нарастание силы выражения.
- source_word: וּבְתוֹכְחוֹת חֵמָה
  choice: с яростными обличениями
  rationale: Естественная русская формулировка сохраняет и обличение, и ярость; более буквальная конструкция приведена в сноске.
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: Я, Яхве, сказал
  rationale: Сохраняет личное имя יהוה и эмфатическую завершающую формулу Божьего заявления.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Смысл מוּסָר в перечне последствий суда
  choice: предостережение
  alternative: наставление; взыскание; исправление
  rationale: Контекст представляет судьбу Иерусалима как наглядный урок окружающим народам, но иные лексические оттенки сохранены в сноске.
- issue: Оттенок מְשַׁמָּה
  choice: ужас
  alternative: предмет ужаса; опустошение; изумление
  rationale: Синтаксис подчёркивает, чем Иерусалим станет для народов, поэтому в основном тексте выражена их потрясённая реакция, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Прямое обращение к Иерусалиму и нарастание формул суда сохранены; тяжеловесные буквальные обороты вынесены в сноски.
