  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה זֹ֚את יְר֣וּשָׁלִַ֔ם בְּ/ת֥וֹךְ הַ/גּוֹיִ֖ם שַׂמְתִּ֑י/הָ וּ/סְבִיבוֹתֶ֖י/הָ אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/005.yaml
  text: 'Thus says the Lord GOD: This is Jerusalem. I have set her in the midst of the nations[a], with lands all around her.'
translation:
  language: ru
  text: 'Так говорит Господь Яхве: «Вот Иерусалим. Я поместил его среди народов, и вокруг него — земли».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула; настоящее время естественно передаёт функцию древнееврейского перфекта в формуле возвещения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה; такое сочетание сохраняет различие двух элементов титула и избегает повтора «Господь Господь».
- source_word: זֹאת יְרוּשָׁלִַם
  choice: Вот Иерусалим
  rationale: «Вот» естественно передаёт указательно-представительную силу זֹאת в контексте символического изображения города.
- source_word: בְּתוֹךְ הַגּוֹיִם
  choice: среди народов
  rationale: בְּתוֹךְ обозначает положение внутри, в среде чего-либо; «среди» звучит естественно и не навязывает идею точного географического центра.
- source_word: שַׂמְתִּיהָ
  choice: Я поместил его
  rationale: Глагол שׂים означает «помещать, ставить». Женский суффикс согласуется с грамматическим родом названия города в древнееврейском, тогда как по-русски «Иерусалим» мужского рода.
- source_word: וּסְבִיבוֹתֶיהָ אֲרָצוֹת
  choice: а вокруг него — земли
  rationale: Именная конструкция передана естественным русским предложением; «земли» сохраняет широкое значение אֲרָצוֹת и не модернизирует его до «государств».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант непосредственно различает титул אֲדֹנָי и личное имя יהוה, не заменяя имя общим наименованием и не создавая неестественного повтора.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и выразительный; двоеточие и кавычки ясно отделяют формулу посланника от прямой речи. Грамматический род Иерусалима согласован с нормами русского языка.
