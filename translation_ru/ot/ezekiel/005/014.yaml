base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/014.yaml
  text: And I will make you a ruin and a reproach among the nations that are around you[b][a], in the sight of everyone who passes by.
translation:
  language: ru
  text: И Я превращу тебя в развалины[a] и сделаю предметом поношения[b] среди окружающих тебя народов, на глазах у каждого прохожего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опустошение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предметом насмешек»; также возможно: «позором».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵךְ
  choice: И Я превращу тебя… и сделаю
  rationale: 'В сочетании с לְחָרְבָּה и וּלְחֶרְפָּה глагол נתן имеет результативное значение: Бог приведёт город в названное состояние. Русские глаголы «превращу» и «сделаю» естественно передают эту силу.'
- source_word: לְחָרְבָּה
  choice: в развалины
  rationale: חָרְבָּה обозначает разорённое, опустошённое состояние или руины города. «В развалины» конкретно и естественно передаёт образ разрушенного города.
- source_word: וּלְחֶרְפָּה
  choice: предметом поношения
  rationale: חֶרְפָּה означает поношение, позор или объект насмешек. Формулировка сохраняет публичный характер унижения и естественно сочетается с глаголом «сделаю».
- source_word: בַּגּוֹיִם
  choice: среди … народов
  rationale: גּוֹיִם здесь означает окружающие народы, без специального противопоставления иудеев язычникам.
- source_word: אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: окружающих тебя
  rationale: Причастная конструкция кратко и естественно передаёт относительное придаточное о народах, расположенных вокруг Иерусалима.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Выражение сохраняет зрительный и публичный оттенок древнееврейской идиомы и при этом звучит современно по-русски.
- source_word: כָּל עוֹבֵר
  choice: каждого прохожего
  rationale: 'Сочетание כָּל с причастием עוֹבֵר имеет распределительное значение: каждый, кто проходит мимо. «Каждого прохожего» передаёт это компактно и естественно.'
theological_decisions:
- issue: Олицетворение Иерусалима посредством обращения во втором лице женского рода единственного числа
  choice: Сохранено местоименное обращение «тебя» без добавления имени Иерусалима.
  alternative: Явно вставить в основной текст слово «Иерусалим».
  rationale: Древнееврейский текст продолжает прямое обращение к олицетворённому городу. Местоимение сохраняет пророческую непосредственность и не добавляет отсутствующее в стихе имя.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Прописное «Я» обозначает говорящего Бога по принятой русской библейской традиции; женский род обращения в данном стихе морфологически не проявлен, но референтом остаётся олицетворённый Иерусалим.
