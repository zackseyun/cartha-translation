  text: וַ/תֶּ֨מֶר אֶת מִשְׁפָּטַ֤/י לְ/רִשְׁעָה֙ מִן הַ/גּוֹיִ֔ם וְ/אֶ֨ת חֻקּוֹתַ֔/י מִן הָ/אֲרָצ֖וֹת אֲשֶׁ֣ר סְבִיבוֹתֶ֑י/הָ כִּ֤י בְ/מִשְׁפָּטַ/י֙ מָאָ֔סוּ וְ/חֻקּוֹתַ֖/י לֹא הָלְכ֥וּ בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/006.yaml
  text: And she rebelled against my judgments with wickedness more than the nations[a], and against my statutes more than the lands that are around her; for they rejected my judgments[b], and they did not walk in my statutes.
translation:
  language: ru
  text: И она восстала против Моих установлений, поступая нечестивее народов[a], и против Моих постановлений — в большей степени, чем земли, окружающие её; ибо они отвергли Мои установления и не жили по Моим постановлениям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она исказила Мои установления, превратив их в нечестие, более других народов». Глагол допускает понимание как неповиновения, так и порочного изменения данного Богом; в основном тексте выбран заветный смысл — «восстала».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не ходили в Моих постановлениях». Это еврейское выражение означает жить в соответствии с ними, исполнять их.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתֶּמֶר
  choice: восстала она против
  rationale: Глагол מרה в контексте завета означает неповиновение, мятеж против Божьей воли. Женский род сохраняет олицетворение Иерусалима.
- source_word: מִשְׁפָּטַי
  choice: Мои установления
  rationale: Передаёт нормативно-судебный смысл מִשְׁפָּט и сохраняет отличие от חֻקּוֹתַי.
- source_word: לְרִשְׁעָה מִן־הַגּוֹיִם
  choice: поступая нечестивее других народов
  rationale: Естественно по-русски выражает наречный смысл לְרִשְׁעָה и сравнительную силу מִן, не устраняя возможный иной разбор глагола, отмеченный в сноске.
- source_word: חֻקּוֹתַי
  choice: Мои постановления
  rationale: Сохраняет юридико-заветный регистр и лексически отличает חֻקּוֹת от מִשְׁפָּטִים.
- source_word: מִן הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹתֶיהָ
  choice: более, чем земли вокруг неё
  rationale: מִן имеет сравнительное значение; «земли» не привносит современного понятия национального государства, а местоимение сохраняет олицетворение города.
- source_word: מָאָסוּ
  choice: отвергли
  rationale: Точно и ясно передаёт сознательное неприятие, возможное с оттенком презрения.
- source_word: לֹא הָלְכוּ בָהֶם
  choice: не жили по Моим постановлениям
  rationale: Передаёт смысл еврейской идиомы «ходить в них» естественным современным русским языком; явное повторение дополнения устраняет неясность местоимения.
theological_decisions:
- issue: Олицетворение Иерусалима в женском роде
  choice: «восстала она», «вокруг неё»
  alternative: «Иерусалим восстал» или безличная передача
  rationale: Форма глагола и суффикса в еврейском тексте женского рода; это сохраняет пророческое олицетворение города.
- issue: Различение двух терминов закона завета
  choice: מִשְׁפָּטַי — «установления»; חֻקּוֹתַי — «постановления»
  alternative: Оба термина передать одним словом «законы»
  rationale: Разные русские соответствия сохраняют параллельную, но не тождественную юридическую лексику оригинала.
- issue: Неоднозначность וַתֶּמֶר
  choice: 'Основной текст: «восстала»'
  alternative: «исказила» или «превратила ... в нечестие»
  rationale: В заветном контексте значение неповиновения наиболее вероятно, однако возможный разбор, связанный с изменением или искажением, сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Синтаксис сохраняет обвинительную параллель исходного текста, а трудная еврейская конструкция передана естественно; подлинная лексическая неоднозначность вынесена в сноску.
