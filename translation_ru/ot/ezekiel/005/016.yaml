base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/016.yaml
  text: When I send against them the deadly arrows of famine[a], which are for destruction, which I will send to destroy you[b], then I will add famine upon you and break for you the staff of bread.
translation:
  language: ru
  text: Когда Я пошлю на них губительные стрелы голода[a], несущие гибель, — пошлю их, чтобы погубить вас, — тогда Я наведу на вас ещё больший голод и переломлю у вас опору хлеба[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедственные стрелы голода».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «посох хлеба» — образ запаса хлеба или обеспечения пищей, поддерживающей жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלְּחִי
  choice: Когда Я пошлю
  rationale: Предлог בְּ с инфинитивом сопряжённой формы вводит временное придаточное; будущее «пошлю» естественно передаёт направленность речи к предстоящему суду.
- source_word: חִצֵּי הָרָעָב הָרָעִים
  choice: губительные стрелы голода
  rationale: Сохраняется метафора голода как оружия; «губительные» передаёт רָעִים как характеристику пагубного действия, не приписывая стрелам нравственного зла.
- source_word: בָּהֶם
  choice: на них
  rationale: При глаголе «послать» местоимение обозначает цель направленного действия; по контексту речь идёт о жителях Иерусалима.
- source_word: לְמַשְׁחִית
  choice: несущие гибель
  rationale: Передаёт назначение или результат действия стрел и позволяет сохранить отдельное следующее выражение «чтобы погубить вас».
- source_word: לְשַׁחֶתְכֶם
  choice: чтобы погубить вас
  rationale: Инфинитив שׁחת с суффиксом второго лица множественного числа прямо выражает цель.
- source_word: וְרָעָב אֹסֵף עֲלֵיכֶם
  choice: тогда Я усилю среди вас голод
  rationale: Hiphil от אָסַף имеет значение «прибавлять, усиливать». «Среди вас» естественно описывает усиление голода у адресатов, сохраняя прямое действие Бога.
- source_word: מַטֵּה לָחֶם
  choice: опору хлеба
  rationale: Сохраняется образ посоха как опоры, но «опора хлеба» звучит по-русски понятнее буквального «посох хлеба»; примечание разъясняет идиому как запас или обеспечение хлебом.
theological_decisions:
- issue: Прямое действие Бога в образах суда
  choice: 'Сохранены формы первого лица: «Я пошлю», «пошлю их», «Я усилю», «переломлю».'
  alternative: 'Передать суд безлично, например: «наступит голод».'
  rationale: Еврейский текст неоднократно и прямо называет Бога действующим субъектом; смягчать эту причинность нельзя.
- issue: Образы суда
  choice: Сохранены метафоры «стрелы голода» и «опора хлеба».
  alternative: Полностью истолковать их как «смертельный голод» и «запас продовольствия».
  rationale: Образы существенны для пророческой речи. Менее прозрачная идиома пояснена в примечании, а не устранена из текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «пошлю» сохранён как намеренное усиление. Метафоры оригинала удержаны, а наиболее непрозрачная идиома кратко разъяснена.
