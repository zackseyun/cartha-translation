- from: Треть тебя умрёт от моровой язвы и погибнет от голода среди тебя; треть падёт от меча вокруг тебя; а треть Я развею по всем ветрам[a] и обнажу меч им вслед[b].
  to: Треть твоих жителей умрёт от мора и погибнет от голода в тебе; треть падёт от меча вокруг тебя; а треть Я развею по всем ветрам[a] и обнажу меч им вслед[b].
  rationale: 'Исправлена неестественная конструкция «треть тебя»: «треть твоих жителей» передаёт долю населения, к которой относится еврейское выражение, и сохраняет адресацию к городу во втором лице. «Моровая язва» заменена на «мор» ради естественности современного литературного русского без утраты значения эпидемического бедствия. Остальная образность, параллелизм и намеренная конкретность исходного текста сохранены.'
