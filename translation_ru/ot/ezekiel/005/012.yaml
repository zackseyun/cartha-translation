source:
  edition: WLC
  text: שְׁלִשִׁתֵ֞/יךְ בַּ/דֶּ֣בֶר יָמ֗וּתוּ וּ/בָֽ/רָעָב֙ יִכְל֣וּ בְ/תוֹכֵ֔/ךְ וְ/הַ֨/שְּׁלִשִׁ֔ית בַּ/חֶ֖רֶב יִפְּל֣וּ סְבִיבוֹתָ֑יִ/ךְ וְ/הַ/שְּׁלִישִׁית֙ לְ/כָל ר֣וּחַ אֱזָרֶ֔ה וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/012.yaml
  text: A third of you will die by pestilence and be consumed by famine in your midst[a], and a third will fall by the sword all around you, and a third I will scatter to every wind[b], and I will draw out a sword after them.
translation:
  language: ru
  text: Треть твоих жителей умрёт от мора и погибнет от голода в тебе; треть падёт от меча вокруг тебя; а треть Я развею по всем ветрам[a] и обнажу меч им вслед[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ко всякому ветру», то есть во все стороны.'
    reason: cultural_note
  - marker: b
    text: 'Или: «выну меч из ножен им вслед».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁתֵיךְ / הַשְּׁלִשִׁית / הַשְּׁלִישִׁית
  choice: треть тебя / треть
  rationale: Повторяющееся обозначение долей сохранено и передаёт деление жителей олицетворённого города на три равные части.
- source_word: דֶּבֶר
  choice: моровая язва
  rationale: В контексте пророческого суда слово обозначает смертоносную эпидемию; это устойчивое и понятное выражение высокого библейского регистра.
- source_word: רָעָב
  choice: голод
  rationale: Речь идёт о бедствии массового голода, а не только о субъективном чувстве.
- source_word: יִכְלוּ
  choice: погибнет
  rationale: Глагол выражает полное истребление; «погибнет от голода» естественно звучит по-русски и сохраняет тяжесть суда.
- source_word: בְּתוֹכֵךְ
  choice: среди тебя
  rationale: Сохранено обращение к Иерусалиму как к олицетворённому городу в женском роде без внесения отсутствующего в стихе имени.
- source_word: חֶרֶב
  choice: меч
  rationale: Сохранён конкретный пророческий образ насильственной смерти, не сведённый к абстрактному слову «война».
- source_word: סְבִיבוֹתָיִךְ
  choice: вокруг тебя
  rationale: Передаёт гибель в окрестностях и со всех окружающих сторон.
- source_word: לְכָל רוּחַ
  choice: по всем ветрам
  rationale: Сохранён еврейский образ рассеяния во все стороны; идиоматическое значение пояснено в сноске.
- source_word: אֱזָרֶה
  choice: Я развею
  rationale: «Развею» естественно сочетается с образом ветров и передаёт рассеяние, сохраняя возможный оттенок веяния.
- source_word: אָרִיק
  choice: обнажу
  rationale: В сочетании с мечом глагол означает вынуть его из ножен; «обнажу меч» — естественная русская формула, сохраняющая образ преследования.
theological_decisions:
- issue: Олицетворённый адресат суда
  choice: Сохранено обращение во втором лице женского рода к олицетворённому городу.
  alternative: Явно вставить имя «Иерусалим».
  rationale: Еврейский текст обращается к городу посредством форм женского рода, но в самом стихе его имени не называет.
- issue: Конкретная образность суда
  choice: Сохранены образы моровой язвы, меча и всех ветров.
  alternative: 'Передать абстрактнее: «эпидемия», «война», «во все стороны».'
  rationale: Конкретные образы понятны современному читателю и существенны для пророческой риторики.
- issue: Направленность меча после рассеянных
  choice: «Обнажу меч им вслед».
  alternative: «Пошлю меч за ними» или «буду преследовать их мечом».
  rationale: Выбранный вариант сохраняет идиому обнажения меча и не устраняет образ преследования, выраженный אַחֲרֵיהֶם.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм трёх долей сохранён; обращение к городу в женском роде передано без поясняющей вставки.
