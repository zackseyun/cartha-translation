lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: И возьми
  rationale: Перфект с союзом продолжает последовательность пророческих повелений; русский императив естественно передаёт предписывающую силу.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Сохранено буквальное наречное значение; в контексте оно указывает на волосы, о которых говорилось прежде.
- source_word: מְעַט בְּמִסְפָּר
  choice: немного, считаные волоски
  rationale: Переданы оба элемента выражения — малость и исчисляемое количество; добавление «волоски» ясно восстанавливает подразумеваемый из контекста предмет и звучит естественно по-русски.
- source_word: וְצַרְתָּ
  choice: завяжи
  rationale: Глагол обозначает связывание или заключение; «завяжи» естественно описывает помещение волос в полу одежды и сохраняет конкретность символического действия.
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение относится к немногим волоскам, взятым из общей массы.
- source_word: בִּכְנָפֶיךָ
  choice: в полах своей одежды
  rationale: כָּנָף здесь обозначает край или полу одежды, а не буквальное крыло; «полы одежды» — понятная современная передача без излишней конкретизации вида одежды.
