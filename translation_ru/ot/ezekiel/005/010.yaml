  text: לָ/כֵ֗ן אָב֞וֹת יֹאכְל֤וּ בָנִים֙ בְּ/תוֹכֵ֔/ךְ וּ/בָנִ֖ים יֹאכְל֣וּ אֲבוֹתָ֑/ם וְ/עָשִׂ֤יתִי בָ/ךְ֙ שְׁפָטִ֔ים וְ/זֵרִיתִ֥י אֶת כָּל שְׁאֵרִיתֵ֖/ךְ לְ/כָל רֽוּחַ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/010.yaml
  text: Therefore fathers will eat sons in your midst[a], and sons will eat their fathers[b]; and I will execute judgments on you and scatter all your remnant to every wind.
translation:
  language: ru
  text: Поэтому отцы среди тебя будут есть сыновей, а сыновья — своих отцов. Я совершу над тобой суды и развею весь твой остаток[a] по всем ветрам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех твоих уцелевших»; или: «всё, что от тебя останется».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к каждому ветру» — образ полного рассеяния во всех направлениях.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следствие из предшествующего обвинения и объявления суда, сохраняя логическую связь и естественно звуча по-русски.
- source_word: אָבוֹת
  choice: отцы
  rationale: Еврейское слово обозначает именно отцов; конкретное родственное наименование усиливает ужас разрушения семейных связей.
- source_word: יֹאכְלוּ ... בָנִים
  choice: будут есть своих сыновей
  rationale: Обычное значение אכל — «есть»; в контексте голода и суда речь идёт о людоедстве. «Сыновей» точно передаёт בנים, а местоимение «своих» естественно выражает подразумеваемое родство.
- source_word: בְּתוֹכֵךְ
  choice: среди тебя
  rationale: Естественно передаёт происходящее внутри города, к которому обращаются в форме женского рода единственного числа.
- source_word: וּבָנִים יֹאכְלוּ אֲבוֹתָם
  choice: а сыновья — своих отцов
  rationale: Сохраняет взаимную направленность страшного действия и точные термины родства; пропуск повторного глагола естественен для современного русского языка.
- source_word: וְעָשִׂיתִי בָךְ שְׁפָטִים
  choice: Я совершу над тобой суды
  rationale: Сохраняет множественное число и судебную окраску устойчивого сочетания עשה + שפטים, не сужая его до одних лишь наказаний.
- source_word: וְזֵרִיתִי
  choice: и развею
  rationale: Передаёт рассеивание с сохранением образной связи с ветрами; в контексте означает полное изгнание и расселение.
- source_word: כָּל שְׁאֵרִיתֵךְ
  choice: весь твой остаток
  rationale: 'Сохраняет важное библейское понятие «остатка», хотя здесь оно не несёт обещания спасения: оставшиеся также будут рассеяны.'
- source_word: לְכָל רוּחַ
  choice: по всем ветрам
  rationale: Естественный русский образ, сохраняющий еврейскую метафору полного рассеяния во всех направлениях.
theological_decisions:
- issue: Значение שְׁאֵרִית в контексте суда
  choice: остаток
  alternative: уцелевшие; всё, что от тебя останется
  rationale: '«Остаток» сохраняет лексическую и богословскую связь с употреблением слова в других местах Писания, но контекст данного стиха не позволяет приписывать ему положительный смысл: этот остаток подвергается дальнейшему суду и рассеянию.'
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Обращение к Иерусалиму сохранено в женском роде единственного числа. Родственные обозначения и множественное «суды» переданы формально точно, а эллипсис во второй части первой фразы делает текст естественным без утраты смысла.
