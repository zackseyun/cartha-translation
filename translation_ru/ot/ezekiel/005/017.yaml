base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/017.yaml
  text: And I will send famine and wild beasts against you[a], and they will bereave you; and pestilence and bloodshed will pass through you, and I will bring a sword upon you. I, Yahweh[d][c][b], have spoken.
translation:
  language: ru
  text: И пошлю на вас голод и лютых зверей[a], и они лишат тебя детей[b]. Мор и кровопролитие[c] пройдут через тебя, и Я наведу на тебя меч. Я, Яхве, сказал[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «злых зверей»; возможно также: «диких зверей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и они сделают тебя бездетной»; глагол означает лишение детей или потомства.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «кровь»; здесь, вероятно, в значении кровопролития.'
    reason: lexical_alternative
  - marker: d
    text: 'Еврейская формула буквально: «Я, Яхве, сказал»; она торжественно подтверждает сказанное.'
    reason: source_formulation
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: И пошлю
  rationale: Форма продолжает последовательность объявленных Божьих судов и в контексте имеет будущее значение; «пошлю» естественно и точно передаёт активное действие.
- source_word: עֲלֵיכֶם
  choice: на вас
  rationale: Сохраняет множественное число еврейского суффикса и естественно сочетается по-русски с глаголом «пошлю».
- source_word: רָעָב
  choice: голод
  rationale: В пророческом перечне бедствий обозначает массовый голод, а не только субъективное чувство голода.
- source_word: וְחַיָּה רָעָה
  choice: и лютых зверей
  rationale: Буквально «злого/плохого зверя»; «лютые звери» передаёт опасность и враждебность животных, не приписывая им нравственного зла.
- source_word: וְשִׁכְּלֻךְ
  choice: и они лишат тебя детей
  rationale: Глагол שׁכל обычно означает утрату детей или потомства. Дополнение «детей» эксплицирует заложенный в глаголе смысл; переход к единственному женскому числу сохраняет олицетворённое обращение к Иерусалиму.
- source_word: וְדֶבֶר
  choice: мор
  rationale: Краткое и традиционное русское обозначение губительной эпидемии, соответствующее возвышенному пророческому регистру.
- source_word: וָדָם
  choice: и кровопролитие
  rationale: Буквально «кровь», но в перечне судов слово наиболее естественно обозначает насильственное пролитие крови.
- source_word: יַעֲבָר בָּךְ
  choice: пройдут по тебе
  rationale: Близко сохраняет образ бедствий, проходящих по олицетворённому городу; единственное женское число адресата отражено местоимением «тебе».
- source_word: וְחֶרֶב אָבִיא עָלַיִךְ
  choice: и Я наведу на тебя меч
  rationale: «Наведу ... меч» — естественная русская пророческая формула, сохраняющая конкретный образ меча, а не обобщающая его до войны.
- source_word: אֲנִי יְהוָה
  choice: Я, Яхве
  rationale: Личное имя передано как «Яхве», а отдельное местоимение сохранено ради эмфазы.
- source_word: דִּבַּרְתִּי
  choice: сказал
  rationale: В завершающей формуле перфект выражает непреложность уже произнесённого слова; русское «сказал» звучит естественно и торжественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя без замены титулом.
- issue: Смысл глагола שׁכל
  choice: лишат тебя детей
  alternative: лишат тебя; сделают тебя бездетной
  rationale: Глагол лексически связан с потерей потомства. Уточнение «детей» делает смысл понятным, тогда как примечание сохраняет более неявную форму подлинника.
- issue: Значение דָם
  choice: кровопролитие
  alternative: кровь
  rationale: В ряду карательных бедствий контекст указывает на насильственную гибель; буквальная форма отмечена в сноске.
- issue: Смена числа адресата
  choice: «на вас», затем «тебя/тебе»
  alternative: унифицировать всё в единственном или множественном числе
  rationale: Еврейский текст действительно переходит от суффикса второго лица множественного числа в עֲלֵיכֶם к женскому единственному числу в שִׁכְּלֻךְ, בָּךְ и עָלַיִךְ. Эта напряжённость сохранена, а не сглажена.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранён резкий переход от множественного «вас» к женскому единственному «тебя/тебе», присутствующий в еврейском тексте и отражающий обращение к жителям, а затем к олицетворённому Иерусалиму. Синтаксис разделён на два предложения ради ясности, без устранения смысловой напряжённости.
