  text: And from them you shall take some more[a], and throw them into the midst of the fire and burn them in the fire. From it a fire will go out to all the house of Israel.
translation:
  language: ru
  text: И из них возьми ещё немного, брось их в самую середину огня и сожги их в огне. От него[a] выйдет огонь на весь дом Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Оттуда выйдет огонь»; суффикс единственного числа, вероятно, относится к только что упомянутому огню. Некоторые, менее вероятно, понимают: «От них выйдет огонь».'
    reason: Неоднозначность референта местоименного суффикса в מִמֶּנּוּ и возможность более неопределённой передачи источника.
lexical_decisions:
- source_word: וּמֵהֶם עוֹד תִּקָּח
  choice: И возьми из них ещё немного
  rationale: Передаёт сочетание исходного/частичного значения «из них» и добавочного значения עוֹד; форма повеления естественно выражает предписание пророческого знамения.
- source_word: וְהִשְׁלַכְתָּ אוֹתָם אֶל תּוֹךְ הָאֵשׁ
  choice: брось их в самую середину огня
  rationale: Глагол передан современным «брось», а תּוֹךְ сохранено как «самая середина», чтобы не ослаблять наглядность действия.
- source_word: וְשָׂרַפְתָּ אֹתָם בָּאֵשׁ
  choice: и сожги их в огне
  rationale: Сохраняется намеренный повтор слова «огонь» и прямое значение שרף.
- source_word: מִמֶּנּוּ
  choice: От него
  rationale: Мужское единственное местоимение в русском естественно соотносится с непосредственно упомянутым словом «огонь», при этом неоднозначность источника огня отмечена в сноске.
- source_word: תֵצֵא אֵשׁ
  choice: огонь распространится
  rationale: Буквальный образ выходящего огня передан естественным русским выражением, обозначающим его движение наружу и дальнейшее охватывание.
- source_word: אֶל כָּל בֵּית יִשְׂרָאֵל
  choice: на весь дом Израиля
  rationale: «На» сохраняет направленность אֶל и в данном контексте естественно сочетается с распространяющимся огнём, не добавляя явно отсутствующего слова «против»; «дом Израиля» сохраняет исходное национально-заветное выражение.
theological_decisions:
- issue: Источник огня, охватывающего весь дом Израиля
  choice: Местоимение «от него» наиболее естественно отнесено к только что упомянутому огню.
  alternative: 'Понимать источник как сожжённые волосы: «от них»; либо передать менее определённо: «оттуда».'
  rationale: Единственное число מִמֶּנּוּ и ближайший контекст поддерживают отнесение к огню, однако образная механика знамения не разъясняется сверх того, что сказано в тексте; альтернативное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; тон прямой и торжественный без архаизмов. Повтор слова «огонь» сохранён как значимый элемент образа и структуры еврейского текста.
