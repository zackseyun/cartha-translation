  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם קַח לְ/ךָ֣ חֶ֣רֶב חַדָּ֗ה תַּ֤עַר הַ/גַּלָּבִים֙ תִּקָּחֶ֣/נָּה לָּ֔/ךְ וְ/הַעֲבַרְתָּ֥ עַל רֹאשְׁ/ךָ֖ וְ/עַל זְקָנֶ֑/ךָ וְ/לָקַחְתָּ֥ לְ/ךָ֛ מֹאזְנֵ֥י מִשְׁקָ֖ל וְ/חִלַּקְתָּֽ/ם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/001.yaml
  text: And you[a], son of man, take for yourself a sharp sword; take it as a barber’s razor, and pass it over your head and over your beard[b]. Then take for yourself scales for weighing and divide the hair.
translation:
  language: ru
  text: А ты, сын человеческий, возьми себе острый меч; возьми его как бритву парикмахера и проведи им по своей голове и бороде. Затем возьми себе весы и раздели волосы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивое пророческое обращение у Иезекииля и буквально передаёт еврейское выражение.
- source_word: חֶרֶב חַדָּה
  choice: острый меч
  rationale: Прямо и естественно передаёт существительное חֶרֶב и определяющее его прилагательное חַדָּה.
- source_word: תַּעַר הַגַּלָּבִים
  choice: бритва брадобрея
  rationale: Передаёт конкретный образ профессиональной бритвы; слово «брадобрей» уместно в достоинственно-библейском регистре и понятно современному читателю.
- source_word: תִּקָּחֶנָּה לָּךְ
  choice: возьми его вместо бритвы
  rationale: Сохраняет повтор глагола לקח и выражает функцию меча в символическом действии, не превращая его непосредственно в бритву.
- source_word: וְהַעֲבַרְתָּ עַל רֹאשְׁךָ וְעַל זְקָנֶךָ
  choice: проведи им по своей голове и бороде
  rationale: Сохраняет явный глагол עבר и естественно описывает движение используемого как бритва меча.
- source_word: מֹאזְנֵי מִשְׁקָל
  choice: весы
  rationale: В русском языке «весы» уже ясно обозначают орудие взвешивания, поэтому дополнительное «для взвешивания» избыточно.
- source_word: וְחִלַּקְתָּם
  choice: раздели сбритые волосы
  rationale: Множественный суффикс отсылает к волосам, появившимся вследствие описанного бритья; явное называние референта устраняет неестественную для русского двусмысленность.
