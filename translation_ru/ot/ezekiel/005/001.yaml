    issue: «Возьми его вместо бритвы брадобрея»
    rationale: «Вместо» означает «взамен бритвы», тогда как еврейская конструкция называет меч бритвой, то есть предписывает взять его в этом качестве. Следует передать «как бритву».
  - severity: low
    issue: Архаизм «брадобрей»
    rationale: Слово не ошибочно, но для заявленного современного литературного варианта менее естественно, чем «парикмахер».
  revised_text: А ты, сын человеческий, возьми себе острый меч; возьми его как бритву парикмахера и проведи им по своей голове и бороде. Затем возьми себе весы и раздели волосы.
