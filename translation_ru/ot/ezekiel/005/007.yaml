base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/007.yaml
  text: 'Therefore thus says the Lord GOD: Because you have been more turbulent than the nations that are around you[a], you have not walked in my statutes, and you have not carried out my judgments; and you have not even acted according to the judgments of the nations that are around you.'
translation:
  language: ru
  text: 'Поэтому так говорит Господь Яхве: «За то, что вы буйствовали сильнее, чем окружающие вас народы[a], не ходили по Моим уставам, не исполняли Моих установлений и даже не поступали по установлениям окружающих вас народов, —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово здесь трудно для понимания. Возможны переводы: «неистовствовали сильнее», «были непокорнее» или, возможно, «были многочисленнее», чем окружающие народы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Господь Яхве
  rationale: Сочетание передано как титул «Господь» и личное имя «Яхве», что позволяет различить оба элемента еврейского выражения и избежать повтора «Господь Господь».
- source_word: יַעַן
  choice: за то, что
  rationale: Вводит основание предстоящего суда и естественно связывается в русском языке с незавершённой формулой приговора, продолжающейся в следующем стихе.
- source_word: הֲמָנְכֶם
  choice: вы буйствовали сильнее
  rationale: Трудная форма, вероятно связанная с шумом, волнением или неистовством; выбранное выражение передаёт чрезмерность беспорядочного поведения, не сводя его только к непокорности.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: чем окружающие вас народы
  rationale: 'Предлог מִן после сравнительного выражения передаёт сопоставление: «чем».'
- source_word: בְּחֻקּוֹתַי לֹא הֲלַכְתֶּם
  choice: не ходили по Моим уставам
  rationale: Сохранена понятная по-русски библейская метафора хождения как образа образа жизни; חֻקּוֹת передано словом «уставы».
- source_word: מִשְׁפָּטַי
  choice: Мои установления
  rationale: «Установления» естественно обозначает предписанные нормы и позволяет сохранить лексическую связь с тем же словом далее, где говорится об установлениях народов.
- source_word: לֹא עֲשִׂיתֶם
  choice: не исполняли
  rationale: В сочетании с Божьими установлениями глагол עשה обозначает их практическое исполнение.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם... לֹא עֲשִׂיתֶם
  choice: и даже не поступали по установлениям окружающих вас народов
  rationale: 'כ передаёт соответствие норме — «по»; отрицание לֹא сохранено. «Даже» выражает риторическое усиление: адресаты не соблюдали ни Божьих требований, ни хотя бы норм окружающих народов.'
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка Господь; Господь Бог
  rationale: Передача «Яхве» сохраняет личное заветное имя, тогда как «Господь» передаёт отдельный титул אֲדֹנָי; перевод не вводит конфессионального истолкования.
- issue: Отношение Иерусалима к нормам окружающих народов
  choice: не поступали по установлениям окружающих народов
  alternative: поступали по установлениям окружающих народов
  rationale: Масоретский текст WLC прямо содержит отрицание לֹא, поэтому оно сохранено, несмотря на трудность мысли и наличие иной текстовой традиции. Риторика понимается как обвинение в том, что Иерусалим оказался хуже даже окружающих народов.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Метафора «ходили по Моим уставам» сохранена как понятный традиционный оборот. Конечное тире показывает, что причинная конструкция и формула приговора продолжаются в стихе 8.
