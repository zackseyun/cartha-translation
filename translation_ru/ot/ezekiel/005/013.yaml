  text: וְ/כָלָ֣ה אַפִּ֗/י וַ/הֲנִחוֹתִ֧י חֲמָתִ֛/י בָּ֖/ם וְ/הִנֶּחָ֑מְתִּי וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה דִּבַּ֨רְתִּי֙ בְּ/קִנְאָתִ֔/י בְּ/כַלּוֹתִ֥/י חֲמָתִ֖/י בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/013.yaml
  text: So my anger will be spent[a], and I will cause my wrath to rest on them, and I will be comforted. Then they will know that I, Yahweh, have spoken in my jealousy[b], when I spend my wrath against them.
translation:
  language: ru
  text: Так исчерпается Мой гнев, и Я дам Моей ярости успокоиться на них, и утешусь[a]. Тогда они узнают, что Я, Яхве, говорил в Моей ревности[b], когда до конца совершу над ними Мою ярость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «найду облегчение» или «буду удовлетворён». Еврейский глагол может обозначать утешение или облегчение, наступающее после завершения суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Моём рвении». Еврейское слово может обозначать и ревность, и горячее рвение; здесь «ревность» сохраняет личностный, заветный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָלָה אַפִּי
  choice: Так исчерпается Мой гнев
  rationale: כלָה с אַף обозначает полное исчерпание гнева. «Исчерпается» естественно передаёт завершённость действия, а «гнев» — переносное значение אַף.
- source_word: וַהֲנִחוֹתִי חֲמָתִי בָּם
  choice: Я утолю на них Мою ярость
  rationale: Каузатив נוח здесь выражает доведение ярости до покоя через совершившийся суд. «Утолю» передаёт её полное удовлетворение, а «на них» сохраняет направленность, выраженную בם.
- source_word: וְהִנֶּחָמְתִּי
  choice: и найду облегчение
  rationale: Нифаль глагола נחם может обозначать утешение, удовлетворение или облегчение после завершённого суда. Формулировка естественна по-русски и не подменяет образ безличным понятием правосудия.
- source_word: וְיָדְעוּ
  choice: Тогда они узнают
  rationale: «Тогда» естественно выражает результат предшествующего суда, заложенный в последовательности форм.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּקִנְאָתִי
  choice: в Моей ревности
  rationale: Русское «ревность» сохраняет как напряжённую личностно-заветную окраску, так и возможный оттенок ревностного рвения у קנאה.
- source_word: בְּכַלּוֹתִי חֲמָתִי בָּם
  choice: когда Я изолью на них всю Мою ярость
  rationale: Инфинитив כלה указывает на обстоятельство полного доведения ярости до конца. «Всю» передаёт полноту, а «изолью на них» естественно выражает осуществление направленного против них суда.
theological_decisions:
- issue: Эмоционально окрашенный язык Божьего суда
  choice: Сохранены личные выражения «Мой гнев», «Моя ярость», «найду облегчение» и «Моя ревность».
  alternative: 'Передать их отвлечённо: «правосудие совершится» или «справедливость будет удовлетворена».'
  rationale: Еврейский текст намеренно говорит о Божьем суде эмоционально и личностно. Перевод сохраняет эту напряжённость и не вводит позднейших богословских оговорок.
- issue: Значение בְּקִנְאָתִי
  choice: в Моей ревности
  alternative: в Моём рвении
  rationale: «Ревность» лучше сохраняет заветно-реляционный оттенок, не исключая смысла горячего рвения.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, явно присутствующее в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Пара «гнев — ярость» сохраняет различие между אַף и חמה. Повтор ярости оставлен ради композиционного обрамления стиха, но последняя фраза передана идиоматически, с явным указанием на полноту суда.
