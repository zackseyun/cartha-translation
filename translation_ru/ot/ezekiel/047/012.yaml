  text: וְ/עַל הַ/נַּ֣חַל יַעֲלֶ֣ה עַל שְׂפָת֣/וֹ מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה כָּל עֵֽץ מַ֠אֲכָל לֹא יִבּ֨וֹל עָלֵ֜/הוּ וְ/לֹֽא יִתֹּ֣ם פִּרְי֗/וֹ לָֽ/חֳדָשָׁי/ו֙ יְבַכֵּ֔ר כִּ֣י מֵימָ֔י/ו מִן הַ/מִּקְדָּ֖שׁ הֵ֣מָּה יֽוֹצְאִ֑ים ו/היו פִרְי/וֹ֙ לְ/מַֽאֲכָ֔ל וְ/עָלֵ֖/הוּ לִ/תְרוּפָֽה־־׀׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/012.yaml
  text: Along the river[a], on its bank, on this side and on that side, every kind of tree for food will grow. Its leaf will not wither, and its fruit will not fail; every month it will bear fresh fruit, because its waters are coming out from the sanctuary. Its fruit will be for food[c][b], and its leaf for healing.
translation:
  language: ru
  text: Вдоль потока, по обоим его берегам[a], будут расти всевозможные деревья, дающие пищу. Их листья не увянут, и плоды не иссякнут. Каждый месяц они будут приносить свежие плоды[b], потому что воды потока выходят из святилища. Их плоды будут служить пищей, а листья — для исцеления[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на его берегу, с этой и с этой стороны», то есть с обеих сторон потока.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ранние плоды»; еврейский глагол связан с первым или ранним созреванием.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как лекарство»; также возможно: «как лечебное средство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֶה
  choice: будут расти
  rationale: Глагол буквально означает «подниматься», но применительно к деревьям естественно передаёт их произрастание; будущее время сохранено.
- source_word: שְׂפָתוֹ ... מִזֶּה וּמִזֶּה
  choice: по обоим его берегам
  rationale: שׂפה обозначает край или берег, а выражение «с этой и с этой стороны» указывает на обе стороны потока. Сжатая русская формулировка ясно и естественно передаёт пространственный образ.
- source_word: כָּל עֵץ מַאֲכָל
  choice: всевозможные деревья, дающие пищу
  rationale: Фраза обозначает всякого рода деревья со съедобными плодами. Формулировка не сужает значение до какого-либо конкретного вида плодовых деревьев.
- source_word: לֹא יִבּוֹל עָלֵהוּ
  choice: их листья не увянут
  rationale: נבל в данном контексте означает увядание растительности. Русское множественное число согласовано с естественно переданным собирательным образом множества деревьев.
- source_word: וְלֹא יִתֹּם פִּרְיוֹ
  choice: плоды не иссякнут
  rationale: תם выражает прекращение или окончание. «Не иссякнут» сохраняет образ непрерывного плодоношения.
- source_word: לָחֳדָשָׁיו יְבַכֵּר
  choice: каждый месяц они будут приносить свежие плоды
  rationale: לָחֳדָשָׁיו указывает на ежемесячную регулярность, а יְבַכֵּר связано с ранним или первым созреванием. В контексте непрерывного ежемесячного плодоношения «свежие плоды» естественно передаёт смысл, тогда как буквальное «первые плоды» могло бы ошибочно подразумевать лишь один первый урожай.
- source_word: מִן הַמִּקְדָּשׁ
  choice: из святилища
  rationale: מִקְדָּשׁ означает святое место, святилище; этот прямой эквивалент соответствует храмовому видению Иезекииля.
- source_word: לִתְרוּפָה
  choice: для исцеления
  rationale: Существительное может обозначать исцеление, лечебное средство или лекарство. «Для исцеления» сохраняет широкую восстановительную семантику, не сводя её к конкретному лекарственному применению.
theological_decisions:
- issue: Характер животворного изобилия в храмовом видении
  choice: 'Передать образ прямо: пища и исцеление связаны с водами, выходящими из святилища.'
  alternative: Внести в перевод явное эсхатологическое, сакраментальное или аллегорическое истолкование.
  rationale: Сам стих не раскрывает образ посредством такой интерпретации. Прямой перевод сохраняет богословскую насыщенность и причинную связь, не навязывая читателю конфессионального толкования.
- issue: Значение יְבַכֵּר при ежемесячном плодоношении
  choice: «будут приносить свежие плоды» с примечанием о раннем или первом созревании
  alternative: «будут приносить первые плоды» или «первоспелые плоды» в основном тексте
  rationale: Корень связан с первым или ранним созреванием, но в сочетании с «каждый месяц» речь идёт о постоянно новом урожае. Основной текст остаётся естественным, а примечание сохраняет подлинный лексический оттенок.
translation_notes:
  register: Современный литературный русский язык с ясным, возвышенным библейским звучанием. Синтаксис упрощён без утраты образов исходного текста; еврейское собирательное единственное число естественно передано русским множественным числом.
