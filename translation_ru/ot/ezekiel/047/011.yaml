    reason: lexical_alternative
lexical_decisions:
- source_word: בצאתו
  choice: его топи
  rationale: Редкое топографическое существительное обозначает низкие места, где вода разливается или застаивается; «топи» естественно передаёт болотистую местность и сохраняет местоименный суффикс 3-го лица.
- source_word: וגבאיו
  choice: и заболоченные низины
  rationale: גבא обозначает углубления, лужи или болотистые впадины. В параллели с «топями» выражение «заболоченные низины» сохраняет топографический смысл и не создаёт ненужного полного синонимического повтора.
- source_word: ולא ירפאו
  choice: не исцелятся
  rationale: Нифаль глагола רפא буквально означает «быть исцелённым». Формулировка сохраняет сквозной образ исцеления вод в отрывке, хотя по смыслу речь идёт также об их опреснении.
- source_word: למלח נתנו
  choice: они отданы соли
  rationale: Пассивная форма נתנו передаёт назначение или предание этих мест соли, а ל допускает оттенок цели либо результата. Буквально-поэтическая формулировка сохраняет образ и неоднозначность исходного текста.
