  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּ֤יִם הָ/אֵ֨לֶּה֙ יוֹצְאִ֗ים אֶל הַ/גְּלִילָה֙ הַ/קַּדְמוֹנָ֔ה וְ/יָרְד֖וּ עַל הָֽ/עֲרָבָ֑ה וּ/בָ֣אוּ הַ/יָּ֔מָּ/ה אֶל הַ/יָּ֥מָּ/ה הַ/מּֽוּצָאִ֖ים ו/נרפאו הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/008.yaml
  text: Then he said to me[a], “These waters flow out toward the eastern district and go down into the Arabah; then they enter the sea. and when they are brought out into the sea[c][b], the waters are healed.”
translation:
  language: ru
  text: 'Он сказал мне: «Эти воды текут в восточную область, спускаются в Араву и входят в море. Когда они изливаются в море[a], воды исцеляются[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская фраза здесь трудна. Речь, вероятно, идёт о Солёном, то есть Мёртвом, море, лежащем к востоку от Иудеи.
    reason: alternative_reading
  - marker: b
    text: 'Или: «воды становятся пресными (пригодными для жизни)». Буквально: «воды исцеляются».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם הָאֵלֶּה
  choice: эти воды
  rationale: Сохранено грамматическое число еврейского מַיִם и указательное местоимение; в данном образном контексте русское множественное число звучит уместно.
- source_word: יוֹצְאִים
  choice: текут
  rationale: Причастие יצא обозначает продолжающееся движение воды наружу; «текут» естественно передаёт действие потока.
- source_word: הַגְּלִילָה הַקַּדְמוֹנָה
  choice: восточную область
  rationale: גְּלִילָה здесь означает область или край, а קַדְמוֹנָה указывает восточное направление.
- source_word: וְיָרְדוּ עַל הָעֲרָבָה
  choice: спускаются в Араву
  rationale: ירד передаёт движение вниз, а עֲרָבָה сохранено как географическое название Иорданской рифтовой долины.
- source_word: וּבָאוּ הַיָּמָּה
  choice: входят в море
  rationale: Форма יָמָּה с направительным окончанием выражает движение к морю и в него.
- source_word: אֶל הַיָּמָּה הַמּוּצָאִים
  choice: когда они изливаются в море
  rationale: Трудная масоретская фраза, включающая пассивное причастие от יצא, описывает поступление вод в море. «Изливаются» естественно передаёт движение воды, не вводя неподтверждённого значения «застойные».
- source_word: וְנרפאו הַמָּיִם
  choice: воды исцеляются
  rationale: Глагол רפא буквально означает «исцелять»; метафора сохранена, а не сведена к пояснительному «становятся пресными».
