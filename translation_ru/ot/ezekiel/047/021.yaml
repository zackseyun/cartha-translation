source:
  edition: WLC
  text: וְ/חִלַּקְתֶּ֞ם אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לָ/כֶ֖ם לְ/שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/021.yaml
  text: So you shall divide this land among yourselves according to the tribes of Israel[a].
translation:
  language: ru
  text: Итак, разделите эту землю между собой по коленам Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И разделите эту землю для себя, для колен Израиля».'
    reason: Сохраняется более буквальная возможность передать оба оборота с לְ как «для себя» и «для колен Израиля», а союз וְ — нейтральным «и».
lexical_decisions:
- source_word: וְחִלַּקְתֶּם
  choice: Итак, разделите
  rationale: Пиэль глагола חלק означает «делить, распределять». Русское повелительное «разделите» естественно передаёт директивную силу формы 2-го лица множественного числа; союз וְ в связи с предшествующим описанием границ передан как итогово-продолжительное «итак».
- source_word: אֶת
  choice: '[показатель прямого дополнения, не переводится]'
  rationale: Еврейский показатель определённого прямого дополнения не имеет самостоятельного соответствия в русском языке.
- source_word: הָאָרֶץ הַזֹּאת
  choice: эту землю
  rationale: Прямое и естественное соответствие словосочетанию «эта земля» в контексте территориального раздела.
- source_word: לָכֶם
  choice: между собой
  rationale: Буквально предлог с местоимением допускает «для себя/вам». В контексте внутреннего распределения земли выражение «между собой» естественно передаёт смысл, не устраняя буквальную альтернативу, указанную в сноске.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: по коленам Израиля
  rationale: Предлог לְ обозначает соотнесённость или распределение. «По коленам Израиля» кратко и ясно показывает, что земля распределяется в соответствии с племенным делением.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, торжественно-нейтральным звучанием. Традиционное библейское «колена Израиля» сохранено как широко понятное обозначение племён. Маркер сноски поставлен непосредственно после предложения.
