  text: And the west side shall be the Great Sea[a], from the border up to opposite Lebo-hamath[b]. This is the west side.
translation:
  language: ru
  text: А западной границей будет Великое море — от границы до точки напротив Лево-Хамата[a]. Такова западная граница.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «Лево-Хамат» традиционно также понимают буквально как «вход в Хамат»; вероятно, здесь оно служит географическим названием у северной границы земли.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת יָם
  choice: А западной границей
  rationale: Буквально «сторона моря»; в географии Израиля море находится на западе, поэтому выражение естественно передаётся как указание на западную границу.
- source_word: הַיָּם הַגָּדוֹל
  choice: Великое море
  rationale: Сохранено традиционное древнееврейское обозначение Средиземного моря, без замены исходного выражения современным географическим названием.
- source_word: מִגְּבוּל
  choice: от границы
  rationale: גְּבוּל обозначает границу или пограничную линию; контекст не уточняет здесь иной исходный пункт.
- source_word: עַד נֹכַח
  choice: до места напротив
  rationale: Пространственное значение נֹכַח — «напротив, перед»; добавление «места» делает русскую фразу естественной, не уточняя местоположение сверх исходного текста.
- source_word: לְבוֹא חֲמָת
  choice: Лево-Хамата
  rationale: Выражение передано как географическое имя, употребляемое в формулах границ; возможный буквальный смысл отмечен в сноске.
- source_word: זֹאת פְּאַת יָם
  choice: Такова западная граница
  rationale: Заключительная формула суммирует только что описанную сторону; «граница» здесь естественнее буквального «сторона» и согласуется с контекстом межевания.
