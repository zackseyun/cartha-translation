  yaml_path: translation/ot/ezekiel/047/006.yaml
  text: Then he said to me[a], “Have you seen this[d][c][b], son of man?” Then he led me and brought me back to the bank of the stream.
translation:
  language: ru
  text: 'И он сказал мне: «Видел ли ты, сын человеческий?» Затем он повёл меня и вернул к берегу потока[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к краю потока»; еврейское выражение буквально означает «к губе потока». Слово נַחַל может также обозначать ручей, реку или русло сезонного водотока — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И он сказал мне
  rationale: Последовательная конструкция с וַ продвигает повествование; русское «И» естественно сохраняет связность еврейского рассказа.
- source_word: הֲרָאִיתָ
  choice: Видел ли ты
  rationale: Вопросительная частица с перфектом 2-го лица мужского рода спрашивает, увидел ли Иезекииль показанное. В русском объект можно естественно оставить подразумеваемым, как в еврейском тексте.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохранена устойчивая форма обращения к Иезекиилю и её сквозное литературно-богословское значение.
- source_word: וַיּוֹלִכֵנִי
  choice: он повёл меня
  rationale: Каузативная форма от הלך в данном контексте естественно передаётся глаголом «повёл».
- source_word: וַיְשִׁבֵנִי
  choice: вернул
  rationale: Каузативная форма от שוב означает, что сопровождавший возвратил пророка к прежнему месту.
- source_word: שְׂפַת הַנָּחַל
  choice: на берег потока
  rationale: שׂפה буквально означает «губа, край», а применительно к водотоку — «берег»; נחל здесь обозначает текущий водный поток.
theological_decisions:
- issue: Передача обращения בֶן אָדָם
  choice: сын человеческий
  alternative: смертный; человек
  rationale: Формальная передача сохраняет повторяющееся в книге Иезекииля обращение, не устраняя его литературного и богословского звучания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к еврейскому оригиналу, но естественен по-русски; подразумеваемый объект вопроса не добавлен, чтобы сохранить исходную лаконичность и неоднозначность.
