lexical_decisions:
- source_word: בְּשׁוּבֵנִי
  choice: Когда я возвратился
  rationale: Инфинитив породы qal с суффиксом 1-го лица единственного числа употреблён во временном значении. Перевод сохраняет прямое указание на возвращение самого пророка, не вводя каузативного смысла «когда он привёл меня обратно».
- source_word: וְהִנֵּה
  choice: то увидел
  rationale: В данном повествовательном контексте передаёт внезапное зрительное восприятие, выраженное частицей הִנֵּה, естественным современным русским языком, сохраняя живость видения.
- source_word: אֶל שְׂפַת הַנַּחַל
  choice: по берегам потока
  rationale: שָׂפָה обозначает край или берег, а נַחַל здесь — текущий поток. Множественное «по берегам» согласуется с последующим распределительным оборотом о двух сторонах.
- source_word: עֵץ רַב מְאֹד
  choice: росло очень много деревьев
  rationale: Формально единственное עֵץ имеет собирательное значение; сочетание с רַב מְאֹד указывает на чрезвычайное множество. Глагол «росло» естественно выражает наличие деревьев у берегов, не меняя образа.
- source_word: מִזֶּה וּמִזֶּה
  choice: и с одной стороны, и с другой
  rationale: Сохранён наглядный распределительный еврейский оборот, обозначающий обе стороны потока; более сжатое «по обоим берегам» возможно, но менее буквально передаёт структуру выражения.
