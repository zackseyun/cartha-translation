base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/014.yaml
  text: You shall inherit it[a], each like his brother, concerning which I raised my hand to give it to your fathers[c][b]; and this land shall fall to you as an inheritance.
translation:
  language: ru
  text: Вы получите в наследие эту землю, каждый наравне со своим братом, — землю, которую Я, подняв руку, поклялся дать вашим отцам[a]. Эта земля достанется вам в наследие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которую Я поднял руку дать вашим отцам». Поднять руку — древнееврейский образ клятвы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «эта земля выпадет вам в наследие» — образ получения назначенного удела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְחַלְתֶּם אוֹתָהּ
  choice: вы получите её в наследие
  rationale: Глагол נחל в данном контексте означает получение земли как наследственного удела; местоимение женского рода относится к земле. Такая передача естественна по-русски и сохраняет смысл наделения наследием.
- source_word: אִישׁ כְּאָחִיו
  choice: каждый наравне со своим братом
  rationale: 'Буквально: «каждый как его брат». В контексте распределения земли оборот указывает на равное право на удел; слово «брат» сохраняет мужскую форму исходного текста.'
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: которую Я, подняв руку, обещал
  rationale: Сохранён конкретный образ поднятой руки, обозначающий клятву, а глагол «обещал» делает связь этого жеста с последующим «дать» естественной и понятной в современном русском языке.
- source_word: לְתִתָּהּ לַאֲבֹתֵיכֶם
  choice: дать вашим отцам
  rationale: Прямая передача נתן и אבות; «отцам» сохраняет связь с традицией обещания праотцам, не заменяя её более широким словом «предкам».
- source_word: וְנָפְלָה הָאָרֶץ הַזֹּאת לָכֶם בְּנַחֲלָה
  choice: эта земля достанется вам в наследие
  rationale: נפל здесь употреблён как идиома о выпавшем человеку уделе. Русское «достанется» естественно выражает итог наделения, а «в наследие» сохраняет значение נַחֲלָה.
theological_decisions:
- issue: Клятвенная формула נָשָׂאתִי אֶת יָדִי
  choice: которую Я, подняв руку, обещал дать
  alternative: которую Я поклялся дать
  rationale: Основной текст сохраняет телесный образ поднятой руки и одновременно передаёт его функцию как торжественного обещания; примечание прямо поясняет клятвенный смысл, не привнося конфессионального толкования.
- issue: Распределительное выражение אִישׁ כְּאָחִיו
  choice: каждый наравне со своим братом
  alternative: каждый как его брат
  rationale: Контекст раздела земли указывает на равенство уделов или прав на них. Мужское «братом» сохранено, а значение сравнения раскрыто без устранения распределительного характера выражения.
- issue: Идиома выпадения удела וְנָפְלָה
  choice: достанется вам в наследие
  alternative: выпадет вам в наследие
  rationale: Буквальное «выпадет» возможно, но в современном русском может звучать как случайность. «Достанется» естественно передаёт наделение землёй, тогда как примечание сохраняет исходный образ выпавшего удела.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис разделён на два предложения для ясности; повтор слова «земля» сохранён как смысловая опора. Заглавная буква в местоимении «Я» следует принятому русскому библейскому регистру.
