  text: So the border shall be from the sea to Hazar-enon[a], at the border of Damascus; and on the north, northward, with the border of Hamath[b]. This shall be the north side.
translation:
  language: ru
  text: И граница будет идти от моря[a] до Хацар-Энона[b], у границы Дамаска, а на севере, к северу, — граница Хамата. Это северная сторона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «от моря». По контексту имеется в виду Средиземное море, но здесь оно прямо не названо «Великим морем».'
    reason: cross_reference
  - marker: b
    text: 'Хацар-Энон — традиционный вариант передачи названия: «Хацар-Энан».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: И … будет идти
  rationale: В данном топографическом описании форма вводит очередное определение границы. Русское «будет идти» естественно описывает прохождение линии границы, не меняя её будущего/предписывающего оттенка.
- source_word: גְבוּל
  choice: граница
  rationale: Обычное современное русское обозначение территориального рубежа; подходит для повторяющегося термина в этом отрывке.
- source_word: מִן הַיָּם
  choice: от моря
  rationale: В еврейском тексте сказано просто «от моря». Из контекста ясно, что имеется в виду Средиземное море, однако уточнение не внесено в основной текст.
- source_word: חֲצַר עֵינוֹן
  choice: Хацар-Энон
  rationale: Географическое название передано транслитерацией с учётом масоретской огласовки; компонент חֲצַר передан как «Хацар», а עֵינוֹן — как «Энон».
- source_word: גְּבוּל דַּמֶּשֶׂק
  choice: у границы Дамаска
  rationale: Оборот указывает положение Хацар-Энона относительно территории Дамаска; предлог «у» естественно выражает эту географическую связь.
- source_word: וְצָפוֹן צָפוֹנָה
  choice: а на севере, к северу
  rationale: Сохранён необычный повтор слова «север» и направительное значение формы צָפוֹנָה, чтобы не сглаживать топографическую формулировку оригинала.
- source_word: וּגְבוּל חֲמָת
  choice: вдоль границы Хамата
  rationale: Фраза дополнительно определяет прохождение северного рубежа. «Вдоль» делает географическую связь ясной по-русски, не превращая границу Хамата в отдельный пункт.
- source_word: וְאֵת פְּאַת צָפוֹן
  choice: Это северная сторона
  rationale: Заключительная формула подытоживает описание северного края; по-русски для связности добавлена указательная связка «это».
