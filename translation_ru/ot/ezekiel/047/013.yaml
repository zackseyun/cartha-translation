base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/013.yaml
  text: 'Thus says the Lord GOD: This is the boundary by which you shall apportion the land as an inheritance among the twelve tribes of Israel[a]; Joseph shall have two portions.'
translation:
  language: ru
  text: 'Так говорит Господь Яхве: «Вот граница, по которой вы разделите землю в наследственные уделы между двенадцатью племенами Израиля: Иосифу — уделы[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Иосиф — уделы (доли)». В контексте это обычно понимают как двойную территориальную долю Иосифа, представленную Ефремом и Манассией.
    reason: Еврейский текст употребляет множественное число, но не содержит явно слова «два»; примечание передаёт распространённое контекстуальное понимание, не устраняя формальную неоднозначность текста.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Господь Яхве
  rationale: Сочетание сохраняет титул אֲדֹנָי и передаёт личное имя יהוה как «Яхве», избегая неестественного удвоения «Господь Господь».
- source_word: גֵּה גְבוּל
  choice: Вот границы земли
  rationale: Указательная конструкция вводит последующее описание рубежей. В русском контексте раздела всей земли естественно множественное «границы»; добавление «земли» ясно связывает выражение со следующим оборотом.
- source_word: תִּתְנַחֲלוּ אֶת־הָאָרֶץ
  choice: земли, которую вы разделите в наследие
  rationale: Форма от נחל здесь обозначает распределение земли как наследственных владений, а не только её получение; перевод сохраняет обе смысловые стороны.
- source_word: לִשְׁנֵי עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: между двенадцатью племенами Израиля
  rationale: «Между» естественно выражает распределение земли среди племён.
- source_word: יוֹסֵף חֲבָלִים
  choice: Иосифу — два удела
  rationale: חֲבָלִים в контексте землемерия означает отмеренные участки или уделы. Хотя еврейский текст буквально не содержит числительного «два», множественное число при Иосифе указывает на его двойной территориальный удел через два племени.
theological_decisions:
- issue: Передача составного божественного наименования אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка Господь
  rationale: Выбранный вариант различает титул и личное имя и непосредственно сохраняет заветное имя, присутствующее в еврейском тексте.
- issue: Смысл уделов Иосифа
  choice: Иосифу — два удела
  alternative: Иосифу — уделы
  rationale: Число «два» раскрывает подразумеваемую двойную долю Иосифа, представленную Ефремом и Манассией, не приписывая тексту иной богословской идеи.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Синтаксис краток и соответствует формуле пророческой речи; «удел» сохраняет библейско-правовой оттенок без архаической тяжеловесности.
