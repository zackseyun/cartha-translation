  yaml_path: translation/ot/ezekiel/047/004.yaml
  text: Again he measured a thousand[a], and led me through the water—water up to the knees. Again he measured a thousand[b], and led me through water up to the waist.
translation:
  language: ru
  text: И снова он отмерил тысячу[a] и провёл меня через воду — вода доходила до колен. Затем он отмерил ещё тысячу и провёл меня через воду — вода доходила до пояса[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тысячу»; единица измерения — локти — понятна из предыдущего стиха.'
    reason: cross_reference
  - marker: b
    text: 'Или: «вода до чресл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: он отмерил
  rationale: Глагол מדד в породе qal обозначает действие измерения; «отмерил» естественно передаёт измерение определённого отрезка в контексте видения.
- source_word: אֶלֶף
  choice: тысячу
  rationale: В еврейском тексте единица измерения не названа; локти подразумеваются из предыдущего стиха, поэтому подлинная эллиптичность сохранена в основном тексте.
- source_word: וַיַּעֲבִרֵנִי
  choice: провёл меня
  rationale: Каузативная форма hiphil означает, что человек сделал так, чтобы пророк прошёл через воду; «провёл меня» передаёт это кратко и естественно.
- source_word: בַמַּיִם
  choice: через воду
  rationale: При глаголе движения сочетание указывает на прохождение через воду, а не только на нахождение в ней.
- source_word: מַיִם בִּרְכָּיִם
  choice: вода доходила до колен
  rationale: Конструкция «вода + часть тела» обозначает уровень воды; выбран ясный современный русский оборот.
- source_word: מֵי מָתְנָיִם
  choice: вода доходила до пояса
  rationale: מָתְנַיִם обозначает область бёдер, поясницы или талии; «до пояса» понятно современному читателю и уместно в описании глубины.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified библейской повествовательностью. Сохранены последовательность действий, повтор и неуказанная в еврейском тексте единица измерения; слегка варьирующие связки «И снова» и «Затем… ещё» обеспечивают естественное русское течение речи.
