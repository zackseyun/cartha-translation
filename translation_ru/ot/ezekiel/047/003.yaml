lexical_decisions:
- source_word: בְּצֵאת הָאִישׁ
  choice: Когда этот человек пошёл
  rationale: Инфинитивная конструкция с בְּ выражает время действия. Указательное «этот» естественно отсылает к мужчине, уже упомянутому в видении.
- source_word: קָדִים
  choice: на восток
  rationale: Слово употреблено как обозначение направления; это естественный современный русский эквивалент.
- source_word: וְקָו בְּיָדוֹ
  choice: держа в руке мерный шнур
  rationale: קָו здесь означает шнур, служащий для измерения. Деепричастная конструкция естественно передаёт сопутствующее обстоятельство, не меняя смысла.
- source_word: וַיָּמָד אֶלֶף בָּאַמָּה
  choice: он отмерил тысячу локтей
  rationale: Глагол обозначает измерение расстояния, а локоть служит единицей меры; «отмерил» точно и естественно передаёт действие.
- source_word: וַיַּעֲבִרֵנִי בַמַּיִם
  choice: провёл меня через воду
  rationale: Порода Hiphil глагола עבר имеет каузативный смысл — заставить или помочь пройти. «Провёл» сохраняет этот смысл без неестественной буквальности.
- source_word: מֵי אָפְסָיִם
  choice: вода доходила до щиколоток
  rationale: Буквальная конструкция «воды щиколоток» идиоматически обозначает глубину воды по щиколотки; выбран ясный современный русский оборот.
