  text: As the man went out eastward with a measuring line in his hand[a], he measured a thousand cubits and led me through the water, water up to the ankles.
translation:
  language: ru
  text: Когда этот человек пошёл на восток, держа в руке мерный шнур, он отмерил тысячу локтей и провёл меня через воду — вода доходила до щиколоток.[a]
  philosophy: optimal-equivalence
  footnotes:
