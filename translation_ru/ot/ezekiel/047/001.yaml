  - severity: low
    issue: «Текла вода» не вполне передаёт исходный пункт движения в יֹצְאִים.
    rationale: Глагол означает «выходить, вытекать». «Вытекала вода» сохраняет и естественное русское звучание, и указанное движение из-под порога.
