  text: וַ/יְשִׁבֵ/נִי֮ אֶל פֶּ֣תַח הַ/בַּיִת֒ וְ/הִנֵּה מַ֣יִם יֹצְאִ֗ים מִ/תַּ֨חַת מִפְתַּ֤ן הַ/בַּ֨יִת֙ קָדִ֔ימָ/ה כִּֽי פְנֵ֥י הַ/בַּ֖יִת קָדִ֑ים וְ/הַ/מַּ֣יִם יֹרְדִ֗ים מִ/תַּ֜חַת מִ/כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/יְמָנִ֔ית מִ/נֶּ֖גֶב לַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/001.yaml
  text: Then he brought me back to the entrance of the house[a], and behold, water was coming out from under the threshold of the house eastward, because the front of the house faced east; and the water was flowing down from under the south side of the house[b], on the right side, south of the altar.
translation:
  language: ru
  text: Затем он привёл меня обратно ко входу в дом[a]. И вот, из-под порога дома вытекала вода к востоку, потому что дом был обращён фасадом на восток. Вода стекала из-под правой стороны дома[b], к югу от жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дому»; здесь имеется в виду здание храма в видении Иезекииля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-под правого плеча дома»; слово «плечо» употреблено в значении стороны сооружения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשִׁבֵנִי
  choice: Затем он привёл меня обратно
  rationale: Каузативная форма породы хифиль от שוב означает «побудил вернуться»; выбран естественный русский эквивалент, сохраняющий значение возвращения по чьему-либо действию.
- source_word: פֶּתַח הַבַּיִת
  choice: ко входу в храм
  rationale: פֶּתַח обозначает вход или дверной проём. Хотя הַבַּיִת буквально значит «дом», в контексте видения речь идёт о здании храма; это пояснено сноской.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохранена функция указательной частицы, привлекающей внимание к новому зрительному образу.
- source_word: מַיִם יֹצְאִים
  choice: текла вода
  rationale: Причастие выражает продолжающееся движение воды; русское единственное число является естественным для неисчисляемого существительного.
- source_word: מִתַּחַת מִפְתַּן
  choice: из-под порога
  rationale: Точно передано пространственное отношение и архитектурное значение מִפְתָּן.
- source_word: קָדִימָה
  choice: на восток
  rationale: Передано направительное значение формы без излишне книжного «к востоку».
- source_word: כִּי פְנֵי הַבַּיִת קָדִים
  choice: потому что храм был обращён фасадом на восток
  rationale: פְנֵי здания означает его переднюю сторону; «обращён фасадом» ясно выражает ориентацию сооружения.
- source_word: יֹרְדִים
  choice: стекала
  rationale: Глагол буквально обозначает движение вниз; применительно к воде «стекала» естественно сохраняет этот компонент.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: из-под правой стороны храма
  rationale: כָּתֵף буквально «плечо», но в архитектурном употреблении обозначает бок или сторону; הַיְמָנִית уточняет её как правую. Такое чтение ближе к синтаксису еврейского текста, чем добавление отдельного обозначения южной стороны.
- source_word: מִנֶּגֶב לַמִּזְבֵּחַ
  choice: к югу от жертвенника
  rationale: נֶגֶב здесь служит указанием направления или расположения относительно жертвенника.
