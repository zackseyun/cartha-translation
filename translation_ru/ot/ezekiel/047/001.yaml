  source_fidelity: 'Основная поправка нужна для сохранения лексического соответствия הַבַּיִת: в еврейском тексте стоит «дом», тогда как черновик дважды подменяет его «храмом». Контекст видения допускает пояснение в сноске, но не требует этой конкретизации в основном тексте. «Вытекала» точнее передаёт יֹצְאִים, чем нейтральное «текла». Пространственные указания «правой стороны» и «к югу от жертвенника» сохранены раздельно, как в оригинале.'
