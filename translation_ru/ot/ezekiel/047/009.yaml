  source_fidelity: В первой клаузе יִשְׁרֹץ характеризует живых существ как «кишащих/роящихся», а не прямо указывает место действия. Добавление «в воде» не требуется и несколько меняет синтаксическую связь. В остальном переданы множественно-двойственная форма נַחֲלַיִם, последующее единственное הַנָּחַל, изобилие рыбы и образ исцеления вод. Вторая часть допускает указанную в сноске неопределённость субъекта «исцелятся».
  naturalness: '«Которое кишит в воде» звучит неловко по-русски: относительное придаточное формально описывает единичное «существо», а добавление «в воде» отсутствует в еврейской формулировке. «Все живые существа, которые кишат» — естественнее и сохраняет собирательно-множественный образ. «Рыбы будет чрезвычайно много» приемлемо, но «рыбы будет великое множество» литературнее и точнее передаёт רַבָּה מְאֹד.'
