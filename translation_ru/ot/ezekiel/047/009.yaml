  text: וְ/הָיָ֣ה כָל נֶ֣פֶשׁ חַיָּ֣ה אֲֽשֶׁר יִשְׁרֹ֡ץ אֶ֣ל כָּל אֲשֶׁר֩ יָב֨וֹא שָׁ֤ם נַחֲלַ֨יִם֙ יִֽחְיֶ֔ה וְ/הָיָ֥ה הַ/דָּגָ֖ה רַבָּ֣ה מְאֹ֑ד כִּי֩ בָ֨אוּ שָׁ֜מָּ/ה הַ/מַּ֣יִם הָ/אֵ֗לֶּה וְ/יֵרָֽפְאוּ֙ וָ/חָ֔י כֹּ֛ל אֲשֶׁר יָ֥בוֹא שָׁ֖מָּ/ה הַ/נָּֽחַל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/009.yaml
  text: And every living creature that swarms[a], wherever the river goes, will live. And there will be very many fish, because these waters go there and are healed[b]; everything will live wherever the river goes.
translation:
  language: ru
  text: Все живые существа, которые кишат, будут жить всюду, куда придут потоки[a]. Рыбы будет великое множество, потому что эти воды придут туда и исцелятся[b]. Всё будет жить всюду, куда придёт река.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь стоит двойственная или множественная форма: «потоки» либо «реки»; далее в стихе употреблено единственное число — «река».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и исцелятся». Подразумеваемым субъектом могут быть воды в том месте, куда приходит река, либо упомянутые «эти воды». Образ исцеления в еврейском тексте выражен прямо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ חַיָּה
  choice: всякое живое существо
  rationale: Сочетание обозначает живое создание вообще, а не человеческую «душу»; водный контекст уточняет сферу обитания.
- source_word: יִשְׁרֹץ
  choice: кишит в воде
  rationale: Глагол передаёт образ множества снующих, размножающихся водных существ; добавление «в воде» естественно выражает контекст без изменения смысла.
- source_word: נַחֲלַיִם
  choice: потоки
  rationale: Форма морфологически двойственная или множественная. «Потоки» сохраняет число, не навязывая спорное толкование о ровно двух руслах.
- source_word: יִחְיֶה
  choice: будет жить
  rationale: Прямо передаёт значение глагола и не заменяет его более истолковывающими вариантами вроде «оживёт» или «будет процветать».
- source_word: הַדָּגָה רַבָּה מְאֹד
  choice: рыбы станет чрезвычайно много
  rationale: Собирательное существительное и усиление выражают исключительное изобилие рыбы; русская конструкция звучит естественно.
- source_word: וְיֵרָפְאוּ
  choice: воды там исцелятся
  rationale: Сохранён явный образ исцеления, а не сведение смысла к «станут пресными»; слово «там» указывает на наиболее вероятный подразумеваемый субъект — воды места, куда входит поток.
- source_word: וָחָי כֹּל
  choice: всё будет жить
  rationale: Сохраняет всеобъемлющий и лаконичный характер итогового утверждения.
- source_word: הַנָּחַל
  choice: река
  rationale: В конце стиха употреблено единственное число; в видении речь идёт о постоянном животворящем водном потоке, поэтому «река» яснее, чем «вади».
theological_decisions:
- issue: Образ исцеления вод
  choice: 'Сохранить метафору исцеления: «воды там исцелятся».'
  alternative: 'Передать результат толковательно: «вода станет пресной/здоровой».'
  rationale: Корень רפא прямо обозначает исцеление. Такой перевод удерживает символику восстановления внутри видения, не вводя дополнительных богословских выводов.
- issue: Число водных потоков в первой части стиха
  choice: Передать נַחֲלַיִם множественным «потоки».
  alternative: Сгладить до единственного «река» или понимать строго как «два потока».
  rationale: Форма допускает двойственное/множественное восприятие, тогда как контекст далее возвращается к единственному הַנָּחַל. Перевод «потоки» сохраняет напряжение текста без утверждения, что русел обязательно ровно два.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого видения. Синтаксис упрощён лишь настолько, чтобы длинная еврейская фраза была ясна обычному читателю; повтор «всюду, куда…» и образ «исцеления» сохранены. Различие между множественным «потоки» в первой части и единственным «река» в заключении намеренно не сглажено.
