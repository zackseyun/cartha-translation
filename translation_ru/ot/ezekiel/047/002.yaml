  text: וַ/יּוֹצִאֵ/נִי֮ דֶּֽרֶךְ שַׁ֣עַר צָפוֹנָ/ה֒ וַ/יְסִבֵּ֨/נִי֙ דֶּ֣רֶךְ ח֔וּץ אֶל שַׁ֣עַר הַ/ח֔וּץ דֶּ֖רֶךְ הַ/פּוֹנֶ֣ה קָדִ֑ים וְ/הִנֵּה מַ֣יִם מְפַכִּ֔ים מִן הַ/כָּתֵ֖ף הַ/יְמָנִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/002.yaml
  text: Then he brought me out by way of the north gate[a], and led me around by the outside way to the outer gate, the one facing east; and behold[b], water was trickling from the right side.
translation:
  language: ru
  text: Он вывел меня через северные ворота и обвёл снаружи к внешним воротам, обращённым на восток. И вот, вода сочилась[a] с правой стороны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «вытекала» или «струилась». Еврейский глагол описывает небольшой выходящий поток, а не мощное течение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с правого плеча». Здесь «плечо» означает боковую сторону сооружения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: Он вывел меня
  rationale: Порода hифиль глагола יצא означает побуждение выйти; «вывел меня» естественно передаёт перемещение наружу под руководством проводника.
- source_word: דֶּרֶךְ שַׁעַר צָפוֹנָה
  choice: через северные ворота
  rationale: דֶּרֶךְ обозначает путь или маршрут, а צָפוֹנָה указывает направление на север. В данном контексте естественное русское выражение — «через северные ворота».
- source_word: וַיְסִבֵּנִי
  choice: обвёл
  rationale: Hифиль глагола סבב означает заставить обойти или провести вокруг. «Обвёл» кратко и точно передаёт движение в обход сооружения.
- source_word: דֶּרֶךְ חוּץ
  choice: снаружи
  rationale: חוּץ указывает на внешнее пространство; наречие «снаружи» ясно передаёт, что путь проходил вне храмового комплекса.
- source_word: אֶל שַׁעַר הַחוּץ
  choice: к внешним воротам
  rationale: Сочетание относится к внешним воротам храмового комплекса; «внешние ворота» — ясное и естественное архитектурное обозначение.
- source_word: דֶּרֶךְ הַפּוֹנֶה קָדִים
  choice: обращённым на восток
  rationale: Причастие פנה с קָדִים описывает ориентацию ворот. «Обращённым на восток» сохраняет пространственный смысл и возвышенный повествовательный регистр.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: הִנֵּה привлекает внимание к внезапно замеченной детали. «И вот» естественно сохраняет зрительную выразительность пророческого повествования.
- source_word: מַיִם מְפַכִּים
  choice: вода сочилась
  rationale: Редкий глагол פכה обозначает выходящий наружу небольшой поток — сочение, струение или журчание. «Сочилась» передаёт начальную малую струю, не превращая её в полноводный поток.
- source_word: מִן הַכָּתֵף הַיְמָנִית
  choice: с правой стороны
  rationale: כָּתֵף буквально означает «плечо», но в архитектурном и топографическом употреблении обозначает бок или сторону. Контекстуальное «с правой стороны» понятно современному читателю, а буквальный образ отмечен в сноске.
