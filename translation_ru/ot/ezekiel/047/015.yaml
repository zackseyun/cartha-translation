    reason: lexical_alternative
  - marker: b
    text: «Великое море» — Средиземное море.
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «по пути через Хетлон». Точное отношение Хетлона к дороге в краткой еврейской формуле не уточняется.'
    reason: lexical_alternative
  - marker: d
    text: 'Возможный перевод: «по мере приближения к Цедаду» или «к подходу к Цедаду». Некоторые понимают эти слова как составное название места: «Лево-Цедад».'
