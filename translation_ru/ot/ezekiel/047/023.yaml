  yaml_path: translation/ot/ezekiel/047/023.yaml
  text: And it shall be that in the tribe with which the sojourner resides[a], there you shall give him his inheritance, declares the Lord GOD.
translation:
  language: ru
  text: 'И будет так: в том племени, среди которого живёт переселенец[a], там предоставьте ему наследственный удел, — возвещает Владыка Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поселившийся чужеземец». Еврейское גֵּר означает не временного путника, а неуроженца, постоянно живущего среди народа и включённого в установленный порядок общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И
  rationale: В данном продолжении законодательного предписания формула вводит следствие или конкретизацию; естественное русское «И» сохраняет связь с контекстом без тяжеловесного «и будет так».
- source_word: בַשֵּׁבֶט
  choice: в том племени
  rationale: שֵׁבֶט здесь обозначает племя как территориальную единицу при разделе земли; указательное «том» естественно соотносится с последующим определительным оборотом.
- source_word: אֲשֶׁר גָּר הַגֵּר אִתּוֹ
  choice: среди которого живёт переселенец
  rationale: גֵּר — не временный путник, а пришлый человек, постоянно живущий внутри общины. «Среди которого» естественно передаёт связь с племенем, не переопределяя неоднозначный единственный суффикс אִתּוֹ.
- source_word: שָׁם
  choice: там и
  rationale: '«Там» сохраняет пространственное ударение: удел даётся именно в племени проживания; частица «и» по-русски усиливает эту соотнесённость.'
- source_word: תִּתְּנוּ
  choice: дайте
  rationale: Форма второго лица множественного числа имеет предписывающую силу; русский императив ясно и естественно передаёт юридическое распоряжение.
- source_word: נַחֲלָתוֹ
  choice: его наследственный удел
  rationale: נַחֲלָה в контексте раздела земли означает предоставляемую земельную долю; «наследственный удел» точнее одного «наследства».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם — пророческая формула торжественного заявления; «Владыка» различает титул אֲדֹנָי и личное имя Яхве, избегая сочетания «Господь Господь».
theological_decisions:
- issue: Передача имени יְהוָה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача личного имени как «Яхве» сохраняет его отличие от титула אֲדֹנָי; «Владыка» позволяет естественно передать оба элемента формулы без их слияния.
- issue: Статус גֵּר при наделении землёй
  choice: переселенец
  alternative: чужеземец; пришелец
  rationale: Текст включает постоянно живущего среди Израиля неуроженца в племенное распределение земли. Выбор не добавляет конфессионального толкования и не ослабляет юридическую силу предоставляемого удела.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческо-правовым оттенком. Синтаксис сделан естественным для русского, при этом сохранены пространственное ударение «там» и прямое предписание во множественном числе.
