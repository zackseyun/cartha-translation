  text: חֲמָ֤ת בֵּר֨וֹתָה֙ סִבְרַ֔יִם אֲשֶׁר֙ בֵּין גְּב֣וּל דַּמֶּ֔שֶׂק וּ/בֵ֖ין גְּב֣וּל חֲמָ֑ת חָצֵר֙ הַתִּיכ֔וֹן אֲשֶׁ֖ר אֶל גְּב֥וּל חַוְרָֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/016.yaml
  text: Hamath[a], Berothah, Sibraim—which is between the border of Damascus and the border of Hamath—Hazer-hattikon[c][b], which is toward the border of Hauran.
translation:
  language: ru
  text: Хамат, Берота[a], Сивраим — находящийся между границей Дамаска и границей Хамата; Хацер-ха-Тихон[b] — находящийся у границы Хаврана[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые сопоставляют это название с родственным топонимом «Берофай» в 2 Царств 8:8.
    reason: alternative_reading
  - marker: b
    text: «Хацер-ха-Тихон», вероятно, является названием места; буквально его части означают примерно «среднее поселение» или «средний двор».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «находящийся по направлению к границе Хаврана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָת
  choice: Хамат
  rationale: Передано как собственное географическое название в форме, близкой к еврейскому тексту; более полное название «вход в Хамат» здесь отсутствует.
- source_word: בֵּרוֹתָה
  choice: Берота
  rationale: Транслитерация формы масоретского текста; родственная форма «Берофай» известна по 2 Царств 8:8, но не должна подменять чтение данного стиха.
- source_word: סִבְרַיִם
  choice: Сивраим
  rationale: Транслитерация еврейского топонима с естественной для русского языка передачей согласных.
- source_word: אֲשֶׁר בֵּין גְּבוּל דַּמֶּשֶׂק וּבֵין גְּבוּל חֲמָת
  choice: находящийся между границей Дамаска и границей Хамата
  rationale: Относительное придаточное отнесено к ближайшему топониму «Сивраим». Повтор слова «граница» сохраняет структуру еврейского текста.
- source_word: חָצֵר הַתִּיכוֹן
  choice: Хацер-ха-Тихон
  rationale: Сочетание понято как составной топоним и транслитерировано, поскольку стих представляет перечень пограничных пунктов; буквальный смысл компонентов пояснён в сноске.
- source_word: אֲשֶׁר אֶל גְּבוּל חַוְרָן
  choice: находящийся у границы Хаврана
  rationale: Предлог אֶל в описании границ допускает оттенки близости и направления. Основной текст естественно выражает пространственную связь, а направительное прочтение сохранено в сноске.
- source_word: גְּבוּל
  choice: граница
  rationale: В контексте размежевания земель слово обозначает предел или рубеж; «граница» точно и естественно передаёт этот смысл.
