  text: Again he measured a thousand[a], and it was a river that I could not cross, because the waters had risen—waters to swim in[b], a river that could not be crossed.
translation:
  language: ru
  text: Он снова отмерил тысячу — и это была река, которую я не мог перейти, потому что воды поднялись — воды, пригодные для плавания[a], река, которую нельзя было перейти.
  philosophy: optimal-equivalence
