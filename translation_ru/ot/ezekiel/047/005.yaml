lexical_decisions:
- source_word: וַיָּמָד אֶלֶף
  choice: Он снова отмерил тысячу локтей
  rationale: Глагольная форма продолжает последовательность действий, а «снова» естественно передаёт повторное измерение в ближайшем контексте. Единица «локтей» подразумевается из предыдущих стихов и для ясности восполнена в тексте.
- source_word: נַחַל
  choice: река
  rationale: Хотя слово может обозначать поток или русло, в видении речь идёт о глубокой текущей воде, в которой можно плыть; «река» наиболее естественно передаёт образ.
- source_word: אֲשֶׁר לֹא אוּכַל לַעֲבֹר
  choice: которую я не мог перейти
  rationale: Сохраняет первое лицо, значение невозможности и обычный русский способ говорить о пересечении реки.
- source_word: גָאוּ הַמַּיִם
  choice: вода поднялась
  rationale: Глагол выражает подъём или разлив воды; формулировка ясна и соответствует постепенному увеличению глубины.
- source_word: מֵי שָׂחוּ
  choice: вода, в которой можно было плыть
  rationale: Естественно передаёт еврейское сочетание «воды плавания», то есть воду достаточной глубины для плавания, не превращая пояснение в отдельное толкование.
- source_word: נַחַל אֲשֶׁר לֹא יֵעָבֵר
  choice: река, которую нельзя было перейти
  rationale: Пассивное значение исходного выражения сохранено. Повтор слова «река» передаёт подчёркнутый повтор в еврейском тексте.
