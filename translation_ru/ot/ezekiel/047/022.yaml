source:
  edition: WLC
  text: וְ/הָיָ֗ה תַּפִּ֣לוּ אוֹתָ/הּ֮ בְּ/נַחֲלָה֒ לָ/כֶ֗ם וּ/לְ/הַ/גֵּרִים֙ הַ/גָּרִ֣ים בְּ/תוֹכְ/כֶ֔ם אֲשֶׁר הוֹלִ֥דוּ בָנִ֖ים בְּ/תֽוֹכְ/כֶ֑ם וְ/הָי֣וּ לָ/כֶ֗ם כְּ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אִתְּ/כֶם֙ יִפְּל֣וּ בְ/נַחֲלָ֔ה בְּ/ת֖וֹךְ שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/022.yaml
  text: And it shall be that you shall allot it as an inheritance for yourselves and for the sojourners who sojourn among you[a], who have fathered children among you; and they shall be to you like a native among the sons of Israel[c][b]. With you they shall receive an inheritance among the tribes of Israel.
translation:
  language: ru
  text: 'И будет так: вы распределите её в наследственный удел себе и пришельцам[a], живущим среди вас, которые стали отцами сыновей среди вас[b]. Они будут для вас как коренные жители[c] среди сынов Израиля. Вместе с вами они получат наследственный удел среди колен Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переселенцам», «постоянно живущим чужеземцам». Еврейское גֵּר означает некоренного жителя, который постоянно живёт среди Израиля и имеет признанное положение в общине.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которые породили сыновей». «Сыновья» в данном контексте может обозначать потомство в целом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как уроженцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפִּלוּ / יִפְּלוּ (נפל в Hiphil/Qal с נַחֲלָה)
  choice: распределите / получат наследственный удел
  rationale: В первой части каузативная форма обозначает распределение земли, а во второй простая форма — получение удела. Такой перевод естественен по-русски и сохраняет различие между действием распределяющих и результатом для получателей.
- source_word: נַחֲלָה
  choice: наследственный удел
  rationale: В контексте распределения земли слово обозначает земельное владение, передаваемое как наследие. Сочетание «наследственный удел» точнее одного слова «наследство» передаёт земельный и распределительный смысл.
- source_word: הַגֵּרִים
  choice: пришельцам
  rationale: גֵּר — не случайный путник, а некоренной житель, постоянно живущий среди Израиля и имеющий признанное положение. Традиционное русское слово «пришелец» сохраняет правовой и общинный оттенок; сноска поясняет его современному читателю.
- source_word: הַגָּרִים בְּתוֹכְכֶם
  choice: живущим среди вас
  rationale: Естественно передаёт причастный оборот и постоянное проживание внутри общины, не создавая тяжеловесного повтора «пришельцам, пришельствующим».
- source_word: הוֹלִדוּ בָנִים
  choice: у которых среди вас родились дети
  rationale: Передаёт смысл укоренившихся семей и наличия следующего поколения. Формально בָנִים может означать «сыновья», а Hiphil ילד — «родили/произвели на свет»; буквальная форма отмечена в сноске.
- source_word: כְּאֶזְרָח
  choice: как коренные жители
  rationale: אֶזְרָח обозначает уроженца, полноправного коренного члена народа или страны. «Как коренные жители» сохраняет сравнительную силу כְּ и не вводит современную юридическую категорию гражданства.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Сохраняет семейно-национальное выражение исходного текста, не сводя его просто к этнониму «израильтяне».
- source_word: אִתְּכֶם
  choice: вместе с вами
  rationale: Подчёркивает совместное участие пришельцев и коренных израильтян в распределении земли.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: среди колен Израиля
  rationale: Точно указывает, что удел предоставляется внутри племенного устройства Израиля; «колена Израиля» — понятное и устойчивое русское библейское выражение.
theological_decisions:
- issue: Положение גֵּר при распределении восстановленной земли
  choice: Постоянно живущие среди Израиля пришельцы с укоренившимися семьями получают наследственный земельный удел вместе с коренными израильтянами.
  alternative: Речь могла бы идти лишь о защите и праве проживания, но не о земельном наследии; либо всё описание можно понимать только символически.
  rationale: Повтор слов и форм, связанных с наследственным уделом (נַחֲלָה; תַּפִּלוּ; יִפְּלוּ), а также сравнение с коренным жителем указывают на действительное включение в распределение земли. Перевод передаёт эту силу, не решая вопрос о более широком буквальном или символическом исполнении видения.
- issue: Значение בָנִים в выражении הוֹלִדוּ בָנִים
  choice: Передано как «дети», поскольку в контексте важны потомство и укоренённость семьи в общине.
  alternative: Формально возможно «сыновья».
  rationale: בָנִים нередко обозначает потомство в целом. Здесь социально-правовой довод основан на наличии следующего поколения среди Израиля, а не явно только на мужских потомках; буквальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Слова «наследственный удел», «пришелец» и «колена Израиля» сохраняют земельно-правовой и общинный контекст; потенциально неясное слово «пришелец» пояснено сноской. Синтаксис разбит на три предложения ради ясности, без устранения сравнительной формулы и богословского напряжения текста.
