base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/019.yaml
  text: And the south side[a], southward, shall be from Tamar to the waters of Meriboth-kadesh, to the wadi, to the Great Sea. This is the south side[c][b], southward.
translation:
  language: ru
  text: А южная граница, на юге, будет идти от Тамара до вод Меривот-Кадеша[a], до русла потока[b], до Великого моря[c]. Такова южная граница, на юге.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до вод Мерива-Кадеша». В еврейском тексте здесь стоит родственная форма названия — «Меривот-Кадеш».'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово обозначает вади — русло или водоток, часто сезонный.
    reason: lexical_alternative
  - marker: c
    text: То есть Средиземное море.
    reason: cultural_note
lexical_decisions:
- source_word: פְאַת
  choice: граница
  rationale: В описании земельных рубежей слово обозначает пограничную сторону или край территории. «Граница» естественно звучит по-русски и ясно передаёт функцию выражения в данном контексте.
- source_word: נֶגֶב / תֵּימָנָה
  choice: южная граница, с южной стороны
  rationale: Оба слова указывают на юг и вместе создают характерное для еврейского текста усиление. Повтор направления сохранён без отождествления נֶגֶב с названием области Негев.
- source_word: מִתָּמָר
  choice: от Тамара
  rationale: Название места передано транслитерацией непосредственно с еврейского, без церковнославянизированной формы.
- source_word: מֵי מְרִיבוֹת קָדֵשׁ
  choice: до вод Меривот-Кадеша
  rationale: Сохранена форма топонима מְרִיבוֹת, засвидетельствованная в данном стихе; родительный оборот естественно передаёт еврейское сочетание.
- source_word: נַחֲלָה
  choice: по руслу потока
  rationale: В перечне границ форма понимается как указание на вади — водоток или русло, нередко сезонное. «По руслу потока» передаёт топографический ход границы и не создаёт ошибочного значения «наследие».
- source_word: הַיָּם הַגָּדוֹל
  choice: Великое море
  rationale: Сохранено традиционное описательное географическое название исходного текста; современное название моря вынесено в примечание.
- source_word: וְאֵת פְּאַת תֵּימָנָה נֶגְבָּה
  choice: Такова южная граница, с южной стороны
  rationale: Эллиптическая заключительная формула понята как итоговое повторение только что описанной границы. «Такова» делает её понятной по-русски, сохраняя резюмирующую функцию.
