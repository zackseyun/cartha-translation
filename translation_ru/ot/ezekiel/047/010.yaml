source:
  edition: WLC
  text: וְ/הָיָה֩ יעמדו עָלָ֜י/ו דַּוָּגִ֗ים מֵ/עֵ֥ין גֶּ֨דִי֙ וְ/עַד עֵ֣ין עֶגְלַ֔יִם מִשְׁט֥וֹחַ לַֽ/חֲרָמִ֖ים יִהְי֑וּ לְ/מִינָ/ה֙ תִּהְיֶ֣ה דְגָתָ֔/ם כִּ/דְגַ֛ת הַ/יָּ֥ם הַ/גָּד֖וֹל רַבָּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/010.yaml
  text: And it will happen that fishermen will stand beside it[a]; from En-gedi even to En-eglaim there will be a place for spreading nets. Their fish will be of many kinds, like the fish of the Great Sea[b], very many.
translation:
  language: ru
  text: 'И будет так: по его берегам будут стоять рыбаки. От Эн-Геди до Эн-Эглаима они будут раскладывать сети. Рыба там будет разных видов[a], как рыба Великого моря[b], и будет её чрезвычайно много.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по её виду»; выражение указывает на множество видов рыбы.'
    reason: lexical_alternative
  - marker: b
    text: «Великое море» — Средиземное море.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет так
  rationale: Передаёт ввод будущего следствия в пророческом повествовании естественно и без излишней архаичности.
- source_word: יעמדו עָלָיו דַּוָּגִים
  choice: вдоль него будут стоять рыбаки
  rationale: עָלָיו в данном контексте указывает на расположение рыбаков у воды, а «вдоль него» естественно передаёт их размещение по берегу потока.
- source_word: מֵעֵין גֶּדִי וְעַד עֵין עֶגְלַיִם
  choice: От Эн-Геди до Эн-Эглаима
  rationale: Конструкция מִן...וְעַד обозначает весь промежуток между двумя названными местами; топонимы транслитерированы.
- source_word: מִשְׁטוֹחַ לַחֲרָמִים יִהְיוּ
  choice: будут места для раскидывания сетей
  rationale: מִשְׁטוֹחַ обозначает место или поверхность для раскладывания, а חֲרָמִים — рыболовные сети. Множественное «места» согласуется с יִהְיוּ и естественно звучит по-русски.
- source_word: לְמִינָהּ תִּהְיֶה דְגָתָם
  choice: Рыба там будет разных видов
  rationale: Фраза буквально говорит о рыбе «по её виду» и в контексте выражает видовое разнообразие. «Там» естественно передаёт пространственную отнесённость, не навязывая неясному суффиксу дְגָתָם искусственного русского соответствия.
- source_word: כִּדְגַת הַיָּם הַגָּדוֹל
  choice: как рыба Великого моря
  rationale: Сохранено библейское наименование «Великое море»; его географическая идентификация вынесена в примечание.
- source_word: רַבָּה מְאֹד
  choice: и будет её чрезвычайно много
  rationale: Передаёт усиленное указание на огромное изобилие рыбы и естественно завершает русское предложение.
theological_decisions: []
