  source_fidelity: В целом переданы все географические ориентиры, повтор определения «восточная сторона», глагол измерения во множественном числе и буквальное «восточное море». Однако «а также» несколько размывает параллельную структуру двух конструкций «между», а разбиение после «по Иордану» делает связь слов «от границы до Восточного моря» менее ясной. Более цельная фраза точнее отражает трудный, перечислительный синтаксис еврейского текста, не устраняя его неоднозначность.
