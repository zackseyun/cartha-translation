base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/018.yaml
  text: And the eastern side shall be from between Hauran and Damascus[a], and between Gilead and the land of Israel, the Jordan, from the border to the eastern sea; you shall measure the eastern side.
translation:
  language: ru
  text: Восточная сторона пройдёт между Хавраном и Дамаском и между Галаадом и землёй Израиля — по Иордану, от границы до восточного моря[a]; отмерьте восточную сторону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть, вероятно, Мёртвого моря; буквально: «восточного моря».'
    reason: Сноска сохраняет буквальное описательное наименование в основном тексте и сообщает вероятный географический референт, не подменяя им текст.
lexical_decisions:
- source_word: פְאַת
  choice: сторона
  rationale: В описании пределов земли слово обозначает одну из сторон территории или линию её границы; «сторона» естественно передаёт формулу и не создаёт образ геометрического угла.
- source_word: קָדִים / קָדִימָה
  choice: восточная
  rationale: Обе формы указывают на восточное направление; повтор сохранён в начале и конце стиха, как в еврейском тексте.
- source_word: מִבֵּין ... וּמִבֵּין ...
  choice: между ... а также между ...
  rationale: Повтор конструкции обозначает прохождение границы между названными областями. Русская связка «а также» сохраняет повтор, не перегружая фразу буквальным «из пространства между».
- source_word: חַוְרָן
  choice: Хавран
  rationale: Принятая русская передача названия области.
- source_word: דַּמֶּשֶׂק
  choice: Дамаск
  rationale: Общеупотребительная русская форма топонима.
- source_word: הַגִּלְעָד
  choice: Галаад
  rationale: Традиционная и узнаваемая русская форма названия области.
- source_word: אֶרֶץ יִשְׂרָאֵל
  choice: земля Израиля
  rationale: Сохранено явно выраженное в оригинале слово «земля», отличающее территорию от народа.
- source_word: הַיַּרְדֵּן
  choice: по Иордану
  rationale: Название реки в еврейском тексте стоит без отдельного поясняющего глагола. Предлог «по» естественно выражает функцию Иордана как линии границы, не добавляя слова «река».
- source_word: מִגְּבוּל
  choice: от границы
  rationale: Буквально сохранено обозначение исходной границы; уточнение «северной» не внесено в основной текст, поскольку его нет непосредственно в данном стихе.
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: Восточное море
  rationale: Сохранено буквальное описательное название еврейского текста; вероятный географический референт указан в сноске.
- source_word: תָּמֹדּוּ
  choice: отмерьте
  rationale: Глагол מדד означает «мерить, отмерять». Повелительная форма во множественном числе передаёт обращение оригинала и соответствует контексту размежевания.
