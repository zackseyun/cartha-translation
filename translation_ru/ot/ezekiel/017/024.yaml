  variant: modern literary Russian
source:
  edition: WLC
  text: וְֽ/יָדְע֞וּ כָּל עֲצֵ֣י הַ/שָּׂדֶ֗ה כִּ֣י אֲנִ֤י יְהוָה֙ הִשְׁפַּ֣לְתִּי עֵ֣ץ גָּבֹ֗הַ הִגְבַּ֨הְתִּי֙ עֵ֣ץ שָׁפָ֔ל הוֹבַ֨שְׁתִּי֙ עֵ֣ץ לָ֔ח וְ/הִפְרַ֖חְתִּי עֵ֣ץ יָבֵ֑שׁ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/024.yaml
  text: 'And all the trees of the field shall know that I am Yahweh: I have brought low the high tree[a], I have raised up the low tree, I have dried up the green tree, and I have made the dry tree flourish. I am Yahweh; I have spoken[b], and I have done it.'
translation:
  language: ru
  text: 'И узнают все деревья в поле, что Я — Яхве: Я низвёл высокое дерево и возвысил низкое, иссушил зелёное дерево[a] и заставил сухое дерево расцвести[b]. Я — Яхве; Я сказал — и сделал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свежее» или «влажное дерево», то есть дерево, полное жизненных соков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заставил сухое дерево пустить побеги»; еврейский глагол может также означать распускание или цветение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: и узнают
  rationale: 'Форма перфекта с союзом в пророческой речи передаёт будущий, несомненный результат: все деревья придут к признанию того, кто совершил описанное.'
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: все деревья в поле
  rationale: Сохраняется древесный образ и значение конструктивного сочетания, при этом выражение звучит естественно в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: הִשְׁפַּלְתִּי עֵץ גָּבֹהַ
  choice: Я низвёл высокое дерево
  rationale: «Низвёл» передаёт каузативное значение глагола и образ обращения высокого в низкое, не сводя смысл только к нравственному смирению.
- source_word: הִגְבַּהְתִּי עֵץ שָׁפָל
  choice: возвысил низкое
  rationale: Антитеза «низвёл — возвысил» сохраняет как пространственный образ, так и подразумеваемый образ перемены положения.
- source_word: הוֹבַשְׁתִּי עֵץ לָח
  choice: иссушил зелёное дерево
  rationale: Каузативный глагол передан как «иссушил»; прилагательное לָח буквально указывает на свежесть или наличие влаги, а «зелёное» естественно обозначает живое дерево в противопоставлении сухому.
- source_word: וְהִפְרַחְתִּי עֵץ יָבֵשׁ
  choice: и заставил сухое дерево расцвести
  rationale: Каузатив породы hифиль сохранён конструкцией «заставил… расцвести»; глагол может обозначать появление побегов, бутонов или цветение.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: Я сказал — и сделал
  rationale: 'Краткая русская формула передаёт действенность слова Яхве: сказанное Им осуществляется.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет это отличие от титула.
- issue: Значение образа деревьев
  choice: Сохранить древесную метафору без пояснения её политических или богословских соответствий в основном тексте
  alternative: Прямо назвать царей, правителей или народы
  rationale: Стих выражает смысл посредством образа деревьев; конкретизация референтов устранила бы намеренную образность и вышла бы за пределы сказанного в этой строке.
- issue: Временная перспектива божественных действий
  choice: Передать действия прошедшим временем, а итоговое узнавание — будущим
  alternative: Передать все действия будущим временем
  rationale: Еврейские перфекты представляют действия Яхве как твёрдо решённые или уже совершённые, тогда как начальное וְיָדְעוּ указывает на наступающий результат. Русская форма сохраняет эту пророческую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим ритмом. Параллельные противопоставления сохранены; архаизмы сведены к минимуму. Тире в заключении подчёркивает неразрывность слова и действия.
