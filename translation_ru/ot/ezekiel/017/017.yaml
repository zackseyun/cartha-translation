base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/017.yaml
  text: Pharaoh will not act for him in the war with a great army and a large assembly[b][a], when they cast up a siege ramp and build a siege wall to cut off many lives.
translation:
  language: ru
  text: И фараон не поможет ему в войне, даже имея великое войско и многолюдное собрание[a], — при насыпании осадного вала и сооружении осадных укреплений[b], чтобы лишить жизни многих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не станет действовать в его пользу в войне с великим войском и многолюдным собранием». Еврейский оборот с глаголом «делать» здесь идиоматически обозначает действенное действие в чью-либо пользу.'
    reason: lexical_alternative
  - marker: b
    text: Еврейские осадные термины можно также перевести как «осадная насыпь» и «осадная стена», «осадное сооружение» или «осадная башня».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחַיִל גָּדוֹל
  choice: с великим войском
  rationale: В военном контексте חַיִל обозначает войско или военную силу; «войско» ясно и естественно по-русски.
- source_word: וּבְקָהָל רָב
  choice: и многочисленным собранием
  rationale: קָהָל буквально означает собравшееся множество, собрание; перевод сохраняет исходную широту и не сводит выражение исключительно к воинскому подразделению.
- source_word: יַעֲשֶׂה אוֹתוֹ
  choice: не выступит за него
  rationale: Сжатое идиоматическое выражение с עשה здесь означает действенное выступление на чьей-либо стороне. «Не выступит за него» естественно передаёт военный контекст, не ограничивая смысл обычной помощью.
- source_word: בַּמִּלְחָמָה
  choice: на войну
  rationale: В сочетании с «выступит» русское «на войну» естественно передаёт участие в военных действиях.
- source_word: בִּשְׁפֹּךְ סֹלְלָה
  choice: когда насыплют осадный вал
  rationale: שפך буквально связано с высыпанием или насыпанием, а סֹלְלָה обозначает земляное осадное сооружение; «насыпать осадный вал» — ясное русское соответствие.
- source_word: וּבִבְנוֹת דָּיֵק
  choice: и построят осадные укрепления
  rationale: דָּיֵק обозначает осадное сооружение, точный вид которого не вполне определён; множественное собирательное «укрепления» сохраняет эту неопределённость.
- source_word: לְהַכְרִית נְפָשׁוֹת רַבּוֹת
  choice: чтобы погубить множество жизней
  rationale: הכרית буквально означает «отсечь, истребить», а נְפָשׁוֹת — «жизни» или «люди». Формулировка сохраняет образ и суровость оригинала, оставаясь понятной.
