  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הַ/נֶּ֤שֶׁר הַ/גָּדוֹל֙ גְּד֤וֹל הַ/כְּנָפַ֨יִם֙ אֶ֣רֶךְ הָ/אֵ֔בֶר מָלֵא֙ הַ/נּוֹצָ֔ה אֲשֶׁר ל֖/וֹ הָֽ/רִקְמָ֑ה בָּ֚א אֶל הַ/לְּבָנ֔וֹן וַ/יִּקַּ֖ח אֶת צַמֶּ֥רֶת הָ/אָֽרֶז־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: The great eagle, great in wings, long in pinions, full of plumage, which had variegated feathers, came to Lebanon and took the top of the cedar.’'
translation:
  language: ru
  text: 'и скажи: «Так говорит Владыка Яхве: огромный орёл — с большими крыльями, длинными крыловыми перьями и густым узорчатым оперением[a] — прилетел на Ливан и взял верхушку кедра».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у которого была вышивка (пестрота)»; вероятно, имеется в виду узорчатое или разноцветное оперение.'
    reason: Сохраняется образная и лексическая неоднозначность слова רִקְמָה.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и избегает неестественного сочетания «Господь Господь».
- source_word: הַנֶּשֶׁר הַגָּדוֹל
  choice: огромный орёл
  rationale: נֶשֶׁר обозначает крупную хищную птицу, традиционно орла; «огромный» передаёт размер и величие образа.
- source_word: גְּדוֹל הַכְּנָפַיִם
  choice: с большими крыльями
  rationale: Естественная русская передача буквального описания «великий крыльями», без сведения смысла только к размаху крыльев.
- source_word: אֶרֶךְ הָאֵבֶר
  choice: с длинными маховыми перьями
  rationale: אֵבֶר в описании птицы относится к крылу или его длинным летательным перьям; выбран конкретный орнитологически понятный эквивалент.
- source_word: מָלֵא הַנּוֹצָה
  choice: с густым оперением
  rationale: Передаёт полноту, обилие перьев естественным современным русским выражением.
- source_word: אֲשֶׁר לוֹ הָרִקְמָה
  choice: с узорчатым оперением
  rationale: רִקְמָה буквально связано с вышивкой и пёстрым узором; в данном контексте метафорически описывает рисунок или разноцветность оперения.
- source_word: בָּא אֶל הַלְּבָנוֹן
  choice: прилетел на Ливан
  rationale: Глагол движения применительно к орлу естественно уточнён как «прилетел»; русское управление с названием горной области — «на Ливан».
- source_word: וַיִּקַּח אֶת צַמֶּרֶת הָאָרֶז
  choice: и сорвал верхушку кедра
  rationale: צַמֶּרֶת — верхняя часть или крона дерева; «сорвал» в контексте орла точнее и живее передаёт וַיִּקַּח, чем общее «взял».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, не заменяя имя общим титулом и не внося конфессионального толкования.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Перечень признаков орла оформлен как вставное описание, чтобы сохранить накопительный ритм еврейского текста и ясность русской фразы.
