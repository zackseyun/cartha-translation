  text: so that it might become a lowly kingdom[a], not lifting itself up, but keeping his covenant so as to stand.
translation:
  language: ru
  text: чтобы царство занимало низкое положение[a], не возвышалось, соблюдало его завет[b] и могло устоять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подчинённое положение». Еврейское слово описывает низкий, зависимый политический статус царства.'
    reason: Лексическое уточнение для שְׁפָלָה.
  - marker: b
    text: 'Или: «договор». Еврейское слово может обозначать обязательное политическое соглашение.'
    reason: Лексическая альтернатива для בְּרִית в данном контексте.
lexical_decisions:
- source_word: לִהְיוֹת מַמְלָכָה שְׁפָלָה
  choice: чтобы царство оставалось слабым
  rationale: Инфинитив с ל выражает цель. В данном политическом контексте שְׁפָלָה означает невысокое, подчинённое положение царства; «слабым» естественно передаёт его ограниченную мощь. «Оставалось» согласуется с целью сохранить царство в таком положении, хотя буквально היה допускает «было» или «стало».
- source_word: לְבִלְתִּי הִתְנַשֵּׂא
  choice: не возвышалось
  rationale: Отрицательная целевая конструкция и Hitpael передают отказ от самовозвышения; русское возвратное «не возвышалось» сохраняет этот оттенок.
- source_word: לִשְׁמֹר אֶת־בְּרִיתוֹ
  choice: соблюдало его завет
  rationale: שׁמר с объектом בּרית означает исполнять обязательства соглашения. «Завет» сохраняет основное соответствие еврейскому термину, а политически уместный вариант отмечен в сноске.
- source_word: לְעָמְדָהּ
  choice: и благодаря этому устояло
  rationale: Суффикс женского рода соотносится с מַמְלָכָה, «царство». עמד метафорически означает сохраниться, продолжить существование; «устояло» естественно сохраняет образ стойкости. Связь цели/результата передана словами «благодаря этому».
theological_decisions:
- issue: Передача בְּרִית в контексте вассального политического соглашения
  choice: завет
  alternative: договор
  rationale: «Завет» сохраняет устойчивое соответствие ключевому еврейскому слову и торжественный, скреплённый клятвой характер обязательства. «Договор» точнее подчёркивает непосредственный политический контекст и поэтому дан как допустимый вариант в сноске.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный библейского повествования. Синтаксис сохраняет последовательность целей исходного текста, но формулировка сделана естественной для современного читателя.
