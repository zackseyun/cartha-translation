  text: וְ/אֵ֨ת כָּל מברח/ו בְּ/כָל אֲגַפָּי/ו֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/הַ/נִּשְׁאָרִ֖ים לְ/כָל ר֣וּחַ יִפָּרֵ֑שׂוּ וִ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/021.yaml
  text: And all his fugitives among all his troops will fall by the sword[a], and those who remain will be scattered to every wind. Then you will know that I, Yahweh[b], have spoken.
translation:
  language: ru
  text: И все его беглецы[a] среди всех его отрядов[b] падут от меча, а оставшиеся рассеются по всем ветрам. Тогда вы узнаете, что Я, Яхве, сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово означает «его беглецы»; некоторые древние переводы и современные переводы понимают его как «его отборные воины» или сходным образом.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «его крылья» — еврейский военный образ, обозначающий подразделения или отряды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מברחו
  choice: его беглецы
  rationale: Еврейская форма от ברח естественнее всего обозначает тех, кто бежит или пытается спастись бегством. Перевод сохраняет это основное значение, а древнее альтернативное понимание отмечено в сноске.
- source_word: אֲגַפָּיו
  choice: его отряды
  rationale: Буквально слово означает «крылья», но здесь это военный образ, обозначающий подразделения или отряды. «Отряды» ясно передаёт смысл в современном русском языке.
- source_word: בַּחֶרֶב
  choice: от меча
  rationale: Устойчивое русское выражение для гибели в бою или от оружия, соответствующее еврейской конструкции.
- source_word: הַנִּשְׁאָרִים
  choice: оставшиеся
  rationale: Слово обозначает тех, кто останется после гибели других; нейтральный перевод не привносит богословски нагруженного понятия «остаток».
- source_word: לְכָל רוּחַ
  choice: по всем ветрам
  rationale: Сохранён яркий еврейский образ рассеяния во всех направлениях; выражение естественно и понятно по-русски.
- source_word: יִפָּרֵשׂוּ
  choice: будут рассеяны
  rationale: Форма нифаль выражает подвергание рассеянию; страдательная конструкция соответствует контексту суда.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: דִּבַּרְתִּי
  choice: сказал это
  rationale: Передаёт завершённость и торжественность Божьего заявления; местоимение «это» естественно связывает формулу с предшествующим пророчеством.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Передача הַנִּשְׁאָרִים без богословской конкретизации
  choice: оставшиеся
  alternative: остаток; уцелевшие
  rationale: В данном контексте речь идёт о людях, которые переживут первоначальную гибель, но будут рассеяны; текст не характеризует их как верный или спасённый остаток.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Образ «по всем ветрам» оставлен ради выразительности оригинала; синтаксис упрощён до естественной русской формы без устранения смысловых альтернатив.
