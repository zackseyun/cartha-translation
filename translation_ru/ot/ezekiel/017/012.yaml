  yaml_path: translation/ot/ezekiel/017/012.yaml
  text: Say now to the rebellious house[a], ‘Do you not know what these things mean?’ Say, ‘Behold[c][b], the king of Babylon came to Jerusalem and took its king and its officials and brought them to him in Babylon.’
translation:
  language: ru
  text: 'Скажи же мятежному дому: «Неужели вы не понимаете, что всё это значит?[a]» Скажи: «Вот, царь Вавилона пришёл в Иерусалим, взял его царя и его сановников[b] и привёл их к себе в Вавилон».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что это». В данном контексте вопрос относится к смыслу предшествующей аллегории.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «князей»; еврейское слово может обозначать князей, правителей или высших должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית הַמֶּרִי
  choice: мятежному дому
  rationale: Сохранён характерный для Иезекииля образ «дома», а конструкция со значением постоянного неповиновения передана естественным русским прилагательным «мятежный».
- source_word: הֲלֹא יְדַעְתֶּם מָה אֵלֶּה
  choice: Неужели вы не понимаете, что всё это значит?
  rationale: ידע в контексте истолкования аллегории означает не только знание, но и понимание; «что всё это значит» естественно выражает подразумеваемый смысл при сохранении буквального варианта в примечании.
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и достойный русский указательный маркер, привлекающий внимание к последующему объяснению без архаизации.
- source_word: שָׂרֶיהָ
  choice: его сановников
  rationale: שׂרים обозначает представителей правящей верхушки; «сановники» передаёт высокий государственный статус, не утверждая, что речь непременно о членах царского рода.
- source_word: וַיָּבֵא אוֹתָם אֵלָיו בָּבֶלָה
  choice: увёл их к себе в Вавилон
  rationale: «Увёл» естественно передаёт насильственное перемещение людей; אֵלָיו выражено как «к себе», а направительный суффикс в בָּבֶלָה — как движение «в Вавилон».
