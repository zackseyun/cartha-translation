  text: וַ/יִּצְמַ֡ח וַ/יְהִי֩ לְ/גֶ֨פֶן סֹרַ֜חַת שִׁפְלַ֣ת קוֹמָ֗ה לִ/פְנ֤וֹת דָּלִיּוֹתָי/ו֙ אֵלָ֔י/ו וְ/שָׁרָשָׁ֖י/ו תַּחְתָּ֣י/ו יִֽהְי֑וּ וַ/תְּהִ֣י לְ/גֶ֔פֶן וַ/תַּ֣עַשׂ בַּדִּ֔ים וַ/תְּשַׁלַּ֖ח פֹּארֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/006.yaml
  text: And it sprouted and became a spreading vine[a], low in stature, with its branches turned toward him and its roots beneath him[c][b]. So it became a vine and produced branches and sent out boughs.
translation:
  language: ru
  text: И оно проросло и стало раскидистой лозой[a], невысокой, так что её ветви были обращены к нему, а корни находились под ним[b]. Так она стала лозой[c], пустила ветви и протянула побеги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пышной» либо «ветвистой лозой».'
    reason: lexical_alternative
  - marker: b
    text: Местоимения «к нему» и «под ним», вероятно, относятся к великому орлу из этой аллегории (см. Иез. 17:3–4), хотя возможна и более безличная передача.
    reason: cross_reference
  - marker: c
    text: Повтор слов «стала лозой» сохранён в соответствии с еврейским текстом, где он служит для смыслового акцента.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְמַח
  choice: проросло
  rationale: Глагол צמח обозначает появление и начало роста растения; «проросло» ясно передаёт этот начальный этап.
- source_word: וַיְהִי לְגֶפֶן
  choice: стало… лозой
  rationale: Конструкция выражает результат превращения; сравнительное «стало подобно лозе» в еврейском тексте не требуется.
- source_word: סֹרַחַת
  choice: раскидистой
  rationale: Причастие описывает распространяющийся в стороны рост. «Раскидистая» естественно звучит по-русски и не привносит избыточного значения пышности.
- source_word: שִׁפְלַת קוֹמָה
  choice: невысокой
  rationale: Буквально «низкой ростом»; «невысокой» сохраняет образ и звучит естественно применительно к лозе.
- source_word: לִפְנוֹת דָּלִיּוֹתָיו אֵלָיו
  choice: так что её ветви были обращены к нему
  rationale: Инфинитив с ל допускает оттенок цели или результата. Формулировка «так что» сохраняет связь роста лозы с направлением её ветвей, не делая цель единственно возможным смыслом.
- source_word: וְשָׁרָשָׁיו תַּחְתָּיו יִהְיוּ
  choice: а корни находились под ним
  rationale: Передаёт положение корней и сохраняет мужской род местоименного суффикса, вероятно относящегося к орлу в аллегории.
- source_word: וַתְּהִי לְגֶפֶן
  choice: Так она стала лозой
  rationale: Повтор еврейского текста сохранён как элемент смыслового продвижения и акцента.
- source_word: וַתַּעַשׂ בַּדִּים
  choice: пустила ветви
  rationale: Сочетание עשה с בדים означает образование ветвей; «пустила ветви» естественно для современного русского языка.
- source_word: וַתְּשַׁלַּח פֹּארוֹת
  choice: протянула побеги
  rationale: Глагол передаёт выпускание или распространение роста, а פֹּארוֹת — разросшиеся отростки/ветви. «Протянула побеги» сохраняет динамический образ и отличает их от בַּדִּים.
theological_decisions:
- issue: К кому относятся мужские местоименные суффиксы אֵלָיו и תַּחְתָּיו
  choice: «к нему» и «под ним», с вероятной отсылкой к великому орлу
  alternative: Безличное «к нему/под ним» с отсылкой к месту посадки либо передача образом неодушевлённого предмета
  rationale: В еврейском стоят суффиксы мужского рода единственного числа, а наиболее заметный предшествующий образ — великий орёл (Иез. 17:3–4). Личное местоимение сохраняет олицетворение и намёк на политическую зависимость, но примечание отмечает неопределённость референта.
translation_notes:
  register: Современный литературный русский язык с ясной, но достоинственной образностью. Начальное «оно» относится к посаженному семени или растению; после превращения в лозу употреблено естественное для русского языка женское «она». Синтаксис сохраняет последовательность и повтор исходного текста.
