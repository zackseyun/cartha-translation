  text: אֱמֹ֗ר כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהֹוִ֖ה תִּצְלָ֑ח הֲ/לוֹא֩ אֶת שָׁרָשֶׁ֨י/הָ יְנַתֵּ֜ק וְ/אֶת פִּרְיָ֣/הּ יְקוֹסֵ֣ס וְ/יָבֵ֗שׁ כָּל טַרְפֵּ֤י צִמְחָ/הּ֙ תִּיבָ֔שׁ וְ/לֹֽא בִ/זְרֹ֤עַ גְּדוֹלָה֙ וּ/בְ/עַם רָ֔ב לְ/מַשְׂא֥וֹת אוֹתָ֖/הּ מִ/שָּׁרָשֶֽׁי/הָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/009.yaml
  text: 'Say[a], ‘Thus says the Lord GOD: Will it prosper? Will he not pull up its roots and cut off its fruit, so that it dries up? All the fresh leaves of its growth will wither[b]. And not by a great arm or by many people will it be lifted from its roots.’'
translation:
  language: ru
  text: 'Скажи: «Так говорит Владыка Яхве: разве она будет процветать? Разве он не вырвет[b] её корни и не оборвёт её плоды, так что она засохнет? Засохнут все свежие листья на её побегах. И не понадобится ни могучей руки[a], ни множества людей, чтобы вырвать её с корнями».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «великой руки»; «рука» здесь означает силу или могущество.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также означать «оторвёт» или «выдернет».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Скажи
  rationale: Повелительная форма вводит пророческое возвещение; краткий русский эквивалент сохраняет прямоту оригинала.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка Яхве
  rationale: Сохранена традиционная формула вестника; אֲדֹנָי передано как «Владыка», а личное имя יהוה — как «Яхве», без повтора «Господь Господь».
- source_word: תִּצְלָח
  choice: разве она будет процветать?
  rationale: Глагол обозначает успех или благополучное развитие; в образе лозы «процветать» естественно объединяет оба оттенка.
- source_word: הֲלוֹא
  choice: Разве ... не
  rationale: Риторический вопрос предполагает утвердительный ответ и в русском естественно передаётся конструкцией «разве ... не».
- source_word: יְנַתֵּק
  choice: вырвет
  rationale: Глагол выражает отрывание или выдёргивание; «вырвет её корни» сохраняет резкость действия и растительный образ.
- source_word: יְקוֹסֵס
  choice: оборвёт
  rationale: Редкий глагол описывает удаление, срезание или обрывание; применительно к плодам «оборвёт» звучит естественно, не устраняя оттенок насильственного лишения.
- source_word: וְיָבֵשׁ
  choice: так что она засохнет
  rationale: Передан итог удаления корней и плодов; женский род относится к лозе из контекста аллегории.
- source_word: כָּל טַרְפֵּי צִמְחָהּ
  choice: все свежие листья на её побегах
  rationale: 'Фраза сохраняет конкретную ботаническую образность: свежую листву произведённого лозой роста.'
- source_word: תִּיבָשׁ
  choice: засохнут
  rationale: Согласование по смыслу с множественным «листья» даёт естественный русский синтаксис и сохраняет повтор корня «сохнуть» в еврейском тексте.
- source_word: בִזְרֹעַ גְּדוֹלָה וּבְעַם רָב
  choice: ни могучей руки, ни множества людей
  rationale: Буквальный образ «руки» сохранён как обозначение силы; עַם не конкретизировано как «войско», поскольку оригинал говорит о множестве людей.
- source_word: לְמַשְׂאוֹת אוֹתָהּ מִשָּׁרָשֶׁיהָ
  choice: чтобы поднять её с корней
  rationale: Сохранены глагол «поднять» и множественное «корни»; необычность образа не сглажена до однозначного «искоренить».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное заветное имя יהוה и избегает неясного повторения титула.
- issue: Референт мужского подлежащего в יְנַתֵּק и יְקוֹסֵס
  choice: Сохранено местоимение «он» без поясняющей идентификации
  alternative: Назвать большого орла или царя Вавилона
  rationale: Грамматика указывает на мужской референт из аллегории, но сам стих его не называет; явная идентификация преждевременно разрешила бы образ.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной пророческой формулой. Риторические вопросы и растительная образность сохранены; синтаксис последней строки слегка перестроен ради естественности русского языка без добавления явного исполнителя.
