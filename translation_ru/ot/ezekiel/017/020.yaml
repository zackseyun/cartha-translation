base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/020.yaml
  text: I will spread my net over him[a], and he will be caught in my snare; then I will bring him to Babylon[b], and there I will enter into judgment with him for his treachery by which he acted treacherously against me.
translation:
  language: ru
  text: Я раскину над ним свою сеть, и он попадётся в мою ловушку. Я приведу его в Вавилон и там буду судиться с ним[a] за его вероломство[b] — за то, что он поступил вероломно против Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «там буду судить его». Еврейское выражение допускает более простой перевод, однако основной текст сохраняет оттенок судебного разбирательства с ним.'
    reason: lexical_alternative
  - marker: b
    text: «Вероломство» можно также перевести как «неверность» или «нарушение верности». Еврейское слово подчёркивает нарушение обязательства или завета.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרַשְׂתִּי
  choice: Я раскину
  rationale: Глагол פָרַשׂ означает «раскинуть, расправить»; «раскину» естественно сочетается с сетью и сохраняет образ охоты.
- source_word: רִשְׁתִּי
  choice: свою сеть
  rationale: רֶשֶׁת — обычное обозначение сети. Возвратное «свою» естественно в русском при подлежащем первого лица и сохраняет принадлежность Богу.
- source_word: וְנִתְפַּשׂ
  choice: он попадётся
  rationale: Пассивная форма передаёт, что человек будет пойман. «Попадётся» естественно продолжает образ сети и ловушки.
- source_word: בִּמְצוּדָתִי
  choice: в мою ловушку
  rationale: Хотя מְצוּדָה в иных контекстах может означать крепость, параллелизм с сетью и глаголом «быть пойманным» здесь требует значения «ловушка, западня».
- source_word: וַהֲבִיאוֹתִיהוּ בָבֶלָה
  choice: Я приведу его в Вавилон
  rationale: Каузативная форма выражает действие говорящего, а направительное ה указывает движение в Вавилон.
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ שָׁם
  choice: и там вступлю с ним в суд
  rationale: Конструкция с אֵת допускает оттенок судебного разбирательства или тяжбы, а не только вынесения приговора; выбранная формулировка сохраняет эту юридическую образность.
- source_word: מַעֲלוֹ אֲשֶׁר מָעַל בִּי
  choice: за его вероломство — за то, что он поступил вероломно против Меня
  rationale: Существительное и однокоренной глагол обозначают нарушение верности, особенно клятвы или завета. Повтор «вероломство / поступил вероломно» сохраняет подчёркнутую формулировку еврейского текста.
theological_decisions:
- issue: Характер проступка, выраженного מַעַל / מָעַל
  choice: «вероломство / поступил вероломно против Меня»
  alternative: «неверность / оказался неверен Мне» или «преступление против Меня»
  rationale: В контексте речь идёт о нарушении Седекией клятвы и договора, которое представлено как проступок против Бога. «Вероломство» сохраняет одновременно политический и заветный смысл, не сводя его к обрядовому нарушению.
- issue: Судебный смысл וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: «вступлю с ним в суд»
  alternative: «буду судить его» или «буду судиться с ним»
  rationale: Формулировка сохраняет образ судебного разбирательства и взаимную конструкцию еврейского выражения, не ограничивая его одним лишь объявлением приговора.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены охотничья метафора, юридический оттенок и однокоренной повтор оригинала. Местоимение «Меня» написано с прописной буквы как традиционное указание на Бога; притяжательные формы внутри предложения оставлены со строчной, чтобы избежать избыточной графической маркированности.
