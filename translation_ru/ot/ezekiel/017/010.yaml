  yaml_path: translation/ot/ezekiel/017/010.yaml
  text: And look[a], though it is planted[c][b], will it prosper? Will it not completely wither when the east wind touches it? It will wither on the beds where it sprouted.
translation:
  language: ru
  text: И вот, она посажена — будет ли она процветать? Разве не засохнет она совсем[a], когда её коснётся восточный ветер[b]? Она засохнет на грядках, где выросла[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно засохнет»; в еврейском тексте личная форма глагола соединена с абсолютным инфинитивом для усиления.'
    reason: lexical_alternative
  - marker: b
    text: «Восточный ветер» — жаркий, губительный ветер из восточной пустыни.
    reason: cultural_note
  - marker: c
    text: 'Букв.: «на грядках своего произрастания». Речь идёт о возделанных участках, на которых росло растение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательную и привлекающую внимание функцию оборота, оставаясь естественным для современного литературного русского языка.
- source_word: שְׁתוּלָה
  choice: она посажена
  rationale: Страдательное причастие женского рода описывает лозу как уже посаженную; местоимение сохраняет согласование и связь с образом лозы в контексте.
- source_word: הֲתִצְלָח
  choice: будет ли она процветать?
  rationale: Глагол צלח обозначает успех и благополучный исход. «Процветать» подходит к растению и одновременно сохраняет более широкий смысл успеха, важный для притчи.
- source_word: כְגַעַת בָּהּ
  choice: как только её коснётся
  rationale: Передаёт временно-обстоятельственное значение конструкции с כְּ и נגע; «как только» естественно выражает немедленное последствие, не усиливая образ до отсутствующего в тексте «ударит».
- source_word: רוּחַ הַקָּדִים
  choice: восточный ветер
  rationale: Прямое и традиционное обозначение жаркого, иссушающего ветра, дующего из восточной пустыни.
- source_word: תִּיבַשׁ יָבֹשׁ
  choice: не засохнет она совсем
  rationale: Сочетание личной формы глагола с абсолютным инфинитивом усиливает действие; «совсем» передаёт эмфазу и естественно сочетается с образом растения.
- source_word: עַל עֲרֻגוֹת צִמְחָהּ
  choice: на грядках, где выросла
  rationale: עֲרֻגוֹת обозначает возделанные грядки или участки, а צִמְחָהּ — её рост или произрастание; формулировка ясно указывает на то самое место, где росла лоза.
- source_word: תִּיבָשׁ
  choice: Она засохнет
  rationale: Заключительное повторение יבש вновь утверждает исход; «засохнет» естественно сохраняет растительный образ.
