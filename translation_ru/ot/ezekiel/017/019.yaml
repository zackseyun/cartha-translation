source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֗א אָֽלָתִ/י֙ אֲשֶׁ֣ר בָּזָ֔ה וּ/בְרִיתִ֖/י אֲשֶׁ֣ר הֵפִ֑יר וּ/נְתַתִּ֖י/ו בְּ/רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/019.yaml
  text: 'Therefore thus says the Lord GOD: As I live[a], surely my oath that he despised and my covenant that he broke—I will place them on his own head.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Живу Я! Клятву Мою[a], которую он презрел, и завет Мой, который он нарушил, Я обращу на его же голову».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проклятие Моё»; еврейское слово может обозначать клятву, предусматривающую проклятие за её нарушение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, связывающий грядущий приговор с предшествующим обвинением.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Сохраняет устойчивую пророческую формулу в естественном современном русском языке.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт и титул אֲדֹנָי, и личное имя יְהוִה, избегая неестественного сочетания «Господь Господь».
- source_word: חַי אָנִי
  choice: Живу Я!
  rationale: Сохраняет краткую и торжественную формулу божественной клятвы.
- source_word: אִם לֹא
  choice: утвердительная сила передана конструкцией всей фразы
  rationale: В составе клятвенной формулы это не буквальное условие, а усиленное заверение; по-русски его сила выражена формулой «Живу Я!» и категоричным будущим временем.
- source_word: אָלָתִי
  choice: Клятву Мою
  rationale: В контексте речь прежде всего о нарушенном обязательстве, хотя слово также может обозначать связанную с клятвой кару или проклятие; эта возможность отмечена в сноске.
- source_word: בָּזָה
  choice: презрел
  rationale: Передаёт не просто нарушение, а сознательное пренебрежение и неуважение.
- source_word: בְּרִיתִי
  choice: завет Мой
  rationale: Сохраняет обычное библейское значение בְּרִית и то, что Яхве называет заключённое под клятвой соглашение Своим.
- source_word: הֵפִיר
  choice: нарушил
  rationale: Естественно передаёт нарушение обязательной силы завета, не предполагая его законного аннулирования.
- source_word: וּנְתַתִּיו בְּרֹאשׁוֹ
  choice: Я обращу на его же голову
  rationale: Передаёт образ возложения последствий на самого виновного; «же» подчёркивает возврат ответственности к нему, а единая конструкция не навязывает спорное согласование объекта.
theological_decisions:
- issue: Передача имени יְהוִה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь БОГ
  rationale: Личное имя сохранено как имя, а אֲדֹנָי передано отдельным титулом; это позволяет ясно представить оба элемента еврейского выражения.
- issue: Значение אָלָה
  choice: клятва
  alternative: проклятие
  rationale: Непосредственный контекст подчёркивает презренное клятвенное обязательство; присущий слову оттенок проклятия за нарушение сохранён в сноске.
- issue: Объект суффикса единственного числа в וּנְתַתִּיו
  choice: единое последствие нарушения клятвы и завета выражено оборотом «обращу на его же голову»
  alternative: «возложу его на его голову» с отнесением только к завету
  rationale: Мужской суффикс единственного числа допускает связь с בְּרִית, но контекст объединяет презренную клятву и нарушенный завет в одно основание кары. Русский оборот сохраняет эту напряжённость без искусственного множественного числа.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Инверсия «Живу Я» и постпозиция притяжательных местоимений сохраняют достоинство божественной речи, оставаясь понятными современному читателю.
