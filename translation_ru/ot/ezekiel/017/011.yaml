lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: В устойчивой пророческой формуле сочетание с דְבַר естественно передаётся по-русски как «И было ... слово», сохраняя торжественный библейский ритм без излишней архаики.
- source_word: דְבַר
  choice: слово
  rationale: «Слово» сохраняет основной лексический смысл и устойчивую формулу пророческого откровения; «весть» было бы допустимо, но менее формально соответствует оригиналу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет его отличие от титула «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица прямо означает «ко мне»; эта форма естественна в русском обороте «было ко мне слово».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «говоря» вводит последующую прямую речь; в современном русском эту функцию естественно и точно выполняет двоеточие, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом; вариант «Иегова» основан на более позднем смешанном чтении.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Конечное לֵאמֹר передано пунктуационно, поскольку далее следует содержание речи.
