  terminology: «Господь Яхве» точно передаёт титул אֲדֹנָי и имя יהוה и естественно для современного русского библейского регистра. «Нежный побег» уместно раскрывает субстантивированное רַךְ по ближайшему контексту, не навязывая истолкования.
