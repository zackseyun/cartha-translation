source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לָקַ֣חְתִּי אָ֗נִי מִ/צַּמֶּ֧רֶת הָ/אֶ֛רֶז הָ/רָמָ֖ה וְ/נָתָ֑תִּי מֵ/רֹ֤אשׁ יֹֽנְקוֹתָי/ו֙ רַ֣ךְ אֶקְטֹ֔ף וְ/שָׁתַ֣לְתִּי אָ֔נִי עַ֥ל הַר גָּבֹ֖הַ וְ/תָלֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/022.yaml
  text: 'Thus says the Lord GOD: I myself will take from the top of the lofty cedar and set it out[a]. From the tip of its young shoots I myself will pluck a tender one[b], and I myself will plant it on a high and lofty mountain.'
translation:
  language: ru
  text: 'Так говорит Господь Яхве: «Я Сам возьму с высокой верхушки[a] кедра ветвь и положу её. С кончика его молодых побегов сорву нежный побег[b] и Сам посажу его на высокой и возвышенной горе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с высокой кроны».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «нежный»; имеется в виду нежный побег или веточка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה; такое сочетание ясно и не создаёт неестественного повтора «Господь Господь».
- source_word: מִצַּמֶּרֶת הָאֶרֶז הָרָמָה
  choice: с верхушки высокого кедра
  rationale: צַמֶּרֶת обозначает верхушку или крону дерева, а רָמָה — его высоту; перевод сохраняет образ и звучит естественно по-русски.
- source_word: וְנָתַתִּי
  choice: и помещу взятое
  rationale: Буквально глагол означает «дам, положу, помещу». Добавленное «взятое» лишь проясняет подразумеваемый объект, не отождествляя действие с последующим явным «посажу».
- source_word: מֵרֹאשׁ יֹנְקוֹתָיו
  choice: с кончика его молодых побегов
  rationale: רֹאשׁ здесь обозначает верхний конец, а יֹנְקוֹתָיו — молодые, нежные побеги кедра.
- source_word: רַךְ אֶקְטֹף
  choice: сорву нежный побег
  rationale: Прилагательное רַךְ употреблено самостоятельно — буквально «нежный»; существительное «побег» восстановлено из ближайшего ботанического контекста ради ясности.
- source_word: וְשָׁתַלְתִּי אָ֔נִי
  choice: и Сам посажу его
  rationale: שׁתל — обычный глагол «сажать», а явно выраженное אָ֔נִי при форме первого лица придаёт высказыванию эмфатический оттенок.
- source_word: עַל הַר גָּבֹהַ וְתָלוּל
  choice: на высокой и величественной горе
  rationale: גָּבֹהַ означает «высокий», а תָלוּל — «возвышенный, выдающийся»; «величественная» сохраняет приподнятый образ без тяжеловесного повтора.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, прямо присутствующее в еврейском тексте, не заменяя имя общим титулом.
- issue: Возможная мессианская символика нежного побега
  choice: Сохранён образ без поясняющего толкования в основном тексте
  alternative: Явно назвать побег Мессией или царём
  rationale: Сам стих говорит образным языком и не раскрывает здесь референт напрямую; перевод не должен заранее разрешать богословскую символику.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Повтор «Сам» сохраняет подчёркнутое אָ֗נִי … אָ֔נִי, при этом синтаксис сделан понятным для современного читателя.
