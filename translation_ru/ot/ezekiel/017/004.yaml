lexical_decisions:
- source_word: רֹאשׁ יְנִיקוֹתָיו
  choice: верхушку его молодых побегов
  rationale: Сочетание обозначает верхнюю часть молодой поросли кедра. «Верхушка» естественно передаёт конкретный образ, а «молодые побеги» — свежий рост дерева.
- source_word: קָטָף
  choice: оторвал
  rationale: Глагол означает срывать или отщипывать. «Оторвал» сохраняет энергичность действия и хорошо сочетается с образом побега.
- source_word: וַיְבִיאֵהוּ
  choice: принёс её
  rationale: Местоимение соотнесено с «верхушкой»; женский род в русском определяется выбранным существительным. «Принёс» точно передаёт перемещение объекта.
- source_word: אֶרֶץ כְּנַעַן
  choice: в землю Ханаанскую
  rationale: Основной текст сохраняет традиционное географическое прочтение имени כנען, тогда как примечание отмечает возможный торговый смысл, поддерживаемый параллельной фразой.
- source_word: בְּעִיר רֹכְלִים
  choice: в городе торговцев
  rationale: רֹכְלִים обозначает торговцев, разъезжающих с товарами, или купцов. Перевод сохраняет структуру еврейского словосочетания и его связь с возможным коммерческим смыслом כנען.
- source_word: שָׂמוֹ
  choice: поместил её
  rationale: Глагол имеет общее значение «класть, ставить, помещать». Здесь «поместил» звучит естественно и сохраняет неопределённость относительно конкретного способа размещения.
