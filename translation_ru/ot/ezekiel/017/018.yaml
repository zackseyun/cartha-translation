source:
  edition: WLC
  text: וּ/בָזָ֥ה אָלָ֖ה לְ/הָפֵ֣ר בְּרִ֑ית וְ/הִנֵּ֨ה נָתַ֥ן יָד֛/וֹ וְ/כָל אֵ֥לֶּה עָשָׂ֖ה לֹ֥א יִמָּלֵֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/018.yaml
  text: He despised the oath by breaking the covenant[a]; behold, he had given his hand, yet did all these things[b]. He will not escape.
translation:
  language: ru
  text: Он презрел клятву[a], нарушив завет; и вот, он дал слово[b], но сделал всё это. Он не спасётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проклятие»; еврейское слово может обозначать клятву, влекущую проклятие за её нарушение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дал свою руку» — то есть подтвердил обязательство или соглашение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָזָה
  choice: Он презрел
  rationale: Глагол בזה означает «презирать, относиться с пренебрежением»; «презрел» кратко и точно передаёт нравственную оценку поступка.
- source_word: אָלָה
  choice: клятву
  rationale: В контексте завета אָלָה обозначает клятву, связанную с угрозой проклятия за нарушение; основное значение передано в тексте, а оттенок проклятия сохранён в сноске.
- source_word: לְהָפֵר בְּרִית
  choice: нарушив завет
  rationale: Инфинитив с ל поясняет, каким действием была презрена клятва; деепричастный оборот естественно передаёт эту связь по-русски.
- source_word: בְּרִית
  choice: завет
  rationale: Хотя в непосредственном контексте речь идёт о политическом договоре, «завет» сохраняет устойчивое библейское значение и нравственно-религиозную весомость слова.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет присоединение וְ и эмфатическую функцию הִנֵּה, привлекающего внимание к данному обязательству.
- source_word: נָתַן יָדוֹ
  choice: он дал слово
  rationale: Буквально «дал свою руку» — жест, подтверждающий обязательство. Русское «дал слово» естественно передаёт функцию идиомы; буквальная форма приведена в сноске.
- source_word: וְכָל אֵלֶּה עָשָׂה
  choice: но сделал всё это
  rationale: '«Но» передаёт подразумеваемое контекстом противопоставление: несмотря на данное обязательство, он совершил перечисленные поступки.'
- source_word: לֹא יִמָּלֵט
  choice: Он не спасётся
  rationale: Нифаль глагола מלט здесь означает избежать грозящего суда или уцелеть; «не спасётся» естественно и ёмко выражает это значение.
theological_decisions:
- issue: Передача терминов политического соглашения, имеющих заветный смысл
  choice: «клятва» и «завет»
  alternative: «проклятие» и «договор»
  rationale: Стих осуждает политическую измену языком, несущим также нравственную и заветную значимость перед Богом. Такой перевод сохраняет оба измерения, не сводя текст к светской дипломатии.
- issue: Значение אָלָה
  choice: В основном тексте «клятва», с указанием санкции проклятия в сноске
  alternative: «проклятие» в основном тексте
  rationale: Контекст нарушения завета поддерживает значение клятвы, однако еврейское слово действительно может указывать на сопровождающее её проклятие; неоднозначность сохранена сноской.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Устаревшая буквальная идиома «дал руку» вынесена в сноску, а в основном тексте употреблено понятное «дал слово». Союз «но» ясно выражает контекстуальное противопоставление, не меняя содержания.
