source:
  edition: WLC
  text: חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א בִּ/מְקוֹם֙ הַ/מֶּ֨לֶךְ֙ הַ/מַּמְלִ֣יךְ אֹת֔/וֹ אֲשֶׁ֤ר בָּזָה֙ אֶת אָ֣לָת֔/וֹ וַ/אֲשֶׁ֥ר הֵפֵ֖ר אֶת בְּרִית֑/וֹ אִתּ֥/וֹ בְ/תוֹךְ בָּבֶ֖ל יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/016.yaml
  text: As I live[a], declares the Lord GOD, surely in the place of the king who made him king[b], whose oath he despised and whose covenant he broke—with him in the midst of Babylon he will die.
translation:
  language: ru
  text: '«Живу Я, — возвещает Владыка Яхве, — непременно там, где находится царь, поставивший его царём, чью клятву[a] он презрел и чей завет[b] нарушил: при нём, посреди Вавилона, он умрёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «клятва», может означать клятву с призыванием проклятия на её нарушителя.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чей договор нарушил». Слово «завет» здесь может обозначать политический договор между царями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Живу Я
  rationale: Сохраняет краткую и торжественную древнееврейскую формулу божественной клятвы; инверсия уместна в возвышенной пророческой речи.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передаёт формулу пророческого возвещения; אֲדֹנָי переведено как «Владыка», а тетраграмматон — как личное имя «Яхве», без слияния двух обозначений.
- source_word: אִם לֹא
  choice: непременно
  rationale: В контексте клятвы это не буквальное условие, а усилительное заверение.
- source_word: בִּמְקוֹם הַמֶּלֶךְ
  choice: там, где живёт царь
  rationale: «В месте царя» по смыслу указывает на место пребывания царя; такая передача естественна по-русски и сохраняет локальную отнесённость.
- source_word: הַמֶּלֶךְ הַמַּמְלִיךְ אֹתוֹ
  choice: царь, поставивший его царём
  rationale: Передаёт каузативное значение глагола מלך и сохраняет повтор корня «царь — царём».
- source_word: אֲשֶׁר בָּזָה אֶת אָלָתוֹ
  choice: чью клятву он презрел
  rationale: אָלָה означает клятву и может подразумевать самопроклятие; основной текст сохраняет ясное «клятва», а оттенок вынесен в примечание.
- source_word: וַאֲשֶׁר הֵפֵר אֶת בְּרִיתוֹ
  choice: и чей завет нарушил
  rationale: בְּרִית допускает значения «завет», «договор»; «завет» сохраняет вес и формальную связь с языком верности обязательству.
- source_word: אִתּוֹ בְתוֹךְ בָּבֶל
  choice: у него, посреди Вавилона
  rationale: אִתּוֹ отнесено к царю, поставившему вассала царём; «у него» естественно выражает пребывание во владениях этого царя, а «посреди Вавилона» сохраняет пространственное усиление בְּתוֹךְ.
- source_word: יָמוּת
  choice: он умрёт
  rationale: Простой будущий смысл пророческого объявления передан современным русским будущим временем.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача «Яхве» сохраняет личное имя, непосредственно присутствующее в еврейском тексте; «Владыка» отличает אֲדֹנָי от имени יהוה.
- issue: Характер обязательства, нарушенного вассальным царём
  choice: завет
  alternative: договор
  rationale: «Завет» сохраняет широкий диапазон בְּרִית и богословскую серьёзность клятвенного обязательства, тогда как политическое значение «договор» отмечено в примечании и не навязывается как единственное.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет напряжённую структуру божественной клятвы, но остаётся понятным. Маркеры примечаний поставлены после всего стиха, поскольку оба поясняют отдельные выражения внутри одной непрерывной цитаты.
