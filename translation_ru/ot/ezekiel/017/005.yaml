lexical_decisions:
- source_word: מִזֶּרַע הָאָרֶץ
  choice: немного семян этой земли
  rationale: Передаёт частичное значение предлога מִן и сохраняет буквальный земледельческий образ; форма множественного числа естественнее в современном русском контексте.
- source_word: וַיִּתְּנֵהוּ
  choice: посадил их
  rationale: Буквально глагол означает «поместил», но в сочетании с полем для посева по-русски естественно выражает действие «посадил».
- source_word: בִּשְׂדֵה זָרַע
  choice: в плодородную почву
  rationale: Буквально «в поле посева»; перевод передаёт назначение земли для выращивания, не утяжеляя фразу неестественным оборотом.
- source_word: קָח עַל מַיִם רַבִּים
  choice: у обильных вод
  rationale: Текст в этой точке труден, однако контекст ясно изображает место с большим количеством воды; краткая русская формулировка сохраняет этот образ, не вводя лишней конкретизации.
- source_word: צַפְצָפָה שָׂמוֹ
  choice: словно иву
  rationale: צַפְצָפָה обозначает водолюбивое дерево, обычно понимаемое как ива или тополь; «ива» хорошо соответствует водному окружению, а неопределённость отмечена в сноске.
