  text: Then he took some of the seed of the land and planted it in fertile soil[a]; he placed it beside abundant waters, like a willow.
translation:
  language: ru
  text: Затем он взял немного семени этой земли и посадил его в плодородную почву[a]; он поместил его у обильных вод, как иву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тополь». Значение еврейского слова צַפְצָפָה не вполне ясно.'
