    rationale: После помещения семени в поле/почву текст отдельно говорит о помещении у обильных вод и о сравнении/обозначении через צַפְצָפָה. В черновике «у обильных вод» лишь уточняет место посадки, а отдельный глагольный образ не выражен.
  - severity: low
    issue: Множественное число «семян ... их» ослабляет соответствие грамматике образа.
    rationale: זֶרַע — собирательное существительное, а суффикс в וַיִּתְּנֵהוּ стоит в единственном числе. Русское собирательное «семени ... его» естественно и точнее.
  - severity: low
    issue: Сноска чрезмерно категорична.
    rationale: Для צַפְצָפָה предлагаются вероятные идентификации, в частности «ива» и «тополь»; точнее сказать, что значение не вполне ясно.
