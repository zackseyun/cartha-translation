base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/013.yaml
  text: And he took one of the royal offspring and made a covenant with him[a], bringing him under an oath, and he took the mighty men of the land.
translation:
  language: ru
  text: Он взял одного из царского рода, заключил с ним завет и связал его клятвой[a]; и взял влиятельных людей страны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клятвой с проклятием»; еврейское слово может обозначать клятву, предусматривающую проклятие за её нарушение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: одного из царского рода
  rationale: זֶרַע в контексте человеческого происхождения означает потомство, а מִן имеет частичное значение. «Из царского рода» естественно передаёт принадлежность к царской династии.
- source_word: וַיִּכְרֹת אִתּוֹ בְּרִית
  choice: заключил с ним завет
  rationale: Устойчивое выражение כרת ברית означает заключение завета. «Завет» сохраняет торжественный и обязывающий характер соглашения, не сводя его только к политическому договору.
- source_word: וַיָּבֵא אֹתוֹ בְּאָלָה
  choice: связал его клятвой
  rationale: Конструкция выражает введение человека под обязательство клятвы. Русское «связал его клятвой» естественно передаёт обязательную и отчасти принудительную силу действия, а заложенный в אָלָה оттенок проклятия отмечен в сноске.
- source_word: אֵילֵי הָאָרֶץ
  choice: влиятельных людей страны
  rationale: אֵילִים буквально означает «бараны», но метафорически — сильных, могущественных или знатных людей. Выбранная формулировка ясно передаёт их силу и общественное положение, не приписывая им конкретной должности.
- source_word: לָקָח
  choice: взял
  rationale: Прямое соответствие глаголу לקח; в данном контексте подразумевается, что правитель забрал ведущих людей страны.
theological_decisions:
- issue: Заветно-политическая терминология
  choice: «заключил с ним завет»
  alternative: «заключил с ним договор»
  rationale: בְּרִית — обычное слово для завета, а последующая клятва подчёркивает торжественный и обязывающий характер политического соглашения.
- issue: Смысл אָלָה
  choice: В основном тексте — «клятвой», с указанием оттенка проклятия в сноске
  alternative: «проклятием» или «клятвой с проклятием»
  rationale: Слово может обозначать клятву, предусматривающую проклятие за её нарушение. Основной текст остаётся естественным, а сноска сохраняет полный юридико-богословский оттенок и неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и торжественное. Сохранена заветная терминология, а буквальная метафора «бараны земли» передана понятным обозначением влиятельных людей.
