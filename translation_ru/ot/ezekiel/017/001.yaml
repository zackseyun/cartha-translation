  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Обычная повествовательная формула вводит новое откровение; «И было» естественно сочетается в русском языке с устойчивой пророческой формулой «слово Яхве» и сохраняет последовательность повествования.
- source_word: דְבַר
  choice: слово
  rationale: В пророческой формуле обозначает данное Богом слово или весть; «слово» сохраняет библейскую образность и звучит понятно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно передаёт предлог с местоименным суффиксом и естественно входит в русскую формулу «было ко мне слово».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно и без смысловой потери передаёт двоеточие, тогда как буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. Архаическое «И было» здесь оправдано устойчивым жанровым оборотом, но остальная конструкция не перегружена буквальностью.
