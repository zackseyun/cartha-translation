source:
  edition: WLC
  text: בְּ/הַ֨ר מְר֤וֹם יִשְׂרָאֵל֙ אֶשְׁתֳּלֶ֔/נּוּ וְ/נָשָׂ֤א עָנָף֙ וְ/עָ֣שָׂה פֶ֔רִי וְ/הָיָ֖ה לְ/אֶ֣רֶז אַדִּ֑יר וְ/שָׁכְנ֣וּ תַחְתָּ֗י/ו כֹּ֚ל צִפּ֣וֹר כָּל כָּנָ֔ף בְּ/צֵ֥ל דָּלִיּוֹתָ֖י/ו תִּשְׁכֹּֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/023.yaml
  text: On the high mountain of Israel I will plant it[a], and it will put forth branches and bear fruit and become a majestic cedar. Under it every bird of every wing will dwell[b]; in the shade of its boughs they will dwell.
translation:
  language: ru
  text: На высокой горе Израиля Я посажу его[a]. Он пустит ветви, принесёт плод и станет величественным кедром. Под ним будут обитать всевозможные птицы[b]; в тени его ветвей они будут обитать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пересажу его». Еврейский глагол может подразумевать высаживание побега на новом месте.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всякая птица, всякое крыло» — поэтическое обозначение птиц всякого рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַר מְרוֹם יִשְׂרָאֵל
  choice: На высокой горе Израиля
  rationale: מְרוֹם выражает высоту или возвышенность; эта формулировка естественно передаёт географический и возвышенный образ.
- source_word: אֶשְׁתֳּלֶנּוּ
  choice: Я посажу его
  rationale: Глагол שתל означает «сажать, высаживать». По контексту речь идёт о побеге мужского рода, поэтому местоимение передано как «его»; возможный оттенок пересадки отмечен в сноске.
- source_word: וְנָשָׂא עָנָף
  choice: Он пустит ветви
  rationale: Буквально выражение означает «понесёт/поднимет ветвь»; применительно к росту дерева естественное русское соответствие — «пустит ветви». Единственное число имеет собирательный смысл.
- source_word: וְעָשָׂה פֶרִי
  choice: принесёт плод
  rationale: Обычное древнееврейское сочетание со значением плодоношения; «принесёт плод» сохраняет образ и звучит естественно.
- source_word: וְהָיָה לְאֶרֶז אַדִּיר
  choice: станет величественным кедром
  rationale: אַדִּיר сочетает значения величия, могущества и благородства; «величественный» уместно в данном образе.
- source_word: וְשָׁכְנוּ תַחְתָּיו
  choice: Под ним будут обитать
  rationale: שׁכן означает «обитать, селиться». «Обитать» сохраняет достойный пророческий регистр.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: всевозможные птицы
  rationale: 'Буквально: «всякая птица, всякое крыло». Русское «всевозможные птицы» естественно передаёт поэтический смысл птиц всякого рода, а буквальная форма указана в сноске.'
- source_word: בְּצֵל דָּלִיּוֹתָיו
  choice: в тени его больших ветвей
  rationale: דָּלִיּוֹת обозначает разросшиеся или свисающие крупные ветви. Выражение отличает их от עָנָף в первой части и остаётся понятным современному читателю.
- source_word: תִּשְׁכֹּנָּה
  choice: они будут обитать
  rationale: Форма согласуется с собирательным образом птиц; по-русски множественное число ясно и естественно передаёт распределительный смысл.
theological_decisions:
- issue: Смысл образа птиц
  choice: Сохранить широкий образ всевозможных птиц, не отождествляя их в основном тексте с народами или какими-либо конкретными группами.
  alternative: Явно истолковать птиц как народы, находящие убежище под властью восстановленного царства.
  rationale: Контекст может подсказывать международный смысл образа, однако сам стих сохраняет форму аллегории и не даёт прямого толкования. Перевод не должен разрешать эту образную напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Синтаксис разделён на короткие фразы для ясности; метафора сохранена без добавленного богословского истолкования. Все маркеры сносок присутствуют в основном тексте.
