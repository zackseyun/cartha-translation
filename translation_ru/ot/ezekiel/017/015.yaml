base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/015.yaml
  text: But he rebelled against him by sending his messengers to Egypt[a], that they might give him horses and many people. Will he prosper? Will he escape[b], who does these things? Can he break a covenant and yet escape?
translation:
  language: ru
  text: Но он восстал против него, послав своих послов в Египет, чтобы ему дали коней и многочисленное войско[a]. Будет ли он иметь успех? Спасётся ли тот, кто делает такое? Может ли он нарушить завет[b] — и спастись?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «коней и многочисленный народ»; по контексту речь идёт о военной поддержке — большом войске или множестве воинов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «договор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְרָד בּוֹ
  choice: восстал против него
  rationale: מרד обозначает мятеж или восстание против владыки; сочетание «восстал против него» естественно передаёт политический контекст вассального неповиновения.
- source_word: לִשְׁלֹחַ מַלְאָכָיו מִצְרַיִם
  choice: послал своих послов в Египет
  rationale: מַלְאָכִים здесь — не просто вестники, а дипломатические представители, направленные за военной помощью; «послы» ясно и естественно передаёт функцию.
- source_word: לָתֶת לוֹ סוּסִים וְעַם רָב
  choice: чтобы ему дали коней и многочисленное войско
  rationale: Буквально עַם רָב означает «многочисленный народ», но в данном политико-военном контексте речь идёт о людской военной силе; «многочисленное войско» передаёт подразумеваемый смысл без изменения цели посольства.
- source_word: הֲיִצְלָח
  choice: Будет ли он иметь успех?
  rationale: צלח здесь относится к успешному исходу мятежа; формулировка сохраняет широкий смысл преуспевания и звучит естественно в риторическом вопросе.
- source_word: הֲיִמָּלֵט ... וְנִמְלָט
  choice: Спасётся ли ... и спастись?
  rationale: נמלט означает избежать опасности или кары, спастись. Повтор корня сохранён для передачи риторического нажима исходного текста.
- source_word: הָעֹשֵׂה אֵלֶּה
  choice: тот, кто делает такое
  rationale: Субстантивированное причастие передано современной русской конструкцией; единственное «такое» естественно обобщает указанные действия.
- source_word: וְהֵפֵר בְּרִית
  choice: нарушить завет
  rationale: הפר ברית — устойчивое сочетание со значением нарушения или расторжения завета. «Нарушить завет» сохраняет как политическую, так и нравственно-богословскую весомость выражения.
theological_decisions:
- issue: Характер соглашения, обозначенного словом בְּרִית
  choice: завет
  alternative: договор
  rationale: Хотя непосредственный контекст политический, слово בְּרִית у Иезекииля несёт также нравственную и богословскую значимость клятвенного обязательства. «Завет» не сводит обвинение к простому нарушению дипломатического договора.
translation_notes:
  register: Современный литературный русский язык, сдержанный пророческий регистр. Риторические вопросы и повтор глагола «спастись» сохранены. Тире перед последним «и спастись» подчёркивает заключительное недоверие, не устраняя смысловой связи с нарушением завета.
