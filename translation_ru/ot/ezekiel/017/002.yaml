    text: 'Или: «пословица» или «образное изречение». Древнееврейское слово маша́ль может означать пословицу, притчу или образное изречение; здесь дальнейшая развёрнутая образная речь позволяет перевести его как «притча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и повторяющийся древнееврейский образ; здесь это обращение к пророку как к человеку, а не христологический титул.
- source_word: חוּד חִידָה
  choice: загадай загадку
  rationale: Однокорневая конструкция естественно передаётся по-русски устойчивым сочетанием «загадать загадку», сохраняя повелительную форму и загадочный характер речи.
- source_word: וּמְשֹׁל מָשָׁל
  choice: и расскажи притчу
  rationale: Буквальное однокорневое сочетание в русском неестественно; глагол «расскажи» подходит к развёрнутому образному повествованию, которое следует далее.
- source_word: מָשָׁל
  choice: притчу
  rationale: В данном контексте слово обозначает развёрнутую образную речь; «притча» точнее контекстуального «пословица», но сноска сохраняет широту древнееврейского термина.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Предлог указывает на адресата, а выражение «дом Израиля» сохраняет национально-заветную формулу оригинала.
theological_decisions:
- issue: Передача обращения בֶּן אָדָם в книге Иезекииля
  choice: Сын человеческий
  alternative: смертный; человек
  rationale: Традиционная форма сохраняет древнееврейскую идиому и литературный повтор книги, а сноска поясняет её антропологический смысл, не превращая это обращение в христологическое именование.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской формулы «Сын человеческий» и выражения «дом Израиля». Параллельные повелительные конструкции переданы кратко и естественно; смысловая неоднозначность מָשָׁל отмечена в сноске.
