  text: Сын человеческий[a], загадай загадку и расскажи притчу[b] дому Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертный» или «человек». Древнееврейское выражение «сын человеческий» сохранено как постоянно повторяющееся обращение, которым обращаются к Иезекиилю.'
