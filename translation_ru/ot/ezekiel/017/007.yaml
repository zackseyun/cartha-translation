base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/007.yaml
  text: And there was another great eagle with great wings and much plumage[a]; and behold, this vine bent its roots toward him and sent out its branches to him[d][c][b], that he might water it from the beds where it was planted.
translation:
  language: ru
  text: И был ещё один большой орёл с большими крыльями и обильным оперением[a]. И вот эта лоза повернула к нему свои корни и протянула к нему ветви, чтобы он орошал её из гряд, где она была посажена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово נֶשֶׁר может обозначать также грифа или, шире, крупную хищную птицу.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из гряд её посадки». Заключительную фразу можно также связать с предыдущими действиями лозы: она повернула корни и протянула ветви к орлу от гряд, где была посажена.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נֶשֶׁר
  choice: орёл
  rationale: В аллегории образ соответствует царской и имперской символике; еврейское слово может обозначать и крупную хищную птицу вообще, что отмечено в сноске.
- source_word: גָּדוֹל גְּדֹול כְּנָפַיִם
  choice: большой орёл с большими крыльями
  rationale: Сохраняет повтор גָּדוֹל и подчёркивает величину как самой птицы, так и её крыльев.
- source_word: רַב נוֹצָה
  choice: с густым оперением
  rationale: Естественно передаёт значение многочисленного, обильного оперения.
- source_word: כָּפְנָה שָׁרֳשֶׁיהָ עָלָיו
  choice: повернула к нему свои корни
  rationale: Глагол выражает поворот или наклон в направлении второго орла; предлог עַל здесь понят направительно.
- source_word: דָלִיּוֹתָיו שִׁלְחָה לּוֹ
  choice: протянула к нему ветви
  rationale: Передаёт образ лозы, направляющей свой рост к орлу. Формально необычный мужской суффикс при «ветвях» по контексту относится к лозе.
- source_word: לְהַשְׁקוֹת אֹתָהּ
  choice: чтобы тот орошал её
  rationale: Инфинитив выражает цель, а подразумеваемым деятелем выступает второй орёл.
- source_word: מֵעֲרֻגוֹת מַטָּעָהּ
  choice: на грядах, где она была посажена
  rationale: Основной текст естественно передаёт место орошения и сохраняет земледельческий образ; буквальная форма с מִן и возможная иная синтаксическая связь указаны в сноске.
theological_decisions:
- issue: Синтаксическая связь מֵעֲרֻגוֹת מַטָּעָהּ
  choice: 'Фраза отнесена к орошению и передана как указание места: «на грядах, где она была посажена».'
  alternative: 'Фразу можно связать с поворотом корней и протягиванием ветвей: лоза направила их к орлу «от гряд, где была посажена»; буквально также возможно «из гряд её посадки».'
  rationale: Еврейская конструкция допускает спор о связи заключительной предложной группы. Основной вариант даёт связное земледельческое описание, а сноска сохраняет реальную синтаксическую неоднозначность, не используя её для навязывания определённого толкования аллегории.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной повествовательной интонацией. «И вот» сохраняет резкий образный переход וְהִנֵּה; «гряды» поддерживают сельскохозяйственную образность без архаизации.
