lexical_decisions:
- source_word: שָׂדֶה טּוֹב
  choice: хорошем поле
  rationale: 'Сохраняет конкретный земледельческий образ: שָׂדֶה обычно означает «поле», а не просто почву; определение «плодородное» было бы более истолковывающим.'
- source_word: אֶל מַיִם רַבִּים
  choice: у обильных вод
  rationale: Повторённый אֶל при образе посадки указывает на местоположение или близость; «обильные воды» естественно передаёт достаточное водоснабжение, не сводя רַבִּים лишь к числу отдельных водоёмов.
- source_word: שְׁתוּלָה
  choice: была посажена
  rationale: Пассивное причастие обозначает состояние посаженного растения. «Пересажена» возможно в широком контексте притчи, но здесь было бы излишне конкретным.
- source_word: לַעֲשׂוֹת עָנָף
  choice: чтобы пустить ветви
  rationale: Инфинитив выражает цель или ожидаемый результат; «пустить ветви» — естественное современное русское ботаническое выражение.
- source_word: וְלָשֵׂאת פֶּרִי
  choice: приносить плод
  rationale: נשא с פְּרִי образует обычное выражение «приносить плод»; единственное число сохраняет форму исходного текста.
- source_word: לִהְיוֹת לְגֶפֶן אַדָּרֶת
  choice: стать величественной виноградной лозой
  rationale: אַדָּרֶת передаёт великолепие или величие; «величественная» сохраняет возвышенную оценку, а «виноградная лоза» ясно передаёт גֶפֶן.
