  text: It was planted in a good field by abundant waters[a], to produce branches and bear fruit[b], to become a majestic vine.
translation:
  language: ru
  text: Она была посажена на хорошем поле, у обильных вод[a], чтобы пустить ветви, приносить плод и стать величественной виноградной лозой[b].
  philosophy: optimal-equivalence
  footnotes:
