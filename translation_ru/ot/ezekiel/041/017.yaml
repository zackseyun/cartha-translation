  yaml_path: translation/ot/ezekiel/041/017.yaml
  text: Above the doorway[a], and as far as the inner house, and outside, and on all the wall all around, in the inner part and in the outer part[b], were measurements.
translation:
  language: ru
  text: Над дверным проёмом и до внутреннего здания[a], и снаружи, по всей стене кругом — и внутри, и снаружи — были размеры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутреннего храма». В храмовом видении слово «дом» нередко обозначает храмовое здание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «меры» или «размеры». Еврейская фраза эллиптична; в переводе добавлена связка «были».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: מֵעַל הַפֶּתַח
  choice: над дверным проёмом
  rationale: מֵעַל обозначает пространство над входом или проёмом; «дверной проём» естественно передаёт архитектурное значение פֶּתַח.
- source_word: וְעַד הַבַּיִת הַפְּנִימִי
  choice: и до внутреннего здания
  rationale: בַּיִת буквально означает «дом», но в описании храма обозначает здание или храмовое сооружение. «Внутреннее здание» сохраняет архитектурный смысл, не уточняя без необходимости, что речь идёт именно о помещении.
- source_word: וְלַחוּץ
  choice: а также снаружи
  rationale: Наречное существительное חוּץ указывает на наружную сторону и противопоставлено внутренней части.
- source_word: וְאֶל כָּל הַקִּיר סָבִיב סָבִיב
  choice: по всей стене кругом
  rationale: В данном пространственном описании אֶל естественно передаётся русским «по»; повтор סָבִיב подчёркивает охват стены со всех сторон, что выражено словом «кругом».
- source_word: בַּפְּנִימִי וּבַחִיצוֹן
  choice: и внутри, и снаружи
  rationale: Субстантивированные прилагательные образуют парное противопоставление внутренней и наружной сторон; русский оборот передаёт его ясно и без излишней технической конкретизации.
- source_word: מִדּוֹת
  choice: были размеры
  rationale: Множественное число מִדּוֹת буквально означает «меры, размеры». Еврейская фраза эллиптична, поэтому добавлена связка «были», но не внесено неподтверждённое уточнение о том, как именно эти размеры были представлены.
