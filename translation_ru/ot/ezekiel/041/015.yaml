base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/015.yaml
  text: 'Then he measured the length of the building facing the separate area that was behind it[a], with its galleries on this side and on that side: one hundred cubits[b]; and the inner nave and the porches of the court.'
translation:
  language: ru
  text: 'Затем он измерил длину здания, обращённого к отделённому участку, расположенному позади него, с галереями этого участка[a] по обеим сторонам: сто локтей; а также внутренний храмовый зал[b] и притворы двора.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колоннадами»; точное значение еврейского архитектурного термина неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внутренний храм» или «внутреннее святилище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: Затем он измерил
  rationale: Последовательная глагольная форма продвигает повествование; «затем» естественно передаёт переход к следующему измерению.
- source_word: אֹרֶךְ הַבִּנְיָן
  choice: длину здания
  rationale: Прямое и ясное обозначение архитектурного измерения.
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: обращённого к отделённому участку
  rationale: «Обращённого к» передаёт пространственную ориентацию, а «отделённый участок» сохраняет основное значение редкого термина, не уточняя спорную функцию этого места.
- source_word: אֲשֶׁר עַל־אַחֲרֶיהָ
  choice: позади него
  rationale: Передаёт расположение отделённого участка позади здания; местоименная связь в сложном еврейском описании остаётся контекстуальной.
- source_word: וְאַתִּיקֶיהָ
  choice: вместе с галереями
  rationale: Редкий архитектурный термин, вероятно, обозначает боковые или приподнятые пристройки; «галереи» — понятный и распространённый эквивалент, а неопределённость отмечена в сноске.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: по обеим сторонам
  rationale: Естественно по-русски выражает парное пространственное указание «с этой и с той стороны».
- source_word: מֵאָה אַמָּה
  choice: сто локтей
  rationale: Сохранена древняя единица измерения, важная для архитектурного описания.
- source_word: הַהֵיכָל הַפְּנִימִי
  choice: внутренний храмовый зал
  rationale: הֵיכָל здесь, вероятно, означает главный зал храмового здания, а не весь храмовый комплекс; формулировка понятна и не создаёт ненужной церковно-архитектурной ассоциации слова «неф».
- source_word: וְאֻלַמֵּי הֶחָצֵר
  choice: и притворы двора
  rationale: «Притворы» передаёт множественное число архитектурных входных помещений или портиков при дворе.
