  source_fidelity: В начальной части перевод точно передаёт измерение длины здания, его соотнесённость с отделённым участком и величину в сто локтей. Однако еврейский текст после «сто локтей» не повторяет глагол «измерил»; «Он измерил также» чрезмерно оформляет лаконичную, синтаксически трудную конструкцию как отдельное действие. Кроме того, суффикс в וְאַתִּיקֶיהָ («его/её галереи») следует отразить явнее; по грамматическому роду он естественнее соотносится с «отделённым участком».
  naturalness: «Отделённый участок», «галереи», «сто локтей», «внутренний храмовый зал» и «притворы двора» соответствуют современному литературному русскому и архитектурному регистру отрывка. Перестройка заключительной части под единое управление глагола делает русский текст естественным, не добавляя нового повествовательного шага.
