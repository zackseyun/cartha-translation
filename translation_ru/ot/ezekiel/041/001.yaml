base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/001.yaml
  text: 'Then he brought me into the nave and measured the jambs: six cubits wide on one side and six cubits wide on the other side—the width of the tent[a][b].'
translation:
  language: ru
  text: 'Затем он ввёл меня в главный зал[a] и измерил косяки входа: ширина с одной стороны — шесть локтей, и ширина с другой стороны — шесть локтей; это была ширина шатра[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «основное помещение» или «святилище». Еврейское слово здесь обозначает главное помещение храмового здания, а не весь храмовый комплекс.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово: «шатёр». В контексте видения храма некоторые понимают его как специальное архитектурное обозначение и переводят «скиния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכָל
  choice: главный зал
  rationale: В описании храма слово обозначает главное помещение храмового здания, отличное от внутреннего святилища; этот перевод понятен современному читателю и не создаёт впечатления, будто речь идёт обо всём храмовом комплексе.
- source_word: אֵילִים
  choice: дверные косяки
  rationale: В данном архитектурном контексте имеются в виду боковые элементы входного проёма; «косяки» точнее, чем «столбы», которое могло бы подразумевать отдельно стоящие опоры.
- source_word: אַמּוֹת
  choice: локтей
  rationale: Традиционное русское обозначение древней меры длины сохраняет систему мер исходного текста.
- source_word: רֹחַב
  choice: шириной / ширина
  rationale: Передаёт повторяющееся указание размера естественным русским языком и сохраняет заключительную конструкцию «ширина шатра».
- source_word: מִפּוֹ ... מִפּוֹ
  choice: с одной стороны ... с другой
  rationale: Парные указательные выражения относятся к двум соответствующим сторонам входа.
- source_word: אֹהֶל
  choice: шатёр
  rationale: Сохранено прямое лексическое значение еврейского слова, несмотря на необычность его употребления в описании храмового здания; возможное специальное архитектурное понимание отмечено в сноске.
- source_word: וַיְבִיאֵנִי
  choice: Затем он ввёл меня
  rationale: Передаёт последовательность повествования и естественно звучит по-русски.
- source_word: וַיָּמָד
  choice: измерил
  rationale: Прямо передаёт действие измерения в видении.
