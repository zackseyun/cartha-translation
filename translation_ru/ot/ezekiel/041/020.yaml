  yaml_path: translation/ot/ezekiel/041/020.yaml
  text: From the floor to above the entrance[a], cherubim and palm trees were made[b], and on the wall of the nave.
translation:
  language: ru
  text: От пола до места над входом были выполнены изображения херувимов и пальм, также и на стене главного зала[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская заключительная фраза кратка и буквально звучит: «и стена главного зала». Здесь подразумевается связь с предшествующим описанием изображений; возможно также понимание: «так была украшена стена главного зала».'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: מֵהָאָרֶץ
  choice: От пола
  rationale: Хотя אֶרֶץ обычно означает «земля», в данном архитектурном контексте речь идёт о нижнем уровне внутреннего помещения; «пол» естественно передаёт смысл.
- source_word: עַד מֵעַל הַפֶּתַח
  choice: до места над входом
  rationale: Оборот обозначает вертикальную протяжённость украшений — от пола до участка стены над входом.
- source_word: הַכְּרוּבִים
  choice: херувимы
  rationale: Сохранён традиционный библейский термин для храмовых существ-стражей.
- source_word: וְהַתִּמֹרִים
  choice: и пальмы
  rationale: Существительное прямо обозначает пальмы; из контекста ясно, что имеются в виду их декоративные изображения.
- source_word: עֲשׂוּיִם
  choice: были сделаны
  rationale: Широкое значение пассивного причастия сохранено без необоснованного уточнения «вырезаны».
- source_word: וְקִיר הַהֵיכָל
  choice: а также на стене главного зала
  rationale: Краткая безглагольная фраза в масоретском тексте синтаксически затруднительна. Добавление «на» связывает её с размещением изображений, а הֵיכָל в этом описании обозначает главный зал храмового здания.
