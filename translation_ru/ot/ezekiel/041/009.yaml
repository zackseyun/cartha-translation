base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/009.yaml
  text: The width of the wall that belonged to the side chambers on the outside was five cubits[a], and the open area between the side chambers of the house.
translation:
  language: ru
  text: Ширина наружной стены при боковых комнатах составляла пять локтей, а оставленное свободным место — место боковых комнат, принадлежавших храмовому зданию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст заключительной части стиха труден. Возможны другие понимания, например: «а оставленным свободным было строение боковых комнат, принадлежавшее храмовому зданию», или: «а свободное место было между боковыми комнатами храмового здания». Стих описывает устройство пространства вокруг храмового здания.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹחַב הַקִּיר
  choice: ширина стены
  rationale: Естественная современная архитектурная формулировка, прямо передающая пространственный размер стены.
- source_word: אֲשֶׁר לַצֵּלָע
  choice: при боковых комнатах
  rationale: צֵלָע в описании храма обозначает боковые помещения; единственное число имеет собирательное значение. Предлог ל выражает принадлежность или пространственную связь.
- source_word: אֶל הַחוּץ
  choice: наружной
  rationale: Фраза указывает на внешнюю сторону стены; атрибутивная передача естественна по-русски.
- source_word: חָמֵשׁ אַמּוֹת
  choice: пять локтей
  rationale: Сохранена древняя единица измерения без приблизительного пересчёта.
- source_word: וַאֲשֶׁר מֻנָּח
  choice: а оставленное свободным место
  rationale: Передаёт буквальную идею оставленного или незанятого пространства, не превращая спорное выражение в уверенное указание на пространство «между» комнатами.
- source_word: בֵּית צְלָעוֹת אֲשֶׁר לַבָּיִת
  choice: у боковых комнат храмового здания
  rationale: בֵּית צְלָעוֹת — трудное архитектурное выражение, связанное с комплексом боковых помещений; בַּיִת в данном контексте уточнено как храмовое здание.
