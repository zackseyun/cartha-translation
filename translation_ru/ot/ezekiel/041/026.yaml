base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/026.yaml
  text: And there were shuttered windows and palm trees on this side and on that[a], along the sidewalls of the vestibule, and on the side chambers of the temple[c][b], and the canopies.
translation:
  language: ru
  text: 'Были закрытые окна[a] и изображения пальм[b], расположенные с той и с другой стороны: на боковых стенах притвора, на боковых помещениях храма и на навесах[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глухие окна»; еврейское выражение описывает окна, которые были закрыты или каким-либо образом заграждены.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пальмы»; в данном архитектурном контексте, вероятно, имеются в виду декоративные изображения пальм.'
    reason: cultural_note
  - marker: c
    text: Значение последнего еврейского термина неясно; возможно, речь идёт о выступающих кровлях, карнизах или иных нависающих частях здания.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים אֲטֻמוֹת
  choice: закрытые окна
  rationale: Существительное обозначает окна, а страдательное определение — то, что они были закрыты или каким-либо образом заграждены; нейтральное «закрытые» не уточняет неизвестную конструкцию.
- source_word: תִמֹרִים
  choice: изображения пальм
  rationale: В описании храмовой архитектуры речь идёт о декоративных пальмовых мотивах, а не о живых деревьях; явное «изображения» естественно передаёт контекст.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: с той и с другой стороны
  rationale: Выражение указывает на симметричное расположение по обеим сторонам.
- source_word: אֶל כִּתְפוֹת הָאוּלָם
  choice: на боковых стенах притвора
  rationale: כָּתֵף буквально означает «плечо, бок» и здесь обозначает боковые архитектурные части; אוּלָם — храмовый притвор.
- source_word: צַלְעוֹת הַבַּיִת
  choice: боковые помещения храма
  rationale: В храмовом контексте צֵלָע обозначает боковые комнаты или пристройки, а הַבַּיִת — здание храма.
- source_word: הָעֻבִּים
  choice: выступающие навесы
  rationale: Редкий архитектурный термин неясен; вероятно, он обозначает выступающие или нависающие элементы конструкции. Перевод сохраняет архитектурный смысл, а примечание отмечает неопределённость.
