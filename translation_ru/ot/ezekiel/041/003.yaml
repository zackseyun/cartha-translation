  text: וּ/בָ֣א לִ/פְנִ֔ימָה וַ/יָּ֥מָד אֵֽיל הַ/פֶּ֖תַח שְׁתַּ֣יִם אַמּ֑וֹת וְ/הַ/פֶּ֨תַח֙ שֵׁ֣שׁ אַמּ֔וֹת וְ/רֹ֥חַב הַ/פֶּ֖תַח שֶׁ֥בַע אַמּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/003.yaml
  text: 'Then he went inside and measured the jambs of the entrance: two cubits[a]; the entrance: six cubits[b]; and the width of the entrance: seven cubits.'
translation:
  language: ru
  text: 'Затем он вошёл внутрь и измерил косяки входа[a]: два локтя; вход — шесть локтей[b], а ширину входа — семь локтей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пилястры дверного проёма».'
    reason: lexical_alternative
  - marker: b
    text: Архитектурный смысл этого размера не вполне ясен; возможно, речь идёт не только о ширине свободного проёма, но и о связанном с ним элементе конструкции.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: Затем он вошёл
  rationale: Глагол בוא с союзом продолжает последовательность действий; «затем» естественно передаёт развитие повествования, а «вошёл» — движение проводника дальше внутрь.
- source_word: לִפְנִימָה
  choice: внутрь
  rationale: Наречие обозначает движение во внутреннюю часть, не уточняя сверх текста, какое именно это помещение.
- source_word: וַיָּמָד
  choice: измерил
  rationale: Прямой и естественный перевод действия в контексте видения и обмера храма.
- source_word: אֵיל הַפֶּתַח
  choice: косяки входа
  rationale: В архитектурном контексте אֵיל обозначает боковой выступающий элемент дверного проёма — косяк или пилястру. «Косяки» понятно современному читателю; вариант «пилястры» сохранён в примечании.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: два локтя
  rationale: Прямая передача меры длины.
- source_word: וְהַפֶּתַח
  choice: вход
  rationale: Формально близкая передача без добавления уточняющего «сам»; неоднозначность того, какая часть конструкции измеряется, не устраняется искусственно.
- source_word: שֵׁשׁ אַמּוֹת
  choice: шесть локтей
  rationale: Прямая передача меры длины.
- source_word: וְרֹחַב הַפֶּתַח
  choice: а ширину входа
  rationale: Наиболее естественное лексическое понимание רֹחַב הַפֶּתַח. Архитектурная трудность соотношения размеров отмечена в примечании, а не разрешена внутри текста.
- source_word: שֶׁבַע אַמּוֹת
  choice: семь локтей
  rationale: Прямая передача меры длины.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением сжатой перечислительной структуры еврейского текста. Техническое «косяки» выбрано как более понятное широкому читателю, чем «пилястры». Тире помогают ясно представить ряд измерений, не добавляя отсутствующих в оригинале деталей.
