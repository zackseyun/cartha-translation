  text: וּ/פְנֵ֨י אָדָ֤ם אֶל הַ/תִּֽמֹרָה֙ מִ/פּ֔וֹ וּ/פְנֵֽי כְפִ֥יר אֶל הַ/תִּֽמֹרָ֖ה מִ/פּ֑וֹ עָשׂ֥וּי אֶל כָּל הַ/בַּ֖יִת סָבִ֥יב סָבִֽיב־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/019.yaml
  text: with a human face toward the palm tree on one side[a], and a young lion’s face toward the palm tree on the other side. They were made all around the whole temple.
translation:
  language: ru
  text: человеческое лицо[a] было обращено к пальме с одной стороны, а лицо молодого льва — к пальме с другой. Так было сделано по всему храму кругом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицо человека».'
    reason: Лексически более буквальный вариант передачи פְנֵי אָדָם.
lexical_decisions:
- source_word: פְנֵי אָדָם
  choice: человеческое лицо
  rationale: Сочетание буквально означает «лицо человека». В описании резного изображения «человеческое лицо» естественно передаёт противопоставление лицу льва и не указывает без необходимости на конкретного мужчину.
- source_word: הַתִּמֹרָה
  choice: пальма
  rationale: Речь идёт об изображении пальмы в храмовом убранстве; краткое «пальма» ясно и соответствует контексту.
- source_word: מִפּוֹ ... מִפּוֹ
  choice: с одной стороны ... с другой
  rationale: Повторённое наречное выражение обозначает две противоположные стороны пальмы; выбран естественный русский эквивалент.
- source_word: פְנֵי כְפִיר
  choice: лицо молодого льва
  rationale: כְּפִיר обозначает молодого льва; перевод сохраняет возрастной оттенок и форму исходной конструкции.
- source_word: עָשׂוּי
  choice: Так было сделано
  rationale: Мужской род единственного числа передан без введения спорного множественного подлежащего; «так» суммарно отсылает к описанной композиции.
- source_word: אֶל כָּל הַבַּיִת
  choice: по всему храму
  rationale: בַּיִת в данном видении обозначает храмовое здание, а предлог в контексте передаёт распространение украшения по всему храму.
- source_word: סָבִיב סָבִיב
  choice: кругом
  rationale: Удвоение подчёркивает полный охват; русское «кругом» выражает эту пространственную полноту без тяжеловесного повтора.
theological_decisions:
- issue: Значение אָדָם в описании декоративного лица
  choice: человеческое
  alternative: мужское / человека
  rationale: Здесь слово обозначает вид лица в противопоставлении львиному, поэтому «человеческое» сохраняет смысл, не внося необязательной конкретизации пола.
- issue: Число сказуемого при עָשׂוּי
  choice: безлично-суммарное «Так было сделано»
  alternative: «Они были сделаны»
  rationale: В еврейском тексте стоит форма мужского рода единственного числа. Русская суммарная конструкция сохраняет её грамматическую особенность и не решает однозначно, относится ли форма ко всему узору или к отдельному изображению.
translation_notes:
  register: Современный литературный русский язык; синтаксис dignified и ясный. Эллипсис во второй части («было обращено») естественен для русского и передаёт параллелизм оригинала. Начальная строчная буква сохраняет связь с продолжающимся описанием предыдущего стиха.
