base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/018.yaml
  text: Cherubim and palm trees were made on it[a], with a palm tree between cherub and cherub; and each cherub had two faces.
translation:
  language: ru
  text: 'На стенах были выполнены изображения херувимов и пальм: между каждым херувимом и другим была пальма, и у каждого херувима было по два лица.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּי
  choice: были сделаны
  rationale: Пассивное причастие от עשה буквально означает «сделаны». В архитектурном контексте речь идёт о выполненном на поверхности декоре; множественное число согласовано с последующими «херувимы и пальмы». Слова «на них» восполняют подразумеваемую по контексту поверхность.
- source_word: כְּרוּבִים
  choice: херувимы
  rationale: Устоявшаяся русская передача множественного числа כְּרוּב, уместная для храмового и визионерского контекста.
- source_word: וְתִמֹרִים / וְתִמֹרָה
  choice: пальмы / пальма
  rationale: В данном описании это декоративные изображения пальм. Краткая передача «пальмы» естественна по-русски и сохраняет образ исходного текста без лишнего пояснения в самом стихе.
- source_word: בֵּין כְּרוּב לִכְרוּב
  choice: между одним херувимом и другим
  rationale: Естественно передаёт распределительную конструкцию «между херувимом и херувимом», не создавая впечатления, будто речь только об одной определённой паре.
- source_word: וּשְׁנַיִם פָּנִים לַכְּרוּב
  choice: и у каждого херувима было по два лица
  rationale: 'Буквально: «и два лица у херувима». Распределительные слова «каждого» и «по» ясно выражают смысл, подтверждаемый следующим стихом.'
theological_decisions:
- issue: Характер изображений херувимов в храмовом убранстве
  choice: Передать их как описанные элементы декора без символического истолкования.
  alternative: Добавить аллегорическое или типологическое значение херувимов и пальм.
  rationale: Стих даёт архитектурное описание и сам не объясняет символику изображений.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим храмовому описанию. Синтаксис упрощён ровно настолько, чтобы распределительные конструкции древнееврейского текста были понятны обычному читателю; образность и предметность сохранены.
