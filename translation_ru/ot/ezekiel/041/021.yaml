  text: The nave had a square doorframe[b][a], and the front of the sanctuary had the same appearance.
translation:
  language: ru
  text: Дверной косяк храмового зала был квадратным, а передняя сторона святилища имела такой же вид[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вид — как вид»; не названо прямо, с чем именно сравнивается передняя сторона святилища.'
    reason: Сохраняется эллиптичность и неоднозначность еврейского выражения.
lexical_decisions:
- source_word: הֵיכָל
  choice: храмовый зал
  rationale: В описании храма слово обозначает главный зал перед внутренним святилищем, а не весь храмовый комплекс.
- source_word: מְזוּזַת
  choice: дверной косяк
  rationale: Существительное в единственном числе обозначает вертикальную часть дверного проёма; перевод сохраняет конкретный архитектурный смысл и число оригинала.
- source_word: רְבֻעָה
  choice: четырёхугольным
  rationale: Слово описывает предмет как имеющий четыре стороны или угла; такой перевод не уточняет без необходимости, был ли он строго квадратным.
- source_word: וּפְנֵי הַקֹּדֶשׁ
  choice: а передняя сторона святилища
  rationale: В архитектурном контексте פָּנִים означает лицевую, переднюю сторону, а קֹדֶשׁ — священное помещение, то есть святилище.
- source_word: הַמַּרְאֶה כַּמַּרְאֶה
  choice: имела такой же вид
  rationale: Повторяющаяся эллиптическая формула буквально говорит о сходстве вида; естественная русская передача сохраняет сравнение, не вводя отсутствующего в тексте предмета.
