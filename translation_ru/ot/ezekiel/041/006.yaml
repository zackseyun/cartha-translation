  yaml_path: translation/ot/ezekiel/041/006.yaml
  text: And the side chambers were side chamber upon side chamber[a], three and thirty times; and they entered into the wall that belonged to the house for the side chambers all around, so that they might be supported[b], but they were not supported by the wall of the house.
translation:
  language: ru
  text: Боковые помещения располагались в три яруса, одно над другим, по тридцать в каждом ярусе[a]. Они входили в стену, примыкавшую к храму и окружавшую его со всех сторон, чтобы быть в ней закреплёнными[b], но не были закреплены в стене самого храма.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три и тридцать раз». Обычно это понимают как три яруса по тридцать боковых помещений в каждом; возможны и другие разборы этой краткой еврейской формулировки.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы быть удерживаемыми», «чтобы иметь опору» или «чтобы быть прикреплёнными». Еврейское слово обозначает надёжное удержание или закрепление в конструкции.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּלָעוֹת / צֵלָע
  choice: боковые комнаты / комната
  rationale: В описании храмового здания слово обозначает боковые помещения или пристройки, а не буквальное «ребро».
- source_word: צֵלָע אֶל צֵלָע
  choice: располагались одна над другой
  rationale: Распределительная конструкция описывает последовательное, вероятнее всего ярусное, расположение комнат; такой перевод естественен по-русски, не превращая выражение в технический термин.
- source_word: שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים
  choice: тридцать три раза
  rationale: Сохраняет необычную формулировку масоретского текста и не решает однозначно, обозначает ли число комнаты, места их расположения или повторения конструкции.
- source_word: וּבָאוֹת בַּקִּיר אֲשֶׁר לַבַּיִת
  choice: они входили в стену при храме
  rationale: Передаёт конкретный пространственный образ соединения боковых комнат со стеновой конструкцией и сохраняет отличие этой стены от стены самого храмового здания в конце стиха.
- source_word: סָבִיב סָבִיב
  choice: по всему периметру
  rationale: Естественно передаёт усиленное указание на расположение кругом здания.
- source_word: לִהְיוֹת אֲחוּזִים
  choice: чтобы держаться в ней
  rationale: Пассивная форма от אחז указывает на удержание или закрепление в конструкции; выражение сохраняет как идею опоры, так и идею крепления.
- source_word: וְלֹא יִהְיוּ אֲחוּזִים בְּקִיר הַבָּיִת
  choice: но не были закреплены в стене самого храма
  rationale: 'Передаёт контраст: боковые помещения соединялись с окружающей стеновой конструкцией, но не закреплялись непосредственно в основной стене храмового здания.'
