    rationale: В данном архитектурном контексте еврейское выражение обычно разбирается как «три [яруса], по тридцать [помещений] в каждом», а не как тридцать три повторения. Нынешний вариант создаёт неясную и, вероятно, неверную картину.
  - severity: medium
    issue: «Стена при храме» и «держаться в ней» неясны.
    rationale: Они не передают достаточно ясно пространственную связь и противопоставление стеновой конструкции вокруг здания стене самого здания.
