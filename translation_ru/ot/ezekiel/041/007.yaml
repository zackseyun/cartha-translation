revisions:
- from: Боковые помещения[a] становились шире, по мере того как они, огибая храм, поднимались всё выше и выше, потому что окружавшая храм конструкция[b] ярус за ярусом поднималась всё выше по всей его окружности. Поэтому кверху храм становился шире, и с нижнего яруса поднимались на верхний через средний[c].
  to: Боковые помещения[a], располагавшиеся вокруг храма, от яруса к ярусу становились всё шире, потому что опоясывающая храм конструкция[b] поднималась всё выше и выше вокруг всего храма. Поэтому кверху храм становился шире, и с нижнего яруса поднимались на верхний через средний[c].
  rationale: Правка устраняет нежелательную персонификацию помещений как движущихся вокруг храма, сохраняя круговое расположение (סבב) и постепенное восхождение (למעלה למעלה). Архитектурная неопределённость מוּסַב не снята и отражена в сноске. Все исходные сносковые якоря сохранены и стоят непосредственно при соответствующих выражениях.
