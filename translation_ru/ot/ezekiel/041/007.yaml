translation_notes:
  register: Современный литературный русский язык с достоинством храмового описания. Термины «помещения», «конструкция» и «ярус» понятны неспециалисту и не создают ложной архитектурной точности. Еврейские повторы переданы естественным оборотом «всё выше и выше», а трудность описания опоясывающего устройства сохранена в сноске.
