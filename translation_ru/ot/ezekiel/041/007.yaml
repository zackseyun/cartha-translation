base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/007.yaml
  text: And the side chambers became wider as they went around upward and upward[a], because the structure of the temple went around upward and upward all around the temple. Therefore the width of the temple increased upward[c][b], and so one went up from the lowest story to the highest by way of the middle story.
translation:
  language: ru
  text: Боковые помещения[a], располагавшиеся вокруг храма, от яруса к ярусу становились всё шире, потому что опоясывающая храм конструкция[b] поднималась всё выше и выше вокруг всего храма. Поэтому кверху храм становился шире, и с нижнего яруса поднимались на верхний через средний[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «боковые комнаты» либо «боковые пристройки». Еврейское слово может обозначать помещения или части строения, примыкающие к главному зданию.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение, переведённое как «опоясывающая храм конструкция», в архитектурном отношении не вполне ясно; его также понимают как опоясывающий уступ, галерею или отступ стены.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально еврейская фраза крайне сжата: «нижняя поднимется к верхней, к средней». По смыслу речь идёт о подъёме с нижнего уровня на верхний через средний.'
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: וְרָחֲבָה
  choice: становились шире
  rationale: Передаёт результативно-стативное значение формы от רחב и постепенное увеличение ширины боковых помещений на верхних уровнях.
- source_word: וְנָסְבָה
  choice: огибая храм
  rationale: Сохраняет значение кругового расположения от סבב и естественно связывает его с восходящим расположением помещений.
- source_word: לְמַעְלָה לְמַעְלָה
  choice: всё выше и выше
  rationale: Передаёт повтор наречия и подчёркнутое им постепенное движение вверх естественным современным русским оборотом.
- source_word: לַצְּלָעוֹת
  choice: боковые помещения
  rationale: В храмовом архитектурном контексте צלעות обозначает примыкающие к главному зданию боковые помещения или пристройки, а не буквальные «рёбра».
- source_word: כִּי מוּסַב הַבַּיִת
  choice: потому что окружавшая храм конструкция
  rationale: מוּסַב — трудный архитектурный термин от סבב. Нейтральное «окружавшая ... конструкция» сохраняет идею опоясывающего устройства, не уточняя без достаточных оснований, был ли это уступ, галерея или выступ стены.
- source_word: סָבִיב סָבִיב לַבַּיִת
  choice: по всей его окружности
  rationale: Естественно передаёт усиленное повтором סביב значение полного охвата храма.
- source_word: עַל כֵּן רֹחַב לַבַּיִת לְמָעְלָה
  choice: Поэтому кверху храм становился шире
  rationale: Эллиптическая фраза выражает увеличение доступной ширины на верхних уровнях; глагол «становился» делает подразумеваемую динамику явной без изменения смысла.
- source_word: וְכֵן הַתַּחְתּוֹנָה יַעֲלֶה עַל הָעֶלְיוֹנָה לַתִּיכוֹנָה
  choice: и с нижнего яруса поднимались на верхний через средний
  rationale: Сжатая и синтаксически трудная фраза описывает подъём между тремя уровнями. Неопределённо-личная форма не вводит отсутствующего в еврейском тексте конкретного субъекта.
- source_word: הַבַּיִת
  choice: храм
  rationale: В контексте видения Иезекииля «дом» означает храмовое здание; «храм» ясно передаёт референт современному читателю.
