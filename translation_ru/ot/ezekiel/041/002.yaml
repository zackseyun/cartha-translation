base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/002.yaml
  text: 'And the width of the entrance was ten cubits[a], and the sidewalls of the entrance were five cubits on this side and five cubits on that side. Then he measured its length: forty cubits, and the width: twenty cubits.'
translation:
  language: ru
  text: 'Ширина входа была десять локтей, а боковые части входа[a] — по пять локтей с одной и с другой стороны. Затем он измерил его длину: сорок локтей, а ширину — двадцать локтей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плечи входа»; то есть боковые участки по обе стороны входа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  choice: ширина
  rationale: Обычный и естественный архитектурный термин для обозначения поперечного размера.
- source_word: הַפֶּתַח
  choice: вход
  rationale: Передаёт архитектурный проём, не сужая значение до самой двери или дверного полотна.
- source_word: עֶשֶׂר אַמּוֹת
  choice: десять локтей
  rationale: Сохраняет древнюю единицу измерения и соответствует лаконичной форме еврейского текста.
- source_word: כִתְפוֹת
  choice: боковые части
  rationale: Буквально «плечи»; в данном архитектурном контексте это участки по сторонам входа. Выражение понятно современному читателю и не вводит чрезмерно узкого технического толкования.
- source_word: מִפּוֹ ... מִפּוֹ
  choice: с одной и с другой стороны
  rationale: Естественно передаёт парное расположение боковых частей по обе стороны входа.
- source_word: וַיָּמָד
  choice: Затем он измерил
  rationale: Передаёт продвижение повествования и последовательность измерений.
- source_word: אָרְכּוֹ
  choice: его длину
  rationale: Сохраняет местоименную форму оригинала и не устраняет возможную неоднозначность того, к какому помещению или сооружению она относится.
- source_word: אַרְבָּעִים אַמָּה
  choice: сорок локтей
  rationale: Прямая передача указанного размера с сохранением исходной единицы измерения.
- source_word: וְרֹחַב עֶשְׂרִים אַמָּה
  choice: а ширину — двадцать локтей
  rationale: Естественно воспроизводит эллиптическую измерительную формулу еврейского текста.
