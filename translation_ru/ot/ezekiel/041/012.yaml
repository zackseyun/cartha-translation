  text: וְ/הַ/בִּנְיָ֡ן אֲשֶׁר֩ אֶל פְּנֵ֨י הַ/גִּזְרָ֜ה פְּאַ֣ת דֶּֽרֶךְ הַ/יָּ֗ם רֹ֚חַב שִׁבְעִ֣ים אַמָּ֔ה וְ/קִ֧יר הַ/בִּנְיָ֛ן חָֽמֵשׁ אַמּ֥וֹת רֹ֖חַב סָבִ֣יב סָבִ֑יב וְ/אָרְכּ֖/וֹ תִּשְׁעִ֥ים אַמָּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/012.yaml
  text: And the building that faced the separate area on the side toward the west was seventy cubits wide[a], and the wall of the building was five cubits wide all around, and its length was ninety cubits.
translation:
  language: ru
  text: А здание, находившееся напротив отделённого участка с западной стороны[a], было шириной в семьдесят локтей; стена здания была толщиной в пять локтей со всех сторон, а длина здания составляла девяносто локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со стороны пути моря», то есть с западной стороны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּנְיָן
  choice: здание
  rationale: בִּנְיָן обозначает сооружённое здание; это естественный и точный термин для архитектурного описания.
- source_word: אֲשֶׁר אֶל־פְּנֵי הַגִּזְרָה
  choice: находившееся напротив отделённого участка
  rationale: אֶל־פְּנֵי выражает пространственное положение перед чем-либо или напротив него; «напротив» ясно передаёт взаимное расположение. הַגִּזְרָה здесь означает выделенную, отделённую часть храмового комплекса.
- source_word: פְּאַת דֶּרֶךְ הַיָּם
  choice: с западной стороны
  rationale: Буквально выражение указывает на сторону «в направлении моря»; в географии земли Израиля море обозначает Средиземное море и, следовательно, запад. Буквальный образ сохранён в сноске.
- source_word: רֹחַב שִׁבְעִים אַמָּה
  choice: было шириной в семьдесят локтей
  rationale: רֹחַב обозначает ширину; русская именная конструкция естественно передаёт данное измерение.
- source_word: קִיר הַבִּנְיָן חָמֵשׁ אַמּוֹת רֹחַב
  choice: стена здания была толщиной в пять локтей
  rationale: Хотя רֹחַב буквально означает ширину, применительно к стене современное русское «толщиной» точнее и естественнее выражает измеряемый параметр.
- source_word: סָבִיב סָבִיב
  choice: со всех сторон
  rationale: Повтор наречия усиливает значение полного охвата; «со всех сторон» передаёт этот смысл без тяжеловесного буквального повтора.
- source_word: וְאָרְכּוֹ תִּשְׁעִים אַמָּה
  choice: а длина здания составляла девяносто локтей
  rationale: Суффикс мужского рода может относиться к зданию; явное повторение слова «здания» устраняет неясную русскую местоименную отсылку, не меняя смысла.
