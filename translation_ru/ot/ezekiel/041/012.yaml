translation_notes:
  register: Современный литературный русский язык с dignified архитектурной лексикой. Сохранена последовательность трёх измерений; «локоть» оставлен как исходная древняя мера без пересчёта. Причастный оборот выбран для точной пространственной связи, а сноска сохраняет древнееврейский географический образ.
