base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/004.yaml
  text: 'Then he measured its length: twenty cubits[a], and the width: twenty cubits, before the nave; and he said to me, “This is the Most Holy Place.”'
translation:
  language: ru
  text: 'Он измерил длину комнаты — двадцать локтей, и ширину — двадцать локтей, перед храмовым залом. И сказал мне: «Это Святое святых»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть самое святое место.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: И измерил он
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» естественно сохраняет связность русского библейского рассказа.
- source_word: אָרְכּוֹ
  choice: длину комнаты
  rationale: Местоименный суффикс относится к измеряемому внутреннему помещению; явное «комнаты» устраняет неясность рода, неизбежную при буквальном русском «его длину».
- source_word: עֶשְׂרִים אַמָּה
  choice: двадцать локтей
  rationale: «Локоть» — общепринятое русское наименование древней линейной меры; древняя единица сохранена без пересчёта.
- source_word: וְרֹחַב
  choice: и ширину
  rationale: רֹחַב обозначает ширину; принадлежность той же комнате ясна из параллельной конструкции.
- source_word: אֶל־פְּנֵי הַהֵיכָל
  choice: со стороны храмового зала
  rationale: Фраза описывает пространственное положение измеряемого помещения относительно הֵיכָל. «Со стороны» сохраняет направленность выражения и не утверждает ошибочно, будто внутреннее помещение находилось снаружи перед залом.
- source_word: וַיֹּאמֶר אֵלַי
  choice: И сказал мне
  rationale: Прямой и естественный перевод стандартной повествовательной формулы.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  rationale: Традиционное и по-прежнему понятное русское соответствие еврейской усилительной конструкции, обозначающей самое святое внутреннее помещение.
theological_decisions:
- issue: Передача названия קֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  alternative: самое святое место
  rationale: Традиционная формула близко воспроизводит еврейскую конструкцию, сохраняет межтекстовые связи и остаётся понятной современному русскому читателю; смысловой вариант дан в примечании.
- issue: Пространственная связь внутреннего помещения с הֵיכָל
  choice: со стороны храмового зала
  alternative: перед храмовым залом
  rationale: Контекст описывает внутреннее помещение за основным залом. Перевод сохраняет возможную направительную силу אֶל־פְּנֵי, не создавая пространственного противоречия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксический параллелизм измерений сохранён; специализированное «неф» не используется, а הֵיכָל передано понятным выражением «храмовый зал».
