lexical_decisions:
- source_word: וַעֲשׂוּיָה אֲלֵיהֶן
  choice: на них были сделаны
  rationale: Широкое значение пассивной формы от עשה сохранено без излишнего уточнения техники исполнения; по-русски сказуемое согласовано с перечисленными изображениями.
- source_word: דַּלְתוֹת הַהֵיכָל
  choice: двери храмового зала
  rationale: הֵיכָל в данном архитектурном контексте обозначает главное помещение храмового здания, а не весь храмовый комплекс.
- source_word: כְּרוּבִים וְתִמֹרִים
  choice: херувимы и пальмы
  rationale: Переданы традиционное наименование небесных существ и прямое обозначение пальмовых изображений; декоративный характер ясен из контекста.
- source_word: כַּאֲשֶׁר עֲשׂוּיִם לַקִּירוֹת
  choice: такие же, как на стенах
  rationale: Естественно передаёт явное сопоставление дверных изображений с ранее описанным убранством стен.
- source_word: וְעָב עֵץ
  choice: деревянный навес
  rationale: עָב — неясный архитектурный термин; «навес» правдоподобно обозначает выступающую деревянную конструкцию, но неопределённость отмечена в сноске.
- source_word: אֶל פְּנֵי הָאוּלָם מֵהַחוּץ
  choice: перед фасадом притвора снаружи
  rationale: Передаёт пространственное положение конструкции у передней, наружной стороны притвора, сохраняя отдельное значение מֵהַחוּץ.
