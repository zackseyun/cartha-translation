  text: And the doorway of the side chamber was toward the free space[a], one doorway toward the north and one doorway toward the south; and the width of the free space was five cubits all around.
translation:
  language: ru
  text: 'И вход в боковую комнату выходил к свободному пространству[a]: один вход — с северной стороны, а другой — с южной. Свободное пространство было шириной в пять локтей со всех сторон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к открытому пространству», «к незастроенному участку». Еврейское מֻנָּח обозначает оставленное свободным пространство вокруг строения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶתַח
  choice: вход
  rationale: В архитектурном описании «вход» естественно передаёт конкретный проём и позволяет избежать тяжеловесного «дверной проём».
- source_word: הַצֵּלָע
  choice: боковая комната
  rationale: В описании храма צֵלָע обозначает примыкающее боковое помещение; «комната» понятно современному читателю и сохраняет архитектурный смысл.
- source_word: לַמֻּנָּח
  choice: к свободному пространству
  rationale: Форма от נוח здесь указывает на оставленную незастроенной полосу вокруг здания, а не на место отдыха.
- source_word: דֶּרֶךְ הַצָּפוֹן / לַדָּרוֹם
  choice: с северной стороны / с южной
  rationale: Передаёт направленность и расположение двух входов естественным русским языком, сохраняя параллелизм.
- source_word: רֹחַב
  choice: ширина
  rationale: Обычный русский термин для горизонтального размера в архитектурном описании.
- source_word: מְקוֹם הַמֻּנָּח
  choice: свободное пространство
  rationale: Передаёт участок, оставленный открытым вокруг строения, без неуместного религиозного оттенка «места покоя».
- source_word: חָמֵשׁ אַמּוֹת
  choice: пять локтей
  rationale: Сохранена древняя единица длины, традиционная и точная для храмовых размеров.
- source_word: סָבִיב סָבִיב
  choice: со всех сторон
  rationale: Естественно выражает усиленное древнееврейское указание на пространство вокруг всего строения.
