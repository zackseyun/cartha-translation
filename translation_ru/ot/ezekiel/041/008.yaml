  source_fidelity: 'Начальная часть черновика неверно связывает возвышение с храмом как с субъектом: «храм стоял на возвышении, окружавшем его» превращает גֹּבַהּ סָבִיב סָבִיב в отдельное возвышение, окружающее здание. В еврейском тексте говорится о возвышении/приподнятом основании у здания со всех сторон. Множественное מִיסְדוֹת следует передать множественным числом («основания»).'
  naturalness: «Основание ... составляло полную мерную трость» при множественном исходном слове и «до уступа» звучит синтаксически неудачно. Перестройка делает фразу яснее, сохраняя техническую лаконичность исходника.
  terminology: «Храм», «боковые помещения», «мерная трость» и «локти» уместны. «Уступ» допустимо передаёт выбранное осторожное понимание אַצִּילָה; сноска надлежащим образом сохраняет иные возможности.
