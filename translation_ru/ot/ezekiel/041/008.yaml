lexical_decisions:
- source_word: וְרָאִיתִי
  choice: И я увидел
  rationale: Форма Qal, перфект 1-го лица единственного числа от ראה; передаёт непосредственное наблюдение пророка и сохраняет повествовательную связь.
- source_word: לַבַּיִת
  choice: храм
  rationale: Буквально «дом», но в данном архитектурном контексте речь идёт о храмовом здании; «храм» естественно и однозначно для современного русского читателя.
- source_word: גֹּבַהּ סָבִיב סָבִיב
  choice: стоял на возвышении, окружавшем его со всех сторон
  rationale: גֹּבַהּ буквально означает «высота, возвышение». Контекст оснований указывает на приподнятое основание здания; формулировка передаёт архитектурный смысл, не уточняя его конструкцию сверх текста. Удвоенное סָבִיב передано как «со всех сторон».
- source_word: מיסדות הַצְּלָעוֹת
  choice: основание боковых помещений
  rationale: Множественная форма, обозначающая фундаментные конструкции, по-русски естественно передаётся собирательным «основание». צְלָעוֹת в храмовом контексте обозначает примыкающие боковые помещения.
- source_word: מְלֹא הַקָּנֶה
  choice: полную мерную трость
  rationale: מְלֹא указывает на полную меру, а קָנֶה — на мерную трость. Добавление «мерную» устраняет возможное понимание слова как названия растения.
- source_word: שֵׁשׁ אַמּוֹת
  choice: шесть локтей
  rationale: Аппозиционно поясняет длину полной мерной трости.
- source_word: אַצִּילָה
  choice: до уступа
  rationale: Редкий и архитектурно неясный термин. «Уступ» правдоподобно передаёт возможную ступень или смещение основания, а неопределённость и другие варианты сохранены в сноске.
