base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/016.yaml
  text: the thresholds[a], the recessed windows, and the galleries all around on their three sides, opposite the threshold, were paneled with wood all around, from the floor up to the windows[c][b]; and the windows were covered.
translation:
  language: ru
  text: Пороги[a], углублённые окна[b] и галереи[c] вокруг, на трёх сторонах[d], напротив порога были повсюду обшиты деревом[e] — от пола до окон; а окна были покрыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дверные основания» либо «нижние части дверных проёмов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «закрытые окна», «окна со ставнями» либо «решётчатые окна»; вероятно, еврейское выражение обозначает постоянный тип оконной конструкции, а не то, что окна были временно закрыты.'
    reason: lexical_alternative
  - marker: c
    text: Редкое еврейское слово может также обозначать выступы, колоннады или верхние переходы.
    reason: lexical_alternative
  - marker: d
    text: 'Возможно: «вокруг на всех трёх ярусах».'
    reason: textual_ambiguity
  - marker: e
    text: 'Буквально также возможно: «деревянная облицовка» или «деревянная обшивка»; соответствующее еврейское слово встречается редко.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים / הַסַּף
  choice: пороги / порога
  rationale: Сַף обозначает порог, основание дверного проёма или связанную с ним конструктивную часть. «Порог» конкретен, естественен по-русски и сохраняет повтор одного еврейского слова.
- source_word: הַחַלּוֹנִים הָאֲטֻמוֹת
  choice: углублённые окна
  rationale: אֲטֻמוֹת буквально связано со значением «закрытые, запертые», но в описании храма, вероятно, обозначает постоянный тип оконной конструкции. «Углублённые» передаёт вероятный архитектурный смысл, а буквальные и иные варианты вынесены в примечание.
- source_word: הָאַתִּיקִים
  choice: галереи
  rationale: Редкий архитектурный термин, точное значение которого неясно. «Галереи» уместны в описании храмового здания, но неопределённость сохранена в примечании.
- source_word: סָבִיב לִשְׁלָשְׁתָּם
  choice: кругом, по всем трём сторонам
  rationale: Фраза, вероятнее всего, описывает расположение упомянутых частей здания по трём сторонам. Возможное понимание как трёх ярусов отмечено в примечании.
- source_word: נֶגֶד הַסַּף
  choice: напротив порога
  rationale: נֶגֶד выражает пространственное отношение «перед, напротив»; выбран прямой и естественный архитектурный оборот.
- source_word: שְׂחִיף עֵץ
  choice: были повсюду обшиты деревом
  rationale: Редкое שְׂחִיף, по-видимому, означает покрытие, облицовку или обшивку. Глагольная формулировка ясно передаёт смысл деревянной отделки.
- source_word: וְהָאָרֶץ עַד הַחַלּוֹנוֹת
  choice: от пола до окон
  rationale: Хотя אֶרֶץ обычно означает «земля», внутри здания оно указывает на нижнюю поверхность, то есть пол; עַד задаёт верхнюю границу обшивки.
- source_word: וְהַחַלּוֹנוֹת מְכֻסּוֹת
  choice: а окна были закрыты
  rationale: מְכֻסּוֹת буквально означает «покрыты, закрыты». Поскольку вид покрытия не указан, перевод не уточняет его материал или устройство.
