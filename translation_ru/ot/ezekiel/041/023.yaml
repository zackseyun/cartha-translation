  yaml_path: translation/ot/ezekiel/041/023.yaml
  text: And the nave and the sanctuary each had two doors[a].
translation:
  language: ru
  text: В храмовый зал и святилище[a] вели две двери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В главный зал и Святое место вели две двери».'
    reason: Лексическая альтернатива для названий двух частей храмового здания.
lexical_decisions:
- source_word: וּ/שְׁתַּיִם
  choice: по две
  rationale: 'Женская форма числительного согласуется с существительным «двери»; частица «по» естественно передаёт распределительный смысл: две двери у каждого из двух помещений.'
- source_word: דְּלָתוֹת
  choice: двери
  rationale: Прямое соответствие множественному числу; варианты «дверные створки» и «двустворчатые двери» были бы более истолковывающими, чем исходный текст.
- source_word: הֵיכָל
  choice: храмовый зал
  rationale: В описании храма слово обозначает главный зал храмового здания, отличный от внутреннего священного помещения. «Храмовый зал» ясно и естественно передаёт архитектурный смысл.
- source_word: קֹּדֶשׁ
  choice: святилище
  rationale: Здесь слово обозначает священное внутреннее помещение, сопоставленное с храмовым залом. «Святилище» сохраняет сакральный смысл, не навязывая чрезмерно узкого технического термина.
- source_word: לַ/הֵיכָל וְ/לַ/קֹּדֶשׁ
  choice: и у храмового зала, и у святилища было
  rationale: В еврейском тексте нет выраженного глагола. Русская конструкция с «было» естественно восполняет подразумеваемое наличие, а повтор «и у …, и у …» вместе с «по две» передаёт отнесённость двух дверей к каждому помещению.
