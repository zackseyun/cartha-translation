  text: 'And the doors had two leaves each[a], two turning leaves: two leaves for the one door and two leaves for the other.'
translation:
  language: ru
  text: 'У каждой двери было по две створки[a], две поворотные створки: две створки у одной двери и две — у другой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по две вращающиеся створки»; возможно также: «по две складные створки». Еврейское слово указывает, что створки поворачивались, но не уточняет устройство механизма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּלָתוֹת / דֶּלֶת
  choice: двери / дверь / створки
  rationale: 'В данном архитектурном описании существительное обозначает как дверь в целом, так и её подвижную часть. Различение «дверей» и «створок» ясно передаёт устройство: каждая из двух дверей состояла из двух подвижных частей.'
- source_word: מוּסַבּוֹת
  choice: поворотные
  rationale: Форма описывает створки как поворачивающиеся, но не уточняет их механизм. «Поворотные» сохраняет пространственный смысл и не утверждает однозначно, были ли они распашными, вращались на цапфах или складывались.
- source_word: שְׁתַּיִם ... שְׁתַּיִם ... שְׁתַּיִם ... וּשְׁתֵּי
  choice: по две ... две ... две ... две
  rationale: Повтор числительного сохранён в соответствии с размеренным архитектурным стилем еврейского текста; конструкция «по две» естественно выражает распределение створок между дверями.
- source_word: לַדְּלָתוֹת
  choice: у каждой двери было
  rationale: Предлог ל передан идиоматически как указание на принадлежность; добавленное «каждой» ясно выражает последующее распределение двух створок на одну и другую дверь.
- source_word: לְדֶלֶת אֶחָת ... לָאַחֶרֶת
  choice: у одной двери ... у другой
  rationale: Единственное число с «одной» и «другой» естественно относится к двум ранее названным дверям и сохраняет распределительный смысл.
