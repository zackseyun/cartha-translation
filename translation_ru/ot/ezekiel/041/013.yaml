lexical_decisions:
- source_word: וּמָדַד
  choice: И измерил он
  rationale: Союз ו продолжает последовательность действий; русский порядок слов сохраняет повествовательное движение и естественно связывает стих с предыдущим контекстом.
- source_word: הַבַּיִת
  choice: храм
  rationale: В контексте видения Иезекииля слово обозначает храмовое сооружение, а не обычный дом.
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: длина его — сто локтей
  rationale: Передаёт древнееврейскую именную конструкцию ясно и близко к форме источника, сохраняя древнюю меру длины.
- source_word: הַגִּזְרָה
  choice: отделённое место
  rationale: Слово обозначает выделенный, обособленный участок храмового комплекса; такой перевод сохраняет предметную неопределённость термина.
- source_word: הַבִּנְיָה
  choice: здание
  rationale: Прямое и естественное обозначение построенного сооружения в архитектурном контексте.
- source_word: קִירוֹתֶיהָ
  choice: его стены
  rationale: Местоименная форма женского рода отсылает к ближайшему существительному женского рода הַבִּנְיָה; в русском у слова «здание» средний род, поэтому употреблено «его».
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: длиной сто локтей
  rationale: Кратко передаёт повторённую меру без добавления отсутствующего в источнике слова «также».
