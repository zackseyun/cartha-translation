base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/022.yaml
  text: The altar was of wood[a], three cubits high and two cubits long; its corners, its length, and its sides were of wood. And he said to me, “This is the table that is before Yahweh.”
translation:
  language: ru
  text: 'Жертвенник был из дерева[a], высотой в три локтя и длиной в два локтя; его углы, длина и стенки были из дерева. И он сказал мне: «Это стол, который стоит перед Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте предмет сначала назван «жертвенником», а затем — «столом».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычное значение существительного — «жертвенник». Последующее обозначение предмета как стола сохранено отдельно, без гармонизации.
- source_word: עֵץ
  choice: деревянный / деревянными
  rationale: Передаёт материал предмета естественным современным русским выражением.
- source_word: שָׁלוֹשׁ אַמּוֹת גָּבֹהַּ
  choice: высотой в три локтя
  rationale: Ясная и привычная русская формулировка размера.
- source_word: וְאָרְכּוֹ שְׁתַּיִם אַמּוֹת
  choice: длиной в два локтя
  rationale: Сохраняет явно указанное измерение и естественно сочетается с обозначением высоты.
- source_word: וּמִקְצֹעוֹתָיו לוֹ
  choice: его углы
  rationale: מִקְצֹעוֹת обозначает углы или угловые части; идиоматическое לוֹ не воспроизводится отдельно.
- source_word: וְקִירֹתָיו
  choice: его стенки
  rationale: Сохраняет предметное значение «стены», но уменьшительная форма естественна для частей небольшого деревянного предмета и точнее здесь, чем «боковые стороны».
- source_word: וַיְדַבֵּר אֵלַי
  choice: И он сказал мне
  rationale: Естественная русская формула введения прямой речи.
- source_word: זֶה הַשֻּׁלְחָן
  choice: Это стол
  rationale: Сохраняет переход исходного текста от «жертвенника» к «столу», не устраняя смысловое напряжение.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Передаёт пространственно-культовое выражение и непосредственно воспроизводит личное имя Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; форма «Яхве» сохраняет личное заветное имя.
- issue: Соотношение обозначений «жертвенник» и «стол»
  choice: Сохранить оба обозначения
  alternative: Унифицировать как «жертвенник», «стол» или «жертвенник-стол»
  rationale: Еврейский текст намеренно употребляет сначала מִזְבֵּחַ, а затем שֻׁלְחָן. Перевод сохраняет эту неоднозначность и возможное совмещение функций.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Размеры переданы в локтях; синтаксис сделан естественным, а исходное различие между жертвенником и столом сохранено.
