  text: וְ/רֹחַב֩ פְּנֵ֨י הַ/בַּ֧יִת וְ/הַ/גִּזְרָ֛ה לַ/קָּדִ֖ים מֵאָ֥ה אַמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/014.yaml
  text: And the width of the front of the temple and of the separate area toward the east was a hundred cubits[a][b][c].
translation:
  language: ru
  text: Ширина передней стороны храма[a] и отделённого участка[b] к востоку[c] составляла сто локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дома»; здесь имеется в виду здание храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обособленного места». Значение редкого еврейского термина связано с отделённой частью храмовой территории.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на восточной стороне»; возможен также перевод «в восточном направлении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  choice: ширина
  rationale: Существительное обозначает поперечный размер; «ширина» естественно звучит в архитектурном описании.
- source_word: פְּנֵי
  choice: передняя сторона
  rationale: Буквально «лицо»; в пространственно-архитектурном контексте речь идёт о передней стороне объекта.
- source_word: הַבַּיִת
  choice: храм
  rationale: Буквально «дом», но в данном видении это здание храма; контекстуальный перевод устраняет ненужную неясность.
- source_word: הַגִּזְרָה
  choice: отделённый участок
  rationale: Редкое обозначение особо выделенной части храмовой территории. Перевод сохраняет идею отделённости, не уточняя её назначение сверх текста.
- source_word: לַקָּדִים
  choice: к востоку
  rationale: Передаёт направление или восточную ориентацию, не сводя выражение однозначно к значению «на восточной стороне».
- source_word: מֵאָה אַמָּה
  choice: сто локтей
  rationale: Сохранена древняя мера длины без приблизительного пересчёта в современные единицы.
