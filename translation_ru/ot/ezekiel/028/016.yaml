base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/016.yaml
  text: By the abundance of your trade[a], your midst was filled with violence, and you sinned; so I cast you as profane from the mountain of God, and I destroyed you, O guardian cherub[c][b], from the midst of the stones of fire.
translation:
  language: ru
  text: Из-за обилия твоей торговли[a] среди тебя стало много насилия, и ты согрешил. Поэтому Я изгнал тебя как осквернённого[b] с горы Божьей и погубил тебя, о херувим-хранитель[c], из среды огненных камней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за множества твоих торговых дел»; еврейское слово может означать торговлю, коммерцию или торговый оборот, иногда с оттенком посреднической торговли.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я лишил тебя святости с горы Божьей». Еврейский глагол означает «осквернить», «лишить святости» или «обращаться как с несвятым»; в сочетании с «с горы» он, вероятно, подразумевает изгнание из священного места.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «осеняющий херувим». Еврейское причастие буквально означает «покрывающий», «осеняющий» или «укрывающий» и здесь, по-видимому, указывает на защитную функцию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב רְכֻלָּתְךָ
  choice: Из-за обилия твоей торговли
  rationale: Предлог בְּ с רֹב здесь естественно передаёт причину или сопутствующее обстоятельство. «Торговля» сохраняет широкий смысл רְכֻלָּה и не сужает его до заведомо незаконного оборота.
- source_word: מָל֧וּ תוֹכְךָ חָמָס
  choice: внутри тебя стало полно насилия
  rationale: Форма מָל֧וּ морфологически стоит в 3-м лице множественного числа, но субъект не назван; безличная русская конструкция передаёт результат, не вводя вымышленного деятеля. חָמָס переведено прямым соответствием «насилие».
- source_word: וַתֶּחֱטָא
  choice: и ты согрешил
  rationale: Прямо передаёт личную ответственность адресата и последовательность еврейской фразы.
- source_word: וָאֶחַלֶּלְךָ מֵהַר אֱלֹהִים
  choice: Я изгнал тебя как осквернённого с горы Божьей
  rationale: Порода пиэль глагола חלל выражает лишение священного статуса, осквернение или обращение как с несвятым; сочетание с מִן указывает на удаление из священного места. Формулировка передаёт оба аспекта без утраты культового смысла.
- source_word: וָאַבֶּדְךָ
  choice: погубил тебя
  rationale: Передаёт каузативный смысл אבד — привести к гибели, уничтожить; «погубил» естественно звучит в возвышенной пророческой речи.
- source_word: כְּרוּב הַסֹּכֵךְ
  choice: херувим-хранитель
  rationale: כְּרוּב передано традиционным библейским словом «херувим». Причастие от סכך буквально связано с покрыванием, осенением и защитой; «хранитель» ясно выражает функцию, а буквальный образ сохранён в примечании.
- source_word: מִתּוֹךְ אַבְנֵי אֵשׁ
  choice: из среды огненных камней
  rationale: Сохраняет загадочный образ оригинала и пространственное значение מִתּוֹךְ, не истолковывая природу камней.
theological_decisions:
- issue: 'Личность адресата: земной царь, мифопоэтически изображённый херувим или сверхъестественное существо'
  choice: Сохранено прямое обращение к «херувиму-хранителю» и образное пространство горы Божьей и огненных камней.
  alternative: Истолковать образ только как метафору царя либо прямо отождествить адресата с сатаной.
  rationale: Сам стих называет адресата херувимом, но не даёт прямого отождествления с сатаной и не объясняет соотношение образа с царём Тира. Перевод не должен разрешать этот богословский вопрос за текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя, но сохранены необычные образы «горы Божьей» и «огненных камней». Все местоимения, относящиеся к Богу как говорящему, оформлены по принятой русской библейской традиции с прописной буквы.
