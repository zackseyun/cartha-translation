  text: By your great wisdom in your trade you increased your wealth[c][b][a], and your heart became proud because of your wealth.
translation:
  language: ru
  text: Благодаря своей великой мудрости в торговле ты умножил своё богатство[a], и возгордилось твоё сердце[b] из-за твоего богатства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «имущество», «ресурсы», «силу» или «мощь»; здесь торговый контекст указывает прежде всего на богатство.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоё сердце стало высоким» — древнееврейский образ гордости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב חָכְמָתְךָ
  choice: Великой мудростью
  rationale: Предлог בְּ выражает средство, а רֹב — большую меру. Эта формулировка естественно передаёт смысл «посредством великой мудрости», сохраняя ключевое значение חָכְמָה; в торговом контексте слово также подразумевает практическое умение.
- source_word: בִּרְכֻלָּתְךָ
  choice: в торговле
  rationale: רְכֻלָּה обозначает торговую деятельность, особенно характерную для описания Тира у Иезекииля. «В торговле» — ясное и современное соответствие.
- source_word: הִרְבִּיתָ
  choice: ты умножил
  rationale: Порода hифиль глагола רבה означает «сделать многочисленным, увеличить». «Умножил» сохраняет образ исходного выражения и естественно сочетается с богатством.
- source_word: חֵילֶךָ
  choice: своё богатство / твоего богатства
  rationale: חַיִל может означать богатство, имущество, ресурсы, силу или мощь. Коммерческий контекст Тира прежде всего указывает на богатство; одинаковый перевод обоих употреблений сохраняет словесную связь стиха.
- source_word: וַיִּגְבַּהּ לְבָבְךָ
  choice: и возгордилось твоё сердце
  rationale: Буквальный образ «сердце стало высоким» является древнееврейской идиомой гордости. Русское «возгордилось сердце» ясно передаёт смысл и отчасти сохраняет образ сердца.
- source_word: בְּחֵילֶךָ
  choice: из-за твоего богатства
  rationale: Предлог בְּ здесь естественно понимать как указание на причину или повод гордости.
theological_decisions:
- issue: 'Более широкое значение חַיִל: богатство или сила/мощь'
  choice: богатство
  alternative: сила, мощь, ресурсы, состояние
  rationale: В ближайшем контексте речь идёт о торговой деятельности Тира, поэтому «богатство» наиболее уместно. Смысловой диапазон слова сохранён в примечании, чтобы не исключать оттенка силы или ресурсов.
- issue: Буквальная или идиоматическая передача возвышения сердца
  choice: возгордилось твоё сердце
  alternative: твоё сердце возвысилось
  rationale: Выбранная формулировка понятна современному читателю, передаёт значение идиомы и сохраняет библейский образ сердца без искусственного разъяснения в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к структуре еврейского текста, но остаётся естественным; коммерческая лексика понятна широкому кругу читателей.
