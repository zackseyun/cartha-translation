  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/קַבְּצִ֣/י אֶת בֵּ֣ית יִשְׂרָאֵ֗ל מִן הָֽ/עַמִּים֙ אֲשֶׁ֣ר נָפֹ֣צוּ בָ֔/ם וְ/נִקְדַּ֥שְׁתִּי בָ֖/ם לְ/עֵינֵ֣י הַ/גּוֹיִ֑ם וְ/יָֽשְׁבוּ֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לְ/עַבְדִּ֥/י לְ/יַעֲקֹֽב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/025.yaml
  text: 'Thus says the Lord GOD: When I gather the house of Israel from the peoples among whom they were scattered[a], and I show myself holy among them in the sight of the nations, then they will dwell on their own land that I gave to my servant Jacob.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Когда Я соберу дом Израиля из народов, среди которых они были рассеяны, и явлю Себя святым среди них перед глазами народов[a], тогда они будут жить на своей земле, которую Я дал Моему слуге Иакову».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «и буду освящён среди них»; возможно также: «и явлю через них Свою святость перед глазами народов».'
    reason: 'Сохраняется неоднозначность формы נִקְדַּשְׁתִּי и предлога בָם: выражение может означать явление Божьей святости среди Израиля либо через Израиль.'
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента титула: אֲדֹנָי как «Владыка», а личное заветное имя יהוה — как «Яхве», избегая неестественного сочетания «Господь Господь».'
- source_word: בְּקַבְּצִי
  choice: Когда Я соберу
  rationale: Предлог ב при инфинитиве с суффиксом первого лица имеет здесь временное значение.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет корпоративное заветное выражение оригинала и естественно звучит в русском библейском регистре.
- source_word: מִן הָעַמִּים אֲשֶׁר נָפֹצוּ בָם
  choice: из народов, среди которых они были рассеяны
  rationale: Нифаль נָפֹצוּ передан страдательной конструкцией; בָם идиоматически выражено как «среди которых».
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: и явлю среди них Свою святость
  rationale: Нифаль קדשׁ при Боге как субъекте обозначает публичное обнаружение или признание Его святости. «Среди них» непосредственно отражает возможное локативное значение בָם, не исключая смысла «через них».
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: перед глазами других народов
  rationale: Сохраняет зрительный и публичный образ еврейской идиомы; «других» естественно отличает наблюдающие народы от уже названного Израиля.
- source_word: וְיָשְׁבוּ עַל אַדְמָתָם
  choice: тогда они будут жить на своей земле
  rationale: Глагол ישׁב в контексте восстановления означает постоянное проживание; «тогда» естественно передаёт итог временно-следственной конструкции.
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: которую Я дал Моему слуге Иакову
  rationale: Сохраняет прямое утверждение о даровании земли и заветное обозначение Иакова как Божьего слуги.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант сохраняет личное имя יהוה и одновременно передаёт אֲדֹנָי отдельным титулом, не смешивая два элемента выражения.
- issue: Смысл וְנִקְדַּשְׁתִּי בָם
  choice: явлю среди них Свою святость
  alternative: освящусь в них; явлю через них Свою святость
  rationale: Формулировка показывает публичное обнаружение Божьей святости, а не изменение Бога. Она сохраняет возможное локативное значение בָם; инструментальное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены выражение «дом Израиля», публичный образ «перед глазами» и заветное имя Яхве; синтаксис упрощён лишь настолько, чтобы стих был понятен обычному современному читателю.
