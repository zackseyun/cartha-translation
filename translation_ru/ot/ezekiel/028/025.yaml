  source_fidelity: 'Основная передача верна: временная конструкция «Когда Я соберу», «дом Израиля», рассеяние среди народов, публичное явление Божьей святости и возвращение к жительству на данной Иакову земле соответствуют еврейскому тексту. Однако «других народов» добавляет определение, которого в הַגּוֹיִם нет; достаточно «народов». Формулировка «явлю Себя святым среди них» точнее передаёт נִקְדַּשְׁתִּי, сохраняя смысл публичного проявления святости без утверждения, что Бог приобретает святость.'
