base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/023.yaml
  text: And I will send pestilence into her[a], and blood into her streets; the slain will fall in her midst by the sword all around her. Then they will know that I am Yahweh.
translation:
  language: ru
  text: И пошлю на неё мор и кровь на её улицы[a]. И среди неё падут убитые от меча, поражающего её со всех сторон. И узнают, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кровопролитие». Буквально в еврейском тексте: «кровь»; вероятно, имеется в виду насильственное кровопролитие на улицах города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: И пошлю
  rationale: Форма перфекта с союзом в пророческой речи выражает решительное будущее действие Бога; «пошлю» естественно передаёт это значение.
- source_word: דֶּבֶר
  choice: мор
  rationale: В пророческом контексте слово обозначает губительную эпидемию как Божий суд. «Мор» сохраняет библейскую выразительность и остаётся понятным современному читателю.
- source_word: וָדָם
  choice: кровь
  rationale: В еврейском тексте стоит конкретное существительное «кровь», хотя по контексту подразумевается насильственное кровопролитие. Буквальный образ сохранён в основном тексте, а смысловая альтернатива вынесена в сноску.
- source_word: בְּחוּצוֹתֶיהָ
  choice: на улицы её
  rationale: חוּצוֹת обозначает городские улицы или открытые общественные места. Управление глаголом «пошлю» передано направительным оборотом.
- source_word: וְנִפְלַל חָלָל
  choice: И падут … убитые
  rationale: Несмотря на необычную огласовку глагольной формы, сочетание ясно описывает павших жертв. Множественное число по-русски естественно передаёт собирательный образ погибших.
- source_word: בְּתוֹכָהּ
  choice: среди неё
  rationale: Сохранён образ города как лица женского рода и значение происходящего внутри него.
- source_word: בְּחֶרֶב עָלֶיהָ מִסָּבִיב
  choice: мечом, обрушившимся на неё со всех сторон
  rationale: Формулировка передаёт гибель от меча и окружение города нападением со всех сторон, избегая неестественной русской конструкции.
- source_word: וְיָדְעוּ
  choice: И узнают
  rationale: Союз допускает как простое продолжение, так и оттенок результата. «И» сохраняет эту неоднозначность, не усиливая её до явно причинно-следственного «тогда».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и отличает его от титула.
- issue: Связь заключительной формулы с предшествующим судом
  choice: И узнают
  alternative: Тогда узнают
  rationale: Еврейский союз может обозначать и последовательность, и результат. Нейтральное «И» не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «на улицы её» поддерживает параллелизм и образ города как женщины; архаизирующая лексика сведена к понятному в данном контексте слову «мор».
