lexical_decisions:
- source_word: תָּמִים
  choice: непорочен
  rationale: В нравственно-оценочном контексте слово обозначает цельность и безупречность поведения, а не обязательно абсолютное совершенство.
- source_word: בִּדְרָכֶיךָ
  choice: в своих путях
  rationale: Сохраняет еврейский образ, понятный по-русски как образ жизни и поступки.
- source_word: מִיּוֹם הִבָּרְאָךְ
  choice: со дня своего сотворения
  rationale: 'Естественно передаёт временную конструкцию и страдательное значение: адресат был сотворён.'
- source_word: עַד
  choice: пока не
  rationale: В данном русском предложении естественно обозначает границу прежнего состояния и последующую перемену.
- source_word: נִמְצָא
  choice: обнаружилась
  rationale: Сохраняет значение нахождения или выявления и не решает, возникло ли зло тогда или лишь стало явным.
- source_word: עַוְלָתָה
  choice: неправда
  rationale: Передаёт нравственную неправоту и зло достаточно широко, не сужая смысл исключительно до общественной несправедливости.
- source_word: בָּךְ
  choice: в тебе
  rationale: Прямо сохраняет указание на то, что неправда была обнаружена в самом адресате.
theological_decisions:
- issue: Возможное понимание תָּמִים как абсолютного совершенства в богословских толкованиях образа царя Тира
  choice: непорочен
  alternative: совершенен
  rationale: Такой перевод выражает нравственную цельность в путях адресата, не привнося более сильного утверждения об абсолютном совершенстве, которого контекст не требует.
translation_notes:
  register: Современный литературный русский язык с сохранением dignified пророческого звучания. Местоимение «ты» передано со строчной буквы, поскольку текст обращён к царю Тира; формулировка не навязывает иной идентификации адресата.
