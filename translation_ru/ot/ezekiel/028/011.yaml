  text: 'И слово Яхве пришло ко мне:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Вводная пророческая формула естественно передаётся по-русски как «И было… слово», сохраняя формульность и значение еврейского глагола, а не превращая его в более свободное «пришло».
- source_word: דְבַר
  choice: слово
  rationale: В данном пророческом обороте существительное обозначает сообщаемое Богом речевое откровение; «слово» сохраняет устойчивую библейскую формулу и её богословский вес.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени, выраженного тетраграмматоном, сохраняет отличие имени Бога от титула «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно обозначает Иезекииля как получателя Божьего слова и естественно сочетается с русской формулой «было ко мне слово».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском языке эту функцию естественно и полно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, а не титул. «Яхве» передаёт его как имя и не подменяет традиционным титулом; примечание сообщает читателю о еврейском написании и традиционной передаче.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Двоеточие вместо буквального «говоря» естественно вводит содержание речи в следующем стихе.
