lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма וַיְהִי служит обычным повествовательным введением. «И было» естественно сочетается с устойчивой пророческой формулой и не добавляет отсутствующего в еврейском тексте глагола речи.
- source_word: דְבַר
  choice: слово
  rationale: В пророческой формуле דָּבָר означает данное пророку Божье слово или весть; «слово» сохраняет характерную библейскую формулу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно передаёт направление к говорящему и естественно звучит в формуле «было ко мне слово».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив вводит прямую речь. В современном русском языке это естественно передаётся двоеточием; буквальное «говоря» здесь было бы тяжеловесно.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя יְהוָה. Транслитерация сохраняет его как имя; традиционная замена «Господь» отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением торжественной и узнаваемой пророческой формулы. Архаическое «и было слово Господне ко мне, говоря» осовременено без смыслового расширения.
