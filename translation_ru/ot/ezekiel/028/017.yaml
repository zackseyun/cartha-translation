source:
  edition: WLC
  text: גָּבַ֤הּ לִבְּ/ךָ֙ בְּ/יָפְיֶ֔/ךָ שִׁחַ֥תָּ חָכְמָתְ/ךָ֖ עַל יִפְעָתֶ֑/ךָ עַל אֶ֣רֶץ הִשְׁלַכְתִּ֗י/ךָ לִ/פְנֵ֧י מְלָכִ֛ים נְתַתִּ֖י/ךָ לְ/רַ֥אֲוָה בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/017.yaml
  text: Your heart was lifted up because of your beauty[a]; you corrupted your wisdom because of your splendor. I cast you to the earth; I set you before kings[c][b], for them to look at you.
translation:
  language: ru
  text: Сердце твоё возгордилось из-за красоты твоей[a]; ты исказил свою мудрость из-за своего великолепия. Я поверг тебя на землю и поставил перед царями, чтобы они смотрели на тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сердце твоё вознеслось из-за красоты твоей».'
    reason: Еврейское выражение буквально говорит о сердце, ставшем высоким; в данном контексте оно обозначает гордость.
  - marker: b
    text: 'Или: «Я отдал тебя царям на обозрение».'
    reason: Сочетание «поставил перед царями, чтобы они смотрели на тебя» может быть передано как единый образ выставления на обозрение; вариант не уточняет личность адресата.
lexical_decisions:
- source_word: גָּבַהּ לִבְּךָ
  choice: Вознеслось сердце твоё
  rationale: Сохраняет еврейский образ «высокого/вознесённого сердца» и одновременно передаёт подразумеваемую гордость.
- source_word: בְּיָפְיֶךָ
  choice: из-за красоты твоей
  rationale: 'Предлог ב в данном контексте естественно понимать причинно: красота стала причиной превозношения.'
- source_word: שִׁחַתָּ חָכְמָתְךָ
  choice: ты погубил свою мудрость
  rationale: שׁחת обозначает порчу, разрушение или доведение до негодности; «погубил» звучит естественно с дополнением «мудрость» и сохраняет силу высказывания.
- source_word: עַל יִפְעָתֶךָ
  choice: из-за своего великолепия
  rationale: עַל имеет причинное значение, а יִפְעָה указывает на сияющее великолепие или блеск.
- source_word: עַל אֶרֶץ הִשְׁלַכְתִּיךָ
  choice: Я поверг тебя на землю
  rationale: Передаёт направленность к земле и силу глагола השליך в контексте суда.
- source_word: לִפְנֵי מְלָכִים נְתַתִּיךָ
  choice: поставил перед царями
  rationale: Близко передаёт буквальное «дал/поместил тебя перед царями», не добавляя толкования раньше следующей целевой фразы.
- source_word: לְרַאֲוָה בָךְ
  choice: чтобы они смотрели на тебя
  rationale: 'Передаёт цель или результат действия: цари должны увидеть падение адресата; русская конструкция устраняет неестественную буквальность предлога ב.'
theological_decisions:
- issue: К кому обращено пророчество в Иезекииля 28:17
  choice: Сохранено обращение к единственному адресату в возвышенном языке пророческого плача без его дополнительного отождествления.
  alternative: Только земной царь Тира либо земной правитель, образ которого также указывает на сверхъестественного мятежника.
  rationale: Сам стих не разрешает вопрос о возможном дополнительном символическом или типологическом смысле; перевод не должен навязывать такое решение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «сердце твоё» умеренно возвышает стиль, не делая его архаичным; местоимение «ты» написано со строчной буквы, поскольку идентичность адресата не уточняется переводом.
