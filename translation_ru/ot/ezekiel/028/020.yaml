  text: And the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И слово Яхве пришло ко мне[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (тетраграмматон); традиционно передаётся как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: было
  rationale: В устойчивой пророческой формуле русское «было ко мне слово» естественно для библейского повествования и близко передаёт еврейскую конструкцию, не превращая глагол движения в явный там, где его нет.
- source_word: דְבַר
  choice: слово
  rationale: Здесь слово обозначает обращённое к пророку Божье откровение; «слово» сохраняет традиционную пророческую формулу и её богословскую значимость, тогда как «весть» была бы более истолковывающей.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Естественное русское выражение для обозначения Иезекииля как получателя пророческого слова.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив вводит последующую прямую речь; в современном русском эту функцию естественно и без смысловой потери передаёт двоеточие, а буквальное «говоря» звучало бы тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет имя и не подменяет его титулом; примечание сообщает традиционную русскую передачу.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой и dignified пророческой формулы. Двоеточие естественно связывает вводную формулу с речью следующего стиха.
