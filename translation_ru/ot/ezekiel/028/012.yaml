  text: בֶּן אָדָ֕ם שָׂ֥א קִינָ֖ה עַל מֶ֣לֶךְ צ֑וֹר וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אַתָּה֙ חוֹתֵ֣ם תָּכְנִ֔ית מָלֵ֥א חָכְמָ֖ה וּ/כְלִ֥יל יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/012.yaml
  text: 'Son of man[a], raise a lament over the king of Tyre, and say to him, ‘Thus says the Lord GOD: You were the seal of perfection[b], full of wisdom and perfect in beauty.’'
translation:
  language: ru
  text: 'Сын человеческий, подними плач о царе Тира и скажи ему: «Так говорит Владыка Яхве: ты[a] — печать совершенства[b], исполненный мудрости и совершенный в красоте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте нет выраженного глагола-связки; по контексту возможно также: «ты был».'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Еврейское выражение трудно для перевода; дословно, вероятно: «печать образца (меры)». Возможны также понимания: «перстень совершенства» или «тот, кто запечатывает образец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устойчивое обращение к Иезекиилю; традиционная русская формулировка сохраняет еврейский образ и возвышенный пророческий регистр.
- source_word: שָׂא קִינָה
  choice: подними плач
  rationale: Сохраняет образ еврейской идиомы «поднять плач» и при этом остаётся понятным в поэтическом контексте.
- source_word: עַל מֶלֶךְ צֹר
  choice: о царе Тира
  rationale: Предлог при слове «плач» обозначает того, о ком совершается оплакивание; «о» естественно передаёт это отношение по-русски.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יְהוָה и избегает неясного повтора «Господь Господь».
- source_word: חוֹתֵם תָּכְנִית
  choice: печать совершенства
  rationale: 'Передаёт наиболее вероятное понимание трудного сочетания: царь представлен как воплощение или завершающий знак полноты. Лексическая неоднозначность отмечена в сноске.'
- source_word: מָלֵא חָכְמָה
  choice: исполненный мудрости
  rationale: Точное и естественное соответствие, согласованное с мужским адресатом и возвышенным стилем плача.
- source_word: וּכְלִיל יֹפִי
  choice: и совершенный в красоте
  rationale: כְלִיל выражает полноту или завершённость; формулировка сохраняет параллелизм с мудростью и поэтический регистр.
theological_decisions:
- issue: Передача имени יְהוָה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, тогда как «Владыка» различает предшествующий титул אֲדֹנָי.
- issue: Временная отнесённость именной характеристики אַתָּה חוֹתֵם תָּכְנִית
  choice: ты — печать совершенства
  alternative: ты был печатью совершенства
  rationale: В еврейском тексте связка отсутствует. Русская именная конструкция без глагола сохраняет формальную неопределённость настоящего и прошедшего времени; контекст плача допускает понимание в прошедшем времени, что указано в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным пророческо-поэтическим звучанием. Сохранены традиционное обращение «Сын человеческий», образ «поднять плач» и неоднозначность ключевой именной фразы.
