  text: הִנֵּ֥ה חָכָ֛ם אַתָּ֖ה מ/דנאל כָּל סָת֖וּם לֹ֥א עֲמָמֽוּ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/003.yaml
  text: Look[a], you are wiser than Danel; no hidden thing is obscure to you.
translation:
  language: ru
  text: Вот, ты мудрее Данэла[a]; нет ничего сокровенного, что было бы тебе неясно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Данэл»; традиционно — «Даниил». Здесь имя написано без йода, присутствующего в более привычной форме, поэтому основной текст сохраняет форму еврейского написания.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую силу частицы естественным и достойным современным русским выражением.
- source_word: חָכָם ... מ/דנאל
  choice: мудрее Данэла
  rationale: Хотя חָכָם формально означает «мудрый», предлог מ־ при имени выражает сравнение, поэтому по-русски требуется сравнительная степень.
- source_word: דנאל
  choice: Данэл
  rationale: Основной текст сохраняет написание имени без йода, отличающееся от более привычной формы דניאל («Даниил»). Транслитерация «Данэл» также не смешивает данное имя с русской традиционной формой «Даниил».
- source_word: כָּל סָתוּם
  choice: ничто сокровенное
  rationale: 'Передаёт собирательно-отрицательный смысл конструкции: нет ничего закрытого или сокрытого. «Сокровенное» звучит естественно и сохраняет конкретный оттенок исходного выражения.'
- source_word: לֹא עֲמָמוּךָ
  choice: не остаётся для тебя неясным
  rationale: Глагольная форма связана с неясностью или затемнённостью, а не только с сокрытием. Перевод сохраняет различие между тем, что сокровенно, и тем, что непонятно адресату.
theological_decisions:
- issue: Отождествление דנאל с библейским Даниилом
  choice: В основном тексте сохранена форма «Данэл»
  alternative: «Даниил»
  rationale: Еврейское написание здесь отличается от обычной формы имени Даниила. Текст не позволяет бесспорно решить, идёт ли речь о том же лице; поэтому неоднозначность не устраняется, а традиционная идентификация отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая пророческая ирония сохранена. «Вот» передаёт эмфазу без архаизации, а оборот «не остаётся для тебя неясным» сохраняет смысловое различие между сокрытостью и неясностью.
