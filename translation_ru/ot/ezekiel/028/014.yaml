  text: אַ֨תְּ כְּר֔וּב מִמְשַׁ֖ח הַ/סּוֹכֵ֑ךְ וּ/נְתַתִּ֗י/ךָ בְּ/הַ֨ר קֹ֤דֶשׁ אֱלֹהִים֙ הָיִ֔יתָ בְּ/ת֥וֹךְ אַבְנֵי אֵ֖שׁ הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/014.yaml
  text: You were an anointed guardian cherub[a], and I placed you on the holy mountain of God[b]; you walked in the midst of stones of fire.
translation:
  language: ru
  text: Ты[b] был помазанным херувимом-хранителем[a], и Я поместил тебя на святой горе Бога; среди камней огня ты ходил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помазанным херувимом, который осеняет»; традиционно: «помазанным осеняющим херувимом».'
    reason: lexical_alternative
  - marker: b
    text: В древнееврейском тексте местоимение «ты» имеет форму женского рода, тогда как следующие глаголы и местоименные суффиксы стоят в мужском роде; обращение остаётся в единственном числе.
    reason: textual_variant
lexical_decisions:
- source_word: כְּרוּב
  choice: херувим
  rationale: Устоявшееся русское обозначение небесного существа — стража престола; сохраняет конкретный образ, не заменяя его общим словом «ангел».
- source_word: מִמְשַׁח
  choice: помазанный
  rationale: Передаёт связь слова с помазанием и естественно выполняет определительную функцию при слове «херувим».
- source_word: הַסּוֹכֵךְ
  choice: хранитель
  rationale: Корень означает «покрывать, укрывать, осенять»; в образе херувима слово указывает на охраняющую и осеняющую функцию. Более буквальный вариант сохранён в примечании.
- source_word: וּנְתַתִּיךָ
  choice: и Я поместил тебя
  rationale: В данном сочетании с указанием места נתן естественно означает «поместить, поставить».
- source_word: בְּהַר קֹדֶשׁ אֱלֹהִים
  choice: на святой горе Бога
  rationale: Сохраняет конструкцию исходного текста и сакральный образ, не уточняя его сверх сказанного.
- source_word: אַבְנֵי אֵשׁ
  choice: камни огня
  rationale: Намеренно сохраняет необычный и загадочный образ оригинала, не сводя его к более гладкому, но менее точному выражению «огненные камни».
- source_word: הִתְהַלָּכְתָּ
  choice: ты ходил
  rationale: Естественно передаёт hitpael глагола הלך, не добавляя необязательного значения многократного движения взад и вперёд.
- source_word: אַתְּ
  choice: Ты
  rationale: В русском местоимение второго лица не выражает род; необычное сочетание женской формы местоимения с мужскими глагольными формами пояснено в примечании.
theological_decisions:
- issue: К кому относится возвышенный образ херувима в плаче о царе Тира
  choice: Сохранить образ херувима без уточнения, относится ли он только метафорически к царю Тира, к первозданному сверхъестественному существу или имеет двойной смысл.
  alternative: Истолковать образ исключительно как описание земного царя либо прямо отождествить адресата со сверхъестественным существом.
  rationale: Древнееврейский текст использует возвышенную сакральную образность, но сам стих не разрешает её богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Синтаксис ясен для широкого читателя, а необычный образ «камней огня» сохранён намеренно.
