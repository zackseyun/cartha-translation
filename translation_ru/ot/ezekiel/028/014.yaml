  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: помазанного херувима с охраняюще-осеняющей функцией, помещение на святой горе Бога и хождение среди «камней огня». Образ намеренно не истолковывается сверх текста. Пространственное «на святой горе» оправдано для בְּהַר в данном контексте; «среди» естественно передаёт בְּתוֹךְ.'
