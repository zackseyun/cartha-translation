base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/008.yaml
  text: They will bring you down to the pit[c][b][a], and you will die the death of one slain in the heart of the seas.
translation:
  language: ru
  text: Они низведут тебя в яму[a], и ты умрёшь смертью убитого[b] в сердце морей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу» или «в погибель»; буквально: «в яму».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «смертями убитого» — еврейский оборот, означающий насильственную смерть.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «посреди морей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשַּׁחַת
  choice: в яму
  rationale: Слово שַׁחַת может обозначать яму, могилу или гибель. «В яму» сохраняет конкретный образ нисхождения и не придаёт выражению излишне узкого представления о загробном мире.
- source_word: יוֹרִדוּךָ
  choice: низведут тебя
  rationale: Каузативная форма глагола ירד означает «заставят сойти, низведут». «Низведут тебя» передаёт направление вниз и каузативный смысл, не добавляя отсутствующего в тексте оттенка насильственного броска.
- source_word: וָמַתָּה
  choice: и ты умрёшь
  rationale: В пророческом контексте форма выражает предстоящее событие; современное русское будущее время передаёт это прямо и естественно.
- source_word: מְמוֹתֵי חָלָל
  choice: смертью убитого
  rationale: Буквальное множественное число «смертями» входит в еврейский идиоматический оборот и указывает на насильственную смерть. Русское единственное число сохраняет смысл и образ, не делая фразу неестественной.
- source_word: חָלָל
  choice: убитого
  rationale: חָלָל обозначает убитого или смертельно поражённого. «Убитого» понятно современному читателю и сохраняет образ человека, погибшего насильственной смертью.
- source_word: בְּלֵב יַמִּים
  choice: в сердце морей
  rationale: לֵב буквально означает «сердце», а в пространственном употреблении — середину. Буквальный метафорический образ естественен по-русски и поддерживает морскую образность пророчества о Тире.
theological_decisions:
- issue: Следует ли передавать שַׁחַת термином с более определённым учением о загробном мире
  choice: в яму
  alternative: в могилу; в бездну; на погибель
  rationale: Стих говорит о суде и смерти, однако само еврейское слово здесь не требует конкретного представления о загробном мире. «В яму» сохраняет образ и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Глагол «низведут» сохраняет образ движения вниз, а выражение «в сердце морей» — яркую метафору оригинала. Все примечания поставлены непосредственно после соответствующих выражений.
