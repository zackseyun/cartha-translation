base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/009.yaml
  text: Will you still say[a], ‘I am a god,’ before the one who kills you? But you are a man, and not a god[c][b], in the hand of those who wound you.
translation:
  language: ru
  text: 'Неужели ты скажешь[a]: «Я — бог» — перед тем, кто убивает тебя? Но в руках оскверняющих тебя[c] ты человек[b], а не бог.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели ты и вправду будешь говорить?» В еврейском тексте абсолютный инфинитив употреблён вместе с личной формой того же глагола для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человек»; здесь человеческая природа противопоставлена божеству.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «бесчестящих тебя»; возможны также значения «ранящих тебя» или «пронзающих тебя». Еврейское слово допускает оттенок осквернения и унижения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָמֹר תֹּאמַר
  choice: Неужели ты скажешь
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает вопрос. «Неужели» естественно передаёт в русском языке эмфатический, обличительный оттенок без буквального повтора глагола.
- source_word: אֱלֹהִים / אֵל
  choice: бог
  rationale: В обоих случаях речь идёт о притязании тирского правителя на божественность и его опровержении. Строчная буква и именная конструкция «Я — бог» не отождествляют его притязание исключительно с именем Бога Израиля.
- source_word: לִפְנֵי
  choice: перед
  rationale: Сохраняется пространственно-реляционный образ непосредственного столкновения с тем, кто его убивает.
- source_word: הֹרְגֶךָ
  choice: тем, кто убивает тебя
  rationale: Причастная форма передана действующей конструкцией, сохраняющей непосредственность и активный характер действия.
- source_word: אָדָם
  choice: человек
  rationale: Контекст противопоставляет человеческую природу правителя божеству; русское «человек» точно и естественно передаёт это противопоставление.
- source_word: בְּיַד
  choice: в руках
  rationale: Русская идиома во множественном числе естественно выражает нахождение во власти других, сохраняя образ руки из еврейского текста.
- source_word: מְחַלְלֶיךָ
  choice: оскверняющих тебя
  rationale: Форма от חלל здесь может обозначать осквернение, унижение или лишение священного статуса. «Оскверняющих» сохраняет иронию суда над человеком, который объявил себя богом, не сводя смысл только к физическому ранению.
theological_decisions:
- issue: Передача притязания правителя на божественность
  choice: «Я — бог» ... «ты человек, а не бог»
  alternative: «Я — Бог» ... «ты человек, а не Бог»
  rationale: Контекст обличает притязание правителя на божественный статус. Строчная буква сохраняет этот смысл и не вынуждает понимать слова как притязание именно на личное имя или исключительную идентичность Бога Израиля.
- issue: Смысл מְחַלְלֶיךָ
  choice: оскверняющих тебя
  alternative: ранящих тебя; пронзающих тебя; бесчестящих тебя
  rationale: Выбранный вариант сохраняет смысл унижения и десакрализации самозваного «бога», при этом лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Эмфатический вопрос передан естественно, без искусственного повтора; перестановка обстоятельства «в руках…» делает заключительное противопоставление «человек, а не бог» ясным и ударным.
