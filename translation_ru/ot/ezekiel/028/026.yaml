  text: וְ/יָשְׁב֣וּ עָלֶי/הָ֮ לָ/בֶטַח֒ וּ/בָנ֤וּ בָתִּים֙ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/יָשְׁב֖וּ לָ/בֶ֑טַח בַּ/עֲשׂוֹתִ֣/י שְׁפָטִ֗ים בְּ/כֹ֨ל הַ/שָּׁאטִ֤ים אֹתָ/ם֙ מִ/סְּבִ֣יבוֹתָ֔/ם וְ/יָ֣דְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/026.yaml
  text: They will dwell on it securely, and they will build houses and plant vineyards. They will dwell securely when I execute judgments on all those who treat them with contempt all around them. Then they will know that I am the LORD their God.
translation:
  language: ru
  text: И будут жить на ней в безопасности, строить дома и сажать виноградники. Они будут жить в безопасности, когда Я совершу суд над всеми, кто вокруг них относится к ним с презрением. И узнают, что Я — ГОСПОДЬ, их Бог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: Передаёт значение уверенного, безопасного проживания; повтор сохранён в соответствии с еврейским текстом.
- source_word: שְׁפָטִים
  choice: суд
  rationale: В сочетании עָשָׂה שְׁפָטִים обозначает осуществление судебного воздаяния; естественное русское единственное число передаёт собирательный смысл.
- source_word: הַשָּׁאטִים
  choice: кто ... относится к ним с презрением
  rationale: Причастие от שׁאט выражает презрительное отношение; формулировка сохраняет направленность действия на Израиль.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона прописными буквами, отличающая имя Бога от обычного титула.
theological_decisions:
- issue: Связь безопасного проживания с Божьим судом над соседними народами
  choice: когда Я совершу суд
  alternative: после того как Я совершу суд
  rationale: Предлог ב при инфинитиве допускает временную связь без обязательного уточнения строгой последовательности; «когда» сохраняет эту широту.
- issue: Формула узнавания Бога
  choice: И узнают, что Я — ГОСПОДЬ, их Бог
  alternative: Тогда они узнают, что Я — Господь Бог их
  rationale: Сохранена формула познания Яхве и личная связь «их Бог» без добавления отсутствующего в еврейском тексте наречия «тогда».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и повтор «будут жить в безопасности» сохранены; архаизмы и конфессионально специфическая терминология не использованы.
