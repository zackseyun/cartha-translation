source:
  edition: WLC
  text: כָּל יוֹדְעֶ֨י/ךָ֙ בָּֽ/עַמִּ֔ים שָׁמְמ֖וּ עָלֶ֑י/ךָ בַּלָּה֣וֹת הָיִ֔יתָ וְ/אֵינְ/ךָ֖ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/019.yaml
  text: All who know you among the peoples are appalled at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: ru
  text: Все, кто знает тебя среди народов, ужаснулись при виде тебя; ты стал воплощением ужаса и навеки исчезнешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל יוֹדְעֶיךָ
  choice: Все, кто знает тебя
  rationale: Причастие Qal с суффиксом обозначает всех знающих адресата; настоящее время сохраняет общий характер выражения и не уточняет время сверх еврейского текста.
- source_word: בָּעַמִּים
  choice: среди народов
  rationale: Передаёт обычное значение множественного עַמִּים и сохраняет пространственно-социальную функцию предлога בְּ.
- source_word: שָׁמְמוּ עָלֶיךָ
  choice: ужаснулись при виде тебя
  rationale: В данном контексте שׁמם выражает потрясённый ужас; оборот с עַל указывает на того, чья участь вызывает такую реакцию. Русская формулировка естественна и не придаёт реакции оттенка сочувствия.
- source_word: בַּלָּהוֹת הָיִיתָ
  choice: ты стал воплощением ужаса
  rationale: Формально множественное отвлечённое существительное בַּלָּהוֹת здесь характеризует адресата как нечто внушающее ужас; «воплощением ужаса» естественно передаёт предикативную силу выражения.
- source_word: וְאֵינְךָ עַד עוֹלָם
  choice: и навеки исчезнешь
  rationale: Экзистенциальное отрицание с עַד עוֹלָם означает окончательное прекращение существования адресата в рамках этого пророческого приговора; будущее время соответствует направленности суда, а «навеки» передаёт его необратимость.
theological_decisions:
- issue: Смысл заключительной формулы полного исчезновения в пророческом плаче-суде
  choice: «и навеки исчезнешь»
  alternative: «и тебя не будет вовеки»
  rationale: Перевод сохраняет риторическую окончательность участи адресата, но не превращает формулу данного пророчества в более широкое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Синтаксис краток и торжественен; архаизмы не используются.
