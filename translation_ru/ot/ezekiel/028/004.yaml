  text: בְּ/חָכְמָֽתְ/ךָ֙ וּ/בִ/תְבוּנָ֣תְ/ךָ֔ עָשִׂ֥יתָ לְּ/ךָ֖ חָ֑יִל וַ/תַּ֛עַשׂ זָהָ֥ב וָ/כֶ֖סֶף בְּ/אוֹצְרוֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/004.yaml
  text: By your wisdom and by your understanding you made wealth for yourself[a], and you put gold and silver into your treasuries.
translation:
  language: ru
  text: Мудростью и разумением своим ты приобрёл себе богатство[a] и накопил золото и серебро в своих сокровищницах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добыл себе силу (могущество)»; еврейское слово может означать богатство, силу, могущество или ресурсы, но упоминание золота, серебра и сокровищниц здесь говорит в пользу значения «богатство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָתְךָ
  choice: Мудростью своей
  rationale: Предлог ב употреблён в значении средства; творительный падеж естественно передаёт этот смысл по-русски.
- source_word: וּבִתְבוּנָתְךָ
  choice: и разумением своим
  rationale: תְּבוּנָה означает разумение, понимание или проницательность. «Разумение» сохраняет отличие от «мудрости» и соответствует возвышенному, но понятному библейскому регистру.
- source_word: עָשִׂיתָ לְךָ חָיִל
  choice: ты приобрёл себе богатство
  rationale: Хотя буквально עשה — «сделал», по-русски богатство естественно «приобретают» или «наживают». В ближайшем контексте золота, серебра и сокровищниц חַיִל обозначает прежде всего материальное богатство.
- source_word: וַתַּעַשׂ
  choice: и накопил
  rationale: Буквальное «сделал» в сочетании с золотом, серебром и сокровищницами неестественно по-русски. «Накопил» ясно выражает приобретение и хранение ценностей, подразумеваемое контекстом.
- source_word: זָהָב וָכֶסֶף
  choice: золото и серебро
  rationale: Прямое и общепринятое соответствие еврейской паре драгоценных металлов.
- source_word: בְּאוֹצְרוֹתֶיךָ
  choice: в своих сокровищницах
  rationale: אוֹצָר может обозначать хранилище или сокровищницу; при упоминании золота и серебра «сокровищницы» точнее. Предлог «в» сохраняет формальную неоднозначность местонахождения и направления, тогда как глагол «накопил» передаёт итог помещения туда ценностей.
theological_decisions:
- issue: Значение חַיִל в пророческом слове о правителе Тира
  choice: материальное богатство
  alternative: сила, могущество или ресурсы
  rationale: Непосредственное упоминание золота, серебра и сокровищниц указывает прежде всего на экономическое богатство. Более широкий диапазон значения слова сохранён в примечании, чтобы не устранять присущую оригиналу смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Инверсия «Мудростью и разумением своим» подчёркивает средства обогащения и следует структуре еврейского текста; лексика остаётся понятной широкому читателю.
