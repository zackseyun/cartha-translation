  text: מֵ/רֹ֣ב עֲוֺנֶ֗י/ךָ בְּ/עֶ֨וֶל֙ רְכֻלָּ֣תְ/ךָ֔ חִלַּ֖לְתָּ מִקְדָּשֶׁ֑י/ךָ וָֽ/אוֹצִא אֵ֤שׁ מִ/תּֽוֹכְ/ךָ֙ הִ֣יא אֲכָלַ֔תְ/ךָ וָ/אֶתֶּנְ/ךָ֤ לְ/אֵ֨פֶר֙ עַל הָ/אָ֔רֶץ לְ/עֵינֵ֖י כָּל רֹאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/018.yaml
  text: By the abundance of your iniquities[a], in the unrighteousness of your trade, you profaned your sanctuaries[c][b]; so I brought out fire from your midst—it consumed you—and I turned you to ashes on the earth in the sight of all who saw you.
translation:
  language: ru
  text: Из-за множества твоих беззаконий, из-за неправедности твоей торговли ты осквернил свои святилища[a]. Тогда Я извёл огонь из твоей среды[b]; он пожрал тебя, и Я превратил тебя в пепел на земле, на глазах у всех, кто видел тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твои святилища»; в еврейском тексте стоит множественное число. Возможно также: «твои святые места».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изнутри тебя». Еврейский текст изображает огонь, выходящий из среды самого адресата как орудие суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵרֹב עֲוֺנֶיךָ
  choice: из-за множества твоих беззаконий
  rationale: מִן при רֹב выражает здесь причину; «из-за множества» естественно передаёт причинную связь, а «беззаконий» сохраняет множественное число и нравственную тяжесть עָוֹן.
- source_word: בְּעֶוֶל רְכֻלָּתְךָ
  choice: из-за неправедности твоей торговли
  rationale: עֶוֶל обозначает неправду и несправедливость, а רְכֻלָּה в контексте Иез 27–28 относится к торговой деятельности. Повтор «из-за» ясно передаёт основание осуждения.
- source_word: חִלַּלְתָּ מִקְדָּשֶׁיךָ
  choice: ты осквернил свои святилища
  rationale: Пиэль חלל означает лишить святости, осквернить; מִקְדָּשֶׁיךָ имеет форму множественного числа, которую перевод сохраняет.
- source_word: וָאוֹצִא אֵשׁ מִתּוֹכְךָ
  choice: Тогда Я извёл огонь из тебя
  rationale: Фраза описывает огонь, выходящий из внутренности адресата как орудие суда. «Извёл» сохраняет каузативно-направленное действие Бога и возвышенный пророческий регистр.
- source_word: הִיא אֲכָלַתְךָ
  choice: он пожрал тебя
  rationale: Местоимение относится к אֵשׁ «огонь»; в русском согласование мужского рода. «Пожрал» сохраняет сильный образ глагола אכל.
- source_word: וָאֶתֶּנְךָ לְאֵפֶר
  choice: Я превратил тебя в пепел
  rationale: Буквально конструкция означает «сделал/предал тебя пеплу»; выбранная формулировка естественно выражает результат уничтожения огнём.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: אֶרֶץ допускает значения «земля», «страна», «почва»; здесь «на земле» сохраняет широту и образ публичного низвержения.
- source_word: לְעֵינֵי כָּל רֹאֶיךָ
  choice: на глазах у всех, кто тебя видел
  rationale: Естественная русская передача формулы, подчёркивающей публичность суда перед всеми очевидцами.
theological_decisions:
- issue: Значение «твои святилища» в плаче о царе Тира
  choice: Сохранить буквальное множественное «свои святилища», не уточняя природу этих святилищ и личность адресата.
  alternative: Истолковать выражение метафорически как царское достоинство либо как указание на небесные святилища сверхъестественного существа.
  rationale: Еврейское מִקְדָּשֶׁיךָ — явно культовый термин во множественном числе. Контекст допускает спорные исторические, образные и сверхъестественные прочтения, которые перевод не должен предрешать.
- issue: Происхождение огня суда
  choice: Передать, что Бог извёл огонь из самого адресата.
  alternative: Сгладить образ до общего утверждения, что Бог послал на него огонь.
  rationale: מִתּוֹכְךָ буквально указывает на внутренность или среду адресата; сохранение этого образа важно для богословского напряжения текста.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим звучанием. Синтаксис сделан ясным для обычного читателя; сохранены культовая лексика, множественное число «святилища» и необычный образ огня, исходящего из адресата.
