  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֤י עָלַ֨יִ/ךְ֙ צִיד֔וֹן וְ/נִכְבַּדְתִּ֖י בְּ/תוֹכֵ֑/ךְ וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בַּ/עֲשׂ֥וֹתִ/י בָ֛/הּ שְׁפָטִ֖ים וְ/נִקְדַּ֥שְׁתִּי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/022.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Sidon, and I will be glorified in your midst[b]. And they will know that I am Yahweh when I execute judgments in her and show myself holy in her.’'
translation:
  language: ru
  text: 'и скажи: «Так говорит Владыка Яхве: вот, Я — против тебя, Сидон! Я прославлюсь среди тебя[a], и узнают, что Я — Яхве, когда Я совершу в нём суды и явлю в нём Свою святость[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрету славу среди тебя». Еврейский глагол может подчёркивать как воздаваемую Богу славу, так и явление Его славы через суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «освящусь в нём». Смысл выражения в том, что Яхве открыто явит и утвердит Свою святость Своими судами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт составной титул: אֲדֹנָי как «Владыка», а тетраграмматон — личным именем «Яхве», не смешивая два элемента.'
- source_word: הִנְנִי עָלַיִךְ
  choice: вот, Я — против тебя
  rationale: «Вот» сохраняет торжественную силу пророческого объявления, а עַל в данном контексте выражает враждебную направленность.
- source_word: צִידוֹן
  choice: Сидон
  rationale: Устоявшаяся русская форма географического названия.
- source_word: וְנִכְבַּדְתִּי
  choice: Я прославлюсь
  rationale: Нифаль глагола כבד здесь может обозначать как обретение славы и почитания, так и явление Божьей славы через суд; возвратная форма сохраняет эту ёмкость.
- source_word: בְּתוֹכֵךְ
  choice: среди тебя
  rationale: Сохраняет прямое обращение к городу и пространственное значение выражения.
- source_word: וְיָדְעוּ
  choice: и узнают
  rationale: Естественная русская передача характерной для Иезекииля формулы последующего узнавания Яхве.
- source_word: בַּעֲשׂוֹתִי בָהּ שְׁפָטִים
  choice: когда Я совершу в нём суды
  rationale: Инфинитив с בְּ передан временным придаточным; множественное שְׁפָטִים сохранено как «суды», а בָהּ — локативно как «в нём», с согласованием по-русски с названием Сидон.
- source_word: וְנִקְדַּשְׁתִּי בָהּ
  choice: и явлю в нём Свою святость
  rationale: Передаёт значение нифаля קדש как публичного явления и утверждения Божьей святости в совершаемом суде, избегая неясного впечатления, будто Бог становится более святым.
theological_decisions:
- issue: Формулы Божьего прославления и освящения через суд
  choice: Я прославлюсь ... и явлю ... Свою святость
  alternative: Я обрету славу ... и освящусь
  rationale: Выбранная формулировка сохраняет связь суда над Сидоном с открытым явлением славы и святости Бога, не сводя смысл только к человеческому признанию и не предполагая изменения в самом Боге.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет в тексте личное имя Бога и отличает его от титула אֲדֹנָי.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Прямое обращение к Сидону сохранено в первой части; при переходе еврейского текста к третьему лицу употреблено русское согласование «в нём».
