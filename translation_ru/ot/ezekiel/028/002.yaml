source:
  edition: WLC
  text: בֶּן אָדָ֡ם אֱמֹר֩ לִ/נְגִ֨יד צֹ֜ר כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן גָּבַ֤הּ לִבְּ/ךָ֙ וַ/תֹּ֨אמֶר֙ אֵ֣ל אָ֔נִי מוֹשַׁ֧ב אֱלֹהִ֛ים יָשַׁ֖בְתִּי בְּ/לֵ֣ב יַמִּ֑ים וְ/אַתָּ֤ה אָדָם֙ וְֽ/לֹא אֵ֔ל וַ/תִּתֵּ֥ן לִבְּ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/002.yaml
  text: 'Son of man[a], say to the prince of Tyre, ‘Thus says the Lord GOD: Because your heart is proud, and you say, “I am a god; I sit in the seat of gods in the heart of the seas,” yet you are a man and not a god[b], though you set your heart like the heart of gods.”'
translation:
  language: ru
  text: 'Сын человеческий, скажи правителю Тира: «Так говорит Владыка ГОСПОДЬ: за то, что возгордилось твоё сердце и ты говоришь: „Я бог; я восседаю в обители богов[a] в сердце морей“, — хотя ты человек, а не бог, ты сделал своё сердце подобным сердцу богов[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я Бог; я восседаю в обители Бога в сердце морей». Еврейские слова אֵל и אֱלֹהִים здесь допускают прочтение в единственном числе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ты сделал своё сердце подобным сердцу Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено характерное для книги Иезекииля обращение к пророку и образность еврейского выражения; привычная русская форма остаётся понятной современному читателю.
- source_word: לִנְגִיד צֹר
  choice: правителю Тира
  rationale: נָגִיד обозначает предводителя или правителя. «Правитель» естественно звучит по-русски и не смешивает это наименование с отдельным словом «царь».
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: 'Переданы оба элемента составного божественного титула: אֲדֹנָי как «Владыка», а имя יהוה — принятой заместительной формой «ГОСПОДЬ».'
- source_word: יַעַן גָּבַהּ לִבְּךָ
  choice: за то, что возгордилось твоё сердце
  rationale: Еврейский образ буквально говорит о вознесшемся сердце. Русское «возгордилось сердце» сохраняет этот образ и ясно выражает гордыню, а «за то, что» передаёт причинно-судебный оттенок יַעַן.
- source_word: אֵל אָנִי
  choice: Я бог
  rationale: אֵל допускает нарицательное значение «бог»; в контексте это хвастливая претензия языческого правителя на божественность. Возможное отождествление с единым Богом сохранено в примечании.
- source_word: מוֹשַׁב אֱלֹהִים יָשַׁבְתִּי
  choice: я сижу на месте богов
  rationale: Сочетание сохраняет повтор корня «место пребывания/сидения — сидеть» без неоправданного уточнения «престол». Множественное прочтение אֱלֹהִים дано в тексте, единственное — в примечании.
- source_word: בְּלֵב יַמִּים
  choice: в сердце морей
  rationale: Сохранён яркий еврейский образ сердца как середины или глубины морей.
- source_word: וְאַתָּה אָדָם וְלֹא אֵל
  choice: хотя ты человек, а не бог
  rationale: Передан риторический контраст между человеческой природой правителя и его притязанием на божественность. Уступительное «хотя» естественно связывает обличение с предшествующей похвальбой.
- source_word: וַתִּתֵּן לִבְּךָ כְּלֵב אֱלֹהִים
  choice: ты счёл своё сердце подобным сердцу богов
  rationale: Формулировка передаёт самовозвышающую внутреннюю установку правителя и сохраняет повтор слова «сердце». Возможное единственное значение אֱלֹהִים отмечено отдельно.
theological_decisions:
- issue: Следует ли понимать אֵל / אֱלֹהִים как нарицательное обозначение божества или как указание на единого Бога
  choice: 'В основном тексте: «Я бог» и «место/сердце богов».'
  alternative: «Я Бог; я сижу на месте Бога» и «сердцу Бога».
  rationale: Форма и контекст допускают притязание на божественность вообще, тогда как אֱלֹהִים может также употребляться в единственном числе о Боге. Основной текст следует контексту самобожествления тирского правителя, но не устраняет грамматически возможное единственное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены ключевые образы «сердце» и «сердце морей», но устранены неестественные для современного русского кальки. Кавычки разграничивают слова ГОСПОДА и вложенную похвальбу правителя.
