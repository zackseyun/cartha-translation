  text: בְּ/עֵ֨דֶן גַּן אֱלֹהִ֜ים הָיִ֗יתָ כָּל אֶ֨בֶן יְקָרָ֤ה מְסֻכָתֶ֨/ךָ֙ אֹ֣דֶם פִּטְדָ֞ה וְ/יָהֲלֹ֗ם תַּרְשִׁ֥ישׁ שֹׁ֨הַם֙ וְ/יָ֣שְׁפֵ֔ה סַפִּ֣יר נֹ֔פֶךְ וּ/בָרְקַ֖ת וְ/זָהָ֑ב מְלֶ֨אכֶת תֻּפֶּ֤י/ךָ וּ/נְקָבֶ֨י/ךָ֙ בָּ֔/ךְ בְּ/י֥וֹם הִבָּרַאֲ/ךָ֖ כּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/013.yaml
  text: 'You were in Eden[a], the garden of God; every precious stone was your covering: ruby, topaz, and diamond; beryl, onyx, and jasper; sapphire, turquoise, and emerald; and gold. The workmanship of your tambourines and your sockets was in you; on the day you were created[b], they were prepared.'
translation:
  language: ru
  text: 'Ты был в Эдеме, саду Божьем; всякий драгоценный камень был твоим покровом: рубин, топаз и алмаз; хризолит, оникс и яшма; сапфир, бирюза и изумруд — и золото.[a] Искусная работа твоих бубнов и гнёзд для камней была в тебе;[b] в день твоего сотворения они были приготовлены.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное соответствие нескольких древних названий камней современным минералогическим терминам неизвестно. Возможные варианты включают «сердолик» вместо «рубина», «хризолит» вместо «топаза» или «берилла», «лазурит» вместо «сапфира», а также «карбункул» или «гранат» для одного из последних названий камней.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейские слова в этой фразе трудны для понимания. Возможно также: «Искусная работа твоих оправ и креплений была на тебе», если речь идёт не о музыкальных инструментах, а о ювелирных изделиях.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵדֶן גַּן אֱלֹהִים
  choice: в Эдеме, саду Божьем
  rationale: Сохранены имя собственное и приложение; выражение «сад Божий» естественно и передаёт возвышенный характер места.
- source_word: כָּל אֶבֶן יְקָרָה מְסֻכָתֶךָ
  choice: всякий драгоценный камень служил тебе покровом
  rationale: Передаёт именную конструкцию и сохраняет образ покрова, не сводя его однозначно к одежде, украшению или защите.
- source_word: אֹדֶם פִּטְדָה וְיָהֲלֹם
  choice: рубин, топаз и алмаз
  rationale: Использованы понятные традиционные названия; неопределённость соответствия древних названий современной минералогии отмечена в сноске.
- source_word: תַּרְשִׁישׁ שֹׁהַם וְיָשְׁפֵה
  choice: хризолит, оникс и яшма
  rationale: «Хризолит» — распространённая передача תַּרְשִׁישׁ в библейских перечнях; остальные названия следуют устойчивым русским эквивалентам.
- source_word: סַפִּיר נֹפֶךְ וּבָרְקַת וְזָהָב
  choice: сапфир, бирюза и изумруд — и золото
  rationale: Сохранены порядок и отдельное присоединение золота; спорные идентификации камней оговорены в сноске.
- source_word: מְלֶאכֶת תֻּפֶּיךָ וּנְקָבֶיךָ בָּךְ
  choice: искусная работа твоих бубнов и гнёзд была в тебе
  rationale: Формально сохраняет трудные еврейские термины и предлог «в тебе», не устраняя необычность образа; ювелирное толкование дано как альтернатива.
- source_word: בְּיוֹם הִבָּרַאֲךָ כּוֹנָנוּ
  choice: в день твоего сотворения они были приготовлены
  rationale: Пассивные формы и указание на сотворение переданы прямо, без уточнения личности адресата.
theological_decisions:
- issue: Кем является адресат возвышенного образа Эдема
  choice: Передать образы Эдема и сотворения без определения личности адресата
  alternative: Истолковать адресата только как царя Тира либо прямо отождествить его с сатаной или падшим херувимом
  rationale: Сам стих не разрешает более широкий спор об адресате; перевод сохраняет его образность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Необычная формулировка трудного еврейского оборота намеренно частично сохранена, а основная альтернатива вынесена в сноску.
