  text: Son of man[a], set your face toward Sidon, and prophesy against her.
translation:
  language: ru
  text: Сын человеческий[a], обрати лицо своё к Сидону и пророчествуй против него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек», «смертный». Буквально: «сын человека» — обычная форма обращения к Иезекиилю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет повторяющуюся в книге Иезекииля форму обращения и прозрачность еврейского выражения; здесь это обращение к смертному человеку, а не христологический титул.
- source_word: שִׂים פָּנֶיךָ
  choice: обрати лицо своё
  rationale: Естественно передаёт пророческую идиому о целенаправленном обращении к месту, сохраняя конкретный образ лица.
- source_word: אֶל צִידוֹן
  choice: к Сидону
  rationale: Предлог אֶל в сочетании с данной идиомой обозначает направленность; форма «к Сидону» не переносит в эту фразу враждебный смысл раньше следующего выражения.
- source_word: וְהִנָּבֵא
  choice: и пророчествуй
  rationale: Прямое и принятое соответствие повелительной форме глагола נבא в контексте пророческого поручения.
- source_word: עָלֶיהָ
  choice: против него
  rationale: В контексте пророчества о суде על имеет противительный смысл. Хотя еврейский суффикс женского рода согласован с олицетворённым городом, по-русски название «Сидон» грамматически мужского рода.
theological_decisions:
- issue: Передача обращения בֶּן אָדָם в книге Иезекииля
  choice: Сын человеческий
  alternative: человек; смертный
  rationale: Формулировка сохраняет узнаваемую еврейскую идиому и литературное единообразие книги, а сноска предупреждает ошибочное восприятие её здесь как мессианского титула.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной, но понятной пророческой идиомы. Постпозиция «своё» придаёт фразе достоинство без архаизации.
