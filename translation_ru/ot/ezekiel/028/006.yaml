source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֛עַן תִּתְּ/ךָ֥ אֶת לְבָבְ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/006.yaml
  text: 'Therefore thus says the Lord GOD: Because you have made your heart like the heart of a god,[a]'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Господь: «За то, что ты уподобил своё сердце сердцу бога[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сердцу Бога». Еврейское слово אֱלֹהִים в зависимости от контекста может означать «Бог», «бог» или «боги».'
    reason: Сохраняет неоднозначность еврейского אֱלֹהִים и не исключает традиционное понимание как указания на Бога.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и переход от предшествующего обвинения к следующему за ним Божьему приговору.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для современного русского языка передача устойчивой пророческой формулы с сохранением её торжественного характера.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: «Владыка» передаёт אֲדֹנָי, а «Господь» — имя יהוה в традиционной русской библейской форме, при этом избегается сочетание «Господь Господь».
- source_word: יַעַן
  choice: За то, что
  rationale: В данном контексте вводит основание грядущего суда и по-русски естественно сочетается с последующим приговором.
- source_word: תִּתְּךָ אֶת לְבָבְךָ
  choice: ты уподобил своё сердце
  rationale: Еврейский оборот буквально говорит о том, что адресат «поставил/сделал» своё сердце как другое; «уподобил» ясно выражает смысл сравнения и сохраняет образ сердца.
- source_word: לְבָבְךָ
  choice: своё сердце
  rationale: Сохраняет исходный библейский образ внутреннего мира, включающего разум и волю.
- source_word: כְּלֵב אֱלֹהִים
  choice: сердцу бога
  rationale: В контексте обличения правителя Тира слово אֱלֹהִים естественно обозначает бога, то есть притязание человека на божественный статус. Строчная буква показывает, что основной текст не отождествляет этого «бога» однозначно с Богом Израиля.
theological_decisions:
- issue: Значение אֱלֹהִים в выражении כְּלֵב אֱלֹהִים
  choice: бога
  alternative: Бога; богов
  rationale: Контекст обличает человеческое самовозвышение и притязание на божественность, поэтому «бога» наиболее естественно передаёт насмешливую направленность высказывания. Однако еврейская форма допускает также понимание «Бога» или «богов», поэтому основная значимая альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим звучанием. Формула «Владыка Господь» сохраняет оба элемента еврейского титула; образ сердца удержан без рационализирующей замены на «разум». Начальная кавычка оставлена открытой, поскольку стих синтаксически продолжается далее.
