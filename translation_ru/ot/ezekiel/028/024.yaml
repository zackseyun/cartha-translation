  text: וְ/לֹֽא יִהְיֶ֨ה ע֜וֹד לְ/בֵ֣ית יִשְׂרָאֵ֗ל סִלּ֤וֹן מַמְאִיר֙ וְ/ק֣וֹץ מַכְאִ֔ב מִ/כֹּל֙ סְבִ֣יבֹתָ֔/ם הַ/שָּׁאטִ֖ים אוֹתָ֑/ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/024.yaml
  text: And the house of Israel will no longer have a brier that causes bitterness or a thorn that causes pain from all those around them who despise them[a]. Then they will know that I am the Lord GOD.
translation:
  language: ru
  text: И не будет больше у дома Израиля ни колючки, причиняющей горечь, ни шипа, причиняющего боль, от всех окружающих их, презирающих их.[a] И узнают они, что Я — Господь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язвящая колючка»; еврейское выражение рисует образ острого, вредоносного растения как обозначение враждебных соседних народов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִלּוֹן
  choice: колючка
  rationale: Передаёт образ острого, вредоносного растения и при этом позволяет отличить его от параллельного קוֹץ — «шип».
- source_word: מַמְאִיר
  choice: причиняющая горечь
  rationale: Сохраняет причастное определение и вероятный оттенок горечи либо мучительного раздражения, не сводя его просто к боли.
- source_word: קוֹץ
  choice: шип
  rationale: Естественный русский эквивалент распространённого образа чего-то колющего и причиняющего страдание.
- source_word: מַכְאִב
  choice: причиняющего боль
  rationale: Передаёт каузативный смысл причастия и сохраняет параллелизм с предыдущим определением.
- source_word: מִכֹּל סְבִיבֹתָם
  choice: среди всех окружающих его
  rationale: Фраза относится к окружающим Израиль народам; «среди» естественно выражает происхождение угрозы из их числа, а единственное число согласуется с собирательным «дом Израиля».
- source_word: הַשָּׁאטִים אוֹתָם
  choice: которые относятся к нему с презрением
  rationale: Точно передаёт устойчивое враждебное презрение, выраженное причастием, без излишнего усиления.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет стандартное библейское обозначение народа как единого сообщества.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Различает титул אֲדֹנָי и личное имя יהוה, избегая неестественного повтора «Господь Господь».
- source_word: וְיָדְעוּ כִּי אֲנִי
  choice: И узнают они, что Я
  rationale: Сохраняет соединительный союз и формулу узнавания Бога; русский порядок слов придаёт ей естественную библейскую торжественность.
theological_decisions:
- issue: Передача Божьего имени в אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Текст содержит личное имя יהוה; его транслитерация сохраняет отличие имени от предшествующего титула אֲדֹנָי. «Владыка» передаёт титул естественно и не создаёт повтора.
- issue: Референт местоимений при «доме Израиля»
  choice: 'единственное число: «его», «к нему»'
  alternative: 'множественное число: «их», «к ним»'
  rationale: В еврейском местоимения стоят во множественном числе по смыслу народа, но в современном русском «дом Израиля» естественно выступает как собирательное единственное; богословского различия это не создаёт.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены оба параллельных растительных образа и различие между причиняемой ими горечью и болью; синтаксис сделан ясным без устранения образности оригинала.
