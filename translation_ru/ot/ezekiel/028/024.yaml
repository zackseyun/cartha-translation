  terminology: «Дом Израиля», «колючка» и «шип» приемлемо сохраняют образность и различие еврейских слов. «Господь Яхве» различает אֲדֹנָי и יהוה, сохраняя личное имя Яхве. Причастные определения «причиняющая горечь» и «причиняющего боль» адекватны.
