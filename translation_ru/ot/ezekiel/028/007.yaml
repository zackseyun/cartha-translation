review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: לָכֵן выражено как вывод, הִנְנִי — торжественным «вот Я», угроза направлена против адресата; זָרִים и עָרִיצֵי גּוֹיִם переданы как чужеземцы и наиболее беспощадные среди народов. «Обнажат мечи» естественно передаёт идиому וְהֵרִיקוּ חַרְבוֹתָם, а поэтические образы красоты мудрости и великолепия сохранены. Уточнение «против тебя» яснее воспроизводит עָלֶיךָ, чем «на тебя» в сочетании с «наводить».'
  naturalness: «Навожу на тебя чужеземцев» понятно, но несколько менее естественно и менее прямо передаёт образ приведения/ведения войска. «Веду против тебя чужеземцев» — современное литературное и торжественное пророческое выражение. Остальной синтаксис и регистр удачны.
  terminology: '«Чужеземцы», «беспощадные», «обнажат мечи», «осквернят» и «великолепие» соответствуют лексике и не вносят богословских интерпретаций. Сноска c должна содержать альтернативу для всего глагольного сочетания, как и английский аудиторский след: не только «сияние», но «осквернят твоё сияние».'
  issues:
  - severity: low
    issue: Выбор глагола «навожу на тебя»
    rationale: Он допустим в контексте бедствия, но исходный текст прямо говорит о том, что Бог приводит чужеземцев против адресата. «Веду против тебя» точнее и стилистически прозрачнее.
  - severity: low
    issue: Неполная формулировка сноски c
    rationale: Английская сноска даёт альтернативное выражение «they will profane your radiance». Русская сноска должна аналогично включать глагол, чтобы альтернатива не выглядела как простая замена существительного без связи с предложением.
