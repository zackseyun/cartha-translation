  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא עָלֶ֨י/ךָ֙ זָרִ֔ים עָרִיצֵ֖י גּוֹיִ֑ם וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל יְפִ֣י חָכְמָתֶ֔/ךָ וְ/חִלְּל֖וּ יִפְעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/007.yaml
  text: Therefore[a], behold, I am bringing strangers against you, the most ruthless of the nations; they will draw their swords against the beauty of your wisdom[c][b], and they will defile your splendor.
translation:
  language: ru
  text: Поэтому вот Я веду против тебя чужеземцев[a], самых беспощадных среди народов. Они обнажат свои мечи[b] против красоты твоей мудрости и осквернят твоё великолепие[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужаков».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «опустошат свои мечи», то есть извлекут их из ножен.'
    reason: idiom_explanation
  - marker: c
    text: 'Или: «осквернят твоё сияние».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего обвинения, не усиливая причинный оттенок сверх еврейского текста.
- source_word: הִנְנִי מֵבִיא עָלֶיךָ
  choice: вот Я навожу на тебя
  rationale: Сохраняет торжественную пророческую формулу и живую, близкую перспективу действия, выраженную причастием.
- source_word: זָרִים
  choice: чужеземцев
  rationale: Естественно обозначает людей, принадлежащих к чужим народам, и хорошо соответствует контексту иноземного вторжения.
- source_word: עָרִיצֵי גּוֹיִם
  choice: самых беспощадных среди народов
  rationale: Передаёт значение жестоких, не знающих жалости насильников и идиоматическую выделительную силу сочетания.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם
  choice: они обнажат свои мечи
  rationale: Русский военный оборот естественно передаёт идиому, буквально говорящую об извлечении, «опустошении», мечей.
- source_word: עַל יְפִי חָכְמָתֶךָ
  choice: против красоты твоей мудрости
  rationale: 'Сохраняет необычный поэтический генитив оригинала и его иронию: прославленная мудрость адресата становится объектом нападения.'
- source_word: וְחִלְּלוּ יִפְעָתֶךָ
  choice: и осквернят твоё великолепие
  rationale: «Осквернят» сохраняет смысл унижения и лишения почёта, а «великолепие» естественно передаёт царственный блеск и сияющий облик.
theological_decisions:
- issue: Референт пророчества о правителе Тира
  choice: Передать непосредственный историко-пророческий суд над адресатом без дополнительной идентификации.
  alternative: Истолковать выражения как прямое указание на падение сверхъестественного существа.
  rationale: В самом стихе говорится об иноземных захватчиках, мечах, мудрости и великолепии. Перевод не должен вносить в текст спорное типологическое или сатанологическое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены торжественное «вот», образное выражение «красота твоей мудрости» и напряжение между царственным великолепием адресата и его предстоящим унижением; архаизмы и конфессионально окрашенные добавления исключены.
