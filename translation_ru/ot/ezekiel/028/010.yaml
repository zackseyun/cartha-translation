  text: You will die the death of the uncircumcised by the hand of foreigners[a], for I have spoken, declares the Lord GOD.
translation:
  language: ru
  text: Ты умрёшь смертью необрезанных[a] от руки чужеземцев, ибо Я сказал, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смертями необрезанных ты умрёшь»; это еврейское выражение означает, что ты умрёшь такой же смертью, как необрезанные.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹתֵי עֲרֵלִים תָּמוּת
  choice: Ты умрёшь смертью необрезанных
  rationale: Сочетание множественного מוֹתֵי с однокоренным глаголом תָּמוּת передаёт характер смерти и усиливает приговор. По-русски единственное число «смертью» естественно выражает смысл, а «необрезанных» сохраняет позорящий и заветный оттенок исходного обозначения.
- source_word: בְּיַד זָרִים
  choice: от руки чужеземцев
  rationale: Еврейское בְּיַד обозначает действующее лицо или орудие; оборот «от руки» сохраняет образность. זָרִים в данном контексте означает людей из чужого народа, поэтому выбрано «чужеземцев».
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: потому что Я сказал это
  rationale: כִּי указывает на основание и непреложность приговора, а перфект דִבַּרְתִּי — на уже произнесённое Божье слово. Местоимение «Я» сохраняет выраженное в еврейском тексте אֲנִי усиление.
- source_word: נְאֻם
  choice: возвещает
  rationale: В пророческой формуле слово вводит торжественное авторитетное изречение; глагол «возвещает» естественен в современном русском библейском регистре.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה, избегая неясного удвоения титула «Господь Господь».
theological_decisions:
- issue: Передача формулы אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, непосредственно представленное в исходном тексте, не добавляя конфессионального толкования.
- issue: Смысл выражения «смертью необрезанных»
  choice: Сохранить образ необрезанных в основном тексте
  alternative: Умереть позорной смертью, как язычники
  rationale: Буквенный образ несёт одновременно этнический, заветный и позорящий оттенки. Развёрнутый пересказ сузил бы эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Прямая угроза передана кратко и резко; образность исходного текста сохранена без неестественного множественного числа «смертями» в основном тексте.
