review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан точно: Иезекииль служит знамением для народа, они повторят его действия, а наступление не названного прямо события приведёт их к познанию Владыки ГОСПОДА. Однако עָשָׂה — совершенная форма («сделал»), тогда как «делал» в русском обычно обозначает процесс или повторяемость и ослабляет завершённость образцового действия.'
  naturalness: Фраза в целом литературна. «Всё, что он сделал, сделаете и вы» естественнее и точнее передаёт соотнесённые совершенные действия. «Когда это наступит» звучит естественно применительно к неуточнённому грядущему событию и сохраняет намеренную неопределённость оригинала.
  terminology: «Знамение» удачно передаёт מוֹפֵת. «Владыка ГОСПОДЬ» последовательно различает אֲדֹנָי и YHWH; необычность прописного написания здесь функциональна и не требует замены. Личное местоимение «Я» оправдано русской передачей прямой божественной речи.
  issues:
  - severity: low
    issue: Вид глагола в «всё, что он делал»
    rationale: Еврейское עָשָׂה стоит в перфекте и в данном сопоставлении означает совершённое Иезекиилем действие. «Делал» добавляет оттенок длительности; «сделал» точнее.
  - severity: low
    issue: Будущее «будете делать»
    rationale: Форма допустима, но может звучать как длительное или повторяемое действие. «Сделаете» точнее отражает прямое предсказание תַּעֲשׂוּ и лучше согласуется с «сделал».
  revised_text: 'И Иезекииль будет для вас знамением: всё, что он сделал, сделаете и вы. Когда это наступит, вы узнаете, что Я — Владыка ГОСПОДЬ.'
