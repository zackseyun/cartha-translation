base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/024.yaml
  text: And Ezekiel will be a sign for you; according to all that he has done, you will do. When it comes, then you will know that I am the Lord GOD.
translation:
  language: ru
  text: 'И Иезекииль будет для вас знамением: всё, что он сделал, сделаете и вы. Когда это наступит, вы узнаете, что Я — Владыка ГОСПОДЬ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹפֵת
  choice: знамение
  rationale: Передаёт публичный символический знак, которым становится Иезекииль; это естественный и традиционно понятный русский эквивалент.
- source_word: בְּבֹאָהּ
  choice: когда это придёт
  rationale: Женский местоименный суффикс допускает отсылку к подразумеваемому бедствию или событию; нейтральное «это» сохраняет неявность референта.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Различает титул Адонай и личное имя YHWH; написание «ГОСПОДЬ» прописными буквами условно обозначает тетраграмматон и избегает смешения двух компонентов.
theological_decisions:
- issue: Что именно «придёт»
  choice: 'Сохранён неопределённый референт: «когда это придёт»'
  alternative: «когда придёт бедствие» или «когда это сбудется»
  rationale: В еврейском тексте референт выражен местоименным суффиксом и не назван непосредственно; уточнение внесло бы толкование в основной текст.
- issue: Божественное именование אֲדֹנָי יְהוִה
  choice: «Владыка ГОСПОДЬ»
  alternative: «Господь Бог», «Владыка Яхве»
  rationale: Выбранная форма сохраняет двойное именование и отмечает отличие YHWH от обычного титула, не вводя конфессионально специфического решения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; повтор «делал — будете делать» сохраняет связь действий Иезекииля с последующим поведением адресатов.
