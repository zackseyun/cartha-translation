  text: בֶּן אָדָ֕ם הִנְ/נִ֨י לֹקֵ֧חַ מִמְּ/ךָ֛ אֶת מַחְמַ֥ד עֵינֶ֖י/ךָ בְּ/מַגֵּפָ֑ה וְ/לֹ֤א תִסְפֹּד֙ וְ/לֹ֣א תִבְכֶּ֔ה וְ/ל֥וֹא תָב֖וֹא דִּמְעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/016.yaml
  text: Son of man[a], behold, I am taking from you the delight of your eyes with a blow, yet you shall not mourn or weep[c][b], nor shall your tears come.
translation:
  language: ru
  text: Сын человеческий! Вот, Я отнимаю у тебя отраду твоих глаз[a] ударом[b]. Но ты не скорби и не плачь, и слёзы у тебя не выступят[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что желанно твоим глазам». Речь идёт о том, кто особенно дорог Иезекиилю; из контекста ясно, что это его жена.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поражением»; возможно также: «моровой язвой». Еврейское слово может обозначать поражающий удар или смертоносное, подобное мору бедствие.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и твоя слеза не придёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устойчивое обращение к Иезекиилю во всей книге. Сохраняет еврейский образ и его традиционно узнаваемую форму, не сводя выражение к пояснительным вариантам «человек» или «смертный».
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт торжественное привлечение внимания к непосредственно следующему Божьему заявлению.
- source_word: לֹקֵחַ
  choice: отнимаю
  rationale: Причастие при הִנְנִי выражает близкое и живо представленное действие. Настоящее время сохраняет эту непосредственность; глагол «отнимать» естественно передаёт утрату дорогого человека.
- source_word: מַחְמַד עֵינֶיךָ
  choice: отраду твоих глаз
  rationale: Сохраняет образный оборот о том, кто особенно дорог Иезекиилю, не называя прямо его жену, хотя контекст далее устанавливает, о ком идёт речь.
- source_word: בְּמַגֵּפָה
  choice: одним ударом
  rationale: מַגֵּפָה может обозначать поражающий удар либо моровое, смертоносное поражение. «Ударом» уместно в личном контексте и не уточняет способ смерти; «одним» естественно выражает единичность и внезапную завершённость, не превращая слово в медицинский термин.
- source_word: תִסְפֹּד
  choice: не скорби
  rationale: Передаёт запрет на траур и оплакивание. Русское «не оплакивай» требует дополнения, тогда как «не скорби» самостоятельно и ясно звучит в параллели с «не плачь».
- source_word: תִבְכֶּה
  choice: не плачь
  rationale: Сохраняет различие между состоянием или проявлением скорби и непосредственным плачем.
- source_word: וְלֹא תָבוֹא דִּמְעָתֶךָ
  choice: и слёзы да не выступают у тебя
  rationale: Сохраняет конкретный образ появления слезы, но передаёт его естественным русским оборотом. Множественное «слёзы» в русском здесь идиоматичнее еврейского собирательного единственного числа.
theological_decisions:
- issue: Следует ли прямо указать, что «отрада твоих глаз» — жена Иезекииля
  choice: Сохранить образное выражение в основном тексте, не называя жену
  alternative: «твою любимую жену» или «отраду твоих глаз — твою жену»
  rationale: Сам стих не называет жену; её личность становится ясна из ближайшего контекста. Сохранение образа не вносит в строку отсутствующее в ней пояснение и удерживает эмоциональную силу оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Обращение «Сын человеческий» и формула «Вот, Я» сохраняют библейскую весомость, а остальная фраза избегает архаической грамматики. Повтор отрицаний передан ясно, без сглаживания сурового запрета на внешние проявления траура.
