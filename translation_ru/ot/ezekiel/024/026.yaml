lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная русская передача временного оборота с указанием на определённый будущий день.
- source_word: יָבֹוא
  choice: придёт
  rationale: Форма обозначает будущее действие; совершенный вид естественно передаёт однократное прибытие.
- source_word: הַפָּלִיט
  choice: спасшийся
  rationale: Слово обозначает человека, которому удалось избежать гибели и уйти; «спасшийся» сохраняет связь и с бегством, и с выживанием, не придавая слову нежелательного оттенка преступника, возможного у «беглец».
- source_word: אֵלֶיךָ
  choice: к тебе
  rationale: Прямое обозначение движения к Иезекиилю; обращение стоит в мужском роде единственного числа.
- source_word: לְהַשְׁמָעוּת אָזְנָיִם
  choice: чтобы ты услышал всё своими ушами
  rationale: Русская формулировка сохраняет слуховой образ и подчёркивает непосредственное получение устного сообщения. «Всё» восполняет подразумеваемое содержание вести и делает безобъектную конструкцию естественной по-русски; идиоматичность оригинала отмечена в сноске.
