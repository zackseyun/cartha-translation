  text: וַ/עֲשִׂיתֶ֖ם כַּ/אֲשֶׁ֣ר עָשִׂ֑יתִי עַל שָׂפָם֙ לֹ֣א תַעְט֔וּ וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/022.yaml
  text: 'And you will do as I have done: you will not cover your mustache[b][a], and you will not eat the bread of men.'
translation:
  language: ru
  text: 'И вы поступите так, как поступил я: не будете прикрывать верхнюю губу[a] и не будете есть хлеб людей[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Прикрывать верхнюю губу (или область усов) было принято в знак скорби или ритуальной нечистоты.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «хлеб людей». Возможно, имеется в виду пища, которую другие приносили скорбящим в утешение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: И вы поступите
  rationale: Форма с waw продолжает пророческое предсказание и одновременно передаёт предписанный образ действий; будущее время естественно для русского контекста.
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: так, как поступил я
  rationale: Сохраняет прямое сопоставление будущего поведения народа со знаковым действием Иезекииля.
- source_word: עַל שָׂפָם לֹא תַעְטוּ
  choice: не будете закрывать усы
  rationale: שָׂפָם обозначает область верхней губы или усов, а עטה — покрывание или закутывание. Формулировка естественна по-русски и сохраняет связь с траурным обычаем.
- source_word: לֶחֶם אֲנָשִׁים
  choice: хлеб, принесённый людьми
  rationale: Буквальное «хлеб людей» в современном русском неясно и может быть понято как хлеб, предназначенный людям. Выбранная формулировка сохраняет вероятный смысл пищи, которую другие приносили скорбящим, а примечание отмечает неоднозначность.
- source_word: לֹא תֹאכֵלוּ
  choice: не будете есть
  rationale: Будущее время соответствует пророческой направленности контекста и сохраняет параллелизм с предыдущим запретом-предсказанием.
