  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִפָּ֤תַח פִּ֨י/ךָ֙ אֶת הַ/פָּלִ֔יט וּ/תְדַבֵּ֕ר וְ/לֹ֥א תֵֽאָלֵ֖ם ע֑וֹד וְ/הָיִ֤יתָ לָ/הֶם֙ לְ/מוֹפֵ֔ת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/027.yaml
  text: On that day your mouth will be opened when the fugitive comes to you[a], and you will speak and no longer be mute. So you will be a sign to them, and they will know that I am Yahweh.
translation:
  language: ru
  text: В тот день, когда к тебе придёт беглец[a], уста твои откроются; ты заговоришь и больше не будешь нем. Ты станешь для них знамением, и они узнают, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «уста твои откроются вместе с беглецом» или «при беглеце». Еврейская конструкция трудна; вероятно, имеется в виду время, когда спасшийся из Иерусалима вестник придёт с известием.'
    reason: лексическая и синтаксическая неоднозначность
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная русская передача обычного временного выражения с сохранением пророческой временной отсылки.
- source_word: יִפָּתַח פִּיךָ
  choice: уста твои откроются
  rationale: Сохраняет образное выражение оригинала и связь с прекращением наложенной на Иезекииля немоты; порядок слов поддерживает возвышенный, но понятный регистр.
- source_word: אֶת הַפָּלִיט
  choice: когда к тебе придёт беглец
  rationale: Конструкция с אֶת здесь синтаксически трудна. Контекст 24:26 и 33:21–22 указывает на прибытие спасшегося вестника с известием о падении Иерусалима; формулировка естественна по-русски, но альтернативное понимание отмечено в сноске.
- source_word: וּתְדַבֵּר
  choice: ты заговоришь
  rationale: Глагол передаёт начало восстановленной речи после немоты и естественно продолжает образ открывшихся уст.
- source_word: וְלֹא תֵאָלֵם עוֹד
  choice: и больше не будешь нем
  rationale: Nifal от אלם обозначает именно немоту или неспособность говорить, а не добровольное молчание.
- source_word: וְהָיִיתָ לָהֶם לְמוֹפֵת
  choice: Ты станешь для них знамением
  rationale: מוֹפֵת обозначает знак или предзнаменование; «знамение» сохраняет символико-пророческий оттенок и остаётся понятным современному читателю.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: и они узнают, что Я — Яхве
  rationale: Сохраняет повторяющуюся в книге формулу узнавания и передаёт тетраграмматон личным именем.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Восстановление речи Иезекииля
  choice: буквальное прекращение пророческой немоты при прибытии беглеца
  alternative: общее прекращение молчания; исключительно метафорическое наделение способностью говорить
  rationale: Стих завершает ранее данный знак немоты Иезекииля и в контексте связывает восстановление его речи с прибытием вестника, не уточняя сверх текста механизм этого события.
- issue: Связь открытия уст с הַפָּלִיט
  choice: 'временная связь: когда придёт беглец'
  alternative: вместе с беглецом; при беглеце
  rationale: Контекст поддерживает временное понимание, однако необычная конструкция допускает более буквальную передачу, поэтому неоднозначность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Уста» и «знамение» сохраняют достоинство и межтекстовые связи, не делая синтаксис архаичным; «беглец» передаёт человека, спасшегося и принёсшего весть.
