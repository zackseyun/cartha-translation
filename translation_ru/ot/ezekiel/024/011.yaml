  text: וְ/הַעֲמִידֶ֥/הָ עַל גֶּחָלֶ֖י/הָ רֵקָ֑ה לְמַ֨עַן תֵּחַ֜ם וְ/חָ֣רָה נְחֻשְׁתָּ֗/הּ וְ/נִתְּכָ֤ה בְ/תוֹכָ/הּ֙ טֻמְאָתָ֔/הּ תִּתֻּ֖ם חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/011.yaml
  text: Then set it empty on its coals[a], so that it may become hot and its bronze may glow, and its uncleanness within it may be melted, and its corrosion consumed.
translation:
  language: ru
  text: Потом поставь пустой котёл на раскалённые угли, чтобы он нагрелся и его медь раскалилась, чтобы нечистота внутри него расплавилась, а его ржавчина[a] была уничтожена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «накипь», «грязный налёт». Еврейское слово может обозначать коррозию на металле, а в данном образе — въевшуюся нечистоту, олицетворяющую нравственное осквернение Иерусалима.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמִידֶהָ
  choice: Потом поставь пустой котёл
  rationale: Каузативная форма от עמד передаёт повеление поставить сосуд; последовательный ו передан словом «потом». Объект назван явно ради естественности русского текста.
- source_word: עַל גֶּחָלֶיהָ
  choice: на раскалённые угли
  rationale: גחלים означает горящие угли или жар; «раскалённые угли» ясно передаёт источник сильного нагрева. Суффикс соотносит угли с котлом либо его огнём, но в русском буквальное «его угли» звучало бы неестественно и неясно.
- source_word: רֵקָה
  choice: пустой
  rationale: Прилагательное описывает котёл после удаления содержимого; согласовано с русским словом мужского рода «котёл».
- source_word: לְמַעַן תֵּחַם
  choice: чтобы он нагрелся
  rationale: Сохранено целевое значение לְמַעַן и процесс сильного нагревания сосуда.
- source_word: וְחָרָה נְחֻשְׁתָּהּ
  choice: и его медь раскалилась
  rationale: חרה здесь описывает сильный жар металла. «Раскалилась» естественно для нагретого металла и не создаёт впечатления, будто металл буквально горит.
- source_word: נְחֻשְׁתָּהּ
  choice: его медь
  rationale: נחשת может обозначать медь или бронзу. В отношении металлического котла «медь» — прямое и естественное русское обозначение, при этом точный сплав исходный текст не устанавливает.
- source_word: וְנִתְּכָה
  choice: расплавилась
  rationale: Глагол נתך может означать плавление или излияние; в образе раскалённого металлического сосуда «расплавилась» сохраняет метафору очищения жаром.
- source_word: בְתוֹכָהּ טֻמְאָתָהּ
  choice: нечистота внутри него
  rationale: «Нечистота» сохраняет одновременно вещественный образ загрязнения котла и нравственно-ритуальный смысл пророческого знамения.
- source_word: תִּתֻּם חֶלְאָתָהּ
  choice: его ржавчина была уничтожена
  rationale: תם передаёт полное прекращение или истребление, а חלאה — въевшийся коррозийный налёт, грязь или накипь. Формулировка сохраняет образ полного очищения сосуда.
theological_decisions:
- issue: Сочетание буквального образа металлического котла с символом нравственной нечистоты Иерусалима
  choice: Сохранить конкретные слова о нагревании, меди, плавлении и ржавчине наряду со словом «нечистота»
  alternative: Передать весь образ только кулинарными словами («накипь», «грязь») либо прямо заменить его отвлечёнными понятиями «грех» и «вина»
  rationale: Еврейский текст намеренно удерживает вместе предметный образ котла и пророческий смысл суда. Перевод не должен ни сводить текст к очистке посуды, ни устранять образ ради прямого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет последовательность повеления и цели, но избегает неестественных притяжательных конструкций. Маркер сноски поставлен при слове «ржавчина», к которому относится лексическая альтернатива.
