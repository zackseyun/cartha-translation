base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/018.yaml
  text: So I spoke to the people in the morning[a], and my wife died in the evening. Then in the morning I did as I had been commanded.
translation:
  language: ru
  text: Утром я говорил народу, а вечером умерла моя жена. На следующее утро я сделал так, как мне было велено.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: я говорил
  rationale: Форма с повествовательным וַ продолжает последовательность событий; русский порядок предложений передаёт эту связь без обязательного повторения союза «и». Несовершенный вид «говорил» естественно обозначает обращение к народу в названное время.
- source_word: אֶל הָעָם
  choice: народу
  rationale: עָם означает народ как коллектив; глагольное управление по-русски естественно передаётся дательным падежом.
- source_word: בַּבֹּקֶר
  choice: утром / на следующее утро
  rationale: Первое употребление обозначает утро того дня; повторное употребление после смерти вечером указывает на последующее, то есть следующее, утро. Это уточнение передаёт очевидную хронологию контекста.
- source_word: וַתָּמָת
  choice: умерла
  rationale: מות — прямое обычное обозначение смерти; эвфемизм не требуется.
- source_word: אִשְׁתִּי
  choice: моя жена
  rationale: В данном супружеском контексте אִשָּׁה с суффиксом первого лица однозначно означает «моя жена».
- source_word: בָּעָרֶב
  choice: вечером
  rationale: Естественная русская передача временного обстоятельства, параллельного בַּבֹּקֶר.
- source_word: וָאַעַשׂ
  choice: я сделал
  rationale: עשה здесь означает исполнение ранее данного повеления; общий глагол сохраняет отсутствие явно названного дополнения в еврейском тексте.
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: Оборот выражает соответствие действия полученному повелению; «так, как» естественно и ясно по-русски.
- source_word: צֻוֵּיתִי
  choice: мне было велено
  rationale: Пассивная форма представляет Иезекииля получателем повеления. Безличная русская конструкция сохраняет пассивность и не называет подразумеваемого повелевающего сверх того, что сказано в стихе.
