  source_fidelity: 'Текст точно передаёт последовательность еврейского повествования: утреннее обращение Иезекииля к народу, смерть жены вечером и исполнение повеленного следующим утром. «На следующее утро» — оправданное явное выражение хронологии, следующей из указания на смерть вечером. Неопределённый объект глагола עשה сохранён в «я сделал так».'
