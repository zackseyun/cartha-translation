base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/009.yaml
  text: 'Therefore thus says the Lord Yahweh: Woe to the city of bloodshed! I also will make the firewood pile great[a][b].'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Горе городу кровопролития[a]! Я тоже увеличу груду дров[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «городу кровей»; это выражение означает город, отмеченный кровопролитием и виной за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я тоже сложу большой костёр».'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, связывающий это пророческое возвещение с предшествующим контекстом.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для современного русского языка передача устойчивой пророческой формулы.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה, сохраняя различие двух компонентов формулы.
- source_word: אוֹי
  choice: Горе
  rationale: Сохраняет силу возгласа, одновременно выражающего скорбь и возвещающего суд.
- source_word: עִיר הַדָּמִים
  choice: городу кровопролития
  rationale: Множественное דָּמִים здесь указывает на кровопролитие и вину за пролитую кровь; выбранная формулировка сохраняет образ и нравственное обвинение.
- source_word: גַּם אֲנִי
  choice: Я тоже
  rationale: Передаёт подчёркнутое участие самого Бога в объявленном действии.
- source_word: אַגְדִּיל
  choice: увеличу
  rationale: 'Точно передаёт каузативное значение формы: сделать больше, умножить.'
- source_word: הַמְּדוּרָה
  choice: груду дров
  rationale: В контексте котла и огня слово обозначает сложенное топливо; выражение конкретно, понятно и не вносит отсутствующей в тексте погребальной ассоциации.
theological_decisions:
- issue: Передача составного божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант непосредственно отражает и титул אֲדֹנָי, и личное имя יהוה, не сливая их в общее обозначение и не добавляя конфессиональной интерпретации.
- issue: Смысл выражения עִיר הַדָּמִים
  choice: город кровопролития
  alternative: кровавый город
  rationale: Существительное «кровопролитие» яснее сохраняет обвинение в совершённом насилии и возможный оттенок вины за кровь, тогда как «кровавый» может быть понято шире.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к еврейскому, но остаётся естественным; образ груды топлива сохранён без излишне специального слова «погребальный костёр».
