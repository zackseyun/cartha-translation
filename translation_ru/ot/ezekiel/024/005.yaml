  source_fidelity: Основная последовательность повелений и образ кипящего котла переданы верно. Однако מִבְחַר הַצֹּאן в данном кулинарном контексте естественнее передать как отборную овцу, а не неопределённое «лучшее из стада». Редкое דּוּר следует оставить отмеченным как лексически спорное; формулировка «сложи ... кости» допустима как один из вариантов, но сноска должна точнее показывать, что альтернативой является «груда костей».
  naturalness: «Пусть он кипит вовсю» разговорно окрашено для современного литературного библейского регистра. «Пусть он хорошенько кипит» сохраняет усиление и звучит нейтральнее. Явное «котёл» устраняет неясную русскую референцию местоимений.
  terminology: «Отборная овца» точно передаёт качество выбранного животного из стада; «сварятся» уместно для намеренно резкого образа костей, готовящихся в котле. Сноски a и b сохраняют соответствующие якоря и отражают неопределённость редкого слова и усилительную еврейскую конструкцию.
