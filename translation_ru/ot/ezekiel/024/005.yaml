base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/005.yaml
  text: Take the choicest of the flock[a], and also pile the bones under it; bring it to a boil, boil it well[b], and let its bones be cooked in it.
translation:
  language: ru
  text: Возьми отборную овцу из стада и сложи также кости под котлом[a]. Доведи его до кипения; пусть он хорошенько кипит[b], и пусть кости в нём сварятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и помести под ним также груду костей». Еврейское слово, переданное как «сложи», встречается редко, и его точное значение неясно; оно может обозначать груду костей. По контексту кости помещаются под котлом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вскипяти его кипение» — усилительная конструкция, означающая, что котёл должен хорошо кипеть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְחַר הַצֹּאן
  choice: лучшее из стада
  rationale: Сохраняет собирательный смысл выражения и значение отборного, лучшего без неоправданного уточнения числа животных.
- source_word: לָקֹוחַ
  choice: возьми
  rationale: Форма употреблена как прямое повеление в последовательности указаний.
- source_word: וְגַם דּוּר הָעֲצָמִים תַּחְתֶּיהָ
  choice: и сложи под котлом также кости
  rationale: Редкое דּוּר по контексту обозначает складывание или груду костей под котлом; русская формулировка передаёт действие естественно, а неоднозначность отмечена в сноске.
- source_word: רַתַּח רְתָחֶיהָ
  choice: доведи его до кипения, пусть он кипит вовсю
  rationale: Однокоренная усилительная конструкция передана естественным русским выражением, подчёркивающим сильное и продолжительное кипение.
- source_word: גַּם בָּשְׁלוּ עֲצָמֶיהָ בְּתוֹכָהּ
  choice: и пусть кости в нём сварятся
  rationale: Сохраняет прямую последовательность образа без добавления явно не выраженной целевой или причинной связи.
