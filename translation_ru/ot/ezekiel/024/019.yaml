  text: And the people said to me, “Will you not tell us what these things mean for us, that you are doing them?”
translation:
  language: ru
  text: 'И народ сказал мне: «Не скажешь ли ты нам, что значат для нас эти действия, которые ты совершаешь?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה אֵלֶּה לָנוּ
  choice: что для нас означает то
  rationale: Идиома буквально говорит «что это для нас»; по-русски естественно передаёт вопрос о значении знамения для народа.
- source_word: כִּי אַתָּה עֹשֶׂה
  choice: что ты делаешь
  rationale: Связано с указательным оборотом «то, что» и сохраняет отнесение вопроса к символическим действиям Иезекииля без дополнительного причинного оттенка.
theological_decisions:
- issue: Характер действий пророка как знамения
  choice: Не добавлять слово «знамение» в основной текст
  alternative: «что означает для нас это знамение, которое ты совершаешь?»
  rationale: В контексте действия имеют знаковый смысл, однако в самом еврейском тексте данного стиха слово «знамение» отсутствует; вопрос сохраняется в его исходной форме.
translation_notes:
  register: Современный литературный русский; вопросительная конструкция естественна и достойна по тону, при этом сохранена смысловая связь между действиями пророка и их значением для народа.
