  source_fidelity: Перевод точно передаёт риторический вопрос הֲלוֹא, временную конструкцию «в тот день, когда», действие лишения и последовательность объектов. «Оплот», «радость их великолепия» и «услада их глаз» сохраняют образность и намеренную компактность еврейских сочетаний. Передача מַשָּׂא נַפְשָׁם как «то, к чему устремлена их душа» является допустимым смысловым решением, а сноска надлежащим образом отмечает лексическую трудность. «Их сыновей и дочерей» обоснованно оформлены как пояснение к последнему члену ряда, без устранения синтаксической неоднозначности оригинала.
  naturalness: Текст звучит как современный литературный русский с уместно возвышенным пророческим регистром. Формы «сын человеческий», «оплот» и «услада» несколько традиционны, но не архаичны и хорошо соответствуют жанру. Конечная запятая и тире намеренно сохраняют незавершённую конструкцию, продолжающуюся в следующем стихе; это оправдано для повёрсточного текста по стихам.
