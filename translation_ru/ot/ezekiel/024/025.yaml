source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/ל֗וֹא בְּ/י֨וֹם קַחְתִּ֤/י מֵ/הֶם֙ אֶת מָ֣עוּזָּ֔/ם מְשׂ֖וֹשׂ תִּפְאַרְתָּ֑/ם אֶת מַחְמַ֤ד עֵֽינֵי/הֶם֙ וְ/אֶת מַשָּׂ֣א נַפְשָׁ֔/ם בְּנֵי/הֶ֖ם וּ/בְנוֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/025.yaml
  text: And you[a], son of man, will it not be that on the day when I take from them their stronghold, the joy of their glory, the delight of their eyes[b], and the desire of their soul—their sons and their daughters—
translation:
  language: ru
  text: А ты, сын человеческий, — разве не в тот день, когда Я отниму у них их оплот, радость их великолепия, усладу их глаз[a] и то, к чему устремлена их душа[b], — их сыновей и дочерей, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желание их глаз».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение допускает также передачу: «бремя их души» или «то, к чему влечётся их душа».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Традиционная и формально точная передача постоянного обращения к Иезекиилю; сохраняет повторяющийся пророческий титул.
- source_word: הֲלוֹא
  choice: разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно сочетается с последующим временным оборотом.
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Сохраняет явное указание на день события и звучит естественно в современном русском языке.
- source_word: קַחְתִּי מֵהֶם
  choice: Я отниму у них
  rationale: В данном контексте לקח с מן означает лишение или удаление; «отниму» ясно выражает действие суда, не уточняя его способ.
- source_word: מָעוּזָּם
  choice: их оплот
  rationale: «Оплот» сохраняет значение места или источника силы и защиты, а также допускает контекстуальное отнесение к святилищу и Иерусалиму без внесения этого пояснения в текст.
- source_word: מְשׂוֹשׂ תִּפְאַרְתָּם
  choice: радость их великолепия
  rationale: Сохраняет компактность и поэтическую напряжённость еврейского сочетания двух существительных, не сводя его к более однозначному толкованию вроде «то, чем они гордятся».
- source_word: מַחְמַד עֵינֵיהֶם
  choice: усладу их глаз
  rationale: Передаёт нечто драгоценное, желанное и радующее взор; выражение остаётся образным и уместным в возвышенной пророческой речи.
- source_word: מַשָּׂא נַפְשָׁם
  choice: то, к чему устремлена их душа
  rationale: Передаёт вероятный смысл предмета душевного стремления, сохраняя образ направленности души. Формулировка не скрывает лексической трудности, отмеченной в сноске.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: их сыновей и дочерей
  rationale: Точно воспроизводит названные в оригинале две группы и сохраняет их пояснительную связь с тем, к чему устремлена душа народа.
theological_decisions:
- issue: Что именно обозначает «их оплот»
  choice: Оставить образ без прямого уточнения
  alternative: Перевести как «Моё святилище» или «Иерусалим»
  rationale: Контекст указывает на святилище как предмет утраты, однако в самом стихе стоит образное מָעוֹז. Его сохранение не подменяет перевод контекстуальным толкованием.
- issue: Связь слов «их сыновей и дочерей» с предыдущим выражением
  choice: Оформить как пояснительное приложение к «тому, к чему устремлена их душа»
  alternative: Представить сыновей и дочерей как ещё один полностью самостоятельный член перечня
  rationale: Отсутствие нового показателя прямого дополнения перед «сыновьями и дочерьми» поддерживает приложение, но пунктуация сохраняет некоторую синтаксическую открытость незавершённого предложения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Тире отражают незавершённую синтаксическую конструкцию, продолжающуюся в следующем стихе, и выделяют пояснение «их сыновей и дочерей».
