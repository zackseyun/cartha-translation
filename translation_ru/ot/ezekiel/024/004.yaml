lexical_decisions:
- source_word: אֱסֹף
  choice: Собери
  rationale: Повелительная форма глагола אסף передана естественным русским императивом, сохраняющим значение собирания и помещения частей в котёл.
- source_word: נְתָחֶיהָ
  choice: куски мяса
  rationale: Существительное נתח обозначает отделённые при разделке куски; явное «мяса» проясняет кулинарный образ и не выходит за пределы значения слова.
- source_word: אֵלֶיהָ
  choice: в него
  rationale: Местоимение относится к котлу из контекста; русское «в него» естественно передаёт направление внутрь сосуда.
- source_word: כָּל נֵתַח טוֹב
  choice: все отборные куски
  rationale: טוֹב здесь характеризует желательные, качественные части мяса; «отборные» естественно передаёт контекстуальный смысл, а «все» сохраняет כָּל.
- source_word: יָרֵךְ וְכָתֵף
  choice: бедро и лопатку
  rationale: Названия частей туши переданы конкретно; «лопатка» в русском кулинарном контексте естественнее анатомического «плечо».
- source_word: מִבְחַר עֲצָמִים
  choice: лучшими костями
  rationale: Конструкция буквально указывает на отбор или лучшее из костей; творительный падеж обусловлен русским управлением глагола «наполнить».
- source_word: מַלֵּא
  choice: наполни его
  rationale: Императив מלא передан повелительной формой; дополнение «его» восстановлено из контекста и относится к котлу.
