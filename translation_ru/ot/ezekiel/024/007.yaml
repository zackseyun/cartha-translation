  source_fidelity: 'В черновике верно сохранены конкретный образ крови, женское олицетворение и противопоставление голой скалы земле, покрытой прахом. Однако «осталась» для הָיָה и «оставила» для שָׂמָתְהוּ добавляют значение остатка/покинутости, которого в еврейском тексте нет: сказано, что кровь находится в ней и что она поместила её на голую скалу.'
  naturalness: «Кровь её осталась среди неё» понятно, но стилистически менее точно и создаёт ненужное временное значение. Бессоюзное «кровь её — среди неё» естественно для сжатой пророческой речи; «положила» ясно и литературно передаёт действие помещения.
  terminology: «Голая скала», «вылила на землю» и «покрыть прахом» приемлемо передают образный ряд. Сноски уместно сохраняют буквальное «кровь» и культурный фон, не подменяя основной текст толкованием.
