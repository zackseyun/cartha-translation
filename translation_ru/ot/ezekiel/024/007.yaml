base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/007.yaml
  text: For her blood is in her midst[a]; she set it on a bare rock[b]. She did not pour it out on the ground to cover it with dust.
translation:
  language: ru
  text: 'Ибо кровь её — среди неё: она положила её на голую скалу, не вылила её на землю, чтобы покрыть её прахом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт объяснительно-причинную связь с предшествующим образом суда и естественно звучит по-русски.
- source_word: דָמָהּ
  choice: кровь её
  rationale: Сохраняет буквальный, конкретный образ крови; в контексте он также выражает вину за кровопролитие.
- source_word: בְּתוֹכָהּ הָיָה
  choice: осталась среди неё
  rationale: Глагол היה буквально обозначает состояние или наличие; «осталась» естественно передаёт здесь кровь, не удалённую из среды олицетворённого города, не устраняя образной неоднозначности.
- source_word: עַל צְחִיחַ סֶלַע
  choice: на голой скале
  rationale: Передаёт открытую, лишённую почвы каменную поверхность, на которой кровь остаётся видимой и не впитывается.
- source_word: שָׂמָתְהוּ
  choice: она оставила её
  rationale: 'Контекстуально естественная передача «поместила её»: кровь намеренно оставлена открытой на скале.'
- source_word: לֹא שְׁפָכַתְהוּ עַל הָאָרֶץ
  choice: не вылила на землю
  rationale: Сохраняет конкретную образность שׁפך и физический смысл הָאָרֶץ в данном контексте.
- source_word: לְכַסּוֹת עָלָיו עָפָר
  choice: чтобы покрыть её прахом
  rationale: עָפָר может означать пыль, прах или рыхлую землю; «прахом» сохраняет библейское достоинство стиля и образ покрытия пролитой крови.
theological_decisions:
- issue: Смысл открыто оставленной крови
  choice: Сохранён конкретный образ крови, открыто лежащей на скале, с пояснением возможного значения вины за кровопролитие в сноске.
  alternative: Передать דָמָהּ непосредственно как «вина за кровопролитие» или «кровопролитие».
  rationale: 'Богословская сила стиха заключена в самом образе: насилие Иерусалима не скрыто, а остаётся открытым. Более отвлечённый перевод преждевременно истолковал бы метафору.'
- issue: Референт женского рода
  choice: Сохранено местоимение «она» без подстановки имени Иерусалима.
  alternative: Явно назвать Иерусалим.
  rationale: Еврейский текст продолжает олицетворение города в женском роде; сохранение местоимения удерживает связь с контекстом и не добавляет отсутствующего в стихе имени.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан плавным, но параллельный образ крови, скалы, земли и праха сохранён. Формы женского рода поддерживают олицетворение Иерусалима.
