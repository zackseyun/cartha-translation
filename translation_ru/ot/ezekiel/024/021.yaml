base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/021.yaml
  text: 'Say to the house of Israel[a], ‘Thus says the Lord GOD: Behold, I am about to profane my sanctuary, the pride of your strength, the delight of your eyes, and the desire of your soul[c][b]; and your sons and your daughters whom you left behind will fall by the sword.’'
translation:
  language: ru
  text: 'Скажи дому Израиля: «Так говорит Владыка Яхве: вот, Я оскверню Моё святилище — гордость вашей силы, отраду ваших глаз и то, чем дорожат ваши души[a]. А ваши сыновья и дочери, которых вы оставили, падут от меча».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также перевести: «то, что щадят ваши души», «то, что дорого вашим душам» или «желание ваших душ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לְבֵית יִשְׂרָאֵל
  choice: Скажи дому Израиля
  rationale: Сохранены повелительное обращение к Иезекиилю и собирательное заветное наименование «дом Израиля».
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка Яхве
  rationale: Передана устойчивая пророческая формула; אֲדֹנָי переведено как «Владыка», а личное имя יהוה — как «Яхве», без смешения двух компонентов.
- source_word: הִנְנִי מְחַלֵּל
  choice: вот, Я оскверню
  rationale: הִנְנִי сохраняет торжественное указание на предстоящее Божье действие, а причастная конструкция в контексте выражает близкое будущее.
- source_word: מִקְדָּשִׁי
  choice: Моё святилище
  rationale: «Святилище» точнее формально передаёт מִקְדָּשׁ и не сужает значение до здания храма, хотя здесь подразумевается Иерусалимский храм.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: гордость вашей силы
  rationale: 'Сохранён необычный образ исходного текста: святилище было предметом гордости и уверенности Израиля.'
- source_word: מַחְמַד עֵינֵיכֶם
  choice: отраду ваших глаз
  rationale: Естественное русское выражение передаёт нечто желанное и драгоценное для глаз, сохраняя эмоциональный параллелизм.
- source_word: וּמַחְמַל נַפְשְׁכֶם
  choice: то, чем дорожат ваши души
  rationale: Редкое מַחְמַל связано с жалостью, щажением и бережным отношением; перевод сохраняет идею глубоко лелеемого предмета, не сводя её просто к желанию.
- source_word: וּבְנֵיכֶם וּבְנוֹתֵיכֶם
  choice: ваши сыновья и дочери
  rationale: Сохранена явная парная формулировка еврейского текста.
- source_word: אֲשֶׁר עֲזַבְתֶּם
  choice: которых вы оставили
  rationale: Нейтрально передано значение «оставить»; «бросили» или «покинули» могло бы неоправданно приписать нравственную вину.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: падут от меча
  rationale: Сохранена традиционная библейская метафора насильственной смерти от оружия.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Раздельно переданы титул אֲדֹנָי и личное имя יהוה. Это сохраняет структуру оригинала и избегает замены имени общим титулом.
- issue: Бог как совершающий осквернение собственного святилища
  choice: Я оскверню Моё святилище
  alternative: Я допущу осквернение Моего святилища
  rationale: В еврейском тексте Бог прямо назван субъектом действия. Каузативное или разрешительное истолкование возможно богословски, но не выражено явно и потому не внесено в основной текст.
- issue: Значение редкого מַחְמַל נַפְשְׁכֶם
  choice: то, чем дорожат ваши души
  alternative: желание ваших душ; то, что щадят ваши души
  rationale: Сохранена смысловая напряжённость между внутренней привязанностью и оттенком жалости/бережения; более узкое «желание» могло бы устранить редкую лексическую особенность.
