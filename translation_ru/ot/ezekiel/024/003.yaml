base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/003.yaml
  text: 'And speak a proverb to the rebellious house[a], and say to them, ‘Thus says the Lord GOD: Set on the pot; set it on, and also pour water into it.’'
translation:
  language: ru
  text: 'И скажи непокорному дому притчу[a] и скажи им: «Так говорит Господь Яхве: поставь котёл, поставь его и налей в него воды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образное изречение»; еврейское слово מָשָׁל может означать притчу, пословицу или иносказательное изречение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשֹׁל ... מָשָׁל
  choice: произнеси ... притчу
  rationale: Глагол и однокоренное существительное обозначают произнесение образного изречения. По-русски буквальное однокоренное повторение неестественно, поэтому смысловая связь передана сочетанием «произнеси ... притчу», а широта значения существительного отмечена в сноске.
- source_word: בֵּית הַמֶּרִי
  choice: мятежный дом
  rationale: Сохранён характерный для Иезекииля образ «дома», а определение передаёт упорное неповиновение, не сводя выражение просто к обозначению народа.
- source_word: מָשָׁל
  choice: притчу
  rationale: В данном контексте далее следует развёрнутый образ котла, поэтому «притча» естественнее русского «пословица»; возможная более широкая семантика вынесена в сноску.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי и позволяет без неестественного повтора титулов сохранить личное имя Яхве.
- source_word: שְׁפֹת הַסִּיר שְׁפֹת
  choice: поставь котёл, поставь его
  rationale: Сохранён настойчивый повтор повеления. Глагол в контексте означает поставить сосуд для приготовления пищи; добавлять «на огонь» не требуется, поскольку в еврейском тексте огонь прямо не назван.
- source_word: יְצֹק בּוֹ מָיִם
  choice: налей в него воды
  rationale: Естественная русская передача наливания воды в сосуд без добавочного значения «наполни».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה и не подменяет имя общим титулом. При этом «Владыка» звучит достойно и естественно в пророческой речи.
- issue: Характер обращения בֵּית הַמֶּרִי
  choice: мятежный дом
  alternative: дом непокорности
  rationale: Сохранена коллективная метафора «дома» и открытое обвинение в неповиновении без уточнения, которое могло бы сузить адресата сверх текста.
translation_notes:
  register: Современный литературный русский с сохранением торжественного пророческого тона. Повтор «поставь» намеренно не сглажен; традиционно-библейское выражение «мятежный дом» сохранено как значимый образ.
