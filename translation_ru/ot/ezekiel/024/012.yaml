base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/012.yaml
  text: With toil she has wearied herself[a], yet her abundant corrosion does not go out from her[b]; her corrosion remains in the fire.
translation:
  language: ru
  text: Она изнурила себя тяжкими трудами, но её обильная накипь не сошла с неё; её накипь — в огне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте заключительные слова эллиптичны: буквально «в огне — её накипь». Глагол не выражен; по контексту фразу понимают, например, как указание на накипь, остающуюся в огне, или на её предание огню.'
    reason: Сохранить синтаксическую неоднозначность оригинала и пояснить контекстные варианты без внесения глагола в основной текст.
lexical_decisions:
- source_word: תְּאֻנִים הֶלְאָת
  choice: Она изнурила себя тяжкими трудами
  rationale: תְּאֻנִים обозначает тягостные усилия или труды, а הֶלְאָת — изнеможение женского субъекта, то есть олицетворённого котла/города. Такая формулировка передаёт и усилие, и его изнуряющий результат.
- source_word: וְלֹא תֵצֵא מִמֶּנָּה
  choice: но ... не сошла с неё
  rationale: Сохранён конкретный образ нечистоты, которая не отделяется от поверхности котла; русское «не сошла» естественнее буквального «не вышла из неё» в данном контексте.
- source_word: רַבַּת חֶלְאָתָהּ
  choice: её обильная накипь
  rationale: רַבַּת указывает на большое количество или значительную массу, а חֶלְאָה — на въевшееся загрязнение/коррозионный налёт котла. «Накипь» сохраняет образ стойкого налёта, не сужая значение исключительно до ржавчины.
- source_word: בְּאֵשׁ חֶלְאָתָהּ
  choice: в огне — её накипь
  rationale: Сохранена эллиптическая, напряжённая конструкция еврейского текста без добавления глагола «остаётся» в основном тексте. בְּ передано как «в», обозначая пребывание накипи в огне.
