lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: В составе устойчивой пророческой формулы естественно передаёт наступление события откровения и сохраняет характерную библейскую конструкцию без излишней буквальности.
- source_word: דְבַר
  choice: слово
  rationale: В данной формуле обозначает сообщённое Богом откровение; «слово» прямо передаёт еврейское существительное и сохраняет пророческий регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно и естественно указывает на Иезекииля как адресата откровения.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В русском двоеточие естественно выполняет функцию еврейского вводного «говоря», открывая прямую речь следующего стиха и избегая неестественной формулы «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה; форма «Яхве» сохраняет это различие и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Конечное לֵאמֹר передано пунктуационно, поскольку далее следует прямая речь; это естественнее для русского языка.
