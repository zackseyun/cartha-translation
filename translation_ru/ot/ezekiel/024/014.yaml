reference: Ezekiel 24:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֲנִ֨י יְהוָ֤ה דִּבַּ֨רְתִּי֙ בָּאָ֣ה וְ/עָשִׂ֔יתִי לֹֽא אֶפְרַ֥ע וְ/לֹא אָח֖וּס וְ/לֹ֣א אֶנָּחֵ֑ם כִּ/דְרָכַ֤יִ/ךְ וְ/כַ/עֲלִילוֹתַ֨יִ/ךְ֙ שְׁפָט֔וּ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/014.yaml
  text: I[a], Yahweh, have spoken; it is coming[b], and I will do it. I will not hold back, nor will I spare, nor will I relent. According to your ways and according to your deeds they will judge you[c], declares the Lord GOD.
translation:
  language: ru
  text: 'Я, Яхве, сказал: это грядёт[a], и Я исполню. Я не отступлю[b], не пощажу и не изменю решения[c]. По твоим путям и по твоим делам будут судить тебя[d], — возвещает Владыка Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально форма означает «пришла» или «приходит»; подлежащее не названо и, вероятно, подразумевает объявленную кару или беду.
    reason: Сохранение временной и референциальной неоднозначности בָּאָה.
  - marker: b
    text: 'Возможный перевод: «не откажусь от этого» или «не ослаблю (суда)».'
    reason: Лексическая альтернатива для אֶפְרַע.
  - marker: c
    text: 'Или: «не смягчусь», «не передумаю». Глагол נָחַם может обозначать сожаление, перемену решения или отказ от намеченного действия.'
    reason: Сохранение смыслового диапазона богословски значимого глагола.
  - marker: d
    text: В еврейском тексте стоит неопределённое «они будут судить тебя»; исполнители суда не названы.
    reason: Пояснение неопределённого множественного числа שְׁפָטוּךְ.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула אֲדֹנָי.
- source_word: דִּבַּרְתִּי
  choice: сказал
  rationale: Совершенный вид передаёт завершённость и непреложную силу Божьего изречения; в русском контексте настоящее следствие ясно из последующих слов.
- source_word: בָּאָה
  choice: это грядёт
  rationale: Форма женского рода имеет подразумеваемое подлежащее — вероятнее всего, объявленную кару или беду; «грядёт» передаёт её неизбежное приближение.
- source_word: וְעָשִׂיתִי
  choice: и Я исполню
  rationale: В пророческой последовательности перфект выражает предстоящее и непреложное действие; «исполню» естественно отсылает к сказанному приговору.
- source_word: אֶפְרַע
  choice: не отступлю
  rationale: Глагол означает, что Яхве не удержится и не откажется от исполнения объявленного суда.
- source_word: אָחוּס
  choice: не пощажу
  rationale: В контексте суда חוס означает воздержаться от наказания из жалости, то есть пощадить.
- source_word: אֶנָּחֵם
  choice: не передумаю
  rationale: Передаёт отсутствие перемены в объявленном решении, не устраняя полностью присущее נָחַם напряжение между сожалением, переменой решения и отказом от кары.
- source_word: כִּדְרָכַיִךְ
  choice: по твоим путям
  rationale: Сохраняется этическая метафора жизненного пути и форма обращения к олицетворённому городу во втором лице единственного числа.
- source_word: וְכַעֲלִילוֹתַיִךְ
  choice: и по твоим делам
  rationale: «Дела» естественно передаёт поступки с нравственной окраской в судебном контексте.
- source_word: שְׁפָטוּךְ
  choice: будут судить тебя
  rationale: Сохранено активное неопределённо-личное множественное число еврейского текста без необоснованного уточнения исполнителей суда.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — следующее за ним личное имя, не смешивая их.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Транслитерация сохраняет личное заветное имя, тогда как «Господь» является титулом; форма «Яхве» ближе к принятой научной реконструкции, чем «Иегова».
- issue: Смысл נָחַם применительно к Богу
  choice: не передумаю
  alternative: не раскаюсь / не отменю кары / не смягчусь
  rationale: Выбор передаёт заявленную неизменность решения, не приписывая Богу нравственного проступка; сноска сохраняет более широкий смысловой диапазон глагола.
- issue: Неопределённые исполнители суда в שְׁפָטוּךְ
  choice: будут судить тебя
  alternative: тебя осудят / Я буду судить тебя
  rationale: Неопределённое множественное число оставлено без отождествления судей с Богом или конкретным народом, что сохраняет грамматическую и богословскую открытость текста.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Повтор «по твоим путям и по твоим делам» сохраняет параллелизм оригинала. Формы второго лица не уточняют грамматический женский род адресата, поскольку русские притяжательные формы здесь гендерно нейтральны.
