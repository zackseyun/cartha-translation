  text: וָ/אֹמַ֖ר אֲלֵי/הֶ֑ם דְּבַ֨ר יְהוָ֔ה הָיָ֥ה אֵלַ֖/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/020.yaml
  text: So I said to them[a], “The word of Yahweh came to me, saying,”
translation:
  language: ru
  text: 'Тогда я сказал им[a]: «Ко мне пришло слово Яхве:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «И я сказал им: „Ко мне было слово Яхве, говоря…“»'
    reason: Лексико-синтаксическая альтернатива, отражающая формальное устройство еврейской фразы.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Тогда я сказал
  rationale: Форма wayyiqtol продолжает повествовательную последовательность. «Тогда» естественно передаёт переход к ответу Иезекииля; более формальное «И я сказал» отмечено в сноске.
- source_word: אֲלֵיהֶם
  choice: им
  rationale: Предлог אֶל с суффиксом 3-го лица мужского рода множественного числа прямо указывает на адресатов речи.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена устойчивая пророческая формула и значение דָּבָר как «слово», без более толковательного «весть» или «послание».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: הָיָה אֵלַי
  choice: ко мне пришло
  rationale: Буквально конструкция означает «было ко мне», но в современной русской речи формула естественно передаётся как «ко мне пришло», без изменения смысла.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» служит введением последующей прямой речи. В современном русском эту функцию естественно выполняет двоеточие; буквальное «говоря» здесь было бы тяжеловесным.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Порядок слов «Ко мне пришло слово Яхве» остаётся естественным и одновременно подчёркивает получателя откровения. Финальное двоеточие показывает, что речь продолжается в следующем стихе.
