base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/023.yaml
  text: Your turbans will be on your heads and your sandals on your feet[a]; you will not mourn and you will not weep[c][b], but you will waste away in your iniquities and groan to one another.
translation:
  language: ru
  text: Ваши тюрбаны будут у вас на головах, а сандалии — на ногах[a]. Вы не будете ни скорбеть, ни плакать, но будете чахнуть в своих беззакониях[b] и стонать — каждый своему брату[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «головные уборы»; еврейское слово означает нарядный головной убор, вероятно тюрбан, который в данном контексте не снимают в знак траура.'
    reason: lexical_alternative
  - marker: b
    text: «В своих беззакониях» можно также понять как «из-за своих беззаконий» или «в своей вине».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «каждый к своему брату».'
    reason: literal_rendering
lexical_decisions:
- source_word: פְאֵרֵיכֶם
  choice: ваши тюрбаны
  rationale: פְּאֵר обозначает нарядный головной убор; в контексте траурных обычаев речь, вероятнее всего, о тюрбане, который не снимают. Множественное число передаёт еврейскую форму.
- source_word: נַעֲלֵיכֶם
  choice: сандалии
  rationale: Обычное обозначение обуви; «сандалии» исторически конкретнее, чем общее «обувь».
- source_word: תִסְפְּדוּ
  choice: скорбеть
  rationale: Глагол может обозначать траур и формальное оплакивание умершего; «скорбеть» естественно сочетается с последующим «плакать».
- source_word: תִבְכּוּ
  choice: плакать
  rationale: Прямой и стилистически уместный эквивалент בכה.
- source_word: נְמַקֹּתֶם
  choice: будете чахнуть
  rationale: Форма от מקק передаёт постепенное истощение или угасание; «чахнуть» сохраняет образ внутреннего разрушения, не усиливая его до буквального гниения.
- source_word: בַּעֲוֺנֹתֵיכֶם
  choice: в своих беззакониях
  rationale: Сохраняется предлог ב и ёмкость עָוֹן, которое может обозначать беззаконие, вину и её последствия; причинное толкование не вносится в основной текст.
- source_word: נְהַמְתֶּם
  choice: стонать
  rationale: נהם обозначает низкий звук страдания или мучения; «стонать» естественно передаёт этот смысл.
- source_word: אִישׁ אֶל אָחִיו
  choice: обращаясь друг к другу
  rationale: Так передаётся направленность действия одного человека к другому в естественной русской форме; буквальная мужская и родственная формулировка сохранена в сноске.
theological_decisions:
- issue: Родовая и родственная формулировка אִישׁ אֶל אָחִיו
  choice: друг к другу в основном тексте с буквальным вариантом в сноске
  alternative: каждый к своему брату
  rationale: Контекст обращён ко всему народу, а идиоматическое сочетание выражает взаимное действие. Естественная русская формулировка не исключает мужчин, тогда как сноска сохраняет грамматическую и родственную образность оригинала.
- issue: Значение עָוֹן в контексте суда
  choice: беззакония
  alternative: вина; наказание за беззакония
  rationale: Слово охватывает проступок, вину и последствия. Основной текст сохраняет наиболее прямое значение, а сноска отмечает смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Парная конструкция «ни скорбеть, ни плакать» передаёт запрет траурных действий; неоднозначность בַּעֲוֹנֹתֵיכֶם сохранена в основном тексте и пояснена в сноске.
