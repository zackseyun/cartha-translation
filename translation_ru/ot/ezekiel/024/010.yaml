    rationale: Глагол הַרְבֵּה велит увеличить количество дров, но не говорит, что дрова добавляются к уже сложенным или горящим.
  - severity: medium
    issue: «Довари мясо до конца» предполагает, что мясо уже варится.
    rationale: הָתֵם выражает доведение до полной готовности, но не содержит приставочного значения продолжения ранее начатой варки.
  - severity: high
