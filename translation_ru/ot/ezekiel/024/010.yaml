review_pass:
  verdict: revise
  source_fidelity: 'В целом последовательность повелений и образ интенсивного приготовления переданы верно. Однако «подложи» подразумевает уже горящий огонь и добавление топлива, чего еврейский текст прямо не уточняет; «довари» также предполагает начатый ранее процесс. Сочетание «свари навар» семантически и стилистически неудачно: «навар» уже означает результат варки и не передаёт с достаточной осторожностью редкое הַמֶּרְקָחָה («смесь/варево»).'
  naturalness: «Положи побольше дров», «доведи мясо до готовности» и «приготовь варево» естественны для современного литературного русского и сохраняют краткий, напряжённый ритм оригинала. «Пусть кости обуглятся» уместно передаёт итоговое следствие сильного огня.
  terminology: «Мясо» оправдано кулинарным контекстом, хотя בָּשָׂר буквально «плоть». Для неоднозначной пары רקח / מֶרְקָחָה выбран нейтральный основной вариант «приготовь варево», а варианты «составь смесь» и «свари похлёбку» вынесены в примечание без догматизации лексического значения.
