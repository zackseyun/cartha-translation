    reason: lexical_alternative
  - marker: c
    text: 'Или: «обгорят»; «будут опалены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה הָעֵצִים
  choice: Подложи побольше дров
  rationale: Каузативный императив от רבה требует увеличить количество дров. В данном контексте естественная русская команда «подложи побольше дров» передаёт действие у котла; вариант «нагромозди дров» буквальнее передал бы образ кучи, но звучит менее естественно.
- source_word: הַדְלֵק הָאֵשׁ
  choice: разожги огонь
  rationale: Императив от דלק в породе hифиль означает зажечь или разжечь; устойчивое русское сочетание «разожги огонь» сохраняет энергичность повеления.
- source_word: הָתֵם הַבָּשָׂר
  choice: довари мясо до конца
  rationale: Глагол תמם выражает доведение действия до завершения. «Довари ... до конца» ясно передаёт полноту приготовления; «мясо» естественно в кулинарном контексте, тогда как буквальное «плоть» по-русски здесь звучало бы неестественно.
- source_word: וְהַרְקַח הַמֶּרְקָחָה
  choice: свари навар
  rationale: Редкое сочетание רקח с מֶרְקָחָה буквально связано с приготовлением или составлением смеси. В образе котла «свари навар» сохраняет кулинарный смысл, не исключая значения густой смеси или варева.
- source_word: וְהָעֲצָמוֹת יֵחָרוּ
  choice: и пусть кости обуглятся
  rationale: Нифаль глагола חרר указывает на обгорание от сильного жара. «Пусть ... обуглятся» точно передаёт результат и форму неповелительного юссивного пожелания/указания.
