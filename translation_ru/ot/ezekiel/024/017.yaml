  source_fidelity: 'Требуется исправление. «Стонет» — форма 3-го лица настоящего времени, тогда как הֵאָנֵק является повелением единственного числа: «Стена́й». «По умершей» необоснованно конкретизирует формульное מֵתִים («по умершим/по мёртвым») по ближайшему контексту. «Хлеба, принесённого людьми» переносит вероятное толкование из примечания в основной текст; в еврейском стоит компактное «хлеба людей».'
  naturalness: После замены личной формы на повелительную текст звучит естественно и сохраняет краткий, повелительный строй. «Стена́й молча» намеренно передаёт напряжённое сочетание глагола скорби и требования молчания; вариант «Стена́й в молчании» возможен, но менее лаконичен.
  terminology: «Тюрбан» и «сандалии» приемлемы. «Верхнюю губу» следует оставить в основном тексте как менее узкое и более лексически прозрачное обозначение שָׂפָם; «усы» уместны как вариант в примечании. «Траур по умершим» передаёт обрядовый характер עשה אבל без привязки к одному лицу.
