source:
  edition: WLC
  text: הֵאָנֵ֣ק דֹּ֗ם מֵתִים֙ אֵ֣בֶל לֹֽא תַֽעֲשֶׂ֔ה פְאֵֽרְ/ךָ֙ חֲב֣וֹשׁ עָלֶ֔י/ךָ וּ/נְעָלֶ֖י/ךָ תָּשִׂ֣ים בְּ/רַגְלֶ֑י/ךָ וְ/לֹ֤א תַעְטֶה֙ עַל שָׂפָ֔ם וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/017.yaml
  text: Groan silently[a]; do not make mourning for the dead. Bind your turban on yourself, and put your sandals on your feet. Do not cover over your mustache[b], and do not eat the bread of men.
translation:
  language: ru
  text: Стена́й молча[a]; не совершай траура по умершим. Повяжи на себе свой тюрбан и надень сандалии на ноги. Не закрывай верхнюю губу[b] и не ешь хлеба людей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вздыхай безмолвно». Еврейское выражение соединяет проявление скорби с повелением сохранять молчание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не закрывай усы». Речь идёт об области верхней губы, которую закрывали в знак скорби.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «хлеба людей». Вероятно, имеется в виду пища, которую другие приносили скорбящим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאָנֵק דֹּם
  choice: Стонет молча
  rationale: Сочетание повелений передаёт выражение скорби, которое должно оставаться сдержанным и не переходить в обычный публичный плач. Парадоксальное сочетание «стонать молча» сохраняет напряжение еврейского текста.
- source_word: מֵתִים אֵבֶל לֹא תַעֲשֶׂה
  choice: не совершай траура по умершей
  rationale: Оборот означает соблюдение траурных обрядов. Единственное событие в непосредственном контексте — смерть жены Иезекииля, поэтому по-русски естественно конкретизировать «по умершей», не сводя запрет лишь к внутренней печали.
- source_word: פְאֵרְךָ חֲבוֹשׁ עָלֶיךָ
  choice: Повяжи на себе свой тюрбан
  rationale: פְאֵר обозначает почётный головной убор, противопоставленный траурному виду; חבש передаёт действие повязывания или закрепления.
- source_word: וּנְעָלֶיךָ תָּשִׂים בְּרַגְלֶיךָ
  choice: надень сандалии на ноги
  rationale: Естественная русская передача буквального указания, подразумевающего отказ от обычая ходить босиком в знак скорби.
- source_word: וְלֹא תַעְטֶה עַל שָׂפָם
  choice: Не закрывай верхнюю губу
  rationale: שָׂפָם обозначает область верхней губы или усов; «верхнюю губу» точнее описывает закрываемую часть лица и не предполагает непременно наличие усов.
- source_word: וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵל
  choice: не ешь хлеба, принесённого людьми
  rationale: Буквально «хлеб людей»; в контексте траурных обычаев, вероятно, имеется в виду пища, которую другие приносили скорбящему. Добавление «принесённого» делает смысл понятным, а буквальная форма сохранена в примечании.
theological_decisions:
- issue: Запрет траура как знакового действия
  choice: Передать конкретные запреты на обычные траурные действия без догматического объяснения каждого обычая.
  alternative: Истолковать перечисленные действия исключительно как священнические предписания или только как знаки ритуальной нечистоты.
  rationale: В контексте это повеление Иезекиилю служит пророческим знамением; сам стих перечисляет практики, но не объясняет отдельное богословское значение каждой из них.
- issue: Объект траура
  choice: «по умершей»
  alternative: «по умершим» или «по мёртвым» как формально множественное выражение.
  rationale: מֵתִים может употребляться в собирательном значении в формуле траура, однако ближайший контекст говорит о смерти жены пророка. Женский род естественно связывает повеление с этим событием, а более буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и повелительный. Ритуальные реалии переданы понятно, но без конфессиональной конкретизации; неоднозначности вынесены в сноски.
