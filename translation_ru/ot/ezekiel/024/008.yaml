  yaml_path: translation/ot/ezekiel/024/008.yaml
  text: To stir up wrath[a], to take vengeance, I have set her blood on a bare rock[b], so that it would not be covered.
translation:
  language: ru
  text: Чтобы разжечь ярость и отомстить[a], Я положил её кровь[b] на голую скалу, чтобы её не покрыли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отомстить отмщением»; в еврейском тексте глагол соединён с однокоренным существительным для усиления.'
    reason: lexical_alternative
  - marker: b
    text: В данном контексте «её кровь» может также означать совершённое ею кровопролитие или вину за кровь, однако еврейский текст сохраняет конкретный образ крови.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: вызвать
  rationale: Каузативный инфинитив породы hифиль от עלה в сочетании с חֵמָה означает «сделать так, чтобы ярость поднялась», то есть «вызвать ярость»; это естественно по-русски и сохраняет причинный смысл.
- source_word: חֵמָה
  choice: ярость
  rationale: В пророческом контексте суда слово обозначает сильный, пылающий гнев; «ярость» передаёт интенсивность без добавления отсутствующего в тексте определения.
- source_word: לִנְקֹם נָקָם
  choice: совершить отмщение
  rationale: Инфинитив с однокоренным существительным усиливает идею воздаяния. «Совершить отмщение» звучит достойно и передаёт подчёркнутый характер выражения.
- source_word: נָתַתִּי
  choice: Я положил
  rationale: При указании места נתן означает «положить, поместить». «Положил» сохраняет конкретный образ намеренно оставленной на скале крови.
- source_word: דָּמָהּ
  choice: её кровь
  rationale: Сохранён буквальный конкретный образ еврейского текста; в контексте выражение также может подразумевать совершённое ею кровопролитие или лежащую на ней вину за кровь.
- source_word: צְחִיחַ סָלַע
  choice: голую скалу
  rationale: Сочетание обозначает открытую, ничем не покрытую поверхность скалы, где кровь остаётся на виду и не впитывается в землю.
- source_word: לְבִלְתִּי הִכָּסוֹת
  choice: чтобы её не покрыли
  rationale: 'Конструкция выражает цель: кровь намеренно оставлена открытой. Неопределённо-личная форма естественна по-русски и не вводит нового действующего лица.'
theological_decisions:
- issue: Действующее лицо и судебная цель выставления крови напоказ
  choice: Говорящий намеренно кладёт кровь Иерусалима на открытую скалу, чтобы вызвать ярость и совершить отмщение.
  alternative: Считать строку лишь описанием непокрытой крови, не подчёркивая намеренного действия Бога.
  rationale: Форма первого лица נָתַתִּי («Я положил») и целевые инфинитивы указывают на сознательное судебное действие говорящего. Перевод сохраняет эту связь, не уточняя сверх текста, чья именно ярость вызывается.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; конкретный образ крови на голой скале и намеренная судебная направленность стиха сохранены.
