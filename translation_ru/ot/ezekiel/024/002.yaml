base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/002.yaml
  text: 'Son of man[a], write down for yourself the name of the day[c][b], this very day: the king of Babylon has laid siege against Jerusalem on this very day.'
translation:
  language: ru
  text: 'Сын человеческий, запиши себе дату этого самого дня[a]: в этот самый день царь Вавилона осадил Иерусалим[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «запиши себе название дня». Здесь имеется в виду запись даты.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подступил к Иерусалиму». В данном военном контексте речь идёт о начале осады города.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет характерное для книги Иезекииля обращение и его древнееврейский образ, не сводя его к общему «смертный».
- source_word: כתוב לְךָ
  choice: запиши
  rationale: Императив требует сделать запись; значение לְךָ в русском естественно передаётся самой формой поручения, без тяжеловесного «для себя».
- source_word: אֶת שֵׁם הַיּוֹם
  choice: дату
  rationale: Буквально выражение означает «название дня», но в данном контексте речь идёт об обозначении календарного дня; «дату» ясно и естественно передаёт эту функцию.
- source_word: אֶת עֶצֶם הַיּוֹם הַזֶּה
  choice: именно этот день
  rationale: Передаёт усилительное значение עֶצֶם и подчёркивает точность указанного дня.
- source_word: סָמַךְ
  choice: осадил
  rationale: В военном контексте глагол обозначает выступление против города, приведшее к осаде; совершенный вид соответствует форме и сообщению о событии этого дня.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямой и нормативный перевод древнееврейской сопряжённой конструкции.
- source_word: אֶל יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: При русском глаголе «осадил» объект естественно оформляется прямым дополнением; враждебная направленность выражена самим глаголом.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в этот самый день
  rationale: Сохраняет повтор исходного выражения и его акцент на точном совпадении во времени.
