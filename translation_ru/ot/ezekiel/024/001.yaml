source:
  edition: WLC
  text: וַ/יְהִי֩ דְבַר יְהוָ֨ה אֵלַ֜/י בַּ/שָּׁנָ֤ה הַ/תְּשִׁיעִית֙ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י בֶּ/עָשׂ֥וֹר לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/001.yaml
  text: And the word of Yahweh came to me in the ninth year[a], in the tenth month, on the tenth day of the month, saying,
translation:
  language: ru
  text: 'И было ко мне слово Яхве в девятый год[a], в десятый месяц, в десятый день месяца:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сказано просто «в девятый год»; даты у Иезекииля обычно отсчитываются от переселения царя Иехонии.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: И было ко мне слово Яхве
  rationale: Сохраняет традиционную пророческую формулу и повествовательную связь וַ־; оборот «было ко мне слово» в современном литературном русском звучит возвышенно, но понятно, не превращая דָּבָר в более толковательное «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בַּשָּׁנָה הַתְּשִׁיעִית
  choice: в девятый год
  rationale: Исходный текст не называет здесь точку отсчёта; она поясняется в сноске без добавления в основной текст.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: в десятый месяц
  rationale: Точная и естественная передача календарной формулы.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: в десятый день месяца
  rationale: Явно передаёт день внутри месяца и сохраняет повтор исходного текста.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит содержание последующей речи в русском языке и функционально передаёт לֵאמֹר без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя YHWH. «Яхве» сохраняет его как имя и не подменяет титулом; форма «Иегова» основана на более позднем смешении согласных имени с огласовкой заменяющего чтения.
- issue: Точка отсчёта девятого года
  choice: Не уточнять в основном тексте
  alternative: «в девятый год изгнания царя Иехонии»
  rationale: Стих говорит только «в девятый год». Вероятная система датировки Иезекииля разъясняется в примечании, чтобы не выдавать контекстуальный вывод за прямо выраженный текст.
translation_notes:
  register: Современный литературный русский с достоинством пророческой формулы. Синтаксис слегка возвышенный, но ясный; двоеточие вводит речь, начинающуюся в следующем стихе.
