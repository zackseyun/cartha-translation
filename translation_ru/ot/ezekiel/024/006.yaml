  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אוֹי֮ עִ֣יר הַ/דָּמִים֒ סִ֚יר אֲשֶׁ֣ר חֶלְאָתָ֣/ה בָ֔/הּ וְ/חֶ֨לְאָתָ֔/הּ לֹ֥א יָצְאָ֖ה מִמֶּ֑/נָּה לִ/נְתָחֶ֤י/הָ לִ/נְתָחֶ֨י/הָ֙ הוֹצִיאָ֔/הּ לֹא נָפַ֥ל עָלֶ֖י/הָ גּוֹרָֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/006.yaml
  text: 'Therefore thus says the Lord GOD: Woe to the city of bloodshed[a], the pot whose rust is in it, and whose rust has not gone out from it! Bring it out piece by piece[b]; no lot has fallen on it.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Горе городу кровопролития — котлу, в котором есть ржавчина и с которого она не сошла! Выкладывай из него кусок за куском; на него не пал жребий».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, связывающий объявление суда с предшествующим знамением.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная русская форма традиционной пророческой формулы посланника.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сохраняет оба элемента титула: אֲדֹנָי как «Владыка» и личное имя יהוה как «Яхве», избегая неестественного повтора «Господь Господь».'
- source_word: אוֹי
  choice: Горе
  rationale: Передаёт одновременно плач и грозное пророческое осуждение.
- source_word: עִיר הַדָּמִים
  choice: город кровопролития
  rationale: Множественное דמים здесь обозначает пролитую кровь и вину за насилие, а не просто физическую кровь.
- source_word: סִיר
  choice: котёл
  rationale: Конкретно и естественно продолжает образ большого сосуда для варки, установленный контекстом главы.
- source_word: חֶלְאָה
  choice: накипь
  rationale: Обозначает нечистый или коррозийный налёт, приставший к котлу; «накипь» естественна в образе варочного сосуда, а неоднозначность отмечена в сноске.
- source_word: לִנְתָחֶיהָ לִנְתָחֶיהָ
  choice: кусок за куском
  rationale: 'Повтор выражает распределительное значение: содержимое следует извлекать по отдельным кускам.'
- source_word: הוֹצִיאָהּ
  choice: вынь из него всё
  rationale: В контексте котла повеление означает удалить его содержимое; «всё» передаёт охват целого, выраженный женским местоименным суффиксом, соотносимым с городом-котлом.
- source_word: לֹא נָפַל עָלֶיהָ גּוֹרָל
  choice: жребий о нём не выпал
  rationale: Сохраняет исходный образ выпадающего жребия и не превращает фразу в более истолковывающее повеление.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул и личное имя Бога и непосредственно представляет тетраграмматон, не добавляя конфессионального толкования.
- issue: Объект суда в образе котла
  choice: Сохранён переход между городом и котлом без явного пояснения в основном тексте
  alternative: Истолковать куски как отдельных жителей города
  rationale: Образ намеренно совмещает город, котёл и его содержимое; прямое отождествление кусков с конкретной группой людей сузило бы метафору сверх сказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя, при этом сохранены образ котла, неоднозначный характер налёта и формула выпавшего жребия.
