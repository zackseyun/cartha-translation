revisions:
- from: 'Поэтому так говорит Владыка Яхве: «Горе городу кровопролития, котлу, на котором накипь[a] и с которого она не сошла! Вынь из него всё, кусок за куском[b]; жребий о нём не выпал».'
  to: 'Поэтому так говорит Владыка Яхве: «Горе городу кровопролития — котлу, в котором есть ржавчина и с которого она не сошла! Выкладывай из него кусок за куском; на него не пал жребий».'
  rationale: Исправлены основной эквивалент для חֶלְאָה, необоснованное добавление «всё» и образ жребия. Сохранены метафорический переход от города к котлу, распределительное повторение «кусок за куском», высокий регистр и передача божественного имени «Яхве».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:18:19Z'
review_pass:
  verdict: revise
  source_fidelity: Требуется уточнение. חֶלְאָה в образе котла прежде всего обозначает ржавчину/коррозийный налёт; «накипь» чрезмерно сужает образ до минерального отложения. В повелении повтор לִנְתָחֶיהָ требует передачи «кусок за куском», но добавленное «всё» не выражено в оригинале. Оборот «жребий о нём не выпал» не соответствует образу נָפַל ... גּוֹרָל («жребий пал на...»).
  naturalness: «Котлу, на котором накипь» менее точно и менее естественно, чем «котлу, в котором есть ржавчина и с которого она не сошла». «Выкладывай из него кусок за куском» ясно передаёт действие с содержимым котла, не приписывая тексту дополнительное «всё».
  terminology: «Владыка Яхве» последовательно передаёт אֲדֹנָי יְהוִה и уместно в высоком пророческом регистре. «Город кровопролития» и «котёл» удачны. Основной термин следует передать как «ржавчина», сохранив «накипь» и «грязный налёт» в сноске в качестве возможных образных альтернатив.
  issues:
  - severity: medium
    issue: «накипь» выбрана как основной эквивалент חֶלְאָה
    rationale: Слово относится к въевшемуся нечистому/коррозийному налёту; в данном контексте «ржавчина» точнее передаёт основной образ и согласуется с тем, что налёт не сходит с котла.
  - severity: medium
    issue: Добавление «всё» в повелении
    rationale: В оригинале есть повеление извлекать/выкладывать с распределительным «кусок за куском», но нет отдельного слова «всё».
  - severity: medium
    issue: «жребий о нём не выпал»
    rationale: Глагольный образ исходного текста — жребий «пал на» предмет; предлог «о» меняет образ и звучит неестественно.
  revised_text: 'Поэтому так говорит Владыка Яхве: «Горе городу кровопролития — котлу, в котором есть ржавчина и с которого она не сошла! Выкладывай из него кусок за куском; на него не пал жребий».'
  revised_footnotes:
