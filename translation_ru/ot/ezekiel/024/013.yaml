  text: בְּ/טֻמְאָתֵ֖/ךְ זִמָּ֑ה יַ֤עַן טִֽהַרְתִּי/ךְ֙ וְ/לֹ֣א טָהַ֔רְתְּ מִ/טֻּמְאָתֵ/ךְ֙ לֹ֣א תִטְהֲרִי ע֔וֹד עַד הֲנִיחִ֥/י אֶת חֲמָתִ֖/י בָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/013.yaml
  text: In your uncleanness is lewdness[a]. Because I cleansed you, but you were not cleansed from your uncleanness[b], you will not be cleansed anymore until I have satisfied my wrath against you.
translation:
  language: ru
  text: В твоей нечистоте — распутство[a]. Поскольку Я очистил тебя, но ты не очистилась от своей нечистоты, ты больше не очистишься, пока Я не утолю на тебе Свою ярость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злодейство», «постыдная безнравственность». Еврейское слово нередко обозначает бесстыдное, в том числе половое, распутство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пока не дам Моей ярости успокоиться на тебе»; речь идёт о ярости, полностью осуществившей суд.'
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּטֻמְאָתֵךְ
  choice: в твоей нечистоте
  rationale: Сохраняет предлог ב и многозначность טֻמְאָה, которая у Иезекииля охватывает как нравственную, так и обрядовую нечистоту.
- source_word: זִמָּה
  choice: распутство
  rationale: В книге Иезекииля слово часто обозначает постыдную половую безнравственность; «распутство» передаёт этот оттенок точнее, чем общее «зло».
- source_word: טִהַרְתִּיךְ
  choice: Я очищал тебя
  rationale: Русский несовершенный вид передаёт совершавшееся Богом действие, не утверждая вопреки следующей части, что требуемый результат уже был достигнут.
- source_word: וְלֹא טָהַרְתְּ
  choice: но ты не очистилась
  rationale: Передаёт контраст и женский род обращения к Иерусалиму; формулировка сохраняет напряжение между Божьим очищающим действием и отсутствием результата.
- source_word: לֹא תִטְהֲרִי עוֹד
  choice: ты больше не очистишься
  rationale: Естественно передаёт отрицание будущего действия и значение עוֹד.
- source_word: עַד הֲנִיחִי אֶת חֲמָתִי בָּךְ
  choice: пока Я не утолю на тебе Мою ярость
  rationale: Передаёт идиому о ярости, которая приходит к покою после полного осуществления суда, и сохраняет направленность בָּךְ на Иерусалим.
theological_decisions:
- issue: Следует ли понимать טִהַרְתִּיךְ как успешно завершённое или как не достигшее результата очищение
  choice: Я очищал тебя
  alternative: Я очистил тебя; Я пытался очистить тебя
  rationale: Несовершенный вид не добавляет отсутствующего в еврейском тексте глагола «пытаться», но позволяет следующей фразе прямо показать, что очищение не достигло результата.
- issue: Как передать образ ярости, которой Бог даёт покой на Иерусалиме
  choice: пока Я не утолю на тебе Мою ярость
  alternative: пока не дам Моей ярости успокоиться на тебе; пока не израсходую на тебе Мой гнев
  rationale: Выбранная формулировка выражает полноту исполнения суда, не превращая образ в техническое учение об искуплении и не ослабляя его до простого исчезновения эмоции.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Обращение к Иерусалиму последовательно передано формами женского рода. Повтор «нечистота — очистилась — очистишься» намеренно сохраняет корневую связь еврейского текста.
