lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит очередное пророческое сообщение. «И было» естественно сохраняет традиционную библейскую формулу и связь с повествованием.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דבר обозначает исходящее от Бога слово или возвещение; «слово» сохраняет конкретность исходного выражения без пояснительного расширения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица прямо указывает на адресата божественного слова; «ко мне» соответствует устойчивому русскому обороту.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит прямую речь следующего стиха. В современном русском эту функцию естественно и без потери смысла передаёт двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Форма «Яхве» передаёт его транслитерацией и не подменяет титулом.
translation_notes:
  register: Современный литературный русский с сохранением краткой и торжественной пророческой формулы. Порядок «ко мне слово Яхве» выбран как естественный для устойчивого библейского оборота; двоеточие вводит продолжение речи в следующем стихе.
