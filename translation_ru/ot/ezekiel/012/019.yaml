  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֶל עַ֣ם הָ/אָ֡רֶץ כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לְ/יוֹשְׁבֵ֤י יְרוּשָׁלִַ֨ם֙ אֶל אַדְמַ֣ת יִשְׂרָאֵ֔ל לַחְמָ/ם֙ בִּ/דְאָגָ֣ה יֹאכֵ֔לוּ וּ/מֵֽימֵי/הֶ֖ם בְּ/שִׁמָּמ֣וֹן יִשְׁתּ֑וּ לְמַ֜עַן תֵּשַׁ֤ם אַרְצָ/הּ֙ מִ/מְּלֹאָ֔/הּ מֵ/חֲמַ֖ס כָּֽל הַ/יֹּשְׁבִ֥ים בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/019.yaml
  text: 'And say to the people of the land[a], ‘Thus says the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel: They will eat their bread with anxiety and drink their water with horror[b], so that her land may be made desolate of its fullness because of the violence of all who dwell in it.’'
translation:
  language: ru
  text: 'И скажи народу этой земли: «Так говорит Владыка Яхве о жителях Иерусалима на земле Израиля: свой хлеб они будут есть в тревоге, а воду пить в ужасе[a], чтобы её земля опустела, лишившись всего, что её наполняет[b], — из-за насилия всех, кто живёт на ней».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в оцепенении», «в смятении». Еврейское слово может обозначать как ужас перед разорением, так и состояние опустошённости.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы её земля опустела от своей полноты»; то есть лишилась всего, чем была наполнена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: народ этой земли
  rationale: Передаёт устойчивое еврейское выражение без превращения его в обозначение особого общественного класса; указательное «этой» естественно в данном контексте обращения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное заветное имя יהוה и позволяет избежать неестественного сочетания «Господь Господь».
- source_word: לְיוֹשְׁבֵי יְרוּשָׁלַם אֶל אַדְמַת יִשְׂרָאֵל
  choice: о жителях Иерусалима на земле Израиля
  rationale: Предлог после формулы пророческой речи допускает значение «о, относительно»; так ясно различаются адресаты речи и те, о ком она возвещается.
- source_word: בִּדְאָגָה
  choice: в тревоге
  rationale: Существительное обозначает тревожную озабоченность и страх; выражение естественно по-русски и сохраняет эмоциональную силу.
- source_word: בְּשִׁמָּמוֹן
  choice: в ужасе
  rationale: В параллели с «в тревоге» слово обозначает потрясение, оцепенение или ужас перед разорением; вариант не сводит его значение только к физическому запустению.
- source_word: תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ
  choice: её земля опустела, лишившись всего, что её наполняет
  rationale: Глагол передан как наступление запустения, а מן — в лишительном значении. Развёрнутая формулировка естественно выражает образ «полноты» земли.
- source_word: מֵחֲמַס
  choice: из-за насилия
  rationale: חָמָס обозначает насилие, притеснение и жестокое беззаконие; предлог מן здесь естественно понимать как указание причины суда.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает два элемента титула и открыто передаёт личное имя Бога, не добавляя конфессионального толкования.
- issue: Цель или результат в לְמַעַן
  choice: чтобы
  alternative: так что
  rationale: Союз сохраняет присущую формуле напряжённость между целью объявленного суда и его результатом, не поясняя её сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; конкретные образы хлеба, воды, земли и насилия сохранены. Женское местоимение «её» оставлено в соответствии с неоднозначной образностью еврейского текста и может относиться к земле/Иерусалиму.
