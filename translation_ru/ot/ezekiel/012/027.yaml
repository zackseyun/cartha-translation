base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/027.yaml
  text: Son of man, look, the house of Israel is saying, ‘The vision that he sees is for many days from now, and he prophesies about distant times.’
translation:
  language: ru
  text: 'Сын человеческий, вот, дом Израиля говорит: «Видение, которое он видит, — на много дней вперёд; он пророчествует о далёких временах».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Сын человеческий
  rationale: Устойчивое и узнаваемое обращение в книге Иезекииля, формально соответствующее еврейскому выражению.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую функцию частицы и естественно звучит в русском пророческом повествовании.
- source_word: בֵית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет библейскую коллективную метафору и соответствует форме оригинала.
- source_word: לְיָמִים רַבִּים
  choice: о том, что будет через много дней
  rationale: Передаёт мысль говорящих о значительном временном удалении исполнения видения; добавленное «что будет» естественно раскрывает эллиптическую конструкцию по-русски.
- source_word: וּלְעִתִּים רְחוֹקוֹת
  choice: о далёких временах
  rationale: Предлог לְ при נִבָּא передан как указание на предмет пророчества; сохранён образ отдалённых времён.
theological_decisions:
- issue: Временная отнесённость видения
  choice: «через много дней» и «о далёких временах» представлены как слова дома Израиля
  alternative: Сформулировать это как объективное утверждение рассказчика о сроке исполнения
  rationale: Синтаксис прямо вводит эти слова глаголом «говорит»; текст передаёт мнение народа, не подтверждая его истинность.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой речи и традиционных библейских выражений. Прямая речь оформлена естественно; неоднозначность относительно точного срока исполнения не устраняется.
