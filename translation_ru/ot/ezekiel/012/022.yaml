  text: בֶּן אָדָ֗ם מָֽה הַ/מָּשָׁ֤ל הַ/זֶּה֙ לָ/כֶ֔ם עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַֽאַרְכוּ֙ הַ/יָּמִ֔ים וְ/אָבַ֖ד כָּל חָזֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/022.yaml
  text: Son of man[a], what is this proverb that you have in the land of Israel, saying, ‘The days drag on, and every vision comes to nothing’?”
translation:
  language: ru
  text: '«Сын человеческий, что это у вас за поговорка на земле Израиля: „Дни тянутся, и всякое видение сходит на нет“?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дни затягиваются, и всякое видение не сбывается».'
    reason: 'Лексическая альтернатива: יַאַרְכוּ допускает более прямое «затягиваются», а אָבַד в контексте исполнения пророчеств — «не сбывается».'
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивую формулу обращения к Иезекиилю и её литературную последовательность; в данном контексте выражение подчёркивает человеческую природу пророка, не превращаясь в особый христологический титул.
- source_word: מָה הַמָּשָׁל הַזֶּה לָכֶם
  choice: что это у вас за поговорка
  rationale: מָשָׁל здесь обозначает распространённое пословичное изречение, а не повествовательную притчу; русская конструкция естественно передаёт мысль о поговорке, ходящей среди народа.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: на земле Израиля
  rationale: Передаёт территориальное значение сочетания, сохраняя образ земли, а не буквально почвы.
- source_word: לֵאמֹר
  choice: Вы говорите
  rationale: Явно и естественно вводит содержание поговорки; субъект восстанавливается из формы לָכֶם и контекста обращения.
- source_word: יַאַרְכוּ הַיָּמִים
  choice: Дни тянутся
  rationale: Передаёт буквальную идею удлинения дней и скептический оттенок затянувшегося ожидания.
- source_word: וְאָבַד כָּל חָזוֹן
  choice: и всякое видение сходит на нет
  rationale: Выражает мысль, что пророческое видение утрачивает силу и не приводит к ожидаемому исполнению, сохраняя образ исчезновения или гибели в אָבַד.
theological_decisions:
- issue: Значение אָדָם в формуле обращения к пророку
  choice: Сын человеческий
  alternative: смертный; человек
  rationale: Устойчивый перевод сохраняет повторяющуюся формулу книги Иезекииля и межтекстовые связи, но сам контекст не требует вкладывать в неё позднейшее христологическое значение.
- issue: Степень определённости утверждения о пророческих видениях
  choice: всякое видение сходит на нет
  alternative: всякое видение не сбывается
  rationale: Основной вариант сохраняет более широкий и образный смысл אָבַד — исчезнуть, погибнуть, оказаться тщетным, — не сводя его исключительно к техническому понятию неисполнения пророчества.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «Сын человеческий» сохранена как характерное обращение в книге Иезекииля; сама поговорка звучит естественно и передаёт насмешливо-скептический тон.
