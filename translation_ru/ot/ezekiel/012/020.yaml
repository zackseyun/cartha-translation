  text: וְ/הֶ/עָרִ֤ים הַ/נּֽוֹשָׁבוֹת֙ תֶּחֱרַ֔בְנָה וְ/הָ/אָ֖רֶץ שְׁמָמָ֣ה תִֽהְיֶ֑ה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/020.yaml
  text: And the inhabited cities will be laid waste[a], and the land will become a desolation; then you will know that I am Yahweh.
translation:
  language: ru
  text: Населённые города будут разорены, и земля будет опустошена; тогда вы узнаете, что Я — Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH), тетраграмматон; в традиционных русских переводах — «Господь».
    reason: Пояснение передачи божественного имени и традиционного варианта.
lexical_decisions:
- source_word: הֶעָרִים הַנּוֹשָׁבוֹת
  choice: населённые города
  rationale: Сочетание существительного עִיר и причастия от ישׁב обозначает города, в которых живут люди; «населённые города» естественно передаёт смысл и контраст с грядущим разорением.
- source_word: תֶּחֱרַבְנָה
  choice: будут разорены
  rationale: Форма от חרב описывает переход в состояние разрушения и запустения. «Будут разорены» сохраняет пророческую образность и естественно звучит по-русски.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте городов и территориального опустошения אֶרֶץ означает страну или землю как территорию; «земля» сохраняет допустимую широту значения.
- source_word: שְׁמָמָה תִהְיֶה
  choice: станет пустынной
  rationale: Именное שְׁמָמָה обозначает опустошение или запустение, а היה здесь выражает наступление состояния. По-русски сочетание естественно передаётся предикативным прилагательным без утраты смысла.
- source_word: וִידַעְתֶּם
  choice: тогда вы узнаете
  rationale: 'Последовательная форма с ו допускает следственное прочтение: знание станет результатом предсказанного суда.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь»; форма «Яхве» широко употребительна в современной русской библеистике.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, то есть личное имя, а не титул. Транслитерация «Яхве» сохраняет это различие; примечание сообщает читателю традиционный русский эквивалент.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и ритмичный; сохранены последовательность суда и формула узнавания Яхве.
