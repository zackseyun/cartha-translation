source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹא תִמָּשֵׁ֥ךְ ע֖וֹד כָּל דְּבָרָ֑/י אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/028.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: None of my words will be delayed any longer, but the word that I speak will be done,’ declares the Lord GOD.'
translation:
  language: ru
  text: 'Поэтому скажи им: «Так говорит Господь Яхве: ни одно из Моих слов больше не будет отсрочено[a]. Слово, которое Я изреку, исполнится», — возвещает Господь Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «больше не будет продлено (затянуто)».'
    reason: Еврейский глагол משׁך допускает буквальное значение продления или затягивания; в данном контексте речь идёт об отсрочке исполнения.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего пророчества и естественно связывает стих с контекстом.
- source_word: אֱמֹר אֲלֵיהֶם
  choice: скажи им
  rationale: Сохраняет прямое повеление пророку и адресата речи.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся и естественная по-русски формула пророческого послания.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יְהוִה; сочетание избегает неестественного повтора «Господь Господь».
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: больше не будет отсрочено
  rationale: В контексте ожидания исполнения пророчеств глагол означает, что срок исполнения более не будет продлеваться; «отсрочено» ясно передаёт эту мысль.
- source_word: כָּל דְּבָרָי
  choice: ни одно из Моих слов
  rationale: Еврейское «все Мои слова» находится под отрицанием; русская отрицательная конструкция точно передаёт распределительный смысл.
- source_word: אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: Слово, которое Я изреку
  rationale: Сохраняет повтор корня со значениями речи и слова, но выражает его естественно и торжественно по-русски.
- source_word: וְיֵעָשֶׂה
  choice: исполнится
  rationale: Передаёт осуществление сказанного Богом; в русском библейском контексте «слово исполнится» естественнее буквального «будет сделано».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: Передаёт торжественную пророческую формулу נְאֻם и отличает её от начальной формулы «Так говорит».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Так различаются титул אֲדֹנָי и личное имя יְהוִה без замены имени общим титулом и без неестественного повтора.
- issue: Степень категоричности исполнения Божьего слова
  choice: ни одно из Моих слов больше не будет отсрочено… исполнится
  alternative: все Мои слова не будут больше продлены… будет сделано
  rationale: Отрицательная конструкция охватывает каждое Божье слово, а «исполнится» сохраняет утверждение о неизбежном осуществлении сказанного, не уточняя сверх текста способ исполнения.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для пророческой речи. Синтаксис сделан ясным для широкого читателя; сохранены формулы Божьей речи и различие между титулом и личным именем.
