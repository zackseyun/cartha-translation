  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И было ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH; традиционно переводится «ГОСПОДЬ»; также возможна передача «Ягве».
    reason: Уточнение передачи Божественного имени и традиционного варианта.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Стандартная повествовательно-пророческая формула с היה перед דְבַר יְהוָה; «И было ко мне слово…» естественно сохраняет её строй и торжественный ритм.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле означает данное пророку откровение; «слово» сохраняет как речевой, так и откровенный смысл, не сужая его до «сообщения».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста; традиционная замена титулом отмечена в сноске.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל выражает направленность слова к пророку; «ко мне» соответствует устойчивой русской библейской формуле и остаётся понятным современному читателю.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь, которая следует в следующем стихе. В современном русском эту функцию естественно и без потери смысла передаёт двоеточие, а буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте стоит собственное имя YHWH, а не титул. Транслитерация «Яхве» сохраняет это различие; традиционная передача «ГОСПОДЬ» указана в сноске.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. Двоеточие функционально передаёт לֵאמֹר и связывает стих с последующей прямой речью.
