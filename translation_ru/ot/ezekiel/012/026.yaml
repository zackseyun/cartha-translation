  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Вав-последовательный с היה вводит очередное событие повествования; в устойчивой пророческой формуле естественно передаётся как «И было…».
- source_word: דְבַר
  choice: слово
  rationale: В сочетании דְבַר יְהוָה это устойчивая пророческая формула. «Слово» сохраняет её лексическую и богословскую силу, не заменяя её толковательным «послание».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямое и естественное соответствие предлогу אֶל с суффиксом первого лица единственного числа.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «говоря» вводит последующую прямую речь; в современном русском языке эту функцию естественнее выразить двоеточием без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; форма «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и краткости традиционной пророческой формулы. Порядок «ко мне слово Яхве» слегка приподнят, но естественен для библейского повествования; двоеточие подготавливает прямую речь следующего стиха.
