  text: And all who are around him—his helpers and all his troops—I will scatter to every wind[b][a], and I will draw out a sword after them.
translation:
  language: ru
  text: А всех, кто вокруг него, — его помощников и все его отряды — Я развею по всем ветрам[a] и обнажу меч вслед за ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ко всякому ветру», то есть во все стороны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתָיו עֶזְרָה
  choice: кто вокруг него, — его помощников
  rationale: Сочетание передаёт людей из окружения правителя, оказывающих ему помощь. «Помощников» естественно выражает собирательное значение עֶזְרָה в данном контексте.
- source_word: אֲגַפָּיו
  choice: его отряды
  rationale: В военно-политическом контексте слово обозначает приданные группы или подразделения, а не буквально «крылья».
- source_word: אֱזָרֶה
  choice: Я развею
  rationale: Пиэль глагола זרה означает «рассеивать, развеивать». Выбор сохраняет образ ветра и пророческую выразительность.
- source_word: לְכָל רוּחַ
  choice: по всем ветрам
  rationale: Буквально «ко всякому ветру»; русский оборот «по всем ветрам» сохраняет образ и понятно означает рассеяние во все стороны.
- source_word: וְחֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: и обнажу меч, чтобы преследовать их
  rationale: Сочетание ריק с «мечом» идиоматически означает вынуть или обнажить меч, а אַחֲרֵיהֶם передаёт направленное вслед за ними преследование.
