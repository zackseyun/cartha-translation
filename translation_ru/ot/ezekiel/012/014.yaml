  to: А всех, кто вокруг него, — его помощников и все его отряды — Я развею по всем ветрам[a] и обнажу меч вслед за ними.
  rationale: Заменено лишь «чтобы преследовать их» на «вслед за ними», чтобы без добавочного истолкования передать אַחֲרֵיהֶם и сохранить образ меча, обнажаемого вслед за рассеянными людьми. Остальная лексика и примечание точны и соответствуют современному литературному русскому.
