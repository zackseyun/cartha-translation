    issue: «Чтобы преследовать их» вместо «вслед за ними»
    rationale: Предлог אַחֲרֵי выражает направление «вслед за, за ними». Целевая конструкция «чтобы преследовать» добавляет эксплицитную цель и слегка меняет форму образа. Следует сохранить «вслед за ними».
