base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/011.yaml
  text: 'Say[a], ‘I am a sign to you: just as I have done, so it shall be done to them; into exile[b], into captivity they shall go.’'
translation:
  language: ru
  text: 'Скажи[a]: «Я — знамение для вас. Как поступил я, так будет сделано с ними: в изгнание, в плен[b] они пойдут».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Говори».'
    reason: lexical_alternative
  - marker: b
    text: Слова «в изгнание» и «в плен» передают два параллельных еврейских выражения; их сочетание усиливает мысль о грядущей участи народа.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Скажи
  rationale: Форма повелительного наклонения единственного числа от אמר естественно вводит пророческое высказывание.
- source_word: מוֹפֶתְכֶם
  choice: знамение для вас
  rationale: מוֹפֵת обозначает знак, знамение или предвестие; здесь сам Иезекииль и его показательное действие служат обращённым к народу пророческим знамением.
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: как я сделал
  rationale: Передаёт сопоставление уже совершённого символического действия Иезекииля с тем, что предстоит народу.
- source_word: כֵּן יֵעָשֶׂה לָהֶם
  choice: так будет сделано с ними
  rationale: Страдательная конструкция сохраняет форму нифаля и не вводит явно названного деятеля, которого нет в еврейском тексте.
- source_word: בַּגּוֹלָה
  choice: в изгнание
  rationale: При глаголе движения יֵלֵכוּ предложная форма имеет направительное значение; «в изгнание» естественно передаёт גּוֹלָה.
- source_word: בַשְּׁבִי
  choice: в плен
  rationale: שְׁבִי означает плен или состояние плена; отдельный перевод сохраняет усилительное парное выражение оригинала.
- source_word: יֵלֵכוּ
  choice: они пойдут
  rationale: Имперфект הלך выражает предстоящее следствие; современная русская форма будущего времени сохраняет пророческую определённость без архаизации.
theological_decisions:
- issue: Характер символической роли Иезекииля
  choice: Я — знамение для вас
  alternative: Я — знак для вас; Я — предвестие для вас
  rationale: «Знамение» сохраняет символический и откровенный характер пророческого действия, не сводя его ни к простому указателю, ни к суеверному предзнаменованию.
- issue: Неуказанный деятель будущего суда
  choice: так будет сделано с ними
  alternative: так поступят с ними; то же произойдёт с ними
  rationale: Страдательная формулировка следует еврейскому нифалю и не уточняет деятеля там, где оригинал оставляет его невыраженным.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и двойное обозначение изгнания и плена сохранены; архаические будущие формы не использованы.
