  yaml_path: translation/ot/ezekiel/012/018.yaml
  text: Son of man[a], eat your bread with trembling[b], and drink your water with quaking and anxiety.
translation:
  language: ru
  text: Сын человеческий, ешь свой хлеб с дрожью и пей свою воду, содрогаясь и тревожась.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено буквальное и традиционно узнаваемое обращение к Иезекиилю, регулярно повторяющееся в книге.
- source_word: לַחְמְךָ
  choice: свой хлеб
  rationale: Конкретное значение «хлеб» уместно для наглядного пророческого действия; возвратное «свой» естественно при обращённом к пророку повелении.
- source_word: בְּרַעַשׁ
  choice: с дрожью
  rationale: Существительное обозначает сотрясение или дрожь; русский оборот передаёт телесное проявление страха и естественно сочетается с глаголом «ешь».
- source_word: תֹּאכֵל
  choice: ешь
  rationale: В контексте форма имеет силу прямого повеления.
- source_word: וּמֵימֶיךָ
  choice: и свою воду
  rationale: Еврейская форма множественного числа здесь обозначает воду как питьё; в русском естественно единственное число.
- source_word: בְּרָגְזָה
  choice: содрогаясь
  rationale: Передаёт телесное волнение и сотрясение, сохраняя смысловое родство с רַעַשׁ, но не сливая два разных еврейских слова в один русский термин.
- source_word: וּבִדְאָגָה
  choice: и тревожась
  rationale: Передаёт внутреннее беспокойство и тревогу; однородное деепричастие образует естественное сочетание с «содрогаясь».
- source_word: תִּשְׁתֶּה
  choice: пей
  rationale: В контексте форма имеет силу прямого повеления.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Лексически близкие обозначения физического содрогания переданы различно, а телесная реакция отделена от внутренней тревоги. Местоимение «свой» выбрано вместо менее естественного в данном русском повелении «твой».
