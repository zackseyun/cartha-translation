source:
  edition: WLC
  text: וָ/אַ֣עַשׂ כֵּן֮ כַּ/אֲשֶׁ֣ר צֻוֵּיתִי֒ כֵּ֠לַ/י הוֹצֵ֜אתִי כִּ/כְלֵ֤י גוֹלָה֙ יוֹמָ֔ם וּ/בָ/עֶ֛רֶב חָתַֽרְתִּי לִ֥/י בַ/קִּ֖יר בְּ/יָ֑ד בָּ/עֲלָטָ֥ה הוֹצֵ֛אתִי עַל כָּתֵ֥ף נָשָׂ֖אתִי לְ/עֵינֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/007.yaml
  text: 'So I did as I was commanded: by day I brought out my baggage like the baggage of exile[a], and in the evening I dug through the wall by hand. In the dark I brought it out[b]; I carried it on my shoulder before their eyes.'
translation:
  language: ru
  text: 'И я сделал так, как мне было велено: днём вынес свои вещи, собранные для изгнания[a], а вечером собственными руками проломил стену. В темноте я вынес их[b] и понёс на плече у них на глазах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои вещи — поклажу изгнанника». Еврейское выражение обозначает вещи, приготовленные для ухода в изгнание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во мраке»; возможно также: «в сумерках». Еврейское слово обозначает темноту или полумрак и может подразумевать скрытность действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ כֵּן כַּאֲשֶׁר צֻוֵּיתִי
  choice: И я сделал так, как мне было велено
  rationale: Сохраняет повествовательную связь, указание на исполнение и пассивную форму повеления; звучит естественно на современном русском.
- source_word: כֵּלַי כִּכְלֵי גוֹלָה
  choice: свои вещи, собранные для изгнания
  rationale: כְּלִי здесь означает переносимые личные вещи, а конструкция с גוֹלָה характеризует их как приготовленные для ухода в изгнание. Формулировка избегает неестественного русского сочетания «багаж изгнания».
- source_word: יוֹמָם וּבָעֶרֶב
  choice: днём ... а вечером
  rationale: Передаёт временную последовательность и естественно подчёркивает контраст двух этапов действия.
- source_word: חָתַרְתִּי לִי בַקִּיר בְּיָד
  choice: собственными руками проломил стену
  rationale: חתר применительно к стене означает проделать проход, прокопав или проломив её. «Собственными руками» естественно передаёт בְּיָד и личную вовлечённость, тогда как לִי не требует отдельного буквального выражения.
- source_word: בָּעֲלָטָה
  choice: В темноте
  rationale: Сохраняет основное значение темноты или мрака, не сводя его без необходимости ни к сумеркам, ни к тайному действию.
- source_word: הוֹצֵאתִי
  choice: я вынес их
  rationale: Подразумеваемым объектом остаются множественные «вещи»; русское местоимение согласовано с выбранным существительным.
- source_word: עַל כָּתֵף נָשָׂאתִי
  choice: понёс на плече
  rationale: Естественно передаёт конкретный образ переноски поклажи на плече.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Современный русский идиом, точно подчёркивающий публичность знакового действия.
theological_decisions:
- issue: Характер символического действия Иезекииля
  choice: Передать действия конкретно, не объясняя их символику внутри стиха
  alternative: Добавить в текст явное истолкование как изображения будущего переселения
  rationale: Сам стих повествует о наглядном пророческом действии, а его значение раскрывается в контексте. Перевод не должен предварять это объяснение.
- issue: Значение כִּכְלֵי גוֹלָה
  choice: вещи, собранные для изгнания
  alternative: поклажа изгнанника / вещи для переселения
  rationale: Выбранный вариант сохраняет прямую связь с изгнанием, не уточняя сверх текста, идёт ли речь уже о статусе изгнанника или о подготовке к нему.
translation_notes:
  register: Современный литературный русский, ясный и dignified повествовательный стиль. «Изгнание» сохраняет библейскую тему насильственного удаления с родины; «собственными руками проломил стену» передаёт физическую конкретность действия без тяжеловесного буквализма.
