  text: וְ/הוֹצֵאתָ֨ כֵלֶ֜י/ךָ כִּ/כְלֵ֥י גוֹלָ֛ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/אַתָּ֗ה תֵּצֵ֤א בָ/עֶ֨רֶב֙ לְ/עֵ֣ינֵי/הֶ֔ם כְּ/מוֹצָאֵ֖י גּוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/004.yaml
  text: And you shall bring out your baggage like the baggage of exile by day before their eyes[b][a], and you yourself shall go out in the evening before their eyes like those going out into exile.
translation:
  language: ru
  text: Днём, у них на глазах, вынеси свои пожитки — такие, какие берут с собой в изгнание[a]. А вечером, у них на глазах, выйди сам, как выходят, отправляясь в изгнание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как пожитки изгнания». Это выражение может пониматься собирательно — как вещи, которые берут при выселении, — или относиться к пожиткам отдельного изгнанника.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение буквально можно передать как «подобно выходам изгнания/изгнанников». Возможны также переводы: «словно уходящий в изгнание» или «как уходят изгнанники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: вынеси
  rationale: 'Порода hифиль глагола יצא выражает побуждение или причинение выхода: здесь речь о том, чтобы вынести вещи наружу. «Вынеси» естественно передаёт повелительный смысл формы в данном пророческом поручении.'
- source_word: כֵלֶיךָ
  choice: свои пожитки
  rationale: כְּלִי может обозначать сосуд, предмет, принадлежность или снаряжение. В инсценировке изгнания имеются в виду переносимые личные вещи; «пожитки» ясно и естественно передаёт это значение.
- source_word: כִּכְלֵי גוֹלָה
  choice: такие, какие берут с собой в изгнание
  rationale: Буквально компактное сочетание означает «как пожитки изгнания/изгнанника». Развёрнутая русская формулировка естественно описывает вещи, приготовленные для вынужденного переселения, не сводя גוֹלָה только к плену.
- source_word: גּוֹלָה
  choice: изгнание
  rationale: Слово может обозначать состояние изгнания, депортацию или сообщество изгнанников. «Изгнание» сохраняет основную тему отрывка и не вносит идеи заключения под стражу.
- source_word: יוֹמָם
  choice: днём
  rationale: Наречие указывает на дневное время и противопоставлено последующему «вечером».
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Еврейская идиома буквально связана с «их глазами» и подчёркивает, что символическое действие должно совершаться открыто. Русская идиома сохраняет наглядность и повтор выражения.
- source_word: וְאַתָּה
  choice: а … сам
  rationale: Самостоятельное местоимение אַתָּה эмфатично выделяет самого Иезекииля в отличие от его пожитков. Частица «а» передаёт переход и сопоставление, а «сам» — эмфазу.
- source_word: תֵּצֵא
  choice: выйди
  rationale: Qal глагола יצא обозначает выход самого пророка. «Выйди» прямо и естественно передаёт предписанное действие.
- source_word: בָּעֶרֶב
  choice: вечером
  rationale: Выражение обозначает вечернее время и образует ясный контраст с дневным выносом пожитков.
- source_word: כְּמוֹצָאֵי גּוֹלָה
  choice: как выходят, отправляясь в изгнание
  rationale: Необычное сочетание с множественной формой מוֹצָאֵי буквально связано с «выходами/выходящими изгнания». Контекст указывает на характерный выход депортируемых; безлично-обобщённая русская конструкция передаёт манеру действия, не делая синтаксически спорное обозначение лиц чрезмерно явным.
