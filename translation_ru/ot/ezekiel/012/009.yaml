  text: Son of man[a], has not the house of Israel, that rebellious house, said to you, ‘What are you doing?’
translation:
  language: ru
  text: 'Сын человеческий, разве дом Израиля, мятежный дом[a], не говорил тебе: «Что ты делаешь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дом мятежа». В еврейском тексте это выражение стоит как приложение к словам «дом Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и его литературная последовательность во всей книге. Выражение указывает на принадлежность пророка к человеческому роду, но перевод «смертный» был бы более истолковательным.
- source_word: הֲלֹא
  choice: разве ... не
  rationale: Русская конструкция естественно передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: אָמְרוּ אֵלֶיךָ
  choice: не говорил тебе
  rationale: Сохранено основное значение глагола אמר — «говорить, сказать». Единственное число согласовано с собирательным выражением «дом Израиля», хотя в еврейском сказуемое стоит во множественном числе.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено характерное для пророческой речи заветное и собирательное обозначение народа, а не заменено более общим «народ Израиля».
- source_word: בֵּית הַמֶּרִי
  choice: этот мятежный дом
  rationale: Приложение поясняет и резко характеризует «дом Израиля». Существительное מֶרִי естественно передано определением «мятежный»; слово «этот» делает связь приложения ясной по-русски, не меняя его референции.
- source_word: מָה אַתָּה עֹשֶׂה
  choice: Что ты делаешь?
  rationale: Местоимение с причастием описывает совершающееся действие; настоящее время с формой «делаешь» естественно передаёт этот смысл.
theological_decisions:
- issue: Значение обращения בֶּן אָדָם
  choice: Сын человеческий
  alternative: смертный; человек
  rationale: Формальный образ сохранён без привнесения в этот ветхозаветный контекст позднейших христологических смыслов и без сведения выражения лишь к идее смертности.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и повторяющегося книжного выражения «дом Израиля». Порядок слов слегка приспособлен к естественному русскому риторическому вопросу; приложение сохранено и отмечено с обеих сторон запятыми.
