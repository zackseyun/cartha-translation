base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/002.yaml
  text: Son of man[a], you dwell in the midst of a rebellious house, who have eyes to see but do not see, ears to hear but do not hear[b], for they are a rebellious house.
translation:
  language: ru
  text: Сын человеческий, ты живёшь среди мятежного дома[a]. У них есть глаза, чтобы видеть, но они не видят; есть уши, чтобы слышать, но они не слышат[b], потому что они — мятежный дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди мятежного народа». В еврейском тексте «дом» — собирательное обозначение народа как единого целого.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «глаза у них — чтобы видеть, но они не видят; уши у них — чтобы слышать, но они не слышат».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивую формулу обращения к пророку в книге Иезекииля, её образность и межтекстовые связи.
- source_word: בְּתוֹךְ
  choice: среди
  rationale: Естественно передаёт пребывание пророка внутри определённой общности без излишней буквальности.
- source_word: בֵּית הַמֶּרִי / בֵּית מְרִי
  choice: мятежный дом
  rationale: Сохраняет корпоративную метафору «дома», повтор выражения и смысл упорного неповиновения.
- source_word: יֹשֵׁב
  choice: живёшь
  rationale: В данном контексте причастие означает постоянное пребывание среди народа; «живёшь» естественно для современного русского языка.
- source_word: עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ
  choice: у них есть глаза, чтобы видеть, но они не видят
  rationale: Передаёт еврейский параллелизм и общий характер упрёка; настоящее время соответствует функции перфекта в контексте.
- source_word: אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ
  choice: есть уши, чтобы слышать, но они не слышат
  rationale: Сохраняет параллель с глазами и основной смысл глагола, не добавляя толкования о послушании непосредственно в текст.
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно выражает причинную связь: неспособность видеть и слышать обусловлена их мятежностью.'
theological_decisions:
- issue: Корпоративная метафора «дом» применительно к народу Израиля
  choice: Сохранить «дом» в основном тексте
  alternative: народ; сообщество мятежников
  rationale: Метафора значима и многократно повторяется у Иезекииля; её сохранение поддерживает терминологическую и образную связность книги.
- issue: Значение «слышать» как восприятие и отклик
  choice: Оставить «слышать» без поясняющего расширения
  alternative: слушаться; внимать
  rationale: Исходный глагол допускает оттенок отзывчивого восприятия, однако прямой сенсорный параллелизм с «видеть» следует сохранить, не снимая смысловой напряжённости.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи, формулы «Сын человеческий», корпоративной метафоры «дом» и синтаксического параллелизма.
