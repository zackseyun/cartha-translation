  text: וּ/פָרַשְׂתִּ֤י אֶת רִשְׁתִּ/י֙ עָלָ֔י/ו וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וְ/הֵבֵאתִ֨י אֹת֤/וֹ בָבֶ֨לָ/ה֙ אֶ֣רֶץ כַּשְׂדִּ֔ים וְ/אוֹתָ֥/הּ לֹֽא יִרְאֶ֖ה וְ/שָׁ֥ם יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/013.yaml
  text: I will spread my net over him[a], and he will be caught in my snare. Then I will bring him to Babylon, the land of the Chaldeans; yet he will not see it[b], and there he will die.
translation:
  language: ru
  text: Я раскину над ним мою сеть[a], и он попадётся в мою ловушку. Я приведу его в Вавилон, в землю халдеев, но он её не увидит[b] и там умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мою западню». В еврейском тексте употреблены два близких слова из языка охоты: «моя сеть» и «моя ловушка».'
    reason: lexical_alternative
  - marker: b
    text: То, что его приведут в Вавилон, но он не увидит этой земли, часто понимают в свете 4 Царств 25:7; Иеремии 39:7; 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: וּפָרַשְׂתִּי
  choice: Я раскину
  rationale: Глагол פָּרַשׂ означает «раскинуть, распростирать»; «раскину» естественно передаёт действие с сетью.
- source_word: רִשְׁתִּי
  choice: Мою сеть
  rationale: רֶשֶׁת — обычное обозначение сети для ловли; притяжательный суффикс передан местоимением «Мою».
- source_word: עָלָיו
  choice: над ним
  rationale: Пространственное значение עַל сохраняет образ сети, раскинутой над человеком.
- source_word: וְנִתְפַּשׂ
  choice: он попадётся
  rationale: Нифаль выражает попадание в сеть или захват; «попадётся» естественно сочетается с образом ловушки.
- source_word: בִּמְצוּדָתִי
  choice: в Мою ловушку
  rationale: מְצוּדָה может означать сеть, западню или ловушку. «Ловушка» сохраняет второй охотничий образ и избегает неясного повторения слова «сеть».
- source_word: וְהֵבֵאתִי אֹתוֹ
  choice: Я приведу его
  rationale: Порода хифиль глагола בוא имеет каузативное значение «привести».
- source_word: בָבֶלָה
  choice: в Вавилон
  rationale: Направительный суффикс выражает движение к Вавилону.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: в землю халдеев
  rationale: Сохраняется историко-этническое наименование כַּשְׂדִּים — «халдеи».
- source_word: וְאוֹתָהּ לֹא יִרְאֶה
  choice: но он её не увидит
  rationale: 'Местоимение женского рода соотносится с «землёй»; союз «но» передаёт контраст: его приведут туда, однако он её не увидит.'
- source_word: וְשָׁם יָמוּת
  choice: и там умрёт
  rationale: Прямо сохраняет последовательность и акцент исходного текста на месте смерти.
theological_decisions:
- issue: Исторический парадокс слов «он её не увидит»
  choice: Оставить буквальное утверждение без объяснения причины в основном тексте.
  alternative: Добавить, что он не увидит землю, потому что будет ослеплён.
  rationale: Сам стих не называет причину. Буквальный перевод сохраняет напряжение текста, а историческое пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; ясный и торжественный библейский регистр без архаизмов. Заглавная буква в притяжательном местоимении указывает на речь Бога. Подлинная недосказанность относительно того, почему человек не увидит землю, сохранена.
