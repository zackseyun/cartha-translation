source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה אֲדַבֵּר֙ אֵת֩ אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה לֹ֥א תִמָּשֵׁ֖ךְ ע֑וֹד כִּ֣י בִֽ/ימֵי/כֶ֞ם בֵּ֣ית הַ/מֶּ֗רִי אֲדַבֵּ֤ר דָּבָר֙ וַ/עֲשִׂיתִ֔י/ו נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/025.yaml
  text: For I am Yahweh[a]; the word that I speak will be done. It will no longer be delayed, for in your days, O rebellious house, I will speak a word and do it[b], declares the Lord GOD.
translation:
  language: ru
  text: 'Ибо Я — Яхве: слово, которое Я произнесу, исполнится; это больше не будет откладываться[a]. Ибо в ваши дни, мятежный дом, Я произнесу слово и исполню его, — возвещает Владыка Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это больше не затянется»; «это больше не будет продлеваться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом; одинаково сохранено и в заключительном сочетании אֲדֹנָי יְהוִה.
- source_word: אֵת אֲשֶׁר אֲדַבֵּר דָּבָר וְיֵעָשֶׂה
  choice: слово, которое Я произнесу, исполнится
  rationale: Сохраняет связь между Божьим речением и его непременным осуществлением. «Произнесу» передаёт торжественный пророческий контекст, а «исполнится» естественно выражает пассивное וְיֵעָשֶׂה.
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: его исполнение больше не будет откладываться
  rationale: В контексте речь идёт не об отмене слова, а о прекращении отсрочки его осуществления. Русская формулировка делает подразумеваемую связь понятной, не меняя смысла.
- source_word: בֵּית הַמֶּרִי
  choice: мятежный дом
  rationale: Сохраняет корпоративный библейский образ «дома» и передаёт устойчивое противление Богу без конфессиональной конкретизации.
- source_word: וַעֲשִׂיתִיו
  choice: и исполню его
  rationale: Форма выражает будущее действие как несомненное; «исполню» поддерживает параллель с ранее сказанным «исполнится».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» естественно передаёт пророческую формулу נְאֻם, а «Владыка Яхве» различает титул אֲדֹנָי и личное имя יְהוָה.
theological_decisions:
- issue: Передача имени и титула Бога
  choice: Яхве ... Владыка Яхве
  alternative: Господь ... Господь Бог
  rationale: Транслитерация сохраняет личное имя יהוה, тогда как «Владыка» передаёт отдельный титул אֲדֹנָי. Это позволяет не смешивать имя и титул.
- issue: Соотношение Божьего слова и его исполнения
  choice: 'сохранена сначала пассивная, затем активная формулировка: «исполнится» / «исполню его»'
  alternative: в обоих случаях передать активным оборотом
  rationale: 'Так сохраняется напряжение исходного текста: сказанное непременно осуществляется, и затем Яхве прямо называет Себя совершающим это.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; повтор «слово / произнесу / исполнится» намеренно сохранён как смысловой стержень стиха.
