  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בַּ/הֲפִיצִ֤/י אוֹתָ/ם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/015.yaml
  text: And they will know that I am Yahweh when I scatter them among the nations and disperse them through the lands[a].
translation:
  language: ru
  text: И узнают они, что Я — Яхве, когда рассею их среди народов и развею по странам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнают они
  rationale: Форма в пророческом контексте передаёт будущее следствие. Постпозиция местоимения сохраняет достоинство пророческой речи, не делая её архаичной.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: כִּי вводит содержание узнавания, а אֲנִי — именную конструкцию «Я — Яхве». Личное имя передано транслитерацией, а не заменено титулом.
- source_word: בַּהֲפִיצִי
  choice: когда рассею
  rationale: 'Предлог ב при инфинитиве породы hифиль с суффиксом первого лица естественно выражает здесь время: «когда Я рассею».'
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם обозначает иноземные народы, среди которых окажутся изгнанники; «язычники» внесло бы лишний религиозный оттенок.
- source_word: וְזֵרִיתִי
  choice: и развею
  rationale: זרה означает разбрасывать или развеивать и может вызывать образ веяния. «Развею» сохраняет отличие от предыдущего פוץ и при этом ясно передаёт рассеяние.
- source_word: בָּאֲרָצוֹת
  choice: по разным странам
  rationale: Множественное אֲרָצוֹת означает «земли, страны». По-русски добавление «разным» естественно выражает распределение по множеству стран, подразумеваемое контекстом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не привносит конфессионального истолкования.
- issue: Связь познания Яхве с рассеянием
  choice: когда рассею их
  alternative: тем, что рассею их
  rationale: Конструкция допускает временной оттенок, а также подразумевает, что действие станет основанием узнавания. «Когда» естественно передаёт явный временной смысл, не исключая результирующей связи.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис краток и ясен; избегаются как церковнославянизмы, так и разговорные обороты. Различие между двумя еврейскими глаголами рассеяния передано словами «рассею» и «развею».
