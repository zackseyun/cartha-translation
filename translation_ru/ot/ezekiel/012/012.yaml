  text: וְ/הַ/נָּשִׂ֨יא אֲשֶׁר בְּ/תוֹכָ֜/ם אֶל כָּתֵ֤ף יִשָּׂא֙ בָּ/עֲלָטָ֣ה וְ/יֵצֵ֔א בַּ/קִּ֥יר יַחְתְּר֖וּ לְ/ה֣וֹצִיא ב֑/וֹ פָּנָ֣י/ו יְכַסֶּ֔ה יַ֗עַן אֲשֶׁ֨ר לֹא יִרְאֶ֥ה לַ/עַ֛יִן ה֖וּא אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/012.yaml
  text: And the prince who is among them will lift his baggage onto his shoulder in the dark and go out[a]. They will dig through the wall to bring him out through it[c][b]. He will cover his face so that he may not see the land with his eyes.
translation:
  language: ru
  text: А князь, который среди них, поднимет свою ношу на плечо[b] и в темноте[a] выйдет. Они проломят в стене проход, чтобы вывести его через него. Он закроет лицо, чтобы своими глазами не видеть земли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в сумерках». Еврейское слово может обозначать мрак, мглу или тусклый сумеречный свет; здесь оно также передаёт скрытность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднимет на плечо». Слова «свою ношу» добавлены по ближайшему контексту, где описывается ноша изгнанника.'
    reason: contextual_supply
  - marker: c
    text: 'Или: «потому что он не увидит своими глазами землю». Еврейский союз может выражать причину, а не цель или результат.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: князь
  rationale: Слово обозначает правителя или предводителя. «Князь» сохраняет политический титул и не уточняет его до «царя», которого в еврейском тексте здесь нет.
- source_word: בְּתוֹכָם
  choice: который среди них
  rationale: Естественно передаёт буквальное «среди них, в их среде».
- source_word: אֶל כָּתֵף יִשָּׂא
  choice: поднимет свою ношу на плечо
  rationale: 'Буквально: «поднимет на плечо». Объект не назван, но из ближайшего контекста (ст. 6–7) ясно, что имеется в виду ноша изгнанника.'
- source_word: בָּעֲלָטָה
  choice: в темноте
  rationale: Существительное обозначает тьму, мрак или сумеречную мглу и в данном контексте подчёркивает скрытность бегства.
- source_word: וְיֵצֵא
  choice: выйдет
  rationale: Прямое и естественное соответствие глаголу יצא в описании физического выхода.
- source_word: בַּקִּיר יַחְתְּרוּ
  choice: в стене проломят отверстие
  rationale: Глагол חתר описывает прокапывание или пробивание прохода. Эта формулировка ясно передаёт создание отверстия в стене.
- source_word: לְהוֹצִיא בוֹ
  choice: чтобы вывести его через него
  rationale: Каузативная форма означает «вывести», а בוֹ указывает на проход через стену; местоименный объект «его» определяется контекстом и относится к князю.
- source_word: פָּנָיו יְכַסֶּה
  choice: Он закроет лицо
  rationale: Прямая и идиоматичная передача физического действия.
- source_word: יַעַן אֲשֶׁר לֹא יִרְאֶה
  choice: чтобы не видеть
  rationale: После слов о закрытом лице сочетание естественно выражает цель или результат, хотя возможно и причинное понимание.
- source_word: לַעַיִן
  choice: своими глазами
  rationale: Передаёт конкретный телесный смысл буквального выражения «глазом» и естественно звучит по-русски.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте речь идёт о земле, которую правитель покидает, а не только о почве.
theological_decisions:
- issue: Невыраженный объект при «поднимет на плечо»
  choice: В основном тексте добавлено «свою ношу»
  alternative: «поднимет на плечо» без названного объекта
  rationale: В самом стихе объект отсутствует, однако в ближайшем контексте неоднократно упоминается ноша изгнанника. Добавление проясняет смысл, не выходя за рамки контекста, и отмечено сноской.
- issue: Значение יַעַן אֲשֶׁר в заключительной части
  choice: 'Целевое или результативное: «чтобы не видеть»'
  alternative: 'Причинное: «потому что он не увидит»'
  rationale: Последовательность действий — он закрывает лицо, затем следует указание, что он не увидит землю, — естественно допускает цель или результат. Причинное значение грамматически возможно и сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис сохранён ясным и конкретным; «князь» передаёт титул без избыточного исторического уточнения. Подлинная неоднозначность слов о темноте и заключительного союза отражена в сносках.
