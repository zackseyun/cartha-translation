  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם עֲשֵׂ֤ה לְ/ךָ֙ כְּלֵ֣י גוֹלָ֔ה וּ/גְלֵ֥ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/גָלִ֨יתָ מִ/מְּקוֹמְ/ךָ֜ אֶל מָק֤וֹם אַחֵר֙ לְ/עֵ֣ינֵי/הֶ֔ם אוּלַ֣י יִרְא֔וּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/003.yaml
  text: And you, son of man, prepare for yourself baggage for exile, and go into exile by day before their eyes. You shall go into exile from your place to another place before their eyes. Perhaps they will see, though they are a rebellious house.
translation:
  language: ru
  text: А ты, сын человеческий, приготовь себе поклажу для изгнания и днём, у них на глазах, отправляйся в изгнание. У них на глазах переселись со своего места на другое. Может быть, они увидят[a], что они — мятежный дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поймут», «осознают, что они — мятежный дом».'
    reason: Глагол ראה буквально означает «видеть», но в контексте символического действия может обозначать восприятие с пониманием; כִּי вводит содержание этого восприятия.
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: вещи для изгнания
  rationale: Сочетание обозначает необходимые пожитки или поклажу изгнанника. «Вещи для изгнания» ясно передаёт смысл и не сужает его до одного вида багажа.
- source_word: וּגְלֵה / וְגָלִיתָ
  choice: отправляйся в изгнание / перейди
  rationale: Повтор корня גלה сохранён через явное упоминание изгнания в первом повелении; во втором контекстуально естественное «перейди» передаёт демонстративное перемещение с одного места на другое.
- source_word: יוֹמָם
  choice: днём
  rationale: Прямое временное значение; подчёркивает, что символическое действие должно совершаться открыто.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Естественный современный русский эквивалент, сохраняющий повтор и акцент на публичности действия.
- source_word: יִרְאוּ
  choice: увидят
  rationale: Сохранено основное значение глагола ראה и намеренная недосказанность относительно того, что именно адресаты увидят или осознают.
- source_word: בֵּית מְרִי
  choice: мятежный дом
  rationale: Сохраняется коллективная метафора «дом» и характеристика упорного сопротивления; формулировка согласуется с пророческим регистром.
theological_decisions:
- issue: Связь כִּי с выражением «может быть, они увидят»
  choice: хотя они — мятежный дом
  alternative: ибо они — мятежный дом
  rationale: 'В данном контексте כִּי допускает уступительное понимание: надежда на отклик сохраняется вопреки мятежности народа. В сноске оставлена более буквальная причинная возможность, чтобы не устранять подлинную синтаксическую неоднозначность.'
- issue: Значение «увидят»
  choice: сохранить буквальное «увидят»
  alternative: «поймут» или «осознают»
  rationale: Текст описывает наглядное знамение, поэтому буквальное зрительное значение существенно; вместе с тем глагол может подразумевать понимание, что отмечено в сноске без внесения этого толкования в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор «у них на глазах» намеренно сохранён как риторический акцент оригинала; «сын человеческий» оставлен в традиционной и понятной библейской форме.
