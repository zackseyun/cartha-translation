revisions:
- from: А ты, сын человеческий, приготовь себе вещи для изгнания и днём, у них на глазах, отправляйся в изгнание. У них на глазах перейди со своего места на другое. Может быть, они увидят[a], хотя они — мятежный дом[b].
  to: А ты, сын человеческий, приготовь себе поклажу для изгнания и днём, у них на глазах, отправляйся в изгнание. У них на глазах переселись со своего места на другое. Может быть, они увидят[a], что они — мятежный дом.
  rationale: Исправлена синтаксическая связь «увидят, что…», чтобы передать наиболее прямое значение еврейского כִּי без доктринального истолкования. «Переселись» восстанавливает повтор мотива изгнания, а «поклажа» естественно обозначает снаряжение изгнанника. Сноска сохраняет возможность смыслового оттенка «понять/осознать».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная последовательность повелений, повтор публичного характера действия и образ «сына человеческого» переданы верно. Однако כִּי после יִרְאוּ естественно относится к содержанию восприятия: «увидят, что они — мятежный дом». Вариант «хотя» не отражает эту синтаксическую связь, а вариант «ибо» в сноске не устраняет пропуск наиболее прямого прочтения. Кроме того, «переселись» лучше сохраняет связь второго глагола с изгнанием, чем нейтральное «перейди».'
  naturalness: «У них на глазах» и «сын человеческий» естественны в современном литературном библейском регистре. «Поклажа для изгнания» более идиоматична для כְּלֵי גוֹלָה, чем неопределённые «вещи для изгнания».
  terminology: «Сын человеческий», «изгнание» и «мятежный дом» сохранены. «Мятежный дом» намеренно удерживает коллективную метафору בֵּית מְרִי и уместен в пророческом регистре.
  issues:
  - severity: medium
    issue: Связь כִּי передана как уступительная («хотя»).
    rationale: 'В конструкции אולי יראו כי בית מרי המה כִּי наиболее прямо вводит содержание того, что они увидят/осознают: «что они — мятежный дом». Уступительное значение здесь не следует навязывать основному тексту.'
  - severity: low
    issue: Во втором повелении «перейди» ослабляет мотив изгнания.
    rationale: וְגָלִיתָ повторяет корень גלה после וּגְלֵה; «переселись» естественно передаёт перемещение как изгнание и сохраняет лексическую связь.
  revised_text: А ты, сын человеческий, приготовь себе поклажу для изгнания и днём, у них на глазах, отправляйся в изгнание. У них на глазах переселись со своего места на другое. Может быть, они увидят[a], что они — мятежный дом.
