source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִשְׁבַּ֨תִּי֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה וְ/לֹֽא יִמְשְׁל֥וּ אֹת֛/וֹ ע֖וֹד בְּ/יִשְׂרָאֵ֑ל כִּ֚י אִם דַּבֵּ֣ר אֲלֵי/הֶ֔ם קָֽרְבוּ֙ הַ/יָּמִ֔ים וּ/דְבַ֖ר כָּל חָזֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/023.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: I will put an end to this proverb, and they will no longer use it as a proverb in Israel. But say to them, “The days have drawn near, and the word of every vision.”’'
translation:
  language: ru
  text: 'Поэтому скажи им: «Так говорит Владыка Яхве: Я положу конец этой пословице, и в Израиле её больше не будут повторять. Но скажи им: „Приблизились дни и слово каждого видения[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и слово каждого видения». Еврейское «слово» может означать также дело, содержание или осуществление видения; заключительная фраза эллиптична.'
    reason: Лексическая неоднозначность существительного דָּבָר и эллиптичность заключительной фразы.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Естественно передаёт вывод, следующий из предшествующего обличения.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка Яхве
  rationale: Сохраняет пророческую формулу, различает титул אֲדֹנָי и личное имя יהוה и избегает сочетания «Господь Господь».
- source_word: הִשְׁבַּתִּי
  choice: Я положу конец
  rationale: Каузатив глагола שבת означает прекращение; перфект в пророческом провозглашении выражает решительное и предстоящее действие.
- source_word: הַמָּשָׁל הַזֶּה
  choice: этой пословице
  rationale: מָשָׁל здесь обозначает ходячую пословицу, приведённую в предыдущем стихе, а не литературную притчу.
- source_word: וְלֹא יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל
  choice: и больше её не будут повторять в Израиле
  rationale: Глагол משל здесь значит произносить или употреблять пословицу; «повторять» естественно передаёт её хождение в народе.
- source_word: קָרְבוּ הַיָּמִים
  choice: Приблизились дни
  rationale: Сохраняет образ приближения и форму совершенного действия, подчёркивающую наступившую близость.
- source_word: וּדְבַר כָּל חָזוֹן
  choice: и исполнение каждого видения
  rationale: Буквально דָּבָר означает «слово, дело, содержание»; в контексте спора о задержке пророчеств речь идёт об их осуществлении. Сноска сохраняет буквальную формулировку и её неоднозначность.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה, не смешивая их и не заменяя имя общим титулом.
- issue: Смысл заключительной фразы וּדְבַר כָּל חָזוֹן
  choice: исполнение каждого видения
  alternative: слово каждого видения
  rationale: Контекст противопоставляет народной поговорке о затягивании близкое осуществление пророческих видений. Поскольку существительное דָּבָר допускает более буквальное понимание «слово», оно отмечено в сноске, а не исключено.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим регистром. Синтаксис прямой речи сохранён, а тяжеловесные буквальные обороты заменены естественными русскими эквивалентами без устранения смысловой неоднозначности.
