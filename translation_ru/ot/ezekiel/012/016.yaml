  text: וְ/הוֹתַרְתִּ֤י מֵ/הֶם֙ אַנְשֵׁ֣י מִסְפָּ֔ר מֵ/חֶ֖רֶב מֵ/רָעָ֣ב וּ/מִ/דָּ֑בֶר לְמַ֨עַן יְסַפְּר֜וּ אֶת כָּל תּוֹעֲבֽוֹתֵי/הֶ֗ם בַּ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/016.yaml
  text: But I will spare from among them a few men from the sword[a], from famine, and from pestilence, so that they may recount all their abominations among the nations where they go; and they will know that I am Yahweh.
translation:
  language: ru
  text: Но Я оставлю из них лишь немногих мужчин, уцелевших от меча, голода и мора, чтобы они рассказали обо всех своих мерзостях среди народов, куда они придут[a], и они узнают, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «куда они пришли». Еврейский глагол имеет форму перфекта, но в данном будущем контексте может обозначать место, куда уцелевшие придут.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתַרְתִּי מֵהֶם
  choice: Я оставлю среди них
  rationale: Каузативная форма יתר означает оставить в живых, сохранить как остаток; выражение «среди них» передаёт партитивное значение מֵהֶם.
- source_word: אַנְשֵׁי מִסְפָּר
  choice: лишь нескольких мужчин
  rationale: Еврейская идиома буквально указывает на людей, которых легко пересчитать, то есть на очень малое число; «лишь нескольких» естественно передаёт эту ограниченность, а «мужчин» сохраняет грамматически мужское обозначение.
- source_word: מֵחֶרֶב מֵרָעָב וּמִדָּבֶר
  choice: от меча, голода и мора
  rationale: Сохранена традиционная пророческая триада бедствий; «меч» выступает метонимией войны и насильственной смерти, а «мор» обозначает губительную эпидемию.
- source_word: לְמַעַן יְסַפְּרוּ
  choice: чтобы они рассказали
  rationale: לְמַעַן вводит цель, а интенсивная порода ספר здесь означает подробно поведать или перечислить совершённое.
- source_word: אֵת כָּל תּוֹעֲבוֹתֵיהֶם
  choice: обо всех своих мерзостях
  rationale: «Мерзости» сохраняет сильную нравственно-религиозную окраску תּוֹעֵבוֹת, особенно важную в книге Иезекииля.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь означает чужеземные народы, среди которых окажутся изгнанники.
- source_word: אֲשֶׁר בָּאוּ שָׁם
  choice: к которым придут
  rationale: Хотя בָּאוּ формально является перфектом, в будущем контексте изгнания придаточное естественно обозначает место их предстоящего прибытия; формальная альтернатива отмечена в сноске.
- source_word: וְיָדְעוּ
  choice: и тогда узнают
  rationale: Русская форма без выраженного местоимения сохраняет лаконичность повторяющейся у Иезекииля формулы узнавания и не устраняет неоднозначность её субъекта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Кто является субъектом וְיָדְעוּ
  choice: 'не называть субъект явно: «и тогда узнают»'
  alternative: «и они узнают» либо «и народы узнают»
  rationale: В еврейском глаголе субъект выражен только формой множественного числа; им могут быть прежде упомянутые уцелевшие, а контекст рассказа среди народов допускает отнесение к слушающим народам. Русская безлично воспринимаемая форма без местоимения сохраняет эту напряжённость.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя Бога; «Яхве» прямо передаёт его и не подменяет титулом.
- issue: Мужской род в אַנְשֵׁי מִסְפָּר
  choice: нескольких мужчин
  alternative: нескольких человек
  rationale: Выбрана форма, сохраняющая мужское обозначение исходного выражения, без его нейтрализации.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Сохранены образ «меча», формула трёх бедствий и сильное слово «мерзости»; синтаксис сделан естественным для широкого круга читателей.
