    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предыдущим высказыванием и сохраняет возвышенный пророческий регистр.
- source_word: לֹא ... עוֹד
  choice: не будет больше
  rationale: Естественно выражает прекращение явления с этого момента впредь.
- source_word: יִהְיֶה
  choice: будет
  rationale: 'В сочетании с отрицанием передаёт экзистенциальное значение еврейского глагола: чего-либо больше не будет.'
- source_word: כָּל
  choice: ни одного
  rationale: В области отрицания כָּל имеет значение «никакого, ни одного»; повтор конструкции перед обоими однородными членами делает полный охват ясным по-русски.
- source_word: חֲזוֹן שָׁוְא
  choice: ложное видение
  rationale: שָׁוְא может обозначать ложь, пустоту или тщетность; в контексте пророческих притязаний «ложное видение» ясно и точно передаёт основную мысль.
- source_word: מִקְסַם
  choice: предсказание
  rationale: Слово обозначает результат или акт гадательной, мантической практики; «предсказание» естественно в русском тексте, тогда как оттенок незаконного гадания определяется контекстом.
- source_word: חָלָק
  choice: льстивое
  rationale: Буквально слово связано с гладкостью; применительно к речи означает приятное, льстивое и обманчиво успокаивающее высказывание. Буквальный образ сохранён в сноске.
- source_word: בְּתוֹךְ
  choice: среди
  rationale: Передаёт нахождение внутри сообщества и естественно сочетается с коллективным обозначением народа.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет устойчивый пророческий образ и коллективное обозначение народа Израиля.
theological_decisions:
- issue: Характер осуждаемого откровения
  choice: Стих осуждает как ложные видения, так и льстивые предсказания, получаемые посредством гадательной практики.
  alternative: Второе выражение можно передать буквально как «гладкое предсказание» или терминологически как «льстивое прорицание».
  rationale: Перевод сохраняет две параллельные формы недостоверного сверхъестественного притязания, не отождествляя их и не вводя конфессиональных толкований.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Ибо» и «дом Израиля» сохраняют библейский регистр без архаической грамматики; повтор «ни одного» ясно передаёт действие отрицания на оба однородных выражения.
