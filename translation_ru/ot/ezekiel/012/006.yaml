reference: Ezekiel 12:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לְ/עֵ֨ינֵי/הֶ֜ם עַל כָּתֵ֤ף תִּשָּׂא֙ בָּ/עֲלָטָ֣ה תוֹצִ֔יא פָּנֶ֣י/ךָ תְכַסֶּ֔ה וְ/לֹ֥א תִרְאֶ֖ה אֶת הָ/אָ֑רֶץ כִּֽי מוֹפֵ֥ת נְתַתִּ֖י/ךָ לְ/בֵ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/006.yaml
  text: Before their eyes you shall carry it on your shoulder[a]; in the dark you shall bring it out. You shall cover your face so that you do not see the land[b], for I have made you a sign for the house of Israel.
translation:
  language: ru
  text: У них на глазах понесёшь поклажу на плече; в темноте[a] вынесешь её. Прикроешь лицо, чтобы не видеть земли, потому что Я сделал тебя знамением[b] для дома Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в сумерках». Еврейское слово может обозначать мрак или тусклый свет; здесь, вероятно, речь идёт о передвижении под покровом темноты.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знаком»; «предзнаменованием». Еврейское слово обозначает символический знак и может иметь зловещий оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Передаёт идиоматическое значение «в их присутствии, так, чтобы они видели», сохраняя зрительную выразительность еврейского оборота.
- source_word: עַל כָּתֵף תִּשָּׂא
  choice: понесёшь поклажу на плече
  rationale: Глагол נשׂא в сочетании с «плечом» обозначает несение груза. Объект в еврейском тексте подразумевается из контекста; «поклажа» отсылает к вещам переселенца, названным выше.
- source_word: בָּעֲלָטָה
  choice: в темноте
  rationale: עֲלָטָה означает тьму или мрак; это прямой и естественный русский эквивалент. Возможное контекстуальное понимание «в сумерках» отмечено в сноске.
- source_word: תוֹצִיא
  choice: вынесешь её
  rationale: Каузативная форма יצא означает «вынести». Местоимение восполняет подразумеваемый объект из контекста.
- source_word: פָּנֶיךָ תְכַסֶּה
  choice: закроешь лицо
  rationale: Буквально передаёт символическое действие, не уточняя способ, которым пророк должен закрыть лицо.
- source_word: וְלֹא תִרְאֶה אֶת הָאָרֶץ
  choice: чтобы не видеть земли
  rationale: Формально сочинённая фраза здесь естественно выражает цель или результат закрывания лица. Русский инфинитив сохраняет эту смысловую связь.
- source_word: הָאָרֶץ
  choice: земли
  rationale: В контексте, вероятно, имеется в виду родная земля, однако оригинал не уточняет «земля Израиля». Поэтому оставлена более широкая формулировка.
- source_word: מוֹפֵת
  choice: знамением
  rationale: מוֹפֵת может обозначать знак, знамение или предзнаменование. «Знамение» подходит для пророческого символического действия и сохраняет возможный зловещий оттенок.
- source_word: נְתַתִּיךָ
  choice: Я сделал тебя
  rationale: Буквально «Я дал/поставил тебя», но с именной частью сказуемого по-русски естественно «сделал тебя знамением».
- source_word: לְבֵית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Сохраняет устойчивое пророческое наименование народа и передаёт адресата символического знака.
theological_decisions:
- issue: К чему относится «земля» в символическом действии
  choice: земли
  alternative: земли Израиля; родной земли; земли как почвы
  rationale: Контекст указывает на землю, которую покидает изгнанник, но в самом еврейском тексте стоит только הָאָרֶץ. Перевод не добавляет отсутствующее уточнение.
- issue: Характер пророческого מוֹפֵת
  choice: знамением
  alternative: знаком; предзнаменованием
  rationale: Пророк сам становится наглядным символом грядущего события. «Знамение» сохраняет как знаковую функцию, так и возможную зловещую окраску, не сводя слово только к чуду или дурному предвестию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Будущее время передаёт директивный характер последовательных форм yiqtol. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Маркеры сносок поставлены непосредственно при словах, к которым относятся.
