  yaml_path: translation/ot/ezekiel/012/008.yaml
  text: And in the morning the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И утром ко мне пришло слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно передаётся как «Господь».'
    reason: Альтернативная традиционная передача Божьего имени.
lexical_decisions:
- source_word: וַיְהִי
  choice: было
  rationale: Форма וַיְהִי продолжает повествование и вместе с דְבַר יְהוָה образует обычную пророческую формулу; «было ко мне слово» сохраняет её традиционную библейскую форму и остаётся понятным по-русски.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» непосредственно передаёт דָּבָר и сохраняет устойчивую пророческую формулу, не сужая значение до более истолковывающего «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией отражает тетраграмматон в исходном тексте; традиционный вариант указан в сноске.
- source_word: אֵלַי
  choice: ко мне
  rationale: Естественно передаёт направление речи к пророку и соответствует русской формуле «было ко мне слово».
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Краткая и естественная временная формулировка, точно обозначающая наступившее утро.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно выражает двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя יְהוָה. «Яхве» сохраняет его как имя, а традиционная замена «Господь» отмечена в сноске без навязывания конфессионального толкования.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой пророческой формулы. Союз וַ передан через естественное продолжение повествования «А утром». לֵאמֹר передано пунктуационно, поскольку сама речь начинается в следующем стихе.
