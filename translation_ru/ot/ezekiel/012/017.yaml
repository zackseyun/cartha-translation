lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма от היה вводит очередное пророческое откровение; «И было» естественно сохраняет традиционную формулу и связь с предыдущим повествованием.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר יְהוָה обозначает конкретное Божье сообщение; «слово» точно сохраняет исходный образ и повторяющуюся формулу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица указывает на Иезекииля как получателя откровения; «ко мне» естественно для данной русской формулы.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит прямую речь. В современном русском его функцию естественно и без смысловой потери передаёт двоеточие, поскольку сама речь следует в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя YHWH. Форма «Яхве» сохраняет его как имя, тогда как «Господь» заменяет его титулом; «Иегова» представляет позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой и торжественной пророческой формулы. Двоеточие вместо буквального «говоря» соответствует нормам русского языка и вводит речь следующего стиха.
