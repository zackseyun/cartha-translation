  text: אֱמֹ֣ר אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/נָּשִׂ֞יא הַ/מַּשָּׂ֤א הַ/זֶּה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל אֲשֶׁר הֵ֥מָּה בְ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/010.yaml
  text: 'Say to them[a], ‘Thus says the Lord GOD: This burden concerns the prince in Jerusalem and all the house of Israel who are in their midst.’'
translation:
  language: ru
  text: 'Скажи им: «Так говорит Владыка Яхве: это пророчество о правителе в Иерусалиме и обо всём доме Израиля, о тех, кто находится среди них[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые находятся среди них». Не вполне ясно, к кому относится «них»; вероятно, речь о жителях Иерусалима. Возможен перевод: «которые находятся там».'
    reason: Суффикс множественного числа в בְתוֹכָם имеет неявный антецедент, поэтому его референция остаётся неоднозначной.
lexical_decisions:
- source_word: אֱמֹר אֲלֵיהֶם
  choice: Скажи им
  rationale: 'Императив אמר с אֶל естественно передаётся как введение прямой речи: «Скажи им».'
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена традиционная торжественная формула пророческого посланника, естественная и понятная в современном русском языке.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יְהוִה; сочетание избегает неестественного повтора «Господь ГОСПОДЬ».
- source_word: הַנָּשִׂיא
  choice: правитель
  rationale: В контексте Иезекииля слово обозначает политического главу; современное «правитель» точнее и естественнее здесь, чем «князь», которое может создавать неверные ассоциации с наследственным титулом.
- source_word: הַמַּשָּׂא הַזֶּה
  choice: это пророчество — о
  rationale: מַשָּׂא здесь обозначает пророческое изречение или возвещение. Русское «бремя» было бы буквальным, но в данной конструкции звучало бы неясно; тире передаёт сжатую безглагольную фразу.
- source_word: וְכָל בֵּית יִשְׂרָאֵל
  choice: и обо всём доме Израиля
  rationale: Сохранён значимый библейский национально-родовой оборот «дом Израиля», а повтор предлога делает русскую конструкцию ясной.
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: о тех, кто находится среди них
  rationale: Добавленное пояснительное «о тех» согласует собирательное «дом Израиля» с еврейским множественным הֵמָּה и сохраняет неопределённость местоименного суффикса «их».
theological_decisions:
- issue: Передача божественного имени в אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Исходный текст сочетает титул אֲדֹנָי с личным именем Бога יְהוִה. Выбранный вариант различает оба элемента и не заменяет имя общим титулом.
- issue: Значение מַשָּׂא
  choice: пророчество
  alternative: бремя; возвещение
  rationale: У слова сохраняется образный основной смысл «ноша, бремя», но в пророческой формуле оно обозначает данное Богом изречение. «Пророчество» понятно современному читателю и не превращает правителя и народ в буквальную ношу Иезекииля.
- issue: Неясный антецедент суффикса в בְתוֹכָם
  choice: среди них
  alternative: там; в его среде
  rationale: Еврейский текст употребляет суффикс множественного числа без однозначно выраженного ближайшего антецедента. Перевод сохраняет эту напряжённость, а не отождествляет «их» без оговорки с Иерусалимом или его жителями.
translation_notes:
  register: Современный литературный русский с торжественной пророческой формулой. Синтаксис слегка упрощён для ясности, но сохранены библейский оборот «дом Израиля», личное имя Яхве и подлинная неоднозначность заключительного местоимения.
