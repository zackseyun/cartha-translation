lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: У них на глазах
  rationale: Естественная русская передача еврейского выражения со значением открытого действия в видимом присутствии наблюдателей; сохраняет образ глаз.
- source_word: חֲתָר
  choice: проломай отверстие
  rationale: Глагол обозначает прокапывание или пробивание прохода; в сочетании со стеной такая передача ясно выражает требуемое физическое действие.
- source_word: לְךָ
  choice: себе
  rationale: Сохраняет дательный оттенок личной вовлечённости адресата, не превращая его в указание на отдельный предмет.
- source_word: בַקִּיר
  choice: в стене
  rationale: Определённая форма указывает на стену в данной сцене; русский предложный оборот естественно сочетается с созданием отверстия.
- source_word: וְהוֹצֵאתָ
  choice: и вынеси
  rationale: Порода хифиль глагола יצא имеет каузативное значение «вынести/вывести»; в контексте предыдущего стиха подразумевается поклажа, но в самом стихе дополнение не названо.
- source_word: בּוֹ
  choice: через него
  rationale: Местоименный суффикс отсылает к проделанному проходу или отверстию; мужской род русского «него» согласуется со словом «проход/отверстие», причём «отверстие» прямо выражено в переводе.
