  source_fidelity: Основная последовательность повелений передана верно; однако «проломай себе отверстие» менее точно отражает חתר («копать/прокапывать, пробиваться») и звучит несколько менее естественно. «Прокопай себе проход» сохраняет физическое действие, дательный оттенок לְךָ и даёт ясный антецедент для «через него». Неявное дополнение при «вынеси» в русском, как и в еврейском тексте стиха, не названо.
  naturalness: «У них на глазах» — естественное современное выражение. «Прокопай себе проход в стене и вынеси через него» литературно, ясно и сохраняет краткий повелительный синтаксис.
  terminology: Специальные богословские термины и имена отсутствуют. «Проход» — оправданное эксплицирование результата действия, необходимое для естественной русской анафоры; оно не добавляет предмет, который следовало бы выносить.
