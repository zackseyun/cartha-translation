  yaml_path: translation/ot/ezekiel/019/004.yaml
  text: The nations heard of him[a]; he was caught in their pit[c][b], and they brought him with hooks to the land of Egypt.
translation:
  language: ru
  text: Народы услышали о нём[a]; он был пойман в их ловчую яму[b], и они увели его на крюках[c] в землю Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышали его». Еврейский оборот может означать, что народы услышали вести о нём, а не его самого.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в их западню». Имеется в виду яма, устроенная для поимки зверя.'
    reason: lexical_alternative
  - marker: c
    text: Под «крюками» могут подразумеваться крюки или кольца, которыми удерживали пойманных животных и пленников.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: услышали о нём
  rationale: Оборот שׁמע אל в данном контексте естественно понимать как получение известий о нём, а не как непосредственное слышание его голоса; выражение сохраняет допустимую неоднозначность в примечании.
- source_word: גּוֹיִם
  choice: народы
  rationale: Речь идёт об иноземных народах; «язычники» внесло бы не требуемый контекстом религиозный оттенок.
- source_word: בְּשַׁחְתָּם
  choice: в их ловчую яму
  rationale: שַׁחַת обозначает яму, здесь — приспособленную для поимки зверя. Определение «ловчую» делает образ понятным современному читателю, сохраняя конкретную метафору.
- source_word: נִתְפָּשׂ
  choice: попался
  rationale: Пассивная форма означает, что лев был пойман; «попался» естественно сочетается с образом ловчей ямы.
- source_word: וַיְבִאֻהוּ
  choice: его привели
  rationale: Каузативная форма בוא означает «принесли/привели». При пленнике на крюках русское «привели» звучит естественно и не уточняет способ перемещения сверх текста.
- source_word: בַחַחִים
  choice: на крюках
  rationale: חַחִים — крюки или кольца, которыми удерживали пойманных животных либо пленников. «На крюках» передаёт средство принудительного сопровождения, не уточняя место их крепления.
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: в землю Египетскую
  rationale: Сохранена полная географическая формула еврейского текста в привычной для русского библейского повествования форме.
