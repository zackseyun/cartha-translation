base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/009.yaml
  text: They put him in a cage with hooks[a], and brought him to the king of Babylon; they brought him into strongholds[b], so that his voice might no longer be heard on the mountains of Israel.
translation:
  language: ru
  text: Его посадили в клетку с крюками[a] и привели к царю Вавилона. Его доставили в крепости[b], чтобы голос его[c] больше не был слышен на горах Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с кольцами»; речь о приспособлениях, которыми удерживали пленённое животное или человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в укреплённые места», «в место заключения»; еврейское слово может обозначать укрепления либо места пленения и заточения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «рык его». Буквально: «голос его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֻהוּ בַסּוּגַר
  choice: Его посадили в клетку
  rationale: Сוּגַר обозначает закрытое место, клетку или заточение. «Клетка» сохраняет образ пойманного льва, а глагол «посадили» естественно передаёт נתן в данном контексте.
- source_word: בַּחַחִים
  choice: с крюками
  rationale: חַחִים — крюки или кольца, которыми удерживали пленённое животное либо человека. Место их крепления в еврейском тексте не названо, поэтому оно не уточняется.
- source_word: וַיְבִאֻהוּ אֶל מֶלֶךְ בָּבֶל
  choice: и привели к царю Вавилона
  rationale: Каузативная форма בוא означает «привести, доставить». «Привели» естественно сочетается с образом пленника и не добавляет способ перевозки.
- source_word: יְבִאֻהוּ בַמְּצֹדוֹת
  choice: Его доставили в укреплённые места
  rationale: Множественное מְצֹדוֹת может обозначать крепости, укрепления или места заключения. Выражение «укреплённые места» сохраняет множественное число и не сводит значение исключительно к тюрьме.
- source_word: לְמַעַן לֹא יִשָּׁמַע קוֹלוֹ עוֹד
  choice: чтобы голос его больше не был слышен
  rationale: קוֹל буквально означает «голос, звук». «Голос» сохраняет связь как со львиным образом, так и с подразумеваемым правителем, не заменяя метафору однозначным «рыком».
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: на горах Израиля
  rationale: Это прямое и естественное соответствие устойчивому у Иезекииля выражению «горы Израиля».
theological_decisions:
- issue: Образ пленённого льва и подразумеваемого правителя
  choice: Сохранить образ пленения и умолкшего голоса, не называя конкретного иудейского царя.
  alternative: Прямо отождествить героя стиха с Иехонией или другим историческим правителем Иудеи.
  rationale: В самом стихе правитель не назван. Явное историческое отождествление сняло бы намеренную образность плача и внесло бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством плача. Повтор местоимения «его» и последовательность действий сохранены, а тяжеловесное буквальное повторение «привели… привели» слегка варьировано («привели… доставили») ради естественного русского звучания.
