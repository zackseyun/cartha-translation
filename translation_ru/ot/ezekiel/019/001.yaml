  - marker: b
    text: Здесь «князья», вероятно, означает царственных правителей, а не просто руководителей вообще.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: А ты
  rationale: Союз с независимым местоимением продолжает речь и одновременно с лёгким усилением обращает поручение непосредственно к Иезекиилю.
- source_word: שָׂא
  choice: подними
  rationale: Глагол буквально означает «поднять, нести» и в сочетании с קִינָה образует устойчивое выражение о начале или произнесении плача; «подними плач» сохраняет образность оригинала и торжественный пророческий строй.
- source_word: קִינָה
  choice: плач
  rationale: Слово обозначает скорбную, нередко погребальную песнь; «плач» естественно и традиционно передаёт этот жанр по-русски, не сужая значение до песни как формы исполнения.
- source_word: אֶל
  choice: о
  rationale: При словах плача предлог обозначает тех, кому посвящён плач; русское «плач о…» ясно и естественно выражает это отношение.
- source_word: נְשִׂיאֵי
  choice: князьях
  rationale: Слово обозначает высокопоставленных правителей. В данном династическом контексте «князья» сохраняет политический и царский оттенок, но не заменяет исходное слово более узким «цари».
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Устоявшаяся русская форма имени; родительный падеж обусловлен сочетанием «князья Израиля».
theological_decisions:
- issue: Кого обозначают «князья Израиля»
  choice: В основном тексте сохранено более широкое династическо-политическое обозначение «князья Израиля».
  alternative: «цари Израиля» или «правители Израиля»
  rationale: Еврейский текст употребляет נְשִׂיאֵי, а не специальное слово «цари». Хотя дальнейший плач относится к царским фигурам, перевод не должен устранять сохранённую оригиналом степень неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «подними плач» намеренно сохраняет образ еврейского выражения; сноска поясняет его идиоматический смысл. Порядок слов подчёркивает прямое обращение «А ты».
