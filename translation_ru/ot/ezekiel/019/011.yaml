  yaml_path: translation/ot/ezekiel/019/011.yaml
  text: And she had strong branches for rulers’ scepters[a], and its stature rose high among the thick boughs; it was seen in its height, in the abundance of its branches.
translation:
  language: ru
  text: И были у неё крепкие ветви для скипетров правителей, и её рост высоко поднялся среди густых ветвей[a]; она была заметна своей высотой и множеством своих ветвей.
  philosophy: optimal-equivalence
  footnotes:
