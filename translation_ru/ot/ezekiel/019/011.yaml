    text: 'Или: «над густой листвой»; традиционный перевод «выше облаков» возможен, но в контексте виноградной лозы менее вероятен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטּוֹת עֹז
  choice: крепкие ветви
  rationale: מַטּוֹת может означать жезлы, посохи или ветви; в аллегории о виноградной лозе ботанический образ требует «ветви», а עֹז передаёт их крепость и силу.
- source_word: אֶל שִׁבְטֵי מֹשְׁלִים
  choice: для скипетров правителей
  rationale: שִׁבְטֵי в сочетании с מֹשְׁלִים имеет царственный смысл «скипетры»; אֶל передано прямо как указание на назначение.
- source_word: וַתִּגְבַּהּ קוֹמָתוֹ
  choice: и высоко поднялась она
  rationale: Фраза описывает высокий рост лозы. Женский род глагола соответствует лозе; естественное русское выражение сохраняет олицетворённый образ без буквального и тяжеловесного «её рост возвысился».
- source_word: עַל בֵּין עֲבֹתִים
  choice: среди густых ветвей
  rationale: עֲבֹתִים в контексте лозы вероятнее обозначает густые ветви или листву; необычное עַל בֵּין передано естественным «среди». Альтернативное понимание отмечено в сноске.
- source_word: וַיֵּרָא בְגָבְהוֹ
  choice: она выделялась своей высотой
  rationale: Нифаль וַיֵּרָא означает «была видна, стала заметна»; «выделялась» естественно передаёт заметность благодаря высоте.
- source_word: בְּרֹב דָּלִיֹּתָיו
  choice: и множеством своих побегов
  rationale: דָּלִיּוֹת — свисающие ветви или побеги лозы; «побеги» позволяет сохранить ботанический образ и избежать чрезмерного повторения слова «ветви».
