  text: וַ/יִּתְהַלֵּ֥ךְ בְּ/תוֹךְ אֲרָי֖וֹת כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/006.yaml
  text: He prowled among the lions; he became a young lion[a]. He learned to tear prey; he devoured men.
translation:
  language: ru
  text: Он бродил среди львов и стал молодым львом. Он научился терзать добычу и пожирал людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: бродил
  rationale: Возвратная порода глагола הלך здесь передаёт продолжительное или повторяющееся передвижение среди львов. «Бродил» естественно звучит по-русски и не добавляет к тексту прямо не выраженного намерения выслеживать добычу.
- source_word: בְּתוֹךְ אֲרָיוֹת
  choice: среди львов
  rationale: Точно и естественно передаёт значение «посреди, среди».
- source_word: כְּפִיר הָיָה
  choice: стал молодым львом
  rationale: כְּפִיר обозначает молодого, уже сильного льва, а הָיָה в развитии аллегории естественно передать как «стал».
- source_word: וַיִּלְמַד
  choice: научился
  rationale: Глагол означает приобретение умения и не указывает на внешнего наставника.
- source_word: לִטְרָף טֶרֶף
  choice: терзать добычу
  rationale: Сочетание однокоренных слов усиливает хищнический образ; «терзать добычу» сохраняет его жестокую конкретность и естественно звучит по-русски.
- source_word: אָדָם אָכָל
  choice: пожирал людей
  rationale: В образе хищного зверя אָכַל уместно передать как «пожирал», а собирательное אָדָם — естественным русским множественным числом «людей».
theological_decisions:
- issue: Собирательное значение אָדָם в хищнической метафоре
  choice: людей
  alternative: человека / род человеческий
  rationale: Здесь речь не об антропологическом учении, а об объектах насилия в аллегории. «Людей» передаёт собирательный смысл без неестественной двусмысленности русского единственного числа.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым ритмом пророческой поэзии. Сохранены львиная метафора, развитие образа и резкость насилия; архаизмы и добавочные толкования исключены.
