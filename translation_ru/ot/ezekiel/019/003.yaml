  text: וַ/תַּ֛עַל אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/003.yaml
  text: She brought up one of her cubs; he became a young lion[a], and he learned to tear prey; he devoured people.
translation:
  language: ru
  text: Она вырастила одного из своих львят; он стал молодым львом и научился терзать добычу — он пожирал людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַל
  choice: Она вырастила
  rationale: Каузативная форма от עלה буквально связана с поднятием или выведением вверх; в образе львицы естественное русское «вырастила» передаёт вскармливание и воспитание детёныша.
- source_word: אֶחָד מִגֻּרֶיהָ
  choice: одного из своих львят
  rationale: גּוּר обозначает детёныша зверя, здесь — льва; русский партитивный оборот точно и естественно передаёт еврейскую конструкцию.
- source_word: כְּפִיר הָיָה
  choice: он стал молодым львом
  rationale: כְּפִיר — молодой лев, уже способный охотиться; в последовательности взросления הָיָה уместно передать динамическим «стал», а не статическим «был».
- source_word: וַיִּלְמַד לִטְרָף טֶרֶף
  choice: научился терзать добычу
  rationale: Однокоренная глагольно-именная конструкция подчёркивает хищническое действие; «терзать добычу» сохраняет его силу и образность.
- source_word: אָדָם אָכָל
  choice: он пожирал людей
  rationale: Хотя אָדָם грамматически стоит в единственном числе, здесь слово имеет родовое значение; множественное «людей» естественно по-русски передаёт неоднократное людоедство, а «пожирал» соответствует хищническому контексту.
theological_decisions:
- issue: Передача родового אָדָם в единственном числе
  choice: людей
  alternative: человека
  rationale: Форма единственного числа сохранена как смысловой родовой термин, но буквальное «пожирал человека» по-русски может ошибочно указывать на единственную жертву. «Пожирал людей» ясно выражает обобщённый человеческий референт, не добавляя гендерного или конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; высокий, но общепонятный пророческий регистр. Сохранена последовательность взросления львёнка и усилена естественная для русского текста кульминация посредством тире.
