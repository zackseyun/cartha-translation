base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/007.yaml
  text: He knew their widows[a], and he laid waste their cities; the land and its fullness was desolated by the sound of his roaring.
translation:
  language: ru
  text: Он знал их вдов[a] и разорял их города; земля и всё, что её наполняло, опустели от звука его рыка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «он знал его вдов». В данном контексте глагол «знал» может иметь враждебный или сексуальный оттенок; некоторые понимают эту строку как указание на насилие над женщинами. Другие, следуя иному прочтению трудного еврейского выражения, переводят: «он разрушал их дворцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: знал
  rationale: Сохраняет основное значение еврейского глагола ידע и намеренно не снимает трудную двусмысленность контекста; возможный враждебный или сексуальный оттенок отмечен в сноске.
- source_word: אַלְמְנוֹתָיו
  choice: их вдов
  rationale: Передаёт масоретскую огласовку как «вдов», а местоимение согласует по смыслу с последующим «их города». Буквальная форма «его вдов» и текстовая альтернатива «дворцы» указаны в сноске.
- source_word: וְעָרֵיהֶם הֶחֱרִיב
  choice: и разорял их города
  rationale: Глагол החריב означает опустошать, разорять. Несовершенный русский вид естественно описывает действия хищного правителя в поэтическом образе льва.
- source_word: וַתֵּשַׁם
  choice: опустели
  rationale: Глагол שמם выражает состояние запустения. Множественное число естественно соотносит сказуемое с землёй и всем её содержимым.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: земля и всё, что её наполняло
  rationale: Естественно и ясно передаёт еврейскую идиому «земля и её полнота», не сохраняя неясную для современного читателя кальку.
- source_word: מִקּוֹל שַׁאֲגָתוֹ
  choice: от звука его рыка
  rationale: Предлог מן обозначает причину или источник; «от звука» сохраняет причинную связь и львиный образ.
theological_decisions:
- issue: Трудное выражение אַלְמְנוֹתָיו в метафорической песни-плаче о суде
  choice: Сохранить чтение масоретского текста со значением «вдовы», не конкретизируя возможное насилие.
  alternative: «его вдов»; при ином прочтении — «их/его дворцы».
  rationale: Это лексическая и текстологическая трудность, а не основание для догматического уточнения. Основной текст остаётся близким к засвидетельствованному еврейскому чтению, а реальные альтернативы раскрываются в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Формула «всё, что её наполняло» проясняет древнюю идиому, а «рык» естественно сохраняет образ льва.
