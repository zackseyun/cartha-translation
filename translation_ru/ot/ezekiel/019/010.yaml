  text: אִמְּ/ךָ֥ כַ/גֶּ֛פֶן בְּ/דָמְ/ךָ֖ עַל מַ֣יִם שְׁתוּלָ֑ה פֹּֽרִיָּה֙ וַֽ/עֲנֵפָ֔ה הָיְתָ֖ה מִ/מַּ֥יִם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/010.yaml
  text: Your mother was like a vine in your vineyard[a], planted by waters; she was fruitful and full of branches because of abundant waters.
translation:
  language: ru
  text: Твоя мать была подобна виноградной лозе в твоей крови[a], посаженной у вод; благодаря обильным водам она была плодоносной и ветвистой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоей крови» — трудное для понимания еврейское выражение. Предлагались также чтения: «в твоём подобии» и «в твоём винограднике».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִמְּךָ
  choice: твоя мать
  rationale: Сохранено прямое значение существительного с притяжательным суффиксом. Образ матери может указывать на царский дом или народ, но это толкование не подставляется в основной текст.
- source_word: כַגֶּפֶן
  choice: подобна виноградной лозе
  rationale: כ выражает сравнение, а גפן означает виноградную лозу. Формулировка естественна для современного литературного русского языка и сохраняет поэтическое сравнение.
- source_word: בְּדָמְךָ
  choice: в твоей крови[a]
  rationale: Масоретский текст буквально читается как «в твоей крови». Хотя выражение трудно для понимания, оно сохранено в основном тексте, а вероятные иные прочтения вынесены в сноску.
- source_word: עַל מַיִם
  choice: у вод
  rationale: Предлог עַל в данном образе обозначает расположение возле источников воды. Множественное число и поэтический характер оригинала сохранены.
- source_word: שְׁתוּלָה
  choice: посаженной
  rationale: Страдательное причастие от שתל передано прямым русским соответствием и согласовано с «лозой».
- source_word: פֹּרִיָּה
  choice: плодоносной
  rationale: Прилагательное обозначает способность обильно приносить плод; «плодоносной» кратко и естественно передаёт этот смысл.
- source_word: וַעֲנֵפָה
  choice: ветвистой
  rationale: Слово связано с ветвями и описывает лозу, имеющую много ветвей. «Ветвистой» сохраняет прилагательную форму и звучит естественно по-русски.
- source_word: הָיְתָה
  choice: она была
  rationale: Женский род соответствует и «матери», и «лозе», сохраняя единство поэтического образа.
- source_word: מִמַּיִם רַבִּים
  choice: благодаря обильным водам
  rationale: מן передаёт источник или причину плодородия лозы; «благодаря» ясно выражает причинную связь, а «обильным водам» сохраняет множественное число и идею изобилия.
theological_decisions:
- issue: Передача трудного выражения בְּדָמְךָ
  choice: Сохранить в основном тексте масоретское чтение «в твоей крови» и отметить варианты в сноске.
  alternative: «в твоём подобии» или «в твоём винограднике»
  rationale: Трудность носит текстологический и лексический, а не вероучительный характер. Сохранение буквального чтения не устраняет неоднозначность молча и позволяет читателю видеть реальную неопределённость древнего текста.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим строем. Неясность масоретского текста сохранена, а не сглажена; синтаксис при этом сделан понятным для обычного читателя.
