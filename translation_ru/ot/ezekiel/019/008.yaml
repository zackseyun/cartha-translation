  text: Then nations from the provinces set themselves against him all around[a], and they spread their net over him[b]; he was caught in their pit.
translation:
  language: ru
  text: Тогда народы из областей выступили против него со всех сторон[a]; они раскинули над ним свою сеть, и он был пойман в их яме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тогда народы со всех сторон пришли против него из областей». Еврейское выражение буквально допускает значение «направились (или выступили) против него».'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, речь идёт о яме-западне, использовавшейся при охоте.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: выступили против него
  rationale: Еврейская конструкция נתן על в данном контексте выражает направленное против кого-либо враждебное действие. «Выступили против него» естественно звучит по-русски и сохраняет значение согласованного нападения.
- source_word: גּוֹיִם
  choice: народы
  rationale: Обычное значение — «народы»; вариант «язычники» привнёс бы религиозное противопоставление, не выдвинутое здесь на первый план.
- source_word: סָבִיב מִמְּדִינוֹת
  choice: из областей... со всех сторон
  rationale: מְדִינוֹת обозначает области или административные территории, а סָבִיב передаёт окружение со всех сторон. Такой порядок слов ясен в современном русском языке.
- source_word: וַיִּפְרְשׂוּ עָלָיו רִשְׁתָּם
  choice: раскинули над ним свою сеть
  rationale: Глагол פרשׂ означает «раскинуть, расправить», а רֶשֶׁת — «сеть». Формулировка сохраняет образ охоты на льва.
- source_word: בְּשַׁחְתָּם
  choice: в их ловчей яме
  rationale: שַׁחַת может обозначать яму, в том числе устроенную как западня. Определение «ловчей» естественно раскрывает подразумеваемую функцию ямы, не нарушая образа.
- source_word: נִתְפָּשׂ
  choice: был пойман
  rationale: Страдательная форма означает «быть пойманным, схваченным»; «был пойман» точнее всего поддерживает охотничью метафору.
