  text: 'и скажи: «Что за львица была твоя мать! Среди львов[a] она лежала, среди молодых львов растила[b] своих львят».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «среди львиц». Еврейскую форму множественного числа можно понимать в общем смысле — «львы», хотя в связи с образом львицы возможен перевод по смыслу в женском роде.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «умножала» или «делала многочисленными» своих львят. Еврейский глагол может выражать идею увеличения, но в данном контексте с большей вероятностью означает выращивание потомства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אִמְּךָ לְבִיָּא
  choice: Кем была твоя мать? Львицей.
  rationale: Еврейская именная конструкция представляет риторический вопрос и немедленный ответ. По-русски «кем была» естественно передаёт вопрос о том, в каком образе предстаёт мать, и сохраняет выразительное расчленение фразы.
- source_word: אִמְּךָ
  choice: твоя мать
  rationale: Сохранено прямое обращение во втором лице единственного числа.
- source_word: לְבִיָּא
  choice: львицей
  rationale: Существительное обозначает именно самку льва; женский род важен для образа матери.
- source_word: בֵּין אֲרָיוֹת
  choice: среди львов
  rationale: Передан общий смысл формы множественного числа без подгонки под женский образ львицы; контекстуальный вариант «среди львиц» отмечен в сноске.
- source_word: רָבָצָה
  choice: лежала
  rationale: Глагол обозначает лежание или возлежание животного. Нейтральное «лежала» сохраняет образ, не добавляя оттенка отдыха или готовности к прыжку.
- source_word: בְּתוֹךְ כְּפִרִים
  choice: среди молодых львов
  rationale: כְּפִיר обозначает молодого льва, обычно уже не просто детёныша; повтор «среди» естественно передаёт пространственный параллелизм.
- source_word: רִבְּתָה
  choice: растила
  rationale: При дополнении «своих львят» глагол указывает на выращивание потомства. «Растила» ясно и современно, при этом не исключает лежащую в основе идею увеличения или умножения.
- source_word: גוּרֶיהָ
  choice: своих львят
  rationale: Слово обозначает детёнышей льва; возвратное притяжательное местоимение естественно для русского языка и точно выражает суффикс третьего лица женского рода.
