  text: וַ/תֻּתַּ֤שׁ בְּ/חֵמָה֙ לָ/אָ֣רֶץ הֻשְׁלָ֔כָה וְ/ר֥וּחַ הַ/קָּדִ֖ים הוֹבִ֣ישׁ פִּרְיָ֑/הּ הִתְפָּרְק֧וּ וְ/יָבֵ֛שׁוּ מַטֵּ֥ה עֻזָּ֖/הּ אֵ֥שׁ אֲכָלָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/012.yaml
  text: But she was uprooted in wrath; she was thrown down to the ground[a]. And the east wind dried up her fruit; her strong branch was torn off and withered; fire consumed it.
translation:
  language: ru
  text: Но в ярости её вырвали с корнем и бросили на землю. Восточный ветер иссушил её плод; её крепкая ветвь[a] была отломлена и засохла; огонь пожрал её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жезл её силы»; еврейское слово может означать как ветвь, так и жезл или скипетр, поэтому здесь образ лозы одновременно намекает на царскую власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּתַּשׁ
  choice: её вырвали с корнем
  rationale: Страдательная форма נתשׁ в образе виноградной лозы означает насильственное извлечение из земли вместе с корнями; выражение естественно и наглядно по-русски.
- source_word: בְּחֵמָה
  choice: в ярости
  rationale: חֵמָה обозначает жгучую ярость или гнев; «в ярости» сохраняет краткость и силу выражения.
- source_word: לָאָרֶץ הֻשְׁלָכָה
  choice: бросили на землю
  rationale: Передаёт насильственное низвержение и сохраняет естественный современный русский синтаксис.
- source_word: רוּחַ הַקָּדִים
  choice: восточный ветер
  rationale: Устойчивое обозначение иссушающего ветра с востока.
- source_word: הוֹבִישׁ פִּרְיָהּ
  choice: иссушил её плод
  rationale: Каузативная форма יבשׁ указывает, что ветер сделал плод сухим; «иссушил» соответствует поэтическому регистру плача.
- source_word: הִתְפָּרְקוּ וְיָבֵשׁוּ
  choice: была отломлена и засохла
  rationale: Глаголы описывают отделение, а затем увядание. Формы во множественном числе могут относиться к собирательному или множественному образу ветвей, однако ближайшее מַטֵּה грамматически единственно; русский перевод следует этому образу без исправления текста.
- source_word: מַטֵּה עֻזָּהּ
  choice: её крепкая ветвь
  rationale: В непосредственном контексте лозы מַטֶּה сохраняет значение ветви, а עֹז выражает силу. Царский оттенок жезла или скипетра сохранён в примечании.
- source_word: אֵשׁ אֲכָלָתְהוּ
  choice: огонь пожрал её
  rationale: Буквальный образ אכל — «есть, пожирать» — уместен для огня и сохраняет резкость поэзии; местоимение относится к ветви или жезлу.
theological_decisions:
- issue: Двойной образ מַטֵּה עֻזָּהּ в плаче о царском доме как о лозе
  choice: 'В основном тексте: «её крепкая ветвь», с примечанием о возможном значении жезла или скипетра.'
  alternative: «её могущественный скипетр» или «жезл её силы»
  rationale: Ближайший контекст последовательно изображает лозу, плод и ветер, поэтому «ветвь» сохраняет цельность образа. Вместе с тем в стихе 11 ветви связаны с царской властью; примечание не позволяет устранить намеренное наложение растительного и царского образов.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. «Иссушил» и «пожрал» сохраняют возвышенную образность, не делая текст архаичным. Местоимения женского рода поддерживают олицетворение лозы.
