base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/014.yaml
  text: And fire went out from a branch of its limbs[a]; it consumed its fruit, and there was not in it a strong branch, a scepter to rule. This is a lamentation[b], and it has become a lamentation.
translation:
  language: ru
  text: И вышел огонь из ветви среди её побегов[a] и пожрал её плоды; и не было в ней крепкой ветви, жезла для владычества[b]. Это плачевная песнь, и она стала плачевной песнью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из жезла среди её ветвей». Еврейское слово מַטֶּה может означать ветвь, жезл или посох. Основной текст следует образу виноградной лозы, а царский смысл далее выражен словом «жезл».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в ней не было крепкого жезла, скипетра для владычества». В еврейском тексте намеренно переплетаются образы лозы и царской власти.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: И вышел огонь
  rationale: Сохраняет яркое повествовательное движение еврейского текста и естественно звучит по-русски.
- source_word: מִמַּטֵּה בַדֶּיהָ
  choice: из ветви среди её побегов
  rationale: מַטֶּה допускает значения «ветвь», «жезл», «посох»; в контексте виноградной лозы основным выбрано растительное значение. בַדֶּיהָ передано как «её побеги», чтобы различить два близких термина.
- source_word: פִּרְיָהּ אָכָלָה
  choice: пожрал её плоды
  rationale: Глагол אָכַל применительно к огню выражает уничтожение; «пожрал» сохраняет силу образа и согласуется с подлежащим «огонь» в русском языке.
- source_word: וְלֹא הָיָה בָהּ
  choice: И не осталось на ней
  rationale: В данном контексте естественно выражает результат пожара и отсутствие у лозы необходимой ветви; местоимение относится к лозе.
- source_word: מַטֵּה עֹז
  choice: крепкой ветви
  rationale: «Крепкая ветвь» продолжает образ лозы, не устраняя скрытого значения жезла как знака власти.
- source_word: שֵׁבֶט לִמְשׁוֹל
  choice: скипетра, чтобы править
  rationale: «Скипетр» ясно передаёт царскую власть и сохраняет переход от растительного образа к образу правления.
- source_word: קִינָה הִיא וַתְּהִי לְקִינָה
  choice: Это плачевная песнь, и она стала плачевной песнью
  rationale: «Плачевная песнь» передаёт жанровое значение קִינָה; повтор сохранён, поскольку он присутствует в оригинале и завершает стих торжественной формулой.
theological_decisions:
- issue: Царский образ внутри аллегории о виноградной лозе
  choice: 'Сохранить оба плана: מַטֵּה передать как «ветвь», а שֵׁבֶט — как «скипетр».'
  alternative: Передать оба слова единообразно как «жезл» либо как «ветвь».
  rationale: 'Еврейский текст намеренно соединяет растительный образ с царским: ветвь лозы должна была стать скипетром правителя. Единообразный перевод сгладил бы это напряжение.'
- issue: Референт женского суффикса בָהּ
  choice: Передать как «на ней», относя к подразумеваемой лозе.
  alternative: 'Передать без явного рода: «в ней не было».'
  rationale: Контекст предыдущих стихов представляет мать/царскую династию как лозу. Русская форма «на ней» естественна для ветвей лозы, при этом не устраняет аллегорического уровня.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией плача. Сохранены образность, синтаксический параллелизм и заключительный повтор; архаизмы ограничены уместным царским термином «скипетр».
