  yaml_path: translation/ot/ezekiel/019/005.yaml
  text: When she saw that she had waited in vain[a], that her hope was lost, she took one of her cubs and made him a young lion.
translation:
  language: ru
  text: Когда она увидела, что напрасно ждала[a] и что надежда её погибла, она взяла одного из своих львят и сделала его молодым львом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ослабела»; возможно также: «разочаровалась». Еврейское слово трудно для истолкования; в основном тексте оно понято в контексте как тщетное ожидание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא כִּי
  choice: Когда она увидела, что
  rationale: Последовательная глагольная форма продолжает повествование, а כִּי вводит содержание увиденного. Конструкция с «когда» естественно передаёт временную связь.
- source_word: נוֹחֲלָה
  choice: напрасно ждала
  rationale: Редкая и трудная форма допускает разные толкования. В сочетании со словами о погибшей надежде контекстуально наиболее вероятен смысл тщетного ожидания; неопределённость отмечена в сноске.
- source_word: אָבְדָה תִּקְוָתָהּ
  choice: надежда её погибла
  rationale: Сохраняется сильный образ еврейского глагола אָבד и поэтический строй плача; постпозиция местоимения придаёт фразе dignified biblical register без архаизации.
- source_word: וַתִּקַּח אֶחָד מִגֻּרֶיהָ
  choice: она взяла одного из своих львят
  rationale: גּוּר в развёрнутом образе львицы обозначает львёнка. «Одного» буквально передаёт אֶחָד, не добавляя прямо не выраженного значения «другого».
- source_word: כְּפִיר
  choice: молодым львом
  rationale: כְּפִיר обозначает молодого льва; перевод сохраняет различие между львёнком и уже возмужавшим молодым львом.
- source_word: שָׂמָתְהוּ
  choice: сделала его
  rationale: Буквально глагол означает «поставила/сделала». Формулировка сохраняет сжатую метафору оригинала и не добавляет прямо не выраженного процесса воспитания или назначения.
