  text: וְ/עַֽל הַ/נָּשִׂ֣יא יִהְיֶ֗ה הָ/עוֹל֣וֹת וְ/הַ/מִּנְחָה֮ וְ/הַ/נֵּסֶךְ֒ בַּ/חַגִּ֤ים וּ/בֶ/חֳדָשִׁים֙ וּ/בַ/שַּׁבָּת֔וֹת בְּ/כָֽל מוֹעֲדֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֽוּא יַעֲשֶׂ֞ה אֶת הַ/חַטָּ֣את וְ/אֶת הַ/מִּנְחָ֗ה וְ/אֶת הָֽ/עוֹלָה֙ וְ/אֶת הַ/שְּׁלָמִ֔ים לְ/כַפֵּ֖ר בְּעַ֥ד בֵּֽית יִשְׂרָאֵֽל־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/017.yaml
  text: And the burnt offerings[a], the grain offering, and the drink offering at the feasts, at the new moons, and at the Sabbaths—at all the appointed times of the house of Israel—shall be the prince’s responsibility. He shall provide the sin offering, the grain offering, the burnt offering, and the peace offerings[b], to make atonement for the house of Israel.
translation:
  language: ru
  text: На князе лежит обязанность обеспечивать всесожжения, хлебное приношение и возлияние во время праздников, новомесячий и суббот — во все назначенные времена Израиля. Он должен обеспечивать жертву за грех[a], хлебное приношение, всесожжение и мирные жертвы[b], чтобы совершать искупление за дом Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительную жертву».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертвы общения» или «жертвы благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַנָּשִׂיא יִהְיֶה
  choice: На князе будет лежать обязанность
  rationale: Конструкция с עַל и היה выражает возложенную обязанность; русский оборот передаёт её естественно, не превращая приношения в собственность князя.
- source_word: הַנָּשִׂיא
  choice: князь
  rationale: В книге Иезекииля נָשִׂיא обозначает гражданского правителя; «князь» сохраняет устойчивую терминологию и не уточняет титул как «царь».
- source_word: הָעוֹלוֹת / הָעוֹלָה
  choice: всесожжения / всесожжение
  rationale: עוֹלָה — жертва, целиком сжигаемая на жертвеннике; традиционный русский термин «всесожжение» точен и узнаваем. В первом случае сохранено множественное число, во втором — единственное.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из продуктов земледелия, прежде всего муки; «хлебное приношение» — ясный и принятый русский эквивалент.
- source_word: הַנֵּסֶךְ
  choice: возлияние
  rationale: נֶסֶךְ обозначает жидкое приношение, которое выливали; «возлияние» точно и достаточно понятно передаёт культовый термин.
- source_word: בַּחַגִּים וּבֶחֳדָשִׁים וּבַשַּׁבָּתוֹת
  choice: во время праздников, новомесячий и суббот
  rationale: Сохранены три категории священного календаря; «новомесячия» обозначают празднования начала месяца, а не просто календарные месяцы.
- source_word: בְּכָל מוֹעֲדֵי בֵּית יִשְׂרָאֵל
  choice: во все установленные времена дома Израиля
  rationale: מוֹעֲדִים шире, чем одни праздники, и означает назначенные священные сроки; формулировка также избегает повтора слова «праздники».
- source_word: הוּא יַעֲשֶׂה
  choice: Он будет доставлять
  rationale: עשה буквально допускает «совершать/приготовлять», но в контексте обязанностей князя может обозначать обеспечение жертв. «Доставлять» передаёт снабжение приношениями, не приписывая князю однозначно священнического действия.
- source_word: הַחַטָּאת
  choice: жертва за грех
  rationale: חַטָּאת в жертвенном контексте обозначает особый вид жертвы. Традиционный вариант сохранён в тексте, а функциональное понимание как очистительной жертвы отмечено в сноске.
- source_word: הַשְּׁלָמִים
  choice: мирные жертвы
  rationale: Традиционный русский культовый термин передаёт שְׁלָמִים; возможные оттенки общения и благополучия сохранены в сноске.
- source_word: לְכַפֵּר בְּעַד
  choice: чтобы совершать искупление за
  rationale: כפר в жертвенном контексте обозначает совершение искупления. Перевод сохраняет культово-богословский язык, не навязывая конкретной поздней теории искупления.
theological_decisions:
- issue: Роль князя в жертвенном богослужении
  choice: Князь отвечает за доставление необходимых приношений.
  alternative: Князь лично совершает жертвоприношения как священник.
  rationale: На князя возложена обязанность, а глагол עשה в этом контексте может относиться к обеспечению жертв. Перевод не исключает его более активного участия, но и не утверждает прямо не названную священническую роль.
- issue: Значение языка искупления
  choice: Сохранено выражение «совершать искупление» в рамках жертвенного устройства храмового видения Иезекииля.
  alternative: Перефразировать выражение посредством более поздней систематико-богословской категории.
  rationale: Текст говорит о культовом искуплении за дом Израиля; перевод сохраняет эту формулировку без добавления не выраженной здесь доктринальной схемы.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Культовые термины сохранены там, где они точны и узнаваемы; синтаксис сделан ясным для обычного читателя. Все сноски отмечены в основном тексте.
