  to: На князе лежит обязанность обеспечивать всесожжения, хлебное приношение и возлияние во время праздников, новомесячий и суббот — во все назначенные времена Израиля. Он должен обеспечивать жертву за грех[a], хлебное приношение, всесожжение и мирные жертвы[b], чтобы совершать искупление за дом Израиля.
