source:
  edition: WLC
  text: וּ/בְ/הַפִּֽילְ/כֶ֨ם אֶת הָ/אָ֜רֶץ בְּ/נַחֲלָ֗ה תָּרִימוּ֩ תְרוּמָ֨ה לַ/יהוָ֥ה קֹדֶשׁ֮ מִן הָ/אָרֶץ֒ אֹ֗רֶךְ חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וְ/רֹ֖חַב עֲשָׂ֣רָה אָ֑לֶף קֹדֶשׁ ה֥וּא בְ/כָל גְּבוּלָ֖/הּ סָבִֽיב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/001.yaml
  text: 'And when you divide the land as an inheritance[a], you shall set apart a contribution to Yahweh, a holy portion from the land: twenty-five thousand cubits in length and ten thousand in width[b]. It shall be holy within all its surrounding boundary.'
translation:
  language: ru
  text: 'Когда вы будете распределять землю в наследие[a], отделите как приношение Яхве священный участок земли: двадцать пять тысяч в длину и десять тысяч в ширину[b]. Этот участок будет священным во всех своих пределах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда вы будете распределять землю по жребию в наследие».'
    reason: lexical_alternative
  - marker: b
    text: Единица измерения в еврейском тексте не названа.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהַפִּילְכֶם אֶת־הָאָרֶץ
  choice: Когда вы будете распределять землю
  rationale: Hiphil глагола נפל в контексте наделения землёй означает распределение участков, исторически связанное с жеребьёвкой. «Распределять» естественно звучит по-русски, а более конкретная возможность отмечена в сноске.
- source_word: בְּנַחֲלָה
  choice: в наследие
  rationale: נַחֲלָה обозначает наследственный удел или владение; формулировка сохраняет характерную библейскую связь земли с наследием.
- source_word: תָּרִימוּ תְרוּמָה
  choice: отделите как приношение
  rationale: Сочетание רום и תְּרוּמָה означает выделить предназначенную Богу долю. «Приношение» сохраняет культовый оттенок, а глагол «отделите» ясно показывает, что речь идёт об участке земли.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог указывает на посвящение участка Яхве; личное имя передано транслитерацией в соответствии с исходным текстом.
- source_word: קֹדֶשׁ מִן־הָאָרֶץ
  choice: священный участок земли
  rationale: קֹדֶשׁ употреблено субстантивно и обозначает посвящённую территорию. «Участок» здесь естественнее неопределённого «нечто священное» и подтверждается следующими размерами.
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף ... וְרֹחַב עֲשָׂרָה אָלֶף
  choice: двадцать пять тысяч локтей в длину и десять тысяч в ширину
  rationale: Единица измерения в еврейском тексте не названа; «локтей» добавлено по контексту видения храма и вынесено в примечание. Повтор слова «длина» сглажен ради естественного русского синтаксиса.
- source_word: קֹדֶשׁ הוּא בְכָל־גְּבוּלָהּ סָבִיב
  choice: Вся территория в его границах будет священна
  rationale: Передаёт всеохватность בְכָל и мысль о святости всего участка внутри его периметра. Будущее время соответствует предписывающему контексту.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе непосредственно стоит тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение святости участка
  choice: Вся территория в его границах будет священна
  alternative: Он свят по всей своей границе вокруг
  rationale: Русская формулировка показывает, что священной является вся ограниченная территория, не уточняя сверх текста характер или степень её святости.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного пророческого текста. Сохранена терминология наследия, посвящения и святости; тяжеловесная буквальность еврейского порядка слов умеренно сглажена.
