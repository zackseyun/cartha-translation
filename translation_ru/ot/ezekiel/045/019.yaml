base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/019.yaml
  text: And the priest shall take some of the blood of the sin offering and put it on the doorposts of the temple[a], on the four corners of the altar ledge, and on the doorposts of the gate of the inner court.
translation:
  language: ru
  text: И пусть священник возьмёт немного крови жертвы за грех[a] и нанесёт её на косяк храма, на четыре угла уступа жертвенника[b] и на косяк ворот внутреннего двора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительной жертвы». Еврейское слово может обозначать жертву, связанную как с грехом, так и с ритуальным очищением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выступа», «площадки» или «ограждения» жертвенника. Еврейский технический термин обозначает архитектурный элемент, связанный с жертвенником; его точная форма не вполне ясна.'
    reason: architectural_term_uncertainty
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  choice: И пусть священник возьмёт
  rationale: Вав с перфектом в контексте последовательных культовых предписаний передан как распоряжение; единственное число существительного сохранено.
- source_word: מִדַּם הַחַטָּאת
  choice: немного крови жертвы за грех
  rationale: Предлог מִן указывает на часть крови, а חַטָּאת в жертвенном контексте обозначает жертвоприношение, связанное с грехом и очищением.
- source_word: וְנָתַן אֶל
  choice: и нанесёт её на
  rationale: В контексте ритуального употребления крови נתן означает её помещение или нанесение на указанные части сооружения; местоимение добавлено для естественности русского синтаксиса.
- source_word: מְזוּזַת הַבַּיִת
  choice: косяк храма
  rationale: Еврейский текст использует единственное число מְזוּזַת; הַבַּיִת в данном видении обозначает храмовое здание.
- source_word: אַרְבַּע פִּנּוֹת הָעֲזָרָה לַמִּזְבֵּחַ
  choice: четыре угла выступа жертвенника
  rationale: פִּנּוֹת передано как «угла», а технически неоднозначное עֲזָרָה — как окружающий выступ или уступ жертвенника, что соответствует архитектурному контексту Иез 43.
- source_word: מְזוּזַת שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: косяк ворот внутреннего двора
  rationale: Сохранено единственное число מְזוּזַת; «внутренний двор» является естественным русским обозначением части храмового комплекса.
theological_decisions:
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное и понятное выражение «жертва за грех» передаёт связь термина с грехом, не отрицая очистительной функции обряда; значимая альтернатива сохранена в сноске.
- issue: Архитектурное значение עֲזָרָה при жертвеннике
  choice: выступ жертвенника
  alternative: ограждение жертвенника / площадка жертвенника
  rationale: Контекст описания жертвенника поддерживает значение окружающего архитектурного выступа, однако редкий технический термин не позволяет установить форму детали с полной уверенностью.
translation_notes:
  register: Современный литературный русский язык с достоинством культового предписания. Формула «пусть… возьмёт… и нанесёт» естественно передаёт нормативную последовательность. В соответствии с еврейским единственным числом употреблено «косяк», а не «косяки».
