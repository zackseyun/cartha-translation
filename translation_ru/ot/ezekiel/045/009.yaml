  source_fidelity: В целом перевод точно передаёт повелительный характер стиха, упрёк правителям, пару «насилие и грабёж» и призыв к справедливости и правде. Однако גְרֻשׁוֹתֵיכֶם — существительное с притяжательным суффиксом («ваши изгнания/выселения, ваши действия по вытеснению»), а не глагольная конструкция с прямым дополнением. Формулировка «перестаньте изгонять Мой народ» передаёт общий смысл, но несколько сужает и перестраивает образ оригинала. Более близкое «прекратите ваши выселения моего народа» в русском двусмысленно; «прекратите выселять Мой народ» сохраняет смысл естественно, хотя также глаголизирует еврейское существительное. Безопаснее сохранить неоднозначность через «прекратите изгонять Мой народ» и уточнить сноску, что возможны также выселение и лишение владений. Существенной смысловой ошибки нет.
