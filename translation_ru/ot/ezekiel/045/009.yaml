  terminology: «Князья Израиля» оправданно передаёт נְשִׂיאֵי יִשְׂרָאֵל в данном политическом контексте. «Насилие и грабёж» точно сохраняет два члена пары חָמָס וָשֹׁד. «Справедливость и правда» различает מִשְׁפָּט и צְדָקָה и естественно в русском. «Владыка Яхве» последовательно воспроизводит אֲדֹנָי יְהוִה без сокрытия имени יהוה. Сноска должна быть привязана к слову, выражающему гְרֻשׁוֹתֵיכֶם, и не должна утверждать чрезмерно узкое юридическое значение.
