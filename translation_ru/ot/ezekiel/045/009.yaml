base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/009.yaml
  text: 'Thus says the Lord GOD: Enough from you[a], princes of Israel! Remove violence and plunder, and do justice and righteousness. Put away your evictions from my people, declares the Lord GOD.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Довольно с вас, князья Израиля! Откажитесь от насилия и грабежа, поступайте по справедливости и правде. Перестаньте изгонять[a] мой народ», — возвещает Владыка Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выселять»; возможно также: «лишать владений». Еврейское слово обозначает изгнания или действия по вытеснению; в контексте главы оно может включать лишение земли или имущества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание передаёт титул אֲדֹנָי и собственное имя Бога יהוה, не создавая неестественного повтора «Господь Господь».
- source_word: רַב לָכֶם
  choice: Довольно с вас
  rationale: Русское выражение сохраняет резкий укор и направленность местоименного оборота לָכֶם к правителям.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: князья Израиля
  rationale: «Князья» сохраняет политический и сословный оттенок נְשִׂיאִים в книге Иезекииля; более общее «вожди» возможно, но менее конкретно.
- source_word: חָמָס וָשֹׁד
  choice: насилие и грабёж
  rationale: Сочетание обозначает жестокое притеснение и хищническое присвоение имущества; два понятия сохранены раздельно.
- source_word: הָסִירוּ
  choice: откажитесь от
  rationale: В повелении речь идёт о прекращении порочных действий. Такая формулировка естественна по-русски и передаёт значение удаления или устранения.
- source_word: מִשְׁפָּט וּצְדָקָה עֲשׂוּ
  choice: поступайте по справедливости и правде
  rationale: Формула сохраняет различие между справедливым судом/управлением и нравственной правотой, оставаясь естественной для современного русского языка.
- source_word: הָרִימוּ גְרֻשֹׁתֵיכֶם מֵעַל עַמִּי
  choice: перестаньте изгонять Мой народ
  rationale: Смысловой перевод передаёт требование прекратить насильственное удаление людей. Глагольная конструкция по-русски яснее буквального «уберите ваши изгнания с Моего народа» и не ограничивает смысл юридическим выселением.
- source_word: נְאֻם
  choice: возвещает
  rationale: Пророческая формула указывает на торжественное Божье изречение; «возвещает» сохраняет её достоинство и звучит естественно.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул и личное имя и следует непосредственно еврейскому тексту. Традиционное «Господь Бог» узнаваемо, но скрывает имя יהוה.
- issue: Передача пары מִשְׁפָּט וּצְדָקָה
  choice: по справедливости и правде
  alternative: суд и праведность
  rationale: Сохранены два взаимосвязанных, но не тождественных этических понятия. Альтернатива формальнее, однако в данном обращении к правителям может ошибочно восприниматься как призыв совершать судебные приговоры и проявлять личную религиозность.
- issue: Объём значения גְרֻשֹׁתֵיכֶם
  choice: изгонять Мой народ
  alternative: выселять Мой народ; лишать Мой народ владений
  rationale: Еврейское слово связано с изгнанием и вытеснением. Контекст земельных наделов допускает принудительное лишение земли или имущества, но текст не требует сужать значение исключительно до юридического выселения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Обращение «Довольно с вас» сохраняет резкость обличения; синтаксис упрощён там, где буквальное воспроизведение еврейской конструкции было бы неестественным.
