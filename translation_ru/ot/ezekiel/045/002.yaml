  yaml_path: translation/ot/ezekiel/045/002.yaml
  text: From this there shall be for the holy place a square of five hundred by five hundred all around[b][a], with fifty cubits of open land for it all around.
translation:
  language: ru
  text: Из этого для священного участка[a] отводится квадрат пятьсот на пятьсот, а вокруг него — открытое пространство[b] в пятьдесят локтей со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для святилища». Еврейское קֹדֶשׁ может обозначать священную территорию в целом, а не только здание святилища.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «пастбищная земля» или «общинная земля». Еврейское מִגְרָשׁ обозначает окружающее открытое пространство, выделенное при данном участке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּה
  choice: Из него
  rationale: Выражение указывает на ранее описанный надел, из которого выделяется эта часть; местоимение согласовано с подразумеваемым наделом.
- source_word: אֶל הַקֹּדֶשׁ
  choice: для священного участка
  rationale: Предлог выражает назначение, а קֹדֶשׁ в контексте размежевания обозначает священную территорию, не обязательно одно лишь здание святилища.
- source_word: חֲמֵשׁ מֵאוֹת בַּחֲמֵשׁ מֵאוֹת מְרֻבָּע
  choice: квадрат пятьсот на пятьсот
  rationale: Передана формула размеров и явно указанная квадратная форма; единица измерения в этой части еврейского текста не названа и потому не добавлена.
- source_word: סָבִיב
  choice: вокруг него
  rationale: Передаёт охват участка со всех сторон и естественно связывает последующее описание полосы земли с квадратным участком.
- source_word: וַחֲמִשִּׁים אַמָּה
  choice: шириной в пятьдесят локтей
  rationale: В контексте окружающей полосы число обозначает её протяжённость от границы участка; такая формулировка естественна по-русски и сохраняет указанную меру.
- source_word: מִגְרָשׁ
  choice: полоса открытой земли
  rationale: Слово обозначает незастроенное пространство, выделенное вокруг участка. Перевод избегает устаревшего или вводящего в заблуждение значения «предместье».
- source_word: לוֹ
  choice: вокруг него
  rationale: Местоимение отнесено к священному участку; по-русски принадлежность и пространственная связь естественно выражаются всей конструкцией.
