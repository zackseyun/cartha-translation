revisions:
- from: 'В седьмом месяце, в пятнадцатый день месяца, во время праздника[a], он в течение семи дней будет приносить такие же жертвы: жертву за грех, всесожжение, хлебное приношение[b] и масло.'
  to: 'В седьмом месяце, в пятнадцатый день месяца, во время праздника[a] он в течение семи дней будет обеспечивать те же приношения[b]: жертву за грех, всесожжение, хлебное приношение и масло.'
  rationale: Заменены «будет приносить такие же жертвы» на «будет обеспечивать те же приношения», чтобы точнее отразить широкий глагол עשה в контексте обязанности князя и не включать масло в понятие жертвы. Сноска b перенесена к выражению, которое она поясняет; её текст уточнён без изменения смысла.
