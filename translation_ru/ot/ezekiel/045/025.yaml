  text: בַּ/שְּׁבִיעִ֡י בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בֶּ/חָ֔ג יַעֲשֶׂ֥ה כָ/אֵ֖לֶּה שִׁבְעַ֣ת הַ/יָּמִ֑ים כַּֽ/חַטָּאת֙ כָּ/עֹלָ֔ה וְ/כַ/מִּנְחָ֖ה וְ/כַ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/025.yaml
  text: 'In the seventh month[a], on the fifteenth day of the month, at the feast, he shall provide the same offerings for seven days: the sin offering, the burnt offering, the grain offering[b], and the oil.'
translation:
  language: ru
  text: 'В седьмом месяце, в пятнадцатый день месяца, во время праздника[a] он в течение семи дней будет обеспечивать те же приношения[b]: жертву за грех, всесожжение, хлебное приношение и масло.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на празднике».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет делать подобное этому»; то есть будет исполнять те же предписания о приношениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁבִיעִי
  choice: В седьмом месяце
  rationale: Порядковое числительное в сочетании со следующей календарной датой обозначает седьмой месяц; слово «месяце» добавлено для естественности и ясности по-русски.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: в пятнадцатый день месяца
  rationale: Естественная русская передача стандартного древнееврейского календарного выражения.
- source_word: בֶּחָג
  choice: во время праздника
  rationale: חָג означает праздничное торжество, в данном контексте — праздник, начинающийся в пятнадцатый день седьмого месяца. Формулировка сохраняет временное значение предлога.
- source_word: יַעֲשֶׂה כָאֵלֶּה
  choice: будет приносить такие же жертвы
  rationale: Буквально выражение означает «сделает подобное этому», но в жертвенном контексте оно отсылает к ранее установленным приношениям. Такая передача естественна и ясно выражает анафорическую связь, не приписывая субъекту непременно священнического совершения обряда.
- source_word: שִׁבְעַת הַיָּמִים
  choice: в течение семи дней
  rationale: Передаёт продолжительность всего семидневного периода праздника.
- source_word: כַּחַטָּאת
  choice: жертву за грех
  rationale: Стандартное обозначение данного вида жертвы; префикс כ в этом перечислении естественно передаётся через общий оборот «такие же жертвы».
- source_word: כָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся и точный русский термин для עֹלָה.
- source_word: וְכַמִּנְחָה
  choice: хлебное приношение
  rationale: В культовом контексте מִנְחָה обозначает приношение из продуктов земли; «хлебное приношение» — понятный традиционный термин, не сужающий его до готового хлеба.
- source_word: וְכַשָּׁמֶן
  choice: и масло
  rationale: Речь идёт о предписанном масле, сопровождающем приношения; русская форма без указательного определения звучит естественно.
theological_decisions:
- issue: Неявный субъект глагола יַעֲשֶׂה
  choice: он — князь, упомянутый в ближайшем контексте
  alternative: неопределённый участник богослужения или служитель
  rationale: В окружающих стихах обеспечение жертв неоднократно возлагается на князя. Местоимение «он» сохраняет неявность древнееврейского подлежащего, а выражение «будет приносить» здесь обозначает обеспечение предписанных жертв и не обязательно личное священнодействие.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Синтаксис сделан ясным для широкого читателя; специализированные жертвенные термины сохранены там, где они точны и узнаваемы.
