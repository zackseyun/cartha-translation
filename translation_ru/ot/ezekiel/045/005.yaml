base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/005.yaml
  text: And an area twenty-five thousand long and ten thousand wide shall be for the Levites[a], the ministers of the house, for their possession[b], with twenty chambers.
translation:
  language: ru
  text: Участок длиной в двадцать пять тысяч и шириной в десять тысяч будет принадлежать левитам, служителям храма, — им во владение, с двадцатью помещениями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «будет принадлежать левитам, служителям храма, — им во владение для двадцати помещений». Заключительная фраза в еврейском тексте синтаксически трудна.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַחֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ וַעֲשֶׂרֶת אֲלָפִים רֹחַב
  choice: участок в двадцать пять тысяч длиной и десять тысяч шириной
  rationale: Числа и обозначения размеров переданы естественным современным русским оборотом. Слово «участок» добавлено из контекста распределения земли, без добавления единицы измерения, которой в данном стихе нет.
- source_word: יהיה לַלְוִיִּם
  choice: будет принадлежать левитам
  rationale: Дательный оборот с יהיה обозначает предназначение или закрепление участка; «будет принадлежать» ясно и естественно передаёт это отношение.
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: служителям храма
  rationale: Причастие обозначает совершающих служение, а הַבַּיִת в данном контексте — храм. «Служители храма» передаёт смысл без ассоциации с поздней церковной должностью.
- source_word: לָהֶם לַאֲחֻזָּה
  choice: как их владение
  rationale: אֲחֻזָּה означает закреплённое земельное владение; формулировка сохраняет юридический оттенок и остаётся понятной.
- source_word: עֶשְׂרִים לְשָׁכֹת
  choice: с двадцатью помещениями
  rationale: לְשָׁכֹת — комнаты или помещения, связанные с храмовым комплексом. Нейтральное «помещения» не уточняет их функцию, не указанную в тексте; предлог отражает вероятное присоединительное понимание трудной конструкции.
theological_decisions:
- issue: Значение הַבַּיִת
  choice: храм
  alternative: дом
  rationale: В видении Иезекииля речь идёт о храмовом комплексе; смысловой перевод «храм» устраняет ненужную для русского читателя двусмысленность и не вносит конфессионального толкования.
- issue: Синтаксическая связь עֶשְׂרִים לְשָׁכֹת
  choice: с двадцатью помещениями
  alternative: как владение для двадцати помещений
  rationale: Еврейская конструкция затруднительна. Основной текст следует вероятному присоединительному пониманию, а альтернативная синтаксическая связь сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного описания. Размеры оставлены без единицы измерения, поскольку она отсутствует в самом стихе. Буквальное «дом» заменено контекстуально ясным «храм».
