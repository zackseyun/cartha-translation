base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/021.yaml
  text: In the first month[a], on the fourteenth day of the month, you shall have the Passover, a feast of seven days[b]; unleavened bread shall be eaten.
translation:
  language: ru
  text: В первом месяце, в четырнадцатый день месяца, у вас будет Пасха[a] — праздник, длящийся семь дней[b]; следует есть опресноки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пасха, праздник, длящийся семь дней». В других местах Пасха и Праздник опресноков могут различаться, но здесь текст представляет их вместе.'
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение буквально звучит как «недели дней»; здесь оно понимается как указание на семидневный срок.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשׁוֹן
  choice: В первом месяце
  rationale: В календарном контексте подразумевается первый месяц; слово «месяце» естественно восполняется из следующего указания даты.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: в четырнадцатый день месяца
  rationale: Точная и естественная передача стандартной древнееврейской формулы даты.
- source_word: יִהְיֶה לָכֶם
  choice: у вас будет
  rationale: Сохраняет конструкцию принадлежности/установленного празднования и её направленность к адресатам.
- source_word: הַפָּסַח
  choice: Пасха
  rationale: Общепринятое русское название установленного праздника; прописная буква уместна для его наименования.
- source_word: חָג
  choice: праздник
  rationale: В данном культовом контексте חָג обозначает праздничное торжество; «праздник» ясно и естественно для современного читателя.
- source_word: שְׁבֻעוֹת יָמִים
  choice: длящийся семь дней
  rationale: Контекст требует семидневного срока праздника. Формулировка естественно выражает длительность, а необычное буквальное строение еврейского выражения отмечено в сноске.
- source_word: מַצּוֹת
  choice: опресноки
  rationale: Традиционный и понятный русский термин для хлеба без закваски в пасхальном контексте.
- source_word: יֵאָכֵל
  choice: следует есть
  rationale: Безличная конструкция естественно по-русски передаёт пассивную форму и предписывающую силу, не уточняя названного действующего лица.
theological_decisions:
- issue: Соотношение Пасхи и семидневного праздника
  choice: Передать «Пасху» и «праздник, длящийся семь дней» как приложение, не разделяя их в основном тексте.
  alternative: Резко разграничить однодневную Пасху и следующий за ней Праздник опресноков.
  rationale: Еврейский текст непосредственно ставит выражения «Пасха» и «праздник…» рядом как приложение. Перевод сохраняет эту напряжённость и не гармонизирует стих с формулировками других мест.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, нормативным звучанием. Сохранена лаконичность культового предписания; термин «опресноки» употреблён как общеизвестное библейское слово.
