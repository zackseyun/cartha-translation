  text: קֹ֣דֶשׁ מִן הָ/אָ֜רֶץ ה֗וּא לַ/כֹּ֨הֲנִ֜ים מְשָׁרְתֵ֤י הַ/מִּקְדָּשׁ֙ יִֽהְיֶ֔ה הַ/קְּרֵבִ֖ים לְ/שָׁרֵ֣ת אֶת יְהוָ֑ה וְ/הָיָ֨ה לָ/הֶ֤ם מָקוֹם֙ לְ/בָ֣תִּ֔ים וּ/מִקְדָּ֖שׁ לַ/מִּקְדָּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/004.yaml
  text: It is a holy portion of the land; it shall be for the priests[a], the ministers of the sanctuary, who draw near to minister to Yahweh. And it shall be for them as a place for houses and as a holy place for the sanctuary.
translation:
  language: ru
  text: Это священная часть земли. Она будет принадлежать священникам — служителям святилища, которые приближаются, чтобы служить Яхве. Она будет для них местом для домов и священным местом для святилища.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение кратко и допускает перевод: «освящённой территорией при святилище»; возможно, имеется в виду священный участок, принадлежащий святилищу или окружающий его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ מִן־הָאָרֶץ
  choice: священная часть земли
  rationale: В контексте распределения земли קֹדֶשׁ обозначает не отвлечённую святость, а освящённый, отделённый участок; מִן имеет партитивный смысл.
- source_word: לַכֹּהֲנִים
  choice: принадлежать священникам
  rationale: Дательный предлог выражает предназначение и передачу участка священникам; глагол «принадлежать» естественно передаёт это по-русски.
- source_word: מְשָׁרְתֵי הַמִּקְדָּשׁ
  choice: служителям святилища
  rationale: Сочетание обозначает священников, исполняющих культовое служение в святилище, без привнесения позднейших церковных категорий.
- source_word: הַקְּרֵבִים
  choice: которые приближаются
  rationale: Сохранён характерный для священнического служения образ приближения к Богу, а не заменён общим указанием на приход.
- source_word: לְשָׁרֵת אֶת־יְהוָה
  choice: чтобы служить Яхве
  rationale: «Служить» естественно выражает культовое служение; личное имя יְהוָה передано как «Яхве».
- source_word: מָקוֹם לְבָתִּים
  choice: местом для домов
  rationale: Прямо передаёт назначение части участка под жилища священников.
- source_word: וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: и священным местом для святилища
  rationale: Сохранена краткость и повтор корня в трудном еврейском выражении. Первое מִקְדָּשׁ понято как освящённое место, второе — как само святилище.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, непосредственно присутствующее в еврейском тексте, без замены титулом.
- issue: Характер приближения священников
  choice: которые приближаются, чтобы служить
  alternative: которые приходят служить
  rationale: Формулировка сохраняет культовый оттенок הַקְּרֵבִים и не сводит его к обычному пространственному движению.
- issue: Значение заключительного выражения וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: священным местом для святилища
  alternative: освящённой территорией при святилище
  rationale: Выбран вариант, наиболее близкий к форме текста и не уточняющий без достаточных оснований, идёт ли речь о прилегающей территории, участке, принадлежащем святилищу, или ином священном пространстве.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Синтаксис упрощён до трёх ясных предложений; повтор «священным местом для святилища» намеренно сохранён как отражение компактного и неоднозначного еврейского выражения.
