  text: מֹֽאזְנֵי צֶ֧דֶק וְ/אֵֽיפַת צֶ֛דֶק וּ/בַת צֶ֖דֶק יְהִ֥י לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/010.yaml
  text: You must have honest scales[a], an honest ephah[c][b], and an honest bath.
translation:
  language: ru
  text: Пусть у вас будут честные весы, честная эфа[a] и честный бат[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфа — древняя мера объёма сыпучих веществ.
    reason: cultural_note
  - marker: b
    text: Бат — древняя мера объёма жидкостей.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי
  choice: весы
  rationale: Форма обозначает прибор для взвешивания; «весы» — естественный и точный современный русский эквивалент.
- source_word: צֶדֶק
  choice: честные
  rationale: Слово трижды характеризует меры и весы как справедливые, правильные и не поддельные. В торгово-правовом контексте «честные» естественно передаёт нравственное требование, не сводя смысл лишь к технической точности.
- source_word: אֵיפַת
  choice: эфа
  rationale: Это конкретная древнееврейская мера сыпучих веществ; транслитерация сохраняет историко-культурную конкретность, а пояснение дано в сноске.
- source_word: בַת
  choice: бат
  rationale: Это конкретная древнееврейская мера жидкостей; транслитерация сохраняет её связь с системой мер в книге Иезекииля, а значение поясняется в сноске.
- source_word: יְהִי לָכֶם
  choice: пусть у вас будут
  rationale: Юссивная форма с לָכֶם выражает предписание. Русская конструкция «пусть у вас будут» сохраняет форму наставления и звучит естественно и достойно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной нормативной интонацией. Трёхкратное повторение «честные» сохраняет риторический строй и этический акцент еврейского текста; названия древних мер переданы транслитерацией и кратко пояснены.
