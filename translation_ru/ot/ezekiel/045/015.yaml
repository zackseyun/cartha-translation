base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/015.yaml
  text: and one sheep from every two hundred from the well-watered pastures of Israel[a], for a grain offering and for a burnt offering and for peace offerings, to make atonement for them, declares the Lord GOD.
translation:
  language: ru
  text: и по одной голове мелкого скота из стада на каждые двести голов, с орошаемых пастбищ Израиля[a], — для хлебного приношения, всесожжения и мирных жертв, чтобы совершить за них искупление, — говорит Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с орошаемой земли Израиля»; возможно также: «с тучных пастбищ Израиля». Еврейское выражение, вероятно, означает землю для выпаса, хорошо обеспеченную водой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֶׂה אַחַת
  choice: и по одной голове мелкого скота
  rationale: שֶׂה обозначает отдельное животное из мелкого скота — овцу или козу — без обязательного указания пола и возраста. Передача «голова мелкого скота» сохраняет эту широту и естественно сочетается с пропорциональным сбором.
- source_word: מִן הַצֹּאן מִן הַמָּאתַיִם
  choice: из каждых двухсот
  rationale: 'Конструкция задаёт норму сбора: одно животное из каждых двухсот голов стада.'
- source_word: מִמַּשְׁקֵה יִשְׂרָאֵל
  choice: с орошаемых пастбищ Израиля
  rationale: מַשְׁקֶה связано с поением или орошением и здесь, вероятно, метонимически указывает на обеспеченную водой землю, где пасётся скот. Контекстуальное «орошаемые пастбища» ясно передаёт сельскохозяйственный образ, не скрывая альтернатив в сноске.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из зерна или муки; традиционное русское «хлебное приношение» понятно и уместно.
- source_word: וּלְעוֹלָה
  choice: всесожжения
  rationale: עוֹלָה — жертва, целиком сжигаемая на жертвеннике; «всесожжение» является точным и устоявшимся русским термином.
- source_word: וְלִשְׁלָמִים
  choice: и мирных жертв
  rationale: שְׁלָמִים — жертвы мира или благополучия. «Мирные жертвы» сохраняет традиционную культовую терминологию, не сужая значение до общения или совместной трапезы.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: чтобы совершить за них искупление
  rationale: Формулировка сохраняет культовый и богословский вес כפר, не уточняя механизм искупления сверх сказанного в тексте.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: говорит Владыка Яхве
  rationale: נְאֻם передан естественной пророческой формулой «говорит»; אֲדֹנָי — «Владыка», а личное имя יהוה транслитерировано как «Яхве», благодаря чему оба элемента составного титула остаются различимыми.
theological_decisions:
- issue: Передача יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Транслитерация сохраняет личное имя, непосредственно присутствующее в еврейском тексте, а «Владыка» передаёт отдельный титул אֲדֹנָי и позволяет избежать повтора «Господь Господь».
- issue: Значение לְכַפֵּר עֲלֵיהֶם
  choice: совершить за них искупление
  alternative: очистить их / загладить их вину
  rationale: Выбранная передача сохраняет широкий культовый смысл корня כפר и не навязывает тексту одну частную теорию искупления.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческо-культового контекста. Синтаксис слегка упрощён для ясности, но последовательность видов приношений и заключительная формула сохранены. «По одной голове мелкого скота» звучит как нормативное предписание и не сужает שֶׂה до овцы, козы, ягнёнка или животного определённого пола.
