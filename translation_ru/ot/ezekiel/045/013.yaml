  text: זֹ֥את הַ/תְּרוּמָ֖ה אֲשֶׁ֣ר תָּרִ֑ימוּ שִׁשִּׁ֤ית הָֽ/אֵיפָה֙ מֵ/חֹ֣מֶר הַֽ/חִטִּ֔ים וְ/שִׁשִּׁיתֶם֙ הָֽ/אֵיפָ֔ה מֵ/חֹ֖מֶר הַ/שְּׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/013.yaml
  text: 'This is the contribution that you shall offer: one-sixth of an ephah from each homer of wheat[a], and one-sixth of an ephah from each homer of barley.'
translation:
  language: ru
  text: 'Вот приношение, которое вы должны приносить: одну шестую эфы с каждого хомера пшеницы[a] и одну шестую эфы с каждого хомера ячменя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфа и хомер — древние меры объёма сыпучих тел. Здесь установлена постоянная доля зерна: одна шестая эфы с каждого хомера.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמָה
  choice: приношение
  rationale: В данном распорядительном и культовом контексте слово обозначает выделенную и представленную долю. «Приношение» сохраняет культовый оттенок, не сводя смысл исключительно к налогу или дани.
- source_word: תָּרִימוּ
  choice: вы должны приносить
  rationale: Порода хифиль глагола רום в сочетании с תְּרוּמָה идиоматически означает представлять или приносить выделенную долю; буквальное «возносить» здесь звучало бы неестественно.
- source_word: שִׁשִּׁית
  choice: одну шестую
  rationale: Контекст мер зерна ясно указывает на дробную долю; эта форма естественна в современном русском языке.
- source_word: אֵיפָה
  choice: эфа
  rationale: Сохранено традиционное название древней меры сыпучих тел, чтобы не утратить точность исходного текста.
- source_word: חֹמֶר
  choice: хомер
  rationale: Передано прямой транслитерацией названия древней меры вместимости; обобщённое «мера» было бы менее точно.
- source_word: מֵחֹמֶר
  choice: с каждого хомера
  rationale: Предлог обозначает долю, взимаемую от единицы объёма; «с каждого» естественно выражает подразумеваемый распределительный смысл постановления.
- source_word: הַחִטִּים
  choice: пшеницы
  rationale: Родительный падеж после обозначения меры естественно передаёт измеряемое вещество; артикль отдельно не выражается.
- source_word: וְשִׁשִּׁיתֶם
  choice: и одну шестую
  rationale: Несмотря на необычную морфологическую форму, выражение явно параллельно первой дроби и вводит такую же долю ячменя.
- source_word: הַשְּׂעֹרִים
  choice: ячменя
  rationale: Родительный падеж после названия меры соответствует современной русской норме.
theological_decisions: []
