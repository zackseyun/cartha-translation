base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/007.yaml
  text: And for the prince there shall be land on both sides of the holy district and the property of the city[a], adjoining the holy district and adjoining the property of the city, from the west side westward and from the east side eastward; and in length corresponding to one of the tribal portions[b], from the western border to the eastern border.
translation:
  language: ru
  text: 'Князю будет отведена земля по обе стороны от священного участка и городского владения[a], примыкающая к священному участку и городскому владению: от западной стороны — к западу и от восточной стороны — к востоку. По длине она будет равна одному из племенных наделов — от западной границы до восточной[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «священного приношения» или «священного надела». Здесь имеется в виду особо выделенный участок земли, поэтому переведено «священный участок».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально говорит: «от границы со стороны моря до границы к востоку»; в описаниях территории «море» обозначает запад.'
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּשִׂיא
  choice: князю
  rationale: В книге Иезекииля נָשִׂיא обычно обозначает правителя общины; «князь» сохраняет устойчивое библейское наименование, не сужая его до общего «вождь».
- source_word: מִזֶּה וּמִזֶּה
  choice: по обе стороны
  rationale: 'Естественно передаёт распределительное значение идиомы: земля расположена с той и другой стороны названных участков.'
- source_word: תְרוּמַת הַקֹּדֶשׁ
  choice: священный участок
  rationale: В контексте раздела земли תְּרוּמָה означает выделенную долю территории, а не денежное или культовое приношение; «участок» ясно передаёт земельный характер.
- source_word: אֲחֻזַּת הָעִיר
  choice: владение города
  rationale: אֲחֻזָּה — земельное владение или собственность; формулировка подходит юридико-территориальному контексту.
- source_word: אֶל פְּנֵי ... וְאֶל פְּנֵי
  choice: примыкая к ... и ...
  rationale: В описании границ оборот указывает на соседнее расположение; «примыкая» естественнее буквального «перед лицом».
- source_word: מִפְּאַת יָם יָמָּה / וּמִפְּאַת קֵדְמָה קָדִימָה
  choice: с западной стороны — к западу и с восточной стороны — к востоку
  rationale: Сохраняет зеркальность и повторность кадастровой формулы, передавая יָם как направление «запад» в территориальном контексте.
- source_word: לְעֻמּוֹת אַחַד הַחֲלָקִים
  choice: соответствовать одному из племенных наделов
  rationale: לְעֻמּוֹת выражает соответствие или соразмерность; из контекста следует, что הַחֲלָקִים — наделы племён, поэтому «племенных» делает референт явным.
- source_word: מִגְּבוּל יָם אֶל גְּבוּל קָדִימָה
  choice: от западной границы до восточной
  rationale: Ясно и точно передаёт полный продольный охват территории, описанный формулой границ.
