  source_fidelity: 'Смысл в целом передан верно: речь идёт о земле, отведённой князю по обе стороны от священного участка и городского владения, с западным и восточным продолжением и с протяжённостью, равной одному племенному наделу. Однако деепричастный оборот «примыкая» в исходном варианте синтаксически неудачен и размывает пространственную связь, выраженную еврейским אֶל־פְּנֵי.'
