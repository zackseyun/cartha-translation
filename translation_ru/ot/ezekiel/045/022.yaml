  text: וְ/עָשָׂ֤ה הַ/נָּשִׂיא֙ בַּ/יּ֣וֹם הַ/ה֔וּא בַּעֲד֕/וֹ וּ/בְעַ֖ד כָּל עַ֣ם הָ/אָ֑רֶץ פַּ֖ר חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/022.yaml
  text: On that day the prince shall provide[a], for himself and for all the people of the land, a bull as a sin offering.
translation:
  language: ru
  text: В тот день правитель принесёт за себя и за весь народ страны быка в жертву за грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быка в очистительную жертву». Еврейское חַטָּאת может обозначать жертву, устраняющую грех или нечистоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: принесёт
  rationale: В жертвенном контексте עשה означает совершить или принести жертву; «принесёт» естественно по-русски и точно передаёт культовое действие.
- source_word: הַנָּשִׂיא
  choice: правитель
  rationale: В видении Иезекииля נָשִׂיא обозначает гражданского главу народа. «Правитель» яснее современному читателю, чем «князь», и не предполагает наследственного титула.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Прямой и естественный перевод временного выражения.
- source_word: בַּעֲדוֹ
  choice: за себя
  rationale: Предлог בעד здесь указывает, за кого приносится жертва; «за себя» кратко и естественно передаёт представительный смысл.
- source_word: וּבְעַד כָּל עַם הָאָרֶץ
  choice: и за весь народ страны
  rationale: Фраза обозначает весь народ данной земли как тех, за кого приносится жертва, а не особое общественное сословие.
- source_word: פַּר
  choice: быка
  rationale: פַּר в жертвенной лексике означает быка; указания на его молодость в стихе нет.
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: В данном контексте слово обозначает жертвоприношение, связанное с устранением греха или нечистоты. Традиционное выражение «жертва за грех» понятно и не сводит слово к абстрактному понятию греха.
theological_decisions:
- issue: Передача חַטָּאת в культовом контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Наличие быка показывает, что речь идёт о жертве, а не об абстрактном грехе. Основной вариант сохраняет узнаваемую библейскую терминологию, а примечание отмечает возможный акцент на очищении от греха или нечистоты.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис простой и ясный; «правитель» передаёт должность в контексте Иезекииля без архаического или династического оттенка слова «князь».
