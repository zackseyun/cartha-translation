  text: וּ/מִן הַ/מִּדָּ֤ה הַ/זֹּאת֙ תָּמ֔וֹד אֹ֗רֶךְ חמש וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֣רֶת אֲלָפִ֑ים וּ/בֽ/וֹ יִהְיֶ֥ה הַ/מִּקְדָּ֖שׁ קֹ֥דֶשׁ קָדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/003.yaml
  text: From this measured area you shall measure a length of twenty-five thousand and a width of ten thousand[a], and in it shall be the sanctuary, the most holy place.
translation:
  language: ru
  text: 'И от этого отмеренного участка отмерь: в длину — двадцать пять тысяч, в ширину — десять тысяч; на нём будет святилище, пресвятое место[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционном переводе: «святилище — Святое святых».'
    reason: лексический вариант для קֹדֶשׁ קָדָשִׁים
lexical_decisions:
- source_word: וּמִן הַמִּדָּה הַזֹּאת
  choice: И от этого отмеренного участка
  rationale: מִדָּה может обозначать меру или отмеренную часть; в контексте распределения земли речь идёт о ранее обозначенном участке. Предлог מִן передан словом «от».
- source_word: תָּמֹד
  choice: отмерь
  rationale: Форма Qal imperfect 2 м. ед. от מדד имеет здесь предписывающую силу; русский императив естественно передаёт прямое указание.
- source_word: אֹרֶךְ חמש וְעֶשְׂרִים אֶלֶף
  choice: в длину двадцать пять тысяч
  rationale: Сохранено указание первого измерения и числовое значение; порядок числительного приведён к норме современного русского языка.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: а в ширину — десять тысяч
  rationale: רֹחַב означает ширину; конструкция противопоставлена длине и естественно оформлена по-русски.
- source_word: וּבוֹ
  choice: на нём
  rationale: Местоименный суффикс отсылает к земельному участку; применительно к территории русское «на нём» естественнее буквального «в нём».
- source_word: הַמִּקְדָּשׁ
  choice: святилище
  rationale: מִקְדָּשׁ обозначает священное место или храмовое святилище; выбран широкий и традиционно понятный русский эквивалент.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: Святое святых
  rationale: Еврейская усилительная конструкция буквально соответствует выражению «святое святых» и в храмовом контексте обозначает высшую степень святости; традиционная русская формула точна и узнаваема.
theological_decisions:
- issue: Соотношение הַמִּקְדָּשׁ и קֹדֶשׁ קָדָשִׁים
  choice: «святилище — Святое святых»
  alternative: «святилище, место величайшей святости»
  rationale: Тире сохраняет приложительное отношение, не утверждая сверх текста, обозначает ли выражение внутреннее помещение или характеризует святилище как особо святое. Альтернатива передаёт суперлативный смысл, но менее буквально и менее узнаваемо.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным и процедурным тоном. Синтаксис упрощён для ясности, при этом сохранены пространственные параметры и храмовая терминология.
