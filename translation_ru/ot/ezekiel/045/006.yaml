  text: וַ/אֲחֻזַּ֨ת הָ/עִ֜יר תִּתְּנ֗וּ חֲמֵ֤שֶׁת אֲלָפִים֙ רֹ֔חַב וְ/אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ לְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/006.yaml
  text: And as the city's property[a], you shall give an area five thousand wide and twenty-five thousand long, alongside the holy contribution[b]; it shall belong to the whole house of Israel.
translation:
  language: ru
  text: А для владения города выделите участок шириной в пять тысяч и длиной в двадцать пять тысяч, рядом со священным приношением[a]. Он будет принадлежать всему дому Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «параллельно священному приношению»; возможно также: «в соответствии со священным приношением». Еврейское выражение может обозначать пространственное расположение или соотнесённость.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Израиля» — собирательное обозначение народа Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזַּת הָעִיר
  choice: владение города
  rationale: אֲחֻזָּה обозначает владение, особенно земельное. «Владение города» естественно для контекста распределения земли и сохраняет юридически-земельный оттенок.
- source_word: תִּתְּנוּ
  choice: выделите
  rationale: Буквально נתן — «дать», но в контексте размежевания земли русское «выделите» ясно передаёт назначение участка, не добавляя идеи посвящения.
- source_word: חֲמֵשֶׁת אֲלָפִים רֹחַב
  choice: шириной в пять тысяч
  rationale: Единица измерения в данном стихе не названа, поэтому она не добавлена в основной текст.
- source_word: וְאֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: длиной в двадцать пять тысяч
  rationale: Формулировка точно и естественно передаёт второе измерение участка.
- source_word: לְעֻמַּת
  choice: рядом с
  rationale: В данном описании земельных полос выражение указывает на пространственное расположение относительно священного приношения; при этом в сноске сохранены возможные оттенки параллельности и соответствия.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: священное приношение
  rationale: תְּרוּמָה — отделённое приношение или доля; здесь это освящённый земельный надел. «Священное приношение» сохраняет культовую лексику оригинала.
- source_word: לְכָל בֵּית יִשְׂרָאֵל יִהְיֶה
  choice: Он будет принадлежать всему дому Израиля
  rationale: В сочетании с לְ конструкция היה выражает принадлежность. «Дом Израиля» сохранён как традиционное коллективное обозначение народа.
