  text: Весь народ страны должен вносить это приношение князю в Израиле.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейский оборот означает: «весь народ страны — к этому приношению для князя в Израиле». Необычная конструкция, вероятно, подразумевает, что народ обязан предоставлять это установленное приношение для князя.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «терума» означает особо выделенную долю или дар. В зависимости от подчёркиваемого культового либо административного смысла возможны также переводы «дар», «взнос» или «дань».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעָם הָאָרֶץ
  choice: весь народ страны
  rationale: Передаёт совокупность населения страны и сохраняет характерное для пророческого и правового контекста выражение, не сужая его до «граждан».
- source_word: יִהְיוּ אֶל
  choice: должен вносить
  rationale: Буквально конструкция означает «будут к/для», но в контексте установленного сбора выражает обязанность народа предоставлять указанное приношение. «Вносить» естественно передаёт регулярное или предписанное предоставление, сохраняя юридико-культовый оттенок.
- source_word: הַתְּרוּמָה
  choice: приношение
  rationale: Термин обозначает выделенную долю или дар для священного либо официального употребления. «Приношение» сохраняет культовый оттенок, не исключая административного характера установленного сбора.
- source_word: הַזֹּאת
  choice: это
  rationale: Указательное слово отсылает к доле, установленной в предшествующих стихах.
- source_word: לַנָּשִׂיא
  choice: князю
  rationale: В книге Иезекииля נָשִׂיא обозначает особого правителя, но не обязательно царя. «Князь» сохраняет устойчивую терминологию книги; дательный падеж передаёт направленность приношения князю для исполнения его обязанностей.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Прямо сохраняет значение предлога ב и указывает сферу правления или пребывания князя, не превращая выражение в более интерпретирующее «князю Израиля».
