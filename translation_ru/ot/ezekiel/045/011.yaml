source:
  edition: WLC
  text: הָ/אֵיפָ֣ה וְ/הַ/בַּ֗ת תֹּ֤כֶן אֶחָד֙ יִֽהְיֶ֔ה לָ/שֵׂ֕את מַעְשַׂ֥ר הַ/חֹ֖מֶר הַ/בָּ֑ת וַ/עֲשִׂירִ֤ת הַ/חֹ֨מֶר֙ הָֽ/אֵיפָ֔ה אֶל הַ/חֹ֖מֶר יִהְיֶ֥ה מַתְכֻּנְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/011.yaml
  text: The ephah and the bath shall be of one measure[a], so that the bath may hold a tenth of a homer, and the ephah a tenth of a homer[c][b]; their standard shall be according to the homer.
translation:
  language: ru
  text: 'Ефа и бат должны быть одной меры[a]: бат должен вмещать десятую часть хомера, и ефа — десятую часть хомера[b]. Их мерой должен служить хомер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ефа, мера для сыпучих веществ, и бат, мера жидкостей, имели одинаковую вместимость.
    reason: cultural_note
  - marker: b
    text: Хомер — большая мера вместимости; ефа и бат составляли по одной десятой хомера. Другое традиционное название хомера — кор.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיפָה
  choice: ефа
  rationale: Название древней меры для сыпучих веществ передано традиционной русской транслитерацией, поскольку точного современного эквивалента нет.
- source_word: בַּת
  choice: бат
  rationale: Название древней меры жидкостей передано транслитерацией как специальный метрологический термин.
- source_word: תֹּכֶן אֶחָד
  choice: одной меры
  rationale: Выражение указывает, что ефа и бат имеют одинаковую установленную вместимость; русская формулировка сохраняет метрологический смысл и параллелизм.
- source_word: לָשֵׂאת
  choice: должен вмещать
  rationale: В контексте мер вместимости инфинитив означает содержание определённого объёма.
- source_word: מַעְשַׂר / עֲשִׂירִת
  choice: десятую часть
  rationale: Оба параллельных существительных обозначают одну десятую как количественную долю, а не десятину в культовом смысле.
- source_word: חֹמֶר
  choice: хомер
  rationale: Название большей эталонной меры передано близкой к еврейской форме русской транслитерацией.
- source_word: אֶל הַחֹמֶר ... מַתְכֻּנְתּוֹ
  choice: Их мерой должен служить хомер
  rationale: Фраза называет хомер определяющим эталоном для обеих меньших мер; множественное «их» естественно передаёт совокупную отсылку при морфологически единственном суффиксе.
