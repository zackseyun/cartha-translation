base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/014.yaml
  text: And the fixed due of oil shall be one bath of oil from each cor[a], from ten baths, that is, one homer[c][b], for ten baths are one homer.
translation:
  language: ru
  text: 'Установленная доля масла: бат масла — десятая часть бата с кора[a]; десять батов составляют хомер, ибо десять батов — хомер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Бат, кор и хомер — древние меры объёма. В еврейском тексте буквально: «десятая часть бата с кора»; далее сказано, что десять батов составляют хомер.'
    reason: cultural_note
lexical_decisions:
- source_word: חֹק
  choice: установленная доля
  rationale: В контексте обязательных приношений слово обозначает предписанную долю, а не отвлечённый закон.
- source_word: שֶׁמֶן
  choice: масло
  rationale: Еврейское слово означает масло; уточнение «оливковое» в исходном тексте отсутствует.
- source_word: הַבַּת הַשֶּׁמֶן
  choice: масла, измеряемого батами
  rationale: Формулировка естественно передаёт указание на бат как меру масла, не устраняя сжатость еврейского оборота.
- source_word: מַעְשַׂר הַבַּת
  choice: десятая часть бата
  rationale: מַעְשַׂר прямо обозначает десятую часть. Такое прочтение сохраняет грамматику и не заменяет её расчётным толкованием «один бат».
- source_word: כֹּר
  choice: кор
  rationale: Сохранено название древней меры без приблизительного пересчёта в современные единицы.
- source_word: עֲשֶׂרֶת הַבַּתִּים
  choice: десять батов
  rationale: Прямо передаёт числовое соотношение мер.
- source_word: חֹמֶר
  choice: хомер
  rationale: Сохранено традиционное название древней меры, соотношение которой с батом поясняется самим стихом.
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую функцию союза и сохраняет повтор заключительной формулы.
