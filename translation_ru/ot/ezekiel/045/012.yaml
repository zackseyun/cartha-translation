base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/012.yaml
  text: And the shekel shall be twenty gerahs[a]; twenty shekels, twenty-five shekels[b], and fifteen shekels shall be your mina.
translation:
  language: ru
  text: Шекель должен равняться двадцати герам[a]. Двадцать шекелей, двадцать пять шекелей и пятнадцать шекелей должны составлять вашу мину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Гера — малая древняя единица веса; двадцать гер составляли один шекель.
    reason: cultural_note
  - marker: b
    text: В еврейском тексте мина определяется как двадцать, двадцать пять и пятнадцать шекелей, то есть всего шестьдесят шекелей. Это отличается от некоторых других древних систем счёта и, вероятно, отражает особую норму в храмовых постановлениях Иезекииля.
    reason: textual_cultural_note
lexical_decisions:
- source_word: הַשֶּׁקֶל
  choice: шекель
  rationale: Название древней единицы веса передано привычной современной транслитерацией; определённость выражена контекстом установленной нормы.
- source_word: גֵּרָה
  choice: гера
  rationale: Сохранено древнее название малой весовой единицы без приблизительного пересчёта в современные меры.
- source_word: שְׁקָלִים / שֶׁקֶל
  choice: шекелей
  rationale: Единица последовательно передана одним термином; единственное число после пятнадцати по нормам русского языка оформлено родительным множественного числа.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים
  choice: двадцать пять
  rationale: Число передано в естественном для современного русского языка порядке.
- source_word: עֲשָׂרָה וַחֲמִשָּׁה
  choice: пятнадцать
  rationale: Число передано в обычной современной форме.
- source_word: הַמָּנֶה
  choice: одну мину
  rationale: Сохранено традиционное название более крупной единицы веса; «одну» ясно показывает, что перечисленные величины образуют установленную мину.
- source_word: יִהְיֶה לָכֶם
  choice: должны составлять у вас
  rationale: Передаёт предписывающую силу оборота и установленный для адресатов стандарт, не сглаживая необычное перечисление.
