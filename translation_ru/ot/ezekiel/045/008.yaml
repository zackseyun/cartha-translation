  text: לָ/אָ֛רֶץ יִֽהְיֶה לּ֥/וֹ לַֽ/אֲחֻזָּ֖ה בְּ/יִשְׂרָאֵ֑ל וְ/לֹא יוֹנ֨וּ ע֤וֹד נְשִׂיאַ/י֙ אֶת עַמִּ֔/י וְ/הָ/אָ֛רֶץ יִתְּנ֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/שִׁבְטֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/008.yaml
  text: This land shall belong to him as a possession in Israel. And my princes shall no longer oppress my people[a], but they shall give the land to the house of Israel according to their tribes.
translation:
  language: ru
  text: Что до земли, она будет его владением в Израиле. Мои князья больше не будут притеснять Мой народ[a], но отдадут землю дому Израиля по его коленам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мои князья больше не будут притеснять Мой народ, и землю они отдадут дому Израиля по его коленам».'
    reason: Еврейский союз וְ перед следующим предложением может быть понят как нейтральное «и», а вынесенное вперёд дополнение «землю» сохранено в альтернативном варианте.
lexical_decisions:
- source_word: לָאָרֶץ
  choice: Эта земля
  rationale: Вынесенная в начало конструкция с לְ тематически выделяет землю; указательное «эта» естественно связывает её с участком, описанным в ближайшем контексте.
- source_word: יִהְיֶה לּוֹ
  choice: будет его
  rationale: Еврейская конструкция «быть кому-либо» выражает принадлежность; по-русски это естественно передаётся притяжательной конструкцией.
- source_word: לַאֲחֻזָּה
  choice: владением
  rationale: אֲחֻזָּה обозначает земельное владение или закреплённый участок; «владение» точно передаёт смысл без излишней технической окраски.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог имеет здесь прямое пространственное значение.
- source_word: יוֹנוּ
  choice: будут притеснять
  rationale: Форма от ינה обозначает угнетение, притеснение или эксплуатацию; в контексте злоупотреблений правителей подходит «притеснять».
- source_word: עוֹד
  choice: больше не
  rationale: В сочетании с отрицанием выражает прекращение прежних действий.
- source_word: נְשִׂיאַי
  choice: Мои князья
  rationale: נָשִׂיא в книге Иезекииля обозначает князя или правителя; «князья» сохраняет политический титул и связь с ближайшим контекстом.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Сохранено обычное заветное обозначение народа, принадлежащего Богу.
- source_word: וְהָאָרֶץ יִתְּנוּ
  choice: но отдадут землю
  rationale: Глагол נתן означает «дать, отдать»; противительное «но» естественно выражает контраст между прежним притеснением и надлежащей передачей земли, хотя וְ может быть передано и соединительным союзом.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохранено устойчивое пророческое наименование народа без его пояснительной замены.
- source_word: לְשִׁבְטֵיהֶם
  choice: по его коленам
  rationale: Фраза указывает на распределение внутри дома Израиля в соответствии с племенными, то есть коленными, подразделениями; «колено» сохраняет традиционную библейскую терминологию.
theological_decisions:
- issue: К кому относится местоимение «его» в первом предложении
  choice: Местоимение сохранено и в контексте относится к князю, чей удел описывается рядом.
  alternative: Понимать его как указание на правителя вообще или на правящую власть как институт.
  rationale: Ближайший контекст говорит об участке князя; сохранение местоимения не вносит в текст пояснение, которого нет в еврейском оригинале.
- issue: Связь передачи земли с прекращением притеснения
  choice: Союз וְ передан как противительный «но».
  alternative: 'Передать нейтрально: «и отдадут землю…».'
  rationale: Противопоставление естественно в контексте, однако еврейский союз сам по себе допускает более нейтральную соединительную связь; эта возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены термины «князья», «дом Израиля» и «колена», важные для литературных связей книги; синтаксис упрощён лишь настолько, чтобы стих ясно читался по-русски.
