  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ תִּקַּ֥ח פַּר בֶּן בָּקָ֖ר תָּמִ֑ים וְ/חִטֵּאתָ֖ אֶת הַ/מִּקְדָּֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/018.yaml
  text: 'Thus says the Lord GOD: In the first month[a], on the first day of the month, you shall take a bull from the herd without blemish, and you shall purify the sanctuary.'
translation:
  language: ru
  text: 'Так говорит Владыка ГОСПОДЬ: «В первый месяц, в первый день месяца, возьми быка из стада, без порока, и очисти святилище[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соверши обряд искупления за святилище». Употреблённый здесь еврейский глагол — ритуальный термин, который может означать очищение от осквернения, вызванного грехом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Сочетание передаёт אֲדֹנָי как «Владыка», а имя יהוה — принятой в русском библейском стиле формой «ГОСПОДЬ», избегая неестественного повтора «Господь ГОСПОДЬ».
- source_word: בָּרִאשׁוֹן
  choice: В первый месяц
  rationale: Хотя буквально сказано «в первый», дальнейшее упоминание месяца ясно задаёт календарный смысл; по-русски существительное необходимо для ясности.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Это обычная древнееврейская формула даты, буквально «в один [день] месяца», то есть в первый день.
- source_word: תִּקַּח
  choice: возьми
  rationale: Имперфект в данном предписании имеет повелительное значение; русский императив естественно и точно передаёт обращение к одному лицу.
- source_word: פַּר בֶּן בָּקָר
  choice: быка из стада
  rationale: Выражение обозначает быка из крупного рогатого скота; перевод не уточняет возраст животного сверх того, что надёжно выражено в исходном тексте.
- source_word: תָּמִים
  choice: без порока
  rationale: Устойчивое жертвенное обозначение животного без физического изъяна, пригодного для приношения.
- source_word: וְחִטֵּאתָ
  choice: и очисти
  rationale: Пиэль глагола חטא при святилище как объекте обозначает ритуальное устранение осквернения, связанного с грехом. «Очисти» ясно передаёт действие, не представляя святилище как совершающее грех.
- source_word: הַמִּקְדָּשׁ
  choice: святилище
  rationale: Общее и точное русское культовое обозначение священного места, не сужающее значение до отдельной части храмового комплекса.
theological_decisions:
- issue: Передача ритуального глагола חטא, объектом которого является святилище
  choice: очисти святилище
  alternative: соверши обряд искупления за святилище
  rationale: Основной перевод подчёркивает ритуальное очищение священного пространства. В сноске сохранён традиционный и лексически возможный язык искупления, чтобы не устранять смысловое и богословское напряжение исходного выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Прямая речь оформлена кавычками; повелительная форма сохраняет адресованное одному лицу предписание. Формулировка остаётся понятной неспециалисту и сохраняет культовую терминологию оригинала.
