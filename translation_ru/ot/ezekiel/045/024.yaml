base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/024.yaml
  text: And as the grain offering[a], he shall provide an ephah for each bull and an ephah for each ram, and a hin of oil for each ephah.
translation:
  language: ru
  text: В качестве хлебного приношения[a] он должен приготовить по одной ефе на каждого быка и по одной ефе на каждого барана, и по одному гину масла на каждую ефу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он должен сделать» или «он должен принести»; еврейский глагол буквально означает «делать», а в контексте жертвоприношений может относиться к приготовлению или предоставлению требуемого приношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В контексте жертвоприношений слово обозначает приношение из зерна или муки; традиционный русский термин «хлебное приношение» понятен и уместен в культовом предписании.
- source_word: אֵיפָה
  choice: ефа
  rationale: Сохранена древнееврейская мера сыпучих тел, чтобы не заменять точную культовую единицу приблизительным современным эквивалентом.
- source_word: לַפָּר
  choice: на каждого быка
  rationale: Предлог выражает предназначение, а определённая форма в данном предписании имеет обобщённо-распределительный смысл.
- source_word: לָאַיִל
  choice: на каждого барана
  rationale: Фраза указывает норму приношения в расчёте на каждое жертвенное животное.
- source_word: יַעֲשֶׂה
  choice: он должен приготовить
  rationale: Глагол буквально означает «делать», но в жертвенном контексте естественно передаёт приготовление требуемого приношения; модальная конструкция сохраняет предписывающую силу формы.
- source_word: שֶׁמֶן
  choice: масло
  rationale: В еврейском тексте названо просто масло; уточнение «оливковое» не добавлено, хотя исторически оно вероятно.
- source_word: הִין
  choice: гин
  rationale: Сохранено название древнееврейской меры жидкостей без приблизительной конвертации.
- source_word: לָאֵיפָה
  choice: на каждую ефу
  rationale: Передано распределительное соотношение количества масла и меры хлебного приношения.
