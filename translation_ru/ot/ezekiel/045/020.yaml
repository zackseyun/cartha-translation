  text: וְ/כֵ֤ן תַּֽעֲשֶׂה֙ בְּ/שִׁבְעָ֣ה בַ/חֹ֔דֶשׁ מֵ/אִ֥ישׁ שֹׁגֶ֖ה וּ/מִ/פֶּ֑תִי וְ/כִפַּרְתֶּ֖ם אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/020.yaml
  text: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
translation:
  language: ru
  text: Так же поступай в седьмой день месяца из-за всякого, кто заблуждается или простодушен[a], и очистите храм[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за заблуждающегося человека и из-за простодушного». Еврейский текст может различать две категории людей; слово «простодушный» также может означать «неопытный» или «наивный».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дом». Здесь имеется в виду храм. Глагол может быть передан как «совершите искупление за храм»; в данном культовом контексте он относится к обрядовому очищению святилища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Так же
  rationale: Связывает предписание с обрядом предыдущего стиха и естественно передаёт значение соответствующего действия.
- source_word: תַּעֲשֶׂה
  choice: поступай
  rationale: Форма второго лица единственного числа обозначает исполнение предписанного действия; «поступай» сохраняет число и повелительно-предписывающий оттенок.
- source_word: בְּשִׁבְעָה בַחֹדֶשׁ
  choice: в седьмой день месяца
  rationale: Еврейское выражение эллиптично; слово «день» добавлено по смыслу для ясности.
- source_word: מֵאִישׁ שֹׁגֶה וּמִפֶּתִי
  choice: ради всякого, кто согрешит по ошибке или по простоте
  rationale: מִן понято как указание на причину или связь обряда с человеком; שֹׁגֶה обозначает непреднамеренную ошибку, а פֶּתִי — простоту, неопытность или наивность. Сноска сохраняет возможность различать две категории людей.
- source_word: וְכִפַּרְתֶּם
  choice: и совершите очищение
  rationale: В храмовом контексте כפר может обозначать обрядовое очищение святилища. Множественное число глагола сохранено, несмотря на предшествующее единственное число.
- source_word: הַבָּיִת
  choice: храма
  rationale: Буквально «дома»; в контексте видения Иезекииля речь идёт о храме.
theological_decisions:
- issue: Объект обряда искупления/очищения
  choice: совершите очищение храма
  alternative: совершите искупление за храм
  rationale: Прямым объектом כפר является «дом», то есть храм. «Очищение» ясно передаёт направленность обряда на осквернённое святилище, не утверждая, что искупление совершается непосредственно за согрешившего человека.
- issue: Число категорий в מֵאִישׁ שֹׁגֶה וּמִפֶּתִי
  choice: кто согрешит по ошибке или по простоте
  alternative: за человека заблуждающегося и за простодушного
  rationale: Синтаксис допускает как описание двух оснований непреднамеренного проступка, так и различение двух категорий людей. Основной текст звучит естественно, а альтернатива сохранена в сноске.
- issue: Смена числа у глаголов
  choice: поступай ... совершите
  alternative: поступайте ... совершайте
  rationale: Масоретский текст действительно переходит от второго лица единственного числа תַּעֲשֶׂה к множественному וְכִפַּרְתֶּם. Эта особенность сохранена, а не сглажена.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Сохранена заметная смена единственного числа на множественное. Термин «по простоте» оставлен несколько открытым и пояснён сноской; буквальное «дом» контекстуально передано как «храм».
