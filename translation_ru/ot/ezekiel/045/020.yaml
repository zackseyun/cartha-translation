revisions:
- from: Так же поступай и в седьмой день месяца ради всякого, кто согрешит по ошибке или по простоте[a], и совершите очищение[b] храма.
  to: Так же поступай в седьмой день месяца из-за всякого, кто заблуждается или простодушен[a], и очистите храм[b].
  rationale: Перевод сохраняет исходную неоднозначность в отношении двух человеческих характеристик, не утверждая без необходимости, что речь именно о двух способах согрешить. «Очистите храм» передаёт храмовый смысл כפר при прямом объекте «дом», а сноска сохраняет терминологическую альтернативу «совершить искупление». Смена числа «поступай ... очистите» намеренно оставлена по масоретскому тексту.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:38:22Z'
review_pass:
  verdict: revise
  source_fidelity: В основном переданы связь с предыдущим предписанием, дата, храмовый объект и намеренная смена 2-го лица ед. числа на мн. число. Однако «согрешит по ошибке или по простоте» чрезмерно объединяет два еврейских выражения в два способа совершения одного поступка и меняет причастную характеристику на будущее действие. Текст допускает различение заблуждающегося человека и простодушного/неопытного человека; эту открытость следует сохранить в основном тексте.
  naturalness: «Ради всякого» возможно, но в сочетании с «кто согрешит по ошибке или по простоте» звучит тяжеловесно и семантически сужает текст. «Из-за всякого, кто заблуждается или простодушен» естественнее для предписания об очищении святилища и сохраняет обобщённый характер исходных причастных обозначений.
  terminology: «Очистите храм» уместно в данном культовом контексте, где כפר с прямым объектом «дом/храм» обозначает обрядовое очищение/искупительное очищение святилища. Сноска должна прямо отметить буквальное «дом» и возможный перевод «совершите искупление за храм», а не создавать впечатление, будто это иной синтаксический объект.
