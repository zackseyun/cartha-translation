  text: וְ/שִׁבְעַ֨ת יְמֵֽי הֶ/חָ֜ג יַעֲשֶׂ֧ה עוֹלָ֣ה לַֽ/יהוָ֗ה שִׁבְעַ֣ת פָּ֠רִים וְ/שִׁבְעַ֨ת אֵילִ֤ים תְּמִימִם֙ לַ/יּ֔וֹם שִׁבְעַ֖ת הַ/יָּמִ֑ים וְ/חַטָּ֕את שְׂעִ֥יר עִזִּ֖ים לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/023.yaml
  text: During the seven days of the feast he shall provide as a burnt offering to Yahweh seven bulls and seven rams without blemish each day for the seven days[b][a], and as a sin offering one male goat each day.
translation:
  language: ru
  text: Во все семь дней праздника[a] он будет приносить Яхве во всесожжение по семь быков и по семь баранов без изъяна — каждый день на протяжении семи дней, а в жертву за грех[b] — по одному козлу в день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «торжества».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очистительную жертву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָג
  choice: праздника
  rationale: חַג обозначает установленный религиозный праздник, нередко паломнический; «праздник» естественно и точно передаёт термин в данном культовом контексте.
- source_word: יַעֲשֶׂה עוֹלָה
  choice: будет приносить ... во всесожжение
  rationale: В сочетании с названием жертвы עָשָׂה имеет культовый смысл совершения или принесения жертвы. Русское «приносить во всесожжение» естественно передаёт действие, не сводя его лишь к снабжению жертвенными животными.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог указывает, кому посвящена жертва; личное имя יהוה передано как «Яхве».
- source_word: פָּרִים
  choice: быков
  rationale: В жертвенном контексте פַּר обозначает быка; указание на молодость животного в данной форме не выражено явно.
- source_word: אֵילִים
  choice: баранов
  rationale: אֵיל — взрослый самец овцы, в жертвенной терминологии «баран».
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: Культовое требование целости и отсутствия порока у жертвенных животных естественно передаётся устойчивым выражением «без изъяна».
- source_word: לַיּוֹם
  choice: каждый день / в день
  rationale: В расписании жертвоприношений форма имеет распределительное значение; оно передано двумя естественными русскими оборотами.
- source_word: חַטָּאת
  choice: жертву за грех
  rationale: В жертвенном законодательстве חַטָּאת обозначает особый вид жертвы, традиционно называемый «жертвой за грех»; возможный акцент на очищении отмечен в сноске.
- source_word: שְׂעִיר עִזִּים
  choice: по одному козлу
  rationale: Сочетание обозначает козла; единственное число в распределительном перечне естественно передано как «по одному ... в день».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и отличает его от титула «Господь».
- issue: Значение חַטָּאת как названия жертвы
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: «Жертва за грех» остаётся понятным и общепринятым названием, однако термин может подчёркивать очистительную функцию, поэтому альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский с достоинством культового законодательного текста. Распределительные конструкции «по семь» и «по одному» делают порядок жертвоприношений ясным. Повтор семидневного срока сохранён, поскольку он присутствует в еврейском тексте; тире разгружает длинное предложение. Все сноски размещены непосредственно при соответствующих выражениях.
