  text: Я выбью твой лук из твоей левой руки и заставлю твои стрелы выпасть из твоей правой руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: Я выбью
  rationale: Глагол נכה в данной конструкции описывает удар, которым оружие выбивается или обезвреживается. «Выбью» естественно передаёт и силу удара, и его результат без архаического оттенка.
- source_word: קַשְׁתְּךָ
  choice: твой лук
  rationale: Прямое соответствие существительному קֶשֶׁת с суффиксом 2-го лица мужского рода единственного числа.
- source_word: מִיַּד שְׂמֹאולֶךָ
  choice: из твоей левой руки
  rationale: Сохраняет конкретный образ и естественно передаёт исходное значение предлога מִן — удаление оружия из руки.
- source_word: וְחִצֶּיךָ
  choice: а твои стрелы
  rationale: Передаёт форму множественного числа с притяжательным суффиксом; союз «а» подчёркивает параллель между луком в левой руке и стрелами в правой.
- source_word: מִיַּד יְמִינְךָ
  choice: из твоей правой руки
  rationale: Сохраняет телесный образ и параллелизм с выражением «из твоей левой руки».
- source_word: אַפִּיל
  choice: заставлю выпасть
  rationale: 'Порода hифиль глагола נפל имеет каузативное значение: Бог не просто предсказывает падение стрел, а вызывает его. «Заставлю выпасть» ясно сохраняет эту причинность.'
