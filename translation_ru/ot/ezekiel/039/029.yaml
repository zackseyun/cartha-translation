  text: וְ/לֹֽא אַסְתִּ֥יר ע֛וֹד פָּנַ֖/י מֵ/הֶ֑ם אֲשֶׁ֨ר שָׁפַ֤כְתִּי אֶת רוּחִ/י֙ עַל בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/029.yaml
  text: And I will no longer hide my face from them, when I have poured out my Spirit on the house of Israel, declares the Lord GOD.
translation:
  language: ru
  text: И Я больше не буду скрывать от них Моё лицо, когда изолью Мой Дух на дом Израиля, — возвещает Владыка ГОСПОДЬ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַסְתִּיר ... פָּנַי
  choice: буду скрывать ... Моё лицо
  rationale: Сохранена библейская метафора сокрытия лица как прекращения явного благоволения и присутствия Бога; местоимение «Моё» делает русскую фразу естественной.
- source_word: אֲשֶׁר שָׁפַכְתִּי
  choice: когда изолью
  rationale: אֲשֶׁר допускает контекстуальную временную связь; перфект после будущего обещания передан русским будущим совершенного вида, обозначающим действие, с которым связано прекращение сокрытия лица.
- source_word: רוּחִי
  choice: Мой Дух
  rationale: «Дух» с прописной буквы отражает принадлежность Богу и личностно-богословский смысл выражения, не добавляя определения, отсутствующего в еврейском тексте.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено традиционное и понятное коллективное обозначение народа Израиля.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка ГОСПОДЬ
  rationale: נְאֻם передано формулой пророческого объявления; אֲדֹנָי — «Владыка», а тетраграмматон — «ГОСПОДЬ», что сохраняет различие двух божественных наименований.
theological_decisions:
- issue: Связь излияния Духа с прекращением сокрытия Божьего лица
  choice: когда изолью
  alternative: потому что Я излил
  rationale: Выбрано временное прочтение, согласующееся с пророческим будущим контекста и сохраняющее утверждённую редакционную трактовку; причинный оттенок связи при этом не отрицается, но и не вносится явно.
- issue: Временная форма שָׁפַכְתִּי
  choice: 'будущее совершенного вида: «изолью»'
  alternative: 'прошедшее: «излил»'
  rationale: Еврейский перфект может представлять будущее действие как несомненное; буквальное русское прошедшее здесь создало бы неестественный временной разрыв с «больше не буду».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим регистром. Синтаксис краток и ясен; сохранены ключевые библейские образы и традиционное обозначение тетраграмматона прописными буквами.
