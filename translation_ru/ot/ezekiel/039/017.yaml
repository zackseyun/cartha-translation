  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אֱמֹר֩ לְ/צִפּ֨וֹר כָּל כָּנָ֜ף וּ/לְ/כֹ֣ל חַיַּ֣ת הַ/שָּׂדֶ֗ה הִקָּבְצ֤וּ וָ/בֹ֨אוּ֙ הֵאָסְפ֣וּ מִ/סָּבִ֔יב עַל זִבְחִ֗/י אֲשֶׁ֨ר אֲנִ֜י זֹבֵ֤חַ לָ/כֶם֙ זֶ֣בַח גָּד֔וֹל עַ֖ל הָרֵ֣י יִשְׂרָאֵ֑ל וַ/אֲכַלְתֶּ֥ם בָּשָׂ֖ר וּ/שְׁתִ֥יתֶם דָּֽם־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/017.yaml
  text: 'And you[a], son of man, thus says the Lord GOD: Say to every bird of every wing and to every beast of the field, ‘Gather yourselves and come; assemble from all around to my sacrifice that I am sacrificing for you, a great sacrifice on the mountains of Israel[b], and you shall eat flesh and drink blood.’'
translation:
  language: ru
  text: 'А ты, сын человеческий, — так говорит Владыка Яхве, — скажи всем птицам[a] и всем полевым зверям: «Собирайтесь, приходите, сходитесь со всех сторон к Моей жертве, которую Я приношу для вас, — к великой жертве на горах Израиля[b]. Будете есть плоть и пить кровь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «птице всякого крыла»; еврейская идиома означает всех птиц.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к Моему великому жертвенному пиру на горах Израиля». В еврейском тексте существительное «жертва» сочетается с однокоренным глаголом, подчёркивая картину жертвоприношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Устойчивое обращение к Иезекиилю; формальный эквивалент сохраняет повторяющийся пророческий титул и естественен для русского библейского регистра.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента составного божественного титула и сохраняет личное имя YHWH без неестественного сочетания «Господь Господь».
- source_word: צִפּוֹר כָּל כָּנָף
  choice: всякой птице крылатой
  rationale: Сохраняет образ крыла и всеобщий охват, оставаясь естественнее буквального «птице всякого крыла».
- source_word: חַיַּת הַשָּׂדֶה
  choice: всякому полевому зверю
  rationale: Передаёт обычное еврейское обозначение диких наземных животных и сохраняет возвышенный библейский регистр.
- source_word: הִקָּבְצוּ ... הֵאָסְפוּ
  choice: собирайтесь ... сходи́тесь
  rationale: Два близких по смыслу повеления переданы разными глаголами, чтобы сохранить риторическое нагнетание исходного текста.
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Естественно выражает приближение отовсюду.
- source_word: עַל זִבְחִי אֲשֶׁר אֲנִי זֹבֵחַ לָכֶם
  choice: к Моей жертве, которую Я закалываю для вас
  rationale: Направительное «к» соответствует контексту собирания; «жертва ... закалываю» сохраняет однокоренную жертвенную образность, насколько это возможно по-русски без искусственной конструкции.
- source_word: זֶבַח גָּדוֹל
  choice: великая жертва
  rationale: Сохраняет культовый смысл זֶבַח; аспект пиршества раскрывается последующим поеданием плоти и питьём крови.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: горы Израиля
  rationale: Прямой эквивалент, сохраняющий характерный для Иезекииля географический мотив.
- source_word: וַאֲכַלְתֶּם בָּשָׂר וּשְׁתִיתֶם דָּם
  choice: вы будете есть плоть и пить кровь
  rationale: «Плоть» сохраняет резкую и мрачную образность суда точнее, чем нейтральное «мясо».
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбор различает титул אֲדֹנָי и личное имя YHWH, не скрывая присутствия тетраграмматона и не создавая тавтологии.
- issue: Жертвенный образ как жертва или пир
  choice: жертва
  alternative: жертвенный пир
  rationale: Исходный текст допускает связь жертвы с пиршеством, однако повтор существительного זֶבַח и родственного глагола זבח прежде всего подчёркивает жертвенное заклание; альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повеления переданы энергично, а кровавая образность не смягчена. Ударение в «сходи́тесь» обозначено для устранения возможной неоднозначности при чтении.
