- from: Вы будете есть плоть могучих воинов и пить кровь князей земли — баранов, ягнят, козлов и быков[a], всех их, откормленных на Васане[b].
  to: Вы будете есть плоть могучих воинов и пить кровь князей земли — баранов, ягнят, козлов и быков[a]; все они — откормленные животные Васана[b].
