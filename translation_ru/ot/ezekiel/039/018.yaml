  text: בְּשַׂ֤ר גִּבּוֹרִים֙ תֹּאכֵ֔לוּ וְ/דַם נְשִׂיאֵ֥י הָ/אָ֖רֶץ תִּשְׁתּ֑וּ אֵילִ֨ים כָּרִ֤ים וְ/עַתּוּדִים֙ פָּרִ֔ים מְרִיאֵ֥י בָשָׁ֖ן כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/018.yaml
  text: You will eat the flesh of mighty men[a], and you will drink the blood of the princes of the earth—rams, lambs, male goats, and bulls[b], all of them fattened ones of Bashan.
translation:
  language: ru
  text: Вы будете есть плоть могучих воинов и пить кровь князей земли — баранов, ягнят, козлов и быков[a]; все они — откормленные животные Васана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия животных — баранов, ягнят, козлов и быков — служат жертвенным образом павших правителей и воинов.
    reason: cultural_note
  - marker: b
    text: 'Или: «тучные животные Васана». Васан славился богатыми пастбищами и откормленным скотом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר
  choice: плоть
  rationale: Сохраняет буквальный, резкий образ телесной плоти в жертвенной трапезе и не смягчает его словом «мясо».
- source_word: גִּבּוֹרִים
  choice: могучие воины
  rationale: В данном военном контексте слово обозначает сильных, доблестных бойцов; перевод ясно передаёт человеческий референт и звучит естественно по-русски.
- source_word: תֹּאכֵלוּ / תִּשְׁתּוּ
  choice: будете есть / пить
  rationale: Формы имперфекта переданы как пророческое объявление о предстоящем пире.
- source_word: נְשִׂיאֵי הָאָרֶץ
  choice: князья земли
  rationale: «Князья» сохраняет возвышенное обозначение правителей, а «земли» допускает широкий, международный смысл, не ограничивая выражение одной страной.
- source_word: אֵילִים כָּרִים וְעַתּוּדִים פָּרִים
  choice: бараны, ягнята, козлы и быки
  rationale: Буквальные названия животных сохраняют жертвенную метафору; «ягнята» отличает כָּרִים от уже названных баранов, а «козлы» передаёт мужской род животных без тяжеловесности.
- source_word: מְרִיאֵי בָשָׁן כֻּלָּם
  choice: всех их, откормленных на Васане
  rationale: Передаёт собирательное «все они» и образ упитанных животных из знаменитого своими пастбищами Васана естественным современным русским языком.
theological_decisions:
- issue: Следует ли объяснить названия животных как обозначения павших правителей и воинов прямо в основном тексте
  choice: Сохранить буквальный перечень животных как метафорическое приложение к людям, пояснив образ в сноске.
  alternative: Заменить названия животных толкованием, например «могущественные правители и воины».
  rationale: Еврейский текст намеренно соединяет человеческих жертв с образами жертвенных животных. Буквальный перечень сохраняет напряжённую и гротескную образность пророчества, не подменяя перевод толкованием.
- issue: Значение הָאָרֶץ в выражении נְשִׂיאֵי הָאָרֶץ
  choice: земли
  alternative: страны
  rationale: Контекст суда над международными войсками допускает широкий смысл «земля, мир»; «страны» могло бы неоправданно сузить референт.
translation_notes:
  register: Современный литературный русский язык с возвышенной пророческой интонацией. Синтаксис сохраняет параллелизм «есть плоть — пить кровь», а тире показывает, что перечень животных метафорически поясняет названных людей.
