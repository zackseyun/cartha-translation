  source_fidelity: 'Текст точно передаёт все элементы еврейского оригинала: пророческое будущее в וְיָדְעוּ, собирательное «дом Израиля», придаточное содержания с כִּי, личное имя Яхве, «их Бог» и временную протяжённость «с того дня и впредь». Единственное число «узнает» при собирательном «дом Израиля» нормативно и естественно по-русски; оно не изменяет коллективного смысла.'
