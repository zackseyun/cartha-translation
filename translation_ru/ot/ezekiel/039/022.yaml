  text: וְ/יָֽדְעוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם מִן הַ/יּ֥וֹם הַ/ה֖וּא וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/022.yaml
  text: And the house of Israel will know that I am Yahweh their God from that day onward[a].
translation:
  language: ru
  text: И узнает дом Израиля, что Я — Яхве, их Бог, с того дня и впредь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с того дня и далее».'
    reason: Лексический вариант передачи וָהָלְאָה.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнает
  rationale: Форма употреблена в пророческом контексте с будущим, результативным значением. Единственное число согласуется с собирательным выражением «дом Израиля».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранён устойчивый еврейский собирательный оборот, подчёркивающий народ как единое целое.
- source_word: כִּי
  choice: что
  rationale: Союз вводит придаточное, раскрывающее содержание того, что узнает Израиль.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֵיהֶם
  choice: их Бог
  rationale: Естественно передаёт форму с местоименным суффиксом и сохраняет заветный характер утверждения.
- source_word: מִן הַיּוֹם הַהוּא
  choice: с того дня
  rationale: Обозначает исходный момент продолжающегося состояния.
- source_word: וָהָלְאָה
  choice: и впредь
  rationale: Передаёт продолжение во времени после указанного дня естественным и литературным русским оборотом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого звучания и еврейского собирательного выражения «дом Израиля».
