  terminology: «Жители городов Израиля», «малые и большие щиты», «луки и стрелы», «палицы» и «копья» уместны. Различение двух видов щитов сохранено без излишней категоричности. «Ручные палицы» допустимо для спорного מַקֵּל־יָד; примечание корректно отмечает буквальную форму и вероятностный характер толкования.
