base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/009.yaml
  text: Then the inhabitants of the cities of Israel will go out and make fires with the weapons and burn them—the small shield and the large shield[a], the bow and the arrows[c][b], the hand-club and the spear—and they will make fires with them for seven years.
translation:
  language: ru
  text: Тогда жители городов Израиля выйдут и будут жечь оружие — малые и большие щиты[b], луки и стрелы, ручные палицы[c] и копья — и разжигать им огонь[a]. Семь лет они будут разжигать им огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут жечь и разжигать оружием». Точное значение второго еврейского глагола в этом сочетании не вполне ясно, но из контекста следует, что оружие сжигают и используют как топливо.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте названы два вида щитов: מגן — вероятно, меньший щит, и צנה — большой щит, прикрывавший тело.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «ручные палки» или «ручные посохи»; в данном перечне, вероятно, имеется в виду ручное ударное оружие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: выйдут
  rationale: Передаёт обычное значение глагола יצא и явно обозначает выход жителей из городов.
- source_word: יֹשְׁבֵי עָרֵי יִשְׂרָאֵל
  choice: жители городов Израиля
  rationale: Естественно и точно передаёт конструкцию «живущие в городах Израиля».
- source_word: וּבִעֲרוּ וְהִשִּׂיקוּ בְּנֶשֶׁק
  choice: станут разводить огонь оружием, сжигая
  rationale: Сочетание глаголов необычно, однако контекст ясно указывает, что оружие используют как топливо. Формулировка сохраняет оба действия, не приписывая трудному глаголу чрезмерно узкого значения.
- source_word: נֶשֶׁק
  choice: оружие
  rationale: Собирательное существительное обозначает вооружение в целом; единственное число естественно по-русски.
- source_word: מָגֵן וְצִנָּה
  choice: малые и большие щиты
  rationale: Передаёт различие между обычным, вероятно меньшим щитом מגן и большим щитом צנה понятными современному читателю словами.
- source_word: קֶשֶׁת וּבְחִצִּים
  choice: луки и стрелы
  rationale: Стандартные и контекстуально точные соответствия.
- source_word: מַקֵּל יָד
  choice: ручные палицы
  rationale: Буквально выражение означает «палка/посох руки»; в перечне оружия оно, вероятно, называет предназначенное для боя ручное ударное оружие.
- source_word: רֹמַח
  choice: копья
  rationale: Точное и общеупотребительное обозначение данного древнего оружия.
- source_word: וּבִעֲרוּ בָהֶם אֵשׁ שֶׁבַע שָׁנִים
  choice: Семь лет они будут разводить ими огонь
  rationale: Сохраняет инструментальное значение местоимения «ими» и подчёркивает длительное использование оружия как топлива.
