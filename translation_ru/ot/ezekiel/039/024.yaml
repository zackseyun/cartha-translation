  text: כְּ/טֻמְאָתָ֥/ם וּ/כְ/פִשְׁעֵי/הֶ֖ם עָשִׂ֣יתִי אֹתָ֑/ם וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/024.yaml
  text: According to their uncleanness and according to their transgressions I dealt with them[a], and I hid my face from them.
translation:
  language: ru
  text: По их нечистоте и по их преступлениям Я поступил с ними[a] и скрыл от них Моё лицо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообразно их нечистоте и их мятежам Я обошёлся с ними».'
    reason: Лексические варианты для כ, פֶּשַׁע и идиомы עָשָׂה אֵת.
lexical_decisions:
- source_word: כְּטֻמְאָתָם
  choice: По их нечистоте
  rationale: 'Предлог כ передаёт соответствие или меру: «по, сообразно». Слово טֻמְאָה охватывает ритуальную и нравственную нечистоту; «нечистота» сохраняет широкий библейский смысл.'
- source_word: וּכְפִשְׁעֵיהֶם
  choice: и по их преступлениям
  rationale: פֶּשַׁע означает преступление, нарушение и нередко мятеж против Бога. «Преступления» сохраняет нравственную и заветную весомость слова, не сужая его до открытого бунта.
- source_word: עָשִׂיתִי אֹתָם
  choice: Я поступил с ними
  rationale: В данном контексте сочетание עשה с прямым дополнением имеет идиоматический смысл «поступить с кем-либо, обойтись с кем-либо», а не «сделать их».
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: и скрыл от них Моё лицо
  rationale: Сохранён значимый древнееврейский образ сокрытия лица, обозначающий лишение благоволения или присутствия в суде, без сведения образа к одному толкованию.
- source_word: פָּנַי
  choice: Моё лицо
  rationale: Хотя слово может метонимически указывать на присутствие или благоволение, буквальный образ важен и понятен по-русски.
theological_decisions:
- issue: Передавать ли выражение «скрыл Моё лицо» пояснительной парафразой об удалении Божьего благоволения
  choice: Сохранить в основном тексте образ «скрыл от них Моё лицо»
  alternative: «отвернулся от них»; «лишил их Своего благоволения»
  rationale: Образ понятен в русском языке и богословски значим в пророческой литературе; он выражает суд в рамках завета, не сводя смысл лишь к одному аспекту.
- issue: Значение טֻמְאָה в пророческом контексте
  choice: «нечистота»
  alternative: «осквернение»; «нечистота и осквернение»
  rationale: У Иезекииля слово может включать как обрядовую, так и нравственную нечистоту. Выбранный вариант сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и ключевого библейского образа «скрыть лицо». Местоимения, относящиеся к Богу, оформлены с прописной буквы в соответствии с принятой русской религиозно-издательской практикой.
