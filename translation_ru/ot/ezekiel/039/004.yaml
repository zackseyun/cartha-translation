base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/004.yaml
  text: On the mountains of Israel you will fall—you and all your troops and the peoples who are with you[b][a]. I have given you as food to every kind of bird of prey and to the wild animals of the field.
translation:
  language: ru
  text: На горах Израиля падёшь ты — вместе со всеми твоими войсками[a] и народами, которые с тобой. Я отдал тебя на съедение всевозможным хищным птицам[b] и диким зверям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все твои крылья»; вероятно, имеются в виду военные подразделения или присоединённые силы Гога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хищным птицам всякого крыла»; еврейское выражение охватывает всевозможных птиц, питающихся добычей или падалью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפּוֹל
  choice: падёшь
  rationale: Сохраняет конкретный образ глагола נפל («падать»), который в контексте суда подразумевает поражение и смерть, не выражая это толкование явно.
- source_word: אֲגַפֶּיךָ
  choice: твои полчища
  rationale: Буквально существительное связано с «крыльями», но здесь метафорически обозначает военные подразделения или присоединённые силы; «полчища» естественно передаёт масштаб войска в возвышенном пророческом контексте.
- source_word: עַמִּים אֲשֶׁר אִתָּךְ
  choice: народы, которые с тобой
  rationale: Передаёт множественное עַמִּים как этнические группы или народы, а не сводит выражение к воинским частям.
- source_word: לְעֵיט צִפּוֹר כָּל כָּנָף
  choice: всевозможным хищным птицам
  rationale: Естественно передаёт идиоматическое сочетание о птицах всякого крыла, питающихся добычей или падалью, сохраняя идею всеохватности.
- source_word: חַיַּת הַשָּׂדֶה
  choice: диким зверям
  rationale: Современный и естественный русский эквивалент устойчивого древнееврейского обозначения диких наземных животных; слово «полевым» здесь избыточно и может звучать неясно.
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: Я отдал тебя на съедение
  rationale: Передаёт совершенную форму «Я отдал тебя» и цель/результат לְאָכְלָה; выражение естественно по-русски и сохраняет суровый образ суда.
theological_decisions:
- issue: Божественное действие в образе суда
  choice: Я отдал тебя на съедение
  alternative: Я отдам тебя на съедение
  rationale: В еврейском тексте стоит перфект первого лица נְתַתִּיךָ, буквально «Я отдал тебя». В пророческой речи он может обозначать будущее событие как уже решённое и несомненное; прошедшее время сохраняет эту напряжённость, не устраняя её толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис прямой и понятный; сохранены конкретный образ падения и совершенная форма божественного приговора. Все сноски отмечены в основном тексте.
