  source_fidelity: 'Смысл в целом передан точно: падение Гога на горах Израиля, его военных сил и сопутствующих народов, а также отдача их хищным птицам и диким зверям. Однако исходная русская координация «падёшь ты, и все твои полчища..., и народы» может грамматически восприниматься так, будто глагол в единственном числе относится только к «ты», а последующие группы просто присоединены не вполне ясно. Формула «вместе со всеми…» прямо и естественно выражает общий объект пророческого приговора.'
