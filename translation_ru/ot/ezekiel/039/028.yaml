source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם בְּ/הַגְלוֹתִ֤/י אֹתָ/ם֙ אֶל הַ/גּוֹיִ֔ם וְ/כִנַּסְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹֽא אוֹתִ֥יר ע֛וֹד מֵ/הֶ֖ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/028.yaml
  text: Then they will know that I am Yahweh their God[a], when I exiled them among the nations and then gathered them onto their own land, and I will leave none of them there any longer.
translation:
  language: ru
  text: Тогда они узнают, что Я — Яхве, их Бог[a], когда Я отправлю их в изгнание среди народов, а затем соберу их на их земле и больше не оставлю там ни одного из них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И они узнают, что Я — Яхве, их Бог, по тому, что Я отправлю их в изгнание среди народов и соберу их на их земле».'
    reason: Предлог בְּ при инфинитиве может обозначать не только время («когда»), но и средство или основание узнавания («по тому, что»).
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Тогда они узнают
  rationale: Глагол означает «знать, узнать». Союз וְ передан как «тогда», поскольку в контексте он вводит результат Божьих действий, не устраняя простой последовательной связи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵיהֶם
  choice: их Бог
  rationale: Форма с местоименным суффиксом буквально обозначает «их Бог».
- source_word: בְּהַגְלוֹתִי אֹתָם אֶל־הַגּוֹיִם
  choice: когда Я отправлю их в изгнание к народам
  rationale: Порода глагола выражает причинение изгнания. Предлог בְּ при инфинитиве допускает временное и инструментальное понимание; в основном тексте выбрано естественное временное прочтение, а альтернатива отмечена в сноске. אֶל сохраняет направленность — «к народам».
- source_word: וְכִנַּסְתִּים
  choice: а затем соберу
  rationale: כנס значит «собирать». Будущее время естественно передаёт перспективу обещанного восстановления, тогда как «затем» обозначает последовательность изгнания и возвращения.
- source_word: עַל אַדְמָתָם
  choice: на их земле
  rationale: עַל буквально имеет значение «на», а אַדְמָה здесь обозначает принадлежащую Израилю землю.
- source_word: וְלֹא אוֹתִיר עוֹד מֵהֶם שָׁם
  choice: и больше не оставлю там ни одного из них
  rationale: הותיר в каузативной породе значит «оставлять, сохранять как остаток». Русская формулировка ясно передаёт обещание, что среди народов не останется ни одного изгнанника.
theological_decisions:
- issue: Отношение Божьих действий к узнаванию Яхве
  choice: 'В основном тексте בְּ передано временно: «когда Я…»'
  alternative: 'Инструментально-причинное понимание: Израиль узнает Яхве «по тому, что» Он изгнал и вновь собрал его.'
  rationale: Обе связи грамматически допустимы. Временное прочтение хорошо соответствует ходу пророчества, но альтернативное не исключается и сохранено в сноске.
- issue: Временная перспектива форм изгнания, собирания и оставления
  choice: 'Будущее время в русском: «отправлю… соберу… не оставлю»'
  alternative: 'Передача совершенных форм прошедшим временем: «отправил… собрал… не оставил».'
  rationale: Еврейские совершенные формы могут представлять обещанные события как несомненные. В контексте пророческого обещания последовательное русское будущее звучит естественно и не меняет заявленной уверенности.
- issue: К чему относится «там» (שָׁם)
  choice: К народам, то есть к месту изгнания
  alternative: Общее указание на место без явно названного антецедента
  rationale: Ближайший контраст — между пребыванием у народов и собиранием на своей земле; поэтому обещание означает, что никто не останется в изгнании.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; личное имя «Яхве» сохранено. Повтор «их» удержан там, где он выражает заветную принадлежность и возвращение на собственную землю.
