lexical_decisions:
- source_word: וְגַם
  choice: И … будет
  rationale: Сочетание союза и наречия вводит ещё одну деталь; в русском контексте добавочное значение естественно передаётся союзом «и», без тяжеловесного «также».
- source_word: שֵׁם עִיר
  choice: имя города
  rationale: Конструктивное сочетание означает «имя города»; речь идёт о конкретном городе из данного пророчества.
- source_word: הֲמוֹנָה
  choice: Гамона
  rationale: Слово выступает как географическое название, поэтому транслитерируется, а вероятная связь с существительным «множество, полчище» поясняется в сноске.
- source_word: וְטִהֲרוּ
  choice: Так они очистят
  rationale: Пиэль перфекта с союзом в пророческом контексте выражает будущий результат описанного погребения; «так» естественно передаёт итоговую связь, а «очистят» сохраняет конкретный и ритуальный оттенок глагола.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте имеется в виду земля, осквернённая телами погибших, а не весь мир.
