source:
  edition: WLC
  text: וּ/קְבָרוּ/ם֙ בֵּ֣ית יִשְׂרָאֵ֔ל לְמַ֖עַן טַהֵ֣ר אֶת הָ/אָ֑רֶץ שִׁבְעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/012.yaml
  text: The house of Israel will bury them for seven months[a], in order to cleanse the land.
translation:
  language: ru
  text: Дом Израиля будет хоронить их семь месяцев, чтобы очистить землю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделать землю чистой». Еврейский глагол может обозначать очищение от обрядовой нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְבָרוּם
  choice: будет хоронить их
  rationale: Форма от קבר с объектным суффиксом означает «похоронят их» и в пророческой последовательности имеет будущее значение. Единственное число сказуемого естественно согласуется в русском с собирательным подлежащим «Дом Израиля».
- source_word: בֵּית יִשְׂרָאֵל
  choice: Дом Израиля
  rationale: Сохранено устойчивое пророческое обозначение Израиля как единого народа; оно передаёт корпоративный оттенок исходного выражения.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Кратко и естественно выражает целевое значение конструкции.
- source_word: טַהֵר
  choice: очистить
  rationale: Порода пиэль глагола טהר здесь обозначает устранение нечистоты; «очистить» сохраняет как физический, так и обрядовый смысл.
- source_word: אֶת־הָאָרֶץ
  choice: землю
  rationale: В данном контексте имеется в виду земля Израиля, осквернённая телами павших, а не весь мир.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: семь месяцев
  rationale: 'Винительный длительности естественно передаётся по-русски без предлога: действие будет продолжаться семь месяцев.'
theological_decisions:
- issue: Характер очищения земли
  choice: очистить землю
  alternative: сделать землю чистой; очистить землю от осквернения
  rationale: Формулировка сохраняет связь с осквернением от мёртвых тел и возможный обрядовый оттенок, не добавляя отсутствующего в тексте пояснения о механизме очищения.
translation_notes:
  register: Современный литературный русский с сохранением характерного для пророческой речи выражения «Дом Израиля». Порядок слов слегка перестроен ради естественности; длительность поставлена перед целью. Маркер сноски расположен после всего утверждения об очищении земли.
