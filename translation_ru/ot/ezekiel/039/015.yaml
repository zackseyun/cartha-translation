base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/015.yaml
  text: And those who pass through the land will pass through[a], and when one sees a human bone[b], he will set up a marker beside it until the buriers have buried it in the Valley of Hamon-gog.
translation:
  language: ru
  text: Те, кто проходит по земле, будут проходить по ней; и когда кто-нибудь увидит человеческую кость[a], то поставит возле неё знак, пока те, кто занимается погребением, не похоронят её в долине Гамон-Гог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кость человека». Еврейское адам здесь обозначает человека вообще, без указания пола.'
    reason: lexical_alternative
  - marker: b
    text: Название «Гамон-Гог», вероятно, означает «множество Гога» или «полчище Гога»; здесь оно сохранено как название места.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ הָעֹבְרִים בָּאָרֶץ
  choice: Те, кто обходит землю, будут проходить по ней
  rationale: Сохранён повтор корня עבר, передающий систематический обход земли, но фраза выстроена естественно для современного русского языка.
- source_word: וְרָאָה
  choice: и если кто-нибудь увидит
  rationale: 'Форма мужского рода единственного числа имеет здесь обобщённое значение: речь идёт о любом из проходящих. Условная конструкция естественно передаёт порядок действий.'
- source_word: עֶצֶם אָדָם
  choice: человеческую кость
  rationale: אָדָם обозначает здесь человека вообще, а не обязательно мужчину; עֶצֶם означает отдельную кость.
- source_word: וּבָנָה אֶצְלוֹ צִיּוּן
  choice: то поставит возле неё знак
  rationale: בנה буквально означает «строить», но в сочетании с צִיּוּן в данном контексте описывает установку опознавательного знака рядом с останками.
- source_word: עַד קָבְרוּ אֹתוֹ הַמְקַבְּרִים
  choice: пока те, кто занимается погребением, не похоронят её
  rationale: Субстантивированное причастие обозначает людей, которым поручено погребение. Русское местоимение согласовано со словом «кость».
- source_word: אֶל גֵּיא הֲמוֹן גּוֹג
  choice: в долине Гамон-Гог
  rationale: После глагола «похоронят» русский язык естественно требует обозначения места с предлогом «в». Название сохранено транслитерацией, поскольку в контексте это топоним.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: человеческую
  alternative: мужскую / принадлежащую мужчине
  rationale: Контекст описывает обнаружение человеческих останков без указания пола, поэтому родовое значение אָדָם не следует сужать до мужчины.
- issue: Передача הֲמוֹן גּוֹג
  choice: Гамон-Гог как название места
  alternative: множество Гога / полчище Гога
  rationale: Выражение допускает смысловой перевод, однако в стихе оно входит в уже установленное название долины; транслитерация сохраняет его функцию топонима, а значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Процедурный характер описания сохранён; необычный еврейский повтор корня עבר передан без чрезмерной буквальности.
