  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/יּ֣וֹם הַ/ה֡וּא אֶתֵּ֣ן לְ/גוֹג֩ מְקֽוֹם שָׁ֨ם קֶ֜בֶר בְּ/יִשְׂרָאֵ֗ל גֵּ֤י הָ/עֹֽבְרִים֙ קִדְמַ֣ת הַ/יָּ֔ם וְ/חֹסֶ֥מֶת הִ֖יא אֶת הָ/עֹֽבְרִ֑ים וְ/קָ֣בְרוּ שָׁ֗ם אֶת גּוֹג֙ וְ/אֶת כָּל הֲמוֹנֹ֔/ה וְ/קָ֣רְא֔וּ גֵּ֖יא הֲמ֥וֹן גּֽוֹג׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/011.yaml
  text: And it will be in that day that I will give Gog a burial place there in Israel[a], the Valley of the Travelers, east of the sea; and it will block the travelers. There they will bury Gog and all his multitude[c][b], and they will call it the Valley of Hamon-gog.
translation:
  language: ru
  text: 'И будет в тот день: Я дам Гогу место для погребения там, в Израиле, — Долину проходящих[a], к востоку от моря[b]. Она преградит путь проходящим. Там похоронят Гога и всё его множество, и назовут эту долину Долиной Гамон-Гога[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Долину тех, кто проходит мимо»; еврейское выражение может быть как описанием, так и названием места.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед морем»; еврейское выражение может указывать на расположение относительно моря, а не строго на восточное направление.'
    reason: lexical_alternative
  - marker: c
    text: Название «Гамон-Гог», вероятно, означает «множество Гога».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם שָׁם קֶבֶר
  choice: место для погребения там
  rationale: Сохраняет значения מְקוֹם, שָׁם и קֶבֶר, оставаясь естественным по-русски.
- source_word: גֵּי הָעֹבְרִים
  choice: Долина проходящих
  rationale: Причастное существительное הָעֹבְרִים буквально обозначает проходящих или идущих мимо; формулировка сохраняет повтор с последующей фразой и возможный топонимический характер.
- source_word: קִדְמַת הַיָּם
  choice: к востоку от моря
  rationale: В географическом контексте קִדְמַת естественно понимать как указание на восток, однако возможное значение ориентации «перед морем» отмечено в сноске.
- source_word: וְחֹסֶמֶת הִיא אֶת הָעֹבְרִים
  choice: Она преградит путь проходящим
  rationale: Передаёт значение חסם — «перекрывать, преграждать» — естественным русским оборотом; добавленное слово «путь» лишь выражает подразумеваемый объект преграды.
- source_word: הֲמוֹנוֹ
  choice: всё его множество
  rationale: «Множество» сохраняет широкий смысл הָמוֹן и не сужает его до войска, хотя военный смысл следует из контекста.
- source_word: גֵּיא הֲמוֹן גּוֹג
  choice: Долина Гамон-Гога
  rationale: Транслитерация сохраняет функцию названия места; его смысл раскрыт в сноске.
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохраняет пророческую формулу и её торжественную, но понятную современному читателю интонацию.
- source_word: אֶתֵּן לְגוֹג
  choice: Я дам Гогу
  rationale: Прямо передаёт נתן с ל; последующее дополнение поясняет, что Гогу даётся место для погребения.
theological_decisions:
- issue: Перевод или транслитерация конечного названия места
  choice: Транслитерировать как «Гамон-Гог»
  alternative: Перевести как «Множество Гога»
  rationale: Выражение выступает новым топонимом, поэтому транслитерация сохраняет статус имени, а сноска раскрывает его вероятное значение.
translation_notes:
  register: Современный литературный русский с сохранением пророческой торжественности. Повтор «проходящих» намеренно отражает повтор הָעֹבְרִים. Все сноски поставлены непосредственно после соответствующих выражений.
