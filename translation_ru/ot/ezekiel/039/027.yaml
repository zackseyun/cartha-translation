  terminology: «Народы» удачно сохраняет различие между עמים и גוים, не навязывая категории «язычники». «Святость» и её публичное проявление переданы без богословской сверхинтерпретации. «Через них» является допустимой интерпретацией בם; формальная альтернатива «в них» должна оставаться в сноске.
