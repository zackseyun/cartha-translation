  text: when I bring them back from the peoples and gather them from the lands of their enemies[a], and I am shown holy through them before the eyes of many nations.
translation:
  language: ru
  text: когда Я возвращу их из народов и соберу из земель их врагов, тогда явлю через них Свою святость перед глазами многих народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «освящусь в них» или «явлюсь святым в них». Речь о том, что Господь публично явит Свою святость посредством того, что совершит с ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹבְבִי
  choice: когда Я возвращу
  rationale: Порода хифиль глагола שׁוב выражает причинное значение «возвратить, привести обратно»; предлог ב при инфинитиве со суффиксом первого лица задаёт временное придаточное.
- source_word: הָעַמִּים
  choice: из среды народов
  rationale: «Народы» передаёт עמים и сохраняет отличие от גוים в конце стиха; «из среды» естественно выражает рассеяние среди них, не добавляя нового места исхода.
- source_word: וְקִבַּצְתִּי
  choice: и соберу
  rationale: קבץ означает «собирать». Будущее время естественно для русского пророческого контекста и согласуется с временной конструкцией «когда Я возвращу».
- source_word: מֵאַרְצוֹת אֹיְבֵיהֶם
  choice: из земель их врагов
  rationale: Сохраняются множественное число ארצות и притяжательная связь с «врагами».
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: тогда через них явлю Свою святость
  rationale: Нифаль קדש при Боге как субъекте говорит о публичном обнаружении Его святости. «Через них» передаёт инструментально-сферическое בם, а «явлю Свою святость» не создаёт ложного впечатления, будто Бог становится святым.
- source_word: לְעֵינֵי
  choice: перед глазами
  rationale: Сохранён конкретный образ еврейской идиомы публичной видимости.
- source_word: הַגּוֹיִם רַבִּים
  choice: многих народов
  rationale: גוים здесь обозначает народы мира, а не конфессионально нагруженную категорию «язычников».
theological_decisions:
- issue: Выражение о явлении Божьей святости
  choice: через них явлю Свою святость
  alternative: освящусь в них; буду явлен святым через них
  rationale: Основной вариант ясно передаёт публичное проявление уже присущей Богу святости в Его действиях с Израилем. Более формальные варианты сохраняются в примечании, поскольку еврейская форма допускает пассивно-рефлексивное выражение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Добавлен коррелят «тогда» для ясной и естественной связи длинного временного придаточного с главным предложением.
