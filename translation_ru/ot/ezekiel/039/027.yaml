  source_fidelity: 'В целом смысл передан точно: причинное «возвращу», собирание из земель врагов, публичное явление Божьей святости и «многие народы» сохранены. Однако «из среды народов» несколько конкретизирует исходный מן־העמים («из народов»), добавляя образ нахождения среди народов, которого данная форма сама по себе не выражает. Лучше сохранить более нейтральное «из народов».'
