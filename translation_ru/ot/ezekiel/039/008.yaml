  text: הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה ה֥וּא הַ/יּ֖וֹם אֲשֶׁ֥ר דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/008.yaml
  text: Behold[a], it is coming, and it will happen, declares the Lord GOD. This is the day of which I have spoken.
translation:
  language: ru
  text: Вот, это грядёт и сбудется[a], — возвещает Владыка Яхве. — Это тот день, о котором Я говорил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «оно пришло и совершилось». В еврейском тексте употреблены формы, которые могут представлять будущее событие настолько несомненным, словно оно уже произошло.'
    reason: Сохраняет временную неоднозначность еврейских перфектных форм и поясняет пророческое употребление.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-восклицательную силу пророческой формулы и звучит естественно в современном литературном русском.
- source_word: בָאָה
  choice: это грядёт
  rationale: Женская форма перфекта, вероятно, соотносится с подразумеваемым событием или бедствием; безлично-указательное «это» не вводит в текст конкретный референт. «Грядёт» передаёт близость и пророческую торжественность.
- source_word: וְנִהְיָתָה
  choice: и непременно сбудется
  rationale: Глагол היה здесь обозначает наступление или осуществление предсказанного. «Сбудется» естественно связано с ранее произнесённым пророчеством, а «непременно» передаёт уверенность пророческих перфектов.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт устойчивую пророческую формулу как торжественное авторитетное провозглашение, не прибегая к техническому «речение».
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» естественно передаёт אֲדֹנָי и позволяет без повтора титулов сохранить личное имя Яхве, непосредственно представленное в еврейском тексте.
- source_word: הוּא הַיּוֹם
  choice: вот тот день
  rationale: 'Передаёт эмфатическое отождествление: наступающее событие есть именно ранее возвещённый день.'
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: о котором Я говорил
  rationale: Современная и ясная русская конструкция, сохраняющая связь дня с прежним Божьим пророческим словом.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: Так сохраняются и значение אֲדֹנָי как титула верховной власти, и собственное имя Яхве, без неестественного русского повтора «Господь ГОСПОДЬ».
- issue: Временная перспектива форм בָאָה וְנִהְיָתָה
  choice: будущее событие, представленное как несомненное
  alternative: оно пришло и совершилось
  rationale: Перфектные формы допускают формальную передачу завершённым прошедшим, однако в пророческом контексте они могут изображать будущее как уже состоявшееся ввиду его несомненности. Основной текст передаёт эту функцию, а сноска сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным пророческим оттенком. Архаизирующее «грядёт» сохранено как понятное и уместное для возвышенного регистра; остальная фраза построена просто и естественно.
