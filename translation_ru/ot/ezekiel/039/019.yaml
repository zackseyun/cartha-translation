base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/019.yaml
  text: You will eat fat until you are full[a], and you will drink blood to drunkenness, from my sacrifice that I have sacrificed for you.
translation:
  language: ru
  text: Вы будете досыта есть жир и допьяна пить кровь от Моей жертвы[a], которую Я принёс для вас в жертву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Моего жертвенного пиршества, которое Я устроил для вас». В еврейском тексте буквально: «от Моей жертвы, которую Я принёс для вас в жертву»; здесь намеренно повторена жертвенная лексика. Из более широкого контекста ясно, что речь идёт о пиршестве над убитыми.'
    reason: Лексическая альтернатива и пояснение контекстуального смысла жертвенного образа.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: вы будете есть
  rationale: Форма продолжает пророческое возвещение о том, что будут делать птицы и звери, поэтому по-русски естественно будущее время.
- source_word: חֵלֶב לְשָׂבְעָה
  choice: жир досыта
  rationale: «Жир» прямо передаёт существительное и сохраняет жертвенную образность; «досыта» естественно выражает насыщение и предел действия.
- source_word: וּשְׁתִיתֶם דָּם לְשִׁכָּרוֹן
  choice: и пить кровь допьяна
  rationale: Прямое «кровь» сохраняет намеренно потрясающий образ, а «допьяна» кратко и естественно передаёт достижение опьянения.
- source_word: מִזִּבְחִי
  choice: от Моей жертвы
  rationale: Существительное זֶבַח обозначает жертву и снабжено суффиксом первого лица; буквальная передача удерживает жертвенный язык суда.
- source_word: אֲשֶׁר זָבַחְתִּי לָכֶם
  choice: которую Я заколол для вас
  rationale: «Заколол» передаёт жертвенный глагол זבח и в современном русском звучит естественнее, чем тяжеловесное повторение «принёс в жертву жертву»; «для вас» прямо отражает לָכֶם.
theological_decisions:
- issue: Жертвенная образность применительно к Божьему суду
  choice: Сохранить в основном тексте прямое упоминание Божьей жертвы и заклания.
  alternative: «От жертвенного пиршества, которое Я устроил для вас».
  rationale: Контекст изображает суд над войском Гога как жертвенное пиршество для птиц и зверей. Прямой жертвенный язык сохраняет силу и мрачную иронию образа, не связывая его с более поздними доктринальными построениями.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и образная. Слова «жир», «кровь» и «заколол» намеренно сохраняют резкость пророческой картины. Местоимение «Моей» написано с прописной буквы как обращённое к Богу.
