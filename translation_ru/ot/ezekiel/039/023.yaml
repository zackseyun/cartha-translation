source:
  edition: WLC
  text: וְ/יָדְע֣וּ הַ֠/גּוֹיִם כִּ֣י בַ/עֲוֺנָ֞/ם גָּל֣וּ בֵֽית יִשְׂרָאֵ֗ל עַ֚ל אֲשֶׁ֣ר מָֽעֲלוּ בִ֔/י וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶ֑ם וָֽ/אֶתְּנֵ/ם֙ בְּ/יַ֣ד צָרֵי/הֶ֔ם וַ/יִּפְּל֥וּ בַ/חֶ֖רֶב כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/023.yaml
  text: And the nations will know that the house of Israel went into exile for their iniquity[a], because they acted unfaithfully against me; so I hid my face from them and gave them into the hand of their adversaries[b], and they all fell by the sword.
translation:
  language: ru
  text: И узнают народы, что дом Израиля оказался в изгнании за своё беззаконие, за то, что они были неверны Мне[a]. Я скрыл от них Своё лицо, отдал их в руки их врагов[b], и все они пали от меча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступили со Мной вероломно» / «нарушили верность Мне». Еврейский глагол выражает нарушение доверия и верности, в том числе верности завету.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в руку их врагов» — еврейский оборот, означающий передачу под чью-либо власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнают
  rationale: Перфект с союзом в пророческом контексте имеет будущее, результативное значение; перевод сохраняет характерную для Иезекииля тему познания и признания.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Речь идёт об окружающих чужеземных народах; «народы» — ясный и нейтральный современный эквивалент.
- source_word: בַעֲוֺנָם
  choice: за своё беззаконие
  rationale: עָוֹן обозначает нравственную вину и беззаконие, а предлог указывает здесь на причину изгнания. Возвратное местоимение естественно соотносит вину с собирательным «домом Израиля».
- source_word: גָּלוּ
  choice: был изгнан
  rationale: Форма означает уход или переселение в изгнание. Русское «был изгнан» естественно передаёт исторически подразумеваемое насильственное изгнание, не превращая его в добровольный уход.
- source_word: בֵית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено важное для Иезекииля заветное собирательное обозначение народа.
- source_word: עַל אֲשֶׁר
  choice: за то, что
  rationale: Оборот вводит причину изгнания; русский эквивалент ясно сохраняет причинную связь.
- source_word: מָעֲלוּ בִי
  choice: они были неверны Мне
  rationale: Глагол מעל выражает нарушение верности, вероломство или злоупотребление доверием, особенно в отношениях завета. Формулировка естественна по-русски и не добавляет конфессиональной терминологии.
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: Я скрыл от них Своё лицо
  rationale: Сохранён значимый библейский образ сокрытия Божьего лица — лишения благоволения и защиты — без поясняющей вставки в основной текст.
- source_word: וָאֶתְּנֵם בְּיַד צָרֵיהֶם
  choice: отдал их в руки их врагов
  rationale: Русское «отдать в руки» естественно сохраняет еврейский образ передачи под чужую власть; צָרִים в данном контексте обозначает враждебных противников.
- source_word: וַיִּפְּלוּ בַחֶרֶב כֻּלָּם
  choice: и все они пали от меча
  rationale: Сохранён торжественный библейский оборот о гибели от оружия и подчёркнуто обобщающее כֻּלָּם — «все».
theological_decisions:
- issue: Связь беззакония Израиля, сокрытия Божьего лица и военного поражения
  choice: Изгнание и гибель представлены как последствие неверности Израиля и как действие Бога, отдавшего народ во власть врагов.
  alternative: Описать изгнание лишь как историческое событие, ослабив прямое указание на Божий суд.
  rationale: Еврейский текст прямо связывает изгнание с беззаконием и неверностью народа, а затем называет сокрытие Божьего лица и передачу врагам действиями Бога. Перевод сохраняет и человеческую ответственность, и Божью действенность, не объясняя сверх текста их соотношение.
- issue: Логическая сила последовательных форм с וַ־
  choice: Передать последовательность самостоятельными предложениями без добавленного причинного союза «поэтому».
  alternative: «Поэтому Я скрыл…»
  rationale: Контекст ясно подразумевает следствие, однако простой союз в еврейском допускает более широкую последовательную связь. Отсутствие добавленного «поэтому» сохраняет эту степень неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены традиционные, но понятные образы «дом Израиля», «скрыть лицо» и «пасть от меча». Божественные местоимения написаны с прописной буквы согласно принятому русскому библейскому оформлению.
