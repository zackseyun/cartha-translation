base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/006.yaml
  text: And I will send fire on Magog and on those who live securely in the coastlands[a], and they will know that I am Yahweh.
translation:
  language: ru
  text: Я пошлю огонь на Магог и на тех, кто живёт в безопасности в приморских землях[a], и они узнают, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на островах». Еврейское слово может обозначать как острова, так и, шире, приморские земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: И пошлю Я
  rationale: Форма глагола в пророческой речи передаёт будущее действие Бога; «пошлю» прямо и естественно сочетается с дополнением «огонь». Постпозиция «Я» сохраняет смысловое ударение на Божественном говорящем без излишней архаизации.
- source_word: אֵשׁ
  choice: огонь
  rationale: Сохранено прямое лексическое значение и образ пророческого суда без пояснительного расширения вроде «кара» или «суд».
- source_word: בְּמָגוֹג
  choice: на Магог
  rationale: Предлог ב при ниспослании губительного огня обозначает цель или место воздействия. «На Магог» сохраняет собственное имя и не добавляет отсутствующего в еврейском тексте слова «земля».
- source_word: וּבְיֹשְׁבֵי
  choice: и на тех, кто живёт
  rationale: Причастная конструкция естественно передана по-русски определительным оборотом; повтор «на» ясно обозначает вторую цель огня.
- source_word: הָאִיִּים
  choice: в приморских землях
  rationale: Еврейское слово может обозначать острова, побережья и отдалённые морские страны. «Приморские земли» естественно передаёт широкий географический смысл в пророческой речи, а более буквальная альтернатива отмечена в сноске.
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: Оборот передаёт состояние защищённости или уверенности в безопасности и синтаксически относится к живущим в приморских землях.
- source_word: וְיָדְעוּ
  choice: и они узнают
  rationale: Сохранена простая последовательность еврейского текста без добавления причинного или временного оттенка; местоимение делает русскую фразу ясной.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Синтаксическая связь לָבֶטַח
  choice: 'относится к жителям приморских земель: «кто живёт в безопасности»'
  alternative: понимать наречие как более свободную характеристику всей ситуации
  rationale: По синтаксису наречное выражение естественнее всего характеризует יֹשְׁבֵי — тех, кто живёт, и описывает их состояние перед судом.
- issue: Характер огня
  choice: сохранён буквальный образ «огонь»
  alternative: пояснить как «огонь суда» или метафорическую кару
  rationale: Стих не уточняет, следует ли понимать огонь буквально или образно; перевод сохраняет эту богословскую и образную открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; архаизмы и конфессионально окрашенные замены устранены.
