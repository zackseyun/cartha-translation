  yaml_path: translation/ot/ezekiel/039/020.yaml
  text: And you will be filled at my table with horse and chariot[a], mighty man and every man of war[b], declares the Lord GOD.
translation:
  language: ru
  text: И вы насытитесь за Моим столом конём и колесницей[a], могучим воином[b] и всяким ратником, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «конём и колесницей»; формы единственного числа, вероятно, имеют собирательное значение и обозначают военные силы и снаряжение.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово можно также перевести как «могучим мужем» или «доблестным воином».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂבַעְתֶּם
  choice: и вы насытитесь
  rationale: Глагол שׂבע означает насыщение пищей; форма второго лица множественного числа обращена к птицам из ближайшего контекста. «Насытитесь» естественно передаёт результат еды и образ жертвенного пира.
- source_word: עַל שֻׁלְחָנִי
  choice: за Моим столом
  rationale: Предлог עַל буквально допускает «на», но по-русски участие в трапезе естественно выражается оборотом «за столом»; образ Божьего стола сохраняется.
- source_word: סוּס וָרֶכֶב
  choice: конём и колесницей
  rationale: Сохранены формы единственного числа масоретского текста и обычное значение רֶכֶב «колесница»; в данном перечне они, вероятно, употреблены собирательно.
- source_word: גִּבּוֹר
  choice: могучим воином
  rationale: גִּבּוֹר обозначает сильного, доблестного человека или воина. «Могучий воин» сохраняет отличие от следующего более общего выражения «человек войны».
- source_word: וְכָל אִישׁ מִלְחָמָה
  choice: и всяким ратником
  rationale: Буквально «и всяким человеком войны». «Всякий ратник» — краткое и понятное обозначение каждого участника войска, при этом не сливается полностью с גִּבּוֹר.
- source_word: נְאֻם
  choice: возвещает
  rationale: Торжественная формула пророческой речи передана современным глаголом, сохраняющим вес божественного заявления.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное заветное имя יהוה, не смешивая два элемента составного титула.
theological_decisions:
- issue: Передача имени יהוה в составном титуле אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Транслитерация «Яхве» ясно передаёт присутствующее в еврейском тексте личное имя, а «Владыка» позволяет отдельно сохранить אֲדֹנָי и избежать сочетания «Господь Господь».
- issue: Предметы пиршества как образ разгромленного войска
  choice: Сохранён буквальный перечень «конём и колесницей, могучим воином и всяким ратником»
  alternative: Обобщить как «конями, колесничими и всеми воинами»
  rationale: Буквальный перечень сохраняет резкость и напряжение образа, а также неоднозначность собирательных форм, не превращая «колесницу» без прямого основания в «колесничего».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Формы единственного числа и различие между גִּבּוֹר и אִישׁ מִלְחָמָה сохранены; умеренно книжное «ратник» помогает избежать тяжёлого повтора слова «воин».
