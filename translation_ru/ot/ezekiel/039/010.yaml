  text: וְ/לֹֽא יִשְׂא֨וּ עֵצִ֜ים מִן הַ/שָּׂדֶ֗ה וְ/לֹ֤א יַחְטְבוּ֙ מִן הַ/יְּעָרִ֔ים כִּ֥י בַ/נֶּ֖שֶׁק יְבַֽעֲרוּ אֵ֑שׁ וְ/שָׁלְל֣וּ אֶת שֹׁלְלֵי/הֶ֗ם וּ/בָֽזְזוּ֙ אֶת בֹּ֣זְזֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/010.yaml
  text: They will not carry wood from the field[a], nor cut it from the forests, because they will make fires with the weapons. They will plunder those who plundered them and loot those who looted them[b], declares the Lord Yahweh.
translation:
  language: ru
  text: Они не будут приносить дров с поля и не станут рубить дрова в лесах, потому что будут разводить огонь оружием[a]. Они отнимут добычу у тех, кто отнимал её у них, и ограбят тех, кто грабил их[b], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оружием будут жечь огонь»; то есть оружие захватчиков послужит топливом.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте дважды повторяются однокоренные слова: они отнимут добычу у отнимавших её у них и ограбят грабивших их. Этот повтор подчёркивает воздаяние и перемену участи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ עֵצִים
  choice: приносить дрова
  rationale: נשא с עֵצִים обозначает перенос или доставку древесины для топлива. «Приносить дрова» естественно передаёт действие и учитывает контекст использования древесины как топлива.
- source_word: מִן הַשָּׂדֶה
  choice: с поля
  rationale: שׂדה стоит в единственном числе с артиклем и буквально означает «с поля»; русский вариант сохраняет конкретность исходного выражения.
- source_word: יַחְטְבוּ מִן הַיְּעָרִים
  choice: рубить их в лесах
  rationale: חטב означает рубить древесину. Местоимение «их» отсылает к дровам, а «в лесах» естественно по-русски передаёт действие, совершаемое в названных еврейским множественным числом лесах.
- source_word: כִּי בַנֶּשֶׁק יְבַעֲרוּ אֵשׁ
  choice: потому что будут разводить огонь оружием
  rationale: כִּי имеет причинное значение, ב инструментально, а נשק обозначает оружие собирательно. Формулировка сохраняет образ оружия, используемого как топливо, не превращая пояснение в основной текст.
- source_word: וְשָׁלְלוּ אֶת שֹׁלְלֵיהֶם
  choice: возьмут добычу у тех, кто брал добычу у них
  rationale: Повтор слова «добыча» передаёт однокоренную конструкцию שלל и подчёркивает обращение прежнего грабежа против самих грабителей.
- source_word: וּבָזְזוּ אֶת בֹּזְזֵיהֶם
  choice: разграбят тех, кто грабил их
  rationale: Однокоренные русские слова отражают повтор корня בזז, а отдельный глагол отличает эту параллельную фразу от предшествующей конструкции с שלל.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передан как формула торжественного пророческого провозглашения; אֲדֹנָי — «Владыка», а личное имя יְהוָה транслитерировано как «Яхве», чтобы не смешивать два следующих друг за другом наименования.
theological_decisions:
- issue: Передача божественного имени в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: Вариант различает титул אֲדֹנָי и личное имя יְהוָה, прямо представленное в еврейском тексте, и избегает неестественного удвоения «Господь».
- issue: Характер воздаяния в двух параллельных фразах
  choice: сохранить обе однокоренные конструкции как риторическое обращение грабежа против грабителей
  alternative: 'обобщить: «они разграбят своих врагов»'
  rationale: Исходный текст намеренно повторяет два разных корня в конструкциях глагол—деятель, подчёркивая воздаяние; обобщение устранило бы эту богословскую и риторическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; архаизмы исключены. Параллелизм и причинная связь исходного текста сохранены.
