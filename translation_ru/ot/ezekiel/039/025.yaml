base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/025.yaml
  text: 'Therefore thus says the Lord GOD: Now I will restore the fortunes of Jacob[a], and I will have compassion on the whole house of Israel[b], and I will be jealous for my holy name.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Теперь Я восстановлю благополучие Иакова[a], смилуюсь над всем домом Израиля и возревную о Моём святом имени[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верну пленников Иакова». Еврейское выражение может относиться непосредственно к возвращению из плена или шире — к восстановлению благополучия народа.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «проявлю рвение ради Моего святого имени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего пророчества, и ясно сохраняет логическую связь.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная и формально прозрачная передача устойчивой пророческой формулы.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное заветное имя יהוה и не смешивает два элемента титула.
- source_word: עַתָּה
  choice: Теперь
  rationale: Обозначает решительный переход к обещанному Божьему действию.
- source_word: אָשִׁיב אֶת שבית יַעֲקֹב
  choice: Я восстановлю благополучие Иакова
  rationale: Еврейское выражение может означать как возвращение из плена, так и более широкое восстановление народа после бедствия; основной текст передаёт более широкий идиоматический смысл.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохраняет употреблённое в источнике имя патриарха и не заменяет его именем «Израиль».
- source_word: וְרִחַמְתִּי
  choice: смилуюсь
  rationale: Кратко и естественно передаёт глубокое сострадание и милость, выраженные корнем רחם.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: всем домом Израиля
  rationale: Сохраняет собирательное заветное выражение «дом Израиля» и полноту, обозначенную כָּל.
- source_word: וְקִנֵּאתִי
  choice: возревную
  rationale: Передаёт сильную Божью ревность и рвение, не сводя значение к греховной зависти; альтернативный оттенок пояснён в сноске.
- source_word: לְשֵׁם קָדְשִׁי
  choice: о Моём святом имени
  rationale: Русское управление «ревновать о» естественно выражает направленность Божьей ревности на защиту святости Его имени.
theological_decisions:
- issue: Передача имени יהוה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Транслитерация сохраняет личное заветное имя, а отдельная передача אֲדֹנָי позволяет не смешивать два элемента исходного титула.
- issue: Значение выражения אֶת שבית יעקב
  choice: восстановлю благополучие Иакова
  alternative: верну пленников Иакова
  rationale: Оборот допускает как узкое указание на возвращение пленных, так и широкое значение восстановления после бедствия. В основном тексте выбран естественный широкий смысл, а более буквальная возможность сохранена в сноске.
- issue: Оттенок Божьей קנאה
  choice: возревную о Моём святом имени
  alternative: проявлю рвение ради Моего святого имени
  rationale: Основной вариант сохраняет заветную силу образа Божьей ревности, а сноска показывает допустимый оттенок ревностного рвения, не устраняя смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для обычного читателя; формула «так говорит» и глагол «возревную» сохраняют возвышенный библейский регистр без излишней архаизации. Прописные местоимения при обращении к Богу следуют принятой русской религиозно-литературной норме.
