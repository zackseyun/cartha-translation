base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/026.yaml
  text: They will bear their shame and all their unfaithfulness by which they were unfaithful to me[a], when they dwell securely on their land with no one to make them afraid.
translation:
  language: ru
  text: И понесут они свой позор и всю свою неверность, проявленную ими против Меня,[a] когда будут жить спокойно на своей земле и никто не будет устрашать их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И забудут они свой позор и всю свою неверность». Некоторые переводы, учитывающие древние версии и контекст, понимают здесь глагол в этом смысле, однако еврейский текст наиболее прямо означает «понесут».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָשׂוּ
  choice: и понесут они
  rationale: Глагол נשׂא прежде всего означает «нести». Такой перевод прозрачно передаёт еврейский текст и сохраняет напряжение между восстановлением народа и сохраняющейся памятью о его прежнем позоре.
- source_word: כְּלִמָּתָם
  choice: свой позор
  rationale: כְּלִמָּה означает позор, стыд или бесчестье. «Позор» естественно сочетается с глаголом «понесут» и указывает как на переживаемый стыд, так и на бесчестье.
- source_word: מַעֲלָם / מָעֲלוּ
  choice: всю свою неверность, которой были неверны
  rationale: Однокоренные существительное и глагол מעל обозначают нарушение верности, особенно в отношениях завета. Повтор корня по возможности сохранён повтором «неверность / неверны».
- source_word: בִי
  choice: Мне
  rationale: При מעל предлог ב обозначает того, по отношению к кому нарушена верность. «Были неверны Мне» естественно по-русски передаёт личностный и заветный характер проступка.
- source_word: בְּשִׁבְתָּם
  choice: когда будут жить
  rationale: 'Инфинитивная конструкция с ב выражает временное обстоятельство: «когда / во время того как они будут жить».'
- source_word: עַל אַדְמָתָם
  choice: на своей земле
  rationale: אֲדָמָה означает землю или почву; «на своей земле» естественно передаёт мысль о возвращении и восстановлении на данной народу земле.
- source_word: לָבֶטַח
  choice: спокойно
  rationale: Наречное выражение описывает жизнь в безопасности, без угрозы. В сочетании с последующей фразой «никто не будет устрашать» слово «спокойно» звучит естественно и избегает тяжёлого повтора идеи безопасности.
- source_word: וְאֵין מַחֲרִיד
  choice: и никто не будет устрашать их
  rationale: Причастие מַחֲרִיד обозначает того, кто приводит в страх. Перевод сохраняет личного или действующего виновника угрозы и форму, близкую к еврейской.
theological_decisions:
- issue: Значение וְנָשׂוּ в контексте восстановления после вины
  choice: Сохранено прямое значение «понесут».
  alternative: «Забудут свой позор и всю свою неверность».
  rationale: 'Еврейский глагол наиболее прямо означает «нести», а не «забывать». Контекст восстановления и отдельные древние версии могли способствовать альтернативному пониманию, однако перевод «понесут» не снимает заложенного в тексте богословского напряжения: восстановленный народ всё ещё несёт позор, связанный с прежней неверностью.'
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохранён достаточно близким к еврейскому, но остаётся понятным. Заглавная буква в «Мне» употреблена как принятая русская графическая форма уважительного обозначения Бога; она не добавляет толкования.
