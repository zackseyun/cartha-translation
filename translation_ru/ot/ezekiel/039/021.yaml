source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִ֑ם וְ/רָא֣וּ כָל הַ/גּוֹיִ֗ם אֶת מִשְׁפָּטִ/י֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/אֶת יָדִ֖/י אֲשֶׁר שַׂ֥מְתִּי בָ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/021.yaml
  text: And I will set my glory among the nations[a], and all the nations will see my judgment that I have executed[b], and my hand that I have laid on them.
translation:
  language: ru
  text: И явлю Мою славу среди народов, и все народы увидят Мой суд[a], который Я совершил, и Мою руку[b], которую Я возложил на них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё правосудие, которое Я осуществил».'
    reason: lexical_alternative
  - marker: b
    text: «Моя рука» — древнееврейский образ деятельной силы Бога; здесь речь особенно о Его действии в суде.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: явлю
  rationale: Глагол נתן буквально означает «дать, поместить, установить», но в сочетании со «славой среди народов» по-русски естественнее передать смысл как публичное явление Божьей славы.
- source_word: כְּבוֹדִי
  choice: Мою славу
  rationale: כבוד обозначает славу, честь и величие; здесь речь о величии Бога, которое становится видимым через Его деяния.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גוים в данном контексте означает совокупность чужеземных народов; «среди народов» естественно и не вносит более поздних смысловых оттенков слова «язычники».
- source_word: וְרָאוּ כָל־הַגּוֹיִם
  choice: и все народы увидят
  rationale: Пророческая последовательность передана современным русским будущим временем.
- source_word: מִשְׁפָּטִי
  choice: Мой суд
  rationale: משפט может означать суд, правосудие или судебное решение; контекст указывает на совершённое Богом судебное действие, при этом слово «суд» сохраняет исходную смысловую широту.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: который Я совершил
  rationale: עשה буквально означает «делать, совершать»; по-русски «совершить суд» сохраняет судебный смысл без лишнего уточнения.
- source_word: יָדִי
  choice: Мою руку
  rationale: Буквальный образ руки сохранён как выразительная древнееврейская метафора деятельной силы Бога.
- source_word: אֲשֶׁר שַׂמְתִּי בָהֶם
  choice: которую Я возложил на них
  rationale: שׂים с существительным «рука» и предлогом ב передаёт наложение руки на кого-либо, здесь — в контексте суда; «возложил на них» сохраняет образ исходного текста.
theological_decisions:
- issue: Значение Божьей «славы» среди народов
  choice: Явленное народам величие Бога, обнаруживающееся в Его судебных деяниях
  alternative: Только Божья честь как отвлечённое понятие
  rationale: В ближайшем контексте народы видят совершённый Богом суд и Его руку, поэтому слава представлена как исторически явленная, а не только отвлечённая честь.
- issue: Смысл выражения «Моя рука»
  choice: Метафора деятельной силы Бога в суде, сохранённая буквально
  alternative: Заменить образ прямым словом «сила»
  rationale: Сохранение слова «рука» передаёт выразительность и богословскую насыщенность еврейского образа, а контекст и примечание поясняют его судебный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок частей и образы оригинала сохранены, однако неестественное буквальное «помещу Мою славу» передано смысловым «явлю Мою славу». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
