  text: וְ/אֶת שֵׁ֨ם קָדְשִׁ֜/י אוֹדִ֗יעַ בְּ/תוֹךְ֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/לֹֽא אַחֵ֥ל אֶת שֵׁם קָדְשִׁ֖/י ע֑וֹד וְ/יָדְע֤וּ הַ/גּוֹיִם֙ כִּי אֲנִ֣י יְהוָ֔ה קָד֖וֹשׁ בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/007.yaml
  text: And I will make my holy name known in the midst of my people Israel[a], and I will no longer let my holy name be profaned; and the nations will know that I am Yahweh[b], the Holy One in Israel.
translation:
  language: ru
  text: «Я открою Моё святое имя среди Моего народа Израиля и больше не позволю бесчестить Моё святое имя[a]. И узнают народы, что Я — Яхве, Святой в Израиле[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее также возможно: «больше не буду бесчестить Моё святое имя». Еврейский глагол допускает такую передачу, хотя в данном контексте, вероятно, имеется в виду, что Бог больше не позволит бесчестить Своё имя.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «что Я, Яхве, свят в Израиле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם קָדְשִׁי
  choice: Моё святое имя
  rationale: Идиоматическая конструкция означает святое имя Бога — Его открытое людям имя и связанную с ним славу и репутацию.
- source_word: אוֹדִיעַ
  choice: Я открою
  rationale: Каузативная форма ידע означает «сделаю известным». Русское «открою» естественно передаёт это значение и сохраняет прямой объект «Моё святое имя».
- source_word: בְּתוֹךְ עַמִּי יִשְׂרָאֵל
  choice: среди Моего народа Израиля
  rationale: «Среди» естественно передаёт присутствие внутри сообщества; «Моего народа Израиля» сохраняет компактное приложение исходного текста.
- source_word: אַחֵל
  choice: не позволю бесчестить
  rationale: Hiphil от חלל допускает как прямое «оскверню», так и разрешительно-каузативное значение «позволю осквернять». Контекст оправдания Божьего имени поддерживает последнее; более буквальная форма отмечена в сноске.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: В данном контексте речь идёт о народах вообще, поэтому «народы» точнее, чем конфессионально окрашенное «язычники».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его функцию в исходном тексте, не заменяя титулом «Господь».
- source_word: קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: Святой в Израиле
  rationale: Субстантивированное «Святой» естественно по-русски передаёт возможное титульное прочтение, а оборот «в Израиле» сохраняет пространственно-реляционную формулировку еврейского текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит собственное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Значение וְלֹא אַחֵל אֶת שֵׁם קָדְשִׁי עוֹד
  choice: больше не позволю бесчестить Моё святое имя
  alternative: больше не буду бесчестить Моё святое имя
  rationale: Грамматическая форма допускает прямое и разрешительно-каузативное понимание. В контексте Иезекииля речь идёт о прекращении поругания Божьего имени, однако формальная неоднозначность сохранена в сноске.
- issue: Синтаксис קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: Яхве, Святой в Израиле
  alternative: Я, Яхве, свят в Израиле
  rationale: Еврейский текст допускает титульное и предикативное прочтение. Основной текст использует естественное титульное выражение, а сноска сохраняет предикативную возможность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской религиозной издательской нормой; синтаксис остаётся ясным и не архаизированным.
