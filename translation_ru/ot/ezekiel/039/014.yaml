  verdict: revise
  source_fidelity: Начальное «И постоянно будут назначать людей» переносит значение תָּמִיד на действие назначения, как если бы людей назначали вновь и вновь. В еврейском אַנְשֵׁי תָמִיד характеризует выделенных людей как людей постоянного, продолжающегося поручения. Повтор עבר в «проходили / проходивших» и намеренно трудная идентификация погребаемых в целом сохранены. «По прошествии семи месяцев» верно передаёт временной рубеж, а «тщательные поиски» — חקר.
  naturalness: Предлагаемая правка делает первое предложение более естественным и устраняет двусмысленность о постоянном повторении назначений. «На поверхности земли» формально возможно, но в современном русском несколько тяжеловесно; «на земле» в данном контексте ясно означает на поверхности почвы.
  terminology: «Очистить» удачно сохраняет как практическую, так и ритуальную сторону טהר, не сужая смысла. «Страна» для אָרֶץ уместна. Формулировку о постоянном поручении следует вынести в основной текст и согласовать со сноской.
