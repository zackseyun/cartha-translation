  text: וְ/אַנְשֵׁ֨י תָמִ֤יד יַבְדִּ֨ילוּ֙ עֹבְרִ֣ים בָּ/אָ֔רֶץ מְקַבְּרִ֣ים אֶת הָ/עֹבְרִ֗ים אֶת הַ/נּוֹתָרִ֛ים עַל פְּנֵ֥י הָ/אָ֖רֶץ לְ/טַֽהֲרָ֑/הּ מִ/קְצֵ֥ה שִׁבְעָֽה חֳדָשִׁ֖ים יַחְקֹֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/014.yaml
  text: And they will set apart men continually[a], who will pass through the land burying those who pass through, those left on the surface of the land, to cleanse it[c][b]. At the end of seven months they will make a search.
translation:
  language: ru
  text: И назначат людей для постоянного дела[a], чтобы они проходили по стране и хоронили проходивших[b] — тех, кто остался на земле, — дабы очистить её. По прошествии семи месяцев они приступят к тщательным поискам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «людей постоянства»; то есть людей, выделенных для постоянного дела.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте повторён глагол «проходить»: назначенные люди проходят по стране и хоронят «проходивших». Выражение трудно для истолкования; по контексту речь идёт о мёртвых, оставшихся лежать в стране.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «станут тщательно разыскивать»; также возможно: «будут обследовать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי תָמִיד
  choice: постоянно ... людей
  rationale: Сочетание буквально означает «людей постоянства» и указывает на непрерывный характер поручения; наречное «постоянно» естественно передаёт это в русском контексте.
- source_word: יַבְדִּילוּ
  choice: будут назначать
  rationale: Hiphil от בדל означает «отделять, выделять». В данном административном контексте речь идёт о выделении людей для особого дела, что по-русски естественно выражается глаголом «назначать».
- source_word: עֹבְרִים בָּאָרֶץ
  choice: чтобы они проходили по стране
  rationale: Причастие от עבר обозначает движение по всей стране; придаточное цели ясно выражает назначение выделенных людей.
- source_word: מְקַבְּרִים
  choice: хоронили
  rationale: Причастие от קבר обозначает сопутствующую задачу людей, обходящих страну.
- source_word: הָעֹבְרִים
  choice: проходивших
  rationale: Повтор корня עבר сохранён вслед за предшествующим «проходили». Формулировка трудна и, вероятно, относится к мёртвым, оставшимся после нашествия, но перевод не устраняет исходную неоднозначность.
- source_word: הַנּוֹתָרִים עַל פְּנֵי הָאָרֶץ
  choice: тех, кто остался на поверхности земли
  rationale: Сохраняет пояснительное приложение и передаёт тела как оставшиеся непогребёнными на земле, не расширяя אֶרֶץ до значения всего мира.
- source_word: לְטַהֲרָהּ
  choice: дабы очистить её
  rationale: «Очистить» сохраняет одновременно практический и ритуальный смысл устранения осквернения страны трупами.
- source_word: מִקְצֵה שִׁבְעָה חֳדָשִׁים
  choice: по прошествии семи месяцев
  rationale: Передаёт временную точку, с которой начинается последующий организованный поиск.
- source_word: יַחְקֹרוּ
  choice: приступят к тщательным поискам
  rationale: חקר означает тщательно разыскивать или исследовать; перевод передаёт целенаправленный, систематический характер действия.
theological_decisions:
- issue: Характер очищения страны
  choice: «очистить» без уточнения вида очищения
  alternative: только ритуально очистить или только физически убрать останки
  rationale: Погребение тел устраняет и видимое последствие битвы, и связанное с трупами осквернение; исходный текст не сводит действие лишь к одной из этих сторон.
translation_notes:
  register: Современный литературный русский с достоинством пророческого текста. Синтаксис сделан ясным, однако намеренный повтор корня עבר и связанная с ним трудность сохранены и пояснены в сноске. «Страна» употреблено для территории Израиля, а «поверхность земли» — в локальном значении почвы.
