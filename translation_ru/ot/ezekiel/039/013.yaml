base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/013.yaml
  text: All the people of the land will bury them[a], and it will be to their renown on the day I glorify myself[b], declares the Lord GOD.
translation:
  language: ru
  text: Все жители страны будут хоронить их, и это принесёт им честь[a] в день, когда Я прославлюсь[b], — возвещает Господь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это будет им во имя»; то есть принесёт им доброе имя, почёт или известность.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «в день, когда Я буду прославлен» или «в день, когда Я явлю Свою славу».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָבְרוּ
  choice: будет хоронить
  rationale: Форма совершенного вида с союзом в пророческом контексте обозначает будущее действие; единственное число согласовано с собирательным «народ».
- source_word: כָּל עַם הָאָרֶץ
  choice: весь народ этой земли
  rationale: В данном местном контексте речь идёт о населении конкретной земли, а не обо всём человечестве; указательное «этой» естественно передаёт определённость еврейского выражения.
- source_word: וְהָיָה לָהֶם לְשֵׁם
  choice: это принесёт ему славу
  rationale: Буквально «это будет им во имя»; לְשֵׁם — идиома, обозначающая доброе имя, почёт или известность. Местоимение в единственном числе по-русски согласуется с собирательным «народ».
- source_word: יוֹם הִכָּבְדִי
  choice: в день, когда Я явлю Свою славу
  rationale: Нифаль от כבד допускает оттенки «быть прославленным», «прославиться» и явить своё величие. Выбранная формулировка естественна по-русски и передаёт Божье открытое явление славы, не предполагая, что её даёт ему кто-то иной.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передаёт торжественную пророческую формулу. «Владыка» различает אֲדֹנָי и личное имя Бога; «Яхве» прямо передаёт тетраграмматон.
theological_decisions:
- issue: 'Смысл יוֹם הִכָּבְדִי: Бог являет Свою славу или получает прославление'
  choice: в день, когда Я явлю Свою славу
  alternative: в день, когда Я прославлюсь; в день Моего прославления
  rationale: Еврейский нифаль допускает медиально-рефлексивное и пассивное понимание. Основной текст подчёркивает самооткровение Бога, а сноска сохраняет грамматически возможные варианты.
- issue: Передача имени יְהוָה после אֲדֹנָי
  choice: Владыка Яхве
  alternative: Владыка ГОСПОДЬ
  rationale: Транслитерация сохраняет личное заветное имя и не смешивает его с титулом אֲדֹנָי.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Собирательное «народ» последовательно оформлено в единственном числе; архаическая буквальность «будет им во имя» вынесена в сноску.
