source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ הִנָּבֵ֣א עַל גּ֔וֹג וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/001.yaml
  text: 'And you[a], son of man, prophesy against Gog, and say: Thus says the Lord GOD: Behold, I am against you, Gog, prince of Rosh, Meshech, and Tubal.'
translation:
  language: ru
  text: 'А ты, сын человеческий, пророчествуй против Гога и скажи: «Так говорит Владыка Яхве: вот, Я против тебя, Гог, верховный[a] правитель Мешеха и Тувала».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правитель Роша, Мешеха и Тувала». Еврейское слово рош может означать «главный, верховный» или пониматься как собственное имя.'
    reason: Подлинная лексико-синтаксическая неоднозначность слова רֹאשׁ.
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и его литературная связь с остальной книгой; выражение понятно в библейском контексте и не сводится к пояснительному пересказу вроде «смертный».
- source_word: הִנָּבֵא עַל
  choice: пророчествуй против
  rationale: Форма глагола передаёт прямое повеление, а עַל в контексте пророчества о суде указывает на направленность речи против Гога.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Так переданы оба элемента составного божественного титула без неестественного повтора «Господь Господь»; «Владыка» выражает господство, а «Господь» — имя YHWH в принятой русской библейской форме.
- source_word: הִנְנִי אֵלֶיךָ
  choice: вот, Я против тебя
  rationale: «Вот» сохраняет торжественное эмфатическое введение, а сочетание с אֶל в формуле суда естественно означает враждебное выступление Бога против адресата.
- source_word: נְשִׂיא רֹאשׁ
  choice: верховный правитель
  rationale: רֹאשׁ прочитано как нарицательное определение высокого ранга при נְשִׂיא. «Верховный правитель» естественнее для современного русского, чем буквальное «главный князь», и не приписывает Гогу царского титула.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Мешеха и Тувала
  rationale: Имена переданы транслитерацией; родительный падеж выражает отношение правителя к названным народам или землям.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Основной текст следует укоренённой русской библейской передаче имени YHWH как «Господь», одновременно различая два элемента титула. Вариант «Яхве» точнее показывает личное имя, но без заданного общеиздательского правила мог бы нарушить стилистическую последовательность.
- issue: Статус слова רֹאשׁ в выражении נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל
  choice: 'нарицательное обозначение ранга: «верховный правитель Мешеха и Тувала»'
  alternative: 'собственное имя: «правитель Роша, Мешеха и Тувала»'
  rationale: Еврейская конструкция допускает понимание רֹאשׁ как нарицательного слова «глава, главный», определяющего נְשִׂיא. Поскольку чтение «Рош» как географического или этнического имени также имеет давнюю традицию, оно сохранено в примечании, а неоднозначность не скрыта.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся близким к еврейскому, но не допускает неестественных калек. Заглавное «Я» в прямой речи подчёркивает, что говорит Бог, в соответствии с распространённой русской библейской типографикой.
