  source_fidelity: 'Основной смысл передан точно: обращение «сын человеческий», повеление пророчествовать против Гога, формула враждебного выступления и титул Гога сохранены. רֹאשׁ обоснованно передано как нарицательное определение, при этом альтернативное чтение «Рош» вынесено в примечание. Однако יְהוִה в составном титуле следует передать как «Яхве», согласно приведённому английскому аудиторскому решению и его прямо указанной политике передачи тетраграмматона; «Господь» скрывает личное имя.'
