  text: עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה תִּפּ֑וֹל כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/005.yaml
  text: You will fall on the open field[a], for I have spoken[c][b], declares the Lord GOD.
translation:
  language: ru
  text: Ты падёшь в открытом поле[a], ибо Я сказал, — возвещает Владыка Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на поверхности поля»; это выражение означает открытое пространство поля.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское «Владыка Яхве» передаёт אֲדֹנָי יְהוִה; Яхве — личное имя Бога, также традиционно переводимое как «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: в открытом поле
  rationale: Буквально «на поверхности поля»; сочетание естественно обозначает открытое, незащищённое пространство. Русское «в открытом поле» передаёт идиоматический смысл без неестественной кальки.
- source_word: תִּפּוֹל
  choice: ты падёшь
  rationale: Форма второго лица мужского рода единственного числа обращена к Гогу. Будущее совершенного вида естественно выражает предсказанное и несомненное падение.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предшествующего приговора; «ибо» сохраняет причинную связь и уместный возвышенный пророческий регистр.
- source_word: דִבַּרְתִּי
  choice: Я сказал
  rationale: Перфект подчёркивает уже произнесённое и потому непреложное Божье слово. В русском «Я сказал» лаконично сохраняет окончательность высказывания, не добавляя отсутствующего в еврейском объектного местоимения.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт формулу авторитетного пророческого изречения современным и торжественным русским языком.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» непосредственно представляет личное Божественное имя יהוה и избегает повтора «Господь Господь».
theological_decisions:
- issue: Передача составного Божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка ГОСПОДЬ
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה. Перевод не подменяет имя общим титулом и одновременно сохраняет господство Бога, выраженное первым словом.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным пророческим звучанием. Синтаксис сохраняет прямое обращение к Гогу и причинное обоснование приговора.
