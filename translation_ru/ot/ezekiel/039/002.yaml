base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/002.yaml
  text: I will turn you around[a], lead you on, bring you up from the far north[b], and bring you against the mountains of Israel.
translation:
  language: ru
  text: Я поверну тебя, поведу дальше[a], подниму тебя с далёкого севера[b] и приведу тебя на горы Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Трудный еврейский глагол некоторые переводы понимают иначе: «оставлю от тебя лишь шестую часть».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «из самых дальних пределов севера».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּיךָ
  choice: Я разверну тебя
  rationale: Каузативное значение от корня שוב передаёт действие Бога, направляющего движение Гога. «Разверну» сохраняет образ изменения направления, не уточняя без достаточных оснований, что это возвращение в прежнее место.
- source_word: וְשִׁשֵּׁאתִיךָ
  choice: поведу дальше
  rationale: Форма трудна для истолкования. Значение продолженного направляемого движения лучше всего соответствует ряду глаголов движения в данном контексте; исторически засвидетельствованное числовое толкование вынесено в примечание.
- source_word: וְהַעֲלִיתִיךָ
  choice: подниму тебя
  rationale: Хифиль глагола עלה обычно означает «поднять, привести наверх». Перевод сохраняет направленность движения и словесный ряд оригинала.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: с далёкого севера
  rationale: Естественное современное выражение передаёт удалённость северной области; более буквальное значение конструкции указано в примечании.
- source_word: וַהֲבִאוֹתִיךָ עַל
  choice: приведу тебя на
  rationale: Предлог עַל после глагола движения буквально указывает движение на горы. Военный контекст подразумевает враждебное вторжение, однако перевод не добавляет этого значения непосредственно в предлог.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: горы Израиля
  rationale: Устойчивое и ясное географическое обозначение, сохраняющее территориальный язык пророчества.
theological_decisions:
- issue: Толкование трудной формы וְשִׁשֵּׁאתִיךָ
  choice: 'Глагол движения: «поведу дальше»'
  alternative: «оставлю от тебя лишь шестую часть»
  rationale: Окружающие глаголы последовательно описывают то, как Бог направляет Гога к горам Израиля. Значение движения лучше сохраняет эту последовательность и не вводит числовую деталь, которая не бесспорно следует из еврейской формы. Значимое традиционное толкование сохранено в примечании.
- issue: Значение עַל при приближении Гога к горам Израиля
  choice: «на горы Израиля»
  alternative: «против гор Израиля»
  rationale: Военный контекст допускает враждебный оттенок, но сам предлог также естественно обозначает движение на указанную местность. Выбранный вариант сохраняет образ вторжения и не делает подразумеваемую враждебность частью лексического значения предлога.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Повторение «тебя» частично сохранено ради ритма и ясности; архаические формы и конфессионально окрашенная терминология не используются.
