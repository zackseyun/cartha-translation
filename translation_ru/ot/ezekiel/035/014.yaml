  yaml_path: translation/ot/ezekiel/035/014.yaml
  text: 'Thus says the Lord GOD: As the whole earth rejoiced[b][a], I will make you desolate.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Когда вся земля будет радоваться[a][b], Я превращу тебя в пустыню».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как вся земля радуется». Еврейская конструкция может пониматься временно («когда») или сравнительно («как»); форма инфинитива сама по себе не указывает времени.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вся страна». Еврейское слово может означать как землю вообще, так и определённую страну или область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула передачи Божьего слова; настоящее время естественно для русского языка и передаёт действующую силу возвещения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и позволяет избежать неестественного сочетания «Господь Господь».
- source_word: כִּשְׂמֹחַ
  choice: Когда … возрадуется
  rationale: Предлог כ с инфинитивом образует обстоятельственную конструкцию, которую здесь естественно понимать как временную; совершенный вид и будущее время согласуются с последующим אֶעֱשֶׂה, однако сама еврейская форма времени не обозначает.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: Сохраняет широкий смысл הָאָרֶץ и привычную пророческую формулировку, не исключая более локального значения «вся страна».
- source_word: שׂמח
  choice: возрадуется
  rationale: Передаёт положительную, возвышенную окраску глагола и создаёт в русском тексте ясный контраст с запустением адресата.
- source_word: שְׁמָמָה אֶעֱשֶׂה לָּךְ
  choice: Я превращу тебя в пустыню
  rationale: Естественно передаёт результативную конструкцию «сделаю тебя запустением» и сохраняет образ опустевшего, разорённого места.
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, не подменяя имя общим титулом и не создавая тавтологии.
- issue: Временное или сравнительное значение כִּשְׂמֹחַ
  choice: Когда вся земля возрадуется
  alternative: В то время как вся земля радуется; по мере того как вся земля радуется
  rationale: Контекст противопоставляет всеобщую радость запустению Едома. Временное прочтение наиболее естественно по-русски, но примечание сохраняет грамматическую неоднозначность конструкции.
translation_notes:
  register: Современный литературный русский язык с торжественностью пророческой речи. Формула «Так говорит» и титул «Владыка Яхве» сохраняют достоинство оригинала; фраза остаётся понятной без архаизмов.
