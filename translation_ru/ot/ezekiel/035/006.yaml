source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי לְ/דָ֥ם אֶעֶשְׂ/ךָ֖ וְ/דָ֣ם יִרְדֲּפֶ֑/ךָ אִם לֹ֥א דָ֛ם שָׂנֵ֖אתָ וְ/דָ֥ם יִרְדֲּפֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/006.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will make you blood, and blood will pursue you. Surely you have not hated blood[b], so blood will pursue you.
translation:
  language: ru
  text: Поэтому, жив Я, — возвещает Владыка Яхве, — Я сделаю тебя кровью[a], и кровь будет преследовать тебя. Ведь ты не возненавидел кровь[b], и кровь будет преследовать тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделаю тебя кровью». Этот резкий образ, вероятно, объединяет значения крови, кровопролития и вины за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: То есть, вероятно, ты не питал отвращения к кровопролитию; еврейский текст буквально повторяет слово «кровь».
    reason: lexical_clarification
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственный переход от предшествующего обвинения к приговору.
- source_word: חַי אָנִי
  choice: жив Я
  rationale: Сохраняет краткую и торжественную формулу божественной клятвы; инверсия уместна в возвышенной пророческой речи.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передано формулой пророческого провозглашения, а личное имя יהוה — как «Яхве»; «Владыка» отличает אֲדֹנָי от имени.
- source_word: לְדָם אֶעֶשְׂךָ
  choice: Я сделаю тебя кровью
  rationale: Намеренно сохранён резкий буквальный образ и повтор דָם, связывающий кровопролитие с последующим воздаянием.
- source_word: דָם
  choice: кровь
  rationale: Единый перевод во всех повторениях сохраняет настойчивую игру слов; в контексте слово может подразумевать также кровопролитие и вину за пролитую кровь.
- source_word: יִרְדֲּפֶךָ
  choice: будет преследовать тебя
  rationale: Точно передаёт образ неотступно настигающего возмездия и позволяет дословно повторить рефрен.
- source_word: אִם לֹא
  choice: Ведь ... не
  rationale: 'В данном контексте сочетание понято как усилительно-причинное, а не как незавершённое условие: последующая погоня крови является воздаянием за отсутствие отвращения к крови.'
- source_word: דָם שָׂנֵאתָ
  choice: ты не возненавидел кровь
  rationale: Сохранено слово «кровь», хотя по смыслу речь, вероятно, идёт о кровопролитии; это удерживает намеренный четырёхкратный повтор.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача «Яхве» сохраняет личное заветное имя, а «Владыка» естественно выражает титул אֲדֹנָי и не смешивает два разных элемента сочетания.
- issue: Связь крови, насилия и воздаяния
  choice: Сохранить «кровь» во всех повторениях
  alternative: В отдельных местах заменить на «кровопролитие»
  rationale: Исходный текст намеренно оставляет напряжение между буквальной кровью, кровопролитием и виной за кровь; единообразный перевод не сводит образ к одному толкованию.
- issue: Синтаксическая функция אִם לֹא
  choice: Причинно-усилительное «Ведь ... не»
  alternative: Условное «Если ты не...» или утвердительное «истинно»
  rationale: Причинное прочтение создаёт связный приговор и соответствует контексту воздаяния, однако частица допускает более формально условный или клятвенный оттенок.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Повтор слова «кровь» и необычный оборот «сделаю тебя кровью» сохранены ради риторической силы и смысловой неоднозначности оригинала.
