  text: I will make Mount Seir a desolation and a waste[a], and I will cut off from it those who pass through and return.
translation:
  language: ru
  text: Я превращу гору Сеир в опустошение и запустение и истреблю из неё всякого, кто проходит и возвращается.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякого проходящего и возвращающегося». Это сочетание может быть меризмом и обозначать всякое движение по этой земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Я превращу
  rationale: В конструкции с לְ и обозначением состояния глагол נתן имеет смысл «сделать, превратить во что-либо»; «превращу» естественно передаёт итоговое изменение.
- source_word: הַר שֵׂעִיר
  choice: гору Сеир
  rationale: Прямое обозначение известной горы или горной области; традиционная русская передача имени — «Сеир».
- source_word: לְשִׁמְמָה וּשְׁמָמָה
  choice: в пустыню и безлюдье
  rationale: 'Два близких по смыслу существительных сохранены раздельно, чтобы передать усиление: разорённость места и отсутствие в нём людей.'
- source_word: וְהִכְרַתִּי
  choice: истреблю
  rationale: Порода hифиль глагола כרת здесь означает устранение людей с данной территории в контексте суда; «истреблю» звучит естественнее русского буквального «отсеку», не уточняя способ гибели.
- source_word: מִמֶּנּוּ
  choice: на ней
  rationale: Местоимение относится к горе Сеир как территории. Русское «на ней» естественно выражает удаление людей с этой земли.
- source_word: עֹבֵר וָשָׁב
  choice: всякого, кто проходит туда и обратно
  rationale: Сочетание причастий буквально описывает проходящего и возвращающегося и, вероятно, служит меризмом для всякого движения по земле; основной текст сохраняет образ передвижения.
theological_decisions:
- issue: Усиленный образ опустошения в паре близких существительных
  choice: 'Сохранить два отдельных понятия: «пустыню и безлюдье».'
  alternative: Свести их к одному усиленному выражению, например «в совершенную пустыню».
  rationale: Раздельная передача отражает риторику еврейского текста и силу Божьего суда, не добавляя нового богословского содержания.
- issue: Объём выражения עֹבֵר וָשָׁב
  choice: Передать как «всякого, кто проходит туда и обратно», сохранив вероятный всеохватный смысл.
  alternative: 'Буквально: «проходящего и возвращающегося»; обобщённо: «всякое движение через неё».'
  rationale: Причастия могут обозначать либо конкретных путников, либо посредством меризма всё движение по территории; сноска сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией пророческого суда. Избегается архаичное буквальное «отсеку», а пара существительных сохраняет выразительное усиление оригинала.
