lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма היה вводит очередное событие повествования; «И было» естественно сохраняет традиционную пророческую формулу и связь с контекстом.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле существительное означает конкретное Божье обращение; «слово» точнее сохраняет исходный образ, чем более пояснительное «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямое и естественное соответствие предлогу с местоименным суффиксом первого лица.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив вводит следующую прямую речь. В современном русском эту функцию естественно и без смысловой потери выражает двоеточие, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Форма «Яхве» передаёт его как имя, тогда как «Господь» заменяет его титулом; «Иегова» основано на более позднем смешанном чтении.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Двоеточие естественно вводит речь следующего стиха.
