  text: יַ֣עַן אֲ֠מָרְ/ךָ אֶת שְׁנֵ֨י הַ/גּוֹיִ֜ם וְ/אֶת שְׁתֵּ֧י הָ/אֲרָצ֛וֹת לִ֥/י תִהְיֶ֖ינָה וִֽ/ירַשְׁנ֑וּ/הָ וַֽ/יהוָ֖ה שָׁ֥ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/010.yaml
  text: Because you said[a], ‘These two nations and these two lands will be mine[b], and we will possess them’—though Yahweh was there—
translation:
  language: ru
  text: 'За то, что ты сказал: «Эти два народа и эти две земли будут моими, и мы овладеем ими», — хотя там был Яхве[a], —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и там был Яхве»; возможно также: «тогда как там был Яхве». Еврейский союз допускает несколько способов связи с предыдущей фразой.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲמָרְךָ
  choice: За то, что ты сказал
  rationale: Оборот вводит основание последующего суда; «за то, что» естественно связывает данное обвинение с приговором в следующем стихе.
- source_word: שְׁנֵי הַגּוֹיִם
  choice: эти два народа
  rationale: Артикль указывает на конкретные народы, известные из контекста; русское «эти» естественно передаёт эту определённость, не называя референтов прямо.
- source_word: שְׁתֵּי הָאֲרָצוֹת
  choice: эти две земли
  rationale: Здесь אֲרָצוֹת обозначает территории; «земли» сохраняет связь народа с его владением и звучит естественнее, чем «страны» в контексте захвата.
- source_word: לִי תִהְיֶינָה
  choice: будут моими
  rationale: Кратко и прямо передаёт притязание Едома на принадлежность обеих земель.
- source_word: וִירַשְׁנוּהָ
  choice: и мы овладеем ими
  rationale: ירשׁ выражает вступление во владение, нередко после вытеснения прежних владельцев. Местоимение в еврейском формально стоит в единственном женском числе и, вероятно, собирательно относится к земле; русское множественное «ими» согласуется с ближайшим выражением «две земли».
- source_word: וַיהוָה שָׁם הָיָה
  choice: хотя там был Яхве
  rationale: 'В контексте союз ו получает уступительно-противительное осмысление: притязание высказано вопреки присутствию Яхве. Порядок слов сохраняет акцент на месте.'
theological_decisions:
- issue: Смысл связи в заключительной фразе וַיהוָה שָׁם הָיָה
  choice: хотя там был Яхве
  alternative: и там был Яхве; тогда как там был Яхве
  rationale: Простой союз допускает сочинительное прочтение, но контекст подчёркивает дерзость притязания Едома, несмотря на присутствие Яхве. Неоднозначность отмечена в сноске.
- issue: Кого обозначают два народа и две земли
  choice: Референты не названы в основном тексте
  alternative: Израиль и Иуда и их территории
  rationale: Контекст позволяет установить исторические референты, однако сам стих их не называет; перевод сохраняет меру эксплицитности оригинала.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация передаёт личное имя, присутствующее в еврейском тексте, и соответствует консультационному слою, не подменяя имя титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «За то, что» рассчитано на синтаксическое продолжение приговора в следующем стихе; конечное тире также сохраняет незавершённость конструкции. Формулировка не называет Израиль и Иуду напрямую и сохраняет неоднозначность заключительного союза.
