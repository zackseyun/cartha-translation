base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/005.yaml
  text: Because you had an everlasting enmity and delivered the sons of Israel over to the power of the sword at the time of their disaster[a], at the time of the punishment of the end[b],
translation:
  language: ru
  text: За то, что ты питала вечную вражду и отдала сынов Израиля во власть меча во время их бедствия[a], во время кары в конце[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Израиля»; то есть израильтян, народ Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «во время последнего беззакония» или «когда вина достигла предела». Еврейское выражение трудно для истолкования и может относиться либо к беззаконию или вине, либо к наказанию за них.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: За то, что
  rationale: Передаёт причинное основание последующего приговора и естественно связывается с контекстом суда.
- source_word: הֱיוֹת לְךָ אֵיבַת עוֹלָם
  choice: ты питала вечную вражду
  rationale: Сохраняет значение длительной, непрекращающейся вражды; женский род относится к горе Сеир, к которой обращена речь.
- source_word: וַתַּגֵּר
  choice: отдала
  rationale: В породе hифиль глагол в данном контексте означает предать, отдать во власть; выбор избегает неясного буквального «излила».
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально сохраняет родственно-корпоративное выражение еврейского текста.
- source_word: עַל יְדֵי חָרֶב
  choice: во власть меча
  rationale: Естественно передаёт образное выражение «в руки меча», то есть под смертоносную силу оружия.
- source_word: בְּעֵת אֵידָם
  choice: во время их бедствия
  rationale: אֵיד обозначает бедствие, несчастье или гибель; «бедствие» ясно и соответствует пророческому контексту.
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: во время последнего воздаяния
  rationale: Сжатая и трудная фраза допускает понимание עָוֹן как вины, беззакония или наказания за него. «Последнее воздаяние» передаёт судебный смысл, не делая русскую фразу неестественной.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; народ Израиля
  rationale: Основной текст сохраняет явную сыновнюю и корпоративную форму оригинала, хотя по смыслу речь идёт обо всём народе.
- issue: Смысл עֲוֺן в выражении בְּעֵת עֲוֺן קֵץ
  choice: воздаяние
  alternative: последнее беззаконие; время, когда вина достигла предела
  rationale: Слово может обозначать как вину или беззаконие, так и последующее наказание. Контекст бедствия и меча поддерживает судебное значение, но подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с торжественным пророческим звучанием. Обращение передано в женском роде, поскольку адресатом в контексте является гора Сеир. Конечная запятая сохранена: стих синтаксически продолжается в следующем стихе.'
