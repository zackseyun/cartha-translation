  text: Вы превозносились против Меня своими устами[a] и умножали слова против Меня[b]. Я Сам слышал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хвалились против Меня»; буквально: «возвеличивали себя против Меня».'
