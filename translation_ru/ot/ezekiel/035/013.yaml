  - marker: b
    text: 'Или: «нагромождали слова против Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגְדִּילוּ
  choice: вы превозносились
  rationale: Порода hифиль от גדל здесь идиоматически описывает самовозвеличивание в дерзкой речи. «Превозносились» сохраняет образ возвышения и естественно звучит по-русски.
- source_word: עָלַי
  choice: надо Мной / против Меня
  rationale: При глаголе самовозвеличивания «надо Мной» передаёт пространственный образ; при словах «против Меня» ясно выражает враждебную направленность речи. Повтор предлога сохранён смысловым повтором.
- source_word: בְּפִיכֶם
  choice: своими устами
  rationale: Конкретный образ еврейского текста сохранён; «устами» соответствует достоинству пророческой речи и образует параллель со «словами».
- source_word: וְהַעְתַּרְתֶּם
  choice: умножали
  rationale: Hифиль от עתר означает делать многочисленным, умножать. Выбор сохраняет формальную образность, не сводя выражение однозначно к «нагромождали».
- source_word: דִּבְרֵיכֶם
  choice: слова
  rationale: Обычное и точное соответствие דבר, уместное для обвинения во враждебной речи.
- source_word: אֲנִי
  choice: Я Сам
  rationale: Отдельное личное местоимение перед глаголом несёт эмфазу; «Я Сам» естественно передаёт её по-русски.
- source_word: שָׁמָעְתִּי
  choice: это слышал
  rationale: Русское прошедшее время точно передаёт перфект в данном контексте. Добавленное указательное «это» естественно отсылает ко всей предшествующей речи, не меняя смысла.
theological_decisions:
- issue: Характер речи, обращённой против Бога
  choice: Прямая речь передана как враждебное самовозвеличивание над Богом и умножение слов против Него.
  alternative: 'Можно передать менее остро: «хвалились передо Мной» или «много говорили обо Мне».'
  rationale: Дважды употреблённое עָלַי в сочетании с самовозвеличиванием и умножением слов указывает не просто на тему речи, а на её дерзкую, противительную направленность. Перевод сохраняет обвинительный смысл, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с сохранением торжественного пророческого регистра. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской издательской традиции. Параллелизм двух обвинений сохранён.
