source:
  edition: WLC
  text: וְֽ/יָדַעְתָּ֮ כִּֽי אֲנִ֣י יְהוָה֒ שָׁמַ֣עְתִּי אֶת כָּל נָאָֽצוֹתֶ֗י/ךָ אֲשֶׁ֥ר אָמַ֛רְתָּ עַל הָרֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֣ר שממה לָ֥/נוּ נִתְּנ֖וּ לְ/אָכְלָֽה־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/012.yaml
  text: Then you will know that I am Yahweh. I have heard all your revilings that you spoke against the mountains of Israel[a], saying, ‘They are desolate; they have been given to us for food.’
translation:
  language: ru
  text: 'И узнаешь, что Я — Яхве. Я слышал все твои поношения[a], которые ты произносил против гор Израиля, говоря: «Они опустошены и отданы нам в пищу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все твои презрительные речи» или «все твои оскорбления».'
    reason: Лексема נָאָצוֹתֶיךָ допускает передачу как презрительных речей, поношений или оскорблений; варианты уточняют диапазон значения.
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: И узнаешь
  rationale: Форма совершенного вида с союзом ו в пророческой речи выражает последующий результат. Русское будущее «узнаешь» естественно передаёт эту направленность, а союз «и» сохраняет связь с контекстом, не усиливая её сверх текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: שָׁמַעְתִּי
  choice: Я слышал
  rationale: Еврейский перфект обозначает уже состоявшееся слышание, имеющее значение для предстоящего суда. В русском языке это естественно выражается совершенным прошедшим временем.
- source_word: נָאָצוֹתֶיךָ
  choice: все твои поношения
  rationale: Слово обозначает презрительные, оскорбительные высказывания. «Поношения» сохраняет тяжесть враждебной речи, не сужая смысл до прямого богохульства.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: против гор Израиля
  rationale: В контексте враждебной речи предлог עַל выражает направленность против объекта, а не просто тему высказывания.
- source_word: שׁממה
  choice: они опустошены
  rationale: Форма сказуемого формально стоит в женском единственном числе, но по смыслу относится к горам или земле Израиля как к собирательному целому. Внутри цитаты русское множественное число естественно соотносится с ближайшим упоминанием гор.
- source_word: נִתְּנוּ לָנוּ לְאָכְלָה
  choice: отданы нам в пищу
  rationale: Сохраняется образ земли и гор, переданных врагу для поглощения; буквальный образ не заменён толкованием вроде «в добычу».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер враждебных слов נָאָצוֹתֶיךָ
  choice: поношения
  alternative: хуления; презрительные речи; оскорбления
  rationale: «Поношения» передаёт презрение и враждебность, но не утверждает однозначно, что речь является прямым богохульством; тем самым сохраняется широта исходного слова.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис остаётся близким к еврейскому, но цитата и согласование оформлены естественно для русского читателя. Метафора «в пищу» сохранена без поясняющей замены.
