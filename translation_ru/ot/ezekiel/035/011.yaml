id: EZK.35.11
reference: Ezekiel 35:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ וְ/עָשִׂ֗יתִי כְּ/אַפְּ/ךָ֙ וּ/כְ/קִנְאָ֣תְ/ךָ֔ אֲשֶׁ֣ר עָשִׂ֔יתָה מִ/שִּׂנְאָתֶ֖י/ךָ בָּ֑/ם וְ/נוֹדַ֥עְתִּי בָ֖/ם כַּ/אֲשֶׁ֥ר אֶשְׁפְּטֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will deal with you according to your anger and according to your jealousy, which you acted out because of your hatred against them; and I will make myself known through them when I judge you.
translation:
  language: ru
  text: Поэтому, жив Я, — возвещает Владыка Яхве, — Я поступлю с тобой сообразно твоему гневу и твоей ревности, которые ты проявил из ненависти к ним. Я открою Себя среди них[a], когда буду судить тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Я стану известен среди них» или «Я открою Себя через них».'
    reason: Нифаль глагола ידע допускает статическое значение «стать известным» и оттенок Божьего самооткровения; предлог בְ может иметь локативный («среди») либо инструментальный («через») оттенок.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и переход от предшествующего обвинения к объявлению его последствия.
- source_word: חַי אָנִי
  choice: жив Я
  rationale: Сохраняет краткую и торжественную форму божественной клятвы; необычный для повседневной речи порядок слов уместен в пророческом изречении.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» естественно передаёт пророческую формулу נְאֻם, а «Владыка Яхве» различает титул אֲדֹנָי и личное имя יְהוִה без сочетания «Господь Господь».
- source_word: וְעָשִׂיתִי
  choice: Я поступлю с тобой
  rationale: В контексте суда глагол עשה обозначает действие Бога по отношению к адресату; дополнение «с тобой» ясно следует из местоименных суффиксов и заключительной фразы.
- source_word: כְאַפְּךָ וּכְקִנְאָתְךָ
  choice: сообразно твоему гневу и твоей ревности
  rationale: Предлог כְ выражает соответствие или меру воздаяния; קִנְאָה в данном враждебном контексте означает ревность как недоброжелательную страсть.
- source_word: אֲשֶׁר עָשִׂיתָה
  choice: которые ты проявил
  rationale: Русское «проявил» естественно сочетается с гневом и ревностью и передаёт воплощение этих чувств в поступках.
- source_word: מִשִּׂנְאָתֶיךָ בָּם
  choice: из ненависти к ним
  rationale: מִן указывает на источник или причину действий, а בָּם при слове «ненависть» естественно передаётся русским «к ним».
- source_word: וְנוֹדַעְתִּי בָם
  choice: Я дам познать Себя среди них
  rationale: Передаёт возможное рефлексивно-каузативное значение нифаля ידע как активное Божье самооткровение; «среди них» сохраняет локативное понимание בָם, а иные допустимые оттенки отмечены в сноске.
- source_word: כַּאֲשֶׁר אֶשְׁפְּטֶךָ
  choice: когда буду судить тебя
  rationale: 'כַּאֲשֶׁר естественно понимается здесь темпорально: Бог будет познан при совершении суда над адресатом.'
theological_decisions:
- issue: Передача имени יְהוִה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Транслитерация «Яхве» сохраняет личное заветное имя, а «Владыка» передаёт отдельный титул אֲדֹנָי и предотвращает неясное повторение титула.
- issue: Значение וְנוֹדַעְתִּי בָם
  choice: Я дам познать Себя среди них
  alternative: Я стану известен среди них / Я дам познать Себя через них
  rationale: Нифаль ידע допускает как значение состояния «стать известным», так и оттенок намеренного самооткровения; предлог בְ может обозначать сферу («среди») либо средство («через»). Основной текст не уточняет механизм сверх необходимого, а подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранена формула клятвы «жив Я», но синтаксис остальной фразы сделан ясным и естественным; длинное еврейское предложение разделено на два русских без утраты логической связи.
