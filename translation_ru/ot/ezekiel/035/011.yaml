  source_fidelity: 'Смысловой ход и адресаты переданы точно: клятвенная формула, соразмерность суда враждебным чувствам, их источник в ненависти к «ним» и последующее Божье самооткровение при суде сохранены. Для וְנוֹדַעְתִּי русское «дам познать Себя» менее удачно: оно неестественно без обозначения того, кому именно будет дано познание, и неоправданно усиливает каузативность Нифаля.'
  naturalness: «Жив Я» и «Владыка Яхве» уместно торжественны. «Я открою Себя среди них» — более естественное современное литературное выражение, сохраняющее активный оттенок самооткровения без добавления нового участника действия.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Ревность» допустима для קִנְאָה в контексте недоброжелательной страсти; контекст не требует замены на более узкое «зависть».
