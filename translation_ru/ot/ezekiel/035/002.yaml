  text: Сын человеческий[a], обрати лицо против горы Сеир и пророчествуй против неё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Смертный, обрати лицо против горы Сеир и пророчествуй против неё».'
