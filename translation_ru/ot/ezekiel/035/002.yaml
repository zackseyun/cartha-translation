lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено устойчивое обращение Бога к Иезекиилю и повторяющийся еврейский образ; современная альтернатива «смертный» вынесена в сноску.
- source_word: שִׂים פָּנֶיךָ
  choice: обрати лицо
  rationale: Передаёт повелительное значение שִׂים и сохраняет конкретный образ лица, оставаясь естественным по-русски.
- source_word: עַל
  choice: против
  rationale: В обоих случаях контекст пророчества о суде придаёт предлогу направленно-враждебный смысл.
- source_word: הַר שֵׂעִיר
  choice: гора Сеир
  rationale: Точно передаёт единственное число и традиционное русское написание географического названия.
- source_word: וְהִנָּבֵא
  choice: и пророчествуй
  rationale: Обычный русский эквивалент глагола נבא, обозначающего пророческое провозглашение.
- source_word: עָלָיו
  choice: против неё
  rationale: Местоимение соотнесено с русским существительным женского рода «гора»; предлог сохраняет направленность пророчества против Сеира.
