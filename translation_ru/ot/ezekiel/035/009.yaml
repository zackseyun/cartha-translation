  text: שִֽׁמְמ֤וֹת עוֹלָם֙ אֶתֶּנְ/ךָ֔ וְ/עָרֶ֖י/ךָ לֹ֣א תישבנה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/009.yaml
  text: I will make you an everlasting desolation[a], and your cities will not be inhabited; then you will know that I am Yahweh.
translation:
  language: ru
  text: Я превращу тебя в вечное запустение[a], и твои города не будут населены. Тогда вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вечными опустошениями»; множественное число может усиливать образ полного разорения. Возможный перевод: «вечные опустошения» или «вечная пустошь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְמוֹת עוֹלָם
  choice: навеки … в пустыню
  rationale: Сочетание обозначает непреходящее опустошение. В русском выражение «превратить в пустыню» естественно передаёт результат разорения, а наречие «навеки» ясно выражает длительность עוֹלָם.
- source_word: אֶתֶּנְךָ
  choice: Я … превращу тебя
  rationale: Буквально глагол означает «дам/сделаю», но в сочетании с обозначением состояния передаёт превращение объекта в это состояние.
- source_word: וְעָרֶיךָ לֹא תישבנה
  choice: и твои города останутся необитаемыми
  rationale: При городах как подлежащем глагол ישׁב означает, что в них не будут жить. «Останутся необитаемыми» естественно передаёт продолжающийся результат суда.
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: Форма второго лица множественного числа сохранена русским «вы», несмотря на предшествующее обращение в единственном числе. «Тогда» передаёт обусловленный итог описанного суда.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Смена числа адресата
  choice: «тебя / твои» в единственном числе и «вы узнаете» во множественном
  alternative: 'Согласовать всё обращение в единственном числе: «ты узнаешь»'
  rationale: Еврейский текст действительно переходит от суффиксов единственного числа к глаголу וִידַעְתֶּם во множественном. Перевод сохраняет эту особенность и не устраняет возможное расширение адресата.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Сохранена неожиданная смена обращения с единственного числа на множественное; местоимение «Я» в формуле самооткровения написано с прописной буквы.
