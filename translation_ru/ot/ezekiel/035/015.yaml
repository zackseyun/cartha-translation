  text: כְּ/שִׂמְחָ֨תְ/ךָ֜ לְ/נַחְלַ֧ת בֵּֽית יִשְׂרָאֵ֛ל עַ֥ל אֲשֶׁר שָׁמֵ֖מָה כֵּ֣ן אֶעֱשֶׂה לָּ֑/ךְ שְׁמָמָ֨ה תִֽהְיֶ֤ה הַר שֵׂעִיר֙ וְ/כָל אֱד֣וֹם כֻּלָּ֔/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/015.yaml
  text: 'As you rejoiced over the inheritance of the house of Israel because it was desolate[a], so I will do to you: desolate you will be, Mount Seir, and all Edom, all of it[b]. Then they will know that I am Yahweh.'
translation:
  language: ru
  text: 'Как ты радовалась тому, что наследие дома Израиля лежало в запустении, так и Я поступлю с тобой: ты, гора Сеир, станешь запустением — и весь Эдом, весь без остатка[a]. И узнают, что Я — Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и весь Эдом, весь он» — усиленное указание на весь Эдом без исключения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשִׂמְחָתְךָ
  choice: Как ты радовалась
  rationale: Сравнительная частица כְּ передаёт соответствие «как… так и», а существительное שִׂמְחָה с суффиксом естественно передано русской глагольной конструкцией. Женский род обусловлен обращением к горе Сеир.
- source_word: לְנַחְלַת בֵּית יִשְׂרָאֵל
  choice: тому, что наследие дома Израиля
  rationale: נַחֲלָה означает «наследие, владение»; предлог לְ обозначает предмет или повод для радости. В сочетании с последующей причинной конструкцией русское «радовалась тому, что…» звучит естественно и точно.
- source_word: עַל אֲשֶׁר שָׁמֵמָה
  choice: было опустошено
  rationale: Конструкция указывает на обстоятельство, вызвавшее радость Эдома. Форма женского рода соотносится с נַחֲלָה; перевод сохраняет состояние разорённой земли, не превращая его в предсказание.
- source_word: כֵּן אֶעֱשֶׂה לָּךְ
  choice: так и Я поступлю с тобой
  rationale: כֵּן продолжает сравнительную формулу воздаяния, а עשה с לְ естественно передаётся по-русски как «поступить с кем-либо».
- source_word: שְׁמָמָה תִהְיֶה
  choice: ты станешь пустыней
  rationale: שְׁמָמָה — существительное «пустыня, запустение», употреблённое как именная часть сказуемого. «Станешь пустыней» сохраняет его предметно-образную силу и естественно звучит по-русски.
- source_word: הַר שֵׂעִיר
  choice: гора Сеир
  rationale: Обычная русская форма географического названия; женский грамматический род слова «гора» согласуется с еврейским обращением.
- source_word: וְכָל אֱדוֹם כֻּלָּהּ
  choice: и весь Эдом — весь целиком
  rationale: Повтор כָל…כֻּלָּהּ усиливает идею всеохватности. Повтор «весь… весь целиком» сохраняет эту эмфазу.
- source_word: וְיָדְעוּ
  choice: И узнают
  rationale: Союз וְ сохранён без явного подлежащего, как и в еврейском тексте. Множественное число допускает обобщённое понимание и не навязывает конкретного референта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано принятой современной транслитерацией «Яхве», а не заменено титулом.
- issue: Неуказанное подлежащее וְיָדְעוּ
  choice: И узнают
  alternative: И они узнают; и все узнают
  rationale: Еврейский текст содержит глагол во множественном числе без явно названного подлежащего. Безлично-неопределённая русская конструкция сохраняет эту открытость и не добавляет «все».
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Сравнительная формула воздаяния сохранена; обращение к горе Сеир передано в женском роде. Лексика остаётся понятной широкому читателю без конфессионально окрашенных добавлений.
