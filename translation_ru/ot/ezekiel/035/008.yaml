  text: וּ/מִלֵּאתִ֥י אֶת הָרָ֖י/ו חֲלָלָ֑י/ו גִּבְעוֹתֶ֤י/ךָ וְ/גֵאוֹתֶ֨י/ךָ֙ וְ/כָל אֲפִיקֶ֔י/ךָ חַלְלֵי חֶ֖רֶב יִפְּל֥וּ בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/008.yaml
  text: And I will fill its mountains with its slain; on your hills[a], in your valleys, and in all your ravines, those slain by the sword will fall.
translation:
  language: ru
  text: И наполню его горы убитыми; на твоих холмах, в твоих долинах и во всех твоих ущельях падут сражённые мечом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «падут в них», то есть на только что названных холмах, в долинах и ущельях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתִי
  choice: И наполню
  rationale: Перфект с союзом в пророческой речи естественно передаёт твёрдо объявленное будущее; начальное «И» сохраняет связь с предыдущим высказыванием.
- source_word: הָרָיו
  choice: его горы
  rationale: Суффикс 3-го лица ед. числа относится к Сеиру как к земле, тогда как далее текст непосредственно обращается к нему во 2-м лице; смена лица сохранена.
- source_word: חֲלָלָיו
  choice: убитыми
  rationale: חָלָל обозначает павших от насильственной смерти, особенно в бою; «убитыми» сохраняет военный смысл и естественно сочетается с глаголом «наполню».
- source_word: גִּבְעוֹתֶיךָ
  choice: на твоих холмах
  rationale: Обычное топографическое значение — «холмы»; культовый оттенок «высот» здесь не требуется.
- source_word: גֵאוֹתֶיךָ
  choice: в твоих долинах
  rationale: В ряду топографических объектов слово уместно понимать как обозначение долин или низин; это значение сохраняет связное описание местности.
- source_word: אֲפִיקֶיךָ
  choice: во всех твоих ущельях
  rationale: Слово может обозначать русла, лощины или ущелья; «ущелья» ясно передаёт элемент рельефа и не создаёт обязательного представления о текущей воде.
- source_word: חַלְלֵי חֶרֶב
  choice: сражённые мечом
  rationale: Так передаётся насильственная смерть от меча без тяжеловесного буквального оборота «убитые меча».
- source_word: יִפְּלוּ בָהֶם
  choice: падут … [в них]
  rationale: Глагол передан как «падут», а местоименная отсылка בָהֶם разъяснена в сноске, поскольку перечисленные места уже обозначены предложными оборотами.
