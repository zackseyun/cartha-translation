  text: וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י אֵלֶ֖י/ךָ הַר שֵׂעִ֑יר וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/ךָ שְׁמָמָ֥ה וּ/מְשַׁמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/003.yaml
  text: 'and say to it[a], ‘Thus says the Lord GOD: Behold, I am against you, Mount Seir, and I will stretch out my hand against you and make you a desolation and a waste.’'
translation:
  language: ru
  text: 'и скажи ей: «Так говорит Владыка Яхве: вот, Я против тебя, гора Сеир! Я простру руку Мою против тебя и превращу тебя в пустошь и запустение[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…и предмет ужаса». Второе существительное может обозначать разорение, вызывающее ужас или изумление.'
    reason: Лексическое значение וּמְשַׁמָּה допускает как «запустение», так и результат разорения, вызывающий ужас или изумление.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт и титул אֲדֹנָי, и личное имя Бога יהוה, избегая неестественного сочетания «Господь ГОСПОДЬ».
- source_word: הִנְנִי אֵלֶיךָ
  choice: вот, Я — против тебя
  rationale: В контексте суда сочетание выражает решительное враждебное выступление; «вот» сохраняет торжественную пророческую силу הִנְנִי.
- source_word: הַר שֵׂעִיר
  choice: гора Сеир
  rationale: Географическое название сохранено в принятой русской форме; обращение к горе поддерживает олицетворение.
- source_word: וְנָטִיתִי יָדִי עָלֶיךָ
  choice: Я простру руку Мою против тебя
  rationale: Сохранена образность устойчивой формулы Божьего суда и её карательная направленность.
- source_word: וּנְתַתִּיךָ
  choice: превращу тебя
  rationale: В сочетании с последующими существительными глагол означает приведение объекта в названное состояние.
- source_word: שְׁמָמָה
  choice: пустыню
  rationale: Передаёт конкретный образ опустошённой, необитаемой земли и естественно звучит по-русски.
- source_word: וּמְשַׁמָּה
  choice: и место запустения
  rationale: Сохраняет второй, усиливающий член еврейской пары, не сливая оба существительных в одно.
- source_word: וְאָמַרְתָּ לּוֹ
  choice: и скажи ей
  rationale: Местоимение согласовано по-русски с существительным женского рода «гора»; прямое обращение сохраняет олицетворение.
theological_decisions:
- issue: Передача составного божественного именования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул и собственное имя, прямо присутствующее в еврейском тексте, не добавляя конфессионального толкования.
- issue: Характер Божьего действия в выражении הִנְנִי אֵלֶיךָ
  choice: Я — против тебя
  alternative: Я выступаю против тебя
  rationale: Краткая формулировка сохраняет непосредственность и напряжённость приговора, не уточняя способ или время выступления сверх текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Формы «простру» и «руку Мою» сохраняют возвышенный библейский регистр, оставаясь понятными; прямая речь и обращение к горе передают олицетворение.
