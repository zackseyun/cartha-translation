source:
  edition: WLC
  text: עָרֶ֨י/ךָ֙ חָרְבָּ֣ה אָשִׂ֔ים וְ/אַתָּ֖ה שְׁמָמָ֣ה תִֽהְיֶ֑ה וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/004.yaml
  text: I will make your cities ruins[a], and you will become a desolation; then you will know that I am Yahweh.
translation:
  language: ru
  text: Твои города Я превращу в развалины, а ты станешь пустыней; и тогда узнаешь, что Я — Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH) — личное имя Бога; традиционно переводится «Господь».
    reason: Указывает на исходную форму и традиционный вариант передачи божественного имени.
lexical_decisions:
- source_word: עָרֶיךָ
  choice: твои города
  rationale: Форма множественного числа עִיר с суффиксом 2-го лица мужского рода единственного числа обозначает города, принадлежащие адресату; это естественная формулировка в пророчестве о суде.
- source_word: חָרְבָּה אָשִׂים
  choice: Я превращу в развалины
  rationale: Сочетание существительного חָרְבָּה с אָשִׂים выражает приведение городов в разрушенное состояние; по-русски «превращу в развалины» передаёт это естественно и ясно.
- source_word: וְאַתָּה
  choice: а ты
  rationale: Явно выраженное местоимение подчёркивает адресата и противопоставляет его участь участи городов; союз «а» естественно передаёт этот оттенок.
- source_word: שְׁמָמָה תִהְיֶה
  choice: станешь пустыней
  rationale: שְׁמָמָה — существительное со значением опустошённого, безлюдного места; «станешь пустыней» сохраняет именную образность и значение перехода в новое состояние.
- source_word: וְיָדַעְתָּ
  choice: и тогда узнаешь
  rationale: Форма означает «и ты узнаешь»; «тогда» естественно выявляет подразумеваемое следствие суда, не устраняя связь, выраженную союзом וְ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя, а не титул; «Яхве» позволяет читателю увидеть это, тогда как традиционное «Господь» может быть указано в примечании.
- issue: Формула узнавания כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  alternative: что Я Господь
  rationale: Сохранена характерная для Иезекииля формула самооткровения без добавления богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прямой и ритмичный; образ «станешь пустыней» сохранён, чтобы не сводить существительное שְׁמָמָה к менее выразительному прилагательному.
