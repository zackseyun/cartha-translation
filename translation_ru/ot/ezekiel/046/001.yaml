source:
  edition: WLC
  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ שַׁ֜עַר הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ הַ/פֹּנֶ֣ה קָדִ֔ים יִהְיֶ֣ה סָג֔וּר שֵׁ֖שֶׁת יְמֵ֣י הַֽ/מַּעֲשֶׂ֑ה וּ/בְ/י֤וֹם הַ/שַּׁבָּת֙ יִפָּתֵ֔חַ וּ/בְ/י֥וֹם הַ/חֹ֖דֶשׁ יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/001.yaml
  text: 'Thus says the Lord GOD: The gate of the inner court that faces east shall be shut during the six working days[a], but on the Sabbath day it shall be opened, and on the day of the new moon it shall be opened.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Ворота внутреннего двора, обращённые на восток, должны быть закрыты в течение шести рабочих дней, но в день субботы их следует открыть, и в день новолуния[a] их также следует открыть».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в день ежемесячного празднования новолуния.
    reason: 'Культурная справка: в данном храмовом календарном контексте «новолуние» обозначает установленный день богослужения.'
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула пророческой речи, естественная для современного литературного русского языка и сохраняющая торжественный регистр.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт титул אֲדֹנָי и личное имя יהוה, не смешивая тетраграмматон со словом אֱלֹהִים («Бог») и избегая неестественного сочетания «Господь Господь».
- source_word: שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: ворота внутреннего двора
  rationale: Конструктивная цепочка обозначает ворота, принадлежащие внутреннему храмовому двору. Русское «ворота» обычно употребляется во множественном числе, хотя в еврейском стоит единственное число.
- source_word: הַפֹּנֶה קָדִים
  choice: обращённые на восток
  rationale: Причастный оборот описывает направление ворот; грамматическое число согласовано с русским словом «ворота».
- source_word: יִהְיֶה סָגוּר
  choice: должны быть закрыты
  rationale: Сочетание היה с предикативным прилагательным выражает предписанное устойчивое состояние; «должны» передаёт нормативный характер храмового установления.
- source_word: שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה
  choice: в течение шести рабочих дней
  rationale: Фраза обозначает шесть обычных дней труда в противопоставлении субботе.
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: но в день субботы
  rationale: Союз передан как «но», поскольку здесь выражено явное противопоставление закрытым рабочим дням.
- source_word: יִפָּתֵחַ
  choice: их следует открыть
  rationale: Нифаль глагола פתח имеет пассивное значение. Безлично-нормативная конструкция естественна по-русски и сохраняет смысл предписания; местоимение согласовано с «ворота».
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: и в день новолуния
  rationale: В календарно-культовом контексте חֹדֶשׁ обозначает новолуние и связанное с ним ежемесячное празднование, а не просто месяц.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: В основном тексте сохранено различие между титулом אֲדֹנָי и личным именем יהוה. Традиционный вариант «Владыка Господь» возможен, но заменяет имя титулом и делает структуру еврейского выражения менее явной.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим вступлением и ясным нормативным синтаксисом. Кавычки отделяют прямую речь. Маркер сноски поставлен непосредственно после «новолуния», к которому относится пояснение.
