base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/014.yaml
  text: And you shall prepare with it[a], morning by morning, a grain offering of a sixth of an ephah, and a third of a hin of oil to moisten the fine flour—a grain offering to Yahweh[c][b], a perpetual statute continually.
translation:
  language: ru
  text: 'И вместе с ним[a] каждое утро приготовляй хлебное приношение: шестую часть ефы и треть гина масла для увлажнения[b] тонкой муки — хлебное приношение Яхве. Это вечное установление, которое следует соблюдать постоянно[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «для него» или «на нём». Вероятнее всего, местоимение относится к ежедневному ягнёнку или всесожжению, упомянутому в предыдущем стихе: хлебное приношение приносится вместе с ним.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «смешать тонкую муку». Редкий еврейский глагол, по-видимому, означает смачивать муку маслом.'
    reason: lexical_alternative
  - marker: c
    text: Евр. «вечные установления, постоянно». Формула подчёркивает непреходящий и регулярный характер предписания.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָה
  choice: И ... хлебное приношение
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из муки или зерна; «хлебное приношение» — ясный и укоренённый в русском библейском языке эквивалент.
- source_word: תַעֲשֶׂה
  choice: приготавливай
  rationale: Форма второго лица мужского рода единственного числа сохранена; в предписании о жертве глагол עשה естественно передаётся как «приготавливать».
- source_word: עָלָיו
  choice: вместе с ним
  rationale: Местоименный суффикс, вероятнее всего, отсылает к ежедневному всесожжению или ягнёнку из предыдущего стиха; перевод передаёт сопутствующий характер приношения, не сводя предлог к пространственному значению.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: каждое утро
  rationale: Повтор существительного имеет распределительное значение. Русское «каждое утро» естественно передаёт регулярность действия.
- source_word: שִׁשִּׁית הָאֵיפָה
  choice: шестую часть ефы
  rationale: Сохранена древняя единица меры и точная доля без добавления отсутствующего в этой фразе существительного.
- source_word: וְשֶׁמֶן שְׁלִישִׁית הַהִין
  choice: и треть гина масла
  rationale: Передана точная мера масла; порядок слов сделан естественным для современного русского языка.
- source_word: לָרֹס
  choice: чтобы увлажнить
  rationale: Редкий глагол רוס указывает на смачивание муки маслом; «увлажнить» не привносит более сильного значения полного смешивания.
- source_word: אֶת־הַסֹּלֶת
  choice: тонкую муку
  rationale: סֹלֶת — мука тонкого помола, предназначенная для приношений; выбран прозрачный современный эквивалент.
- source_word: מִנְחָה לַיהוָה
  choice: хлебное приношение Яхве
  rationale: Повтор מִנְחָה сохранён как риторическое уточнение, а личное имя יהוה передано как «Яхве».
- source_word: חֻקּוֹת עוֹלָם תָּמִיד
  choice: вечное установление, исполняемое постоянно
  rationale: Формулировка передаёт совокупный акцент древнееврейской фразы на непреходящем и регулярном характере предписания, оставаясь естественной по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное заветное имя Бога, а не замещающий титул.
- issue: Отсылка местоимения в עָלָיו
  choice: вместе с ним — с ежедневным ягнёнком или всесожжением предыдущего стиха
  alternative: на нём / для него
  rationale: Контекст поддерживает сопутствующее хлебное приношение, однако грамматика допускает более буквальные отношения, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены древние меры «ефа» и «гин», повтор обозначения хлебного приношения и личное имя «Яхве». Необычная накопительная формула в конце передана естественно, а её буквальная форма отмечена в сноске.
