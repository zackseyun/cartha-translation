  text: וּ/בַ/חַגִּ֣ים וּ/בַ/מּוֹעֲדִ֗ים תִּהְיֶ֤ה הַ/מִּנְחָה֙ אֵיפָ֤ה לַ/פָּר֙ וְ/אֵיפָ֣ה לָ/אַ֔יִל וְ/לַ/כְּבָשִׂ֖ים מַתַּ֣ת יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/011.yaml
  text: At the festivals and the appointed times[a], the grain offering shall be one ephah for the bull and one ephah for the ram, and for the lambs as much as he is able to give, with a hin of oil to each ephah.
translation:
  language: ru
  text: В праздники и в установленные сроки приношение из зерна должно составлять одну ефу на быка и одну ефу на барана, а на ягнят — сколько он в состоянии дать[a]; масла же — один гин на каждую ефу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дар его руки», то есть сообразно тому, сколько он может дать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחַגִּים
  choice: В праздники
  rationale: חַגִּים обозначает культовые праздники; выбран естественный современный русский эквивалент.
- source_word: וּבַמּוֹעֲדִים
  choice: и в установленные сроки
  rationale: מוֹעֲדִים — назначенные календарные времена; перевод сохраняет отличие от חַגִּים и не сводит оба слова к «праздникам».
- source_word: תִּהְיֶה הַמִּנְחָה
  choice: приношение из зерна должно составлять
  rationale: В данном жертвенном контексте מִנְחָה означает приношение из зерна; формулировка понятна современному читателю и связана с последующей мерой объёма.
- source_word: אֵיפָה
  choice: одну ефу
  rationale: אֵיפָה — мера сухих продуктов; числительное естественно передаёт предписанное количество.
- source_word: לַפָּר
  choice: на быка
  rationale: פַּר означает жертвенного быка; предлог «на» естественно выражает норму приношения в расчёте на животное.
- source_word: וְאֵיפָה לָאַיִל
  choice: и одну ефу на барана
  rationale: Сохранены мера и параллельное построение еврейского предписания.
- source_word: וְלַכְּבָשִׂים מַתַּת יָדוֹ
  choice: а на ягнят — сколько он в состоянии дать[a]
  rationale: Буквальное «дар его руки» является идиомой, указывающей на размер дара сообразно возможностям человека; местоимение сохраняет мужской субъект исходного текста.
- source_word: וְשֶׁמֶן הִין לָאֵיפָה
  choice: масла же — один гин на каждую ефу
  rationale: Передано установленное соотношение масла и зерна; «на каждую ефу» ясно выражает распределительный смысл.
theological_decisions: []
