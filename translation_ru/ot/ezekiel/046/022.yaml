base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/022.yaml
  text: In the four corners of the court there were enclosed courts[a], forty long and thirty wide[c][b]; the four of them had the same measurement.
translation:
  language: ru
  text: В четырёх углах двора находились огороженные дворы[a], сорок в длину и тридцать в ширину[b]. Все четыре угловых двора были одинакового размера[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замкнутые дворы» либо «отделённые дворы». Еврейское прилагательное, вероятно, описывает их как обособленные, ограждённые пространства.'
    reason: lexical_alternative
  - marker: b
    text: Единица измерения в еврейском тексте этого стиха не названа; судя по другим размерам храма, подразумеваются локти.
    reason: cultural_note
  - marker: c
    text: Последнее еврейское слово — редкое и трудное для понимания. Вероятно, оно подчёркивает, что речь идёт о четырёх дворах, расположенных по углам.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֹעוֹת
  choice: углах
  rationale: В архитектурном контексте слово обозначает углы или угловые части большого двора; «в углах» естественно передаёт пространственное расположение.
- source_word: חֲצֵרוֹת
  choice: дворы
  rationale: Речь идёт об отдельных дворах внутри более обширного храмового двора. «Дворы» точно и стилистически нейтрально; уменьшительное «дворики» без необходимости добавляло бы оттенок малости.
- source_word: קְטֻרוֹת
  choice: огороженные
  rationale: Редкое прилагательное, вероятно, описывает замкнутые, отделённые оградой пространства. «Огороженные» сохраняет архитектурный смысл, не уточняя материал или устройство ограждения.
- source_word: אַרְבָּעִים אֹרֶךְ וּשְׁלֹשִׁים רֹחַב
  choice: сорок в длину и тридцать в ширину
  rationale: Еврейский текст выражает размеры эллиптически. Русская формулировка естественна и не вставляет в основной текст отсутствующую здесь единицу измерения.
- source_word: מִדָּה אַחַת לְאַרְבַּעְתָּם
  choice: Все четыре ... были одинакового размера
  rationale: Сочетание указывает, что четыре двора имели одни и те же размеры; данная формулировка ясно передаёт их единообразие.
- source_word: מְהֻקְצָעוֹת
  choice: угловых двора
  rationale: Редкая и трудная форма, по-видимому, ещё раз характеризует эти сооружения как расположенные по углам. Перевод сохраняет эту вероятную связь с углами, не навязывая сомнительного буквального значения.
