base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/021.yaml
  text: Then he brought me out to the outer court and led me past the four corners of the court[a], and behold, in each corner of the court there was a court.
translation:
  language: ru
  text: Затем он вывел меня во внешний двор и провёл мимо четырёх углов двора[a]. И вот, в каждом углу двора находился двор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте после упоминания четырёх углов буквально повторяется: «двор в углу двора, двор в углу двора». По смыслу речь идёт о дворе в каждом из четырёх углов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Затем он вывел меня
  rationale: Глагол יצא в породе хифиль с суффиксом 1-го лица означает «вывести». «Затем» естественно передаёт последовательность повествования, выраженную вау-консекутивом.
- source_word: הֶחָצֵר הַחִיצֹנָה
  choice: во внешний двор
  rationale: В описании храмового комплекса חָצֵר естественно передаётся архитектурным термином «двор», а הַחִיצֹנָה — прилагательным «внешний».
- source_word: וַיַּעֲבִירֵנִי
  choice: провёл мимо
  rationale: Хифиль глагола עבר выражает побуждение или сопровождение движения мимо, через либо вдоль чего-либо. «Провёл мимо» сохраняет пространственную динамику, не сводя её к простому прибытию к углам.
- source_word: אַרְבַּעַת מִקְצוֹעֵי הֶחָצֵר
  choice: четырёх углов двора
  rationale: מִקְצוֹעַ обозначает угол или угловую часть сооружения; «угол» — обычный и ясный русский архитектурный эквивалент.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Формула привлекает внимание к увиденному и в современном литературном русском естественно передаётся как «И вот».
- source_word: חָצֵר בְּמִקְצֹעַ הֶחָצֵר חָצֵר בְּמִקְצֹעַ הֶחָצֵר
  choice: в каждом углу двора находился отдельный дворик
  rationale: После прямого упоминания четырёх углов повторённая еврейская формула имеет распределительный смысл. «В каждом углу» ясно передаёт наличие такого помещения во всех четырёх углах; «дворик» помогает различить малые угловые дворы и окружающий внешний двор.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Сохранена формула зрительного внимания «И вот», а буквальный повтор пояснён в сноске, чтобы основной текст оставался ясным.
