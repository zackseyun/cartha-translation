  source_fidelity: Основная передача последовательности движения, «внешнего двора», четырёх углов и распределительного смысла повторенной конструкции верна. Однако «отдельный дворик» добавляет невыраженную в еврейском тексте отдельность и уменьшительный оттенок; חָצֵר здесь следует передать тем же нейтральным словом «двор», что и в остальном описании.
