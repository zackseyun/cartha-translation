id: EZK.46.17
reference: Ezekiel 46:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כִֽי יִתֵּ֨ן מַתָּנָ֜ה מִ/נַּחֲלָת֗/וֹ לְ/אַחַד֙ מֵֽ/עֲבָדָ֔י/ו וְ/הָ֤יְתָה לּ/וֹ֙ עַד שְׁנַ֣ת הַ/דְּר֔וֹר וְ/שָׁבַ֖ת לַ/נָּשִׂ֑יא אַ֚ךְ נַחֲלָת֔/וֹ בָּנָ֖י/ו לָ/הֶ֥ם תִּהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/017.yaml
  text: But if he gives a gift from his inheritance to one of his servants[a], it shall belong to him until the year of liberty; then it shall return to the prince. Only his inheritance belongs to his sons; it shall be theirs.
translation:
  language: ru
  text: Но если он отдаст в дар часть своего наследственного владения одному из своих слуг[b], она будет принадлежать ему до года свободы[a], а затем возвратится князю. Только его наследственное владение принадлежит его сыновьям; оно останется за ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до года освобождения». Вероятно, имеется в виду установленный год возвращения владений, подобный юбилейному году, хотя в еврейском тексте здесь сказано «свобода», а не употреблён обычный термин «юбилей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִתֵּן מַתָּנָה מִנַּחֲלָתוֹ
  choice: Но если он отдаст в дар часть своего наследственного владения
  rationale: 'Условная конструкция противопоставляет этот случай предыдущему постановлению. Предлог מִן допускает партитивный смысл: речь идёт о части наследственного земельного владения, передаваемой в дар.'
- source_word: לְאַחַד מֵעֲבָדָיו
  choice: одному из своих слуг
  rationale: עֶבֶד может означать как слугу, так и раба. В данном имущественно-правовом контексте «слуга» естественно передаёт противопоставление сыновьям, а альтернативное значение отмечено в сноске.
- source_word: וְהָיְתָה לּוֹ
  choice: она будет принадлежать ему
  rationale: Местоимение «она» относится к части владения, отданной в дар; формулировка ясно выражает временное право владения.
- source_word: עַד שְׁנַת הַדְּרוֹר
  choice: до года свободы
  rationale: דְּרוֹר буквально обозначает свободу или освобождение. Перевод сохраняет лексику исходного текста и не подменяет её обычным термином для юбилейного года.
- source_word: וְשָׁבַת לַנָּשִׂיא
  choice: а затем возвратится князю
  rationale: Глагол שׁוב означает возвращение, а נָשִׂיא в храмовом видении Иезекииля последовательно обозначает князя, а не царя.
- source_word: אַךְ נַחֲלָתוֹ בָּנָיו לָהֶם תִּהְיֶה
  choice: Только его наследственное владение принадлежит его сыновьям; оно останется за ними
  rationale: Ограничительное אַךְ подчёркивает отличие постоянного наследственного права сыновей от временного владения слуги. Две части фразы сохраняют еврейский акцент на принадлежности сыновьям.
theological_decisions:
- issue: Социальный статус, обозначенный словом עֶבֶד
  choice: слуг
  alternative: рабов
  rationale: Контекст сосредоточен на различии между временной передачей земли зависимому члену дома и наследованием сыновьями. Основной текст использует широкое значение «слуга», не скрывая более жёсткого возможного значения в сноске.
- issue: Значение דְּרוֹר в установленном году возврата имущества
  choice: год свободы
  alternative: год освобождения; юбилейный год
  rationale: Еврейское слово означает свободу или освобождение. Хотя установление, вероятно, напоминает юбилейное восстановление владений, здесь не употреблён обычный термин יוֹבֵל, поэтому толкование не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с сдержанным юридико-пророческим регистром. «Наследственное владение» передаёт земельно-родовой смысл נַחֲלָה; «князь» сохраняет принятую для данного видения терминологию. Все сноски привязаны к соответствующим словам основного текста.
