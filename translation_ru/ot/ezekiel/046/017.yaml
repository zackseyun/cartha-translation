  source_fidelity: 'Перевод точно передаёт условное постановление: дар из наследственного владения слуге действует до «года свободы», после чего владение возвращается князю; наследственное владение предназначено сыновьям князя. «Наследственное владение» удачно сохраняет земельно-правовой оттенок נַחֲלָה. «Год свободы» следует еврейскому דְּרוֹר и не подменяет его «юбилеем».'
