  text: Then he said to me[b][a], “These are the kitchens where the ministers of the temple shall boil the people's sacrifice.”
translation:
  language: ru
  text: 'И он сказал мне: «Это кухни[a], где служители храма[b] будут варить жертву народа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом варящих»; также возможно: «помещения для приготовления пищи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «служащие при храме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָי
  choice: И он сказал мне
  rationale: Последовательная форма с וַ продолжает повествование; русское «И» естественно сохраняет связь с предшествующим описанием.
- source_word: בֵּית הַמְבַשְּׁלִים
  choice: кухни
  rationale: Буквально выражение означает «дом варящих/готовящих», но в архитектурном контексте обозначает предназначенные для приготовления помещения; «кухни» ясно и естественно передаёт их назначение.
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: служители храма
  rationale: מְשָׁרְתֵי указывает на исполняющих официальное служение, а הַבַּיִת в данном видении означает храм, а не обычный дом.
- source_word: יְבַשְּׁלוּ
  choice: будут варить
  rationale: Глагол בשׁל означает варить или готовить пищу; «варить» сохраняет конкретный способ приготовления и связь с названием помещений.
- source_word: זֶבַח הָעָם
  choice: жертвы народа
  rationale: זֶבַח обозначает закланную жертву, а сочетание с הָעָם — жертвы, приносимые народом. Русское множественное число естественно для совокупности жертв, которые там готовили.
- source_word: שָׁם
  choice: где
  rationale: Буквальное «там» естественно передаётся относительным «где» после указания на помещения.
