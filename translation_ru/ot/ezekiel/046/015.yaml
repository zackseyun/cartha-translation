  text: ו/עשו אֶת הַ/כֶּ֧בֶשׂ וְ/אֶת הַ/מִּנְחָ֛ה וְ/אֶת הַ/שֶּׁ֖מֶן בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר עוֹלַ֖ת תָּמִֽיד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/015.yaml
  text: They shall provide the lamb, the grain offering, and the oil, morning by morning, as a regular burnt offering.
translation:
  language: ru
  text: Каждое утро пусть приносят ягнёнка, хлебное приношение и масло как постоянное всесожжение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: пусть приносят
  rationale: В культовом контексте глагол «делать» естественно передаётся как «приносить»; форма сохраняет предписывающий оттенок еврейского перфекта с вавом.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: Обозначает приношение из зерновых продуктов; традиционное «хлебное приношение» понятно и отличает его от животной жертвы.
- source_word: בַבֹּקֶר בַּבֹּקֶר
  choice: каждое утро
  rationale: 'Повтор существительного выражает регулярность: буквально «утро за утром».'
- source_word: עֹלַת תָּמִיד
  choice: постоянное всесожжение
  rationale: עֹלָה — жертва, целиком сжигаемая на жертвеннике; תָּמִיד указывает на регулярно совершаемое, постоянное приношение.
theological_decisions:
- issue: Связь ягнёнка, хлебного приношения и масла с עֹלַת תָּמִיד
  choice: «как постоянное всесожжение»
  alternative: «для постоянного всесожжения»
  rationale: Предлог в исходном тексте перед словосочетанием отсутствует. «Как» естественно отражает предикативное приложение, не утверждая сверх текста, что все перечисленные элементы сами являются сжигаемой животной жертвой.
translation_notes:
  register: Современный литературный русский с сохранением принятой библейской культовой терминологии. Формулировка краткая, предписывающая и пригодная для публичного чтения.
