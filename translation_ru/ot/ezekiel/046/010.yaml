base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/010.yaml
  text: And the prince shall be among them[a]; when they enter, he shall enter, and when they go out[b], he shall go out.
translation:
  language: ru
  text: 'Князь будет среди них[a]: при их входе он войдёт, а при их выходе они выйдут[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посреди них».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте последний глагол стоит во множественном числе: «они выйдут». По контексту некоторые переводы передают смысл так: «он выйдет вместе с ними».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: князь
  rationale: В Иезекииля 40–48 это устойчивое обозначение гражданского правителя, участвующего в храмовом порядке. «Князь» сохраняет особый титул, не приписывая ему прямо ни царского, ни мессианского статуса.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Естественно передаёт буквальное «в их среде, посреди них» и подчёркивает, что князь находится вместе с народом.
- source_word: בְּבוֹאָם
  choice: при их входе
  rationale: Предлог с инфинитивом и местоименным суффиксом выражает временное обстоятельство. Такая формулировка близка к структуре еврейского текста и естественна по-русски.
- source_word: יָבֹוא
  choice: он войдёт
  rationale: Форма единственного числа относится к князю; будущее время уместно передаёт предписываемый порядок действий.
- source_word: וּבְצֵאתָם
  choice: а при их выходе
  rationale: Сохраняет параллелизм с «при их входе» и точно передаёт временную конструкцию.
- source_word: יֵצֵאוּ
  choice: они выйдут
  rationale: Масоретский текст имеет форму третьего лица множественного числа. Перевод сохраняет это число, не исправляя его молча на ожидаемое по контексту единственное число.
theological_decisions:
- issue: Статус князя в храмовом видении Иезекииля
  choice: Сохранить титул «князь» без отождествления этого лица с Мессией или царём.
  alternative: Передать как «правитель» или истолковать как мессианский титул.
  rationale: Стих регулирует передвижение князя вместе с поклоняющимися, но сам по себе не определяет его окончательную богословскую идентичность.
- issue: Число последнего глагола
  choice: 'Передать форму множественного числа: «они выйдут».'
  alternative: 'Передать по предполагаемому контексту: «он выйдёт [с ними]».'
  rationale: Хотя параллелизм позволяет ожидать действия князя, засвидетельствованный еврейский текст имеет множественное число. Сохранение этой формы уважает текстовую неоднозначность и не устраняет напряжение толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Параллельные обороты «при их входе… при их выходе» сохраняют строй исходного текста; местоимения явно отражают смену числа в еврейских глаголах.
