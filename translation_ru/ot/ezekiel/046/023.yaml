lexical_decisions:
- source_word: טוּר
  choice: ряд
  rationale: Существительное обозначает ряд или непрерывный конструктивный пояс вокруг сооружения. «Ряд» сохраняет архитектурную неопределённость и связь с последующим הַטִּירוֹת.
- source_word: סָבִיב ... סָבִיב
  choice: по всему периметру ... по всему периметру
  rationale: Повтор передаёт усиленный пространственный акцент еврейского текста и естественно звучит в современном русском архитектурном описании.
- source_word: בָּהֶם
  choice: в каждой из них
  rationale: Местоимение отсылает к четырём дворам из предыдущего стиха; сочетание с последующей фразой делает распределительный смысл ясным без изменения референта.
- source_word: לְאַרְבַּעְתָּם
  choice: во всех четырёх
  rationale: Передаёт то, что описанная конструкция имелась во всех четырёх дворах.
- source_word: מְבַשְּׁלוֹת
  choice: очаги
  rationale: Форма от בשׁל указывает на приспособления или места для варки и приготовления пищи. В данном храмовом архитектурном контексте «очаги» — краткое и естественное обозначение таких установок.
- source_word: עָשׂוּי
  choice: были устроены
  rationale: Пассивное причастие выражает завершённое устройство конструкции; множественное число по-русски согласовано с «очаги».
- source_word: מִתַּחַת
  choice: под
  rationale: Прямо и естественно передаёт пространственное положение снизу.
- source_word: הַטִּירוֹת
  choice: этими рядами
  rationale: Сохраняет вероятную лексическую и смысловую связь с טוּר, но ввиду неясности точного архитектурного значения варианты отмечены в сноске.
