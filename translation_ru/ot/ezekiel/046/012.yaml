  text: וְ/כִֽי יַעֲשֶׂה֩ הַ/נָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ שְׁלָמִים֮ נְדָבָ֣ה לַֽ/יהוָה֒ וּ/פָ֣תַֽח ל֗/וֹ אֶת הַ/שַּׁ֨עַר֙ הַ/פֹּנֶ֣ה קָדִ֔ים וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו כַּ/אֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/יָצָ֛א וְ/סָגַ֥ר אֶת הַ/שַּׁ֖עַר אַחֲרֵ֥י צֵאתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/012.yaml
  text: But when the prince makes a freewill offering to Yahweh[a], either a burnt offering or peace offerings, the gate that faces east shall be opened for him, and he shall offer his burnt offering and his peace offerings as he does on the Sabbath day. Then he shall go out[b], and after he goes out the gate shall be shut.
translation:
  language: ru
  text: Но если князь совершит добровольное приношение Яхве — всесожжение или мирные жертвы[a], — то для него откроют ворота, обращённые на восток. Он принесёт своё всесожжение и свои мирные жертвы так же, как приносит их в субботний день. Затем он выйдет, и после его выхода ворота закроют[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте глаголы стоят в третьем лице единственного числа, но подлежащее не названо; перевод «откроют… закроют» сохраняет неназванного исполнителя действия.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְכִי
  choice: Но если
  rationale: Вводит особый условный случай в последовательности культовых предписаний; «но если» естественно обозначает переход к добровольному приношению.
- source_word: הַנָּשִׂיא
  choice: князь
  rationale: В храмовых установлениях Иезекииля это титул должностного лица; «князь» сохраняет политико-культовый оттенок, не отождествляя его прямо с царём.
- source_word: נְדָבָה
  choice: добровольный дар
  rationale: Обозначает приношение по добровольному побуждению, а не по установленной обязанности. Сочетание также естественно связывает повторное נְדָבָה с обоими последующими видами жертв.
- source_word: עוֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: שְׁלָמִים
  choice: мирные жертвы
  rationale: Традиционный и узнаваемый эквивалент, сохраняющий связь термина с миром, благополучием и целостностью; возможное значение общения отмечено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно стоящее в еврейском тексте личное имя Бога.
- source_word: וּפָתַח לוֹ
  choice: для него откроют
  rationale: Глагол стоит в третьем лице единственного числа без названного подлежащего. Русская неопределённо-личная конструкция естественно сохраняет неназванного исполнителя.
- source_word: הַשַּׁעַר הַפֹּנֶה קָדִים
  choice: ворота, обращённые на восток
  rationale: Точно и естественно передаёт определительную причастную конструкцию.
- source_word: וְעָשָׂה
  choice: он принесёт
  rationale: В контексте жертвоприношения עשה обозначает совершение или принесение жертвы; «принесёт» идиоматично по-русски.
- source_word: כַּאֲשֶׁר יַעֲשֶׂה בְּיוֹם הַשַּׁבָּת
  choice: так же, как приносит их в субботний день
  rationale: Сопоставляет эту процедуру с уже установленным обычным порядком субботы; настоящее время передаёт регулярность действия.
- source_word: וְיָצָא
  choice: Затем он выйдет
  rationale: Ясно передаёт следующий этап установленной последовательности.
- source_word: וְסָגַר אֶת־הַשַּׁעַר אַחֲרֵי צֵאתוֹ
  choice: и после его выхода ворота закроют
  rationale: Неопределённо-личная конструкция сохраняет отсутствие явно названного исполнителя и звучит естественно в русском предписании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон; форма «Яхве» передаёт личное имя и не заменяет его титулом.
- issue: Значение שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; благодарно-мирные жертвы
  rationale: «Мирные жертвы» сохраняют традиционную широту термина и не сводят его назначение только к общению или благодарению.
translation_notes:
  register: Современный литературный русский язык с достоинством храмово-законодательного контекста. Использованы понятные традиционные термины «князь», «всесожжение» и «мирные жертвы». Неопределённо-личные формы сохраняют синтаксическую неопределённость еврейского текста.
