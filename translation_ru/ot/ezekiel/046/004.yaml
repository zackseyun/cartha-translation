  text: וְ/הָ֣/עֹלָ֔ה אֲשֶׁר יַקְרִ֥ב הַ/נָּשִׂ֖יא לַֽ/יהוָ֑ה בְּ/י֣וֹם הַ/שַּׁבָּ֗ת שִׁשָּׁ֧ה כְבָשִׂ֛ים תְּמִימִ֖ם וְ/אַ֥יִל תָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/004.yaml
  text: And the burnt offering that the prince presents to Yahweh on the Sabbath day shall be six unblemished lambs and one unblemished ram[a].
translation:
  language: ru
  text: А всесожжение, которое правитель принесёт Яхве в субботний день, — шесть ягнят без порока и один баран без порока.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представит»; еврейский глагол в жертвенном употреблении буквально означает «приблизит, поднесёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹלָה
  choice: А всесожжение
  rationale: עֹלָה — обычное обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» — точный и укоренившийся русский термин.
- source_word: אֲשֶׁר יַקְרִב
  choice: которое ... принесёт
  rationale: Hiphil глагола קרב в жертвенном контексте означает поднести или представить жертву; «принесёт» естественно по-русски и сохраняет образ приближения дара.
- source_word: הַנָּשִׂיא
  choice: правитель
  rationale: В храмовом видении Иезекииля נָשִׂיא обозначает гражданского властителя, не обязательно царского сына; «правитель» в современном русском яснее неоднозначного «князь».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает на адресата посвящения, а יהוה передано личным заветным именем «Яхве».
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: в субботний день
  rationale: Формулировка естественна в современном русском и передаёт буквальное временное выражение «в день субботы».
- source_word: שִׁשָּׁה כְבָשִׂים תְּמִימִם
  choice: шесть ягнят без порока
  rationale: כְבָשִׂים в жертвенном перечне указывает на ягнят, а תְּמִימִם — на отсутствие физического изъяна, необходимое для жертвы.
- source_word: וְאַיִל תָּמִים
  choice: и один баран без порока
  rationale: אַיִל означает взрослого барана; «один» уместно добавлено для симметрии счётного перечня, а תָּמִים передано последовательно как «без порока».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит тетраграмматон; личное имя «Яхве» сохраняет различие между именем Бога и титулом.
- issue: Статус הַנָּשִׂיא
  choice: правитель
  alternative: князь
  rationale: Текст называет носителя власти, но не уточняет ни наследственный княжеский титул, ни царское достоинство; нейтральное «правитель» не вносит лишнего определения.
translation_notes:
  register: Современный литературный русский с достоинством культового контекста. Синтаксис близок к еврейскому, но естественен; тире ясно вводит состав всесожжения. Маркер сноски помещён после всего предложения.
