source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה כִּֽי יִתֵּ֨ן הַ/נָּשִׂ֤יא מַתָּנָה֙ לְ/אִ֣ישׁ מִ/בָּנָ֔י/ו נַחֲלָת֥/וֹ הִ֖יא לְ/בָנָ֣י/ו תִּֽהְיֶ֑ה אֲחֻזָּתָ֥/ם הִ֖יא בְּ/נַחֲלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/016.yaml
  text: 'Thus says the Lord GOD: If the prince gives a gift to any one of his sons[a], it is his inheritance[b]; it shall belong to his sons as their property by inheritance.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Если князь даст дар кому-либо из своих сыновей[a], этот дар будет его наследственным уделом и будет принадлежать его сыновьям как их наследственное владение[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужчине из числа своих сыновей»; это выражение означает одного из его сыновей, без уточнения какого именно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как их владение по наследству».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся и естественная для современного русского языка передача пророческой формулы, вводящей прямую речь Бога.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי как титул верховной власти, а «Яхве» сохраняет личное имя יהוה и позволяет избежать неестественного сочетания «Господь Господь».
- source_word: כִּי
  choice: Если
  rationale: В данном законодательном предписании союз вводит условный случай, а не причину.
- source_word: הַנָּשִׂיא
  choice: князь
  rationale: В храмовых установлениях Иезекииля נָשִׂיא служит особым обозначением гражданского правителя; «князь» сохраняет этот контекстуальный титул.
- source_word: מַתָּנָה
  choice: дар
  rationale: Слово обозначает передаваемое в дар имущество; «дар» звучит достойно и уместно в правовом контексте наследования.
- source_word: לְאִישׁ מִבָּנָיו
  choice: кому-либо из своих сыновей
  rationale: Буквально «мужчине из числа своих сыновей»; אִישׁ здесь имеет распределительный смысл и указывает на любого отдельного сына.
- source_word: נַחֲלָתוֹ הִיא
  choice: этот дар будет его наследственным уделом
  rationale: נַחֲלָה обозначает наследуемый удел; добавление «этот дар» естественно восстанавливает в русском подлежащее и не меняет смысла.
- source_word: לְבָנָיו תִּהְיֶה
  choice: будет принадлежать его сыновьям
  rationale: Передаёт будущую принадлежность имущества сыновьям получателя, сохраняя местоименную формулировку оригинала.
- source_word: אֲחֻזָּתָם ... בְּנַחֲלָה
  choice: как их наследственное владение
  rationale: אֲחֻזָּה означает закреплённое имущественное владение, а בְּנַחֲלָה указывает на его наследственный правовой статус.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, сохраняя оба элемента еврейского выражения без неестественного повтора.
- issue: Референт местоимений в נַחֲלָתוֹ и לְבָנָיו
  choice: его наследственным уделом ... его сыновьям
  alternative: уделом получившего дар сына ... сыновьям этого сына
  rationale: По контексту речь, вероятнее всего, идёт о сыне, получившем дар, и его потомках, однако оригинал использует местоимения без поясняющих существительных. Русский текст сохраняет эту форму и не устраняет возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой и правовой речи. Синтаксис сделан ясным для обычного читателя; ключевые термины «князь», «наследственный удел» и «владение» сохраняют характер установления об имущественном наследовании.
