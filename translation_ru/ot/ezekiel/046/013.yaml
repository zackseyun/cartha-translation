  text: וְ/כֶ֨בֶשׂ בֶּן שְׁנָת֜/וֹ תָּמִ֗ים תַּעֲשֶׂ֥ה עוֹלָ֛ה לַ/יּ֖וֹם לַֽ/יהֹוָ֑ה בַּ/בֹּ֥קֶר בַּ/בֹּ֖קֶר תַּעֲשֶׂ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/013.yaml
  text: And you shall offer a year-old male lamb without blemish as a burnt offering to Yahweh daily[a]; morning by morning you shall offer it.
translation:
  language: ru
  text: И каждый день приноси Яхве во всесожжение годовалого барашка без изъяна; приноси его каждое утро.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶבֶשׂ
  choice: ягнёнок
  rationale: Обозначает молодую овцу; в данном жертвенном контексте русское «ягнёнок» естественно и не добавляет грамматически не выраженного уточнения пола.
- source_word: בֶּן שְׁנָתוֹ
  choice: годовалый
  rationale: Еврейская идиома буквально означает «сын своего года» и указывает на животное годовалого возраста.
- source_word: תָּמִים
  choice: без изъяна
  rationale: В жертвенном контексте означает отсутствие физического дефекта; выражение ясно для современного читателя.
- source_word: תַּעֲשֶׂה
  choice: приноси
  rationale: Хотя основной смысл глагола — «делать», в контексте жертвоприношения он означает совершать, то есть приносить жертву.
- source_word: עוֹלָה
  choice: жертва всесожжения
  rationale: Устоявшееся русское обозначение жертвы, полностью сжигаемой на жертвеннике.
- source_word: לַיּוֹם
  choice: каждый день
  rationale: Фраза имеет распределительное временное значение и обозначает ежедневное совершение жертвы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה, не заменяя его титулом.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: каждое утро
  rationale: Удвоение слова «утро» выражает регулярное повторение; «каждое утро» естественно передаёт этот распределительный смысл по-русски.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение относится к ягнёнку и согласуется с ним в русском языке.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит Тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового предписания. Повелительное «приноси» естественно передаёт повторяющееся обязательное действие; точка с запятой сохраняет параллелизм двух частей стиха.
