  rationale: Исправление сохраняет смысл и повелительную форму оригинала, уточняет мужской пол жертвенного животного и заменяет менее удачную конструкцию на общепринятое терминологическое «во всесожжение». Повтор «каждое утро» естественно передаёт распределительное בַּבֹּקֶר בַּבֹּקֶר.
