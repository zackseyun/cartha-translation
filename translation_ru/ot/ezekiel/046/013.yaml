    rationale: «В жертву всесожжения» понятно, но «во всесожжение» — более точная и естественная конструкция для обозначения вида приношения.
  revised_text: И каждый день приноси Яхве во всесожжение годовалого барашка без изъяна; приноси его каждое утро.
