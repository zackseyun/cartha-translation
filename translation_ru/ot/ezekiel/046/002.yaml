  source_fidelity: Перевод в целом точно передаёт порядок действий, титул נָשִׂיא («князь»), жертвенную терминологию и указание, что ворота остаются открытыми до вечера. Однако עַל מִפְתַּן הַשַּׁעַר буквально указывает на поклонение «на/у порога»; «на пороге» точнее сохраняет пространственный образ. Союз וְ перед последней фразой не имеет противительного значения, поэтому «Но» лучше заменить на нейтральное «и».
  naturalness: Текст звучит естественно на современном литературном русском. «Косяк ворот», «притвор ворот», «всесожжение» и «мирные жертвы» уместны в библейско-культовом регистре. Нейтральное соединение последнего предложения делает последовательность более плавной и ближе к оригиналу.
  terminology: «Князь» удачно сохраняет неразрешённый статус נָשִׂיא, не называя его царём или Мессией. «Всесожжение» для עֹלָה и «мирные жертвы» для שְׁלָמִים точны; сноска с вариантом «жертвы общения» оправданна. Архитектурные термины переданы последовательно.
