source:
  edition: WLC
  text: וּ/בָ֣א הַ/נָּשִׂ֡יא דֶּרֶךְ֩ אוּלָ֨ם הַ/שַּׁ֜עַר מִ/ח֗וּץ וְ/עָמַד֙ עַל מְזוּזַ֣ת הַ/שַּׁ֔עַר וְ/עָשׂ֣וּ הַ/כֹּהֲנִ֗ים אֶת עֽוֹלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו וְ/הִֽשְׁתַּחֲוָ֛ה עַל מִפְתַּ֥ן הַ/שַּׁ֖עַר וְ/יָצָ֑א וְ/הַ/שַּׁ֥עַר לֹֽא יִסָּגֵ֖ר עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/002.yaml
  text: And the prince shall enter by way of the porch of the gate from outside[a], and shall stand by the doorpost of the gate. Then the priests shall offer his burnt offering and his peace offerings, and he shall bow down in worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.
translation:
  language: ru
  text: Князь войдёт снаружи через притвор ворот и станет у косяка ворот. Священники принесут его всесожжение и мирные жертвы[a], а он поклонится на пороге ворот и выйдет. И ворота не будут закрыты до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения».'
    reason: Лексема שְׁלָמִים может подчёркивать не только мир и благополучие, но и общение, связанное с совместной жертвенной трапезой.
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: князь
  rationale: В храмовом видении Иезекииля это обозначение признанного правителя, но не обязательно царя; «князь» сохраняет это различие и не навязывает мессианского истолкования.
- source_word: דֶּרֶךְ אוּלָם הַשַּׁעַר מִחוּץ
  choice: снаружи через притвор ворот
  rationale: 'Передаёт путь входа и пространственную последовательность естественным современным русским языком: князь подходит извне и входит через притвор ворот.'
- source_word: מְזוּזַת הַשַּׁעַר
  choice: у косяка ворот
  rationale: מְזוּזָה обозначает боковой косяк или столб дверного проёма; «косяк» сохраняет архитектурную конкретность.
- source_word: וְעָשׂוּ הַכֹּהֲנִים אֶת עֹלָתוֹ
  choice: священники принесут его всесожжение
  rationale: В сочетании с жертвами עָשָׂה означает совершить жертвоприношение; по-русски это естественно передаётся глаголом «принести».
- source_word: שְׁלָמָיו
  choice: его мирные жертвы
  rationale: Традиционное и прямое соответствие для שְׁלָמִים, сохраняющее связь с миром и целостностью; возможный оттенок общения указан в сноске.
- source_word: וְהִשְׁתַּחֲוָה
  choice: он поклонится
  rationale: Глагол выражает телесное преклонение в почитании; в данном культовом контексте «поклонится» естественно передаёт и действие, и религиозный смысл.
- source_word: מִפְתַּן הַשַּׁעַר
  choice: у порога ворот
  rationale: מִפְתָּן означает порог; предлог «у» передаёт положение поклоняющегося при пороге без утверждения, что он находится прямо на нём.
- source_word: לֹא יִסָּגֵר עַד הָעָרֶב
  choice: ворота не будут закрыты до вечера
  rationale: Точно передаёт страдательную форму глагола סגר и временной предел עַד הָעָרֶב.
theological_decisions:
- issue: Личность и статус князя в храмовом видении Иезекииля
  choice: Передать נָשִׂיא словом «князь», не отождествляя его прямо с Мессией и не называя царём.
  alternative: «правитель», «вождь» или истолковывающее «мессианский князь»
  rationale: Сам стих описывает особого участника храмового богослужения с определёнными правами и ограничениями, но не определяет его как Мессию или царствующего царя; перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан ясным и последовательным; сохранены культовые термины «всесожжение» и «мирные жертвы», а архитектурные обозначения переданы конкретно и без излишней архаики.
