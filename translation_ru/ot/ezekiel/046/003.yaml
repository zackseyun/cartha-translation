  text: וְ/הִשְׁתַּחֲו֣וּ עַם הָ/אָ֗רֶץ פֶּ֚תַח הַ/שַּׁ֣עַר הַ/ה֔וּא בַּ/שַּׁבָּת֖וֹת וּ/בֶ/חֳדָשִׁ֑ים לִ/פְנֵ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/003.yaml
  text: And the people of the land shall bow down at the entrance of that gate[a], before Yahweh[b], on the Sabbaths and on the new moons.
translation:
  language: ru
  text: И народ земли[a] будет поклоняться у входа в те ворота пред Яхве[b] по субботам и в новомесячия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Народ земли» здесь, вероятно, обозначает население, не относящееся к священству, в отличие от князя и священников, упоминаемых в ближайшем контексте.
    reason: cultural_note
  - marker: b
    text: Еврейский текст содержит личное имя Бога יהוה (Яхве), традиционно передаваемое в русских переводах словом «Господь».
    reason: translation_note
lexical_decisions:
- source_word: וְהִשְׁתַּחֲווּ
  choice: будет поклоняться
  rationale: Глагол обозначает почтительное преклонение, в данном контексте совершаемое как поклонение Богу. «Будет поклоняться» естественно передаёт культовый смысл, не уточняя без необходимости степень телесного простирания.
- source_word: עַם הָאָרֶץ
  choice: народ этой земли
  rationale: Сохранён конкретный образ еврейского выражения; указательное «этой» делает его естественнее по-русски. В контексте речь, вероятно, идёт о мирянах в отличие от князя и священников, но это толкование вынесено в примечание.
- source_word: פֶּתַח הַשַּׁעַר הַהוּא
  choice: у входа в те ворота
  rationale: פֶּתַח указывает на вход, а הַהוּא отсылает к конкретным воротам, о которых говорится выше. Русское «в те ворота» естественно сочетается со словом «вход» и сохраняет указательную силу.
- source_word: בַּשַּׁבָּתוֹת
  choice: по субботам
  rationale: Множественное число обозначает регулярно повторяющиеся субботние дни; «по субботам» передаёт это естественным современным русским оборотом.
- source_word: וּבֶחֳדָשִׁים
  choice: и в новомесячия
  rationale: В культовом контексте חֹדֶשׁ означает празднование начала нового лунного месяца. «Новомесячия» — краткий и точный русский библейский термин.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי выражает пребывание перед Богом, в Его присутствии, а имя יהוה передано как «Яхве». Форма «пред» сохраняет достоинство культовой речи без архаизации всего предложения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. «Яхве» передаёт его как имя и не заменяет титулом, при этом примечание сообщает традиционную русскую передачу.
- issue: Значение выражения עַם הָאָרֶץ
  choice: народ этой земли
  alternative: простой народ; миряне
  rationale: Основной текст сохраняет неоднозначность социального обозначения. Вероятное противопоставление князю и священникам разъяснено в примечании, а не внесено в перевод.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным культовым регистром. Синтаксис сделан плавным и понятным; формы «пред Яхве» и «новомесячия» сохраняют библейскую торжественность и точность, не перегружая стих архаизмами.
