base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/018.yaml
  text: The prince shall not take any of the people's inheritance[a], thrusting them out of their property. He shall give his sons an inheritance out of his own property, so that my people may not be scattered[b], each man from his property.
translation:
  language: ru
  text: 'Князь не должен отнимать ничего из наследственного удела народа, притесняя их и отнимая у них владения.[a] Своим сыновьям он должен дать наследство из собственного владения, чтобы Мой народ не был рассеян: чтобы каждый не был оторван от своего владения.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «притесняя» можно также перевести как «ущемляя», «обижая» или «обманывая». В данном контексте речь идёт о притеснении посредством лишения земельного владения.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народ Мой — каждый из своего владения»; слово «каждый» употреблено распределительно, то есть относится к отдельным людям в составе народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: князь
  rationale: В книге Иезекииля נָשִׂיא обозначает особого гражданского правителя и отличается от царя; «князь» сохраняет этот контекстуальный оттенок.
- source_word: יִקַּח מִנַּחֲלַת הָעָם
  choice: не должен отнимать ничего из наследственного удела народа
  rationale: Глагол לקח с предлогом מן указывает на изъятие того, что принадлежит народу; «наследственный удел» передаёт земельно-правовой смысл נַחֲלָה.
- source_word: לְהוֹנֹתָם מֵאֲחֻזָּתָם
  choice: притесняя людей и лишая их владений
  rationale: Форма от ינה означает притеснять или ущемлять; в контексте земельных владений притеснение выражается в лишении людей их собственности. Формулировка передаёт и общее значение глагола, и ближайший контекст, не сводя его лишь к обману.
- source_word: מֵאֲחֻזָּתוֹ יַנְחִל אֶת־בָּנָיו
  choice: Своим сыновьям он должен дать наследство из собственного владения
  rationale: Каузативная форма נחל значит «дать в наследство»; повтор «владения» подчёркивает противопоставление собственности князя владениям народа.
- source_word: לֹא יָפֻצוּ
  choice: не был рассеян
  rationale: Пассивная форма פוץ сохраняет образ рассеяния; перевод не уточняет сверх текста, идёт ли речь именно об изгнании или о более общем вытеснении с земли.
- source_word: עַמִּי אִישׁ מֵאֲחֻזָּתוֹ
  choice: народ Мой не был рассеян — каждый из своего владения
  rationale: אִישׁ употреблено дистрибутивно, то есть применительно к каждому представителю народа. Тире позволяет сохранить сжатую еврейскую конструкцию и её связь с образом рассеяния.
theological_decisions:
- issue: Дистрибутивное мужское единственное число אִישׁ
  choice: каждый
  alternative: никто; каждый человек
  rationale: «Каждый» сохраняет дистрибутивное значение и грамматическое единственное число, не ограничивая смысл только взрослыми мужчинами и не добавляя отсутствующего существительного.
- issue: Характер рассеяния народа
  choice: не был рассеян — каждый из своего владения
  alternative: не был изгнан каждый из своего владения
  rationale: Основное значение פוץ — «рассеивать». Хотя контекст предполагает насильственное лишение земли, перевод сохраняет исходный образ и не заменяет его более узким толкованием «изгонять».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридико-земельные термины «наследственный удел» и «владение» сохранены последовательно; сжатая заключительная конструкция оригинала передана с помощью тире.
