  yaml_path: translation/ot/ezekiel/046/005.yaml
  text: And the grain offering shall be an ephah with the ram[a], and with the lambs a grain offering as much as his hand can give[b], and a hin of oil with each ephah.
translation:
  language: ru
  text: Хлебное приношение к барану[a] — одна эфа, а к ягнятам — столько хлебного приношения, сколько он может дать[b]; масла же — один гин на каждую эфу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для барана»; еврейский предлог в предписаниях о жертвах может обозначать как сопутствие, так и предназначение. То же относится и к словам «к ягнятам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дар его руки» — идиома, означающая меру того, что человек в состоянии дать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В контексте жертвоприношений слово обозначает приношение из зерна или муки; традиционное и понятное русское соответствие «хлебное приношение» не сводит его к обычному дару.
- source_word: אֵיפָה
  choice: эфа
  rationale: Название древней меры сыпучих тел сохранено транслитерацией ради точности культового предписания.
- source_word: לָאַיִל / לַכְּבָשִׂים
  choice: при баране / при ягнятах
  rationale: Предлог ל связывает количество хлебного приношения с соответствующими жертвенными животными. «При» естественно выражает сопутствие, сохраняя возможность понимания как предназначения.
- source_word: מַתַּת יָדוֹ
  choice: сколько он может дать
  rationale: Буквально «дар его руки»; идиома указывает на меру возможностей дающего. Перевод передаёт смысл ясным современным русским языком, а буквальный образ отмечен в сноске.
- source_word: שֶׁמֶן
  choice: масло
  rationale: Обычное соответствие в жертвенном контексте; уточнение вида масла в данном стихе отсутствует.
- source_word: הִין
  choice: гин
  rationale: Название древней меры жидкостей сохранено транслитерацией.
- source_word: לָאֵיפָה
  choice: на каждую эфу
  rationale: Выражает соотношение количества масла и хлебного приношения; «на каждую эфу» естественно передаёт распределительное значение.
theological_decisions:
- issue: Значение предлога ל при названиях жертвенных животных
  choice: при баране / при ягнятах
  alternative: для барана / для ягнят
  rationale: Еврейский предлог допускает как связь-сопутствие, так и предназначение. Основной текст использует нейтральное «при», а альтернативное понимание сохранено в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного культового текста. Синтаксис сделан компактным и ясным; древние единицы меры сохранены как «эфа» и «гин». Все сноски имеют маркеры в основном тексте.
