base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/019.yaml
  text: Then he brought me through the entrance that was beside the gate to the holy chambers for the priests[a], which faced north; and behold, there was a place there at their far western end.
translation:
  language: ru
  text: Затем он провёл меня через вход, находившийся сбоку от ворот, к священным помещениям для священников, обращённым на север. И вот, там, в их дальней западной части[a], было место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в их дальней (или задней) части, к западу».'
    reason: Слово יַרְכָּה может обозначать дальнюю, внутреннюю или заднюю часть, а יָמָּה буквально выражает направление «к морю», то есть на запад.
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Затем он провёл меня
  rationale: Форма wayyiqtol от בוא в каузативном значении продолжает последовательное повествование; «провёл меня» естественно передаёт движение под руководством проводника.
- source_word: בַמָּבוֹא
  choice: через вход
  rationale: מָבוֹא обозначает вход или проход; предлог ב в контексте направляемого движения допускает значение пути через этот вход.
- source_word: אֲשֶׁר עַל כֶּתֶף הַשַּׁעַר
  choice: находившийся сбоку от ворот
  rationale: כֶּתֶף буквально означает «плечо», а в архитектурном описании — боковую сторону; русский оборот передаёт пространственное отношение без неясного буквализма.
- source_word: אֶל הַלִּשְׁכוֹת הַקֹּדֶשׁ אֶל הַכֹּהֲנִים
  choice: к священным помещениям для священников
  rationale: לִשְׁכָּה — храмовое помещение или комната; повторное אֶל выражает связь помещений со священниками, для которых они предназначены.
- source_word: הַפֹּנוֹת צָפוֹנָה
  choice: обращённым на север
  rationale: Причастие פנה с направительным צָפוֹנָה описывает ориентацию помещений; согласование сохранено с ближайшим множественным существительным.
- source_word: וְהִנֵּה שָׁם מָקוֹם
  choice: И вот, там … было место
  rationale: הִנֵּה привлекает внимание к увиденному и сохранено как «вот», что соответствует визионерскому повествованию Иезекииля.
- source_word: בְּיַרְכְתָם יָמָּה
  choice: у их дальнего западного конца
  rationale: Суффикс 3-го лица множественного числа в יַרְכְתָם явно отсылает к помещениям; יָמָּה задаёт западное направление. Основной текст передаёт вероятный архитектурный смысл, а сноска сохраняет образную и пространственную неоднозначность יַרְכָּה.
