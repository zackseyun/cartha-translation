  text: וּ/בְ/ב֖וֹא הַ/נָּשִׂ֑יא דֶּ֣רֶךְ אוּלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/בְ/דַרְכּ֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/008.yaml
  text: When the prince enters[a], he shall enter by way of the porch of the gate, and he shall go out by the same way.
translation:
  language: ru
  text: Когда князь входит, пусть он входит через притвор ворот и выходит тем же путём[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и своим путём выйдет»; по контексту — тем же путём, которым вошёл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבוֹא
  choice: Когда … входит
  rationale: Сочетание союза и предлога с инфинитивом בוא имеет здесь временное значение; современная русская конструкция ясно передаёт его без тяжеловесного буквализма.
- source_word: הַנָּשִׂיא
  choice: князь
  rationale: В храмовом видении Иезекииля נָשִׂיא обозначает особого гражданского правителя, но сам стих не называет его царём; «князь» сохраняет традиционный и достаточно нейтральный смысл.
- source_word: דֶּרֶךְ אוּלָם הַשַּׁעַר
  choice: через притвор ворот
  rationale: דֶּרֶךְ указывает на путь движения, а אוּלָם — на притвор или вестибюль ворот; «через притвор ворот» естественно передаёт пространственное указание по-русски.
- source_word: יָבוֹא … יֵצֵא
  choice: он должен войти … и выйти
  rationale: Имперфекты в данном контексте выражают установленный порядок действий. Конструкция с «должен» передаёт предписывающую силу, не превращая стих в прямую повелительную речь.
- source_word: וּבְדַרְכּוֹ
  choice: тем же путём
  rationale: Буквально выражение означает «своим путём», но в контексте притяжательный суффикс отсылает к только что названному пути входа. Основной текст передаёт контекстуальный смысл, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Кем является הַנָּשִׂיא в храмовом видении Иезекииля
  choice: Нейтральное «князь» без уточнения его мессианского или царского статуса
  alternative: «правитель»; истолкование как мессианского князя
  rationale: В данном стихе говорится лишь о порядке входа и выхода князя. Текст не требует разрешать более широкий вопрос о его личности, поэтому перевод не вводит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, с умеренно официальным оттенком, подходящим для храмового предписания. Архитектурный термин «притвор» сохранён как понятный и устоявшийся.
