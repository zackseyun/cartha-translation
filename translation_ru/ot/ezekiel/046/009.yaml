  text: וּ/בְ/ב֨וֹא עַם הָ/אָ֜רֶץ לִ/פְנֵ֣י יְהוָה֮ בַּ/מּֽוֹעֲדִים֒ הַ/בָּ֡א דֶּרֶךְ שַׁ֨עַר צָפ֜וֹן לְ/הִֽשְׁתַּחֲוֺ֗ת יֵצֵא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב וְ/הַ/בָּא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב יֵצֵ֖א דֶּרֶךְ שַׁ֣עַר צָפ֑וֹנָ/ה לֹ֣א יָשׁ֗וּב דֶּ֤רֶךְ הַ/שַּׁ֨עַר֙ אֲשֶׁר בָּ֣א ב֔/וֹ כִּ֥י נִכְח֖/וֹ יצאו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/009.yaml
  text: And when the people of the land come before Yahweh at the appointed times[a], whoever enters by way of the north gate to worship shall go out by way of the south gate, and whoever enters by way of the south gate shall go out by way of the north gate. He shall not return by way of the gate through which he entered[c][b], but shall go out straight ahead.
translation:
  language: ru
  text: Когда народ земли приходит перед Яхве в установленные времена[a], тот, кто входит через северные ворота, чтобы поклониться[b], должен выйти через южные ворота, а тот, кто входит через южные ворота, должен выйти через северные. Он не должен возвращаться через ворота, которыми вошёл, ибо должен выйти прямо перед собой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в установленные праздники»; также возможно: «в праздничные дни».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы склониться» или «пасть ниц».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ибо напротив него (или: этого) они выйдут». В конце фразы еврейский текст переходит от единственного числа к множественному. Смысл предписания, по-видимому, в том, чтобы продолжить путь к противоположному выходу, а не возвращаться через те же ворота.'
    reason: textual_and_lexical_clarification
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: народ земли
  rationale: Формально передаёт храмовый термин, обозначающий всё население в отличие от князя и священников, не сужая его до значения «простолюдины».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет личное имя Яхве и культовый смысл пребывания или явления в Божьем присутствии.
- source_word: בַּמּוֹעֲדִים
  choice: в установленные времена
  rationale: 'Сохраняет диапазон значения מוֹעֵד: назначенное время и связанное с ним праздничное собрание.'
- source_word: הַבָּא ... לְהִשְׁתַּחֲוֺת
  choice: тот, кто входит ... чтобы поклониться
  rationale: Причастие выражает общее правило, а «поклониться» сохраняет как значение почитания, так и телесный жест преклонения.
- source_word: דֶּרֶךְ שַׁעַר צָפוֹן / דֶּרֶךְ שַׁעַר נֶגֶב
  choice: через северные ворота / через южные ворота
  rationale: Естественно передаёт указанный путь движения через противоположные храмовые ворота.
- source_word: יֵצֵא
  choice: должен выйти
  rationale: Имперфект в контексте храмового предписания имеет нормативную силу; «должен» ясно выражает обязательность правила.
- source_word: לֹא יָשׁוּב
  choice: не должен возвращаться
  rationale: Прямо передаёт запрет возвращаться прежним путём.
- source_word: אֲשֶׁר בָּא בוֹ
  choice: которыми вошёл
  rationale: Естественная русская относительная конструкция, где множественное «ворота» требует согласования во множественном числе.
- source_word: כִּי נִכְחוֹ יֵצֵאוּ
  choice: но должен выйти прямо вперёд
  rationale: Передаёт практический смысл движения к противоположному выходу. Смена на множественное число в еврейском тексте понимается как возвращение к собирательному множеству приходящих и отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон; форма «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Характер поклонения в לְהִשְׁתַּחֲוֺת
  choice: поклониться
  alternative: пасть ниц; совершить поклонение
  rationale: Выбранное слово не разделяет искусственно внешний жест и его культовое значение; буквальная телесная сторона указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового установления. Синтаксис сделан ясным для обычного читателя; термин «народ земли» сохранён как значимый для контекста Иезекииля. Подлинная неоднозначность מוֹעֵד и נִכְחוֹ, а также смена грамматического числа отмечены в сносках.
