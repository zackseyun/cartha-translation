base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/007.yaml
  text: And he shall provide as a grain offering an ephah for the bull and an ephah for the ram[a], and for the lambs whatever his hand can afford, and a hin of oil with each ephah.
translation:
  language: ru
  text: В хлебное приношение он должен принести по ефе для быка и для барана, а для ягнят — сколько сможет дать[a], и по гину масла на каждую ефу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сколько достигнет его рука», то есть сколько позволяют его средства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפָה
  choice: ефа
  rationale: Сохранено название древнееврейской меры сыпучих тел, поскольку в культовом предписании важна указанная в тексте мера, а её перевод приблизительной современной величиной создал бы ложную точность.
- source_word: פַּר
  choice: бык
  rationale: В сочетании לַפָּר артикль указывает на конкретного жертвенного быка, уже названного в данном предписании; определённость естественно передаётся контекстом.
- source_word: אַיִל
  choice: баран
  rationale: В сочетании לָאַיִל артикль указывает на конкретного жертвенного барана; по-русски определённость понятна из контекста без отдельного показателя.
- source_word: יַעֲשֶׂה מִנְחָה
  choice: в хлебное приношение он должен принести
  rationale: מִנְחָה в жертвенном контексте обозначает хлебное приношение, а יַעֲשֶׂה здесь естественно передаётся как предписание принести установленное количество.
- source_word: כְּבָשִׂים
  choice: ягнята
  rationale: Выбрано обычное русское обозначение жертвенных ягнят без добавления пола, который непосредственно в этой форме не выражен.
- source_word: כַּאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: сколько сможет дать
  rationale: Так естественно передан смысл идиомы о количестве, доступном человеку по его средствам; буквальный образ руки сохранён в сноске.
- source_word: שֶׁמֶן הִין לָאֵיפָה
  choice: по гину масла на каждую ефу
  rationale: 'Формулировка ясно передаёт соотношение: один гин масла на одну ефу хлебного приношения, сохраняя древнюю меру объёма.'
