  yaml_path: translation/ot/ezekiel/046/006.yaml
  text: And on the day of the new moon[a], there shall be an unblemished young bull from the herd, and six lambs and a ram; they shall be unblemished.
translation:
  language: ru
  text: А в день новолуния[a] — молодой бык из стада без изъяна, шесть ягнят и баран; все они должны быть без изъяна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в день месяца»; в данном контексте имеется в виду праздник новолуния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: А в день новолуния
  rationale: Буквально выражение означает «в день месяца», но в данном культовом и календарном контексте обозначает день новолуния.
- source_word: פַּר בֶּן בָּקָר
  choice: молодого быка из стада
  rationale: Устойчивое жертвенное обозначение быка из крупного рогатого скота; перевод сохраняет и возрастную, и видовую определённость без неестественного буквализма «сын крупного скота».
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: В контексте жертвоприношений слово указывает на отсутствие физического порока у животного; «без изъяна» естественно и точно передаёт культовое требование.
- source_word: וְשֵׁשֶׁת כְּבָשִׂים
  choice: шесть ягнят
  rationale: В жертвенном перечне כְּבָשִׂים естественно обозначает ягнят; грамматический мужской род отдельно не выражен, поскольку контекст этого не требует.
- source_word: וָאַיִל
  choice: и барана
  rationale: אַיִל — обычное обозначение взрослого барана в жертвенных перечнях.
- source_word: יִהְיוּ
  choice: все они должны быть
  rationale: Форма множественного числа завершает перечень и предписывает отсутствие изъяна у перечисленных животных; добавление «все» ясно передаёт охват, подразумеваемый конструкцией.
