  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֣ה הַ/מָּק֗וֹם אֲשֶׁ֤ר יְבַשְּׁלוּ שָׁם֙ הַ/כֹּ֣הֲנִ֔ים אֶת הָ/אָשָׁ֖ם וְ/אֶת הַ/חַטָּ֑את אֲשֶׁ֤ר יֹאפוּ֙ אֶת הַ/מִּנְחָ֔ה לְ/בִלְתִּ֥י הוֹצִ֛יא אֶל הֶ/חָצֵ֥ר הַ/חִֽיצוֹנָ֖ה לְ/קַדֵּ֥שׁ אֶת הָ/עָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/020.yaml
  text: Then he said to me[a], “This is the place where the priests shall boil the guilt offering and the sin offering, and where they shall bake the grain offering, so as not to bring them out into the outer court to make the people holy.”
translation:
  language: ru
  text: 'И он сказал мне: «Вот место, где священники будут варить жертву повинности и жертву за грех и где будут печь хлебное приношение, чтобы не выносить их во внешний двор для освящения народа[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для посвящения народа». Еврейский глагол означает «делать святым, освящать»; вероятно, речь идёт об освящении людей вследствие соприкосновения со священными приношениями.'
    reason: Лексическая альтернатива и пояснение культового смысла.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И он сказал мне
  rationale: Последовательное וַיֹּאמֶר продолжает повествование; простой союз «и» естественно сохраняет еврейскую связность.
- source_word: זֶה הַמָּקוֹם
  choice: Вот место
  rationale: Краткая естественная передача указательного оборота, которым обозначается показанное место.
- source_word: יְבַשְּׁלוּ
  choice: будут варить
  rationale: В контексте жертвоприношений глагол обозначает приготовление варкой; это точнее общего «готовить».
- source_word: הָאָשָׁם
  choice: жертва повинности
  rationale: Устойчивое современное обозначение особого вида жертвы за проступок, влекущий виновность и возмещение.
- source_word: הַחַטָּאת
  choice: жертва за грех
  rationale: Передаёт традиционную культовую категорию, не сужая её здесь до одного лишь обряда очищения.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В данном культовом контексте מִנְחָה — приношение из зерновых продуктов; «хлебное приношение» является понятным русским библейским термином и согласуется с глаголом «печь».
- source_word: לְבִלְתִּי הוֹצִיא
  choice: чтобы не выносить их
  rationale: Конструкция выражает предотвращаемое действие; местоимение «их» восполняет подразумеваемый объект — священные приношения.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: на внешний двор
  rationale: Естественное русское обозначение направления движения к внешнему храмовому двору.
- source_word: לְקַדֵּשׁ אֶת הָעָם
  choice: и не освящать народ
  rationale: Сохраняет прямое значение каузативной формы קדש — «делать святым, освящать» — и не устраняет культовую неоднозначность механизма освящения.
theological_decisions:
- issue: Смысл לְקַדֵּשׁ אֶת הָעָם в связи с вынесением святынь
  choice: «и не освящать народ» — предотвращение освящения народа при соприкосновении со священными приношениями
  alternative: «и не посвящать народ» либо понимание как предотвращение недозволенного соприкосновения без акцента на передаче святости
  rationale: В храмовом контексте קדש может обозначать наделение святостью вследствие контакта со святыней. Прямой перевод сохраняет эту культовую логику, не превращая её в позднейшее догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового описания. Синтаксис близок к еврейскому оригиналу, но остаётся естественным; терминология жертвоприношений последовательна и понятна.
