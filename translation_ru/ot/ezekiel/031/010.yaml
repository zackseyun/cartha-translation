base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/010.yaml
  text: 'Therefore thus says the Lord GOD: Because you grew tall in stature[a], and set your top among the thick boughs, and his heart was lifted up in his height,'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка ГОСПОДЬ: «За то, что ты стал высок ростом, поставил свою вершину среди густой листвы[a], и сердце его возгордилось от своей высоты,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди густых ветвей». Возможное контекстуальное понимание: «среди облаков» — как образ чрезвычайной высоты дерева.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Передаёт оба элемента божественного титула и избегает неестественного повтора «Господь ГОСПОДЬ».
- source_word: יַעַן אֲשֶׁר
  choice: За то, что
  rationale: Естественно вводит основание последующего суда и сохраняет незавершённую причинную конструкцию стиха.
- source_word: גָּבַהְתָּ בְּקוֹמָה
  choice: ты вырос высоким
  rationale: Сохраняет образ роста дерева и значение большой высоты без отвлечённого «возвысился».
- source_word: וַיִּתֵּן צַמַּרְתּוֹ
  choice: и поднял свою вершину
  rationale: В контексте дерева צַמֶּרֶת — верхушка или вершина; «поднял» естественно передаёт помещение её высоко.
- source_word: אֶל בֵּין עֲבוֹתִים
  choice: среди густых ветвей
  rationale: עֲבוֹתִים наиболее непосредственно допускает значение густой листвы или переплетённых ветвей; вариант «облаков» сохраняется в сноске как контекстуально возможный.
- source_word: וְרָם לְבָבוֹ
  choice: а сердце его возгордилось
  rationale: Естественный русский эквивалент идиомы о вознесённом сердце, ясно выражающий гордость.
- source_word: בְּגָבְהוֹ
  choice: от его высоты
  rationale: Передаёт причинную связь между достигнутой высотой и гордостью, сохраняя образную связь с деревом.
theological_decisions:
- issue: Смена лица внутри стиха
  choice: Сохранить переход от второго лица («ты», «свою») к третьему («его»).
  alternative: Унифицировать все местоимения во втором или третьем лице.
  rationale: Масоретский текст действительно меняет лицо; сглаживание устранило бы особенность источника и возможное напряжение между прямым обращением и описанием символического дерева.
translation_notes:
