  yaml_path: translation/ot/ezekiel/031/005.yaml
  text: Therefore its height rose above all the trees of the field[a], and its boughs multiplied, and its branches grew long because of abundant waters as it spread out.
translation:
  language: ru
  text: Поэтому оно возвысилось над всеми полевыми деревьями; его сучья умножились, а ветви вытянулись благодаря обилию вод, при том что оно выпускало.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при его выпускании». Что именно выпускало дерево — ветви или побеги — в еврейском тексте не уточняется.'
    reason: Сохранена неопределённость еврейского выражения בְּשַׁלְּחוֹ, в котором объект глагола подразумевается, но не назван.
lexical_decisions:
- source_word: גָּבְהָא קֹמָתוֹ מִכֹּל
  choice: оно стало выше всех
  rationale: Глагол גבה передаёт достижение высоты, а מן образует сравнение; по-русски естественно передать это как «стало выше всех».
- source_word: עֲצֵי הַשָּׂדֶה
  choice: полевых деревьев
  rationale: Буквальное и понятное соответствие устойчивому образу «деревьев поля»; прилагательная форма звучит естественнее в данном сравнении.
- source_word: סַרְעַפֹּתָיו
  choice: сучья его
  rationale: Слово обозначает крупные разветвления дерева; «сучья» позволяет отличить их от следующих פארתו — «ветвей».
- source_word: וַתִּרְבֶּינָה
  choice: умножились
  rationale: Сохраняет значение увеличения числа и возвышенный пророческий регистр, не усложняя смысл.
- source_word: פארתו
  choice: ветви
  rationale: В древесной метафоре это наиболее ясное обозначение вытягивающихся ответвлений; возможные оттенки побегов или лиственных ветвей контекстом не требуют уточнения.
- source_word: וַתֶּאֱרַכְנָה
  choice: вытянулись
  rationale: Передаёт то, что ветви стали длинными, естественным для русского описанием роста дерева.
- source_word: מִמַּיִם רַבִּים
  choice: благодаря обилию воды
  rationale: מן выражает здесь источник или причину роста; формулировка естественно передаёт питающее действие множества вод.
- source_word: בְּשַׁלְּחוֹ
  choice: когда оно разрасталось
  rationale: Глагол буквально говорит о «выпускании» чего-либо, но объект в еврейском тексте не назван. «Разрасталось» сохраняет образ распространения дерева и не вставляет подразумеваемый объект в основной текст.
