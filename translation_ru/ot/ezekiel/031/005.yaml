    issue: «когда оно разрасталось» для בְּשַׁלְּחוֹ
    rationale: Еврейское выражение построено от «посылать/выпускать» при невыраженном объекте. «Разрасталось» передаёт общий результат, но не само действие выпускания и тем самым сглаживает отмеченную в сноске неопределённость.
  - severity: low
    issue: «благодаря обилию воды»
    rationale: מִמַּיִם רַבִּים буквально говорит о множественных/обильных водах. «Благодаря обилию вод» естественнее и ближе к образу оригинала.
  - severity: low
    issue: Порядок слов «сучья его»
    rationale: В современном литературном русском более естественно «его сучья», без изменения смысла.
