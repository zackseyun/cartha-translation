  text: וַ/יְּיִ֣ף בְּ/גָדְל֔/וֹ בְּ/אֹ֖רֶךְ דָּֽלִיּוֹתָ֑י/ו כִּֽי הָיָ֥ה שָׁרְשׁ֖/וֹ אֶל מַ֥יִם רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/007.yaml
  text: So it was beautiful in its greatness[a], in the length of its branches, because its root was by abundant waters.
translation:
  language: ru
  text: И оно было прекрасно своим величием и длиной ветвей, потому что корень его был у обильных вод[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многих вод».'
    reason: Лексически более буквальная передача выражения מַיִם רַבִּים.
lexical_decisions:
- source_word: וַיְּיִף
  choice: оно было прекрасно
  rationale: Форма Qal от יפה описывает красоту и привлекательность дерева; в данном описательном контексте русское «было прекрасно» естественнее, чем «стало прекрасным», хотя последнее возможно по виду повествовательной формы.
- source_word: בְּגָדְלוֹ
  choice: своим величием
  rationale: גדל указывает на величие или внушительные размеры; творительный падеж естественно передаёт признак, которым дерево было прекрасно, сохраняя возвышенный тон.
- source_word: בְּאֹרֶךְ דָּלִיּוֹתָיו
  choice: длиной ветвей
  rationale: Оборот буквально говорит о длине свисающих ветвей; «ветвей» ясно и современно, а параллельный творительный падеж связывает выражение с «своим величием».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину красоты и величия дерева и сохраняет ясную причинную связь.
- source_word: הָיָה שָׁרְשׁוֹ אֶל
  choice: корень его был у
  rationale: Предлог אֶל буквально обозначает направление «к», но здесь выражает расположение корня по отношению к питающим его водам; «был у» передаёт это без добавления идеи активного протягивания.
- source_word: מַיִם רַבִּים
  choice: обильных вод
  rationale: Сочетание буквально допускает «многие воды», но в контексте подчёркивает изобилие водного источника; «обильные воды» звучит естественно и сохраняет образ, а более буквальный вариант дан в сноске.
