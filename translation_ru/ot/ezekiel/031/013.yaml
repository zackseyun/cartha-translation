    text: 'Или: «После его падения» или «на его руинах». Еврейское слово может иметь более отвлечённое значение «падение, гибель»; однако образ срубленного дерева в контексте поддерживает конкретное значение «поваленный ствол».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «на его крупных ветвях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפַּלְתּוֹ
  choice: на его поваленном стволе
  rationale: Существительное от נפל допускает значение падения либо того, что повалено. Образ срубленного дерева в контексте поддерживает конкретный перевод, хотя абстрактное значение сохраняется в сноске.
- source_word: יִשְׁכְּנוּ
  choice: поселятся
  rationale: Глагол שׁכן означает обитать, селиться, располагаться на жительство; «поселятся» естественно передаёт будущую ситуацию и образ птиц, обживших поваленное дерево.
- source_word: עוֹף הַשָּׁמַיִם
  choice: небесные птицы
  rationale: Устойчивое и понятное поэтическое соответствие еврейскому сочетанию, сохраняющее возвышенный пророческий регистр.
- source_word: פֹּארֹתָיו
  choice: его ветвях
  rationale: Слово обозначает крупные, раскидистые ветви дерева. В современном русском «ветви» звучит естественно и достойно; оттенок крупных сучьев отмечен в сноске.
- source_word: הָיוּ
  choice: будут
  rationale: Хотя форма морфологически представляет собой qatal, в параллелизме с יִשְׁכְּנוּ она естественно получает будущую временную отнесённость.
- source_word: חַיַּת הַשָּׂדֶה
  choice: полевые звери
  rationale: Передаёт традиционное библейское сочетание без неоправданного сужения значения; «звери» здесь обозначают наземных животных.
- source_word: עַל ... וְאֶל
  choice: на ... и на
  rationale: Вторая конструкция буквально направительная («к/на»), но при глаголе «быть» и в данном пространственном образе русское «на его ветвях» точно и идиоматично.
