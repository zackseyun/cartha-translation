  text: מַ֣יִם גִּדְּל֔וּ/הוּ תְּה֖וֹם רֹֽמְמָ֑תְ/הוּ אֶת נַהֲרֹתֶ֗י/הָ הֹלֵךְ֙ סְבִיב֣וֹת מַטָּעָ֔/הּ וְ/אֶת תְּעָלֹתֶ֣י/הָ שִׁלְחָ֔ה אֶ֖ל כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/004.yaml
  text: Waters made it grow[a]; the deep made it rise high. Its rivers flowed all around its planting place[b], and it sent out its channels to all the trees of the field.
translation:
  language: ru
  text: Воды взрастили его[a], бездна подняла его ввысь[b]. Её реки текли вокруг места его посадки, а её протоки расходились ко всем деревьям поля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделали его великим».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возвысила его» или «сделала его высоким».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם גִּדְּלוּהוּ
  choice: Воды взрастили его
  rationale: Форма множественного числа מַיִם передана возвышенным собирательным «воды», а каузативное значение גדל — естественным для образа дерева глаголом «взрастили».
- source_word: תְּהוֹם
  choice: бездна
  rationale: «Бездна» — традиционное и ёмкое обозначение глубинных вод; женский род слова позволяет естественно передать последующие местоименные формы.
- source_word: רֹמְמָתְהוּ
  choice: подняла его ввысь
  rationale: Передаёт каузативное значение רום и прежде всего сохраняет образ высокого дерева, не устраняя возможный оттенок возвышения и величия.
- source_word: נַהֲרֹתֶיהָ הֹלֵךְ סְבִיבוֹת
  choice: Её реки текли вокруг
  rationale: Женский суффикс соотнесён с תְּהוֹם («бездна»); «текли» идиоматически передаёт הֹלֵךְ применительно к рекам, а «вокруг» — סְבִיבוֹת.
- source_word: מַטָּעָהּ
  choice: места, где он был посажен
  rationale: Так ясно и естественно по-русски передан участок посадки дерева, при этом местоимение «он» сохраняет непосредственный образ дерева.
- source_word: תְּעָלֹתֶיהָ שִׁלְחָה
  choice: свои каналы она направляла
  rationale: «Каналы» передаёт ответвляющиеся водотоки, а «направляла» естественно выражает действие שלח в контексте распределения воды.
- source_word: אֶל כָּל עֲצֵי הַשָּׂדֶה
  choice: ко всем полевым деревьям
  rationale: Сохраняется коллективность כָּל и библейский образ «деревьев поля» в естественной русской форме.
theological_decisions:
- issue: Соотнесение местоимений в смешанном образе дерева и водной бездны
  choice: Мужской род относится к дереву («его», «он»), женский — к бездне («её», «она», «свои»).
  alternative: Унифицировать местоимения по политическому референту дерева либо перестроить фразу без местоименной отнесённости.
  rationale: 'Русская грамматика позволяет сохранить различие, присутствующее в еврейском тексте: дерево является непосредственным объектом действия, а женские суффиксы и глагольная форма относятся к תְּהוֹם. Это удерживает образную многослойность и не сводит метафору преждевременно к обозначаемой державе.'
- issue: Оттенок величия или физической высоты в רֹמְמָתְהוּ
  choice: В основном тексте передать физически-образное «подняла его ввысь», а смысловую альтернативу отметить в сноске.
  alternative: «Возвысила его» или «сделала его высоким».
  rationale: Контекст описывает дерево, но глагол допускает также переносный оттенок возвышения; сноска сохраняет эту значимую двусмысленность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Синтаксис сделан плавным и понятным, при этом сохранены олицетворение бездны, различие родов и напряжение между образом роста дерева и политическим возвышением.
