lexical_decisions:
- source_word: וַיְהִי
  choice: И случилось так
  rationale: Передаёт вводную повествовательную формулу без архаичного «и было» и естественно подводит к датировке.
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: в одиннадцатый год
  rationale: Обычная русская форма датировки, соответствующая еврейскому выражению.
- source_word: בַּשְּׁלִישִׁי
  choice: в третий месяц
  rationale: Слово «месяц» подразумевается контекстом календарной формулы и добавлено для ясности.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Ясно и точно передаёт стандартное еврейское календарное выражение.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: было ко мне слово Яхве
  rationale: Сохраняет характерную пророческую формулу и образ «слова», пришедшего к пророку, не заменяя его более толковательным выражением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, обозначенное тетраграмматоном, а не заменяет его титулом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит последующую прямую речь и функционально передаёт еврейское «говоря» без тяжеловесного повтора.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога. Форма «Яхве» прямо отражает тетраграмматон и не подменяет имя титулом; примечание сообщает традиционный вариант.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Датировка изложена ясно, а архаизмы вроде «в лето» и «рече» не используются.
