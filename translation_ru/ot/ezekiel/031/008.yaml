source:
  edition: WLC
  text: אֲרָזִ֣ים לֹֽא עֲמָמֻ/הוּ֮ בְּ/גַן אֱלֹהִים֒ בְּרוֹשִׁ֗ים לֹ֤א דָמוּ֙ אֶל סְעַפֹּתָ֔י/ו וְ/עַרְמֹנִ֥ים לֹֽא הָי֖וּ כְּ/פֹֽארֹתָ֑י/ו כָּל עֵץ֙ בְּ/גַן אֱלֹהִ֔ים לֹא דָמָ֥ה אֵלָ֖י/ו בְּ/יָפְיֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/008.yaml
  text: Cedars did not overshadow it in the garden of God[a]; cypresses did not compare with its boughs, and plane trees were not like its branches[b]. No tree in the garden of God compared with it in its beauty.
translation:
  language: ru
  text: Кедры не затмевали его в саду Божьем[a]; кипарисы не могли сравниться с его сучьями, а платаны[b] не были подобны его ветвям. Ни одно дерево в саду Божьем не могло сравниться с ним по красоте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Божьем саду». Буквально по-еврейски: «в саду Бога»; это выражение вызывает образ Эдема.'
    reason: lexical_alternative
  - marker: b
    text: '«Платаны» — наиболее вероятное значение; в традиционных переводах нередко: «каштаны».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָזִים
  choice: кедры
  rationale: Обычное и точное соответствие множественному числу אֶרֶז; естественно звучит в поэтическом перечислении величественных деревьев.
- source_word: עֲמָמֻהוּ
  choice: не затмевали его
  rationale: Глагол связан с потемнением или сокрытием. «Не затмевали» сохраняет образ того, что кедры не заслоняли и не превосходили описываемое дерево, не сводя выражение к отвлечённому «не соперничали».
- source_word: בְּגַן אֱלֹהִים
  choice: в саду Божьем
  rationale: Формально передаёт конструкцию «в саду Бога» и сохраняет возвышенный образ, напоминающий об Эдеме, но не отождествляет сад с Эдемом прямо.
- source_word: בְּרוֹשִׁים
  choice: кипарисы
  rationale: Точный ботанический вид не вполне определён; «кипарисы» — распространённое современное соответствие, уместное в данном перечне.
- source_word: דָמוּ
  choice: не могли сравниться с
  rationale: Глагол выражает подобие или сопоставление. Эта формулировка естественно передаёт мысль о том, что кипарисы уступали его сучьям.
- source_word: סְעַפֹּתָיו
  choice: его сучьями
  rationale: Слово обозначает крупные ответвления дерева. «Сучья» позволяет отличить их от פֹארֹתָיו, переданного далее словом «ветви».
- source_word: עַרְמֹנִים
  choice: платаны
  rationale: Современные лексикографические данные скорее указывают на платаны, тогда как традиционное «каштаны» менее вероятно.
- source_word: פֹארֹתָיו
  choice: его ветвям
  rationale: Существительное обозначает ветви или лиственную поросль; «ветви» естественно по-русски и сохраняет отличие от более крупных «сучьев».
- source_word: כָּל עֵץ ... לֹא
  choice: ни одно дерево
  rationale: Русская конструкция с универсальным отрицанием естественно передаёт буквальное «всякое дерево ... не».
- source_word: דָמָה אֵלָיו
  choice: не могло сравниться с ним
  rationale: Сохраняет значение сравнения и согласуется с передачей того же корня ранее в стихе.
- source_word: בְּיָפְיוֹ
  choice: красотой
  rationale: Творительный падеж естественно выражает признак, в отношении которого ни одно дерево не было ему равно.
theological_decisions:
- issue: Значение выражения «сад Божий»
  choice: Сохранено буквальное «в саду Божьем» без прямого упоминания Эдема.
  alternative: «в Эдеме» или «в Божьем раю»
  rationale: Выражение явно вызывает образ Эдема, однако еврейский текст говорит именно о «саде Бога». Буквальная передача сохраняет образ и его богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой образностью. Сохранены параллелизм, различие между крупными сучьями и ветвями, а также повтор выражения «в саду Божьем».
