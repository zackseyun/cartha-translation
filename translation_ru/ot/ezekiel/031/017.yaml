  source_fidelity: 'Вторая половина черновика не передаёт важную грамматическую особенность еврейского текста: при זְרֹעוֹ («его рука», метафорически сила/военная опора) стоит глагол во множественном числе יָשְׁבוּ. Русское «его рука жила» превращает образ в единственное число и создаёт буквальное, но неестественное представление о живущей руке. В контексте метафора относится к зависимым от Ассирии силам или подвластным ей людям. «Сошли вместе с ним» точно передаёт אִתּוֹ в рамках персонификации Ассирии/кедра; «в шеол» и «к сражённым мечом» также сохраняют смысл оригинала.'
  naturalness: «И его рука жила в его тени» по-русски неестественно и синтаксически конфликтует с коллективным глаголом подлинника. Перестройка в приложение — «его сила — те, кто жили под его сенью» — литературна, сохраняет пророческую образность и делает коллективный смысл ясным. «Под его сенью» несколько естественнее и стилистически уместнее, чем «в его тени».
  terminology: «Шеол» следует оставить транслитерацией без богословского уточнения. Для זְרֹעוֹ в основном тексте оправдано «его сила», поскольку русский буквальный эквивалент «рука» не может естественно выражать здесь коллективный субъект; буквальное значение и вариант «союзники» должны быть сохранены в сноске. «Народы» адекватно передаёт גּוֹיִם.
