base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/017.yaml
  text: They too went down with it to Sheol[a], to those slain by the sword; its arm dwelt in its shade among the nations.
translation:
  language: ru
  text: Они тоже сошли вместе с ним в шеол, к сражённым мечом; а его сила[a] — те, кто жили под его сенью среди народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его союзники»; буквально: «его рука».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הֵם
  choice: они тоже
  rationale: Передаёт присоединение этих лиц к уже описанному суду.
- source_word: אִתּוֹ
  choice: вместе с ним
  rationale: Местоимение мужского рода соответствует грамматическому роду образа кедра и его референту — Ассирии; русский язык естественно сохраняет мужской род.
- source_word: יָרְדוּ שְׁאוֹלָה
  choice: сошли ... в шеол
  rationale: Сохраняет устойчивый образ нисхождения в область мёртвых, не сужая значение до могилы и не отождествляя его с позднейшим понятием ада.
- source_word: חַלְלֵי חָרֶב
  choice: сражённым мечом
  rationale: Естественно передаёт конструкцию со значением погибших от меча.
- source_word: זְרֹעוֹ
  choice: его рука
  rationale: Сохраняет буквальный образ; в данном контексте слово может метафорически обозначать силу или союзников, что отмечено в сноске.
- source_word: יָשְׁבוּ
  choice: жила
  rationale: Глагол ישב здесь естественно означает пребывание или обитание. Женское единственное согласовано с «рука», как и форма текста WLC допускает согласование по смыслу/форме в передаче фразы.
- source_word: בְצִלּוֹ
  choice: в его тени
  rationale: Сохраняет образ дерева и защитной тени.
- source_word: בְתוֹךְ גּוֹיִם
  choice: среди народов
  rationale: Современная и идиоматичная передача пространственного оборота.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация сохраняет ветхозаветную неоднозначность понятия и не сводит его ни к месту погребения, ни к более позднему учению об аде.
- issue: Референт זְרֹעוֹ
  choice: его рука
  alternative: его сила; его союзники
  rationale: Основной текст сохраняет телесную метафору и не устраняет неоднозначность; вероятные контекстуальные значения вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной пророческой образности. Термин «шеол» оставлен без конфессионально нагруженного истолкования; метафора руки сохранена и пояснена сноской.
