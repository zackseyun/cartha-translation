base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/003.yaml
  text: Behold[a], Assyria was a cedar in Lebanon, beautiful in branches and a forest giving shade, and lofty in height[b]; its top was among the clouds.
translation:
  language: ru
  text: Вот, Ассирия была кедром на Ливане[a] — с прекрасными ветвями, с густой тенистой кроной и высокой; его верхушка была среди облаков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ливанским кедром» или «кедром Ливана».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди густых ветвей» или «среди густой листвы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу и живость пророческого вступления, оставаясь естественным для современного русского языка.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: Передаёт название империи, к которой обращено сравнение; стандартная русская историко-библейская форма здесь яснее транслитерации «Ассур».
- source_word: אֶרֶז בַּלְּבָנוֹן
  choice: кедром на Ливане
  rationale: Прямо передаёт пространственное значение предлога בְּ; возможное определительное понимание «ливанским кедром» сохранено в сноске.
- source_word: יְפֵה עָנָף
  choice: с прекрасными ветвями
  rationale: Естественно передаёт собирательное значение единственного עָנָף и описывает красоту ветвистой кроны.
- source_word: וְחֹרֶשׁ מֵצַל
  choice: густым и тенистым
  rationale: Передаёт образ плотной древесной поросли, дающей тень, не превращая один кедр в буквальный лес; конструкция встроена в последовательное описание дерева.
- source_word: וּגְבַהּ קוֹמָה
  choice: величественно высоким
  rationale: Естественно выражает внушительную высоту дерева и сохраняет возвышенный тон образа.
- source_word: וּבֵין עֲבֹתִים
  choice: среди облаков
  rationale: Соответствует возможному образу облачных масс и завершает картину необычайной высоты; дендрологическое понимание сохранено в сноске.
- source_word: צַמַּרְתּוֹ
  choice: вершина его
  rationale: Обозначает верхушку дерева без дополнительного истолкования; местоимение мужского рода согласовано с метафорическим «кедром».
theological_decisions:
- issue: Отождествление Ассирии с кедром
  choice: 'Сохранена прямая метафора: «Ассирия была кедром».'
  alternative: «Ассирия была подобна кедру».
  rationale: В еврейском тексте нет явного показателя сравнения; прямая метафора сильнее и не должна быть ослаблена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Тире организует цепь образных характеристик и предотвращает тяжеловесное нагромождение союзов. Неоднозначность עֲבֹתִים сохранена с помощью сноски.
