  text: בִּ/סְעַפֹּתָ֤י/ו קִֽנְנוּ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/תַ֤חַת פֹּֽארֹתָי/ו֙ יָֽלְד֔וּ כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/בְ/צִלּ/וֹ֙ יֵֽשְׁב֔וּ כֹּ֖ל גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/006.yaml
  text: In its branches all the birds of the heavens nested[a], and under its boughs all the beasts of the field gave birth, and in its shade all the many nations dwelt.
translation:
  language: ru
  text: Среди его ветвей гнездились все птицы небесные, под его ветвями рожали детёнышей все полевые звери, и в его тени жили все многочисленные народы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּסְעַפֹּתָיו
  choice: на его могучих ветвях
  rationale: סְעַפּוֹת обозначает крупные ветви или разветвлённые сучья; «могучие ветви» естественно передаёт их величину в образе исполинского дерева.
- source_word: קִנְנוּ
  choice: гнездились
  rationale: Глагол обозначает устройство гнёзд птицами; «гнездились» точно и естественно сохраняет этот образ.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: все птицы небесные
  rationale: Собирательное עוֹף в данном контексте передано множественным числом; «птицы небесные» сохраняет возвышенный библейский регистр.
- source_word: תַחַת פֹּארֹתָיו
  choice: под его густыми ветвями
  rationale: פֹּארוֹת — разросшиеся, покрытые листвой ветви. «Густые ветви» отличает это слово от предшествующего סְעַפּוֹת и соответствует образу укрытия.
- source_word: יָלְדוּ
  choice: рожали детёнышей
  rationale: Буквальное значение — «рождали»; добавление «детёнышей» по-русски естественно при подлежащем, обозначающем диких животных, и не меняет смысла.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: все полевые звери
  rationale: Устойчивое сочетание обозначает диких наземных животных; «полевые звери» сохраняет образность и высокий регистр.
- source_word: וּבְצִלּוֹ
  choice: в его тени
  rationale: צֵל может обозначать тень и создаваемую ею прохладу или защиту; русское «тень» сохраняет весь диапазон образа.
- source_word: יֵשְׁבוּ
  choice: жили
  rationale: В контексте народов ישב означает проживание или обитание, а не буквальное сидение.
- source_word: כֹּל גּוֹיִם רַבִּים
  choice: все многочисленные народы
  rationale: Формулировка сохраняет одновременно всеохватность כֹּל и множественность רַבִּים, оставаясь понятной в литературном русском языке.
theological_decisions:
- issue: Метафорический образ дерева как покрова для народов
  choice: Сохранить образ дерева и его тени без истолкования внутри стиха.
  alternative: Прямо назвать дерево Ассирией или империей.
  rationale: Стих является частью развёрнутой метафоры; перевод не должен подменять сам образ его контекстуальным толкованием.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Лексическое различие между סְעַפּוֹת и פֹּארוֹת передано сочетаниями «могучие ветви» и «густые ветви». Сноска английского консультационного слоя не воспроизведена: её текст не соответствует месту маркера и не отражает необходимой смысловой альтернативы еврейского текста.'
