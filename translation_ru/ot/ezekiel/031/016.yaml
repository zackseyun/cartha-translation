  text: מִ/קּ֤וֹל מַפַּלְתּ/וֹ֙ הִרְעַ֣שְׁתִּי גוֹיִ֔ם בְּ/הוֹרִדִ֥/י אֹת֛/וֹ שְׁא֖וֹלָ/ה אֶת י֣וֹרְדֵי ב֑וֹר וַ/יִּנָּ֨חֲמ֜וּ בְּ/אֶ֤רֶץ תַּחְתִּית֙ כָּל עֲצֵי עֵ֔דֶן מִבְחַ֥ר וְ/טוֹב לְבָנ֖וֹן כָּל שֹׁ֥תֵי מָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/016.yaml
  text: At the sound of his fall I made nations quake[a], when I brought him down to Sheol with those who go down to the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water[c][b], were comforted in the earth beneath.
translation:
  language: ru
  text: От звука его падения Я заставил народы содрогнуться, когда низвёл его в шеол[a] вместе с нисходящими в яму. И утешились[b] в глубинах земли[c] все деревья Эдема — отборные и лучшие деревья Ливана, все, пьющие воду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в мир мёртвых»; также возможно: «в преисподнюю» или «в могилу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нашли утешение». Возможно, речь идёт о мрачном утешении других павших держав, когда вслед за ними низошло и это великое дерево.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в нижней земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל מַפַּלְתּוֹ
  choice: От звука его падения
  rationale: Передаёт причинный оттенок предлога מִן и сохраняет одновременно образ падения дерева и политического краха.
- source_word: הִרְעַשְׁתִּי גוֹיִם
  choice: Я заставил содрогнуться народы
  rationale: Каузативная форма глагола требует значения «заставил содрогнуться»; «народы» соответствует международному контексту пророчества.
- source_word: בְּהוֹרִדִי אֹתוֹ
  choice: когда низвёл его
  rationale: Временное придаточное естественно передаёт конструкцию с инфинитивом, а «низвёл» сохраняет каузативность и нисходящее движение.
- source_word: שְׁאוֹלָה
  choice: в шеол
  rationale: Транслитерация сохраняет древнееврейское обозначение мира мёртвых и не сужает его до могилы.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: вместе с нисходящими в яму
  rationale: אֶת понято ассоциативно; причастная конструкция и образ ямы сохранены без поясняющего истолкования.
- source_word: וַיִּנָּחֲמוּ
  choice: утешились
  rationale: Русская возвратная форма естественно передаёт нифаль и сохраняет мрачную иронию утешения других павших сил.
- source_word: בְּאֶרֶץ תַּחְתִּית
  choice: в земле преисподней
  rationale: Формулировка передаёт нижнюю область земли и звучит естественнее буквального «в нижней земле», не отождествляя её догматически с позднейшим понятием ада.
- source_word: כָּל עֲצֵי עֵדֶן
  choice: все деревья Эдема
  rationale: Сохраняет центральную для главы древесную метафору и аллюзию на Эдем.
- source_word: מִבְחַר וְטוֹב לְבָנוֹן
  choice: избранные и лучшие деревья Ливана
  rationale: Понимается как приложение к деревьям Эдема; добавление «деревья» по-русски проясняет синтаксическую связь, не меняя образа.
- source_word: כָּל שֹׁתֵי מָיִם
  choice: все напояемые водой
  rationale: В контексте деревьев идиома означает получающих обильную влагу; такая формулировка сохраняет образ и избегает неестественного «все пьющие воду».
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; преисподняя; мир мёртвых
  rationale: «Шеол» сохраняет концептуальную широту исходного слова и не сводит его ни к месту погребения, ни к более позднему догматическому представлению.
- issue: Утешение деревьев в нижнем мире
  choice: сохранить образное «утешились» без объяснения в основном тексте
  alternative: истолковать как мрачное утешение павших народов либо как чисто поэтическую персонификацию
  rationale: Текст изображает народы и силы в виде деревьев, которые утешаются падением великого дерева; перевод не решает вопрос о характере их существования после смерти.
- issue: Соотношение шеола, ямы и земли преисподней
  choice: сохранить три взаимосвязанных, но не полностью уравненных образа
  alternative: передать все три одним словом «могила» или «преисподняя»
  rationale: Разнообразие образов в еврейском тексте создаёт поэтическую глубину и не должно сглаживаться.
translation_notes:
  register: Современный литературный русский язык с возвышенным пророческим регистром. Сохранены древесная метафора, нисходящая пространственная образность и неоднозначность представлений о мире мёртвых. Местоимение «Я» написано с прописной буквы как традиционное указание на речь Бога; синтаксис разбит на два предложения для ясности.
