    text: 'Или: «могущественного властителя народов» или «властителя народов». Еврейское выражение может обозначать могущественного правителя из числа народов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵהוּ
  choice: И Я отдал его
  rationale: 'Форма נתן с субъектом первого лица единственного числа и объектом третьего лица мужского рода. Хотя морфологически возможно обсуждение временного значения, в контексте естественнее совершённое действие: Бог предал Ассирию чужой власти.'
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет обычную древнееврейскую метафору передачи под чью-либо власть и при этом естественно звучит по-русски.
- source_word: אֵיל גּוֹיִם
  choice: могущественного властителя среди народов
  rationale: אֵיל здесь обозначает сильного, могущественного деятеля; контекст указывает на правителя, но текст не называет конкретное историческое лицо. «Среди народов» сохраняет возможную связь גּוֹיִם с кругом народов, не превращая выражение в титул.
- source_word: עָשׂוֹ יַעֲשֶׂה לוֹ
  choice: тот непременно поступит с ним
  rationale: Сочетание абсолютного инфинитива с имперфектом усиливает уверенность в действии. «Непременно» передаёт эмфатическую конструкцию, а «поступит с ним» сохраняет некоторую неопределённость самого глагола עשה.
- source_word: כְּרִשְׁעוֹ
  choice: За его нечестие
  rationale: В данном контексте כ выражает соответствие наказания нечестию; русское «за» естественно передаёт основание суда, хотя менее явно выражает его соразмерность.
- source_word: גֵּרַשְׁתִּהוּ
  choice: Я изгнал его
  rationale: גרש означает изгонять, выдворять. «Изгнал» точно и достойно по регистру передаёт удаление из прежнего места и положения.
theological_decisions:
- issue: Кого обозначает אֵיל גּוֹיִם
  choice: Обобщённое «могущественный властитель среди народов» без имени
  alternative: «властитель народов» либо прямое указание на царя Вавилона
  rationale: Вероятным историческим исполнителем суда был вавилонский царь, однако данный стих его не называет. Перевод не вносит это отождествление в основной текст.
- issue: Соотношение нечестия и изгнания
  choice: «За его нечестие Я изгнал его»
  alternative: «Соразмерно его нечестию Я изгнал его»
  rationale: Перевод ясно сохраняет нравственное основание Божьего суда, не добавляя подробностей о точной мере воздаяния, которых русский текст иначе мог бы чрезмерно подчеркнуть.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; местоимение «тот» устраняет двусмысленность субъекта второй части. Прописное «Я» используется как издательская норма для речи Бога.
