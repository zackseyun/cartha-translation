  rationale: Исправлены синтаксическое отношение в выражении «жестокие из народов», локатив «во всех долинах», значение глагола «сошли» и повтор глагола «оставили». Сноска о повторе удалена, поскольку после единообразного перевода она не нужна; сноска при «руслах» сохранена и стоит у соответствующего слова.
