    rationale: וַיֵּרְדוּ буквально обозначает нисхождение; «сошли из-под его тени» сохраняет этот элемент образа, не сводя его только к уходу.
  - severity: low
    issue: Разный перевод повторённого וַיִּטְּשֻׁהוּ
    rationale: В исходном тексте тот же глагол употреблён дважды. «Оставили» естественно в обоих случаях и сохраняет риторический повтор.
