source:
  edition: WLC
  text: וַ/יִּכְרְתֻ֧/הוּ זָרִ֛ים עָרִיצֵ֥י גוֹיִ֖ם וַֽ/יִּטְּשֻׁ֑/הוּ אֶל הֶ֠/הָרִים וּ/בְ/כָל גֵּ֨אָי֜וֹת נָפְל֣וּ דָלִיּוֹתָ֗י/ו וַ/תִּשָּׁבַ֤רְנָה פֹֽארֹתָי/ו֙ בְּ/כֹל֙ אֲפִיקֵ֣י הָ/אָ֔רֶץ וַ/יֵּרְד֧וּ מִ/צִּלּ֛/וֹ כָּל עַמֵּ֥י הָ/אָ֖רֶץ וַֽ/יִּטְּשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/012.yaml
  text: Foreigners[a], the ruthless of the nations, cut it down and left it. Its branches fell on the mountains and in every valley, and its boughs were broken in all the channels of the land[c][b]. Then all the peoples of the earth went down from its shade and left it.
translation:
  language: ru
  text: Чужеземцы, жестокие из народов, срубили его и оставили. Его ветви упали на горы и во всех долинах, а его сучья обломились во всех руслах земли.[a] Тогда все народы земли сошли из-под его тени и оставили его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всех оврагах земли»; еврейское слово может обозначать русла потоков, протоки или овраги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתֻהוּ
  choice: срубили его
  rationale: В развёрнутой метафоре дерева глагол כרת естественно означает рубку или валку дерева; мужское местоимение в русском также согласуется с образом кедра.
- source_word: זָרִים
  choice: чужеземцы
  rationale: Слово обозначает чужих, иноземцев; «чужеземцы» естественно для военного и межнационального контекста.
- source_word: עָרִיצֵי גוֹיִם
  choice: жестокие среди народов
  rationale: עָרִיץ передаёт жестокость, насилие и безжалостность. Формулировка не добавляет отсутствующей в еврейском явной превосходной степени.
- source_word: וַיִּטְּשֻׁהוּ
  choice: бросили / покинули его
  rationale: נטש значит оставлять, бросать, покидать. В русском небольшое варьирование естественно передаёт разные субъекты двух употреблений, сохраняя общий смысл оставления.
- source_word: דָלִיּוֹתָיו / פֹארֹתָיו
  choice: ветви / сучья
  rationale: Разные русские слова сохраняют лексическое различие двух еврейских обозначений ветвей, не утяжеляя речь.
- source_word: אֲפִיקֵי הָאָרֶץ
  choice: русла земли
  rationale: אֲפִיקִים обозначает русла, протоки или овраги; «русла» кратко и ясно сохраняет топографический образ.
- source_word: וַיֵּרְדוּ מִצִּלּוֹ
  choice: вышли из-под его тени
  rationale: Буквально ירד означает «спустились», однако здесь речь о народах, переставших находиться под сенью дерева; «вышли из-под» естественно передаёт пространственный образ без затемнения смысла.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: все народы земли
  rationale: Сохраняется различие между עַמִּים («народы») и более политически окрашенным «государства»; «земли» передаёт широкий международный охват.
theological_decisions:
- issue: Референт местоименных суффиксов в метафоре дерева
  choice: Мужское «его» сохраняет непосредственный образ кедра
  alternative: Понимать местоимения прежде всего как прямое указание на Ассирию или её правителя
  rationale: В русском грамматический род слова «кедр» совпадает с родом политического референта, поэтому перевод сохраняет намеренную многослойность образа и не вынуждает выбирать только одно толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Древесная метафора сохранена, синтаксис сделан ясным для обычного читателя; явная превосходная степень к выражению עָרִיצֵי גוֹיִם не добавлена.
