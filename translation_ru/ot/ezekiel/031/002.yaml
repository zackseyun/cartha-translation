  text: 'Son of man, say to Pharaoh king of Egypt and to his multitude: Whom are you like in your greatness?'
translation:
  language: ru
  text: 'Сын человеческий, скажи фараону, царю Египта, и всему его множеству: «Кому ты подобен в своём величии?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Сын человеческий
  rationale: Устойчивое и достаточно буквальное обращение к пророку, сохраняющее образность еврейского выражения.
- source_word: הֲמוֹנוֹ
  choice: всему его множеству
  rationale: 'Сохраняет широкий смысл слова: многочисленное окружение, народ или войско фараона; контекст не требует сужать значение.'
- source_word: דָּמִיתָ
  choice: сравнишь ты себя
  rationale: По смыслу вопрос требует назвать объект сравнения; русская возвратная конструкция естественно передаёт «с кем ты сходен/кого напоминаешь».
- source_word: בְגָדְלֶךָ
  choice: в своём величии
  rationale: Передаёт величие, значительность и масштаб, не сводя слово только к физическому размеру.
theological_decisions:
- issue: Адресат местоимения во второй части стиха
  choice: Единственное число «ты» отнесено к фараону.
  alternative: Отнести вопрос одновременно к фараону и его множеству.
  rationale: Еврейская форма דָּמִיתָ и суффикс בְגָדְלֶךָ стоят в мужском роде единственного числа, поэтому непосредственный адресат вопроса — фараон.
- issue: Риторический вопрос и образ сравнения
  choice: Сохранён открытый вопрос без пояснения ожидаемого ответа.
  alternative: Уточнить объект сравнения из следующего стиха.
  rationale: Стих намеренно создаёт переход к последующему образу; преждевременное уточнение сняло бы литературное напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «Сын человеческий» сохранена как библейски узнаваемая; вопрос сформулирован естественно, без архаичного порядка слов.
