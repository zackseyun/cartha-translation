  text: לְמַ֡עַן אֲשֶׁר֩ לֹא יִגְבְּה֨וּ בְ/קוֹמָתָ֜/ם כָּל עֲצֵי מַ֗יִם וְ/לֹֽא יִתְּנ֤וּ אֶת צַמַּרְתָּ/ם֙ אֶל בֵּ֣ין עֲבֹתִ֔ים וְ/לֹֽא יַעַמְד֧וּ אֵלֵי/הֶ֛ם בְּ/גָבְהָ֖/ם כָּל שֹׁ֣תֵי מָ֑יִם כִּֽי כֻלָּ/ם֩ נִתְּנ֨וּ לַ/מָּ֜וֶת אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֛וֹךְ בְּנֵ֥י אָדָ֖ם אֶל י֥וֹרְדֵי בֽוֹר־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/014.yaml
  text: so that all the trees by the waters may not grow tall in their height[a], and may not set their treetop among the clouds, and that none of the water-drinkers may stand over them in their height; for all of them are given over to death, to the land below, among the sons of man[b], with those who go down to the pit.
translation:
  language: ru
  text: чтобы ни одно дерево у вод не превозносилось своим ростом, не поднимало своей вершины до облаков[a] и чтобы никто из пьющих воду не возвышался над ними своим ростом[b]. Ибо все они преданы смерти — в нижнюю землю, среди людей, к сходящим в яму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди густых ветвей (листвы)». Еврейское слово עֲבֹתִים может обозначать густую поросль, а не облака.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст этой части стиха труден. Возможно также: «и чтобы никто из пьющих воду не стоял рядом с ними во весь свой рост».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение оборота.
- source_word: כָּל עֲצֵי מַיִם
  choice: ни одно дерево у вод
  rationale: В сочетании с отрицанием передаёт значение «все деревья у вод не…» естественной русской конструкцией; сохраняет образ деревьев, питаемых водой.
- source_word: יִגְבְּהוּ בְקוֹמָתָם
  choice: не превозносилось своим ростом
  rationale: Сохраняет одновременно буквальный образ высоты дерева и переносный смысл надменного возвышения.
- source_word: יִתְּנוּ אֶת צַמַּרְתָּם
  choice: не поднимало своей вершины
  rationale: צַמֶּרֶת — верхушка или вершина дерева; глагольная передача естественна по-русски и сохраняет древесный образ.
- source_word: אֶל בֵּין עֲבֹתִים
  choice: до облаков
  rationale: Передаёт вероятный образ вершины, достигающей облачной массы; возможное значение густых ветвей или листвы сохранено в примечании.
- source_word: כָּל שֹׁתֵי מָיִם
  choice: ни одно из пьющих воду
  rationale: Формально сохраняет необычную метафору, не сводя её однозначно к деревьям, правителям или народам.
- source_word: וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם
  choice: не возвышалось над другими своим ростом
  rationale: Передаёт вероятный сравнительный смысл трудной сжатой конструкции; неоднозначность отмечена в сноске.
- source_word: כִּי כֻלָּם נִתְּנוּ לַמָּוֶת
  choice: Ведь все они преданы смерти
  rationale: Пассивная форма «преданы» точно и весомо передаёт значение вручения или обречения смерти.
- source_word: אֶל אֶרֶץ תַּחְתִּית
  choice: низведены в преисподнюю землю
  rationale: Сохраняет буквальный пространственный образ нижней земли, не превращая его в чрезмерно определённый термин учения о загробном мире.
- source_word: בְּתוֹךְ בְּנֵי אָדָם
  choice: к людям
  rationale: В современном русском естественно обозначает смертное человечество без необоснованного ограничения только мужчинами.
- source_word: אֶל יֹרְדֵי בוֹר
  choice: к сходящим в могилу
  rationale: В данном погребально-подземном контексте «могила» естественно передаёт образ בּוֹר как ямы смерти, сохраняя мотив нисхождения.
theological_decisions:
- issue: Значение בְּנֵי אָדָם
  choice: к людям
  alternative: среди сынов человеческих / среди смертных
  rationale: Оборот обозначает смертных людей в противопоставлении горделиво возвысившимся деревьям-народам; родовое значение естественно передаётся словом «люди».
- issue: Образ אֶרֶץ תַּחְתִּית и בּוֹר
  choice: преисподняя земля… могила
  alternative: нижняя земля… яма
  rationale: Перевод сохраняет поэтическую картину смерти и нисхождения, не отождествляя её безоговорочно с позднейшими доктринальными представлениями об аде.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Древесная метафора и переход от буквальной высоты к гордыне сохранены; синтаксически трудное место не представлено как однозначное. Все маркеры сносок присутствуют в основном тексте.
