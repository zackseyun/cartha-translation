  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה בְּ/י֨וֹם רִדְתּ֤/וֹ שְׁא֨וֹלָ/ה֙ הֶאֱבַ֜לְתִּי כִּסֵּ֤תִי עָלָי/ו֙ אֶת תְּה֔וֹם וָֽ/אֶמְנַע֙ נַהֲרוֹתֶ֔י/הָ וַ/יִּכָּלְא֖וּ מַ֣יִם רַבִּ֑ים וָ/אַקְדִּ֤ר עָלָי/ו֙ לְבָנ֔וֹן וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה עָלָ֥י/ו עֻלְפֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/015.yaml
  text: 'Thus says the Lord GOD: On the day he went down to Sheol[a], I caused mourning; I covered the deep because of him, and I restrained its rivers, and the many waters were stopped. I made Lebanon grow dark because of him[c][b], and all the trees of the field fainted because of him.'
translation:
  language: ru
  text: 'Так говорит Владыка Господь: «В тот день, когда он сошёл в шеол[a], Я вызвал траур; из-за него Я покрыл бездну и удержал её реки, и были удержаны обильные воды. Из-за него Я погрузил Ливан во мрак[b], и все деревья в поле из-за него изнемогли[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу», «в царство мёртвых». Еврейское слово «шеол» обозначает мир умерших; оно сохранено в транслитерации, чтобы не сужать его смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я омрачил Ливан из-за него». Еврейский глагол может означать наведение тьмы или мрачности, что соответствует образу траура в этом стихе.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «лишились чувств», «обессилели». Редкое еврейское выражение обозначает изнеможение или обморочное состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт сочетание титула и божественного имени без неестественного повтора «Господь Господь»; «Господь» сохраняет принятую русскую передачу יהוה.
- source_word: בְּיוֹם רִדְתּוֹ שְׁאוֹלָה
  choice: В тот день, когда он сошёл в шеол
  rationale: Сохраняет временную конструкцию и транслитерирует שְׁאוֹל, не сужая значение до могилы и не привнося позднейшее представление об аде.
- source_word: הֶאֱבַלְתִּי
  choice: Я повелел оплакивать его
  rationale: Передаёт каузативную форму глагола אבל. Дополнение «его» естественно восстанавливается из контекста, хотя в еврейском оно не выражено явно.
- source_word: כִּסֵּתִי עָלָיו אֶת תְּהוֹם
  choice: из-за него Я покрыл бездну
  rationale: כסה имеет обычное значение «покрывать», а עָלָיו здесь естественно выражает причину — «из-за него»; תְּהוֹם передано как «бездна».
- source_word: וָאֶמְנַע נַהֲרוֹתֶיהָ
  choice: и удержал её реки
  rationale: מנע означает удерживать или задерживать; местоименный суффикс женского рода соотнесён с «бездной».
- source_word: וַיִּכָּלְאוּ מַיִם רַבִּים
  choice: и остановились обильные воды
  rationale: Сохраняет результативно-пассивный смысл формы כלה/כלא в контексте прекращённого водного потока; «обильные воды» естественно передаёт מַיִם רַבִּים.
- source_word: וָאַקְדִּר עָלָיו לְבָנוֹן
  choice: из-за него Я погрузил Ливан во мрак
  rationale: Каузатив קדר выражает наведение тьмы или мрачности; формулировка сохраняет образ вселенского траура.
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: и все полевые деревья
  rationale: Естественная русская передача собирательного образа деревьев поля.
- source_word: עָלָיו עֻלְפֶּה
  choice: из-за него изнемогли
  rationale: Редкое עֻלְפֶּה обозначает слабость, изнеможение или обморочное состояние; глагольная передача естественна по-русски и сохраняет образ упадка сил.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; царство мёртвых; ад
  rationale: Транслитерация сохраняет широкое древнееврейское представление о мире умерших, не сводя его к физической могиле и не отождествляя с позднейшим понятием ада.
- issue: Образ космического траура
  choice: Сохранить персонифицированные образы без их расшифровки в основном тексте
  alternative: Передать как буквальную экологическую катастрофу или заменить образы политическим толкованием
  rationale: Бездна, Ливан и деревья изображены участниками траура по павшему великому дереву; перевод сохраняет поэтическое и аллегорическое напряжение исходного текста.
- issue: Неявный объект הֶאֱבַלְתִּי
  choice: Я повелел оплакивать его
  alternative: Я вызвал плач; Я заставил скорбеть
  rationale: Контекст связывает траур с нисшедшим в шеол, но еврейский текст прямо не называет ни плачущего субъекта, ни объекта; выбранная русская формулировка ясна, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Образы бездны, Ливана и деревьев сохранены, но синтаксис сделан понятным обычному читателю. Все сноски имеют маркеры в основном тексте.
