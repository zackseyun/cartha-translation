base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/018.yaml
  text: Whom were you like in glory and greatness among the trees of Eden? Yet you shall be brought down with the trees of Eden to the land below; you shall lie among the uncircumcised, with those slain by the sword. This is Pharaoh and all his multitude[a], declares the Lord GOD.
translation:
  language: ru
  text: Кому среди деревьев Эдема ты был подобен в славе и величии? Но ты будешь низведён вместе с деревьями Эдема в нижнюю землю[a]. Ты будешь лежать среди необрезанных, вместе с убитыми мечом. Таков фараон и всё его множество, — говорит Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «земля внизу», «глубины земли» или «царство мёртвых». Еврейское выражение обозначает нижнюю область — место пребывания умерших.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָמִיתָ
  choice: ты был подобен
  rationale: Передаёт прямое обращение во втором лице и риторический вопрос о сходстве или сопоставимости.
- source_word: כָּכָה
  choice: не выражено отдельным словом
  rationale: Наречие усиливает сопоставление, но русское «подобен так» звучало бы неестественно; его смысл передан всей конструкцией вопроса со словами «славой и величием».
- source_word: כָבוֹד וּבְגֹדֶל
  choice: славой и величием
  rationale: Сохраняет сочетание царственного великолепия, высокого положения и масштаба образа.
- source_word: עֲצֵי עֵדֶן
  choice: деревья Эдема
  rationale: Сохраняет развёрнутую в главе метафору народов и правителей как деревьев Эдема.
- source_word: וְהוּרַדְתָּ
  choice: ты будешь низведён
  rationale: Передаёт каузативно-пассивную форму и будущую силу пророческого перфекта в контексте приговора.
- source_word: אֶרֶץ תַּחְתִּית
  choice: землю, что внизу
  rationale: Естественно передаёт пространственный образ нижней области и не отождествляет его безоговорочно с позднейшей разработанной картиной загробного мира.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: среди необрезанных
  rationale: Сохраняет буквальный, заветный и позорящий оттенок выражения в пророческой речи Иезекииля.
- source_word: תִּשְׁכַּב אֶת חַלְלֵי חֶרֶב
  choice: будешь лежать … вместе с убитыми мечом
  rationale: Передаёт образ смерти и погребения рядом с павшими от меча; אֶת здесь понято в значении совместности.
- source_word: הוּא פַרְעֹה וְכָל הֲמוֹנוֹ
  choice: Вот фараон и всё его множество
  rationale: «Вот» естественно передаёт итоговое указание הוּא, а «множество» сохраняет широкий смысл массы людей, войска или окружения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Различает титул אֲדֹנָי и личное имя יהוה, избегая неестественного повторения «Господь Господь».
theological_decisions:
- issue: Значение אֶרֶץ תַּחְתִּית
  choice: земля, что внизу
  alternative: нижняя земля; царство мёртвых; глубины земли
  rationale: Контекст указывает на область мёртвых, но пространственная формулировка сохраняет образ и не привносит более точную догматическую географию.
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Передача личного имени как «Яхве» сохраняет различие между божественным титулом и именем, непосредственно присутствующее в еврейском тексте.
- issue: Кто подразумевается под «необрезанными»
  choice: необрезанные
  alternative: язычники
  rationale: Буквальная формулировка сохраняет одновременно телесный, заветный и позорящий смысл и не сужает его до одного толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным и естественным, при этом сохранены обращение во втором лице, древесная метафора, нисхождение в область мёртвых и резкий итоговый переход к фараону.
