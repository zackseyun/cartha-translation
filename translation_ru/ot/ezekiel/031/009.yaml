  yaml_path: translation/ot/ezekiel/031/009.yaml
  text: I made it beautiful with its many branches[a], and all the trees of Eden that were in the garden of God envied it.
translation:
  language: ru
  text: Я сделал его прекрасным благодаря множеству его ветвей, и все деревья Эдема, что были в саду Божьем, завидовали ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָפֶה
  choice: прекрасным
  rationale: Предикативное прилагательное описывает красоту и величие кедра; «прекрасным» естественно и сохраняет возвышенный поэтический тон.
- source_word: עֲשִׂיתִיו
  choice: Я сделал его
  rationale: Форма содержит местоименный суффикс 3-го лица мужского рода. Русское «его» естественно относится и к кедру, и к стоящему за образом Ассуру, сохраняя двуплановость метафоры.
- source_word: בְּרֹב דָּלִיּוֹתָיו
  choice: множеством его ветвей
  rationale: בְּ передаёт средство или основание проявления красоты, רֹב — многочисленность, а דָּלִיּוֹת — раскидистые ветви. Формулировка близка к структуре оригинала и понятна современному читателю.
- source_word: וַיְקַנְאֻהוּ
  choice: завидовали ему
  rationale: קנא в данном контексте означает зависть; местоимение мужского рода согласуется с образом кедра и не устраняет политический референт.
- source_word: כָּל עֲצֵי עֵדֶן
  choice: все деревья Эдема
  rationale: Сохраняется поэтический собирательный образ и прямая связь с Эдемом.
- source_word: אֲשֶׁר בְּגַן הָאֱלֹהִים
  choice: что были в саду Божьем
  rationale: Относительное придаточное передано естественно; «сад Божий» сохраняет библейскую образность и указание на принадлежность Богу.
theological_decisions:
- issue: Референт местоименных суффиксов мужского рода в развёрнутой метафоре
  choice: Передать как «его/ему», сохранив грамматический мужской род и двуплановость образа кедра и Ассура.
  alternative: Передать как «его» применительно только к дереву либо перестроить фразу с повтором «кедр», тем самым выдвинув на первый план древесный образ.
  rationale: В русском языке «кедр» мужского рода, поэтому буквальное местоимение одновременно поддерживает образ дерева и допускает политико-человеческий референт. Нет необходимости выбирать между английскими it и him; подлинная неоднозначность оригинала сохраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Мужской род местоимений естественно обусловлен словом «кедр» в ближайшем контексте и сохраняет связь образа с Ассуром. Порядок частей следует еврейскому тексту без тяжеловесной буквальности.
