  text: וָ/אֶרְאֶ֕ה וְ/הִנֵּה יָ֖ד שְׁלוּחָ֣ה אֵלָ֑/י וְ/הִנֵּה ב֖/וֹ מְגִלַּת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/009.yaml
  text: Then I looked[a], and behold, a hand was stretched out toward me, and behold, in it was a scroll.
translation:
  language: ru
  text: 'И я увидел: вот, ко мне протянута рука, и вот, в ней — свиток[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свиток книги», то есть письменный свиток.'
    reason: Передаёт полную форму еврейского сочетания מְגִלַּת סֵפֶר, в основном тексте переведённого естественным русским словом «свиток».
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: И я увидел
  rationale: Последовательная форма с וַ продвигает повествование, а ראה обозначает новый зрительный момент. «И я увидел» естественно и точно передаёт действие от первого лица.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица הִנֵּה живо привлекает внимание к внезапно представшей картине. Повтор «и вот» сохранён в соответствии с еврейским текстом.
- source_word: יָד
  choice: рука
  rationale: В тексте прямо названа только рука; её принадлежность не уточняется, поэтому субъект не добавлен.
- source_word: שְׁלוּחָה
  choice: протянута
  rationale: Страдательное причастие от שלח в данном зрительном контексте описывает руку, протянутую к пророку. Краткая форма «протянута» сохраняет образ и лаконизм оригинала.
- source_word: אֵלָי
  choice: ко мне
  rationale: Предлог אֶל выражает направленность движения; «ко мне» естественно передаёт пространственное значение.
- source_word: בּוֹ
  choice: в ней
  rationale: По смыслу свиток находится в показанной руке. Русское согласование требует формы женского рода «в ней»; при этом владелец руки не уточняется.
- source_word: מְגִלַּת סֵפֶר
  choice: свиток
  rationale: Сочетание буквально имеет вид «свиток книги», но идиоматически обозначает письменный свиток, то есть свиток-документ. В основном тексте употреблено естественное русское «свиток», а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Кому принадлежит рука
  choice: Не уточнять владельца руки
  alternative: «рука Бога» или «рука ангельского посланника»
  rationale: Еврейский текст говорит лишь о протянутой руке. Уточнение её владельца устранило бы намеренную недосказанность и внесло бы толкование в перевод.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой выразительности. Двукратное «вот» воспроизводит риторический рисунок оригинала; двоеточие и тире помогают естественно оформить зрительную сцену.
