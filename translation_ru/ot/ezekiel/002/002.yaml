  text: And the Spirit entered into me when he spoke to me[a], and set me on my feet[b]; and I heard the one speaking to me.
translation:
  language: ru
  text: И вошёл в меня Дух[a], когда Он говорил со мной, и поставил меня на ноги; и я услышал того, кто говорил со мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух». Еврейское רוּחַ может означать «дух», «ветер» или «дыхание»; здесь контекст указывает, вероятнее всего, на Божьего Духа, дающего Иезекиилю силу.'
    reason: alternative_reading
lexical_decisions:
- source_word: רוּחַ
  choice: Дух
  rationale: В контексте призвания Иезекииля речь, вероятнее всего, идёт о Божьем Духе, который даёт пророку силу встать. При этом отсутствие артикля в еврейском тексте допускает перевод «дух», что отмечено в сноске.
- source_word: וַתָּבֹא בִי
  choice: вошёл в меня
  rationale: Сочетание בוא с предлогом בְּ и местоименным суффиксом обозначает вхождение внутрь; такой перевод сохраняет образ внутреннего наделения силой.
- source_word: כַּאֲשֶׁר דִּבֶּר אֵלַי
  choice: когда Он говорил со мной
  rationale: 'כַּאֲשֶׁר выражает временную связь, а форма דִּבֶּר в данном повествовательном контексте естественно передаётся русским несовершенным видом: действие Духа происходит во время речи.'
- source_word: וַתַּעֲמִדֵנִי עַל רַגְלָי
  choice: поставил меня на ноги
  rationale: 'Порода хифиль глагола עמד имеет каузативное значение; русское выражение прямо и естественно передаёт его: Дух сделал так, что пророк встал.'
- source_word: וָאֶשְׁמַע
  choice: я услышал
  rationale: Форма продолжает последовательность событий; союз «и» передаёт повествовательную связь без добавления отсутствующего наречия «тогда».
- source_word: אֵת מִדַּבֵּר אֵלָי
  choice: Говорившего со мной
  rationale: Причастие מִדַּבֵּר употреблено субстантивно как прямое дополнение. Русское субстантивированное причастие сохраняет эту структуру и не подменяет её простым местоимением.
theological_decisions:
- issue: Кого обозначает רוּחַ
  choice: Божий Дух, переданный как «Дух»
  alternative: «дух» — неопределённый дух или духовная сила
  rationale: Ближайший контекст видения и призвания указывает на Божий Дух, который входит в пророка и поднимает его. Заглавная буква отражает наиболее вероятного референта, но сноска сохраняет грамматически возможную неопределённость.
- issue: Кто говорил с пророком
  choice: Лицо, говорившее с Иезекиилем, обозначено как «Он» и «Говоривший» без дополнительного именования
  alternative: Явно добавить «Бог» или «Господь»
  rationale: В стихе субъект речи не назван существительным. Заглавные буквы соответствуют контексту божественной речи, но перевод не добавляет отсутствующего в стихе имени или титула.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены последовательность еврейского повествования и субстантивированное причастие в заключительной фразе; архаизмы и конфессионально специфическая терминология не использованы.
