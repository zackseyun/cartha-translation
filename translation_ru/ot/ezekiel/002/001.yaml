  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָם֙ עֲמֹ֣ד עַל רַגְלֶ֔י/ךָ וַ/אֲדַבֵּ֖ר אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/001.yaml
  text: And he said to me[a], “Son of man, stand on your feet, and I will speak to you.”
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий, встань на ноги, и Я буду говорить с тобой[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорить тебе». Еврейскую конструкцию можно передать и как «с тобой», и как «тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И Он сказал мне
  rationale: Повествовательная форма естественно передаётся простым прошедшим временем; глаголу אמר здесь точнее соответствует «сказал», а не более широкое «говорил».
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено буквальное и повторяющееся в книге Иезекииля обращение; оно передаёт особую лексику текста и не подменяется толкованием «смертный» или «человек».
- source_word: עֲמֹד עַל רַגְלֶיךָ
  choice: встань на ноги
  rationale: Естественное современное русское выражение, точно передающее повеление принять вертикальное положение и сохраняющее телесный образ оригинала.
- source_word: וַאֲדַבֵּר
  choice: и Я буду говорить
  rationale: Вслед за повелением форма обозначает последующее действие говорящего; будущее время естественно передаёт эту последовательность.
- source_word: אֹתָךְ
  choice: с тобой
  rationale: При דבר конструкция допускает значения «говорить с тобой» и «говорить тебе»; основной текст сохраняет личный оттенок варианта «с тобой», а альтернатива отмечена в сноске.
theological_decisions:
- issue: Передача בֶּן אָדָם в книге Иезекииля
  choice: Сын человеческий
  alternative: человек; смертный
  rationale: Буквальное устойчивое обращение сохраняет литературно-богословское звучание книги, не навязывая этому стиху позднейшего христологического истолкования.
- issue: Направленность речи в אֹתָךְ при דבר
  choice: говорить с тобой
  alternative: говорить тебе
  rationale: Обе передачи грамматически возможны; неоднозначность не разрешается догматически, а отражается сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Прописные местоимения «Он», «Я» указывают на божественного Говорящего по ближайшему контексту; обращение «Сын человеческий» сохранено как характерная формула книги Иезекииля.
