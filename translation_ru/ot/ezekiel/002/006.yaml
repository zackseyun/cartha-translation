source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָ֠דָם אַל תִּירָ֨א מֵ/הֶ֜ם וּ/מִ/דִּבְרֵי/הֶ֣ם אַל תִּירָ֗א כִּ֣י סָרָבִ֤ים וְ/סַלּוֹנִים֙ אוֹתָ֔/ךְ וְ/אֶל עַקְרַבִּ֖ים אַתָּ֣ה יוֹשֵׁ֑ב מִ/דִּבְרֵי/הֶ֤ם אַל תִּירָא֙ וּ/מִ/פְּנֵי/הֶ֣ם אַל תֵּחָ֔ת כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/006.yaml
  text: But you[a], son of man, do not fear them, and do not fear their words, though briers and thorns are with you and you sit among scorpions. Do not fear their words, and do not be dismayed by their faces[b], for they are a rebellious house.
translation:
  language: ru
  text: А ты, сын человеческий, не бойся их и не бойся их слов, хотя с тобою колючки и терновник[a] и ты сидишь среди скорпионов. Не бойся их слов и не ужасайся их лиц[b], ведь они — дом непокорный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое еврейское слово, переведённое как «колючки», толкуют по-разному; возможно также: «хотя с тобою мятежники и терновник». Однако сочетание с терновником и скорпионами поддерживает образ колючей, опасной растительности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-за их лиц»; то есть из-за их устрашающего вида или присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет буквальную форму устойчивого обращения к Иезекиилю и его повторяющуюся риторическую силу в книге.
- source_word: תִּירָא
  choice: не бойся
  rationale: Прямо передаёт запрет и позволяет сохранить троекратное повторение корня страха в стихе.
- source_word: דִּבְרֵיהֶם
  choice: их слов
  rationale: Сохраняет конкретное существительное и его повтор, не заменяя его пересказом «того, что они говорят».
- source_word: סָרָבִים וְסַלּוֹנִים
  choice: колючки и терновник
  rationale: Передаёт два связанных образа колючей растительности; редкое סָרָבִים допускает и иное толкование, отмеченное в сноске.
- source_word: אוֹתָךְ
  choice: вокруг тебя
  rationale: Естественно выражает опасное окружение в эллиптической еврейской конструкции, не устраняя образ.
- source_word: עַקְרַבִּים
  choice: скорпионов
  rationale: Прямой и понятный эквивалент, сохраняющий образ непосредственной опасности.
- source_word: יוֹשֵׁב
  choice: ты сидишь среди
  rationale: Сохраняет буквальное значение причастия и предложное окружение, хотя по смыслу возможно «живёшь».
- source_word: מִפְּנֵיהֶם
  choice: перед их лицами
  rationale: Сохраняет конкретный образ «лиц», который может обозначать устрашающий вид или присутствие людей.
- source_word: תֵּחָת
  choice: не трепещи
  rationale: Передаёт состояние подавленности и ужаса, отличая этот глагол от повторяющегося «не бойся».
- source_word: בֵּית מְרִי
  choice: мятежный дом
  rationale: Сохраняет характерную для Иезекииля корпоративную метафору «дом» и смысл упорного неповиновения.
theological_decisions:
- issue: Передача обращения בֶן אָדָם
  choice: сын человеческий
  alternative: смертный; человек
  rationale: Мужская форма относится к Иезекиилю лично и является устойчивым обращением Бога к пророку; буквальная передача сохраняет внутрикнижную связь, не навязывая дополнительного христологического истолкования.
- issue: Характер враждебных образов
  choice: сохранены образы колючек, терновника и скорпионов
  alternative: 'передать абстрактно: «хотя они враждебны тебе»'
  rationale: Образы составляют существенную часть пророческой риторики и понятны современному читателю; их устранение ослабило бы напряжение текста.
- issue: Значение בֵּית מְרִי
  choice: мятежный дом
  alternative: непокорный народ; дом мятежа
  rationale: Формулировка сохраняет корпоративное обозначение Израиля и не смягчает богословскую оценку его упорного сопротивления.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повторы «не бойся» и «их слов» сохранены намеренно; редкая лексическая неоднозначность вынесена в сноску.
