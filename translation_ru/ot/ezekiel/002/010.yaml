base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/010.yaml
  text: And he spread it out before me[a], and it was written on the front and on the back[b]; and written on it were lamentations and mourning and woe.
translation:
  language: ru
  text: 'Он развернул его передо мной. Свиток был исписан с лицевой и с оборотной стороны[a]; на нём были записаны плачи, стенания[b] и горе.


    [a] Буквально: «спереди и сзади»; возможно также: «с обеих сторон». Традиционный перевод: «внутри и снаружи».

    [b] Или: «стоны».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «спереди и сзади»; возможно также: «с обеих сторон». Традиционный перевод: «внутри и снаружи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стоны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: развернул
  rationale: Глагол פרשׂ означает «расправить, развернуть». В контексте свитка «развернул» естественно передаёт действие, не добавляя лишних подробностей.
- source_word: אוֹתָהּ
  choice: его
  rationale: Местоименный суффикс относится к свитку из предыдущего стиха; в русском слово «свиток» мужского рода.
- source_word: לְפָנַי
  choice: передо мной
  rationale: Прямой и естественный русский эквивалент пространственного выражения.
- source_word: כְתוּבָה
  choice: был исписан
  rationale: Причастие от כתב означает, что на свитке имелся текст. «Исписан» естественно сочетается с указанием на обе его стороны.
- source_word: פָּנִים וְאָחוֹר
  choice: с лицевой и с оборотной стороны
  rationale: Буквально «спереди и сзади». Выбранный вариант ясно передаёт, что текст находился на обеих сторонах свитка, сохраняя образ лицевой и оборотной стороны.
- source_word: וְכָתוּב אֵלֶיהָ
  choice: на нём были записаны
  rationale: Передаёт пассивную конструкцию и вводит перечисление содержимого свитка естественным русским синтаксисом.
- source_word: קִנִים
  choice: плачи
  rationale: Слово обозначает плачи или погребальные причитания. «Плачи» сохраняет множественное число и торжественно-мрачный пророческий тон.
- source_word: הֶגֶה
  choice: стенания
  rationale: Существительное может обозначать стон, вздох или скорбное бормотание. «Стенания» передаёт слышимое выражение скорби; вариант «стоны» отмечен в сноске.
- source_word: הִי
  choice: горе
  rationale: Возглас или обозначение бедствия и скорби. «Горе» естественно звучит в русской пророческой речи и сохраняет угрожающий оттенок.
theological_decisions:
- issue: Передача трёх скорбных обозначений содержимого свитка
  choice: плачи, стенания и горе
  alternative: плачи, стоны и горе
  rationale: Сохранены три самостоятельных, близких по смыслу слова и их нарастающее скорбно-зловещее звучание без уточнения природы суда или бедствия.
- issue: Описание двух поверхностей свитка
  choice: с лицевой и с оборотной стороны
  alternative: внутри и снаружи
  rationale: Еврейское выражение буквально означает «спереди и сзади» и, вероятнее всего, указывает на обе стороны свитка. Традиционный вариант может предполагать устройство свёрнутого свитка и потому оставлен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Короткие фразы сохраняют последовательность видения; лексика понятна обычному читателю и не привносит конфессионального толкования.
