base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/004.yaml
  text: And the children are hard-faced and hard-hearted[a]; I am sending you to them, and you shall say to them[b], ‘Thus says the Lord GOD.’
translation:
  language: ru
  text: 'А сыновья — люди с дерзким лицом и упрямым сердцем[a]. Я посылаю тебя к ним, и ты скажешь им: «Так говорит Владыка Яхве»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твёрдые лицом и крепкие сердцем» — образное выражение о дерзких и упорно непокорных людях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, в традиционной передаче божественного имени: «Так говорит Господь Бог». В еврейском тексте: אֲדֹנָי יְהוִה (Адонай Яхве).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבָּנִים
  choice: А эти люди
  rationale: Буквально «а сыновья», но в контексте выражение указывает на упомянутый народ Израиля. «Эти люди» естественно передаёт собирательный смысл, не создавая в русском ложного впечатления, будто речь идёт только о мужчинах или о буквальных сыновьях.
- source_word: קְשֵׁי פָנִים
  choice: с дерзким лицом
  rationale: Буквально «твёрдые лицом». Формулировка сохраняет телесный образ и передаёт бесстыдную дерзость и непокорность; пояснение идиомы вынесено в сноску.
- source_word: וְחִזְקֵי לֵב
  choice: с упрямым сердцем
  rationale: Буквально «крепкие/сильные сердцем». В данном отрицательном контексте речь не о мужестве, а о внутреннем упорстве и непокорности; «упрямое сердце» ясно передаёт этот смысл и сохраняет образ сердца.
- source_word: אֲנִי שׁוֹלֵחַ
  choice: Я посылаю
  rationale: Местоимение с причастием выражает непосредственное поручение и совершающееся отправление. Русское настоящее время звучит естественно и сохраняет подчёркнутое «Я».
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: и ты скажешь им
  rationale: Перфект в контексте поручения имеет предписывающе-будущее значение. Будущее время по-русски ясно передаёт обязательную часть пророческой миссии.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула пророческого посланника; настоящее время сохраняет её торжественный и авторитетный характер.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: אֲדֹנָי передано как «Владыка», а личное имя יהוה — как «Яхве». Так различаются оба элемента составного титула и избегается искусственное «Господь Господь».
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Форма «Владыка Яхве» делает видимым личное имя в еврейском тексте и одновременно отдельно передаёт титул אֲדֹנָי. Традиционное «Господь Бог» более привычно, но скрывает различие между титулом и именем; альтернативу отмечает сноска.
- issue: Отрицательный смысл חִזְקֵי לֵב
  choice: с упрямым сердцем
  alternative: с крепким сердцем
  rationale: В контексте мятежности Израиля выражение обозначает ожесточённое упорство, а не стойкость или мужество. Поэтому отрицательная направленность передана явно, без усиления до отдельного богословского понятия ожесточения.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Буквальные еврейские образы лица и сердца частично сохранены, а их идиоматический смысл пояснён в сноске. Пунктуация разбивает длинную еврейскую конструкцию на естественные русские предложения.
