  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שְׁמַע֙ אֵ֤ת אֲשֶׁר אֲנִי֙ מְדַבֵּ֣ר אֵלֶ֔י/ךָ אַל תְּהִי מֶ֖רִי כְּ/בֵ֣ית הַ/מֶּ֑רִי פְּצֵ֣ה פִ֔י/ךָ וֶ/אֱכֹ֕ל אֵ֥ת אֲשֶׁר אֲנִ֖י נֹתֵ֥ן אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/008.yaml
  text: But you[a], son of man, hear what I am speaking to you. Do not be rebellious like the rebellious house. Open your mouth and eat what I am giving you.
translation:
  language: ru
  text: А ты, сын человеческий[a], слушай, что Я говорю тебе. Не будь мятежным, как мятежный дом. Открой уста и съешь то, что Я даю тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын человека»; также возможно: «смертный» или «человек». Здесь это обычное обращение Бога к Иезекиилю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и его повторяющуюся литературную форму; примечание указывает буквальный смысл и естественные смысловые варианты.
- source_word: שְׁמַע
  choice: слушай
  rationale: Передаёт повеление слышать и внимательно воспринимать сказанное, не сужая значение до явного «повинуйся».
- source_word: מְדַבֵּר אֵלֶיךָ
  choice: Я говорю тебе
  rationale: Естественно передаёт настоящее, непосредственное действие, выраженное причастием.
- source_word: אַל תְּהִי מֶרִי
  choice: Не будь мятежным
  rationale: Существительное מֶרִי обозначает мятежность или непокорность; в русском предложении естественно передать его прилагательным.
- source_word: כְּבֵית הַמֶּרִי
  choice: как мятежный дом
  rationale: Сохраняет образ «дома» как собирательного обозначения Израиля и лексический повтор корня идеи мятежности.
- source_word: פְּצֵה פִיךָ
  choice: Открой уста
  rationale: Передаёт повеление открыть рот; «уста» уместны в современном литературно-библейском регистре и не затрудняют понимание.
- source_word: וֶאֱכֹל
  choice: и съешь
  rationale: Передаёт последовательное повеление совершить конкретное символическое действие; совершенный вид естественен по-русски в данном контексте.
- source_word: אֵת אֲשֶׁר אֲנִי נֹתֵן אֵלֶיךָ
  choice: то, что Я даю тебе
  rationale: Передаёт непосредственность действия причастия נֹתֵן и сохраняет неопределённость предмета до следующего стиха.
theological_decisions:
- issue: Значение אָדָם в пророческом обращении
  choice: сын человеческий
  alternative: смертный; человек
  rationale: Это устойчивое обращение к пророку в книге Иезекииля, поэтому традиционная форма сохраняет литературную и межтекстовую связь. Примечание предотвращает ошибочное отождествление титула с его более поздним употреблением и раскрывает обычный антропологический смысл выражения.
- issue: Образ «мятежного дома»
  choice: сохранить метафору «дом»
  alternative: мятежный народ; мятежный род
  rationale: בַּיִת обозначает Израиль как коллектив, но исходный текст намеренно использует образ дома; его сохранение не требует конфессионального истолкования и поддерживает повторяющуюся лексику книги.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Повтор «мятежным — мятежный» и метафора «дом» сохранены ради структуры и ключевой лексики исходного текста; местоимение Бога оформлено с прописной буквы по распространённой русской библейской традиции.
