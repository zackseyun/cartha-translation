base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/005.yaml
  text: And whether they listen or refuse—for they are a rebellious house—they will know that a prophet has been among them[a][b].
translation:
  language: ru
  text: Послушают они или откажутся слушать[a] — ибо они мятежный дом — они узнают, что среди них[b] был пророк.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Услышат они или перестанут слушать»; еврейский текст буквально противопоставляет «услышат» и «перестанут / воздержатся», причём здесь речь идёт об отказе внимать вести.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в их среде был пророк».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִשְׁמְעוּ ... וְאִם יֶחְדָּלוּ
  choice: Послушают они или откажутся слушать
  rationale: Парная условная конструкция представляет две возможные реакции, не меняющие результата. יִשְׁמְעוּ в данном контексте означает не просто физически услышать, а внять; יֶחְדָּלוּ буквально значит «перестанут/воздержатся», но здесь передаёт отказ внимать пророческой вести.
- source_word: בֵּית מְרִי
  choice: мятежный дом
  rationale: Сохранён характерный для Иезекииля образ «дома» и корпоративный смысл выражения; «мятежный» естественно передаёт упорное неповиновение.
- source_word: וְיָדְעוּ
  choice: они узнают
  rationale: 'Форма в данной последовательности имеет будущее результативное значение: независимо от ответа народа ему станет известно, что среди него находился пророк.'
- source_word: נָבִיא
  choice: пророк
  rationale: Прямое и естественное соответствие еврейскому существительному; русская конструкция не требует неопределённого артикля.
- source_word: הָיָה בְתוֹכָם
  choice: среди них был
  rationale: Передаёт буквальный пространственный смысл «был в их среде» и завершённое присутствие пророка без излишнего уточнения временных отношений.
- source_word: וְהֵמָּה
  choice: они
  rationale: Самостоятельное местоимение, вынесенное в еврейском для акцента, отражено явным подлежащим после первого сказуемого; начальное וְ не воспроизведено механически, поскольку стих по-русски естественно продолжает предшествующую речь без начального «и».
theological_decisions:
- issue: Характер реакции народа
  choice: Стих утверждает, что присутствие пророка будет признано независимо от того, внемлет народ вести или откажется слушать.
  alternative: Понимать יִשְׁמְעוּ преимущественно как физическое слышание, а יֶחְדָּלוּ — буквально как прекращение действия.
  rationale: Контраст в пророческом контексте касается принятия вести и отказа внимать ей. Перевод сохраняет эту силу, не уточняя последующее покаяние, осуждение или время признания.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Мятежный дом» сохраняет устойчивый образ книги Иезекииля; «откажутся слушать» делает контекстуальный смысл понятным обычному читателю. Парные тире отделяют пояснительную причину и сохраняют ход еврейской фразы.
