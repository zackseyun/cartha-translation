  text: וְ/דִבַּרְתָּ֤ אֶת דְּבָרַ/י֙ אֲלֵי/הֶ֔ם אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּ֑לוּ כִּ֥י מְרִ֖י הֵֽמָּה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/007.yaml
  text: You shall speak my words to them[a], whether they listen or whether they refuse, for they are rebellious.
translation:
  language: ru
  text: Говори им Мои слова, будут ли они слушать или откажутся внимать, ибо они мятежны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  choice: Говори
  rationale: Форма с союзом в данном контексте передаёт прямое поручение Иезекиилю. Русское повелительное наклонение естественно выражает обязательность поручения.
- source_word: אֶת דְּבָרַי
  choice: Мои слова
  rationale: Сохраняется конкретное значение множественного числа דָּבָר и непосредственная связь речи пророка со словами Бога; более обобщённое «Мою весть» было бы истолковательным.
- source_word: אֲלֵיהֶם
  choice: им
  rationale: Естественный современный русский эквивалент направительного оборота «к ним» в сочетании с глаголом речи.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: будут ли они слушать или откажутся
  rationale: Повторяющаяся у Иезекииля формула противопоставляет готовность слушать отказу внимать. «Слушать» сохраняет слуховой оттенок שׁמע, не сводя его однозначно к послушанию; «откажутся» естественно передаёт идиоматический смысл יחדל в этом противопоставлении.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой пророк должен говорить независимо от реакции слушателей.
- source_word: מְרִי הֵמָּה
  choice: они непокорны
  rationale: Краткая предикативная конструкция естественно передаёт характеристику народа как мятежного и не добавляет отсутствующего в стихе слова «дом».
theological_decisions:
- issue: Передавать ли יִשְׁמְעוּ как «услышат», «будут слушать» или «послушаются»
  choice: будут слушать
  alternative: услышат; послушаются
  rationale: Глагол שׁמע способен включать значение послушания, однако здесь противопоставлен отказу внимать. «Будут слушать» сохраняет смысловую широту и не усиливает нравственно-богословский вывод сверх выраженного в тексте.
translation_notes:
  register: Современный литературный русский язык; тон прямого пророческого поручения сохранён без архаизмов. Заглавная буква в «Мои» указывает на речь Бога согласно принятой русской издательской традиции.
