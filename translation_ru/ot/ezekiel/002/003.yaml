  source_fidelity: В целом переданы обращение «בן אדם», направленность послания к сынам Израиля, намеренно неожиданное «народам», мятеж против Бога и усиленная временная формула. Однако «совершали преступления» придаёт פשע уголовно-правовой оттенок и несовершенный вид, которого здесь не требуется; глагол обозначает неверность/вероломное нарушение по отношению к Богу и в контексте лучше передаётся отдельно от מרד.
  naturalness: Текст звучит литературно и ясно. «Они и их отцы изменяли Мне вплоть до сегодняшнего дня» естественно в библейском регистре и точнее выражает продолжающуюся до настоящего времени неверность, чем «совершали преступления».
  terminology: «Сын человеческий» — закреплённая и уместная передача постоянного обращения в Иезекииле. «Сынам Израиля» и «народам» сохраняют форму и риторическую резкость оригинала. «Мятежным ... восставшим» адекватно передаёт связь הַמּוֹרְדִים / מָרְדוּ; «изменяли Мне» отличает פשע от מרד без конфессиональной интерпретации.
