  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ שׁוֹלֵ֨חַ אֲנִ֤י אֽוֹתְ/ךָ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל גּוֹיִ֥ם הַ/מּוֹרְדִ֖ים אֲשֶׁ֣ר מָרְדוּ בִ֑/י הֵ֤מָּה וַ/אֲבוֹתָ/ם֙ פָּ֣שְׁעוּ בִ֔/י עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/003.yaml
  text: And he said to me[a], “Son of man, I am sending you to the sons of Israel, to the rebellious nations that have rebelled against me; they and their fathers have transgressed against me to this very day.”
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий[a], Я посылаю тебя к сынам Израиля, к мятежным народам, восставшим против Меня. Они и их отцы изменяли Мне вплоть до сегодняшнего дня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек»; «смертный».'
    reason: Лексические варианты передачи בֶּן אָדָם.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю, его форму и межтекстовые связи; возможные смысловые передачи вынесены в сноску.
- source_word: שׁוֹלֵחַ אֲנִי אֹתְךָ
  choice: Я посылаю тебя
  rationale: Причастие с явно выраженным местоимением передаёт непосредственность совершающегося поручения; по-русски настоящее время естественно охватывает ближайшее будущее.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально прозрачно передаёт еврейское выражение и сохраняет его библейскую образность.
- source_word: גּוֹיִם
  choice: народам
  rationale: Сохраняет неожиданное множественное число и резкое применение слова о народах к сынам Израиля, не заменяя его сглаживающим собирательным обозначением.
- source_word: הַמּוֹרְדִים ... מָרְדוּ בִי
  choice: мятежным ... восставшим против Меня
  rationale: Передаёт продолжающийся мятежный характер адресатов и направленность их восстания против Бога; русское варьирование корня позволяет избежать тяжеловесного повтора при сохранении смысловой связи.
- source_word: פָּשְׁעוּ בִי
  choice: совершали преступления против Меня
  rationale: Отличает פשע от предшествующего מרד и сохраняет сильный смысл виновного, преступного нарушения, направленного против Бога.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: вплоть до этого самого дня
  rationale: Естественно передаёт усиленную временную формулу и подчёркивает непрерывность проступка до настоящего момента.
theological_decisions:
- issue: Смягчать ли обвинение Израиля заменой גּוֹיִם нейтральным обозначением
  choice: Сохранить «народы» во множественном числе
  alternative: «народ» или «израильтяне»
  rationale: Еврейский текст намеренно употребляет неожиданное обозначение, обычно относимое к народам, и тем самым усиливает судебное обвинение Израиля.
- issue: Передача обращения בֶּן אָדָם
  choice: «Сын человеческий» в основном тексте
  alternative: «человек» или «смертный»
  rationale: В данном месте это постоянное Божье обращение к Иезекиилю, а не христологический титул; формальная передача всё же лучше сохраняет повторяемость выражения и канонические связи, тогда как смысловые варианты указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены повторное «против Меня», неожиданное множественное «народы» и традиционное обращение «Сын человеческий»; архаичные обороты вроде «до сего дня» не использованы.
