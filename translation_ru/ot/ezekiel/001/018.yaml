base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/018.yaml
  text: As for their rims[a], they were high and fearsome, and the rims of all four were full of eyes all around.
translation:
  language: ru
  text: Их ободья были высоки и внушали страх[a]; ободья всех четырёх колёс были полны глаз со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и страх был у них»; то есть их вид внушал страх или трепет.'
    reason: Сохраняет образность и неоднозначность еврейского оборота יִרְאָה לָהֶם, не ограничивая его значение только ужасом или только благоговением.
lexical_decisions:
- source_word: גַבֵּיהֶן / גַבֹּתָם
  choice: ободья их / ободья
  rationale: В контексте видения четырёх колёс слово גַּב обозначает их наружную часть, то есть обод. «Ободья» — точное и понятное современному читателю обозначение, сохраняющее повтор еврейского текста.
- source_word: גֹבַהּ
  choice: были высоки
  rationale: Существительное «высота» передано естественной русской именной конструкцией с кратким прилагательным; смысл высоты ободьев сохранён.
- source_word: יִרְאָה לָהֶם
  choice: внушали страх
  rationale: Буквальная конструкция «страх был у них» описывает вызываемое ими чувство. «Внушали страх» естественно по-русски и не ослабляет значение до простого восхищения.
- source_word: מְלֵאֹת עֵינַיִם
  choice: были полны глаз
  rationale: Близкая передача необычного и выразительного образа без истолкования или смягчения.
- source_word: סָבִיב
  choice: кругом
  rationale: Передаёт расположение глаз по всей окружности ободьев и звучит естественно в современном литературном русском.
- source_word: לְאַרְבַּעְתָּן
  choice: всех четырёх колёс
  rationale: Местоименная форма относится к четырём колёсам из ближайшего контекста. Добавление «колёс» устраняет неясность в русском, не меняя образа.
theological_decisions:
- issue: Характер страха, выраженного словом יִרְאָה
  choice: внушали страх
  alternative: были грозны / внушали благоговейный ужас
  rationale: Еврейское слово обозначает страх или трепет, но само по себе не требует ни исключительно религиозного благоговения, ни крайнего ужаса. Выбранная формулировка сохраняет эту широту и не навязывает богословского уточнения.
translation_notes:
  register: Современный литературный русский с достоинством пророческого видения. Сохранены параллелизм, повтор слова «ободья» и странный образ ободьев, полных глаз; точка с запятой делает длинное описание яснее.
