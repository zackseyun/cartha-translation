lexical_decisions:
- source_word: בַּ/חֲמִשָּׁה
  choice: В пятый день
  rationale: В формуле датировки сочетание предлога ב с числительным «пять» означает «в пятый день»; слово «день» естественно восполняется по-русски.
- source_word: לַ/חֹדֶשׁ
  choice: месяца
  rationale: В еврейской формуле даты выражение завершает сочетание «в пятый день месяца»; родительный падеж наиболее естественен в русском языке.
- source_word: הִיא
  choice: это был
  rationale: Самостоятельное местоимение имеет возобновляющую и пояснительную функцию; перевод сохраняет переход к уточнению года.
- source_word: הַ/שָּׁנָה הַ/חֲמִישִׁית
  choice: пятый год
  rationale: Прямой и естественный перевод порядковой хронологической формулы.
- source_word: לְ/גָלוּת
  choice: изгнания
  rationale: Существительное может обозначать как состояние изгнания, так и переселение; «изгнание» сохраняет более широкое значение и естественно служит точкой хронологического отсчёта.
- source_word: הַ/מֶּלֶךְ
  choice: царя
  rationale: В русском библейском и историческом контексте מֶלֶךְ естественно передаётся словом «царь»; родительный падеж обусловлен зависимостью от «изгнания».
- source_word: יוֹיָכִין
  choice: Иехонии
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; падеж согласован с титулом «царя».
