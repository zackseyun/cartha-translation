base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/005.yaml
  text: 'And from within it came the likeness of four living creatures[b][a]. And this was their appearance: they had the likeness of a man.'
translation:
  language: ru
  text: 'А изнутри неё — подобие четырёх живых существ[a]. И вот как они выглядели: у них было подобие человека[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четырёх живых созданий».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «человеческий облик».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתּוֹכָהּ
  choice: А изнутри него
  rationale: Сочетание передаёт исход из середины увиденного ранее огненного явления. Местоимение мужского рода естественно соотносится в русском контексте с явлением; тире помогает передать краткую зрительную фиксацию.
- source_word: דְּמוּת
  choice: подобие
  rationale: '«Подобие» сохраняет характерную для видения осторожность: речь идёт о сходстве, а не о прямом отождествлении.'
- source_word: אַרְבַּע חַיּוֹת
  choice: четырёх живых существ
  rationale: «Живые существа» передаёт одушевлённость חַיּוֹת, не сводя их к животным и не определяя их прямо как ангелов.
- source_word: וְזֶה מַרְאֵיהֶן
  choice: И вот как они выглядели
  rationale: Естественная современная передача оборота о видимом облике существ.
- source_word: דְּמוּת אָדָם
  choice: подобие человека
  rationale: אָדָם здесь обозначает человеческий облик; нейтральное «человека» точнее современного русского «мужчины» и не приписывает существам мужской пол.
- source_word: לָהֵנָּה
  choice: у них было
  rationale: Идиоматически выражает еврейскую конструкцию принадлежности «им/у них».
theological_decisions:
- issue: Описание природы существ в видении
  choice: Сохранить повтор слова «подобие» и назвать их «живыми существами»
  alternative: Назвать их просто «существами» либо истолковать в основном тексте как ангелов
  rationale: Стих описывает наблюдаемый облик, не давая окончательного определения их природы; перевод сохраняет эту намеренную сдержанность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной интонацией. Повтор «подобие» намеренно сохранён как ключевая черта визионерского описания Иезекииля.
