base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/007.yaml
  text: Their legs were straight[a], and the soles of their feet were like the sole of a calf’s foot[b], and they gleamed like the appearance of polished bronze.
translation:
  language: ru
  text: Ноги у них были прямые, а подошвы ног — как подошва ноги телёнка[a]; они сверкали, как отполированная бронза[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «как телячьи копыта». Буквально в еврейском: «как подошва ноги телёнка».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «начищенная бронза»; возможно также: «отполированная медь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: ноги у них
  rationale: רֶגֶל может обозначать как ногу, так и стопу. Поскольку далее отдельно упомянуты ступни, здесь выбрано более широкое «ноги».
- source_word: רֶגֶל יְשָׁרָה
  choice: были прямые
  rationale: 'Единственное число в еврейском употреблено распределительно: у каждого существа ноги были прямыми. «Прямые» передаёт описание без уточнения позы.'
- source_word: כַּף רַגְלֵיהֶם
  choice: ступни их
  rationale: כַּף применительно к ноге обозначает ступню или подошву; «ступни» естественно звучит по-русски и сохраняет отличие от более общего «ноги».
- source_word: כְּכַף רֶגֶל עֵגֶל
  choice: как ступни телёнка
  rationale: Перевод сохраняет анатомический образ исходного текста, не заменяя его сразу толковательным «копыта».
- source_word: וְנֹצְצִים
  choice: и сверкали
  rationale: Причастие передаёт яркий, блестящий вид; «сверкали» естественно для описания видения.
- source_word: כְּעֵין
  choice: как
  rationale: В данной сравнительной конструкции значение «по виду, словно» естественно выражается русским союзом «как» без тяжеловесного «подобно виду».
- source_word: נְחֹשֶׁת קָלָל
  choice: начищенная бронза
  rationale: נְחֹשֶׁת может обозначать медь или бронзу, а редкое קָלָל здесь, вероятно, указывает на блестящую, обработанную поверхность. «Начищенная бронза» ясно и естественно передаёт образ.
