language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֣ע אֶת ק֣וֹל כַּנְפֵי/הֶ֡ם כְּ/קוֹל֩ מַ֨יִם רַבִּ֤ים כְּ/קוֹל שַׁדַּי֙ בְּ/לֶכְתָּ֔/ם ק֥וֹל הֲמֻלָּ֖ה כְּ/ק֣וֹל מַחֲנֶ֑ה בְּ/עָמְדָ֖/ם תְּרַפֶּ֥ינָה כַנְפֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/024.yaml
  text: And I heard the sound of their wings[a], like the sound of many waters, like the sound of the Almighty when they went, a sound of tumult like the sound of an army camp. When they stood still[b], they lowered their wings.
translation:
  language: ru
  text: И я услышал шум их крыльев — как шум множества вод, как голос Всемогущего[a], когда они двигались, — гул, как шум воинского стана[b]. Когда они останавливались, они опускали крылья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Шаддая». Еврейское שַׁדַּי — божественный титул, традиционно переводимый как «Всемогущий».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как шум стана (лагеря)». Еврейское מַחֲנֶה часто обозначает военный лагерь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: И я услышал
  rationale: Последовательная глагольная форма продолжает рассказ о видении; союз «и» сохраняет связь с предшествующим событием.
- source_word: קוֹל
  choice: шум / голос / гул
  rationale: 'Значение определяется носителем звука: для крыльев и вод естественно «шум», применительно к Всемогущему — «голос», а הֲמֻלָּה передано как «гул». Такое варьирование сохраняет смысл повторяющегося еврейского слова без неестественного единообразия по-русски.'
- source_word: כַּנְפֵיהֶם
  choice: их крыльев
  rationale: Прямо передаёт форму множественного числа с местоименным суффиксом, относящимся к живым существам.
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: словно шум могучих вод
  rationale: רַבִּים может указывать не только на множество, но и на величие или мощь. «Могучие воды» естественно передают образ огромной силы и громкости, не уточняя их вид.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Божественный титул переведён его традиционным смысловым соответствием; транслитерация «Шаддай» приведена в примечании.
- source_word: בְּלֶכְתָּם
  choice: когда они двигались
  rationale: Временная конструкция обозначает обстоятельство движения живых существ. «Двигались» лучше соответствует контрасту с последующей остановкой, чем узкое «шли».
- source_word: הֲמֻלָּה
  choice: гул
  rationale: Существительное обозначает громкий, беспорядочный шум. «Гул» звучит естественно и сохраняет мощную акустическую образность видения.
- source_word: כְּקוֹל מַחֲנֶה
  choice: как в воинском стане
  rationale: מַחֲנֶה буквально означает «стан, лагерь» и часто обозначает военное расположение. Формулировка передаёт подразумеваемый шум множества людей, не превращая стан в саму армию.
- source_word: בְּעָמְדָם
  choice: когда они останавливались
  rationale: Передаёт временную конструкцию и ясно выражает противопоставление движению.
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: они опускали крылья
  rationale: Форма от רפה здесь означает позволить крыльям опуститься или повиснуть; «опускали» ясно и естественно описывает прекращение их активного движения.
theological_decisions:
- issue: Передача божественного титула שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: Смысловой перевод сохраняет значение божественного титула и привычен современному русскому читателю; транслитерация оставлена как допустимая лексическая альтернатива в примечании.
- issue: Характер קוֹל שַׁדַּי
  choice: голос Всемогущего
  alternative: звук, исходящий от Всемогущего
  rationale: Слово קוֹל допускает значения «голос» и «звук». В отношении личного божественного субъекта «голос» наиболее естественен, однако перевод не добавляет, что это обязательно была членораздельная речь.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной образностью. Повтор еврейского קוֹל передан контекстуально словами «шум», «голос» и «гул», чтобы избежать тяжеловесности и при этом сохранить нарастающий ряд звуковых сравнений. Маркеры примечаний помещены непосредственно при соответствующих выражениях.
