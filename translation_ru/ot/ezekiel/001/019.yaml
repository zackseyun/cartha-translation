base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/019.yaml
  text: When the living creatures moved[a], the wheels moved beside them; and when the living creatures were lifted up from the earth[b], the wheels were lifted up.
translation:
  language: ru
  text: Когда живые существа двигались[a], колёса двигались рядом с ними; и когда живые существа были подняты с земли[b], колёса были подняты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шли» — как о существах, так и о колёсах; в еврейском тексте их согласованное движение выражено одним и тем же глаголом.'
    reason: lexical_alternative
  - marker: b
    text: Позднее Иезекииль называет этих «живых существ» херувимами (см. Иезекииль 10:20).
    reason: cross_reference
lexical_decisions:
- source_word: וּבְלֶכֶת
  choice: Когда ... двигались
  rationale: Предлог ב с инфинитивом сопряжённой формы הלך задаёт временное обстоятельство. Такая передача естественна по-русски и сохраняет временное значение.
- source_word: הַחַיּוֹת
  choice: живые существа
  rationale: В видении Иезекииля это одушевлённые существа у престола, а не обычные животные. Обобщённое обозначение сохраняет формулировку данного стиха, не предваряя позднейшее отождествление с херувимами.
- source_word: יֵלְכוּ
  choice: двигались
  rationale: הלך обычно означает «идти», но здесь речь идёт о согласованном перемещении существ и колёс; «двигались» естественно применимо к обоим и сохраняет повтор одного еврейского глагола.
- source_word: הָאוֹפַנִּים
  choice: колёса
  rationale: אופן прямо обозначает колесо; форма множественного числа относится к колёсам при живых существах.
- source_word: אֶצְלָם
  choice: рядом с ними
  rationale: אצל выражает близость и соседнее положение; русская формулировка ясно передаёт тесную пространственную связь.
- source_word: וּבְהִנָּשֵׂא
  choice: и когда ... поднимались
  rationale: Нифаль от נשׂא допускает значение подъёма без указания действующего лица. «Поднимались» сохраняет эту неопределённость и звучит естественнее буквального пассива.
- source_word: מֵעַל הָאָרֶץ
  choice: над землёй
  rationale: Сочетание מן + מעל буквально указывает на движение из положения при/над землёй. В контексте подъёма «поднимались над землёй» естественно передаёт удаление от поверхности, не отождествляя אֶרֶץ исключительно с почвой.
- source_word: יִנָּשְׂאוּ
  choice: поднимались
  rationale: Повтор той же русской формы сохраняет лексическую связь с הִנָּשֵׂא и подчёркивает согласованность движения существ и колёс.
theological_decisions:
- issue: Кем являются הַחַיּוֹת в видении Иезекииля
  choice: В основном тексте — «живые существа»
  alternative: «херувимы»
  rationale: Хотя в Иез 10:20 пророк отождествляет их с херувимами, в данном стихе употреблено более общее חַיּוֹת. Перевод сохраняет локальную формулировку, а позднейшее уточнение сообщает в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повторы «двигались» и «поднимались» намеренно сохраняют параллелизм и согласованность движения в еврейском тексте; «живые существа» не заменено толковательным «херувимы».
