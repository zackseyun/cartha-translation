  source_fidelity: 'В целом переданы ключевые повторы и осторожный язык подобия: רָקִיעַ — «свод», דְּמוּת — «подобие», כִּסֵּא — «престол». Однако «вверху над ним» неудачно передаёт заключительное עָלָיו מִלְמָעְלָה: пространственная связь с престолом сохраняется, но формулировка тяжеловесна и порядок слов не вполне ясен. Предлагаемая редакция яснее передаёт фигуру как находящуюся над подобием престола, не добавляя глагола «сидел».'
  naturalness: «Камень сапфир» не является естественным современным русским сочетанием. «Сапфировый камень» сохраняет предметное значение אֶבֶן סַפִּיר и звучит литературно. Во второй части перенос обстоятельства «вверху над ним» в позицию после «над подобием престола» делает фразу более понятной, хотя намеренная пространственная повторность оригинала сохранена.
  terminology: «Свод», «подобие» и «престол» уместны и последовательны. «Человек» адекватно передаёт אָדָם в данном контексте. Сноска к «сапфировый камень» корректно сохраняет неопределённость минералогической идентификации סַפִּיר.
