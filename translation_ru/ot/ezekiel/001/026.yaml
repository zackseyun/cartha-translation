  text: וּ/מִ/מַּ֗עַל לָ/רָקִ֨יעַ֙ אֲשֶׁ֣ר עַל רֹאשָׁ֔/ם כְּ/מַרְאֵ֥ה אֶֽבֶן סַפִּ֖יר דְּמ֣וּת כִּסֵּ֑א וְ/עַל֙ דְּמ֣וּת הַ/כִּסֵּ֔א דְּמ֞וּת כְּ/מַרְאֵ֥ה אָדָ֛ם עָלָ֖י/ו מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/026.yaml
  text: And above the expanse that was over their heads was the likeness of a throne[a], in appearance like sapphire stone; and above the likeness of the throne was a likeness with the appearance of a man above it.
translation:
  language: ru
  text: Над сводом, который был над их головами, было подобие престола, на вид как сапфировый камень[a]; а над подобием престола, вверху над ним, было подобие, на вид как человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «лазурит»; какой именно драгоценный камень обозначает древнееврейское слово «саппир», точно не установлено.'
    reason: Лексическая альтернатива для סַפִּיר; традиционное «сапфир» не является бесспорной минералогической идентификацией.
lexical_decisions:
- source_word: רָקִיעַ
  choice: свод
  rationale: В контексте видения это распростёртая над живыми существами поверхность; «свод» естественно передаёт её пространственный и подобный платформе характер, не прибегая к архаичному «твердь».
- source_word: כְּמַרְאֵה
  choice: с виду словно / с виду как
  rationale: Сохраняет повторяющуюся формулу зрительного подобия и не превращает увиденное в прямое отождествление.
- source_word: אֶבֶן סַפִּיר
  choice: камень сапфир
  rationale: Сохраняет традиционное название драгоценного камня; точная идентификация древнееврейского סַפִּיר остаётся не вполне определённой.
- source_word: דְּמוּת
  choice: подобие
  rationale: Последовательно передаёт осторожный, аналогический язык видения и повтор ключевого слова в стихе.
- source_word: כִּסֵּא
  choice: престол
  rationale: Царственный контекст видения требует значения «престол», а не общего «сиденье».
- source_word: אָדָם
  choice: человек
  rationale: Здесь обозначен единичный человекоподобный облик; русское «человек» естественно и точно, не означает человечество в целом.
- source_word: עָלָיו מִלְמָעְלָה
  choice: вверху над ним
  rationale: Передаёт оба пространственных элемента выражения и сохраняет местоименную неоднозначность еврейского текста, не добавляя отсутствующего глагола «сидел».
theological_decisions:
- issue: Антропоморфное описание фигуры над престолом
  choice: «было подобие, с виду как человек»
  alternative: «был некто, похожий на человека» / «был человеческий облик»
  rationale: Сочетание דְּמוּת и כְּמַרְאֵה намеренно наслаивает выражения подобия. Перевод сохраняет напряжение между человекоподобным явлением и отказом прямо отождествлять Бога с человеческим телом.
- issue: Положение фигуры относительно престола
  choice: Не добавлять «сидело»; передать «над подобием престола» и «вверху над ним»
  alternative: «на престоле сидел»
  rationale: Глагола «сидеть» в еврейском тексте нет. Пространственная формулировка сохраняет свидетельство источника, даже если по контексту подразумевается восседающая на престоле фигура.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Повторы «над» и «подобие» сохранены как значимые особенности еврейского описания видения; архаичное «твердь» не используется.
