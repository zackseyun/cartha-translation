base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/004.yaml
  text: And I looked[a], and behold, a storm wind was coming from the north, a great cloud with fire flashing continually, and brightness all around it; and from its midst was something like the appearance of glowing metal[c][b], from the midst of the fire.
translation:
  language: ru
  text: 'Я смотрел — и вот: с севера надвигался бурный ветер[a], большое облако с непрестанно вспыхивающим огнём[b], и вокруг него было сияние. А из середины облака, из самой гущи огня, виднелось нечто, подобное сияющему металлу[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вихрь». Древнееврейское выражение может обозначать сильный бурный или вихревой ветер.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «огонь, охватывающий сам себя». Древнееврейское выражение трудно для понимания и, вероятно, описывает непрерывное, усиливающееся движение огня.'
    reason: lexical_alternative
  - marker: c
    text: Древнееврейское хашмал — редкое слово с неясным значением; возможно, имеется в виду электрум или янтареподобное сияние.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Я увидел
  rationale: 'Обычное значение ראה — «видеть». В русском сочетание «я увидел: вот» естественно вводит содержание видения и сохраняет зрительный характер повествования.'
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет указательную и привлекающую внимание силу הִנֵּה, передавая внезапное развёртывание видения без излишней архаичности.
- source_word: רוּחַ סְעָרָה
  choice: бурный ветер
  rationale: Сочетание обозначает сильный, грозовой ветер. Такой перевод прозрачен и не навязывает образ строго вращающегося вихря.
- source_word: בָּאָה מִן הַצָּפוֹן
  choice: с севера надвигался
  rationale: Форма изображает происходящее как разворачивающееся перед пророком; «надвигался» передаёт движение к наблюдателю и зрительную непосредственность.
- source_word: עָנָן גָּדוֹל
  choice: огромное облако
  rationale: Передаёт величину и внушительность образа естественным современным русским языком.
- source_word: אֵשׁ מִתְלַקַּחַת
  choice: непрестанно вспыхивающий огонь
  rationale: Редкая возвратная форма описывает огонь в непрерывном, усиливающемся движении. Перевод сохраняет динамику, не закрепляя спорное буквальное толкование «охватывающий сам себя».
- source_word: נֹגַהּ לוֹ סָבִיב
  choice: вокруг него было сияние
  rationale: נֹגַהּ означает яркость или сияние; местоимение оставлено без уточняющей интерпретации и может относиться к облачно-огненному явлению в целом.
- source_word: וּמִתּוֹכָהּ
  choice: из его середины
  rationale: Передаёт пространственную структуру видения и подготавливает повторное упоминание огня как внутреннего средоточия явления.
- source_word: כְּעֵין
  choice: нечто, подобное
  rationale: 'Сохраняет осторожный, сравнительный характер описания: пророк передаёт сходство увиденного, а не даёт точного определения вещества.'
- source_word: הַחַשְׁמַל
  choice: сияющий металл
  rationale: חַשְׁמַל — редкое слово с неясным значением, возможно обозначающее электрум или янтареподобное свечение. Обобщённый зрительный перевод не создаёт ложной точности.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из самого огня
  rationale: Сохраняет повтор и подчёркивает, что сияющее явление виднелось внутри огня; «самого» естественно передаёт вложенность образа по-русски.
theological_decisions:
- issue: Передача образов богоявления без их чрезмерно точного истолкования
  choice: Сравнительно-описательное выражение «нечто, подобное сияющему металлу»
  alternative: Точная идентификация вещества как «янтарь» или «электрум»
  rationale: Древнееврейский текст намеренно описывает видение через подобие, а значение חַשְׁמַל остаётся спорным. Перевод сохраняет зрительную неопределённость и не отождествляет образ с конкретным веществом.
translation_notes:
  register: Современный литературный русский язык с приподнятым, но не архаическим тоном. Двоеточие после «увидел» естественно вводит содержание видения; «вот» сохраняет его внезапность. Повтор внутреннего местоположения передан выражениями «из его середины, из самого огня», а не устранён как стилистическая избыточность.
