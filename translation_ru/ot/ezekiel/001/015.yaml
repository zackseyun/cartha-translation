base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/015.yaml
  text: As I looked at the living creatures[a], behold, one wheel was on the earth beside the living creatures, for each of their four faces.
translation:
  language: ru
  text: 'Я смотрел на живых существ, и вот: на земле рядом с ними было по одному колесу у каждого из существ, имевших по четыре лица.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одно колесо ... соответственно четырём его лицам». Еврейская фраза кратка и неоднозначна; единственное число в «его лицам» может пониматься распределительно — о каждом из живых существ с четырьмя лицами. Она также может описывать положение колеса по отношению к четырёхликой форме каждого существа.'
    reason: Лексико-синтаксическая неоднозначность выражения לְאַרְבַּעַת פָּנָיו и референта местоименного суффикса.
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Я посмотрел … и увидел
  rationale: Форма продолжает повествование и вводит новый предмет видения. Сочетание «посмотрел … и увидел» естественно передаёт направленное зрительное восприятие, не сводя глагол только к результату.
- source_word: הַחַיּוֹת
  choice: живых существ
  rationale: Буквально обозначает живые существа; в этой главе речь идёт о существах видения. Перевод не уточняет их природу прежде, чем это делает сам текст.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица резко привлекает внимание к новому элементу видения; «вот» сохраняет её наглядную и указательную силу.
- source_word: אוֹפַן אֶחָד
  choice: по одному колесу
  rationale: Сохраняется значение «одно колесо», а конструкция с «по» естественно выражает вероятный распределительный смысл фразы в контексте нескольких живых существ.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Прямой и контекстуально уместный перевод места, где в видении находилось колесо.
- source_word: אֵצֶל
  choice: рядом с ними
  rationale: Предлог обозначает непосредственную близость; местоимение устраняет тяжёлый повтор, не меняя референта.
- source_word: לְאַרְבַּעַת פָּנָיו
  choice: у каждого из их четырёх лиц
  rationale: Передаёт вероятное распределительное отношение к четырём лицам каждого существа. Множественное «их» по-русски согласуется с собирательно понимаемыми живыми существами, тогда как неоднозначность компактной еврейской фразы отмечена в сноске.
theological_decisions:
- issue: Референт и число в לְאַרְבַּעַת פָּנָיו
  choice: 'Передать распределительно: «у каждого из их четырёх лиц»'
  alternative: «соответственно четырём его лицам» / «у четырёх его лиц»
  rationale: 'Суффикс в еврейском стоит в единственном числе после упоминания живых существ во множественном числе и может пониматься распределительно: у каждого существа было по четыре лица. Перевод отражает ближайший контекст, но сноска сохраняет грамматическую и пространственную неоднозначность образа.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, зримо-повествовательным строем. Двоеточие и «вот» сохраняют внезапность появления нового элемента видения; терминология остаётся понятной без конфессиональных уточнений.
