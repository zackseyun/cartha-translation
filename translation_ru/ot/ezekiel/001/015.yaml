revisions:
- from: 'Я посмотрел на живых существ и увидел: вот, на земле рядом с ними было по одному колесу — у каждого из их четырёх лиц.[a]'
  to: 'Я смотрел на живых существ, и вот: на земле рядом с ними было по одному колесу у каждого из существ, имевших по четыре лица.[a]'
  rationale: Исправление устраняет неясное соотнесение колеса с «каждым лицом», не навязывая определённой схемы видения сверх ближайшего контекста. Распределительное «по одному колесу у каждого из существ» согласуется с английской контрольной формулировкой и с единственным суффиксом, понимаемым распределительно; альтернативная связь с четырьмя лицами сохранена в сноске.
