base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/009.yaml
  text: Their wings were joined[a], each to her sister. As they moved, they did not turn[b]; each one went straight ahead.
translation:
  language: ru
  text: 'Крылья их были соединены одно с другим[a]. Двигаясь, они не поворачивали: каждое из них шло в ту сторону, куда было обращено его лицо[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «женщина с сестрой своей» — еврейское взаимное выражение, здесь означающее, что соответствующие крылья были соединены друг с другом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «каждое шло прямо вперёд».'
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבְרֹת
  choice: соединялись
  rationale: Причастие от חבר передаёт состояние соединённости крыльев; несовершенный вид естественно описывает постоянную особенность существ в видении.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: одно с другим
  rationale: Буквально «женщина с сестрой своей»; это идиоматическое взаимное выражение, здесь относящееся к крыльям. Русское «одно с другим» ясно передаёт взаимное соединение и согласуется со средним родом слова «крыло».
- source_word: כַּנְפֵיהֶם
  choice: крылья их
  rationale: Прямой перевод; порядок слов сохраняет возвышенный повествовательный регистр, оставаясь понятным современному читателю.
- source_word: לֹא יִסַּבּוּ
  choice: не поворачивали
  rationale: סבב обозначает поворот или изменение направления; форма передана как повторяющаяся особенность движения в описании видения.
- source_word: בְּלֶכְתָּן
  choice: двигаясь
  rationale: 'Инфинитив с ב выражает одновременность: они не поворачивали во время движения.'
- source_word: אִישׁ
  choice: каждое
  rationale: Мужской дистрибутив относится к каждому из живых существ; средний род в русском согласуется с подразумеваемым «существо» и не приписывает им человеческий пол.
- source_word: אֶל עֵבֶר פָּנָיו
  choice: в ту сторону, куда было обращено его лицо
  rationale: Формулировка сохраняет образ направления лица и не сводит выражение без пояснения к более толковательному «прямо вперёд».
- source_word: יֵלֵכוּ
  choice: шло
  rationale: Обычный глагол движения; в контексте видения русское прошедшее несовершенного вида естественно описывает характер их движения.
