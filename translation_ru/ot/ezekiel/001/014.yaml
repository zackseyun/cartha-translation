  text: And the living creatures were running back and forth[a], like the appearance of lightning.
translation:
  language: ru
  text: И живые существа стремительно двигались туда и обратно[a], подобно вспышке молнии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «бежали и возвращались».'
    reason: 'Лексическая альтернатива: примечание сохраняет формальную структуру רָצוֹא וָשׁוֹב, тогда как основной текст передаёт её повторительный смысл естественным русским выражением.'
lexical_decisions:
- source_word: וְהַחַיּוֹת
  choice: И живые существа
  rationale: חַיּוֹת обозначает «живых существ». Перевод сохраняет описательный характер названия и не вводит преждевременно их отождествление из Иез 10:20.
- source_word: רָצוֹא וָשׁוֹב
  choice: стремительно двигались туда и обратно
  rationale: Сочетание абсолютных инфинитивов от רוץ («бежать») и שוב («возвращаться») передаёт быстрое повторяющееся движение. Такая русская формулировка естественно выражает оба направления и стремительность, не превращая оборот в однократное действие.
- source_word: כְּמַרְאֵה הַבָּזָק
  choice: словно при вспышке молнии
  rationale: מַרְאֶה указывает на видимое явление или зрительное впечатление, а בָּזָק — на молнию либо её вспышку. Русская формулировка передаёт зрительное сравнение естественно и сохраняет образ внезапного молниеносного движения.
