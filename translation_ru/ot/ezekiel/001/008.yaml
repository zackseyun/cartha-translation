  text: ו/יד/ו אָדָ֗ם מִ/תַּ֨חַת֙ כַּנְפֵי/הֶ֔ם עַ֖ל אַרְבַּ֣עַת רִבְעֵי/הֶ֑ם וּ/פְנֵי/הֶ֥ם וְ/כַנְפֵי/הֶ֖ם לְ/אַרְבַּעְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/008.yaml
  text: And they had human hands under their wings on their four sides[b][a]; and the four of them had their faces and their wings.
translation:
  language: ru
  text: Под крыльями у них, с каждой из четырёх сторон, были человеческие руки[a]. У всех четырёх были лица и крылья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза синтаксически сжата; буквально: «и человеческие руки из-под их крыльев на четырёх их сторонах, и их лица и их крылья — у четверых». В переводе подразумеваемые связи выражены явно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדוֹת אָדָם
  choice: были человеческие руки
  rationale: Именное предложение без выраженной связки передаёт наличие; «человеческие руки» естественно обозначает вид рук и отличает их от звериных черт видения.
- source_word: מִתַּחַת כַּנְפֵיהֶם
  choice: под крыльями у них
  rationale: מִתַּחַת указывает на положение ниже чего-либо; местоименное «у них» помогает по-русски ясно связать крылья с живыми существами.
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶם
  choice: с каждой из четырёх сторон
  rationale: רִבְעֵיהֶם здесь обозначает четыре стороны живых существ. Распределительное «с каждой» естественно выражает расположение рук со всех четырёх сторон.
- source_word: וּפְנֵיהֶם וְכַנְפֵיהֶם לְאַרְבַּעְתָּם
  choice: У всех четырёх были лица и крылья
  rationale: Сжатая именная конструкция применяется ко всем четырём существам; русская связка «были» делает подразумеваемое отношение явным, не уточняя число лиц и крыльев сверх сказанного здесь.
