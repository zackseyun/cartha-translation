  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְהִ֣י בִּ/שְׁלֹשִׁ֣ים שָׁנָ֗ה בָּֽ/רְבִיעִי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ וַ/אֲנִ֥י בְ/תֽוֹךְ הַ/גּוֹלָ֖ה עַל נְהַר כְּבָ֑ר נִפְתְּחוּ֙ הַ/שָּׁמַ֔יִם וָ/אֶרְאֶ֖ה מַרְא֥וֹת אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/001.yaml
  text: It happened in the thirtieth year[a], in the fourth month, on the fifth day of the month, while I was among the exiles by the Kebar River, the heavens were opened[b], and I saw visions of God.
translation:
  language: ru
  text: 'И было так: в тридцатый год[a], в четвёртом месяце, в пятый день месяца, когда я находился среди изгнанников у реки Кевар[b], раскрылись небеса, и я увидел видения Бога[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Неясно, от какого события отсчитывается «тридцатый год»; возможно, речь идёт о возрасте Иезекииля или о неизвестной нам системе датировки.
    reason: historical_ambiguity
  - marker: b
    text: 'Возможно также: «у канала Кевар». В еврейском тексте сказано «река Кевар», однако этот водный путь мог быть крупным каналом в Вавилонии.'
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «видения от Бога» или «божественные видения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Передаёт повествовательное введение без добавления отсутствующего в еврейском явного наречия «теперь»; сохраняет торжественный, но понятный регистр.
- source_word: בִּשְׁלֹשִׁים שָׁנָה
  choice: в тридцатый год
  rationale: Еврейская временная формула обозначает датировку по году; порядковое числительное естественно передаёт её по-русски. Точка отсчёта в стихе не названа.
- source_word: בָּרְבִיעִי
  choice: в четвёртом месяце
  rationale: Существительное «месяц» подразумевается формулой датировки и восполняется для ясности.
- source_word: בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: в пятый день месяца
  rationale: Стандартная еврейская формула даты; слово «день» подразумевается и естественно восполняется в русском.
- source_word: וַאֲנִי בְתוֹךְ הַגּוֹלָה
  choice: когда я находился среди изгнанников
  rationale: Местоименная конструкция задаёт сопутствующее обстоятельство; «среди изгнанников» ясно обозначает общину переселённых.
- source_word: עַל נְהַר כְּבָר
  choice: у реки Кевар
  rationale: עַל при названии водного пути здесь означает местонахождение возле него; נהר передано как «река», а возможная идентификация с каналом отмечена в сноске.
- source_word: נִפְתְּחוּ הַשָּׁמַיִם
  choice: раскрылись небеса
  rationale: Естественная русская конструкция сохраняет множественное «небеса» и возвышенный характер описания видения.
- source_word: וָאֶרְאֶה
  choice: и я увидел
  rationale: Передаёт простое повествовательное продолжение.
- source_word: מַרְאוֹת אֱלֹהִים
  choice: видения Бога
  rationale: 'Буквальная родительная конструкция сохраняет неоднозначность: это могут быть видения Бога, видения от Бога или божественные видения.'
theological_decisions:
- issue: Значение родительной конструкции מַרְאוֹת אֱלֹהִים
  choice: видения Бога
  alternative: «видения от Бога» или «божественные видения»
  rationale: Еврейская конструкция допускает различное понимание отношения между «видениями» и «Богом». Основной текст не уточняет источник, содержание или качество видений сверх сказанного в оригинале.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «И было» сохраняет характер повествовательного начала, а «раскрылись небеса» звучит естественно и образно. Маркеры сносок поставлены непосредственно при неоднозначных выражениях; ошибочная привязка английской сноски о канале к «тридцатому году» не воспроизведена.
