source:
  edition: WLC
  text: וּ/דְמ֣וּת פְּנֵי/הֶם֮ פְּנֵ֣י אָדָם֒ וּ/פְנֵ֨י אַרְיֵ֤ה אֶל הַ/יָּמִין֙ לְ/אַרְבַּעְתָּ֔/ם וּ/פְנֵי שׁ֥וֹר מֵֽ/הַ/שְּׂמֹ֖אול לְ/אַרְבַּעְתָּ֑/ן וּ/פְנֵי נֶ֖שֶׁר לְ/אַרְבַּעְתָּֽ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/010.yaml
  text: 'As for the likeness of their faces: each had a human face; the four had a lion’s face on the right side[a], the four had an ox’s face on the left side, and the four had an eagle’s face.'
translation:
  language: ru
  text: 'Облик их лиц был таков: у каждого было лицо человека; у всех четырёх с правой стороны было лицо льва, с левой — лицо быка, и у всех четырёх — лицо орла[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грифа»; еврейское слово не́шер может обозначать крупную хищную птицу более широко.'
    reason: Сохранение лексической неоднозначности названия птицы.
lexical_decisions:
- source_word: וּדְמוּת פְּנֵיהֶם
  choice: Облик их лиц был таков
  rationale: דְּמוּת обозначает подобие, облик или форму. Эта формулировка естественно вводит описание лиц и сохраняет зрительный характер видения.
- source_word: פְּנֵי אָדָם
  choice: лицо человека
  rationale: אָדָם здесь указывает на человеческий облик в противопоставлении облику животных, а не подчёркивает мужской пол.
- source_word: אֶל הַיָּמִין
  choice: с правой стороны
  rationale: Оборот обозначает расположение львиного лица справа и естественно передаётся по-русски как «с правой стороны».
- source_word: לְאַרְבַּעְתָּם / לְאַרְבַּעְתָּן
  choice: у всех четырёх
  rationale: 'Фраза имеет распределительное значение: соответствующее лицо было у каждого из четырёх существ. Колебание рода местоименных суффиксов не отражено, поскольку по-русски оно не добавляет смыслового различия.'
- source_word: שׁוֹר
  choice: бык
  rationale: שׁוֹר обозначает крупное животное из рода рогатого скота; «бык» — точный и понятный русский эквивалент в данном перечне лиц.
- source_word: מֵהַשְּׂמֹאול
  choice: с левой стороны
  rationale: Хотя предлог буквально может означать «от», здесь сочетание описывает положение лица быка слева.
- source_word: נֶשֶׁר
  choice: орёл
  rationale: נֶשֶׁר традиционно и уместно передаётся как «орёл», однако слово может шире обозначать крупную хищную птицу, в том числе грифа; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение אָדָם в описании лиц живых существ
  choice: лицо человека
  alternative: лицо мужчины
  rationale: В контексте противопоставляются человеческое и звериные лица; указания на мужской пол нет. «Человек» сохраняет родовое значение אָדָם без внесения лишней специфики.
translation_notes:
  register: Современный литературный русский язык; торжественность пророческого видения сохранена без архаизмов. Параллельная структура оригинала передана ясно, с умеренным устранением повторов ради естественного русского синтаксиса.
