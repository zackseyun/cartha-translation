  terminology: '«Яхве», «слово Яхве», «священник», «халдеи» и «Кевар» уместны. Сноску о водоёме следует формулировать осторожно: идентификация Кевара с каналом вероятна, но не бесспорна; основной текст правомерно сохраняет «река».'
