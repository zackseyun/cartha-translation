  text: הָיֹ֣ה הָיָ֣ה דְבַר יְ֠הוָה אֶל יְחֶזְקֵ֨אל בֶּן בּוּזִ֧י הַ/כֹּהֵ֛ן בְּ/אֶ֥רֶץ כַּשְׂדִּ֖ים עַל נְהַר כְּבָ֑ר וַ/תְּהִ֥י עָלָ֛י/ו שָׁ֖ם יַד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/003.yaml
  text: the word of Yahweh came indeed to Ezekiel son of Buzi[a], the priest, in the land of the Chaldeans by the Kebar River[c][b], and there the hand of Yahweh came upon him.
translation:
  language: ru
  text: Слово Яхве действительно пришло[a] к Иезекиилю, сыну Вузия, священнику, в земле халдеев[b], у реки Кевар[c], и там рука Яхве была на нём[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст повторяет глагольную форму для усиления утверждения: слово Яхве несомненно пришло к Иезекиилю.'
    reason: lexical_alternative
  - marker: b
    text: То есть в Вавилонии; буквально — «в земле халдеев».
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово обычно передаётся как «река»; возможно, Кевар был каналом.
    reason: historical_geographical_clarification
  - marker: d
    text: 'Буквально: «и была на нём там рука Яхве». Этот образ обозначает могущественное воздействие Бога на пророка, не уточняя его характера.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיֹה הָיָה
  choice: действительно пришло
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение. «Действительно пришло» естественно передаёт это усиление по-русски, не воспроизводя неестественное буквальное повторение.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет устойчивую пророческую формулу и богословскую насыщенность выражения, не сужая его до более толковательного «послание».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: יְחֶזְקֵאל בֶּן בּוּזִי הַכֹּהֵן
  choice: Иезекиилю, сыну Вузия, священнику
  rationale: Использованы закрепившиеся в русском языке формы имён; приложение «священнику» оставлено при Иезекииле, как наиболее естественное понимание еврейской конструкции.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: в земле халдеев
  rationale: Формально сохраняется этноним «халдеи», который в данном контексте обозначает Вавилонию и её жителей.
- source_word: עַל נְהַר כְּבָר
  choice: у реки Кевар
  rationale: Предлог передан локативно; «Кевар» — современная русская транслитерация. Родовое обозначение «река» сохранено в основном тексте, а возможное понимание как канала отмечено в сноске.
- source_word: וַתְּהִי עָלָיו שָׁם יַד יְהוָה
  choice: и там на нём была рука Яхве
  rationale: Сохранена телесная метафора «рука Яхве», обозначающая непосредственное могущественное воздействие Бога на пророка, без сведения её смысла только к силе, вдохновению или принуждению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Пророческий оборот «рука Яхве»
  choice: 'сохранить образ: «на нём была рука Яхве»'
  alternative: «сила Яхве сошла на него»
  rationale: Буквальный образ допускает оттенки силы, власти, пророческого побуждения и переживания Божьего присутствия. Более объяснительный перевод неоправданно сузил бы смысл.
- issue: К кому относится определение «священник»
  choice: к Иезекиилю
  alternative: к Вузию
  rationale: Артикль и синтаксическое положение допускают обсуждение связи приложения, однако традиционно и наиболее вероятно оно характеризует Иезекииля. Формулировка сохраняет естественную для русского текста аппозицию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис сделан ясным для обычного читателя; при этом сохранены ключевые библейские образы «слово Яхве» и «рука Яхве», а эмфатическая еврейская конструкция передана естественным наречием «действительно».
