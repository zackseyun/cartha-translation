base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/016.yaml
  text: The appearance of the wheels and their workmanship was like the gleam of beryl[a], and the four of them had the same likeness; and their appearance and their workmanship were as if a wheel were within a wheel.
translation:
  language: ru
  text: Вид колёс и их устройство были подобны блеску камня таршиш[a]. Все четыре имели один и тот же облик; видом и устройством они были таковы, словно колесо находилось внутри колеса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Таршиш — драгоценный камень, точный вид которого неизвестен; его традиционно отождествляют с хризолитом или бериллом.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה הָאוֹפַנִּים
  choice: вид колёс
  rationale: מַרְאֶה обозначает видимый облик или то, как нечто выглядит; «вид» естественно передаёт это значение в описании видения.
- source_word: וּמַעֲשֵׂיהֶם
  choice: их устройство
  rationale: מַעֲשֶׂה здесь относится к тому, как колёса сделаны или устроены. «Устройство» ясно передаёт конструктивный смысл и сохраняется при повторе.
- source_word: כְּעֵין תַּרְשִׁישׁ
  choice: подобны блеску камня таршиш
  rationale: כְּעֵין в контексте драгоценного камня указывает на видимое качество, цвет или сияние. Точное отождествление תַּרְשִׁישׁ неизвестно, поэтому транслитерация в тексте не создаёт ложной определённости.
- source_word: וּדְמוּת אֶחָד לְאַרְבַּעְתָּן
  choice: Все четыре имели один и тот же облик
  rationale: Сжатое еврейское выражение буквально означает «и один облик у четырёх их». Русская формулировка естественно передаёт одинаковость всех четырёх колёс.
- source_word: וּמַרְאֵיהֶם וּמַעֲשֵׂיהֶם
  choice: по виду и устройству они
  rationale: Сохранены повтор ключевых понятий и параллелизм оригинала, но фраза перестроена в соответствии с нормами современного русского языка.
- source_word: כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: словно колесо внутри колеса
  rationale: Формулировка сохраняет сравнительный и зрительно загадочный характер описания, не уточняя геометрию колёс сверх сказанного в оригинале.
theological_decisions:
- issue: Пространственная конфигурация «колесо внутри колеса»
  choice: Сохранить образ без поясняющего истолкования
  alternative: Уточнить как пересекающиеся или расположенные одно в другом колёса
  rationale: Еврейский текст не определяет точную механическую или геометрическую конфигурацию; её конкретизация устранила бы подлинную неоднозначность видения.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой. Повторы «вид/устройство» сохранены ради структуры оригинала; буквальное название неидентифицированного камня сопровождается сноской.
