  terminology: '«Дух» — допустимый основной вариант для רוּחַ; сноска корректно сохраняет варианты «ветер» и «дыхание» и отмечает формальное единственное число הַחַיָּה. Не следует подменять это собирательное единственное число основным множественным без необходимости: «дух живого существа» с поясняющей сноской точнее отражает источник.'
