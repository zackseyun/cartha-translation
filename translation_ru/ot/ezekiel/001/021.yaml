  text: בְּ/לֶכְתָּ֣/ם יֵלֵ֔כוּ וּ/בְ/עָמְדָ֖/ם יַֽעֲמֹ֑דוּ וּֽ/בְ/הִנָּשְׂאָ֞/ם מֵ/עַ֣ל הָ/אָ֗רֶץ יִנָּשְׂא֤וּ הָ/אֽוֹפַנִּים֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/021.yaml
  text: When they went[a], these went; and when they stood, these stood; and when they were lifted up from above the earth, the wheels were lifted up alongside them[c][b], for the spirit of the living creatures was in the wheels.
translation:
  language: ru
  text: Когда они шли, шли и колёса; когда они останавливались, останавливались и колёса; когда они были подняты над землёй, колёса были подняты рядом с ними, потому что дух живого существа[a] был в колёсах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дух живого существа». Единственное число, вероятно, употреблено собирательно и относится к живым существам видения. Еврейское слово רוּחַ может также означать «ветер» или «дыхание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתָּם ... יֵלֵכוּ
  choice: Когда они шли, шли и колёса
  rationale: Конструкция с בְּ и инфинитивом имеет временное значение. Явное «колёса» естественно передаёт подразумеваемый субъект второго глагола из контекста и устраняет неясное русское «эти».
- source_word: וּבְעָמְדָם יַעֲמֹדוּ
  choice: когда они останавливались, останавливались и колёса
  rationale: עמד буквально означает «стоять», но в противопоставлении движению естественное русское «останавливаться» точно передаёт прекращение движения и сохраняет параллелизм.
- source_word: וּבְהִנָּשְׂאָם מֵעַל הָאָרֶץ
  choice: когда они поднимались над землёй
  rationale: Нифаль נשׂא передаёт подъём; по-русски непереходное «поднимались» естественно сохраняет смысл, не определяя внешнего деятеля. מֵעַל указывает на движение вверх из положения у поверхности земли.
- source_word: יִנָּשְׂאוּ הָאוֹפַנִּים
  choice: поднимались и колёса
  rationale: Повтор того же русского глагола сохраняет тесную словесную связь с подъёмом живых существ.
- source_word: לְעֻמָּתָם
  choice: вместе с ними
  rationale: В данном контексте выражение обозначает согласованное положение и движение колёс по отношению к существам; «вместе с ними» звучит естественно и не навязывает пространственного значения «напротив».
- source_word: כִּי רוּחַ הַחַיָּה בָּאוֹפַנִּים
  choice: потому что дух живых существ был в колёсах
  rationale: כִּי вводит причину согласованного движения. רוּחַ передано как «дух», а единственное הַחַיָּה — контекстуальным множественным числом, поскольку речь идёт о четырёх живых существах как единой группе.
theological_decisions:
- issue: Значение רוּחַ в видении
  choice: дух
  alternative: ветер; дыхание
  rationale: Здесь слово, вероятнее всего, обозначает оживляющее начало, объясняющее согласованное движение существ и колёс. «Дух» сохраняет эту мысль, но не отождествляет его прямо со Святым Духом; многозначность еврейского слова отмечена в сноске.
- issue: Число הַחַיָּה
  choice: живых существ
  alternative: живого существа; живого создания
  rationale: Хотя еврейская форма грамматически единственного числа, в контексте она, вероятно, имеет собирательное значение и относится к четырём существам как единой реальности. Русское множественное число делает референцию понятной, а формальная особенность источника сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Повтор глаголов сохраняет ритмический параллелизм еврейского текста; синтаксис сделан естественным для обычного читателя.
