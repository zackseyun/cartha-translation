  source_fidelity: 'В целом смысл передан верно: параллельное движение живых существ и колёс, их подъём и объяснение через «дух ... в колёсах» сохранены. Однако «вместе с ними» ослабляет пространственно-соотносительное לְעֻמָּתָם; безопаснее «рядом с ними». Кроме того, в двух случаях נִשָּׂא передано непереходным «поднимались», тогда как форма Нифаль сохраняет оттенок пассивного «были подняты».'
