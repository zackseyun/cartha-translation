  text: וְ/אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵ֑כוּ אֶ֣ל אֲשֶׁר֩ יִֽהְיֶה שָׁ֨מָּ/ה הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/012.yaml
  text: And each one went straight ahead[a]. Wherever the spirit was to go, they went[b]; they did not turn as they went.
translation:
  language: ru
  text: И каждое из них шло прямо вперёд[a]. Куда направлялся дух[b], туда они и шли; на ходу они не поворачивали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в направлении своего лица».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ветер»; возможно: «Дух». Еврейское слово רוּחַ может означать «дух», «ветер» или «дыхание», и здесь его референт прямо не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ
  choice: И каждое из них
  rationale: Слово אִישׁ употреблено распределительно по отношению к четырём живым существам. Такая передача сохраняет единственное число и не создаёт впечатления, будто речь непременно идёт о людях.
- source_word: אֶל עֵבֶר פָּנָיו
  choice: прямо вперёд
  rationale: Буквально выражение указывает на направление лица каждого существа; в данном контексте естественная русская передача — движение прямо перед собой.
- source_word: יֵלֵכוּ
  choice: шло / шли
  rationale: Имперфект в описании видения передаёт продолжающееся или характерное действие в прошлом; русское прошедшее время естественно для повествования.
- source_word: אֶל אֲשֶׁר יִהְיֶה שָׁמָּה הָרוּחַ לָלֶכֶת
  choice: Куда надлежало идти духу, туда они и шли
  rationale: Формулировка передаёт заданное направление движения и сохраняет дух как отдельный, но прямо не отождествлённый референт.
- source_word: הָרוּחַ
  choice: духу
  rationale: רוּחַ может означать «дух», «ветер» или «дыхание». Строчная буква не навязывает прямого отождествления со Святым Духом.
- source_word: לֹא יִסַּבּוּ
  choice: не поворачивали
  rationale: Форма глагола סבב обозначает поворот или изменение направления; выбран прямой и естественный русский эквивалент.
- source_word: בְּלֶכְתָּן
  choice: на ходу
  rationale: Инфинитивная конструкция с בְּ обозначает одновременность действия; «на ходу» кратко и естественно передаёт этот временной оттенок.
theological_decisions:
- issue: Следует ли понимать הָרוּחַ как прямое указание на Святого Духа
  choice: дух
  alternative: Дух; ветер
  rationale: Еврейский текст не отождествляет этот референт прямо со Святым Духом. Строчная буква и примечание сохраняют смысловую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Местоименная конструкция «каждое из них» согласована с живыми существами из ближайшего контекста. Маркеры примечаний поставлены при тех выражениях, к которым относятся.
