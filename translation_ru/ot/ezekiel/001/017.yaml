lexical_decisions:
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶן
  choice: в любую из четырёх сторон
  rationale: Сочетание буквально указывает на «четыре стороны/четверти»; в контексте движения естественное русское выражение передаёт возможные направления, не устраняя отмеченную в сноске пространственную неоднозначность.
- source_word: בְּלֶכְתָּם
  choice: когда они двигались
  rationale: Инфинитивная конструкция с ב выражает одновременность; современная формулировка сохраняет временное значение.
- source_word: יֵלֵכוּ
  choice: шли
  rationale: Имперфект описывает характерное действие в видении; несовершенный вид естественно передаёт продолжающееся или повторяющееся движение.
- source_word: לֹא יִסַּבּוּ
  choice: не поворачивали
  rationale: Передаёт отрицание изменения курса без добавочного толкования.
- source_word: בְּלֶכְתָּן
  choice: во время движения
  rationale: Сохраняет одновременность второй инфинитивной конструкции и позволяет естественно передать смену рода местоименного суффикса в еврейском тексте без искусственной русской формулировки.
