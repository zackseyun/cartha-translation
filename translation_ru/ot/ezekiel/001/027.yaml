base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/027.yaml
  text: And I saw something like the appearance of glowing metal[a], like the appearance of fire all around within it, from the appearance of his waist and upward; and from the appearance of his waist and downward I saw something like the appearance of fire[b], and brightness all around him.
translation:
  language: ru
  text: И увидел я нечто, подобное сияющему металлу[a], словно огонь, заключённый со всех сторон[b], — от вида его чресл и выше; а от вида его чресл и ниже увидел я нечто, похожее на огонь, и вокруг него было сияние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение еврейского слова חַשְׁמַל (хашмал) неясно; возможны также переводы «янтарь» или «электрум» — яркий металлический сплав.
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение בֵּית לָהּ סָבִיב трудно для перевода. Оно может описывать огонь как находящийся внутри окружающего его сияния или некоего обрамления.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵין
  choice: нечто, подобное
  rationale: Сравнительная конструкция передаёт осторожный язык видения и не отождествляет увиденное с самим предметом сравнения.
- source_word: חַשְׁמַל
  choice: сияющий металл
  rationale: Редкое слово имеет неясное значение; такой перевод естественно передаёт вероятный образ ярко сияющего металла, не сужая его до янтаря или конкретного сплава.
- source_word: כְּמַרְאֵה
  choice: подобное / выглядело как
  rationale: Вариативный естественный перевод сохраняет повторяющийся феноменологический язык видения без тяжеловесного буквального повторения слова «вид».
- source_word: בֵּית לָהּ סָבִיב
  choice: который был внутри него со всех сторон
  rationale: Трудная фраза буквально указывает на внутреннее расположение огня вокруг/со всех сторон; перевод сохраняет пространственную неоднозначность и не вводит отсутствующий в тексте «футляр».
- source_word: מָתְנָיו
  choice: его пояс
  rationale: «Пояс» обозначает область талии и звучит современно и достойно; мужской суффикс сохранён.
- source_word: וְנֹגַהּ לוֹ סָבִיב
  choice: и сияние было вокруг него
  rationale: נֹגַהּ означает сияние или яркий свет; мужское местоимение отражает грамматику еврейского текста и человекоподобный образ контекста.
theological_decisions:
- issue: Референт человекоподобного описания
  choice: «его пояс» и «вокруг него»
  alternative: безличные формы «его середина» / «вокруг этого»
  rationale: Мужские суффиксы единственного числа и ближайший контекст поддерживают личные местоимения, но перевод не отождествляет фигуру точнее, чем это делает само видение.
- issue: Степень определённости образов видения
  choice: сохранить формулы сравнения «нечто, подобное» и «выглядело как»
  alternative: прямо назвать увиденное металлом, огнём и телесным поясом
  rationale: Еврейский текст настойчиво использует язык подобия и видимости; его устранение неоправданно разрешило бы присущую видению неопределённость.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным повествовательным строем. Повторы и пространственная симметрия еврейского текста в основном сохранены; синтаксис слегка сглажен ради ясности.
