  text: וּ/דְמ֨וּת הַ/חַיּ֜וֹת מַרְאֵי/הֶ֣ם כְּ/גַחֲלֵי אֵ֗שׁ בֹּֽעֲרוֹת֙ כְּ/מַרְאֵ֣ה הַ/לַּפִּדִ֔ים הִ֕יא מִתְהַלֶּ֖כֶת בֵּ֣ין הַ/חַיּ֑וֹת וְ/נֹ֣גַהּ לָ/אֵ֔שׁ וּ/מִן הָ/אֵ֖שׁ יוֹצֵ֥א בָרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/013.yaml
  text: And as for the likeness of the living creatures[a], their appearance was like burning coals of fire, like the appearance of torches; it was moving about among the living creatures, and the fire had brightness[c][b], and from the fire lightning was coming forth.
translation:
  language: ru
  text: Что касается образа живых существ, то по виду они были подобны горящим углям[a], подобны факелам. Оно двигалось среди живых существ[b]; огонь сиял[c], и из огня исходила молния.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как раскалённые огненные угли»; возможен также перевод: «как огненные угли, которые пылали».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ходило туда и сюда среди живых существ». Местоимение может относиться к огню либо шире — ко всему описанному огненному явлению.'
    reason: lexical_and_referential_ambiguity
  - marker: c
    text: 'Буквально: «и сияние — у огня»; смысл в том, что огонь излучал сияние.'
    reason: literal_wording
lexical_decisions:
- source_word: וּדְמוּת הַחַיּוֹת מַרְאֵיהֶם
  choice: Что же до подобия живых существ, то видом они были
  rationale: Передаёт и דְמוּת («подобие, облик»), и מַרְאֵיהֶם («их вид»), сохраняя характерное для еврейского текста двойное описание, но оформляя его естественно по-русски.
- source_word: כְּגַחֲלֵי אֵשׁ בֹּעֲרוֹת
  choice: как горящие огненные угли
  rationale: Сохраняет образ углей огня и значение активного горения в причастии בֹּעֲרוֹת.
- source_word: כְּמַרְאֵה הַלַּפִּדִים
  choice: как факелы
  rationale: Краткое русское сравнение естественно передаёт значение לַפִּידִים; повтор слова «вид» здесь сделал бы фразу тяжеловесной.
- source_word: הִיא מִתְהַלֶּכֶת
  choice: Оно двигалось
  rationale: Нейтральное «оно» указывает на описанное огненное явление в целом, не определяя точнее спорный антецедент местоимения; «двигалось» передаёт продолжающееся или повторяющееся движение.
- source_word: בֵּין הַחַיּוֹת
  choice: среди живых существ
  rationale: При множественном собирательном референте «среди» естественно передаёт движение в их окружении.
- source_word: וְנֹגַהּ לָאֵשׁ
  choice: огонь сиял
  rationale: Идиоматично выражает еврейскую конструкцию «у огня было сияние», сохраняя образ излучающего свет огня.
- source_word: וּמִן הָאֵשׁ יוֹצֵא בָרָק
  choice: и из огня исходила молния
  rationale: Причастие יוֹצֵא передано несовершенным видом, отражающим наблюдаемое продолжающееся действие; בָרָק прямо передано словом «молния».
theological_decisions:
- issue: К чему относится местоимение הִיא в описании видения
  choice: Передано нейтральным «оно», относящимся к огненному явлению в целом.
  alternative: Можно понимать местоимение как относящееся непосредственно к огню либо к подобию/облику живых существ.
  rationale: Контекст продолжает описание огня, однако грамматика не позволяет безусловно установить точный референт. Нейтральная формулировка не превращает явление в отдельное существо и сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной повествовательной интонацией. Сохранены повтор образа огня, зрительная динамика видения и неоднозначность референта местоимения.
