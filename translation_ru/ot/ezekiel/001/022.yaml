    text: В еврейском тексте здесь стоит форма единственного числа с собирательным значением; далее говорится «их головами».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: А ... было подобие
  rationale: Сохранено значение сходства или образа, важное для осторожного, аналогического описания видения; союз передан как «А», чтобы продолжить последовательность повествования.
- source_word: הַחַיָּה
  choice: живых существ
  rationale: Форма единственного числа употреблена собирательно, что подтверждается последующим множественным суффиксом «их»; по-русски естественно употребить множественное число.
- source_word: רָקִיעַ
  choice: свода
  rationale: «Свод» передаёт образ распростёртой над существами поверхности и остаётся понятным современному читателю; более буквальное «пространство» здесь менее наглядно.
- source_word: כְּעֵין
  choice: по виду — словно
  rationale: Формулировка сохраняет зрительное уподобление, не превращая увиденное в прямое отождествление.
- source_word: הַקֶּרַח
  choice: лёд
  rationale: Обычное значение еврейского существительного — «лёд»; традиционное «кристалл» отмечено в сноске.
- source_word: הַנּוֹרָא
  choice: внушающий трепет
  rationale: Передаёт сочетание страха и благоговейного изумления, не сужая значение до одного лишь ужаса.
- source_word: נָטוּי
  choice: простёртого
  rationale: Пассивное причастие описывает свод как распростёртый или натянутый над головами существ.
- source_word: מִלְמָעְלָה
  choice: вверху
  rationale: Сохранён вертикальный акцент исходного текста, хотя в русском он отчасти повторяет уже сказанное «над их головами».
theological_decisions:
- issue: Аналогический язык видения
  choice: 'Сохранить последовательные указания на подобие и зрительное сходство: «подобие», «по виду», «словно».'
  alternative: 'Сгладить фразу до прямого описания: «над их головами был свод из ослепительного льда».'
  rationale: Иезекииль описывает видение осторожно и не отождествляет увиденное непосредственно с названными предметами; сохранение этих оговорок не усиливает утверждение сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой. Синтаксис сохраняет повторяющийся вертикальный образ и многослойность пророческого сравнения, не делая фразу излишне архаичной.
