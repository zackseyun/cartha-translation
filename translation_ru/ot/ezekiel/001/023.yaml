  yaml_path: translation/ot/ezekiel/001/023.yaml
  text: And under the expanse their wings were straight[a], each one toward her sister. Each had two covering them[b], and each had two covering their bodies.
translation:
  language: ru
  text: А под сводом их крылья были выпрямлены, одно к другому[a]. У каждого было по два крыла, покрывавших их, и по два крыла, покрывавших их тела[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «женщина к своей сестре»; формы женского рода относятся к слову «крылья», которое в еврейском языке женского рода.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская конструкция трудна: местоимение в выражении «покрывавших их» имеет женский род и в контексте обычно понимается как относящееся к живым существам. Повторённая фраза затем уточняет: «покрывавших их тела».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְתַחַת הָרָקִיעַ
  choice: А под сводом
  rationale: Сочетание союза и предлога продолжает описание видения и указывает положение под ракиа; «свод» естественно передаёт образ протяжённой куполообразной поверхности.
- source_word: כַּנְפֵיהֶם יְשָׁרוֹת
  choice: их крылья были расправлены прямо
  rationale: יְשָׁרוֹת выражает прямизну или ровную направленность крыльев; «расправлены прямо» естественно связывает признак с последующим указанием их взаимной ориентации.
- source_word: אִשָּׁה אֶל־אֲחוֹתָהּ
  choice: одно к другому
  rationale: Буквально употреблена женская формула «женщина к своей сестре», согласованная с грамматически женским «крылья»; по-русски идиоматическое «одно к другому» сохраняет взаимное соответствие без неуместной персонификации.
- source_word: לְאִישׁ שְׁתַּיִם
  choice: у каждого два крыла
  rationale: לְאִישׁ имеет распределительное значение «у каждого»; существительное «крыла» восстановлено из контекста для ясности.
- source_word: מְכַסּוֹת לָהֵנָּה
  choice: покрывали его с одной стороны
  rationale: Необычное לָהֵנָּה, вероятно, имеет локальное значение «с этой стороны / здесь»; перевод сохраняет пространственное противопоставление повторённым формам, не отождествляя местоимение с прямым дополнением.
- source_word: אֵת גְּוִיֹּתֵיהֶם
  choice: его тело
  rationale: גְּוִיָּה здесь означает тело живого существа, а не труп; распределительное единственное число по-русски согласуется с «у каждого».
