id: EZK.1.20
reference: Ezekiel 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַ֣ל אֲשֶׁר֩ יִֽהְיֶה שָּׁ֨ם הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ שָׁ֥מָּ/ה הָ/ר֖וּחַ לָ/לֶ֑כֶת וְ/הָ/אוֹפַנִּ֗ים יִנָּשְׂאוּ֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/020.yaml
  text: Wherever the spirit wanted to go[a], they went there; and the wheels were lifted up alongside them[c][b], because the spirit of the living creature was in the wheels.
translation:
  language: ru
  text: Куда бы дух[a][c] ни направлялся, туда шли и они; и колёса поднимались рядом с ними[b], потому что дух живого существа был в колёсах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер» или «дыхание»; еврейское רוּחַ допускает все эти значения. Здесь слово обозначает оживляющий или направляющий дух в видении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «напротив них» или «соответственно им».'
    reason: lexical_alternative
  - marker: c
    text: Некоторые понимают здесь слово «дух» как указание на Духа Божьего, однако еврейский текст прямо этого не уточняет.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרוּחַ / רוּחַ
  choice: дух / дух
  rationale: Слово רוּחַ может означать «дух», «ветер» или «дыхание». В контексте видения оно обозначает оживляющее и направляющее начало; написание со строчной буквы не навязывает отождествление с Духом Божьим.
- source_word: עַל אֲשֶׁר יִהְיֶה שָּׁם
  choice: куда бы ... ни
  rationale: Оборот вводит неопределённое придаточное места и направления; русская конструкция «куда бы ... ни» естественно передаёт значение «куда бы то ни было».
- source_word: לָלֶכֶת ... יֵלֵכוּ
  choice: ни направлялся ... шли
  rationale: Инфинитив при רוּחַ указывает на направление движения, а личная форма — на движение живых существ. «Направлялся» звучит естественно и не усиливает волевой оттенок сверх необходимого.
- source_word: שָׁמָּה
  choice: туда
  rationale: Наречие имеет направительное значение и естественно соответствует глаголу движения.
- source_word: הָאוֹפַנִּים
  choice: колёса
  rationale: Речь идёт о колёсах, описанных в видении; это прямой и ясный русский эквивалент.
- source_word: יִנָּשְׂאוּ
  choice: поднимались
  rationale: Нифаль от נשׂא передаёт значение подъёма. Русская возвратная форма сохраняет непереходное/пассивное звучание без указания на деятеля.
- source_word: לְעֻמָּתָם
  choice: рядом с ними
  rationale: В данном контексте выражение обозначает соответствующее положение колёс при живых существах; возможны также значения «напротив них» и «соответственно им».
- source_word: הַחַיָּה
  choice: живого существа
  rationale: Сохранено грамматическое единственное число еврейского текста, хотя в более широком контексте видения представлены несколько живых существ.
theological_decisions:
- issue: Следует ли понимать רוּחַ как прямое указание на Духа Божьего
  choice: «дух» со строчной буквы
  alternative: «Дух» как обозначение Духа Божьего
  rationale: Еврейский текст прямо не отождествляет этот дух с Духом Божьим. Строчная буква сохраняет смысловую и богословскую открытость текста.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. Конструкция «куда бы ... ни» передаёт неопределённость направления, а повтор слова «дух» сохраняет связь между движением живых существ и колёс.
