  text: כְּ/מַרְאֵ֣ה הַ/קֶּ֡שֶׁת אֲשֶׁר֩ יִֽהְיֶ֨ה בֶ/עָנָ֜ן בְּ/י֣וֹם הַ/גֶּ֗שֶׁם כֵּ֣ן מַרְאֵ֤ה הַ/נֹּ֨גַהּ֙ סָבִ֔יב ה֕וּא מַרְאֵ֖ה דְּמ֣וּת כְּבוֹד יְהוָ֑ה וָֽ/אֶרְאֶה֙ וָ/אֶפֹּ֣ל עַל פָּנַ֔/י וָ/אֶשְׁמַ֖ע ק֥וֹל מְדַבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/028.yaml
  text: Like the appearance of the rainbow that is in the cloud on a day of rain[a], so was the appearance of the brightness all around. This was the appearance of the likeness of the glory of Yahweh. When I saw it, I fell on my face[d][c][b], and I heard the voice of one speaking.
translation:
  language: ru
  text: Каков вид радуги[a], появляющейся в облаке в дождливый день, таков был вид сияния вокруг[b]. Это был вид подобия славы Яхве[c]. Увидев это, я пал ниц и услышал голос говорящего[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лук»; здесь, в контексте облака и дождя, имеется в виду радуга.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «блеск», «яркое свечение».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «вид подобия славы Яхве». Нагромождение слов «вид», «подобие» и «слава» сохраняет осторожность, с которой Иезекииль описывает увиденное.'
    reason: cultural_note
  - marker: d
    text: 'Или: «услышал голос, который говорил». Древнееврейский текст здесь прямо не называет говорящего.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמַרְאֵה
  choice: Как выглядит
  rationale: Передаёт сравнение и зрительный характер מַרְאֶה естественным современным русским оборотом, не устраняя повторное указание на видимое явление.
- source_word: הַקֶּשֶׁת
  choice: радуга
  rationale: Буквально существительное означает «лук», но в контексте облака и дождя однозначно обозначает радугу.
- source_word: אֲשֶׁר יִהְיֶה בֶעָנָן בְּיוֹם הַגֶּשֶׁם
  choice: бывающая в облаке в день дождя
  rationale: Сохраняет обычное для текста описание радуги в облаке во время дождя, оставаясь понятным по-русски.
- source_word: כֵּן מַרְאֵה הַנֹּגַהּ סָבִיב
  choice: так выглядело сияние вокруг
  rationale: נֹגַהּ означает яркость, блеск или сияние; «сияние» естественно передаёт окружающий свет и поддерживает образ видения.
- source_word: מַרְאֵה דְּמוּת כְּבוֹד יְהוָה
  choice: вид подобия славы Яхве
  rationale: Сохранена намеренная цепочка определений «вид — подобие — слава», которая выражает осторожность повествователя при описании божественного явления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: וָאֶרְאֶה וָאֶפֹּל עַל־פָּנַי
  choice: Увидев это, я пал ниц
  rationale: Деепричастный оборот естественно связывает увиденное с последующей реакцией; «пал ниц» точно и кратко передаёт древнееврейскую идиому падения на лицо.
- source_word: וָאֶשְׁמַע קוֹל מְדַבֵּר
  choice: услышал голос говорящего
  rationale: Передаёт קוֹל как «голос», а субстантивированное причастие не уточняет личность говорящего сверх сказанного в древнееврейском тексте.
theological_decisions:
- issue: Многослойное описание божественного явления
  choice: вид подобия славы Яхве
  alternative: подобие славы Яхве; вид славы Яхве
  rationale: Сохранение всех трёх звеньев не отождествляет увиденное напрямую с сущностью Бога и удерживает присущую видению богословскую сдержанность.
- issue: Личность говорящего в заключительной части стиха
  choice: голос говорящего
  alternative: говорящий голос; голос Того, Кто говорил
  rationale: Причастие מְדַבֵּר не называет говорящего. Выбранный вариант сохраняет эту неопределённость и не вносит в стих отсутствующую в нём идентификацию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Сравнение передано естественно, тогда как необычная многослойная формула «вид подобия славы» намеренно сохранена ради точности и богословской сдержанности оригинала.
