  text: And there was a sound from above the expanse that was over their heads[a]; when they stood still[b], they let down their wings.
translation:
  language: ru
  text: И послышался звук[a] сверху, над сводом[b], который был над их головами. Когда они останавливались, они опускали крылья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голос». Еврейское слово קוֹל может означать и звук, и голос; здесь ещё не сказано прямо, что это была речь.'
