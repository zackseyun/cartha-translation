lexical_decisions:
- source_word: וַיְהִי
  choice: И раздался
  rationale: Оборот вводит новое явление в последовательности видения. «Раздался» естественно сочетается со словом «звук» и передаёт его внезапное возникновение без архаичного «и было».
- source_word: קוֹל
  choice: звук
  rationale: Слово может означать как звук, так и голос. Здесь речь ещё не обозначена как членораздельная, поэтому «звук» сохраняет контекстуальную неопределённость; вариант «голос» отмечен в сноске.
- source_word: מֵעַל לָרָקִיעַ
  choice: сверху, над сводом
  rationale: מֵעַל указывает, что звук исходил из области выше свода. Такая формулировка ясно передаёт одновременно источник звука и пространственное положение, не превращая свод в непосредственный источник.
- source_word: רָקִיעַ
  choice: свод
  rationale: В описании видения это протяжённая поверхность над головами живых существ. «Свод» — современное, краткое и образное соответствие; возможное «пространство» дано в сноске, поскольку еврейское слово не обязательно обозначает арку.
- source_word: אֲשֶׁר עַל רֹאשָׁם
  choice: который был над их головами
  rationale: Относительное придаточное относится к своду и точно сохраняет пространственное описание оригинала.
- source_word: בְּעָמְדָם
  choice: когда они останавливались
  rationale: В контексте чередования движения и неподвижности речь идёт не просто о стоянии, а о прекращении движения.
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: то опускали крылья
  rationale: Глагол רפה передаёт ослабление или опускание. По-русски «опускали крылья» естественно описывает действие живых существ и сохраняет связь с их остановкой.
