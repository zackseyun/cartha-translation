source:
  edition: WLC
  text: זָקֵ֡ן בָּח֣וּר וּ/בְתוּלָה֩ וְ/טַ֨ף וְ/נָשִׁ֜ים תַּהַרְג֣וּ לְ/מַשְׁחִ֗ית וְ/עַל כָּל אִ֨ישׁ אֲשֶׁר עָלָ֤י/ו הַ/תָּו֙ אַל תִּגַּ֔שׁוּ וּ/מִ/מִּקְדָּשִׁ֖/י תָּחֵ֑לּוּ וַ/יָּחֵ֨לּוּ֙ בָּ/אֲנָשִׁ֣ים הַ/זְּקֵנִ֔ים אֲשֶׁ֖ר לִ/פְנֵ֥י הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/006.yaml
  text: Old man[a], young man, and virgin, and little children, and women—you shall kill them utterly. But do not come near anyone on whom is the mark, and begin at my sanctuary[b]. So they began with the old men who were before the house.
translation:
  language: ru
  text: Старика, юношу и девицу, малых детей и женщин — убивайте, предавая полному уничтожению. Но не приближайтесь ни к кому, на ком есть знак[a]. Начните с Моего святилища. И они начали со стариков[b], которые находились перед храмом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тав», название буквы; в данном контексте — защитная отметка, поставленная на верных (см. ст. 4).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «старейшин».'
    reason: alternative_reading
lexical_decisions:
- source_word: זָקֵן
  choice: старика
  rationale: Единственное число сохранено как распределительное обозначение возрастной группы и противопоставлено «юноше»; в конце стиха множественное число передано как «стариков».
- source_word: בָּחוּר
  choice: юношу
  rationale: Обозначает молодого мужчину в расцвете сил; воинский оттенок контекстом не требуется.
- source_word: בְתוּלָה
  choice: девицу
  rationale: Сохраняет прямое значение «девственница» в естественной для возвышенного повествования форме, не сводя его просто к возрасту или брачному статусу.
- source_word: טַף
  choice: малых детей
  rationale: Передаёт значение маленьких детей и сохраняет трагическую выразительность перечня.
- source_word: נָשִׁים
  choice: женщин
  rationale: В перечне групп населения требуется общее значение «женщины», а не «жёны».
- source_word: תַּהַרְגוּ לְמַשְׁחִית
  choice: убивайте без пощады
  rationale: Естественно передаёт повеление и усилительный смысл полного истребления, не используя тяжеловесное буквальное «убивайте на уничтожение».
- source_word: עַל כָּל אִישׁ
  choice: ни к кому
  rationale: В отрицательной конструкции естественно выражает распределительное «к любому человеку»; речь охватывает всякого, на ком есть знак.
- source_word: הַתָּו
  choice: знак
  rationale: В контексте это защитная отметка из предыдущего стиха; связь с названием буквы тав сохранена в примечании.
- source_word: אַל תִּגַּשׁוּ
  choice: не приближайтесь
  rationale: Сохраняет значение физического приближения и не усиливает его до «не прикасайтесь».
- source_word: וּמִמִּקְדָּשִׁי תָּחֵלּוּ
  choice: Начните с Моего святилища
  rationale: Передаёт исходную точку суда; «с» по-русски естественно соответствует еврейскому מִן при глаголе «начать».
- source_word: הַבָּיִת
  choice: храмом
  rationale: В данном видении «дом» обозначает храм; функциональный перевод устраняет ненужную для русского читателя двусмысленность места.
theological_decisions:
- issue: Передача הַתָּו как названия буквы или как защитной отметки
  choice: знак
  alternative: знак тав / буква тав
  rationale: Главный текст передаёт повествовательную функцию отметки, а буквальная лексическая связь с תו сохраняется в сноске без навязывания символического толкования.
- issue: 'Значение הַזְּקֵנִים в конце стиха: возраст или должность'
  choice: стариков
  alternative: старейшин
  rationale: Повтор корня זקן естественно отсылает к первой возрастной категории стиха, однако храмовый контекст допускает значение должности; подлинная неоднозначность отмечена в сноске.
- issue: Характер усиления לְמַשְׁחִית
  choice: без пощады
  alternative: предавайте уничтожению / истребляйте
  rationale: Фраза выражает беспощадность и доведение убийства до уничтожения; выбран современный, сильный и естественный русский оборот без добавления догматического смысла.
translation_notes:
  register: Современный литературный русский с достоинством пророческого повествования. Сохранена риторически заметная последовательность распределительных форм единственного числа («старика, юношу и девицу») с последующим переходом к множественным категориям. Заглавная буква в «Моего» указывает на речь Бога; «храм» естественно передаёт הַבַּיִת в непосредственном контексте святилища.
