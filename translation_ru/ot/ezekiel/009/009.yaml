base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/009.yaml
  text: Then he said to me[a], “The iniquity of the house of Israel and Judah is exceedingly great, and the land is filled with bloodshed, and the city is full of perversion. For they say, ‘Yahweh has forsaken the land, and Yahweh does not see.’”
translation:
  language: ru
  text: 'И Он сказал мне: «Вина дома Израиля и Иуды безмерно велика; земля наполнена кровопролитием, а город полон несправедливости[a]. Ведь они говорят: „Яхве оставил землю, Яхве не видит“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «извращения»; возможно: «искажённого правосудия». Еврейское слово указывает на искривление или извращение того, что правильно, и, вероятно, включает судебную несправедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺן
  choice: вина
  rationale: Существительное может обозначать беззаконие, вину или кару за него. Здесь речь идёт о нравственной виновности Израиля и Иуды; «вина» сохраняет эту смысловую широту и естественно сочетается с определением «велика».
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: дом Израиля и Иуды
  rationale: Сохранён корпоративный библейский образ «дом»; по синтаксису выражение охватывает Израиль и Иуду вместе.
- source_word: גָּדוֹל בִּמְאֹד מְאֹד
  choice: безмерно велика
  rationale: Двойное מְאֹד передаёт чрезвычайно сильное усиление; «безмерно» звучит естественно и достойно в современном русском.
- source_word: דָּמִים
  choice: кровопролитие
  rationale: Форма множественного числа здесь обозначает насильственное пролитие крови и связанную с ним кровавую вину, а не просто кровь как вещество.
- source_word: מֻטֶּה
  choice: беззаконие
  rationale: Редкое слово связано с уклонением, искривлением или извращением правого. «Беззаконие» естественно обозначает общественную неправду, не сводя смысл исключительно к судопроизводству; альтернативы указаны в примечании.
- source_word: עָזַב
  choice: оставил
  rationale: Глагол выражает утверждение жителей, будто Яхве покинул землю. «Оставил» точно и естественно передаёт действие, сохраняя возможность смысла «покинул/оставил без попечения».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: רֹאֶה
  choice: не видит
  rationale: Прямо передаёт причастную форму и отрицание Божьего надзора, которое высказывают жители.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте дважды стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл דָּמִים и מֻטֶּה в обвинительной речи
  choice: кровопролитие ... беззаконие
  alternative: кровь ... извращение; кровавая вина ... извращённое правосудие
  rationale: Формулировка передаёт насилие и общественную неправду, не ограничивая редкое מֻטֶּה исключительно техническим смыслом судебной несправедливости.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены корпоративное выражение «дом Израиля и Иуды», личное имя «Яхве» и трёхчастная структура обвинения. Маркер примечания поставлен непосредственно после спорного слова, а не после вводной формулы.
