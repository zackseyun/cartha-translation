base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/011.yaml
  text: And behold[a], the man clothed in linen, who had the writing case at his waist, brought back word, saying, “I have done as you commanded me.”
translation:
  language: ru
  text: 'И вот, человек, одетый в льняные одежды, у которого у пояса был футляр для письменных принадлежностей[a], доложил: «Я сделал, как ты повелел мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чернильница». Еврейское слово обозначает носимый у пояса футляр или контейнер для письменных принадлежностей писца.'
    reason: 'Лексическая альтернатива: «чернильница» — традиционный, но более узкий вариант; основное чтение передаёт вероятное значение контейнера для принадлежностей.'
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет функцию указания на внезапно представшую вниманию картину и естественно звучит в русском пророческом повествовании.
- source_word: הָאִישׁ
  choice: человек
  rationale: Передаёт мужской род и отсылает к уже названной в контексте фигуре, не уточняя её природу сверх текста.
- source_word: לְבֻשׁ הַבַּדִּים
  choice: одетый в льняные одежды
  rationale: Передаёт множественное הַבַּדִּים как льняное облачение и сохраняет торжественный оттенок, оставаясь понятным современному читателю.
- source_word: הַקֶּסֶת
  choice: письменный прибор
  rationale: Обозначает носимый футляр или набор принадлежностей писца; выбор понятнее традиционного «чернильница» и не сводит предмет только к сосуду для чернил.
- source_word: בְּמָתְנָיו
  choice: на поясе
  rationale: Естественно передаёт местонахождение предмета у талии; по контексту он был закреплён или носился на поясе.
- source_word: מֵשִׁיב דָּבָר
  choice: доложил
  rationale: Идиоматично передаёт возвращение с ответным сообщением после исполнения поручения.
- source_word: לֵאמֹר
  choice: 'доложил:'
  rationale: Русское оформление прямой речи позволяет не воспроизводить отдельное «говоря», которое здесь звучало бы тяжеловесно.
- source_word: עָשִׂיתִי
  choice: Я сделал всё
  rationale: Завершённое действие передано прошедшим временем; «всё» естественно выражает полноту исполнения, подразумеваемую последующим сравнительным оборотом.
- source_word: כַאֲשֶׁר צִוִּיתָנִי
  choice: как Ты повелел мне
  rationale: Точно и кратко передаёт формулу исполнения в соответствии с данным повелением; прописная буква сохраняет принятую русскую библейскую практику обращения к Богу.
theological_decisions:
- issue: Природа человека в льняных одеждах
  choice: 'Описательно: «человек, одетый в льняные одежды»'
  alternative: Ангел, священническая фигура или богоявленная фигура
  rationale: Еврейский текст описывает внешний вид и роль персонажа, но прямо не определяет его онтологическую природу; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис упрощён естественным русским «доложил» вместо буквального «возвратил слово, говоря»; образность и неопределённость природы персонажа сохранены.
