  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם טַמְּא֣וּ אֶת הַ/בַּ֗יִת וּ/מַלְא֧וּ אֶת הַ/חֲצֵר֛וֹת חֲלָלִ֖ים צֵ֑אוּ וְ/יָצְא֖וּ וְ/הִכּ֥וּ בָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/007.yaml
  text: And he said to them[a], “Defile the house, and fill the courts with the slain[b]. Go out.” So they went out and struck down people in the city.
translation:
  language: ru
  text: 'И Он сказал им: «Оскверните дом[a] и наполните дворы убитыми[b]. Выходите!» И они вышли и поражали людей в городе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм». Буквально: «дом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наполните дворы телами убитых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַמְּאוּ
  choice: Оскверните
  rationale: Повелительная форма передаёт намеренное приведение святилища в состояние ритуальной нечистоты и сохраняет резкость Божьего суда.
- source_word: הַבַּיִת
  choice: дом
  rationale: Буквальное значение — «дом»; в данном контексте имеется в виду храм. Основной текст сохраняет еврейский образ, а сноска поясняет референт.
- source_word: הַחֲצֵרוֹת
  choice: дворы
  rationale: Речь идёт о храмовых дворах; «дворы» естественно и точно передаёт архитектурный термин в данном контексте.
- source_word: חֲלָלִים
  choice: убитыми
  rationale: Слово обозначает сражённых, убитых людей. Творительный падеж естественно сочетается с «наполните» и сохраняет внимание к погибшим, не сводя их лишь к телам.
- source_word: צֵאוּ
  choice: Выходите
  rationale: Прямое повеление покинуть храмовую территорию; форма множественного числа соответствует адресатам.
- source_word: וְיָצְאוּ
  choice: И они вышли
  rationale: Сохраняет повествовательную последовательность и прямой отклик исполнителей суда на повеление.
- source_word: וְהִכּוּ
  choice: стали поражать людей
  rationale: Глагол נכה в контексте означает наносить смертельные удары. «Поражать» сохраняет судебно-повествовательный регистр, а «людей» естественно восполняет подразумеваемый объект.
- source_word: בָעִיר
  choice: в городе
  rationale: Прямое местное значение без усиления до «по всему городу», которого сама форма не требует.
theological_decisions:
- issue: Повеление осквернить храмовое пространство
  choice: 'Передать прямо: «Оскверните дом»'
  alternative: «Сделайте дом нечистым»
  rationale: В видении Бог прямо повелевает совершить суд, последствием которого становится ритуальное осквернение храма. Смягчение ослабило бы намеренно шокирующую силу текста.
- issue: Уточнять ли в основном тексте, что «дом» — это храм
  choice: Сохранить «дом» и пояснить значение в сноске
  alternative: Перевести в основном тексте «храм»
  rationale: Так сохраняется буквальный образ еврейского текста, тогда как контекст и сноска ясно указывают на храм.
- issue: Сделать ли подразумеваемый объект глагола נכה явным
  choice: Добавить «людей»
  alternative: Оставить «поражали в городе»
  rationale: В русском языке без объекта фраза звучит неполно; добавление не определяет личность жертв сверх контекста и ясно передаёт смертоносное действие суда.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Заглавное «Он» указывает на говорящего в контексте, не добавляя имени. Повеления переданы резко и без смягчения; архаизмы устранены.
