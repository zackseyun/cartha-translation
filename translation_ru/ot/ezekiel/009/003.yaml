  source_fidelity: 'В первой части следует точнее передать מֵעַל как движение «от места над херувимом», а не просто «от херувима». Форма «льняные одежды» лучше отражает множественное число הַבַּדִּים. Личное «он позвал» возможно в контексте, однако требует сноски: грамматически еврейский глагол может соотноситься со «славой» (כָּבוֹד, муж. род).'
  naturalness: «Прибор писца» естественнее и яснее, чем несколько неуклюжее «писцовый прибор». «Поднялась от места над херувимом» сохраняет пространственный смысл оригинала и остаётся литературно естественным.
  terminology: «Слава Бога Израиля», «херувим», «порог храма» и «льняные одежды» уместны в современном литературном библейском регистре. «Храм» контекстуально оправдан для הַבַּיִת.
