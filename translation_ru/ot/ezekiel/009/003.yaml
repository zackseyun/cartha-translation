  text: וּ/כְב֣וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נַעֲלָה֙ מֵ/עַ֤ל הַ/כְּרוּב֙ אֲשֶׁ֣ר הָיָ֣ה עָלָ֔י/ו אֶ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּקְרָ֗א אֶל הָ/אִישׁ֙ הַ/לָּבֻ֣שׁ הַ/בַּדִּ֔ים אֲשֶׁ֛ר קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/003.yaml
  text: And the glory of the God of Israel went up from above the cherub on which it had been[a], to the threshold of the house. And he called to the man clothed in linen[c][b], who had the scribe’s writing case at his waist.
translation:
  language: ru
  text: И слава Бога Израиля поднялась от места над херувимом, где она была, к порогу храма. И он[a] позвал человека, одетого в льняные одежды, у которого на поясе был прибор писца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол стоит в мужском роде. Его можно отнести к слову «слава» (евр. «слава» — мужского рода) либо понимать как личное действие Бога.
    reason: alternative_reading
  - marker: b
    text: 'Возможные переводы: «писцовая чернильница» или «футляр писца для письменных принадлежностей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְבוֹד
  choice: слава
  rationale: Традиционный и точный эквивалент в контексте видимого явления Божьего присутствия у Иезекииля.
- source_word: נַעֲלָה מֵעַל
  choice: поднялась от
  rationale: Передаёт направленное перемещение вверх и удаление от прежнего положения над херувимом.
- source_word: הַכְּרוּב
  choice: херувим
  rationale: В еврейском тексте употреблено единственное число.
- source_word: אֲשֶׁר הָיָה עָלָיו
  choice: над которым она пребывала
  rationale: Сохраняет пространственное отношение и соотносит местоимение со «славой», не добавляя образа покоя или восседания.
- source_word: מִפְתַּן הַבָּיִת
  choice: порог храма
  rationale: Хотя בַּיִת буквально означает «дом», в данном контексте речь идёт о здании храма; по-русски «порог храма» естественнее и однозначнее.
- source_word: וַיִּקְרָא
  choice: Он позвал
  rationale: Мужской род глагола допускает отсылку к грамматически мужскому כָּבוֹד, однако прописное «Он» естественно передаёт личное действие Бога, явленного в славе.
- source_word: הַלָּבֻשׁ הַבַּדִּים
  choice: одетого в льняную одежду
  rationale: Ясная современная передача описания одежды из льна с сохранением торжественного регистра.
- source_word: קֶסֶת הַסֹּפֵר
  choice: писцовый прибор
  rationale: Обозначает носимый набор или футляр для письменных принадлежностей; эта формулировка точнее, чем узкое «чернильница».
- source_word: בְּמָתְנָיו
  choice: на поясе
  rationale: Контекстуально передаёт расположение предмета у талии и звучит естественно по-русски.
theological_decisions:
- issue: Кто является субъектом וַיִּקְרָא после слов «слава Бога Израиля»
  choice: «Он позвал» — личное действие Бога, явленного в славе
  alternative: «она позвала» — грамматическая отсылка непосредственно к слову «слава»
  rationale: Еврейский глагол стоит в мужском роде, как и существительное כָּבוֹד. Контекст допускает обе смысловые перспективы; личное местоимение передаёт божественную субъектность, а примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования о видении. Термин «херувим» сохранён в единственном числе. «Храм» выбран вместо буквального «дом» ради ясности контекста. Подлинная неоднозначность субъекта глагола отмечена в богословских решениях; дополнительная сноска в основном тексте не введена, чтобы не перегружать краткий стих.
