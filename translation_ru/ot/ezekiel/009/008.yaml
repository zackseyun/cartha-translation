  text: וַֽ/יְהִי֙ כְּ/הַכּוֹתָ֔/ם וְ/נֵֽאשֲׁאַ֖ר אָ֑נִי וָ/אֶפְּלָ֨/ה עַל פָּנַ֜/י וָ/אֶזְעַ֗ק וָֽ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/מַשְׁחִ֣ית אַתָּ֗ה אֵ֚ת כָּל שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל בְּ/שָׁפְכְּ/ךָ֥ אֶת חֲמָתְ/ךָ֖ עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/008.yaml
  text: And it happened, while they were striking them down, and I alone was left, that I fell on my face and cried out, and I said, “Ah, Lord GOD, will you destroy all the remnant of Israel as you pour out your wrath on Jerusalem?”
translation:
  language: ru
  text: 'И было, когда они поражали их, а я остался один, я пал ниц, возопил и сказал: «О, Владыка ГОСПОДЬ! Неужели Ты погубишь весь остаток Израиля, изливая Свою ярость на Иерусалим?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֵאשֲׁאַר אָ֑נִי
  choice: я один оставался
  rationale: Форма נֵאשֲׁאַר означает «оставаться, уцелевать»; вынесенное местоимение אָ֑נִי подчёркивает самого Иезекииля. «Один» естественно передаёт подразумеваемое одиночество, не утверждая окончательно, что других уцелевших вовсе не было.
- source_word: וָאֶפְּלָה עַל־פָּנַי
  choice: я пал лицом вниз
  rationale: Передаёт телесное движение и позу смирения ясным современным русским выражением.
- source_word: אֲהָהּ
  choice: О
  rationale: Краткое междометие передаёт скорбный, потрясённый возглас пророка без архаического «увы».
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Сохраняется различие между титулом אֲדֹנָי и Божьим именем יהוה; капителью отмечена традиционная передача тетраграмматона.
- source_word: הֲמַשְׁחִית אַתָּה
  choice: Неужели Ты погубишь
  rationale: Вопросительная частица הֲ и причастие в данном контексте выражают испуганный вопрос о происходящем и его исходе; «неужели» естественно передаёт эмоциональную силу вопроса.
- source_word: בְּשָׁפְכְּךָ אֶת־חֲמָתְךָ
  choice: изливая Свою ярость
  rationale: 'Конструкция בְּ + инфинитив может обозначать одновременное действие: уничтожение представлено происходящим при излиянии ярости. Деепричастие сохраняет эту связь, не сводя её однозначно ко времени или причине.'
theological_decisions:
- issue: Объём выражения «весь остаток Израиля»
  choice: весь остаток Израиля
  alternative: всех оставшихся из Израиля
  rationale: Сохранён богословски значимый термин שְׁאֵרִית «остаток», не уточняя, означает ли он уцелевших в Иерусалиме или остаток народа шире.
- issue: Характер пророческого вопроса
  choice: Неужели Ты погубишь…?
  alternative: Ты погубишь…?
  rationale: Формулировка передаёт ужас и мольбу Иезекииля, но не превращает вопрос в утверждение о Божьем намерении.
- issue: Связь гибели с излиянием ярости
  choice: изливая Свою ярость
  alternative: когда Ты изливаешь Свою ярость
  rationale: Деепричастная конструкция сохраняет неоднозначность еврейского בְּשָׁפְכְּךָ между временным сопутствием и обстоятельством действия.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Синтаксис разбит на естественные русские фразы, при этом сохранены напряжённость сцены, повтор действий и эмоциональный вопрос пророка.
