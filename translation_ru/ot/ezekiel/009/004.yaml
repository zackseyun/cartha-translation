  text: וַ/יֹּ֤אמֶר יְהוָה֙ אל/ו עֲבֹר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר בְּ/ת֖וֹךְ יְרֽוּשָׁלִָ֑ם וְ/הִתְוִ֨יתָ תָּ֜ו עַל מִצְח֣וֹת הָ/אֲנָשִׁ֗ים הַ/נֶּֽאֱנָחִים֙ וְ/הַ/נֶּ֣אֱנָקִ֔ים עַ֚ל כָּל הַ/תּ֣וֹעֵב֔וֹת הַֽ/נַּעֲשׂ֖וֹת בְּ/תוֹכָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/004.yaml
  text: And Yahweh said to him[a], “Pass through the midst of the city, through the midst of Jerusalem, and put a mark on the foreheads of the men who sigh and groan over all the abominations being done in her midst.”
translation:
  language: ru
  text: 'И сказал ему Яхве: «Пройди посреди города, посреди Иерусалима, и нанеси знак[a] на лбах людей, которые вздыхают и стонут из-за всех мерзостей, совершаемых в нём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. тав; возможно, имеется в виду буква ת, использованная как знак.
    reason: 'Лексическая неоднозначность: תָּו может обозначать знак вообще или название буквы тав.'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: עֲבֹר
  choice: пройди
  rationale: Естественно передаёт повеление двигаться через город.
- source_word: בְּתוֹךְ ... בְּתוֹךְ
  choice: посреди города, посреди Иерусалима
  rationale: Сохраняет повтор и подчёркнутую локализацию исходного текста, оставаясь естественным по-русски.
- source_word: וְהִתְוִיתָ תָּו
  choice: начертай знак
  rationale: Передаёт действие нанесения различительного знака и сохраняет возможную связь существительного תָּו с названием буквы в сноске.
- source_word: מִצְחוֹת
  choice: на лбах
  rationale: Прямой и современный анатомический эквивалент.
- source_word: הָאֲנָשִׁים
  choice: людей
  rationale: В данном контексте обозначает лиц, которых следует отметить; русское «людей» естественно и не требует необоснованного уточнения пола группы.
- source_word: הַנֶּאֱנָחִים וְהַנֶּאֱנָקִים
  choice: которые вздыхают и стонут
  rationale: Сохраняет два разных обозначения слышимого горя и страдания.
- source_word: עַל כָּל הַתּוֹעֵבוֹת
  choice: из-за всех мерзостей
  rationale: Передаёт причину скорби; «мерзости» сохраняет сильную нравственно-религиозную оценку пророческой речи.
- source_word: הַנַּעֲשׂוֹת בְּתוֹכָהּ
  choice: совершаемых в нём
  rationale: Причастная конструкция передаёт продолжающиеся действия внутри города; местоимение по нормам русского языка согласовано со словом «город».
theological_decisions:
- issue: Возможное символическое значение תָּו как названия буквы тав
  choice: В основном тексте — «знак»
  alternative: «тав» или «букву тав»
  rationale: Непосредственный контекст требует различительного знака. Уточнение формы буквы или её поздней символики вышло бы за пределы явно сказанного; лексическая возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический повтор «посреди… посреди…» сохранён ради еврейского ритма и акцента; архаизмы по возможности исключены.
