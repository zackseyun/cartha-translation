  to: И вот, шестеро мужчин шли со стороны верхних ворот, обращённых на север; у каждого в руке было сокрушающее орудие[a]. Среди них был один мужчина, одетый в льняные одежды, с письменным футляром писца на поясе[b]. Они пришли и остановились возле бронзового жертвенника.
