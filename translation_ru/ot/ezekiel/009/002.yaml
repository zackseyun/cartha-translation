  - severity: low
    issue: «письменный прибор писца»
    rationale: Кֶסֶת обозначает писцовый контейнер/футляр (традиционно «чернильница»), а не просто прибор. «Письменный футляр писца» точнее и сохраняет неопределённость состава принадлежностей.
