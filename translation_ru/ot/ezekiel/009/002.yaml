base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/002.yaml
  text: And behold[a], six men were coming from the direction of the upper gate, which faces north, each with his weapon for smashing in his hand; and one man among them was clothed in linen, with a scribe’s writing case at his waist[b]. And they came and stood beside the bronze altar.
translation:
  language: ru
  text: И вот, шестеро мужчин шли со стороны верхних ворот, обращённых на север; у каждого в руке было сокрушающее орудие[a]. Среди них был один мужчина, одетый в льняные одежды, с письменным футляром писца на поясе[b]. Они пришли и остановились возле бронзового жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «орудие уничтожения». Еврейское слово обозначает орудие, которым разбивают или сокрушают; точный вид оружия неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «с чернильницей писца на поясе». Вероятно, имеется в виду носимый футляр или набор письменных принадлежностей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт внезапность и живую наглядность нового видения естественным для современного русского повествования оборотом.
- source_word: שִׁשָּׁה אֲנָשִׁים
  choice: шестеро мужчин
  rationale: Сохраняет явно мужскую форму и описывает увиденных человекоподобных действующих лиц без уточнения их природы.
- source_word: בָּאִים
  choice: шли
  rationale: Причастие изображает продолжающееся приближение; форма «шли» естественно передаёт разворачивающееся действие в видении.
- source_word: מִדֶּרֶךְ שַׁעַר הָעֶלְיוֹן
  choice: со стороны верхних ворот
  rationale: Ясно передаёт направление приближения и храмовое обозначение ворот.
- source_word: אֲשֶׁר מָפְנֶה צָפוֹנָה
  choice: обращённых на север
  rationale: Сохраняет пространственную ориентацию ворот в естественной русской формулировке.
- source_word: כְּלִי מַפָּצוֹ
  choice: орудие для сокрушения
  rationale: מַפָּץ связано с разбиванием или сокрушением, однако точный вид предмета неясен; «орудие» не конкретизирует его сверх текста.
- source_word: וְאִישׁ אֶחָד בְּתוֹכָם
  choice: Среди них был один человек
  rationale: Естественно передаёт положение одного лица внутри группы, не отождествляя его с ангелом.
- source_word: לָבֻשׁ בַּדִּים
  choice: одетый в льняную одежду
  rationale: Передаёт материал одежды и сохраняет достоинство сакрально-визионерского контекста без архаизма.
- source_word: קֶסֶת הַסֹּפֵר
  choice: письменный прибор писца
  rationale: Обозначает носимый писцом футляр или набор письменных принадлежностей; современнее традиционной «чернильницы» и не сводит предмет только к сосуду для чернил.
- source_word: בְּמָתְנָיו
  choice: на поясе
  rationale: Естественно выражает место крепления у талии и лучше сочетается с носимым письменным прибором.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: медного жертвенника
  rationale: Традиционное и понятное русское обозначение бронзового/медного храмового жертвенника; древнееврейское נְחֹשֶׁת может обозначать медь или бронзу.
theological_decisions:
- issue: Природа шестерых мужчин и человека в льняной одежде
  choice: Описать их феноменологически как мужчин и человека, как это дано в видении.
  alternative: Назвать их ангелами-карателями и небесным писцом.
  rationale: Хотя контекст позволяет понимать их как небесных исполнителей суда, сам стих называет их людьми/мужчинами; перевод не должен снимать эту намеренную описательную сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном пророческого видения. Синтаксис разделён на три предложения ради ясности; сохранены внезапность сцены, поступательное движение и неопределённость точного вида разрушительного орудия и природы действующих лиц.
