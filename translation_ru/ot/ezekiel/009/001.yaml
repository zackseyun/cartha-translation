source:
  edition: WLC
  text: וַ/יִּקְרָ֣א בְ/אָזְנַ֗/י ק֤וֹל גָּדוֹל֙ לֵ/אמֹ֔ר קָרְב֖וּ פְּקֻדּ֣וֹת הָ/עִ֑יר וְ/אִ֛ישׁ כְּלִ֥י מַשְׁחֵת֖/וֹ בְּ/יָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/001.yaml
  text: Then he cried out in my ears with a loud voice[a], saying, “Draw near, you executioners of the city[b], each with his weapon of destruction in his hand.”
translation:
  language: ru
  text: 'И Он громким голосом воззвал мне: «Приблизьтесь, назначенные над городом[a], каждый — с орудием уничтожения в руке[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «надзиратели города», «назначенные для города» или «карающие город». Еврейское слово может обозначать назначенных для надзора либо для посещения и суда.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и каждый — орудие его уничтожения в руке его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: И воззвал Он
  rationale: Глагол קרא означает «звать, взывать». Сочетание с «громким голосом» указывает на сильный призыв; «воззвал» сохраняет торжественный тон, не будучи неясным для современного читателя.
- source_word: בְאָזְנַי
  choice: мне в уши
  rationale: Буквальный и выразительный еврейский оборот, подчеркивающий непосредственность услышанного Иезекиилем.
- source_word: קוֹל גָּדוֹל
  choice: громким голосом
  rationale: Естественная русская передача устойчивого выражения со значением громкой речи.
- source_word: קָרְבוּ
  choice: Приблизьтесь
  rationale: Форма множественного числа повелительного наклонения; перевод сохраняет властный и торжественный характер приказа.
- source_word: פְּקֻדּוֹת הָעִיר
  choice: назначенные для суда над городом
  rationale: Трудная форма от פקד может обозначать назначение, надзор либо карательное посещение. В контексте это призываемые исполнители суда; описательный перевод передает контекст, не уточняя их природу и не сводя значение лишь к «палачам».
- source_word: וְאִישׁ
  choice: каждый
  rationale: Существительное «мужчина, человек» употреблено распределительно по отношению к призванной группе.
- source_word: כְּלִי מַשְׁחֵתוֹ
  choice: со своим орудием истребления
  rationale: כְּלִי — орудие или предмет, используемый для действия; מַשְׁחֵת выражает разрушение и гибель. «Орудие» сохраняет широту слова точнее, чем более узкое «оружие».
- source_word: בְּיָדוֹ
  choice: в руке
  rationale: Сохранен конкретный образ и единственное число, согласованное с распределительным «каждый».
theological_decisions:
- issue: Значение פְּקֻדּוֹת הָעִיר в сцене суда
  choice: назначенные для суда над городом
  alternative: надзиратели города; карающие город; исполнители казни в городе
  rationale: Корень פקד допускает значения назначения, надзора и посещения для суда. Контекст указывает на исполнителей разрушительного приговора, однако сам стих не называет их ангелами и не обязательно определяет как должностных «надзирателей» или буквально как «палачей». Описательная формулировка сохраняет смысловую напряженность.
- issue: Лицо говорящего в וַיִּקְרָא
  choice: Он — с прописной буквы
  alternative: он — со строчной буквы
  rationale: По ближайшему контексту говорит Господь (Иез 8:18); прописная буква служит русской референциальной ясности, не добавляя к тексту нового титула.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис слегка приподнят, но понятен; трудное פְּקֻדּוֹת передано описательно, а его подлинная неоднозначность вынесена в примечание.
