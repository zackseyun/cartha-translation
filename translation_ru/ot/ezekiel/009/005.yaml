  source_fidelity: 'Смысл повелений передан точно: остальные должны идти вслед за человеком в льняной одежде, поражать и не проявлять пощады. Однако «так, чтобы я слышал» выражает цель высказывания («с намерением, чтобы я услышал»), тогда как בְּאָזְנַי — идиома, обозначающая, что пророк слышал сказанное.'
  naturalness: Текст в целом звучит современно и литературно. «При мне» естественно передаёт непосредственное присутствие и слышание без неуместного оттенка намерения. «Не щадите никого» — ясный русский эквивалент идиомы; сноска сохраняет буквальный образ.
  terminology: «Поражайте», «щадите» и «проявляйте жалости» соответствуют судебному, суровому регистру и не сужают значение глагола נכה до обязательного «убивайте». Добавочное «никого» в русском выражает подразумеваемый объект запрета и не меняет смысла в данном контексте.
  issues:
  - severity: medium
    issue: «Он сказал так, чтобы я слышал»
    rationale: Оборот «так, чтобы» в русском обычно выражает намеренно выбранный способ действия ради результата. В еврейском тексте нет указания на цель говорящего; говорится лишь, что Иезекииль слышал приказ. Нейтральное «сказал при мне» избегает этого добавленного нюанса.
  - severity: low
    issue: Пояснение сноски «не удерживаться от кары»
    rationale: Слово «кара» в самой идиоме отсутствует и делает пояснение несколько уже и интерпретационнее необходимого. Достаточно объяснить запрет как отказ от сострадания или пощады.
