base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/005.yaml
  text: And to the others he said in my hearing[a], “Pass through the city after him and strike; do not let your eye spare, and do not show pity.”
translation:
  language: ru
  text: 'А остальным Он сказал при мне: «Пройдите за ним по городу и поражайте. Не щадите никого[a] и не проявляйте жалости».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть ваш глаз не щадит» — еврейский образный оборот, означающий не проявлять пощады или сострадания.'
    reason: Сноска сохраняет буквальный образ оригинала и поясняет его значение, тогда как основной текст остаётся естественным для современного русского читателя.
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: А остальным
  rationale: Указывает на остальных исполнителей суда в противопоставлении человеку в льняной одежде; по-русски связь с контекстом естественно передаётся словом «остальным».
- source_word: אָמַר בְּאָזְנַי
  choice: Он сказал так, чтобы я слышал
  rationale: Еврейская идиома буквально означает «сказал в мои уши» и подчёркивает, что пророк непосредственно слышал приказ.
- source_word: עִבְרוּ בָעִיר אַחֲרָיו
  choice: Пройдите за ним по городу
  rationale: Передаёт повеление двигаться по городу вслед за ранее упомянутым человеком, не уточняя сверх текста способ или цель движения.
- source_word: וְהַכּוּ
  choice: и поражайте
  rationale: Глагол נכה обозначает нанесение удара или поражение; «поражайте» сохраняет суровость приказа, не заменяя широкий глагол более узким «убивайте».
- source_word: אַל־תָּחֹס עֵינֵיכֶם
  choice: Не щадите никого
  rationale: Еврейский образ «пусть ваш глаз не щадит» означает запрет удерживаться от кары из жалости. Добавление «никого» естественно выражает подразумеваемый объект в русском и соответствует ближайшему контексту.
- source_word: וְאַל תַּחְמֹלוּ
  choice: и не проявляйте жалости
  rationale: Сохраняет отдельный параллельный запрет сострадания, не сливая его полностью с предыдущей идиомой.
theological_decisions:
- issue: Суровость повеления о суде
  choice: 'Передать приказ прямо и без смягчения: «поражайте… не проявляйте жалости»'
  alternative: Использовать эвфемизм, ослабляющий насильственный характер повеления
  rationale: Еврейский текст изображает беспощадный суд и не даёт переводчику основания смягчать его или добавлять богословское оправдание.
translation_notes:
  register: Современный литературный русский язык с достоинством и суровостью судебной сцены. Синтаксис прямой и ясный; архаические обороты вроде «сказал в уши мои» устранены. Местоимение «Он» написано с прописной буквы как отсылка к говорящему Господу в ближайшем контексте, без добавления имени в сам стих.
