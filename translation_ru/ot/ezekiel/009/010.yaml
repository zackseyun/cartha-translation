base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/010.yaml
  text: And as for me[a], my eye will not spare, nor will I show pity[b]; I have brought their way upon their heads.
translation:
  language: ru
  text: 'И Я: Мой глаз не пощадит, и Я не проявлю сострадания; на их головы Я возложил их путь[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их поступки». В еврейском языке «путь» нередко означает образ жизни и поведение человека.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «на их головы» означает, что воздаяние за зло возвращается к самим виновным.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: И Мой глаз… и Я
  rationale: Частица גַּם и самостоятельное местоимение אֲנִי придают высказыванию добавочное и эмфатическое значение. В русском оно передано общей конструкцией фразы без тяжеловесного «что же до Меня также».
- source_word: לֹא תָחוֹס עֵינִי
  choice: Мой глаз не пощадит
  rationale: Сохранён конкретный древнееврейский образ глаза как субъекта сострадания; глагол «пощадит» естественно передаёт отказ избавить виновных от суда.
- source_word: וְלֹא אֶחְמֹל
  choice: и Я не проявлю сострадания
  rationale: Передан параллельный, но не полностью тождественный глагол חמל; формулировка не сглаживает суровость провозглашённого суда.
- source_word: דַּרְכָּם
  choice: их путь
  rationale: Сохранена форма единственного числа и образ «пути», который в данном контексте обозначает образ жизни и поступки людей.
- source_word: בְּרֹאשָׁם
  choice: на их же головы
  rationale: Частица «же» естественно выражает возврат воздаяния к самим виновным, не устраняя древнееврейский образ головы.
- source_word: נָתָתִּי
  choice: Я обращу
  rationale: Перфект в контексте решительного объявления суда передан русским будущим как несомненно предстоящее действие; буквальное «дал/положил» здесь звучало бы неясно.
theological_decisions:
- issue: Божественный суд и отказ в сострадании
  choice: Сохранено прямое заявление Бога о том, что Он не пощадит и не проявит сострадания, а поведение виновных обратит на них самих.
  alternative: 'Можно было разъяснить: «Я воздам им за их поступки», но это устранило бы образ пути, возвращающегося на головы виновных.'
  rationale: Текст не смягчает суровость суда и не объясняет её доктринально; перевод сохраняет эту напряжённость и образность.
- issue: Временное значение נָתָתִּי
  choice: 'Будущее: «Я обращу».'
  alternative: 'Прошедшее/результативное: «Я обратил» или «Я возложил».'
  rationale: На фоне глаголов будущего времени перфект может выражать твёрдую решённость и несомненность предстоящего воздаяния. Выбор будущего делает связь высказывания ясной, не ослабляя его категоричности.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и двух ключевых древнееврейских образов — «глаз не пощадит» и воздаяние «на головы». Местоимение «Мой» написано с прописной буквы как относящееся к Богу.
