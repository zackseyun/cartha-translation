  source_fidelity: 'Основной смысл передан верно: Бог не проявит пощады и возложит на виновных их собственный «путь», то есть образ действий. Однако «обращу их путь на их же головы» неточно отражает נָתַתִּי («положил/возложил, дал») и в русском звучит неестественно; будущее время также отходит от формы перфекта, которую английский аудит передаёт как «I have brought».'
  naturalness: «Мой глаз не пощадит» уместно сохраняет древнееврейский образ и звучит понятно в возвышенно-пророческом регистре. Перестановка «на их головы их путь» делает образ воздаяния более ясным по-русски; «же» в основном тексте излишне, поскольку возвратный смысл поясняется сноской.
  terminology: «Путь» следует сохранить как ключевой образ דֶּרֶךְ, с примечанием о значении поведения. «Возложил на их головы» передаёт משפטную образность без добавления слова «последствия» или иной интерпретации.
