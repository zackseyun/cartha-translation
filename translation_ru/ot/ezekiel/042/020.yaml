base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/020.yaml
  text: He measured it on the four sides[a]; it had a wall all around, five hundred cubits long and five hundred cubits wide[b], to make a separation between the holy and the common.
translation:
  language: ru
  text: 'Он измерил его со всех четырёх сторон[a]. Вокруг него со всех сторон была стена: пятьсот в длину и пятьсот в ширину[b], чтобы отделять священное от обычного[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по четырём ветрам»; возможно также: «по четырём направлениям».'
    reason: lexical_alternative
  - marker: b
    text: Единица измерения в этом стихе не названа; в предшествующем описании измерение производится мерной тростью.
    reason: source_ambiguity
  - marker: c
    text: 'Или: «святое от несвятого». Здесь «обычное» означает не отделённое как священное, а не обязательно нечистое или порочное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: с четырёх сторон
  rationale: Существительное רוּחוֹת буквально означает «ветры», а также «направления». В описании измерения сооружения естественный пространственный смысл — четыре стороны.
- source_word: מְדָדוֹ
  choice: Он измерил его
  rationale: Форма представляет собой глагол Qal, 3-е лицо мужского рода единственного числа, с местоименным суффиксом того же рода. «Его» сохраняет грамматику и отсылает к измеряемому комплексу или участку.
- source_word: חוֹמָה לוֹ סָבִיב סָבִיב
  choice: Вокруг него со всех сторон шла стена
  rationale: Повтор סָבִיב усиливает значение полного окружения. Русская формулировка естественно передаёт наличие стены по всему периметру.
- source_word: אֹרֶךְ חֲמֵשׁ מֵאוֹת וְרֹחַב חֲמֵשׁ מֵאוֹת
  choice: пятьсот в длину и пятьсот в ширину
  rationale: В самом стихе единица измерения не названа, поэтому она не добавлена в основной текст. Контекст позволяет её подразумевать, но перевод сохраняет формальную неопределённость исходной строки.
- source_word: לְהַבְדִּיל
  choice: чтобы отделять
  rationale: Инфинитив выражает назначение стены; конструкция с «чтобы» ясно передаёт целевое значение.
- source_word: בֵּין הַקֹּדֶשׁ לְחֹל
  choice: отделять священное от обычного
  rationale: חֹל обозначает обычное, не отделённое как святое, и само по себе не обязательно подразумевает нравственную порочность или осквернение.
theological_decisions:
- issue: Культовое противопоставление קֹדֶשׁ и חֹל
  choice: священное и обычное
  alternative: святое и нечистое; священное и мирское
  rationale: Речь идёт о разграничении освящённого пространства и того, что не имеет статуса священного. «Обычное» не привносит отсутствующей в тексте идеи нравственной нечистоты, а примечание сохраняет возможный традиционный вариант.
- issue: Неуказанная единица измерения
  choice: не добавлять единицу в основной текст
  alternative: пятьсот локтей; пятьсот тростей
  rationale: В данной фразе единица измерения отсутствует. Её явное добавление разрешило бы контекстуальный вопрос, который масоретский текст здесь оставляет подразумеваемым.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового описания. Синтаксис сделан ясным для широкого читателя; повтор исходного סָבִיב передан естественным русским усилением «вокруг… со всех сторон». Не названная в стихе единица измерения не внесена в основной текст.
