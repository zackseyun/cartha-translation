    issue: «Теснее» не вполне точно передаёт קְצֻרוֹת.
    rationale: Слово «теснее» обычно характеризует степень стеснённости или недостаток пространства для находящихся внутри; в источнике речь идёт об уменьшенном размере помещений. «Уже» точнее передаёт выбранное английским аудит-трейлом значение «narrower», не исключая альтернативу «короче» в сноске.
  - severity: low
    issue: Одна сноска поставлена после «теснее», хотя также объясняет «галереи».
    rationale: Это делает неясной привязку примечания к двум разным еврейским словам. Раздельные маркеры обеспечивают ясные якоря сносок.
  - severity: low
    issue: «Комнаты» и «отнимали у них больше места» менее удачны для храмовой архитектуры.
    rationale: «Помещения» нейтральнее и терминологически точнее; «занимали в них больше места» естественнее выражает метафорическое «поглощали» пространство.
