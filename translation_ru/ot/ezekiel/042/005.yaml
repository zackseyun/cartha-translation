  yaml_path: translation/ot/ezekiel/042/005.yaml
  text: And the upper chambers were narrower[a], because the galleries took away from them, more than from the lower and the middle parts of the building.
translation:
  language: ru
  text: А верхние помещения были уже[a], потому что галереи[b] занимали в них больше места, чем в нижних и средних помещениях здания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были короче».'
    reason: 'Лексическая неоднозначность слова קְצֻרוֹת: в архитектурном контексте оно может указывать на уменьшенную ширину или протяжённость.'
  - marker: b
    text: 'Точное значение редкого архитектурного термина אַתִּיקִים неизвестно; возможны также переводы: «террасы», «колоннады» или «уступы».'
    reason: Лексическая и архитектурная неоднозначность слова אַתִּיקִים.
lexical_decisions:
- source_word: הַלְּשָׁכוֹת
  choice: комнаты
  rationale: В храмовом архитектурном контексте слово обозначает боковые помещения; «комнаты» ясно и естественно для современного русского читателя.
- source_word: הָעֶלְיוֹנוֹת
  choice: верхние
  rationale: Обозначает верхний ярус в противопоставлении нижнему и среднему.
- source_word: קְצֻרוֹת
  choice: были теснее
  rationale: Буквально слово связано с уменьшенной протяжённостью; в данном архитектурном контексте речь, вероятнее всего, о меньшем доступном пространстве. «Теснее» естественно передаёт результат, не уточняя без необходимости конкретное измерение.
- source_word: כִּי
  choice: потому что
  rationale: Вводит причину меньшего размера верхних комнат.
- source_word: יוֹכְלוּ
  choice: отнимали … места
  rationale: Форма от אכל, буквально «съедать, поглощать», здесь метафорически описывает архитектурные элементы, занимавшие часть пространства.
- source_word: אַתִּיקִים
  choice: галереи
  rationale: Редкий архитектурный термин с неясным точным референтом; «галереи» — понятный и правдоподобный вариант, а неопределённость отражена в сноске.
- source_word: מֵהֵנָה
  choice: у них
  rationale: Местоимение отсылает к верхним комнатам, пространство которых уменьшалось.
- source_word: מֵהַתַּחְתֹּנוֹת וּמֵהַתִּיכֹנוֹת
  choice: чем у нижних и средних комнат
  rationale: Предлоги в контексте имеют сравнительный смысл; явное повторение «комнат» устраняет неясность и сохраняет сопоставление трёх ярусов.
- source_word: בִּנְיָן
  choice: здания
  rationale: Обобщающее обозначение сооружения; «здание» естественно и стилистически уместно.
