revisions:
- from: А верхние комнаты были теснее[a], потому что галереи отнимали у них больше места, чем у нижних и средних комнат здания.
  to: А верхние помещения были уже[a], потому что галереи[b] занимали в них больше места, чем в нижних и средних помещениях здания.
  rationale: Исправление уточняет архитектурный смысл, устраняет бытовой оттенок слова «теснее» и разделяет сноски по их фактическим якорям. Сравнение верхних помещений с нижними и средними, а также неопределённость редкого термина אַתִּיקִים сохранены.
