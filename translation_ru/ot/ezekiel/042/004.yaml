  yaml_path: translation/ot/ezekiel/042/004.yaml
  text: Before the chambers was a walkway ten cubits wide toward the inner court[a], and a passage one cubit wide[b]; and their entrances faced north.
translation:
  language: ru
  text: Перед комнатами был проход шириной в десять локтей, обращённый к внутренней стороне[a], и путь шириной в один локоть[b]; входы в комнаты были обращены на север.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к внутренней»; существительное в еврейском тексте не названо. Возможно также: «к внутреннему двору».'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст в этой части труден. Возможно понимание «путь в один локоть»; согласно другой огласовке или текстовой традиции — «сто локтей».
    reason: textual_variant
lexical_decisions:
- source_word: לִפְנֵי הַלְּשָׁכוֹת
  choice: Перед комнатами
  rationale: Пространственное выражение указывает на место перед помещениями; «комнаты» естественно и точно передаёт храмовые לשכות в современном русском языке.
- source_word: מַהֲלַךְ
  choice: проход
  rationale: Слово обозначает место для ходьбы или проход; нейтральное «проход» не уточняет устройство сверх сказанного в тексте.
- source_word: עֶשֶׂר אַמּוֹת רֹחַב
  choice: шириной в десять локтей
  rationale: Сохраняет исходную меру длины и естественно передаёт указание ширины.
- source_word: אֶל הַפְּנִימִית
  choice: обращённый к внутренней стороне
  rationale: Субстантивированное прилагательное женского рода оставлено без конкретизации как «двор», поскольку существительное в еврейском тексте не выражено.
- source_word: דֶּרֶךְ אַמָּה אֶחָת
  choice: путь шириной в один локоть
  rationale: «Путь» сохраняет отличие דרך от предшествующего מהלך; слово «шириной» восполняет подразумеваемое измерительное отношение.
- source_word: וּפִתְחֵיהֶם לַצָּפוֹן
  choice: входы в комнаты были обращены на север
  rationale: Явное повторение «в комнаты» естественно проясняет местоименный суффикс множественного числа, а «обращены на север» точно выражает ориентацию входов.
