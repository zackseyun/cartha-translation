base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/003.yaml
  text: Opposite the twenty cubits that belonged to the inner court[a], and opposite the pavement that belonged to the outer court[b], gallery faced gallery in the third story.
translation:
  language: ru
  text: Напротив двадцати локтей внутреннего двора и напротив мощёной площадки внешнего двора галерея[a] находилась напротив галереи на третьем этаже[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «галерея», — редкий архитектурный термин; оно может обозначать также колоннаду, портик или сходную часть верхнего уровня здания.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в три яруса». Вероятнее всего, еврейское выражение указывает на третий этаж здания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגֶד
  choice: напротив
  rationale: Предлог обозначает расположение лицом к объекту или по другую сторону от него; «напротив» естественно передаёт пространственное соотношение.
- source_word: הָעֶשְׂרִים
  choice: двадцати локтей
  rationale: Единица измерения в самой форме не названа, но архитектурный контекст видения указывает на локти; её добавление делает фразу понятной по-русски.
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: внутреннего двора
  rationale: Предлог ל выражает здесь принадлежность или соотнесённость измеренного пространства с внутренним двором.
- source_word: רִצְפָה
  choice: мощёная площадка
  rationale: Слово обозначает вымощенную поверхность во дворе; «мощёная площадка» конкретнее и естественнее в данном архитектурном описании, чем отвлечённое «мощение».
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: внешнего двора
  rationale: Предлог ל указывает на принадлежность мощёной площадки внешнему двору.
- source_word: אַתִּיק
  choice: галерея
  rationale: Это редкий архитектурный термин с не вполне установленным точным значением. «Галерея» подходит для протяжённой части здания и сохраняет возможность понимания как колоннады или портика.
- source_word: אֶל פְּנֵי
  choice: находилась напротив
  rationale: Оборот выражает взаимное расположение двух архитектурных элементов лицом друг к другу; русская формулировка передаёт это пространственное отношение без неестественного буквализма.
- source_word: בַּשְּׁלִשִׁים
  choice: на третьем этаже
  rationale: В архитектурном контексте выражение, вероятнее всего, указывает на третий уровень здания; возможное понимание как трёхъярусного расположения отмечено в сноске.
