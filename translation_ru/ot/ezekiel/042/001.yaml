base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/001.yaml
  text: Then he brought me out into the outer court by the way toward the north[b][a], and he brought me to the chamber that was opposite the separate area and opposite the building to the north.
translation:
  language: ru
  text: Затем он вывел меня во внешний двор по дороге, ведущей на север,[a] и подвёл меня к помещению, которое находилось напротив отделённого участка[b] и напротив здания с северной стороны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по дороге, дороге севера» — древнееврейское идиоматическое обозначение направления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обособленного места». Древнееврейское слово обозначает отдельный, особо выделенный участок в храмовом видении Иезекииля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: Затем он вывел меня
  rationale: Порода хифиль глагола יצא означает «вывести»; «затем» естественно передаёт последовательность повествования.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: во внешний двор
  rationale: חָצֵר обозначает двор, а הַחִיצוֹנָה уточняет, что это внешний двор храмового комплекса.
- source_word: הַדֶּרֶךְ דֶּרֶךְ הַצָּפוֹן
  choice: по дороге, ведущей на север
  rationale: Передаёт маршрут и северное направление, естественно выражая повтор דֶּרֶךְ без неуклюжей буквальности.
- source_word: וַיְבִאֵנִי
  choice: и подвёл меня к
  rationale: Хифиль בוא может означать «привести, подвести»; перевод не утверждает сверх текста, что Иезекииль вошёл внутрь помещения.
- source_word: הַלִּשְׁכָּה
  choice: к помещению
  rationale: לִשְׁכָּה в храмовой архитектуре означает комнату или помещение; единственное число соответствует масоретскому тексту.
- source_word: נֶגֶד
  choice: напротив
  rationale: В обоих случаях слово выражает пространственное расположение одного объекта против другого.
- source_word: הַגִּזְרָה
  choice: отделённого участка
  rationale: Термин обозначает обособленную, отделённую часть храмового комплекса; «участок» ясно передаёт пространственный характер слова.
- source_word: הַבִּנְיָן
  choice: здания
  rationale: בִּנְיָן — общее обозначение здания или сооружения; нейтральное «здание» подходит архитектурному контексту.
- source_word: אֶל הַצָּפוֹן
  choice: с северной стороны
  rationale: Фраза указывает северное расположение, однако её синтаксическая привязка допускает некоторую неоднозначность; русский вариант сохраняет пространственный смысл и остаётся естественным.
