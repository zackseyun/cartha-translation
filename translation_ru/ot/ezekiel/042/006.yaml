base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/006.yaml
  text: For they were in three stories[a], and they had no pillars like the pillars of the courts; therefore the upper stories receded more than the lower and middle ones from the ground.
translation:
  language: ru
  text: Ибо они были трёхъярусными и не имели колонн, подобных колоннам дворов; поэтому верхний ярус был отведён внутрь[a] сильнее, чем нижний и средний, считая от земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «имел уступ» или «был уменьшен»; употреблённый здесь еврейский глагол редок, и точная архитектурная деталь неясна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к предшествующему описанию; «ведь» естественно передаёт объяснительную связь.
- source_word: מְשֻׁלָּשׁוֹת
  choice: были трёхъярусными
  rationale: В архитектурном контексте слово, вероятнее всего, обозначает устройство в три яруса; редкость формы и возможные иные оттенки отмечены в сноске.
- source_word: וְאֵין לָהֶן עַמּוּדִים
  choice: и у них не было столбов
  rationale: Экзистенциальная конструкция с ל выражает обладание; «столбы» — прямой и понятный архитектурный эквивалент.
- source_word: כְּעַמּוּדֵי הַחֲצֵרוֹת
  choice: подобных столбам дворов
  rationale: Сохраняет явное сравнение с опорами храмовых дворов и избегает неясного повтора «как столбы».
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Передаёт следствие, связанное с отсутствием столбов.
- source_word: נֶאֱצַל
  choice: отступал
  rationale: В данном трудном архитектурном контексте глагол, вероятно, указывает на уступ или смещение верхней части внутрь; точный смысл остаётся не вполне ясным.
- source_word: מֵהַתַּחְתּוֹנוֹת וּמֵהַתִּיכֹנוֹת
  choice: дальше, чем нижний и средний
  rationale: Формы женского рода соотносятся с подразумеваемыми помещениями или уровнями; по-русски связь ясно выражена названиями ярусов.
- source_word: מֵהָאָרֶץ
  choice: от земли
  rationale: В описании здания речь идёт о физической точке отсчёта — уровне земли.
