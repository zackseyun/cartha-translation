    issue: Неоднородная передача предписательной модальности
    rationale: «Они не должны» и «Пусть они наденут» передают один и тот же нормативный ряд разными русскими синтаксическими средствами. Замена на «Затем они должны надеть» сохраняет силу еврейских имперфектных предписаний и делает стиль последовательнее.
  - severity: low
    issue: Синтаксическая граница перед «но там»
    rationale: Точка с запятой лучше отделяет запрет движения во внешний двор от последующего требования оставить одежды в священной области и уменьшает возможную референциальную неясность слова «там».
