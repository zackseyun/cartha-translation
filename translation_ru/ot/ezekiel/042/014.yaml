source:
  edition: WLC
  text: בְּ/בֹאָ֣/ם הַ/כֹּהֲנִ֗ים וְ/לֹֽא יֵצְא֤וּ מֵ/הַ/קֹּ֨דֶשׁ֙ אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָ֔ה וְ/שָׁ֞ם יַנִּ֧יחוּ בִגְדֵי/הֶ֛ם אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ן כִּֽי קֹ֣דֶשׁ הֵ֑נָּה ילבשו בְּגָדִ֣ים אֲחֵרִ֔ים וְ/קָרְב֖וּ אֶל אֲשֶׁ֥ר לָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/014.yaml
  text: When the priests enter[a], they shall not go out from the holy place into the outer court, but there they shall leave their garments in which they minister, for they are holy. They shall put on other garments, and then approach what belongs to the people.
translation:
  language: ru
  text: Когда священники войдут, они не должны выходить из священного места во внешний двор; там они должны оставлять одежды, в которых совершают служение, потому что эти одежды святы. Затем они должны надеть другие одежды и подойти к тому, что предназначено для народа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к тому, что для народа». Еврейское выражение неполно и может обозначать место, доступное народу.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֹאָם הַכֹּהֲנִים
  choice: Когда священники войдут
  rationale: Предлог בְּ с инфинитивом и местоименным суффиксом образует временную конструкцию. Такой перевод естественен по-русски и сохраняет значение входа, не уточняя не названный здесь пункт назначения.
- source_word: וְלֹא יֵצְאוּ
  choice: они не должны выходить
  rationale: Имперфект в контексте храмовых предписаний выражает запрет; «не должны» передаёт нормативный характер фразы современным литературным русским языком.
- source_word: מֵהַקֹּדֶשׁ
  choice: из священного места
  rationale: קֹדֶשׁ обозначает здесь освящённую внутреннюю область, противопоставленную внешнему двору. «Священное место» сохраняет пространственный смысл без чрезмерного уточнения.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: во внешний двор
  rationale: Передаёт направленное движение из священной области в наружный храмовый двор.
- source_word: וְשָׁם יַנִּיחוּ בִגְדֵיהֶם
  choice: Там они должны оставлять одежды
  rationale: נוּחַ в данной форме означает положить или оставить. В контексте переодевания «оставлять» звучит ясно и естественно.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶן
  choice: в которых совершают служение
  rationale: שרת в священническом контексте означает культовое служение; выражение «совершают служение» сохраняет этот оттенок, а בָהֶן естественно относится к одеждам.
- source_word: כִּי קֹדֶשׁ הֵנָּה
  choice: потому что эти одежды святы
  rationale: Женское множественное местоимение הֵנָּה относится к одеждам. Повтор существительного по-русски устраняет неясность местоименной отсылки, не меняя смысла.
- source_word: ילבשו בְּגָדִים אֲחֵרִים
  choice: Пусть они наденут другие одежды
  rationale: Передаёт предписанное переодевание перед переходом в менее священную область; форма с «пусть» сохраняет наставительный тон.
- source_word: וְקָרְבוּ אֶל אֲשֶׁר לָעָם
  choice: и тогда подойдут к тому, что предназначено для народа
  rationale: קרב передано как «подойдут», а эллиптическая конструкция אֲשֶׁר לָעָם оставлена без добавления конкретного существительного вроде «место» или «двор». Наречие «тогда» ясно выражает последовательность действий.
theological_decisions:
- issue: Святость священнических одежд и разграничение священной и общедоступной сфер
  choice: Одежды прямо названы святыми и потому должны быть оставлены перед приближением к сфере, предназначенной для народа.
  alternative: Понимать предписание лишь как пространственное указание на переодевание в определённом помещении.
  rationale: Текст связывает запрет выходить в священных одеждах с их святостью. Перевод сохраняет как ритуальную святость одежд, так и пространственное разграничение, не сводя одно к другому.
- issue: Значение эллиптического выражения אֲשֶׁר לָעָם
  choice: к тому, что предназначено для народа
  alternative: к народу; к месту, доступному народу
  rationale: В еврейском тексте существительное не названо. Основной перевод сохраняет эллипсис, а примечание сообщает вероятный пространственный смысл, не превращая его в единственно возможный.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и нормативным звучанием. Термины «священное место», «внешний двор», «одежды» и «служение» понятны широкому читателю и не вносят поздней конфессиональной терминологии. Маркер примечания поставлен при действительно неоднозначном заключительном выражении.
