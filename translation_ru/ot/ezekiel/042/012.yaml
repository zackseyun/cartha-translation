  text: And corresponding to the doorways of the chambers that were toward the south[a], there was a doorway at the head of the way, the way in front of the protective wall, toward the east[b], as one enters them.
translation:
  language: ru
  text: Как и у входов в комнаты, расположенные к югу, имелся вход в начале прохода[a] — прохода перед ограждающей стеной[b], со стороны востока, при входе в них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у начала пути». Еврейский текст несколько раз повторяет слово «путь, проход»; точное устройство этой части здания неясно.'
    reason: lexical_alternative
  - marker: b
    text: Редкое еврейское слово может характеризовать стену также как защитную, окружающую или заслоняющую.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְפִתְחֵי
  choice: Как и у входов
  rationale: Союз с כ выражает соответствие описанию входов в параллельной части здания; русский оборот сохраняет сравнение и звучит естественно.
- source_word: הַלְּשָׁכוֹת
  choice: комнаты
  rationale: В храмовом архитектурном контексте слово обозначает отдельные помещения; «комнаты» понятно современному читателю и не добавляет функции, которой текст не уточняет.
- source_word: אֲשֶׁר דֶּרֶךְ הַדָּרוֹם
  choice: расположенные к югу
  rationale: Передаёт южное расположение или ориентацию, не конкретизируя сверх текста, куда именно были обращены помещения.
- source_word: פֶּתַח
  choice: вход
  rationale: Обозначает проём или место входа и не предполагает наличия дверного полотна.
- source_word: בְּרֹאשׁ דָּרֶךְ
  choice: в начале прохода
  rationale: ראשׁ обозначает начало пути, а דרך в данном архитектурном контексте естественно понимать как проход.
- source_word: דֶּרֶךְ
  choice: проход
  rationale: В описании храмового комплекса речь, вероятно, идёт о пути доступа; повтор «прохода — прохода» сохраняет заметный повтор еврейского текста.
- source_word: בִּפְנֵי הַגְּדֶרֶת
  choice: перед ... стеной
  rationale: בפני значит «перед, напротив», а גדרת — ограда, стена или заграждение; «стена» уместно в архитектурном описании.
- source_word: הֲגִינָה
  choice: ограждающей
  rationale: Редкое слово, вероятно, характеризует стену как защищающую, окружающую или заслоняющую; «ограждающей» сохраняет функциональную широту.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: со стороны востока
  rationale: Передаёт восточную ориентацию, не навязывая точной схемы движения, которая в еврейском тексте не вполне ясна.
- source_word: בְּבוֹאָן
  choice: если входить в них
  rationale: Инфинитив בוא с суффиксом женского множественного числа относится к комнатам и описывает вход в них; безличный оборот естественен по-русски.
