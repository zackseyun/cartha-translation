lexical_decisions:
- source_word: מָדַד
  choice: Он измерил
  rationale: Форма qal, перфект, 3-е лицо мужского рода единственного числа; обычный повествовательный глагол измерения.
- source_word: רוּחַ הַקָּדִים
  choice: восточную сторону
  rationale: В контексте архитектурных измерений רוּחַ с обозначением направления означает сторону света, а не ветер.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: мерной тростью
  rationale: Предлог ב имеет инструментальное значение; русское сочетание естественно передаёт средство измерения.
- source_word: חֲמֵשׁ אמות קָנִים
  choice: пятьсот тростей
  rationale: 'Масоретский текст буквально затруднителен: «пять локтей, тростей». По формуле соседних стихов и свидетельству древних версий речь, вероятнее всего, идёт о пятистах тростях; текстовая трудность отмечена в сноске.'
- source_word: סָבִיב
  choice: по всему периметру
  rationale: В описании внешней границы выражение указывает на круговой обмер; так смысл передаётся яснее, чем буквальным «вокруг».
