base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/013.yaml
  text: Then he said to me[a], “The north chambers, the south chambers, which are opposite the separate area—they are the holy chambers, where the priests who draw near to Yahweh shall eat the most holy things. There they shall place the most holy things, the grain offering, the sin offering, and the guilt offering[d][c][b], for the place is holy.”
translation:
  language: ru
  text: 'Он сказал мне: «Северные помещения и южные помещения, расположенные напротив обособленного участка,[a] — это священные помещения. Там священники, приближающиеся к Яхве, будут есть особо святые приношения.[b] Там они будут помещать особо святые приношения: хлебное приношение, жертву за грех[c] и жертву повинности,[d] потому что это место свято».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обращённые к обособленному участку». Еврейское выражение указывает на расположение этих помещений напротив обособленной части храмового комплекса.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение обозначает приношения высшей степени святости, а не внутреннее помещение, называемое Святым святых.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «очистительную жертву».'
    reason: alternative_reading
  - marker: d
    text: 'Или: «жертву возмещения».'
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁכוֹת
  choice: комнаты
  rationale: В описании храмового комплекса слово обозначает помещения, предназначенные для храмового служения. «Комнаты» естественно и ясно в современном русском; «палаты» звучало бы архаично.
- source_word: הַצָּפוֹן / הַדָּרוֹם
  choice: северные комнаты и южные комнаты
  rationale: Направления переданы как определения к названиям помещений, что естественно для русского архитектурного описания.
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: расположенные напротив отделённого участка
  rationale: אֶל־פְּנֵי выражает пространственное положение напротив или перед чем-либо, а הַגִּזְרָה обозначает обособленную часть храмового комплекса. Формулировка сохраняет техническую неопределённость термина.
- source_word: לִשְׁכוֹת הַקֹּדֶשׁ
  choice: священные комнаты
  rationale: Речь идёт о посвящённых для храмового употребления помещениях; «священные» здесь звучит естественнее русского сочетания «святые комнаты» и сохраняет культовый смысл.
- source_word: קְרוֹבִים לַיהוָה
  choice: приближающиеся к Яхве
  rationale: Причастие обозначает установленный священнический доступ к Богу в богослужении, а не просто физическую близость.
- source_word: יֹאכְלוּ שָׁם
  choice: там ... будут есть
  rationale: Имперфект имеет будущее значение в рамках видения и храмовых предписаний. Русское будущее время передаёт его естественно.
- source_word: קָדְשֵׁי הַקֳּדָשִׁים
  choice: величайшие святыни
  rationale: Выражение обозначает категорию приношений высшей степени святости, а не внутреннее помещение храма. «Величайшие святыни» сохраняет усилительную конструкцию и избегает смешения со Святым святых.
- source_word: יַנִּיחוּ
  choice: будут класть
  rationale: Каузативная форма נוח означает помещать или оставлять в назначенном месте. «Будут класть» ясно и естественно в данном контексте хранения приношений.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из продуктов земли, обычно муки и зерна. Традиционное русское «хлебное приношение» узнаваемо и точнее общего «приношение».
- source_word: הַחַטָּאת
  choice: жертва за грех
  rationale: Это традиционное и понятное название жертвенной категории; возможный акцент на очищении отмечен в сноске.
- source_word: הָאָשָׁם
  choice: жертва повинности
  rationale: Устоявшийся русский культовый термин передаёт жертву, связанную с виной и возмещением; альтернативный смысловой перевод отмечен в сноске.
- source_word: כִּי הַמָּקוֹם קָדֹשׁ
  choice: потому что это место свято
  rationale: כִּי вводит основание предписания. «Потому что» ясно выражает причинную связь в современном русском.
- source_word: יהוה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, прямо присутствующее в еврейском тексте, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя в современной научно принятой русской форме.
- issue: Значение קָדְשֵׁי הַקֳּדָשִׁים
  choice: величайшие святыни
  alternative: величайшие священные приношения; святое святых
  rationale: Следующий перечень жертв показывает, что речь идёт о приношениях высшей категории святости, а не о внутреннем святилище. Слово «святыни» оставляет формально более широкую референцию исходного выражения.
- issue: Культовое значение הַחַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное название сохраняет связь термина с грехом, а возможный очистительный акцент не исключается и указан в сноске.
- issue: Культовое значение הָאָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения
  rationale: Основной вариант сохраняет устоявшееся наименование жертвенной категории; альтернатива отражает связанный с ней аспект возмещения.
translation_notes:
  register: Современный литературный русский с достоинством храмового описания, без избыточной архаизации. Синтаксис разделён на несколько предложений для ясности, при этом повторения и последовательность еврейского текста в основном сохранены. Все маркеры сносок помещены непосредственно при соответствующих выражениях.
