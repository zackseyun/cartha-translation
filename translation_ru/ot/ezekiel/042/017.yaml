lexical_decisions:
- source_word: מָדַד
  choice: Он измерил
  rationale: Форма Qal перфекта, 3-е лицо единственного числа мужского рода; продолжает последовательный рассказ о действиях измеряющего.
- source_word: רוּחַ הַצָּפוֹן
  choice: северную сторону
  rationale: В контексте измерения сооружения רוּחַ обозначает сторону или направление, а не ветер.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: пятьсот
  rationale: Прямое соответствие еврейскому числительному.
- source_word: קָנִים
  choice: тростей
  rationale: Масоретский текст прямо называет единицей измерения קָנֶה — «трость»; родительный падеж естественно выражает меру после числительного.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: мерной тростью
  rationale: Предлог בְּ имеет инструментальное значение; формулировка передаёт орудие и стандарт измерения.
- source_word: סָבִיב
  choice: по всему периметру
  rationale: В архитектурном контексте естественно передаёт измерение вокруг всей внешней границы.
