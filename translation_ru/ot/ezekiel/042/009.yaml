    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתַּחְתֶּה
  choice: А под
  rationale: Передаёт соединительное значение ו и пространственное значение сложной формы מִתַּחְתֶּה, не уточняя сверх текста архитектурное расположение.
- source_word: לְשָׁכוֹת הָאֵלֶּה
  choice: этими комнатами
  rationale: В описании храмового комплекса לְשָׁכוֹת обозначает отдельные помещения; «комнаты» естественно и понятно современному читателю.
- source_word: הַמָּבוֹא
  choice: вход
  rationale: Существительное обозначает место или путь входа; «вход» точно и естественно в архитектурном контексте.
- source_word: מֵהַקָּדִים
  choice: с востока
  rationale: Сохраняет буквальное направление с предлогом מִן и не устраняет возможную неоднозначность между расположением входа и направлением подхода.
- source_word: בְּבֹאוֹ
  choice: когда входили
  rationale: Инфинитив с суффиксом буквально допускает «при его входе», однако контекстуальное неопределённо-личное выражение по-русски естественно передаёт процедуру входа без введения конкретного мужчины.
- source_word: לָהֵנָּה
  choice: в них
  rationale: Женская множественная форма отсылает к комнатам, а направительный оттенок естественно выражен русским сочетанием «входили в них».
- source_word: מֵהֶחָצֵר הַחִיצֹנָה
  choice: со внешнего двора
  rationale: Передаёт устойчивую храмовую терминологию и исходное движение от внешнего двора.
