base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/007.yaml
  text: And the wall that was outside[a], alongside the chambers, toward the outer court, in front of the chambers—its length was fifty cubits.
translation:
  language: ru
  text: А стена, находившаяся снаружи, напротив помещений[a], со стороны внешнего двора, перед помещениями, была длиной в пятьдесят локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «параллельно помещениям». Еврейский предлог может обозначать как положение напротив, так и пространственное соответствие или параллельное расположение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָדֵר
  choice: стена
  rationale: В описании храмового комплекса слово обозначает ограждающее или разделительное сооружение; «стена» естественно передаёт его архитектурный характер.
- source_word: לַחוּץ
  choice: находившаяся снаружи
  rationale: Фраза указывает на внешнее расположение стены относительно помещений и передана ясно, без превращения её в специальный термин.
- source_word: לְעֻמַּת
  choice: напротив
  rationale: Предлог выражает пространственное соответствие или положение лицом к объекту. «Напротив» сохраняет основной смысл, а возможное понимание как параллельного расположения отмечено в сноске.
- source_word: הַלְּשָׁכוֹת
  choice: помещения
  rationale: В храмовом архитектурном контексте речь идёт о предназначенных для определённых нужд комнатах; «помещения» звучит естественно и не добавляет оттенка жилых покоев.
- source_word: דֶּרֶךְ הֶחָצֵר הַחִיצוֹנָה
  choice: со стороны внешнего двора
  rationale: Здесь דֶּרֶךְ вводит пространственный ориентир; данная формулировка естественно показывает расположение стены относительно внешнего двора.
- source_word: אֶל־פְּנֵי
  choice: перед
  rationale: Идиома обозначает положение перед чем-либо или лицом к нему; краткое «перед» сохраняет пространственную конкретность текста.
- source_word: אָרְכּוֹ
  choice: была длиной
  rationale: Местоименный суффикс относится к стене; русская конструкция прямо и естественно выражает её протяжённость.
- source_word: חֲמִשִּׁים אַמָּה
  choice: пятьдесят локтей
  rationale: Сохранена древняя единица длины без приблизительного пересчёта, чтобы не создавать ложной точности.
