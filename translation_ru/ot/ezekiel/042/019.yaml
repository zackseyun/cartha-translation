  - marker: b
    text: Некоторые толкователи и переводы читают здесь «локтей» вместо «тростей», однако в еврейском тексте стоит «трости».
    reason: alternative_reading
lexical_decisions:
- source_word: סָבַב
  choice: Он повернул
  rationale: Глагол может означать «повернуть» или «обойти». В последовательности измерений речь идёт о переходе к следующей стороне, поэтому «повернул» естественно и точно передаёт смысл.
- source_word: רוּחַ הַיָּם
  choice: к западной стороне
  rationale: Буквально выражение означает «к направлению моря»; в древнееврейской географической системе море указывает на запад. Упоминание стороны уместно в контексте измерения периметра.
- source_word: מָדַד
  choice: отмерил
  rationale: В данном геодезическом контексте «отмерил» естественно передаёт совершённое измерение протяжённости.
- source_word: חֲמֵשׁ מֵאוֹת קָנִים
  choice: пятьсот тростей
  rationale: Масоретский текст прямо называет единицей измерения трости, а не локти; это чтение сохранено без исправления.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: мерной тростью
  rationale: 'Предлог בְּ имеет инструментальное значение: измерение произведено при помощи стандартной мерной трости.'
