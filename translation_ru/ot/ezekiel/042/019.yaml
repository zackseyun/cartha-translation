  text: Он повернул на запад[a] и отмерил пятьсот тростей мерной тростью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к направлению моря»; в древнееврейском обозначении сторон света море указывало на запад.'
