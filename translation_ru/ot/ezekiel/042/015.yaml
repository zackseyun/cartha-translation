  text: When he had finished measuring the inner house[a], he brought me out by way of the gate that faced east[b], and he measured it all around.
translation:
  language: ru
  text: Когда он закончил измерять внутреннее здание храма[a], то вывел меня через ворота, обращённые на восток[b], и обмерил его со всех сторон.
