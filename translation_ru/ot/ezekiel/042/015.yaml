lexical_decisions:
- source_word: וְכִלָּה אֶת מִדּוֹת
  choice: Когда он закончил измерять
  rationale: Форма глагола כלה выражает завершение, а существительное מִדּוֹת — измерения; в естественном русском сочетание передано глагольной конструкцией, сохраняющей последовательность действий.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: внутреннее здание храма
  rationale: בַּיִת буквально означает «дом, здание», но в контексте храмового видения обозначает священное храмовое строение. Такой перевод сохраняет архитектурный смысл и не смешивает его со всем храмовым комплексом.
- source_word: וְהוֹצִיאַנִי
  choice: вывел меня
  rationale: Каузативная порода глагола יצא означает «заставить выйти, вывести»; «вывел» точно и естественно передаёт действие.
- source_word: דֶּרֶךְ הַשַּׁעַר
  choice: через ворота
  rationale: דֶּרֶךְ указывает здесь на путь движения; русское «через» естественно обозначает маршрут выхода.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: обращённые на восток
  rationale: Буквально говорится, что «лицо» ворот направлено к востоку; выбранная формулировка сохраняет ориентацию и звучит естественно по-русски.
- source_word: וּמְדָדוֹ
  choice: и обмерил всё
  rationale: Местоименный суффикс мужского рода имеет не вполне явный референт; контекст указывает на ранее описанное храмовое сооружение или комплекс. «Всё» позволяет естественно передать охват объекта, не сужая референт чрезмерно.
- source_word: סָבִיב סָבִיב
  choice: вокруг
  rationale: Повтор подчёркивает измерение по всему периметру; вместе с «обмерил всё» русское «вокруг» передаёт эту полноту без тяжеловесного повтора.
