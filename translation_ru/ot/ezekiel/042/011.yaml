revisions:
- from: Перед ними был проход[a], такой же по виду, как у комнат, обращённых на север. Их длина и ширина были такими же; одинаковы были и все их выходы, устройство[b] и входы.
  to: Перед ними шёл проход[a], устроенный так же, как у комнат, обращённых на север. Эти комнаты были такими же по длине и ширине; совпадали также все их выходы, планировка[b] и входы.
  rationale: Текст уточнён так, чтобы сравнение относилось к устройству помещений, а не к внешнему виду прохода. Явное «эти комнаты» проясняет носитель признаков длины, ширины, выходов, планировки и входов. Смысловые варианты спорного מִשְׁפָּט сохранены в сноске.
