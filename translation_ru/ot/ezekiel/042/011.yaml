base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/011.yaml
  text: And before them was a passage[a], like the appearance of the chambers that faced north; as was their length, so was their width, and all their exits, their arrangements[b], and their entrances were alike.
translation:
  language: ru
  text: Перед ними шёл проход[a], устроенный так же, как у комнат, обращённых на север. Эти комнаты были такими же по длине и ширине; совпадали также все их выходы, планировка[b] и входы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед ними был проход, подобный устройством комнатам с северной стороны».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «установленный порядок», «предписание» или «установленный образец»; здесь оно, вероятно, относится к планировке или предусмотренному устройству комнат.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֶרֶךְ
  choice: проход
  rationale: דֶּרֶךְ обычно означает «путь» или «дорога», но в данном архитектурном контексте обозначает пространство для прохода перед комнатами.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Сочетание предлога с פָּנִים здесь прямо указывает на пространственное положение перед ранее упомянутыми комнатами.
- source_word: כְּמַרְאֵה
  choice: такой же по виду
  rationale: מַרְאֶה означает вид или внешний облик; формулировка передаёт сравнение устройства с северными комнатами, не сводя его только к одному размеру.
- source_word: הַלְּשָׁכוֹת
  choice: комнаты
  rationale: לְשָׁכָה обозначает комнату или помещение при храме. «Комнаты» — ясное и естественное русское соответствие в этом описании.
- source_word: אֲשֶׁר דֶּרֶךְ הַצָּפוֹן
  choice: обращённых на север
  rationale: Буквально оборот связан с «путём/стороной севера»; по контексту он обозначает расположение или ориентацию северных комнат.
- source_word: כְּאָרְכָּן כֵּן רָחְבָּן
  choice: их длина и ширина были такими же
  rationale: Соотносительная конструкция указывает, что длина и ширина описываемого ряда соответствовали размерам северного ряда; русский перевод делает подразумеваемое сравнение явным.
- source_word: וְכֹל מוֹצָאֵיהֶן
  choice: все их выходы
  rationale: מוֹצָא в архитектурном контексте означает место выхода; «выходы» сохраняет конкретный пространственный смысл.
- source_word: וּכְמִשְׁפְּטֵיהֶן
  choice: устройство
  rationale: Хотя מִשְׁפָּט часто означает «суд», «постановление» или «установление», здесь речь, вероятнее всего, о предписанном устройстве или плане комнат.
- source_word: וּכְפִתְחֵיהֶן
  choice: входы
  rationale: פֶּתַח означает проём, дверь или вход; в контексте сопоставления частей здания естественно «входы».
- source_word: implicit comparison across final clauses
  choice: одинаковы были
  rationale: В еврейском тексте заключительное сравнение выражено без отдельного конечного глагола. Добавленный русский глагол завершает синтаксис, не добавляя нового содержания.
