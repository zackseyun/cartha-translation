  text: 'Он измерил южную сторону: пятьсот тростей мерной тростью[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях и древних переводах в этом контексте измерения стоит «локтей» вместо «тростей»; в Масоретском тексте — «тростей».
    reason: textual_variant
lexical_decisions:
- source_word: ר֥וּחַ הַ/דָּר֖וֹם
  choice: южную сторону
  rationale: רוּחַ может обозначать ветер, направление или сторону; в контексте последовательного измерения границ речь идёт о южной стороне.
- source_word: מָדָ֑ד
  choice: Он измерил
  rationale: Глагол מדד прямо означает «измерять»; местоимение передаёт подразумеваемого по контексту деятеля.
- source_word: חֲמֵשׁ מֵא֥וֹת
  choice: пятьсот
  rationale: Обычная передача количественного числительного.
- source_word: קָנִ֖ים
  choice: тростей
  rationale: Масоретский текст содержит קָנִים, множественное число от קָנֶה «трость»; здесь трость служит единицей измерения. Вариант «локтей» отмечен в сноске как текстологическая альтернатива.
- source_word: בִּ/קְנֵ֥ה הַ/מִּדָּֽה
  choice: мерной тростью
  rationale: 'Предлог ב имеет инструментальное значение: измерение произведено стандартной мерной тростью. Творительный падеж естественно передаёт это значение по-русски.'
