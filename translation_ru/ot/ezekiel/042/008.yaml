  text: For the length of the chambers that were by the outer court was fifty cubits, and behold, the part facing the temple was a hundred cubits.
translation:
  language: ru
  text: Ибо длина помещений у внешнего двора составляла пятьдесят локтей, а перед храмом — сто локтей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשָׁכוֹת
  choice: комнат
  rationale: Обычное и понятное обозначение храмовых помещений; по контексту речь идёт о ряде комнат.
- source_word: לֶחָצֵר הַחִצוֹנָה
  choice: у внешнего двора
  rationale: Передаёт пространственное отношение без излишнего уточнения, которого нет в еврейском тексте.
- source_word: וְהִנֵּה
  choice: а
  rationale: В данном архитектурном описании вводит сопоставление размеров; буквальное «вот» по-русски звучало бы неестественно.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: напротив храма
  rationale: Сохраняет пространственный смысл выражения — «перед лицом храма», то есть со стороны, обращённой к храму.
- source_word: אַמָּה
  choice: локтей
  rationale: Традиционная и точная передача древней меры длины без навязывания спорного пересчёта в современные единицы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранён сухой архитектурно-описательный характер стиха. Добавление «та их часть» делает подразумеваемый объект второго измерения явным и согласуется с контекстом, не устраняя пространственную неоднозначность сверх необходимого.
