revisions:
- from: Ведь длина комнат, расположенных у внешнего двора, была пятьдесят локтей, а та их часть, что напротив храма, — сто локтей.
  to: Ибо длина помещений у внешнего двора составляла пятьдесят локтей, а перед храмом — сто локтей.
  rationale: Убрано невыраженное в источнике понятие «часть» и сохранена эллиптическая структура второго измерения. «Перед храмом» ближе к еврейскому выражению и не навязывает единственную реконструкцию планировки.
