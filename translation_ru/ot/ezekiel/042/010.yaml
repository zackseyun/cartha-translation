  text: Along the width of the court wall toward the east[a], facing the separate area and facing the building[b], were chambers.
translation:
  language: ru
  text: По ширине стены двора с восточной стороны[a], напротив отделённого участка[b] и напротив здания, находились комнаты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «по ширине ограды двора» или «в пределах ширины стены двора». Еврейское архитектурное описание пространственно сжато.'
    reason: lexical_alternative
  - marker: b
    text: «Отделённый участок» — специальное обозначение в видении Иезекииля для обособленной части храмового комплекса.
    reason: cultural_note
lexical_decisions:
- source_word: בְּרֹחַב
  choice: по ширине
  rationale: Передаёт пространственное значение сочетания предлога ב с רֹחַב, не устраняя сжатость архитектурного описания.
- source_word: גֶּדֶר הֶחָצֵר
  choice: стены двора
  rationale: גֶּדֶר обозначает стену, ограду или ограждающую преграду; в контексте храмового комплекса естественно «стена двора».
- source_word: דֶּרֶךְ הַקָּדִים
  choice: с восточной стороны
  rationale: דֶּרֶךְ с обозначением стороны света может указывать направление или сторону; здесь формулировка естественна для архитектурного описания и не вводит лишней точности.
- source_word: אֶל פְּנֵי
  choice: напротив
  rationale: Повторённое выражение описывает взаимное расположение объектов; «напротив» ясно передаёт архитектурную ориентацию.
- source_word: הַגִּזְרָה
  choice: отделённого участка
  rationale: Технический термин видения Иезекииля обозначает обособленную часть храмового комплекса; перевод сохраняет идею отделения без конфессионального истолкования.
- source_word: הַבִּנְיָן
  choice: здания
  rationale: Прямое и контекстуально уместное соответствие общему обозначению постройки.
- source_word: לְשָׁכוֹת
  choice: находились комнаты
  rationale: Еврейская фраза безглагольна и эллиптична, поэтому в русском требуется сказуемое. «Комнаты» понятно современному читателю и подходит для помещений храмового комплекса.
