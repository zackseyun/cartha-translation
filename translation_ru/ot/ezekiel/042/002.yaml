  text: Facing the length of one hundred cubits was the north entrance[a], and the width was fifty cubits.
translation:
  language: ru
  text: Перед стороной длиной в сто локтей находился северный вход[a], а ширина составляла пятьдесят локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Напротив стороны длиной в сто локтей был северный вход». Еврейское пространственное выражение сжато и допускает несколько близких вариантов перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל פְּנֵי
  choice: Перед стороной
  rationale: Компактное пространственное выражение указывает на положение или ориентацию относительно продольной стороны сооружения; такой перевод естественен по-русски и сохраняет пространственный смысл.
- source_word: אֹרֶךְ
  choice: стороной длиной
  rationale: В архитектурном контексте слово обозначает продольное измерение; сочетание «стороной длиной» помогает естественно связать размер с пространственным ориентиром.
- source_word: אַמּוֹת הַמֵּאָה
  choice: в сто локтей
  rationale: Сохранена древняя единица измерения «локоть» без пересчёта в современные меры.
- source_word: פֶּתַח הַצָּפוֹן
  choice: северный вход
  rationale: В контексте храмового сооружения פֶּתַח естественно передаётся как «вход», а указание на север — прилагательным.
- source_word: וְהָרֹחַב
  choice: а ширина составляла
  rationale: רֹחַב обозначает поперечное измерение; связка добавлена для ясного современного русского синтаксиса.
- source_word: חֲמִשִּׁים אַמּוֹת
  choice: пятьдесят локтей
  rationale: Числовая мера передана прямо, с той же древней единицей измерения.
