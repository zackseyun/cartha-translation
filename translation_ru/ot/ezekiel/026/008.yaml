  yaml_path: translation/ot/ezekiel/026/008.yaml
  text: He will kill your daughters in the field with the sword[a], set up a siege wall against you, throw up a siege ramp against you[b], and raise a large shield against you.
translation:
  language: ru
  text: Твоих дочерей в поле[a] он убьёт мечом, возведёт против тебя осадную стену, насыплет против тебя осадный вал и поставит против тебя большой щит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоих дочерей в поле». В этом контексте «дочери» могут означать зависимые от Тира поселения — дочерние города или селения в открытой местности, вероятно на материке.'
    reason: lexical_alternative
  - marker: b
    text: «Большой щит» в осадном контексте может обозначать защитное приспособление — например, подвижное прикрытие или щитовой навес для наступающих воинов.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹתַיִךְ
  choice: твоих дочерей
  rationale: Сохраняет буквальный и образный язык еврейского текста. Здесь «дочери» обозначают зависимые от Тира поселения; это значение пояснено в сноске, чтобы основной текст не устранял метафору.
- source_word: בַּשָּׂדֶה
  choice: что в поле
  rationale: Передаёт основное значение «в поле, в открытой местности». В контексте Тира вероятны поселения на материке, однако перевод не сужает смысл без необходимости.
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: он убьёт мечом
  rationale: Прямо передаёт военное умерщвление и сохраняет инструментальное значение выражения «мечом».
- source_word: דָּיֵק
  choice: осадную стену
  rationale: Единственное число и осадный контекст позволяют передать термин как сооружаемую против города осадную стену, не вводя более специального обозначения вроде «башни».
- source_word: סֹלְלָה
  choice: осадный вал
  rationale: Обозначает насыпанное при осаде земляное сооружение или подъём к укреплениям. Глагол «насыплет» естественно соответствует способу его возведения.
- source_word: צִנָּה
  choice: большой щит
  rationale: Сохраняет обычное лексическое значение слова. В данном осадном контексте возможна более специализированная защитная конструкция, что отмечено в сноске.
- source_word: וְנָתַן ... וְשָׁפַךְ ... וְהֵקִים
  choice: возведёт ... насыплет ... поднимет
  rationale: Формы переданы будущим временем как последовательность действий в пророческом предсказании; русские глаголы соответствуют характеру названных осадных сооружений.
