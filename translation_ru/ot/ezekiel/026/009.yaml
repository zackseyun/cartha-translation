lexical_decisions:
- source_word: מְחִי
  choice: удары
  rationale: Существительное обозначает удар; множественное число по-русски естественно передаёт повторяющееся действие тарана при осаде.
- source_word: קָבַלּוֹ
  choice: своего тарана
  rationale: В контексте осады слово указывает на стенобитное орудие; «таран» — ясное и точное современное обозначение.
- source_word: יִתֵּן
  choice: направит
  rationale: Буквально «даст, положит»; в сочетании с ударами тарана естественно означает, что он направит их на стены.
- source_word: בְּחֹמוֹתָיִךְ
  choice: на твои стены
  rationale: Предлог выражает направленность враждебного воздействия на городские стены.
- source_word: וּמִגְדְּלֹתַיִךְ
  choice: твои башни
  rationale: Прямое обозначение оборонительных башен города.
- source_word: יִתֹּץ
  choice: разрушит
  rationale: Глагол означает сломать или снести; «разрушит» естественно и точно передаёт результат осадного нападения.
- source_word: בְּחַרְבוֹתָיו
  choice: своими мечами
  rationale: Масоретский текст прямо содержит обычное слово «мечи»; контекстуальную трудность следует сохранить в тексте и пояснить в сноске, а не заменять чтение без оговорки.
