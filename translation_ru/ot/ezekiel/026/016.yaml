  text: וְֽ/יָרְד֞וּ מֵ/עַ֣ל כִּסְאוֹתָ֗/ם כֹּ֚ל נְשִׂיאֵ֣י הַ/יָּ֔ם וְ/הֵסִ֨ירוּ֙ אֶת מְעִ֣ילֵי/הֶ֔ם וְ/אֶת בִּגְדֵ֥י רִקְמָתָ֖/ם יִפְשֹׁ֑טוּ חֲרָד֤וֹת יִלְבָּ֨שׁוּ֙ עַל הָ/אָ֣רֶץ יֵשֵׁ֔בוּ וְ/חָֽרְדוּ֙ לִ/רְגָעִ֔ים וְ/שָׁמְמ֖וּ עָלָֽיִ/ךְ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/016.yaml
  text: Then all the princes of the sea will come down from their thrones[a], remove their robes, and strip off their embroidered garments. They will clothe themselves with trembling, sit on the ground, tremble moment by moment[b], and be appalled at you.
translation:
  language: ru
  text: Тогда все князья моря сойдут со своих престолов[a], снимут свои мантии и сбросят расшитые одежды. Они облекутся в трепет[b], сядут на землю, будут трепетать каждое мгновение и ужаснутся из-за тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все морские правители». Буквально: «все князья моря»; имеются в виду правители, связанные с морем.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наденут трепеты» — яркий образ трепета как одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ מֵעַל כִּסְאוֹתָם
  choice: сойдут со своих престолов
  rationale: Глагол ירד означает «сходить, спускаться», а כִּסֵּא в отношении правителей — «престол». Формулировка передаёт и движение вниз, и унижение властителей.
- source_word: כֹּל נְשִׂיאֵי הַיָּם
  choice: все князья моря
  rationale: נָשִׂיא обозначает князя, вождя или правителя. Буквальное «князья моря» сохраняет образ морских властителей, не подменяя его более узким толкованием.
- source_word: מְעִילֵיהֶם
  choice: свои мантии
  rationale: מְעִיל — верхнее одеяние или мантия; в контексте правителей «мантии» естественно передаёт достоинство снимаемой одежды.
- source_word: בִּגְדֵי רִקְמָתָם יִפְשֹׁטוּ
  choice: сбросят расшитые одежды
  rationale: רִקְמָה указывает на вышитую или узорчатую работу, а פשט при одежде — на снятие. «Сбросят» сохраняет выразительность и отличается от предшествующего «снимут».
- source_word: חֲרָדוֹת יִלְבָּשׁוּ
  choice: облекутся в трепет
  rationale: 'Буквально: «наденут трепеты». Перевод сохраняет метафору страха как одежды и необычное множественное число передаёт русским собирательным «трепет».'
- source_word: עַל הָאָרֶץ יֵשֵׁבוּ
  choice: сядут на землю
  rationale: В описании позы הָאָרֶץ естественно означает землю под ногами; выражение передаёт унижение и скорбь.
- source_word: וְחָרְדוּ לִרְגָעִים
  choice: будут трепетать каждое мгновение
  rationale: לִרְגָעִים буквально связано с «мгновениями» и выражает повторяющийся либо непрерывный трепет.
- source_word: וְשָׁמְמוּ עָלָיִךְ
  choice: ужаснутся тому, что случилось с тобой
  rationale: שׁמם может означать оцепенение, ужас или потрясение; עַל с обращением к Тиру указывает на реакцию на постигшую его участь. Развёрнутая русская формулировка ясна и не создаёт двусмысленного «ужаснутся тебе».
