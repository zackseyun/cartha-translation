source:
  edition: WLC
  text: בְּ/פַרְס֣וֹת סוּסָ֔י/ו יִרְמֹ֖ס אֶת כָּל חֽוּצוֹתָ֑יִ/ךְ עַמֵּ/ךְ֙ בַּ/חֶ֣רֶב יַהֲרֹ֔ג וּ/מַצְּב֥וֹת עֻזֵּ֖/ךְ לָ/אָ֥רֶץ תֵּרֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/011.yaml
  text: With the hoofs of his horses he will trample all your streets[a]; he will kill your people with the sword[b], and the pillars of your strength will come down to the ground.
translation:
  language: ru
  text: Копытами своих коней он растопчет все твои улицы[a]; твой народ он убьёт мечом, и столпы твоего могущества[b] падут на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все твои открытые места»; или: «все твои площади».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «памятники твоего могущества». Еврейское выражение может обозначать выдающиеся столпы или стоящие памятники, связанные с мощью Тира.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפַרְסוֹת סוּסָיו
  choice: Копытами своих коней
  rationale: Предлог בְּ передаёт орудие действия; «копытами» естественно выражает средство, а «кони» сохраняет прямое значение סוּסִים без добавления всадников.
- source_word: יִרְמֹס
  choice: растопчет
  rationale: Глагол רמס обозначает попирание, затаптывание; «растопчет» сохраняет конкретный и военный образ.
- source_word: כָּל חוּצוֹתָיִךְ
  choice: все твои улицы
  rationale: חוּצוֹת может обозначать улицы, открытые места или площади. В описании захвата города «улицы» — наиболее широкое и естественное соответствие; варианты отмечены в сноске.
- source_word: עַמֵּךְ
  choice: твой народ
  rationale: עַם здесь обозначает жителей Тира; «народ» прямо и привычно передаёт смысл.
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: убьёт мечом
  rationale: Сохраняется конкретный образ меча и прямое значение הרג; порядок слов с повторным «он» ясно удерживает царя-завоевателя как подлежащее.
- source_word: וּמַצְּבוֹת עֻזֵּךְ
  choice: и столпы твоего могущества
  rationale: מַצֵּבוֹת может означать стоящие камни, столпы или памятники. «Столпы твоего могущества» сохраняет предметный образ и его связь с силой Тира, не сводя выражение к военным укреплениям.
- source_word: לָאָרֶץ תֵּרֵד
  choice: падут на землю
  rationale: Буквально ירד означает движение вниз, но применительно к столпам естественный русский эквивалент — «падут»; «на землю» сохраняет направление לָאָרֶץ.
