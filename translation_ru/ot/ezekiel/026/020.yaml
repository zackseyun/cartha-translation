  text: וְ/הוֹרַדְתִּי/ךְ֩ אֶת י֨וֹרְדֵי ב֜וֹר אֶל עַ֣ם עוֹלָ֗ם וְ֠/הוֹשַׁבְתִּי/ךְ בְּ/אֶ֨רֶץ תַּחְתִּיּ֜וֹת כָּ/חֳרָב֤וֹת מֵֽ/עוֹלָם֙ אֶת י֣וֹרְדֵי ב֔וֹר לְמַ֖עַן לֹ֣א תֵשֵׁ֑בִי וְ/נָתַתִּ֥י צְבִ֖י בְּ/אֶ֥רֶץ חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/020.yaml
  text: Then I will bring you down with those who go down to the pit[a], to the people of long ago; and I will make you dwell in the land below, like ruins from ancient times, with those who go down to the pit, so that you will not be inhabited[c][b]. But I will set beauty in the land of the living.
translation:
  language: ru
  text: Тогда Я низведу тебя вместе с теми, кто нисходит в яму, к народу давних времён[a], и поселю тебя в нижних областях земли[b], подобно древним развалинам, вместе с теми, кто нисходит в яму, чтобы ты не была заселена. Но Я дам великолепие в земле живых[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к древнему народу»; речь может идти о людях давно минувших поколений.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в земле глубин» или «в нижней земле».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «красоту» или «славу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַדְתִּיךְ
  choice: Тогда Я низведу тебя
  rationale: Каузативная форма глагола ירד означает «заставить спуститься, низвести». «Низведу» сохраняет образ движения вниз и соответствует возвышенному, но понятному русскому регистру.
- source_word: יֹרְדֵי בוֹר
  choice: те, кто нисходит в яму
  rationale: Сохранён конкретный образ ямы, который в контексте допускает ассоциации с могилой и миром мёртвых, но не сводится только к одному из этих значений.
- source_word: עַם עוֹלָם
  choice: народ древних времён
  rationale: Здесь עוֹלָם указывает на далёкую древность, а не обязательно на вечность. Перевод передаёт мысль о людях давно минувших поколений.
- source_word: וְהוֹשַׁבְתִּיךְ
  choice: и поселю тебя
  rationale: Каузативная форма ישׁב передана естественным русским глаголом «поселю», сохраняющим значение принудительного помещения в указанное место.
- source_word: בְּאֶרֶץ תַּחְתִּיּוֹת
  choice: в земле глубин
  rationale: Еврейское выражение буквально обозначает землю нижних областей. «Земля глубин» сохраняет пространственный образ и не вводит более поздний специальный термин для загробного мира.
- source_word: כָּחֳרָבוֹת מֵעוֹלָם
  choice: подобно вековым развалинам
  rationale: Сравнительная частица כ передана словом «подобно», а מֵעוֹלָם — определением «вековым», то есть существующим с древних времён.
- source_word: לְמַעַן לֹא תֵשֵׁבִי
  choice: чтобы ты больше не была заселена
  rationale: Форма буквально может означать «чтобы ты не обитала», но при обращении к городу естественный русский смысл — «чтобы ты не была заселена». «Больше» ясно выражает контекст окончательного запустения, не меняя основной мысли.
- source_word: וְנָתַתִּי צְבִי
  choice: А ... Я дам великолепие
  rationale: צְבִי допускает значения красоты, великолепия и славы. «Великолепие» сохраняет широкий эстетико-почётный смысл; союз передан как противопоставление участи Тира земле живых.
- source_word: בְּאֶרֶץ חַיִּים
  choice: земле живых
  rationale: Устойчивый образ земной сферы жизни противопоставлен яме и земле глубин. Дательный оборот по-русски естественно передаёт действие дарования при исходном предлоге ב.
theological_decisions:
- issue: Смысл заключительной фразы וְנָתַתִּי צְבִי בְּאֶרֶץ חַיִּים
  choice: Передать неопределённо как Божье дарование «великолепия» земле живых.
  alternative: «Я дам славу в земле живых» или «Я дам красоту земле живых».
  rationale: Еврейский текст не уточняет, что именно представляет собой это великолепие и кому конкретно оно принадлежит. Перевод сохраняет контраст с нисхождением Тира в яму, не превращая фразу в явное обещание восстановления или в узкоконфессиональное утверждение.
- issue: Образ ямы и земли глубин
  choice: Сохранить пространственные образы без прямой замены словом «преисподняя».
  alternative: Перевести как «мир мёртвых» или «преисподняя».
  rationale: Контекст явно связан со смертью и областью умерших, однако образный язык исходного текста шире позднейших систематических представлений о загробном мире.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Повтор выражения «те, кто нисходит в яму» сохранён как значимый параллелизм исходного текста; образы ямы, глубин и земли живых не демифологизированы и не догматизированы.
