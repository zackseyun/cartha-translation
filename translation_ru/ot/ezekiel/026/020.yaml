revisions:
- from: Тогда Я низведу тебя вместе с теми, кто нисходит в яму, к народу древних времён[a], и поселю тебя в земле глубин[b], подобно вековым развалинам, вместе с теми, кто нисходит в яму, чтобы ты больше не была заселена. А земле живых Я дам великолепие[c].
  to: Тогда Я низведу тебя вместе с теми, кто нисходит в яму, к народу давних времён[a], и поселю тебя в нижних областях земли[b], подобно древним развалинам, вместе с теми, кто нисходит в яму, чтобы ты не была заселена. Но Я дам великолепие в земле живых[c].
  rationale: Исправлены безопасные языковые и синтаксические неточности без разрешения спорного смысла заключительной фразы. «Дам великолепие в земле живых» сохраняет еврейский локатив и не уточняет, что именно означает צְבִי или кому оно относится.
