  - severity: low
    issue: «Вековые развалины» неточно передаёт древность развалин
    rationale: «Вековой» по-русски может описывать длительность существования; «древние развалины» точнее передаёт מֵעוֹלָם в этом сравнении.
  - severity: low
    issue: Добавлено «больше»
    rationale: Контекст подразумевает необратимое запустение, но в לֹא תֵשֵׁבִי нет отдельного эквивалента «больше»; его лучше не добавлять.
