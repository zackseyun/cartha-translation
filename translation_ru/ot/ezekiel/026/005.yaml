reference: Ezekiel 26:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִשְׁטַ֨ח חֲרָמִ֤ים תִּֽהְיֶה֙ בְּ/ת֣וֹךְ הַ/יָּ֔ם כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיְתָ֥ה לְ/בַ֖ז לַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/005.yaml
  text: She will become a place for spreading nets in the midst of the sea[a], for I have spoken, declares the Lord GOD, and she will become plunder for the nations.
translation:
  language: ru
  text: Она станет местом, где посреди моря расстилают сети[a], ибо Я сказал, — возвещает Владыка Яхве, — и она станет добычей для народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «местом для расстилания рыболовных сетей».'
    reason: Лексически возможная более явная передача сочетания מִשְׁטַח חֲרָמִים.
lexical_decisions:
- source_word: מִשְׁטַח חֲרָמִים
  choice: местом, где … расстилают сети
  rationale: Сочетание обозначает место или поверхность для расстилания рыболовных сетей. Придаточная конструкция естественна по-русски и сохраняет конкретный образ.
- source_word: בְּתוֹךְ הַיָּם
  choice: посреди моря
  rationale: Прямой и вместе с тем естественный русский эквивалент пространственного выражения; сохраняет морской образ пророчества.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: ибо Я сказал
  rationale: Перфект указывает на уже произнесённое и потому непреложное слово Бога; «ибо» передаёт основание уверенности в исполнении.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם, «Владыка» — אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и избегает сочетания «Господь Господь».
- source_word: וְהָיְתָה לְבַז
  choice: и она станет добычей
  rationale: 'Передаёт результативное значение конструкции: Тир будет отдан народам на разграбление.'
- source_word: לַגּוֹיִם
  choice: для народов
  rationale: גּוֹיִם здесь обозначает окружающие народы, участвующие в суде над Тиром, без позднейшего конфессионального оттенка слова «язычники».
- source_word: תִּהְיֶה … וְהָיְתָה
  choice: Она станет … и она станет
  rationale: Женский род сохраняет грамматическую и литературную персонификацию города Тира.
theological_decisions:
- issue: Передача имени יהוה в составном титуле אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, не заменяя имя общим титулом и не создавая неестественного повтора.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Синтаксис остаётся ясным для широкого читателя; образ расстилаемых сетей и женская персонификация Тира сохранены.
