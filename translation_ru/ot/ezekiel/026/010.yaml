  text: From the abundance of his horses their dust will cover you[a]; at the sound of horsemen and wheel and chariot your walls will quake when he enters your gates[b], as one enters a city that has been breached.
translation:
  language: ru
  text: Из-за множества его коней их пыль покроет тебя. От грохота всадников, колёс и колесниц задрожат твои стены, когда он войдёт в твои ворота, как входят в город, в котором пробита брешь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вступления (или входы) проломленного города»; еврейская конструкция синтаксически трудна. Смысл, вероятно: как входят в город, в котором пробита брешь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשִּׁפְעַת סוּסָיו
  choice: От множества его коней
  rationale: שִׁפְעָה обозначает множество, изобилие; מִן передаёт источник или причину. «От множества» естественно связывает многочисленность коней с поднятой ими пылью.
- source_word: יְכַסֵּךְ אֲבָקָם
  choice: поднимется пыль и покроет тебя
  rationale: 'Буквально: «их пыль покроет тебя». В русском местоимение «их» могло бы ошибочно указывать на более близкое «множество»; добавление естественного «поднимется» ясно передаёт образ пыли, поднятой конями, а «покроет тебя» сохраняет значение כסה и обращение к городу во 2-м лице.'
- source_word: מִקּוֹל פָּרַשׁ וְגַלְגַּל וָרֶכֶב
  choice: От грохота всадников, колёс и колесниц
  rationale: קוֹל здесь означает военный шум; «грохот» естественно охватывает движение всадников, колёс и колесниц. Единственные формы в еврейском перечислении имеют собирательное значение, поэтому по-русски употреблено множественное число.
- source_word: תִּרְעַשְׁנָה חוֹמוֹתַיִךְ
  choice: задрожат твои стены
  rationale: רעשׁ передаёт сильное сотрясение; «задрожат» звучит естественно и сохраняет яркий образ стен, содрогающихся от наступления.
- source_word: בְּבֹאוֹ בִּשְׁעָרַיִךְ
  choice: когда он войдёт в твои ворота
  rationale: Инфинитивная конструкция с בְּ имеет временное значение; суффикс 3-го лица относится к нападающему.
- source_word: כִּמְבוֹאֵי עִיר מְבֻקָּעָה
  choice: как входят в город, в стенах которого пробита брешь
  rationale: מְבוֹאֵי — множественная конструктивная форма от «вход, вступление», а מְבֻקָּעָה описывает взломанный, проломленный город. Безличное «как входят» сохраняет обобщённый характер сравнения, не вводя определённого субъекта; упоминание стен делает русский образ естественным.
