base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/007.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am bringing against Tyre Nebuchadnezzar king of Babylon from the north, king of kings, with horses and chariots and horsemen, and an assembly and a numerous people.'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: «Вот, Я приведу с севера против Тира Навуходоносора[a], царя Вавилона, царя царей, с конями, колесницами и всадниками, с войском и множеством народа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское написание имени здесь ближе к форме «Навуходрезар»; в русском тексте употреблена традиционная форма «Навуходоносор».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Связывает это пророческое объяснение суда с предшествующим контекстом; сохраняет возвышенный, но понятный регистр.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Естественная русская передача устойчивой пророческой формулы в настоящем времени.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт сочетание титула אֲדֹנָי и личного имени יהוה, избегая неестественного по-русски повтора «Господь Господь».
- source_word: הִנְנִי מֵבִיא אֶל
  choice: Вот, Я приведу … против
  rationale: «Вот» сохраняет торжественное божественное самообъявление; будущее совершенного вида естественно выражает предстоящее действие, а «против» передаёт военную направленность אֶל в данном контексте.
- source_word: צֹר
  choice: Тир
  rationale: Устоявшееся русское название города.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Использована общеизвестная русская форма имени; особенность еврейского написания отмечена в сноске.
- source_word: מֶלֶךְ מְלָכִים
  choice: царь царей
  rationale: Буквально сохраняет безартиклевое приложение, обозначающее имперское превосходство Навуходоносора, без добавления определённости.
- source_word: בְּסוּס וּבְרֶכֶב וּבְפָרָשִׁים
  choice: с конями, колесницами и всадниками
  rationale: Коллективные военные обозначения переданы естественными русскими формами множественного числа.
- source_word: וְקָהָל וְעַם רָב
  choice: с войском и множеством народа
  rationale: קָהָל в военном контексте обозначает собранное войско, а עַם רָב — многочисленную людскую силу; формулировка сохраняет два согласованных элемента.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Основной текст сохраняет привычный литературный способ обозначения יהוה словом «Господь», а אֲדֹנָי отличает как «Владыка»; при этом не создаётся повтор «Господь Господь».
- issue: Значение выражения מֶלֶךְ מְלָכִים применительно к Навуходоносору
  choice: царь царей
  alternative: царь над царями
  rationale: 'Сохранена формальная и богословская напряжённость исходного выражения: здесь оно служит имперским титулом Навуходоносора и не ограничивается позднейшим исключительным богословским употреблением.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся близким к еврейскому перечислению, но пунктуация и управление сделаны естественными для русского читателя.
