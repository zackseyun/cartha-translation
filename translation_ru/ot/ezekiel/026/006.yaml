  source_fidelity: 'Смысл еврейского текста в целом передан: «её дочери», «в поле», смерть от меча и формула познания Яхве сохранены. Однако в русском тексте местоимение «они» при глаголе «узнают» не выражено и формально может быть воспринято как относящееся к «дочерям», которые только что названы убитыми. В еврейском וְיָדְעוּ — форма 3-го лица мужского рода множественного числа; вероятнее всего, она относится к жителям/свидетелям в рамках формулы суда, а не к грамматически женскому «дочерям». Русский перевод должен не создавать этой неясности.'
