  yaml_path: translation/ot/ezekiel/026/006.yaml
  text: And her daughters who are in the field will be killed by the sword[b][a], and they will know that I am Yahweh.
translation:
  language: ru
  text: А её дочери, которые находятся в поле[b], будут убиты мечом; тогда узнают, что Я — Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное еврейскими согласными יהוה.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «в поле»; вероятно, имеются в виду зависимые от Тира поселения на материке или в сельской местности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹתֶיהָ
  choice: её дочери
  rationale: Буквально «её дочери»; в пророческой географической речи так могут называться зависимые от города поселения. Образ сохранён в основном тексте, а значение пояснено в сноске.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: которые в поле
  rationale: 'Формально передаёт еврейское выражение и сохраняет его неоднозначность: речь может идти о поселениях на материке либо в сельской местности.'
- source_word: בַּחֶרֶב תֵּהָרַגְנָה
  choice: будут убиты мечом
  rationale: Передаёт пассивную форму תֵּהָרַגְנָה и обычное библейское обозначение насильственной смерти на войне; современно и ясно по-русски.
- source_word: וְיָדְעוּ
  choice: и узнают
  rationale: В формуле Иезекииля глагол указывает на последующее распознание, наступающее в результате суда; «узнают» естественно передаёт эту динамику.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Кого обозначают «её дочери» в пророчестве о Тире
  choice: В основном тексте сохранено буквальное «её дочери», с пояснением о зависимых поселениях.
  alternative: «её дочерние города» или «её селения»
  rationale: Контекст суда над Тиром и географическое употребление слова «дочери» указывают на зависимые поселения, однако буквальный образ не следует устранять из текста.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческого образа. Женский род во множественном числе («убиты») согласован с «дочери». Формула «Я — Яхве» передана кратко и торжественно.
