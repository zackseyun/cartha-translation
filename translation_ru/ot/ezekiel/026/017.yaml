base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/017.yaml
  text: They will raise a lament over you and say to you[a], ‘How you have perished, you who were inhabited from the seas, the praised city, which was strong in the sea, she and her inhabitants[c][b], who imposed their terror on all her inhabitants.’
translation:
  language: ru
  text: 'Они поднимут о тебе плач и скажут тебе: «Как ты погибла, заселённая из морей[a], прославленный город[b], сильный в море, — ты вместе с твоими жителями, наводившими ужас[c] на всех её жителей[d]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заселённая из морей». Выражение необычно; возможно, имеется в виду город, населённый или снабжавшийся из заморских областей. Иногда его передают более истолковательно: «расположенная у входа в море».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знаменитый город», «восхваляемый город».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «дававшие свой ужас», то есть заставлявшие других страшиться.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально в еврейском тексте: «на всех её жителей». Оборот труден, поскольку при отнесении местоимения к городу получается, что Тир наводил ужас на собственных жителей; переводы, относящие эти слова к жителям моря или побережий, передают предполагаемый смысл более истолковательно.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: поднимут ... плач
  rationale: Еврейская идиома означает начать или произнести плач; русский оборот сохраняет образ и возвышенный характер пророческой речи.
- source_word: אָבַדְתְּ
  choice: погибла ты
  rationale: Форма женского рода сохраняет прямое обращение к олицетворённому Тиру и восклицательный тон плача.
- source_word: נוֹשֶׁבֶת מִיַּמִּים
  choice: заселённая из морей
  rationale: Необычная пассивная конструкция и множественное число «морей» сохранены без молчаливого исправления; возможный смысл — населённая или снабжавшаяся из заморских областей.
- source_word: הָעִיר הַהֻלָּלָה
  choice: прославленный город
  rationale: Причастие от הלל передаёт значение «восхваляемый, прославленный»; выбран естественный современный русский эквивалент.
- source_word: חֲזָקָה בַיָּם
  choice: сильный в море
  rationale: Передаёт прямое значение חזק и сохраняет пространственный образ בַיָּם, не сужая его до военно-морского могущества.
- source_word: הִיא וְיֹשְׁבֶיהָ
  choice: ты и твои жители
  rationale: В прямом обращении естественная русская форма сохраняет олицетворение города и связь с его населением.
- source_word: נָתְנוּ חִתִּיתָם
  choice: наводившие ужас
  rationale: Естественно передаёт идиому «давать свой ужас», то есть заставлять других страшиться.
- source_word: לְכָל יוֹשְׁבֶיהָ
  choice: на всех её жителей
  rationale: Буквально сохраняет женский местоименный суффикс и синтаксическую трудность масоретского текста, не подменяя неоднозначный референт толкованием.
theological_decisions:
- issue: Олицетворение города Тира
  choice: 'Сохранить женский род в обращении: «погибла ты», а далее передать הִיא וְיֹשְׁבֶיהָ как «ты и твои жители».'
  alternative: 'Последовательно говорить о городе в мужском роде: «погиб ты», «он и его жители».'
  rationale: Еврейский текст обращается к городу как к лицу, употребляя формы женского рода. Смешение с грамматически мужским русским словом «город» допустимо в поэтическом обращении и сохраняет исходное олицетворение.
- issue: Неясный референт конечного местоименного суффикса
  choice: Сохранить буквальное «на всех её жителей» и пояснить трудность в сноске.
  alternative: Истолковать как «на всех жителей побережья» либо сгладить как «на всех окружающих».
  rationale: Масоретский текст синтаксически труден, а более ясные варианты требуют добавления отсутствующего существительного или смены референта. Перевод не должен молчаливо устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Синтаксис сделан читаемым, но необычное «заселённая из морей» и трудный конечный суффикс сохранены и снабжены сносками. Женское обращение передаёт олицетворение Тира, несмотря на мужской род слова «город».
