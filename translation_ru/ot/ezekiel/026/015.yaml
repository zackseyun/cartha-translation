base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/015.yaml
  text: 'Thus says the Lord GOD to Tyre: Will not the coastlands quake at the sound of your fall[a], when the wounded groan[b], when the slaughter is carried out in your midst?'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве Тиру: «Не содрогнутся ли прибрежные земли[a] от звука твоего падения, когда стонут раненые[b], когда в твоих пределах совершается резня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острова». Еврейское слово может обозначать как острова, так и в более широком смысле прибрежные, приморские земли.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «сражённые» или «убитые»; здесь значение «раненые» лучше согласуется с упоминанием их стона.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Сочетание передаёт титул אֲדֹנָי и Божье имя в принятой русской библейской форме, избегая неестественного повтора «Господь Господь».
- source_word: לְצוֹר
  choice: Тиру
  rationale: Употреблена нормативная русская форма названия города в дательном падеже.
- source_word: הֲלֹא
  choice: Не ... ли
  rationale: Сохранён риторический вопрос, предполагающий утвердительный ответ.
- source_word: מִקּוֹל מַפַּלְתֵּךְ
  choice: от шума твоего падения
  rationale: Предлог выражает причину реакции, а קוֹל обозначает слышимый шум; «падение» прямо передаёт מַפֶּלֶת.
- source_word: בֶּאֱנֹק חָלָל
  choice: когда стонут раненые
  rationale: Естественная русская временная конструкция передаёт инфинитив «стонать»; חָלָל допускает значение тяжело раненного или пронзённого, что согласуется со стоном.
- source_word: בֵּהָרֵג הֶרֶג
  choice: совершается резня
  rationale: Инфинитив с однокоренным дополнением усиливает образ убийства; «совершается резня» передаёт интенсивность без неестественного русского повтора.
- source_word: בְּתוֹכֵךְ
  choice: среди тебя
  rationale: Сохраняется олицетворённое обращение к городу и значение происходящего внутри него.
- source_word: יִרְעֲשׁוּ
  choice: содрогнутся
  rationale: Глагол выражает сильное потрясение и может сочетать физическое колебание со страхом.
- source_word: הָאִיִּים
  choice: морские побережья
  rationale: В пророческой речи слово может обозначать не только острова, но и приморские земли; контекст морского Тира поддерживает более широкое значение.
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Выбранная форма естественна для современной литературной русской библейской речи, различает два элемента титула и не вводит дополнительного толкования.
- issue: Состояние названных словом חָלָל людей
  choice: раненые
  alternative: убитые
  rationale: Слово допускает оба значения, однако упоминание стона в непосредственном контексте склоняет к значению ещё живых тяжело раненных; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Риторический вопрос, олицетворённое обращение к Тиру и нарастающая картина падения, стонов и резни сохранены; спорные лексические значения вынесены в сноски.
