base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/003.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against you, Tyre, and I will bring up many nations against you, as the sea brings up its waves.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве[a]: «Вот, Я — против тебя, Тир! Я подниму против тебя многие народы, как море поднимает свои волны».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Владыка Яхве» (אֲדֹנָי יְהוִה); сочетание титула אֲדֹנָי («Владыка») с личным именем Бога יהוה («Яхве»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логическое следствие и связывает приговор с предшествующим контекстом.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная и торжественная русская формула пророческой речи.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сохраняет оба элемента составного божественного титула: אֲדֹנָי как «Владыка» и личное имя יהוה как «Яхве», избегая неестественного повторения «Господь Господь».'
- source_word: הִנְנִי עָלַיִךְ
  choice: Вот, Я — против тебя
  rationale: הִנְנִי придаёт объявлению особую выразительность, а עָלַיִךְ в контексте суда обозначает враждебную направленность.
- source_word: צֹר
  choice: Тир
  rationale: Устоявшееся русское название города; обращение передано звательной интонацией.
- source_word: וְהַעֲלֵיתִי
  choice: Я подниму
  rationale: Сохраняет образ глагола עלה и его словесную связь с тем, как море поднимает волны.
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: В военно-политическом контексте גּוֹיִם обозначает множество народов или наций; «народы» звучит естественно и точно.
- source_word: כְּהַעֲלוֹת הַיָּם לְגַלָּיו
  choice: как море поднимает свои волны
  rationale: Передаёт сравнение с наступающими волнами и сохраняет повтор глагольного образа «подниму — поднимает».
theological_decisions:
- issue: Передача божественного имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: «Яхве» непосредственно передаёт личное божественное имя, а «Владыка» различает его с предшествующим титулом אֲדֹנָי, не превращая два разных элемента в повтор.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Параллель «подниму — поднимает» намеренно сохранена; тире выделяет эмфатическое «Я — против тебя».
