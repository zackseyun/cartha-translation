source:
  edition: WLC
  text: וּ/נְתַתִּ֞י/ךְ לִ/צְחִ֣יחַ סֶ֗לַע מִשְׁטַ֤ח חֲרָמִים֙ תִּֽהְיֶ֔ה לֹ֥א תִבָּנֶ֖ה ע֑וֹד כִּ֣י אֲנִ֤י יְהוָה֙ דִּבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/014.yaml
  text: I will make you a bare rock[a], a place for spreading nets. You will not be rebuilt again, for I, Yahweh, have spoken[b], declares the Lord GOD.
translation:
  language: ru
  text: Я превращу тебя в голую скалу; ты станешь местом, где расстилают сети[a]. Тебя больше не отстроят, потому что Я, Яхве, сказал это[b], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть местом для расстилания рыболовных сетей.
    reason: Уточняется подразумеваемое назначение сетей חֲרָמִים в прибрежном контексте.
  - marker: b
    text: 'Еврейское «Яхве» передаёт личное имя Бога; заключительная формула буквально содержит титул и имя: «Владыка Яхве».'
    reason: Поясняется различие между יהוה и сочетанием אֲדֹנָי יְהוִה.
lexical_decisions:
- source_word: וּנְתַתִּיךְ
  choice: Я превращу тебя
  rationale: В сочетании с именной частью сказуемого נתן выражает приведение в определённое состояние. «Превращу тебя» естественно передаёт этот каузативный смысл применительно к Тиру.
- source_word: לִצְחִיחַ סֶלַע
  choice: в голую скалу
  rationale: Сочетание обозначает обнажённую, лишённую построек и наносов скальную поверхность. «Голая скала» сохраняет конкретный и суровый образ.
- source_word: מִשְׁטַח חֲרָמִים
  choice: местом, где расстилают сети
  rationale: מִשְׁטַח — поверхность или место для расстилания, а חֲרָמִים в данном контексте — рыболовные сети. Формулировка ясна современному читателю и сохраняет предметный образ.
- source_word: תִּהְיֶה
  choice: ты станешь
  rationale: Будущая форма היה связывает Тир с новым состоянием; «станешь» здесь по-русски естественнее буквального «будешь» и согласуется с предшествующим «превращу».
- source_word: לֹא תִבָּנֶה עוֹד
  choice: Тебя больше не отстроят
  rationale: Нифаль от בנה имеет пассивный смысл «быть построенной/отстроенной», а עוֹד — «снова, впредь, больше». Неопределённо-личная русская конструкция естественно передаёт пассив, не усиливая фразу до отвлечённого «никогда».
- source_word: כִּי אֲנִי יְהוָה דִּבַּרְתִּי
  choice: потому что Я, Яхве, сказал это
  rationale: כִּי вводит основание неизбежности приговора; явное дополнение «это» естественно по-русски передаёт завершённое דִּבַּרְתִּי в данной формуле. Имя יהוה транслитерировано как «Яхве».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם — торжественная пророческая формула. «Возвещает» сохраняет её возвышенный характер, а «Владыка Яхве» передаёт оба элемента אֲדֹנָי יְהוִה без их слияния.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Текст употребляет личное четырёхбуквенное имя Бога. Транслитерация «Яхве» позволяет отличить его от титула אֲדֹנָי и особенно ясно передать сочетание אֲדֹנָי יְהוִה.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант сохраняет различие между титулом אֲדֹנָי и личным именем יהוה, не превращая оба элемента в общие титулы и не создавая повторения «Господь ГОСПОДЬ».
- issue: Степень категоричности לֹא תִבָּנֶה עוֹד
  choice: Тебя больше не отстроят
  alternative: Тебя никогда не отстроят
  rationale: עוֹד указывает на отсутствие последующего восстановления («больше, вновь»). Перевод не добавляет более сильного абсолютного наречия «никогда», сохраняя временную формулировку оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Обращение к Тиру сохранено во втором лице; женский род, выраженный в еврейских формах, по-русски естественно учитывается через подразумеваемое слово «город» и конструкцию «тебя не отстроят». Образ скалы и расстеленных сетей передан конкретно, без конфессионально обусловленных уточнений.
