base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/018.yaml
  text: Now the coastlands will tremble on the day of your downfall[b][a], and the islands that are in the sea will be terrified at your departure.
translation:
  language: ru
  text: Теперь содрогнутся побережья в день твоего падения[a], и ужаснутся острова, что в море, при твоём уходе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острова». Еврейское слово может обозначать как острова, так и побережья или приморские земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «при твоём выходе» или «из-за твоего выхода». Вероятно, речь идёт об исчезновении Тира вследствие суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт временное наречие, связывающее эту реакцию с только что описанным падением Тира.
- source_word: יֶחְרְדוּ
  choice: содрогнутся
  rationale: Сохраняет телесно-эмоциональный образ дрожи от страха и соответствует возвышенному пророческому регистру.
- source_word: הָאִיִּן
  choice: побережья
  rationale: אִיִּים может обозначать острова либо приморские земли; в первой части выбран широкий географический смысл.
- source_word: יוֹם מַפַּלְתֵּךְ
  choice: в день твоего падения
  rationale: Естественно и близко передаёт временную конструкцию и образ крушения Тира.
- source_word: וְנִבְהֲלוּ
  choice: ужаснутся
  rationale: Передаёт внезапный страх и смятение, при этом не повторяя глагол первой части.
- source_word: הָאִיִּים אֲשֶׁר בַּיָּם
  choice: острова в море
  rationale: Уточнение «в море» поддерживает здесь конкретное значение «острова».
- source_word: מִצֵּאתֵךְ
  choice: когда ты исчезнешь
  rationale: Контекстуально передаёт буквальное «при/из-за твоего выхода» как исчезновение Тира вследствие суда, не заменяя его прямым пояснением о гибели.
theological_decisions:
- issue: Значение מִצֵּאתֵךְ применительно к Тиру
  choice: когда ты исчезнешь
  alternative: из-за твоего ухода / при твоём выходе
  rationale: Фраза, вероятно, указывает на исчезновение Тира со сцены после падения; перевод сохраняет образ, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Различие между широким значением «побережья» в первой части и конкретным «острова в море» во второй сохранено; женский род местоименных форм подразумевает город Тир.
