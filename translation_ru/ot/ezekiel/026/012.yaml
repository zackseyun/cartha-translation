  yaml_path: translation/ot/ezekiel/026/012.yaml
  text: They will plunder your wealth and loot your merchandise. They will tear down your walls and demolish your splendid houses. They will throw your stones[a], your timbers, and your dust into the midst of the waters.
translation:
  language: ru
  text: Они разграбят твоё богатство и расхитят твои товары; разрушат твои стены и снесут твои роскошные дома. Твои камни, деревянные балки и землю[a] они бросят в глубину вод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пыль». Еврейское עָפָר может означать «земля» или «пыль»; в данном контексте оно может включать мелкие остатки разрушенного города.'
    reason: Лексическая альтернатива
lexical_decisions:
- source_word: שָׁלְלוּ
  choice: разграбят
  rationale: Глагол обозначает захват военной добычи; «разграбят» естественно передаёт насильственное завладение имуществом.
- source_word: חֵילֵךְ
  choice: твоё богатство
  rationale: Слово может означать силу, войско или богатство; параллель с товарами и торговый контекст Тира указывают здесь на материальные ценности.
- source_word: בָזְזוּ
  choice: расхитят
  rationale: Передаёт насильственное присвоение товаров и позволяет сохранить смысловую близость к שׁלל без тяжёлого повтора.
- source_word: רְכֻלָּתֵךְ
  choice: твои товары
  rationale: В данном контексте речь идёт о предметах торговли, которые могут быть захвачены как добыча.
- source_word: הָרְסוּ חוֹמוֹתַיִךְ
  choice: разрушат твои стены
  rationale: Глагол описывает разрушение сооружений; сочетание ясно и естественно по-русски.
- source_word: בָתֵּי חֶמְדָּתֵךְ
  choice: твои роскошные дома
  rationale: Конструкция обозначает желанные, ценные или великолепные дома; «роскошные» передаёт их привлекательность и высокую ценность.
- source_word: יִתֹּצוּ
  choice: снесут
  rationale: Глагол נתץ означает ломать или разрушать строения; «снесут» естественно сочетается с домами.
- source_word: אֲבָנַיִךְ
  choice: твои камни
  rationale: Буквально обозначает камни разрушенного города или его строений.
- source_word: עֵצַיִךְ
  choice: брёвна
  rationale: В перечне строительных материалов слово עֵץ указывает на древесину разрушенных зданий; «брёвна» передаёт это конкретнее, чем общее «дерево».
- source_word: עֲפָרֵךְ
  choice: землю
  rationale: Основные значения — пыль и земля; в контексте разрушения города слово может также подразумевать мелкие обломки и строительный мусор. «Землю» сохраняет буквальную основу без чрезмерного уточнения.
- source_word: בְּתוֹךְ מַיִם
  choice: в воду
  rationale: Буквально — «посреди вод»; в русском описании движения «сбросят в воду» звучит естественно и сохраняет образ затопления материалов.
