  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: בַּלָּהוֹת — «предметом ужаса»; идиоматическое אֶתְּנֵךְ — «сделаю тебя»; וְאֵינֵךְ — «тебя не станет»; две последующие пассивные формы — «тебя будут искать» и «не найдут». «Уже никогда» адекватно передаёт усиленное עוֹד לְעוֹלָם, не создавая по-русски неуклюжего повтора. Союз «но» несколько эксплицирует подразумеваемый контраст, но не меняет смысла и естественен в русском контексте суда.'
