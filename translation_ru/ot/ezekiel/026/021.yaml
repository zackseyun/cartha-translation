base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/021.yaml
  text: I will make you a terror[a], and you will be no more. Though you are sought, you will never again be found[b], declares the Lord GOD.
translation:
  language: ru
  text: Я сделаю тебя предметом ужаса, и тебя не станет. Тебя будут искать[a], но уже никогда не найдут, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Даже если тебя будут искать, уже никогда не найдут». Еврейский текст допускает как простую последовательность будущих действий, так и уступительный смысл.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: בַּלָּהוֹת
  choice: предметом ужаса
  rationale: Форма множественного числа может иметь усилительное или абстрактное значение. Выражение передаёт, что Тир станет тем, что внушает ужас, и естественно звучит по-русски.
- source_word: אֶתְּנֵךְ
  choice: Я сделаю тебя
  rationale: Глагол נתן буквально означает «дать», но с предикативным существительным здесь имеет смысл «сделать кем-либо или чем-либо».
- source_word: וְאֵינֵךְ
  choice: и тебя не станет
  rationale: Безглагольная отрицательная конструкция означает прекращение существования или присутствия; выбранная формулировка кратка и естественна.
- source_word: וּתְבֻקְשִׁי
  choice: Тебя будут искать
  rationale: Сохранены страдательное значение и будущее время еврейской формы без уточнения, кто именно будет искать.
- source_word: וְלֹא תִמָּצְאִי עוֹד לְעוֹלָם
  choice: но уже никогда не найдут
  rationale: Безличная русская конструкция естественно передаёт еврейский пассив. Сочетание «уже никогда» выражает как עוֹד («впредь, снова»), так и לְעוֹלָם («навсегда») без тяжеловесного повтора.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передано принятой пророческой формулой «возвещает», а составное именование сохраняет титул אֲדֹנָי и личное имя יהוה, не создавая повтора «Господь Господь».
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Вариант «Владыка Яхве» различает титул אֲדֹנָי и личное имя יהוה и не подменяет имя общим титулом.
- issue: Связь между поиском Тира и невозможностью найти его
  choice: Тебя будут искать, но уже никогда не найдут
  alternative: Даже если тебя будут искать, уже никогда не найдут
  rationale: Еврейские формы грамматически соединены как последовательные однородные высказывания; противительный смысл естественно возникает из контекста. Уступительное понимание возможно, но не навязывается основному тексту.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой интонацией. Обращение к Тиру сохранено во втором лице единственного числа; женский род, явный в еврейских формах, по-русски в данной формулировке не требует отдельной маркировки.
