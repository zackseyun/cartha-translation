  text: וְ/שִׁחֲת֞וּ חֹמ֣וֹת צֹ֗ר וְ/הָֽרְסוּ֙ מִגְדָּלֶ֔י/הָ וְ/סִֽחֵיתִ֥י עֲפָרָ֖/הּ מִמֶּ֑/נָּה וְ/נָתַתִּ֥י אוֹתָ֖/הּ לִ/צְחִ֥יחַ סָֽלַע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/004.yaml
  text: They will destroy the walls of Tyre and tear down her towers[a], and I will scrape her dust away from her and make her a bare rock.
translation:
  language: ru
  text: Они разрушат стены Тира и снесут его башни. А Я соскоблю с него землю[a] и превращу его в голую скалу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пыль». Еврейское עָפָר может означать пыль, рыхлую землю или почву. Здесь город изображён полностью обнажённым до самой скалы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁחֲתוּ
  choice: они разрушат
  rationale: Глагол שׁחת при объекте «стены» обозначает разрушение городских укреплений; «разрушат» точно и естественно передаёт смысл.
- source_word: חֹמוֹת צֹר
  choice: стены Тира
  rationale: Прямо передаёт сочетание существительных и указывает на городские укрепления Тира.
- source_word: וְהָרְסוּ
  choice: снесут
  rationale: Глагол הרס означает разбор или обрушение сооружений; «снесут» сохраняет отличие от предшествующего «разрушат».
- source_word: מִגְדָּלֶיהָ
  choice: его башни
  rationale: מִגְדָּל обозначает башню, здесь — оборонительную. В русском Тир грамматически мужского рода, поэтому естественно местоимение «его».
- source_word: וְסִחֵיתִי
  choice: Я соскоблю
  rationale: Редкий глагол описывает снятие поверхностного слоя; «соскоблю» сохраняет яркий образ удаления земли вплоть до камня.
- source_word: עֲפָרָהּ
  choice: с него землю
  rationale: עָפָר может означать пыль, рыхлую землю или почву. В данном образе «землю» естественно обозначает слой, снимаемый со скального основания; лексическая широта отмечена в сноске.
- source_word: וְנָתַתִּי אוֹתָהּ לִצְחִיחַ סָלַע
  choice: и превращу его в голую скалу
  rationale: נתן с обозначением состояния передано результативным «превращу», а צְחִיחַ סָלַע — как обнажённая, лишённая земли скальная поверхность.
theological_decisions:
- issue: Смена множественного субъекта на первое лицо Бога
  choice: Сохранено явное «А Я»
  alternative: Соединить части без подчёркнутой смены субъекта
  rationale: Еврейский текст переходит от «они разрушат» к «Я соскоблю… и превращу», тем самым удерживая вместе действие завоевателей и действие Бога, не устраняя возникающее богословское напряжение.
translation_notes:
  register: Современный литературный русский, ясный и dignified; сохранён конкретный образ последовательного разрушения и обнажения города. Грамматический род топонима в русском обусловил «его», хотя в еврейском город представлен формами женского рода.
