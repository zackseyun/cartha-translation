  text: בֶּן אָדָ֗ם יַ֠עַן אֲשֶׁר אָ֨מְרָה צֹּ֤ר עַל יְרוּשָׁלִַ֨ם֙ הֶאָ֔ח נִשְׁבְּרָ֛ה דַּלְת֥וֹת הָ/עַמִּ֖ים נָסֵ֣בָּה אֵלָ֑/י אִמָּלְאָ֖ה הָחֳרָֽבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/002.yaml
  text: Son of man[a], because Tyre said concerning Jerusalem, ‘Aha! The gateway of the peoples is broken; it has turned to me. I will be filled[b], now that she is laid waste,’
translation:
  language: ru
  text: 'Сын человеческий, за то, что Тир сказал об Иерусалиме: «Ага! Разбиты врата народов[a]; он повернулся ко мне. Я наполнюсь[b], теперь, когда Иерусалим разорён!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «двери народов» или, по смыслу, «проход для народов». Еврейское выражение сжато и может изображать Иерусалим как важный путь доступа или средоточие связей многих народов.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, Тир ожидает выгоды от падения Иерусалима, поскольку торговля или иные потоки могут направиться к нему.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и повторяющийся в книге еврейский образ, без замены его более толковательными вариантами вроде «смертный».
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Оборот естественно вводит основание последующего приговора и сохраняет причинный смысл еврейского сочетания.
- source_word: צֹּר
  choice: Тир
  rationale: Традиционная и нормативная русская форма названия города.
- source_word: עַל יְרוּשָׁלִַם
  choice: об Иерусалиме
  rationale: С предикатом речи предлог обозначает предмет высказывания. Враждебность Тира ясна из самих слов, поэтому её не требуется дополнительно выражать предлогом «против».
- source_word: הֶאָח
  choice: Ага!
  rationale: Передаёт злорадное, торжествующее восклицание современным и естественным русским междометием.
- source_word: נִשְׁבְּרָה
  choice: разбиты
  rationale: Передаёт страдательно-результативное значение нифаля и согласуется в русском с множественным числом слова «врата».
- source_word: דַּלְתוֹת הָעַמִּים
  choice: врата народов
  rationale: Сохраняет сжатый образ оригинала и формальное множественное число דַּלְתוֹת; возможный функциональный смысл «проход, доступ» пояснён в сноске.
- source_word: נָסֵבָּה אֵלַי
  choice: всё повернулось ко мне
  rationale: Еврейская фраза буквально говорит о повороте к Тиру, но её подлежащее и точная образность сжаты. «Всё» позволяет естественно передать ожидаемое перенаправление преимуществ к Тиру, не сводя смысл исключительно к торговле.
- source_word: אִמָּלְאָה
  choice: Я наполнюсь
  rationale: Сохранена метафора наполнения и ожидание Тиром обогащения, без внесения слова «прибыль» непосредственно в текст.
- source_word: הָחֳרָבָה
  choice: теперь, когда он опустошён
  rationale: Передано результирующее запустение Иерусалима. Мужской род обусловлен грамматическим родом русского топонима «Иерусалим», хотя в еврейском употреблена форма женского рода.
theological_decisions:
- issue: Метафорическое обозначение Иерусалима как דַּלְתוֹת הָעַמִּים
  choice: врата народов
  alternative: проход для народов; двери народов
  rationale: Фраза метафорична и синтаксически сжата. Формулировка «врата народов» сохраняет исходный образ и его неоднозначность; вероятный смысл Иерусалима как важного пути доступа или средоточия международных связей вынесен в сноску, а не превращён в однозначное толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Злорадство Тира передано краткими восклицательными фразами; необычные метафоры оригинала сохранены, а не заменены развёрнутым толкованием.
