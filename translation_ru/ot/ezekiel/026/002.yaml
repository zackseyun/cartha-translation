- from: 'Сын человеческий, за то, что Тир сказал об Иерусалиме: «Ага! Разбиты врата народов[a], всё повернулось ко мне. Я наполнюсь[b] теперь, когда он опустошён!»'
  to: 'Сын человеческий, за то, что Тир сказал об Иерусалиме: «Ага! Разбиты врата народов[a]; он повернулся ко мне. Я наполнюсь[b], теперь, когда Иерусалим разорён!»'
  rationale: Устранено не имеющее опоры в оригинале «всё». Единственное число в «он повернулся ко мне» сохраняет сжатость исходной фразы и естественно соотносится с Иерусалимом, не навязывая спорное отождествление подлежащего с «вратами». Повтор названия города в заключительной части делает русскую фразу ясной и не переносит на перевод еврейский женский грамматический род.
