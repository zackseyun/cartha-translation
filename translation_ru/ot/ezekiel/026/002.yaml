    rationale: Еврейский текст употребляет единственное число женского рода и оставляет отсылку сжатой; «всё» не имеет текстового соответствия и чрезмерно обобщает образ.
  - severity: low
    issue: Культурная сноска слишком категорично объясняет образ торговым перенаправлением.
    rationale: Торговая выгода весьма вероятна в контексте Тира, но в самом стихе она не названа; примечание должно обозначать это как вероятное объяснение.
