base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/019.yaml
  text: 'For thus says the Lord GOD: When I make you a ruined city[a], like the cities that are not inhabited, when I bring up the deep over you and the great waters cover you[b],'
translation:
  language: ru
  text: 'Ибо так говорит Господь Яхве: «Когда Я превращу тебя в разорённый город, подобный необитаемым городам, когда подниму на тебя бездну и покроют тебя великие воды[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многие воды».'
    reason: Прилагательное הָרַבִּים может обозначать как величие и мощь вод, так и их многочисленность или обилие.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание сохраняет различие между титулом אֲדֹנָי и личным именем יהוה; форма «Владыка Яхве» естественна и торжественна по-русски.
- source_word: בְּתִתִּי אֹתָךְ עִיר נֶחֱרֶבֶת
  choice: когда Я превращу тебя в разорённый город
  rationale: נתן с дополнением и именной характеристикой имеет здесь смысл «сделать, превратить»; «разорённый» передаёт результирующее состояние נֶחֱרֶבֶת.
- source_word: כֶּעָרִים אֲשֶׁר לֹא נוֹשָׁבוּ
  choice: подобный необитаемым городам
  rationale: 'Краткая естественная формулировка передаёт пассивное значение: города, в которых не живут.'
- source_word: בְּהַעֲלוֹת עָלַיִךְ אֶת־תְּהוֹם
  choice: когда подниму на тебя бездну
  rationale: Сохранён яркий образ תְּהוֹם как водной бездны и каузативный смысл конструкции с העלות.
- source_word: הַמַּיִם הָרַבִּים
  choice: великие воды
  rationale: רַבִּים при «водах» допускает значения многочисленности, обилия и мощи; «великие воды» сохраняет возвышенный образ и контекст сокрушительной стихии.
theological_decisions:
- issue: Передача составного божественного именования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача имени как «Яхве» сохраняет личное имя в исходном тексте, а «Владыка» позволяет не смешивать его с титулом אֲדֹנָי.
- issue: Образ תְּהוֹם
  choice: бездна
  alternative: глубокие воды
  rationale: «Бездна» сохраняет космологическую и поэтическую многозначность еврейского слова, не сводя образ только к обычному морю.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Синтаксическая незавершённость в конце сохранена, поскольку стих продолжает условно-временную конструкцию в следующем контексте.
