  text: וְ/הִשְׁבַּתִּ֖י הֲמ֣וֹן שִׁירָ֑יִ/ךְ וְ/ק֣וֹל כִּנּוֹרַ֔יִ/ךְ לֹ֥א יִשָּׁמַ֖ע עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/013.yaml
  text: And I will put an end to the noise of your songs[a], and the sound of your lyres will be heard no more.
translation:
  language: ru
  text: И Я положу конец шуму твоих песен, и звук твоих лир больше не будет слышен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: И Я положу конец
  rationale: Порода hифиль глагола שׁבת выражает причинение прекращения; оборот «положу конец» естественно и точно передаёт решительное прекращение.
- source_word: הֲמוֹן
  choice: шуму
  rationale: В сочетании с песнями слово обозначает громкое звучание, гул или шум, а не численное множество.
- source_word: שִׁירָיִךְ
  choice: твоих песен
  rationale: Форма множественного числа с суффиксом 2-го лица женского рода обращена к Тиру; прямой эквивалент — «твоих песен».
- source_word: וְקוֹל
  choice: и звук
  rationale: При названии музыкальных инструментов קוֹל естественно означает «звук».
- source_word: כִּנּוֹרַיִךְ
  choice: твоих лир
  rationale: כִּנּוֹר — древний струнный щипковый инструмент, обычно определяемый как лира; это точнее традиционного «гусли» или «арфы».
- source_word: לֹא יִשָּׁמַע עוֹד
  choice: больше не будет слышен
  rationale: 'Нифаль выражает пассивное значение «быть слышимым», а עוֹד в отрицательной конструкции — окончательное прекращение: «больше не».'
