  text: וַ/יְהִ֛י בְּ/עַשְׁתֵּֽי עֶשְׂרֵ֥ה שָׁנָ֖ה בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/001.yaml
  text: And it happened in the eleventh year[a], on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: ru
  text: 'В одиннадцатый год, в первый день месяца, ко мне пришло слово Яхве:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: было
  rationale: Повествовательная форма היה вводит датированный эпизод; в сочетании с пророческой формулой естественно передаётся единым русским оборотом «было ко мне слово» без архаического «и было».
- source_word: בְּעַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: в одиннадцатый год
  rationale: Предлог с числительным образует обычную формулу датировки; русский порядковый числительный точно и естественно передаёт её.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Буквально «в один [день] месяца»; это стандартное обозначение первого дня месяца. Слово «день» добавлено для ясности.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: было ко мне слово Яхве
  rationale: Сохранён характерный пророческий оборот с היה и направлением אֵלַי; формулировка литературна и понятна по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь. В современном русском двоеточие естественно выполняет эту функцию и избегает тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога. «Яхве» передаёт его как имя и не подменяет титулом; форма «Иегова» менее близка к принятой научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Начальное וַיְהִי не выделено отдельным «И случилось», поскольку по-русски это создало бы ненужную тяжеловесность перед формулой «было ко мне слово». Двоеточие передаёт функцию לֵאמֹר и указывает на продолжение речи в следующем стихе.
