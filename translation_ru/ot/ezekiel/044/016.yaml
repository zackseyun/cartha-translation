lexical_decisions:
- source_word: הֵמָּה
  choice: именно они
  rationale: Самостоятельное местоимение употреблено в стихе дважды и несёт смысловое ударение; повтор «именно они» передаёт подчёркнутое исключительное право этих священников.
- source_word: יָבֹאוּ
  choice: будут входить
  rationale: В сочетании с אֶל־מִקְדָּשִׁי глагол обозначает вход в святилище; форма будущего времени естественно передаёт значение древнееврейского имперфекта в данном контексте.
- source_word: מִקְדָּשִׁי
  choice: Моё святилище
  rationale: מִקְדָּשׁ означает святое место, святилище; выбран прямой и общеупотребительный русский эквивалент.
- source_word: יִקְרְבוּ
  choice: будут приближаться
  rationale: Глагол сохраняет оттенок культового приближения для священнического служения, не сужая смысл до конкретного обряда.
- source_word: שֻׁלְחָנִי
  choice: Моему столу
  rationale: Буквальное значение существительного — «стол». Возможное указание на жертвенник или жертвенный стол отмечено в сноске, но не внесено в основной текст.
- source_word: לְשָׁרְתֵנִי
  choice: чтобы служить Мне
  rationale: В священническом контексте שׁרת обозначает священное служение; русский глагол «служить» естественно передаёт и культовый, и личный объект служения.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתִּי
  choice: и будут исполнять порученную Мною службу
  rationale: Сочетание שׁמר с מִשְׁמֶרֶת обозначает соблюдение или исполнение вверенной обязанности. Эта формулировка передаёт священническое поручение естественным современным русским языком.
theological_decisions:
- issue: Значение שֻׁלְחָנִי в контексте храмового служения
  choice: Моему столу
  alternative: Моему жертвеннику; Моему жертвенному столу
  rationale: Хотя в храмовом контексте «стол» может метонимически обозначать жертвенник либо стол для приношений, само древнееврейское слово означает «стол». Основной текст сохраняет эту формулировку и не разрешает неоднозначность без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового контекста. Повтор «именно они» сохранён ради исходного акцента; формулировка «исполнять порученную Мною службу» избегает архаичного и не вполне естественного «хранить Мою стражу».
