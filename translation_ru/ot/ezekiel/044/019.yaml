  source_fidelity: 'Смысл передан в целом верно: повторное указание на внешний двор сохранено, предписания о снятии и оставлении служебных одежд переданы точно, а заключительная фраза верно понимается в контексте регулируемой культовой святости. Однако «передать святость народу» несколько сильнее истолковывает механизм действия, чем еврейский глагол קדש, который прямо означает «освятить / сделать святым».'
