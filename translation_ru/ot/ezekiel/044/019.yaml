  text: וּ֠/בְ/צֵאתָ/ם אֶל הֶ/חָצֵ֨ר הַ/חִיצוֹנָ֜ה אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָה֮ אֶל הָ/עָם֒ יִפְשְׁט֣וּ אֶת בִּגְדֵי/הֶ֗ם אֲשֶׁר הֵ֨מָּה֙ מְשָׁרְתִ֣ם בָּ֔/ם וְ/הִנִּ֥יחוּ אוֹתָ֖/ם בְּ/לִֽשְׁכֹ֣ת הַ/קֹּ֑דֶשׁ וְ/לָֽבְשׁוּ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וְ/לֹֽא יְקַדְּשׁ֥וּ אֶת הָ/עָ֖ם בְּ/בִגְדֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/019.yaml
  text: When they go out to the outer court[a], to the outer court where the people are, they shall take off their garments in which they minister and leave them in the holy chambers. Then they shall put on other garments[b], so that they may not make the people holy with their garments.
translation:
  language: ru
  text: Когда они будут выходить во внешний двор[a], во внешний двор, где находится народ, пусть снимут одежды, в которых совершают служение, и оставят их в священных помещениях. Затем пусть наденут другие одежды, чтобы не освятить народ своими одеждами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Повтор слов «во внешний двор» в еврейском тексте подчёркивает переход из священнической части в пространство, где находится народ.
    reason: cultural_note
  - marker: b
    text: 'Или: «чтобы своими одеждами не передать святость народу». Речь идёт о культовой святости, а не о нравственном преображении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצֵאתָם
  choice: Когда они будут выходить
  rationale: Сочетание союза с инфинитивом и местоименным суффиксом вводит временное придаточное; форма будущего времени естественно согласуется с последующими предписаниями.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: во внешний двор
  rationale: «Двор» — обычное и точное обозначение храмового пространства; предлог «во» передаёт направленное движение.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה אֶל הָעָם
  choice: во внешний двор, где находится народ
  rationale: Повтор направления сохранён, а אֶל הָעָם передано как пояснение того, что речь идёт о доступной народу части двора.
- source_word: יִפְשְׁטוּ אֶת בִּגְדֵיהֶם
  choice: пусть снимут одежды
  rationale: В контексте одежды פשט означает «снять»; притяжательность ясно выражена дальнейшим местоимением «своими» и контекстом, без тяжеловесного повтора.
- source_word: אֲשֶׁר הֵמָּה מְשָׁרְתִם בָּם
  choice: в которых совершают служение
  rationale: שרת обозначает храмовое служение; выражение сохраняет культовый оттенок и звучит естественно по-русски.
- source_word: וְהִנִּיחוּ אוֹתָם בְּלִשְׁכֹת הַקֹּדֶשׁ
  choice: и оставят их в священных помещениях
  rationale: לשכה — храмовое помещение или комната; «священные помещения» точно передаёт их назначение и не создаёт архаической тяжеловесности.
- source_word: וְלָבְשׁוּ בְּגָדִים אֲחֵרִים
  choice: Затем пусть наденут другие одежды
  rationale: «Наденут» передаёт последовательное переодевание, а «затем» естественно связывает действия.
- source_word: וְלֹא יְקַדְּשׁוּ אֶת הָעָם בְּבִגְדֵיהֶם
  choice: чтобы своими одеждами не передать святость народу
  rationale: Порода piel глагола קדש здесь имеет каузативный культовый смысл — сделать святым или сообщить священный статус; «передать святость» ясно выражает предотвращаемое воздействие через одежды, не смешивая его с нравственным освящением.
theological_decisions:
- issue: Смысл передачи святости в заключительной части стиха
  choice: Священники не должны посредством служебных одежд передавать народу культовую святость.
  alternative: «Чтобы своими одеждами не освятить народ» или «не сделать народ святым».
  rationale: Контекст видения храма регулирует границы священного пространства и предметов. Формулировка сохраняет материально-культовый смысл קדש и не превращает его в утверждение о нравственном или духовном преображении.
- issue: Модальность заключительного וְלֹא
  choice: Передано целевым оборотом «чтобы… не».
  alternative: 'Самостоятельное предписание: «и пусть не передают…».'
  rationale: В последовательности переодевания отрицательная фраза естественно выражает предотвращаемый результат, хотя грамматически возможна и координация запрета.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового контекста. Синтаксический повтор оригинала сохранён ради пространственного акцента; специализированный культовый смысл пояснён без конфессиональной терминологии.
