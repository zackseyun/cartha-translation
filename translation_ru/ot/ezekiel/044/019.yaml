revisions:
- from: Когда они будут выходить во внешний двор[a], во внешний двор, где находится народ, пусть снимут одежды, в которых совершают служение, и оставят их в священных помещениях. Затем пусть наденут другие одежды, чтобы своими одеждами не передать святость народу[b].
  to: Когда они будут выходить во внешний двор[a], во внешний двор, где находится народ, пусть снимут одежды, в которых совершают служение, и оставят их в священных помещениях. Затем пусть наденут другие одежды, чтобы не освятить народ своими одеждами[b].
  rationale: Заменено «передать святость народу» на «освятить народ своими одеждами», чтобы прямо передать еврейский piel глагола קדש и сохранить порядок дополнений оригинала. Пояснение о возможной передаче культовой святости оставлено в сноске как контекстуально обоснованный, но более истолковательный вариант.
