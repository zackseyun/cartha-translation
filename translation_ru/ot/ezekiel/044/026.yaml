lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: И после
  rationale: Союз וְ сохраняет связь с предыдущим предписанием, а אַחֲרֵי выражает временную последовательность.
- source_word: טָהֳרָתוֹ
  choice: его очищения
  rationale: Слово обозначает ритуальное очищение священника; «очищение» естественно звучит по-русски и не добавляет идеи нравственного или внутреннего очищения.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое соответствие еврейской конструкции с числительным.
- source_word: יִסְפְּרוּ
  choice: пусть отсчитают
  rationale: Форма множественного числа сохранена; «отсчитают» естественно передаёт установленный отсчёт предписанного срока.
- source_word: לוֹ
  choice: для него
  rationale: Предлог ל обозначает лицо, применительно к которому отсчитывается семидневный срок.
theological_decisions:
- issue: Характер очищения
  choice: его очищения
  alternative: его ритуального очищения; его очищения от нечистоты
  rationale: Контекст указывает на ритуальную процедуру для священника, однако основной текст не уточняет её нравственно или духовно и тем самым сохраняет сдержанность еврейского текста.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной формулировкой законодательного предписания. Множественное число сказуемого и выражение «для него» сохранены согласно еврейскому тексту.
