  yaml_path: translation/ot/ezekiel/044/021.yaml
  text: No priest shall drink wine when entering the inner court[a].
translation:
  language: ru
  text: Ни один священник не должен пить вина, входя во внутренний двор.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַיִן
  choice: вина
  rationale: יַיִן означает «вино»; после отрицания в русском естествен родительный падеж «вина». Начальный союз וְ не передан отдельно, поскольку стих представляет самостоятельное предписание.
- source_word: לֹא יִשְׁתּוּ
  choice: не должен пить
  rationale: Отрицание с имперфектом в данном законодательном контексте выражает запрет; конструкция «не должен пить» ясно передаёт его нормативную силу.
- source_word: כָּל כֹּהֵן
  choice: ни один священник
  rationale: Буквально «всякий священник», но в сочетании с отрицанием речь идёт обо всём классе без исключений; по-русски это естественно выражается словами «ни один священник».
- source_word: בְּ/בוֹאָ/ם אֶל
  choice: входя во
  rationale: 'Предлог בְ с инфинитивом и суффиксом 3-го лица множественного числа обозначает время действия: «при их входе / когда они входят». Деепричастие «входя» естественно согласуется с обобщённым единственным числом «ни один священник».'
- source_word: הֶ/חָצֵר הַ/פְּנִימִית
  choice: внутренний двор
  rationale: חָצֵר в храмовом контексте обозначает двор, а определение הַפְּנִימִית — его внутреннее расположение.
