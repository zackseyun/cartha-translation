  source_fidelity: 'В целом перевод точно передаёт контраст, выделение сыновей Садока, их право приблизиться для служения и жертвенную формулу. Однако «исполняли обязанности при Моём святилище» несколько ослабляет конструкцию «соблюдали/хранили установленное служение (попечение) Моего святилища»: предлог «при» может обозначать лишь службу при учреждении, а не верность порученному храмовому служению.'
