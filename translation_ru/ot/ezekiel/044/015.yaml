  terminology: «Садок», «святилище», «тук», «кровь» и «Яхве» переданы последовательно. Сноска с аппозитивным вариантом для הַכֹּהֲנִים הַלְוִיִּם поставлена на надлежащем месте и сохраняет значимую синтаксическую возможность.
