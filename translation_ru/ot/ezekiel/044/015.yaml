  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם בְּנֵ֣י צָד֗וֹק אֲשֶׁ֨ר שָׁמְר֜וּ אֶת מִשְׁמֶ֤רֶת מִקְדָּשִׁ/י֙ בִּ/תְע֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵֽ/עָלַ֔/י הֵ֛מָּה יִקְרְב֥וּ אֵלַ֖/י לְ/שָֽׁרְתֵ֑/נִי וְ/עָמְד֣וּ לְ/פָנַ֗/י לְ/הַקְרִ֥יב לִ/י֙ חֵ֣לֶב וָ/דָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/015.yaml
  text: But the Levitical priests[a], the sons of Zadok, who kept the charge of my sanctuary when the sons of Israel went astray from me—they shall come near to me to minister to me, and they shall stand before me to offer to me fat and blood[c][b], declares the Lord GOD.
translation:
  language: ru
  text: Но священники-левиты[a], сыновья Садока, которые исполняли порученное служение в Моём святилище, когда сыны Израиля уклонились от Меня, — они будут приближаться ко Мне, чтобы служить Мне, и будут стоять предо Мной, чтобы приносить Мне тук и кровь, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священники, левиты». Еврейское сочетание допускает пояснительное, аппозитивное прочтение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים הַלְוִיִּם
  choice: Но священники-левиты[a]
  rationale: Союз передаёт контраст с предшествующим осуждением неверных левитов. Слитное сочетание естественно по-русски; сноска сохраняет возможность аппозитивного прочтения.
- source_word: בְּנֵי צָדוֹק
  choice: сыновья Садока
  rationale: Формальная передача сохраняет родовую лексику еврейского текста; по смыслу речь идёт о потомках Садока.
- source_word: שָׁמְרוּ אֶת מִשְׁמֶרֶת מִקְדָּשִׁי
  choice: исполняли обязанности при Моём святилище
  rationale: מִשְׁמֶרֶת обозначает в данном священническом контексте порученную службу или обязанность; эта передача естественнее буквального «соблюдали стражу».
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל מֵעָלַי
  choice: когда сыны Израиля уклонились от Меня
  rationale: Инфинитив с ב передаёт обстоятельство времени, а תעה здесь имеет религиозно-нравственный смысл отступления.
- source_word: הֵמָּה יִקְרְבוּ אֵלַי
  choice: они будут приближаться ко Мне
  rationale: Сохранён культовый оттенок קרב — дозволенное священническое приближение к Богу; отдельное местоимение передано явным «они» после тире.
- source_word: לְשָׁרְתֵנִי
  choice: чтобы служить Мне
  rationale: В контексте храма глагол означает священное служение; русское «служить» ясно и сохраняет широкий смысл исходного слова.
- source_word: וְעָמְדוּ לְפָנַי
  choice: и будут стоять предо Мной
  rationale: Формальная передача сохраняет образ служебного предстояния в Божьем присутствии.
- source_word: לְהַקְרִיב לִי חֵלֶב וָדָם
  choice: чтобы приносить Мне тук и кровь
  rationale: Hiphil קרב имеет жертвенный смысл «приносить», а «тук» является точным и устоявшимся обозначением предназначенного для жертвы животного жира.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передан формулой пророческого провозглашения; אֲדֹנָי различён как титул «Владыка», а יהוה — как личное имя Яхве.
theological_decisions:
- issue: Передача составного божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה без неестественного повтора «Господь Господь»; личное имя не подменяется титулом.
- issue: Кто сохраняет право приближаться к Богу для священнического служения
  choice: сыновья Садока, сохранившие верность порученной службе
  alternative: все левиты без различия
  rationale: Текст прямо выделяет сыновей Садока на фоне уклонившегося Израиля и предшествующего контекста; перевод не расширяет и не сужает эту группу.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены культовые термины «святилище», «приближаться», «стоять предо Мной» и «тук»; синтаксис облегчён без устранения исходного акцента на верных священниках.
