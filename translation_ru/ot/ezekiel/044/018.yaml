  yaml_path: translation/ot/ezekiel/044/018.yaml
  text: Linen turbans shall be on their heads[a], and linen undergarments shall be on their loins; they shall not gird themselves with anything that causes sweat.
translation:
  language: ru
  text: На головах у них должны быть льняные тюрбаны, а на чреслах — льняные нижние одежды. Они не должны опоясываться так, чтобы потеть.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не должны опоясываться потом». Еврейская фраза эллиптична; вероятно, имеется в виду, что одежду нельзя надевать или закреплять так, чтобы она вызывала потение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּאֲרֵי
  choice: тюрбаны
  rationale: В контексте священнических одежд слово обозначает головной убор; «тюрбаны» ясно и конкретно передаёт предмет, не сводя значение к общему «украшению».
- source_word: פִשְׁתִּים
  choice: льняные
  rationale: В описании одежды речь идёт об изготовленном из льна полотне; прилагательное «льняные» естественно для современного русского языка. Повтор исходного слова сохранён.
- source_word: מִכְנְסֵי
  choice: нижнее бельё
  rationale: Слово обозначает нижнюю одежду, закрывающую тело от бёдер; современное выражение понятно читателю и не навязывает точный покрой, которого текст не уточняет.
- source_word: מָתְנֵיהֶם
  choice: на бёдрах у них
  rationale: «Бёдра» сохраняет телесно-пространственный смысл еврейского слова и в данном предписании звучит естественнее архаичного «на чреслах».
- source_word: יַחְגְּרוּ
  choice: опоясываться
  rationale: Глагол означает обвязывать или закреплять одежду вокруг тела; «опоясываться» кратко сохраняет одежный образ исходного текста.
- source_word: בַּיָּזַע
  choice: так, чтобы потеть
  rationale: Буквально сочетание передаётся как «потом/в поту», но конструкция эллиптична. Выбранный вариант выражает вероятный практический смысл и не добавляет конкретного материала, например шерсти.
theological_decisions:
- issue: Предписание об одежде священников и смысл заключительного запрета
  choice: Передать запрет как «не должны опоясываться так, чтобы потеть» и отметить буквальную форму в сноске.
  alternative: «Не должны опоясываться потом»; либо конкретизировать запрет как относящийся к шерстяным поясам или одеждам.
  rationale: Еврейская фраза кратка и эллиптична. Контекст требует льняных одежд и, вероятно, запрещает способ одеваться, вызывающий пот, однако сам стих не называет шерсть. Перевод сохраняет практический смысл, а сноска — необычность и неоднозначность формы оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной формой предписания. Избегнуты архаизмы «чресла» и «исподнее», но сохранена культовая конкретность слов «льняные тюрбаны» и «опоясываться».
