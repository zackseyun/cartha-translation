source:
  edition: WLC
  text: בַּ/הֲבִיאֲ/כֶ֣ם בְּנֵֽי נֵכָ֗ר עַרְלֵי לֵב֙ וְ/עַרְלֵ֣י בָשָׂ֔ר לִ/הְי֥וֹת בְּ/מִקְדָּשִׁ֖/י לְ/חַלְּל֣/וֹ אֶת בֵּיתִ֑/י בְּ/הַקְרִֽיבְ/כֶ֤ם אֶת לַחְמִ/י֙ חֵ֣לֶב וָ/דָ֔ם וַ/יָּפֵ֨רוּ֙ אֶת בְּרִיתִ֔/י אֶ֖ל כָּל תּוֹעֲבוֹתֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/007.yaml
  text: when you brought in foreigners[a], uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it—my house—when you presented my food, the fat and the blood, and they broke my covenant[c][b], along with all your abominations.
translation:
  language: ru
  text: когда вы вводили чужеземцев[a], необрезанных сердцем и необрезанных плотью, чтобы они находились в Моём святилище и оскверняли его — Мой дом, — когда вы приносили Мою пищу[b], жир и кровь; и они нарушили Мой завет[c] вдобавок ко всем вашим мерзостям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов чужбины» или «чужих сынов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Мой хлеб»; в контексте жертвоприношений имеется в виду пища, приносимая Богу.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте здесь происходит переход к третьему лицу: «они нарушили Мой завет». Вероятнее всего, речь о только что упомянутых чужеземцах; возможно также более общее продолжение обвинения в адрес «вас».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּהֲבִיאֲכֶם
  choice: когда вы вводили
  rationale: Предлог ב при инфинитиве с суффиксом имеет временное значение; каузативная порода глагола בוא передана глаголом «вводили».
- source_word: בְּנֵי נֵכָר
  choice: чужеземцев
  rationale: Буквально «сынов чужбины»; это устойчивое обозначение людей чужого происхождения. «Чужеземцы» естественно и точно передаёт смысл.
- source_word: עַרְלֵי לֵב
  choice: необрезанных сердцем
  rationale: Сохранён пророческий образ внутренней неверности и нечистоты без его истолковывающей замены.
- source_word: וְעַרְלֵי בָשָׂר
  choice: необрезанных плотью
  rationale: Сохранены буквальный телесный смысл и риторический параллелизм с выражением «необрезанных сердцем».
- source_word: לִהְיוֹת בְּמִקְדָּשִׁי
  choice: чтобы они находились в Моём святилище
  rationale: Перевод сохраняет значение «быть, находиться», а не заменяет его однократным «войти».
- source_word: לְחַלְּלוֹ
  choice: и оскверняли его
  rationale: В породе Piel חלל означает лишать святости, осквернять. Местоимение сохраняет суффикс мужского рода и его естественную связь со «святилищем».
- source_word: אֶת בֵּיתִי
  choice: Мой дом
  rationale: Сохранён храмовый образ «дома»; тире оформляет выражение как пояснение к предшествующему местоимению.
- source_word: בְּהַקְרִיבְכֶם
  choice: когда вы приносили
  rationale: В жертвенном контексте каузативная форма קרב означает «приносить, представлять как жертву».
- source_word: לַחְמִי
  choice: Мою пищу
  rationale: Буквально «Мой хлеб», но в жертвенном контексте слово обозначает пищу, приносимую Богу; буквальная форма отмечена в сноске.
- source_word: חֵלֶב וָדָם
  choice: жир и кровь
  rationale: Названы конкретные составляющие жертвоприношения; русский перевод сохраняет краткость еврейской пары.
- source_word: וַיָּפֵרוּ אֶת בְּרִיתִי
  choice: и они нарушили Мой завет
  rationale: Форма третьего лица множественного числа сохранена; сочетание הפר ברית обычно означает нарушение завета.
- source_word: אֶל כָּל תּוֹעֲבוֹתֵיכֶם
  choice: вдобавок ко всем вашим мерзостям
  rationale: Передано присоединительное значение אֶל в данном обвинительном контексте; формулировка остаётся естественной по-русски.
theological_decisions:
- issue: К чему относится местоименный суффикс в לְחַלְּלוֹ и какова роль выражения «Мой дом»
  choice: «оскверняли его — Мой дом»; местоимение соотнесено со святилищем, а «Мой дом» дано как поясняющее повторение
  alternative: Слить обе части в «оскверняли Мой дом» либо считать «Мой дом» прямым последующим уточнением объекта без явного местоимения
  rationale: Так сохраняются и грамматически выраженный суффикс, и отдельное אֶת בֵּיתִי, не устраняя напряжение еврейского синтаксиса.
- issue: Субъект формы וַיָּפֵרוּ
  choice: «они» — ближайшие по контексту чужеземцы
  alternative: Продолжение обвинения в адрес «вас», то есть храмовых служителей
  rationale: Еврейский текст явно переходит от второго лица множественного числа к третьему. Ближайший грамматически возможный субъект — введённые чужеземцы, но неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заветная метафора обрезания и храмовый образ «Моего дома» сохранены; синтаксические повторы не сглажены ценой утраты смысловых связей.
