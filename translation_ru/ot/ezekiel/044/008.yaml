revisions:
- from: Вы не исполняли обязанностей при Моих святынях, а поставили других исполнять за вас[a] порученное Мною служение в Моём святилище.
  to: Вы не исполняли обязанностей, связанных с Моими святынями, а поставили других исполнять Моё поручение в Моём святилище для себя[a].
  rationale: Правка устраняет неуместный локативный оттенок в первой части и не закрепляет спорный заместительный смысл לָכֶם в основном тексте. Повторяющееся понятие מִשְׁמֶרֶת передано как обязанности/поручение, что естественно по-русски и соответствует храмовому контексту.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:37:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: упрёк за неисполнение храмовой ответственности и назначение других для её исполнения сохранён. Однако «при Моих святынях» чрезмерно локализует מִשְׁמֶרֶת קָדָשַׁי («порученное/обязанности, связанные с Моими святынями»), а «за вас» в основном тексте преждевременно выбирает заместительный оттенок לָכֶם, хотя буквальное «для себя» сохраняет неоднозначность лучше.'
  naturalness: Фраза читается естественно, но «исполнять за вас порученное Мною служение» перегружена и несколько неясна по синтаксису. «Исполнять Моё поручение в Моём святилище для себя» проще и яснее при сохранении возвышенного, но современного регистра.
  terminology: «Святилище» удачно передаёт מִקְדָּשׁ. Для обоих случаев מִשְׁמֶרֶת лучше использовать согласованные понятия ответственности/поручения. «Мои святыни» сохранены как широкое обозначение сакральной сферы, без сведения к предметам или служению.
  issues:
  - severity: medium
    issue: «при Моих святынях» передаёт связь как место служения.
    rationale: Конструкция מִשְׁמֶרֶת קָדָשַׁי означает ответственность за Божьи святыни/священное, а не просто обязанности, исполняемые возле них.
  - severity: low
    issue: «за вас» выбирает один из возможных оттенков לָכֶם в основном тексте.
    rationale: Предлог допускает значение «для себя/для вас» и в контексте — «вместо себя». Нейтральное «для себя» в тексте и вариант «вместо себя» в сноске лучше сохраняют семантическую широту.
  revised_text: Вы не исполняли обязанностей, связанных с Моими святынями, а поставили других исполнять Моё поручение в Моём святилище для себя[a].
