  text: וְ/לֹ֥א שְׁמַרְתֶּ֖ם מִשְׁמֶ֣רֶת קָדָשָׁ֑/י וַ/תְּשִׂימ֗וּ/ן לְ/שֹׁמְרֵ֧י מִשְׁמַרְתִּ֛/י בְּ/מִקְדָּשִׁ֖/י לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/008.yaml
  text: You have not kept charge of my holy things[a], but have appointed others to keep charge in my sanctuary for you.
translation:
  language: ru
  text: Вы не исполняли обязанностей, связанных с Моими святынями, а поставили других исполнять Моё поручение в Моём святилище для себя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместо себя» — то есть другие были поставлены исполнять это служение на их месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַרְתֶּם מִשְׁמֶרֶת
  choice: исполняли обязанности
  rationale: Сочетание שׁמר с מִשְׁמֶרֶת здесь обозначает верное исполнение вверенных храмовых обязанностей, а не только физическую охрану.
- source_word: קָדָשָׁי
  choice: при Моих святынях
  rationale: '«Мои святыни» сохраняет широту еврейского выражения: оно может охватывать священные предметы, установления и всё относящееся к святыне, не сводя смысл лишь к вещам.'
- source_word: וַתְּשִׂימוּן
  choice: поставили
  rationale: Глагол שׂים буквально означает «ставить, помещать» и в данном контексте передаёт назначение других людей на служение.
- source_word: לְשֹׁמְרֵי מִשְׁמַרְתִּי
  choice: исполнять порученное Мною служение
  rationale: Передаёт причастие «хранящие/исполняющие» и культовое значение מִשְׁמֶרֶת как вверенной Богом обязанности; формулировка естественна по-русски и сохраняет принадлежность поручения Богу.
- source_word: בְּמִקְדָּשִׁי
  choice: в Моём святилище
  rationale: «Святилище» точно передаёт культовый смысл מִקְדָּשׁ в контексте храма Иезекииля.
- source_word: לָכֶם
  choice: за вас
  rationale: Кратко и естественно передаёт, что другие исполняли служение от их имени или вместо них; более явный заместительный оттенок отмечен в сноске.
theological_decisions:
- issue: Объём значения «Мои святыни»
  choice: Широкое обозначение святынь и связанных с ними священных обязанностей
  alternative: Только священные предметы либо только священная должность
  rationale: Еврейское выражение имеет широкий смысл, поэтому перевод не ограничивает упрёк одной категорией предметов или одним видом служения.
- issue: Отношение назначенных служителей к адресатам в слове לָכֶם
  choice: «за вас»
  alternative: «вместо вас» или «для вас»
  rationale: Предлог допускает оттенки служения от их имени и замещения; основной текст сохраняет ёмкую русскую формулировку, а сноска прямо указывает возможный заместительный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор корня исходного текста передан близкими выражениями «исполняли обязанности» и «исполнять… служение», чтобы избежать тяжеловесности и сохранить связь между двумя упоминаниями вверенного служения.
