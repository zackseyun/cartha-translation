base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/027.yaml
  text: And on the day he enters the sanctuary[a], into the inner court, to minister in the sanctuary, he shall present his sin offering, declares the Lord GOD.
translation:
  language: ru
  text: И в тот день, когда он войдёт в святилище, во внутренний двор, чтобы служить в святилище, он должен принести свою жертву за грех[a], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою очистительную жертву». В жертвенном контексте древнееврейское חַטָּאת может обозначать жертву за грех или очищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם בֹּאוֹ
  choice: И в тот день, когда он войдёт
  rationale: Сочетание предлога с «днём» и инфинитива с местоименным суффиксом имеет временное значение. Формулировка естественна по-русски, а начальное «И» сохраняет связь с предыдущими предписаниями.
- source_word: אֶל־הַקֹּדֶשׁ
  choice: в святилище
  rationale: קֹדֶשׁ здесь обозначает священное пространство; «святилище» передаёт культовый контекст, не сужая значение до конкретного помещения.
- source_word: אֶל־הֶחָצֵר הַפְּנִימִית
  choice: во внутренний двор
  rationale: Повторное אֶל уточняет место назначения; русская конструкция сохраняет это поясняющее присоединение без добавления отсутствующего в тексте «то есть».
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: чтобы служить в святилище
  rationale: В священническом контексте שׁרת означает культовое служение. «Служить» естественно и сохраняет связь с богослужебной обязанностью.
- source_word: יַקְרִיב חַטָּאתוֹ
  choice: он должен принести свою жертву за грех
  rationale: Форма יקריב в жертвенном контексте означает принесение жертвы, а חַטָּאתוֹ — принадлежащую ему жертву за грех или очищение. Модальная конструкция передаёт предписывающую силу древнееврейского имперфекта.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם вводит торжественное божественное изречение. «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и избегает неестественного повтора «Господь Господь».
theological_decisions:
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Слово обозначает не просто грех, а соответствующую жертву; традиционное название понятно читателю, тогда как очистительная функция обряда сохранена в примечании.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, не подменяя имя общим титулом и не привнося дополнительное слово «Бог».
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для пророческого и культового контекста. Синтаксис сохраняет повтор слова «святилище» и поясняющее упоминание внутреннего двора; терминология понятна неспециалисту.
