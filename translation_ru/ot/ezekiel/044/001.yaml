lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: повёл меня обратно
  rationale: Каузативная форма от שׁוב означает, что проводник заставил Иезекииля вернуться; этот вариант естественно передаёт движение обратно.
- source_word: דֶּרֶךְ
  choice: по пути к
  rationale: Слово обозначает путь или маршрут. Предлог «к» не создаёт впечатления, будто Иезекииль прошёл через закрытые ворота.
- source_word: שַׁעַר
  choice: ворота
  rationale: Обычное русское обозначение ворот в архитектурном описании; множественное число естественно для русского при обозначении сооружения.
- source_word: הַמִּקְדָּשׁ
  choice: святилища
  rationale: Передаёт священный храмовый комплекс, не сужая значение до внутреннего помещения.
- source_word: הַחִיצוֹן
  choice: внешним
  rationale: Сохраняет архитектурное противопоставление внутренним воротам храмового комплекса.
- source_word: הַפֹּנֶה קָדִים
  choice: обращённым на восток
  rationale: Точно и естественно передаёт ориентацию ворот, выраженную причастием и наречием направления.
- source_word: וְהוּא סָגוּר
  choice: Они были закрыты
  rationale: Передаёт состояние ворот без добавления противительного оттенка; местоимение согласовано с нормативным русским множественным числом слова «ворота».
