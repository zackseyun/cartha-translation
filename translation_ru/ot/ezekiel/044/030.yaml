base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/030.yaml
  text: And the first of all the firstfruits of everything[a], and every contribution from all your contributions, shall belong to the priests. You shall give the first of your dough to the priest[c][b], to cause a blessing to rest on your house.
translation:
  language: ru
  text: Первая часть от всех первинок, от всего, и всякое приношение из всех ваших приношений[a] будут принадлежать священникам. Первую часть вашего теста[b] отдавайте священнику, чтобы благословение пребывало на вашем доме[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякое приношение из всех ваших приношений». Еврейское слово обозначает долю, отделённую и посвящённую для священного употребления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «первую часть замешанной вами порции теста». Еврейское слово может обозначать тесто или замес.'
    reason: lexical_alternative
  - marker: c
    text: 'То есть: чтобы благословение пребывало на вашем доме; «дом» может также означать семью и всё хозяйство человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: первая часть
  rationale: Слово обозначает первую или главную долю. В первом случае сочетание с בִּכּוּרֵי передано без полного слияния двух близких понятий; во втором оно указывает на первую часть теста.
- source_word: בִּכּוּרֵי
  choice: первинки
  rationale: Устоявшееся в библейском русском языке обозначение первых плодов урожая, посвящаемых Богу; оно сохраняет культовый смысл и понятно из контекста.
- source_word: תְּרוּמַת / תְּרוּמוֹתֵיכֶם
  choice: священное приношение / то, что вы посвящаете
  rationale: Термин обозначает отделённую долю, отдаваемую для священного употребления. Формулировка передаёт посвящение этой доли и естественно воспроизводит сочетание единственного и множественного числа.
- source_word: לַכֹּהֲנִים יִהְיֶה
  choice: будут принадлежать священникам
  rationale: Оборот выражает установленное право священников на перечисленные дары; множественное число в русском согласовано с составным рядом даров.
- source_word: עֲרִסוֹתֵיכֶם
  choice: вашего теста
  rationale: В данном контексте слово обозначает тесто либо замешанную порцию теста, от которой отделяется первая часть.
- source_word: תִּתְּנוּ לַכֹּהֵן
  choice: отдавайте священнику
  rationale: Передаёт предписание, обращённое ко множеству людей, при собирательно понимаемом получателе в единственном числе.
- source_word: לְהָנִיחַ בְּרָכָה
  choice: чтобы благословение пребывало
  rationale: Каузативный инфинитив от נוח буквально выражает побуждение к тому, чтобы благословение покоилось или пребывало; русская формулировка сохраняет образ устойчивого присутствия.
- source_word: אֶל בֵּיתֶךָ
  choice: на вашем доме
  rationale: Предлог в сочетании с образом пребывающего благословения естественно передаётся как «на»; «дом» сохраняет конкретный образ и может включать весь домочадный круг.
theological_decisions:
- issue: Характер благословения, пребывающего на доме
  choice: Сохранено общее понятие благословения без уточнения его формы.
  alternative: Материальное благополучие либо исключительно духовная милость.
  rationale: Еврейский текст не определяет содержание благословения, поэтому перевод не сужает его до материального достатка и не придаёт ему исключительно духовного смысла.
- issue: Связь дара священнику с благословением
  choice: Целевая конструкция передана словами «чтобы благословение пребывало».
  alternative: Представить благословение как автоматическую плату за приношение либо лишь как пожелание.
  rationale: לְהָנִיחַ выражает цель или предполагаемый результат предписанного дара, но текст не объясняет механизм этой связи; эта напряжённость сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слово «первинки» сохраняет культовый термин, а остальной синтаксис сделан доступным для обычного читателя. Повтор и многослойность первой еврейской фразы частично сохранены без неестественной кальки.
