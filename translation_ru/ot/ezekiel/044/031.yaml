base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/031.yaml
  text: The priests shall not eat any carcass or animal torn by beasts[a], whether from birds or from livestock.
translation:
  language: ru
  text: Священники не должны есть ни падали, ни растерзанного животного — ни из птиц, ни из скота.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «животное, умершее без надлежащего заклания или растерзанное хищниками».'
    reason: 'Лексическая альтернатива: נְבֵלָה может быть развёрнуто передано как животное, умершее без надлежащего заклания, а טְרֵפָה — как животное, растерзанное хищниками.'
lexical_decisions:
- source_word: כָּל
  choice: никакой / ничего
  rationale: В отрицательном предписании перед существительными в единственном числе передаёт всеобъемлющий запрет; по-русски естественно выразить его отрицательными местоимениями.
- source_word: נְבֵלָה
  choice: падали
  rationale: Слово обозначает труп животного, в частности животное, умершее без надлежащего заклания; «падаль» кратко и точно передаёт смысл в контексте пищевого запрета.
- source_word: טְרֵפָה
  choice: растерзанного
  rationale: Обозначает животное или мясо, растерзанное хищником. Субстантивированное «растерзанное» сохраняет конкретный смысл, не добавляя прямо не названного деятеля.
- source_word: מִן הָעוֹף
  choice: из птиц
  rationale: עוֹף в данном пищевом контексте обозначает птиц; конструкция с מִן указывает на категорию, к которой относится падаль или растерзанное.
- source_word: וּמִן הַבְּהֵמָה
  choice: из скота
  rationale: בְּהֵמָה в противопоставлении птицам означает наземных домашних животных; «скот» точно и естественно передаёт эту категорию.
- source_word: לֹא יֹאכְלוּ
  choice: не должны есть
  rationale: Имперфект с לֹא в законодательном контексте выражает запрет; «не должны есть» звучит современно и сохраняет нормативную силу.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Определённое обозначение священнического сословия в контексте храмовых установлений.
