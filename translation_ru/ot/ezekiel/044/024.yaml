review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: речь о судебной роли священников, суде согласно Божьим משפטים, соблюдении תורות и חקות, назначенных сроков и суббот. Однако сочетание «встать, чтобы судить» в русском звучит неестественно, а «во все установленные Мною времена» менее ясно передаёт временное значение בְּכָל. Предлагаемая правка сохраняет судебный образ через «выступать судьями», не добавляя толкования.'
  naturalness: «При тяжбе» и особенно «должны встать, чтобы судить» тяжеловесны для современного литературного русского. «В случае тяжбы они должны выступать судьями» естественно и точно выражает функцию, обозначенную еврейским «стоять, чтобы судить». «Во все назначенные Мною времена» яснее читается как указание на установленные Богом сроки.
  terminology: Различение «судебные установления», «наставления» и «постановления» возможно и в целом последовательно. Для יְקַדֵּשׁוּ более идиоматично «свято соблюдать» в сочетании с субботами; это передаёт требование считать их святыми, не смешивая его с первым «соблюдать» как общим исполнением норм.
  issues:
