    rationale: Буквальное «встать» здесь в современном русском не передаёт ясно судебную функцию и создаёт впечатление физического действия без понятной цели. «Выступать судьями» передаёт значение в контексте судебного разбирательства.
  - severity: low
    issue: «Во все установленные Мною времена» стилистически и семантически менее ясно.
    rationale: Предлог «во» может восприниматься как длительность на протяжении каждого срока. «Во все назначенные Мною времена» сохраняет широкое значение מוֹעֵד и яснее выражает назначенность сроков Богом.
  - severity: low
    issue: «Освящать Мои субботы» менее естественно, чем обычная русская формула.
    rationale: В русском языке о субботах естественнее сказать «свято соблюдать». Это адекватно пиэлю קדש в данном контексте и не требует представлять субботы как объект нового освящения.
