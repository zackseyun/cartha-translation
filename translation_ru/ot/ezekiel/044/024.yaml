base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/024.yaml
  text: In a dispute[a], they shall stand to judge; they shall judge it according to my judgments. They shall keep my laws and my statutes at all my appointed times[b], and they shall keep my Sabbaths holy.
translation:
  language: ru
  text: В случае тяжбы[a] они должны выступать судьями и судить её по Моим судебным установлениям. Они должны соблюдать Мои наставления и Мои постановления во все назначенные Мною времена[b] и свято соблюдать Мои субботы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «споре», «судебном деле» или «разбирательстве».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «назначенные Мною времена» может также означать «назначенные Мною праздники» или «установленные праздничные сроки».
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: тяжба
  rationale: Слово обозначает спор, рассматриваемый в судебном порядке. «Тяжба» сохраняет юридический характер контекста, не сужая значение до конкретного вида иска.
- source_word: יַעַמְדוּ ל/שפט
  choice: должны встать, чтобы судить
  rationale: Сохранён образ буквального «вставания» для исполнения судебной обязанности; модальная конструкция «должны» естественно передаёт предписывающую силу контекста.
- source_word: בְּ/מִשְׁפָּטַ/י
  choice: по Моим судебным установлениям
  rationale: Перевод сохраняет юридический оттенок מִשְׁפָּט и отличает это слово от следующих תּוֹרוֹת и חֻקּוֹת.
- source_word: ו/שפט/הו
  choice: и судить её
  rationale: Местоимение отнесено к «тяжбе»; повтор глагола «судить» сохраняет повтор корня שפט в еврейском тексте.
- source_word: תּוֹרֹתַ/י
  choice: Мои наставления
  rationale: תּוֹרָה может означать как закон, так и авторитетное наставление. Здесь «наставления» сохраняет нормативный смысл и позволяет не смешивать термин с חֻקּוֹת.
- source_word: חֻקֹּתַ/י
  choice: Мои постановления
  rationale: «Постановления» передаёт смысл предписанных, установленных норм и естественно звучит в современном русском юридико-религиозном регистре.
- source_word: בְּ/כָל מוֹעֲדַ/י
  choice: во все установленные Мною времена
  rationale: מוֹעֵד может обозначать назначенное время, священное собрание или праздник. Основной текст сохраняет широту значения, а культовое значение отмечено в сноске.
- source_word: יִשְׁמֹרוּ
  choice: должны соблюдать
  rationale: В контексте заповедей שמר означает хранить и исполнять; «соблюдать» является естественным современным русским соответствием.
- source_word: שַׁבְּתוֹתַ/י
  choice: Мои субботы
  rationale: Сохранены явное множественное число и притяжательная форма исходного текста.
- source_word: יְקַדֵּשׁוּ
  choice: освящать
  rationale: 'Порода пиэль передаёт активное отношение к субботам как к святыне: посвящать их Богу и соблюдать как святые.'
theological_decisions:
- issue: Различение ряда правовых терминов в священническом предписании
  choice: 'Передать מִשְׁפָּטִים, תּוֹרוֹת и חֻקּוֹת различными выражениями: «судебные установления», «наставления», «постановления».'
  alternative: Объединить их под общими словами «законы», «правила» или «предписания».
  rationale: Еврейский текст намеренно ставит рядом родственные, но не полностью совпадающие правовые термины. Их различение сохраняет структуру и смысловое напряжение источника, не приписывая каждому термину чрезмерно узкого богословского определения.
- issue: Значение מוֹעֵד
  choice: В основном тексте сохранить широкое значение «установленные времена».
  alternative: Перевести непосредственно как «праздники» или «праздничные собрания».
  rationale: В данном культовом контексте слово может указывать на праздники, однако его лексическое значение шире; неоднозначность сохранена с помощью сноски.
translation_notes:
  register: Современный литературный русский язык с достоинством нормативно-священнической речи. Сохранены судебная образность, повтор глагола «судить», различие правовых терминов и неоднозначность слова מוֹעֵד. Прописные буквы в формах «Мои/Мною» последовательно обозначают речь Бога.
