  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֶל מֵ֣ת אָדָ֔ם לֹ֥א יָב֖וֹא לְ/טָמְאָ֑ה כִּ֣י אִם לְ/אָ֡ב וּ֠/לְ/אֵם וּ/לְ/בֵ֨ן וּ/לְ/בַ֜ת לְ/אָ֗ח וּ/לְ/אָח֛וֹת אֲשֶֽׁר לֹא הָיְתָ֥ה לְ/אִ֖ישׁ יִטַּמָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/025.yaml
  text: And they shall not go near a dead person to make themselves unclean; but for father or mother[a], for son or daughter, for brother, or for a sister who has not belonged to a man, they may make themselves unclean.
translation:
  language: ru
  text: Они не должны подходить к умершему человеку и оскверняться. Но из-за отца или матери, сына или дочери, брата или сестры, которая не была замужем[a], они могут оскверниться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которая не была у мужчины», то есть не имела мужа.'
    reason: Сноска сохраняет буквальный образ еврейского выражения, тогда как основной текст передаёт его естественным современным русским языком.
lexical_decisions:
- source_word: מֵת אָדָם
  choice: умерший человек
  rationale: Сочетание буквально обозначает умершего человека. Такой перевод сохраняет значение אָדָם и не добавляет прямо не названного в тексте слова «тело», хотя речь подразумевает контакт с умершим.
- source_word: יָבוֹא אֶל
  choice: приближаться к
  rationale: В контексте священнических правил выражение означает приближение к умершему, влекущее ритуальную нечистоту; «приближаться» естественно передаёт этот смысл.
- source_word: לְטָמְאָה
  choice: чтобы не оскверниться
  rationale: Инфинитив указывает на связанный с приближением результат. Русская конструкция с отрицанием ясно передаёт запрет становиться ритуально нечистым.
- source_word: כִּי אִם
  choice: но ради
  rationale: Оборот вводит исключения из предшествующего запрета; «но» сохраняет противопоставление, а «ради» естественно связывает разрешение с перечисленными родственниками.
- source_word: לְאָב וּלְאֵם וּלְבֵן וּלְבַת לְאָח וּלְאָחוֹת
  choice: ради отца или матери, сына или дочери, брата или сестры
  rationale: Предлог לְ указывает на родственников, ради которых допускается осквернение. Парные союзы «или» естественны в русском перечне исключений и не меняют его охвата.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: которая не была замужем
  rationale: Буквально сестра «не была у/для мужчины»; в данном контексте это устойчиво указывает на отсутствие мужа. Идиоматический русский перевод передаёт смысл без неестественной или двусмысленной формулировки.
- source_word: יִטַּמָּאוּ
  choice: они могут оскверниться
  rationale: В правовом контексте имперфект выражает разрешение в рамках исключения, а не предписание непременно оскверниться.
theological_decisions:
- issue: Юридическая сила יִטַּמָּאוּ
  choice: 'разрешение: «они могут оскверниться»'
  alternative: 'предписание: «они должны оскверниться»; простой футурум: «они осквернятся»'
  rationale: Заключительная форма завершает перечень исключений из запрета. Поэтому она допускает осквернение ради названных родственников, но не требует его.
- issue: Смысл определения сестры אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: сестра, которая не была замужем
  alternative: сестра, которая не принадлежала мужчине; сестра-девственница
  rationale: Еврейская формула наиболее естественно обозначает сестру, не состоявшую в браке и потому не связанную с мужем. Перевод «девственница» был бы более узким, чем исходная формулировка.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Термин «оскверниться» сохраняет традиционную сакрально-ритуальную окраску корня טמא; синтаксис остаётся доступным для широкого читателя.
