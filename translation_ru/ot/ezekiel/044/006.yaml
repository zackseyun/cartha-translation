  text: וְ/אָמַרְתָּ֤ אֶל מֶ֨רִי֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רַב לָ/כֶ֛ם מִֽ/כָּל תּוֹעֲבֽוֹתֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/006.yaml
  text: 'And say to the rebellious house[a], to the house of Israel, ‘Thus says the Lord GOD: Enough of all your abominations, O house of Israel.’'
translation:
  language: ru
  text: 'И скажи мятежному народу[a], дому Израиля: «Так говорит Владыка Яхве: довольно вам всех ваших мерзостей, дом Израиля!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «мятежному»; еврейское существительное может означать также «мятеж», «непокорность» или собирательно — «мятежные люди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרִי
  choice: мятежному народу
  rationale: Существительное может обозначать «мятеж», «непокорность» или, метонимически и собирательно, непокорных людей. В обращении к Израилю собирательное «мятежному народу» естественно по-русски и сохраняет смысл; неоднозначность отмечена в сноске.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохранено традиционное заветно-национальное обозначение и приложение к предыдущему обращению.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה, избегая неестественного сочетания «Господь Господь».
- source_word: רַב לָכֶם
  choice: довольно с вас
  rationale: Русский идиоматический оборот передаёт резкое требование прекратить то, в чём адресаты уже зашли слишком далеко.
- source_word: מִכָּל תּוֹעֲבוֹתֵיכֶם
  choice: всех ваших мерзостей
  rationale: Фраза зависит от «довольно с вас»; «мерзости» сохраняет сильную нравственно-культовую окраску תּוֹעֵבָה в контексте осквернения святилища.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранная передача различает титул אֲדֹנָי и личное имя יהוה, не превращая тетраграмматон в общий титул.
- issue: Характер осуждаемых действий в תּוֹעֲבוֹתֵיכֶם
  choice: мерзостей
  alternative: отвратительных дел
  rationale: «Мерзости» сохраняет напряжённую богословскую и культовую лексику Иезекииля, не сужая её только до нравственных проступков.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим регистром. Повтор «дом Израиля» сохранён как риторическое обрамление обращения; формула «довольно с вас» звучит естественно и передаёт резкость оригинала.
