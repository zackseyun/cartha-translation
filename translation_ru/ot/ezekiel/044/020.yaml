    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלֵּחוּ
  choice: бреют
  rationale: Порода пиэль глагола גלח обозначает бритьё; в сочетании с «головы» речь идёт о запрете сбривать волосы на голове.
- source_word: פֶרַע ... יְשַׁלֵּחוּ
  choice: не отращивают длинных волос
  rationale: Буквально сочетание передаёт мысль о волосах, оставленных расти свободно или без стрижки; русская формулировка естественно выражает запрет носить чрезмерно отросшие волосы.
- source_word: כָּסוֹם יִכְסְמוּ
  choice: непременно подстригают
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает предписание; «непременно» сохраняет этот акцент, а «подстригают» передаёт значение обрезания волос.
- source_word: רֹאשָׁם / רָאשֵׁיהֶם
  choice: головы / волосы на голове
  rationale: В первом случае естественно сказать «брить головы»; в заключительной части волосы названы явно, чтобы по-русски не возникло неуместного выражения «подстригать головы».
