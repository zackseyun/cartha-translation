id: EZK.44.11
reference: Ezekiel 44:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָי֤וּ בְ/מִקְדָּשִׁ/י֙ מְשָׁ֣רְתִ֔ים פְּקֻדּוֹת֙ אֶל שַׁעֲרֵ֣י הַ/בַּ֔יִת וּֽ/מְשָׁרְתִ֖ים אֶת הַ/בָּ֑יִת הֵ֠מָּה יִשְׁחֲט֨וּ אֶת הָ/עֹלָ֤ה וְ/אֶת הַ/זֶּ֨בַח֙ לָ/עָ֔ם וְ/הֵ֛מָּה יַעַמְד֥וּ לִ/פְנֵי/הֶ֖ם לְ/שָֽׁרְתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/011.yaml
  text: Yet they shall be ministers in my sanctuary[a], having oversight at the gates of the temple and ministering in the temple. They shall slaughter the burnt offering and the sacrifice for the people[c][b], and they shall stand before them to minister to them.
translation:
  language: ru
  text: 'И всё же они будут служить в Моём святилище: нести обязанности у ворот храма[a] и исполнять служение в храме[b]. Они будут закалывать для народа[c] всесожжение и жертву и стоять перед людьми, чтобы служить им.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осуществлять надзор у ворот храма»; возможны также значения «нести поручение» или «исполнять обязанности».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в доме». Здесь «дом» означает храм.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от имени народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים / לְשָׁרְתָם
  choice: служить / исполнять служение
  rationale: Корень שׁרת обозначает прежде всего храмовое, культовое служение. Эти русские выражения сохраняют специальный смысл, оставаясь естественными и не приписывая левитам полного священнического статуса.
- source_word: פְּקֻדּוֹת אֶל שַׁעֲרֵי הַבַּיִת
  choice: нести обязанности у ворот храма
  rationale: פְּקֻדּוֹת может указывать на порученные обязанности, попечение или надзор. Основной текст передаёт назначенную функцию, а примечание сохраняет более конкретную возможность надзора.
- source_word: הַבַּיִת
  choice: храм
  rationale: В контексте храмового видения «дом» обозначает храм; «храм» ясно и естественно передаёт референт по-русски. Буквальная форма отмечена в сноске.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, полностью сжигавшейся на жертвеннике.
- source_word: הַזֶּבַח
  choice: жертва
  rationale: זבח здесь является общим обозначением закалываемой жертвы и не требует сужения до мирной жертвы.
- source_word: לָעָם
  choice: для народа
  rationale: Предлог ל допускает значение пользы или представительства. Краткое «для народа» естественно и сохраняет эту широту.
- source_word: יַעַמְדוּ לִפְנֵיהֶם לְשָׁרְתָם
  choice: стоять перед людьми, чтобы служить им
  rationale: Еврейские местоименные суффиксы имеют множественное число и относятся к людям народа как к совокупности. Повтор существительного устраняет неестественное русское согласование «народ — перед ними», сохраняя смысл готовности к служению.
- source_word: וְהָיוּ
  choice: И всё же они будут
  rationale: 'Союз связывает стих с предшествующим ограничением и в контексте имеет уступительно-противительный оттенок: им запрещено приближаться как священникам, но за ними сохраняется подчинённое храмовое служение.'
theological_decisions:
- issue: Роль левитов, отстранённых от священнического приближения
  choice: 'За ними сохраняется подчинённое храмовое служение: обязанности у ворот, обслуживание храма и заклание жертв для народа.'
  alternative: Они продолжают совершать полное священническое служение.
  rationale: Ближайший контекст отличает этих левитов от священников, которым позволено приближаться к Господу. Перечисленные здесь функции описывают ограниченное служение, не стирая этого различия.
translation_notes:
  register: Современный литературный русский язык с достоинством храмовой речи. Термины «святилище», «всесожжение» и «жертва» сохраняют культовую точность; синтаксис упрощён лишь там, где буквальное согласование собирательного «народ» с местоимениями множественного числа звучало бы неестественно.
