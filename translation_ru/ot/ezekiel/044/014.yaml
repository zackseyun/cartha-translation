  text: וְ/נָתַתִּ֣י אוֹתָ֔/ם שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/בָּ֑יִת לְ/כֹל֙ עֲבֹ֣דָת֔/וֹ וּ/לְ/כֹ֛ל אֲשֶׁ֥ר יֵעָשֶׂ֖ה בּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/014.yaml
  text: Yet I will appoint them to keep charge of the house[a], for all its service and for all that is done in it.
translation:
  language: ru
  text: Но Я назначу их хранителями Дома[a], ответственными за всё служение в нём и за всё, что в нём совершается.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храма». Букв. «Дома»; в данном контексте это обычное библейское обозначение храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Но Я поставлю
  rationale: Глагол נתן буквально означает «дать, поставить», а при обозначении последующей обязанности — «назначить, поставить на служение». Союз ו передаёт контекстуальное противопоставление предыдущему осуждению, поэтому переведён «но».
- source_word: אוֹתָם
  choice: их
  rationale: Прямое дополнение указывает на левитов, о которых говорится в ближайшем контексте.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: блюсти вверенное им служение
  rationale: Сочетание причастия и однокоренного существительного обозначает ответственное исполнение порученной обязанности. «Блюсти» сохраняет идею тщательного соблюдения и охраны, а уточнение «вверенное им» естественно передаёт смысл поручения.
- source_word: הַבָּיִת
  choice: при Храме
  rationale: Существительное буквально означает «дом», но в данном видении обозначает храм. «При Храме» естественно выражает сферу порученной службы; прописная буква подчёркивает конкретный Храм в видении, не вводя дополнительного толкования.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: совершать всю работу в нём
  rationale: עֲבֹדָה охватывает работу и служение. В связи с Храмом речь идёт обо всём круге практических и культовых обязанностей; нейтральное «работу» не сужает значение до богослужения.
- source_word: וּלְכֹל אֲשֶׁר יֵעָשֶׂה בוֹ
  choice: и всё, что должно быть в нём сделано
  rationale: Пассивная форма несовершенного вида охватывает всё, что совершается или подлежит совершению в Храме. Оборот «должно быть сделано» уместно выражает круг возложенных обязанностей, не уточняя их содержания.
theological_decisions:
- issue: Значение הַבָּיִת («дом»)
  choice: Храм
  alternative: дом
  rationale: В контексте видения Иезекииля речь несомненно идёт о храме и обязанностях левитов. Основной текст передаёт референт ясно для современного читателя, а буквальное значение сохраняется в примечании.
- issue: Характер обязанностей левитов
  choice: широкий круг храмовой работы и поручений
  alternative: только богослужебное служение
  rationale: Слова עֲבֹדָה и «всё, что должно быть… сделано» имеют широкий охват; перевод не ограничивает обязанности исключительно литургическими действиями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Глагол «блюсти» выбран как понятный и достойный по регистру способ передать ответственное соблюдение порученной службы; синтаксис сделан естественным для русского языка.
