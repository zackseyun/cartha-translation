  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְבִיאֵ֜/נִי דֶּֽרֶךְ שַׁ֣עַר הַ/צָּפוֹן֮ אֶל פְּנֵ֣י הַ/בַּיִת֒ וָ/אֵ֕רֶא וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֣ית יְהוָ֑ה וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/004.yaml
  text: Then he brought me by way of the north gate to the front of the house[a], and I looked, and behold, the glory of Yahweh filled the house of Yahweh[b]; and I fell on my face.
translation:
  language: ru
  text: Затем он привёл меня через северные ворота[a] к передней стороне дома. Я увидел — и вот, слава Яхве наполнила дом Яхве[b], и я пал ниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «путём северных ворот».'
    reason: lexical_alternative
  - marker: b
    text: То есть храм. Перевод сохраняет слово «дом», употреблённое Иезекиилем.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Затем он привёл меня
  rationale: Порода hifil глагола בוא с суффиксом 1-го лица означает «он привёл меня»; «затем» естественно передаёт последовательность повествования.
- source_word: דֶּרֶךְ שַׁעַר הַצָּפוֹן
  choice: через северные ворота
  rationale: דֶּרֶךְ указывает на путь или маршрут движения. В данном сочетании естественный русский эквивалент — «через северные ворота»; более буквальная маршрутная формулировка вынесена в примечание.
- source_word: אֶל פְּנֵי הַבַּיִת
  choice: к передней стороне дома
  rationale: פְּנֵי буквально связано с «лицом», а здесь обозначает переднюю сторону здания или место перед ним. Формулировка сохраняет пространственный образ и слово «дом».
- source_word: וָאֵרֶא וְהִנֵּה
  choice: Я увидел — и вот
  rationale: ראה передаётся обычным «увидел», а הִנֵּה — торжественным указательным оборотом «и вот», привлекающим внимание к явлению.
- source_word: מָלֵא
  choice: наполнила
  rationale: Форма выражает состояние наполненности, которое по-русски естественно передать глагольным сказуемым; согласование определяется существительным женского рода «слава».
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: כָּבוֹד в контексте храмового видения означает явленное величие и присутствие Бога; личное имя יהוה передано как «Яхве».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется повторяющаяся у Иезекииля лексема בַּיִת — «дом», хотя по смыслу речь идёт о храме.
- source_word: וָאֶפֹּל אֶל פָּנָי
  choice: и я пал ниц
  rationale: Русский устойчивый оборот точно и кратко передаёт падение лицом вниз как телесную реакцию благоговения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие.
- issue: Передача בַּיִת / בֵּית יְהוָה в храмовом видении
  choice: дом / дом Яхве
  alternative: храм / храм Яхве
  rationale: Хотя референтом является храм, перевод «дом» сохраняет намеренно повторяемую лексику исходного текста и не устраняет её образность.
- issue: Характер реакции пророка
  choice: пал ниц
  alternative: упал лицом вниз
  rationale: Формулировка передаёт физическую позу и допускаемый контекстом оттенок благоговейного преклонения, не добавляя явного объяснения мотива.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Синтаксис сделан ясным для широкого читателя; «и вот» и «пал ниц» сохраняют достоинство сцены без излишней архаизации.
