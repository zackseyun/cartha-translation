source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהוָ֗ה הַ/שַּׁ֣עַר הַ/זֶּה֩ סָג֨וּר יִהְיֶ֜ה לֹ֣א יִפָּתֵ֗חַ וְ/אִישׁ֙ לֹא יָ֣בֹא ב֔/וֹ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּ֣א ב֑/וֹ וְ/הָיָ֖ה סָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/002.yaml
  text: And Yahweh said to me[a], “This gate shall remain shut; it shall not be opened, and no one shall enter through it, because Yahweh, the God of Israel, has entered through it. Therefore it shall remain shut.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Эти ворота останутся закрытыми; их не откроют, и никто[a] не войдёт через них, потому что Яхве, Бог Израиля, вошёл через них. Поэтому они останутся закрытыми».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ни один мужчина»; еврейское слово мужского рода употреблено здесь в обобщающем значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога посредством принятой русской транслитерации, а не заменяет его титулом.
- source_word: הַשַּׁעַר הַזֶּה
  choice: эти ворота
  rationale: Указательное местоимение имеет значение близости («эти»); שַׁעַר в данном контексте означает храмовые ворота. Русское «ворота» грамматически имеет форму множественного числа.
- source_word: סָגוּר יִהְיֶה
  choice: останутся закрытыми
  rationale: Сочетание предикативного прилагательного с היה обозначает продолжающееся состояние; эта формулировка естественно передаёт его длительность.
- source_word: לֹא יִפָּתֵחַ
  choice: их не откроют
  rationale: Нифаль глагола פתח имеет пассивное значение; неопределённо-личная русская конструкция естественно передаёт пассив, согласуясь с существительным «ворота».
- source_word: וְאִישׁ לֹא יָבֹא בוֹ
  choice: и никто не войдёт через них
  rationale: אִישׁ — существительное мужского рода в единственном числе, употреблённое здесь в обобщающем значении. «Никто» естественно выражает это значение по-русски, а «через них» передаёт пространственный смысл בּוֹ применительно к воротам.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой ворота должны оставаться закрытыми.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Яхве, Бог Израиля
  rationale: Запятые ясно передают приложительное отношение между личным именем и титулом.
- source_word: בָּא בוֹ
  choice: вошёл через них
  rationale: Форма qatal обозначает завершённое действие; русский прошедший вид совершенного вида точно передаёт его, а «через них» соответствует движению через ворота.
- source_word: וְהָיָה סָגוּר
  choice: поэтому они останутся закрытыми
  rationale: Заключительная фраза повторяет постоянное закрытое состояние как следствие названной причины; «поэтому» естественно выражает контекстуальную результативную связь.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не заменяет его титулом.
- issue: Обобщающее употребление אִישׁ
  choice: никто
  alternative: ни один мужчина; ни один человек
  rationale: В контексте запрет относится к любому человеку. Русское «никто» естественно передаёт обобщающую силу формы, а её буквальная мужская форма отмечена в сноске без сужения смысла текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Грамматическое множественное число слова «ворота» последовательно отражено в местоимениях и сказуемых.
