  source_fidelity: 'Заключительная часть черновика изменяет синтаксис и смысл: еврейский текст говорит, что они будут нести «свой позор и свои мерзости», тогда как «понесут свой позор за мерзости» делает мерзости лишь причиной позора. Кроме того, עָשׂוּ обозначает совершённые действия, а не привычное/длительное «совершали».'
  naturalness: Начальная часть в целом естественна и сохраняет повтор «приближаться». Формула «ни к одной из Моих святынь — к величайшим святыням» несколько тяжеловесна как пояснение после отрицательного местоимения; «ни к каким ... — даже к ...» яснее передаёт общее запрещение с особым упоминанием наиболее святых предметов.
  terminology: «Святыни», «позор» и «мерзости» уместны для современного литературного пророческого регистра. В сноске пространственное прочтение следует оформлять как «во Святое святых», а не «ко Святому святых».
