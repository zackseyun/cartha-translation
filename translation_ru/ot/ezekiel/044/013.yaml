  text: וְ/לֹֽא יִגְּשׁ֤וּ אֵלַ/י֙ לְ/כַהֵ֣ן לִ֔/י וְ/לָ/גֶ֨שֶׁת֙ עַל כָּל קָ֣דָשַׁ֔/י אֶל קָדְשֵׁ֖י הַ/קְּדָשִׁ֑ים וְ/נָֽשְׂאוּ֙ כְּלִמָּתָ֔/ם וְ/תוֹעֲבוֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/013.yaml
  text: They shall not come near to me to serve as priests for me[a], nor to come near any of my holy things, the most holy things; but they shall bear their shame and the abominations that they have done.
translation:
  language: ru
  text: Они не будут приближаться ко Мне, чтобы служить Мне как священники, и не будут приближаться ни к каким Моим святыням — даже к святыням величайшей святости[a]. Они понесут свой позор и свои мерзости, которые совершили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Святое святых». Еврейское выражение может обозначать как святыни высшей степени святости, так и самое внутреннее священное помещение; здесь контекст скорее указывает на первое.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִגְּשׁוּ אֵלַי
  choice: приближаться ко Мне
  rationale: В храмовом и священническом контексте נגשׁ обозначает приближение к священному; русский оборот сохраняет культовый смысл.
- source_word: לְכַהֵן לִי
  choice: служить Мне как священники
  rationale: Деноминативный глагол כהן означает исполнять священническое служение; формулировка ясна современному читателю и сохраняет официальную роль.
- source_word: וְלָגֶשֶׁת
  choice: и не будут приближаться
  rationale: Повтор корня נגשׁ воспроизведён для сохранения эмфазы и юридической силы запрета.
- source_word: עַל כָּל קָדָשַׁי
  choice: ни к одной из Моих святынь
  rationale: Субстантивированное множественное קָדָשַׁי означает принадлежащие Богу святыни; отрицательная конструкция естественно передаёт распределительное כָּל.
- source_word: אֶל קָדְשֵׁי הַקְּדָשִׁים
  choice: к величайшим святыням
  rationale: Контекст после «Моих святынь» скорее указывает на предметы высшей степени святости; перевод также избегает тяжеловесного «святое святых» применительно к предметам.
- source_word: וְנָשְׂאוּ
  choice: они понесут
  rationale: נשא с позором или виной означает нести их бремя и последствия; краткий перевод сохраняет многозначность.
- source_word: כְּלִמָּתָם
  choice: свой позор
  rationale: כלמה означает позор, бесчестье или стыд; «позор» естественно сочетается с глаголом «понесут».
- source_word: וְתוֹעֲבוֹתָם
  choice: за мерзости
  rationale: תועבות — сильный заветно-нравственный термин; «мерзости» сохраняет его пророческую резкость. Предлог «за» естественно выражает связь позора с совершёнными действиями.
- source_word: אֲשֶׁר עָשׂוּ
  choice: которые совершали
  rationale: עשה буквально означает «делать»; с существительным «мерзости» русский язык требует естественного сочетания «совершать мерзости», без дополнительной конфессиональной окраски.
theological_decisions:
- issue: Значение קָדְשֵׁי הַקְּדָשִׁים в данном контексте
  choice: 'предметное значение: «величайшие святыни»'
  alternative: 'пространственное значение: «Святое святых»'
  rationale: Непосредственно перед этим упомянуты «Мои святыни», поэтому вероятнее речь о святынях высшей степени святости, а не о внутреннем помещении храма. Подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой храмовой речи. Заглавные буквы в местоимениях, относящихся к Богу, использованы в соответствии с устойчивой русской библейской традицией. Тире пояснительно связывает общее «святыни» с более узким «величайшие святыни».
