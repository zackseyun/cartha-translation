    rationale: וְנָשְׂאוּ управляет и כְּלִמָּתָם, и וְתוֹעֲבוֹתָם. Предлог «за» в черновике перестраивает высказывание в причинную связь и не передаёт параллельность объектов.
  - severity: low
    issue: «Которые совершали» не соответствует виду исходного глагола.
    rationale: אֲשֶׁר עָשׂוּ относится к совершённым ими деяниям; «которые совершили» точнее и не вносит значения повторяемого действия.
  - severity: low
    issue: Форма альтернативного пространственного перевода в сноске неидиоматична.
    rationale: Устойчивое русское обозначение внутреннего священного помещения — «Святое святых»; при указании направления естественно «во Святое святых».
