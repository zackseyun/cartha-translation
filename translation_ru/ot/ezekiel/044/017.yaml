  text: וְ/הָיָ֗ה בְּ/בוֹאָ/ם֙ אֶֽל שַׁעֲרֵי֙ הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית בִּגְדֵ֥י פִשְׁתִּ֖ים יִלְבָּ֑שׁוּ וְ/לֹֽא יַעֲלֶ֤ה עֲלֵי/הֶם֙ צֶ֔מֶר בְּ/שָֽׁרְתָ֗/ם בְּ/שַׁעֲרֵ֛י הֶ/חָצֵ֥ר הַ/פְּנִימִ֖ית וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/017.yaml
  text: And when they enter the gates of the inner court[a], they shall wear linen garments[b]; no wool shall come upon them while they minister in the gates of the inner court and in the house.
translation:
  language: ru
  text: И когда они будут входить в ворота внутреннего двора, пусть надевают льняные одежды; ничто шерстяное не должно быть на них, когда они служат в воротах внутреннего двора и в храме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и в доме»; здесь «дом» означает здание храма.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּבוֹאָם
  choice: И когда они будут входить
  rationale: Формула וְהָיָה вводит последующее предписание, а בְּ с инфинитивом и суффиксом выражает временное обстоятельство. Русская конструкция естественно передаёт оба элемента без тяжеловесного «и будет при их входе».
- source_word: שַׁעֲרֵי הֶחָצֵר הַפְּנִימִית
  choice: ворота внутреннего двора
  rationale: Сопряжённая конструкция обозначает ворота, ведущие во внутренний двор; традиционное и ясное русское соответствие — «ворота внутреннего двора».
- source_word: בִּגְדֵי פִשְׁתִּים
  choice: льняные одежды
  rationale: פִשְׁתִּים обозначает лён или льняную ткань. «Льняные одежды» точно и естественно передаёт требование к материалу.
- source_word: יִלְבָּשׁוּ
  choice: пусть надевают
  rationale: В контексте предписания форма выражает обязательное действие. «Пусть надевают» сохраняет нормативный смысл и хорошо сочетается с обстоятельством входа.
- source_word: וְלֹא יַעֲלֶה עֲלֵיהֶם צֶמֶר
  choice: ничто шерстяное не должно быть на них
  rationale: Буквально шерсть «не взойдёт/не окажется на них». Выбранная формулировка сохраняет отсутствие явно названного предмета одежды, но передаёт запрет естественным современным русским языком.
- source_word: בְּשָׁרְתָם
  choice: когда они служат
  rationale: Форма обозначает время исполнения священнического служения. Глагол «служат» сохраняет культовый смысл, определяемый храмовым контекстом, без архаизации.
- source_word: וָבָיְתָה
  choice: и в храме
  rationale: הַבַּיִת в данном видении обозначает храмовое здание, а конечное ה имеет направительно-локативную силу. В контексте «в храме» естественно передаёт место служения.
theological_decisions:
- issue: Характер священнического служения
  choice: когда они служат
  alternative: когда они совершают служение
  rationale: Краткое «служат» не вводит дополнительной богословской терминологии, тогда как храмовый контекст однозначно указывает на священническое служение.
- issue: Значение «дома»
  choice: в храме
  alternative: в доме
  rationale: В контексте храмового видения Иезекииля «дом» означает храмовое здание. Перевод «храм» устраняет возможное бытовое понимание, не изменяя референта.
- issue: Смысл запрета шерсти
  choice: ничто шерстяное не должно быть на них
  alternative: они не должны носить шерсти
  rationale: Выбор сохраняет необычный образ исходного текста и не ограничивает запрет только конкретным видом шерстяной одежды.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис нормативного предписания сохранён без канцелярской тяжеловесности; культовый контекст передан понятной общеупотребительной лексикой.
