base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/010.yaml
  text: But the Levites who went far from me when Israel went astray[a], who went astray from me after their idols, shall bear their iniquity.
translation:
  language: ru
  text: Но левиты, которые удалились от Меня, когда Израиль сбился с пути, — те, кто сами сбились с пути, отступив от Меня и последовав за своими идолами, — понесут своё беззаконие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понесут свою вину»; возможно также: «понесут наказание за своё беззаконие». Еврейское выражение включает как виновность, так и её последствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Но
  rationale: В контексте оборот вводит противопоставление предшествующему и естественно передаётся русским союзом «но».
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Еврейский текст прямо называет левитов, отличая их в контексте от священников-садокидов.
- source_word: רָחֲקוּ מֵעָלַי
  choice: удалились от Меня
  rationale: Сохраняет образ отдаления и передаёт не только физическое, но и заветное отчуждение.
- source_word: בִּתְעוֹת יִשְׂרָאֵל אֲשֶׁר תָּעוּ מֵעָלַי
  choice: когда Израиль уклонился от Меня, и вслед за ним уклонились
  rationale: В масоретском тексте субъект формы תָּעוּ грамматически множественный и естественно соотносится с левитами; «вслед за ним» ясно передаёт их участие в отступлении Израиля, не смешивая его с последующим אַחֲרֵי «за» идолами.
- source_word: אַחֲרֵי גִּלּוּלֵיהֶם
  choice: к своим идолам
  rationale: Русское «уклониться к идолам» естественно выражает религиозное отступление; притяжательное местоимение сохранено.
- source_word: גִּלּוּלֵיהֶם
  choice: идолам
  rationale: Стандартный русский эквивалент сохраняет смысл презрительного обозначения ложных богов без чрезмерно буквального и неясного «навозные идолы».
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: понесут своё беззаконие
  rationale: 'Формальная идиома сохраняет намеренную ёмкость עָוֺן: вину, беззаконие и его последствия; смысл поясняется в сноске.'
theological_decisions:
- issue: Заветно-судебная идиома וְנָשְׂאוּ עֲוֺנָם
  choice: понесут своё беззаконие
  alternative: понесут свою вину / понесут наказание за своё беззаконие
  rationale: Еврейская идиома может охватывать как виновность, так и следующее за ней наказание. Основной текст сохраняет эту богословски значимую напряжённость, а сноска разъясняет диапазон смысла.
- issue: Соотнесение множественного תָּעוּ
  choice: левиты уклонились вслед за Израилем
  alternative: Израиль уклонился от Меня вслед за своими идолами
  rationale: Множественная форма глагола лучше согласуется с «левитами», тогда как «Израиль» грамматически единственного числа. Такой синтаксический разбор сохраняет различие между общим отступлением Израиля и личной ответственностью левитов.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Местоимение «Меня» написано с прописной буквы как традиционное обозначение Бога. Повтор корня תעה передан повтором «уклонился / уклонились»; синтаксис слегка прояснён словами «вслед за ним».
