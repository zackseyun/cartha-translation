  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כָּל בֶּן נֵכָ֗ר עֶ֤רֶל לֵב֙ וְ/עֶ֣רֶל בָּשָׂ֔ר לֹ֥א יָב֖וֹא אֶל מִקְדָּשִׁ֑/י לְ/כָל בֶּן נֵכָ֔ר אֲשֶׁ֕ר בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/009.yaml
  text: 'Thus says the Lord GOD: No foreigner[a], uncircumcised in heart and uncircumcised in flesh, shall enter my sanctuary[b], of any foreigner who is among the sons of Israel.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: никакой иноплеменник[a], необрезанный сердцем и необрезанный плотью, не войдёт в Моё святилище — никакой иноплеменник, находящийся среди сынов Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын чужбины»; еврейское выражение означает чужеземца, иноплеменника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся русская формула пророческой речи, сохраняющая её властный и торжественный характер.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יְהוִה, не смешивая два элемента сочетания.
- source_word: כָּל בֶּן נֵכָר
  choice: никакой иноплеменник
  rationale: Еврейская идиома буквально означает «сын чужбины», но обозначает чужеземца; «никакой» естественно передаёт כָּל в сфере отрицания.
- source_word: עֶרֶל לֵב וְעֶרֶל בָּשָׂר
  choice: необрезанный сердцем и необрезанный плотью
  rationale: Сохранены метафора внутреннего состояния, конкретное телесное значение и параллелизм исходного текста.
- source_word: לֹא יָבוֹא אֶל מִקְדָּשִׁי
  choice: не войдёт в Моё святилище
  rationale: Прямо и естественно передаёт запрет и значение священного пространства.
- source_word: לְכָל בֶּן נֵכָר
  choice: — никакой иноплеменник
  rationale: Повтор передан как усилительное возобновление конструкции; тире делает эту функцию ясной по-русски.
- source_word: אֲשֶׁר בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: живущий среди сынов Израиля
  rationale: Причастие «живущий» естественно выражает нахождение среди сообщества; «сыны Израиля» сохраняет семейно-национальный образ оригинала.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбор различает титул и личное имя и не превращает имя Яхве в общий титул.
- issue: Объём запрета в отношении иноплеменников
  choice: Определения «необрезанный сердцем и необрезанный плотью» сохранены при слове «иноплеменник» без дополнительного толкования.
  alternative: Истолковать стих как безусловный запрет для всех иноплеменников либо лишь для особой группы пришельцев.
  rationale: Синтаксис допускает связь запрета с указанными признаками; перевод сохраняет формулировку и богословское напряжение, не расширяя и не сужая её явно.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческо-законодательной речи. Заглавная буква в «Моё» употреблена как почтительное оформление божественной речи. Повтор «никакой иноплеменник» сохранён ради усиления исходного текста.
