source:
  edition: WLC
  text: וְ/אַלְמָנָה֙ וּ/גְרוּשָׁ֔ה לֹֽא יִקְח֥וּ לָ/הֶ֖ם לְ/נָשִׁ֑ים כִּ֣י אִם בְּתוּלֹ֗ת מִ/זֶּ֨רַע֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה אַלְמָנָ֔ה מִ/כֹּהֵ֖ן יִקָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/022.yaml
  text: They shall not take for themselves as wives a widow or a divorced woman[a], but only virgins from the offspring of the house of Israel; however, they may take a widow who is the widow of a priest.
translation:
  language: ru
  text: Они не должны брать себе в жёны ни вдову, ни разведённую женщину, но только девственниц из числа потомков дома Израиля. Однако они могут брать в жёны вдову, муж которой был священником[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вдову, которая овдовела от священника». То есть вдову, чей умерший муж был священником.'
    reason: Буквальная форма еврейского выражения необычна; сноска сохраняет её и поясняет наиболее вероятный смысл.
lexical_decisions:
- source_word: אַלְמָנָה
  choice: вдова
  rationale: Обычное значение слова — женщина, у которой умер муж; оно последовательно сохранено в обоих употреблениях.
- source_word: גְרוּשָׁה
  choice: разведённая женщина
  rationale: Страдательное причастие обозначает женщину, с которой развелись. Такой перевод ясен в современном русском языке и сохраняет её юридический брачный статус.
- source_word: יִקְחוּ ... לְנָשִׁים
  choice: брать себе в жёны
  rationale: Сохранена формально-правовая сила еврейского оборота «брать себе в жёны», при этом фраза естественно звучит по-русски.
- source_word: כִּי אִם
  choice: но только
  rationale: Оборот вводит строго ограниченную разрешённую категорию и подчёркивает противопоставление.
- source_word: בְּתוּלוֹת
  choice: девственницы
  rationale: Слово обозначает именно девственниц, а не просто молодых или незамужних женщин.
- source_word: מִזֶּרַע בֵּית יִשְׂרָאֵל
  choice: из потомков дома Израиля
  rationale: «Потомки» естественно передаёт значение זֶרַע как линии происхождения, а выражение «дом Израиля» сохраняет национально-заветную формулировку оригинала.
- source_word: וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן
  choice: Однако они могут взять вдову священника
  rationale: 'По смыслу это дополнительная разрешённая категория: вдова, умерший муж которой был священником. Основной текст передаёт это естественно, а буквальная необычность еврейской конструкции отмечена в сноске.'
- source_word: מִן в מִכֹּהֵן
  choice: священника (родительный падеж)
  rationale: Хотя предлог буквально означает «от», здесь он указывает на связь и источник её вдовства; по-русски это естественно выражается сочетанием «вдова священника».
theological_decisions:
- issue: Сфера действия брачного предписания в храмовом видении
  choice: Передать стих как предписание для священников, не добавляя к нему более широких догматических или нравственных выводов.
  alternative: Истолковать его как всеобщее вневременное правило о браке либо смягчить запрет до общей рекомендации.
  rationale: Контекст содержит священнические установления храмового видения Иезекииля. Перевод сохраняет запрет и исключение, не расширяя и не сужая их область действия.
- issue: Необычная конструкция מִכֹּהֵן в последней части стиха
  choice: В основном тексте передать наиболее вероятный смысл «вдова священника», сохранив буквальную форму в сноске.
  alternative: Оставить в основном тексте буквальное «овдовела от священника», что допускает неоднозначность, но звучит неясно и неестественно по-русски.
  rationale: Контекст противопоставляет запрещённую вдову разрешённой вдове, чей умерший муж принадлежал к священству. Сноска сохраняет доступ к форме оригинала и не скрывает её необычность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно формальным звучанием, соответствующим правовому характеру предписания. Конструкция «брать себе в жёны» сохраняет библейскую юридическую образность без архаизации.
