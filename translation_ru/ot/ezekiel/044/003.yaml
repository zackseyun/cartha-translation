base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/003.yaml
  text: As for the prince[a], because he is the prince, he may sit in it to eat bread before Yahweh. He shall enter by way of the porch of the gate, and shall go out by the same way.
translation:
  language: ru
  text: Что до князя, то ему, как князю, можно сидеть в этих воротах и есть хлеб пред Господом. Он должен входить через притвор ворот и выходить тем же путём[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и выходить своим путём». Буквально по-еврейски: «и своим путём он выйдет»; вероятнее всего, имеется в виду тот же путь, который только что был указан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַנָּשִׂיא
  choice: Что же до князя
  rationale: Вынесенное в начало сочетание с אֶת обозначает тему и подчёркивает её; русская конструкция «что же до…» естественно передаёт это тематическое выделение.
- source_word: נָשִׂיא הוּא
  choice: он, как князь
  rationale: Повтор титула с местоимением подчёркивает особый статус князя как основание предоставленного ему права, не уточняя его личность.
- source_word: יֵשֶׁב בּוֹ
  choice: может сидеть в этих воротах
  rationale: Имперфект в данном предписывающем контексте выражает дозволение. Местоименный суффикс отсылает к воротам из контекста; указательное «этих» делает связь ясной по-русски.
- source_word: לֶאֱכָל לֶחֶם
  choice: есть хлеб
  rationale: Сохранено буквальное и культово окрашенное выражение, которое в контексте также может означать принятие пищи.
- source_word: לִפְנֵי יְהוָה
  choice: пред Господом
  rationale: «Пред» сохраняет пространственный и богослужебный оттенок устойчивого древнееврейского выражения; имя יהוה передано принятой русской формой «Господь».
- source_word: מִדֶּרֶךְ אֻלָם הַשַּׁעַר
  choice: со стороны притвора ворот
  rationale: אֻלָם обозначает притвор или вестибюль; выбранный оборот естественно описывает предписанный путь входа в архитектурном контексте.
- source_word: יָבוֹא
  choice: должен входить
  rationale: Имперфект здесь имеет предписывающую силу, которую ясно передаёт модальная конструкция «должен входить».
- source_word: וּמִדַּרְכּוֹ יֵצֵא
  choice: и тем же путём выходить
  rationale: Суффикс при «путь» вероятнее всего отсылает к только что указанному маршруту. Основной текст передаёт эту процедурную симметрию, а буквальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Личность и статус נָשִׂיא в храмовом видении Иезекииля
  choice: Нейтрально передать как «князь», не отождествляя его в тексте ни с Мессией, ни с исключительно светским правителем.
  alternative: Понимать его как мессианского князя либо как гражданского/давидического правителя, отличного от Мессии.
  rationale: Сам стих сообщает об особом праве князя, но не разрешает более широкий спор о его личности; нейтральный титул не вносит в перевод отсутствующего в стихе догматического вывода.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Пред Господом» сохраняет культовый регистр, а синтаксис остаётся понятным современному читателю. Маркер сноски поставлен при спорном выражении о пути выхода, к которому относится её содержание.
