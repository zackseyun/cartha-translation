source:
  edition: WLC
  text: וְ/אֶת עַמִּ֣/י יוֹר֔וּ בֵּ֥ין קֹ֖דֶשׁ לְ/חֹ֑ל וּ/בֵין טָמֵ֥א לְ/טָה֖וֹר יוֹדִעֻֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/023.yaml
  text: They shall teach my people the difference between the holy and the common[b][a], and make them know the difference between the unclean and the clean.
translation:
  language: ru
  text: Они будут учить Мой народ отличать священное от обычного[a] и научат его различать нечистое и чистое[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священное от несвященного».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «дадут ему знать [различие] между нечистым и чистым».'
    reason: literal_rendering
lexical_decisions:
- source_word: יוֹרוּ
  choice: будут учить
  rationale: Порода хифиль глагола ירה в данном священническом контексте означает наставлять, учить; этот перевод естественно передаёт учительную обязанность священников.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: отличать священное от обычного
  rationale: Сочетание обозначает различие культового статуса. «Священное» передаёт קֹדֶשׁ, а «обычное» — то, что не отделено как святое, без лишнего оттенка осквернения. Глагол «отличать» естественно выражает конструкцию בֵּין ... לְ.
- source_word: טָמֵא
  choice: нечистое
  rationale: В священнической и культовой речи «нечистое» сохраняет принятую ритуальную семантику слова טָמֵא.
- source_word: טָהוֹר
  choice: чистое
  rationale: В паре с טָמֵא слово «чистое» естественно и последовательно передаёт ритуальный статус טָהוֹר.
- source_word: יוֹדִעֻם
  choice: научат его различать
  rationale: Хифиль ידע имеет каузативный смысл «дадут знать». В данном контексте русское «научат различать» передаёт результат наставления и относится к собирательному «народу».
- source_word: וְאֶת עַמִּי
  choice: Мой народ
  rationale: Частица אֵת отмечает прямое дополнение, а суффикс выражает принадлежность. Начальный союз в русском не требуется внутри данного контекста стиха.
theological_decisions:
- issue: Передача культового термина חֹל в противопоставлении קֹדֶשׁ
  choice: обычное
  alternative: несвященное; мирское
  rationale: «Обычное» обозначает не посвящённое Богу и не приписывает ему нравственной порочности. Вариант «мирское» в современном русском способен вызвать дополнительные богословские и отрицательные ассоциации, которых сам термин здесь не требует.
- issue: Каузативное значение יוֹדִעֻם
  choice: научат его различать
  alternative: дадут ему знать; покажут ему различие
  rationale: Выбранная формулировка сохраняет роль священников как наставников и естественно связывает глагол с противопоставлением нечистого и чистого, не превращая различение в отдельную доктринальную способность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Собирательное «народ» последовательно возобновлено местоимением единственного числа «его». Термины «священное», «нечистое» и «чистое» сохраняют культовый контекст, а синтаксис сделан естественным для современного читателя.
