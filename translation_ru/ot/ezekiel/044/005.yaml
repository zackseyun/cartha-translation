base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/005.yaml
  text: And Yahweh said to me[a], “Son of man, set your heart, and see with your eyes, and hear with your ears all that I am speaking to you concerning all the statutes of the house of Yahweh and all its laws[b]. Set your heart on the entrance of the temple and on all the exits of the sanctuary.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Сын человеческий, обрати внимание, смотри своими глазами и слушай своими ушами всё, что Я говорю тебе обо всех уставах дома Яхве и обо всех его предписаниях[a]. Обрати внимание на вход в храм и на все выходы из святилища».


    [a] Буквально: «положи своё сердце»; еврейская идиома означает сосредоточить внимание и отнестись к сказанному со всей серьёзностью.

    [b] Или: «обо всех его наставлениях»; соответствующее слово может обозначать предписанное учение или установленные правила, а не только закон в узком смысле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положи своё сердце»; еврейская идиома означает сосредоточить внимание и отнестись к сказанному со всей серьёзностью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обо всех его наставлениях»; соответствующее слово может обозначать предписанное учение или установленные правила, а не только закон в узком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом; соответствует предоставленному решению по спорному термину.
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и его литературную повторяемость, не привнося позднейших христологических смыслов.
- source_word: שִׂים לִבְּךָ / וְשַׂמְתָּ לִבְּךָ
  choice: обрати на это всё своё внимание / обрати особое внимание
  rationale: Естественно передаёт еврейскую идиому сосредоточенного внутреннего внимания; сноска сохраняет буквальный образ сердца.
- source_word: וּרְאֵה בְעֵינֶיךָ וּבְאָזְנֶיךָ שְׁמָע
  choice: смотри своими глазами и слушай своими ушами
  rationale: Сохраняет конкретный телесный параллелизм и усиление двух повелений.
- source_word: לְכָל חֻקּוֹת בֵּית יְהוָה
  choice: обо всех уставах дома Яхве
  rationale: Предлог понят как указание на тему речи; «дом Яхве» сохраняет выражение исходного текста.
- source_word: תורתו
  choice: обо всех его предписаниях
  rationale: В храмовом контексте речь идёт о предписанных наставлениях и правилах; «предписания» не сужает значение до законодательства в современном смысле.
- source_word: לִמְבוֹא הַבַּיִת
  choice: на вход в храм
  rationale: מבוא обозначает место входа, а «храм» естественно уточняет контекстуальное значение «дома» в данной части фразы.
- source_word: בְּכֹל מוֹצָאֵי הַמִּקְדָּשׁ
  choice: на все выходы из святилища
  rationale: מוֹצָאִים здесь обозначает места выхода; מִקְדָּשׁ передано обычным культовым термином «святилище».
theological_decisions:
- issue: Передача имени יְהֹוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется личное имя Бога согласно предоставленной политике спорных терминов; титульная замена не вносится.
- issue: Значение обращения בֶּן אָדָם у Иезекииля
  choice: Сын человеческий
  alternative: человек; смертный
  rationale: Формальная передача сохраняет характерное пророческое обращение, не отождествляя его здесь с позднейшим титульным употреблением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конкретный параллелизм «глазами — ушами» сохранён, а непривычная для русского языка идиома сердца передана естественно и раскрыта в сноске. Термины «дом», «храм» и «святилище» распределены по контексту без стирания различий исходного текста.
