lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְנַחֲלָה
  choice: И вот что будет им в наследие
  rationale: 'Еврейское начало эллиптично: подлежащее при глаголе женского рода подразумевается из контекста. «Вот что» естественно передаёт это подразумеваемое указание, не устраняя отмеченную в сноске неоднозначность.'
- source_word: נַחֲלָה / נַחֲלָתָם
  choice: наследие / их наследие
  rationale: Слово обозначает наследственный удел, особенно земельный или заветный. «Наследие» сохраняет юридико-заветный смысл и лексический повтор.
- source_word: אֲנִי נַחֲלָתָם
  choice: Я — их наследие
  rationale: Безглагольное предложение звучит прямо и эмфатично; тире естественно передаёт именное сказуемое в современном русском языке.
- source_word: אֲחֻזָּה
  choice: земельное владение / владение
  rationale: Термин часто означает закреплённую земельную собственность. В запрете уточнение «земельное» ясно передаёт конкретный смысл, а в заключительной метафоре «владение» сохраняет параллелизм без неестественного выражения «Я — их земельное владение».
- source_word: לֹא תִתְּנוּ לָהֶם בְּיִשְׂרָאֵל
  choice: Не давайте им земельного владения в Израиле
  rationale: Форма второго лица множественного числа выражает предписание. Русское отрицательное повелительное наклонение естественно передаёт его юридическую силу, не уточняя адресатов сверх текста.
- source_word: אֲנִי אֲחֻזָּתָם
  choice: Я — их владение
  rationale: 'Перевод сохраняет отличие אחזה от נחלה и итоговый параллелизм: у священников не будет обычного земельного владения, потому что их владение — сам Господь.'
theological_decisions:
- issue: Соотношение «наследия» и «владения» в уделе священников
  choice: Сохранить различие между נחלה («наследие») и אחזה («владение»).
  alternative: Передать оба слова одинаково — «наследие» или «владение».
  rationale: Два близких, но различных термина намеренно связывают отказ от обычного земельного удела с утверждением, что сам Господь является и наследием, и владением священников. Различие сохранено без привнесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формулировки краткие и понятные; различие ключевых земельно-правовых терминов сохранено, а эллиптичность начала отмечена в сноске.
