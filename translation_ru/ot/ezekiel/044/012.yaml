reference: Ezekiel 44:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר יְשָׁרְת֤וּ אוֹתָ/ם֙ לִ/פְנֵ֣י גִלּֽוּלֵי/הֶ֔ם וְ/הָי֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/מִכְשׁ֣וֹל עָוֺ֑ן עַל כֵּן֩ נָשָׂ֨אתִי יָדִ֜/י עֲלֵי/הֶ֗ם נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/012.yaml
  text: Because they ministered to them before their idols and became a stumbling block of iniquity for the house of Israel[a], therefore I have raised my hand against them, declares the Lord GOD[b], and they will bear their iniquity.
translation:
  language: ru
  text: За то, что они служили им[a] перед их идолами и стали для дома Израиля камнем преткновения, ведущим к беззаконию, Я поднял против них руку[b], — возвещает Владыка Яхве, — и они понесут своё беззаконие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Местоимение «им» в еврейском тексте выражено сжато: оно может относиться к людям, связанным с идолами, или, по смыслу, к самим идолам.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «поднял Мою руку против них». Поднятая рука могла быть жестом торжественной клятвы или судебного действия; здесь контекст указывает на объявление приговора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: За то, что
  rationale: Передаёт явно выраженное основание последующего приговора и естественно сочетается в русском с главным предложением «Я поднял…».
- source_word: יְשָׁרְתוּ
  choice: служили
  rationale: Глагол обозначает служение, в данном контексте культовое; русское «служили» ясно и не вводит более узкого конфессионального оттенка.
- source_word: אוֹתָם
  choice: им
  rationale: 'Сохраняет местоименную сжатость и неоднозначность еврейского текста: речь может идти о связанных с идолами людях либо, по смыслу, о самих идолах.'
- source_word: לִפְנֵי גִלּוּלֵיהֶם
  choice: перед их идолами
  rationale: Сохраняет пространственное значение לִפְנֵי. Стандартное «идолы» понятно современному читателю; резко пренебрежительный оттенок характерного для Иезекииля גִלּוּלִים не воспроизводится неестественной калькой.
- source_word: וְהָיוּ לְבֵית יִשְׂרָאֵל לְמִכְשׁוֹל עָוֺן
  choice: и стали для дома Израиля камнем преткновения, ведущим к беззаконию
  rationale: «Стали» передаёт возникший результат, «дом Израиля» сохраняет коллективное заветное обозначение, а «камень преткновения» удерживает метафору מִכְשׁוֹל. Оборот «ведущим к беззаконию» делает связь существительных понятной, не сводя עָוֺן только к греху или только к вине.
- source_word: נָשָׂאתִי יָדִי עֲלֵיהֶם
  choice: Я поднял против них руку
  rationale: Сохраняет телесный образ еврейской идиомы и её направленный против виновных судебный смысл; возможный оттенок клятвенного жеста отмечен в сноске.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» естественно передаёт пророческую формулу נְאֻם; «Владыка Яхве» различает титул אֲדֹנָי и личное имя יהוה, избегая сочетания «Господь Господь».
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: и они понесут своё беззаконие
  rationale: Сохраняет еврейскую судебно-богословскую идиому, охватывающую как виновность, так и её последствия, не заменяя её одним лишь «наказанием».
theological_decisions:
- issue: Передача формулы אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Первый компонент передан титулом, а тетраграмматон — личным именем. Это сохраняет различие двух еврейских обозначений и явно передаёт заветное имя, не привнося особого конфессионального толкования.
- issue: Смысл выражения «понести своё беззаконие»
  choice: Сохранить идиому без поясняющего развёртывания в основном тексте
  alternative: понести наказание за своё беззаконие
  rationale: Еврейское выражение может включать и несение вины, и претерпевание её последствий; вариант только с «наказанием» преждевременно сужает эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены выражения «дом Израиля», «камень преткновения» и «понесут своё беззаконие», но синтаксис сделан понятным для обычного современного читателя. Неоднозначность местоимения и клятвенно-судебной идиомы вынесена в сноски.
