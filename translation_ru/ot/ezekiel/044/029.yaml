base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/029.yaml
  text: They shall eat the grain offering[a], the sin offering, and the guilt offering[b], and every devoted thing in Israel shall be theirs.
translation:
  language: ru
  text: Они будут есть хлебное приношение, жертву за грех[a] и жертву за вину, и всё, посвящённое Богу безвозвратно[b], в Израиле будет принадлежать им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительную жертву».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово хе́рем обозначает то, что безвозвратно отдано Богу; в иных контекстах оно может означать посвящённое на уничтожение.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В священническом жертвенном контексте מִנְחָה обозначает приношение из зерна или муки, а не приношение вообще. Устоявшееся выражение «хлебное приношение» понятно по-русски и отличает его от следующих видов жертв.
- source_word: הַחַטָּאת
  choice: жертва за грех
  rationale: В перечне жертв חַטָּאת обозначает жертвоприношение, связанное с грехом и очищением. «Жертва за грех» — прозрачный и привычный русский эквивалент; возможный смысл очищения сохранён в сноске.
- source_word: הָאָשָׁם
  choice: жертва повинности
  rationale: В жертвенном законодательстве אָשָׁם — жертва, связанная с виной, ответственностью и возмещением. «Жертва повинности» сохраняет отличие этой категории от жертвы за грех.
- source_word: הֵמָּה יֹאכְלוּם
  choice: они будут есть
  rationale: Местоимение указывает на самих священников, а глагольный суффикс — на перечисленные приношения. По-русски объект уже назван далее, поэтому отдельное «их» не требуется.
- source_word: חֵרֶם
  choice: всё безвозвратно посвящённое Богу
  rationale: חֵרֶם обозначает то, что окончательно изъято из обычного употребления и отдано Богу. Такая формулировка передаёт культовый смысл данного контекста и не создаёт ложного впечатления, будто здесь прежде всего говорится об уничтожении.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог обозначает сферу, в которой совершается такое посвящение; естественный русский эквивалент — «в Израиле».
- source_word: לָהֶם יִהְיֶה
  choice: будет принадлежать им
  rationale: Еврейская конструкция выражает принадлежность или законное право. Русское «будет принадлежать им» ясно передаёт это значение.
theological_decisions:
- issue: Передача терминов жертвоприношений в контексте доли священников
  choice: 'Сохранить отдельные установленные категории: «хлебное приношение», «жертва за грех», «жертва повинности».'
  alternative: Обобщить их как «приношения» либо истолковать как «очистительную» и «возместительную» жертвы.
  rationale: Стих перечисляет разные виды жертв, положенные священникам. Их разграничение сохраняет правовую и богословскую структуру текста, не навязывая позднейших доктринальных толкований.
- issue: Значение חֵרֶם в данном контексте
  choice: Передать как «всё безвозвратно посвящённое Богу», указав более широкий диапазон значения в сноске.
  alternative: «Всё заклятое» или «всё обречённое на уничтожение».
  rationale: Здесь речь идёт о том, что переходит священникам, поэтому значение окончательного посвящения Богу определяется контекстом. Сноска сохраняет связь с другими употреблениями слова, где посвящённое подлежит уничтожению.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной жертвенной терминологией. Синтаксис краткий и ясный; технические различия оригинала сохранены, а менее очевидные смысловые оттенки вынесены в сноски.
