source:
  edition: WLC
  text: פְּאַת יָ֗מָּ/ה חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים שַֽׁעֲרֵי/הֶ֖ם שְׁלֹשָׁ֑ה שַׁ֣עַר גָּ֞ד אֶחָ֗ד שַׁ֤עַר אָשֵׁר֙ אֶחָ֔ד שַׁ֥עַר נַפְתָּלִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/034.yaml
  text: 'On the west side[a], four thousand five hundred, with their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali[b], one.'
translation:
  language: ru
  text: 'С западной стороны — четыре тысячи пятьсот[a]; их ворот — три[b]: ворота Гада — одни, ворота Асира — одни, ворота Неффалима — одни.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пятьсот и четыре тысячи».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст представляет собой безглагольную перечислительную формулу; возможно также: «с тремя воротами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת יָמָּה
  choice: С западной стороны
  rationale: פְּאַת обозначает сторону или край, а יָמָּה — направление к западу (буквально «к морю»). В перечне сторон города это естественная и точная русская формулировка.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: четыре тысячи пятьсот
  rationale: Еврейское выражение буквально располагает разряды как «пятьсот и четыре тысячи», но означает 4500; в русском языке число передано в обычном порядке разрядов.
- source_word: שַׁעֲרֵיהֶם שְׁלֹשָׁה
  choice: их ворот — три
  rationale: Сохранены притяжательный суффикс «их», безглагольная структура и перечислительный характер фразы. Русская конструкция не добавляет отсутствующего в оригинале глагола.
- source_word: שַׁעַר גָּד אֶחָד
  choice: ворота Гада — одни
  rationale: Передана повторяющаяся формула «ворота + имя колена + одни»; форма «одни» согласуется с русским словом «ворота».
- source_word: שַׁעַר אָשֵׁר אֶחָד
  choice: ворота Асира — одни
  rationale: Сохранена та же перечислительная формула; имя אָשֵׁר передано в принятой русской библейской форме «Асир».
- source_word: שַׁעַר נַפְתָּלִי אֶחָד
  choice: ворота Неффалима — одни
  rationale: Сохранена единообразная формула списка; имя נַפְתָּלִי передано в принятой русской библейской форме «Неффалим».
