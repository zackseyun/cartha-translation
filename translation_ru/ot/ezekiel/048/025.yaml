  yaml_path: translation/ot/ezekiel/048/025.yaml
  text: And along the border of Simeon[a], from the east side to the west side, Issachar, one portion.
translation:
  language: ru
  text: Вдоль границы Симеона, от восточной стороны до западной, — один надел Иссахара.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: Вдоль границы
  rationale: В формуле распределения земель сочетание указывает на полосу, прилегающую к границе предыдущего удела. «Вдоль границы» естественно передаёт пространственный смысл; начальное וְ не выражено отдельным союзом, поскольку по-русски в таком перечислении он избыточен.
- source_word: שִׁמְעוֹן
  choice: Симеона
  rationale: Традиционная русская форма названия колена; родительный падеж обусловлен словом «границы».
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  choice: от восточной стороны до западной
  rationale: Парная конструкция обозначает протяжённость с востока на запад. יָם буквально значит «море», но регулярно служит обозначением запада; здесь направление ясно из симметричной географической формулы.
- source_word: יִשָׂשכָר
  choice: Иссахару
  rationale: Традиционная русская форма названия колена. Дательный падеж естественно выражает получателя следующего надела и раскрывает краткую именную формулу без изменения её смысла.
- source_word: אֶחָד
  choice: один надел
  rationale: В еврейском тексте буквально стоит «один», однако в повторяющейся формуле главы подразумевается одна земельная полоса, или доля. «Надел» кратко и ясно восполняет эллипсис.
