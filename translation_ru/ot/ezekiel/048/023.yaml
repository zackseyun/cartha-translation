lexical_decisions:
- source_word: וְיֶתֶר הַשְּׁבָטִים
  choice: А остальные колена
  rationale: Сочетание открывает новый раздел о ещё не перечисленных коленах; «а» передаёт связующий וְ, а «остальные колена» естественно выражает смысл יֶתֶר הַשְּׁבָטִים.
- source_word: מִפְּאַת קָדִימָה
  choice: от восточной стороны
  rationale: פֵּאָה может обозначать сторону, край или границу; здесь это часть повторяющейся формулы, описывающей протяжённость племенного надела.
- source_word: עַד פְּאַת יָמָּה
  choice: до западной
  rationale: יָם с направительным окончанием указывает на запад, буквально на сторону моря; прилагательное «западной» соотносится с уже названным словом «стороны» и избегает тяжеловесного повтора.
- source_word: בִּנְיָמִן
  choice: Вениамину
  rationale: Дательный падеж естественно выражает по-русски, какому колену предназначен надел, не меняя смысла краткой распределительной формулы.
- source_word: אֶחָד
  choice: один надел
  rationale: В еврейском тексте стоит только «один», но в контексте главы это эллиптическое обозначение одной земельной полосы, выделенной колену; слово «надел» добавлено для ясности.
