revisions:
- from: А по обе стороны владения левитов и владения города[a], находящихся посреди земли князя, — между границей Иуды и границей Вениамина[b] — земля будет принадлежать князю.
  to: По обе стороны от владения левитов и владения города[a] — посреди участка, отведённого князю, между границей Иуды и границей Вениамина, — будет земля, принадлежащая князю.
  rationale: 'Исправлены русская грамматика и референциальная неясность. Смысл пространственного расположения передан с опорой на непосредственный контекст, а более буквальная, синтаксически трудная форма сохранена в сноске. Сноска b сохранена как лексическая альтернатива, хотя в основном тексте её якорь не требуется: она относится к словам «между границей Иуды и границей Вениамина».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:22Z'
review_pass:
  verdict: revise
  source_fidelity: Черновик верно передаёт основные топонимы, титул «князь» и итоговое закрепление участка за князем. Однако «по обе стороны владения» требует предлога «от», а относительное «находящихся» синтаксически неясно и может ошибочно отнести положение «посреди земли князя» к обоим центральным владениям без ясного указания на окружающий их княжеский участок. Исправленный текст ясно выражает пространственную связь, подразумеваемую конструкцией и ближайшим контекстом, не меняя состава владений.
  naturalness: Фраза «по обе стороны от» естественна и однозначна в современном литературном русском. Перестройка устраняет тяжёлую цепочку родительных падежей и неопределённый субъект в «земля будет принадлежать князю».
  terminology: «Владение», «левиты», «город», «князь», «граница», «Иуда» и «Вениамин» сохранены. «Князь» уместно передаёт נָשִׂיא и не навязывает богословской идентификации.
  issues:
  - severity: medium
    issue: Отсутствует предлог в обороте «по обе стороны владения левитов».
    rationale: 'В русском нормативно и ясно: «по обе стороны от владения». Без «от» конструкция воспринимается как грамматически дефектная.'
  - severity: medium
    issue: Оборот «владения левитов и владения города, находящихся посреди земли князя» и последующее «земля будет принадлежать князю» оставляют неясным, какая именно земля является подлежащим и что именно находится посреди.
    rationale: Еврейская конструкция трудна и эллиптична, но контекст 48:21–22 позволяет ясно обозначить княжескую землю по сторонам центральных владений. Не следует создавать впечатление, что сами владения левитов и города передаются князю.
  revised_text: По обе стороны от владения левитов и владения города[a] — посреди участка, отведённого князю, между границей Иуды и границей Вениамина, — будет земля, принадлежащая князю.
