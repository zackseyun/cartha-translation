  text: וּ/מֵ/אֲחֻזַּ֤ת הַ/לְוִיִּם֙ וּ/מֵ/אֲחֻזַּ֣ת הָ/עִ֔יר בְּ/ת֛וֹךְ אֲשֶׁ֥ר לַ/נָּשִׂ֖יא יִֽהְיֶ֑ה בֵּ֣ין גְּב֣וּל יְהוּדָ֗ה וּ/בֵין֙ גְּב֣וּל בִּנְיָמִ֔ן לַ/נָּשִׂ֖יא יִהְיֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/022.yaml
  text: And from the property of the Levites and from the property of the city[a], in the midst of what belongs to the prince, between the border of Judah and the border of Benjamin[b], it shall belong to the prince.
translation:
  language: ru
  text: По обе стороны от владения левитов и владения города[a] — посреди участка, отведённого князю, между границей Иуды и границей Вениамина, — будет земля, принадлежащая князю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и от владения левитов, и от владения города, посреди того, что будет у князя». Трудная эллиптическая формулировка продолжается из предыдущего стиха и описывает княжескую землю по сторонам центральных владений.'
    reason: textual_clarity
lexical_decisions:
- source_word: אֲחֻזַּת
  choice: владение
  rationale: Слово обозначает закреплённый земельный участок или наследственное земельное владение; «владение» естественно для территориального контекста главы и сохраняет повтор в еврейском тексте.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Общепринятое обозначение левитов; определённость передаётся контекстом конструкции «владение левитов».
- source_word: הָעִיר
  choice: города
  rationale: Речь идёт о выделенной городу земле, упомянутой в ближайшем контексте.
- source_word: בְּתוֹךְ
  choice: посреди
  rationale: Передаёт пространственное положение городского и левитского владений внутри более обширной земли князя.
- source_word: אֲשֶׁר לַנָּשִׂיא יִהְיֶה
  choice: земли князя
  rationale: Сжатая и естественная русская передача относительной конструкции «того, что будет у князя»; принадлежность выражена без уточнения её политического или богословского характера.
- source_word: נָשִׂיא
  choice: князь
  rationale: Традиционный и уместный в книге Иезекииля титул гражданского правителя, отличающийся от слова «царь».
- source_word: בֵּין גְּבוּל יְהוּדָה וּבֵין גְּבוּל בִּנְיָמִן
  choice: между границей Иуды и границей Вениамина
  rationale: Сохраняет значение גְּבוּל как пограничной линии и близко следует пространственной формулировке оригинала.
- source_word: לַנָּשִׂיא יִהְיֶה
  choice: будет принадлежать князю
  rationale: Ясно передаёт заключительное утверждение о закреплении этой земли за князем и сохраняет его эмфатическое повторение.
- source_word: וּמֵאֲחֻזַּת ... וּמֵאֲחֻזַּת
  choice: по обе стороны владения ... и владения
  rationale: Предлог מִן буквально означает «от», но здесь продолжает пространственное описание предыдущего стиха, где земля князя расположена с двух сторон центральных участков. Передача раскрывает подразумеваемое расположение, не меняя состава названных владений.
theological_decisions:
- issue: Значение титула נָשִׂיא в видении о восстановленной земле
  choice: князь
  alternative: правитель; вождь
  rationale: «Князь» сохраняет отличие данного титула от обозначения царя и не навязывает тексту конкретного мессианского или государственного истолкования.
- issue: Расположение владения князя относительно земли левитов и города
  choice: по обе стороны центральных владений
  alternative: 'буквально: «от владения левитов и от владения города»'
  rationale: Контекст предыдущего стиха описывает две части княжеской земли к востоку и западу от центрального участка. Такая передача делает географический смысл понятным, а формальная неоднозначность исходной конструкции отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского земельного описания. Синтаксис упорядочен ради ясности: подразумеваемое контекстом расположение по обе стороны вынесено в основной текст, а буквальная конструкция сохранена в сноске. Повтор титула и территориальная лексика сохранены.'
