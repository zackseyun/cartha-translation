  yaml_path: translation/ot/ezekiel/048/009.yaml
  text: The contribution that you shall set apart for Yahweh shall be twenty-five thousand in length and ten thousand in width[a].
translation:
  language: ru
  text: Приношение, которое вы выделите для Яхве, должно быть длиной двадцать пять тысяч и шириной десять тысяч[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар», «удел» или «отделённая часть». Еврейское слово обозначает то, что возносится или особо выделяется как приношение; здесь речь идёт о священном участке, отделённом от земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרוּמָה
  choice: приношение
  rationale: תְּרוּמָה обозначает то, что возносится или особо выделяется как дар. В Иезекииля 45–48 речь идёт о священном участке земли; «приношение» сохраняет образ дара, а контекст показывает, что это не жертва на алтаре.
- source_word: אֲשֶׁר תָּרִימוּ
  choice: которое вы отделите
  rationale: Порода Hiphil глагола רוּם здесь означает выделить нечто как приношение. «Отделите» естественно передаёт действие применительно к участку земли.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל выражает посвящение или предназначение, а יהוה передано личным именем «Яхве».
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: двадцать пять тысяч в длину
  rationale: Передана указанная протяжённость; единица измерения не добавлена, поскольку в еврейском тексте этого стиха она не названа.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: и десять тысяч в ширину
  rationale: Формулировка естественно и параллельно передаёт второе измерение; не названная в исходном тексте единица не восполняется.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо употреблён тетраграмматон; личное имя сохранено как «Яхве», без замены титулом.
- issue: Характер תְּרוּמָה
  choice: приношение как выделенный священный участок
  alternative: удел / отделённая часть
  rationale: Слово сохраняет богословскую идею дара Яхве, тогда как земельный контекст предохраняет от узкого понимания как алтарной жертвы; лексическая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, сжатый и торжественный библейский регистр. Синтаксический параллелизм размеров сохранён; отсутствующая в данном стихе единица измерения не добавлена.
