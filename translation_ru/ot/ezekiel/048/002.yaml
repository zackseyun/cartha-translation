lexical_decisions:
- source_word: וְעַל
  choice: А рядом с
  rationale: Сочетание союза и предлога продолжает последовательное описание уделов и указывает на положение следующего удела непосредственно у границы Дана.
- source_word: גְּבוּל דָּן
  choice: границей Дана
  rationale: גְּבוּל в контексте раздела земли обозначает территориальную границу; имя колена передано в принятой русской форме.
- source_word: מִפְּאַת קָדִים
  choice: от восточной стороны
  rationale: פֵּאָה означает сторону или край, а קָדִים здесь служит обозначением востока.
- source_word: עַד פְּאַת יָמָּה
  choice: до западной
  rationale: יָם буквально означает «море», но в географической ориентации обозначает запад; слово «стороны» естественно подразумевается из параллельной первой части и не повторяется.
- source_word: אָשֵׁר
  choice: Асиру
  rationale: Имя колена передано традиционной русской формой; дательный падеж выражает принадлежность подразумеваемого удела.
- source_word: אֶחָד
  choice: один удел
  rationale: Числительное употреблено эллиптически в повторяющейся формуле распределения земли; добавление слова «удел» ясно передаёт подразумеваемый смысл.
