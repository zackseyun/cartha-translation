  text: וְ/הַ/נּוֹתָ֨ר בָּ/אֹ֜רֶךְ לְ/עֻמַּ֣ת תְּרוּמַ֣ת הַ/קֹּ֗דֶשׁ עֲשֶׂ֨רֶת אֲלָפִ֤ים קָדִ֨ימָ/ה֙ וַ/עֲשֶׂ֤רֶת אֲלָפִים֙ יָ֔מָּ/ה וְ/הָיָ֕ה לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ וְ/הָיְתָ֤ה תבואת/ה לְ/לֶ֔חֶם לְ/עֹבְדֵ֖י הָ/עִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/018.yaml
  text: And the remainder along the length[a], corresponding to the holy contribution, shall be ten thousand to the east and ten thousand to the west; it shall correspond to the holy contribution[b], and its produce shall be for food for the workers of the city.
translation:
  language: ru
  text: А оставшийся участок вдоль длины, соответствующий священному приношению, будет составлять десять тысяч к востоку и десять тысяч к западу[a]. Он будет соответствовать священному приношению, а его урожай будет пищей для работников города[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к морю»; в древнеизраильской географической ориентации это означает запад.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на хлеб». Здесь «хлеб», вероятно, означает пищу или пропитание в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: А оставшаяся часть
  rationale: Форма от נותר обозначает то, что осталось после уже описанного наделения землёй; «оставшаяся часть» естественно звучит в контексте размежевания.
- source_word: בָּאֹרֶךְ
  choice: по длине
  rationale: Выражение указывает на продольное измерение оставшегося участка и сохраняет геометрическую формулировку оригинала.
- source_word: לְעֻמַּת
  choice: напротив
  rationale: Предлог выражает пространственное соответствие или расположение напротив другого участка. «Напротив» сохраняет пространственный образ, не уточняя сверх оригинала, примыкает ли участок непосредственно.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: священное приношение
  rationale: Слово תְּרוּמָה обозначает выделенную долю, принесённую или отведённую для священной цели. «Священное приношение» сохраняет культовый оттенок, хотя в данном контексте речь идёт о земельном участке.
- source_word: עֲשֶׂרֶת אֲלָפִים קָדִימָה
  choice: на десять тысяч к востоку
  rationale: Число с наречием направления обозначает восточную протяжённость; единица измерения в этом стихе не названа, поэтому она не добавляется.
- source_word: וַעֲשֶׂרֶת אֲלָפִים יָמָּה
  choice: и на десять тысяч к западу
  rationale: יָמָּה буквально означает «к морю», а в географической ориентации древнего Израиля обычно указывает на запад; основной текст передаёт понятное современному читателю направление, а буквальный образ отмечен в сноске.
- source_word: וְהָיָה לְעֻמַּת תְּרוּמַת הַקֹּדֶשׁ
  choice: Она будет расположена напротив священного приношения
  rationale: Повтор пространственной формулы сохранён, поскольку он подчёркивает соотношение участков в описании границ.
- source_word: וְהָיְתָה תבואתה
  choice: а урожай с неё пойдёт
  rationale: תְּבוּאָה означает урожай или сельскохозяйственную продукцию земли. Формулировка «урожай с неё» ясно связывает продукцию с оставшейся частью земли.
- source_word: לְלֶחֶם
  choice: в пищу
  rationale: לֶחֶם буквально означает «хлеб», но может обозначать пищу или пропитание вообще. Контекст обеспечения работников урожаем допускает более широкое значение; буквальный вариант указан в сноске.
- source_word: לְעֹבְדֵי הָעִיר
  choice: работникам города
  rationale: Причастие от עבד охватывает труд и служение. «Работникам города» сохраняет эту широту и не превращает их без достаточных оснований ни в культовых служителей, ни только в земледельцев.
