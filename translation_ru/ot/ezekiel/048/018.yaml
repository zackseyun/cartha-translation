    rationale: Этот вариант может обозначать строгое противоположное расположение, тогда как еврейский предлог в данном измерительном описании оставляет более широкое отношение соответствия/выравнивания. Следует не уточнять спорную геометрию участка.
  - severity: low
    issue: «Она будет расположена...»
    rationale: Фраза менее естественна, чем нейтральное «он будет соответствовать», и добавляет оттенок фиксированного размещения, которого не требуется для передачи повторной формулы.
