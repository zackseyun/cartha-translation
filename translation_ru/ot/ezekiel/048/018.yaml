revisions:
- from: А оставшаяся часть по длине, напротив священного приношения, будет простираться на десять тысяч к востоку и на десять тысяч к западу[a]. Она будет расположена напротив священного приношения, а урожай с неё пойдёт в пищу[b] работникам города.
  to: А оставшийся участок вдоль длины, соответствующий священному приношению, будет составлять десять тысяч к востоку и десять тысяч к западу[a]. Он будет соответствовать священному приношению, а его урожай будет пищей для работников города[b].
  rationale: Заменено пространственно более узкое «напротив» на «соответствующий/соответствовать», чтобы передать לְעֻמַּת без дополнительного геометрического утверждения. «Оставшаяся часть» уточнена как подразумеваемый контекстом участок; синтаксический повтор еврейского текста и обе лексические сноски сохранены.
