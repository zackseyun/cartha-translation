base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/032.yaml
  text: 'And on the east side[a], four thousand five hundred cubits, with three gates: the gate of Joseph, one; the gate of Benjamin, one; the gate of Dan, one.'
translation:
  language: ru
  text: 'С восточной стороны — четыре тысячи пятьсот[a]; трое ворот: ворота Иосифа — одни, ворота Вениамина — одни, ворота Дана — одни.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сказано просто «четыре тысячи пятьсот»; из контекста измерений города в этой главе понятно, что речь идёт о локтях.
    reason: cross_reference
lexical_decisions:
- source_word: פְּאַת קָדִימָה
  choice: с восточной стороны
  rationale: פְּאַת обозначает сторону или край, а קָדִימָה указывает направление на восток; выбранная формулировка естественна для русского описания границ.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: четыре тысячи пятьсот
  rationale: Еврейская последовательность буквально означает «пятьсот и четыре тысячи», то есть 4500; единица измерения в этой фразе не названа и потому поясняется в сноске, а не вводится в основной текст.
- source_word: וּשְׁעָרִים שְׁלֹשָׁה
  choice: и трое ворот
  rationale: Передаёт сочинительную связь и безглагольное описание; с существительным «ворота» нормативно употреблено собирательное числительное «трое».
- source_word: שַׁעַר
  choice: ворота
  rationale: Обычное русское соответствие для городских ворот; форма множественного числа естественна и при обозначении каждых отдельных ворот.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: בִּנְיָמִן
  choice: Вениамин
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: דָּן
  choice: Дан
  rationale: Традиционная русская форма библейского имени и названия колена.
- source_word: אֶחָד ... אֶחָד ... אֶחָד
  choice: одни ... одни ... одни
  rationale: Повтор сохранён, чтобы передать еврейское перечисление и подчеркнуть, что каждому названному колену соответствуют отдельные ворота; «одни» согласуется с pluralia tantum «ворота».
