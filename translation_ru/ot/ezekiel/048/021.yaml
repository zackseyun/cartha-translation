base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/021.yaml
  text: And what remains shall belong to the prince[a], on both sides of the holy contribution and of the city's property, alongside the twenty-five thousand of the contribution as far as the eastern border, and westward alongside the twenty-five thousand toward the western border, parallel to the portions for the prince. And the holy contribution and the sanctuary of the temple shall be in its midst.
translation:
  language: ru
  text: 'Оставшаяся земля будет принадлежать князю по обе стороны от священного приношения и городского владения: с восточной стороны — вдоль двадцати пяти тысяч[a] приношения до восточной границы, а с западной стороны — вдоль двадцати пяти тысяч до западной границы, соответственно уделам князя. Священное приношение и святилище храма будут посреди этой земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сказано просто «двадцать пять тысяч»; единица измерения подразумевается из контекста описания земельных размеров у Иезекииля.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: А оставшаяся земля
  rationale: Субстантивированное причастие обозначает остаток земли после названных ранее наделов; слово «земля» добавлено из непосредственного контекста для естественности русского текста.
- source_word: לַנָּשִׂיא
  choice: будет принадлежать князю
  rationale: Дательный оборот передаёт назначение земли князю; «князь» сохраняет устойчивое обозначение гражданского правителя в видении Иезекииля.
- source_word: מִזֶּה וּמִזֶּה
  choice: по обе стороны
  rationale: Идиома указывает на землю с двух сторон центрального священного и городского участка.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: священного приношения
  rationale: «Приношение» сохраняет культовый оттенок תְּרוּמָה, хотя здесь этим словом назван выделенный в дар участок земли.
- source_word: וְלַאֲחֻזַּת הָעִיר
  choice: и городского владения
  rationale: אֲחֻזָּה означает закреплённое владение или земельную собственность; сочетание естественно обозначает городской участок.
- source_word: אֶל־פְּנֵי / עַל־פְּנֵי
  choice: вдоль
  rationale: В географическом описании обороты обозначают пространственное прилегание или протяжённость рядом с участком длиной двадцать пять тысяч.
- source_word: עַד גְּבוּל קָדִימָה
  choice: до восточной границы
  rationale: Передаёт направление и предел восточной части княжеской земли.
- source_word: וְיָמָּה ... עַל גְּבוּל יָמָּה
  choice: и к западу ... до западной границы
  rationale: Сохраняет параллельное описание западной части и её предела.
- source_word: לְעֻמַּת חֲלָקִים
  choice: напротив остальных уделов
  rationale: לְעֻמַּת обозначает соответствие или расположение напротив; «остальных» проясняет, что имеются в виду ранее описанные племенные уделы, не меняя геометрического смысла.
- source_word: וּמִקְדַּשׁ הַבַּיִת
  choice: и святилище храма
  rationale: «Святилище храма» естественно передаёт буквальное «святилище дома» в данном культовом контексте.
- source_word: בְתוֹכָהּ
  choice: посреди неё
  rationale: Женский суффикс допускает соотнесение с землёй/территорией князя; явное местоимение сохраняет пространственную связь заключительной фразы.
theological_decisions:
- issue: Значение תְּרוּמָה в земельном видении
  choice: священное приношение
  alternative: священный участок / священный удел
  rationale: Выбранный вариант сохраняет богослужебную идею земли, выделенной как дар, и не сводит выражение только к административному наделу.
- issue: Референт женского суффикса в בְתוֹכָהּ
  choice: княжеская земля, окружающая центральный участок
  alternative: само священное приношение
  rationale: Синтаксис допускает некоторую неоднозначность, но общая география стиха помещает священное приношение и храм в середине окружающей княжеской территории; формулировка «посреди неё» не добавляет нового богословского вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Длинное древнееврейское описание расчленено двоеточием и повтором «эта земля будет принадлежать князю», чтобы ясно передать границы, не устраняя пространственную неоднозначность исходного текста.
