revisions:
- from: 'А оставшаяся земля будет принадлежать князю — по обе стороны священного приношения и городского владения: к востоку, вдоль двадцати пяти тысяч[a] приношения, до восточной границы, и к западу, вдоль двадцати пяти тысяч, до западной границы, напротив остальных уделов. Эта земля будет принадлежать князю, а священное приношение и святилище храма будут посреди неё.'
  to: 'Оставшаяся земля будет принадлежать князю по обе стороны от священного приношения и городского владения: с восточной стороны — вдоль двадцати пяти тысяч[a] приношения до восточной границы, а с западной стороны — вдоль двадцати пяти тысяч до западной границы, соответственно уделам князя. Священное приношение и святилище храма будут посреди этой земли.'
  rationale: Исправление устраняет добавленное значение «остальных», убирает не имеющий отдельного основания повтор о принадлежности земли князю и делает географический параллелизм восточной и западной сторон естественным по-русски. Заключительное «этой земли» поясняет пространственный референт, который в еврейском выражен женским суффиксом и в контексте относится к окружающей княжеской территории.
