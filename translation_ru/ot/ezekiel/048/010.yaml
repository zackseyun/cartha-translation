  text: וּ֠/לְ/אֵ֜לֶּה תִּהְיֶ֣ה תְרֽוּמַת הַ/קֹּדֶשׁ֮ לַ/כֹּֽהֲנִים֒ צָפ֜וֹנָ/ה חֲמִשָּׁ֧ה וְ/עֶשְׂרִ֣ים אֶ֗לֶף וְ/יָ֨מָּ/ה֙ רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/קָדִ֗ימָ/ה רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/נֶ֕גְבָּ/ה אֹ֕רֶךְ חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וְ/הָיָ֥ה מִקְדַּשׁ יְהוָ֖ה בְּ/תוֹכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/010.yaml
  text: 'And for these[a], the holy contribution shall belong to the priests: on the north, twenty-five thousand in length; on the west, ten thousand in width; on the east, ten thousand in width; and on the south, twenty-five thousand in length[b]; and the sanctuary of Yahweh shall be in its midst.'
translation:
  language: ru
  text: 'Для них, священников, предназначается священный участок[a]: с северной стороны — двадцать пять тысяч в длину[b], с западной — десять тысяч в ширину, с восточной — десять тысяч в ширину и с южной — двадцать пять тысяч в длину. Святилище Яхве будет посреди него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «священное приношение»; имеется в виду отделённая часть земли, посвящённая для священного употребления.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте слово «длина» здесь подразумевается; буквально: «с северной стороны — двадцать пять тысяч».'
    reason: supplied_word
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: Им
  rationale: Предлог לְ с указательным местоимением выражает предназначение или передачу удела. «Им» естественно по-русски и соотносится с названными далее священниками.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: священный участок
  rationale: В видении Иезекииля תְּרוּמָה обозначает выделенную для священного употребления часть земли. «Участок» ясно передаёт земельный контекст, а определение «священный» сохраняет культовый смысл.
- source_word: לַכֹּהֲנִים
  choice: для священников
  rationale: Дательный показатель называет получателей выделенного участка; русское «для священников» сохраняет этот смысл без излишнего усиления.
- source_word: צָפוֹנָה / וְיָמָּה / וְקָדִימָה / וְנֶגְבָּה
  choice: с северной / западной / восточной / южной стороны
  rationale: Направительные формы в описании границ естественно передаются как обозначения соответствующих сторон участка.
- source_word: רֹחַב
  choice: в ширину
  rationale: Передаёт поперечный размер и сохраняет противопоставление длине.
- source_word: אֹרֶךְ
  choice: в длину
  rationale: Передаёт продольный размер участка в естественной русской формулировке.
- source_word: מִקְדַּשׁ יְהוָה
  choice: Святилище Яхве
  rationale: מִקְדָּשׁ означает святилище, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: בְּתוֹכוֹ
  choice: посреди него
  rationale: Местоименный суффикс мужского рода соотнесён со священным участком; выражение передаёт расположение святилища внутри него.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Характер תְּרוּמַת הַקֹּדֶשׁ
  choice: священный участок
  alternative: священное приношение; священный удел
  rationale: Здесь речь идёт о размеченной части земли, однако её культовая посвящённость сохранена словом «священный»; примечание отражает более буквальный образ приношения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского описания. Эллиптические перечисления оформлены тире; единица измерения не добавлена, поскольку в данном стихе еврейский текст её не называет. Повтор размеров и сторон сохранён.
