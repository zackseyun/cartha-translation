base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/014.yaml
  text: They must not sell any of it[a], nor exchange it, nor shall this choice portion of the land pass over to another, for it is holy to Yahweh.
translation:
  language: ru
  text: Они не должны продавать ничего из него и не должны обменивать его; эта главная часть земли[a] не должна переходить к другим, потому что она — святыня Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «начаток земли», «первая часть земли» или «лучшая часть земли». Еврейское выражение может подчёркивать первенство, особую ценность или посвящённый Богу статус этого участка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְכְּרוּ
  choice: продавать
  rationale: Глагол מכר здесь имеет прямое юридико-экономическое значение отчуждения имущества посредством продажи.
- source_word: מִמֶּנּוּ
  choice: из него ничего
  rationale: Предлог с местоименным суффиксом отсылает к ранее описанному священному наделу; русская партитивная конструкция естественно передаёт запрет продавать какую-либо его часть.
- source_word: יָמֵר
  choice: обменивать его
  rationale: Глагол מור означает заменять или обменивать; в контексте земельного надела «обменивать» ясно передаёт запрет на мену посвящённой собственности.
- source_word: יעבור
  choice: переходить к другим
  rationale: Буквальное значение עבר — «переходить»; в имущественном контексте речь идёт о переходе земли во владение иных лиц. Добавление «к другим» раскрывает подразумеваемое направление, не меняя смысла.
- source_word: רֵאשִׁית הָאָרֶץ
  choice: эта лучшая часть земли
  rationale: רֵאשִׁית может обозначать первую, главную или лучшую часть, а также начаток. В контексте распределения освящённой земли перевод указывает на особо выделенную главную часть, а примечание сохраняет лексическую неоднозначность.
- source_word: קֹדֶשׁ
  choice: святыня
  rationale: Предикативное существительное קֹדֶשׁ обозначает не просто качество, а статус участка как посвящённого Богу; «святыня» естественно и весомо передаёт этот смысл.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל выражает посвящение и принадлежность, а יהוה передано личным именем «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено четырёхбуквенное имя Бога; «Яхве» передаёт его как личное заветное имя, а не заменяет титулом.
- issue: Статус посвящённой земли
  choice: она — святыня для Яхве
  alternative: она свята для Яхве
  rationale: Существительное קֹדֶשׁ подчёркивает принадлежность участка к сфере священного и его посвящённость Яхве; перевод не уточняет сверх текста характер или механизм этой святости.
