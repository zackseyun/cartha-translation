revisions:
- from: А оставшиеся пять тысяч в ширину[a], вдоль двадцати пяти тысяч, будут несвященной землёй[b] для города — для жилья и прилегающей открытой земли[c]; город будет посреди неё.
  to: А оставшиеся пять тысяч по ширине, вдоль двадцати пяти тысяч[a], будут обычным, несвященным участком[b] для города, для жилья и для открытого пространства[c]; город будет посреди него.
  rationale: Исправлена стилистически неудачная конструкция и устранено неявное сужение значения מִגְרָשׁ. Добавлен нейтральный термин «обычный» с уточнением «несвященный», чтобы ясно передать культовый контраст חול, не превращая его в оценку чистоты. Местоимение «него» соотнесено с «участком», что естественно передаёт расположение города внутри отведённой территории.
