  text: וַ/חֲמֵ֨שֶׁת אֲלָפִ֜ים הַ/נּוֹתָ֣ר בָּ/רֹ֗חַב עַל פְּנֵ֨י חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף חֹֽל ה֣וּא לָ/עִ֔יר לְ/מוֹשָׁ֖ב וּ/לְ/מִגְרָ֑שׁ וְ/הָיְתָ֥ה הָ/עִ֖יר ב/תוכ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/015.yaml
  text: And the remaining five thousand in width[a], along the face of the twenty-five thousand, shall be common land for the city, for dwelling, and for open land[c][b]; and the city shall be in its midst.
translation:
  language: ru
  text: А оставшиеся пять тысяч по ширине, вдоль двадцати пяти тысяч[a], будут обычным, несвященным участком[b] для города, для жилья и для открытого пространства[c]; город будет посреди него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рядом с двадцатью пятью тысячами». Буквально: «по лицу [участка]»; это пространственное выражение допускает несколько близких толкований.'
    reason: lexical_alternative
  - marker: b
    text: То есть участок, не относящийся к священному наделу; это не означает, что он был нечистым или непригодным.
    reason: cultural_note
  - marker: c
    text: Речь идёт о незастроенном пространстве при городе для общего пользования, возможно также для выпаса скота.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: оставшиеся
  rationale: Причастие обозначает часть, оставшуюся после предыдущих наделов; форма согласована с подразумеваемой мерой в пять тысяч.
- source_word: בָּרֹחַב
  choice: в ширину
  rationale: Передаёт геодезическое значение רֹחַב естественным современным русским выражением.
- source_word: עַל־פְּנֵי
  choice: вдоль
  rationale: В описании земельного участка выражение указывает на протяжённость рядом с длинной стороной другого участка; буквальный пространственный образ пояснён в сноске.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: двадцати пяти тысяч
  rationale: Единица измерения подразумевается из контекста, но в данной фразе не повторена, поэтому в основной текст не добавлена.
- source_word: חֹל
  choice: несвященной землёй
  rationale: Слово обозначает обычное, неосвящённое пространство в противопоставлении священному наделу; «несвященная» ясно передаёт культовый контраст без уничижительного оттенка слова «нечистая».
- source_word: לָעִיר
  choice: для города
  rationale: Предлог ל выражает назначение или отведение участка для нужд города.
- source_word: לְמוֹשָׁב
  choice: для жилья
  rationale: מוֹשָׁב здесь относится к проживанию или заселению; «для жилья» звучит естественно и сохраняет функциональный смысл.
- source_word: וּלְמִגְרָשׁ
  choice: и прилегающей открытой земли
  rationale: מִגְרָשׁ обозначает незастроенную землю при поселении, иногда используемую как пастбище; выбран широкий вариант, не сужающий назначение участка.
- source_word: בְּתוֹכָהּ
  choice: посреди неё
  rationale: Сохраняет указание на расположение города внутри, вероятно в средней части, описываемой территории.
theological_decisions:
- issue: Статус участка חֹל относительно священного надела
  choice: несвященная земля
  alternative: обычная земля; земля общего пользования
  rationale: Перевод сохраняет прямое противопоставление святому пространству, не придавая земле значения нравственно порочной или ритуально нечистой.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого описания и ясной землеустроительной терминологией. Синтаксис слегка формален, но доступен; культовое различие между священным и несвященным сохранено без конфессионального уточнения.
