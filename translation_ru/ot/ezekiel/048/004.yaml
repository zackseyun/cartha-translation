lexical_decisions:
- source_word: וְעַל
  choice: И вдоль
  rationale: Сочетание союза и предлога продолжает последовательное описание земельных полос; «вдоль» естественно передаёт пространственное отношение к границе.
- source_word: גְּבוּל
  choice: границы
  rationale: В контексте распределения земли слово обозначает территориальную границу; родительный падеж обусловлен предлогом «вдоль».
- source_word: נַפְתָּלִי
  choice: Неффалима
  rationale: Использована закрепившаяся в русской библейской традиции форма имени колена; падеж согласован с конструкцией «граница Неффалима».
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  choice: от восточной стороны до западной
  rationale: Перевод сохраняет повторяющуюся географическую формулу и полный размах участка с востока на запад; פֵאָה передано словом «сторона».
- source_word: מְנַשֶּׁה
  choice: Манассии
  rationale: Имя передано в форме дательного падежа, естественной по-русски при обозначении того, кому отведён участок.
- source_word: אֶחָד
  choice: один удел
  rationale: В еврейском тексте буквально стоит только «один», однако в повторяющейся формуле главы подразумевается земельный удел. Добавление существительного делает эллиптическую конструкцию понятной по-русски и отмечено сноской.
