  text: וְ/עַ֣ל גְּב֣וּל אֶפְרַ֗יִם מִ/פְּאַ֥ת קָדִ֛ים וְ/עַד פְּאַת יָ֖מָּ/ה רְאוּבֵ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/006.yaml
  text: And along the border of Ephraim[a], from the east side to the west side, Reuben[b], one portion.
translation:
  language: ru
  text: А вдоль границы Ефрема, от восточного края до западного края, — Рувиму один надел.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Рувим — один». Слово «надел» добавлено по смыслу: в этой главе «один» означает одну земельную долю для колена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: А вдоль границы
  rationale: עַל в контексте перечисления земельных полос указывает на положение вдоль границы; союз וְ передан связующим «А», естественным для продолжения списка.
- source_word: אֶפְרַיִם
  choice: Ефрема
  rationale: Традиционная русская форма имени колена; родительный падеж обусловлен словом «границы».
- source_word: מִפְּאַת קָדִים
  choice: от восточного края
  rationale: פֵּאָה обозначает край или сторону, а קָדִים — восточное направление; «край» уместен для протяжённости земельной полосы.
- source_word: וְעַד פְּאַת יָמָּה
  choice: до западного края
  rationale: Буквально יָם означает «море», но в древнееврейской пространственной ориентации регулярно обозначает запад; здесь это часть географической формулы.
- source_word: רְאוּבֵן אֶחָד
  choice: Рувиму один надел
  rationale: Рувим поставлен в конструкции списка без явно выраженного глагола, а אֶחָד эллиптически обозначает одну племенную земельную долю; дательный падеж ясно выражает назначение полосы.
