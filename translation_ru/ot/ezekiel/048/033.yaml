base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/033.yaml
  text: 'On the south side[a], 4,500 cubits by measure, with three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.'
translation:
  language: ru
  text: 'С южной стороны — протяжённостью 4500 локтей[a], с тремя воротами: ворота Симеона — одни, ворота Иссахара — одни, ворота Завулона — одни.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте сказано просто: «4500 по мере». Единица «локтей» добавлена согласно ближайшему контексту, где указаны размеры города.'
    reason: cross_reference
lexical_decisions:
- source_word: וּ/פְאַת נֶגְבָּה
  choice: С южной стороны
  rationale: פאה обозначает сторону или край, а נגב указывает на южное направление. Союз ו естественно не воспроизводится отдельно в русском перечислении сторон.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: '4500'
  rationale: Еврейское выражение буквально складывает пятьсот и четыре тысячи, то есть 4500; запись цифрами облегчает чтение размеров.
- source_word: מִדָּה
  choice: локтей по мере
  rationale: מִדָּה означает меру или измерение. Единица «локтей» восстановлена из ближайшего контекста размеров города, а слова «по мере» сохраняют явно выраженный еврейский термин.
- source_word: וּ/שְׁעָרִים שְׁלֹשָׁה
  choice: и трое ворот
  rationale: Форма «трое ворот» естественна в современном русском и точно передаёт наличие трёх ворот на этой стороне.
- source_word: שַׁעַר שִׁמְעוֹן אֶחָד
  choice: одни ворота Симеона
  rationale: 'Сохраняется повторяющаяся структура списка: название ворот и указание, что они одни.'
- source_word: שַׁעַר יִשָּׂשכָר אֶחָד
  choice: одни ворота Иссахара
  rationale: Единообразно передаётся формульное перечисление еврейского текста.
- source_word: שַׁעַר זְבוּלֻן אֶחָד
  choice: одни ворота Завулона
  rationale: Единообразно передаётся заключительный элемент повторяющегося списка.
