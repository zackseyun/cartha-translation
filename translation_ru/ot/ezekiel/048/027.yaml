    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: А вдоль
  rationale: В формуле распределения земли сочетание вводит следующую племенную полосу, примыкающую к названной границе; «вдоль» естественно передаёт пространственное отношение.
- source_word: גְּבוּל
  choice: границы
  rationale: Слово обозначает границу или пограничную линию; «граница» соответствует географическому контексту главы.
- source_word: זְבוּלֻן
  choice: Завулона
  rationale: Традиционная русская форма имени колена; родительный падеж обусловлен сочетанием «граница Завулона».
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: от восточной стороны
  rationale: פֵּאָה означает сторону или край, а קָדִימָה указывает направление на восток; перевод сохраняет значение исходной границы полосы.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: до западной
  rationale: Оборот задаёт протяжённость до западной стороны; слово יָמָּה в этой географической формуле означает направление к морю, то есть на запад. Существительное «стороны» естественно подразумевается из первой части параллельной конструкции.
- source_word: גָּד
  choice: Гаду
  rationale: Традиционная русская форма имени колена; дательный падеж ясно выражает назначение земельного удела, подразумеваемое контекстом.
- source_word: אֶחָד
  choice: один удел
  rationale: В еврейском тексте стоит только «один», однако повторяющаяся формула распределения в главе подразумевает один земельный удел. Добавление слова «удел» делает эллиптическую формулу понятной по-русски и отмечено сноской.
