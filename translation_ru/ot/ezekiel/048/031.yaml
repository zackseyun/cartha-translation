  text: וְ/שַׁעֲרֵ֣י הָ/עִ֗יר עַל שְׁמוֹת֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל שְׁעָרִ֥ים שְׁלוֹשָׁ֖ה צָפ֑וֹנָ/ה שַׁ֣עַר רְאוּבֵ֞ן אֶחָ֗ד שַׁ֤עַר יְהוּדָה֙ אֶחָ֔ד שַׁ֥עַר לֵוִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/031.yaml
  text: 'And the gates of the city shall be named after the tribes of Israel: three gates on the north side—one gate of Reuben[a], one gate of Judah, one gate of Levi.'
translation:
  language: ru
  text: 'А ворота города будут называться по именам колен Израиля[a]. С северной стороны — трое ворот: одни ворота Рувима, одни ворота Иуды и одни ворота Левия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «ворота города — по именам колен Израиля».'
    reason: Исходная еврейская фраза именная и допускает более формальную передачу как соответствие ворот именам колен.
lexical_decisions:
- source_word: וְשַׁעֲרֵי הָעִיר
  choice: А ворота города
  rationale: Союз וְ сохраняет связь с предшествующим описанием; русское «а» естественно вводит новую деталь устройства города.
- source_word: עַל שְׁמוֹת שִׁבְטֵי יִשְׂרָאֵל
  choice: будут называться по именам колен Израиля
  rationale: Предлог עַל при слове «имена» выражает соответствие наименований. Формулировка естественна по-русски и сохраняет смысл обозначения ворот именами колен.
- source_word: שְׁעָרִים שְׁלוֹשָׁה צָפוֹנָה
  choice: С северной стороны — трое ворот
  rationale: צָפוֹנָה здесь указывает на северную сторону города; собирательное числительное «трое» нормативно сочетается с pluralia tantum «ворота».
- source_word: שַׁעַר רְאוּבֵן אֶחָד
  choice: одни ворота Рувима
  rationale: Повторяющаяся конструкция обозначает отдельные ворота именем соответствующего колена; «одни» согласуется с русским pluralia tantum «ворота».
- source_word: שַׁעַר יְהוּדָה אֶחָד
  choice: одни ворота Иуды
  rationale: Сохранена единообразная структура перечисления и племенное имя без поясняющего расширения.
- source_word: שַׁעַר לֵוִי אֶחָד
  choice: одни ворота Левия
  rationale: Сохранена единообразная структура перечисления; Левий передан как имя колена, а не заменён словом «левиты».
