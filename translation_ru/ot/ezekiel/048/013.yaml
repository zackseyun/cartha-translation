base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/013.yaml
  text: And alongside the territory of the priests[a], the Levites shall have twenty-five thousand cubits in length and ten thousand in width. The whole length shall be twenty-five thousand, and the width ten thousand.
translation:
  language: ru
  text: А левитам рядом с участком священников будет отведён участок длиной в двадцать пять тысяч и шириной в десять тысяч. Вся его длина — двадцать пять тысяч, а ширина — десять тысяч.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת
  choice: рядом с
  rationale: В контексте распределения земли предлог обозначает пространственное соответствие и соседство с участком священников; «рядом с» естественно передаёт это значение по-русски.
- source_word: גְּבוּל
  choice: территория
  rationale: Хотя слово может означать «граница», здесь оно метонимически обозначает ограниченный земельный надел священников.
- source_word: וְהַלְוִיִּם
  choice: А левитам… будет отведён участок
  rationale: В еврейском тексте предложение безглагольное и эллиптическое. Русская формулировка восстанавливает из контекста смысл выделения земельного надела.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: двадцать пять тысяч локтей
  rationale: Единица измерения в стихе не названа, но подразумевается контекстом земельных измерений в Иезекииля 48; добавление «локтей» отмечено сноской.
- source_word: אֹרֶךְ
  choice: длиной
  rationale: Естественное русское обозначение продольного размера участка.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: и шириной в десять тысяч
  rationale: Сохраняет параллелизм размеров и звучит естественно на современном русском языке.
- source_word: כָּל אֹרֶךְ
  choice: Вся его длина
  rationale: Передаёт итоговое повторение полного продольного размера; местоимение ясно соотносит размер с участком левитов.
