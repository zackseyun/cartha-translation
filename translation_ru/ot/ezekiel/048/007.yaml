lexical_decisions:
- source_word: וְ/עַל גְּבוּל רְאוּבֵן
  choice: А вдоль границы Рувима
  rationale: Предлог עַל в описании смежных земель указывает на расположение вдоль границы предыдущего удела; «вдоль границы» естественно и точно передаёт территориальную последовательность.
- source_word: מִ/פְּאַת קָדִים
  choice: от восточной стороны
  rationale: פְּאָה обозначает сторону или край; в повторяющейся землемерной формуле речь идёт о восточной стороне полосы земли.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: до западной
  rationale: Буквально выражение связано со «стороной моря», но יָם в географической ориентации регулярно обозначает запад; по-русски здесь яснее направление «западная».
- source_word: יְהוּדָה אֶחָד
  choice: Иуде — один надел
  rationale: В еврейском тексте буквально стоят «Иуда, один» без выраженного существительного. Дательный «Иуде» естественно передаёт получателя, а «надел» восполняет подразумеваемое слово из формулы распределения земли в этой главе.
