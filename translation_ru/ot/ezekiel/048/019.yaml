  text: А обрабатывать его будут работники города[a] из всех колен Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «работник города»; единственное число здесь имеет собирательный смысл, что подтверждается глаголом во множественном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Тот же еврейский корень можно передать как «служить»: «служащие городу будут служить ему». Но суффикс при глаголе имеет мужской род, тогда как еврейское слово «город» — женского рода; поэтому он, вероятно, относится к земельному наделу, упомянутому в предыдущем контексте.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הָעֹבֵד הָעִיר
  choice: работники города
  rationale: Форма הָעֹבֵד стоит в единственном числе, но последующий глагол имеет множественное число, поэтому причастие понято собирательно. Сочетание с הָעִיר передано естественным русским выражением «работники города».
- source_word: יַעַבְדֻהוּ
  choice: обрабатывать этот участок
  rationale: В данном земельном контексте עבד естественно означает обработку земли. Мужской местоименный суффикс не согласуется с существительным עִיר «город» женского рода в еврейском и, вероятно, отсылает к оставшемуся участку, описанному в предыдущем стихе. Указательное сочетание «этот участок» делает подразумеваемый объект ясным по-русски, не смешивая его с городом.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: из всех колен Израиля
  rationale: Предлог מִן указывает, что работники набираются из всех израильских колен; традиционное и понятное обозначение שֵׁבֶט — «колено».
theological_decisions:
- issue: К чему относится местоименный суффикс в יַעַבְדֻהוּ
  choice: к земельному участку из ближайшего контекста
  alternative: 'к городу: «будут служить ему»'
  rationale: Еврейское עִיר — существительное женского рода, тогда как суффикс в יַעַבְדֻהוּ мужского рода. Кроме того, контекст предыдущего стиха говорит об остатке земли и её урожае. Поэтому сельскохозяйственное понимание лучше объясняет и грамматику, и контекст, однако альтернативное понимание отмечено в сноске.
