base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/003.yaml
  text: And alongside the border of Asher[a], from the eastern side to the western side, Naphtali, one portion.
translation:
  language: ru
  text: А вдоль границы Асира, от восточной стороны до западной, — один надел Неффалима.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «Неффалим — один». Слово «надел» добавлено для ясности из контекста распределения земли в этой главе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: А вдоль
  rationale: Предлог עַל в формуле распределения земли указывает на расположение следующего участка рядом с границей предыдущего; «вдоль» естественно передаёт пространственную смежность.
- source_word: גְּבוּל
  choice: граница
  rationale: Существительное обозначает границу или пограничную линию; «граница» точно соответствует контексту раздела земли.
- source_word: אָשֵׁר
  choice: Асир
  rationale: Использована закрепившаяся в русской библейской традиции форма названия колена.
- source_word: מִפְּאַת קָדִימָה
  choice: от восточной стороны
  rationale: פֵּאָה означает сторону или край, а קָדִימָה указывает на восток; перевод сохраняет пространственную формулу исходного текста.
- source_word: וְעַד פְּאַת יָמָּה
  choice: до западной стороны
  rationale: עַד выражает предел протяжённости, а יָמָּה здесь идиоматически означает запад; формулировка ясно передаёт протяжённость с востока на запад.
- source_word: נַפְתָּלִי
  choice: Неффалим
  rationale: Использована закрепившаяся в русской библейской традиции форма названия колена.
- source_word: אֶחָד
  choice: один надел
  rationale: В еврейском тексте стоит только «один», однако в контексте распределения земли подразумевается один земельный надел. Слово «надел» добавлено для ясности, а дополнение «Неффалима» естественно передаёт принадлежность участка.
