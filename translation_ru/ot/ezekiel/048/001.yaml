base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/001.yaml
  text: 'These are the names of the tribes: from the northern extremity[a], beside the way of Hethlon to Lebo-hamath, Hazar-enan, at the border of Damascus northward beside Hamath, and extending from the east side to the sea, Dan[b], one portion.'
translation:
  language: ru
  text: 'Вот имена племён: от северного края, вдоль пути Хетлона к Лево-Хамату, Хацар-Энану, у северной границы Дамаска, рядом с Хаматом; от восточной стороны до моря — один участок для Дана[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «и будет у него сторона от востока до моря». Еврейская фраза сжата и, по-видимому, описывает протяжённость надела Дана с востока на запад.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת הַשְּׁבָטִים
  choice: Вот имена племён
  rationale: «Вот» естественно вводит перечень в современном русском, не добавляя временного значения; «племена» точно передаёт שְׁבָטִים в контексте земельных наделов Израиля.
- source_word: מִקְצֵה צָפוֹנָה
  choice: на крайнем севере
  rationale: קָצֶה обозначает край или оконечность; русское выражение передаёт исходную точку описания северной полосы без излишней тяжеловесности.
- source_word: אֶל יַד דֶּרֶךְ חֶתְלֹן
  choice: вдоль дороги от Хетлона
  rationale: Идиома אֶל יַד в описаниях границ указывает на близость или прохождение рядом. «Вдоль» естественно передаёт топографический смысл; направление дороги уточняется последующим לְבוֹא חֲמָת.
- source_word: לְבוֹא חֲמָת
  choice: к Лево-Хамату
  rationale: Сочетание, буквально связанное со «входом в Хамат», в географических перечнях традиционно понимается как топоним; транслитерация сохраняет это прочтение, а буквальный смысл отмечен в сноске.
- source_word: חֲצַר עֵינָן
  choice: Хацар-Энан
  rationale: Топоним передан транслитерацией с сохранением двухчастной формы имени.
- source_word: גְּבוּל דַּמֶּשֶׂק צָפוֹנָה
  choice: по северной границе Дамаска
  rationale: Такой порядок слов ясно и естественно выражает отношение границы к Дамаску и северное направление, не меняя географической функции фразы.
- source_word: אֶל יַד חֲמָת
  choice: рядом с Хаматом
  rationale: Повторная пограничная идиома אֶל יַד передана как указание на соседство с областью Хамата.
- source_word: וְהָיוּ לוֹ פְאַת קָדִים הַיָּם
  choice: от восточной стороны до моря
  rationale: Сжатая еврейская конструкция описывает протяжённость полосы с востока до западного моря. Основной текст передаёт вероятный пространственный смысл, а формально более близкая альтернатива сохранена в сноске.
- source_word: דָּן אֶחָד
  choice: Дану один участок
  rationale: אֶחָד при имени племени эллиптически указывает на одну земельную полосу или долю; дательный падеж по-русски естественно выражает назначение надела.
