base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/016.yaml
  text: 'And these are its measurements: the north side[a], four thousand five hundred; and the south side, four thousand five hundred; and from the east side, four thousand five hundred; and the west side, four thousand five hundred.'
translation:
  language: ru
  text: 'Вот её размеры: северная сторона — четыре тысячи пятьсот[a]; южная сторона — четыре тысячи пятьсот[b]; с восточной стороны — четыре тысячи пятьсот; западная сторона — четыре тысячи пятьсот.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «пятьсот и четыре тысячи»; здесь число дано в обычном для русского языка порядке.'
    reason: lexical_alternative
  - marker: b
    text: В масоретском еврейском тексте перед словом «пятьсот» повторено слово «пять»; значение этого повторения неясно.
    reason: textual_note
lexical_decisions:
- source_word: מִדּוֹתֶיהָ
  choice: её размеры
  rationale: Форма с местоименным суффиксом указывает на размеры города; «размеры» естественно передаёт смысл в контексте описания его сторон.
- source_word: פְּאַת
  choice: сторона
  rationale: В данном контексте измерения города слово обозначает одну из его сторон или границ; «сторона» ясно сочетается с названиями направлений.
- source_word: צָפוֹן / נֶגֶב / קָדִים / יָמָּה
  choice: северная / южная / восточная / западная
  rationale: Все четыре слова употреблены как обозначения сторон света. יָמָּה, буквально связанное с морем, здесь означает западное направление.
- source_word: מִפְּאַת קָדִים
  choice: с восточной стороны
  rationale: Сохраняется присутствующий в еврейском тексте предлог מִן без неестественной для русского языка конструкции.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: четыре тысячи пятьсот
  rationale: Число передано в обычном для современного русского языка порядке; одна и та же величина повторена для каждой стороны.
