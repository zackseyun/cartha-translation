  text: This is the land that you shall assign as an inheritance to the tribes of Israel[a], and these are their portions, declares the Lord GOD.
translation:
  language: ru
  text: Вот земля, которую вы выделите племенам Израиля в наследственное владение, и вот их уделы[a], — возвещает Господь Яхве.
