    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: Вот земля
  rationale: Указательная конструкция подводит итог описанию земли; «вот земля» естественно и сохраняет наглядный характер еврейского оборота.
- source_word: תַּפִּילוּ
  choice: которую вы распределите
  rationale: Hифиль от נפל в контексте раздела земли означает распределение по жребию или назначение долей; «распределите» ясно передаёт результат, не утверждая прямо не названный здесь способ.
- source_word: מִנַּחֲלָה
  choice: в наследие
  rationale: נַחֲלָה обозначает наследственное владение или удел; русское «в наследие» кратко и идиоматично выражает назначение земли.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: племенам Израиля
  rationale: Дательный падеж естественно обозначает получателей распределяемой земли.
- source_word: מַחְלְקוֹתָם
  choice: их уделы
  rationale: Слово обозначает выделенные при разделе доли; «уделы» соответствует земельному контексту и сохраняет библейское достоинство без излишней архаичности.
- source_word: נְאֻם
  choice: возвещает
  rationale: Пророческая формула удостоверяет последующее или предшествующее слово как Божье изречение; «возвещает» естественно в торжественном русском регистре.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Переданы оба элемента составного божественного титула: אֲדֹנָי как «Владыка», а тетраграмматон — личным именем «Яхве», без тавтологии «Господь Господь».'
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Так сохраняются и титул אֲדֹנָי, и непосредственно присутствующее в еврейском тексте имя יהוה, при этом русская формулировка не создаёт повтора титулов.
- issue: Способ распределения земли в תַּפִּילוּ
  choice: распределите
  alternative: распределите по жребию
  rationale: Глагольная идиома может быть связана с бросанием жребия, однако в данном стихе жребий прямо не назван; нейтральное «распределите» сохраняет смысл назначения уделов, не устраняя возможный фон жребия.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и итоговый; термин «уделы» выбран как понятный в контексте распределения земли.
