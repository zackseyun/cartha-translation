lexical_decisions:
- source_word: וְעַל
  choice: Рядом с
  rationale: В формуле последовательного распределения земель сочетание указывает на полосу, примыкающую к границе предыдущего племени; по-русски «рядом с» естественно передаёт пространственное отношение.
- source_word: גְּבוּל
  choice: границей
  rationale: В данном контексте слово обозначает границу племенного надела.
- source_word: מְנַשֶּׁה
  choice: Манассии
  rationale: Принятая русская библейская форма имени племени; родительный падеж обусловлен словом «границей».
- source_word: מִפְּאַת קָדִימָה
  choice: от восточной стороны
  rationale: Передаёт восточный край протяжённого с востока на запад надела без излишнего уточнения.
- source_word: עַד פְּאַת יָמָּה
  choice: до западной
  rationale: Слово יָמָּה буквально связано с морем, но в географической ориентации означает запад; опущенное «стороны» легко восстанавливается из параллельной конструкции.
- source_word: אֶפְרַיִם
  choice: Ефрему
  rationale: Принятая русская библейская форма; дательный падеж естественно выражает получателя надела.
- source_word: אֶחָד
  choice: один удел
  rationale: В еврейском тексте стоит только «один», но повторяющаяся формула главы подразумевает один земельный удел; существительное добавлено для ясности и отмечено сноской.
