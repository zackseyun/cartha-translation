- source_word: וְעַל גְּבוּל גָּד
  choice: А по границе Гада
  rationale: Предлог עַל в описании рубежа естественно передан как «по»; сохраняется связь с предыдущим описанием границ.
- source_word: אֶל פְּאַת נֶגֶב תֵּימָנָה
  choice: с южной стороны, к югу
  rationale: Сохранено намеренное накопление слов со значением южного направления, но фраза оформлена естественно для современного русского языка.
- source_word: וְהָיָה גְבוּל
  choice: граница пройдёт
  rationale: В формулах описания границ глагол היה обозначает расположение линии рубежа; «пройдёт» ясно и идиоматично передаёт эту функцию.
- source_word: מִתָּמָר
  choice: от Тамара
  rationale: Топоним передан транслитерацией и оформлен в родительном падеже после предлога.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: к водам Мериват-Кадеша
  rationale: Сохранена конструктивная форма топонима מריבת и связь с Кадешем, без истолкования названия как нарицательного выражения.
- source_word: נַחֲלָה
  choice: к руслу
  rationale: Это направительная форма от נַחַל. В данном тексте отсутствуют слова «Египта», поэтому географическое уточнение не добавлено; «русло» не создаёт ложного впечатления о постоянном водотоке.
- source_word: עַל הַיָּם הַגָּדוֹל
  choice: к Великому морю
  rationale: В последовательности ориентиров עַל указывает на достижение Великого моря; традиционное название сохранено без подстановки современного географического наименования.
