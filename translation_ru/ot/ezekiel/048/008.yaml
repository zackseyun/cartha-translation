source:
  edition: WLC
  text: וְ/עַל֙ גְּב֣וּל יְהוּדָ֔ה מִ/פְּאַ֥ת קָדִ֖ים עַד פְּאַת יָ֑מָּ/ה תִּהְיֶ֣ה הַ/תְּרוּמָ֣ה אֲֽשֶׁר תָּרִ֡ימוּ חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֜לֶף רֹ֗חַב וְ/אֹ֜רֶךְ כְּ/אַחַ֤ד הַ/חֲלָקִים֙ מִ/פְּאַ֤ת קָדִ֨ימָ/ה֙ עַד פְּאַת יָ֔מָּ/ה וְ/הָיָ֥ה הַ/מִּקְדָּ֖שׁ בְּ/תוֹכֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/008.yaml
  text: 'Along the border of Judah[a], from the east side to the west side, shall be the contribution that you shall set apart: twenty-five thousand in width, and in length like one of the portions, from the east side to the west side[c][b]; and the sanctuary shall be in its midst.'
translation:
  language: ru
  text: 'Вдоль границы Иуды, от восточной стороны до западной, будет находиться священный участок[a], который вы отделите: шириной двадцать пять тысяч и длиной, как один из наделов[b], от восточной стороны до западной[c]. Святилище будет посреди него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «приношение»; возможен перевод «отделённый участок». Еврейское слово обозначает долю, особо отделённую для священного назначения.'
    reason: lexical_alternative
  - marker: b
    text: То есть по длине этот участок будет подобен одному из земельных наделов.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «от восточного края до края со стороны моря»; здесь сторона моря означает запад.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: граница
  rationale: В контексте распределения земли слово обозначает территориальную границу; «граница» естественно и точно передаёт этот смысл.
- source_word: מִפְּאַת קָדִים ... עַד פְּאַת יָמָּה
  choice: от восточной стороны до западной
  rationale: Пֵאָה обозначает сторону или край, а יָמָּה в географическом употреблении указывает на запад; перевод передаёт направление естественным русским выражением.
- source_word: הַתְּרוּמָה
  choice: священный участок
  rationale: В главах 45–48 термин обозначает часть земли, специально отделённую для священного назначения. Такой перевод ясно передаёт референт в данном контексте, а сноска сохраняет образ приношения и возможные лексические варианты.
- source_word: תָּרִימוּ
  choice: который вы отделите
  rationale: Порода хифиль глагола רוּם здесь означает выделить землю как особое приношение; «отделите» соответствует земельному, а не жертвенному контексту.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: двадцать пять тысяч
  rationale: Единица измерения в этом стихе не названа, поэтому она, как и в еврейском тексте, оставлена подразумеваемой.
- source_word: רֹחַב
  choice: шириной
  rationale: Естественное русское обозначение поперечного размера участка.
- source_word: אֹרֶךְ
  choice: длиной
  rationale: Естественное русское обозначение продольного размера, согласованное с синтаксисом описания.
- source_word: כְּאַחַד הַחֲלָקִים
  choice: как один из наделов
  rationale: חֵלֶק означает долю, часть или надел. «Надел» точно соответствует контексту распределения земли, не добавляя в основной текст отсутствующего слова «племенной».
- source_word: הַמִּקְדָּשׁ
  choice: святилище
  rationale: Стандартное широкое обозначение святого места или храмового святилища, не сужающее значение без оснований.
- source_word: בְּתוֹכוֹ
  choice: посреди него
  rationale: Передаёт расположение святилища внутри выделенного участка и сохраняет пространственный акцент оригинала.
