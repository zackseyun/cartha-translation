  text: וְ/אֵ֖לֶּה תּוֹצְאֹ֣ת הָ/עִ֑יר מִ/פְּאַ֣ת צָפ֔וֹן חֲמֵ֥שׁ מֵא֛וֹת וְ/אַרְבַּ֥עַת אֲלָפִ֖ים מִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/030.yaml
  text: 'And these are the exits of the city: on the north side[b][a], four thousand five hundred measures.'
translation:
  language: ru
  text: 'И вот выходы[a] города: с северной стороны — четыре тысячи пятьсот мер[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внешние пределы». Еврейское слово может обозначать места выхода либо внешние границы города.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально порядок слов в еврейском тексте: «пятьсот и четыре тысячи», то есть четыре тысячи пятьсот; единица измерения здесь не названа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Сохраняет соединительную силу וְ и естественно вводит новый раздел-перечень на современном русском языке.
- source_word: תּוֹצְאֹת
  choice: выходы
  rationale: Передаёт основное значение «выходы, места выхода», не подменяя слово более узким «ворота», которые перечисляются далее; возможное значение внешних пределов отмечено в сноске.
- source_word: הָעִיר
  choice: города
  rationale: Прямой перевод определённого существительного в естественной русской конструкции «выходы города».
- source_word: מִפְּאַת צָפוֹן
  choice: с северной стороны
  rationale: פֵּאָה в описании периметра означает сторону, край; сочетание с предлогом מִ естественно передаётся как «с северной стороны».
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: четыре тысячи пятьсот
  rationale: Русский порядок числительных передаёт то же число идиоматично; буквальный еврейский порядок указан в сноске.
- source_word: מִדָּה
  choice: мер
  rationale: Сохраняет указание на измеренную величину, не вводя отсутствующую в данном стихе конкретную единицу, например локти.
