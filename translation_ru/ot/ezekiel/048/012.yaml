source:
  edition: WLC
  text: וְ/הָיְתָ֨ה לָ/הֶ֧ם תְּרוּמִיָּ֛ה מִ/תְּרוּמַ֥ת הָ/אָ֖רֶץ קֹ֣דֶשׁ קָדָשִׁ֑ים אֶל גְּב֖וּל הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/012.yaml
  text: And it shall be for them a special allotment from the contribution of the land[a], most holy[c][b], beside the territory of the Levites.
translation:
  language: ru
  text: И будет у них особый надел из священного участка земли[a] — святыня святынь[b] — рядом с владением левитов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из приношения земли»; имеется в виду часть земли, особо отделённая для священного назначения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское усилительное выражение, означающее высшую степень святости; также возможно: «святейшая святыня». Здесь оно относится к земельному наделу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «рядом с границей левитов». Еврейское слово может обозначать как границу, так и ограниченную ею территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: И будет
  rationale: Форма с וְ в контексте будущего распределения земли имеет будущее, описательно-результативное значение.
- source_word: לָהֶם
  choice: у них
  rationale: Передаёт принадлежность священникам, о которых говорится в ближайшем контексте, естественным русским оборотом.
- source_word: תְּרוּמִיָּה
  choice: особый надел
  rationale: В Иез 45–48 слово обозначает выделенную часть территории; «надел» ясно передаёт земельный смысл, а «особый» — её обособленный статус.
- source_word: מִתְּרוּמַת הָאָרֶץ
  choice: из священного участка земли
  rationale: Речь о более крупной части земли, отделённой для священного назначения. Такой перевод естественнее буквального «из приношения земли» и сохраняет сакральный характер участка.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: святыня святынь
  rationale: Сохраняет еврейскую усилительную конструкцию и не добавляет отсутствующее в тексте слово «место»; в данном контексте выражение характеризует земельный надел как обладающий высшей степенью святости.
- source_word: אֶל גְּבוּל הַלְוִיִּם
  choice: рядом с владением левитов
  rationale: אֶל в описании границ указывает на смежность, а גְּבוּל может обозначать не только линию границы, но и ограниченную ею территорию.
theological_decisions:
- issue: Значение קֹדֶשׁ קָדָשִׁים применительно к земельному участку
  choice: святыня святынь
  alternative: святейшая святыня / особо священный участок
  rationale: Формулировка сохраняет сверхвысокую степень святости и напряжение исходного выражения, не отождествляя участок с внутренним святилищем и не добавляя слова, которого нет в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской сдержанностью. Территориальная терминология ясна обычному читателю; «святыня святынь» намеренно сохраняет образную и богословскую напряжённость оригинала.
