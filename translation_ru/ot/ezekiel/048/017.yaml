base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/017.yaml
  text: And the city's open land shall be two hundred fifty cubits to the north[a], two hundred fifty to the south, two hundred fifty to the east[b], and two hundred fifty to the west.
translation:
  language: ru
  text: Незастроенная земля вокруг города[a] будет простираться на двести пятьдесят к северу, на двести пятьдесят — к югу, на двести пятьдесят — к востоку и на двести пятьдесят — к западу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское מִגְרָשׁ может также означать общинную незастроенную землю или пастбище при городе.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: будет простираться
  rationale: Форма продолжает описание будущего устройства земли; вместе с указанием расстояний глагол «простираться» естественно передаёт смысл по-русски.
- source_word: מִגְרָשׁ לָעִיר
  choice: свободная земля вокруг города
  rationale: מִגְרָשׁ обозначает незастроенную землю, выделенную при поселении; современное слово «пригород» могло бы ошибочно подразумевать застроенный район, а «выгон» чрезмерно сужает значение.
- source_word: צָפוֹנָה / נֶגְבָּה / קָדִימָה / יָמָּה
  choice: к северу / к югу / к востоку / к западу
  rationale: Направительные формы образуют последовательный перечень четырёх сторон света. יָמָּה буквально связано с направлением к морю, но здесь однозначно обозначает запад.
- source_word: חֲמִשִּׁים וּמָאתַיִם
  choice: двести пятьдесят
  rationale: Буквальный еврейский порядок — «пятьдесят и двести»; в современном русском числительное естественно ставится в порядке «двести пятьдесят».
