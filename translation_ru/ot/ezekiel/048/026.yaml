source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל יִשָׂשכָ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה זְבוּלֻ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/026.yaml
  text: And along the border of Issachar[a], from the east side to the west side, Zebulun[b], one portion.
translation:
  language: ru
  text: А вдоль границы Иссахара, от восточной стороны до западной[a], — Завулону один удел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до стороны моря»; в древнееврейском географическом употреблении «море» здесь означает запад.'
    reason: cultural_note
  - marker: b
    text: 'В еврейском тексте буквально: «Завулон — один»; слово «удел» подразумевается по повторяющейся в этой главе формуле распределения земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: А вдоль
  rationale: Сочетание союза и предлога продолжает последовательное описание земельных наделов; «вдоль» естественно передаёт пространственное отношение к границе.
- source_word: גְּבוּל
  choice: границы
  rationale: В контексте раздела земли слово обозначает пограничную линию предыдущего племенного надела.
- source_word: יִשָׂשכָר
  choice: Иссахара
  rationale: Использована традиционная русская форма имени племени.
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: от восточной стороны
  rationale: פֵּאָה обозначает сторону или край, а קָדִימָה указывает на восток; сочетание передано естественной русской географической формулой.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: до западной
  rationale: עַד обозначает предел протяжённости, а выражение с יָם («море») в данной географической формуле означает западную сторону.
- source_word: זְבוּלֻן
  choice: Завулону
  rationale: Традиционная русская форма имени поставлена в дательном падеже, чтобы ясно выразить подразумеваемое выделение земли этому племени.
- source_word: אֶחָד
  choice: один удел
  rationale: В еврейском тексте стоит буквально «один»; существительное «удел» восстановлено из повторяющейся формулы распределения земли в главе.
