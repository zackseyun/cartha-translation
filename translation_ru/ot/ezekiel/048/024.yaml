- source_word: שִׁמְעוֹן
  choice: Симеону
  rationale: Дательный падеж естественно выражает получателя надела, подразумеваемого эллиптической формулой.
- source_word: אֶחָד
  choice: один надел
  rationale: В еврейском тексте буквально стоит «один»; существительное «надел» восстановлено по повторяющейся формуле распределения земли в главе.
