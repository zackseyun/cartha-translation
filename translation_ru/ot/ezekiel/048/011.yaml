source:
  edition: WLC
  text: לַ/כֹּהֲנִ֤ים הַֽ/מְקֻדָּשׁ֙ מִ/בְּנֵ֣י צָד֔וֹק אֲשֶׁ֥ר שָׁמְר֖וּ מִשְׁמַרְתִּ֑/י אֲשֶׁ֣ר לֹֽא תָע֗וּ בִּ/תְעוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֥ר תָּע֖וּ הַ/לְוִיִּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/011.yaml
  text: It shall be for the priests who are consecrated from the sons of Zadok[a], who kept my charge, who did not go astray when the sons of Israel went astray[c][b], as the Levites went astray.
translation:
  language: ru
  text: Этот надел будет принадлежать освящённым священникам из потомков Садока[a], которые исполняли возложенное на них Мною служение[b] и не уклонились, когда сыны Израиля уклонились[c], как уклонились левиты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из сынов Садока».'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду исполнение обязанностей, вверенных Богом, особенно обязанностей священнического служения.
    reason: cultural_note
  - marker: c
    text: 'Или: «когда народ Израиля уклонился».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּהֲנִים
  choice: будет принадлежать священникам
  rationale: Предлог ל в контексте распределения земли обозначает получателей надела. Такая формулировка естественно передаёт назначение участка.
- source_word: הַמְקֻדָּשׁ
  choice: освящённым
  rationale: Страдательное причастие от קדשׁ указывает на культовое посвящение, а не только на нравственную святость.
- source_word: מִבְּנֵי צָדוֹק
  choice: из потомков Садока
  rationale: В данном родословном контексте בני обозначает потомков; выбран естественный современный русский эквивалент, а буквальная форма отмечена в сноске.
- source_word: שָׁמְרוּ מִשְׁמַרְתִּי
  choice: верно исполняли порученное Мною служение
  rationale: Сочетание обозначает соблюдение вверенной Богом обязанности, особенно в священническом контексте. Перевод передаёт смысл без неестественного буквального выражения «хранили Мою стражу».
- source_word: לֹא תָעוּ
  choice: не уклонились
  rationale: Глагол תעה здесь означает религиозное и нравственное отступление, а не физическое блуждание.
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל
  choice: когда сыны Израиля уклонились
  rationale: Инфинитив с ב передаёт временное обстоятельство. Формула «сыны Израиля» сохраняет традиционное родовое обозначение, не исключая значения всего народа.
- source_word: כַּאֲשֶׁר תָּעוּ הַלְוִיִּם
  choice: как уклонились левиты
  rationale: כַּאֲשֶׁר вводит сравнение; повтор глагола «уклонились» сохраняет выразительный параллелизм еврейского текста.
theological_decisions:
- issue: Священническое происхождение и верность в храмовом видении Иезекииля
  choice: Надел предназначается освящённым священникам из рода Садока, сохранившим верность порученному служению.
  alternative: Можно было бы сделать основной акцент только на награде за верность, не подчёркивая происхождение.
  rationale: Еврейский текст прямо соединяет происхождение от Садока с верным исполнением Божьего поручения. Перевод сохраняет оба основания, не привнося позднейших учений о священстве.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Слово «надел» ясно связывает стих с контекстом распределения земли; «освящённым священникам» сохраняет культовый смысл; повтор «уклонились» воспроизводит еврейский параллелизм.
