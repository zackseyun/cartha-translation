  text: סָבִ֕יב שְׁמֹנָ֥ה עָשָׂ֖ר אָ֑לֶף וְ/שֵׁם הָ/עִ֥יר מִ/יּ֖וֹם יְהוָ֥ה שָֽׁמָּ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/035.yaml
  text: All around shall be eighteen thousand[a], and the name of the city from that day on shall be, Yahweh Is There.
translation:
  language: ru
  text: По окружности — восемнадцать тысяч. И с того дня имя города — «Яхве там».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ шамма́» (Яхве шамма́), то есть «Яхве там».'
    reason: Поясняет еврейскую форму символического имени и его значение.
lexical_decisions:
- source_word: סָבִיב
  choice: Вся окружность
  rationale: В данном итоговом измерении слово обозначает полный периметр города; такая передача естественна по-русски и сохраняет пространственный смысл.
- source_word: שְׁמֹנָה עָשָׂר אָלֶף
  choice: восемнадцать тысяч
  rationale: В еврейском тексте единица измерения здесь не повторена, поэтому перевод сохраняет его краткость и не добавляет слово «локтей».
- source_word: וְשֵׁם הָעִיר
  choice: И ... имя города
  rationale: Прямая и торжественная передача конструкции, вводящей символическое имя города.
- source_word: מִיּוֹם
  choice: с того дня
  rationale: Предлог отмечает момент, начиная с которого город будет носить это имя; по-русски продолжительность достаточно выражена будущей формой «будет».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: שָׁמָּה
  choice: там
  rationale: Наречие входит в состав символического имени; связка «есть» в настоящем времени по-русски естественно опускается.
theological_decisions:
- issue: Передача имени יְהוָה в символическом имени города
  choice: «Яхве там»
  alternative: «Господь там»; «Яхве здесь»
  rationale: Текст прямо содержит тетраграмматон, поэтому сохранено личное имя «Яхве». שָׁמָּה буквально означает «там»; вариант «здесь» выразительнее с точки зрения жителей города, но меняет пространственную перспективу исходного текста.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным завершением видения. Тире подчёркивает итоговое измерение, кавычки обозначают официальное символическое имя города.
