  source_fidelity: 'Смысл передан в целом верно: סָבִיב относится к общему периметру, число дано без повторения единицы измерения, а יְהוָה שָׁמָּה правильно передано как «Яхве там». Однако «Вся окружность» звучит как не вполне удачное именование геометрического объекта; «По окружности» точнее передаёт обстоятельственное סָבִיב. Будущее «будет» допустимо как русское раскрытие эллиптической формулы, но более естественно и ближе к лаконичному еврейскому именованию — тире после «с того дня».'
