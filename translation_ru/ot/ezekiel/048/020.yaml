  text: כָּל הַ/תְּרוּמָ֗ה חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף בַּ/חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף רְבִיעִ֗ית תָּרִ֨ימוּ֙ אֶת תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ אֶל אֲחֻזַּ֖ת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/020.yaml
  text: The whole contribution shall be twenty-five thousand by twenty-five thousand[a]; you shall set apart the holy contribution as a quarter of the city's property.
translation:
  language: ru
  text: Весь выделенный участок — двадцать пять тысяч на двадцать пять тысяч[a]. Выделите священный участок вместе с городским владением в форме квадрата[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, вероятно, двадцать пять тысяч локтей на двадцать пять тысяч локтей; единица измерения подразумевается из контекста.
    reason: В самом стихе единица измерения не названа, хотя окружающий контекст позволяет предполагать локти.
  - marker: b
    text: 'Или: «Выделите священный участок как четверть городского владения». Значение еврейского выражения допускает и такое понимание.'
    reason: Слово רְבִיעִית может обозначать квадратную форму либо дробное обозначение «четверть»; синтаксическая связь с городским владением также обсуждается.
lexical_decisions:
- source_word: תְּרוּמָה / תְּרוּמַת
  choice: отделённый участок / священный участок
  rationale: В контексте распределения земли существительное обозначает особо выделенную территорию, а не жертву у алтаря. Слово «участок» естественно передаёт земельный характер, а причастие «отделённый» — идею посвящения и изъятия из общей территории.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף ... בַּחֲמִשָּׁה וְעֶשְׂרִים אָלֶף
  choice: двадцать пять тысяч на двадцать пять тысяч
  rationale: В еврейском тексте указаны размеры, но единица измерения в самом стихе не названа. Русская конструкция с «на» естественно выражает соотношение сторон; предполагаемые локти вынесены в примечание.
- source_word: רְבִיעִית
  choice: в виде квадрата
  rationale: В данном описании земельного участка форма наиболее естественно указывает на четырёхстороннюю, квадратную территорию; это согласуется с равными размерами сторон. Возможное дробное понимание «четверть» сохраняется в примечании.
- source_word: תָּרִימוּ
  choice: выделите
  rationale: Hiphil глагола רום в сочетании с תְּרוּמָה означает отделить или предназначить особую долю. «Выделите» ясно звучит в административно-географическом контексте и не создаёт образа физического поднятия.
- source_word: הַקֹּדֶשׁ
  choice: священный
  rationale: Слово обозначает принадлежность к святыне, то есть особое посвящение Богу. «Священный» естественно согласуется в русском языке со словом «участок».
- source_word: אֶל אֲחֻזַּת הָעִיר
  choice: вместе с владением города
  rationale: Предлог אֶל здесь выражает соотнесённость или присоединение священной части к городской земельной собственности. «Вместе с» передаёт пространственно-административную связь без искусственного превращения городской территории в четверть священного участка.
- source_word: אֲחֻזַּת הָעִיר
  choice: владение города
  rationale: אֲחֻזָּה обозначает наследственное или земельное владение. Выражение «владение города» сохраняет земельно-правовой оттенок и соответствует достойному современному регистру.
