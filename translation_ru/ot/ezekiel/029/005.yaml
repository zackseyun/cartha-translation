  text: וּ/נְטַשְׁתִּ֣י/ךָ הַ/מִּדְבָּ֗רָ/ה אוֹתְ/ךָ֙ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ עַל פְּנֵ֤י הַ/שָּׂדֶה֙ תִּפּ֔וֹל לֹ֥א תֵאָסֵ֖ף וְ/לֹ֣א תִקָּבֵ֑ץ לְ/חַיַּ֥ת הָ/אָ֛רֶץ וּ/לְ/ע֥וֹף הַ/שָּׁמַ֖יִם נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/005.yaml
  text: I will cast you into the wilderness[a], you and all the fish of your streams. You will fall on the open field; you will not be gathered or collected[c][b]. I have given you as food to the beasts of the earth and to the birds of the heavens.
translation:
  language: ru
  text: Я выброшу тебя в пустыню — тебя и всю рыбу твоих нильских протоков[a]. Ты падёшь в открытом поле; тебя не подберут и не соберут[b]. Я отдал тебя на съедение[c] зверям земным и птицам небесным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «рыбу твоих потоков». В египетском контексте употреблённое здесь слово обычно обозначает Нил, его рукава и каналы.'
    reason: cultural_note
  - marker: b
    text: В еврейском тексте стоят два близких по значению глагола. Их сочетание подчёркивает, что павшего никто не подберёт и не уберёт, в том числе для погребения.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «Я отдал тебя в пищу». Прошедшее время представляет ещё предстоящий суд как уже решённый и потому несомненный.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: Я выброшу тебя
  rationale: Глагол נטשׁ может означать «оставить», «покинуть» или «бросить». В контексте суда и удаления из Нила «выброшу» передаёт решительное отвержение, не добавляя лишних подробностей.
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительный суффикс указывает на движение к пустынной местности. Русское «в пустыню» естественно передаёт и направление, и безлюдное место.
- source_word: דְּגַת יְאֹרֶיךָ
  choice: всю рыбу твоих нильских протоков
  rationale: דְּגָה — собирательное обозначение рыбы, а יְאֹר в египетском контексте обычно относится к Нилу и его рукавам или каналам. «Нильские протоки» ясно сохраняет местный египетский смысл.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: в открытом поле
  rationale: Оборот описывает поверхность или открытое пространство поля, где тело остаётся на виду и без защиты. «В открытом поле» звучит по-русски естественно и сохраняет образ полной незащищённости.
- source_word: לֹא תֵאָסֵף וְלֹא תִקָּבֵץ
  choice: тебя не подберут и не соберут
  rationale: 'Два близких по значению страдательных глагола усиливают мысль: павшего никто не уберёт. Разные русские глаголы сохраняют это удвоение без неестественного буквального повтора.'
- source_word: לְחַיַּת הָאָרֶץ
  choice: зверям земным
  rationale: חַיָּה в сценах оставленного тела обычно означает диких зверей. Выражение сохраняет серьёзный библейский регистр и образ животных, пожирающих падаль.
- source_word: וּלְעוֹף הַשָּׁמַיִם
  choice: и птицам небесным
  rationale: Это устойчивый древнееврейский образ. «Птицы небесные» понятно современному читателю и сохраняет возвышенную образность оригинала.
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: Я отдал тебя на съедение
  rationale: Форма перфекта сохранена русским прошедшим временем, а «на съедение» естественно передаёт предназначение в пищу зверям и птицам.
theological_decisions:
- issue: Профетический перфект в заключительной части стиха
  choice: Я отдал тебя на съедение
  alternative: Я отдам тебя на съедение
  rationale: Древнееврейский перфект נְתַתִּיךָ представляет грядущий суд как уже решённый и несомненный. Прошедшее время сохраняет эту пророческую напряжённость, тогда как простое будущее сделало бы высказывание менее выразительным.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; образ пустыни, открытого поля, земных зверей и небесных птиц сохранён. Тире перед уточняющим повтором «тебя» воспроизводит риторическое усиление без тяжеловесности.
