source:
  edition: WLC
  text: דַּבֵּ֨ר וְ/אָמַרְתָּ֜ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י עָלֶ֨י/ךָ֙ פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם הַ/תַּנִּים֙ הַ/גָּד֔וֹל הָ/רֹבֵ֖ץ בְּ/ת֣וֹךְ יְאֹרָ֑י/ו אֲשֶׁ֥ר אָמַ֛ר לִ֥/י יְאֹרִ֖/י וַ/אֲנִ֥י עֲשִׂיתִֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/003.yaml
  text: 'Speak and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Pharaoh king of Egypt, the great sea monster lying in the midst of his Nile channels, who says, “My Nile is mine[b], and I made myself.”’'
translation:
  language: ru
  text: '«Говори и скажи: „Так говорит Владыка Яхве: вот, Я — против тебя, фараон, царь Египта, огромное чудовище[a], лежащее среди своих рукавов Нила, которое говорит: ‘Нил мой, и я сам себя создал’[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огромный дракон». В данном контексте этот образ может также напоминать огромное нильское чудовище, подобное крокодилу.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Нил мой, и я создал его для себя». Древнееврейский текст можно понимать либо как заявление фараона о владении Нилом и о том, что он создал самого себя, либо как заявление, что он создал Нил для себя.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сочетание передано как двойной титул: אֲדֹנָי — «Владыка», а личное имя יהוה — «Яхве». Это избегает неестественного повтора «Господь Господь» и сохраняет личное имя в исходном тексте.'
- source_word: הִנְנִי עָלֶיךָ
  choice: вот, Я — против тебя
  rationale: 'הִנְנִי придаёт словам торжественную пророческую выразительность, а עַל здесь имеет враждебное значение: Бог выступает против фараона.'
- source_word: הַתַּנִּים הַגָּדוֹל
  choice: огромное чудовище
  rationale: תַּנִּים обозначает огромное змееподобное или водное чудовище и может вызывать ассоциацию с крокодилом в нильском контексте. «Чудовище» сохраняет образную широту слова, не сводя его к одному виду животного.
- source_word: הָרֹבֵץ
  choice: лежащее
  rationale: Причастие от רבץ означает «лежать, возлежать, притаиться». Нейтральное «лежащее» естественно передаёт образ чудовища, расположившегося в водах Нила.
- source_word: בְּתוֹךְ יְאֹרָיו
  choice: среди своих рукавов Нила
  rationale: В египетском контексте יְאֹר обозначает Нил или его водные протоки. Множественное число с притяжательным суффиксом передано как «среди своих рукавов Нила».
- source_word: לִי יְאֹרִי
  choice: Мой Нил принадлежит мне
  rationale: 'Буквально: «мне — мой Нил». Русская формулировка ясно передаёт усиленное заявление фараона о владении Нилом.'
- source_word: וַאֲנִי עֲשִׂיתִנִי
  choice: и я сам себя создал
  rationale: Суффикс первого лица единственного числа естественно понимается как прямое дополнение «меня», поэтому сохранено вызывающее заявление фараона о самосотворении.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Выбранный вариант различает титул и личное имя, непосредственно присутствующее в древнееврейском тексте, не создавая повтора одинаковых титулов.
- issue: Смысл хвастливого заявления וַאֲנִי עֲשִׂיתִנִי
  choice: 'Фараон заявляет: «я сам себя создал»'
  alternative: Фараон заявляет, что создал Нил для себя
  rationale: Масоретская форма с объектным суффиксом первого лица поддерживает значение «создал меня/себя». Однако синтаксическая и смысловая связь с предыдущим упоминанием Нила допускает другое традиционное понимание, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис слегка приподнят, но остаётся понятным; образность и неоднозначность древнееврейского текста сохранены без конфессионального истолкования.
