  source_fidelity: 'В целом образ и синтаксическое развитие переданы верно: крюки помещаются в челюсти, рыбы нильских вод пристают к чешуе, а адресат выводится из своих водных путей. Однако «вытащу» конкретизирует способ действия сильнее, чем еврейское הֶעֱלִיתִיךָ («подниму/выведу наверх»), а «будет держаться на» во втором случае ослабляет повтор глагола דבק («прилипать, приставать»).'
