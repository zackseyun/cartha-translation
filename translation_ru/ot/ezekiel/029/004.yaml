  text: וְ/נָתַתִּ֤י חחיים בִּ/לְחָיֶ֔י/ךָ וְ/הִדְבַּקְתִּ֥י דְגַת יְאֹרֶ֖י/ךָ בְּ/קַשְׂקְשֹׂתֶ֑י/ךָ וְ/הַעֲלִיתִ֨י/ךָ֙ מִ/תּ֣וֹךְ יְאֹרֶ֔י/ךָ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ בְּ/קַשְׂקְשֹׂתֶ֖י/ךָ תִּדְבָּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/004.yaml
  text: I will put hooks in your jaws[a], and I will make the fish of your Nile channels cling to your scales; and I will bring you up from the midst of your Nile channels[b], and all the fish of your Nile channels will cling to your scales.
translation:
  language: ru
  text: Я вложу крюки в твои челюсти[a] и сделаю так, что рыба твоих нильских протоков прилипнет к твоей чешуе. Я подниму тебя из среды твоих нильских протоков[b], и вся рыба твоих нильских протоков прилипнет к твоей чешуе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в твои щёки». Еврейское слово может означать как челюсть, так и щёку; образ пойманного на крюки речного существа поддерживает перевод «челюсти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рек» или «каналов». В текстах о Египте еврейское слово обозначает Нил и связанные с ним водные русла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חחיים
  choice: крюки
  rationale: Слово обозначает орудия, которыми захватывают и вытаскивают животное; «крюки» естественно передаёт образ поимки речного чудовища.
- source_word: בִּלְחָיֶיךָ
  choice: в твои челюсти
  rationale: לְחִי может означать щёку или челюсть; при крюках и образе крупного речного животного «челюсти» лучше соответствует контексту.
- source_word: וְהִדְבַּקְתִּי
  choice: сделаю так, что … прилипнет
  rationale: Каузативная форма глагола דבק показывает, что Бог заставляет рыбу пристать к чешуе; конструкция сохраняет это значение и звучит естественно по-русски.
- source_word: דְגַת
  choice: рыба
  rationale: Форма единственного числа имеет собирательное значение и входит в сопряжённую конструкцию «рыба твоих нильских протоков».
- source_word: יְאֹרֶיךָ
  choice: твои нильские протоки
  rationale: В египетском контексте יְאֹר обозначает Нил и связанную с ним сеть водных русел; перевод сохраняет как египетскую конкретику, так и множественное число.
- source_word: בְּקַשְׂקְשֹׂתֶיךָ
  choice: к твоей чешуе / на твоей чешуе
  rationale: Предлог при דבק выражает прикрепление. В первом предложении «прилипнет к» естественно передаёт направление прикрепления, а во втором «будет держаться на» — его сохраняющийся результат без изменения образа.
- source_word: וְהַעֲלִיתִיךָ
  choice: Я вытащу тебя
  rationale: Каузатив от עלה означает заставить подняться или вывести наверх; «вытащу» ясно передаёт извлечение речного существа из воды, подразумеваемое образом крюков.
- source_word: מִתּוֹךְ
  choice: из самих
  rationale: Оборот указывает на извлечение изнутри водных протоков. «Из самих» сохраняет это усиление и звучит естественнее буквального «из среды».
- source_word: תִּדְבָּק
  choice: будет держаться
  rationale: Простая форма דבק означает оставаться прикреплённым или держаться. Собирательное «вся рыба» требует в русском единственного числа.
theological_decisions:
- issue: Образ фараона как речного существа
  choice: Сохранено прямое обращение во втором лице и конкретные детали — челюсти, чешуя, нильские протоки.
  alternative: Назвать существо крокодилом или чудовищем непосредственно в стихе.
  rationale: Сам стих продолжает образ из контекста, но здесь не называет существо отдельным существительным; уточнение внесло бы в текст больше, чем выражено в еврейском оригинале.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Синтаксический параллелизм оригинала сохранён; архаизмы и лишнее уточнение вида речного существа исключены.
