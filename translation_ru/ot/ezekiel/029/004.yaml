  to: Я вложу крюки в твои челюсти[a] и сделаю так, что рыба твоих нильских протоков прилипнет к твоей чешуе. Я подниму тебя из среды твоих нильских протоков[b], и вся рыба твоих нильских протоков прилипнет к твоей чешуе.
