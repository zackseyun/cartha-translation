  - severity: low
    issue: «Будет держаться на твоей чешуе» во второй части.
    rationale: Повтор דבק в еврейском тексте поддерживает повтор «прилипнуть/пристанет». «Держаться на» может означать просто находиться сверху, а не быть прикреплённым.
  - severity: low
