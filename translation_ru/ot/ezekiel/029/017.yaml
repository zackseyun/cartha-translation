  yaml_path: translation/ot/ezekiel/029/017.yaml
  text: And it happened in the twenty-seventh year[a], in the first month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: ru
  text: 'И было так: в двадцать седьмом году, в первый день первого месяца слово Яхве пришло ко мне:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Сохраняет повествовательно-временное введение датированной пророческой речи и звучит торжественно, но не чрезмерно архаично.
- source_word: בְּעֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: в двадцать седьмом году
  rationale: Естественная русская передача еврейской календарной формулы с количественным числительным.
- source_word: בָּרִאשׁוֹן
  choice: в первом месяце
  rationale: Существительное «месяц» подразумевается контекстом формулы датировки; его добавление необходимо для ясности по-русски.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Еврейское выражение буквально говорит об «одном» дне месяца, но идиоматически обозначает его первый день.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: ко мне пришло слово Яхве
  rationale: Естественно передаёт устойчивую пророческую формулу получения откровения, сохраняя «слово» и направление «ко мне».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит по-русски прямую речь, следующую в следующем стихе, без тяжеловесного буквального «говоря».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский с достоинством пророческой формулы. Сохранена точная последовательность элементов датировки; двоеточие передаёт функцию לֵאמֹר и указывает на продолжение речи в следующем стихе.
