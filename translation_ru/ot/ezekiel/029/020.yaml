source:
  edition: WLC
  text: פְּעֻלָּת/וֹ֙ אֲשֶׁר עָ֣בַד בָּ֔/הּ נָתַ֥תִּי ל֖/וֹ אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/020.yaml
  text: As his wages for which he labored against it[a], I have given him the land of Egypt, because they worked for me[c][b], declares the Lord GOD.
translation:
  language: ru
  text: В качестве платы за труд, совершённый им против него[a], Я отдал ему землю Египта, потому что они сделали это для Меня[b], — возвещает Владыка ГОСПОДЬ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как плату за работу, которую он выполнил против него». Еврейское слово может означать «труд», «дело», «плату» или «вознаграждение». Местоимение «него» относится, вероятнее всего, к Тиру (см. 29:18); в еврейском оно женского рода.'
    reason: Лексическая альтернатива и пояснение отсылки местоимения.
  - marker: b
    text: 'Или: «потому что они действовали для Меня»; «потому что они трудились для Меня».'
    reason: Лексическая альтернатива для широкого по значению глагола עשה.
lexical_decisions:
- source_word: פְּעֻלָּתוֹ
  choice: в награду за труд
  rationale: Существительное может обозначать труд, дело либо вознаграждение. Контекст передачи Египта Навуходоносору как платы за военную службу позволяет естественно передать обе стороны смысла выражением «в награду за труд».
- source_word: אֲשֶׁר עָבַד בָּהּ
  choice: который он совершил против него
  rationale: Глагол עבד означает «работать, трудиться, служить»; предлог с местоименным суффиксом в данном контексте указывает на труд, затраченный в походе против Тира. Русское «него» согласовано с мужским родом названия «Тир».
- source_word: נָתַתִּי לוֹ אֶת אֶרֶץ מִצְרָיִם
  choice: Я отдал ему землю Египетскую
  rationale: Форма перфекта передаёт решённое и объявляемое Богом действие. «Земля Египетская» сохраняет территориальный акцент исходного текста и звучит в русском библейском регистре естественно.
- source_word: אֲשֶׁר עָשׂוּ לִי
  choice: потому что они сделали это для Меня
  rationale: Широкое значение עשה («делать, совершать») сохранено без чрезмерного уточнения характера службы; «они» относится к Навуходоносору и его войску.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка ГОСПОДЬ
  rationale: «Возвещает» естественно передаёт пророческую формулу נְאֻם; «Владыка ГОСПОДЬ» различает титул אֲדֹנָי и священное имя יהוה.
theological_decisions:
- issue: К кому относится суффикс женского рода в בָּהּ
  choice: К Тиру из ближайшего контекста; речь идёт о военном труде Навуходоносора против Тира.
  alternative: Суффикс может относиться в более общем смысле к службе или порученному делу.
  rationale: В Иез 29:18 непосредственно говорится о тяжёлой службе Навуходоносора против Тира, после которой Египет даётся ему как вознаграждение. Ссылка вынесена в примечание, поскольку в русском название «Тир» мужского рода.
- issue: Смысл слов «они сделали это для Меня»
  choice: Навуходоносор и его войско выступили орудиями Божьего суда.
  alternative: Они действовали исключительно ради собственных имперских целей, без какого-либо смысла служения Богу.
  rationale: Текст прямо говорит, что совершённое ими было сделано «для Меня», но перевод не расширяет это утверждение до одобрения всех их целей или до особых отношений с Богом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Формула «Владыка ГОСПОДЬ» сохраняет различие между אֲדֹנָי и יהוה; прописные буквы отмечают передачу священного имени. Необычное утверждение о том, что языческий царь и его войско сделали дело для Бога, сохранено без богословского сглаживания.
