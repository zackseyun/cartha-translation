  text: וְ/לֹ֣א יִֽהְיֶה עוֹד֩ לְ/בֵ֨ית יִשְׂרָאֵ֤ל לְ/מִבְטָח֙ מַזְכִּ֣יר עָוֺ֔ן בִּ/פְנוֹתָ֖/ם אַחֲרֵי/הֶ֑ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/016.yaml
  text: And it will no longer be for the house of Israel a source of confidence[a], bringing iniquity to remembrance when they turn after them[c][b]; then they will know that I am the Lord GOD.
translation:
  language: ru
  text: И Египет больше не будет для дома Израиля опорой[a], напоминающей о его вине[b], когда они обращаются к египтянам; и тогда они узнают, что Я — Господь Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, на что можно положиться», «источником уверенности» или «безопасностью». Еврейское слово обозначает то, на что полагаются ради безопасности.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское עָוֺן может означать «вина», «беззаконие», «грех», а иногда и последствие или наказание за вину.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «Господь Яхве» (אֲדֹנָי יְהוִה); Яхве — передача личного имени Бога יהוה.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה עוֹד
  choice: больше не будет
  rationale: 'Естественно передаёт отрицание, imperfect глагола היה и עוֹד: прежнее положение прекратится и не продолжится в будущем.'
- source_word: לְבֵית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Сохраняет библейское собирательное обозначение народа и уместно передаёт ל в именной конструкции.
- source_word: לְמִבְטָח
  choice: опорой
  rationale: מִבְטָח обозначает то, на что полагаются ради безопасности. «Опора» естественно выражает здесь предмет политического доверия, не сводя значение к внутреннему чувству уверенности.
- source_word: מַזְכִּיר עָוֺן
  choice: напоминающей о его вине
  rationale: Причастие породы Hiphil от זכר передаёт причинное значение «заставлять помнить, напоминать». Местоимение «его» соотносит вину с домом Израиля, что ясно из контекста, но сама многозначность עָוֺן отмечена в сноске.
- source_word: בִּפְנוֹתָם אַחֲרֵיהֶם
  choice: когда они обращаются к египтянам
  rationale: Инфинитивная конструкция с בְּ имеет временное значение, а פנה אחרי в данном контексте выражает обращение вслед за Египтом как к объекту политической надежды. Повтор существительного устраняет неясность русского местоимения при разных числах референтов.
- source_word: וְיָדְעוּ
  choice: и тогда они узнают
  rationale: «И» сохраняет союз, а «тогда» естественно передаёт контекстуальный результат, не превращая его в более сильную причинную связь.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» отличает אֲדֹנָי от личного имени יהוה, переданного как «Яхве», и позволяет сохранить оба элемента составного титула без неестественного повтора «Господь Господь».
theological_decisions:
- issue: Предмет ошибочного упования Израиля
  choice: Египет как «опора» дома Израиля
  alternative: «источник уверенности» или «безопасность»
  rationale: Формулировка сохраняет осуждение зависимости Израиля от иностранной державы, но не добавляет прямого утверждения о характере этой зависимости сверх контекста.
- issue: Значение עָוֺן
  choice: вина
  alternative: беззаконие; грех; наказание за вину
  rationale: В контексте обращение к Египту обнаруживает виновность Израиля. «Вина» сохраняет как нравственную, так и объективную сторону понятия, а альтернативы отмечены в сноске.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Так сохраняются и титул אֲדֹנָי, и личное заветное имя יהוה без их слияния; формулировка не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к еврейскому, но местоименное «к ним» заменено на «к египтянам» ради ясности. Слово «опора» понятно широкому читателю и сохраняет образ ошибочного политического упования.
