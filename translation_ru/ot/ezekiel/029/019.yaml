base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/019.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am giving the land of Egypt to Nebuchadnezzar king of Babylon, and he will carry off its multitude, plunder its spoil, and seize its booty; and it will be wages for his army.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Вот, Я отдаю землю Египта Навуходоносору, царю Вавилона. Он унесёт её богатства[a], захватит её добычу и разграбит её богатства; это станет платой его войску».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её множество» или «её изобилие»; в контексте разграбления, вероятно, имеются в виду богатства и ресурсы Египта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим пророчеством.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественно и узнаваемо передаёт стандартную пророческую формулу вестника.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יְהוָה и не создаёт сочетания «Господь Господь».
- source_word: הִנְנִי נֹתֵן
  choice: Вот, Я отдаю
  rationale: «Вот» сохраняет торжественный указатель объявления, а настоящее время передаёт близость и несомненность действия, выраженную конструкцией с причастием.
- source_word: אֶרֶץ מִצְרָיִם
  choice: землю Египта
  rationale: Сохраняет конкретное территориальное значение אֶרֶץ.
- source_word: וְנָשָׂא הֲמֹנָהּ
  choice: Он унесёт её богатство
  rationale: הָמוֹן может означать множество, изобилие или богатство; в контексте добычи и платы войску экономический смысл наиболее вероятен, а неоднозначность отмечена в сноске.
- source_word: וְשָׁלַל שְׁלָלָהּ
  choice: разграбит её добычу
  rationale: Сохраняет военный смысл и, насколько позволяет естественный русский язык, родственную связь глагола и существительного.
- source_word: וּבָזַז בִּזָּהּ
  choice: захватит её трофеи
  rationale: Передаёт второй параллельный оборот о насильственном присвоении добычи, избегая неестественного русского повтора.
- source_word: וְהָיְתָה שָׂכָר לְחֵילוֹ
  choice: это станет платой его войску
  rationale: שָׂכָר означает плату или вознаграждение, а חַיִל здесь обозначает военную силу, то есть войско.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יְהוָה, сохраняя явное присутствие божественного имени без конфессионального истолкования.
- issue: Неоднозначность הֲמֹנָהּ
  choice: богатство с примечанием
  alternative: множество / изобилие
  rationale: Контекст военной добычи и вознаграждения поддерживает значение «богатство», однако лексическая широта слова не устраняется и прямо отмечается.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «так говорит» и указатель «вот» сохраняют торжественность без архаизации; синтаксис разделён на два предложения для ясности.
