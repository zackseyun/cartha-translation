  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י מֵבִ֥יא עָלַ֖יִ/ךְ חָ֑רֶב וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ אָדָ֥ם וּ/בְהֵמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am bringing a sword against you[b], and I will cut off from you man and beast.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Вот, Я наведу на тебя меч[a] и истреблю у тебя людей и скот[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Меч» здесь может обозначать не только оружие, но и войну как орудие суда.
    reason: lexical_alternative
  - marker: b
    text: «Люди и скот» — устойчивая формула суда, охватывающего человеческое население и животных.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственный переход от предшествующего обвинения к объявлению суда.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для современного русского языка и торжественная передача устойчивой пророческой формулы.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה, не сливая два элемента выражения.
- source_word: הִנְנִי מֵבִיא
  choice: Вот, Я наведу
  rationale: הִנְנִי вводит торжественное и подчёркнутое объявление, а причастие מֵבִיא в этой конструкции выражает близкое и решённое действие. Русское будущее звучит естественнее, чем буквальное «Я навожу».
- source_word: עָלַיִךְ חָרֶב
  choice: на тебя меч
  rationale: Сочетание с על обозначает направленный против адресата суд; «навести меч» сохраняет образ оружия и естественно звучит по-русски.
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: и истреблю у тебя
  rationale: Каузативная форма כרת означает устранить, отсечь или уничтожить. В контексте людей и скота «истреблю у тебя» ясно передаёт гибель и удаление из земли.
- source_word: אָדָם וּבְהֵמָה
  choice: и людей, и скот
  rationale: אָדָם здесь имеет собирательное значение «люди», а בְּהֵמָה обозначает прежде всего домашних животных. Парная конструкция «и …, и …» передаёт всеохватность суда.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант сохраняет различие между титулом אֲדֹנָי и личным именем יהוה. Традиционное «Господь Бог» привычно, но скрывает наличие имени в исходном тексте.
- issue: Образ меча как орудия суда
  choice: сохранить буквальный образ «меч»
  alternative: передать как «войну» или «военное разорение»
  rationale: В тексте прямо назван חֶרֶב. Этот образ может метонимически включать войну и её последствия, однако перевод не должен устранять образную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Архаичное «се» заменено на понятное «вот»; сохранены краткость, параллелизм и образность еврейского текста. Обращение в еврейском тексте стоит в женском роде и относится к олицетворённому Египту; русское «тебя» рода не выражает.
