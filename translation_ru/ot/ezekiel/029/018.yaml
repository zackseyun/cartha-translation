  text: בֶּן אָדָ֗ם נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּ֠בֶל הֶעֱבִ֨יד אֶת חֵיל֜/וֹ עֲבֹדָ֤ה גְדֹלָה֙ אֶל צֹ֔ר כָּל רֹ֣אשׁ מֻקְרָ֔ח וְ/כָל כָּתֵ֖ף מְרוּטָ֑ה וְ֠/שָׂכָר לֹא הָ֨יָה ל֤/וֹ וּ/לְ/חֵיל/וֹ֙ מִ/צֹּ֔ר עַל הָ/עֲבֹדָ֖ה אֲשֶׁר עָבַ֥ד עָלֶֽי/הָ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/018.yaml
  text: Son of man[a], Nebuchadnezzar king of Babylon made his army labor greatly against Tyre; every head was made bald and every shoulder was rubbed bare[c][b], yet there was no pay for him or for his army from Tyre for the labor that he had performed against it.
translation:
  language: ru
  text: 'Сын человеческий[a], Навуходоносор, царь Вавилона, заставил своё войско тяжко трудиться против Тира: у всех облысели головы и у всех были стёрты плечи[b]. Но ни он, ни его войско не получили от Тира платы за труд, который он совершил против него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Смертный». Буквально: «сын человека»; это обычное обращение к Иезекиилю.'
    reason: lexical_alternative
  - marker: b
    text: Облысевшие головы и стёртые плечи, вероятно, указывают на физические тяготы осадных работ.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранена характерная для книги Иезекииля формула обращения и её повторяющаяся литературная функция; буквальное значение пояснено в сноске.
- source_word: הֶעֱבִיד אֶת חֵילוֹ
  choice: заставил своё войско тяжко трудиться
  rationale: 'Передана каузативная форма глагола: Навуходоносор заставил войско выполнять тяжёлую работу.'
- source_word: עֲבֹדָה גְדֹלָה
  choice: тяжко трудиться
  rationale: Естественная русская передача большого и изнурительного труда с сохранением его интенсивности.
- source_word: אֶל צֹר
  choice: против Тира
  rationale: В военном контексте предлог выражает враждебную направленность действий.
- source_word: כָּל רֹאשׁ מֻקְרָח
  choice: у всех облысели головы
  rationale: Передан результат изнурительной осадной работы без добавления не выраженной прямо причины облысения.
- source_word: כָל כָּתֵף מְרוּטָה
  choice: у всех были стёрты плечи
  rationale: Фраза передаёт физическое истирание и оголение плеч вследствие тяжёлого труда.
- source_word: שָׂכָר
  choice: плата
  rationale: В контексте труда и возмещения слово обозначает причитающуюся оплату или награду.
- source_word: מִצֹּר
  choice: от Тира
  rationale: Сохранена исходная формулировка об отсутствии платы, полученной от Тира.
- source_word: עַל הָעֲבֹדָה אֲשֶׁר עָבַד עָלֶיהָ
  choice: за труд, который он совершил против него
  rationale: Переданы основание для платы и враждебная направленность труда против города; местоимение относится к Тиру.
