base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/010.yaml
  text: Therefore[a], behold, I am against you and against your Nile channels, and I will make the land of Egypt ruins, a desolation laid waste, from Migdol to Syene[c][b], as far as the border of Cush.
translation:
  language: ru
  text: Поэтому вот, Я — против тебя и против твоих рукавов Нила[a]. Я обращу землю Египта в развалины — в разорение и запустение, от Мигдола до Сиены[b], вплоть до границы Куша[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против твоих рек». В египетском контексте еврейское слово обычно обозначает Нил, его рукава или каналы.'
    reason: lexical_alternative
  - marker: b
    text: Сиена — древний город близ современного Асуана, у южной окраины Египта.
    reason: cultural_note
  - marker: c
    text: Куш — область к югу от Египта, обычно связываемая с Нубией; это название не следует отождествлять исключительно с территорией современной Эфиопии.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим пророчеством. Формула «так говорит Господь» в данном стихе отсутствует и потому не должна добавляться.
- source_word: הִנְנִי אֵלֶיךָ
  choice: вот, Я — против тебя
  rationale: Сохраняет торжественную пророческую формулу и ясно выражает Божье противостояние адресату.
- source_word: יְאֹרֶיךָ
  choice: твои рукава Нила
  rationale: В египетском контексте יְאֹר обозначает Нил, его рукава или каналы; «рукава Нила» естественно по-русски и сохраняет множественное число.
- source_word: וְנָתַתִּי אֶת אֶרֶץ מִצְרַיִם
  choice: Я превращу землю Египта
  rationale: 'Глагол נתן с последующим обозначением состояния имеет здесь результативное значение: Бог сделает землю опустошённой.'
- source_word: לְחָרְבוֹת חֹרֶב שְׁמָמָה
  choice: в развалины, в опустошённую пустыню
  rationale: Передаёт нагромождение близких по смыслу слов, усиливающее картину полного разорения, без сведения их к одному понятию.
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: от Мигдола до Сиены
  rationale: Сохраняет древние географические названия; конструкция понимается как указание на протяжённость Египта от севера к югу.
- source_word: וְעַד גְּבוּל כּוּשׁ
  choice: вплоть до границы Куша
  rationale: Куш сохранён как древнее региональное название, чтобы не создавать ложного тождества с современным государством Эфиопия.
