  text: בַּ/יּ֣וֹם הַ/ה֗וּא אַצְמִ֤יחַ קֶ֨רֶן֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל וּ/לְ/ךָ֛ אֶתֵּ֥ן פִּתְחֽוֹן פֶּ֖ה בְּ/תוֹכָ֑/ם וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/021.yaml
  text: On that day I will cause a horn to sprout for the house of Israel[a], and I will give you an opening of the mouth among them[b], and they will know that I am Yahweh.
translation:
  language: ru
  text: В тот день Я дам рогу произрасти для дома Израиля[a] и дам тебе возможность говорить среди них[b]. И они узнают, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я взращу рог»; рог здесь — образ силы, достоинства или возвышения дома Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дам тебе открытие уст». Это еврейское выражение означает, что пророку будет дана возможность или позволение говорить; вероятно, оно перекликается с прежним ограничением речи Иезекииля.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественно передаёт обычное пророческое указание времени, сохраняя его определённость.
- source_word: אַצְמִיחַ
  choice: Я взращу
  rationale: Каузативная форма глагола צמח означает «дать вырасти, взрастить». Выбор сохраняет образ произрастания и не заменяет его истолкованием «воздвигну».
- source_word: קֶרֶן
  choice: рог
  rationale: Сохранён конкретный образ исходного текста. Рог может обозначать силу, достоинство или возвышение, но перевод не сводит многозначную метафору к одному отвлечённому понятию.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Сохранено устойчивое национально-заветное выражение «дом Израиля», а не упрощённое «для Израиля».
- source_word: וּלְךָ אֶתֵּן פִּתְחוֹן פֶּה
  choice: и дам тебе возможность открыть уста
  rationale: Передаёт обращение к Иезекиилю и еврейскую идиому «открытие уст» на понятном современном русском, сохраняя в формулировке образ уст.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Естественно обозначает речь пророка в среде народа, не утяжеляя фразу оборотом «посреди них».
- source_word: וְיָדְעוּ
  choice: И они узнают
  rationale: Сохранён итоговый предикативный оборот; местоимение естественно относится к тем, среди кого будет говорить пророк.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Смысл метафоры «рог»
  choice: Сохранить слово «рог» как образ силы, достоинства или возвышения Израиля.
  alternative: Перевести истолковательно как «сила» либо прямо отнести образ к конкретной мессианской личности.
  rationale: Сам стих не требует однозначно отождествлять рог с определённым лицом. Сохранение метафоры не устраняет возможного царского или мессианского звучания, но и не навязывает его.
- issue: Значение פִּתְחוֹן פֶּה применительно к Иезекиилю
  choice: Передать как дарованную возможность открыть уста, не уточняя характер и продолжительность этой возможности.
  alternative: Истолковать как окончательное избавление от немоты, свободу речи или особую смелость говорить.
  rationale: Выражение, вероятно, перекликается с прежним ограничением речи пророка, однако данный стих не уточняет, идёт ли речь об окончательной перемене или об отдельной возможности пророчествовать.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим звучанием. Сохранены ключевые образы «рог», «взращу» и «открыть уста», но синтаксис сделан понятным обычному современному читателю; архаизмы и конфессионально окрашенные толкования не вводятся.
