    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устоявшееся и прозрачное обращение к Иезекиилю, сохраняющее мужской род, форму единственного числа и образность еврейского выражения.
- source_word: שִׂים פָּנֶיךָ
  choice: обрати лицо твоё
  rationale: Передаёт буквальный образ намеренного направления лица; в сочетании с «против» выражает направленность пророческого обличения.
- source_word: עַל
  choice: против
  rationale: В контексте суда предлог имеет враждебно-направленное значение как при обращении лица, так и при пророчестве.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Нормативная русская передача египетского царского титула; винительный падеж обусловлен предлогом «против».
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царя Египта
  rationale: Аппозиционно определяет фараона и естественно звучит по-русски.
- source_word: וְהִנָּבֵא
  choice: и пророчествуй
  rationale: Прямо передаёт императив глагола נבא и сохраняет формулу пророческого поручения.
- source_word: עָלָיו
  choice: против него
  rationale: В пророчестве суда выражение имеет не просто тематическое, а обличительное, направленное против адресата значение.
- source_word: מִצְרַיִם כֻּלָּהּ
  choice: всего Египта
  rationale: Передаёт полный охват страны и народа; форма естественна после повторённого предлога «против».
theological_decisions:
- issue: Значение обращения בֶּן אָדָם
  choice: Сын человеческий
  alternative: Смертный; человек
  rationale: Основной текст сохраняет традиционную форму и исходную метафору, а примечание сообщает возможные смысловые передачи, не отождествляя автоматически это обращение к Иезекиилю с позднейшим титульным употреблением.
translation_notes:
