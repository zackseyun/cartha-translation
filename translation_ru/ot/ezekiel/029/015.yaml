base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/015.yaml
  text: It will be the lowliest of the kingdoms[a], and it will no longer exalt itself above the nations; and I will diminish them[d][c][b], so that they will not rule over the nations.
translation:
  language: ru
  text: Египет станет самым униженным из царств[a] и уже не будет возвышаться над народами. Я сокращу их число[b], чтобы они не властвовали над народами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самым низким из царств». Еврейская конструкция сопоставляет Египет с другими царствами и указывает на его крайнее унижение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделаю их малочисленными». Множественное число относится к Египту как к совокупности его народа или сил.'
    reason: collective_reference
  - marker: c
    text: Буквально еврейский предлог означает «среди народов», но с глаголом «властвовать» речь идёт о господстве над ними.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמַּמְלָכוֹת תִּהְיֶה שְׁפָלָה
  choice: станет самым униженным среди царств
  rationale: Предлог מִן при прилагательном выражает сравнение с совокупностью царств, а שָׁפָל указывает не только на низкое положение, но и на униженность. Русская превосходная степень ясно передаёт смысл конструкции.
- source_word: וְלֹא תִתְנַשֵּׂא עוֹד עַל הַגּוֹיִם
  choice: и уже не будет возвышаться над народами
  rationale: Форма תִתְנַשֵּׂא допускает оттенок как возвышения, так и самовозвышения. Возвратный русский глагол «возвышаться» сохраняет эту смысловую широту, а «над народами» естественно передаёт עַל в значении превосходства.
- source_word: וְהִמְעַטְתִּים
  choice: Я сокращу их число
  rationale: Порода hифиль глагола מעט означает «сделать малым/малочисленным». Эта формулировка естественно передаёт конкретную идею уменьшения численности, тогда как множественное местоимение относится к Египту как к совокупности его жителей или сил.
- source_word: לְבִלְתִּי רְדוֹת בַּגּוֹיִם
  choice: чтобы они не властвовали над народами
  rationale: לְבִלְתִּי вводит предотвращаемый результат или цель, רדה означает господствовать или властвовать, а русское управление требует «властвовать над».
theological_decisions:
- issue: Переход от единственного числа, обозначающего Египет, к множественному
  choice: «Оно» об Египте как царстве, затем «их/они» о египтянах или египетской силе в совокупности
  alternative: Сгладить переход, везде называя «Египет» в единственном числе
  rationale: 'Смена числа присутствует в еврейском тексте и может быть значимой: Египет представлен сначала как царство, затем как коллектив. Перевод сохраняет её, а примечание разъясняет.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Властвовать» сохраняет возвышенный пророческий регистр без архаизации; «сокращу их число» звучит естественнее буквального «сделаю их немногими».
