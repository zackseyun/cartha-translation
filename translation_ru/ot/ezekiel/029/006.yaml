source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ כָּל יֹשְׁבֵ֣י מִצְרַ֔יִם כִּ֖י אֲנִ֣י יְהוָ֑ה יַ֧עַן הֱיוֹתָ֛/ם מִשְׁעֶ֥נֶת קָנֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/006.yaml
  text: Then all the inhabitants of Egypt will know that I am Yahweh[a], because they were a staff of reed to the house of Israel.
translation:
  language: ru
  text: Тогда все жители Египта узнают, что Я — Яхве, потому что они были опорой из тростника[a] для дома Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тростниковым посохом». Речь идёт об опоре, которая слишком слаба, чтобы выдержать вес.'
    reason: Лексическая альтернатива и пояснение образа מִשְׁעֶנֶת קָנֶה.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Тогда ... узнают
  rationale: В пророческом контексте союз וְ продвигает последовательность и указывает на результат суда; будущее «узнают» естественно передаёт формулу узнавания у Иезекииля.
- source_word: כָּל יֹשְׁבֵי מִצְרַיִם
  choice: все жители Египта
  rationale: Передаёт собирательное значение буквально и естественно для современного русского языка.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: Сохраняет характерную для Иезекииля формулу узнавания и передаёт личное имя יהוה транслитерацией.
- source_word: יַעַן הֱיוֹתָם
  choice: потому что они были
  rationale: יַעַן вводит основание суда, а инфинитивная конструкция с местоименным суффиксом естественно преобразуется в русское личное предложение.
- source_word: מִשְׁעֶנֶת קָנֶה
  choice: тростниковой опорой
  rationale: מִשְׁעֶנֶת обозначает то, на что опираются; сочетание с קָנֶה создаёт образ ненадёжной опоры. «Тростниковая опора» сохраняет метафору и звучит естественнее буквального «посох из тростника» в данной синтаксической позиции.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Предлог לְ выражает отношение или предназначение; «для» естественно показывает, кому Египет служил мнимой опорой, сохраняя выражение «дом Израиля».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон. «Яхве» сохраняет личное имя Бога и не заменяет его титулом.
- issue: Характер поддержки, оказываемой Египтом Израилю
  choice: Сохранён образ «тростниковой опоры» без добавления слова «ненадёжной» в основной текст
  alternative: ненадёжная опора; тростниковый посох
  rationale: Контекст подразумевает слабость и ненадёжность, но данный стих выражает это метафорой; явное толкование вынесено в сноску, чтобы не устранять образную напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Синтаксис ясен для широкого читателя; традиционное библейское выражение «дом Израиля» сохранено.
