base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/013.yaml
  text: 'For thus says the Lord GOD: At the end of forty years I will gather Egypt from the peoples among whom they were scattered[a].'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: «По окончании сорока лет Я соберу Египет из народов, среди которых были рассеяны египтяне[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переданное как «народы», может также означать «нации».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет причинно-пояснительную связь с предыдущим высказыванием и соответствует возвышенному, но современному литературному регистру.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная русская форма стандартной пророческой формулы в настоящем времени, соответствующая еврейскому перфекту речи.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента составного божественного титула: אֲדֹנָי как «Владыка», а личное имя יהוה как «Яхве», не создавая неестественного повтора «Господь Господь».'
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: по окончании сорока лет
  rationale: Точно обозначает завершение указанного срока и звучит естественно по-русски.
- source_word: אֲקַבֵּץ
  choice: Я соберу
  rationale: Сохраняет прямое значение קבץ — собрать воедино, здесь в контексте возвращения рассеянного народа.
- source_word: אֶת מִצְרַיִם
  choice: Египет
  rationale: Сохраняет еврейское название страны, метонимически обозначающее её народ как единое целое.
- source_word: מִן הָעַמִּים
  choice: из народов
  rationale: Буквально и естественно передаёт множественное число עַמִּים; вариант «из среды народов» возможен, но менее лаконичен.
- source_word: אֲשֶׁר נָפֹצוּ שָׁמָּה
  choice: среди которых были рассеяны египтяне
  rationale: Передаёт множественное число еврейского глагола и локативный смысл שָׁמָּה. Слово «египтяне» делает понятным множественный субъект, подразумеваемый собирательным названием «Египет».
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, сохраняя открыто присутствующее в исходном тексте имя без конфессионального истолкования.
- issue: Собирательное значение названия «Египет» и множественное число נָפֹצוּ
  choice: «Египет» в главной части и «египтяне» в относительной
  alternative: «египтян… они»
  rationale: Так сохраняется формальное употребление названия страны в качестве объекта и одновременно ясно передаётся множественное число глагола, относящееся к рассеянному населению.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся близким к еврейскому, но множественный субъект נָפֹצוּ выражен словом «египтяне», чтобы избежать ненормативного согласования с единственным числом «Египет».
