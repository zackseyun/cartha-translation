source:
  edition: WLC
  text: לֹ֤א תַעֲבָר בָּ/הּ֙ רֶ֣גֶל אָדָ֔ם וְ/רֶ֥גֶל בְּהֵמָ֖ה לֹ֣א תַעֲבָר בָּ֑/הּ וְ/לֹ֥א תֵשֵׁ֖ב אַרְבָּעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/011.yaml
  text: No human foot will pass through it[a], and no animal foot will pass through it; and it will not be inhabited for forty years.
translation:
  language: ru
  text: Не пройдёт по ней нога человека[a], не пройдёт по ней и нога животного, и сорок лет она будет необитаема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть по ней не пройдёт ни один человек; буквально: «нога человека».'
    reason: Пояснение собирательного значения буквального еврейского оборота.
lexical_decisions:
- source_word: תַעֲבָר בָּהּ
  choice: пройдёт по ней
  rationale: Глагол עבר с предлогом ב обозначает движение по территории или через неё. «Пройдёт по ней» естественно по-русски и сохраняет образ пересечения земли.
- source_word: רֶגֶל אָדָם
  choice: нога человека
  rationale: Буквальное выражение имеет собирательный смысл и обозначает присутствие или передвижение людей вообще; «человека» здесь относится к любому человеку, а не только к мужчине.
- source_word: רֶגֶל בְּהֵמָה
  choice: нога животного
  rationale: Сохранён параллелизм с «ногой человека»; «животное» ясно и нейтрально передаёт общее значение בְּהֵמָה.
- source_word: לֹא תֵשֵׁב
  choice: будет необитаема
  rationale: В отношении земли ישב означает быть населённой или обитаемой. Русская форма передаёт смысл естественно, а женский род согласуется с подразумеваемой землёй Египта.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямое обозначение продолжительности периода.
theological_decisions:
- issue: Обобщающее значение אָדָם
  choice: человека — в значении любого представителя человечества
  alternative: мужчины
  rationale: Контекст говорит об отсутствии всякого человеческого движения по земле, а не только мужчин; при этом образ «ноги человека» сохранён.
translation_notes:
  register: Современный литературный русский язык; сохранены поэтический параллелизм и образ «ноги человека / ноги животного». Формулировка торжественная, но понятная обычному читателю.
