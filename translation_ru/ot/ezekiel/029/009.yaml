base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/009.yaml
  text: And the land of Egypt will become a desolation and a waste[a], and they will know that I am Yahweh, because he said, ‘The Nile is mine, and I made it.’
translation:
  language: ru
  text: 'И станет земля Египта опустошённой и разорённой, и они узнают, что Я — Яхве, потому что он сказал: «Нил[a] — мой, и я сам его сделал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «река»; в контексте Египта имеется в виду Нил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: и станет
  rationale: Форма в пророческом контексте выражает будущее наступление состояния; «станет» передаёт переход к нему.
- source_word: אֶרֶץ מִצְרַיִם
  choice: земля Египетская
  rationale: Сохраняет конкретное территориальное значение אֶרֶץ и звучит естественно в возвышенной современной русской библейской прозе.
- source_word: לִשְׁמָמָה וְחָרְבָּה
  choice: безлюдной и разорённой
  rationale: Парные слова описывают запустение и разорение как итог суда; сочетание сохраняет усиление и остаётся естественным по-русски.
- source_word: וְיָדְעוּ
  choice: и узнают они
  rationale: Сохраняет неопределённый субъект во множественном числе и характерную для Иезекииля формулу узнавания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: יַעַן
  choice: потому что
  rationale: Ясно вводит основание объявленного суда.
- source_word: יְאֹר
  choice: Нил
  rationale: В египетском контексте слово обозначает Нил; буквальное значение отмечено в сноске.
- source_word: לִי
  choice: принадлежит мне
  rationale: Естественно передаёт притяжательную конструкцию и самоуверенное заявление говорящего.
- source_word: וַאֲנִי עָשִׂיתִי
  choice: и я сам его создал
  rationale: «Сам» передаёт эмфатическое независимое местоимение אֲנִי; подразумеваемое дополнение восстановлено по контексту. «Создал» естественно выражает притязание на происхождение Нила, не устраняя хвастливого характера речи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не смешивает с титулом.
- issue: Притязание фараона в словах וַאֲנִי עָשִׂיתִי
  choice: «и я сам его создал» как цитируемое хвастливое заявление
  alternative: «и я сделал его»
  rationale: 'Перевод сохраняет богословски значимое притязание говорящего, не подтверждая его истинность: оно дано как причина суда внутри прямой речи.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «узнают они» поддерживает ритм формулы, не создавая архаической тяжеловесности.
