  text: וְ/נָתַתִּ֣י אֶת אֶרֶץ֩ מִצְרַ֨יִם שְׁמָמָ֜ה בְּ/ת֣וֹךְ אֲרָצ֣וֹת נְשַׁמּ֗וֹת וְ/עָרֶ֨י/הָ֙ בְּ/ת֨וֹךְ עָרִ֤ים מָֽחֳרָבוֹת֙ תִּֽהְיֶ֣יןָ שְׁמָמָ֔ה אַרְבָּעִ֖ים שָׁנָ֑ה וַ/הֲפִצֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְֽ/זֵרִיתִ֖י/ם בָּ/אֲרָצֽוֹת־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/012.yaml
  text: And I will make the land of Egypt a desolation among desolated lands[a], and her cities will be a desolation among ruined cities for forty years[b]; and I will scatter Egypt among the nations and disperse them through the lands.
translation:
  language: ru
  text: Я обращу землю Египта в запустение среди опустошённых земель, и её города среди разрушенных городов будут в запустении сорок лет[a]. Я рассею Египет среди народов и развею их по странам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди разорённых земель» и «среди разорённых городов». В параллельных частях еврейского текста употреблены близкие по смыслу слова, обозначающие опустошение и разрушение.'
    reason: lexical_alternative
  - marker: b
    text: То есть жителей Египта. Еврейский текст переходит от названия страны «Египет» к местоимению множественного числа «их».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Я превращу
  rationale: В сочетании с дополнением и שְׁמָמָה глагол נתן означает привести что-либо в определённое состояние; «превращу … в» естественно передаёт эту результативность.
- source_word: אֶרֶץ מִצְרַיִם
  choice: землю Египта
  rationale: Сохранено явное территориальное обозначение אֶרֶץ, существенное в пророчестве об опустошении страны.
- source_word: שְׁמָמָה
  choice: в пустыню / пустыней
  rationale: Существительное обозначает опустошённое, безлюдное место. «Пустыня» сохраняет именную форму и традиционно-пророческую образность, не ослабляя тяжести суда.
- source_word: בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת
  choice: среди опустошённых земель
  rationale: בְּתוֹךְ здесь естественно передаётся как «среди», а причастие נְשַׁמּוֹת — как «опустошённых».
- source_word: וְעָרֶיהָ
  choice: и её города
  rationale: Местоимение сохраняет связь с землёй Египта и женский род исходного обозначения, при этом звучит естественно по-русски.
- source_word: בְּתוֹךְ עָרִים מָחֳרָבוֹת
  choice: среди разрушенных городов
  rationale: מָחֳרָבוֹת указывает на города, обращённые в развалины; «разрушенных» ясно и современно передаёт образ.
- source_word: תִּהְיֶיןָ שְׁמָמָה
  choice: станут пустыней
  rationale: Сочетание היה с существительным выражает наступившее состояние; перевод сохраняет результативный смысл и параллель с первой частью стиха.
- source_word: אַרְבָּעִים שָׁנָה
  choice: на сорок лет
  rationale: Предлог «на» естественно обозначает срок, в течение которого сохраняется указанное состояние.
- source_word: וַהֲפִצֹתִי
  choice: Я рассею
  rationale: Порода hифиль глагола פוץ выражает принудительное рассеяние людей.
- source_word: אֶת מִצְרַיִם
  choice: Египет
  rationale: Сохранено собственное имя, как в еврейском тексте; далее множественное «их» показывает, что метонимически имеются в виду жители Египта.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Обычное и контекстуально точное соответствие для גּוֹיִם в пророчестве о рассеянии.
- source_word: וְזֵרִיתִים בָּאֲרָצוֹת
  choice: и развею их по разным странам
  rationale: זרה может означать «веять, развеивать, рассеивать». «Развею» сохраняет образность и позволяет избежать полного повтора, а «по разным странам» естественно выражает распределение по множеству земель.
theological_decisions:
- issue: Кого обозначает «Египет» в высказывании о рассеянии
  choice: Сохранить «Египет», а следующее множественное местоимение «их» пояснить сноской как указание на египтян.
  alternative: 'Передать прямо: «рассею египтян … и развею их».'
  rationale: Еврейский текст переходит от топонима מִצְרַיִם к множественному местоименному суффиксу. Сохранение этого перехода передаёт метонимию и реальную грамматическую напряжённость источника, не скрывая смысла от читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм сохранён, но порядок слов слегка приспособлен к русской ясности. «Пустыня» здесь означает опустошённое, безлюдное место, а не обязательно природную песчаную пустыню.
