source:
  edition: WLC
  text: בַּ/שָּׁנָה֙ הָ/עֲשִׂירִ֔ית בָּ/עֲשִׂרִ֕י בִּ/שְׁנֵ֥ים עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/001.yaml
  text: In the tenth year[a], in the tenth month, on the twelfth day of the month, the word of Yahweh came to me, saying,
translation:
  language: ru
  text: 'В десятый год, в десятый месяц, в двенадцатый день месяца было ко мне слово Яхве:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָעֲשִׂירִית
  choice: В десятый год
  rationale: Еврейский текст не называет точку отсчёта; поэтому она не добавлена в перевод.
- source_word: בָּעֲשִׂרִי
  choice: в десятый месяц
  rationale: Слово «месяц» подразумевается формулой датировки и ясно из последующего לַחֹדֶשׁ; в русском оно необходимо для естественности.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ
  choice: в двенадцатый день месяца
  rationale: Слово «день» подразумевается в еврейской формуле даты и естественно восполняется по-русски.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: было ко мне слово Яхве
  rationale: Сохранена традиционная для русской библейской речи пророческая формула, близкая к синтаксису оригинала и понятная современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, выраженное тетраграмматоном, без замены титулом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит содержание речи, начинающееся в следующем стихе, и избегает тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал содержит собственное имя Бога; форма «Яхве» представляет общепринятую научную реконструкцию произношения и не заменяет имя титулом.
translation_notes:
  register: Современный литературный русский с достоинством библейской пророческой речи. Синтаксис датировки сохранён, а завершающее לֵאמֹר передано пунктуационно, поскольку далее следует прямая речь.
