  text: בְּ/תָפְשָׂ֨/ם בְּ/ךָ֤ ב/כפ/ך תֵּר֔וֹץ וּ/בָקַעְתָּ֥ לָ/הֶ֖ם כָּל כָּתֵ֑ף וּ/בְ/הִֽשָּׁעֲנָ֤/ם עָלֶ֨י/ךָ֙ תִּשָּׁבֵ֔ר וְ/הַעֲמַדְתָּ֥ לָ/הֶ֖ם כָּל מָתְנָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/007.yaml
  text: When they took hold of you with their hand[a], you were crushed, and you split open every shoulder for them; and when they leaned on you, you were broken[b], and you made all their hips stand unsteadily.
translation:
  language: ru
  text: Когда они хватали тебя за руку[a], ты сокрушался и рассекал им все плечи; когда они опирались на тебя, ты ломался, и у всех них дрожали бёдра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за твою ладонь» или «за твою руку». В образе тростникового посоха возможно также понимание: «брали тебя в руку».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ты заставлял стоять все их бёдра (или: чресла)». Значение этого необычного выражения не вполне ясно; в контексте оно может обозначать потерю устойчивости, когда опора ломается.'
    reason: translation_clarity
lexical_decisions:
- source_word: בְּתָפְשָׂם בְּךָ
  choice: когда они хватали тебя
  rationale: Инфинитивная конструкция с בְּ выражает одновременность; глагол תפש сохраняет конкретный образ людей, хватающихся за тростниковый посох.
- source_word: בכפך
  choice: за руку
  rationale: Суффикс 2-го лица в масоретском тексте буквально указывает на «твою ладонь/руку». В основном тексте сохранено это грамматическое чтение, а обусловленное образом тростникового посоха понимание «брали тебя в руку» отмечено в сноске.
- source_word: תֵּרוֹץ
  choice: ты сокрушался
  rationale: Нифаль от רצץ означает быть сокрушённым, раздробленным. Возвратная форма естественна по-русски и отличает этот глагол от последующего שבר.
- source_word: וּבָקַעְתָּ לָהֶם כָּל כָּתֵף
  choice: и раздирал им все плечи
  rationale: בקע передаёт раскалывание или рассечение; «раздирал» естественно описывает ранящее действие расщепившегося тростника. לָהֶם передано русской конструкцией «им», а коллективное כָּל כָּתֵף — «все плечи».
- source_word: וּבְהִשָּׁעֲנָם עָלֶיךָ
  choice: когда они опирались на тебя
  rationale: Сохранён буквальный телесный образ опоры на посох, без замены его отвлечённым толкованием «полагались на тебя».
- source_word: תִּשָּׁבֵר
  choice: ты ломался
  rationale: Нифаль от שבר прямо обозначает разрушение или перелом опоры; настоящее-прошедшее несовершенного вида по-русски передаёт повторяющийся характер описания.
- source_word: וְהַעֲמַדְתָּ לָהֶם כָּל מָתְנָיִם
  choice: и у всех них дрожали бёдра
  rationale: Буквальная конструкция «заставлял стоять все бёдра/чресла» по-русски непонятна; в контексте рухнувшей опоры она описывает потерю устойчивости. Перевод передаёт этот результат, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Физический образ Египта как ненадёжного тростникового посоха
  choice: 'Сохранить конкретные действия: «хватали», «опирались», «плечи», «бёдра».'
  alternative: 'Передать смысл отвлечённо: «полагались на тебя», «ты подвёл их».'
  rationale: Конкретная метафора сама выражает пророческое обвинение против ложной опоры; её не следует заранее заменять политическим или богословским толкованием.
- issue: Неясная формулировка о ладони в בכפך
  choice: 'Следовать согласному тексту и суффиксу 2-го лица: «за руку», указав контекстуальное понимание в сноске.'
  alternative: «Брали тебя в руку» или «своей рукой».
  rationale: Так сохраняется грамматическое свидетельство масоретского текста и одновременно не скрывается вероятное понимание образа тростникового посоха.
- issue: Значение заключительной конструкции с עמד
  choice: Передать контекстуальный результат как дрожь и потерю устойчивости, снабдив буквальной сноской.
  alternative: 'Формально перевести: «заставлял все их бёдра стоять».'
  rationale: Формальная калька затемняет смысл на русском. Контекст говорит о человеке, внезапно лишившемся опоры, но необычность еврейской формулировки должна оставаться видимой читателю через сноску.
translation_notes:
  register: Современный литературный русский язык с сохранением энергичного телесного образа пророческой речи. Архаичное «чресла» не вынесено в основной текст, но приведено как лексическая альтернатива в сноске. Параллельные глаголы רצץ и שבר намеренно разведены как «сокрушался» и «ломался».
