source:
  edition: WLC
  text: וְ/שַׁבְתִּי֙ אֶת שְׁב֣וּת מִצְרַ֔יִם וַ/הֲשִׁבֹתִ֤י אֹתָ/ם֙ אֶ֣רֶץ פַּתְר֔וֹס עַל אֶ֖רֶץ מְכֽוּרָתָ֑/ם וְ/הָ֥יוּ שָׁ֖ם מַמְלָכָ֥ה שְׁפָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/014.yaml
  text: And I will restore the fortunes of Egypt and bring them back to the land of Pathros[a], to the land of their origin[b], and there they will be a lowly kingdom.
translation:
  language: ru
  text: Я восстановлю благополучие Египта[a] и возвращу египтян в землю Патрос[b], землю их происхождения; там они станут малозначительным царством.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «верну пленников Египта» или «обращу плен Египта». Этот древнееврейский оборот может обозначать как возвращение из плена, так и восстановление прежнего положения в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: Патрос — область Верхнего Египта; здесь она названа землёй происхождения египтян.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת־שְׁבוּת מִצְרַיִם
  choice: Я восстановлю благополучие Египта
  rationale: Оборот שׁוּב שְׁבוּת часто означает восстановление прежнего благополучия или положения. Поскольку следующая фраза прямо говорит о возвращении людей, идиоматический перевод здесь передаёт более широкий смысл и избегает ненужного повтора.
- source_word: וַהֲשִׁבֹתִי אֹתָם
  choice: и возвращу египтян
  rationale: Каузативная форма глагола שׁוּב означает, что Бог вернёт их. Существительное «египтян» естественно уточняет местоимение и устраняет возможную для русского текста неясность.
- source_word: אֶרֶץ פַּתְרוֹס
  choice: в землю Патрос
  rationale: Сохранено слово אֶרֶץ («земля»), а географическое название передано транслитерацией.
- source_word: עַל אֶרֶץ מְכוּרָתָם
  choice: землю их происхождения
  rationale: מְכוּרָה обозначает место рождения или происхождения. В данном контексте оборот поясняет предшествующее название Патроса; русская аппозиция естественно передаёт эту связь.
- source_word: וְהָיוּ שָׁם
  choice: там они станут
  rationale: Глагол היה в контексте изменения положения естественно передаётся как «станут», а начальная позиция «там» сохраняет пространственный акцент.
- source_word: מַמְלָכָה שְׁפָלָה
  choice: малозначительным царством
  rationale: שָׁפָל указывает на низкое, приниженное положение. «Малозначительное царство» ясно выражает утрату политического веса, не внося идеи нравственного смирения.
theological_decisions:
- issue: Значение восстановительного оборота שׁוּב שְׁבוּת
  choice: восстановлю благополучие Египта
  alternative: верну пленников Египта / обращу плен Египта
  rationale: Оборот допускает более буквальное понимание, связанное с пленом, но в пророческой речи нередко означает общее восстановление положения. Следующая часть стиха отдельно сообщает о физическом возвращении, поэтому более широкое идиоматическое значение предпочтительно, а буквальная возможность сохранена в сноске.
- issue: Смысл определения שְׁפָלָה при слове «царство»
  choice: малозначительным царством
  alternative: униженным царством / слабым царством
  rationale: Перевод передаёт низкий политический статус Египта, не превращая характеристику его положения в утверждение о нравственном качестве или внутреннем смирении.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным пророческим звучанием. Синтаксис сохраняет последовательность обещаний оригинала, а точка с запятой отчётливо отделяет итоговое положение Египта от его возвращения.
