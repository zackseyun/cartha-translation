    text: Еврейское выражение, образованное от одного корня, буквально означает «говорит притчи»; речь может идти также об образной или загадочной речи.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: И сказал я
  rationale: Последовательная форма глагола продолжает повествование; инверсия сохраняет dignified prophetic register without archaizing excessively.
- source_word: אֲהָהּ
  choice: О
  rationale: Междометие выражает скорбь и тягостное недоумение; русское «О» естественно сочетается с обращением и не имеет победного оттенка.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт как титул אֲדֹנָי, так и личное имя יהוה, избегая сочетания «Господь Господь».
- source_word: הֵמָּה אֹמְרִים לִי
  choice: Они говорят обо мне
  rationale: В контексте לִי вероятно обозначает то, как люди отзываются об Иезекииле; буквальное «говорят мне» остаётся грамматически возможным и отмечено в сноске.
- source_word: הֲלֹא
  choice: Не … ли
  rationale: Русская вопросительная конструкция естественно передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: מְמַשֵּׁל מְשָׁלִים
  choice: притчами … говорит
  rationale: Однокоренная глагольно-именная конструкция означает произнесение притч, сравнений или иносказаний; формулировка сохраняет действие и допускаемую образность, не сужая смысл до загадок.
- source_word: הוּא
  choice: он
  rationale: Местоимение прямо указывает на Иезекииля в цитируемой речи.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Так различаются титул «Владыка» и собственное божественное имя Яхве без устранения имени или неестественного повтора.
- issue: Характер речи пророка в מְמַשֵּׁל מְשָׁלִים
  choice: Не притчами ли он говорит?
  alternative: Не тот ли он, кто изрекает притчи?; Не говорит ли он иносказаниями?
  rationale: Текст передаёт пренебрежительную реакцию слушателей на образную речь, но сам по себе не утверждает, что пророчество лишено ясного или буквального содержания.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Сохранены риторический вопрос, эмоциональное обращение и неоднозначность конструкции לִי; инверсия «сказал я» умеренно торжественна.
