source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמְר֣וּ אֵלֶ֔י/ךָ עַל מָ֖ה אַתָּ֣ה נֶאֱנָ֑ח וְ/אָמַרְתָּ֡ אֶל שְׁמוּעָ֣ה כִֽי בָאָ֡ה וְ/נָמֵ֣ס כָּל לֵב֩ וְ/רָפ֨וּ כָל יָדַ֜יִם וְ/כִהֲתָ֣ה כָל ר֗וּחַ וְ/כָל בִּרְכַּ֨יִם֙ תֵּלַ֣כְנָה מַּ֔יִם הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/012.yaml
  text: And it shall be[a], when they say to you, ‘Why are you groaning?’ that you shall say, ‘Because of the news, for it is coming.’ Then every heart will melt, all hands will grow weak, every spirit will faint, and all knees will run with water. Look, it is coming, and it will happen[b], declares the Lord GOD.
translation:
  language: ru
  text: 'И когда они спросят тебя: «Отчего ты стонешь?» — ответь: «Из-за вести[a], ведь она приближается». Тогда растает всякое сердце, ослабеют все руки, угаснет всякий дух, и все колени потекут водой[b]. Вот, она приближается, и это сбудется, — возвещает Владыка Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за сообщения»; древнееврейское слово может обозначать весть, слух или дошедшее известие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все колени потекут водой». Это яркий образ ужаса и полного обессиления; он может указывать на колени, ставшие словно вода, либо на утрату телесного контроля от страха.'
    reason: cultural_note
lexical_decisions:
- source_word: נֶאֱנָח
  choice: стонешь
  rationale: Причастие нифаля от אנח обозначает слышимый стон, выражающий скорбь; «стонешь» передаёт это сильнее и точнее, чем более лёгкое «вздыхаешь».
- source_word: שְׁמוּעָה
  choice: весть
  rationale: Слово обозначает доходящее известие или сообщение, здесь — страшную весть о грядущем бедствии. «Весть» естественно звучит в возвышенной современной прозе и сохраняет предмет последующего глагола женского рода.
- source_word: כִּי בָאָה
  choice: ведь она приближается
  rationale: Форма женского рода согласована со словом «весть». «Приближается» естественно передаёт образ уже идущей, неизбежно наступающей вести, не смешивая её полностью с самим событием.
- source_word: וְנָמֵס כָּל לֵב
  choice: растает всякое сердце
  rationale: Сохранён древнееврейский телесный образ утраты мужества; он понятен по-русски и не сводится к пояснительному «все лишатся храбрости».
- source_word: וְרָפוּ כָל יָדַיִם
  choice: ослабеют все руки
  rationale: Образ передаёт утрату сил и способности действовать; буквальная телесная метафора ясна современному читателю.
- source_word: וְכִהֲתָה כָל רוּחַ
  choice: угаснет всякий дух
  rationale: Глагол выражает помрачение или угасание, а רוּחַ здесь указывает на внутренний дух и решимость. Формулировка сохраняет образ, не уточняя его до одного лишь страха или уныния.
- source_word: וְכָל בִּרְכַּיִם תֵּלַכְנָה מַּיִם
  choice: по всем коленям потечёт вода
  rationale: Сохранён необычный и намеренно резкий древнееврейский образ. Его возможные оттенки — обессилевшие колени либо утрата телесного контроля от ужаса — вынесены в примечание, а не разрешены в основном тексте.
- source_word: הִנֵּה
  choice: вот
  rationale: Кратко и естественно передаёт указательное усиление и настоятельность частицы без архаического «се».
- source_word: וְנִהְיָתָה
  choice: и это сбудется
  rationale: Форма глагола היה подтверждает действительное наступление возвещённого. «Сбудется» подходит к пророческой вести и звучит естественно, не ослабляя уверенности.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и позволяет избежать неестественного сочетания двух форм слова «Господь».
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Исходный текст соединяет титул אֲדֹנָי с личным именем יהוה. Выбранный вариант различает их и не заменяет имя общим титулом, не добавляя конфессионального истолкования.
- issue: Соотношение вести и грядущего события
  choice: Сохранить грамматическую связь «она приближается» со словом «весть», а затем сказать «это сбудется» о возвещённом
  alternative: Везде передать безличным «это грядёт»
  rationale: Женский род בָאָה прямо отсылает к שְׁמוּעָה, однако заключительное וְנִהְיָתָה охватывает исполнение возвещённого. Формулировка сохраняет эту напряжённость и не отождествляет весть с бедствием без остатка.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для чтения вслух; сохранены повтор «все/всякое», телесные образы и резкость заключительного заверения. Архаизмы вроде «се» и «речение» не использованы.
