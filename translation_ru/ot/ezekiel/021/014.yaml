source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֖ה אָמַ֣ר אֲדֹנָ֑/י אֱמֹ֕ר חֶ֥רֶב חֶ֛רֶב הוּחַ֖דָּה וְ/גַם מְרוּטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/014.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Say, “A sword, a sword, sharpened and also polished.”’'
translation:
  language: ru
  text: 'Сын человеческий, пророчествуй и скажи: «Так говорит Господь: скажи: „Меч, меч наточен и отполирован[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начищен до блеска». Еврейское слово изображает гладкий, сверкающий клинок, приготовленный к употреблению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет буквальный образ и устойчивое обращение к Иезекиилю; в данном контексте обозначает смертного человека.
- source_word: הִנָּבֵא
  choice: пророчествуй
  rationale: Прямо передаёт повелительную форму стандартного глагола пророческого провозглашения.
- source_word: וְאָמַרְתָּ
  choice: и скажи
  rationale: Естественно передаёт последовательное повеление после «пророчествуй».
- source_word: כֹּה אָמַר אֲדֹנָי
  choice: Так говорит Господь
  rationale: Сохраняет традиционную пророческую формулу; в представленном еврейском тексте стоит титул אֲדֹנָי, поэтому дополнительное «Бог» не вводится.
- source_word: אֱמֹר
  choice: скажи
  rationale: Сохраняет второе повеление и повтор глагола אמר, вводящий слова пророчества.
- source_word: חֶרֶב חֶרֶב
  choice: Меч, меч
  rationale: Дословно сохраняет энергичный, угрожающий повтор существительного.
- source_word: הוּחַדָּה
  choice: наточен
  rationale: Передаёт пассивную форму от חדד и естественно описывает меч, которому придали остроту.
- source_word: וְגַם
  choice: и
  rationale: В русском сочетание двух однородных кратких причастий уже естественно выражает добавление; «и также» здесь звучало бы тяжеловесно.
- source_word: מְרוּטָה
  choice: отполирован
  rationale: Передаёт смысл гладко обработанного, блестящего клинка современным и понятным словом.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Господь Бог
  rationale: Предоставленный масоретский текст содержит אֲדֹנָי без явно записанного יהוה или אֱלֹהִים; перевод «Господь» точно передаёт титул и не добавляет отсутствующее слово.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы, повелительных форм и резкого повтора «меч, меч». Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
