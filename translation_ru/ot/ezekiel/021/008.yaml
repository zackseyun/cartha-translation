  source_fidelity: 'Основной смысл передан верно: адресат — олицетворённая земля Израиля; Яхве выступает против неё, извлекает Свой меч из ножен и объявляет поражение праведного и нечестивого. Однако «истреблю у тебя» менее точно передаёт הִכְרַתִּי («отсеку, уничтожу») и звучит по-русски не вполне естественно в сочетании с «у тебя».'
  naturalness: «Так говорит Яхве», «вот, Я — против тебя» и образ меча из ножен соответствуют современному литературному русскому с пророчески торжественным регистром. Замена «истреблю у тебя» на «отсеку у тебя» сохраняет образность исходника и делает синтаксис яснее в этом жанровом регистре.
  terminology: «Яхве», «праведный» и «нечестивый» уместны и последовательно передают ключевые термины. Прописное «Мой» допустимо как редакционное уважительное оформление, хотя оно не является требованием исходного текста.
