  text: וְ/אָמַרְתָּ֞ לְ/אַדְמַ֣ת יִשְׂרָאֵ֗ל כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֣י אֵלַ֔יִ/ךְ וְ/הוֹצֵאתִ֥י חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ צַדִּ֥יק וְ/רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/008.yaml
  text: 'And say to the land of Israel[a], ‘Thus says Yahweh: Behold, I am against you, and I will draw my sword from its sheath and cut off from you both righteous and wicked.’'
translation:
  language: ru
  text: 'И скажи земле Израиля: «Так говорит Яхве: вот, Я — против тебя. Я выну Мой меч из ножен и отсеку у тебя и праведного, и нечестивого».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: земле Израиля
  rationale: אַדָמָה означает землю, почву или территорию; в пророческом обращении здесь естественно обозначает страну вместе с живущими в ней людьми.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога транслитерацией, а не заменяется титулом «Господь».
- source_word: הִנְנִי אֵלַיִךְ
  choice: вот, Я — против тебя
  rationale: Сохраняет указательно-эмфатическую силу הִנְנִי и значение противостояния в сочетании с אֶל.
- source_word: וְהוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  choice: Я выну Мой меч из ножен
  rationale: Передаёт конкретный образ извлечения меча из ножен; «выну» ближе к исходному глаголу, чем более идиоматическое «обнажу».
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: и истреблю у тебя
  rationale: В контексте суда Hiphil от כרת означает устранить или уничтожить. «Истреблю у тебя» естественно по-русски передаёт отделение людей от олицетворённой земли, хотя конкретная метафора «отсечения» становится менее явной.
- source_word: צַדִּיק וְרָשָׁע
  choice: и праведного, и нечестивого
  rationale: Обе категории названы прямо; парная конструкция «и… и…» подчёркивает всеохватность объявленного бедствия.
theological_decisions:
- issue: Суд над «праведным и нечестивым»
  choice: Сохранено прямое утверждение, что грядущий меч затронет и праведного, и нечестивого.
  alternative: Понимать выражение риторически или в корпоративном смысле, не отрицая различий в Божьем суде над отдельными людьми.
  rationale: Сам стих не объясняет соотношение этого всеобщего бедствия с темой личной ответственности; перевод не должен устранять присутствующее в тексте богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Олицетворение земли сохранено через обращение «тебя». Местоимение «Мой» написано с прописной буквы как уважительное обозначение принадлежности Богу, без архаизации синтаксиса.
