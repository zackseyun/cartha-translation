lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: В устойчивой пророческой формуле естественное русское «И было… слово» сохраняет повествовательную форму исходного текста и звучит по-библейски, но без ненужной архаизации.
- source_word: דְבַר
  choice: слово
  rationale: «Слово» точно передаёт существительное דָּבָר в формуле откровения и сохраняет её повторяющийся терминологический характер; «весть» было бы более истолковывающим.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация передаёт собственное божественное имя יהוה, не заменяя его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Естественно и точно выражает направленность слова к пророку.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В русском языке содержание последующей речи естественно вводится двоеточием; отдельное «говоря» здесь было бы тяжеловесным и менее современным.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя, а примечание сообщает традиционный вариант передачи, не утверждая спорную реконструкцию произношения как бесспорную.
translation_notes:
  register: Современный литературный русский с сохранением краткой торжественной пророческой формулы. Причастный оборот לֵאמֹר передан двоеточием как наиболее естественным русским средством введения следующей прямой речи.
