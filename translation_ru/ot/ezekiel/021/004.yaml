id: EZK.21.4
reference: Ezekiel 21:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל בָּשָׂ֔ר כִּ֛י אֲנִ֥י יְהוָ֖ה בִּֽעַרְתִּ֑י/הָ לֹ֖א תִּכְבֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/004.yaml
  text: And all flesh will see that I[a], Yahweh, have kindled it; it will not be quenched.
translation:
  language: ru
  text: И всякая плоть[a] увидит, что Я, Яхве, разжёг этот огонь и он не погаснет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все люди»; буквально: «всякая плоть».'
    reason: Лексическая альтернатива поясняет древнееврейский идиоматический оборот.
lexical_decisions:
- source_word: וְרָאוּ
  choice: увидит
  rationale: Форма в пророческом контексте указывает на будущее. Единственное число согласовано с собирательным выражением «всякая плоть» и сохраняет конкретное значение глагола ראה.
- source_word: כָּל בָּשָׂר
  choice: всякая плоть
  rationale: Сохранён библейский пророческий оборот, обозначающий всех людей; более явное значение дано в сноске.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что увидит всякая плоть, а не причину действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: בִּעַרְתִּיהָ
  choice: разжёг этот огонь
  rationale: Глагол בער здесь означает разжечь или воспламенить. Женский местоименный суффикс отсылает к огню из ближайшего контекста; явное существительное устраняет неестественную для русского языка рассогласованность рода.
- source_word: לֹא תִּכְבֶּה
  choice: он не погаснет
  rationale: Естественно передаёт непереходный глагол כבה применительно к продолжающему гореть огню, не добавляя внешнего действующего лица.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит личное имя Бога. Форма «Яхве» сохраняет его как имя и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Референт женского суффикса в בִּעַרְתִּיהָ
  choice: огонь из ближайшего контекста
  alternative: неуточнённый объект, переданный местоимением
  rationale: Предыдущий контекст прямо говорит об огне; его грамматический род в древнееврейском позволяет объяснить женский суффикс. Уточнение не меняет образ и обеспечивает ясную русскую связь с фразой «не погаснет».
translation_notes:
  register: Современный литературный русский с сохранением торжественного пророческого оборота «всякая плоть». Формулировка остаётся ясной для обычного читателя; имя «Яхве» передано непосредственно, а образ огня сохранён без конфессиональных добавлений.
