  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם שִׂים לְ/ךָ֣ שְׁנַ֣יִם דְּרָכִ֗ים לָ/בוֹא֙ חֶ֣רֶב מֶֽלֶךְ בָּבֶ֔ל מֵ/אֶ֥רֶץ אֶחָ֖ד יֵצְא֣וּ שְׁנֵי/הֶ֑ם וְ/יָ֣ד בָּרֵ֔א בְּ/רֹ֥אשׁ דֶּֽרֶךְ עִ֖יר בָּרֵֽא־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/024.yaml
  text: And you[a], son of man, set for yourself two roads for the sword of the king of Babylon to come by; both of them shall go out from one land. And make a signpost[b]; make it at the head of the road to the city.
translation:
  language: ru
  text: А ты, сын человеческий, наметь себе две дороги, по которым придёт меч царя Вавилона. Пусть обе исходят из одной страны. Сделай указатель[a]; сделай его в начале дороги, ведущей к городу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «руку». Вероятно, имеется в виду знак, указывающий направление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у начала дороги, ведущей к городу». Выражение «голова дороги» может обозначать начало дороги или главный дорожный узел (развилку).'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивую формулу обращения к Иезекиилю и подчёркивает его человеческий статус перед Богом.
- source_word: שִׂים לְךָ שְׁנַיִם דְּרָכִים
  choice: наметь себе две дороги
  rationale: Передаёт повеление обозначить две дороги в рамках пророческого символического действия; «себе» сохраняет значение לְךָ.
- source_word: לָבוֹא חֶרֶב מֶלֶךְ בָּבֶל
  choice: по которым придёт меч царя Вавилона
  rationale: Сохраняет образ меча как обозначения военного нашествия и естественно связывает его движение с дорогами.
- source_word: מֵאֶרֶץ אֶחָד יֵצְאוּ שְׁנֵיהֶם
  choice: обе они должны выходить из одной земли
  rationale: Сохраняет общий исходный пункт обеих дорог и модальный оттенок указания в данном символическом действии.
- source_word: יָד
  choice: указатель
  rationale: Буквально слово означает «рука», но здесь, вероятнее всего, обозначает направляющий знак у разветвления дорог.
- source_word: בָּרֵא
  choice: сделай
  rationale: Редкое употребление допускает значения «вырежи», «изготовь» или «подготовь»; нейтральное «сделай» не уточняет неизвестный способ изготовления.
- source_word: בְּרֹאשׁ דֶּרֶךְ עִיר
  choice: в начале дороги к городу
  rationale: Передаёт буквальный образ «головы дороги», не превращая его без достаточного основания в однозначное «перекрёсток» или «развилка».
theological_decisions:
- issue: Образ меча царя Вавилона
  choice: сохранён буквально как «меч царя Вавилона»
  alternative: «войско царя Вавилона» или «нашествие царя Вавилона»
  rationale: Метафорическое значение ясно из контекста, но буквальный образ важен для пророческой речи и не должен быть устранён.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Синтаксис упрощён лишь настолько, чтобы ясно показать две дороги, имеющие общий исходный пункт; редкие и неоднозначные еврейские выражения пояснены в сносках.
