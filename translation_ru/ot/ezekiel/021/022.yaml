  text: וְ/גַם אֲנִ֗י אַכֶּ֤ה כַפִּ/י֙ אֶל כַּפִּ֔/י וַ/הֲנִחֹתִ֖י חֲמָתִ֑/י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/022.yaml
  text: And I too will strike my hands together[a], and I will satisfy my wrath. I, Yahweh[b], have spoken.
translation:
  language: ru
  text: И Я тоже ударю ладонью о ладонь[a] и утолю Мою ярость[b]. Я, Яхве, сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ударю Моей ладонью о Мою ладонь» — выразительный жест, сопровождающий приговор и суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дам Моей ярости успокоиться (обрести покой)»; то есть она утихнет после полного исполнения суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: И Я тоже
  rationale: Передаёт соединительное значение וְ, усилительно-добавочное значение גַם и подчёркнутое местоимение אֲנִי.
- source_word: אַכֶּה כַפִּי אֶל כַּפִּי
  choice: ударю ладонью о ладонь
  rationale: Сохраняет конкретный телесный образ и силу жеста; глагол «хлопну» мог бы создать неуместный оттенок одобрения или радости.
- source_word: וַהֲנִחֹתִי
  choice: утолю
  rationale: Каузативная форма от נוח обозначает приведение ярости к покою; в контексте суда речь идёт о её полном излиянии, после которого она утихает.
- source_word: חֲמָתִי
  choice: Мою ярость
  rationale: חֵמָה означает сильный, пылающий гнев; «ярость» естественно и весомо звучит в контексте пророческого суда.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное Божье имя, а не заменяет его титулом.
- source_word: דִּבַּרְתִּי
  choice: сказал
  rationale: Перфект входит в торжественную формулу окончательного Божьего заявления; русский прошедший вид передаёт его завершённость и непреложность.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено личное имя; транслитерация сохраняет это различие, не подменяя имя титулом.
- issue: Ярость, приведённая к покою
  choice: утолю Мою ярость
  alternative: дам Моей ярости утихнуть; успокою Мою ярость
  rationale: Формулировка сохраняет образ ярости, достигающей завершения в исполненном суде, и не сводит его к одному лишь изменению эмоционального состояния.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавные формы «Я», «Мою» сохранены как уважительное оформление Божьей прямой речи. Конкретный образ ладоней оставлен в основном тексте, а буквальная структура и смысл идиомы о покое ярости пояснены в сносках.
