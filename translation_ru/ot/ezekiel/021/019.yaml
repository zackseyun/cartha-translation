  yaml_path: translation/ot/ezekiel/021/019.yaml
  text: And you[a], son of man, prophesy and strike palm to palm, and let the sword be doubled a third time—the sword of the slain. It is the sword of the great slain one[c][b], the one that presses in on them.
translation:
  language: ru
  text: 'А ты, сын человеческий, пророчествуй и ударь ладонью о ладонь[a]. Пусть меч удвоится в третий раз[b]: меч поражённых! Это меч великого поражённого, надвигающийся на них[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлопни в ладоши». Буквально: «ударь ладонью о ладонь»; речь идёт о пророческом жесте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть меч станет тройным». Еврейское выражение может указывать либо на третье повторение удара, либо на троекратное усиление меча.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вторгающийся к ним» или «окружающий их». Причастие может обозначать проникновение, наступление или охватывающее действие меча.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивую формулу обращения к Иезекиилю и образность еврейского выражения.
- source_word: הִנָּבֵא
  choice: пророчествуй
  rationale: Точно передаёт повелительную форму стандартного пророческого поручения без добавления отсутствующего объекта.
- source_word: וְהַךְ כַּף אֶל כָּף
  choice: ударь ладонью о ладонь
  rationale: Передаёт буквальный образ пророческого жеста; более истолковательное «хлопни в ладоши» вынесено в примечание.
- source_word: וְתִכָּפֵל חֶרֶב
  choice: пусть меч удвоится
  rationale: Сохраняет пассивное, побудительно-желательное значение формы и не превращает образ удвоения в конкретный второй удар.
- source_word: שְׁלִישִׁתָה
  choice: в третий раз
  rationale: Естественно передаёт возможное значение третьего повторения, сохраняя альтернативу «станет тройным» в примечании.
- source_word: חֶרֶב חֲלָלִים
  choice: меч поражённых
  rationale: Сохраняет конструкцию принадлежности и множественное число; «поражённые» в данном контексте означает павших от оружия.
- source_word: חֶרֶב חָלָל הַגָּדוֹל
  choice: меч великого поражённого
  rationale: Сохраняет конкретное единственное число חָלָל и определение «великий», не заменяя их абстрактным «великим побоищем».
- source_word: הַחֹדֶרֶת לָהֶם
  choice: проникающий к ним
  rationale: Передаёт значение проникновения/вторжения и учитывает предлог ל, не делая людей прямым объектом действия без необходимости.
