base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/025.yaml
  text: You shall set a road for the sword to come to Rabbah of the Ammonites[b][a], and to Judah in fortified Jerusalem.
translation:
  language: ru
  text: Проложи дорогу, чтобы меч пришёл к Равве аммонитян[a] и к Иудее, в укреплённом Иерусалиме.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Равва была главным городом аммонитян.
    reason: cultural_note
  - marker: b
    text: 'Возможно также: «против Раввы аммонитян и против Иудеи в укреплённом Иерусалиме». Еврейская конструкция может обозначать как движение к этим местам, так и враждебное наступление против них.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֶּרֶךְ תָּשִׂים
  choice: Проложи дорогу
  rationale: Буквально «положи/устрой дорогу». В контексте пророческого знамения это естественная русская формулировка повеления наметить путь для военного наступления.
- source_word: לָבוֹא חֶרֶב
  choice: чтобы меч пришёл
  rationale: Инфинитив בוא выражает цель или результат. «Меч» олицетворяет наступающее войско и суд; образ сохранён без поясняющей конкретизации в основном тексте.
- source_word: אֵת רַבַּת בְּנֵי עַמּוֹן
  choice: к Равве аммонитян
  rationale: רַבָּה — название главного города аммонитян. В данной конструкции אֵת допускает понимание городов как направлений и одновременно целей враждебного наступления.
- source_word: וְאֶת יְהוּדָה
  choice: и к Иудее
  rationale: 'Сохраняется синтаксический параллелизм с Раввой: оба места представлены как направления/цели меча.'
- source_word: בִירוּשָׁלַם בְּצוּרָה
  choice: к укреплённому Иерусалиму
  rationale: Предложная фраза локализует Иудею в Иерусалиме, а בְּצוּרָה характеризует город как укреплённый. Тире ясно передаёт уточняющее отношение и избегает неестественного «Иудее в Иерусалиме».
theological_decisions:
- issue: Синтаксическая роль Раввы и Иудеи/Иерусалима после выражения «чтобы меч пришёл»
  choice: Оба названы параллельными направлениями и целями наступления меча.
  alternative: Передать אֵת более явно враждебным «против Раввы… и против Иудеи».
  rationale: Контекст говорит о двух возможных целях вавилонского меча, однако сама конструкция позволяет выражать как движение к ним, так и враждебное выступление против них. Основной текст сохраняет образ движения, а примечание — враждебный оттенок.
- issue: Соотношение Иудеи и Иерусалима
  choice: Иерусалим дан как уточнение цели в Иудее.
  alternative: «к Иудее в укреплённом Иерусалиме».
  rationale: Так передаётся локативное ב и смысл исходного текста без тяжёлой или двусмысленной русской конструкции.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повелительная форма «Проложи» естественно передаёт обращённое к пророку указание; образ меча и синтаксическая неоднозначность направления/враждебной цели сохранены.
