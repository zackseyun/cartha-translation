base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/027.yaml
  text: 'In his right hand was the divination for Jerusalem: to set battering rams[a], to open the mouth with slaughter, to raise the voice with a battle cry, to set battering rams against the gates, to heap up a siege ramp[b], to build a siege wall.'
translation:
  language: ru
  text: 'В его правой руке — гадание на Иерусалим: поставить тараны, открыть уста для кровопролития[a], поднять голос с боевым кличем, направить тараны против ворот, насыпать осадный вал, возвести осадное укрепление[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыть уста с резнёй». Выражение может подразумевать приказ или крик, сопровождающий нападение.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «возвести осадную стену», «вал» или «осадную башню»; еврейское слово обозначает осадное сооружение, точный вид которого неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימִינוֹ
  choice: В его правой руке
  rationale: Сохраняет конкретный образ руки царя, в которой находится результат гадания.
- source_word: הַקֶּסֶם יְרוּשָׁלִַם
  choice: выпал жребий на Иерусалим
  rationale: Передаёт результат гадания, указавший на Иерусалим, естественно по-русски и без уточнения не названного в тексте способа гадания.
- source_word: לָשׂוּם כָּרִים
  choice: поставить тараны
  rationale: В осадном контексте כָּרִים обозначает тараны; повтор выражения сохранён.
- source_word: לִפְתֹּחַ פֶּה בְּרֶצַח
  choice: открыть уста для кровопролития
  rationale: Сохраняет необычный образ еврейского выражения и его возможную целевую связь с насилием, не сводя его однозначно к приказу или крику.
- source_word: לְהָרִים קוֹל בִּתְרוּעָה
  choice: поднять голос с боевым кличем
  rationale: Передаёт как образ возвышенного голоса, так и военное значение תְרוּעָה в данном контексте.
- source_word: עַל שְׁעָרִים
  choice: против ворот
  rationale: Ясно выражает направленность таранов на городские ворота.
- source_word: לִשְׁפֹּךְ סֹלְלָה
  choice: насыпать осадный вал
  rationale: Естественно передаёт сооружение насыпи для осады; русское «насыпать» соответствует практическому смыслу глагола.
- source_word: לִבְנוֹת דָּיֵק
  choice: возвести осадные укрепления
  rationale: Обобщённое выражение сохраняет неопределённость точного типа осадного сооружения, обозначенного דָּיֵק.
