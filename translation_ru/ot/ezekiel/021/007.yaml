lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устойчивое обращение к Иезекиилю, сохраняющее еврейский образ и традиционно узнаваемое в русском библейском языке; здесь это обозначение человека и пророческого призвания, а не мессианский титул.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: обрати лицо к
  rationale: Передаёт намеренную направленность пророка и сохраняет образ исходного выражения, оставаясь понятным по-русски.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалиму
  rationale: Нормативная русская форма географического названия с управлением предлога «к».
- source_word: וְהַטֵּף אֶל
  choice: изреки слово о
  rationale: Глагол נטף буквально связан с капанием, но в пророческой речи означает произнесение пророчества. «Изреки слово» естественно обозначает пророческий речевой акт, а нейтральное «о» сохраняет направленность אֶל без преждевременного усиления до «против».
- source_word: מִקְדָּשִׁים
  choice: святилищах
  rationale: Сохраняет множественное число и культовое значение еврейского слова, не сужая его до отдельных храмовых зданий.
- source_word: וְהִנָּבֵא אֶל
  choice: пророчествуй против
  rationale: В контексте грядущего суда направленность пророчества имеет враждебный смысл; «против» ясно передаёт функцию высказывания.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: земли Израиля
  rationale: В данном пророчестве אַדְמָה обозначает территорию страны, поэтому «земля» точнее контекстуально, чем «почва».
theological_decisions:
- issue: Смысл пророческой идиомы וְהַטֵּף и сила предлога אֶל перед מִקְדָּשִׁים
  choice: Передать как «изреки слово о святилищах» и пояснить буквальный образ в сноске
  alternative: «изреки против святилищ»; буквально «пусть [слова] каплют к святилищам»
  rationale: Контекст всего повеления — суд, однако само אֶל обозначает прежде всего направленность. Формулировка «о святилищах» сохраняет эту особенность и не стирает различие с более явно враждебно понимаемым последним повелением; пророческий смысл метафоры раскрывается без неестественного русского образа в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены устойчивое обращение «Сын человеческий», образ поворота лица и множественное число «святилища»; буквальная метафора «капать» вынесена в сноску ради ясности.
