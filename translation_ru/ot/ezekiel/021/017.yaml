source:
  edition: WLC
  text: זְעַ֤ק וְ/הֵילֵל֙ בֶּן אָדָ֔ם כִּי הִיא֙ הָיתָ֣ה בְ/עַמִּ֔/י הִ֖יא בְּ/כָל נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל מְגוּרֵ֤י אֶל חֶ֨רֶב֙ הָי֣וּ אֶת עַמִּ֔/י לָ/כֵ֖ן סְפֹ֥ק אֶל יָרֵֽךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/017.yaml
  text: Cry out and wail[a], son of man, for it has come upon my people; it is upon all the princes of Israel. They are given over to the sword along with my people[b]; therefore strike your thigh.
translation:
  language: ru
  text: Вскричи и рыдай, сын человеческий! Ибо меч обрушился на Мой народ и на всех князей Израиля. Они вместе с Моим народом отданы мечу[a]. Поэтому ударь себя по бедру[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное понимание трудного еврейского оборота: «Ужасы от меча постигли Мой народ». Точное значение слова מְגוּרֵי остаётся спорным.'
    reason: alternative_reading
  - marker: b
    text: Ударить себя по бедру — жест скорби, потрясения или плача.
    reason: cultural_note
lexical_decisions:
- source_word: זְעַק וְהֵילֵל
  choice: Вскричи и рыдай
  rationale: Два повелительных глагола передают громкий крик бедствия и плач. «Вскричи» сохраняет силу זעק, а «рыдай» естественно передаёт громкое сетование ילל.
- source_word: בֶּן אָדָם
  choice: сын человеческий
  rationale: Устойчивое обращение к Иезекиилю; оно сохраняет образ исходного текста и остаётся понятным в современном литературном русском.
- source_word: כִּי הִיא הָיְתָה בְעַמִּי
  choice: Ведь меч обрушился на Мой народ
  rationale: Женское местоимение הִיא по контексту указывает на меч (חֶרֶב, женский род в еврейском). В русском род меняется на мужской, а подразумеваемое существительное «меч» названо для ясности. «Обрушился на» передаёт направленность бедствия, не уточняя её сверх контекста.
- source_word: הִיא בְּכָל נְשִׂיאֵי יִשְׂרָאֵל
  choice: на всех князей Израиля
  rationale: Продолжает действие того же подразумеваемого меча. «Князья» передаёт политически высокий статус נְשִׂיאִים и соответствует возвышенному пророческому регистру.
- source_word: מְגוּרֵי אֶל חֶרֶב הָיוּ
  choice: Они … отданы мечу
  rationale: Трудная конструкция понята как указание на тех, кто предан или отдан мечу. Формулировка естественна по-русски, а реальная текстовая неоднозначность отмечена в сноске.
- source_word: אֶת עַמִּי
  choice: вместе с Моим народом
  rationale: 'אֶת принято здесь в сопроводительном значении: князья разделяют участь народа.'
- source_word: סְפֹק אֶל יָרֵךְ
  choice: ударь себя по бедру
  rationale: Передаёт буквальное пророческое действие — жест скорби и потрясения; возвратное «себя» необходимо для естественного русского выражения.
theological_decisions:
- issue: Подразумеваемый субъект в повторяющихся оборотах с הִיא
  choice: Субъект обозначен словом «меч», взятым из непосредственного контекста.
  alternative: Понимать местоимение более обобщённо как указание на бедствие или суд.
  rationale: Грамматический женский род согласуется с חֶרֶב «меч» в еврейском, однако стих допускает более широкое понимание надвигающейся кары. Перевод называет наиболее вероятный референт, не добавляя конфессионального толкования.
- issue: Значение трудного оборота מְגוּרֵי אֶל חֶרֶב
  choice: Князья вместе с народом «отданы мечу».
  alternative: «Ужасы от меча постигли Мой народ».
  rationale: Основной текст следует возможному пассивно-результативному пониманию оборота, а засвидетельствованная альтернатива сохранена в сноске, чтобы не устранять подлинную неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан ясным без сглаживания сурового образа меча; традиционные выражения «сын человеческий» и «князья Израиля» сохранены как понятные и уместные.
