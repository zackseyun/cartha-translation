  text: 'И было ко мне слово Яхве:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит новое пророческое сообщение; традиционная и естественная русская формула «И было…» сохраняет повествовательный переход.
- source_word: דְבַר
  choice: слово
  rationale: В сочетании דְבַר יְהוָה слово обозначает данное пророку божественное слово; этот перевод сохраняет устойчивую пророческую формулу и её богословское звучание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица указывает направление слова к пророку; «ко мне» естественно в данной русской конструкции.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «говоря» вводит последующую прямую речь. В современном русском эту функцию естественно и точно передаёт двоеточие без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» передаёт тетраграмматон как имя, не заменяя его титулом; форма «Иегова» основана на более позднем смешении согласных тетраграмматона с подставными гласными.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. Двоеточие подготавливает прямую речь следующего стиха.
