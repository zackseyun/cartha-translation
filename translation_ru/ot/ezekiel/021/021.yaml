lexical_decisions:
- source_word: הִתְאַחֲדִי
  choice: Соберись
  rationale: Редкая возвратная форма, обращённая в женском роде к олицетворённому мечу. «Соберись» передаёт сосредоточение или стягивание перед ударом и сохраняет краткость приказа.
- source_word: הֵימִנִי
  choice: направься вправо
  rationale: Императив от основы, связанной с правой стороной; выбран естественный русский приказ о направлении движения.
- source_word: הָשִׂימִי הַשְׂמִילִי
  choice: встань слева
  rationale: Сочетание императива שׂים с формой от «левый» буквально выражает постановку или направление влево. «Встань слева» сохраняет отдельный приказ и допускает резкое сопоставление правого и левого направлений.
- source_word: אָנָה
  choice: куда бы ни
  rationale: Наречие направления вводит неопределённое место назначения; в данном контексте русское «куда бы ни» звучит естественно.
- source_word: פָּנַיִךְ
  choice: твоё лицо
  rationale: Сохранён конкретный еврейский образ; по смыслу лицо обозначает направление, в котором обращён олицетворённый меч.
- source_word: מֻעָדוֹת
  choice: было обращено
  rationale: Пассивная форма от יעד может означать назначенность, заданность или направленность. «Было обращено» естественно сочетается с «лицом», не уточняя, кем задано направление.
theological_decisions:
- issue: Олицетворённый адресат и воинская образность
  choice: Сохранены прямые повеления женского рода без добавления слова «меч».
  alternative: Добавить обращение «меч» или истолковать приказы как обращённые к войску.
  rationale: В самом стихе адресат прямо не назван, хотя ближайший контекст указывает на олицетворённый меч. Отсутствие добавленного существительного сохраняет резкость и образность еврейского текста.
- issue: Кем назначено направление
  choice: Сохранена пассивная конструкция без указания действующего лица.
  alternative: Передать как «куда Бог назначил тебе» или как простое самостоятельное решение адресата.
  rationale: Еврейский текст не называет того, кто назначает или задаёт направление; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткие повелительные формы сохраняют напряжённый воинский ритм и женский род олицетворённого меча. Необычное сопоставление правого и левого направлений не сглажено.
