lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: В устойчивой пророческой формуле русское «И было… слово» близко передаёт еврейскую конструкцию и сохраняет её торжественный характер.
- source_word: דְבַר
  choice: слово
  rationale: Здесь обозначает словесное откровение Бога; «слово» сохраняет традиционную пророческую формулу и не сужает смысл до более истолковывающего «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте.
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно и естественно передаёт направление слова к пророку.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В современном русском двоеточие естественно вводит последующую прямую речь и функционально передаёт еврейское «говоря», избегая тяжеловесности.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, а не титул; форма «Яхве» передаёт тетраграмматон, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Порядок слов выбран слегка возвышенный, но понятный; לֵאמֹר передано пунктуационно, поскольку следующая речь начинается в следующем стихе.
