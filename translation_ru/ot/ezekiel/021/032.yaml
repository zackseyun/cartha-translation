  verdict: revise
  source_fidelity: Троекратное עַוָּה и открытая формула «тот, кому принадлежит право» переданы по существу верно. Однако в строке גַּם זֹאת לֹא הָיָה русское «И её не будет» неоправданно конкретизирует указательное זֹאת личным женским местоимением и создаёт неясную связь с «руиной». В וּנְתַתִּיו объект также остаётся контекстуально подразумеваемым; нейтральное «это» лучше сохраняет исходную недоговорённость.
  naturalness: «Руина, руина, руина — вот во что Я обращу её» звучит естественно и сохраняет торжественную пророческую интонацию. «И этого также не будет» яснее и литературнее в данном контексте, чем повторное «её».
  terminology: «Право» удачно передаёт מִשְׁפָּט как законное притязание в контексте царской власти. В примечании следует дать «правосудие» как более естественную русскую альтернативу для значения «суд/правосудие» и осторожно сформулировать мессианское понимание как мнение многих толкователей.
