  yaml_path: translation/ot/ezekiel/021/032.yaml
  text: A ruin[a], a ruin, a ruin—I will make it. This also shall not be, until he comes whose right it is[b], and I will give it to him.
translation:
  language: ru
  text: Руина, руина, руина — вот во что Я обращу её.[a] И этого также не будет, пока не придёт тот, кому принадлежит право,[b] и Я отдам это ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Низвержение, низвержение, низвержение». В еврейском тексте существительное повторено трижды для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кому принадлежит правосудие», «кому это принадлежит по праву». Эти слова нередко считают отсылкой к Бытие 49:10; многие толкователи видят здесь мессианский смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַוָּה עַוָּה עַוָּה
  choice: Руина, руина, руина
  rationale: Троекратный повтор существительного сохранён как резкое провозглашение полного низвержения; «руина» передаёт результат разрушения и сохраняет именную форму еврейского выражения.
- source_word: אֲשִׂימֶנָּה
  choice: вот во что Я обращу её
  rationale: Глагол שׂים означает «положить, установить, сделать»; женский объект передан местоимением «её», а русская конструкция естественно связывает действие с только что названной руиной.
- source_word: גַּם זֹאת לֹא הָיָה
  choice: И её не будет
  rationale: Совершенный вид в пророческом контексте передаёт будущий результат. Женское местоимение сохраняет грамматическую связь, выраженную в еврейском тексте, а добавочное גַּם отражено союзом «и».
- source_word: עַד בֹּא
  choice: пока не придёт тот
  rationale: Передана временная граница и личный, но не названный прямо субъект последующей относительной конструкции.
- source_word: אֲשֶׁר לוֹ הַמִּשְׁפָּט
  choice: кому принадлежит право
  rationale: מִשְׁפָּט может обозначать суд, правосудие или законное право. В контексте власти «принадлежит право» сохраняет юридический смысл, не называя фигуру и не определяя её богословски.
- source_word: וּנְתַתִּיו
  choice: ему Я отдам её
  rationale: Передан акт Божьей передачи подразумеваемой царской власти или принадлежности; женское местоимение по-русски согласовано с контекстуально подразумеваемой властью.
theological_decisions:
- issue: Мессианский или ближайший исторический смысл слов о том, кому принадлежит право
  choice: В основном тексте оставить будущего обладателя права неназванным.
  alternative: Прямо назвать его Мессией или будущим царём из рода Давида.
  rationale: Формулировка может перекликаться с Бытие 49:10 и пониматься мессиански, однако сам еврейский текст здесь не называет этого человека. Перевод сохраняет открытость выражения.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Троекратный повтор и неопределённость личности будущего законного обладателя сохранены; архаизмы и конфессионально заданные уточнения не вводятся.
