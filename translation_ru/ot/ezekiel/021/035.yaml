- from: Вернись в свои ножны[a]. На том месте, где ты был создан, в земле твоего происхождения[b], Я буду судить тебя.
  to: Убери его в ножны[a]. Там, где ты была создана, в земле твоего происхождения[b], Я буду судить тебя.
  rationale: Правка восстанавливает переходное значение начального глагола и женский род дальнейшего обращения. Она не навязывает решение о том, является ли адресатом меч, Аммон или символически представленная им сторона, а сноска поясняет подразумеваемый меч без догматического истолкования.
