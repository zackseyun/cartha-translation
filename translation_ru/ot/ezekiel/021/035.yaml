review_pass:
  verdict: revise
  source_fidelity: 'Начальный повелительный глагол הָשַׁב — форма хифиля, 2-го лица мужского рода: «верни/положи [его] обратно», а не возвратное «вернись». Подразумеваемое дополнение — меч; תַּעְרָהּ означает «в его ножны» (суффикс женского рода согласуется с «мечом»). Далее текст переходит к обращению во 2-м лице женского рода: «где ты была создана… тебя буду судить». Исправление сохраняет этот намеренно непростой грамматический переход, не решая спорно, кого именно символически представляет адресат.'
  naturalness: «Убери его в ножны» — естественная современная русская передача повеления с невыраженным в еврейском тексте, но контекстуально ясным дополнением. «Там, где ты была создана» точнее и естественнее, чем «На том месте, где ты был создан», поскольку передаёт женский род последующих еврейских форм.
  terminology: «Ножны», «создана», «земля твоего происхождения» и «буду судить тебя» передают ключевые слова без конфессионального истолкования. Сноска к «ножнам» должна описывать реальную синтаксическую возможность оригинала, а не утверждать, что повеление непосредственно обращено к олицетворённому мечу.
