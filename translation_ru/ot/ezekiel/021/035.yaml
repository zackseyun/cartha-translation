    rationale: Нִבְרֵאת, а также последующие суффиксы в «тебя» и «твоих происхождениях», имеют женский род. Русское «ты была создана» позволяет сохранить это существенное грамматическое наблюдение.
  - severity: medium
    issue: Сноска a неточно объясняет еврейскую форму как «Вернись в её ножны» и утверждает прямое обращение к мечу.
    rationale: Повеление стоит в мужском роде и допускает естественное понимание «верни [его] в его ножны»; непосредственный адресат и связь с последующим женским обращением остаются предметом интерпретации.
