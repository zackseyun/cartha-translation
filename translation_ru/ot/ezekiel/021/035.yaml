  text: Убери его в ножны[a]. Там, где ты была создана, в земле твоего происхождения[b], Я буду судить тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Верни [его] в его ножны»; подразумевается меч.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в земле твоего рождения» или «в земле твоей родины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁב
  choice: Вернись
  rationale: Повелительная форма глагола שוב передаёт приказ обратиться назад; «вернись» кратко и естественно продолжает обращение к олицетворённому мечу.
- source_word: תַּעְרָהּ
  choice: в свои ножны
  rationale: תער означает «ножны». Возвратное «свои» естественно для русского прямого обращения к мечу и сохраняет образ, хотя еврейский текст буквально использует суффикс третьего лица женского рода.
- source_word: בִּמְקוֹם
  choice: На том месте
  rationale: Локативное выражение обозначает место предстоящего суда; указательное «том» связывает его с последующим определительным придаточным.
- source_word: נִבְרֵאת
  choice: ты был создан
  rationale: Нифаль глагола ברא обычно означает «быть созданным». Формулировка сохраняет необычный образ создания меча, не заменяя его истолкованием «выкован» или «изготовлен».
- source_word: בְּאֶרֶץ מְכֻרוֹתַיִךְ
  choice: в земле твоего происхождения
  rationale: מכורות может обозначать происхождение, рождение или родину. «Земля твоего происхождения» звучит современно и применимо как к образу меча, так и к представленной им стране.
- source_word: אֶשְׁפֹּט אֹתָךְ
  choice: Я буду судить тебя
  rationale: Прямая передача формы первого лица глагола שפט с прямым дополнением сохраняет судебный смысл без неоправданного усиления до «совершу над тобой суд».
theological_decisions:
- issue: К кому обращены слова стиха
  choice: Непосредственно речь обращена к олицетворённому мечу, тогда как суд относится и к представленной этим образом стороне.
  alternative: Адресатом непосредственно является народ аммонитян или его правитель.
  rationale: Упоминание ножен и ближайший контекст поддерживают образ меча. Перевод сохраняет пророческую метафору и не устраняет намеренно напряжённую связь между мечом и теми, кого он представляет.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным пророческим звучанием. Мужской род обращения обусловлен русским словом «меч»; выражение «свои ножны» естественно сохраняет прямое обращение и олицетворение.
