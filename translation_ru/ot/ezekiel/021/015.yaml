base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/015.yaml
  text: So that it may slaughter a slaughter[a], it is sharpened; so that it may have a flash, it is polished[b]. Or shall we rejoice? The scepter of my son despises every tree.
translation:
  language: ru
  text: Чтобы меч совершил резню, он наточен; чтобы он сверкал, он отполирован.[a] Или нам радоваться? Скипетр моего сына презирает всякое дерево.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы у него был блеск (или молния)»; речь идёт о сиянии отполированного меча.'
    reason: lexical_alternative
  - marker: b
    text: Заключительная фраза на еврейском языке трудна. «Моего сына» следует масоретскому тексту; под сыном некоторые понимают Иуду или Божий народ. «Всякое дерево» может также означать любой деревянный жезл или оружие.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן טְבֹחַ טֶבַח
  choice: Чтобы меч совершил великое побоище
  rationale: Целевая конструкция передана через «чтобы»; сочетание однокоренных слов выражает усиление, которое в естественном русском передано прилагательным «великое». Подлежащее «меч» восстановлено из ближайшего контекста.
- source_word: הוּחַדָּה
  choice: он наточен
  rationale: Страдательная форма относится к мечу; «наточен» естественно и точно передаёт подготовку клинка.
- source_word: לְמַעַן הֱיֵה לָהּ בָּרָק
  choice: чтобы он сверкал
  rationale: Эллиптическое выражение буквально связывает меч с блеском/молнией; глагол «сверкал» сохраняет образ яркого отблеска, не вводя явного сравнения.
- source_word: מֹרָטָה
  choice: он отполирован
  rationale: Слово описывает выглаженный, отполированный клинок, дающий блеск.
- source_word: אוֹ נָשִׂישׂ
  choice: Или нам радоваться?
  rationale: Сохранены резкий риторический переход и значение первого лица множественного числа.
- source_word: שֵׁבֶט
  choice: скипетр
  rationale: Передаёт образ власти и правления, при этом возможное значение «жезл» отмечено в сноске.
- source_word: בְּנִי
  choice: моего сына
  rationale: Следует огласованному масоретскому тексту, не устраняя его трудность толковательным пересказом.
- source_word: מֹאֶסֶת כָּל עֵץ
  choice: отвергает всякое дерево
  rationale: Сохраняет буквальный и намеренно непрозрачный образ исходного текста; «отвергает» передаёт презрительное неприятие без чрезмерного уточнения метафоры.
theological_decisions:
- issue: Трудная заключительная фраза пророчества о суде
  choice: «Скипетр моего сына отвергает всякое дерево» — близкое следование масоретскому тексту.
  alternative: «Жезл моего сына отвергает всякое дерево/всё деревянное»; возможны толкования о скипетре Иуды, народе Бога или превосходстве меча над деревянным оружием.
  rationale: Синтаксис и образность фразы крайне трудны, но догматический вопрос здесь не решается. Поэтому неоднозначность сохранена в основном тексте, а возможные понимания вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Усилительная еврейская конструкция передана естественным русским выражением, тогда как подлинная неясность последней фразы намеренно сохранена.
