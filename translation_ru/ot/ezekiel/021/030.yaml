  yaml_path: translation/ot/ezekiel/021/030.yaml
  text: And you[a], slain wicked one, prince of Israel, whose day has come at the time of the punishment of the end[b],
translation:
  language: ru
  text: А ты, сражённый нечестивец, князь Израиля, чей день настал во время окончательного наказания[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «во время вины конца». Еврейское выражение может означать как вину, достигшую своей полной меры, так и окончательное наказание за неё. Слово «сражённый» можно также перевести как «смертельно раненный»; некоторые понимают его здесь в значении «осквернённый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלָל
  choice: сражённый
  rationale: В контексте пророчества о гибели правителя слово естественнее понимать как «пронзённый, сражённый». Возможные значения «смертельно раненный» и «осквернённый» отмечены в сноске.
- source_word: רָשָׁע
  choice: нечестивец
  rationale: Субстантивированное определение в обращении; передаёт нравственную оценку кратко и прямо.
- source_word: נְשִׂיא יִשְׂרָאֵל
  choice: князь Израиля
  rationale: Сохраняет формальный титул и возвышенный пророческий регистр; «правитель Израиля» было бы яснее, но менее близко традиционной титулатуре.
- source_word: אֲשֶׁר בָּא יוֹמוֹ
  choice: чей день настал
  rationale: Сохраняет еврейский образ назначенного дня суда и естественно звучит по-русски.
- source_word: בְּעֵת
  choice: во время
  rationale: Прямо передаёт временную конструкцию без дополнительного истолкования.
- source_word: עֲוֺן קֵץ
  choice: окончательное возмездие
  rationale: עָוֹן может обозначать как вину, так и её последствие — наказание. В контексте суда «возмездие» ясно передаёт второе значение, а «окончательное» выражает קֵץ, не устраняя альтернативного понимания, указанного в сноске.
theological_decisions:
- issue: Значение עֲוֺן в формуле суда
  choice: возмездие
  alternative: вина
  rationale: Контекст объявления гибели князю поддерживает значение последствия вины, то есть наказания. Вместе с тем семантическая двусмысленность сохранена в сноске.
- issue: Значение חָלָל
  choice: сражённый
  alternative: смертельно раненный; осквернённый
  rationale: В пророчестве о смертном приговоре наиболее вероятен смысл «пронзённый, сражённый», причём совершившийся образ может выражать непреложность приговора. Иные лексические возможности не скрыты.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис обращения и образ «чей день настал» сохранены. Двоеточие стиха не замыкается точкой, поскольку исходный фрагмент синтаксически продолжается.
