  yaml_path: translation/ot/ezekiel/021/028.yaml
  text: And it will be to them like a false divination in their eyes; they have sworn sworn oaths to them[a], but he brings guilt to remembrance, so that they may be captured.
translation:
  language: ru
  text: И это будет для них ложным гаданием в их глазах; хотя они связаны торжественными клятвами[a], он напомнит об их вине, чтобы они были схвачены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для понимания. Буквально: «поклявшиеся клятвами для них»; возможен также смысл: «клятвы за клятвами для них». Основной текст передаёт вероятный смысл: они были связаны торжественными клятвенными обязательствами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И это будет
  rationale: Перфект с союзом в пророческой речи передаёт будущий результат; указательное «это» естественно связывает стих с предшествующим знамением.
- source_word: כקסום שוא
  choice: ложным гаданием
  rationale: קסום обозначает гадание, а שוא — ложность, пустоту или тщетность; сочетание передаёт то, как жители оценят знамение.
- source_word: בְּעֵינֵיהֶם
  choice: в их глазах
  rationale: Сохранён понятный русский идиом, выражающий их субъективное восприятие.
- source_word: שְׁבֻעֵי שְׁבֻעוֹת לָהֶם
  choice: они связаны клятвами, данными им
  rationale: Трудное сжатое выражение, буквально связанное с «поклявшимися клятвами им» или «клятвами за клятвами для них». Основной текст передаёт вероятный смысл обязательных торжественных клятв, не скрывая неоднозначности благодаря сноске.
- source_word: וְהוּא
  choice: Но он
  rationale: Местоимение, вероятно, относится к царю Вавилона из ближайшего контекста; «но» передаёт противопоставление их оценке гадания и последующему действию.
- source_word: מַזְכִּיר עָוֺן
  choice: напомнит об их вине
  rationale: Причинная форма זכר означает «напоминать, приводить на память»; עון здесь уместно передать как вину в судебно-карательном контексте. Притяжательное «их» в русском проясняет подразумеваемый объект, не меняя смысла.
- source_word: לְהִתָּפֵשׂ
  choice: чтобы они были схвачены
  rationale: Инфинитив нифаля допускает значение цели или результата; пассивное «были схвачены» сохраняет форму и соответствует военному контексту.
theological_decisions:
- issue: К кому относится местоимение וְהוּא («он»)
  choice: Сохранить местоимение «он»
  alternative: Явно назвать царя Вавилона
  rationale: Ближайший контекст указывает на царя Вавилона, однако сам стих использует местоимение; его сохранение не устраняет формальную неоднозначность.
- issue: Чья вина вспоминается
  choice: «об их вине»
  alternative: «о вине» без обозначения носителя
  rationale: По контексту речь идёт о вине тех, кого схватят. Русское притяжательное местоимение делает фразу естественной, не вводя отдельного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранён образ «в их глазах» и юридико-военная последовательность «вина — схвачены»; тяжёлое еврейское выражение о клятвах передано понятно, а его неоднозначность вынесена в сноску.
