  text: וְ/אָֽמַרְתָּ֙ לְ/יַ֣עַר הַ/נֶּ֔גֶב שְׁמַ֖ע דְּבַר יְהוָ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה הִנְ/נִ֣י מַֽצִּית בְּ/ךָ֣ אֵ֡שׁ וְ/אָכְלָ֣ה בְ/ךָ֣ כָל עֵֽץ לַח֩ וְ/כָל עֵ֨ץ יָבֵ֤שׁ לֹֽא תִכְבֶּה֙ לַהֶ֣בֶת שַׁלְהֶ֔בֶת וְ/נִצְרְבוּ בָ֥/הּ כָּל פָּנִ֖ים מִ/נֶּ֥גֶב צָפֽוֹנָ/ה־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/003.yaml
  text: 'And say to the forest of the Negev[a], ‘Hear the word of Yahweh. Thus says the Lord GOD: Behold, I am kindling a fire in you, and it will consume in you every green tree and every dry tree. The blazing flame will not be quenched[b], and by it every face from south to north will be scorched.’'
translation:
  language: ru
  text: 'И скажи лесу Негева[a]: «Слушай слово Яхве! Так говорит Владыка Яхве: вот, Я разожгу в тебе огонь, и он пожрёт в тебе всякое зелёное дерево и всякое сухое дерево. Пылающее пламя не угаснет, и от него будут опалены все лица — от юга до севера».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лесу южной земли» или «лесу юга». Еврейское не́гев может означать «юг, южная земля» или обозначать конкретную область Негев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַר הַנֶּגֶב
  choice: лес южной земли
  rationale: נֶגֶב может обозначать как юг или южную область, так и конкретный Негев. В пророческом образе географическая направленность важна, но точная референция остаётся неоднозначной; основное чтение передаёт общее значение, а примечание сохраняет топонимическую возможность.
- source_word: שְׁמַע דְּבַר יְהוָה
  choice: Слушай слово Яхве
  rationale: Императив שְׁמַע передан естественным современным призывом «слушай», сохраняющим властный пророческий тон.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание титула אֲדֹנָי с личным именем передано без слияния двух элементов; «Владыка» звучит возвышенно, но понятно современному читателю.
- source_word: הִנְנִי מַצִּית בְּךָ אֵשׁ
  choice: вот, Я разожгу в тебе огонь
  rationale: הִנְנִי сохраняется как торжественное «вот»; причастная конструкция выражает близкое и решительное действие, естественно переданное будущим совершенного вида.
- source_word: וְאָכְלָה
  choice: и он пожрёт
  rationale: Глагол «пожрёт» сохраняет олицетворённую силу образа огня и более полно передаёт буквальное «съест», чем нейтральное «уничтожит».
- source_word: כָל עֵץ לַח וְכָל עֵץ יָבֵשׁ
  choice: всякое зелёное дерево и всякое сухое дерево
  rationale: לַח буквально означает влажное или свежее; применительно к дереву естественное русское соответствие — «зелёное», противопоставленное сухому.
- source_word: לֹא תִכְבֶּה לַהֶבֶת שַׁלְהֶבֶת
  choice: Пылающее пламя не угаснет
  rationale: Эмфатическое сочетание передано естественной русской аллитерационно-смысловой конструкцией; пассивную форму идиоматичнее выразить непереходным «не угаснет».
- source_word: וְנִצְרְבוּ בָהּ כָּל פָּנִים
  choice: и от него будут опалены все лица
  rationale: Сохраняется буквальный и необычный образ «всех лиц», не заменяемый интерпретацией «все люди»; בָהּ передано причинно-инструментальным «от него».
- source_word: מִנֶּגֶב צָפוֹנָה
  choice: от юга до севера
  rationale: Направительная форма צָפוֹנָה и предлог מִן естественно выражаются русской парой «от… до…».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное божественное имя; транслитерация сохраняет различие между именем и титулом אֲדֹנָי.
- issue: Образ суда через лесной пожар
  choice: Сохранить конкретные образы леса, деревьев, огня и лиц
  alternative: Раскрыть лес как Иудею, а деревья как её жителей
  rationale: Сам стих даёт пророческий образ, а не его прямое истолкование; добавление референтов устранило бы намеренную образность и богословское напряжение.
- issue: Охват выражения «все лица»
  choice: все лица
  alternative: все люди
  rationale: Буквальный образ допускает понимание как людей, так и всей обращённой к огню поверхности земли; перевод не должен преждевременно сужать эту выразительную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим регистром. Синтаксис сделан ясным для чтения вслух; сохранены повтор «всякое… всякое», торжественное «вот» и конкретная метафорика исходного текста.
