  text: And the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И пришло ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (ЙХВХ); традиционно переводится «Господь».'
    reason: Указана еврейская форма Божьего имени и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיְהִי
  choice: И пришло
  rationale: В устойчивой пророческой формуле сочетание וַיְהִי со словом דְבַר естественно передаётся по-русски как «И пришло… слово», что сохраняет значение наступившего откровения и избегает неестественного буквализма.
- source_word: דְבַר
  choice: слово
  rationale: В данной формуле דָּבָר обозначает данное пророку Божье слово или послание. «Слово» сохраняет традиционную пророческую формулу и связь с последующей прямой речью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с местоименным суффиксом указывает, что откровение было обращено к пророку; «ко мне» естественно в составе русской формулы «пришло ко мне слово».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לֵאמֹר вводит следующую прямую речь. В современном русском эту функцию естественно и ясно выражает двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя, тогда как «Господь» заменяет его титулом; традиционная форма «Иегова» менее точно отражает вероятное древнееврейское произношение.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой пророческой формулы. Двоеточие естественно передаёт вводную функцию לֵאמֹר перед последующей речью.
