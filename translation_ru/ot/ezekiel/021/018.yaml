  yaml_path: translation/ot/ezekiel/021/018.yaml
  text: For there is a testing[b][a]; and what if even the scepter that despises will not remain? declares the Lord GOD.
translation:
  language: ru
  text: Ибо есть испытание[a]. И что, если даже презирающего скипетра[b] не станет? — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ибо это испытание». Еврейская фраза кратка и допускает разные способы восполнения подразумеваемых слов.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское слово שֵׁבֶט может означать «скипетр», «жезл» или «племя». Вся фраза о скипетре в еврейском тексте чрезвычайно трудна; возможный перевод: «И что, если даже скипетра презрения больше не будет?»'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительную связь с предшествующим пророчеством и соответствует возвышенному, но понятному современному регистру.
- source_word: בֹחַן
  choice: предстоит испытание
  rationale: Краткая и эллиптическая форма связана с корнем בחן — «испытывать, проверять». Слово «предстоит» естественно передаёт подразумеваемое наступление испытания, не называя его субъект.
- source_word: וּמָה אִם גַּם
  choice: И что, если даже
  rationale: Передаёт риторический и условный характер трудной еврейской конструкции, сохраняя усиление частицы גַּם.
- source_word: שֵׁבֶט
  choice: скипетр
  rationale: Слово может означать также «жезл», «прут» или «племя», однако в контексте суда и царской власти наиболее уместен «скипетр».
- source_word: מֹאֶסֶת
  choice: презирающего
  rationale: Причастие от מאס («отвергать, презирать») передано в активном значении и синтаксически отнесено к «скипетру», как допускает масоретский текст; трудность конструкции отмечена в сноске.
- source_word: לֹא יִהְיֶה
  choice: не станет
  rationale: Буквально «не будет». Русское «не станет» естественно выражает прекращение существования, не добавляя уточнения о способе или времени.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: Устойчивая пророческая формула передана современно и торжественно; личное имя יהוה транслитерировано как «Яхве», а אֲדֹנָי — как «Владыка».
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Транслитерация сохраняет личное заветное имя, присутствующее в исходном тексте, а «Владыка» различает титул אֲדֹנָי и имя יהוה без неестественного повтора.
- issue: Отнесение причастия מֹאֶסֶת к скипетру
  choice: презирающего скипетра
  alternative: скипетра презрения / скипетра, который будет отвергнут
  rationale: Активное значение причастия сохранено без богословского уточнения объекта презрения. Поскольку еврейская фраза исключительно трудна, иные синтаксические толкования вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим оттенком. Краткость и риторическая напряжённость оригинала сохранены; спорная фраза не истолкована однозначно, а её реальная неоднозначность обозначена в сносках.
