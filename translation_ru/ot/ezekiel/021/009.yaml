source:
  edition: WLC
  text: יַ֛עַן אֲשֶׁר הִכְרַ֥תִּי מִמֵּ֖/ךְ צַדִּ֣יק וְ/רָשָׁ֑ע לָ֠/כֵן תֵּצֵ֨א חַרְבִּ֧/י מִ/תַּעְרָ֛/הּ אֶל כָּל בָּשָׂ֖ר מִ/נֶּ֥גֶב צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/009.yaml
  text: Because I will cut off from you both the righteous and the wicked[b][a], therefore my sword will go out from its sheath against all flesh from south to north.
translation:
  language: ru
  text: Так как Я истреблю у тебя и праведника, и нечестивца[a], Мой меч выйдет из ножен против всякой плоти[b] — от юга до севера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я истребил». Еврейская форма завершённого действия в пророческом контексте может обозначать действие как уже совершившееся либо как будущее, но несомненное.'
    reason: lexical_alternative
  - marker: b
    text: «Всякая плоть» — распространённое библейское выражение, означающее всех смертных людей.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Так как
  rationale: Естественно и точно передаёт причинную связь, вводящую основание грядущего суда.
- source_word: הִכְרַתִּי
  choice: Я истреблю
  rationale: Глагол כרת буквально связан с отсечением и здесь означает устранение или уничтожение. Будущее время соответствует пророческому контексту и последующему «выйдет»; буквальное «отсеку у тебя» по-русски звучало бы неестественно и могло бы ошибочно подразумевать лишь отделение.
- source_word: מִמֵּךְ
  choice: у тебя
  rationale: Местоимение женского рода обращено к земле; русское «у тебя» естественно выражает удаление людей из её среды, не добавляя отсутствующего в тексте пояснения.
- source_word: צַדִּיק וְרָשָׁע
  choice: и праведника, и нечестивца
  rationale: Парная конструкция ясно передаёт охват обеих нравственных категорий и сохраняет напряжённость утверждения о всеобщем историческом бедствии.
- source_word: לָכֵן
  choice: смысловая связь без отдельного «поэтому»
  rationale: В русском предложении причинная конструкция «так как…» естественно соединена с главным следствием. Добавление «поэтому» после «так как» было бы тяжеловесным, хотя причинно-следственная связь полностью сохраняется.
- source_word: תֵּצֵא חַרְבִּי
  choice: Мой меч выйдет
  rationale: Сохраняет конкретный и олицетворённый образ исходного текста, не заменяя его более толковательным пассивом «будет обнажён».
- source_word: מִתַּעְרָהּ
  choice: из ножен
  rationale: Обычное и понятное русское обозначение футляра для клинка; принадлежность ножен мечу естественно ясна из контекста.
- source_word: אֶל כָּל בָּשָׂר
  choice: против всякой плоти
  rationale: Предлог «против» передаёт враждебную направленность меча, а «всякая плоть» сохраняет библейский образ смертных людей.
- source_word: מִנֶּגֶב צָפוֹן
  choice: от юга до севера
  rationale: Передаёт полный географический охват от одного края земли до другого; в данном контексте направительное значение важнее возможного понимания נגב как названия области Негев.
theological_decisions:
- issue: Суд охватывает праведника и нечестивца
  choice: Сохранить прямое утверждение, что меч затронет обе категории людей.
  alternative: Считать «праведника» лишь кажущимся праведным или прямо ограничить смысл только внешними последствиями исторического бедствия.
  rationale: Еврейский текст не вводит подобных оговорок. Перевод сохраняет богословскую напряжённость и не отождествляет описанное историческое поражение с окончательным Божьим приговором.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Сохранены образ меча, выражение «всякая плоть» и напряжённое сопоставление праведника с нечестивцем; синтаксис сделан естественным для современного читателя.
