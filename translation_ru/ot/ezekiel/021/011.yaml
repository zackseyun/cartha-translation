  text: And you[a], son of man, groan with breaking loins, and in bitterness you shall groan before their eyes.
translation:
  language: ru
  text: А ты, сын человеческий, стенай, сокрушённый в чреслах, и с горечью стенай у них на глазах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с сокрушением чресл». «Чресла» могут обозначать область поясницы и бёдер; образ выражает крайнее телесное страдание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и повторяющийся образ книги; здесь это пророческое обращение, а не мессианский титул.
- source_word: הֵאָנַח / תֵּאָנַח
  choice: стенай
  rationale: Глагол передаёт слышимое, телесно выраженное страдание; «стенай» сильнее, чем «вздыхай», и естественно звучит как повеление.
- source_word: בְּשִׁבְרוֹן מָתְנַיִם
  choice: словно у тебя ломит поясницу
  rationale: Конкретный образ сокрушения в области бёдер, чресл или поясницы передан естественным современным русским выражением о сильной телесной боли; маркер сравнения показывает знаковый характер пророческого действия.
- source_word: וּבִמְרִירוּת
  choice: и с горечью
  rationale: Сохранено абстрактное значение «горечь» без сужения до одной конкретной эмоции, например скорби.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Естественный русский эквивалент буквального образа «перед их глазами», подчёркивающий публичность действия.
