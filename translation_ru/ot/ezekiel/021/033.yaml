  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנָּבֵ֤א וְ/אָֽמַרְתָּ֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה אֶל בְּנֵ֥י עַמּ֖וֹן וְ/אֶל חֶרְפָּתָ֑/ם וְ/אָמַרְתָּ֗ חֶ֣רֶב חֶ֤רֶב פְּתוּחָה֙ לְ/טֶ֣בַח מְרוּטָ֔ה לְ/הָכִ֖יל לְמַ֥עַן בָּרָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/033.yaml
  text: 'And you[a], son of man, prophesy and say, ‘Thus says the Lord GOD concerning the sons of Ammon and concerning their reproach’: And you shall say, ‘A sword, a sword, drawn for slaughter, polished for devouring[c][b], so that it flashes like lightning.’'
translation:
  language: ru
  text: 'А ты, сын человеческий, пророчествуй и скажи: «Так говорит Владыка Яхве о сынах Аммона и об их поношении». Скажи: «Меч, меч обнажён для заклания, отполирован, чтобы пожирать, чтобы сверкал, как молния!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и повторяющийся образ оригинала.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Переданы оба элемента сочетания: титул אֲדֹנָי и личное имя יהוה; форма естественна для современного литературного русского языка.'
- source_word: בְּנֵי עַמּוֹן
  choice: сыны Аммона
  rationale: Формально сохраняет родовое выражение оригинала; в данном пророческом регистре понятно как обозначение аммонитян.
- source_word: חֶרְפָּתָם
  choice: их злословие
  rationale: Слово может обозначать поношение, насмешку или оскорбление; «злословие» сохраняет направленное словесное унижение и не определяет его объект вопреки неоднозначному контексту.
- source_word: חֶרֶב חֶרֶב
  choice: Меч, меч
  rationale: Эмфатическое повторение оригинала сохранено без сглаживания.
- source_word: פְּתוּחָה
  choice: обнажён
  rationale: В образе меча причастие означает вынутый из ножен, то есть обнажённый меч.
- source_word: לְטֶבַח
  choice: для заклания
  rationale: Передано значение цели и сохранён суровый, возвышенный характер пророческой речи.
- source_word: מְרוּטָה
  choice: начищен
  rationale: Обозначает отполированную, доведённую до блеска поверхность и подготавливает образ молниевидного сверкания.
- source_word: לְהָכִיל
  choice: чтобы пожирать
  rationale: В контексте оружия выбрано разрушительное значение «поглощать, пожирать», а не формально возможное «вмещать».
- source_word: לְמַעַן בָּרָק
  choice: и сверкать молнией
  rationale: Краткая эллиптическая фраза понята как указание на молниевидный блеск начищенного меча; связь синтаксически трудна, поэтому неоднозначность отмечена.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано транслитерацией, а предшествующее אֲדֹנָי — отдельным титулом «Владыка», благодаря чему оба элемента еврейского выражения сохранены.
- issue: Чья именно חֶרְפָּה подразумевается
  choice: их злословие
  alternative: их позор / нанесённое им поношение
  rationale: 'Местоименный суффикс сохранён без добавления явного объекта: выражение допускает понимание и как злословия аммонитян, и как связанного с ними поношения.'
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор «меч, меч» и традиционное обращение «сын человеческий» сохранены; архаизация ограничена словом «заклание», уместным в грозном оракуле.
