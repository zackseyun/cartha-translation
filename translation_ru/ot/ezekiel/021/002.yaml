  yaml_path: translation/ot/ezekiel/021/002.yaml
  text: Son of man[a], set your face toward the south, and preach toward the south[c][b], and prophesy against the forest of the field in the Negeb.
translation:
  language: ru
  text: Сын человеческий, обрати лицо к югу[a], изрекай к югу[b] и пророчествуй против леса поля Негева[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте последовательно употреблены три связанных с югом слова: «тейман» — юг, «даром» — юг и «Негев». Это повторение усиливает направленность пророчества на южную землю.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «капли к югу» или «источай к югу». Глагол «капать, ронять каплями» здесь образно обозначает провозглашение пророческой речи. Предлог можно также передать как «против».'
