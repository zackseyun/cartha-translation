lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет обычную для Иезекииля форму обращения к пророку, её мужской род и повторяющийся литературный образ.
- source_word: שִׂים פָּנֶיךָ
  choice: обрати лицо
  rationale: Естественно передаёт еврейскую идиому решительной направленности, не устраняя образ лица.
- source_word: דֶּרֶךְ תֵּימָנָה
  choice: к югу
  rationale: תֵּימָנָה здесь имеет направительное значение и в параллелизме с דָּרוֹם и נֶגֶב указывает на южную землю.
- source_word: וְהַטֵּף
  choice: изреки слово
  rationale: Глагол буквально означает «капать, ронять каплями», но в пророческой речи служит метафорой провозглашения; выбранная формулировка понятна по-русски, а исходный образ отмечен в сноске.
- source_word: אֶל דָּרוֹם
  choice: против юга
  rationale: Предлог אֶל сам по себе допускает значение направления, однако контекст возвещения суда и параллель со следующим поручением поддерживают враждебную направленность «против».
- source_word: וְהִנָּבֵא
  choice: пророчествуй
  rationale: Прямой и традиционный эквивалент נבא в контексте пророческого поручения.
- source_word: אֶל יַעַר הַשָּׂדֶה נֶגֶב
  choice: против леса в земле Негев
  rationale: Сохраняет образ леса и понимает נֶגֶב как название южной области; необычная связь слов допускает и более буквальное прочтение «лес открытого поля на юге», указанное в сноске.
- source_word: נֶגֶב
  choice: Негев
  rationale: Передаёт вероятное название конкретной южной области и не сглаживает последовательность трёх родственных обозначений юга.
theological_decisions:
- issue: Направленность пророческой речи при אֶל
  choice: против юга / против леса
  alternative: к югу / к лесу
  rationale: Предлог допускает нейтральное направление, но пророчество суда в ближайшем контексте придаёт речи обличительную направленность. Неоднозначность второго оборота отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и повелительный; традиционное обращение «Сын человеческий» сохранено без конфессионального истолкования. Архаизмы сведены к минимуму, при этом «изреки» поддерживает возвышенный регистр и обозначает особое пророческое провозглашение.
