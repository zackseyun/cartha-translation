id: EZK.21.10
reference: Ezekiel 21:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ כָּל בָּשָׂ֔ר כִּ֚י אֲנִ֣י יְהוָ֔ה הוֹצֵ֥אתִי חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ לֹ֥א תָשׁ֖וּב עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/010.yaml
  text: And all flesh will know that I[a], Yahweh, have drawn my sword from its sheath; it will not return again.
translation:
  language: ru
  text: И узнает всякая плоть[a], что Я, Яхве, извлёк Свой меч из ножен; он уже не вернётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё человечество», «все люди»; буквально: «всякая плоть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнает
  rationale: Форма в пророческом контексте выражает будущий результат. Единственное число согласовано с собирательным выражением «всякая плоть».
- source_word: כָּל בָּשָׂר
  choice: всякая плоть
  rationale: Сохранён буквальный библейский образ, обозначающий всех людей и подчёркивающий всеобщность грядущего признания; более прозрачные варианты вынесены в сноску.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я, Яхве,
  rationale: Сохранена эмфатическая конструкция с именем говорящего в приложении; не добавлена отсутствующая в еврейском тексте связка «есть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, а не заменяющий его титул.
- source_word: הוֹצֵאתִי חַרְבִּי
  choice: извлёк Свой меч
  rationale: В сочетании с ножнами каузативная форма יצא естественно передаётся русским «извлёк»; притяжательность חַרְבִּי выражена словом «Свой».
- source_word: מִתַּעְרָהּ
  choice: из ножен
  rationale: «Ножны» — обычное современное русское обозначение футляра для меча; число изменено согласно норме русского языка.
- source_word: לֹא תָשׁוּב עוֹד
  choice: он уже не вернётся
  rationale: Местоимение относится к мечу. «Уже не» естественно передаёт отрицание с עוֹד, не усиливая его до безусловного «никогда».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя и не подменяет его титулом.
- issue: Объём выражения כָּל בָּשָׂר
  choice: всякая плоть
  alternative: всё человечество; все люди
  rationale: Буквальный образ допускает широкий охват и сохраняет характерную библейскую риторику, не ограничивая высказывание одной группой людей.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой интонации и ключевого библейского образа. Прописные «Я» и «Свой» употреблены как традиционные формы почтительного обозначения Бога.
