base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/037.yaml
  text: You will be fuel for the fire; your blood will be in the midst of the land. You will not be remembered[a], for I, Yahweh, have spoken.
translation:
  language: ru
  text: Ты станешь пищей для огня; кровь твоя[a] будет посреди страны. Тебя не вспомнят, потому что Я, Яхве, сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоя вина за пролитую кровь». Буквально: «твоя кровь»; в данном контексте выражение может подразумевать кровопролитие или вину за него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵשׁ ... לְאָכְלָה
  choice: пищей для огня
  rationale: Сочетание буквально представляет адресата как то, что предназначено огню на поглощение. Русское «пищей для огня» сохраняет исходный образ и звучит ясно и торжественно.
- source_word: תִּהְיֶה
  choice: ты станешь
  rationale: Форма обращена к персонифицированному объекту в женском роде; «станешь» естественно выражает предстоящий итог суда.
- source_word: דָּמֵךְ
  choice: кровь твоя
  rationale: Еврейский текст прямо говорит «твоя кровь». Такой перевод сохраняет образ и не превращает возможный смысл вины за кровь в однозначное толкование.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: посреди страны
  rationale: בְּתוֹךְ обозначает нахождение внутри, среди пространства; «посреди страны» сохраняет более выразительный смысл, чем простое «в стране».
- source_word: לֹא תִזָּכֵרִי
  choice: тебя больше не вспомнят
  rationale: Нифаль глагола זכר передаёт отсутствие последующего воспоминания об адресате. Слово «больше» естественно выражает переход к забвению, подразумеваемый контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: דִּבַּרְתִּי
  choice: сказал
  rationale: Перфект דבר в заключительной пророческой формуле выражает окончательность Божьего заявления; русское «сказал» передаёт это прямо и естественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Следует ли явно передать в דָּמֵךְ значение кровопролития или вины за кровь
  choice: кровь твоя
  alternative: твоя вина за пролитую кровь; пролитая тобою кровь
  rationale: Буквальное значение — «твоя кровь», тогда как значение кровопролития или вины возможно, но не выражено однозначно. Основной текст сохраняет эту смысловую напряжённость, а примечание сообщает альтернативу.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием пророческого приговора. Женский род обращения, явный в еврейском глаголе, естественно проявляется в контексте, хотя русские формы данного предложения его отдельно не маркируют.
