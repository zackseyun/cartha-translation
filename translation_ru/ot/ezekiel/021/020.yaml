  yaml_path: translation/ot/ezekiel/021/020.yaml
  text: so that the heart may melt and the stumbling blocks may be many[a]. At all their gates I have set the flash of the sword. Ah! It is made for lightning[b], drawn for slaughter.
translation:
  language: ru
  text: чтобы растаяло сердце и стало много падений[a]. У всех их ворот Я поставил блеск меча. Ах! Он сделан, чтобы сверкать, как молния, отточен для бойни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и многие споткнутся». Древнееврейское слово может указывать как на то, обо что спотыкаются, так и на само падение.'
    reason: lexical_alternative
  - marker: b
    text: 'Древнееврейский текст последней фразы труден для истолкования. Вместо «отточен для бойни» возможно: «обнажён для бойни» или «начищен для бойни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт значение цели или результата и естественно связывает стих с предшествующим контекстом.
- source_word: לָמוּג לֵב
  choice: чтобы растаяло сердце
  rationale: Сохраняет яркую древнееврейскую метафору утраты мужества; единственное число передано как собирательное.
- source_word: וְהַרְבֵּה הַמִּכְשֹׁלִים
  choice: и стало много падений
  rationale: מִכְשׁוֹל может обозначать как препятствие, о которое спотыкаются, так и последующее падение. В контексте суда «падения» звучит естественно, а неоднозначность отмечена в сноске.
- source_word: עַל כָּל שַׁעֲרֵיהֶם
  choice: у всех их ворот
  rationale: Естественно обозначает место, где меч угрожает каждому входу в город.
- source_word: נָתַתִּי
  choice: Я поставил
  rationale: В данном контексте глагол выражает намеренное размещение грозного оружия.
- source_word: אִבְחַת חָרֶב
  choice: сверкающий меч
  rationale: Редкое существительное, вероятно, указывает на блеск или вспышку меча. По-русски атрибутивная передача естественнее буквального «блеск меча» после глагола «поставил».
- source_word: אָח
  choice: Ах!
  rationale: Сохраняет внезапное эмоциональное восклицание, не определяя его однозначно как скорбь или торжество.
- source_word: עֲשׂוּיָה לְבָרָק
  choice: Он приготовлен сверкать молнией
  rationale: Передаёт образ молниеносного блеска и подразумеваемую готовность меча, избегая неестественного буквального выражения «сделан для молнии».
- source_word: מְעֻטָּה לְטָבַח
  choice: отточен для бойни
  rationale: Точная форма и значение редкого слова спорны, но контекст указывает на подготовку меча к убийству. Выбранное чтение ясно по-русски, а лексическая неопределённость сохранена в сноске.
