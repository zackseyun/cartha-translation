source:
  edition: WLC
  text: וְ/שָׁפַכְתִּ֤י עָלַ֨יִ/ךְ֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י אָפִ֣יחַ עָלָ֑יִ/ךְ וּ/נְתַתִּ֗י/ךְ בְּ/יַד֙ אֲנָשִׁ֣ים בֹּֽעֲרִ֔ים חָרָשֵׁ֖י מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/036.yaml
  text: And I will pour out my indignation on you[a]; with the fire of my wrath I will blow on you, and I will give you into the hand of brutal men[b], craftsmen of destruction.
translation:
  language: ru
  text: Я изолью на тебя Моё негодование; огнём Моей ярости дохну на тебя и отдам тебя в руки жестоких людей[a], искусных в разрушении[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пылающих людей»; возможно также: «свирепых людей».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «мастеров разрушения» или «кузнецов погибели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: Я изолью
  rationale: Сохраняет обычную для пророческой речи метафору излияния Божьего гнева и естественно звучит по-русски.
- source_word: זַעְמִי
  choice: Моё негодование
  rationale: Передаёт сильный гнев с оттенком осуждения и позволяет отличить это слово от עֶבְרָה в следующей строке.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: огнём Моей ярости
  rationale: Сохраняет образ огня и инструментальное значение предлога בְּ; «ярость» естественно передаёт интенсивность עֶבְרָה.
- source_word: אָפִיחַ
  choice: дохну на тебя
  rationale: Глагол в породе Hiphil означает «дуть, дохнуть» и здесь вызывает образ раздувания огня суда; «дохну» сохраняет образ без поясняющей вставки.
- source_word: וּנְתַתִּיךְ בְּיַד
  choice: и отдам тебя в руки
  rationale: Естественный русский эквивалент древнееврейской идиомы передачи кого-либо под чужую власть.
- source_word: אֲנָשִׁים בֹּעֲרִים
  choice: жестоких людей
  rationale: В контексте причастие בֹּעֲרִים характеризует людей, пылающих разрушительной свирепостью; буквальное «пылающих» в русском допускает неуместные толкования.
- source_word: חָרָשֵׁי מַשְׁחִית
  choice: искусных в разрушении
  rationale: Передаёт חָרָשׁ как умелого мастера и смысл необычного сочетания, не превращая образ в слишком буквальное и неясное «ремесленники разрушения».
theological_decisions:
- issue: 'Различение двух обозначений Божьего гнева: זַעַם и עֶבְרָה'
  choice: «негодование» и «ярость»
  alternative: 'Передать оба слова одинаково: «гнев» и «гнев»'
  rationale: Два близких, но различных слова образуют риторическое усиление; разные русские соответствия сохраняют это различие, не вводя дополнительной доктринальной интерпретации.
- issue: Образ אָפִיחַ при огне Божьей ярости
  choice: «дохну на тебя»
  alternative: «раздую против тебя»
  rationale: Выбранный вариант сохраняет прямую направленность действия на адресата и намеренную напряжённость исходного образа; вариант «раздую» яснее связывает действие с огнём, но добавляет подразумеваемый объект.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Заглавные местоименные формы относятся к говорящему Богу. Сохранены образы излияния, огня, дуновения и передачи в чужие руки; два трудных выражения снабжены примечаниями.
