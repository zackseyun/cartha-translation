source:
  edition: WLC
  text: בַּ/חֲז֥וֹת לָ/ךְ֙ שָׁ֔וְא בִּ/קְסָם לָ֖/ךְ כָּזָ֑ב לָ/תֵ֣ת אוֹתָ֗/ךְ אֶֽל צַוְּארֵי֙ חַֽלְלֵ֣י רְשָׁעִ֔ים אֲשֶׁר בָּ֣א יוֹמָ֔/ם בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/034.yaml
  text: while they see false visions for you and divine lies for you[a], to place you on the necks of the slain wicked[c][b], whose day has come at the time of the punishment of the end.
translation:
  language: ru
  text: В то время как о тебе видят ложные видения и о тебе предсказывают ложь[a], чтобы положить тебя на шеи сражённых нечестивцев[b], чей день настал в час окончательной кары[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда о тебе видят пустое и о тебе гадают ложь».'
    reason: Слова שָׁוְא и כָּזָב могут обозначать пустоту, ложь или обман; конструкции с בְּ допускают временное значение. «О тебе» передаёт направленность לָךְ.
  - marker: b
    text: 'Буквально: «на шеи сражённых нечестивцев». Образ неясен; возможно, речь о низвержении меча к уже убитым.'
    reason: Трудный конкретный образ сохранён в основном тексте без навязывания его толкования.
  - marker: c
    text: 'Или: «во время беззакония конца» либо «во время окончательной вины».'
    reason: עָוֺן может означать беззаконие, вину или наказание за неё; связь с קֵץ синтаксически сжата.
lexical_decisions:
- source_word: בַּחֲזוֹת לָךְ שָׁוְא
  choice: В то время как тебе видят ложные видения
  rationale: Инфинитив с בְּ передаёт сопутствующее или временное действие. Необычная конструкция «тебе видят» сохраняет направленность лживых видений в пользу аммонитского меча; подразумеваемый субъект — прорицатели.
- source_word: בִּקְסָם לָךְ כָּזָב
  choice: и предсказывают ложь
  rationale: קסם обозначает занятие гаданием или прорицанием. «Предсказывают ложь» естественно по-русски передаёт действие и его ложное содержание, сохраняя параллелизм с ложными видениями.
- source_word: לָתֵת אוֹתָךְ
  choice: чтобы положить тебя
  rationale: נתן с прямым дополнением и последующим אֶל здесь выражает помещение объекта в определённое положение. Женский род местоимения относится к мечу.
- source_word: אֶל צַוְּארֵי חַלְלֵי רְשָׁעִים
  choice: на шеи сражённых нечестивцев
  rationale: Конкретный, хотя и трудный, образ сохранён без истолковывающей замены. חַלְלֵי רְשָׁעִים понято как сражённые люди, являющиеся нечестивцами.
- source_word: אֲשֶׁר בָּא יוֹמָם
  choice: чей день настал
  rationale: Сохранён пророческий образ наступившего дня суда.
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: во время окончательной расплаты
  rationale: עָוֺן может обозначать не только беззаконие или вину, но и их кару; в формуле суда контекст поддерживает следственное значение. קֵץ передан как указание на окончательность, без искусственного русского сочетания «наказание конца».
theological_decisions:
- issue: Значение עֲוֺן в формуле суда
  choice: расплата
  alternative: беззаконие; вина; наказание
  rationale: Контекст говорит о наступлении дня нечестивцев, поэтому уместен смысл кары за вину. Сноска сохраняет реальную лексическую неоднозначность.
- issue: Образ «положить на шеи сражённых нечестивцев»
  choice: сохранить конкретный образ
  alternative: низвергнуть к сражённым нечестивцам; положить среди сражённых нечестивцев
  rationale: Еврейская метафора неясна; её не следует молча заменять истолковывающим пересказом.
translation_notes:
  register: Современный литературный русский с торжественным пророческим оттенком. Женские формы «тебе», «тебя» естественно соотносятся с подразумеваемым словом «меч» из контекста. Трудная метафора и неоднозначность заключительной формулы сохранены и пояснены в сносках.
