source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָסִיר֙ הַ/מִּצְנֶ֔פֶת וְ/הָרִ֖ים הָֽ/עֲטָרָ֑ה זֹ֣את לֹא זֹ֔את הַ/שָּׁפָ֣לָה הַגְבֵּ֔הַ וְ/הַ/גָּבֹ֖הַ הַשְׁפִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/031.yaml
  text: 'Thus says the Lord GOD: Remove the turban[a], and take off the crown. This will not remain the same: exalt the lowly[b], and humble the exalted.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Сними тюрбан[a] и убери венец. Всё будет не так, как прежде[b]: низкое возвысь, а высокое унизь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Тюрбан» может обозначать священнический головной убор, а «венец» — царскую власть. Здесь возвещается устранение знаков установленной власти.
    reason: cultural_note
  - marker: b
    text: 'Возможны также переводы: «Этого больше не будет» или «Всё будет уже не так». Еврейская фраза предельно кратка и эллиптична; она подчёркивает переворот прежнего порядка.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָסִיר
  choice: сними
  rationale: Побудительная форма требует прямого приказа удалить головной убор; «сними» естественно по-русски и соответствует контексту.
- source_word: הַמִּצְנֶפֶת
  choice: тюрбан
  rationale: Слово обозначает обёрнутый головной убор, в библейском употреблении нередко священнический; «тюрбан» понятно современному читателю и не архаично.
- source_word: וְהָרִים
  choice: и убери
  rationale: Буквально глагол означает «подними», но применительно к венцу в контексте лишения власти передаёт снятие или удаление; «убери» сохраняет приказ и звучит естественно.
- source_word: הָעֲטָרָה
  choice: венец
  rationale: עֲטָרָה означает венец или корону. «Венец» сохраняет возвышенный библейский регистр и символ царской власти, оставаясь понятным.
- source_word: זֹאת לֹא זֹאת
  choice: Всё уже не будет как прежде
  rationale: Краткая эллиптическая фраза буквально близка к «это — не это». Перевод передаёт прекращение прежнего порядка, не уточняя сверх текста, что именно его заменит.
- source_word: הַשָּׁפָלָה הַגְבֵּהַ
  choice: низкое возвысь
  rationale: Сохраняется предметно неопределённая форма оригинала и образ переворота установленного порядка; контекст допускает как людей, так и их положение.
- source_word: וְהַגָּבֹהַ הַשְׁפִּיל
  choice: а высокое унизь
  rationale: 'Антитетический параллелизм передан симметрично: низкое возвышается, высокое понижается.'
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: «Владыка» передаёт אֲדֹנָי, а традиционное «Господь» — имя יהוה; сочетание различает два элемента титула и естественно для русского библейского регистра.
theological_decisions:
- issue: Значение символов головного убора и венца
  choice: Не отождествлять их обладателей прямо в основном тексте
  alternative: Явно назвать священническую и царскую власть
  rationale: Тюрбан может указывать на священническое достоинство, а венец — на царское, однако сам стих не называет их носителей прямо. Пояснение вынесено в примечание.
- issue: Толкование эллиптической фразы זֹאת לֹא זֹאת
  choice: Всё уже не будет как прежде
  alternative: Этого больше не будет; Это — не то
  rationale: Выбранная формулировка передаёт крушение прежнего порядка, но не устраняет намеренную краткость и не определяет новый порядок точнее, чем еврейский текст.
- issue: Субстантивированные формы «низкое» и «высокое»
  choice: Сохранить средний род и смысловую открытость
  alternative: Возвысь униженного, а возвышенного унизь
  rationale: Еврейские формы допускают отнесение как к лицам, так и к их статусу или положению. Русское «низкое/высокое» сохраняет эту неоднозначность и мотив всеобщего переворота.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие повеления и симметрия заключительной антитезы сохранены; архаизмы сведены к общеупотребительному библейскому слову «венец».
