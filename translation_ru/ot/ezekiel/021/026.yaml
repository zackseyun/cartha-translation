  text: כִּֽי עָמַ֨ד מֶלֶךְ בָּבֶ֜ל אֶל אֵ֣ם הַ/דֶּ֗רֶךְ בְּ/רֹ֛אשׁ שְׁנֵ֥י הַ/דְּרָכִ֖ים לִ/קְסָם קָ֑סֶם קִלְקַ֤ל בַּֽ/חִצִּים֙ שָׁאַ֣ל בַּ/תְּרָפִ֔ים רָאָ֖ה בַּ/כָּבֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/026.yaml
  text: 'For the king of Babylon stands at the mother of the road[a], at the head of the two roads, to practice divination: he shakes the arrows, he consults the teraphim[c][b], he examines the liver.'
translation:
  language: ru
  text: 'Ибо царь Вавилона стоит у развилки, у начала двух дорог, чтобы гадать: он встряхивает стрелы, вопрошает терафимов[a], рассматривает печень[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Терафимы — культовые изображения, использовавшиеся для получения предзнаменований.
    reason: cultural_note
  - marker: b
    text: То есть осматривает печень для гадания.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующим пророческим высказыванием, не делая причинное значение чрезмерно жёстким.
- source_word: עָמַד
  choice: остановился
  rationale: В данном дорожном контексте форма описывает занятую царём позицию у развилки; русское прошедшее время естественно передаёт завершённое действие в пророческом видении.
- source_word: אֵם הַדֶּרֶךְ
  choice: у развилки
  rationale: Буквально «у матери дороги»; это образное обозначение исходной точки, где дорога разветвляется. Идиоматический перевод ясен современному читателю.
- source_word: בְּרֹאשׁ שְׁנֵי הַדְּרָכִים
  choice: там, где начинаются две дороги
  rationale: Передаёт пространственный образ «во главе двух дорог» естественным русским выражением и поясняет параллельную фразу о развилке.
- source_word: לִקְסָם קָסֶם
  choice: чтобы совершить гадание
  rationale: Инфинитив с однокоренным существительным обозначает целенаправленное совершение гадательного обряда.
- source_word: קִלְקַל בַּחִצִּים
  choice: он встряхивает стрелы
  rationale: Сохраняет конкретное действие с гадательными стрелами и не добавляет не выраженных в тексте технических подробностей.
- source_word: שָׁאַל בַּתְּרָפִים
  choice: вопрошает терафимов
  rationale: Глагол передаёт обращение за ответом, а транслитерация сохраняет культурно-религиозный термин без спорного сужения до домашних божеств.
- source_word: רָאָה בַּכָּבֵד
  choice: рассматривает печень
  rationale: Передаёт осмотр печени с целью гадания; назначение действия ясно из вводной фразы и дополнительно раскрыто в сноске.
theological_decisions:
- issue: Передача языческих гадательных практик без смягчения или добавочной полемики
  choice: 'Сохранён конкретный перечень: стрелы, терафимы и осмотр печени.'
  alternative: Обобщить весь перечень выражением «ищет предзнаменований».
  rationale: Еврейский текст намеренно называет отдельные способы гадания; их сохранение передаёт историческую конкретность и пророческую напряжённость, не добавляя конфессиональной оценки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Редкие культурные реалии сохранены там, где замена могла бы чрезмерно сузить значение; они кратко объяснены в сносках. Буквальное «мать дороги» заменено естественным «развилка», поскольку в русском буквальная калька затемняет смысл.
