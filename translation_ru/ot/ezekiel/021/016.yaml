base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/016.yaml
  text: It is given to be polished[a], to be grasped in the hand. It is sharpened—the sword—and it is polished[c][b], to put it into the hand of a slayer.
translation:
  language: ru
  text: Его дали[a], чтобы отполировать и взять в руку[b]. Он заточен — этот меч — и отполирован, чтобы вложить его в руку убийцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и он дал его»; тот, кто дал меч, в этой строке прямо не назван.'
    reason: textual_ambiguity
  - marker: b
    text: 'Буквально: «в ладонь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָהּ
  choice: Его отдали
  rationale: Глагольная форма буквально означает «и он отдал его», однако подлежащее в самой строке не названо. Неопределённо-личная конструкция сохраняет эту недосказанность и естественно звучит по-русски; мужской род местоимения обусловлен русским словом «меч».
- source_word: לְמָרְטָה / מֹרָטָּה
  choice: начистить до блеска / начищен до блеска
  rationale: Корень מרט применительно к клинку обозначает полировку до блеска. Выражение понятно современному читателю и сохраняет повтор исходного текста.
- source_word: לִתְפֹּשׂ בַּכָּף
  choice: взять в руку
  rationale: Сочетание передаёт взятие оружия ладонью, то есть в руку. Такая формулировка естественнее буквального «схватить в ладони».
- source_word: הוּחַדָּה חֶרֶב
  choice: Он заточен — этот меч
  rationale: Пассивная форма от חדד означает «быть заточенным». Вставная конструкция сохраняет резкое приложение «меч» и пророческую напряжённость строки.
- source_word: לָתֵת אֹתָהּ בְּיַד
  choice: чтобы вложить его в руку
  rationale: Буквальный образ передачи меча в чью-либо руку сохранён без отвлечённого истолкования как передачи власти.
- source_word: הוֹרֵג
  choice: убийцы
  rationale: Действительное причастие от הרג обозначает того, кто убивает. «Убийца» кратко и выразительно передаёт функцию названного лица, не уточняя его личность.
