  source_fidelity: Нужна правка двух мест. בְּהִגָּלוֹת — инфинитив нифаля («когда/при том что ваши преступления раскрываются»), поэтому активное «обнажив свои преступления» необоснованно делает адресатов субъектом раскрытия. В заключении בַּכַּף обозначает попадание в чью-либо руку/власть, а не орудие действия («схвачены рукой»).
  naturalness: «Владыка Яхве» и общий пророческий регистр приемлемы для современного литературного русского. «Вы попадёте в руки» — естественный русский оборот, который сохраняет образ захвата без добавления конкретного захватчика.
  terminology: «Вина», «преступления», «грехи» удачно передают различение עון, פשע и חטאות. Повтор «напомнили — вспомнили» сохраняет заметную игру форм זכר. Имя Яхве последовательно передаёт יהוה.
