base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/029.yaml
  text: 'Therefore thus says the Lord GOD: Because you have brought your guilt to remembrance by uncovering your transgressions[a], so that your sins are seen in all your deeds, because you have come to remembrance[b], you will be seized by the hand.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «За то, что вы напомнили о своей вине, когда раскрылись ваши преступления, так что ваши грехи видны во всех ваших делах, — за то, что о вас вспомнили, вы попадёте в руки[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку». Или: «вы будете захвачены в чью-то руку», то есть окажетесь во власти врага.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание передаёт титул אֲדֹנָי и личное имя יהוה без неестественного повтора «Господь Господь».
- source_word: הַזְכַּרְכֶם עֲוֺנְכֶם
  choice: вы напомнили о своей вине
  rationale: Каузативная форма זכר означает, что адресаты своими поступками вызвали воспоминание об их вине; формулировка также позволяет сохранить повтор корня далее в стихе.
- source_word: בְּהִגָּלוֹת פִּשְׁעֵיכֶם
  choice: обнажив свои преступления
  rationale: Инфинитив גלה выражает сопутствующее средство или обстоятельство, а «обнажив» сохраняет образ раскрытия того, что было скрыто.
- source_word: לְהֵרָאוֹת חַטֹּאתֵיכֶם
  choice: так что ваши грехи видны
  rationale: Передаёт результирующее значение конструкции и пассивный смысл формы ראה.
- source_word: עֲלִילוֹתֵיכֶם
  choice: ваши дела
  rationale: Нейтрально и широко обозначает поступки; отрицательная оценка ясна из контекста.
- source_word: הִזָּכֶרְכֶם
  choice: о вас вспомнили
  rationale: Пассивное прочтение сохраняет намеренный повтор זכר и указывает, что сами адресаты теперь оказались предметом воспоминания в контексте суда.
- source_word: בַּכַּף תִּתָּפֵשׂוּ
  choice: вы будете схвачены рукой
  rationale: Сохраняет буквальный образ руки или ладони как силы, захватывающей осуждённых, хотя по-русски оборот намеренно звучит несколько образно.
theological_decisions:
- issue: Передача сложного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбор различает титул и личное имя Бога и непосредственно передаёт тетраграмматон, не внося конфессионального толкования.
- issue: Субъект воспоминания в выражении הִזָּכֶרְכֶם
  choice: о вас вспомнили
  alternative: вы напомнили о себе
  rationale: В еврейском тексте субъект того, кто вспоминает, не назван. Пассивная русская конструкция сохраняет эту недосказанность и судебное напряжение контекста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Повтор «напомнили — вспомнили» намеренно воспроизводит риторический повтор еврейского корня זכר. Синтаксис слегка приподнят, но остаётся понятным современному читателю.
