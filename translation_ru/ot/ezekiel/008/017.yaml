  source_fidelity: 'Основной смысл передан верно, включая масоретское «к их носу» и сохранение неясности заключительного жеста. Однако «Неужели дому Иуды мало совершать...» способно звучать так, будто речь идёт о количественной недостаточности самих мерзостей, а не о риторическом вопросе: неужели им недостаточно уже совершать эти мерзости, что они совершают дальнейшее зло. Кроме того, «которые они совершают здесь» сглаживает совершенный вид еврейского עָשׂוּ («совершили»).'
  naturalness: Текст в целом литературен и соответствует пророческому регистру. Перестройка риторического вопроса с «недостаточно» и «ещё и» делает логическую связь между злодеяниями более ясной и естественной, не добавляя толкования.
  terminology: «Сын человеческий», «дом Иуды», «мерзости», «насилие» и «ветвь» удачны. «Вновь стали гневить Меня» точнее передаёт повторность וַיָּשֻׁבוּ и каузативный смысл לְהַכְעִיסֵנִי, чем настоящее время «снова вызывают Мой гнев».
