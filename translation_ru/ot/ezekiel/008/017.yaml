base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/017.yaml
  text: Then he said to me[a], “Have you seen, son of man? Is it too trivial a thing for the house of Judah to do the abominations that they have done here, that they should also fill the land with violence and turn again to provoke me? And behold[b], they are putting the branch to their nose.”
translation:
  language: ru
  text: 'И Он сказал мне: «Видел ли ты, сын человеческий? Разве дому Иуды недостаточно совершать мерзости, которые они совершили здесь, — что они ещё и наполнили землю насилием и вновь стали гневить Меня? И вот, они подносят ветвь к своему носу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Смысл выражения «подносят ветвь к своему носу» неясен; возможно, речь идёт об идолопоклонническом обрядовом жесте. Некоторые древние свидетели дают чтение: «подносят ветвь к Моему носу»; еврейский текст гласит: «к их носу».'
    reason: textual_variant_and_cultural_note
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Видел ли ты
  rationale: Вопросительная форма Qal perfect 2 м. ед. указывает на только что показанное Иезекиилю и естественно передаётся риторическим вопросом.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет характерное и повторяющееся обращение к пророку в книге Иезекииля.
- source_word: הֲנָקֵל לְבֵית יְהוּדָה
  choice: Неужели дому Иуды мало
  rationale: 'Передаёт риторическую силу נקל: мерзости словно недостаточны или незначительны для дома Иуды; по-русски оборот «неужели мало» звучит естественно.'
- source_word: הַתּוֹעֵבוֹת
  choice: мерзости
  rationale: Устойчиво передаёт сильную нравственно-религиозную оценку идолопоклоннических действий.
- source_word: מָלְאוּ אֶת הָאָרֶץ חָמָס
  choice: наполнили землю насилием
  rationale: חָמָס включает насилие и жестокую несправедливость; «насилие» сохраняет прямой смысл в пророческом контексте.
- source_word: וַיָּשֻׁבוּ לְהַכְעִיסֵנִי
  choice: снова вызывают Мой гнев
  rationale: Передаёт повторность действия и каузативный смысл הכעיס естественным современным русским выражением.
- source_word: וְהִנָּם
  choice: И вот
  rationale: Сохраняет указательную и привлекающую внимание функцию частицы без излишней архаизации.
- source_word: שֹׁלְחִים אֶת הַזְּמוֹרָה
  choice: подносят ветвь
  rationale: «Подносят» передаёт направленное движение жеста, не навязывая конкретного толкования неясного обряда; זְמוֹרָה оставлено широким словом «ветвь».
- source_word: אֶל אַפָּם
  choice: к своему носу
  rationale: Следует масоретскому тексту с местоименным суффиксом 3 мн. числа и сохраняет неясность выражения.
theological_decisions:
- issue: Неясный заключительный жест и вариант местоимения
  choice: «они подносят ветвь к своему носу»
  alternative: «они подносят ветвь к Моему носу»; истолкование как конкретного языческого обряда
  rationale: Основной текст прозрачно следует WLC/масоретскому чтению «их нос» и не определяет смысл обряда. Древний вариант «Моему носу» и возможный ритуальный фон отмечены в сноске, чтобы не устранять текстовую и смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены «дом Иуды» и «сын человеческий» как значимые повторяющиеся библейские выражения; финальная трудность не сглажена и не истолкована в основном тексте.
