  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל חֲצַ֣ר בֵּית יְהוָה֮ הַ/פְּנִימִית֒ וְ/הִנֵּה פֶ֜תַח הֵיכַ֣ל יְהוָ֗ה בֵּ֤ין הָֽ/אוּלָם֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ כְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ אֲחֹ֨רֵי/הֶ֜ם אֶל הֵיכַ֤ל יְהוָה֙ וּ/פְנֵי/הֶ֣ם קֵ֔דְמָ/ה וְ/הֵ֛מָּה מִשְׁתַּחֲוִיתֶ֥ם קֵ֖דְמָ/ה לַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/016.yaml
  text: Then he brought me into the inner court of the house of Yahweh[a], and behold, at the entrance of the temple of Yahweh, between the porch and the altar, were about twenty-five men, with their backs toward the temple of Yahweh and their faces toward the east[b]; and they were bowing down toward the east to the sun.
translation:
  language: ru
  text: И привёл он меня во внутренний двор дома Яхве[a]. И вот, у входа в храм Яхве, между притвором и жертвенником, стояло около двадцати пяти человек. Они были повёрнуты спиной к храму Яхве, а лицом — на восток, и простирались ниц[b] к востоку, перед солнцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (YHWH).
    reason: divine_name
  - marker: b
    text: 'Или: «поклонялись солнцу». Еврейский глагол обозначает простирание ниц или глубокий поклон, в данном контексте — как акт почитания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: И привёл он меня
  rationale: Последовательная глагольная форма продолжает повествование; порядок слов сохраняет связь с действующим лицом предыдущего контекста и естественно звучит по-русски.
- source_word: חֲצַר בֵּית־יְהוָה הַפְּנִימִית
  choice: во внутренний двор дома Яхве
  rationale: חָצֵר передано как «двор», а בֵּית־יְהוָה — буквально как «дом Яхве», без преждевременной замены на «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Оборот вводит яркую новую сцену видения; русское «И вот» передаёт его указательную и повествовательную функцию.
- source_word: פֶּתַח הֵיכַל יְהוָה
  choice: у входа в храм Яхве
  rationale: פֶּתַח означает вход или проём, а הֵיכָל в данном храмовом контексте — храмовое святилище.
- source_word: בֵּין הָאוּלָם וּבֵין הַמִּזְבֵּחַ
  choice: между притвором и жертвенником
  rationale: אוּלָם обозначает храмовый притвор; традиционные русские храмовые термины здесь точны и понятны.
- source_word: כְּעֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: около двадцати пяти человек
  rationale: Префикс כְּ при числительном выражает приблизительность; אִישׁ после числа естественно передаётся собирательным «человек».
- source_word: אֲחֹרֵיהֶם אֶל הֵיכַל יְהוָה וּפְנֵיהֶם קֵדְמָה
  choice: Они были повёрнуты спиной к храму Яхве, а лицом — на восток
  rationale: Формулировка сохраняет резкое пространственное противопоставление спины и лица, не добавляя мотивации персонажей.
- source_word: מִשְׁתַּחֲוִיתֶם
  choice: простирались ниц
  rationale: Глагол обозначает телесное простирание или низкий поклон, часто как акт поклонения; конкретное действие сохранено в основном тексте.
- source_word: קֵדְמָה לַשָּׁמֶשׁ
  choice: к востоку, перед солнцем
  rationale: Переданы и направление קֵדְמָה, и объект действия לַשָּׁמֶשׁ; такая формулировка сохраняет риторический повтор восточной ориентации.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не подменяет его титулом.
- issue: Характер действия מִשְׁתַּחֲוִיתֶם
  choice: простирались ниц ... перед солнцем
  alternative: поклонялись солнцу
  rationale: Основной текст сохраняет наблюдаемое телесное действие, тогда как культовый смысл остаётся очевидным из направленности действия на солнце; более истолковывающий вариант дан в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены повтор имени Яхве, пространственное противопоставление и конкретный жест поклонения; синтаксис разделён на два предложения для ясности без изменения содержания.
