base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/010.yaml
  text: So I went in and looked[a], and behold, every form of creeping thing and detestable beast, and all the idols of the house of Israel, were engraved on the wall all around.
translation:
  language: ru
  text: 'И я вошёл и увидел: вот, всевозможные изображения пресмыкающихся и мерзких животных, и все идолы[a] дома Израиля были высечены на стене кругом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово גִּלּוּלִים («идолы») имеет резко презрительную окраску; возможна передача: «навозные идолы» или «мерзкие идолы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבוֹא וָאֶרְאֶה
  choice: И я вошёл и увидел
  rationale: 'Последовательность форм продвигает повествование: Иезекииль входит и видит открывшуюся ему сцену. Русское «увидел» прямо передаёт ראה и естественно сочетается с последующим «вот».'
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет живость и внезапность пророческого предъявления увиденного.
- source_word: כָל תַּבְנִית
  choice: всевозможные изображения
  rationale: תַּבְנִית означает форму, подобие или изображение; контекст вырезанных на стене фигур позволяет естественно употребить «изображения». כָל здесь передано идиоматическим собирательным «всевозможные».
- source_word: רֶמֶשׂ
  choice: пресмыкающихся
  rationale: Слово охватывает ползающих существ; «пресмыкающиеся» понятно современному читателю и сохраняет библейскую категорию существ.
- source_word: וּבְהֵמָה שֶׁקֶץ
  choice: и мерзких животных
  rationale: בְּהֵמָה имеет широкое значение «животное», а שֶׁקֶץ выражает отвращение и может определять изображённых животных как мерзких.
- source_word: גִּלּוּלֵי
  choice: идолы[a]
  rationale: «Идолы» ясно и естественно передаёт предмет обозначения, а резко презрительный оттенок еврейского термина отмечен в сноске.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дома Израиля
  rationale: Сохранено устойчивое пророческое обозначение народа завета без упрощения до одного имени «Израиль».
- source_word: מְחֻקֶּה עַל הַקִּיר סָבִיב סָבִיב
  choice: были вырезаны по всей стене вокруг
  rationale: Причастие от חקק указывает на вырезанные или выгравированные фигуры; повтор סָבִיב סָבִיב подчёркивает, что они покрывали стену кругом.
theological_decisions:
- issue: Презрительная окраска обозначения идолов у Иезекииля
  choice: В основном тексте — «идолы», с пояснением в сноске
  alternative: «навозные идолы» или «мерзкие идолы»
  rationale: Основной вариант остаётся естественным и понятным по-русски, а сноска сохраняет намеренно уничижительную силу גִּלּוּלִים, не навязывая читателю спорную этимологическую конкретизацию.
- issue: Синтаксическая связь שֶׁקֶץ
  choice: «мерзких животных»
  alternative: «животных — мерзость» / «мерзких существ»
  rationale: Еврейская последовательность допускает тесную связь оценочного слова с животными. Выбранный вариант естественен по-русски, не превращает выражение в техническое догматическое определение и сохраняет оценку изображений как отвратительных.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческого повествования. «Вот» передаёт зрительную непосредственность видения; лексика понятна широкому читателю без архаизации.
