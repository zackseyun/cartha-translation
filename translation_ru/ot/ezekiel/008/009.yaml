  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֹּ֤א וּ/רְאֵה֙ אֶת הַ/תּוֹעֵב֣וֹת הָ/רָע֔וֹת אֲשֶׁ֛ר הֵ֥ם עֹשִׂ֖ים פֹּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/009.yaml
  text: And he said to me, “Come and see the evil abominations that they are doing here.”
translation:
  language: ru
  text: 'И Он сказал мне: «Войди и посмотри на злые мерзости, которые они здесь совершают».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא
  choice: «войди»
  rationale: В данном контексте пророку велено пройти через обнаруженный вход; «войди» точнее передаёт пространственный смысл, чем общее «приди».
- source_word: הַתּוֹעֵבוֹת הָרָעוֹת
  choice: «злые мерзости»
  rationale: Сохранены и сильное культово-нравственное значение תּוֹעֵבוֹת («мерзости»), и отдельная отрицательная характеристика רָעוֹת («злые»), без сведения выражения к нейтральному «дурные дела».
- source_word: עֹשִׂים
  choice: «совершают»
  rationale: По-русски глагол «совершать» естественно сочетается с тяжкими предосудительными поступками и сохраняет значение продолжающихся действий.
- source_word: פֹּה
  choice: «здесь»
  rationale: Прямо передаёт указание на место происходящего.
theological_decisions:
- issue: Сохранение одновременно культового и нравственного осуждения
  choice: «злые мерзости»
  alternative: «отвратительные дела»
  rationale: Выбранный вариант сохраняет резкость и религиозно-нравственную нагрузку исходного תּוֹעֵבוֹת, а прилагательное «злые» отдельно передаёт רָעוֹת, не уточняя сверх текста характер увиденного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавное «Он» употреблено как традиционное местоименное обозначение божественного говорящего; дополнительных пояснений и конфессионально окрашенной терминологии нет.
