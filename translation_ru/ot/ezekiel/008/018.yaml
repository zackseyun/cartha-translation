base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/018.yaml
  text: And I also will act in wrath; my eye will not spare[a], nor will I have compassion. Though they cry in my ears with a loud voice, I will not hear them.
translation:
  language: ru
  text: 'И Я тоже поступлю в ярости: Моё око не пощадит, и Я не помилую. Хотя они будут громко взывать Мне в уши, Я их не услышу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: И Я тоже
  rationale: Сохраняет присоединительное значение וְגַם и подчёркивание, создаваемое явным местоимением אֲנִי, в естественной русской форме.
- source_word: אֶעֱשֶׂה בְחֵמָה
  choice: поступлю в ярости
  rationale: Глагол עשה здесь обозначает решительное действие, а חֵמָה — сильный, пылающий гнев; сочетание передаёт судебный контекст, не конкретизируя действие сверх текста.
- source_word: לֹא תָחוֹס עֵינִי
  choice: Моё око не пощадит
  rationale: Сохранён образный еврейский оборот с «оком» и значение חס — не щадить; возвышенное «око» уместно в прямой божественной речи и понятно современному читателю.
- source_word: וְלֹא אֶחְמֹל
  choice: и Я не помилую
  rationale: Передаёт оттенок сострадания и жалости в חמל, не дублируя дословно предыдущее «не пощадит».
- source_word: וְקָרְאוּ בְאָזְנַי קוֹל גָּדוֹל
  choice: Хотя они будут громко взывать Мне в уши
  rationale: «Хотя» естественно выражает подразумеваемое уступительное отношение к последующему отказу; «Мне в уши» сохраняет конкретный образ בְאָזְנַי, а «громко взывать» естественно передаёт קוֹל גָּדוֹל.
- source_word: וְלֹא אֶשְׁמַע אוֹתָם
  choice: Я их не услышу
  rationale: Прямо передаёт שמע; в данном контексте слуховой глагол подразумевает отказ откликнуться, не требуя поясняющей парафразы.
theological_decisions:
- issue: Резкость языка Божьего суда
  choice: 'Сохранить прямую речь: «в ярости», «Моё око не пощадит», «Я не помилую»'
  alternative: Смягчить до абстрактного выражения вроде «Я сурово накажу их и не проявлю милости»
  rationale: Еврейский текст намеренно изображает Божий суд в личных, сильных и антропоморфных выражениях; смягчение устранило бы его напряжённость.
- issue: Связь между воплем народа и отказом Бога услышать
  choice: 'Передать уступительно: «Хотя они будут… взывать… Я их не услышу»'
  alternative: 'Сохранить простое сочинение: «И они будут… взывать, но Я их не услышу»'
  rationale: Формально וְ — простой союз, однако контекст ясно создаёт уступительно-противительную связь. Выбранная формулировка делает её естественной по-русски, не меняя смысла.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Слова «око» и «взывать» слегка возвышенны, но прозрачны и помогают сохранить конкретность и торжественную суровость оригинала; синтаксис остаётся доступным обычному читателю.
