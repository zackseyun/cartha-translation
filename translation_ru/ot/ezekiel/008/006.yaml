  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/רֹאֶ֥ה אַתָּ֖ה מ/הם עֹשִׂ֑ים תּוֹעֵב֨וֹת גְּדֹל֜וֹת אֲשֶׁ֥ר בֵּֽית יִשְׂרָאֵ֣ל עֹשִׂ֣ים פֹּ֗ה לְ/רָֽחֳקָה֙ מֵ/עַ֣ל מִקְדָּשִׁ֔/י וְ/עוֹד֙ תָּשׁ֣וּב תִּרְאֶ֔ה תּוֹעֵב֖וֹת גְּדֹלֽוֹת־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/006.yaml
  text: And he said to me[a], “Son of man, do you see what they are doing, the great abominations that the house of Israel is doing here[b], to drive me far from my sanctuary? Yet you will see even greater abominations.”
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий, видишь ли ты, что они делают — великие мерзости, которые дом Израиля совершает здесь, вынуждая Меня удалиться далеко от Моего святилища[a]? Но ты увидишь ещё большие мерзости[b]».


    [a] Возможный перевод: «чтобы Мне удалиться далеко от Моего святилища»; еврейскую конструкцию можно также понять как «далеко от Моего святилища».

    [b] Буквально: «великие мерзости»; в еврейском тексте это выражение повторено, а слова «ещё большие» передают нарастание в контексте.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «чтобы Мне удалиться далеко от Моего святилища»; еврейскую конструкцию можно также понять как «далеко от Моего святилища».'
    reason: Сохраняет синтаксическую неоднозначность выражения לְרָחֳקָה מֵעַל מִקְדָּשִׁי.
  - marker: b
    text: 'Буквально: «великие мерзости»; в еврейском тексте это выражение повторено, а слова «ещё большие» передают нарастание в контексте.'
    reason: Объясняет сравнительную передачу повторённого еврейского выражения.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивое пророческое обращение в книге Иезекииля и близко передаёт еврейское выражение, которое подчёркивает человеческую природу адресата.
- source_word: הֲרֹאֶה אַתָּה
  choice: видишь ли ты
  rationale: Естественно передаёт прямой вопрос с еврейским причастием настоящего времени.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: великие мерзости
  rationale: Слово «мерзости» сохраняет сильную религиозно-нравственную окраску תּוֹעֵבוֹת, а «великие» передаёт интенсивность גְּדֹלוֹת.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Формально близко передаёт коллективное заветное наименование Израиля, характерное для пророческой речи.
- source_word: פֹּה
  choice: здесь
  rationale: Краткий и естественный эквивалент указательного наречия.
- source_word: לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  choice: вынуждая Меня удалиться далеко от Моего святилища
  rationale: 'Передаёт наиболее вероятный в контексте смысл: совершаемые мерзости становятся причиной удаления Бога от принадлежащего Ему святилища. Неоднозначность конструкции отмечена в сноске.'
- source_word: מִקְדָּשִׁי
  choice: Моего святилища
  rationale: «Святилище» точнее, чем более узкое «храм», передаёт מִקְדָּשׁ и сохраняет притяжательный суффикс первого лица.
- source_word: וְעוֹד תָּשׁוּב תִּרְאֶה
  choice: Но ты увидишь ещё
  rationale: Естественно передаёт продолжение видения и переход к следующей, усиливающей сцене, не воспроизводя буквально идиоматическое сочетание «снова/обратившись увидишь».
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: ещё большие мерзости
  rationale: Хотя еврейский текст повторяет «великие мерзости», контекст указывает на нарастание; русская сравнительная конструкция естественно выражает этот смысл.
theological_decisions:
- issue: Кого или что обозначает удаление в לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  choice: Мерзости вынуждают Бога удалиться от Его святилища
  alternative: Мерзости совершаются далеко от святилища; либо действия народа удаляют других от святилища
  rationale: Контекст книги Иезекииля и притяжательная форма «Моего святилища» поддерживают понимание ухода Божьего присутствия. Поскольку сама еврейская конструкция допускает иные способы синтаксического понимания, они не исключены молча, а отражены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены традиционные библейские выражения «Сын человеческий», «дом Израиля» и «святилище»; синтаксис упрощён лишь настолько, чтобы вопрос звучал естественно и ясно.
