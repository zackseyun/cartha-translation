  text: And behold[a], there was the glory of the God of Israel, like the appearance that I had seen in the valley.
translation:
  language: ru
  text: И вот, там была слава Бога Израиля, подобная тому явлению, которое я видел в долине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
