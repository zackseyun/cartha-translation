lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт повествовательный переход и внезапность зрительного восприятия; оборот естественен для современного литературного русского языка и сохраняет приподнятость пророческого рассказа.
- source_word: שָׁם
  choice: там была
  rationale: Сохраняет пространственное значение наречия и образует естественную русскую конструкцию со словом «слава».
- source_word: כְּבוֹד
  choice: слава
  rationale: Устоявшийся эквивалент в контексте явленного Божьего присутствия; сохраняет как зрительную, так и богословскую насыщенность слова без пояснительной надбавки.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямо и естественно передаёт еврейскую сопряжённую конструкцию и сохраняет именование Бога по Его отношению к Израилю.
- source_word: כַּמַּרְאֶה
  choice: такая же, как явление
  rationale: Передаёт сравнительную частицу כ и зрительный смысл מַרְאֶה; согласование «такая же» со «славой» делает фразу естественной по-русски, не отождествляя явление с видением как событием.
- source_word: אֲשֶׁר רָאִיתִי
  choice: которое я видел
  rationale: Нейтрально и точно указывает на ранее увиденное; русская форма прошедшего времени сама передаёт ретроспективную связь без необходимости в дополнительном временном показателе.
- source_word: בַּבִּקְעָה
  choice: в долине
  rationale: בִּקְעָה обозначает широкую долину или равнину. «В долине» естественно по-русски и соответствует вероятной отсылке к Иез 3:22–23; допустимая альтернатива сохранена в примечании.
theological_decisions:
- issue: Характер «славы Бога Израиля»
  choice: Передать выражение прямо, как видимое проявление Божьей славы, без поясняющих добавлений.
  alternative: «Видимое сияние Божьего присутствия» или специальный термин для богоявления.
  rationale: Еврейский текст говорит, что там находилась слава Бога Израиля, и сопоставляет её с прежним явлением. Перевод сохраняет силу богоявления, но не определяет его природу подробнее, чем сам стих.
- issue: Соотношение славы и прежнего явления
  choice: 'Сохранить сравнение: «такая же, как явление».'
  alternative: Отождествить их формулой «то самое видение».
  rationale: Частица כ выражает подобие или соответствие, поэтому перевод не должен без достаточного основания превращать сравнение в полное тождество.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «И вот» сохраняет живость пророческого видения; синтаксис остаётся ясным для обычного читателя. Маркер [a] помещён непосредственно после слова, к которому относится примечание.
