  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שִּׁשִּׁ֗ית בַּ/שִּׁשִּׁי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ אֲנִי֙ יוֹשֵׁ֣ב בְּ/בֵיתִ֔/י וְ/זִקְנֵ֥י יְהוּדָ֖ה יוֹשְׁבִ֣ים לְ/פָנָ֑/י וַ/תִּפֹּ֤ל עָלַ/י֙ שָׁ֔ם יַ֖ד אֲדֹנָ֥/י יְהֹוִֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/001.yaml
  text: And it happened in the sixth year[a], in the sixth month, on the fifth day of the month, as I was sitting in my house and the elders of Judah were sitting before me[b], that the hand of the Lord GOD fell upon me there.
translation:
  language: ru
  text: И было в шестой год, в шестом месяце, в пятый день месяца, когда я сидел у себя дома и старейшины Иудеи сидели передо мной, рука Владыки Яхве сошла на меня там.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господа Бога». Еврейское выражение אֲדֹנָי יְהוִה сочетает титул «Владыка» с Божьим именем Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Кратко и сдержанно передаёт повествовательную формулу, вводящую новую сцену, не прибегая к тяжеловесному «и случилось».
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: в шестой год
  rationale: Сохраняет лаконичность еврейской датировки и не добавляет подразумеваемое, но прямо не названное «плена».
- source_word: בַּשִּׁשִּׁי בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: в шестом месяце, в пятый день месяца
  rationale: Точно и естественно передаёт полную формулу даты.
- source_word: אֲנִי יוֹשֵׁב בְּבֵיתִי
  choice: я сидел у себя дома
  rationale: Причастная конструкция обозначает продолжающееся фоновое действие; «у себя дома» естественно передаёт בְּבֵיתִי.
- source_word: וְזִקְנֵי יְהוּדָה
  choice: и старейшины Иудеи
  rationale: «Старейшины» обозначает признанных руководителей народа, а «Иудеи» прозрачно передаёт конструкцию принадлежности.
- source_word: יוֹשְׁבִים לְפָנָי
  choice: сидели передо мной
  rationale: Сохраняет пространственный образ и ситуацию собрания у пророка.
- source_word: וַתִּפֹּל עָלַי
  choice: сошла на меня
  rationale: Русское «сошла на меня рука» сохраняет образ внезапного властного воздействия и звучит естественнее буквального «упала на меня».
- source_word: שָׁם
  choice: там
  rationale: Сохранено основное локативное значение наречия, без замены на временное «тогда».
- source_word: יַד
  choice: рука
  rationale: Сохранён устойчивый пророческий образ Божьей силы и властного воздействия, а не заменён толкованием «сила».
- source_word: אֲדֹנָי יְהוִה
  choice: Владыки Яхве
  rationale: Передаёт сочетание титула אֲדֹנָי и личного божественного имени יהוה, избегая слияния обоих компонентов в одно обращение.
theological_decisions:
- issue: Передача יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыки Яхве
  alternative: Господа Бога; Владыки ГОСПОДА
  rationale: Исходный текст содержит титул и собственное имя. «Владыка Яхве» сохраняет оба элемента и не подменяет имя общим титулом; сноска указывает традиционный вариант.
- issue: Характер выражения «рука Владыки Яхве»
  choice: Сохранить телесный образ без пояснения в основном тексте
  alternative: сила Владыки Яхве овладела мной
  rationale: Идиома допускает представление о силе, власти или пророческом воздействии Бога, но сам стих не уточняет механизм; буквальный образ сохраняет эту смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Две самостоятельные части разделены двоеточием и точкой, чтобы длинная датировочная конструкция оставалась ясной. Локативное «там» сохранено согласно еврейскому тексту.
