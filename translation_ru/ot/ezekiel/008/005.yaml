base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/005.yaml
  text: Then he said to me[a], “Son of man, please lift up your eyes toward the north.” So I lifted up my eyes toward the north, and behold, north of the gate of the altar was this image of jealousy at the entrance.
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий, подними, пожалуйста, глаза к северу». Я поднял глаза к северу, и вот: к северу от ворот жертвенника, у входа, стояло это изображение ревности[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идол ревности»; или: «изображение, вызывающее ревность». Еврейское выражение кратко и может указывать либо на характер изображения, либо на то, что оно вызывает Божью ревность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устойчивое обращение к Иезекиилю; сохраняет еврейский образ, литературную форму и богословский резонанс.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: подними, пожалуйста, глаза
  rationale: Передаёт образное выражение «поднять глаза», а «пожалуйста» отражает вежливую частицу נָא.
- source_word: דֶּרֶךְ צָפוֹנָה
  choice: к северу
  rationale: Естественно передаёт направление, выраженное сочетанием דֶּרֶךְ и направительным окончанием.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную силу частицы и живость пророческого видения.
- source_word: מִצָּפוֹן
  choice: к северу от
  rationale: В данном контексте обозначает положение относительно ворот, а не движение с севера.
- source_word: לְשַׁעַר הַמִּזְבֵּחַ
  choice: от ворот жертвенника
  rationale: Сохраняет формальную связь существительных, не уточняя неоднозначное архитектурное устройство.
- source_word: סֵמֶל
  choice: изображение
  rationale: Передаёт общее значение образа или изваяния, не делая слово более узко конфессиональным; идолопоклоннический характер ясен из контекста.
- source_word: הַקִּנְאָה
  choice: ревности
  rationale: 'Формально сохраняет краткую именную конструкцию и её неоднозначность: речь может идти о свойстве изображения либо о вызываемой им Божьей ревности.'
- source_word: בַּבִּאָה
  choice: у входа
  rationale: Естественное русское обозначение местоположения у входа или в месте входа.
theological_decisions:
- issue: Степень истолкования выражения סֵמֶל הַקִּנְאָה
  choice: «изображение ревности» в основном тексте
  alternative: «идол ревности» или «изображение, вызывающее ревность»
  rationale: Контекст указывает на идолопоклонство, вызывающее ревность Господа, однако еврейский текст содержит сжатую именную конструкцию без явного глагола «вызывает». Основной текст сохраняет эту напряжённость, а пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «И вот» сохраняет зрительную непосредственность видения; порядок обстоятельств слегка выстроен по нормам русского синтаксиса. Местоимение «Он» написано с прописной буквы как указание на говорящего Бога, без добавления отсутствующего в стихе имени.
