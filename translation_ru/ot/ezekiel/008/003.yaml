  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ תַּבְנִ֣ית יָ֔ד וַ/יִּקָּחֵ֖/נִי בְּ/צִיצִ֣ת רֹאשִׁ֑/י וַ/תִּשָּׂ֣א אֹתִ֣/י ר֣וּחַ בֵּֽין הָ/אָ֣רֶץ וּ/בֵ֣ין הַ/שָּׁמַ֡יִם וַ/תָּבֵא֩ אֹתִ֨/י יְרוּשָׁלְַ֜מָ/ה בְּ/מַרְא֣וֹת אֱלֹהִ֗ים אֶל פֶּ֜תַח שַׁ֤עַר הַ/פְּנִימִית֙ הַ/פּוֹנֶ֣ה צָפ֔וֹנָ/ה אֲשֶׁר שָׁ֣ם מוֹשַׁ֔ב סֵ֖מֶל הַ/קִּנְאָ֥ה הַ/מַּקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/003.yaml
  text: Then he stretched out what looked like a hand and took me by a lock of my head[a], and the Spirit lifted me up between the earth and the heavens and brought me to Jerusalem in visions of God, to the entrance of the inner gate that faces north[b], where the seat of the image of jealousy that provokes jealousy was.
translation:
  language: ru
  text: Тогда Он протянул нечто, похожее на руку[a], и взял меня за прядь волос на голове. Дух[b] поднял меня между землёй и небесами и в видениях Божьих перенёс меня в Иерусалим, ко входу внутренних ворот, обращённых на север, где находилось изображение ревности, вызывающее ревность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобие руки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ветер»; или: «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית יָד
  choice: нечто, похожее на руку
  rationale: תַּבְנִית обозначает облик, форму или подобие. Такая передача естественно выражает зрительное сходство в контексте видения, не утверждая, что это была обычная человеческая рука.
- source_word: בְּצִיצִת רֹאשִׁי
  choice: за прядь волос на голове
  rationale: צִיצִת здесь означает пучок, прядь или свисающую часть волос. Выбранная формулировка конкретна и понятна современному читателю.
- source_word: רוּחַ
  choice: Дух
  rationale: В рассказах Иезекииля о сверхъестественном перенесении пророка наиболее вероятно указание на Божьего Духа. Семантическая возможность значений «ветер» и «дух» сохранена в примечании.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: между землёй и небесами
  rationale: Сохраняется множественная форма שָׁמַיִם и возвышенный тон описания видения.
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: в видениях Божьих
  rationale: Множественное число соответствует еврейскому тексту; выражение не сводится однозначно ни к значению «видения от Бога», ни к значению «божественные видения».
- source_word: פֶּתַח שַׁעַר הַפְּנִימִית
  choice: ко входу внутренних ворот
  rationale: 'Переданы оба элемента сочетания: פֶּתַח — вход, שַׁעַר — ворота; русская формулировка естественна и сохраняет конструктивную связь.'
- source_word: הַפּוֹנֶה צָפוֹנָה
  choice: обращённых на север
  rationale: Точно и литературно передаёт направление, выраженное причастным оборотом.
- source_word: מוֹשַׁב
  choice: где находилось
  rationale: В данном контексте מוֹשַׁב указывает на постоянное место или расположение изображения. Русская конструкция избегает неестественного буквального выражения «место изображения».
- source_word: סֵמֶל
  choice: изображение
  rationale: סֵמֶל может обозначать изображение или идола. «Изображение» сохраняет формальность исходного слова, тогда как последующее определение раскрывает его предосудительный характер.
- source_word: הַקִּנְאָה הַמַּקְנֶה
  choice: ревности, вызывающее ревность
  rationale: Повтор корня קנא передан повтором слова «ревность», благодаря чему сохраняется выразительная игра слов оригинала.
theological_decisions:
- issue: Обозначает ли רוּחַ безличный ветер, некий дух или Божьего Духа
  choice: Дух
  alternative: ветер; дух
  rationale: Контекст пророческого видения и сверхъестественного перенесения, а также более широкое словоупотребление у Иезекииля поддерживают личностное, божественное понимание. Лексическая неоднозначность не устраняется, а отмечается в сноске.
- issue: Как понимать родительный оборот בְּמַרְאוֹת אֱלֹהִים
  choice: в видениях Божьих
  alternative: в видениях от Бога; в божественных видениях
  rationale: Формулировка сохраняет присущую оригиналу открытость между указанием на источник видений и характеристикой их природы.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным повествовательным тоном. Повтор «ревность… ревность» намеренно сохранён ради еврейской игры слов; заглавная буква в слове «Дух» отражает основное контекстуальное прочтение, а альтернативы приведены в сноске.
