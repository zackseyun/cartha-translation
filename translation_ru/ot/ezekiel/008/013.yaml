  language: ru
  text: 'И Он сказал мне: «Ты снова увидишь великие мерзости, которые они совершают».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: Ты ещё увидишь
  rationale: Сочетание наречия עוֹד и глагола תָּשׁוּב буквально содержит идею повторения («снова увидишь»), но по-русски естественно и точно передаётся как «ещё увидишь».
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: более великие мерзости
  rationale: «Мерзости» сохраняет сильный религиозно-нравственный смысл תּוֹעֵבוֹת. Сравнительное «более великие» следует контексту нарастания и сопоставлению с уже показанным, не сглаживая выражение до просто «великих».
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: которые они совершают
  rationale: Для нравственно и культово предосудительных действий русское «совершают» естественнее буквального «делают» и сохраняет настоящее, продолжающееся действие.
theological_decisions:
- issue: Степень последующих мерзостей
  choice: более великие мерзости
  alternative: великие мерзости
  rationale: 'Хотя прилагательное גְּדֹלוֹת формально значит «великие/большие», контекст повторяющейся формулы и нарастающих видений поддерживает сравнительное понимание: пророку предстоит увидеть мерзости ещё более тяжкие.'
- issue: Референт говорящего
  choice: Он
  alternative: он
  rationale: В контексте говорящий — явившийся Иезекиилю божественный персонаж; прописная буква соответствует русской библейской издательской традиции, не добавляя имени или титула, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и ясный; сохранены повторяемость откровения, сравнительное нарастание и сильная оценочная лексика.
