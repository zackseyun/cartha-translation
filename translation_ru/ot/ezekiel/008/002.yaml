base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/002.yaml
  text: 'Then I looked[a], and behold, a form with the appearance of fire: from what appeared to be his waist and downward, fire; and from his waist and upward, like the appearance of brightness, like gleaming amber.'
translation:
  language: ru
  text: 'И я увидел: вот подобие, имевшее вид огня. От того, что казалось его талией, и ниже — огонь; а от его талии и выше — словно сияние, подобное хашмалю[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение редкого еврейского слова «хашмаль» не вполне ясно; возможно: «электрум», «янтарь» или «светящийся (раскалённый) металл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: И увидел я
  rationale: Последовательная форма продвигает повествование о видении; инверсия естественна для возвышенной русской прозы и сохраняет личное свидетельство пророка.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Передаёт указательную силу и внезапность нового зрительного образа без архаического «се».
- source_word: דְמוּת
  choice: подобие
  rationale: Сохраняет характер видимого сходства, не отождествляя образ напрямую с существом или предметом.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: видом словно огонь
  rationale: Передаёт и сравнительную частицу, и лексику видимости, удерживая осторожный язык видения.
- source_word: מִמַּרְאֵה מָתְנָיו
  choice: от того, что выглядело как его пояс
  rationale: Отражает трудную эллиптическую конструкцию и повторную оговорку о видимом облике; «пояс» здесь обозначает область талии.
- source_word: וּלְמַטָּה
  choice: и ниже
  rationale: Кратко и естественно передаёт пространственное направление.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямой эквивалент; безглагольность фразы сохранена ради зрительной выразительности.
- source_word: וּמִמָּתְנָיו וּלְמַעְלָה
  choice: а от его пояса и выше
  rationale: Сохраняет пространственный параллелизм с предыдущей частью и использует понятное современное обозначение талии.
- source_word: כְּמַרְאֵה זֹהַר
  choice: словно сияние
  rationale: זֹהַר обозначает яркое свечение; краткий русский эквивалент естественнее буквального «словно вид сияния», сохраняя сравнение.
- source_word: כְּעֵין הַחַשְׁמַלָה
  choice: словно блеск электрума
  rationale: Редкое חַשְׁמַל, вероятно, обозначает ярко блестящее вещество или металл. «Электрум» сохраняет традиционное техническое понимание, а слово «блеск» передаёт עֵין в данном контексте.
theological_decisions:
- issue: Характер описания видимой фигуры
  choice: Последовательно сохранить язык подобия и видимости
  alternative: Передать образ прямо как огненную фигуру или сияющий металл
  rationale: Иезекииль намеренно пользуется словами דְמוּת, מַרְאֶה и сравнительной частицей כ, не давая прямого онтологического отождествления; перевод сохраняет эту сдержанность и напряжение видения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом пророческого видения. Архаизмы устранены, но сохранены лаконичные безглагольные конструкции и повтор пространственных формул. Маркер [a] стоит непосредственно при спорном термине.
