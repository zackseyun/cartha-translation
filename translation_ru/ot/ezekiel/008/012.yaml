  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ אֲשֶׁ֨ר זִקְנֵ֤י בֵֽית יִשְׂרָאֵל֙ עֹשִׂ֣ים בַּ/חֹ֔שֶׁךְ אִ֖ישׁ בְּ/חַדְרֵ֣י מַשְׂכִּית֑/וֹ כִּ֣י אֹמְרִ֗ים אֵ֤ין יְהוָה֙ רֹאֶ֣ה אֹתָ֔/נוּ עָזַ֥ב יְהוָ֖ה אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/012.yaml
  text: Then he said to me[a], “Have you seen, son of man, what the elders of the house of Israel are doing in the darkness, each man in the rooms of his carved image? For they are saying, ‘Yahweh does not see us[c][b]; Yahweh has abandoned the land.’”
translation:
  language: ru
  text: 'И Он сказал мне: «Видел ли ты, сын человеческий, что старейшины дома Израиля делают во тьме, каждый в комнатах со своим изображением[a]? Ибо они говорят: „Яхве не видит нас; Яхве оставил землю“[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый в комнатах своего изображения»; также возможно: «каждый в комнате со своим изображением». Еврейское слово может обозначать фигурное, резное или иное изображение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Яхве покинул землю». Под «землёй», вероятно, имеется в виду земля Израиля; слово может также обозначать землю вообще.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И Он сказал мне
  rationale: Последовательная форма продвигает рассказ; «И» естественно сохраняет еврейскую повествовательную связь. Заглавная буква указывает на говорящего в непосредственном контексте видения.
- source_word: הֲרָאִיתָ
  choice: Видел ли ты
  rationale: Вопросительная частица с перфектом отсылает к уже показанному пророку в видении.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и его повторяющуюся литературную форму.
- source_word: זִקְנֵי בֵית יִשְׂרָאֵל
  choice: старейшины дома Израиля
  rationale: Полностью передаёт значимую для Иезекииля конструкцию «дом Израиля», не сокращая её до одного «Израиля».
- source_word: עֹשִׂים בַּחֹשֶׁךְ
  choice: делают во тьме
  rationale: Сохраняет одновременно буквальную тьму видения и оттенок тайного действия.
- source_word: אִישׁ בְּחַדְרֵי מַשְׂכִּיתוֹ
  choice: каждый во внутренних комнатах со своими изображениями
  rationale: אִישׁ имеет распределительное значение «каждый»; חֶדֶר обозначает внутреннюю комнату, а מַשְׂכִּית — изображение или фигурное представление. Русское множественное число естественно согласуется с распределительной конструкцией, не устраняя неоднозначности характера изображений.
- source_word: כִּי אֹמְרִים
  choice: Ведь они говорят
  rationale: Передаёт обоснование их скрытых действий естественным современным русским оборотом.
- source_word: אֵין יְהוָה רֹאֶה אֹתָנוּ
  choice: Яхве не видит нас
  rationale: Идиоматично передаёт отрицательную причастную конструкцию и сохраняет личное имя Бога.
- source_word: עָזַב יְהוָה אֶת הָאָרֶץ
  choice: Яхве оставил эту землю
  rationale: עָזַב допускает значения «оставить, покинуть»; הָאָרֶץ в храмовом и изгнанническом контексте вероятнее означает землю Израиля, а указательное «эту» естественно выражает определённость и местный смысл без внесения названия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя завета, непосредственно стоящее в еврейском тексте, без замены титулом.
- issue: Объём значения הָאָרֶץ
  choice: эта земля
  alternative: земля; мир
  rationale: Контекст осквернения храма и земли Израиля поддерживает локальный смысл, однако формулировка не добавляет прямо отсутствующего названия «Израиль».
- issue: Характер מַשְׂכִּית
  choice: изображения
  alternative: резные изображения; идолы; росписи
  rationale: Общее «изображения» сохраняет лексическую неоднозначность слова и не уточняет без достаточных оснований способ изготовления или точный культовый статус.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к источнику, но не калькирован; сохранены повтор имени Яхве, образ тьмы и неоднозначность изображений. Все сноски отмечены в основном тексте.
