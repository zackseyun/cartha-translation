  yaml_path: translation/ot/ezekiel/008/007.yaml
  text: Then he brought me to the entrance of the court[a], and I looked, and behold[b], there was a hole in the wall.
translation:
  language: ru
  text: И привёл он меня ко входу во двор[a]. Я посмотрел[b] — и вот, в стене было отверстие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко входу во внутренний двор»; слово может обозначать двор или ограждённое пространство, но само по себе не уточняет, о каком именно дворе идёт речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я увидел»; еврейский глагол может обозначать как действие смотрящего, так и результат — увиденное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: И привёл он меня
  rationale: Хифиль глагола בוא означает «привести»; союз передаёт последовательность повествования. Порядок слов сохраняет лёгкое смысловое выделение действующего лица, обозначенного контекстом.
- source_word: אֶל פֶּתַח הֶחָצֵר
  choice: ко входу во двор
  rationale: אֶל указывает направление, не обязательно вхождение внутрь; פֶּתַח — вход или проём; חָצֵר здесь естественно обозначить словом «двор» в храмовом контексте.
- source_word: וָאֶרְאֶה
  choice: Я посмотрел
  rationale: ראה может обозначать как направленное зрительное восприятие, так и результат — «увидел». Перед הִנֵּה форма «посмотрел» естественно вводит обнаруженное зрелище, но альтернативу следует сохранить в примечании.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица הִנֵּה привлекает внимание к внезапно замеченному и сохраняет живость пророческого рассказа; современное русское «и вот» звучит естественнее архаичного «се».
- source_word: חֹר אֶחָד
  choice: отверстие
  rationale: חֹר — дыра, отверстие или проём; אֶחָד здесь употреблено как неопределённый показатель, без необходимости подчёркивать число «одно».
- source_word: בַּקִּיר
  choice: в стене
  rationale: Предлог ב с определённым существительным קִיר прямо указывает на расположение отверстия в стене.
