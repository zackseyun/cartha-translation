  naturalness: 'Начальное «И привёл он меня» в современном литературном русском звучит излишне инверсивно без смысловой необходимости. Нейтральное «Он привёл меня» естественнее. Настоящее время в конструкции «и вот: в стене отверстие» лучше передаёт выразительную предъявительную функцию וְהִנֵּה, чем прошедшее «было».'
