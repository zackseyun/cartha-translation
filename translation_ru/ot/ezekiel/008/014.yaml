base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/014.yaml
  text: Then he brought me to the entrance of the gate of the house of Yahweh that faces north[a], and behold, there the women were sitting[b], weeping for Tammuz.
translation:
  language: ru
  text: 'Затем Он привёл меня ко входу в ворота дома Яхве, обращённые к северу. И вот: там сидели женщины и оплакивали Таммуза[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Таммуз — месопотамское божество, с которым были связаны сезонные обряды плача; женщины изображены участвующими в таком оплакивании.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «плакали о Таммузе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: Затем Он привёл меня
  rationale: Каузативная форма глагола בוא означает «привести». «Затем» естественно передаёт последовательность повествования, выраженную союзом וַ־.
- source_word: פֶּתַח שַׁעַר בֵּית יְהוָה אֲשֶׁר אֶל הַצָּפוֹנָה
  choice: ко входу в северные ворота дома Яхве
  rationale: Формулировка сохраняет архитектурные понятия «вход», «ворота» и «дом», а указание направления естественно передаётся определением «северные».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом «Господь».
- source_word: וְהִנֵּה שָׁם
  choice: И вот, там
  rationale: «И вот» сохраняет функцию הִנֵּה как указателя, привлекающего внимание к увиденной сцене; שָׁם прямо передано словом «там».
- source_word: הַנָּשִׁים יֹשְׁבוֹת
  choice: сидели женщины
  rationale: Причастие изображает продолжающееся положение женщин в момент видения; русский порядок слов естественно вводит наблюдаемую группу.
- source_word: מְבַכּוֹת אֶת הַתַּמּוּז
  choice: оплакивали Фаммуза
  rationale: Глагол буквально связан с плачем, а конструкция с прямым дополнением в данном культовом контексте естественно передаётся русским «оплакивали». Буквальный оттенок отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Передача תַּמּוּז как собственного имени
  choice: Фаммуз
  alternative: бог Фаммуз
  rationale: В основном тексте сохранено собственное имя без отсутствующего в еврейском тексте поясняющего слова «бог»; культурная идентификация вынесена в сноску.
- issue: Характер плача по Фаммузу
  choice: оплакивали Фаммуза
  alternative: плакали о Фаммузе
  rationale: «Оплакивали» ясно передаёт направленный на Фаммуза ритуальный плач, но буквальное значение глагола не скрыто и приведено как возможная передача в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческого повествования. «И вот» поддерживает зрительную непосредственность видения; «дом Яхве» сохраняет образ исходного текста, не заменяя его более толковательным словом «храм».
