  yaml_path: translation/ot/ezekiel/008/008.yaml
  text: Then he said to me[a], “Son of man, please dig into the wall.” So I dug into the wall, and behold, there was an opening.
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий, пробей[a] стену». Я пробил стену — и вот, там был проём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прокопай стену». Еврейский глагол может означать прокапывать или проламывать стену.'
