lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и буквальный образ еврейского выражения, не превращая его здесь в мессианский титул.
- source_word: חֲתָר
  choice: прокопай / прокопал
  rationale: Глагол обозначает прокапывание или пробивание стены; «прокопать» естественно передаёт действие и сохраняет повтор исходного глагола.
- source_word: נָא
  choice: не выражено отдельным словом
  rationale: Частица смягчает или подаёт повеление как побуждение; русское «пожалуйста» в речи Бога здесь звучало бы неестественно, тогда как простой императив сохраняет достоинство и естественность обращения.
- source_word: קִּיר
  choice: стена
  rationale: Прямое и контекстуально точное соответствие названию строительной стены.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт внезапность обнаружения и зрительную живость повествования.
- source_word: פֶּתַח אֶחָד
  choice: одно отверстие
  rationale: «Отверстие» подходит для только что прокопанной стены, а «одно» сохраняет явно присутствующее אֶחָד, не подразумевая оформленного дверного проёма.
theological_decisions:
- issue: Передача אָדָם в обращении בֶּן אָדָם
  choice: Сын человеческий
  alternative: человек; смертный
  rationale: Это характерное для книги обращение к Иезекиилю в единственном числе мужского рода. Традиционно узнаваемая формула точно сохраняет литературный повтор и сама по себе не утверждает здесь позднейшее христологическое значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «прокопай / прокопал» и формула «и вот» воспроизводят структуру и живость еврейского текста; заглавная буква в «Он» указывает на Бога по ближайшему контексту.
