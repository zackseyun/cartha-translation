base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/011.yaml
  text: And seventy men from the elders of the house of Israel[a], with Jaazaniah the son of Shaphan standing among them, were standing before them, each man with his censer in his hand[d][c][b]; and the thick cloud of incense was going up.
translation:
  language: ru
  text: И семьдесят мужей из числа старейшин дома Израиля, среди которых стоял Яазания, сын Шафана, стояли перед ними[a]. У каждого в руке была кадильница, и вверх поднималось густое облако дыма от благовоний.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть перед изображениями на стене помещения (см. стих 10).
    reason: cross_reference
lexical_decisions:
- source_word: שִׁבְעִים אִישׁ מִזִּקְנֵי בֵית יִשְׂרָאֵל
  choice: семьдесят мужей из числа старейшин дома Израиля
  rationale: '«Мужей» сохраняет мужской род группы, а «из числа» ясно передаёт значение מִן: эти семьдесят принадлежали к старейшинам. Выражение «дом Израиля» сохранено.'
- source_word: יַאֲזַנְיָהוּ בֶן שָׁפָן עֹמֵד בְּתוֹכָם
  choice: среди которых стоял Яазания, сын Шафана
  rationale: Оборот естественно передаёт положение Яазании внутри группы и согласует причастную конструкцию с русским синтаксисом. Имена переданы транслитерацией.
- source_word: עֹמְדִים לִפְנֵיהֶם
  choice: стояли перед ними
  rationale: Сохраняется множественное местоимение и не уточняется его референт непосредственно в тексте; причастие передано как действие, продолжающееся в видении.
- source_word: מִקְטַרְתּוֹ
  choice: кадильница
  rationale: Слово обозначает сосуд или приспособление для сжигания благовоний; «кадильница» — краткий и понятный русский эквивалент.
- source_word: וַעֲתַר עֲנַן הַקְּטֹרֶת עֹלֶה
  choice: и вверх поднималось густое облако благовоний
  rationale: «Густое» передаёт значение обилия или плотности в עֲתַר, а несовершенный вид «поднималось» отражает продолжающееся действие причастия עֹלֶה.
theological_decisions:
- issue: К кому или чему относится «перед ними» (לִפְנֵיהֶם)
  choice: Сохранено местоимение «ними» без уточнения в основном тексте.
  alternative: «Перед изображениями» или «перед ними», явно относя это к изображениям на стене.
  rationale: Форма множественного числа, вероятнее всего, отсылает к изображениям из предыдущего стиха, однако сам еврейский текст не называет референт повторно. Сохранение местоимения не устраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис упрощён настолько, чтобы длинная еврейская конструкция оставалась ясной, но повтор «стоял — стояли» сохранён как соответствующий исходному тексту.
