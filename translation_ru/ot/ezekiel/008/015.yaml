  terminology: «Сын человеческий» уместно сохраняет устойчивое обращение בֶן־אָדָם в книге Иезекииля. «Мерзости» точно передаёт תּוֹעֵבוֹת, включая его резко отрицательную, в данном контексте культовую, оценку.
