  source_fidelity: Начальное «И Он сказал мне» и вопросительное обращение переданы верно. Однако עוֹד תָּשׁוּב תִּרְאֶה — будущее утверждение («ты снова/ещё увидишь»), а не повеление «Обернись». Следует сохранить повторность последующего видения и усилительную сравнительную конструкцию.
