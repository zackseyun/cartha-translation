  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם ע֣וֹד תָּשׁ֥וּב תִּרְאֶ֛ה תּוֹעֵב֥וֹת גְּדֹל֖וֹת מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/015.yaml
  text: Then he said to me, “Have you seen this, son of man? You will see again still greater abominations than these.”
translation:
  language: ru
  text: 'И Он сказал мне: «Видел ли ты это, сын человеческий? Ты снова увидишь мерзости, ещё более великие, чем эти».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И Он сказал мне
  rationale: Естественно передаёт продолжение повествования; местоимение сохраняет явно подразумеваемого говорящего из контекста.
- source_word: הֲרָאִיתָ
  choice: Видел ли ты это
  rationale: Вопросительная форма сохранена; «это» естественно указывает на только что показанное видение.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Устойчивое и буквальное обращение, характерное для книги Иезекииля.
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: Обернись — и увидишь ещё
  rationale: תָּשׁוּב передаёт идею нового поворота/возвращения к созерцанию, а עוֹד — продолжения откровения; формулировка избегает неестественного «снова ещё увидишь».
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת מֵאֵלֶּה
  choice: бо́льшие мерзости, чем эти
  rationale: Сохраняет сравнительную конструкцию и сильную нравственно-культовую оценку תועבות.
theological_decisions:
- issue: Значение תָּשׁוּב в сочетании עוֹד תָּשׁוּב תִּרְאֶה
  choice: Обернись — и увидишь ещё
  alternative: Ты снова увидишь ещё бо́льшие мерзости
  rationale: Выбранный вариант сохраняет буквальный оттенок «повернуться/обратиться», согласующийся с последовательным показом видений, не превращая его в отдельное богословское утверждение о покаянии.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Ударение в «бо́льшие» графически отмечено для устранения возможной двусмысленности с «более»/«большие по размеру»; кавычки и тире соответствуют русской издательской норме.
