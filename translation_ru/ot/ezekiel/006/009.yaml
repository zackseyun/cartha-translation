  text: וְ/זָכְר֨וּ פְלִֽיטֵי/כֶ֜ם אוֹתִ֗/י בַּ/גּוֹיִם֮ אֲשֶׁ֣ר נִשְׁבּוּ שָׁם֒ אֲשֶׁ֨ר נִשְׁבַּ֜רְתִּי אֶת לִבָּ֣/ם הַ/זּוֹנֶ֗ה אֲשֶׁר סָר֙ מֵֽ/עָלַ֔/י וְ/אֵת֙ עֵֽינֵי/הֶ֔ם הַ/זֹּנ֕וֹת אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָקֹ֨טּוּ֙ בִּ/פְנֵי/הֶ֔ם אֶל הָֽ/רָעוֹת֙ אֲשֶׁ֣ר עָשׂ֔וּ לְ/כֹ֖ל תּוֹעֲבֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/009.yaml
  text: Then your survivors will remember me among the nations where they were taken captive[a], when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols[c][b]; and they will loathe themselves for the evils they committed in all their abominations.
translation:
  language: ru
  text: Тогда уцелевшие из вас вспомнят обо Мне среди народов, куда их увели в плен, — когда Я был сокрушён[a] их блудным сердцем, отвернувшимся от Меня, и их глазами, блудившими вслед за их идолами[b][c]. Они почувствуют отвращение к самим себе за всё зло, которое совершили, — за все свои мерзости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «когда Я сокрушил их блудное сердце, отвернувшееся от Меня». Еврейская конструкция трудна: форма глагола обычно означает «Я был сокрушён», тогда как показатель прямого дополнения перед словом «сердце» допускает активное понимание.'
    reason: alternative_reading
  - marker: b
    text: «Блудное сердце» и «блудившие глаза» — образ духовной и заветной неверности Богу, выражавшейся в идолопоклонстве.
    reason: cultural_note
  - marker: c
    text: Еврейское слово, переведённое как «идолы», у Иезекииля имеет презрительный оттенок; возможна передача «мерзкие идолы» или «нечистые идолы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכְרוּ
  choice: Тогда ... вспомнят
  rationale: Сохраняет основное значение «вспомнят», а «тогда» естественно передаёт последовательность и результат в пророческом контексте.
- source_word: פְלִיטֵיכֶם
  choice: уцелевшие из вас
  rationale: Передаёт людей, избежавших гибели; это яснее и естественнее современного русского «беглецы» в данном контексте суда.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Речь идёт о чужих народах, среди которых окажутся пленники; перевод не привносит более поздних оттенков слова «язычники».
- source_word: אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: куда их увели в плен
  rationale: Естественно передаёт пассивную форму глагола שבה и значение места пленения.
- source_word: אֲשֶׁר נִשְׁבַּרְתִּי
  choice: как Я был сокрушён
  rationale: Масоретская огласовка указывает на нифаль, обычно имеющий страдательное значение «Я был сокрушён». Синтаксис фразы труден, поэтому активное понимание вынесено в примечание.
- source_word: לִבָּם הַזּוֹנֶה
  choice: их блудным сердцем
  rationale: Сохраняет резкую брачную и сексуальную метафору неверности Богу, не сводя её к отвлечённому «неверному сердцу».
- source_word: אֲשֶׁר סָר מֵעָלַי
  choice: отвернувшимся от Меня
  rationale: Передаёт и движение прочь, и разрыв отношений с Богом.
- source_word: עֵינֵיהֶם הַזֹּנוֹת אַחֲרֵי גִּלּוּלֵיהֶם
  choice: их глазами, блудившими вслед за их идолами
  rationale: Сохраняет параллелизм сердца и глаз, а также повтор метафоры блуда как образа идолопоклонства.
- source_word: גִּלּוּלֵיהֶם
  choice: их идолами
  rationale: Даёт ясное основное значение; презрительный оттенок характерного для Иезекииля слова поясняется в примечании.
- source_word: וְנָקֹטּוּ בִּפְנֵיהֶם
  choice: Они почувствуют отвращение к самим себе
  rationale: Естественно передаёт еврейскую идиому самоотвращения, не сохраняя неясную для русского читателя буквальную конструкцию «перед своими лицами».
- source_word: אֶל הָרָעוֹת אֲשֶׁר עָשׂוּ לְכֹל תּוֹעֲבֹתֵיהֶם
  choice: за всё зло, которое совершили, — за все свои мерзости
  rationale: Передаёт причину самоотвращения и сохраняет тяжёлую нравственно-культовую окраску слова תועבות.
theological_decisions:
- issue: Значение אֲשֶׁר נִשְׁבַּרְתִּי
  choice: Бог говорит, что был сокрушён блудным сердцем народа.
  alternative: Бог сокрушил их блудное сердце посредством суда.
  rationale: 'Масоретская форма נִשְׁבַּרְתִּי морфологически естественнее читается как страдательная: «Я был сокрушён». Однако следующий показатель прямого дополнения אֶת создаёт синтаксическую трудность и поддерживает засвидетельствованное активное понимание. Неоднозначность сохранена в примечании, а не устранена молча.'
- issue: Образ блуда
  choice: Сохранена явная метафора блудного сердца и блудящих глаз.
  alternative: Смягчить до «неверное сердце» и «глаза, стремившиеся к идолам».
  rationale: Повтор זנה намеренно изображает идолопоклонство как супружескую неверность Богу; смягчение ослабило бы риторику текста.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены резкая метафора блуда, повтор образов сердца и глаз и богословски значимая неоднозначность трудной еврейской конструкции; буквальные обороты, неясные по-русски, переданы естественными идиомами.
