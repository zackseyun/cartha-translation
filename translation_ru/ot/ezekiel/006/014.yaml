  text: וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/נָתַתִּ֨י אֶת הָ/אָ֜רֶץ שְׁמָמָ֤ה וּ/מְשַׁמָּה֙ מִ/מִּדְבַּ֣ר דִּבְלָ֔תָ/ה בְּ/כֹ֖ל מוֹשְׁבֽוֹתֵי/הֶ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/014.yaml
  text: So I will stretch out my hand against them and make the land a desolation and a waste[a], from the wilderness toward Diblath, throughout all their settlements[b]. Then they will know that I am Yahweh.
translation:
  language: ru
  text: И Я простру руку против них и превращу землю в пустыню и запустение — от пустыни в сторону Дивлаты, во всех их поселениях[a]. Тогда они узнают, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза и название места не вполне ясны. Возможный перевод: «от пустыни до Дивлаты»; предлагалось также связывать это название с Ривлой.'
    reason: textual_variant
lexical_decisions:
- source_word: וְנָטִיתִי אֶת־יָדִי עֲלֵיהֶם
  choice: И Я простру руку против них
  rationale: Сохраняет пророческий образ протянутой руки и ясно передаёт враждебную, карающую направленность עַל в данном контексте.
- source_word: וְנָתַתִּי אֶת־הָאָרֶץ
  choice: и сделаю землю
  rationale: נתן с предикативным дополнением выражает приведение земли в названное далее состояние; по-русски это естественно передаётся глаголом «сделаю».
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: безлюдной и опустошённой
  rationale: Два однокоренно звучащих еврейских существительных усиливают картину полного разорения. Пара русских прилагательных сохраняет двойное описание и звучит естественно, не сужая מְשַׁמָּה исключительно до эмоционального «ужаса».
- source_word: מִמִּדְבַּר דִּבְלָתָה
  choice: от пустыни по направлению к Дивле
  rationale: Фраза трудна текстуально и географически. Перевод сохраняет наиболее вероятное указание на протяжённость территории, но оборотом «по направлению к» не создаёт ложной уверенности в точном определении границы и топонима.
- source_word: בְּכֹל מוֹשְׁבוֹתֵיהֶם
  choice: во всех их поселениях
  rationale: מוֹשָׁב обозначает место проживания или поселение; «поселения» — ясное современное соответствие в контексте суда над землёй.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Тогда они узнают, что Я — Яхве
  rationale: «Тогда» естественно выражает результат предшествующего суда, а личное имя Яхве непосредственно передаёт יהוה.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в формуле узнавания и не заменяет его титулом.
- issue: Толкование מִמִּדְבַּר דִּבְלָתָה
  choice: 'географическое направление: «от пустыни по направлению к Дивле»'
  alternative: «от пустыни до Дивлы»; отождествление с Ривлой; понимание как усилительной формулы крайнего опустошения
  rationale: Масоретский текст, вероятнее всего, содержит топоним и описание пространственного охвата, однако точная форма названия и географическая идентификация неясны; основной текст сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Образ простёртой руки сохранён, тогда как описание разорённой земли передано естественными русскими прилагательными. Местоимение «Я» написано с прописной буквы как элемент принятого библейского регистра.
