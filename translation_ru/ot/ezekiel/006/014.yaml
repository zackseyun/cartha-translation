revisions:
- from: И Я простру руку против них и сделаю землю безлюдной и опустошённой — от пустыни по направлению к Дивле[a], во всех их поселениях[b]. Тогда они узнают, что Я — Яхве.
  to: И Я простру руку против них и превращу землю в пустыню и запустение — от пустыни в сторону Дивлаты, во всех их поселениях[a]. Тогда они узнают, что Я — Яхве.
  rationale: 'Исправлена передача трудного топонима на «Дивлата» и унифицирована с примечанием. Пара существительных «в пустыню и запустение» ближе к שְׁמָמָה וּמְשַׁמָּה. Отдельная сноска о варианте «во всех местах их обитания» не нужна: это нормальная лексическая альтернатива, не затрагивающая смысл перевода.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:42:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: карающее простирание руки, превращение земли в состояние запустения, трудная географическая формула, охват всех мест проживания и формула узнавания имени Яхве сохранены. Однако топоним в основном тексте передан непоследовательно и слишком сокращённо: דִּבְלָתָה следует передать как «Дивлата» (ср. англ. Diblath), не как «Дивла».'
  naturalness: Русский текст в целом литературен и соответствует пророческому регистру. Оборот «от пустыни по направлению к...» допустим, но «от пустыни в сторону...» звучит несколько естественнее. «Безлюдной и опустошённой» передаёт результат, хотя «в пустыню и запустение» лучше сохраняет два существительных исходника и его образную силу.
  terminology: «Яхве» последовательно передаёт יהוה. «Простру руку против них» и «поселения» удачны. Топоним следует унифицировать между текстом и примечанием как «Дивлата».
  issues:
