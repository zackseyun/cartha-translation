    rationale: В основном тексте стоит «Дивле», а в примечании — «Дивлы», тогда как масоретская форма содержит основу Diblath- и направительное окончание. Для сохранения формы имени и согласованности следует использовать «Дивлата» в тексте и примечании.
  - severity: low
    issue: Передача пары שְׁמָמָה וּמְשַׁמָּה прилагательными
    rationale: «Безлюдной и опустошённой» допустимо, но исходник употребляет усилительную пару существительных. «В пустыню и запустение» точнее сохраняет синтаксис и образность, не добавляя узкого значения «безлюдной».
