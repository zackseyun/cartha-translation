source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּֽ/הְי֣וֹת חַלְלֵי/הֶ֗ם בְּ/תוֹךְ֙ גִּלּ֣וּלֵי/הֶ֔ם סְבִיב֖וֹת מִזְבְּחֽוֹתֵי/הֶ֑ם אֶל֩ כָּל גִּבְעָ֨ה רָמָ֜ה בְּ/כֹ֣ל רָאשֵׁ֣י הֶ/הָרִ֗ים וְ/תַ֨חַת כָּל עֵ֤ץ רַֽעֲנָן֙ וְ/תַ֨חַת֙ כָּל אֵלָ֣ה עֲבֻתָּ֔ה מְק֗וֹם אֲשֶׁ֤ר נָֽתְנוּ שָׁם֙ רֵ֣יחַ נִיחֹ֔חַ לְ/כֹ֖ל גִּלּוּלֵי/הֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/013.yaml
  text: Then you will know that I am Yahweh[a], when their slain lie among their idols, all around their altars, on every high hill, on all the mountaintops, and under every green tree and under every leafy terebinth—the places where they offered a pleasing aroma to all their idols.
translation:
  language: ru
  text: И узнаете, что Я — Яхве, когда их убитые будут лежать среди их идолов[a], вокруг их жертвенников, на каждом высоком холме, на всех вершинах гор, под каждым зеленеющим деревом и под каждым раскидистым теревинфом — повсюду, где они возносили всем своим идолам приятное благоухание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «идолы», имеет резко презрительный оттенок; его можно передать как «мерзкие идолы» или, более буквально, «навозные идолы».
    reason: Сохраняет уничижительную окраску גִּלּוּלִים, которую трудно естественно воспроизвести одним словом в основном русском тексте.
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: И узнаете
  rationale: Форма с союзом продолжает пророческое описание и выражает будущий результат; русское «и узнаете» сохраняет связь с контекстом без добавления отсутствующего в тексте наречия времени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בִּהְיוֹת חַלְלֵיהֶם
  choice: когда их убитые будут лежать
  rationale: Инфинитивная конструкция задаёт временное обстоятельство. Слово חָלָל обозначает насильственно убитого; «будут лежать» естественно и явно передаёт подразумеваемое положение тел в перечисленных местах.
- source_word: בְּתוֹךְ גִּלּוּלֵיהֶם
  choice: среди их идолов
  rationale: Сохраняет пространственный образ тел посреди предметов культа; резко уничижительный оттенок גִּלּוּלִים вынесен в примечание.
- source_word: סְבִיבוֹת מִזְבְּחוֹתֵיהֶם
  choice: вокруг их жертвенников
  rationale: Прямо и естественно передаёт расположение убитых со всех сторон культовых жертвенников.
- source_word: אֶל כָּל גִּבְעָה רָמָה בְּכֹל רָאשֵׁי הֶהָרִים
  choice: на каждом высоком холме, на всех вершинах гор
  rationale: В данном перечне предлоги употреблены локативно; «вершины гор» естественно передаёт еврейскую идиому «головы гор».
- source_word: תַחַת כָּל עֵץ רַעֲנָן
  choice: под каждым зеленеющим деревом
  rationale: רַעֲנָן описывает свежую зелень и пышную растительность; причастие звучит в современном русском естественнее буквального «зелёным».
- source_word: תַחַת כָּל אֵלָה עֲבֻתָּה
  choice: под каждым раскидистым теревинфом
  rationale: אֵלָה, вероятнее всего, обозначает теревинф, а עֲבֻתָּה — густую, ветвистую крону; «раскидистый» сохраняет зримый образ.
- source_word: מְקוֹם אֲשֶׁר נָתְנוּ שָׁם רֵיחַ נִיחֹחַ
  choice: повсюду, где они приносили … благоуханные жертвы
  rationale: Единственное מְקוֹם имеет собирательный смысл после перечня мест. Буквально «давали там благоуханный аромат» — культовая формула о приношении; русское выражение передаёт её смысл и сохраняет иронию применения к идолам.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Уничижительное значение גִּלּוּלִים
  choice: «идолы» в основном тексте с пояснением в сноске
  alternative: «навозные идолы» или «мерзкие идолы»
  rationale: Нейтральное русское наименование обеспечивает ясность, а сноска сохраняет намеренно презрительную силу еврейского слова, не навязывая одну спорную этимологическую передачу.
- issue: Формула רֵיחַ נִיחֹחַ применительно к идолам
  choice: «благоуханные жертвы»
  alternative: «приятное благоухание»
  rationale: Выражение является культовой формулой и здесь намеренно отнесено к ложным богам. Перевод сохраняет эту богословскую иронию, не исправляя её и не добавляя оценки от переводчика.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Синтаксис слегка упрощён ради ясности, но сохранены перечисление культовых мест, насильственный характер смерти и напряжённо-ироническое употребление жертвенной формулы по отношению к идолам.
