  text: Son of man[a], set your face toward the mountains of Israel, and prophesy to them.
translation:
  language: ru
  text: Сын человеческий, обрати лицо к горам Израиля и пророчествуй им[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пророчествуй против них». Еврейский предлог может обозначать направление или адресата («им»); в контексте пророчества о суде он может пониматься в противительном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Сын человеческий
  rationale: Устойчивое обращение к Иезекиилю; сохраняет буквальный образ и пророческое звучание еврейского выражения.
- source_word: שִׂים פָּנֶיךָ
  choice: обрати лицо
  rationale: Передаёт конкретный образ направленного лица и одновременно естественно звучит по-русски в повелительной форме.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: к горам Израиля
  rationale: Предлог при выражении «обрати лицо» обозначает направление, а конкретный образ гор сохранён без замены на более широкое «горная страна».
- source_word: וְהִנָּבֵא
  choice: и пророчествуй
  rationale: Стандартно и точно передаёт повелительную форму глагола נבא, сохраняя пророческий регистр.
- source_word: אֲלֵיהֶם
  choice: против них
  rationale: Предлог допускает нейтральное «им», однако последующее пророчество суда направлено против гор Израиля; «против них» ясно передаёт контекстуальную силу, а более нейтральный вариант сохранён в сноске.
theological_decisions:
- issue: Передача обращения בֶּן־אָדָם
  choice: Сын человеческий
  alternative: человек; смертный
  rationale: Это характерное обращение Бога к Иезекиилю. Его сохранение не сводит выражение к отвлечённому указанию на человеческую смертность и не привносит дополнительного толкования.
- issue: Направленность пророчества в אֲלֵיהֶם
  choice: против них
  alternative: им
  rationale: Контекст возвещения суда поддерживает противительное понимание, но грамматически возможное нейтральное прочтение отмечено, чтобы не скрывать неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого регистра и конкретной образности оригинала. Местоимение «них» относится к горам Израиля.
