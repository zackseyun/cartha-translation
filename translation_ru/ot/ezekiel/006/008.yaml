base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/008.yaml
  text: Yet I will leave a remnant[a], when some of you become escapees from the sword among the nations, when you are scattered through the lands.
translation:
  language: ru
  text: 'Но Я оставлю остаток[a]: когда вы будете рассеяны по землям, среди народов у вас будут уцелевшие от меча.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставлю уцелевших». Буквально: «оставлю; когда среди народов у вас будут уцелевшие от меча, когда вы будете рассеяны по землям».'
    reason: Еврейский глагол означает «оставить», «сохранить» или «дать уцелеть»; слово «остаток» передаёт подразумеваемый результат, но отдельно в тексте не стоит. Сноска также отмечает именную конструкцию «уцелевшие от меча».
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: Но Я оставлю остаток
  rationale: Порода хифиль глагола יתר означает «оставить», «сохранить», «дать уцелеть». Союз «но» передаёт контекстуальное противопоставление предшествующему суду, а «оставлю остаток» естественно выражает сохранение части народа, хотя существительное «остаток» в еврейском тексте подразумевается, а не названо прямо.
- source_word: בִּהְיוֹת לָכֶם
  choice: некоторые из вас
  rationale: Оборот с инфинитивом היה и дательным местоимением буквально описывает наличие у адресатов тех, кто спасся. По-русски партитивный смысл естественно передаётся выражением «некоторые из вас».
- source_word: פְּלִיטֵי חֶרֶב
  choice: избегут меча
  rationale: פְּלִיטֵי обозначает беглецов или спасшихся; в сочетании с «мечом» речь идёт о тех, кто избежит гибели в войне. Глагольная формулировка звучит по-русски естественнее буквального «беглецы от меча» и сохраняет образ меча.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь обозначает чужие народы, среди которых окажутся рассеянные израильтяне. «Народы» — точный и нейтральный библейский эквивалент.
- source_word: בְּהִזָּרוֹתֵיכֶם
  choice: когда вы будете рассеяны
  rationale: Инфинитив от זרה с местоименным суффиксом образует временной оборот о рассеянии народа. Страдательная конструкция не уточняет действующее лицо сверх того, что выражено в данной форме.
- source_word: בָּאֲרָצוֹת
  choice: по разным землям
  rationale: Множественное число אֲרָצוֹת указывает на множество земель рассеяния. Добавление «разным» естественно передаёт множественность без современного политического оттенка слова «страны».
theological_decisions:
- issue: Остаток в пророчестве о суде
  choice: Но Я оставлю остаток
  alternative: Но Я оставлю некоторых в живых
  rationale: Формулировка сохраняет напряжение между объявленным судом и сохранением части народа. Термин «остаток» передаёт результат действия глагола יתר и богословски значим в пророческом контексте, не добавляя дальнейшего доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Двоеточие показывает, что следующая часть поясняет, в чём состоит сохранение остатка; образ меча и неопределённость относительно числа спасшихся сохранены.
