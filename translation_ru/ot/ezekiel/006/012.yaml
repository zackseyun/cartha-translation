  text: הָ/רָח֞וֹק בַּ/דֶּ֣בֶר יָמ֗וּת וְ/הַ/קָּרוֹב֙ בַּ/חֶ֣רֶב יִפּ֔וֹל וְ/הַ/נִּשְׁאָר֙ וְ/הַ/נָּצ֔וּר בָּ/רָעָ֖ב יָמ֑וּת וְ/כִלֵּיתִ֥י חֲמָתִ֖/י בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/012.yaml
  text: The one far away will die by pestilence[a], and the one nearby will fall by the sword, and the one left and besieged will die by famine[b]; and I will spend my wrath on them.
translation:
  language: ru
  text: Кто далеко, умрёт от мора; кто близко — падёт от меча; а кто останется и окажется в осаде[a], умрёт от голода. И Я до конца обращу на них Свой гнев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто останется и будет стеснён (заперт)». Еврейское слово может обозначать человека, окружённого осадой; такое понимание соответствует последующей смерти от голода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до конца исчерпаю Свой гнев на них». Еврейский глагол выражает доведение гнева до полного осуществления в суде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָחוֹק
  choice: кто далеко
  rationale: Субстантивированное прилагательное передано естественной русской конструкцией, сохраняющей пространственное противопоставление с «кто близко».
- source_word: בַּדֶּבֶר
  choice: от мора
  rationale: דֶּבֶר обозначает мор, повальную смертельную болезнь как бедствие и суд; «мор» сохраняет пророческий регистр и остаётся понятным современному читателю.
- source_word: יָמוּת
  choice: умрёт
  rationale: Имперфект в пророческом возвещении естественно передаётся будущим временем.
- source_word: הַקָּרוֹב
  choice: кто близко
  rationale: Передаёт параллель и контраст с הָרָחוֹק без тяжеловесного «ближний».
- source_word: בַּחֶרֶב
  choice: от меча
  rationale: Сохраняет конкретный образ насильственной смерти на войне и соответствует русской библейской идиоматике.
- source_word: יִפּוֹל
  choice: падёт
  rationale: Сохраняет обычный для древнееврейского языка образ гибели от меча.
- source_word: הַנִּשְׁאָר
  choice: кто останется
  rationale: Причастие от שׁאר передано лично-распределительной конструкцией, параллельной началу стиха; техническое «остаток» здесь не требуется.
- source_word: הַנָּצוּר
  choice: окажется в осаде
  rationale: В контексте следующего голода форма естественно понимается как обозначение человека, окружённого и стеснённого осадой; неоднозначность отмечена в сноске.
- source_word: בָּרָעָב
  choice: от голода
  rationale: Передаёт голод как причину смерти и поддерживает трёхчастный ряд бедствий.
- source_word: וְכִלֵּיתִי
  choice: до конца изолью
  rationale: Порода пиэль глагола כלה выражает доведение действия до полного завершения; русская формула естественно сочетается с «гневом» и передаёт полноту суда.
- source_word: חֲמָתִי
  choice: Свой гнев
  rationale: «Гнев» — весомый и общеупотребительный эквивалент חֵמָה; возвратное местоимение естественно указывает на говорящего Бога.
- source_word: בָּם
  choice: на них
  rationale: Передаёт людей как объект полностью совершаемого суда и естественно сочетается с глаголом «изолью».
theological_decisions:
- issue: Передача полноты Божьего суда без смягчения или догматического расширения
  choice: Так Я до конца изолью на них Свой гнев
  alternative: Я исчерпаю на них Свой гнев
  rationale: Текст говорит о полном осуществлении гнева в суде. Выбранная формулировка сохраняет суровость и завершённость действия, не добавляя к стиху позднейших богословских категорий.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм сохранён конструкциями «кто далеко / кто близко / кто останется». Слова «мор», «меч» и «гнев» удерживают конкретность и силу древнееврейского текста без излишней архаизации.
