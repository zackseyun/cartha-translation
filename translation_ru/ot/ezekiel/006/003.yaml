  text: וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים ו/ל/גאית הִנְ/נִ֨י אֲנִ֜י מֵבִ֤יא עֲלֵי/כֶם֙ חֶ֔רֶב וְ/אִבַּדְתִּ֖י בָּמֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/003.yaml
  text: 'and say[a], ‘Mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys: Behold, I myself am bringing a sword upon you[b], and I will destroy your high places.’'
translation:
  language: ru
  text: 'и скажи: «Горы Израиля, слушайте слово Владыки Яхве! Так говорит Владыка Яхве горам и холмам, оврагам[a] и долинам: вот, Я сам наведу на вас меч и уничтожу ваши высоты[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руслам»; речь может идти о руслах водных потоков, ущельях или вади.'
    reason: lexical_alternative
  - marker: b
    text: «Высоты» — культовые места на возвышенностях, нередко связанные с недозволенным или идолопоклонническим культом.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: Горы Израиля
  rationale: Сохраняет прямое обращение к олицетворённым горным областям земли Израиля.
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Естественный русский императив множественного числа, передающий пророческий призыв внимать слову.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: слово Владыки Яхве
  rationale: «Слово» передаёт единственное число דְּבַר; «Владыка» выражает אֲדֹנָי, а «Яхве» сохраняет личное Божье имя יהוה без неестественного повтора «Господь Господь».
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся и естественная формула пророческой речи в современном литературном русском языке.
- source_word: לֶהָרִים וְלַגְּבָעוֹת
  choice: горам и холмам
  rationale: Точно сохраняет два вида возвышенностей; один предлог по нормам русского языка охватывает оба однородных члена.
- source_word: לָאֲפִיקִים
  choice: оврагам
  rationale: В топографическом перечне слово обозначает углубления или водные русла; «овраги» естественно передаёт рельеф местности, а иные значения отмечены в сноске.
- source_word: וְלַגֵּאָיוֹת
  choice: и долинам
  rationale: Передаёт низменные участки рельефа и сохраняет параллелизм перечня.
- source_word: הִנְנִי אֲנִי
  choice: вот, Я Сам
  rationale: «Вот» передаёт указательно-презентативную силу הִנֵּה, а «Я Сам» естественно сохраняет усиление удвоенного указания на первое лицо.
- source_word: מֵבִיא עֲלֵיכֶם חֶרֶב
  choice: наведу на вас меч
  rationale: Идиоматично выражает приближающееся действие суда и сохраняет образ меча как орудия войны.
- source_word: וְאִבַּדְתִּי
  choice: и уничтожу
  rationale: 'Ясно передаёт каузативное значение: заставить погибнуть, истребить.'
- source_word: בָּמוֹתֵיכֶם
  choice: ваши святилища на высотах
  rationale: Передаёт не просто возвышенности, а культовые места, обозначаемые термином בָּמוֹת; сноска поясняет их функцию без чрезмерного уточнения в тексте.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Раздельно передаёт титул אֲדֹנָי и личное имя יהוה, избегая смешения двух элементов и сохраняя явное присутствие Божьего имени в еврейском тексте.
- issue: Характер культовых мест בָּמוֹת
  choice: святилища на высотах
  alternative: высоты; идольские капища
  rationale: Выбранный вариант обозначает культовую функцию, но не добавляет к самому слову категорического утверждения, что каждое такое место непременно было идольским; отрицательная оценка здесь выражена угрозой уничтожения и контекстом.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис прямой и понятный; усиление הִנְנִי אֲנִי передано естественным выражением «вот, Я Сам». Обращение к элементам рельефа сохранено как олицетворение.
