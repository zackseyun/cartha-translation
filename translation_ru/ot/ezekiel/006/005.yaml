    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И Я положу
  rationale: Глагол נתן имеет широкий диапазон значений («дать, положить, поместить»). При прямом дополнении «трупы» и обороте «перед их идолами» русское «положу» естественно и конкретно передаёт действие.
- source_word: פִּגְרֵי
  choice: трупы
  rationale: Слово פגר обозначает труп или мёртвое тело. «Трупы» сохраняет краткость и суровую силу образа.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквально «сыны Израиля»; в родительном падеже после слова «трупы» — «сынов Израиля». Сохранено традиционное этническое и заветное обозначение исходного текста.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Предлог означает «перед, перед лицом». «Перед» естественно по-русски и сохраняет намеренную иронию: мёртвые тела оказываются перед идолами.'
- source_word: גִּלּוּלֵיהֶם
  choice: их идолами
  rationale: גִּלּוּלִים — характерное для Иезекииля презрительное обозначение идолов. В основном тексте выбран ясный русский эквивалент «идолы», а уничижительный оттенок раскрыт в сноске.
- source_word: וְזֵרִיתִי
  choice: и разбросаю
  rationale: זרה может означать «рассеивать, развеивать». С костями в роли дополнения «разбросаю» передаёт конкретный и насильственный характер действия естественнее, чем более отвлечённое «рассею».
- source_word: עַצְמוֹתֵיכֶם
  choice: ваши кости
  rationale: Существительное прямо означает «кости», а суффикс второго лица множественного числа сохраняет непосредственное обращение к слушателям.
- source_word: סְבִיבוֹת
  choice: вокруг
  rationale: Слово обозначает окружающее пространство; «вокруг» кратко и идиоматично связывается с последующим существительным.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: ваших жертвенников
  rationale: מִזְבֵּחַ означает «жертвенник». Местоименное окончание второго лица множественного числа сохранено, поскольку речь идёт о жертвенниках адресатов, связанных с их ложным поклонением.
theological_decisions:
- issue: Передача заветно-этнического выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; народа Израиля
  rationale: Формулировка сохраняет образ и языковую фактуру еврейского выражения, которое здесь служит общим обозначением народа и не обязательно ограничивает смысл только мужчинами.
- issue: Передача полемического наименования גִּלּוּלִים
  choice: идолами с пояснительной сноской
  alternative: мерзкими идолами; навозными идолами
  rationale: Основной текст ясно называет предмет осуждения, не закрепляя спорную этимологическую конкретизацию. Презрительный оттенок исходного слова сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Суровая образность оригинала сохранена без эвфемизмов; синтаксис остаётся ясным для обычного читателя.
