lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит новое пророческое сообщение и связывает его с предшествующим повествованием. Традиционная русская формула «И было…» здесь естественна и сохраняет структуру еврейского текста.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר־יְהוָה слово «слово» точно и понятно передаёт существительное, не заменяя его более толковательным «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом; это соответствует непосредственной форме исходного текста.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица обозначает направленность речи к пророку; «ко мне» — естественное русское соответствие.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит следующую прямую речь. В современном русском эту функцию естественно и без потери смысла выполняет двоеточие; буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон יהוה. Форма «Яхве» сохраняет имя как имя и не подменяет его титулом; примечание поясняет исходную форму.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Двоеточие естественно вводит Божью речь, следующую в следующем стихе.
