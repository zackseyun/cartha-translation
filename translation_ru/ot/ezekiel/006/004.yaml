base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/004.yaml
  text: Your altars will be desolated[a], and your incense altars will be broken[b]; and I will cast down your slain before your idols.
translation:
  language: ru
  text: Ваши жертвенники будут разорены, ваши культовые предметы[a] будут разбиты, и Я повергну ваших убитых перед вашими идолами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «солнечные столбы»; возможно также: «жертвенники для благовоний». Еврейское слово обозначает предметы запрещённого культа, вероятно связанные с почитанием солнца; их точная форма и назначение неясны.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово имеет резко презрительную окраску; возможный перевод: «вашими мерзкими идолами» или даже «вашими навозными идолами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: опустеют
  rationale: Нифаль глагола שׁמם обозначает состояние запустения и разорения. «Опустеют» естественно звучит по-русски и передаёт результат грядущего суда.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: ваши жертвенники
  rationale: Прямой и общепринятый русский эквивалент מִזְבֵּחַ; контекст не требует более узкого значения.
- source_word: נִשְׁבְּרוּ
  choice: будут разбиты
  rationale: Нифаль глагола שׁבר прямо указывает на разрушение предметов. «Будут разбиты» сохраняет страдательное значение и силу образа.
- source_word: חַמָּנֵיכֶם
  choice: ваши солнечные столбы
  rationale: חַמָּנִים — культовые предметы, вероятно связанные с почитанием солнца; точная форма и функция остаются спорными. Конкретный вариант дан в тексте, а неопределённость отмечена в сноске.
- source_word: הִפַּלְתִּי
  choice: Я повергну
  rationale: Хифиль от נפל имеет каузативный смысл «заставить пасть». «Повергну» передаёт намеренное действие Бога и торжественный тон пророчества.
- source_word: חַלְלֵיכֶם
  choice: ваших убитых
  rationale: חָלָל обозначает убитого, сражённого или пронзённого. Формулировка не добавляет отсутствующего в еврейском тексте указания на пол.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Передаёт пространственный смысл предлога и сохраняет иронию суда: поклонники лежат убитыми перед своими бессильными идолами.'
- source_word: גִּלּוּלֵיכֶם
  choice: вашими идолами
  rationale: «Идолы» — ясный современный эквивалент, тогда как резко презрительный оттенок характерного для Иезекииля слова раскрыт в сноске.
theological_decisions:
- issue: Презрительная окраска обозначения идолов у Иезекииля
  choice: В основном тексте — «идолами», с пояснением в сноске
  alternative: «мерзкими идолами» или «навозными идолами»
  rationale: Еврейское גִּלּוּלִים намеренно уничижительно, однако буквальное «навозные идолы» в основном русском тексте могло бы прозвучать как чрезмерно интерпретирующее. Сноска сохраняет риторическую силу оригинала.
- issue: Идентификация חַמָּנִים
  choice: «солнечные столбы» с указанием неопределённости в сноске
  alternative: «жертвенники для благовоний» или «культовые столбы»
  rationale: Термин обозначает запрещённые культовые сооружения или предметы, часто связываемые с солнечным культом, но их точное назначение не бесспорно. Сноска не позволяет представить вероятную идентификацию как несомненную.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией пророческого суда. Синтаксический параллелизм оригинала сохранён; редкий культовый термин пояснён, а не сглажен конфессионально окрашенной трактовкой.
