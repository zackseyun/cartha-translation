  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַכֵּ֨ה בְ/כַפְּ/ךָ֜ וּ/רְקַ֤ע בְּ/רַגְלְ/ךָ֙ וֶֽ/אֱמָר אָ֔ח אֶ֛ל כָּל תּוֹעֲב֥וֹת רָע֖וֹת בֵּ֣ית יִשְׂרָאֵ֑ל אֲשֶׁ֗ר בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר יִפֹּֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/011.yaml
  text: 'Thus says the Lord GOD: Strike your hand and stamp your foot[a], and say, “Alas!” because of all the evil abominations of the house of Israel, who will fall by the sword, by famine[c][b], and by pestilence.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Ударь ладонью[a], топни ногой и скажи: „Увы всем мерзким злодеяниям дома Израиля, чьи жители падут от меча, голода и эпидемии!“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлопни в ладоши». Еврейское выражение описывает резкий выразительный жест, но не уточняет, обо что следует ударить ладонью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сохраняет сочетание титула с личным именем Бога, избегая двусмысленного повтора «Господь Господь».
- source_word: הַכֵּה בְכַפְּךָ
  choice: Ударь ладонью
  rationale: Передаёт буквальный образ выразительного жеста; объект или поверхность удара в еврейском тексте прямо не названы.
- source_word: וּרְקַע בְרַגְלְךָ
  choice: топни ногой
  rationale: Естественно и точно передаёт энергичный жест, выраженный глаголом רקע.
- source_word: וֶאֱמָר אָח
  choice: 'и скажи: «Увы!»'
  rationale: Междометие אָח здесь выражает скорбь ввиду грядущего суда, а не торжество.
- source_word: אֶל כָּל תּוֹעֲבוֹת רָעוֹת
  choice: обо всех мерзких злодеяниях
  rationale: Предлог אֶל обозначает предмет или повод восклицания; сочетание «мерзкие злодеяния» сохраняет одновременно культово-нравственную силу תּוֹעֵבוֹת и оценку רָעוֹת.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет коллективное заветное обозначение народа.
- source_word: אֲשֶׁר ... יִפֹּלוּ
  choice: из-за которых они падут
  rationale: Относительное אֲשֶׁר допускает связь с предшествующими мерзостями; такая формулировка естественна по-русски и сохраняет причинный смысл контекста, не делая сами «мерзости» грамматическим субъектом падения.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: от меча, голода и моровой язвы
  rationale: Передаёт устойчивую пророческую триаду средств суда; «морова язва» сохраняет торжественный библейский регистр и значение смертоносной эпидемии.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача «Яхве» сохраняет личное заветное имя в исходном тексте, а «Владыка» отличает предшествующий титул אֲדֹנָי.
- issue: Причина будущей гибели дома Израиля
  choice: из-за которых они падут
  alternative: которые падут
  rationale: 'Грамматическая соотнесённость אֲשֶׁר неоднозначна: оно может относиться к дому Израиля («которые падут») либо вводить следствие мерзостей. Выбранная формулировка ясно выражает причинную связь, а альтернативу следует учитывать как подлинную синтаксическую возможность.'
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Повеления переданы живо и кратко; «дом Израиля» сохранён как библейское коллективное обозначение. Архаизирующее «морова язва» употреблено осознанно ради точности устойчивой формулы суда, без чрезмерной архаизации остального стиха.
