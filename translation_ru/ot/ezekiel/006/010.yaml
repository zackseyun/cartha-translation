base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/010.yaml
  text: Then they will know that I am Yahweh[b][a]; I did not speak in vain when I said I would bring this disaster upon them.
translation:
  language: ru
  text: 'И они узнают, что Я — Яхве: не напрасно[a] Я говорил, что наведу на них это бедствие.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не без причины»; буквально: «не напрасно», то есть не впустую и не без основания.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обычно означает «зло», но здесь — бедствие или calamity как суд, а не нравственное зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнают они
  rationale: Перфект с союзом в пророческом контексте передаёт будущий результат суда; союз сохранён как «и», а порядок слов придаёт формуле естественную торжественность.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: Сохранена характерная для Иезекииля формула узнавания и личное имя Бога передано транслитерацией.
- source_word: לֹא אֶל חִנָּם דִּבַּרְתִּי
  choice: не напрасно Я говорил
  rationale: «Не напрасно» сохраняет возможный смысл не пустой и не остающейся без исполнения речи, не сводя выражение только к отсутствию причины.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: что наведу на них
  rationale: Буквальное «сделать им» по-русски неестественно; в сочетании с бедствием оборот «навести на них» ясно выражает намеренное действие.
- source_word: הָרָעָה הַזֹּאת
  choice: это бедствие
  rationale: В данном контексте רָעָה означает пагубное событие как суд, а не нравственное зло; «бедствие» естественно и сохраняет суровость высказывания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в формуле «Я — Яхве» и не заменяет его титулом.
- issue: Смысл רָעָה применительно к Божьему суду
  choice: бедствие
  alternative: зло; несчастье
  rationale: Контекст говорит о постигшем людей суде, а не о нравственном зле; при этом перевод не смягчает ответственность Бога за объявленное бедствие.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Формула узнавания сохранена близко к еврейскому тексту; архаичные обороты сведены к минимуму.
