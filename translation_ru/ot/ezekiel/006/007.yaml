  yaml_path: translation/ot/ezekiel/006/007.yaml
  text: The slain will fall in your midst[a], and you will know that I am Yahweh.
translation:
  language: ru
  text: И среди вас падут убитые, и вы узнаете, что Я — Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (YHWH); «Яхве» — передача этого имени. Традиционный вариант: «Господь».'
    reason: Пояснение передачи божественного имени יהוה и традиционного варианта.
lexical_decisions:
- source_word: וְנָפַל חָלָל
  choice: падут убитые
  rationale: Еврейское сочетание буквально имеет единственное число с собирательным значением; русское множественное число естественно передаёт множество погибших в контексте суда. Глагол сохраняет образ падения от насильственной смерти.
- source_word: בְּתוֹכְכֶם
  choice: среди вас
  rationale: Передаёт местонахождение погибших внутри сообщества адресатов естественным современным русским языком.
- source_word: וִידַעְתֶּם
  choice: вы узнаете
  rationale: Будущее время передаёт характерную для Иезекииля формулу последующего признания; «узнаете» здесь естественнее, чем статическое «будете знать».
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: Сохраняет прямую формулу самооткровения и передаёт тетраграмматон как личное имя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет различие между личным именем и титулом, а традиционный русский вариант указан в примечании.
- issue: Смысл формулы וִידַעְתֶּם כִּי
  choice: вы узнаете, что
  alternative: вы будете знать, что
  rationale: Формула выражает достигнутое через суд признание личности Яхве, не уточняя сверх текста характер этого признания.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксический параллелизм исходного текста сохранён; архаизмы не использованы.
