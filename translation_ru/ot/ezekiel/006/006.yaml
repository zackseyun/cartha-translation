source:
  edition: WLC
  text: בְּ/כֹל֙ מוֹשְׁב֣וֹתֵי/כֶ֔ם הֶ/עָרִ֣ים תֶּחֱרַ֔בְנָה וְ/הַ/בָּמ֖וֹת תִּישָׁ֑מְנָה לְמַעַן֩ יֶחֶרְב֨וּ וְ/יֶאְשְׁמ֜וּ מִזְבְּחֽוֹתֵי/כֶ֗ם וְ/נִשְׁבְּר֤וּ וְ/נִשְׁבְּתוּ֙ גִּלּ֣וּלֵי/כֶ֔ם וְ/נִגְדְּעוּ֙ חַמָּ֣נֵי/כֶ֔ם וְ/נִמְח֖וּ מַעֲשֵׂי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/006.yaml
  text: In all your dwelling places[a], the cities will be laid waste and the high places will be desolated, so that your altars may be laid waste and desolated, and your idols broken and brought to an end, and your incense altars cut down[b], and your works wiped out.
translation:
  language: ru
  text: Во всех местах, где вы живёте, города будут разорены, а высоты — опустошены, чтобы ваши жертвенники были разорены и опустели, ваши идолы[a] — разбиты и уничтожены, ваши культовые столбы[b] — срублены, а всё, что вы сделали, — стёрто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово גִּלּוּלִים — презрительное обозначение идолов; возможно, в нём слышится смысл «нечистые» или даже «навозные идолы».
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово обозначает культовые предметы не вполне ясного вида; возможные переводы: «солнечные столбы», «изображения солнца» или «жертвенники для курений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: местах, где вы живёте
  rationale: Передаёт широкий смысл мест проживания и поселения естественным современным русским языком.
- source_word: הֶעָרִים תֶּחֱרַבְנָה
  choice: города будут разорены
  rationale: Глагол חרב здесь обозначает разорение и запустение в результате суда.
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Устоявшийся библейский термин для культовых мест, часто располагавшихся на возвышенностях; конкретный культовый смысл сохраняется.
- source_word: תִּישָׁמְנָה
  choice: будут опустошены
  rationale: Передаёт состояние запустения и поддерживает параллелизм с разорением городов.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Сохраняет заложенную в связке возможность целевого и результирующего оттенка.
- source_word: יֶחֶרְבוּ וְיֶאְשְׁמוּ מִזְבְּחוֹתֵיכֶם
  choice: ваши жертвенники были разорены и опустели
  rationale: 'Оба глагола переведены раздельно: первый выражает разорение, второй — наступившее запустение.'
- source_word: גִּלּוּלֵיכֶם
  choice: ваши идолы
  rationale: Ясный основной эквивалент; презрительная окраска еврейского слова отмечена в сноске.
- source_word: וְנִשְׁבְּרוּ וְנִשְׁבְּתוּ
  choice: разбиты и уничтожены
  rationale: Первый глагол означает физическое сокрушение, второй — прекращение существования или действия; русский перевод сохраняет нарастание мысли.
- source_word: חַמָּנֵיכֶם
  choice: ваши культовые столбы
  rationale: Нейтральное обозначение спорного культового предмета не решает без достаточных оснований, был ли он связан прежде всего с солнцепоклонством или с воскурениями; глагол «срублены» поддерживает предметный образ.
- source_word: וְנִמְחוּ מַעֲשֵׂיכֶם
  choice: всё, что вы сделали, — стёрто
  rationale: 'Сохраняет образ стирания и неоднозначность מַעֲשִׂים: речь может идти как о делах, так и об изготовленных культовых предметах.'
theological_decisions:
- issue: Передача осуждения идолопоклонства
  choice: Сохранить конкретные культовые термины и прямой язык разрушения, отметив презрительный оттенок слова об идолах в сноске.
  alternative: Истолковательно перевести как «мерзкие идолы» либо обобщить содержание до осуждения ложной религии.
  rationale: Еврейский текст осуждает конкретные места и предметы культа; перевод не должен ни смягчать это осуждение, ни усиливать его добавочной риторикой.
- issue: Неясная природа חַמָּנִים
  choice: Использовать в тексте нейтральное «культовые столбы», а возможные конкретные толкования привести в сноске.
  alternative: Однозначно перевести как «солнечные столбы» или «жертвенники для курений».
  rationale: Точный вид обозначенного культового предмета остаётся спорным; нейтральная формулировка сохраняет подлинную лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллельные пассивные конструкции и повторение лексики разрушения сохранены, но синтаксис сделан естественным для обычного читателя.
