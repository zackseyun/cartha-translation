base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/010.yaml
  text: They uncovered her nakedness[a]; they took her sons and her daughters, and they killed her with the sword. So she became a byword among women[c][b], and they executed judgments on her.
translation:
  language: ru
  text: Они обнажили её наготу[a], забрали её сыновей и дочерей и убили её мечом. Так она стала притчей среди женщин[b], и они подвергли её судебным карам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открыли её наготу»; еврейский оборот может также подразумевать публичное выставление на позор.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «она приобрела дурную славу среди женщин»; буквально: «она стала именем среди женщин».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «привели над ней в исполнение судебные решения»; еврейское слово стоит во множественном числе и обозначает действия суда или наказания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלּוּ עֶרְוָתָהּ
  choice: обнажили её наготу
  rationale: Сохраняет конкретный еврейский оборот «открыть наготу», его резкость и оттенок публичного унижения, не подменяя образ абстрактным словом «позор».
- source_word: בָּנֶיהָ וּבְנוֹתֶיהָ לָקָחוּ
  choice: забрали её сыновей и дочерей
  rationale: Глагол לקח имеет широкое значение «брать, забирать». В контексте завоевания речь, вероятно, идёт о пленении или уводе, однако перевод не вносит отсутствующей в самом глаголе конкретизации.
- source_word: וְאוֹתָהּ בַּחֶרֶב הָרָגוּ
  choice: убили её мечом
  rationale: Прямо и естественно передаёт обычный глагол הרג «убивать» и сохраняет указание на орудие действия.
- source_word: וַתְּהִי שֵׁם לַנָּשִׁים
  choice: она стала притчей среди женщин
  rationale: Буквально сказано «стала именем среди женщин», то есть приобрела общеизвестную, в данном контексте позорную репутацию. «Стала притчей» естественно передаёт смысл памятного предостерегающего примера.
- source_word: וּשְׁפוּטִים עָשׂוּ בָהּ
  choice: совершили над ней суды
  rationale: Сохраняет множественное число существительного שְׁפוּטִים и судебный характер выражения, не сводя его к общему понятию наказания.
theological_decisions:
- issue: Сексуализированный образ суда над Самарией (Оголой)
  choice: Сохранён образ обнажения наготы.
  alternative: «Они публично опозорили её».
  rationale: Конкретный образ составляет часть пророческой метафоры Иезекииля и выражает одновременно разоблачение, унижение и суд; абстрактный перевод ослабил бы напряжённость текста.
- issue: Судебная сила заключительной фразы
  choice: «совершили над ней суды»
  alternative: «наказали её» или «привели над ней в исполнение приговоры».
  rationale: В еврейском тексте употреблено существительное во множественном числе со значением судебных решений или деяний. Выбранный вариант сохраняет эту формальную и богословскую особенность, не уточняя, чьи именно приговоры имеются в виду.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой образности и судебной лексики оригинала. «Стала притчей» — понятный, несколько возвышенный оборот, уместный для пророческой речи; «совершили над ней суды» намеренно сохраняет необычное множественное число еврейского текста.
