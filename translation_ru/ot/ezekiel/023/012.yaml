base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/012.yaml
  text: She lusted after the sons of Assyria—governors and officials[a], clothed in full attire, horsemen riding horses, all of them desirable young men.
translation:
  language: ru
  text: Она воспылала страстью к сынам Ассирии — наместникам и правителям, приближённым[a], одетым в великолепные одежды, всадникам, едущим верхом на конях, — все они были желанными юношами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находившимся рядом», «близким людям». Значение еврейского слова здесь не вполне ясно; оно может обозначать приближённых или состоявших на близкой службе, но не обязательно воинов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָגָבָה
  choice: воспылала страстью
  rationale: Глагол выражает сильное эротическое влечение в рамках сексуализированной метафоры; такой перевод передаёт силу выражения, не смягчая её.
- source_word: בְּנֵי אַשּׁוּר
  choice: сынам Ассирии
  rationale: Сохранено буквальное древнееврейское выражение, которое по смыслу обозначает ассирийцев и остаётся понятным по-русски.
- source_word: פַּחוֹת
  choice: наместникам
  rationale: Административный титул областных правителей; «наместники» естественно звучит в историческом контексте и не привязывает текст к более узкой поздней терминологии.
- source_word: וּסְגָנִים
  choice: правителям
  rationale: Второй административный титул в паре с פַּחוֹת; обобщённое «правители» сохраняет отличие от наместников, не приписывая должности чрезмерно точного значения.
- source_word: קְרֹבִים
  choice: приближённым
  rationale: Буквально слово означает «близкие» и здесь, вероятно, указывает на людей, находившихся при правителях или на близкой службе. Неопределённость сохранена в примечании, без внесения отсутствующего в тексте значения «воины».
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: одетым в великолепные одежды
  rationale: Фраза передаёт полноту, нарядность или великолепие облачения; выбран естественный русский оборот, сохраняющий впечатляющий внешний вид.
- source_word: פָּרָשִׁים
  choice: всадникам
  rationale: Слово обозначает конников; «всадники» точно и естественно передаёт военный образ.
- source_word: רֹכְבֵי סוּסִים
  choice: едущим на конях
  rationale: Сохранено намеренное повторение после слова «всадники», присутствующее в древнееврейском тексте.
- source_word: בַּחוּרֵי חֶמֶד
  choice: желанными юношами
  rationale: Сочетание характеризует молодых мужчин как привлекательных и желанных, сохраняя эротическую окраску контекста.
- source_word: כֻּלָּם
  choice: все они
  rationale: Передаёт итоговое обобщение и акцент древнееврейской фразы.
