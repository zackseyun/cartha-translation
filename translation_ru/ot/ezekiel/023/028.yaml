base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/028.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am giving you into the hand of those whom you hate, into the hand of those from whom your soul has turned away.'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: «Вот, Я отдаю тебя в руки тех, кого ты ненавидишь, в руки тех, от кого отвернулась твоя душа[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к которым твоя душа питает отвращение»; возможно также: «от которых оторвалась твоя душа». Древнееврейское выражение ярко передаёт глубокое отчуждение, отторжение или разрыв.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание передаёт титул אֲדֹנָי и личное имя Бога יהוה без неестественного повтора «Господь ГОСПОДЬ»; «Владыка» сохраняет значение верховной власти.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» сохраняет указательную силу частицы и торжественность пророческого объявления, оставаясь естественным в современном литературном русском языке.
- source_word: נֹתְנָךְ
  choice: Я отдаю тебя
  rationale: Конструкция הִנְנִי с причастием выражает близкое, уже объявляемое действие. «Отдаю» естественно сочетается с образом передачи во власть и не требует добавления отсутствующего в тексте глагола «предаю».
- source_word: בְּיַד
  choice: в руки
  rationale: Русский оборот «отдать в руки» сохраняет древнееврейскую метафору власти и контроля и звучит естественно.
- source_word: אֲשֶׁר שָׂנֵאת
  choice: тех, кого ты возненавидела
  rationale: Перфект второго лица женского рода передан прошедшим временем и женским родом, соответствующим обращению к Оголиве, то есть Иерусалиму.
- source_word: נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: тех, от кого отвернулась твоя душа
  rationale: Формулировка сохраняет נֶפֶשׁ как «душа» и не устраняет неоднозначность редкого глагола נקע, который здесь может выражать отчуждение, отторжение или разрыв.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: «Владыка Яхве» различает титул и личное имя, сохраняет прямое присутствие тетраграмматона в исходном тексте и избегает конфессионально обусловленной замены имени словом «Бог».
- issue: Субъект и адресат суда
  choice: Бог Сам отдаёт олицетворённый Иерусалим во власть бывших союзников
  alternative: Безличное описание политического поражения
  rationale: 'Первое лицо в נֹתְנָךְ и женские формы обращения сохранены, чтобы не ослаблять богословское напряжение текста: политическая катастрофа представлена как непосредственный Божий суд.'
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого регистра. Повтор «в руки тех» воспроизводит риторический параллелизм исходного текста; женские формы обозначают обращение к Оголиве, олицетворяющей Иерусалим.
