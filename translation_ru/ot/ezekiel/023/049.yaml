base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/049.yaml
  text: They will put your lewdness upon you[a], and you will bear the sins of your idols; then you will know that I am the Lord YHWH.
translation:
  language: ru
  text: Они возложат на вас ваше распутство, и вы понесёте грехи, связанные с вашими идолами[a]. Тогда вы узнаете, что Я — Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово גִּלּוּלִים — резко презрительное обозначение идолов; его можно передать как «мерзкие идолы» или, более буквально и грубо, «навозные идолы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ ... עֲלֵיכֶן
  choice: они возложат на вас
  rationale: Сохраняет конкретное значение נתן с предлогом עַל и судебный образ последствий, возлагаемых на виновных; перфект в данном пророческом контексте передан будущим временем.
- source_word: זִמַּתְכֶנָה
  choice: ваше распутство
  rationale: В Иезекииля 23 слово זִמָּה обозначает постыдное сексуально-нравственное поведение; «распутство» естественно передаёт эту окраску без излишней конкретизации.
- source_word: וַחֲטָאֵי גִלּוּלֵיכֶן
  choice: грехи, совершённые с вашими идолами
  rationale: Конструкция допускает краткое «грехи ваших идолов», но идолы не представлены совершающими грехи. Формулировка указывает на грехи адресатов, связанные с идолопоклонством, и сохраняет отдельное упоминание идолов.
- source_word: תִּשֶּׂאינָה
  choice: вы понесёте
  rationale: נשא с грехами означает нести их на себе и отвечать за них; «понесёте» сохраняет судебную и нравственную весомость образа.
- source_word: וִידַעְתֶּם
  choice: тогда вы узнаете
  rationale: Союз связывает узнавание с предшествующим судом как его результатом; «тогда» естественно выражает эту последовательность.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה, избегая неестественного удвоения «Господь Господь».
theological_decisions:
- issue: Связь грехов с идолами в выражении וַחֲטָאֵי גִלּוּלֵיכֶן
  choice: грехи, совершённые с вашими идолами
  alternative: грехи ваших идолов
  rationale: Выбранный вариант не приписывает грех самим изображениям, но и не сужает смысл исключительно до абстрактной «вины идолопоклонства».
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Транслитерация сохраняет явное присутствие личного имени Бога в еврейском тексте, а «Владыка» отличает титул אֲדֹנָי от имени יהוה.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Местоимение «вы» естественно охватывает адресатов, несмотря на колебание грамматического рода во множественном числе в еврейском тексте. Маркер сноски поставлен непосредственно после слова «идолами», к которому относится пояснение.
