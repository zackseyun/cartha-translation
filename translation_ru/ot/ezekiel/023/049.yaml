  source_fidelity: 'Основной смысл передан верно: речь идёт о судебном воздаянии за распутство и о несении грехов, связанных с идолами. Однако «грехи, совершённые с вашими идолами» необоснованно конкретизирует конструкцию חֲטָאֵי גִלּוּלֵיכֶן: она не говорит именно о грехах, совершённых «с» идолами, и включает весь комплекс грехов, относящихся к ним.'
