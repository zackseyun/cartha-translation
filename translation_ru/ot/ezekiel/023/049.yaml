  terminology: «Распутство», «идолы», «понесёте» и «Владыка Яхве» приемлемо передают соответственно זִמָּה, גִלּוּלִים, נשׂא и אֲדֹנָי יְהוִה. Сноска уместно отмечает презрительную окраску גִלּוּלִים и правильно привязана к слову «идолы».
