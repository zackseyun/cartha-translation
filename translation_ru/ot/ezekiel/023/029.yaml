  text: וְ/עָשׂ֨וּ אוֹתָ֜/ךְ בְּ/שִׂנְאָ֗ה וְ/לָקְחוּ֙ כָּל יְגִיעֵ֔/ךְ וַ/עֲזָב֖וּ/ךְ עֵירֹ֣ם וְ/עֶרְיָ֑ה וְ/נִגְלָה֙ עֶרְוַ֣ת זְנוּנַ֔יִ/ךְ וְ/זִמָּתֵ֖/ךְ וְ/תַזְנוּתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/029.yaml
  text: They will deal with you in hatred[a], and they will take all your wealth, and leave you naked and bare; and the nakedness of your prostitutions will be uncovered[c][b], your lewdness and your acts of prostitution.
translation:
  language: ru
  text: Они обойдутся с тобой из ненависти, заберут всё нажитое тобой[a] и оставят тебя обнажённой и неприкрытой; откроется нагота твоего блуда — твой разврат и твои блудодеяния[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «весь твой труд»; имеется в виду всё приобретённое трудом, плод твоих усилий.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «откроется нагота твоего блуда вместе с твоим развратом и твоими блудодеяниями». Связь последних выражений в еврейском тексте можно понимать либо как пояснение, либо как перечисление.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְעָשׂוּ אוֹתָךְ בְּשִׂנְאָה
  choice: Они поступят с тобой с ненавистью
  rationale: Передаёт идиому עשה + объект + בְּ как обращение с кем-либо и сохраняет явное указание на ненависть как образ действия.
- source_word: וְלָקְחוּ כָּל יְגִיעֵךְ
  choice: заберут всё нажитое тобой
  rationale: יְגִיעַ буквально обозначает труд, но также плод труда; в контексте разграбления естественное русское выражение «всё нажитое» сохраняет обе смысловые стороны.
- source_word: וַעֲזָבוּךְ עֵירֹם וְעֶרְיָה
  choice: оставят нагой и обнажённой
  rationale: Двойное выражение сохраняет усиление еврейской пары и одновременно передаёт полную лишённость и позорную открытость.
- source_word: וְנִגְלָה
  choice: тогда откроется
  rationale: Форма продолжает последовательность будущих событий; «откроется» поддерживает образ наготы и публичного разоблачения.
- source_word: עֶרְוַת זְנוּנַיִךְ
  choice: нагота твоего разврата
  rationale: «Нагота» сохраняет буквальный образ עֶרְוָה и его оттенок позорного обнажения; «разврат» естественно передаёт здесь собирательно-интенсивное זְנוּנִים, не смягчая сексуальную метафору.
- source_word: וְזִמָּתֵךְ
  choice: твоя похоть
  rationale: В данном сексуальном контексте זִמָּה обозначает распущенность или похотливую порочность, а не просто замысел.
- source_word: וְתַזְנוּתָיִךְ
  choice: твой блуд
  rationale: Сохраняет накопление близких по смыслу обозначений сексуальной распущенности и традиционно понятную библейскую метафору неверности.
theological_decisions:
- issue: Сексуальная метафора неверности
  choice: Сохранить прямые образы наготы, разврата, похоти и блуда.
  alternative: Смягчить их до «неверности», «безнравственности» или «порочности».
  rationale: Иезекииль намеренно использует резкую сексуальную образность для изображения неверности и грядущего позора; её смягчение ослабило бы пророческую риторику.
- issue: Синтаксическая связь заключительных существительных
  choice: Передать «твоя похоть и твой блуд» как пояснение к «наготе твоего разврата» через тире.
  alternative: 'Понимать их как дополнительные, отдельно открываемые проявления: «вместе с твоей похотью и твоим блудом».'
  rationale: Единственное число וְנִגְלָה и единственный грамматический субъект עֶרְוַת благоприятствуют приложению, однако альтернативная координация остаётся возможной и отмечена в сноске [b].
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род сохранён, поскольку адресат представлен в главе как женщина. Явная сексуальная образность оригинала не эвфемизирована; тире делает вероятное приложение естественным по-русски.
