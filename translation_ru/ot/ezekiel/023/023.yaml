  text: בְּנֵ֧י בָבֶ֣ל וְ/כָל כַּשְׂדִּ֗ים פְּק֤וֹד וְ/שׁ֨וֹעַ֙ וְ/ק֔וֹעַ כָּל בְּנֵ֥י אַשּׁ֖וּר אוֹתָ֑/ם בַּח֨וּרֵי חֶ֜מֶד פַּח֤וֹת וּ/סְגָנִים֙ כֻּלָּ֔/ם שָֽׁלִשִׁים֙ וּ/קְרוּאִ֔ים רֹכְבֵ֥י סוּסִ֖ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/023.yaml
  text: the sons of Babylon and all the Chaldeans[a], Pekod and Shoa and Koa, all the sons of Assyria with them—desirable young men, all of them governors and officials, officers and men of renown[b], all of them riding on horses.
translation:
  language: ru
  text: сыновья Вавилона и все халдеи, Пекод[a], Шоа и Коа, и с ними все сыновья Ассирии — желанные юноши, все они наместники и сановники, военачальники и именитые люди[b], все они всадники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пекод, Шоа и Коа, вероятно, названия народов или областей, союзных Вавилону; некоторые понимают эти слова как обозначения должностных лиц, знати или воинов.
    reason: alternative_reading
  - marker: b
    text: 'Или: «знатные люди»; буквальнее: «названные» или «призванные».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בָבֶל
  choice: сыновья Вавилона
  rationale: Сохранён еврейский этнический оборот и его параллелизм с выражением «сыновья Ассирии»; по-русски он понятен, хотя и звучит торжественно.
- source_word: כַּשְׂדִּים
  choice: халдеи
  rationale: Сохранено традиционное этническое наименование, не слитое с обозначением Вавилона.
- source_word: פְּקוֹד וְשׁוֹעַ וְקוֹעַ
  choice: Пекод, Шоа и Коа
  rationale: В контексте перечня народов эти формы переданы как собственные имена народов или областей; возможное нарицательное понимание отмечено в сноске.
- source_word: כָּל בְּנֵי אַשּׁוּר אוֹתָם
  choice: и с ними все сыновья Ассирии
  rationale: Сохранён параллельный этнический оборот; אוֹתָם понято как указание на совместное присутствие.
- source_word: בַּחוּרֵי חֶמֶד
  choice: желанные юноши
  rationale: Передаёт как молодость, так и привлекательность или желанность, важную для образности всей главы.
- source_word: פַּחוֹת
  choice: наместники
  rationale: Термин обозначает высоких провинциальных управителей; «наместники» естественно передаёт административный титул в древнеимперском контексте.
- source_word: סְגָנִים
  choice: сановники
  rationale: Передаёт высокопоставленных должностных лиц и сохраняет отличие от наместников.
- source_word: שָׁלִשִׁים
  choice: военачальники
  rationale: Контекст требует обозначения военного чина; более узкое историко-техническое значение слова остаётся неопределённым.
- source_word: קְרוּאִים
  choice: именитые люди
  rationale: В почётном перечне причастие, буквально означающее «названные/призванные», вероятно, указывает на признанное положение; буквальная и иная смысловая передачи приведены в сноске.
- source_word: רֹכְבֵי סוּסִים
  choice: всадники
  rationale: Краткая и естественная русская передача людей, едущих верхом на конях.
- source_word: כֻּלָּם ... כֻּלָּם ... כֻּלָּם
  choice: все ... все они ... все они
  rationale: Повтор сохранён настолько, насколько это допускает естественный русский синтаксис, чтобы передать накопительное усиление оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Этнические обороты «сыновья Вавилона» и «сыновья Ассирии» намеренно сохранены ради параллелизма оригинала. Перечень должностей сделан ясным, но без чрезмерно точной реконструкции древних чинов.
