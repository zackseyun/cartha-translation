  yaml_path: translation/ot/ezekiel/023/019.yaml
  text: Yet she multiplied her prostitutions[a], remembering the days of her youth, when she prostituted herself in the land of Egypt.
translation:
  language: ru
  text: Но она умножила свои блудодеяния[a], вспоминая дни своей юности, когда блудила в земле Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она всё больше предавалась блуду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּרְבֶּה
  choice: Но она умножала
  rationale: Глагол רבה в хифиле передаёт значение увеличения, умножения. Союз «но» уместно выражает контекстуальный оттенок продолжения порочного поведения вопреки предшествующему осуждению; несовершенный вид естественно передаёт продолжавшееся действие.
- source_word: תַּזְנוּתֶיהָ
  choice: свой блуд
  rationale: Существительное от זנה обозначает блуд, проституцию и повторяющиеся проявления сексуальной распущенности; в пророческом образе оно также указывает на заветную и политическую неверность. «Блуд» сохраняет резкость метафоры и звучит в современном литературном русском достойнее, чем грубые либо архаичные варианты.
- source_word: לִזְכֹּר
  choice: вспоминая
  rationale: Инфинитив с ל допускает значение сопутствующего обстоятельства или цели. Деепричастие сохраняет смысловую связь между умножением блуда и воспоминанием о прежнем поведении, не устраняя этой лёгкой синтаксической неоднозначности.
- source_word: יְמֵי נְעוּרֶיהָ
  choice: дни своей юности
  rationale: Близкая к форме оригинала передача устойчивого временного выражения, относящегося к раннему периоду её истории.
- source_word: אֲשֶׁר זָנְתָה
  choice: когда блудила
  rationale: Глагол זנה передан в соответствии с ключевой метафорой стиха. «Когда» естественно выражает временное значение относительной конструкции אֲשֶׁר в данном контексте.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохранена полная географическая формула оригинала. Такая форма литературна, понятна и удерживает библейский исторический колорит.
theological_decisions:
- issue: Сексуальная метафора идолопоклонства и политической неверности
  choice: Сохранить прямую лексику блуда
  alternative: Смягчить до «неверности» или «распутства»
  rationale: Иезекииль намеренно использует резкий сексуальный образ для описания заветного и политического отступничества. Смягчение ослабило бы пророческую риторику и сузило образ до заранее истолкованного значения.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Резкость исходной метафоры сохранена без добавочной грубости; синтаксис остаётся ясным для широкого читателя.
