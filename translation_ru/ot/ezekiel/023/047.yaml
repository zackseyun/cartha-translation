base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/047.yaml
  text: And the assembly will stone them with stones and cut them down with their swords. They will kill their sons and their daughters[a], and burn their houses with fire.
translation:
  language: ru
  text: И собрание побьёт их камнями и изрубит их своими мечами.[a] Их сыновей и дочерей они убьют, а дома их сожгут огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассечёт их»; еврейское слово обозначает рубку или рассечение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָגְמוּ עֲלֵיהֶן אֶבֶן
  choice: забросает их камнями
  rationale: Глагол רגם обозначает побивание или нападение камнями; единственное אֶבֶן здесь имеет собирательно-инструментальный смысл. Русское «забросает их камнями» прямо и естественно передаёт конструкцию.
- source_word: קָהָל
  choice: собрание
  rationale: Слово обозначает собравшуюся общину или множество людей и в данном контексте сохраняет оттенок коллективного суда; «толпа» было бы менее формальным.
- source_word: וּבָרֵא אוֹתְהֶן
  choice: и изрубит их
  rationale: Редкая форма от ברא в породе пиэль передаёт рубку или рассечение. «Изрубит» сохраняет жестокий образ действия мечами и звучит естественно по-русски.
- source_word: בְּחַרְבוֹתָם
  choice: своими мечами
  rationale: Предлог בְּ имеет инструментальное значение, а возвратное «своими» ясно связывает мечи с исполнителями действия.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: их сыновей и дочерей
  rationale: Перевод сохраняет явное различение сыновей и дочерей, не сводя выражение к общему слову «дети».
- source_word: יַהֲרֹגוּ
  choice: они убьют
  rationale: הרג — обычный глагол со значением «убивать»; выбран современный прямой эквивалент без архаизации.
- source_word: וּבָתֵּיהֶן בָּאֵשׁ יִשְׂרֹפוּ
  choice: а дома их сожгут огнём
  rationale: Сохранены конкретное «дома» и эмфатическая еврейская формула уничтожения огнём; союз «а» естественно вводит последний элемент ряда.
theological_decisions:
- issue: К кому относятся местоимения женского рода множественного числа
  choice: Передано местоимением «их» без поясняющего наименования женщин
  alternative: «этих женщин»
  rationale: Еврейские местоимения отсылают к Оголе и Оголиве в предшествующей аллегории. Местоименная передача сохраняет связность исходного текста и не добавляет отсутствующего в стихе толкования.
- issue: Коллективное и грамматически меняющееся число исполнителей
  choice: «собрание» при первом сказуемом и «они» в следующем предложении
  alternative: Повсюду заменить субъект множественным «собравшиеся»
  rationale: Так сохраняется ключевое существительное קָהָל и одновременно отражаются формы множественного числа еврейских глаголов; коллектив понимается как состоящий из многих исполнителей.
translation_notes:
  register: Современный литературный русский язык с прямой, сдержанно возвышенной библейской речью. Конкретные образы судебной расправы сохранены без смягчения; архаизмы вроде «побьют каменьями» и «предадут мечу» не использованы.
