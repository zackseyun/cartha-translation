  yaml_path: translation/ot/ezekiel/023/005.yaml
  text: Oholah played the prostitute while under me[a], and she lusted after her lovers[c][b], the Assyrians who were nearby.
translation:
  language: ru
  text: И Огола блудила, будучи подо Мною[a], и воспылала страстью к своим любовникам[b] — к ассирийцам, которые были поблизости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение указывает на её положение под властью и покровительством Господа в образе брачного союза.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страстно возжелала своих любовников»; еврейский глагол выражает сильное чувственное влечение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к ассирийцам, которые были близко»; буквально: «к близким (находящимся рядом) ассирийцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזֶן
  choice: стала блудить
  rationale: Сохраняет явную сексуальную метафору זנה, которой пророк изображает идолопоклонство и неверность завету, не сводя смысл лишь к политическому союзу.
- source_word: אָהֳלָה
  choice: Огола
  rationale: Традиционная и узнаваемая русская передача собственного имени; имя транслитерируется, а не переводится.
- source_word: תַּחְתָּי
  choice: хотя была подо Мною
  rationale: Буквально сохраняет образ пребывания под властью и покровительством Господа; «хотя» естественно передаёт контраст, подразумеваемый контекстом, но не устраняет буквальную пространственно-реляционную метафору.
- source_word: וַתַּעְגַּב
  choice: воспылала страстью к
  rationale: Передаёт сильное чувственное, отрицательно окрашенное желание, выраженное глаголом עגב, естественным современным русским языком.
- source_word: מְאַהֲבֶיהָ
  choice: своим любовникам
  rationale: В контексте метафоры супружеской неверности субстантивированная форма обозначает незаконных партнёров; «любовники» сохраняет образ.
- source_word: אֶל אַשּׁוּר
  choice: к ассирийцам
  rationale: Предлог אֶל передаёт направленность желания, а множественное קְרוֹבִים указывает, что אשּׁוּר здесь естественно понимать как ассирийцев.
- source_word: קְרוֹבִים
  choice: жившим поблизости
  rationale: Передаёт наиболее вероятный географический смысл прилагательного во множественном числе, не усиливая его до реляционного «соседи».
theological_decisions:
- issue: Пророческая метафора супружеской неверности, изображающая неверность Самарии завету и её обращение к чужеземным державам
  choice: 'Сохранить прямую сексуальную образность: «стала блудить», «воспылала страстью», «любовникам».'
  alternative: Смягчить до «изменила», «искала союза» или «увлеклась союзниками».
  rationale: Иезекииль намеренно использует резкую сексуальную метафору; её смягчение свело бы богословски насыщенный образ к одной лишь дипломатии.
- issue: Смысл תַּחְתָּי в брачной метафоре
  choice: «хотя была подо Мною» с поясняющей сноской о власти и покровительстве
  alternative: «принадлежа Мне» или только «подо Мною»
  rationale: Формулировка сохраняет метафорическую неоднозначность выражения и одновременно делает контраст понятным по-русски, не подменяя его исключительно отношением собственности.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой пророческой образности. Заглавная буква в «Мною» указывает на Господа в прямой речи. «Огола» выбрано как устоявшаяся русская форма имени; синтаксис сделан плавным, но неоднозначность תַּחְתָּי и קְרוֹבִים отмечена в сносках.
