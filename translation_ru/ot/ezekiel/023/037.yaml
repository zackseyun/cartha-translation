  verdict: revise
  source_fidelity: 'Основной смысл передан точно: повтор обвинения в прелюбодеянии, образ крови на руках, связь с идолами, сыновья, рождённые Богу, и их культовое приношение. Однако в еврейском тексте этого стиха слово «огонь» отсутствует: הֶעֱבִירוּ означает «заставили/дали пройти». Хотя в контексте это связано с детским жертвоприношением и нередко понимается в связи с огнём, вводить огонь в основной текст означает снять невыраженную в данном стихе деталь.'
  naturalness: Фраза в целом литературна и ясна. «Прелюбодействовали» уместно в пророческом регистре и сохраняет повтор оригинала. После устранения добавленного «через огонь» конструкция «заставили ... пройти» точнее передаёт каузативную форму еврейского глагола и остаётся естественной по-русски.
  terminology: «Идолы», «прелюбодействовали», «кровь на их руках» и «сыновья, которых родили Мне» удачны. «Отдав их идолам в пищу» ясно передаёт лָהֶם לְאָכְלָה, не делая необоснованных уточнений. Прописное «Мне» соответствует принятой библейской редакционной норме.
