  text: כִּ֣י נִאֵ֗פוּ וְ/דָם֙ בִּֽ/ידֵי/הֶ֔ן וְ/אֶת גִּלּֽוּלֵי/הֶ֖ן נִאֵ֑פוּ וְ/גַ֤ם אֶת בְּנֵי/הֶן֙ אֲשֶׁ֣ר יָֽלְדוּ לִ֔/י הֶעֱבִ֥ירוּ לָ/הֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/037.yaml
  text: For they have committed adultery[a], and blood is on their hands; they have committed adultery with their idols, and they even made their sons, whom they bore to me[b], pass through the fire to them as food.
translation:
  language: ru
  text: Ибо они прелюбодействовали, и кровь на их руках; они прелюбодействовали со своими идолами и даже заставили сыновей, которых родили Мне, пройти[a], отдав их идолам в пищу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заставили пройти». В этом культовом контексте выражение относится к принесению детей в жертву; слово «огонь» в еврейском тексте этого стиха не названо.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «им в пищу». Дети изображены как жертвенная пища, отданная идолам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֵפוּ
  choice: прелюбодействовали
  rationale: Глагол прямо означает прелюбодеяние и здесь сохраняет одновременно буквальную и метафорическую силу обвинения в неверности Богу.
- source_word: דָם בִּידֵיהֶן
  choice: кровь на их руках
  rationale: Естественная русская идиома, передающая вину за пролитую кровь.
- source_word: גִּלּוּלֵיהֶן
  choice: своими идолами
  rationale: Передаёт основной смысл презрительного обозначения идолов; уничижительный оттенок исходного слова отмечен без введения неестественного выражения в основной текст.
- source_word: וְאֶת גִּלּוּלֵיהֶן נִאֵפוּ
  choice: они прелюбодействовали со своими идолами
  rationale: Сохраняет повтор глагола и пророческий образ духовной измены.
- source_word: בְּנֵיהֶן אֲשֶׁר יָלְדוּ לִי
  choice: сыновей, которых родили Мне
  rationale: Сохраняет конкретное «сыновей» и выраженную дательным оборотом принадлежность детей Богу.
- source_word: הֶעֱבִירוּ
  choice: провели через огонь
  rationale: В культовом контексте выражение обозначает принесение детей в жертву посредством огня; дополнение «через огонь» раскрывает устойчивую идиому.
- source_word: לָהֶם לְאָכְלָה
  choice: отдав им на съедение
  rationale: Сохраняет отнесение жертвы к идолам и страшный образ детей как пищи, при этом звучит естественно по-русски.
theological_decisions:
- issue: Следует ли прямо обозначить огонь в выражении о проведении сыновей
  choice: провели через огонь
  alternative: провели их к ним / принесли их им в жертву
  rationale: Контекст кровопролития и идолослужения указывает на устойчивую формулу детского жертвоприношения. Упоминание огня проясняет идиоматический смысл, не устраняя образность исходного текста.
- issue: Принадлежность рождённых сыновей Богу
  choice: которых родили Мне
  alternative: которых родили для Меня
  rationale: '«Мне» сохраняет краткость и возможную смысловую напряжённость еврейского לִי: Божье притязание на детей не сводится только к цели их рождения.'
translation_notes:
  register: Современный литературный русский язык с сохранением суровой пророческой образности, повтора «прелюбодействовали» и намеренно шокирующего образа жертвенной пищи. Местоимение «Мне» написано с прописной буквы согласно принятой русской библейской норме.
