  - severity: low
    issue: Сноска a утверждает огонь как значение выражения.
    rationale: Нужно различить буквальное значение «заставили пройти» и контекстуальное указание на жертвоприношение; традиционное понимание связи с огнём не должно превращаться в буквальное содержание стиха.
