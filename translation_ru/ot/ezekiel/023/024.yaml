  text: וּ/בָ֣אוּ עָלַ֡יִ/ךְ הֹ֠צֶן רֶ֤כֶב וְ/גַלְגַּל֙ וּ/בִ/קְהַ֣ל עַמִּ֔ים צִנָּ֤ה וּ/מָגֵן֙ וְ/קוֹבַ֔ע יָשִׂ֥ימוּ עָלַ֖יִ/ךְ סָבִ֑יב וְ/נָתַתִּ֤י לִ/פְנֵי/הֶם֙ מִשְׁפָּ֔ט וּ/שְׁפָט֖וּ/ךְ בְּ/מִשְׁפְּטֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/024.yaml
  text: They will come against you with troops, chariots, and wagons, and with an assembly of peoples. They will set shield and buckler and helmet against you on every side, and I will set judgment before them, and they will judge you by their judgments.
translation:
  language: ru
  text: Они пойдут на тебя с войском[a], колесницами и повозками, с полчищем народов. Со всех сторон они выставят против тебя большие и малые щиты и шлемы. Я предоставлю им суд над тобой, и они будут судить тебя по своим законам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово неясно; возможно также: «с оружием» или «с полным военным снаряжением». Некоторые древние и современные переводы понимают его как «с севера».'
    reason: Слово הֹצֶן редкое и текстуально либо лексически спорное; сноска сохраняет реальные варианты понимания.
lexical_decisions:
- source_word: הֹצֶן
  choice: с войском
  rationale: Редкое и неясное слово обозначает, по контексту, военную силу или снаряжение. Выбрано естественное русское «с войском», согласующееся с последующим упоминанием множества народов; неопределённость отражена в сноске.
- source_word: רֶכֶב וְגַלְגַּל
  choice: колесницами и повозками
  rationale: רֶכֶב здесь означает боевые колесницы, а буквальное «колесо» (גַלְגַּל) в военном перечне метонимически указывает на колёсные повозки.
- source_word: צִנָּה וּמָגֵן
  choice: большие и малые щиты
  rationale: 'Два еврейских термина обозначают разные виды щитов: צִנָּה — крупный щит, מָגֵן — меньший щит. Такая передача сохраняет различие без архаичного «баклер».'
- source_word: וְנָתַתִּי לִפְנֵיהֶם מִשְׁפָּט
  choice: Я предоставлю им суд над тобой
  rationale: Передаёт идиому «поставлю перед ними суд» как вручение им полномочия судить, сохраняя связь с последующим глаголом «будут судить».
- source_word: בְּמִשְׁפְּטֵיהֶם
  choice: по своим законам
  rationale: Множественное число מִשְׁפָּטִים здесь указывает на их нормы или судебные установления, а не просто на отдельные приговоры.
theological_decisions:
- issue: Божье действие и человеческий суд
  choice: «Я предоставлю им суд над тобой, и они будут судить тебя по своим законам»
  alternative: «Я вынесу перед ними приговор, и они осудят тебя своими приговорами»
  rationale: 'Выбранный вариант сохраняет напряжение текста: Бог передаёт право суда чужим народам, но те осуществляют его согласно собственным правовым нормам. Перевод не отождествляет их законы непосредственно с Божьим приговором.'
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Военная терминология конкретна и понятна; синтаксический параллелизм и повтор «суд — судить» сохранены без излишней архаизации.
