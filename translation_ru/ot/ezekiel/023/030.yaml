lexical_decisions:
- source_word: עָשֹׂה אֵלֶּה לָךְ
  choice: Это постигло тебя
  rationale: Эллиптическое сочетание отсылает к описанным выше карам. Русское «это постигло тебя» естественно передаёт направленное на женщину действие, не вводя отсутствующего в данной фразе субъекта.
- source_word: בִּזְנוֹתֵךְ
  choice: за то, что ты блудила
  rationale: Сохраняется намеренно резкая половая метафора заветной неверности; предлог ב в данном контексте передан причинно.
- source_word: אַחֲרֵי גוֹיִם
  choice: гоняясь за другими народами
  rationale: אַחֲרֵי выражает следование или погоню за кем-либо. «Гоняясь за» сохраняет образ настойчивого стремления, а «другими» естественно обозначает окружающие чужие народы без излишне конфессионального слова «язычники».
- source_word: נִטְמֵאת
  choice: оскверняла себя
  rationale: Нифаль допускает значение состояния, пассива или возвратности. В контексте виновной причастности к идолопоклонству возвратная передача сохраняет и нечистоту, и ответственность адресата.
- source_word: בְּגִלּוּלֵיהֶם
  choice: их идолами
  rationale: Предлог ב передан инструментальным падежом. Основной текст использует понятное «идолы», а презрительная окраска редкого слова поясняется в сноске.
theological_decisions:
- issue: Сохранение половой метафоры заветной неверности
  choice: ты блудила
  alternative: ты была неверна; предавалась идолопоклонству
  rationale: Иезекииль намеренно изображает религиозно-политическую неверность как блуд. Более отвлечённые варианты объяснили бы образ вместо его передачи.
- issue: Презрительная окраска גִּלּוּלִים
  choice: идолами с пояснением в сноске
  alternative: мерзкими идолами; навозными идолами
  rationale: Прямые русские кальки звучат неестественно или сужают возможную этимологическую образность. Нейтральное общеупотребительное слово в тексте и сноска вместе передают смысл и экспрессию.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой пророческой метафоры. Женский род адресата передан явно. Синтаксис сделан естественным для русского языка без устранения причинной связи между блудом, идолопоклонством и судом.
