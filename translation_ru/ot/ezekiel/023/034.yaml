  text: וְ/שָׁתִ֨ית אוֹתָ֜/הּ וּ/מָצִ֗ית וְ/אֶת חֲרָשֶׂ֛י/הָ תְּגָרֵ֖מִי וְ/שָׁדַ֣יִ/ךְ תְּנַתֵּ֑קִי כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/034.yaml
  text: You will drink it and drain it dry[a], and you will gnaw its shards, and tear off your breasts; for I have spoken, declares the Lord GOD.
translation:
  language: ru
  text: Ты выпьешь её и осушишь до дна, будешь грызть её черепки[a] и оторвёшь свои груди, ибо Я сказал, — возвещает Владыка Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть обломки разбитого глиняного сосуда.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשָׁתִית אוֹתָהּ
  choice: Ты выпьешь её
  rationale: Форма 2-го лица женского рода единственного числа в пророческой речи передаёт предстоящее действие; местоимение женского рода относится к чаше из контекста.
- source_word: וּמָצִית
  choice: и осушишь до дна
  rationale: Глагол מצה обозначает полное извлечение или выпивание содержимого; выражение естественно передаёт исчерпывающее действие.
- source_word: חֲרָשֶׂיהָ
  choice: её черепки
  rationale: Существительное חֶרֶשׂ здесь означает обломки разбитого глиняного сосуда. «Черепки» сохраняет конкретный образ и понятно современному читателю.
- source_word: תְּגָרֵמִי
  choice: будешь грызть
  rationale: Пиэль от גרם передаёт грызение или разгрызание твёрдых предметов; перевод сохраняет намеренно отталкивающий образ.
- source_word: וְשָׁדַיִךְ תְּנַתֵּקִי
  choice: и оторвёшь себе груди
  rationale: Пиэль נתק означает отрывать или вырывать. Возвратное «себе» ясно передаёт самоувечье, не смягчая резкости текста.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: Я сказал это
  rationale: Формула обосновывает непреложность суда. В русском отдельное предложение сохраняет причинно-утверждающую силу без тяжеловесного «ибо».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Господь
  rationale: נְאֻם — пророческая формула Божьего изречения; «Владыка Господь» различает титул אֲדֹנָי и передаваемое традиционным образом имя יהוה.
theological_decisions:
- issue: Передача составного Божьего именования אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве; Господь Бог
  rationale: «Владыка» передаёт אֲדֹנָי, а «Господь» — יהוה в почтительной традиционной форме. Это избегает повтора «Господь Господь» и не вводит конфессионально окрашенного толкования.
- issue: Связь כִּי אֲנִי דִבַּרְתִּי с предшествующим приговором
  choice: Я сказал это
  alternative: ибо Я сказал; потому что Я сказал
  rationale: Причинная частица כִּי указывает, что исполнение суда гарантировано Божьим словом. Разделение на предложение естественно по-русски и сохраняет эту силу в сочетании с последующей формулой «возвещает».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Намеренно жестокие образы грызения черепков и самоувечья сохранены без эвфемизмов; обращение во 2-м лице женского рода выдержано последовательно.
