base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/018.yaml
  text: She uncovered her prostitutions and uncovered her nakedness[a]; then my soul was repulsed by her[c][b], just as my soul had been repulsed by her sister.
translation:
  language: ru
  text: Она выставила напоказ свои распутства и обнажила свою наготу; тогда душа Моя почувствовала к ней отвращение[a], как прежде душа Моя почувствовала отвращение к её сестре[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа Моя отчуждилась от неё»; еврейский глагол выражает сильное внутреннее отторжение или отвращение.'
    reason: lexical_alternative
  - marker: b
    text: То есть к Самарии, названной в этой аллегории Оголой (см. Иез. 23:4).
    reason: cross_reference
lexical_decisions:
- source_word: וַתְּגַל תַּזְנוּתֶיהָ
  choice: выставила напоказ свой разврат
  rationale: Глагол גלה сохраняет образ раскрытия и обнажения, а זְנוּת обозначает развратное поведение, в данном контексте — проституцию как образ неверности. Русское сочетание естественно передаёт публичное обнаружение такого поведения, не смягчая пророческой резкости.
- source_word: וַתְּגַל אֶת־עֶרְוָתָהּ
  choice: обнажила свою наготу
  rationale: Повтор глагольного корня передан близким по образу глаголом «обнажила»; עֶרְוָה непосредственно означает наготу и несёт сексуальный оттенок, который здесь следует сохранить.
- source_word: וַתֵּקַע נַפְשִׁי מֵעָלֶיהָ
  choice: душа Моя отвернулась от неё
  rationale: Редкий глагол נקع выражает отчуждение, отвращение или сильное внутреннее отстранение. «Отвернулась от неё» сохраняет направление удаления מֵעַל и естественно сочетается с буквальным «душа Моя»; сноска отмечает более резкую возможную передачу.
- source_word: כַּאֲשֶׁר נָקְעָה נַפְשִׁי
  choice: как прежде отвернулась
  rationale: Сравнительная конструкция указывает на уже произошедшее такое же отстранение от сестры; «прежде» естественно выявляет временную соотнесённость еврейского перфекта в русском.
- source_word: אֲחוֹתָהּ
  choice: её сестры
  rationale: Прямое обозначение второй женщины в аллегории о двух сёстрах; имя не добавляется в основной текст.
theological_decisions:
- issue: Сексуальная метафора заветной неверности
  choice: Сохранить прямые выражения «разврат» и «нагота»
  alternative: Передать как «неверность» и «позор»
  rationale: У Иезекииля намеренно используется резкая сексуальная образность применительно к идолопоклонству и политико-религиозной неверности. Более отвлечённые слова преждевременно истолковали бы и смягчили текст.
- issue: Антропопатическое описание Божьей реакции
  choice: Сохранить выражение «душа Моя отвернулась»
  alternative: 'Передать без образа души: «Я отвернулся» или усилить до «Мне стало отвратительно»'
  rationale: נַפְשִׁי приписывает говорящему глубокую личную реакцию. Буквальный образ сохраняет напряжённость текста, тогда как характер редкого глагола поясняется в сноске.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и резкости пророческой речи. Заглавная буква в «Моя» указывает на Бога как говорящего. Параллелизм двух частей и повтор реакции на сестёр сохранены без архаизмов.
