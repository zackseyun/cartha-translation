base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/041.yaml
  text: You sat on a splendid couch[a], with a table set before it, and on it you placed my incense and my oil.
translation:
  language: ru
  text: Ты сидела на роскошном ложе; перед ним был накрыт стол, и на него[a] ты поставила Мои благовония и Моё масло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте местоименные суффиксы в выражениях «перед ним» и «на него» стоят в женском роде, и их соотнесение не вполне однозначно. Например, первый может означать «перед нею», то есть перед женщиной, а не перед ложем; второй суффикс также может пониматься иначе.
    reason: alternative_reading
lexical_decisions:
- source_word: יָשַׁבְתְּ
  choice: ты сидела
  rationale: Форма qal, перфект, 2-е лицо женского рода единственного числа; передаёт прямое обращение к женщине и описывает её положение в сцене.
- source_word: מִטָּה כְבוּדָּה
  choice: на роскошном ложе
  rationale: מִטָּה может означать кровать или ложе, а כְבוּדָּה здесь указывает на почётность, великолепие и богатое убранство. «Роскошное ложе» естественно передаёт образ пышной обстановки.
- source_word: שֻׁלְחָן עָרוּךְ
  choice: был накрыт стол
  rationale: Причастие עָרוּךְ означает «приготовленный, расставленный». В данном контексте русское «накрыт стол» идиоматично выражает приготовление стола.
- source_word: לְפָנֶיהָ
  choice: перед ним
  rationale: 'Женский суффикс допускает несколько соотнесений. В основном тексте он понят как относящийся к ложу: стол расположен перед ним; неоднозначность сохранена в сноске.'
- source_word: קְטָרְתִּי
  choice: Мои благовония
  rationale: Существительное с суффиксом 1-го лица единственного числа обозначает принадлежащие Богу или предназначенные Ему благовония. Перевод не добавляет более узкого значения вроде «кадильный состав».
- source_word: שַׁמְנִי
  choice: Моё масло
  rationale: Прямо передаёт שֶׁמֶן с суффиксом 1-го лица единственного числа, не уточняя без достаточного основания, что речь именно о масле для помазания.
- source_word: שַׂמְתְּ עָלֶיהָ
  choice: на него ты поставила
  rationale: Глагол שׂים означает «класть, ставить, помещать». В основном чтении местоимение соотнесено со столом, хотя еврейский женский суффикс формально неоднозначен.
theological_decisions:
- issue: К чему относятся женские местоименные суффиксы в לְפָנֶיהָ и עָלֶיהָ
  choice: Первый передан как относящийся к ложу («перед ним»), второй — к столу («на него»).
  alternative: 'Суффиксы можно соотнести с женщиной либо иначе распределить между женщиной и предметами обстановки: например, «перед тобой» и «на нём/на ней».'
  rationale: 'Выбранное чтение создаёт связную пространственную картину: перед ложем накрыт стол, а Божьи благовония и масло положены на стол. Поскольку морфология не устраняет неоднозначность полностью, альтернативы отмечены в сноске, а не исключены догматически.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Ложе» сохраняет торжественный и образный регистр, а «накрыт стол» звучит естественно для современного читателя. Обращение во 2-м лице женского рода сохранено. Прописные буквы в «Мои» и «Моё» отмечают речь Бога в соответствии с распространённой русской библейской издательской традицией.
