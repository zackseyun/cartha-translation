  rationale: Исправлена синтаксическая привязка обстоятельств и устранены неестественные русские обороты. Сексуализированная пророческая лексика и неоднозначный образ поднятия глаз сохранены. Сноска a помещается после слова «Египте», сноска b — после «ним».
