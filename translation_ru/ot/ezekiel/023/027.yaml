  text: וְ/הִשְׁבַּתִּ֤י זִמָּתֵ/ךְ֙ מִמֵּ֔/ךְ וְ/אֶת זְנוּתֵ֖/ךְ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִשְׂאִ֤י עֵינַ֨יִ/ךְ֙ אֲלֵי/הֶ֔ם וּ/מִצְרַ֖יִם לֹ֥א תִזְכְּרִי עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/027.yaml
  text: So I will put an end to your lewdness from you[a], and your prostitution from the land of Egypt; and you will not lift up your eyes to them[b], and you will remember Egypt no more.
translation:
  language: ru
  text: Я положу конец твоему разврату, избавив тебя от него, и твоему блуду, начавшемуся в Египте. Ты не станешь больше поднимать к ним глаза и больше не вспомнишь о Египте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Я положу конец
  rationale: Каузативная форма глагола שׁבת означает, что Бог заставит это поведение прекратиться; выражение «положу конец» естественно передаёт эту силу по-русски.
- source_word: זִמָּתֵךְ
  choice: твоему разврату
  rationale: В данном контексте זִמָּה обозначает непристойное сексуальное поведение, а не зло вообще; «разврат» сохраняет прямоту и обличительную силу образа.
- source_word: מִמֵּךְ
  choice: удалив его от тебя
  rationale: Так передаётся образ устранения разврата от олицетворённого города, при этом устраняется неестественная для русского конструкция «положу конец… от тебя».
- source_word: וְאֶת זְנוּתֵךְ
  choice: и твоему блуду
  rationale: «Блуд» — понятное в современном литературном русском слово, сохраняющее сексуальную метафору пророческого текста и отличающееся от более общего «разврата».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: идущему из земли Египетской
  rationale: Причастный оборот делает по-русски явной связь блуда с Египтом как местом его происхождения, сохраняя названную в еврейском тексте «землю Египетскую».
- source_word: לֹא תִשְׂאִי עֵינַיִךְ אֲלֵיהֶם
  choice: ты больше не поднимешь глаз к ним
  rationale: Сохранён еврейский образ поднятия глаз, который может подразумевать желание, внимание или надежду и потому не должен быть сужен до одного толкования.
- source_word: וּמִצְרַיִם לֹא תִזְכְּרִי עוֹד
  choice: и уже не вспомнишь о Египте
  rationale: Естественная русская формулировка передаёт прекращение воспоминаний и сохраняет усиление עוֹד — «больше, впредь».
theological_decisions:
- issue: Характер сексуальной образности в пророческой речи
  choice: Сохранить прямые обозначения «разврат» и «блуд» как образ неверности Иерусалима.
  alternative: Смягчить до «безнравственности» или «неверности».
  rationale: Еврейский текст намеренно использует резкую сексуальную метафору для идолопоклонства и политико-религиозной неверности; смягчение ослабило бы пророческое обличение.
- issue: Смысл выражения «поднять глаза к ним»
  choice: Сохранить образное выражение и пояснить диапазон значений в сноске.
  alternative: Истолковать непосредственно как «искать у них помощи» или «желать их».
  rationale: Контекст допускает желание, внимание и зависимость, но не требует выбрать только один из этих оттенков.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и резкости пророческой речи. Обращение во втором лице женского рода относится к олицетворённому городу. Формы «земля Египетская» и «блуд» слегка возвышенны, но остаются понятными обычному современному читателю.
