revisions:
- from: И мало того, они посылали за мужчинами, идущими издалека, к которым был послан вестник. И вот, они пришли к тебе — ты омылась, подкрасила глаза[a] и украсила себя драгоценностями.
  to: И мало того, они посылали за мужчинами, прибывшими издалека, к которым был послан вестник. И вот, они пришли к тебе, а ты перед этим омылась, подвела глаза[a] и украсила себя украшениями.
  rationale: 'Сохранены множественное число в первой части и последующий переход к единственной адресатке, согласно принятому английскому аудиту и допустимому грамматическому разбору формы. Изменены только неестественное обозначение прибытия, чрезмерно конкретное «драгоценностями» и связь действий, чтобы точнее и яснее передать исходный текст. Примечание уточнено: сурьма является возможным конкретным обозначением косметики, но не следует переводить её как косметику именно «на веки».'
