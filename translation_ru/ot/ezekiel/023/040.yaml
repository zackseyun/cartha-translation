base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/040.yaml
  text: And moreover[a], they sent for men coming from far away, to whom a messenger had been sent; and behold, they came—to the one who had washed herself, painted her eyes, and adorned herself with jewelry.
translation:
  language: ru
  text: И мало того, они посылали за мужчинами, прибывшими издалека, к которым был послан вестник. И вот, они пришли к тебе, а ты перед этим омылась, подвела глаза[a] и украсила себя украшениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвела глаза сурьмой». Еврейский глагол обозначает нанесение тёмной косметики на глаза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף כִּי
  choice: И мало того
  rationale: Передаёт добавочное и усилительное значение сочетания, естественно продолжая обвинительную речь.
- source_word: תִשְׁלַחְנָה
  choice: они посылали за
  rationale: Форма третьего лица женского рода множественного числа относится к двум олицетворённым сёстрам-городам; русское «посылали за» естественно выражает приглашение или вызов людей.
- source_word: לַאֲנָשִׁים בָּאִים מִמֶּרְחָק
  choice: за мужчинами, идущими издалека
  rationale: Сохраняет мужской род существительного, причастное значение «идущими» и пространственный образ дальнего пути.
- source_word: אֲשֶׁר מַלְאָךְ שָׁלוּחַ אֲלֵיהֶם
  choice: к которым был послан вестник
  rationale: «Вестник» ясно обозначает человека, а не ангела; пассивная конструкция отражает еврейское страдательное причастие.
- source_word: וְהִנֵּה בָאוּ
  choice: И вот, они пришли
  rationale: «И вот» сохраняет наглядную, драматическую силу пророческого повествования.
- source_word: לַאֲשֶׁר
  choice: к тебе
  rationale: Последующие глаголы стоят во втором лице женского рода единственного числа; прямое «к тебе» естественно и ясно передаёт внезапный переход от двух женщин к одной адресатке.
- source_word: רָחַצְתְּ
  choice: ты омылась
  rationale: Возвратная форма естественно передаёт подготовительное омовение; «омылась» сохраняет dignified literary register без архаизации.
- source_word: כָּחַלְתְּ עֵינַיִךְ
  choice: подкрасила глаза
  rationale: Понятно современному читателю и обозначает нанесение тёмной косметики на глаза; конкретика о сурьме сохранена в примечании.
- source_word: וְעָדִית עֶדִי
  choice: украсила себя драгоценностями
  rationale: Естественно передаёт идиоматическое сочетание глагола и однокоренного существительного, обозначающее надевание украшений.
theological_decisions:
- issue: Переход от женского множественного числа к женскому единственному
  choice: Сохранить множественное «они посылали» и затем перейти к единственному «к тебе — ты омылась…»
  alternative: Сгладить весь стих до единственного или множественного числа
  rationale: 'Смена числа присутствует в еврейском тексте и является частью пророческой риторики: сначала вместе названы обе сестры-города, затем речь обращена к одной из них.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет резкую смену от общего обвинения двух сестёр к прямому обращению к одной женщине; архаические слова сведены к минимуму.
