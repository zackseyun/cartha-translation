  text: בְּ/דֶ֥רֶךְ אֲחוֹתֵ֖/ךְ הָלָ֑כְתְּ וְ/נָתַתִּ֥י כוֹסָ֖/הּ בְּ/יָדֵֽ/ךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/031.yaml
  text: You have walked in the way of your sister[a], so I will put her cup into your hand.
translation:
  language: ru
  text: Ты шла путём своей сестры, поэтому Я вложу её чашу в твою руку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть чашу, назначенную твоей сестре, как образ суда.
    reason: cultural_note
lexical_decisions:
- source_word: בְּדֶרֶךְ
  choice: путём
  rationale: Слово דֶּרֶךְ обозначает путь, дорогу или образ поведения. Здесь оно метафорически указывает на поступки и образ жизни; русское «шла путём» сохраняет образ и звучит естественно.
- source_word: אֲחוֹתֵךְ
  choice: своей сестры
  rationale: Буквальное обозначение родства сохранено как часть аллегории. Возвратное «своей» естественно по-русски соотносит сестру с адресатом.
- source_word: הָלָכְתְּ
  choice: Ты шла
  rationale: Форма Qal перфекта второго лица женского рода означает «ты пошла/ходила». В сочетании с «путём» глагол описывает уже совершавшееся поведение; простое прошедшее время наиболее естественно в русском.
- source_word: וְנָתַתִּי
  choice: поэтому Я вложу
  rationale: Глагол נתן может значить «дать», «положить», «вложить». При чаше и руке «вложу ... в руку» естественно передаёт помещение предмета во владение адресата. Союз выражает следствие, поэтому переведён как «поэтому».
- source_word: כוֹסָהּ
  choice: её чашу
  rationale: Суффикс третьего лица женского рода передан буквально. Образ чаши сохранён без внесения в основной текст толкования о суде или гневе.
- source_word: בְּיָדֵךְ
  choice: в твою руку
  rationale: Хотя предлог בְ буквально часто означает «в», при глаголе נתן сочетание обозначает передачу или помещение в руку; русский винительный оборот естественно выражает направленность действия.
theological_decisions:
- issue: Образ чаши суда
  choice: Сохранить метафору «её чашу» без раскрытия её значения в основном тексте.
  alternative: «чашу её наказания» или «её чашу суда»
  rationale: Еврейский текст говорит только о «её чаше». В контексте это образ назначенного сестре суда, однако явное добавление «суда» или «наказания» устранило бы образную недосказанность оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой образности. Женский род адресата передан формой «шла». Заглавное «Я» обозначает говорящего Бога согласно принятой русской библейской издательской традиции.
