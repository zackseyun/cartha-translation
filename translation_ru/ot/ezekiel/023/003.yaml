  - marker: b
    text: 'Еврейский текст выражается намеренно откровенно: буквально здесь говорится о том, что их груди сжимали или мяли, а затем трогали «груди их девственности». Последнее выражение необычно и допускает несколько способов перевода.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶינָה / זָנוּ
  choice: предавались разврату
  rationale: Глагол זנה обозначает проституцию или блуд и в пророческом образе — неверность. Современная формулировка сохраняет сексуальный смысл и повтор исходного текста, не вводя архаического «блудодействовали».
- source_word: בְמִצְרַיִם
  choice: в Египте
  rationale: Прямое обозначение места.
- source_word: בִּנְעוּרֵיהֶן
  choice: ещё в юности
  rationale: Передаёт временное значение и подчёркивает раннее начало описываемой неверности.
- source_word: שָׁמָּה / וְשָׁם
  choice: там / там
  rationale: Повтор наречия сохранён как элемент ритма и смыслового нажима.
- source_word: מֹעֲכוּ שְׁדֵיהֶן
  choice: мяли их груди
  rationale: מעך буквально означает давить, сжимать, мять. «Мяли» сохраняет грубую телесность и возможный оттенок насилия точнее, чем более мягкое «ласкали».
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֵיהֶן
  choice: ласкали их девичью грудь
  rationale: Необычное сочетание עשה с דדים трудно передать буквально; контекст указывает на сексуальное касание. «Девичью» передаёт связь с בתולים — девичеством или девственностью — без неестественного русского выражения «груди их девственности».
theological_decisions:
- issue: Характер откровенной сексуальной образности в пророческой аллегории
  choice: Сохранить прямую телесную образность и двукратное обвинение в разврате.
  alternative: Смягчить текст до общего указания на неверность или осквернение.
  rationale: Еврейский текст намеренно резок и изображает раннюю неверность Самарии и Иерусалима посредством сексуальной метафоры; смягчение устранило бы важную силу пророческого обвинения.
- issue: Степень добровольности и насилия в описании
  choice: 'Не разрешать напряжение однозначно: первый глагол описывает их собственный разврат, а последующие формы — действия над их телом.'
  alternative: Передать весь эпизод только как добровольную распущенность либо только как насилие над ними.
  rationale: Грамматика стиха сочетает активное זנה с формами, в которых груди выступают объектом действий. Перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с намеренно резкой, но не вульгарной лексикой. Повторы исходника сохранены; архаизмы «блудодействовать» и «блудница» оставлены для сноски, а не основного текста.
