    text: 'Буквально: «к их наложницам». В данном контексте это необычное слово обычно понимают как метафорическое обозначение половых партнёров, любовников.'
    reason: lexical_alternative
  - marker: b
    text: '«Плоть» здесь, вероятно, является половым эвфемизмом: имеются в виду половые органы.'
    reason: lexical_alternative
  - marker: c
    text: То есть семенная жидкость или семяизвержение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגְּבָה עַל
  choice: воспылала страстью к
  rationale: Глагол עגב с предлогом עַל выражает сильное эротическое влечение. Русское сочетание передаёт сексуальную направленность, сохраняя достойный литературный регистр.
- source_word: פִּלַגְשֵׁיהֶם
  choice: их любовникам
  rationale: Форма буквально означает «их наложницам», однако в контексте развёрнутой сексуальной метафоры обозначает мужчин — половых партнёров. «Любовникам» естественно передаёт контекстуальный смысл; буквальное значение отмечено в сноске.
- source_word: בְּשַׂר חֲמוֹרִים בְּשָׂרָם
  choice: у которых плоть была как плоть ослов
  rationale: Сохранено буквальное «плоть», хотя в данном сексуальном контексте слово, вероятно, служит эвфемизмом для половых органов. Это позволяет не делать основной текст более эксплицитным, чем еврейский.
- source_word: וְזִרְמַת סוּסִים זִרְמָתָם
  choice: а излияние — как излияние жеребцов
  rationale: זִרְמָה обозначает истечение и здесь, по контексту, семяизвержение или семенную жидкость. «Излияние» сохраняет конкретность и эвфемистичность исходного выражения. «Жеребцов» в русском точнее передаёт сексуально окрашенное сравнение, хотя סוּסִים буквально означает «кони/лошади».
