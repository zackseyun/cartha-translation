base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/017.yaml
  text: Then the sons of Babylon came to her[a], to the bed of love, and they defiled her with their prostitution; and she was defiled by them[c][b], and her soul was alienated from them.
translation:
  language: ru
  text: И пришли к ней вавилоняне[a] на ложе любви[b] и осквернили её своим блудом; она осквернилась через них, и душа её отвратилась от них[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «сыны Вавилона»; или: «мужчины из Вавилона».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на ложе любовных утех».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «она возгнушалась ими»; возможен также смысл: «душа её отдалилась от них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בָבֶל
  choice: сыны Вавилона
  rationale: Сохраняет форму еврейского сочетания и его мужскую отнесённость; в примечании дан более естественный русский эквивалент.
- source_word: לְמִשְׁכַּב דֹּדִים
  choice: на ложе любви
  rationale: Передаёт образ ложа и эротическое значение דֹּדִים, не делая выражение более откровенным, чем в источнике.
- source_word: וַיְטַמְּאוּ אֹתָהּ
  choice: осквернили её
  rationale: Глагол טמא здесь соединяет сексуальную, нравственную и ритуальную нечистоту; «осквернили» естественно сохраняет эту многослойность.
- source_word: בְּתַזְנוּתָם
  choice: своим блудом
  rationale: «Блуд» ясно сохраняет сексуальную метафору и её значение политико-религиозной неверности, не прибегая к архаичному «блудодеяние».
- source_word: וַתִּטְמָא בָם
  choice: она осквернилась через них
  rationale: Передаёт наступившее состояние осквернения и инструментальное значение предлога ב, не повторяя пассивную конструкцию.
- source_word: וַתֵּקַע נַפְשָׁהּ מֵהֶם
  choice: душа её отвратилась от них
  rationale: Сохраняет еврейское упоминание души и допускает оба оттенка идиомы — отчуждение и отвращение — не сводя её только к одному из них.
theological_decisions:
- issue: Сексуальная и нравственная образность пророческой аллегории
  choice: Сохранить прямую образность ложа, блуда и осквернения как характеристику неверности Оголивы/Иерусалима.
  alternative: Свести образность к нейтральному описанию политического союза с Вавилоном.
  rationale: Еврейский текст намеренно изображает политико-религиозную неверность посредством сексуальной метафоры; её смягчение устранило бы существенную часть пророческой риторики.
- issue: Отчуждение или отвращение в заключительной идиоме
  choice: «душа её отвратилась от них»
  alternative: «она возгнушалась ими» или «душа её отдалилась от них»
  rationale: Выбранная формулировка удерживает напряжение между эмоциональным отвращением и прекращением привязанности, присутствующее в редкой еврейской идиоме.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «сыны» и «ложе» сохраняют образность оригинала, а синтаксис остаётся ясным для обычного современного читателя.
