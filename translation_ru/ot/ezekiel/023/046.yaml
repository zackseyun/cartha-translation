  yaml_path: translation/ot/ezekiel/023/046.yaml
  text: 'For thus says the Lord GOD: Bring up an assembly against them[a], and give them over to terror and plunder.'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: «Созови против них собрание и отдай их на ужас[a] и разграбление».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделай их предметом ужаса и добычей». Еврейское слово זַעֲוָה может обозначать как ужас, так и то, что внушает ужас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание передаёт как титул אֲדֹנָי, так и личное имя יְהוִה, избегая неестественного повторения «Господь Господь».
- source_word: הַעֲלֵה
  choice: Приведи
  rationale: Побудительная форма глагола עלה здесь повелевает вызвать или привести враждебную группу; «приведи» естественно передаёт смысл в данном контексте.
- source_word: קָהָל
  choice: сборище
  rationale: קָהָל обозначает собранную группу людей. В контексте враждебной толпы «сборище» сохраняет собирательное значение и отрицательную окраску, не уточняя её как войско.
- source_word: וְנָתֹן
  choice: и предай
  rationale: Форма продолжает ряд повелений. «Предай» естественно выражает передачу женщин во власть последующего бедствия.
- source_word: לְזַעֲוָה
  choice: ужасу
  rationale: זַעֲוָה допускает значения ужаса, потрясения или предмета, внушающего ужас. Основной текст передаёт переживаемое бедствие, а сноска сохраняет результативное прочтение.
- source_word: לָבַז
  choice: разграблению
  rationale: בַּז означает добычу или разграбление; здесь сочетание с ל естественно передаётся как участь, которой их предают.
- source_word: עֲלֵיהֶם / אֶתְהֶן
  choice: против них … их
  rationale: В еврейском тексте происходит переход от мужского множественного суффикса к женскому. В русском местоимение «них/их» не маркирует этот переход, но его референт — две женщины из пророческого образа — ясен из контекста.
theological_decisions:
- issue: Передача составного божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: «Владыка Яхве» сохраняет различие между титулом и личным именем Бога, не вводя конфессионально специфического толкования.
- issue: Характер суда в выражении לְזַעֲוָה וְלָבַז
  choice: предай их ужасу и разграблению
  alternative: сделай их предметом ужаса и добычей
  rationale: Еврейская конструкция допускает понимание как переживаемой участи, так и результата, при котором осуждённые становятся предметом ужаса и добычей. Основной текст не конкретизирует субъект исполнения суда, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. «Сборище» выбрано для враждебно собранной толпы; синтаксис повеления сохранён кратким и энергичным.
