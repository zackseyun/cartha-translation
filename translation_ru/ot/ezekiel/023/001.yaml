lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма с последовательным ו вводит очередное пророческое откровение; традиционная русская формула естественно передаёт ход повествования.
- source_word: דְבַר
  choice: слово
  rationale: В пророческой формуле обозначает данное Богом слово или весть; «слово» сохраняет устойчивый библейский оборот.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно и идиоматично передаёт направление речи к пророку.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь в следующем стихе; в современном русском двоеточие естественнее буквального «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Заключительное לֵאמֹר передано двоеточием, поскольку оно непосредственно вводит последующую речь.
