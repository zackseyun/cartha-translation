  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁכָּר֥וֹן וְ/יָג֖וֹן תִּמָּלֵ֑אִי כּ֚וֹס שַׁמָּ֣ה וּ/שְׁמָמָ֔ה כּ֖וֹס אֲחוֹתֵ֥/ךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/033.yaml
  text: You will be filled with drunkenness and grief, with a cup of horror and desolation, the cup of your sister Samaria.
translation:
  language: ru
  text: Ты исполнишься опьянением и скорбью — чашей ужаса и запустения, чашей твоей сестры Самарии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכָּרוֹן
  choice: опьянение
  rationale: Передаёт состояние опьянения как образ сокрушительного Божьего суда; естественнее в данном поэтическом контексте, чем «пьянство».
- source_word: יָגוֹן
  choice: скорбь
  rationale: Точно передаёт глубокое горе и сохраняет высокий, но понятный современный регистр.
- source_word: שַׁמָּה
  choice: ужас
  rationale: В данном сочетании обозначает потрясение и ужас перед бедствием.
- source_word: שְׁמָמָה
  choice: запустение
  rationale: Сохраняет значение опустошённости и разорения, характерное для пророческой речи.
- source_word: כּוֹס
  choice: чаша
  rationale: Сохранён ключевой библейский образ чаши как назначенной доли суда.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Нормативная русская форма географического имени; конструкция означает чашу, уже выпитую Самарией.
theological_decisions:
- issue: Образ чаши суда
  choice: Сохранить метафору без поясняющей вставки «Божьего суда»
  alternative: Передать явно как «чаша Божьего наказания»
  rationale: Исходный текст оставляет содержание образа выраженным через «ужас и запустение»; добавление субъекта и толкования излишне снимало бы поэтическую напряжённость.
- issue: Связь «чаши ужаса и запустения» с наполнением
  choice: Использовать тире как пояснительную связь
  alternative: 'Повторить предлог: «исполнишься… чашей» или следовать английскому «с чашей»'
  rationale: Еврейская синтаксическая последовательность допускает пояснение того, чем именно героиня наполнится; тире передаёт это естественно и без добавления смысла.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и библейского образа чаши. Форма «исполнишься» возвышенная, но общепонятная и уместна в пророческой речи.
