base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/009.yaml
  text: Therefore I gave her into the hand of her lovers[a], into the hand of the sons of Assyria[b], for whom she lusted.
translation:
  language: ru
  text: Поэтому Я отдал её в руки её любовников — в руки сыновей Ассирии[a], к которым она воспылала страстью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ассирийцев.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которыми она была страстно увлечена». Древнееврейский глагол выражает сильное желание; здесь, в метафоре прелюбодеяния, — похотливое влечение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственный переход от обвинения к объявленному суду.
- source_word: נְתַתִּיהָ
  choice: Я отдал её
  rationale: В сочетании с בְּיַד глагол נתן означает передачу во власть другого; русский оборот «отдал в руки» естественно выражает этот смысл.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет конкретный древнееврейский образ передачи под власть и при этом ясно звучит по-русски.
- source_word: מְאַהֲבֶיהָ
  choice: её любовников
  rationale: Сохраняет намеренную метафору супружеской неверности, обозначающую преступные политические связи.
- source_word: בְּנֵי אַשּׁוּר
  choice: сыновей Ассирии
  rationale: Формально передаёт древнееврейское выражение; примечание поясняет его естественный этнический смысл.
- source_word: עָגְבָה עֲלֵיהֶם
  choice: к которым она пылала страстью
  rationale: Передаёт сильное, окрашенное похотью увлечение, не сводя многозначный образ исключительно к физиологическому желанию.
theological_decisions:
- issue: Пророческая сексуальная метафора иностранных союзов Самарии/Оголы
  choice: Сохранены образы «любовников» и пылкой страсти.
  alternative: Истолковать прямо как «союзники, которых она желала».
  rationale: Исходный текст намеренно изображает политическую и заветную неверность посредством метафоры прелюбодеяния; её смягчение ослабило бы пророческую силу стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конструкция «сыновья Ассирии» сохраняет образность оригинала и поясняется сноской; сексуальная метафора не смягчена и не усилена сверх исходного текста.
