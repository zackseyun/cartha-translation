  text: ע֥וֹד זֹ֖את עָ֣שׂוּ לִ֑/י טִמְּא֤וּ אֶת מִקְדָּשִׁ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/038.yaml
  text: 'Moreover, they did this to me: they defiled my sanctuary on that same day, and they profaned my Sabbaths.'
translation:
  language: ru
  text: 'И ещё вот что они сделали Мне: в тот самый день они осквернили Моё святилище и осквернили Мои субботы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד זֹאת
  choice: Кроме того, вот что
  rationale: Сочетание вводит ещё одно обвинение. Формулировка передаёт добавочное значение עוֹד и указательное выделение זֹאת естественным современным русским языком.
- source_word: עָשׂוּ לִי
  choice: они сделали Мне
  rationale: Дательный оборот сохраняет личную направленность оскорбительного поступка против Бога, не усиливая текст до прямо выраженного «против Меня».
- source_word: טִמְּאוּ
  choice: осквернили
  rationale: Порода пиэль обозначает приведение святыни в состояние ритуальной нечистоты; «осквернили» естественно передаёт культовый смысл.
- source_word: מִקְדָּשִׁי
  choice: Моё святилище
  rationale: «Святилище» сохраняет значение священного пространства и не сужает слово до здания храма.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот самый день
  rationale: Контекстуальное «самый» подчёркивает, что осквернение произошло именно в день ранее названных мерзостей.
- source_word: שַׁבְּתוֹתַי
  choice: Моих суббот
  rationale: Сохранено явно выраженное множественное число и принадлежность этих священных времён Богу.
- source_word: חִלֵּלוּ
  choice: нарушили святость
  rationale: Оборот ясно и естественно передаёт значение пиэля חלל — обращение со святым как с обычным, то есть его профанацию.
theological_decisions:
- issue: Культовая терминология священного пространства и времени
  choice: 'Сохранить «святилище» и «субботы», используя лексику нарушения святости: «осквернили» и «нарушили святость».'
  alternative: 'Передать более общими словами: «храм» и «обесчестили».'
  rationale: Стих говорит не просто о неуважении, а о культовом и заветном нарушении святости принадлежащих Богу места и времени.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Синтаксис сохраняет эмфатическое введение дополнительного обвинения и параллелизм двух нарушений.
