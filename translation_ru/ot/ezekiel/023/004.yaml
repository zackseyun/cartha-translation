source:
  edition: WLC
  text: וּ/שְׁמוֹתָ֗/ן אָהֳלָ֤ה הַ/גְּדוֹלָה֙ וְ/אָהֳלִיבָ֣ה אֲחוֹתָ֔/הּ וַ/תִּֽהְיֶ֣ינָה לִ֔/י וַ/תֵּלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/שְׁמוֹתָ֕/ן שֹׁמְר֣וֹן אָהֳלָ֔ה וִ/ירוּשָׁלִַ֖ם אָהֳלִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/004.yaml
  text: 'Their names were Oholah the elder and Oholibah her sister[a]. They became mine and bore sons and daughters. As for their names: Samaria is Oholah[b], and Jerusalem is Oholibah.'
translation:
  language: ru
  text: 'Имена их: старшая — Огола, а её сестра — Оголива[a]. Они стали Моими[b] и родили сыновей и дочерей. Вот их имена: Самария — Огола, а Иерусалим — Оголива.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имена Огола и Оголива, вероятно, созвучны еврейским выражениям «её шатёр» и «Мой шатёр — в ней», что подчёркивает смысл аллегории.
    reason: cultural_note
  - marker: b
    text: 'Или: «Они принадлежали Мне». В более широком контексте подразумеваются брачные отношения, но еврейский текст здесь буквально говорит: «они стали Моими».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמוֹתָן
  choice: Имена их
  rationale: Естественно вводит имена обеих женщин, сохраняя краткость еврейской конструкции.
- source_word: אָהֳלָה
  choice: Огола
  rationale: Традиционная и узнаваемая русская передача имени; заложенная в нём игра слов поясняется в сноске.
- source_word: הַגְּדוֹלָה
  choice: старшая
  rationale: В контексте двух сестёр прилагательное указывает на старшинство, а не на физический размер или величие.
- source_word: וְאָהֳלִיבָה אֲחוֹתָהּ
  choice: а её сестра — Оголива
  rationale: Ясно передаёт родство и естественно звучит по-русски.
- source_word: וַתִּהְיֶינָה לִי
  choice: Они стали Моими
  rationale: Передаёт переход в состояние принадлежности или отношений, не добавляя прямо отсутствующего в еврейском тексте слова «жёны».
- source_word: וַתֵּלַדְנָה בָּנִים וּבָנוֹת
  choice: и родили сыновей и дочерей
  rationale: Сохраняет материнский смысл глагола и явное различение сыновей и дочерей.
- source_word: וּשְׁמוֹתָן
  choice: Вот их имена
  rationale: Передаёт возобновление темы имён перед раскрытием аллегорических соответствий.
- source_word: שֹׁמְרוֹן אָהֳלָה
  choice: Самария — Огола
  rationale: Тире естественно выражает в русском языке отождествление города с аллегорическим персонажем.
- source_word: וִירוּשָׁלִַם אָהֳלִיבָה
  choice: а Иерусалим — Оголива
  rationale: Параллельно предыдущей части ясно передаёт второе аллегорическое соответствие.
theological_decisions:
- issue: Смысл выражения וַתִּהְיֶינָה לִי в пророческой аллегории
  choice: Они стали Моими
  alternative: Они стали Моими жёнами; Они принадлежали Мне
  rationale: В более широком контексте аллегория носит брачный характер, однако сама фраза буквально выражает принадлежность или отношения. Выбранный вариант сохраняет это напряжение и не делает метафору более явной, чем исходный текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Имена переданы в традиционной русской библейской форме; синтаксис сделан ясным без устранения смысловой неоднозначности.
