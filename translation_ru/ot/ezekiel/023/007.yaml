base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/007.yaml
  text: She lavished her prostitutions on them[a], all the choicest sons of Assyria; and with all those for whom she lusted[c][b], with all their idols she defiled herself.
translation:
  language: ru
  text: Она отдавалась им в блуде[a] — всем отборным сынам Ассирии; и со всеми, кого она страстно желала[b], осквернила себя всеми их мерзкими идолами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдала свои блудодеяния им»; возможный смысл: «отдавалась им в блуде».'
    reason: lexical_alternative
  - marker: b
    text: Откровенно сексуальные образы «блуд» и «страстно желала» служат у Иезекииля метафорой политико-религиозной неверности и идолопоклонства.
    reason: cultural_note
  - marker: c
    text: В еврейском тексте употреблено характерное для Иезекииля резко уничижительное слово, обозначающее идолов.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן תַּזְנוּתֶיהָ עֲלֵיהֶם
  choice: предавалась она с ними блуду
  rationale: Буквальное сочетание «отдала свои блудодеяния на них» по-русски неестественно. Выбранная идиома сохраняет активность женщины и прямую сексуальную метафору, а עֲלֵיהֶם в данном сочетании естественно передано как «с ними».
- source_word: מִבְחַר בְּנֵי אַשּׁוּר כֻּלָּם
  choice: со всеми отборными сынами Ассирии
  rationale: מִבְחַר обозначает отборных, лучших представителей; בְּנֵי передано словом «сыны», поскольку в эротической метафоре речь именно о мужчинах. «Отборные» передаёт значение без искусственного превосходного оборота.
- source_word: וּבְכֹל אֲשֶׁר עָגְבָה
  choice: и со всеми, кого она страстно желала
  rationale: עגב выражает сильное эротическое влечение. «Страстно желала» сохраняет сексуальную окраску, но звучит естественно и достойно в современном русском тексте.
- source_word: בְּכָל גִּלּוּלֵיהֶם
  choice: всеми их мерзкими идолами
  rationale: גִּלּוּלִים — характерное для Иезекииля резко пренебрежительное обозначение идолов. Добавление «мерзкими» передаёт заложенную в самом еврейском слове уничижительную окраску; творительный падеж отражает инструментальное значение בְּ.
- source_word: נִטְמָאָה
  choice: оскверняла себя
  rationale: 'Форма допускает результативно-возвратное понимание: она становилась нечистой вследствие собственного участия. Несовершенный вид согласован с изображением продолжающегося поведения в контексте стиха.'
theological_decisions:
- issue: Сексуальная метафора политико-религиозной и идолопоклоннической неверности
  choice: Сохранить в основном тексте прямые слова «блуд» и «страстно желала».
  alternative: Смягчить до «неверности» или «вероломства».
  rationale: Пророческая речь намеренно использует резкий эротический образ. Его смягчение устранило бы существенную часть риторической силы текста; переносный смысл поясняется в сноске, а не подменяет образ в переводе.
- issue: Значение בְּנֵי в выражении «сыны Ассирии»
  choice: Передать как «сыны Ассирии».
  alternative: «мужчины Ассирии» или «ассирийцы»
  rationale: В данном эротическом образе мужской референт существенен, а буквальная форма остаётся понятной в литературном русском языке.
- issue: Уничижительная окраска גִּלּוּלִים
  choice: Передать как «мерзкие идолы».
  alternative: Нейтральное «идолы» с пояснением в сноске.
  rationale: Это не нейтральное еврейское слово для идолов, а намеренно оскорбительное обозначение, особенно характерное для Иезекииля. «Мерзкие» воспроизводит оценочный заряд, не привязываясь к спорной этимологии.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой пророческой образности. Синтаксис выстроен ясно и ритмично; «сыны Ассирии» сохраняет библейскую возвышенность, не делая весь стих архаичным. Все три маркера сносок присутствуют в основном тексте.
