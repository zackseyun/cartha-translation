  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה כּ֤וֹס אֲחוֹתֵ/ךְ֙ תִּשְׁתִּ֔י הָ/עֲמֻקָּ֖ה וְ/הָ/רְחָבָ֑ה תִּהְיֶ֥ה לִ/צְחֹ֛ק וּ/לְ/לַ֖עַג מִרְבָּ֥ה לְ/הָכִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/032.yaml
  text: 'Thus says the Lord GOD: You will drink your sister’s cup[a], deep and wide; it will be for laughter and for mockery[b], for it holds much.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве:


    «Ты выпьешь чашу своей сестры[a] —

    глубокую и широкую.


    Она будет поводом для смеха и глумления[b],

    ибо вмещает много».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Чаша — пророческий образ назначенной доли суда и наказания.
    reason: cross_reference
  - marker: b
    text: 'Или: «Ты станешь посмешищем и предметом глумления». Еврейская форма может относиться как к чаше, так и к адресатке.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Титул אֲדֹנָי передан как «Владыка», а личное имя יהוה — как «Яхве»; это избегает неестественного сочетания «Господь Господь» и сохраняет различие между титулом и именем.
- source_word: כּוֹס אֲחוֹתֵךְ
  choice: чашу своей сестры
  rationale: Сохранён буквальный пророческий образ чаши; возвратное «своей» естественно для современного русского синтаксиса.
- source_word: תִּשְׁתִּי
  choice: ты выпьешь
  rationale: Имперфект второго лица женского рода в пророческом контексте передаёт предстоящее и неизбежное действие.
- source_word: הָעֲמֻקָּה וְהָרְחָבָה
  choice: глубокую и широкую
  rationale: Оба определения отнесены к чаше и прямо передают её необычайно большую вместимость.
- source_word: תִּהְיֶה לִצְחֹק וּלְלַעַג
  choice: ты станешь посмешищем и предметом глумления
  rationale: Форма תִּהְיֶה допускает второе лицо женского рода, что в контексте естественно продолжает обращение к женщине; еврейская конструкция «быть для смеха и насмешки» передана ясной русской идиомой.
- source_word: מִרְבָּה לְהָכִיל
  choice: ведь она вмещает очень много
  rationale: Фраза характеризует огромную вместимость чаши и объясняет тяжесть назначенной кары; местоимение «она» ясно возвращает читателя к чаше.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Передача личного имени как «Яхве» сохраняет его отличие от титула אֲדֹנָי и не вводит конфессионально специфического истолкования.
- issue: К кому относится תִּהְיֶה — к женщине или к чаше
  choice: «ты станешь» — к адресату
  alternative: «она станет» — к чаше
  rationale: Одна и та же форма может быть понята как 2-е лицо женского рода или как 3-е лицо женского рода. Непосредственное обращение «ты выпьешь» и смысл публичного унижения поддерживают первое прочтение, но грамматическая неоднозначность отмечена в сноске.
- issue: Образ чаши
  choice: сохранить буквальный образ
  alternative: развернуть как «назначенную тебе кару»
  rationale: В пророческом тексте чаша обозначает выпавшую долю суда, однако буквальный образ важен и понятен из контекста; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Параллелизм сохранён разбивкой на строки; архаизмы и конфессионально окрашенные формулы не используются.
