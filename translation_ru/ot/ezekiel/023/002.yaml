lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и форму еврейского идиоматического выражения; в русском библейском стиле оно узнаваемо и понятно.
- source_word: שְׁתַּיִם נָשִׁים
  choice: две женщины
  rationale: Передаёт обычное значение существительного נָשִׁים, не вводя преждевременно толкование «жёны» из последующей аллегории.
- source_word: בְּנוֹת אֵם אַחַת
  choice: дочери одной матери
  rationale: Формально и естественно передаёт конструкцию «дочери одной матери»; русский текст не нуждается в пояснении «той же самой матери».
- source_word: הָיוּ
  choice: были
  rationale: В данном порядке слов естественно передаёт бытийное употребление глагола היה.
