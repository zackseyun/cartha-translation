base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/016.yaml
  text: At the sight of her eyes[b][a], she lusted after them and sent messengers to them in Chaldea.
translation:
  language: ru
  text: При виде их[a] она воспылала похотью к ним и послала к ним вестников в Халдею[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при виде её глаз»; то есть при том, что она их увидела.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к халдеям». Еврейская форма имеет направительное окончание и может означать «в Халдею» или «к халдеям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגַּב עֲלֵיהֶם
  choice: она воспылала к ним похотью
  rationale: Глагол עגב в контексте Иезекииля 23 выражает сильное эротическое влечение. Формулировка сохраняет намеренно резкий характер пророческого образа и не ослабляет его до простой симпатии или восхищения.
- source_word: לְמַרְאֵה עֵינֶיהָ
  choice: увидев их
  rationale: Буквально оборот означает «при виде её глаз»; по-русски естественно передать его деепричастным оборотом, обозначающим зрительное восприятие, вызвавшее желание. Необычная буквальная форма отмечена в сноске.
- source_word: וַתִּשְׁלַח מַלְאָכִים
  choice: и послала … вестников
  rationale: מַלְאָכִים — общее обозначение посланцев; «вестники» сохраняет основной смысл, не уточняя без необходимости их официальный дипломатический статус.
- source_word: אֲלֵיהֶם
  choice: к ним
  rationale: Предлог אֶל указывает на адресатов, к которым были направлены вестники.
- source_word: כַּשְׂדִּימָה
  choice: в Халдею
  rationale: Направительное окончание -ָה обозначает движение к месту назначения. «В Халдею» естественно передаёт это направление; возможное понимание как движения «к халдеям» указано в сноске.
theological_decisions:
- issue: Сексуализированная метафора политической и религиозной неверности
  choice: 'Сохранить прямой эротический образ: «воспылала к ним похотью».'
  alternative: «увлеклась ими»; «влюбилась в них»; «возжелала их»
  rationale: Глава намеренно использует резкую сексуальную образность для обличения неверности. Более мягкие выражения приглушили бы риторическую и богословскую силу текста.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и её намеренно резкой эротической метафорики. Синтаксис сделан естественным для русского, а формальная необычность еврейского оборота и неоднозначность названия места/народа сохранены в сносках.
