  yaml_path: translation/ot/ezekiel/023/036.yaml
  text: Then Yahweh said to me, “Son of man, will you judge Oholah and Oholibah? Then declare to them their abominations.”
translation:
  language: ru
  text: 'И Яхве сказал мне: «Сын человеческий, будешь ли ты судить Оголу и Оголиву? И укажи им на их мерзости».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой глагола продолжает повествование; русское «И сказал» естественно сохраняет связь и последовательность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и близко следует еврейскому выражению.
- source_word: הֲתִשְׁפּוֹט
  choice: Будешь ли ты судить
  rationale: Сохраняет вопросительную форму и значение имперфекта второго лица; вопрос одновременно подводит к пророческому поручению.
- source_word: אָהֳלָה וְאֶת אָהֳלִיבָה
  choice: Оголу и Оголиву
  rationale: Имена переданы принятой русской библейской транслитерацией и поставлены в винительный падеж.
- source_word: וְהַגֵּד לָהֶן
  choice: Тогда объяви им
  rationale: Императив передан прямым повелением; «тогда» естественно выражает переход от вопроса-поручения к требуемому действию.
- source_word: תוֹעֲבוֹתֵיהֶן
  choice: об их мерзостях
  rationale: «Мерзости» сохраняет сильную нравственную и культовую окраску תוֹעֵבוֹת; предлог «об» требуется естественным русским управлением глагола «объявить» в этом значении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл вопроса הֲתִשְׁפּוֹט
  choice: 'Сохранён прямой вопрос: «Будешь ли ты судить…?»'
  alternative: 'Повелительное истолкование: «Суди…»'
  rationale: Еврейская вопросительная частица требует сохранить формальную вопросительность, хотя в контексте вопрос несёт оттенок призвания к суду.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для широкого читателя; традиционное обращение «Сын человеческий» и сильное слово «мерзости» сохранены.
