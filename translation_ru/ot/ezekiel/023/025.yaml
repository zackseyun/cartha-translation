  source_fidelity: 'Основной смысл передан верно: Божья ревность направлена на адресата, враждебные исполнители действуют в ярости, следуют увечье, гибель от меча, захват сыновей и дочерей и уничтожение остатка огнём. Однако «отрежут» конкретизирует способ действия сильнее, чем еврейское יָסִירוּ («удалят/отнимут»), а два разных описательных перевода אַחֲרִיתֵךְ ослабляют повтор и создают ненужное различие между двумя одинаковыми еврейскими словами.'
