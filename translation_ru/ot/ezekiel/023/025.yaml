base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/025.yaml
  text: I will set my jealousy against you[a], and they will deal with you in wrath. They will remove your nose and your ears, and your survivors will fall by the sword. They will take your sons and your daughters[b], and your remnant will be consumed by fire.
translation:
  language: ru
  text: Я обращу на тебя Мою ревность, и они обойдутся с тобой с яростью. Они лишат тебя носа и ушей[a], а твой остаток падёт от меча. Они заберут твоих сыновей и дочерей, а твой остаток[b] будет пожран огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «удалят твой нос и уши». В контексте это, вероятно, подразумевает отсечение как наказание и увечье.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твой конец», «твоя последующая участь» или «то, что от тебя останется». Еврейское слово повторяется в обеих частях стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי קִנְאָתִי בָּךְ
  choice: Я обращу на тебя Мою ревность
  rationale: נתן в сочетании с קנאה и ב передаёт направленность ревности против адресата; «обращу на тебя» естественно по-русски и сохраняет образ ревности.
- source_word: וְעָשׂוּ אוֹתָךְ בְּחֵמָה
  choice: они поступят с тобой в ярости
  rationale: Оборот означает действие по отношению к кому-либо в состоянии ярости; перевод сохраняет и действие, и эмоциональную силу חֵמָה.
- source_word: אַפֵּךְ וְאָזְנַיִךְ יָסִירוּ
  choice: Они отрежут тебе нос и уши
  rationale: Форма יָסִירוּ буквально означает «удалят, отнимут», но применительно к носу и ушам контекст ясно описывает телесное увечье; русское «отрежут» передаёт подразумеваемое действие естественно и точно, а буквальная возможность отмечена в сноске.
- source_word: וְאַחֲרִיתֵךְ
  choice: оставшиеся у тебя / то, что от тебя останется
  rationale: אַחֲרִית может означать конец, последующую часть или остаток. Два разных по синтаксису русских выражения передают здесь людей, оставшихся после бедствия, и всё прочее, что останется, не сводя многозначность к одному узкому толкованию.
- source_word: בַּחֶרֶב תִּפּוֹל
  choice: падут от меча
  rationale: Устойчивый русский библейский оборот для гибели от оружия; множественное число согласовано со смысловым обозначением оставшихся людей.
- source_word: בָּנַיִךְ וּבְנוֹתַיִךְ יִקָּחוּ
  choice: Они заберут твоих сыновей и дочерей
  rationale: לקח означает «брать, забирать»; в контексте завоевания «заберут» допускает пленение, не добавляя его как явно выраженную деталь.
- source_word: תֵּאָכֵל בָּאֵשׁ
  choice: будет пожрано огнём
  rationale: Страдательная форма אכל буквально сохраняет образ огня, который «пожирает» остаток; выражение естественно для возвышенной пророческой речи.
theological_decisions:
- issue: Значение קִנְאָה в контексте суда за неверность
  choice: Мою ревность
  alternative: Моё рвение
  rationale: Брачная образность главы и суд за неверность требуют сохранить личностно-заветный оттенок «ревности», а не заменять его более общим «рвением».
- issue: Референт אַחֲרִיתֵךְ в двух параллельных высказываниях
  choice: оставшиеся у тебя / то, что от тебя останется
  alternative: твой конец / твоё потомство
  rationale: Контекст последовательного опустошения указывает на остаток после первых бедствий, но еврейское слово допускает более широкий смысл; перевод сохраняет различие между людьми и остальным остатком без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прямой и понятный; сохранены суровые телесные образы текста, заветно-брачный оттенок «ревности» и многозначность אַחֲרִית.
