  terminology: «Мою ревность» удачно сохраняет личностно-заветный смысл קִנְאָה. «Меч» и «огонь» соответствуют пророческому регистру. Сноску b следует перенести к слову «остаток», которое она поясняет; её нынешняя привязка к «дочерям» неверна.
