    rationale: «Отрежут» предполагает именно отсечение, тогда как глагол означает «удалят/отнимут». Контекст допускает увечье, но основной текст не должен закреплять способ действия сильнее оригинала.
  - severity: medium
    issue: Непоследовательный перевод повторённого אַחֲרִיתֵךְ
    rationale: «Оставшиеся у тебя» и «то, что от тебя останется» неестественны и искусственно разводят два одинаковых в оригинале слова. «Твой остаток» сохраняет повтор и допускает коллективное значение.
