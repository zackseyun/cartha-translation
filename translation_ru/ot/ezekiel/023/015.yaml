base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/015.yaml
  text: with belts fastened at their waists[a], with flowing turbans on their heads, all of them having the appearance of officers, the likeness of the sons of Babylon, Chaldeans[b], the land of their birth.
translation:
  language: ru
  text: с поясами на талии и в тюрбанах с ниспадающими концами на головах; все они с виду были военачальниками[a], подобными сынам Вавилона[b] — халдеям, чья родная земля — Халдея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «военными начальниками». Еврейское שָׁלִשִׁים может обозначать элитных воинов или высокопоставленных военных; точное название древнего чина неясно.'
    reason: lexical_alternative
  - marker: b
    text: «Сыны Вавилона» — еврейское выражение, означающее вавилонян.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגוֹרֵי אֵזוֹר בְּמָתְנֵיהֶם
  choice: с поясами на бёдрах
  rationale: Передаёт конкретную деталь одежды и расположение пояса естественным современным русским языком, без архаичного «чресла».
- source_word: סְרוּחֵי טְבוּלִים בְּרָאשֵׁיהֶם
  choice: в ниспадающих тюрбанах на головах
  rationale: סְרוּחֵי указывает на свисающий или ниспадающий вид головного убора; «тюрбаны» — понятное контекстуальное обозначение טְבוּלִים.
- source_word: מַרְאֵה שָׁלִשִׁים כֻּלָּם
  choice: на вид все они были военачальниками
  rationale: Сохраняет зрительное впечатление מַרְאֵה, явное כֻּלָּם и военный либо высокий служебный ранг שָׁלִשִׁים, не задавая чрезмерно точного древнего титула.
- source_word: דְּמוּת בְּנֵי בָבֶל
  choice: похожими на сынов Вавилона
  rationale: «Похожими» естественно передаёт דְּמוּת в описании изображения, а «сыны Вавилона» сохраняет еврейское родовое выражение.
- source_word: כַּשְׂדִּים אֶרֶץ מוֹלַדְתָּם
  choice: из Халдеи, земли их рождения
  rationale: В данном приложении כַּשְׂדִּים допускает географическое понимание «Халдея», а следующая фраза прямо характеризует её как землю их рождения.
