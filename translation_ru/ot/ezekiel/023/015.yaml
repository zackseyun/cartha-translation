review_pass:
  verdict: revise
  source_fidelity: Черновик в целом передаёт перечисление деталей одежды и внешний облик. Однако «с поясами на бёдрах» неточно для בְּמָתְנֵיהֶם («на талии / вокруг пояса»), а «из Халдеи» необоснованно превращает כַּשְׂדִּים в обстоятельство происхождения и сглаживает этноним. Перевод сохраняет связь «сынов Вавилона» и «халдеев», не отождествляя эти выражения без остатка.
  naturalness: «В ниспадающих тюрбанах» менее естественно, чем «в тюрбанах с ниспадающими концами». Перестроенная фраза остаётся литературной и ясной, не приписывая древнему титулу чрезмерно точное значение.
  terminology: '«Военачальники» допустимо как основное решение для שָׁלִשִׁים при сохранении сноски о неопределённости титула. Сноска исправлена: «придворные служители» не поддержано данным английским аудитом и излишне расширяет значение. «Халдеи» сохранены как этническое обозначение; Халдея названа их родной землёй в соответствии с заключительным приложением.'
