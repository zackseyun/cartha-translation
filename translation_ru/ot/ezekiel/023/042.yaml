  source_fidelity: 'Начало передано в целом верно: קוֹל הָמוֹן שָׁלֵו — слышимый шум/гомон беспечной или самодовольной толпы. Женские множественные суффиксы в заключительной части действительно относятся к двум персонифицированным женщинам главы. Однако в трудной средней клаузе основное русское «к мужчинам ... привели ... пьяниц» излишне решительно делает סֹבָאִים нарицательным «пьяницами» и меняет пассивное מוּבָאִים на активное «привели». Масоретское написание סובאים допускает также понимание этнонима «савеи», и этот вариант следует сохранить как неразрешённую возможность в основном тексте либо столь же весомо в сноске.'
