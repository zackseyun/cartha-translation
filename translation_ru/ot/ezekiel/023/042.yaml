  text: And the sound of a carefree multitude was in her[a], and to the men from the mass of mankind were brought drunkards from the wilderness[c][b]; and they put bracelets on their hands and a beautiful crown on their heads.
translation:
  language: ru
  text: У неё раздавался шум беспечной толпы[a]. К мужчинам из множества людей были приведены из пустыни пьяные гуляки[b]. Они надели браслеты на руки обеих женщин и прекрасный венец — на их головы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гомон толпы, живущей в покое»; возможно также: «шум самодовольной толпы».'
    reason: lexical_alternative
  - marker: b
    text: 'Средняя часть еврейского текста трудна. Возможно также: «вместе с мужчинами из множества людей были приведены пьяные гуляки из пустыни». Слово, переданное как «пьяные гуляки», может пониматься и как «савеи» — люди из Савы, приведённые из пустыни.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «венец красоты» или «великолепный венец». В еврейском тексте употреблено единственное число; оно относится распределительно к обеим женщинам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הָמוֹן שָׁלֵו
  choice: шум беспечной толпы
  rationale: קוֹל обозначает слышимый звук, הָמוֹן — множество или гомонящую толпу, а שָׁלֵו — состояние покоя, беззаботности либо самодовольства. «Шум беспечной толпы» естественно передаёт празднично-разнузданную сцену, не сводя קוֹל к отдельному голосу.
- source_word: בָהּ
  choice: у неё
  rationale: Местоимение женского рода сохраняет персонификацию женщины/города. В русском «слышался у неё» естественнее буквального «был в ней» и допускает значение происходящего в её доме или среди её окружения.
- source_word: אֲנָשִׁים
  choice: мужчинам
  rationale: Форма имеет мужской род, а контекст говорит о мужчинах-посетителях и любовниках.
- source_word: מֵרֹב אָדָם
  choice: из множества людей
  rationale: Сохраняет сжатость и неоднозначную синтаксическую связь трудной еврейской фразы, не превращая אָדָם в конфессионально или социально нагруженное понятие.
- source_word: מוּבָאִים סובאים מִמִּדְבָּר
  choice: привели из пустыни пьяниц
  rationale: מוּבָאִים передаётся пассивно-каузативным «привели», סובאים — как «пьяниц», а מִדְבָּר — нейтральным «пустыня». Необычный синтаксис отмечен в сноске.
- source_word: צְמִידִים אֶל יְדֵיהֶן
  choice: браслеты на руки обеих женщин
  rationale: צְמִידִים — украшения на запястьях/руках. Женский суффикс двойственного референта отсылает к двум сёстрам из контекста главы; уточнение «обеих женщин» предотвращает ошибочное отнесение украшений к мужчинам.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: прекрасные венцы
  rationale: Буквально «венец красоты/великолепия». Множественное число по-русски согласовано с двумя женскими референтами, тогда как еврейский использует собирательно-распределительное единственное число.
theological_decisions:
- issue: Референт женских местоименных суффиксов во второй половине стиха
  choice: две женщины-сестры, символизирующие Самарию и Иерусалим
  alternative: неопределённые женщины либо мужчины-посетители
  rationale: Формы יְדֵיהֶן и רָאשֵׁיהֶן женского рода и по контексту главы относятся к двум персонифицированным сёстрам. Перевод сохраняет образ, не добавляя дальнейшего богословского истолкования.
- issue: Неясный синтаксис средней части стиха
  choice: 'основной текст следует масоретской последовательности: «к мужчинам из множества людей привели… пьяниц»'
  alternative: «вместе с множеством мужчин были приведены пьяницы из пустыни» либо понимание пустынных савеев как этнонима
  rationale: Еврейский текст синтаксически труден и текстуально обсуждаем; поэтому основной перевод остаётся близким к последовательности слов, а реальные альтернативы вынесены в сноску без догматического выбора.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис намеренно не чрезмерно сглажен в трудной средней части; неоднозначность отмечена сноской. Устаревшие «сонм», «шумное сборище» и анатомически неточное «на кисти» не использованы.
