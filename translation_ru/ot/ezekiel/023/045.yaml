  text: וַ/אֲנָשִׁ֣ים צַדִּיקִ֗ם הֵ֚מָּה יִשְׁפְּט֣וּ אֽוֹתְ/הֶ֔ם מִשְׁפַּט֙ נֹֽאֲפ֔וֹת וּ/מִשְׁפַּ֖ט שֹׁפְכ֣וֹת דָּ֑ם כִּ֤י נֹֽאֲפֹת֙ הֵ֔נָּה וְ/דָ֖ם בִּֽ/ידֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/045.yaml
  text: But righteous men will judge them with the judgment of adulteresses and with the judgment of women who shed blood[a], because they are adulteresses[b], and blood is on their hands.
translation:
  language: ru
  text: Но праведные мужи будут судить их судом, каким судят прелюбодеек, и судом, каким судят женщин, проливающих кровь[a], потому что они прелюбодейки и кровь на их руках[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по закону о прелюбодейках и о женщинах, проливающих кровь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кровь в их руках»; выражение «кровь на их руках» означает вину в кровопролитии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשִׁים צַדִּיקִם
  choice: Но праведные мужи
  rationale: «Мужи» сохраняет явно мужскую форму אֲנָשִׁים и судебный оттенок образа; «но» естественно передаёт контекстуально-противительный переход וַ.
- source_word: הֵמָּה יִשְׁפְּטוּ אֹתְהֶם
  choice: будут судить их
  rationale: Имперфект в пророческом контексте передан будущим временем; отдельное местоимение הֵמָּה придаёт субъекту акцент, который в русском достаточно выражен его препозицией.
- source_word: מִשְׁפַּט נֹאֲפוֹת
  choice: судом, каким судят прелюбодеек
  rationale: Так сохраняются юридический смысл מִשְׁפָּט и категория «прелюбодейки», а конструкция звучит естественнее буквального «судом прелюбодеек».
- source_word: וּמִשְׁפַּט שֹׁפְכוֹת דָּם
  choice: и судом, каким судят женщин, проливающих кровь
  rationale: Женский род причастия сохранён явно; выражение «проливать кровь» передаёт שׁפך דם и сохраняет библейско-судебный регистр.
- source_word: כִּי נֹאֲפֹת הֵנָּה
  choice: потому что они прелюбодейки
  rationale: כִּי вводит основание приговора; именная категория передана прямо, без ослабления до общего прилагательного.
- source_word: וְדָם בִּידֵיהֶן
  choice: и кровь на их руках
  rationale: Хотя בִּידֵיהֶן буквально означает «в их руках», русское «кровь на их руках» естественно выражает вину в кровопролитии и сохраняет метафору.
theological_decisions:
- issue: Кто такие судящие праведные мужи
  choice: Сохранён прямой образ человеческих праведных судей без дальнейшего отождествления.
  alternative: Понимать их как небесных либо идеализированных исполнителей Божьего суда.
  rationale: Еврейский текст прямо говорит о «праведных мужах», но не уточняет их природу; перевод не разрешает эту неоднозначность толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой и судебной речи. Слово «мужи» выбрано как умеренно возвышенное и уместное в юридико-пророческом контексте; синтаксис сделан ясным для широкого читателя.
