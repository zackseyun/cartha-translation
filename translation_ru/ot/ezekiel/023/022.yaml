source:
  edition: WLC
  text: לָ/כֵ֣ן אָהֳלִיבָ֗ה כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מֵעִ֤יר אֶת מְאַהֲבַ֨יִ/ךְ֙ עָלַ֔יִ/ךְ אֵ֛ת אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶ֑ם וַ/הֲבֵאתִ֥י/ם עָלַ֖יִ/ךְ מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/022.yaml
  text: 'Therefore[a], Oholibah, thus says the Lord GOD: Behold, I am stirring up your lovers against you, those from whom your soul has turned away, and I will bring them against you from every side.'
translation:
  language: ru
  text: 'Поэтому, Оголива, так говорит Владыка Яхве: «Вот, Я подниму против тебя твоих любовников — тех, от кого отвернулась твоя душа[a], — и приведу их против тебя со всех сторон».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «те, к кому твоя душа почувствовала отвращение» или «те, от кого ты отдалилась». Еврейский глагол может выражать как отчуждение, так и отвращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и судебное следствие из предшествующего обличения.
- source_word: אָהֳלִיבָה
  choice: Оголива
  rationale: Традиционная и узнаваемая русская передача еврейского собственного имени без перевода его значения.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: так говорит Владыка Яхве
  rationale: Сохраняет пророческую формулу, различает титул אֲדֹנָי и личное имя יְהוִה и избегает неестественного повтора «Господь Господь».
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт торжественное указание на начинающееся Божье действие и соответствует возвышенному пророческому регистру.
- source_word: מֵעִיר
  choice: подниму
  rationale: Каузативная форма обозначает побуждение к действию; в данном враждебном контексте естественное русское «подниму против» передаёт мобилизацию противников.
- source_word: מְאַהֲבַיִךְ
  choice: твоих любовников
  rationale: Сохраняет сексуально-политическую метафору всей главы и её обвинительный тон.
- source_word: אֵת אֲשֶׁר נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: тех, от кого отвернулась твоя душа
  rationale: Сохраняет необычный еврейский субъект «твоя душа» и основную идею отчуждения, не сводя неоднозначный глагол только к ненависти или отвращению.
- source_word: וַהֲבֵאתִים עָלַיִךְ מִסָּבִיב
  choice: и приведу их против тебя со всех сторон
  rationale: Естественно передаёт Божье причиняющее действие, враждебную направленность и образ окружения.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное заветное имя יְהוִה; так сохраняется различие двух элементов исходного текста без конфессионального истолкования.
- issue: Характер Божьего действия в הִנְנִי מֵעִיר
  choice: Я подниму против тебя
  alternative: Я возбуждаю против тебя
  rationale: Будущее по смыслу русского выражения передаёт объявленное действие суда, тогда как причастная форма оригинала подчёркивает его близость и решительность; «подниму» не ослабляет прямую роль Бога в происходящем.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; метафора «любовников» и выражение «твоя душа» сохранены ради образности и смыслового напряжения оригинала.
