  text: They went in to her as men go in to a prostitute[a]; so they went in to Oholah and to Oholibah[b], women of depravity.
translation:
  language: ru
  text: И вошёл он к ней, как входят к проститутке; так же входили к Оголе и Оголиве — развратным женщинам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст в начале употребляет глагол в единственном числе («вошёл он»), а затем переходит ко множественному («входили»). Возможно также смысловое прочтение: «Входили к ней, как входят к проститутке; так же входили к Оголе и Оголиве — развратным женщинам».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּבֹא / בָּאוּ
  choice: вошёл он / приходили
  rationale: Первое сказуемое передано в единственном числе, а второе — во множественном, в соответствии с формами еврейского текста. В данном половом контексте בוא אל в первой части естественно передаётся как «войти к».
- source_word: אֵלֶיהָ
  choice: к ней
  rationale: Буквально передаёт предлог אֶל с местоименным суффиксом и вместе с глаголом сохраняет понятный в контексте половой смысл.
- source_word: כְּבוֹא אֶל
  choice: как входят к
  rationale: Сравнительная конструкция с инфинитивом выражает обычный образ действия; неопределённо-личная русская форма естественно передаёт подразумеваемого субъекта.
- source_word: אִשָּׁה זוֹנָה
  choice: проститутке
  rationale: Современный и точный эквивалент זוֹנָה, без архаичности слова «блудница» и без дополнительной бранной окраски.
- source_word: כֵּן
  choice: так
  rationale: Кратко и точно вводит соответствующую часть сравнения.
- source_word: אָהֳלָה ... אָהֳלִיבָה
  choice: Огола ... Оголива
  rationale: Имена транслитерированы в привычной для русской библейской традиции форме.
- source_word: אִשֹּׁת הַזִּמָּה
  choice: женщинам развратным
  rationale: Передаёт нравственную и сексуальную окраску זִמָּה; постпозиция определения сохраняет торжественный, пророческий регистр, оставаясь понятной.
theological_decisions:
- issue: Смена числа у сказуемых
  choice: Сохранить единственное число в начале («вошёл он») и множественное далее («приходили»).
  alternative: 'Сгладить обе формы до множественного числа: «входили к ней... так приходили».'
  rationale: Масоретский текст явно начинает с וַיָּבֹא, формой единственного числа, а затем переходит к בָּאוּ, форме множественного числа. Сохранение смены числа не устраняет подлинную грамматическую напряжённость текста.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сексуальный смысл выражен прямо, но без грубой или архаической лексики; необычная смена числа сохранена и пояснена сноской.
