    text: 'Буквально: «своих блудодеяний из Египта». Предлог может указывать на их происхождение или связь с Египтом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делали груди её девственности»; это откровенный сексуальный образ её юности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּזְנוּתֶיהָ
  choice: блуда
  rationale: Слово обозначает повторяющиеся проявления сексуальной распущенности и в пророческом образе — неверность завету. «Блуд» сохраняет резкость и единство метафоры.
- source_word: מִמִּצְרַיִם
  choice: египетского
  rationale: Так естественно по-русски передаётся происхождение или связь этого блуда с Египтом; возможная буквальная передача с предлогом «из» отмечена в сноске.
- source_word: לֹא עָזָבָה
  choice: не оставила
  rationale: Передаёт продолжение прежнего поведения без добавления причин или оценки.
- source_word: שָׁכְבוּ אוֹתָהּ
  choice: с ней ложились
  rationale: Сохранён понятный сексуальный эвфемизм исходного текста; неопределённый субъект не конкретизирован сверх данного стиха.
- source_word: בִנְעוּרֶיהָ
  choice: ещё в юности
  rationale: Естественная временная формулировка, сохраняющая образ раннего периода её жизни.
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֶיהָ
  choice: ласкали её девичьи груди
  rationale: Передаёт явный сексуальный образ естественным современным русским языком; необычная буквальная конструкция пояснена в сноске.
- source_word: וַיִּשְׁפְּכוּ תַזְנוּתָם עָלֶיהָ
  choice: изливали на неё свой блуд
  rationale: Сохранены образ «изливания», предлог направления и лексическая связь с первым упоминанием блуда.
theological_decisions:
- issue: Сексуализированная пророческая метафора неверности завету
  choice: Сохранить явную сексуальную образность и повтор слова «блуд».
  alternative: Смягчить текст словами «неверность», «безнравственность» или истолковать его как прямое упоминание идолопоклонства.
  rationale: Иезекииль намеренно использует шокирующий сексуальный образ. Его абстрактная передача устранила бы важную риторическую и богословскую напряжённость текста.
- issue: Личность действующих мужчин
  choice: 'Оставить субъект подразумеваемым: «с ней ложились, ласкали…».'
  alternative: Прямо назвать их египтянами.
  rationale: Контекст связывает действия с Египтом, однако в самом стихе употреблено лишь местоименное/глагольное указание «они»; перевод не должен добавлять явное существительное.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой и откровенной пророческой образности. Архаизмы и конфессионально окрашенные толкования не добавлены.
