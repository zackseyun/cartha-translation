lexical_decisions:
- source_word: וָאֵרֶא
  choice: И увидел я
  rationale: Форма wayyiqtol 1-го лица ед. числа от ראה продолжает повествовательную последовательность и передаёт непосредственное наблюдение говорящего.
- source_word: כִּי
  choice: что
  rationale: Здесь союз вводит содержание увиденного, а не причину.
- source_word: נִטְמָאָה
  choice: она осквернилась
  rationale: Нифаль перфекта 3-го лица жен. рода от טמא допускает пассивное, результативное и возвратное понимание. Русское «осквернилась» сохраняет культово-нравственную окраску и не сводит форму ни к чистому пассиву, ни к чрезмерно явному утверждению о намеренном самоосквернении.
- source_word: דֶּרֶךְ אֶחָד
  choice: один и тот же путь
  rationale: Буквально «один путь»; в сочетании с «для обеих» речь идёт об общем, одинаковом образе поведения. Выражение «один и тот же путь» естественно передаёт этот смысл и сохраняет метафору пути.
- source_word: לִשְׁתֵּיהֶן
  choice: у обеих
  rationale: Предлог ל с формой «обе две» указывает, что этот путь был общим для обеих сестёр. Русская конструкция «у обеих был» передаёт отношение кратко и естественно.
theological_decisions:
- issue: Характер осквернения в аллегории о двух сёстрах
  choice: Сохранить формулировку «она осквернилась», передающую как наступившее состояние, так и связь с её собственным поведением.
  alternative: «Она была осквернена» или «она стала нечистой».
  rationale: В контексте главы осквернение связано с идолопоклонством и неверностью, однако грамматическая форма сама по себе не требует полностью возвратного или исключительно пассивного истолкования. Выбранная русская форма сохраняет эту напряжённость без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры пути. Порядок слов «увидел я» слегка возвышен, но остаётся понятным; двоеточие показывает, что общий путь обеих поясняет увиденное осквернение.
