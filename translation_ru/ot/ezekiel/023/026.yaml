  yaml_path: translation/ot/ezekiel/023/026.yaml
  text: They will strip you of your garments and take your splendid ornaments[a].
translation:
  language: ru
  text: Они снимут с тебя одежды и заберут твои великолепные украшения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предметы твоего великолепия»; возможно также: «украшения твоей красы».'
    reason: Лексическое сочетание כְּלֵי תִפְאַרְתֵּךְ допускает как конкретное понимание «украшения», так и более широкое «предметы великолепия/красы».
lexical_decisions:
- source_word: וְהִפְשִׁיטוּךְ
  choice: снимут с тебя
  rationale: Глагол פשט в породе хифиль с суффиксом 2-го лица женского рода означает снять с кого-либо одежду, раздеть. В сочетании с прямым дополнением «одежды» естественное русское выражение «снимут с тебя» передаёт смысл без избыточного «догола».
- source_word: בְּגָדָיִךְ
  choice: одежды
  rationale: בגד — обычное обозначение одежды или одеяний. Множественное число «одежды» сохраняет слегка возвышенный регистр пророческой речи и соответствует форме источника.
- source_word: וְלָקְחוּ
  choice: и заберут
  rationale: לקח означает «брать, взять». В контексте насильственного лишения «заберут» звучит естественно по-русски и передаёт удаление имущества, не усиливая глагол до «похитят» или «захватят».
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: твои великолепные украшения
  rationale: כְּלִי обозначает предмет, изделие или принадлежность, а תִפְאֶרֶת — красоту, великолепие, славу. В данном образе речь, вероятнее всего, об украшениях; прилагательное «великолепные» сохраняет связь с идеей великолепия, а сноска отмечает более буквальную и широкую формулировку.
