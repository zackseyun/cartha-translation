lexical_decisions:
- source_word: וַתּוֹסֶף אֶל תַּזְנוּתֶיהָ
  choice: И она ещё умножила свой блуд
  rationale: Оборот с יסף передаёт дальнейшее усиление или прибавление к прежнему поведению. «Умножила свой блуд» сохраняет резкую сексуальную метафору Иезекииля и звучит естественнее, чем буквальное «прибавила к своим блудодеяниям».
- source_word: וַתֵּרֶא
  choice: увидела
  rationale: Прямое значение глагола ראה; форма продолжает повествовательную последовательность.
- source_word: אַנְשֵׁי מְחֻקֶּה עַל הַקִּיר
  choice: мужчин, изображённых на стене
  rationale: מְחֻקֶּה указывает на нанесённое или начертанное изображение, но не позволяет уверенно определить технику. «Изображённых» сохраняет эту неопределённость.
- source_word: צַלְמֵי כַשְׂדִּים
  choice: образы халдеев
  rationale: «Халдеи» непосредственно передаёт этнополитическое название исходного текста; пояснение о связи с Вавилоном вынесено в сноску.
- source_word: חֲקֻקִים בַּשָּׁשַׁר
  choice: начертанные ярко-красной краской
  rationale: חֲקֻקִים обозначает нанесённые или начертанные фигуры, а שָׁשַׁר — красный красящий материал. Перевод не утверждает без достаточных оснований, что изображения были именно вырезаны, и понятно передаёт цвет.
theological_decisions:
- issue: Сексуальная метафора неверности
  choice: сохранить слово «блуд»
  alternative: передать обобщённо как «неверность»
  rationale: Пророк намеренно использует резкий сексуальный образ для идолопоклоннической и политической неверности. Обобщение ослабило бы силу и многослойность исходной метафоры.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой резкости. Двоеточие связывает усиление блуда с последующим взглядом на изображения; тире естественно оформляет пояснительное приложение «образы халдеев».
