lexical_decisions:
- source_word: לְבֻשֵׁי
  choice: одетых в
  rationale: Страдательное причастие от לבשׁ описывает одежду упомянутых мужчин; форма «одетых» естественно продолжает синтаксис предыдущего стиха.
- source_word: תְכֵלֶת
  choice: синеву
  rationale: Слово обозначает дорогую ткань или краситель сине-фиолетового оттенка. «Синева» передаёт цвет и позволяет понимать здесь окрашенную одежду, не сводя значение к современному простому синему цвету.
- source_word: פַּחוֹת
  choice: наместников
  rationale: Название правителей областей в имперской администрации; «наместники» понятно современному читателю и уместно в древнем контексте.
- source_word: וּסְגָנִים
  choice: сановников
  rationale: Обозначает высокопоставленных должностных лиц, стоящих ниже верховной власти. «Сановники» сохраняет высокий ранг без ложной точности конкретного административного титула.
- source_word: בַּחוּרֵי חֶמֶד
  choice: желанные юноши
  rationale: בַּחוּרֵי указывает на молодых мужчин в расцвете сил, а חֶמֶד — на привлекательность и желанность. Выбор сохраняет чувственный оттенок образа в главе.
- source_word: כֻּלָּם
  choice: все они
  rationale: Передаёт как значение всеобщности, так и местоименный суффикс, сохраняя еврейское усиление.
- source_word: פָּרָשִׁים
  choice: всадники
  rationale: Прямое и естественное обозначение конных воинов или ездоков без более позднего технического оттенка слова «кавалеристы».
- source_word: רֹכְבֵי סוּסִים
  choice: едущие верхом на конях
  rationale: Сохранена поясняющая причастная конструкция оригинала, хотя она частично повторяет смысл слова «всадники».
