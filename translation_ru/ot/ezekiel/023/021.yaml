  yaml_path: translation/ot/ezekiel/023/021.yaml
  text: Thus you revisited the lewdness of your youth[a], when in Egypt they fondled your breasts[c][b], the breasts of your youth.
translation:
  language: ru
  text: Так ты вернулась к разврату своей юности[a], когда египтяне ласкали твои груди — груди твоей юности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вспомнила разврат своей юности». Еврейский глагол может означать «посетить», «обратить внимание» или «вспомнить»; здесь он, вероятно, подразумевает возвращение к прежнему поведению.'
    reason: lexical_alternative
  - marker: b
    text: Еврейская конструкция неясна; буквально сказано «из Египта» и «ради грудей твоей юности». «Египтяне» — контекстуально вероятное понимание; последние слова могут выражать причину или сопровождать повтор образа груди.
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: וַתִּפְקְדִי
  choice: ты снова обратилась
  rationale: Глагол פקד может означать «посетить», «обратить внимание», «вспомнить». В контексте возобновлённой неверности выражение «снова обратилась» передаёт возвращение к прежнему поведению, не исключая оттенка воспоминания.
- source_word: זִמַּת
  choice: к разврату
  rationale: В сексуальном контексте זִמָּה обозначает постыдное, распутное поведение. «Разврат» сохраняет нравственную и сексуальную резкость слова.
- source_word: נְעוּרָיִךְ
  choice: своей юности / твоей юности
  rationale: Сохранено повторение «юности», которое придаёт еврейской строке выразительность.
- source_word: בַּעֲשׂוֹת מִמִּצְרַיִם דַּדַּיִךְ
  choice: когда в Египте ласкали твои груди
  rationale: Еврейская конструкция необычна и допускает разные способы синтаксического разбора. Перевод передаёт сексуальное действие и египетский контекст естественным русским языком, а формальная неоднозначность отмечена в сноске.
- source_word: דַּדַּיִךְ / שְׁדֵי נְעוּרָיִךְ
  choice: твои груди — груди твоей юности
  rationale: Оба конкретных обозначения груди переданы прямо, без эвфемизма; повтор сохранён вслед за еврейским текстом.
theological_decisions:
- issue: Откровенная сексуальная метафора в пророческом обличении
  choice: Сохранить прямые слова «разврат» и «груди»
  alternative: Смягчить образ словами «распутство», «прелести» или иным эвфемизмом
  rationale: Нарочито резкая телесная образность изображает неверность завету. Её смягчение ослабило бы обличительную силу исходного текста.
- issue: 'Значение פקד: воспоминание или возвращение к поведению'
  choice: «снова обратилась» с указанием альтернативы в сноске
  alternative: «вспомнила»
  rationale: Контекст главы указывает не только на память о прошлом, но и на возобновление прежней неверности; при этом лексическая неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с прямой, но не вульгарной лексикой. Сохранены пророческая резкость, телесная образность и повтор «груди… юности»; неясная еврейская конструкция не представлена как однозначная.
