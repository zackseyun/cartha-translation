base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/048.yaml
  text: Thus I will put an end to lewdness in the land[a], and all women will be warned and will not act according to your lewdness.
translation:
  language: ru
  text: Так Я положу конец разврату в земле, и все женщины будут вразумлены[a] и не будут поступать так же развратно, как вы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут предостережены»; возможно также: «будут наказаны для исправления». Еврейский глагол может обозначать вразумление или исправление посредством наказания, а также предостережение чужим примером.'
    reason: Лексическая многозначность формы וְנִוַּסְּרוּ.
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Так Я положу конец
  rationale: Порода hифиль от שׁבת выражает причинение прекращения; «положу конец» естественно передаёт каузативный смысл.
- source_word: זִמָּה
  choice: разврат
  rationale: В Иезекииле 23 слово имеет сексуально-нравственный оттенок в контексте образов проституции и супружеской неверности; «разврат» сохраняет этот смысл.
- source_word: מִן הָאָרֶץ
  choice: в этой земле
  rationale: Буквально «из земли»; при глаголе прекращения сочетание означает устранение разврата из пределов земли. Русское «положу конец… в этой земле» передаёт сферу устранения естественно.
- source_word: וְנִוַּסְּרוּ
  choice: будут вразумлены
  rationale: Pual от יסר допускает значения наставления, предостережения и исправления посредством наказания. «Будут вразумлены» сохраняет как поучительный, так и исправительный оттенок, не сводя смысл только к устному предупреждению.
- source_word: כָּל הַנָּשִׁים
  choice: все женщины
  rationale: Прямо и точно сохраняет женский род и множественное число еврейского выражения, не расширяя и не сужая его референцию.
- source_word: וְלֹא תַעֲשֶׂינָה כְּזִמַּתְכֶנָה
  choice: и не станут поступать развратно, как вы
  rationale: Сравнительная частица כְּ указывает на поведение по примеру адресаток. Такая формулировка естественна по-русски и сохраняет повтор корня זִמָּה через наречие «развратно».
theological_decisions:
- issue: К кому относятся «все женщины» в пророческой речи с женской символикой
  choice: Сохранить прямое «все женщины», не поясняя референцию внутри текста.
  alternative: «все женщины этой земли» или обобщённое «все люди»
  rationale: Еврейский текст прямо говорит «все женщины». Контекст представляет Самарию и Иерусалим в образе женщин и делает их участь предостережением другим, но не требует от перевода разрешать более широкий вопрос о сфере применения.
- issue: Характер воздействия, выраженного וְנִוַּסְּרוּ
  choice: «будут вразумлены» с примечанием об альтернативных оттенках
  alternative: «будут предостережены» или «будут наказаны»
  rationale: Глагол может обозначать усвоение урока через исправление или наказание. Основной текст сохраняет эту смысловую широту, а примечание явно указывает возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка ясна обычному читателю; женская образность и нравственно-сексуальный смысл זִמָּה сохранены без конфессионального истолкования.
