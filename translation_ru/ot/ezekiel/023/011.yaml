  yaml_path: translation/ot/ezekiel/023/011.yaml
  text: When her sister Oholibah saw this[a], she became more corrupt in her lust than her sister, and in her prostitutions more than the prostitutions of her sister.
translation:
  language: ru
  text: Её сестра Оголива, увидев это[a], предалась похоти ещё больше, чем её сестра, а её блудодеяния превзошли блудодеяния сестры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте дополнение к глаголу «увидев» не выражено; буквально: «увидела». Далее возможно также: «стала ещё развращённее в своей похоти, чем её сестра».'
    reason: Восстанавливает невыраженный объект из контекста и отражает допустимую более близкую к форме оригинала передачу глагола וַתַּשְׁחֵת, не меняя смысла.
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: увидела это
  rationale: Глагол означает «увидела»; дополнение «это» естественно восстанавливается из предшествующего контекста, хотя в еврейском тексте оно не выражено явно.
- source_word: אֲחוֹתָהּ אָהֳלִיבָה
  choice: её сестра Оголива
  rationale: Сохранены определение родства и приложение с традиционной русской передачей имени.
- source_word: וַתַּשְׁחֵת
  choice: стала ещё порочнее
  rationale: В данном нравственно-сексуальном контексте порода Hiphil выражает порчу или развращение; сравнительная конструкция передана естественным русским оборотом без устранения нравственной оценки.
- source_word: עַגְבָתָהּ
  choice: в своей похоти
  rationale: Слово обозначает сильное, в данном контексте сексуальное вожделение; «похоть» сохраняет прямоту и отрицательную окраску исходного текста.
- source_word: מִמֶּנָּה
  choice: своей сестры
  rationale: Предлог מִן выражает сравнение с ранее названной сестрой; существительное повторено по-русски ради ясности.
- source_word: וְאֶת תַּזְנוּתֶיהָ
  choice: а в своих блудодеяниях
  rationale: Множественное число передаёт совокупность действий сексуальной распущенности и сохраняет пророческую метафору неверности.
- source_word: מִזְּנוּנֵי אֲחוֹתָהּ
  choice: превзошла блудодеяния своей сестры
  rationale: Сравнительное значение מִן выражено глаголом «превзошла»; повтор «блудодеяния» отражает лексический повтор оригинала.
theological_decisions:
- issue: Сексуальная метафора заветной неверности
  choice: Сохранить прямые слова «похоть» и «блудодеяния».
  alternative: Передать абстрактно как «неверность» или истолковать непосредственно как «идолопоклонство».
  rationale: Еврейский текст намеренно использует резкую сексуальную образность применительно к неверности Самарии и Иерусалима. Её сохранение передаёт риторическую силу и не сводит напряжённую метафору к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сексуальная лексика оставлена прямой, но не вульгарной; «блудодеяния» несколько возвышенно, зато ясно сохраняет повтор и метафорический диапазон оригинала.
