  text: Then I said of her, worn out by adulteries, ‘Now they will commit her prostitution with her, and she herself as well.’
translation:
  language: ru
  text: 'Тогда я сказал о ней, изнурённой прелюбодеяниями: «Теперь будут блудить с нею — и она сама тоже»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст второй половины стиха необычен и допускает разные понимания. Буквально здесь стоит выражение, которое можно передать: «Теперь будут совершать её блуд с нею — и она сама тоже»; точный смысл последнего сочетания неясен.'
    reason: Сноска отмечает когнативную конструкцию и синтаксическую неопределённость, не навязывая одного толкования и не воспроизводя неестественную русскую конструкцию в основном тексте.
lexical_decisions:
- source_word: לַבָּלָה נִאוּפִים
  choice: о ней, изнурённой прелюбодеяниями
  rationale: בָּלָה передаёт состояние изношенности, истощённости или увядания; конструкция נִאוּפִים указывает, чем она изнурена. Формулировка сохраняет образ и связь с многократными изменами.
- source_word: תַזְנוּתֶהָ
  choice: её блуду
  rationale: Существительное обозначает её проституцию/блудное поведение. Дословный оттенок сохранён, хотя вся еврейская фраза синтаксически трудна.
- source_word: וָהִיא
  choice: и она сама тоже
  rationale: Ударное местоимение сохранено без уточнения подразумеваемого действия, чтобы не устранять эллиптичность оригинала.
theological_decisions:
- issue: Метафора сексуальной неверности как образ неверности Иерусалима
  choice: прелюбодеяниями; блуду
  alternative: изменами; распутству
  rationale: Сохранена резкая брачно-сексуальная образность пророческого текста без смягчения и без внесения конфессионального толкования.
- issue: Неясность того, кто совершает действие в заключительной части стиха
  choice: с ней будут предаваться её блуду — и она сама тоже
  alternative: она и дальше будет блудницей
  rationale: Выбранный вариант следует засвидетельствованному чтению, отражённому в WLC и консультационном английском тексте, и не превращает неоднозначную эллиптическую фразу в однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык; тон суровый и пророческий. Слово «прелюбодеяния» сохраняет брачную метафору, а «блуд» передаёт זנות без разговорной грубости. Эллипсис заключительных слов намеренно сохранён.
