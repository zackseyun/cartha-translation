  text: וּֽ/בְ/שַׁחֲטָ֤/ם אֶת בְּנֵי/הֶם֙ לְ/גִלּ֣וּלֵי/הֶ֔ם וַ/יָּבֹ֧אוּ אֶל מִקְדָּשִׁ֛/י בַּ/יּ֥וֹם הַ/ה֖וּא לְ/חַלְּל֑/וֹ וְ/הִנֵּה כֹ֥ה עָשׂ֖וּ בְּ/ת֥וֹךְ בֵּיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/039.yaml
  text: For when they slaughtered their sons for their idols, they came into my sanctuary on that same day to defile it. Look—this is what they did within my house.
translation:
  language: ru
  text: Когда они закалывали своих сыновей для своих идолов, они в тот же день пришли в Моё святилище, чтобы осквернить его. Вот так они поступили внутри Моего дома.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשַׁחֲטָם
  choice: Когда они закалывали
  rationale: Передаёт обстоятельственную конструкцию и конкретный глагол «закалывать», сохраняя связь с жертвоприношением.
- source_word: לְגִלּוּלֵיהֶם
  choice: для своих идолов
  rationale: Естественно по-русски передаёт направленность жертвоприношения; уничижительный оттенок еврейского обозначения идолов не усилен искусственно.
- source_word: מִקְדָּשִׁי
  choice: Моё святилище
  rationale: Точно передаёт культовое священное место, принадлежащее говорящему Богу.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательно-эмфатическую функцию частицы в естественной русской форме.
- source_word: בְּתוֹךְ בֵּיתִי
  choice: посреди Моего дома
  rationale: Сохраняет пространственное значение בְּתוֹךְ и метафорико-храмовое обозначение «Мой дом».
theological_decisions:
- issue: Характер убийства сыновей
  choice: закалывали своих сыновей для своих идолов
  alternative: приносили своих сыновей в жертву идолам
  rationale: Более буквально сохраняется образ действия שׁחט и не заменяется истолковывающей формулировкой, хотя жертвенный контекст очевиден.
- issue: Связь жертвоприношения и осквернения святилища
  choice: в тот же день они приходили... чтобы осквернить его
  alternative: а затем в тот же день вошли... и осквернили его
  rationale: Сохраняется целевая конструкция לְחַלְּלוֹ и подчёркнутая одновременная близость двух святотатственных действий без добавления временной последовательности.
translation_notes:
  register: Современный литературный русский язык; тон прямой и торжественно-обличительный. Прописные буквы в местоимениях «Моё/Моего» использованы как издательская норма уважительного обозначения Бога. Архаизм «се» не употреблён; וְהִנֵּה передано естественным «И вот».
