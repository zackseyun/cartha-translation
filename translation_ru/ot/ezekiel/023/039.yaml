  source_fidelity: 'Основной смысл передан верно: заклание сыновей для идолов, приход в Божье святилище в тот же день и осквернение святилища. Однако русское «приходили» и «делали» задаёт неопределённо-длительный/повторяющийся вид, тогда как в данном высказывании еврейские формы естественнее передать повествовательным прошедшим: «пришли» и «поступили».'
  naturalness: Текст в целом современный и литературный. «Внутри Моего дома» звучит естественнее, чем несколько тяжеловесное «посреди Моего дома» в значении нахождения в храме.
  terminology: «Закалывали», «идолы», «святилище» и «осквернить» точны и соответствуют обличительному культовому контексту. «Дом Мой» сохранён как храмовое обозначение; прописное написание местоимений допустимо как издательская конвенция.
