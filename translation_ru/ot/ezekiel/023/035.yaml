base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/035.yaml
  text: 'Therefore thus says the Lord GOD: Because you have forgotten me and cast me behind your back[a], you also must bear your lewdness and your prostitutions.'
translation:
  language: ru
  text: 'Поэтому так говорит Господь Яхве: «За то, что ты забыла Меня и отбросила Меня за свою спину[a], и ты понеси последствия своего разврата и своих блудодеяний».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отбросила Меня за свою спину». Это еврейское выражение означает намеренно отвергнуть кого-либо или пренебречь им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сохраняет оба элемента составного божественного титула и передаёт личное имя יהוה как «Яхве», не создавая неестественного сочетания «Господь Господь».
- source_word: יַעַן
  choice: за то, что
  rationale: Естественно вводит основание судебного приговора в современном русском языке.
- source_word: שָׁכַחַתְּ אוֹתִי
  choice: ты забыла Меня
  rationale: Женский род соответствует обращению к олицетворённой женщине; совершенный вид передаёт завершённое действие, лежащее в основе обвинения.
- source_word: וַתַּשְׁלִיכִי אוֹתִי אַחֲרֵי גַוֵּךְ
  choice: и отбросила Меня за спину
  rationale: Сохраняет резкий телесный образ намеренного отвержения и пренебрежения, оставаясь понятным по-русски.
- source_word: וְגַם אַתְּ
  choice: и ты
  rationale: Усиленное местоимение отражено явным «ты»; частица в контексте подчёркивает, что последствие теперь ложится на саму адресатку.
- source_word: שְׂאִי
  choice: неси же бремя
  rationale: Императив сохранён, а добавление «бремя» естественно раскрывает русский оборот «нести» в значении претерпевать последствия; частица «же» подчёркивает судебную неизбежность.
- source_word: זִמָּתֵךְ
  choice: своего разврата
  rationale: В сексуализированной обличительной речи Иезекииля слово обозначает постыдную, порочную распущенность; «разврат» звучит ясно и достойно.
- source_word: תַּזְנוּתָיִךְ
  choice: своих блудодеяний
  rationale: Множественное число обозначает повторяющиеся проявления проституции и, метафорически, заветной неверности; «блудодеяния» сохраняет множественность и библейскую серьёзность без архаического «блудодействования».
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Транслитерация «Яхве» сохраняет личное заветное имя, непосредственно присутствующее в еврейском тексте, а «Владыка» отличает אֲדֹנָי от имени יהוה.
- issue: Связь сексуальной образности с заветной неверностью
  choice: Сохранить прямые выражения «разврат» и «блудодеяния» без пояснения внутри стиха
  alternative: Передать их как «неверность» и «отступничество»
  rationale: Исходный текст намеренно сохраняет сильную сексуальную метафорику; замена отвлечёнными богословскими терминами ослабила бы образ и сняла бы его напряжение.
- issue: Значение императива שְׂאִי
  choice: «неси же бремя» как судебный приказ и приговор
  alternative: «тебе придётся понести»
  rationale: Форма императива сохранена, но русский оборот также даёт услышать неизбежное последствие, а не простой добровольный призыв.
translation_notes:
  register: Современный литературный русский с торжественным пророческим тоном. Сохранены женский род обращения, резкость обвинения и образность судебного приговора; избегнуты как разговорные эвфемизмы, так и чрезмерно архаические формы.
