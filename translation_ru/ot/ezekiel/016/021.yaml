lexical_decisions:
- source_word: וַתִּשְׁחֲטִי
  choice: Ты закалывала
  rationale: Глагол שׁחט обозначает заклание, особенно жертвенное; «закалывала» сохраняет как жестокий, так и культовый оттенок обвинения. Несовершенный вид естественно передаёт повторявшееся действие в контексте.
- source_word: בָּנָי
  choice: Моих сыновей
  rationale: Еврейский текст прямо говорит «Мои сыновья», сохраняя мужской род и Божье притязание на детей.
- source_word: וַתִּתְּנִים
  choice: отдавала их
  rationale: נתן с объектным суффиксом здесь означает передачу другому; «отдавала их» естественно выражает предание детей идолам.
- source_word: בְּהַעֲבִיר אֹותָם
  choice: проводя их через огонь
  rationale: Каузатив עבר в данном культовом контексте обозначает проведение детей через огонь. Слова «через огонь» контекстуально подразумеваются, хотя в самой фразе не выражены явно.
- source_word: לָהֶם
  choice: этим идолам
  rationale: Местоимение «им» отсылает к идолам из ближайшего контекста. Явное существительное устраняет неясность русского местоимения, не меняя референта.
theological_decisions:
- issue: Следует ли явно выразить огненно-жертвенный смысл оборота «проводить»
  choice: В основном тексте дано «проводя их через огонь» с примечанием.
  alternative: «проводя их к ним» или буквально «проводя их им»
  rationale: В контексте Иезекииля оборот относится к принесению детей в огненную жертву. Уточнение делает обвинение понятным современному читателю, а примечание сохраняет прозрачность относительно буквальной формы еврейского текста.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Обращение к олицетворённому Иерусалиму передано формами женского рода. Прописная буква в «Моих» подчёркивает, что говорит Бог, без добавления конфессиональной терминологии.
