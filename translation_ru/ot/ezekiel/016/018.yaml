lexical_decisions:
- source_word: בִּגְדֵי רִקְמָתֵךְ
  choice: свои расшитые одежды
  rationale: «Одежды» точно передаёт בִּגְדֵי, а «расшитые» естественно выражает רִקְמָה как богато украшенную вышивкой ткань и сохраняет оттенок роскоши.
- source_word: וַתְּכַסִּים
  choice: ими покрыла их
  rationale: Глагол כסה прежде всего означает «покрывать». Местоименное дополнение сохранено, чтобы контекст, а не добавленное в перевод слово «идолы», указывал на его референт.
- source_word: וְשַׁמְנִי
  choice: Моё масло
  rationale: שֶׁמֶן означает масло, часто оливковое, однако вид масла здесь прямо не назван. «Моё» сохраняет важный для обличения акцент на принадлежности Богу.
- source_word: וּקְטָרְתִּי
  choice: Моё благовоние
  rationale: קְטֹרֶת обозначает благовонное вещество для воскурения. «Благовоние» понятно современному читателю и сохраняет культовый смысл без излишне архаичного «курение».
- source_word: נתתי לִפְנֵיהֶם
  choice: ты положила перед ними
  rationale: 'По контексту форма означает действие адресата женского рода: она поместила масло и благовоние перед изображениями как приношение. «Положила перед ними» естественно передаёт эту сцену по-русски.'
theological_decisions:
- issue: К кому относятся местоимения мужского рода множественного числа («их», «ними»)
  choice: Сохранить местоимения; в контексте они относятся к идолам или изображениям.
  alternative: Прямо назвать их идолами.
  rationale: Контекст указывает на идолов, но еврейский текст в этом стихе не повторяет существительное. Местоимения сохраняют форму оригинала и не устраняют контекстуальную связь.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «ими покрыла их» позволяет сохранить оба местоименных элемента без добавления слова «идолы»; повтор «Моё» передаёт обвинительный акцент оригинала.
