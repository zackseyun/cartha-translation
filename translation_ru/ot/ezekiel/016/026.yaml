base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/026.yaml
  text: You prostituted yourself with the sons of Egypt[a], your neighbors, great of flesh[b], and multiplied your prostitution to provoke me to anger.
translation:
  language: ru
  text: Ты предавалась блуду с сынами Египта[a], твоими соседями, наделёнными большой плотью[b], и умножала свой блуд, чтобы разгневать Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с египтянами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «великими плотью». Это грубая сексуальная характеристика; возможны более толковательные переводы: «похотливыми» или «хорошо наделёнными».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: Ты блудила
  rationale: Прямо сохраняет глагольную метафору проституции и заветной неверности, не заменяя её более общим словом «изменяла».
- source_word: אֶל
  choice: с
  rationale: При русском глаголе «блудить» предлог «с» естественно передаёт направленность действия на партнёров, тогда как буквальное «к» звучало бы неясно.
- source_word: בְּנֵי מִצְרַיִם
  choice: с сынами Египта
  rationale: Сохраняет конкретную еврейскую формулу «сыны Египта»; более гладкий этноним дан в сноске.
- source_word: שְׁכֵנַיִךְ
  choice: твоими соседями
  rationale: Передаёт географическую близость Египта и согласуется с обращением к персонифицированному Иерусалиму в женском роде.
- source_word: גִּדְלֵי בָשָׂר
  choice: большими плотью
  rationale: Намеренно близко передаёт грубое и сексуально окрашенное «великие/большие плотью», не сводя неоднозначный образ к толкованию «похотливые».
- source_word: וַתַּרְבִּי אֶת תַּזְנֻתֵךְ
  choice: и умножала свой блуд
  rationale: Сохраняет каузативное значение «увеличивать, умножать» и лексическую связь существительного с предшествующим глаголом.
- source_word: לְהַכְעִיסֵנִי
  choice: чтобы разгневать Меня
  rationale: 'Естественно и кратко выражает каузативный смысл: вызвать Божий гнев.'
theological_decisions:
- issue: Пророческая сексуальная метафора идолопоклонства и союзов с чужими державами
  choice: Сохранить прямой образ блуда в основном тексте
  alternative: Смягчить до «была неверна» или «изменила»
  rationale: Резкая сексуальная образность составляет существенную часть обвинительной риторики главы; её смягчение ослабило бы смысл и эмоциональную силу исходного текста.
- issue: Значение выражения גִּדְלֵי בָשָׂר
  choice: Сохранить буквальный и намеренно грубый образ «большими плотью»
  alternative: Передать толковательно как «похотливыми» или «хорошо сложенными»
  rationale: Контекст допускает грубый сексуальный намёк, но исходное выражение метафорично и не называет конкретную анатомическую особенность прямо; сноска поясняет диапазон смысла, не устраняя напряжение.
translation_notes:
  register: Современный литературный русский с сохранением резкой пророческой образности. Формы «сыны Египта» и «умножала свой блуд» придают тексту умеренно возвышенный библейский оттенок, оставаясь понятными; необычность выражения «большими плотью» намеренно отражает форму и грубость еврейского оборота.
