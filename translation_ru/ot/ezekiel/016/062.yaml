source:
  edition: WLC
  text: וַ/הֲקִימוֹתִ֥י אֲנִ֛י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/062.yaml
  text: And I myself will establish my covenant with you, and you will know that I am Yahweh.
translation:
  language: ru
  text: И Я сам утвержу Мой завет с тобой, и ты узнаешь, что Я — Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: утвержу
  rationale: Хифиль глагола קום означает «сделать стоящим», то есть установить или утвердить завет. «Утвержу» естественно передаёт действенное установление и прочность завета.
- source_word: אֲנִי
  choice: Я сам
  rationale: Самостоятельное местоимение при уже выраженном в глаголе первом лице несёт эмфазу и подчёркивает личную инициативу Бога.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: בְּרִית — обычное библейское обозначение завета, особенно отношений между Богом и людьми; «завет» сохраняет его смысл и литературно-богословский вес.
- source_word: אִתָּךְ
  choice: с тобой
  rationale: Предлог обозначает отношение сторон завета. Женский род адресата грамматически не выражается в этой русской форме, но определяется контекстом обращения к Иерусалиму.
- source_word: וְיָדַעַתְּ
  choice: и ты узнаешь
  rationale: Перфект с союзом в пророческом контексте выражает будущее следствие. «Узнаешь» здесь естественнее передаёт достижение знания, чем статическое «будешь знать».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет отличие имени Бога от титула «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Эмфаза самостоятельного местоимения אֲנִי
  choice: Я сам
  alternative: Я
  rationale: Так сохраняется явное ударение исходного текста на личном действии Бога без добавления стороннего богословского толкования.
- issue: Смысл וְיָדַעַתְּ
  choice: и ты узнаешь
  alternative: и ты будешь знать; тогда ты узнаешь
  rationale: Будущее «узнаешь» сохраняет результативный оттенок формы; союз передан нейтральным «и», без добавления более истолковывающего «тогда».
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Заглавные местоимения в обращении Бога к Себе поддерживают традиционный русский религиозный регистр. Женский род адресата виден в форме «узнаешь» лишь из контекста, как и естественно для русского языка.
