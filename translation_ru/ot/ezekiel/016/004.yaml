base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/004.yaml
  text: And as for your birth[a], on the day you were born your cord was not cut, and you were not washed with water for cleansing; you were not rubbed with salt[c][b], and you were not wrapped in cloths.
translation:
  language: ru
  text: 'Что до твоего рождения: в день, когда ты родилась, тебе не перерезали пуповину, тебя не обмыли водой для очищения[a], не натёрли солью[b] и не спеленали[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы растереть тебя»; возможно также: «чтобы разгладить кожу». Еврейское слово встречается редко, и его точное значение неясно.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о древнем обычае натирать новорождённого солью.
    reason: cultural_note
  - marker: c
    text: 'Или: «не обернули пеленами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלְדוֹתַיִךְ
  choice: твоего рождения
  rationale: Форма множественного числа здесь идиоматически обозначает обстоятельства рождения; в данном контексте естественное русское соответствие — «рождение».
- source_word: בְּיוֹם הוּלֶּדֶת אֹתָךְ
  choice: в день, когда ты родилась
  rationale: Естественная временная конструкция; женский род передаёт обращение к олицетворённому Иерусалиму и соответствует форме второго лица женского рода.
- source_word: שָׁרֵךְ
  choice: пуповину
  rationale: В контексте ухода за новорождённым речь идёт о пуповине; полное русское наименование ясно и не выглядит чрезмерно специальным.
- source_word: לְמִשְׁעִי
  choice: чтобы очистить
  rationale: Редкое слово, вероятно, указывает на цель омовения — очищение; неоднозначность между очищением, растиранием и разглаживанием сохранена в примечании.
- source_word: הָמְלֵחַ ... הֻמְלַחַתְּ
  choice: не натёрли солью
  rationale: Передаёт древний обычай обработки новорождённого солью и избегает неестественного или кулинарного оттенка буквального «не посолили».
- source_word: הָחְתֵּל ... חֻתָּלְתְּ
  choice: не спеленали
  rationale: Точный и понятный современному русскому читателю глагол для оборачивания новорождённого пелёнками.
