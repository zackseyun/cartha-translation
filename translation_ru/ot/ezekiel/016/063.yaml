source:
  edition: WLC
  text: לְמַ֤עַן תִּזְכְּרִי֙ וָ/בֹ֔שְׁתְּ וְ/לֹ֨א יִֽהְיֶה לָּ֥/ךְ עוֹד֙ פִּתְח֣וֹן פֶּ֔ה מִ/פְּנֵ֖י כְּלִמָּתֵ֑/ךְ בְּ/כַפְּרִ/י לָ/ךְ֙ לְ/כָל אֲשֶׁ֣ר עָשִׂ֔ית נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/063.yaml
  text: so that you may remember and be ashamed[a], and no longer have any opening of the mouth because of your disgrace, when I make atonement for you for all that you have done[b], declares the Lord GOD.
translation:
  language: ru
  text: чтобы ты помнила и стыдилась и из-за своего позора больше не смела открыть рта[a], когда Я совершу за тебя искупление — за всё, что ты сделала[b], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и больше не будет у тебя открытия уст»; то есть у тебя не останется ни основания, ни дерзновения говорить в своё оправдание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда Я искуплю тебя за всё, что ты сделала». Еврейский глагол здесь выражает искупление и примирение, а не только прощение в общем смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּזְכְּרִי
  choice: чтобы ты помнила
  rationale: לְמַעַן вводит цель или результат; форма 2-го лица женского рода сохраняет обращение к олицетворённому Иерусалиму.
- source_word: וָבֹשְׁתְּ
  choice: и стыдилась
  rationale: Передаёт состояние стыда без усиления до исключительно внешнего публичного посрамления.
- source_word: פִּתְחוֹן פֶּה
  choice: не смела открыть рта
  rationale: Естественная русская передача еврейской идиомы «открытие уст», обозначающей возможность или дерзновение что-либо сказать; образ открывания рта сохранён.
- source_word: מִפְּנֵי כְּלִמָּתֵךְ
  choice: из-за своего позора
  rationale: מִפְּנֵי имеет здесь причинное значение, а כְּלִמָּה обозначает стыд, бесчестье или позор; «позор» позволяет избежать неуклюжего повтора слова «стыд».
- source_word: בְּכַפְּרִי לָךְ
  choice: когда Я совершу за тебя искупление
  rationale: Предлог בְּ перед инфинитивом передан временно. כפר сохраняет смысл искупления и примирения, не сводясь к общему понятию прощения; לָךְ указывает на того, ради кого совершается искупление.
- source_word: לְכָל אֲשֶׁר עָשִׂית
  choice: за всё, что ты сделала
  rationale: Сохраняет всеохватность вины Иерусалима и связь оборота с искуплением.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передан как пророческая формула провозглашения; אֲדֹנָי передано титулом «Владыка», а יהוה — личным именем «Яхве», что избегает сочетания «Господь Господь».
theological_decisions:
- issue: Значение כפר в контексте восстановления Иерусалима
  choice: совершу за тебя искупление
  alternative: прощу тебя; очищу тебя; заглажу твою вину
  rationale: Формулировка сохраняет культово-примирительный вес глагола כפר и не уточняет механизм искупления, не названный в самом стихе.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה и сохраняется непосредственное присутствие Божьего имени в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род последовательно сохраняет обращение к Иерусалиму как к женщине. Идиома об открытии уст передана естественно, но её образ и буквальная форма отмечены в сноске.
