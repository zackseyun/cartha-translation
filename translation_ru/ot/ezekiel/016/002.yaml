  text: בֶּן אָדָ֕ם הוֹדַ֥ע אֶת יְרוּשָׁלִַ֖ם אֶת תּוֹעֲבֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/002.yaml
  text: Son of man[a], make known to Jerusalem her abominations.
translation:
  language: ru
  text: Сын человеческий, открой Иерусалиму её мерзости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Буквально передаёт устойчивое обращение к пророку в книге Иезекииля и сохраняет форму исходного текста.
- source_word: הוֹדַע
  choice: укажи … на
  rationale: Каузативный императив означает «дай узнать, доведи до сведения». В сочетании с двумя показателями прямого дополнения русская конструкция «укажи кому-либо на что-либо» естественно передаёт повеление открыть адресату его собственные проступки.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалиму
  rationale: Традиционная русская форма топонима; дательный падеж обусловлен конструкцией «указать кому».
- source_word: תּוֹעֲבֹתֶיהָ
  choice: его мерзости
  rationale: «Мерзости» сохраняет сильную нравственно-культовую окраску תּוֹעֵבָה и множественное число. Местоимение «его» согласуется в русском с грамматически мужским названием города, при том что дальнейшая женская персонификация раскрывается контекстом главы.
theological_decisions:
- issue: Женская персонификация Иерусалима в еврейском суффиксе
  choice: «его мерзости» по нормам русского согласования с названием «Иерусалим»
  alternative: «её мерзости»
  rationale: Еврейский суффикс женского рода поддерживает развёрнутый образ Иерусалима как женщины, однако непосредственно при русском топониме «Иерусалим» форма «её» звучит как нарушение согласования. Выбранный вариант не устраняет персонификацию, которая становится явной в последующем контексте.
translation_notes:
  register: Современный литературный русский язык; краткое, весомое пророческое повеление. Традиционное обращение «Сын человеческий» сохранено без архаизации остальной фразы.
