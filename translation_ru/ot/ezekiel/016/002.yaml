review_pass:
  verdict: revise
  source_fidelity: The imperative הוֹדַע is causative, “make known / disclose,” and the feminine singular suffix on תּוֹעֲבֹתֶיהָ refers to Jerusalem personified as a woman. «Укажи ... на» is a possible contextual rendering but narrows the verb toward rebuke; «его» fails to preserve the source’s explicit feminine personification.
  naturalness: «Сын человеческий, открой Иерусалиму её мерзости» is concise, idiomatic modern literary Russian and retains the solemn prophetic register.
  terminology: «Сын человеческий» is the established Russian rendering for בן־אדם in Ezekiel. «Мерзости» adequately conveys the strong plural term תּוֹעֲבוֹת. The feminine «её» is deliberate literary agreement with personified Jerusalem, not an error in reference.
  issues:
