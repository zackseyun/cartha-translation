    issue: «его мерзости» replaces the Hebrew feminine suffix with masculine agreement.
    rationale: The verse explicitly presents Jerusalem with a feminine suffix, anticipating the chapter’s sustained feminine personification. Russian can naturally use «её» where the city is rhetorically personified.
  - severity: low
    issue: «укажи Иерусалиму на» is more accusatory and specific than the causative imperative הוֹדַע.
    rationale: It can fit the context, but «открой ...» more directly retains the sense of making the abominations known without adding the particular nuance of pointing out or reproaching.
