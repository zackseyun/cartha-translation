base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/006.yaml
  text: And I passed by you and saw you wallowing in your blood[a], and I said to you, ‘In your blood, live!’ Yes, I said to you, ‘In your blood[b], live!’
translation:
  language: ru
  text: 'И прошёл Я мимо тебя, и увидел тебя, барахтающуюся в своей крови, и сказал тебе: «В крови твоей — живи!» И снова сказал тебе: «В крови твоей — живи!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова «В крови твоей — живи!» в еврейском тексте повторены для усиления. Предлог также допускает понимание: «Хотя ты была в крови своей, живи!»'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: проходил Я мимо тебя
  rationale: Сочетание עבר с על здесь описывает движение мимо оставленного младенца; русское «проходил мимо» естественно передаёт сцену, не добавляя толкования.
- source_word: וָאֶרְאֵךְ
  choice: увидел тебя
  rationale: Прямое и естественное соответствие глаголу ראה.
- source_word: מִתְבּוֹסֶסֶת
  choice: барахтающуюся
  rationale: Причастие изображает беспомощные движения новорождённой в крови. «Барахтающуюся» сохраняет живую телесную образность и не предполагает намеренного валяния.
- source_word: בְּדָמָיִךְ
  choice: в своей крови / в крови твоей
  rationale: Форма множественного числа «крови» в данном образе естественно передаётся по-русски единственным числом. В описании употреблено идиоматичное «в своей крови», а в краткой прямой речи — более торжественное и резкое «в крови твоей».
- source_word: חֲיִי
  choice: живи!
  rationale: Императив женского рода единственного числа передан кратким повелением «живи!», обращённым к олицетворённому Иерусалиму.
- source_word: וָאֹמַר לָךְ ... וָאֹמַר לָךְ
  choice: сказал тебе ... И снова сказал тебе
  rationale: Повтор речи сохранён как риторическое усиление; «снова» делает повтор естественным по-русски, не устраняя его.
theological_decisions:
- issue: Значение предлога ב в выражении בְּדָמַיִךְ חֲיִי
  choice: В крови твоей — живи!
  alternative: Хотя ты была в крови своей, живи! / И в крови своей живи!
  rationale: Еврейское выражение предельно сжато, а предлог допускает локативное и контекстуально уступительное понимание. Основной текст сохраняет напряжённую буквальную конструкцию, не разрешая неоднозначность.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной инверсией в прямой речи. Резкость и повтор исходного текста сохранены; женский род обусловлен обращением к олицетворённому Иерусалиму.
