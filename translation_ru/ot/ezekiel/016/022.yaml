base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/022.yaml
  text: And in all your abominations and your prostitutions[a], you did not remember the days of your youth, when you were naked and bare[c][b], wallowing in your blood.
translation:
  language: ru
  text: При всех своих мерзостях и блудодеяниях[a] ты не вспоминала дней своей юности, когда была нагой и неприкрытой[b] и барахталась в своей крови[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при всех своих актах блуда». В пророческом образе блудодеяние означает также идолопоклонство и неверность Иерусалима завету.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «голой и ничем не прикрытой».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «корчилась в своей крови» или «билась в своей крови». Еврейский глагол рисует беспомощное движение существа, покрытого кровью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבֹתַיִךְ
  choice: своих мерзостях
  rationale: Слово обозначает отвратительные, нередко культово или нравственно оскверняющие поступки. «Мерзости» сохраняет резкость пророческого обвинения.
- source_word: תַזְנֻתַיִךְ
  choice: своих блудодеяниях
  rationale: Сохранён конкретный образ сексуальной распущенности, которым Иезекииль передаёт идолопоклонство и нарушение заветной верности; множественное число отражает повторяемость поступков.
- source_word: לֹא זכרתי
  choice: ты не вспоминала
  rationale: По контексту это отрицательная форма глагола во 2-м лице женского рода, обращённая к Иерусалиму. «Не вспоминала» естественно передаёт отсутствие памятования о прежнем беспомощном состоянии.
- source_word: יְמֵי נְעוּרָיִךְ
  choice: дней своей юности
  rationale: Близко передаёт конструкцию оригинала и сохраняет временную отсылку к раннему состоянию олицетворённого Иерусалима.
- source_word: עֵרֹם וְעֶרְיָה
  choice: нагой и обнажённой
  rationale: Парные слова усиливают образ полной незащищённости и выставленности напоказ; риторическое удвоение сохранено.
- source_word: מִתְבּוֹסֶסֶת בְּדָמֵךְ
  choice: барахталась в своей крови
  rationale: Форма глагола допускает образы беспомощного движения, корчей или возни в крови. «Барахталась» естественно и наглядно передаёт беспомощность, не сводя значение к одному точно определённому движению.
- source_word: וְאֵת כָּל ... וְ...
  choice: При всех своих ... и ...
  rationale: 'Начальная конструкция эллиптична. «При всех» передаёт сопутствующие обстоятельства: среди всех этих поступков Иерусалим не вспоминал о своей юности, не превращая возможное обстоятельственное значение в однозначное «несмотря на».'
theological_decisions:
- issue: Сексуальный образ заветной неверности
  choice: Сохранить конкретное слово «блудодеяния».
  alternative: Передать как «неверность» или «идолопоклонство».
  rationale: Пророк намеренно использует резкий сексуальный образ. Абстрактная замена ослабила бы обвинение и подменила бы образ его богословским истолкованием.
- issue: Неоднозначность начальной синтаксической конструкции
  choice: Передать её оборотом «при всех».
  alternative: «Несмотря на все» или «во всех».
  rationale: Оригинал допускает обстоятельственное понимание, но не выражает уступку столь явно, как русское «несмотря на». Выбранный оборот сохраняет некоторую открытость связи.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Женский род последовательно отражает обращение к олицетворённому Иерусалиму. Слова «мерзости» и «блудодеяния» намеренно сохраняют суровость оригинала, а не смягчают её.
