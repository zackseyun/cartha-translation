  text: אֶל כָּל רֹ֣אשׁ דֶּ֗רֶךְ בָּנִית֙ רָֽמָתֵ֔/ךְ וַ/תְּתַֽעֲבִי֙ אֶת יָפְיֵ֔/ךְ וַ/תְּפַשְּׂקִ֥י אֶת רַגְלַ֖יִ/ךְ לְ/כָל עוֹבֵ֑ר וַ/תַּרְבִּ֖י אֶת תזנת/ך־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/025.yaml
  text: At every street corner you built your high place[a], and you made your beauty detestable[b]. You spread your legs to every passerby and multiplied your prostitution.
translation:
  language: ru
  text: На каждом перекрёстке ты сооружала своё возвышение[a], превращала свою красоту в мерзость, раздвигала ноги перед каждым прохожим и умножала свой блуд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У начала каждой дороги»; буквально: «у каждой головы дороги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ דֶּרֶךְ
  choice: начало каждой дороги
  rationale: Буквально «голова/начало дороги». Это сохраняет образ заметного места у начала дороги, не сводя неоднозначное выражение исключительно к современному перекрёстку.
- source_word: רָמָה
  choice: возвышение
  rationale: Слово обозначает сооружённое возвышенное место и в контексте имеет культовый оттенок. «Возвышение» сохраняет как буквальный образ, так и связь с идолопоклонством.
- source_word: תְּתַעֲבִי אֶת יָפְיֵךְ
  choice: превращала свою красоту в мерзость
  rationale: Причинное значение глагола передаёт не просто отвращение к красоте, а то, что героиня сделала её отвратительной; русский оборот звучит естественно и сильно.
- source_word: תְּפַשְּׂקִי אֶת רַגְלַיִךְ
  choice: раздвигала ноги
  rationale: Прямой сексуальный образ оригинала не смягчён эвфемизмом.
- source_word: לְכָל עוֹבֵר
  choice: перед каждым прохожим
  rationale: Причастие означает всякого, кто проходит мимо; «перед» естественно сочетается с русским выражением «раздвигать ноги».
- source_word: תַּרְבִּי אֶת תַּזְנוּתֵךְ
  choice: умножала свой блуд
  rationale: Сохраняется усилительное значение «делать многочисленным, умножать». «Блуд» в русском библейском регистре охватывает сексуальную распущенность и метафору религиозной неверности, не вводя обязательно коммерческий оттенок проституции.
theological_decisions:
- issue: Прямота сексуально-идолопоклоннической метафоры
  choice: Сохранить прямое выражение «раздвигала ноги» и назвать неверность «блудом»
  alternative: Смягчить образ выражениями «отдавалась» или «блудодействовала»
  rationale: Еврейский текст намеренно использует резкий телесный образ для обличения публичной неверности Иерусалима; его смягчение ослабило бы пророческую силу стиха.
- issue: Культовое значение רָמָה
  choice: Передать как «возвышение»
  alternative: Передать как «святилище на высоте» или «высота»
  rationale: Контекст допускает культовое понимание, однако само слово прежде всего называет возвышенное сооружение. Выбранный вариант сохраняет образ и не добавляет отсутствующего в строке существительного «святилище».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён; сексуальный образ передан прямо, без архаизмов и эвфемистического смягчения.
