base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/039.yaml
  text: I will give you into their hand[a], and they will tear down your vaulted chamber and demolish your high places. They will strip you of your clothes, take your beautiful jewelry[b], and leave you naked and bare.
translation:
  language: ru
  text: Я отдам тебя в их руки[a], и они разрушат твоё сводчатое сооружение и снесут твои святилища на высотах. Они сорвут с тебя одежду, заберут твои великолепные украшения[b] и оставят тебя нагой и неприкрытой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово редкое; возможны также переводы: «твой холм», «твоё святилище» или «твоя арка». Вероятно, имеется в виду сооружение, связанное с образами незаконного поклонения в этой главе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предметы твоего великолепия», «твоё роскошное убранство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָךְ בְּיָדָם
  choice: Я отдам тебя в их руки
  rationale: Русское выражение естественно передаёт судебную передачу во власть других и сохраняет образ «рук».
- source_word: גַבֵּךְ
  choice: твой сводчатый помост
  rationale: Редкое слово, вероятно, обозначает сооружение, связанное в этой главе с незаконным поклонением и распутством; перевод сохраняет архитектурный характер слова, а примечание — его подлинную неясность.
- source_word: וְנִתְּצוּ רָמֹתַיִךְ
  choice: снесут твои святилища на высотах
  rationale: В пророческом контексте רמות обозначает культовые высоты; развёрнутый русский вариант понятнее, чем буквальное «высоты», и сохраняет культовый смысл.
- source_word: וְהִפְשִׁיטוּ אוֹתָךְ בְּגָדַיִךְ
  choice: сорвут с тебя одежду
  rationale: Передаёт насильственное раздевание и публичное унижение, выраженные глаголом.
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: твои великолепные украшения
  rationale: Сочетание буквально означает предметы великолепия или убранства; в контексте речь, вероятнее всего, об украшениях, ранее данных женщине.
- source_word: עֵירֹם וְעֶרְיָה
  choice: нагой и обнажённой
  rationale: Сохранено парное усилительное выражение и грамматический женский род обращения к олицетворённому Иерусалиму.
theological_decisions:
- issue: Метафорически-культовый образ Иерусалима как неверной женщины
  choice: Сохранить конкретные образы разрушения сооружений, разграбления и телесного унижения.
  alternative: Обобщить как уничтожение города и его бесчестие.
  rationale: Еврейский текст продолжает развёрнутую метафору заветной неверности Иерусалима; её смягчение устранило бы силу пророческой речи.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род последовательно отражает обращение к олицетворённому Иерусалиму. Редкость גַּב сохранена посредством осторожного основного варианта и примечания.
