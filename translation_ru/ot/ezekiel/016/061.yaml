  text: וְ/זָכַ֣רְתְּ אֶת דְּרָכַיִ/ךְ֮ וְ/נִכְלַמְתְּ֒ בְּ/קַחְתֵּ֗/ךְ אֶת אֲחוֹתַ֨יִ/ךְ֙ הַ/גְּדֹל֣וֹת מִמֵּ֔/ךְ אֶל הַ/קְּטַנּ֖וֹת מִמֵּ֑/ךְ וְ/נָתַתִּ֨י אֶתְ/הֶ֥ן לָ֛/ךְ לְ/בָנ֖וֹת וְ/לֹ֥א מִ/בְּרִיתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/061.yaml
  text: Then you will remember your ways and be ashamed when you receive your sisters[a], those older than you along with those younger than you; and I will give them to you as daughters[b], but not because of your covenant.
translation:
  language: ru
  text: Тогда ты вспомнишь свои пути и устыдишься, когда примешь своих сестёр[a] — тех, что старше тебя, вместе с теми, что младше тебя. Я дам тебе их как дочерей, но не в силу твоего завета[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда возьмёшь своих сестёр».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не от твоего завета».'
    reason: lexical_note
lexical_decisions:
- source_word: וְזָכַרְתְּ
  choice: Тогда ты вспомнишь
  rationale: Перфект с союзом в данном пророческом контексте имеет будущее, следственное значение; «тогда» естественно передаёт связь с предшествующим обещанием восстановления.
- source_word: דְּרָכַיִךְ
  choice: свои пути
  rationale: Сохранена еврейская метафора пути как образа поведения; она понятна и естественна в русском пророческом стиле.
- source_word: וְנִכְלַמְתְּ
  choice: и устыдишься
  rationale: Глагол выражает стыд и посрамление; возвратная форма передаёт внутреннюю нравственную реакцию без лишнего уточнения.
- source_word: בְּקַחְתֵּךְ
  choice: когда примешь
  rationale: Инфинитив с בְּ передан как временная конструкция. «Примешь» соответствует контексту восстановления отношений, тогда как буквальное «возьмёшь» сохранено в примечании как возможный вариант.
- source_word: אֲחוֹתַיִךְ
  choice: своих сестёр
  rationale: Сохранён ключевой для аллегории главы образ родственных отношений между Иерусалимом, Самарией и Содомом.
- source_word: הַגְּדֹלוֹת מִמֵּךְ אֶל הַקְּטַנּוֹת מִמֵּךְ
  choice: тех, что старше тебя, вместе с теми, что младше тебя
  rationale: В контексте сестринского образа буквальные «большие» и «малые» естественно понимаются как старшие и младшие; אֶל передано как соединяющее обе группы.
- source_word: וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת
  choice: Я дам их тебе в дочери
  rationale: Русская конструкция «дать в дочери» сохраняет семейную метафору включения их в зависимое родственное положение.
- source_word: וְלֹא מִבְּרִיתֵךְ
  choice: но не в силу твоего завета
  rationale: Оборот естественно передаёт значение источника или основания у предлога מִן и не сводит фразу лишь к соответствию условиям завета.
theological_decisions:
- issue: Значение заключительной фразы «не от/из твоего завета»
  choice: Дарование сестёр в дочери происходит не в силу завета, принадлежащего Иерусалиму.
  alternative: Это совершается не согласно завету Иерусалима.
  rationale: Формулировка сохраняет отрицание того, что обещанное дарование имеет источником или основанием завет Иерусалима, но не вводит более широкую конфессиональную схему и не уточняет сверх текста, идёт ли речь о заслуге, статусе или условиях завета.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены семейная метафора и обращение к Иерусалиму в женском роде; синтаксис сделан ясным для обычного читателя без устранения смыслового напряжения заключительной фразы.
