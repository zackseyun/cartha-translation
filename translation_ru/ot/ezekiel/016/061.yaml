- from: Тогда ты вспомнишь свои пути и устыдишься, когда примешь своих сестёр[a] — тех, что старше тебя, вместе с теми, что младше тебя. Я дам их тебе в дочери, но не в силу твоего завета[b].
  to: Тогда ты вспомнишь свои пути и устыдишься, когда примешь своих сестёр[a] — тех, что старше тебя, вместе с теми, что младше тебя. Я дам тебе их как дочерей, но не в силу твоего завета[b].
