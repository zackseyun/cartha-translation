    rationale: Она воспроизводит традиционный библейский оборот, но для заявленного современного литературного варианта яснее «дам тебе их как дочерей», без утраты метафоры לְבָנוֹת.
  - severity: medium
    issue: Примечание b чрезмерно конкретизирует смысл «не от/не в силу твоего завета».
    rationale: Еврейское וְלֹא מִבְּרִיתֵךְ не раскрывает, в каком именно систематическом смысле завет не является основанием. Буквальное примечание информирует читателя, не навязывая интерпретацию.
