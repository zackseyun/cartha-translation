  yaml_path: translation/ot/ezekiel/016/005.yaml
  text: No eye pitied you enough to do for you even one of these things[a], to have compassion on you; instead, you were thrown out into the open field in loathing of your life on the day you were born.
translation:
  language: ru
  text: Ничей глаз не сжалился над тобой, чтобы из сострадания к тебе сделать для тебя хотя бы что-нибудь из этого. Тебя выбросили в открытое поле из отвращения к тебе[a] в день твоего рождения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из отвращения к твоей душе (или жизни)»; возможно также: «потому что твоя жизнь была отвратительна». Еврейский оборот краток и может выражать отвращение, направленное на саму новорождённую.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסָה עָלַיִךְ עַיִן
  choice: Ничей глаз не сжалился над тобой
  rationale: Сохранён еврейский образ глаза как носителя сострадания; выражение остаётся понятным и выразительным по-русски.
- source_word: לַעֲשׂוֹת לָךְ אַחַת מֵאֵלֶּה
  choice: сделать для тебя хотя бы что-нибудь из этого
  rationale: Фраза отсылает к действиям по уходу за новорождённой в предыдущем стихе; «хотя бы что-нибудь» естественно передаёт значение אַחַת מֵאֵלֶּה.
- source_word: לְחֻמְלָה עָלָיִךְ
  choice: из сострадания к тебе
  rationale: Передаёт побуждение к заботе и значение חֻמְלָה без дополнительных богословских оттенков.
- source_word: וַתֻּשְׁלְכִי
  choice: Тебя выбросили
  rationale: Передаёт пассивную форму и резкость физического оставления младенца; по-русски звучит современно и ясно.
- source_word: אֶל־פְּנֵי הַשָּׂדֶה
  choice: в открытое поле
  rationale: Естественно выражает буквальный образ поверхности поля и подчёркивает незащищённость брошенного младенца.
- source_word: בְּגֹעַל נַפְשֵׁךְ
  choice: из отвращения к тебе[a]
  rationale: נֶפֶשׁ здесь обозначает саму живую личность; перевод даёт естественный русский смысл, а сноска сохраняет буквальную образность и неоднозначность компактного оборота.
- source_word: בְּיוֹם הֻלֶּדֶת אֹתָךְ
  choice: в день твоего рождения
  rationale: Прямой и естественный временной оборот, сохраняющий акцент на оставлении сразу после рождения.
