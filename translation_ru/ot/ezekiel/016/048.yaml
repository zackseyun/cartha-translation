    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Живу Я
  rationale: Сохраняет форму торжественной древнееврейской клятвы и звучит понятно в возвышенной пророческой речи; подразумеваемое клятвой усиленное отрицание выражено далее явно.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт устойчивую пророческую формулу как торжественное авторитетное объявление, не прибегая к архаичному «речение».
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Различает титул אֲדֹנָי и личное имя יהוה, избегая неясного для русского читателя сочетания двух форм «Господь».
- source_word: אִם
  choice: не делала
  rationale: После формулы клятвы אִם вводит эллиптическое сильное отрицание, а не обычное условие; отрицание необходимо выразить по-русски.
- source_word: סְדֹם אֲחוֹתֵךְ הִיא וּבְנוֹתֶיהָ
  choice: Содом, сестра твоя, со своими дочерьми
  rationale: Сохраняет центральную для главы метафору родства и охватывает как сам Содом, так и связанные с ним города; русское «со своими дочерьми» естественно передаёт совместного деятеля.
- source_word: כַּאֲשֶׁר עָשִׂית אַתְּ וּבְנוֹתָיִךְ
  choice: того, что делали ты и твои дочери
  rationale: Естественно выражает сравнение и сохраняет обращение к Иерусалиму во втором лице женского рода вместе с зависимыми от него поселениями.
theological_decisions:
- issue: Передача имени יהוה в составном титуле אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его отличие от титула אֲדֹנָי, тогда как «Господь Бог» заменяет имя титулом.
- issue: Толкование конструкции клятвы חַי־אָנִי ... אִם
  choice: 'торжественное усиленное отрицание: «Живу Я ... не делала»'
  alternative: буквальное условное «Живу Я ... если делала»
  rationale: В древнееврейской клятвенной формуле אִם указывает на подразумеваемое проклятие и тем самым выражает решительное отрицание. Буквальное «если» без восполнения эллипсиса было бы по-русски непрозрачно.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «Живу Я» намеренно сохраняет формулу божественной клятвы; остальной синтаксис сделан естественным и ясным. Метафора сестёр и дочерей сохранена.
