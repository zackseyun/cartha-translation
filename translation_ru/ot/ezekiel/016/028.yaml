  text: וַ/תִּזְנִי֙ אֶל בְּנֵ֣י אַשּׁ֔וּר מִ/בִּלְתִּ֖י שָׂבְעָתֵ֑/ךְ וַ/תִּזְנִ֕י/ם וְ/גַ֖ם לֹ֥א שָׂבָֽעַתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/028.yaml
  text: You prostituted yourself with the sons of Assyria because you were not satisfied[a]; you prostituted yourself with them[b], and even then you were not satisfied.
translation:
  language: ru
  text: Ты предавалась блуду с сынами Ассирии[a], потому что не могла насытиться; ты предавалась блуду с ними[b] и всё же не насытилась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с ассирийцами». Буквально: «с сынами Ассирии».'
    reason: lexical_alternative
  - marker: b
    text: Иезекииль неоднократно использует образ блуда, говоря о неверности Иерусалима, проявлявшейся в идолопоклонстве и союзах с чужеземными державами.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: ты предавалась блуду
  rationale: Глагол זנה здесь сохраняет резкую сексуальную метафору, которой Иезекииль изображает политическую и религиозную неверность Иерусалима. Выражение «предавалась блуду» понятно современному читателю и не смягчает образ до общего «была неверна».
- source_word: אֶל
  choice: с
  rationale: При זנה предлог אֶל обозначает тех, с кем вступают в недозволенную связь; по-русски это естественно передаётся предлогом «с».
- source_word: בְּנֵי אַשּׁוּר
  choice: с сынами Ассирии
  rationale: Формулировка сохраняет буквальный образ еврейского выражения и при этом остаётся понятной; по смыслу речь идёт об ассирийцах.
- source_word: מִבִּלְתִּי שָׂבְעָתֵךְ
  choice: потому что не была удовлетворена
  rationale: Оборот указывает на отсутствие насыщения или удовлетворения как на причину либо сопутствующее обстоятельство. Причинная формулировка естественна по-русски, не устраняя метафорическую многозначность.
- source_word: וַתִּזְנִים
  choice: ты блудила с ними
  rationale: Местоименный суффикс третьего лица множественного числа отсылает к сынам Ассирии; «с ними» явно передаёт эту деталь.
- source_word: וְגַם
  choice: но и тогда
  rationale: 'В контексте сочетание усиливает иронию: даже после продолжения блуда удовлетворения не наступило. «Но и тогда» естественно передаёт этот контраст.'
- source_word: לֹא שָׂבָעַתְּ
  choice: не была удовлетворена
  rationale: שׂבע означает насытиться, получить достаточно; здесь слово употреблено метафорически. «Не была удовлетворена» сохраняет повтор и подходит к контексту ненасытного стремления.
theological_decisions:
- issue: Сохранение метафоры проституции применительно к политической и религиозной неверности Иерусалима
  choice: Оставить в основном тексте прямую метафору блуда
  alternative: Смягчить до «ты была неверна» или пояснить как «ты искала союза с Ассирией»
  rationale: Шокирующий сексуальный образ намеренно составляет основу обличения в Иезекииля 16. Смягчение скрыло бы силу пророческой речи и тему неверности завету.
translation_notes:
  register: Современный литературный русский язык с сохранением резкости пророческой метафоры. «Блуд» имеет библейскую окраску, но остаётся общепонятным; синтаксис сделан плавным и сохраняет двукратное указание на отсутствие удовлетворения.
