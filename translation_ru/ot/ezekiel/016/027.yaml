  text: וְ/הִנֵּ֨ה נָטִ֤יתִי יָדִ/י֙ עָלַ֔יִ/ךְ וָ/אֶגְרַ֖ע חֻקֵּ֑/ךְ וָ/אֶתְּנֵ֞/ךְ בְּ/נֶ֤פֶשׁ שֹׂנְאוֹתַ֨יִ/ךְ֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים הַ/נִּכְלָמ֖וֹת מִ/דַּרְכֵּ֥/ךְ זִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/027.yaml
  text: And behold[a], I stretched out my hand against you, and I reduced your allotted portion, and gave you over to the desire of those who hate you, the daughters of the Philistines[c][b], who are ashamed of your lewd way.
translation:
  language: ru
  text: И вот, Я простёр против тебя руку, уменьшил назначенную тебе долю[a] и отдал тебя на волю ненавидящих тебя — дочерей филистимлян[b], которым стыдно за твой распутный путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «положенное тебе», «твоё содержание» либо «твой удел». Еврейское слово обозначает то, что установлено или назначено.'
    reason: lexical_alternative
  - marker: b
    text: «Дочери филистимлян» — пророческое олицетворение филистимского народа или его городов.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательно-усилительную функцию оборота и естественно звучит в современном литературном русском.
- source_word: נָטִיתִי יָדִי עָלַיִךְ
  choice: Я простёр на тебя руку
  rationale: Сохраняет еврейский образ решительного действия, направленного против Иерусалима, не конкретизируя вид кары.
- source_word: וָאֶגְרַע חֻקֵּךְ
  choice: уменьшил назначенную тебе долю
  rationale: Глагол означает уменьшение, а существительное — установленное или назначенное; перевод сохраняет неопределённость относительно того, идёт ли речь о содержании, уделе или положенной части.
- source_word: וָאֶתְּנֵךְ בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ
  choice: отдал тебя на волю ненавидящих тебя
  rationale: בְּנֶפֶשׁ здесь передаёт желание или волю врагов; русское «на волю» естественно выражает подчинение их враждебным намерениям.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: дочерей филистимлян
  rationale: Сохраняет пророческое олицетворение народов или городов как дочерей, не превращая образ в прямое обозначение отдельных женщин.
- source_word: הַנִּכְלָמוֹת מִדַּרְכֵּךְ זִמָּה
  choice: которым было стыдно за твоё распутное поведение
  rationale: Передаёт нравственное отвращение и сексуально окрашенный смысл זִמָּה; «поведение» естественнее по-русски, чем буквальное «путь» в этом сочетании.
theological_decisions:
- issue: Образ Божьего суда в аллегории неверности
  choice: Сохранить речь Бога от первого лица, образ простёртой против Иерусалима руки и лексику распутства.
  alternative: Передать сказанное отвлечённо как наказание за общее нечестие.
  rationale: Стих входит в развёрнутую аллегорию неверности завету; смягчение образов ослабило бы и обвинение, и изображение суда.
- issue: Референт выражения «дочери филистимлян»
  choice: Сохранить образное выражение без уточнения, означает ли оно города или население Филистии.
  alternative: Перевести как «филистимские города» либо «филистимлянки».
  rationale: Сам текст использует женское олицетворение, а конкретизация устранила бы подлинную образность и возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified-пророческим звучанием. Формы женского рода подразумеваются обращением к олицетворённому Иерусалиму. Синтаксис упрощён лишь настолько, чтобы стих оставался ясным, при сохранении исходной образности и смысловой напряжённости.
