base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/038.yaml
  text: And I will judge you with the judgments of women who commit adultery and who shed blood[b][a], and I will give you over to blood in wrath and jealousy.
translation:
  language: ru
  text: Я буду судить тебя судом, каким судят прелюбодеек[a] и женщин, проливающих кровь, и подвергну тебя кровавой каре в ярости и ревности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женщин, совершающих прелюбодеяние».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дам тебе кровь ярости и ревности». Вероятно, речь идёт о кровавом наказании или кровопролитии, совершаемом в ярости и ревности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁפַטְתִּיךְ
  choice: Я буду судить тебя
  rationale: Сохраняет судебное значение שׁפט и его связь с последующим מִשְׁפְּטֵי, не сужая действие до одного лишь вынесения приговора.
- source_word: מִשְׁפְּטֵי
  choice: по закону о
  rationale: Передаёт норму или порядок суда; в современном русском естественнее буквального «судами прелюбодеек», которое может ошибочно означать суд, осуществляемый самими женщинами.
- source_word: נֹאֲפוֹת
  choice: прелюбодейках
  rationale: Форма женского рода важна для олицетворения Иерусалима как неверной жены; слово сохраняет юридико-брачную окраску.
- source_word: וְשֹׁפְכֹת דָּם
  choice: и женщинах, проливающих кровь
  rationale: Сохраняет параллельный причастный оборот женского рода и обычное библейское обозначение виновных в кровопролитии.
- source_word: וּנְתַתִּיךְ דַּם
  choice: и предам тебя кровавой расправе
  rationale: Неясная сжатая конструкция буквально связывает адресата с «кровью»; перевод передаёт назначение кровавого наказания, не используя неестественное русское «сделаю тебя кровью».
- source_word: חֵמָה
  choice: в ярости
  rationale: Передаёт силу пылающего гнева и естественно сочетается по-русски с последующей «ревностью».
- source_word: וְקִנְאָה
  choice: и ревности
  rationale: Сохраняет брачно-заветный образ ревности обманутого мужа и не ослабляет его более отвлечённым словом «рвение».
theological_decisions:
- issue: Сочетание судебного и брачно-заветного образов
  choice: в ярости и ревности
  alternative: в гневе и рвении
  rationale: «Ревность» сохраняет напряжение образа Господа как обманутого мужа в контексте главы, не превращая его в отвлечённое усердие.
- issue: Характер божественного судебного действия в וּנְתַתִּיךְ דַּם
  choice: предам тебя кровавой расправе
  alternative: сделаю тебя кровью / предам тебя крови
  rationale: Выражает активное судебное действие Бога и кровавый исход, но не устраняет отмеченную в примечании смысловую сжатость древнееврейского текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой судебной речи. Женский род сохранён ради аллегории Иерусалима. Выражение «по закону о» делает юридический смысл מִשְׁפְּטֵי понятным, а примечание к «крови» сохраняет подлинную неоднозначность сжатой древнееврейской конструкции.
