lexical_decisions:
- source_word: וָאֶתֵּן
  choice: И Я надел тебе
  rationale: נתן буквально означает «дать, положить, поместить»; в контексте украшения естественное русское «надел тебе» передаёт конкретное действие и сохраняет переход к следующему этапу повествования.
- source_word: נֶזֶם עַל אַפֵּךְ
  choice: кольцо в нос
  rationale: נֶזֶם обозначает кольцевое украшение, нередко носовое; упоминание אַף («нос») однозначно указывает здесь на кольцо для носа. Русское «в нос» идиоматичнее буквального «на нос».
- source_word: וַעֲגִילִים עַל אָזְנָיִךְ
  choice: серьги на уши
  rationale: עֲגִילִים — ушные украшения, поэтому современный ясный эквивалент — «серьги». Оборот «на уши» сохраняет образ размещения украшений и параллелизм стиха.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: и великолепный венец
  rationale: עֲטֶרֶת означает «венец, корона», а תִּפְאֶרֶת — «красота, великолепие, слава». «Великолепный венец» естественно передаёт определительное значение сочетания, а «венец» соответствует возвышенному контексту.
- source_word: בְּרֹאשֵׁךְ
  choice: на голову
  rationale: Предлог בְּ в данном контексте обозначает положение украшения на голове; русское «на голову» естественно сочетается с глаголом «надел».
