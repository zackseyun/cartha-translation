  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֨ר אֲדֹנָ֤/י יְהוִה֙ לִ/יר֣וּשָׁלִַ֔ם מְכֹרֹתַ֨יִ/ךְ֙ וּ/מֹ֣לְדֹתַ֔יִ/ךְ מֵ/אֶ֖רֶץ הַֽ/כְּנַעֲנִ֑י אָבִ֥י/ךְ הָ/אֱמֹרִ֖י וְ/אִמֵּ֥/ךְ חִתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD to Jerusalem: Your origin and your birth are from the land of the Canaanite; your father was an Amorite, and your mother a Hittite.’'
translation:
  language: ru
  text: 'и скажи: «Так говорит Владыка Яхве Иерусалиму: твоё происхождение и твоё рождение — из земли хананеев[a]; твой отец — аморрей, а мать — хеттеянка».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Можно также перевести: «из земли Ханаана». Буквально в еврейском тексте: «из земли хананеянина»; единственное число сохраняет этническую характеристику.'
    reason: 'Лексический вариант: «из земли хананеев» естественно для русского языка передаёт этнический акцент, тогда как буквальное еврейское единственное число отмечено в сноске.'
lexical_decisions:
- source_word: וְאָמַרְתָּ ... כֹּה אָמַר
  choice: 'и скажи: «Так говорит'
  rationale: Императивная форма и формула пророческой речи переданы прямо и естественно для современного русского языка.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное Божье имя יהוה, избегая неестественного сочетания «Господь ГОСПОДЬ».
- source_word: לִירוּשָׁלִַם
  choice: Иерусалиму
  rationale: Предлог ל обозначает адресата речи; название города передано в принятой русской форме.
- source_word: מְכֹרֹתַיִךְ וּמוֹלְדֹתַיִךְ
  choice: по своим корням и рождению
  rationale: «Корни» естественно выражают источник и происхождение, а «рождение» сохраняет конкретный образ второго существительного. Конструкция по-русски ясно характеризует происхождение персонифицированного Иерусалима.
- source_word: מֵאֶרֶץ הַכְּנַעֲנִי
  choice: из земли ханаанея
  rationale: Сохранено буквальное этническое обозначение в единственном числе, которое подготавливает последующие упоминания аморрея и хеттеянки.
- source_word: אָבִיךְ הָאֱמֹרִי
  choice: твой отец — аморрей
  rationale: Безглагольное именное предложение естественно передано тире; этноним сохранён как часть резкой образной родословной.
- source_word: וְאִמֵּךְ חִתִּית
  choice: а мать — хеттеянка
  rationale: Женская форма этнонима передаёт חִתִּית и сохраняет параллелизм с упоминанием отца.
theological_decisions:
- issue: Образное происхождение Иерусалима
  choice: Родословная передана прямо, без поясняющего истолкования в основном тексте.
  alternative: Передать смысл как нравственное или духовное сходство Иерусалима с хананеями.
  rationale: Текст использует намеренно резкий образ происхождения и родства; перевод сохраняет его напряжение, не определяя прямо, является ли обвинение этническим, нравственным или одновременно образным.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה, причём Божье имя не заменяется титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным, но резкая метафорическая родословная и этнический акцент исходного текста сохранены.
