  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן הִשָּׁפֵ֤ךְ נְחֻשְׁתֵּ/ךְ֙ וַ/תִּגָּלֶ֣ה עֶרְוָתֵ֔/ךְ בְּ/תַזְנוּתַ֖יִ/ךְ עַל מְאַהֲבָ֑יִ/ךְ וְ/עַל֙ כָּל גִּלּוּלֵ֣י תוֹעֲבוֹתַ֔יִ/ךְ וְ/כִ/דְמֵ֣י בָנַ֔יִ/ךְ אֲשֶׁ֥ר נָתַ֖תְּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/036.yaml
  text: 'Thus says the Lord GOD: Because your bronze was poured out[a], and your nakedness was uncovered in your prostitutions with your lovers, and because of all the idols of your abominations, and because of the blood of your children whom you gave to them[c][b],'
translation:
  language: ru
  text: 'Так говорит Владыка Господь: «За то, что была излита твоя медь[a], обнажилась твоя нагота в твоих блудодеяниях с твоими любовниками, и за всех твоих мерзких идолов[b], и за кровь твоих детей, которых ты отдала им[c], —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоя медь». Возможно, это образ богатства, растраченного на любовников; другие понимают его шире — как образ бесстыдной похоти или полового обнажения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «идолы твоих мерзостей»; употреблённое здесь слово «идолы» имеет презрительный оттенок.'
    reason: lexical_alternative
  - marker: c
    text: То есть отдала идолам, принеся детей в жертву.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт сочетание титула אֲדֹנָי и имени יהוה без неестественного повтора «Господь Господь»; форма традиционна и понятна в современном литературном русском языке.
- source_word: נְחֻשְׁתֵּךְ
  choice: твоя медь
  rationale: Сохранено прямое значение существительного «медь, бронза», поскольку его метафорический смысл в данном контексте спорен; возможные толкования вынесены в примечание.
- source_word: הִשָּׁפֵךְ
  choice: была излита
  rationale: Сохраняет страдательное значение формы от שפך и исходный образ излияния.
- source_word: וַתִּגָּלֶה עֶרְוָתֵךְ
  choice: обнажилась твоя нагота
  rationale: Сохраняет телесный образ и оттенок позорного обнажения, не заменяя его более отвлечённым толкованием.
- source_word: בְּתַזְנוּתַיִךְ
  choice: когда ты предавалась блуду
  rationale: Естественно передаёт множественный и повторяющийся характер развратных действий, сохраняя пророческую метафору неверности.
- source_word: עַל מְאַהֲבָיִךְ
  choice: со своими любовниками
  rationale: В контексте блуда предлог עַל естественно передан как указание на участников связи.
- source_word: גִּלּוּלֵי תוֹעֲבוֹתַיִךְ
  choice: своими мерзкими идолами
  rationale: Передаёт презрительное обозначение идолов גִּלּוּלִים и оценочное תוֹעֵבָה ясным современным выражением.
- source_word: וְכִדְמֵי בָנַיִךְ
  choice: и за кровь твоих детей
  rationale: В цепи оснований для суда כ понято в причинном смысле; выражение указывает на вину за пролитую кровь детей.
- source_word: אֲשֶׁר נָתַתְּ לָהֶם
  choice: которых ты отдала им
  rationale: Относительное местоимение естественно соотнесено с детьми; глагол נתן сохранён как «отдала», без внесения слова «принесла в жертву» в основной текст.
theological_decisions:
- issue: Метафорический смысл נְחֻשְׁתֵּךְ
  choice: Сохранить в основном тексте буквальный образ «твоя медь».
  alternative: «твоё богатство», «твоя похоть» или более широкое указание на бесстыдное половое обнажение
  rationale: Прямое значение слова — «медь/бронза», тогда как точная функция образа остаётся спорной. Буквальная передача не устраняет намеренно многозначный и шокирующий образ.
- issue: Связь идолов с блудом
  choice: Передать любовников и идолов как тех, с кем Иерусалим предавался блуду.
  alternative: 'Понять второе עַל как отдельное основание суда: «и за всех мерзких идолов».'
  rationale: Повтор עַל допускает продолжение ряда участников метафорического блуда; такая синтаксическая связь естественна, но альтернативное причинное членение также возможно и не меняет общей вины за идолопоклонство.
- issue: Указание на жертвоприношение детей
  choice: Сохранить формулировку «детей, которых ты отдала им».
  alternative: «детей, которых ты принесла им в жертву»
  rationale: Контекст ясно подразумевает детские жертвоприношения идолам, однако еврейский текст употребляет общий глагол «дать». Пояснение вынесено в сноску, чтобы не усиливать основной текст сверх оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого регистра. Обращение ведётся к олицетворённому Иерусалиму в женском роде. Конечное тире сохраняет незавершённость причинной конструкции, продолжение которой следует в следующем стихе.
