  text: וַ/אֲחוֹתֵ֨/ךְ הַ/גְּדוֹלָ֤ה שֹֽׁמְרוֹן֙ הִ֣יא וּ/בְנוֹתֶ֔י/הָ הַ/יּוֹשֶׁ֖בֶת עַל שְׂמֹאולֵ֑/ךְ וַ/אֲחוֹתֵ֞/ךְ הַ/קְּטַנָּ֣ה מִמֵּ֗/ךְ הַ/יּוֹשֶׁ֨בֶת֙ מִֽ/ימִינֵ֔/ךְ סְדֹ֖ם וּ/בְנוֹתֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/046.yaml
  text: Your older sister is Samaria[a], she and her daughters, who dwell to your left; and your younger sister, who dwells to your right, is Sodom and her daughters.
translation:
  language: ru
  text: Твоя старшая сестра — Самария с её дочерьми, живущая слева от тебя; твоя младшая сестра, живущая справа от тебя, — Содом с его дочерьми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחוֹתֵךְ
  choice: твоя сестра
  rationale: Сохранён буквальный термин родства, метафорически обозначающий города и народы; он важен для семейной образности всей главы.
- source_word: הַגְּדוֹלָה
  choice: старшая
  rationale: Основное значение — «большая, великая», но в контексте отношений между сёстрами естественное русское соответствие — «старшая».
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Устоявшаяся русская форма географического названия.
- source_word: וּבְנוֹתֶיהָ
  choice: с её дочерьми
  rationale: «Дочери» буквально сохраняют олицетворение городов; в данном контексте имеются в виду зависимые от главного города поселения.
- source_word: הַיּוֹשֶׁבֶת
  choice: она живёт / живущая
  rationale: Причастие от ישׁב здесь означает постоянное местонахождение или проживание. Согласование в единственном числе следует грамматической форме еврейского текста, относящейся к сестре — Самарии или Содому.
- source_word: עַל שְׂמֹאולֵךְ
  choice: слева от тебя
  rationale: Передаёт телесно-пространственную ориентацию оригинала, не заменяя её истолкованием «к северу» в основном тексте.
- source_word: הַקְּטַנָּה מִמֵּךְ
  choice: твоя младшая сестра
  rationale: Буквально выражение связано с меньшей величиной и содержит сравнение «меньше тебя», но в семейной метафоре «младшая сестра» естественно передаёт сравнительный смысл без неуклюжего русского оборота.
- source_word: מִימִינֵךְ
  choice: справа от тебя
  rationale: Сохранено буквальное пространственное обозначение оригинала; географическое значение поясняется в сноске.
- source_word: סְדֹם
  choice: Содом
  rationale: Устоявшаяся русская форма географического названия.
theological_decisions:
- issue: Пространственные обозначения слева и справа относительно Иерусалима
  choice: Сохранить в основном тексте «слева» и «справа».
  alternative: Передать как «к северу» и «к югу».
  rationale: Еврейский текст использует ориентацию по сторонам тела, а не прямые названия сторон света. Буквенная образность сохранена, а географическое следствие вынесено в сноску.
- issue: Значение выражения הַקְּטַנָּה מִמֵּךְ
  choice: младшая сестра
  alternative: сестра, меньшая тебя / меньшая сестра
  rationale: Оригинал допускает оттенок меньшего размера или значения, однако рамка родства естественно поддерживает возрастное обозначение. Русское «младшая» сохраняет семейную метафору, не вводя дополнительной богословской оценки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Две части стиха разделены точкой для ясности длинной синтаксической конструкции. Олицетворение городов и метафора дочерей сохранены; местоимение «она» следует женскому образу «сестры», хотя название «Содом» в русском языке мужского рода.
