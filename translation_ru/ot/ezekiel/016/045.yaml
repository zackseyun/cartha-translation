base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/045.yaml
  text: You are the daughter of your mother[a], who loathed her husband and her children; and you are the sister of your sisters, who loathed their husbands and their children. Your mother was a Hittite, and your father an Amorite.
translation:
  language: ru
  text: Ты — дочь своей матери, которая гнушалась[a] своим мужем и своими детьми, и сестра своих сестёр, которые гнушались своими мужьями и своими детьми. Ваша мать[b] — хеттеянка, а ваш отец — аморей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «презирала», «питала отвращение к». Древнееврейский глагол выражает сильное отвращение или отвержение.'
    reason: lexical_alternative
  - marker: b
    text: 'В древнееврейском тексте в этой заключительной фразе стоят местоимения множественного числа: «ваша мать», «ваш отец», хотя прежде обращение идёт в единственном числе.'
    reason: grammatical_shift
lexical_decisions:
- source_word: בַּת אִמֵּךְ
  choice: дочь своей матери
  rationale: Сохранён образ родства и сходства с матерью; русское возвратное местоимение естественно передаёт обращение во втором лице.
- source_word: גֹּעֶלֶת / גָּעֲלוּ
  choice: гнушалась / гнушались
  rationale: Глагол געל выражает сильное отвращение и отвержение. «Гнушаться» сохраняет резкость обвинения и допускает как эмоциональный, так и поведенческий оттенок.
- source_word: אִישָׁהּ / אַנְשֵׁיהֶן
  choice: своим мужем / своими мужьями
  rationale: В семейно-брачном контексте אִישׁ с соответствующими суффиксами означает мужа, а не просто мужчину.
- source_word: וּבָנֶיהָ / וּבְנֵיהֶן
  choice: своими детьми
  rationale: בנים здесь обозначает потомство в семейном образе; «дети» не сужает смысл исключительно до сыновей.
- source_word: וַאֲחוֹת אֲחוֹתֵךְ
  choice: и сестра своих сестёр
  rationale: Намеренно сохранена усиленная формула родства и подобия, хотя по-русски она звучит несколько необычно.
- source_word: אִמְּכֶן חִתִּית וַאֲבִיכֶן אֱמֹרִי
  choice: Ваша мать — хеттеянка, а ваш отец — аморей
  rationale: Именные сказуемые переданы естественной русской конструкцией. Множественное число местоимений отражает переход древнееврейского текста от обращения к одной женщине к обращению к ней и её сёстрам.
theological_decisions:
- issue: Этническое происхождение матери и отца
  choice: Сохранить прямые наименования «хеттеянка» и «аморей» в рамках пророческого семейного образа.
  alternative: Понять слова как буквальное генеалогическое утверждение о происхождении жителей Иерусалима.
  rationale: Контекст Иезекииля 16 использует олицетворение Иерусалима и родственно-брачную метафорику. Перевод не устраняет буквальную форму обвинения, но и не добавляет историко-генеалогического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Тире подчёркивают обвинительные именные формулы; необычное выражение «сестра своих сестёр» оставлено ради образной структуры оригинала.
