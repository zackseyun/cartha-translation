  rationale: 'Устранены пунктуационная неясность и неточная глагольная передача пророческой формулы. Начальное «И было» и многоточие сохраняют намеренную синтаксическую незавершённость: конструкция получает продолжение в следующем стихе. Удвоенное «горе» и составное Божественное именование сохранены.'
