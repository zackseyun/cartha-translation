  text: וַ/יְהִ֕י אַחֲרֵ֖י כָּל רָעָתֵ֑/ךְ א֣וֹי א֣וֹי לָ֔/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/023.yaml
  text: And it came about[a], after all your wickedness—woe[b], woe to you! declares the Lord GOD—
translation:
  language: ru
  text: И было, после всего твоего зла, — горе, горе тебе! — таково слово Владыки Яхве…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Передаёт повествовательный переход, сохраняя незавершённость синтаксиса, поскольку фраза продолжается в следующем стихе.
- source_word: אַחֲרֵי כָּל רָעָתֵךְ
  choice: после всего твоего зла
  rationale: Сохраняет временное значение אַחֲרֵי, всеохватность כָּל и нравственный смысл רָעָה; обращение имеет форму женского рода.
- source_word: אוֹי אוֹי לָךְ
  choice: Горе, горе тебе!
  rationale: Дословно сохраняет удвоенный возглас, усиливающий плач и судебную угрозу.
- source_word: נְאֻם
  choice: возвещает
  rationale: Естественно передаёт устойчивую формулу пророческого изречения как авторитетное Божье объявление.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Различает титул אֲדֹנָי и личное имя יהוה, избегая неестественного сочетания «Господь Господь».
theological_decisions:
- issue: Передача составного Божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант прозрачно сохраняет и титул, и собственное имя, не смешивая их и не внося конфессионального толкования.
- issue: Связь стиха с последующим предложением
  choice: Сохранена синтаксическая незавершённость с конечным тире
  alternative: Оформить стих как законченное самостоятельное предложение
  rationale: וַיְהִי вводит конструкцию, продолжение которой следует далее; перевод не должен скрывать эту особенность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род обращения сохранён по еврейской форме и контексту олицетворённого Иерусалима. Удвоение «горе» оставлено без сглаживания.
