  text: וַ/תַּעְדִּ֞י זָהָ֣ב וָ/כֶ֗סֶף וּ/מַלְבּוּשֵׁ/ךְ֙ ששי וָ/מֶ֨שִׁי֙ וְ/רִקְמָ֔ה סֹ֧לֶת וּ/דְבַ֛שׁ וָ/שֶׁ֖מֶן אכלתי וַ/תִּ֨יפִי֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַֽ/תִּצְלְחִ֖י לִ/מְלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/013.yaml
  text: You adorned yourself with gold and silver[a], and your clothing was fine linen, silk, and embroidered cloth. You ate fine flour, honey, and oil[b], and you became exceedingly beautiful and prospered to royalty.
translation:
  language: ru
  text: Ты украшала себя золотом и серебром; твоя одежда была из тонкого льна, дорогой ткани[a] и вышитой ткани. Ты питалась отборной мукой, мёдом и маслом и стала необычайно красивой; ты преуспела, достигнув царского положения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное значение еврейского названия ткани неизвестно; традиционный перевод — «шёлк».
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «достигла царской власти», «стала царицей» или «преуспела и стала царством». Еврейское выражение допускает несколько оттенков возвышения до царского положения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּעְדִּי
  choice: Ты украшала себя
  rationale: Глагол עדה здесь означает украшение себя драгоценностями; возвратная конструкция естественна в русском и соответствует женскому образу Иерусалима.
- source_word: זָהָב וָכֶסֶף
  choice: золотом и серебром
  rationale: Прямое обозначение материалов украшений; творительный падеж естественно передаёт средство украшения.
- source_word: וּמַלְבּוּשֵׁךְ
  choice: одежда твоя была
  rationale: Собирательное единственное число передано естественной русской конструкцией, вводящей перечень тканей.
- source_word: ששי
  choice: тонкий лён
  rationale: שֵׁשׁ обозначает высококачественную льняную ткань, особенно в роскошном и культовом контексте.
- source_word: מֶשִׁי
  choice: роскошная ткань
  rationale: Точное отождествление материала не установлено; нейтральное обозначение сохраняет смысл дорогой ткани, не выдавая традиционное «шёлк» за несомненное.
- source_word: רִקְמָה
  choice: вышитое полотно
  rationale: Слово обозначает вышитую ткань или вышитую работу; «полотно» естественно продолжает перечень одежды.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Имеется в виду мука высшего качества; это значение яснее обычному читателю, чем более специальное «тонкая мука».
- source_word: דְבַשׁ
  choice: мёд
  rationale: Сохранено прямое значение пищевого продукта без ненужного уточнения его происхождения.
- source_word: שֶׁמֶן
  choice: масло
  rationale: Еврейский текст не уточняет вид масла; вероятное оливковое масло не внесено в основной текст.
- source_word: אכלתי
  choice: Ты питалась
  rationale: Форма Qal 2-го лица женского рода означает активное «ты ела»; «питалась» естественно объединяет перечисленные продукты.
- source_word: וַתִּיפִי בִּמְאֹד מְאֹד
  choice: стала необычайно красивой
  rationale: Передаёт становление красивой и сильное двойное усиление מְאֹד מְאֹד без тяжеловесного буквального повтора.
- source_word: וַתִּצְלְחִי לִמְלוּכָה
  choice: достигнув царского достоинства
  rationale: צלח выражает успешное продвижение, а מְלוּכָה допускает значения царского положения, царствования или царства; формулировка сохраняет женскую персонификацию и не сужает её до административного института.
theological_decisions:
- issue: Возвышение Иерусалима в брачно-царском образе
  choice: достигнув царского достоинства
  alternative: достигла царской власти; стала царицей; преуспела и стала царством
  rationale: Контекст изображает Иерусалим женщиной, возведённой к царскому положению. Выбранный вариант сохраняет как личный женский образ, так и более широкую политическую окраску, не навязывая единственного институционального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен широкому кругу читателей; женский род последовательно сохраняет персонификацию Иерусалима. Лексическая неопределённость מֶשִׁי и смысловая широта заключительной фразы отмечены сносками.
