  to: Ты украшала себя золотом и серебром; твоя одежда была из тонкого льна, дорогой ткани[a] и вышитой ткани. Ты питалась отборной мукой, мёдом и маслом и стала необычайно красивой; ты преуспела, достигнув царского положения[b].
  rationale: 'Исправлен финал, чтобы сохранить самостоятельное действие успешного возвышения и при этом оставить широкое «царское положение» для неоднозначного מְלוּכָה. «Вышитое полотно» заменено на более точное «вышитая ткань». «Отборная мука» ясно передаёт качество סֹלֶת в современном литературном русском. Сноски сохранены с теми же привязками: a относится к неопределённой ткани מֶשִׁי, b — к заключительному выражению.'
