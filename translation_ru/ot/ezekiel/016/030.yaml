    text: 'Или: «властной блудницы». Еврейское слово может обозначать дерзкое, властное или бесстыдно-самоуверенное поведение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲמֻלָה
  choice: Как изнемогло
  rationale: מָה вводит восклицание степени, а אֲמֻלָה передаёт слабость, изнеможение или увядание. Такой перевод сохраняет эмоциональную силу упрёка и не сводит образ к физической болезни.
- source_word: לִבָּתֵךְ
  choice: твоё сердце
  rationale: Сохраняется древнееврейский образ сердца как средоточия воли, чувств и внутреннего состояния человека.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם — устойчивая пророческая формула провозглашения; אֲדֹנָי передано как «Владыка», а личное имя יהוה — как «Яхве».
- source_word: בַּעֲשׂוֹתֵךְ אֶת כָּל אֵלֶּה
  choice: когда ты совершаешь всё это
  rationale: Инфинитив с ב естественно выражает сопутствующее или временное обстоятельство; русский оборот передаёт обвинительный ход фразы.
- source_word: מַעֲשֵׂה אִשָּׁה זוֹנָה
  choice: поступая как… блудница
  rationale: Буквально выражение означает «дела женщины-блудницы». Сравнительный оборот звучит естественно по-русски и ясно связывает характеристику с перечисленными поступками.
- source_word: שַׁלָּטֶת
  choice: наглая
  rationale: Слово характеризует дерзкое, самоуверенное и властное поведение. «Наглая» хорошо передаёт контекстуальную бесстыдную дерзость, а значение властности отмечено в сноске.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача личного имени как «Яхве» сохраняет различие между титулом אֲדֹנָי и именем יהוה и прямо отражает исходный текст.
- issue: Образ проституции как обвинение Иерусалима
  choice: блудница
  alternative: проститутка
  rationale: «Блудница» остаётся понятным современному читателю библейским словом и сохраняет нравственно-религиозную метафору без излишне бытового оттенка.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Восклицательная конструкция и образ сердца сохранены; тяжеловесное буквальное «дела женщины-блудницы» передано естественным оборотом без устранения резкости обвинения.
