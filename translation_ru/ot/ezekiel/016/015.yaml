base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/015.yaml
  text: But you trusted in your beauty[a], and you prostituted yourself because of your name, and you poured out your prostitutions on every passerby[b]; they became his.
translation:
  language: ru
  text: Но ты понадеялась на свою красоту, стала блудить, пользуясь своей славой[a], и излила свои блудодеяния на всякого прохожего — ему они и отдавались[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за своего имени»; еврейское слово «имя» здесь может означать славу, известность или репутацию.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительные слова в еврейском тексте предельно кратки: «ему да будет» или «ему было». Их грамматический референт не назван явно; они выражают, что предлагаемое ею отдавалось каждому прохожему.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַתִּבְטְחִי בְיָפְיֵךְ
  choice: ты понадеялась на свою красоту
  rationale: Глагол בטח с предлогом ב означает довериться или положиться на что-либо. Такая передача прямо выражает обличение в самонадеянности и сохраняет образ красоты.
- source_word: וַתִּזְנִי
  choice: стала блудить
  rationale: Глагол זנה содержит намеренно резкий образ проституции, которым пророк изображает неверность Иерусалима. «Блудить» естественно для библейско-пророческого регистра и не сводит метафору к отвлечённой «неверности».
- source_word: עַל שְׁמֵךְ
  choice: из-за своей славы
  rationale: Существительное שֵׁם буквально означает «имя», но в данном контексте указывает на известность, славу или репутацию, приобретённую Иерусалимом; смысловая передача делает причинную связь ясной. Буквальный вариант отмечен в сноске.
- source_word: וַתִּשְׁפְּכִי אֶת תַּזְנוּתַיִךְ
  choice: изливала свой блуд
  rationale: Сохранён конкретный и выразительный образ глагола שׁפך «изливать». Собирательное «блуд» по-русски естественнее буквального множественного «блудодеяния», не устраняя идеи повторяющегося поведения.
- source_word: עַל כָּל עוֹבֵר
  choice: на всякого прохожего
  rationale: Передача сохраняет предлог и нарочито шокирующий образ полной неразборчивости, присутствующий в еврейском тексте.
- source_word: לוֹ יֶהִי
  choice: ему он и доставался
  rationale: Краткая и синтаксически неоднозначная фраза буквально означает «ему пусть будет / ему было». Выбранный вариант связывает местоимение с «блудом» и передаёт отдачу себя каждому прохожему, а буквальная неопределённость отмечена в сноске.
theological_decisions:
- issue: Сексуальная метафора неверности Иерусалима завету
  choice: Сохранить в основном тексте прямую лексику блуда
  alternative: Смягчить до «стала неверна» или прямо истолковать как идолопоклонство
  rationale: Еврейский текст намеренно использует сексуально окрашенную пророческую метафору для идолопоклонства и политико-религиозной неверности. Перевод не подменяет сам образ его богословским толкованием.
- issue: Значение שֵׁם в выражении עַל שְׁמֵךְ
  choice: Передать контекстуальный смысл как «слава», указав буквальное «имя» в сноске
  alternative: Оставить в основном тексте буквальное «из-за своего имени»
  rationale: В контексте речь идёт о славе и известности Иерусалима; «из-за своего имени» в современном русском может быть понято неверно. Сноска сохраняет прозрачность формальной стороны оригинала.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и резкости пророческой речи. Синтаксис сделан естественным для русского языка, но конкретные образы доверия к красоте, изливания и блуда не смягчены. Все сноски обозначены в основном тексте.
