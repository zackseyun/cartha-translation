revisions:
- from: Ты брала своих сыновей и дочерей, которых родила Мне, и приносила их в жертву этим идолам, чтобы они пожирали их. Неужели твоего разврата было мало?
  to: Ты брала своих сыновей и дочерей, которых родила Мне, и приносила их им в жертву, как пищу. Неужели твоего блуда было мало?
  rationale: 'Исправлено только назначение жертвоприношения: дети принесены «как пища», а не описаны как объект действия персонифицированных идолов. «Им» оставлено в соответствии с местоименной формой оригинала и ближайшим контекстом. «Блуд» уточняет ключевой образ без изменения смысла.'
