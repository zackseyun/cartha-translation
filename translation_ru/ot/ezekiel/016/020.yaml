base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/020.yaml
  text: And you took your sons and your daughters, whom you had borne to me, and sacrificed them to them as food. Was your prostitution too small a thing?
translation:
  language: ru
  text: Ты брала своих сыновей и дочерей, которых родила Мне, и приносила их им в жертву, как пищу. Неужели твоего блуда было мало?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּזְבָּחִים
  choice: приносила их в жертву
  rationale: Глагол זבח прямо обозначает жертвоприношение; местоименный суффикс передан словом «их».
- source_word: לָהֶם
  choice: этим идолам
  rationale: Местоимение «им» относится к идолам из ближайшего контекста; явное существительное делает русскую фразу понятной без устранения референции.
- source_word: לֶאֱכוֹל
  choice: чтобы они пожирали их
  rationale: Буквально инфинитив означает «есть, пожирать». Такая передача сохраняет жестокий образ еды, не вводя менее образное «как пищу».
- source_word: תזנתך
  choice: твоего разврата
  rationale: זנות в пророческой метафоре обозначает блуд/проституцию как образ идолопоклонства; «разврат» естественно звучит по-русски и сохраняет нравственно-религиозную силу обвинения.
theological_decisions:
- issue: 'Принадлежность детей Богу: אֲשֶׁר יָלַדְתְּ לִי'
  choice: которых родила Мне
  alternative: которых ты родила от Меня
  rationale: Дательный לִי буквально означает «Мне» и подчеркивает принадлежность детей Богу; вариант «от Меня» мог бы чрезмерно конкретизировать образ как физическое отцовство.
- issue: Референт לָהֶם
  choice: этим идолам
  alternative: им
  rationale: Контекст указывает на идолов; экспликация предотвращает возможное ошибочное отнесение местоимения к детям, не привнося конфессионального толкования.
- issue: Риторический вопрос הַמְעַט מִתַּזְנוּתָךְ
  choice: Неужели твоего разврата было мало?
  alternative: Разве мало было твоего разврата?
  rationale: Сохранен упрек в форме вопроса и открытая риторическая напряженность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством и пророческой резкостью. Синтаксис близок к еврейскому оригиналу, но естественен для обычного читателя; заглавное «Мне» обозначает речь Бога.
