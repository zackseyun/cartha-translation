review_pass:
  verdict: revise
  source_fidelity: 'Начало стиха и выражение «которых родила Мне» точно передают еврейский текст. Однако «чтобы они пожирали их» меняет синтаксические отношения: оно делает идолов грамматическим субъектом действия и детей — объектом, тогда как לֶאֱכֹל здесь передает назначение жертвы как пищи («в пищу», «как пищу»), что подтверждает английский аудиторский текст.'
  naturalness: «Ты брала своих сыновей и дочерей…» и риторический вопрос звучат естественно в современном литературном русском. Оборот «приносила их им в жертву, как пищу» ясен, сохраняет пророческую резкость и не создает неестественной персонификации идолов.
  terminology: «Блуд» точнее передает זְנוּת в пророческой метафоре, чем более общее «разврат», сохраняя образный язык обвинения без конфессионального истолкования. Местоимение «им» сохраняет референциальную форму оригинала; контекст определяет его как ранее упомянутых идолов, но слово «этим идолам» не требуется для понимания.
  issues:
  - severity: medium
    issue: «чтобы они пожирали их»
    rationale: Передача вводит субъект «они» (идолы) и действие «пожирали», которых в данной форме еврейский текст не выражает. Инфинитив לֶאֱכֹל характеризует детей как жертвенную пищу; следует передать «как пищу» или «в пищу».
  - severity: low
    issue: «разврата» вместо «блуда»
    rationale: «Разврат» возможен, но расширяет значение. «Блуд» ближе к זְנוּת и к устойчивому пророческому образу неверности/идолопоклонства.
  revised_text: Ты брала своих сыновей и дочерей, которых родила Мне, и приносила их им в жертву, как пищу. Неужели твоего блуда было мало?
