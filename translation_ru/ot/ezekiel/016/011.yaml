base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/011.yaml
  text: I adorned you with jewelry[c][b][a], and I put bracelets on your hands and a necklace on your neck.
translation:
  language: ru
  text: Я украсил тебя украшениями[a], надел браслеты на твои руки[b], а ожерелье — на твою шею[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нарядил тебя убранством».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на твои руки»; браслеты обычно носили на запястьях или предплечьях.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «цепь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעְדֵּךְ עֶדִי
  choice: Я украсил тебя украшениями
  rationale: Глагол עדה означает «украшать», а עֶדִי — украшение или убранство. Повтор корня по-русски допустим и сохраняет выразительность еврейской конструкции, не сужая значение до одних драгоценностей.
- source_word: צְמִידִים
  choice: браслеты
  rationale: Существительное обозначает декоративные обручи или повязки, носимые на запястьях либо руках; «браслеты» — наиболее ясный современный эквивалент.
- source_word: עַל יָדַיִךְ
  choice: на твои руки
  rationale: יָד может означать кисть или руку шире. Сохранено прямое «руки», а обычное место ношения браслетов пояснено в сноске.
- source_word: רָבִיד
  choice: ожерелье
  rationale: Слово обозначает шейное украшение, вероятно цепь или ожерелье; «ожерелье» естественно в современном русском контексте.
- source_word: עַל גְּרוֹנֵךְ
  choice: на твою шею
  rationale: גָּרוֹן буквально значит «горло, шея». Для надеваемого украшения русское «на шею» естественно и точно передаёт образ.
theological_decisions:
- issue: Метафорическое изображение Иерусалима как женщины, которую украшает Бог
  choice: Сохранить конкретный образ украшения без истолковывающего расширения.
  alternative: Добавить в основной текст указание на заветное благословение или приготовление невесты.
  rationale: Стих входит в развёрнутую аллегорию, однако здесь сам текст называет только действия и украшения; богословское истолкование не следует вносить в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Женский род адресата сохранён по контексту аллегории. Конструкция «надел браслеты» выбрана вместо буквального «дал браслеты», поскольку естественно передаёт действие в русском языке; тире во второй части избегает ненужного повтора глагола.
