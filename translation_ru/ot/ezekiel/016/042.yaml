base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/042.yaml
  text: So I will satisfy my wrath against you[a], and my jealousy will turn away from you[b]; then I will be quiet and no longer be angry.
translation:
  language: ru
  text: Так Я утолю на тебе Свою ярость[a], и Моя ревность отступит от тебя[b]. Тогда Я утихну и больше не буду гневаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дам Моей ярости успокоиться на тебе». Смысл в том, что ярость исчерпается, когда суд совершится.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово קִנְאָה может означать также «рвение», но в брачном образе этой главы лучше подходит «ревность».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲנִחֹתִי
  choice: утолю
  rationale: Hiphil от נוח с «яростью» в роли дополнения означает дать ярости успокоиться, исчерпаться. «Утолю» естественно передаёт завершённость суда, не сводя выражение к буквальному, но неясному «дам покой».
- source_word: חֲמָתִי
  choice: Свою ярость
  rationale: חֵמָה обозначает пылающий гнев, ярость. «Ярость» сохраняет силу исходного слова и в данном контексте звучит естественнее, чем более отвлечённый «гнев».
- source_word: בָּךְ
  choice: на тебе
  rationale: Предлог ב здесь указывает на того, на ком ярость получает своё завершение в наказании. «На тебе» сохраняет образ исходного выражения и его судебную направленность.
- source_word: וְסָרָה
  choice: отступит
  rationale: סור означает удалиться, отойти или отступить. Этот выбор естественно сочетается с «от тебя» и сохраняет образ прекращения ревности.
- source_word: קִנְאָתִי
  choice: Моя ревность
  rationale: קִנְאָה может означать ревность или рвение. В брачно-заветном образе главы «ревность» точнее сохраняет непосредственный смысл и эмоциональную напряжённость.
- source_word: וְשָׁקַטְתִּי
  choice: Я успокоюсь
  rationale: שקט описывает наступление покоя и тишины после смятения или действия. «Успокоюсь» ясно передаёт прекращение гнева и ревности.
- source_word: וְלֹא אֶכְעַס עוֹד
  choice: и больше не буду гневаться
  rationale: 'Прямой и естественный перевод: כעס означает гневаться, сердиться или быть раздражённым, а עוֹד в отрицательной конструкции — «больше не».'
theological_decisions:
- issue: Божественная ярость и ревность в контексте завета и суда
  choice: Сохранить слова «ярость» и «ревность» как реальные характеристики Божьей реакции на неверность завету.
  alternative: Смягчить до «негодования» и передать קִנְאָה как «рвение».
  rationale: Глава последовательно использует образы супружеской измены и судебного воздаяния. «Ревность» сохраняет брачную метафору, а «ярость» — нравственную и судебную силу текста, не подразумевая неконтролируемой страсти.
- issue: Смысл прекращения ярости
  choice: «Утолю на тебе Свою ярость» — ярость исчерпывается в совершившемся суде.
  alternative: «Дам Моей ярости покой в тебе» — формально более буквально, но неестественно и двусмысленно по-русски.
  rationale: 'Исходное выражение сохраняет напряжённую мысль: покой наступает не вместо суда, а после того, как ярость получила завершение на адресате. Перевод не превращает это ни в простое эмоциональное успокоение, ни в отвлечённое умилостивление.'
translation_notes:
  register: Современный литературный русский язык; тон торжественный и прямой. Синтаксис остаётся доступным, а ключевые образы ярости, ревности и наступающего покоя сохранены без конфессионального истолкования.
