  rationale: Существительное может означать услышанное, молву или предмет разговоров. В сочетании «у тебя на устах» здесь уместен смысл известного, осуждаемого примера, о котором постоянно говорят; «как притча» естественно передаёт эту функцию, не исключая более буквального значения «предмет разговоров».
- source_word: בְּפִיךְ
  choice: у тебя на устах
  rationale: Естественный русский эквивалент буквального «в твоих устах», обозначающий предмет речи.
- source_word: בְּיוֹם
  choice: во дни
  rationale: В контексте состояния, продолжавшегося некоторое время, русское «во дни» естественно передаёт еврейскую временную формулу и сохраняет достоинство регистра.
- source_word: גְּאוֹנָיִךְ
  choice: твоей гордости
  rationale: גאון обозначает здесь высокомерное самовозвышение; «гордость» кратко и ясно передаёт отрицательный смысл в контексте.
