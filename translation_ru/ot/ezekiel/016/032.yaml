base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/032.yaml
  text: The adulterous wife takes strangers instead of her husband[a].
translation:
  language: ru
  text: Прелюбодейная жена берёт чужих мужчин вместо своего мужа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Жена, совершающая прелюбодеяние, берёт посторонних вместо своего мужа».'
    reason: 'Лексическая альтернатива: определительное причастие можно передать описательным оборотом, а זָרִים — как «посторонние».'
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: жена
  rationale: Хотя существительное может означать и «женщина», и «жена», выражение «вместо своего мужа» ясно указывает на брачные отношения.
- source_word: הַמְּנָאָפֶת
  choice: прелюбодейная
  rationale: Причастие характеризует женщину как совершающую прелюбодеяние; прилагательное сохраняет краткость и определительную функцию исходной формы.
- source_word: תַּחַת
  choice: вместо
  rationale: Предлог здесь выражает замещение, а не пространственное положение.
- source_word: אִישָׁהּ
  choice: своего мужа
  rationale: В брачном контексте אִישׁ с суффиксом естественно означает «её муж»; русское возвратное притяжательное местоимение однозначно соотносит мужа с подлежащим.
- source_word: תִּקַּח
  choice: принимает
  rationale: לקח буквально означает «брать», но в данном контексте русское «принимает мужчин» естественнее передаёт вступление в связь, не добавляя мотива или подробностей.
- source_word: אֶת
  choice: '[показатель прямого дополнения отдельно не переводится]'
  rationale: Служебная частица отмечает определённое прямое дополнение и не требует отдельного соответствия в русском.
- source_word: זָרִים
  choice: чужих мужчин
  rationale: זָרִים обозначает посторонних, не принадлежащих к брачной связи; добавление «мужчин» делает подразумеваемый объект ясным и не сужает значение до этнических «чужеземцев».
theological_decisions:
- issue: Метафорическое изображение неверности Иерусалима посредством супружеской измены
  choice: Прямо сохранить образ прелюбодейной жены, принимающей чужих мужчин вместо мужа.
  alternative: Передать образ отвлечённо как духовную или заветную неверность Иерусалима.
  rationale: Стих является частью развёрнутой брачной метафоры; прямой перевод сохраняет резкость обвинения и не подменяет сам образ его богословским истолкованием.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и обличительная, в соответствии с пророческим контекстом. Сексуальная и брачная образность сохранена без эвфемизации и без архаизма «прелюбодейка».
