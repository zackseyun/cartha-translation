  text: וְ/זָכַרְתִּ֨י אֲנִ֧י אֶת בְּרִיתִ֛/י אוֹתָ֖/ךְ בִּ/ימֵ֣י נְעוּרָ֑יִ/ךְ וַ/הֲקִמוֹתִ֥י לָ֖/ךְ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/060.yaml
  text: But I myself will remember my covenant with you in the days of your youth[b][a], and I will establish for you an everlasting covenant.
translation:
  language: ru
  text: Но Я сам вспомню Мой завет с тобой во дни твоей юности[b] и установлю для тебя вечный завет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непреходящий завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Мой завет с тобой во дни твоей юности». Эти слова напоминают о прежних отношениях завета, не уточняя здесь, о каком именно его устроении идёт речь.'
    reason: cross_reference
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Но ... вспомню
  rationale: В данном контексте форма обозначает будущее действие, а союз вводит благодатный поворот после слов о суде и стыде, поэтому передан противительным «но».
- source_word: אֲנִי
  choice: Я сам
  rationale: Самостоятельное местоимение усиливает уже выраженное глагольной формой первое лицо; «Я сам» естественно сохраняет это подчёркивание.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: Сохраняет обычное значение בְּרִית и явно передаёт притяжательный суффикс.
- source_word: אֶת ... אוֹתָךְ
  choice: с тобой
  rationale: В сочетании «вспомнить Мой завет» конструкция выражает участника заветных отношений; по-русски естественно «завет с тобой».
- source_word: בִּימֵי נְעוּרַיִךְ
  choice: во дни твоей юности
  rationale: Сохраняет образную временную формулу еврейского текста и её связь с изложенной ранее историей Иерусалима.
- source_word: וַהֲקִמוֹתִי
  choice: и установлю
  rationale: Порода hифиль глагола קום в сочетании с «заветом» может означать установление или утверждение; «установлю» ясно и естественно передаёт действие, не устраняя возможного оттенка подтверждения.
- source_word: לָךְ
  choice: для тебя
  rationale: Сохраняет дательный смысл предлога «для/тебе», не заменяя его более привычным, но менее точным «с тобой».
- source_word: בְּרִית עוֹלָם
  choice: вечный завет
  rationale: Устоявшееся и современное русское выражение, передающее длительную, непреходящую силу завета.
theological_decisions:
- issue: Какой именно завет имеется в виду в контексте восстановления
  choice: Сохранить формулировки «Мой завет» и «вечный завет», не отождествляя их с конкретной системой заветов
  alternative: Прямо определить первый как Моисеев завет или второй как новый завет
  rationale: Сам стих вспоминает завет с Иерусалимом во дни его юности и обещает установить вечный завет, но не даёт здесь более узкого богословского определения; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «Мой завет» после глагола не требуется; прописная буква в «Я» подчёркивает речь Бога согласно русской издательской традиции. Все маркеры сносок помещены непосредственно после соответствующих выражений.
