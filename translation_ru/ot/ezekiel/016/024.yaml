  text: Ты построила себе возвышение[a] и устроила себе возвышенное место на каждой площади.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сводчатое помещение», «помост»; возможно, речь идёт о сооружении, связанном с проституцией. Значение редкого еврейского слова неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּב
  choice: возвышение
  rationale: Редкое и не вполне ясное существительное обозначает, по-видимому, возведённое сооружение или приподнятое место. «Возвышение» сохраняет конкретный пространственный образ, не уточняя без достаточных оснований его архитектурную или сексуальную функцию.
- source_word: רָמָה
  choice: высота
  rationale: Слово может обозначать возвышенное, вероятно культовое место. «Высота» сохраняет отличие от редкого גֶּב и позволяет контексту главы передать культовый смысл, не добавляя слова «святилище».
- source_word: רְחוֹב
  choice: площадь
  rationale: В городской среде слово обычно обозначает открытое общественное пространство; «площадь» естественно передаёт публичность и заметность описанных сооружений.
- source_word: וַתִּבְנִי לָךְ
  choice: Ты построила себе
  rationale: Женский род обращения и значение действия в собственных интересах переданы прямо и естественно.
- source_word: וַתַּעֲשִׂי לָךְ
  choice: устроила себе
  rationale: «Устроила» по-русски естественно сочетается с «высотой», сохраняет значение עשה и повтор benefactive לָךְ.
- source_word: בְּכָל
  choice: на каждой
  rationale: 'Передаёт распределительное значение: такие места находились по всему городу, на каждой площади.'
theological_decisions:
- issue: Следует ли прямо обозначить сооружения как места проституции или идолопоклонства
  choice: Сохранить в основном тексте конкретные, но нейтральные архитектурно-пространственные слова «возвышение» и «высота».
  alternative: «Дом разврата», «блудилище» или «святилище для проституции».
  rationale: Контекст Иезекииля 16 связывает эти сооружения с метафорой проституции и неверностью в поклонении, однако сам стих употребляет названия сооружений, причём גֶּב лексически неясно. Явно сексуализированная передача преждевременно разрешила бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык; сохранены женский род обращения, двукратное «себе» и параллелизм двух частей. Термины намеренно не сведены к одному слову, чтобы отразить два разных еврейских существительных.
