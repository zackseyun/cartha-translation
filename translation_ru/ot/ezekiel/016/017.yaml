source:
  edition: WLC
  text: וַ/תִּקְחִ֞י כְּלֵ֣י תִפְאַרְתֵּ֗/ךְ מִ/זְּהָבִ֤/י וּ/מִ/כַּסְפִּ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וַ/תַּעֲשִׂי לָ֖/ךְ צַלְמֵ֣י זָכָ֑ר וַ/תִּזְנִי בָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/017.yaml
  text: You took your beautiful jewels from my gold and my silver[a], which I had given to you, and made for yourself male images[c][b], and you prostituted yourself with them.
translation:
  language: ru
  text: Ты взяла свои великолепные украшения, сделанные из Моего золота и Моего серебра[a], которые Я дал тебе, и сделала себе мужские изображения[b], и блудодействовала с ними[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои великолепные изделия». Еврейское выражение может обозначать различные красивые или роскошные предметы; здесь, вероятно, имеются в виду украшения из драгоценных металлов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изображения мужчин»; по контексту — мужские идолы.'
    reason: alternative_reading
  - marker: c
    text: 'Слово «блудодействовала» сохраняет повторяющийся у пророков образ: идолопоклонство представлено как супружеская и заветная неверность Господу.'
    reason: cultural_note
lexical_decisions:
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: свои великолепные украшения
  rationale: כְּלִי обозначает предмет или изделие, а תִפְאֶרֶת — красоту и великолепие. В контексте золота, серебра и убранства естественное русское «великолепные украшения» передаёт и предметный, и декоративный смысл, не сужая выражение до драгоценных камней.
- source_word: מִזְּהָבִי וּמִכַּסְפִּי
  choice: из Моего золота и Моего серебра
  rationale: 'Предлог מִן указывает на материал, из которого были сделаны украшения. Повтор притяжательного местоимения сохраняет обвинительный акцент оригинала: золото и серебро исходили от Господа.'
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: которые Я дал тебе
  rationale: Относительное местоимение грамматически может относиться к золоту и серебру как к паре существительных мужского рода; простой прошедший естественен по-русски и ясно указывает, что эти дары прежде дал Господь.
- source_word: וַתַּעֲשִׂי לָךְ
  choice: и сделала себе
  rationale: Дательный לָךְ имеет возвратно-бенефактивный смысл; «сделала себе» сохраняет направленность действия на собственные запретные цели Иерусалима.
- source_word: צַלְמֵי זָכָר
  choice: мужские изображения
  rationale: צֶלֶם означает изображение или изваяние, а זָכָר прямо обозначает мужской пол. Формулировка сохраняет намеренно резкую сексуализированную образность и не подменяет слово «изображения» толкованием «идолы».
- source_word: וַתִּזְנִי בָם
  choice: и блудодействовала с ними
  rationale: Глагол זנה в пророческой речи сохраняет сексуальный образ, выражающий идолопоклонство и нарушение завета. «Блудодействовала» — достаточно сильное, но литературное и понятное слово; «с ними» передаёт בָם.
theological_decisions:
- issue: Пророческая сексуальная метафора идолопоклонства
  choice: Сохранить прямую формулировку «блудодействовала с ними».
  alternative: «изменила Мне с ними» или «поклонялась им как идолам»
  rationale: Иезекииль намеренно изображает нарушение завета через резкую сексуальную метафору. Её смягчение до общей неверности или явная замена на «идолопоклонство» устранили бы риторическое напряжение еврейского текста.
- issue: Характер צַלְמֵי זָכָר
  choice: Передать как «мужские изображения».
  alternative: «мужские идолы» или «изображения мужчин»
  rationale: Контекст указывает на идолопоклонство, однако само צֶלֶם означает «изображение». Основной текст сохраняет лексическую точность и двусмысленное сочетание культовой и сексуальной образности; возможные уточнения вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой интонации и прямого обращения к Иерусалиму в женском роде. Прописные формы «Моего» и «Я» обозначают речь Господа. Сексуальная метафора не смягчена, но передана литературным, не архаическим оборотом.
