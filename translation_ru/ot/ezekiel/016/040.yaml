  text: וְ/הֶעֱל֤וּ עָלַ֨יִ/ךְ֙ קָהָ֔ל וְ/רָגְמ֥וּ אוֹתָ֖/ךְ בָּ/אָ֑בֶן וּ/בִתְּק֖וּ/ךְ בְּ/חַרְבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/040.yaml
  text: They will bring up an assembly against you[b][a], and they will stone you and cut you down with their swords.
translation:
  language: ru
  text: И созовут против тебя собрание[a], и побьют тебя камнями, и изрубят тебя своими мечами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выведут против тебя собрание».'
    reason: Еврейский каузативный глагол может передавать выведение или поднятие собравшейся группы против адресата; «созовут» идиоматично выражает этот смысл по-русски.
  - marker: b
    text: 'Или: «рассекут тебя своими мечами».'
    reason: Глагол обозначает сильное, насильственное разрубание или рассечение.
lexical_decisions:
- source_word: וְהֶעֱלוּ עָלַיִךְ קָהָל
  choice: соберут против тебя общину
  rationale: Сочетание каузативной формы עלה с עַל и объектом קָהָל обозначает созыв или выведение собравшейся группы против адресата. «Соберут против тебя общину» естественно передаёт враждебную направленность, не сводя сцену только к суду или только к военному нападению.
- source_word: וְרָגְמוּ אוֹתָךְ בָּאָבֶן
  choice: побьют тебя камнями
  rationale: Глагол רגם обозначает побивание камнями; единственное число אֶבֶן в этой конструкции имеет собирательно-инструментальное значение, которое по-русски естественно передаётся множественным числом «камнями».
- source_word: וּבִתְּקוּךְ
  choice: изрубят тебя
  rationale: בתק выражает насильственное рассечение или разрубание. «Изрубят» сохраняет интенсивность действия и сочетается с орудием «мечами», не добавляя прямо отсутствующего в тексте уточнения «на куски».
- source_word: בְּחַרְבוֹתָם
  choice: своими мечами
  rationale: Предлог בְּ обозначает орудие действия, а притяжательный суффикс относится к действующему множественному субъекту; русское возвратное притяжательное «своими» передаёт это естественно.
theological_decisions:
- issue: Характер наказания
  choice: Сохранить одновременно черты публичной казни и военного насилия над Иерусалимом, олицетворённым женщиной.
  alternative: Истолковать сцену исключительно как судебную казнь либо исключительно как военный штурм.
  rationale: Собрание общины и побивание камнями вызывают судебно-общинные ассоциации, тогда как мечи также принадлежат языку военного насилия. Перевод не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Община» сохраняет формальный смысл קָהָל как собранной группы и контекст публичного наказания; слово не следует понимать здесь как обозначение церковной общины. Синтаксический параллелизм трёх действий сохранён.
