source:
  edition: WLC
  text: לְ/כָל זֹנ֖וֹת יִתְּנוּ נֵ֑דֶה וְ/אַ֨תְּ נָתַ֤תְּ אֶת נְדָנַ֨יִ/ךְ֙ לְ/כָל מְאַֽהֲבַ֔יִ/ךְ וַ/תִּשְׁחֳדִ֣י אוֹתָ֗/ם לָ/ב֥וֹא אֵלַ֛יִ/ךְ מִ/סָּבִ֖יב בְּ/תַזְנוּתָֽיִ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/033.yaml
  text: Men give a prostitute her payment, but you gave your gifts to all your lovers, and you bribed them to come to you from all around for your prostitutions.
translation:
  language: ru
  text: Всем блудницам дают плату, а ты сама давала подарки всем своим любовникам и подкупала их, чтобы они со всех сторон приходили к тебе ради блуда с тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹנוֹת
  choice: блудницам
  rationale: Передаёт прямое обозначение женщин, занимающихся проституцией, и сохраняет возвышенно-пророческий регистр.
- source_word: נֵדֶה
  choice: плату
  rationale: В данном противопоставлении обозначает вознаграждение, обычно даваемое блуднице.
- source_word: נְדָנַיִךְ
  choice: подарки
  rationale: Форма означает дары; выбран естественный русский эквивалент, отличающий их от обычной платы в первой части стиха.
- source_word: מְאַהֲבַיִךְ
  choice: любовникам
  rationale: Сохраняет метафору неверной женщины и её партнёров.
- source_word: וַתִּשְׁחֳדִי
  choice: и подкупала
  rationale: 'Точно передаёт необычный перевёрнутый образ: она сама даёт взятку партнёрам, чтобы привлечь их.'
- source_word: בְּתַזְנוּתָיִךְ
  choice: ради блуда с тобой
  rationale: Множественное абстрактное существительное указывает на её блудные действия; по-русски оборот естественно выражает цель их прихода и её участие.
theological_decisions:
- issue: Метафора духовной неверности Иерусалима
  choice: Сохранить прямую лексику блуда и любовников
  alternative: Сразу истолковать как идолопоклонство или политические союзы
  rationale: Сам стих выражен через развёрнутую метафору; толкование не следует подставлять вместо её образного языка.
- issue: Субъект первой части יִתְּנוּ
  choice: Безлично-обобщённое «дают»
  alternative: «Мужчины дают»
  rationale: В еврейском тексте субъект явно не назван; русская безлично-обобщённая конструкция сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Противопоставление подчёркнуто словами «а ты сама»; формулировка остаётся ясной и резкой, не смягчая исходный образ.
