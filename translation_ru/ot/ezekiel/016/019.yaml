  text: וְ/לַחְמִ/י֩ אֲשֶׁר נָתַ֨תִּי לָ֜/ךְ סֹ֣לֶת וָ/שֶׁ֤מֶן וּ/דְבַשׁ֙ הֶֽאֱכַלְתִּ֔י/ךְ וּ/נְתַתִּ֧י/הוּ לִ/פְנֵי/הֶ֛ם לְ/רֵ֥יחַ נִיחֹ֖חַ וַ/יֶּ֑הִי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/019.yaml
  text: And my bread that I gave you—fine flour[a], oil, and honey with which I fed you—you set before them as a pleasing aroma, and so it was[c][b], declares the Lord GOD.
translation:
  language: ru
  text: И Мой хлеб[a], который Я дал тебе, — отборную муку, масло и мёд, которыми Я кормил тебя, — ты положила его перед ними как приятное благоухание[b]. Так и было, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «Мою пищу»: еврейское слово «хлеб» может обозначать пищу вообще.'
    reason: lexical_alternative
  - marker: b
    text: «Приятное благоухание» — традиционное выражение из языка жертвоприношений; здесь оно с горькой иронией относится к дарам, положенным перед идолами.
    reason: cultural_note
lexical_decisions:
- source_word: לַחְמִי
  choice: Мой хлеб
  rationale: Сохраняет конкретный образ еврейского לֶחֶם; возможное более широкое значение «пища» отмечено в сноске.
- source_word: סֹלֶת
  choice: отборную муку
  rationale: Передаёт муку высокого качества и сохраняет связь с языком приношений; выражение естественно для современного русского текста.
- source_word: שֶׁמֶן
  choice: масло
  rationale: В еврейском тексте прямо сказано «масло»; уточнение «оливковое» было бы контекстуально вероятным, но добавленным.
- source_word: דְבַשׁ
  choice: мёд
  rationale: Обычное значение слова; возможное обозначение сладкого сиропа здесь не конкретизируется.
- source_word: הֶאֱכַלְתִּיךְ
  choice: которыми Я кормил тебя
  rationale: Естественно передаёт каузативное «Я давал тебе есть» и связывает Божье кормление с перечисленными дарами.
- source_word: וּנְתַתִּיהוּ לִפְנֵיהֶם
  choice: ты положила перед ними
  rationale: Сохраняет обращение к олицетворённому Иерусалиму в женском роде и не раскрывает местоимение «ними» сверх еврейского текста.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: как приятное благоухание
  rationale: Сохраняет устойчивую жертвенную лексику и её горькую иронию в контексте идолопоклонства.
- source_word: וַיֶּהִי
  choice: Так и было
  rationale: Передаёт краткое подтверждение истинности обвинения, не уточняя его смысл сверх текста.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: Передаёт пророческую формулу נְאֻם, различает титул אֲדֹנָי и личное имя יהוה и избегает неестественного сочетания одинаковых титулов.
theological_decisions:
- issue: Передача имени יהוה в формуле אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Транслитерация сохраняет личное имя в исходном тексте, а «Владыка» отличает предшествующий титул אֲדֹנָי; перевод не сводит два разных наименования к общим титулам.
- issue: Жертвенная формула в описании идолопоклонства
  choice: как приятное благоухание
  alternative: как благоуханную жертву
  rationale: Выбранный вариант сохраняет образ и культовую формулу, не добавляя отсутствующего в стихе слова «жертва»; ироническое применение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род («положила») сохраняет обращение к олицетворённому Иерусалиму. Тире разграничивают главное обвинение и поясняющее перечисление даров.
