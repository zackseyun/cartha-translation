  yaml_path: translation/ot/ezekiel/016/055.yaml
  text: And your sisters[a], Sodom and her daughters, will return to their former state, and Samaria and her daughters will return to their former state, and you and your daughters will return to your former state.
translation:
  language: ru
  text: И сёстры твои, Содом и её дочери, вернутся в прежнее состояние; и Самария и её дочери вернутся в прежнее состояние; и ты и твои дочери вернётесь в прежнее состояние.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут восстановлены до прежнего состояния». Буквальнее: «вернутся в прежнее состояние».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחוֹתַיִךְ
  choice: сёстры твои
  rationale: 'Сохранён буквальный родственный образ: в Иезекииля 16 города олицетворены как сёстры.'
- source_word: סְדֹם
  choice: Содом
  rationale: Традиционная русская форма географического названия.
- source_word: בְנוֹתֶיהָ / בְנוֹתַיִךְ
  choice: её дочери / твои дочери
  rationale: Сохранена метафора еврейского текста; речь может идти о зависимых городах или общинах, но поясняющая замена сузила бы образ.
- source_word: תָּשֹׁבְנָה / תְּשֻׁבֶינָה
  choice: вернутся / вернётесь
  rationale: Передан основной смысл глагола שוב и сохранён его трёхкратный повтор, не подменённый более толковательным «будут восстановлены».
- source_word: לְקַדְמָתָן / לְקַדְמַתְכֶן
  choice: в прежнее состояние
  rationale: Естественно по-русски передаёт возвращение к прежнему положению или состоянию, не уточняя его характера.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Традиционная русская форма географического названия.
- source_word: וְ
  choice: и
  rationale: Простое сочинение сохраняет параллельное построение трёх еврейских предложений, не добавляя временного оттенка.
theological_decisions:
- issue: Характер обещанной перемены для Содома, Самарии и Иерусалима
  choice: Возвращение в прежнее состояние без уточнения механизма и богословских последствий
  alternative: «Будут восстановлены в прежнем состоянии»
  rationale: Еврейский текст говорит о возвращении; перевод сохраняет неоднозначность и не разрешает спорный вопрос о природе восстановления Содома.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого параллелизма. Порядок «сёстры твои» поддерживает возвышенный регистр и прямое обращение к олицетворённому Иерусалиму; формы женского рода соответствуют этому олицетворению.
