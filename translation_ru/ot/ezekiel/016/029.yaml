source:
  edition: WLC
  text: וַ/תַּרְבִּ֧י אֶת תַּזְנוּתֵ֛/ךְ אֶל אֶ֥רֶץ כְּנַ֖עַן כַּשְׂדִּ֑ימָ/ה וְ/גַם בְּ/זֹ֖את לֹ֥א שָׂבָֽעַתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/029.yaml
  text: You multiplied your prostitution to the land of Canaan[a], to Chaldea; yet even with this you were not satisfied.
translation:
  language: ru
  text: Ты умножила свой блуд до земли Ханаанской[a], до Халдеи, но даже этим не насытилась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «к земле Ханаанской, к халдеям» или «к земле Ханаанской — Халдее». Еврейская фраза сжата и неоднозначна: она может образно отождествлять Ханаан с Халдеей (Вавилонией) либо описывать распространение блуда от Ханаана вплоть до Халдеи.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּרְבִּי
  choice: Ты умножила
  rationale: Хифиль глагола רבה передаёт увеличение и усиление действия; «умножила» сохраняет прямоту и риторическую силу текста.
- source_word: תַּזְנוּתֵךְ
  choice: свой блуд
  rationale: Существительное от זנה обозначает проституцию как пророческий образ идолопоклонства и неверности; «блуд» сохраняет явную сексуальную метафору и уместен в возвышенной современной библейской речи.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: к земле Ханаанской
  rationale: Предлог אֶל передаёт направленность, а אֶרֶץ сохранено словом «земля». Такая формулировка не устраняет сжатость и неоднозначность еврейского синтаксиса.
- source_word: כַּשְׂדִּימָה
  choice: до Халдеи
  rationale: Направительный суффикс выражает движение или распространение в сторону Халдеи. «До Халдеи» естественно передаёт возможный смысл протяжённости, тогда как иные синтаксические связи отмечены в сноске.
- source_word: וְגַם בְּזֹאת
  choice: но и этим
  rationale: 'В контексте сочетание имеет усилительно-уступительный смысл: даже дальнейшее расширение блуда не принесло насыщения.'
- source_word: לֹא שָׂבָעַתְּ
  choice: не насытилась
  rationale: Глагол שבע буквально означает достижение сытости или насыщения; «не насытилась» сохраняет образ ненасытного желания сильнее, чем более отвлечённое «не была удовлетворена».
theological_decisions:
- issue: Пророческая сексуальная метафора заветной неверности
  choice: Сохранить явный образ словом «блуд»
  alternative: «неверность» или «разврат»
  rationale: Иезекииль намеренно использует резкий сексуальный образ для идолопоклонства и политико-религиозной неверности Иерусалима; обобщение до «неверности» ослабило бы риторику и преждевременно истолковало метафору.
- issue: Неоднозначная связь Ханаана и Халдеи
  choice: Передать как распространение «к земле Ханаанской… до Халдеи» и сохранить варианты в сноске
  alternative: Отождествить землю Ханаанскую с Халдеей или отнести выражение к халдеям
  rationale: Сжатый еврейский синтаксис допускает несколько связей между אֶרֶץ כְּנַעַן и כַּשְׂדִּימָה; основной текст не должен догматически устранять эту реальную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Женский род обращения сохранён по еврейской форме и контексту олицетворённого Иерусалима. Резкая метафора не смягчена; синтаксическая неоднозначность географической фразы вынесена в сноску.
