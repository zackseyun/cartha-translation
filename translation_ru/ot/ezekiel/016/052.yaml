source:
  edition: WLC
  text: גַּם אַ֣תְּ שְׂאִ֣י כְלִמָּתֵ֗/ךְ אֲשֶׁ֤ר פִּלַּלְתְּ֙ לַֽ/אֲחוֹתֵ֔/ךְ בְּ/חַטֹּאתַ֛יִ/ךְ אֲשֶׁר הִתְעַ֥בְתְּ מֵ/הֵ֖ן תִּצְדַּ֣קְנָה מִמֵּ֑/ךְ וְ/גַם אַ֥תְּ בּ֨וֹשִׁי֙ וּ/שְׂאִ֣י כְלִמָּתֵ֔/ךְ בְּ/צַדֶּקְתֵּ֖/ךְ אַחְיוֹתֵֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/052.yaml
  text: You also[a], bear your disgrace, because you pronounced judgment in favor of your sisters. By your sins in which you acted more abominably than they, they have become more righteous than you. So you too, be ashamed and bear your disgrace[b], because you made your sisters appear righteous.
translation:
  language: ru
  text: 'И ты[a] неси свой позор, ибо высказалась в пользу своих сестёр: своими грехами, в которых ты поступала отвратительнее, чем они, ты сделала так, что они оказались праведнее тебя[b]. И ты стыдись и неси свой позор, ибо оправдала своих сестёр.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты рассудила в пользу своих сестёр»; возможно также: «ты ходатайствовала за своих сестёр». Здесь звучит ирония: своими грехами Иерусалим фактически оправдал сестёр по сравнению с собой.'
    reason: lexical_alternative
  - marker: b
    text: 'Смысл сравнительный: сёстры оказались праведнее Иерусалима, а не праведными в абсолютном смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאִי
  choice: неси
  rationale: Императив נשׂא в сочетании с כְּלִמָּה означает «нести, переносить позор»; «неси» сохраняет образ бремени и судебно-нравственную силу выражения.
- source_word: כְלִמָּתֵךְ
  choice: свой позор
  rationale: כְּלִמָּה обозначает позор, бесчестье; «позор» передаёт внешний, публичный аспект, тогда как בּוֹשִׁי отдельно выражает переживание стыда.
- source_word: פִּלַּלְתְּ לַאֲחוֹתֵךְ
  choice: ты вступилась за своих сестёр
  rationale: Пиэль פלל с ל допускает значение выступления или суда в чью-либо пользу. В контексте это ироническое оправдание сестёр поведением Иерусалима; «вступилась за» сохраняет намеренную образность, не сводя её исключительно к формальному приговору.
- source_word: בְּחַטֹּאתַיִךְ
  choice: своими грехами
  rationale: 'Предлог ב здесь имеет инструментальное значение: именно грехи Иерусалима стали средством сравнительного оправдания его сестёр.'
- source_word: הִתְעַבְתְּ מֵהֵן
  choice: ты поступала отвратительнее их
  rationale: Сравнительная конструкция указывает на более мерзкое поведение; русский вариант естественно передаёт действие, а не только состояние.
- source_word: תִּצְדַּקְנָה מִמֵּךְ
  choice: ты выставила их праведнее себя
  rationale: Форма צדק с מן выражает сравнительную правоту или праведность. Перестройка фразы делает явной причинную связь с грехами Иерусалима, не превращая праведность сестёр в абсолютную.
- source_word: בּוֹשִׁי
  choice: стыдись
  rationale: Императив בוש призывает испытывать стыд; краткое «стыдись» естественно и сохраняет повелительную форму.
- source_word: בְּצַדֶּקְתֵּךְ אַחְיוֹתֵךְ
  choice: за то, что выставила своих сестёр праведными
  rationale: Конструкция означает, что Иерусалим своим сравнительно худшим поведением оправдал сестёр. «Выставила… праведными» передаёт результат, не утверждая их безусловной праведности.
theological_decisions:
- issue: Сравнительная праведность Содома и Самарии по отношению к Иерусалиму
  choice: 'Передать צדק как сравнительное оправдание: Иерусалим своими худшими грехами выставил сестёр праведнее себя.'
  alternative: Понять слова как утверждение их абсолютной праведности либо как исключительно формальное судебное оправдание.
  rationale: 'Контекст Иезекииля 16 строится на шокирующем сравнении: грех Иерусалима настолько велик, что его сёстры выглядят праведными рядом с ним. Перевод сохраняет эту напряжённость, не объявляя их безгрешными.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род сохранён, поскольку обращение направлено к олицетворённому Иерусалиму. «Сёстры» сохранено как ключевой образ контекста; повтор «неси свой позор» воспроизводит риторическую структуру еврейского текста.
