    issue: Каузативная переформулировка сравнительного сказуемого
    rationale: «Ты выставила их праведнее себя» не буквально соответствует תִּצְדַּקְנָה מִמֵּךְ («они оказались/стали праведнее тебя») и излишне переносит действие Иерусалима в само сказуемое. Причинность уже выражена через בְּחַטֹּאתַיִךְ.
