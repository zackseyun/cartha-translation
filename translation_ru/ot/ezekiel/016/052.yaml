revisions:
- from: И ты[a] неси свой позор, ведь ты вступилась за своих сестёр. Своими грехами, в которых ты поступала отвратительнее их, ты выставила их праведнее себя. Поэтому и ты стыдись и неси свой позор[b] за то, что выставила своих сестёр праведными.
  to: 'И ты[a] неси свой позор, ибо высказалась в пользу своих сестёр: своими грехами, в которых ты поступала отвратительнее, чем они, ты сделала так, что они оказались праведнее тебя[b]. И ты стыдись и неси свой позор, ибо оправдала своих сестёр.'
  rationale: 'Исправлена главная сравнительная конструкция: сёстры являются подлежащим «оказались праведнее тебя», как в еврейском תִּצְדַּקְנָה מִמֵּךְ. Причинный смысл בְּחַטֹּאתַיִךְ сохранён в «своими грехами… ты сделала так, что». Заключительное «оправдала своих сестёр» передаёт иронический судебный оттенок בְּצַדֶּקְתֵּךְ, а сноска b перенесена к сравнительному утверждению, которое она разъясняет.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:44:19Z'
review_pass:
  verdict: revise
  source_fidelity: В черновике верно переданы повеления «неси» и «стыдись», образ сестёр и сравнительный характер צדק. Однако «ты выставила их праведнее себя» заменяет самостоятельное утверждение еврейского текста («они праведнее тебя») прямой каузативной формой. Это лучше исправить, сохранив причинную связь через «из-за/своими грехами».
  naturalness: Русский текст в целом литературный, но переход между первым и вторым предложениями несколько разрывает синтаксическую связь оригинала. «Оказались праведнее тебя» естественно и отчётливо выражает именно сравнительный результат.
  terminology: '«Позор» удачно передаёт כְּלִמָּה, а «стыдись» — בּוֹשִׁי. Для פִּלַּלְתְּ לַאֲחוֹתֵךְ предпочтительно «высказалась в пользу сестёр» с примечанием о вариантах: это не навязывает исключительно значение формального судебного решения или ходатайства. В заключительном בְּצַדֶּקְתֵּךְ уместно «оправдала своих сестёр» в контексте сравнительного, иронического оправдания.'
  issues:
