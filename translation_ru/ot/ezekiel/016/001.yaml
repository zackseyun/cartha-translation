  text: And the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И было ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога; традиционно переводится как «Господь».
    reason: Пояснение передачи тетраграмматона.
lexical_decisions:
- source_word: וַיְהִי
  choice: было
  rationale: В устойчивой пророческой формуле естественное для русского библейского повествования «было ... слово» точно передаёт наступление события, не превращая образ слова в физическое движение.
- source_word: דְבַר
  choice: слово
  rationale: В данном пророческом сочетании обозначает обращённое к пророку Божье слово или весть; «слово» сохраняет традиционную формулу и связь с последующей прямой речью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с местоименным суффиксом обозначает направленность Божьего слова к пророку; «ко мне» естественно в составе устойчивой русской формулы.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейский инфинитив вводит следующую прямую речь. В современном русском это естественно и без потери смысла передаётся двоеточием, а не буквальным «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» передаёт имя, не подменяя его титулом; «Иегова» отражает позднее смешанное чтение.
translation_notes:
  register: Современный литературный русский с сохранением краткой и торжественной пророческой формулы. Двоеточие естественно вводит речь, начинающуюся в следующем стихе.
