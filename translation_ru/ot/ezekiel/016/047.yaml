  text: Yet you did not walk in their ways or act according to their abominations[a]; as if that were too little[b], you became more corrupt than they in all your ways.
translation:
  language: ru
  text: Но ты не ходила их путями и не совершала их мерзостей[a]; но, словно и этого было мало[b], во всех своих путях ты стала развращённее их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте одно отрицание относится к обоим глаголам: «не ходила их путями и не совершала их мерзостей».'
    reason: grammar
  - marker: b
    text: 'Буквально: «как нечто совсем малое». Идиома подчёркивает, что Иерусалим не ограничилась грехами Самарии и Содома, но превзошла их в развращённости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַרְכֵיהֶן ... הָלַכְתְּ
  choice: ходила их путями
  rationale: Сохраняет еврейскую метафору жизненного пути и естественно передаёт следование определённому образу жизни.
- source_word: וּבְתוֹעֲבוֹתֵיהֶן עשיתי
  choice: творила их мерзости
  rationale: Сочетание עשה с תועבות означает совершать отвратительные, осуждаемые поступки. Форма глагола в предоставленном тексте необычна, но контекст однозначно требует обращения ко 2-му лицу женского рода.
- source_word: תּוֹעֵבָה
  choice: мерзости
  rationale: Сильное и традиционно понятное обозначение культово-нравственных поступков, вызывающих отвращение и осуждение.
- source_word: כִּמְעַט קָט
  choice: словно и этого было мало
  rationale: 'Передаёт эллиптическую идиому как риторическое усиление: Иерусалим не ограничился уровнем упомянутых городов, а превзошёл их.'
- source_word: וַתַּשְׁחִתִי
  choice: ты стала развращённее
  rationale: В данном нравственном контексте שׁחת имеет значение порчи, растления; сравнительная форма естественно сочетается с последующим מֵהֵן.
- source_word: מֵהֵן
  choice: их
  rationale: 'Предлог מן выражает сравнение: Иерусалим оказался развращённее Самарии и Содома.'
- source_word: בְּכָל דְּרָכָיִךְ
  choice: во всех своих путях
  rationale: Сохраняет повтор ключевого образа דרך и подчёркивает всеохватность поведения Иерусалима.
theological_decisions:
- issue: Степень вины Иерусалима по сравнению с Самарией и Содомом
  choice: Иерусалим не просто повторил их грехи, но превзошёл их в развращённости.
  alternative: Иерусалим не следовал их путям, однако стал развращённее их иным образом.
  rationale: Сочетание כִּמְעַט קָט с последующим сравнением וַתַּשְׁחִתִי מֵהֵן лучше всего понимать как риторическое нарастание. Вместе с тем буквальная отрицательная конструкция допускает иной оттенок, отмеченный в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род обращения сохранён, поскольку речь идёт об олицетворённом Иерусалиме. Повтор слова «пути» передаёт композиционную связь исходного текста; «не просто» выражает наиболее вероятную риторическую силу отрицания, а подлинная синтаксическая неоднозначность сохранена в сноске.
