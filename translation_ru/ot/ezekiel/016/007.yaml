id: EZK.16.7
reference: Ezekiel 16:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רְבָבָ֗ה כְּ/צֶ֤מַח הַ/שָּׂדֶה֙ נְתַתִּ֔י/ךְ וַ/תִּרְבִּי֙ וַֽ/תִּגְדְּלִ֔י וַ/תָּבֹ֖אִי בַּ/עֲדִ֣י עֲדָיִ֑ים שָׁדַ֤יִם נָכֹ֨נוּ֙ וּ/שְׂעָרֵ֣/ךְ צִמֵּ֔חַ וְ/אַ֖תְּ עֵרֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/007.yaml
  text: I made you countless like the growth of the field[a], and you multiplied and grew up and came to full adornment. Your breasts were formed and your hair had grown[d][c][b], yet you were naked and bare.
translation:
  language: ru
  text: 'Я сделал тебя многочисленной, как полевую поросль[a]. Ты множилась, росла и достигла поры украшений[b]: груди твои сформировались, и волосы выросли; но ты была нага и обнажена[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как полевая растительность».'
    reason: Лексема צֶמַח может обозначать поросль, произрастание или растительность.
  - marker: b
    text: 'Буквально: «достигла украшения украшений». Смысл трудной еврейской идиомы, вероятно, связан с достижением полной зрелости и красоты; возможен перевод: «достигла полной украшенности».'
    reason: Сохраняет образ украшений и неоднозначность спорной идиомы, не сводя её без достаточных оснований к брачной или физиологической трактовке.
  - marker: c
    text: Парное выражение «нага и обнажена» усиливает образ полной наготы и незащищённости.
    reason: Поясняет функцию еврейского усилительного дублета.
lexical_decisions:
- source_word: רְבָבָה
  choice: многочисленной
  rationale: Передаёт идею чрезвычайного умножения без неоправданно точного числового значения.
- source_word: כְּצֶמַח הַשָּׂדֶה
  choice: как полевая поросль
  rationale: Сохраняет образ растущей полевой растительности и естественно звучит по-русски.
- source_word: נְתַתִּיךְ
  choice: Я сделал тебя
  rationale: 'В сочетании с רְבָבָה глагол נתן имеет каузативный смысл: Бог сделал её многочисленной.'
- source_word: וַתִּרְבִּי וַתִּגְדְּלִי
  choice: Ты росла, взрослела
  rationale: В контексте образа девочки, становящейся женщиной, последовательность передаёт как рост, так и созревание; буквальное повторное указание на умножение по-русски было бы тяжеловесным.
- source_word: וַתָּבֹאִי בַּעֲדִי עֲדָיִים
  choice: достигла зрелой красоты
  rationale: Трудная идиома буквально связана с «украшением украшений»; выбранный вариант выражает достижение полной зрелости и красоты, не вводя прямо брачную интерпретацию.
- source_word: שָׁדַיִם נָכֹנוּ
  choice: груди твои сформировались
  rationale: Передаёт значение установления или формирования в контексте телесного созревания.
- source_word: וּשְׂעָרֵךְ צִמֵּחַ
  choice: волосы выросли
  rationale: Естественно передаёт буквальный образ прорастания или роста волос в контексте полового созревания, не уточняя сверх сказанного вид волос.
- source_word: עֵרֹם וְעֶרְיָה
  choice: нага и обнажена
  rationale: Сохраняет усилительный парный оборот исходного текста и образ полной незащищённости.
theological_decisions:
- issue: Значение בַּעֲדִי עֲדָיִים в метафоре взросления
  choice: достижение зрелой красоты
  alternative: достижение поры украшений; высшая украшенность; брачная зрелость
  rationale: Контекст ясно говорит о взрослении олицетворённого Иерусалима, но спорная идиома не требует однозначно видеть здесь брак или конкретный физиологический этап. Перевод сохраняет образ зрелости и красоты без конфессионального или частного толкования.
- issue: Референт שְׂעָרֵךְ
  choice: волосы без анатомического уточнения
  alternative: лобковые волосы
  rationale: Контекст полового созревания допускает более конкретное понимание, однако само слово означает «волосы»; основной текст не конкретизирует то, что оставлено неуточнённым в еврейском.
translation_notes:
  register: Современный литературный русский язык; тон образный и достойный. Сохранены женский род обращения, последовательность взросления и резкий контраст последней части стиха. Формулировка избегает архаизма «тьмами» и чрезмерно клинической конкретизации.
