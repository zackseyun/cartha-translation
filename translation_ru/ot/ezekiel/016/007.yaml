  source_fidelity: 'Следует точнее сохранить два элемента еврейского текста: וַתִּרְבִּי («ты умножалась/становилась многочисленнее») не следует заменять одним лишь физическим ростом, а спорный оборот בַּעֲדִי עֲדָיִים лучше передать в основном тексте через образ украшений, не сводя его сразу к «зрелой красоте».'
