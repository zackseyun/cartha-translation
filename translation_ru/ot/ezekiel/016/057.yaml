translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой речи. Образ «дочерей» оставлен в основном тексте ради связи с древнееврейской метафорикой, но пояснён в сносках. Сложность и некоторая напряжённость синтаксиса כְּמוֹ עֵת не устранены добавлением отсутствующего в масоретском тексте слова «ныне».
