base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/057.yaml
  text: before your wickedness was uncovered[a], as at the time of the reproach of the daughters of Aram and all those around her, the daughters of the Philistines[c][b], who despise you from every side.
translation:
  language: ru
  text: прежде чем стало явным[a] твоё злодейство, — как во время поношения со стороны дочерей Арама[b] и всех, кто вокруг неё, дочерей филистимлян[c], презирающих тебя со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открылось», «обнаружилось» или «было выставлено напоказ».'
    reason: lexical_alternative
  - marker: b
    text: Арам традиционно также называют Сирией. Выражение «дочери Арама» может обозначать арамейский народ или его города.
    reason: cultural_note
  - marker: c
    text: «Дочери филистимлян» — древнееврейский собирательный образ, обозначающий филистимский народ или филистимские города.
    reason: cultural_note
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Естественно и точно вводит предшествующее по времени событие.
- source_word: תִּגָּלֶה
  choice: открылось
  rationale: Нифаль глагола גלה указывает на то, что зло стало явным; «открылось» сохраняет образ обнаружения, не уточняя способ.
- source_word: רָעָתֵךְ
  choice: твоё злодейство
  rationale: В пророческом обличении слово обозначает нравственное зло и виновность, а не бедствие.
- source_word: כְּמוֹ עֵת
  choice: как в то время, когда
  rationale: Передаёт сравнительно-временное значение оборота естественным современным русским синтаксисом.
- source_word: חֶרְפַּת
  choice: поносили
  rationale: Глагольная передача ясно выражает публичное поношение и презрение, подразумеваемые существительным חֶרְפָּה.
- source_word: בְּנוֹת אֲרָם
  choice: дочери Арама
  rationale: Сохранены название Арам и древнееврейский собирательный образ «дочерей»; его смысл пояснён в сноске.
- source_word: וְכָל סְבִיבוֹתֶיהָ
  choice: и все, кто вокруг него
  rationale: Форма женского рода относится к Араму в грамматике древнееврейского текста; в русском согласование дано по роду названия «Арам», а подразумеваемые жители выражены словом «кто».
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: дочери филистимлян
  rationale: Сохранён буквальный собирательный образ исходного текста, пояснённый сноской.
- source_word: הַשָּׁאטוֹת
  choice: презирающие тебя
  rationale: Причастие обозначает продолжающееся презрительное отношение; выбор не сужает значение до одних словесных насмешек.
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Естественно передаёт круговой, всеохватный характер враждебного презрения.
