base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/008.yaml
  text: When I passed by you and saw you[a], behold, your time was the time for love. So I spread the edge of my garment over you and covered your nakedness. I swore myself to you and entered into a covenant with you, declares the Lord GOD[b], and you became mine.
translation:
  language: ru
  text: 'Когда Я проходил мимо тебя и увидел тебя, и вот: время твоё — время любви.[a] Я простёр над тобой край Моей одежды[b] и прикрыл твою наготу. Я поклялся тебе и вступил с тобой в завет, — возвещает Владыка Яхве, — и ты стала Моей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «время ласк» либо «время любовной близости». Еврейское слово имеет романтические и эротические оттенки в рамках брачного образа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Моё крыло». Еврейское слово может обозначать также край одежды; этот жест выражает брачное покровительство или притязание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: Когда Я проходил мимо тебя
  rationale: Глагольное сочетание означает прохождение мимо или рядом. Слово «снова» не добавлено, поскольку в еврейском тексте его нет.
- source_word: וְהִנֵּה
  choice: то вот
  rationale: Передаёт указательную и риторически выделяющую силу הִנֵּה естественным современным русским оборотом.
- source_word: עִתֵּךְ עֵת דֹּדִים
  choice: твоё время — время любви
  rationale: Сохраняет повтор слова «время» и намеренную широту דֹּדִים, включающую романтические, ласковые и эротические оттенки.
- source_word: וָאֶפְרֹשׂ כְּנָפִי עָלַיִךְ
  choice: Я простёр над тобой край Моей одежды
  rationale: כָּנָף буквально значит «крыло», а также край одежды. В брачной метафоре край одежды понятнее в основном тексте, тогда как буквальный образ сохранён в примечании.
- source_word: וָאֲכַסֶּה עֶרְוָתֵךְ
  choice: и прикрыл твою наготу
  rationale: Прямо передаёт עֶרְוָה как наготу, не устраняя связанного с ней оттенка уязвимости и стыда.
- source_word: וָאֶשָּׁבַע לָךְ
  choice: Я поклялся тебе
  rationale: Естественно и точно передаёт клятву, данную адресату; брачно-заветный характер определяется контекстом.
- source_word: וָאָבוֹא בִבְרִית אֹתָךְ
  choice: и вступил с тобой в завет
  rationale: Устойчиво передаёт еврейскую идиому «войти в завет» и сохраняет торжественную договорную образность.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם; «Владыка» различает אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה.
- source_word: וַתִּהְיִי לִי
  choice: и ты стала Моей
  rationale: Кратко передаёт буквальное «стала Мне/для Меня» и сохраняет брачно-заветную принадлежность, не добавляя прямо не названное слово «жена».
theological_decisions:
- issue: Брачно-заветная образность и эротический оттенок
  choice: Сохранены выражения «время любви», «край Моей одежды» и «прикрыл твою наготу».
  alternative: Ослабить эротический оттенок до общей заботы либо усилить его прямым указанием на половую зрелость или любовную близость.
  rationale: Текст изображает отношения Яхве с Иерусалимом посредством брака и завета. Перевод не должен ни сглаживать телесную сторону образа, ни делать её однозначнее исходного текста.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь; Господь Яхве
  rationale: Так сохраняются и титул אֲדֹנָי, и собственное заветное имя יהוה без их слияния в общее обозначение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; брачная метафора и повтор слова «время» сохранены. Местоимения, относящиеся к Богу в Его прямой речи, написаны с прописной буквы согласно принятому русскому религиозному регистру.
