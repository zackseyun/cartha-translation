base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/053.yaml
  text: And I will restore their fortunes—the fortunes of Sodom and her daughters[a], and the fortunes of Samaria and her daughters—and your fortunes among them[b],
translation:
  language: ru
  text: И Я восстановлю их благополучие[a] — благополучие Содома и его дочерей[b], благополучие Самарии и её дочерей, — и твоё благополучие среди них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изменю их участь»; возможно также: «возвращу их из плена» или «верну их пленников». Еврейское выражение часто обозначает восстановление народа после бедствия в широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: «Дочери» — зависимые города или окрестные поселения, связанные с главным городом.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: И Я восстановлю
  rationale: Форма от שׁוב здесь имеет каузативный смысл и вместе с שְׁבִית выражает перемену бедственного положения на благополучное. «Восстановлю» естественно передаёт эту направленность.
- source_word: שְׁבִיתְהֶן / שבית / שְׁבִיתַיִךְ
  choice: благополучие
  rationale: Устойчивое сочетание שׁוב שׁבות/שבית означает восстановление, перемену участи или прекращение бедствия и не обязательно описывает буквальное возвращение пленников. Упоминание Содома также делает узкое значение «плен» менее вероятным.
- source_word: סְדֹם
  choice: Содом
  rationale: Традиционная русская форма топонима.
- source_word: וּבְנוֹתֶיהָ
  choice: и его/её дочерей
  rationale: Сохранена буквальная родственная метафора зависимых городов и поселений. Местоимения согласованы с грамматическим родом русских названий «Содом» и «Самария».
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Традиционная русская форма топонима.
- source_word: בְּתוֹכָהְנָה
  choice: вместе с ними
  rationale: Выражение буквально означает «среди них, посреди них». В данном перечислении «вместе с ними» естественно передаёт одновременность восстановления Иерусалима, Содома и Самарии, не устраняя их сопоставления.
theological_decisions:
- issue: Смысл формулы восстановления в пророчестве о суде и восстановлении
  choice: Передать как восстановление благополучия, то есть широкое изменение участи.
  alternative: «Вернуть из плена» или «возвратить пленников».
  rationale: Еврейская формула допускает связь с пленом, но часто обозначает более широкое восстановление прежнего или благополучного состояния. Перевод не уточняет механизм исполнения пророчества.
- issue: Значение «дочерей» Содома и Самарии
  choice: Сохранить в основном тексте образ «дочерей».
  alternative: «Зависимые города» или «окрестные поселения».
  rationale: Так сохраняется семейно-городская метафора главы, а её географический смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Повтор «благополучие» сохраняет структуру и риторический акцент еврейского текста; метафора «дочерей» оставлена без архаизации синтаксиса.
