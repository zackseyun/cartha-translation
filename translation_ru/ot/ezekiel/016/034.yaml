base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/034.yaml
  text: 'And in your prostitution you were the opposite of other women: no one solicited you[a], but you gave payment, and no payment was given to you; so you became the opposite.'
translation:
  language: ru
  text: 'В твоём блуде всё было наоборот, не как у других женщин: никто не искал тебя как блудницу[a]; ты давала плату, а тебе платы не давали. Так ты стала полной противоположностью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вслед за тобой никто не блудил»; то есть, в отличие от обычной блудницы, ты не привлекала клиентов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵפֶךְ / לְהֶפֶךְ
  choice: всё было наоборот / всё было наоборот
  rationale: Передаёт инверсию обычного порядка и сохраняет повторяющееся обрамление стиха естественным современным русским выражением.
- source_word: תַזְנוּתַיִךְ
  choice: в твоём блуде
  rationale: Сохраняет прямую и намеренно резкую метафору сексуальной неверности Иерусалима; слово понятно в библейском контексте и не сводит образ к отвлечённой «неверности».
- source_word: וְאַחֲרַיִךְ לֹא זוּנָה
  choice: никто не искал тебя как блудницу
  rationale: 'Передаёт контекстуальный смысл необычной еврейской конструкции: в отличие от обычной блудницы, к ней не стремились клиенты. Буквальная форма отмечена в сноске.'
- source_word: אֶתְנָן
  choice: плата
  rationale: Обозначает плату за проституцию и позволяет сохранить повтор одного и того же слова в обеих контрастных частях фразы.
- source_word: וּבְתִתֵּךְ אֶתְנָן
  choice: ты сама давала плату
  rationale: 'Частица «сама» естественно подчёркивает парадокс: плату давала та, которая обычно должна была бы её получать.'
- source_word: וְאֶתְנַן לֹא נִתַּן לָךְ
  choice: а тебе платы не давали
  rationale: Сохраняет повтор слова «плата» и противопоставление, оставаясь естественным по-русски.
- source_word: וַתְּהִי
  choice: так у тебя всё было
  rationale: «Так» выражает итоговый характер заключительной фразы, а формулировка возвращает читателя к начальному образу перевёрнутого порядка.
theological_decisions:
- issue: Сексуальная метафора неверности Иерусалима
  choice: Сохранить прямой образ блуда и платы
  alternative: Смягчить до «неверности» или прямо заменить метафору понятием идолопоклонства
  rationale: Резкая сексуальная образность является существенной частью пророческого обличения; её нельзя без пояснения превращать в более отвлечённое богословское понятие.
translation_notes:
  register: Современный литературный русский с сохранением резкости пророческой метафоры. Разговорное по форме выражение «всё было наоборот» выбрано как ясный и достойный способ воспроизвести двукратное הֵפֶךְ, не прибегая к тяжеловесному «была противоположностью».
