  text: הִנֵּה זֶ֣ה הָיָ֔ה עֲוֺ֖ן סְדֹ֣ם אֲחוֹתֵ֑/ךְ גָּא֨וֹן שִׂבְעַת לֶ֜חֶם וְ/שַׁלְוַ֣ת הַשְׁקֵ֗ט הָ֤יָה לָ/הּ֙ וְ/לִ/בְנוֹתֶ֔י/הָ וְ/יַד עָנִ֥י וְ/אֶבְי֖וֹן לֹ֥א הֶחֱזִֽיקָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/049.yaml
  text: 'Look[a], this was the guilt of your sister Sodom: pride, fullness of bread, and prosperous ease belonged to her and to her daughters[c][b], but she did not strengthen the hand of the poor and needy.'
translation:
  language: ru
  text: 'Вот в чём была вина Содома, твоей сестры: гордость, изобилие хлеба[b] и безмятежное благополучие были у неё и у её дочерей[a], но бедного и нуждающегося она не поддерживала[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «дочерей» — то есть зависимых от Содома городов и поселений.
    reason: cultural_note
  - marker: b
    text: 'Или: «сытость хлебом».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не укрепляла руку бедного и нуждающегося», то есть не помогала им и не поддерживала их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה זֶה הָיָה עֲוֺן
  choice: Вот в чём была вина
  rationale: הִנֵּה זֶה вводит подчёркнутое объяснение, а עָוֹן здесь обозначает как виновность, так и само преступное поведение. Русское «вот в чём была вина» естественно вводит последующий перечень.
- source_word: אֲחוֹתֵךְ
  choice: твоей сестры
  rationale: Сохранена важная для контекста Иезекииля семейная метафора, связывающая Иерусалим с Содомом.
- source_word: גָּאוֹן
  choice: гордость
  rationale: В данном перечне пороков слово обозначает надменную, высокомерную гордость.
- source_word: שִׂבְעַת לֶחֶם
  choice: изобилие хлеба
  rationale: Передаёт буквальный образ «сытости/полноты хлеба» и одновременно понятно выражает материальное изобилие.
- source_word: שַׁלְוַת הַשְׁקֵט
  choice: безмятежный покой
  rationale: Сочетание указывает на благополучную, ничем не нарушаемую спокойную жизнь; перевод сохраняет оттенки обеспеченности и беспечности, не усиливая их сверх текста.
- source_word: בְנוֹתֶיהָ
  choice: её дочерей
  rationale: Сохранена пророческая персонификация зависимых от города поселений; значение разъясняется в сноске.
- source_word: יָד עָנִי וְאֶבְיוֹן לֹא הֶחֱזִיקָה
  choice: бедного и нуждающегося она не поддерживала
  rationale: Еврейская идиома буквально говорит об укреплении руки и означает оказание помощи или поддержки. Естественный русский перевод передаёт её смысл, а образ отмечен в сноске.
theological_decisions:
- issue: Характер вины Содома в данном стихе
  choice: 'Передать прямо названные здесь общественные и нравственные пороки: гордость, изобилие, беспечный покой и отсутствие помощи уязвимым.'
  alternative: Сформулировать перевод так, чтобы на первый план вышел иной грех, не названный в данном стихе.
  rationale: Еврейский текст этого стиха перечисляет именно эти проступки. Перевод не должен ни сужать, ни расширять перечень под влиянием последующих богословских споров.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прост и доступен; семейная и городская метафорика сохранена, а непрозрачные для современного читателя реалии и идиомы пояснены в сносках.
