  text: בִּ/בְנוֹתַ֤יִ/ךְ גַּבֵּ/ךְ֙ בְּ/רֹ֣אשׁ כָּל דֶּ֔רֶךְ וְ/רָמָתֵ֥/ךְ עשיתי בְּ/כָל רְח֑וֹב וְ/לֹא הייתי כַּ/זּוֹנָ֖ה לְ/קַלֵּ֥ס אֶתְנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/031.yaml
  text: When you built your mound at the head of every road and made your high place in every square[a], you were not like a prostitute[c][b], in that you scorned payment.
translation:
  language: ru
  text: Когда ты строила своё возвышение в начале каждой дороги[b] и устраивала своё высокое место на каждой площади[a], ты была не как проститутка[c], ибо презирала плату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё возвышение» или «своё святилище». Еврейское слово обозначает возвышенное место, вероятно связанное с культовыми действиями.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «на каждом перекрёстке». Буквально: «во главе каждой дороги».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть не как обычная проститутка: Иерусалим не получал платы, а, как объясняется в следующих стихах, сам давал подарки.'
    reason: cross_reference
lexical_decisions:
- source_word: בִּבְנוֹתַיִךְ
  choice: Когда ты строила себе
  rationale: Предлог ב с инфинитивом образует обстоятельственное придаточное времени; женский род сохраняет обращение к Иерусалиму.
- source_word: גַּבֵּךְ
  choice: возвышение
  rationale: Слово обозначает приподнятое сооружение, связанное здесь с образами проституции; нейтральное «возвышение» не уточняет спорную архитектурную форму.
- source_word: בְּרֹאשׁ כָּל־דֶּרֶךְ
  choice: в начале каждой дороги
  rationale: Сохраняет пространственный образ רֹאשׁ («голова, начало, верх»), не сводя его без необходимости к перекрёстку.
- source_word: וְרָמָתֵךְ
  choice: своё высокое место
  rationale: Передаёт культовое значение רָמָה и сохраняет связь с идолопоклонством.
- source_word: עשיתי
  choice: устраивала
  rationale: Контекстуально естественная передача עשה применительно к сооружению или обустройству места; согласована с длительным русским описанием повторявшихся действий.
- source_word: בְּכָל רְחוֹב
  choice: на каждой площади
  rationale: רְחוֹב обозначает широкое открытое общественное пространство, городскую площадь.
- source_word: וְלֹא הָיִית כַּזּוֹנָה
  choice: ты была не как блудница
  rationale: Сохраняет явное сравнение и намеренно резкую метафору пророка.
- source_word: לְקַלֵּס
  choice: ты презирала
  rationale: Передаёт значение пренебрежения или презрения; двоеточие естественно выражает уточняющее отношение заключительной фразы.
- source_word: אֶתְנָן
  choice: плату
  rationale: В данном образе это плата блуднице; краткое современное слово ясно передаёт смысл.
theological_decisions:
- issue: Метафора проституции как образ неверности Иерусалима
  choice: Сохранить прямое слово «блудница» и упоминание платы.
  alternative: «неверная женщина» или прямое обозначение идолопоклонства
  rationale: Резкая сексуальная метафора существенна для пророческого обвинения и не должна быть смягчена конфессионально окрашенным толкованием.
- issue: Смысл заключительной фразы
  choice: Иерусалим отличается от обычной блудницы тем, что презирает плату.
  alternative: «не как блудница, вымогающая плату» или «не принимала платы»
  rationale: Формулировка сохраняет парадокс текста; следующие стихи объясняют, что Иерусалим сам давал подарки вместо того, чтобы получать плату.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и её намеренно резкой образности. Синтаксис сделан естественным для русского, а спорные пространственные и архитектурные значения вынесены в примечания.
