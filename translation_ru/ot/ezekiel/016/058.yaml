translation:
  language: ru
  text: Ты понесла свой разврат и свои мерзости[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понесла наказание за свой разврат и свои мерзости»; возможно также: «понесла вину за свой разврат и свои мерзости». В этом контексте еврейский глагол может иметь судебный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמָּתֵךְ
  choice: свой разврат
  rationale: Слово זִמָּה у Иезекииля обозначает постыдную нравственную распущенность, нередко с выраженным сексуальным оттенком. «Разврат» сохраняет связь с образом неверности и проституции, развёрнутым в главе.
- source_word: תּוֹעֲבוֹתַיִךְ
  choice: свои мерзости
  rationale: תּוֹעֵבָה обозначает нечто отвратительное и неприемлемое в нравственном или культовом отношении. «Мерзости» передаёт резкость пророческой речи и сохраняет множественное число.
- source_word: אַתְּ
  choice: ты
  rationale: Самостоятельное местоимение подчёркивает адресата и его ответственность. В русском явное «ты» перед формой женского рода достаточно передаёт этот акцент без утяжеляющего «ты сама».
- source_word: נְשָׂאתִם
  choice: понесла на себе
  rationale: Глагол נשׂא буквально означает «нести». В судебном контексте он может подразумевать несение вины или наказания; выражение «понесла на себе» сохраняет образ и не сводит смысл только к одному из этих оттенков.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула נְאֻם естественно передана настоящим временем «возвещает», а личное имя יהוה — формой «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит четырёхбуквенное личное имя Бога; «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Следует ли уточнять נשׂא как несение вины или наказания
  choice: понесла на себе
  alternative: понесла наказание; понесла вину
  rationale: Контекст допускает судебный оттенок, однако прямыми дополнениями в тексте служат «разврат» и «мерзости». Основной перевод сохраняет компактность и смысловую напряжённость оригинала, а возможное уточнение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой формулой. Женский род глагола отражает обращение к олицетворённому Иерусалиму. Выражение «на себе» делает русскую фразу естественной и сохраняет образ несения бремени.
