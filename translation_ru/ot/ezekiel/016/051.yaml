theological_decisions:
- issue: Смысл выражения «оправдала своих сестёр»
  choice: Иерусалим своими более тяжкими мерзостями выставил сестёр праведными в сравнении с собой.
  alternative: Иерусалим в буквальном смысле оправдал или объявил сестёр праведными.
  rationale: Контекст содержит сравнительную пророческую риторику, а не утверждение о действительном нравственном оправдании Самарии и Содома. Сноска сохраняет более буквальную судебно-правовую формулировку.
