lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и переход к следствию после предшествующих обвинений.
- source_word: זוֹנָה
  choice: блудница
  rationale: Прямое существительное в обращении, сохраняющее резкую метафору неверности Иерусалима; в литературном русском оно звучит естественнее, чем более грубые варианты.
- source_word: שִׁמְעִי
  choice: выслушай
  rationale: Повелительная форма второго лица единственного числа женского рода. «Выслушай» естественно вводит последующее пророческое слово и подчёркивает требование внимать ему.
- source_word: דְּבַר
  choice: слово
  rationale: Сохраняет устойчивую пророческую формулу «слово Яхве» и буквальную связь с исходным существительным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Метафора сексуальной неверности Иерусалима
  choice: блудница
  alternative: проститутка; распутница
  rationale: «Блудница» прямо и резко передаёт обвинительное обращение, оставаясь уместной в современном литературном библейском тексте; метафора намеренно не смягчена.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Восклицательный знак передаёт силу краткого повелительного обращения; разделительный знак פ самостоятельного лексического содержания не имеет.
