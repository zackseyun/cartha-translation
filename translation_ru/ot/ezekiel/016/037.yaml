  text: לָ֠/כֵן הִנְ/נִ֨י מְקַבֵּ֤ץ אֶת כָּל מְאַהֲבַ֨יִ/ךְ֙ אֲשֶׁ֣ר עָרַ֣בְתְּ עֲלֵי/הֶ֔ם וְ/אֵת֙ כָּל אֲשֶׁ֣ר אָהַ֔בְתְּ עַ֖ל כָּל אֲשֶׁ֣ר שָׂנֵ֑את וְ/קִבַּצְתִּי֩ אֹתָ֨/ם עָלַ֜יִ/ךְ מִ/סָּבִ֗יב וְ/גִלֵּיתִ֤י עֶרְוָתֵ/ךְ֙ אֲלֵ/הֶ֔ם וְ/רָא֖וּ אֶת כָּל עֶרְוָתֵֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/037.yaml
  text: Therefore[a], behold, I am gathering all your lovers with whom you found pleasure, and all whom you loved, along with all whom you hated; and I will gather them against you from every side, and I will uncover your nakedness to them[c][b], and they will see all your nakedness.
translation:
  language: ru
  text: Поэтому вот, Я собираю всех твоих любовников, которыми ты наслаждалась[a], — всех, кого ты любила, вместе со всеми, кого ненавидела[b]. Я соберу их отовсюду против тебя, открою перед ними твою наготу[c], и они увидят всю твою наготу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в которых ты находила удовольствие». Еврейский глагол может означать испытывать удовольствие или наслаждаться.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть для суда будут собраны все эти группы: и любовники, и враги.'
    reason: cultural_note
  - marker: c
    text: «Открою перед ними твою наготу» — пророческий образ публичного разоблачения и унижения.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и судебное следствие из предшествующего обличения.
- source_word: הִנְנִי מְקַבֵּץ
  choice: 'вот: Я собираю'
  rationale: Сохраняет торжественную непосредственность הִנְנִי и значение близкого, несомненного действия, выраженное причастием.
- source_word: מְאַהֲבַיִךְ
  choice: твоих любовников
  rationale: В контексте главы речь идёт о незаконных связях в развёрнутой брачно-сексуальной метафоре; слово «любовники» сохраняет её обвинительную силу.
- source_word: אֲשֶׁר עָרַבְתְּ עֲלֵיהֶם
  choice: с которыми ты находила удовольствие
  rationale: ערב здесь обозначает удовольствие или наслаждение; формулировка сохраняет смысл и не уточняет его сверх исходного текста.
- source_word: וְאֵת כָּל אֲשֶׁר אָהַבְתְּ עַל כָּל אֲשֶׁר שָׂנֵאת
  choice: всех, кого ты любила, вместе со всеми, кого ненавидела
  rationale: 'Передаёт всеохватность перечня: собираются как любимые, так и ненавистные ей люди.'
- source_word: וְקִבַּצְתִּי אֹתָם עָלַיִךְ מִסָּבִיב
  choice: Я соберу их отовсюду против тебя
  rationale: В контексте суда עָלַיִךְ имеет враждебный смысл «против тебя», а מִסָּבִיב указывает на сбор со всех сторон.
- source_word: וְגִלֵּיתִי עֶרְוָתֵךְ אֲלֵהֶם
  choice: и обнажу тебя перед ними
  rationale: Естественно по-русски передаёт публичное открытие наготы перед собранными людьми, сохраняя конкретность образа.
- source_word: וְרָאוּ אֶת כָּל עֶרְוָתֵךְ
  choice: и они увидят всю твою наготу
  rationale: Сохраняет повтор עֶרְוָה и усиление כָּל, важные для риторики публичного позора.
theological_decisions:
- issue: Пророческая брачно-сексуальная метафора суда над Иерусалимом
  choice: Сохранены конкретные образы любовников, обнажения и наготы.
  alternative: Заменить их отвлечёнными словами «союзники», «разоблачение» и «позор».
  rationale: Глава намеренно изображает неверность завету через супружескую и сексуальную метафору. Её смягчение ослабило бы богословскую и риторическую напряжённость текста.
- issue: Кого охватывает собрание для суда
  choice: «всех, кого ты любила, вместе со всеми, кого ненавидела»
  alternative: Понимать фразу только как обозначение политических союзников.
  rationale: Исходный текст прямо соединяет любимых и ненавистных; перевод сохраняет эту всеохватность, не сводя образ исключительно к политической аллегории.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Обращение последовательно передано в женском роде, поскольку олицетворённый Иерусалим представлен женщиной. Конкретная лексика намеренно не смягчена; при этом «обнажу тебя» звучит естественнее буквального «открою твою наготу им», а повтор «нагота» сохранён в заключительной части.
