base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/014.yaml
  text: And your fame went out among the nations because of your beauty[a], for it was perfect through my splendor that I had set upon you, declares the Lord GOD.
translation:
  language: ru
  text: И слава о тебе разнеслась среди народов благодаря твоей красоте[a], ибо твоя красота была совершенна благодаря Моему великолепию, которым Я наделил тебя, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоё имя вышло среди народов»; то есть известность о тебе распространилась повсюду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא לָךְ שֵׁם
  choice: слава о тебе разнеслась
  rationale: Буквальный образ «твоё имя вышло» в данном сочетании означает, что известность или слава распространилась. Русское «слава о тебе разнеслась» естественно передаёт и движение, и смысл идиомы.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Здесь גּוֹיִם обозначает окружающие народы вообще, без позднейшего специального значения «язычники».
- source_word: בְּיָפְיֵךְ
  choice: благодаря твоей красоте
  rationale: 'Предлог ב в контексте выражает причину: слава распространилась из-за красоты Иерусалима.'
- source_word: כָּלִיל
  choice: совершенной
  rationale: Слово указывает на полноту и совершенство; форма женского рода в русском согласуется с «красотой», к которой относится местоимение הוּא.
- source_word: בַּהֲדָרִי
  choice: благодаря Моему великолепию
  rationale: הָדָר означает великолепие, блеск или величие. Предлог ב здесь указывает на источник или средство совершенства красоты.
- source_word: אֲשֶׁר שַׂמְתִּי עָלַיִךְ
  choice: которым Я облёк тебя
  rationale: 'Буквально: «которое Я положил на тебя». «Облёк» сохраняет образ великолепия как покрова или убранства и звучит естественно в возвышенной современной русской речи.'
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передаёт формулу божественного пророческого изречения; «возвещает» соответствует её торжественному характеру. אֲדֹנָי передано как «Владыка», а личное имя יהוה — как «Яхве», без смешения двух элементов сочетания.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача личного имени как «Яхве» сохраняет различие между титулом אֲדֹנָי и именем יהוה. «Владыка» позволяет избежать неестественного повтора «Господь Яхве» и не заменяет имя общим титулом.
- issue: Источник красоты Иерусалима
  choice: совершенной она была благодаря Моему великолепию
  alternative: она была совершенно прекрасна Моим великолепием
  rationale: Формулировка сохраняет утверждение, что совершенство красоты происходило от дарованного Богом великолепия, не добавляя объяснений о природе этого дара.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Обращение к олицетворённому Иерусалиму сохраняется в женском роде; заглавные буквы в местоимениях, относящихся к Богу, поддерживают традиционный библейский регистр.
