source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹֽא זכרתי אֶת יְמֵ֣י נְעוּרַ֔יִ/ךְ וַ/תִּרְגְּזִי לִ֖/י בְּ/כָל אֵ֑לֶּה וְ/גַם אֲנִ֨י הֵ֜א דַּרְכֵּ֣/ךְ בְּ/רֹ֣אשׁ נָתַ֗תִּי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לֹ֤א עשיתי אֶת הַ/זִּמָּ֔ה עַ֖ל כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/043.yaml
  text: Because you did not remember the days of your youth[a], but enraged me with all these things, therefore I also have put your way on your own head, declares the Lord GOD, and you have not committed lewdness beyond all your abominations.
translation:
  language: ru
  text: За то, что ты не помнила дней своей юности и всем этим вызывала у Меня гнев, вот, и Я возложил твой путь на твою же голову, — возвещает Владыка Яхве, — и ты не совершила этого распутства вдобавок ко всем своим мерзостям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза по-еврейски трудна. Выражение, переданное как «вдобавок ко всем своим мерзостям», может также пониматься как «сверх всех твоих мерзостей» или «наряду со всеми твоими мерзостями». Некоторые понимают всю фразу как риторический вопрос: «Разве ты не совершила этого распутства вдобавок ко всем своим мерзостям?» Кроме того, в письменном тексте форма глагола читается как «Я совершил», тогда как предлагаемое традиционное чтение и контекст дают: «ты совершила».'
    reason: Текстовая и синтаксическая неоднозначность заключительной фразы.
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: За то, что
  rationale: Передаёт причинное основание последующего суда и естественно связывает обе части русского предложения.
- source_word: לֹא זכרתי אֶת יְמֵי נְעוּרַיִךְ
  choice: ты не помнила дней своей юности
  rationale: По контексту и традиционному чтению обращение продолжается во втором лице женского рода, к Иерусалиму; оборот сохраняет образ прежних дней.
- source_word: וַתִּרְגְּזִי לִי
  choice: всем этим вызывала у Меня гнев
  rationale: רגז обозначает сильное волнение, потрясение или раздражение; в данном контексте речь о том, что поступки Иерусалима вызывают Божий гнев.
- source_word: וְגַם אֲנִי הֵא
  choice: вот, и Я
  rationale: Сохраняет указательно-эмфатическое הֵא и ответное «и Я», не добавляя причинного союза, которого в тексте прямо нет.
- source_word: דַּרְכֵּךְ בְּרֹאשׁ נָתַתִּי
  choice: Я обратил твой путь на твою же голову
  rationale: Сохраняет судебную метафору воздаяния человеку за его собственный образ действий; «же» ясно передаёт возвратный смысл.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передан формулой пророческого провозглашения; אֲדֹנָי — титулом «Владыка», а יהוה — личным именем «Яхве».
- source_word: הַזִּמָּה
  choice: распутство
  rationale: В контексте главы слово обозначает нравственно предосудительное сексуальное поведение; «распутство» понятно современному читателю и сохраняет эту окраску.
- source_word: עַל כָּל תּוֹעֲבֹתָיִךְ
  choice: ко всем своим мерзостям
  rationale: 'עַל понимается в добавочном значении: распутство прибавлено к прочим мерзостям; русский оборот естественно выражает накопление вины.'
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Различение титула אֲדֹנָי и собственного имени יהוה сохраняет структуру еврейского выражения и не смешивает оба слова в два нарицательных титула.
- issue: Смысл заключительной трудной фразы
  choice: риторический вопрос о добавлении распутства ко всем мерзостям
  alternative: 'утверждение: «и ты не совершила распутства сверх всех своих мерзостей»'
  rationale: Риторическое прочтение даёт связный упрёк и широко поддерживается контекстом, однако вопросительная частица в еврейском тексте отсутствует, поэтому альтернативу необходимо сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение к олицетворённому Иерусалиму последовательно оформлено в женском роде; судебная метафора сохранена без конфессионального истолкования.
