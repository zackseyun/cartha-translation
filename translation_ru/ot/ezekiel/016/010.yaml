base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/010.yaml
  text: I clothed you with embroidered cloth[a], put fine leather sandals on you, wrapped you in fine linen[b], and covered you with silk.
translation:
  language: ru
  text: Я одел тебя в расшитую одежду, обул в сандалии из дорогой кожи[a], обернул тонкой льняной тканью и покрыл шёлком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово תָּחַשׁ обозначает материал, из которого здесь изготовлена дорогая обувь; точный вид животного или происхождение кожи неизвестны.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дорогой тканью»; точное значение еврейского слова מֶשִׁי остаётся неясным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִקְמָה
  choice: расшитая одежда
  rationale: Существительное обозначает вышитый или узорчатый материал. В контексте облачения «расшитая одежда» естественно передаёт образ, не уточняя без основания вид одежды.
- source_word: תָּחַשׁ
  choice: тонко выделанная кожа
  rationale: Точный вид животного или происхождение материала неизвестны. Контекст дорогой обуви позволяет передать его как высококачественную кожу, избегая спорной зоологической конкретизации.
- source_word: וָאֶנְעֲלֵךְ תָּחַשׁ
  choice: обул в сандалии из тонко выделанной кожи
  rationale: Глагол נעל в этой форме означает надеть на кого-либо обувь. Упоминание сандалий делает подразумеваемую обувь явной и естественно звучит по-русски.
- source_word: שֵׁשׁ
  choice: тонкий лён
  rationale: שֵׁשׁ обозначает тонкую льняную ткань, связанную с богатым и почётным облачением.
- source_word: וָאֶחְבְּשֵׁךְ בַּשֵּׁשׁ
  choice: обернул тонким льном
  rationale: חבש может означать обвязать, обернуть или опоясать. В последовательности облачения «обернул» сохраняет конкретный образ и не вызывает медицинских ассоциаций.
- source_word: מֶשִׁי
  choice: шёлк
  rationale: Традиционное и вероятное значение — дорогая ткань, возможно шёлк; сохраняющаяся лексическая неопределённость отмечена в сноске.
- source_word: וָאֲכַסֵּךְ
  choice: покрыл
  rationale: Прямое значение כסה — покрывать. Этот глагол сохраняет последовательность наложения дорогих тканей.
