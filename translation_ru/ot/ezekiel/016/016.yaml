review_pass:
  verdict: revise
  source_fidelity: Основная последовательность действий и женское обращение переданы верно, как и партитивный смысл «часть одежд». Однако «святилища на высотах» превращает בָּמוֹת в святилища, расположенные на высотах, тогда как слово обозначает сами культовые «высоты»/места поклонения. Заключительное «Такого не бывало» неоправданно закрепляет спорное прочтение как утверждение о прошлом; еврейская формула лучше сохраняется как отрицание того, что подобное должно происходить и быть.
  naturalness: «Предавалась на них блуду» понятно, но порядок слов несколько тяжеловесен. «Блудила на них» короче, естественнее и сохраняет резкую пророческую метафору. «Пёстрые культовые высоты» намеренно несколько необычно, поскольку образ в оригинале необычен; сноска поясняет возможные значения.
  terminology: «Культовые высоты» сохраняет термин בָּמוֹת без ложного пространственного уточнения. «Блудила» адекватно передаёт זנה, не заменяя метафору прямым истолкованием идолопоклонства. Значение טְלֻאוֹת остаётся неуточнённым и отмечено в сноске.
