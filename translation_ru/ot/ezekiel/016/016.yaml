    rationale: 'Фраза вводит отношение местоположения («на высотах»), которого в בָּמוֹת нет: это название культовых мест, а не два отдельных элемента «святилища» + «высоты».'
  - severity: medium
    issue: «Такого не бывало» в финальной формуле
    rationale: Это утверждает отсутствие прежнего прецедента, хотя трудная еврейская формула допускает иное понимание. Нормативное «не должно происходить и не должно быть» ближе к английской аудиторской линии и не делает спорный исторический вывод.
  - severity: low
