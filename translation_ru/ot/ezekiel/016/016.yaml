  text: וַ/תִּקְחִ֣י מִ/בְּגָדַ֗יִ/ךְ וַ/תַּֽעֲשִׂי לָ/ךְ֙ בָּמ֣וֹת טְלֻא֔וֹת וַ/תִּזְנִ֖י עֲלֵי/הֶ֑ם לֹ֥א בָא֖וֹת וְ/לֹ֥א יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/016.yaml
  text: You took some of your garments and made for yourself colorful high places[a], and you prostituted yourself on them—such things should not come[b], nor should they be.
translation:
  language: ru
  text: Ты взяла часть своих одежд и устроила себе пёстрые культовые высоты[a], и блудила на них. Такого не должно происходить и не должно быть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лоскутные высоты», «разноцветные высоты» либо «разноцветные святилища». Значение редкого еврейского прилагательного не вполне ясно; вероятно, оно описывает культовые места, украшенные тканью из взятых одежд.'
    reason: lexical_alternative
  - marker: b
    text: 'Последние слова еврейского текста трудны для понимания. Буквальнее: «они не приходят, и этого не будет»; референт и смысл временных форм неясны. Возможен смысл: «такого не должно было случиться и не должно быть».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְחִי מִבְּגָדַיִךְ
  choice: Ты взяла часть своих одежд
  rationale: 'Предлог מִן передаёт партитивный смысл: взяты не обязательно все одежды, а часть из них. Женский род сохраняет обращение к Иерусалиму как к женщине.'
- source_word: וַתַּעֲשִׂי לָךְ
  choice: устроила себе
  rationale: Оборот с לָךְ имеет значение действия для собственного пользования; «устроила себе» естественно сочетается со святилищами.
- source_word: בָּמוֹת
  choice: святилища на высотах
  rationale: במה обозначает культовое место, часто связанное с незаконным поклонением. Формулировка яснее для современного читателя, чем буквальное «высоты», и сохраняет пространственно-культовый оттенок.
- source_word: טְלֻאוֹת
  choice: пёстрые
  rationale: Редкое прилагательное связано с лоскутностью или разноцветностью и, вероятно, описывает вид культовых мест, украшенных одеждами. «Пёстрые» сохраняет эту образность, не уточняя способ украшения.
- source_word: וַתִּזְנִי עֲלֵיהֶם
  choice: предавалась на них блуду
  rationale: Сохранена резкая сексуальная метафора זנה и значение עַל «на»; в контексте она изображает идолопоклонство как неверность завету.
- source_word: לֹא בָאוֹת וְלֹא יִהְיֶה
  choice: Такого не бывало и не должно быть
  rationale: Заключительная формула синтаксически трудна. Перевод сохраняет сочетание отрицания прецедента и недопустимости, не сводя его только к простому будущему времени.
theological_decisions:
- issue: Сексуальная метафора идолопоклонства
  choice: Сохранить прямое выражение «предавалась… блуду»
  alternative: Смягчить до «была неверна» или прямо истолковать как «поклонялась идолам»
  rationale: Пророческая речь намеренно изображает отступничество Иерусалима посредством резкой сексуальной метафоры. Смягчение или замена толкованием ослабили бы риторику текста.
- issue: Референт местоимения עֲלֵיהֶם
  choice: Отнести «на них» к культовым высотам/святилищам
  alternative: Отнести местоимение к покрытиям или понимать менее буквально как «при них»
  rationale: Мужской множественный суффикс естественно соотносится с בָּמוֹת по смыслу культовых мест, хотя образ может включать их тканевые украшения; буквальное пространственное отношение сохранено.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение во втором лице женского рода сохранено. «Пёстрые» передаёт зрительный образ без искусственной архаизации; «святилища на высотах» поясняет культовый смысл традиционного термина. Финальная фраза оставлена несколько необычной и снабжена примечанием из-за реальной неясности еврейского текста.
