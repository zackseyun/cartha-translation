  text: Look[a], everyone who uses proverbs about you will use this proverb, saying, ‘Like mother, like daughter.’
translation:
  language: ru
  text: 'Вот, всякий, кто говорит о тебе пословицами, будет говорить: «Какова мать, такова и дочь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-побудительную силу еврейского слова и естественно звучит в современном литературном русском.
- source_word: כָּל הַמֹּשֵׁל
  choice: всякий, кто слагает притчи
  rationale: Субстантивированное причастие имеет распределительное значение; корень משל здесь означает произнесение или составление притчи, а не господство.
- source_word: עָלַיִךְ
  choice: о тебе
  rationale: Предлог על обозначает тему притчи. Контекст допускает насмешливый оттенок, но сам предлог не требует перевода «против тебя».
- source_word: יִמְשֹׁל
  choice: скажет такую притчу
  rationale: Повтор корня משל передан естественным русским выражением; «такую» указывает на непосредственно следующую формулу, не изменяя смысла.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Функция инфинитива «говоря» естественно передаётся в русском пунктуационным введением прямой речи.
- source_word: כְאִמָּה בִּתָּהּ
  choice: Какова мать, такова и дочь
  rationale: Устойчивое русское изречение сохраняет краткость, параллелизм и выразительность еврейской пословичной формулы.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский с достоинством пророческой речи. Устойчивое «Какова мать, такова и дочь» воспроизводит афористичность оригинала. Лексическая неоднозначность корня משל разрешена самим ближайшим контекстом: речь идёт о притче, а не о правлении, поэтому сноска не требуется.'
