  text: so that you may bear your disgrace and be ashamed because of all that you have done[a], becoming a comfort to them.
translation:
  language: ru
  text: чтобы ты несла свой позор и стыдилась всего, что сделала, став для них утешением[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда будешь утешать их»; или: «утешая их». Еврейский оборот допускает несколько близких толкований.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза естественным современным русским оборотом.
- source_word: תִּשְׂאִי
  choice: ты несла
  rationale: Глагол נשׂא в сочетании с обозначением позора идиоматически означает «нести, переносить» позор.
- source_word: כְלִמָּתֵךְ
  choice: свой позор
  rationale: כְּלִמָּה обозначает позор, бесчестие или стыд; «позор» сохраняет общественный аспект, не дублируя следующий глагол «стыдилась».
- source_word: וְנִכְלַמְתְּ
  choice: и стыдилась
  rationale: Нифаль от כלם здесь естественно передаётся как состояние стыда; форма согласована с обращением к Иерусалиму в женском роде.
- source_word: מִכֹּל אֲשֶׁר עָשִׂית
  choice: всего, что сделала
  rationale: Предлог מִן после глагола стыда указывает на причину или предмет стыда; русское управление «стыдиться чего» передаёт это без добавления причинного союза.
- source_word: בְּנַחֲמֵךְ
  choice: став утешением
  rationale: Конструкция с ב и формой от נחם допускает обстоятельственное, временное или инструментальное понимание. Основной вариант естественно выражает сопутствующий результат, не устраняя неоднозначность полностью.
- source_word: אֹתָן
  choice: для них
  rationale: Местоимение женского рода множественного числа отсылает к Самарии и Содому с их дочерьми; при существительном «утешение» естественно русское «для них».
theological_decisions:
- issue: Связь стыда Иерусалима с утешением других городов в контексте восстановления
  choice: Иерусалим несёт позор и стыд, становясь утешением для них.
  alternative: Иерусалим стыдится, когда утешает их, или посредством того, что утешает их.
  rationale: Контекст Иез 16:53–55 направлен к будущему восстановлению Содома, Самарии и Иерусалима. Оборот בְּנַחֲמֵךְ допускает несколько тесно связанных синтаксических оттенков, поэтому основной текст передаёт обстоятельство становления утешением, а примечание сохраняет альтернативы.
translation_notes:
  register: Современный литературный русский язык; обращение к олицетворённому Иерусалиму выдержано в женском роде. «Нести позор» сохраняет достоинство библейского регистра, а «стыдиться всего, что сделала» звучит ясно и естественно.
