lexical_decisions:
- source_word: וַתִּגְבְּהֶינָה
  choice: они возгордились
  rationale: Глагол גבהּ буквально связан с высотой, но здесь в контексте нравственного обвинения обозначает гордость и надменность. «Возгордились» естественно передаёт изменение состояния и отрицательную оценку.
- source_word: וַתַּעֲשֶׂינָה תוֹעֵבָה
  choice: совершили мерзость
  rationale: Хотя עשה имеет широкое значение «делать», в сочетании с תוֹעֵבָה по-русски естественно «совершить мерзость». Единственное число и сильная нравственно-религиозная оценка исходного слова сохранены.
- source_word: לְפָנָי
  choice: передо Мной
  rationale: 'Передаёт буквальный пространственный образ и его контекстуальный смысл: поступок был совершён в присутствии Бога, у Него на глазах.'
- source_word: וָאָסִיר אֶתְהֶן
  choice: Я устранил их
  rationale: Каузативная форма סור означает удаление или устранение. «Устранил» сохраняет прямоту суда, не уточняя сверх текста, каким именно способом это произошло.
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: когда увидел это
  rationale: כַּאֲשֶׁר допускает временное «когда/как только» и более буквальное «как». Для естественного русского синтаксиса добавлено подразумеваемое дополнение «это», относящееся к названной мерзости; добавление отмечено сноской.
theological_decisions:
- issue: Формулировка Божьего суда
  choice: поэтому Я устранил их
  alternative: и Я удалил их
  rationale: Связь с предшествующим обвинением в контексте имеет следственный характер. «Устранил» передаёт Божье судебное действие, не заменяя его более конкретным «уничтожил» и не привнося способ исполнения суда.
- issue: Смысл заключительного оборота
  choice: когда увидел это
  alternative: как Я увидел
  rationale: Еврейский оборот краток и не называет объекта глагола. Временное прочтение хорошо согласуется с контекстом, однако подразумеваемое «это» отмечено, чтобы не скрывать формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Передо Мной» сохраняет достоинство речи и остаётся понятным; «устранил» избегает как разговорного «убрал», так и чрезмерно конкретного «уничтожил».
