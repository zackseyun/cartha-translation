  yaml_path: translation/ot/ezekiel/016/041.yaml
  text: They will burn your houses with fire and execute judgments against you before the eyes of many women[a]. I will put a stop to your prostitution[c][b], and you will no longer give payment.
translation:
  language: ru
  text: Они сожгут твои дома и совершат над тобой суд на глазах у многих женщин. Я заставлю тебя перестать блудить[a], и ты больше не будешь давать плату за блуд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Я заставлю тебя перестать быть блудницей».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово означает плату, связанную с проституцией; возможны также переводы: «плата блудницы» или «вознаграждение».'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשָׂרְפוּ בָתַּיִךְ בָּאֵשׁ
  choice: Они сожгут твои дома
  rationale: Пророческая последовательность передана будущим временем; сочетание с огнём по-русски естественно выражается самим глаголом «сожгут», без избыточного «огнём».
- source_word: וְעָשׂוּ בָךְ שְׁפָטִים
  choice: совершат над тобой суд
  rationale: Оборот означает исполнение судебного наказания. Формулировка сохраняет юридический образ и остаётся понятной в современном литературном русском.
- source_word: לְעֵינֵי נָשִׁים רַבּוֹת
  choice: на глазах у многих женщин
  rationale: Передаёт буквально выраженный мотив публичности и позора естественным русским оборотом.
- source_word: וְהִשְׁבַּתִּיךְ מִזּוֹנָה
  choice: Я заставлю тебя перестать блудить
  rationale: Каузативная форма שׁבת означает «заставить прекратить», а מִזּוֹנָה допускает понимание «перестать быть блудницей / перестать блудить». Выбран глагольный вариант, естественный для русского языка.
- source_word: אֶתְנַן
  choice: плата за блуд
  rationale: Слово обозначает плату, связанную с проституцией. Уточнение сохраняет конкретный смысл редкого термина и парадоксальный образ Иерусалима, который сам платит своим любовникам.
- source_word: לֹא תִתְּנִי עוֹד
  choice: ты больше не будешь давать
  rationale: Отрицание с עוֹד обозначает прекращение действия в будущем; перевод прямо сохраняет женский род обращения к Иерусалиму.
theological_decisions:
- issue: Сексуальная метафора неверности Иерусалима
  choice: Сохранить прямой образ блуда
  alternative: Передать обобщённо как «неверность» или «идолопоклонство»
  rationale: Текст намеренно описывает заветную неверность Иерусалима посредством резкой сексуальной метафоры; её смягчение устранило бы важное напряжение и образность главы.
- issue: Иерусалим не получает, а даёт плату
  choice: Сохранить глагол «давать» и специальное значение платы за блуд
  alternative: Переформулировать так, будто Иерусалим получает плату
  rationale: Необычная инверсия обычного поведения проститутки выражена непосредственно в еврейском тексте и не должна исправляться переводчиком.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и её намеренно резкой метафорики. Обращение к олицетворённому Иерусалиму последовательно передано в женском роде.
