    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְחָצֵךְ
  choice: омыл Я тебя
  rationale: Глагол רחץ означает «мыть, омывать, купать». «Омыл» естественно для возвышенного повествования и сохраняет конкретный образ телесного очищения.
- source_word: בַּמַּיִם
  choice: водой
  rationale: Предлог ב здесь обозначает средство действия; творительный падеж естественно передаёт смысл «водой», не исключая оттенка купания в воде.
- source_word: וָאֶשְׁטֹף
  choice: смыл
  rationale: שטף в данном контексте обозначает удаление крови посредством мытья. «Смыл» точно и естественно передаёт направленность действия, не усиливая образ до «унёс потоком».
- source_word: דָּמַיִךְ
  choice: твою кровь
  rationale: Форма דמים буквально связана с кровью; перевод «кровь» сохраняет прямой образ, тогда как «следы крови» был бы поясняющим толкованием.
- source_word: מֵעָלָיִךְ
  choice: с тебя
  rationale: Буквально «с поверхности тебя, с тебя». Русское «с тебя» естественно выражает удаление крови с тела.
- source_word: וָאֲסֻכֵךְ
  choice: умастил тебя
  rationale: סוך означает натирать или помазывать маслом. «Умастил» сохраняет телесный уход и достойный библейский регистр, не навязывая специального культового значения слова «помазал».
- source_word: בַּשָּׁמֶן
  choice: маслом
  rationale: שמן означает масло без уточнения его вида; творительный падеж передаёт средство действия без добавления «оливковым».
theological_decisions:
- issue: Характер очищения в аллегории
  choice: 'Передать буквальные действия телесного ухода внутри аллегории: омовение, удаление крови и умащение маслом.'
  alternative: Сформулировать омовение и помазание как явно заветные, культовые или сакраментальные действия.
  rationale: Сам стих описывает конкретную заботу о теле в развёрнутой аллегории Иезекииля о Иерусалиме. Богословские значения должны раскрываться из контекста, а не вноситься в формулировку перевода.
- issue: Передача סוך
  choice: «умастил», чтобы сохранить значение натирания маслом без обязательной идеи официального помазания.
  alternative: «помазал», что в русском библейском употреблении может сильнее вызывать культовые и царские ассоциации.
  rationale: Контекст допускает достоинство и заботу, но не требует толковать действие как обрядовое помазание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Инверсия «омыл Я» поддерживает последовательность действий от первого лица и торжественный тон, оставаясь понятной. Женский род местоименного объекта определяется образом Иерусалима как женщины в контексте главы.
