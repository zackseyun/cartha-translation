lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт титул אֲדֹנָי и личное имя יהוה без неестественного повтора «Господь Господь»; соответствует прямому употреблению имени Яхве.
- source_word: וְעָשִׂית אוֹתָךְ
  choice: Я поступлю с тобой
  rationale: Естественно передаёт идиому עשה + прямое дополнение в значении «поступить с кем-либо», сохраняя судебно-воздающий смысл контекста.
- source_word: כַּאֲשֶׁר עָשִׂית
  choice: так, как поступила ты
  rationale: Сохраняет сравнительную конструкцию и женский род обращения к Иерусалиму; инверсия подчёркивает соответствие воздаяния её поступку.
- source_word: בָּזִית
  choice: презрев
  rationale: Точно передаёт сильное значение неуважения и пренебрежения; деепричастная форма естественно связывает обвинение с главным высказыванием.
- source_word: אָלָה
  choice: клятву
  rationale: В контексте завета слово обозначает обязывающую клятву, которая может включать санкцию проклятия; эта смысловая возможность сохранена в сноске.
- source_word: לְהָפֵר בְּרִית
  choice: и нарушив завет
  rationale: הפר ברית — устойчивое выражение «нарушить завет». Союзное присоединение по-русски естественно передаёт тесную смысловую связь пренебрежения клятвой с нарушением завета, не утверждая узко целевого значения инфинитива.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: «Владыка Яхве» сохраняет и титул, и открытое Богом имя, избегая двусмысленности, при которой יהוה воспринималось бы как обычный титул.
- issue: Значение אָלָה в контексте завета
  choice: клятва
  alternative: проклятие; клятва с проклятием
  rationale: Непосредственная связь с нарушением завета поддерживает значение обязывающей клятвы, однако присущий слову оттенок санкции-проклятия не устраняется и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Женские формы сохраняют обращение к олицетворённому Иерусалиму. Порядок «поступила ты» слегка маркирован, но естественен и подчёркивает меру воздаяния.
