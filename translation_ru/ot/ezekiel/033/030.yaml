base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/030.yaml
  text: And you[a], son of man, the sons of your people who talk about you beside the walls and in the doorways of the houses, each one speaking with another, each man with his brother, saying[b], ‘Come now and hear what the word is that comes from Yahweh.’
translation:
  language: ru
  text: 'А ты, сын человеческий: сыны твоего народа говорят о тебе у стен и у входов в дома; они говорят один с другим, каждый — со своим братом: «Придите же и послушайте, какое слово исходит от Яхве[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выходит от Яхве»; речь идёт о пророческом слове, исходящем от Него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю, его образность и риторическую силу.
- source_word: בְּנֵי עַמְּךָ
  choice: сыны твоего народа
  rationale: Передаёт конкретную мужскую форму и формальную структуру еврейского выражения, хотя по смыслу речь идёт о представителях народа.
- source_word: הַנִּדְבָּרִים בְּךָ
  choice: говорят о тебе
  rationale: 'Предлог ב при דבר здесь естественнее понимать как указание на предмет разговора: люди обсуждают Иезекииля между собой.'
- source_word: אֵצֶל הַקִּירוֹת וּבְפִתְחֵי הַבָּתִּים
  choice: у стен и в дверях домов
  rationale: «У стен» естественно передаёт близость, а «в дверях домов» сохраняет конкретный образ мест, где люди собираются и беседуют.
- source_word: וְדִבֶּר חַד אֶת אַחַד אִישׁ אֶת אָחִיו
  choice: они говорят друг другу, каждый своему брату
  rationale: Передаёт взаимность разговора и сохраняет конкретное слово «брат», которое может обозначать соплеменника.
- source_word: בֹּאוּ נָא וְשִׁמְעוּ
  choice: пойдёмте же и послушаем
  rationale: В данном контексте приглашение говорящих естественно звучит по-русски в первом лице множественного числа; частица «же» передаёт побуждение נָא.
- source_word: מָה הַדָּבָר
  choice: какое слово
  rationale: «Слово» сохраняет пророческий регистр; вопросительное מָה здесь естественно передаётся как «какое».
- source_word: הַיּוֹצֵא מֵאֵת יְהוָה
  choice: исходит от Яхве
  rationale: «Исходит» сохраняет направленность и образ слова, выходящего от Бога, оставаясь естественным литературным русским выражением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Значение הַנִּדְבָּרִים בְּךָ
  choice: говорят о тебе
  alternative: говорят с тобой
  rationale: Контекст последующего разговора людей друг с другом поддерживает значение «обсуждают тебя», однако грамматически возможное понимание «говорят с тобой» сохранено в примечании.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис разделён на два предложения для ясности; конкретные образы «сын человеческий», «сыны народа», «брат» и «слово исходит» сохранены.
