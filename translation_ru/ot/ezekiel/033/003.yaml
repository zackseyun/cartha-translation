  text: and he sees the sword coming against the land[a], and he blows the trumpet and warns the people,
translation:
  language: ru
  text: и увидит идущий на землю меч, и затрубит в шофар[a], и предупредит народ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шофар — сигнальный рог, нередко бараний.
    reason: Лексическое пояснение древнего предмета и возможного буквального соответствия.
lexical_decisions:
- source_word: וְרָאָה
  choice: и увидит
  rationale: В условно-правовом контексте последовательная форма описывает типичную будущую ситуацию; русский совершенный вид естественно передаёт действие внутри условия, начатого в предыдущем стихе.
- source_word: הַחֶרֶב
  choice: меч
  rationale: Сохранён конкретный пророческий образ, метонимически указывающий на войну или вторжение, без истолковывающей замены в основном тексте.
- source_word: בָּאָה עַל הָאָרֶץ
  choice: идущий на страну
  rationale: Оборот передаёт направленное угрожающее приближение; «на страну» естественно сочетается с образом наступающего меча.
- source_word: הָאָרֶץ
  choice: страну
  rationale: Здесь имеется в виду территория, которой угрожает нападение, а не вся земля как мир; «страна» ясно передаёт этот смысл современному читателю.
- source_word: וְתָקַע בַּשּׁוֹפָר
  choice: и затрубит в шофар
  rationale: Глагол «затрубить» естественно обозначает подачу тревожного сигнала, а «шофар» точно называет древний сигнальный рог.
- source_word: שׁוֹפָר
  choice: шофар
  rationale: Заимствование уже употребительно в современном русском и точнее общего слова «труба»; буквальное пояснение дано в сноске.
- source_word: וְהִזְהִיר
  choice: и предупредит
  rationale: Передаёт каузативное значение — подать людям предупреждение об опасности — кратко и естественно.
- source_word: הָעָם
  choice: народ
  rationale: Обычный и контекстуально точный русский эквивалент собирательного עָם.
theological_decisions:
- issue: Метонимический смысл «меча» в пророческом предупреждении
  choice: Сохранить в основном тексте буквальный образ «меч».
  alternative: Передать истолковательно как «война» или «вражеское войско».
  rationale: Еврейский текст использует חֶרֶב; сохранение образа не устраняет возможного смысла войны, вторжения или суда и не сужает намеренно выразительную метафору.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. Синтаксис сохранён как продолжение условной конструкции предыдущего стиха; поэтому употреблены формы будущего совершенного вида. Маркер сноски поставлен непосредственно после слова «шофар».
