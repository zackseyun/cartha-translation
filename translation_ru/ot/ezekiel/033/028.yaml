base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/028.yaml
  text: And I will make the land a desolation and a waste[a], and the pride of its strength will cease, and the mountains of Israel will be desolate[b], with no one passing through.
translation:
  language: ru
  text: Я превращу землю в разорение и запустение[a]. Гордость её могущества[b] прекратится, и горы Израиля запустеют — по ним никто не будет проходить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ужас»; второе еврейское слово может обозначать разорение, вызывающее ужас или изумление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «величие её могущества». Еврейское слово может обозначать как гордость, так и величие; в данном пророчестве о суде значение «гордость» лучше соответствует контексту.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Я превращу
  rationale: Буквально глагол означает «дам» или «сделаю», но при последующих обозначениях состояния естественный русский эквивалент — «превращу».
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте речь идёт о земле Израиля, а не обо всей земле как мире; определённость в русском достаточно ясна из контекста.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: в пустыню и страшное запустение
  rationale: Передаёт парные близкие по смыслу существительные, сохраняя и картину разорения, и оттенок ужаса, вызываемого им.
- source_word: וְנִשְׁבַּת
  choice: исчезнет
  rationale: Глагол выражает прекращение или конец; «исчезнет» естественно сочетается с абстрактным существительным «гордость».
- source_word: גְּאוֹן עֻזָּהּ
  choice: гордость её могущества
  rationale: גְּאוֹן допускает значения «гордость» и «величие»; в контексте суда выбран отрицательный оттенок, а местоименный суффикс соотнесён с землёй.
- source_word: וְשָׁמְמוּ הָרֵי יִשְׂרָאֵל
  choice: горы Израиля опустеют
  rationale: Сохраняется характерное для Иезекииля выражение «горы Израиля»; в описании местности глагол означает запустение.
- source_word: מֵאֵין עוֹבֵר
  choice: никто не будет проходить через них
  rationale: Передаёт полное безлюдье и отсутствие путников; местоимение «через них» естественно относится к горам и не меняет смысла.
theological_decisions:
- issue: Значение גְּאוֹן в пророчестве о суде
  choice: гордость
  alternative: величие
  rationale: Контекст уничтожения того, на что опиралась земля, поддерживает отрицательное значение «гордость», однако нейтральное «величие» остаётся лексически возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис ясен обычному читателю; параллелизм и напряжение между возможными значениями ключевых еврейских слов сохранены.
