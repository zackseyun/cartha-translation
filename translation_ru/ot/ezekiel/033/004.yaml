  text: then if the one who hears hears the sound of the trumpet and does not take warning[a], and the sword comes and takes him away, his blood will be on his own head.
translation:
  language: ru
  text: Если кто услышит звук рога, но не примет предупреждения, и придёт меч и унесёт его, кровь его будет на его собственной голове.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кровь его будет на его голове» — древнееврейское выражение, означающее, что он сам несёт ответственность за свою смерть.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמַע הַשֹּׁמֵעַ
  choice: если кто услышит
  rationale: Сочетание личной формы глагола с субстантивированным причастием обозначает всякого услышавшего; условное «если» естественно продолжает ситуацию, начатую в предыдущем стихе. Русская формулировка избегает тяжеловесного буквального повтора «услышит слышащий».
- source_word: קוֹל הַשּׁוֹפָר
  choice: звук рога
  rationale: שׁוֹפָר — сигнальный рог; «звук» естественно передаёт קוֹל в данном контексте. Выбор сохраняет конкретный древний образ, не подменяя его современной трубой.
- source_word: וְלֹא נִזְהָר
  choice: но не внемлет предостережению
  rationale: Нифаль глагола זהר здесь указывает на принятие предупреждения всерьёз. «Не внемлет предостережению» передаёт как само предупреждение, так и ответственность человека за отсутствие реакции.
- source_word: חֶרֶב
  choice: меч
  rationale: Сохранён пророческий образ меча как орудия насильственной смерти и бедствия; более общее «враг» было бы излишним толкованием.
- source_word: וַתִּקָּחֵהוּ
  choice: и унесёт его
  rationale: Глагол לקח буквально означает «взять»; в данном контексте речь идёт о гибели. «Унесёт его» сохраняет образное выражение и делает смертельный исход понятным без прямой вставки «убьёт».
- source_word: דָּמוֹ בְרֹאשׁוֹ יִהְיֶה
  choice: кровь его будет на его же голове
  rationale: Сохранена еврейская формула ответственности за собственную смерть. Частица «же» естественно подчёркивает личную ответственность, выраженную контекстом.
theological_decisions:
- issue: Личная ответственность за пренебрежение предупреждением
  choice: кровь его будет на его же голове
  alternative: он сам будет ответственен за свою смерть
  rationale: Образная древнееврейская формула сохранена в основном тексте, поскольку она выражает ответственность с большей риторической и богословской силой; её смысл пояснён в сноске без введения дополнительных доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис условного предложения следует контексту предыдущего стиха; ключевые образы рога, меча и крови на голове сохранены.
