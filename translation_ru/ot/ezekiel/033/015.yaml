source:
  edition: WLC
  text: חֲבֹ֨ל יָשִׁ֤יב רָשָׁע֙ גְּזֵלָ֣ה יְשַׁלֵּ֔ם בְּ/חֻקּ֤וֹת הַֽ/חַיִּים֙ הָלַ֔ךְ לְ/בִלְתִּ֖י עֲשׂ֣וֹת עָ֑וֶל חָי֥וֹ יִֽחְיֶ֖ה לֹ֥א יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/015.yaml
  text: if the wicked man restores the pledge[a], repays what he has stolen, walks in the statutes of life without doing injustice, he shall surely live[b]; he shall not die.
translation:
  language: ru
  text: если нечестивый вернёт взятое в залог[a], возместит похищенное, будет поступать по установлениям жизни[b], не совершая неправды, — он непременно будет жить, не умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернёт залог». Речь идёт о вещи, взятой как обеспечение займа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет поступать по установлениям, ведущим к жизни» либо «по установлениям, дающим жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל
  choice: взятое в залог
  rationale: Передаёт предмет, удерживаемый как обеспечение займа, естественнее и точнее по-русски, чем отвлечённое «залог».
- source_word: יָשִׁיב
  choice: вернёт
  rationale: В сочетании с предметом залога прямо выражает возврат вещи её владельцу.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Сохраняет субстантивированное прилагательное в единственном числе и традиционный, но понятный современному читателю библейский регистр.
- source_word: גְּזֵלָה יְשַׁלֵּם
  choice: возместит похищенное
  rationale: Передаёт как объект грабежа или кражи, так и компенсаторную силу формы piel יְשַׁלֵּם.
- source_word: בְּחֻקּוֹת הַחַיִּים
  choice: по установлениям жизни
  rationale: Сохраняет неоднозначную связь установлений с жизнью, не уточняя, характеризуются ли они жизнью или ведут к ней.
- source_word: הָלַךְ
  choice: будет поступать
  rationale: Естественно передаёт метафору хождения как образа поведения, не создавая в русском ненужной буквальности.
- source_word: לְבִלְתִּי עֲשׂוֹת עָוֶל
  choice: не совершая неправды
  rationale: Передаёт воздержание от неправедного и несправедливого поступка в данном правовом и нравственном контексте.
- source_word: חָיוֹ יִחְיֶה
  choice: он непременно будет жить
  rationale: Наречие «непременно» воспроизводит усиление инфинитивом абсолютным при личной форме глагола.
- source_word: לֹא יָמוּת
  choice: не умрёт
  rationale: Прямо сохраняет отрицательное обещание, не конкретизируя характер смерти.
theological_decisions:
- issue: Смысл жизни и смерти в обещании завета
  choice: «он непременно будет жить, не умрёт» без дополнительного уточнения
  alternative: Физическое выживание; восстановление в отношениях завета; эсхатологическая жизнь
  rationale: Еврейский текст допускает пересечение этих смыслов; перевод сохраняет прямое обещание и богословское напряжение, не сужая его толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческо-правового контекста. «Будет поступать» естественно передаёт еврейскую метафору хождения; «установления жизни» намеренно сохраняет смысловую неоднозначность исходной конструкции.
