lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма с вау-последовательным вводит новый повествовательный эпизод; традиционная русская формула «И было» близко передаёт структуру оригинала и сохраняет достоинство пророческого стиля.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר־יְהוָה слово «слово» сохраняет как буквальный смысл, так и значение данного Богом откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени транслитерацией сохраняет присутствующее в еврейском тексте имя, не заменяя его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Естественное и точное соответствие предлогу אֶל с местоименным суффиксом первого лица.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском двоеточие естественно выполняет эту функцию и избегает тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; «Яхве» сохраняет его как имя, тогда как «Господь» представляет собой традиционную замену титулом.
- issue: Формула введения божественной речи
  choice: слово Яхве
  alternative: весть от Яхве
  rationale: Буквальное «слово Яхве» сохраняет устойчивую пророческую формулу и её богословское звучание, не сводя דָּבָר только к сообщению.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. Инфинитив לֵאמֹר передан двоеточием как естественным русским средством введения прямой речи, которая следует в следующем стихе.
