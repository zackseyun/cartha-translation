  yaml_path: translation/ot/ezekiel/033/018.yaml
  text: When a righteous man turns from his righteousness and does injustice[b][a], he shall die because of them.
translation:
  language: ru
  text: Когда праведник отступит от своей праведности и совершит беззаконие[a], он умрёт из-за этого беззакония[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неправду», «несправедливость» или «неправедность».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в них» или «ими»; местоимение стоит во множественном числе и, по смыслу, относится к совершённым неправедным делам: он умрёт из-за них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Когда ... отступит
  rationale: Предлог ב с инфинитивом שוב вводит временно-условную конструкцию. В данном контексте речь идёт не о возвращении, а об отходе от прежней праведности; «когда ... отступит» естественно передаёт этот смысл.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода обозначает отдельного праведного человека. «Праведник» точно, кратко и естественно для современного литературного русского языка.
- source_word: מִצִּדְקָתוֹ
  choice: от своей праведности
  rationale: Существительное צדקה здесь обозначает принадлежащую этому человеку праведность — его нравственное состояние и поведение. Прямой перевод сохраняет ключевой корневой контраст.
- source_word: וְעָשָׂה עָוֶל
  choice: и станет творить беззаконие
  rationale: Сочетание עשה с עָוֶל означает совершать зло или поступать неправедно. «Творить беззаконие» сохраняет нравственно-судебную весомость выражения, а «станет» передаёт переход к противоположному образу действий.
- source_word: וּמֵת
  choice: он умрёт
  rationale: Форма выражает итог в условно-временной формулировке. Будущее время по-русски естественно передаёт неизбежное следствие без добавления позднейших богословских категорий.
- source_word: בָּהֶם
  choice: из-за своих беззаконных дел
  rationale: Буквально местоименная форма имеет множественное число («в них»). По смыслу она указывает на совершённые неправедные дела как причину смерти; явное называние этих дел делает русский текст понятным, не меняя причинной связи.
theological_decisions:
- issue: Означает ли стих утрату спасения или только временный заветный и судебный приговор
  choice: 'Оставить утверждение в пределах самого текста: праведник, отступивший от праведности и творящий беззаконие, умрёт из-за этих дел.'
  alternative: Истолковать смерть либо как утрату вечного спасения, либо исключительно как физическую смерть в рамках заветного суда.
  rationale: Еврейский текст говорит о нравственном повороте и последующей смерти, но не определяет их посредством позднейших догматических категорий. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка понятна широкому читателю; традиционные слова «праведник», «праведность» и «беззаконие» сохранены ради точности и смыслового контраста.
