  text: When it comes—and look, it is coming—then they will know that a prophet has been among them.
translation:
  language: ru
  text: А когда это сбудется — вот, оно приходит, — тогда они узнают, что среди них был пророк.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: А когда это сбудется
  rationale: Глагол בוא буквально означает «приходить», но с местоименным суффиксом женского рода здесь отсылает к ранее возвещённому слову или событию; по-русски естественно передать исполнение пророчества как «это сбудется».
- source_word: הִנֵּה בָאָה
  choice: а оно непременно сбудется
  rationale: הִנֵּה акцентирует несомненность и настоятельность утверждения. Буквальное «вот, оно приходит» здесь менее естественно; «непременно» сохраняет эмфатическую силу, не превращая фразу в отдельное временное указание.
- source_word: נָבִיא הָיָה בְתוֹכָם
  choice: среди них был пророк
  rationale: Прямая и естественная передача еврейской конструкции; прошедшее время сохраняет перспективу последующего признания.
theological_decisions:
- issue: Что именно «сбудется»
  choice: Сохранить неопределённое «это»
  alternative: 'Уточнить: «это пророчество» или «сказанное»'
  rationale: Женский местоименный суффикс имеет контекстуальный референт, но сам стих прямо его не называет; уточнение сняло бы подлинную неоднозначность.
- issue: Смысл הִנֵּה во вставной фразе
  choice: Передать как уверение «непременно»
  alternative: 'Буквально: «вот, оно сбывается/приходит»'
  rationale: Контекст подчёркивает неизбежность исполнения и последующего признания пророка; выбранная формулировка сохраняет этот акцент без конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и доступная формулировка. Тире выделяют эмфатическую вставку, соответствующую הִנֵּה בָאָה.
