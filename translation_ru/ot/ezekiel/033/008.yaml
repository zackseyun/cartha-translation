source:
  edition: WLC
  text: בְּ/אָמְרִ֣/י לָ/רָשָׁ֗ע רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א דִבַּ֔רְתָּ לְ/הַזְהִ֥יר רָשָׁ֖ע מִ/דַּרְכּ֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/008.yaml
  text: When I say to the wicked[a], ‘Wicked one, you shall surely die,’ and you do not speak to warn the wicked from his way, that wicked man shall die in his iniquity, but I will require his blood from your hand.
translation:
  language: ru
  text: 'Когда Я скажу нечестивому: «Нечестивец, ты непременно умрёшь!» — а ты не скажешь, чтобы предостеречь нечестивого от его пути, то он, нечестивый, умрёт в своём беззаконии, но его кровь Я взыщу с твоей руки[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я призову тебя к ответу за его кровь».'
    reason: Смысловой перевод еврейского судебного выражения «взыскать кровь с чьей-либо руки».
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Когда Я скажу
  rationale: Предлог ב при инфинитивной форме вводит временное придаточное; русский оборот естественно передаёт временно-условный характер высказывания.
- source_word: לָרָשָׁע
  choice: нечестивому
  rationale: רָשָׁע обозначает нравственно нечестивого человека, а не только юридически виновного.
- source_word: רָשָׁע
  choice: Нечестивец
  rationale: Форма употреблена как прямое обращение; существительное сохраняет резкость и торжественность предупреждения.
- source_word: מוֹת תָּמוּת
  choice: ты непременно умрёшь
  rationale: Сочетание абсолютного инфинитива с личной глагольной формой усиливает уверенность и неизбежность.
- source_word: וְלֹא דִבַּרְתָּ
  choice: а ты не станешь говорить
  rationale: В условно-временном контексте перфект описывает возможное последующее бездействие; союз «а» естественно выражает смысловое противопоставление, не усиливая его до отдельного вывода.
- source_word: לְהַזְהִיר
  choice: чтобы предостеречь
  rationale: Hiphil от זהר здесь означает предупредить или предостеречь; выбранное слово хорошо сочетается с предлогом «от» и указывает на опасность пути.
- source_word: מִדַּרְכּוֹ
  choice: от его пути
  rationale: Сохраняется распространённая библейская метафора пути как образа поведения и образа жизни.
- source_word: הוּא רָשָׁע
  choice: он, нечестивый
  rationale: Местоимение с повторённым существительным имеет возобновляющее и подчёркивающее значение; обособленная конструкция сохраняет этот акцент.
- source_word: בַּעֲוֺנוֹ
  choice: в своём беззаконии
  rationale: עָוֹן может обозначать беззаконие и связанную с ним вину. Формулировка сохраняет предлог и не сводит выражение исключительно к причинному значению.
- source_word: וְדָמוֹ
  choice: его кровь
  rationale: Сохраняется библейская метонимия крови как отнятой жизни и ответственности за смерть.
- source_word: מִיָּדְךָ אֲבַקֵּשׁ
  choice: Я взыщу с твоей руки
  rationale: Формулировка сохраняет судебный образ требования крови «с руки» ответственного; смысловой эквивалент приведён в сноске.
theological_decisions:
- issue: Ответственность стража за отсутствие предупреждения
  choice: Нечестивый умирает в собственном беззаконии, а не вместо стража; вместе с тем Бог взыскивает с не предупредившего стража ответственность за его кровь.
  alternative: Страж принимает на себя вину нечестивого вместо него; либо слова об ответственности стража являются лишь риторическим оборотом.
  rationale: Еврейский текст одновременно утверждает, что нечестивый умрёт в своём беззаконии, и что его кровь будет взыскана с руки стража. Перевод сохраняет обе стороны напряжения, не подменяя одну другой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Прямая речь передана ясно, повтор слова «нечестивый» сохранён ради риторического акцента оригинала; архаизирующий оборот «взыщу с твоей руки» пояснён сноской.
