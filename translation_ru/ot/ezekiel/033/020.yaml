    text: 'Более буквально: «вас — каждого по его путям». Обращаясь ко всему дому Израиля, Господь подчёркивает личную ответственность каждого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: А вы говорите
  rationale: Союз ו в данном контексте вводит возражение Израиля и имеет противительный оттенок. «А вы говорите» естественно передаёт этот контраст, не усиливая его до резкого «но».
- source_word: לֹא יִתָּכֵן
  choice: несправедлив
  rationale: Нифаль глагола תכן в этом выражении означает, что образ действий Господа считают неправильным или неравным по мере. В контексте Божьего суда «несправедлив» ясно передаёт нравственно-судебный смысл.
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: Путь Господа
  rationale: דֶּרֶךְ метафорически обозначает образ действий, но буквальное «путь» понятно по-русски и сохраняет библейский образ. אֲדֹנָי передано традиционным титулом «Господь».
- source_word: אִישׁ כִּדְרָכָיו
  choice: каждого из вас по его путям
  rationale: Распределительное אִישׁ подчёркивает личную ответственность каждого человека, а единственное число местоимения в «его путям» сохраняет сочетание индивидуального суда с обращением ко всему народу.
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: Я буду судить каждого из вас
  rationale: שׁפט имеет судебное значение. Дополнение во множественном числе «вас» раскрывается распределительным אִישׁ, поэтому «каждого из вас» точно и естественно выражает смысл.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Устойчивое библейское обозначение народа Израиля сохранено как прямое обращение без добавления отсутствующего в еврейском тексте междометия.
theological_decisions:
- issue: Обвинение в несправедливости Божьего суда
  choice: Путь Господа несправедлив
  alternative: Путь Господа неправеден / неверен
  rationale: Контекст касается справедливости Божьего суда. Выбранная формулировка сохраняет судебно-нравственный смысл, тогда как возможные варианты отмечены в сноске, чтобы не скрывать широту еврейского выражения.
- issue: Личная ответственность внутри коллективного обращения
  choice: Я буду судить каждого из вас по его путям, дом Израиля
  alternative: Я буду судить вас по вашим путям, дом Израиля
  rationale: Еврейский текст соединяет обращение ко всему дому Израиля с распределительным единственным числом «каждый — по его путям». Перевод сохраняет это напряжение и подчёркивает личную ответственность, не устраняя коллективного адресата.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Синтаксис краткий и прямой; традиционные библейские выражения «путь Господа» и «дом Израиля» сохранены там, где они остаются понятными современному читателю.
