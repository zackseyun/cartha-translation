  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ צִדְקַ֣ת הַ/צַּדִּ֗יק לֹ֤א תַצִּילֶ֨/נּוּ֙ בְּ/י֣וֹם פִּשְׁע֔/וֹ וְ/רִשְׁעַ֤ת הָֽ/רָשָׁע֙ לֹֽא יִכָּ֣שֶׁל בָּ֔/הּ בְּ/י֖וֹם שׁוּב֣/וֹ מֵֽ/רִשְׁע֑/וֹ וְ/צַדִּ֗יק לֹ֥א יוּכַ֛ל לִֽ/חְי֥וֹת בָּ֖/הּ בְּ/י֥וֹם חֲטֹאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/012.yaml
  text: 'And you[a], son of man, say to the sons of your people: The righteousness of the righteous man will not deliver him in the day of his transgression, and the wickedness of the wicked man—he will not stumble by it in the day he turns from his wickedness[c][b]; and the righteous man will not be able to live by it in the day of his sin.'
translation:
  language: ru
  text: 'А ты, сын человеческий, скажи сыновьям твоего народа[a]: праведность праведника не избавит его в день его преступления[b], а беззаконие беззаконника не станет для него причиной падения[c] в день, когда он отвернётся от своего беззакония; и праведник не сможет жить благодаря ей[d] в день, когда согрешит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоему народу». Буквально: «сыновьям твоего народа».'
    reason: lexical_alternative
  - marker: b
    text: Слово פשע может также означать мятеж или сознательное нарушение.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «он не споткнётся из-за него»; еврейский текст сохраняет образ претыкания.'
    reason: lexical_alternative
  - marker: d
    text: Вероятнее всего, то есть прежней праведностью. В еврейском тексте стоит местоимение женского рода без повторения существительного, поэтому формальная связь остаётся несколько неоднозначной.
    reason: ambiguity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохранено устойчивое обращение к Иезекиилю и повторяющийся древнееврейский образ; вариант «смертный» был бы более толковательным.
- source_word: בְּנֵי עַמְּךָ
  choice: сынам своего народа
  rationale: Передана выраженная в еврейском тексте родственная формула, но местоимение оформлено естественно для русской косвенной речи.
- source_word: צִדְקַת הַצַּדִּיק
  choice: праведность праведника
  rationale: Сохранены однокоренное сочетание и противопоставление праведности и беззаконию.
- source_word: תַצִּילֶנּוּ
  choice: не избавит его
  rationale: «Избавит» передаёт каузативное значение נצל — вывести из опасности, уберечь — без излишнего догматического оттенка слова «спасёт».
- source_word: בְּיוֹם פִּשְׁעוֹ
  choice: в день его преступления
  rationale: Сохранены именная конструкция и тяжёлый смысл פשע — преступление, нарушение, мятеж; возможный оттенок бунта указан в сноске.
- source_word: רִשְׁעַת הָרָשָׁע
  choice: беззаконие беззаконника
  rationale: Сохранена корневая фигура еврейского выражения и его нравственно-судебный смысл.
- source_word: יִכָּשֶׁל בָּהּ
  choice: не повлечёт его падения
  rationale: Естественная русская формулировка сохраняет образ падения и причинную связь с прежним беззаконием; буквальный образ претыкания отмечен в сноске.
- source_word: בְּיוֹם שׁוּבוֹ מֵרִשְׁעוֹ
  choice: в день, когда он отвернётся от своего беззакония
  rationale: שוב с מן обозначает поворот прочь от прежнего поведения. «Отвернётся» ясно передаёт перемену направления, не добавляя специальной конфессиональной терминологии.
- source_word: לֹא יוּכַל לִחְיוֹת בָּהּ
  choice: не сможет жить ею
  rationale: Передана выраженная глаголом יכל невозможность, а местоимение оставлено местоимением, чтобы не устранять формальную неоднозначность исходной связи.
- source_word: בְּיוֹם חֲטֹאתוֹ
  choice: в день, когда согрешит
  rationale: Естественная современная временная конструкция точно передаёт действие חטא и сохраняет повтор слова «день».
theological_decisions:
- issue: Следует ли формулировать стих как учение об утрате спасения или о неотступности святых
  choice: 'Сохранён пророческий принцип суда по нынешнему пути человека: прежняя праведность не избавляет согрешившего, а прежнее беззаконие не губит отвернувшегося от него.'
  alternative: Истолковать стих непосредственно в категориях утраты вечного спасения либо гарантированной неотступности.
  rationale: Сам стих говорит о праведности, грехе, обращении от беззакония и жизни, не связывая эти высказывания с позднейшими систематическими формулами.
- issue: Референт בָּהּ в заключительной части
  choice: В основном тексте сохранено местоимение «ею», а в сноске указана наиболее вероятная связь с прежней праведностью и отмечена формальная неоднозначность.
  alternative: Раскрыть местоимение прямо как «своей прежней праведностью» или отнести его в более общем смысле к прежнему состоянию праведника.
  rationale: Женский род еврейского местоимения допускает связь с существительным «праведность» и поддерживает смысловой параллелизм, однако удалённость антецедента требует не скрывать некоторую формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм сохранён, но громоздкие древнееврейские обороты умеренно сглажены. Термины «праведность», «праведник», «беззаконие» и «беззаконник» поддерживают ключевое нравственно-судебное противопоставление.
