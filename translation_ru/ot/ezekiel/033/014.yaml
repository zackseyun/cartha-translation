base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/014.yaml
  text: And when I say to the wicked man[a], ‘You shall surely die,’ and he turns from his sin and does justice and righteousness,
translation:
  language: ru
  text: 'И когда Я скажу нечестивому: «Ты непременно умрёшь», а он отвернётся от своего греха и будет поступать справедливо и праведно,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאָמְרִי
  choice: И когда Я скажу
  rationale: Предлог בְּ с инфинитивной формой и суффиксом первого лица имеет здесь временное значение; по-русски оно естественно передаётся придаточным «когда Я скажу».
- source_word: לָרָשָׁע
  choice: нечестивому
  rationale: רָשָׁע обозначает нравственно виновного, нечестивого человека. Субстантивированное прилагательное сохраняет мужской род и единственное число еврейского текста, оставаясь естественным для русского библейского стиля.
- source_word: מוֹת תָּמוּת
  choice: Ты непременно умрёшь
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола подчёркивает несомненность смерти; наречие «непременно» ясно передаёт это усиление.
- source_word: וְשָׁב
  choice: а он отвернётся
  rationale: שׁוּב с מִן означает поворот прочь от прежнего поведения. Союз «а» естественно выражает возникающее в условной ситуации противопоставление, не превращая его в более сильное «но».
- source_word: מֵחַטָּאתוֹ
  choice: от своего греха
  rationale: Сохранены единственное число существительного и отнесённость греха к тому же действующему лицу; возвратное «своего» естественно по-русски.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: и станет поступать справедливо и праведно
  rationale: В данном этическом контексте עשה с парой מִשְׁפָּט и צְדָקָה описывает справедливое и праведное поведение. Два наречия сохраняют различие понятий и звучат современно, не вводя узко судебного смысла.
theological_decisions:
- issue: Представительное мужское единственное число רָשָׁע
  choice: нечестивому
  alternative: нечестивому человеку
  rationale: Русская субстантивированная форма точно сохраняет число и род и не требует добавления отсутствующего в оригинале существительного.
- issue: Различение מִשְׁפָּט и צְדָקָה
  choice: справедливо и праведно
  alternative: по справедливости и правде
  rationale: Выбранная пара сохраняет два связанных, но не тождественных нравственно-богословских понятия и при этом избегает неестественного для современного русского выражения «делать суд и правду».
- issue: Связь между угрозой смерти и обращением грешника
  choice: а он отвернётся
  alternative: и он отвернётся
  rationale: Еврейский ו допускает контекстуальное противопоставление. Русское «а» передаёт поворот ситуации, не усиливая его до категорического «но» и не снимая условной богословской напряжённости контекста.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Заглавная буква в «Я» обозначает говорящего Бога. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
