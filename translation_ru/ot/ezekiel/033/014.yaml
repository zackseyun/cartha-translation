  source_fidelity: 'В целом смысл передан верно: временная конструкция, усиление в «непременно умрёшь», обращение от греха и два члена этической пары сохранены. Однако «станет поступать» добавляет невыраженный в еврейском тексте оттенок начала действия; простой будущий глагол точнее передаёт וְעָשָׂה в данной условно-проспективной конструкции.'
  naturalness: Текст звучит современно и литературно. «Будет поступать справедливо и праведно» естественно, сохраняет библейскую торжественность без архаизации и не несёт добавочного значения «начнёт».
  terminology: '«Нечестивому», «грех», «справедливо и праведно» уместны. Последняя пара различает מִשְׁפָּט и צְדָקָה. Сноска в черновике не нужна для понимания и её формулировка «буквальнее» неточна: еврейский текст говорит «делает/поступает [с] правосудием и праведностью», а не обязательно о длительном «будет делать».'
