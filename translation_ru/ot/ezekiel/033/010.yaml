base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/010.yaml
  text: 'And you[a], son of man, say to the house of Israel, ‘Thus you have said: “Surely our transgressions and our sins are upon us, and in them we are wasting away; so how can we live?”’'
translation:
  language: ru
  text: 'А ты, сын человеческий, скажи дому Израиля: «Вот что вы сказали: „Наши преступления и грехи лежат на нас, и из-за них мы чахнем[a]. Как же нам жить?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «истлеваем», «сгниваем». Еврейский глагол обозначает постепенное разрушение, истощение или угасание под тяжестью вины и суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивое пророческое обращение в книге Иезекииля и буквально передаёт еврейский образ, не сводя его только к значению «смертный».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохраняет традиционный собирательный и заветный образ «дома», естественный для возвышенной русской библейской речи.
- source_word: כֵּן אֲמַרְתֶּם
  choice: Вот что вы говорите
  rationale: Передаёт указательную силу כֵּן и форму обращения к народу естественным современным русским языком. Перфект здесь может обозначать уже высказанное и продолжающее звучать утверждение.
- source_word: פְשָׁעֵינוּ
  choice: наши преступления
  rationale: Передаёт серьёзность פשע как сознательного нарушения или мятежа; в сочетании с «грехами» сохраняет два различных еврейских термина.
- source_word: חַטֹּאתֵינוּ
  choice: наши грехи
  rationale: Прямой и общепонятный эквивалент, сохраняющий парное употребление с «преступлениями».
- source_word: עָלֵינוּ
  choice: лежат на нас
  rationale: Естественно передаёт образ вины и её последствий как бремени, находящегося «на» говорящих.
- source_word: וּבָם
  choice: из-за них
  rationale: В данном контексте ב естественно выражает причину или основание угасания. Буквальное «в них» по-русски неясно и может создать чуждую исходному смыслу пространственную картину.
- source_word: נְמַקִּים
  choice: мы истлеваем
  rationale: Передаёт длительный процесс разрушения, увядания или разложения под тяжестью вины и суда; сохраняет сильный образ еврейского глагола.
- source_word: וְאֵיךְ נִחְיֶה
  choice: Как же нам жить?
  rationale: Естественно выражает отчаянный вопрос о возможности дальнейшей жизни; частица «же» передаёт логическую и эмоциональную связь с предшествующим признанием.
theological_decisions:
- issue: Звучит ли речь народа лишь как исповедание или также как отчаяние под судом
  choice: 'Сохранено сочетание признания вины с отчаянным вопросом: «Как же нам жить?»'
  alternative: Передать слова преимущественно как спокойное исповедание без оттенка безысходности.
  rationale: Причастная форма «истлеваем» и заключительный вопрос выражают не только признание греха, но и мучительное ощущение гибели. Перевод не предрешает последующий ответ Бога.
- issue: Связь грехов с истлеванием в וּבָם
  choice: «из-за них»
  alternative: «в них» или «под ними»
  rationale: Причинное понимание предлога уместно в контексте последствий вины и даёт ясный русский текст, не добавляя доктринального толкования.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены традиционные выражения «сын человеческий» и «дом Израиля», а синтаксис и вопрос сформулированы понятно для современного читателя.
