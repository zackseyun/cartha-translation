  text: And when a wicked man turns from his wickedness and does justice and righteousness[a], by them he shall live.
translation:
  language: ru
  text: А когда нечестивый отвратится от своего нечестия и будет поступать справедливо и праведно, на этом основании он будет жить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря этому», «из-за этого»; буквально: «на них». Еврейское выражение отсылает к справедливому и праведному поведению как к основанию, в связи с которым он будет жить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: А когда … отвратится
  rationale: Сочетание союза, предлога и инфинитива вводит временное придаточное. «А когда» естественно передаёт переход к противопоставленному случаю, а «отвратится» выражает поворот прочь от прежнего пути.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Прилагательное употреблено субстантивно в мужском роде единственного числа и обозначает представительного человека, поступающего нечестиво.
- source_word: מֵרִשְׁעָתוֹ
  choice: от своего нечестия
  rationale: 'Сохраняется корневая и смысловая связь с רָשָׁע: «нечестивый — нечестие», а также нравственная сила исходного выражения.'
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: и будет поступать по справедливости и праведности
  rationale: Глагол עשה здесь обозначает деятельное исполнение, а парные существительные — справедливое и праведное поведение. Такая формулировка современна и сохраняет оба различимых этических понятия.
- source_word: עֲלֵיהֶם
  choice: благодаря им
  rationale: Предлог עַל с местоименным суффиксом отсылает к справедливости и праведности и может обозначать основание или причину жизни. «Благодаря им» передаёт эту связь, не устраняя её богословской напряжённости.
- source_word: הוּא יִחְיֶה
  choice: он будет жить
  rationale: Местоимение усиливает субъект, а форма глагола выражает обещанный результат. Будущее время естественно для современного русского пророческо-правового высказывания.
theological_decisions:
- issue: Связь обращения, праведных поступков и жизни
  choice: Стих прямо связывает обещание жизни с тем, что нечестивый отвратился от нечестия и поступает по справедливости и праведности; фраза «благодаря им» сохранена.
  alternative: Можно было бы истолковать жизнь как зависящую исключительно от покаяния либо шире — от верности завету.
  rationale: Перевод не вводит более позднюю богословскую систему и оставляет взаимосвязь обращения, поступков и жизни в той напряжённой форме, в какой она выражена в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Парное выражение «по справедливости и праведности» сохраняет исходные существительные без архаического «творить суд и правду».
