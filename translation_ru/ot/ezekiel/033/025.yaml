source:
  edition: WLC
  text: לָ/כֵן֩ אֱמֹ֨ר אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה עַל הַ/דָּ֧ם תֹּאכֵ֛לוּ וְ/עֵינֵ/כֶ֛ם תִּשְׂא֥וּ אֶל גִּלּוּלֵי/כֶ֖ם וְ/דָ֣ם תִּשְׁפֹּ֑כוּ וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/025.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: You eat with the blood, and you lift up your eyes to your idols, and you shed blood[c][b]; shall you then possess the land?’'
translation:
  language: ru
  text: 'Поэтому скажи им: «Так говорит Господь Яхве: вы едите с кровью[a], обращаете взоры к своим идолам[b] и проливаете кровь — и после этого вы будете владеть землёй?[c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы едите над кровью» или «с кровью»; вероятно, речь идёт о мясе, съедаемом вопреки запрету употреблять кровь.'
    reason: lexical_alternative
  - marker: b
    text: Употреблённое здесь еврейское слово — презрительное обозначение идолов.
    reason: cultural_note
  - marker: c
    text: 'Возможен более буквальный перевод: «и землёй вы завладеете?» Заключительная фраза звучит как негодующий риторический вопрос.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן אֱמֹר אֲלֵיהֶם
  choice: Поэтому скажи им
  rationale: Передаёт выводное значение לָכֵן и сохраняет форму прямого пророческого поручения.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Господь Яхве
  rationale: Сохраняет традиционную формулу вестника; אֲדֹנָי передано как «Господь», а личное имя יהוה — как «Яхве».
- source_word: עַל הַדָּם תֹּאכֵלוּ
  choice: вы едите мясо с кровью
  rationale: 'Контекстуально ясная передача идиомы: подразумевается употребление мяса, из которого не удалена кровь. Слово «мясо» эксплицировано для естественного русского выражения и отмечено сноской.'
- source_word: וְעֵינֵיכֶם תִּשְׂאוּ אֶל גִּלּוּלֵיכֶם
  choice: обращаете взоры к своим идолам
  rationale: Естественно сохраняет образ направленного к идолам взгляда, который может подразумевать упование или почитание, не устраняя этой смысловой ёмкости.
- source_word: גִּלּוּלֵיכֶם
  choice: своим идолам
  rationale: «Идолы» — ясный русский эквивалент; презрительная окраска особого слова Иезекииля пояснена в сноске.
- source_word: וְדָם תִּשְׁפֹּכוּ
  choice: и проливаете кровь
  rationale: Точно воспроизводит обычную библейскую идиому, обозначающую кровопролитие.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: и после этого вы хотите владеть землёй?
  rationale: Передаёт негодующий риторический вызов, естественный в данном контексте, при этом не превращая владение землёй в безусловное утверждение.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка Господь / Господь Бог
  rationale: Различает титул אֲדֹנָי и личное имя יהוה, не скрывая имя за заменой и не сливая два элемента формулы.
- issue: Сила заключительной фразы וְהָאָרֶץ תִּירָשׁוּ
  choice: 'риторический вопрос: «и после этого вы хотите владеть землёй?»'
  alternative: 'формально более буквальное: «и землёй вы завладеете?»'
  rationale: Контекст обличения делает фразу негодующим вопросом, отрицающим обоснованность притязания на землю; выбранная формулировка не добавляет утверждения о механизме наследования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Синтаксис сохраняет нарастающий ряд обвинений и завершается резким риторическим вопросом.
