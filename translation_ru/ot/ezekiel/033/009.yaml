source:
  edition: WLC
  text: וְ֠/אַתָּה כִּֽי הִזְהַ֨רְתָּ רָשָׁ֤ע מִ/דַּרְכּ/וֹ֙ לָ/שׁ֣וּב מִמֶּ֔/נָּה וְ/לֹא שָׁ֖ב מִ/דַּרְכּ֑/וֹ ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/009.yaml
  text: But if you warn a wicked man to turn from his way[a], and he does not turn from his way, he will die in his iniquity[b]; but you will have delivered your soul.
translation:
  language: ru
  text: Но если ты предостерёг нечестивого, чтобы он отвратился от своего пути, а он не отвратился от своего пути, то он умрёт за своё беззаконие[a], а ты спас свою жизнь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умрёт в своём беззаконии».'
    reason: Еврейский предлог допускает как причинное, так и обстоятельственное понимание.
  - marker: b
    text: 'Буквально: «ты спас свою жизнь (нефеш)»; здесь речь идёт о жизни самого человека, а не обязательно о душе как нематериальной части человека.'
    reason: Сноска поясняет значение נֶפֶשׁ и более буквальную совершенную форму заключительной фразы.
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: предостерёг
  rationale: Порода hифиль глагола זהר означает «предупредить, предостеречь». «Предостерёг» естественно передаёт серьёзное предупреждение в контексте образа стража.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное в мужском роде обозначает человека, чьё поведение нравственно порочно; «нечестивый» сохраняет моральный смысл и соответствует пророческому регистру.
- source_word: מִדַּרְכּוֹ ... לָשׁוּב מִמֶּנָּה
  choice: чтобы он обратился со своего пути
  rationale: דֶּרֶךְ здесь метафорически обозначает образ жизни и поступки. «Обратился со своего пути» сохраняет метафору и выражает содержание предупреждения.
- source_word: וְלֹא שָׁב מִדַּרְכּוֹ
  choice: а он со своего пути не обратился
  rationale: Повтор слов «со своего пути» воспроизводит выразительный повтор еврейского текста, а «не обратился» сохраняет связь с предыдущей формой שׁוב.
- source_word: בַּעֲוֺנוֹ
  choice: за своё беззаконие
  rationale: Предлог ב с עָוֹן допускает как обстоятельственное «в своём беззаконии», так и причинное «за своё беззаконие». В современном русском причинная формулировка яснее, а альтернативная передача отмечена в сноске.
- source_word: נַפְשְׁךָ הִצַּלְתָּ
  choice: спасёшь свою жизнь
  rationale: נֶפֶשׁ в данном контексте означает жизнь самого стража, а не обязательно нематериальную душу; נצל в hифиле означает избавить или спасти. Русское будущее передаёт итог исполнения обязанности в условной ситуации.
- source_word: וְאַתָּה ... וְאַתָּה
  choice: Но если ты ... ты же
  rationale: Повтор личного местоимения эмфатичен. Начальное «Но» связывает стих с противопоставлением предыдущему, а «ты же» подчёркивает различие между участью нечестивого и ответственностью стража.
theological_decisions:
- issue: Значение נֶפֶשׁ в заключительной части стиха
  choice: физическая жизнь самого стража — «свою жизнь»
  alternative: «свою душу» или «самого себя»
  rationale: Контекст говорит об ответственности стража и избавлении его от вины за кровь. «Жизнь» не навязывает более позднее противопоставление души и тела и сохраняет основное контекстуальное значение נֶפֶשׁ.
- issue: Связь смерти нечестивого с его беззаконием
  choice: «умрёт за своё беззаконие»
  alternative: «умрёт в своём беззаконии»
  rationale: Еврейская конструкция допускает обстоятельственный и причинный оттенки. Основной текст естественно выражает причинную ответственность по-русски, а сноска сохраняет подлинную неоднозначность конструкции.
- issue: Ответственность стража и нечестивого
  choice: нечестивый отвечает за собственное беззаконие, а предупредивший страж избавлен от ответственности
  alternative: расширить формулировку до общего учения о спасении души
  rationale: Перевод удерживает непосредственную мысль отрывка о долге предупреждения и личной ответственности, не превращая её в утверждение иной, не выраженной здесь доктрины.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены повтор «со своего пути» и контраст «ты же»; архаизмы и конфессионально нагруженная терминология не используются.
