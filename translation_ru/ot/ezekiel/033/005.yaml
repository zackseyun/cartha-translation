  terminology: «Рог» уместно передаёт שׁוֹפָר без неоправданного осовременивания. «Кровь его будет на нём самом» сохраняет юридико-нравственную идиому, не заменяя её доктринальным толкованием. «Жизнь» контекстуально точнее «души» для נֶפֶשׁ; примечание корректно отмечает альтернативу «себя».
