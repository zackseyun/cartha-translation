base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/005.yaml
  text: He heard the sound of the trumpet and did not take warning[a]; his blood will be upon himself. But if he takes warning[b], he will save his life.
translation:
  language: ru
  text: Он услышал звук рога и не внял предупреждению[a]; кровь его будет на нём самом. Но если он внемлет предупреждению, то спасёт свою жизнь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол может также означать: «быть предупреждённым». В этом контексте: не внять предупреждению, не отреагировать на него.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавит себя». Еврейское слово נֶפֶשׁ здесь может означать «жизнь» или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הַשּׁוֹפָר
  choice: звук рога
  rationale: קוֹל означает «звук», а שׁוֹפָר — сигнальный рог. «Звук рога» сохраняет конкретный древний образ и естественно звучит в контексте стража.
- source_word: שָׁמַע
  choice: слышал
  rationale: В данном контексте глагол обозначает восприятие предупредительного сигнала; простое «слышал» точно передаёт смысл.
- source_word: נִזְהָר
  choice: принял предостережение
  rationale: Нифаль от זהר здесь означает быть предостережённым и отнестись к предупреждению должным образом. Эта формулировка подчёркивает ответственную реакцию человека и подходит для обоих употреблений.
- source_word: דָּמוֹ בּוֹ יִהְיֶה
  choice: кровь его будет на нём самом
  rationale: Сохранена еврейская судебно-нравственная идиома, возлагающая на человека ответственность за собственную гибель.
- source_word: נַפְשׁוֹ
  choice: свою жизнь
  rationale: נֶפֶשׁ может означать жизнь, самого человека или душу; здесь речь идёт о сохранении от физической смерти, поэтому контекстуально точно «жизнь».
- source_word: מִלֵּט
  choice: спасёт
  rationale: Пиэль выражает избавление, спасение от угрожающей смерти; сочетание «спасёт свою жизнь» естественно для современного русского языка.
- source_word: וְהוּא נִזְהָר
  choice: А если он примет предостережение
  rationale: Союз וְ вводит контраст с предыдущим случаем, а конструкция описывает противоположную возможность. «А если» естественно раскрывает подразумеваемое условие, не меняя смысла.
theological_decisions:
- issue: Формула ответственности в контексте суда
  choice: кровь его будет на нём самом
  alternative: он сам будет виновен в своей смерти
  rationale: Сохранение метафорической еврейской формулы передаёт как личную ответственность, так и её судебно-нравственную силу, не сводя выражение к толкованию.
- issue: Значение נֶפֶשׁ в контексте угрозы смерти
  choice: свою жизнь
  alternative: свою душу / самого себя
  rationale: Контекст говорит о физическом избавлении от гибели; «жизнь» передаёт это значение, не вводя представление о душе как отдельной нематериальной части человека.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Рог» сохраняет конкретику שׁוֹפָר; формула «кровь его будет на нём самом» намеренно сохраняет исходную идиому и её юридико-нравственную силу.
