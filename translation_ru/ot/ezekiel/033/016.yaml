  text: כָּל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לֹ֥א תִזָּכַ֖רְנָה ל֑/וֹ מִשְׁפָּ֧ט וּ/צְדָקָ֛ה עָשָׂ֖ה חָי֥וֹ יִֽחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/016.yaml
  text: None of the sins that he committed will be remembered against him[a]; he has done justice and righteousness; he shall surely live.
translation:
  language: ru
  text: Ни один из совершённых им грехов не будет поставлен ему в вину[a]. Он поступал по справедливости и правде — он непременно будет жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будет вспомнен ему»; по смыслу также: «не будет учтён против него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חטאתו אֲשֶׁר חָטָא
  choice: Ни один из совершённых им грехов
  rationale: Хотя חטאתו имеет форму единственного числа, сочетание с כָּל и последующим глаголом во множественном числе выражает собирательно-распределительный смысл. Русское множественное число естественно передаёт мысль о каждом из прежних грехов.
- source_word: לֹא תִזָּכַרְנָה לוֹ
  choice: не будет поставлен ему в вину
  rationale: Буквально оборот означает «не будет вспомнен ему», но в данном судебно-нравственном контексте речь о том, что прежние грехи не будут учитываться против человека. Выбранная формулировка естественна по-русски и сохраняет этот смысл; буквальный образ отмечен в сноске.
- source_word: מִשְׁפָּט וּצְדָקָה עָשָׂה
  choice: Он поступал по справедливости и правде
  rationale: Парное выражение обозначает справедливое и праведное поведение. «Поступал по…» передаёт עָשָׂה современно и естественно, а существительные сохраняют нравственную весомость еврейской пары.
- source_word: חָיוֹ יִחְיֶה
  choice: он непременно будет жить
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; «непременно» передаёт подчёркнутую достоверность.
theological_decisions:
- issue: Судебный смысл того, что грехи не вспоминаются
  choice: не будет поставлен ему в вину
  alternative: не будет вспомнен ему / не будет припомнен ему
  rationale: Контекст говорит о прежних грехах, которые более не учитываются против раскаявшегося человека. Перевод сохраняет судебный оттенок, не вводя в текст более поздних догматических формулировок.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Избегаются как церковнославянизмы («творил суд и правду»), так и канцелярская тяжеловесность; эмфатическое заключение передано ясно и торжественно.
