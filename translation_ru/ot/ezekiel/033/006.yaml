source:
  edition: WLC
  text: וְ֠/הַ/צֹּפֶה כִּֽי יִרְאֶ֨ה אֶת הַ/חֶ֜רֶב בָּאָ֗ה וְ/לֹֽא תָקַ֤ע בַּ/שּׁוֹפָר֙ וְ/הָ/עָ֣ם לֹֽא נִזְהָ֔ר וַ/תָּב֣וֹא חֶ֔רֶב וַ/תִּקַּ֥ח מֵ/הֶ֖ם נָ֑פֶשׁ ה֚וּא בַּ/עֲוֺנ֣/וֹ נִלְקָ֔ח וְ/דָמ֖/וֹ מִ/יַּֽד הַ/צֹּפֶ֥ה אֶדְרֹֽשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/006.yaml
  text: But if the watchman sees the sword coming and does not blow the trumpet[a], and the people are not warned, and the sword comes and takes a life from among them, that one is taken away in his iniquity[b], but I will require his blood from the watchman's hand.
translation:
  language: ru
  text: Но если страж увидит приближающийся меч и не затрубит в рог, так что народ не будет предупреждён[a], и меч придёт и погубит кого-либо из них, то этот человек погибнет за своё беззаконие, но кровь его Я взыщу с руки стража[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и народ не внемлет предупреждению». Еврейскую форму можно понять и как отсутствие предупреждения, и как отказ прислушаться к нему; основной текст подчёркивает следствие того, что страж не затрубил в рог.'
    reason: lexical_alternative
  - marker: b
    text: «Взыскать кровь с руки» — юридический оборот, означающий потребовать ответа за смерть человека.
    reason: cultural_note
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: страж
  rationale: Обозначает человека, который несёт дозор и обязан заметить опасность; «страж» естественно сохраняет образ и его пророческий смысл.
- source_word: הַחֶרֶב בָּאָה
  choice: приближающийся меч
  rationale: Конкретный образ меча сохранён как обозначение надвигающегося насилия или суда; причастная конструкция естественно передаёт действие בָּאָה.
- source_word: תָקַע בַּשּׁוֹפָר
  choice: затрубит в рог
  rationale: שׁוֹפָר — сигнальный рог; перевод сохраняет исторический предмет и функцию подачи тревоги.
- source_word: וְהָעָם לֹא נִזְהָר
  choice: так что народ не будет предупреждён
  rationale: Нифаль допускает значения «быть предупреждённым» и «внять предупреждению». Основной текст подчёркивает причинную связь с тем, что страж не подал сигнал; альтернативная возможность отмечена в сноске.
- source_word: וַתִּקַּח מֵהֶם נָפֶשׁ
  choice: унесёт жизнь кого-либо из них
  rationale: נֶפֶשׁ здесь обозначает отдельного человека или его жизнь; формулировка сохраняет единственное число и естественна по-русски.
- source_word: בַּעֲוֺנוֹ נִלְקָח
  choice: будет унесён за своё беззаконие
  rationale: עָוֹן охватывает беззаконие и связанную с ним вину; предлог בְּ в контексте допускает причинный смысл. «Унесён» поддерживает повтор глагола לקח и образ гибели от меча.
- source_word: וְדָמוֹ מִיַּד הַצֹּפֶה אֶדְרֹשׁ
  choice: но кровь его Я взыщу с руки стража
  rationale: Сохранена юридическая идиома требования ответа за смерть, а также конкретная древнееврейская образность «с руки».
theological_decisions:
- issue: Ответственность погибшего и стража
  choice: Погибший унесён за собственное беззаконие, но Бог одновременно требует со стража ответа за непредупреждённую смерть.
  alternative: Перенос вины погибшего на стража либо объяснение смерти исключительно бездействием стража.
  rationale: Еврейский текст намеренно утверждает обе стороны ответственности; перевод не устраняет это напряжение.
- issue: Значение образа меча
  choice: Сохранён буквальный образ «меча» без прямой замены на «войну», «врага» или «суд».
  alternative: Истолковать метонимию непосредственно как вторжение или Божий суд.
  rationale: Контекст допускает эти значения, но сам стих выражает их через конкретный образ, который не следует сужать в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены ключевые образы «страж», «меч», «рог», «кровь» и «рука»; причинная связь выражена естественным союзом «так что». Местоимение הוּא раскрыто как «этот человек», чтобы избежать неясной отсылки.
