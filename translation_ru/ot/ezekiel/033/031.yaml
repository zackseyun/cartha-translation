  text: וְ/יָב֣וֹאוּ אֵ֠לֶי/ךָ כִּ/מְבוֹא עָ֞ם וְ/יֵשְׁב֤וּ לְ/פָנֶ֨י/ךָ֙ עַמִּ֔/י וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/אוֹתָ֖/ם לֹ֣א יַֽעֲשׂ֑וּ כִּֽי עֲגָבִ֤ים בְּ/פִי/הֶם֙ הֵ֣מָּה עֹשִׂ֔ים אַחֲרֵ֥י בִצְעָ֖/ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/031.yaml
  text: And they come to you as people come[a], and they sit before you as my people, and they hear your words, but they do not do them; for with their mouth they speak lustful things[b], while their heart goes after their unjust gain.
translation:
  language: ru
  text: Они приходят к тебе, как приходят люди, и сидят перед тобой как Мой народ; они слушают твои слова, но не исполняют их, ибо устами выражают страстные желания[a], а сердце их гонится за наживой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое еврейское слово может означать также «чувственные желания», «любовные речи» или, возможно, «любовные песни». Выражение может описывать как содержание их слов, так и то, что они превращают слова пророка в развлечение.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за корыстной выгодой»; еврейское слово может обозначать прибыль, добываемую из жадности или неправедным путём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְבוֹא עָם
  choice: как обычно приходит народ
  rationale: Сохраняет сравнительную конструкцию и передаёт обычный, публичный характер их прихода без излишне буквального и неестественного «как приход народа».
- source_word: עַמִּי
  choice: как Мой народ
  rationale: 'Сохраняет заветное обозначение и контекстуальную иронию: внешне они занимают место Божьего народа, но услышанного не исполняют.'
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: и слушают твои слова
  rationale: В данном контексте שמע обозначает намеренное слушание; дальнейшее противопоставление показывает, что оно не приводит к послушанию.
- source_word: וְאוֹתָם לֹא יַעֲשׂוּ
  choice: но не исполняют их
  rationale: Естественно передаёт еврейский оборот «делать слова», сохраняя конкретный контраст между слушанием и исполнением.
- source_word: עֲגָבִים בְּפִיהֶם הֵמָּה עֹשִׂים
  choice: устами они выражают страстные желания
  rationale: Редкое עֲגָבִים связано со страстью или чувственным влечением, а сочетание с «устами» указывает на их словесное выражение. «Выражают» естественно передаёт необычное буквальное «делают устами», не сводя смысл непременно к песням.
- source_word: בִצְעָם
  choice: за наживой
  rationale: «Нажива» передаёт не просто нейтральную прибыль, а корыстную, нравственно сомнительную выгоду, обычно подразумеваемую словом בֶּצַע.
- source_word: לִבָּם הֹלֵךְ אַחֲרֵי
  choice: сердце их гонится за
  rationale: Сохраняет образ внутреннего стремления и направленности сердца, звуча при этом естественно по-русски.
theological_decisions:
- issue: Нравственная характеристика уст и сердца слушателей
  choice: 'Стих обличает разрыв между внешним слушанием и внутренней направленностью: устами люди выражают страстные желания, а сердцем стремятся к наживе.'
  alternative: Редкое выражение может означать льстивые заверения в любви либо то, что слушатели воспринимают слова пророка как любовную песню, в связи со следующим стихом.
  rationale: Основной текст сохраняет противопоставление уст и сердца и не ограничивает редкое слово одним узким жанровым толкованием; примечание сообщает существенные варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис сделан плавным и понятным; «Мой» написано с прописной буквы как местоимение, относящееся к Богу. Необычность и многозначность עֲגָבִים вынесена в примечание, а не устранена догматическим уточнением.
