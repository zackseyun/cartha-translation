base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/032.yaml
  text: Look[a], you are to them like a sensual song, with a beautiful voice and skillful playing; they hear your words, but they do not do them.
translation:
  language: ru
  text: 'И вот, ты для них — словно чувственная песня[a], с прекрасным голосом и искусным музыкальным исполнением: они слушают твои слова, но не исполняют их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любовная песня». Еврейское выражение может обозначать страстную или чувственную любовь; здесь слова пророка воспринимаются слушателями как привлекательное развлечение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְּךָ
  choice: И вот, ты
  rationale: Частица הִנֵּה привлекает внимание и вместе с местоименным суффиксом вводит прямое указание на то, каким слушатели воспринимают Иезекииля.
- source_word: לָהֶם
  choice: для них
  rationale: Предлог ל выражает отношение с точки зрения слушателей; естественное русское соответствие здесь — «для них».
- source_word: כְּשִׁיר עֲגָבִים
  choice: как песня о страсти
  rationale: עֲגָבִים обозначает страстное, чувственное влечение. «Песня о страсти» сохраняет привлекательный и нравственно настораживающий оттенок, не делая выражение чрезмерно откровенным.
- source_word: יְפֵה קוֹל
  choice: исполняемая красивым голосом
  rationale: Выражение буквально характеризует красоту голоса; причастная конструкция естественно связывает эту характеристику с песней.
- source_word: וּמֵטִב נַגֵּן
  choice: и с искусной игрой на музыкальном инструменте
  rationale: Сочетание формы от יטב с נגן указывает на умелое музыкальное исполнение. Уточнение «на музыкальном инструменте» передаёт обычное значение נגן и устраняет русскую двусмысленность слова «игра».
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: Они слушают твои слова
  rationale: Форма выражает реальное восприятие речи; «слушают» естественно передаёт сознательное внимание аудитории и усиливает последующий контраст.
- source_word: וְעֹשִׂים אֵינָם אוֹתָם
  choice: но не исполняют их
  rationale: עשה применительно к словам означает осуществлять сказанное. «Исполняют их» сохраняет прямой объект и естественно выражает противопоставление слушания послушанию.
theological_decisions:
- issue: Нравственный оттенок עֲגָבִים
  choice: песня о страсти
  alternative: любовная песня; чувственная песня
  rationale: Контекст обличает слушателей за то, что они воспринимают пророчество как привлекательное представление, но не повинуются ему. Выбранный вариант сохраняет оттенок сильного, возможно чувственного влечения, не сводя неоднозначное еврейское слово ни к нейтральной романтике, ни к однозначной эротике.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Образ музыкального исполнения раскрыт естественно для русского читателя, а основной контраст между внимательным слушанием и отсутствием исполнения сохранён.
