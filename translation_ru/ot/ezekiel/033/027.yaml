source:
  edition: WLC
  text: כֹּֽה תֹאמַ֨ר אֲלֵ/הֶ֜ם כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֞א אֲשֶׁ֤ר בֶּֽ/חֳרָבוֹת֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וַֽ/אֲשֶׁר֙ עַל פְּנֵ֣י הַ/שָּׂדֶ֔ה לַ/חַיָּ֥ה נְתַתִּ֖י/ו לְ/אָכְל֑/וֹ וַ/אֲשֶׁ֛ר בַּ/מְּצָד֥וֹת וּ/בַ/מְּעָר֖וֹת בַּ/דֶּ֥בֶר יָמֽוּתוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/027.yaml
  text: 'Thus you shall say to them[a], ‘Thus says the Lord GOD: As I live, surely those who are in the ruins will fall by the sword, and whoever is on the face of the field I have given to the wild animals to be devoured[c][b], and those who are in the strongholds and in the caves will die by pestilence.’'
translation:
  language: ru
  text: 'Так скажи им: «Так говорит Владыка Яхве: Живу Я! Те, кто среди развалин, непременно падут от меча; того, кто в открытом поле, Я отдал диким зверям на съедение[a]; а те, кто в укреплениях и пещерах, умрут от мора[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я отдал его дикому зверю в пищу». Единственное число, вероятно, имеет распределительный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от эпидемии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמַר ... כֹּה אָמַר
  choice: Так скажи… Так говорит
  rationale: Сохраняет формулу пророческой вести и звучит естественно в современном литературном русском.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента титула и сохраняет личное имя Яхве без неестественного повтора «Господь Господь».
- source_word: חַי אָנִי אִם לֹא
  choice: Живу Я! … непременно
  rationale: Еврейская клятвенная формула передана торжественно и понятно; אִם לֹא выражает усиленное заверение, раскрытое наречием «непременно».
- source_word: אֲשֶׁר בֶּחֳרָבוֹת
  choice: те, кто среди развалин
  rationale: חֳרָבוֹת обозначает разрушенные, опустошённые места; «среди развалин» конкретно и соответствует контексту.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: падут от меча
  rationale: Сохраняет исходный образ и высокий библейский регистр, оставаясь понятным современному читателю.
- source_word: אֲשֶׁר עַל פְּנֵי הַשָּׂדֶה
  choice: того, кто в открытом поле
  rationale: Передаёт нахождение вне укрытия; буквальное «на поверхности поля» по-русски неестественно.
- source_word: לַחַיָּה נְתַתִּיו לְאָכְלוֹ
  choice: Я отдам диким зверям на съедение
  rationale: Сохраняет грамматическое единственное число с вероятным распределительным значением и ясно передаёт назначение добычей зверям.
- source_word: בַּמְּצָדוֹת וּבַמְּעָרוֹת
  choice: в укреплениях и пещерах
  rationale: מְצָדוֹת обозначает укреплённые убежища или твердыни; нейтральное «укрепления» не вводит лишней архитектурной конкретики.
- source_word: בַּדֶּבֶר יָמוּתוּ
  choice: умрут от мора
  rationale: «Мор» — точный, ёмкий и стилистически уместный русский эквивалент דֶּבֶר как губительной эпидемии.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה; это сохраняет различие двух элементов и не привносит конфессионального толкования.
- issue: Сила клятвенной конструкции חַי אָנִי אִם לֹא
  choice: Живу Я! … непременно
  alternative: Клянусь Моей жизнью; верно, как Я жив
  rationale: Выбранная формулировка сохраняет образ Божьей жизни как основания клятвы и утвердительную силу אִם לֹא, не превращая выражение в условие.
- issue: Единственное число в נְתַתִּיו לְאָכְלוֹ
  choice: того… отдам… на съедение
  alternative: их отдам на съедение
  rationale: 'Сохранено формальное единственное число исходного текста, которое, вероятно, имеет распределительный смысл: каждого находящегося в поле.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Архаизмы сведены к минимуму; «падут от меча» и «мор» сохранены как ясные выражения высокого библейского регистра. Все сноски отмечены в основном тексте.
