  text: אֱמֹ֨ר אֲלֵי/הֶ֜ם חַי אָ֣נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם אֶחְפֹּץ֙ בְּ/מ֣וֹת הָ/רָשָׁ֔ע כִּ֣י אִם בְּ/שׁ֥וּב רָשָׁ֛ע מִ/דַּרְכּ֖/וֹ וְ/חָיָ֑ה שׁ֣וּבוּ שׁ֜וּבוּ מִ/דַּרְכֵי/כֶ֧ם הָ/רָעִ֛ים וְ/לָ֥/מָּה תָמ֖וּתוּ בֵּ֥ית יִשְׂרָאֵֽל־׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/011.yaml
  text: Say to them[a], ‘As I live,’ declares the Lord GOD, ‘I take no pleasure in the death of the wicked, but rather that the wicked turn from his way and live. Turn back, turn back from your evil ways! Why will you die[b], O house of Israel?’
translation:
  language: ru
  text: 'Скажи им: «Как жив Я, — возвещает Владыка ГОСПОДЬ, — Я не радуюсь смерти нечестивого[a], но тому, чтобы нечестивый отвернулся от своего пути и жил. Отвернитесь, отвернитесь от ваших злых путей![b] Зачем вам умирать, дом Израиля?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не желаю смерти нечестивого». Еврейский глагол может означать желание, удовольствие или благоволение.'
    reason: lexical_alternative
  - marker: b
    text: Повтор «отвернитесь, отвернитесь» усиливает призыв. В еврейском тексте здесь употреблён тот же глагол, что и выше в словах об обращении нечестивого от своего пути.
    reason: lexical_link
lexical_decisions:
- source_word: חַי אָנִי
  choice: Живу Я
  rationale: Краткая и торжественная русская формула клятвенного заверения, сохраняющая образ и силу еврейского выражения.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка ГОСПОДЬ
  rationale: נְאֻם обозначает властное пророческое провозглашение. Сочетание «Владыка ГОСПОДЬ» сохраняет оба божественных титула и позволяет отличить имя יהוה.
- source_word: אִם אֶחְפֹּץ בְּמוֹת הָרָשָׁע
  choice: не нахожу Я удовольствия в смерти нечестивого
  rationale: В клятвенной конструкции אִם выражает решительное отрицание, а חפץ может обозначать удовольствие, благоволение или желание. Формулировка сохраняет эмоционально-волевую окраску, не сужая её исключительно до решения воли.
- source_word: כִּי אִם
  choice: но в том, чтобы
  rationale: Передаёт противопоставление «не в X, но в Y» и естественно вводит желаемое действие.
- source_word: בְּשׁוּב רָשָׁע מִדַּרְכּוֹ
  choice: чтобы нечестивый обратился со своего пути
  rationale: «Обратился» сохраняет основной образ שׁוּב — поворот или возвращение — и связь с последующим повторным повелением. Единственное число оставлено как обобщённое.
- source_word: וְחָיָה
  choice: и жил
  rationale: Лаконично сохраняет связь жизни с обращением без добавления причинных или систематических пояснений.
- source_word: שׁוּבוּ שׁוּבוּ
  choice: Обратитесь, обратитесь
  rationale: Повтор императива сохранён как средство настойчивого, усиленного призыва и поддерживает лексическую связь с предыдущим שׁוּב.
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: с ваших злых путей
  rationale: Сохраняет пророческую метафору пути как образа поведения и ясную нравственную оценку.
- source_word: וְלָמָּה תָמֻתוּ
  choice: Зачем вам умирать
  rationale: Естественный современный русский риторический вопрос, передающий не только запрос о причине, но и увещание отказаться от пути к смерти.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет корпоративный образ и устойчивую пророческую форму обращения.
theological_decisions:
- issue: Отношение Бога к смерти нечестивого
  choice: Передать отсутствие у Бога удовольствия в смерти нечестивого и противопоставить этому Его благоволение к обращению и жизни.
  alternative: 'Перевести חפץ более волевым выражением: «не желаю смерти нечестивого».'
  rationale: Еврейский глагол допускает оттенки желания, удовольствия и благоволения. Выбранный вариант сохраняет широту выражения и не разрешает стихом более поздние споры о видах или уровнях божественной воли.
- issue: Обобщённое единственное число רָשָׁע
  choice: Сохранить «нечестивого / нечестивый» в единственном числе, затем перейти к прямому обращению во множественном числе.
  alternative: 'Унифицировать весь стих во множественном числе: «нечестивых… они».'
  rationale: Так воспроизводится движение еврейского текста от обобщённого отдельного нечестивого к коллективному призыву, обращённому к дому Израиля.
- issue: Значение обращения
  choice: Перевести שׁוּב как «обратиться», сохранив образ ухода с прежнего пути.
  alternative: Использовать «покаяться».
  rationale: «Покаяться» выражает богословски связанное понятие, но может скрыть конкретный повторяющийся образ поворота с пути, на котором построен еврейский призыв.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя; сохранены библейские образы «путь» и «дом Израиля», повтор повеления и различение единственного и множественного числа. Написание «ГОСПОДЬ» обозначает יהוה, тогда как «Владыка» передаёт אֲדֹנָי.
