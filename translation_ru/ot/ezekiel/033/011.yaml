  source_fidelity: 'Смысл еврейского текста в целом передан верно: торжественная клятвенная формула, отсутствие удовольствия/желания смерти нечестивого, противопоставление обращению и жизни, повторный настоятельный призыв и обращение к дому Израиля сохранены. Однако сочетания «обратился со своего пути» и особенно «обратитесь с ваших злых путей» по-русски двусмысленны: «сойти/свернуть с пути» может означать именно оставить правильный путь. Предлог «от» ясно передаёт еврейское מִן — отказ от злого пути.'
