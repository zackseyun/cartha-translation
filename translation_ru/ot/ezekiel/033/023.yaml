  text: And the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И было ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (тетраграмматон), традиционно передаваемый как «Господь»; здесь имя передано как «Яхве».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит очередное событие повествования; в устойчивой пророческой формуле естественно передаётся как «И было… слово».
- source_word: דְבַר
  choice: слово
  rationale: В сочетании דְבַר יְהוָה это традиционное и прозрачное обозначение пророческого откровения; «весть» возможно, но ослабляет связь с повторяющейся формулой.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица единственного числа прямо означает направление речи к пророку.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив לאמר вводит прямую речь, содержание которой следует в следующем стихе; по-русски эту функцию естественно выражает двоеточие без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» непосредственно передаёт имя, тогда как «Господь» заменяет его титулом; «Иегова» отражает более позднюю традиционную форму.
translation_notes:
  register: Современный литературный русский с сохранением торжественной и узнаваемой пророческой формулы. Двоеточие естественно вводит речь следующего стиха; архаическое «говоря» не используется.
