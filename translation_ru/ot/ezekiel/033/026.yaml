  text: עֲמַדְתֶּ֤ם עַֽל חַרְבְּ/כֶם֙ עֲשִׂיתֶ֣ן תּוֹעֵבָ֔ה וְ/אִ֛ישׁ אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּאתֶ֑ם וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/026.yaml
  text: You stand on your sword[a], you commit abominations, and each of you defiles his neighbor’s wife[b]. Shall you then possess the land?
translation:
  language: ru
  text: Вы полагаетесь на свой меч[a], совершаете мерзости, и каждый из вас оскверняет жену своего ближнего. Неужели вы унаследуете землю[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вы стоите на своём мече». Вероятно, имеется в виду опора на насилие или вооружённую силу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «овладеете землёй»; «будете владеть землёй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמַדְתֶּם עַל חַרְבְּכֶם
  choice: Вы полагаетесь на свой меч
  rationale: Буквально оборот означает «вы стоите на своём мече», однако в контексте он выражает опору на насилие или вооружённую силу. Выбранный перевод естественно передаёт смысл образа, а буквальная форма сохранена в сноске.
- source_word: חַרְבְּכֶם
  choice: свой меч
  rationale: חֶרֶב обозначает именно меч, а не оружие вообще; конкретный образ насилия сохранён.
- source_word: עֲשִׂיתֶן תּוֹעֵבָה
  choice: совершаете мерзости
  rationale: Существительное תּוֹעֵבָה стоит в единственном числе, но может иметь собирательное значение и обозначать отвратительные поступки как характерную практику. Русское множественное число естественно передаёт этот смысл.
- source_word: וְאִישׁ
  choice: и каждый из вас
  rationale: 'אִישׁ здесь употреблено дистрибутивно: речь идёт о каждом мужчине из группы, к которой обращён пророк.'
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: жену своего ближнего
  rationale: רֵעַ может означать ближнего, товарища или другого члена сообщества. «Ближний» сохраняет межличностный и общественный оттенок выражения.
- source_word: טִמֵּאתֶם
  choice: оскверняет
  rationale: Порода пиэль глагола טמא означает «делать нечистым, осквернять». «Оскверняет» сохраняет нравственную и ритуальную весомость слова.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: Неужели вы унаследуете землю?
  rationale: В контексте обличения фраза понята как возмущённый риторический вопрос. ירש допускает значения «унаследовать» и «овладеть, владеть»; «унаследуете» сохраняет связь земли с обещанным наследием.
theological_decisions:
- issue: Смысл заключительной фразы
  choice: 'Риторический вопрос: «Неужели вы унаследуете землю?»'
  alternative: 'Утверждение: «и вы унаследуете землю»'
  rationale: Хотя в еврейском тексте нет отдельной вопросительной частицы, контекст пророческого обличения показывает, что притязание виновных на землю ставится под сомнение, а не подтверждается.
- issue: Мужской дистрибутивный смысл
  choice: «каждый из вас … жену своего ближнего»
  alternative: Гендерно-нейтральная передача
  rationale: Форма אִישׁ и названное прелюбодеяние с женой другого мужчины предполагают конкретно мужскую группу. Выражение «каждый из вас» естественно сохраняет обращение во множественном числе, а «своего ближнего» — мужской дистрибутивный смысл.
translation_notes:
  register: Современный литературный русский язык; тон прямой, обличительный и достойный. Синтаксис сохраняет последовательность обвинений и усиливает заключительный риторический вопрос. Место маркера [b] приведено в соответствие с содержанием сноски — после фразы о наследовании земли.
