source:
  edition: WLC
  text: וַ/יְהִ֞י בִּ/שְׁתֵּ֧י עֶשְׂרֵ֣ה שָׁנָ֗ה בָּ/עֲשִׂרִ֛י בַּ/חֲמִשָּׁ֥ה לַ/חֹ֖דֶשׁ לְ/גָלוּתֵ֑/נוּ בָּא אֵלַ֨/י הַ/פָּלִ֧יט מִ/ירוּשָׁלִַ֛ם לֵ/אמֹ֖ר הֻכְּתָ֥ה הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/021.yaml
  text: And it happened in the twelfth year[a], in the tenth month, on the fifth day of the month of our exile, that the fugitive from Jerusalem came to me, saying[b], “The city has been struck down.”
translation:
  language: ru
  text: 'И было на двенадцатом году нашего изгнания, в десятом месяце, в пятый день месяца: пришёл ко мне спасшийся[a] из Иерусалима и сказал: «Город пал[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уцелевший»; буквально: «беглец».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Город взят». Буквально: «Город поражён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Краткая повествовательная формула сохраняет функцию еврейского wayyiqtol и звучит достойно, не будучи чрезмерно архаичной.
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: на двенадцатом году
  rationale: Естественная русская формула датировки; связь с «нашего изгнания» передана явно.
- source_word: בָּעֲשִׂרִי
  choice: в десятом месяце
  rationale: Слово «месяце» восполнено из следующей части еврейской формулы даты для ясности по-русски.
- source_word: בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: в пятый день месяца
  rationale: Естественная передача еврейской календарной формулы с подразумеваемым словом «день».
- source_word: לְגָלוּתֵנוּ
  choice: нашего изгнания
  rationale: «Изгнание» ясно передаёт состояние насильственного переселения и сохраняет форму первого лица множественного числа.
- source_word: הַפָּלִיט
  choice: спасшийся
  rationale: Слово обозначает человека, избежавшего бедствия; субстантивированное причастие естественно по-русски и не создаёт присущего слову «беглец» оттенка преступника.
- source_word: מִירוּשָׁלַם
  choice: из Иерусалима
  rationale: Прямая передача исходного пункта движения.
- source_word: לֵאמֹר
  choice: и сказал
  rationale: Еврейский инфинитив, вводящий прямую речь, передан естественной русской повествовательной конструкцией.
- source_word: הֻכְּתָה
  choice: пал
  rationale: В данном военном контексте это естественное русское сообщение о судьбе города; примечание сохраняет более буквальную пассивную образность «поражён».
- source_word: הָעִיר
  choice: город
  rationale: Сохранено исходное обозначение «город», хотя из контекста ясно, что речь об Иерусалиме.
