  text: בֶּן אָדָ֗ם דַּבֵּ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם אֶ֕רֶץ כִּֽי אָבִ֥יא עָלֶ֖י/הָ חָ֑רֶב וְ/לָקְח֨וּ עַם הָ/אָ֜רֶץ אִ֤ישׁ אֶחָד֙ מִ/קְצֵי/הֶ֔ם וְ/נָתְנ֥וּ אֹת֛/וֹ לָ/הֶ֖ם לְ/צֹפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/002.yaml
  text: Son of man[a], speak to the sons of your people and say to them, ‘If I bring a sword upon a land, and the people of the land take one man from among them and appoint him as their watchman,’
translation:
  language: ru
  text: 'Сын человеческий, обратись к сынам своего народа и скажи им: «Если Я наведу меч[a] на землю и жители этой земли выберут из своей среды одного мужчину и поставят его своим стражем,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Меч здесь — традиционный образ войны или суда.
    reason: Поясняется переносное употребление конкретного древнееврейского образа без его замены в основном тексте.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранено обычное для книги Иезекииля обращение к пророку и его литературная функция; более разъяснительные варианты вроде «смертный» излишне сужают значение.
- source_word: דַּבֵּר אֶל בְּנֵי עַמְּךָ
  choice: обратись к сынам своего народа
  rationale: «Обратись к» естественно передаёт повеление говорить адресатам и избегает тяжеловесного повтора перед «скажи им»; «сынам» сохраняет явно мужскую форму и библейский коллективный оборот.
- source_word: אֶרֶץ כִּי אָבִיא עָלֶיהָ חָרֶב
  choice: Если Я наведу меч на какую-либо землю
  rationale: כִּי здесь вводит условный пример; «какую-либо землю» передаёт неопределённость существительного без артикля. Конкретный образ меча сохранён, а не заменён толкованием «война».
- source_word: עַם הָאָרֶץ
  choice: народ той земли
  rationale: Естественный русский эквивалент обычного коллективного выражения; указательное «той» ясно отсылает к уже упомянутой земле.
- source_word: אִישׁ אֶחָד מִקְצֵיהֶם
  choice: выберет из своей среды одного мужчину
  rationale: «Из своей среды» передаёт идиоматический смысл מִקְצֵיהֶם, а «мужчину» сохраняет явную мужскую референцию אִישׁ.
- source_word: וְנָתְנוּ אֹתוֹ לָהֶם לְצֹפֶה
  choice: поставит его своим стражем
  rationale: Русский глагол «поставит» естественно передаёт назначение на роль; «страж» сохраняет ключевой для контекста образ наблюдающего и предупреждающего человека.
theological_decisions:
- issue: Гендерно маркированный язык представителей народа
  choice: Сохранены «сыны» и «мужчина»
  alternative: «твой народ» и «одного человека»
  rationale: Формы בְּנֵי и אִישׁ явно мужские. Перевод сохраняет эту маркированность, не делая из неё дополнительного богословского утверждения.
- issue: Образ меча
  choice: Сохранён буквальный образ «меч»
  alternative: «война» или «кара»
  rationale: Меч может обозначать войну и Божий суд, но сам стих оставляет образ конкретным; замена на одно толкование сняла бы смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Начатая условная конструкция намеренно оставлена незавершённой и оканчивается запятой, поскольку её продолжение находится в следующем стихе; открытая кавычка также предполагает продолжение прямой речи.
