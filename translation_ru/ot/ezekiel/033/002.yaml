- from: 'Сын человеческий, обратись к сынам своего народа и скажи им: «Если Я наведу меч[a] на какую-либо землю и народ той земли выберет из своей среды одного мужчину и поставит его своим стражем,'
  to: 'Сын человеческий, обратись к сынам своего народа и скажи им: «Если Я наведу меч[a] на землю и жители этой земли выберут из своей среды одного мужчину и поставят его своим стражем,'
  rationale: 'Исправлено только выражение субъекта и числа глаголов в заключительной части: «жители этой земли ... выберут ... поставят» прямо передаёт множественные формы оригинала и остаётся современным литературным русским. «На землю» сохраняет общий, условный характер древнееврейского אֶרֶץ без неестественного для русского усиления «какую-либо». Открытая кавычка и финальная запятая сохранены, поскольку условное предложение и прямая речь продолжаются в следующем стихе.'
