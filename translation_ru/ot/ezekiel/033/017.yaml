  text: וְ/אָמְרוּ֙ בְּנֵ֣י עַמְּ/ךָ֔ לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י וְ/הֵ֖מָּה דַּרְכָּ֥/ם לֹֽא יִתָּכֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/017.yaml
  text: Yet the sons of your people say[a], ‘The way of the Lord is not just,’ though it is their own way that is not just.
translation:
  language: ru
  text: 'Но сыновья твоего народа говорят: «Путь Господа несправедлив[a]», хотя несправедлив как раз их собственный путь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неправилен»; то же во втором случае.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Но ... говорят
  rationale: Союз וְ в данном контексте вводит противопоставление предшествующему Божьему объяснению; «но» естественно передаёт этот оттенок в русском повествовании.
- source_word: בְּנֵי עַמְּךָ
  choice: люди из твоего народа
  rationale: Буквально — «сыновья твоего народа», но здесь это древнееврейское обозначение людей, принадлежащих к народу адресата. Выбран современный и естественный русский эквивалент без архаического оборота «сыны народа твоего».
- source_word: לֹא יִתָּכֵן
  choice: несправедлив
  rationale: Нифаль глагола תכן здесь выражает оценку как правильного, должного или справедливого. В контексте спора о Божьем суде «несправедлив» точно передаёт нравственно-судебный смысл обвинения.
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: Путь Господа
  rationale: Сохраняется образ «пути» и конструкция исходного текста; אֲדֹנָי передано обычным русским титулом «Господь».
- source_word: וְהֵמָּה
  choice: хотя ... как раз их
  rationale: Самостоятельное местоимение הֵמָּה имеет подчёркнуто-противительный характер. Обороты «хотя» и «как раз их» передают риторический разворот обвинения на самих говорящих.
- source_word: דַּרְכָּם
  choice: их собственный путь
  rationale: «Собственный» явно выражает заложенное в контексте противопоставление пути Господа пути самих обвинителей.
- source_word: לֹא יִתָּכֵן
  choice: несправедлив
  rationale: Одинаковый перевод обоих употреблений сохраняет намеренный словесный повтор и риторическое обращение обвинения против говорящих.
theological_decisions:
- issue: Нравственная оценка «пути» Господа
  choice: В обоих предложениях перевести לֹא יִתָּכֵן как «несправедлив»
  alternative: «неправилен» или «неверен»
  rationale: Контекст Иезекииля 33 посвящён справедливости Божьего суда и ответственности человека. «Несправедлив» сохраняет силу обвинения, не добавляя к тексту богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис подчёркивает контраст исходного текста, избегая как ненужной архаики, так и разговорной формулировки.
