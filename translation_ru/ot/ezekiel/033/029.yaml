base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/029.yaml
  text: Then they will know that I am Yahweh[b][a], when I make the land a desolation and a waste because of all the abominations that they have committed.
translation:
  language: ru
  text: Тогда[a] они узнают, что Я — Яхве, когда Я превращу землю в запустение и разорение[b] из-за всех мерзостей, которые они совершили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И они узнают». Еврейский союз может означать простое «и», однако в данном контексте, вероятно, указывает на результат.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «в запустение и ужас». Второе еврейское слово может обозначать не только разорение, но и вызываемые им потрясение и ужас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Тогда они узнают
  rationale: Союз וְ в данном контексте связывает признание Яхве с предшествующим судом как его результатом; «тогда» естественно передаёт эту последовательность, не устраняя возможности простого «и».
- source_word: כִּי
  choice: что
  rationale: כִּי вводит содержание того, что они узнают, а не причину.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּתִתִּי
  choice: когда Я превращу
  rationale: Предлог בְּ с инфинитивом задаёт временное обстоятельство; נתן в сочетании с землёй и обозначениями опустошения указывает на приведение земли в названное состояние.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте Иезекииля имеется в виду конкретная земля Израиля/Иудеи, а не вся земля как мир.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: в пустыню и разорение
  rationale: Сохранена парная именная конструкция, передающая полное опустошение; второе слово может также указывать на ужас, вызываемый разорением.
- source_word: עַל כָּל תּוֹעֲבֹתָם
  choice: из-за всех мерзостей
  rationale: עַל выражает основание или причину суда, а «мерзости» сохраняет вес пророческого обличения.
- source_word: אֲשֶׁר עָשׂוּ
  choice: которые они совершили
  rationale: С существительным «мерзости» глагол «совершили» звучит естественно и точно передаёт עשה.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Связь опустошения земли с совершёнными мерзостями
  choice: из-за всех мерзостей
  alternative: за все мерзости
  rationale: Причинная формулировка сохраняет прямую связь между поступками народа и судом, не уточняя сверх текста характер воздаяния.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; парность еврейских обозначений опустошения сохранена, а неоднозначность второго слова вынесена в сноску.
