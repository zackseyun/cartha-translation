  text: וְ/יַד יְהוָה֩ הָיְתָ֨ה אֵלַ֜/י בָּ/עֶ֗רֶב לִ/פְנֵי֙ בּ֣וֹא הַ/פָּלִ֔יט וַ/יִּפְתַּ֣ח אֶת פִּ֔/י עַד בּ֥וֹא אֵלַ֖/י בַּ/בֹּ֑קֶר וַ/יִּפָּ֣תַח פִּ֔/י וְ/לֹ֥א נֶאֱלַ֖מְתִּי עֽוֹד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/022.yaml
  text: The hand of Yahweh had been upon me in the evening[a], before the fugitive came, and he opened my mouth until he came to me in the morning. So my mouth was opened, and I was no longer mute.
translation:
  language: ru
  text: Рука Яхве была на мне вечером, прежде чем ко мне пришёл уцелевший[a]. Он открыл мне уста к тому времени, когда тот пришёл ко мне утром. Уста мои открылись, и я больше не был немым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беглец». Еврейское слово обозначает человека, который спасся бегством и уцелел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַד יְהוָה
  choice: Рука Яхве
  rationale: Сохранён характерный пророческий образ, обозначающий могущественное действие Яхве на пророка; личное имя передано как «Яхве».
- source_word: הָיְתָה אֵלַי
  choice: была на мне
  rationale: Естественно передаёт состояние пророка под действием руки Яхве без внесения отсутствующего в форме глагола дополнительного значения начала действия.
- source_word: בָּעֶרֶב
  choice: вечером
  rationale: Прямое и естественное обозначение времени в современном русском языке.
- source_word: לִפְנֵי בּוֹא הַפָּלִיט
  choice: прежде чем пришёл спасшийся
  rationale: הַפָּלִיט обозначает человека, который избежал бедствия и уцелел; «спасшийся» передаёт и бегство, и выживание без возможной уголовной окраски слова «беглец».
- source_word: וַיִּפְתַּח אֶת פִּי
  choice: Он открыл мои уста
  rationale: Сохранён буквальный образ, связанный с прежней немотой Иезекииля; прописная буква уточняет наиболее естественного деятеля — Яхве.
- source_word: עַד בּוֹא אֵלַי בַּבֹּקֶר
  choice: до того, как тот пришёл ко мне утром
  rationale: עַד выражает временной предел; местоимение «тот» отличает пришедшего спасшегося от Яхве и снимает неестественную для русского местоименную двусмысленность.
- source_word: וַיִּפָּתַח פִּי
  choice: открылись мои уста
  rationale: Возвратная конструкция естественно передаёт нифаль и сохраняет повтор ключевого образа.
- source_word: וְלֹא נֶאֱלַמְתִּי עוֹד
  choice: и я больше не был немым
  rationale: Точно и ясно передаёт прекращение состояния немоты в повествовательном контексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Кто открыл уста пророка
  choice: Яхве
  alternative: Безличное или неуточнённое действие
  rationale: Хотя подлежащее при וַיִּפְתַּח прямо не повторено, ближайший смысловой деятель — Яхве, чья рука была на пророке; это согласуется с контекстом дарованной и снятой Богом немоты.
- issue: Соотношение двух мужских субъектов
  choice: «Он» относится к Яхве, «тот» — к спасшемуся
  alternative: Сохранить одинаковое местоимение и допустить синтаксическую двусмысленность
  rationale: Еврейский контекст допускает определение референтов по ходу повествования, тогда как одинаковое русское «он» способно ошибочно представить Яхве пришедшим утром. Различение не устраняет содержательную напряжённость конструкции с עַד.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены библейские образы «рука Яхве» и «открыть уста»; устаревшая форма «уста» здесь оправдана устойчивостью и торжественным регистром, оставаясь понятной широкому читателю.
