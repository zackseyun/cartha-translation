  text: בֶּן אָדָ֗ם יֹ֠שְׁבֵי הֶ/חֳרָב֨וֹת הָ/אֵ֜לֶּה עַל אַדְמַ֤ת יִשְׂרָאֵל֙ אֹמְרִ֣ים לֵ/אמֹ֔ר אֶחָד֙ הָיָ֣ה אַבְרָהָ֔ם וַ/יִּירַ֖שׁ אֶת הָ/אָ֑רֶץ וַ/אֲנַ֣חְנוּ רַבִּ֔ים לָ֛/נוּ נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/024.yaml
  text: Son of man, the inhabitants of these ruins on the land of Israel are saying, ‘Abraham was only one man, yet he possessed the land; but we are many—the land has been given to us as a possession.’
translation:
  language: ru
  text: 'Сын человеческий, жители этих развалин на земле Израиля говорят: «Авраам был один, однако он овладел этой землёй; а нас много — значит, эта земля отдана нам во владение».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי הֶחֳרָבוֹת הָאֵלֶּה
  choice: жители этих развалин
  rationale: Причастие יֹשְׁבֵי обозначает живущих или обитающих, а חֳרָבוֹת — разрушенные места, развалины; перевод сохраняет конкретный образ людей, поселившихся среди руин.
- source_word: אֶחָד הָיָה אַבְרָהָם
  choice: Авраам был один
  rationale: 'Сохраняет краткость и аргумент говорящих: один Авраам получил землю, тогда как их много. Частицу «только» не добавляем, поскольку в еврейском тексте она выражена лишь имплицитно.'
- source_word: וַיִּירַשׁ אֶת־הָאָרֶץ
  choice: однако он овладел этой землёй
  rationale: ירשׁ в данном контексте означает вступить во владение, овладеть. Союз «однако» естественно передаёт подразумеваемое противопоставление между одиночеством Авраама и обладанием землёй.
- source_word: לָנוּ נִתְּנָה הָאָרֶץ לְמוֹרָשָׁה
  choice: значит, эта земля отдана нам во владение
  rationale: Пассив נִתְּנָה передан без прямого называния дающего, а לְמוֹרָשָׁה — как устойчивое владение. «Значит» раскрывает вывод в рассуждении жителей, не меняя его содержания.
theological_decisions:
- issue: Основание притязания жителей на землю
  choice: Передать их слова как заявление и вывод, не подтверждая его истинность голосом переводчика
  alternative: Сформулировать так, будто Бог несомненно даровал им землю
  rationale: В контексте это самоуверенное утверждение жителей, которое далее опровергается. Пассивная форма оригинала не называет прямо Бога и сохраняет риторическое напряжение.
- issue: Значение ירשׁ применительно к Аврааму
  choice: овладел этой землёй
  alternative: унаследовал землю
  rationale: «Унаследовал» может создать впечатление получения имущества после смерти прежнего владельца; «овладел» точнее передаёт широкий библейско-еврейский смысл ירשׁ, при этом не снимает напряжения с повествованием о пребывании Авраама как пришельца.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Обращение «Сын человеческий» сохранено как устойчивое пророческое именование. Реплика оформлена естественно, с ясным противопоставлением «один — много».
