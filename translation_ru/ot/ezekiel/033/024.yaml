  source_fidelity: 'В целом смысл передан верно: жители разрушенных мест противопоставляют единственного Авраама своему множеству и на этом основании заявляют о праве на землю. Однако עַל־אַדְמַת יִשְׂרָאֵל буквально и контекстуально лучше передать «на земле Израиля», а не «в земле Израиля».'
  naturalness: Текст звучит современно и ясно. «На земле Израиля» естественно для обозначения местонахождения среди развалин и точнее сохраняет образ оригинала.
  terminology: «Сын человеческий», «Авраам», «развалины» и «во владение» уместны. Пассив «отдана нам» корректно не называет подателя и не утверждает правомерность заявления говорящих.
