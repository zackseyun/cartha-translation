  text: בְּ/אָמְרִ֤/י לַ/צַּדִּיק֙ חָיֹ֣ה יִֽחְיֶ֔ה וְ/הֽוּא בָטַ֥ח עַל צִדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל כָּל צדקת/ו לֹ֣א תִזָּכַ֔רְנָה וּ/בְ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה בּ֥/וֹ יָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/013.yaml
  text: When I say to the righteous man[a], ‘He shall surely live,’ and he trusts in his righteousness and does injustice, none of his righteous deeds will be remembered[b], but by the injustice that he has done he shall die.
translation:
  language: ru
  text: 'Когда Я скажу праведнику: «Он непременно будет жить», а он положится на свою праведность и совершит беззаконие, ни одно из его праведных дел[a] не будет вспомнено; за совершённое им беззаконие[b] он умрёт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вся его праведность не будет вспомнена». Еврейское множественное число может собирательно обозначать его праведные поступки.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «в этом беззаконии он умрёт» или «из-за него он умрёт». Местоимение относится к совершённому им беззаконию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי לַצַּדִּיק
  choice: Когда Я скажу праведнику
  rationale: Конструкция с בְּ и формой אָמְרִי вводит придаточное времени; форма первого лица сохраняет прямую речь Бога.
- source_word: חָיֹה יִחְיֶה
  choice: Он непременно будет жить
  rationale: Инфинитив абсолютный при имперфекте усиливает утверждение; «непременно» передаёт эмфатическую конструкцию без архаизации.
- source_word: בָטַח עַל צִדְקָתוֹ
  choice: понадеется на свою праведность
  rationale: בָטַח с עַל выражает опору или упование на что-либо. Совершенный вид естественно обозначает последующий поворот в поведении.
- source_word: וְעָשָׂה עָוֶל
  choice: и совершит беззаконие
  rationale: עָוֶל означает неправду, несправедливость или беззаконие; выбранное слово уместно в торжественном судебно-нравственном контексте и повторяется далее.
- source_word: כָּל צִדְקֹתָו לֹא תִזָּכַרְנָה
  choice: ни одно из его праведных дел не будет вспомнено
  rationale: Множественное צִדְקֹתָו может обозначать совокупность праведных поступков; отрицательная русская конструкция ясно передаёт, что не будет вспомнено ни одно из них.
- source_word: וּבְעַוְלוֹ אֲשֶׁר עָשָׂה בּוֹ יָמוּת
  choice: за совершённое им беззаконие он умрёт
  rationale: Предлог בְּ допускает значение сферы, основания или причины. «За» естественно передаёт причинно-судебную связь, тогда как возможные более буквальные значения отмечены в сноске.
theological_decisions:
- issue: Предполагает ли предупреждение определённую доктрину о стойкости или отпадении
  choice: Передать предупреждение прямо как реальное условно-судебное высказывание о праведнике, который начинает полагаться на свою праведность и совершает беззаконие.
  alternative: Ослабить предупреждение как чисто гипотетическое либо истолковать его в терминах конкретной позднейшей богословской системы.
  rationale: Еврейский текст утверждает, что прежние праведные дела не будут вспомнены, если праведник совершит беззаконие. Перевод сохраняет напряжение текста и не решает за него последующие доктринальные споры.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой и судебной речи. Местоимение «Я» написано с прописной буквы как указание на говорящего Бога; архаические обороты не используются. Третье лицо внутри цитаты сохранено вслед за еврейским текстом.
