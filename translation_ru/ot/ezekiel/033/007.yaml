base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/007.yaml
  text: And you[a], son of man, I have made you a watchman for the house of Israel[b]; when you hear a word from my mouth, you shall warn them from me.
translation:
  language: ru
  text: А тебя, сын человеческий[a], Я поставил стражем для дома Израиля[b]. Когда услышишь слово из Моих уст, предупреди их от Моего имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын человека»; это повторяющееся обращение к Иезекиилю можно понимать также как «смертный» или просто «человек».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я дал тебя стражем дому Израиля». В данном обороте «дал» означает «поставил» или «назначил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Буквально передаёт устойчивое обращение к Иезекиилю и сохраняет его повторяющийся литературный образ; в примечании поясняется идиоматический смысл.
- source_word: צֹפֶה
  choice: страж
  rationale: Обозначает наблюдателя, обязанного заметить опасность и предупредить народ; слово естественно поддерживает развёрнутую в контексте метафору.
- source_word: נְתַתִּיךָ
  choice: Я поставил тебя
  rationale: Буквальное значение глагола — «дал», но в конструкции с обозначением должности он выражает назначение; «поставил» точно и естественно передаёт этот смысл.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Предлог указывает, по отношению к кому пророк поставлен стражем; «для» ясно передаёт порученную ему роль.
- source_word: וְשָׁמַעְתָּ
  choice: когда услышишь
  rationale: В последовательности поручения форма обозначает обстоятельство, при наступлении которого пророк должен предупредить народ; временная конструкция естественна по-русски.
- source_word: מִפִּי דָּבָר
  choice: слово из Моих уст
  rationale: Сохраняет конкретный антропоморфный образ непосредственной Божьей речи, не заменяя «слово» более толковательным «вестью».
- source_word: וְהִזְהַרְתָּ אֹתָם מִמֶּנִּי
  choice: предупреди их от Моего имени
  rationale: Передаёт обязанность сообщить народу предупреждение, исходящее от Бога. Буквальное «предупреди их от Меня» по-русски могло бы ошибочно означать предупреждение об опасности, исходящей от Бога.
theological_decisions:
- issue: Смысл обращения בֶן אָדָם
  choice: сын человеческий
  alternative: смертный; человек
  rationale: Сохранена традиционная буквальная форма повторяющегося обращения к пророку, а возможный идиоматический смысл указан в примечании без отождествления этого обращения с позднейшим титульным употреблением.
- issue: Связь между слышанием слова и обязанностью предупредить
  choice: Когда услышишь … предупреди
  alternative: И услышишь … и предупредишь
  rationale: 'Еврейская последовательность допускает формально сочинительную передачу, но в данном поручении ясно выражена обусловленная ситуация: получив Божье слово, пророк обязан передать предупреждение. Русская временная конструкция сохраняет эту связь и повелительную силу контекста.'
- issue: Значение מִמֶּנִּי при предупреждении
  choice: от Моего имени
  alternative: от Меня
  rationale: Выбрана передача источника и полномочия предупреждения. Она не превращает Бога в предмет, от которого пророк будто бы должен предостеречь народ, хотя более буквальная формулировка отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис упрощён до двух предложений для ясности. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией; архаизмы и канцелярская лексика избегаются.
