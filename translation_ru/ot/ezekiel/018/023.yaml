base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/023.yaml
  text: Do I take any pleasure at all in the death of the wicked? declares the Lord GOD[c][b][a]. Is it not rather in his turning from his ways and living?
translation:
  language: ru
  text: «Разве Я хоть сколько-нибудь желаю смерти нечестивого? — возвещает Владыка Господь[a]. — Разве не желаю Я, чтобы он отвратился от своих путей и жил?[b]»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский титул: «Владыка Яхве» (אֲדֹנָי יְהוִה). Божье имя יהוה в основном тексте передано традиционным словом «Господь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Разве не в том [Моё желание], что он отворачивается от своих путей и живёт?» Еврейское выражение буквально говорит «в его обращении от путей его и жизни»; оно может передавать обстоятельственный смысл: «когда он отвратится от своих путей и будет жить». Глагол «желать» также может означать «находить удовольствие» или «радоваться».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחָפֹץ אֶחְפֹּץ
  choice: Разве Я хоть сколько-нибудь желаю
  rationale: Инфинитив абсолютный при личной форме усиливает глагольную идею. Выражение «хоть сколько-нибудь» естественно передаёт усиление в русском риторическом вопросе, а «желаю» сохраняет возможный волевой оттенок חפץ, не исключая значения удовольствия или благоволения.
- source_word: מוֹת
  choice: смерти
  rationale: Существительное обозначает смерть как событие или состояние; русская конструкция «желать смерти» точно и естественно передаёт еврейское сочетание.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное обозначает отдельного нечестивого человека в обобщённом смысле. Единственное число сохранено без добавления слова «человек».
- source_word: נְאֻם
  choice: возвещает
  rationale: В пророческой формуле слово обозначает властное изречение. «Возвещает» звучит современно и торжественно, сохраняя характер пророческой речи.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: «Владыка» передаёт אֲדֹנָי, а традиционное русское «Господь» — имя יהוה; сочетание различает оба компонента титула и избегает неестественного «Господь Господь».
- source_word: הֲלוֹא
  choice: Не того ли Я желаю
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ. Добавленное по-русски «того» ясно выражает противопоставление предыдущему вопросу, не меняя смысла.
- source_word: בְּשׁוּבוֹ
  choice: чтобы он обратился
  rationale: Сочетание предлога с инфинитивом может передавать обстоятельственное «когда он обратится» либо объект желаемого в контексте חפץ. Конструкция «желаю, чтобы» естественна по-русски, а альтернативная временная связь отмечена в сноске.
- source_word: מִדְּרָכָיו
  choice: со своих путей
  rationale: Сохранена библейская метафора путей как образа поведения и образа жизни, а также форма множественного числа с притяжательным значением.
- source_word: וְחָיָה
  choice: и жил
  rationale: Форма может выражать последующее действие или результат обращения. Простое сочинение «и жил» сохраняет эту смысловую открытость, не навязывая исключительно целевое «чтобы жить» или результативное «тогда будет жить».
theological_decisions:
- issue: Отношение Бога к смерти нечестивого и его обращению
  choice: Стих передан как риторическое отрицание желания смерти нечестивого и утверждение желания его обращения и жизни.
  alternative: «Разве Я нахожу хоть какое-нибудь удовольствие в смерти нечестивого?.. Не в том ли, что он обращается со своих путей и живёт?»
  rationale: חפץ охватывает значения желания, благоволения и удовольствия. Основной текст использует «желать», но сноска сохраняет аффективный оттенок. Формулировка не превращает стих в систематическое учение о Божьей воле и сохраняет напряжение между судом и милостью.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим регистром. Риторическая пара вопросов сохранена. Метафора «пути» оставлена ради образности и межтекстовой связи. Пунктуация оформляет формулу пророческого возвещения как вставку, не утяжеляя синтаксис.
