  terminology: '«Нечестивый», «пути», «жил» и «Владыка Господь» уместны для пророческого регистра. Сноску о божественном имени следует сформулировать точнее: «Владыка Яхве» — передача титула, а не буквальный русский эквивалент, и важно объяснить, что «Господь» представляет יהוה.'
