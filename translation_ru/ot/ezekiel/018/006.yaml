base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/006.yaml
  text: he does not eat on the mountains[a], does not lift up his eyes to the idols of the house of Israel, does not defile his neighbor’s wife[c][b], and does not approach a woman during her menstrual impurity.
translation:
  language: ru
  text: на горах не ест[a], не поднимает глаз к мерзким идолам дома Израиля[b], не оскверняет жену ближнего своего и не приближается[c] к женщине во время её месячной нечистоты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ест у святилищ на высотах»; речь идёт об участии в жертвенных трапезах на культовых высотах.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово, переведённое как «мерзкие идолы», представляет собой резко презрительное обозначение ложных богов.
    reason: lexical_alternative
  - marker: c
    text: «Не приближается» — еврейский эвфемизм, означающий, что он не вступает с ней в половую связь.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־הֶהָרִים ... אָכָל
  choice: на горах не ест
  rationale: Сохраняет конкретный образ еврейского выражения и порядок отрицания; в контексте речь идёт об участии в жертвенных трапезах на высотах, что пояснено в сноске.
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: не поднимает глаз
  rationale: Передаёт еврейскую идиому, которая здесь подразумевает почтительное или молитвенное обращение к идолам.
- source_word: גִּלּוּלֵי
  choice: мерзким идолам
  rationale: Слово у Иезекииля имеет резко презрительную окраску; сочетание «мерзкие идолы» естественно по-русски и сохраняет эту оценочность без буквального физиологического образа.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дома Израиля
  rationale: Сохраняет устойчивое пророческое обозначение народа Израиля, не упрощая его до одного имени.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: жены ближнего своего
  rationale: Точно передаёт юридико-нравственную формулу и сохраняет соотнесённость притяжательного местоимения с праведным человеком.
- source_word: לֹא טִמֵּא
  choice: не оскверняет
  rationale: Глагол удерживает одновременно нравственный и ритуально-понятийный оттенки, присутствующие в еврейском тексте.
- source_word: אִשָּׁה נִדָּה
  choice: женщине во время её месячной нечистоты
  rationale: Ясно передаёт менструальное состояние в категориях ритуальной нечистоты, не сводя его к чисто физиологическому описанию.
- source_word: לֹא יִקְרָב
  choice: не приближается
  rationale: Сохраняет эвфемистическую форму оригинала; подразумеваемое половое сближение разъяснено в сноске.
theological_decisions:
- issue: Делать ли культовый смысл еды на горах явным в основном тексте
  choice: Сохранить «на горах не ест»
  alternative: «не ест у святилищ на высотах»
  rationale: Буквальный образ является частью пророческой речи; культовый смысл достаточно раскрыть в сноске, не превращая перевод в толкование.
- issue: Как передать сочетание нравственной и ритуальной нечистоты
  choice: Использовать «оскверняет» и «месячная нечистота»
  alternative: «вступает в связь» и «во время месячных»
  rationale: Выбранные формулировки сохраняют напряжение между нравственной виной и категориями ритуальной чистоты, не устраняя ни одну из сторон.
- issue: Насколько явно передавать презрительный характер обозначения идолов
  choice: «мерзкие идолы»
  alternative: Нейтральное «идолы» или предельно буквальное презрительное наименование
  rationale: Оригинал намеренно выражает отвращение; русское «мерзкие» воспроизводит эту силу без неестественной кальки.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и пророческой ритмики. Синтаксис продолжает условное описание праведника из контекста. Формы «дома Израиля» и «ближнего своего» сохраняют библейско-правовой регистр, оставаясь понятными современному читателю.
