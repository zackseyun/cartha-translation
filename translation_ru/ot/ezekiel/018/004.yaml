base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/004.yaml
  text: Look[a], every life belongs to me. The life of the father is like the life of the son—both belong to me. The person who sins is the one who will die.
translation:
  language: ru
  text: Вот, каждая жизнь[a] принадлежит Мне. Жизнь отца, как и жизнь сына, принадлежит Мне. Кто грешит, тот и умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все души — Мои… душа, которая грешит, умрёт». Еврейское נֶפֶשׁ может означать «душа», «жизнь», «сам человек» или «личность» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт вводное указание и эмфатическую силу еврейской частицы естественным для современного русского языка способом.
- source_word: כָּל הַנְּפָשׁוֹת
  choice: каждая жизнь
  rationale: נֶפֶשׁ может обозначать душу, жизнь, самого человека или личность. Здесь дистрибутивное «каждая жизнь» сохраняет мысль о принадлежности Богу всех людей и не сужает значение до нематериальной части человека.
- source_word: לִי הֵנָּה
  choice: принадлежит Мне
  rationale: Естественно выражает еврейское «Мои / принадлежат Мне» и ясно передаёт Божье право на каждую жизнь.
- source_word: כְּנֶפֶשׁ הָאָב וּכְנֶפֶשׁ הַבֵּן
  choice: Жизнь отца, как и жизнь сына
  rationale: Конструкция «как… так и…» ставит отца и сына в равное положение перед Богом; выбранная русская формулировка передаёт это сопоставление без тяжеловесности.
- source_word: הַנֶּפֶשׁ הַחֹטֵאת
  choice: Кто грешит
  rationale: В заключительной части נֶפֶשׁ обозначает самого человека как нравственно ответственного деятеля. Относительная конструкция сохраняет глагольную силу причастия «грешащая».
- source_word: הִיא תָמוּת
  choice: тот и умрёт
  rationale: 'Русская конструкция «кто…, тот и…» передаёт эмфатическое отождествление: умрёт именно тот человек, который грешит.'
theological_decisions:
- issue: Передача נֶפֶשׁ в тексте, связанном с представлениями о душе и личной ответственности
  choice: В формулах принадлежности перевести как «жизнь», а в заключении передать референта личной конструкцией «кто… тот».
  alternative: 'Последовательно переводить «душа»: «все души — Мои… душа согрешающая, она умрёт».'
  rationale: Стих утверждает принадлежность Богу каждой человеческой жизни и личную ответственность согрешающего, не формулируя технического учения о нематериальной душе. Контекстуальная передача сохраняет смысловую широту נֶפֶשׁ и не снимает напряжения между жизнью, личностью и традиционным понятием души.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный и доступный стиль. Повтор «принадлежит Мне» сохраняет настойчивость исходного текста, а конструкция «кто… тот и…» естественно передаёт заключительное смысловое ударение.
