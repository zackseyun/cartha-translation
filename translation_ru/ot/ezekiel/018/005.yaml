source:
  edition: WLC
  text: וְ/אִ֖ישׁ כִּי יִהְיֶ֣ה צַדִּ֑יק וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/005.yaml
  text: But if a man is righteous and does justice and righteousness,[a]
translation:
  language: ru
  text: Но если человек праведен и поступает по справедливости и правде,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И если человек»; еврейский союз может обозначать как простое продолжение, так и противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: Но если человек
  rationale: אִישׁ обозначает отдельного человека в мужском роде; русское «человек» естественно сохраняет мужскую форму и здесь представляет общий случай. וְ передано как «но», поскольку стих начинает условный поворот в рассуждении.
- source_word: כִּי
  choice: если
  rationale: В сочетании с последующим имперфектом כִּי вводит условие.
- source_word: יִהְיֶה צַדִּיק
  choice: праведен
  rationale: Настоящее время естественно выражает общее условие, а «праведен» сохраняет нравственно-религиозный смысл צַדִּיק.
- source_word: וְ/עָשָׂה
  choice: и поступает
  rationale: В сочетании с абстрактными нравственными понятиями русское «поступает» звучит естественнее буквального «делает», сохраняя деятельный смысл עשה.
- source_word: מִשְׁפָּט
  choice: по справедливости
  rationale: Здесь слово относится к справедливому образу действий; предложная конструкция естественна после «поступает».
- source_word: וּ/צְדָקָה
  choice: и правде
  rationale: «Правда» сохраняет отличие צְדָקָה от מִשְׁפָּט и в данном сочетании означает нравственную правоту, а не только истинность высказывания.
theological_decisions:
- issue: Мужской репрезентативный субъект
  choice: человек
  alternative: мужчина; всякий
  rationale: אִישׁ имеет форму мужского рода и представляет отдельный человеческий случай. «Человек» в русском языке сохраняет грамматический мужской род, не сужая смысл до указания на пол.
- issue: Различение מִשְׁפָּט и צְדָקָה
  choice: справедливость и правда
  alternative: суд и праведность; справедливость и праведность
  rationale: Перевод сохраняет два разных, хотя и близких, нравственных понятия и не сводит их к одному термину.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified условная формулировка. «Поступает по справедливости и правде» передаёт деятельный характер выражения и сохраняет параллельную пару еврейских существительных.
