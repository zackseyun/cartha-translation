  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם יִֽהְיֶ֨ה לָ/כֶ֜ם ע֗וֹד מְשֹׁ֛ל הַ/מָּשָׁ֥ל הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/003.yaml
  text: As I live[a], declares the Lord GOD[b], this proverb shall no longer be used by you in Israel.
translation:
  language: ru
  text: «Как Я жив[a], — возвещает Владыка Яхве[b], — вы больше не будете употреблять[c] эту пословицу в Израиле».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейская формула клятвы; буквально: «жив Я». Она выражает торжественное заверение: «Верно, как Я жив».'
    reason: lexical_alternative
  - marker: b
    text: «Владыка» передаёт древнееврейский титул, а «Яхве» — личное имя Бога в древнееврейском тексте.
    reason: theological_clarity
  - marker: c
    text: 'Или: «произносить эту пословицу», «цитировать эту пословицу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֕נִי
  choice: Живу Я
  rationale: Сохранена форма древнееврейской клятвенной формулы, вводящей торжественное и непреложное Божье заявление; её смысл пояснён в сноске.
- source_word: נְאֻ֖ם
  choice: возвещает
  rationale: Естественная для современного литературного русского передача авторитетной пророческой формулы; слово сохраняет торжественный регистр, не превращая формулу в отдельное «пророчество».
- source_word: אֲדֹנָ֣י יְהוִ֑ה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי как титул верховной власти, а «Яхве» — личное имя יהוה; тем самым избегается неестественное «Господь ГОСПОДЬ».
- source_word: אִם יִֽהְיֶ֨ה ... עוֹד
  choice: не будете вы больше
  rationale: В клятвенной формуле אִם вводит эллиптическое отрицание («если ещё будет…» в значении «несомненно, больше не будет»). Прямое отрицание ясно передаёт смысл по-русски.
- source_word: לָכֶ֜ם
  choice: вы
  rationale: Дательный компонент в данном обороте указывает на адресатов и носителей употребления пословицы; в русском это естественно выражается подлежащим «вы».
- source_word: מְשֹׁ֛ל
  choice: повторять
  rationale: Глагольная форма означает употреблять или произносить пословицу. «Повторять» естественно описывает хождение уже известного народного изречения, не сужая действие до письменного цитирования.
- source_word: הַמָּשָׁ֥ל הַזֶּ֖ה
  choice: эту пословицу
  rationale: В контексте מָשָׁל обозначает распространённое краткое изречение, приведённое в предыдущем стихе; «пословица» точнее контекстуальных вариантов «притча» и «иносказание».
- source_word: בְּיִשְׂרָאֵֽל
  choice: в Израиле
  rationale: Сохранено прямое обозначение среды, где пословица употреблялась; формулировка может охватывать и землю, и народ Израиля.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Текст различает титул אֲדֹנָי и имя יהוה. Передача «Владыка Яхве» сохраняет оба элемента и не подменяет собственное имя общим титулом.
- issue: Сила божественной клятвы с אִם
  choice: 'утвердительное отрицание: «не будете вы больше»'
  alternative: 'буквальное условное: «если ещё будете»'
  rationale: В древнееврейской клятвенной речи условная форма подразумевает отрицательное последствие и выражает непреложность сказанного. Русский перевод передаёт прагматический смысл, а формальную особенность отмечает в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Инверсия «Живу Я» намеренно сохраняет формулу исходного текста; основное обещание сформулировано естественно и ясно. Кавычки и тире оформляют прямую божественную речь.
