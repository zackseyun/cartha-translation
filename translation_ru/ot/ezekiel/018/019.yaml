  text: וַ/אֲמַרְתֶּ֕ם מַדֻּ֛עַ לֹא נָשָׂ֥א הַ/בֵּ֖ן בַּ/עֲוֺ֣ן הָ/אָ֑ב וְ/הַ/בֵּ֞ן מִשְׁפָּ֧ט וּ/צְדָקָ֣ה עָשָׂ֗ה אֵ֣ת כָּל חֻקּוֹתַ֥/י שָׁמַ֛ר וַ/יַּעֲשֶׂ֥ה אֹתָ֖/ם חָיֹ֥ה יִחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/019.yaml
  text: Yet you say[a], ‘Why does the son not bear the iniquity of the father?’ Because the son has done justice and righteousness, has kept all my statutes, and has done them; he shall surely live.
translation:
  language: ru
  text: 'Но вы говорите: «Почему сын не несёт на себе вины отца[a]?» Потому что сын поступал справедливо и праведно, соблюдал все Мои установления и исполнял их — он непременно будет жить.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззакония отца»; возможно также: «наказания за беззаконие отца». Еврейское выражение «нести беззаконие» может охватывать как вину, так и её последствия.'
    reason: Сохранить смысловой диапазон עָוֹן и не сводить выражение лишь к унаследованной вине или лишь к наказанию.
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Но вы говорите
  rationale: Сочетание союза с глаголом вводит возражение слушателей. «Но» естественно передаёт противопоставление предшествующему утверждению.
- source_word: מַדֻּעַ
  choice: Почему
  rationale: Прямой и естественный русский эквивалент вопросительного слова причины.
- source_word: לֹא נָשָׂא ... בַּעֲוֺן הָאָב
  choice: не несёт вины отца
  rationale: Сохранён образ еврейского выражения «нести вину/беззаконие», которое может указывать как на вину, так и на её последствия; неоднозначность пояснена в сноске.
- source_word: הַבֵּן
  choice: сын
  rationale: Определённая форма обозначает сына как типичного представителя в противопоставлении отцу; русский язык не требует отдельного артикля.
- source_word: מִשְׁפָּט וּצְדָקָה עָשָׂה
  choice: поступал справедливо и праведно
  rationale: Естественная современная русская передача устойчивой пары, описывающей поведение в согласии с Божьими нормами, без архаичного оборота «творил суд и правду».
- source_word: אֵת כָּל חֻקּוֹתַי שָׁמַר
  choice: соблюдал все Мои установления
  rationale: «Установления» передаёт правовой и заветный оттенок חֻקּוֹת, а «соблюдал» — нормативное значение שׁמר в данном контексте.
- source_word: וַיַּעֲשֶׂה אֹתָם
  choice: и исполнял их
  rationale: 'Сохранено смысловое усиление: сын не только соблюдал установления, но и осуществлял их на деле.'
- source_word: חָיֹה יִחְיֶה
  choice: он непременно будет жить
  rationale: Наречие «непременно» передаёт усилительную конструкцию с абсолютным инфинитивом и личной формой глагола.
theological_decisions:
- issue: Значение выражения «нести вину отца»
  choice: Сохранить идиому в основном тексте и отметить широту её значения в сноске.
  alternative: Перевести однозначно как «нести наказание за беззаконие отца» или «быть виновным в грехе отца».
  rationale: עָוֹן может обозначать беззаконие, вину или наказание как последствие беззакония. Стих утверждает личную ответственность, но сам оборот не следует сужать до одной богословской формулировки.
- issue: Логическая связь второй части с вопросом
  choice: Потому что
  alternative: А / Но
  rationale: 'Хотя в еврейском стоит союз וְ, в данном контексте следующая часть объясняет, почему сын не несёт вины отца: он поступал праведно. Причинная связь делает ход мысли ясным, не добавляя чуждого содержания.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет форму возражения и emphатическое заключение, избегая как церковнославянизмов, так и разговорной упрощённости.
