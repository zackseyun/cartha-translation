    rationale: В английском тексте маркер a стоит после «anyone», хотя поясняет залог, а маркер b стоит после «robbed», хотя поясняет «his bread». Это не отражено в русском тексте, где сноски отсутствуют, и не препятствует одобрению русского перевода, но нуждается в отдельной технической правке английского аудиторского следа.
