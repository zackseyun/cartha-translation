  text: וְ/אִישׁ֙ לֹ֣א הוֹנָ֔ה חֲבֹל֙ לֹ֣א חָבָ֔ל וּ/גְזֵלָ֖ה לֹ֣א גָזָ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב נָתָ֔ן וְ/עֵר֖וֹם כִּסָּה בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/016.yaml
  text: He has not oppressed anyone[a], has not taken a pledge, and has not robbed[b]; he has given his bread to the hungry and covered the naked with a garment.
translation:
  language: ru
  text: никого не притеснял, не брал залога, не грабил, свой хлеб отдавал голодному и нагого покрывал одеждой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ לֹא הוֹנָה
  choice: никого не притеснял
  rationale: Сочетание אִישׁ с отрицанием имеет обобщённый смысл «никого», а הוֹנָה обозначает притеснение или несправедливое обращение.
- source_word: חֲבֹל לֹא חָבָל
  choice: не брал залога
  rationale: Однокоренное сочетание существительного и глагола обозначает взятие залога у должника; краткая формулировка сохраняет юридико-экономический смысл.
- source_word: גְזֵלָה לֹא גָזָל
  choice: не грабил
  rationale: Однокоренное сочетание указывает на грабёж, то есть неправомерное отнятие чужого; «не грабил» естественно и передаёт более сильный смысл, чем общее «не крал».
- source_word: לַחְמוֹ
  choice: свой хлеб
  rationale: Суффикс означает «его/свой», а буквальное «хлеб» сохраняет конкретный образ того, что человек делится собственным пропитанием.
- source_word: לְרָעֵב
  choice: голодному
  rationale: Прилагательное употреблено субстантивно и обозначает голодного человека.
- source_word: עֵרוֹם כִּסָּה בָגֶד
  choice: нагого покрывал одеждой
  rationale: 'Формулировка сохраняет конкретные элементы еврейского текста: нагой человек, действие покрытия и одежда.'
