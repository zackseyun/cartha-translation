base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/022.yaml
  text: None of the transgressions that he has committed will be remembered against him[a]; by the righteousness that he has practiced[b], he will live.
translation:
  language: ru
  text: Ни одно из преступлений, которые он совершил, не будет поставлено ему в вину[a]. Благодаря своей праведности, которую он проявил[b], он будет жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не будет вспомнено ему»; также возможно: «не будет зачтено против него».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в своей праведности» или «своей праведностью»; еврейский предлог допускает здесь несколько близких оттенков смысла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פְּשָׁעָיו
  choice: Ни одно из преступлений
  rationale: При последующем отрицании כָּל естественно передаётся конструкцией «ни одно» с сохранением всеохватного смысла; פְּשָׁעִים обозначает преступления или мятежные проступки и сохраняет нравственно-судебный оттенок.
- source_word: אֲשֶׁר עָשָׂה
  choice: которые он совершил
  rationale: В сочетании с обозначением проступков עָשָׂה естественно передать глаголом «совершил».
- source_word: לֹא יִזָּכְרוּ לוֹ
  choice: не будет поставлено ему в вину
  rationale: Пассивная форма זכר буквально говорит, что проступки не будут вспомянуты применительно к нему; в данном судебном контексте русская идиома «поставлено ему в вину» ясно передаёт этот смысл.
- source_word: בְּצִדְקָתוֹ
  choice: Благодаря праведности
  rationale: Предлог בְּ допускает причинный, инструментальный или обстоятельственный оттенок. «Благодаря» естественно выражает связь праведности с обещанной жизнью, не превращая перевод в узкую догматическую формулу.
- source_word: אֲשֶׁר עָשָׂה
  choice: которую он проявлял
  rationale: Буквальное «которую он делал» неестественно по-русски; «проявлял» показывает, что речь идёт о праведности, воплощённой в поступках.
- source_word: יִחְיֶה
  choice: он будет жить
  rationale: Передаёт обещанный результат в современных и ясных русских формах, не сужая значение до одного лишь земного благополучия.
theological_decisions:
- issue: Следует ли понимать стих как учение о заслуженном самооправдании либо как изложение принципа личной ответственности и жизни раскаявшегося праведника
  choice: 'Передать утверждение прямо в судебно-нравственных категориях самого Иезекииля: прежние преступления не ставятся человеку в вину, и благодаря проявленной им праведности он будет жить.'
  alternative: Усилить текст терминологией полного судебного оправдания либо ослабить «будет жить» до временного благополучия.
  rationale: Еврейский текст не разрешает последующие богословские споры. Перевод сохраняет его собственное утверждение и присущее ему богословское напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Судебный оттенок первой части сохранён естественной русской идиомой; буквальная неестественность «делать праведность» устранена без утраты акцента на поступках.
