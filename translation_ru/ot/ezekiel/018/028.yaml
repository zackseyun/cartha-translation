base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/028.yaml
  text: Because he considered and turned back from all his transgressions that he had committed[a], he will surely live[b]; he will not die.
translation:
  language: ru
  text: Ибо он осознал[a] и отступил[b] от всех своих преступлений, которые совершил; он непременно будет жить, не умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидел». Здесь, вероятно, имеется в виду, что он осознал свои поступки; начальное «ибо» также можно передать как «и» или «ведь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обратился», «повернул назад». Еврейский глагол сохраняет образ поворота, отказа от прежнего пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶה
  choice: Он осознал
  rationale: Глагол ראה буквально означает «увидел», но здесь обозначает осмысление или осознание, вслед за которым человек меняет свой путь. Союз ו передан простым соединением «и», без обязательного причинного истолкования.
- source_word: וישוב
  choice: и отвернулся
  rationale: שׁוב означает «повернуть(ся), возвратиться». Сочетание «отвернулся от» естественно по-русски и сохраняет образ решительного отказа от прежних преступлений, не заменяя его богословским термином.
- source_word: מִכָּל פְּשָׁעָיו
  choice: от всех ... преступлений
  rationale: פֶּשַׁע обозначает сознательное преступление, нарушение или мятеж. «Преступления» передаёт тяжесть и волевой характер проступков, не сужая значение до политического мятежа.
- source_word: אֲשֶׁר עָשָׂה
  choice: совершённых им
  rationale: Буквальное «которые он сделал» в сочетании с преступлениями по-русски естественно передаётся причастным оборотом «совершённых им».
- source_word: חָיוֹ יִחְיֶה
  choice: он непременно будет жить
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола выражает усиление; «непременно» ясно и естественно передаёт эту эмфазу.
- source_word: לֹא יָמוּת
  choice: не умрёт
  rationale: Прямая передача отрицательной формы, сохраняющая резкий контраст с обещанием жизни.
theological_decisions:
- issue: Смысл обещанных жизни и избавления от смерти
  choice: Сохранить прямые слова «будет жить, не умрёт», не уточняя вид жизни и смерти.
  alternative: Истолковать их исключительно как физическое выживание, заветно-судебный исход, духовную жизнь или эсхатологическую жизнь.
  rationale: Сам стих не ограничивает смысл одной из этих категорий. Прямая формулировка сохраняет нравственную силу обещания и присущую контексту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная. Тире подчёркивает переход от изменения поведения к решительному обещанию жизни. Формулировка избегает узкоконфессиональной терминологии и сохраняет конкретный образ поворота от греха.
