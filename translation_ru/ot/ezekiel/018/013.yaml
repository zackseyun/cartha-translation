base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/013.yaml
  text: He lends at interest and takes profit—and shall he live? He shall not live[a]. He has done all these abominations; he shall surely be put to death[c][b]; his blood shall be upon him.
translation:
  language: ru
  text: даёт взаймы под проценты и берёт прибыль — разве он будет жить? Нет, не будет жить[a]. Он совершил все эти мерзости; он непременно будет предан смерти[b]; кровь его будет на нём[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будет жить? Не будет жить». Риторический вопрос сопровождается решительным отрицанием.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «он непременно умрёт». В еврейском тексте стоит усиленная формула смертного приговора.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «кровь его будет на нём» — то есть ответственность за собственную смерть лежит на нём самом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ נָתַן
  choice: даёт деньги под проценты
  rationale: נֶשֶׁךְ обозначает процент, взимаемый по займу, особенно в осуждаемом ростовщическом контексте. Добавление «деньги» естественно по-русски выражает подразумеваемый объект глагола, не сужая смысл до чрезмерно высокой ставки.
- source_word: וְתַרְבִּית לָקַח
  choice: и берёт прибыль
  rationale: תַּרְבִּית — выгода или прирост, получаемые от займа; «прибыль» сохраняет отличие от первого термина и передаёт неправомерную наживу.
- source_word: וָחָי לֹא יִחְיֶה
  choice: разве он будет жить? Нет, не будет жить
  rationale: Сочетание допускает и особенно выразительно передаёт риторический вопрос с последующим решительным отрицанием.
- source_word: אֵת כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: все эти мерзости
  rationale: תּוֹעֵבוֹת обозначает нравственно и религиозно отвратительные поступки; «мерзости» сохраняет резкость пророческой речи и естественно звучит в современном русском.
- source_word: מוֹת יוּמָת
  choice: он непременно будет предан смерти
  rationale: Инфинитив абсолютный с пассивной глагольной формой выражает усиленный смертный приговор. «Будет предан смерти» сохраняет пассивный и судебный оттенок, не уточняя исполнителя.
- source_word: דָּמָיו בּוֹ יִהְיֶה
  choice: кровь его будет на нём
  rationale: Формально близкая передача идиомы сохраняет образ и смысл личной ответственности за собственную смерть; значение пояснено в сноске.
theological_decisions:
- issue: Характер смертного приговора в пророческой юридической речи
  choice: «он непременно будет предан смерти»
  alternative: «он непременно умрёт»
  rationale: Пассивная форма поддерживает понимание как вынесенного смертного приговора, однако текст не уточняет, кем и каким образом он будет исполнен; перевод не привносит ни гражданско-правовой процедуры, ни исключительно прямого Божьего действия.
translation_notes:
  register: Современный литературный русский с достоинством пророческой судебной речи. Синтаксис сохраняет риторический вопрос, категорическое отрицание, усиленный смертный приговор и образную еврейскую идиому.
