base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/026.yaml
  text: When a righteous man turns away from his righteousness and does injustice[a], and dies because of them[b], he shall die for the injustice that he has done.
translation:
  language: ru
  text: Когда праведник отступит от своей праведности и поступит несправедливо[a], и умрёт из-за них[b], он умрёт за совершённую им несправедливость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и станет творить неправду»; также возможно: «и станет совершать беззаконие». Еврейское עָוֶל означает несправедливость, неправду или неправедность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-за них». Местоимение в еврейском тексте стоит во множественном числе и, вероятно, относится к упомянутым неправедным поступкам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Если ... отступит
  rationale: Конструкция בְּ + инфинитив от שׁוב может задавать обстоятельственное условие или время; в данном контексте שׁוב с מִן означает отступление от прежнего состояния. Условное «если» естественно передаёт общий нравственный принцип в связи с предыдущим стихом.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода обозначает отдельного человека; «праведник» точно и естественно сохраняет форму и смысл.
- source_word: מִצִּדְקָתוֹ
  choice: от своей праведности
  rationale: Существительное обозначает здесь праведность или праведное поведение. Прямой перевод сохраняет лексическую связь с «праведником» и не сужает смысл только до отдельных поступков.
- source_word: וְעָשָׂה עָוֶל
  choice: и станет поступать несправедливо
  rationale: עָוֶל охватывает несправедливость, неправду и беззаконие. Русское выражение естественно передаёт продолжение условной ситуации и нравственно-судебный оттенок.
- source_word: וּמֵת עֲלֵיהֶם
  choice: и умрёт из-за всего этого
  rationale: עֲלֵיהֶם имеет причинный смысл и содержит суффикс множественного числа. «Из-за всего этого» сохраняет собирательную отсылку к упомянутым неправедным действиям, не создавая в русском неясного местоимения «них».
- source_word: בְּעַוְלוֹ אֲשֶׁר עָשָׂה
  choice: за несправедливость, которую совершил
  rationale: Предлог בְּ здесь выражает основание или причину наказания. Формулировка сохраняет относительное предложение и подчёркивает личную ответственность за совершённое зло.
- source_word: יָמוּת
  choice: то он умрёт
  rationale: Имперфект выражает несомненное следствие сформулированного условия. Русское будущее время естественно передаёт эту судебно-принципиальную силу без добавления модальности «должен».
theological_decisions:
- issue: Следует ли переводом разрешать позднейшие споры об отпадении и стойкости в вере
  choice: Передать условное нравственное предостережение прямо, не добавляя систематического богословского вывода.
  alternative: Подчеркнуть окончательное отпадение либо ослабить реальность отступления праведника.
  rationale: Еврейский текст прямо говорит о праведнике, который отступает от праведности, совершает неправду и умирает вследствие этого. Перевод сохраняет напряжение утверждения, не решая вопросов, выходящих за пределы стиха.
translation_notes:
  register: Современный литературный русский язык; тон серьёзный и достоинственный. Сохранены повтор «праведник — праведность» и повтор корня в формулировках о несправедливости, а неясная множественная отсылка עֲלֵיהֶם пояснена сноской.
