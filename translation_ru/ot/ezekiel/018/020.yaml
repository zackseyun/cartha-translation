  text: הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֣יא תָמ֑וּת בֵּ֞ן לֹא יִשָּׂ֣א בַּ/עֲוֺ֣ן הָ/אָ֗ב וְ/אָב֙ לֹ֤א יִשָּׂא֙ בַּ/עֲוֺ֣ן הַ/בֵּ֔ן צִדְקַ֤ת הַ/צַּדִּיק֙ עָלָ֣י/ו תִּֽהְיֶ֔ה וְ/רִשְׁעַ֥ת רשע עָלָ֥י/ו תִּֽהְיֶֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/020.yaml
  text: The person who sins—he shall die[a]. A son shall not bear the iniquity of the father, and a father shall not bear the iniquity of the son. The righteousness of the righteous shall be upon him[b], and the wickedness of the wicked shall be upon him.
translation:
  language: ru
  text: Тот, кто грешит, умрёт[a]. Сын не понесёт вины отца[b], и отец не понесёт вины сына. Праведность праведника будет на нём, и нечестие нечестивца будет на нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Душа, которая грешит, — она умрёт». Здесь еврейское слово нефеш («душа») означает отдельного человека.'
    reason: lexical_alternative
  - marker: b
    text: «Понести вину» — еврейское юридическое выражение, которое может включать как вину за проступок, так и ответственность за неё.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: тот
  rationale: В данном юридико-нравственном контексте נֶפֶשׁ обозначает отдельного человека, а не нематериальную часть человека. Конструкция «тот, кто» естественно передаёт это значение вместе с последующим причастием.
- source_word: הַחֹטֵאת
  choice: кто грешит
  rationale: Причастие имеет обобщённое значение и указывает на человека, совершающего грех; настоящее время сохраняет эту общую силу.
- source_word: הִיא תָמוּת
  choice: умрёт
  rationale: Местоимение הִיא грамматически согласовано с существительным נֶפֶשׁ и в русском отдельно не требуется. Совершенный вид естественно передаёт категорическое предсказание смерти.
- source_word: בֵּן
  choice: сын
  rationale: Сохранена мужская форма единственного числа и параллель «сын — отец» исходного юридического изречения.
- source_word: יִשָּׂא בַּעֲוֺן
  choice: понесёт вину
  rationale: Русское выражение «понести вину» сохраняет образ несения и допускает как нравственную вину, так и связанную с нею ответственность.
- source_word: צִדְקַת הַצַּדִּיק
  choice: праведность праведника
  rationale: Сохранены однокоренные слова и риторическая симметрия еврейского текста.
- source_word: עָלָיו תִּהְיֶה
  choice: останется на нём
  rationale: «На нём» сохраняет исходный образ личной принадлежности и ответственности; «останется» естественнее по-русски, чем буквальное «будет» в данном параллелизме.
- source_word: וְרִשְׁעַת רשע
  choice: и нечестие нечестивца
  rationale: Сохранена однокоренная формула и параллель с «праведностью праведника»; «нечестие» передаёт нравственную порочность без сужения до одного проступка.
theological_decisions:
- issue: Значение נֶפֶשׁ в антропологическом отношении
  choice: В основном тексте передано как отдельный человек посредством конструкции «тот, кто»
  alternative: «Душа, которая грешит»
  rationale: Контекст посвящён личной нравственной ответственности и не формулирует учение об отделимой от тела душе. Буквальная форма сохранена в примечании.
- issue: Формула личной ответственности
  choice: «не понесёт вины»
  alternative: «не будет наказан за вину»
  rationale: Еврейская идиома охватывает вину и ответственность за неё; явное упоминание наказания неоправданно сужало бы формулировку.
- issue: Выражение עָלָיו תִּהְיֶה
  choice: «останется на нём»
  alternative: «будет принадлежать ему»
  rationale: Сохранён пространственный образ исходного текста, не разрешая однозначно, идёт ли речь о принадлежности поступков, их нравственной оценке или последствиях.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого юридического изречения. Параллелизм и однокоренные пары сохранены; архаизмы «беззаконие» и «понесёт беззаконие» не использованы ради ясности.
