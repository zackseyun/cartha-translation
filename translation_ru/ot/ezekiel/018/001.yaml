  text: 'И было ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (тетраграмматон); традиционно переводится как «Господь», также передаётся как «Иегова».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма от היה вводит новое пророческое сообщение; «И было» естественно сохраняет традиционную повествовательную формулу и связь с контекстом.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר־יְהוָה обозначает конкретное Божье откровение; «слово» точно и сохраняет повторяющуюся библейскую формулу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно передаёт направление речи к пророку и естественно сочетается по-русски с формулой «было слово».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь; в современном русском эту функцию естественно и без потери смысла выполняет двоеточие, тогда как буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не привносит конфессиональной замены.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Двоеточие передаёт функцию לֵאמֹר и подготавливает прямую речь следующего стиха.
