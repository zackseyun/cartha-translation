base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/021.yaml
  text: But if the wicked man turns back from all his sins that he has committed[a], and keeps all my statutes, and does justice and righteousness, he shall surely live; he shall not die.
translation:
  language: ru
  text: Но если нечестивый отвернётся от всех грехов, которые совершил[a], будет соблюдать все Мои установления и поступать по справедливости и правде, то он непременно будет жить и не умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покается». Еврейский глагол буквально означает «повернуться, возвратиться» и здесь описывает отказ от греховного пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное мужского рода в единственном числе точно передаёт обозначение конкретного человека, характеризуемого нечестием, без добавления отсутствующего в еврейском тексте существительного.
- source_word: כִּי
  choice: если
  rationale: В данном контексте вводит условие; начальное וְ передано союзом «но», связывающим стих с предшествующим рассуждением.
- source_word: יָשׁוּב מִכָּל חטאתו
  choice: отвернётся от всех грехов
  rationale: Глагол שׁוּב буквально выражает поворот или возвращение, а конструкция с מִן здесь указывает на отход от прежних грехов. «Отвернётся» естественно передаёт направленность действия, не заменяя образ специальным богословским термином «покается».
- source_word: אֲשֶׁר עָשָׂה
  choice: которые совершил
  rationale: Сочетание «совершил грехи» идиоматично для современного русского и точно передаёт завершённые поступки.
- source_word: וְשָׁמַר אֶת כָּל חֻקּוֹתַי
  choice: будет соблюдать все Мои установления
  rationale: שׁמר в сочетании с законами означает соблюдать, а חֻקּוֹת — предписанные установления. Будущее время естественно продолжает русское условное предложение.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: и поступать по справедливости и правде
  rationale: Формулировка сохраняет оба этически значимых существительных и при этом звучит естественно по-русски; «правда» здесь передаёт צְדָקָה как нравственную праведность, а не только истинность высказывания.
- source_word: חָיֹה יִחְיֶה
  choice: непременно будет жить
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает утверждение; наречие «непременно» передаёт эту эмфазу.
- source_word: לֹא יָמוּת
  choice: не умрёт
  rationale: Прямо передаёт отрицательную форму и сохраняет контраст между жизнью и смертью.
theological_decisions:
- issue: Передача שׁוּב богословским термином «покаяться» или образом поворота
  choice: отвернётся
  alternative: покается
  rationale: Выбран конкретный образ отворачивания от грехов, заложенный в еврейском глаголе и конструкции с предлогом; он не сужает значение до позднейшей терминологии.
- issue: 'Смысл выражения חָיֹה יִחְיֶה: физическая жизнь, заветная жизнь или эсхатологическое спасение'
  choice: непременно будет жить
  alternative: непременно останется в живых
  rationale: Общая формулировка сохраняет широту и богословское напряжение исходного текста, не ограничивая обещание только физическим выживанием и не определяя его исключительно как эсхатологическое спасение.
- issue: Передача пары מִשְׁפָּט וּצְדָקָה
  choice: по справедливости и правде
  alternative: делать суд и праведность
  rationale: Сохранены два самостоятельных нравственно-правовых понятия без их слияния, но буквальная и неестественная для современного русского конструкция заменена идиоматической.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим оттенком. Синтаксис сделан естественным для условного предложения; сохранены мужской род единственного числа, усиление обещания жизни и отдельность понятий справедливости и правды.
