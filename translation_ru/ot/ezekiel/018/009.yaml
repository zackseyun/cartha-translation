  text: בְּ/חֻקּוֹתַ֧/י יְהַלֵּ֛ךְ וּ/מִשְׁפָּטַ֥/י שָׁמַ֖ר לַ/עֲשׂ֣וֹת אֱמֶ֑ת צַדִּ֥יק הוּא֙ חָיֹ֣ה יִֽחְיֶ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/009.yaml
  text: He walks in my statutes and keeps my judgments[a], acting faithfully; he is righteous; he shall surely live, declares the Lord GOD.
translation:
  language: ru
  text: Он следует Моим установлениям и соблюдает Мои законы, поступает честно и верно[a]. Он праведен и непременно будет жить, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делая истину», то есть поступая честно, истинно и верно.'
    reason: 'Сноска сохраняет необычную форму еврейского выражения и его смысловой диапазон: истина, честность и верность.'
lexical_decisions:
- source_word: בְּחֻקּוֹתַי יְהַלֵּךְ
  choice: следует Моим установлениям
  rationale: Еврейская метафора «ходит в Моих установлениях» обозначает образ жизни. «Следует» естественно передаёт её смысл по-русски, а «установления» сохраняет нормативный характер חֻקּוֹת.
- source_word: וּמִשְׁפָּטַי שָׁמַר
  choice: и соблюдает Мои законы
  rationale: В правовом контексте שׁמר значит «соблюдать», а מִשְׁפָּטִים обозначает обязательные судебно-правовые нормы. «Законы» понятно современному читателю и сохраняет юридический оттенок.
- source_word: לַעֲשׂוֹת אֱמֶת
  choice: поступая верно
  rationale: Буквально выражение означает «делать истину»; здесь אֱמֶת указывает на верность, честность и надёжность поведения. Деепричастная конструкция естественно связывает фразу с соблюдением Божьих законов.
- source_word: צַדִּיק הוּא
  choice: Он праведен
  rationale: «Праведен» сохраняет нравственно-правовой и богословский объём ключевого слова צַדִּיק.
- source_word: חָיֹה יִחְיֶה
  choice: непременно будет жить
  rationale: Сочетание абсолютного инфинитива с личной формой глагола выражает усиленное заверение. «Непременно» ясно передаёт эту эмфазу, не уточняя сверх контекста характер обещанной жизни.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם вводит торжественное Божье изречение. «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное заветное имя יהוה, избегая слияния двух титулов.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: Передача «Яхве» сохраняет собственное имя, непосредственно присутствующее в еврейском тексте, тогда как «Владыка» различимо передаёт אֲדֹנָי.
- issue: Смысл обещания חָיֹה יִחְיֶה
  choice: непременно будет жить
  alternative: непременно останется жив; непременно обретёт жизнь
  rationale: Перевод сохраняет усиленную уверенность формулы, но не решает без основания, относится ли жизнь лишь к физическому сохранению или имеет более широкий богословский смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Архаическая калька «ходит в постановлениях» заменена естественным «следует установлениям»; усиление обещания сохранено без конфессионального истолкования.
