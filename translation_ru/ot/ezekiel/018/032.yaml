base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/032.yaml
  text: For I take no pleasure in the death of the one who dies[a], declares the Lord GOD[c][b]. Therefore turn back and live.
translation:
  language: ru
  text: Ибо Я не нахожу удовольствия в смерти того, кто умирает[a], — возвещает Владыка Яхве[b]. Поэтому обратитесь и живите!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не желаю смерти умирающего».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское אֲדֹנָי יְהוִה передано как «Владыка Яхве»; традиционный вариант — «Господь Бог».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим призывом естественно для русского языка.
- source_word: לֹא אֶחְפֹּץ
  choice: Мне не угодна
  rationale: Глагол חפץ выражает желание, благоволение или удовольствие; эта формулировка сохраняет как волевой, так и эмоциональный оттенок и звучит достойно.
- source_word: בְּמוֹת הַמֵּת
  choice: смерть умирающего
  rationale: Сохраняет необычное сочетание от одного корня מות и не подменяет буквального «умирающего» контекстуальным «нечестивым».
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт торжественную пророческую формулу речи Бога.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента титула, избегает неестественного «Господь ГОСПОДЬ» и сохраняет личное имя Яхве.
- source_word: וְהָשִׁיבוּ
  choice: Поэтому обратитесь
  rationale: Форма текста — повелительное множественного числа от שוב; «обратитесь» сохраняет идею поворота/возвращения и естественно выражает нравственный призыв.
- source_word: וִחְיוּ
  choice: и живите
  rationale: Прямо передаёт повелительную форму и сохраняет краткость и силу заключительного призыва.
theological_decisions:
- issue: Объект Божьего нежелания
  choice: умирающего
  alternative: нечестивого
  rationale: В еврейском тексте стоит причастие от מות, а не слово «нечестивый». Контекст относится к нечестивому, но перевод не должен устранять более широкую и напряжённую формулировку самого стиха.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант явно передаёт и титул אֲדֹנָי, и собственное имя יהוה, не смешивая имя с общим обозначением «Бог».
- issue: Смысл חפץ
  choice: Мне не угодна
  alternative: Я не желаю
  rationale: Еврейский глагол допускает оттенки желания и удовольствия. Основной текст сохраняет оба оттенка настолько, насколько это возможно по-русски; альтернативный смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены краткость финального повеления, множественное число обращения и намеренно необычная исходная формулировка «смерть умирающего».
