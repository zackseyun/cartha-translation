base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/008.yaml
  text: He does not lend at interest or take profit[a]; he keeps his hand back from injustice[c][b]; he executes true justice between one man and another.
translation:
  language: ru
  text: не даёт взаймы под проценты и не получает прибыли[a], отводит свою руку от несправедливости[b], вершит правый суд между человеком и человеком[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не даёт в рост и не берёт прироста».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возвращает свою руку от несправедливости»; то есть не участвует в ней.'
    reason: lexical_alternative
  - marker: c
    text: «Между человеком и человеком» — юридический оборот, означающий справедливое разбирательство между двумя сторонами.
    reason: cultural_note
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ לֹא יִתֵּן
  choice: не даёт в рост
  rationale: В сочетании с נֶשֶׁךְ глагол «давать» обозначает ссуду под проценты. Русское «давать в рост» сохраняет экономико-правовой смысл и отрицательную окраску контекста.
- source_word: וְתַרְבִּית לֹא יִקָּח
  choice: не берёт прибыли
  rationale: תַרְבִּית — прибыль или прирост, получаемый от ссуды; отдельное обозначение сохраняет параллельную пару близких, но не обязательно полностью тождественных терминов.
- source_word: מֵעָוֶל
  choice: от несправедливости
  rationale: עָוֶל здесь обозначает неправду и несправедливость в общественно-правовой сфере.
- source_word: יָשִׁיב יָדוֹ
  choice: отвращает руку свою
  rationale: Передаёт буквальный образ возвращения или отведения руки, то есть отказа участвовать в несправедливости.
- source_word: מִשְׁפַּט אֱמֶת
  choice: справедливый суд
  rationale: Сочетание обозначает суд, соответствующий истине и правде; «справедливый суд» естественно передаёт его юридический и нравственный смысл.
- source_word: בֵּין אִישׁ לְאִישׁ
  choice: между человеком и человеком
  rationale: Сохранена формальная структура еврейского юридического оборота, обозначающего разбирательство между двумя сторонами.
theological_decisions:
- issue: Соотношение נֶשֶׁךְ и תַרְבִּית
  choice: Разные, но близкие термины переданы как «рост» и «прибыль»
  alternative: Передать оба термина словом «проценты» либо употребить «лихва» и «прибыль»
  rationale: Различное обозначение сохраняет словесную пару оригинала, не утверждая между терминами чрезмерно точного технического разграничения.
- issue: Юридический оборот בֵּין אִישׁ לְאִישׁ
  choice: между человеком и человеком
  alternative: между двумя сторонами
  rationale: Более формальная передача сохраняет конкретный образ оригинала; примечание поясняет его юридическую функцию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и метафора руки сохранены; архаизм «в рост» понятен из контекста и уточнён в сноске.
