  text: וְ/אָֽמְרוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י הַ/דְּרָכַ֞/י לֹ֤א יִתָּֽכְנּוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/029.yaml
  text: Yet the house of Israel says[a], ‘The way of the Lord is not just.’ Are my ways not just, O house of Israel? Is it not your ways that are not just?
translation:
  language: ru
  text: 'Но дом Израиля говорит: «Путь Господа несправедлив[a]». Разве Мои пути несправедливы, дом Израиля? Не ваши ли пути несправедливы?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неправилен», «нечестен». Еврейский глагол обозначает то, что должным образом выверено или устроено; здесь речь идёт о нравственной справедливости действий Господа.'
    reason: Лексическая альтернатива отражает диапазон значения תכן и сохраняет возможный оттенок правильности или упорядоченности.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Но ... говорит
  rationale: Соединительный союз в данном контексте вводит продолжающееся возражение Израиля и потому передан противительным «но». Настоящее время естественно выражает повторяемое, сохраняющее силу заявление народа.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено собирательное обозначение народа и его повтор в прямом обращении.
- source_word: לֹא יִתָּכֵן / לֹא יִתָּכְנוּ
  choice: несправедлив / несправедливы
  rationale: Форма от תכן указывает на то, что должным образом выверено, устроено или верно; в споре о Божьем суде речь идёт о нравственной справедливости. Один и тот же русский корень сохраняет трёхкратный риторический повтор.
- source_word: דֶּרֶךְ / דְּרָכַי / דַרְכֵיכֶם
  choice: путь / Мои пути / ваши пути
  rationale: Сохранены образ «пути», переход от единственного числа к множественному и противопоставление Божьих путей путям народа.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Традиционное и ясное русское соответствие данному божественному титулу.
- source_word: הֲלֹא
  choice: Разве ...? / Не ... ли ...?
  rationale: Обе конструкции естественно передают риторические вопросы, ожидающие отрицания обвинения против Бога и признания вины слушателей.
theological_decisions:
- issue: Нравственная оценка Божьих действий
  choice: Во всех трёх случаях передать יִתָּכֵן словом «справедлив»
  alternative: «правилен», «верен», «должным образом устроен»
  rationale: В контексте главы народ обвиняет Бога в несправедливом суде, а Бог обращает то же обвинение против их собственного поведения. «Справедлив» сохраняет судебно-нравственное напряжение, не сужая смысл до субъективного представления о честности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторическая симметрия оригинала сохранена; обращение «дом Израиля» оставлено без осовременивания до простого «Израиль».
