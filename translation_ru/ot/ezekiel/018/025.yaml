source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י שִׁמְעוּ נָא֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/דַרְכִּ/י֙ לֹ֣א יִתָּכֵ֔ן הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/025.yaml
  text: 'Yet you say[a], ‘The way of the Lord is not just.’ Hear now, house of Israel: Is my way not just? Is it not your ways that are not just?'
translation:
  language: ru
  text: 'Но вы говорите: «Путь Господа несправедлив[a]». Послушайте же, дом Израиля: разве Мой путь несправедлив? Не ваши ли пути несправедливы?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неправ» или «нечестен»; так же далее в стихе. Еврейское слово указывает на то, что является правильным, должным и справедливым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Но вы говорите
  rationale: Союз וַ в данном контексте вводит возражение Израиля и имеет противительный оттенок; настоящее время естественно передаёт продолжающееся обвинение.
- source_word: יִתָּכֵן
  choice: несправедлив / несправедливы
  rationale: В споре о Божьем суде форма от תכן обозначает соответствие должному, правому и справедливому. «Несправедлив» ясно передаёт нравственно-судебный смысл и естественно звучит во всех трёх случаях.
- source_word: דֶּרֶךְ / דַרְכִּי / דַרְכֵיכֶם
  choice: путь / Мой путь / ваши пути
  rationale: Сохранена метафора образа действий, а также контраст между единственным числом применительно к Божьему пути и множественным числом применительно к путям Израиля.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Традиционное и понятное русское соответствие божественному титулу אֲדֹנָי.
- source_word: שִׁמְעוּ נָא
  choice: Послушайте же
  rationale: Множественное повелительное наклонение сохраняет число еврейской формы, а частица «же» передаёт настойчивый призыв נָא без архаизации.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняется обычное пророческое обозначение народа как единого сообщества.
theological_decisions:
- issue: Нравственная оценка Божьих действий в ответ на обвинение Израиля
  choice: Во всех трёх случаях передать יִתָּכֵן словами «несправедлив / несправедливы»
  alternative: «неправ / неправы» или «нечестен / нечестны»
  rationale: «Справедлив» сохраняет судебно-нравственную силу спора о Божьем суде и личной ответственности, не сводя смысл лишь к субъективному ощущению честности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторические вопросы и резкий контраст между Божьим путём и путями Израиля сохранены; обращение «Послушайте же» отражает множественное число исходного текста.
