  verdict: revise
  source_fidelity: Начальное «Но если» удачно передаёт контрастно-условное развитие контекста, а «жестокий сын» и «проливающий кровь» в целом верны. Однако в масоретском тексте после וְעָשָׂה стоит אָח («брату»), а затем מֵאַחַד מֵאֵלֶּה («одно из этого/из этих дел»). Черновик опускает «брату» и заменяет единичное «одно» выражением «что-либо из всего этого».
  naturalness: «Но если у него родится...» естественно, но несколько ослабляет прямо выраженное в еврейском отцовское действие. «Но если он произведёт на свет сына» точно, но тяжеловесно; «Но если он станет отцом жестокого сына» современно и естественно. Оборот «совершает по отношению к брату одно из этих дел» ясен и сохраняет синтаксический смысл оригинала.
  terminology: «Жестокий» допустимо для פָּרִיץ, хотя «склонный к насилию» было бы разъяснительнее. «Проливающий кровь» сохраняет широту שֹׁפֵךְ דָּם. Следует восстановить אָח как «брату», не сводя его к неопределённому «что-либо».
