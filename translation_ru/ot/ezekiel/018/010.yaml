  yaml_path: translation/ot/ezekiel/018/010.yaml
  text: But if he fathers a violent son[a], one who sheds blood and does any one of these things,
translation:
  language: ru
  text: Но если он станет отцом жестокого сына[a], проливающего кровь и совершающего по отношению к брату одно из этих дел,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более буквально: «И он породит жестокого сына, проливающего кровь и совершающего брату одно из этих дел». Заключительная еврейская конструкция трудна; в масоретском тексте присутствует слово «брат».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹלִיד
  choice: Но если у него родится
  rationale: Порода hифиль от ילד означает «породить, стать отцом». По-русски оборот «у него родится» естественно передаёт отцовство, а союз с условным значением отражает контраст с праведным отцом из предыдущего контекста.
- source_word: בֵּן
  choice: сын
  rationale: Слово обозначает именно сына и сохраняет мужской род и единственное число оригинала.
- source_word: פָּרִיץ
  choice: жестокий
  rationale: Слово характеризует буйного, беззаконного, склонного к насилию человека. «Жестокий» естественно сочетается с последующим упоминанием кровопролития и не сужает смысл до одного конкретного преступления.
- source_word: שֹׁפֵךְ דָּם
  choice: проливающий кровь
  rationale: Причастный оборот прямо сохраняет древнееврейскую идиому и не ограничивает её юридическим понятием убийства.
- source_word: וְעָשָׂה
  choice: и совершающий
  rationale: Обычный глагол «делать» в данном перечне поступков естественно передаётся русским «совершать».
- source_word: אָח מֵאַחַד מֵאֵלֶּה
  choice: что-либо из всего этого
  rationale: Трудная форма אָח в контексте обычно понимается как часть выражения со значением «одно/что-либо из этого». Перевод сохраняет неопределённо-единичную силу фразы и естественен по-русски.
theological_decisions:
- issue: Условно-противительное значение начального וְ
  choice: Но если у него родится
  alternative: И у него родится
  rationale: Сам союз формально означает «и», однако контекст вводит противоположный случай — сына праведника, поступающего нечестиво. «Но если» ясно передаёт дискурсивную условность, не добавляя богословского толкования.
- issue: Объём выражения שֹׁפֵךְ דָּם
  choice: проливающий кровь
  alternative: убийца
  rationale: Буквальная идиома сохраняет широту и нравственную напряжённость оригинала, не сводя выражение только к юридически определённому убийству.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанный и достойный стиль. Причастный оборот сохраняет структуру и образность древнееврейского текста, а сноска отмечает более формальную передачу неоднозначной синтаксической конструкции.
