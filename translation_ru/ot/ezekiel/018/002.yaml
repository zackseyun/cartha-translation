    rationale: Формула может быть понята как просьба объяснить значение сказанного. В еврейском это обращённый к народу упрёк по поводу их действия; «Что это вы…?» передаёт его точнее.
  - severity: low
    issue: «В земле Израиля»
    rationale: Возможно и понятно, но «на земле Израиля» ближе к сочетанию עַל אַדְמַת («на земле/почве») и более естественно сохраняет библейско-пророческую окраску без изменения смысла.
