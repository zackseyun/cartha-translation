  text: מַה לָּ/כֶ֗ם אַתֶּם֙ מֹֽשְׁלִים֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אָבוֹת֙ יֹ֣אכְלוּ בֹ֔סֶר וְ/שִׁנֵּ֥י הַ/בָּנִ֖ים תִּקְהֶֽינָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/002.yaml
  text: What do you mean, that you keep repeating this proverb in the land of Israel[a], saying, ‘The fathers eat sour grapes, and the children’s teeth are set on edge’?”
translation:
  language: ru
  text: 'Что это вы всё повторяете эту пословицу на земле Израиля: «Отцы едят незрелый виноград, а у детей оскомина на зубах»?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָּכֶם
  choice: Что это значит
  rationale: Естественно передаёт идиоматический упрёк и вызов, обращённый к слушателям, без буквального и неясного «что вам».
- source_word: מֹשְׁלִים
  choice: вы всё повторяете
  rationale: Глагол означает употреблять или произносить пословицу; причастная форма описывает продолжающееся, привычное действие, что передано словами «всё повторяете».
- source_word: הַמָּשָׁל הַזֶּה
  choice: эту пословицу
  rationale: Здесь מָשָׁל обозначает краткое общеизвестное изречение, а не повествовательную притчу.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: в земле Израиля
  rationale: Хотя עַל может значить «о», сочетание с אַדְמַת естественно указывает на территорию, где эта пословица вошла в употребление; «в земле Израиля» сохраняет конкретный пространственный образ.
- source_word: אָבוֹת יֹאכְלוּ בֹסֶר
  choice: Отцы едят незрелый виноград
  rationale: בֹסֶר — незрелый виноград, кислый на вкус; настоящее время передаёт обобщённый характер пословицы.
- source_word: שִׁנֵּי הַבָּנִים תִּקְהֶינָה
  choice: у детей оскомина на зубах
  rationale: Русское устойчивое выражение точно передаёт неприятное ощущение от кислоты. בָּנִים в противопоставлении отцам обозначает их потомство в целом, поэтому выбрано «детей».
theological_decisions:
- issue: Родовые термины в пословице
  choice: Сохранить «отцы», а בָּנִים передать как «дети»
  alternative: «Отцы едят незрелый виноград, а у сыновей оскомина на зубах»
  rationale: אָבוֹת прямо называет отцов. Форма בָּנִים грамматически мужская, однако здесь представляет потомков вообще; «дети» естественно выражает межпоколенческий смысл, не ограничивая последствия сыновьями.
- issue: Направленность выражения עַל אַדְמַת יִשְׂרָאֵל
  choice: в земле Израиля
  alternative: о земле Израиля
  rationale: Предлог допускает смысл «о, относительно», но сочетание с «землёй/почвой Израиля» и контекст употребления пословицы поддерживают пространственное понимание. Подлинная неоднозначность отмечена в решении, но не требует сноски для ясного русского текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Упрёк передан прямо, а сама пословица звучит как естественное русское изречение. Кавычки оформлены по русской типографической норме.
