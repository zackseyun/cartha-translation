  text: Когда нечестивый отвернётся от совершённого им зла и будет поступать справедливо и праведно, он сохранит свою жизнь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранит себя в живых». Еврейское נֶפֶשׁ (нефеш) в зависимости от контекста может означать жизнь, самого человека или душу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשׁוּב רָשָׁע
  choice: Но если нечестивый отвернётся
  rationale: Конструкция с инфинитивом שׁוב задаёт временно-условное обстоятельство. В контексте противопоставления естественно русское «Но если»; «отвернётся» передаёт отказ от прежнего пути.
- source_word: מֵרִשְׁעָתוֹ אֲשֶׁר עָשָׂה
  choice: от совершённого им зла
  rationale: רִשְׁעָה обозначает нечестие, зло или злые дела; причастный оборот естественно передаёт относительное предложение и сохраняет связь с конкретными прежними поступками.
- source_word: וַיַּעַשׂ מִשְׁפָּט וּצְדָקָה
  choice: и будет поступать по справедливости и правде
  rationale: Глагол עשה с парой абстрактных существительных в русском естественно передаётся как «поступать по». Различие между מִשְׁפָּט и צְדָקָה сохранено словами «справедливость» и «правда».
- source_word: הוּא אֶת נַפְשׁוֹ יְחַיֶּה
  choice: он сохранит себе жизнь
  rationale: נֶפֶשׁ здесь означает жизнь или самого человека, а интенсивная форма חיה — сохранить в живых. Формулировка передаёт эмфатическое הוּא и не привносит представление исключительно о нематериальной душе.
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте нравственной ответственности и суда
  choice: жизнь
  alternative: душу; самого себя
  rationale: В Иезекииле 18 последовательно противопоставлены жизнь и смерть. «Жизнь» сохраняет контекстуальный смысл и не сужает высказывание до участи нематериальной души.
- issue: Отношение поступка человека к сохранению жизни
  choice: сохранит себе жизнь
  alternative: оживит свою душу; сохранит самого себя в живых
  rationale: Перевод сохраняет прямую формулировку еврейского текста, не разрешая за его пределами богословское напряжение между человеческим обращением и Божьим судом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Нечестивый» сохраняет нравственно-религиозную характеристику רָשָׁע; синтаксис сделан естественным для современного читателя.
