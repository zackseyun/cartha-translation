  terminology: «Нечестивый» хорошо соответствует רָשָׁע. Пара «справедливо и праведно» ясно различает מִשְׁפָּט и צְדָקָה и естественнее, чем «по справедливости и правде». Сноска должна точнее объяснять, что נֶפֶשׁ здесь может означать жизнь, самого человека или душу; прежнее «сохранит живой свою нефеш» по-русски неграмотно.
