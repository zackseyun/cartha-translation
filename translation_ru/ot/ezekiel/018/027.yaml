  source_fidelity: 'Смысл в целом передан верно: нечестивый отказывается от прежнего зла, поступает справедливо и праведно и сохраняет жизнь. Однако русское «Но если» несколько сужает временно-условный оборот וּבְשׁוּב («и/когда ... обратится»), а «сохранит себе жизнь» менее естественно и менее точно, чем «сохранит свою жизнь».'
