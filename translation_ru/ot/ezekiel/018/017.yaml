base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/017.yaml
  text: He has withheld his hand from the poor[a], has not taken interest or profit, has carried out my judgments, and has walked in my statutes. He will not die for his father's iniquity[c][b]; he will surely live.
translation:
  language: ru
  text: Он отвёл руку от бедного[a], не брал ни процентов, ни выгоды[b], исполнял Мои судебные предписания и ходил по Моим установлениям. Он не умрёт за беззаконие своего отца[c]; он непременно будет жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отвёл свою руку от бедного». Этот оборот означает, что он воздержался от причинения бедному вреда или от его эксплуатации.'
    reason: lexical_alternative
  - marker: b
    text: 'Два близких еврейских слова обозначают проценты и иной прирост или выгоду, получаемые с займа; традиционно: «лихва и рост».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможна более буквальная передача: «не умрёт в беззаконии своего отца». В данном контексте смысл в том, что он не умрёт из-за вины отца.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעָנִי הֵשִׁיב יָדוֹ
  choice: удержал свою руку от притеснения бедного
  rationale: Буквально оборот означает «отвёл/удержал свою руку от бедного». В контексте он обозначает отказ причинять бедному вред или подвергать его эксплуатации; добавление «от притеснения» естественно раскрывает смысл, сохраняя образ руки.
- source_word: נֶשֶׁךְ וְתַרְבִּית
  choice: процентов, ни прибыли
  rationale: Два близких экономических термина обозначают проценты и иной прирост или выгоду от займа. Формулировка сохраняет их различие и понятна современному читателю.
- source_word: מִשְׁפָּטַי עָשָׂה
  choice: исполнял Мои установления
  rationale: 'מִשְׁפָּטַי имеет юридический оттенок: Божьи решения, нормы или установления. «Исполнял Мои установления» звучит естественно и передаёт действие עָשָׂה.'
- source_word: בְּחֻקּוֹתַי הָלָךְ
  choice: следовал Моим постановлениям
  rationale: Буквально «ходил в Моих постановлениях». По-русски «следовал» естественно передаёт устойчивую библейскую метафору образа жизни, не затемняя смысл.
- source_word: בַּעֲוֺן אָבִיו
  choice: за беззаконие своего отца
  rationale: В контексте главы предлог בְּ указывает на основание смерти или наказания. «За» ясно выражает, что сын не умрёт вследствие вины отца.
- source_word: חָיֹה יִחְיֶה
  choice: непременно будет жить
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; «непременно» передаёт эту эмфазу естественным русским языком.
theological_decisions:
- issue: Личная ответственность и наказание за беззаконие отца
  choice: Сын не умрёт за беззаконие своего отца, если поступает праведно.
  alternative: 'Более буквально: «не умрёт в беззаконии своего отца».'
  rationale: Непосредственный контекст Иезекииля 18 подчёркивает личную ответственность. Перевод «за беззаконие» передаёт вероятный причинный смысл, а сноска сохраняет формально возможную более буквальную передачу.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Заглавные буквы в местоимениях «Мои» обозначают речь Бога. Юридическая лексика сохранена, но буквальные еврейские идиомы раскрыты естественными русскими соответствиями; подлинные варианты отмечены в сносках.
