  source_fidelity: 'Основной смысл передан верно: сильное повеление отвергнуть все פשעים, призыв обрести/создать новое сердце и новый дух и риторический вопрос к дому Израиля сохранены. Однако «которыми вы преступали» в русском языке неестественно и может ошибочно восприниматься как указание на средство действия; еврейский однокоренной повтор лучше передать гладко в основном тексте и пояснить в сноске.'
  naturalness: «Отбросьте от себя» и «Зачем вам умирать, дом Израиля?» звучат естественно в современном литературном и пророческом регистре. «Сотворите себе» архаизирует и в современном русском сильнее, чем исходный глагол, вызывает ассоциацию с творением из ничего. «Создайте себе» сохраняет прямоту повеления и более современно.
