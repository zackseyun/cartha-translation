  text: הַשְׁלִ֣יכוּ מֵ/עֲלֵי/כֶ֗ם אֶת כָּל פִּשְׁעֵי/כֶם֙ אֲשֶׁ֣ר פְּשַׁעְתֶּ֣ם בָּ֔/ם וַ/עֲשׂ֥וּ לָ/כֶ֛ם לֵ֥ב חָדָ֖שׁ וְ/ר֣וּחַ חֲדָשָׁ֑ה וְ/לָ֥/מָּה תָמֻ֖תוּ בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/031.yaml
  text: Cast away from yourselves all your transgressions by which you have transgressed[a], and make for yourselves a new heart and a new spirit. Why should you die, O house of Israel?
translation:
  language: ru
  text: Отбросьте от себя все ваши преступления, которые вы совершили[a], и создайте себе новое сердце и новый дух. Зачем вам умирать, дом Израиля?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все ваши мятежи, в которых вы восставали». В еврейском тексте существительное «преступления» и глагол «совершили» образованы от одного корня; повтор подчёркивает вину. Корень может также обозначать мятеж или восстание против законной власти.'
    reason: Передаёт возможный оттенок פשע и поясняет однокоренной повтор оригинала, который невозможно естественно воспроизвести в основном русском тексте.
lexical_decisions:
- source_word: הַשְׁלִיכוּ מֵעֲלֵיכֶם
  choice: Отбросьте от себя
  rationale: Сильное повеление удалить прочь то, что лежит на человеке; выражение естественно по-русски и сохраняет образ решительного отбрасывания.
- source_word: כָּל פִּשְׁעֵיכֶם אֲשֶׁר פְּשַׁעְתֶּם בָּם
  choice: все преступления, которыми вы преступали
  rationale: Однокоренные «преступления» и «преступали» воспроизводят намеренный повтор еврейских существительного и глагола от корня פשע, хотя оборот остается риторически необычным.
- source_word: וַעֲשׂוּ לָכֶם
  choice: и сотворите себе
  rationale: Буквально передает повеление сделать для себя; «сотворите» сохраняет возвышенный пророческий регистр, не ослабляя требования.
- source_word: לֵב חָדָשׁ וְרוּחַ חֲדָשָׁה
  choice: новое сердце и новый дух
  rationale: Сохраняются ключевые образы Иезекииля и различие между לֵב и רוּחַ без поясняющего перефразирования.
- source_word: וְלָמָּה תָמֻתוּ
  choice: Зачем вам умирать
  rationale: Передает риторический призыв и звучит естественнее современного русского буквального «почему вы умрете», не превращая вопрос в простое предсказание.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Традиционное и точное обозначение народа как единого дома; форма обращения понятна без добавления звательной частицы.
theological_decisions:
- issue: Ответственность человека и даруемое Богом обновление сердца и духа
  choice: Сохранить прямое повеление «сотворите себе новое сердце и новый дух».
  alternative: Смягчить до «обретите» либо истолковать в свете обетования, что новое сердце даст Бог.
  rationale: Еврейский текст прямо возлагает требование на адресатов. Перевод не устраняет напряжение с Иез. 36, где обновление представлено действием Бога.
- issue: Смысл корня פשע
  choice: Передать однокоренной парой «преступления — преступали».
  alternative: «мятежи, которыми вы восставали» или более гладкое «все совершённые вами преступления».
  rationale: Однокоренная передача сохраняет обвинительный риторический нажим оригинала; сноска отмечает возможный оттенок сознательного восстания.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Необычный однокоренной оборот сохранен ради риторики оригинала и снабжен сноской; богословское напряжение повеления намеренно не сглажено.
