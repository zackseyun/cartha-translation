  text: אָבִ֞י/ו כִּֽי עָ֣שַׁק עֹ֗שֶׁק גָּזַל֙ גֵּ֣זֶל אָ֔ח וַ/אֲשֶׁ֥ר לֹא ט֛וֹב עָשָׂ֖ה בְּ/ת֣וֹךְ עַמָּ֑י/ו וְ/הִנֵּה מֵ֖ת בַּ/עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/018.yaml
  text: As for his father[a], because he practiced extortion, robbed his brother, and did what was not good among his people, behold[d][c][b], he shall die in his iniquity.
translation:
  language: ru
  text: 'А его отец, поскольку притеснял[a], грабил брата[b] и делал то, что нехорошо, среди своего народа, — вот[c]: он умрёт в своём беззаконии[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «притеснял притеснением»; однокоренная глагольно-именная конструкция усиливает выражение. Возможно также: «совершал притеснения».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «грабил соплеменника». Слово «брат» может обозначать другого члена общины.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское «вот» — эмфатический указательный маркер.
    reason: lexical_alternative
  - marker: d
    text: 'Возможно также: «он умер в своём беззаконии» или «он мёртв в своём беззаконии». Еврейская перфектная форма представляет исход как несомненный. Вместо «в своём беззаконии» по смыслу возможно: «за своё беззаконие».'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: אָבִיו
  choice: его отец
  rationale: Сохраняет явное родство и возобновляет тему отца в противопоставлении праведному сыну.
- source_word: כִּי
  choice: поскольку
  rationale: Передаёт причинное основание участи отца и естественно связывает длинную придаточную часть с итогом.
- source_word: עָשַׁק עֹשֶׁק
  choice: жестоко притеснял
  rationale: Наречие передаёт усиление, выраженное в еврейском однокоренной глагольно-именной конструкции; «притеснял» сохраняет широкий смысл угнетения и эксплуатации.
- source_word: גָּזַל גֵּזֶל אָח
  choice: грабил брата
  rationale: Передаёт насильственное или неправомерное отнятие чужого; «брат» сохранён, хотя в контексте может обозначать соплеменника или члена общины.
- source_word: וַאֲשֶׁר לֹא טוֹב עָשָׂה
  choice: и делал то, что нехорошо
  rationale: Сохраняет намеренно сдержанную еврейскую формулировку «не добро», не заменяя её более сильным словом «зло».
- source_word: בְּתוֹךְ עַמָּיו
  choice: среди своего народа
  rationale: Естественно передаёт общественную среду, в которой совершались проступки.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет эмфатический указательный маркер и пророческую выразительность.
- source_word: מֵת
  choice: он умрёт
  rationale: Еврейская перфектная форма представляет исход как несомненный; русское будущее естественно передаёт судебно-пророческое следствие.
- source_word: בַּעֲוֹנוֹ
  choice: в своём беззаконии
  rationale: Сохраняет личный суффикс, нравственную весомость עָוֹן и образ смерти в состоянии или под бременем собственного беззакония, не сводя предлог только к причинному «за».
theological_decisions:
- issue: Личная ответственность за грех в Иезекииле 18
  choice: Отец умирает в собственном беззаконии; личные местоименные формы и причинная связь сохранены.
  alternative: Общее утверждение о смерти во вине без особого акцента на личной нравственной ответственности.
  rationale: Ближайший контекст противопоставляет поступки отца и сына. Перевод не добавляет систематического богословского вывода, но сохраняет явную отнесённость беззакония и его последствия к отцу.
- issue: Временная и аспектуальная сила מֵת
  choice: Будущее «умрёт» как выражение несомненного приговора.
  alternative: Прошедшее «умер» или настоящее «умирает».
  rationale: Форма допускает представление исхода как уже установленного или совершившегося; основной текст передаёт его как определённое последствие, а примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой судебной речи. Синтаксис причинного периода сохранён, но сделан естественным для русского языка; формула «то, что нехорошо» намеренно близка к сдержанному еврейскому выражению. Все примечания отмечены в основном тексте.
