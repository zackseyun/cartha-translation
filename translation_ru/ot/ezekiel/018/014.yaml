  text: וְ/הִנֵּה֙ הוֹלִ֣יד בֵּ֔ן וַ/יַּ֕רְא אֶת כָּל חַטֹּ֥את אָבִ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּרְאֶ֕ה וְ/לֹ֥א יַעֲשֶׂ֖ה כָּ/הֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/014.yaml
  text: But behold[a], he fathers a son, and he sees all the sins that his father has done; he sees them[b], and he does not do likewise.
translation:
  language: ru
  text: Но вот, у него рождается сын, который видит все грехи, совершённые его отцом; он видит их[a] и не поступает так же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол «видит» повторён для усиления: «видит… видит и не поступает так же».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Но вот
  rationale: Передаёт контраст с предыдущим примером и живую указательную силу הִנֵּה естественным современным русским выражением.
- source_word: הוֹלִיד בֵּן
  choice: у него рождается сын
  rationale: Передаёт рождение следующего поколения без неестественного для современного русского оборота «порождает сына»; субъектом дальнейших действий ясно остаётся сын.
- source_word: וַיַּרְא ... וַיִּרְאֶה
  choice: который видит ... он видит их
  rationale: Настоящее время соответствует наглядному характеру условного примера; повтор глагола ראה сохранён как выразительное усиление.
- source_word: כָּל חַטֹּאת אָבִיו אֲשֶׁר עָשָׂה
  choice: все грехи, совершённые его отцом
  rationale: Сохраняет множественное значение собирательной формы חַטֹּאת и однозначно относит действия к отцу.
- source_word: וְלֹא יַעֲשֶׂה כָּהֵן
  choice: и не поступает так же
  rationale: Естественно передаёт сравнительное значение כָּהֵן и отсылает к греховным поступкам отца.
theological_decisions:
- issue: Личная нравственная ответственность сына
  choice: Сын видит грехи отца, но не повторяет их.
  alternative: Сын несёт вину за поступки отца независимо от собственного поведения.
  rationale: Стих противопоставляет осознанное наблюдение подражанию и тем самым связывает оценку сына с его собственными поступками; более широкие доктринальные выводы в перевод не вносятся.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Оборот «Но вот» сохраняет риторическую наглядность; синтаксис слегка перестроен ради однозначной связи дальнейших действий с сыном.
