  text: וְ/ה֕וּא אֶת כָּל אֵ֖לֶּה לֹ֣א עָשָׂ֑ה כִּ֣י גַ֤ם אֶל הֶֽ/הָרִים֙ אָכַ֔ל וְ/אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/011.yaml
  text: But he has done none of all these things; instead, he has even eaten on the mountains and defiled his neighbor’s wife.
translation:
  language: ru
  text: А он ничего из всего этого не сделал, но даже ел на горах и осквернил жену своего ближнего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת כָּל אֵלֶּה לֹא עָשָׂה
  choice: ничего из всего этого не делал
  rationale: Передаёт отрицание всей совокупности ранее названных праведных поступков и сохраняет естественный русский порядок слов.
- source_word: כִּי גַם
  choice: напротив, он даже
  rationale: В данном контексте сочетание вводит резкое противопоставление последующих грехов отсутствию ранее перечисленных добрых дел; «даже» передаёт усилительную частицу גַם.
- source_word: אֶל הֶהָרִים אָכַל
  choice: ел на горах
  rationale: Сохраняет конкретный и богословски значимый образ культовой трапезы на высотах, не добавляя прямо не выраженного слова «жертвенное».
- source_word: טִמֵּא
  choice: осквернил
  rationale: Формально передаёт культово-нравственную лексику корня טמא и сохраняет эвфемистическую формулировку сексуального греха.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: жену своего ближнего
  rationale: Точно сохраняет брачное отношение и традиционно-библейское, но понятное современному читателю значение רֵעַ.
theological_decisions:
- issue: Значение «ел на горах»
  choice: Сохранить буквальный образ без пояснения в основном тексте
  alternative: «ел жертвенную пищу на святилищах в горах»
  rationale: Контекст указывает на идолопоклонническую практику, однако исходный текст не называет ни жертвенную пищу, ни святилища прямо.
- issue: Характер осквернения жены ближнего
  choice: Сохранить эвфемизм «осквернил»
  alternative: «совершил прелюбодеяние с женой своего ближнего»
  rationale: Более явная формулировка вероятна по контексту, но устранила бы образность и некоторую сдержанность исходного выражения.
translation_notes:
  register: Современный литературный русский с умеренно библейской возвышенностью. Синтаксис сохраняет резкий переход от несовершения праведных дел к совершению тяжких грехов; точка с запятой делает противопоставление ясным без дробления стиха.
