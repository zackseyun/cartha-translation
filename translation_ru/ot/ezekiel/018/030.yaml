source:
  edition: WLC
  text: לָ/כֵן֩ אִ֨ישׁ כִּ/דְרָכָ֜י/ו אֶשְׁפֹּ֤ט אֶתְ/כֶם֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה שׁ֤וּבוּ וְ/הָשִׁ֨יבוּ֙ מִ/כָּל פִּשְׁעֵי/כֶ֔ם וְ/לֹֽא יִהְיֶ֥ה לָ/כֶ֛ם לְ/מִכְשׁ֖וֹל עָוֺֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/030.yaml
  text: Therefore I will judge each man according to his ways[a], O house of Israel, declares the Lord GOD. Repent and turn away from all your transgressions, so that iniquity may not become a stumbling block to you.
translation:
  language: ru
  text: Поэтому Я буду судить каждого по его путям, дом Израиля, — возвещает Владыка ГОСПОДЬ. Обратитесь и отвернитесь от всех ваших преступлений, чтобы беззаконие не стало для вас камнем преткновения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы ваше беззаконие не привело вас к гибели». Заключительная фраза на еврейском языке сжата и может подчёркивать либо само беззаконие как камень преткновения, либо гибель, к которой оно ведёт.'
    reason: Лексическая неоднозначность сочетания לְמִכְשׁוֹל עָוֺן.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения.
- source_word: אִישׁ כִּדְרָכָיו
  choice: каждого по его путям
  rationale: Сохраняет распределительное значение אִישׁ и повторяющийся в главе образ путей как образа поведения.
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: Я буду судить каждого
  rationale: Передаёт судебное значение שׁפט; объект по-русски естественно согласован с распределительным «каждого».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет традиционный библейский образ и употреблено как прямое обращение.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка ГОСПОДЬ
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם, а «Владыка ГОСПОДЬ» различает אֲדֹנָי и имя יהוה.
- source_word: שׁוּבוּ וְהָשִׁיבוּ
  choice: Обратитесь и отвернитесь
  rationale: Первый глагол передаёт призыв изменить направление, второй — удалиться от преступлений; русская формулировка сохраняет параллелизм без неестественного повтора.
- source_word: מִכָּל פִּשְׁעֵיכֶם
  choice: от всех ваших преступлений
  rationale: «Преступления» передаёт тяжесть פֶּשַׁע как сознательного нарушения и мятежа, оставаясь понятным современному читателю.
- source_word: לְמִכְשׁוֹל עָוֺן
  choice: беззаконие не стало для вас камнем преткновения
  rationale: Сохраняет как нравственный смысл עָוֺן, так и метафору מִכְשׁוֹל, не устраняя сжатость и неоднозначность еврейской фразы.
theological_decisions:
- issue: Индивидуальная ответственность внутри коллективного обращения
  choice: Я буду судить каждого по его путям
  alternative: Я буду судить каждого по его поступкам
  rationale: «Каждого» ясно выражает личную ответственность, а «пути» сохраняют образ исходного текста и связь с остальной главой.
- issue: Смысл עָוֺן в заключительной фразе
  choice: беззаконие не стало для вас камнем преткновения
  alternative: чтобы ваше беззаконие не привело вас к гибели
  rationale: Основной текст сохраняет лексические компоненты и метафору оригинала; примечание сообщает возможный смысл последствия — гибели — не делая его единственным толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Метафоры «пути» и «камень преткновения» сохранены; обращение «дом Израиля» не архаизировано частицей «о». Имя יהוה оформлено как ГОСПОДЬ, а אֲדֹנָי — как «Владыка».
