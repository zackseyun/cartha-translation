lexical_decisions:
- source_word: עָנִי וְאֶבְיוֹן
  choice: бедного и нуждающегося
  rationale: Парное выражение обозначает социально уязвимых людей; перевод сохраняет оба определения и естественно звучит по-русски.
- source_word: הוֹנָה
  choice: притеснял
  rationale: Глагол передаёт несправедливое обращение и эксплуатацию, особенно по отношению к бедным и нуждающимся.
- source_word: גְּזֵלוֹת גָּזָל
  choice: грабил
  rationale: Однокоренная конструкция существительного и глагола усиливает идею неправомерного захвата; краткое «грабил» естественно передаёт действие, хотя формальное усиление не воспроизводится буквально.
- source_word: חֲבֹל לֹא יָשִׁיב
  choice: не возвращал залога
  rationale: Речь о вещи, взятой как обеспечение долга; «залог» точно и понятно передаёт правовой и социальный контекст.
- source_word: וְאֶל־הַגִּלּוּלִים נָשָׂא עֵינָיו
  choice: обращал взор к идолам
  rationale: Сохранён образ направленного к идолам взгляда, подразумевающий религиозное почитание, но не заменён более истолковывающим «поклонялся».
- source_word: הַגִּלּוּלִים
  choice: идолам
  rationale: Это ясный основной эквивалент; презрительная окраска особого слова Иезекииля отражена в сноске.
- source_word: תּוֹעֵבָה עָשָׂה
  choice: совершал мерзость
  rationale: «Мерзость» сохраняет сильную нравственно-религиозную оценку существительного, а глагольная конструкция соответствует еврейскому сочетанию.
theological_decisions:
- issue: Идиома обращения взора к идолам и её религиозный смысл
  choice: обращал взор к идолам
  alternative: поклонялся идолам
  rationale: Контекст указывает на идолопоклонство, однако еврейский текст выражает это образно. Перевод сохраняет образ и не устраняет присущую формулировке смысловую широту.
- issue: Характер «мерзости»
  choice: совершал мерзость
  alternative: делал нечто отвратительное
  rationale: Более весомое слово «мерзость» сохраняет богословскую и заветную окраску תּוֹעֵבָה, не ограничивая её только субъективным отвращением.
