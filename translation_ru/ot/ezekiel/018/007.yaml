source:
  edition: WLC
  text: וְ/אִישׁ֙ לֹ֣א יוֹנֶ֔ה חֲבֹלָת֥/וֹ חוֹב֙ יָשִׁ֔יב גְּזֵלָ֖ה לֹ֣א יִגְזֹ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב יִתֵּ֔ן וְ/עֵירֹ֖ם יְכַסֶּה בָּֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/007.yaml
  text: He does not oppress anyone[a], but restores the debtor’s pledge; he does not commit robbery[c][b]; he gives his bread to the hungry and covers the naked with a garment.
translation:
  language: ru
  text: никого не притесняет, возвращает залог, взятый за долг[a], не грабит, отдаёт свой хлеб голодному и покрывает нагого одеждой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвращает должнику взятый у него залог».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנֶה
  choice: притесняет
  rationale: Глагол в породе hифиль обозначает угнетение, эксплуатацию или несправедливое обращение; «притесняет» естественно передаёт социально-экономический смысл контекста.
- source_word: אִישׁ
  choice: никого
  rationale: 'Формально существительное стоит в мужском роде и единственном числе, но при отрицании имеет обобщающий смысл: праведник не притесняет ни одного человека.'
- source_word: חֲבֹלָתוֹ חוֹב יָשִׁיב
  choice: возвращает залог, взятый за долг
  rationale: Речь идёт о вещи, принятой в обеспечение долга. Формулировка сохраняет понятие залога и проясняет его связь с долгом, не добавляя не выраженных в тексте условий.
- source_word: גְּזֵלָה לֹא יִגְזֹל
  choice: не грабит
  rationale: Однокоренные существительное и глагол подчёркивают насильственное или неправомерное присвоение. По-русски краткое «не грабит» передаёт это естественнее, чем тяжеловесное «не совершает грабежа».
- source_word: לַחְמוֹ
  choice: свой хлеб
  rationale: Сохраняется конкретный образ хлеба, который в данном контексте также может представлять пищу вообще.
- source_word: לְרָעֵב
  choice: голодному
  rationale: Прилагательное употреблено субстантивно и обозначает нуждающегося в пище человека.
- source_word: עֵירֹם
  choice: нагого
  rationale: Слово обозначает человека без одежды или без достаточной одежды; прямой русский эквивалент сохраняет образ исходного текста.
- source_word: יְכַסֶּה בָּגֶד
  choice: покрывает нагого одеждой
  rationale: Перевод сохраняет и глагол «покрывать», и существительное «одежда», оставаясь понятным по-русски.
theological_decisions:
- issue: Обобщённый субъект этического описания
  choice: никого не притесняет…
  alternative: не притесняет другого человека…
  rationale: Стих продолжает описание праведника формами мужского рода, однако אִישׁ как объект запрета имеет здесь общий смысл. «Никого» естественно выражает всеобщность запрета и не меняет образ субъекта.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис краткий и последовательный, как в еврейском перечне поступков; конкретные образы «хлеб», «нагой» и «покрывает одеждой» сохранены.
