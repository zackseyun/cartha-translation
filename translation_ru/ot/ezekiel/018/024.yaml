  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְקָת/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל כְּ/כֹ֨ל הַ/תּוֹעֵב֜וֹת אֲשֶׁר עָשָׂ֧ה הָ/רָשָׁ֛ע יַעֲשֶׂ֖ה וָ/חָ֑י כָּל צדקת/ו אֲשֶׁר עָשָׂה֙ לֹ֣א תִזָּכַ֔רְנָה בְּ/מַעֲל֧/וֹ אֲשֶׁר מָעַ֛ל וּ/בְ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א בָּ֥/ם יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/024.yaml
  text: But when a righteous man turns away from his righteousness and does injustice[a], doing all the abominations that the wicked man does, shall he live? None of the righteous deeds that he has done will be remembered. In the treachery by which he has acted treacherously[c][b], and in the sin that he has committed—in them he shall die.
translation:
  language: ru
  text: Но если праведник отступит от своей праведности, станет поступать несправедливо и будет совершать все мерзости, какие совершает нечестивый, — неужели он будет жить? Ни одно из праведных дел, которые он совершил, не будет вспомнено. За вероломство, которое он проявил[a], и за грех, который он совершил, — за них он умрёт[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за неверность, которую он проявил»; в еврейском тексте стоит однокоренная пара, подчёркивающая нарушение верности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в них он умрёт», то есть в упомянутых вероломстве и грехе.'
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: Но если ... отступит
  rationale: Оборот с инфинитивом вводит условно-временную ситуацию, а שׁוּב с מן означает отход от прежнего состояния. «Но» передаёт противопоставление предыдущему стиху.
- source_word: צַדִּיק מִצִּדְקָתוֹ
  choice: праведник отступит от своей праведности
  rationale: Сохраняется лексическая связь между «праведником» и «праведностью», а также собирательно-представительный смысл формы мужского рода единственного числа.
- source_word: וְעָשָׂה עָוֶל
  choice: станет поступать несправедливо
  rationale: עָוֶל обозначает неправду, несправедливость или беззаконие. Глагольная формулировка естественна по-русски и сохраняет нравственную весомость выражения.
- source_word: כְּכֹל הַתּוֹעֵבוֹת
  choice: все мерзости
  rationale: «Мерзости» передаёт сильную нравственно-религиозную окраску תּוֹעֵבוֹת и устойчивую лексику книги Иезекииля.
- source_word: הָרָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное прямо противопоставлено «праведнику» и обозначает типического нечестивого человека.
- source_word: יַעֲשֶׂה וָחָי
  choice: будет совершать ... неужели он будет жить?
  rationale: Риторический вопрос сохранён без смягчения; «неужели» естественно выражает ожидаемый отрицательный ответ.
- source_word: כָּל צִדְקֹתָו ... לֹא תִזָּכַרְנָה
  choice: Ни одно из праведных дел ... не будет вспомнено
  rationale: 'При отрицательном сказуемом כָּל имеет исчерпывающий смысл: ни одно прежнее праведное дело не будет вспомнено. Пассив «будет вспомнено» сохраняет форму и судебный оттенок оригинала.'
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: За вероломство, которое он проявил
  rationale: Корень מעל указывает на нарушение верности, предательство доверия, а не просто на общий проступок. Русский не позволяет естественно воспроизвести однокоренную пару существительного и глагола.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: и за грех, который он совершил
  rationale: Смысл однокоренной конструкции передан естественным русским оборотом без тяжеловесного «грех, которым он согрешил».
- source_word: בָּם יָמוּת
  choice: за них он умрёт
  rationale: Местоимение относится к только что названным вероломству и греху. Русское причинное «за них» ясно передаёт смысл; буквальная пространственно-сферическая форма отмечена в сноске.
theological_decisions:
- issue: Следует ли понимать стих как утрату накопленных заслуг или как ответственность за нынешнее отступничество
  choice: 'Сохранено прямое судебное утверждение: прежние праведные дела не будут вспомнены, а отступивший умрёт за своё вероломство и грех.'
  alternative: Истолковать фразу как техническое учение об утрате заслуг либо ослабить её до указания лишь на земные социальные последствия.
  rationale: Контекст Иезекииля 18 говорит о личной нравственной ответственности перед Богом. Перевод не разрешает более поздние споры о заслугах, стойкости или спасении, а сохраняет напряжение самого текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Избегаются архаизмы вроде «беззаконие соделал» и конфессионально нагруженные пояснения. Риторический вопрос и повтор нравственно-судебной лексики сохранены.
