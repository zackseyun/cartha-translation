source:
  edition: WLC
  text: עַל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ לֹ֥א טִמֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/015.yaml
  text: He has not eaten on the mountains[a], nor lifted up his eyes to the idols of the house of Israel[b]; he has not defiled his neighbor’s wife.
translation:
  language: ru
  text: Он не ел на горах[a], не возводил глаз к идолам дома Израиля[b] и не осквернял жену ближнего своего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть не участвовал в идольских трапезах в горных святилищах.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово, переведённое как «идолы», имеет резко презрительный оттенок; возможно: «мерзкие идолы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הֶהָרִים ... אָכָל
  choice: не ел на горах
  rationale: Сохранён образный оборот оригинала, который в контексте означает участие в идольских трапезах на горных святилищах; пояснение вынесено в сноску.
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: не возводил глаз
  rationale: Естественный для возвышенной русской речи оборот сохраняет еврейский образ направления внимания и почитания к идолам.
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  choice: идолам дома Израиля
  rationale: Основной текст передаёт предметное значение ясно, а пренебрежительно-оскорбительный оттенок еврейского слова отмечен в сноске.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дома Израиля
  rationale: Сохранено характерное для Иезекииля заветно-национальное обозначение, а не сокращено до «Израиля».
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: жену ближнего своего
  rationale: «Ближний» точно передаёт רֵעַ в этическом контексте; местоимение «своего» устраняет возможную неясность принадлежности.
- source_word: לֹא טִמֵּא
  choice: не осквернял
  rationale: Глагол сохраняет нравственно-ритуальную категорию нечистоты в контексте прелюбодеяния, не добавляя отсутствующего в тексте значения насилия.
theological_decisions:
- issue: Культовый смысл еды на горах
  choice: Буквальный образ «не ел на горах» с пояснением об идольских трапезах в сноске.
  alternative: «Не ел в горных святилищах».
  rationale: Контекст связывает выражение с запрещённым культом, однако основной текст не заменяет образ оригинала толкованием.
- issue: Нравственный смысл осквернения жены ближнего
  choice: «Не осквернял жену ближнего своего».
  alternative: «Не вступал в связь с женой ближнего своего» или «не насиловал жену ближнего».
  rationale: Оригинал говорит об осквернении через прелюбодеяние; более описательный вариант ослабляет исходную категорию, а «насиловал» необоснованно вводит значение принуждения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Синтаксис остаётся ясным, а характерные образы и формулы Иезекииля сохранены без архаизмов.
