base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/014.yaml
  text: And from the ledge of the ground to the lower platform shall be two cubits[a], with a width of one cubit; and from the smaller platform to the larger platform shall be four cubits[c][b], with a width of one cubit.
translation:
  language: ru
  text: А от выступа у земли[a] до нижнего уступа — два локтя, а ширина — один локоть; от меньшего уступа до большего уступа — четыре локтя, а ширина — один локоть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лона земли». Здесь может подразумеваться основание жертвенника, углубление или нижний выступ у уровня земли.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «а ширина — локоть»; определённый артикль при слове «локоть» может отсылать к указанной выше мере. Вероятнее всего, имеется в виду ширина в один локоть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיק הָאָרֶץ
  choice: основание на земле
  rationale: Буквально сочетание означает «лоно земли», но в архитектурном описании жертвенника обозначает его основание или нижний выступ на уровне земли. «Основание на земле» естественно передаёт предметный смысл, не вводя образность, неуместную в данном контексте.
- source_word: עֲזָרָה
  choice: уступ
  rationale: В описании ступенчатого жертвенника слово обозначает выступающий конструктивный уровень. «Уступ» ясно передаёт архитектурную форму и подходит как к нижнему, так и к меньшему и большему уровням.
- source_word: הַתַּחְתּוֹנָה
  choice: нижний
  rationale: Прилагательное обозначает расположенный ниже уровень и не требует превосходной степени «самый нижний».
- source_word: שְׁתַּיִם אַמּוֹת
  choice: два локтя
  rationale: Еврейский текст прямо называет величину; вертикальное измерение следует из конструкции «от… до…», поэтому слово «высотой» не добавлено.
- source_word: וְרֹחַב אַמָּה אֶחָת
  choice: а ширина уступа — один локоть
  rationale: Так передано значение ширины выступающей части конструкции естественным современным русским языком; слово «уступа» уточняет подразумеваемый объект.
- source_word: הֳעֲזָרָה הַקְּטַנָּה
  choice: меньший уступ
  rationale: Сравнительная форма по-русски естественно отражает противопоставление последующему большему уступу.
- source_word: הָעֲזָרָה הַגְּדוֹלָה
  choice: больший уступ
  rationale: Сравнительная форма подчёркивает относительный размер двух последовательных уровней жертвенника.
- source_word: אַרְבַּע אַמּוֹת
  choice: четыре локтя
  rationale: Как и в первой части стиха, направление измерения понятно из оборота «от… до…», поэтому «в высоту» не добавлено.
- source_word: וְרֹחַב הָאַמָּה
  choice: а ширина уступа — один локоть
  rationale: 'Буквально: «и ширина — локоть» или «ширина локтя». По параллели с первой частью речь, вероятнее всего, идёт о ширине в один локоть; это отражено в основном тексте и отмечено в сноске.'
