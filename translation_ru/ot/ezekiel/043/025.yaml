  yaml_path: translation/ot/ezekiel/043/025.yaml
  text: For seven days you shall offer a goat as a sin offering each day[a], and they shall offer a bull, a son of the herd, and a ram from the flock[b], without blemish.
translation:
  language: ru
  text: Семь дней ты должен каждый день приносить козла в жертву за грех, а они должны[a] приносить молодого быка[b] и барана из стада — обоих без изъяна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь происходит переход от единственного числа («ты должен приносить») к множественному («они должны приносить»).
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «быка, сына крупного скота». Это устойчивое жертвенное выражение, которое также можно передать как «быка из крупного скота».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Семь дней
  rationale: Сочетание обозначает продолжительность; по-русски длительность естественно выражается винительным падежом без предлога.
- source_word: תַּעֲשֶׂה
  choice: ты должен приносить
  rationale: В контексте жертвоприношения עשה означает совершать приношение; «приносить» ясно передаёт культовый смысл, а местоимение сохраняет обращение во втором лице единственного числа.
- source_word: שְׂעִיר חַטָּאת
  choice: козла в жертву за грех
  rationale: שְׂעִיר — козёл, а חַטָּאת в жертвенном контексте обозначает жертву за грех, а не грех как отвлечённое понятие.
- source_word: לַיּוֹם
  choice: каждый день
  rationale: Оборот указывает на повторение жертвоприношения в каждый из семи дней.
- source_word: וּפַר בֶּן בָּקָר
  choice: молодого быка
  rationale: Буквально выражение звучит как «быка, сына крупного скота»; это устойчивая жертвенная формула, естественно передаваемая по-русски как «молодого быка». Буквальная форма отмечена в сноске.
- source_word: וְאַיִל מִן הַצֹּאן
  choice: и барана из стада
  rationale: אַיִל означает взрослого самца овцы, а מִן הַצֹּאן указывает на его принадлежность к стаду мелкого скота.
- source_word: תְּמִימִים
  choice: обоих без изъяна
  rationale: В жертвенном контексте слово обозначает животных без телесного недостатка. «Обоих» ясно показывает, что форма множественного числа относится и к быку, и к барану.
- source_word: יַעֲשׂוּ
  choice: они должны приносить
  rationale: Сохранён переход от второго лица единственного числа к третьему лицу множественного числа; значение глагола передано в соответствии с жертвенным контекстом.
theological_decisions:
- issue: Смена грамматического субъекта в предписании о жертвах
  choice: Сохранить переход от «ты должен приносить» к «они должны приносить» в основном тексте.
  alternative: 'Согласовать обе части в одном лице: «ты должен приносить» либо «они должны приносить».'
  rationale: В еврейском тексте последовательно стоят תַּעֲשֶׂה, второе лицо единственного числа, и יַעֲשׂוּ, третье лицо множественного числа. Текст не объясняет смену субъекта, поэтому перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной формулировкой. Жертвенная терминология передана привычным выражением «жертва за грех»; необычная смена лица сохранена, а тяжеловесная буквальная формула о быке вынесена в сноску.
