  yaml_path: translation/ot/ezekiel/043/022.yaml
  text: And on the second day you shall present a male goat without blemish for a sin offering[a], and they shall purify the altar just as they purified it with the bull.
translation:
  language: ru
  text: А на второй день принеси козла без порока в жертву за грех[a], и пусть очистят жертвенник так же, как очистили его посредством быка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское חַטָּאת может обозначать не только жертву за грех, но и жертву, посредством которой совершается ритуальное очищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: А на второй день
  rationale: Союз ו сохраняет последовательную связь с предыдущими предписаниями; сочетание «А на второй день» естественно передаёт переход к следующему этапу обряда.
- source_word: תַּקְרִיב
  choice: представь
  rationale: Хифиль глагола קרב в жертвенном контексте означает представить или подвести жертвенное животное. «Представь» сохраняет культовый оттенок и не дублирует последующее обозначение жертвы.
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Устойчивое древнееврейское обозначение самца козы; в русском языке «козёл» однозначно и естественно передаёт пол животного.
- source_word: תָּמִים
  choice: без порока
  rationale: В жертвенном контексте слово обозначает животное без физического изъяна; «без порока» — точная и традиционно понятная формулировка.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Контекст требует понимать חַטָּאת как вид жертвы. Формулировка сохраняет привычную русскую культовую терминологию, а примечание указывает на возможное функциональное понимание как очистительной жертвы.
- source_word: וְחִטְּאוּ אֶת־הַמִּזְבֵּחַ
  choice: и пусть очистят жертвенник
  rationale: Пиэль חטא применительно к жертвеннику обозначает ритуальное очищение, а не нравственное действие. Форма «пусть очистят» естественно передаёт предписывающий характер формы третьего лица.
- source_word: כַּאֲשֶׁר חִטְּאוּ בַּפָּר
  choice: так же, как очистили его посредством быка
  rationale: כַּאֲשֶׁר вводит сравнение с обрядом предыдущего дня, а ב здесь имеет инструментальное значение. «Посредством быка» ясно показывает, что бык служил средством ритуального очищения.
theological_decisions:
- issue: Передача существительного חַטָּאת и глагола חטא в контексте жертвенного очищения
  choice: Существительное передано как «жертва за грех», а глагол — как «очистить».
  alternative: Передать существительное как «очистительная жертва», тем самым явнее обозначив связь существительного и глагола.
  rationale: 'Древнееврейский текст использует один корень для названия жертвы и действия над жертвенником. По-русски буквальное единообразие было бы неестественным: привычное название жертвы — «жертва за грех», тогда как применительно к жертвеннику глагол означает ритуальное очищение. Примечание сохраняет реальную смысловую широту термина, не навязывая более узкого богословского толкования.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным культовым регистром. Единственное число «представь» отражает форму תַּקְרִיב; безлично-предписывающее «пусть очистят» сохраняет смену на третье лицо множественного числа в еврейском тексте.
