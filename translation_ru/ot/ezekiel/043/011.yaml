  text: וְ/אִֽם נִכְלְמ֞וּ מִ/כֹּ֣ל אֲשֶׁר עָשׂ֗וּ צוּרַ֣ת הַ/בַּ֡יִת וּ/תְכוּנָת֡/וֹ וּ/מוֹצָאָ֡י/ו וּ/מוֹבָאָ֣י/ו וְֽ/כָל צֽוּרֹתָ֡/ו וְ/אֵ֣ת כָּל חֻקֹּתָי/ו֩ וְ/כָל צורת/י וְ/כָל תורת/ו הוֹדַ֣ע אוֹתָ֔/ם וּ/כְתֹ֖ב לְ/עֵֽינֵי/הֶ֑ם וְ/יִשְׁמְר֞וּ אֶת כָּל צוּרָת֛/וֹ וְ/אֶת כָּל חֻקֹּתָ֖י/ו וְ/עָשׂ֥וּ אוֹתָֽ/ם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/011.yaml
  text: And if they are ashamed of all that they have done[a], make known to them the design of the house, its arrangement, its exits, its entrances, all its forms, all its statutes, and all its laws; and write it before their eyes[b], so that they may keep its whole design and all its statutes and do them.
translation:
  language: ru
  text: И если они устыдятся всего, что сделали, то покажи им образец храма, его устройство, его выходы и входы, все его очертания, все его установления, все его очертания[a] и все его законы[b]. Запиши это у них на глазах, чтобы они соблюдали весь его образец и все его установления и исполняли их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте выражение «все его очертания» в этом перечне повторяется.
    reason: textual_clarification
  - marker: b
    text: 'Или: «все его наставления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְלְמוּ
  choice: устыдятся
  rationale: Форма нифаля здесь обозначает переживание стыда и раскаяния из-за прежних поступков. «Устыдятся» естественно передаёт условный смысл и нравственную реакцию, не добавляя отдельного понятия покаяния.
- source_word: צוּרַת הַבַּיִת
  choice: облик храма
  rationale: צוּרָה обозначает форму или образец сооружения. «Облик» сохраняет пространственно-архитектурный смысл, а «храм» ясно передаёт значение הַבַּיִת в данном видении.
- source_word: תְכוּנָתוֹ
  choice: его устройство
  rationale: Слово указывает на упорядоченное расположение или конфигурацию сооружения. «Устройство» достаточно широко охватывает планировку и внутренний порядок.
- source_word: מוֹצָאָיו / מוֹבָאָיו
  choice: его выходы и входы
  rationale: Парные существительные в архитектурном контексте естественно обозначают места выхода и входа; сохранён их порядок в еврейском тексте.
- source_word: כָל צוּרֹתָיו / כָל צורתיו
  choice: все его очертания / все его очертания
  rationale: Еврейский текст повторяет однокоренное выражение. Одинаковый перевод сохраняет заметный повтор и архитектурный акцент, не устраняя его как якобы избыточный.
- source_word: חֻקֹּתָיו
  choice: его установления
  rationale: חֻקּוֹת обозначает предписанные нормы. «Установления» сохраняет обязательную силу и хорошо сочетается как с храмовым порядком, так и с правовыми предписаниями.
- source_word: תּוֹרֹתָיו
  choice: его законы
  rationale: Во множественном числе תּוֹרוֹת здесь относится к нормативным наставлениям. «Законы» передаёт их обязательный характер; более широкая возможность «наставления» отмечена в сноске.
- source_word: הוֹדַע אוֹתָם
  choice: покажи им
  rationale: Каузатив ידע буквально означает «дай им узнать». В контексте представления устройства храма «покажи им» звучит естественно и сохраняет наглядный характер повеления.
- source_word: וּכְתֹב לְעֵינֵיהֶם
  choice: запиши это у них на глазах
  rationale: Перевод сохраняет образ публичной записи перед их глазами, но выражает его естественным современным русским языком.
- source_word: וְיִשְׁמְרוּ ... וְעָשׂוּ אֹתָם
  choice: чтобы они соблюдали ... и исполняли их
  rationale: Сохранено различие между внимательным соблюдением предписанного порядка и его практическим исполнением.
theological_decisions:
- issue: Архитектурный чертёж или более широкий образец храма
  choice: Сочетать архитектурные слова «облик», «устройство», «выходы», «входы», «очертания» с нормативными словами «установления» и «законы».
  alternative: Последовательно переводить צוּרָה как «план» или, напротив, обобщить весь перечень как «планы и правила».
  rationale: Сам стих соединяет архитектурную и нормативную лексику. Перевод не решает заранее, следует ли понимать видение исключительно как буквальный строительный проект или символический образ.
- issue: Повтор выражения с корнем צור
  choice: Сохранить оба стоящих в перечне выражения как «все его очертания», а итоговое единственное число передать как «весь его облик».
  alternative: Удалить один повтор как избыточный либо разнообразить лексику так, чтобы повтор стал незаметен.
  rationale: Повтор присутствует в масоретском тексте и может быть значимым. Его устранение без текстового основания было бы молчаливым исправлением источника; сноска предупреждает читателя, что повтор не случаен в переводе.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Храм» употреблено вместо буквального «дом», поскольку контекст однозначно храмовый. Неестественная для русского калька «напиши перед их глазами» заменена выражением «запиши это у них на глазах». Повтор исходного текста сохранён и объяснён сноской.
