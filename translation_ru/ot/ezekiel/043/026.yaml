    issue: Добавлено «а затем»
    rationale: Союз в оригинале не маркирует отдельный последующий этап. В контексте все действия относятся к семидневному периоду; русское «а затем» неоправданно задаёт строгую последовательность.
  - severity: low
    issue: Добавлено слово «обряд»
    rationale: Контекст несомненно культовый, но существительное «обряд» отсутствует в еврейском тексте. «Совершать искупление» сохраняет значение без этой экспликации.
