base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/026.yaml
  text: For seven days they shall make atonement for the altar and cleanse it[a], and they shall consecrate it.
translation:
  language: ru
  text: Семь дней пусть совершают искупление над жертвенником и очищают его, и посвятят его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнят его руку» — культовое выражение, означающее посвящение или введение для служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Семь дней
  rationale: Винительный длительности обозначает период, в течение которого совершаются названные действия; по-русски это естественно передаётся без предлога.
- source_word: יְכַפְּרוּ אֶת הַמִּזְבֵּחַ
  choice: пусть совершают обряд искупления над жертвенником
  rationale: В данном культовом контексте כפר означает совершение искупительно-очистительных обрядов. Сочетание «над жертвенником» естественнее по-русски и не создаёт впечатления, будто сам жертвенник является нравственно виновным.
- source_word: וְטִהֲרוּ אֹתוֹ
  choice: и очищают его
  rationale: טהר здесь обозначает ритуальное очищение; «очищают» понятно современному читателю и сохраняет культовый смысл.
- source_word: וּמִלְאוּ יָדוֹ
  choice: а затем посвятят его
  rationale: Буквально «наполнят его руку» — культовая идиома введения или посвящения для служения. Поскольку речь идёт о жертвеннике, «посвятят его» звучит естественнее, чем «рукоположат его» или буквальная калька.
theological_decisions:
- issue: Значение כפר применительно к жертвеннику
  choice: совершают обряд искупления над жертвенником
  alternative: очищают жертвенник от осквернения
  rationale: Перевод сохраняет традиционный искупительный смысл корня כפר и одновременно показывает, что речь идёт о культовом обряде, не сводя значение только к очищению.
- issue: Передача идиомы וּמִלְאוּ יָדוֹ применительно к жертвеннику
  choice: посвятят его
  alternative: 'введут его в служение; буквально: наполнят его руку'
  rationale: Идиома указывает на посвящение или введение в культовое служение. «Посвятят» подходит неодушевлённому жертвеннику и не привносит специфического представления о рукоположении.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис ясен для широкого круга читателей; культовые термины сохранены, а непрозрачная еврейская идиома разъяснена в сноске.
