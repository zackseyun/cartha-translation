  source_fidelity: 'В целом переданы продолжительность обряда, искупительно-очистительное действие над жертвенником, его очищение и последующее посвящение. Однако «а затем» вносит временную последовательность, которой еврейское וְ не выражает: действия перечислены как совершаемые в течение семи дней. «Обряд» также добавляет слово, отсутствующее в оригинале; глагол «совершать искупление» достаточно ясно обозначает ритуальный контекст.'
  naturalness: «Семь дней пусть совершают…» естественно для современного литературного русского с умеренно библейским регистром. «Посвятят его» естественно применительно к жертвеннику. Удаление «а затем» делает фразу точнее и не ухудшает плавность.
  terminology: «Жертвенник», «искупление», «очищают» и «посвятят» уместны. Сноска верно объясняет идиому מלא יד; формулировка «для служения» чуть яснее, чем «в служение», но оба варианта допустимы. «Над жертвенником» допустимо и передаёт направленность действия без ложного впечатления о моральной вине предмета.
  issues:
