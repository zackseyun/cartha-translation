source:
  edition: WLC
  text: וְ/אֵ֨לֶּה מִדּ֤וֹת הַ/מִּזְבֵּ֨חַ֙ בָּֽ/אַמּ֔וֹת אַמָּ֥ה אַמָּ֖ה וָ/טֹ֑פַח וְ/חֵ֨יק הָ/אַמָּ֜ה וְ/אַמָּה רֹ֗חַב וּ/גְבוּלָ֨/הּ אֶל שְׂפָתָ֤/הּ סָבִיב֙ זֶ֣רֶת הָ/אֶחָ֔ד וְ/זֶ֖ה גַּ֥ב הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/013.yaml
  text: 'And these are the measurements of the altar in cubits (the cubit being a cubit and a handbreadth): its gutter shall be one cubit[a], and one cubit its width, and its border on its rim all around shall be one span[c][b]. And this shall be the base of the altar.'
translation:
  language: ru
  text: 'Вот размеры жертвенника в локтях (локоть здесь равен локтю с ладонью)[a]: его нижняя выемка[b] — локоть в глубину и локоть в ширину; бортик по её краю кругом — одна пядь. Таково основание жертвенника[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть использован удлинённый локоть: обычный локоть с добавлением одной ладони.'
    reason: cultural_note
  - marker: b
    text: 'Или: «желоб», «углубление» либо «нижняя площадка»; точный вид обозначенной еврейским словом חֵיק части неизвестен.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Такова тыльная часть (либо высота) жертвенника»; точное значение еврейского גַּב в этом архитектурном контексте неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹת
  choice: размеры
  rationale: В техническом описании жертвенника слово обозначает его измеряемые параметры; «размеры» естественно и ясно по-русски.
- source_word: בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח
  choice: в локтях (локоть здесь равен локтю с ладонью)
  rationale: Оборот поясняет, что используется удлинённый локоть, равный обычному локтю с добавлением ладони; скобки сохраняют пояснительный характер фразы.
- source_word: חֵיק
  choice: нижняя выемка
  rationale: Редкое архитектурное употребление, вероятно, обозначает углублённую нижнюю часть или желоб у основания; «нижняя выемка» передаёт форму, не утверждая точную конструкцию.
- source_word: רֹחַב
  choice: ширина
  rationale: Обычный термин для поперечного размера сооружения.
- source_word: גְּבוּלָהּ
  choice: бортик
  rationale: Здесь слово обозначает ограничивающий выступ или кайму у края архитектурной детали; «бортик» конкретен и естественен в данном описании.
- source_word: שְׂפָתָהּ
  choice: край
  rationale: Буквально «губа»; применительно к сооружению современное русское «край» звучит естественно.
- source_word: זֶרֶת
  choice: пядь
  rationale: Традиционное и точное русское название меры длины от большого пальца до мизинца.
- source_word: גַּב
  choice: основание
  rationale: Контекст допускает понимание как нижней опорной части жертвенника, однако точное значение редкого технического термина остаётся спорным и потому отмечено в сноске.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшийся русский эквивалент названия сооружения для жертвоприношений.
theological_decisions:
- issue: Неясные архитектурные термины в описании храмового жертвенника
  choice: Передать חֵיק как «нижняя выемка», а גַּב как «основание», сохранив альтернативы в сносках
  alternative: «желоб» или «нижняя площадка» для חֵיק; «тыльная часть», «возвышение» или «высота» для גַּב
  rationale: Текст сообщает размеры, но не позволяет уверенно восстановить точное устройство деталей. Основной перевод остаётся наглядным, а сноски не скрывают лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с ясной технической формулировкой. Сохранены древние меры длины «локоть», «ладонь» и «пядь»; редкие архитектурные термины переведены с умеренной конкретизацией, а подлинная неопределённость вынесена в сноски.
