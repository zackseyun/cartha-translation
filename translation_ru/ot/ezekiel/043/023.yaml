  text: בְּ/כַלּוֹתְ/ךָ֖ מֵֽ/חַטֵּ֑א תַּקְרִיב֙ פַּ֣ר בֶּן בָּקָ֣ר תָּמִ֔ים וְ/אַ֥יִל מִן הַ/צֹּ֖אן תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/023.yaml
  text: When you have finished making purification[c][b][a], you shall present a flawless young bull and a flawless ram from the flock.
translation:
  language: ru
  text: Когда закончишь совершать очищение[a], принеси молодого быка[b] без изъяна[c] и овна из мелкого скота, также без изъяна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершать искупление»; или: «очищать от греха». Древнееврейский глагол в жертвенном контексте может обозначать ритуальное очищение, устранение греха или осквернения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «быка, сына крупного скота».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «непорочного». То же определение далее относится и к овну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכַלּוֹתְךָ
  choice: Когда закончишь
  rationale: Предлог ב с инфинитивом כלה и суффиксом 2-го лица мужского рода вводит временное придаточное и указывает на завершение действия.
- source_word: מֵחַטֵּא
  choice: очищение
  rationale: В данном храмово-жертвенном контексте форма от חטא обозначает ритуальное очищение, буквально устранение греха или осквернения; существительное делает русскую фразу естественной, не сужая смысл до одной богословской категории.
- source_word: תַּקְרִיב
  choice: принеси
  rationale: Каузативная форма קרב в жертвенном контексте означает поднести или представить жертву. «Принеси» ясно и естественно передаёт предписанное действие.
- source_word: פַּר בֶּן בָּקָר
  choice: молодого быка
  rationale: Выражение буквально означает «быка, сына крупного скота» и идиоматически указывает на молодого быка.
- source_word: תָּמִים
  choice: без изъяна
  rationale: В предписаниях о жертвах תמים обозначает животное без физического недостатка; перевод сохраняет культовый смысл и понятен современному читателю.
- source_word: וְאַיִל
  choice: и овна
  rationale: אַיִל — обычное древнееврейское обозначение взрослого самца овцы, то есть овна.
- source_word: מִן הַצֹּאן
  choice: из мелкого скота
  rationale: צאן — собирательное обозначение мелкого домашнего скота, прежде всего овец и коз; такой перевод точнее, чем одно лишь «из отары».
- source_word: תָּמִים
  choice: также без изъяна
  rationale: Повтор определения в древнееврейском тексте относится и к овну; слово «также» естественно сохраняет это повторное требование.
theological_decisions:
- issue: Значение חטא в контексте освящения жертвенника
  choice: очищение
  alternative: совершение искупления; очищение от греха
  rationale: Здесь глагол описывает ритуальное устранение греха или нечистоты. «Очищение» сохраняет культовый смысл и не сводит его исключительно к искуплению, хотя такой оттенок возможен.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но доступным ритуальным словарём. Эллиптический объект очищения не добавлен в основной текст, поскольку в древнееврейском стихе он не назван явно и восстанавливается из контекста.
