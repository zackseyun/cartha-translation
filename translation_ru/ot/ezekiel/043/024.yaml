base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/024.yaml
  text: You shall present them before Yahweh[a], and the priests shall throw salt on them and offer them up as a burnt offering to Yahweh.
translation:
  language: ru
  text: Ты представишь их перед Яхве, и священники бросят[a] на них соль и принесут их как всесожжение для Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кинут». Еврейский глагол буквально означает «бросать», а не более определённое «посыпать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּם
  choice: Ты представишь их
  rationale: Каузативная форма глагола קרב означает «приблизить, подвести, представить». «Представишь» естественно звучит в жертвенном контексте и не смешивает это действие с последующим принесением во всесожжение.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי выражает нахождение перед кем-либо, в чьём-либо присутствии; «перед» кратко и точно передаёт пространственно-реляционное значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: וְהִשְׁלִיכוּ
  choice: бросят
  rationale: Глагол שלך буквально означает «бросать, кидать». Перевод не заменяет его более узким ритуальным глаголом «посыпать» или «окроплять».
- source_word: מֶלַח
  choice: соль
  rationale: Прямой лексический эквивалент; символическое значение соли в самом стихе не разъясняется и в перевод не добавляется.
- source_word: וְהֶעֱלוּ אֹתָם עֹלָה
  choice: принесут их во всесожжение
  rationale: В жертвенном употреблении каузатив עלה означает вознести или принести жертву, а עֹלָה обозначает всесожжение. Русская формулировка естественно передаёт единое жертвенное действие.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата или посвящение жертвы; русская конструкция «принести во всесожжение Яхве» передаёт эту направленность без обязательного повторения предлога.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер действия с солью
  choice: бросят
  alternative: посыплют
  rationale: Текст использует обычный глагол «бросать», не уточняя точный ритуальный способ нанесения соли; перевод сохраняет эту лексическую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис сохраняет последовательность предписанных действий; технический жертвенный термин עֹלָה передан традиционным и понятным словом «всесожжение».
