  text: זֹ֖את תּוֹרַ֣ת הַ/בָּ֑יִת עַל רֹ֣אשׁ הָ֠/הָר כָּל גְּבֻל֞/וֹ סָבִ֤יב סָבִיב֙ קֹ֣דֶשׁ קָדָשִׁ֔ים הִנֵּה זֹ֖את תּוֹרַ֥ת הַ/בָּֽיִת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/012.yaml
  text: 'This is the law of the house: on the top of the mountain[a], all its surrounding territory is most holy. Behold[b], this is the law of the house.'
translation:
  language: ru
  text: 'Вот закон о Храме: на вершине горы вся прилегающая к нему территория[a] — величайшая святыня.[b] Вот закон о Храме.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «вся его граница кругом». Еврейское слово может означать как границу, так и территорию в её пределах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «святыня святынь», то есть нечто в высшей степени святое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת הַבָּיִת
  choice: закон о Храме
  rationale: תּוֹרָה здесь обозначает установление, определяющее священный статус Храма и его территории. «Храм» естественно передаёт контекстуальное значение בַּיִת («дом») и не создаёт в русском тексте неясности.
- source_word: עַל רֹאשׁ הָהָר
  choice: на вершине горы
  rationale: רֹאשׁ буквально означает «голова», но в топографическом контексте естественно переводится как «вершина».
- source_word: כָּל גְּבֻלוֹ סָבִיב סָבִיב
  choice: вся прилегающая к нему территория
  rationale: גְּבוּל может обозначать как границу, так и ограниченную ею территорию; удвоенное סָבִיב подчёркивает охват со всех сторон. Основной перевод передаёт предполагаемый пространственный смысл, а более буквальный вариант сохранён в примечании.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: величайшая святыня
  rationale: 'Сочетание существительных выражает превосходную степень: «наиболее святое, величайшая святыня». Такой перевод ясно показывает, что речь идёт о священном статусе всей указанной территории, а не только о помещении Святого святых.'
- source_word: הִנֵּה
  choice: вот
  rationale: הִנֵּה привлекает внимание к заключительному повторению и естественно передаётся торжественным, но современным русским «вот».
- source_word: זֹאת ... זֹאת
  choice: вот ... вот
  rationale: Повтор указательного элемента сохранён, чтобы передать обрамляющую структуру и смысловое ударение еврейского текста.
theological_decisions:
- issue: Степень святости окружающей территории
  choice: вся обозначенная территория названа «величайшей святыней»
  alternative: понимать «святыню святынь» как название внутреннего святилища
  rationale: Синтаксис относит קֹדֶשׁ קָדָשִׁים ко всей территории на вершине горы; перевод не сужает это определение до внутреннего помещения Храма.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Написание «Храм» с прописной буквы указывает на конкретный Храм видения Иезекииля. Повтор «вот закон о Храме» сохранён как композиционное обрамление стиха.
