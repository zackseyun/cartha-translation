  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ אֶת מְק֣וֹם כִּסְאִ֗/י וְ/אֶת מְקוֹם֙ כַּפּ֣וֹת רַגְלַ֔/י אֲשֶׁ֧ר אֶשְׁכָּן שָׁ֛ם בְּ/ת֥וֹךְ בְּנֵֽי יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם וְ/לֹ֣א יְטַמְּא֣וּ ע֣וֹד בֵּֽית יִ֠שְׂרָאֵל שֵׁ֣ם קָדְשִׁ֞/י הֵ֤מָּה וּ/מַלְכֵי/הֶם֙ בִּ/זְנוּתָ֔/ם וּ/בְ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם בָּמוֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/007.yaml
  text: And he said to me[a], “Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell among the children of Israel forever. And the house of Israel shall no longer defile my holy name, neither they nor their kings, by their prostitution and by the corpses of their kings on their high places.”
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий, вот место Моего престола и место для стоп Моих ног; здесь Я буду обитать среди сынов Израиля вовеки. Дом Израиля больше не будет осквернять Моё святое имя — ни сам дом Израиля, ни его цари — своим блудом и трупами своих царей на их высотах.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «и трупами своих царей во время их смерти». Последнее еврейское слово традиционно читается как «на их высотах», что соответствует контексту культового осквернения, но некоторые связывают его со словом «смерть».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивую для книги Иезекииля форму обращения и еврейский идиоматический образ, оставаясь понятным в современном русском библейском регистре.
- source_word: מְקוֹם כִּסְאִי
  choice: место Моего престола
  rationale: Прямая и естественная передача конструкции принадлежности.
- source_word: מְקוֹם כַּפּוֹת רַגְלַי
  choice: место, где будут стоять стопы Моих ног
  rationale: Сохраняет буквальный образ стоп, не подменяя его толковательным словом «подножие»; глагольное оформление делает выражение естественнее по-русски.
- source_word: אֲשֶׁר אֶשְׁכָּן שָׁם
  choice: Здесь Я буду обитать
  rationale: Передаёт указание на названное место и перспективное значение имперфекта в контексте видения.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: «Среди» естественно передаёт בְּתוֹךְ, а «сыны Израиля» сохраняет родственный и заветный характер исходного выражения.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Краткое и достоинственное русское соответствие длительности без ограничения срока.
- source_word: יְטַמְּאוּ
  choice: больше не будет осквернять
  rationale: Передаёт значение ритуального осквернения и хорошо сочетается с объектом «Моё святое имя».
- source_word: שֵׁם קָדְשִׁי
  choice: Моё святое имя
  rationale: Естественная и точная передача еврейского сочетания.
- source_word: הֵמָּה וּמַלְכֵיהֶם
  choice: ни они, ни их цари
  rationale: Русская отрицательная конструкция ясно передаёт координацию при предшествующем отрицании.
- source_word: בִּזְנוּתָם
  choice: своим блудом
  rationale: Сохраняет резкость пророческого образа и его возможные буквальные и заветно-метафорические оттенки.
- source_word: וּבְפִגְרֵי מַלְכֵיהֶם
  choice: и трупами своих царей
  rationale: «Трупы» прямо передаёт פגרים и сохраняет связь с осквернением от мёртвых тел.
- source_word: בָּמוֹתָם
  choice: на их высотах
  rationale: Следует масоретской огласовке и культовому значению בָּמוֹת; сохраняет двусмысленную референцию местоимения, не уточняя, кому именно принадлежат высоты.
theological_decisions:
- issue: Характер осквернения в заключительной части стиха
  choice: Культовое и заветное осквернение блудом и трупами царей на высотах
  alternative: «Трупами своих царей при их смерти»
  rationale: Масоретская огласовка и храмовый контекст поддерживают чтение «на их высотах», однако возможная связь последнего слова со смертью сохраняется в сноске, чтобы не устранять реальную текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис слегка упрощён для ясности, при этом сохранены ключевые храмовые образы, терминология чистоты и осквернения и неоднозначность последнего слова.
