  naturalness: Стиль в целом современный литературный и уместно торжественный. «Ни они, ни их цари» после «Дом Израиля» звучит грамматически неустойчиво; «ни сам дом Израиля, ни его цари» естественно и ясно.
  terminology: «Сын человеческий», «престол», «обитать», «осквернять», «святое имя», «блуд», «трупы» и «высоты» уместны. «Вовеки» допустимо в литературно-библейском регистре. Сноска правильно сохраняет спорную возможность прочтения последнего слова.
