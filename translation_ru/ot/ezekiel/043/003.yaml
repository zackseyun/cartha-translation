base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/003.yaml
  text: And the appearance of what I saw was like the appearance that I had seen when I came to destroy the city[a], and the visions were like the appearance that I had seen by the Kebar Canal[b]; and I fell on my face.
translation:
  language: ru
  text: И вид того, что я увидел, был подобен тому виду, который я видел, когда пришёл разрушить город[a]; и видения были подобны тому видению, которое я видел у канала Кевар[b]. И я пал лицом вниз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он пришёл разрушить город». В еврейском тексте буквально стоит «когда я пришёл»; это может указывать на участие Иезекииля в видении разрушения Иерусалима, а не на то, что он лично разрушал город.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «у реки Кевар»; вероятно, имеется в виду крупный канал в Вавилонии, а не естественная река.'
    reason: cultural_note
lexical_decisions:
- source_word: מַרְאֵה / מַרְאוֹת
  choice: вид / видения / видение
  rationale: 'Повтор корня сохранён настолько, насколько позволяет естественный русский: начальные формы переданы как «вид», множественное число — «видения», а последнее единственное — «видение». Это сохраняет переход числа и зрительную направленность текста.'
- source_word: רָאִיתִי
  choice: я видел / увиденного мною
  rationale: Форма обозначает прежний опыт пророка; русский контекст сравнения ясно передаёт предшествование без обязательного добавления «прежде».
- source_word: בְּבֹאִי
  choice: когда пришёл
  rationale: Временное значение инфинитива с суффиксом первого лица сохранено без изменения лица и без истолковывающего смягчения.
- source_word: לְשַׁחֵת
  choice: разрушить
  rationale: Прямо передаёт значение причинения гибели или разорения в данном контексте.
- source_word: הָעִיר
  choice: город
  rationale: Сохранено исходное общее обозначение; Иерусалим не назван прямо и потому не подставлен в основной текст.
- source_word: אֶל נְהַר כְּבָר
  choice: у канала Кевар
  rationale: Предлог передан локативно, а נְהַר в вавилонском географическом контексте — как канал, что точнее предполагаемой реалии, чем «река».
- source_word: וָאֶפֹּל אֶל־פָּנַי
  choice: и я пал лицом вниз
  rationale: Естественно и достойно передаёт телесную позу благоговения и потрясения, не превращая её в отвлечённое толкование.
theological_decisions:
- issue: Кто подразумевается в словах «когда пришёл разрушить город»
  choice: 'Сохранить первое лицо: «когда пришёл разрушить город».'
  alternative: «когда Он пришёл разрушить город»
  rationale: Масоретский текст содержит форму первого лица. Она может отражать участие Иезекииля в видении суда, но перевод не должен без текстового основания менять лицо и устранять напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Намеренный повтор зрительной лексики преимущественно сохранён; трудное первое лицо не устранено. Имена и реалии переданы в понятной современной форме.
