  source_fidelity: 'Смысл и повтор зрительной лексики в целом переданы верно: сохранены первое лицо в трудной формуле «когда пришёл разрушить город», множественное «видения», сопоставление с прежним опытом у Кевара и жест падения ниц. Однако начальное «вид увиденного мною» формально возможно, но в современном литературном русском звучит тяжеловесно и менее прозрачно, чем конструкция с придаточным.'
