base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/018.yaml
  text: 'And he said to me[a], “Son of man, thus says the Lord GOD: These are the statutes of the altar on the day it is made[c][b], for offering burnt offerings on it and for sprinkling blood on it.”'
translation:
  language: ru
  text: 'И он сказал мне: «Сын человеческий, так говорит Владыка Яхве: вот установления для жертвенника в день его сооружения[a]: возносить на нём всесожжения[b] и окроплять его кровью[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в день его сооружения»; возможно также более общее понимание: «когда он будет сооружён».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всесожжение»; в еврейском тексте стоит единственное число, которое здесь может иметь собирательное значение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выплёскивать на него кровь»; еврейский глагол может обозначать более энергичное ритуальное нанесение крови, чем иногда предполагает слово «окроплять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устойчивое обращение к Иезекиилю; сохраняет повторяющуюся древнееврейскую идиому и её литературную функцию.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה, избегая неестественного сочетания «Господь ГОСПОДЬ».
- source_word: חֻקּוֹת הַמִּזְבֵּחַ
  choice: установления для жертвенника
  rationale: חֻקּוֹת обозначает предписанные нормы; конструкция выражает правила, относящиеся к жертвеннику.
- source_word: בְּיוֹם הֵעָשׂוֹתוֹ
  choice: на день его сооружения
  rationale: Передаёт буквальную временную конструкцию «в день его изготовления», сохраняя возможность более общего понимания «когда он будет сооружён».
- source_word: לְהַעֲלוֹת ... עוֹלָה
  choice: возносить на нём всесожжения
  rationale: В жертвенном контексте каузатив עלה означает принесение жертвы на жертвеннике; «всесожжения» — традиционный и точный термин для עוֹלָה, единственное число которого здесь может иметь собирательное значение.
- source_word: וְלִזְרֹק עָלָיו דָּם
  choice: и окроплять его кровью
  rationale: Передаёт ритуальное нанесение крови на жертвенник; «окроплять» понятно русскому читателю, хотя זרק может подразумевать более энергичное действие.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Сохраняется различие между титулом אֲדֹנָי и личным именем יהוה без искусственного повтора и без подмены имени общим титулом.
- issue: Число существительного עוֹלָה
  choice: всесожжения
  alternative: всесожжение
  rationale: Грамматически слово стоит в единственном числе, но в общем предписании может употребляться собирательно; множественное число естественно выражает повторяющееся назначение жертвенника, а буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но ясным ритуально-правовым регистром. Синтаксис сохраняет последовательность исходного текста, не становясь тяжеловесным; неоднозначности временной конструкции, числа названия жертвы и способа нанесения крови вынесены в сноски.
