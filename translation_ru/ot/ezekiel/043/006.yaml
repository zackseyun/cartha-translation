  text: וָ/אֶשְׁמַ֛ע מִדַּבֵּ֥ר אֵלַ֖/י מֵ/הַ/בָּ֑יִת וְ/אִ֕ישׁ הָיָ֥ה עֹמֵ֖ד אֶצְלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/006.yaml
  text: Then I heard one speaking to me from the house[b][a], while a man was standing beside me.
translation:
  language: ru
  text: И услышал я, как кто-то говорил мне из дома[b][a], а рядом со мной стоял человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я услышал голос, говоривший мне из дома». В еврейском тексте существительное «голос» отсутствует, и говорящий в этом стихе прямо не назван.'
    reason: lexical_alternative
  - marker: b
    text: Под «домом» здесь подразумевается здание храма в видении Иезекииля.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: И услышал я
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; инверсия сохраняет торжественный, но понятный библейский регистр.
- source_word: מִדַּבֵּר
  choice: как кто-то говорил
  rationale: Еврейская конструкция передаёт слышимую речь в процессе, но прямо не называет ни подлежащего, ни «голоса». Неопределённое «кто-то» позволяет естественно выразить это по-русски, не устанавливая личность говорящего.
- source_word: אֵלַי
  choice: мне
  rationale: Предлог אֶל обозначает направленность речи к пророку; «мне» естественно передаёт значение «ко мне / обращаясь ко мне».
- source_word: מֵהַבָּיִת
  choice: из дома
  rationale: בַּיִת буквально означает «дом»; в данном видении речь идёт о здании храма, что поясняется в сноске без подмены исходного образа в основном тексте.
- source_word: וְאִישׁ
  choice: а … человек
  rationale: אִישׁ употреблено без артикля. «Человек» естественно для современного русского повествования, а союз «а» вводит одновременное обстоятельство сцены.
- source_word: הָיָה עֹמֵד
  choice: стоял
  rationale: Сочетание היה с причастием выражает продолжавшееся состояние в прошлом; русский глагол несовершенного вида передаёт эту длительность.
- source_word: אֶצְלִי
  choice: рядом со мной
  rationale: אֵצֶל обозначает непосредственную близость; выбран естественный современный русский эквивалент.
theological_decisions:
- issue: Личность говорящего из храмового дома
  choice: 'Не определять личность говорящего: «как кто-то говорил мне из дома».'
  alternative: «Я услышал, как Он говорил мне из дома» или «я услышал голос, говоривший мне из дома».
  rationale: Хотя контекст может указывать на божественного Говорящего, сам еврейский текст этого стиха не называет его и не содержит существительного «голос». Неопределённая формулировка сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок «услышал я» поддерживает повествовательный регистр, не прибегая к архаизмам; неопределённость личности говорящего сохранена.
