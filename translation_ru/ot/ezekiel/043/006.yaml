  terminology: «Дом» оправдан как буквальная передача בַּיִת; сноска корректно уточняет храмовый референт, не подменяя основной текст. «Кто-то» не называет говорящего и не добавляет отсутствующее в оригинале слово «голос». Имена и специальные богословские термины в стихе отсутствуют.
