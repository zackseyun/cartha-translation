source:
  edition: WLC
  text: עַתָּ֞ה יְרַחֲק֧וּ אֶת זְנוּתָ֛/ם וּ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם מִמֶּ֑/נִּי וְ/שָׁכַנְתִּ֥י בְ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/009.yaml
  text: Now let them put far from me their prostitution and the corpses of their kings[b][a], and I will dwell in their midst forever.
translation:
  language: ru
  text: Теперь пусть они удалят от Меня своё блудодейство[a] и трупы своих царей[b], и Я буду обитать среди них вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свой блуд». В пророческой речи это образ неверности завету, нередко выражавшейся в идолопоклонстве.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «трупы своих царей» может означать буквально тела умерших царей либо шире — осквернявшие святилище царские погребения или памятные сооружения рядом с ним.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт временной и дискурсивный переход к требуемой перемене после предшествующего обличения.
- source_word: יְרַחֲקוּ
  choice: пусть они удалят
  rationale: Каузативная форма от רחק означает «сделать далёким, удалить»; в данном контексте выражает побуждение, а не простое предсказание.
- source_word: זְנוּתָם
  choice: своё блудодейство
  rationale: Сохраняет резкую пророческую метафору неверности завету, часто проявлявшейся в идолопоклонстве, не подменяя её толкованием.
- source_word: פִגְרֵי מַלְכֵיהֶם
  choice: трупы своих царей
  rationale: Прямо передаёт конкретное значение פגר — «труп, мёртвое тело» — и не решает спорный вопрос о точном историческом референте.
- source_word: מִמֶּנִּי
  choice: от Меня
  rationale: Передаёт удаление осквернения от Божьего присутствия; естественно сочетается с глаголом «удалят».
- source_word: וְשָׁכַנְתִּי
  choice: и Я буду обитать
  rationale: «Обитать» сохраняет смысл постоянного Божьего присутствия и традиционную богословскую выразительность корня שכן.
- source_word: בְתוֹכָם
  choice: среди них
  rationale: Естественно по-русски выражает пребывание Бога внутри общины, не ослабляя пространственного и заветного смысла.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Кратко и торжественно передаёт непреходящую длительность в контексте восстановления.
theological_decisions:
- issue: Характер זְנוּתָם в пророческом контексте
  choice: 'Сохранена метафора: «своё блудодейство»'
  alternative: «своё идолопоклонство» или «свою половую распущенность»
  rationale: Еврейское слово обозначает образ неверности завету и не должно быть ни сведено к одному виду полового греха, ни заранее истолковано только как идолопоклонство.
- issue: Смысловая сила יְרַחֲקוּ
  choice: 'Побуждение: «пусть они удалят»'
  alternative: 'Предсказание: «они удалят»'
  rationale: После עַתָּה форма в контексте выражает требуемое от народа действие как условие очищенного Божьего присутствия.
- issue: Референт выражения פִגְרֵי מַלְכֵיהֶם
  choice: Сохранено конкретное выражение «трупы своих царей»
  alternative: «погребальные сооружения царей», «памятники царям» или «остатки царского идолопоклонства»
  rationale: Точный исторический референт спорен; основной текст сохраняет буквальную конкретность еврейского выражения, а возможное расширительное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. «Блудодейство» намеренно сохраняет пророческую метафору; «трупы» передаёт резкую конкретность оригинала. Божественные местоимения написаны с прописной буквы по принятой русской библейской традиции.
