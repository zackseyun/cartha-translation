revisions:
- from: Когда они ставили свой порог рядом с Моим порогом и свои дверные косяки рядом с Моими дверными косяками[a], так что между Мной и ими была лишь стена, они оскверняли Моё святое имя своими мерзостями, которые совершали; и Я истребил их в Своём гневе[b].
  to: Когда они ставили свой порог рядом с Моим порогом и свои дверные косяки рядом с Моими дверными косяками[a], а между Мною и ими была стена, они оскверняли Моё святое имя мерзостями, которые они совершали; и Я поглотил их в Своём гневе[b].
  rationale: Убраны не выраженные прямо результативность («так что») и ограничение («лишь»), чтобы сохранить синтаксическую сдержанность древнееврейского текста. «Поглотил» возвращает образный характер אכל в основном тексте, а сноска поясняет буквальное значение и его судебный контекст. Остальные решения сохранены.
