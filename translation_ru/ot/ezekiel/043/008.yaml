base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/008.yaml
  text: When they set their threshold beside my threshold and their doorposts beside my doorposts[a], with only the wall between me and them, they defiled my holy name by the abominations that they committed[c][b]; so I consumed them in my anger.
translation:
  language: ru
  text: Когда они ставили свой порог рядом с Моим порогом и свои дверные косяки рядом с Моими дверными косяками[a], а между Мною и ими была стена, они оскверняли Моё святое имя мерзостями, которые они совершали; и Я поглотил их в Своём гневе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои дверные столбы рядом с Моими дверными столбами». Еврейское слово обозначает боковой косяк или столб дверного проёма.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я ел их»; в данном контексте это образ Божьего суда, то есть уничтожения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִתָּם
  choice: Когда они ставили
  rationale: Предлог ב с инфинитивом образует временно-обстоятельственный оборот. Несовершенный вид естественно передаёт повторявшееся или продолжавшееся действие в данном контексте.
- source_word: סִפָּם / סִפִּי
  choice: свой порог / Моим порогом
  rationale: Сַף обозначает порог или нижнюю часть дверного проёма; «порог» ясно и естественно сохраняет архитектурный образ.
- source_word: מְזוּזָתָם / מְזוּזָתִי
  choice: свои дверные косяки / Моими дверными косяками
  rationale: מְזוּזָה означает дверной косяк, то есть боковой вертикальный элемент дверного проёма.
- source_word: אֵצֶל
  choice: рядом с
  rationale: Передаёт непосредственную близость без добавления не выраженной в тексте оценки.
- source_word: וְהַקִּיר בֵּינִי וּבֵינֵיהֶם
  choice: так что между Мной и ими была лишь стена
  rationale: Еврейское безглагольное предложение описывает стену как единственную преграду между священным и соседним пространством. «Лишь» естественно выражает подчёркнутую непосредственную близость, подразумеваемую контекстом.
- source_word: וְטִמְּאוּ
  choice: они оскверняли
  rationale: Пиэль глагола טמא означает делать нечистым, осквернять; несовершенный вид согласуется с предшествующим описанием их практики.
- source_word: שֵׁם קָדְשִׁי
  choice: Моё святое имя
  rationale: Буквальная и естественная передача устойчивого древнееврейского выражения.
- source_word: בְּתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ
  choice: своими мерзостями, которые совершали
  rationale: ב передаёт средство или причину осквернения; תּוֹעֵבָה сохраняет сильную религиозно-нравственную оценку, а «совершали» идиоматично сочетается с «мерзостями».
- source_word: וָאֲכַל אֹתָם
  choice: и Я истребил их
  rationale: Глагол אכל буквально значит «есть, пожирать», но здесь метафорически обозначает уничтожение в суде. «Истребил» ясно передаёт результат, а сноска сохраняет исходный образ.
- source_word: בְּאַפִּי
  choice: в Своём гневе
  rationale: אַף буквально связано с носом, но в данном устойчивом употреблении означает гнев.
theological_decisions:
- issue: Антропоморфный образ суда в וָאֲכַל אֹתָם
  choice: «Я истребил их» с пояснением буквального образа в сноске
  alternative: «Я пожрал их» или «Я поглотил их»
  rationale: Контекст требует значения уничтожения посредством Божьего суда. Основной текст остаётся понятным современному читателю, а сноска не скрывает резкость древнееврейской метафоры.
- issue: Связь между осквернением и Божьим судом
  choice: Сохранён союз «и»
  alternative: «поэтому Я истребил их»
  rationale: Еврейский ו допускает последовательное или следственное понимание, но не выражает причинность отдельным явным словом; «и» сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Архитектурные термины переданы общеупотребительно; исходная метафора Божьего суда раскрыта в сноске. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
