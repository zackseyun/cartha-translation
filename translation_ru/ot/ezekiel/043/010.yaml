id: EZK.43.10
reference: Ezekiel 43:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַתָּ֣ה בֶן אָדָ֗ם הַגֵּ֤ד אֶת בֵּֽית יִשְׂרָאֵל֙ אֶת הַ/בַּ֔יִת וְ/יִכָּלְמ֖וּ מֵ/עֲוֺנֽוֹתֵי/הֶ֑ם וּ/מָדְד֖וּ אֶת תָּכְנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/010.yaml
  text: As for you[a], son of man, declare the temple to the house of Israel, so that they may be ashamed of their iniquities[b]; and let them measure the plan.
translation:
  language: ru
  text: Ты же, сын человеческий, возвести дому Израиля о храме[a], чтобы они устыдились своих беззаконий; и пусть измерят его план[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о доме». Здесь имеется в виду храм, или святилище, показанный Иезекиилю в видении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очертание», «устройство» или «чертёж».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и литературную преемственность книги; в современном русском звучит возвышенно, но понятно.
- source_word: הַגֵּד
  choice: возвести
  rationale: Передаёт повеление ясно сообщить или объявить; соответствует торжественному пророческому регистру, не будучи архаизмом.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет традиционное собирательное и заветное обозначение народа Израиля в пророческой речи.
- source_word: הַבַּיִת
  choice: храм
  rationale: Буквально «дом», но в контексте видения Иезекииля слово обозначает святилище; «храм» ясно передаёт референт.
- source_word: וְיִכָּלְמוּ
  choice: чтобы они устыдились
  rationale: Форма после повеления естественно выражает цель или предполагаемый результат; русский союз «чтобы» сохраняет эту связь.
- source_word: מֵעֲוֺנוֹתֵיהֶם
  choice: своих беззаконий
  rationale: «Беззакония» сохраняет нравственную тяжесть עָוֹן и естественно сочетается с глаголом «устыдиться».
- source_word: וּמָדְדוּ
  choice: и пусть измерят
  rationale: Передаёт побудительно-желательное продолжение повеления, не превращая действие в безусловное предсказание.
- source_word: תָּכְנִית
  choice: план
  rationale: В данном архитектурном контексте обозначает очертание, устройство или проект храма; «план» краток и понятен современному читателю.
theological_decisions:
- issue: Референт слова הַבַּיִת в храмовом видении
  choice: «храм»
  alternative: «дом»
  rationale: Контекст Иезекииля 40–43 однозначно указывает на святилище. Перевод «храм» устраняет ненужную для современного читателя двусмысленность, не добавляя конфессионального толкования.
- issue: Смысл глагольных форм после повеления
  choice: 'Цель и последующее побуждение: «чтобы они устыдились… и пусть измерят»'
  alternative: 'Простое следствие или будущее: «и они устыдятся… и измерят»'
  rationale: Синтаксис допускает оттенок результата, но после повелительного הַגֵּד наиболее естественно выражены желаемая цель и побуждение. Перевод не представляет человеческий отклик как безусловно предсказанный.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Сохранены устойчивые библейские выражения «сын человеческий» и «дом Израиля»; синтаксис сделан ясным для обычного читателя.
