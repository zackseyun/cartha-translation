lexical_decisions:
- source_word: הָאֲרִיאֵל
  choice: верхняя площадка жертвенника
  rationale: В описании храма у Иезекииля слово обозначает верхнюю часть жертвенника, где горит огонь; такой перевод передаёт архитектурно-культовый смысл яснее, чем транслитерация «ариэль».
- source_word: שְׁתֵּים עֶשְׂרֵה אֹרֶךְ בִּשְׁתֵּים עֶשְׂרֵה רֹחַב
  choice: двенадцать локтей в длину и двенадцать в ширину
  rationale: Естественная русская формула размеров; единица измерения восполнена из ближайшего контекста.
- source_word: רָבוּעַ
  choice: квадратная
  rationale: Слово прямо указывает на квадратную форму площадки; женский род согласован со словом «площадка».
- source_word: אֶל אַרְבַּעַת רְבָעָיו
  choice: по всем четырём сторонам
  rationale: Передаёт пространственный смысл выражения и сохраняет связь с четырьмя сторонами; буквальное «к четырём его четвертям» в современном русском неясно.
- source_word: implicit measurement unit from context
  choice: локтей
  rationale: В еврейском тексте стиха единица не повторена, но определяется предшествующим описанием размеров жертвенника и нужна для ясности по-русски.
