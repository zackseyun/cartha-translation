source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶל הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֡ם אֲשֶׁ֣ר הֵם֩ מִ/זֶּ֨רַע צָד֜וֹק הַ/קְּרֹבִ֣ים אֵלַ֗/י נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה לְ/שָֽׁרְתֵ֑/נִי פַּ֥ר בֶּן בָּקָ֖ר לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/019.yaml
  text: And you shall give to the Levitical priests who are from the offspring of Zadok[a], who draw near to me to minister to me, declares the Lord GOD, a bull from the herd for a sin offering.
translation:
  language: ru
  text: И дай священникам-левитам из потомков Садока, которые приближаются ко Мне, чтобы служить Мне, — возвещает Владыка Яхве, — молодого быка из стада в жертву за грех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: И дай
  rationale: Перфект с союзом в контексте предписания передаёт повеление; русское «дай» естественно выражает директивную силу, а «и» сохраняет связь с предыдущим текстом.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священникам-левитам
  rationale: Сочетание обозначает священников из левитского сословия, а не всех левитов; форма через дефис ясно и кратко сохраняет оба элемента.
- source_word: אֲשֶׁר הֵם מִזֶּרַע צָדוֹק
  choice: из потомков Садока
  rationale: Передаёт генеалогический смысл זֶרַע естественным современным русским языком без ненужного буквализма «из семени».
- source_word: הַקְּרֹבִים אֵלַי
  choice: которые приближаются ко Мне
  rationale: Сохраняет буквальный образ и культовый оттенок приближения к Богу для священнослужения.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передан как формула пророческого провозглашения; אֲדֹנָי — «Владыка», а тетраграмматон — личным именем «Яхве», что избегает сочетания «Господь Господь».
- source_word: לְשָׁרְתֵנִי
  choice: чтобы служить Мне
  rationale: В контексте священства «служить» естественно обозначает культовое служение; цель выражена ясной русской конструкцией.
- source_word: פַּר בֶּן בָּקָר
  choice: молодого быка из стада
  rationale: Идиоматично передаёт устойчивое обозначение животного; בֶּן указывает на принадлежность к крупному рогатому скоту и может подразумевать молодое животное, без буквального «сына стада».
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В данном жертвенном контексте חַטָּאת обозначает установленную жертву, а не грех как абстрактное понятие.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Раздельно передаёт титул אֲדֹנָי и собственное имя יהוה, сохраняя различие исходного текста и избегая тавтологии.
- issue: Культовый смысл הַקְּרֹבִים и לְשָׁרְתֵנִי
  choice: приближаются ко Мне, чтобы служить Мне
  alternative: приступают ко Мне для священнослужения
  rationale: Выбранная формулировка сохраняет образ приближения и служения, не добавляя в основной текст более узкое толкование, чем прямо выражено в еврейском.
- issue: Значение חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное обозначение сохраняет связь жертвы с грехом; вариант «очистительная жертва» подчёркивает ритуальный эффект, но частично интерпретирует многозначный термин.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Синтаксис сохраняет пророческую вставную формулу; прописные местоимения по отношению к Богу поддерживают принятый русский религиозный стиль. Буквальное «быка, сына стада» не воспроизведено как неестественное по-русски.
