  text: וִֽ/יכַלּ֖וּ אֶת הַ/יָּמִ֑ים וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁמִינִ֜י וָ/הָ֗לְאָה יַעֲשׂ֨וּ הַ/כֹּהֲנִ֤ים עַל הַ/מִּזְבֵּ֨חַ֙ אֶת עוֹלֽוֹתֵי/כֶם֙ וְ/אֶת שַׁלְמֵי/כֶ֔ם וְ/רָצִ֣אתִי אֶתְ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־ס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/027.yaml
  text: When the days are completed[a], then from the eighth day onward the priests shall offer on the altar your burnt offerings and your peace offerings, and I will accept you, declares the Lord GOD.
translation:
  language: ru
  text: Когда завершатся эти дни, с восьмого дня и впредь священники будут приносить на жертвеннике ваши всесожжения и мирные жертвы[a]. И Я приму вас, — возвещает Господь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения».'
    reason: Лексема שְׁלָמִים может подчёркивать не только мир и благополучие, но и общение, выражаемое совместной жертвенной трапезой.
lexical_decisions:
- source_word: וִיכַלּוּ אֶת־הַיָּמִים
  choice: Когда завершатся эти дни
  rationale: Глагол כלה здесь обозначает завершение установленного ранее периода освящения жертвенника. Формулировка сохраняет дни как грамматический субъект и естественно вводит следующую стадию обряда.
- source_word: בַּיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: с восьмого дня и впредь
  rationale: Передаёт как начало регулярных жертвоприношений в восьмой день, так и их продолжение после него.
- source_word: יַעֲשׂוּ
  choice: будут приносить
  rationale: Буквально глагол означает «делать», но в сочетании с жертвами и жертвенником по-русски естественно употребить культовый термин «приносить».
- source_word: עוֹלֹתֵיכֶם
  choice: ваши всесожжения
  rationale: Устоявшееся и точное обозначение жертв, полностью сжигаемых на жертвеннике.
- source_word: שַׁלְמֵיכֶם
  choice: мирные жертвы
  rationale: Традиционное и узнаваемое обозначение זבחי שלמים; возможный оттенок совместной трапезы и общения отмечен в сноске.
- source_word: וְרָצִאתִי אֶתְכֶם
  choice: И Я приму вас
  rationale: Прямым объектом являются люди, а не только их приношения. Перевод сохраняет личный и заветный смысл выражения.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Господь Яхве
  rationale: נְאֻם передан как пророческая формула объявления, а имя יהוה — как «Яхве», с сохранением различия между титулом אֲדֹנָי и личным именем.
theological_decisions:
- issue: Объект Божьего принятия во фразе וְרָצִאתִי אֶתְכֶם
  choice: Я приму вас
  alternative: Я благоволю к вам
  rationale: Еврейский текст прямо ставит местоимение «вас» объектом глагола; поэтому не следует сужать смысл до принятия одних лишь жертв.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Господь Бог
  rationale: Так сохраняются и титул אֲדֹנָי, и явное присутствие в тексте заветного имени יהוה, без их слияния в два титула.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис сделан естественным, при этом сохранены последовательность обряда, культовая терминология и личный объект Божьего принятия.
