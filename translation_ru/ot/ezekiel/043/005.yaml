  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וַ/תְּבִיאֵ֕/נִי אֶל הֶֽ/חָצֵ֖ר הַ/פְּנִימִ֑י וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/005.yaml
  text: Then the Spirit lifted me up and brought me into the inner court[a], and behold[b], the glory of Yahweh filled the house.
translation:
  language: ru
  text: Тогда Дух[a] поднял меня и привёл во внутренний двор, и вот — дом[b] был полон славы Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух» или «ветер». Еврейское רוּחַ может иметь эти значения, однако в контексте видений Иезекииля, вероятнее всего, имеется в виду божественный Дух.'
    reason: alternative_reading
  - marker: b
    text: 'То есть храм. Буквально: «дом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂאֵנִי
  choice: поднял меня
  rationale: Глагол נשׂא передаёт поднятие пророка при его перемещении в видении; этот вариант сохраняет направленность движения и звучит естественно по-русски.
- source_word: רוּחַ
  choice: Дух
  rationale: В контексте видений Иезекииля наиболее вероятен божественный Дух как действующее лицо, хотя само еврейское слово допускает также значения «дух» и «ветер»; неоднозначность отмечена в сноске.
- source_word: וַתְּבִיאֵנִי
  choice: перенёс
  rationale: Каузативная форма от בוא означает «привести, внести». В сочетании с предшествующим «поднял» слово «перенёс» естественно описывает перемещение пророка во внутренний двор.
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: внутренний двор
  rationale: Точное и общепонятное обозначение внутреннего двора храмового комплекса.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет функцию указательного маркера, привлекающего внимание к внезапно открывшемуся зрелищу, без архаичного русского «се».
- source_word: מָלֵא
  choice: наполнила
  rationale: Форма выражает состояние наполненности, которое по-русски естественно передаётся результативной конструкцией «слава… наполнила Дом».
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: Сохраняет ключевое для Иезекииля выражение о явленной славе и прямую связь с личным именем Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: הַבָּיִת
  choice: Дом
  rationale: Сохраняет буквальное храмовое обозначение «Дом»; прописная буква помогает читателю распознать особое название святилища, а значение пояснено в сноске.
theological_decisions:
- issue: Кого обозначает רוּחַ при перемещении пророка
  choice: божественный Дух
  alternative: дух или ветер
  rationale: Повторяющиеся сцены перемещения Иезекииля в видении указывают прежде всего на божественного Духа, но лексическая неоднозначность подлинна и потому сохранена в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Значение הַבָּיִת в храмовом видении
  choice: Дом
  alternative: храм
  rationale: Буквальное «Дом» сохраняет образ и словоупотребление Иезекииля, тогда как контекстуальное значение «храм» сообщено читателю в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. «И вот» сохраняет выразительность הִנֵּה без архаизма; «Дом» передаёт храмовый термин буквально и остаётся понятным благодаря сноске.
