base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/017.yaml
  text: And the ledge was fourteen cubits long by fourteen cubits wide at its four sides, and the rim around it was half a cubit, and its base was a cubit all around; and its steps faced east.
translation:
  language: ru
  text: Уступ был четырнадцать локтей в длину и четырнадцать в ширину — одинаково по всем четырём сторонам[a]. Обод вокруг него был в пол-локтя, а его основание — локоть по всему периметру. Ступени жертвенника были обращены на восток.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть уступ имел форму квадрата со стороной в четырнадцать локтей.
    reason: Еврейское выражение буквально говорит о четырнадцати локтях длины и ширины «к четырём его сторонам»; пояснение передаёт геометрический смысл без изменения меры.
lexical_decisions:
- source_word: הָעֲזָרָה
  choice: уступ
  rationale: Редкий архитектурный термин обозначает одну из площадок или уступов ступенчатого жертвенника; «уступ» естественно передаёт его функцию в данном описании, не смешивая его с верхним очагом из предыдущего стиха.
- source_word: הַגְּבוּל
  choice: обод
  rationale: Слово обозначает окружающую кромку или кайму; «обод» ясно передаёт здесь выступающую окантовку по периметру.
- source_word: הַחֵיק
  choice: основание
  rationale: Буквально слово может означать «лоно, пазуху», но в архитектурном контексте жертвенника называет нижнюю или прилегающую часть конструкции. «Основание» соответствует контексту, хотя точная форма детали не вполне ясна.
- source_word: מַעֲלֹתָיו
  choice: ступени жертвенника
  rationale: Форма означает «его ступени»; явное существительное «жертвенника» устраняет неестественную для русского языка неясность местоименной отсылки.
- source_word: פְּנוֹת קָדִים
  choice: были обращены на восток
  rationale: Сохраняется пространственное значение причастия «обращённые» и направление קדים — восток.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной архитектурной лексикой и мерой «локоть», традиционной для библейского текста. Ритм сохранён описательный и торжественный, без архаизмов вроде «оный» или «вокруг оного».
