base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/020.yaml
  text: And you shall take some of its blood and put it on its four horns[a], on the four corners of the ledge, and on the border all around; so you shall purify it and make atonement for it.
translation:
  language: ru
  text: Ты возьмёшь немного его крови и нанесёшь её на четыре рога жертвенника, на четыре угла уступа[a] и на край по всему периметру. Так ты очистишь жертвенник и совершишь за него искупление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает конструктивный уступ или площадку, окружающие жертвенник.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּמוֹ
  choice: немного его крови
  rationale: 'Предлог מִן при слове «кровь» имеет партитивное значение: берётся часть крови, а не вся кровь.'
- source_word: קַרְנֹתָיו
  choice: четыре рога жертвенника
  rationale: В описании жертвенника קֶרֶן обозначает рогообразный выступ на углу. Слово «жертвенника» эксплицирует ясный из контекста референт местоимения и предотвращает двусмысленность.
- source_word: פִּנּוֹת הָעֲזָרָה
  choice: угла уступа
  rationale: פִּנּוֹת — углы или крайние точки; редкое הָעֲזָרָה в архитектурном описании Иезекииля обозначает окружающий жертвенник конструктивный уступ или площадку.
- source_word: הַגְּבוּל סָבִיב
  choice: край по всему периметру
  rationale: גְּבוּל здесь означает границу или край конструкции, а סָבִיב указывает на охват со всех сторон.
- source_word: וְחִטֵּאתָ אֹתוֹ
  choice: очистишь жертвенник
  rationale: Порода piel глагола חטא в жертвенном контексте означает ритуально очистить, а не «сделать грешным». Указание «жертвенник» ясно передаёт референт местоимения.
- source_word: וְכִפַּרְתָּהוּ
  choice: совершишь за него искупление
  rationale: כפר сохраняет особое культовое значение совершения искупления, не сводимое просто к очищению.
theological_decisions:
- issue: Различение парных ритуальных глаголов חטא (piel) и כפר
  choice: очистишь жертвенник и совершишь за него искупление
  alternative: очистишь жертвенник от осквернения и искупишь его
  rationale: Два разных выражения сохраняют последовательность и богословскую напряжённость двух связанных, но не тождественных культовых действий.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной синтаксической формой. Последовательность форм будущего времени передаёт предписание, выраженное древнееврейскими формами с וְ. Повтор слова «жертвенник» устраняет неясность русских местоимений, не меняя смысла.
