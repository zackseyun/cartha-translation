- from: Затем возьми быка жертвы за грех[a] и сожги его[c] в отведённом для храма месте[b], за пределами святилища.
  to: Затем возьми быка как жертву за грех[a] и сожги его[c] в назначенном месте храмового комплекса[b], за пределами святилища.
  rationale: 'Правка делает передачу בְּמִפְקַד הַבַּיִת семантически точнее и более ясной: речь идёт о назначенном месте, принадлежащем к храмовому комплексу, хотя оно находится вне святилища. Одновременно слегка сглажена неестественная для современного русского именная цепочка, без изменения значения חַטָּאת. Сноска о смене лица сохранена, поскольку она добросовестно отмечает особенность еврейской формы, не навязывая определённого исполнителя.'
