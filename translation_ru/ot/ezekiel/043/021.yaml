base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/021.yaml
  text: Then you shall take the bull of the sin offering and burn it in the appointed place of the house[b][a], outside the sanctuary.
translation:
  language: ru
  text: Затем возьми быка как жертву за грех[a] и сожги его[c] в назначенном месте храмового комплекса[b], за пределами святилища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быка для жертвы за грех»; возможный перевод: «быка очистительной жертвы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в назначенном месте дома»; под «домом» здесь подразумевается храмовый комплекс.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и он сожжёт его»; еврейский текст переходит здесь от второго лица к третьему.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Затем возьми
  rationale: Союз וְ в последовательности обрядовых предписаний передаёт переход к следующему действию; «затем» естественно выражает эту последовательность, а повелительное «возьми» сохраняет направленность речи к адресату.
- source_word: הַפָּר
  choice: быка
  rationale: פַּר обозначает быка, нередко молодого; контекст не требует отдельно выражать возраст животного.
- source_word: הַחַטָּאת
  choice: жертвы за грех
  rationale: В жертвенном контексте חַטָּאת обозначает жертву, связанную с грехом и очищением. Традиционное и понятное выражение «жертва за грех» сохранено в основном тексте, а возможное «очистительная жертва» дано в примечании.
- source_word: וּשְׂרָפוֹ
  choice: и сожги его
  rationale: 'В еврейском тексте после обращения во втором лице стоит форма третьего лица единственного числа: буквально «и он сожжёт его». Основной текст естественно продолжает прямое предписание, а смена лица отмечена в примечании.'
- source_word: בְּמִפְקַד הַבַּיִת
  choice: в отведённом для храма месте
  rationale: מִפְקָד здесь указывает на назначенное или отведённое место. הַבַּיִת в храмовом видении означает храм; перевод «для храма» сохраняет связь между местом и храмом и остаётся понятным современному читателю.
- source_word: מִחוּץ לַמִּקְדָּשׁ
  choice: за пределами святилища
  rationale: מִחוּץ означает нахождение снаружи, а מִקְדָּשׁ — святилище или освящённую храмовую область. Выражение ясно передаёт пространственное противопоставление.
theological_decisions:
- issue: Значение жертвенного термина חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Оба оттенка имеют основания в священнической обрядовой лексике. Основной перевод использует общеупотребительное название, не исключая функции очищения, которая отражена в примечании.
- issue: Смена грамматического лица в וּשְׂרָפוֹ
  choice: 'продолжить обращённое к адресату предписание: «и сожги его»'
  alternative: 'буквально: «и он сожжёт его»'
  rationale: Русское продолжение во втором лице делает порядок действий ясным, но примечание сохраняет реальную грамматическую особенность источника и возможность иного исполнителя.
- issue: Соотношение «храма» и «святилища»
  choice: различить отведённое для храма место и пространство святилища
  alternative: «в отведённом месте дома, вне святилища»
  rationale: В видении Иезекииля «дом» обозначает храм. Перевод проясняет референт, не отождествляя автоматически весь храмовый комплекс со святилищем.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой обрядового предписания. Синтаксис сделан естественным для русского читателя; значимые лексические варианты и необычная смена лица в еврейском тексте сохранены в примечаниях.
