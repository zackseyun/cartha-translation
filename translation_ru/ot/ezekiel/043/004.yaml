  text: וּ/כְב֥וֹד יְהוָ֖ה בָּ֣א אֶל הַ/בָּ֑יִת דֶּ֣רֶךְ שַׁ֔עַר אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֥רֶךְ הַ/קָּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/004.yaml
  text: And the glory of Yahweh came into the house by way of the gate that faces east[a][b].
translation:
  language: ru
  text: И слава Яхве вошла в храм[a] через ворота, обращённые на восток[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в дом»; в контексте этого видения имеется в виду здание храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «путём ворот, обращённых на восток».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְב֥וֹד
  choice: И слава
  rationale: כָּבוֹד обозначает явленную славу и присутствие Бога, а союз וּ естественно передаётся как «и».
- source_word: יְהוָ֖ה
  choice: Яхве
  rationale: Личное имя Бога, переданное тетраграмматоном יהוה, транслитерировано как «Яхве».
- source_word: בָּ֣א
  choice: вошла
  rationale: בוא может означать «приходить» или «входить»; сочетание с אֶל и зданием указывает на движение внутрь.
- source_word: אֶל הַ/בָּ֑יִת
  choice: в храм
  rationale: Буквально בַּיִת означает «дом», но в данном видении речь идёт о здании храма; перевод «в храм» ясен современному читателю, а буквальная форма отмечена в сноске.
- source_word: דֶּ֣רֶךְ שַׁ֔עַר
  choice: через ворота
  rationale: דֶּרֶךְ указывает на путь движения, а שַׁעַר в архитектурном контексте означает ворота; по-русски сочетание естественно передаётся словом «через».
- source_word: אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֥רֶךְ הַ/קָּדִֽים
  choice: обращённые на восток
  rationale: Идиома с פָּנִים описывает направленность передней стороны ворот; קָדִים здесь означает восток или восточное направление.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя יהוה; форма «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная. «Храм» выбран ради ясности контекста, а буквальное «дом» сохранено в сноске. Причастный оборот передаёт ориентацию ворот без архаической тяжеловесности.
