  text: וְ/הִנֵּ֗ה כְּבוֹד֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בָּ֖א מִ/דֶּ֣רֶךְ הַ/קָּדִ֑ים וְ/קוֹל֗/וֹ כְּ/קוֹל֙ מַ֣יִם רַבִּ֔ים וְ/הָ/אָ֖רֶץ הֵאִ֥ירָה מִ/כְּבֹדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/002.yaml
  text: And behold[a], the glory of the God of Israel was coming from the way of the east, and his voice was like the sound of many waters[b], and the earth shone from his glory.
translation:
  language: ru
  text: И вот, слава Бога Израиля шла с востока[a]. Ее голос был подобен шуму множества вод[b], и земля сияла от его славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со стороны пути (или направления) востока»; также возможно: «с восточной стороны».'
    reason: Передаёт буквальные компоненты מִדֶּרֶךְ הַקָּדִים и отмечает естественные варианты понимания направления.
  - marker: b
    text: 'Или: «рёву множества вод».'
    reason: Отмечает более интенсивную контекстуальную передачу слова קוֹל без включения этой интерпретации в основной текст.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт внезапность и живую наглядность пророческого видения естественным современным русским выражением.
- source_word: כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: слава Бога Израиля
  rationale: «Слава» сохраняет устойчивое богословское и теофаническое значение כבוד, а конструкция «Бога Израиля» точно передаёт еврейское сопряжённое сочетание.
- source_word: בָּא
  choice: приближалась
  rationale: Форма описывает разворачивающуюся перед глазами пророка сцену; «приближалась» естественно передаёт движение к храму, не сводя его к уже завершённому приходу.
- source_word: מִדֶּרֶךְ הַקָּדִים
  choice: с востока
  rationale: Контекстуально ясная и естественная передача буквального «со стороны/по пути востока»; формальная особенность отмечена в сноске.
- source_word: וְקוֹלוֹ
  choice: Голос Его
  rationale: Личный суффикс передан личным местоимением в соответствии с изображением явления Бога; «голос» сохраняет основное значение קול.
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: подобен шуму множества вод
  rationale: В сравнении קול естественно означает мощный звук; «шум» избегает неуклюжего повтора «голос… голосу», а «множество вод» сохраняет образ и допускает как массу воды, так и многочисленные воды.
- source_word: וְהָאָרֶץ
  choice: и земля
  rationale: В теофаническом образе освещения уместно более широкое значение «земля», хотя лексема также может обозначать страну или сушу.
- source_word: הֵאִירָה מִכְּבֹדוֹ
  choice: сияла от Его славы
  rationale: 'Передаёт каузативно-результативный смысл глагола и מן как источник сияния: свет земли исходит от Божьей славы.'
theological_decisions:
- issue: Личная или безличная передача местоименных суффиксов при «голосе» и «славе»
  choice: «Голос Его» и «Его славы»
  alternative: «её шум» и «её сияние/слава», с грамматической отсылкой к слову «слава»
  rationale: Хотя ближайшим грамматическим референтом служит «слава», видение представляет личное явление Бога Израиля. Личная передача естественна по-русски, но не определяет точнее природу связи между Богом и Его славой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, достойным пророческого видения регистром. Инверсия «Голос Его» поддерживает библейскую торжественность, оставаясь понятной; остальные конструкции намеренно естественны и не архаичны.
