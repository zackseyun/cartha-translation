source:
  edition: WLC
  text: וְ/לֵ֨ךְ בֹּ֤א אֶל הַ/גּוֹלָה֙ אֶל בְּנֵ֣י עַמֶּ֔/ךָ וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/011.yaml
  text: And go[a], come to the exiles, to the sons of your people, and speak to them and say to them[b], ‘Thus says the Lord GOD,’ whether they hear or whether they refuse.
translation:
  language: ru
  text: 'Иди к изгнанникам, к сынам твоего народа[a], говори с ними и скажи им: «Так говорит Владыка Яхве: будут ли они слушать или откажутся[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам твоего народа»; это родственное выражение может собирательно обозначать людей его народа в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут ли они слушать или воздержатся». Еврейский глагол буквально означает «перестать, воздержаться» и здесь передаёт отказ внимать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֵךְ בֹּא
  choice: Иди, приди
  rationale: Сохранены два последовательных повеления движения. Хотя сочетание необычно по-русски, оно передаёт повтор и направленность исходного текста, не сводя два глагола к одному.
- source_word: הַגּוֹלָה
  choice: изгнанникам
  rationale: Существительное обозначает совокупность переселённых в изгнание людей, а не отвлечённое состояние изгнания.
- source_word: בְּנֵי עַמֶּךָ
  choice: сынам твоего народа
  rationale: Сохранён мужской род и образ родства в еврейском выражении; примечание поясняет его собирательное, представительное употребление.
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם וְאָמַרְתָּ אֲלֵיהֶם
  choice: говори с ними и скажи им
  rationale: Переданы оба глагола речи и повелительная сила последовательности, без устранения характерного для еврейского текста повтора.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена устойчивая торжественная формула пророческого посланника.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное Божье имя יהוה, сохраняя различие между двумя элементами сочетания.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: будут ли они слушать или откажутся
  rationale: Парная конструкция אִם ... וְאִם передана как две альтернативы. «Слушать» сохраняет смысл восприятия и послушания, а «откажутся» естественно выражает контекстуальный смысл חדל — воздержаться, перестать, не пожелать внимать.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Исходный текст различает титул אֲדֹנָי и тетраграмматон יהוה. Транслитерация имени сохраняет это различие и избегает сочетания двух одинаково звучащих титулов.
- issue: Представительное выражение בְּנֵי עַמֶּךָ
  choice: сынам твоего народа
  alternative: детям твоего народа; твоему народу
  rationale: Основной текст сохраняет грамматически мужское существительное и родственный образ, не утверждая при этом, что обращение ограничено только мужчинами; собирательный смысл пояснён в примечании.
- issue: Смысл יֶחְדָּלוּ в противопоставлении слушанию
  choice: откажутся
  alternative: воздержатся; перестанут
  rationale: Здесь глагол противопоставлен слушанию пророческой вести и обозначает отказ внимать. Более буквальные варианты сохранены в примечании, чтобы не скрывать лексическую напряжённость.
translation_notes:
  register: Современный литературный русский с сохранением торжественного пророческого регистра. Необычная последовательность «Иди, приди» намеренно удерживает два повеления исходного текста; синтаксис остальной фразы сделан ясным и пригодным для публичного чтения.
