lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И Он сказал мне
  rationale: Повествовательная форма с וַ естественно передаётся союзом «и»; местоимение указывает на говорящего из контекста, а прописная буква соответствует русской традиции при обозначении Бога.
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устоявшееся и прозрачное русское соответствие буквальному еврейскому обращению; сохраняет образность и подчёркивает человеческую природу адресата.
- source_word: אֵת אֲשֶׁר תִּמְצָא
  choice: то, что перед тобой
  rationale: В данном видении речь идёт о предложенном Иезекиилю свитке. Формулировка естественна по-русски, но неоднозначность буквального «то, что найдёшь» отмечена в сноске.
- source_word: אֱכֹל אֱכוֹל
  choice: съешь… съешь
  rationale: Повтор повеления сохранён, чтобы передать усиление и последовательность еврейской речи.
- source_word: מְגִלָּה
  choice: свиток
  rationale: Точное и общепонятное обозначение древнего письменного свитка.
- source_word: וְלֵךְ
  choice: и иди
  rationale: Сохраняет последовательность прямых повелений без добавочной интерпретации.
- source_word: דַּבֵּר
  choice: говори
  rationale: Прямое соответствие глаголу; несовершенный вид естественно передаёт поручение пророку говорить народу.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохраняет еврейский коллективный и заветный образ «дома», не заменяя его толкованием «народ Израиля».
theological_decisions:
- issue: Передача אָדָם в обращении בֶּן אָדָם
  choice: Сын человеческий
  alternative: человек; смертный
  rationale: Устоявшаяся буквальная формула сохраняет отличие пророка-человека от говорящего Бога и не вводит конфессионального истолкования.
