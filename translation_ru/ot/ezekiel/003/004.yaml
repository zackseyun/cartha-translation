lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И Он сказал мне
  rationale: Вав с последовательным значением продолжает повествование; русское «И» естественно сохраняет связь с предыдущим событием. Местоимение «Он» добавлено по нормам русского синтаксиса и указывает на говорящего из контекста.
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет буквальную форму и устойчивое обращение к Иезекиилю, не сводя его истолковательно только к значению «смертный».
- source_word: לֶךְ בֹּא
  choice: иди к
  rationale: Два еврейских императива образуют идиоматическое побуждение к движению; буквальное «иди, войди/приди к» в данном контексте звучало бы по-русски искусственно. Значение прибытия к адресату передано конструкцией «иди к».
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: к дому Израиля
  rationale: Сохранён характерный пророческий оборот, обозначающий народ Израиля, вместе с его образностью и заветным оттенком.
- source_word: וְדִבַּרְתָּ בִדְבָרַי אֲלֵיהֶם
  choice: и говори им Моими словами
  rationale: Последующая глагольная форма выражает повеление. Предлог ב перед «словами» допускает инструментальное понимание, естественно передаваемое творительным падежом; местоимение относится к дому Израиля как к людям.
theological_decisions:
- issue: Передача אָדָם в обращении בֶּן אָדָם
  choice: Сын человеческий
  alternative: смертный; человек
  rationale: Так сохраняются форма повторяющегося обращения и его литературно-богословское звучание без внесения в данный ветхозаветный контекст позднейшего христологического титульного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой окраской. Прописные буквы в «Он» и «Моими» употреблены как традиционное почтительное обозначение Бога; выражение «дом Израиля» намеренно сохранено как библейский идиом.
