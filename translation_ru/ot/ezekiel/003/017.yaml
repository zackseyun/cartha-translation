source:
  edition: WLC
  text: בֶּן אָדָ֕ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אוֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/017.yaml
  text: Son of man[a], I have made you a watchman for the house of Israel[b]; and you shall hear a word from my mouth and warn them from me.
translation:
  language: ru
  text: Сын человеческий[a], Я поставил тебя стражем для дома Израиля; слушай слово из Моих уст и предостерегай их от Меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Смертный» или «Человек». Буквально: «сын человека»; это повторяющееся обращение к Иезекиилю.'
    reason: lexical_alternative
  - marker: b
    text: Формулировка допускает понимание, что предостережение исходит от Бога, а также что следует предупредить о Боге как о том, чьё грядущее действие несёт опасность.
    reason: genuine_ambiguity
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет повторяющееся в книге Иезекииля еврейское обращение к пророку и традиционную межтекстовую связь; здесь это обращение к конкретному человеку, а не родовое обозначение человечества.
- source_word: צֹפֶה
  choice: страж
  rationale: Передаёт роль наблюдающего, который обязан заметить опасность и предупредить о ней; это естественное и устойчивое русское соответствие в данном образе.
- source_word: נְתַתִּיךָ
  choice: Я поставил тебя
  rationale: Буквально глагол означает «дал», однако при назначении стражем по-русски естественно «поставил»; сохраняется результативный смысл поручения.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: для дома Израиля
  rationale: Предлог обозначает назначение по отношению к Израилю; «для» ясно передаёт, ради кого и применительно к кому пророк поставлен стражем.
- source_word: וְשָׁמַעְתָּ
  choice: слушай
  rationale: В последовательности поручения форма выражает обязательное действие пророка. Русский императив естественно передаёт предписывающую силу, не добавляя условного «когда».
- source_word: מִפִּי
  choice: из Моих уст
  rationale: Сохраняет конкретный антропоморфный образ непосредственной Божьей речи.
- source_word: דָּבָר
  choice: слово
  rationale: Прямое и достаточно широкое соответствие для Божьего речения; не сужает значение до пересказанного «сообщения».
- source_word: וְהִזְהַרְתָּ
  choice: предостерегай
  rationale: Передаёт каузативный смысл предупреждения об опасности и согласуется с постоянной обязанностью стража.
- source_word: אוֹתָם
  choice: их
  rationale: Отсылает к собирательно понимаемому дому Израиля.
- source_word: מִמֶּנִּי
  choice: от Моего имени
  rationale: Передаёт Бога как источник и уполномочивающего субъекта предостережения; буквальное «от Меня» по-русски может ошибочно означать предупреждение об опасности, исходящей от Бога.
theological_decisions:
- issue: Связь между получением слова и предостережением
  choice: слушай слово из Моих уст и предостерегай их
  alternative: услышав слово из Моих уст, предостереги их; и услышишь слово из Моих уст, и предостережёшь их
  rationale: Еврейская цепочка с союзами допускает более формально-сочинительную передачу, тогда как контекст поручения выражает обязательную последовательность действий. Императивы по-русски сохраняют силу поручения, не превращая связь явно ни в условие, ни в предсказание.
- issue: Передача формулы בֶּן אָדָם
  choice: Сын человеческий
  alternative: смертный; человек
  rationale: Традиционная формула остаётся понятной и сохраняет характерное обращение Бога к Иезекиилю, не навязывая дополнительного христологического толкования этому месту.
- issue: Значение מִמֶּנִּי
  choice: от Моего имени
  alternative: от Меня
  rationale: В контексте пророк передаёт исходящее от Бога предостережение. Выбранная формулировка ясно выражает источник и полномочие, тогда как возможная двусмысленность исходной краткой формы отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Страж» и «дом Израиля» сохраняют библейскую образность; прописные местоимения в отношении Бога соответствуют принятому русскому религиозному регистру. Повелительные формы делают поручение естественным по-русски, не сглаживая его обязательность.
