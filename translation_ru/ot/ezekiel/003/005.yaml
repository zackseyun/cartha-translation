lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим поручением и естественно звучит по-русски.
- source_word: עַם
  choice: народу
  rationale: В контексте речи и языка обозначает этническую и языковую общность, а не политическое государство.
- source_word: עִמְקֵי שָׂפָה
  choice: с непонятной речью
  rationale: Еврейский оборот буквально означает «глубокие устами» и характеризует речь, которую трудно понять; буквальность поясняется в сноске.
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: и трудным языком
  rationale: Идиома «тяжёлые языком» здесь указывает не на дефект речи отдельного человека, а на язык, трудный для понимания.
- source_word: אַתָּה שָׁלוּחַ
  choice: ты послан
  rationale: Предикативное страдательное причастие передано естественной русской краткой формой; местоимение сохраняет явное обращение к Иезекиилю.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохранено устойчивое пророческое обозначение народа с его корпоративным и заветным оттенком.
