base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/008.yaml
  text: Behold[a], I have made your face strong against their faces, and your forehead strong against their foreheads.
translation:
  language: ru
  text: Вот, Я сделал твоё лицо твёрдым против их лиц и твой лоб твёрдым против их лбов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепким» — в обоих случаях; еврейское слово передаёт силу, крепость или твёрдость перед лицом сопротивления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую силу торжественного Божьего заявления и естественно звучит в современном литературном русском.
- source_word: נָתַתִּי
  choice: Я сделал
  rationale: Буквально глагол означает «дал», однако в сочетании с частью тела и прилагательным выражает наделение определённым качеством; «сделал» ясно передаёт эту каузативную функцию.
- source_word: פָּנֶיךָ
  choice: твоё лицо
  rationale: Хотя еврейское существительное имеет форму множественного числа, здесь оно обозначает лицо одного человека; единственное число естественно для русского языка.
- source_word: חֲזָקִים
  choice: твёрдым
  rationale: Прилагательное допускает значения силы, крепости и твёрдости. В образе лица, противостоящего враждебным лицам, «твёрдым» передаёт непоколебимость без отрицательного оттенка упрямства.
- source_word: לְעֻמַּת
  choice: против
  rationale: Предлог обозначает положение напротив или противостояние; контекст сопротивления народа поддерживает состязательное значение «против».
- source_word: פְּנֵיהֶם
  choice: их лиц
  rationale: Сохраняет конкретный телесный образ и множественное число, относящееся к людям, которым противостоит Иезекииль.
- source_word: מִצְחֲךָ
  choice: твой лоб
  rationale: Прямой современный русский эквивалент, сохраняющий конкретную метафору видимой решимости.
- source_word: חָזָק
  choice: твёрдым
  rationale: Повтор того же русского слова поддерживает синтаксический и образный параллелизм еврейского текста.
- source_word: מִצְחָם
  choice: их лбов
  rationale: Сохраняет множественное число и точный параллелизм со словами «твой лоб».
theological_decisions:
- issue: Образ лица и лба, укреплённых Богом
  choice: Сохранить конкретные телесные образы «лицо» и «лоб» как выражение дарованной Богом твёрдости в пророческом противостоянии.
  alternative: 'Передать отвлечённо: «Я сделал тебя непреклонным перед ними» или «упрямее их».'
  rationale: Еврейский текст намеренно использует телесные образы и словесный параллелизм. Их сохранение поддерживает связь с окружающим контекстом твёрдости и не приписывает Иезекиилю нравственно отрицательного упрямства.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Вот» сохраняет торжественное введение, а повтор «твёрдым… твёрдым» и телесные образы воспроизводят строгий параллелизм оригинала.
