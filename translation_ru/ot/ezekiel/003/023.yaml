source:
  edition: WLC
  text: וָ/אָקוּם֮ וָ/אֵצֵ֣א אֶל הַ/בִּקְעָה֒ וְ/הִנֵּה שָׁ֤ם כְּבוֹד יְהוָה֙ עֹמֵ֔ד כַּ/כָּב֕וֹד אֲשֶׁ֥ר רָאִ֖יתִי עַל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל עַל פָּנָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/023.yaml
  text: So I arose and went out to the valley[a], and behold, the glory of Yahweh was standing there, like the glory that I had seen by the Kebar River; and I fell on my face.
translation:
  language: ru
  text: И я встал и вышел в долину[a]. И вот, там стояла слава Яхве — такая же, какую я видел у реки Кевар. И я пал лицом на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на равнину». Еврейское слово может обозначать широкую долину или равнину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקוּם וָאֵצֵא
  choice: И я встал и вышел
  rationale: Две формы wayyiqtol передают последовательные действия повествования; простой русский союз «и» естественно сохраняет эту последовательность.
- source_word: הַבִּקְעָה
  choice: в долину
  rationale: בִּקְעָה обозначает широкую долину или равнину; «долина» уместна в основном тексте, а равноправный вариант вынесен в сноску.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: «И вот» естественно по-русски передаёт указательный и привлекающий внимание характер הִנֵּה, сохраняя живость видения.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: Сочетание обозначает явленную славу и присутствие Бога; русский оборот сохраняет смысл и структуру исходной фразы.
- source_word: עֹמֵד
  choice: стояла
  rationale: Причастие описывает продолжающееся положение в сцене; прошедшее несовершенного вида «стояла» передаёт его длительный, фоновый характер. Согласование по женскому роду определяется словом «слава».
- source_word: כַּכָּבוֹד אֲשֶׁר רָאִיתִי
  choice: такая же, какую я видел
  rationale: Префикс כ выражает сравнение. Русская конструкция ясно соотносит нынешнее явление славы с прежним, не утверждая тождества формы сверх сказанного текстом.
- source_word: עַל נְהַר כְּבָר
  choice: у реки Кевар
  rationale: עַל при водном объекте здесь естественно передаётся как «у»; «Кевар» — русская транслитерация топонима.
- source_word: וָאֶפֹּל עַל פָּנָי
  choice: И я пал лицом на землю
  rationale: Это естественный русский способ передать буквальный жест падения ниц в благоговении; «пал» сохраняет торжественный, но понятный регистр.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное божественное имя, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Смысл выражения כְּבוֹד יְהוָה
  choice: слава Яхве
  alternative: присутствие Яхве; сияние Яхве
  rationale: «Слава Яхве» сохраняет широкую библейскую смысловую нагрузку выражения и не сводит видимое явление только к сиянию или абстрактному присутствию.
- issue: Сравнение с прежним видением
  choice: такая же, какую я видел
  alternative: подобная славе, которую я видел
  rationale: Формулировка сохраняет прямое сравнение, не добавляя объяснения характера или формы богоявления.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской интонацией. «И вот» сохраняет пророческую выразительность, а «пал лицом на землю» ясно передаёт жест без архаической тяжеловесности.
