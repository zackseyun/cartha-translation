source:
  edition: WLC
  text: וּֽ/בְ/דַבְּרִ֤/י אֽוֹתְ/ךָ֙ אֶפְתַּ֣ח אֶת פִּ֔י/ךָ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/שֹּׁמֵ֤עַ יִשְׁמָע֙ וְ/הֶ/חָדֵ֣ל יֶחְדָּ֔ל כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־׀׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/027.yaml
  text: 'But when I speak with you[a], I will open your mouth, and you shall say to them, ‘Thus says the Lord GOD: The one who hears, let him hear; and the one who refrains, let him refrain[b], for they are a rebellious house.’'
translation:
  language: ru
  text: 'Но когда Я буду говорить с тобой, Я открою твои уста, и ты скажешь им: «Так говорит Господь Яхве: кто слушает, пусть слушает, а кто воздерживается, пусть воздерживается[a], ведь они — мятежный дом[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «кто слушает, будет слушать, а кто воздерживается, будет воздерживаться». Еврейские формы можно понять и как побуждение или разрешение, и как предсказание.'
    reason: alternative_reading
  - marker: b
    text: Буквально «мятежный дом» — часто повторяющееся у Иезекииля обозначение народа Израиля в его упорном неповиновении.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְדַבְּרִי אוֹתְךָ
  choice: Но когда Я буду говорить с тобой
  rationale: Предлог בְּ при инфинитиве передаёт время действия («когда»), а союз וּ по контексту противопоставляет предшествующему безмолвию пророка. אֹתְךָ допускает естественное русское «с тобой».
- source_word: אֶפְתַּח אֶת־פִּיךָ
  choice: Я открою твои уста
  rationale: Сохраняется буквальный образ Божьего действия, делающего возможной речь пророка; «уста» поддерживает dignified prophetic register without obscurity.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: и ты скажешь им
  rationale: Последующая форма обозначает действие, которое последует за открытием уст; простое будущее естественно передаёт поручение в русском языке.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула в форме, естественной для русского библейского стиля.
- source_word: אֲדֹנָי יְהוִה
  choice: Господь Яхве
  rationale: 'Переданы оба элемента титула: אֲדֹנָי как «Господь» и личное имя יהוה как «Яхве», без слияния или устранения имени.'
- source_word: הַשֹּׁמֵעַ יִשְׁמָע
  choice: кто слушает, пусть слушает
  rationale: Сохраняются повтор корня и возможное разрешительно-побудительное значение имперфекта; формула остаётся краткой и выразительной.
- source_word: וְהֶחָדֵל יֶחְדָּל
  choice: а кто отказывается, пусть отказывается
  rationale: חדל означает прекращать, воздерживаться или отказываться. В контексте отклика на пророческое слово «отказывается» звучит естественно, но не уточняет сверх текста, от чего именно человек отказывается.
- source_word: כִּי בֵּית מְרִי הֵמָּה
  choice: ведь они — мятежный дом
  rationale: Сохранён характерный для Иезекииля образ בֵּית מְרִי и причинное значение כִּי; замена «дома» на «народ» неоправданно устранила бы метафору.
theological_decisions:
- issue: Значение форм יִשְׁמָע и יֶחְדָּל
  choice: 'побудительно-разрешительное: «пусть слушает… пусть отказывается»'
  alternative: 'предсказательное: «будет слушать… будет отказываться»'
  rationale: Имперфекты допускают обе трактовки. В основном тексте выбран риторически уместный разрешительно-побудительный смысл, а подлинная неоднозначность отмечена в сноске.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка Господь
  rationale: Выбранный вариант передаёт и титул, и собственное Божье имя, не сводя יהוה к титулу и не привнося конфессионально специфического толкования.
- issue: Обобщающее мужское единственное число
  choice: кто слушает… кто отказывается
  alternative: слушающие… отказывающиеся
  rationale: Русское местоименное «кто» естественно сохраняет обобщающий единственный референт и не делает высказывание гендерно ограниченным.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены формула «Так говорит», образ открытых уст и характерное выражение «мятежный дом»; синтаксис при этом остаётся понятным обычному современному читателю.
