lexical_decisions:
- source_word: וַיְהִי ... מִקְצֵה שִׁבְעַת יָמִים
  choice: И по прошествии семи дней
  rationale: Первая форма וַיְהִי служит формулой продолжения повествования; по-русски естественно передать её союзом «И», а временное выражение מִקְצֵה — оборотом «по прошествии», указывающим на завершение семидневного срока.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена обычная пророческая формула с личным именем Бога, непосредственно стоящим в еврейском тексте.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямой и естественный русский эквивалент предлога с местоименным суффиксом первого лица.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив вводит следующую прямую речь; в современном русском это естественно выражается двоеточием, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Определённость выражения דְבַר יְהוָה
  choice: слово Яхве
  alternative: слово от Яхве
  rationale: Конструкция допускает функциональное понимание «слово от Яхве», но формальная пророческая формула «слово Яхве» точнее сохраняет структуру и традиционную силу исходного выражения.
translation_notes:
  register: Современный литературный русский с достоинством пророческого повествования. Формула לֵאמֹר передана пунктуационно, поскольку далее следует содержание речи; архаичное «говоря» не использовано.
