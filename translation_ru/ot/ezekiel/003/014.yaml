  text: וְ/ר֥וּחַ נְשָׂאַ֖תְ/נִי וַ/תִּקָּחֵ֑/נִי וָ/אֵלֵ֥ךְ מַר֙ בַּ/חֲמַ֣ת רוּחִ֔/י וְ/יַד יְהוָ֥ה עָלַ֖/י חָזָֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/014.yaml
  text: And the Spirit lifted me up and took me away[a], and I went in bitterness, in the heat of my spirit[b], while the hand of Yahweh was strong upon me.
translation:
  language: ru
  text: И Дух поднял меня и унёс[a]. Я шёл в горечи и в пылу моего духа[b], а рука Яхве была тяжела на мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух поднял меня»; еврейское слово также может означать «ветер».'
    reason: alternative_reading
  - marker: b
    text: Выражение «в пылу моего духа» можно также понять как «в ярости моего духа» или «в гневе моего духа».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְר֥וּחַ
  choice: Дух
  rationale: רוּחַ может означать «дух», «ветер» или «дыхание». В контексте видения и перенесения пророка наиболее вероятен Божий Дух; заглавная буква отражает это понимание, а подлинная неоднозначность отмечена в сноске.
- source_word: נְשָׂאַ֖תְנִי
  choice: поднял меня
  rationale: נשׂא означает «поднимать, нести». Перевод сохраняет конкретный образ начала перенесения.
- source_word: וַתִּקָּחֵ֑נִי
  choice: и унёс
  rationale: לקח имеет широкое значение «брать, взять». В сочетании с предшествующим «поднял» форма «унёс» естественно передаёт направленное перемещение, не усиливая глагол до «схватил».
- source_word: וָאֵלֵ֥ךְ
  choice: Я шёл
  rationale: הלך — обычный глагол движения «идти». Несовершенный вид по-русски естественно описывает состояние пророка во время движения.
- source_word: מַר
  choice: в горечи
  rationale: Краткое прилагательное употреблено обстоятельственно и обозначает горестное, ожесточённое внутреннее состояние.
- source_word: בַּחֲמַ֣ת
  choice: в пылу
  rationale: חֵמָה может обозначать жар, пыл, ярость или гнев. «В пылу» сохраняет метафору жара и не сводит неоднозначное чувство исключительно к гневу.
- source_word: רוּחִ֔י
  choice: своего духа
  rationale: Здесь רוּחַ относится к внутреннему духу или настрою Иезекииля. «Своего духа» сохраняет лексический повтор и отличает человеческую реакцию от начального «Духа».
- source_word: וְיַד יְהוָ֥ה עָלַ֖י חָזָֽקָה
  choice: а рука Яхве властно тяготела надо мной
  rationale: Сохранён пророческий образ «руки Яхве» как действующей Божьей силы. «Властно тяготела» естественно передаёт חָזָקָה עָלַי — сильное, непреодолимое воздействие на пророка — без отвлечённой парафразы.
theological_decisions:
- issue: К кому относится начальное רוּחַ
  choice: Божий Дух («Дух»)
  alternative: «дух» или «ветер»
  rationale: Контекст видения и сверхъестественного перенесения лучше поддерживает указание на Божий Дух, однако еврейское слово само по себе допускает другие значения, которые сохранены в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: «Господь» или «Иегова»
  rationale: Передача «Яхве» непосредственно представляет личное имя в исходном тексте и согласуется с предоставленным решением для этого стиха.
- issue: Источник гнева или пыла во фразе בַּחֲמַת רוּחִי
  choice: сильное внутреннее состояние самого Иезекииля
  alternative: гнев Божьего Духа или неопределённое внешнее воздействие
  rationale: Суффикс первого лица в רוּחִי буквально означает «моего духа», поэтому перевод не переносит это чувство на Бога. При этом его точный оттенок — пыл, ярость, гнев или смятение — оставлен открытым.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной пророческой образности. Синтаксис сделан ясным для обычного читателя; редкое буквальное «рука была сильна на мне» передано естественным, но всё ещё образным оборотом «рука Яхве властно тяготела надо мной».
