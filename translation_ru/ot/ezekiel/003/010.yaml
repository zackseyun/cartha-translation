  yaml_path: translation/ot/ezekiel/003/010.yaml
  text: Then he said to me[a], “Son of man, receive in your heart all my words that I speak to you, and hear with your ears.”
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий! Все слова Мои, которые Я буду говорить тебе, прими в сердце своё и услышь своими ушами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивую в книге Иезекииля форму обращения и близко передаёт еврейское выражение, не подменяя его толкованиями «смертный» или «человек».
- source_word: אֶת כָּל דְּבָרַי
  choice: все слова Мои
  rationale: Передаёт конкретный словесный акцент דְּבָרַי и естественно звучит в торжественном современном русском регистре.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: которые Я буду говорить тебе
  rationale: Имперфект допускает настоящее или будущее значение; будущее здесь естественно указывает на последующие Божьи откровения пророку, не исключая продолжающейся речи.
- source_word: קַח בִּלְבָבְךָ
  choice: прими в сердце своё
  rationale: Глагол קַח буквально означает «возьми», но в сочетании с «сердцем» выражает внутреннее принятие. «Прими» ясно передаёт идиому, сохраняя образ сердца как внутреннего человека.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: и услышь своими ушами
  rationale: Сохранена телесная конкретность и усиление исходного текста; «услышь» соответствует повелительной форме и не сглаживает явное упоминание ушей.
theological_decisions:
- issue: Передача אָדָם в обращении בֶּן אָדָם
  choice: Сын человеческий
  alternative: смертный; человек
  rationale: Так сохраняются форма оригинала и повторяющееся обращение к Иезекиилю без привнесения позднейших христологических выводов непосредственно в этот стих.
- issue: Временное значение אֲדַבֵּר
  choice: буду говорить
  alternative: говорю
  rationale: Еврейский имперфект допускает оба оттенка. Будущее значение хорошо соответствует поручению принимать все последующие слова Бога, но не превращается в богословское уточнение сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «слова Мои» и обращение «Сын человеческий» сохраняют достоинство и узнаваемость текста; архаизмы избегаются. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
