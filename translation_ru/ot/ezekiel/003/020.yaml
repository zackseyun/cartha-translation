source:
  edition: WLC
  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְק/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל וְ/נָתַתִּ֥י מִכְשׁ֛וֹל לְ/פָנָ֖י/ו ה֣וּא יָמ֑וּת כִּ֣י לֹ֤א הִזְהַרְתּ/וֹ֙ בְּ/חַטָּאת֣/וֹ יָמ֔וּת וְ/לֹ֣א תִזָּכַ֗רְןָ צִדְקֹתָ/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/020.yaml
  text: And when a righteous man turns from his righteousness and does injustice[a], and I place a stumbling block before him, he will die. Because you did not warn him, he will die in his sin, and his righteous deeds that he did will not be remembered[d][c][b]; and I will require his blood from your hand.
translation:
  language: ru
  text: А если праведник отступит от своей праведности и совершит неправду, а Я поставлю перед ним камень преткновения[a], то он умрёт. Поскольку ты не предостерёг его, он умрёт в своём грехе[b], и праведные дела, которые он совершил, не вспомнятся; а кровь его Я взыщу с твоей руки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставлю перед ним препятствие». Буквально — нечто, обо что спотыкаются.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он умрёт за свой грех». Буквально: «в своём грехе».'
    reason: lexical_alternative
  - marker: c
    text: То есть Я потребую от тебя ответа за его кровь.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: А если ... отступит
  rationale: Инфинитивная конструкция задаёт условно-временное обстоятельство. В русском контексте «а если» естественно передаёт переход к новому случаю и условную силу высказывания.
- source_word: צַדִּיק מִצִּדְקוֹ
  choice: праведник отступит от своей праведности
  rationale: Субстантивированное прилагательное естественно передано словом «праведник», а повтор корня и понятие праведности сохранены без сведения смысла только к юридическому статусу.
- source_word: וְעָשָׂה עָוֶל
  choice: и совершит неправду
  rationale: «Неправда» сохраняет нравственно-судебный оттенок עָוֶל и звучит естественнее, чем архаичное «беззаконие» или буквальное «сделает несправедливость».
- source_word: וְנָתַתִּי מִכְשׁוֹל לְפָנָיו
  choice: а Я поставлю перед ним преткновение
  rationale: Сохранена конкретная метафора препятствия, о которое спотыкаются, и явное указание на действие Бога. Необычное «преткновение» поддерживает библейскую образность; значение пояснено в сноске.
- source_word: הוּא יָמוּת
  choice: то он умрёт
  rationale: Русская условная конструкция естественно требует соотносительного «то»; отдельное местоимение сохраняет акцент на самом человеке.
- source_word: כִּי לֹא הִזְהַרְתּוֹ
  choice: Поскольку ты не предостерёг его
  rationale: כִּי передано причинным союзом, а глагол — словом «предостерёг», соответствующим поручению стража предупредить об опасности.
- source_word: בְּחַטָּאתוֹ
  choice: за свой грех
  rationale: В русском пророческом контексте это ясно передаёт грех как основание смерти. Возможное более формальное «в своём грехе» отмечено в сноске, поскольку предлог ב допускает оттенок состояния или сферы.
- source_word: וְלֹא תִזָּכַרְןָ צִדְקֹתָיו אֲשֶׁר עָשָׂה
  choice: и праведные дела, которые он совершал, не вспомнятся
  rationale: Множественное число צִדְקֹתָיו передано как конкретные праведные поступки. Несовершенный вид «совершал» естественно обозначает прежнюю практику, не добавляя богословского вывода.
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: а кровь его Я взыщу с твоей руки
  rationale: Сохранена судебная метафора крови и руки, выражающая ответственность стража, вместо полного замещения её толкованием.
theological_decisions:
- issue: Бог ставит перед праведником преткновение
  choice: Сохранить прямую божественную субъектность и метафору преткновения.
  alternative: Истолковать как простое допущение препятствия или как последствие собственного греха человека.
  rationale: Еврейский текст прямо говорит «Я поставлю»; перевод не должен устранять напряжение между Божьим действием и ответственностью человека.
- issue: Прежние праведные дела отступившего праведника не вспоминаются
  choice: Передать утверждение без дальнейшего догматического толкования.
  alternative: Уточнить его как утрату спасения, утрату заветного положения либо лишь как риторическое предупреждение.
  rationale: Текст говорит о невоспоминании прежних праведных дел в контексте суда, но сам не формулирует систематического учения о стойкости или отпадении.
- issue: Ответственность стража за кровь человека
  choice: Сохранить идиому «кровь ... взыщу с твоей руки».
  alternative: Полностью заменить её пояснением «привлеку тебя к ответу за его смерть».
  rationale: Буквенный образ понятен в контексте и сохраняет судебно-богословскую силу оригинала; смысл ответственности раскрыт сноской.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены повтор «праведник — праведность», напряжённая метафора божественно поставленного преткновения и судебная формула взыскания крови. Архаизмы сведены к содержательно значимому слову «преткновение», которое сразу поясняется.
