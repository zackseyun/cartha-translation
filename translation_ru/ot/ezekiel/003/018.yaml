  text: בְּ/אָמְרִ֤/י לָֽ/רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א הִזְהַרְתּ֗/וֹ וְ/לֹ֥א דִבַּ֛רְתָּ לְ/הַזְהִ֥יר רָשָׁ֛ע מִ/דַּרְכּ֥/וֹ הָ/רְשָׁעָ֖ה לְ/חַיֹּת֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/018.yaml
  text: When I say to the wicked man[a], ‘You shall surely die,’ and you do not warn him, and you do not speak to warn the wicked man from his wicked way so that he may live, that wicked man shall die in his iniquity[b], but I will require his blood from your hand.
translation:
  language: ru
  text: 'Когда Я скажу нечестивому: «Ты непременно умрёшь», — а ты не предостережёшь его и не будешь говорить, чтобы предостеречь нечестивого от его злого пути, чтобы он жил, то этот нечестивый умрёт за своё беззаконие[a], но кровь его Я взыщу с тебя[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умрёт в своём беззаконии»; возможно также: «из-за своего беззакония».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть Я призову тебя к ответу за его смерть. Буквально: «его кровь взыщу из твоей руки» — судебный оборот, выражающий ответственность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Когда Я скажу
  rationale: Конструкция с בְּ вводит временное придаточное; этот вариант естественно передаёт её значение.
- source_word: לָרָשָׁע / רָשָׁע
  choice: нечестивому / нечестивого / этот нечестивый
  rationale: Сохраняет мужской род, единственное число и значимый повтор корня רשע.
- source_word: מוֹת תָּמוּת
  choice: Ты непременно умрёшь
  rationale: Инфинитив абсолютный с личной формой усиливает уверенность и торжественность утверждения.
- source_word: הִזְהַרְתּוֹ / לְהַזְהִיר
  choice: предостережёшь / предостеречь
  rationale: Hiphil от זהר здесь означает дать предупреждение; повтор глагола отражает повтор исходного текста.
- source_word: מִדַּרְכּוֹ הָרְשָׁעָה
  choice: от злого пути
  rationale: «Путь» сохраняет метафору поведения, а «злой» естественно сочетается с ней в современном русском языке.
- source_word: לְחַיֹּתוֹ
  choice: дабы он остался жив
  rationale: Передаёт целевое значение инфинитива, не уточняя, идёт ли речь исключительно о физической или духовной жизни.
- source_word: בַּעֲוֺנוֹ
  choice: за своё беззаконие
  rationale: Предлог בְּ допускает причинное понимание; «беззаконие» передаёт как вину, так и нравственную тяжесть עָוֹן. Альтернатива отмечена в сноске.
- source_word: דָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: кровь его Я взыщу с тебя
  rationale: Сохраняет конкретный судебный образ крови и идиому ответственности, выражая её естественным русским оборотом.
theological_decisions:
- issue: Характер смерти и жизни
  choice: Передать как «умрёшь» и «остался жив», не уточняя вид смерти или жизни.
  alternative: Истолковать выражения только как физическую либо только как духовную смерть и жизнь.
  rationale: Еврейский текст не вводит такого уточнения; перевод сохраняет богословскую напряжённость и широту формулировки.
- issue: Основание смерти нечестивого в בַּעֲוֺנוֹ
  choice: «за своё беззаконие» с указанием более буквальной возможности в сноске.
  alternative: «в своём беззаконии».
  rationale: 'Оба прочтения грамматически возможны: причинное подчёркивает ответственность за вину, обстоятельственное — состояние, в котором человек умирает.'
- issue: Судебная ответственность стража
  choice: Сохранить образ «кровь его Я взыщу с тебя».
  alternative: «Я призову тебя к ответу за его кровь».
  rationale: Буквенный образ является существенной частью судебной и нравственной силы высказывания; смысл идиомы поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. «Дабы» выбрано для краткой и ясной передачи цели без излишней разговорности; архаические формы и тяжёлое калькирование сведены к минимуму. Все сноски отмечены в основном тексте.
