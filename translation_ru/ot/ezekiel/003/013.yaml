lexical_decisions:
- source_word: וְקוֹל
  choice: и шум
  rationale: קוֹל обозначает голос, звук или шум; здесь речь идёт не о речи, а о мощных звуках видения, поэтому «шум» естественно вводит все три слуховых образа.
- source_word: כַּנְפֵי הַחַיּוֹת
  choice: крыльев живых существ
  rationale: Конструкция прямо обозначает крылья существ из видения; «живые существа» сохраняет смысл חַיּוֹת, не уточняя их природу сверх текста.
- source_word: מַשִּׁיקוֹת אִשָּׁה אֶל אֲחוֹתָהּ
  choice: соприкасавшихся друг с другом
  rationale: מַשִּׁיקוֹת здесь передаёт соприкосновение крыльев, а буквальное «каждое с сестрой своей» является еврейским взаимным оборотом. Русская формулировка сохраняет образ и согласуется с прошедшим повествовательным контекстом.
- source_word: הָאוֹפַנִּים
  choice: колёс
  rationale: В видении Иезекииля אוֹפַנִּים — колёса, связанные с живыми существами.
- source_word: לְעֻמָּתָם
  choice: рядом с ними
  rationale: Предлог выражает пространственное соответствие или положение напротив/возле них; «рядом с ними» естественно в данном контексте, а возможное «напротив них» отмечено в сноске.
- source_word: רַעַשׁ גָּדוֹל
  choice: гул великого потрясения
  rationale: רַעַשׁ сочетает значения сильного шума, сотрясения и смятения. Формулировка сохраняет как слуховой, так и динамический оттенок, не сводя образ однозначно к землетрясению.
