  text: not to many peoples of obscure speech and difficult language[a], whose words you cannot understand; surely, if I had sent you to them, they would listen to you.
translation:
  language: ru
  text: не ко многим народам с непонятной речью и трудным языком[a], слов которых ты не понимаешь. Если бы Я послал тебя к ним, они непременно послушали бы тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глубокими устами и тяжёлым языком» — образное обозначение речи, которую трудно понять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  choice: многим народам
  rationale: «Народы» сохраняет этническую и национальную множественность עַמִּים и естественно звучит по-русски.
- source_word: עִמְקֵי שָׂפָה
  choice: с непонятной речью
  rationale: Буквально «глубокие устами»; идиома указывает на речь, которую трудно понять. Перевод передаёт смысл, а буквальный образ отмечен в сноске.
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: и трудным языком
  rationale: Буквально «тяжёлые языком»; в сочетании с предыдущей идиомой речь идёт о языке, трудном для восприятия.
- source_word: אֲשֶׁר לֹא תִשְׁמַע דִּבְרֵיהֶם
  choice: слов которых ты не понимаешь
  rationale: В контексте чужой речи שׁמע означает не просто физически слышать, а понимать сказанное.
- source_word: אִם לֹא
  choice: Если бы … непременно
  rationale: Конструкция имеет усилительно-условный смысл; русское «если бы … непременно» естественно выражает и условность, и уверенное утверждение.
- source_word: שְׁלַחְתִּיךָ
  choice: Я послал тебя
  rationale: В составе ирреального условия русская форма с «бы» передаёт гипотетический характер высказывания без необходимости отдельной формы давнопрошедшего времени.
- source_word: הֵמָּה יִשְׁמְעוּ אֵלֶיךָ
  choice: они непременно послушали бы тебя
  rationale: שׁמע с אֶל означает «слушать кого-либо», подразумевая восприимчивость, но перевод не усиливается до однозначного «повиновались бы».
theological_decisions:
- issue: Степень отклика чужих народов
  choice: послушали бы тебя
  alternative: повиновались бы тебе
  rationale: Формулировка сохраняет возможный оттенок отзывчивости, не превращая его без достаточных оснований в прямое утверждение о полном повиновении.
translation_notes:
  register: Современный литературный русский язык; речь Бога передана с прописным «Я» по принятой русской библейской традиции. Начальное «не» сохранено, поскольку стих синтаксически продолжает предыдущую фразу.
