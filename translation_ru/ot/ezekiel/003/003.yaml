base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/003.yaml
  text: And he said to me[a], “Son of man, feed your belly and fill your inward parts with this scroll that I am giving you.” So I ate it, and it was in my mouth as sweet as honey.
translation:
  language: ru
  text: 'И Он сказал мне[a]: «Сын человеческий, насыть своё чрево и наполни свои внутренности этим свитком, который Я даю тебе». И я съел его, и во рту у меня он был сладок, как мёд.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек», «смертный». Буквально: «сын человека»; это повторяющееся обращение к Иезекиилю подчёркивает, что он человек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и буквально передаёт еврейский оборот, подчёркивающий его человеческую природу.
- source_word: בִּטְנְךָ תַאֲכֵל
  choice: насыть своё чрево
  rationale: Передаёт каузативную форму глагола и конкретный телесный образ; «чрево» здесь звучит возвышенно, но остаётся понятным в библейском контексте.
- source_word: וּמֵעֶיךָ תְמַלֵּא
  choice: наполни свои внутренности
  rationale: Сохраняет телесную конкретность и параллелизм исходного текста без неуместно медицинского оттенка.
- source_word: הַמְּגִלָּה
  choice: свиток
  rationale: Точно обозначает письменный свиток как предмет, данный пророку.
- source_word: נֹתֵן
  choice: Я даю
  rationale: Настоящее время естественно передаёт причастную форму и непосредственность происходящего.
- source_word: וָאֹכְלָה
  choice: Я съел его
  rationale: Продвигает повествование; местоимение явно отсылает к свитку и необходимо для естественной русской речи.
- source_word: כִּדְבַשׁ לְמָתוֹק
  choice: сладок, как мёд
  rationale: Естественно передаёт еврейское сравнение «как мёд по сладости», сохраняя вкусовой образ.
theological_decisions:
- issue: Передача אָדָם в обращении בֶּן אָדָם
  choice: человеческий
  alternative: смертный; человек; сын Адама
  rationale: Устойчивое «Сын человеческий» сохраняет повторяющуюся форму обращения в книге Иезекииля и её смысловой акцент на человеческой природе и ограниченности пророка, не отождествляя здесь выражение с позднейшим титульным употреблением.
- issue: Сладость свитка при наличии в нём плача и горя
  choice: сохранить прямой образ без поясняющей интерпретации
  alternative: уточнить, что сладость относится к Божьему слову или послушанию
  rationale: Исходный текст не объясняет богословскую причину сладости; перевод сохраняет напряжение между содержанием свитка и его сладостью во рту.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Телесная образность оригинала сохранена. Слово «чрево» выбрано как несколько возвышенное, но общеупотребительно понятное в данном контексте; синтаксис сделан естественным для современного русского.
