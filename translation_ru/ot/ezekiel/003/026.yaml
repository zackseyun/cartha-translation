base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/026.yaml
  text: And I will make your tongue cling to the roof of your mouth[a], and you will be mute and will not be for them a man who rebukes[d][c][b], for they are a rebellious house.
translation:
  language: ru
  text: 'И Я сделаю так, что твой язык прилипнет к нёбу[a]: ты онемеешь[b] и не будешь для них обличителем[c], потому что они — мятежный дом[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к верхней части полости рта».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лишишься речи»; «будешь безмолвен».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «мужем, который обличает», то есть тем, кто укоряет их и указывает им на вину.'
    reason: lexical_alternative
  - marker: d
    text: «Мятежный дом» — характерное для книги Иезекииля обозначение народа как единого сообщества, восставшего против Бога.
    reason: cultural_note
lexical_decisions:
- source_word: אַדְבִּיק
  choice: Я сделаю так, что… прилипнет
  rationale: 'Каузативная порода гифиль передаёт действие Бога: Он заставит язык Иезекииля прилипнуть. Русская конструкция сохраняет причинительное значение и звучит естественно.'
- source_word: לְשׁוֹנְךָ
  choice: твой язык
  rationale: Конкретный телесный образ сохранён буквально, поскольку он существенен для знамения вынужденного молчания пророка.
- source_word: אֶל חִכֶּךָ
  choice: к нёбу
  rationale: חֵךְ обозначает нёбо, внутреннюю верхнюю часть рта. «К нёбу» — точный и естественный русский эквивалент.
- source_word: וְנֶאֱלַמְתָּ
  choice: ты онемеешь
  rationale: Нифаль выражает наступление неспособности говорить. «Онемеешь» передаёт изменение состояния и связано с предшествующим телесным образом.
- source_word: וְלֹא תִהְיֶה לָהֶם
  choice: и не будешь для них
  rationale: Сохранена еврейская бытийно-реляционная конструкция без добавления неявного значения служения или назначения.
- source_word: לְאִישׁ מוֹכִיחַ
  choice: обличителем
  rationale: Сочетание буквально означает «мужем обличающим». В русском языке «обличителем» естественно передаёт роль человека, который укоряет и указывает на вину, не перегружая фразу буквализмом.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание наложенного ограничения речи и ясно передаёт причинную связь.
- source_word: בֵּית מְרִי
  choice: мятежный дом
  rationale: Сохранён характерный для Иезекииля корпоративный образ «дома», а מְרִי передано словом «мятежный», подчёркивающим сознательное неповиновение.
theological_decisions:
- issue: Характер неспособности Иезекииля говорить
  choice: Наложенное Богом онемение, препятствующее пророческому обличению
  alternative: Чисто метафорическое молчание или неспособность убедить слушателей
  rationale: Образы языка и нёба указывают на конкретное, вызванное Богом ограничение речи. Перевод сохраняет эту телесную образность, не уточняя сверх сказанного в стихе его продолжительность или абсолютность.
- issue: Передача выражения בֵּית מְרִי
  choice: мятежный дом
  alternative: мятежный народ; дом мятежа
  rationale: «Дом» сохраняет корпоративную метафору и характерную лексику книги Иезекииля; замена на «народ» была бы разъясняющей, но сгладила бы исходный образ.
- issue: Передача לְאִישׁ מוֹכִיחַ
  choice: обличителем
  alternative: обличающим человеком; тем, кто обличает
  rationale: Существительное роли естественно по-русски передаёт мужскую форму, относящуюся к Иезекиилю, при этом не вводит отдельного акцента на слове «муж», которого русская фраза не требует.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «И» сохраняет связь с предыдущим контекстом. «Я» написано с прописной буквы как традиционное графическое указание на говорящего Бога, не изменяющее смысла исходного текста. Термин «обличитель» несколько возвышен, но понятен и уместен в пророческом контексте.
