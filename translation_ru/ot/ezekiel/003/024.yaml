base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/024.yaml
  text: Then the Spirit entered into me and set me on my feet[a], and he spoke to me and said to me, “Go[b], shut yourself inside your house.”
translation:
  language: ru
  text: 'Тогда Дух вошёл в меня и поставил меня на ноги[a]. Он заговорил со мной и сказал мне: «Ступай[b], запрись у себя в доме».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух вошёл в меня».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «приди»; в данном контексте повеление означает отправиться в свой дом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֔וּחַ
  choice: Дух
  rationale: В контексте пророческого призвания Иезекииля речь, вероятнее всего, идёт о Божьем Духе. Отсутствие артикля в еврейском не исключает определённого референта; прописная буква передаёт контекстуальную идентификацию, а сноска сохраняет формально возможное чтение «дух».
- source_word: וַ/תָּבֹא בִ֣/י
  choice: вошёл в меня
  rationale: Сочетание בוא с предлогом ב при личном объекте прямо выражает вхождение внутрь и соответствует повторяющейся формуле у Иезекииля.
- source_word: וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י
  choice: поставил меня на ноги
  rationale: Каузативная порода глагола עמד означает, что Дух сделал так, чтобы пророк встал; русский оборот естественно и точно сохраняет эту причинность.
- source_word: וַ/יְדַבֵּ֤ר אֹתִ/י֙
  choice: Он заговорил со мной
  rationale: Необычная конструкция с אֹתִי допускает передачу личного речевого взаимодействия как «заговорил со мной»; последующее «сказал мне» вводит содержание речи без тяжеловесного повтора.
- source_word: בֹּ֥א
  choice: Ступай
  rationale: Буквальное значение — «иди/войди, приди», однако в данном повелении русское «ступай» естественно направляет адресата в дом. Сноска отмечает буквальную форму.
- source_word: הִסָּגֵ֖ר
  choice: запрись
  rationale: Нифальский императив имеет здесь возвратно-пассивный оттенок; «запрись» кратко и естественно передаёт добровольное затворение по приказу.
- source_word: בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ
  choice: у себя в доме
  rationale: Выражение обозначает пребывание внутри собственного дома; русская формулировка современна и не утрачивает пространственного смысла.
theological_decisions:
- issue: Идентификация רוּחַ
  choice: «Дух» — Божий Дух, наделяющий Иезекииля силой
  alternative: «дух» — неуточнённая духовная сила или существо
  rationale: Ближайший контекст книги неоднократно связывает это действие с пророческим воодушевлением от Бога. При этом грамматически слово стоит без артикля, поэтому альтернативная возможность сохранена в сноске.
- issue: Лицо говорящего после действия Духа
  choice: Мужское местоимение «Он» соотнесено с Духом в непосредственной последовательности повествования
  alternative: Говорящим может подразумеваться Бог, не обязательно отождествляемый грамматически с ближайшим существительным
  rationale: Еврейский текст не называет субъект заново. Русский перевод следует ближайшей синтаксической связи, не развивая из неё отдельного догматического утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. «Ступай» сохраняет повелительный тон без архаичной тяжеловесности; «запрись у себя в доме» звучит естественно и передаёт затворение внутри дома. Маркеры обеих сносок включены в основной текст.
