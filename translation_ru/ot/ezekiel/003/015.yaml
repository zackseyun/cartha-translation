lexical_decisions:
- source_word: הַגּוֹלָה
  choice: переселенцам
  rationale: Слово обозначает сообщество уведённых в изгнание людей, а не отвлечённое состояние плена. «Переселенцы» естественно звучит по-русски и не добавляет оценки добровольности в данном контексте.
- source_word: תֵּל אָבִיב
  choice: Тель-Авив
  rationale: Древний топоним передан общепринятой русской транслитерацией; его тождество современному городу не подразумевается.
- source_word: הַיֹּשְׁבִים אֶל־נְהַר כְּבָר
  choice: жившим у реки Кевар
  rationale: Причастие передаёт постоянное проживание, а אֶל здесь имеет локативный смысл. Название כְּבָר транслитерировано как «Кевар».
- source_word: וַאֲשֶׁר הֵמָּה יוֹשְׁבִים שָׁם
  choice: туда, где они жили
  rationale: Синтаксис масоретского текста труден. Перевод сохраняет возобновляющий повтор и не вводит отсутствующего в еврейском тексте глагола «увидел».
- source_word: וָאֵשֵׁב שָׁם
  choice: просидел там
  rationale: Сохранён конкретный смысл «сидеть», важный для картины потрясённого молчания; приставочная форма естественно соединяет его с указанием длительности.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Естественное русское обозначение длительности после «просидел».
- source_word: מַשְׁמִים
  choice: потрясённый
  rationale: Форма передаёт состояние шока, ошеломления или внутренней опустошённости. «Потрясённый» естественно и не сужает смысл до простого удивления.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Естественная современная передача физического пребывания внутри сообщества.
