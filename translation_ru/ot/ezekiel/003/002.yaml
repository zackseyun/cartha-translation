lexical_decisions:
- source_word: וָאֶפְתַּח אֶת־פִּי
  choice: И я открыл рот
  rationale: 'Форма wayyiqtol передаёт последовательное действие в повествовании; русское «И я открыл» естественно сохраняет эту связь. Притяжательное значение суффикса выражено по-русски без местоимения: «открыл рот».'
- source_word: וַיַּאֲכִלֵנִי
  choice: и Он дал мне съесть
  rationale: Каузативная порода hифиль глагола אכל буквально указывает, что говорящий был побуждён или приведён к тому, чтобы съесть свиток. «Дал мне съесть» естественно по-русски передаёт каузативность, не уточняя сверх текста, кормил ли Он пророка непосредственно или заставил его есть.
- source_word: אֵת הַמְּגִלָּה הַזֹּאת
  choice: этот свиток
  rationale: מְגִלָּה обозначает свиток; указательное הַזֹּאת естественно передано словом «этот».
theological_decisions:
- issue: Степень принуждения в форме וַיַּאֲכִלֵנִי
  choice: дал мне съесть
  alternative: заставил меня съесть / накормил меня
  rationale: Еврейский каузатив допускает оттенки от предоставления и побуждения до принуждения. Основной текст сохраняет напряжение и не вводит однозначно насильственный смысл; более буквальные варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Заглавное «Он» употреблено для прозрачного обозначения Бога в непосредственном контексте; синтаксис остаётся кратким и торжественным.
