base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/021.yaml
  text: But if you warn a righteous man not to sin[a], and he does not sin, he will surely live because he took warning, and you will have delivered your life.
translation:
  language: ru
  text: Но если ты предостережёшь праведника, чтобы он не грешил, и он не согрешит, то он непременно будет жить, потому что внял предостережению[a], и ты спасёшь свою жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был предостережён»; или: «послушался предостережения». Еврейский глагол может подчёркивать как получение предостережения, так и отклик на него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: если
  rationale: В сочетании с וְאַתָּה вводит условие и продолжает условную последовательность предшествующего контекста.
- source_word: הִזְהַרְתּוֹ
  choice: ты предостережёшь
  rationale: Hiphil глагола זהר означает «предостеречь, предупредить»; будущее время естественно передаёт условную конструкцию по-русски.
- source_word: צַדִּיק
  choice: праведника
  rationale: Субстантивированное прилагательное мужского рода обозначает праведного человека; форма дополнения обусловлена русским синтаксисом.
- source_word: לְבִלְתִּי חֲטֹא
  choice: чтобы он не грешил
  rationale: Инфинитивная конструкция выражает цель или предотвращение; развёрнутая форма ясна и естественна в современном русском языке.
- source_word: וְהוּא לֹא חָטָא
  choice: и он не согрешит
  rationale: Хотя в еврейском употреблён перфект, в условно-результативном высказывании русское будущее естественно выражает предполагаемый исход.
- source_word: חָיוֹ יִחְיֶה
  choice: он непременно будет жить
  rationale: Сочетание абсолютного инфинитива с имперфектом усиливает утверждение; «непременно» передаёт эмфатическую силу.
- source_word: נִזְהָר
  choice: внял предостережению
  rationale: Niphal глагола זהר допускает акцент как на получении предупреждения, так и на отклике на него; в контексте отсутствие греха позволяет естественно выразить действенный отклик, сохраняя альтернативу в сноске.
- source_word: נַפְשְׁךָ
  choice: свою жизнь
  rationale: נֶפֶשׁ здесь означает жизнь самого пророка, а не специально нематериальную «душу».
- source_word: הִצַּלְתָּ
  choice: спас
  rationale: Hiphil נצל означает «спасти, избавить». Русский перфективный глагол естественно передаёт достигнутый результат предупреждения.
theological_decisions:
- issue: Значение выражения «спас свою жизнь» в контексте стража
  choice: Сохранена буквальная и напряжённая формулировка о спасении жизни пророка без пояснения внутри стиха.
  alternative: Истолковать выражение прямо как избавление от вины за кровь либо как духовное самоспасение.
  rationale: Контекст связывает исполнение обязанности стража с ответственностью перед Богом, однако сам стих говорит о спасении жизни. Перевод не должен сужать эту формулировку до одной богословской схемы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Предостеречь» сохраняет серьёзность речи стража; «непременно будет жить» передаёт еврейское усиление без архаизма.
