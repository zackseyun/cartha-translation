  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וָ/אֶשְׁמַ֣ע אַחֲרַ֔/י ק֖וֹל רַ֣עַשׁ גָּד֑וֹל בָּר֥וּךְ כְּבוֹד יְהוָ֖ה מִ/מְּקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/012.yaml
  text: 'Then the Spirit lifted me up, and I heard behind me a sound of a great rumbling: “Blessed be the glory of the LORD from his place.”'
translation:
  language: ru
  text: 'И поднял меня Дух, и я услышал позади себя сильный грохот: «Благословенна слава ГОСПОДА от места Его[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение «от места Его» необычно; возможный смысл: возглас исходил от того места, где являлась слава ГОСПОДА. Некоторые древние версии отражают иное понимание всей фразы.'
    reason: Фраза מִמְּקוֹמוֹ и синтаксис возгласа трудны, поэтому важно обозначить реальную текстово-переводческую неоднозначность, не перегружая основной текст.
lexical_decisions:
- source_word: רוּחַ
  choice: Дух
  rationale: В контексте видения Иезекииля это действующая сверхъестественная сила, поднимающая пророка; прописная буква сохраняет естественное для русского библейского стиля личностное прочтение, не устраняя полностью широту еврейского слова («дух/ветер»).
- source_word: קוֹל רַעַשׁ גָּדוֹל
  choice: звук великого грохота
  rationale: קוֹל обозначает слышимый звук, а רַעַשׁ — сильный гул, грохот или сотрясение; сочетание передано без сведения образа только к землетрясению.
- source_word: בָּרוּךְ כְּבוֹד יְהוָה
  choice: Благословенна слава ГОСПОДА
  rationale: Сохранена необычная формулировка масоретского текста, где благословенной названа «слава», без исправления в более привычное «Благословен Господь».
- source_word: מִמְּקוֹמוֹ
  choice: от места Его
  rationale: Буквально передаёт исходную точку звучания или явления; намеренно не заменено на «на месте Его», хотя такая трактовка встречается.
theological_decisions:
- issue: К кому относится רוּחַ
  choice: «Дух» с прописной буквы
  alternative: «дух» или «ветер»
  rationale: Ближайший контекст описывает целенаправленно действующего Духа, который поднимает пророка; при этом перевод не добавляет уточнения «Божий», отсутствующего в стихе.
- issue: Смысл возгласа о славе ГОСПОДА
  choice: Сохранить масоретское «Благословенна слава ГОСПОДА от места Его»
  alternative: Читать как благословение ГОСПОДА или как утверждение, что Его слава восходит со своего места
  rationale: Еврейский консонантный текст и масоретская вокализация допускают трудную, но связную формулировку; богословски более привычная редакция не должна подменять источник.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Инверсия «от места Его» сохранена ради ясного местоименного соотнесения и возвышенного регистра; имя יהוה передано традиционным типографическим «ГОСПОДЬ».
