  - severity: low
    issue: Добавленное «люди» и форма «упрямые сердцем люди» утяжеляют именное сказуемое.
    rationale: Еврейская фраза допускает естественную русскую передачу посредством «у ... твёрдые лбы и упрямые сердца», без добавления референта и с сохранением обоих образов.
