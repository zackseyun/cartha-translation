  text: וּ/בֵ֣ית יִשְׂרָאֵ֗ל לֹ֤א יֹאבוּ֙ לִ/שְׁמֹ֣עַ אֵלֶ֔י/ךָ כִּֽי אֵינָ֥/ם אֹבִ֖ים לִ/שְׁמֹ֣עַ אֵלָ֑/י כִּ֚י כָּל בֵּ֣ית יִשְׂרָאֵ֔ל חִזְקֵי מֵ֥צַח וּ/קְשֵׁי לֵ֖ב הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/007.yaml
  text: But the house of Israel will not be willing to listen to you[a], because they are not willing to listen to me[b]; for all the house of Israel are hard of forehead and stubborn of heart.
translation:
  language: ru
  text: Но дом Израиля не захочет слушать тебя, потому что не хочет слушать меня; ведь у всего дома Израиля твёрдые лбы[a] и упрямые сердца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «крепкие (или твёрдые) лбом»; этот еврейский образ обозначает бесстыдное, вызывающее упрямство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жёсткие сердцем»; возможный поясняющий перевод: «с непреклонным сердцем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית יִשְׂרָאֵל
  choice: Но дом Израиля
  rationale: Союз передан противительным «но», поскольку фраза противопоставляет Израиль упомянутым ранее чужеземным народам. «Дом Израиля» сохраняет корпоративное и заветное обозначение.
- source_word: לֹא יֹאבוּ / אֵינָם אֹבִים
  choice: не захочет / не хочет
  rationale: Глагол אָבָה выражает желание или готовность согласиться. Такой перевод сохраняет волевой оттенок, не усиливая его до прямого «откажется».
- source_word: לִשְׁמֹעַ אֵלֶיךָ / לִשְׁמֹעַ אֵלָי
  choice: слушать тебя / слушать меня
  rationale: שׁמע с אֶל здесь означает внимать говорящему. Одинаковый перевод обеих фраз сохраняет параллель между неприятием пророка и неприятием Бога; «повиноваться» было бы более истолковывающим.
- source_word: כִּי ... כִּי
  choice: потому что ... ведь
  rationale: Первое כִּי непосредственно указывает причину, а второе вводит дальнейшее объяснение. Разные русские связки ясно и естественно передают эту структуру.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: весь дом Израиля
  rationale: Сохранена всеохватная корпоративная характеристика без сужения до части народа или его вождей.
- source_word: חִזְקֵי מֵצַח
  choice: твердолобые
  rationale: Слово сохраняет телесный образ твёрдого лба и передаёт упорное, дерзкое сопротивление; буквальная русская конструкция «крепкие лбом» звучала бы неестественно.
- source_word: וּקְשֵׁי לֵב
  choice: упрямые сердцем
  rationale: Сохранён образ сердца как средоточия воли. «Упрямые» ясно передаёт внутреннюю непреклонность, а сноска отмечает более буквальное значение.
- source_word: הֵמָּה
  choice: люди
  rationale: Добавленное по смыслу существительное позволяет естественно оформить во множественном числе подчёркнутое еврейское именное сказуемое и не меняет референта.
theological_decisions:
- issue: Всеохватная характеристика Израиля
  choice: Сохранить выражение «весь дом Израиля» без смягчения.
  alternative: «Многие в доме Израиля» или «вожди Израиля».
  rationale: Еврейский текст формулирует корпоративное обвинение всеохватно. Перевод не ограничивает его не названной в стихе группой.
- issue: Связь между неприятием пророка и неприятием Бога
  choice: 'Сохранить прямую причинную связь: Израиль не слушает пророка, потому что не хочет слушать Бога.'
  alternative: Истолковать «слушать» как полное «повиноваться».
  rationale: Повиновение подразумевается контекстом, но лексически текст говорит о слушании; напряжение между слышанием и послушанием не следует устранять в основном тексте.
translation_notes:
  register: Современный литературный русский язык с сохранением образности оригинала. «Твердолобые» намеренно передаёт резкость пророческого обличения, а сноски раскрывают буквальные метафоры. Местоимение «меня» дано со строчной буквы согласно обычной современной орфографии и без внесения конфессиональной издательской традиции.
