  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנֵּ֨ה נָתְנ֤וּ עָלֶ֨י/ךָ֙ עֲבוֹתִ֔ים וַ/אֲסָר֖וּ/ךָ בָּ/הֶ֑ם וְ/לֹ֥א תֵצֵ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/025.yaml
  text: But you[a], son of man, behold, they will put ropes on you and bind you with them[b], so that you will not go out among them.
translation:
  language: ru
  text: 'А ты, сын человеческий, вот: на тебя накинут верёвки[a] и свяжут тебя ими, так что ты не выйдешь к ним[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шнуры»; возможно также: «путы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «среди них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и последовательность этой формулы во всей книге; в данном контексте это звательная формула, а не указание на мессианский титул.
- source_word: הִנֵּה
  choice: знай
  rationale: Передаёт функцию торжественного маркера внимания естественным современным русским языком; буквальное «вот» здесь звучало бы менее плавно.
- source_word: נָתְנוּ
  choice: накинут
  rationale: Перфект после הִנֵּה в пророческом контексте передан будущим временем. Неопределённое третье лицо множественного числа сохраняет неуказанными тех, кто совершит действие.
- source_word: עֲבוֹתִים
  choice: верёвки
  rationale: Ясно обозначает средства связывания и естественно сочетается с последующим глаголом «свяжут»; возможны также «шнуры» или «путы».
- source_word: וַאֲסָרוּךָ
  choice: и свяжут тебя
  rationale: Прямо передаёт значение корня אסר, не добавляя более узкого толкования «заключат тебя».
- source_word: בָּהֶם
  choice: ими
  rationale: 'Предлог употреблён в инструментальном значении: верёвки служат средством связывания.'
- source_word: וְלֹא תֵצֵא
  choice: так что ты не выйдешь
  rationale: «Так что» естественно выражает результат связывания, не усиливая фразу до утверждения о физической невозможности.
- source_word: בְּתוֹכָם
  choice: к ним
  rationale: При глаголе движения эта формулировка естественно передаёт смысл выхода в среду людей; буквальная пространственная форма отмечена в сноске.
theological_decisions:
- issue: Кто именно свяжет Иезекииля
  choice: Сохранено неопределённо-личное «накинут… свяжут» без указания действующих лиц.
  alternative: 'Уточнить: «люди свяжут», «они свяжут» или представить действие как совершённое Божьими посланниками.'
  rationale: В еврейском тексте стоит не названный прямо субъект третьего лица множественного числа. Перевод не разрешает намеренно сохранённую в тексте неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Сын человеческий» сохранено как характерное для книги обращение; «знай» передаёт הִנֵּה без архаического оттенка. Неопределённо-личная конструкция сохраняет неуказанными тех, кто связывает пророка.
