base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/009.yaml
  text: Like diamond[a], harder than flint, I have made your forehead. Do not fear them, and do not be dismayed before them, for they are a rebellious house.
translation:
  language: ru
  text: Я сделал твой лоб подобным алмазу[a], который твёрже кремня. Не бойся их и не падай духом перед ними, ведь они — дом мятежа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобным адаманту»; еврейское שָׁמִיר может обозначать исключительно твёрдый камень или материал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמִיר
  choice: алмаз
  rationale: В контексте сопоставления с кремнем слово обозначает исключительно твёрдый камень или материал, а не колючее растение. «Алмаз» естественно передаёт этот образ в современном русском языке, при этом лексическая неопределённость отмечена в сноске.
- source_word: חָזָק מִצֹּר
  choice: твёрже кремня
  rationale: Прилагательное с предлогом מִן образует сравнение; речь идёт именно о превосходящей твёрдости.
- source_word: צֹר
  choice: кремень
  rationale: Слово обозначает кремень или особо твёрдую породу; «кремень» точно соответствует образу твёрдости.
- source_word: מִצְחֶךָ
  choice: твой лоб
  rationale: Прямое современное соответствие, сохраняющее телесную метафору непреклонности.
- source_word: לֹא תִירָא
  choice: не бойся
  rationale: В контексте поручения форма выражает запрет или ободряющее повеление.
- source_word: וְלֹא תֵחַת
  choice: и не робей
  rationale: Nifal глагола חתת может означать быть сокрушённым, устрашённым или приведённым в смятение. «Не робей» естественно передаёт психологическую реакцию и сохраняет параллелизм с «не бойся».
- source_word: מִפְּנֵיהֶם
  choice: перед ними
  rationale: Сохраняет пространственно-личный оборот со значением страха в их присутствии.
- source_word: בֵּית מְרִי
  choice: мятежный дом
  rationale: Сохраняет характерное для Иезекииля корпоративное обозначение «дом» и передаёт מְרִי как упорное неповиновение.
theological_decisions:
- issue: Корпоративное обозначение Израиля в пророческом обличении
  choice: мятежный дом
  alternative: мятежный народ; дом мятежа
  rationale: Еврейский текст использует семейно-корпоративное слово «дом». Его сохранение удерживает важный для книги Иезекииля образ и не заменяет его истолкованием «народ».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для широкого читателя; метафоры «лоб», «кремень» и «мятежный дом» сохранены. «Не робей» выбрано как естественный, несколько возвышенный параллельный оборот к «не бойся».
