  naturalness: «Я сделал твой лоб подобным алмазу, твёрже кремня» в современном русском звучит грамматически не вполне оформленно. «Не робей» разговорнее и семантически слабее, чем запрет быть устрашённым/подавленным в נִפְעַל חתת. «Не падай духом» естественно и уместно в возвышенном пророческом регистре.
