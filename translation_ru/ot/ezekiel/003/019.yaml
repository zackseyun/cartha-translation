  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּה֙ כִּֽי הִזְהַ֣רְתָּ רָשָׁ֔ע וְ/לֹא שָׁב֙ מֵֽ/רִשְׁע֔/וֹ וּ/מִ/דַּרְכּ֖/וֹ הָ/רְשָׁעָ֑ה ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/019.yaml
  text: But if you warn a wicked man and he does not turn from his wickedness or from his wicked way[a], he will die in his iniquity[b], but you will have delivered your life.
translation:
  language: ru
  text: Но если ты предостерёг нечестивого, а он не отвернулся от своего нечестия и от своего злого пути, то он умрёт в своём беззаконии[a], а ты спасёшь свою жизнь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умрёт за свою вину».'
    reason: Лексема עָוֹן обозначает беззаконие, вину или виновность; предлог ב допускает как значение состояния («в своём беззаконии»), так и причинно-юридическое прочтение.
  - marker: b
    text: 'Или: «ты избавил себя»; букв.: «ты спас свою душу».'
    reason: נֶפֶשׁ может обозначать жизнь, самого человека или, буквально, душу. Будущее «спасёшь» передаёт итоговое значение еврейского перфекта в данном контексте.
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: предостерёг
  rationale: Форма Hiphil от זהר означает «предупредить, предостеречь». «Предостерёг» естественно передаёт серьёзное предупреждение в контексте служения стража.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное мужского рода обозначает конкретного человека, поступающего нечестиво; русская форма сохраняет род и нравственную характеристику.
- source_word: שָׁב
  choice: не отвернулся
  rationale: שׁוב буквально выражает поворот или возвращение. «Не отвернулся» сохраняет образ перемены направления и не подменяет его более истолковывающим «не покаялся».
- source_word: מֵרִשְׁעוֹ
  choice: от своего нечестия
  rationale: רֶשַׁע обозначает нечестие или злодеяние. «Нечестие» сохраняет нравственный вес существительного и его связь с характеристикой «нечестивый».
- source_word: וּמִדַּרְכּוֹ הָרְשָׁעָה
  choice: и от своего злого пути
  rationale: דֶּרֶךְ метафорически обозначает образ жизни и поведения. «Злой путь» сохраняет исходный образ и прямо передаёт הָרְשָׁעָה.
- source_word: בַּעֲוֺנוֹ
  choice: за свою вину
  rationale: עָוֹן объединяет значения вины, беззакония и наказуемого проступка; ב здесь естественно допускает причинно-юридическое понимание. «За свою вину» ясно передаёт личную ответственность, не уточняя характер смерти сверх текста.
- source_word: הִצַּלְתָּ אֶת־נַפְשְׁךָ
  choice: ты спас свою жизнь
  rationale: 'נֶפֶשׁ здесь означает жизнь или самого человека, а не обязательно нематериальную «душу». Перфект הִצַּלְתָּ сохранён русским прошедшим временем: предупреждение уже исполнено, и тем самым страж избавил свою жизнь от ответственности.'
theological_decisions:
- issue: Определяет ли смерть нечестивого его вечную участь
  choice: Передать, что он умрёт «за свою вину», не определяя природу или окончательный масштаб этой смерти.
  alternative: Истолковать смерть исключительно как временную судебную кару либо прямо как вечное осуждение.
  rationale: Еврейский текст утверждает смерть виновного, но в этом стихе не раскрывает её полный богословский объём; перевод не должен разрешать эту напряжённость за текст.
- issue: Значение נַפְשְׁךָ применительно к Иезекиилю
  choice: «свою жизнь»
  alternative: «свою душу» или «самого себя»
  rationale: В данном контексте נֶפֶשׁ обозначает жизнь/личность пророка в связи с его ответственностью. «Душу» могло бы неоправданно сузить смысл до нематериальной части человека.
- issue: Связь двух оборотов с מִן после отрицания
  choice: 'Сохранить соединительное «и»: «не отвернулся от своего нечестия и от своего злого пути».'
  alternative: Передать по-русски разделительным «или».
  rationale: Еврейское וּ непосредственно соединяет два тесно связанных описания одного нравственного состояния. Русское «и» сохраняет формальную связь и естественно читается как совокупный отказ оставить нечестие и соответствующий путь.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю, с сохранением достойного пророческого тона. Лексика «нечестивый», «нечестие», «злой путь» удерживает нравственную серьёзность оригинала без архаизации; синтаксис следует противопоставлению וְאַתָּה … הוּא … וְאַתָּה.
