base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/022.yaml
  text: And there the hand of Yahweh was upon me[a], and he said to me, “Rise, go out to the valley[b], and there I will speak with you.”
translation:
  language: ru
  text: 'И там рука Яхве была на мне. Он сказал мне: «Встань, выйди в долину[a], и там Я буду говорить с тобой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на равнину».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «буду говорить тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עָלַי
  choice: была на мне
  rationale: Сохраняет выраженный в еврейском тексте образ пребывающего на пророке Божьего воздействия, не добавляя значения внезапного наступления.
- source_word: שָׁם
  choice: там
  rationale: Прямой пространственный эквивалент; повтор сохранён для передачи пространственного акцента оригинала.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохраняет конкретную пророческую метафору Божьей силы и властного воздействия, не заменяя её толкованием «сила».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיֹּאמֶר אֵלַי
  choice: Он сказал мне
  rationale: Естественная современная передача обычной повествовательной формулы; местоимение ясно указывает на Яхве.
- source_word: קוּם
  choice: Встань
  rationale: Прямой и естественный русский эквивалент повелительной формы без архаизации.
- source_word: צֵא
  choice: выйди
  rationale: Точно передаёт направленное наружу движение; в русском контексте приставочная форма естественнее сочетания «иди наружу».
- source_word: הַבִּקְעָה
  choice: долину
  rationale: Слово обозначает широкую долину или низменную равнину; «долина» естественно в основном тексте, а возможное «равнина» сохранено в примечании.
- source_word: אֲדַבֵּר אוֹתָךְ
  choice: Я буду говорить с тобой
  rationale: Сохраняет конструкцию דבר + את и допускаемую ею направленность общения, не сводя выражение однозначно к «говорить тебе».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное имя Бога и не подменяет его титулом.
- issue: Характер действия, выраженного образом «рука Яхве»
  choice: Сохранить метафору «рука Яхве была на мне»
  alternative: «сила Яхве действовала на меня» или «рука Яхве сошла на меня»
  rationale: Буквенный образ богословски значим в пророческой речи; глагол описывает состояние и сам по себе не требует добавлять момент внезапного схождения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для русского повествования, при этом сохранены повтор «там», образ «руки Яхве» и неоднозначность двух лексических конструкций.
