base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/021.yaml
  text: 'Its guardrooms were three on this side and three on that side[a], and its side pillars and its portico had the same measurements as the first gate: its length was fifty cubits[b], and the width twenty-five cubits.'
translation:
  language: ru
  text: С каждой стороны у него было по три караульных помещения; его опоры[a] и притвор[b] были устроены по размерам первых ворот. Длина ворот — пятьдесят локтей, ширина — двадцать пять локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский архитектурный термин передан приблизительно; «опоры» может означать также косяки или пилястры.
    reason: lexical_alternative
  - marker: b
    text: Еврейский термин может также означать вестибюль или портик.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: караульное помещение
  rationale: В описании ворот это небольшие помещения, встроенные в сооружение. Такой перевод передаёт вероятную функцию и остаётся понятным современному читателю.
- source_word: שְׁלוֹשָׁה מִפּוֹ ... וּשְׁלֹשָׁה מִפּוֹ
  choice: с каждой стороны ... по три
  rationale: Естественно по-русски передаёт симметричное расположение трёх помещений с одной и трёх с другой стороны.
- source_word: אֵיל
  choice: опоры
  rationale: Нейтральное архитектурное обозначение несущих или выступающих элементов ворот; точный вид этих элементов по еврейскому термину не вполне ясен.
- source_word: אֵלַם
  choice: притвор
  rationale: Традиционное и понятное обозначение крытой входной части сооружения; возможны также значения «вестибюль» или «портик».
- source_word: הָיָה כְּמִדַּת הַשַּׁעַר הָרִאשׁוֹן
  choice: имели те же размеры, что и первые ворота
  rationale: Передаёт сравнение размеров с ранее описанными воротами и согласует составное подлежащее с глаголом во множественном числе в естественном русском синтаксисе.
- source_word: הַשַּׁעַר הָרִאשׁוֹן
  choice: первые ворота
  rationale: Указывает на ворота, описанные первыми; русское «ворота» нормативно употребляется во множественном числе.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ
  choice: пятьдесят локтей в длину
  rationale: Естественно и точно передаёт указанную длину сооружения.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים בָּאַמָּה
  choice: двадцать пять локтей в ширину
  rationale: Сохраняет параллельность двух измерений и ясно выражает ширину.
- source_word: אַמָּה
  choice: локоть
  rationale: Сохраняется библейская единица измерения без спорного пересчёта в современные единицы.
