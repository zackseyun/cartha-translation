  source_fidelity: 'Переданы все основные элементы еврейского текста: северная ориентация помещения, его назначение священникам, их обязанность у жертвенника, отождествление с сынами Садока, выделение их из сынов Левия и приближение к Яхве для служения Ему. Однако «несущих служение» не вполне точно передаёт идиому שֹׁמְרֵי מִשְׁמֶרֶת и не является удачной русской коллокацией.'
