  terminology: '«Яхве», «жертвенник», «сыны Садока» и «сыны Левия» сохранены последовательно и соответствуют исходному тексту. «Служить Ему» адекватно передаёт לְשָׁרְתוֹ. Сносок не требуется: в русском тексте нет добавленного толкования, а синтаксическая связь «из сынов Левия» передана без устранения значимой неоднозначности.'
