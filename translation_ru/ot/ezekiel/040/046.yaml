  text: וְ/הַ/לִּשְׁכָּ֗ה אֲשֶׁ֤ר פָּנֶ֨י/הָ֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן לַ/כֹּ֣הֲנִ֔ים שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ הֵ֣מָּה בְנֵֽי צָד֗וֹק הַ/קְּרֵבִ֧ים מִ/בְּנֵֽי לֵוִ֛י אֶל יְהוָ֖ה לְ/שָׁרְתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/046.yaml
  text: And the chamber whose front faces north is for the priests who keep charge of the altar. They are the sons of Zadok[a], who from among the sons of Levi come near to Yahweh to minister to him.
translation:
  language: ru
  text: А помещение, обращённое фасадом на север, предназначено для священников, исполняющих обязанности при жертвеннике. Это сыны Садока — те из сынов Левия, кто приближается к Яхве, чтобы служить Ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלִּשְׁכָּה
  choice: помещение
  rationale: В храмовом архитектурном контексте слово обозначает отдельную предназначенную для определённых нужд комнату; «помещение» звучит естественно и не привносит оттенка жилой комнаты.
- source_word: פָּנֶיהָ דֶּרֶךְ הַצָּפוֹן
  choice: обращённое фасадом на север
  rationale: פָּנִים здесь указывает на переднюю сторону здания и его ориентацию; «фасадом» ясно передаёт архитектурный смысл образа.
- source_word: לַכֹּהֲנִים
  choice: предназначено для священников
  rationale: Предлог ל־ выражает назначение помещения; связка и сказуемое естественно восполнены по-русски.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ
  choice: несущих служение при жертвеннике
  rationale: Идиома שמר משמרת обозначает исполнение вверенной обязанности. Такой перевод сохраняет культовый контекст и не сводит ответственность к физической охране.
- source_word: בְנֵי צָדוֹק
  choice: сыны Садока
  rationale: Формальное родословное выражение сохранено, поскольку здесь подчёркнута принадлежность к священнической линии Садока.
- source_word: הַקְּרֵבִים
  choice: кто приближается
  rationale: Глагол קרב в священническом контексте означает ритуально допустимое приближение к Богу для служения; буквальный образ сохранён.
- source_word: מִבְּנֵי לֵוִי
  choice: те из сынов Левия
  rationale: 'Передана партитивная сила מִן: сыны Садока выделены как часть более широкой группы сынов Левия.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: לְשָׁרְתוֹ
  choice: чтобы служить Ему
  rationale: שרת обозначает священное служение; русское «служить» естественно и сохраняет широкий культовый смысл.
theological_decisions:
- issue: Особое служение сынов Садока среди сынов Левия
  choice: Сыны Садока представлены как те из сынов Левия, кто приближается к Яхве для служения при жертвеннике.
  alternative: Отнести сказанное без различия ко всем левитам.
  rationale: Еврейский текст прямо выделяет сынов Садока из числа сынов Левия; перевод сохраняет это разграничение, не развивая его за пределы стиха.
translation_notes:
  register: Современный литературный русский язык с dignified храмовой лексикой. Синтаксис остаётся близким к еврейскому, но избегает тяжеловесной кальки; прописная буква в «Ему» поддерживает традиционный почтительный русский регистр.
