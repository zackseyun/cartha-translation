base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/013.yaml
  text: 'Then he measured the gateway from the roof of one guardroom to the roof of the other: twenty-five cubits wide[b][a], doorway opposite doorway.'
translation:
  language: ru
  text: 'Затем он измерил ворота от крыши одной караульной комнаты до крыши другой[a]: двадцать пять локтей в ширину; проём напротив проёма[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от крыши комнаты до её крыши». Еврейское слово תָּא обозначает помещение в составе ворот; здесь его часто понимают как караульную или боковую комнату.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «проём напротив проёма», то есть проёмы находились друг против друга по обеим сторонам ворот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Затем он измерил
  rationale: Форма wayyiqtol продолжает последовательность действий; «затем» естественно передаёт развитие повествования.
- source_word: הַשַּׁעַר
  choice: ворота
  rationale: В данном архитектурном контексте слово обозначает всё воротное сооружение, а не только створку; русское «ворота» допускает такое значение без тяжеловесного уточнения.
- source_word: מִגַּג הַתָּא לְגַגּוֹ
  choice: от крыши одной караульной комнаты до крыши другой
  rationale: תָּא обозначает помещение в составе ворот, обычно понимаемое здесь как караульная комната. «Другой» поясняет подразумеваемое измерение между соответствующими помещениями по обеим сторонам, тогда как буквальная неоднозначность местоименного суффикса отмечена в сноске.
- source_word: רֹחַב
  choice: в ширину
  rationale: Так естественно по-русски обозначается измеряемая величина после числового значения.
- source_word: עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: двадцать пять локтей
  rationale: Сохранена древняя мера длины и употреблена современная русская форма составного числительного.
- source_word: פֶּתַח נֶגֶד פָּתַח
  choice: проём напротив проёма
  rationale: Краткая симметричная формулировка сохраняет повтор существительного и передаёт расположение соответствующих проёмов друг против друга.
