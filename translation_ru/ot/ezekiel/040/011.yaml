  yaml_path: translation/ot/ezekiel/040/011.yaml
  text: 'Then he measured the width of the entrance of the gate: ten cubits[b][a], and the length of the gate: thirteen cubits.'
translation:
  language: ru
  text: 'Затем он измерил ширину проёма ворот: десять локтей, а длину ворот[a] — тринадцать локтей[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воротного сооружения»; еврейское שַׁעַר может обозначать не только ворота как проход, но и всё воротное сооружение.'
