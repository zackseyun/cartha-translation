  - marker: b
    text: 'Некоторые переводы передают второй размер более истолковательно, например как глубину или протяжённость воротного сооружения; в еврейском тексте буквально сказано: «длина ворот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Затем он измерил
  rationale: Форма wayyiqtol продолжает последовательность действий в видении; «затем» естественно передаёт повествовательное продвижение.
- source_word: רֹחַב
  choice: ширину
  rationale: Обычный термин для поперечного размера; современный и ясный русский эквивалент.
- source_word: פֶּתַח הַשַּׁעַר
  choice: входа в ворота
  rationale: פֶּתַח обозначает проём или вход; такая конструкция естественна по-русски и сохраняет архитектурный смысл.
- source_word: הַשַּׁעַר
  choice: ворота
  rationale: שַׁעַר может обозначать как ворота, так и всё воротное сооружение. В основном тексте сохранён прямой и традиционный эквивалент, а более широкий смысл отмечен в сноске.
- source_word: עֶשֶׂר אַמּוֹת
  choice: десять локтей
  rationale: Сохранена древняя мера длины без приблизительного пересчёта в современные единицы.
- source_word: אֹרֶךְ
  choice: длину
  rationale: Передан основной смысл слова — линейная протяжённость. Более конкретные варианты вроде «глубина» были бы истолкованием.
- source_word: שְׁלֹשׁ עֶשְׂרֵה אַמּוֹת
  choice: тринадцать локтей
  rationale: Прямо передаёт числительное и единицу измерения, сохраняя лаконичность еврейского описания.
