base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/009.yaml
  text: 'Then he measured the portico of the gate: eight cubits[a], and its side pillars two cubits[b]; and the portico of the gate was toward the temple.'
translation:
  language: ru
  text: 'Затем он измерил притвор ворот: восемь локтей, а его боковые столбы[a] — два локтя. Притвор ворот был обращён к храму[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы этого архитектурного термина: «косяки», «пилястры» или «стойки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от дома» или «со стороны дома»; в этом видении «дом» означает здание храма.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָד
  choice: Затем он измерил
  rationale: Форма wayyiqtol продолжает последовательность действий; «затем» естественно передаёт ход повествования.
- source_word: אֻלָם הַשַּׁעַר
  choice: притвор ворот
  rationale: אֻלָם обозначает входное крытое помещение или портик; «притвор» — понятный и уместный русский архитектурный термин.
- source_word: שְׁמֹנֶה אַמּוֹת
  choice: восемь локтей
  rationale: Древняя мера сохранена без пересчёта, что соответствует характеру храмовых измерений.
- source_word: וְאֵילוֹ
  choice: а его боковые столбы
  rationale: אֵיל в данном архитектурном контексте обозначает боковые вертикальные элементы ворот; точное устройство остаётся не вполне ясным, поэтому варианты указаны в примечании.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: два локтя
  rationale: Прямое обозначение размера предшествующего архитектурного элемента.
- source_word: מֵהַבָּיִת
  choice: был обращён к храму
  rationale: בַּיִת в контексте видения означает храмовое здание, а вся фраза указывает на ориентацию притвора в его сторону.
