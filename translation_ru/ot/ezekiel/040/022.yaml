base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/022.yaml
  text: Its windows[a], its porch, and its palm-tree decorations had the same measurements as the gate that faced east. People would go up to it by seven steps[c][b], and its porch was in front of them.
translation:
  language: ru
  text: Его окна, притвор[a] и пальмовые украшения[b] имели те же размеры, что и ворота, обращённые на восток. К ним поднимались[c] по семи ступеням, а их притвор находился перед ними[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестибюль», «портик»; здесь и далее так передан архитектурный термин, обозначающий входную пристройку или помещение перед входом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его пальмы»; в данном архитектурном контексте, вероятно, имеются в виду резные изображения или орнаменты в виде пальм.'
    reason: cultural_note
  - marker: c
    text: 'В еврейском тексте употреблён глагол во множественном числе — буквально: «поднимались»; вероятно, это неопределённо-личное выражение: «люди поднимались» или «поднимались».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «перед ними». К кому или к чему относится местоимение, из сжатой еврейской конструкции не вполне ясно; возможны идущие к воротам люди либо упомянутые ступени.'
    reason: ambiguity
lexical_decisions:
- source_word: וְחַלּוֹנוֹ
  choice: его окна
  rationale: חַלּוֹן обозначает окно или оконный проём; форма с суффиксом здесь естественно передаётся собирательным множественным числом.
- source_word: וְאֵלַמּוֹ / וְאֵילַמּוֹ
  choice: его притвор
  rationale: Архитектурный термин אֵילָם/אוּלָם обозначает входную пристройку или помещение перед входом. «Притвор» сохраняет храмовый контекст и остаётся понятным в современном русском.
- source_word: וְתִמָּרוֹ
  choice: пальмовые украшения
  rationale: В описании архитектуры תִּמָּרָה, вероятнее всего, указывает на изображения или орнаменты в виде пальм, а не на живые деревья.
- source_word: כְּמִדַּת
  choice: имели те же размеры, что и
  rationale: Сочетание сравнительного כְּ с מִדָּה выражает соответствие размеров; русская формулировка ясно передаёт это сравнение.
- source_word: הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: ворота, обращённые на восток
  rationale: Оборот с פָּנִים и דֶּרֶךְ описывает пространственную ориентацию ворот.
- source_word: וּבְמַעֲלוֹת שֶׁבַע יַעֲלוּ בוֹ
  choice: к нему поднимались по семи ступеням
  rationale: Предлог ב при «ступенях» указывает на путь или средство подъёма. Русская неопределённо-личная форма естественно передаёт обобщённое множественное יַעֲלוּ.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Перевод сохраняет буквальное пространственное значение и неоднозначность местоименного соотнесения в сжатой еврейской конструкции.
