  yaml_path: translation/ot/ezekiel/040/012.yaml
  text: And there was a barrier of one cubit in front of the side rooms[a], and a barrier of one cubit on the other side[b]; and each side room was six cubits on this side and six cubits on that side.
translation:
  language: ru
  text: Перед боковыми комнатами была ограничительная полоса шириной в один локоть; и с другой стороны — такая же полоса шириной в один локоть[b]. Каждая боковая комната имела по шесть локтей с одной стороны и с другой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «караульные помещения», «камеры» либо «ниши» (евр. תָּאוֹת) — небольшие помещения в конструкции ворот.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте повторяются пространственные указания, буквально «отсюда» или «с этой стороны»; в контексте они обозначают соответствующие противоположные стороны конструкции.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּל
  choice: выступ
  rationale: В архитектурном контексте обозначает ограничивающую полосу или выступ перед комнатами. «Выступ» передаёт конкретную часть сооружения, не сводя её непременно к стене или ограде.
- source_word: לִפְנֵי
  choice: перед
  rationale: Пространственное значение естественно передаётся русским «перед».
- source_word: הַתָּאוֹת / וְהַתָּא
  choice: боковые комнаты / каждая боковая комната
  rationale: תָּא обозначает небольшое помещение в составе ворот. «Боковая комната» понятно и не приписывает помещению специально караульную функцию; единственное число во второй части понято дистрибутивно.
- source_word: אַמָּה אֶחָת / שֵׁשׁ אַמּוֹת
  choice: один локоть / шесть локтей
  rationale: Сохранена древняя мера длины и размеренный, измерительный характер описания.
- source_word: מִפֹּה ... מִפּוֹ
  choice: с обеих сторон / с одной стороны ... с другой
  rationale: Повторные указательные выражения буквально означают «отсюда / с этой стороны» и указывают на противоположные стороны конструкции; русский текст естественно выражает эту пространственную симметрию.
