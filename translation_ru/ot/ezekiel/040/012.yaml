revisions:
- from: А перед боковыми комнатами[a] был выступ шириной в один локоть; по одному локтю выступа было с обеих сторон[b]. Каждая боковая комната была шесть локтей с одной стороны и шесть локтей с другой.
  to: Перед боковыми комнатами была ограничительная полоса шириной в один локоть; и с другой стороны — такая же полоса шириной в один локоть[b]. Каждая боковая комната имела по шесть локтей с одной стороны и с другой.[a]
  rationale: Заменены чрезмерно конкретное «выступ» и неестественная конструкция с размером комнаты. Перевод сохраняет архитектурную неопределённость גְּבוּל, двустороннюю схему измерений и дистрибутивное значение единственного числа תָּא. Сноски отредактированы для точного отражения еврейской лексики и контекста.
  reviewer_model: gpt-5.6-terra
