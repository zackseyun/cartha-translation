  yaml_path: translation/ot/ezekiel/040/023.yaml
  text: And a gate to the inner court was opposite the gate on the north and on the east[a]; and he measured from gate to gate one hundred cubits.
translation:
  language: ru
  text: 'Ворота во внутренний двор были напротив ворот, расположенных с северной и восточной сторон[a]. И он измерил от ворот до ворот: сто локтей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были обращены к воротам с северной и восточной сторон».'
    reason: Лексема נֶגֶד может обозначать положение напротив, а также направленность к чему-либо.
lexical_decisions:
- source_word: שַׁעַר
  choice: ворота
  rationale: В описании храмового комплекса существительное обозначает архитектурные ворота; русское множественное «ворота» естественно передаёт это значение.
- source_word: חָצֵר הַפְּנִימִי
  choice: внутренний двор
  rationale: Сочетание обозначает внутреннее ограждённое пространство храмового комплекса; «внутренний двор» — ясный и устойчивый русский эквивалент.
- source_word: נֶגֶד
  choice: напротив
  rationale: Предлог выражает пространственное соответствие ворот, расположенных друг против друга. В сноске сохранён возможный оттенок «обращены к».
- source_word: לַצָּפוֹן וְלַקָּדִים
  choice: с северной и восточной сторон
  rationale: Направления указывают на расположение соответствующих ворот; такая формулировка естественна по-русски и не создаёт впечатления движения на север или восток.
- source_word: וַיָּמָד
  choice: он измерил
  rationale: Форма глагола продолжает последовательность действий; подразумеваемый субъект — муж, производящий измерения в видении.
- source_word: מִשַּׁעַר אֶל שַׁעַר
  choice: от одних ворот до других
  rationale: Из-за того что русское «ворота» имеет только форму множественного числа, эта конструкция ясно передаёт расстояние между двумя отдельными воротами.
- source_word: מֵאָה אַמָּה
  choice: сто локтей
  rationale: Сохранена древняя единица длины исходного текста без приблизительного пересчёта в современные меры.
