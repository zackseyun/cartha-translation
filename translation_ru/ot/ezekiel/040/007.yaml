  text: And each guardroom was one reed long and one reed wide[a], and between the guardrooms was five cubits[c][b]. And the threshold of the gate beside the portico of the gate on the inside was one reed.
translation:
  language: ru
  text: Каждая комната[a] была длиной в одну трость и шириной в одну трость, а между комнатами было пять локтей. Порог ворот возле притвора[b] ворот, с внутренней стороны[c], был в одну трость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «боковое помещение», «караульное помещение» или «ниша». Еврейское תָּא — архитектурный термин для помещений в составе ворот; их назначение здесь прямо не указано.
    reason: lexical_alternative
  - marker: b
    text: Или «вестибюль» или «портик».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «со стороны дома». Вероятно, имеется в виду внутренняя сторона комплекса ворот, обращённая к храму.'
    reason: cultural_note
lexical_decisions:
- source_word: הַתָּא
  choice: боковая комната
  rationale: Архитектурный термин обозначает небольшое помещение в составе ворот. Нейтральное «боковая комната» не приписывает ему определённую функцию, которой еврейский текст прямо не называет.
- source_word: קָנֶה אֶחָד
  choice: одна трость
  rationale: В данном контексте קָנֶה — установленная ранее единица измерения; «трость» сохраняет образ и терминологию видения.
- source_word: אֹרֶךְ / רֹחַב
  choice: длиной / шириной
  rationale: Так естественно и параллельно передаются два размера помещения в современном русском языке.
- source_word: בֵּין הַתָּאִים
  choice: между боковыми комнатами
  rationale: Сохраняется единообразный перевод תָּא во множественном числе.
- source_word: חָמֵשׁ אַמּוֹת
  choice: пять локтей
  rationale: אַמָּה — обычная библейская мера длины; добавлять отсутствующее в оригинале слово «расстояния» нет необходимости.
- source_word: סַף הַשַּׁעַר
  choice: порог ворот
  rationale: סַף в архитектурном описании означает порог входа; הַשַּׁעַר здесь относится к комплексу ворот.
- source_word: מֵאֵצֶל
  choice: возле
  rationale: Предлог выражает пространственную близость и естественно передаётся словом «возле».
- source_word: אוּלָם הַשַּׁעַר
  choice: притвор ворот
  rationale: אוּלָם обозначает входное крытое пространство — притвор, вестибюль или портик; «притвор» краток и уместен в описании храмовой архитектуры.
- source_word: מֵהַבַּיִת
  choice: с внутренней стороны
  rationale: Буквально выражение связано со словом «дом», но в пространственном контексте, вероятно, указывает на сторону, обращённую к внутренней части храмового комплекса. Неоднозначность отмечена в сноске.
