revisions:
- from: Каждая боковая комната[a] была в одну трость длиной и в одну трость шириной, а между боковыми комнатами было пять локтей. Порог ворот возле притвора[b] ворот, с внутренней стороны[c], был в одну трость.
  to: Каждая комната[a] была длиной в одну трость и шириной в одну трость, а между комнатами было пять локтей. Порог ворот возле притвора[b] ворот, с внутренней стороны[c], был в одну трость.
  rationale: Убрана не выраженная прямо в еврейском тексте характеристика «боковая», чтобы не приписывать помещениям конкретное расположение или функцию. Порядок слов при обозначении размеров приведён к более естественной современной русской норме. Сноски и их привязки сохранены; примечание к «с внутренней стороны» по-прежнему отражает буквальную форму и вероятное пространственное значение מֵהַבַּיִת.
