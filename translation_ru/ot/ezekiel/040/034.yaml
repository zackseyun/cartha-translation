  text: ו/אלמ/ו לֶֽ/חָצֵר֙ הַ/חִ֣יצוֹנָ֔ה וְ/תִמֹרִ֥ים אֶל אל/ו מִ/פּ֣וֹ וּ/מִ/פּ֑וֹ וּ/שְׁמֹנֶ֥ה מַעֲל֖וֹת מעל/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/034.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: ru
  text: Его притвор был обращён во внешний двор, а на его косяках[a] с той и другой стороны были пальмы[b]; к нему вели восемь ступеней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на его боковых столбах».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть, вероятно, резные изображения пальм или пальмовый орнамент; буквально: «пальмы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַמּוֹ
  choice: Его притвор
  rationale: אֵלָם в описании храмовых ворот обозначает переднюю пристройку — притвор или портик. «Притвор» естественно звучит по-русски в храмовом архитектурном контексте; начальный союз не выражен отдельно ради плавности фразы.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: был обращён во внешний двор
  rationale: Предлог ל здесь передаёт пространственную направленность. Такая формулировка ясно и естественно выражает ориентацию притвора.
- source_word: וְתִמֹרִים
  choice: а … были пальмы
  rationale: תִמֹרִים буквально означает «пальмы». В архитектурном контексте, вероятно, имеются в виду резные изображения или орнаменты, однако основной текст сохраняет буквальную форму, а уточнение вынесено в сноску.
- source_word: אֶל־אֵילָיו
  choice: на его косяках
  rationale: В повторяющихся описаниях ворот אֵילָיו обозначает боковые конструктивные элементы проёма. «Косяки» — краткий и понятный архитектурный эквивалент.
- source_word: מִפֹּה וּמִפֹּה
  choice: с той и другой стороны
  rationale: Еврейское выражение указывает на симметричное расположение по обеим сторонам и сохраняет распределительный оттенок исходного текста.
- source_word: וּשְׁמֹנֶה מַעֲלוֹת מַעֲלוֹ
  choice: к нему вели восемь ступеней
  rationale: מַעֲלוֹת обозначает ступени подъёма, а מַעֲלוֹ — относящийся к сооружению подъём. Русская конструкция естественно передаёт функцию ступеней без излишней буквальности.
