base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/041.yaml
  text: Four tables on this side and four tables on that side[a], by the side of the gate—eight tables[c][b]; on them they slaughtered.
translation:
  language: ru
  text: Четыре стола с этой стороны и четыре стола с той стороны[a], у боковой части ворот — всего восемь столов; на них закалывали[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с одной стороны и с другой стороны».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будут закалывать». Еврейская форма может обозначать как будущее действие, так и обычное либо предусмотренное назначением действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה ... שְׁמוֹנָה
  choice: четыре ... восемь
  rationale: Точно переданы количества двух групп столов и их итоговое число.
- source_word: שֻׁלְחָנוֹת
  choice: стола / столов
  rationale: Существительное означает обычные «столы»; их назначение раскрывает последующая фраза, поэтому оно не добавлено в само название.
- source_word: מִפֹּה ... מִפֹּה
  choice: с этой стороны ... с той стороны
  rationale: Парные указательные выражения обозначают две противоположные стороны; русский оборот сохраняет пространственное противопоставление.
- source_word: לְכֶתֶף הַשָּׁעַר
  choice: по бокам ворот
  rationale: Буквально «у плеча ворот»; в архитектурном контексте כָּתֵף означает боковую часть. Множественное «по бокам» естественно соотносит две группы столов с двумя сторонами ворот.
- source_word: אֲלֵיהֶם
  choice: на них
  rationale: Предлог с местоименным суффиксом указывает на столы как место или поверхность, где совершалось заклание.
- source_word: יִשְׁחָטוּ
  choice: закалывали
  rationale: Русский несовершенный вид естественно выражает повторяющееся или установленное назначение в описании видения, не сводя форму ни к единичному прошлому действию, ни исключительно к будущему.
theological_decisions:
- issue: Временное и аспектуальное значение יִשְׁחָטוּ
  choice: закалывали
  alternative: будут закалывать
  rationale: Еврейский имперфект допускает значение будущего либо обычного/предназначенного действия. Основной текст передаёт функционально-повторительный смысл, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным синтаксисом. «Закалывали» сохраняет культовый смысл глагола, не добавляя в основной текст предмет жертвоприношения, которого в данном стихе прямо нет.
