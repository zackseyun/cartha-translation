- from: И вот, снаружи дома со всех сторон была стена. В руке у того человека была мерная трость длиной в шесть локтей, причём каждый локоть равнялся локтю с ладонью[a]. Он измерил ширину сооружения[b] — одна трость, и высоту — одна трость.
  to: И вот, снаружи дома со всех сторон была стена. В руке у того человека была мерная трость длиной в шесть локтей, каждый из которых равнялся обычному локтю плюс ладонь[a]. Он измерил ширину сооружения[b] — одна трость, и высоту — одна трость.
  rationale: Скорректирована только формулировка, поясняющая мерный стандарт, чтобы прямо и естественно передать значение «локоть и ладонь» как увеличенного локтя. Содержание, архитектурная терминология и оба примечания сохранены; примечание a приведено в соответствие с уточнённым переводом.
