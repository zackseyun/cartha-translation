  source_fidelity: 'Передача основных элементов точна: внешняя стена вокруг дома, мерная трость в руке человека, длина в шесть локтей и размеры сооружения — по одной трости в ширину и высоту. Однако формулировка «каждый локоть равнялся локтю с ладонью» недостаточно ясно выражает, что принят увеличенный локоть, то есть обычный локоть плюс ладонь.'
