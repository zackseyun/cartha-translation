  text: וְ/הִנֵּ֥ה חוֹמָ֛ה מִ/ח֥וּץ לַ/בַּ֖יִת סָבִ֣יב סָבִ֑יב וּ/בְ/יַ֨ד הָ/אִ֜ישׁ קְנֵ֣ה הַ/מִּדָּ֗ה שֵׁשׁ אַמּ֤וֹת בָּֽ/אַמָּה֙ וָ/טֹ֔פַח וַ/יָּ֜מָד אֶת רֹ֤חַב הַ/בִּנְיָן֙ קָנֶ֣ה אֶחָ֔ד וְ/קוֹמָ֖ה קָנֶ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/005.yaml
  text: 'And behold[a], there was a wall outside the house, all around, and in the hand of the man was a measuring reed of six cubits, each cubit being a cubit and a handbreadth. And he measured the width of the structure: one reed[b], and the height: one reed.'
translation:
  language: ru
  text: И вот, снаружи дома со всех сторон была стена. В руке у того человека была мерная трость длиной в шесть локтей, каждый из которых равнялся обычному локтю плюс ладонь[a]. Он измерил ширину сооружения[b] — одна трость, и высоту — одна трость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шесть локтей, по локтю и ладони», то есть здесь использован увеличенный локоть: обычный локоть плюс ладонь.'
    reason: cultural_note
  - marker: b
    text: 'Или: «ширину постройки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательную силу еврейского выражения, вводящего новый объект видения, и естественно звучит в современном русском повествовании.
- source_word: חוֹמָה
  choice: стена
  rationale: Обычное и контекстуально достаточное обозначение массивной стены без неоправданного уточнения её оборонительной функции.
- source_word: מִחוּץ לַבַּיִת
  choice: снаружи дома
  rationale: Передаёт буквальное «вне дома»; слово «дом» сохраняет лексику исходного текста, не сужая значение до отдельного здания или всего храмового комплекса.
- source_word: סָבִיב סָבִיב
  choice: со всех сторон
  rationale: Идиоматично передаёт усиленное повтором значение полного окружения.
- source_word: וּבְיַד הָאִישׁ
  choice: В руке у того человека
  rationale: Сохраняет конкретный образ исходного текста, а указательное «того» связывает человека с ранее представленным проводником.
- source_word: קְנֵה הַמִּדָּה
  choice: мерная трость
  rationale: קָנֶה обозначает трость, здесь служащую измерительным орудием; традиционное русское сочетание точно и понятно в контексте.
- source_word: שֵׁשׁ אַמּוֹת
  choice: длиной в шесть локтей
  rationale: Ясно выражает длину трости и сохраняет древнюю единицу измерения без приблизительного пересчёта.
- source_word: בָּאַמָּה וָטֹפַח
  choice: каждый локоть равнялся локтю с ладонью
  rationale: 'Передаёт используемый здесь увеличенный локоть: обычный локоть плюс ладонь; примечание разъясняет сжатую еврейскую формулу.'
- source_word: וַיָּמָד
  choice: Он измерил
  rationale: Естественно передаёт последовательное повествовательное действие.
- source_word: רֹחַב הַבִּנְיָן
  choice: ширину сооружения
  rationale: רֹחַב означает поперечный размер, а בִּנְיָן — построенное сооружение; формулировка не отождествляет измеряемый объект с «домом» без достаточного основания.
- source_word: קָנֶה אֶחָד
  choice: одна трость
  rationale: Сохраняет только что введённую единицу измерения и подчёркнутое числительное «одна».
- source_word: וְקוֹמָה
  choice: и высоту
  rationale: Естественный архитектурный эквивалент вертикального размера.
