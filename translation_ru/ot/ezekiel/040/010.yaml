  text: וְ/תָאֵ֨י הַ/שַּׁ֜עַר דֶּ֣רֶךְ הַ/קָּדִ֗ים שְׁלֹשָׁ֤ה מִ/פֹּה֙ וּ/שְׁלֹשָׁ֣ה מִ/פֹּ֔ה מִדָּ֥ה אַחַ֖ת לִ/שְׁלָשְׁתָּ֑/ם וּ/מִדָּ֥ה אַחַ֛ת לָ/אֵילִ֖ם מִ/פֹּ֥ה וּ/מִ/פּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/010.yaml
  text: And the guardrooms of the gate facing east were three on this side and three on that side[a]; the three of them had one measure[b], and the side pillars had one measure on this side and on that side.
translation:
  language: ru
  text: В воротах, обращённых на восток, было по три боковые комнаты с каждой стороны[a]. Все три комнаты были одинакового размера, и боковые столбы с обеих сторон также были одинакового размера[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «караульные помещения»; еврейское слово обозначает небольшие комнаты, встроенные в сооружение ворот, но само по себе не определяет их назначение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «устои», «пилястры»; точное значение этого архитектурного термина в видении Иезекииля остаётся спорным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָאֵי
  choice: боковые комнаты
  rationale: Термин обозначает небольшие помещения, встроенные в сооружение ворот. Нейтральное «боковые комнаты» передаёт архитектурный смысл, не утверждая их предполагаемую функцию как караульных.
- source_word: הַשַּׁעַר דֶּרֶךְ הַקָּדִים
  choice: в воротах, обращённых на восток
  rationale: Фраза указывает на восточную ориентацию ворот; перевод естественно передаёт направление, не превращая его без необходимости в название «восточные ворота».
- source_word: שְׁלֹשָׁה מִפֹּה וּשְׁלֹשָׁה מִפֹּה
  choice: по три ... с каждой стороны
  rationale: Так кратко и ясно выражено симметричное расположение трёх помещений по обеим сторонам прохода.
- source_word: מִדָּה אַחַת לִשְׁלָשְׁתָּם
  choice: все три комнаты были одинакового размера
  rationale: Передаёт мысль об одинаковых размерах трёх помещений естественным современным русским языком.
- source_word: אֵילִם
  choice: боковые столбы
  rationale: В описании храмовых ворот слово обозначает вертикальные архитектурные элементы, однако точная их форма спорна. «Боковые столбы» понятно широкому читателю и не вводит излишне специального толкования.
- source_word: מִדָּה אַחַת לָאֵילִם מִפֹּה וּמִפּוֹ
  choice: боковые столбы с обеих сторон также были одинакового размера
  rationale: Перевод сохраняет параллелизм с размерами комнат и ясно указывает на равенство соответствующих элементов по обеим сторонам.
