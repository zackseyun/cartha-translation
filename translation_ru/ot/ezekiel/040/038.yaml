  text: There was a chamber with its doorway by the gateposts of the gates[a]; there they would rinse the burnt offering.
translation:
  language: ru
  text: Была комната, вход в которую находился у устоев ворот[a]; там омывали жертву всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский архитектурный термин, переведённый как «устои ворот», может также обозначать притворы, выступающие столбы или сходные элементы воротного комплекса.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁכָּה
  choice: комната
  rationale: Обозначает отдельное помещение в составе храмового или воротного комплекса; «комната» естественно и ясно звучит по-русски.
- source_word: וּפִתְחָהּ
  choice: вход в которую
  rationale: Передаёт вход или проём комнаты с притяжательным суффиксом и естественно связывает его с предшествующим существительным.
- source_word: בְּאֵילִים
  choice: у воротных устоев
  rationale: Технический архитектурный термин в описании храма; «устои» достаточно широко передают несущие или выступающие элементы ворот, а неопределённость конкретного значения сохранена в примечании.
- source_word: הַשְּׁעָרִים
  choice: воротных
  rationale: Передаёт принадлежность архитектурных элементов воротам; грамматическое множественное число в русском сочетании явно не выражено, но значение воротного комплекса сохраняется.
- source_word: שָׁם
  choice: в ней
  rationale: Местоименное наречие указывает на только что названную комнату; контекстуальная замена делает русскую фразу яснее.
- source_word: יָדִיחוּ
  choice: омывали
  rationale: Hiphil глагола דוח здесь означает ритуальное обмывание или ополаскивание; несовершенный вид передаёт обычное действие.
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: Устоявшееся русское библейское обозначение жертвы, целиком сжигаемой на жертвеннике.
