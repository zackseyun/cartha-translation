  text: 'Then he measured the vestibule of the gate on the inside: one rod[a][b].'
translation:
  language: ru
  text: 'Затем он измерил притвор ворот со стороны храма: в одну мерную трость[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один мерный шест». Еврейское слово обозначает трость, использовавшуюся для измерения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от дома». В храмовом видении Иезекииля «домом» часто назван храм; точный пространственный смысл предлога здесь неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Затем он измерил
  rationale: Форма wayyiqtol последовательно развивает повествование; «затем» естественно передаёт переход к следующему измерению.
- source_word: אֻלָם הַשַּׁעַר
  choice: притвор ворот
  rationale: אֻלָם обозначает крытое входное пространство; «притвор» точно и уместно передаёт архитектурный термин в храмовом контексте.
- source_word: מֵהַבַּיִת
  choice: со стороны храма
  rationale: В храмовом видении בַּיִת обычно означает храм, а מִן здесь, вероятно, указывает на пространственную ориентацию. Перевод сохраняет эту ориентацию, не сводя трудное выражение однозначно к значению «внутри».
- source_word: קָנֶה אֶחָד
  choice: одна трость
  rationale: קָנֶה буквально означает трость и здесь называет мерную трость. Выбор сохраняет образ исходного текста, а функция поясняется в сноске.
