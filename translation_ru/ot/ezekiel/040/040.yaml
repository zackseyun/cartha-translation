base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/040.yaml
  text: And on the outer side[a], by the ascent to the entrance of the north gate, were two tables; and on the other side, which belonged to the porch of the gate[c][b], were two tables.
translation:
  language: ru
  text: С внешней стороны[a], там, где поднимаются[b] ко входу в северные ворота, стояли два стола; и с другой стороны, у притвора ворот[c], — два стола.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на плече снаружи»; в архитектурном описании «плечо» означает боковую сторону или боковой участок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для поднимающегося»; возможно также: «у подъёма ко входу».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «со стороны, относящейся к притвору ворот». Предлог допускает как пространственную связь («у»), так и более общую связь с притвором.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתֵף
  choice: сторона
  rationale: Буквально «плечо»; в архитектурном описании обозначает боковую сторону или боковой участок. «Сторона» естественно звучит по-русски и ясно передаёт пространственный смысл.
- source_word: מִחוּצָה
  choice: с внешней стороны
  rationale: Обозначает нахождение снаружи; выбранная формулировка естественно сочетается с архитектурным значением כָּתֵף.
- source_word: לָעוֹלֶה
  choice: там, где поднимаются
  rationale: Субстантивированное причастие от עלה буквально указывает на поднимающегося; безличная русская конструкция передаёт место подъёма, не уточняя без достаточных оснований, были ли там ступени или иной подъём.
- source_word: פֶּתַח
  choice: вход
  rationale: Обычное и ясное обозначение входного проёма в данном архитектурном контексте.
- source_word: שַׁעַר
  choice: ворота
  rationale: Стандартный русский эквивалент в описании храмового комплекса; множественное число в русском обозначает единое сооружение.
- source_word: הַצָּפוֹנָה
  choice: северные
  rationale: Передаёт направление ворот естественной русской конструкцией «северные ворота».
- source_word: שְׁנַיִם שֻׁלְחָנוֹת
  choice: два стола
  rationale: Прямое соответствие числительному и существительному в контексте столов для приготовления жертв.
- source_word: הָאַחֶרֶת
  choice: другая сторона
  rationale: Указывает на соответствующую противоположную или иную боковую сторону.
- source_word: אֲשֶׁר לְאֻלָם הַשַּׁעַר
  choice: у притвора ворот
  rationale: Предлог לְ выражает пространственную или ассоциативную связь с притвором; «у притвора ворот» кратко и естественно передаёт эту связь, не утверждая принадлежность как единственно возможный смысл.
- source_word: אֻלָם
  choice: притвор
  rationale: Доступный и уместный в храмовой архитектуре русский термин для переднего помещения или крытой входной части.
