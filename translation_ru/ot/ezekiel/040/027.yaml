  yaml_path: translation/ot/ezekiel/040/027.yaml
  text: 'And there was a gate to the inner court toward the south[a], and he measured from gate to gate toward the south: one hundred cubits.'
translation:
  language: ru
  text: И были ворота во внутренний двор с южной стороны, и он измерил расстояние от ворот до ворот в южном направлении — сто локтей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׁעַר
  choice: И были ворота
  rationale: В еврейском тексте именная конструкция без явной связки; русское «были» естественно передаёт наличие ворот, а множественное число соответствует обычному русскому обозначению архитектурных ворот.
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: во внутренний двор
  rationale: 'Предлог ל выражает здесь отношение и доступ: ворота ведут во внутренний двор.'
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: с южной стороны
  rationale: В первом употреблении оборот определяет расположение ворот; буквальное «путём юга» по-русски неестественно.
- source_word: וַיָּמָד
  choice: и он измерил
  rationale: Сохранено последовательное повествование; субъект — проводник с измерительной тростью из контекста.
- source_word: מִשַּׁעַר אֶל הַשַּׁעַר
  choice: расстояние от ворот до ворот
  rationale: Добавление «расстояние» естественно для русского языка и явно передаёт объект измерения, подразумеваемый еврейской конструкцией.
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: в южном направлении
  rationale: Во втором употреблении оборот указывает направление линии измерения, поэтому сохранён его направительный оттенок.
- source_word: מֵאָה אַמּוֹת
  choice: сто локтей
  rationale: Древняя единица измерения сохранена без приблизительного пересчёта.
