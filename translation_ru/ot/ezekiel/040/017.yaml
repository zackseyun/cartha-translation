revisions:
- from: Затем он привёл меня во внешний двор. И вот, там были комнаты и вымощенная площадка, устроенная во дворе кругом, со всех сторон; на площадке находилось тридцать комнат[a].
  to: Затем он привёл меня во внешний двор. И вот, там были помещения, а вокруг двора со всех сторон была устроена мощёная площадка; у этой площадки располагалось тридцать помещений[a].
  rationale: Исправлено чрезмерно определённое «на площадке» на нейтральное «у этой площадки», а альтернативные понимания отношения, выраженного אֶל, сохранены в сноске. Пространственное описание мощёной площадки перестроено так, чтобы ясно передать её расположение вокруг внешнего двора. Смысл и архитектурная неопределённость исходного текста сохранены.
