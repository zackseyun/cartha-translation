  yaml_path: translation/ot/ezekiel/040/017.yaml
  text: Then he brought me into the outer court[a], and behold, there were chambers and a pavement made for the court all around, all around; thirty chambers were on the pavement.
translation:
  language: ru
  text: Затем он привёл меня во внешний двор. И вот, там были помещения, а вокруг двора со всех сторон была устроена мощёная площадка; у этой площадки располагалось тридцать помещений[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тридцать помещений были при мощёной площадке», «вдоль мощёной площадки» или «выходили к мощёной площадке». Буквально по-еврейски: «тридцать помещений — к мощёной площадке»; выражение указывает на их отношение к мощёному пространству.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Затем он привёл меня
  rationale: Форма wayyiqtol продолжает последовательность повествования; «затем» естественно передаёт движение видения вперёд, а каузативное значение בוא — действие проводника.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: во внешний двор
  rationale: חָצֵר в описании храмового комплекса означает двор; «внешний двор» — точный и привычный архитектурный термин.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: הִנֵּה направляет внимание на увиденное; «и вот» сохраняет эту наглядность и уместно в современном литературном русском.
- source_word: לְשָׁכוֹת
  choice: комнаты
  rationale: לִשְׁכָּה обозначает помещения при храмовом дворе. «Комнаты» понятно современному читателю и не привносит лишнего представления о назначении помещений.
- source_word: וְרִצְפָה
  choice: и вымощенная площадка
  rationale: רִצְפָה — мощёная поверхность или настил. «Вымощенная площадка» яснее русского «мостовая» передаёт архитектурную площадь внутри двора.
- source_word: עָשׂוּי לֶחָצֵר
  choice: устроенная во дворе
  rationale: Пассивное причастие עָשׂוּי указывает на сооружённую или устроенную поверхность; לֶחָצֵר здесь естественно выражает её принадлежность пространству двора. Женский род в русском согласован с «площадка».
- source_word: סָבִיב סָבִיב
  choice: кругом, со всех сторон
  rationale: Сочетание сохраняет усиленное пространственное значение повторённого סָבִיב, не воспроизводя механически неестественное по-русски «кругом кругом».
- source_word: שְׁלֹשִׁים לְשָׁכוֹת
  choice: тридцать комнат
  rationale: Прямая передача числительного и существительного с сохранением выбранного обозначения храмовых помещений.
- source_word: אֶל הָרִצְפָה
  choice: на площадке находилось
  rationale: Предлог אֶל в данном архитектурном контексте выражает пространственное отношение комнат к мощёной поверхности. Основной текст передаёт вероятное расположение, а сноска сохраняет возможные отношения примыкания или ориентации.
