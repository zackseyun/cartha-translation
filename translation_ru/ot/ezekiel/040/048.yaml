base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/048.yaml
  text: 'Then he brought me to the vestibule of the house[a], and he measured the jambs of the vestibule: five cubits on this side and five cubits on that side[c][b]; and the width of the gate was three cubits on this side and three cubits on that side.'
translation:
  language: ru
  text: 'Затем он привёл меня к притвору дома[a] и измерил боковые опоры[b] притвора: пять локтей с одной стороны и пять локтей с другой; а ширина ворот[c] — три локтя с одной стороны и три локтя с другой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дома»; в этом видении имеется в виду здание храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Редкое еврейское архитектурное слово; возможны также переводы: «столбы», «косяки», «боковые выступы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «входа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֻלָם
  choice: притвор
  rationale: В храмовой архитектуре слово обозначает входное помещение перед основной частью здания. «Притвор» точно передаёт функцию пространства и естественно звучит в русском архитектурно-библейском контексте.
- source_word: הַבַּיִת
  choice: Дом
  rationale: Буквально — «дом»; в данном видении имеется в виду храмовое здание. Сохранение слова «Дом» передаёт формулировку источника и её возможный богословский оттенок, а прописная буква помогает читателю распознать особое обозначение храма.
- source_word: אֵל אֻלָם
  choice: боковые устои притвора
  rationale: אֵל здесь — редкий архитектурный термин, обозначающий боковые опоры или выступы у входа, а не обычное слово «Бог». «Боковые устои» согласуются с парными замерами по обеим сторонам и не создают ложного впечатления, будто речь непременно идёт о дверных косяках.
- source_word: חָמֵשׁ אַמּוֹת ... מִפֹּה וְחָמֵשׁ אַמּוֹת מִפֹּה
  choice: пять локтей с одной стороны и пять локтей с другой
  rationale: Указательные выражения отмечают две соответствующие стороны входа; выбранная формулировка естественна по-русски и сохраняет симметрию еврейского текста.
- source_word: רֹחַב הַשַּׁעַר
  choice: ширина ворот
  rationale: שַׁעַר обычно означает «ворота» или «вход». Формальное «ворот» сохраняет основной смысл исходного слова, хотя в данном внутреннем архитектурном контексте возможен перевод «входа».
- source_word: שָׁלֹשׁ אַמּוֹת מִפּוֹ וְשָׁלֹשׁ אַמּוֹת מִפּוֹ
  choice: три локтя с одной стороны и три локтя с другой
  rationale: Повторяющаяся указательная конструкция обозначает две стороны; русский перевод ясно воспроизводит её параллелизм.
- source_word: וַיְבִאֵנִי ... וַיָּמָד
  choice: Затем он привёл меня ... и измерил
  rationale: Последовательность форм с вау продвигает рассказ видения. «Затем» естественно выражает переход к следующему действию, а общий субъект остаётся ясным.
theological_decisions:
- issue: Обозначение храмового здания словом הַבַּיִת
  choice: Дом
  alternative: храм
  rationale: Исходный текст буквально говорит «Дом», хотя контекст однозначно указывает на храмовое здание. Сохранена исходная метафорика без сведения её к более однозначному «храм»; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, соответствующим описанию храма регистром. Синтаксис упрощён до двух предложений для ясности, при этом симметрия парных измерений и архитектурная неопределённость редкого термина сохранены.
