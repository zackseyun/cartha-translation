  yaml_path: translation/ot/ezekiel/040/016.yaml
  text: And there were recessed windows toward the guardrooms and toward their side pillars[a], inward, all around the gate; and likewise for the porticos. And windows were all around on the inside[c][b], and on each pillar were palm-tree decorations.
translation:
  language: ru
  text: В караульных помещениях и в их боковых столбах были окна с углублёнными рамами[a], обращённые внутрь и расположенные по всему периметру ворот; такие же окна были и в притворах[b]. Окна располагались по всему внутреннему периметру, и на каждом столбе[c] были пальмовые украшения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «закрытые окна», «узкие окна» или «окна с углублёнными рамами». Еврейское определение, вероятно, обозначает особую архитектурную форму, а не окна, совершенно не пропускавшие свет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вестибюлях» или «портиках».'
    reason: lexical_alternative
  - marker: c
    text: Еврейские названия элементов ворот, переданные здесь как «боковые столбы» и «столб», имеют не вполне ясное архитектурное значение; возможны также переводы «косяки» или «пилястры».
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלֹּנוֹת אֲטֻמוֹת
  choice: окна с нишами
  rationale: Существительное обычно означает «окна», а прилагательное, вероятно, указывает на особую углублённую или суженную архитектурную форму. «Окна с нишами» передаёт это без ошибочного впечатления, будто окна были полностью заложены.
- source_word: הַתָּאִים
  choice: караульные комнаты
  rationale: В описании ворот Иезекииля это помещения при воротах, вероятно предназначенные для стражи; такой перевод конкретнее общего «комнаты».
- source_word: אֵלֵיהֶמָה
  choice: их боковые столбы
  rationale: Трудный архитектурный термин обозначает боковые несущие или обрамляющие элементы ворот; возможны также «косяки» и «пилястры».
- source_word: לִפְנִימָה
  choice: обращённые внутрь / по внутреннему периметру
  rationale: Наречие указывает на внутреннюю ориентацию; разные русские формулировки обусловлены синтаксисом двух употреблений.
- source_word: סָבִיב סָבִיב
  choice: по всему периметру
  rationale: Удвоение подчёркивает расположение со всех сторон; русский оборот естественно передаёт этот пространственный смысл.
- source_word: אֵלַמּוֹת
  choice: притворы
  rationale: Термин обозначает входные крытые части сооружения; «притворы» — понятный и уместный в храмовой архитектуре русский эквивалент.
- source_word: אַיִל
  choice: каждый столб
  rationale: Единственное число, вероятно, имеет распределительное значение. «Столб» сохраняет связь с тем же трудным архитектурным термином в первой части стиха.
- source_word: תִּמֹרִים
  choice: изображения пальм
  rationale: В архитектурном контексте речь идёт не о живых деревьях, а о декоративных пальмовых мотивах.
