base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/039.yaml
  text: And in the portico of the gate were two tables on this side and two tables on that side[a], on which they slaughtered the burnt offering, the sin offering[b], and the guilt offering.
translation:
  language: ru
  text: А в притворе ворот стояли два стола с одной стороны и два стола с другой[a]; на них закалывали жертву всесожжения, жертву за грех[b] и жертву повинности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «два стола отсюда и два стола отсюда»; то есть по обеим сторонам.'
    reason: Уточнение пространственного выражения.
  - marker: b
    text: 'Или: «очистительную жертву»; еврейское слово может обозначать жертву, связанную с очищением от греха или нечистоты.'
    reason: Лексическая альтернатива.
  - marker: c
    text: 'Или: «жертву возмещения».'
    reason: Лексическая альтернатива.
lexical_decisions:
- source_word: וּבְאֻלָם הַשַּׁעַר
  choice: А в притворе ворот
  rationale: אֻלָם обозначает переднее крытое пространство — притвор или портик. «Притвор» естественен для русского описания храмовой архитектуры; שַׁעַר здесь обозначает ворота как сооружение.
- source_word: שְׁנַיִם שֻׁלְחָנוֹת מִפּוֹ וּשְׁנַיִם שֻׁלְחָנוֹת מִפֹּה
  choice: два стола с одной стороны и два стола с другой
  rationale: Передаёт симметричное расположение столов, выраженное пространственной парой מִפּוֹ ... מִפֹּה, естественным современным русским языком.
- source_word: לִשְׁחֹט אֲלֵיהֶם
  choice: на них закалывали
  rationale: שׁחט — обычный глагол ритуального заклания животных. Русское «закалывали» сохраняет жертвенный контекст, а אֲלֵיהֶם естественно передано как «на них».
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: Устоявшийся и точный русский термин для עֹלָה — жертвы, целиком сжигаемой на жертвеннике.
- source_word: הַחַטָּאת
  choice: жертву за грех
  rationale: В жертвенном перечне חַטָּאת традиционно обозначает жертву за грех, но слово также может подчёркивать очищение; эта смысловая возможность отмечена в сноске.
- source_word: הָאָשָׁם
  choice: жертву повинности
  rationale: אָשָׁם обозначает жертву, связанную с виной и возмещением. «Жертва повинности» — узнаваемый русский культовый термин; нюанс возмещения сохранён в сноске.
theological_decisions:
- issue: Передача категорий жертв без внесения позднейшего доктринального толкования
  choice: жертва всесожжения, жертва за грех и жертва повинности
  alternative: жертва всесожжения, очистительная жертва и жертва возмещения
  rationale: Основной текст использует общепринятые названия установленных жертвенных категорий. Возможные очистительный и возместительный оттенки חַטָּאת и אָשָׁם не устраняются, а приводятся в сносках.
translation_notes:
  register: Современный литературный русский с достоинством храмового описания. Синтаксис остаётся ясным и конкретным; терминология жертвоприношений традиционна, но не архаизирована сверх необходимости.
