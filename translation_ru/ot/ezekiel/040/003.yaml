base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/003.yaml
  text: He brought me there[a], and behold, there was a man whose appearance was like the appearance of bronze, with a linen cord in his hand and a measuring reed[c][b]; and he was standing in the gateway.
translation:
  language: ru
  text: Он привёл меня туда, и вот — человек, чей облик был подобен облику бронзы[a]. У него в руке были льняной шнур[b] и мерная трость, и он стоял в воротах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «бронза», может также означать «медь».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «льняная верёвка», «шнур из льна».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «у ворот». Еврейское слово может обозначать как ворота, так и всё сооружение или пространство ворот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: Он привёл меня туда
  rationale: Последовательная глагольная форма продолжает повествование; русское «Он привёл» естественно передаёт действие без обязательного союза. «Туда» обозначает движение к ранее указанному месту.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Формула вводит внезапно открывшуюся взору картину и сохраняет возвышенный пророческий регистр без архаизма.
- source_word: אִישׁ
  choice: человек
  rationale: Обычное значение еврейского существительного; текст не уточняет, ангел ли это или богоявленная фигура.
- source_word: מַרְאֵהוּ כְּמַרְאֵה נְחֹשֶׁת
  choice: обликом подобный бронзе
  rationale: Передаёт зрительное сходство и сохраняет достоинство стиля. נְחֹשֶׁת может означать медь или бронзу; «бронза» здесь естественна для описания металлического вида. Буквальный повтор слова «облик» вынесен в примечание как стилистически тяжёлый по-русски.
- source_word: פְּתִיל פִּשְׁתִּים
  choice: льняной шнур
  rationale: Обозначает шнур из льна; это ясное и естественное современное русское наименование измерительного приспособления.
- source_word: בְּיָדוֹ
  choice: В руке у него
  rationale: Сохраняет явно выраженное в еврейском тексте единственное число.
- source_word: קְנֵה הַמִּדָּה
  choice: мерная трость
  rationale: Речь идёт о трости, служащей мерой длины. «Мерная трость» точно передаёт предмет и соответствует архитектурному контексту.
- source_word: וְהוּא עֹמֵד
  choice: а сам он стоял
  rationale: Причастная форма рисует продолжающееся положение фигуры. Частица «сам» естественно возвращает внимание от предметов в его руке к человеку.
- source_word: בַּשָּׁעַר
  choice: в воротах
  rationale: שַׁעַר может обозначать ворота как сооружение или пространство прохода; «в воротах» сохраняет пространственное значение предлога ב и подходит к храмовой архитектуре.
theological_decisions:
- issue: Кем является увиденный «человек»
  choice: Оставлено простое обозначение «человек» без дальнейшего отождествления.
  alternative: Ангельский посланник или богоявленная фигура.
  rationale: Еврейский текст называет фигуру только «человеком» и описывает её облик и измерительные принадлежности; более точное отождествление было бы толкованием, а не переводом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сделан ясным для обычного читателя; сохранены зрительная выразительность «и вот», единственное число «в руке» и неопределённость относительно личности человека.
