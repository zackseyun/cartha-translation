  yaml_path: translation/ot/ezekiel/040/033.yaml
  text: And its guardrooms[a], its side pillars, and its portico were according to these measurements; and it and its side pillars had windows all around. Its length was fifty cubits[b], and its width twenty-five cubits.
translation:
  language: ru
  text: Его помещения для стражи, боковые опоры[a] и притвор[b] имели такие же размеры. Окна были и в нём, и в его притворе — со всех сторон. Его длина составляла пятьдесят локтей, а ширина — двадцать пять локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «боковые столбы», «косяки» или «пилястры». Значение этого древнееврейского архитектурного термина точно не установлено.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «преддверие» или «портик».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: помещения для стражи
  rationale: В описании ворот это небольшие комнаты при проходе. Такой перевод естественен по-русски и передаёт наиболее вероятную функцию, не используя узкотехнический термин.
- source_word: אַיִל
  choice: боковые опоры
  rationale: Здесь слово обозначает конструктивные элементы ворот; точный вид этих элементов неясен. «Боковые опоры» сохраняет архитектурный смысл и не сводит значение исключительно к косякам или пилястрам.
- source_word: אֵילָם
  choice: притвор
  rationale: В храмовой архитектуре слово обозначает входную пристройку или пространство перед основным сооружением. «Притвор» — понятный и уместный русский архитектурный термин.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: имели такие же размеры
  rationale: Фраза выражает соответствие ранее указанным размерам; русская формулировка передаёт это ясно и без ненужной буквальности.
- source_word: חַלּוֹנוֹת לוֹ וּלְאֵילַמּוֹ סָבִיב סָבִיב
  choice: Окна были и в нём, и в его притворе — со всех сторон
  rationale: Второе существительное в данной строке — «притвор», а не «боковые опоры». Повтор סָבִיב סָבִיב подчёркивает расположение окон со всех сторон.
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: Его длина составляла пятьдесят локтей, а ширина — двадцать пять локтей
  rationale: Размеры переданы прямой и естественной русской конструкцией с сохранением древней единицы измерения.
