lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Затем он привёл меня
  rationale: Форма глагола בוא в породе хифиль означает «привести». «Затем» естественно передаёт последовательность действий в повествовании.
- source_word: חָצֵר הַפְּנִימִי
  choice: внутренний двор
  rationale: Устойчивое и понятное обозначение внутреннего храмового двора в архитектурном описании видения.
- source_word: בְּשַׁעַר הַדָּרוֹם
  choice: через южные ворота
  rationale: Предлог ב здесь естественно понимать как указание на путь, которым вошли во внутренний двор. В русском языке это ясно передаётся предлогом «через».
- source_word: וַיָּמָד
  choice: и измерил
  rationale: Глагол מדד прямо означает «измерять»; явное упоминание измерения сохраняет повторяющийся мотив этого видения.
- source_word: אֶת הַשַּׁעַר הַדָּרוֹם
  choice: южные ворота
  rationale: Определённое словосочетание обозначает те же южные ворота, которые только что были упомянуты.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: они имели такие же размеры
  rationale: Сочетание כְּ с מִדּוֹת выражает соответствие уже приведённым размерам. Эта формулировка естественна по-русски и ясно передаёт совпадение размеров.
