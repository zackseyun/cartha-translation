  terminology: «Внутренние ворота», «внутренний двор» и «помещения певцов» соответствуют храмово-архитектурному регистру. «Сбоку от» адекватно передаёт архитектурное значение כֶּתֶף; буквальное значение слова указано в сносках. Никаких богословских терминов, требующих корректировки, нет.
