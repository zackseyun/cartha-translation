  source_fidelity: 'В целом пространственные отношения и направления переданы верно: помещения певцов находятся с внешней стороны внутренних ворот, во внутреннем дворе; одна группа/помещение связана с северными воротами и обращена к югу, другая — с восточными воротами и обращена к северу. Однако «у плеча ворот» не является понятным или естественным русским архитектурным выражением. Еврейское כֶּתֶף здесь метафорически означает боковую сторону; это следует передать в тексте, сохранив буквальное «плечо» в примечании. Сжатость и не вполне прозрачная группировка в еврейском синтаксисе должны быть отмечены, но не разрешены чрезмерно категорично.'
