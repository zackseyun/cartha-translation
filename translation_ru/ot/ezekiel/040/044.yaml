base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/044.yaml
  text: And outside the inner gate were chambers for singers in the inner court[a], which were beside the shoulder of the north gate, with their front toward the south; one was beside the shoulder of the east gate[c][b], facing toward the north.
translation:
  language: ru
  text: С внешней стороны внутренних ворот, во внутреннем дворе, находились помещения певцов[a]. Они располагались сбоку от северных ворот и были обращены на юг; одно помещение находилось сбоку от восточных ворот[b] и было обращено на север[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст называет их «помещениями певцов».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у плеча восточных ворот». Еврейское слово «плечо» метафорически обозначает боковую часть сооружения; то же слово употреблено и о северных воротах.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст этого стиха синтаксически сжат. Связи между отдельными помещениями или их группами можно понимать по-разному; ясно, однако, что они находились во внутреннем дворе возле северных и восточных ворот и были обращены соответственно на юг и на север.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִחוּצָה לַשַּׁעַר הַפְּנִימִי
  choice: С внешней стороны внутренних ворот
  rationale: Передаёт пространственное значение מִחוּצָה («снаружи, с внешней стороны») и сохраняет связь с «внутренними воротами» без добавления невыраженного направления движения.
- source_word: לִשְׁכוֹת שָׁרִים
  choice: помещения для певцов
  rationale: לִשְׁכוֹת обозначает храмовые комнаты или помещения, а שָׁרִים — поющих, певцов. Формулировка естественна для современного русского языка и сохраняет культово-архитектурный контекст.
- source_word: בֶּחָצֵר הַפְּנִימִי
  choice: во внутреннем дворе
  rationale: חָצֵר в описании храмового комплекса означает двор; «внутренний двор» — ясный и устойчивый архитектурный термин.
- source_word: אֶל כֶּתֶף שַׁעַר הַצָּפוֹן
  choice: у плеча северных ворот
  rationale: כֶּתֶף буквально означает «плечо» и здесь метафорически указывает на боковую часть сооружения. Необычный образ сохранён в основном тексте, а его значение пояснено в сноске.
- source_word: וּפְנֵיהֶם דֶּרֶךְ הַדָּרוֹם
  choice: были обращены на юг
  rationale: В архитектурном описании פָּנִים указывает на переднюю, обращённую в определённую сторону часть помещений. Русская формулировка передаёт ориентацию естественно и без излишней буквальности.
- source_word: אֶחָד
  choice: одно помещение
  rationale: Для ясности по-русски восстановлен подразумеваемый объект. При этом не уточняется, было ли это отдельное помещение или один комплекс помещений; синтаксическая неоднозначность отмечена в сноске.
- source_word: אֶל כֶּתֶף שַׁעַר הַקָּדִים
  choice: у плеча восточных ворот
  rationale: כֶּתֶף передано последовательно тем же архитектурным образом «плечо», а идиоматическое значение «боковая сторона» дано в сноске.
- source_word: פְּנֵי דֶּרֶךְ הַצָּפוֹן
  choice: было обращено на север
  rationale: Сохраняет параллель с ориентацией первых помещений на юг и ясно выражает направление фасадной стороны.
