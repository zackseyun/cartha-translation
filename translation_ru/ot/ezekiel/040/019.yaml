base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/019.yaml
  text: 'Then he measured the width from the front of the lower gate to the front of the inner court outside: one hundred cubits[b][a], to the east and to the north.'
translation:
  language: ru
  text: 'Затем он измерил ширину от передней стороны нижних ворот[a] до передней стороны внутреннего двора снаружи: сто локтей[b] — к востоку и к северу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «ворота», может обозначать всё воротное сооружение, а не только сам проход.
    reason: lexical_alternative
  - marker: b
    text: То есть расстояние составляло сто локтей как с восточной, так и с северной стороны.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּמָד
  choice: Затем он измерил
  rationale: Последовательная глагольная форма продолжает повествование и вводит следующее действие; «затем» естественно передаёт эту последовательность.
- source_word: רֹחַב
  choice: ширину
  rationale: Существительное обозначает измеряемую протяжённость; «ширина» — точный и современный архитектурный термин.
- source_word: מִלִּפְנֵי
  choice: от передней стороны
  rationale: Пространственное выражение указывает начальную точку измерения; такой перевод понятнее буквального «от лица».
- source_word: הַשַּׁעַר הַתַּחְתּוֹנָה
  choice: нижних ворот
  rationale: Русское «ворота» естественно обозначает данный вход; еврейское слово может охватывать и всё воротное сооружение, что отмечено в сноске.
- source_word: לִפְנֵי הֶחָצֵר הַפְּנִימִי
  choice: до передней стороны внутреннего двора
  rationale: Здесь пространственное выражение обозначает конечную точку измерения.
- source_word: מִחוּץ
  choice: снаружи
  rationale: Наречие сохраняет указание на то, что измерение производилось с внешней стороны.
- source_word: מֵאָה אַמָּה
  choice: сто локтей
  rationale: Сохранена древняя единица измерения без приблизительного пересчёта.
- source_word: הַקָּדִים וְהַצָּפוֹן
  choice: к востоку и к северу
  rationale: Направления переданы кратко и без добавления отсутствующих в тексте существительных; контекст указывает на одинаковое измерение с обеих сторон.
