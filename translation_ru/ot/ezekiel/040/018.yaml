lexical_decisions:
- source_word: הָרִצְפָה
  choice: мощёная площадка
  rationale: Существительное רִצְפָה обозначает мощёную поверхность; в описании храмового комплекса «мощёная площадка» звучит естественно и передаёт не просто материал пола, а участок двора.
- source_word: אֶל כֶּתֶף הַשְּׁעָרִים
  choice: вдоль боковых сторон ворот
  rationale: כֶּתֶף буквально значит «плечо», но в пространственном и архитектурном употреблении указывает на боковую сторону; אֶל здесь выражает примыкание или расположение рядом.
- source_word: הַשְּׁעָרִים
  choice: ворот
  rationale: Сохранено множественное число еврейского текста; в контексте имеются в виду воротные сооружения храмового комплекса.
- source_word: לְעֻמַּת אֹרֶךְ הַשְּׁעָרִים
  choice: на всю длину ворот
  rationale: Оборот описывает пространственное соответствие протяжённости площадки длине ворот. Русская формулировка ясно передаёт архитектурное соотношение, а возможное значение «напротив» отмечено в сноске.
- source_word: הָרִצְפָה הַתַּחְתּוֹנָה
  choice: нижняя мощёная площадка
  rationale: Прилагательное תַּחְתּוֹנָה отличает эту площадку от расположенного выше или внутреннего уровня; «нижняя» сохраняет это пространственное различие.
