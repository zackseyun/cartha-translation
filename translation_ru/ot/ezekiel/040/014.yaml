  footnotes:
  - marker: a
    text: 'Еврейский текст второй половины стиха труден для понимания: в нём нет глагола, а синтаксические связи неясны. Буквально: «и к устою двора — ворота кругом». Характер измерения «шестьдесят локтей» прямо не указан.'
