lexical_decisions:
- source_word: אֵילִים / אֵיל
  choice: устои / устой
  rationale: В описании ворот слово обозначает вертикальные опоры или выступы ворот. «Устой» сохраняет архитектурный смысл и позволяет передать смену множественного числа на единственное в еврейском тексте.
- source_word: שִׁשִּׁים אַמָּה
  choice: высотой в шестьдесят локтей
  rationale: Размер, относящийся к вертикальным устоям, естественно понимается как высота; слово «высотой» добавлено для ясности подразумеваемого измерения.
- source_word: סָבִיב סָבִיב
  choice: со всех сторон
  rationale: Передаёт усиленное повторение наречия со значением полного охвата вокруг.
