  source_fidelity: В первой части «устои в шестьдесят локтей» точно передаёт אֵילִים שִׁשִּׁים אַמָּה. Слово «высотой» является вероятным, но не выраженным в еврейском тексте уточнением и при трудном синтаксисе второй части лучше его не вносить в основной текст. Во второй части глагол отсутствует; перевод «доходили» допустимо восполняет эллипсис и следует английскому аудиторскому варианту, однако трудность должна быть яснее отражена в сноске.
