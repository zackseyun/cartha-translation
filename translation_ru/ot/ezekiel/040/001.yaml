reference: Ezekiel 40:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/עֶשְׂרִ֣ים וְ/חָמֵ֣שׁ שָׁנָ֣ה לְ֠/גָלוּתֵ/נוּ בְּ/רֹ֨אשׁ הַ/שָּׁנָ֜ה בֶּ/עָשׂ֣וֹר לַ/חֹ֗דֶשׁ בְּ/אַרְבַּ֤ע עֶשְׂרֵה֙ שָׁנָ֔ה אַחַ֕ר אֲשֶׁ֥ר הֻכְּתָ֖ה הָ/עִ֑יר בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה הָיְתָ֤ה עָלַ/י֙ יַד יְהוָ֔ה וַ/יָּבֵ֥א אֹתִ֖/י שָֽׁמָּ/ה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/001.yaml
  text: In the twenty-fifth year of our exile[a], at the beginning of the year, on the tenth day of the month, in the fourteenth year after the city had been struck down, on that very day the hand of Yahweh was upon me[b], and he brought me there.
translation:
  language: ru
  text: В двадцать пятый год нашего изгнания, в начале года[a], в десятый день месяца, в четырнадцатый год после того, как город был повержен[b], в тот самый день рука Яхве была на мне, и Он привёл меня туда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во главе года». Возможно, имеется в виду новогоднее празднование, но выражение также может просто обозначать начало года.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «после того, как город пал»; «после того, как город был захвачен». Буквальный смысл еврейского глагола связан с нанесением удара.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגָלוּתֵנוּ
  choice: нашего изгнания
  rationale: 'גָּלוּת обозначает изгнание или переселение; форма с суффиксом первого лица множественного числа буквально передаёт общую участь: «нашего изгнания».'
- source_word: בְּרֹאשׁ הַשָּׁנָה
  choice: в начале года
  rationale: 'Буквально: «во главе года». Выбран естественный русский эквивалент, сохраняющий возможную календарную неоднозначность и не превращающий выражение без достаточных оснований в название праздника.'
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: в десятый день месяца
  rationale: Ясно и естественно передаёт календарную дату, выраженную в еврейском тексте.
- source_word: הֻכְּתָה
  choice: был повержен
  rationale: Пассивная форма от נכה несёт значение нанесённого удара и разгрома. «Был повержен» сохраняет насильственный оттенок лучше, чем более интерпретирующее «пал» или «был захвачен».
- source_word: הָעִיר
  choice: город
  rationale: В исходном тексте Иерусалим не назван прямо, поэтому контекстуально очевидное название не добавляется.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в тот самый день
  rationale: Русская идиома естественно передаёт усилительное значение עֶצֶם и подчёркивает точность даты.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохранён характерный пророческий образ божественной силы и властного воздействия, особенно значимый в книге Иезекииля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное божественное имя, непосредственно представленное тетраграмматоном в еврейском тексте.
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: и Он привёл меня туда
  rationale: «Привёл» естественно передаёт каузативное движение к месту; «туда» сохраняет указание исходного текста, не уточняя место сверх сказанного.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Образ «рука Яхве была на мне»
  choice: сохранить буквальный пророческий образ
  alternative: сила Яхве овладела мной
  rationale: Буквальная формула понятна по-русски и сохраняет характерную для Иезекииля богословски значимую образность, не конкретизируя способ воздействия.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксическая протяжённость исходной датировочной формулы сохранена, но формулировки сделаны естественными для обычного современного читателя.
