base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/049.yaml
  text: The length of the vestibule was twenty cubits, and the width was twelve cubits, and by the steps by which one went up to it; and pillars were beside the sidewalls, one on this side and one on that side.
translation:
  language: ru
  text: Длина притвора была двадцать локтей, а ширина — одиннадцать локтей[a]. К нему поднимались по ступеням. У косяков стояли столбы — один с одной стороны, другой с другой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском масоретском тексте: «одиннадцать»; в некоторых древних свидетелях текста: «двенадцать».'
    reason: Фиксирует значимый текстовый вариант, из-за которого переводы расходятся в размере ширины притвора.
lexical_decisions:
- source_word: הָאֻלָם
  choice: притвор
  rationale: Архитектурный термин обозначает входное помещение перед основным залом храма; «притвор» точно и естественно передаёт его функцию.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: одиннадцать
  rationale: Таково прямое значение числительного в масоретском еврейском тексте, несмотря на вариант «двенадцать» в части древней текстовой традиции.
- source_word: בַמַּעֲלוֹת אֲשֶׁר יַעֲלוּ אֵלָיו
  choice: К нему поднимались по ступеням
  rationale: Передаёт смысл несколько эллиптической еврейской конструкции естественным современным русским языком, не добавляя отсутствующего в масоретском тексте числа ступеней.
- source_word: הָאֵילִים
  choice: косяков
  rationale: В данном архитектурном контексте слово обозначает боковые опоры или косяки входного проёма, возле которых находились столбы.
