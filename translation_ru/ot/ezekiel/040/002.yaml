base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/002.yaml
  text: In visions of God he brought me into the land of Israel and set me down on a very high mountain[a]; on it, to the south[b], was something like the structure of a city.
translation:
  language: ru
  text: В видениях Бога[a] он привёл меня в землю Израиля и поместил меня на очень высокой горе. На ней, к югу[b], находилось нечто, похожее на городское строение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в божественных видениях»; или: «в видениях от Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по направлению к югу». Еврейское выражение может указывать на южную ориентацию, а не на движение с юга.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: В видениях Бога
  rationale: 'Сохраняет форму еврейского сочетания и его возможные оттенки: видения могут пониматься как Божьи, божественные или данные Богом.'
- source_word: הֱבִיאַנִי
  choice: он привёл меня
  rationale: Каузативная форма בוא обычно означает «привести». Местоимение передаёт подразумеваемое подлежащее, не называя Бога прямо там, где еврейский текст этого не делает.
- source_word: אֶל אֶרֶץ יִשְׂרָאֵל
  choice: в землю Израиля
  rationale: После глагола движения предлог «в» естественно передаёт движение внутрь страны.
- source_word: וַיְנִיחֵנִי
  choice: и поставил
  rationale: В данной сцене каузатив глагола נוח имеет значение «поместить, поставить», а не «дать отдохнуть».
- source_word: אֶל הַר גָּבֹהַּ מְאֹד
  choice: на очень высокой горе
  rationale: При глаголе помещения русская конструкция «поставил на горе» естественно выражает достигнутое местоположение.
- source_word: וְעָלָיו
  choice: На ней
  rationale: Женское местоимение в русском согласовано со словом «гора» и ясно отсылает к ней.
- source_word: כְּמִבְנֵה עִיר
  choice: нечто похожее на строение города
  rationale: Сравнительная частица כְּ передаёт осторожность описания, а מִבְנֶה обозначает строение или сооружение, а не просто город.
- source_word: מִנֶּגֶב
  choice: к югу
  rationale: Передаёт наиболее вероятную южную ориентацию, не превращая выражение в однозначное указание на происхождение «с юга».
theological_decisions:
- issue: Подразумеваемое подлежащее глаголов перемещения
  choice: Передать как «он», не добавляя прямо слово «Бог»
  alternative: «Бог привёл меня… и поставил…»
  rationale: В еврейском тексте подлежащее грамматически подразумевается и определяется из контекста. Местоимение сохраняет лаконичность и не вносит отсутствующего имени.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Строчная форма «он» сохраняет неявность подлежащего в исходном тексте; формулировка «нечто похожее» удерживает осторожный характер описания видения.
