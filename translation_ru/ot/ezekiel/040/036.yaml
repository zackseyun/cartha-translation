  yaml_path: translation/ot/ezekiel/040/036.yaml
  text: Its guardrooms[a], its side pillars, and its portico, with windows all around[b], had a length of fifty cubits and a width of twenty-five cubits.
translation:
  language: ru
  text: У него были боковые помещения, боковые столбы[a] и притвор[b], а также окна со всех сторон. Длина его составляла пятьдесят локтей, а ширина — двадцать пять локтей.
