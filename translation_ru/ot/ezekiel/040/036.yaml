lexical_decisions:
- source_word: תָּאָיו
  choice: боковые помещения
  rationale: В описании ворот это небольшие помещения при проходе. Нейтральное «боковые помещения» сохраняет архитектурный смысл, не добавляя прямо не выраженной в слове функции караульных комнат.
- source_word: אֵלָיו
  choice: боковые опоры
  rationale: Технический архитектурный термин обозначает боковые конструктивные элементы ворот; этот вариант понятен современному читателю и не сужает значение до одной конкретной формы.
- source_word: אֵלַמּוֹ
  choice: притвор
  rationale: В храмовой архитектуре слово обозначает входную пристройку или вестибюль. «Притвор» естественно звучит в русском библейско-архитектурном контексте.
- source_word: וְחַלּוֹנוֹת לוֹ סָבִיב סָבִיב
  choice: и окна по всему периметру
  rationale: Оборот передаёт наличие окон со всех сторон; «по всему периметру» естественно выражает усиленное повтором סָבִיב סָבִיב круговое расположение.
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה
  choice: Его длина составляла пятьдесят локтей
  rationale: Сохранена исходная мера длины и ясно выражена эллиптическая формула измерения.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: а ширина — двадцать пять локтей
  rationale: Передана стандартная формула размера с сохранением исходной единицы измерения.
