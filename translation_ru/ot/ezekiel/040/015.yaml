    text: 'Еврейский текст в выражении «внешних ворот» труден: употреблённая здесь форма необычна. По контексту окружающих измерений многие понимают её как указание на внешние ворота.'
    reason: textual_variant
  - marker: b
    text: 'Или: «преддверия» либо «портика».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово «ворота» в этой главе может обозначать целый воротный комплекс, а не только створки.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... עַל לִפְנֵי
  choice: От ... до
  rationale: В контексте измерения эти предлоги обозначают начальную и конечную точки расстояния; русская конструкция «от ... до» естественно и точно передаёт пространственное отношение.
- source_word: פְּנֵי ... לִפְנֵי
  choice: передней стороны ... передней стороны
  rationale: В архитектурном контексте פָּנִים обозначает лицевую, переднюю сторону сооружения; повтор сохранён ради точности измерения.
- source_word: הַשַּׁעַר
  choice: ворот
  rationale: В Иезекииля 40 слово обозначает не только створки, но и воротное сооружение; русское множественное «ворота» остаётся естественным, а более широкий смысл пояснён в сноске.
- source_word: היאתון
  choice: внешних
  rationale: Форма в еврейском тексте необычна и трудна; по контексту последовательных измерений наиболее вероятно указание на внешние ворота, однако неопределённость отмечена в сноске.
- source_word: אֻלָם
  choice: притвора
  rationale: Термин обозначает крытое входное помещение или портик перед основной частью сооружения; «притвор» — ясный и уместный архитектурный эквивалент в современном литературном русском.
- source_word: הַשַּׁעַר הַפְּנִימִי
  choice: внутренних ворот
  rationale: Согласование передаёт определённую конструкцию и обозначает ворота на внутренней стороне комплекса.
- source_word: חֲמִשִּׁים אַמָּה
  choice: пятьдесят локтей
  rationale: Традиционный и понятный русский эквивалент библейской меры длины.
