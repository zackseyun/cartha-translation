base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/006.yaml
  text: 'Then he came to the gate that faced east[a], and he went up its steps and measured the threshold of the gate: one reed wide. And the other threshold was one reed wide.'
translation:
  language: ru
  text: 'Затем он подошёл к воротам, обращённым на восток, поднялся по их ступеням и измерил порог ворот: шириной в одну трость. Другой порог[a] был шириной в одну трость.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один порог». По контексту, вероятно, имеется в виду соответствующий порог с другой стороны ворот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר
  choice: ворота
  rationale: В данном архитектурном описании слово обозначает входное сооружение; «ворота» — естественный и достаточно широкий русский эквивалент.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִימָה
  choice: обращённым на восток
  rationale: Передаёт буквальный образ направленной на восток лицевой стороны ворот в естественной современной русской форме.
- source_word: במעלותיו
  choice: по их ступеням
  rationale: Форма множественного числа обозначает ступени, ведущие к воротам; местоимение согласовано с русским словом «ворота».
- source_word: סַף הַשַּׁעַר
  choice: порог ворот
  rationale: סַף обозначает порог или нижнюю часть проёма; «порог ворот» ясно передаёт измеряемую архитектурную деталь.
- source_word: קָנֶה אֶחָד רֹחַב
  choice: шириной в один тростник
  rationale: קָנֶה здесь является единицей измерения по мерной трости из ближайшего контекста, а רֹחַב указывает на ширину.
- source_word: וְאֵת סַף אֶחָד
  choice: Другой порог
  rationale: Хотя אֶחָד буквально значит «один», в контексте парных частей ворот выражение, вероятно, указывает на соответствующий второй порог; примечание сохраняет буквальную возможность.
- source_word: וַיָּבֹא ... וַיַּעַל ... וַיָּמָד
  choice: Затем он подошёл ... поднялся ... и измерил
  rationale: Последовательность повествовательных форм передана цепочкой завершённых действий; «подошёл» естественно описывает приближение к воротам.
