    reason: lexical_alternative
  - marker: b
    text: То есть, вероятно, изображения или резные украшения в виде пальм, а не живые деревья.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵילָו / אֵילָיו
  choice: его устои / на его устоях
  rationale: В описании ворот это архитектурное слово обозначает боковые опоры, столбы или пилястры. «Устои» передаёт конструктивную функцию и позволяет одинаково перевести оба употребления слова в стихе.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: выходили во внешний двор
  rationale: Предлог указывает на направленность архитектурных элементов. Глагол «выходили» естественно выражает их ориентацию в современном русском языке.
- source_word: תִמֹרִים
  choice: пальмы
  rationale: Еврейское слово буквально называет пальмы; вероятный смысл — изображения или резные пальмовые украшения — оставлен для примечания, чтобы не устранять неявность оригинала.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: с обеих сторон
  rationale: Сжатое и естественное русское выражение точно передаёт симметричное расположение «с этой и с той стороны».
- source_word: שְׁמֹנֶה מַעֲלוֹת מַעֲלָו
  choice: к нему вели восемь ступеней
  rationale: Передаёт число ступеней и выраженную в оригинале идею подъёма к воротам без тяжеловесной буквальности.
