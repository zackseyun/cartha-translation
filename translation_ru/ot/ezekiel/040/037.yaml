  yaml_path: translation/ot/ezekiel/040/037.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: ru
  text: Его притвор[a] был обращён к внешнему двору, а на его столбах с обеих сторон были пальмы[b]; к нему вели восемь ступеней.
  philosophy: optimal-equivalence
  footnotes:
