  source_fidelity: 'Первое אֵילָו в формуле описания ворот относится к входному выступу/притвору, тогда как второе אֵילָיו в сочетании с пальмами естественно обозначает боковые архитектурные элементы (столбы, косяки, пилястры). Черновик необоснованно передаёт оба употребления как «устои». «Выходили во внешний двор» также менее точно, чем указание на ориентацию: «был обращён к внешнему двору».'
  naturalness: «Его притвор был обращён к внешнему двору» и «на его столбах с обеих сторон были пальмы» звучат ясно и литературно. «К нему вели восемь ступеней» естественно передаёт заключительную часть стиха.
  terminology: «Притвор» уместен для первого архитектурного термина; «столбы» — нейтральное и понятное контекстуальное обозначение второго. «Пальмы» сохраняет буквальную лексику еврейского текста, а возможность резного декора надлежащим образом отмечена в примечании.
