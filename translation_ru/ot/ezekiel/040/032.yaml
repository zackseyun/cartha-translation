lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Затем он привёл меня
  rationale: Форма wayyiqtol от בוא с суффиксом 1-го лица передаёт следующее действие повествования; «затем» естественно выражает последовательность, а «привёл» сохраняет каузативный смысл.
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: во внутренний двор
  rationale: חָצֵר обозначает двор, а הַפְּנִימִי уточняет, что речь идёт о внутреннем дворе храмового комплекса.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: с восточной стороны
  rationale: דֶּרֶךְ указывает на путь или направление подхода, а הַקָּדִים — на восток; выбранная формулировка естественна для русского архитектурного описания и не уточняет маршрут сверх текста.
- source_word: וַיָּמָד
  choice: и измерил
  rationale: Глагол מדד употреблён в прямом архитектурном значении и продолжает последовательность действий.
- source_word: הַשַּׁעַר
  choice: ворота
  rationale: שַׁעַר может обозначать как сами ворота, так и всё воротное сооружение. В основном тексте сохранён обычный и краткий вариант, а более широкий смысл отмечен в сноске.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: они имели те же размеры
  rationale: Сочетание כְּ с מִדּוֹת выражает соответствие ранее названным размерам. Перестройка в отдельную часть предложения передаёт этот смысл естественно по-русски.
