  text: As for the gate whose front faced north toward the outer court[a], he measured its length and its width.
translation:
  language: ru
  text: А у ворот внешнего двора, обращённых к северу,[a] он измерил их длину и ширину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «передняя сторона которых была в направлении севера».'
    reason: Сохраняет буквальный архитектурный образ פָּנָיו («лицо», то есть передняя сторона) и направительное значение דֶּרֶךְ.
lexical_decisions:
- source_word: וְהַשַּׁעַר
  choice: А у ворот
  rationale: Союз וְ продолжает описание и вводит следующий архитектурный объект; конструкция с «у ворот» позволяет естественно по-русски передать последующее измерение их длины и ширины.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַצָּפוֹן
  choice: обращённых на север
  rationale: Буквальный образ «лицо ворот» обозначает их переднюю сторону и направление; современное русское «обращённых на север» ясно и естественно сохраняет пространственный смысл.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: внешнего двора
  rationale: Предлог לְ здесь передаёт отношение ворот к внешнему двору; родительная конструкция естественна для русского архитектурного описания и соответствует контексту перечисления ворот внешнего двора.
- source_word: מָדַד
  choice: он измерил
  rationale: Глагол обозначает действие ранее упомянутого человека с мерной тростью; русское предложение требует явного подлежащего.
- source_word: אָרְכּוֹ וְרָחְבּוֹ
  choice: длину и ширину
  rationale: Местоименные суффиксы относятся к воротам; при конструкции «у ворот» принадлежность размеров очевидна и не требует повторения «их».
