lexical_decisions:
- source_word: אֵלַמּוֹת
  choice: притворы
  rationale: В храмовой архитектуре слово обозначает крытые входные или примыкающие помещения. «Притворы» — краткий и уместный в данном контексте русский архитектурный термин; возможные варианты указаны в сноске.
- source_word: סָבִיב סָבִיב
  choice: кругом, кругом
  rationale: Повтор сохранён, поскольку еврейское выражение намеренно удвоено и передаёт усиление либо распределённость со всех сторон.
- source_word: אֹרֶךְ חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: двадцать пять локтей в длину
  rationale: Размер передан в естественном для современного русского языка порядке; древняя единица измерения «локоть» сохранена без пересчёта.
- source_word: רֹחַב חָמֵשׁ אַמּוֹת
  choice: пять локтей в ширину
  rationale: Формулировка естественна по-русски и синтаксически параллельна указанию длины.
