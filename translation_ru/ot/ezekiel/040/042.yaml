base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/042.yaml
  text: And four tables for the burnt offering were of cut stone[a], a cubit and a half long, a cubit and a half wide, and one cubit high[b]. On them they placed the implements with which they slaughtered the burnt offering and the sacrifice.
translation:
  language: ru
  text: 'Четыре стола для всесожжения были из тёсаного камня[a]: каждый — полтора локтя в длину, полтора локтя в ширину и один локоть в высоту. На них клали орудия, которыми закалывали всесожжение и жертву[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из обтёсанного камня».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово зевах может обозначать жертву вообще, а в некоторых контекстах — более конкретно мирную жертву.
    reason: alternative_reading
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: стола
  rationale: Обычное значение — столы или столоподобные поверхности; их жертвенное назначение прямо названо далее, поэтому уточнение «жертвенные» не добавляется.
- source_word: לָעוֹלָה
  choice: для всесожжения
  rationale: עוֹלָה — устойчивое обозначение всесожжения, а предлог ל выражает назначение столов.
- source_word: אַבְנֵי גָזִית
  choice: из тёсаного камня
  rationale: Сочетание обозначает обработанный, обтёсанный камень; традиционное и ясное русское выражение сохраняет описание материала.
- source_word: אַמָּה אַחַת וָחֵצִי
  choice: полтора локтя
  rationale: Сохранена древняя единица длины без приблизительного пересчёта в современные меры.
- source_word: וְגֹבַהּ אַמָּה אֶחָת
  choice: один локоть в высоту
  rationale: Естественная русская передача буквального «его высота — один локоть».
- source_word: אֲלֵיהֶם
  choice: На них
  rationale: Предлог указывает на размещение предметов на поверхности упомянутых столов.
- source_word: וְיַנִּיחוּ
  choice: клали
  rationale: Форма описывает обычное функциональное действие в контексте устройства святилища; несовершенный вид естественно передаёт повторяемость.
- source_word: הַכֵּלִים
  choice: орудия
  rationale: כֵּלִים — широкое обозначение предметов и принадлежностей; в контексте заклания речь идёт об орудиях, не обязательно только о ножах.
- source_word: אֲשֶׁר יִשְׁחֲטוּ ... בָּם
  choice: которыми закалывали
  rationale: Местоименная конструкция указывает на средства, применявшиеся при заклании; русская формулировка сохраняет функциональный смысл.
- source_word: הָעוֹלָה
  choice: всесожжение
  rationale: Последовательно передаёт стандартный жертвенный термин עוֹלָה.
- source_word: וְהַזָּבַח
  choice: и жертву
  rationale: זֶבַח может обозначать жертву вообще, хотя в отдельных контекстах имеет более узкое значение; здесь широкий вариант не вводит отсутствующего в стихе уточнения.
theological_decisions:
- issue: Степень конкретизации זֶבַח в жертвенной терминологии
  choice: жертву
  alternative: мирную жертву
  rationale: Сам стих не ограничивает значение определённым видом жертвы. Общая передача сохраняет смысловой диапазон еврейского слова и не навязывает более узкую культовую классификацию.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности; слово «каждый» эксплицирует распределительный смысл размеров четырёх одинаковых столов. Древняя мера «локоть» сохранена.
