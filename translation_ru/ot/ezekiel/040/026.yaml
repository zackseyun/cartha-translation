lexical_decisions:
- source_word: מַעֲלוֹת שִׁבְעָה עֲלוֹתוֹ
  choice: к нему вели семь ступеней
  rationale: Сочетание описывает подъём к воротам, состоявший из семи ступеней. Такой перевод естественен по-русски и сохраняет архитектурный смысл еврейского выражения.
- source_word: וְאֵילַמּוֹ
  choice: его притвор
  rationale: В храмовом видении אֵילָם обозначает входную пристройку или крытую переднюю часть ворот. «Притвор» — понятный и уместный в храмовом контексте русский архитектурный термин.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Местоимение во множественном числе соотнесено со ступенями; расположение притвора перед ними передано без уточнений, отсутствующих в исходном тексте.
- source_word: וְתִמֹרִים
  choice: пальмовые украшения
  rationale: В архитектурном контексте речь идёт не о живых деревьях, а об изображениях или декоративных мотивах в виде пальм.
- source_word: אֶחָד מִפּוֹ וְאֶחָד מִפּוֹ
  choice: по одному с той и с другой стороны
  rationale: Передана симметричная расстановка двух пальмовых украшений, по одному на каждой стороне.
- source_word: אֵילָיו
  choice: его косяках
  rationale: Здесь слово обозначает боковые опоры или стойки ворот. «Косяки» точно выражает их положение в дверном или воротном проёме.
