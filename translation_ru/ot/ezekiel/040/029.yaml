  yaml_path: translation/ot/ezekiel/040/029.yaml
  text: And its guardroom[a], its side pillars, and its porch were according to these measurements; and it had windows, and its porch had windows, all around. The length was fifty cubits[b], and the width twenty-five cubits.
translation:
  language: ru
  text: Его караульная комната, столбы[a] и притвор[b] были тех же размеров. Окна были и в нём, и в его притворе, по всему периметру. Длина составляла пятьдесят локтей, а ширина — двадцать пять локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «косяки», «пилястры» или «опоры».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вестибюль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: боковые комнаты
  rationale: В описании храмовых ворот слово обозначает небольшие помещения, расположенные по сторонам прохода. Множественное число передаёт собирательное архитектурное употребление в данном разделе и звучит естественно по-русски.
- source_word: אַיִל
  choice: опоры
  rationale: Здесь имеется в виду вертикальный конструктивный элемент ворот. «Опоры» понятно современному читателю и не навязывает более узкого определения вроде «косяков» или «пилястр».
- source_word: אֵילָם
  choice: притвор
  rationale: Слово обозначает входную часть сооружения. «Притвор» точно и привычно для русского библейского архитектурного описания, оставаясь понятным в контексте.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: имели такие же размеры
  rationale: Фраза указывает, что перечисленные части соответствовали размерам уже описанных частей ворот.
- source_word: חַלּוֹנוֹת
  choice: окна
  rationale: Передано обычное значение слова без добавления не выраженной здесь характеристики решётчатости.
- source_word: סָבִיב סָבִיב
  choice: со всех сторон
  rationale: Естественно передаёт усиленное повтором указание на расположение кругом.
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: Длина составляла пятьдесят локтей
  rationale: Сохраняет явно названное измерение длины и архитектурный стиль исходного текста.
- source_word: וְרֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: а ширина — двадцать пять локтей
  rationale: Сохраняет параллельное указание второго размера и естественный русский синтаксис.
- source_word: לּוֹ ... וְלְאֵילָמוֹ
  choice: В нём и в его притворе ... были окна
  rationale: Ясно передаёт наличие окон как в самих воротах, так и в их притворе, не делая синтаксис тяжеловесным.
