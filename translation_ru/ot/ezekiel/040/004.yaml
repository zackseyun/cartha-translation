source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלַ֜/י הָ/אִ֗ישׁ בֶּן אָדָ֡ם רְאֵ֣ה בְ/עֵינֶי/ךָ֩ וּ/בְ/אָזְנֶ֨י/ךָ שְּׁמָ֜ע וְ/שִׂ֣ים לִבְּ/ךָ֗ לְ/כֹ֤ל אֲשֶׁר אֲנִי֙ מַרְאֶ֣ה אוֹתָ֔/ךְ כִּ֛י לְמַ֥עַן הַרְאוֹתְ/כָ֖ה הֻבָ֣אתָה הֵ֑נָּה הַגֵּ֛ד אֶת כָּל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/004.yaml
  text: And the man said to me[a], “Son of man, see with your eyes, and hear with your ears, and set your heart on all that I show you, for you were brought here so that I might show you these things. Declare to the house of Israel all that you see.”
translation:
  language: ru
  text: 'И тот человек сказал мне: «Сын человеческий[a], смотри своими глазами, слушай своими ушами и прими к сердцу всё, что я показываю тебе, ибо тебя привели сюда, чтобы я показал тебе это. Возвести дому Израиля всё, что ты видишь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертный», «человек». Это еврейское выражение — обычная форма обращения к Иезекиилю.'
    reason: Лексическая альтернатива поясняет смысл повторяющейся формулы בֶּן אָדָם и её функцию в книге.
lexical_decisions:
- source_word: הָאִישׁ
  choice: этот муж
  rationale: Обычное обозначение мужчины отсылает к мужу, представленному в предыдущем стихе; указательное «этот» естественно передаёт определённость в русском контексте, а «муж» поддерживает достоинство пророческого повествования.
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранена устойчивая повторяющаяся форма обращения к Иезекиилю. Здесь это обращение к пророку как к человеку, а не христологический титул.
- source_word: רְאֵה בְעֵינֶיךָ וּבְאָזְנֶיךָ שְׁמָע
  choice: смотри своими глазами, слушай своими ушами
  rationale: Императивы требуют деятельного внимания. «Смотри» и «слушай» естественнее по-русски, чем буквальные «увидь» и «услышь», и сохраняют параллелизм органов восприятия.
- source_word: וְשִׂים לִבְּךָ
  choice: прими к сердцу
  rationale: Русская идиома сохраняет образ сердца и выражает сосредоточенное, серьёзное внимание, не сводя смысл только к интеллектуальному пониманию.
- source_word: לְכֹל אֲשֶׁר אֲנִי מַרְאֶה אוֹתָךְ
  choice: всё, что я показываю тебе
  rationale: 'Естественно передаёт каузативное значение формы ראה: дать увидеть, показать.'
- source_word: כִּי לְמַעַן הַרְאוֹתְכָה הֻבָאתָה הֵנָּה
  choice: потому что ты приведён сюда, чтобы я показал тебе это
  rationale: Сохраняет пассив «приведён» и целевую конструкцию. «Это» не вводит отсутствующего в еврейском множественного объекта и естественно охватывает содержание видения.
- source_word: הַגֵּד
  choice: возвести
  rationale: Императив Hiphil означает сообщить или сделать известным; «возвести» соответствует торжественному пророческому регистру.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохранена традиционная и литературно значимая пророческая формула без упрощения до «народу Израиля».
- source_word: כָּל אֲשֶׁר אַתָּה רֹאֶה
  choice: всё, что ты видишь
  rationale: Прямо и естественно передаёт итоговое поручение сообщить всё содержание видения.
theological_decisions:
- issue: Значение обращения בֶּן אָדָם в книге Иезекииля
  choice: Сын человеческий
  alternative: смертный; человек
  rationale: Фраза здесь подчёркивает человеческий статус Иезекииля и служит постоянной формой обращения к нему. Традиционная формула сохраняет литературную связность книги; примечание предотвращает ошибочное восприятие её здесь как особого мессианского титула.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Параллелизм «своими глазами… своими ушами» и образ сердца сохранены; синтаксис сделан ясным для современного читателя.
