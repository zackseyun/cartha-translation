  source_fidelity: В целом перевод точно передаёт повеления «смотри», «слушай», «прими к сердцу», непрерывное «я показываю тебе» и заключительное поручение дому Израиля. Однако הוּבָאתָ — завершённая пассивная форма («тебя привели»), поэтому «ты приведён» менее точна по виду и звучит как характеристика текущего состояния. Неявный объект при «показать тебе» может быть естественно выражен русским «это» по ближайшему контексту.
