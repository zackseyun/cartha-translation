base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/025.yaml
  text: And it had windows all around[a], and its porch also had windows all around, like these windows. The length was fifty cubits, and the width twenty-five cubits.
translation:
  language: ru
  text: У него и у его притвора[a] со всех сторон были окна, такие же, как эти окна. Длина была пятьдесят локтей, а ширина — двадцать пять локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестибюля» или «портика»; еврейское אֵילָם — архитектурный термин в видении храма у Иезекииля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים
  choice: окна
  rationale: Обычное значение существительного в архитектурном описании; «окна» естественно и точно передаёт элементы ворот.
- source_word: לוֹ
  choice: у него были
  rationale: Еврейская конструкция принадлежности естественно передаётся по-русски оборотом «у него были»; местоимение относится к описываемому сооружению ворот.
- source_word: וְלְאֵילָמָו
  choice: и у его притвора
  rationale: אֵילָם обозначает примыкающую к воротам входную часть сооружения; «притвор» — понятный и уместный русский архитектурный термин, при этом возможные соответствия указаны в сноске.
- source_word: סָבִיב סָבִיב
  choice: со всех сторон
  rationale: Повтор усиливает значение окружности; русский оборот «со всех сторон» естественно передаёт этот смысл без неуклюжего повтора.
- source_word: כְּהַחֲלֹּנוֹת הָאֵלֶּה
  choice: такие же, как эти окна
  rationale: Сохраняется сравнительная конструкция и указательное значение הָאֵלֶּה, отсылающее к уже описанным окнам.
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: Длина была пятьдесят локтей
  rationale: Стандартная формула измерения передана ясной русской фразой с сохранением древней единицы длины.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: а ширина — двадцать пять локтей
  rationale: Точно передаёт соответствующий размер ширины и естественно связывает его с предыдущим измерением.
