lexical_decisions:
- source_word: וַיְדַבֵּר אֵלַי
  choice: И он сказал мне
  rationale: Глагол דבר с אֶל вводит прямую речь и продолжает повествование. Русское «сказал мне» естественно передаёт эту функцию, а союз «и» сохраняет последовательность древнееврейской конструкции.
- source_word: זֹה הַלִּשְׁכָּה
  choice: Это помещение
  rationale: לִשְׁכָּה обозначает отдельное помещение в составе храмового комплекса. «Помещение» ясно и естественно в современном архитектурном описании, не привнося оттенков жилой комнаты или монашеской кельи.
- source_word: אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַדָּרוֹם
  choice: передняя сторона которого обращена на юг
  rationale: Форма פָּנֶיהָ буквально указывает на «лицо», то есть переднюю, обращённую сторону помещения. Перевод сохраняет конкретность пространственного описания.
- source_word: לַכֹּהֲנִים
  choice: предназначено для священников
  rationale: Предлог ל выражает назначение помещения, а не обязательно принадлежность. «Предназначено для» точно передаёт эту функцию.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: исполняющих обязанности
  rationale: Сочетание причастия и однокоренного существительного обозначает ответственное исполнение порученной храмовой службы. «Исполняющих обязанности» звучит естественно по-русски и не сужает смысл до физической охраны.
- source_word: הַבָּיִת
  choice: храме
  rationale: Хотя בַּיִת буквально означает «дом», в контексте видения Иезекииля речь идёт о храме. Контекстуальный эквивалент делает референт ясным современному читателю.
theological_decisions:
- issue: Значение הַבָּיִת в описании храмового видения
  choice: храме
  alternative: доме
  rationale: Архитектурный контекст однозначно указывает на храм. Основной текст передаёт контекстуальный смысл, а буквальная лексическая альтернатива сохранена в сноске; богословское уточнение сверх текста не вносится.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Архитектурная формулировка сохранена конкретной, а храмовая функция священников выражена естественно и без конфессионально окрашенной терминологии.
