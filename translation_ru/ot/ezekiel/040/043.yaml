    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁפַתַּיִם
  choice: крюки
  rationale: Редкое и неясное слово, буквально связанное с «краями/губами». В контексте помещений для приготовления жертв «крюки» дают связный предметный смысл, однако неопределённость сохранена в сноске.
- source_word: טֹפַח אֶחָד
  choice: длиной в ладонь
  rationale: טֹפַח обозначает ладонь как небольшую меру длины; такая формулировка естественна по-русски и не уточняет измеряемую сторону сверх необходимого.
- source_word: מוּכָנִים
  choice: были закреплены
  rationale: Страдательное причастие от כון выражает установленность или прочное размещение; при выбранном значении «крюки» уместно «закреплены».
- source_word: בַּבַּיִת
  choice: внутри здания
  rationale: בַּיִת здесь относится к строению в храмовом комплексе; «здание» избегает ошибочной бытовой ассоциации со словом «дом».
- source_word: סָבִיב סָבִיב
  choice: повсюду
  rationale: Повтор усиливает значение расположения кругом, по всем сторонам; «повсюду» передаёт это естественно и кратко.
- source_word: וְאֶל הַשֻּׁלְחָנוֹת
  choice: на столах
  rationale: Хотя אֶל обычно означает направление «к/к», в данной сжатой описательной конструкции оно передаёт пространственное отношение; контекст требует расположения мяса на столах.
- source_word: בְּשַׂר הַקָּרְבָן
  choice: мясо жертвы
  rationale: בָּשָׂר — плоть или мясо, а קָרְבָּן — приношение, здесь жертвенное; «мясо жертвы» ясно и сохраняет культовый контекст.
