  text: וַ/יּוֹלִכֵ֨/נִי֙ דֶּ֣רֶךְ הַ/דָּר֔וֹם וְ/הִנֵּה שַׁ֖עַר דֶּ֣רֶךְ הַ/דָּר֑וֹם וּ/מָדַ֤ד איל/ו ו/אילמ/ו כַּ/מִּדּ֖וֹת הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/024.yaml
  text: Then he led me by way of the south[a], and behold, there was a gate facing south[b]. He measured its side pillars and its porch according to these measurements.
translation:
  language: ru
  text: Затем он повёл меня в южную сторону, и вот — ворота, обращённые на юг. Он измерил их боковые опоры[a] и притвор в соответствии с теми же размерами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более технический перевод: «боковые косяки». Еврейский архитектурный термин, вероятно, обозначает несущие боковые части ворот.'
    reason: lexical_alternative
  - marker: b
    text: То есть размеры этих ворот совпадали с размерами ворот, описанных выше.
    reason: cross_reference
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: Затем он повёл меня
  rationale: Каузативная форма от הלך означает «вести, заставлять идти»; «затем» естественно передаёт последовательность повествования.
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: в южную сторону
  rationale: Буквально «путём юга»; в данном пространственном описании это естественное обозначение направления движения.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную функцию частицы, привлекающей внимание к увиденному в видении.
- source_word: שַׁעַר דֶּרֶךְ הַדָּרוֹם
  choice: ворота, обращённые на юг
  rationale: Оборот указывает на ориентацию ворот; русская формулировка ясна в архитектурном контексте.
- source_word: אֵילוֹ
  choice: их боковые опоры
  rationale: Архитектурный термин обозначает боковые несущие или ограничивающие элементы ворот; «опоры» понятно современному читателю и не создаёт ложной точности.
- source_word: וְאֵילַמּוֹ
  choice: и притвор
  rationale: אֵילָם обозначает примыкающее к воротам крытое входное пространство; «притвор» соответствует храмовому архитектурному контексту.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: в соответствии с теми же размерами
  rationale: Сравнительный оборот указывает, что размеры совпадали с уже описанными; «теми же» естественно выражает эту отсылку по-русски.
