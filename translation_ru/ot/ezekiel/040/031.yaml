lexical_decisions:
- source_word: אֵלַמָּו
  choice: его притвор
  rationale: В описании храмового комплекса слово обозначает входную пристройку или крытое пространство перед входом. «Притвор» — естественный и достаточно точный архитектурный термин; «вестибюль» может ошибочно восприниматься как внутреннее помещение.
- source_word: אֶל חָצֵר הַחִיצוֹנָה
  choice: был обращён к внешнему двору
  rationale: Предлог אֶל в именной конструкции указывает на направление входной части; такая формулировка ясно и естественно передаёт её ориентацию.
- source_word: תִמֹרִים
  choice: изображения пальм
  rationale: В архитектурном контексте речь идёт не о растущих деревьях, а о пальмовом декоративном мотиве. Добавление «изображения» делает подразумеваемый смысл ясным, не определяя технику исполнения.
- source_word: אֵילָו
  choice: его косяках
  rationale: Термин обозначает боковые структурные элементы входа. «Косяки» понятно современному читателю и соответствует дверной архитектуре; возможное «пилястры» более техническое и предполагает несколько более узкую идентификацию.
- source_word: מַעֲלוֹת שְׁמוֹנֶה
  choice: восемь ступеней
  rationale: Сочетание обозначает число ступеней подъёма и естественно передаётся по-русски как «восемь ступеней».
- source_word: מַעֲלוֹ
  choice: к нему вели
  rationale: Форма описывает подъём или доступ к сооружению. Русская конструкция «к нему вели восемь ступеней» естественно выражает пространственное отношение, не добавляя отдельной лестницы сверх названных ступеней.
