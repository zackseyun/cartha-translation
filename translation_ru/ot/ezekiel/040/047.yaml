  text: 'Then he measured the court: one hundred cubits long and one hundred cubits wide[a], square[b]; and the altar was before the house.'
translation:
  language: ru
  text: 'И измерил он двор: сто локтей в длину и сто локтей в ширину; двор был квадратным. А жертвенник находился перед храмом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָד
  choice: И измерил он
  rationale: Вав-последовательный продолжает повествование; русский союз «и» естественно передаёт связь с предыдущим действием.
- source_word: הֶחָצֵר
  choice: двор
  rationale: חָצֵר обозначает ограждённый двор; в описании храмового комплекса «двор» звучит естественно и точно.
- source_word: אֹרֶךְ מֵאָה אַמָּה וְרֹחַב מֵאָה אַמָּה
  choice: сто локтей в длину и сто локтей в ширину
  rationale: Сохраняет обе величины и древнюю меру длины, передавая конструкцию естественным современным русским языком.
- source_word: מְרֻבָּעַת
  choice: квадрат
  rationale: Форма и контекст указывают, что двор имел квадратную форму.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшееся и точное русское соответствие культовому термину מִזְבֵּחַ.
- source_word: לִפְנֵי הַבָּיִת
  choice: перед храмом
  rationale: לִפְנֵי выражает пространственное положение «перед», а הַבָּיִת в данном описании видения относится к зданию храма; перевод по смыслу устраняет неестественное для русского «перед домом».
