  yaml_path: translation/ot/ezekiel/038/003.yaml
  text: 'and say, ‘Thus says the Lord GOD: Behold, I am against you, Gog, chief prince of Meshech and Tubal.’'
translation:
  language: ru
  text: 'и скажи: «Так говорит Владыка ГОСПОДЬ: вот, Я против тебя, Гог, верховный[a] князь Мешеха и Тувала».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князь Роша, Мешеха и Тувала». Еврейское слово рош может пониматься как «главный, верховный» либо как имя собственное.'
    reason: Отмечает спорный синтаксико-лексический статус רֹאשׁ, не навязывая менее вероятное чтение основному тексту.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Передаёт сочетание титула «Владыка» с божественным именем; написание «ГОСПОДЬ» прописными буквами традиционно отмечает тетраграмматон.
- source_word: הִנְנִי אֵלֶיךָ
  choice: вот, Я — против тебя
  rationale: Сохраняет эмфатическую формулу присутствия и направленную враждебность Божьего обращения.
- source_word: נְשִׂיא רֹאשׁ
  choice: верховный князь
  rationale: רֹאשׁ естественно понимается здесь как определение со значением «главный, верховный», а не как дополнительный топоним.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Мешеха и Тувала
  rationale: Передаёт два этнонима/топонима традиционными русскими библейскими формами в зависимом родительном падеже.
theological_decisions:
- issue: Синтаксическая роль רֹאשׁ
  choice: «верховный князь Мешеха и Тувала»
  alternative: «князь Роша, Мешеха и Тувала»
  rationale: В масоретском тексте наиболее естественно читать רֹאשׁ как определение к נְשִׂיא («главный/верховный князь»); такое прочтение также сохраняет принятую в предоставленном аудированном слое трактовку.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Синтаксис близок к еврейскому оригиналу, но естественен по-русски; имена даны в привычной библейской форме.
