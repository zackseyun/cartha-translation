  source_fidelity: 'Основной смысл передан верно: цели нападения, заселённые после разорения места, народ, собранный из народов, его скот и имущество, а также метафора «пупа земли» сохранены. Однако «награбить добро» несколько сужает и разговорно окрашивает בַּז; «направить руку» естественнее передаёт образ намеренного обращения силы против цели. Добавленное «самом» не обязательно для исходного текста.'
