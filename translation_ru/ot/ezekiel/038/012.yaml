  yaml_path: translation/ot/ezekiel/038/012.yaml
  text: to seize spoil and to carry off plunder[a], to turn your hand against ruins now inhabited and against a people gathered from the nations, who have acquired livestock and goods, who dwell at the center of the earth.
translation:
  language: ru
  text: чтобы захватить добычу и унести награбленное, чтобы направить свою руку против мест, некогда разорённых и ныне заселённых, и против народа, собранного из народов, который обзавёлся скотом и имуществом и живёт в центре земли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на пупе земли» — образное обозначение середины, центральной части земли или страны.'
    reason: Сноска сохраняет исходную метафору טַבּוּר הָאָרֶץ и указывает диапазон значения הָאָרֶץ.
lexical_decisions:
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: чтобы захватить добычу и награбить добро
  rationale: Две параллельные конструкции с однокоренными глаголом и дополнением передают усиленное намерение грабить. По-русски различение «захватить добычу» и «награбить добро» сохраняет параллелизм без неестественного повтора.
- source_word: לְהָשִׁיב יָדְךָ
  choice: чтобы обратить свою руку против
  rationale: Сохраняется образ руки как направленной силы; глагол שׁוב здесь обозначает поворот или обращение действия против цели.
- source_word: חֳרָבוֹת נוֹשָׁבוֹת
  choice: вновь заселённых развалин
  rationale: 'Передано напряжение между прежним разорением и нынешним заселением: это развалины, которые снова стали обитаемыми.'
- source_word: עַם מְאֻסָּף מִגּוֹיִם
  choice: народ, собранный из разных народов
  rationale: מִגּוֹיִם указывает на собирание из множества народов; добавление «разных» естественно выражает множественность в современном русском.
- source_word: עֹשֶׂה מִקְנֶה וְקִנְיָן
  choice: который обзавёлся скотом и имуществом
  rationale: עֹשֶׂה в сочетании с этими существительными означает приобретение или накопление, а не буквальное изготовление. «Скот и имущество» точно передаёт два вида собственности.
- source_word: יֹשְׁבֵי עַל טַבּוּר הָאָרֶץ
  choice: живёт в самом центре земли
  rationale: טַבּוּר буквально значит «пуп» и метафорически указывает на середину или центр. «В самом центре» естественно передаёт усиленный образ центрального положения.
theological_decisions:
- issue: Метафорическая география в טַבּוּר הָאָרֶץ
  choice: в самом центре земли
  alternative: на пупе земли
  rationale: Идиоматический перевод передаёт географическую центральность, не навязывая буквального космологического понимания; исходная метафора отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Сохранены образ «обратить руку» и напряжение выражения о заселённых развалинах; буквальная метафора «пуп земли» вынесена в сноску.
