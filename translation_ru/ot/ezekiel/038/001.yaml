lexical_decisions:
- source_word: וַיְהִי
  choice: было
  rationale: В устойчивой пророческой формуле русский оборот «было слово…» естественно передаёт совершившееся получение откровения, сохраняя при этом форму еврейского глагола היה и не добавляя отсутствующего в оригинале глагола движения.
- source_word: דְבַר
  choice: слово
  rationale: В данной формуле обозначает Божье слово или послание; «слово» сохраняет ключевую лексическую связь с последующей прямой речью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем, а не титулом, отражает непосредственно стоящее в еврейском тексте יהוה.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица указывает на обращённость слова к пророку; «ко мне» естественно входит в традиционную и понятную русскую формулу.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «говоря» вводит последующую прямую речь. В современном русском эту функцию естественнее и без потери смысла передаёт двоеточие.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В тексте употреблено собственное имя יהוה. «Яхве» передаёт его как имя и не заменяет титулом; примечание сообщает читателю традиционную альтернативу «Иегова».
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой формулы. Синтаксис «И было ко мне слово…» слегка возвышенный, но общеупотребительный в библейском контексте; לֵאמֹר функционально передано двоеточием.
