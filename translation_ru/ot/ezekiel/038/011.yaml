base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/011.yaml
  text: and you will say[a], ‘I will go up against a land of unwalled villages; I will come against those who are at rest, who dwell securely, all of them dwelling without walls[d][c][b], and having no bars or gates.’
translation:
  language: ru
  text: 'и скажешь: «Поднимусь на землю неукреплённых селений[a]; пойду на людей, живущих спокойно и в безопасности[b]. Все они живут без стен, нет у них ни засовов, ни дверей[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на землю открытых поселений»; еврейское слово обозначает селения, не окружённые оборонительными стенами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «приду». Перевод «пойду на» передаёт враждебный замысел Гога в данном контексте.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «засовов и ворот»; буквально: «засова и дверей». В данном контексте речь идёт об элементах обороны поселений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: и скажешь
  rationale: Перфект с союзом в пророческой последовательности естественно передаётся русским будущим временем.
- source_word: אֶעֱלֶה
  choice: поднимусь
  rationale: Сохраняет направительное значение עלה и форму заявленного намерения говорящего.
- source_word: אֶרֶץ פְּרָזוֹת
  choice: землю неукреплённых селений
  rationale: פְּרָזוֹת обозначает открытые, не окружённые оборонительными стенами поселения; формулировка конкретна и согласуется с последующим упоминанием отсутствия стен.
- source_word: אָבוֹא
  choice: пойду на
  rationale: Сам по себе глагол означает «приду/войду», но в контексте замысла нападения русское «пойду на» естественно передаёт враждебную направленность, отмеченную в сноске.
- source_word: הַשֹּׁקְטִים
  choice: безмятежных людей
  rationale: Причастие выражает состояние покоя, отсутствия тревоги или беспокойства; добавление «людей» необходимо для естественного русского субстантивирования.
- source_word: יֹשְׁבֵי לָבֶטַח
  choice: живущих в безопасности
  rationale: Передаёт как проживание, так и состояние защищённости, не сводя לָבֶטַח лишь к субъективной уверенности.
- source_word: כֻּלָּם יֹשְׁבִים
  choice: Все они живут
  rationale: Отдельное предложение сохраняет пояснительную структуру еврейского текста и повтор корня ישב без тяжёлой цепочки причастий.
- source_word: בְּאֵין חוֹמָה
  choice: без стен
  rationale: Единственное число חוֹמָה имеет собирательный смысл; множественное число по-русски естественно описывает отсутствие укреплений у всех селений.
- source_word: וּבְרִיחַ וּדְלָתַיִם אֵין לָהֶם
  choice: и нет у них ни засовов, ни ворот
  rationale: בריח — запирающий брус или засов, а דלתים — створки/двустворчатые двери; в контексте укреплённых поселений естественное русское соответствие — «ворота».
