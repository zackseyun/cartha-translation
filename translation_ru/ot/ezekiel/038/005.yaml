  text: Persia[a], Cush, and Put are with them[b], all of them with shield and helmet.
translation:
  language: ru
  text: Персия, Куш и Пут — с ними; все они со щитами и в шлемах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרַס
  choice: Персия
  rationale: Общепринятое русское название древней страны и народа; оно естественнее прямой транслитерации «Парас».
- source_word: כּוּשׁ
  choice: Куш
  rationale: Транслитерация сохраняет древнее этногеографическое название и не отождествляет его безоговорочно с современной Эфиопией.
- source_word: פוּט
  choice: Пут
  rationale: Транслитерация еврейского этногеографического названия сохраняет неопределённость его точной исторической локализации и не подменяет его интерпретацией «Ливия».
- source_word: אִתָּם
  choice: с ними
  rationale: Точно передаёт предлог с местоименным суффиксом; в русском именная конструкция естественно обходится без добавленного глагола-связки.
- source_word: כֻּלָּם
  choice: все они
  rationale: Сохраняет явное обобщение и подчёркивает, что описание относится ко всем названным союзникам.
- source_word: מָגֵן
  choice: щиты
  rationale: Нейтральное современное обозначение данного вида защитного вооружения; множественное число по-русски естественно при распределении предметов среди множества воинов.
- source_word: כוֹבָע
  choice: шлемы
  rationale: В военном контексте слово обозначает защитный головной убор; «шлем» — ясный и современный русский эквивалент.
theological_decisions: []
