  text: וְ/קָרָ֨אתִי עָלָ֤י/ו לְ/כָל הָרַ/י֙ חֶ֔רֶב נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה חֶ֥רֶב אִ֖ישׁ בְּ/אָחִ֥י/ו תִּֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/021.yaml
  text: And I will summon a sword against him on all my mountains[a], declares the Lord GOD; every man's sword will be against his brother.
translation:
  language: ru
  text: И Я призову против него меч на всех Моих горах, — возвещает Владыка Яхве. — Меч каждого будет против брата его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָרָאתִי
  choice: И Я призову
  rationale: В данном контексте קרא означает призвать или вызвать орудие суда; «призову меч» естественно по-русски передаёт образ Божьего повеления.
- source_word: עָלָיו
  choice: против него
  rationale: Предлог עַל здесь указывает на враждебную направленность суда против Гога.
- source_word: לְכָל הָרַי
  choice: на всех Моих горах
  rationale: Фраза обозначает место суда — горы земли Израиля — и сохраняет притяжательное «Моих».
- source_word: חֶרֶב
  choice: меч
  rationale: Русское употребление допускает форму без неопределённого артикля; образ меча как орудия суда сохраняется.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передано принятой пророческой формулой «возвещает», אֲדֹנָי — как «Владыка», а имя יהוה — транслитерацией «Яхве», что избегает повтора титулов и сохраняет личное имя.
- source_word: חֶרֶב אִישׁ בְּאָחִיו תִּהְיֶה
  choice: Меч каждого обратится против его брата
  rationale: Передаёт распределительное значение אִישׁ и картину взаимного поражения среди воинов; «брата» сохраняет конкретную библейскую метафору собрата.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача «Яхве» сохраняет явное собственное имя в еврейском тексте, а «Владыка» различает предшествующий титул אֲדֹנָי.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные местоимения «Я», «Моих» обозначают речь Бога; синтаксис остаётся ясным и близким к структуре еврейского текста.
