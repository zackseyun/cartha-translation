  rationale: Исправлен добавочный оттенок «обратится» на прямое «будет», соответствующее תִּהְיֶה, и нормализована пунктуация. Сохранены направление суда против Гога, локализация на Божьих горах, личное имя Яхве и образ взаимного насилия без дополнительной интерпретации.
