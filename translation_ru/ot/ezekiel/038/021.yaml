review_pass:
  verdict: revise
  source_fidelity: 'Первая часть в целом верно передаёт וְקָרָאתִי עָלָיו ... חֶרֶב: Бог призывает меч против Гога на всех Своих горах. Однако «Меч каждого обратится против его брата» добавляет глагольный оттенок разворота/поворота, которого в еврейском тексте нет. תִּהְיֶה означает «будет»; следует сохранить прямую формулу о мече каждого против его брата.'
  naturalness: '«Призову против него меч на всех Моих горах» — естественный и ясный современный литературный порядок слов. Формула «Меч каждого будет против брата его» имеет уместно возвышенный пророческий регистр и не требует искусственного «обратится». Оформление слов пророческой формулы в исходном тексте пунктуационно неверно: после имени Бога не должна стоять отдельная закрывающая тире-реплика.'
  terminology: '«Владыка Яхве» точно различает אֲדֹנָי и יהוה и соответствует заявленному принципу передачи личного имени. «Меч» адекватно передаёт חֶרֶב; «брат» сохраняет образ אָח без навязывания более узкого толкования. Ссылочная сноска не нужна: русский вариант не использует альтернативный перевод, а существенной текстологической неоднозначности здесь нет.'
  issues:
  - severity: medium
    issue: Добавлен смысл в «Меч каждого обратится против его брата».
    rationale: Глагол «обратится» обозначает поворот меча и сильнее интерпретирует картину. В оригинале сказано буквально, что меч каждого «будет против брата его».
  - severity: low
    issue: Пунктуация вокруг «возвещает Владыка Яхве» оформлена как две несогласованные тире-реплики.
    rationale: 'Пророческую формулу следует включить в предложение: «..., — возвещает Владыка Яхве. Меч...».'
  revised_text: И Я призову против него меч на всех Моих горах, — возвещает Владыка Яхве. — Меч каждого будет против брата его.
