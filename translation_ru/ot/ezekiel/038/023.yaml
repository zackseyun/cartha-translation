base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/023.yaml
  text: I will show myself great and show myself holy[a], and I will make myself known in the sight of many nations[b]. Then they will know that I am Yahweh.
translation:
  language: ru
  text: Я явлю Своё величие и Свою святость[a] и открою Себя на глазах у многих народов. И они узнают, что Я — Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «возвеличу Себя и освящу Себя». Формы еврейских глаголов могут передавать то, как Бог являет Своё величие и святость.'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. ЙХВХ (тетраграмматон); традиционно переводится: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְגַּדִּלְתִּי
  choice: Я явлю Своё величие
  rationale: Форма хитпаэль передаёт самопроявление Бога. Эта формулировка естественна по-русски, сохраняет значение публичного обнаружения величия и не создаёт впечатления, будто Бог становится более великим.
- source_word: וְהִתְקַדִּשְׁתִּי
  choice: и Свою святость
  rationale: В сочетании с общим сказуемым «явлю» передаёт проявление Богом собственной святости перед народами. Более буквальное «освящу Себя» в современном русском языке двусмысленно и может ошибочно подразумевать приобретение святости.
- source_word: וְנוֹדַעְתִּי
  choice: и открою Себя
  rationale: Нифаль допускает перевод «стану известен», но в последовательности глаголов от первого лица контекст подчёркивает действенное самораскрытие Бога. «Открою Себя» ясно выражает эту силу, не уточняя сверх текста способ откровения.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Русская идиома сохраняет зрительный образ и смысл публичности, оставаясь естественной и понятной.
- source_word: גּוֹיִם רַבִּים
  choice: многих народов
  rationale: В данном контексте גּוֹיִם обозначает многочисленные народы; перевод не привносит более позднее противопоставление иудеев и язычников.
- source_word: וְיָדְעוּ
  choice: И они узнают
  rationale: 'Передаёт результативный оттенок формулы узнавания у Иезекииля: народы придут к знанию личности Бога вследствие Его явленного действия.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача трёх глаголов Божьего самопроявления
  choice: «явлю Своё величие и Свою святость и открою Себя»
  alternative: «возвеличу Себя, освящу Себя и стану известен»
  rationale: Выбранный вариант сохраняет возвратную направленность и публичность действий, но избегает неестественного или богословски двусмысленного впечатления, будто Бог приобретает величие либо святость, которых прежде не имел.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя в исходном тексте сохранено как имя; традиционная замена титулом отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, возвышенный, но доступный. Синтаксический параллелизм оригинала сохранён без буквализмов «освящу Себя» в основном тексте; прописные местоимения употреблены как уважительная русская библейская конвенция.
