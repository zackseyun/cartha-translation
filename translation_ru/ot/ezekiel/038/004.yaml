base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/004.yaml
  text: I will turn you around[a], put hooks in your jaws, and bring you out—you and all your army, horses and horsemen, all of them clothed in full armor, a great assembly with shield and buckler[b], all of them wielding swords.
translation:
  language: ru
  text: Я поверну тебя вспять, вложу крюки в твои челюсти[a] и выведу тебя и всё твоё войско — коней и всадников, всех в полном вооружении, великое множество с большими и малыми щитами[b], всех вооружённых мечами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в твои щёки».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте названы два вида щитов — вероятно, большой щит, прикрывавший тело, и меньший ручной щит.
    reason: cultural_note
lexical_decisions:
- source_word: וְשׁוֹבַבְתִּיךָ
  choice: Я поверну тебя назад
  rationale: Каузативное значение глагола передаёт активное перенаправление Гога Богом; «поверну назад» естественно по-русски и не уточняет маршрут сверх текста.
- source_word: חַחִים בִּלְחָיֶיךָ
  choice: вложу крюки в твои челюсти
  rationale: Образ крюков, служащих для подчинения животного или пленника, сохранён буквально; לֶחִי допускает значения «челюсть» и «щека».
- source_word: וְהוֹצֵאתִי אוֹתְךָ
  choice: и выведу тебя
  rationale: Hiphil от יצא обозначает побуждение выйти; форма «выведу» ясно сохраняет Бога как действующего субъекта.
- source_word: חֵילֶךָ
  choice: со всем твоим войском
  rationale: В военном контексте חַיִל означает вооружённые силы, поэтому «войско» точно и стилистически уместно.
- source_word: סוּסִים וּפָרָשִׁים
  choice: коней и всадников
  rationale: Сохранены оба элемента еврейского военного сочетания без сведения их к обобщённому слову «конница».
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: всех в полном вооружении
  rationale: В непосредственном военном контексте выражение указывает на полное боевое снаряжение; перевод естественен для современного русского языка.
- source_word: קָהָל רָב
  choice: великое множество
  rationale: קָהָל здесь обозначает большую собранную массу воинов; «множество» лучше согласуется с перечислением войск, чем культово окрашенное «собрание».
- source_word: צִנָּה וּמָגֵן
  choice: с большими и малыми щитами
  rationale: Перевод явно передаёт различие двух видов щитов, вероятно большого щита и меньшего ручного щита, не прибегая к малопонятному архаизму.
- source_word: תֹּפְשֵׂי חֲרָבוֹת
  choice: вооружённых мечами
  rationale: Причастный оборот буквально говорит о держащих или носящих мечи; выбранная формулировка естественно выражает боевую готовность.
- source_word: כֻּלָּם
  choice: всех … всех
  rationale: Двойное повторение сохранено, чтобы передать подчёркнутую всеохватность еврейского текста.
theological_decisions:
- issue: Божественное действие в выступлении Гога
  choice: Бог активно поворачивает, подчиняет и выводит Гога с его войском.
  alternative: Бог лишь допускает самостоятельное выступление Гога.
  rationale: Последовательность глаголов первого лица с каузативным значением выражает сильную божественную инициативу. Перевод сохраняет эту напряжённость, не объясняя соотношение Божьего владычества и намерений Гога.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Синтаксис сохраняет нарастающее военное перечисление оригинала; редкие русские названия оружия не используются.
