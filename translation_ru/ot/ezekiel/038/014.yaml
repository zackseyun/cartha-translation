base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/014.yaml
  text: 'Therefore prophesy[a], son of man, and say to Gog, ‘Thus says the Lord GOD: On that day, when my people Israel dwell securely, will you not know it?’'
translation:
  language: ru
  text: 'Поэтому пророчествуй, сын человеческий, и скажи Гогу: «Так говорит Владыка Яхве: в тот день, когда Мой народ Израиль будет жить в безопасности[a], разве ты не узнаешь об этом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет жить без опасений». Еврейское לָבֶטַח может передавать состояние безопасности или защищённости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего пророчества и естественно связывает стихи.
- source_word: הִנָּבֵא
  choice: пророчествуй
  rationale: Прямой и общепринятый русский эквивалент повелительной формы глагола נבא.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет характерное для книги Иезекииля обращение и его литературную последовательность.
- source_word: וְאָמַרְתָּ לְגוֹג
  choice: и скажи Гогу
  rationale: Естественно передаёт следующий за повелением последовательный приказ.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет торжественную пророческую формулу в естественном русском виде.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет собственное Божье имя יהוה, не создавая неестественного сочетания «Господь ГОСПОДЬ».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое и естественное соответствие пророческому временному выражению.
- source_word: בְּשֶׁבֶת עַמִּי יִשְׂרָאֵל
  choice: когда Мой народ Израиль будет жить
  rationale: Инфинитивная конструкция имеет временное значение; будущее время соответствует контексту пророчества и русскому синтаксису.
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: Передаёт состояние защищённой, безопасной жизни; возможный оттенок уверенности отмечен в сноске.
- source_word: הֲלוֹא ... תֵּדָע
  choice: разве ты не узнаешь об этом?
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ. «Об этом» естественно выражает подразумеваемый из контекста предмет знания.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул אֲדֹנָי и собственное имя יהוה, сохраняя их совместное употребление без конфессионального истолкования.
- issue: Смысл תֵּדָע в риторическом вопросе
  choice: разве ты не узнаешь об этом?
  alternative: ты непременно узнаешь; разве ты не заметишь этого?
  rationale: Вопросительная форма исходного текста сохранена, а более конкретное толкование — «заметишь» или «воспользуешься этим» — не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для чтения вслух; устойчивые формулы книги Иезекииля сохранены. Маркер сноски поставлен непосредственно при выражении, к которому относится лексическая альтернатива.
