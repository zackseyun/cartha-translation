base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/017.yaml
  text: 'Thus says the Lord GOD: Are you the one of whom I spoke in former days by the hand of my servants the prophets of Israel[c][b][a], who prophesied in those days for years that I would bring you against them?'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Не ты ли тот, о ком Я говорил в прежние дни через Моих слуг, пророков Израиля,[a] которые в те дни пророчествовали многие годы,[b] что Я приведу тебя против них?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моих слуг»; это еврейский оборот со значением «через, посредством».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в те дни — годы». Необычная формулировка, вероятно, подчёркивает, что пророчества звучали на протяжении многих лет.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт титул אֲדֹנָי естественным русским словом «Владыка» и сохраняет личное имя Яхве, избегая неестественного сочетания «Господь Господь».
- source_word: הַאַתָּה הוּא
  choice: Не ты ли тот
  rationale: Выражает эмфатический вопрос отождествления естественным современным русским оборотом.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: о ком Я говорил
  rationale: Сохраняет личный референт относительного оборота и смысл прежнего пророческого возвещения о Гоге.
- source_word: בְּיָמִים קַדְמוֹנִים
  choice: в прежние дни
  rationale: Точно передаёт временную отсылку, оставаясь понятным и умеренно возвышенным выражением.
- source_word: בְּיַד
  choice: через
  rationale: Естественно передаёт еврейскую идиому «рукой», обозначающую посредничество пророков.
- source_word: עֲבָדַי נְבִיאֵי יִשְׂרָאֵל
  choice: Моих слуг, пророков Израиля
  rationale: «Слуги» уместно для посланников Бога; приложение ясно отождествляет их как пророков Израиля.
- source_word: הַנִּבְּאִים בַּיָּמִים הָהֵם שָׁנִים
  choice: которые в те дни пророчествовали многие годы
  rationale: Сохраняет необычное соединение «в те дни — годы» и передаёт вероятный акцент на продолжительности пророческого свидетельства.
- source_word: לְהָבִיא אֹתְךָ עֲלֵיהֶם
  choice: что Я приведу тебя против них
  rationale: Инфинитив понят как содержание прежнего пророчества; «против них» соответствует враждебному военному контексту.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбор сохраняет различие между титулом אֲדֹנָי и личным именем יהוה, не внося конфессионального истолкования.
- issue: Связь прежних пророчеств с Гогом
  choice: риторический вопрос «Не ты ли тот…?»
  alternative: утверждение «Ты тот…»
  rationale: В еврейском тексте присутствует вопросительная частица; вопрос сохраняет напряжение текста и не превращается в более категоричное утверждение.
- issue: Синтаксическая роль לְהָבִיא
  choice: 'содержание пророчества: «что Я приведу»'
  alternative: 'цель: «чтобы привести»'
  rationale: Контекст допускает оттенок цели, однако содержание многолетнего пророчества по-русски яснее выражено придаточным с «что».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок слов и риторический вопрос сохраняют торжественность, но буквальная еврейская идиома בְּיַד вынесена в примечание ради естественности основного текста.
