base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/019.yaml
  text: 'For in my jealousy[a], in the fire of my wrath, I have spoken: surely on that day there will be a great earthquake upon the land of Israel.'
translation:
  language: ru
  text: 'Ибо в ревности Моей, в огне ярости Моей Я сказал: «Непременно в тот день на земле Израиля произойдёт великое землетрясение[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое сотрясение» или «великая дрожь». Еврейское רַעַשׁ может обозначать сотрясение в более широком смысле, хотя в данном контексте хорошо подходит «землетрясение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקִנְאָתִי
  choice: И в ревности Моей
  rationale: Начальный союз ו передан как «и», поскольку стих продолжает предшествующую прямую речь. קִנְאָה здесь обозначает сильную, личную ревность Бога; вариант «рвение» чрезмерно смягчил бы эмоциональную силу контекста.
- source_word: בְאֵשׁ עֶבְרָתִי
  choice: в огне ярости Моей
  rationale: Сохранён буквальный образ огня, выражающий силу гнева. עֶבְרָה обозначает бурный, переполняющий гнев, поэтому «ярость» здесь естественно и выразительно.
- source_word: דִּבַּרְתִּי
  choice: Я сказал
  rationale: Перфект передаёт завершённое и торжественное Божье высказывание. Русское «сказал» прямо соответствует глаголу и не добавляет оттенка, отсутствующего в исходном тексте.
- source_word: אִם לֹא
  choice: непременно
  rationale: Сочетание употреблено как клятвенное усиление, а не как буквальное условие «если не». «Непременно» естественно передаёт категорическую уверенность утверждения.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Сохранена обычная пророческая временная формула; это также наиболее естественное русское соответствие.
- source_word: יִהְיֶה
  choice: произойдёт
  rationale: Экзистенциальное היה с обозначением события по-русски естественно передаётся глаголом «произойдёт».
- source_word: רַעַשׁ גָּדוֹל
  choice: великое землетрясение
  rationale: רַעַשׁ может обозначать сильное сотрясение или дрожь; в сочетании с землёй и в данном контексте «землетрясение» является наиболее ясным и естественным основным вариантом, а более широкое значение отмечено в сноске.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: на земле Израиля
  rationale: אַדְמָה означает землю или почву. «На земле Израиля» сохраняет пространственный смысл עַל и звучит естественно, не привнося значения направленности «против».
theological_decisions:
- issue: Передача сильного эмоционального языка о Боге без его смягчения
  choice: «в ревности Моей, в огне ярости Моей»
  alternative: «в рвении Моём, в пылу гнева Моего»
  rationale: Перевод сохраняет личный и напряжённый характер Божьей ревности и ярости, не сводя их к безличному судебному действию и не добавляя богословского объяснения.
- issue: Говорящий — Бог, однако в самом стихе Его имя не названо
  choice: Сохранить первое лицо прямой речи без добавления слов «говорит Господь»
  alternative: Добавить указание на говорящего
  rationale: Контекст ясно указывает на продолжение Божьей речи, но добавление имени или авторской ремарки вышло бы за пределы еврейского текста данного стиха.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием, но без архаизмов. Порядок слов слегка возвышенный и сохраняет накопление образов исходного текста. Местоимения, относящиеся к Богу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
