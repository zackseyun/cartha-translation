  text: וּ/בָ֤אתָ מִ/מְּקֽוֹמְ/ךָ֙ מִ/יַּרְכְּתֵ֣י צָפ֔וֹן אַתָּ֕ה וְ/עַמִּ֥ים רַבִּ֖ים אִתָּ֑/ךְ רֹכְבֵ֤י סוּסִים֙ כֻּלָּ֔/ם קָהָ֥ל גָּד֖וֹל וְ/חַ֥יִל רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/015.yaml
  text: And you will come from your place[a], from the far north—you and many peoples with you[b], all of them riding horses—a great assembly and a mighty army.
translation:
  language: ru
  text: И придёшь ты со своего места, из самых дальних пределов севера[a], ты и многие народы с тобой; все они верхом на конях — великое собрание и многочисленное войско.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «из глубин севера»; еврейский оборот означает самые отдалённые северные области.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: И придёшь ты
  rationale: Перфект qal, 2-е лицо мужского рода единственного числа, в пророческой речи имеет будущее значение. Начальное «И» сохраняет последовательность речи, а постпозиция местоимения естественно передаёт его подчёркнутое употребление.
- source_word: מִמְּקוֹמְךָ
  choice: со своего места
  rationale: מָקוֹם имеет общее значение «место»; возвратное «своего» естественно по-русски при обращении ко второму лицу.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: из самых дальних пределов севера
  rationale: Оборот с יַרְכָּה обозначает отдалённые, крайние области. Перевод сохраняет пространственную образность и полнее передаёт идиому, чем просто «с далёкого севера».
- source_word: אַתָּה וְעַמִּים רַבִּים אִתָּךְ
  choice: ты и многие народы с тобой
  rationale: Самостоятельное местоимение אַתָּה сохраняет смысловое выделение адресата, а עַמִּים передано как «народы», без сужения до политических государств.
- source_word: רֹכְבֵי סוּסִים כֻּלָּם
  choice: все они верхом на конях
  rationale: Причастный оборот буквально описывает едущих на конях. Такая формулировка ясна и не сводит выражение к специальному обозначению рода войск «всадники».
- source_word: קָהָל גָּדוֹל
  choice: великое собрание
  rationale: קָהָל обозначает собравшееся множество. «Собрание» сохраняет широкий смысл слова, не добавляя неодобрительной окраски слов «скопище» или «полчище».
- source_word: וְחַיִל רָב
  choice: и многочисленное войско
  rationale: В данном военном контексте חַיִל означает войско или военную силу, а רָב указывает прежде всего на большую численность или величину.
