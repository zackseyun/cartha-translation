base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/009.yaml
  text: You will come up like a storm; you will be like a cloud covering the land—you and all your troops, and many peoples with you.
translation:
  language: ru
  text: Ты поднимешься и нагрянешь, словно буря; будешь как туча, покрывающая землю, — ты, все твои войска и многие народы с тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹאָה
  choice: буря
  rationale: В данном сравнении слово передаёт образ внезапно надвигающейся разрушительной стихии; «буря» естественно сочетается с последующим образом тучи и не ослабляет угрозу.
- source_word: תָבוֹא
  choice: нагрянешь
  rationale: Передаёт не просто прибытие, а стремительное и угрожающее наступление в контексте образа бури.
- source_word: אֲגַפֶּיךָ
  choice: твои войска
  rationale: В военном контексте множественное число обозначает боевые подразделения или силы, сопровождающие Гога; «войска» ясно и естественно для современного читателя.
- source_word: לְכַסּוֹת הָאָרֶץ
  choice: покрывающая землю
  rationale: Причастная конструкция по-русски естественно передаёт образ тучи, которая закрывает всю землю, сохраняя значение еврейского инфинитива цели/результата.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены последовательные образы наступающей бури и тучи, покрывающей землю; формулировка не уточняет географический объём слова «земля» там, где еврейский текст допускает также значение «страна».
