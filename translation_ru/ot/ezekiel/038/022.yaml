base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/022.yaml
  text: And I will enter into judgment with him by pestilence and bloodshed[a]; and I will rain down on him, on his troops, and on the many peoples who are with him, torrential rain, hailstones, fire[c][b], and sulfur.
translation:
  language: ru
  text: И Я буду судиться с ним, поражая его мором и кровопролитием; и пролью на него, на его воинские отряды[a] и на многочисленные народы, которые с ним, проливной дождь, град, огонь и серу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на его войска»; еврейское слово обозначает сопровождающие его воинские силы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: И Я буду судиться с ним
  rationale: Возвратная форма «судиться с ним» сохраняет судебный оттенок нифаля שׁפט с предлогом אֵת и естественно передаёт направленность суда против Гога, не заменяя образ общим «накажу».
- source_word: בְּדֶבֶר וּבְדָם
  choice: поражая его мором и кровопролитием
  rationale: Инструментальное בְּ передано деепричастным оборотом для ясного русского синтаксиса. דֶּבֶר означает эпидемическую губительную болезнь, а דָּם здесь метонимически указывает на насильственную смерть и пролитие крови.
- source_word: וְגֶשֶׁם שׁוֹטֵף
  choice: проливной дождь
  rationale: Сочетание обозначает мощный, всё заливающий ливень; «проливной дождь» естественно и точно передаёт эту картину в современном русском языке.
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: град
  rationale: Словосочетание буквально описывает камни града. Русское «град» передаёт обозначаемое явление без ненужной тяжеловесности.
- source_word: אֵשׁ וְגָפְרִית
  choice: огонь и серу
  rationale: Прямые современные соответствия сохраняют конкретность образов суда и не используют архаизированную формулу.
- source_word: אַמְטִיר עָלָיו
  choice: пролью на него
  rationale: Хифиль глагола מטר означает «заставлю пролиться дождём». В русском «пролью на него» естественно распространяется на весь последующий перечень ниспосылаемых бедствий.
- source_word: אֲגַפָּיו
  choice: его полчища
  rationale: В военном контексте слово обозначает сопровождающие Гога отряды или воинские силы. «Полчища» сохраняет собирательный военный смысл; возможные значения отмечены в сноске.
- source_word: עַמִּים רַבִּים אֲשֶׁר אִתּוֹ
  choice: многочисленные народы, которые с ним
  rationale: עַמִּים передано как «народы», а не политически более узкое «государства»; относительное придаточное сохраняет связь этих народов с Гогом.
theological_decisions:
- issue: Характер образов Божьего суда
  choice: Перечень передан как конкретно объявленные действия Божьего суда.
  alternative: Истолковать бедствия непосредственно в переводе как исключительно символические.
  rationale: Еврейский текст прямо возвещает мор, кровопролитие и ниспосланные с неба бедствия. Перевод сохраняет конкретность и богословское напряжение пророчества, не предрешая вопрос о символическом или буквальном исполнении.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавное «Я» обозначает говорящего Господа. Синтаксис сохраняет судебное вступление и нарастающий перечень бедствий, оставаясь понятным при чтении вслух.
