source:
  edition: WLC
  text: וְ/רָעֲשׁ֣וּ מִ/פָּנַ֡/י דְּגֵ֣י הַ/יָּם֩ וְ/ע֨וֹף הַ/שָּׁמַ֜יִם וְ/חַיַּ֣ת הַ/שָּׂדֶ֗ה וְ/כָל הָ/רֶ֨מֶשׂ֙ הָ/רֹמֵ֣שׂ עַל הָֽ/אֲדָמָ֔ה וְ/כֹל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וְ/נֶהֶרְס֣וּ הֶ/הָרִ֗ים וְ/נָֽפְלוּ֙ הַ/מַּדְרֵג֔וֹת וְ/כָל חוֹמָ֖ה לָ/אָ֥רֶץ תִּפּֽוֹל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/020.yaml
  text: The fish of the sea[a], the birds of the heavens, the beasts of the field, every creeping thing that creeps on the ground, and every man who is on the face of the earth will quake at my presence; the mountains will be thrown down, the cliffs will fall, and every wall will fall to the ground.
translation:
  language: ru
  text: И содрогнутся предо Мною рыбы морские, птицы небесные, звери полевые, все ползающие по земле существа и все люди, живущие по всей земле; горы обрушатся, крутые склоны рухнут, и всякая стена упадёт на землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָעֲשׁוּ
  choice: содрогнутся
  rationale: Глагол רעשׁ обозначает сильное сотрясение или дрожь; «содрогнутся» естественно сочетается со всеми одушевлёнными подлежащими и поддерживает образ землетрясения.
- source_word: מִפָּנַי
  choice: предо Мною
  rationale: Буквально «от Моего лица»; традиционно возвышенное, но понятное русское выражение передаёт реакцию на непосредственное присутствие Бога, не уточняя сверх текста, идёт ли речь о страхе или физическом сотрясении.
- source_word: דְּגֵי הַיָּם
  choice: рыбы морские
  rationale: Естественная русская конструкция, точно передающая еврейское сочетание.
- source_word: עוֹף הַשָּׁמַיִם
  choice: птицы небесные
  rationale: Сохраняет возвышенный регистр и пространственную картину еврейского выражения, оставаясь понятным современному читателю.
- source_word: חַיַּת הַשָּׂדֶה
  choice: звери полевые
  rationale: Устойчивое библейское выражение для наземных, преимущественно диких животных; оно сохраняет структуру исходного текста.
- source_word: כָּל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאֲדָמָה
  choice: все пресмыкающиеся, ползающие по земле
  rationale: Передаёт родственную словесную пару רמשׂ без неестественного русского повтора одного корня; охватывает мелких существ, передвигающихся у земли.
- source_word: וְכֹל הָאָדָם אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: и все люди, живущие по всей земле
  rationale: אָדָם употреблено собирательно и обозначает человечество; русское множественное «все люди» точно и естественно передаёт этот смысл. Оборот עַל־פְּנֵי הָאֲדָמָה идиоматически означает пребывание по поверхности всей земли.
- source_word: וְנֶהֶרְסוּ הֶהָרִים
  choice: горы обрушатся
  rationale: Нифаль от הרס выражает разрушение и низвержение; «обрушатся» ясно передаёт катастрофическое разрушение гор.
- source_word: הַמַּדְרֵגוֹת
  choice: крутые склоны
  rationale: Редкое слово обозначает ступенчатые или крутые места. «Крутые склоны» сохраняет топографическую неопределённость лучше, чем более узкое «утёсы» или современно-хозяйственное «террасы».
- source_word: וְכָל חוֹמָה לָאָרֶץ תִּפּוֹל
  choice: и всякая стена упадёт на землю
  rationale: Формально и естественно воспроизводит универсальность כָל и образ полного падения, выраженный לָאָרֶץ.
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: все люди
  alternative: весь род человеческий; каждый человек
  rationale: В контексте перечисления всех живых существ существительное אָדָם имеет собирательное значение «человечество». «Все люди» передаёт его без неоправданного сужения до мужчин и без добавления конфессионального толкования.
- issue: Значение מִפָּנַי как причины содрогания
  choice: предо Мною
  alternative: от Моего присутствия; перед Моим лицом
  rationale: Выбранный вариант сохраняет образ Божьего лица/присутствия и допускает как причинный, так и пространственно-реляционный оттенок исходного оборота.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис перечисления сохранён, но разделён естественной русской пунктуацией. Архаизмы сведены к понятному формульному «предо Мною»; редкое הַמַּדְרֵגוֹת передано без чрезмерной конкретизации.
