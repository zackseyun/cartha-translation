  text: מִ/יָּמִ֣ים רַבִּים֮ תִּפָּקֵד֒ בְּ/אַחֲרִ֨ית הַ/שָּׁנִ֜ים תָּב֣וֹא אֶל אֶ֣רֶץ מְשׁוֹבֶ֣בֶת מֵ/חֶ֗רֶב מְקֻבֶּ֨צֶת֙ מֵ/עַמִּ֣ים רַבִּ֔ים עַ֚ל הָרֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר הָי֥וּ לְ/חָרְבָּ֖ה תָּמִ֑יד וְ/הִיא֙ מֵ/עַמִּ֣ים הוּצָ֔אָה וְ/יָשְׁב֥וּ לָ/בֶ֖טַח כֻּלָּֽ/ם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/008.yaml
  text: After many days you will be mustered[a]; in the latter years you will come into a land restored from the sword, gathered from many peoples, onto the mountains of Israel, which had been a continual waste; but it was brought out from the peoples[b], and all of them will dwell securely.
translation:
  language: ru
  text: По прошествии многих дней тебя призовут[a]. В последние годы[b] ты придёшь в землю, оправившуюся от меча, жители которой собраны из многих народов, — на горы Израиля, которые долгое время оставались опустошёнными. Она была выведена из среды народов[c], и все они будут жить в безопасности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будешь созван», «будешь призван». Глагол может также означать «будешь посещён». Здесь контекст, вероятно, подразумевает призыв или сбор для действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в последней части лет»; в еврейском здесь не употреблено выражение «в последние дни».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «и она была выведена из народов». «Она» относится к земле, олицетворённо представляющей её жителей; последующее «все они» относится к людям.'
    reason: source_syntax
lexical_decisions:
- source_word: תִּפָּקֵד
  choice: ты будешь призван
  rationale: Нифаль глагола פקד допускает значения призыва, сбора или назначения; в контексте предстоящего похода «призван» естественно передаёт военный оттенок, не делая его чрезмерно явным.
- source_word: בְּאַחֲרִית הַשָּׁנִים
  choice: в последние годы
  rationale: Передаёт буквальное указание на последнюю часть «лет» и не подменяет его более привычной пророческой формулой «в последние дни».
- source_word: אֶרֶץ מְשׁוֹבֶבֶת מֵחֶרֶב
  choice: землю, восстановленную после меча
  rationale: מְשׁוֹבֶבֶת выражает возвращение или восстановление, а «меч» метонимически обозначает военное разорение; формулировка сохраняет образ меча.
- source_word: מְקֻבֶּצֶת מֵעַמִּים רַבִּים
  choice: к народу, собранному из многих народов
  rationale: В еврейском определение грамматически относится к «земле», но по смыслу собраны её жители. Русская формулировка делает коллективный смысл понятным, сохраняя «многие народы».
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: на горы Израиля
  rationale: С глаголом движения עַל обозначает направленность на горы; «на горы» естественно и точно по-русски.
- source_word: אֲשֶׁר הָיוּ לְחָרְבָּה תָּמִיד
  choice: которые долгое время оставались опустошёнными
  rationale: Множественное הָיוּ связывает придаточное с горами. תָּמִיד здесь передаёт длительное, непрерывное состояние запустения, а не обязательно абсолютную вечность.
- source_word: וְהִיא מֵעַמִּים הוּצָאָה
  choice: Жителей этой земли вывели из среды народов
  rationale: Буквально женское местоимение указывает на землю как коллективную общность. Экспликация «жителей» даёт естественный русский текст и согласуется с последующим множественным «все они»; буквальная особенность отмечена в сноске.
- source_word: וְיָשְׁבוּ לָבֶטַח כֻּלָּם
  choice: и все они будут жить в безопасности
  rationale: Устойчивое сочетание ישב לבטח означает безопасное, спокойное проживание; «все они» сохраняет явное כֻּלָּם.
theological_decisions:
- issue: Эсхатологическая временная формула
  choice: в последние годы
  alternative: в последние дни
  rationale: В тексте сказано «последняя часть лет», а не обычное выражение «последние дни»; перевод не гармонизирует разные пророческие формулы.
- issue: Земля как коллективное обозначение её населения
  choice: к народу, собранному… Жителей этой земли вывели
  alternative: землю, собранную… её вывели
  rationale: Еврейский текст грамматически олицетворяет землю, говоря о ней как о выведенной из народов, однако последующее множественное число указывает на жителей. Основной текст передаёт смысл естественно, а формальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис разделён на ясные фразы; образ «меча» и географическое выражение «горы Израиля» сохранены. Необычное еврейское олицетворение земли раскрыто в основном тексте и отмечено в сноске.
