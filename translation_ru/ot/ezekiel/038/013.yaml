base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/013.yaml
  text: Sheba and Dedan and the merchants of Tarshish, with all her young lions, will say to you, ‘Have you come to take plunder? Have you assembled your company to seize silver and gold, to take livestock and goods, to take great plunder?’
translation:
  language: ru
  text: 'Сава и Дедан, купцы Фарсиса и все его молодые львы[a] скажут тебе: «Разве ты пришёл захватить добычу? Разве ты собрал своё войско, чтобы захватить серебро и золото, забрать скот и имущество, захватить великую добычу?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Молодые львы» — буквальный перевод масоретской огласовки; возможно, образно имеются в виду влиятельные люди или предводители Фарсиса. При другом прочтении тех же согласных возможно: «селения».'
    reason: Сохраняет буквальное чтение WLC и кратко отмечает реальную альтернативу без выбора спорного толкования.
lexical_decisions:
- source_word: שְׁבָא וּדְדָן
  choice: Сава и Дедан
  rationale: Традиционные русские формы библейских географических названий.
- source_word: סֹחֲרֵי תַרְשִׁישׁ
  choice: купцы Фарсиса
  rationale: Передаёт торговый смысл סֹחֲרִים и сохраняет традиционную русскую форму топонима.
- source_word: כְּפִירֶיהָ
  choice: его молодые львы
  rationale: Буквально сохраняет яркую и неоднозначную метафору исходного текста; местоимение женского рода в еврейском относится к Фарсису, но по-русски согласуется с названием в мужском роде.
- source_word: שָׁלָל / בַּז
  choice: добыча
  rationale: Оба близких по значению слова относятся к военной добыче; единая передача естественно воспроизводит повтор и цель похода.
- source_word: קְהָלֶךָ
  choice: своё полчище
  rationale: В данном военном контексте обозначает собранное множество или войско; «полчище» сохраняет массовость и военную окраску.
- source_word: מִקְנֶה וְקִנְיָן
  choice: скот и имущество
  rationale: מִקְנֶה — домашний скот, קִנְיָן — приобретённое имущество или собственность.
theological_decisions:
- issue: Мотив вопроса купцов и «молодых львов»
  choice: Сохранены риторические вопросы без уточнения, осуждают ли говорящие поход или рассчитывают участвовать в торговле добычей.
  alternative: Истолковать реплики как явное неодобрение либо как корыстное ожидание прибыли.
  rationale: Еврейский текст передаёт вопросы, но не разъясняет намерения говорящих; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический параллелизм и повтор «добыча» сохранены; синтаксис слегка упорядочен ради ясности.
