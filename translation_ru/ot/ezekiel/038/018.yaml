base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/018.yaml
  text: And it will happen on that day[a], on the day when Gog comes against the land of Israel, declares the Lord GOD, that my wrath will rise up in my nostrils.
translation:
  language: ru
  text: И будет в тот день, в день, когда Гог придёт против земли Израиля, — возвещает Владыка Яхве, — во Мне поднимется Моя ярость.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ярость Моя поднимется в носу (или: ноздрях) Моём»; в еврейском языке «нос» также служит образом гнева.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет формульное пророческое введение и звучит естественно в современном литературном русском.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчиво передаёт временную формулу пророческой речи.
- source_word: בְּיוֹם בּוֹא גוֹג
  choice: в день, когда Гог придёт
  rationale: Инфинитивная конструкция естественно передаётся временным придаточным.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: на землю Израиля
  rationale: עַל при глаголе движения допускает пространственное «на»; враждебный характер прихода понятен из контекста, поэтому не добавляется прямо в предлог.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» передаёт пророческую формулу נְאֻם, «Владыка» — титул אֲדֹנָי, а «Яхве» сохраняет личное Божье имя.
- source_word: תַּעֲלֶה חֲמָתִי
  choice: ярость Моя поднимется
  rationale: Сохраняет метафору подъёма сильного, пылающего гнева и торжественный регистр.
- source_word: בְּאַפִּי
  choice: в гневе Моём
  rationale: Передаёт идиоматическое значение אַף «гнев» естественным русским выражением; буквальный образ носа отмечен в сноске.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Так различаются титул אֲדֹנָי и собственное имя יהוה без превращения двух разных еврейских обозначений в общие титулы.
- issue: Антропоморфный образ בְּאַפִּי
  choice: в гневе Моём
  alternative: в ноздрях Моих
  rationale: Основной текст передаёт установленное идиоматическое значение, а сноска сохраняет конкретный телесный образ и возможную экспрессию оригинала.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Инверсия «ярость Моя» поддерживает библейский регистр, не делая текст архаичным; вставное «возвещает Владыка Яхве» выделено тире для ясности.
