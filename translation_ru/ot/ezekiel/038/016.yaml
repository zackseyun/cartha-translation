  text: וְ/עָלִ֨יתָ֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל כֶּֽ/עָנָ֖ן לְ/כַסּ֣וֹת הָ/אָ֑רֶץ בְּ/אַחֲרִ֨ית הַ/יָּמִ֜ים תִּֽהְיֶ֗ה וַ/הֲבִאוֹתִ֨י/ךָ֙ עַל אַרְצִ֔/י לְמַעַן֩ דַּ֨עַת הַ/גּוֹיִ֜ם אֹתִ֗/י בְּ/הִקָּדְשִׁ֥/י בְ/ךָ֛ לְ/עֵינֵי/הֶ֖ם גּֽוֹג־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/016.yaml
  text: And you will come up against my people Israel like a cloud to cover the land. In the latter days it will happen that I will bring you against my land[a], so that the nations may know me when I show myself holy through you before their eyes, O Gog.
translation:
  language: ru
  text: 'И ты выступишь против Моего народа Израиля, словно туча, чтобы покрыть землю. В последние дни это произойдёт: Я приведу тебя против Моей земли, чтобы народы познали Меня, когда Я явлю на тебе Свою святость у них на глазах, Гог.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «когда Я освящусь в тебе у них на глазах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלִיתָ עַל עַמִּי יִשְׂרָאֵל
  choice: И ты выступишь против Моего народа Израиля
  rationale: Глагол עלה буквально обозначает подъём или восхождение, но в контексте военного движения в сочетании с עַל естественно означает выступить против кого-либо. Формулировка сохраняет образ движения и враждебную направленность.
- source_word: כֶּעָנָן לְכַסּוֹת הָאָרֶץ
  choice: словно туча, чтобы покрыть землю
  rationale: Сравнение передано прямо. В данном контексте הָאָרֶץ относится прежде всего к земле Израиля, а целевой инфинитив לְכַסּוֹת передан оборотом «чтобы покрыть».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: В последние дни
  rationale: Устойчивое пророческое выражение передано привычно и понятно, без уточнения конкретной эсхатологической схемы.
- source_word: תִּהְיֶה
  choice: это произойдёт
  rationale: Форма женского рода, вероятно, указывает на описанное событие или обстоятельство; событийная формулировка естественна по-русски.
- source_word: וַהֲבִיאוֹתִיךָ עַל אַרְצִי
  choice: Я приведу тебя против Моей земли
  rationale: 'Каузативная форма בוא выражает Божье действие: Он приводит Гога. Предлог עַל в военном контексте имеет враждебное значение «против».'
- source_word: לְמַעַן דַּעַת הַגּוֹיִם אֹתִי
  choice: чтобы народы познали Меня
  rationale: Переданы цель действия и более широкое, в том числе опытно-реляционное, значение ידע, не сведённое к простому получению сведений.
- source_word: בְּהִקָּדְשִׁי בְךָ
  choice: когда Я явлю через тебя Мою святость
  rationale: Нифаль выражает публичное явление Божьей святости. «Через тебя» естественно передаёт инструментальную силу בְךָ и не создаёт впечатления, будто Бог становится святее.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Живой современный русский оборот сохраняет значение публичности и видимости происходящего.
- source_word: גּוֹג
  choice: Гог
  rationale: Имя в конце фразы имеет функцию обращения; русский синтаксис позволяет передать её без частицы «о».
theological_decisions:
- issue: Эсхатологическое выражение בְּאַחֲרִית הַיָּמִים
  choice: В последние дни
  alternative: В последующие дни; в конце дней
  rationale: Основной вариант сохраняет эсхатологический вес пророческой формулы, но сам по себе не навязывает детальной хронологии или конфессиональной схемы.
- issue: Язык Божьего самоосвящения בְּהִקָּדְשִׁי בְךָ
  choice: когда Я явлю через тебя Мою святость
  alternative: когда Я освящусь в тебе
  rationale: Основной текст ясно сообщает о публичном обнаружении Божьей святости через действия в отношении Гога, не предполагая изменения нравственного состояния Бога. Буквальная и богословски напряжённая формулировка сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Прописные местоимения при обращении к Богу использованы в соответствии с принятой русской библейской традицией. Слово «туча» выбрано вместо нейтрального «облако», поскольку в контексте нашествия лучше передаёт массивность и угрожающий оттенок образа.
