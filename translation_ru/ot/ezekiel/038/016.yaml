revisions:
- from: 'И ты выступишь против Моего народа Израиля, словно туча, чтобы покрыть землю. В последние дни это произойдёт: Я приведу тебя против Моей земли, чтобы народы познали Меня, когда Я явлю через тебя Мою святость у них на глазах, Гог.[a]'
  to: 'И ты выступишь против Моего народа Израиля, словно туча, чтобы покрыть землю. В последние дни это произойдёт: Я приведу тебя против Моей земли, чтобы народы познали Меня, когда Я явлю на тебе Свою святость у них на глазах, Гог.[a]'
  rationale: Изменено только «явлю через тебя Мою святость» на «явлю на тебе Свою святость». Это точнее отражает בְּהִקָּדְשִׁי בְךָ в непосредственном контексте суда над Гогом, при этом современное «явлю Свою святость» избегает ложного представления, будто Бог становится святым. Буквальная альтернатива сохранена в примечании.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:36:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Перевод в целом точно передаёт военное движение Гога против Израиля, образ облака, пророческую временную формулу, Божье приведение Гога на Свою землю и цель — познание Бога народами. Однако «явлю через тебя Мою святость» несколько смещает בְּךָ в сторону действия посредством Гога как орудия. В данном контексте безопаснее передать публичное явление Божьей святости на самом Гоге: «явлю на тебе Свою святость».'
  naturalness: Текст звучит современно и сохраняет пророческую торжественность. «Выступишь против», «словно туча», «это произойдёт» и «у них на глазах» естественны. Замена «через тебя» на «на тебе» также естественна в библейско-пророческом регистре и яснее связывает явление святости с судом над Гогом.
  terminology: «Народ Израиля», «Моя земля», «познали Меня», «последние дни» и имя «Гог» переданы последовательно. «В последние дни» сохраняет традиционную пророческую формулу без навязывания конкретной эсхатологической системы. В примечании уместно сохранить более буквальное «освящусь в тебе».
  issues:
  - severity: medium
    issue: Смысловой оттенок выражения «через тебя»
    rationale: Еврейское בְּךָ буквально означает «в тебе/на тебе»; в контексте явления Божьей святости перед народами речь относится к Гогу как к объекту Божьего действия. «Через тебя» допустимо как интерпретация, отражённая английским аудитом, но может создать впечатление, что Гог является главным посредником этого явления. «На тебе» сохраняет контекст суда и не устраняет исходную напряжённость.
