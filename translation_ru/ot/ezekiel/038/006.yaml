  text: גֹּ֚מֶר וְ/כָל אֲגַפֶּ֔י/הָ בֵּ֚ית תּֽוֹגַרְמָ֔ה יַרְכְּתֵ֥י צָפ֖וֹן וְ/אֶת כָּל אֲגַפָּ֑י/ו עַמִּ֥ים רַבִּ֖ים אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/006.yaml
  text: Gomer and all its troops[b][a], the house of Togarmah from the far north and all its troops—many peoples are with you.
translation:
  language: ru
  text: Гомер и все его отряды[a], дом Фогармы с дальнего севера и все его отряды; многие народы с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все его крылья», «все его подразделения». Еврейское слово может обозначать крылья, края либо примыкающие воинские подразделения; здесь по контексту переведено как «отряды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֶר
  choice: Гомер
  rationale: Устоявшаяся русская библейская передача названия народа; имя транслитерировано, а не переведено.
- source_word: אֲגַפֶּיהָ / אֲגַפָּיו
  choice: все его отряды
  rationale: Слово может буквально обозначать «крылья», края или примыкающие подразделения; в военном перечне естественно передать его как «отряды». Различие рода местоименных суффиксов в еврейском тексте по-русски здесь не выражается.
- source_word: בֵּית תּוֹגַרְמָה
  choice: дом Фогармы
  rationale: Сохранён еврейский этногеографический оборот «дом» и использована традиционная русская форма имени.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: с дальнего севера
  rationale: Оборот указывает на удалённые северные пределы; эта передача естественна в современном русском языке.
- source_word: עַמִּים רַבִּים
  choice: многие народы
  rationale: Сохраняет значение этнических общностей и не сужает его до политических государств.
- source_word: אִתָּךְ
  choice: с тобой
  rationale: Прямая и естественная передача предлога с местоименным суффиксом; грамматический женский род еврейской формы в русском переводе специально не обозначается.
