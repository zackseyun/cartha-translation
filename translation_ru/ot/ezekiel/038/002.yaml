  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל גּוֹג֙ אֶ֣רֶץ הַ/מָּג֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֣שֶׁךְ וְ/תֻבָ֑ל וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/002.yaml
  text: Son of man, set your face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him.
translation:
  language: ru
  text: Сын человеческий, обрати своё лицо к Гогу из земли Магог, верховному[a] князю Мешеха и Тувала, и пророчествуй против него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князю Роша, Мешеха и Тувала». Еврейское слово, переданное как «верховному», может пониматься либо как «главный», либо как название Рош.'
    reason: Сохраняет спорную интерпретацию еврейского רֹאשׁ без навязывания географических или эсхатологических отождествлений.
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Сын человеческий
  rationale: Устойчивое и близкое к форме еврейского текста обращение к Иезекиилю; сохраняет библейское достоинство и смысл «человек, смертный».
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: обрати лицо своё к
  rationale: Сохраняет телесную метафору и повелительную силу исходного выражения, не сводя его просто к «выступи против».
- source_word: גּוֹג אֶרֶץ הַמָּגוֹג
  choice: Гогу из земли Магог
  rationale: Передаёт Гога как лицо, связанное с землёй Магог, в соответствии с синтаксисом и контекстом.
- source_word: נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל
  choice: верховному князю Мешеха и Тувала
  rationale: רֹאשׁ понято как определение «главный, верховный», а не как имя собственное «Рош»; это естественно согласуется с конструкцией и масоретской акцентуацией, хотя грамматически обсуждается.
- source_word: וְהִנָּבֵא עָלָיו
  choice: и пророчествуй против него
  rationale: Предлог עַל в данном контексте вводит направленное против адресата пророчество суда.
theological_decisions:
- issue: Следует ли понимать רֹאשׁ как географическое имя «Рош» или как титульное определение
  choice: верховному князю Мешеха и Тувала
  alternative: князю Роша, Мешеха и Тувала
  rationale: Выбрано нарицательное значение «главный/верховный», поддерживаемое обычной лексикой и синтаксической связью; спорный вариант не превращён в догматическое или эсхатологическое отождествление.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного пророческого регистра. Имена переданы в традиционной русской библейской форме; архаическое «лице» заменено современным «лицо», при этом исходная метафора сохранена.
