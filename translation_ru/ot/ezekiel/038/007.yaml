  text: Be prepared[b][a], and prepare yourself—you and all your assembly who are gathered around you—and be a guard for them.
translation:
  language: ru
  text: Будь готов и приготовься — ты и всё твоё собрание, собравшееся вокруг тебя, — и будь для них стражем[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь для них на страже» или «будь их стражем». Еврейское слово может обозначать охрану, надзор или обязанность охранять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֹּן וְהָכֵן לְךָ
  choice: Будь готов и приготовься
  rationale: 'Два однокоренных повеления передают усиленный призыв к готовности: первое обозначает состояние готовности, второе — деятельное приготовление себя.'
- source_word: קְהָלֶךָ
  choice: всё твоё сборище
  rationale: קהל означает собранную группу; в данном военном контексте «сборище» сохраняет собирательный смысл и не уточняет состав войска сверх текста.
- source_word: הַנִּקְהָלִים עָלֶיךָ
  choice: собравшееся вокруг тебя
  rationale: Причастие описывает тех, кто собрался при Гоге; «вокруг тебя» естественно передаёт контекстуальное значение עָלֶיךָ.
- source_word: וְהָיִיתָ לָהֶם לְמִשְׁמָר
  choice: и будь для них стражем
  rationale: מִשְׁמָר может обозначать стражу, охрану, надзор или ответственность за охрану. «Стражем» кратко сохраняет образ и исходную неоднозначность роли.
