base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/010.yaml
  text: 'Thus says the Lord GOD: On that day[a], things will come up in your heart[b], and you will devise an evil plan.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «В тот день тебе на сердце[a] придут мысли[b], и ты замыслишь злое».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на сердце твоё». В древнееврейском употреблении «сердце» — средоточие не только чувств, но также мысли и воли.'
    reason: cultural_note
  - marker: b
    text: 'Или: «на сердце придут дела (обстоятельства)». Еврейское слово может означать «слова» или, в зависимости от контекста, «дела, обстоятельства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и естественная для современного русского языка пророческая формула, сохраняющая торжественный регистр.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: «Владыка» передаёт אֲדֹנָי, а традиционное выделение «ГОСПОДЬ» обозначает тетраграмматон и позволяет избежать неестественного сочетания «Господь ГОСПОДЬ».
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественно передаёт временное введение будущего события без буквального воспроизведения служебной конструкции с היה.
- source_word: יַעֲלוּ דְבָרִים
  choice: возникнут замыслы
  rationale: В сочетании с сердцем и последующим намеренным планированием דְבָרִים обозначает возникающее внутреннее содержание; «замыслы» естественнее буквальных «слова» или расплывчатых «вещи».
- source_word: עַל לְבָבֶךָ
  choice: в сердце твоём
  rationale: Сохраняет древнееврейский образ сердца как средоточия мысли и воли и звучит понятно по-русски.
- source_word: וְחָשַׁבְתָּ מַחֲשֶׁבֶת רָעָה
  choice: и ты задумаешь злое дело
  rationale: Однокоренная конструкция подчёркивает сознательное намерение. «Задумаешь злое дело» передаёт и планирование, и нравственную оценку, не создавая тяжёлого повтора.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  alternative: Владыка Яхве
  rationale: Основной текст следует укоренённой русской библейской традиции передачи тетраграмматона словом «ГОСПОДЬ», при этом отдельное «Владыка» ясно передаёт אֲדֹנָי и сохраняет различие двух элементов титула.
- issue: Локализация злого намерения в «сердце»
  choice: сохранить «в сердце твоём»
  alternative: «у тебя в мыслях»
  rationale: Древнееврейское לֵבָב охватывает разум, волю и намерение; замена одним лишь «мыслями» сузила бы антропологический образ исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и ясный; порядок «в сердце твоём» слегка возвышенный, но естественный для библейского регистра. Подлинная смысловая широта דְבָרִים передана контекстуальным словом «замыслы», согласованным с последующей фразой о сознательном злом намерении.
