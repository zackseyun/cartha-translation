  text: I will drench the land with your flowing blood up to the mountains[c][b][a], and the ravines will be filled with you.
translation:
  language: ru
  text: Я пропитаю землю твоей льющейся кровью до самых гор[a], и русла[b] наполнятся тобой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для понимания. Возможный перевод: «Я напою землю твоим излиянием — твоей кровью — до самых гор».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ущелья», «протоки» или «речные ложа».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «наполнятся из тебя»; вероятно, имеются в виду кровь или останки поверженного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקֵיתִי
  choice: Я пропитаю
  rationale: Гифиль глагола שׁקה буквально означает «дать пить, напоить, оросить». В образе суда «пропитаю» естественно передаёт насыщение земли кровью и сохраняет силу метафоры.
- source_word: אֶרֶץ
  choice: землю
  rationale: Здесь אֶרֶץ обозначает местность, на которую изливается кровь; русское «землю» подходит и как название территории, и как почва в этом образе.
- source_word: צָפָתְךָ מִדָּמְךָ
  choice: твоей льющейся кровью
  rationale: Редкое и трудное צָפָתְךָ, вероятно, связано с излиянием или потоком, а מִדָּמְךָ указывает на кровь как на вещество, которым пропитывается земля. Перевод передаёт наиболее вероятный смысл, не скрывая трудность в примечании.
- source_word: אֶל הֶהָרִים
  choice: до самых гор
  rationale: Предлог אֶל в контексте указывает на предел распространения; «до самых гор» естественно выражает этот пространственный размах.
- source_word: וַאֲפִקִים
  choice: и русла
  rationale: אֲפִיקִים может обозначать русла потоков, речные ложа или ущелья. «Русла» хорошо сочетается с образом крови, стекающей по местности, и не предполагает наличия текущей воды.
- source_word: יִמָּלְאוּן מִמֶּךָּ
  choice: наполнятся тобой
  rationale: Форма נפעל от מלא передаёт наполнение, а буквальное «из тебя» в данном контексте указывает на то, что происходит от поверженного адресата. «Тобой» сохраняет прямое, устрашающее обращение и не уточняет сверх текста, идёт ли речь только о крови или также об останках.
