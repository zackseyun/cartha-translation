  to: Я приведу многие народы в ужас из-за тебя, и их цари содрогнутся от ужаса из-за тебя[a], когда Я взмахну Моим мечом перед ними[b]; и они будут трепетать каждое мгновение[c] — каждый за свою жизнь — в день твоего падения.
