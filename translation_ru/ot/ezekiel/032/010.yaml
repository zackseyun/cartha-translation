source:
  edition: WLC
  text: וַ/הֲשִׁמּוֹתִ֨י עָלֶ֜י/ךָ עַמִּ֣ים רַבִּ֗ים וּ/מַלְכֵי/הֶם֙ יִשְׂעֲר֤וּ עָלֶ֨י/ךָ֙ שַׂ֔עַר בְּ/עוֹפְפִ֥/י חַרְבִּ֖/י עַל פְּנֵי/הֶ֑ם וְ/חָרְד֤וּ לִ/רְגָעִים֙ אִ֣ישׁ לְ/נַפְשׁ֔/וֹ בְּ/י֖וֹם מַפַּלְתֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/010.yaml
  text: I will make many peoples appalled at you[a], and their kings will shudder over you when I brandish my sword before them; and they will tremble every moment, each man for his own life[c][b], on the day of your downfall.
translation:
  language: ru
  text: Я приведу многие народы в ужас из-за тебя, и их цари содрогнутся от ужаса из-за тебя[a], когда Я взмахну Моим мечом перед ними[b]; и они будут трепетать каждое мгновение[c] — каждый за свою жизнь — в день твоего падения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «содрогнутся над тобой содроганием»; повтор однокоренных слов усиливает выражение ужаса.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «когда Я заставлю Мой меч летать перед ними».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от мгновения к мгновению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמּוֹתִי
  choice: Я приведу ... в ужас
  rationale: Каузативная форма שמם с народами в роли объекта здесь обозначает вызванное потрясение или оцепенение; русский оборот естественно передаёт реакцию ужаса и согласуется с последующим описанием царей.
- source_word: עַמִּים רַבִּים
  choice: многие народы
  rationale: «Народы» точнее отражает коллективные этнические группы, не привнося современного понятия государств-наций.
- source_word: יִשְׂעֲרוּ ... שַׂעַר
  choice: содрогнутся от ужаса
  rationale: Сочетание глагола и однокоренного существительного служит усилительной конструкцией и выражает сильнейший ужас; по-русски это естественно передаётся сочетанием «содрогнутся от ужаса».
- source_word: עָלֶיךָ
  choice: при виде тебя
  rationale: Предлог עַל здесь указывает на предмет вызванной реакции. «При виде тебя» естественно передаёт смысл в контексте зрелища падения Египта, не делая его непосредственной причиной вне контекста суда.
- source_word: בְּעוֹפְפִי חַרְבִּי
  choice: когда Я взмахну Моим мечом
  rationale: Буквальный образ заставить меч лететь в данном воинском контексте означает размахивать или взмахнуть мечом; выбранная формулировка сохраняет динамичность образа.
- source_word: עַל־פְּנֵיהֶם
  choice: перед ними
  rationale: Прямое и естественное пространственное соответствие в сцене открытого Божьего суда.
- source_word: וְחָרְדוּ
  choice: они будут трепетать
  rationale: Глагол חרד обозначает телесную дрожь от страха; «трепетать» сохраняет одновременно физический и эмоциональный смысл.
- source_word: לִרְגָעִים
  choice: каждое мгновение
  rationale: Форма во множественном числе с ל выражает повторяющиеся моменты; перевод передаёт непрерывную тревогу.
- source_word: אִישׁ לְנַפְשׁוֹ
  choice: каждый за свою жизнь
  rationale: В контексте смертельной угрозы נֶפֶשׁ означает жизнь. Распределительное אִישׁ естественно передаётся словом «каждый».
- source_word: בְּיוֹם מַפַּלְתֶּךָ
  choice: В день твоего падения
  rationale: מַפָּלָה обозначает катастрофическое падение или крушение под судом; «падение» сохраняет образ и звучит естественно.
theological_decisions:
- issue: Божественная деятельность в образе суда
  choice: Бог говорит от первого лица и называет меч Своим, непосредственно представляя Себя совершающим суд.
  alternative: Меч может исторически действовать через Вавилон как орудие Божьего суда.
  rationale: Формы «Я приведу» и «Моим мечом» требуют сохранить непосредственную божественную деятельность, при этом перевод не исключает её осуществления через исторического посредника.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Сохранены обращение к Египту в единственном числе, яркий образ Божьего меча и нарастающее описание ужаса; прописная буква в «Я» и «Моим» обозначает говорящего Бога.
