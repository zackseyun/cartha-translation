review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Господь вызывает ужас среди многих народов, цари страшатся из-за Египта, Божий меч явлен перед ними, и в день падения Египта каждый трепещет за свою жизнь. Однако «при виде тебя» неоправданно сужает עָלֶיךָ до зрительного восприятия; предлог обозначает направленность ужаса на адресата/в связи с ним. Кроме того, сноска a не соответствует выбранному выражению и недостаточно ясно передаёт усилительную однокоренную конструкцию.'
