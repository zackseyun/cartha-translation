  text: בְּ/ת֣וֹךְ חֲ֠לָלִים נָתְנ֨וּ מִשְׁכָּ֥ב לָ/הּ֙ בְּ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתֶ֑/הָ כֻּלָּ֣/ם עֲרֵלִ֣ים חַלְלֵי חֶ֡רֶב כִּֽי נִתַּ֨ן חִתִּיתָ֜/ם בְּ/אֶ֣רֶץ חַיִּ֗ים וַ/יִּשְׂא֤וּ כְלִמָּתָ/ם֙ אֶת י֣וֹרְדֵי ב֔וֹר בְּ/ת֥וֹךְ חֲלָלִ֖ים נִתָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/025.yaml
  text: Among the slain they made a bed for her with all her multitude[a]; her graves are all around her. All of them are uncircumcised, slain by the sword, because their terror was set in the land of the living. So they bore their disgrace with those who go down to the pit[c][b]; she was placed among the slain.
translation:
  language: ru
  text: Среди убитых ей устроили ложе вместе со всем её множеством; вокруг него — её могилы.[a] Все они необрезанны, убитые мечом, потому что их ужас был насаждён в земле живых.[b] Они понесли свой позор вместе с нисходящими в яму; он помещён среди убитых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте происходит смена рода: сначала говорится «ей» и «её», затем — «вокруг него», после чего снова стоит «её могилы». Заключительное сказуемое также мужского рода («он помещён»). Это может отражать переход от олицетворённой общности к её представителю.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «потому что они наводили ужас в земле живых». Буквально: «потому что их ужас был дан (установлен) в земле живых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ חֲלָלִים
  choice: среди убитых
  rationale: Передаёт положение среди погибших насильственной смертью и сохраняет повторяющийся погребально-военный образ стиха.
- source_word: נָתְנוּ מִשְׁכָּב לָהּ
  choice: ей устроили ложе
  rationale: Сохраняет метафору ложа в царстве мёртвых, не сводя выражение к пояснительному «похоронили её».
- source_word: בְּכָל הֲמוֹנָהּ
  choice: вместе со всем её множеством
  rationale: הָמוֹן обозначает множество людей, связанных с представленной как женщина страной или общностью; «множество» не добавляет исключительно военного оттенка.
- source_word: סְבִיבוֹתָיו קִבְרֹתֶהָ
  choice: вокруг него — её могилы
  rationale: 'Сохраняет резкую смену рода в масоретском тексте: мужской суффикс в «вокруг него» и женский в «её могилы».'
- source_word: כֻּלָּם עֲרֵלִים
  choice: все они необрезанные
  rationale: Сохраняет конкретный термин и его значимый для пророческой речи оттенок позора и отчуждённости.
- source_word: חַלְלֵי חֶרֶב
  choice: убитые мечом
  rationale: Естественное русское обозначение павших от оружия, соответствующее устойчивому древнееврейскому обороту.
- source_word: כִּי נִתַּן חִתִּיתָם
  choice: потому что их ужас был насаждён
  rationale: Пассивная конструкция сохранена; «насаждён» передаёт идею установленного или распространённого ужаса, не называя отсутствующего в тексте деятеля.
- source_word: בְּאֶרֶץ חַיִּים
  choice: в земле живых
  rationale: Сохраняет традиционный образ мира живущих в противопоставлении яме и царству мёртвых.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: они понесли свой позор
  rationale: Передаёт сочетание נשא с כְּלִמָּה как несение последствий унижения и суда.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: вместе с нисходящими в яму
  rationale: Ассоциативное понимание אֶת соответствует контексту совместной участи умерших; «яма» сохраняет образ подземного мира.
- source_word: בְּתוֹךְ חֲלָלִים נִתָּן
  choice: он помещён среди убитых
  rationale: Мужской род конечной глагольной формы сохранён, а не согласован искусственно с женскими формами в начале стиха.
theological_decisions:
- issue: Обозначение умерших как необрезанных
  choice: все они необрезанные
  alternative: все они — осквернённые чужеземцы
  rationale: Исходный текст употребляет конкретное слово, имеющее заветные и судебные ассоциации; истолковывающая абстракция скрыла бы этот образ.
- issue: Смена грамматического рода в изображении погребения
  choice: ей… её… вокруг него… он помещён
  alternative: последовательно употребить только женский или только мужской род
  rationale: Масоретский текст переходит от женских суффиксов к мужскому и обратно; перевод сохраняет напряжение между олицетворённой общностью и её мужским представителем либо референтом.
- issue: Причина позора и ужаса в земле живых
  choice: их ужас был насаждён
  alternative: они наводили ужас
  rationale: Пассивная форма оригинала не называет действующее лицо; её сохранение не предрешает, кто именно установил или распространил этот ужас.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Метафоры ложа, земли живых и ямы сохранены. Необычная смена грамматического рода намеренно не сглажена.
