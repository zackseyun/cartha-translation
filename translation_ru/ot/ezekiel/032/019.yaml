    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּי נָעָמְתָּ
  choice: Кого ты превосходишь красотой?
  rationale: Предлог מִן при вопросительном מִי выражает сравнение; в сочетании с נעם получается риторический вопрос о превосходстве в привлекательности или красоте. Такая формулировка естественна по-русски и сохраняет сравнительный смысл.
- source_word: רְדָה
  choice: Сойди
  rationale: Повелительная форма от ירד передаёт нисхождение в мир мёртвых; краткое «сойди» сохраняет образ и торжественный тон.
- source_word: וְהָשְׁכְּבָה
  choice: и ляг
  rationale: Форма от שכב в погребальном контексте обозначает положение среди умерших. «Ляг» звучит естественно и не добавляет отсутствующего в тексте представления об упокоении.
- source_word: אֶת עֲרֵלִים
  choice: среди необрезанных
  rationale: После שכב אֶת выражает совместность или принадлежность к группе. Русское «среди» ясно передаёт нахождение в одном ряду с умершими; «необрезанные» сохраняет конкретный заветный и позорящий образ древнееврейского текста.
theological_decisions:
- issue: Значение עֲרֵלִים в пророчестве о суде
  choice: необрезанные
  alternative: язычники; нечистые
  rationale: Термин буквально указывает на отсутствие обрезания, а не обобщённо на язычество или ритуальную нечистоту. Буквенная передача сохраняет заветную символику и оттенок позора, не привнося дополнительных богословских толкований.
- issue: Риторическое сравнение в מִמִּי נָעָמְתָּ
  choice: Кого ты превосходишь красотой?
  alternative: Кого ты красивее?
  rationale: Обе формулировки передают сравнительный вопрос; основной вариант лучше сохраняет возвышенный тон погребальной песни, не утверждая прямо, что адресат действительно превосходит кого-либо.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческой погребальной песни. Сохранены риторический вопрос, образ нисхождения к мёртвым и конкретное обозначение «необрезанные».
