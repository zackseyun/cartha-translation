  text: Кого ты превосходишь красотой?[a] Сойди и ляг с необрезанными.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кого ты красивее?» Еврейский текст содержит риторическое сравнение.'
