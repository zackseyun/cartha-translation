  text: וְ/הַֽאֲבַדְתִּי֙ אֶת כָּל בְּהֶמְתָּ֔/הּ מֵ/עַ֖ל מַ֣יִם רַבִּ֑ים וְ/לֹ֨א תִדְלָחֵ֤/ם רֶֽגֶל אָדָם֙ ע֔וֹד וּ/פַרְס֥וֹת בְּהֵמָ֖ה לֹ֥א תִדְלָחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/013.yaml
  text: And I will destroy all its beasts from beside its abundant waters[a], and no human foot will muddy them anymore[b], nor will the hooves of beasts muddy them.
translation:
  language: ru
  text: И Я истреблю всех её животных у её обильных вод[a]. Человеческая нога больше не замутит их[b], и копыта животных тоже не замутят их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у многих вод».'
    reason: lexical_alternative
  - marker: b
    text: Глагол означает делать воду мутной, взбалтывая её ногами или копытами.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: И Я истреблю
  rationale: Каузативная порода глагола אבד выражает уничтожение или устранение; «истреблю» естественно передаёт суровый контекст суда.
- source_word: בְּהֶמְתָּהּ
  choice: весь её скот
  rationale: בְּהֵמָה здесь обозначает совокупность крупных домашних животных; «скот» естественно сочетается с последующим упоминанием копыт. Суффикс женского рода относится к олицетворённому Египту или его земле.
- source_word: מֵעַל מַיִם רַבִּים
  choice: у полноводных вод
  rationale: מֵעַל в контексте передаёт удаление от места у вод, а מַיִם רַבִּים — многочисленные или обильные воды. «Полноводные воды» сохраняет образ изобилия и звучит поэтично; вариант отмечен в сноске.
- source_word: תִדְלָחֵם
  choice: не замутит их
  rationale: דלח означает делать воду мутной, взбалтывая её ногами; «замутит» точно и естественно передаёт действие. Местоименный суффикс относится к водам.
- source_word: רֶגֶל אָדָם
  choice: нога человека
  rationale: אָדָם употреблено родово и означает человека вообще, а не имя собственное или исключительно мужчину.
- source_word: עוֹד
  choice: больше не
  rationale: 'В отрицательной конструкции עוֹד указывает на прекращение действия: «больше не».'
- source_word: וּפַרְסוֹת בְּהֵמָה
  choice: и копыта скота
  rationale: פַּרְסוֹת обозначает копыта; повтор «скота» сохраняет лексическую связь с первой частью стиха и параллелизм с человеческой ногой.
theological_decisions:
- issue: Родовое значение אָדָם
  choice: нога человека
  alternative: нога мужчины
  rationale: В данном выражении אָדָם обозначает любого человека. Русское «человека» сохраняет грамматическое число и передаёт родовой смысл без неоправданного ограничения по полу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллелизм двух заключительных частей и повтор глагола; синтаксис слегка упорядочен ради ясности.
