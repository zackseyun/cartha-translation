base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/002.yaml
  text: 'Son of man[a], raise a lament over Pharaoh king of Egypt, and say to him: You compared yourself to a young lion among the nations, but you were like the monster in the seas; you burst forth in your rivers, and muddied the waters with your feet[c][b], and fouled their rivers.'
translation:
  language: ru
  text: 'Сын человеческий, подними плач о фараоне, царе Египта, и скажи ему:


    «Ты был уподоблен молодому льву среди народов[a],

    но ты подобен чудовищу в морях[b].

    Ты прорывался в своих реках,

    ногами мутил воды

    и топтал их потоки[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты уподобил себя молодому льву среди народов». Еврейский глагол допускает как пассивное, так и возвратное понимание.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово здесь, вероятно, обозначает огромное водное существо; возможны также переводы «дракон» или «морское чудовище».
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол буквально означает «топтать»; в этом водном образе он может также подразумевать взбаламучивание или загрязнение потоков.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Традиционная и понятная передача еврейского обращения к Иезекиилю; сохраняет исходный образ и возвышенный пророческий регистр.
- source_word: שָׂא קִינָה
  choice: подними плач
  rationale: Сохраняет устойчивый пророческий оборот, обозначающий начало погребальной песни, и естественно звучит в современном литературном русском.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: о фараоне, царе Египта
  rationale: Прямо передаёт последовательность титула и имени с естественным для русского пояснительным обособлением.
- source_word: כְּפִיר גּוֹיִם
  choice: молодому льву среди народов
  rationale: כְּפִיר обозначает молодого сильного льва; «среди народов» естественно выражает отношение образа к народам.
- source_word: נִדְמֵיתָ
  choice: ты уподоблял себя
  rationale: Возвратное понимание нифаля уместно в контексте насмешки над притязаниями фараона, однако пассивное прочтение сохранено в примечании.
- source_word: כַּתַּנִּים בַּיַּמִּים
  choice: подобен чудовищу в морях
  rationale: В водном контексте תַּנִּים указывает на огромное водное существо; «чудовище» сохраняет мифопоэтическую силу образа без неоправданного уточнения вида животного.
- source_word: וַתָּגַח בְּנַהֲרוֹתֶיךָ
  choice: ты бушевал в своих реках
  rationale: Глагол передаёт резкое, неистовое движение, буквально связанное с боданием или напором; «бушевал» естественно согласуется с водным образом, не превращая его в спокойное течение.
- source_word: וַתִּדְלַח מַיִם בְּרַגְלֶיךָ
  choice: ногами мутил воду
  rationale: Точно и образно передаёт действие, от которого вода становится мутной.
- source_word: וַתִּרְפֹּס נַהֲרוֹתָם
  choice: топтал их потоки
  rationale: Сохраняет конкретное значение רפס — «топтать» — и местоименный суффикс третьего лица множественного числа; возможный результирующий смысл отмечен в примечании.
theological_decisions:
- issue: Деятель или объект уподобления в נִדְמֵיתָ
  choice: Фараон уподоблял себя молодому льву
  alternative: Фараона уподобляли молодому льву / он считался подобным молодому льву
  rationale: 'Форма допускает возвратное и пассивное понимание. Основной текст следует возвратному прочтению, соответствующему обличительному контексту, но не устраняет грамматическую неоднозначность: пассивный вариант дан в примечании.'
- issue: Характер существа תַּנִּים
  choice: чудовище в морях
  alternative: дракон в морях / огромное морское животное
  rationale: Контекст морей и рек исключает обычное понимание как наземного шакала, но точный вид существа не определён; поэтому выбран широкий образный термин.
translation_notes:
  register: Современный литературный русский с возвышенным пророческим ритмом. Параллельные строки сохраняют поэтическое построение плача. Необычный образ «топтал их потоки» оставлен ради конкретности еврейского глагола и пояснён в сноске.
