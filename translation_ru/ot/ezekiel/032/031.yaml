  text: אוֹתָ/ם֙ יִרְאֶ֣ה פַרְעֹ֔ה וְ/נִחַ֖ם עַל כָּל המונ/ה חַלְלֵי חֶ֨רֶב֙ פַּרְעֹ֣ה וְ/כָל חֵיל֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/031.yaml
  text: Pharaoh will see them and be comforted over all his multitude[a], Pharaoh and all his army, slain by the sword, declares the Lord GOD.
translation:
  language: ru
  text: Фараон увидит их и утешится при виде всего своего множества, павшего от меча, — фараона и всего его войска, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹתָם
  choice: их
  rationale: Прямое дополнение во множественном числе отсылает к народам и правителям в преисподней, упомянутым в ближайшем контексте.
- source_word: יִרְאֶה
  choice: увидит
  rationale: Имперфект имеет здесь будущее значение в пророческой речи.
- source_word: וְנִחַם
  choice: и утешится
  rationale: В данном контексте глагол означает, что фараон найдёт мрачное утешение, увидев других, разделивших его участь. Формулировка сохраняет иронию и не устраняет многозначность корня.
- source_word: עַל כָּל הֲמוֹנוֹ
  choice: о всём своём множестве
  rationale: הָמוֹן обозначает множество людей и сил фараона; широкое слово «множество» сохраняет объём исходного выражения, а «о» естественно сочетается с «утешится» в возвышенном литературном регистре.
- source_word: חַלְלֵי חֶרֶב
  choice: павшем от меча
  rationale: Еврейское устойчивое выражение обозначает погибших насильственной смертью, прежде всего в бою. Согласование в единственном числе обусловлено собирательным «множестве».
- source_word: פַּרְעֹה וְכָל חֵילוֹ
  choice: он и всё его войско
  rationale: Повтор имени «фараон» передан местоимением для естественности русского синтаксиса; חַיִל в данном контексте означает военную силу, поэтому выбрано «войско».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передан устойчивой пророческой формулой «возвещает»; אֲדֹנָי — «Владыка», а личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Смысл утешения фараона в преисподней
  choice: утешится о всём своём множестве
  alternative: раскается / пожалеет обо всём своём множестве
  rationale: Контекст перечисления павших народов указывает на мрачное утешение от общей участи, однако примечание сохраняет более широкую смысловую область еврейского глагола.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь БОГ
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה без их слияния и сохраняется прямое присутствие Божьего имени в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис слегка возвышенный, но понятный; тире обозначают пояснительное присоединение. Повтор имени фараона заменён местоимением без изменения референции.
