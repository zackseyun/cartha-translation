revisions:
- from: Фараон увидит их и утешится о всём своём множестве[a], павшем от меча, — он и всё его войско, — возвещает Владыка Яхве.
  to: Фараон увидит их и утешится при виде всего своего множества, павшего от меча, — фараона и всего его войска, — возвещает Владыка Яхве.
  rationale: 'Перестроена центральная часть фразы: «при виде» естественно выражает основание утешения, а «фараона и всего его войска» в винительном падеже становится ясным уточнением к «всему своему множеству». Повтор имени сохранён, как в исходном тексте. Смысл и осторожная лексическая сноска не изменены.'
