  text: שָׁ֣ם מֶ֤שֶׁךְ תֻּבַל֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרוֹתֶ֑י/הָ כֻּלָּ֤/ם עֲרֵלִים֙ מְחֻ֣לְלֵי חֶ֔רֶב כִּֽי נָתְנ֥וּ חִתִּיתָ֖/ם בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/026.yaml
  text: There are Meshech and Tubal[a], and all her multitude; their graves are all around him. All of them are uncircumcised, slain by the sword, because they spread their terror in the land of the living.
translation:
  language: ru
  text: Там Мешех и Тувал[a] и всё их множество; вокруг него — их могилы. Все они — необрезанные, сражённые мечом, потому что сеяли ужас в земле живых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «и всё её множество; вокруг него — её могилы»; в этой поэтической строке меняется род местоименных суффиксов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Указательное наречие сохраняет образ перечисления народов, уже находящихся в мире мёртвых; в русском безглагольное предложение звучит естественно.
- source_word: מֶשֶׁךְ תֻּבַל
  choice: Мешех и Тувал
  rationale: Названия народов переданы принятой русской библейской транслитерацией, а не переведены.
- source_word: וְכָל הֲמוֹנָהּ
  choice: и всё их множество
  rationale: הָמוֹן обозначает многочисленную массу людей; «множество» не сужает значение до исключительно военного войска. Местоимение согласовано в русском с парой названий, а исходное колебание форм отмечено в сноске.
- source_word: סְבִיבוֹתָיו קִבְרוֹתֶיהָ
  choice: вокруг него — их могилы
  rationale: Сохранено заметное единственное число «него», тогда как принадлежность могил слегка упорядочена для понятности русского текста. Смена рода и числа в еврейской строке пояснена сноской.
- source_word: כֻּלָּם עֲרֵלִים
  choice: Все они — необрезанные
  rationale: Буквальный термин сохраняет присущие контексту заветные ассоциации и оттенок посмертного бесчестия.
- source_word: מְחֻלְלֵי חֶרֶב
  choice: сражённые мечом
  rationale: В данной формуле речь идёт о погибших от меча; «сражённые» естественно и точно передаёт результат смертельного удара.
- source_word: כִּי נָתְנוּ חִתִּיתָם
  choice: потому что сеяли ужас
  rationale: כִּי передаёт причину, а идиома «дать свой ужас» означает внушать или распространять страх; «сеяли ужас» является естественным современным русским соответствием.
- source_word: בְּאֶרֶץ חַיִּים
  choice: в земле живых
  rationale: Сохранён устойчивый библейский образ мира земной жизни в противопоставлении миру мёртвых.
theological_decisions:
- issue: Сохранение языка заветного бесчестия в пророчестве о погребении
  choice: необрезанные
  alternative: осквернённые; не посвящённые
  rationale: עֲרֵלִים буквально означает «необрезанные». Такой перевод сохраняет риторическую и богословскую напряжённость текста, не подменяя её толкованием.
- issue: Передача смены местоименных форм в поэтической строке
  choice: частично упорядочить принадлежность могил, но сохранить «вокруг него»
  alternative: 'дословно передать все формы: «всё её множество; вокруг него — её могилы»'
  rationale: Еврейская строка резко меняет род и число суффиксов. Частичное упорядочение обеспечивает понятность, а сохранённое единственное число и сноска не скрывают особенность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого погребального плача. Синтаксис краткий и ритмичный; традиционные библейские выражения сохранены там, где они несут смысловую и богословскую нагрузку.
