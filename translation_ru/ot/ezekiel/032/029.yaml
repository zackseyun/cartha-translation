base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/029.yaml
  text: There is Edom[a], her kings and all her princes, who were laid among those slain by the sword despite their might[b]. They lie with the uncircumcised and with those who go down to the pit.
translation:
  language: ru
  text: Там — Эдом, его цари и все его князья, которые были положены среди павших от меча в своей мощи[a]. Они лежат вместе с необрезанными и с теми, кто нисходит в яму[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «со своей мощью» или «при своей мощи». Контекст может подчёркивать иронию: сила не уберегла их от гибели.'
    reason: lexical_alternative
  - marker: b
    text: «Яма» — распространённый в еврейской поэзии образ могилы или царства мёртвых.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: Там
  rationale: Указательное наречие продолжает повторяющуюся картину народов в царстве мёртвых; краткое «Там» сохраняет дейктическую силу еврейского слова.
- source_word: אֱדוֹם מְלָכֶיהָ וְכָל־נְשִׂיאֶיהָ
  choice: Эдом, его цари и все его князья
  rationale: Название народа передано традиционно; местоимение согласовано с мужским родом слова «Эдом» в русском языке. «Князья» сохраняет высокий политический регистр נְשִׂיאִים.
- source_word: אֲשֶׁר נִתְּנוּ
  choice: они были положены
  rationale: Страдательная форма נתן означает, что их поместили или положили; в сцене пребывания среди мёртвых «были положены» звучит естественно и сохраняет пассив.
- source_word: בִגְבוּרָתָם
  choice: несмотря на свою мощь
  rationale: 'Контекст подчёркивает иронию: военная сила правителей не избавила их от общей участи. Поскольку буквальная синтаксическая связь допускает и иные оттенки, они отмечены в сноске.'
- source_word: אֶת חַלְלֵי חָרֶב
  choice: среди павших от меча
  rationale: Устойчивое пророческое обозначение погибших насильственной смертью передано ясным и традиционным русским выражением.
- source_word: עֲרֵלִים
  choice: необрезанными
  rationale: Буквальная передача сохраняет заветные и позорящие коннотации слова в пророческом суде, не сводя его лишь к значению «народы» или «опозоренные мертвецы».
- source_word: יִשְׁכָּבוּ
  choice: лежат
  rationale: Настоящее время естественно передаёт описываемое в видении состояние умерших.
- source_word: וְאֶת יֹרְדֵי בוֹר
  choice: и с теми, кто нисходит в яму
  rationale: «Яма» сохраняет конкретный образ בּוֹר и его связь с могилой и миром мёртвых; глагол «нисходит» поддерживает возвышенный регистр плача.
theological_decisions:
- issue: Значение слова «необрезанные» в пророчестве о суде
  choice: Сохранить буквальное «необрезанные».
  alternative: «опозоренные мертвецы» или «народы»
  rationale: Еврейское слово одновременно несёт заветный смысл и оттенок позора. Буквальная передача сохраняет эту напряжённость и не навязывает более узкого толкования.
- issue: Образ ямы
  choice: Сохранить образ «ямы» с пояснением.
  alternative: Передать непосредственно как «могила» или «царство мёртвых».
  rationale: Так сохраняются поэтический образ и межтекстовые связи пророческой речи, а сноска объясняет его значение без устранения образности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Краткое начальное «Там — Эдом» передаёт формульное перечисление народов; традиционные библейские выражения сохранены там, где они понятны современному читателю.
