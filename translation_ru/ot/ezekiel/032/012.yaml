  text: בְּ/חַרְב֤וֹת גִּבּוֹרִים֙ אַפִּ֣יל הֲמוֹנֶ֔/ךָ עָרִיצֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם וְ/שָֽׁדְדוּ֙ אֶת גְּא֣וֹן מִצְרַ֔יִם וְ/נִשְׁמַ֖ד כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/012.yaml
  text: By the swords of mighty men I will make your multitude fall— all of them the ruthless ones of the nations[a]. They will plunder the pride of Egypt[b], and all her multitude will be destroyed.
translation:
  language: ru
  text: Мечами могучих воинов Я повергну твоё множество — все они, безжалостные люди из народов[a]. Они разграбят гордость Египта[b], и всё его множество будет уничтожено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тираны народов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «величие Египта»; еврейское слово может означать и гордость, и величие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַרְבוֹת גִּבּוֹרִים
  choice: Мечами могучих воинов
  rationale: Предлог בְּ передаёт средство действия; גִּבּוֹרִים в военном контексте обозначает сильных, доблестных воинов. Формулировка сохраняет образ мечей и звучит естественно по-русски.
- source_word: אַפִּיל
  choice: Я повергну
  rationale: Каузативная форма породы хифиль от נפל означает «заставлю пасть». Глагол «повергну» кратко и естественно передаёт это значение в возвышенном пророческом контексте.
- source_word: הֲמוֹנֶךָ
  choice: твоё множество
  rationale: הָמוֹן может обозначать множество людей, скопище или массу; нейтральное «множество» не сужает смысл до одной лишь армии и позволяет сохранить повтор слова в конце стиха.
- source_word: עָרִיצֵי גוֹיִם כֻּלָּם
  choice: все они безжалостные из народов
  rationale: עָרִיץ обозначает жестокого, безжалостного или тиранического человека. «Безжалостные» сохраняет характеристику насилия, не приписывая им конкретного политического статуса; оборот оставляет присоединительную структуру еврейского текста.
- source_word: וְשָׁדְדוּ
  choice: Они разграбят
  rationale: שׁדד здесь обозначает военное разграбление или разорение. «Разграбят» естественно сочетается с прямым дополнением и сохраняет конкретный образ добычи.
- source_word: גְּאוֹן מִצְרַיִם
  choice: гордость Египта
  rationale: גָּאוֹן может означать гордость, величие или великолепие. В пророчестве о суде «гордость» передаёт мотив унижения, а сноска сохраняет возможное значение величия.
- source_word: וְנִשְׁמַד
  choice: будет уничтожено
  rationale: Нифаль от שׁמד выражает уничтожение или истребление. Выбранная формулировка сильна, ясна и не усиливает значение сверх еврейского текста.
- source_word: כָּל הֲמוֹנָהּ
  choice: всё его множество
  rationale: Женский суффикс относится к Египту, который в русском языке мужского рода, поэтому требуется «его». Повтор «множество» отражает повтор הָמוֹן и сохраняет риторический параллелизм.
theological_decisions:
- issue: Значение גְּאוֹן в пророчестве о суде
  choice: гордость Египта
  alternative: величие Египта
  rationale: Слово охватывает как надменную гордость, так и величие, которым хвалятся. Контекст унижения Египта поддерживает основной вариант «гордость», но действительная смысловая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены военная образность, повтор слова «множество» и неоднозначность גְּאוֹן; согласование рода адаптировано к русскому слову «Египет».
