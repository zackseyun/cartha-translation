base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/001.yaml
  text: And it happened in the twelfth year[a], in the twelfth month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: ru
  text: 'В двенадцатом году, в двенадцатом месяце, в первый день месяца ко мне пришло слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно передаётся как «Господь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Повествовательная форма от היה вводит датированную пророческую формулу; «И было» естественно для возвышенного библейского повествования и не добавляет отсутствующего субъекта.
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: в двенадцатом году
  rationale: Точно передаёт стандартную формулу датировки; уточнение «плена» в еврейском тексте отсутствует и потому не добавляется.
- source_word: בִּשְׁנֵי עָשָׂר חֹדֶשׁ
  choice: в двенадцатом месяце
  rationale: Прямое и естественное соответствие календарному обозначению.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Еврейское выражение буквально говорит об «одном» числе месяца, но идиоматически обозначает первый день.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: было ко мне слово Яхве
  rationale: Сохраняет характерную пророческую формулу и её связь с глаголом היה, оставаясь понятным в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В русском языке двоеточие естественно вводит следующую далее прямую речь и позволяет избежать тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. «Яхве» является принятой научной реконструкцией произношения и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор «в двенадцатом» и формула «было ко мне слово» сохранены ради структуры и колорита исходного текста; לֵאמֹר передано русской пунктуацией, поскольку сама речь начинается в следующем стихе.
