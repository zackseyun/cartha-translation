id: EZK.32.14
reference: Ezekiel 32:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָ֚ז אַשְׁקִ֣יעַ מֵֽימֵי/הֶ֔ם וְ/נַהֲרוֹתָ֖/ם כַּ/שֶּׁ֣מֶן אוֹלִ֑יךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/014.yaml
  text: Then I will let their waters settle[a], and I will make their rivers flow like oil[b], declares the Lord GOD.
translation:
  language: ru
  text: Тогда Я дам их водам отстояться[a] и сделаю так, что их реки потекут, словно масло[b], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставлю их воды опуститься (утихнуть)». Еврейский глагол может означать, что воды оседают, спадают или становятся спокойными.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «поведу их реки, словно масло», то есть заставлю их двигаться плавно, как масло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временное наречие, обозначающее следующий этап пророчества.
- source_word: אַשְׁקִיעַ
  choice: дам … отстояться
  rationale: Порода хифиль глагола שׁקע выражает причинение оседания или утихания; применительно к воде «дать отстояться» естественно передаёт образ успокоившейся воды, не исключая значения «заставить опуститься».
- source_word: מֵימֵיהֶם
  choice: их водам
  rationale: Сохранены местоименная отсылка и поэтическое множественное число исходного текста.
- source_word: וְנַהֲרוֹתָם
  choice: их реки
  rationale: «Реки» соответствует נְהָרוֹת и широкому водному образу контекста.
- source_word: כַּשֶּׁמֶן
  choice: словно масло
  rationale: Сохраняет краткое сравнение и образ густого, плавного движения; уточнение «оливковое» в оригинале отсутствует.
- source_word: אוֹלִיךְ
  choice: сделаю так, что … потекут
  rationale: Хифиль от הלך означает «заставить идти, повести»; по отношению к рекам естественным русским соответствием служит причинная конструкция с «потекут».
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт торжественную пророческую формулу как заявление божественного оракула.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя, представленное тетраграмматоном.
theological_decisions:
- issue: Передача божественного имени в אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Транслитерация «Яхве» даёт увидеть личное имя в еврейском тексте, а «Владыка» позволяет не создавать повтор «Господь Господь» и отличает אֲדֹנָי от тетраграмматона.
- issue: Смысл образа вод, текущих как масло
  choice: Сравнение сохранено без богословского истолкования
  alternative: Я заставлю их реки течь спокойно
  rationale: Контекст допускает понимание плавного, невозмущённого течения, однако текст выражает это сравнением; перевод не заменяет образ его толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Местоимение «Я» написано с прописной буквы как относящееся к Богу. Образ воды и масла сохранён без лишнего пояснения в основном тексте.
