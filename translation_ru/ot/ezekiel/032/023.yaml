source:
  edition: WLC
  text: אֲשֶׁ֨ר נִתְּנ֤וּ קִבְרֹתֶ֨י/הָ֙ בְּ/יַרְכְּתֵי ב֔וֹר וַ/יְהִ֣י קְהָלָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֤/ם חֲלָלִים֙ נֹפְלִ֣ים בַּ/חֶ֔רֶב אֲשֶׁר נָתְנ֥וּ חִתִּ֖ית בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/023.yaml
  text: whose graves were set in the remotest parts of the pit[a], and her assembly was around her grave—all of them slain, fallen by the sword[b], who spread terror in the land of the living.
translation:
  language: ru
  text: Её могилы расположены в самых дальних глубинах ямы[a], а вокруг её могилы — всё её множество. Все они — убитые, павшие от меча, те, кто наводили ужас[b] в земле живых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в отдалённых уголках ямы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внушали ужас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתְּנוּ
  choice: помещены
  rationale: Пассивная форма נתן здесь обозначает размещение могил; «помещены» сохраняет пассив и не создаёт значения передачи или дара.
- source_word: קִבְרֹתֶיהָ
  choice: её могилы
  rationale: Женский суффикс относится к олицетворённой Ассирии; местоимение «её» сохраняет пророческую персонификацию.
- source_word: בְּיַרְכְּתֵי בוֹר
  choice: в дальних глубинах ямы
  rationale: יַרְכְּתֵי указывает на отдалённые, внутренние пределы, а בוֹר буквально означает яму; перевод сохраняет образ подземной глубины, не подменяя слово термином «шеол».
- source_word: קְהָלָהּ
  choice: всё её множество
  rationale: קהל обозначает собранную группу или множество. Такой перевод естественнее для современного русского, чем формальное «собрание», и не уточняет без необходимости, что речь именно о войске или народе.
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: вокруг её могилы
  rationale: Прямая пространственная формулировка сохраняет повтор погребальной лексики исходного текста.
- source_word: כֻּלָּם חֲלָלִים
  choice: все они сражены
  rationale: חֲלָלִים обозначает погибших насильственной смертью, особенно в сражении; «сражены» передаёт этот оттенок лучше, чем нейтральное «мертвы».
- source_word: נֹפְלִים בַּחֶרֶב
  choice: пали от меча
  rationale: Причастная конструкция описывает убитых; традиционный и ясный русский оборот сохраняет воинский образ.
- source_word: נָתְנוּ חִתִּית
  choice: наводил ужас
  rationale: Идиома נתן + חִתִּית означает причинять или распространять ужас. «Наводил ужас» естественно передаёт воздействие на других, не уточняя способ.
- source_word: בְּאֶרֶץ חַיִּים
  choice: на земле живых
  rationale: Устойчивое древнееврейское выражение противопоставляет мир живущих яме и области мёртвых; буквальный образ понятен по-русски.
theological_decisions:
- issue: Олицетворение Ассирии женскими суффиксами
  choice: Последовательно передать суффиксы местоимением «её»
  alternative: Использовать средний род или безличные конструкции, представляя Ассирию только как государство
  rationale: Женский род присутствует в еврейском тексте и поддерживает характерное для пророков олицетворение народа или державы; его сохранение не добавляет конфессионального толкования.
- issue: Образ подземного мира в слове בוֹר
  choice: Перевести как «яма»
  alternative: Передать как «шеол», «преисподняя» или «могила»
  rationale: В исходном тексте стоит בוֹר, а не שְׁאוֹל. «Яма» сохраняет конкретную метафору и не делает образ богословски более определённым, чем оригинал.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Сохранены повторы «могилы — могилы», коллективное женское олицетворение и резкое противопоставление ямы земле живых; синтаксис слегка упорядочен для ясного чтения.
