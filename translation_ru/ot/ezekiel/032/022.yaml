  yaml_path: translation/ot/ezekiel/032/022.yaml
  text: There is Assyria and all her assembly[a], with his graves all around him; all of them are slain, fallen by the sword.
translation:
  language: ru
  text: Там Ассирия и всё её множество[a], а вокруг него — его могилы; все они убиты, пали от меча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте происходит смена рода в олицетворении: после «Ассирии» и «её множества» стоят формы мужского рода — «вокруг него» и «его могилы». Перевод сохраняет эту смену.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Указательное наречие вводит следующую фигуру в картине мира мёртвых; прямое «там» сохраняет пространственную соотнесённость.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: Здесь название обозначает державу, олицетворённую в шеоле; «Ассирия» — общепринятая русская форма.
- source_word: וְכָל־קְהָלָהּ
  choice: и всё её множество
  rationale: קהל обозначает собранную вместе общность. «Множество» передаёт собирательный смысл, не сужая его до одного лишь войска; «её» отражает суффикс 3-го лица женского рода.
- source_word: סְבִיבוֹתָיו
  choice: вокруг него
  rationale: Форма употреблена обстоятельственно и указывает на расположение могил вокруг центральной фигуры; мужской суффикс сохранён.
- source_word: קִבְרֹתָיו
  choice: его могилы
  rationale: Прямой эквивалент с сохранением мужского суффикса, несмотря на предшествующее олицетворение Ассирии в женском роде.
- source_word: כֻּלָּם
  choice: все они
  rationale: Итоговое местоименное выражение охватывает всю названную группу.
- source_word: חֲלָלִים
  choice: убитые
  rationale: В данном военном контексте слово обозначает людей, погибших насильственной смертью.
- source_word: הַנֹּפְלִים
  choice: павшие
  rationale: Причастие сохраняет военный и пророческий оттенок исходного выражения.
- source_word: בֶּחָרֶב
  choice: от меча
  rationale: Естественный русский библейский оборот для гибели в вооружённом насилии.
theological_decisions:
- issue: Смена грамматического рода в олицетворении Ассирии
  choice: Сохранён переход от женского «её» к мужским «него» и «его».
  alternative: 'Согласовать все местоимения с русским словом «Ассирия»: «вокруг неё — её могилы».'
  rationale: Еврейский текст действительно переходит от суффикса женского рода в קְהָלָהּ к мужским суффиксам в סְבִיבוֹתָיו и קִבְרֹתָיו. Сглаживание устранило бы заметную особенность олицетворения и могло бы преждевременно разрешить неоднозначность референта.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной пророческой интонацией. Конструкция с тире помогает ясно передать именные характеристики погибших и не превращает два еврейских обозначения в два отдельных события.
