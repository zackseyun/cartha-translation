base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/007.yaml
  text: When I extinguish you[a], I will cover the heavens and darken their stars; I will cover the sun with a cloud, and the moon will not give its light.
translation:
  language: ru
  text: Когда Я погашу тебя[a], Я покрою небеса и омрачу их звёзды; солнце Я покрою облаком, и луна не даст своего света.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда ты угаснешь». Еврейское выражение использует образ гаснущего света.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִסֵּיתִי
  choice: Я покрою
  rationale: Глагол כסה означает «покрывать, скрывать». Будущее время естественно передаёт последовательность действий в пророческом контексте.
- source_word: בְכַבּוֹתְךָ
  choice: когда ты угаснешь
  rationale: Форма от כבה буквально описывает угасание или тушение света. Возврат к образу угасания сохраняет метафору оригинала, а отсутствие явно названного деятеля отражает грамматическую неоднозначность.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Форма множественного числа и возвышенный контекст космического суда естественно передаются словом «небеса».
- source_word: וְהִקְדַּרְתִּי
  choice: и омрачу
  rationale: Каузатив от קדר означает «сделать тёмным». «Омрачу» звучит естественно и сохраняет возвышенный пророческий регистр.
- source_word: כֹּכְבֵיהֶם
  choice: их звёзды
  rationale: Местоименный суффикс формально согласуется с множественным «небеса»; русский перевод сохраняет это соотношение.
- source_word: שֶׁמֶשׁ בֶּעָנָן אֲכַסֶּנּוּ
  choice: солнце Я закрою облаком
  rationale: Предлог ב передаёт средство или покров, а местоименный суффикс при глаголе относится к солнцу. Порядок слов сохраняет тематическое выделение солнца.
- source_word: וְיָרֵחַ לֹא יָאִיר אוֹרוֹ
  choice: и луна не будет давать своего света
  rationale: Каузативная форма אור допускает значение «давать свет». Такая формулировка ясна по-русски и сохраняет выраженное в еврейском тексте притяжательное «своего».
theological_decisions:
- issue: Характер образа космического помрачения
  choice: Передать космические образы прямо, не уточняя, описывают ли они буквальное астрономическое событие или образно выражают падение фараона и Египта.
  alternative: Истолковать образы исключительно буквально либо исключительно как политическую метафору.
  rationale: Еврейский текст использует традиционный пророческий язык суда, но сам стих не требует выбрать только одно из этих толкований.
- issue: Деятель при угасании адресата
  choice: 'Основной текст: «когда ты угаснешь», с примечанием о возможном «когда Я погашу тебя».'
  alternative: 'Явно назвать Бога деятелем в основном тексте: «когда Я погашу тебя».'
  rationale: Инфинитив с суффиксом обозначает угасание адресата, но грамматически не называет деятеля; примечание сохраняет и контекст божественного суда, и формальную открытость выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис остаётся ясным для широкого круга читателей; космическая образность и повтор мотива покрытия сохранены без архаизмов.
