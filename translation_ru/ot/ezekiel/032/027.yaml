base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/027.yaml
  text: And they do not lie with the mighty, the fallen from among the uncircumcised[a], who went down to Sheol with their weapons of war, whose swords were placed under their heads, and whose iniquities were upon their bones[e][d][c][b]; for the terror of the mighty was in the land of the living.
translation:
  language: ru
  text: И они не лежат с могучими, павшими из числа необрезанных[a][b], которые сошли в шеол[c] со своим боевым оружием, положили свои мечи себе под головы, и беззакония их — на костях их[d], ибо ужас, внушаемый могучими, был в земле живых[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И они не будут лежать с могучими». В этом плаче древнееврейская глагольная форма может иметь оттенок будущего времени.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «с могучими павшими из числа необрезанных». Древнееврейская конструкция трудна; слова «могучие» и «павшие» можно теснее связать между собой.'
    reason: alternative_reading
  - marker: c
    text: 'Шеол — мир мёртвых; возможные передачи: «могила» или «подземный мир».'
    reason: lexical_alternative
  - marker: d
    text: Слово, переведённое как «беззакония», может также означать «вина» или «кара за их беззакония».
    reason: lexical_alternative
  - marker: e
    text: 'Заключительная древнееврейская фраза трудна. Возможный перевод: «ибо они, могучие, наводили ужас в земле живых».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא יִשְׁכְּבוּ
  choice: И они не лежат
  rationale: В погребальном контексте שׁכב означает «лежать», то есть покоиться среди умерших. Настоящее время передаёт живое описание плача; возможный оттенок будущего отмечен в сноске.
- source_word: אֶת גִּבּוֹרִים
  choice: рядом с могучими
  rationale: В трудной конструкции אֶת понято как указание на совместность. «Рядом с» естественно по-русски передаёт сопоставление погребального положения, а «могучие» не сужает значение до одной лишь воинской роли.
- source_word: נֹפְלִים מֵעֲרֵלִים
  choice: павшими из числа необрезанных
  rationale: נֹפְלִים передано субстантивированно, а מֵעֲרֵלִים — партитивно. Буквальное «необрезанные» сохраняет значимую для главы категорию.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское представление о мире мёртвых и не сводит его ни к отдельной могиле, ни к более позднему понятию ада.
- source_word: בִּכְלֵי מִלְחַמְתָּם
  choice: со своим боевым оружием
  rationale: Сочетание обозначает воинское снаряжение или оружие. Выбран естественный русский оборот, сохраняющий образ воинского погребения.
- source_word: וַיִּתְּנוּ אֶת חַרְבוֹתָם תַּחַת רָאשֵׁיהֶם
  choice: их мечи положены им под головы
  rationale: Пассивная конструкция не уточняет, кто совершил погребальное действие, и ясно сохраняет образ мечей под головами умерших.
- source_word: וַתְּהִי עֲוֺנֹתָם עַל עַצְמוֹתָם
  choice: и их беззакония — на их костях
  rationale: 'Краткая именная конструкция сохраняет мрачную образность и многозначность עָוֹן: беззаконие, вина или кара за него.'
- source_word: כִּי חִתִּית גִּבּוֹרִים בְּאֶרֶץ חַיִּים
  choice: ибо ужас, внушаемый могучими, царил в земле живых
  rationale: Эллиптическая и трудная фраза понята как указание на ужас, исходивший от могучих. Добавленное «царил» делает предложение естественным по-русски, не устраняя отмеченной в сноске неоднозначности.
theological_decisions:
- issue: Значение עָוֹן в контексте суда
  choice: В основном тексте сохранено «беззакония», без окончательного выбора между грехом, виной и наказанием.
  alternative: «вина» или «кара за их беззакония»
  rationale: Древнееврейское слово охватывает проступок, возникшую из него вину и его последствие; образ намеренно может соединять нравственное зло и суд за него.
- issue: Направленность «ужаса могучих»
  choice: Фраза передана как ужас, который внушали могучие.
  alternative: «ибо они, могучие, наводили ужас в земле живых» или более формальное «ибо ужас могучих был в земле живых»
  rationale: Родительная конструкция допускает несколько оттенков, а эллиптичность оригинала не позволяет уверенно восстановить все подразумеваемые связи; альтернативное понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Сохранены ключевые образы погребения, шеола, костей и земли живых. Тире помогает передать приложение и эллиптическую древнееврейскую фразу без тяжеловесной буквальности.
