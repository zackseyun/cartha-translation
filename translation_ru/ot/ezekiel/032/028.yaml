  text: וְ/אַתָּ֗ה בְּ/ת֧וֹךְ עֲרֵלִ֛ים תִּשָּׁבַ֥ר וְ/תִשְׁכַּ֖ב אֶת חַלְלֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/028.yaml
  text: But you[a], in the midst of the uncircumcised, will be broken and will lie with those slain by the sword.
translation:
  language: ru
  text: Но ты будешь сокрушён среди необрезанных и ляжешь вместе с убитыми мечом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «с поражёнными мечом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но ты
  rationale: Союз с самостоятельным местоимением вводит подчёркнутое прямое обращение к фараону и в данном контексте имеет противопоставительный оттенок.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: среди необрезанных
  rationale: Передаёт положение в окружении этой группы и сохраняет буквальный культурно-заветный образ, служащий у Иезекииля знаком посмертного бесчестия.
- source_word: תִּשָּׁבַר
  choice: будешь сокрушён
  rationale: Форма нифаля выражает претерпеваемое поражение и гибель; «сокрушён» естественно звучит в торжественной пророческой речи и сильнее передаёт שבר, чем нейтральное «сломлен».
- source_word: וְתִשְׁכַּב
  choice: и ляжешь
  rationale: Глагол сохраняет образ лежания в смерти или погребении; контекст ясно указывает на смерть, поэтому поясняющее добавление не требуется.
- source_word: אֶת חַלְלֵי חָרֶב
  choice: вместе с убитыми мечом
  rationale: При глаголе «лежать» אֶת имеет значение совместности. Формулировка естественна по-русски и сохраняет образ насильственной смерти от меча.
theological_decisions:
- issue: Значение עֲרֵלִים в плаче-пророчестве о народах
  choice: Сохранено буквальное обозначение «необрезанные».
  alternative: «нечистые», «безбожные» или «язычники»
  rationale: Еврейский текст использует телесный и заветный термин, который в Иезекииля 32 отмечает бесчестие среди мёртвых. Буквальный перевод сохраняет богословскую и культурную напряжённость образа, не сводя его к более общему толкованию.
- issue: Образ שׁכב как указание на смерть
  choice: Сохранено «ляжешь» без явного добавления «умрёшь».
  alternative: «будешь лежать мёртвым» или «умрёшь»
  rationale: Исходный текст выражает смерть через погребальный образ. Контекст и упоминание убитых мечом делают смысл ясным, а прямое пояснение устранило бы образность оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого плача. Синтаксис остаётся ясным для широкого читателя; сохранены ключевые образы сокрушения, лежания среди мёртвых и необрезанности как знака бесчестия.
