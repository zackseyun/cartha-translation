source:
  edition: WLC
  text: קִינָ֥ה הִיא֙ וְ/ק֣וֹנְנ֔וּ/הָ בְּנ֥וֹת הַ/גּוֹיִ֖ם תְּקוֹנֵ֣נָּה אוֹתָ֑/הּ עַל מִצְרַ֤יִם וְ/עַל כָּל הֲמוֹנָ/הּ֙ תְּקוֹנֵ֣נָּה אוֹתָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/016.yaml
  text: This is a lamentation[a], and the daughters of the nations will lament over her. They will lament over Egypt and over all her multitude[b], declares the Lord GOD.
translation:
  language: ru
  text: Это песнь-плач[a]. Дочери народов[b] будут исполнять её; об Египте и обо всём его множестве будут исполнять её, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погребальная песнь» или «плач». Еврейское קִינָה обозначает песнь скорби, часто исполняемую по умершему.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочери народов». Это выражение может обозначать женщин из разных народов; возможно, имеются в виду плакальщицы.'
    reason: lexical_clarification
lexical_decisions:
- source_word: קִינָה
  choice: плачевная песнь
  rationale: Слово обозначает песнь скорби, нередко погребальную. Перевод сохраняет песенный характер текста и не сужает значение исключительно до похоронного обряда.
- source_word: וְקוֹנְנוּהָ / תְּקוֹנֵנָּה אוֹתָהּ
  choice: будут исполнять её
  rationale: Глагол קונן означает произносить или петь плач; местоименный суффикс женского рода естественно соотносится с קִינָה, то есть с самой плачевной песнью. «Исполнять» передаёт эту связь яснее, чем «оплакивать её».
- source_word: בְּנוֹת הַגּוֹיִם
  choice: дочери народов
  rationale: Буквальный образ сохранён, поскольку он может обозначать женщин разных народов, в том числе плакальщиц, и не требует однозначно сводить выражение к профессиональной роли.
- source_word: עַל מִצְרַיִם
  choice: об Египте
  rationale: В сочетании с плачевной песнью עַל обозначает того, о ком или по кому совершается плач. «Об Египте» согласуется с тем, что непосредственным объектом глагола остаётся песнь.
- source_word: כָּל הֲמוֹנָהּ
  choice: всё его множество
  rationale: הָמוֹן здесь охватывает многочисленное население или скопление людей, связанных с Египтом, без обязательного ограничения войском. Русское местоимение согласовано с грамматическим родом названия «Египет».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: говорит Владыка Яхве
  rationale: Передана обычная пророческая формула; אֲדֹנָי переведено как «Владыка», а личное имя יהוה — как «Яхве», без неестественного повтора «Господь Господь».
theological_decisions:
- issue: Передача божественного имени יהוה после אֲדֹנָי
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Текст непосредственно содержит личное имя יהוה. Его передача как «Яхве» сохраняет различие между титулом אֲדֹנָי и именем Бога, не добавляя толкования.
- issue: К кому относится местоименный суффикс в וְקוֹנְנוּהָ и אוֹתָהּ
  choice: к плачевной песне
  alternative: к Египту как оплакиваемой стороне
  rationale: Форма женского рода непосредственно согласуется с предшествующим существительным קִינָה; Египет затем вводится оборотом с עַל. Перевод сохраняет эту грамматическую структуру, хотя смысл плача об Египте остаётся явным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Повтор «будут исполнять её» сохранён вслед за еврейским текстом; архаизмы и конфессионально маркированные формулы не использованы.
