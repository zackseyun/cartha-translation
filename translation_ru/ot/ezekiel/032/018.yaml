  text: בֶּן אָדָ֕ם נְהֵ֛ה עַל הֲמ֥וֹן מִצְרַ֖יִם וְ/הוֹרִדֵ֑/הוּ א֠וֹתָ/הּ וּ/בְנ֨וֹת גּוֹיִ֧ם אַדִּרִ֛ם אֶל אֶ֥רֶץ תַּחְתִּיּ֖וֹת אֶת י֥וֹרְדֵי בֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/018.yaml
  text: Son of man[a], wail over the multitude of Egypt, and bring her down, her and the daughters of mighty nations, to the land beneath[c][b], with those who go down to the pit.
translation:
  language: ru
  text: Сын человеческий, оплачь множество Египта[a] и низведи его[d] — Египет и дочерей могучих народов[b] — в нижние пределы земли[c], вместе с теми, кто сходит в яму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о сонме Египта»; еврейское слово может означать множество, толпу или шумную массу людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочерей могучих народов» — образное обозначение народов или стран, связанных с Египтом.'
    reason: cultural_note
  - marker: c
    text: 'Или: «в нижнюю землю», «в область внизу». Речь идёт о нижней области, связанной с умершими.'
    reason: alternative_reading
  - marker: d
    text: В еврейском тексте при глаголе стоит местоименный суффикс мужского рода, вероятно относящийся к «множеству», а далее — женское местоимение, относящееся к персонифицированному Египту. Перевод передаёт эту связь смысловым, естественным для русского языка образом.
    reason: textual_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устоявшаяся и прозрачная передача пророческого обращения в книге Иезекииля; сохраняет образ исходного текста без истолковывающей замены.
- source_word: נְהֵה
  choice: подними плач
  rationale: Глагол обозначает скорбное, подобное погребальному, оплакивание. Выражение «подними плач» естественно для возвышенной современной русской речи и передаёт слышимое причитание.
- source_word: הֲמוֹן מִצְרַיִם
  choice: множество Египта
  rationale: הָמוֹן здесь прежде всего означает многочисленную массу людей, толпу или сонм; нейтральное «множество» не сужает смысл до войска или богатства.
- source_word: וְהוֹרִדֵהוּ
  choice: низведи его
  rationale: Каузативный императив передан глаголом «низведи». Русское местоимение согласовано с грамматически мужским названием «Египет»; это естественно передаёт общий смысл, несмотря на нерегулярное чередование рода в еврейской конструкции.
- source_word: אוֹתָהּ
  choice: его
  rationale: В еврейском Египет персонифицирован как женская сущность, но в русском название страны мужского рода, поэтому грамматически естественно «его».
- source_word: וּבְנוֹת גּוֹיִם אַדִּרִם
  choice: и дочерей могучих народов
  rationale: Сохранён исходный образ «дочерей», вероятно обозначающий связанные с Египтом народы или олицетворённые страны. «Могучих» передаёт силу и величие אַדִּרִם.
- source_word: אֶרֶץ תַּחְתִּיּוֹת
  choice: землю глубин
  rationale: Выражение буквально указывает на землю нижних мест. «Земля глубин» сохраняет пространственный образ мира внизу и не превращает его в позднейший догматический термин.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: вместе со сходящими в яму
  rationale: 'אֶת понято ассоциативно: Египет низводится в общество умерших, сходящих в яму. Причастная конструкция сохраняет движение вниз.'
- source_word: בּוֹר
  choice: яма
  rationale: «Яма» непосредственно сохраняет конкретный погребально-подземный образ и не отождествляет его однозначно ни с могилой, ни с адом.
theological_decisions:
- issue: Характер образов אֶרֶץ תַּחְתִּיּוֹת и בּוֹר
  choice: Передать их как «землю глубин» и «яму», сохранив поэтический образ нижней области мёртвых.
  alternative: «Преисподняя», «шеол» или «ад».
  rationale: Еврейский текст рисует нисхождение в область умерших языком пророческого суда, но не даёт оснований отождествлять её с позднее систематизированным учением об аде.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксическое повторение «его — его и…» сохранено как риторическое уточнение исходного текста; тире делает его понятным. Термины не вводят поздней конфессиональной конкретизации загробного мира.
