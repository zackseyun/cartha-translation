    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: אֲדֹנָי передаёт титул верховной власти, а יְהוָה — личное Божье имя. «Владыка Яхве» сохраняет оба элемента и избегает неестественного сочетания «Господь ГОСПОДЬ».
- source_word: וּפָרַשְׂתִּי
  choice: Я раскину
  rationale: Глагол פרשׂ означает «распростереть, раскинуть»; применительно к сети естественное русское соответствие — «раскинуть».
- source_word: רִשְׁתִּי
  choice: свою сеть
  rationale: רֶשֶׁת — обычное обозначение сети. Возвратное притяжательное местоимение естественно передаёт суффикс первого лица при совпадении с подлежащим.
- source_word: בִּקְהַל עַמִּים רַבִּים
  choice: с помощью собрания многих народов
  rationale: 'קָהָל обозначает собравшееся множество, а בְּ в данном контексте вероятнее всего имеет инструментальное значение: многие народы служат средством Божьего суда. Множественное עַמִּים передано как «народы».'
- source_word: וְהֶעֱלוּךָ
  choice: и они вытащат тебя
  rationale: Каузативная форма עלה буквально означает «поднимут тебя»; в образе рыбной ловли естественное значение — «вытащат» из воды.
- source_word: בְּחֶרְמִי
  choice: моим неводом
  rationale: חֶרֶם здесь — рыболовная сеть; «невод» сохраняет отличие от רֶשֶׁת в первой части стиха и передаёт образ сети, которой извлекают улов.
theological_decisions:
- issue: Передача составного Божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант открыто передаёт личное имя יְהוָה и одновременно сохраняет отдельный титул אֲדֹנָי, не смешивая два элемента выражения.
- issue: Роль многих народов в Божьем действии
  choice: народы выступают средством, посредством которого Бог раскидывает сеть
  alternative: сеть раскидывается среди собрания многих народов
  rationale: Инструментальное понимание предлога בְּ лучше соответствует продолжению «они вытащат тебя», однако грамматика допускает и обстоятельственное понимание, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Рыболовный образ сохранён, а два разных еврейских слова для сети переданы словами «сеть» и «невод».
