source:
  edition: WLC
  text: בְּ/תִתִּ/י֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם שְׁמָמָ֣ה וּ/נְשַׁמָּ֗ה אֶ֚רֶץ מִ/מְּלֹאָ֔/הּ בְּ/הַכּוֹתִ֖/י אֶת כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/015.yaml
  text: When I make the land of Egypt a desolation[a], and the land is stripped of all that fills it, when I strike down all who dwell in it, then they will know that I am Yahweh.
translation:
  language: ru
  text: Когда Я предам землю Египта запустению[a], когда она будет опустошена и лишена всего, что её наполняет, и Я поражу всех её жителей, тогда они узнают, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда Я сделаю землю Египта пустошью и она будет лишена всего, что её наполняет».'
    reason: 'Лексическая альтернатива: שְׁמָמָה может быть передано как «пустошь», а נְשַׁמָּה — как «будет лишена/опустошена»; оба варианта сохраняют смысл разорения, не сводя его к одной лишь безлюдности.'
lexical_decisions:
- source_word: בְּתִתִּי
  choice: Когда Я превращу
  rationale: ב с инфинитивом образует временную конструкцию; נתן при дополнении результата здесь означает «сделать, превратить во что-либо».
- source_word: אֶרֶץ מִצְרַיִם
  choice: землю Египта
  rationale: Естественная русская передача сочетания со значением принадлежности/уточнения.
- source_word: שְׁמָמָה
  choice: в пустыню
  rationale: Существительное обозначает опустошённое, разорённое место; конструкция «превратить в пустыню» сохраняет именную образность и естественна по-русски.
- source_word: וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ
  choice: когда земля лишится всего, что её наполняет
  rationale: Передаёт пассивное опустошение земли и идиому «от её полноты», избегая тяжеловесного буквального повтора слова «пустыня».
- source_word: בְּהַכּוֹתִי
  choice: и Я поражу
  rationale: Вторая конструкция ב с инфинитивом относится к той же временной рамке; «поражу» сохраняет силу глагола נכה, не уточняя сверх текста способ или неизбежно смертельный исход для каждого.
- source_word: כָּל יֹשְׁבֵי בָהּ
  choice: всех её жителей
  rationale: Краткая и естественная передача причастного выражения «всех живущих в ней».
- source_word: וְיָדְעוּ
  choice: тогда они узнают
  rationale: «Тогда» ясно выражает результат предшествующего суда, заложенный в последовательности еврейской фразы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; «Яхве» является принятой научной реконструкцией произношения и не заменяет имя титулом.
- issue: Смысл וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ
  choice: земля лишится всего, что её наполняет
  alternative: земля будет опустошена, лишившись всего, что её наполняет
  rationale: Выбранная формулировка сохраняет образ полного лишения содержимого и не усиливает текст конфессиональным или интерпретационным уточнением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавное «Я» употреблено в прямой речи Бога по устойчивой русской библейской традиции. Синтаксис слегка упрощён для ясности, при этом сохранены две временные предпосылки и итоговая формула узнавания.
