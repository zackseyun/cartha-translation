source:
  edition: WLC
  text: שָׁ֣מָּ/ה נְסִיכֵ֥י צָפ֛וֹן כֻּלָּ֖/ם וְ/כָל צִֽדֹנִ֑י אֲשֶׁר יָרְד֣וּ אֶת חֲלָלִ֗ים בְּ/חִתִּיתָ֤/ם מִ/גְבֽוּרָתָ/ם֙ בּוֹשִׁ֔ים וַ/יִּשְׁכְּב֤וּ עֲרֵלִים֙ אֶת חַלְלֵי חֶ֔רֶב וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/030.yaml
  text: There are all the princes of the north[a], all of them, and all the Sidonians, who went down with the slain in the terror they caused by their might, ashamed. They lie uncircumcised with those slain by the sword[c][b], and they bear their disgrace with those who go down to the pit.
translation:
  language: ru
  text: Там — все князья севера[a], все они, и все сидоняне, которые сошли вместе с убитыми, внушавшие ужас своей мощью, посрамлённые. Они лежат необрезанными[c] вместе с убитыми мечом и несут свой позор вместе с нисходящими в яму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Там находятся все князья севера».'
    reason: lexical_alternative
  - marker: c
    text: «Необрезанные» — буквальный термин; в пророческой речи Иезекииля о суде он служит обозначением бесчестия.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: Там
  rationale: Указательное наречие обозначает место пребывания перечисляемых мёртвых; тире естественно передаёт функцию предъявления в русском повествовании.
- source_word: נְסִיכֵי צָפוֹן
  choice: князья севера
  rationale: «Князья» сохраняет высокий политический смысл נְסִיכֵי, не уточняя сверх текста форму власти.
- source_word: כֻּלָּם
  choice: все до одного
  rationale: Передаёт отдельно выраженную всеохватность כֻּלָּם и избегает тяжёлого повтора «все они».
- source_word: וְכָל צִדֹנִי
  choice: и все сидоняне
  rationale: Единственное собирательное обозначение народа естественно передаётся русским множественным числом.
- source_word: יָרְדוּ אֶת חֲלָלִים
  choice: сошли вместе с убитыми
  rationale: «Сошли» сохраняет повторяющийся в главе образ нисхождения в мир мёртвых, а אֶת здесь по контексту имеет сопроводительный смысл.
- source_word: בְּחִתִּיתָם מִגְבוּרָתָם
  choice: хотя своей мощью внушали ужас
  rationale: Передаёт ужас как исходящий от их военной мощи. Связь с «посрамлённые» в еврейском сжата и неоднозначна, поэтому буквальная конструкция приведена в примечании.
- source_word: בּוֹשִׁים
  choice: посрамлённые
  rationale: Выражает состояние унижения и созвучно последующему упоминанию позора, сохраняя судебный регистр.
- source_word: וַיִּשְׁכְּבוּ
  choice: Они лежат
  rationale: Настоящее время передаёт описываемое в видении продолжающееся состояние мёртвых.
- source_word: עֲרֵלִים
  choice: необрезанными
  rationale: Сохранён конкретный заветный термин, который в данном контексте служит обозначением бесчестия.
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: вместе с убитыми мечом
  rationale: Ассоциативное значение אֶת передано естественной русской конструкцией, а образ меча сохранён буквально.
- source_word: בּוֹר
  choice: могилу
  rationale: В контексте главы «яма» обозначает место мёртвых; «могила» ясно передаёт этот смысл, не вводя более специального богословского термина.
theological_decisions:
- issue: Передача עֲרֵלִים в контексте суда
  choice: необрезанными
  alternative: чуждыми завету
  rationale: Конкретное слово сохранено без истолковывающей подмены; его заветные и позорящие оттенки возникают из контекста.
- issue: Временная форма וַיִּשְׁכְּבוּ в перечне обитателей преисподней
  choice: Они лежат
  alternative: И они легли
  rationale: Хотя еврейская глагольная форма повествовательная, здесь описывается наличное положение мёртвых; русское настоящее время естественно передаёт картину видения.
- issue: Логическая связь ужаса, мощи и посрамления
  choice: посрамлённые, хотя своей мощью внушали ужас
  alternative: посрамлённые в своём ужасе, исходившем от их мощи
  rationale: Сжатая еврейская конструкция допускает разные способы связать обстоятельственный оборот с посрамлением. Основной текст выражает наиболее вероятный контраст, а примечание сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим регистром. Синтаксис слегка приподнят, но остаётся понятным; повтор всеохватности и ключевые образы нисхождения, меча, необрезанности и позора сохранены.
