  text: יְדַבְּרוּ ל֞/וֹ אֵלֵ֧י גִבּוֹרִ֛ים מִ/תּ֥וֹךְ שְׁא֖וֹל אֶת עֹֽזְרָ֑י/ו יָֽרְד֛וּ שָׁכְב֥וּ הָ/עֲרֵלִ֖ים חַלְלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/021.yaml
  text: 'The mighty among the chiefs will speak to him from the midst of Sheol[a], with his helpers: ‘They have gone down; they lie still, the uncircumcised[c][b], slain by the sword.’'
translation:
  language: ru
  text: 'Из Шеола[a] к нему обратятся могучие среди воинов[b] вместе с его помощниками[c]: «Они сошли и лежат — необрезанные, сражённые мечом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — древнееврейское название мира мёртвых; по значению оно не тождественно слову «ад».
    reason: cultural_note
  - marker: b
    text: 'Древнееврейское выражение трудно для понимания; возможный перевод: «сильнейшие среди воинов» или «вожди могучих».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вместе с его союзниками»; речь может идти о тех, кто сопровождает его в смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבְּרוּ לּוֹ
  choice: к нему обратятся
  rationale: Будущее время передаёт пророческую сцену, а сочетание «обратятся к нему» естественно выражает речь, направленную к фараону.
- source_word: אֵלֵי גִבּוֹרִים
  choice: могучие из воинов
  rationale: Фраза трудна; перевод сохраняет представление о выдающихся воинах и не вводит без необходимости значение «боги» или более конкретное «вожди».
- source_word: מִתּוֹךְ שְׁאוֹל
  choice: из глубин Шеола
  rationale: Сохраняется пространственный образ речи, доносящейся из царства мёртвых; термин «Шеол» не отождествляется ни просто с могилой, ни с позднейшим понятием ада.
- source_word: אֶת עֹזְרָיו
  choice: вместе с его помощниками
  rationale: אֶת понято в сопроводительном значении; «помощники» сохраняет основное значение עֹזְרָיו, а возможное «союзники» отмечено в сноске.
- source_word: יָרְדוּ
  choice: они сошли сюда
  rationale: Глагол обозначает завершённое нисхождение в Шеол; «сюда» естественно передаёт точку зрения говорящих из царства мёртвых, не уточняя субъект сверх текста.
- source_word: שָׁכְבוּ
  choice: лежат
  rationale: В контексте смерти глагол означает лежать мёртвыми; краткое «лежат» сохраняет мрачную сдержанность образа.
- source_word: הָעֲרֵלִים
  choice: необрезанные
  rationale: Сохраняется буквальное и значимое для Иезекииля обозначение, связанное с позором умерших народов.
- source_word: חַלְלֵי חָרֶב
  choice: сражённые мечом
  rationale: Естественное русское соответствие устойчивому древнееврейскому выражению о погибших от меча.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; преисподняя; ад; царство мёртвых
  rationale: Транслитерация сохраняет ветхозаветный концептуальный диапазон термина и не навязывает ему позднейшее учение об аде; значение пояснено в сноске.
- issue: Толкование אֵלֵי גִבּוֹרִים
  choice: могучие из воинов
  alternative: сильнейшие среди воинов; вожди могучих; боги могучих
  rationale: Контекст Иезекииля 32 изображает павших воинов и народы в Шеоле. Человеческое понимание здесь вероятнее, но трудность конструкции и иная возможная передача отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксис сохранён компактным; тире подчёркивает итоговый образ погибших, не снимая неоднозначности местоимения «они».
