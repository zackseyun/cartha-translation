  text: כִּֽי נָתַ֥תִּי אֶת חתית/ו בְּ/אֶ֣רֶץ חַיִּ֑ים וְ/הֻשְׁכַּב֩ בְּ/ת֨וֹךְ עֲרֵלִ֜ים אֶת חַלְלֵי חֶ֗רֶב פַּרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/032.yaml
  text: For I put his terror in the land of the living[a], and he will be laid among the uncircumcised, with those slain by the sword—Pharaoh and all his multitude, declares the Lord GOD.
translation:
  language: ru
  text: Ибо Я навёл его ужас на землю живых[a], и фараон со всем своим множеством будет положен среди необрезанных, вместе с убитыми мечом, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно некоторым древним свидетелям: «Мой ужас на землю живых». В еврейском тексте здесь: «его ужас».'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит обоснование предшествующего высказывания и сохраняет торжественную пророческую связность.
- source_word: נָתַתִּי
  choice: Я вселил
  rationale: Буквально «Я дал/поместил»; с существительным «ужас» русское «вселил ужас» естественно передаёт причинение и распространение страха, не уточняя сверх текста его механизм.
- source_word: חֲתִיתוֹ
  choice: его ужас
  rationale: 'Масоретский текст содержит суффикс 3-го лица мужского рода: речь об ужасе, который внушал фараон. Вариант «Мой ужас» засвидетельствован древними свидетелями и вынесен в примечание.'
- source_word: בְּאֶרֶץ חַיִּים
  choice: в землю живых
  rationale: Устойчивый библейский образ области живущих в противопоставлении миру мёртвых; направление «в» согласуется с выбранным русским оборотом «вселил ... в».
- source_word: וְהֻשְׁכַּב
  choice: и он будет положен
  rationale: Сохраняет пассивное значение хофала от שׁכב и образ помещения среди умерших.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: среди необрезанных
  rationale: Передаёт буквальное и богословски нагруженное обозначение народов, связанное в этой главе с позором смерти.
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: вместе с убитыми мечом
  rationale: Здесь אֶת выражает совместность; формулировка ясна современному читателю и сохраняет образ насильственной смерти.
- source_word: פַּרְעֹה וְכָל הֲמוֹנוֹ
  choice: фараон и всё его множество
  rationale: הָמוֹן обозначает многочисленную массу людей и может иметь военный оттенок, однако нейтральное «множество» не сужает значение до войска.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» естественно передаёт пророческую формулу נְאֻם; «Владыка Яхве» различает титул אֲדֹנָי и личное имя יהוה, избегая сочетания «Господь Господь».
theological_decisions:
- issue: Местоименный суффикс в חֲתִיתוֹ
  choice: его ужас
  alternative: Мой ужас
  rationale: Следуем чтению масоретского еврейского текста с суффиксом 3-го лица, не устраняя значимый вариант древних свидетелей, который указан в сноске.
- issue: Передача אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача личного имени «Яхве» сохраняет различие между титулом и именем Бога и непосредственно отражает еврейскую форму.
- issue: Референт страха в выражении «его ужас»
  choice: Сохранена грамматическая отсылка к фараону без поясняющей вставки
  alternative: ужас, который он внушал
  rationale: Краткая форма сохраняет смысловую напряжённость оригинала и не превращает подразумеваемую связь в явное толкование.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сохраняет торжественность и перечислительную структуру оригинала, но остаётся понятным обычному читателю. Маркер [a] помещён непосредственно после спорного чтения.
