  text: Я положу твою плоть на горы и наполню долины твоим трупом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово трудно для перевода; буквально оно связано с «высотой» или «возвышенностью» и может означать «твою высокую стать». По контексту речь, вероятно, идёт о поверженном теле фараона; возможный перевод: «твоим трупом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И разложу
  rationale: Глагол נתן буквально имеет широкое значение «дать, положить, поместить». В данном образе поверженного тела русское «разложу… по горам» естественно передаёт распределение плоти по местности и прямое действие Бога.
- source_word: בְּשָׂרְךָ
  choice: твою плоть
  rationale: Сохраняется буквальный и намеренно жёсткий образ плоти; более мягкое «тело» ослабило бы выразительность пророческого суда.
- source_word: עַל הֶהָרִים
  choice: по горам
  rationale: הרים обычно означает «горы». Предлог «по» в сочетании с «разложу» естественно выражает распространение плоти по поверхности гор.
- source_word: וּמִלֵּאתִי
  choice: и наполню
  rationale: Пиэль глагола מלא прямо означает «наполнить» и сохраняет масштаб образа.
- source_word: הַגֵּאָיוֹת
  choice: долины
  rationale: גיא обозначает долину или ущелье. «Долины» создаёт ясную топографическую параллель с горами.
- source_word: רָמוּתֶךָ
  choice: твоей громадой
  rationale: Форма трудна и связана с представлением о высоте или возвышенности. «Твоей громадой» сохраняет намёк на огромную высоту или стать фараона и вместе с тем в контексте естественно относится к массе его поверженного тела, не подменяя спорное слово однозначным «трупом».
theological_decisions:
- issue: Жестокая образность Божьего суда
  choice: Сохранить конкретный образ плоти на горах и поверженной громады, наполняющей долины.
  alternative: Смягчить образ словами «тело» и «останки».
  rationale: Пророчество намеренно изображает унижение и полное поражение фараона в резких физических образах; смягчение ослабило бы смысл исходного текста.
- issue: Неясность слова רָמוּתֶךָ
  choice: Передать как «твоей громадой» и пояснить буквальный оттенок в сноске.
  alternative: Однозначно перевести «твоим трупом» либо формально «твоей высотой».
  rationale: Первый вариант снимает реальную лексическую неоднозначность, а второй по-русски остаётся почти непонятным. Выбранная формулировка удерживает и образ огромной стати, и контекст поверженного тела.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Графическая образность оригинала сохранена без архаизмов; «громада» позволяет выразить необычное еврейское слово, не устраняя его смысловой напряжённости.
