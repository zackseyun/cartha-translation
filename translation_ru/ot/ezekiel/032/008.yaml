base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/008.yaml
  text: All the lights of light in the heavens I will darken over you[a], and I will put darkness over your land, declares the Lord GOD.
translation:
  language: ru
  text: Все светила небесные Я помрачу над тобой[a] и покрою тьмой твою землю, — возвещает Господь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все светила света на небесах»; имеются в виду небесные тела как источники света.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְאוֹרֵי אוֹר בַּשָּׁמַיִם
  choice: Все светила небесные
  rationale: Конструкцию «светила света» естественно передаёт «светила»; это слово обозначает небесные тела как источники света. Перестановка определения соответствует литературному русскому языку.
- source_word: אַקְדִּירֵם עָלֶיךָ
  choice: Я помрачу над тобой
  rationale: Каузативная форма קדר означает, что Бог сделает светила тёмными; עַל сохраняет пространственный образ «над тобой».
- source_word: וְנָתַתִּי חֹשֶׁךְ עַל אַרְצְךָ
  choice: и покрою тьмой твою землю
  rationale: Буквально «положу тьму на твою землю». Русское «покрою тьмой» сохраняет конкретный образ и звучит естественно.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт торжественную пророческую формулу и остаётся понятным современному читателю.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה, не сливая два элемента составного титула.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и имя יהוה и прямо отражает оба элемента еврейского текста, не вводя конфессионального толкования.
- issue: Адресат выражения עָלֶיךָ
  choice: над тобой
  alternative: против тебя
  rationale: 'Сохранён пространственный образ: небесные светила меркнут над адресатом. Контекст суда присутствует, но предлог не сводится лишь к враждебному значению.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «светила небесные» поддерживает возвышенный ритм, не становясь архаичной; прописное «Я» принято для речи Бога.
