  yaml_path: translation/ot/ezekiel/032/020.yaml
  text: They will fall among those slain by the sword[a]. The sword is given; drag her away[b], and all her multitude.
translation:
  language: ru
  text: Среди сражённых мечом они падут. Меч дан; тащите её и всё её множество.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Меч назначен». Еврейская фраза предельно кратка и может означать, что меч предназначен для суда. Местоимение «её» относится к олицетворённому Египту, а «всё её множество» — к его многочисленному народу.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹךְ
  choice: среди
  rationale: Передаёт буквальное «в середине» естественным русским выражением и показывает, что они окажутся в числе убитых.
- source_word: חַלְלֵי חֶרֶב
  choice: сражённых мечом
  rationale: Конструктивное сочетание обозначает пронзённых или убитых оружием; эта формулировка сохраняет военный и судебный контекст.
- source_word: יִפֹּלוּ
  choice: они падут
  rationale: Имперфект в пророческом контексте выражает будущее; «падут» естественно и сохраняет торжественно-грозный тон.
- source_word: חֶרֶב נִתָּנָה
  choice: Меч отдан
  rationale: Сжатая пассивная конструкция сохранена без уточнения, кому или для чего отдан меч, чтобы не устранять неоднозначность оригинала.
- source_word: מָשְׁכוּ
  choice: тащите
  rationale: Императив множественного числа означает силой тянуть; «тащите» соответствует насильственному низведению в царство мёртвых.
- source_word: אוֹתָהּ
  choice: её
  rationale: Женский суффикс естественнее всего относится к олицетворённому Египту.
- source_word: וְכָל הֲמוֹנֶיהָ
  choice: и всё её множество
  rationale: Союз ו передан как «и», а הָמוֹן — широким словом «множество», охватывающим народ или многочисленную массу Египта без неоправданного ограничения только войском.
theological_decisions:
- issue: К кому относится местоимение женского рода в повелении
  choice: 'К олицетворённому Египту: «тащите её».'
  alternative: Ввиду сжатого синтаксиса местоимение иногда можно понимать иначе или связывать с предшествующей фразой о мече.
  rationale: Контекст главы говорит о фараоне и Египте и допускает олицетворение страны в женском роде; перевод сохраняет образ пророческой погребальной песни.
- issue: Смысл краткой фразы חֶרֶב נִתָּנָה
  choice: «Меч отдан».
  alternative: «Меч назначен»; «меч вручён».
  rationale: Еврейская фраза предельно сжата и не указывает прямо получателя или цель. Буквально близкая передача сохраняет её напряжённость и не вводит отсутствующего в тексте толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим оттенком. Синтаксическая резкость второй фразы намеренно сохранена; архаизмы и конфессионально окрашенные уточнения не используются.
