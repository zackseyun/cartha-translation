  text: 'В двенадцатом году, в пятнадцатый день месяца, ко мне было слово Яхве:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Естественно передаёт повествовательную формулу, вводящую датированное пророческое сообщение, без архаичного «и случилось».
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: в двенадцатом году
  rationale: Точное и обычное по-русски обозначение года в формуле датировки.
- source_word: בַּחֲמִשָּׁה עָשָׂר לַחֹדֶשׁ
  choice: в пятнадцатый день месяца
  rationale: Слово «день» подразумевается в еврейском и уместно восполняется для ясности по-русски; название месяца в исходном тексте отсутствует.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт личное имя Бога непосредственно.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямое и естественное соответствие еврейскому предлогу с местоименным суффиксом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В современном русском двоеточие естественно вводит последующую прямую речь и передаёт функцию еврейского инфинитива «сказать», избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» прямо сохраняет имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости датированной пророческой формулы. Повтор «было … было» удержан, поскольку он отражает две формы היה в еврейском тексте; двоеточие вместо буквального «сказать» соответствует нормам русской прямой речи.
