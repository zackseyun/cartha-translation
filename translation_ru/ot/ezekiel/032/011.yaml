lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего высказывания; «ибо» ясно сохраняет логическую связь и соответствует возвышенному пророческому регистру.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Устойчивую пророческую формулу естественно передаёт настоящее время, сохраняющее силу провозглашаемого слова.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Переданы оба элемента составного божественного титула без неестественного повтора «Господь Господь»; «Владыка» отражает אֲדֹנָי, а «Господь» — традиционное русское представление имени יהוה.
- source_word: חֶרֶב מֶלֶךְ בָּבֶל
  choice: меч царя Вавилона
  rationale: Прямо передана конструкция принадлежности; определённость выражается контекстом конкретного орудия суда.
- source_word: תְּבוֹאֶךָ
  choice: придёт на тебя
  rationale: Сохраняет буквальный пространственный образ глагола בוא с направлением к адресату, тогда как в контексте суда выражение несёт враждебный смысл.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Основной текст следует укоренённой русской библейской передаче имени יהוה как «Господь», одновременно различая оба компонента титула. Вариант «Яхве» точнее обозначает собственное имя, но его выбор мог бы привнести спорную конфессионально-издательскую установку, не требуемую самим стихом.
- issue: Направленность меча в תְּבוֹאֶךָ
  choice: придёт на тебя
  alternative: пойдёт против тебя
  rationale: Выбранный вариант сохраняет образную и грамматическую форму исходного текста, не устраняя заложенное в контексте суда напряжение между буквальным приближением и враждебным нападением.
