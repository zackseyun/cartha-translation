  text: שָׁ֤ם עֵילָם֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֣/ם חֲלָלִים֩ הַ/נֹּפְלִ֨ים בַּ/חֶ֜רֶב אֲֽשֶׁר יָרְד֥וּ עֲרֵלִ֣ים אֶל אֶ֣רֶץ תַּחְתִּיּ֗וֹת אֲשֶׁ֨ר נָתְנ֤וּ חִתִּיתָ/ם֙ בְּ/אֶ֣רֶץ חַיִּ֔ים וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/024.yaml
  text: There is Elam and all her multitude[a], all around her grave, all of them slain, fallen by the sword, who went down uncircumcised to the land below, who spread their terror in the land of the living; and they bore their shame with those who go down to the pit.
translation:
  language: ru
  text: Там Элам и всё его множество — вокруг его могилы; все они — убитые, павшие от меча. Они сошли необрезанными в нижние области земли[a]; они внушали ужас в земле живых и понесли свой позор вместе с нисходящими в яму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в землю нижних мест». Выражение образно обозначает область мёртвых; возможны также переводы: «в нижние части земли» или «в преисподнюю».'
    reason: Сохраняет образную многозначность אֶרֶץ תַּחְתִּיּוֹת, не отождествляя её безоговорочно с позднейшим систематизированным представлением о преисподней.
lexical_decisions:
- source_word: שָׁם עֵילָם
  choice: Там Элам
  rationale: Сохраняется указательное наречие, вводящее Элам как следующего участника картины мира мёртвых; имя передано принятой русской транслитерацией.
- source_word: וְכָל הֲמוֹנָהּ
  choice: и всё его множество
  rationale: הָמוֹן обозначает многочисленный народ или совокупность людей Элама. «Множество» сохраняет широту значения и не сужает его до войска; мужской род местоимения согласован с русской формой имени «Элам».
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: вокруг его могилы
  rationale: Прямо передаёт расположение погибших вокруг места погребения Элама.
- source_word: כֻּלָּם חֲלָלִים הַנֹּפְלִים בַּחֶרֶב
  choice: Все они убиты, пали от меча
  rationale: חֲלָלִים означает насильственно убитых, особенно павших в сражении; традиционная русская формула «пали от меча» сохраняет военный образ.
- source_word: יָרְדוּ עֲרֵלִים
  choice: сошли необрезанными
  rationale: Буквально сохранено обозначение необрезанных как знак позора народов в данном пророческом контексте.
- source_word: אֶל אֶרֶץ תַּחְתִּיּוֹת
  choice: в нижнюю землю
  rationale: Передаёт пространственный образ области мёртвых, буквально «земли нижних мест», не превращая его в развёрнутое учение о загробном мире.
- source_word: נָתְנוּ חִתִּיתָם
  choice: наводили ужас
  rationale: Естественный русский эквивалент идиомы «давали/налагали свой ужас», описывающей страх, который они внушали.
- source_word: בְּאֶרֶץ חַיִּים
  choice: в земле живых
  rationale: Сохраняется прозрачное библейское противопоставление мира живых области мёртвых.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: но понесли свой позор
  rationale: נשא с כְלִמָּה выражает несение позора как последствие их участи. Союз «но» естественно выявляет заложенный в сопоставлении поворот от прежнего ужаса к нынешнему унижению.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: вместе с нисходящими в яму
  rationale: 'אֶת здесь понято в сопроводительном смысле: Элам разделяет участь сходящих в яму. «Яма» сохраняет образ могилы и подземного мира без поясняющей конкретизации в основном тексте.'
theological_decisions:
- issue: Значение עֲרֵלִים в контексте суда
  choice: необрезанными
  alternative: осквернёнными; не посвящёнными
  rationale: Буквальный перевод сохраняет заветную и позорящую окраску слова в речи Иезекииля, не заменяя её более общим толкованием.
- issue: Образ אֶרֶץ תַּחְתִּיּוֹת
  choice: нижняя земля
  alternative: преисподняя; нижние области земли; мир мёртвых
  rationale: Выбранный вариант сохраняет пространственную метафору еврейского текста и не приписывает ему более систематизированного представления о посмертном состоянии.
- issue: Связь прежнего могущества и нынешнего позора
  choice: но понесли свой позор
  alternative: и понесли свой позор
  rationale: «Но» передаёт контекстуальное противопоставление между ужасом, который они внушали при жизни, и позором после смерти, не меняя содержания утверждения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис разделён на ясные фразы, при этом сохранены повторяющиеся образы схождения, земли живых, позора и ямы. Архаизмы и конфессионально нагруженные уточнения не вводятся.
