  text: And I will trouble the hearts of many peoples when I bring your ruin among the nations[c][b][a], into lands that you have not known.
translation:
  language: ru
  text: Я встревожу сердца многих народов[a], когда принесу твоё крушение[b] к народам, в страны, которых ты не знал[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разгневаю сердца многих народов»; или: «опечалю сердца многих народов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоё сокрушение». Еврейское слово может обозначать перелом, разрушение, бедствие или крушение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «среди народов, в страны, которых ты не знал». Речь идёт о чужих, незнакомых тебе землях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְעַסְתִּי
  choice: Я встревожу
  rationale: Порода hифиль глагола כעס может обозначать причинение гнева, скорби или внутреннего беспокойства. «Встревожу» сохраняет широту эмоционального воздействия в сочетании со словом «сердца».
- source_word: לֵב עַמִּים רַבִּים
  choice: сердца многих народов
  rationale: Существительное «сердце» в еврейском стоит в единственном числе с собирательным значением; в современном русском естественно распределительное множественное число.
- source_word: בַּהֲבִיאִי
  choice: когда принесу
  rationale: Инфинитивная конструкция с בְּ выражает временное обстоятельство; союз «когда» ясно передаёт эту связь.
- source_word: שִׁבְרְךָ
  choice: весть о твоём крушении
  rationale: שֶׁבֶר обозначает сокрушение, перелом, бедствие или гибель. В данном международном контексте «крушение» передаёт падение Египта; слово «весть» эксплицирует естественный для русского смысл распространения известия, подразумеваемый сочетанием «принести к народам».
- source_word: בַּגּוֹיִם
  choice: к народам
  rationale: 'Контекст движения с הֵבִיא и последующее упоминание стран позволяют понять выражение направительно: известие достигает чужих народов.'
- source_word: עַל אֲרָצוֹת אֲשֶׁר לֹא יְדַעְתָּם
  choice: в страны, которых ты не знал
  rationale: Выражение указывает на чужие, прежде не знакомые адресату земли. Такая формулировка сохраняет прямое обращение и естественна по-русски.
theological_decisions:
- issue: Характер эмоционального воздействия Божьего суда на народы
  choice: Бог приводит сердца многих народов во внутреннее беспокойство известием о крушении Египта.
  alternative: Бог разгневает многие народы или заставит их скорбеть.
  rationale: כעס допускает оттенки гнева, огорчения и тревоги. «Встревожу» не сводит реакцию народов только к одному из этих чувств и сохраняет смысловую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Формулировка сохраняет прямое обращение к Египту и различает «многие народы» и последующее направление вести к народам и странам.
