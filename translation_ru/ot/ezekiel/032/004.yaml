base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/004.yaml
  text: I will cast you onto the land[a]; I will throw you down on the open field, and I will cause every bird of the heavens to settle on you[b], and I will satisfy the beasts of all the earth with you.
translation:
  language: ru
  text: Я выброшу тебя на землю[a], брошу тебя на открытое поле; дам всем птицам небесным сесть на тебя и насыщу тобой зверей всей земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я оставлю тебя на земле». Еврейский глагол может означать как оставление, так и отбрасывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «насыщу из тебя зверей всей земли», то есть звери насытятся, пожирая тебя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: Я выброшу тебя
  rationale: Глагол נטשׁ может означать «оставить», «покинуть» или «бросить». В контексте поверженного чудовища и последующего бросания в поле выбранное выражение передаёт насильственное отвержение, не исключая оттенка оставления.
- source_word: בָאָרֶץ
  choice: на землю
  rationale: Здесь אֶרֶץ обозначает сушу, на которую выбрасывают поверженное существо; параллель с открытым полем поддерживает локальный, конкретный смысл.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: посреди открытого поля
  rationale: Буквально выражение указывает на поверхность поля. Русская формулировка естественно передаёт оставление тела на открытом, незащищённом месте.
- source_word: אֲטִילֶךָ
  choice: брошу тебя
  rationale: Форма глагола טול выражает активное бросание. Краткое «брошу» сохраняет силу образа и естественно звучит по-русски.
- source_word: וְהִשְׁכַּנְתִּי עָלֶיךָ
  choice: поселю на тебе
  rationale: Каузатив от שכן буквально означает «сделаю так, чтобы обитали/расположились». «Поселю» сохраняет намеренно сильный образ птиц, остающихся на туше.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: всех птиц небесных
  rationale: Коллективное עוֹף передано множественным числом; «птицы небесные» сохраняет возвышенный пророческий регистр и понятно современному читателю.
- source_word: וְהִשְׂבַּעְתִּי מִמְּךָ
  choice: насыщу тобой
  rationale: Каузатив שׂבע означает «дать насытиться», а מִמְּךָ буквально указывает на источник насыщения. Русское «насыщу тобой» ясно передаёт поедание поверженного тела.
- source_word: חַיַּת כָּל הָאָרֶץ
  choice: зверей всей земли
  rationale: חַיָּה в данном контексте — дикие животные-падальщики. «Звери» соответствует пророческому регистру, а «всей земли» сохраняет широкий охват еврейской конструкции.
theological_decisions:
- issue: Объём значения אֶרֶץ / הָאָרֶץ в пророчестве о суде
  choice: Первое употребление передано как «на землю», последнее — «всей земли».
  alternative: Оба употребления можно передать как «земля/страна», понимая их либо локально, либо шире.
  rationale: Первое относится к поверхности суши и поясняется образом открытого поля. Последнее входит в широкую формулу о зверях всей земли. Перевод сохраняет смену масштаба, не превращая её в догматическое утверждение о географическом охвате.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён; образы насильственного отвержения и насыщения падальщиков переданы прямо, без смягчения.
