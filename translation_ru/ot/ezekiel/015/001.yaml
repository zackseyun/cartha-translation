lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: В устойчивой пророческой формуле естественная для русского библейского повествования конструкция «было слово» передаёт наступление события, не добавляя отсутствующего в тексте глагола речи.
- source_word: דְבַר
  choice: слово
  rationale: «Слово» сохраняет устойчивую пророческую формулу и её богословскую насыщенность; «весть» было бы более истолковывающим переводом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица прямо означает направленность божественного слова к пророку.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском двоеточие естественно выполняет эту функцию и позволяет избежать тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Передача לֵאמֹר
  choice: двоеточие
  alternative: говоря
  rationale: 'Выбор касается синтаксиса, а не содержания: двоеточие ясно вводит речь, начинающуюся в следующем стихе, не превращая инфинитив в отдельный личный глагол.'
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Порядок «ко мне слово» естественен в данной конструкции и подчёркивает адресата; двоеточие вводит содержание слова в следующем стихе.
