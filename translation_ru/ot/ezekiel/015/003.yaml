  yaml_path: translation/ot/ezekiel/015/003.yaml
  text: Is wood taken from it to make anything useful? Or do they take from it a peg to hang every kind of vessel on it?[a][b][c]
translation:
  language: ru
  text: Берут ли от неё древесину, чтобы сделать что-нибудь полезное? Или берут ли от неё колышек, чтобы вешать на него всякую утварь?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы сделать что-нибудь для работы» / «для какого-нибудь полезного дела». Еврейское выражение подчёркивает практическое назначение изделия.'
    reason: lexical_alternative
  - marker: b
    text: «Колышек» можно также перевести как «штырь» или «гвоздь»; имеется в виду закреплённая опора, на которую вешают предметы.
    reason: lexical_alternative
  - marker: c
    text: «Утварь» здесь — широкое обозначение предметов, орудий или сосудов, а не только посуды.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֻקַּח מִמֶּנּוּ עֵץ
  choice: Берут ли от неё древесину
  rationale: Сохранён риторический вопрос и пассивно-неопределённая направленность еврейской формы; местоимение отсылает к виноградной лозе в предыдущем контексте, а «древесина» обозначает материал.
- source_word: לַעֲשׂוֹת לִמְלָאכָה
  choice: чтобы сделать что-нибудь полезное
  rationale: לִמְלָאכָה указывает на практическое применение или работу; слово «полезное» передаёт эту смысловую составляющую, не ограничивая вид изделия.
- source_word: אִם יִקְחוּ
  choice: Или берут ли
  rationale: אִם вводит второй параллельный риторический вопрос; «или» естественно передаёт его связь с первым.
- source_word: יָתֵד
  choice: колышек
  rationale: Слово обозначает колышек, штырь или закреплённую опору; в контексте подвешивания предметов «колышек» ясно передаёт функцию.
- source_word: לִתְלוֹת עָלָיו
  choice: чтобы повесить на него
  rationale: Прямо передаёт действие подвешивания и мужской референт местоимения — колышек.
- source_word: כָּל כֶּלִי
  choice: какую-нибудь утварь
  rationale: В отрицательно подразумеваемом риторическом вопросе כָּל естественно передаётся как «какую-нибудь»; כֶּלִי — широкое обозначение предмета, сосуда или орудия, для которого подходит собирательное «утварь».
