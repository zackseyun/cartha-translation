base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/004.yaml
  text: Look[a], it is given to the fire for fuel. The fire has consumed both of its ends, and its middle is charred[b]. Is it fit for any work?
translation:
  language: ru
  text: Вот, оно отдано огню на съедение[a]. Огонь пожрал оба его конца, а середина обуглилась. Пригодно ли оно для какого-нибудь дела[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для еды»; огонь представлен как пожирающий дерево.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для какой-нибудь работы» либо «для изготовления чего-либо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательную и привлекающую внимание функцию частицы естественным для современного русского языка словом.
- source_word: לָאֵשׁ נִתַּן
  choice: его отдают огню
  rationale: Сохраняет пассивную по смыслу передачу дерева огню, но выражает её естественной русской конструкцией с неопределённо-личным субъектом.
- source_word: לְאָכְלָה
  choice: на съедение
  rationale: Сохраняет буквальный образ огня, который «ест» дерево, и подготавливает повтор того же корня в следующей фразе.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: оба его конца
  rationale: Точно передаёт два конца предмета и естественно звучит по-русски.
- source_word: אָכְלָה הָאֵשׁ
  choice: огонь пожрал
  rationale: Передаёт персонифицированный образ огня и повтор еврейского корня אכל, связывающий эту фразу с «на съедение».
- source_word: וְתוֹכוֹ נָחָר
  choice: а середина обуглилась
  rationale: תוֹךְ здесь обозначает среднюю часть, а נחר — повреждение огнём; «обуглилась» ясно описывает достигнутое состояние.
- source_word: הֲיִצְלַח לִמְלָאכָה
  choice: Годится ли оно для какого-нибудь дела?
  rationale: В контексте древесины вопрос касается её пригодности для практической работы или изготовления вещи, а не успеха вообще; риторическая форма сохранена.
