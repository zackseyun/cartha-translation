  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה כַּ/אֲשֶׁ֤ר עֵץ הַ/גֶּ֨פֶן֙ בְּ/עֵ֣ץ הַ/יַּ֔עַר אֲשֶׁר נְתַתִּ֥י/ו לָ/אֵ֖שׁ לְ/אָכְלָ֑ה כֵּ֣ן נָתַ֔תִּי אֶת יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/006.yaml
  text: 'Therefore thus says the Lord GOD: As the wood of the vine among the trees of the forest[a], which I have given to the fire for fuel, so I have given the inhabitants of Jerusalem.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Как древесину виноградной лозы среди лесных деревьев, которую Я отдал огню на сожжение[a], так Я отдал жителей Иерусалима».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «огню на поглощение», то есть чтобы огонь её уничтожил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, следующий из сравнения в предшествующем контексте.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Сохраняет традиционную пророческую формулу и естественно звучит в современном литературном русском языке.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» непосредственно представляет личное имя יהוה, избегая неестественного сочетания «Господь Господь».
- source_word: עֵץ הַגֶּפֶן
  choice: виноградную лозу
  rationale: В контексте речь идёт о древесине лозы, отдаваемой огню; по-русски само выражение «виноградная лоза» естественно сохраняет предметный образ, тогда как «древесина виноградной лозы» здесь утяжеляет сравнение.
- source_word: בְּעֵץ הַיַּעַר
  choice: среди лесных деревьев
  rationale: Передаёт положение лозы в ряду лесных деревьев и сохраняет контраст, развитый в предшествующих стихах.
- source_word: נְתַתִּיו
  choice: Я отдал
  rationale: Совершенный вид выражает решительное предание лозы огню; местоименный суффикс отражён прямым дополнением в сравнительной конструкции.
- source_word: לָאֵשׁ לְאָכְלָה
  choice: огню на сожжение
  rationale: Передаёт буквально выраженную идею того, что огонь поглотит или уничтожит лозу, не сводя её роль просто к полезному топливу.
- source_word: כֵּן
  choice: так
  rationale: Ясно вводит вторую часть сопоставления «как… так…».
- source_word: נָתַתִּי
  choice: Я отдал
  rationale: Сохраняет лексический и риторический параллелизм с נְתַתִּיו и выражает уже определённый Божий приговор.
- source_word: יֹשְׁבֵי יְרוּשָׁלִָם
  choice: жителей Иерусалима
  rationale: Естественный современный русский эквивалент причастной конструкции с собирательным значением.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה, причём имя не заменяется толкованием или конфессионально привычным титулом.
- issue: Характер утверждения נָתַתִּי о жителях Иерусалима
  choice: Я отдал
  alternative: Я отдам; Я предаю
  rationale: Сохраняется совершенная форма исходного текста и напряжение между уже вынесенным, решительным приговором и его последующим историческим осуществлением.
translation_notes:
  register: Современный литературный русский язык с dignified пророческой интонацией. Конструкция «как… так…» сохраняет структуру еврейского сравнения; лексический повтор «отдал… отдал» удерживает риторический параллелизм оригинала.
