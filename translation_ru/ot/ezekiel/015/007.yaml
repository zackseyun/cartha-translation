source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בָּ/הֶ֔ם מֵ/הָ/אֵ֣שׁ יָצָ֔אוּ וְ/הָ/אֵ֖שׁ תֹּֽאכְלֵ֑/ם וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/שׂוּמִ֥/י אֶת פָּנַ֖/י בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/007.yaml
  text: And I will set my face against them[a]. They have come out from the fire, but the fire will consume them. Then you will know that I am Yahweh[b], when I set my face against them.
translation:
  language: ru
  text: И Я обращу Своё лицо против них[a]. Они вышли из огня, но огонь пожрёт их[b]. Тогда вы узнаете, что Я — Яхве, когда Я обращу Своё лицо против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский оборот «обратить лицо против кого-либо» означает решительно выступить против него и подвергнуть суду.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «они вышли из огня, и огонь пожрёт их». Речь не обязательно идёт об окончательном спасении из первого огня или о другом огне; подчёркнуто, что уничтожение всё равно неизбежно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־פָּנַי בָּהֶם
  choice: И Я обращу Своё лицо против них
  rationale: Глагол נתן буквально означает «дать, положить, установить», но в сочетании с «лицом» выражение обозначает намеренно выступить против кого-либо. «Обращу Своё лицо против них» сохраняет образ и естественно звучит по-русски.
- source_word: מֵהָאֵשׁ יָצָאוּ
  choice: Они вышли из огня
  rationale: יצא означает «выйти». Перевод не добавляет идеи окончательного спасения или успешного бегства, которой нет в еврейском тексте.
- source_word: וְהָאֵשׁ תֹּאכְלֵם
  choice: но огонь пожрёт их
  rationale: 'При огне как действующем субъекте אכל значит «пожрать, поглотить». Противительный союз «но» явно передаёт подразумеваемый контраст: они вышли из огня, однако огонь всё же уничтожит их.'
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: В данном пророческом контексте союз перед формой глагола передаёт следствие; «тогда» естественно связывает суд с последующим узнаванием Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: בְּשׂוּמִי אֶת־פָּנַי בָּהֶם
  choice: когда Я обращу Своё лицо против них
  rationale: Предлог ב при инфинитивной конструкции имеет временное значение «когда». Повторение того же оборота сохраняет композиционное обрамление стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл выражения об обращённом против них лице
  choice: Сохранить образный оборот в основном тексте
  alternative: Я выступлю против них
  rationale: Еврейская идиома выражает решительное противостояние и суд. Сохранение образа передаёт пророческую выразительность, а сноска поясняет его смысл, не сводя формулировку к общему пересказу.
- issue: Контраст между выходом из огня и последующим уничтожением огнём
  choice: Они вышли из огня, но огонь пожрёт их
  alternative: Они спаслись от огня, однако другой огонь пожрёт их
  rationale: Исходный текст не уточняет ни полного спасения, ни того, что речь непременно идёт о другом огне. Перевод сохраняет эту неопределённость и выраженный контраст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Местоимение «Своё» делает фразу естественной по-русски; повтор «Я обращу Своё лицо против них» сохранён ради риторической структуры оригинала. Маркер [b] поставлен при огненной метафоре, к которой относится примечание.
