base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/005.yaml
  text: Look[a], when it was whole, it was not made for any work. How much less, when the fire has consumed it and it is charred[c][b], can it still be made for any work?
translation:
  language: ru
  text: Вот, когда лоза была целой[a], из неё нельзя было сделать ничего пригодного для работы. Тем более, когда огонь пожрал её и она обгорела[c], — можно ли ещё сделать из неё что-нибудь пригодное для работы?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «невредимой», «неповреждённой». Речь о лозе до повреждения огнём.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение передаёт вывод от меньшего к большему: если древесина была непригодна, пока оставалась целой, то после огня — тем более.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обуглилась», «опалилась».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет привлекающую внимание дейктическую силу еврейского слова и естественно звучит в современном литературном русском.
- source_word: בִּהְיוֹתוֹ תָמִים
  choice: даже когда лоза была целой
  rationale: Оборот передан как временной; «целой» описывает неповреждённое огнём состояние древесины, а «лоза» восстановлена из непосредственного контекста для ясности русского текста.
- source_word: לֹא יֵעָשֶׂה לִמְלָאכָה
  choice: из неё нельзя было сделать ничего пригодного для работы
  rationale: Нифаль глагола עשה передаёт возможность изготовления или практического применения; формулировка ясно выражает непригодность древесины, не сужая מְלָאכָה до конкретного ремесла.
- source_word: אַף כִּי
  choice: Тем более
  rationale: 'Передаёт довод от меньшего к большему: если древесина была бесполезна целой, после огня она тем более бесполезна.'
- source_word: אֵשׁ אֲכָלַתְהוּ
  choice: огонь пожрал её
  rationale: Сохраняет яркую метафору еврейского אכל («есть, пожирать») применительно к огню и выражает завершившееся воздействие.
- source_word: וַיֵּחָר
  choice: она обгорела
  rationale: Передаёт повреждение жаром или огнём без утверждения, что древесина сгорела полностью.
- source_word: וְנַעֲשָׂה עוֹד לִמְלָאכָה
  choice: разве можно сделать из неё что-нибудь пригодное для работы?
  rationale: Риторический вопрос естественно передаёт контекстуальный смысл; «теперь» отражает עוֹד как продолжение после изменившегося состояния.
theological_decisions:
- issue: Характер образа
  choice: Сохранить в стихе образ непригодной обгоревшей лозы без прямого отождествления с Иерусалимом или Иудеей.
  alternative: Включить толкование образа как Иерусалима или Иудеи непосредственно в основной текст.
  rationale: Референт образа раскрывается окружающим контекстом, тогда как сам стих продолжает рассуждение о древесине лозы; перевод не должен подменять образ его толкованием.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор «пригодного для работы» сохраняет параллелизм еврейского текста; риторический вопрос делает ход рассуждения ясным, не добавляя аллегорического толкования.
