- from: И Я превращу эту землю в пустыню, потому что они оказались неверны Мне[a], — возвещает Владыка Яхве[b].
  to: И Я предам землю запустению, потому что они совершили вероломство, — возвещает Владыка Яхве[a].
  rationale: Устранены смысловое сужение «пустыня», неоправданное добавление «Мне» и ослабление усиленной формулы о вероломстве. Сноска о титуле и имени сохранена у соответствующего сочетания; отдельная сноска к «вероломству» не необходима, поскольку перевод прямо передаёт основной смысл выражения.
  reviewer_model: gpt-5.6-terra
