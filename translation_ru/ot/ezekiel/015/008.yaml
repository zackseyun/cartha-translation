  source_fidelity: «В пустыню» неточно сужает שְׁמָמָה до природной пустыни, тогда как слово обозначает опустошение, запустение. «Оказались неверны Мне» ослабляет активную усиленную формулу מָעֲלוּ מַעַל и вводит местоимение, отсутствующее в тексте. Предлагаемое «предам землю запустению» точно передаёт результативную конструкцию וְנָתַתִּי ... שְׁמָמָה, а «совершили вероломство» — тяжесть нарушения верности без добавления объекта.
