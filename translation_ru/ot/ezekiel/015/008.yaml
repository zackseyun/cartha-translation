base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/008.yaml
  text: And I will make the land a desolation[a], because they have acted unfaithfully[b], declares the Lord GOD.
translation:
  language: ru
  text: И Я предам землю запустению, потому что они совершили вероломство, — возвещает Владыка Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский титул и имя: «Адонай Яхве»; традиционный перевод: «Господь Бог».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И Я превращу
  rationale: 'В сочетании с «землю» и именным сказуемым שְׁמָמָה глагол נתן имеет результативный смысл: сделать, превратить во что-либо.'
- source_word: הָאָרֶץ
  choice: эту землю
  rationale: В контексте суда речь идёт о конкретной стране, а не обо всей земле как мире; указательное «эту» естественно передаёт контекстуальную определённость еврейского артикля.
- source_word: שְׁמָמָה
  choice: в пустыню
  rationale: Существительное обозначает опустошённое, разорённое место; конструкция «превращу… в пустыню» сохраняет предметный образ и звучит естественно по-русски.
- source_word: יַעַן
  choice: потому что
  rationale: Ясно передаёт причинное основание объявленного суда.
- source_word: מָעֲלוּ מַעַל
  choice: они оказались неверны Мне
  rationale: Однокоренная глагольно-именная конструкция подчёркивает вероломную неверность и нарушение доверия; добавление «Мне» раскрывает подразумеваемого адресата неверности в формуле Божьего суда.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт торжественную пророческую формулу божественного изречения современным литературным языком.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» различает титул אֲדֹנָי и имя יהוה, а «Яхве» непосредственно передаёт личное Божье имя без неестественного сочетания «Господь Господь».
theological_decisions:
- issue: Передача усиленной формулы מָעֲלוּ מַעַל
  choice: оказались неверны Мне
  alternative: совершили вероломство
  rationale: Выбранный вариант сохраняет идею нарушенной верности и не ограничивает выражение узкоюридическим или конфессиональным толкованием; местоимение поясняется в сноске как контекстуально подразумеваемое.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Так различаются титул и собственное имя, присутствующие в еврейском тексте, и сохраняется богословски значимое употребление тетраграмматона.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис краток и ясен; сохранены причинная связь, формула божественного провозглашения и различие между титулом и личным именем Бога.
