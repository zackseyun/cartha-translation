lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устойчивое обращение к пророку в книге Иезекииля. Оно сохраняет еврейский образ и здесь не используется как мессианский титул.
- source_word: מַה יִּהְיֶה
  choice: чем … лучше
  rationale: 'Еврейская конструкция эллиптична и выражает сравнение: какое преимущество имеет древесина лозы. Русское «чем … лучше» естественно передаёт риторический вопрос.'
- source_word: עֵץ הַגֶּפֶן
  choice: древесина виноградной лозы
  rationale: Передаёт буквальное значение и сохраняет важный для последующего контекста акцент на древесине как материале, а не просто на растении.
- source_word: מִכָּל עֵץ
  choice: всякой другой древесины
  rationale: Предлог מִן здесь сравнительный. Слово «другой» естественно в русском сравнении и не меняет смысла.
- source_word: הַזְּמוֹרָה
  choice: эта ветвь
  rationale: Слово обозначает ветвь или побег лозы. Указательное «эта» помогает естественно связать приложение с уже названной лозой.
- source_word: אֲשֶׁר הָיָה בַּעֲצֵי הַיָּעַר
  choice: среди лесных деревьев
  rationale: Кратко и естественно передаёт положение ветви среди деревьев леса; прошедшая форма еврейского глагола в данном общем сравнении не требует отдельного выражения по-русски.
