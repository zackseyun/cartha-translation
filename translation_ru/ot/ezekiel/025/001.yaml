  text: And the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И было ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (YHWH); традиционно переводится как «Господь».
    reason: Указывает исходную форму Божьего имени и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма с последовательным וַ продолжает повествование и вводит новый пророческий эпизод; традиционная русская формула здесь остаётся ясной и естественной.
- source_word: דְבַר
  choice: слово
  rationale: В пророческой формуле דָּבָר обозначает Божье слово или весть; «слово» прямо передаёт исходный образ и сохраняет торжественный стиль.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное в еврейском тексте тетраграмматоном יהוה, а не заменяющий его титул.
- source_word: אֵלַי
  choice: ко мне
  rationale: Точно передаёт предлог אֶל с суффиксом первого лица и естественно сочетается с русской формулой «было ко мне слово».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно выполняет двоеточие; буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом, а традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой и торжественной пророческой формулы. Двоеточие естественно вводит речь, начинающуюся в следующем стихе.
