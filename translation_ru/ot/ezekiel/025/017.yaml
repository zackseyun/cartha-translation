base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/017.yaml
  text: And I will execute great acts of vengeance on them with wrathful rebukes[a], and they will know that I am Yahweh when I lay my vengeance on them.
translation:
  language: ru
  text: Я совершу над ними великие акты возмездия с гневными обличениями[a], и они узнают, что Я — Яхве, когда Я обращу на них Моё возмездие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с обличениями гнева» или «с гневными карами». Еврейское выражение соединяет понятия обличения или исправительного взыскания с гневом и может подразумевать как словесный укор, так и карающее наказание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי בָם נְקָמוֹת גְּדֹלוֹת
  choice: И совершу над ними великие отмщения
  rationale: עשה с נְקָמוֹת в контексте суда означает совершить, осуществить возмездие. Множественное число «отмщения» сохранено, хотя в современном русском оно звучит торжественно и несколько архаично; это передаёт множественность или усиленность карательных действий.
- source_word: בְּתוֹכְחוֹת חֵמָה
  choice: подвергнув их яростным карам
  rationale: תּוֹכְחוֹת может обозначать обличения, исправительные взыскания или наказания. В контексте суда «кары» естественно передают карательную сторону выражения, а «яростным» отражает חֵמָה — гнев, ярость; сноска сохраняет более буквальную возможность «обличений гнева».
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: И они узнают, что Я — Яхве
  rationale: Сохранена характерная для Иезекииля формула узнавания и личное имя יהוה передано как «Яхве».
- source_word: בְּתִתִּי אֶת נִקְמָתִי בָּם
  choice: когда совершу над ними Моё отмщение
  rationale: Буквальное «когда дам/возложу Моё отмщение на них» по-русски неестественно. «Совершу над ними» ясно выражает причинение возмездия и сохраняет повтор корня נקם.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте, не заменяя его титулом.
- issue: Характер תּוֹכְחוֹת חֵמָה
  choice: яростные кары
  alternative: обличения гнева; гневные взыскания
  rationale: Контекст возвещения суда поддерживает карательный оттенок, но еврейское выражение может охватывать и обличение, и исправительное наказание; эта напряжённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Повтор слов «отмщения / отмщение» намеренно сохраняет повтор корня נקם в еврейском тексте; прописное «Моё» соответствует принятому благоговейному оформлению речи Бога.
