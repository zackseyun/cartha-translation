  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֨י נוֹטֶ֤ה יָדִ/י֙ עַל פְּלִשְׁתִּ֔ים וְ/הִכְרַתִּ֖י אֶת כְּרֵתִ֑ים וְ/הַ֣אֲבַדְתִּ֔י אֶת שְׁאֵרִ֖ית ח֥וֹף הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am stretching out my hand against the Philistines, and I will cut off the Cherethites, and I will destroy the remnant of the seacoast.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Вот, Я простираю руку на филистимлян, истреблю керетян[a] и уничтожу уцелевших на морском побережье».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «критян»; еврейское название может обозначать народ, связанный с Критом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт сочетание титула אֲדֹנָי и личного имени יהוה, избегая неестественного повтора «Господь Господь» и сохраняя различие между титулом и именем.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» служит торжественным указателем внимания и подчёркивает непосредственность предстоящего действия Бога.
- source_word: נוֹטֶה יָדִי
  choice: простираю руку
  rationale: Причастная форма после הִנְנִי изображает действие как непосредственное и начинающееся; настоящее время естественно передаёт эту живость.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Устоявшееся русское название этого народа.
- source_word: וְהִכְרַתִּי
  choice: истреблю
  rationale: В контексте суда כרת означает устранить или погубить; «истреблю» ясно передаёт силу угрозы и не создаёт неестественной русской кальки «отсеку» применительно к народу.
- source_word: כְּרֵתִים
  choice: керетян
  rationale: Транслитерация сохраняет этноним и не утверждает спорное отождествление этой группы с критянами.
- source_word: וְהַאֲבַדְתִּי
  choice: уничтожу
  rationale: Каузативная форма אבד означает «погубить, уничтожить»; выбран прямой и современный русский эквивалент.
- source_word: שְׁאֵרִית חוֹף הַיָּם
  choice: уцелевших на морском побережье
  rationale: Передаёт остаток людей, находящихся на морском побережье, естественно для русского языка; контекст указывает на оставшуюся часть прибрежного населения.
theological_decisions:
- issue: Передача составного божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Основной текст сохраняет личное имя Яхве и одновременно передаёт אֲדֹנָי как титул. Традиционный вариант «Господь Бог» понятен, но скрывает присутствие тетраграмматона.
- issue: Идентификация כְּרֵתִים
  choice: керетяне
  alternative: критяне
  rationale: Еврейский текст называет этническую группу, но её точная связь с Критом остаётся предметом обсуждения; транслитерация не превращает вероятную идентификацию в несомненный факт.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохранён компактным; формы «простираю», «истреблю», «уничтожу» передают последовательность и силу возвещённого суда.
