base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/006.yaml
  text: 'For thus says the Lord GOD: Because you clapped your hands and stamped your feet[a], and rejoiced with all the contempt in your soul against the land of Israel,'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: «За то, что ты хлопал в ладоши, топал ногами и радовался всей душой, презирая землю Израиля[a],»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение допускает также более буквальное понимание: «радовался со всем своим презрением в душе к земле Израиля».'
    reason: 'Сочетание בְּכָל שָׁאטְךָ בְּנֶפֶשׁ допускает разное синтаксическое распределение слов: «всей душой» может описывать радость либо внутреннюю полноту презрения.'
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание сохраняет титул אֲדֹנָי и передаёт личное имя יהוה как «Яхве», не смешивая оба элемента в повтор «Господь Господь».
- source_word: יַעַן
  choice: за то, что
  rationale: Оборот естественно вводит основание последующего суда и хорошо сочетается с продолжающимся в следующем стихе высказыванием.
- source_word: מַחְאֲךָ יָד
  choice: ты хлопал в ладоши
  rationale: Буквально речь идёт об ударе рукой; русский идиоматический оборот ясно передаёт жест злорадного торжества.
- source_word: וְרַקְעֲךָ בְּרָגֶל
  choice: топал ногами
  rationale: Еврейский текст употребляет единственное число «ногой», но русский устойчивый оборот с множественным числом естественно передаёт выразительный жест.
- source_word: וַתִּשְׂמַח
  choice: радовался
  rationale: Передаёт прямое значение глагола, а отрицательная нравственная окраска возникает из контекста презрения к земле Израиля.
- source_word: בְּכָל שָׁאטְךָ בְּנֶפֶשׁ
  choice: всей душой, презирая
  rationale: Формулировка по-русски естественно передаёт полноту внутреннего злорадства и значение שָׁאט как презрения, не превращая простую радость в более толковательное «злорадствовал».
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: землю Израиля
  rationale: В контексте презрение направлено на землю Израиля; глагольная конструкция «презирая» естественно требует прямого дополнения без отдельной передачи אֶל.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Так различаются титул אֲדֹנָי и непосредственно присутствующее в тексте личное имя יהוה, при этом избегается неестественное повторение «Господь Господь».
- issue: Характер радости адресата
  choice: радовался всей душой, презирая
  alternative: злорадствовал
  rationale: Выбранный вариант сохраняет отдельные смысловые компоненты радости, внутренней вовлечённости и презрения, не усиливая текст толковательным глаголом.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Обращение передано во втором лице единственного числа мужского рода согласно еврейским формам. Конечная запятая сохранена, поскольку основание приговора продолжается в следующем стихе.
