source:
  edition: WLC
  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ אֶל בְּנֵ֣י עַמּ֑וֹן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/002.yaml
  text: Son of man[a], set your face toward the sons of Ammon, and prophesy against them.
translation:
  language: ru
  text: Сын человеческий, обрати лицо своё к сынам Аммона[a] и пророчествуй против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к аммонитянам». Буквально: «к сынам Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет устойчивое обращение к Иезекиилю и близко передаёт древнееврейский оборот, не сводя его значение лишь к «смертному».
- source_word: שִׂים פָּנֶיךָ
  choice: обрати лицо своё
  rationale: Естественно для современного литературного русского и при этом сохраняет образ лица, направленного к адресату пророчества.
- source_word: אֶל
  choice: к
  rationale: Передаёт основное направительное значение предлога; враждебная направленность прямо выражена далее словами «против них».
- source_word: בְּנֵי עַמּוֹן
  choice: сынам Аммона
  rationale: Сохраняет буквальную родственную форму этнонима и древнееврейскую образность; более привычное русское обозначение приведено в сноске.
- source_word: וְהִנָּבֵא
  choice: и пророчествуй
  rationale: Точный и традиционно понятный русский эквивалент глагола пророческого провозглашения.
- source_word: עֲלֵיהֶם
  choice: против них
  rationale: В контексте пророчества о суде предлог имеет направленное против адресатов значение.
theological_decisions:
- issue: Передача этнонима בְּנֵי עַמּוֹן
  choice: сынам Аммона
  alternative: аммонитянам
  rationale: Основной текст сохраняет форму оригинала «сыновья/сыны Аммона», а сноска даёт естественный русский этноним, не устраняя особенности исходного выражения.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной пророческой формулы. Порядок «лицо своё» выбран ради достоинства и ритма, без архаических глагольных форм.
