  text: И в Моаве Я совершу суды, и они узнают, что Я — Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְמוֹאָב
  choice: И над Моавом
  rationale: Предлог ב при обозначении судебного действия может указывать на объект, на который оно обращено. По-русски «совершить суды в Моаве» могло бы звучать лишь как указание места; «над Моавом» естественно передаёт направленность Божьего суда, не усиливая её до прямого «против».
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: Я совершу суды
  rationale: Сочетание עשה со множественным שפטים означает осуществление судебных решений или наказаний. «Совершу суды» сохраняет юридическую образность и число оригинала.
- source_word: וְיָדְעוּ
  choice: и они узнают
  rationale: Форма выражает будущее следствие в данном контексте. Союз «и» сохраняет простую связь оригинала, не добавляя явного «тогда».
- source_word: כִּי
  choice: что
  rationale: כִּי вводит содержание того, что они узнают.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Сохранены явное местоимение אֲנִי и личное имя יהוה. Тире естественно передаёт русскую именную конструкцию и подчёркивает формулу узнавания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. «Яхве» передаёт его как имя и сохраняет характерную для Иезекииля формулу «узнают, что Я — Яхве», не подменяя имя титулом.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная пророческая формулировка. Сохранены множественное число «суды» и повтор явного «Я».
