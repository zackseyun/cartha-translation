source:
  edition: WLC
  text: לָ/כֵ֡ן הִנְ/נִי֩ נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וּ/נְתַתִּ֤י/ךָֽ ל/בג לַ/גּוֹיִ֔ם וְ/הִכְרַתִּ֨י/ךָ֙ מִן הָ֣/עַמִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךָ מִן הָ/אֲרָצ֑וֹת אַשְׁמִ֣ידְ/ךָ֔ וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/007.yaml
  text: Therefore[a], behold, I have stretched out my hand against you, and I will give you as plunder to the nations. I will cut you off from the peoples and destroy you from the lands; I will annihilate you, and you will know that I am Yahweh.
translation:
  language: ru
  text: Поэтому вот, Я простёр Свою руку против тебя и отдам тебя народам как добычу[a]. Я отсеку тебя от народов, истреблю тебя из земель; Я уничтожу тебя, и ты узнаешь, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдам тебя народам в добычу» или «на разграбление».'
    reason: Лексическая альтернатива для редкого слова בַג в контексте военной добычи.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: 'Передаёт вывод: объявляемый суд следует из обвинения в предыдущих стихах.'
- source_word: הִנְנִי
  choice: вот
  rationale: Сохраняет указательную силу и торжественность пророческой формулы, оставаясь естественным в современном русском языке.
- source_word: נָטִיתִי אֶת־יָדִי עָלֶיךָ
  choice: Я простёр на тебя Мою руку
  rationale: Сохраняет образ решительного Божьего вмешательства с целью суда; совершенный вид передаёт еврейскую перфектную форму.
- source_word: וּנְתַתִּיךָ לְבַג לַגּוֹיִם
  choice: отдам тебя народам на разграбление
  rationale: Естественно передаёт военный образ добычи, которая достанется другим народам.
- source_word: גּוֹיִם
  choice: народы
  rationale: Здесь речь идёт о чужеземных народах вообще, а не о позднейшем религиозном значении слова «язычники».
- source_word: וְהִכְרַתִּיךָ מִן־הָעַמִּים
  choice: Я отсеку тебя от народов
  rationale: Сохраняет метафору отсечения и смысл удаления из сообщества народов.
- source_word: וְהַאֲבַדְתִּיךָ מִן־הָאֲרָצוֹת
  choice: уничтожу тебя среди стран
  rationale: Передаёт причинное значение породы hифиль глагола אבד и географический охват множественного הָאֲרָצוֹת без неестественного русского оборота «уничтожу из стран».
- source_word: אַשְׁמִידְךָ
  choice: Я истреблю тебя
  rationale: Сильный глагол сохраняет кульминационное усиление после предшествующих формул суда.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: и ты узнаешь, что Я — Яхве
  rationale: Сохраняет характерную для Иезекииля формулу узнавания и прямое употребление Божьего имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное заветное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет различие между личным именем и титулом.
- issue: Временная форма выражения נָטִיתִי
  choice: Я простёр
  alternative: Я простираю / Я простру
  rationale: Еврейский перфект сохранён как совершённое действие, не устраняя напряжение между уже объявленным Божьим действием и следующими за ним формами будущего времени.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксический параллелизм и нарастание глаголов суда сохранены; архаизмы сведены к уместному библейскому «простёр».
