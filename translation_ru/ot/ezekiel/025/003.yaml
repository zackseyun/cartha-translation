  text: וְ/אָֽמַרְתָּ֙ לִ/בְנֵ֣י עַמּ֔וֹן שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה יַעַן֩ אָמְרֵ֨/ךְ הֶאָ֜ח אֶל מִקְדָּשִׁ֣/י כִֽי נִחָ֗ל וְ/אֶל אַדְמַ֤ת יִשְׂרָאֵל֙ כִּ֣י נָשַׁ֔מָּה וְ/אֶל בֵּ֣ית יְהוּדָ֔ה כִּ֥י הָלְכ֖וּ בַּ/גּוֹלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/003.yaml
  text: 'And say to the sons of Ammon[a], ‘Hear the word of the Lord GOD. Thus says the Lord GOD: Because you said, “Aha!” against my sanctuary when it was profaned, and against the land of Israel when it was made desolate[c][b], and against the house of Judah when they went into exile,’'
translation:
  language: ru
  text: 'И скажи аммонитянам: «Слушайте слово Господа Яхве. Так говорит Господь Яхве: за то, что ты воскликнул: „Ага!“ — над Моим святилищем, когда оно было осквернено, над землёй Израиля, когда она опустела, и над домом Иуды, когда его народ ушёл в изгнание…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי עַמּוֹן
  choice: аммонитянам
  rationale: Естественное современное русское название народа; буквальное «сынам Аммона» звучало бы менее ясно и несколько архаично.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: слово Господа Яхве
  rationale: Сохраняет оба элемента составного божественного титула и передаёт тетраграмматон как личное имя Яхве.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Господь Яхве
  rationale: Устоявшаяся и достойная пророческая формула, близкая к форме еврейского текста.
- source_word: יַעַן אָמְרֵךְ
  choice: за то, что ты… воскликнул
  rationale: יַעַן вводит основание грядущего суда; форма второго лица единственного числа обращается к Аммону как к единому народу.
- source_word: הֶאָח
  choice: «Ага!»
  rationale: Междометие передаёт злорадство и торжество над чужой бедой; наречие «злорадно» делает эту прагматическую силу явной по контексту.
- source_word: אֶל
  choice: о
  rationale: Предлог обозначает объекты злорадного возгласа. Русское «о» естественно связывает перечисление с «воскликнул», не ослабляя враждебного оттенка, выраженного словом «злорадно».
- source_word: מִקְדָּשִׁי
  choice: Моём святилище
  rationale: «Святилище» сохраняет культовое значение и не сужает слово до одного лишь храмового здания.
- source_word: נִחָל
  choice: было осквернено
  rationale: Нифаль глагола חלל обозначает нарушение святости, профанацию или осквернение; выбран естественный русский культовый термин.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: земле Израиля
  rationale: В данном национально-территориальном контексте «земля» естественно передаёт אַדְמָה.
- source_word: נָשַׁמָּה
  choice: опустела
  rationale: Передаёт достигнутое состояние разорения и запустения без искусственной русской пассивной конструкции.
- source_word: בֵּית יְהוּדָה
  choice: доме Иуды
  rationale: Сохраняет библейское коллективное обозначение народа и царства Иуды.
- source_word: הָלְכוּ בַּגּוֹלָה
  choice: его народ ушёл в изгнание
  rationale: Множественное число относится к людям «дома Иуды»; добавление «его народ» устраняет неестественное рассогласование в русском, сохраняя коллективный смысл.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка ГОСПОДЬ; Господь Бог
  rationale: Форма «Господь Яхве» различает титул אֲדֹנָי и личное имя יהוה, не заменяя тетраграмматон общим титулом.
- issue: Характер проступка Аммона
  choice: злорадный возглас над осквернением, запустением и изгнанием
  alternative: нейтральное замечание об этих событиях
  rationale: Междометие הֶאָח в контексте пророчества против Аммона выражает злорадное торжество, однако текст не добавляет иной конкретной вины.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Единственное число «ты» сохраняет олицетворённое обращение к Аммону. Многоточие в конце показывает, что причинная конструкция продолжается в следующем стихе.
