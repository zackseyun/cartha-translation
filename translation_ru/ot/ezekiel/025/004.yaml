  text: לָ/כֵ֡ן הִנְ/נִי֩ נֹתְנָ֨/ךְ לִ/בְנֵי קֶ֜דֶם לְ/מֽוֹרָשָׁ֗ה וְ/יִשְּׁב֤וּ טִירֽוֹתֵי/הֶם֙ בָּ֔/ךְ וְ/נָ֥תְנוּ בָ֖/ךְ מִשְׁכְּנֵי/הֶ֑ם הֵ֚מָּה יֹאכְל֣וּ פִרְיֵ֔/ךְ וְ/הֵ֖מָּה יִשְׁתּ֥וּ חֲלָבֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/004.yaml
  text: Therefore, look, I am giving you to the sons of the east as a possession, and they will set their encampments in you and place their dwellings in you. They will eat your fruit, and they will drink your milk.
translation:
  language: ru
  text: Поэтому вот, Я отдаю тебя во владение сынам Востока. Они разобьют у тебя свои стоянки и поставят у тебя свои жилища. Они будут есть твои плоды и пить твоё молоко.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי קֶדֶם
  choice: сынам Востока
  rationale: Буквально передаёт древнееврейское обозначение восточных племён, сохраняя его географико-этническую широту.
- source_word: לְמוֹרָשָׁה
  choice: во владение
  rationale: Передаёт смысл имущества или территории, переходящей в обладание.
- source_word: טִירוֹתֵיהֶם
  choice: свои стоянки
  rationale: В данном контексте слово обозначает лагеря или кочевые поселения; «стоянки» естественно сочетается с образом восточных племён.
- source_word: מִשְׁכְּנֵיהֶם
  choice: свои жилища
  rationale: Сохраняет отличие от «стоянок» и передаёт места обитания без неоправданного уточнения их вида.
- source_word: פִרְיֵךְ ... חֲלָבֵךְ
  choice: твои плоды ... твоё молоко
  rationale: Сохранены конкретные образы земледельческих и скотоводческих богатств Аммона.
theological_decisions:
- issue: Божественное действие в формуле הִנְנִי נֹתְנָךְ
  choice: Я отдам тебя
  alternative: вот, Я отдаю тебя
  rationale: Будущее совершенного вида естественно выражает объявленный Божий приговор; указательное הִנְנִי не вынесено отдельным «вот», чтобы избежать неестественной русской конструкции, при сохранении прямоты речи.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Местоимение «тебя» относится к земле сынов Аммона и согласуется с обращением в женском роде в еврейском тексте, хотя в русском эта грамматическая особенность явно не выражена.
