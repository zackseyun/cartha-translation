  text: וְ/נָתַתִּ֤י אֶת רַבָּה֙ לִ/נְוֵ֣ה גְמַלִּ֔ים וְ/אֶת בְּנֵ֥י עַמּ֖וֹן לְ/מִרְבַּץ צֹ֑אן וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/005.yaml
  text: And I will make Rabbah a pasture for camels[a], and the Ammonites a resting place for flocks[c][b]; then you will know that I am Yahweh.
translation:
  language: ru
  text: И превращу Равву в пастбище для верблюдов[a], а аммонитян[b] — в место отдыха для стад[c]. Тогда вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в обиталище верблюдов»; «в место, где живут верблюды».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов Аммона».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в место, где стада ложатся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: превращу
  rationale: 'Буквально глагол означает «дам», но в конструкции с обозначением места и его нового назначения передаёт результат: сделать или превратить во что-либо.'
- source_word: רַבָּה
  choice: Равву
  rationale: Собственное имя столицы аммонитян передано традиционной русской библейской формой «Равва».
- source_word: לִנְוֵה
  choice: в пастбище для
  rationale: Существительное может обозначать обиталище, место пребывания или пастбище; соседнее слово «верблюды» делает пастбищный смысл наиболее вероятным, при этом альтернативы сохранены в сноске.
- source_word: גְמַלִּים
  choice: верблюдов
  rationale: Прямой эквивалент древнееврейского существительного во множественном числе.
- source_word: בְּנֵי עַמּוֹן
  choice: землю аммонитян
  rationale: Буквально «сынов Аммона». Поскольку место отдыха для стад предполагает территорию, этноним употреблён метонимически; слово «землю» делает образ естественным по-русски, а буквальная форма отмечена в сноске.
- source_word: לְמִרְבַּץ
  choice: в место отдыха
  rationale: Слово обозначает место, где животные ложатся и отдыхают; эта передача не добавляет отсутствующего в тексте представления об огороженном загоне.
- source_word: צֹאן
  choice: для стад
  rationale: Собирательное обозначение мелкого скота, обычно овец и коз; «стада» сохраняет собирательный пастушеский образ.
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: Союз и глагольная форма в пророческом контексте выражают следствие совершённого суда; «тогда» естественно передаёт эту связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Четырёхбуквенное личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Объект запустения в выражении בְּנֵי עַמּוֹן
  choice: земля аммонитян
  alternative: аммонитяне; сыны Аммона
  rationale: Исходная формулировка буквально называет народ, хотя пасти и укладывать стада можно на его земле. Перевод раскрывает эту метонимию, не превращая людей в буквальное место для животных; буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной пророческой интонацией. Параллелизм двух частей сохранён; тире во второй части естественно восполняет опущенный повтор глагола. Местоимение «Я» написано с прописной буквы в соответствии с принятой русской библейской традицией.
