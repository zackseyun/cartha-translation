lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה; такое сочетание различает оба элемента титула и избегает неестественного «Господь Господь».
- source_word: יַעַן
  choice: За то, что
  rationale: Оборот естественно вводит основание последующего суда, при этом сохраняет причинную связь с продолжением пророчества.
- source_word: עֲשׂוֹת אֱדוֹם בִּנְקֹם נָקָם
  choice: Эдом мстительно поступил
  rationale: Передаёт идиоматическое сочетание עשה с усилительной конструкцией от корня נקם естественным современным русским языком; усиление исходного выражения отмечено в сноске.
- source_word: לְבֵית יְהוּדָה
  choice: с домом Иуды
  rationale: В сочетании с «поступил» предлог «с» естественно выражает направленность враждебного действия, а «дом Иуды» сохраняет национально-родовое обозначение оригинала.
- source_word: וַיֶּאְשְׁמוּ אָשׁוֹם
  choice: тяжко провинился
  rationale: Когнатная усилительная конструкция обозначает несомненную или тяжкую виновность; собирательный Эдом по-русски согласован в единственном числе.
- source_word: וְנִקְּמוּ בָהֶם
  choice: и отомстил им
  rationale: Кратко и естественно передаёт возвратно-результативный оттенок формы נקם и сохраняет повтор мотива мести.
theological_decisions:
- issue: Передача составного Божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант открыто передаёт личное имя יהוה и одновременно сохраняет отдельное значение титула אֲדֹנָי, не отождествляя два элемента.
- issue: Степень вины Эдома в וַיֶּאְשְׁמוּ אָשׁוֹם
  choice: тяжко провинился
  alternative: стал виновен
  rationale: Усиление выражено без уточнения характера наказания или богословского статуса вины; тем самым сохраняется эмфатическая, но не более конкретная формулировка оригинала.
