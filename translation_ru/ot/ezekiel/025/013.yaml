  verdict: revise
  source_fidelity: 'Основной смысл передан точно: божественное слово суда против Эдома, образ простёртой руки, устранение людей и животных и гибель «от меча» сохранены. Однако «превращу его в пустыню» чрезмерно конкретизирует חָרְבָּה как природную пустыню; слово означает опустошение, запустение. Кроме того, в предоставленных богословских решениях проекта для יהוה установлен вариант «Яхве», поэтому «Господь» следует заменить.'
