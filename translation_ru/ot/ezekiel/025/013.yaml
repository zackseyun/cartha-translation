source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָטִ֤תִי יָדִ/י֙ עַל אֱד֔וֹם וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֣ם וּ/בְהֵמָ֑ה וּ/נְתַתִּ֤י/הָ חָרְבָּה֙ מִ/תֵּימָ֔ן וּ/דְדָ֖נֶ/ה בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/013.yaml
  text: 'Therefore thus says the Lord GOD: I will stretch out my hand against Edom[a], and I will cut off from it man and beast, and I will make it a desolation; from Teman even to Dedan they will fall by the sword.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Я простру руку против Эдома, истреблю в нём людей и животных и сделаю его запустением. От Фемана до Дедана[a] они падут от меча».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская форма имени «Дедан» может иметь направительное значение: «к Дедану», то есть «вплоть до Дедана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: 'Сочетание передано двумя различными титулами: אֲדֹנָי — «Владыка», а יהוה — традиционным русским «Господь». Это избегает неестественного повтора «Господь Господь» и сохраняет торжественный библейский регистр.'
- source_word: וְנָטִתִי יָדִי
  choice: Я простру руку
  rationale: Сохранён древнееврейский образ решительного вмешательства и суда; глагол «простру» понятен в современном литературном русском и соответствует возвышенному регистру пророчества.
- source_word: וְהִכְרַתִּי
  choice: истреблю
  rationale: В данном контексте כרת означает полное устранение жителей и животных. Русское «истреблю» естественно передаёт силу формулы суда, не вводя дополнительной конкретизации способа.
- source_word: אָדָם וּבְהֵמָה
  choice: людей и животных
  rationale: אָדָם здесь обозначает человеческое население в противопоставлении животным. Нейтральная пара «людей и животных» яснее для современного читателя, чем архаичное «человека и скот».
- source_word: וּנְתַתִּיהָ חָרְבָּה
  choice: превращу его в пустыню
  rationale: 'Передана результативная конструкция: Эдом станет опустошённой землёй. Местоимение согласовано с русским родом названия «Эдом».'
- source_word: מִתֵּימָן
  choice: от Фемана
  rationale: תֵּימָן в контексте Эдома понимается как географическое название, а не как нарицательное «юг».
- source_word: וּדְדָנֶה
  choice: до Дедана
  rationale: Направительный суффикс указывает движение или протяжённость к Дедану; в сочетании с «от Фемана» русская конструкция «от… до…» естественно выражает охват территории.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: они падут от меча
  rationale: Сохранена древнееврейская формула гибели в войне и не устранена явным существительным неопределённость подлежащего множественного числа.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Основной текст следует укоренившейся русской практике передавать тетраграмматон словом «Господь», одновременно отличая его от אֲדֹנָי посредством слова «Владыка». Вариант «Владыка Яхве» точнее воспроизводит личное имя, но менее привычен в русском библейском тексте; сам выбор не должен использоваться для внесения конфессионального толкования.
- issue: Неявное подлежащее глагола יִפֹּלוּ
  choice: они падут
  alternative: жители падут
  rationale: В еврейском тексте подлежащее прямо не названо. Местоименная передача сохраняет эту формальную неопределённость, тогда как «жители» было бы обоснованным, но уже поясняющим толкованием.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены образы простёртой руки, превращения земли в пустыню и падения от меча; синтаксис сделан естественным без сглаживания неопределённости последнего подлежащего.
