  terminology: «Владыка Яхве» различает אֲדֹנָי и יהוה и соответствует указанному в материалах проекта принципу передачи тетраграмматона как «Яхве». Географические названия «Эдом», «Феман» и «Дедан» сохранены. Формула «людей и животных» приемлемо передаёт אָדָם וּבְהֵמָה в современном русском.
