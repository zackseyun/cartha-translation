  text: 'Thus says the Lord GOD: Because Moab and Seir say, ‘Look, the house of Judah is like all the nations,’'
translation:
  language: ru
  text: 'Так говорит Владыка Господь: За то, что Моав и Сеир говорят: «Вот, дом Иуды — как все народы»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт сочетание титула «Владыка» с божественным именем в традиционной и понятной русской форме, не сливая оба элемента в один.
- source_word: יַעַן אֲמֹר
  choice: за то, что … говорят
  rationale: Естественно передаёт причинную формулу, вводящую основание последующего суда.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-восклицательную силу еврейского слова без излишнего усиления.
- source_word: כְכָל הַגּוֹיִם
  choice: как и все другие народы
  rationale: Частица כ обозначает сравнение; «другие» естественно выражает подразумеваемое противопоставление Иуды окружающим народам.
- source_word: בֵּית יְהוּדָה
  choice: дом Иуды
  rationale: Сохраняет библейский коллективно-династический образ исходного выражения.
theological_decisions:
- issue: Утверждение Моава и Сеира об Иуде
  choice: 'Сохранено прямое сравнение: «дом Иуды — как и все другие народы»'
  alternative: «дом Иуды ничем не отличается от прочих народов»
  rationale: Более буквальная формулировка сохраняет открытым точный смысл насмешки или богословского отрицания особого положения Иуды.
translation_notes:
  register: Современный литературный русский с достоинством пророческой формулы. Двоеточие и вложенные кавычки передают структуру прямой речи; стих синтаксически продолжается в следующем стихе.
