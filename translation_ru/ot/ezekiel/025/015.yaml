  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן עֲשׂ֥וֹת פְּלִשְׁתִּ֖ים בִּ/נְקָמָ֑ה וַ/יִּנָּקְמ֤וּ נָקָם֙ בִּ/שְׁאָ֣ט בְּ/נֶ֔פֶשׁ לְ/מַשְׁחִ֖ית אֵיבַ֥ת עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/015.yaml
  text: 'Thus says the Lord GOD: Because the Philistines acted in vengeance and took revenge with contempt in the soul[a], to destroy with everlasting enmity[b],'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «За то, что филистимляне действовали из мести и мстили с презрением в душе[a], чтобы погубить из-за извечной вражды[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «с презрением в самой душе», «с презрением от всего сердца». Еврейское выражение соединяет презрение с глубокой внутренней настроенностью всего человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «из-за древней вражды» или «из-за вечной вражды». Еврейское עוֹלָם может указывать как на глубокую древность, так и на неограниченную продолжительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Сочетание титула אֲדֹנָי с именем יהוה передано принятой и понятной по-русски формулой, различающей два элемента и избегающей неестественного повтора «Господь Господь».
- source_word: יַעַן
  choice: За то, что
  rationale: Передаёт причинное основание последующего суда и естественно вводит в русском придаточное предложение после формулы пророческой речи.
- source_word: עֲשׂוֹת פְּלִשְׁתִּים בִּנְקָמָה
  choice: филистимляне действовали из мести
  rationale: Инфинитивная конструкция означает, что филистимляне поступали мстительно; «действовали из мести» сохраняет существительное и звучит естественно.
- source_word: וַיִּנָּקְמוּ נָקָם
  choice: и мстили
  rationale: Однокоренное сочетание глагола и существительного усиливает идею возмездия. В русском повтор «мстили местью» неестественен; сила выражения поддерживается предшествующим «из мести».
- source_word: בִּשְׁאָט בְּנֶפֶשׁ
  choice: с презрением в душе
  rationale: Сохраняются как значение презрения или злорадного пренебрежения, так и указание на внутреннюю, цельную личностную установку; возможная идиома «от всего сердца» не подставляется в основной текст.
- source_word: לְמַשְׁחִית
  choice: чтобы истреблять
  rationale: Инфинитив с לְ передаёт цель или результат. Несовершенный вид соответствует направленности и повторяемому характеру враждебных действий.
- source_word: אֵיבַת עוֹלָם
  choice: из-за вековой вражды
  rationale: אֵיבָה означает вражду, а עוֹלָם здесь допускает как давнюю, так и непрекращающуюся враждебность. «Вековая» сохраняет обе смысловые перспективы лучше, чем однозначное «вечная».
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве; Господь Бог
  rationale: Основной вариант сохраняет различие между титулом и личным Божьим именем средствами традиционного русского библейского регистра, не создавая повтора и не вводя транслитерацию, которая могла бы восприниматься как конфессионально маркированная.
- issue: Временной смысл עוֹלָם в выражении о вражде
  choice: вековая вражда
  alternative: вечная вражда; древняя вражда
  rationale: Контекст допускает и давнее происхождение, и длительную непрекращающуюся враждебность; основной текст намеренно не устраняет эту напряжённость, а примечание раскрывает варианты.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис оставлен незавершённым и заканчивается запятой, поскольку причинная формула продолжается в следующем стихе. Кавычка открывает прямую речь и не закрывается в пределах данного фрагмента.
