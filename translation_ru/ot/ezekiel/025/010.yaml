base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/010.yaml
  text: to the people of the east[a], against the Ammonites; and I will give it as a possession[b], so that the Ammonites may no longer be remembered among the nations.
translation:
  language: ru
  text: народам Востока[a] — против аммонитян; и Я отдам её во владение[b], чтобы аммонитяне больше не вспоминались среди народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновьям Востока». Так назывались восточные народы или племена.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в наследственное владение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֶדֶם
  choice: жителям Востока
  rationale: Идиоматическое этногеографическое обозначение восточных племён. Такой перевод естественен по-русски, а буквальный образ сохранён в сноске.
- source_word: עַל
  choice: против
  rationale: В контексте суда и передачи территории предлог выражает направленность действия против аммонитян; при этом возможный пространственный оттенок отмечен как смысловая неоднозначность.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Обычное этническое наименование народа Аммона в современном русском языке.
- source_word: וּנְתַתִּיהָ
  choice: и Я отдам её
  rationale: Местоименный суффикс женского рода отсылает к подразумеваемой земле или территории из контекста; русский перевод сохраняет местоименную отсылку, не вставляя существительное в основной текст.
- source_word: לְמוֹרָשָׁה
  choice: во владение
  rationale: Слово обозначает имущество, переходящее в прочное владение, нередко наследственное; «во владение» лучше соответствует контексту передачи территории.
- source_word: לְמַעַן לֹא תִזָּכֵר
  choice: чтобы ... больше не вспоминались
  rationale: Передаёт цель или результат и пассивную форму глагола זכר, не сводя смысл только к устному упоминанию.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Здесь גּוֹיִם обозначает народы вообще, без более позднего специального оттенка слова «язычники».
theological_decisions:
- issue: Смысл исчезновения Аммона из памяти народов
  choice: Сохранено утверждение о том, что аммонитяне больше не будут вспоминаться среди народов.
  alternative: Передать это как полное уничтожение народа либо, напротив, лишь как утрату известности.
  rationale: Еврейский текст говорит об отсутствии памяти об аммонитянах среди народов. Перевод сохраняет силу судебного изречения, но не добавляет не выраженного прямо утверждения о метафизическом или абсолютном исчезновении.
- issue: Отношение жителей Востока к аммонитянам в обороте с עַל
  choice: Передано словом «против», сохраняющим враждебно-судебную направленность.
  alternative: Передать пространственно как «над» или соединительно как «вместе с».
  rationale: Контекст описывает передачу территории восточным племенам как суд над Аммоном. Вместе с тем краткий еврейский оборот допускает пространственный оттенок, поэтому перевод не расширяет его дополнительными пояснениями в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого изречения. Заглавная буква в «Я» указывает на говорящего Бога по контексту. Начальная синтаксическая незавершённость сохранена, поскольку стих продолжает предложение предыдущего стиха.
