source:
  edition: WLC
  text: וְ/נָתַתִּ֨י אֶת נִקְמָתִ֜/י בֶּ/אֱד֗וֹם בְּ/יַד֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/עָשׂ֣וּ בֶ/אֱד֔וֹם כְּ/אַפִּ֖/י וְ/כַ/חֲמָתִ֑/י וְ/יָֽדְעוּ֙ אֶת נִקְמָתִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/014.yaml
  text: And I will set my vengeance on Edom by the hand of my people Israel[a], and they will deal with Edom according to my anger and according to my wrath; and they will know my vengeance[c][b], declares the Lord GOD.
translation:
  language: ru
  text: Я совершу Моё возмездие над Эдомом рукой Моего народа Израиля[a]. Они поступят с Эдомом сообразно Моему гневу и Моей ярости[b] и узнают Моё возмездие[c], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моего народа Израиля»; это выражение означает, что Израиль станет орудием действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол имеет широкий смысл: «сделают, поступят, будут действовать»; возможный перевод: «будут действовать против Эдома».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «познают на опыте Моё возмездие». Местоимение «они» в еврейском тексте прямо не уточнено и может пониматься как относящееся к Израилю либо, по смыслу суда, к жителям Эдома.'
    reason: ambiguity
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־נִקְמָתִי בֶּאֱדוֹם
  choice: Я совершу Моё возмездие над Эдомом
  rationale: נתן буквально означает «дать, положить, установить», но в сочетании с נקמה выражает осуществление возмездия. Русское «совершу возмездие» естественно передаёт действие, не ослабляя судебно-карательного смысла; ב в данном враждебном контексте передано как «над».
- source_word: בְּיַד עַמִּי יִשְׂרָאֵל
  choice: рукой Моего народа Израиля
  rationale: 'Сохранён образ еврейской инструментальной идиомы «рукой»: Бог остаётся источником возмездия, а Израиль выступает его орудием.'
- source_word: וְעָשׂוּ בֶאֱדוֹם
  choice: Они поступят с Эдомом
  rationale: עשה — широкий глагол «делать, поступать, действовать». Формулировка не добавляет отсутствующего в самом глаголе уточнения вроде «совершат суд», однако в контексте ясно указывает на враждебное действие.
- source_word: כְּאַפִּי וְכַחֲמָתִי
  choice: сообразно Моему гневу и Моей ярости
  rationale: Двойное כ передаёт соответствие мере или характеру Божьего гнева. Различение אַף («гнев») и חֵמָה («ярость») сохраняет усилительную пару исходного текста.
- source_word: וְיָדְעוּ אֶת־נִקְמָתִי
  choice: и узнают Моё возмездие
  rationale: ידע здесь может обозначать не только умственное знание, но и познание на опыте. «Узнают» естественно сохраняет этот оттенок, не разъясняя его внутри текста.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נאם — торжественная пророческая формула. «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и избегает сочетания «Господь Господь».
theological_decisions:
- issue: Соотношение Божьего действия и участия Израиля
  choice: Божье возмездие осуществляется рукой Израиля
  alternative: Израиль действует независимо либо Бог действует без человеческого орудия
  rationale: В первой части стиха Бог прямо называет возмездие Своим, а оборот בְּיַד обозначает Израиль как средство его осуществления. Перевод сохраняет обе стороны высказывания.
- issue: Референт множественного подлежащего в וְיָדְעוּ («и узнают»)
  choice: Сохранено местоименное «они» без явного называния референта
  alternative: Явно указать «израильтяне узнают» или «эдомитяне узнают»
  rationale: Грамматически продолжением подлежащего предыдущего глагола может быть Израиль, тогда как тема познания возмездия допускает отнесение к тем, кто испытывает суд, то есть к Эдому. Исходная формулировка не требует снять эту напряжённость.
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка ГОСПОДЬ
  rationale: Передача личного имени как «Яхве» отличает его от титула אֲדֹנָי и непосредственно отражает два разных элемента еврейского сочетания.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным и прямым; сохранены образ «рукой», пара «гнев — ярость» и неуточнённое множественное подлежащее заключительной части.
