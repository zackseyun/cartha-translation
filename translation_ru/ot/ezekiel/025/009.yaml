base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/009.yaml
  text: 'Therefore behold[a], I am opening the flank of Moab from its cities, from its frontier cities, the glory of the land: Beth-jeshimoth, Baal-meon[c][b], and Kiriathaim.'
translation:
  language: ru
  text: 'Поэтому вот, Я открою фланг Моава[a] со стороны его городов — пограничных городов, красы земли: Бет-Иешимота, Баал-Меона и Кириатаима.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плечо Моава». Возможные переводы: «бок Моава» или «сторону Моава».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹתֵחַ
  choice: Я открою
  rationale: Причастие при הִנְנִי выражает близкое и несомненное будущее действие; по-русски естественнее передать его будущим временем, сохранив пророческую непосредственность посредством «вот».
- source_word: כֶּתֶף מוֹאָב
  choice: фланг Моава
  rationale: כֶּתֶף буквально означает «плечо», но в географическом и военном контексте обозначает боковую сторону, уязвимый фланг территории.
- source_word: מֵהֶעָרִים מֵעָרָיו מִקָּצֵהוּ
  choice: со стороны его городов — пограничных городов
  rationale: Предлог מִן указывает, с какой стороны будет открыт Моав, а מִקָּצֵהוּ уточняет, что речь идёт о городах на его краю или границе. Тире естественно передаёт уточняющее повторение еврейского текста.
- source_word: צְבִי אֶרֶץ
  choice: красы земли
  rationale: צְבִי может означать красу, красоту, великолепие или славу; здесь это приложение к названным далее примечательным городам. «Краса земли» сохраняет образность и возвышенный регистр.
- source_word: בֵּית הַיְשִׁימֹת
  choice: Бет-Иешимот
  rationale: Топоним транслитерирован, а не переведён.
- source_word: בַּעַל מְעוֹן
  choice: Баал-Меон
  rationale: Топоним передан современной русской транслитерацией с дефисом для ясности составного имени.
- source_word: וקריתמה
  choice: Кириатаим
  rationale: Форма написания в масоретском тексте соотносится с известным моавитским городом קִרְיָתַיִם; использована узнаваемая русская транслитерация.
