  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/חֶ֣רֶב תִּפֹּ֔לוּ עַל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפּ֣וֹט אֶתְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/010.yaml
  text: You will fall by the sword; I will judge you at the border of Israel[a], and you will know that I am Yahweh.
translation:
  language: ru
  text: Вы падёте от меча; у границы Израиля[a] Я буду судить вас, и вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на границе Израиля». Еврейское выражение может обозначать место у самой границы или на ней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: от меча
  rationale: Предлог בְּ обозначает средство или причину гибели; русское «пасть от меча» естественно и сохраняет конкретный образ.
- source_word: תִּפֹּלוּ
  choice: вы падёте
  rationale: Сохраняет буквальный образ глагола נפל, который в данном контексте подразумевает гибель.
- source_word: עַל גְּבוּל יִשְׂרָאֵל
  choice: у границы Израиля
  rationale: גְּבוּל означает границу или предел, а עַל здесь допускает локативное значение «у/на границе»; основной вариант звучит естественно по-русски.
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: Я буду судить вас
  rationale: Прямая передача שׁפט без усиления; карательный характер суда ясен из контекста.
- source_word: וִידַעְתֶּם
  choice: и вы узнаете
  rationale: Передаёт будущее результативное значение формы и сохраняет еврейское сочинение без добавления толковательного «тогда».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя и не подменяет его титулом.
- issue: Характер действия שׁפט
  choice: буду судить вас
  alternative: совершу над вами суд
  rationale: Более прямой вариант сохраняет смысловую широту глагола, тогда как контекст уже ясно указывает на наказание.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллельные глагольные формулы и конкретный образ меча; неоднозначность предлога עַל отмечена в сноске.
