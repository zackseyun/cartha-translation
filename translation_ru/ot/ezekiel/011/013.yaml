base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/013.yaml
  text: And it happened[a], as I was prophesying, that Pelatiah son of Benaiah died. Then I fell on my face and cried out with a loud voice and said, “Ah, Lord GOD[b], will you make a complete end of the remnant of Israel?”
translation:
  language: ru
  text: 'И было: когда я пророчествовал, Фелатия, сын Ванеи, умер. Тогда я пал ниц, воскликнул громким голосом и сказал: «О, Владыка Яхве! Неужели Ты полностью истребишь[a] остаток Израиля?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели Ты полностью истребляешь остаток Израиля?» Еврейская форма может обозначать действие, происходящее сейчас или неминуемое.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте нет особой вопросительной частицы; слова можно также понять как восклицание: «Ты полностью истребляешь остаток Израиля!» Контекст, однако, позволяет видеть здесь тревожный вопрос-мольбу.'
    reason: ambiguity
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Повествовательная формула вводит наступившее событие; краткое «И было» сохраняет еврейскую структуру без излишней архаизации.
- source_word: כְּהִנָּבְאִי
  choice: когда я пророчествовал
  rationale: Предлог כ с инфинитивом и суффиксом первого лица имеет временное значение и обозначает действие, во время которого наступила смерть.
- source_word: וּפְלַטְיָהוּ בֶן־בְּנָיָה
  choice: Фалтия, сын Ванаии
  rationale: Имена переданы в традиционной русской библейской форме, узнаваемой для читателей; синтаксис отражает еврейское указание на происхождение.
- source_word: מֵת
  choice: умер
  rationale: Qal perfect глагола מות прямо сообщает о наступившей смерти.
- source_word: וָאֶפֹּל עַל־פָּנַי
  choice: Тогда я пал ниц
  rationale: «Пал ниц» естественно и кратко передаёт буквальное «пал на своё лицо» как жест потрясения, скорби и мольбы.
- source_word: וָאֶזְעַק קוֹל גָּדוֹל
  choice: громко вскрикнул
  rationale: זעק выражает сильный крик бедствия, а קול גדול указывает на громкость; русская формулировка передаёт силу эмоции без тяжеловесной кальки.
- source_word: אֲהָהּ
  choice: О
  rationale: Междометие выражает тревогу и скорбную мольбу; «О» естественно сочетается с последующим обращением в современном литературном русском.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: אֲדֹנָי передано как «Владыка», а тетраграмматон — личным именем «Яхве»; это различает оба компонента сочетания и избегает повтора «Господь Господь».
- source_word: כָּלָה ... עֹשֶׂה
  choice: полностью истребишь
  rationale: Идиома буквально означает «сделать полный конец». Контекст требует понятного выражения полной гибели, а форма причастия допускает настоящее или близкое будущее.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: остаток Израиля
  rationale: «Остаток» сохраняет ключевой библейский термин для уцелевшей части народа.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбранный вариант прямо сохраняет личное имя YHWH и одновременно передаёт титул אֲדֹנָי, не смешивая два разных элемента обращения.
- issue: Сила заключительной реплики Иезекииля
  choice: 'риторически-вопросительная мольба: «Неужели Ты полностью истребишь…?»'
  alternative: «Ты полностью истребляешь…?»; утвердительное восклицание
  rationale: В еврейском нет вопросительной частицы, однако контекст тревожного обращения к Богу естественно допускает вопрос. «Неужели» передаёт ужас и ходатайственный оттенок, не превращая фразу в уверенное утверждение.
- issue: Временная сила עֹשֶׂה
  choice: 'будущее/неминуемое действие: «истребишь»'
  alternative: 'настоящее действие: «истребляешь»'
  rationale: Причастие допускает настоящее или близкое будущее; в контексте смерти Фалтии пророк опасается полного уничтожения остатка. Неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены термин «остаток», эмоциональная напряжённость пророческой мольбы и неоднозначность заключительной фразы. Традиционные русские формы имён использованы ради узнаваемости; имя Яхве передано явно.
