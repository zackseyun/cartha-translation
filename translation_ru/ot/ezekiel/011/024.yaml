  text: וְ/ר֣וּחַ נְשָׂאַ֗תְ/נִי וַ/תְּבִיאֵ֤/נִי כַשְׂדִּ֨ימָ/ה֙ אֶל הַ/גּוֹלָ֔ה בַּ/מַּרְאֶ֖ה בְּ/ר֣וּחַ אֱלֹהִ֑ים וַ/יַּ֨עַל֙ מֵֽ/עָלַ֔/י הַ/מַּרְאֶ֖ה אֲשֶׁ֥ר רָאִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/024.yaml
  text: Then the Spirit lifted me up and brought me to the exiles in Chaldea[a], in the vision by the Spirit of God[d][c][b]; and the vision that I had seen went up from me.
translation:
  language: ru
  text: И Дух поднял меня и перенёс в Халдею, к изгнанникам, в видении, Духом Божьим[a]. Затем видение, которое я видел, поднялось от меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в видении, в Духе Божьем». Еврейский предлог может указывать как на действующую силу, так и на сферу происходящего.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «поднялось от меня»; возможен перевод: «взошло от меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: И Дух
  rationale: В контексте видения и последующего выражения «Духом Божьим» רוּחַ естественнее всего обозначает Духа; союз передан простым повествовательным «и».
- source_word: נְשָׂאַתְנִי
  choice: поднял меня
  rationale: Сохраняет конкретный образ подъёма, заложенный в נשׂא, и соответствует языку видений Иезекииля.
- source_word: וַתְּבִיאֵנִי
  choice: перенёс
  rationale: Форма породы hифиль от בוא означает «привести, доставить»; в сочетании с предыдущим глаголом «перенёс» естественно описывает перемещение пророка.
- source_word: כַשְׂדִּימָה
  choice: в Халдею
  rationale: Направительный суффикс указывает на движение в землю халдеев; географическое название сохраняет форму исходного текста.
- source_word: אֶל הַגּוֹלָה
  choice: к изгнанникам
  rationale: Существительное с артиклем может собирательно обозначать сообщество переселённых; русский перевод ясно передаёт адресатов перемещения.
- source_word: בַּמַּרְאֶה
  choice: в видении
  rationale: מַרְאֶה здесь обозначает пророческое видение и указывает на характер пережитого перемещения.
- source_word: בְּרוּחַ אֱלֹהִים
  choice: Духом Божьим
  rationale: Творительный падеж естественно передаёт возможное значение средства или действующей силы, не добавляя отсутствующих в еврейском слов.
- source_word: וַיַּעַל מֵעָלַי
  choice: поднялось и удалилось от меня
  rationale: Сочетание сохраняет вертикальный образ עלה и одновременно естественно передаёт прекращение видения; буквальное «поднялось с меня» по-русски неясно.
- source_word: הַמַּרְאֶה אֲשֶׁר רָאִיתִי
  choice: видение, которое я видел
  rationale: Сохраняет лексический повтор корня רא״ה, заметный в еврейском тексте.
theological_decisions:
- issue: Личное или безличное значение רוּחַ
  choice: Оба употребления отнесены к Духу, второе прямо передано как «Дух Божий».
  alternative: ветер; дуновение; дух
  rationale: Пророческое видение и перемещение, а также явное אֱלֹהִים при втором употреблении поддерживают значение Божьего Духа, не требуя дальнейшего догматического уточнения.
- issue: Значение предлога בְּ в בְּרוּחַ אֱלֹהִים
  choice: Духом Божьим — средство или действующая сила
  alternative: в Духе Божьем — сфера переживания
  rationale: Еврейский предлог допускает оба оттенка; основной текст выбирает естественную русскую конструкцию, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Сохранены повтор «видение, которое я видел» и образ подъёма; неестественная русская калька устранена. Маркеры всех сносок присутствуют в основном тексте.
