  source_fidelity: 'Русский текст точно передаёт последовательность и основные значения еврейского оригинала: каузативное «выведу», удаление «из него», передачу «в руки» чужеземцев и совершение над адресатами судебного наказания. «Из него» уместно сохраняет невыраженный в стихе, но контекстуально понятный референт — город; русской форме не требуется воспроизводить грамматический род еврейского суффикса. Собирательное «суд» приемлемо передаёт שְׁפָטִים как совокупность судебных действий.'
