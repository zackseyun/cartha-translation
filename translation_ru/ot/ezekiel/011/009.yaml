base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/009.yaml
  text: And I will bring you out from its midst[a], and I will give you into the hand of foreigners[b], and I will execute judgments on you.
translation:
  language: ru
  text: И Я выведу вас из него, и отдам вас в руки чужеземцев, и совершу над вами суд.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: И Я выведу
  rationale: Порода hифиль глагола יצא имеет каузативное значение «вывести, заставить выйти»; «выведу» точно и естественно передаёт его в русском языке.
- source_word: מִתּוֹכָהּ
  choice: из него
  rationale: תּוֹךְ обозначает внутренность, середину; суффикс 3-го лица женского рода указывает на Иерусалим, то есть город. Русское местоимение согласуется со словом «город», подразумеваемым контекстом, и не добавляет отсутствующего в стихе существительного.
- source_word: וְנָתַתִּי אֶתְכֶם בְּיַד
  choice: и отдам вас в руки
  rationale: Оборот נתן ביד означает передачу человека под чужую власть. «Отдам вас в руки» сохраняет библейский образ и понятно современному читателю; множественное «руки» идиоматично по-русски.
- source_word: זָרִים
  choice: чужеземцев
  rationale: זָרִים здесь означает людей из иного народа, в контексте — иноземных завоевателей. «Чужеземцы» сохраняет смысл и соответствует возвышенному, но понятному регистру пророчества.
- source_word: וְעָשִׂיתִי בָכֶם שְׁפָטִים
  choice: и совершу над вами суд
  rationale: Сочетание עשה + שׁפטים с ב обозначает осуществление карательного суда над кем-либо. Единственное собирательное «суд» естественно по-русски и сохраняет судебно-карательный смысл выражения.
theological_decisions:
- issue: Референт суффикса женского рода в מִתּוֹכָהּ
  choice: 'Местоимение относится к Иерусалиму как городу: «из него».'
  alternative: «из её среды» или пояснительное «из города».
  rationale: Контекст однозначно указывает на Иерусалим. Форма «из него» естественна по-русски при подразумеваемом слове «город» и не вносит в основной текст поясняющего существительного.
- issue: Характер выражения שְׁפָטִים
  choice: «совершу над вами суд» как указание на Божье карательное судебное действие.
  alternative: «произведу над вами суды» или «совершу над вами приговоры».
  rationale: Еврейское множественное число может обозначать совокупность актов суда. Русское собирательное единственное число передаёт смысл без искусственной множественности и не уточняет способ исполнения суда.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Сохранены последовательные формы первого лица и образ передачи «в руки» чужеземцев; архаизмы и конфессионально окрашенные уточнения исключены.
