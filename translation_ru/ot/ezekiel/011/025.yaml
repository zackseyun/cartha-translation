  text: Then I spoke to the exiles all the words of Yahweh that he had shown me[a].
translation:
  language: ru
  text: И я передал изгнанникам[a] все слова Яхве, которые Он показал мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изгнанию»; это собирательное обозначение всей общины изгнанников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: Тогда я пересказал
  rationale: 'Форма wayyiqtol продолжает последовательность повествования. Глагол דבר с прямым дополнением «все слова» здесь естественно передаётся как «пересказал»: Иезекииль сообщил общине содержание полученного откровения.'
- source_word: אֶל הַגּוֹלָה
  choice: изгнанникам
  rationale: הַגּוֹלָה — собирательное обозначение общины переселённых. Русское множественное число ясно и естественно передаёт адресатов речи.
- source_word: אֵת כָּל דִּבְרֵי
  choice: все слова
  rationale: Сохранено существительное «слова», подчёркивающее словесный характер сообщённого откровения, а не более общее «всё».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: אֲשֶׁר הֶרְאַנִי
  choice: которые Он показал мне
  rationale: Hiphil глагола ראה означает «показал, дал увидеть». Относительное местоимение согласовано со «словами»; прописная буква в «Он» помогает ясно обозначить Яхве как деятеля без добавления имени в еврейский текст.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное Божье имя и не заменяет его титулом.
- issue: Связь придаточного אֲשֶׁר הֶרְאַנִי
  choice: «которые Он показал мне» относится к «словам»
  alternative: 'Передать смысл более свободно: «всё, что Яхве открыл мне»'
  rationale: Грамматически אֲשֶׁר следует за «словами Яхве». Формулировка сохраняет необычное библейское сочетание «показал слова» и не сводит зрительное откровение к одной лишь устной речи.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным тоном. «Пересказал» естественнее сочетает акт речи с сообщением всех слов; конструкция «показал слова» намеренно сохранена ради образности и смыслового напряжения оригинала.
