  source_fidelity: «которые говорят» точно передаёт субстантивированное причастие הָאֹמְרִים в его контекстной относительной функции. «Не скоро строить дома» адекватно сохраняет эллиптическую конструкцию לֹא בְקָרוֹב בְּנוֹת בָּתִּים, не вводя в основной текст отсутствующее слово «время». «Этот город — котёл, а мы — мясо» верно воспроизводит обе части образного высказывания; явное «этот город» оправдано контекстуальной отсылкой к Иерусалиму и не снимает образной неоднозначности.
  naturalness: Текст звучит как краткое, афористичное высказывание в современном литературном русском. Порядок слов «Не скоро строить дома» намеренно несколько сжат, но естественен для лозунговой реплики и удачно отражает эллиптичность оригинала. Тире в именных сказуемых нормативны и выразительны.
  terminology: «Котёл» — точный и естественный эквивалент סִיר в данном кулинарном образе. «Мясо» корректно передаёт הַבָּשָׂר в этом контексте, а сноска прозрачно отмечает буквальное «плоть». Термины не вносят конфессионального толкования.
