  yaml_path: translation/ot/ezekiel/011/003.yaml
  text: who say[a], ‘It is not near to build houses. This city is the pot[b], and we are the meat.’
translation:
  language: ru
  text: 'которые говорят: «Не скоро строить дома[a]. Этот город — котёл, а мы — мясо[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Ещё не скоро [придёт время] строить дома» или «Не близко строительство домов». Еврейская фраза эллиптична.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «плоть»; в образе котла имеется в виду мясо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: которые говорят
  rationale: Субстантивированное причастие с артиклем относится к упомянутым в контексте людям; относительное придаточное естественно по-русски и передаёт их постоянную характеристику.
- source_word: לֹא בְקָרוֹב
  choice: не скоро
  rationale: Кратко передаёт отрицание близости во времени, не добавляя отсутствующего в еврейском тексте слова «время»; эллиптичность и связь со следующим инфинитивом сохраняются.
- source_word: בְּנוֹת בָּתִּים
  choice: строить дома
  rationale: Инфинитивная конструкция с прямым дополнением передана непосредственно; возвратного значения «для себя» в тексте нет.
- source_word: הִיא הַסִּיר
  choice: этот город — котёл
  rationale: Местоимение женского рода по контексту указывает на Иерусалим; явное «этот город» делает образ понятным, а «котёл» точно и естественно передаёт סִיר.
- source_word: וַאֲנַחְנוּ הַבָּשָׂר
  choice: а мы — мясо
  rationale: В образе котла בָּשָׂר обозначает находящееся в нём мясо; такой перевод по-русски естественнее буквального «плоть» и не истолковывает смысл поговорки.
theological_decisions:
- issue: Смысл поговорки о котле и мясе
  choice: Сохранить метафору, не уточняя, выражает ли она уверенность в защите города или пренебрежение пророческим предупреждением.
  alternative: Передать её как прямое заявление о безопасности жителей либо как насмешливое отрицание близости суда.
  rationale: Еврейский текст даёт образ без однозначного пояснения его прагматической силы; перевод не должен снимать присущую контексту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; речь краткая и афористичная. Тире подчёркивают именную метафору, не добавляя толкования.
