  rationale: Традиционная и близкая к форме оригинала передача сохраняет межтекстовую узнаваемость, не превращая выражение в истолковывающий пересказ. Возможные смысловые варианты отмечены в сноске.
- issue: Направленность пророчества в עֲלֵיהֶם
  choice: против них
  alternative: о них
  rationale: Форма допускает более широкое значение, однако судебно-обличительный контекст делает противительное понимание наиболее вероятным; неоднозначность сохранена в сноске.
