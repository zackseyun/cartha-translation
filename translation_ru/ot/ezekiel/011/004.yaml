- source_word: בֶּן אָדָם
  choice: сын человеческий
  rationale: Сохраняет характерное для Иезекииля обращение и его словесную форму, подчёркивающую человеческую природу пророка; строчная буква указывает, что здесь это обращение к Иезекиилю.
theological_decisions:
