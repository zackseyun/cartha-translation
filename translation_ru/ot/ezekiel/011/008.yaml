  text: Вы боялись меча[a], и меч Я наведу на вас[b], — возвещает Господь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском: «меча». Повторяющийся образ может также обозначать войну или насильственный суд.'
    reason: lexical_alternative
