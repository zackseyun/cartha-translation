    text: 'Или: «Вы боялись меча, и Я наведу на вас меч». В еврейском тексте слово «меч» во второй части вынесено вперёд для акцента.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב
  choice: меч
  rationale: Существительное буквально означает «меч», а в пророческой речи может метонимически обозначать войну, насильственную гибель или карающий суд. Конкретный образ и его повтор в стихе сохранены.
- source_word: יְרֵאתֶם
  choice: вы боялись
  rationale: Форма qal, перфект, 2-е лицо множественного числа. Прошедшее время естественно передаёт завершённую форму, не исключая продолжающегося результата этого страха.
- source_word: וְחֶרֶב אָבִיא
  choice: и меч Я наведу
  rationale: Вынесенное перед глаголом повторное חֶרֶב передано тем же словом и сохранено в подчёркнутой позиции. Глагол בוא в hifil здесь означает причинить приход или наступление меча.
- source_word: עֲלֵיכֶם
  choice: на вас
  rationale: Предлог עַל с местоименным суффиксом непосредственно выражает направленность грядущего бедствия на адресатов; сочетание «наведу на вас» естественно в русском пророческом контексте.
- source_word: נְאֻם
  choice: возвещает
  rationale: Формула вводит торжественное божественное изречение. «Возвещает» сохраняет пророческий регистр и звучит естественнее буквального «речение».
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: אֲדֹנָי передано титулом «Владыка», а тетраграмматон — личным именем «Яхве», что избегает неестественного повтора «Господь Господь» и различает титул и имя.
theological_decisions:
- issue: Передача составного божественного именования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка ГОСПОДЬ
  rationale: В исходном тексте соединены титул אֲדֹנָי и имя יהוה. Передача «Владыка Яхве» сохраняет это различие и не подменяет личное имя вторым титулом; при этом не добавляет отсутствующих в тексте богословских уточнений.
- issue: Образ меча как орудия суда
  choice: сохранить буквальный образ «меча»
  alternative: передать расширительно как «война» или «насильственная кара»
  rationale: Контекст допускает более широкий метонимический смысл, однако сам стих намеренно повторяет конкретное слово חֶרֶב. Буквальная передача сохраняет образ и богословское напряжение, а возможная широта значения отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Инверсия «меч Я наведу» намеренно сохраняет акцент еврейского порядка слов; местоимение «Я» написано с прописной буквы как традиционное обозначение Бога.
