base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/021.yaml
  text: But as for those whose heart goes after their detestable things and their abominations[a], I have brought their way upon their own heads[b], declares the Lord GOD.
translation:
  language: ru
  text: А тем, чьё сердце тянется к их мерзостям и гнусностям[a], Я обращу их путь на их же головы[b], — возвещает Господь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к сердцу их мерзостей и гнусностей идёт их сердце»; это идиома, обозначающая внутреннюю приверженность. Слово «мерзости» нередко относится к идолам или другим предметам ложного поклонения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их путь Я возложил на их головы», то есть обратил последствия их поведения на них самих.'
    reason: idiom
lexical_decisions:
- source_word: וְאֶל
  choice: А тем
  rationale: Оборот вводит противопоставление людям, о которых говорится в ст. 19–20, и одновременно обозначает тех, к кому относится последующее возвещение.
- source_word: לֵב שִׁקּוּצֵיהֶם וְתוֹעֲבוֹתֵיהֶם לִבָּם הֹלֵךְ
  choice: чьё сердце тянется к их мерзостям и отвратительным делам
  rationale: Формулировка сохраняет образ сердца и направленного влечения, но передаёт необычную еврейскую идиому естественным русским языком. שִׁקּוּצִים обозначает мерзкие, нередко идольские предметы, а תּוֹעֵבוֹת — отвратительные перед Богом вещи или поступки; разные выражения сохраняют различие между парными словами.
- source_word: דַּרְכָּם בְּרֹאשָׁם נָתַתִּי
  choice: Я воздам по их пути
  rationale: Еврейская фраза буквально говорит о возложении их пути на их голову и выражает воздаяние человеку за его собственное поведение. Русская формула передаёт смысл идиомы без неестественной буквальности; исходный образ приведён в сноске.
- source_word: נְאֻם
  choice: возвещает
  rationale: Пророческая формула указывает на торжественное и авторитетное Божье изречение; «возвещает» естественно звучит в современном литературном русском.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное заветное имя יהוה и не смешивает два компонента составного титула.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Транслитерация «Яхве» позволяет различить личное имя יהוה и титул אֲדֹנָי, не привнося конфессионального толкования.
- issue: Временная отнесённость формы נָתַתִּי
  choice: Я воздам
  alternative: Я воздал; Я положил
  rationale: Формально это перфект, однако в пророческом контексте он может представлять объявленное наказание как твёрдо решённое. Будущее время согласуется с противопоставлением обещанию в предыдущих стихах, не устраняя оттенка непреложности приговора.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены библейские образы сердца и пути; особенно непривычные еврейские обороты разъяснены в сносках.
