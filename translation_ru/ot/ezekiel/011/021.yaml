  source_fidelity: 'Основная мысль передана верно: противопоставляются люди, внутренне обращённые к своим культовым мерзостям и гнусностям, и возвещается воздаяние за их собственный путь. Однако «отвратительным делам» сужает תּוֹעֲבוֹת до поступков, тогда как слово может обозначать также предметы и практики; кроме того, «воздам по их пути» недостаточно ясно передаёт образ возвращения их пути на их головы.'
