language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כִּ֤י הִרְחַקְתִּי/ם֙ בַּ/גּוֹיִ֔ם וְ/כִ֥י הֲפִֽיצוֹתִ֖י/ם בָּ/אֲרָצ֑וֹת וָ/אֱהִ֤י לָ/הֶם֙ לְ/מִקְדָּ֣שׁ מְעַ֔ט בָּ/אֲרָצ֖וֹת אֲשֶׁר בָּ֥אוּ שָֽׁם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/016.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: Though I removed them far off among the nations, and though I scattered them among the lands, yet I became for them a little sanctuary in the lands where they had gone.’'
translation:
  language: ru
  text: 'Поэтому скажи: «Так говорит Владыка Яхве: хотя Я удалил их среди народов и рассеял по странам, Я всё же стал для них малым святилищем[a] в тех странах, куда они пришли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилищем на короткое время». Еврейское выражение может означать либо малое, ограниченное святилище, либо святилище на непродолжительное время.'
    reason: Сохранение возможного временного прочтения מְעַט наряду с основным качественно-количественным прочтением.
lexical_decisions:
- source_word: לָכֵן אֱמֹר
  choice: Поэтому скажи
  rationale: Передаёт логическое следствие из предыдущего контекста и прямое повеление пророку.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка ГОСПОДЬ
  rationale: Сохраняет пророческую формулу, а также оба элемента сочетания титула אֲדֹנָי и имени יהוה без неестественного повтора «Господь ГОСПОДЬ».
- source_word: כִּי ... וְכִי
  choice: хотя ... и
  rationale: Парные частицы имеют здесь уступительное значение по отношению к последующему утверждению о Божьем присутствии.
- source_word: הִרְחַקְתִּים בַּגּוֹיִם
  choice: Я удалил их к другим народам
  rationale: Сохраняет Божье действие как причину удаления и передаёт пребывание изгнанников среди чужих народов; «другим» естественно выражает их отличие от Израиля.
- source_word: הֲפִיצוֹתִים בָּאֲרָצוֹת
  choice: рассеял по разным странам
  rationale: Передаёт язык изгнания и множественное число אֲרָצוֹת естественным современным русским выражением.
- source_word: וָאֱהִי לָהֶם
  choice: Я всё же стал для них
  rationale: Форма וָאֱהִי обозначает последующее событие в прошлом; «всё же» ясно выражает контраст, подразумеваемый контекстом.
- source_word: לְמִקְדָּשׁ מְעַט
  choice: малым святилищем
  rationale: Сохраняет наиболее прямое качественно-количественное понимание מְעַט, не устраняя возможного временного смысла, указанного в сноске.
- source_word: בָּאֲרָצוֹת אֲשֶׁר בָּאוּ שָׁם
  choice: в тех странах, куда они пришли
  rationale: Точно сохраняет множественное число и пространственное придаточное; русское прошедшее время достаточно ясно обозначает их прибытие в места изгнания.
theological_decisions:
- issue: Передача יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  alternative: Владыка Яхве
  rationale: Традиционная типографическая передача имени как «ГОСПОДЬ» сохраняет различие между титулом и именем, а «Владыка» избегает тавтологии. Сам текст не требует конфессионального толкования имени.
- issue: Значение מְעַט в выражении לְמִקְדָּשׁ מְעַט
  choice: малое святилище
  alternative: святилище на короткое время
  rationale: Наиболее непосредственно מְעַט определяет меру или ограниченность святилища, однако грамматика допускает временное понимание; поэтому альтернатива сохранена в сноске.
- issue: Характер Божьего присутствия среди изгнанников
  choice: Бог сам стал для них святилищем
  alternative: Бог предоставил им святилище
  rationale: Еврейское וָאֱהִי לָהֶם לְמִקְדָּשׁ прямо говорит «Я стал/был для них святилищем»; перевод не подменяет Божье личное присутствие предоставлением отдельного места или учреждения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим регистром. «Святилище» сохраняет культовый смысл מִקְדָּשׁ; синтаксис упрощён без утраты уступительного контраста и Божьей личной инициативы.
