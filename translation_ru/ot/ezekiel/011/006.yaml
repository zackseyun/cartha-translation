lexical_decisions:
- source_word: הִרְבֵּיתֶם
  choice: умножили число
  rationale: Каузативная форма глагола רבה означает «сделали многочисленными». Оборот «умножили число» естественно передаёт результативно-каузативный смысл по-русски.
- source_word: חַלְלֵיכֶם
  choice: убитых вами
  rationale: 'חָלָל обозначает погибших насильственной смертью, а суффикс 2-го лица множественного числа здесь естественно передаётся как указание на виновников: «убитых вами». Такая формулировка сохраняет обвинительный характер контекста.'
- source_word: בָּעִיר הַזֹּאת
  choice: в этом городе
  rationale: Прямо передаёт локативную конструкцию и указательное местоимение.
- source_word: וּמִלֵּאתֶם
  choice: и наполнили
  rationale: Порода пиэль глагола מלא означает «наполнять»; совершенный вид уместно передаёт завершённое действие.
- source_word: חוּצֹתֶיהָ
  choice: его улицы
  rationale: Во множественном числе в городском контексте חוּצוֹת может обозначать улицы, площади или открытые общественные места. «Улицы» — наиболее естественный русский эквивалент в данном контексте.
- source_word: חָלָל
  choice: убитыми
  rationale: Форма единственного числа употреблена собирательно. Творительный падеж требуется русским глаголом «наполнить» и сохраняет лексическую связь с первым употреблением слова.
