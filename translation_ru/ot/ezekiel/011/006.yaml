  text: Вы умножили число ваших убитых[a] в этом городе и наполнили его улицы[b] убитыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваших павших» или «ваших погибших». Еврейское слово обозначает людей, убитых насильственной смертью. Притяжательный суффикс буквально означает «ваших»; в обвинительном контексте он может подразумевать ответственность адресатов за эти смерти.'
    reason: лексическая и синтаксическая альтернатива
  - marker: b
