  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ חַלְלֵי/כֶם֙ אֲשֶׁ֣ר שַׂמְתֶּ֣ם בְּ/תוֹכָ֔/הּ הֵ֥מָּה הַ/בָּשָׂ֖ר וְ/הִ֣יא הַ/סִּ֑יר וְ/אֶתְ/כֶ֖ם הוֹצִ֥יא מִ/תּוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/007.yaml
  text: 'Therefore thus says Lord Yahweh: Your slain whom you have placed in its midst—they are the meat[a], and it is the pot; but you I will bring out from its midst.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Ваши убитые, которых вы положили посреди города, — это мясо[a], а город — котёл. Вас же Я выведу[b] из города».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плоть». Еврейское слово בָּשָׂר может означать и плоть, и мясо; в образе котла естественнее «мясо».'
    reason: lexical_alternative
  - marker: b
    text: 'Масоретское кере: «Я выведу». Кетив имеет форму הוֹצִיא, буквально: «он вывел»; в контексте её также понимают как «он выведет».'
    reason: textual_grammatical_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» естественно передаёт אֲדֹנָי в торжественной пророческой речи, а «Яхве» сохраняет личное Божье имя יְהוִה и позволяет избежать неестественного сочетания «Господь Господь».
- source_word: חַלְלֵיכֶם
  choice: ваши убитые
  rationale: Слово обозначает людей, погибших насильственной смертью, а не умерших вообще. Притяжательная конструкция сохранена без добавления прямо не выраженного указания «убитые вами».
- source_word: שַׂמְתֶּם בְּתוֹכָהּ
  choice: которых вы положили посреди города
  rationale: Глагол передан прямо, а местоименный суффикс раскрыт как «город» ради ясности по-русски; речь идёт об Иерусалиме.
- source_word: הֵמָּה הַבָּשָׂר
  choice: это мясо
  rationale: В образе котла «мясо» естественнее русского «плоть» и ясно обозначает содержимое котла; буквальная лексическая возможность отмечена в сноске.
- source_word: הַסִּיר
  choice: котёл
  rationale: Слово обозначает сосуд для варки. «Котёл» кратко и естественно сохраняет образ из контекста.
- source_word: הוֹצִיא
  choice: Он выведет
  rationale: 'В масоретском тексте стоит каузативная форма третьего лица мужского рода единственного числа: «Он выведет». Необычная смена лица сохранена, а распространённое понимание от первого лица отмечено в сноске.'
theological_decisions:
- issue: Передача Божьего имени в אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул и личное Божье имя, не заменяя тетраграмматон общим титулом.
- issue: Образ мяса и котла
  choice: образ сохранён непосредственно
  alternative: разъяснительный пересказ образа
  rationale: 'Стих переосмысливает предшествующее изречение: убитые названы мясом, а город — котлом. Перевод не устраняет резкость и напряжение метафоры.'
- issue: Лицо глагола הוֹצִיא
  choice: Он выведет
  alternative: Я выведу
  rationale: Форма WLC грамматически относится к третьему лицу. Хотя в прямой речи Яхве контекстуально ожидаемо первое лицо и так переводят многие версии, необычная форма исходного текста сохранена с указанием альтернативы.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаичной пророческой интонацией. Повтор местоименного «из её среды» передан естественным «из него», а подразумеваемый Иерусалим назван «городом» для ясности и согласования с мужским родом слова «котёл».
