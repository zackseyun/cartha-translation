    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое, а в данном контексте также возможное результативное значение союза кратко и естественно по-русски.
- source_word: בְּחֻקֹּתַי יֵלֵכוּ
  choice: они жили по Моим установлениям
  rationale: Глагол הלך буквально означает «ходить», но в заветном контексте обозначает образ жизни и поведение. Русское «жить по» естественно передаёт метафорический смысл и управление предлога בְּ.
- source_word: מִשְׁפָּטַי
  choice: Мои постановления
  rationale: В юридико-заветном контексте слово обозначает обязательные правовые решения или предписания; «постановления» ясно и естественно выражает этот смысл.
- source_word: יִשְׁמְרוּ
  choice: соблюдали
  rationale: Сочетание שׁמר с заповедями и постановлениями означает их хранить в смысле соблюдать; выбран обычный современный русский эквивалент.
- source_word: וְעָשׂוּ אֹתָם
  choice: и исполняли их
  rationale: Сохраняет отдельный акцент еврейского текста на практическом осуществлении предписаний после их соблюдения.
- source_word: וְהָיוּ לִי לְעָם
  choice: Тогда они будут Моим народом
  rationale: Передаёт устойчивую формулу завета. «Тогда» естественно связывает итог с предшествующей целевой конструкцией, не добавляя нового богословского содержания.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: а Я буду их Богом
  rationale: Точно и современно передаёт вторую половину взаимной формулы завета; «а» по-русски естественно отмечает соотношение двух сторон.
theological_decisions:
- issue: Передача взаимной формулы завета
  choice: «они будут Моим народом, а Я буду их Богом»
  alternative: «они станут для Меня народом, и Я стану для них Богом»
  rationale: Выбранная формулировка сохраняет устойчивую библейскую формулу и её взаимность, оставаясь естественной для современного русского языка и не привнося дополнительного толкования.
- issue: Цель или результат в לְמַעַן
  choice: «чтобы» с последующим «Тогда»
  alternative: «так что»
  rationale: לְמַעַן прежде всего вводит цель, хотя может включать оттенок результата. «Чтобы» сохраняет целевую направленность, а «Тогда» ясно вводит следующий итог, не устраняя смысловую связь.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Буквальная метафора «ходить в установлениях» заменена естественным русским выражением «жить по установлениям»; параллелизм «соблюдали… и исполняли» сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым благоговейным издательским регистром.
