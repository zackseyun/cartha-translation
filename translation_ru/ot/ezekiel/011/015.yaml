base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/015.yaml
  text: Son of man[a], your brothers, your brothers, the men of your redemption, and all the house of Israel, all of it—these are the ones to whom the inhabitants of Jerusalem have said, ‘Go far away from Yahweh[b]; this land has been given to us as a possession.’
translation:
  language: ru
  text: '«Сын человеческий, твои братья, твои братья, люди, связанные с твоим выкупом[a], и весь дом Израиля целиком — это те, кому жители Иерусалима сказали: „Держитесь подальше от Яхве! Эта земля отдана нам во владение[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для однозначного перевода; буквально: «мужи твоего выкупа». Возможные варианты: «твоя родня», «твои собратья по изгнанию» или «твои родичи, имеющие право выкупа». В оригинале употреблено слово от корня, связанного с выкупом и родичем-выкупщиком.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в наследие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохранена устоявшаяся формула обращения к Иезекиилю; она передаёт буквальный образ еврейского выражения и его особую роль в книге.
- source_word: אַחֶיךָ אַחֶיךָ
  choice: твои братья, твои братья
  rationale: Повтор, присутствующий в еврейском тексте, сохранён как смысловое усиление, а не сглажен.
- source_word: אַנְשֵׁי גְאֻלָּתֶךָ
  choice: люди твоего выкупа
  rationale: Намеренно сохранена связь с корнем גאל, обозначающим выкуп и право родича-выкупщика. Необычность выражения отражает трудность и неоднозначность оригинала; варианты разъяснены в сноске.
- source_word: וְכָל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: и весь дом Израиля, весь целиком
  rationale: Сохранены традиционное собирательное выражение «дом Израиля» и подчёркивающий полноту повтор.
- source_word: אֲשֶׁר אָמְרוּ לָהֶם
  choice: это те, кому ... сказали
  rationale: Так в русском языке ясно передана связь относительного местоимения с косвенным дополнением לָהֶם.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: жители Иерусалима
  rationale: Естественная современная передача причастного оборота, сохраняющая противопоставление жителей города изгнанникам.
- source_word: רַחֲקוּ מֵעַל יְהוָה
  choice: Удалитесь прочь от Яхве
  rationale: Форма передана как повелительное наклонение во множественном числе. «Прочь» естественно выражает усиленное пространственное удаление, заложенное в сочетании רחק и מעל.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, что сохраняет прямое употребление Тетраграмматона.
- source_word: לָנוּ הִיא נִתְּנָה הָאָרֶץ
  choice: Эта земля отдана нам
  rationale: Сохранены указательное значение местоимения, пассивная конструкция и притязание жителей Иерусалима на землю.
- source_word: לְמוֹרָשָׁה
  choice: во владение
  rationale: Передаёт землю как наследственное достояние и предмет обладания; возможный оттенок наследия отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал прямо употребляет личное имя Бога. «Яхве» сохраняет это различие, не подменяя имя титулом.
- issue: Толкование אַנְשֵׁי גְאֻלָּתֶךָ
  choice: люди твоего выкупа
  alternative: твоя родня; твои собратья по изгнанию; твои родичи, имеющие право выкупа
  rationale: Основной текст сохраняет лексическую связь с выкупом и не сводит трудное выражение к одному спорному социальному или юридическому толкованию.
- issue: Грамматическое понимание רַחֲקוּ
  choice: 'повеление: «Удалитесь прочь»'
  alternative: 'утверждение: «они далеки»'
  rationale: Вокализация и форма лучше всего допускают повелительное прочтение как часть прямой речи жителей Иерусалима; менее вероятное описательное прочтение не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого обращения. Синтаксис слегка приподнят, но понятен обычному читателю. Необычный оборот «люди твоего выкупа» сохранён ради прозрачности трудного еврейского выражения и снабжён пояснением.
