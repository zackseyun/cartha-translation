base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/002.yaml
  text: And he said to me[a], “Son of man[b], these are the men who devise iniquity and give evil counsel in this city.”
translation:
  language: ru
  text: 'И Он сказал мне: «Сын человеческий, вот люди, замышляющие беззаконие[a] и дающие злой совет[b] в этом городе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замышляющие зло»; возможны также оттенки «строящие преступные замыслы» или «замышляющие беду».'
    reason: 'Лексема אָוֶן и глагол חשב допускают несколько близких оттенков: нравственное зло, преступный замысел или причиняемую беду.'
  - marker: b
    text: 'Или: «советующие злое»; буквально: «советующие злой совет».'
    reason: В еврейском тексте употреблена усилительная конструкция с однокоренными глаголом и существительным.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И Он сказал мне
  rationale: Нарративный wayyiqtol передан обычной последовательной формулой; местоимение добавлено для естественности русского синтаксиса, а прописная буква указывает на Бога как говорящего в контексте видения.
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Устоявшееся и близкое к форме еврейского оригинала обращение к Иезекиилю, сохраняющее повторяющийся литературно-богословский мотив книги.
- source_word: אֵלֶּה הָאֲנָשִׁים
  choice: вот люди
  rationale: Указательное אֵלֶּה естественно передано словом «вот»; «люди» обозначает конкретных мужчин-руководителей и в данном контексте звучит естественнее, чем «мужи».
- source_word: הַחֹשְׁבִים אָוֶן
  choice: замышляющие беззаконие
  rationale: חשב с אָוֶן выражает намеренное обдумывание или составление злого замысла, а не просто злую мысль; «беззаконие» сохраняет нравственную тяжесть אָוֶן.
- source_word: וְהַיֹּעֲצִים עֲצַת רָע
  choice: и дающие злые советы
  rationale: Передаёт конструкцию с однокоренными глаголом и существительным без неестественного русского повтора; множественное число допускается собирательным характером их злого совета.
- source_word: בָּעִיר הַזֹּאת
  choice: в этом городе
  rationale: Прямое и естественное локативное соответствие.
theological_decisions:
- issue: Передача обращения בֶּן אָדָם
  choice: Сын человеческий
  alternative: смертный; человек
  rationale: Формально близкое традиционное обращение позволяет сохранить его последовательность и богословско-литературный резонанс в книге Иезекииля, не отождествляя автоматически пророка с позднейшим новозаветным титулом.
- issue: Смысл אָוֶן в сочетании с חשב
  choice: беззаконие
  alternative: зло; беду; тщету
  rationale: Параллель со «злым советом» поддерживает нравственный смысл, однако возможная семантическая широта слова отмечена в сноске.
- issue: Синтаксическая связь בָּעִיר הַזֹּאת
  choice: в этом городе относится к обоим действиям
  alternative: относить только к «дающим злые советы»
  rationale: Конечная позиция обстоятельства допускает формальную связь с ближайшим оборотом, но по смыслу оно естественно локализует всю деятельность названных людей; русская формулировка сохраняет некоторую структурную открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранено традиционное обращение «Сын человеческий»; архаизмы вроде «мужи» и неестественный однокоренной повтор устранены. Все маркеры сносок помещены непосредственно после соответствующих выражений.
