base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/012.yaml
  text: Then you will know that I am Yahweh[a], in whose statutes you have not walked, and whose judgments you have not carried out, but you have acted according to the judgments of the nations that are around you.
translation:
  language: ru
  text: И тогда вы узнаете, что Я — Яхве, чьим уставам вы не следовали и чьих установлений не исполняли, а поступали по установлениям[a] народов, окружающих вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по обычаям народов, окружающих вас». Еврейское слово, переведённое как «установления», в данном контексте может обозначать также принятые у этих народов обычаи или порядки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: И тогда вы узнаете
  rationale: Форма с союзом в контексте предшествующего суда имеет результативно-будущее значение. «Тогда» естественно выражает следствие, а «и» сохраняет связь с предыдущей речью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: בְּחֻקַּי לֹא הֲלַכְתֶּם
  choice: вы не следовали Моим уставам
  rationale: «Следовать уставам» естественно передаёт еврейскую метафору хождения по ним и сохраняет заветно-правовой смысл חֻקִּים.
- source_word: וּמִשְׁפָּטַי לֹא עֲשִׂיתֶם
  choice: и не исполняли Моих установлений
  rationale: «Исполняли» идиоматично передаёт עשה в сочетании с правовыми предписаниями; «установления» отличены от חֻקִּים «уставы».
- source_word: מִשְׁפָּטַי / כְמִשְׁפְּטֵי
  choice: установлений / по установлениям
  rationale: Повтор одного русского слова сохраняет намеренный лексический повтор מִשְׁפָּט и подчёркивает противопоставление Божьих требований нормам окружающих народов. Возможный оттенок «обычаи» отмечен в сноске.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם
  choice: а поступали по установлениям народов
  rationale: Союз передан противительным «а», поскольку эта часть противопоставлена двум отрицательным утверждениям. «Поступали по» естественно передаёт конструкцию עשה + כְּ.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: народов, окружающих вас
  rationale: «Народы» — обычный эквивалент גּוֹיִם в данном контексте; причастный оборот ясно и естественно передаёт относительное придаточное.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Связь признания Яхве с непослушанием Израиля
  choice: Двоеточие после «Яхве»
  alternative: «Яхве, по уставам Которого…»; «Яхве, потому что вы…»
  rationale: Еврейское אֲשֶׁר допускает связующее прочтение, а точная логическая функция здесь не обязана сводиться только к причинной или относительной. Двоеточие сохраняет смысловую связь, не устраняя эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; юридическая лексика и повтор מִשְׁפָּט сохранены, а тяжеловесная буквальная конструкция с относительным местоимением устранена без догматического уточнения неоднозначного אֲשֶׁר.
