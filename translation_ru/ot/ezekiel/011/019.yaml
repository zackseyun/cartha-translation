base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/019.yaml
  text: And I will give them one heart[a], and I will put a new spirit within them[b]. I will remove the heart of stone from their flesh and give them a heart of flesh.
translation:
  language: ru
  text: И дам им одно сердце[a], и новый дух вложу в вас[b]. Удалю каменное сердце из их плоти и дам им сердце из плоти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Одно сердце» можно понимать и как «неразделённое сердце», то есть как единую, цельную верность.
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте стоит: «в вас» (множественное число). По контексту часто принимают чтение «в них», согласующееся с окружающими местоимениями и близкой параллелью в Иезекииля 36:26.'
    reason: textual_variant
lexical_decisions:
- source_word: לֵב אֶחָד
  choice: одно сердце
  rationale: Прямо сохраняет еврейский образ сердца как средоточия воли, мысли и внутренней направленности. Возможный смысл цельной, неразделённой верности отмечен в сноске, но не подменяет образ в основном тексте.
- source_word: רוּחַ חֲדָשָׁה
  choice: новый дух
  rationale: В контексте внутреннего обновления רוּחַ естественно обозначает дух, а не ветер; перевод сохраняет отличие духа от сердца и не сводит оба понятия к психологическому состоянию.
- source_word: בְּקִרְבְּכֶם
  choice: в вас
  rationale: В представленном еврейском тексте стоит суффикс второго лица множественного числа — «в вас». Неожиданный переход от третьего лица сохранён в основном тексте, а контекстуальное чтение «в них» указано в сноске.
- source_word: וַהֲסִרֹתִי
  choice: удалю
  rationale: 'Передаёт каузативное значение: Бог устранит каменное сердце.'
- source_word: לֵב הָאֶבֶן
  choice: каменное сердце
  rationale: Естественный русский эквивалент еврейского образа «сердце камня», сохраняющий его конкретность.
- source_word: מִבְּשָׂרָם
  choice: из их плоти
  rationale: Сохраняет повтор ключевого слова בָּשָׂר и вещественный контраст между камнем и плотью, не обобщая его до «тела».
- source_word: לֵב בָּשָׂר
  choice: сердце из плоти
  rationale: Сохраняет противопоставление камня и живой плоти. Формулировка не истолковывает образ заранее как «мягкое» или «отзывчивое» сердце и избегает возможного русского оттенка выражения «плотяное сердце» как греховно-плотского.
theological_decisions:
- issue: Антропологические образы внутреннего обновления
  choice: Сохранить «сердце» и «дух» как разные, хотя и связанные понятия.
  alternative: Передать оба слова психологической парафразой, например «мышление» и «настрой».
  rationale: Еврейский текст описывает Божье преобразующее действие двумя собственными образами; их сохранение не навязывает читателю систематизированного объяснения их соотношения.
- issue: Образ сердца из плоти
  choice: Передать образ буквально как «сердце из плоти».
  alternative: «мягкое сердце» или «отзывчивое сердце».
  rationale: Сам текст противопоставляет камень плоти. Буквальный образ сохраняет одновременно значения живого, восприимчивого и некаменного сердца, не сводя его к одному толкованию.
- issue: Смена грамматического лица в בְּקִרְבְּכֶם
  choice: Сохранить засвидетельствованное в данном еврейском тексте «в вас» и пояснить трудность в сноске.
  alternative: Исправить в основном тексте на контекстуально ожидаемое «в них».
  rationale: Такой выбор отдаёт приоритет предоставленному древнееврейскому тексту и не скрывает его напряжения; контекстуально вероятная альтернатива остаётся доступной читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и ритмичный; конкретные образы сердца, камня, плоти и духа сохранены без конфессионально обусловленной расшифровки.
