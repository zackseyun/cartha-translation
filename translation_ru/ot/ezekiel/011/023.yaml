  text: וַ/יַּ֨עַל֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל תּ֣וֹךְ הָ/עִ֑יר וַֽ/יַּעֲמֹד֙ עַל הָ/הָ֔ר אֲשֶׁ֖ר מִ/קֶּ֥דֶם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/023.yaml
  text: And the glory of Yahweh went up from the midst of the city and stood on the mountain that is east of the city[a][b].
translation:
  language: ru
  text: И слава Яхве поднялась из середины города[a] и остановилась на горе, которая к востоку от города[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознеслась». Буквально: «поднялась от места над серединой города».'
    reason: Сноска отмечает возможный более торжественный перевод עלה и сохраняет пространственный оттенок מֵעַל («от/с места над»), не вводя в основной текст неестественную кальку.
  - marker: b
    text: 'Или: «которая перед городом» — значение зависит от пространственной ориентации.'
    reason: Слово קֶדֶם может означать как «восток», так и «передняя сторона, впереди».
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялась
  rationale: Глагол עלה обозначает движение вверх — «подниматься, восходить». «Поднялась» естественно передаёт движение славы Яхве в видении, не уточняя его способ.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: Сочетание передано как конструкция принадлежности; «слава» сохраняет смысл явленного величия и присутствия Бога, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: מֵעַל תּוֹךְ הָעִיר
  choice: из середины города
  rationale: Буквально выражение включает значение удаления «от/из пространства над серединой города». В основном тексте выбрана естественная русская формулировка, указывающая на исход из центральной части города; пространственная особенность отмечена в сноске.
- source_word: וַיַּעֲמֹד
  choice: остановилась
  rationale: עמד буквально значит «стоять», но после глагола движения также описывает остановку и пребывание на месте. Женский род согласован с русским словом «слава».
- source_word: עַל הָהָר
  choice: на горе
  rationale: Обычное пространственное значение предлога עַל и существительного הַר передано прямо и без добавления в текст конкретного названия горы.
- source_word: אֲשֶׁר מִקֶּדֶם לָעִיר
  choice: которая к востоку от города
  rationale: В географическом контексте קֶדֶם наиболее вероятно обозначает восток. Формулировка сохраняет именную конструкцию еврейского текста, не добавляя отсутствующего глагола движения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие и не привносит традиционную замену имени титулом.
- issue: Характер «славы Яхве»
  choice: слава Яхве
  alternative: явление славы Яхве; сияние Яхве
  rationale: Текст не поясняет здесь, является ли כָּבוֹד сиянием, облачным явлением или иной видимой формой присутствия. Поэтому сохранено ёмкое слово «слава» без истолковывающего добавления.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Синтаксис остаётся близким к последовательности еврейского текста, но избегает неестественных калек. Все сноски обозначены в основном тексте.
