base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/011.yaml
  text: It will not be for you as a pot[a], and you will not be within it as meat; at the border of Israel I will judge you.
translation:
  language: ru
  text: Он не будет для вас котлом, и вы не будете внутри него мясом[a][b]. На границе Израиля Я буду судить вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плотью». В образе котла имеется в виду мясо.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте отрицание явно стоит только перед первым сказуемым; его можно понимать как распространяющееся и на вторую часть. При буквальном ограничении его первой частью получится: «а вы будете внутри него мясом». Древнегреческий перевод явно отрицает и вторую часть.'
    reason: source_ambiguity
lexical_decisions:
- source_word: הִיא
  choice: Он
  rationale: Местоимение женского рода относится к Иерусалиму, то есть к городу; в русском согласование со словом «город» требует мужского рода. Местоимение сохраняет связь с предшествующим контекстом.
- source_word: לְסִיר
  choice: котлом
  rationale: סִיר обозначает сосуд для приготовления пищи. «Котёл» естественно сохраняет образ изречения об Иерусалиме и мясе.
- source_word: בְתוֹכָהּ
  choice: внутри него
  rationale: Буквально «внутри неё / посреди неё»; местоимение относится к городу, поэтому по-русски употреблён мужской род.
- source_word: לְבָשָׂר
  choice: мясом
  rationale: בָּשָׂר буквально означает «плоть», но в образе котла речь идёт о мясе, находящемся внутри сосуда. Буквальное соответствие отмечено в сноске.
- source_word: אֶל גְּבוּל יִשְׂרָאֵל
  choice: У границы Израиля
  rationale: אֶל с גְּבוּל в данном контексте указывает на место у границы, где совершается объявленный суд; русский предлог «у» передаёт локальный смысл без излишней конкретизации.
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: Я буду судить вас
  rationale: שׁפט употреблено в судебном смысле пророческого приговора; формулировка близка к исходному тексту и естественна по-русски.
theological_decisions:
- issue: Образ Иерусалима как котла, якобы защищающего находящееся в нём мясо
  choice: Сохранить образ котла и мяса без поясняющего пересказа
  alternative: 'Передать смысл напрямую: Иерусалим не станет для них защитой'
  rationale: Сохранение метафоры воспроизводит пророческое опровержение прежнего изречения и не подменяет сам образ его толкованием.
- issue: Область действия отрицания в первой половине стиха
  choice: Передать отрицание в обеих параллельных частях, отметив грамматическую неоднозначность в сноске
  alternative: 'Перевести вторую часть утвердительно: «а вы будете внутри него мясом»'
  rationale: В масоретском тексте לֹא выражено только перед первым сказуемым, однако отрицание может пониматься как распространяющееся на сочинённую вторую часть; такое прочтение соответствует контексту выведения людей из города и явно представлено в древнегреческом переводе. Сноска сохраняет реальную неоднозначность формы еврейского текста.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка пророческого суда. Синтаксис сохраняет параллелизм и резкость исходного образа, а неоднозначность еврейского отрицания вынесена в сноску.
