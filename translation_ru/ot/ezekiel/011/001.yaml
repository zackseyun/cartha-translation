source:
  edition: WLC
  text: וַ/תִּשָּׂ֨א אֹתִ֜/י ר֗וּחַ וַ/תָּבֵ֣א אֹ֠תִ/י אֶל שַׁ֨עַר בֵּית יְהוָ֤ה הַ/קַּדְמוֹנִי֙ הַ/פּוֹנֶ֣ה קָדִ֔ימָ/ה וְ/הִנֵּה֙ בְּ/פֶ֣תַח הַ/שַּׁ֔עַר עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ וָ/אֶרְאֶ֨ה בְ/תוֹכָ֜/ם אֶת יַאֲזַנְיָ֧ה בֶן עַזֻּ֛ר וְ/אֶת פְּלַטְיָ֥הוּ בֶן בְּנָיָ֖הוּ שָׂרֵ֖י הָ/עָֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/001.yaml
  text: Then the Spirit lifted me up and brought me to the east gate of the house of Yahweh[a], which faces eastward. And behold, at the entrance of the gate were twenty-five men, and I saw among them Jaazaniah son of Azzur and Pelatiah son of Benaiah[c][b], leaders of the people.
translation:
  language: ru
  text: Тогда Дух[a] поднял меня и перенёс к восточным воротам дома Яхве[b], обращённым на восток. И вот, у входа в ворота стояли двадцать пять человек. Среди них я увидел Иаазанию, сына Аззура, и Пелатию, сына Бенаи, — начальников народа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух». Еврейское רוּחַ может также означать «ветер», но в контексте видений Иезекииля здесь, вероятнее всего, имеется в виду Божий Дух.'
    reason: lexical_alternative
  - marker: b
    text: То есть к воротам храма Яхве.
    reason: cultural_note
  - marker: c
    text: 'Или: «правителей народа», «сановников народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Дух
  rationale: В контексте видений Иезекииля слово, вероятнее всего, обозначает Божьего Духа как действующего Лица, переносящего пророка; при этом возможность значения «дух» сохранена в сноске.
- source_word: וַתִּשָּׂא אֹתִי
  choice: поднял меня
  rationale: Передаёт буквальный образ подъёма и начало перемещения пророка.
- source_word: וַתָּבֵא אֹתִי
  choice: перенёс
  rationale: Естественно по-русски описывает доставление пророка к указанному месту и не повторяет глагол движения.
- source_word: שַׁעַר בֵּית יְהוָה
  choice: ворота дома Яхве
  rationale: Сохраняет образ «дома Яхве», не подменяя его непосредственно словом «храм»; пояснение дано в сноске.
- source_word: הַקַּדְמוֹנִי הַפּוֹנֶה קָדִימָה
  choice: восточным воротам… обращённым на восток
  rationale: Сохранена намеренная пространственная повторность еврейского текста.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Естественный русский повествовательный маркер, сохраняющий внезапность увиденного.
- source_word: בְּפֶתַח הַשַּׁעַר
  choice: у входа в ворота
  rationale: Передаёт местоположение идиоматично и ясно.
- source_word: שָׂרֵי הָעָם
  choice: начальников народа
  rationale: Широкое современное обозначение лиц, наделённых властью, без предположения о наследственном княжеском титуле.
theological_decisions:
- issue: Кого обозначает רוּחַ при перенесении пророка в видении
  choice: Божьего Духа
  alternative: неопределённого духа; ветер
  rationale: В контексте видений Иезекииля רוּחַ выступает как действующая сила, поднимающая и переносящая пророка. Заглавная буква отражает наиболее вероятное понимание, а языковая неоднозначность открыто отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной пророческой интонации. Синтаксис сделан ясным для широкого читателя; образность и пространственная повторность оригинала сохранены. Имена переданы близко к еврейским формам.
