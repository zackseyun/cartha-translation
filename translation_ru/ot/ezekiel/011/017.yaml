source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ וְ/קִבַּצְתִּ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/אָסַפְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצוֹתֶ֖ם בָּ/הֶ֑ם וְ/נָתַתִּ֥י לָ/כֶ֖ם אֶת אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/017.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: I will gather you from the peoples and assemble you from the lands where you have been scattered[b], and I will give you the land of Israel.’'
translation:
  language: ru
  text: 'Поэтому скажи: «Так говорит Владыка Яхве: Я соберу вас из народов и созову вас из стран, в которых вы были рассеяны, и отдам вам землю Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим пророчеством и сохраняет формальный переход.
- source_word: אֱמֹר
  choice: скажи
  rationale: Прямой и естественный перевод повеления, обращённого к пророку.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула, звучащая торжественно, но естественно в современном русском языке.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента сочетания: титул אֲדֹנָי и личное имя Бога יהוה, избегая неестественного повтора «Господь Господь».'
- source_word: וְקִבַּצְתִּי
  choice: Я соберу
  rationale: קבץ обозначает собирание рассеянных людей; русский глагол прямо и естественно передаёт этот образ.
- source_word: הָעַמִּים
  choice: народов
  rationale: Буквально и контекстуально точно передаёт множественное число עַמִּים; «племён» было бы уже, а «язычников» добавляло бы толкование.
- source_word: וְאָסַפְתִּי
  choice: возвращу
  rationale: В параллелизме с «соберу» глагол אָסַף буквально означает «соберу»; по-русски «возвращу» естественно выражает цель собирания из стран рассеяния, не меняя смысла восстановления.
- source_word: הָאֲרָצוֹת
  choice: стран
  rationale: В контексте рассеяния אֲרָצוֹת обозначает различные территории или страны; «страны» здесь естественнее русского «земли» во множественном числе.
- source_word: אֲשֶׁר נְפֹצוֹתֶם בָּהֶם
  choice: по которым вы были рассеяны
  rationale: Сохраняет пассивную форму и соотнесённость местоимения בָּהֶם со странами; «по которым» естественно описывает распространение среди разных территорий.
- source_word: וְנָתַתִּי לָכֶם
  choice: и отдам вам
  rationale: נתן означает «дать»; «отдам» в данном контексте подчёркивает передачу земли адресатам без добавления идеи, отсутствующей в тексте.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: землю Израиля
  rationale: Хотя אֲדָמָה может означать почву или землю, в пророчестве о возвращении речь идёт о территории Израиля.
theological_decisions:
- issue: Передача составного божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и имя יהוה и прозрачно передаёт присутствующее в еврейском тексте личное имя, не превращая его в общий титул.
- issue: Деятель восстановления и пассивное рассеяние
  choice: Сохранить первое лицо Бога в обещаниях и пассивную форму «вы были рассеяны»
  alternative: 'Уточнить: «Я рассеял вас»'
  rationale: Еврейский текст прямо называет Бога действующим лицом собирания и дарования земли, но в придаточном о рассеянии использует пассив без названного деятеля; перевод не должен молча уточнять его.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены формула вестника и параллельная структура обещаний; архаизмы и конфессионально маркированные замены имени יהוה исключены.
