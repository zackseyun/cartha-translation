lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит очередное пророческое откровение. Русская формула «И было… слово» сохраняет повествовательную связь и торжественную библейскую интонацию без излишней архаизации.
- source_word: דְבַר
  choice: слово
  rationale: В сочетании דְבַר יְהוָה существительное обозначает данное пророку откровение; «слово» точно передаёт устойчивую пророческую формулу и её повторяемость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени сохраняет отличие тетраграмматона от титула «Господь»; форма «Яхве» общеупотребительна в современной русской библеистике.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица выражает направленность речи к пророку; в данной русской формуле естественно «ко мне».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «сказать» вводит следующую прямую речь. В современном русском эту функцию естественно и полно передаёт двоеточие, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие; примечание сообщает читателю традиционную передачу.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. Двоеточие передаёт функцию לֵאמֹר и непосредственно вводит речь следующего стиха.
