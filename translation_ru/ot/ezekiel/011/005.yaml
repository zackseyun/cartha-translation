source:
  edition: WLC
  text: וַ/תִּפֹּ֣ל עָלַ/י֮ ר֣וּחַ יְהוָה֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אֱמֹר֙ כֹּה אָמַ֣ר יְהוָ֔ה כֵּ֥ן אֲמַרְתֶּ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל וּ/מַעֲל֥וֹת רֽוּחֲ/כֶ֖ם אֲנִ֥י יְדַעְתִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/005.yaml
  text: 'And the Spirit of Yahweh fell upon me[a], and he said to me, “Say, ‘Thus says Yahweh: So you have said, O house of Israel, and I know the things that come up in your spirit.’”'
translation:
  language: ru
  text: 'И Дух Яхве пал на меня, и Он сказал мне: «Скажи: „Так говорит Яхве: так вы говорили, дом Израиля, и Я знаю то, что возникает в вашем духе[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что приходит вам на ум»; букв.: «то, что восходит в вашем духе».'
    reason: Поясняет, что образ относится к внутренним мыслям или замыслам, не заменяя в основном тексте еврейское «дух» более узким словом «ум».
lexical_decisions:
- source_word: וַתִּפֹּל עָלַי
  choice: пал на меня
  rationale: Сохраняет яркий образ глагола נפל с предлогом עַל и передаёт внезапное, властное действие Духа, не сглаживая его до нейтрального «сошёл».
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: В контексте пророческого видения רוּחַ обозначает Божьего Духа, овладевающего пророком, а не ветер или человеческое расположение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, без замены его титулом.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Естественная и узнаваемая по-русски передача пророческой формулы посланника с сохранением настоящего времени еврейской формулы.
- source_word: כֵּן אֲמַרְתֶּם
  choice: так вы говорили
  rationale: Сохраняет повтор наречия «так» и передаёт обращённую к Израилю оценку уже произнесённых им слов без добавления отсутствующего в тексте содержания.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет заветную коллективную формулу обращения, а не упрощает её до одного имени «Израиль».
- source_word: וּמַעֲלוֹת רוּחֲכֶם
  choice: то, что поднимается в вашем духе
  rationale: Передаёт образ восхождения в מַעֲלוֹת и сохраняет רוּחַ как «дух»; смысл «мысли, возникающие в уме» оставлен в примечании как допустимое истолкование.
- source_word: אֲנִי יְדַעְתִּיהָ
  choice: Я знаю
  rationale: Русская конструкция с предваряющим объектом «то, что…» естественно передаёт знание Яхве; настоящее время соответствует форме и контексту.
theological_decisions:
- issue: Значение רוּחַ в первой части стиха
  choice: Дух
  alternative: ветер; дух
  rationale: В контексте видения Иезекииля речь идёт о Божьем Духе, который овладевает пророком и сообщает ему слово.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя.
- issue: К кому относится וַיֹּאמֶר («и Он сказал»)
  choice: Он
  alternative: Яхве сказал; Дух сказал
  rationale: Местоименная передача сохраняет возможную соотнесённость как с непосредственно названным Духом Яхве, так и с самим Яхве и не разрешает грамматико-богословскую неоднозначность добавлением имени.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Формулы «пал на меня Дух» и «Так говорит Яхве» намеренно сохраняют образность и риторику еврейского текста; архаическое звательное «о дом Израиля» не употреблено.
