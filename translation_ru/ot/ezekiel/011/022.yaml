base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/022.yaml
  text: Then the cherubim lifted up their wings[a], with the wheels beside them[b], and the glory of the God of Israel was above them.
translation:
  language: ru
  text: Тогда херувимы подняли свои крылья, и колёса были рядом с ними[a], а слава Бога Израиля была сверху над ними[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив них» либо «соответственно им». Еврейское выражение обозначает расположение колёс по отношению к херувимам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «над ними сверху» — усиленное пространственное выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: подняли
  rationale: Форма Qal wayyiqtol от נשׂא с прямым дополнением «крылья» описывает их поднятие; «подняли» естественно передаёт действие, не привнося значения переноса.
- source_word: הַכְּרוּבִים
  choice: херувимы
  rationale: Устоявшееся русское библейское наименование небесных существ, сохраняющее форму множественного числа.
- source_word: כַּנְפֵיהֶם
  choice: крылья
  rationale: Контекст однозначно указывает, что речь идёт о крыльях херувимов; русское притяжательное местоимение можно естественно опустить без потери смысла.
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: и колёса были рядом с ними
  rationale: Именная конструкция описывает положение колёс относительно херувимов. Добавленная связка «были» делает эллиптическую еврейскую фразу ясной по-русски, не утверждая отдельно, что колёса подняли крылья.
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: а слава Бога Израиля
  rationale: «Слава» сохраняет традиционный и богословски насыщенный смысл כבוד как видимого явления Божьего присутствия, не заменяя его толкованием.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: была над ними, в вышине
  rationale: Передаёт и положение «над ними», и дополнительное пространственное усиление מִלְמָעְלָה, избегая неестественного русского «над ними сверху».
theological_decisions:
- issue: Передача כבוד в видении небесной колесницы
  choice: слава Бога Израиля
  alternative: явленное присутствие Бога Израиля
  rationale: Буквальное «слава» сохраняет образный, богословский и межтекстовый вес выражения, не сводя его к одному истолкованию.
- issue: Соотношение славы Бога и херувимов с колёсами
  choice: над ними, в вышине
  alternative: сверху над ними
  rationale: Формулировка сохраняет пространственное различие и усиление исходного текста, но не делает выводов о природе или локализации Бога за пределами описываемого видения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческого повествования. Синтаксис слегка разгружен точкой с запятой; термин «херувимы» и выражение «слава Бога Израиля» сохранены в общепринятой библейской форме.
