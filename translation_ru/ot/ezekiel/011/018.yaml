  text: וּ/בָ֖אוּ שָׁ֑מָּ/ה וְ/הֵסִ֜ירוּ אֶת כָּל שִׁקּוּצֶ֛י/הָ וְ/אֶת כָּל תּוֹעֲבוֹתֶ֖י/הָ מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/018.yaml
  text: They will come there and remove from it all its detestable things and all its abominations[a].
translation:
  language: ru
  text: Они придут туда и удалят оттуда все отвратительные предметы[a] и все мерзости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех идолов»; еврейское слово часто обозначает отвратительные предметы идолопоклонства.'
    reason: 'Лексическая альтернатива: контекст допускает более конкретное значение, чем оставленное в основном тексте.'
lexical_decisions:
- source_word: וּבָאוּ
  choice: Они придут
  rationale: Перфект с союзом в пророческой речи передаёт будущее действие в контексте обещанного возвращения; начальный союз по-русски можно не выражать явно.
- source_word: שָׁמָּה
  choice: туда
  rationale: Направительное наречие естественно передаётся русским «туда» после глагола движения.
- source_word: וְהֵסִירוּ
  choice: и удалят
  rationale: Каузативная форма глагола סור означает устранить, убрать; «удалят» ясно передаёт очищение этого места от названных предметов и явлений.
- source_word: אֶת כָּל שִׁקּוּצֶיהָ
  choice: все отвратительные предметы
  rationale: שִׁקּוּץ обозначает нечто вызывающее отвращение и нередко относится к идолам или предметам идолопоклонства. Слово «предметы» сохраняет предметный оттенок, не сводя значение исключительно к идолам.
- source_word: וְאֶת כָּל תּוֹעֲבוֹתֶיהָ
  choice: и все мерзости
  rationale: תּוֹעֵבָה — сильное оценочное слово о том, что отвратительно и неприемлемо перед Богом; «мерзости» сохраняет его библейско-богословскую весомость и отличает от предыдущего выражения.
- source_word: מִמֶּנָּה
  choice: оттуда
  rationale: Предлог с суффиксом женского рода отсылает к упомянутому месту. В сочетании с «придут туда» русское «удалят оттуда» звучит естественнее буквального «удалят из неё».
theological_decisions:
- issue: Следует ли прямо называть שִׁקּוּצִים идолами
  choice: В основном тексте сохранить более широкое выражение «отвратительные предметы»
  alternative: «идолы» или «мерзкие идолы»
  rationale: Контекст очищения от идолопоклонства делает значение «идолы» весьма вероятным, однако само еврейское слово шире технического обозначения идола. Альтернатива отмечена в сноске, чтобы не сужать смысл без необходимости.
translation_notes:
  register: Современный литературный русский язык; фраза лаконична и торжественна без архаизмов. Повтор местоименных суффиксов оригинала естественно свёрнут в «оттуда», а различие между двумя сильными еврейскими обозначениями сохранено сочетанием «отвратительные предметы» и «мерзости».
