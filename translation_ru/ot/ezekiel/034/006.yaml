  text: יִשְׁגּ֤וּ צֹאנִ/י֙ בְּ/כָל הֶ֣/הָרִ֔ים וְ/עַ֖ל כָּל גִּבְעָ֣ה רָמָ֑ה וְ/עַ֨ל כָּל פְּנֵ֤י הָ/אָ֨רֶץ֙ נָפֹ֣צוּ צֹאנִ֔/י וְ/אֵ֥ין דּוֹרֵ֖שׁ וְ/אֵ֥ין מְבַקֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/006.yaml
  text: My sheep wandered on all the mountains and on every high hill[a]; my sheep were scattered over the whole face of the earth[b], with no one searching or seeking for them.
translation:
  language: ru
  text: Мои овцы блуждали по всем горам и по каждому высокому холму[a]; мои овцы были рассеяны по всему лицу земли[b], и никто их не разыскивал и не искал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сбились с пути».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское הָאָרֶץ может означать «земля» или «страна/край»; буквально: «по всему лицу земли/страны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁגּוּ
  choice: блуждали
  rationale: Глагол שׁגה обозначает отклонение от верного пути, блуждание. «Блуждали» естественно передаёт пастушеский образ и допускает оттенок «сбились с пути».
- source_word: צֹאנִי
  choice: Мои овцы
  rationale: Конкретное «овцы» сохраняет пастушескую метафору и притяжательную форму оригинала.
- source_word: בְּכָל הֶהָרִים
  choice: по всем горам
  rationale: Предлог ב в контексте перемещения по горной местности естественно передаётся русским «по».
- source_word: וְעַל כָּל גִּבְעָה רָמָה
  choice: и по всякому высокому холму
  rationale: Переданы и всеобщность כָּל, и определение רָמָה «высокий»; «всякому» поддерживает приподнятый, но понятный библейский регистр.
- source_word: וְעַל כָּל פְּנֵי הָאָרֶץ
  choice: по всей поверхности земли
  rationale: Сохраняется образ פְּנֵי «лицо, поверхность» и неоднозначность אֶרֶץ между землёй вообще и страной/краем.
- source_word: נָפֹצוּ
  choice: рассеялись
  rationale: Нифаль от פוץ выражает рассеяние в разные стороны; русская возвратная форма естественно передаёт это состояние без указания действующего лица.
- source_word: וְאֵין דּוֹרֵשׁ
  choice: и никто их не разыскивал
  rationale: דרש здесь означает деятельно разыскивать пропавших; дополнение «их» ясно восстанавливается из контекста.
- source_word: וְאֵין מְבַקֵּשׁ
  choice: и не искал
  rationale: בקש также означает «искать». Сохранена пара близких глаголов оригинала, при этом повтор подлежащего по-русски не требуется.
theological_decisions:
- issue: Кого обозначают «Мои овцы»
  choice: Сохранена пастушеская метафора, в которой Бог говорит о принадлежащем Ему народе.
  alternative: Раскрыть метафору прямо как «Мой народ».
  rationale: Контекст Иезекииля 34 указывает на народ Израиля и неверных пастырей, однако сам стих говорит образно; перевод не должен подменять образ толкованием.
- issue: Масштаб выражения הָאָרֶץ
  choice: «земли» с примечанием о возможном значении «страны».
  alternative: «по всей стране».
  rationale: Слово אֶרֶץ допускает как широкий, так и территориально ограниченный смысл. Основной текст сохраняет широкое звучание, а сноска отмечает реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и два близких по смыслу глагола в заключении сохранены; неоднозначность слова אֶרֶץ вынесена в сноску.
