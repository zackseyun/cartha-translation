base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/015.yaml
  text: I myself will shepherd my flock[a], and I myself will make them lie down[c][b], declares the Lord Yahweh.
translation:
  language: ru
  text: Я Сам буду пасти Моё стадо и Сам дам ему лечь, — возвещает Владыка Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дам им лечь» или «уложу их». Еврейский глагол изображает пастуха, который даёт стаду спокойно и безопасно лечь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי ... וַאֲנִי
  choice: Я Сам ... и Сам
  rationale: Дважды употреблённое независимое местоимение подчёркивает, что Сам Бог будет действовать; повтор сохранён в естественной русской форме.
- source_word: אֶרְעֶה
  choice: буду пасти
  rationale: Глагол רעה здесь выражает весь труд пастуха — пасти и заботиться о стаде, а не только кормить.
- source_word: צֹאנִי
  choice: Моё стадо
  rationale: צֹאן — собирательное обозначение мелкого скота; в развёрнутом образе пастуха русское «стадо» естественно сохраняет коллективный смысл.
- source_word: אַרְבִּיצֵם
  choice: дам ему покой
  rationale: Каузативная форма от רבץ буквально означает «уложу их»; в пастушеском контексте речь о безопасном отдыхе стада. Эта передача естественна по-русски и сохраняет образный смысл.
- source_word: נְאֻם
  choice: возвещает
  rationale: Устойчивая пророческая формула авторитетного Божьего изречения; «возвещает» соответствует возвышенному, но современному библейскому регистру.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» непосредственно представляет личное имя יהוה, не смешивая два элемента составного титула.
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранная форма различает титул אֲדֹנָי и личное имя יהוה и избегает неестественного повтора «Господь Господь».
- issue: Характер обещанного покоя в אַרְבִּיצֵם
  choice: дам ему покой
  alternative: уложу их; дам им лечь
  rationale: Передача не уточняет сверх текста природу покоя, но выражает каузативный смысл и пастушеский образ безопасного отдыха.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Заглавные буквы в «Сам» и «Моё» отражают русскую библейскую издательскую традицию при прямой речи Бога. Единственное число «ему» согласовано с собирательным существительным «стадо».
