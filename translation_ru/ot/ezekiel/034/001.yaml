lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Стандартная повествовательная формула с וַיְהִי передаёт наступление нового речевого события; «И было» естественно сочетается в русском библейском стиле с формулой «слово…» и сохраняет последовательную связь.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר־יְהוָה слово דָּבָר обозначает конкретное Божье сообщение; «слово» сохраняет формальную связь с повторяющейся формулой и не сводит значение лишь к информации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, что непосредственно отражает еврейский текст.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица единственного числа прямо означает направление сообщения к говорящему; в сочетании со «словом» нормативно «ко мне».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לֵאמֹר вводит последующую прямую речь. В современном русском двоеточие выполняет эту функцию естественнее буквального «говоря», не теряя смысла конструкции.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя, тетраграмматон. Передача «Яхве» сохраняет его как имя; примечание сообщает читателю о традиционной замене титулом и другом варианте передачи.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой пророческой формулы. Двоеточие вместо буквального «говоря» естественно вводит речь, начинающуюся в следующем стихе.
