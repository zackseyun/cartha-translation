  text: 'И пришло ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (тетраграмматон); традиционно переводится «Господь»; другой вариант передачи — «Иегова».
