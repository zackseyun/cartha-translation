base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/024.yaml
  text: And I[a], Yahweh, will be their God, and my servant David will be prince among them. I, Yahweh, have spoken.
translation:
  language: ru
  text: И Я, Яхве, буду их Богом, а Мой слуга Давид[a] будет князем среди них. Я, Яхве, сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Мой слуга Давид» могут типологически или пророчески указывать на грядущего правителя из рода Давида, то есть на Мессию; в самом еврейском тексте стоит имя «Давид».
    reason: Сохраняет буквальное чтение основного текста и отмечает признанное мессианское понимание, не выдавая его за единственно возможное.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога общепринятой русской транслитерацией, не заменяя его титулом «Господь».
- source_word: אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: буду их Богом
  rationale: Естественно по-русски передаёт еврейскую формулу заветных отношений «быть Богом для них» и сохраняет будущее значение глагола.
- source_word: עַבְדִּי
  choice: Мой слуга
  rationale: В царско-заветном контексте это почётное обозначение верного служителя Бога; «слуга» понятно современному читателю и не привносит акцента на подневольном положении.
- source_word: דָוִד
  choice: Давид
  rationale: Сохраняется прямо названное в еврейском тексте личное имя без истолковывающей подстановки.
- source_word: נָשִׂיא
  choice: князем
  rationale: Сохраняет особое для Иезекииля обозначение правителя и не отождествляет его без основания с более определённым титулом «царь».
- source_word: בְתוֹכָם
  choice: среди них
  rationale: Естественно и точно передаёт местное значение выражения «в их среде».
- source_word: דִּבַּרְתִּי
  choice: сказал это
  rationale: Передаёт завершённость и торжественную окончательность пророческой формулы; местоимение «это» делает русскую фразу естественной, не добавляя нового содержания.
theological_decisions:
- issue: Кого обозначает «Давид» в выражении «Мой слуга Давид»
  choice: В основном тексте сохранено имя «Давид» без истолковывающей замены.
  alternative: Давид как грядущий правитель из рода Давида, то есть Мессия; либо воскресший исторический Давид.
  rationale: Еврейский текст прямо называет Давида, но в данном пророческом контексте имя допускает типологическое или пророческое понимание. Перевод не разрешает эту богословскую неоднозначность, а поясняет её в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и торжественный; союз «а» ясно разграничивает две части обещания. Местоимение «Мой» написано с прописной буквы по принятой русской традиции благоговейного обозначения принадлежности Богу.
