source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אוֹתָ֛/ם וּ/סְבִיב֥וֹת גִּבְעָתִ֖/י בְּרָכָ֑ה וְ/הוֹרַדְתִּ֤י הַ/גֶּ֨שֶׁם֙ בְּ/עִתּ֔/וֹ גִּשְׁמֵ֥י בְרָכָ֖ה יִֽהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/026.yaml
  text: And I will make them and the places around my hill a blessing[a], and I will send down the rain in its season; they will be showers of blessing.
translation:
  language: ru
  text: Я сделаю их и окрестности Моего холма благословением[a] и пошлю дождь в своё время; это будут дожди благословения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их и всё вокруг Моего холма». Вероятно, имеются в виду места вокруг святого Божьего холма, который часто понимают как Сион.'
    reason: Лексическая альтернатива для סְבִיבוֹת и пояснение вероятного, но не названного прямо референта.
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Я сделаю
  rationale: 'В сочетании с прямым дополнением и предикативным существительным נתן выражает результат: Бог сделает их благословением. Русское «сделаю» естественно передаёт этот смысл.'
- source_word: אוֹתָם וּסְבִיבוֹת גִּבְעָתִי
  choice: их и окрестности Моего холма
  rationale: סְבִיבוֹת обозначает окружающие места, окрестности. Буквальное «Моего холма» сохраняет неопределённость еврейского текста и не вводит в основной текст отождествление с Сионом.
- source_word: בְּרָכָה
  choice: благословением
  rationale: Единственное число сохранено; творительный падеж естественно оформляет в русском языке предикативное значение после «сделаю».
- source_word: וְהוֹרַדְתִּי
  choice: и пошлю
  rationale: Каузативная форма ירד означает «заставлю сойти». В отношении дождя русское «пошлю» естественно передаёт ниспослание дождя и сохраняет действие Бога.
- source_word: הַגֶּשֶׁם בְּעִתּוֹ
  choice: дождь в своё время
  rationale: Фраза указывает на своевременный, надлежащий срок дождя. «В своё время» близко к форме с местоименным суффиксом и естественно по-русски.
- source_word: גִּשְׁמֵי בְרָכָה
  choice: дожди благословения
  rationale: Сохранены множественное число и конструкция с родительным падежом, не устраняющая образную связь между дождями и благословением.
- source_word: יִהְיוּ
  choice: это будут
  rationale: Такая конструкция ясно вводит именную часть сказуемого во множественном числе и естественно связывает вторую часть стиха с посланным дождём.
theological_decisions:
- issue: К чему относится выражение «Мой холм»
  choice: Сохранить «Моего холма» без уточнения в основном тексте.
  alternative: Передать как «Сион», «Иерусалим» или «холм Моего святилища».
  rationale: Еврейский текст прямо говорит только «Мой холм». Контекст может указывать на Сион и святилище, однако конкретизация сняла бы намеренную недосказанность текста.
- issue: Характер «дождей благословения»
  choice: Сохранить образное родительное сочетание «дожди благословения».
  alternative: 'Передать истолковательно: «обильные дожди» или «дожди, несущие благословение».'
  rationale: Исходное выражение допускает как характеристику благотворных дождей, так и более широкую богословскую образность; буквальная конструкция сохраняет эту смысловую насыщенность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; ключевые повторы «благословением — благословения» и «дождь — дожди» сохранены.
