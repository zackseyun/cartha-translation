  yaml_path: translation/ot/ezekiel/034/011.yaml
  text: 'For thus says the Lord GOD: Behold[a], I myself will search for my sheep and seek them out.'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: «Вот, Я сам разыщу Моих овец и осмотрю их[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разыщу их», «навещу их» или «буду заботиться о них». Еврейский глагол может обозначать личный осмотр, разыскание или попечение об овцах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: 'Сочетание передаёт двойной божественный титул: אֲדֹנָי — «Владыка», а тетраграмматон — традиционным русским «ГОСПОДЬ», без неестественного повтора «Господь ГОСПОДЬ».'
- source_word: הִנְנִי אָנִי
  choice: Вот, Я Сам
  rationale: הִנְנִי привлекает внимание к непосредственному Божьему действию, а отдельное אָנִי усиливает личное местоимение; сочетание «Вот, Я Сам» сохраняет оба оттенка и звучит естественно в пророческой речи.
- source_word: וְדָרַשְׁתִּי
  choice: разыщу
  rationale: В пастушеском контексте דרש означает деятельно искать принадлежащих Богу овец. «Разыщу» передаёт не только поиск, но и предполагаемое обнаружение рассеянных овец.
- source_word: צֹאנִי
  choice: Моих овец
  rationale: צֹאן — собирательное обозначение мелкого скота или стада; здесь конкретное «овец» ясно сохраняет пастушеский образ и личную принадлежность Богу.
- source_word: וּבִקַּרְתִּים
  choice: и позабочусь о них
  rationale: Глагол בקר допускает значения личного осмотра, попечения и разыскания. После דרש перевод «позабочусь» избегает стилистического повтора и сохраняет более широкий смысл личного надзора за овцами; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה в составном титуле אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  alternative: Владыка Яхве
  rationale: Традиционная русская передача «ГОСПОДЬ» узнаваема как обозначение тетраграмматона, а «Владыка» отличает предшествующее אֲדֹנָי. Вариант «Владыка Яхве» точнее воспроизводит личное имя, но менее привычен для широкой русской аудитории; сам стих не требует разрешать связанную с произношением имени традиционную неопределённость.
- issue: Степень личного участия Бога в הִנְנִי אָנִי
  choice: Вот, Я Сам
  alternative: Вот Я — и Я взыщу
  rationale: Эмфатическое выражение подчёркивает, что Бог лично принимает на Себя дело, которым пренебрегли пастыри, но перевод не добавляет к тексту дальнейшего богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим регистром. Заглавные буквы в «Я Сам» и «Моих» служат принятой русской типографической маркировкой речи Бога; формулировка остаётся понятной без архаизмов.
