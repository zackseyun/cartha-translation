source:
  edition: WLC
  text: חַי אָ֜נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם לֹ֣א יַ֣עַן הֱיֽוֹת צֹאנִ֣/י לָ/בַ֡ז וַ/תִּֽהְיֶינָה֩ צֹאנִ֨/י לְ/אָכְלָ֜ה לְ/כָל חַיַּ֤ת הַ/שָּׂדֶה֙ מֵ/אֵ֣ין רֹעֶ֔ה וְ/לֹֽא דָרְשׁ֥וּ רֹעַ֖/י אֶת צֹאנִ֑/י וַ/יִּרְע֤וּ הָֽ/רֹעִים֙ אוֹתָ֔/ם וְ/אֶת צֹאנִ֖/י לֹ֥א רָעֽוּ־׀־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/008.yaml
  text: As I live[a], declares the Lord GOD, surely because my flock has become plunder and my flock has become food for every wild beast of the field, since there was no shepherd, and my shepherds did not seek my flock[b], but the shepherds fed themselves and did not feed my flock—
translation:
  language: ru
  text: Живу Я! — возвещает Владыка Яхве, — ибо Моё стадо стало добычей[a] и пищей для всех диких зверей, потому что не было пастыря, и пастыри Мои не искали Моего стада, а пасли самих себя[b], Моего же стада не пасли, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предметом разграбления».'
    reason: lexical_alternative
  - marker: b
    text: То есть заботились о собственной выгоде, а не о стаде.
    reason: idiom_explanation
lexical_decisions:
- source_word: חַי אָנִי
  choice: Живу Я
  rationale: Сохраняет краткую и торжественную форму пророческой клятвы Бога Своей жизнью.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: «Возвещает» естественно передаёт пророческую формулу נְאֻם; «Владыка Яхве» сохраняет различие титула אֲדֹנָי и личного имени יהוה без неестественного повтора «Господь Господь».
- source_word: אִם לֹא יַעַן
  choice: за то, что
  rationale: После формулы клятвы אִם לֹא вводит уверенное утверждение, а יַעַן — основание суда. Русское «за то, что» естественно связывает незавершённую клятвенную формулу с причиной последующего приговора.
- source_word: צֹאנִי
  choice: стадо Моё
  rationale: Собирательное «стадо» сохраняет пастушескую метафору и естественно повторяется в стихе.
- source_word: לָבַז
  choice: добычей
  rationale: בַּז обозначает захваченную добычу; здесь «добыча» также уместно сочетается с образом нападения зверей. Возможный оттенок «разграбления» отмечен в сноске.
- source_word: לְאָכְלָה לְכָל חַיַּת הַשָּׂדֶה
  choice: пищей для всех полевых зверей
  rationale: Передаёт буквальный образ пожирания и обычное библейское обозначение диких животных, сохраняя возвышенный регистр.
- source_word: מֵאֵין רֹעֶה
  choice: потому что не было пастыря
  rationale: Явно передаёт причинное обстоятельство беззащитности стада.
- source_word: וְלֹא דָרְשׁוּ רֹעַי אֶת צֹאנִי
  choice: и пастыри Мои не искали стада Моего
  rationale: «Искали» сохраняет прямое значение דרשׁ и не заменяет его более толковательным «заботились».
- source_word: וַיִּרְעוּ הָרֹעִים אוֹתָם
  choice: а пасли самих себя
  rationale: Сохраняет намеренную игру слов с корнем רעה и резкий образ пастырей, направивших служение на собственную выгоду.
- source_word: וְאֶת צֹאנִי לֹא רָעוּ
  choice: стада же Моего не пасли
  rationale: Сохраняет контраст, повтор глагола и завершающий акцент исходного текста.
theological_decisions:
- issue: Передача составного божественного именования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה; такое решение сохраняет различие двух элементов и не создаёт повтора «Господь Господь».
- issue: Референт местоимения אוֹתָם в выражении о пастырях
  choice: самих себя
  alternative: их
  rationale: 'По контрасту с непасомым стадом местоимение относится по смыслу к пастырям: они обслуживали собственные интересы. Сохранён образ «пасти себя», а его смысл пояснён в сноске.'
- issue: Незавершённость клятвенной конструкции
  choice: оставить стих с тире
  alternative: добавить подразумеваемое следствие суда
  rationale: Еврейский стих даёт основание приговора, а сам призыв и следствие продолжаются в следующих стихах. Тире сохраняет синтаксическую напряжённость и не вносит отсутствующего здесь содержания.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Инверсия «Живу Я» и формы «стадо Моё», «пастыри Мои» поддерживают достоинство речи; синтаксис остаётся понятным. Повторы слов «стадо» и «пасти» намеренно сохранены как значимые элементы еврейского текста.
