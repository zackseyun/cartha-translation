  terminology: «Пастух», «стадо», «овцы», «разыскивает/разыщу» и «избавлю» уместно сохраняют пастушескую метафору, повтор корня בקר и действие избавления. Прописное «Я/Моих» следует принятой в проекте библейской традиции и не добавляет толкования.
