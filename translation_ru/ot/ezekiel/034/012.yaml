  source_fidelity: 'В первой части исправлена временная конструкция בְּיוֹם הֱיוֹתוֹ («в тот день, когда он находится/бывает среди...»): «оказавшись» добавляло оттенок внезапного попадания, которого в еврейском тексте нет. «Из всех мест, где они были рассеяны» точнее передаёт מִכָּל־הַמְּקוֹמוֹת אֲשֶׁר נָפֹצוּ שָׁם, чем «отовсюду, куда...». Образ עָנָן וַעֲרָפֶל передан естественно как «тучи и густой мрак», без истолкования этого дня.'
