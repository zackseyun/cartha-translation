source:
  edition: WLC
  text: כְּ/בַקָּרַת֩ רֹעֶ֨ה עֶדְר֜/וֹ בְּ/יוֹם הֱיוֹת֤/וֹ בְ/תוֹךְ צֹאנ/וֹ֙ נִפְרָשׁ֔וֹת כֵּ֖ן אֲבַקֵּ֣ר אֶת צֹאנִ֑/י וְ/הִצַּלְתִּ֣י אֶתְ/הֶ֗ם מִ/כָּל הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נָפֹ֣צוּ שָׁ֔ם בְּ/י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/012.yaml
  text: As a shepherd seeks out his flock on the day he is among his sheep when they have been scattered[a], so I will seek out my sheep[b], and I will rescue them from all the places where they were scattered on a day of clouds and thick darkness.
translation:
  language: ru
  text: Как пастух разыскивает[a] своё стадо в тот день, когда он находится среди своих рассеянных овец, так Я разыщу Моих овец и избавлю их из всех мест, где они были рассеяны, в день тучи и густого мрака[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осматривает стадо и заботится о нём»; еврейское слово может выражать не только поиск, но и внимательное попечение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в облачный и мрачный день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבַקָּרַת ... כֵּן אֲבַקֵּר
  choice: Как пастух разыскивает ... так Я разыщу
  rationale: Повтор корня בקר сохранён повтором русского глагола. «Разыскивает» естественно передаёт в данном пастушеском контексте как внимательный осмотр и попечение, так и поиск рассеянных овец.
- source_word: רֹעֶה עֶדְרוֹ
  choice: пастух ... своё стадо
  rationale: «Пастух» и «стадо» прямо и естественно сохраняют пастушеский образ; местоимение передаёт суффикс принадлежности.
- source_word: בְּיוֹם הֱיוֹתוֹ בְתוֹךְ צֹאנוֹ נִפְרָשׁוֹת
  choice: оказавшись среди своих рассеянных овец
  rationale: Причастная конструкция передана по-русски естественно; «рассеянных» относится к овцам и сохраняет обстоятельства присутствия пастуха среди разошедшегося стада.
- source_word: צֹאנִי
  choice: Моих овец
  rationale: Передано конкретно как «овцы», чтобы сохранить личный пастушеский образ и отличие от более общего «стадо» в первой части.
- source_word: וְהִצַּלְתִּי אֶתְהֶם
  choice: и избавлю их
  rationale: Hiphil глагола נצל обозначает освобождение или спасение от опасности; «избавлю» уместно в возвышенной современной речи и не перегружено дополнительной конкретизацией.
- source_word: מִכָּל הַמְּקוֹמֹת אֲשֶׁר נָפֹצוּ שָׁם
  choice: отовсюду, куда они были рассеяны
  rationale: «Отовсюду» идиоматично передаёт «из всех мест», а «куда» ясно выражает направление предшествующего рассеяния.
- source_word: בְּיוֹם עָנָן וַעֲרָפֶל
  choice: в день облака и мрака
  rationale: Сохранены конкретный образ облака и тяжесть слова עֲרָפֶל; единственное число и отсутствие неопределённого артикля естественно передаются формой «в день».
theological_decisions:
- issue: Образ Бога как пастуха
  choice: Сохранить прямой образ Бога, лично разыскивающего и избавляющего Своих овец.
  alternative: Внести в формулировку мессианское или христологическое истолкование.
  rationale: В собственном контексте стих изображает Яхве как пастуха; возможные канонические связи не следует встраивать в перевод.
- issue: Характер «дня облака и мрака»
  choice: Оставить образ без прямого определения как дня суда, бедствия или изгнания.
  alternative: Истолковать выражение непосредственно как день суда или национальной катастрофы.
  rationale: Образ несёт зловещий богословский оттенок, но сам стих не раскрывает его однозначно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён без утраты сравнения и повторения ключевого корня; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
