  - severity: medium
    issue: «отовсюду, куда они были рассеяны»
    rationale: Исходный текст говорит об избавлении «из всех мест, где они были рассеяны». «Куда» меняет относительное указание на место пребывания после рассеяния на направление.
  - severity: low
