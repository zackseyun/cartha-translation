  text: And my flock must graze on what your feet have trampled[b][a], and drink what your feet have muddied.
translation:
  language: ru
  text: А Моему стаду приходится пастись на том, что вытоптано вашими ногами,[a] и пить то, что замутнено вашими ногами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пастись с вытоптанного вашими ногами… пить из замутнённого вашими ногами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצֹאנִי
  choice: А Моему стаду
  rationale: צֹאן — собирательное обозначение мелкого скота, прежде всего овец и коз; «стадо» естественно сохраняет пастушеский образ и притяжательный суффикс первого лица.
- source_word: מִרְמַס רַגְלֵיכֶם
  choice: на том, что вытоптано вашими ногами
  rationale: מִרְמַס обозначает вытоптанное или попранное; такая формулировка естественно сочетается с глаголом «пастись» и сохраняет образ испорченного пастбища.
- source_word: תִּרְעֶינָה
  choice: приходится пастись
  rationale: Имперфект Qal 3-го лица женского рода множественного числа означает «будут пастись». В контексте он описывает вынужденное следствие действий других овец; «приходится» передаёт эту обусловленность, не превращая высказывание в повеление.
- source_word: וּמִרְפַּשׂ רַגְלֵיכֶם
  choice: то, что замутнено вашими ногами
  rationale: מִרְפָּשׂ указывает на воду, взбаламученную и загрязнённую ногами. «Замутнено» ясно и без избыточного пояснения передаёт образ.
- source_word: תִּשְׁתֶּינָה
  choice: и пить
  rationale: Имперфект Qal 3-го лица женского рода множественного числа от שׁתה означает «пить»; модальный оттенок «приходится» естественно распространяется и на этот однородный инфинитив.
