source:
  edition: WLC
  text: בְּ/מִרְעֶה טּוֹב֙ אֶרְעֶ֣ה אֹתָ֔/ם וּ/בְ/הָרֵ֥י מְרֽוֹם יִשְׂרָאֵ֖ל יִהְיֶ֣ה נְוֵ/הֶ֑ם שָׁ֤ם תִּרְבַּ֨צְנָה֙ בְּ/נָ֣וֶה טּ֔וֹב וּ/מִרְעֶ֥ה שָׁמֵ֛ן תִּרְעֶ֖ינָה אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/014.yaml
  text: In good pasture I will pasture them[a], and on the high mountains of Israel their grazing place will be. There they will lie down in a good grazing place[b], and they will feed in rich pasture on the mountains of Israel.
translation:
  language: ru
  text: На хорошем пастбище Я буду пасти их, и на высоких горах Израиля будет место их отдыха[a]. Там они будут лежать в хорошем месте отдыха и пастись на тучном пастбище[b] на горах Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «их обиталище» или «их пастбище».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жирном пастбище», то есть обильном и плодородном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְעֶה טּוֹב
  choice: хорошее пастбище
  rationale: Сохраняет конкретный пастушеский образ и простое оценочное значение טוֹב без стилистического усиления.
- source_word: אֶרְעֶה אֹתָם
  choice: Я буду пасти их
  rationale: Глагол רעה описывает действие пастуха; «пасти» точно передаёт образ и поддерживает связь с существительным «пастбище».
- source_word: הָרֵי מְרוֹם יִשְׂרָאֵל
  choice: высокие горы Израиля
  rationale: מְרוֹם указывает на высоту; такая передача естественна по-русски и сохраняет топографический акцент.
- source_word: נְוֵהֶם / בְּנָוֶה טּוֹב
  choice: место их отдыха / хорошее место отдыха
  rationale: נָוֶה допускает значения обиталища и пастбищного места. В сочетании с лежанием скота «место отдыха» естественно сохраняет пасторальный контекст, не сводя слово только к кормлению; неоднозначность отмечена в сноске.
- source_word: תִּרְבַּצְנָה
  choice: они будут лежать
  rationale: Сохраняет конкретное изображение спокойно лежащего стада, не заменяя его отвлечённым «отдыхать».
- source_word: מִרְעֶה שָׁמֵן
  choice: тучное пастбище
  rationale: שָׁמֵן буквально связано с жирностью и здесь означает плодородие и изобилие. Традиционное русское сочетание «тучное пастбище» понятно и сохраняет образность оригинала.
- source_word: תִּרְעֶינָה
  choice: будут пастись
  rationale: Подлежащее — животные стада, поэтому возвратный глагол «пастись» точнее и естественнее русского «кормиться».
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: на горах Израиля
  rationale: Хотя אֶל обычно обозначает направление, здесь контекст пастьбы требует естественного локативного значения.
theological_decisions:
- issue: Пастушеский образ Божьей заботы
  choice: Сохранить конкретные образы пастьбы, пастбища и лежащего стада.
  alternative: 'Передать смысл отвлечённо: «Я буду заботиться о них», «они будут безопасно отдыхать».'
  rationale: Стих входит в развёрнутую речь о пастухе; конкретная метафорика принадлежит самому тексту и не должна заменяться её богословским толкованием.
- issue: Неоднозначность נָוֶה
  choice: В основном тексте передать как «место отдыха», а диапазон значений указать в сноске.
  alternative: Однозначно перевести как «жилище» либо «пастбище».
  rationale: Еврейское слово может обозначать обиталище, пастбище или место пребывания стада. Контекст лежания поддерживает «место отдыха», но не устраняет лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис близок к еврейскому параллелизму, но естественен по-русски. Заглавная буква в местоимении «Я» обозначает говорящего Бога по норме проекта; пастушеская метафорика сохранена последовательно.
