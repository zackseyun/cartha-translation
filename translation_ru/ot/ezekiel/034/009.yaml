  yaml_path: translation/ot/ezekiel/034/009.yaml
  text: 'Therefore, shepherds, hear the word of Yahweh:'
translation:
  language: ru
  text: 'Поэтому, пастухи, слушайте слово Яхве:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Союз вводит следствие из предшествующего обличения; «поэтому» естественно и точно передаёт логическую связь.
- source_word: הָרֹעִים
  choice: пастухи
  rationale: Сохранена центральная для главы метафора руководителей Израиля; перевод «пастыри» был бы более архаичным и мог бы вызвать узкоцерковные ассоциации.
- source_word: שִׁמְעוּ
  choice: выслушайте
  rationale: Повелительная форма множественного числа требует не просто восприятия звука, а внимательного принятия следующего Божьего слова; «выслушайте» звучит естественно в современном русском и сохраняет вес пророческого призыва.
- source_word: דְּבַר
  choice: слово
  rationale: «Слово» сохраняет традиционную и текстуально прозрачную форму пророческой формулы, не заменяя её толкованием «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не замещён титулом, что отражает непосредственную форму еврейского текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Сохранять ли метафору הָרֹעִים или истолковать её как обозначение руководителей
  choice: пастухи
  alternative: руководители; правители
  rationale: Развёрнутый образ пастухов составляет риторическую и богословскую основу главы, поэтому его следует сохранить в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Пастухи» предпочтено более архаичному «пастыри»; двоеточие сохранено, поскольку стих вводит последующее слово Яхве.
