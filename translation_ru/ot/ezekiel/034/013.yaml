base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/013.yaml
  text: And I will bring them out from the peoples[a], and gather them from the lands, and bring them into their own land; and I will pasture them on the mountains of Israel, by the streams, and in all the inhabited places of the land.
translation:
  language: ru
  text: Я выведу их из среды народов, соберу их из земель и приведу на их землю. Я буду пасти их на горах Израиля, у потоков[a] и во всех населённых местах земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в руслах», «в оврагах» или «в каналах». Еврейское слово может обозначать русла потоков, овраги или каналы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִים
  choice: Я выведу их
  rationale: Каузативная форма глагола יצא означает, что Бог выводит их; «выведу» естественно передаёт и само действие, и отзвук исхода.
- source_word: מִן הָעַמִּים
  choice: из среды народов
  rationale: עמים обозначает множество народов; оборот «из среды» ясно передаёт отделение рассеянных людей от народов, среди которых они находились.
- source_word: וְקִבַּצְתִּים מִן הָאֲרָצוֹת
  choice: соберу их из разных земель
  rationale: קבץ — обычный глагол собирания рассеянных, а множественное הָאֲרָצוֹת указывает на различные земли; слово «разных» естественно выражает множественность без добавления нового смысла.
- source_word: וַהֲבִיאֹתִים אֶל אַדְמָתָם
  choice: приведу на их землю
  rationale: Каузатив от בוא означает «привести», а אדמה здесь обозначает принадлежащую им землю. Русское «на их землю» сохраняет притяжательное значение без усиления до «собственной».
- source_word: וּרְעִיתִים
  choice: Я буду пасти их
  rationale: רעה объединяет значения «пасти», «кормить» и «быть пастухом»; в сочетании с перечислением мест выпаса «пасти» точнее всего сохраняет пастушеский образ.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: на горах Израиля
  rationale: После глагола «пасти» предлог אֶל указывает на область выпаса; по-русски естественно «на горах».
- source_word: בָּאֲפִיקִים
  choice: у водных потоков
  rationale: אפיקים может обозначать русла, водотоки, овраги или ущелья. В пастушеском контексте «у водных потоков» естественно передаёт вероятный смысл, а неоднозначность отмечена в сноске.
- source_word: וּבְכֹל מוֹשְׁבֵי הָאָרֶץ
  choice: во всех обитаемых местах этой земли
  rationale: מוֹשְׁבֵי обозначает места проживания или поселения. «Обитаемые места» сохраняет широкий смысл, а «этой земли» ясно соотносит выражение с только что названной землёй Израиля.
theological_decisions:
- issue: Смысл восстановления и притяжательная форма в אַדְמָתָם
  choice: на их землю
  alternative: на их собственную землю
  rationale: Суффикс прямо выражает принадлежность земли им. Вариант «их землю» сохраняет это значение и тему возвращения, не усиливая формулировку богословски нагруженным уточнением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены последовательные действия Бога и пастушеский образ; неоднозначное топографическое слово не сужено без пояснения.
