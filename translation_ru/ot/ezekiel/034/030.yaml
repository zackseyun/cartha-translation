base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/030.yaml
  text: And they will know that I[a], Yahweh their God, am with them, and that they, the house of Israel, are my people, declares the Lord GOD.
translation:
  language: ru
  text: И они узнают, что Я, Яхве, их Бог, — с ними[a] и что они, дом Израиля, — Мой народ, — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнают они
  rationale: Перфект с союзом в пророческом контексте имеет будущее, результативное значение; постпозиция местоимения придаёт фразе естественную для торжественной русской речи выразительность.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что они узнают, а не причинное придаточное.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: אֱלֹהֵיהֶם
  choice: их Бог
  rationale: Естественная русская передача сочетания существительного с местоименным суффиксом.
- source_word: אִתָּם
  choice: с ними
  rationale: Наиболее прямо передаёт значение совместного присутствия; возможный контекстуальный вариант «среди них» отмечен в сноске.
- source_word: וְהֵמָּה
  choice: и что они
  rationale: Явное местоимение сохраняет эмфатический субъект второй части формулы отношений завета.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямая и естественная передача устойчивой формулы завета; прописная буква указывает на говорящего Бога по нормам русского библейского стиля.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет устойчивое пророческое обозначение Израиля как единого родового и заветного сообщества.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт торжественную пророческую формулу и звучит естественно в современном литературном русском.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сохраняет оба элемента еврейского сочетания: титул אֲדֹנָי и личное имя יְהוָה, избегая смешения имени с титулом.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его отличие от титула אֲדֹנָי.
- issue: Язык присутствия завета в אִתָּם
  choice: с ними
  alternative: среди них
  rationale: «С ними» непосредственно сохраняет формулу Божьего присутствия и не уточняет пространственный оттенок, которого контекст допускает, но не требует.
- issue: Сочетание אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Так различаются титул и личное имя и одновременно сохраняется торжественный характер пророческой формулы.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены повтор личного местоимения, выражение «дом Израиля» и формула отношений завета; архаические формы и конфессионально обусловленная замена имени Яхве титулом не используются.
