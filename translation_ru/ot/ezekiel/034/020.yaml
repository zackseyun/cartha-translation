base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/020.yaml
  text: 'Therefore thus says the Lord GOD to them: Behold[a], I myself will judge between the fat sheep and the lean sheep.'
translation:
  language: ru
  text: 'Поэтому так говорит им Господь Яхве: «Вот, Я сам буду судить между упитанной овцой и тощей овцой[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте оба существительных стоят в единственном числе: «между упитанной овцой и тощей овцой»; вероятно, каждая овца представляет соответствующую группу в стаде.'
    reason: Сохранение грамматического числа и разъяснение его вероятного собирательно-классового значения.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего обличения, сохраняя логику пророческой речи.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для современного русского языка торжественная формула пророческой вести.
- source_word: אֲדֹנָי יְהוִה
  choice: Господь Яхве
  rationale: 'Передаёт оба элемента составного титула: אֲדֹנָי как «Господь», а личное имя יהוה как «Яхве».'
- source_word: אֲלֵיהֶם
  choice: им
  rationale: Здесь предлог אֶל обозначает адресатов речи; краткое «им» естественно в русском синтаксисе.
- source_word: הִנְנִי אָנִי
  choice: Вот, Я Сам
  rationale: «Вот» сохраняет указательно-привлекающую внимание силу הִנְנִי, а «Я Сам» — усиленное двойное выражение первого лица.
- source_word: וְשָׁפַטְתִּי
  choice: буду судить
  rationale: Глагол שׁפט здесь выражает вынесение решения и различение между двумя сторонами.
- source_word: בֵּין ... וּבֵין
  choice: между ... и ...
  rationale: Передаёт противопоставляющую конструкцию естественным русским оборотом без ненужного повторения предлога.
- source_word: שֶׂה
  choice: овца
  rationale: Существительное стоит в единственном числе и представляет отдельный тип или класс внутри стада; буквенное число сохранено.
- source_word: בִרְיָה
  choice: упитанная
  rationale: Обозначает тучность, полноту; «упитанная» ясно передаёт пастушеский образ и звучит естественнее, чем архаичное «тучная».
- source_word: רָזָה
  choice: тощая
  rationale: Точно передаёт худобу и образует ясную смысловую противоположность слову «упитанная».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Господь Яхве
  alternative: Владыка Господь; Господь Бог
  rationale: Выбор сохраняет как титул אֲדֹנָי, так и личное имя יהוה, не сливая их и не заменяя имя общим титулом.
- issue: Характер Божьего действия в וְשָׁפַטְתִּי
  choice: буду судить
  alternative: рассужу; произведу суд
  rationale: Формулировка сохраняет судебный смысл и не уточняет заранее, идёт ли речь преимущественно об осуждении, оправдании или управлении.
translation_notes:
  register: Современный литературный русский язык с торжественностью пророческой формулы. Синтаксис остаётся близким к еврейскому тексту, но не архаичным; усиление «Я Сам» и напряжение судебного образа сохранены.
