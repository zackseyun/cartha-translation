  text: וַ/הֲקִמֹתִ֨י עֲלֵי/הֶ֜ם רֹעֶ֤ה אֶחָד֙ וְ/רָעָ֣ה אֶתְ/הֶ֔ן אֵ֖ת עַבְדִּ֣/י דָוִ֑יד ה֚וּא יִרְעֶ֣ה אֹתָ֔/ם וְ/הֽוּא יִהְיֶ֥ה לָ/הֶ֖ן לְ/רֹעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/023.yaml
  text: And I will raise up over them one shepherd[a], my servant David, and he will shepherd them; he himself will shepherd them[c][b], and he himself will be their shepherd.
translation:
  language: ru
  text: И Я поставлю над ними одного пастыря[a] — Моего раба Давида[b], и он будет пасти их; он сам будет пасти их[c], и он будет их пастырем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздвигну над ними одного пастыря».'
    reason: lexical_alternative
  - marker: b
    text: «Давид» может обозначать самого Давида как идеального царя или, шире, будущего правителя из рода Давида.
    reason: alternative_reading
  - marker: c
    text: Еврейский текст несколько раз повторяет глагол со значением «пасти»; он также может означать «кормить» или «заботиться о стаде».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Я поставлю
  rationale: Каузативная форма קום означает «поставить», «воздвигнуть», «назначить». «Поставлю» естественно передаёт Божье установление пастыря над народом, не уточняя способ его появления.
- source_word: עֲלֵיהֶם
  choice: над ними
  rationale: Предлог עַל обозначает положение над народом и согласуется с образом пастыря как руководителя и попечителя.
- source_word: רֹעֶה אֶחָד
  choice: одного пастыря
  rationale: Передаёт прямое значение и сохраняет акцент на единственном пастыре.
- source_word: וְרָעָה / יִרְעֶה
  choice: будет пасти
  rationale: Глагол רעה охватывает выпас, кормление, заботу и руководство. «Пасти» сохраняет пастырскую метафору и намеренный повтор корня.
- source_word: אֵת עַבְדִּי דָוִד
  choice: Моего раба Давида
  rationale: Сохраняет данное в тексте имя и значимый титул «Мой раб», не добавляя толкования личности Давида.
- source_word: הוּא
  choice: он сам / он
  rationale: Самостоятельное местоимение несёт акцент. В первом повторе он явно передан словом «сам»; во втором наличие подлежащего «он», которое по-русски можно было бы опустить, сохраняет подчёркнутость без тяжеловесного двукратного «сам».
- source_word: יִהְיֶה לָהֶן לְרֹעֶה
  choice: он будет их пастырем
  rationale: Естественная русская передача конструкции роли и принадлежности; сохраняет личную связь пастыря с паствой.
theological_decisions:
- issue: Кого обозначает имя «Давид» в пророческом контексте
  choice: В основном тексте сохранено буквальное имя «Давид» без поясняющей замены.
  alternative: Будущий правитель из рода Давида; Мессия.
  rationale: Еврейский текст прямо называет Давида. Перевод не должен подменять имя одним из богословских истолкований; возможный более широкий династический смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «будет пасти» сохранён как важная особенность еврейского текста; тире естественно оформляет приложение «Моего раба Давида».
