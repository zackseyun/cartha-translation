base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/018.yaml
  text: Is it too little for you to graze on the good pasture[a], that you must trample the rest of your pastures with your feet, and to drink clear water[b], that you must muddy what remains with your feet?
translation:
  language: ru
  text: Разве вам мало пастись на хорошем пастбище и пить чистую воду[a], что вы топчете ногами остальные свои пастбища и мутите[b] ногами оставшуюся воду?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отстоявшуюся воду», то есть воду, которую не тревожили и которая поэтому осталась чистой.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол означает «взмучивать», «делать мутной», в данном случае — ногами.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: Разве вам мало
  rationale: Передаёт укоризненный риторический вопрос естественным современным русским оборотом.
- source_word: הַמִּרְעֶה הַטּוֹב
  choice: хорошем пастбище
  rationale: Сохраняет пастушеский образ и прямое значение מִרְעֶה как места выпаса.
- source_word: תִּרְעוּ
  choice: пастись
  rationale: Глагол רעה здесь описывает кормление пасущегося скота; русский глагол сохраняет образ овец.
- source_word: וְיֶתֶר מִרְעֵיכֶם
  choice: остальные свои пастбища
  rationale: Передаёт значение остатка и сохраняет множественное число еврейской формы מִרְעֵיכֶם.
- source_word: תִּרְמְסוּ בְּרַגְלֵיכֶם
  choice: топтать ногами
  rationale: Сохраняет и значение רמס, и явно названное орудие действия; повтор слова «ногами» поддерживает обвинительный параллелизм.
- source_word: וּמִשְׁקַע מַיִם
  choice: чистую воду
  rationale: Контекст указывает на отстоявшуюся, не взмученную воду; «чистую» ясно передаёт практический смысл, а буквальная лексическая возможность вынесена в примечание.
- source_word: תִּשְׁתּוּ
  choice: пить
  rationale: Инфинитив в русской риторической конструкции естественно соотносится с предшествующим «пастись».
- source_word: הַנּוֹתָרִים
  choice: оставшуюся воду
  rationale: Экспликация слова «вода» устраняет неестественную для русского языка субстантивацию и сохраняет смысл того, что осталось другим.
- source_word: תִּרְפֹּשׂוּן
  choice: мутить
  rationale: Глагол обозначает взмучивание воды ногами; «мутить» кратко, наглядно и точно передаёт действие.
theological_decisions: []
