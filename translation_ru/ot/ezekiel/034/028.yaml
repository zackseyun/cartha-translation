  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לֹא יִהְי֨וּ ע֥וֹד בַּז֙ לַ/גּוֹיִ֔ם וְ/חַיַּ֥ת הָ/אָ֖רֶץ לֹ֣א תֹאכְלֵ֑/ם וְ/יָשְׁב֥וּ לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/028.yaml
  text: They will no longer be plunder for the nations[a], and the wild animals of the land will not devour them. They will dwell securely[c][b], with no one to make them afraid.
translation:
  language: ru
  text: Они больше не будут добычей для народов[a], и дикие звери земли[b] не будут пожирать их. Они будут жить в безопасности[c], и никто не устрашит их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трофеем народов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «звери страны».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Они будут жить без страха, и никто не приведёт их в ужас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּז
  choice: добычей
  rationale: Существительное обозначает добычу или трофей, захваченный силой. «Добыча» естественно передаёт политическое разорение Израиля народами и сохраняет отличие от образа пожирающих зверей в следующей части стиха.
- source_word: לַגּוֹיִם
  choice: для народов
  rationale: גּוֹיִם здесь означает окружающие народы, без более позднего специального оттенка слова «язычники».
- source_word: חַיַּת הָאָרֶץ
  choice: дикие звери земли
  rationale: Сочетание обозначает живущих на земле диких животных; «дикие звери земли» сохраняет конкретный образ угрозы и звучит достойно в современном русском.
- source_word: תֹאכְלֵם
  choice: не будут пожирать их
  rationale: Хотя глагол буквально означает «есть», при зверях и людях «пожирать» естественно и ярко передаёт хищническое нападение.
- source_word: וְיָשְׁבוּ
  choice: Они будут жить
  rationale: ישב может означать «сидеть, жить, обитать». «Жить» ясно и естественно выражает устойчивое проживание в восстановленной безопасности.
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: Слово выражает безопасность и отсутствие угрозы; предложное сочетание естественно сочетается с русским «жить».
- source_word: וְאֵין מַחֲרִיד
  choice: и никто не устрашит их
  rationale: Причастие каузативной породы от חרד указывает на того, кто вызывает страх или трепет. Формулировка сохраняет личного деятеля и лаконичность еврейского текста.
- source_word: עוֹד
  choice: больше не
  rationale: В сочетании с отрицанием слово указывает на прекращение прежнего состояния; «больше не» — ясное современное соответствие.
theological_decisions:
- issue: Характер обещанной безопасности
  choice: Передать конкретное обещание восстановления и безопасности, не определяя, являются ли угрозы исключительно буквальными, символическими или окончательно эсхатологическими.
  alternative: Истолковать народы и диких зверей только как символы политических врагов либо ограничить обещание конкретной эсхатологической схемой.
  rationale: Еврейский текст прямо соединяет разорение народами и угрозу со стороны зверей. Перевод сохраняет оба образа и не разрешает богословский вопрос сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанно возвышенный пророческий регистр. Параллелизм и конкретные образы еврейского текста сохранены без архаизации и конфессионального истолкования.
