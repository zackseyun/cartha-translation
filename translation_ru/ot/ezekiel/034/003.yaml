source:
  edition: WLC
  text: אֶת הַ/חֵ֤לֶב תֹּאכֵ֨לוּ֙ וְ/אֶת הַ/צֶּ֣מֶר תִּלְבָּ֔שׁוּ הַ/בְּרִיאָ֖ה תִּזְבָּ֑חוּ הַ/צֹּ֖אן לֹ֥א תִרְעֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/003.yaml
  text: You eat the fat[a], you clothe yourselves with the wool, you slaughter the fattened sheep[b], but you do not shepherd the flock.
translation:
  language: ru
  text: Вы едите жир[a], одеваетесь в шерсть, закалываете откормленных овец[b], а стадо не пасёте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молоко». Некоторые переводы следуют здесь толковательной традиции или чтению древних версий, однако еврейское слово обычно означает «жир».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «откормленную»; возможно также: «упитанную» или «отборную». Речь, вероятно, идёт о хорошо откормленных животных стада.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  choice: жир
  rationale: חֵלֶב обычно означает «жир» или «жирная часть». Это сохраняет конкретный образ присвоения пастухами лучшего от стада; вариант «молоко» отмечен в сноске как традиционное или основанное на древних версиях прочтение.
- source_word: הַצֶּמֶר
  choice: шерсть
  rationale: צֶמֶר прямо обозначает шерсть; это естественный русский эквивалент в образе эксплуатации стада.
- source_word: תִּלְבָּשׁוּ
  choice: одеваетесь в
  rationale: לבש означает надевать или носить одежду. Возвратная форма «одеваетесь» естественно передаёт направленность действия на самих пастухов.
- source_word: הַבְּרִיאָה
  choice: откормленных овец
  rationale: Субстантивированное прилагательное от בריא означает упитанное, хорошо откормленное или отборное животное. В русском множественное число согласуется с последовательностью повторяющихся действий и ясно передаёт подразумеваемых животных стада.
- source_word: תִּזְבָּחוּ
  choice: закалываете
  rationale: זבח здесь означает убивать скот, а не обязательно приносить жертву. «Закалываете» сохраняет пастушеский контекст и конкретность действия.
- source_word: הַצֹּאן
  choice: стадо
  rationale: צֹאן собирательно обозначает мелкий скот. «Стадо» естественно по-русски и поддерживает развёрнутую пастушескую метафору.
- source_word: תִרְעוּ
  choice: пасёте
  rationale: רעה охватывает выпас и попечение пастуха. Русское «пасти стадо» сохраняет центральную метафору и звучит естественнее, чем буквальное «пастушествовать».
theological_decisions:
- issue: Метафорический образ пастырей как руководителей Израиля
  choice: 'Сохранить прямой пастушеский образ: «стадо не пасёте».'
  alternative: «не кормите овец» или «не заботитесь о стаде»
  rationale: Глагол «пасти» сохраняет литературную и богословскую цельность всей главы, не сужая обвинение лишь до кормления и не привнося дополнительных конфессиональных толкований.
translation_notes:
  register: Современный литературный русский язык; краткий, ритмичный ряд обвинений сохранён. Лексика конкретна и понятна, а заключительное «а» подчёркивает контраст между самообогащением пастухов и пренебрежением стадом.
