base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/010.yaml
  text: 'Thus says the Lord GOD: Behold[a], I am against the shepherds, and I will require my flock from their hand, and I will stop them from shepherding the flock. The shepherds will no longer shepherd them, and I will rescue my flock from their mouth[c][b], and it will no longer be food for them.'
translation:
  language: ru
  text: 'Так говорит Господь Яхве: «Вот, Я против пастухов. Я потребую у них Моё стадо[a] и не позволю им больше пасти стадо. Пастухи больше не будут пасти его. Я спасу Моё стадо от их пасти[b], и оно больше не будет им пищей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потребую Моё стадо из их руки»; выражение соединяет смысл возвращения вверенного стада и привлечения пастухов к ответу за него.'
    reason: Сохраняет юридическую и образную многозначность еврейского выражения מִיָּדָם.
  - marker: b
    text: 'Буквально: «из их рта»; так пастухи изображены не защитниками стада, а теми, кто его пожирает.'
    reason: Поясняет буквальный образ מִפִּיהֶם, переданный по-русски естественным выражением «от их пасти».
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента составного титула: אֲדֹנָי как «Владыка» и личное имя יהוה как «Яхве», избегая неестественного «Господь Господь».'
- source_word: הִנְנִי אֶל־הָרֹעִים
  choice: Вот, Я — против пастухов
  rationale: Сохраняет торжественную пророческую формулу и ясно выражает Божье противостояние пастухам.
- source_word: הָרֹעִים
  choice: пастухи
  rationale: Сохраняет развёрнутый образ руководителей как пастухов, не заменяя метафору толкованием.
- source_word: וְדָרַשְׁתִּי אֶת־צֹאנִי מִיָּדָם
  choice: Я взыщу с них Моё стадо
  rationale: «Взыщу» передаёт сочетание требования вернуть стадо и привлечения к ответу; образ «из их руки» пояснён в сноске.
- source_word: וְהִשְׁבַּתִּים מֵרְעוֹת צֹאן
  choice: не позволю им больше пасти стадо
  rationale: Естественно передаёт каузативный смысл הִשְׁבִּית — Бог прекратит их деятельность как пастухов.
- source_word: וְלֹא יִרְעוּ עוֹד הָרֹעִים אוֹתָם
  choice: Пастухи больше не будут пасти его
  rationale: Повтор корня רעה передан однокоренными «пастухи» и «пасти»; местоимение согласовано с собирательным существительным «стадо».
- source_word: וְהִצַּלְתִּי צֹאנִי מִפִּיהֶם
  choice: Я избавлю Моё стадо из их пасти
  rationale: Сохраняется резкий образ пастухов, которые сами пожирают стадо; русское «пасть» естественно подчёркивает хищнический оттенок.
- source_word: וְלֹא תִהְיֶיןָ לָהֶם לְאָכְלָה
  choice: оно больше не будет им пищей
  rationale: Прямо сохраняет образ пожирания и согласует сказуемое с собирательным «стадо».
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант сохраняет личное имя יהוה и одновременно передаёт титул אֲדֹנָי, не смешивая и не дублируя оба элемента.
- issue: Характер Божьего требования к неверным пастухам
  choice: Я взыщу с них Моё стадо
  alternative: Я призову их к ответу за Моё стадо
  rationale: 'Основной текст сохраняет намеренную многозначность דרש с מן־יד: требование вернуть вверенное и ответственность за него; более развёрнутое толкование дано в сноске.'
