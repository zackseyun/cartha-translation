  text: וַ/הֲקִמֹתִ֥י לָ/הֶ֛ם מַטָּ֖ע לְ/שֵׁ֑ם וְ/לֹֽא יִהְי֨וּ ע֜וֹד אֲסֻפֵ֤י רָעָב֙ בָּ/אָ֔רֶץ וְ/לֹֽא יִשְׂא֥וּ ע֖וֹד כְּלִמַּ֥ת הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/029.yaml
  text: And I will raise up for them a planting of renown[a], and they will no longer be consumed by famine in the land[b], nor will they bear the disgrace of the nations anymore.
translation:
  language: ru
  text: И Я воздвигну для них славное насаждение[a]. Они больше не будут гибнуть от голода в этой земле[b] и не будут больше терпеть позор народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «насаждение для имени»; возможно также: «насаждение, славное (прославленное) своим именем».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский оборот труден; буквально он близок к выражению «собранные (или убранные) голодом» и, вероятно, означает жертв голода — тех, кого голод уносит.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Я взращу
  rationale: Hiphil глагола קום выражает действие, которым Бог даёт чему-либо возникнуть или утверждает его. В сочетании с образом насаждения «взращу» естественно передаёт Божью инициативу, не устраняя сельскохозяйственную метафору.
- source_word: מַטָּע
  choice: насаждение
  rationale: Существительное обозначает то, что посажено, либо насаждение как целое. Русское «насаждение» сохраняет неопределённость между самим посаженным и местом или совокупностью посадок.
- source_word: לְשֵׁם
  choice: которое прославится
  rationale: Буквально «для имени»; оборот указывает на имя, известность или славу. Придаточная конструкция естественна по-русски и сохраняет направленность לְ, не превращая образ в однозначное именование личности.
- source_word: אֲסֻפֵי רָעָב
  choice: гибнуть от голода
  rationale: Трудный оборот с пассивной формой от אסף, буквально связанной с «собиранием» или «убиранием», вероятно, обозначает тех, кого голод уносит. «Гибнуть от голода» ясно передаёт вероятный результат; буквальная трудность отмечена в сноске.
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: В контексте восстановления Израиля אֶרֶץ, вероятнее всего, означает данную народу землю. Указательное «этой» по-русски помогает выразить контекстуально определённый артикль, не добавляя названия страны.
- source_word: יִשְׂאוּ
  choice: терпеть
  rationale: נשא буквально означает «нести», но с существительным «унижение» русское «терпеть» идиоматично передаёт продолжительное несение позора.
- source_word: כְּלִמַּת
  choice: унижение
  rationale: Слово охватывает позор, посрамление и бесчестье. «Унижение» хорошо сочетается с воздействием окружающих народов и сохраняет общественный характер бесчестья.
- source_word: הַגּוֹיִם
  choice: других народов
  rationale: В данном пророческом контексте имеются в виду народы, окружающие Израиль. «Других народов» естественно выражает это отношение по-русски, не используя конфессионально нагруженное «язычники».
theological_decisions:
- issue: Характер обещанного «насаждения»
  choice: Сохранён сельскохозяйственный образ без прямого отождествления насаждения с Мессией, народом или плодородием земли.
  alternative: Перевести как мессианскую Отрасль либо как прославленную плантацию и тем самым однозначно отнести образ к личности или сельскохозяйственному изобилию.
  rationale: Само еврейское выражение מַטָּע לְשֵׁם не уточняет референт с достаточной определённостью. Перевод сохраняет смысловую и богословскую открытость текста.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Заглавное «Я» подчёркивает речь Бога по принятой русской библейской традиции. Повтор «больше не будут» сохраняет риторический параллелизм еврейского текста.
