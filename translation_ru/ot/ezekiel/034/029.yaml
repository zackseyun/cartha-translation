    issue: «Я взращу» для וַהֲקִמֹתִי
    rationale: Глагол קום в каузативе означает прежде всего «воздвигнуть, поставить, учредить, дать возникнуть», а не выращивать. Сельскохозяйственный оттенок уже несёт מַטָּע.
  - severity: medium
    issue: «которое прославится» для לְשֵׁם
    rationale: Будущее «прославится» добавляет временное развитие, которого в еврейском выражении нет. Следует передать характеристику «славное/именитое», сохранив сноску к буквальному обороту.
  - severity: low
    issue: «от других народов»
    rationale: Слово «других» отсутствует в оригинале, а конструкция «унижение от» сужает возможный смысл генитива. «Позор народов» сохраняет исходную компактность и неоднозначность.
