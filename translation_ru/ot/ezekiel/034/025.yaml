  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם וְ/הִשְׁבַּתִּ֥י חַיָּֽה רָעָ֖ה מִן הָ/אָ֑רֶץ וְ/יָשְׁב֤וּ בַ/מִּדְבָּר֙ לָ/בֶ֔טַח וְ/יָשְׁנ֖וּ בַּ/יְּעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/025.yaml
  text: I will make with them a covenant of peace[a], and I will remove harmful wild animals from the land[b], so that they may dwell securely in the wilderness and sleep in the forests.
translation:
  language: ru
  text: Я заключу с ними завет мира[a], удалю опасных диких зверей из земли; они будут жить в безопасности в пустынной местности и спать в лесах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Мир» здесь может включать также целостность, благополучие и безопасность, а не только отсутствие вражды.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: заключу
  rationale: Обычный современный русский эквивалент древнееврейской идиомы כרת ברית («заключить завет»); буквальное «высеку/разрежу завет» по-русски не передаёт её смысла.
- source_word: בְּרִית שָׁלוֹם
  choice: завет мира
  rationale: Сохраняет заветную формулу и многозначность שָׁלוֹם, включающую мир, благополучие, целостность и безопасность.
- source_word: הִשְׁבַּתִּי
  choice: удалю
  rationale: Каузативная форма означает «сделаю так, чтобы прекратились/исчезли». В сочетании с «из земли» глагол «удалю» естественно передаёт результат, не утверждая уничтожения животных.
- source_word: חַיָּה רָעָה
  choice: опасных диких зверей
  rationale: חַיָּה обозначает здесь диких животных, а רָעָה — их опасный, вредоносный характер, а не нравственное зло.
- source_word: הָאָרֶץ
  choice: этой земли
  rationale: Контекст указывает на конкретную землю в территориально-заветном смысле, а не на всю планету; указательное «этой» естественно выражает определённость в русском.
- source_word: בַמִּדְבָּר
  choice: в пустынной местности
  rationale: מִדְבָּר может означать не только песчаную пустыню, но и малонаселённую степную или пастбищную местность. Выбор сохраняет широту значения.
- source_word: לָבֶטַח
  choice: безопасно
  rationale: Передаёт состояние защищённости и отсутствия угрозы в естественной современной русской форме.
- source_word: יָשְׁנוּ
  choice: спать
  rationale: Прямо сохраняет яркий образ полной безопасности даже в лесу.
- source_word: בַּיְּעָרִים
  choice: в лесах
  rationale: Стандартный и точный русский эквивалент множественного יְעָרִים.
theological_decisions:
- issue: Объём значения выражения «завет мира»
  choice: Сохранить формулу «завет мира», не сужая её до отсутствия войны и не разворачивая в основном тексте в позднейшую богословскую систему.
  alternative: Передать как «завет благополучия» или эксплицировать как всеобъемлющее спасительное благословение.
  rationale: שָׁלוֹם включает мир, целостность, благополучие и безопасность. Формальная заветная фраза сохраняет эту смысловую полноту и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; тон возвышенный, но понятный. «Жить» естественнее архаизирующего «обитать», а «пустынная местность» не создаёт слишком узкого образа песчаной пустыни. Порядок с целью («чтобы») ясно передаёт смысл еврейского сочинения предложений.
