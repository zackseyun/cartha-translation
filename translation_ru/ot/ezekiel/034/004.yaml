source:
  edition: WLC
  text: אֶֽת הַ/נַּחְלוֹת֩ לֹ֨א חִזַּקְתֶּ֜ם וְ/אֶת הַ/חוֹלָ֣ה לֹֽא רִפֵּאתֶ֗ם וְ/לַ/נִּשְׁבֶּ֨רֶת֙ לֹ֣א חֲבַשְׁתֶּ֔ם וְ/אֶת הַ/נִּדַּ֨חַת֙ לֹ֣א הֲשֵׁבֹתֶ֔ם וְ/אֶת הָ/אֹבֶ֖דֶת לֹ֣א בִקַּשְׁתֶּ֑ם וּ/בְ/חָזְקָ֛ה רְדִיתֶ֥ם אֹתָ֖/ם וּ/בְ/פָֽרֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/004.yaml
  text: You have not strengthened the weak[a], and you have not healed the sick, and you have not bound up the broken, and you have not brought back the strayed, and you have not sought the lost[c][b]; but with force and with harshness you have ruled them.
translation:
  language: ru
  text: Ослабевших вы не укрепляли[a], больных не исцеляли, покалеченных не перевязывали, отбившихся не возвращали[b], потерявшихся не искали, а властвовали над ними силой и жестокостью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занемогших». Еврейское слово может обозначать как слабость, так и болезнь; «ослабевших» здесь отличает их от больных в следующей фразе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отогнанных». Еврейское слово может подчёркивать, что овец прогнали или рассеяли, а не только то, что они сами отбились от стада.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «беспощадностью». Еврейское слово обозначает суровое, сокрушительное обращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּחְלוֹת
  choice: ослабевших
  rationale: Форма от חלה может обозначать болезненность или слабость. «Ослабевших» сохраняет связь с חִזַּקְתֶּם («укрепляли») и отличает эту группу от прямо названных далее больных.
- source_word: חִזַּקְתֶּם
  choice: укрепляли
  rationale: Порода piel глагола חזק означает «укреплять, делать сильным»; сочетание «укреплять ослабевших» естественно передаёт смысл и риторический контраст.
- source_word: הַחוֹלָה
  choice: больных
  rationale: Причастная форма от חלה здесь прямо обозначает больных; это позволяет сохранить различие с предшествующими ослабевшими.
- source_word: רִפֵּאתֶם
  choice: исцеляли
  rationale: רפא — обычный глагол со значением исцеления. «Исцеляли» уместно и в буквальном пастушеском образе, и в его переносном применении к народу.
- source_word: לַנִּשְׁבֶּרֶת
  choice: покалеченных
  rationale: Пассивная форма от שבר буквально указывает на сломанных. В русском применительно к овцам «покалеченных» естественно выражает телесное повреждение, не устраняя яркости образа.
- source_word: חֲבַשְׁתֶּם
  choice: перевязывали
  rationale: В лечебном и пастушеском контексте חבש означает перевязывать повреждение или накладывать повязку.
- source_word: הַנִּדַּחַת
  choice: отбившихся
  rationale: נדח может указывать как на удаление или изгнание, так и на состояние оказавшейся в стороне овцы. «Отбившихся» естественно в пастушеском образе, а возможность значения «отогнанных» сохранена в примечании.
- source_word: הֲשֵׁבֹתֶם
  choice: возвращали
  rationale: Hiphil от שוב означает побудить вернуться, возвратить; русский переходный глагол точно передаёт это значение.
- source_word: הָאֹבֶדֶת
  choice: потерявшихся
  rationale: Причастие от אבד в пастушеском контексте обозначает потерянных овец. Возвратная форма естественна по-русски и не смешивает их с отбившимися в предыдущей фразе.
- source_word: בִקַּשְׁתֶּם
  choice: искали
  rationale: בקש означает искать; несовершенный вид согласуется с повторяющимся описанием того, чего пастыри не делали.
- source_word: וּבְחָזְקָה
  choice: силой
  rationale: Оборот обозначает принудительный характер власти. «Силой» передаёт принуждение, не добавляя обязательного оттенка физического насилия.
- source_word: רְדִיתֶם
  choice: властвовали над ними
  rationale: רדה означает властвовать, господствовать. Отрицательная оценка выражена следующими обстоятельствами, как и в еврейском тексте.
- source_word: וּבְפָרֶךְ
  choice: и жестокостью
  rationale: פָרֶךְ обозначает суровое, сокрушительное, беспощадное обращение. Существительное «жестокостью» сохраняет параллельную конструкцию с «силой».
theological_decisions:
- issue: Пастушеская метафора как описание руководителей народа
  choice: Сохранить последовательность характеристик овец — ослабевшие, больные, покалеченные, отбившиеся и потерявшиеся — без замены их прямой политической интерпретацией.
  alternative: Передать стих непосредственно как обвинение правителей в пренебрежении различными группами людей.
  rationale: Контекст главы сам раскрывает метафорическое обвинение пастырей Израиля. Сохранение образа поддерживает пророческую выразительность и связи с другими библейскими текстами о пастырях.
- issue: Источник отрицательной силы последней фразы
  choice: Оставить глагол «властвовали», а угнетение выразить словами «силой и жестокостью».
  alternative: Передать одним усиленным глаголом, например «жестоко подавляли».
  rationale: В еврейском тексте отрицательная характеристика заключена прежде всего в двух предложных оборотах, а не в самом глаголе רדה. Выбранная конструкция сохраняет эту структуру и не усиливает смысл произвольно.
- issue: Грамматическое число обобщённых обозначений овец
  choice: Использовать множественное число, естественное для современного русского перечисления групп.
  alternative: 'Сохранять еврейское единственное число: «ослабевшую… больную… покалеченную».'
  rationale: Еврейские формы единственного числа имеют обобщающее значение. Русское множественное число ясно передаёт ту же совокупную отнесённость и избегает искусственной цепочки субстантивированных форм женского рода.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повторяющееся «не» и последовательность пастырских обязанностей сохранены; союз «а» ясно вводит контраст последней части. Лексика понятна широкому читателю и не привязана к конфессиональной терминологии.
