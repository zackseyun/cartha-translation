lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: Я спасу
  rationale: Каузативная форма глагола ישׁע обозначает избавление стада от опасности и притеснения. «Спасу» естественно по-русски и сохраняет как непосредственный смысл избавления, так и богословскую весомость выражения.
- source_word: לְצֹאנִי
  choice: Своё стадо
  rationale: צֹאן — собирательное обозначение мелкого скота; в пастушеском образе русское «стадо» передаёт его естественно. Возвратное «Своё» ясно указывает на принадлежность стада говорящему.
- source_word: וְלֹא תִהְיֶינָה עוֹד לָבַז
  choice: и оно больше не будет добычей
  rationale: Оборот буквально означает, что стадо больше не будет отдано на разграбление или в добычу. «Не будет добычей» сохраняет образ уязвимости перед нападающими и звучит естественно в современном русском языке.
- source_word: וְשָׁפַטְתִּי
  choice: Я рассужу
  rationale: Глагол שׁפט здесь описывает судебное действие Бога, который разбирает дело и проводит различие внутри стада. «Рассужу» сохраняет юридический смысл и хорошо сочетается с конструкцией «между… и…».
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: между овцой и овцой
  rationale: Еврейская конструкция употребляет существительное в единственном числе дистрибутивно и повторяет его. Буквальное повторение сохраняет риторическую форму и подчёркивает суд между отдельными членами одного стада.
theological_decisions:
- issue: Язык Божьего избавления в пастушеском образе
  choice: Я спасу Своё стадо
  alternative: Я избавлю Своё стадо; Я выручу Своё стадо
  rationale: «Спасу» передаёт Бога как непосредственного совершителя избавления, сохраняя богословскую значимость слова и не привнося в стих более поздних доктринальных уточнений.
- issue: Характер Божьего суда внутри стада
  choice: Я рассужу между овцой и овцой
  alternative: Я рассужу между одной овцой и другой
  rationale: 'Формулировка сохраняет напряжение текста: Бог не только спасает стадо от внешней угрозы, но и вершит суд между теми, кто находится внутри него. Повторение исходного выражения не сводит этот суд к общему управлению.'
