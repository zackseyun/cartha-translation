base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/005.yaml
  text: So they were scattered for lack of a shepherd[a], and they became food for every beast of the field, and they were scattered.
translation:
  language: ru
  text: И рассеялись они, потому что не было пастуха; стали пищей для всякого дикого зверя и рассеялись.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּפוּצֶינָה
  choice: рассеялись
  rationale: Глагол פוץ здесь описывает разбревшееся, рассеянное стадо. Возвратная форма естественна по-русски и передаёт непереходное значение; повтор глагола в конце стиха сохранён.
- source_word: מִבְּלִי רֹעֶה
  choice: потому что не было пастуха
  rationale: מִבְּלִי выражает отсутствие с причинным оттенком. Такая формулировка ясна современному читателю и сохраняет образ пастуха.
- source_word: וַתִּהְיֶינָה לְאָכְלָה
  choice: стали пищей
  rationale: היה указывает на наступившее состояние, а אָכְלָה — на то, что служит пищей. «Стали пищей» точно и естественно передаёт сочетание.
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: для всякого дикого зверя
  rationale: חַיַּת הַשָּׂדֶה буквально обозначает зверя поля, то есть дикого зверя. Единственное число после כָל передано распределительным «всякого».
theological_decisions:
- issue: Образ пастуха как обозначение руководителя народа
  choice: сохранить слово «пастух» без поясняющей замены
  alternative: вождь; руководитель
  rationale: В Иезекииле 34 образ пастухов и стада последовательно развёрнут и несёт богословскую и пророческую нагрузку; замена на прямое обозначение руководителя устранила бы метафору.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской образности и намеренного повтора. Точка с запятой разделяет причину рассеяния и его следствие, не нарушая связности стиха.
