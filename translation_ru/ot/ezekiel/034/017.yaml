  text: וְ/אַתֵּ֣נָה צֹאנִ֔/י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י שֹׁפֵט֙ בֵּֽין שֶׂ֣ה לָ/שֶׂ֔ה לָ/אֵילִ֖ים וְ/לָ/עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/017.yaml
  text: 'And as for you[a], my flock, thus says the Lord GOD: Behold, I am judging between sheep and sheep, between the rams and the male goats.'
translation:
  language: ru
  text: 'А вы, Моё стадо, — так говорит Владыка Яхве: вот, Я сужу между одной овцой и другой, между баранами и козлами.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: А вы
  rationale: Вынесенное вперёд самостоятельное местоимение отмечает переход к прямому обращению к стаду; «А вы» естественно передаёт смену адресата.
- source_word: צֹאנִי
  choice: Моё стадо
  rationale: Собирательное существительное с суффиксом первого лица в пастушеском контексте естественно передаётся словом «стадо».
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Устоявшаяся и близкая к форме древнееврейского текста передача пророческой вестнической формулы.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и не создаёт неестественного повтора «Господь ГОСПОДЬ».
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Частица подчёркивает торжественное самопредъявление говорящего; «вот» сохраняет её указательную и эмфатическую силу.
- source_word: שֹׁפֵט
  choice: сужу
  rationale: Причастие обозначает совершаемое или предстоящее как уже начатое действие; русское настоящее время сохраняет эту аспектуальную открытость.
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: между одной овцой и другой
  rationale: 'Повтор существительного в единственном числе имеет распределительный смысл: Бог различает отдельных животных внутри стада. Такая формулировка ясна по-русски и не сужает שֶׂה до самки как биологического пола.'
- source_word: לָאֵילִים
  choice: между баранами
  rationale: אֵילִים буквально означает баранов; животный образ следует сохранить, не заменяя его толкованием «сильные».
- source_word: וְלָעַתּוּדִים
  choice: и козлами
  rationale: עַתּוּדִים обозначает козлов, то есть самцов коз; русское «козлы» точно и естественно.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранная передача различает титул אֲדֹנָי и личное имя יהוה, сохраняя явное присутствие имени в исходном тексте и избегая конфессионального истолкования.
- issue: Характер суда внутри стада
  choice: между одной овцой и другой
  alternative: между овцой и овцой
  rationale: Распределительный смысл еврейского оборота передан без уточнения критерия суда; богословское напряжение раскрывается последующим контекстом, а не добавлением толкования в этот стих.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет резкую смену адресата и торжественное «вот», но избегает архаизмов. Заглавная буква в «Моё» отражает непосредственное обращение Бога и принятый русский библейский регистр.
