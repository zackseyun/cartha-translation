  source_fidelity: 'Текст точно передаёт структуру и смысл еврейского стиха: вынесенное обращение к стаду, пророческую формулу, титул אֲדֹנָי יְהוִה, эмфатическое הִנְנִי, настоящее/имминентное значение שֹׁפֵט и два объекта различения. «Между одной овцой и другой» корректно раскрывает распределительное значение בֵּין שֶׂה לָשֶׂה, не добавляя критерия суда.'
