  terminology: «Владыка Яхве» последовательно различает титул אֲדֹנָי и личное имя יהוה и согласуется с указанным решением передавать тетраграмматон как «Яхве». «Стадо», «бараны» и «козлы» сохраняют образный ряд оригинала. Хотя «овца» в строгом зоологическом употреблении может обозначать самку, в данном русском контексте она обычно функционирует как обычное обозначение животного в стаде и не создаёт существенного смыслового сужения.
