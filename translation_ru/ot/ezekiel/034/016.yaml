base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/016.yaml
  text: I will seek the lost[a], and I will bring back the strayed, and I will bind up the injured, and I will strengthen the sick; but the fat and the strong I will destroy. I will shepherd them with justice.
translation:
  language: ru
  text: Потерявшуюся овцу Я отыщу, отбившуюся верну, раненую перевяжу, больную укреплю; а откормленную и сильную уничтожу. Я буду пасти их по справедливости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду кормить их по справедливости»; или: «буду водить их на пастбище по справедливости». Еврейский глагол может означать «пасти», «кормить» или «водить на пастбище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹבֶדֶת
  choice: потерявшуюся овцу
  rationale: Причастие женского рода единственного числа относится к овце. Явное «овцу» делает образ понятным вне более широкого контекста, а «потерявшуюся» естественно передаёт אבד.
- source_word: אֲבַקֵּשׁ
  choice: отыщу
  rationale: בקש означает искать, разыскивать. Будущее совершенного вида «отыщу» естественно выражает обещание довести поиск до результата.
- source_word: הַנִּדַּחַת
  choice: отбившуюся
  rationale: נדח может обозначать отогнанную, рассеянную или сбившуюся с пути. В пастушеском образе «отбившуюся» звучит естественно и не исключает того, что овца могла быть отогнана.
- source_word: אָשִׁיב
  choice: верну
  rationale: Каузативная форма שוב означает вернуть, привести назад; краткое «верну» точно соответствует пастушескому контексту.
- source_word: לַנִּשְׁבֶּרֶת
  choice: раненую
  rationale: Буквально слово означает «сломленную, с переломом». В сочетании с перевязыванием «раненую» естественно передаёт телесное повреждение.
- source_word: אֶחֱבֹשׁ
  choice: перевяжу
  rationale: חבש здесь означает наложить повязку на повреждение. «Перевяжу» ясно и современно передаёт действие.
- source_word: הַחוֹלָה
  choice: больную
  rationale: חלה обозначает болезнь или немощь; «больную» сохраняет прямой смысл и отличие от сильной овцы.
- source_word: אֲחַזֵּק
  choice: укреплю
  rationale: Интенсивная форма חזק означает укрепить, придать сил. «Укреплю» сохраняет восстановительный смысл и словесную связь с последующим «сильную».
- source_word: הַשְּׁמֵנָה
  choice: откормленную
  rationale: Буквально «жирную». «Откормленную» сохраняет образ чрезмерно упитанной овцы и его социально-нравственную остроту, но по-русски звучит естественнее применительно к стаду.
- source_word: הַחֲזָקָה
  choice: сильную
  rationale: Прилагательное חזק прямо означает «сильная» и противопоставляет привилегированную овцу больной и раненой.
- source_word: אַשְׁמִיד
  choice: уничтожу
  rationale: Каузативная форма שמד выражает решительное уничтожение. Русское «уничтожу» сохраняет силу суда без усиления сверх исходного текста.
- source_word: אֶרְעֶנָּה
  choice: буду пасти их
  rationale: רעה может означать пасти, кормить или быть пастырем. «Буду пасти их» сохраняет широкий пастушеский образ и естественно сочетается со стадом.
- source_word: בְמִשְׁפָּט
  choice: по справедливости
  rationale: משפט включает суд, правосудие и справедливый порядок. «По справедливости» передаёт принцип Божьего пастырского управления, не сводя его только к наказанию.
theological_decisions:
- issue: Сочетание заботы о слабых и суда над сильными в заключительной части стиха
  choice: «уничтожу. Я буду пасти их по справедливости»
  alternative: «уничтожу; буду кормить их по суду»
  rationale: Текст намеренно соединяет восстановление уязвимых овец с судебным действием против откормленных и сильных. Формулировка сохраняет это напряжение и не сводит משפט ни только к карательному приговору, ни к общей доброжелательности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Последовательность коротких глагольных обещаний сохраняет ритм еврейского текста; пастушеская метафора остаётся явной. Сноска поставлена при глаголе «пасти», к которому относится лексическая неоднозначность.
