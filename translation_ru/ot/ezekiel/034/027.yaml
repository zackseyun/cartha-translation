base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/027.yaml
  text: The tree of the field will give its fruit[a], and the land will give its produce, and they will be secure on their land. Then they will know that I am Yahweh, when I break the bars of their yoke and deliver them from the hand of those who enslaved them.
translation:
  language: ru
  text: Деревья в поле дадут свои плоды, и земля даст свой урожай. Они будут в безопасности на своей земле и узнают, что Я — Яхве, когда Я сломаю брусья их ярма и избавлю их от руки тех, кто поработил их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто заставлял их служить»; возможно также: «тех, кто принуждал их к труду». Образ сломанного ярма поддерживает перевод «поработил их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵץ הַשָּׂדֶה
  choice: полевые деревья
  rationale: Единственное число в еврейском имеет собирательное значение. Русское множественное число естественно передаёт растительность в целом и согласуется с местоимением «свои».
- source_word: יְבוּלָהּ
  choice: свой урожай
  rationale: יְבוּל обозначает урожай, плодородный прирост или произведение земли; «урожай» ясно и естественно в земледельческом контексте.
- source_word: וְהָיוּ עַל אַדְמָתָם לָבֶטַח
  choice: будут жить безопасно на своей земле
  rationale: Глагол буквально означает «будут», но по-русски в сочетании с местом и безопасностью требуется естественное уточнение «жить»; לָבֶטַח передано как «безопасно».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, а не замещающий его титул.
- source_word: מֹטוֹת עֻלָּם
  choice: перекладины их ярма
  rationale: מֹטוֹת — брусья или перекладины; сочетание сохраняет образ ярма как орудия угнетения.
- source_word: וְהִצַּלְתִּים מִיַּד
  choice: избавлю их от руки
  rationale: Сохранён понятный библейский образ руки как власти и контроля.
- source_word: הָעֹבְדִים בָּהֶם
  choice: тех, кто поработил их
  rationale: Причастие от עבד с предлогом ב допускает буквальные варианты, связанные с принуждением к труду или служению; образ сломанного ярма указывает здесь на порабощение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя в принятой научной русской транслитерации.
- issue: Степень угнетения в הָעֹבְדִים בָּהֶם
  choice: тех, кто поработил их
  alternative: тех, кто заставлял их служить; тех, кто использовал их как работников
  rationale: Непосредственный образ разрушенного ярма поддерживает сильное значение, однако возможная более буквальная передача отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образы ярма и руки; синтаксис разделён на два предложения для ясности.
