  text: בֶּן אָדָ֕ם הִנָּבֵ֖א עַל רוֹעֵ֣י יִשְׂרָאֵ֑ל הִנָּבֵ֣א וְ/אָמַרְתָּ֩ אֲלֵי/הֶ֨ם לָ/רֹעִ֜ים כֹּ֥ה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה ה֤וֹי רֹעֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֤ר הָיוּ֙ רֹעִ֣ים אוֹתָ֔/ם הֲ/ל֣וֹא הַ/צֹּ֔אן יִרְע֖וּ הָ/רֹעִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/002.yaml
  text: 'Son of man[a], prophesy against the shepherds of Israel; prophesy and say to them, to the shepherds[b], ‘Thus says the Lord GOD: Woe to the shepherds of Israel who have been shepherding themselves! Should not the shepherds shepherd the flock?’'
translation:
  language: ru
  text: 'Сын человеческий, пророчествуй против пастырей Израиля; пророчествуй и скажи им, пастырям: «Так говорит Владыка Яхве: горе пастырям Израиля, которые пасут самих себя![a] Не стадо ли должны пасти пастыри?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кормят самих себя». Здесь употреблён тот же еврейский глагол, что и далее о выпасе стада; смысл в том, что руководители Израиля заботятся о себе, а не о стаде.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Не овец ли должны пасти пастыри?» Еврейское слово имеет собирательное значение и обозначает мелкий скот, то есть стадо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Сын человеческий
  rationale: Сохраняет характерную для Иезекииля еврейскую форму обращения и её единственное число; в современном русском звучит возвышенно, но понятно.
- source_word: הִנָּבֵא ... הִנָּבֵא
  choice: пророчествуй ... пророчествуй
  rationale: Передаёт повелительную форму и сохраняет намеренный повтор исходного текста.
- source_word: עַל
  choice: против
  rationale: Последующее провозглашение горя показывает, что пророчество направлено против пастырей как суд, а не просто касается их.
- source_word: רוֹעֵי יִשְׂרָאֵל / לָרֹעִים / הָרֹעִים
  choice: пастыри Израиля / пастырям / пастыри
  rationale: Сохраняет развёрнутый образ пастырей и стада; слово «руководители» истолковало бы метафору вместо её передачи.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Так говорит Владыка Яхве
  rationale: «Владыка» различает אֲדֹנָי и личное имя יהוה, переданное как «Яхве», без неестественного сочетания «Господь Господь».
- source_word: הוֹי
  choice: горе
  rationale: Естественная русская формула пророческого обличения и предстоящего суда.
- source_word: אֲשֶׁר הָיוּ רֹעִים אוֹתָם
  choice: которые пасли самих себя
  rationale: Возвратное местоимение относится к самим пастырям. Формулировка сохраняет повтор корня רעה и обличает их своекорыстную заботу о себе.
- source_word: הֲלוֹא
  choice: Не ... ли должны
  rationale: Передаёт риторический вопрос, ожидающий утвердительного ответа, и его обличительную силу.
- source_word: הַצֹּאן
  choice: стадо
  rationale: Передаёт собирательное значение слова о мелком скоте и естественно сочетается в русском с глаголом «пасти».
- source_word: יִרְעוּ
  choice: пасти
  rationale: Сохраняет лексическую связь с обозначением пастырей и допускает как значение кормления, так и более широкое значение попечения о стаде.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Передача личного имени как «Яхве» отличает его от титула אֲדֹנָי и сохраняет исходное различие между двумя элементами формулы, не создавая повтора «Господь Господь».
- issue: Следует ли раскрывать пастырскую метафору как указание на руководителей Израиля
  choice: Сохранить «пастыри» и «стадо» в основном тексте
  alternative: руководители Израиля и народ
  rationale: Исходный текст намеренно строит обличение на цельной пастырской метафоре; её прямое истолкование обеднило бы литературный и богословский смысл.
- issue: Смысл выражения «пасли самих себя»
  choice: Сохранить буквальный метафорический парадокс
  alternative: кормили самих себя; заботились только о себе
  rationale: Еврейский текст повторяет один и тот же пастырский глагол. Буквальная передача сохраняет словесную связь и напряжение между обязанностью пасти стадо и своекорыстием пастырей.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены обращение «Сын человеческий», повтор «пророчествуй», пастырская метафора и риторический вопрос. Архаизирующее «пастыри» выбрано осознанно ради устойчивого библейского образа и различения с буквальными «пастухами»; остальной синтаксис остаётся доступным современному читателю.
