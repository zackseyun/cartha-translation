  text: לָ/כֵ֣ן רֹעִ֔ים שִׁמְע֖וּ אֶת דְּבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/007.yaml
  text: 'Therefore[a], shepherds, hear the word of Yahweh:'
translation:
  language: ru
  text: 'Поэтому, пастыри, слушайте слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «יהוה» (YHWH), тетраграмматон; традиционно передаётся как «Господь».'
    reason: Указывает написание имени в оригинале, его научную транслитерацию и традиционный вариант передачи.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего обличения и сохраняет явную связь с контекстом.
- source_word: רֹעִים
  choice: пастыри
  rationale: Сохраняет центральную для главы метафору пастухов как руководителей Израиля; «пастыри» естественно звучит в возвышенной пророческой речи и не сводит образ к церковной должности.
- source_word: שִׁמְעוּ
  choice: выслушайте
  rationale: Передаёт повелительную форму множественного числа и призыв внимательно принять последующее слово; по-русски естественно сочетается с прямым дополнением «слово».
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель определённого прямого дополнения, не имеющий самостоятельного русского соответствия.
- source_word: דְּבַר
  choice: слово
  rationale: Сохраняет обычную пророческую формулу и более прозрачно передаёт еврейское דָּבָר, чем интерпретирующее «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом «Господь».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон. «Яхве» сохраняет личное заветное имя и наиболее вероятное современное научное прочтение, тогда как «Господь» является традиционной заменой, а «Иегова» — поздней гибридной формой.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение «пастыри» сохраняет образность главы, а «выслушайте слово» звучит естественно и торжественно. Маркер сноски поставлен непосредственно после имени, к которому относится примечание.
