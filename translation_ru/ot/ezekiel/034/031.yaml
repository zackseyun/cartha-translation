base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/031.yaml
  text: And you[a], my flock, the flock of my pasture—you are men, and I am your God, declares the Lord GOD.
translation:
  language: ru
  text: А вы, стадо Моё, стадо Моего пастбища — люди[a]. Я — ваш Бог, — возвещает Владыка ГОСПОДЬ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческие существа»; еврейское адам здесь обозначает людей в противоположность образному «стаду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּן
  choice: А вы
  rationale: Союз и вынесенное вперёд местоимение вводят прямое обращение с оттенком противопоставления; «А вы» естественно передаёт эту функцию по-русски.
- source_word: צֹאנִי
  choice: стадо Моё
  rationale: Собирательное существительное обозначает овец как стадо и сохраняет пастушескую метафору всей главы.
- source_word: צֹאן מַרְעִיתִי
  choice: стадо Моего пастбища
  rationale: Сохранены приложное повторение и образ пастбища без смыслового сжатия.
- source_word: אָדָם אַתֶּם
  choice: вы — люди
  rationale: Именная фраза кратко и подчёркнуто раскрывает, что названное стадом сообщество в действительности состоит из людей. Русское «люди» точно передаёт здесь собирательное значение אָדָם.
- source_word: אֲנִי אֱלֹהֵיכֶם
  choice: Я — ваш Бог
  rationale: Естественная русская форма заветного утверждения, сохраняющая личное и относительное значение суффикса «ваш».
- source_word: נְאֻם
  choice: говорит
  rationale: Устойчивая и ясная передача пророческой формулы, указывающей на источник изречения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: «Владыка» передаёт אֲדֹנָי, а написание «ГОСПОДЬ» обозначает личное имя יהוה и позволяет избежать неестественного повтора «Господь ГОСПОДЬ».
theological_decisions:
- issue: Значение אָדָם при завершении пастушеской метафоры
  choice: люди
  alternative: человек; человечество
  rationale: В данном контексте אָדָם противопоставляет образное «стадо» его реальному человеческому составу. Множественное «люди» согласуется с обращением «вы», не ограничивает речь мужчинами и не превращает конкретных адресатов в отвлечённое «человечество».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Тире подчёркивают две краткие именные фразы. Метафора и приложное повторение исходного текста сохранены; местоимение «вы» естественно не выражает отмеченную в древнееврейском смену грамматического рода.
