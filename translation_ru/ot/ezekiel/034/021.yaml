  text: Because you push with side and shoulder, and gore all the weak ones with your horns until you have scattered them outside,
translation:
  language: ru
  text: За то, что вы толкаете боком и плечом и бодаете своими рогами всех слабых, пока не разогнали их прочь,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצַד וּבְכָתֵף
  choice: боком и плечом
  rationale: Сохраняет конкретный образ животных, которые теснят слабых телом.
- source_word: תֶּהְדֹּפוּ
  choice: толкаете
  rationale: Передаёт продолжающееся притеснение внутри пастушеской метафоры.
- source_word: הַנַּחְלוֹת
  choice: ослабевших
  rationale: Форма обозначает слабых или немощных животных; субстантивированное причастие сохраняет этот смысл без добавления отсутствующего в стихе существительного.
- source_word: הֲפִיצוֹתֶם
  choice: разгоните
  rationale: В данном образе речь о насильственном рассеянии стада; «разгоните» естественно передаёт причинное действие.
- source_word: אֶל־הַחוּצָה
  choice: прочь
  rationale: Передаёт движение наружу, за пределы безопасного места, естественным русским выражением.
theological_decisions:
- issue: Адресаты обвинения и образ слабых овец
  choice: Сохранено прямое «вы» и метафорическое описание без поясняющей вставки.
  alternative: Уточнить в тексте, что сильные овцы притесняют слабых.
  rationale: Контекст проясняет участников, а сам стих не называет их прямо; вставка сняла бы образную сжатость и добавила толкование.
translation_notes:
  register: Современный литературный русский язык; сохранены пастушеская образность, обвинительный тон и синтаксическая незавершённость стиха, продолжающегося в следующем предложении.
