  text: וּ/צְבִ֤י עֶדְי/וֹ֙ לְ/גָא֣וֹן שָׂמָ֔/הוּ וְ/צַלְמֵ֧י תוֹעֲבֹתָ֛/ם שִׁקּוּצֵי/הֶ֖ם עָ֣שׂוּ ב֑/וֹ עַל כֵּ֛ן נְתַתִּ֥י/ו לָ/הֶ֖ם לְ/נִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/020.yaml
  text: And they made the beauty of his ornament into pride[a], and in it they made the images of their abominations, their detestable things[b]; therefore I have made it an unclean thing to them.
translation:
  language: ru
  text: И красоту его убранства они превратили в предмет гордости, а в нём[a] изготовили изображения своих мерзостей — свои отвратительные вещи. Поэтому Я сделал его для них чем-то нечистым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из него изготовили». Еврейское выражение может указывать либо на место, либо на материал или средство.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово связано с ритуальной нечистотой; возможный перевод: «чем-то отверженным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבִי עֶדְיוֹ
  choice: И красоту его убранства
  rationale: צְבִי обозначает красоту или великолепие, а עֲדִי — украшение, убранство. «Убранство» сохраняет собирательный и достаточно широкий смысл, не сводя выражение только к драгоценностям.
- source_word: לְגָאוֹן שָׂמָהוּ
  choice: они превратили в предмет гордости
  rationale: גָּאוֹן может означать величие или гордость; в контексте осуждения идолопоклонства уместен отрицательный смысл. «Превратили в предмет гордости» естественно передаёт результативную функцию לְ. Множественное число следует ближайшему смысловому контексту и последующему עָשׂוּ, хотя форма שָׂמָהוּ сама по себе имеет единственное число.
- source_word: וְצַלְמֵי תוֹעֲבֹתָם שִׁקּוּצֵיהֶם
  choice: изображения своих мерзостей — своих отвратительных идолов
  rationale: צֶלֶם — «изображение», а תּוֹעֵבָה и שִׁקּוּץ обозначают мерзость, особенно идольскую. Тире передаёт пояснительное соотношение выражений; «идолы» делает понятным их предметный характер, явный в данном контексте.
- source_word: עָשׂוּ בוֹ
  choice: в нём изготовили
  rationale: Предлог בְּ может указывать как на место, так и на материал или средство. Основной текст сохраняет буквальное «в нём», а другая возможность отмечена в сноске.
- source_word: עַל כֵּן נְתַתִּיו לָהֶם לְנִדָּה
  choice: Поэтому Я сделал его для них нечистотой
  rationale: נָתַן с последующим именным сказуемым здесь имеет смысл «сделать, обратить во что-либо». נִדָּה сохраняет оттенок ритуальной нечистоты и отверженности.
theological_decisions:
- issue: Характер нечистоты в слове לְנִדָּה
  choice: нечистотой
  alternative: чем-то отверженным; скверной
  rationale: «Нечистота» сохраняет культовый и нравственный оттенок слова, не ограничивая его только общим понятием отвержения.
- issue: Референт и число действующего лица в שָׂמָהוּ
  choice: они превратили
  alternative: он превратил; оно стало для них предметом гордости
  rationale: Вокруг стиха народ описан во множественном числе, и следующая форма עָשׂוּ также множественная. Перевод следует смысловой связи, не определяя «он» как Бога и не внося тем самым дополнительного богословского утверждения; грамматическая особенность отмечена в лексическом обосновании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Начальный союз сохранён. Прописная «Я» обозначает речь Бога. Местоименные связи и неоднозначность предлога בְּ сохранены без конфессионального уточнения.
