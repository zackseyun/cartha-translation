base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/003.yaml
  text: Now the end is upon you[a], and I will send my anger against you. I will judge you according to your ways, and I will bring all your abominations upon you.
translation:
  language: ru
  text: Теперь конец настал для тебя. Я пошлю на тебя мой гнев, буду судить тебя по твоим путям и обращу на тебя все твои мерзости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положу (возложу) на тебя все твои мерзости»; это выражение означает, что на тебя будут обращены последствия твоих мерзостей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: теперь
  rationale: Передаёт временную безотлагательность пророческого объявления современным и естественным русским словом.
- source_word: הַקֵּץ עָלַיִךְ
  choice: настал тебе конец
  rationale: Сохраняет определённость и решительность выражения «конец» и естественно передаёт еврейскую именную конструкцию «конец на тебе» без привнесения поздней эсхатологической терминологии.
- source_word: וְשִׁלַּחְתִּי אַפִּי בָּךְ
  choice: Я пошлю на тебя Мой гнев
  rationale: Глагол «пошлю» близок к прямому значению שלח, а «гнев» передаёт идиоматический смысл אַף; предлог «на» естественно выражает направленность суда.
- source_word: וּשְׁפַטְתִּיךְ
  choice: буду судить тебя
  rationale: Прямо сохраняет судебный характер глагола и согласуется с продолженным будущим действием после «Я пошлю».
- source_word: כִּדְרָכָיִךְ
  choice: по твоим путям
  rationale: Сохраняет характерную пророческую метафору путей как образа поведения, понятную в данном контексте.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבֹתָיִךְ
  choice: и воздам тебе за все твои мерзости
  rationale: Естественно по-русски выражает карательный смысл оборота «положу на тебя», то есть обращение последствий мерзостей на виновного; буквальная образность отмечена в сноске.
- source_word: תּוֹעֲבֹתָיִךְ
  choice: твои мерзости
  rationale: «Мерзости» сохраняет сильную нравственную и культовую окраску еврейского слова и традиционную весомость пророческой речи.
theological_decisions:
- issue: Характер «конца»
  choice: Историко-пророческое возвещение близкого и решительного суда, переданное как «настал тебе конец».
  alternative: Понимать выражение как техническое обозначение окончательного космического конца.
  rationale: Ближайший контекст говорит о надвигающемся суде над землёй и Иерусалимом; перевод сохраняет абсолютную силу слова, но не навязывает более позднюю эсхатологическую схему.
- issue: Смысл воздаяния за мерзости
  choice: 'Передать оборот как наступление заслуженных последствий: «воздам тебе за все твои мерзости».'
  alternative: 'Буквально: «возложу на тебя все твои мерзости».'
  rationale: Еврейская формулировка сохраняет напряжение между самими мерзостями и их последствиями. Основной текст передаёт естественный в контексте смысл суда, а сноска сохраняет буквальный образ и возможную формальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и напряжённый; сохранены судебная лексика и метафора «путей», при этом избегнуты как разговорная формула «тебе конец» без глагола, так и излишне архаичное «ныне».
