base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/027.yaml
  text: The king will mourn[a], and the prince will clothe himself with desolation, and the hands of the people of the land will tremble. According to their way I will deal with them, and by their own judgments I will judge them[c][b]. Then they will know that I am Yahweh.
translation:
  language: ru
  text: Царь будет скорбеть, князь облачится в ужас[a], а руки жителей страны задрожат[b]. Я поступлю с ними по их поступкам и буду судить их по их судебным решениям[c]. И узнают они, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облачится в опустошение». Еврейское слово может обозначать ужас, оцепенение или опустошение после разорения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «руки народа земли». Это еврейское выражение может обозначать население страны, простой народ; образ рук передаёт страх и неспособность действовать.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «буду судить их по их судам». Еврейское слово может означать судебные решения, нормы правосудия или мерки, проявившиеся в их собственном суде.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ יִתְאַבָּל
  choice: Царь будет скорбеть
  rationale: Глагол обозначает скорбь и траур; «будет скорбеть» кратко и естественно передаёт смысл.
- source_word: וְנָשִׂיא
  choice: князь
  rationale: נָשִׂיא обозначает высокопоставленного правителя или вождя; «князь» сохраняет официальный титул и отличает его от царя.
- source_word: יִלְבַּשׁ שְׁמָמָה
  choice: облечётся в опустошение
  rationale: Сохранена выразительная метафора облачения. שְׁמָמָה может обозначать опустошение, оцепенелый ужас или состояние потрясённости.
- source_word: וִידֵי עַם הָאָרֶץ תִּבָּהַלְנָה
  choice: руки народа страны задрожат
  rationale: «Руки» сохранены как образ силы и способности действовать; «задрожат» естественно выражает страх и смятение, передаваемые формой תִּבָּהַלְנָה.
- source_word: מִדַּרְכָּם אֶעֱשֶׂה אוֹתָם
  choice: Я поступлю с ними по их пути
  rationale: Сохранён образ пути как образа поведения и подчёркнуто воздаяние, соответствующее их образу жизни.
- source_word: וּבְמִשְׁפְּטֵיהֶם אֶשְׁפְּטֵם
  choice: буду судить их по их судам
  rationale: 'Намеренно сохранена неоднозначность מִשְׁפָּט: это могут быть судебные решения, нормы суда или основания приговора.'
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: И узнают они, что Я — Яхве
  rationale: Сохранена характерная для Иезекииля формула узнавания и союз «и»; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Смысл суда «по их судам»
  choice: Сохранить формально-смысловую неоднозначность
  alternative: «судить их по их же меркам» или «согласно заслуженному ими приговору»
  rationale: Еврейская формулировка допускает связь как с их собственными судебными практиками и мерками, так и с соответствующим им судом; основной текст не закрепляет лишь одно толкование.
- issue: Связь заключительной формулы с предшествующим судом
  choice: И узнают они
  alternative: Тогда они узнают
  rationale: Союз ו может иметь последовательный или результативный оттенок, но буквальное «и» сохраняет связь, не делая причинно-следственное значение более явным, чем в оригинале.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образы облачения, рук и пути сохранены; неясность заключительной судебной формулы пояснена в сноске, но не устранена в основном тексте.
