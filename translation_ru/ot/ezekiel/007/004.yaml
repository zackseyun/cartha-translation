  text: וְ/לֹא תָח֥וֹס עֵינִ֛/י עָלַ֖יִ/ךְ וְ/לֹ֣א אֶחְמ֑וֹל כִּ֣י דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/004.yaml
  text: My eye will not spare you[a], nor will I have pity; for I will bring your ways upon you, and your abominations will be within you[b]. Then you will know that I am Yahweh.
translation:
  language: ru
  text: Мой глаз не пощадит тебя[a], и Я не сжалюсь, потому что Я возложу на тебя твои пути, и твои мерзости будут посреди тебя[b]. Тогда вы узнаете, что Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой глаз не посмотрит на тебя с состраданием». В еврейском употреблён оборот со словом «глаз», выражающий пощаду или сострадание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут внутри тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: Мой глаз не пощадит тебя
  rationale: 'Сохранён еврейский образ с «глазом»: сочетание חוס с עין выражает отсутствие пощады или сострадания. В русском оно звучит возвышенно и уместно для пророческой речи.'
- source_word: אֶחְמֹל
  choice: и Я не сжалюсь
  rationale: Глагол חמל передан отдельно от חוס, чтобы сохранить риторическое удвоение и оттенок жалости, не сводя оба выражения к одному глаголу.
- source_word: דְרָכַיִךְ
  choice: твои пути
  rationale: Слово דרך обозначает здесь образ жизни и поступки. «Пути» сохраняет исходную метафору и характерную для пророческой речи лексику.
- source_word: עָלַיִךְ אֶתֵּן
  choice: Я обращу против тебя
  rationale: Буквально оборот говорит о возложении путей на адресата. Выбранная формулировка передаёт смысл воздаяния, при котором собственные пути человека оборачиваются против него, не добавляя прямо отсутствующего в тексте глагола «накажу».
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: и твои мерзости
  rationale: «Мерзости» сохраняет сильную нравственную и культовую окраску תועבות, часто относящегося к отвратительным, в том числе идолопоклонническим, деяниям.
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: будут посреди тебя
  rationale: Передано пространственное значение תוך без уточнения, относятся ли слова к присутствию самих мерзостей, их следов или их последствий.
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: '«Тогда» естественно выражает результирующую связь: вслед за судом наступит признание. Сохранён переход от женского единственного числа в обращении к форме множественного числа.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, чтобы сохранить форму и функцию Божьего имени в исходном тексте.
theological_decisions:
- issue: Формула Божьего суда и воздаяния
  choice: Я обращу против тебя твои пути
  alternative: Я накажу тебя за твои пути
  rationale: 'В еврейском тексте наказание выражено образно: Бог помещает пути адресата на него самого. Перевод сохраняет эту идею обратного действия собственных поступков и не вводит отсутствующий в оригинале глагол «накажу».'
- issue: Переход от единственного числа к множественному
  choice: тебя … вы узнаете
  alternative: тебя … ты узнаешь
  rationale: Масоретский текст сначала обращается к городу в женском единственном числе, а затем употребляет множественное число וִידַעְתֶּם. Переход сохранён как значимая особенность текста, вероятно расширяющая обращение к жителям.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого регистра. Образы «глаз», «пути» и «мерзости» оставлены ради смысловой и стилистической близости к еврейскому тексту; синтаксис слегка упорядочен для естественного русского чтения.
