lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит новый пророческий эпизод; «И было» естественно сочетается в русском с устойчивой библейской формулой «слово…» и сохраняет структуру оригинала без архаичного «и случилось».
- source_word: דְבַר
  choice: слово
  rationale: В формуле דְבַר־יְהוָה слово «слово» сохраняет устойчивую связь с пророческим откровением; «весть» возможно, но менее буквально.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте и не заменяет имя титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с местоименным суффиксом первого лица прямо означает направление речи к пророку; «ко мне» — естественная русская форма.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говорить» вводит содержание речи, которое следует в следующем стихе. В современном русском эту функцию естественно и без потери смысла выражает двоеточие, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя YHWH. «Яхве» сохраняет имя, тогда как традиционное «Господь» передаёт его титулом; традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Двоеточие естественно вводит продолжение речи в следующем стихе; маркер сноски поставлен непосредственно после имени.
