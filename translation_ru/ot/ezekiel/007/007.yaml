base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/007.yaml
  text: Doom has come upon you[a], inhabitant of the land. The time has come; the day is near—panic[b], and not joyful shouting on the mountains.
translation:
  language: ru
  text: Пришла к тебе погибель[a], житель этой земли! Пришло время, близок день — смятение, а не радостные крики в горах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пришёл к тебе поворот»; возможно также: «Настал твой рок». Еврейское слово редкое, и его значение не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смятение, а не эхо в горах». Последняя часть стиха трудна для понимания; многие видят здесь противопоставление смятения обычным радостным крикам, раздававшимся в горах, возможно во время сбора урожая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִירָה
  choice: погибель
  rationale: Редкое и трудное слово. В контексте возвещения суда и в параллели с «пришло время» оно, вероятнее всего, обозначает наступивший роковой исход; «погибель» естественно передаёт это по-русски, тогда как буквальная возможность «поворот» сохраняется в примечании.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: житель этой земли
  rationale: Форма единственного числа служит прямым обращением. Указательное «этой» естественно обозначает страну, к которой обращён пророк, и не расширяет значение до всей земли как мира.
- source_word: הָעֵת
  choice: время
  rationale: Прямой и естественный эквивалент, не добавляющий отсутствующего в самом слове значения «назначенное».
- source_word: קָרוֹב הַיּוֹם
  choice: близок день
  rationale: Сохраняет краткость, торжественность и подчёркнутую близость дня.
- source_word: מְהוּמָה
  choice: смятение
  rationale: Передаёт вызванные судом тревогу, беспорядок и растерянность, не сужая значение исключительно до внутренней паники или внешнего шума.
- source_word: הֵד
  choice: радостные крики
  rationale: Контекст допускает понимание слова как праздничного возгласа, противопоставленного смятению суда. Поскольку буквально возможно «эхо», трудность отмечена в сноске.
- source_word: הָרִים
  choice: горы
  rationale: Обычный русский эквивалент; сохраняет образ мест, где могли раздаваться праздничные возгласы.
