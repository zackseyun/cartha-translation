base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/016.yaml
  text: And their survivors will escape and be on the mountains[a], like doves of the valleys, all of them moaning[c][b], each one in his iniquity.
translation:
  language: ru
  text: И те из них, кому удастся спастись, будут в горах, подобно голубям долин[a]. Все они будут стонать[b], каждый — в своём беззаконии[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голубям ущелий». Еврейское слово может обозначать долины, овраги или ущелья.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «издавать глухой жалобный звук», «ворковать». Еврейский глагол обозначает низкий, протяжный звук, который в этом контексте выражает скорбь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «каждый — из-за своей вины»; возможно также: «из-за своего наказания». Еврейское слово может означать беззаконие, вину или последствие вины.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָלְטוּ
  choice: спасутся
  rationale: Глагол פלט означает избавление от опасности, бегство или спасение. «Спасутся» естественно передаёт результат, не уточняя способ избавления.
- source_word: פְּלִיטֵיהֶם
  choice: уцелевшие из них
  rationale: Существительное обозначает тех, кто избежал бедствия. Этот вариант передаёт смысл оставшихся в живых и не выдвигает на первый план бегство.
- source_word: וְהָיוּ אֶל־הֶהָרִים
  choice: и будут в горах
  rationale: 'Буквально: «и будут к/на горах». В контексте выражение указывает на местонахождение уцелевших; перевод не добавляет явно не выраженного движения.'
- source_word: כְּיוֹנֵי הַגֵּאָיוֹת
  choice: подобно голубям долин
  rationale: Сравнение связывает уцелевших с голубями, обитающими в долинах или ущельях, вероятно подчёркивая их жалобный голос и укрытие в труднодоступных местах. «Долин» доступно для современного читателя, а топографическая альтернатива дана в сноске.
- source_word: כֻּלָּם הֹמוֹת
  choice: все они будут стонать
  rationale: Форма от המה обозначает низкий, глухой звук — гул, воркование, стон. В контексте суда «стонать» передаёт скорбь, тогда как звуковой оттенок сохраняется в сноске.
- source_word: אִישׁ
  choice: каждый
  rationale: 'Слово употреблено дистрибутивно: речь идёт о каждом из уцелевших. «Каждый» естественно передаёт этот смысл.'
- source_word: בַּעֲוֺנוֹ
  choice: в своём беззаконии
  rationale: עָוֹן может означать беззаконие, вину либо последствие вины — наказание. Формулировка с «в» сохраняет широту еврейского выражения и его связь как с проступком, так и с виновностью.
theological_decisions:
- issue: Смысл עָוֹן в контексте суда
  choice: «в своём беззаконии» — без окончательного разграничения между проступком и состоянием виновности
  alternative: «из-за своей вины» или «из-за своего наказания»
  rationale: Еврейское слово допускает значение греха, вины и кары как последствия греха. Основной текст сохраняет эту богословскую напряжённость, а не сводит выражение только к причине скорби или только к наказанию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого круга читателей; образ голубей и неоднозначность заключительного выражения сохранены. Все маркеры сносок размещены непосредственно при соответствующих словам.
