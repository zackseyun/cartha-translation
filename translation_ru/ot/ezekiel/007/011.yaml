base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/011.yaml
  text: Violence has arisen into a rod of wickedness[a]; none of them remains, none of their multitude, none of their wealth[b], and there is no eminence among them.
translation:
  language: ru
  text: 'Насилие поднялось как жезл нечестия[a]. Ничего не останется: ни от них, ни от их множества, ни от их богатства[b]; не будет среди них и величия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский предлог допускает также оттенок результата: «Насилие поднялось в жезл нечестия».'
    reason: alternative_reading
  - marker: b
    text: 'Еврейские выражения во второй половине стиха эллиптичны и местами неясны. Более буквально: «не из них, и не из их множества, и не из их изобилия/шума». Слово, переданное как «богатство», может означать «изобилие» или «смятение, шум», а «величие» — «превосходство»; последнюю фразу понимают и иначе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָמָס
  choice: Насилие
  rationale: Слово חָמָס обозначает насилие, злодеяние или насильственную несправедливость. Начальная позиция и отсутствие добавочного определения сохраняют резкое, почти олицетворённое звучание.
- source_word: קָם
  choice: поднялось
  rationale: Форма глагола קום передаёт возникновение или восстание; «поднялось» сохраняет образ и естественно звучит по-русски.
- source_word: לְמַטֵּה רֶשַׁע
  choice: став жезлом нечестия
  rationale: מַטֶּה значит «жезл, посох»; в контексте суда это образ орудия господства или наказания. Оборот со «став» естественно передаёт возможное результирующее значение לְ, не устраняя образа.
- source_word: לֹא מֵהֶם
  choice: никого из них не останется
  rationale: В еврейском тексте стоит эллиптическое «не из них». Глагол «останется» восполняет подразумеваемый смысл в контексте всеобщего суда, не добавляя нового участника или действия.
- source_word: וְלֹא מֵהֲמוֹנָם
  choice: ни их множества
  rationale: הָמוֹן может обозначать множество, толпу, изобилие или шум. «Множество» лучше всего продолжает мысль об исчезновении людей, при этом иные оттенки отмечены в сноске.
- source_word: וְלֹא מֶהֱמֵהֶם
  choice: ни их богатства
  rationale: 'Форма трудна и допускает значения «изобилие», «богатство» или «смятение/шум». «Богатство» создаёт осмысленную последовательность: сами люди, их множество и достояние; неуверенность отражена в сноске.'
- source_word: וְלֹא נֹהַּ בָּהֶם
  choice: и не будет среди них величия
  rationale: נֹהַּ — редкое и неясное слово. «Величие» передаёт возможное значение выдающегося положения или превосходства, а лексическая неопределённость прямо указана в сноске.
theological_decisions:
- issue: Эллиптические и лексически неясные выражения в пророчестве о суде
  choice: Передать строку как возвещение о том, что насилие стало жезлом нечестия и что от людей, их множества, богатства и величия ничего не останется.
  alternative: 'Сохранить почти дословную, но малопонятную последовательность: «не из них, и не из их множества, и не из их изобилия/шума; и нет величия среди них».'
  rationale: Контекст Иезекииля 7 поддерживает мысль о полном опустошении, однако сам стих крайне эллиптичен. В основном тексте восполнен только необходимый для русского синтаксиса глагол «останется», а реальные лексические альтернативы сохранены в сносках без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого суда. «Жезл» сохраняет библейский образ без архаизации всего стиха; тире делает эллиптическое перечисление понятным обычному читателю.
