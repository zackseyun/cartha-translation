id: EZK.7.15
reference: Ezekiel 7:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/חֶ֣רֶב בַּ/ח֔וּץ וְ/הַ/דֶּ֥בֶר וְ/הָ/רָעָ֖ב מִ/בָּ֑יִת אֲשֶׁ֤ר בַּ/שָּׂדֶה֙ בַּ/חֶ֣רֶב יָמ֔וּת וַ/אֲשֶׁ֣ר בָּ/עִ֔יר רָעָ֥ב וָ/דֶ֖בֶר יֹאכֲלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/015.yaml
  text: The sword is outside[a], and pestilence and famine are inside. Whoever is in the field will die by the sword, and whoever is in the city[b], famine and pestilence will consume him.
translation:
  language: ru
  text: Меч — снаружи, а мор и голод — внутри. Кто в поле, тот умрёт от меча, а кто в городе — того пожрут[a] голод и мор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «съедят его». Голод и мор представлены как пожирающие человека силы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  choice: меч
  rationale: Сохраняет конкретный образ насильственной смерти и традиционную пророческую триаду бедствий.
- source_word: בַּחוּץ
  choice: снаружи
  rationale: Передаёт пространственное противопоставление מִבָּיִת — «внутри».
- source_word: הַדֶּבֶר
  choice: мор
  rationale: В библейско-пророческом контексте обозначает губительную эпидемию; это краткий, точный и стилистически возвышенный русский эквивалент.
- source_word: הָרָעָב
  choice: голод
  rationale: Здесь означает массовый недостаток пищи и гибель от него, а не только личное чувство голода.
- source_word: מִבָּיִת
  choice: внутри
  rationale: Наречное значение соответствует противопоставлению «снаружи»; добавление «дома» не требуется.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: кто в поле
  rationale: Естественно передаёт распределительную конструкцию единственного числа и противопоставление городу.
- source_word: בַּחֶרֶב יָמוּת
  choice: тот умрёт от меча
  rationale: Следует буквальному глаголу «умрёт», не уточняя действующее лицо.
- source_word: וַאֲשֶׁר בָּעִיר
  choice: а кто в городе
  rationale: Сохраняет параллелизм с «кто в поле» и распределительное единственное число.
- source_word: רָעָב וָדֶבֶר
  choice: голод и мор
  rationale: Сохраняет порядок слов во второй половине стиха, не унифицируя его с первой.
- source_word: יֹאכֲלֶנּוּ
  choice: того пожрут
  rationale: Сохраняет яркую персонифицирующую метафору еврейского глагола «есть, пожирать» и мужское единственное число суффикса.
theological_decisions:
- issue: Триада орудий суда
  choice: Сохранить конкретные образы «меч… мор… голод» без истолковывающего расширения.
  alternative: Передать обобщённо как войну, болезнь и лишения.
  rationale: Конкретная формула несёт литературную и богословскую силу пророческого возвещения суда.
- issue: Распределительное единственное число
  choice: Передать конструкцией «кто… тот/того».
  alternative: Употребить множественное число «те… их».
  rationale: Так сохраняются грамматическое единственное число оригинала и личная направленность угрозы.
- issue: Метафора אָכַל
  choice: Сохранить её как «пожрут».
  alternative: Ослабить до «погубят» или «истребят».
  rationale: Оригинал персонифицирует голод и мор; буквальная метафора понятна по-русски и не должна быть молча устранена.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Тире подчёркивают пространственный и синтаксический параллелизм. Слово «мор» несколько возвышенно, но понятно и уместно для стандартной пророческой формулы.
