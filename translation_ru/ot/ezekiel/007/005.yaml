  text: 'Так говорит Владыка Яхве: «Беда[a], одна беда — вот, она приходит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Беда, одна-единственная беда». В еврейском тексте слово «беда» повторено для усиления, а «одна» может подчёркивать единичность или исключительность бедствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула; настоящее время естественно вводит провозглашаемое Божье слово, хотя אָמַר морфологически имеет форму перфекта.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» сохраняет личное заветное имя יְהוִה и не создаёт повтора «Господь Господь».
- source_word: רָעָה
  choice: беда
  rationale: В контексте суда слово обозначает губительное бедствие, а не нравственное зло. «Беда» сохраняет краткость и резкость еврейского возгласа.
- source_word: רָעָה אַחַת רָעָה
  choice: Беда, одна-единственная беда
  rationale: Сохранён повтор רָעָה и явно передано אַחַת («одна»). Сочетание «одна-единственная» естественно по-русски выражает возможный оттенок исключительности, не скрывая буквального значения числительного.
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт указательность, внезапность и настойчивость пророческого предупреждения.
- source_word: בָאָה
  choice: она приходит
  rationale: Женский род согласован с רָעָה; настоящее время передаёт начавшееся или неотвратимо близкое наступление бедствия.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул и собственное имя Бога, прямо присутствующее в еврейском тексте, не подменяя его конфессионально привычным обозначением.
- issue: Значение רָעָה в речи о Божьем суде
  choice: беда
  alternative: зло; бедствие
  rationale: Контекст говорит о наступающей катастрофе как суде, а не приписывает Богу нравственное зло. При этом резкая и широкая семантика исходного слова не превращена в узкоспециальный термин.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Краткость, повтор и восклицательная настойчивость исходной строки сохранены; архаическое «се» заменено естественным «вот».
