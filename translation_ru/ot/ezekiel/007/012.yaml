base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/012.yaml
  text: The time has come[a]; the day has arrived. Let not the buyer rejoice, and let not the seller mourn[b], for wrath is against all her multitude.
translation:
  language: ru
  text: Пришло время, настал день. Пусть покупатель не радуется и продавец не скорбит, ибо гнев обрушился на всё её население[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на всё её богатство», если הֲמוֹנָהּ понимается как изобилие или имущество, а не множество людей. Местоимение «её» сохраняет женский род еврейского текста; вероятно, речь идёт об олицетворённых земле, городе или общине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא הָעֵת
  choice: Пришло время
  rationale: Перфект בָּא возвещает решительно наступившую реальность; естественная русская формула сохраняет краткость и торжественность.
- source_word: הִגִּיעַ הַיּוֹם
  choice: настал день
  rationale: Глагол הִגִּיעַ буквально передаёт достижение или прибытие; «настал» естественно выражает наступление решающего дня и сохраняет параллелизм.
- source_word: הַקּוֹנֶה
  choice: покупающий
  rationale: Субстантивированное причастие обозначает человека, совершающего покупку; причастная форма сохраняет актуальный, типовой характер действия.
- source_word: אַל יִשְׂמָח
  choice: пусть ... не радуется
  rationale: Сочетание אַל с имперфектом имеет запретительно-юссивный оттенок, который точно и естественно передаётся этой конструкцией.
- source_word: הַמּוֹכֵר
  choice: продающий
  rationale: Субстантивированное причастие передано параллельно הַקּוֹנֶה.
- source_word: אַל יִתְאַבָּל
  choice: пусть ... не скорбит
  rationale: Глагол означает скорбеть или оплакивать; «скорбит» уместно передаёт сожаление продавца об утрате имущества.
- source_word: חָרוֹן
  choice: ярость
  rationale: Слово обозначает пылающий гнев; «ярость» сохраняет интенсивность образа и соответствует контексту суда.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: против всего её множества
  rationale: אֶל в контексте суда означает направленность против кого-либо; כָּל охватывает всё обозначенное собирательным существительным, а женский суффикс сохранён.
theological_decisions:
- issue: Референт женского суффикса в הֲמוֹנָהּ
  choice: Сохранить женское местоимение «её», не уточняя в основном тексте, относится ли оно к земле, городу или общине.
  alternative: «его множество» либо явное указание «множество жителей земли/города»
  rationale: Еврейский текст использует суффикс женского рода и оставляет его антецедент контекстуальным. Такое решение сохраняет персонификацию и не устраняет подлинную неоднозначность.
- issue: Значение הָמוֹן
  choice: множество
  alternative: богатство, достояние
  rationale: В данном контексте суда над всей общностью значение «множество людей» вероятнее, однако значение изобилия или имущества лексически возможно и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой краткостью. Параллелизм первых двух фраз и противопоставление покупающего и продающего сохранены; архаизмы по возможности исключены.
