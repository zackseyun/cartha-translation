  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם כֹּה אָמַ֞ר אֲדֹנָ֧/י יְהוִ֛ה לְ/אַדְמַ֥ת יִשְׂרָאֵ֖ל קֵ֑ץ בָּ֣א הַ/קֵּ֔ץ עַל ארבעת כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/002.yaml
  text: 'And you[a], son of man, thus says the Lord GOD to the land of Israel: An end! The end has come upon the four corners of the land.'
translation:
  language: ru
  text: 'А ты, сын человеческий, вот что говорит Владыка Яхве земле Израиля: «Конец! Конец пришёл ко всем четырём краям земли[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко всем четырём краям всей земли». Еврейский оборот может обозначать как крайние пределы определённой земли — здесь земли Израиля, — так и, в более широком контексте, всю землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет характерную для книги Иезекииля форму обращения, её образность и мужской род; выражение понятно в современном литературном русском благодаря библейской традиции.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента составного божественного титула: אֲדֹנָי как «Владыка» и личное имя יהוה как «Яхве», не создавая неестественного повтора «Господь Господь».'
- source_word: לְאַדְמַת יִשְׂרָאֵל
  choice: земле Израиля
  rationale: Предлог לְ обозначает адресата пророчества, а אַדְמָה здесь естественно передаётся словом «земля»; вариант «против земли» сильнее истолковывает направленность суда.
- source_word: קֵץ
  choice: Конец!
  rationale: Краткое отдельное восклицание сохраняет резкость и emphатический характер еврейского именного возгласа без добавления отсутствующего в русском артикля.
- source_word: בָּא הַקֵּץ
  choice: Пришёл конец
  rationale: Прошедшее время передаёт перфект и пророческую уверенность в наступлении возвещённого конца, сохраняя повтор слова «конец».
- source_word: אַרְבַּעַת כַּנְפוֹת הָאָרֶץ
  choice: четыре края земли
  rationale: כָּנָף буквально означает «крыло», а в данном обороте — «край, оконечность». «Четыре края» сохраняет еврейский образ и выражает полноту охвата; слово הָאָרֶץ допускает как местное значение земли Израиля, так и более широкое значение всей земли.
theological_decisions:
- issue: Передача имени יהוה в составном титуле אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант прямо сохраняет личное имя Бога и одновременно передаёт титул אֲדֹנָי, не подменяя сочетание двумя нарицательными титулами.
- issue: Объём значения הָאָרֶץ в заключительной фразе
  choice: земли
  alternative: мира; страны
  rationale: Ближайший контекст указывает прежде всего на землю Израиля, однако еврейское слово может иметь и более широкий смысл. Русское «земли» сохраняет эту смысловую открытость, а примечание явно сообщает альтернативу.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Краткие фразы и повтор слова «конец» сохраняют резкость оригинала; архаизирующие формы, кроме укоренившегося обращения «сын человеческий», не используются.
