lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Указательная частица настойчиво привлекает внимание; повтор сохранён ради пророческой выразительности.
- source_word: הַיּוֹם
  choice: день
  rationale: Буквальное соответствие сохраняет зловещую, но не разъяснённую в самом стихе отсылку к наступающему дню.
- source_word: בָאָה
  choice: он наступает
  rationale: Перфект в пророческом провозглашении передаёт близость и несомненность события; настоящее время естественно выражает это по-русски.
- source_word: יָצְאָה
  choice: уже вышла
  rationale: Сохранён основной образ глагола «выходить» и результирующая сила совершенного вида; «уже» подчёркивает, что объявленное бедствие выступило в действие.
- source_word: הַצְּפִרָה
  choice: погибель
  rationale: Редкое и спорное слово в контексте Иезекииля 7, вероятнее всего, обозначает роковой исход или наступившую беду. Вариант «утро» сохранён в сноске.
- source_word: צָץ
  choice: пустил почки
  rationale: Передан растительный образ и начальная стадия роста, образующая параллель с последующим цветением.
- source_word: הַמַּטֶּה
  choice: жезл
  rationale: «Жезл» сохраняет возможные оттенки орудия удара, власти и суда, не сужая образ до обычного посоха.
- source_word: פָּרַח
  choice: расцвело
  rationale: Сохранена метафора бурного роста в параллели с жезлом, пустившим почки.
- source_word: הַזָּדוֹן
  choice: высокомерие
  rationale: Слово обозначает гордую, дерзкую самонадеянность; «высокомерие» ясно передаёт нравственный смысл в современном литературном русском языке.
theological_decisions:
- issue: Значение הַצְּפִרָה в пророчестве о суде
  choice: В основном тексте — «погибель»
  alternative: «утро» или «роковой поворот»
  rationale: Контекст возвещает близкий суд, поэтому «погибель» естественно передаёт наиболее вероятный контекстуальный смысл. Поскольку еврейское слово редкое и допускает иное понимание, буквальная альтернатива не устранена, а приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым пророческим ритмом. Повтор «вот» и растительная метафора сохранены; спорное слово не истолковано без оговорки.
