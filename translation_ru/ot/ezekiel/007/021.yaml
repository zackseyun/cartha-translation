  yaml_path: translation/ot/ezekiel/007/021.yaml
  text: And I will give it into the hand of foreigners for plunder[a], and to the wicked of the earth for spoil[b], and they will profane it.
translation:
  language: ru
  text: Я отдам его в руки чужеземцев на разграбление и нечестивцам земли[a] — как добычу; они осквернят его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечестивцам страны». Еврейское слово может означать и «землю», и «страну».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «обесчестят его», «лишат его святости». Еврейский глагол означает обращение со священным как с чем-то несвятым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיו
  choice: Я отдам это
  rationale: Форма נתן с суффиксом объекта выражает пророческое действие Бога. «Отдам» естественно передаёт передачу во власть других, а нейтральное «это» не навязывает в отдельном стихе род подразумеваемого предмета.
- source_word: בְּיַד הַזָּרִים
  choice: в руки чужеземцев
  rationale: Сохраняется еврейская идиома передачи в чью-либо власть; «чужеземцы» ясно обозначает внешних по отношению к народу захватчиков.
- source_word: לָבַז
  choice: на разграбление
  rationale: בַּז означает добычу, захваченную силой; оборот передаёт значение цели или результата и естественно звучит по-русски.
- source_word: וּלְרִשְׁעֵי הָאָרֶץ
  choice: а нечестивцам земли
  rationale: רְשָׁעִים — нечестивые, злодеи; הָאָרֶץ допускает значения «земля» и «страна». В основном тексте сохранено более широкое «земли», а контекстуально возможное «страны» вынесено в сноску.
- source_word: לְשָׁלָל
  choice: как добычу
  rationale: שָׁלָל близко по значению к בַּז. Иное русское выражение сохраняет параллелизм, не превращая оба существительных в дословный повтор.
- source_word: וְחִלְּלוּהָ
  choice: и они осквернят святыню
  rationale: Порода piel глагола חלל обозначает лишение священного его святости, профанацию. «Осквернят» естественно и сохраняет сакральный смысл; слово «святыню» эксплицирует подразумеваемый святой объект и позволяет естественно передать местоименный суффикс.
theological_decisions:
- issue: Значение חלל в контексте святости
  choice: осквернят святыню
  alternative: обесчестят её; лишат её святости
  rationale: Выбор сохраняет характерное для Иезекииля противопоставление святости и её поругания, не сводя действие лишь к физическому загрязнению.
- issue: Объём значения הָאָרֶץ
  choice: земли
  alternative: страны
  rationale: Еврейское слово может обозначать как землю вообще, так и конкретную страну. Основной текст не сужает значение, а сноска сохраняет контекстуально возможное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены параллелизм двух обозначений грабежа и богословская сила лексики святости; неоднозначность הָאָרֶץ отмечена в сноске.
