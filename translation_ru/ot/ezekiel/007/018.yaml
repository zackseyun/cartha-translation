  verdict: approve
  source_fidelity: 'Текст точно передаёт четыре параллельных образа еврейского оригинала: опоясывание траурным рубищем, охватывающий ужас, стыд на лицах и плешь на головах. «Ужас» обоснованно сохраняет широкий смысл פַלָּצוּת («ужас, оцепенение, сильный страх») и соответствует английской аудиторской линии “horror”.'
  naturalness: Фраза звучит естественно на современном литературном русском и сохраняет сжатый пророческий параллелизм. «Опояшутся рубищем» и тире в заключительной части стилистически уместны.
  terminology: «Рубище» — понятная современному читателю передача траурной одежды из грубой ткани; она не требует архаичного «вретище». «Плешь» точно сохраняет названное в оригинале состояние, не добавляя действия обривания или его мотивировки.
