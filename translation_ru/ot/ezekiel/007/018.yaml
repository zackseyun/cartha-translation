  text: וְ/חָגְר֣וּ שַׂקִּ֔ים וְ/כִסְּתָ֥ה אוֹתָ֖/ם פַּלָּצ֑וּת וְ/אֶ֤ל כָּל פָּנִים֙ בּוּשָׁ֔ה וּ/בְ/כָל רָאשֵׁי/הֶ֖ם קָרְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/018.yaml
  text: They will put on sackcloth, and horror will cover them; shame will be on every face, and baldness on all their heads.
translation:
  language: ru
  text: Они опояшутся рубищем, и ужас охватит их; на каждом лице будет стыд, и на всех головах — плешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָגְרוּ שַׂקִּים
  choice: Они опояшутся рубищем
  rationale: Глагол חגר означает «опоясываться», а שַׂקִּים — грубую ткань или одежду из неё, носимую в знак скорби. «Рубище» естественно и кратко передаёт здесь траурную одежду.
- source_word: פַלָּצוּת
  choice: ужас
  rationale: Редкое существительное обозначает сильный страх, содрогание или оцепеняющий ужас. Контекст бедствия поддерживает широкое и выразительное «ужас», не сужая смысл до одного телесного проявления.
- source_word: וְאֶל כָּל פָּנִים בּוּשָׁה
  choice: на каждом лице будет стыд
  rationale: Предлог אֶל в этой конструкции естественно передаётся как «на»; единственное собирательное כָּל פָּנִים по-русски идиоматично выражено как «каждом лице».
- source_word: וּבְכָל רָאשֵׁיהֶם קָרְחָה
  choice: и на всех головах — плешь
  rationale: קָרְחָה означает облысение или выбритую плешь, здесь как внешний знак скорби. «Плешь» сохраняет конкретный образ исходного текста.
theological_decisions:
- issue: Значение облысения как знака скорби
  choice: Сохранить буквальный образ без пояснения в основном тексте
  alternative: Передать как «они обреют головы в знак скорби»
  rationale: Исходный текст называет состояние — «плешь на головах», но прямо не указывает действие и его цель; развёрнутая передача добавила бы толкование.
translation_notes:
  register: Современный литературный русский с возвышенной библейской сжатостью. Параллелизм четырёх бедственных образов сохранён; тире в последней части естественно восполняет подразумеваемую связку.
