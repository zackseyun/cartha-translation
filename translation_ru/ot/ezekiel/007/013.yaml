base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/013.yaml
  text: For the seller will not return to what was sold[a], though they are still alive; for the vision concerning all its multitude will not turn back[e][d][c][b], and no one will strengthen his life in his iniquity.
translation:
  language: ru
  text: Ибо продавец не вернётся к проданному имуществу[a], даже если участники сделки ещё будут живы[b]; ибо видение обо всём её множестве[c] не будет отменено[d], и никто не укрепит свою жизнь своим беззаконием[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к продаже», то есть к проданному имуществу или владению.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пока ещё среди живых их жизнь». Это сжатое выражение, вероятно, означает, что продавец не получит проданное обратно, даже если участники сделки ещё будут живы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «против всего её множества». Предлог может указывать на направленность видения против всего населения, подлежащего суду.'
    reason: alternative_reading
  - marker: d
    text: 'Буквально: «не вернётся». Здесь, вероятно, имеется в виду, что возвещённый суд не будет обращён вспять или отозван.'
    reason: alternative_reading
  - marker: e
    text: 'Заключительная фраза на еврейском трудна. Вероятный смысл: никто не сможет обезопасить свою жизнь посредством своего беззакония. Возможно также: «никто не укрепит своей жизни в своём беззаконии».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹכֵר
  choice: продавший
  rationale: Субстантивированное действительное причастие; эта форма естественна по-русски и сохраняет конкретный образ продавца.
- source_word: אֶל הַמִּמְכָּר
  choice: к проданному
  rationale: Сохраняет неопределённость еврейского выражения между проданной вещью, владением и самой продажей, не добавляя прямо слова «земля».
- source_word: וְעוֹד בַּחַיִּים חַיָּתָם
  choice: хотя они ещё живы
  rationale: 'Передаёт смысл сжатого еврейского оборота: возвращения не произойдёт, даже если участники сделки останутся в живых.'
- source_word: חָזוֹן
  choice: видение
  rationale: Обычное обозначение пророческого откровения, сохраняющее лексику и регистр оригинала.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: обо всём её множестве
  rationale: אֶל может указывать на направленность или предмет видения; «обо» не усиливает враждебный оттенок, который остаётся возможным по контексту суда.
- source_word: לֹא יָשׁוּב
  choice: не будет отменено
  rationale: В отношении видения буквальное «не вернётся» по-русски неясно; контекстуальный смысл — объявленный приговор не будет обращён вспять или отозван.
- source_word: בַּעֲוֺנוֹ
  choice: своим беззаконием
  rationale: Предлог ב может обозначать средство или сферу; творительный передаёт вероятный смысл, что беззаконие не поможет сохранить жизнь, при сохранении альтернативы в примечании.
- source_word: חַיָּתוֹ לֹא יִתְחַזָּקוּ
  choice: никто не укрепит свою жизнь
  rationale: Сохраняет метафору укрепления и передаёт дистрибутивный смысл при трудном согласовании единственного אִישׁ с глаголом во множественном числе.
theological_decisions:
- issue: Смысл заключительной фразы о беззаконии и жизни
  choice: Никто не сможет укрепить или обезопасить свою жизнь посредством собственного беззакония.
  alternative: 'Никто, чья жизнь проходит в беззаконии, не укрепится; либо: они не укрепят своей жизни в своём беззаконии.'
  rationale: Синтаксис еврейской фразы труден, особенно из-за сочетания единственного אִישׁ с глаголом во множественном числе. Основной текст передаёт наиболее связный в контексте смысл, не превращая его в более позднюю догматическую формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет повтор «ибо» и судебную неотвратимость стиха; неясности еврейского текста отмечены в сносках, а не устранены скрытым толкованием.
