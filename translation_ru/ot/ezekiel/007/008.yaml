  text: עַתָּ֣ה מִ/קָּר֗וֹב אֶשְׁפּ֤וֹךְ חֲמָתִ/י֙ עָלַ֔יִ/ךְ וְ/כִלֵּיתִ֤י אַפִּ/י֙ בָּ֔/ךְ וּ/שְׁפַטְתִּ֖י/ךְ כִּ/דְרָכָ֑יִ/ךְ וְ/נָתַתִּ֣י עָלַ֔יִ/ךְ אֵ֖ת כָּל תּוֹעֲבוֹתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/008.yaml
  text: Now[a], soon I will pour out my wrath on you, and I will spend my anger against you; I will judge you according to your ways[b], and I will bring all your abominations upon you.
translation:
  language: ru
  text: Теперь, вскоре[a], Я изолью на тебя Мою ярость и дам Моему гневу до конца совершиться на тебе[b]. Я буду судить тебя по твоим путям и возложу на тебя все твои мерзости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в самое ближайшее время». Еврейское выражение указывает на близость надвигающегося суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доведу Мой гнев против тебя до конца». Еврейский оборот говорит о том, что гнев будет полностью осуществлён на адресате.'
    reason: idiom_clarification
lexical_decisions:
- source_word: עַתָּה מִקָּרוֹב
  choice: Теперь, уже скоро
  rationale: Сочетание временных выражений передаёт наступившую непосредственную близость суда. «Уже скоро» естественно звучит по-русски и не превращает מִקָּרוֹב в пространственное указание.
- source_word: אֶשְׁפּוֹךְ חֲמָתִי עָלַיִךְ
  choice: Я изолью на тебя Мою ярость
  rationale: Сохранена метафора излияния; «ярость» передаёт силу חֵמָה и позволяет отличить это слово от следующего אַף.
- source_word: וְכִלֵּיתִי אַפִּי בָּךְ
  choice: до конца обрушу на тебя Мой гнев
  rationale: Глагол כלה указывает на доведение действия до завершения, то есть гнев пройдёт весь свой ход. Формулировка естественна по-русски и сохраняет направленность гнева против адресата.
- source_word: וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ
  choice: Я буду судить тебя по твоим путям
  rationale: Сохранены судебный смысл שׁפט и пророческая метафора «путей» как образа поведения.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבוֹתָיִךְ
  choice: и возложу на тебя все твои мерзости
  rationale: «Возложу на тебя» близко передаёт נתן על в контексте суда, а «мерзости» сохраняет сильную нравственно-религиозную окраску תּוֹעֵבוֹת, особенно важную у Иезекииля.
theological_decisions:
- issue: Различение двух обозначений Божьего гнева
  choice: חֲמָה передано как «ярость», а אַף — как «гнев»
  alternative: Передать оба слова одним русским существительным либо оба перевести как «ярость»
  rationale: Разные русские слова сохраняют параллелизм и риторическое усиление еврейского текста, не приписывая словам искусственно строгих богословских различий.
- issue: Смысл возложения мерзостей на адресата
  choice: 'Сохранён образ: «возложу на тебя все твои мерзости»'
  alternative: Разъяснить как «воздам тебе за все твои мерзости» или «обращу против тебя последствия твоих мерзостей»
  rationale: Исходный текст выражается образно и не называет последствия прямо; буквальный, но понятный оборот сохраняет его напряжённость и не сужает смысл до одной интерпретации.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы. Сохранены метафоры «излить», «пути» и «возложить мерзости», если они остаются понятными без чрезмерной архаизации.
