  text: וַ/הֲסִבּוֹתִ֤י פָנַ/י֙ מֵ/הֶ֔ם וְ/חִלְּל֖וּ אֶת צְפוּנִ֑/י וּ/בָאוּ בָ֥/הּ פָּרִיצִ֖ים וְ/חִלְּלֽוּ/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/022.yaml
  text: I will turn my face away from them[a], and they will profane my treasured place[b]; violent men will enter it and profane it.
translation:
  language: ru
  text: Я отверну от них Моё лицо, и они осквернят Моё сокровенное место[a]; туда войдут люди, творящие насилие[b], и осквернят его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё сокровище», «Моё тайное место» или «Мою сокровенную святыню». Еврейское слово, вероятно, обозначает нечто ценное и оберегаемое, связанное со святилищем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «безжалостные люди» или «грабители».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִבּוֹתִי
  choice: Я отверну
  rationale: Хифиль глагола סבב в последовательности пророческого возвещения имеет здесь будущее значение. «Отверну» естественно сочетается с выражением «лицо от них».
- source_word: פָנַי מֵהֶם
  choice: от них Моё лицо
  rationale: Сохранён еврейский образ лица как выражения благоволения и внимания; предлог מ передан естественным русским оборотом «отвернуть лицо от».
- source_word: וְחִלְּלוּ
  choice: они осквернят
  rationale: Пиэль חלל обозначает лишение священного его неприкосновенности. «Осквернят» ясно передаёт противопоставление святости и поругания.
- source_word: צְפוּנִי
  choice: Моё сокровенное место
  rationale: Слово связано с тем, что скрыто, хранится и представляет ценность. Такой перевод сохраняет вероятную связь со святилищем, не отождествляя предмет слишком точно с храмом, сокровищницей или храмовыми ценностями.
- source_word: וּבָאוּ בָהּ
  choice: туда войдут
  rationale: Наречие «туда» естественно указывает на названное место и не заостряет внимание на несогласовании рода русского существительного с формой еврейского местоименного суффикса.
- source_word: פָּרִיצִים
  choice: люди, творящие насилие
  rationale: Слово обозначает жестоких, беззаконных и склонных к насилию людей. Описательный перевод избегает современного узкого значения слова «насильники» и не сужает смысл до грабежа.
- source_word: וְחִלְּלוּהָ
  choice: и осквернят его
  rationale: Повтор глагола חלל сохранён ради смыслового и риторического ударения оригинала.
theological_decisions:
- issue: К чему относятся צְפוּנִי и местоименные суффиксы
  choice: Ценное и охраняемое место, вероятно связанное со святилищем, передано как «Моё сокровенное место».
  alternative: «Моё сокровище», «Моя тайная обитель», «Моя сокровенная святыня» или конкретно храмовые сокровища.
  rationale: Контекст вторжения и осквернения указывает на священное пространство или предмет, однако краткая еврейская формулировка не определяет референт однозначно. Общий перевод сохраняет эту неопределённость и не превращает вероятное толкование в явное утверждение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены образ «отвернуть лицо», двукратное «осквернят» и неопределённость названия священного объекта. Оборот «люди, творящие насилие» выбран вместо двусмысленного в современном русском слова «насильники».
