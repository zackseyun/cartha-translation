source:
  edition: WLC
  text: וְ/הֵֽבֵאתִי֙ רָעֵ֣י גוֹיִ֔ם וְ/יָרְשׁ֖וּ אֶת בָּֽתֵּי/הֶ֑ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן עַזִּ֔ים וְ/נִחֲל֖וּ מְקַֽדְשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/024.yaml
  text: And I will bring the worst of the nations[a], and they will take possession of their houses. I will put an end to the pride of the strong[c][b], and their sanctuaries will be profaned.
translation:
  language: ru
  text: Я приведу худших из народов[a], и они завладеют их домами[b]. Я положу конец гордости сильных[c], и их святилища будут осквернены[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самых злых среди народов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «унаследуют их дома»; еврейский глагол может означать «наследовать», «владеть» или «лишать владения» — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «величию могущественных».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «их святые места будут лишены святости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Я приведу
  rationale: Порода hифиль глагола בוא с субъектом первого лица означает «я приведу». Направленность вражеских народов против жителей подразумевается контекстом.
- source_word: רָעֵי גוֹיִם
  choice: худших из народов
  rationale: 'Форма сопряжённого множественного числа רָעֵי в данном контексте имеет превосходное значение: речь идёт о самых злых или худших представителях народов. Выбранный вариант естественен по-русски и не сужает смысл до одного вида злодейства.'
- source_word: וְיָרְשׁוּ אֶת בָּתֵּיהֶם
  choice: и они завладеют их домами
  rationale: Глагол ירשׁ может означать наследование, вступление во владение или вытеснение прежних владельцев. В контексте нашествия «завладеют» ясно передаёт насильственное овладение домами.
- source_word: וְהִשְׁבַּתִּי
  choice: Я положу конец
  rationale: Hифиль от שׁבת выражает прекращение чего-либо по действию субъекта; русский оборот сохраняет каузативный смысл и звучит естественно.
- source_word: גְּאוֹן עַזִּים
  choice: гордости сильных
  rationale: גָּאוֹן охватывает значения гордости, возвышенности и величия, а עַזִּים обозначает сильных или могущественных. В контексте суда «гордость сильных» передаёт порицающий оттенок, не устраняя полностью возможную идею их величия.
- source_word: וְנִחֲלוּ
  choice: будут осквернены
  rationale: Нифаль глагола חלל имеет пассивное значение «быть осквернённым, лишённым святости». Форма множественного числа согласована со «святилищами».
- source_word: מְקַדְשֵׁיהֶם
  choice: их святилища
  rationale: Множественное число от מִקְדָּשׁ обозначает святилища или святые места; «святилища» кратко и точно сохраняет культовый смысл.
theological_decisions:
- issue: Оттенок значения גְּאוֹן в пророчестве о суде
  choice: гордость
  alternative: величие
  rationale: Контекст унижения и суда поддерживает отрицательный оттенок «гордость», однако примечание сохраняет возможность понимать слово как обозначение величия или могущества.
- issue: Смысл выражения וְנִחֲלוּ מְקַדְשֵׁיהֶם
  choice: их святилища будут осквернены
  alternative: их святые места будут лишены святости
  rationale: Пассивный культовый смысл наиболее естественен и передаёт тему поругания святыни, не уточняя, какие именно святилища имеются в виду.
translation_notes:
  register: Современный литературный русский язык; тон краткий, торжественный и соответствующий пророчеству о суде. Синтаксис сохраняет последовательность еврейских предложений, но избегает неестественных кальк. Лексические альтернативы вынесены в примечания там, где еврейский текст допускает значимую неоднозначность.
