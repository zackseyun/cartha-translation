base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/014.yaml
  text: They have blown the trumpet and made everything ready[a], but no one goes to battle[b], for my wrath is against all her multitude.
translation:
  language: ru
  text: Затрубили в трубу[a] и всё приготовили, но никто не идёт в бой, потому что Мой гнев обращён против всего её множества[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в рог», возможно, в бараний рог.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «против всего её богатства (изобилия)», если הֲמוֹנָהּ обозначает материальное достояние, а не множество людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקְעוּ
  choice: затрубили
  rationale: Глагол תקע при названии духового сигнального инструмента означает «трубить, подавать сигнал». Форма допускает совпадающие по виду повелительное и перфектное прочтения; в данном контексте последовательность уже совершённых приготовлений поддерживает прошедшее время.
- source_word: בַתָּקוֹעַ
  choice: в трубу
  rationale: Существительное обозначает сигнальный рог или трубу. «Труба» естественно звучит в современном русском описании военного сбора, а более буквальные варианты сохранены в сноске.
- source_word: וְהָכִין הַכֹּל
  choice: и всё приготовили
  rationale: Hiphil от כון передаёт подготовку или приведение в готовность; формулировка сохраняет всеохватность הַכֹּל и естественна по-русски.
- source_word: וְאֵין הֹלֵךְ
  choice: но никто не идёт
  rationale: Конструкция אֵין с причастием выражает отсутствие того, кто выходит; союз «но» ясно передаёт контраст между полной готовностью и отсутствием выступающих.
- source_word: לַמִּלְחָמָה
  choice: в бой
  rationale: מִלְחָמָה может означать войну или конкретное сражение. После сигнала к выступлению «в бой» кратко и естественно передаёт непосредственную военную ситуацию.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину того, что никто не выступает.
- source_word: חֲרוֹנִי
  choice: Мой гнев
  rationale: חָרוֹן обозначает пылающий, яростный гнев. «Гнев» сохраняет весомость выражения без избыточного усиления; местоименная принадлежность передана явно.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: против всего её множества
  rationale: הָמוֹן может обозначать множество людей, толпу, а также изобилие или богатство. Основной текст сохраняет коллективный смысл и женский суффикс, не уточняя неявный антецедент; материальное значение отмечено в сноске.
theological_decisions:
- issue: К чему относится женский суффикс в הֲמוֹנָהּ
  choice: Сохранено неопределённое «её», без называния города или земли.
  alternative: «множество жителей города» или «население земли»
  rationale: В еврейском тексте стоит суффикс женского рода единственного числа, но его непосредственный референт не назван достаточно ясно. Уточнение в основном тексте устранило бы подлинную неоднозначность.
- issue: Значение הֲמוֹנָהּ
  choice: «её множество» — совокупность людей
  alternative: «всё её богатство/изобилие»
  rationale: Военный контекст и всеобщий суд поддерживают значение множества людей, однако материальное значение слова лексически возможно и потому сохранено в сноске.
translation_notes:
  register: Современный литературный русский с кратким, торжественным ритмом. Настоящее время «не идёт» передаёт живой результат уже завершённой подготовки. Прописная буква в «Мой» указывает на речь Бога в соответствии с русской библейской издательской традицией, не добавляя имени в текст.
