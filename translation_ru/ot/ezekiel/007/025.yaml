  text: קְפָ֖דָה בָ֑א וּ/בִקְשׁ֥וּ שָׁל֖וֹם וָ/אָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/025.yaml
  text: Anguish has come[a], and they will seek peace, but there is none.
translation:
  language: ru
  text: Пришла беда[a]; они будут искать мира, но его не будет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пришёл ужас», «Пришло бедствие» или «Пришла мучительная тревога». Редкое еврейское существительное может подчёркивать как сам ужас, так и бедственное состояние, вызванное судом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְפָדָה
  choice: беда
  rationale: Редкое существительное в контексте суда обозначает тяжёлое бедствие и связанный с ним ужас. «Беда» естественно и ёмко передаёт наступившее гибельное положение, а возможные оттенки ужаса и мучительной тревоги сохранены в примечании.
- source_word: בָא
  choice: пришла
  rationale: Форма qatal в пророческом провозглашении представляет суд как уже наступивший; прошедшее время «пришла» сохраняет эту силу и естественно согласуется с существительным женского рода.
- source_word: וּבִקְשׁוּ
  choice: они будут искать
  rationale: Форма в последовательности после объявления о наступившем суде описывает последующую реакцию людей; русское будущее время ясно передаёт это отношение.
- source_word: שָׁלוֹם
  choice: мира
  rationale: «Мир» здесь охватывает не только внутреннее спокойствие, но также безопасность и благополучие; это стандартный и контекстуально уместный русский эквивалент.
- source_word: וָאָיִן
  choice: но его не будет
  rationale: Союз передаёт контраст между поиском мира и его отсутствием. Будущая конструкция по-русски естественно соотносится с «будут искать», не устраняя категоричности отрицания.
