base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/026.yaml
  text: Disaster upon disaster will come[a], and rumor upon rumor will arise. They will seek a vision from a prophet, but instruction will perish from the priest[b], and counsel from the elders.
translation:
  language: ru
  text: Бедствие за бедствием придёт, и будет весть за вестью[a]. Они станут искать видения у пророка, но наставление исчезнет у священника[b], а совет — у старейшин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слух за слухом». Еврейское слово может означать как весть или сообщение, так и слух; здесь имеются в виду непрерывно поступающие тревожные известия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «закон исчезнет у священника». Еврейское слово тора может означать «наставление», «учение» или «закон»; здесь, вероятно, имеется в виду наставление, которое давал священник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹוָה
  choice: бедствие
  rationale: Существительное обозначает губительное бедствие или разорение в контексте суда. Повтор «бедствие за бедствием» сохраняет нарастающую силу еврейского выражения.
- source_word: שְׁמֻעָה / שְׁמוּעָה
  choice: весть
  rationale: Слово может означать весть, известие, сообщение или слух. «Весть» сохраняет широту значения и естественно передаёт череду тревожных известий; вариант «слух» отмечен в сноске.
- source_word: חָזוֹן
  choice: видение
  rationale: В пророческом контексте обозначает откровение, полученное в видении; прямой русский эквивалент сохраняет связь с пророческим служением.
- source_word: תּוֹרָה
  choice: наставление
  rationale: В данной триаде источников руководства речь прежде всего о наставлении, которое давал священник. Этот вариант не сужает значение до писаного закона, но возможное «закон» сохранено в сноске.
- source_word: תֹּאבַד
  choice: исчезнет
  rationale: Глагол אבד выражает гибель, утрату или исчезновение. Здесь «исчезнет» естественно описывает прекращение священнического наставления и сохраняет суровость образа.
- source_word: עֵצָה
  choice: совет
  rationale: Прямо передаёт практическое руководство, ожидаемое от старейшин, и поддерживает параллелизм трёх общественных институтов.
theological_decisions:
- issue: Значение תּוֹרָה в связи со священником
  choice: наставление
  alternative: закон; учение
  rationale: Контекст говорит о крушении обычных источников Божьего и общественного руководства — пророка, священника и старейшин. «Наставление» передаёт функцию священника, не сводя слово только к законодательному корпусу.
- issue: Индивидуальное или институциональное значение названий руководителей
  choice: у пророка ... у священника ... у старейшин
  alternative: у одного пророка ... у одного священника; у пророка ... у священников
  rationale: Еврейский текст употребляет «пророк» и «священник» в единственном числе без определённого артикля, а «старейшины» — во множественном. Русская формулировка сохраняет эту форму и допускает обобщённое, институциональное понимание, не указывая на конкретных лиц.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Повторы «бедствие за бедствием» и «весть за вестью» передают нарастание и параллелизм оригинала; финальное тире сохраняет сжатость последней части стиха.
