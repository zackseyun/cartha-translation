base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/023.yaml
  text: Make the chain[a], for the land is full of bloody crimes[b], and the city is full of violence.
translation:
  language: ru
  text: Сделай цепь[a], потому что земля полна кровавых преступлений[b], а город полон насилия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оковы», «узы». Еврейское слово, вероятно, вызывает образ ограничения свободы, заключения или плена в контексте суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «суд крови» или «суд кровей». Выражение может обозначать кровную вину, убийственную судебную несправедливость или кровавые преступления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה
  choice: Сделай
  rationale: Прямое повеление, Qal, 2-е лицо мужского рода единственного числа; «сделай» естественно сочетается с конкретным предметом.
- source_word: הָרַתּוֹק
  choice: цепь
  rationale: Редкое существительное обозначает цепь, оковы или узы; конкретный образ цепи уместен в контексте грядущего плена и суда, а артикль передан определённостью из контекста.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для повеления; «потому что» ясно выражает причинную связь в современном русском языке.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Здесь имеется в виду страна, вероятнее всего земля Израиля/Иуды, а не весь мир; традиционное «земля» сохраняет территориальный смысл.
- source_word: מָלְאָה
  choice: полна
  rationale: Кратко и естественно передаёт результативно-состоянийное значение формы совершенного вида.
- source_word: מִשְׁפַּט דָּמִים
  choice: преступлений, ведущих к кровопролитию
  rationale: Буквально трудная конструкция «суд/правосудие кровей» связывает правовую вину или несправедливый суд с пролитой кровью. Перевод сохраняет одновременно судебный и насильственный аспекты, не сводя выражение только к убийствам.
- source_word: וְהָעִיר
  choice: а город
  rationale: Союз передан как «а» для естественного параллелизма двух частей; определённый город в контексте — Иерусалим.
- source_word: חָמָס
  choice: насилия
  rationale: «Насилие» является естественным соответствием и охватывает жестокость, притеснение и общественную несправедливость.
theological_decisions:
- issue: Образ הָרַתּוֹק как орудия суда
  choice: Конкретная цепь, символически или буквально связанная с пленением и наказанием
  alternative: Оковы либо отвлечённые «узы» без явного образа плена
  rationale: Контекст Иезекииля 7 говорит о вторжении, наказании и утрате безопасности. «Цепь» сохраняет конкретность пророческого образа, не уточняя сверх текста способ его исполнения.
- issue: Смысл מִשְׁפַּט דָּמִים
  choice: Преступная несправедливость, приводящая к кровопролитию и влекущая кровную вину
  alternative: Только убийства либо только судебный приговор за кровь
  rationale: Конструкция допускает сочетание судебно-правового и насильственного смыслов. Формулировка не устраняет эту напряжённость и не ограничивает её одной конфессиональной трактовкой.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Параллелизм исходного текста сохранён; редкие и неоднозначные выражения пояснены в сносках без конфессионального истолкования.
