  text: All hands will grow weak[a], and all knees will run with water.
translation:
  language: ru
  text: Все руки ослабеют, и по всем коленям потечёт вода.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все колени пойдут водой». Вероятно, это образ того, как от ужаса подкашиваются колени; возможно, подразумевается и потеря контроля над телом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיָּדַיִם
  choice: все руки
  rationale: Сохраняет общий квантор и буквальный образ рук как выражение утраты силы.
- source_word: תִּרְפֶּינָה
  choice: ослабеют
  rationale: Глагол רפה обозначает ослабление, утрату силы; эта форма естественна в современном русском и не переуточняет образ.
- source_word: וְכָל בִּרְכַּיִם
  choice: и по всем коленям
  rationale: Сохраняет повтор כָּל и прямое обозначение части тела; предлог «по» позволяет естественно передать движение воды относительно коленей.
- source_word: תֵּלַכְנָה מָּיִם
  choice: потечёт вода
  rationale: Буквально сочетание говорит, что вода «пойдёт»; по-русски движение жидкости естественно передаётся глаголом «течь», при этом исходный эвфемистический образ сохраняется.
theological_decisions:
- issue: Смысл образа воды у коленей
  choice: Сохранён буквальный и эвфемистический образ в основном тексте
  alternative: Передать прямо как непроизвольное мочеиспускание от ужаса либо только как дрожь и подкашивание коленей
  rationale: Еврейский текст допускает связь с крайним страхом и потерей телесного контроля, но не выражает это однозначно; прямое истолкование неоправданно устранило бы смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением резкого телесного образа пророческой речи. Фраза построена ритмично и симметрично; неясность еврейской идиомы пояснена в сноске, а не устранена в тексте.
