  text: וְ/לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמ֑וֹל כִּ/דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה מַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/009.yaml
  text: My eye will not spare[a], nor will I show pity. I will bring your ways upon you, and your abominations will be in your midst. Then you will know that I am Yahweh[c][b], who strikes.
translation:
  language: ru
  text: Мой глаз не пощадит тебя[a], и Я не сжалюсь. Я воздам тебе по твоим путям[b], и твои мерзости будут среди тебя. Тогда вы узнаете, что Я — Яхве[c], который поражает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой глаз не посмотрит с жалостью». В еврейском тексте «глаз» употреблён в устойчивом выражении о пощаде или сострадании.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по твоим путям воздам тебе»; то есть поступлю с тобой сообразно твоим поступкам.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога; традиционно его также передают словом «Господь».
    reason: cultural_note
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: Мой глаз не пощадит тебя
  rationale: Сохранён выразительный еврейский образ с «глазом» как субъектом сострадания или пощады; дополнение «тебя» естественно вытекает из обращения к адресату и делает фразу грамматически полной по-русски.
- source_word: אֶחְמוֹל
  choice: и Я не сжалюсь
  rationale: Глагол передан отдельно от חוס, чтобы сохранить параллелизм и оттенок личного сострадания, не сводя оба выражения к одному русскому слову.
- source_word: כִדְרָכַיִךְ עָלַיִךְ אֶתֵּן
  choice: Я обращу твои пути против тебя
  rationale: «Пути» обозначают образ действий, а формулировка сохраняет образ воздаяния, при котором собственные поступки адресата оборачиваются против него. Более буквальное «возложу твои пути на тебя» по-русски неясно.
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: и твои мерзости
  rationale: «Мерзости» сохраняет сильную пророческую и религиозно-нравственную окраску слова תועבות, часто относящегося к идолопоклонству и отвратительным делам.
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: будут среди тебя
  rationale: Передана пространственная образность исходного выражения без уточнения, являются ли эти мерзости продолжающимися делами, их проявлениями или последствиями.
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: «Тогда» естественно выражает следствие суда. Множественное «вы» сохраняет внезапный переход исходного текста от обращения к одному адресату женского рода к группе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом, чтобы сохранить различие между именем и обозначением «Господь».
- source_word: מַכֶּה
  choice: который поражает
  rationale: Причастная форма обозначает Яхве как совершающего суд. Конструкция с относительным местоимением естественна в современном русском языке и сохраняет активное значение.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон. Транслитерация сохраняет личное имя, не подменяя его титулом; форма «Яхве» лучше соответствует принятой научной реконструкции произношения, чем «Иегова».
- issue: Смысл заключительного מַכֶּה
  choice: Яхве, который поражает
  alternative: Яхве, поражающий; Я, Яхве, поражаю
  rationale: Субстантивированное причастие связывает личность Бога с действием суда. Перевод не уточняет объект поражения и не превращает причастие без необходимости в действие исключительно настоящего момента.
- issue: Переход от единственного числа женского рода к множественному числу
  choice: «тебя / твои / среди тебя», затем «вы узнаете»
  alternative: Унифицировать всё обращение как единственное или множественное число
  rationale: Необычная смена числа присутствует в еврейском тексте и может расширять обращение от олицетворённой земли или города к жителям; её следует сохранить, а не разрешать толковательно.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и резкости пророческой речи. Образ «Мой глаз не пощадит» намеренно оставлен несколько необычным, поскольку он значим в оригинале. Архаизмы вроде «смилосердиться» и «карающий» не использованы. Смена единственного числа на множественное сохранена.
