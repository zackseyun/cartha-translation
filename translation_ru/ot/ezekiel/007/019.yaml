base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/019.yaml
  text: They will throw their silver into the streets[a], and their gold will become an unclean thing. Their silver and their gold will not be able to deliver them in the day of Yahweh’s wrath. They will not satisfy their appetite, nor fill their stomachs, for it has become the stumbling block of their iniquity.
translation:
  language: ru
  text: Своё серебро они выбросят на улицы, а их золото станет чем-то нечистым.[a] Ни их серебро, ни их золото не смогут спасти их в день гнева Яхве. Они не утолят своего голода и не наполнят своих желудков, ибо это богатство стало для них соблазном ко греху.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их золото будет для нечистоты». Еврейское слово נִדָּה может обозначать менструальную нечистоту и потому — нечто ритуально нечистое и отвратительное.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ибо оно было камнем преткновения их беззакония». Эта еврейская конструкция может означать, что богатство стало поводом к их беззаконию, либо связывать его с виной, навлечённой на них.'
    reason: lexical_syntactic_ambiguity
lexical_decisions:
- source_word: כַּסְפָּם
  choice: серебро своё / серебро их
  rationale: כֶּסֶף может означать серебро или деньги; параллель с золотом поддерживает конкретный образ драгоценного металла.
- source_word: בַּחוּצוֹת יַשְׁלִיכוּ
  choice: выбросят на улицы
  rationale: Передаёт и городское открытое пространство, и решительное отбрасывание ставшего бесполезным богатства.
- source_word: לְנִדָּה יִהְיֶה
  choice: станет нечистотой
  rationale: Сохраняет категорию ритуальной нечистоты и резкость метафоры, не вводя в основной текст более узкое менструальное значение.
- source_word: לֹא יוּכַל לְהַצִּילָם
  choice: не сможет спасти их
  rationale: Естественно передаёт невозможность избавления от наступающего суда; единственное число еврейского сказуемого сохранено при составном подлежащем как собирательная конструкция.
- source_word: נַפְשָׁם לֹא יְשַׂבֵּעוּ
  choice: они не насытят себя
  rationale: В параллели с наполнением внутренностей נֶפֶשׁ обозначает самого человека как испытывающего голод; русская формулировка сохраняет телесный контекст без отвлечённого значения «душа».
- source_word: וּמֵעֵיהֶם לֹא יְמַלֵּאוּ
  choice: не наполнят своих желудков
  rationale: מֵעִים буквально обозначает внутренности, но контекст насыщения указывает на желудок.
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: камнем преткновения, ведущим к беззаконию
  rationale: Передаёт конструкцию «препятствие/преткновение их беззакония», сохраняя возможную связь богатства как с поводом ко греху, так и с последствием вины; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте, без замены титулом.
- issue: Степень конкретизации נִדָּה
  choice: нечистота
  alternative: менструальная нечистота; мерзость; отбросы
  rationale: Основной текст сохраняет ритуальную категорию и метафорическую силу, а специфический оттенок указан в сноске.
- issue: Референт местоименного элемента в заключительной фразе
  choice: богатство
  alternative: это; оно
  rationale: Еврейский текст допускает подразумеваемую отсылку к серебру и золоту; явное «богатство» делает русский текст связным, не меняя аргумента пророка.
- issue: Связь מִכְשׁוֹל с עֲוֺנָם
  choice: камень преткновения, ведущий к беззаконию
  alternative: камень преткновения их беззакония; причина их вины; препятствие из-за их вины
  rationale: Формулировка не сводит выражение исключительно к причине греха или к каре за вину; альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «серебро их, ни золото их» сохраняет риторический параллелизм; «Яхве» передаёт тетраграмматон. Синтаксис сделан ясным для обычного читателя, а подлинная неоднозначность последней фразы вынесена в сноску.
