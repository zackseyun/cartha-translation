  source_fidelity: 'Начальная часть точно передаёт образ выбрасываемых серебра и золота, их неспособность избавить владельцев в день гнева Яхве и телесный смысл נֶפֶשׁ/מֵעִים в контексте голода. Однако «ведущим к беззаконию» чрезмерно конкретизирует заключительное מִכְשׁוֹל עֲוֺנָם: еврейская конструкция связывает богатство с их виной/беззаконием, но не выражает столь явно направленное действие «ведущее».'
  naturalness: «Они не насытят себя» и «не наполнят своих желудков» понятны, но «не утолят своего голода и не наполнят своих желудков» естественнее по-русски и сохраняет параллелизм. «Станет нечистотой» допустимо в высоком пророческом регистре, но «станет чем-то нечистым» яснее для современного литературного русского.
  terminology: «Яхве» верно передаёт יהוה. «Нечистое» сохраняет ритуальный оттенок נִדָּה без неоправданной конкретизации в основном тексте. Для מִכְשׁוֹל עֲוֺנָם выбран «соблазн ко греху»; сноска оговаривает более буквальное и иные возможные понимания связи слов.
