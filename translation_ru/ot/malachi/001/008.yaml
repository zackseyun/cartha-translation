  text: וְ/כִֽי תַגִּשׁ֨וּ/ן עִוֵּ֤ר לִ/זְבֹּ֨חַ֙ אֵ֣ין רָ֔ע וְ/כִ֥י תַגִּ֛ישׁוּ פִּסֵּ֥חַ וְ/חֹלֶ֖ה אֵ֣ין רָ֑ע הַקְרִיבֵ֨/הוּ נָ֜א לְ/פֶחָתֶ֗/ךָ הֲ/יִּרְצְ/ךָ֙ א֚וֹ הֲ/יִשָּׂ֣א פָנֶ֔י/ךָ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/008.yaml
  text: When you present a blind animal for sacrifice[a], is that not evil? And when you present one that is lame or sick, is that not evil? Present it, please, to your governor. Will he accept you[c][b], or show you favor? says Yahweh of hosts.
translation:
  language: ru
  text: Когда вы приносите в жертву слепое животное[a], разве это не зло? И когда приносите хромое или больное, разве это не зло? Принеси же его своему наместнику! Будет ли он тобой доволен[b] или окажет тебе благосклонность[c]? — говорит Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски здесь и далее: «нет зла». В контексте обличения эти слова переданы как риторические вопросы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Примет ли он тебя благосклонно?»'
    reason: alternative_reading
  - marker: c
    text: Еврейская идиома буквально означает «поднимет твоё лицо», то есть проявит благосклонность или окажет хороший приём.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּשׁוּן / תַגִּישׁוּ
  choice: приносите
  rationale: В породе hифиль глагол здесь означает поднести или представить жертвенное животное. «Приносите в жертву» естественно передаёт культовый контекст.
- source_word: עִוֵּר
  choice: слепое животное
  rationale: Прилагательное употреблено субстантивированно и обозначает животное с пороком; слово «животное» ясно следует из контекста жертвоприношения.
- source_word: לִזְבֹּחַ
  choice: в жертву
  rationale: Инфинитив указывает на цель принесения; русский оборот краток и естественен.
- source_word: אֵין רָע
  choice: разве это не зло?
  rationale: Буквально выражение означает «нет зла», но в контексте обличения оно имеет силу риторического вопроса, разоблачающего отношение священников.
- source_word: פִּסֵּחַ
  choice: хромое
  rationale: Точное и общеупотребительное обозначение животного с физическим увечьем.
- source_word: חֹלֶה
  choice: больное
  rationale: Передаёт обычное значение слова без излишне медицинского оттенка.
- source_word: הַקְרִיבֵהוּ נָא
  choice: Принеси же его
  rationale: Частица נָא придаёт повелению оттенок настойчивого, здесь иронического предложения; «же» естественно передаёт эту силу по-русски.
- source_word: פֶחָה
  choice: наместник
  rationale: Речь идёт о провинциальном правителе персидской эпохи; «наместник» точно и кратко обозначает такого представителя верховной власти.
- source_word: הֲיִרְצְךָ
  choice: Будет ли он тобой доволен
  rationale: Глагол רצה может означать благоволить, быть довольным или благосклонно принять; формулировка сохраняет личное дополнение второго лица.
- source_word: הֲיִשָּׂא פָנֶיךָ
  choice: окажет тебе благосклонность
  rationale: Идиома буквально означает «поднимет твоё лицо» и выражает благосклонный приём или расположение.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передача сохраняет личное имя יהוה и смысловой образ צבאות как небесных воинств.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Сила выражения אֵין רָע
  choice: 'Риторический вопрос: «разве это не зло?»'
  alternative: 'Утверждение: «в этом нет зла»'
  rationale: Формально возможна передача как утверждения, однако контекст обличения и параллельное построение указывают на саркастический риторический вызов. Вопросительная форма сохраняет обличительную силу, а буквальная форма отмечена в сноске.
- issue: Отношение двух вопросов о наместнике
  choice: Сохранить союз «или»
  alternative: 'Передать вторую часть присоединительно: «и окажет ли…»'
  rationale: Еврейское אוֹ прямо выражает альтернативу; её сохранение не снимает смыслового напряжения между одобрением и благосклонным приёмом.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим тоном. Повтор исходного текста сохранён. Переход от множественного «вы» к единственному «принеси… твоему» воспроизведён как намеренное прямое обращение. Частица «же» передаёт ироническую настойчивость נָא без архаизации.
