base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/002.yaml
  text: “I have loved you,” says Yahweh. But you say[a], “How have you loved us?” “Was not Esau Jacob’s brother?” declares Yahweh. “Yet I loved Jacob,”
translation:
  language: ru
  text: '«Я любил вас, — говорит Яхве. — Но вы спрашиваете: „Как Ты любил нас?“ Разве Исав не брат Иакова? — возвещает Яхве. — Но Я любил Иакова».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: Я любил
  rationale: Qal perfect, 1-е лицо ед. числа. Русское прошедшее время естественно передаёт совершенную форму и сохраняет связь с последующим вопросом; продолжающаяся значимость любви ясна из контекста.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Показатель прямого дополнения с суффиксом 2-го лица мн. числа; обращение направлено к Израилю как народу.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Пророческая формула естественно передаётся настоящим временем; личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: וַאֲמַרְתֶּם
  choice: Но вы спрашиваете
  rationale: Союз в контексте вводит возражение народа. Русское «спрашиваете» естественно оформляет следующую прямую вопросительную реплику, хотя буквально глагол означает «говорите/сказали».
- source_word: בַּמָּה אֲהַבְתָּנוּ
  choice: В чём проявилась Твоя любовь к нам?
  rationale: Идиоматическая передача буквального «чем/как Ты любил нас?». Она выражает вопрос о свидетельстве или проявлении любви, не добавляя конкретного ответа.
- source_word: הֲלוֹא
  choice: Разве … не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ.
- source_word: אָח עֵשָׂו לְיַעֲקֹב
  choice: Исав не брат Иакова
  rationale: Предлог לְ обозначает отношение; по-русски родство естественно выражается родительным падежом.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула; «возвещает» отличает её от предшествующего אָמַר и сохраняет оракульный регистр.
- source_word: וָאֹהַב אֶת יַעֲקֹב
  choice: И всё же Я полюбил Иакова
  rationale: Контекстуально союз выражает контраст между братским родством Исава и особой любовью к Иакову. «Полюбил» точно и естественно передаёт совершенную форму, не подменяя любовь понятием избрания.
theological_decisions:
- issue: Следует ли явно истолковать любовь к Иакову как заветное избрание
  choice: Сохранить слово «полюбил» без поясняющих расширений
  alternative: «избрал Иакова» или «обратил к Иакову Свою заветную любовь»
  rationale: אהב означает «любить». Контекст допускает смысл избрания и заветных отношений, но сам стих не заменяет любовь этим богословским толкованием.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Его передача как «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Диалогическая структура и риторическое напряжение сохранены; синтаксис слегка идиоматизирован ради ясности для обычного читателя.
