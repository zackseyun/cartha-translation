source:
  edition: WLC
  text: כִּֽי תֹאמַ֨ר אֱד֜וֹם רֻשַּׁ֗שְׁנוּ וְ/נָשׁוּב֙ וְ/נִבְנֶ֣ה חֳרָב֔וֹת כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הֵ֥מָּה יִבְנ֖וּ וַ/אֲנִ֣י אֶהֱר֑וֹס וְ/קָרְא֤וּ לָ/הֶם֙ גְּב֣וּל רִשְׁעָ֔ה וְ/הָ/עָ֛ם אֲשֶׁר זָעַ֥ם יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/004.yaml
  text: 'Though Edom says[a], “We are shattered, but we will return and rebuild the ruins,” this is what Yahweh of Armies says: “They may build, but I will tear down, and they will be called the territory of wickedness[d][c][b], the people with whom Yahweh is indignant forever.”'
translation:
  language: ru
  text: 'Хотя Эдом говорит: «Мы разорены, но вернёмся и восстановим разрушенные места», так говорит Яхве Воинств[a]: «Пусть они строят[b], а Я разрушу. Их назовут краем нечестия[c], народом, на который Яхве негодует вечно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционная передача титула: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Они будут строить, а Я разрушу». Еврейскую форму можно понимать как предсказание; основной текст передаёт её уступительную силу в данном контексте.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «областью нечестия» либо «пограничьем нечестия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: Хотя Эдом говорит
  rationale: В контексте כִּי вводит уступительно-ситуативное высказывание Эдома, которому противопоставлен ответ Яхве; настоящее время сохраняет живость пророческой речи.
- source_word: רֻשַּׁשְׁנוּ
  choice: Мы разорены
  rationale: Форма обозначает тяжёлое разорение и сокрушение страны; русский глагол передаёт национальное опустошение, не сводя смысл только к бедности.
- source_word: וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת
  choice: но вернёмся и отстроим развалины
  rationale: «Вернёмся» сохраняет основное значение שׁוב, а «отстроим развалины» естественно передаёт восстановление разорённых мест.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — смысловым и торжественным русским словом «Воинств», сохраняющим множественное число и военную силу титула.
- source_word: הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרֹס
  choice: Пусть они строят, а Я разрушу
  rationale: Независимые местоимения подчёркивают контраст. Уступительное «пусть» выражает тщетность их строительства, а «а Я» передаёт резкое противопоставление.
- source_word: וְקָרְאוּ לָהֶם
  choice: Их назовут
  rationale: Третье лицо множественного числа употреблено без названного деятеля; русская неопределённо-личная конструкция естественно сохраняет это значение.
- source_word: גְּבוּל רִשְׁעָה
  choice: краем нечестия
  rationale: גְּבוּל может обозначать как границу, так и территорию; «край» сохраняет эту пространственную широту, а «нечестие» передаёт нравственную характеристику רִשְׁעָה.
- source_word: זָעַם יְהוָה עַד עוֹלָם
  choice: на который Яхве негодует вечно
  rationale: «Негодует» передаёт сильное осуждающее негодование זעם, а «вечно» сохраняет временную формулу עַד עוֹלָם без смягчения.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное заветное имя; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Небесных войск
  rationale: «Воинств» понятно по-русски, сохраняет торжественный регистр и не ограничивает неоднозначный титул исключительно небесным войском.
- issue: Модальность הֵמָּה יִבְנוּ
  choice: уступительное «Пусть они строят»
  alternative: предсказательное «Они будут строить»
  rationale: Контекст подчёркивает бесплодность попыток Эдома перед лицом действия Яхве; сноска сохраняет возможное предсказательное прочтение формы.
- issue: Объект вечного негодования
  choice: «народом, на который Яхве негодует вечно»
  alternative: «народом, на который Яхве разгневан навеки»
  rationale: Формулировка прямо связывает относительное предложение с народом и сохраняет сильный, продолжающийся характер זעם, не уточняя сверх текста природу или механизм суда.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис прямой и доступный; сохранены контраст между намерением Эдома и действием Яхве, неоднозначность модальности строительства и пространственный диапазон слова גְּבוּל.
