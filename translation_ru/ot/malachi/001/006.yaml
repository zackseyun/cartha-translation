base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/006.yaml
  text: A son honors his father, and a servant his master. If, then, I am a father, where is my honor? And if I am a master, where is the fear due me? says the LORD of Armies to you, O priests who despise my name. Yet you say, “How have we despised your name?”
translation:
  language: ru
  text: '«Сын чтит отца, и раб — своего господина. Если Я — Отец, то где почтение ко Мне? И если Я — Господин, то где страх предо Мной? — говорит ГОСПОДЬ Воинств вам, священникам, презирающим Моё имя. — А вы говорите: „Чем мы презрели Твоё имя?“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְכַבֵּד / כְבוֹדִי
  choice: «чтит» / «почтение ко Мне»
  rationale: Сохраняется общий корень и смысл почитания; буквальное «где Моя честь?» по-русски менее естественно в этом обращении.
- source_word: עֶבֶד
  choice: «раб»
  rationale: Основное значение слова в данной паре социальных отношений; оно точнее, чем более широкое «слуга».
- source_word: אֲדֹנָיו / אֲדוֹנִים
  choice: «своего господина» / «Я Господин»
  rationale: Передаёт намеренный повтор титула и отношения власти; форма множественного числа אֲדוֹנִים при сказуемом в единственном числе относится к одному Господину.
- source_word: מוֹרָאִי
  choice: «страх предо Мной»
  rationale: Сохраняет прямое значение благоговейного страха, не ослабляя его до одного лишь «уважения».
- source_word: יְהוָה צְבָאוֹת
  choice: «ГОСПОДЬ Воинств»
  rationale: Тетраграмматон передан традиционным заменителем прописными буквами, а צְבָאוֹת — буквально и ёмко как «Воинств».
- source_word: בּוֹזֵי שְׁמִי
  choice: «презирающие Моё имя»
  rationale: Причастная конструкция и сильный смысл глагола בזה сохранены непосредственно.
- source_word: בַּמֶּה
  choice: «чем»
  rationale: Естественно передаёт вопрос о том, посредством каких действий было проявлено презрение.
theological_decisions:
- issue: Образ Бога как Отца и Господина
  choice: Сохранены оба параллельных самообозначения без поясняющего расширения.
  alternative: Истолковать «Отец» как Творца или Отца заветного народа.
  rationale: Стих не уточняет основание отцовства; перевод не должен устранять эту содержательную открытость.
- issue: Значение «страха» перед Богом
  choice: Передано как «страх предо Мной».
  alternative: «Благоговение передо Мной» или «уважение ко Мне».
  rationale: Более мягкие варианты заранее истолковывают מוֹרָא и ослабляют риторическое напряжение текста.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Реплики оформлены как прямая речь; местоимения, относящиеся к Богу, написаны с прописной буквы. Частица «же» подчёркивает вызывающий ответ священников, не добавляя нового содержания.
