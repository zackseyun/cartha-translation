source:
  edition: WLC
  text: מַשָּׂ֥א דְבַר יְהוָ֖ה אֶל יִשְׂרָאֵ֑ל בְּ/יַ֖ד מַלְאָכִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/001.yaml
  text: 'The burden of the word of the LORD to Israel by the hand of Malachi:'
translation:
  language: ru
  text: 'Бремя слова Яхве, обращённого к Израилю через Малахию:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשָּׂא
  choice: бремя
  rationale: Сохраняет конкретный образ тяжести и одновременно традиционное пророческое значение возвещения; не сводит многозначность слова только к нейтральному «пророчеству».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Передаёт устойчивую пророческую формулу; личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: אֶל יִשְׂרָאֵל
  choice: обращённого к Израилю
  rationale: Естественно выражает адресата слова в современном русском и устраняет возможное ошибочное понимание сочетания «слово к Израилю».
- source_word: בְּיַד מַלְאָכִי
  choice: через Малахию
  rationale: Еврейская идиома буквально означает «рукой Малахии», то есть посредством него; функциональная передача звучит естественно по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Сохраняется различие между собственным Божьим именем и титулом; конфессионально окрашенное типографическое решение не импортируется.
- issue: Статус имени מַלְאָכִי
  choice: Малахия
  alternative: мой вестник
  rationale: В заглавной формуле слово естественно читается как имя пророка, однако его этимологическая связь с выражением «мой вестник» остаётся значимой для книги и не требует разрешения в самом стихе.
translation_notes:
  register: Современный литературный русский с достоинством пророческого заголовка. Двоеточие сохраняет функцию вводной формулы перед последующим возвещением.
