translation:
  language: ru
  text: Но Исава Я возненавидел[a] и превратил его горы[b] в пустыню, а его удел отдал шакалам пустыни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные толкования по смыслу: «Я отверг» или «Я полюбил меньше». Однако еврейский глагол обычно означает «ненавидеть».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «его горную страну».'
    reason: lexical_alternative
  - marker: c
    text: 'В традиционных переводах: «драконам пустыни»; вероятнее всего, еврейское слово обозначает шакалов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Я возненавидел
  rationale: Qal глагола שׂנא обычно означает «ненавидеть». Прямое значение сохраняет напряжённость исходного высказывания и не подменяет его толкованием «отверг» или «полюбил меньше».
- source_word: וָאָשִׂים
  choice: сделал
  rationale: Глагол שׂים с последующим обозначением состояния естественно передаётся результативной конструкцией «сделал чем-либо».
- source_word: הָרָיו
  choice: горы его
  rationale: Прямое значение множественного числа הַר — «горы»; возможный региональный смысл «горная страна» не требуется контекстом.
- source_word: שְׁמָמָה
  choice: пустыней
  rationale: Существительное обозначает опустошённое, безлюдное место. Русское «сделал пустыней» сохраняет именную конструкцию и пророческую образность.
- source_word: נַחֲלָתוֹ
  choice: его наследие
  rationale: נַחֲלָה обозначает наследственное владение или удел; «наследие» сохраняет земельный и заветный оттенок, не сужая значение до одной лишь земли.
- source_word: לְתַנּוֹת מִדְבָּר
  choice: обиталищем шакалов пустыни
  rationale: תַנּוֹת, вероятнее всего, обозначает шакалов. Предлог לְ здесь выражает результат или назначение; добавление «обиталищем» делает русскую фразу грамматически естественной, не меняя образа.
- source_word: וְאֶת
  choice: а
  rationale: Союз וְ в контексте противопоставляет Исава Иакову из предыдущего стиха; русское «а» естественно передаёт этот контраст.
theological_decisions:
- issue: Сила выражения Божьей ненависти к Исаву
  choice: Сохранено прямое «Я возненавидел».
  alternative: «Я отверг» или «Я полюбил меньше».
  rationale: Еврейский глагол прямо означает ненависть. Смягчённые варианты могут выражать толкование в категориях избрания или предпочтения, но в основном тексте они устранили бы подлинное богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Порядок «горы его» слегка приподнят, но естественен для библейского контекста. Эллиптическая конструкция второй части развёрнута словом «обиталищем» ради ясности.
