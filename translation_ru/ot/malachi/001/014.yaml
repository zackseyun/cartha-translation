source:
  edition: WLC
  text: וְ/אָר֣וּר נוֹכֵ֗ל וְ/יֵ֤שׁ בְּ/עֶדְר/וֹ֙ זָכָ֔ר וְ/נֹדֵ֛ר וְ/זֹבֵ֥חַ מָשְׁחָ֖ת לַֽ/אדֹנָ֑/י כִּי֩ מֶ֨לֶךְ גָּד֜וֹל אָ֗נִי אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/שְׁמִ֖/י נוֹרָ֥א בַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/014.yaml
  text: But cursed is the deceiver who has a male in his flock[a], and vows it, but sacrifices a blemished animal to the Lord. For I am a great King, says Yahweh of Armies[b], and my name is feared among the nations.
translation:
  language: ru
  text: Но проклят обманщик, у которого в стаде есть животное мужского пола и который даёт обет принести его, а приносит Владыке в жертву животное с изъяном. Ведь Я — великий Царь, — говорит Яхве Воинств[a], — и имя Моё внушает трепет среди народов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или в традиционной передаче: «Господь Саваоф»; возможно также: «Яхве армий».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «имя Моё внушает страх среди народов». Еврейское слово объединяет оттенки страха, благоговения и почтения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: проклят
  rationale: Предикативное прилагательное выражает провозглашение Божьего суда; «проклят» — ясная и принятая в русском библейском стиле передача.
- source_word: נוֹכֵל
  choice: обманщик
  rationale: Слово обозначает человека, поступающего коварно или мошеннически; в контексте речь о сознательном обмане при жертвоприношении.
- source_word: יֵשׁ בְּעֶדְרוֹ זָכָר
  choice: у которого в стаде есть самец
  rationale: Передаёт наличие у человека пригодного для жертвы животного мужского пола. «Стадо» не ограничивает выражение только овцами и сохраняет широту עֵדֶר.
- source_word: וְנֹדֵר
  choice: и который даёт обет
  rationale: В еврейском тексте объект обета прямо не назван, поэтому русский текст не добавляет местоимение «его» и сохраняет эту недосказанность.
- source_word: וְזֹבֵחַ
  choice: а приносит ... в жертву
  rationale: Союз «а» естественно передаёт подразумеваемое противопоставление между обетом и фактически принесённой жертвой.
- source_word: מָשְׁחָת
  choice: животное с изъяном
  rationale: В жертвенном контексте слово означает испорченную или непригодную жертву; добавление «животное» делает подразумеваемый референт ясным.
- source_word: לַאדֹנָי
  choice: Владыке
  rationale: אֲדֹנָי здесь является божественным титулом и подчёркивает власть Бога; «Владыка» отличает этот титул от личного имени יהוה далее в стихе.
- source_word: כִּי מֶלֶךְ גָּדוֹל אָנִי
  choice: Ведь Я — великий Царь
  rationale: «Ведь» передаёт обосновывающую функцию כִּי, а именная конструкция сохраняет торжественную силу Божьего самообъявления.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: «Яхве» передаёт личное covenantное имя יהוה, а «Воинств» сохраняет широкий образ небесных и земных сил под властью Бога, не сужая его до обычных человеческих армий.
- source_word: נוֹרָא
  choice: внушает трепет
  rationale: Передаёт сочетание страха, благоговения и почтения в נוֹרָא, избегая как ослабления до простого уважения, так и сведения смысла к ужасу.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם обозначает народы вне Израиля; «народы» естественно для пророческого контекста и не вносит позднейших оттенков слова «язычники».
theological_decisions:
- issue: Передача личного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит Тетраграмматон, личное имя Бога. Транслитерация отличает его от титула אֲדֹנָי, уже употреблённого в первой части стиха.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; армий
  rationale: «Воинств» сохраняет традиционную широту понятия — силы, которыми повелевает Яхве, — и остаётся понятным в сочетании с образом великого Царя.
- issue: Оттенок נוֹרָא применительно к Божьему имени
  choice: внушает трепет
  alternative: внушает страх; почитаемо
  rationale: Форма допускает смысл страха, благоговения и почтения. «Внушает трепет» сохраняет это напряжение, не сводя значение ни к одному оттенку.
- issue: Объект обета
  choice: не выражать подразумеваемый объект
  alternative: добавить «обещает его» или «даёт его в обет»
  rationale: В масоретском тексте после וְנֹדֵר прямой объект отсутствует. Контекст связывает обет с имеющимся самцом, но перевод не делает эту связь грамматически более явной, чем оригинал.
translation_notes:
  register: Современный литературный русский с торжественностью, соответствующей пророческой речи. Синтаксис сохраняет резкое противопоставление обета и недостойной жертвы. «Владыка» и «Яхве» намеренно различают божественный титул אֲדֹנָי и личное имя יהוה. Все сноски отмечены в основном тексте.
