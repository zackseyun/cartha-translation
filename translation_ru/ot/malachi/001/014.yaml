  source_fidelity: 'Основной смысл передан верно: проклятие обманщика, наличие у него самца в стаде, обет, принесение порочной жертвы, самообъявление Яхве как великого Царя и страх/трепет перед Его именем среди народов. Однако «даёт обет» без дополнения в русском языке неясно и не передаёт достаточно точно, что обет относится к жертве; нейтральное «даёт обет принести его» делает контекстную связь явной, не создавая спорной богословской интерпретации.'
