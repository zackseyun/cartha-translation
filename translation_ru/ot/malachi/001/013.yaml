  text: וַ/אֲמַרְתֶּם֩ הִנֵּ֨ה מַ/תְּלָאָ֜ה וְ/הִפַּחְתֶּ֣ם אוֹת֗/וֹ אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וַ/הֲבֵאתֶ֣ם גָּז֗וּל וְ/אֶת הַ/פִּסֵּ֨חַ֙ וְ/אֶת הַ֣/חוֹלֶ֔ה וַ/הֲבֵאתֶ֖ם אֶת הַ/מִּנְחָ֑ה הַ/אֶרְצֶ֥ה אוֹתָ֛/הּ מִ/יֶּדְ/כֶ֖ם אָמַ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/013.yaml
  text: And you say[a], ‘Look, what a weariness this is,’ and you snort at it, says Yahweh of hosts. And you bring what is stolen, and the lame, and the sick; thus you bring the offering[b]. Should I accept it from your hand? says Yahweh.
translation:
  language: ru
  text: 'А вы говорите: «Какая тягота!» — и с презрением фыркаете[a], — говорит Яхве Воинств[b]. Вы приносите украденное, хромое и больное — вот какое приношение вы приносите! Разве Я приму его из ваших рук? — говорит Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выражаете презрение». Буквально глагол изображает презрительное фырканье или выдох.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Яхве воинств»; титул говорит о Яхве как Повелителе воинств, то есть организованных небесных и земных сил.'
    reason: cultural_note
lexical_decisions:
- source_word: מַתְּלָאָה
  choice: Какая тягота!
  rationale: Существительное обозначает утомительную, обременительную тяготу; восклицательная русская конструкция естественно передаёт недовольную реплику священников.
- source_word: וְהִפַּחְתֶּם אֹתוֹ
  choice: и презрительно фыркаете на это
  rationale: Глагол נפח изображает резкий выдох или фырканье. Добавление «презрительно» делает понятным выраженный жестом смысл, не заменяя конкретный образ отвлечённым глаголом.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — формально как «Воинств», что сохраняет образ организованных сил и не сводит титул к отвлечённому «Всемогущий».
- source_word: גָּזוּל
  choice: украденное
  rationale: Форма обозначает отнятое или похищенное; субстантивированное русское прилагательное сохраняет нравственную оценку такого дара.
- source_word: הַפִּסֵּחַ
  choice: хромое
  rationale: Речь идёт о жертвенном животном с физическим изъяном; средний род естественно согласуется с подразумеваемым «животное».
- source_word: הַחוֹלֶה
  choice: больное
  rationale: Передаёт состояние больного жертвенного животного и образует естественную параллель с «хромое».
- source_word: הַמִּנְחָה
  choice: приношение
  rationale: В данном контексте слово обозначает принесённый Богу дар вообще; «приношение» не сужает значение до хлебной жертвы.
- source_word: הַאֶרְצֶה אֹתָהּ
  choice: Разве Я приму его
  rationale: В жертвенном контексте רצה означает благосклонное принятие. Вопросительная форма передана риторическим «разве», сохраняющим укор без категорического переформулирования в утверждение.
- source_word: מִיֶּדְכֶם
  choice: из ваших рук
  rationale: Сохранён конкретный и понятный по-русски древнееврейский оборот получения дара из чьих-либо рук.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Сохранено собственное заветное имя, непосредственно стоящее в древнееврейском тексте, без замены титулом.
- issue: Передача титула יהוה צבאות
  choice: Яхве Воинств
  alternative: Яхве Всемогущий
  rationale: Формальная передача сохраняет военный и собирательный образ צבאות и не отождествляет его без пояснения с понятием всемогущества.
- issue: Риторический вопрос о принятии жертвы
  choice: Разве Я приму его из ваших рук?
  alternative: Я не приму его из ваших рук
  rationale: Сохранена вопросительная форма исходного текста и тем самым его риторическая напряжённость; подразумеваемый отрицательный ответ не превращён в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прямая речь и риторический вопрос переданы ясно и энергично; конкретный образ презрительного фырканья сохранён. Заглавные местоимения в речи Бога использованы согласно принятой русской религиозно-издательской норме.
