source:
  edition: WLC
  text: מַגִּישִׁ֤ים עַֽל מִזְבְּחִ/י֙ לֶ֣חֶם מְגֹאָ֔ל וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה גֵֽאַלְנ֑וּ/ךָ בֶּ/אֱמָרְ/כֶ֕ם שֻׁלְחַ֥ן יְהוָ֖ה נִבְזֶ֥ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/007.yaml
  text: By presenting defiled food on my altar[a]. But you say, “How have we defiled you?” By saying[c][b], “The table of Yahweh is despised.”
translation:
  language: ru
  text: 'Тем, что приносите на Мой жертвенник осквернённую пищу[a]. Но вы спрашиваете: «Чем мы осквернили Тебя?[b]» Тем, что говорите: «Стол Яхве[c] — предмет презрения».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб»; здесь, в контексте жертвоприношений, имеется в виду пища, возлагаемая на жертвенник.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте обращение направлено прямо к Богу: «Тебя». Презрение к Его жертвеннику тем самым представлено как оскорбление Его Самого.'
    reason: alternative_reading
  - marker: c
    text: «Стол Яхве» — образное название жертвенника и совершаемого на нём жертвенного служения.
    reason: cultural_note
lexical_decisions:
- source_word: מַגִּישִׁים
  choice: Тем, что приносите
  rationale: Причастие породы хифиль продолжает обвинение из предыдущего стиха и объясняет, каким образом священники презирают имя Бога. Оборот «тем, что приносите» естественно передаёт эту пояснительную связь.
- source_word: עַל מִזְבְּחִי
  choice: на Мой жертвенник
  rationale: Прямо передаёт местное значение и сохраняет притяжательное местоимение первого лица.
- source_word: לֶחֶם
  choice: пищу
  rationale: Буквально слово означает «хлеб», но в жертвенном контексте обозначает пищу, приносимую на жертвеннике, в более широком смысле.
- source_word: מְגֹאָל
  choice: осквернённую
  rationale: Слово выражает осквернение или загрязнение; «осквернённую» подходит как для обрядового, так и для нравственного аспекта обвинения.
- source_word: בַּמֶּה גֵאַלְנוּךָ
  choice: Чем мы осквернили Тебя?
  rationale: 'Суффикс второго лица мужского рода единственного числа прямо указывает на Бога. Формулировка сохраняет намеренно резкую мысль: осквернение Его жертвенника является оскорблением Его Самого.'
- source_word: בֶּאֱמָרְכֶם
  choice: Тем, что говорите
  rationale: Предлог с инфинитивом указывает на средство или основание; русский оборот сохраняет пояснительную структуру.
- source_word: שֻׁלְחַן יְהוָה
  choice: Стол Яхве
  rationale: Сохранена культовая метафора жертвенника и жертвенного служения, а тетраграмматон передан личным именем «Яхве».
- source_word: נִבְזֶה הוּא
  choice: презрен
  rationale: Краткое прилагательное передаёт оценку стола как подвергаемого презрению или считающегося недостойным почтения, не устраняя оттенок смысловой неоднозначности.
theological_decisions:
- issue: Сохранять ли прямое дополнение «Тебя» в вопросе священников
  choice: «Чем мы осквернили Тебя?»
  alternative: «Чем мы осквернили его / Твой жертвенник?»
  rationale: 'В еврейском тексте стоит явный суффикс второго лица. Сохранение прямого обращения не сглаживает богословское напряжение: презрение к богослужению представлено как оскорбление Самого Бога.'
- issue: Передача לֶחֶם в контексте жертвоприношения
  choice: «пища»
  alternative: «хлеб»
  rationale: Контекст указывает не только на выпеченный хлеб, но шире на жертвенную пищу, возлагаемую на жертвенник.
- issue: Передача образа «стола Яхве»
  choice: Сохранить метафору без замены словом «жертвенник»
  alternative: «жертвенник Яхве»
  rationale: Исходный текст намеренно называет жертвенник столом Бога; сохранение образа поддерживает связь между приношением пищи и отношением священников к Богу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Сохранены диалогическая резкость обвинения, прямое обращение к Богу и культовая метафора «стола Яхве».
