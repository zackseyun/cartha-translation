  text: מִ֤י גַם בָּ/כֶם֙ וְ/יִסְגֹּ֣ר דְּלָתַ֔יִם וְ/לֹֽא תָאִ֥ירוּ מִזְבְּחִ֖/י חִנָּ֑ם אֵֽין לִ֨/י חֵ֜פֶץ בָּ/כֶ֗ם אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/מִנְחָ֖ה לֹֽא אֶרְצֶ֥ה מִ/יֶּדְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/010.yaml
  text: Oh[a], that there were even one among you who would shut the doors, so that you would not kindle my altar in vain! I have no pleasure in you, says Yahweh of hosts[c][b], and I will not accept an offering from your hand.
translation:
  language: ru
  text: О, если бы хоть кто-нибудь из вас запер двери[a], чтобы вы не возжигали напрасно огонь на Моём жертвеннике[b]! Вы неугодны Мне, — говорит Яхве Воинств, — и приношение[c] из ваших рук Я не приму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Есть ли среди вас хоть кто-нибудь, кто запер бы двери?» Древнееврейский текст допускает риторический вопрос, хотя в контексте, вероятно, выражено пожелание.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «не зажигали напрасно Мой жертвенник». Речь идёт о возжигании огня на жертвеннике.'
    reason: lexical_alternative
  - marker: c
    text: Древнееврейское минха может обозначать приношение вообще, а в жертвенном контексте — более конкретно хлебное приношение.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי גַם בָּכֶם
  choice: О, если бы хоть кто-нибудь из вас
  rationale: В данном контексте сочетание естественно передаёт страстное пожелание, чтобы нашёлся хотя бы один человек, готовый прекратить пустое богослужение; возможное вопросительное прочтение сохранено в сноске.
- source_word: וְיִסְגֹּר דְּלָתַיִם
  choice: запер двери
  rationale: Глагол означает «закрыть, запереть», а двойственное существительное указывает на двери храма. Краткая русская формулировка сохраняет конкретность образа.
- source_word: וְלֹא תָאִירוּ מִזְבְּחִי חִנָּם
  choice: чтобы вы не возжигали напрасно огонь на Моём жертвеннике
  rationale: Порода хифиль глагола אור здесь означает зажигать или поддерживать жертвенный огонь. Добавление слова «огонь» делает выражение естественным по-русски, а «напрасно» передаёт бесполезность и тщетность такого служения.
- source_word: אֵין לִי חֵפֶץ בָּכֶם
  choice: Я не благоволю к вам
  rationale: חֵפֶץ выражает удовольствие, расположение или благоволение. Эта формулировка естественна в торжественной современной русской речи и сохраняет личную направленность Божьего отвержения.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צְבָאוֹת — как «Воинств», что сохраняет образ небесных или воинских сил и межтекстовую узнаваемость титула.
- source_word: וּמִנְחָה
  choice: приношения
  rationale: מִנְחָה может обозначать дар или, в культовом контексте, хлебное приношение. Более широкое «приношение» не сужает смысл сверх необходимого.
- source_word: לֹא אֶרְצֶה מִיֶּדְכֶם
  choice: из ваших рук Я не приму
  rationale: В жертвенном контексте רצה означает благосклонно принять. Русское «не приму» ясно передаёт отказ Бога принять приношение, а образ рук сохранён.
theological_decisions:
- issue: Пожелание или риторический вопрос в מִי גַם בָּכֶם
  choice: 'пожелание: «О, если бы хоть кто-нибудь из вас…»'
  alternative: 'риторический вопрос: «Есть ли среди вас хоть кто-нибудь, кто запер бы двери?»'
  rationale: 'Синтаксис допускает вопрос, однако контекст резкого обличения поддерживает оптативное прочтение: лучше закрыть храм, чем продолжать тщетное служение. Неоднозначность отмечена в сноске.'
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передача личного имени как «Яхве» сохраняет его статус явленного заветного имени и не заменяет его титулом.
- issue: Объём значения מִנְחָה
  choice: приношение
  alternative: хлебное приношение
  rationale: Хотя в жертвенной терминологии слово нередко обозначает именно хлебное приношение, здесь широкое обозначение лучше соответствует общему осуждению храмового служения; более узкий смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; прописные местоимения при обращении Бога к Себе использованы в соответствии с распространённой русской библейской традицией. Подлинная неоднозначность начального оборота и более узкое культовое значение מִנְחָה сохранены в сносках.
