  text: וְ/אַתֶּ֖ם מְחַלְּלִ֣ים אוֹת֑/וֹ בֶּ/אֱמָרְ/כֶ֗ם שֻׁלְחַ֤ן אֲדֹנָ/י֙ מְגֹאָ֣ל ה֔וּא וְ/נִיב֖/וֹ נִבְזֶ֥ה אָכְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/012.yaml
  text: But you are profaning it by saying[a], ‘The table of the Lord is defiled, and its fruit, its food[b], is despised.’
translation:
  language: ru
  text: 'А вы оскверняете его, говоря[a]: «Стол Господа осквернён, и его плод — его пища — презираем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оскверняете Его, говоря», если местоимение относится непосредственно к Господу, а не к Его имени.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְחַלְּלִים
  choice: оскверняете
  rationale: Порода пиэль глагола חלל означает обращение со святыней как с чем-то обыденным, то есть её осквернение; выбранное слово сохраняет культовый смысл.
- source_word: אוֹתוֹ
  choice: его
  rationale: Местоимение мужского рода естественно соотносится с выражением «имя Моё» в предыдущем стихе; русское «его» также сохраняет возможность отнести его непосредственно к Господу.
- source_word: בֶּאֱמָרְכֶם
  choice: говоря
  rationale: 'Предлог с инфинитивом передаёт способ или обстоятельство действия: осквернение совершается тем, что они говорят.'
- source_word: שֻׁלְחַן אֲדֹנָי
  choice: стол Господа
  rationale: Формальная передача сохраняет жертвенный образ алтаря как стола Господа.
- source_word: אֲדֹנָי
  choice: Господа
  rationale: В тексте стоит титул אֲדֹנָי, а не тетраграмматон; поэтому используется «Господь», без специального оформления имени YHWH.
- source_word: מְגֹאָל
  choice: осквернён
  rationale: Страдательное причастие обозначает нечто загрязнённое или осквернённое; в жертвенном контексте «осквернён» точнее сохраняет религиозную окраску.
- source_word: נִיבוֹ
  choice: плод его
  rationale: ניב буквально означает плод или произведение; сохранён прямой эквивалент, а следующее слово поясняет его в данном контексте.
- source_word: נִבְזֶה
  choice: достоин презрения
  rationale: Форма выражает оценку как презренного, ничтожного; эта конструкция естественна по-русски и сохраняет значение исходного текста.
- source_word: אָכְלוֹ
  choice: пища его
  rationale: Буквально «его пища». Приложение к «плод его» сохраняет оба сжатых еврейских выражения и их связь с приношениями.
theological_decisions:
- issue: К чему относится местоимение в выражении «оскверняете его»
  choice: Основным ближайшим смысловым предшественником считается имя Господа из Мал 1:11; русское местоимение «его» относится к слову «имя».
  alternative: 'Местоимение может относиться непосредственно к Господу: «оскверняете Его».'
  rationale: Контраст с утверждением предыдущего стиха о величии имени Господа поддерживает отнесение к имени, однако еврейская форма допускает личное отнесение; примечание сохраняет эту неоднозначность.
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Здесь употреблён титул אֲדֹנָי, а не имя YHWH, поэтому написание, предназначенное для тетраграмматона, не используется.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным культовым словарём. Синтаксис близок к еврейскому там, где это необходимо для сохранения смысловой сжатости и неоднозначности.
