  text: כִּ֣י מִ/מִּזְרַח שֶׁ֜מֶשׁ וְ/עַד מְבוֹא֗/וֹ גָּד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם וּ/בְ/כָל מָק֗וֹם מֻקְטָ֥ר מֻגָּ֛שׁ לִ/שְׁמִ֖/י וּ/מִנְחָ֣ה טְהוֹרָ֑ה כִּֽי גָד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/011.yaml
  text: For from the rising of the sun to its setting[a], my name is great among the nations, and in every place incense is offered, and a pure offering is brought, to my name; for my name is great among the nations[d][c][b], says Yahweh of hosts.
translation:
  language: ru
  text: Ведь от восхода солнца до его заката[a] велико Моё имя среди народов, и во всяком месте Моему имени воскуряют фимиам и приносят чистое приношение; ведь велико Моё имя среди народов[b][c][d], — говорит Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от востока до запада»; буквально: «от восхода солнца до его захода».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди язычников».'
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст допускает понимание этих слов как описания настоящей действительности, пророческого настоящего или несомненного будущего; перевод сохраняет форму оригинала, не уточняя время.
    reason: alternative_reading
  - marker: d
    text: Еврейское минха, переведённое как «приношение», может обозначать приношение вообще, а в жертвенном контексте часто — хлебное приношение.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт обосновывающую и одновременно подчёркивающую функцию частицы в связи с предшествующим обличением, не сводя её значение только к причинному «потому что».
- source_word: מִמִּזְרַח שֶׁמֶשׁ וְעַד מְבוֹאוֹ
  choice: от восхода солнца до его заката
  rationale: Сохраняет образность и всемирный охват еврейского выражения; местоимение «его» отражает суффикс мужского рода, относящийся к солнцу.
- source_word: גָּדוֹל שְׁמִי
  choice: велико Моё имя
  rationale: Сохраняет конкретный богословски значимый образ имени, включающий славу и почёт, без поясняющего парафраза.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Широко и естественно передаёт גּוֹיִם в пророческом контексте, не сужая значение до позднейшего термина «язычники».
- source_word: וּבְכָל מָקוֹם
  choice: и на всяком месте
  rationale: Передаёт распределительное значение исходного выражения и сохраняет его торжественный библейский регистр.
- source_word: מֻקְטָר
  choice: воскуряют благовоние
  rationale: Передаёт культовое значение пассивного причастия от קטר. Русская неопределённо-личная конструкция естественно выражает действие без названного деятеля; «благовоние» не ограничивает термин исключительно специальным составом храмового фимиама.
- source_word: מֻגָּשׁ לִשְׁמִי
  choice: Моему имени ... приносят
  rationale: Глагол נגשׁ в жертвенном контексте означает представление или принесение дара. Дательный оборот сохраняет необычное и богословски значимое «Моему имени», не заменяя его на «Мне».
- source_word: וּמִנְחָה טְהוֹרָה
  choice: и приносят чистое приношение
  rationale: «Приношение» сохраняет широту מִנְחָה, которое может обозначать дар вообще и нередко хлебное приношение; «чистое» передаёт ритуальную и нравственную многозначность טְהוֹרָה.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: говорит Яхве Воинств
  rationale: Личное имя передано как «Яхве» согласно консультационному слою; «Воинств» прямо сохраняет значение צְבָאוֹת и традиционную пророческую титулатуру без замены толкованием «Всемогущий».
theological_decisions:
- issue: Описывает ли стих настоящее поклонение народов или будущую/идеальную действительность
  choice: 'Использовать настоящее время: «велико», «воскуряют», «приносят».'
  alternative: Будущее время («будет велико», «будут воскурять», «будут приносить») либо явно обозначенное пророческое настоящее.
  rationale: Именные и причастные конструкции еврейского текста прямо не отмечают будущего времени. Русское настоящее сохраняет грамматическую поверхность и не решает за читателя, идёт ли речь о текущей реальности, пророческом настоящем или несомненном будущем.
- issue: Смысл жертвенной лексики применительно к поклонению среди народов
  choice: Сохранить прямые культовые слова «воскуряют благовоние» и «приносят чистое приношение».
  alternative: Истолковать их как метафору молитвы и поклонения либо как указание на конкретную эсхатологическую систему жертвоприношений.
  rationale: Исходный текст использует явную жертвенную лексику, но не объясняет способ её исполнения. Прямой перевод удерживает богословское напряжение и не вводит конфессионального толкования.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Форма «Яхве» представляет личное имя в исходном тексте и согласуется с предоставленным английским консультационным слоем, не смешивая имя с титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Инверсия «велико Моё имя» сохраняет акцент оригинала и звучит естественно в возвышенной речи. Неопределённо-личные формы «воскуряют» и «приносят» естественно передают еврейские пассивные причастия, не добавляя действующего лица. Пунктуация разграничивает два однородных культовых действия и формулу речи.
