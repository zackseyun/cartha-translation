  text: וְ/עֵינֵי/כֶ֖ם תִּרְאֶ֑ינָה וְ/אַתֶּ֤ם תֹּֽאמְרוּ֙ יִגְדַּ֣ל יְהוָ֔ה מֵ/עַ֖ל לִ/גְב֥וּל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/005.yaml
  text: Your own eyes will see[a], and you yourselves will say, “Great is Yahweh beyond the border of Israel.”
translation:
  language: ru
  text: 'Вы увидите это своими глазами и сами скажете: «Велик Яхве за пределами Израиля».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет велик Яхве за пределами Израиля», или: «Яхве велик за пределами Израиля». Еврейский текст допускает понимание этих слов как возгласа-пожелания или как утверждения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֵינֵיכֶם תִּרְאֶינָה
  choice: Вы увидите это своими глазами
  rationale: 'Буквально: «и ваши глаза увидят». Русское «своими глазами» естественно передаёт непосредственное личное свидетельство; «это» восполняет подразумеваемый объект — суд над Эдомом из предыдущего стиха.'
- source_word: וְאַתֶּם תֹּאמְרוּ
  choice: и сами скажете
  rationale: Самостоятельное местоимение אַתֶּם подчёркивает субъект; в современном русском эту эмфазу естественно передаёт «сами».
- source_word: יִגְדַּל
  choice: Велик
  rationale: Форма допускает аккламационное или констатирующее прочтение. Краткая форма «Велик» сохраняет торжественный возглас и не вводит отсутствующий в еврейском пассив «да будет возвеличен».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: מֵעַל לִגְבוּל יִשְׂרָאֵל
  choice: за пределами Израиля
  rationale: מֵעַל в сочетании с גְּבוּל указывает на пространство по ту сторону границы; по-русски «за пределами Израиля» естественнее буквального «за границей Израиля» и может обозначать территорию страны.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл יִגְדַּל יְהוָה
  choice: «Велик Яхве» с примечанием об альтернативе
  alternative: «Да возвеличится Яхве» / «Яхве велик»
  rationale: Форма יִגְדַּל может пониматься как аккламация, пожелание или утверждение. Основной текст передаёт торжественную аккламацию, а примечание сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Эмфаза исходного текста передана выражениями «своими глазами» и «сами»; неоднозначность сказуемого раскрыта в примечании.
