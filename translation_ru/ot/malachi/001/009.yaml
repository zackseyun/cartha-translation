  text: וְ/עַתָּ֛ה חַלּוּ נָ֥א פְנֵי אֵ֖ל וִֽ/יחָנֵ֑/נוּ מִ/יֶּדְ/כֶם֙ הָ֣יְתָה זֹּ֔את הֲ/יִשָּׂ֤א מִ/כֶּם֙ פָּנִ֔ים אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/009.yaml
  text: And now[a], entreat God for favor, that he may be gracious to us. From your hand has this come[b]; will he show favor to any of you? says Yahweh of hosts.
translation:
  language: ru
  text: А теперь умоляйте Бога о благоволении, чтобы Он помиловал нас. Это исходит от вас[a]; разве Он благосклонно примет кого-нибудь из вас? — говорит Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «От вашей руки было это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוּ נָא פְנֵי אֵל
  choice: умолите Бога о благоволении
  rationale: Идиома буквально говорит об умолении «лица Бога», то есть об усердной просьбе даровать благоволение. Русская формулировка передаёт смысл и настойчивость без неестественного буквализма.
- source_word: וִיחָנֵּנוּ
  choice: чтобы Он помиловал нас
  rationale: Глагол חנן означает проявить милость или благоволение. «Помиловал» естественно продолжает просьбу и сохраняет религиозно-нравственную весомость выражения.
- source_word: מִיֶּדְכֶם הָיְתָה זֹּאת
  choice: Это произошло по вашей вине
  rationale: 'Буквально: «от вашей руки произошло это». В контексте выражение указывает на ответственность священников за негодные приношения; «по вашей вине» ясно передаёт агентность и обвинительный смысл.'
- source_word: הֲיִשָּׂא מִכֶּם פָּנִים
  choice: Разве Он благосклонно примет кого-нибудь из вас?
  rationale: Идиома נשׂא פנים буквально означает «поднять лицо», а здесь — благосклонно принять или оказать благоволение. Риторическое «разве» естественно передаёт ожидаемый отрицательный ответ.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צבאות — традиционным и ёмким словом «Воинств», не ограничивающим титул только земными армиями.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл вопроса הֲיִשָּׂא מִכֶּם פָּנִים
  choice: благосклонно примет кого-нибудь из вас
  alternative: окажет кому-нибудь из вас благоволение
  rationale: Выбор сохраняет направленный к виновным священникам вопрос о благоприятном принятии, не превращая его в отвлечённое утверждение о пристрастности Бога.
- issue: Множественное местоимение в וִיחָנֵּנוּ
  choice: нас
  alternative: вас
  rationale: Масоретский текст прямо имеет суффикс первого лица множественного числа — «нас». Эта напряжённость сохранена, хотя говорящий тут же обвиняет адресатов.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Сохранены риторический вопрос, прямое обвинение священников и личное имя Яхве; неестественные для русского языка буквальные идиомы раскрыты по смыслу.
