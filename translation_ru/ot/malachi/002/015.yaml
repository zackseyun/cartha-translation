  verdict: revise
  source_fidelity: Основное выбранное прочтение первой трудной части («один Бог сотворил их») допустимо лишь как интерпретационный перевод и надлежащим образом снабжено примечанием. Однако прописные «Дух/Него» и титульное «Единый» чрезмерно закрепляют спорное отнесение местоимения и רוח; исходный текст этого не определяет. Заключительное בגד требует указания на вероломство по отношению к жене, а не просто действия «с женой».
  naturalness: «И остаток Духа был у Него» и «храните себя в духе вашем» звучат в современном русском как буквальные, малопонятные кальки. «Будьте внимательны к своему духу» естественно передаёт призыв к внутренней бдительности. «По отношению к жене своей юности» снимает неуместную двусмысленность предлога «с».
  terminology: «Божье потомство» сохраняет генитивную неоднозначность זרע אלהים и приемлемо в данном контексте. «Вероломно» удачно передаёт заветно-нравственную окраску בגד. Строчная буква в «дух/него» необходима для сохранения неопределённости еврейского текста; возможное понимание как Божьего Духа оставлено в примечании.
