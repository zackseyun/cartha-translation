base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/015.yaml
  text: Did not the one God make them[a]? Yet a remnant of the Spirit was his. And what was the one seeking? Godly offspring. So guard yourselves in your spirit[c][b], and let no one deal treacherously with the wife of his youth.
translation:
  language: ru
  text: Не один ли Бог сотворил их?[a] А у него был остаток духа.[b] Чего же искал один? Божьего потомства.[c] Итак, будьте внимательны к своему духу и пусть никто не поступает вероломно по отношению к жене своей юности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь крайне труден; буквально возможно: «Не один ли сделал, и остаток духа был у него?» Среди других толкований: «Никто, у кого есть хотя бы остаток духа, не делает этого»; либо «один» относится к Аврааму.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «остаток духа был у него» или «у него было изобилие духа». Еврейский текст не указывает, идёт ли речь именно о Божьем Духе.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «семя Бога»; возможно также: «потомство, угодное Богу» или «потомство от Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֶחָד עָשָׂה
  choice: Не один ли Бог сотворил их?
  rationale: Сжатая еврейская фраза допускает несколько разборов. В основном тексте אֶחָד понято как указание на единого Бога, а подразумеваемое дополнение — как супружеская чета из ближайшего контекста. Слово «Бог» и местоимение «их» эксплицируют этот разбор, тогда как иные возможные толкования сохранены в примечании.
- source_word: וּשְׁאָר רוּחַ לוֹ
  choice: И остаток Духа был у Него
  rationale: שְׁאָר передано своим основным значением «остаток», а конструкция לוֹ — «был у Него». Написание «Духа» с прописной буквы отражает возможную отсылку к Божьему Духу, не исключая иных пониманий, указанных в примечании.
- source_word: וּמָה הָאֶחָד מְבַקֵּשׁ
  choice: Чего же искал Единый?
  rationale: Сохранены вопросительная форма и связь הָאֶחָד с ранее упомянутым «одним». Субстантивированное «Единый» естественно по-русски продолжает выбранное прочтение, относящее выражение к Богу.
- source_word: זֶרַע אֱלֹהִים
  choice: Божьего потомства
  rationale: זֶרַע в контексте брака означает «потомство». Сочетание с אֱלֹהִים передано кратко и без сведения генитива исключительно к качественному значению; буквальная форма и возможное значение «угодное Богу потомство» отмечены в сноске.
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: Итак, храните себя в духе вашем
  rationale: Возвратное «храните себя» передаёт значение нифаля, а «в духе вашем» сохраняет внутреннюю направленность и формулировку еврейского текста.
- source_word: וּבְאֵשֶׁת נְעוּרֶיךָ אַל יִבְגֹּד
  choice: и пусть никто не поступает вероломно с женой своей юности
  rationale: בגד обозначает вероломство и нарушение верности, особенно в отношениях завета. Обобщённое «пусть никто» естественно передаёт форму третьего лица единственного числа после обращения во множественном числе.
theological_decisions:
- issue: Толкование трудной первой части стиха и её связь с браком
  choice: Единый Бог сотворил супружескую чету и ищет Божьего потомства
  alternative: «Никто, в ком остался хоть дух, не сделал этого»; либо «единый» — Авраам; либо субъект фразы не поддаётся уверенному определению
  rationale: Выбранное прочтение согласуется с непосредственным контекстом об измене брачному завету, но синтаксис еврейского текста остаётся исключительно трудным, поэтому основные альтернативы прямо приведены в сноске.
- issue: Отнесение רוּחַ к Божьему Духу
  choice: Дух с прописной буквы
  alternative: человеческий дух или жизненное дыхание
  rationale: В еврейском письме различие прописных и строчных букв отсутствует. Прописная буква обозначает возможную отсылку к Божьему Духу, но не выдаёт её за бесспорную.
- issue: Значение сочетания זֶרַע אֱלֹהִים
  choice: Божье потомство
  alternative: потомство, угодное Богу; буквально «семя Бога»
  rationale: Русское выражение сохраняет генитивную неоднозначность исходного текста и остаётся понятным в брачном контексте; качественное толкование не навязывается как единственно возможное.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Сохранены краткие риторические вопросы, заветная окраска слова «вероломно» и намеренная неоднозначность особенно трудного еврейского синтаксиса.
