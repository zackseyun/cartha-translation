  text: And now[a], this command is for you, O priests.
translation:
  language: ru
  text: И ныне эта заповедь — для вас, священники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: И ныне
  rationale: Сохраняет и соединительный элемент, и переход к непосредственному обращению; «ныне» придаёт пророческой речи dignified, но понятное современному читателю звучание.
- source_word: אֲלֵיכֶם
  choice: к вам
  rationale: 'Буквально передаёт направленность предлога אֶל и естественно сочетается по-русски с подразумеваемым смыслом: заповедь обращена к священникам.'
- source_word: הַמִּצְוָה
  choice: заповедь
  rationale: Обычный и точный русский эквивалент מִצְוָה в библейском контексте; здесь обозначает властное Божье повеление.
- source_word: הַזֹּאת
  choice: эта
  rationale: Прямо передаёт указательное определение и занимает естественную позицию перед существительным в русском языке.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Передаёт форму обращения; в русском языке звательный смысл ясно выражается контекстом и пунктуацией без архаического «о».
