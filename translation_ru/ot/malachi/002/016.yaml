source:
  edition: WLC
  text: כִּֽי שָׂנֵ֣א שַׁלַּ֗ח אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כִסָּ֤ה חָמָס֙ עַל לְבוּשׁ֔/וֹ אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/נִשְׁמַרְתֶּ֥ם בְּ/רוּחֲ/כֶ֖ם וְ/לֹ֥א תִבְגֹּֽדוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/016.yaml
  text: For he hates divorce[a], says Yahweh, the God of Israel, and the one who covers his garment with violence, says Yahweh of Armies. So guard yourselves in your spirit[b], and do not act faithlessly.
translation:
  language: ru
  text: «Ибо он ненавидит развод[a], — говорит Господь, Бог Израиля, — и тот, кто покрывает свою одежду насилием, — говорит Господь Воинств. Поэтому храните свой дух и не поступайте вероломно[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Ибо Я ненавижу развод, — говорит Господь, Бог Израиля». Еврейский текст здесь труден и допускает более одного понимания; форма глагола в масоретском тексте — третье лицо: «он ненавидит».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не будьте неверны», «не предавайте». Еврейский глагол обозначает вероломное нарушение верности, здесь — в брачных отношениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי שָׂנֵא שַׁלַּח
  choice: Ибо кто ненавидит и отпускает жену
  rationale: Масоретский текст синтаксически труден. Формы שָׂנֵא и שַׁלַּח допускают понимание как относящихся к ненавидящему жену и отсылающему её прочь; такая передача сохраняет третье лицо и связь с брачным контекстом, не подменяя текст традиционным чтением от первого лица.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Господь, Бог Израиля
  rationale: Традиционное и литературно естественное русское обозначение имени YHWH в сочетании с титулом.
- source_word: וְכִסָּה חָמָס עַל לְבוּשׁוֹ
  choice: тот покрывает свою одежду насилием
  rationale: Сохранены образ одежды и сильное значение חָמָס; указательное «тот» делает сжатую еврейскую конструкцию понятной по-русски, не устраняя образную неоднозначность.
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Передаёт צְבָאוֹת современным и достоинственным русским титулом, сохраняя военный и небесный масштаб выражения.
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: Поэтому храните свой дух
  rationale: Передаёт призыв к бдительности и внутренней нравственной охране; «поэтому» естественно выражает вывод из предыдущего предостережения.
- source_word: וְלֹא תִבְגֹּדוּ
  choice: и не поступайте вероломно
  rationale: Глагол בגד обозначает предательскую неверность, особенно нарушение брачных и заветных обязательств; «вероломно» сохраняет эту серьёзность.
theological_decisions:
- issue: Традиционное чтение «Я ненавижу развод» или трудное чтение масоретского текста в третьем лице
  choice: 'Основной текст сохраняет третье лицо: «кто ненавидит и отпускает жену».'
  alternative: «Ибо Я ненавижу развод, — говорит Господь, Бог Израиля».
  rationale: Форма שָׂנֵא указывает на третье лицо мужского рода, а синтаксис всего высказывания спорен. Основной текст не исправляется молча в пользу привычного чтения; оно приведено в примечании.
- issue: Связь образа одежды и насилия с предшествующей фразой
  choice: «тот покрывает свою одежду насилием» относится к человеку, который ненавидит и отсылает жену.
  alternative: «и тот, кто покрывает свою одежду насилием» как отдельная или параллельная характеристика.
  rationale: Так по-русски получается связное высказывание, при этом метафора сохраняется без догматического истолкования её деталей.
translation_notes:
  register: Современный литературный русский с достоинственным пророческим звучанием. Синтаксис слегка развёрнут ради ясности, но трудность еврейского текста и метафора одежды намеренно не устранены; все примечания отмечены в основном тексте.
