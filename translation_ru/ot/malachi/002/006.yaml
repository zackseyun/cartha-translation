id: MAL.2.6
reference: Malachi 2:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: תּוֹרַ֤ת אֱמֶת֙ הָיְתָ֣ה בְּ/פִ֔י/הוּ וְ/עַוְלָ֖ה לֹא נִמְצָ֣א בִ/שְׂפָתָ֑י/ו בְּ/שָׁל֤וֹם וּ/בְ/מִישׁוֹר֙ הָלַ֣ךְ אִתִּ֔/י וְ/רַבִּ֖ים הֵשִׁ֥יב מֵ/עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/006.yaml
  text: The law of truth was in his mouth[a], and no injustice was found on his lips. He walked with me in peace and uprightness[c][b], and he turned many back from iniquity.
translation:
  language: ru
  text: Истинное наставление было в его устах[a], и неправды не было на его губах. В мире и праведности он ходил со Мной и многих отвратил от беззакония[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Закон истины был в его устах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «многих побудил обратиться от греха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת אֱמֶת
  choice: истинное наставление
  rationale: В контексте служения священника תּוֹרָה обозначает авторитетное наставление в Божьем законе. Русское «истинное наставление» естественно передаёт конструкцию и не сужает её до законодательного свода; вариант с «законом истины» сохранён в сноске.
- source_word: בְּפִיהוּ
  choice: в его устах
  rationale: Сохраняет еврейский образ речи и учительства и звучит естественно в возвышенном современном русском.
- source_word: עַוְלָה
  choice: неправда
  rationale: Слово охватывает ложь, неправедность и несправедливость; в контексте губ и наставления «неправда» передаёт как речевой, так и нравственный аспект.
- source_word: נִמְצָא בִשְׂפָתָיו
  choice: не было на его губах
  rationale: Естественная русская передача буквального «не была найдена на его губах» с сохранением образа губ.
- source_word: בְּשָׁלוֹם וּבְמִישׁוֹר
  choice: в мире и праведности
  rationale: «Мир» сохраняет значение целостности и согласия, а «праведность» естественно выражает переносный смысл прямоты и честности слова מִישׁוֹר.
- source_word: הָלַךְ אִתִּי
  choice: ходил со Мной
  rationale: Сохраняет значимый заветный образ хождения с Богом, не сводя его к общему «жил» или «поступал».
- source_word: הֵשִׁיב
  choice: отвратил
  rationale: 'Передаёт каузативное значение породы Hiphil: он побудил многих отвернуться и вернуться с дурного пути.'
- source_word: מֵעָוֺן
  choice: от беззакония
  rationale: В данном контексте עָוֹן обозначает нравственную порочность или грех, от которого людей обращают; «беззаконие» сохраняет тяжесть и богословскую ёмкость слова.
theological_decisions:
- issue: Характер священнической Торы
  choice: «Истинное наставление» в основном тексте с альтернативой «закон истины» в сноске.
  alternative: «Закон истины был в его устах».
  rationale: Контекст указывает на учительское служение священника, однако תּוֹרָה сохраняет связь с Божьим законом. Основной текст передаёт контекстуальный смысл, а сноска сохраняет более формальную возможность.
- issue: Заветный образ хождения с Богом
  choice: Сохранено «ходил со Мной».
  alternative: «жил в общении со Мной»; «поступал предо Мной».
  rationale: Буквальный образ несёт одновременно нравственный и relationalный смысл и не требует от перевода выбирать лишь одно его объяснение.
- issue: Каузативный смысл обращения от греха
  choice: «многих отвратил от беззакония».
  alternative: «многих вернул от беззакония»; «побудил многих обратиться от греха».
  rationale: Формулировка сохраняет активное воздействие священнического наставления, не уточняя сверх текста, каким именно образом произошло обращение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Образы «в устах», «на губах» и «ходил со Мной» сохранены как ясные и богословски насыщенные. Местоимение «Мной» написано с прописной буквы по принятой русской библейской издательской норме.
