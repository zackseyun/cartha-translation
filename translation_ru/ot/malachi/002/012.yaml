base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/012.yaml
  text: May Yahweh cut off from the tents of Jacob the man who does this[a], him who is awake and him who answers, and him who brings an offering to Yahweh of hosts.
translation:
  language: ru
  text: Да истребит Яхве из шатров Иакова всякого, кто делает это, — бодрствующего и отвечающего[a], — и приносящего дар Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бодрствующего и отвечающего». Смысл еврейского выражения неясен; возможно, это идиома со значением «свидетель и защитник» либо оборот, охватывающий всех причастных.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַכְרֵת
  choice: да истребит
  rationale: Форма imperfect в контексте пророческого осуждения естественно передаётся как пожелание-проклятие; «истребит» выражает удаление из общины.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменено титулом.
- source_word: לָאִישׁ אֲשֶׁר יַעֲשֶׂנָּה
  choice: всякого, кто делает это
  rationale: Хотя существительное имеет мужской род и единственное число, оборот обозначает любого совершающего названный поступок; такой русский вариант сохраняет обобщающий смысл.
- source_word: עֵר וְעֹנֶה
  choice: бодрствующего и отвечающего
  rationale: Сохранены наиболее прямые значения причастий без устранения неясности трудного идиоматического выражения.
- source_word: מֵאָהֳלֵי יַעֲקֹב
  choice: из шатров Иакова
  rationale: Сохранён образ шатров как обозначение сообщества потомков Иакова.
- source_word: מִנְחָה
  choice: дар
  rationale: Слово может означать дар, приношение или хлебное приношение; «дар» сохраняет широту значения и культовый контекст.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Переданы и личное имя, и буквальный образ צְבָאוֹת — небесных или воинских сил.
theological_decisions:
- issue: Сила начального imperfect в контексте осуждения
  choice: да истребит
  alternative: Яхве истребит
  rationale: Контекст допускает и лучше поддерживает проклинающее пожелание, а не только предсказание будущего.
- issue: Значение выражения עֵר וְעֹנֶה
  choice: буквально передать «бодрствующего и отвечающего» и пояснить неясность в сноске
  alternative: свидетеля и защитника; всех без исключения
  rationale: Точное идиоматическое значение неизвестно, поэтому перевод не должен закреплять одну гипотезу как несомненную.
- issue: Связь וּמַגִּישׁ с предшествующим выражением
  choice: и того, кто приносит
  alternative: хотя он приносит; и всё же приносит
  rationale: Простой союз не требует добавления уступительного оттенка; формулировка сохраняет возможное перечисление лиц или характеристик.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис сохраняет резкость формулы суда, а сноска удерживает подлинную лексическую неопределённость.
