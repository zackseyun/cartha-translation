- from: Если вы не послушаете и не примете близко к сердцу, что нужно воздать славу Моему имени, — говорит Яхве Воинств[a], — то Я пошлю к вам проклятие и прокляну ваши благословения. Более того, Я уже проклял их[b], потому что вы не принимаете этого близко к сердцу.
  to: Если вы не послушаете и не отнесётесь всерьёз к тому, чтобы воздать славу Моему имени, — говорит Яхве Воинств[a], — то Я пошлю на вас проклятие и прокляну ваши благословения. Более того, Я уже проклял их[b], потому что вы не относитесь к этому всерьёз.
