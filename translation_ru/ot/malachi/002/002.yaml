source:
  edition: WLC
  text: אִם לֹ֣א תִשְׁמְע֡וּ וְ/אִם לֹא֩ תָשִׂ֨ימוּ עַל לֵ֜ב לָ/תֵ֧ת כָּב֣וֹד לִ/שְׁמִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וְ/שִׁלַּחְתִּ֤י בָ/כֶם֙ אֶת הַ/מְּאֵרָ֔ה וְ/אָרוֹתִ֖י אֶת בִּרְכֽוֹתֵי/כֶ֑ם וְ/גַם֙ אָרוֹתִ֔י/הָ כִּ֥י אֵינְ/כֶ֖ם שָׂמִ֥ים עַל לֵֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/002.yaml
  text: If you will not listen[a], and if you will not take it to heart to give glory to my name, says Yahweh of Armies, then I will send the curse among you, and I will curse your blessings; indeed, I have already cursed them[b], because you are not taking it to heart.
translation:
  language: ru
  text: Если вы не послушаете и не отнесётесь всерьёз к тому, чтобы воздать славу Моему имени, — говорит Яхве Воинств[a], — то Я пошлю на вас проклятие и прокляну ваши благословения. Более того, Я уже проклял их[b], потому что вы не относитесь к этому всерьёз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь Воинств»; традиционно: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст можно также понять: «Я также прокляну их»; формально местоименный суффикс имеет единственное число: «Я проклял это».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמְעוּ
  choice: послушаете
  rationale: Глагол שׁמע обозначает слышание и внимательное слушание, а в контексте заветного предостережения подразумевает также послушание. «Послушаете» сохраняет обе смысловые стороны без чрезмерного уточнения.
- source_word: תָשִׂימוּ עַל לֵב
  choice: примете близко к сердцу
  rationale: Современный русский оборот естественно передаёт еврейскую идиому о серьёзном внутреннем внимании; его повторение в конце стиха сохраняет риторическую структуру оригинала.
- source_word: לָתֵת כָּבוֹד לִשְׁמִי
  choice: воздать славу Моему имени
  rationale: «Слава» сохраняет богословскую и пророческую окраску כָּבוֹד, а «Моему имени» прямо передаёт предмет почитания.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צבאות — прозрачным современным словом «Воинств»; традиционный вариант отмечен в сноске.
- source_word: וְשִׁלַּחְתִּי בָכֶם אֶת הַמְּאֵרָה
  choice: Я пошлю к вам проклятие
  rationale: «Пошлю к вам» естественно передаёт направление бедствия в среду адресатов, не делая проклятие отвлечённым и не усиливая предлог до непременно пространственного «на вас».
- source_word: וְאָרוֹתִי אֶת בִּרְכוֹתֵיכֶם
  choice: прокляну ваши благословения
  rationale: 'Буквальный объект «ваши благословения» сохранён, чтобы не устранять возможную двусмысленность: речь может идти о полученных ими благах либо о произносимых ими благословениях.'
- source_word: וְגַם אָרוֹתִיהָ
  choice: Более того, Я уже проклял их
  rationale: Перфект естественно указывает на уже начавшееся действие, а גם усиливает утверждение. Русское множественное «их» соотносит местоимение с «благословениями», при этом формальная неоднозначность еврейского суффикса отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит собственное заветное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Временная сила перфекта אָרוֹתִיהָ
  choice: Я уже проклял их
  alternative: Я также прокляну их
  rationale: Переход от будущей угрозы к перфекту вероятнее всего показывает, что суд уже начался. Однако пророческое употребление перфекта допускает понимание будущего действия, поэтому альтернатива сохранена в сноске.
- issue: Референт «ваших благословений»
  choice: сохранить без поясняющей конкретизации
  alternative: превращу дарованные вам блага в проклятие / прокляну благословения, которые вы произносите
  rationale: Контекст допускает понимание как благословений, получаемых священниками, так и благословений, произносимых ими. Перевод не разрешает эту богословски значимую неоднозначность за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Синтаксис предупреждения сохранён, но разбит знаками препинания для ясности. Повтор идиомы «принять близко к сердцу» намеренно воспроизведён.
