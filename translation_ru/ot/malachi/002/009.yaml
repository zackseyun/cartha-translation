source:
  edition: WLC
  text: וְ/גַם אֲנִ֞י נָתַ֧תִּי אֶתְ/כֶ֛ם נִבְזִ֥ים וּ/שְׁפָלִ֖ים לְ/כָל הָ/עָ֑ם כְּ/פִ֗י אֲשֶׁ֤ר אֵֽינְ/כֶם֙ שֹׁמְרִ֣ים אֶת דְּרָכַ֔/י וְ/נֹשְׂאִ֥ים פָּנִ֖ים בַּ/תּוֹרָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/009.yaml
  text: So I also have made you despised and abased before all the people[a], because you are not keeping my ways but are showing partiality in the law.
translation:
  language: ru
  text: Поэтому и Я сделал вас презренными и униженными перед всем народом, потому что вы не храните Моих путей и проявляете лицеприятие в законе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в наставлении»; или: «в Торе».'
    reason: Слово תּוֹרָה может обозначать закон, наставление или Тору как корпус Божьего учения.
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Поэтому и Я
  rationale: Связка продолжает предшествующее обличение и подчёркивает ответное действие Бога; «поэтому» естественно передаёт контекстуальное следствие, а «и Я» сохраняет эмфатическое местоимение.
- source_word: נָתַתִּי אֶתְכֶם
  choice: сделал вас
  rationale: 'При последующих предикативных прилагательных נתן имеет результативное значение: Бог сделал их такими в глазах народа.'
- source_word: נִבְזִים וּשְׁפָלִים
  choice: презренными и униженными
  rationale: «Презренными» передаёт общественное презрение, а «униженными» — понижение положения и публичное посрамление, не усиливая смысл сверх еврейского текста.
- source_word: לְכָל הָעָם
  choice: перед всем народом
  rationale: Предлог לְ здесь обозначает общественную сферу, в которой священники оказались презренными и униженными.
- source_word: כְּפִי אֲשֶׁר
  choice: потому что
  rationale: В данном контексте выражение вводит основание Божьего суда; причинная передача ясна и естественна по-русски.
- source_word: אֵינְכֶם שֹׁמְרִים אֶת דְּרָכַי
  choice: вы не храните Моих путей
  rationale: «Хранить» сохраняет заветную лексику שׁמר и образ «путей», оставаясь понятным в современном литературном русском.
- source_word: וְנֹשְׂאִים פָּנִים
  choice: и проявляете лицеприятие
  rationale: Устойчивый древнееврейский оборот означает пристрастное отношение; «проявлять лицеприятие» точно передаёт смысл в правовом и религиозном контексте.
- source_word: בַּתּוֹרָה
  choice: в законе
  rationale: В контексте священнического наставления и применения Божьих установлений «закон» передаёт судебно-заветный аспект תּוֹרָה; более широкие варианты сохранены в сноске.
theological_decisions:
- issue: Значение תּוֹרָה в священническом контексте
  choice: в законе
  alternative: в наставлении; в Торе
  rationale: Основной вариант ясно указывает на Божий нормативный порядок, с которым священники обращались пристрастно, но сноска сохраняет более широкий смысл «наставление» и специфическое обозначение «Тора».
- issue: Характер публичного посрамления
  choice: презренными и униженными перед всем народом
  alternative: презренными и низкими для всего народа
  rationale: Выбранная формулировка выражает Божий суд как утрату общественного достоинства и положения, не превращая прилагательные в утверждение о внутренней нравственной природе адресатов.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены эмфатическое «Я», заветный образ «Моих путей» и юридически уместное «лицеприятие». Маркер сноски поставлен непосредственно после слова, к которому относится.
