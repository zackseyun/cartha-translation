  text: וִֽ/ידַעְתֶּ֕ם כִּ֚י שִׁלַּ֣חְתִּי אֲלֵי/כֶ֔ם אֵ֖ת הַ/מִּצְוָ֣ה הַ/זֹּ֑את לִֽ/הְי֤וֹת בְּרִיתִ/י֙ אֶת לֵוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/004.yaml
  text: Then you will know that I have sent this command to you[a], that my covenant with Levi may be[b], says Yahweh of Armies.
translation:
  language: ru
  text: Тогда вы узнаете, что Я послал вам это повеление, чтобы существовал Мой завет с Левием[a], — говорит Яхве Воинств[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь сжат. Возможный смысл: «чтобы Мой завет с Левием продолжал действовать»; возможно также понимание: «чтобы это повеление было Моим заветом с Левием».'
    reason: alternative_reading
  - marker: b
    text: 'Традиционный перевод: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: Перфект с союзом ו в данном пророческом контексте выражает последующий результат объявленного суда; «тогда» естественно передаёт эту связь.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что адресаты узнают, а не причину.
- source_word: שִׁלַּחְתִּי
  choice: Я послал
  rationale: Перфект обозначает совершённое действие, результат которого актуален для адресатов; русское прошедшее время передаёт это без лишнего уточнения.
- source_word: אֲלֵיכֶם
  choice: вам
  rationale: Предлог אֶל указывает на направленность к адресатам; здесь повеление послано им, а не обязательно «против» них.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: это повеление
  rationale: מִצְוָה означает приказ или предписание; «повеление» звучит естественно и достойно в пророческой речи.
- source_word: לִהְיוֹת
  choice: чтобы был
  rationale: Инфинитив передан близко к форме и смысловой сжатости еврейского текста, без добавления идеи продолжения, которой прямо нет в данной форме.
- source_word: בְּרִיתִי אֶת־לֵוִי
  choice: Мой завет с Левием
  rationale: אֶת здесь выражает совместность — «с»; имя Левия сохранено в единственном числе, хотя в контексте оно может представлять левитское священство в целом.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת переведено словом «Воинств», сохраняющим множественное число и военный образ титула.
theological_decisions:
- issue: Смысл целевой конструкции לִהְיוֹת בְּרִיתִי אֶת־לֵוִי
  choice: «чтобы был Мой завет с Левием»
  alternative: «чтобы Мой завет с Левием продолжал действовать»; либо «это повеление было Моим заветом с Левием»
  rationale: Еврейская конструкция предельно сжата и допускает разные смысловые связи. Основной текст сохраняет эту напряжённость и не вводит прямо не выраженную идею продолжения; примечание сообщает более истолковывающий вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис намеренно сохраняет некоторую сжатость спорной еврейской целевой конструкции; тире естественно вводит формулу божественной речи.
