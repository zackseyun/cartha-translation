  text: בְּרִיתִ֣/י הָיְתָ֣ה אִתּ֗/וֹ הַֽ/חַיִּים֙ וְ/הַ֨/שָּׁל֔וֹם וָ/אֶתְּנֵֽ/ם ל֥/וֹ מוֹרָ֖א וַ/יִּֽירָאֵ֑/נִי וּ/מִ/פְּנֵ֥י שְׁמִ֖/י נִחַ֥ת הֽוּא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/005.yaml
  text: My covenant with him was one of life and peace[a], and I gave them to him; this called for reverence, and he revered me[b], and he stood in awe before my name.
translation:
  language: ru
  text: «Мой завет с ним был заветом жизни и мира. Я даровал ему их, чтобы пробудить благоговейный страх[a]; и он боялся Меня и трепетал перед Моим именем[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я дал их ему — страх»; еврейская конструкция сжата и допускает также понимание: «дал их ему ради страха», «дал их ему в страхе» или «дал ему и страх».'
    reason: Сохраняется синтаксическая неоднозначность выражения וָאֶתְּנֵם לוֹ מוֹרָא.
  - marker: b
    text: 'Или: «смирялся», «был потрясён» либо «приходил в смятение перед Моим именем».'
    reason: Нифаль глагола חתת может обозначать трепет, сокрушённость, потрясение или смятение.
lexical_decisions:
- source_word: בְּרִיתִי הָיְתָה אִתּוֹ
  choice: Мой завет с ним был заветом
  rationale: Сохраняет принадлежность завета Богу и его отношение к Левию; повтор слова «завет» делает русское предложение ясным и естественным.
- source_word: הַחַיִּים וְהַשָּׁלוֹם
  choice: жизни и мира
  rationale: «Жизнь» и «мир» — прямые и традиционные соответствия; «мир» здесь может также включать благополучие и целостность.
- source_word: וָאֶתְּנֵם לוֹ
  choice: Я даровал ему их
  rationale: Местоименное окончание мужского рода множественного числа естественно отнесено к жизни и миру; «даровал» передаёт благой дар завета и звучит литературно.
- source_word: מוֹרָא
  choice: чтобы пробудить благоговейный страх
  rationale: Существительное обозначает страх или трепет, однако его синтаксическая связь с предшествующим глаголом сжата и неоднозначна. Формулировка передаёт вызванное дарами завета благоговение, а неоднозначность отмечена в сноске.
- source_word: וַיִּירָאֵנִי
  choice: и он боялся Меня
  rationale: Прямо передаёт глагол ירא и сохраняет лексическую связь со словом מוֹרָא, не сводя серьёзность выражения лишь к почтению.
- source_word: וּמִפְּנֵי שְׁמִי נִחַת הוּא
  choice: и трепетал перед Моим именем
  rationale: «Перед Моим именем» сохраняет пространственную метафору; «трепетал» естественно выражает смирённый страх и потрясённость, возможные для нифаля חתת в положительном контексте.
theological_decisions:
- issue: Характер ответа священника на Божий завет
  choice: Благоговейный страх, выраженный словами «боялся» и «трепетал»
  alternative: Ужас, подавленность или смятение перед Богом
  rationale: מוֹרָא и ירא действительно обозначают страх, но положительный контекст завета жизни и мира указывает на почтительный, благоговейный страх. При этом прямое «боялся» сохраняет вес и напряжение исходной формулировки.
- issue: Связь слова מוֹרָא с дарованием жизни и мира
  choice: Дары завета должны были пробудить благоговейный страх
  alternative: Страх мог быть ещё одним даром либо указывать на условие или цель дарования
  rationale: Еврейский синтаксис после «Я дал их ему» предельно сжат. Основной текст предлагает связное контекстуальное прочтение, а сноска сохраняет реальные альтернативы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Основной текст остаётся плавным, а трудная еврейская конструкция и диапазон значений חתת вынесены в сноски.
