  terminology: «Завет», «жизнь», «мир», «даровал», «боялся» и «благоговейный страх» последовательно передают ключевую лексику без конфессионального сужения. «Мир» сохраняет традиционный библейский эквивалент שָׁלוֹם; его более широкий оттенок благополучия не утрачен. Сноска b адекватно отражает диапазон нифаля חתת.
