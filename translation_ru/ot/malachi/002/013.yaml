source:
  edition: WLC
  text: וְ/זֹאת֙ שֵׁנִ֣ית תַּֽעֲשׂ֔וּ כַּסּ֤וֹת דִּמְעָה֙ אֶת מִזְבַּ֣ח יְהוָ֔ה בְּכִ֖י וַֽ/אֲנָקָ֑ה מֵ/אֵ֣ין ע֗וֹד פְּנוֹת֙ אֶל הַ/מִּנְחָ֔ה וְ/לָ/קַ֥חַת רָצ֖וֹן מִ/יֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/013.yaml
  text: 'And this second thing you do: you cover the altar of Yahweh with tears[a], with weeping and groaning, because he no longer regards the offering or accepts it with favor from your hand.'
translation:
  language: ru
  text: 'И вот ещё что вы делаете: вы покрываете жертвенник Яхве слезами, плачем и стонами, потому что Он больше не обращает внимания на приношение[a] и не принимает его благосклонно из ваших рук.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлебное приношение». Еврейское מִנְחָה может обозначать определённый вид приношения из зерна или муки либо, в более широком смысле, приношение вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת שֵׁנִית
  choice: И вот второе, что вы делаете
  rationale: Передаёт ввод нового, второго обвинения и сохраняет порядковое значение שֵׁנִית в естественной русской конструкции.
- source_word: כַּסּוֹת דִּמְעָה אֶת מִזְבַּח יְהוָה
  choice: вы покрываете жертвенник Яхве слезами
  rationale: Глагол כסה буквально означает «покрывать»; образ сохранён без усиления до «заливаете».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּכִי וַאֲנָקָה
  choice: плачем и стонами
  rationale: Естественное и образное соответствие словам о плаче и слышимых проявлениях страдания.
- source_word: מֵאֵין עוֹד פְּנוֹת אֶל הַמִּנְחָה
  choice: потому что Он больше не обращает внимания на приношение
  rationale: Оборот с פנה передаёт прекращение благосклонного внимания; причинная связь естественно следует из контекста.
- source_word: הַמִּנְחָה
  choice: приношение
  rationale: מִנְחָה может обозначать как конкретное хлебное приношение, так и приношение шире; основной текст сохраняет более широкое значение, а конкретная возможность отмечена в сноске.
- source_word: וְלָקַחַת רָצוֹן מִיֶּדְכֶם
  choice: и не принимает его с благоволением из ваших рук
  rationale: Передаёт сочетание идеи принятия с רָצוֹן — благоволением или одобрением — и сохраняет образ получения из рук приносящих.
theological_decisions:
- issue: Подразумеваемое подлежащее глаголов в заключительной части стиха
  choice: Подлежащее — Яхве, выраженное местоимением «Он»
  alternative: 'Оставить конструкцию безличной: «приношению больше не уделяется внимания»'
  rationale: Еврейская конструкция сжата, однако контекст ясно говорит об отказе Яхве принять поклонение. Местоимение делает русский текст понятным, не вводя нового богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Сохранены яркий образ покрытого слезами жертвенника и личное имя Яхве; синтаксис слегка распрямлён ради естественности русского текста.
