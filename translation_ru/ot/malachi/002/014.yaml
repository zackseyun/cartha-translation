id: MAL.2.14
reference: Malachi 2:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֖ם עַל מָ֑ה עַ֡ל כִּי יְהוָה֩ הֵעִ֨יד בֵּינְ/ךָ֜ וּ/בֵ֣ין אֵ֣שֶׁת נְעוּרֶ֗י/ךָ אֲשֶׁ֤ר אַתָּה֙ בָּגַ֣דְתָּה בָּ֔/הּ וְ/הִ֥יא חֲבֶרְתְּ/ךָ֖ וְ/אֵ֥שֶׁת בְּרִיתֶֽ/ךָ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/014.yaml
  text: But you say[a], “Why?” Because Yahweh has been a witness between you and the wife of your youth, to whom you have been unfaithful[b], though she is your companion and your wife by covenant.
translation:
  language: ru
  text: 'Но вы говорите: «Почему?» Потому что Яхве был свидетелем между тобой и женой твоей юности, с которой ты поступил вероломно[a], хотя она — твоя спутница и твоя жена по завету[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую ты предал»; еврейский глагол может обозначать вероломство, предательство или нарушение верности, особенно в отношениях завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жена твоего завета»; возможно также: «жена, связанная с тобой заветом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Но вы спрашиваете
  rationale: Форма буквально означает «и/но вы говорите», однако далее следует вопрос «За что?». В современном русском «вы спрашиваете» естественно вводит прямой вопрос, а «но» передаёт возражение народа в контексте.
- source_word: עַל־מָה
  choice: За что?
  rationale: В данном контексте вопрос касается причины Божьего неприятия, поэтому русское «За что?» передаёт краткость и риторическую силу еврейского выражения.
- source_word: עַל כִּי
  choice: За то, что
  rationale: Ответ намеренно перекликается с вопросом «За что?». Такая формулировка сохраняет повтор עַל и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: הֵעִיד
  choice: был свидетелем
  rationale: Глагол имеет судебно-заветный оттенок свидетельства. Формулировка показывает, что Яхве выступает свидетелем отношений между супругами.
- source_word: אֵשֶׁת נְעוּרֶיךָ
  choice: жена твоей юности
  rationale: Сохранён выразительный еврейский образ женщины, с которой мужчина соединился в молодости.
- source_word: אֲשֶׁר אַתָּה בָּגַדְתָּה בָּהּ
  choice: с которой ты поступил вероломно
  rationale: בגד обозначает предательство, вероломство и нарушение верности, особенно в контексте заветных отношений. Русская формулировка сохраняет серьёзность обвинения.
- source_word: חֲבֶרְתְּךָ
  choice: твоя спутница
  rationale: Слово обозначает близкую соучастницу жизни; «спутница» естественно и достойно звучит в брачном контексте.
- source_word: אֵשֶׁת בְּרִיתֶךָ
  choice: жена, связанная с тобой заветом
  rationale: Формулировка ясно передаёт, что брак понимается как завет, и избегает менее естественного буквального оборота «жена твоего завета».
theological_decisions:
- issue: Заветный характер брака и вероломство мужа
  choice: Сохранить явное упоминание завета и передать בגד как «поступить вероломно».
  alternative: Передать как обычную супружескую неверность, не подчёркивая заветный смысл.
  rationale: Сочетание בגד и ברית придаёт обвинению не только межличностный, но и заветно-правовой вес. Перевод сохраняет этот смысл, не уточняя форму измены сверх сказанного в тексте.
- issue: Связь Яхве с брачным спором
  choice: «Яхве был свидетелем между тобой и женой».
  alternative: «Яхве свидетельствовал против тебя».
  rationale: Предлог בֵּין…וּבֵין буквально помещает Яхве как свидетеля между двумя сторонами. Возможный обвинительный оттенок возникает из контекста, но не должен подменять более широкую формулировку оригинала.
translation_notes:
  register: 'Современный литературный русский с достоинством пророческой речи. Сохранён переход от множественного «вы» к единственному «ты», присутствующий в еврейском тексте: народ возражает как группа, затем обвинение обращено к каждому мужу лично. Тире перед именной частью подчёркивает уступительное противопоставление без излишней архаизации.'
