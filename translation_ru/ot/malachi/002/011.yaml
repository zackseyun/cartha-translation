  text: בָּגְדָ֣ה יְהוּדָ֔ה וְ/תוֹעֵבָ֛ה נֶעֶשְׂתָ֥ה בְ/יִשְׂרָאֵ֖ל וּ/בִ/ירֽוּשָׁלִָ֑ם כִּ֣י חִלֵּ֣ל יְהוּדָ֗ה קֹ֤דֶשׁ יְהוָה֙ אֲשֶׁ֣ר אָהֵ֔ב וּ/בָעַ֖ל בַּת אֵ֥ל נֵכָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/011.yaml
  text: Judah has acted treacherously[a], and an abomination has been committed in Israel and in Jerusalem, for Judah has profaned the sanctuary of Yahweh, which he loves[b], and has married the daughter of a foreign god.
translation:
  language: ru
  text: 'Иуда поступил вероломно, и в Израиле и Иерусалиме совершена мерзость: Иуда осквернил святыню Яхве, которую Он любит[a], и взял в жёны дочь чужого бога[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также понять как «святилище Яхве», «святость Яхве» или как указание на освящённый народ; его точный референт неясен. Субъект слова «любит» в еврейском тексте прямо не назван; возможно также: «которую он любил», то есть Иуда.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «дочь чужого бога»; вероятно, имеется в виду женщина, связанная с почитанием чужого божества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּגְדָה
  choice: поступил вероломно
  rationale: Передаёт нравственную и заветную неверность, не уточняя прямо, против кого направлено предательство.
- source_word: תוֹעֵבָה
  choice: мерзость
  rationale: Сохраняет сильную нравственно-культовую оценку, характерную для пророческой речи.
- source_word: נֶעֶשְׂתָה
  choice: совершена
  rationale: Сохраняет страдательную форму и естественно сочетается в русском языке со словом «мерзость».
- source_word: חִלֵּל
  choice: осквернил
  rationale: Естественно передаёт лишение священного его почитаемого статуса; возможное «поругание» здесь менее точно.
- source_word: קֹדֶשׁ יְהוָה
  choice: святыню Яхве
  rationale: Русское «святыня» сохраняет предметную неопределённость еврейского выражения лучше, чем узкое «святилище», и естественнее буквального «святость Яхве» в данном синтаксисе.
- source_word: אֲשֶׁר אָהֵב
  choice: которую Он любит
  rationale: Мужской род еврейского относительного местоимения не различает здесь род, а совершенный вид допускает устойчивое настоящее значение. Заглавное «Он» ясно указывает на Яхве, оставаясь естественным в русском библейском регистре.
- source_word: וּבָעַל
  choice: взял в жёны
  rationale: При женщине как объекте глагол означает вступление в брак; выражение естественно и сохраняет активную ответственность Иуды.
- source_word: בַּת אֵל נֵכָר
  choice: дочь чужого бога
  rationale: Сохранён буквальный, религиозно окрашенный образ, а не сведён к этническому обозначению чужеземки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Референт выражения קֹדֶשׁ יְהוָה
  choice: «святыню Яхве» без дальнейшего уточнения
  alternative: «святилище Яхве»; «святой народ Яхве»; «святость Яхве»
  rationale: Еврейское выражение допускает несколько близких толкований. «Святыня» сохраняет неопределённость между освящённой реальностью, общиной и святыней культового порядка, не закрепляя один референт.
- issue: Антецедент אֲשֶׁר אָהֵב
  choice: «которую Он любит», где субъект любви — Яхве
  alternative: «которую он любил», где субъектом может пониматься Иуда
  rationale: Ближайшее именование Яхве и контекст Его святыни поддерживают такое прочтение, однако грамматически субъект не выражен явно; неоднозначность отмечена в сноске.
- issue: Смысл «дочери чужого бога»
  choice: сохранить буквальный религиозный образ
  alternative: «чужеземку»; «женщину, почитающую чужого бога»
  rationale: Фраза подчёркивает связь брака с чужим культом, а не просто с иной этнической принадлежностью.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис энергичный, но понятный; сохранены сильные слова «вероломно», «мерзость», «осквернил». «Святыня» выбрана для естественного сохранения смысловой неоднозначности исходного текста.
