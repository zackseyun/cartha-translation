id: MAL.2.17
reference: Malachi 2:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הוֹגַעְתֶּ֤ם יְהוָה֙ בְּ/דִבְרֵי/כֶ֔ם וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה הוֹגָ֑עְנוּ בֶּ/אֱמָרְ/כֶ֗ם כָּל עֹ֨שֵׂה רָ֜ע ט֣וֹב בְּ/עֵינֵ֣י יְהוָ֗ה וּ/בָ/הֶם֙ ה֣וּא חָפֵ֔ץ א֥וֹ אַיֵּ֖ה אֱלֹהֵ֥י הַ/מִּשְׁפָּֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/017.yaml
  text: You have wearied Yahweh with your words. Yet you say[a], “How have we wearied him?” By saying, “Everyone who does evil is good in the eyes of Yahweh, and he delights in them,” or, “Where is the God of justice?”
translation:
  language: ru
  text: 'Вы утомили Яхве своими словами. Но вы говорите: «Чем мы Его утомили?» Тем, что говорите: «Всякий, кто творит зло, хорош в глазах Яхве, и такими Он доволен», или: «Где Бог правосудия[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог суда».'
    reason: Лексема מִשְׁפָּט может обозначать как правосудие и справедливый порядок, так и суд или судебное решение.
lexical_decisions:
- source_word: הוֹגַעְתֶּם / הוֹגָעְנוּ
  choice: утомили / утомили
  rationale: Порода хифиль глагола יגע выражает причинение усталости. «Утомили» сохраняет яркий антропопатический образ и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет отличие имени Бога от титула «Господь».
- source_word: בְּדִבְרֵיכֶם
  choice: своими словами
  rationale: Предлог ב указывает на средство; русское «своими словами» ясно и естественно выражает инструментальное значение.
- source_word: בַּמָּה
  choice: чем
  rationale: В данном возражении вопрос относится к средству или основанию утомления. «Чем» точно связано с последующим ответом «тем, что».
- source_word: בֶּאֱמָרְכֶם
  choice: тем, что говорите
  rationale: Оборот с инфинитивом объясняет, каким образом народ утомил Яхве; формулировка создаёт естественную русскую связь с вопросом «чем?».
- source_word: כָּל עֹשֵׂה רָע
  choice: всякий, кто творит зло
  rationale: Передано обобщающее и распределительное значение причастного оборота; «творит зло» соответствует возвышенному, но современному библейскому регистру.
- source_word: טוֹב
  choice: хорош
  rationale: Сохранено прямое значение прилагательного «хороший», не ослабляющее иронию заменой на «приемлем» или «угоден».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён понятный русскому читателю еврейский образ оценки «в глазах».
- source_word: וּבָהֶם הוּא חָפֵץ
  choice: и такими Он доволен
  rationale: חפץ выражает благоволение или удовольствие. Указательное «такими» однозначно соотносит местоимение со всеми творящими зло и естественно звучит по-русски.
- source_word: אוֹ
  choice: или
  rationale: 'Союз вводит другую форму того же циничного обвинения: либо Бог одобряет зло, либо Его справедливое действие отсутствует.'
- source_word: אַיֵּה
  choice: где
  rationale: Прямой вопрос сохраняет резкость и вызывающий тон исходного текста.
- source_word: אֱלֹהֵי הַמִּשְׁפָּט
  choice: Бог правосудия
  rationale: מִשְׁפָּט охватывает суд и справедливое установление порядка. «Правосудие» здесь естественно обозначает справедливый Божий суд и допускает указанную в сноске альтернативу.
theological_decisions:
- issue: Антропопатическое описание Яхве как утомлённого словами народа
  choice: Сохранено прямое выражение «Вы утомили Яхве»
  alternative: «Вы оскорбили Яхве» или «Вы стали бременем для Яхве»
  rationale: Еврейский текст прямо говорит о причинённой усталости. Более отвлечённая передача ослабила бы личный характер пророческого упрёка и сняла напряжение образа.
- issue: Значение מִשְׁפָּט в заключительном вопросе
  choice: правосудие
  alternative: суд
  rationale: Вопрос касается кажущегося отсутствия справедливого Божьего управления и вмешательства. «Правосудие» передаёт этот смысл, а возможное более узкое прочтение «суд» сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены диалогическая структура, повтор глагола «утомили», образ «в глазах» и резкий риторический вопрос. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
