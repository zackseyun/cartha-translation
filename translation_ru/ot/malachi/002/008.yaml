source:
  edition: WLC
  text: וְ/אַתֶּם֙ סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ הִכְשַׁלְתֶּ֥ם רַבִּ֖ים בַּ/תּוֹרָ֑ה שִֽׁחַתֶּם֙ בְּרִ֣ית הַ/לֵּוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/008.yaml
  text: But you have turned aside from the way; you have caused many to stumble in the law; you have corrupted the covenant of Levi[a], says Yahweh of hosts.
translation:
  language: ru
  text: Но вы уклонились от пути, многих заставили споткнуться в наставлении[a], исказили завет Левия, — говорит Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в законе»; еврейское слово тора может означать как «наставление», так и «закон».'
    reason: Сохраняется лексическая неоднозначность תּוֹרָה.
lexical_decisions:
- source_word: סַרְתֶּם מִן הַדֶּרֶךְ
  choice: уклонились от пути
  rationale: Сохраняет образ отклонения от пути и естественно звучит в современном литературном русском.
- source_word: הִכְשַׁלְתֶּם רַבִּים
  choice: многих заставили споткнуться
  rationale: Передаёт каузативную форму глагола כשל и сохраняет метафору нравственного и духовного падения.
- source_word: בַּתּוֹרָה
  choice: в наставлении
  rationale: В контексте обязанностей священников תּוֹרָה обозначает данное ими наставление на основании Божьего закона; предлог ב передан нейтрально как «в», без преждевременного выбора инструментального смысла.
- source_word: שִׁחַתֶּם
  choice: исказили
  rationale: Передаёт порчу и повреждение установленного завета, не сводя смысл только к юридическому нарушению.
- source_word: בְּרִית הַלֵּוִי
  choice: завет с Левием
  rationale: Хотя формально возможен генитив «завет Левия», русский оборот «с Левием» яснее выражает заветные отношения, подразумеваемые контекстом.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה как «Яхве» и сохраняет традиционную широту титула צְבָאוֹת, не ограничивая его только земными армиями.
theological_decisions:
- issue: Значение תּוֹרָה в священническом контексте
  choice: наставление
  alternative: закон
  rationale: Здесь речь идёт о том, как священники учили народ; «наставление» естественно передаёт эту функцию, тогда как значение «закон» остаётся возможным и отмечено в сноске.
- issue: Связь בְּרִית с הַלֵּוִי
  choice: завет с Левием
  alternative: завет Левия
  rationale: Выбор делает явной реляционную природу завета, не добавляя конфессионального толкования.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, непосредственно присутствующее в еврейском тексте.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм трёх обвинений сохранён; формула речи Бога отделена тире.
