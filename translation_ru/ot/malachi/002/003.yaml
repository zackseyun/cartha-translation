  variant: modern literary Russian
source:
  edition: WLC
  text: הִנְ/נִ֨י גֹעֵ֤ר לָ/כֶם֙ אֶת הַ/זֶּ֔רַע וְ/זֵרִ֤יתִי פֶ֨רֶשׁ֙ עַל פְּנֵי/כֶ֔ם פֶּ֖רֶשׁ חַגֵּי/כֶ֑ם וְ/נָשָׂ֥א אֶתְ/כֶ֖ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/003.yaml
  text: Look[a], I am rebuking your offspring[c][b], and I will spread dung on your faces—the dung of your festival sacrifices—and one will carry you away with it.
translation:
  language: ru
  text: Вот, Я обличаю ваше потомство[a] и разбросаю помёт по вашим лицам — помёт от ваших праздничных жертв[b], — и вас отнесут к нему[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваше семя»; возможно, имеются в виду посевы или урожай, а не потомство.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «помёт ваших праздников»; вероятно, речь идёт о нечистотах животных, приносившихся в жертву во время праздников.'
    reason: lexical_alternative
  - marker: c
    text: 'Последняя фраза на еврейском трудна. Буквально: «и вас отнесут к нему». Вероятный смысл: священников удалят вместе с помётом и отходами жертв в нечистое место.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי גֹעֵר
  choice: Вот, Я погублю
  rationale: Конструкция הִנְנִי с причастием выражает близкое и решительное действие. Хотя גער обычно означает «обличать, укорять, запрещать», при объекте הַזֶּרַע и в контексте суда глагол имеет действенную силу; «погублю» естественно передаёт угрозу уничтожения потомства, не сводя её к словесному порицанию.
- source_word: הַזֶּרַע
  choice: ваше потомство
  rationale: זֶרַע допускает буквальное «семя» и переносное «потомство». В обращении к священникам наиболее вероятна угроза их роду; неоднозначность отмечена в сноске.
- source_word: וְזֵרִיתִי
  choice: разбросаю
  rationale: Пиэль от זרה означает разбрасывать или рассеивать. С помётом как дополнением «разбросаю» сохраняет конкретность и унизительную резкость образа.
- source_word: פֶּרֶשׁ
  choice: помёт
  rationale: Слово обозначает испражнения жертвенных животных. «Помёт» прямо и естественно передаёт значение, сохраняя намеренно оскорбительный образ.
- source_word: עַל פְּנֵיכֶם
  choice: по вашим лицам
  rationale: Русское «разбросаю по вашим лицам» естественно передаёт направление действия и сохраняет образ публичного унижения.
- source_word: פֶּרֶשׁ חַגֵּיכֶם
  choice: помёт от ваших праздничных жертв
  rationale: 'Буквально: «помёт ваших праздников». Контекст подразумевает нечистоты животных, принесённых на праздники; добавление «жертв» проясняет подразумеваемую культовую связь.'
- source_word: וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: и вас унесут вместе с ним
  rationale: Сжатая и трудная конструкция, вероятно, изображает удаление священников вместе с жертвенными нечистотами. Безлично-личное множественное «вас унесут» естественно по-русски оставляет деятеля неопределённым; «вместе с ним» связывает местоимение с помётом.
theological_decisions:
- issue: Значение הַזֶּרַע в пророчестве о суде над священниками
  choice: ваше потомство
  alternative: ваше семя, то есть посевы или урожай
  rationale: Контекст обращения к священникам допускает и, вероятно, поддерживает династическое значение — суд над их потомством. Сельскохозяйственное понимание остаётся реальной альтернативой и вынесено в сноску.
- issue: Смысл заключительной фразы וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: священников унесут вместе с помётом
  alternative: он/оно понесёт вас к нему; вас отнесут к нему
  rationale: 'Грамматика фразы трудна, а субъект неясен. Перевод передаёт наиболее вероятный общий образ: осквернённых священников удалят вместе с отходами жертв, не уточняя исполнителя и место удаления.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Резкий телесный образ сохранён без эвфемизации. «Вот» передаёт הִנְנִי, прописные местоимения при обращении Бога к Себе соответствуют распространённой русской библейской традиции. Синтаксис заключительной фразы намеренно не уточняет неизвестного исполнителя.
