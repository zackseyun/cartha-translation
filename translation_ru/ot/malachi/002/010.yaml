  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/ל֨וֹא אָ֤ב אֶחָד֙ לְ/כֻלָּ֔/נוּ הֲ/ל֛וֹא אֵ֥ל אֶֽחָ֖ד בְּרָאָ֑/נוּ מַדּ֗וּעַ נִבְגַּד֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לְ/חַלֵּ֖ל בְּרִ֥ית אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/010.yaml
  text: Do we not all have one Father? Has not one God created us? Why then are we faithless[a], each man to his brother[b], profaning the covenant of our fathers?
translation:
  language: ru
  text: Разве у всех нас не один Отец[b]? Разве не один Бог сотворил нас? Почему же каждый вероломно поступает[a] по отношению к своему брату, оскверняя завет наших отцов[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступает предательски». Древнееврейский глагол означает вероломство, измену доверию или обязательствам, особенно в отношениях завета.'
    reason: lexical_alternative
  - marker: b
    text: «Отец» может относиться непосредственно к Богу, что поддерживает параллель «один Бог сотворил нас»; возможно и понимание общего праотца народа.
    reason: alternative_reading
  - marker: c
    text: 'Или: «завет, заключённый с нашими отцами».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא
  choice: не… ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественной русской конструкцией.
- source_word: אָב אֶחָד
  choice: один Отец
  rationale: Сохраняет единственное число и параллель с выражением «один Бог», не устраняя возможную отсылку к общему предку.
- source_word: לְכֻלָּנוּ
  choice: у всех нас
  rationale: 'Естественно передаёт конструкцию принадлежности: у всех один Отец.'
- source_word: אֵל אֶחָד
  choice: один Бог
  rationale: Прямо передаёт монотеистический акцент исходного текста.
- source_word: בְּרָאָנוּ
  choice: сотворил нас
  rationale: Глагол «сотворил» точно и достойно передаёт ברא применительно к Божьему творению.
- source_word: מַדּוּעַ
  choice: почему же
  rationale: «Же» естественно связывает обличительный вопрос с двумя предшествующими утверждениями.
- source_word: נִבְגַּד
  choice: мы вероломно поступаем
  rationale: Передаёт идею измены доверию и заветным обязательствам; форма первого лица множественного числа сохранена.
- source_word: אִישׁ בְּאָחִיו
  choice: друг с другом
  rationale: Естественная русская дистрибутивная формула передаёт взаимные отношения внутри общины без неясного буквального оборота «каждый с братом своим».
- source_word: לְחַלֵּל
  choice: оскверняя
  rationale: Сохраняет сакральную силу глагола и выражает сопутствующий результат вероломного поведения.
- source_word: בְּרִית אֲבֹתֵינוּ
  choice: завет наших отцов
  rationale: Формально и ясно сохраняет родительную связь с предками, не превращая её без достаточных оснований в «завет с отцами».
theological_decisions:
- issue: Кого обозначает «один Отец»
  choice: В основном тексте оставлено «один Отец» без прямого отождествления.
  alternative: «один предок» или пояснительное «один Бог и Отец»
  rationale: Параллель с «один Бог сотворил нас» вероятнее всего указывает на Бога, однако древнееврейское אָב допускает понимание общего предка; перевод сохраняет эту напряжённость.
- issue: Представительно-мужская формула אִישׁ בְּאָחִיו
  choice: Передано естественным общинным выражением «друг с другом».
  alternative: «каждый со своим братом»
  rationale: В данном контексте формула описывает взаимное вероломство членов народа. Русский буквальный мужской оборот звучит тяжеловесно и может ошибочно сузить смысл до родных братьев.
- issue: Характер нарушения завета
  choice: «вероломно поступаем… оскверняя завет»
  alternative: «изменяем… нарушая завет»
  rationale: Сочетание сохраняет одновременно этическую идею предательства и сакральную силу глагола חלל, не сводя его к простому юридическому нарушению.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторические вопросы и повтор «один» сохранены. «Вероломно поступаем» понятно современному читателю и удерживает заветный оттенок; «оскверняя» сохраняет религиозно-сакральную силу исходного выражения.
