  text: כִּֽי שִׂפְתֵ֤י כֹהֵן֙ יִשְׁמְרוּ דַ֔עַת וְ/תוֹרָ֖ה יְבַקְשׁ֣וּ מִ/פִּ֑י/הוּ כִּ֛י מַלְאַ֥ךְ יְהוָֽה צְבָא֖וֹת הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/007.yaml
  text: For the lips of a priest should guard knowledge[a], and they should seek instruction from his mouth[b], because he is the messenger of Yahweh of Armies.
translation:
  language: ru
  text: Ибо уста священника должны хранить знание, и наставления должны искать из его уст, потому что он — вестник Господа Воинств.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Господь Саваоф». Буквально: «Господь Воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי כֹהֵן
  choice: уста священника
  rationale: Конструкция обозначает уста священника в обобщённом смысле. «Уста» сохраняет образ речи и соответствует достоинству пророческого контекста.
- source_word: יִשְׁמְרוּ
  choice: должны хранить
  rationale: Имперфект в контексте обличения выражает установленную обязанность, а не простое предсказание.
- source_word: דַעַת
  choice: знание
  rationale: Прямой эквивалент, уместный для знания Бога, его воли и путей в контексте священнического наставления.
- source_word: וְתוֹרָה
  choice: наставления
  rationale: Здесь torah означает авторитетное наставление, исходящее из уст священника; множественное число естественно по-русски и не сужает смысл до свода законов.
- source_word: יְבַקְשׁוּ מִפִּיהוּ
  choice: ищут из его уст
  rationale: Неопределённый субъект множественного числа оставлен невыраженным, как в еврейском тексте. Настоящее время в сочетании с контекстом передаёт общее нормативное положение, а образ «из его уст» сохранён.
- source_word: מַלְאַךְ
  choice: вестник
  rationale: Речь идёт о священнике как уполномоченном передавать Божье слово, поэтому «вестник», а не «ангел».
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Имя יהוה передано традиционным «Господь», а צבאות — прозрачным «Воинств», сохраняющим образ небесных и земных сил.
theological_decisions:
- issue: Нормативная сила глаголов несовершенного вида
  choice: должны хранить / ищут
  alternative: будут хранить / будут искать
  rationale: Контекст обличения священников описывает их должное служение. В первой части нормативность выражена явно, а во второй общее настоящее сохраняет неопределённость формы без тяжеловесного повторения «должны».
- issue: Передача יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская передача сохраняет благоговейную практику замещения имени титулом; написание с прописной буквы отличает божественный титул.
- issue: Значение תּוֹרָה в священническом контексте
  choice: наставления
  alternative: закон / учение
  rationale: Слово охватывает авторитетное наставление и не ограничивается законодательными предписаниями; богословская широта термина сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской дикцией. «Уста» и «вестник» сохраняют исходные образы, не делая фразу архаичной; синтаксис остаётся ясным для широкого читателя.
