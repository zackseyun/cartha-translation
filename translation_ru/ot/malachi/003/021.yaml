  terminology: «Яхве Воинств» последовательно передаёт יהוה צבאות и допустим в современном литературном русском; «нечестивые» уместно передаёт רְשָׁעִים. Сноска корректно сообщает традиционный вариант, но альтернативу «Яхве Саваоф» следует отделить от полного традиционного перевода «Господь Саваоф».
