  source_fidelity: 'Основной смысл передан верно: וְעַסּוֹתֶם — «будете попирать», רְשָׁעִים — «нечестивых», а прямое «станут пеплом» сохраняет не-сравнительную форму еврейского сказуемого. Однако «Я совершу это» вводит указательное дополнение «это», которого в еврейском тексте нет: עֹשֶׂה употреблено без выраженного объекта. Его лучше передать без такого добавления.'
