  text: וְ/עַסּוֹתֶ֣ם רְשָׁעִ֔ים כִּֽי יִהְי֣וּ אֵ֔פֶר תַּ֖חַת כַּפּ֣וֹת רַגְלֵי/כֶ֑ם בַּ/יּוֹם֙ אֲשֶׁ֣ר אֲנִ֣י עֹשֶׂ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/021.yaml
  text: And you will trample the wicked[a], for they will be ashes under the soles of your feet on the day when I act, says Yahweh of Armies.
translation:
  language: ru
  text: И вы будете попирать нечестивых, потому что они станут пеплом под подошвами ваших ног в день, когда Я буду действовать, — говорит Яхве Воинств.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве Саваоф»; традиционно: «Господь Саваоф».'
    reason: Лексическая и традиционная альтернатива передачи יְהוָה צְבָאוֹת.
lexical_decisions:
- source_word: וְעַסּוֹתֶם
  choice: И вы будете попирать
  rationale: Передаёт образ наступания и победного попрания; «попирать» естественно для возвышенного пророческого контекста и не добавляет идеи полного раздробления.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное обозначает людей, нравственно противящихся Богу; традиционное и понятное русское соответствие.
- source_word: כִּי יִהְיוּ אֵפֶר
  choice: потому что они станут пеплом
  rationale: כִּי имеет причинно-пояснительную силу. Связка с будущим временем буквально допускает «будут пеплом», но «станут пеплом» яснее выражает итог грядущего суда, не превращая утверждение в сравнение.
- source_word: תַּחַת כַּפּוֹת רַגְלֵיכֶם
  choice: под ступнями ваших ног
  rationale: כַּף применительно к ноге означает подошву или ступню; выражение сохраняет телесный образ оригинала и звучит естественно по-русски.
- source_word: בַּיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: в тот день, когда Я совершу это
  rationale: Эллиптическое עֹשֶׂה буквально означает «делаю/совершаю». Указательное «это» связывает действие с описанным Божьим вмешательством, не уточняя сверх текста, что именно Он совершает.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — прозрачным русским эквивалентом, сохраняющим военный и небесно-космический диапазон титула.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется личное заветное имя, непосредственно присутствующее в еврейском тексте; форма «Яхве» наиболее широко отражает принятую реконструкцию произношения.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; небесных воинств
  rationale: «Воинств» переводит значение слова и сохраняет многозначность титула, не ограничивая его только земными или только небесными силами. Традиционное «Саваоф» менее прозрачно современному читателю.
- issue: Характер образа пепла
  choice: 'прямое утверждение: «станут пеплом»'
  alternative: «будут как пепел»
  rationale: В оригинале нет показателя сравнения; метафорически сильное прямое предикативное утверждение сохранено.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис ясен обычному читателю; «попирать» и «воинств» сохраняют возвышенный библейский регистр без архаизации всего стиха.
