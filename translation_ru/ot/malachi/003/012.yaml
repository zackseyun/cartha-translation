id: MAL.3.12
reference: Malachi 3:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִשְּׁר֥וּ אֶתְ/כֶ֖ם כָּל הַ/גּוֹיִ֑ם כִּֽי תִהְי֤וּ אַתֶּם֙ אֶ֣רֶץ חֵ֔פֶץ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/012.yaml
  text: Then all the nations will call you blessed[a], for you will be a delightful land, says Yahweh of hosts.
translation:
  language: ru
  text: И все народы назовут вас счастливыми, потому что вы будете землёй желанной[a], — говорит Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «землёй отрады»; «землёй, которой желают».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשְּׁרוּ
  choice: назовут вас счастливыми
  rationale: Пиэль от אשר означает признавать или называть счастливыми, благополучными. Эта формулировка естественна по-русски и передаёт публичное признание благословенного состояния.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: גּוֹיִם здесь обозначает народы вообще, а не «язычников» как позднейшую религиозную категорию.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой народы назовут адресатов счастливыми.
- source_word: תִהְיוּ אַתֶּם
  choice: вы будете
  rationale: Будущее время היה с отдельным местоимением подчёркивает адресатов; русское «вы будете» естественно сохраняет прямое обращение.
- source_word: אֶרֶץ חֵפֶץ
  choice: землёй желанной
  rationale: Буквально — «земля желания/отрады», то есть земля привлекательная и вызывающая восхищение. «Желанная земля» сохраняет образ и смысловую ёмкость сочетания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Традиционно понятная и достаточно широкая передача, не ограничивающая значение только земными армиями.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер обещанного состояния народа и земли
  choice: «назовут вас счастливыми» и «землёй желанной»
  alternative: «назовут вас благословенными» и «землёй отрады»
  rationale: Текст связывает публично признаваемое благополучие народа с привлекательностью его земли. Выбор не уточняет сверх оригинала, означает ли «счастье» исключительно духовное благословение или также видимое процветание.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «землёй желанной» сохраняет поэтичность, оставаясь понятной; формула «Яхве Воинств» последовательно передаёт имя и титул.
