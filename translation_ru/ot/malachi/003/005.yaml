  text: וְ/קָרַבְתִּ֣י אֲלֵי/כֶם֮ לַ/מִּשְׁפָּט֒ וְ/הָיִ֣יתִי עֵ֣ד מְמַהֵ֗ר בַּֽ/מְכַשְּׁפִים֙ וּ/בַ/מְנָ֣אֲפִ֔ים וּ/בַ/נִּשְׁבָּעִ֖ים לַ/שָּׁ֑קֶר וּ/בְ/עֹשְׁקֵ֣י שְׂכַר שָׂ֠כִיר אַלְמָנָ֨ה וְ/יָת֤וֹם וּ/מַטֵּי גֵר֙ וְ/לֹ֣א יְרֵא֔וּ/נִי אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/005.yaml
  text: Then I will come near to you for judgment[a], and I will be a swift witness against sorcerers, against adulterers, against those who swear falsely, against those who oppress the wage of a hired worker, the widow, and the fatherless, and those who turn aside the sojourner, and do not fear me[c][b], says Yahweh of Armies.
translation:
  language: ru
  text: И Я приближусь к вам для суда и немедля буду свидетельствовать против чародеев, прелюбодеев, ложно клянущихся, тех, кто удерживает плату наёмного работника, притесняет вдову и сироту, лишает пришельца правосудия, — против всех, кто не боится Меня, — говорит Яхве Воинств[c].[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «притесняющих плату наёмного работника»; речь может идти об удержании или присвоении заработка.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чужеземца, живущего среди народа». Еврейское גֵר обозначает неуроженца, поселившегося в стране и находящегося под защитой её законов.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «Господь Саваоф».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָרַבְתִּי אֲלֵיכֶם לַמִּשְׁפָּט
  choice: И Я приближусь к вам для суда
  rationale: Сохраняет направленность אֲלֵיכֶם («к вам»), судебный смысл מִשְׁפָּט и будущее значение формы в пророческом контексте.
- source_word: וְהָיִיתִי עֵד מְמַהֵר
  choice: и буду скорым свидетелем
  rationale: Передаёт образ Бога как свидетеля и акцент מְמַהֵר на быстроте Его свидетельства и суда.
- source_word: בַּמְכַשְּׁפִים
  choice: против чародеев
  rationale: Краткое и литературное обозначение практикующих колдовство без более узких современных ассоциаций слова «ведьмы».
- source_word: וּבַמְנָאֲפִים
  choice: против прелюбодеев
  rationale: Прямой эквивалент причастной формы, обозначающей совершающих прелюбодеяние.
- source_word: וּבַנִּשְׁבָּעִים לַשָּׁקֶר
  choice: против тех, кто клянётся ложно
  rationale: Сохраняет широкий смысл ложной клятвы, не ограничивая выражение судебным лжесвидетельством.
- source_word: וּבְעֹשְׁקֵי שְׂכַר שָׂכִיר
  choice: кто обирает наёмного работника, лишая его платы
  rationale: Естественно по-русски раскрывает буквальный образ «притесняющих плату наёмника» как незаконное удержание или присвоение заработка.
- source_word: אַלְמָנָה וְיָתוֹם
  choice: притесняет вдову и сироту
  rationale: Глагольное значение עֹשְׁקֵי по смыслу распространяется на следующие уязвимые группы; «сирота» — современный естественный эквивалент יָתוֹם.
- source_word: וּמַטֵּי גֵר
  choice: отказывает в правосудии переселенцу
  rationale: נטה в данном судебно-социальном контексте означает оттеснять, лишать права или извращать дело; «переселенец» передаёт גֵר как живущего среди Израиля неуроженца.
- source_word: וְלֹא יְרֵאוּנִי
  choice: и не боится Меня
  rationale: Сохраняет как страх, так и благоговейно-заветный оттенок глагола ירא.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה транслитерацией и переводит צְבָאוֹת прозрачным современным обозначением небесных и земных войск.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное заветное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф
  rationale: «Воинств» раскрывает значение еврейского множественного существительного современному читателю, тогда как «Саваоф» является традиционной, но непрозрачной транслитерацией.
- issue: Синтаксический охват וְלֹא יְרֵאוּנִי
  choice: относится ко всему описанному кругу виновных
  alternative: относится лишь к тем, кто отказывает в правосудии переселенцу
  rationale: Финальная форма во множественном числе естественно подводит нравственно-богословский итог всему перечню, хотя близость последнего элемента допускает более узкое синтаксическое прочтение.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Повтор «против» сохранён в начале перечня ради судебной выразительности, а далее применены естественные русские глагольные конструкции. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с русской библейской издательской традицией.
