revisions:
- from: И Я приближусь к вам для суда и буду скорым свидетелем против чародеев, против прелюбодеев, против тех, кто клянётся ложно, кто обирает наёмного работника, лишая его платы[a], притесняет вдову и сироту, отказывает в правосудии переселенцу[b] и не боится Меня, — говорит Яхве Воинств[c].
  to: И Я приближусь к вам для суда и немедля буду свидетельствовать против чародеев, прелюбодеев, ложно клянущихся, тех, кто удерживает плату наёмного работника, притесняет вдову и сироту, лишает пришельца правосудия, — против всех, кто не боится Меня, — говорит Яхве Воинств[c].[a][b]
  rationale: Перестроена фраза, чтобы заключительное обвинение «не боятся Меня» недвусмысленно охватывало весь перечень; это не меняет содержания и не навязывает спорное синтаксическое членение оригинала. «Немедля буду свидетельствовать» естественно передаёт образ Яхве как быстрого свидетеля. «Пришелец» точнее передаёт גֵּר, а «лишает ... правосудия» отражает судебно-социальный смысл מַטֵּי גֵר. Сноски сохранены и привязаны к соответствующим решениям.
