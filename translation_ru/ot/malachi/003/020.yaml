source:
  edition: WLC
  text: וְ/זָרְחָ֨ה לָ/כֶ֜ם יִרְאֵ֤י שְׁמִ/י֙ שֶׁ֣מֶשׁ צְדָקָ֔ה וּ/מַרְפֵּ֖א בִּ/כְנָפֶ֑י/הָ וִֽ/יצָאתֶ֥ם וּ/פִשְׁתֶּ֖ם כְּ/עֶגְלֵ֥י מַרְבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/020.yaml
  text: But for you who fear my name[a], the sun of righteousness will rise with healing in its wings[c][b]; and you will go out and leap like calves from the stall.
translation:
  language: ru
  text: А для вас, боящихся Моего имени, взойдёт солнце праведности[a], с исцелением в его крыльях[b]. Вы выйдете и будете резвиться, как телята из стойла[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «солнце справедливости» или «солнце оправдания». Еврейское слово צְדָקָה может означать праведность, справедливость или оправдание и восстановление прав.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в его лучах». Еврейское слово «крылья» может образно обозначать края солнечного диска или расходящиеся лучи.'
    reason: lexical_alternative
  - marker: c
    text: Редкий еврейский глагол может означать «скакать», «резвиться»; его также понимали как «откормиться».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרְחָה
  choice: взойдёт
  rationale: Глагол זרח обычно обозначает восход или появление сияющего светила; «взойдёт» естественно сохраняет образ солнца и будущую направленность высказывания.
- source_word: יִרְאֵי שְׁמִי
  choice: для вас, боящихся Моего имени
  rationale: Причастная конструкция называет адресатов, а «для вас» передаёт לָכֶם и сохраняет прямое обращение.
- source_word: שֶׁמֶשׁ צְדָקָה
  choice: солнце праведности
  rationale: Сохраняется ёмкая метафора и широкий смысл צדקה — праведность, справедливость или оправдание; основной текст не сужает его до одного судебного значения.
- source_word: וּמַרְפֵּא
  choice: и … будет исцеление
  rationale: Существительное מַרְפֵּא означает исцеление или целительное средство. Русская предикативная конструкция ясно связывает исцеление с образом крыльев, не превращая существительное в излишне конкретизированный глагол.
- source_word: בִּכְנָפֶיהָ
  choice: в его крыльях
  rationale: Сохраняется буквальная метафора «крыльев»; местоимение согласовано с русским словом «солнце». Возможное образное значение «лучи» вынесено в примечание.
- source_word: וִיצָאתֶם
  choice: вы выйдете
  rationale: Прямо передаёт обычное значение יצא и образ выхода на свободу.
- source_word: וּפִשְׁתֶּם
  choice: будете резвиться
  rationale: Редкий глагол в контексте выпущенных телят, вероятно, обозначает живое, радостное движение. «Резвиться» естественно передаёт этот образ, не ограничивая его одним прыжком.
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: как телята, выпущенные из стойла
  rationale: מַרְבֵּק — стойло или место откорма. Добавление «выпущенные» явно выражает подразумеваемую связь с предшествующим «выйдете» и делает сравнение понятным по-русски.
theological_decisions:
- issue: Мессианское истолкование выражения «солнце праведности»
  choice: Сохранить метафору, не отождествляя солнце прямо с Мессией в тексте перевода.
  alternative: Передать это выражение как непосредственный мессианский титул Христа.
  rationale: Хотя в христианской традиции образ часто понимается мессиански, еврейский текст прямо говорит об образе грядущего избавления для боящихся Божьего имени. Перевод не должен добавлять отождествление, которого стих не выражает явно.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Метафоры оригинала сохранены; местоимение «его» грамматически согласовано с русским словом «солнце». Прописная буква в «Моего» отмечает речь Бога согласно устойчивой русской библейской практике.
