base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/014.yaml
  text: You have said[a], ‘It is vain to serve God[d][c][b]. And what profit is it that we have kept his charge and that we have walked in mourning before Yahweh of hosts?’
translation:
  language: ru
  text: 'Вы говорили: «Напрасно[a] служить Богу. Какой нам прок[b] от того, что мы соблюдали Его установление[c] и ходили в трауре[d] пред Яхве Воинств?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тщетно»; еврейское слово выражает пустоту, бесполезность или отсутствие результата.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «какая польза?»'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «соблюдали Его стражу (предписание)»; то есть соблюдали установленное Им требование или обязанность.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «ходили понуро», «ходили в скорби» или «ходили в чёрном»; вероятно, речь идёт о внешнем проявлении скорби или покаяния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: напрасно
  rationale: Передаёт мысль о тщетности и бесполезности служения в устах говорящих; по-русски естественно сочетается с инфинитивом «служить».
- source_word: עֲבֹד
  choice: служить
  rationale: Глагол обозначает служение Богу в широком смысле, а не только участие в богослужении.
- source_word: בֶּצַע
  choice: выгода
  rationale: Сохраняет оттенок искомой пользы или приобретения и меркантильный характер риторического вопроса.
- source_word: מִשְׁמַרְתּוֹ
  choice: то, что Он повелел
  rationale: Естественно по-русски выражает вверенную обязанность или требование, которое надлежит соблюдать.
- source_word: קְדֹרַנִּית
  choice: ходили в трауре
  rationale: Передаёт мрачный, скорбный внешний вид или поведение, вероятно связанное с покаянным либо траурным обычаем, не сводя выражение лишь к внутреннему чувству.
- source_word: מִפְּנֵי
  choice: пред
  rationale: Сохраняет пространственно-реляционный смысл пребывания перед Богом, в Его присутствии.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: «Яхве» передаёт личное имя, а «Воинств» сохраняет образ небесных или боевых сил в составе божественного титула.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Характер жалобы говорящих
  choice: Жалоба охватывает служение Богу, соблюдение Его повеления и скорбно-покаянное поведение как якобы не давшие выгоды.
  alternative: Жалоба относится только к обрядовому трауру.
  rationale: Синтаксис объединяет все три проявления благочестия; перевод сохраняет циничную оценку самих говорящих, не выдавая её за утверждение автора.
- issue: Смысл קְדֹרַנִּית
  choice: в трауре
  alternative: понуро; в скорби; в чёрном
  rationale: Слово допускает описание как мрачного поведения, так и траурного внешнего вида. Основной текст передаёт вероятный обрядово-внешний смысл, а примечание сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. «Пред» и титул «Яхве Воинств» сохраняют умеренно возвышенный регистр; остальные конструкции сделаны прозрачными для обычного читателя. Риторический вопрос разделён на самостоятельную фразу ради естественности, без изменения логической связи с последующими примерами.
