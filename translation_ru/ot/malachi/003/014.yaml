revisions:
- from: 'Вы говорили: «Напрасно[a] служить Богу. И какая от этого выгода[b]? Мы соблюдали то, что Он повелел[c], и ходили в трауре[d] пред Яхве Воинств».'
  to: 'Вы говорили: «Напрасно[a] служить Богу. Какой нам прок[b] от того, что мы соблюдали Его установление[c] и ходили в трауре[d] пред Яхве Воинств?»'
  rationale: Перестроен вопрос так, чтобы оба כִּי-придаточных прямо зависели от «какой нам прок», как в оригинале. «То, что Он повелел» заменено на «Его установление» для более прямой передачи מִשְׁמַרְתּוֹ; примечание исправлено, чтобы не приписывать тексту идею поручения, вверенного людьми или Богу. Остальные удачные решения сохранены, включая осторожную передачу קְדֹרַנִּית как траурного поведения с альтернативами в примечании.
