  text: הָבִ֨יאוּ אֶת כָּל הַֽ/מַּעֲשֵׂ֜ר אֶל בֵּ֣ית הָ/אוֹצָ֗ר וִ/יהִ֥י טֶ֨רֶף֙ בְּ/בֵיתִ֔/י וּ/בְחָנ֤וּ/נִי נָא֙ בָּ/זֹ֔את אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת אִם לֹ֧א אֶפְתַּ֣ח לָ/כֶ֗ם אֵ֚ת אֲרֻבּ֣וֹת הַ/שָּׁמַ֔יִם וַ/הֲרִיקֹתִ֥י לָ/כֶ֛ם בְּרָכָ֖ה עַד בְּלִי דָֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/010.yaml
  text: Bring the full tithe into the storehouse[a], so that there may be food in my house. And test me now in this, says Yahweh of hosts[c][b], whether I will not open for you the windows of heaven and pour out for you blessing until there is no more need.
translation:
  language: ru
  text: Принесите всю десятину в хранилище[a], чтобы в Моём доме была пища. Испытайте Меня теперь в этом, — говорит Яхве Воинств, — не открою ли Я для вас окна небес[b] и не изолью ли на вас благословение сверх всякой меры[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в кладовую»; буквально: «в дом запаса».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «небесные шлюзы». Буквально: «окна небес».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский оборот означает изобилие, превосходящее достаточность; традиционные варианты: «так что не хватит места» или «до избытка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאוּ
  choice: Принесите
  rationale: Порода hифиль, повелительное наклонение множественного числа; передаёт прямое обращение и требование принести.
- source_word: כָּל הַמַּעֲשֵׂר
  choice: всю десятину
  rationale: 'כָּל при существительном в единственном числе подчёркивает полноту: десятину следует принести целиком.'
- source_word: בֵּית הָאוֹצָר
  choice: хранилище
  rationale: Буквально «дом запаса/сокровища»; в данном храмовом контексте речь о помещении для хранения приношений.
- source_word: וִיהִי טֶרֶף בְּבֵיתִי
  choice: чтобы в Моём доме была пища
  rationale: Юссив после повеления естественно выражает цель; טֶרֶף здесь означает пищу или съестные припасы, а не добычу.
- source_word: וּבְחָנוּנִי נָא בָּזֹאת
  choice: Испытайте же Меня в этом
  rationale: בחן означает проверять или испытывать; частица נָא передана усилительно-побудительным «же», что естественнее по-русски и сохраняет настойчивость необычного приглашения Бога.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняется личное имя Яхве и многозначный титул צְבָאוֹת с его небесными и воинскими ассоциациями.
- source_word: אִם לֹא
  choice: не открою ли Я… и не изолью ли
  rationale: В контексте призыва испытать Бога оборот вводит риторический вопрос с сильным утвердительным смыслом, не превращая его прямо в утверждение.
- source_word: אֲרֻבּוֹת הַשָּׁמַיִם
  choice: окна небес
  rationale: Буквальный образ небесных отверстий сохранён ради межтекстовых связей; «шлюзы» является допустимым смысловым вариантом.
- source_word: וַהֲרִיקֹתִי לָכֶם בְּרָכָה
  choice: и не изолью ли на вас благословение
  rationale: Глагол передаёт образ обильного излияния, а широкое значение «благословение» не сводится исключительно к материальному достатку.
- source_word: עַד בְּלִי דָי
  choice: сверх всякой меры
  rationale: Трудный идиоматический оборот обозначает изобилие, превосходящее достаточность; этот вариант не навязывает спорный буквальный образ нехватки места.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это отличие без подмены титулом.
- issue: Значение титула צְבָאוֹת
  choice: Воинств
  alternative: Сил; Всемогущий
  rationale: Формальный вариант сохраняет широту еврейского титула и не сводит его к одному толкованию.
- issue: Характер обещанного благословения
  choice: общее «благословение»
  alternative: материальное изобилие или дождь
  rationale: Контекст связан с храмовым и земледельческим обеспечением, однако בְּרָכָה само по себе шире; перевод не превращает стих в универсальную формулу материального процветания.
- issue: Риторическая конструкция אִם לֹא
  choice: риторический вопрос «не открою ли…»
  alternative: утвердительное «Я непременно открою»
  rationale: Вопросительная форма сохраняет приглашение проверить обещание и одновременно передаёт его сильный утвердительный смысл.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Прописные местоимения в речи Бога применены как русская благоговейная издательская конвенция. Синтаксис сохраняет повеление, приглашение испытать Бога и риторическую форму обещания.
