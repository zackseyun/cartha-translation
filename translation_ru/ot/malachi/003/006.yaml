base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/006.yaml
  text: For I[a], Yahweh, do not change; and you, sons of Jacob[b], have not come to an end.
translation:
  language: ru
  text: Ибо Я, Яхве, не изменяюсь, и вы, сыны Иакова[b], не погибли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможны переводы: «не были истреблены» или «не пришли к концу». Еврейский глагол может означать погибнуть, окончиться или быть истреблённым.'
    reason: lexical_alternative
  - marker: b
    text: Буквально «сыны Иакова» — заветное обозначение потомков Иакова, то есть Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или объяснение предшествующего высказывания; «ибо» сохраняет эту связь и соответствует возвышенному, но современному библейскому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом «Господь».
- source_word: לֹא שָׁנִיתִי
  choice: не изменяюсь
  rationale: Перфект глагола שנה в данном контексте выражает неизменную, продолжающуюся реальность; настоящее время естественно передаёт эту постоянную характеристику.
- source_word: וְאַתֶּם
  choice: и вы
  rationale: Прямо передаёт союз וְ, не делая логическое следствие более явным, чем в еврейском тексте.
- source_word: בְּנֵי יַעֲקֹב
  choice: сыны Иакова
  rationale: Сохраняет мужскую форму и заветное обозначение потомков Иакова — Израиля; «сыны» уместно в dignified biblical register.
- source_word: לֹא כְלִיתֶם
  choice: не исчезли
  rationale: Глагол כלה может означать окончиться, исчезнуть, быть истреблённым или погибнуть. «Не исчезли» естественно по-русски и не уточняет сверх текста способ возможной гибели.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Временной и аспектуальный смысл לֹא שָׁנִיתִי
  choice: не изменяюсь
  alternative: не изменился
  rationale: Настоящее время выражает утверждаемое текстом постоянство Бога, не добавляя к нему позднейших философских формулировок.
- issue: Связь между неизменностью Яхве и сохранением Израиля
  choice: и вы
  alternative: поэтому вы
  rationale: Союз допускает понимание второй части как следствия, однако исходная форма прямо не маркирует его словом «поэтому»; более формальная передача сохраняет эту смысловую напряжённость.
- issue: Заветное обозначение בְּנֵי יַעֲקֹב
  choice: сыны Иакова
  alternative: потомки Иакова; дети Иакова
  rationale: Буквальная идиома сохраняет связь народа с патриархом и его заветную идентичность; примечание поясняет собирательный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ибо» и «сыны Иакова» сохраняют торжественность и межтекстовые связи, оставаясь понятными современному читателю. Порядок маркеров в стихе обусловлен тем, к каким словам относятся примечания.
