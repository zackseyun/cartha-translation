source:
  edition: WLC
  text: וְ/גָעַרְתִּ֤י לָ/כֶם֙ בָּֽ/אֹכֵ֔ל וְ/לֹֽא יַשְׁחִ֥ת לָ/כֶ֖ם אֶת פְּרִ֣י הָ/אֲדָמָ֑ה וְ/לֹא תְשַׁכֵּ֨ל לָ/כֶ֤ם הַ/גֶּ֨פֶן֙ בַּ/שָּׂדֶ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/011.yaml
  text: And I will rebuke the devourer for you[a], so that it will not destroy for you the fruit of the ground, and the vine in the field will not fail to bear for you[b], says Yahweh of Armies.
translation:
  language: ru
  text: Я ради вас остановлю пожирателя, и он не погубит плодов вашей земли; ваша виноградная лоза в поле не лишится плодов прежде времени[a], — говорит Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лоза в поле не будет лишаться [плода] для вас»; употреблён глагол, который также обозначает потерю детей или детёнышей.'
    reason: Сноска сохраняет необычный древнееврейский образ преждевременной потери плода и отмечает образное употребление глагола.
lexical_decisions:
- source_word: וְגָעַרְתִּי
  choice: Я пригрожу
  rationale: Глагол גּער означает властно прикрикнуть, пригрозить или запретить так, чтобы остановить действие. «Пригрожу» сохраняет образ прямого властного обращения и не сводит смысл к более отвлечённому «обуздаю».
- source_word: בָּאֹכֵל
  choice: пожирателю
  rationale: Субстантивированное причастие от אכל обозначает того или то, что поедает урожай. «Пожиратель» сохраняет неопределённость источника бедствия и не уточняет без достаточных оснований, идёт ли речь о насекомых, болезни или иной губительной силе.
- source_word: יַשְׁחִת
  choice: не погубит
  rationale: В сельскохозяйственном контексте Hiphil от שׁחת означает причинить гибель или порчу. «Погубит» естественно сочетается с плодами земли и передаёт силу глагола.
- source_word: פְּרִי הָאֲדָמָה
  choice: плодов вашей земли
  rationale: Сохраняется конкретный образ «плода земли»; местоимение «вашей» естественно передаёт לָכֶם и связь урожая с адресатами.
- source_word: תְשַׁכֵּל
  choice: не будет терять плоды до срока
  rationale: Применённый к лозе глагол שׁכל переносит образ потери потомства на преждевременную утрату плодов. Выбранная формулировка ясна современному читателю и сохраняет идею плодов, не достигших зрелости.
- source_word: הַגֶּפֶן בַּשָּׂדֶה
  choice: виноградная лоза в поле
  rationale: Прямой и естественный перевод определённого существительного и обстоятельства места; «виноградная» устраняет возможную в русском двусмысленность слова «лоза».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת переведено по смыслу как «Воинств», сохраняя краткую форму древнееврейского божественного титула.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Значение צְבָאוֹת в титуле
  choice: Воинств
  alternative: Саваоф; небесных воинств
  rationale: «Воинств» передаёт значение древнееврейского слова, не оставляя его непрозрачной транслитерацией. Текст не уточняет состав этих воинств, поэтому слово «небесных» не внесено.
- issue: Образ שׁכל применительно к виноградной лозе
  choice: не будет терять плоды до срока
  alternative: не выкинет плода; не лишится плодов
  rationale: Перевод передаёт метафору преждевременной потери плода, не превращая обещание лишь в общее утверждение о плодородии.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным, сельскохозяйственные образы сохранены, а неопределённая природа «пожирателя» намеренно не конкретизирована.
