id: MAL.3.17
reference: Malachi 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָ֣יוּ לִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת לַ/יּ֕וֹם אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה סְגֻלָּ֑ה וְ/חָמַלְתִּ֣י עֲלֵי/הֶ֔ם כַּֽ/אֲשֶׁר֙ יַחְמֹ֣ל אִ֔ישׁ עַל בְּנ֖/וֹ הָ/עֹבֵ֥ד אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/017.yaml
  text: And they will be mine[a], says Yahweh of Armies, on the day when I make them a treasured possession[c][b], and I will spare them as a man spares his son who serves him.
translation:
  language: ru
  text: «И они будут Моими, — говорит Яхве Воинств, — в тот день, когда Я сделаю их Своим драгоценным достоянием[a]. И Я пощажу их, как человек щадит своего сына, который служит ему».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «особой собственностью». Еврейское слово обозначает особо ценимое достояние, принадлежащее царю или владыке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ לִי
  choice: И они будут Моими
  rationale: Передаёт будущее обладание и принадлежность Богу; прописная буква у местоимения соответствует русской традиции почтительного обозначения Бога.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя יְהוָה и переводит צְבָאוֹת прозрачным для современного читателя словом «Воинств», не ограничивая выражение только земными войсками.
- source_word: לַיּוֹם אֲשֶׁר
  choice: в тот день, когда
  rationale: Естественно передаёт указание на определённый будущий день Божьего действия.
- source_word: אֲנִי עֹשֶׂה סְגֻלָּה
  choice: Я сделаю их Своим драгоценным достоянием
  rationale: Глагол с последующим предикативным существительным передан русской конструкцией «сделаю их…»; объект восстанавливается из контекста, а принадлежность уже выражена словами «будут Моими».
- source_word: סְגֻלָּה
  choice: драгоценное достояние
  rationale: Обозначает особо ценимую собственность царя или владыки; «достояние» сохраняет одновременно оттенки ценности и принадлежности.
- source_word: וְחָמַלְתִּי עֲלֵיהֶם
  choice: И Я пощажу их
  rationale: В контексте суда חמל означает проявить сострадание посредством избавления от наказания; «пощажу» точно подходит и допускает повтор в сравнении.
- source_word: כַּאֲשֶׁר יַחְמֹל אִישׁ
  choice: как человек щадит
  rationale: Повтор глагола «щадить» отражает повтор חמל; «человек» естественно передаёт אִישׁ в обобщающем сравнении без устранения дальнейшего образа отца и сына.
- source_word: עַל בְּנוֹ הָעֹבֵד אֹתוֹ
  choice: своего сына, который служит ему
  rationale: Сохраняет конкретный образ сына и значение служения в причастной конструкции.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное covenantное имя Бога; транслитерация сохраняет его отличие от титула אֲדֹנָי.
- issue: Смысл סְגֻלָּה
  choice: Своим драгоценным достоянием
  alternative: особой собственностью
  rationale: Выбранная формулировка сохраняет библейский мотив особо ценимой принадлежности Богу, не добавляя узкоконфессионального толкования.
- issue: Значение חמל
  choice: пощажу / щадит
  alternative: смилуюсь / жалеет
  rationale: В контексте грядущего дня суда на первом плане избавление от наказания; одинаковый русский корень сохраняет лексический повтор еврейского текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Прямая речь оформлена естественно для русского синтаксиса; сохранены повтор глагола «щадить», образ отца и сына и напряжение между принадлежностью Богу и будущим днём Его действия.
