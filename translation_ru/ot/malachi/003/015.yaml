  - marker: b
    text: 'Буквально: «построены»; то есть утверждены, укрепились или достигают благополучия.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «подвергают Бога испытанию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет связь с предыдущей жалобой и вводит нынешний вывод говорящих.
- source_word: מְאַשְּׁרִים
  choice: называем ... счастливыми
  rationale: 'Передаёт декларативный смысл глагола: считать или провозглашать кого-либо счастливым, благополучным.'
- source_word: זֵדִים
  choice: надменных
  rationale: Обозначает гордых, дерзких и самонадеянных людей; «надменные» естественно выражает нравственную оценку.
- source_word: נִבְנוּ
  choice: преуспевают
  rationale: Буквально пассивная форма означает «устроены/отстроены»; в контексте это метафора упрочившегося положения и благополучия.
- source_word: עֹשֵׂי רִשְׁעָה
  choice: делающие зло
  rationale: Сохраняет деятельный, продолжающийся характер еврейского причастного оборота, не сводя его к отвлечённой характеристике.
- source_word: בָּחֲנוּ אֱלֹהִים
  choice: испытывают Бога
  rationale: Глагол בחן здесь указывает на дерзкое испытание Бога, проверку пределов Его терпения или суда.
- source_word: וַיִּמָּלֵטוּ
  choice: остаются невредимы
  rationale: Передаёт контекстуальный смысл избавления или ухода от последствий, сохраняя жалобу на безнаказанность.
theological_decisions:
- issue: Передача אֱלֹהִים
  choice: Бога
  alternative: божество
  rationale: В данном контексте это обычное обозначение Бога Израиля, а не имя יהוה.
- issue: Характер испытания Бога
  choice: испытывают Бога
  alternative: подвергают Бога испытанию
  rationale: Краткая формулировка сохраняет двусмысленность глагола «проверять/испытывать» и одновременно допускает контекстуальный оттенок дерзкого вызова.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Структура нарастания жалобы сохранена; буквальная метафора נבנו пояснена в сноске, а в основном тексте передана естественным глаголом «преуспевают».
