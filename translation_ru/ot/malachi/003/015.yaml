  source_fidelity: 'Смысл основных еврейских выражений передан верно: говорящие называют надменных счастливыми, отмечают благополучие творящих зло и их безнаказанное испытание Бога. «Остаются невредимы» удачно передаёт контекстуальный смысл וַיִּמָּלֵטוּ — избегают последствий. Однако «преуспевают» сглаживает образ пассивного נִבְנוּ; это допустимо при наличии точной сноски, но нынешнее буквальное пояснение нуждается в исправлении.'
