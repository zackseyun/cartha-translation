base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/015.yaml
  text: So now we call the arrogant blessed[a]; evildoers are even built up[c][b]; they even test God and escape.’
translation:
  language: ru
  text: И теперь мы называем надменных счастливыми[a]; творящие зло преуспевают[b], даже испытывают Бога[c] — и остаются невредимы».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гордых»; также возможно: «считаем благополучными».'
