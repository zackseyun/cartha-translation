  text: בַּ/מְּאֵרָה֙ אַתֶּ֣ם נֵֽאָרִ֔ים וְ/אֹתִ֖/י אַתֶּ֣ם קֹבְעִ֑ים הַ/גּ֖וֹי כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/009.yaml
  text: You are cursed with a curse[a], for you are robbing me—the whole nation of you.
translation:
  language: ru
  text: Вы прокляты проклятием и обкрадываете Меня — весь народ целиком.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы под проклятием и всё же обкрадываете Меня — все вы, весь народ».'
    reason: 'Лексико-синтаксическая альтернатива: בַּמְּאֵרָה можно передать как состояние «под проклятием»; союз וְ в контексте может приобретать противопоставительный оттенок.'
lexical_decisions:
- source_word: בַּמְּאֵרָה
  choice: проклятием
  rationale: Существительное מְאֵרָה означает «проклятие»; предлог ב здесь передаёт состояние или средство. В сочетании «прокляты проклятием» сохранен намеренный древнееврейский повтор.
- source_word: נֵאָרִים
  choice: прокляты
  rationale: Страдательное причастие от ארר обозначает нынешнее, уже сложившееся состояние народа.
- source_word: וְאֹתִי
  choice: однако продолжаете ... Меня
  rationale: 'ו допускает простое соединительное значение «и», но контекст позволяет услышать противопоставление: даже находясь под проклятием, народ продолжает обкрадывать Бога. Выделенное прямое дополнение אֹתִי передано формой «Меня».'
- source_word: קֹבְעִים
  choice: продолжаете обкрадывать
  rationale: В данном контексте קבע означает лишать кого-либо принадлежащего ему, обкрадывать; форма причастия указывает на продолжающееся действие.
- source_word: הַגּוֹי כֻּלּוֹ
  choice: весь народ целиком
  rationale: 'Буквально: «весь народ, весь он». Формулировка сохраняет корпоративный охват и усиливающее כֻּלּוֹ.'
theological_decisions:
- issue: Корпоративный масштаб суда
  choice: 'Обращение относится ко всему народу как единому сообществу: весь народ находится под проклятием и обкрадывает Бога.'
  alternative: Заключительную фразу можно понимать преимущественно как усиление «все вы», без особого акцента на национальной общности.
  rationale: הַגּוֹי כֻּלּוֹ прямо называет народ в его целостности; перевод сохраняет это коллективное измерение, не привнося позднейших богословских категорий.
- issue: Связь между двумя частями стиха
  choice: Передать וְ противительным «однако», сохраняя напряжение между состоянием под проклятием и продолжающимся обкрадыванием Бога.
  alternative: Возможны соединительное «и» или причинное «ведь/потому что».
  rationale: Само וְ многозначно; ближайший контекст допускает противительное прочтение, а сноска сохраняет грамматическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Намеренный повтор «прокляты проклятием» сохраняет риторическую силу оригинала; «обкрадывать» естественно выражает продолжающееся лишение Бога причитающегося Ему.
