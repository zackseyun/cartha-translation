  source_fidelity: 'Основной смысл передан верно: מְאֵרָה и נֵאָרִים образуют намеренно усиленное «прокляты проклятием», קֹבְעִים означает «обкрадываете/обираете», а הַגּוֹי כֻּלּוֹ охватывает весь народ. Однако в исходнике союз וְ прежде всего соединительный; «однако» допустимо как толкование контекста, но не необходимо. Слово «продолжаете» несколько сильнее выражает временное продолжение, чем само причастие. Английская audit trail расходится между текстовым «for» и заявленным предпочтением «yet»; это не даёт основания вводить в русский причинную или противительную связь как единственно верную.'
