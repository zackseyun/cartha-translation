  naturalness: '«Ваши слова суровы против Меня» звучит калькированно: прилагательное «суровы» не сочетается в современном литературном русском с дополнением «против кого-либо». Перестройка с глаголом речи сохраняет значение и делает фразу естественной.'
  terminology: «Яхве» верно передаёт יְהוָה в соответствии с заданной практикой. «Дерзко» уместно передаёт силу/резкость слов в спорном контексте, не конкретизируя содержание обвинения. «Против Меня / против Тебя» сохраняет направленность עַל и параллелизм фразы.
