  text: חָזְק֥וּ עָלַ֛/י דִּבְרֵי/כֶ֖ם אָמַ֣ר יְהוָ֑ה וַ/אֲמַרְתֶּ֕ם מַה נִּדְבַּ֖רְנוּ עָלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/013.yaml
  text: Your words have been hard against me[a], says Yahweh. But you say, “What have we spoken against you?”
translation:
  language: ru
  text: '«Вы дерзко говорили против Меня, — говорит Яхве. — Но вы говорите: „Что мы говорили против Тебя?“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָזְקוּ
  choice: суровы
  rationale: Глагол буквально выражает силу, но при подлежащем «слова» и с עַל означает сильную, резкую или суровую речь. «Суровы» естественно передаёт идиому, не превращая её в более конкретное обвинение.
- source_word: עָלַי / עָלֶיךָ
  choice: против Меня / против Тебя
  rationale: В обеих параллельных фразах עַל имеет направленно-враждебный смысл; одинаковый перевод сохраняет словесное соответствие обвинения и возражения.
- source_word: דִּבְרֵיכֶם
  choice: ваши слова
  rationale: Прямой и естественный перевод формы множественного числа דְּבָרִים с местоименным суффиксом.
- source_word: אָמַר
  choice: говорит
  rationale: Настоящее время естественно для пророческой формулы и сохраняет непосредственность Божьего высказывания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וַאֲמַרְתֶּם
  choice: Но вы спрашиваете
  rationale: Союз вводит возражение народа, поэтому «но» передаёт контраст. В русском прямая вопросительная реплика после глагола речи естественно вводится словом «спрашиваете».
- source_word: נִּדְבַּרְנוּ
  choice: мы говорили
  rationale: Нифаль глагола דבר здесь идиоматически обозначает речевое действие; форма прошедшего времени естественно передаёт вопрос о прежних высказываниях.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Направленность слов народа
  choice: против Меня / против Тебя
  alternative: обо Мне / о Тебе
  rationale: Контекст спора и параллельное употребление עַל указывают на враждебную направленность речи, хотя сама формулировка не уточняет содержание обвинений.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим тоном. Заглавные местоимения в обращении к Богу соответствуют устойчивой русской библейской традиции. Реплика оформлена как единое высказывание Яхве с вложенным вопросом народа.
