base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/023.yaml
  text: Look[b][a], I am sending Elijah the prophet to you before the coming of the great and fearful day of Yahweh.
translation:
  language: ru
  text: Вот, Я посылаю к вам пророка Илию[a] перед наступлением великого и страшного[b] дня Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имя «Илия» можно понимать буквально или как указание на предтечу, подобного Илии; сам еврейский текст прямо говорит: «пророк Илия».'
    reason: cross_reference
  - marker: b
    text: 'Или: «грозного»; еврейское слово обозначает то, что внушает страх и трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт эмфатическое введение торжественного объявления естественным для современного русского языка способом.
- source_word: אָֽנֹכִי
  choice: Я
  rationale: Самостоятельное местоимение в еврейском подчёркивает говорящего; в русском это подчёркивание поддерживается явным «Я» и контекстом объявления без утяжелённого «Я Сам».
- source_word: שֹׁלֵחַ
  choice: посылаю
  rationale: Причастная форма выражает живое, близкое или уже решённое будущее действие; настоящее время сохраняет пророческую непосредственность.
- source_word: לָכֶם
  choice: к вам
  rationale: Предлог לְ указывает здесь на адресатов и направление посылания; «к вам» естественно сочетается в русском с глаголом «посылаю».
- source_word: אֵלִיָּה הַנָּבִיא
  choice: пророка Илию
  rationale: Сохраняет прямое наименование Илии и его звание, а русский порядок слов и винительный падеж обеспечивают естественность фразы.
- source_word: לִפְנֵי בּוֹא
  choice: перед наступлением
  rationale: Передаёт временное предшествование и приход дня; «наступление дня» звучит естественнее буквального «прихода дня».
- source_word: יוֹם יְהוָה
  choice: дня Яхве
  rationale: Сохраняет устойчивое пророческое выражение и передаёт личное имя Бога как «Яхве».
- source_word: הַגָּדוֹל
  choice: великого
  rationale: Передаёт величие, масштаб и значимость названного дня.
- source_word: וְהַנּוֹרָא
  choice: и страшного
  rationale: Слово указывает на день, внушающий страх и трепет; «страшный» сохраняет угрожающий оттенок и естественно звучит в данном русском выражении.
theological_decisions:
- issue: Кого обозначает «Илия»
  choice: В основном тексте оставлено прямое имя «Илия» без поясняющей идентификации.
  alternative: Понять это как предтечу, подобного Илии или действующего в его духе и силе.
  rationale: Еврейский текст прямо говорит «пророк Илия»; перевод не должен встраивать в основной текст позднейшее истолкование и тем самым устранять заложенную в нём открытость.
- issue: Характер дня Яхве
  choice: «великий и страшный день Яхве»
  alternative: «великий и грозный день Яхве»; «великий и внушающий трепет день Яхве»
  rationale: Сочетание удерживает одновременно величие дня и страх перед судом, не смягчая вторую характеристику до одного лишь благоговения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис краток и ясен; архаизмы исключены. «Яхве» сохраняет личное имя Бога, а «наступление дня» естественно передаёт еврейский образ его прихода.
