  text: And he will turn the hearts of fathers to their children[a], and the hearts of children to their fathers, lest I come and strike the land with a ban of destruction.
translation:
  language: ru
  text: И он обратит сердца отцов к детям и сердца детей к их отцам, чтобы Я не пришёл и не поразил землю, предав её заклятию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полностью уничтожив её»; традиционно: «поразив её проклятием». Еврейское слово обозначает то, что предано заклятию и предназначено для уничтожения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: И он обратит
  rationale: Hiphil глагола שוב здесь передаёт изменение направленности внутренних побуждений и отношений; «обратит» сохраняет еврейский образ и звучит естественно в торжественном пророческом контексте.
- source_word: לֵב
  choice: сердца
  rationale: В библейском иврите «сердце» обозначает внутреннего человека, включая волю, мысли и привязанности; множественное число уместно при собирательных группах.
- source_word: אָבוֹת
  choice: отцов
  rationale: Существительное имеет мужской род и буквально означает «отцы». В паре с «детьми» непосредственный межпоколенческий смысл вероятнее, чем более широкое «предки».
- source_word: עַל
  choice: к
  rationale: В сочетании с «обратить сердце» предлог выражает направленность отношений; русское «к» естественно передаёт эту функцию, не конкретизируя способ примирения.
- source_word: בָּנִים
  choice: детям / детей
  rationale: Форма может означать «сыновья», но также употребляется собирательно в значении потомства или детей; здесь «дети» естественно соответствует семейной и межпоколенческой параллели.
- source_word: אֲבוֹתָם
  choice: к их отцам
  rationale: Местоименный суффикс передан словом «их»; «отцам» сохраняет параллелизм с первой частью стиха.
- source_word: פֶּן
  choice: чтобы… не
  rationale: Союз вводит предостережение о нежелательном последствии. Русская конструкция «чтобы… не» сохраняет смысл «как бы не / иначе» и торжественный тон.
- source_word: אָבוֹא
  choice: Я не пришёл
  rationale: Передано первое лицо глагола בוא с учётом конструкции после פֶּן. Заглавная буква указывает на говорящего Бога в русском издательском оформлении.
- source_word: וְהִכֵּיתִי
  choice: и не поразил
  rationale: Глагол נכה в Hiphil обозначает нанесение удара или поражение; «поразил» ясно и достойно передаёт угрозу суда без архаического «сразил».
- source_word: הָאָרֶץ
  choice: землю
  rationale: אֶרֶץ может означать как землю вообще, так и конкретную страну. «Землю» сохраняет присущую исходному слову широту и не решает без необходимости, насколько локален масштаб угрозы.
- source_word: חֵרֶם
  choice: предав её заклятию
  rationale: חֵרֶם — не обычное слово для проклятия, а обозначение того, что безвозвратно посвящено Богу, часто для уничтожения в суде. Формулировка сохраняет специальное понятие и поясняется в сноске.
theological_decisions:
- issue: Значение חֵרֶם в заключительной угрозе
  choice: предав её заклятию
  alternative: полностью уничтожив её; поразив её проклятием
  rationale: Исходное слово обозначает объект, преданный под запрет и уничтожение в рамках Божьего суда, а не просто словесное проклятие. «Заклятие» сохраняет богословскую и культурную насыщенность термина, тогда как сноска раскрывает его смысл.
- issue: Направленность обращения сердец
  choice: сердца отцов к детям и сердца детей к их отцам
  alternative: сердца отцов вместе с детьми и сердца детей вместе с их отцами
  rationale: Предлог עַל допускает оттенки, но при глаголе «обратить» наиболее естественно обозначает направленность отношений. Перевод сохраняет взаимность двух параллельных частей, не добавляя конкретной модели примирения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксический параллелизм оригинала сохранён; архаизмы по возможности исключены, но специальный термин «заклятие» оставлен ради смысловой точности и разъяснён в сноске.
