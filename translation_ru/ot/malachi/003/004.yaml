  source_fidelity: 'Основной смысл передан точно: וְעָרְבָה выражено будущим «будет угодно», לַיהוָה — отношением к Яхве, מִנְחָה оставлено в более широком значении «приношение», а два параллельных указания на давнее прошлое сохранены. Однако יְהוּדָה следует передавать как «Иуда», а не «Иудея»: это традиционная русская форма еврейского названия в данном ветхозаветном контексте и она точнее сохраняет исходное имя.'
  naturalness: «Тогда приношение Иуды и Иерусалима будет угодно Яхве, как в давние дни и в прежние годы» — естественная современная литературная фраза с уместно сдержанным библейским регистром. В сноске «будет принято Яхве» менее естественно и несколько меняет конструкцию; «будет приемлемо для Яхве» яснее передаёт лексическую альтернативу.
