  text: וְ/עָֽרְבָה֙ לַֽ/יהוָ֔ה מִנְחַ֥ת יְהוּדָ֖ה וִ/ירֽוּשָׁלִָ֑ם כִּ/ימֵ֣י עוֹלָ֔ם וּ/כְ/שָׁנִ֖ים קַדְמֹנִיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/004.yaml
  text: Then the offering of Judah and Jerusalem will be pleasing to Yahweh[b][a], as in the days of old and as in former years.
translation:
  language: ru
  text: Тогда приношение Иуды и Иерусалима будет угодно Яхве[a], как в давние дни и в прежние годы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет приемлемо для Яхве». Слово «приношение» может также означать конкретно хлебное приношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְבָה
  choice: Тогда … будет угодно
  rationale: Глагол ערב означает «быть приятным, угодным, приемлемым». Будущее время определяется пророческим контекстом, а «тогда» передаёт значение следствия или последовательности, выраженное союзом וְ.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает того, кому угодно приношение; имя יהוה передано как «Яхве», то есть как личное заветное имя.
- source_word: מִנְחַת
  choice: приношение
  rationale: מִנְחָה может обозначать как приношение вообще, так и конкретно хлебное приношение. Более широкое «приношение» сохраняет возможный объём значения и не вносит неоправданного уточнения.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Иудеи и Иерусалима
  rationale: Использованы общепринятые русские формы географических названий; родительный падеж отражает конструкцию принадлежности.
- source_word: כִּימֵי עוֹלָם
  choice: как в давние дни
  rationale: עוֹלָם здесь указывает на далёкое прошлое, а не на метафизическую вечность. Формулировка сохраняет временное сравнение и поэтический строй.
- source_word: וּכְשָׁנִים קַדְמֹנִיּוֹת
  choice: и в прежние годы
  rationale: Фраза образует параллель с «в давние дни» и отсылает к прежнему времени; выбран естественный современный русский оборот.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон. «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Степень конкретности מִנְחָה
  choice: приношение
  alternative: хлебное приношение
  rationale: Хотя в культовом контексте слово нередко обозначает хлебное приношение, сама формулировка допускает более широкое значение. Основной текст не сужает его без необходимости, а сноска сообщает конкретную возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским звучанием. Сохранены поэтический параллелизм временных выражений и смысловая неоднозначность термина מִנְחָה.
