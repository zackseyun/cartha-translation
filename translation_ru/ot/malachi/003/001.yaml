id: MAL.3.1
reference: Malachi 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנְ/נִ֤י שֹׁלֵחַ֙ מַלְאָכִ֔/י וּ/פִנָּה דֶ֖רֶךְ לְ/פָנָ֑/י וּ/פִתְאֹם֩ יָב֨וֹא אֶל הֵיכָל֜/וֹ הָ/אָד֣וֹן אֲשֶׁר אַתֶּ֣ם מְבַקְשִׁ֗ים וּ/מַלְאַ֨ךְ הַ/בְּרִ֜ית אֲשֶׁר אַתֶּ֤ם חֲפֵצִים֙ הִנֵּה בָ֔א אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/001.yaml
  text: Behold[a], I am sending my messenger, and he will clear the way before me. And suddenly the Lord whom you seek will come to his temple, and the messenger of the covenant in whom you delight—behold, he is coming[b], says Yahweh of Armies.
translation:
  language: ru
  text: Вот, Я посылаю Моего вестника[a], и он расчистит путь предо Мной. И внезапно придёт в Свой храм Владыка, Которого вы ищете, и вестник завета, которого вы желаете. Вот, он идёт, — говорит Яхве Воинств[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово מַלְאָךְ может означать «вестник» или «ангел»; поэтому возможно: «Моего ангела» и далее «ангел завета».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «Господь Саваоф», то есть «Господь Воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי שֹׁלֵחַ
  choice: Вот, Я посылаю
  rationale: Сочетание указательной частицы, местоимения первого лица и причастия выражает торжественное, живое объявление о близком или несомненном действии.
- source_word: מַלְאָכִי
  choice: Моего вестника
  rationale: מַלְאָךְ может обозначать как человеческого посланника, так и ангела; «вестник» сохраняет более широкое значение и соответствует функции приготовления пути.
- source_word: וּפִנָּה דֶרֶךְ לְפָנָי
  choice: и он расчистит путь предо Мной
  rationale: Глагол передаёт приготовление пути через устранение препятствий; «расчистит» сохраняет конкретный образ, а первое лицо отражает речь Яхве.
- source_word: וּפִתְאֹם יָבוֹא אֶל הֵיכָלוֹ
  choice: И внезапно придёт в Свой храм
  rationale: «Внезапно» передаёт неожиданность прихода; הֵיכָל в культовом контексте означает храм. Возвратное «Свой» естественно связывает храм с Владыкой.
- source_word: הָאָדוֹן
  choice: Владыка
  rationale: Определённая форма служит возвышенным титулом. «Владыка» сохраняет торжественную силу и избегает графического смешения с традиционной передачей имени Яхве словом «Господь».
- source_word: אֲשֶׁר אַתֶּם מְבַקְשִׁים
  choice: Которого вы ищете
  rationale: Прямая и естественная передача продолжающегося поиска или ожидания.
- source_word: וּמַלְאַךְ הַבְּרִית
  choice: и вестник завета
  rationale: Сохраняется тот же широкий эквивалент для מַלְאָךְ; определённость еврейского сочетания передана как указание на известный завет.
- source_word: אֲשֶׁר אַתֶּם חֲפֵצִים
  choice: которого вы желаете
  rationale: חפץ выражает желание, благоволение или удовольствие. «Желаете» естественно относится к лицу и не усиливает положительную эмоциональную окраску сверх необходимого.
- source_word: הִנֵּה בָא
  choice: Вот, он идёт
  rationale: Указательная частица с формой, изображающей действие как уже наступающее, передаёт живую близость и уверенность прихода.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией, а צְבָאוֹת — буквально как «Воинств», что сохраняет отличие имени от титула и воинственно-небесный образ.
theological_decisions:
- issue: Соотношение «Владыки» и «вестника завета»
  choice: Оба обозначения переданы последовательно без прямого отождествления или разделения.
  alternative: Явно представить их одним лицом либо двумя различными лицами.
  rationale: Синтаксис допускает тесное приложение и возможное отождествление, но сам стих не требует снять эту неоднозначность.
- issue: Передача הָאָדוֹן в тексте с мессианским прочтением
  choice: Владыка
  alternative: Господь; хозяин
  rationale: «Владыка» сохраняет возвышенный титул и совместимо с мессианским прочтением, не добавляя более явного христологического отождествления, чем содержит еврейский текст.
- issue: Референт местоимения в הִנֵּה בָא
  choice: 'Сохранено единственное число: «он идёт».'
  alternative: Уточнить по имени, идёт ли Владыка или вестник завета.
  rationale: Мужской род единственного числа в еврейском тексте не разрешает полностью соотношение двух предшествующих титулов; перевод не должен делать это за автора.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, применены в соответствии с русской библейской издательской традицией. «Предо Мной» выбрано как умеренно возвышенная, но понятная форма; ключевая синтаксическая и богословская неоднозначность сохранена.
