  text: כִּֽי הִנֵּ֤ה הַ/יּוֹם֙ בָּ֔א בֹּעֵ֖ר כַּ/תַּנּ֑וּר וְ/הָי֨וּ כָל זֵדִ֜ים וְ/כָל עֹשֵׂ֤ה רִשְׁעָה֙ קַ֔שׁ וְ/לִהַ֨ט אֹתָ֜/ם הַ/יּ֣וֹם הַ/בָּ֗א אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֛ר לֹא יַעֲזֹ֥ב לָ/הֶ֖ם שֹׁ֥רֶשׁ וְ/עָנָֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/019.yaml
  text: For behold[a], the day is coming, burning like an oven, when all the arrogant and every evildoer will be stubble. The coming day will set them ablaze, says Yahweh of Armies[c][b], so that it will leave them neither root nor branch.
translation:
  language: ru
  text: Ибо вот, наступает день, пылающий, как печь. Тогда все надменные и все творящие зло станут соломой. Грядущий день сожжёт их, — говорит Яхве Воинств[a], — и не оставит им ни корня, ни ветви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве Сил»; традиционно: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: «Ибо» сохраняет связь с предшествующим объяснением, а «вот» передаёт указательную и торжественно-пророческую силу הִנֵּה.
- source_word: הַיּוֹם בָּא
  choice: наступает день
  rationale: Причастная форма выражает приближение дня; «наступает» естественно звучит по-русски и сохраняет ощущение близости события.
- source_word: בֹּעֵר כַּתַּנּוּר
  choice: пылающий, как печь
  rationale: תַּנּוּר прямо обозначает печь; «пылающий» передаёт интенсивное горение без замены образа более интерпретирующим «горнилом».
- source_word: זֵדִים
  choice: надменные
  rationale: Слово обозначает дерзко-гордых, самонадеянных людей; «надменные» ясно передаёт нравственную характеристику в современном литературном русском.
- source_word: כָל עֹשֵׂה רִשְׁעָה
  choice: все творящие зло
  rationale: Сохранена деятельная формулировка оригинала и собирательно-распределительное значение конструкции.
- source_word: קַשׁ
  choice: солома
  rationale: קַשׁ означает сухие стебли или пожнивные остатки. «Солома» понятна современному читателю и естественно сочетается с образом огня.
- source_word: וְלִהַט אֹתָם
  choice: опалит их
  rationale: Глагол выражает действие палящего огня. «Опалит» сохраняет огненный образ и не подменяет следующую фразу преждевременным итогом «полностью уничтожит».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — прозрачным титулом «Воинств», охватывающим небесные и земные силы.
- source_word: אֲשֶׁר לֹא יַעֲזֹב לָהֶם
  choice: и не оставит у них
  rationale: Относительная конструкция естественно передана как продолжение результата; субъектом остаётся грядущий день.
- source_word: שֹׁרֶשׁ וְעָנָף
  choice: ни корня, ни ветви
  rationale: Сохранён растительный меризм, выражающий полное искоренение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале непосредственно употреблено личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Степень истолкования огненного суда
  choice: 'Сохранить последовательность образов: «опалит» и затем «не оставит… ни корня, ни ветви»'
  alternative: «сожжёт дотла» или «полностью уничтожит»
  rationale: Оригинал сначала описывает действие пламени, а затем его исчерпывающий итог. Раздельная передача сохраняет структуру и богословское напряжение пророческого образа.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены повтор «день», образы печи, соломы, корня и ветви, а также личное имя Яхве.
