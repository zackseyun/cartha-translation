language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לְ/מִ/ימֵ֨י אֲבֹתֵי/כֶ֜ם סַרְתֶּ֤ם מֵֽ/חֻקַּ/י֙ וְ/לֹ֣א שְׁמַרְתֶּ֔ם שׁ֤וּבוּ אֵלַ/י֙ וְ/אָשׁ֣וּבָה אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֥ה נָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/007.yaml
  text: From the days of your fathers you have turned aside from my statutes and have not kept them. Return to me[a], and I will return to you, says Yahweh of hosts. But you say, “How shall we return?”
translation:
  language: ru
  text: 'Со времён ваших отцов[a] вы отступили от Моих установлений и не соблюдали их. Вернитесь ко Мне, и Я вернусь к вам, — говорит Яхве Воинств. Но вы спрашиваете: «Как нам вернуться?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предков». Буквально: «отцов».'
    reason: Лексема אֲבוֹת имеет буквальное значение «отцы», но в данном контексте может шире обозначать предков.
lexical_decisions:
- source_word: לְמִימֵי אֲבֹתֵיכֶם
  choice: Со времён ваших отцов
  rationale: Предлог и временное выражение обозначают период, начавшийся в прошлом. «Со времён» естественно передаёт эту протяжённость, а «отцов» сохраняет конкретную форму еврейского текста.
- source_word: סַרְתֶּם
  choice: вы отступали
  rationale: Глагол סור означает отклонение или отступление от пути либо установленной нормы. «Отступали» сохраняет метафору нарушения верности и согласуется с длительным временным охватом фразы.
- source_word: מֵחֻקַּי
  choice: от Моих установлений
  rationale: חֹק обозначает предписанное постановление или установленную норму. «Установления» точно и понятно передаёт правовой и заветный оттенок.
- source_word: וְלֹא שְׁמַרְתֶּם
  choice: и не соблюдали их
  rationale: В правовом и заветном контексте שׁמר означает соблюдать предписания. Местоимение «их» естественно отсылает к установлениям.
- source_word: שׁוּבוּ אֵלַי
  choice: Вернитесь ко Мне
  rationale: שׁוב выражает буквальное или нравственно-заветное возвращение. Перевод не сводит смысл только к внутреннему раскаянию и сохраняет образ возвращения.
- source_word: וְאָשׁוּבָה אֲלֵיכֶם
  choice: и Я вернусь к вам
  rationale: Повтор того же русского глагола сохраняет намеренную взаимность и риторическую связь двух форм שׁוב.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: «Яхве» передаёт личное имя יהוה, а «Воинств» сохраняет образ небесных или военных сил в צְבָאוֹת, не заменяя его более толковательным титулом «Всемогущий».
- source_word: בַּמֶּה נָשׁוּב
  choice: Как нам вернуться?
  rationale: בַּמֶּה спрашивает о способе или основании действия. Конструкция «Как нам вернуться?» естественна в современном русском и сохраняет открытый, возможно недоумённый или возражающий тон вопроса.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Смысл взаимного возвращения
  choice: «Вернитесь ко Мне, и Я вернусь к вам»
  alternative: «Обратитесь ко Мне, и Я обращусь к вам»
  rationale: Одинаковый глагол «вернуться» в обеих частях воспроизводит повтор שׁוב и сохраняет богословское напряжение призыва и обещанного Божьего ответа, не объясняя заранее характер этого ответа.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый русский библейский регистр.
