source:
  edition: WLC
  text: וּ/מִ֤י מְכַלְכֵּל֙ אֶת י֣וֹם בּוֹא֔/וֹ וּ/מִ֥י הָ/עֹמֵ֖ד בְּ/הֵרָֽאוֹת֑/וֹ כִּֽי הוּא֙ כְּ/אֵ֣שׁ מְצָרֵ֔ף וּ/כְ/בֹרִ֖ית מְכַבְּסִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/002.yaml
  text: But who can endure the day of his coming[a], and who can stand when he appears? For he is like a refiner’s fire and like launderers’ soap.
translation:
  language: ru
  text: Но кто выдержит день его пришествия и кто устоит, когда он явится? Ведь он — как огонь плавильщика и как щёлок прачечников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сильное щелочное средство, которым при стирке и обработке ткани удаляли загрязнения.
    reason: Пояснение исторического значения еврейского слова בֹּרִית и образа, который может быть не вполне очевиден современному читателю.
lexical_decisions:
- source_word: מְכַלְכֵּל
  choice: выдержит
  rationale: В данном контексте глагол означает «вынести, выдержать». Эта форма естественно передаёт риторический вопрос о способности пережить день пришествия.
- source_word: יוֹם בּוֹאוֹ
  choice: день его пришествия
  rationale: Сохраняет структуру еврейского словосочетания и его пророческую весомость, оставаясь понятным в современном русском языке.
- source_word: הָעֹמֵד
  choice: устоит
  rationale: В параллели с «выдержит» речь идёт о способности остаться стоять перед грядущим испытанием или судом.
- source_word: בְּהֵרָאוֹתוֹ
  choice: когда он явится
  rationale: 'Временное придаточное естественно передаёт значение нифаля: он станет видимым, явится.'
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующими риторическими вопросами и звучит естественно по-русски.
- source_word: כְּאֵשׁ מְצָרֵף
  choice: как огонь плавильщика
  rationale: Сохраняет конкретный образ огня, которым мастер очищает металл, не сводя метафору только к уничтожению или только к очищению.
- source_word: וּכְבֹרִית מְכַבְּסִים
  choice: как щёлок прачечников
  rationale: «Щёлок» точно обозначает сильное щелочное средство для очистки ткани, а «прачечников» сохраняет указание на людей, занимающихся стиркой, без архаичного и малопонятного слова «сукновалы» в основном тексте.
theological_decisions:
- issue: Характер действия грядущего лица
  choice: Сохранить образы сурового очищения и испытания, не уточняя их как исключительно уничтожение или исключительно освящение.
  alternative: Истолковать образы либо только как губительный суд, либо только как очистительное освящение.
  rationale: Огонь плавильщика и щёлок одновременно подразумевают силу, опасность и очищение; сам стих не устраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм двух риторических вопросов сохранён; местоимение «он» не конкретизировано сверх того, что дано в контексте.
