  source_fidelity: 'Смысл в целом передан верно: повеление обращено ко всему Израилю, Моисей назван Божьим слугой, а Хорив сохранён. Однако «законы» для מִשְׁפָּטִים чрезмерно сближает заключительный термин как с «законом» (תּוֹרָה), так и с «постановлениями» (חֻקִּים); следует яснее сохранить юридически-судебный оттенок второго слова.'
