  terminology: '«Закон», «Моисей», «Мой слуга» и «Хорив» выбраны удачно. Для חֻקִּים וּמִשְׁפָּטִים предпочтительнее «установления и судебные решения»: это не стирает различия между терминами и не повторяет слишком широкое «закон».'
