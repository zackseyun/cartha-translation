  text: זִכְר֕וּ תּוֹרַ֖ת מֹשֶׁ֣ה עַבְדִּ֑/י אֲשֶׁר֩ צִוִּ֨יתִי אוֹת֤/וֹ בְ/חֹרֵב֙ עַל כָּל יִשְׂרָאֵ֔ל חֻקִּ֖ים וּ/מִשְׁפָּטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/022.yaml
  text: Remember the law of Moses my servant[c][b][a], which I commanded him at Horeb for all Israel—statutes and judgments.
translation:
  language: ru
  text: Помните закон[a] Моисея, Моего слуги, который Я заповедал ему на Хориве[b] для всего Израиля, — установления и судебные решения[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление».'
    reason: lexical_alternative
  - marker: b
    text: Хорив — другое название Синая, горы, где Бог через Моисея дал Израилю закон завета.
    reason: cultural_note
  - marker: c
    text: 'Или: «постановления и законы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Помните
  rationale: Форма повелительного наклонения во множественном числе призывает весь народ не просто вспоминать, а сохранять в сознании и соблюдать данное Богом наставление. «Помните» передаёт это ёмко и естественно.
- source_word: תּוֹרַת
  choice: закон
  rationale: Хотя תּוֹרָה может означать также «наставление», упоминание Моисея, Хорива и последующих правовых терминов указывает здесь на данный Израилю Моисеев закон.
- source_word: מֹשֶׁה עַבְדִּי
  choice: Моисея, Моего слуги
  rationale: עֶבֶד в отношении Моисея является почётным обозначением человека, поставленного на служение Богу; «слуга» естественнее и точнее по контексту, чем «раб».
- source_word: אֲשֶׁר צִוִּיתִי אֹתוֹ
  choice: который Я заповедал ему
  rationale: Относительное местоимение отнесено к «закону», а «ему» — к Моисею как получателю и посреднику повеления. Глагол «заповедал» сохраняет заветно-обязательный оттенок צוה.
- source_word: בְּחֹרֵב
  choice: на Хориве
  rationale: Русское «на Хориве» естественно обозначает место заключения завета и дарования закона.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: для всего Израиля
  rationale: 'Предлог עַל здесь указывает на область действия и предназначение закона: он дан всему народу Израиля.'
- source_word: חֻקִּים
  choice: постановления
  rationale: Слово обозначает установленные обязательные предписания и сохраняет юридический оттенок исходного термина.
- source_word: וּמִשְׁפָּטִים
  choice: и законы
  rationale: В данном перечислении מִשְׁפָּטִים обозначает правовые нормы и решения. «Законы» звучит естественно по-русски, хотя частично сближается с более широким словом תּוֹרָה; более буквальная альтернатива вынесена в примечание.
theological_decisions:
- issue: Значение תּוֹרָה в контексте завета
  choice: закон
  alternative: наставление
  rationale: Контекст Моисея, Хорива и обязательных постановлений делает правовой и заветный смысл основным, не исключая более широкого значения «наставление».
- issue: Обозначение Моисея словом עֶבֶד
  choice: Мой слуга
  alternative: Мой раб
  rationale: Здесь это почётный титул верного и уполномоченного Божьего служителя, а не акцент на несвободном социальном положении.
- issue: Соотношение חֻקִּים и מִשְׁפָּטִים
  choice: постановления и законы
  alternative: уставы и судебные решения
  rationale: Основной текст сохраняет различие двух правовых понятий в понятной современной форме; примечание отражает более узкую юридическую передачу второго слова.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранено прямое Божье обращение; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Тире перед заключительной парой терминов передаёт пояснительное приложение в еврейском тексте.
