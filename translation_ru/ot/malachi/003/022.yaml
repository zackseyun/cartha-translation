- from: Помните закон[a] Моисея, Моего слуги, который Я заповедал ему на Хориве[b] для всего Израиля, — постановления и законы[c].
  to: Помните закон[a] Моисея, Моего слуги, который Я заповедал ему на Хориве[b] для всего Израиля, — установления и судебные решения[c].
  rationale: Исправлена только передача заключительной пары חֻקִּים וּמִשְׁפָּטִים. «Установления и судебные решения» сохраняет различие предписаний и судебно-правовых установлений, тогда как прежнее «постановления и законы» частично нивелировало его. Примечание c приведено в соответствие с новым основным вариантом. Остальные элементы текста и привязки примечаний сохранены.
