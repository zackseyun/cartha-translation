  text: Then you will again see the difference between the righteous and the wicked[a], between one who serves God and one who does not serve him.
translation:
  language: ru
  text: Тогда вы снова увидите различие между праведным и нечестивым[a], между тем, кто служит Богу, и тем, кто Ему не служит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И вы возвратитесь и увидите между праведным и нечестивым». Вероятно, этот еврейский оборот означает, что они снова увидят различие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתֶּם
  choice: Тогда вы снова
  rationale: 'Глагол שׁוב буквально означает «возвращаться, обращаться», но в сочетании с последующим «увидите» здесь естественно передаёт возобновлённое восприятие: «снова увидите». «Тогда» связывает это будущее прозрение с предшествующим Божьим действием.'
- source_word: וּרְאִיתֶם
  choice: увидите
  rationale: Сохраняет конкретное значение ראה «видеть» и одновременно допускает контекстуальный смысл «распознать, понять».
- source_word: בֵּין ... לְ
  choice: увидите различие между
  rationale: Повторённое בֵּין выражает противопоставление. Добавление слова «различие» делает еврейский оборот естественным по-русски, не внося нового содержания.
- source_word: צַדִּיק
  choice: праведным
  rationale: «Праведный» — устоявшийся и точный русский эквивалент морально-религиозной категории צַדִּיק.
- source_word: רָשָׁע
  choice: нечестивым
  rationale: «Нечестивый» естественно передаёт רָשָׁע как противоположность праведному в пророческом контексте; более узкое «виновный» придало бы выражению преимущественно судебный оттенок.
- source_word: עֹבֵד אֱלֹהִים
  choice: тем, кто служит Богу
  rationale: Глагол עבד по отношению к Богу охватывает поклонение, верность и послушание; «служит Богу» сохраняет эту широту.
- source_word: לַאֲשֶׁר לֹא עֲבָדוֹ
  choice: тем, кто Ему не служит
  rationale: Относительная конструкция прямо противопоставлена служащему Богу, а местоименный суффикс относится к Богу. Настоящее время по-русски ясно выражает характеристику двух групп, не исключая временного оттенка еврейской формы.
theological_decisions:
- issue: Следует ли явно связывать различие с последним судом
  choice: Передать будущее распознание различия, не добавляя слов о последнем суде.
  alternative: «Тогда, на суде, вы увидите различие…»
  rationale: Контекст говорит о грядущем Божьем действии и оправдании верных, однако сам стих не называет это событие последним судом. Перевод сохраняет богословскую напряжённость текста.
- issue: Характер служения Богу
  choice: Сохранить широкое выражение «служит Богу».
  alternative: «поклоняется Богу»
  rationale: עבד может включать поклонение, но не ограничивается обрядовым действием; оно также подразумевает верность и послушание.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для широкого читателя; традиционные богословские термины «праведный» и «нечестивый» сохранены как ясная смысловая пара.
