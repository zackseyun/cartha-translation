  rationale: Восстановлено в полном объёме «и они будут принадлежать Яхве», передающее וְהָיוּ לַיהוָה без богословского расширения. Начальный образ приведён ближе к предикативной конструкции еврейского текста. Неоднозначность מִנְחָה и сфера выражения «в праведности» сохранены.
