  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יָשַׁ֨ב מְצָרֵ֤ף וּ/מְטַהֵר֙ כֶּ֔סֶף וְ/טִהַ֤ר אֶת בְּנֵֽי לֵוִי֙ וְ/זִקַּ֣ק אֹתָ֔/ם כַּ/זָּהָ֖ב וְ/כַ/כָּ֑סֶף וְ/הָיוּ֙ לַֽ/יהוָ֔ה מַגִּישֵׁ֥י מִנְחָ֖ה בִּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/003.yaml
  text: He will sit as a refiner and purifier of silver[a], and he will purify the sons of Levi and refine them like gold and like silver, and they will be for Yahweh, presenting an offering in righteousness.
translation:
  language: ru
  text: Он сядет как плавильщик и очиститель серебра; Он очистит сынов Левия и переплавит их, как золото и как серебро, и они будут принадлежать Яхве, принося приношение[a] в праведности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлебное приношение». Еврейское слово «минха» часто обозначает именно хлебное приношение, но может употребляться и шире — о приношении или даре.'
    reason: 'Лексическая альтернатива: сохранение возможного специального культового значения מִנְחָה.'
lexical_decisions:
- source_word: וְיָשַׁב מְצָרֵף וּמְטַהֵר כֶּסֶף
  choice: Он сядет, чтобы переплавлять и очищать серебро
  rationale: Сохраняется конкретный образ мастера, сидящего за длительной и внимательной очисткой металла. Глагольная формулировка звучит по-русски естественнее буквального, но тяжеловесного «как плавильщик и очиститель серебра».
- source_word: וְטִהַר
  choice: очистит
  rationale: «Очистит» передаёт как продолжение металлургического образа, так и его культово-нравственный смысл применительно к священникам.
- source_word: בְּנֵי לֵוִי
  choice: сынов Левия
  rationale: Сохранено буквальное родовое обозначение, подчёркивающее принадлежность к священнической линии, без сведения выражения к более общему «левитов».
- source_word: וְזִקַּק אֹתָם
  choice: и переплавит их
  rationale: Глагол обозначает очищение металла посредством плавки; «переплавит» поддерживает сквозной металлургический образ.
- source_word: כַּזָּהָב וְכַכָּסֶף
  choice: как золото и как серебро
  rationale: Повтор сравнительного союза отражает повтор предлога כ в еврейском тексте и сохраняет ритмический параллелизм.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, в распространённой русской транслитерации.
- source_word: מַגִּישֵׁי מִנְחָה
  choice: будут они приносить … приношение
  rationale: Естественная русская конструкция передаёт причастное выражение «приносящие приношение», избегая ненужной тавтологии.
- source_word: מִנְחָה
  choice: приношение
  rationale: Термин может обозначать дар или приношение в широком смысле, хотя в культовом употреблении часто относится именно к хлебному приношению; более узкое значение указано в сноске.
- source_word: בִּצְדָקָה
  choice: в праведности
  rationale: Сохранена именная форма и возможное сочетание нравственного и культового смысла, не сведённое к одному наречию «праведно».
theological_decisions:
- issue: К кому относится образ очищения
  choice: В основном тексте очищение прямо отнесено к сынам Левия, то есть к священнической линии.
  alternative: Образ может толковаться шире как очищение всего Израиля или мессиански в свете дальнейшего канонического прочтения.
  rationale: Непосредственный контекст называет сынов Левия; более широкие богословские применения не следует вносить в сам перевод.
- issue: Точное значение מִנְחָה
  choice: В основном тексте употреблено более широкое «приношение».
  alternative: «Хлебное приношение».
  rationale: Еврейское слово часто имеет специальное культовое значение, но допускает и более широкое. Неопределённость сохранена с помощью сноски.
- issue: Связь בִּצְדָקָה с приношением
  choice: «приношение в праведности» сохраняет компактную связь предложной группы с актом принесения.
  alternative: «праведно приносить приношение» или «приношение, соответствующее праведности».
  rationale: Буквальная именная конструкция не решает окончательно, описывает ли выражение нравственное состояние приносящих, надлежащий способ принесения или приемлемый характер самого приношения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «как … и как …» намеренно сохранён ради еврейского параллелизма. Маркер сноски поставлен непосредственно после слова «приношение», к которому относится примечание.
