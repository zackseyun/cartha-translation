  verdict: revise
  source_fidelity: 'Основной смысл передан точно: риторический вопрос, обвинение в неправомерном лишении Бога должного и ответ «в десятине и приношении» сохранены. Однако וַאֲמַרְתֶּם — «и вы говорите/скажете», а не «вы спросите»: русский глагол «спросите» меняет форму реплики и будущее время. В вопросе народа кְבַעֲנוּךָ стоит совершенная форма «мы обокрали Тебя»; её следует отразить.'
  naturalness: «Обкрадывать» уместно и литературно в данном обличительном контексте. Замена «Вы спросите» на «А вы говорите» устраняет неестественное смещение в будущее и лучше воспроизводит повторяющуюся пророческую формулу. «В чём мы обокрали Тебя?» естественно и ясно.
  terminology: «Десятина» точно передаёт מַעֲשֵׂר. «Приношение» — подходящее общее соответствие תְּרוּמָה, не навязывающее более узкий ритуальный смысл. Сноска с вариантом «пожертвование» уместна и привязана к слову, которое поясняет.
