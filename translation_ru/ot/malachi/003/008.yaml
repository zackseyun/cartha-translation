  text: הֲ/יִקְבַּ֨ע אָדָ֜ם אֱלֹהִ֗ים כִּ֤י אַתֶּם֙ קֹבְעִ֣ים אֹתִ֔/י וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה קְבַעֲנ֑וּ/ךָ הַֽ/מַּעֲשֵׂ֖ר וְ/הַ/תְּרוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/008.yaml
  text: Will a man rob God? Yet you are robbing me[a]. But you say[b], “How have we robbed you?” In the tithe and the contribution.
translation:
  language: ru
  text: 'Разве человек станет обкрадывать Бога? А вы обкрадываете Меня! А вы говорите: «В чём мы обокрали Тебя?» — В десятине и приношении[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пожертвовании». Еврейское слово означает дар или взнос, выделенный для священного употребления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְבַּע / קֹבְעִים / קְבַעֲנוּךָ
  choice: обкрадывать / обкрадываете / обкрадываем
  rationale: Редкий глагол קבע в этом контексте означает неправомерно удерживать то, что причитается Богу. «Обкрадывать» естественно передаёт как лишение должного, так и резкую силу обвинения; «грабить» могло бы ошибочно намекать на открытое насилие.
- source_word: אָדָם
  choice: человек
  rationale: Существительное употреблено в обобщённом значении и обозначает любого человека; русское «человек» точно и естественно передаёт этот смысл без указания исключительно на мужчину.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Здесь אֱלֹהִים обозначает Бога Израиля; это стандартное русское соответствие.
- source_word: כִּי
  choice: а
  rationale: В данном риторическом построении частица вводит контраст между кажущейся немыслимостью поступка и фактическим обвинением народа. Русское «а» передаёт этот противительный переход естественно и без избыточного истолкования.
- source_word: בַּמֶּה
  choice: в чём
  rationale: Вопрос касается того, в отношении чего народ обкрадывает Бога. «В чём» также согласуется с последующим ответом, буквально называющим десятину и приношение.
- source_word: הַמַּעֲשֵׂר
  choice: десятина
  rationale: מַעֲשֵׂר — установленная десятая часть, отдаваемая Богу; «десятина» является точным и общеупотребительным русским термином.
- source_word: הַתְּרוּמָה
  choice: приношение
  rationale: תְּרוּמָה обозначает выделенный для священного употребления дар или взнос. «Приношение» естественно для культового контекста и не навязывает узкого представления о конкретном ритуальном движении.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: Разве человек может обкрадывать Бога?
  alternative: Разве может кто-либо обкрадывать Бога?
  rationale: Единственное число אָדָם носит обобщённый, пословичный характер. «Человек» сохраняет форму и краткость еврейского вопроса, оставаясь в современном русском языке родово нейтральным по смыслу.
- issue: Число существительных מַעֲשֵׂר и תְּרוּמָה
  choice: в десятине и приношении
  alternative: десятинами и приношениями
  rationale: 'Еврейский текст ставит оба слова в единственном числе с артиклем. Сохранение единственного числа удерживает формальную неопределённость: речь может идти как об установлениях в целом, так и о причитающихся дарах.'
translation_notes:
  register: Современный литературный русский язык с кратким, обличительным ритмом пророческой речи. Заглавные буквы в местоимениях «Меня» и «Тебя» использованы по принятой русской библейской традиции. Реплика народа передана будущим «спросите», естественным для повторяющейся в книге формулы возражения, хотя еврейская форма буквально означает «вы сказали». Все сноски, указанные в аппарате, отмечены в основном тексте.
