  text: אָ֧ז נִדְבְּר֛וּ יִרְאֵ֥י יְהוָ֖ה אִ֣ישׁ אֶת רֵעֵ֑/הוּ וַ/יַּקְשֵׁ֤ב יְהוָה֙ וַ/יִּשְׁמָ֔ע וַ֠/יִּכָּתֵב סֵ֣פֶר זִכָּר֤וֹן לְ/פָנָי/ו֙ לְ/יִרְאֵ֣י יְהוָ֔ה וּ/לְ/חֹשְׁבֵ֖י שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/016.yaml
  text: Then those who feared Yahweh spoke with one another[a], and Yahweh paid attention and heard[b]; and a book of remembrance was written before him for those who fear Yahweh and who esteem his name.
translation:
  language: ru
  text: Тогда боящиеся Яхве говорили друг с другом[a], и Яхве прислушался и услышал; перед Ним была написана памятная книга о боящихся Яхве и почитающих Его имя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый со своим ближним».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «помышляющих о Его имени»; также возможно: «считающихся с Его именем».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной переход и связь с предшествующей ситуацией.
- source_word: נִדְבְּרוּ ... אִישׁ אֶת־רֵעֵהוּ
  choice: говорили друг с другом
  rationale: Форма глагола и идиома выражают взаимное действие; современная русская формулировка сохраняет этот смысл.
- source_word: יִרְאֵי יְהוָה
  choice: боящиеся Яхве
  rationale: Сохраняет вес ירא — благоговейный страх и верность Богу — без смягчения до одного лишь уважения.
- source_word: וַיַּקְשֵׁב ... וַיִּשְׁמָע
  choice: внимал и слышал
  rationale: 'Сохраняет два последовательных еврейских глагола: внимательное прислушивание и слышание.'
- source_word: וַיִּכָּתֵב סֵפֶר זִכָּרוֹן
  choice: была записана памятная книга
  rationale: Пассивная конструкция соответствует еврейскому тексту, а «памятная книга» обозначает запись, предназначенную для сохранения памяти.
- source_word: לְפָנָיו
  choice: перед Ним
  rationale: Прямо передаёт пространственно-реляционную формулу присутствия перед Богом.
- source_word: לְיִרְאֵי יְהוָה
  choice: о боящихся Яхве
  rationale: Предлог ל допускает отнесённость записи к этим людям; «о» естественно для русской речи в сочетании с книгой-записью.
- source_word: וּלְחֹשְׁבֵי שְׁמוֹ
  choice: и почитающих Его имя
  rationale: Передаёт смысл признания ценности и благоговейного отношения к Божьему имени, сохраняя возможность более буквального понимания в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Обозначение верных как יִרְאֵי יְהוָה
  choice: боящиеся Яхве
  alternative: почитающие Яхве; благоговеющие перед Яхве
  rationale: «Боящиеся» сохраняет библейское напряжение между страхом, благоговением и заветной верностью, не сводя выражение к уважению.
- issue: Значение וּלְחֹשְׁבֵי שְׁמוֹ
  choice: почитающих Его имя
  alternative: помышляющих о Его имени; считающихся с Его именем
  rationale: В контексте выражение указывает на осознанное, ценностное отношение к Божьему имени. Основной текст передаёт это естественно, а сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис умеренно формальный; сохранены повтор имени Яхве, термин «боящиеся» и пара глаголов «внимал и слышал». Все сноски отмечены в основном тексте.
