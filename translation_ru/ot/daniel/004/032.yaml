  text: וְ/כָל דארי אַרְעָ/א֙ כְּ/לָ֣ה חֲשִׁיבִ֔ין וּֽ/כְ/מִצְבְּיֵ֗/הּ עָבֵד֙ בְּ/חֵ֣יל שְׁמַיָּ֔/א ו/דארי אַרְעָ֑/א וְ/לָ֤א אִיתַי֙ דִּֽי יְמַחֵ֣א בִ/ידֵ֔/הּ וְ/יֵ֥אמַר לֵ֖/הּ מָ֥ה עֲבַֽדְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/032.yaml
  text: And all the inhabitants of the earth are regarded as nothing[a], and he does according to his will among the army of heaven and among the inhabitants of the earth; and there is no one who can strike his hand or say to him[b], “What have you done?”
translation:
  language: ru
  text: 'И все жители земли считаются за ничто, а Он поступает по Своей воле среди небесного воинства и жителей земли. И нет никого, кто мог бы удержать Его руку[a] или сказать Ему: «Что Ты сделал?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ударить по Его руке»; то есть воспрепятствовать Ему или удержать Его руку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דארי אַרְעָא
  choice: жители земли
  rationale: Естественно передаёт арамейское обозначение обитающих на земле и сохраняет всеобщий охват контекста.
- source_word: כְּלָה חֲשִׁיבִין
  choice: считаются за ничто
  rationale: Передаёт значение оценки или вменения, не утверждая буквального небытия людей.
- source_word: וּכְמִצְבְּיֵהּ
  choice: по Своей воле
  rationale: Сохраняет значение воли, желания или изволения и естественно звучит в современном литературном русском.
- source_word: עָבֵד
  choice: поступает
  rationale: Передаёт общее значение действия; в сочетании «поступает по Своей воле» звучит естественнее буквального «делает по Своей воле».
- source_word: בְּחֵיל שְׁמַיָּא
  choice: среди небесного воинства
  rationale: Сохраняет военный образ חֵיל и не сужает неоднозначный референт до ангелов или небесных светил.
- source_word: וְלָא אִיתַי דִּי
  choice: и нет никого, кто мог бы
  rationale: Передаёт экзистенциальную конструкцию и выраженную ею невозможность противодействия.
- source_word: יְמַחֵא בִידֵהּ
  choice: ударить Его по руке
  rationale: Сохраняет яркий буквальный образ арамейской идиомы; подразумеваемое значение — помешать или удержать — пояснено в сноске.
- source_word: מָה עֲבַדְתְּ
  choice: Что Ты сделал?
  rationale: Передаёт перфект и риторический вызов совершённому действию.
theological_decisions:
- issue: Кто является верховным действующим лицом
  choice: Сохранено местоимение «Он», а референт определяется ближайшим контекстом как Всевышний.
  alternative: Вставить в текст «Бог» или «Всевышний».
  rationale: Арамейский текст использует местоименную форму; явное именование референта сняло бы контекстуальную связь ценой добавления отсутствующего слова.
- issue: Состав небесного воинства
  choice: Общее выражение «небесное воинство» без уточнения состава.
  alternative: Истолковать как ангелов либо как небесные светила.
  rationale: Фраза допускает широкий смысл, и перевод не должен устранять эту неоднозначность.
- issue: Образ противодействия Божьей руке
  choice: Сохранён буквальный образ «ударить Его по руке» со сноской об идиоматическом смысле.
  alternative: 'Основной текст: «удержать Его руку» или «помешать Ему».'
  rationale: Буквальный образ необычен, но понятен при пояснении и точнее отражает форму источника, не скрывая идиоматического значения.
translation_notes:
  register: Современный литературный русский с достоинством пророческого повествования. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому религиозному регистру; синтаксис остаётся ясным для широкого читателя.
