lexical_decisions:
- source_word: דְּנָה
  choice: вот
  rationale: Указательное слово вводит разъяснение сна; «вот» естественно передаёт предъявление толкования в современной русской речи.
- source_word: פִשְׁרָא
  choice: толкование
  rationale: В библейском арамейском слово обозначает истолкование сна или тайны; «толкование» точно соответствует придворному контексту.
- source_word: מַלְכָּא
  choice: царь
  rationale: Первое употребление является обращением; форма без частицы «о» сохраняет достоинство и звучит естественно по-русски.
- source_word: וּגְזֵרַת
  choice: и вот постановление
  rationale: Слово обозначает властное решение или указ, здесь — решение о суде. «Постановление» передаёт официальный и обязательный характер, не ограничивая смысл земным царским указом.
- source_word: עִלָּיָא
  choice: Всевышнего
  rationale: Устоявшийся и точный русский титул Бога, подчёркивающий Его верховенство над земными правителями.
- source_word: הִיא
  choice: вот
  rationale: Самостоятельное местоимение поддерживает именную конструкцию «это постановление»; повтор «вот» естественно выражает эту вторую предикативную часть.
- source_word: דִּי
  choice: которое
  rationale: Относительное местоимение вводит определительное придаточное к слову «постановление».
- source_word: מְטָת
  choice: постигло
  rationale: Глагол буквально выражает достижение или приход. В контексте вынесенного суда «постигло» естественно передаёт, что постановление достигло царя, не добавляя слова «наказание».
- source_word: עַל
  choice: постигло
  rationale: Значение направленности «на/против» передано русским управлением глагола «постигло»; отдельный предлог в русском не требуется.
- source_word: מָרִי
  choice: господина моего
  rationale: Сохраняет почтительное придворное обращение Даниила и несколько возвышенный порядок слов оригинала.
- source_word: מַלְכָּא
  choice: царя
  rationale: 'Второе употребление поясняет титул «господина моего»: «господина моего, царя».'
theological_decisions:
- issue: Передача божественного титула עִלָּיָא
  choice: Всевышнего
  alternative: Высочайшего
  rationale: «Всевышний» — точный и общепонятный библейский титул, выражающий верховенство Бога над всеми властителями без внесения дополнительных богословских уточнений.
- issue: Характер божественного решения גְזֵרַת
  choice: постановление
  alternative: указ
  rationale: «Постановление» сохраняет властный и судебный оттенок, не отождествляя Божье решение исключительно с формой земного царского документа.
translation_notes:
  register: Современный литературный русский с достоинством придворной речи. Обращение «царь» и оборот «господина моего, царя» сохраняют почтительность оригинала; двоеточие указывает на последующее содержание постановления.
