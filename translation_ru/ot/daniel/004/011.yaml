  text: קָרֵ֨א בְ/חַ֜יִל וְ/כֵ֣ן אָמַ֗ר גֹּ֤דּוּ אִֽילָנָ/א֙ וְ/קַצִּ֣צוּ עַנְפ֔וֹ/הִי אַתַּ֥רוּ עָפְיֵ֖/הּ וּ/בַדַּ֣רוּ אִנְבֵּ֑/הּ תְּנֻ֤ד חֵֽיוְתָ/א֙ מִן תַּחְתּ֔וֹ/הִי וְ/צִפְּרַיָּ֖/א מִן עַנְפֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/011.yaml
  text: 'He cried aloud and said thus: ‘Chop down the tree[a], and cut off its branches; strip off its foliage, and scatter its fruit. Let the beasts flee from beneath it[b], and the birds from its branches.’'
translation:
  language: ru
  text: 'Он громко воскликнул и сказал: «Срубите дерево[a], отсеките его ветви, оборвите с него листву и разбросайте его плоды. Пусть звери уйдут из-под него, а птицы — с его ветвей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повалите дерево».'
    reason: 'Лексическая альтернатива: глагол допускает акцент либо на рубке, либо на результате — падении дерева.'
  - marker: b
    text: 'Последняя фраза в арамейском эллиптична: глагол не повторён; подразумевается, что птицы также должны покинуть ветви.'
    reason: Пояснение синтаксического эллипсиса, переданного в русском тексте тире.
lexical_decisions:
- source_word: קָרֵא בְחַיִל
  choice: Он громко возгласил
  rationale: Оборот буквально передаёт сильный, громкий призыв; «громко возгласил» сохраняет торжественный характер провозглашения и естественно звучит по-русски.
- source_word: וְכֵן אָמַר
  choice: и сказал так
  rationale: כֵן вводит содержание последующей речи со значением «так, следующим образом».
- source_word: גֹּדּוּ אִילָנָא
  choice: Срубите дерево
  rationale: Императив означает повалить дерево рубкой; «срубите» точно и естественно передаёт действие.
- source_word: וְקַצִּצוּ עַנְפוֹהִי
  choice: отсеките его ветви
  rationale: קצץ обозначает отсечение или обрубание; отдельный глагол сохраняет различие с повелением срубить само дерево.
- source_word: אַתַּרוּ עָפְיֵהּ
  choice: оборвите с него листву
  rationale: Глагол выражает удаление или срывание, а עָפְיֵהּ — совокупную листву. Формулировка конкретна и естественна.
- source_word: וּבַדַּרוּ אִנְבֵּהּ
  choice: и разбросайте его плоды
  rationale: בדר означает рассеивать или разбрасывать; множественное «плоды» идиоматично передаёт собирательное обозначение плода дерева.
- source_word: תְּנֻד חֵיוְתָא מִן תַּחְתּוֹהִי
  choice: Пусть звери убегут из-под него
  rationale: תְּנֻד указывает на удаление, бегство или изгнание; в сцене внезапного уничтожения дерева «убегут» ясно передаёт результат.
- source_word: וְצִפְּרַיָּא מִן עַנְפוֹהִי
  choice: а птицы — с его ветвей
  rationale: В арамейском это эллиптическая параллельная конструкция без повторения глагола; русское тире естественно обозначает пропуск подразумеваемого «пусть убегут/улетят».
theological_decisions:
- issue: Повелительная и желательная сила провозглашения
  choice: Передать начальные формы прямыми повелениями, а תְּנֻד — конструкцией «пусть… убегут»; в последней параллельной части сохранить эллипсис посредством тире.
  alternative: 'Явно повторить действие: «а птицы пусть улетят с его ветвей».'
  rationale: Так сохраняются смена императивов на юссивное значение и синтаксическая краткость последней арамейской фразы без внесения богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой провозглашения. Ритм цепочки повелений сохранён; архаизмы и конфессионально окрашенная терминология не используются.
