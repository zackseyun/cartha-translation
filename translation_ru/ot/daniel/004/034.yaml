  to: Теперь я, Навуходоносор, восхваляю, превозношу и прославляю Царя небес, потому что все Его дела истинны и все Его пути справедливы; а тех, кто ходит в гордости, Он может смирить.
  rationale: Сохранены явное «теперь», три глагола хвалы, модальность «может» и образ «ходят в гордости». Исправлены конструкция титула («Царь небес») и русская предикация качеств Божьих дел и путей ради более точного и естественного современного литературного звучания.
