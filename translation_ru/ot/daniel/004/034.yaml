base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/034.yaml
  text: I, Nebuchadnezzar, praise and exalt and honor the King of heaven, because all his works are truth, and his ways are justice; and those who walk in pride he is able to humble.
translation:
  language: ru
  text: Теперь я, Навуходоносор, восхваляю, превозношу и прославляю Царя небес, потому что все Его дела истинны и все Его пути справедливы; а тех, кто ходит в гордости, Он может смирить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: Теперь
  rationale: Арамейское наречие здесь явно обозначает итоговый временной переход в речи Навуходоносора; «теперь» естественно передаёт его заключительное исповедание.
- source_word: מְשַׁבַּח וּמְרוֹמֵם וּמְהַדַּר
  choice: восхваляю, превозношу и прославляю
  rationale: 'Сохранена трёхчленная последовательность глаголов: хвала, возвышение и воздание славы/чести.'
- source_word: מֶלֶךְ שְׁמַיָּא
  choice: Небесного Царя
  rationale: Естественное русское соответствие выражению «Царь небес»; заглавные буквы указывают на Бога как на конкретного Царя.
- source_word: קְשֹׁט
  choice: истина
  rationale: Существительное означает истину, истинность и верность; именная формулировка сохраняет категоричность исходного текста.
- source_word: דִּין
  choice: правосудие
  rationale: В данном контексте речь о справедливом суде как качестве Божьих путей; «правосудие» сохраняет юридико-нравственный оттенок.
- source_word: מַהְלְכִין בְּגֵוָה
  choice: ходят в гордости
  rationale: Сохранена образная идиома исходного текста, понятная и в современном русском языке.
- source_word: יָכִל לְהַשְׁפָּלָה
  choice: может смирить
  rationale: Передана заявленная способность Бога унизить или низвести гордых; «смирить» естественно выражает результат без ослабления смысла.
theological_decisions:
- issue: Характер Божьих дел и путей
  choice: «все Его дела — истина, и пути Его — правосудие»
  alternative: «все Его дела истинны, и пути Его справедливы»
  rationale: Именные соответствия ближе сохраняют форму арамейского текста и его богословски весомые утверждения, не сводя их только к качественным прилагательным.
- issue: Божья власть над гордыми
  choice: «Он может смирить»
  alternative: «Он способен унизить»
  rationale: «Может» прямо передаёт יָכִל; «смирить» сохраняет возможность как низведения, так и приведения к смирению, не разрешая эту смысловую напряжённость односторонне.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным библейским регистром. Синтаксический параллелизм и трёхчленная хвала сохранены; архаизмы и конфессионально маркированная лексика не использованы.
