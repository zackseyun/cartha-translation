  text: אֲנָ֣ה נְבוּכַדְנֶצַּ֗ר שְׁלֵ֤ה הֲוֵית֙ בְּ/בֵיתִ֔/י וְ/רַעְנַ֖ן בְּ/הֵיכְלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/001.yaml
  text: I[a], Nebuchadnezzar[b], was at ease in my house and flourishing in my palace.
translation:
  language: ru
  text: Я, Навуходоносор, спокойно[a] жил в своём доме и процветал[b] в своём дворце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безмятежно» или «в безопасности»; арамейское слово может указывать как на спокойствие, так и на защищённость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благоденствовал»; это слово выражает полноту сил, благополучие и преуспевание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנָה
  choice: Я
  rationale: Самостоятельное местоимение первого лица; сочетание с именем передано естественной русской конструкцией «Я, Навуходоносор».
- source_word: נְבוּכַדְנֶצַּר
  choice: Навуходоносор
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: שְׁלֵה
  choice: спокойно
  rationale: Передаёт состояние покоя и безмятежности, не сводя значение исключительно к материальному достатку; возможный оттенок безопасности отмечен в сноске.
- source_word: הֲוֵית
  choice: жил
  rationale: В сочетании с наречием и указанием места русское «жил спокойно» естественно передаёт арамейскую связочную конструкцию в прошедшем времени.
- source_word: בְּבֵיתִי
  choice: в своём доме
  rationale: Сохраняет конкретный образ дома и параллелизм с последующим «в своём дворце»; возвратное притяжательное местоимение естественно для русского языка.
- source_word: וְרַעְנַן
  choice: и процветал
  rationale: Передаёт свежесть сил, благополучие и преуспевание, заключённые в арамейском прилагательном; глагольная форма звучит естественно по-русски.
- source_word: בְּהֵיכְלִי
  choice: в своём дворце
  rationale: В данном царском контексте слово обозначает дворец, а не храм; перевод сохраняет параллель с «в своём доме».
