  yaml_path: translation/ot/daniel/004/026.yaml
  text: At the end of twelve months[a], he was walking on the roof of the royal palace of Babylon.
translation:
  language: ru
  text: По прошествии двенадцати месяцев он ходил по крыше царского дворца в Вавилоне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на дворце Вавилонского царства». Возможно, имеется в виду крыша или верхняя часть дворца.'
    reason: Сохраняет пространственную неоднозначность арамейского выражения и отмечает, что слово «крыша» подразумевается контекстом.
lexical_decisions:
- source_word: לִ/קְצָת
  choice: По прошествии
  rationale: Передаёт завершение указанного периода естественным русским временным оборотом.
- source_word: יַרְחִין תְּרֵי עֲשַׂר
  choice: двенадцати месяцев
  rationale: Прямо передаёт арамейское обозначение двенадцати месяцев, не сводя его к более общему «году».
- source_word: עַל
  choice: по крыше
  rationale: Предлог указывает на нахождение или движение на поверхности; слово «крыше» уточнено по контексту, а буквальная неоднозначность отмечена в сноске.
- source_word: הֵיכַל
  choice: дворца
  rationale: В контексте царской резиденции слово обозначает дворец, а не храм.
- source_word: מַלְכוּתָא דִּי בָבֶל
  choice: царского дворца в Вавилоне
  rationale: Естественно передаёт принадлежность дворца царской власти Вавилона; более буквальное строение выражения сохранено в сноске.
- source_word: מְהַלֵּךְ הֲוָה
  choice: он ходил
  rationale: Сочетание причастия с формой глагола «быть» обозначает продолжавшееся действие в прошлом; несовершенный вид передаёт эту длительность без добавления мотива неспешной прогулки.
