source:
  edition: WLC
  text: וְ/דִ֣י חֲזָ֣ה מַלְכָּ֡/א עִ֣יר וְ/קַדִּ֣ישׁ נָחִ֣ת מִן שְׁמַיָּ֡/א וְ/אָמַר֩ גֹּ֨דּוּ אִֽילָנָ֜/א וְ/חַבְּל֗וּ/הִי בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֧ל שְׁמַיָּ֣/א יִצְטַבַּ֗ע וְ/עִם חֵיוַ֤ת בָּרָ/א֙ חֲלָקֵ֔/הּ עַ֛ד דִּֽי שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/020.yaml
  text: And because the king saw a watcher[a], a holy one, coming down from heaven and saying, ‘Cut down the tree and destroy it, but leave the stump of its roots in the earth, with a band of iron and bronze, in the grass of the field, and let him be drenched with the dew of heaven[c][b], and let his portion be with the beasts of the field until seven times pass over him’—
translation:
  language: ru
  text: 'И поскольку царь видел стража[a], святого, сходившего с небес и говорившего: «Срубите дерево и уничтожьте его, но оставьте в земле пень с его корнями, с обручем из железа и бронзы[b], среди полевой травы. Пусть он орошается росой с небес, и пусть его доля будет с полевыми зверями, пока над ним не пройдут семь времён[c]», —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бодрствующего»; арамейское слово обозначает небесное существо, характеризуемое как неусыпно бодрствующее.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в железных и бронзовых оковах».'
    reason: lexical_alternative
  - marker: c
    text: «Семь времён» может означать семь периодов времени; точная единица в тексте не указана.
    reason: alternative_reading
lexical_decisions:
- source_word: עִיר
  choice: бодрствующий
  rationale: Передаёт особое арамейское обозначение небесного существа через его характеристику — пребывающий начеку; не уточняет его ангельский чин.
- source_word: וְקַדִּישׁ
  choice: святой
  rationale: 'Вторая аппозитивная характеристика того же небесного существа: «бодрствующий, святой».'
- source_word: נָחִת מִן שְׁמַיָּא
  choice: сходившего с небес
  rationale: Естественно передаёт наблюдаемое движение вниз и сохраняет возвышенный регистр.
- source_word: גֹּדּוּ
  choice: Срубите
  rationale: Форма множественного числа повелительного наклонения; обычный современный глагол для валки дерева.
- source_word: וְחַבְּלוּהִי
  choice: уничтожьте его
  rationale: Сохраняет силу приказа повредить или погубить дерево, не сужая значение до снятия ветвей.
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: пень с его корнями
  rationale: Обозначает оставшуюся укоренённую часть дерева и звучит естественнее буквального «пень его корней».
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: в оковах из железа и бронзы
  rationale: אֱסוּר допускает значение связывающей повязки или оков; «оковы» сохраняют образ ограничения, а «бронза» соответствует металлическому контексту נְחָשׁ.
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: среди полевой травы
  rationale: Естественно передаёт местонахождение в растительности открытого поля.
- source_word: יִצְטַבַּע
  choice: Пусть он орошается
  rationale: Передаёт пассивное смачивание росой и сохраняет переход от среднего рода «дерево» к мужскому референту «он», уже заложенный в арамейском тексте.
- source_word: וְעִם חֵיוַת בָּרָא חֲלָקֵהּ
  choice: пусть его доля будет с полевыми зверями
  rationale: Формально и понятно передаёт חֲלָקֵהּ как назначенную долю или участь, сохраняя библейскую образность.
- source_word: שִׁבְעָה עִדָּנִין
  choice: семь времён
  rationale: 'Сохраняет неопределённость длительности: источник не называет точной единицы времени.'
theological_decisions:
- issue: Кто такой «бодрствующий, святой»
  choice: Сохранить исходные обозначения небесного существа без уточнения его чина
  alternative: ангел; член небесного совета
  rationale: Арамейский текст характеризует существо собственными терминами и не определяет более точную небесную категорию.
- issue: Переход от дерева к человеку в местоимениях
  choice: Сохранить мужское местоимение «он» после образа дерева
  alternative: 'Согласовать местоимение с деревом: «оно»'
  rationale: В арамейском тексте местоименные формы мужского рода раскрывают человеческого референта символа; сглаживание до среднего рода устранило бы значимую напряжённость образа.
- issue: Продолжительность «семи времён»
  choice: Не определять единицу времени
  alternative: семь лет
  rationale: עִדָּנִין означает периоды или времена, но сам стих не уточняет, что это именно годы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет незавершённость стиха, переходящего к последующему толкованию. Все местоименные сдвиги и временная неопределённость источника сохранены.
