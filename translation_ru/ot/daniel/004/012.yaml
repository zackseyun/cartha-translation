base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/012.yaml
  text: Nevertheless[a], leave the stump of its roots in the earth, even with a band of iron and bronze in the grass of the field; and let him be drenched with the dew of heaven, and let his portion be with the beasts in the grass of the earth.
translation:
  language: ru
  text: Но пень с его корнями оставьте в земле, с железным и бронзовым обручем[a], среди полевой травы. Пусть он будет мокнуть от небесной росы, и пусть его доля будет со зверями среди земной травы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в железных и бронзовых оковах». Арамейское слово может обозначать обруч, узы или средство ограничения.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: בְּרַם
  choice: Но
  rationale: Противительный союз вводит исключение из повеления уничтожить дерево; «но» ясно и естественно передаёт этот контраст.
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: пень с его корнями
  rationale: Речь идёт об оставшемся в земле основании с корневой системой. Формулировка сохраняет оба элемента образа и естественно звучит по-русски.
- source_word: שְׁבֻקוּ בְּאַרְעָא
  choice: оставьте в земле
  rationale: Форма передаёт обращённое к исполнителям повеление, а «в земле» указывает на почву, где остаётся пень.
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: с железным и бронзовым обручем
  rationale: אֱסוּר обозначает связывание или средство ограничения. «Обруч» подходит к образу пня, но неоднозначность отмечена в сноске; «бронза» соответствует древнему металлу лучше, чем «латунь».
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: среди полевой травы
  rationale: Выражение обозначает траву или растительность открытого поля; выбран ясный и образный современный эквивалент.
- source_word: וּבְטַל שְׁמַיָּא יִצְטַבַּע
  choice: Пусть он орошается небесной росой
  rationale: Сохраняется страдательно-возвратный смысл глагола и возвышенное выражение «небесная роса»; местоимение передаёт намеренный переход от дерева к человеку.
- source_word: וְעִם חֵיוְתָא חֲלָקֵהּ
  choice: и пусть его доля будет со зверями
  rationale: «Доля» точно передаёт значение части, удела или участи, а «звери» указывает на животных открытого поля и поддерживает торжественный тон.
- source_word: בַּעֲשַׂב אַרְעָא
  choice: среди земной травы
  rationale: Формулировка сохраняет повтор образа травы и связь с землёй, не отождествляя выражение полностью с предшествующей «полевой травой».
theological_decisions:
- issue: Переход от образа дерева к обозначаемому им человеку
  choice: 'Сохранить мужское личное местоимение: «Пусть он… его доля…»'
  alternative: 'Продолжить безличный образ дерева: «пусть оно… его доля…»'
  rationale: Арамейский текст намеренно переходит от дерева к царю, которого оно символизирует. Мужской род сохраняет этот переход, не разъясняя его сверх сказанного в видении.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого указа. Синтаксис остаётся ясным для широкого читателя; образность и резкая смена от пня к личному референту сохранены.
