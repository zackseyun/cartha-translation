  yaml_path: translation/ot/daniel/004/025.yaml
  text: All this came upon King Nebuchadnezzar[a].
translation:
  language: ru
  text: Всё это постигло царя Навуходоносора[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё это случилось с царём Навуходоносором».'
    reason: 'Лексическая альтернатива: арамейский глагол может означать «достигло», «пришло», «случилось»; с предлогом עַל он обозначает событие, постигшее человека.'
lexical_decisions:
- source_word: כֹּלָּא
  choice: Всё это
  rationale: Арамейское обобщающее выражение отсылает ко всему ранее объявленному суду; «всё это» естественно звучит по-русски и сохраняет полноту смысла.
- source_word: מְּטָא
  choice: постигло
  rationale: Глагол означает «достигнуть, прийти»; в сочетании с עַל описывает исполнение предсказанного над человеком. «Постигло» точно и естественно передаёт этот смысл.
- source_word: עַל
  choice: постигло [кого]
  rationale: Предлог входит в арамейскую конструкцию со значением того, кого достигло событие; в русском это отношение естественно выражается прямым дополнением при глаголе «постигло».
- source_word: נְבוּכַדְנֶצַּר
  choice: Навуходоносора
  rationale: Использована устоявшаяся русская библейская форма имени, поставленная в винительный падеж по синтаксису предложения.
- source_word: מַלְכָּא
  choice: царя
  rationale: Эмфатическое состояние допускает определённое значение; перед именем собственным титул естественно передаётся по-русски как «царь», здесь — в винительном падеже.
