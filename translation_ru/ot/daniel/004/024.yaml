source:
  edition: WLC
  text: לָהֵ֣ן מַלְכָּ֗/א מִלְכִּ/י֙ יִשְׁפַּ֣ר עלי/ך ו/חטי/ך בְּ/צִדְקָ֣ה פְרֻ֔ק וַ/עֲוָיָתָ֖/ךְ בְּ/מִחַ֣ן עֲנָ֑יִן הֵ֛ן תֶּהֱוֵ֥א אַרְכָ֖ה לִ/שְׁלֵוְתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/024.yaml
  text: 'Therefore[a], O king, let my counsel be acceptable to you: break off your sins by righteousness, and your iniquities by showing mercy to the poor[b], that there may perhaps be a prolonging of your prosperity.'
translation:
  language: ru
  text: 'Поэтому, царь, пусть мой совет будет угоден тебе: порви с грехами, поступая праведно, и с беззакониями, проявляя милость к бедным[a]. Тогда, возможно, продлится твоё благополучие[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искупи свои грехи праведностью, а свои беззакония — милостью к бедным». Арамейский глагол может означать «порвать, прекратить», а в некоторых контекстах — «выкупить, освободить».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твой покой»; также возможно: «твоя безмятежность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: Поэтому
  rationale: Передаёт вывод, следующий из истолкования сна, естественным русским логическим связующим словом.
- source_word: מַלְכָּא
  choice: царь
  rationale: Сохраняет прямое почтительное обращение; в современном русском звательная функция выражается формой именительного падежа.
- source_word: מִלְכִּי יִשְׁפַּר עֲלָיִךְ
  choice: пусть мой совет будет угоден тебе
  rationale: Передаёт придворную почтительность и буквальный образ того, что совет должен оказаться хорошим или приятным для царя.
- source_word: וְחֲטָיָךְ בְּצִדְקָה פְרֻק
  choice: порви со своими грехами, поступая праведно
  rationale: «Порви» сохраняет основной образ решительного прекращения; деепричастный оборот естественно выражает средство или проявление разрыва с грехами, не сводя צִדְקָה только к судебной справедливости.
- source_word: וַעֲוָיָתָךְ
  choice: со своими беззакониями
  rationale: Сохраняет параллелизм и отличает этот термин от предшествующего слова «грехи».
- source_word: בְּמִחַן עֲנָיִן
  choice: проявляя милость к бедным
  rationale: Передаёт конкретное сострадательное действие по отношению к бедным или угнетённым в ясной современной форме.
- source_word: הֵן
  choice: возможно
  rationale: Сохраняет условность и отсутствие безусловной гарантии.
- source_word: תֶּהֱוֵא אַרְכָה לִשְׁלֵוְתָךְ
  choice: продлится твоё благополучие
  rationale: Естественно передаёт буквальную идею продления состояния покоя, безопасности и процветания царя.
theological_decisions:
- issue: Подразумевает ли увещание искупление грехов заслугами или призыв отказаться от греха, подтвердив это праведностью и милосердием
  choice: Передать פְרֻק как «порви», то есть решительно откажись от греховной жизни.
  alternative: «Искупи свои грехи праведностью» или «выкупи свои грехи милостыней».
  rationale: Арамейский глагол допускает оттенок освобождения или выкупа, но в данном нравственном призыве значение прекращения греха хорошо соответствует контексту и не вводит не требуемое текстом учение о заслуженном делами отпущении вины. Лексическая возможность отмечена в сноске.
- issue: Является ли продление благополучия гарантированным результатом
  choice: Сохранить неуверенность словом «возможно».
  alternative: 'Передать результат как обещание: «и продлится твоё благополучие».'
  rationale: Частица הֵן представляет результат как возможность, а не как безусловную гарантию.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Формулировка остаётся понятной широкому читателю; параллелизм сохранён без тяжеловесной буквальности. Все варианты, имеющие существенное лексическое или богословское значение, вынесены в сноски.
