  text: בַּ/הּ שַׁעֲתָ֗/א מִלְּתָ/א֮ סָ֣פַת עַל נְבוּכַדְנֶצַּר֒ וּ/מִן אֲנָשָׁ֣/א טְרִ֔יד וְ/עִשְׂבָּ֤/א כְ/תוֹרִין֙ יֵאכֻ֔ל וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּ֥י שַׂעְרֵ֛/הּ כְּ/נִשְׁרִ֥ין רְבָ֖ה וְ/טִפְר֥וֹ/הִי כְ/צִפְּרִֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/030.yaml
  text: At that moment the word was fulfilled against Nebuchadnezzar. He was driven away from among men[a], and he ate grass like oxen, and his body was drenched with the dew of heaven, until his hair grew like eagles’ feathers and his nails like birds’ claws.
translation:
  language: ru
  text: В тот же миг исполнилось слово, сказанное против Навуходоносора. Его изгнали из общества людей; он ел траву, как быки, и тело его промокло от небесной росы. Так продолжалось, пока волосы у него не отросли, став похожими на орлиные[a] перья, а ногти — на птичьи когти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перья грифов». Арамейское слово может обозначать крупных хищных птиц вообще; перевод «орлиные» является традиционным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָא
  choice: В тот же миг
  rationale: Арамейский оборот буквально означает «в тот час / в то время»; «в тот же миг» естественно передаёт немедленное наступление объявленного суда.
- source_word: מִלְּתָא סָפַת
  choice: исполнилось сказанное
  rationale: מִלְּתָא может означать слово, дело или постановление, а סָפַת — совершение и исполнение. Субстантивированное «сказанное» сохраняет связь с ранее возвещённым приговором, не сужая значение до юридического термина.
- source_word: עַל נְבוּכַדְנֶצַּר
  choice: над Навуходоносором
  rationale: В контексте суда предлог указывает на осуществление объявленного над царём; русская конструкция «над ним исполнилось сказанное» сохраняет неблагоприятную направленность и звучит естественно.
- source_word: וּמִן אֲנָשָׁא טְרִיד
  choice: Его изгнали из общества людей
  rationale: טְרִיד обозначает изгнание или удаление, а выражение с אֲנָשָׁא описывает исключение из человеческого общества. Такой перевод ясен современному читателю и не предполагает, что речь только о мужчинах.
- source_word: וְעִשְׂבָּא כְתוֹרִין יֵאכֻל
  choice: он ел траву, как быки
  rationale: עִשְׂבָּא — трава или растительность, תוֹרִין — быки либо крупный рогатый скот. «Как быки» близко воспроизводит конкретный образ оригинала.
- source_word: וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע
  choice: тело его промокло от небесной росы
  rationale: יִצְטַבַּע передаёт сильное намокание. «Небесная роса» сохраняет образ и структуру арамейского выражения, а «промокло» естественно выражает результат.
- source_word: שַׂעְרֵהּ כְּנִשְׁרִין רְבָה
  choice: волосы у него не стали подобны перьям орлов
  rationale: רְבָה при волосах означает, что они выросли или разрослись; сравнительная конструкция по-русски естественно передаётся через «стали подобны». נִשְׁרִין традиционно понимается как «орлы», хотя возможно более широкое обозначение крупных хищных птиц.
- source_word: וְטִפְרוֹהִי כְצִפְּרִין
  choice: а ногти — птичьим когтям
  rationale: טִפְרִין может обозначать ногти или когти. Сочетание «ногти — птичьим когтям» сохраняет человеческий предмет сравнения и ясно передаёт его звероподобный вид.
theological_decisions:
- issue: Значение אֲנָשָׁא в противопоставлении человеческого и звероподобного состояния
  choice: из общества людей
  alternative: от людей / из среды человеческой
  rationale: Речь идёт об удалении Навуходоносора из человеческого общества вообще, а не только из среды мужчин. Перевод сохраняет антропологическое противопоставление, не добавляя доктринального толкования.
- issue: Характер מִלְּתָא как слова или приговора
  choice: исполнилось сказанное
  alternative: исполнился приговор / исполнилось слово
  rationale: Контекст несомненно связан с судом, однако сам арамейский термин шире юридического «приговора». Формулировка сохраняет напряжение между возвещённым словом и судебным постановлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разбит на ясные смысловые части; выражение «Так продолжалось» естественно передаёт длительность состояния, вводимую עַד דִּי. Маркер сноски поставлен непосредственно при слове, к которому относится лексическая альтернатива.
