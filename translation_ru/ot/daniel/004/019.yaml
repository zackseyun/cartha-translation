base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/019.yaml
  text: You are the king[a], who has grown great and strong; your greatness has become great and reached to heaven, and your dominion to the end of the earth.
translation:
  language: ru
  text: Ты — тот царь, который стал велик и силён; величие твоё возросло и достигло небес, а власть твоя простирается до края земли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до концов земли». Арамейское выражение стоит в единственном числе, но может идиоматически обозначать предельную широту земного пространства.'
    reason: Лексическая альтернатива
lexical_decisions:
- source_word: אַנְתָּה הוּא מַלְכָּא
  choice: Это ты, царь
  rationale: Сочетание местоимения с הוּא подчёркивает отождествление царя с деревом из сна. Русское «Это ты, царь» естественно передаёт эту эмфазу; «царь» понимается как обращение в контексте прямой речи.
- source_word: דִּי רְבַית וּתְקֵפְתְּ
  choice: возвеличился и окреп
  rationale: 'Оба глагола обозначают достигнутое возрастание: первый — в величии и положении, второй — в силе. Однородные русские глаголы сохраняют параллелизм арамейского текста.'
- source_word: וּרְבוּתָךְ רְבָת
  choice: величие твоё возросло
  rationale: Сохраняется намеренный лексический повтор корня רבה между «возвеличился» и «величие… возросло», не сводя выражение к статичному «стало великим».
- source_word: וּמְטָת לִשְׁמַיָּא
  choice: и достигло небес
  rationale: Глагол означает достижение предела, а арамейская форма «небеса» естественно передаётся русским множественным числом.
- source_word: וְשָׁלְטָנָךְ
  choice: а власть твоя
  rationale: שָׁלְטָן обозначает господство, правящую власть или владычество. «Власть» ясно и современно передаёт смысл; союз «а» естественно отмечает переход ко второму члену параллелизма.
- source_word: לְסוֹף אַרְעָא
  choice: края земли
  rationale: Буквально — «до края/конца земли». Единственное число сохранено в основном тексте; распространённое множественное понимание отмечено в сноске.
theological_decisions:
- issue: Пределы царской власти
  choice: «до края земли» как образ всеохватного царского господства без уточнения его буквального географического объёма
  alternative: «до концов земли»; либо утверждение о строго всемирном политическом контроле
  rationale: Древняя царская речь допускает гиперболическое описание огромной державы. Перевод сохраняет универсально звучащий образ и не решает за текст вопрос о точном историко-географическом охвате.
translation_notes:
  register: Современный литературный русский язык с достоинством царской речи. Лексический повтор «возвеличился — величие — возросло» намеренно сохранён; эллипсис «власть твоя — края земли» передаёт продолжение сказуемого «достигло» без тяжеловесного повтора.
