  yaml_path: translation/ot/daniel/004/010.yaml
  text: I was looking in the visions of my head as I lay on my bed[a], and behold, a watcher, a holy one, came down from heaven.
translation:
  language: ru
  text: Я видел видения, явившиеся мне в уме, когда лежал на постели; и вот, с небес сошёл страж, святой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Арамейское слово, переведённое как «страж», буквально связано со значением «бодрствующий»; далее буквально: «страж, святой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: я видел
  rationale: Сочетание причастия с глаголом бытия выражает продолжавшееся восприятие в прошлом. Русское «я видел» естественно вводит рассказ о видении, не утяжеляя фразу формой «я смотрел».
- source_word: בְּחֶזְוֵי רֵאשִׁי
  choice: в видениях своего разума
  rationale: Сохранено упоминание видений и передан арамейский образ «видений головы», но буквальное русское «видения моей головы» звучало бы неестественно и могло бы быть понято как физическое свойство головы.
- source_word: עַל מִשְׁכְּבִי
  choice: лёжа на постели
  rationale: Передаёт и место, и обстоятельство времени естественным современным русским языком.
- source_word: וַאֲלוּ
  choice: и вот
  rationale: Частица привлекает внимание к внезапно появившемуся образу; «и вот» сохраняет эту повествовательную функцию.
- source_word: עִיר
  choice: бодрствующий
  rationale: Сохранено особое арамейское обозначение небесного существа, буквально связанное с бодрствованием, без замены более общим словом «ангел».
- source_word: וְקַדִּישׁ
  choice: святой
  rationale: Субстантивированное прилагательное передано параллельно слову «бодрствующий»; пунктуация сохраняет приложение и не превращает его в отдельное существо.
- source_word: מִן שְׁמַיָּא
  choice: с неба
  rationale: Хотя арамейская форма грамматически множественная, в данном контексте современное русское единственное число является обычным эквивалентом.
- source_word: נָחִת
  choice: спустился
  rationale: Глагол обозначает движение вниз; «спустился» точно и естественно передаёт завершённое появление существа с небес.
theological_decisions:
- issue: Кем является עִיר וְקַדִּישׁ
  choice: «бодрствующий, святой» без прямого отождествления с ангелом
  alternative: «ангел» или «небесный вестник»
  rationale: В арамейском тексте употреблено особое обозначение, а не обычное слово «ангел». Буквенно близкая передача сохраняет богословскую сдержанность исходного текста.
- issue: Соотношение слов עִיר и קַדִּישׁ
  choice: два приложения, относящиеся к одному существу
  alternative: «бодрствующий и святой» как возможное указание на двух существ
  rationale: 'Единственное число глагола и контекст поддерживают приложение: явившийся бодрствующий характеризуется как святой. Запятая сохраняет тесное соположение слов без пояснительной вставки «то есть».'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Неестественный буквализм «видения моей головы» смягчён до «видения своего разума», тогда как редкое обозначение небесного существа намеренно сохранено и разъяснено в сноске.
