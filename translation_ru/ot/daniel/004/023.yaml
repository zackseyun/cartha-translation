  text: וְ/דִ֣י אֲמַ֗רוּ לְ/מִשְׁבַּ֞ק עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ דִּ֣י אִֽילָנָ֔/א מַלְכוּתָ֖/ךְ לָ֣/ךְ קַיָּמָ֑ה מִן דִּ֣י תִנְדַּ֔ע דִּ֥י שַׁלִּטִ֖ן שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/023.yaml
  text: And because they said to leave the stump of the tree with its roots[a], your kingdom will remain yours from the time that you know that Heaven rules.
translation:
  language: ru
  text: И поскольку сказали оставить пень дерева с его корнями, царство твоё останется за тобой после того, как ты узнаешь, что Небо владычествует.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небеса владычествуют». Арамейское слово «небеса» здесь почтительно указывает на верховную власть Бога.'
    reason: Сохраняется возможность более буквального понимания грамматического множественного числа и поясняется почтительная метонимия.
lexical_decisions:
- source_word: וְדִי אֲמַרוּ
  choice: И поскольку было сказано
  rationale: Сочетание вводит пояснительно-причинную часть. Хотя глагол формально стоит в 3-м лице множественного числа («сказали»), неопределённое множественное в библейском арамейском естественно передаётся безлично; по-русски это также сохраняет связь с провозглашённым повелением.
- source_word: לְמִשְׁבַּק
  choice: оставить
  rationale: Инфинитив передаёт значение «оставить, дать остаться, пощадить»; в образе срубленного дерева наиболее естественно «оставить».
- source_word: עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא
  choice: пень дерева с его корнями
  rationale: Выражение обозначает оставшееся основание с корневой системой срубленного дерева. «Пень… с его корнями» ясно и естественно передаёт образ.
- source_word: מַלְכוּתָךְ לָךְ קַיָּמָה
  choice: царство твоё останется за тобой
  rationale: קַיָּמָה выражает устойчивость и сохранение, а לָךְ — принадлежность адресату. Русское «останется за тобой» передаёт сохранение права на царство ради последующего восстановления.
- source_word: מִן דִּי תִנְדַּע
  choice: с того времени, когда ты познаешь
  rationale: מִן דִּי указывает на исходный временной момент, а תִנְדַּע — не только на получение знания, но в контексте и на признание истины. «Познаешь» сохраняет оба оттенка без явного истолкования.
- source_word: דִּי שַׁלִּטִן שְׁמַיָּא
  choice: что Небо владычествует
  rationale: «Небо» сохраняет почтительное метонимическое обозначение Божьей верховной власти, не заменяя его прямым «Бог». «Владычествует» достойно и точно передаёт идею суверенного господства.
theological_decisions:
- issue: Следует ли передавать שְׁמַיָּא буквально как множественное «небеса» или как почтительное метонимическое «Небо»
  choice: Небо владычествует
  alternative: небеса владычествуют
  rationale: В данном контексте «Небо» служит почтительным обозначением верховной Божьей власти. Единственное число с прописной буквы сохраняет метонимию и не разворачивает её в истолковывающий перевод «Бог владычествует».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок «царство твоё» и глагол «владычествует» придают достоинство без излишней архаизации. Маркер сноски помещён непосредственно после относящегося к нему выражения.
