  source_fidelity: Следует сохранить активную неопределённо-множественную форму אֲמַרוּ («сказали»), а не заменять её русской безличной конструкцией «было сказано». Временной оборот מִן דִּי естественнее и точнее передать как «после того как», обозначая момент, после которого царство будет сохранено/восстановлено для адресата.
  naturalness: «После того как ты узнаешь» звучит в современном литературном русском естественнее, чем тяжеловесное «с того времени, когда ты познаешь». «Узнаешь» передаёт основной смысл глагола без ненужной архаизации; контекст признания остаётся выводимым из текста.
  terminology: «Небо владычествует» удачно сохраняет арамейскую почтительную метонимию и не подменяет её прямым именованием Бога. Сноска корректно отмечает буквальную множественную альтернативу «небеса».
