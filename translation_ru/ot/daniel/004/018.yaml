  text: וְ/עָפְיֵ֤/הּ שַׁפִּיר֙ וְ/אִנְבֵּ֣/הּ שַׂגִּ֔יא וּ/מָז֨וֹן לְ/כֹ֖לָּ/א בֵ֑/הּ תְּחֹת֗וֹ/הִי תְּדוּר֙ חֵיוַ֣ת בָּרָ֔/א וּ/בְ/עַנְפ֕וֹ/הִי יִשְׁכְּנָ֖ן צִפֲּרֵ֥י שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/018.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field lived, and in its branches the birds of the heavens dwelled.
translation:
  language: ru
  text: Его листва была прекрасна, плодов на нём было множество, и в нём была пища для всех. Под ним жили полевые звери, а в его ветвях обитали птицы небесные[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «птицы неба». Буквально по-арамейски: «птицы небес».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: его листва
  rationale: Собирательное «листва» точно передаёт лиственный покров дерева и звучит естественно по-русски.
- source_word: שַׁפִּיר
  choice: была прекрасна
  rationale: Передаёт значение красоты и привлекательности современным литературным языком.
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: плодов на нём было множество
  rationale: Выражает обилие плодов естественной русской конструкцией, не ослабляя количественного смысла שַׂגִּיא.
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: в нём была пища для всех
  rationale: Сохраняет выраженную в арамейском тексте локализацию пищи в дереве и универсальное «для всех».
- source_word: חֵיוַת בָּרָא
  choice: полевые звери
  rationale: Точно передаёт животных открытой местности и сохраняет уместную библейскую образность без архаизма.
- source_word: תְּדוּר
  choice: жили
  rationale: Естественный современный глагол для постоянного пребывания животных под деревом.
- source_word: עַנְפוֹהִי
  choice: его ветви
  rationale: Прямое и общеупотребительное обозначение ветвей дерева.
- source_word: יִשְׁכְּנָן
  choice: обитали
  rationale: Сохраняет значение пребывания и поселения, не добавляя более узкого смысла «гнездились».
- source_word: צִפֲּרֵי שְׁמַיָּא
  choice: птицы небесные
  rationale: Передаёт буквальный образ «птиц небес» и сохраняет возвышенную библейскую окраску; более разговорный вариант указан в примечании.
