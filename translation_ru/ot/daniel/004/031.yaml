  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לִ/קְצָ֣ת יֽוֹמַיָּ/ה֩ אֲנָ֨ה נְבוּכַדְנֶצַּ֜ר עַיְנַ֣/י לִ/שְׁמַיָּ֣/א נִטְלֵ֗ת וּ/מַנְדְּעִ/י֙ עֲלַ֣/י יְת֔וּב ו/ל/עלי/א בָּרְכֵ֔ת וּ/לְ/חַ֥י עָלְמָ֖/א שַׁבְּחֵ֣ת וְ/הַדְּרֵ֑ת דִּ֤י שָׁלְטָנֵ/הּ֙ שָׁלְטָ֣ן עָלַ֔ם וּ/מַלְכוּתֵ֖/הּ עִם דָּ֥ר וְ/דָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/031.yaml
  text: At the end of the days[a], I, Nebuchadnezzar, lifted my eyes to heaven, and my understanding returned to me; and I blessed the Most High, and I praised and honored him who lives forever, for his dominion is an everlasting dominion, and his kingdom is from generation to generation.
translation:
  language: ru
  text: По окончании этих дней я, Навуходоносор, поднял глаза к небу, и ко мне вернулся разум[a]. Я благословил Всевышнего, восхвалил и почтил Живущего вечно, потому что владычество Его — владычество вечное и царство Его пребывает из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понимание». Арамейское слово может означать знание, понимание или разум.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִקְצָת יֽוֹמַיָּה
  choice: По окончании этих дней
  rationale: Арамейское выражение указывает на завершение ранее назначенного периода. Указательное «этих» естественно связывает стих с упомянутыми прежде днями, не устраняя образную формулировку источника.
- source_word: עַיְנַי לִשְׁמַיָּא נִטְלֵת
  choice: поднял глаза к небу
  rationale: Сохраняет телесный образ и подразумеваемое обращение к Богу; это естественная современная русская идиома.
- source_word: וּמַנְדְּעִי עֲלַי יְתוּב
  choice: ко мне вернулся разум
  rationale: מַנְדַּע может означать знание, понимание или разум. В контексте восстановления Навуходоносора «разум» ясно передаёт возвращение здравого сознания, а сноска сохраняет лексическую широту.
- source_word: לעליא
  choice: Всевышнего
  rationale: Устоявшийся и точный русский эквивалент арамейского превосходного божественного титула.
- source_word: בָּרְכֵת
  choice: благословил
  rationale: Передаёт отдельный глагол «благословлять» и не смешивает его с последующим глаголом хвалы.
- source_word: לְחַי עָלְמָא
  choice: Живущего вечно
  rationale: Сохраняет субстантивированное описание Бога как Того, кто живёт вечно, и его личный, славословный характер.
- source_word: שַׁבְּחֵת וְהַדְּרֵת
  choice: восхвалил и прославил
  rationale: Передаёт два близких, но различных действия почитания и сохраняет ритмический параллелизм.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: владычество Его — владычество вечное
  rationale: Сохраняет однокоренной повтор источника, его эмфатический характер и царственно-политическую лексику книги Даниила.
- source_word: וּמַלְכוּתֵהּ עִם דָּר וְדָר
  choice: царство Его — из поколения в поколение
  rationale: Формально передаёт безглагольную конструкцию и идиому последовательности поколений, не добавляя в основной текст явно не выраженный глагол «пребывает».
theological_decisions:
- issue: Личное славословное обозначение Бога в לְחַי עָלְמָא
  choice: восхвалил и прославил Живущего вечно
  alternative: восхвалил и прославил Того, кто живёт вечно
  rationale: Субстантивированное причастие «Живущего» близко к арамейской форме и сохраняет личный и возвышенный характер славословия без конфессионального уточнения.
- issue: Временная продолжительность царства в безглагольной заключительной фразе
  choice: царство Его — из поколения в поколение
  alternative: царство Его пребывает из поколения в поколение
  rationale: Выбранная формулировка сохраняет лаконичность и формальную неоднозначность безглагольной арамейской конструкции; продолжительность уже явствует из идиомы.
translation_notes:
  register: Современный литературный русский язык с достоинством царского славословия. Синтаксис несколько торжественный, но не архаичный; однокоренной повтор «владычество — владычество» намеренно сохранён из источника.
