source:
  edition: WLC
  text: לִבְבֵ/הּ֙ מִן אנוש/א יְשַׁנּ֔וֹן וּ/לְבַ֥ב חֵיוָ֖ה יִתְיְהִ֣ב לֵ֑/הּ וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/013.yaml
  text: Let his heart be changed from that of a man[a], and let the heart of a beast be given to him, and let seven times pass over him.
translation:
  language: ru
  text: Пусть его сердце изменится и перестанет быть человеческим; пусть ему будет дано сердце зверя, и пусть над ним пройдут семь времён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь периодов» или «семь сроков». Арамейское слово обозначает назначенные времена или периоды; их точная продолжительность здесь не указана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְבֵהּ
  choice: его сердце
  rationale: Арамейское слово обозначает внутреннее «я», включая разум, волю и расположение. «Сердце» сохраняет исходный образ и естественно для библейской русской речи.
- source_word: מִן אֱנוֹשָׁא
  choice: перестанет быть человеческим
  rationale: Буквальная конструкция «от человека» обозначает утрату человеческого качества сердца. Выбранная формулировка ясно и естественно передаёт это по-русски, не сводя «сердце» только к разуму.
- source_word: יְשַׁנּוֹן
  choice: пусть изменится
  rationale: Форма множественного числа допускает неопределённого деятеля. Русская возвратная конструкция сохраняет неуказанность исполнителя и повелительно-пожелательный характер высказывания.
- source_word: וּלְבַב חֵיוָה
  choice: сердце зверя
  rationale: «Зверь» сохраняет контраст между человеческим и животным состоянием и соответствует возвышенному, но современному регистру.
- source_word: יִתְיְהִב לֵהּ
  choice: пусть ему будет дано
  rationale: Пассивная конструкция точно передаёт значение глагола и не называет прямо неуказанного деятеля.
- source_word: שִׁבְעָה עִדָּנִין
  choice: семь времён
  rationale: עִדָּן означает назначенное время или период, продолжительность которого здесь не уточнена. «Времён» сохраняет эту неопределённость и традиционный библейский образ.
- source_word: יַחְלְפוּן עֲלֹוהִי
  choice: над ним пройдут
  rationale: Формулировка близко передаёт пространственно-временной образ исходного выражения и естественно звучит по-русски.
theological_decisions:
- issue: Характер описанного суда
  choice: 'Сохранён образ: человеческое сердце перестаёт быть человеческим, а человеку даётся сердце зверя.'
  alternative: Истолковать это как буквальное телесное превращение либо прямо назвать безумием или помрачением рассудка.
  rationale: Сам арамейский текст не уточняет, идёт ли речь о буквальном превращении или о ниспосланном свыше звероподобном состоянии сознания и поведения; перевод не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён параллельным, а неуказанный деятель не добавлен.
