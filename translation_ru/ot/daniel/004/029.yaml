  text: וּ/מִן אֲנָשָׁ/א֩ לָ֨/ךְ טָֽרְדִ֜ין וְֽ/עִם חֵיוַ֧ת בָּרָ֣/א מְדֹרָ֗/ךְ עִשְׂבָּ֤/א כְ/תוֹרִין֙ לָ֣/ךְ יְטַעֲמ֔וּן וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עלי/ך עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/029.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: ru
  text: И тебя изгонят из среды людей[a], и жилище твоё будет среди полевых зверей. Тебя будут кормить травой, как волов, и семь времён минуют для тебя[b], пока ты не узнаешь, что Всевышний властвует над царством людей и отдаёт его тому, кому пожелает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть из человеческого общества, в противопоставление жизни среди зверей.
    reason: lexical_alternative
  - marker: b
    text: Арамейское выражение буквально означает «семь времён»; возможно, имеются в виду семь лет или, шире, семь периодов времени.
    reason: alternative_reading
lexical_decisions:
- source_word: טָרְדִין
  choice: тебя изгонят
  rationale: 'Форма буквально активная, 3-е лицо множественного числа: «они изгонят тебя». Русская неопределённо-личная конструкция естественно передаёт форму и смысл принудительного удаления.'
- source_word: אֲנָשָׁא
  choice: людей / человеческим
  rationale: Собирательное обозначение человечества в противопоставлении полевым зверям; современные русские соответствия сохраняют этот контраст без указания исключительно на мужчин.
- source_word: מְדֹרָךְ
  choice: ты будешь обитать
  rationale: Предикативная передача «твоё обиталище будет» звучит естественно по-русски и сохраняет смысл места и образа жизни.
- source_word: חֵיוַת בָּרָא
  choice: зверями полевыми
  rationale: Сохраняет традиционный библейский образ и обозначает животных открытой местности.
- source_word: עִשְׂבָּא
  choice: травой
  rationale: В контексте питания крупного скота это наиболее точное и естественное соответствие.
- source_word: כְתוֹרִין
  choice: как волов
  rationale: Термин обозначает быков или волов, шире — крупный рогатый скот; «волов» сохраняет конкретный образ пасущихся животных.
- source_word: יְטַעֲמוּן
  choice: тебя будут кормить
  rationale: Каузативная форма буквально указывает, что ему дадут есть; русская конструкция сохраняет навязанный характер суда.
- source_word: שִׁבְעָה עִדָּנִין
  choice: семь времён
  rationale: Сохраняет неопределённость арамейского עִדָּנִין, которое обозначает времена или периоды, не уточняя в основном тексте, что это годы.
- source_word: יַחְלְפוּן עֲלָךְ
  choice: пройдут над тобой
  rationale: Достаточно буквально передаёт идиому прохождения периодов над человеком и сохраняет её образность.
- source_word: תִנְדַּע
  choice: ты не узнаешь
  rationale: Прямое соответствие глаголу «знать, узнать»; контекст подразумевает достигнутое через опыт признание.
- source_word: שַׁלִּיט עִלָּיָא
  choice: Всевышний властвует
  rationale: Передаёт действительное верховное господство и сохраняет царственную лексику контекста.
- source_word: בְּמַלְכוּת אֲנָשָׁא
  choice: над царством человеческим
  rationale: В русском управление «властвовать над» естественнее буквального «в царстве»; выражение сохраняет собирательный смысл человеческой власти.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: и отдаёт его тому, кому пожелает
  rationale: Прямо передаёт свободу решения Всевышнего и местоименную отсылку к царству.
theological_decisions:
- issue: Значение עִדָּנִין в сроке суда над Навуходоносором
  choice: семь времён
  alternative: семь лет; семь периодов времени
  rationale: Само арамейское слово не называет годы прямо. Основной текст сохраняет эту открытость, а возможные уточнения приведены в примечании.
- issue: Значение אֲנָשָׁא
  choice: людей / человеческим
  alternative: человеков; человечества
  rationale: Слово обозначает людей как человеческий род в противопоставлении зверям. Выбор не сужает смысл до лиц мужского пола и сохраняет антропологический контраст.
- issue: Сфера владычества Всевышнего
  choice: властвует над царством человеческим
  alternative: владычествует в царстве людей; суверенен над человеческим царством
  rationale: Передано активное правление Всевышнего без привнесения дополнительных догматических формулировок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя; сохранены образность «полевых зверей», «волов» и намеренная неопределённость срока «семь времён».
