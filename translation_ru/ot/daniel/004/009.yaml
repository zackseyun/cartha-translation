base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/009.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field found shade, and in its branches the birds of the heavens dwelt, and from it all flesh was fed.
translation:
  language: ru
  text: Листва его была прекрасна, и плодов на нём было множество; на нём была пища для всех. Под ним укрывались в тени полевые звери, в его ветвях обитали птицы небес, и от него питалась всякая плоть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все живые существа». По-арамейски буквально: «всякая плоть» — библейское выражение, обозначающее всех одушевлённых существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: листва его
  rationale: Собирательное «листва» естественно передаёт лиственный покров дерева и сохраняет образность арамейского слова.
- source_word: שַׁפִּיר
  choice: была прекрасна
  rationale: «Прекрасна» прямо передаёт значение «красива, хороша на вид» и соответствует возвышенному повествовательному регистру.
- source_word: וְאִנְבֵּהּ שַׂגִּיא
  choice: и плодов на нём было множество
  rationale: Передаёт буквальный смысл «его плод был обилен» естественной русской конструкцией, не меняя количества и образа.
- source_word: וּמָזוֹן לְכֹלָּא בֵהּ
  choice: на нём была пища для всех
  rationale: В контексте плодоносящего дерева בֵהּ естественно понимать как нахождение пищи на нём; «для всех» сохраняет неопределённо широкий охват оригинала.
- source_word: תַּטְלֵל
  choice: укрывались в тени
  rationale: Глагол связан с тенью и укрытием; выражение передаёт оба оттенка и звучит естественно по-русски.
- source_word: חֵיוַת בָּרָא
  choice: полевые звери
  rationale: Сохраняет традиционный библейский образ животных открытой местности без сужения до конкретных видов.
- source_word: ידרון
  choice: обитали
  rationale: Передаёт значение «жить, пребывать, находить пристанище», не вводя более узкого значения «гнездиться».
- source_word: צִפֲּרֵי שְׁמַיָּא
  choice: небесные птицы
  rationale: Формально и естественно сохраняет библейское выражение «птицы небес» в современном русском синтаксисе.
- source_word: יִתְּזִין
  choice: питалась
  rationale: Пассивно-возвратная русская форма естественно передаёт смысл «была кормима, получала пищу».
- source_word: כָּל בִּשְׂרָא
  choice: всякая плоть
  rationale: Сохраняет буквальный и межтекстово значимый библейский оборот, а возможное смысловое разъяснение вынесено в сноску.
theological_decisions:
- issue: Передача идиомы כָּל בִּשְׂרָא
  choice: всякая плоть
  alternative: все живые существа
  rationale: Буквальный оборот сохраняет подлинную широту и библейскую межтекстовую связь, не ограничивая референт только людьми; сноска поясняет идиоматический смысл.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Синтаксис сделан плавным и доступным; образные выражения оригинала сохранены без архаизации. Маркер сноски помещён непосредственно после поясняемого выражения.
