base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/005.yaml
  text: 'At last Daniel came in before me—he whose name was Belteshazzar[a], after the name of my god, and in whom is the spirit of the holy gods—and I told the dream before him:'
translation:
  language: ru
  text: 'Наконец ко мне вошёл Даниил, которого звали Валтасаром, по имени моего бога, и в котором есть дух святых богов[a]; и я рассказал ему сон:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух святого Бога»; или: «дух святого Бога». Арамейское выражение допускает разные толкования, но в устах царя наиболее естественно отражает языческое представление: «дух святых богов».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַד אָחֳרֵין
  choice: Наконец
  rationale: Передаёт временную идиому со значением «под конец / наконец» и подразумеваемую задержку появления Даниила.
- source_word: עַל קָדָמַי
  choice: вошёл ко мне
  rationale: Естественно по-русски передаёт движение в присутствие царя; придворный контекст понятен из повествования.
- source_word: דָּנִיֵּאל
  choice: Даниил
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: имя которому Валтасар
  rationale: Сохраняет пояснительное относительное придаточное и традиционную русскую форму вавилонского имени.
- source_word: כְּשֻׁם אֱלָהִי
  choice: по имени моего бога
  rationale: Близко передаёт соответствие имени Даниила имени божества, не добавляя отсутствующего в исходном тексте глагола «назван».
- source_word: וְדִי רוּחַ אֱלָהִין קַדִּישִׁין בֵּהּ
  choice: в нём дух святых богов
  rationale: Сохраняет отсутствие явного артикля, множественную форму «богов» и языческую перспективу царя, не отождествляя выражение однозначно со Святым Духом.
- source_word: וְחֶלְמָא קָדָמוֹהִי אַמְרֵת
  choice: Я рассказал ему сон
  rationale: Естественный современный русский эквивалент выражения «сказал сон перед ним»; передаёт сообщение содержания сна Даниилу.
theological_decisions:
- issue: Значение רוּחַ אֱלָהִין קַדִּישִׁין в речи Навуходоносора
  choice: дух святых богов
  alternative: Дух святого Бога; дух святого Бога
  rationale: Множественные формы אֱלָהִין и קַדִּישִׁין и контекст речи языческого царя естественнее указывают на «святых богов». В сноске сохранены возможные единственные прочтения, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; двоеточие сохраняет переход к последующей прямой речи. Маркер [a] стоит при имени «Валтасар», как в предоставленном консультационном тексте, хотя содержание сноски относится к следующему выражению о духе.
