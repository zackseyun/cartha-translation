    issue: Сноска [a] привязана к имени «Валтасар», хотя объясняет выражение «дух святых богов».
    rationale: Якорь сноски должен стоять непосредственно после слова «богов», иначе читатель связывает варианты прочтения с личным именем, а не с арамейской фразой רוּחַ אֱלָהִין קַדִּישִׁין.
