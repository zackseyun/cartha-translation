source:
  edition: WLC
  text: בִּ/גְזֵרַ֤ת עִירִין֙ פִּתְגָמָ֔/א וּ/מֵאמַ֥ר קַדִּישִׁ֖ין שְׁאֵֽלְתָ֑/א עַד דִּבְרַ֡ת דִּ֣י יִנְדְּע֣וּן חַ֠יַּיָּ/א דִּֽי שַׁלִּ֨יט עלי/א בְּ/מַלְכ֣וּת אנוש/א וּ/לְ/מַן דִּ֤י יִצְבֵּא֙ יִתְּנִנַּ֔/הּ וּ/שְׁפַ֥ל אֲנָשִׁ֖ים יְקִ֥ים עלי/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/014.yaml
  text: The sentence is by the decree of the watchers[a], and the decision by the word of the holy ones, so that the living may know that the Most High rules in the kingdom of mankind and gives it to whom he wills[c][b], and sets up over it the lowliest of men.
translation:
  language: ru
  text: Этот приговор — по постановлению бодрствующих[a], и решение — по слову святых, чтобы живущие знали, что Всевышний владычествует над царством человеческим[b], даёт его кому пожелает и возводит над ним самого ничтожного из людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Бодрствующие» — буквальная передача особого наименования небесных существ в книге Даниила; обычно под ними понимают ангелов. Арамейская фраза сжата: слово, переведённое здесь как «решение», также может означать «требование» или «просьбу».'
    reason: Культурное пояснение и сохранение лексико-синтаксической неоднозначности שְׁאֵלְתָא.
  - marker: b
    text: 'Буквально также возможно: «в царстве человеческом», то есть в царстве людей или человечества.'
    reason: Лексико-синтаксическая альтернатива для בְּמַלְכוּת אֱנוֹשָׁא.
lexical_decisions:
- source_word: בִּגְזֵרַת עִירִין פִּתְגָמָא
  choice: Это определено решением бодрствующих
  rationale: Конструкция выражает вынесенное небесными существами официальное решение. «Бодрствующие» сохраняет особый арамейский термин, не подменяя его толкованием «ангелы».
- source_word: וּמֵאמַר קַדִּישִׁין שְׁאֵלְתָא
  choice: и постановлено словом святых
  rationale: Арамейская фраза сжата и допускает понимание שְׁאֵלְתָא как «просьба/требование». Основной текст передаёт параллельную авторитетную декларацию естественным русским выражением, а неоднозначность отмечена в сноске.
- source_word: עַד דִּבְרַת דִּי
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение оборота.
- source_word: חַיַּיָּא
  choice: живущие
  rationale: Сохраняет широкое собирательное обозначение живых, не добавляя отсутствующего в источнике уточнения.
- source_word: שַׁלִּיט עִלָּיָא
  choice: Всевышний владычествует
  rationale: «Всевышний» передаёт божественный титул, а «владычествует» — действующую верховную власть, сохраняя возвышенный регистр.
- source_word: בְּמַלְכוּת אֱנוֹשָׁא
  choice: над царством человеческим
  rationale: Хотя предлог буквально может быть передан как «в», по-русски глагол «владычествовать» естественно управляет «над». «Царство человеческое» сохраняет собирательное значение человечества.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: даёт его кому пожелает
  rationale: Ясно передаёт свободу Всевышнего распоряжаться царской властью и сохраняет местоименную отсылку к царству.
- source_word: וּשְׁפַל אֲנָשִׁים
  choice: самого ничтожного из людей
  rationale: Передаёт идиоматическое превосходное значение — человека самого низкого положения. «Ничтожного» сохраняет возможный уничижительный оттенок лучше, чем более положительное «смиренного».
theological_decisions:
- issue: Кто такие «бодрствующие» и «святые»
  choice: Сохранить термины «бодрствующие» и «святые».
  alternative: «ангелы» или «небесные существа»
  rationale: Буквальная терминология сохраняет образ небесного совета в книге Даниила и не сводит его заранее к более общему толкованию.
- issue: Соотношение решения небесных существ и верховной власти Всевышнего
  choice: Сохранить как решение бодрствующих, так и утверждение, что царством владычествует Всевышний.
  alternative: Переформулировать решение бодрствующих лишь как сообщение о Божьем решении.
  rationale: Текст намеренно удерживает напряжение между небесным постановлением и абсолютной властью Всевышнего; перевод не должен устранять его толкованием.
- issue: Значение שְׁאֵלְתָא
  choice: В основном тексте передать как часть авторитетного постановления, а значение «просьба» вынести в сноску.
  alternative: «а требование — по слову святых» или «а просьба — по слову святых»
  rationale: Форма допускает значение просьбы или требования, но синтаксис сжат. Сноска сохраняет реальную неоднозначность, не делая основной русский текст неясным.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Юридическая образность передана словами «решение» и «постановлено»; редкий термин «бодрствующие» сохранён ради образности источника и пояснён в сноске.
