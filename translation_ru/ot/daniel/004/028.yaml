  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ע֗וֹד מִלְּתָ/א֙ בְּ/פֻ֣ם מַלְכָּ֔/א קָ֖ל מִן שְׁמַיָּ֣/א נְפַ֑ל לָ֤/ךְ אָֽמְרִין֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א מַלְכוּתָ֖/ה עֲדָ֥ת מִנָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/028.yaml
  text: 'While the word was still in the king’s mouth[a], a voice fell from heaven: “To you it is said, King Nebuchadnezzar, the kingdom has departed from you.”'
translation:
  language: ru
  text: 'Пока слово ещё было в устах царя, с небес раздался голос: «Тебе сказано, царь Навуходоносор: царство отошло от тебя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царство отнято у тебя».'
    reason: 'Лексический вариант: арамейский глагол может обозначать как удаление или уход, так и лишение кого-либо царства.'
lexical_decisions:
- source_word: עוֹד
  choice: пока … ещё
  rationale: В сочетании со следующей фразой обозначает действие, продолжавшееся в момент внезапного вмешательства.
- source_word: מִלְּתָא
  choice: слово
  rationale: Речь идёт о только что произносившемся царём высказывании; «слово» сохраняет форму оригинала и естественно звучит в данном обороте.
- source_word: בְּפֻם מַלְכָּא
  choice: в устах царя
  rationale: Сохранён образ арамейского выражения, указывающий, что царь ещё не успел закончить говорить.
- source_word: קָל
  choice: голос
  rationale: Последующая прямая речь показывает, что имеется в виду членораздельный голос, а не просто звук.
- source_word: מִן שְׁמַיָּא
  choice: с небес
  rationale: Передаёт указание на небесную сферу и сохраняет библейскую возвышенность без сведения смысла к физическому небу.
- source_word: נְפַל
  choice: раздался
  rationale: Буквально глагол означает «упал», однако сочетание «голос упал с небес» в современном русском неестественно; «раздался» ясно передаёт внезапное небесное возвещение.
- source_word: לָךְ אָמְרִין
  choice: тебе сказано
  rationale: Арамейская форма множественного числа употреблена безлично и по смыслу соответствует русской безлично-пассивной конструкции.
- source_word: נְבוּכַדְנֶצַּר מַלְכָּא
  choice: царь Навуходоносор
  rationale: Естественный русский порядок титула и имени сохраняет обращение к царю.
- source_word: מַלְכוּתָה
  choice: царство
  rationale: В контексте обозначает принадлежащее царю правление и владение; «царство» наиболее прямо сохраняет образ оригинала.
- source_word: עֲדָת
  choice: отошло
  rationale: Передаёт буквальный образ удаления царства, не уточняя сверх текста, было ли оно именно отнято внешним действующим лицом.
- source_word: מִנָּךְ
  choice: от тебя
  rationale: Прямо выражает отделение царства от царя.
theological_decisions:
- issue: Характер небесного голоса
  choice: с небес
  alternative: с неба
  rationale: Контекст представляет голос как возвещение божественного суда; множественная форма «небеса» сохраняет этот смысл и не сводит выражение к погодному или пространственному описанию.
- issue: Способ утраты царства
  choice: царство отошло от тебя
  alternative: царство отнято у тебя
  rationale: Основной текст сохраняет формальную неоднозначность глагола удаления, тогда как вариант «отнято» яснее выражает подразумеваемое действие божественного суда, но делает его более явным, чем грамматическая форма оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Оборот «в устах царя» сохранён ради образности оригинала; неестественное для русского буквальное «голос упал» передано идиоматически как «раздался голос».
