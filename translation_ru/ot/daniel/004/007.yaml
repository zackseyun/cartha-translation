lexical_decisions:
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: мне являлись видения[a]
  rationale: Арамейское сочетание буквально означает «видения моей головы». В основном тексте оно передано естественным современным русским выражением, а буквальный образ сохранён в сноске.
- source_word: עַל מִשְׁכְּבִי
  choice: когда я лежал на своей постели
  rationale: Передаёт положение говорящего на постели естественной русской придаточной конструкцией.
- source_word: חָזֵה הֲוֵית
  choice: мне являлись
  rationale: Перифрастическая конструкция с причастием и הוה обозначает продолжавшееся восприятие; «являлись» естественно сочетается с существительным «видения» и сохраняет переживаемый характер сна.
- source_word: וַאֲלוּ
  choice: и вот
  rationale: Сохраняет указательно-восклицательный переход к примечательному образу видения.
- source_word: אִילָן
  choice: дерево
  rationale: Прямое соответствие арамейскому существительному; первое упоминание оформлено именной конструкцией после «вот».
- source_word: בְּגוֹא אַרְעָא
  choice: посреди земли
  rationale: Сохраняет пространственное значение «в середине, посреди»; «земля» уместна ввиду вселенского масштаба последующего видения, хотя אַרְעָא может также означать страну или сушу.
- source_word: וְרוּמֵהּ שַׂגִּיא
  choice: и высота его велика
  rationale: Близко передаёт именное предложение и простой смысл прилагательного «великий, большой», не усиливая его до «огромна».
