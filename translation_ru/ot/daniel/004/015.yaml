  terminology: «Истолкуй», «значение» и «мудрецы» соответствуют контексту Даниила. Имя «Валтасар» соответствует принятой русской библейской форме для Belteshazzar. Спорное выражение о духе богов передано без конфессионального переосмысления; сноска корректно фиксирует альтернативное единственное прочтение.
