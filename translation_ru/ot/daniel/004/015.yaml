source:
  edition: WLC
  text: דְּנָה֙ חֶלְמָ֣/א חֲזֵ֔ית אֲנָ֖ה מַלְכָּ֣/א נְבוּכַדְנֶצַּ֑ר ו/אנתה בֵּלְטְשַׁאצַּ֜ר פִּשְׁרֵ֣/א אֱמַ֗ר כָּ/ל קֳבֵל֙ דִּ֣י כָּל חַכִּימֵ֣י מַלְכוּתִ֗/י לָֽא יָכְלִ֤ין פִּשְׁרָ/א֙ לְ/הוֹדָ֣עֻתַ֔/נִי ו/אנתה כָּהֵ֔ל דִּ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בָּֽ/ךְ׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/015.yaml
  text: This is the dream that I[a], King Nebuchadnezzar, saw. And you, Belteshazzar, tell its interpretation, because all the wise men of my kingdom are not able to make its interpretation known to me, but you are able, for the spirit of the holy gods is in you.
translation:
  language: ru
  text: Вот сон, который видел я, царь Навуходоносор. А ты, Валтасар, истолкуй его, потому что никто из мудрецов моего царства не может открыть мне его значение; ты же можешь, ибо в тебе дух святых богов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух святого Бога». Арамейские формы «богов» и «святых» стоят во множественном числе, однако это выражение иногда понимают как указание на единого Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּנָה חֶלְמָא
  choice: Вот сон
  rationale: Указательное דְּנָה и определённая форма חֶלְמָא естественно переданы русской конструкцией предъявления «Вот сон».
- source_word: חֲזֵית אֲנָה מַלְכָּא נְבוּכַדְנֶצַּר
  choice: который видел я, царь Навуходоносор
  rationale: Сохранены прошедшее время, выраженное местоимением ударение на говорящем и приложительное царское самоименование.
- source_word: וְאַנתָּה בֵּלְטְשַׁאצַּר
  choice: А ты, Валтасар
  rationale: «А» естественно обозначает переход к прямому обращению и последующий контраст; имя передано в принятой русской библейской форме.
- source_word: פִּשְׁרֵא אֱמַר
  choice: истолкуй его
  rationale: Буквально сочетание означает «скажи толкование»; русский глагол «истолкуй» ясно и естественно передаёт требование сообщить значение сна, а «его» связывает толкование со сном.
- source_word: כָּל קֳבֵל דִּי
  choice: потому что
  rationale: Ясная современная передача арамейского причинного оборота.
- source_word: כָּל חַכִּימֵי מַלְכוּתִי לָא יָכְלִין
  choice: никто из мудрецов моего царства не может
  rationale: Отрицание способности всех мудрецов идиоматично выражено по-русски конструкцией «никто из… не может», без изменения объёма утверждения.
- source_word: פִּשְׁרָא לְהוֹדָעוּתַנִי
  choice: открыть мне его значение
  rationale: Каузатив ידע передан как «открыть/сделать известным», а פשר — как значение истолковываемого сна; местоимение обеспечивает естественную русскую связность.
- source_word: וְאַנתָּה כָּהֵל
  choice: ты же можешь
  rationale: Частица «же» естественно подчёркивает контраст между неспособностью мудрецов и способностью Валтасара.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: дух святых богов
  rationale: Основной текст сохраняет формально множественные אֱלָהִין и קַדִּישִׁין и вероятную языческую формулировку в речи вавилонского царя.
theological_decisions:
- issue: Число и референция в выражении רוּחַ אֱלָהִין קַדִּישִׁין
  choice: дух святых богов
  alternative: Дух святого Бога
  rationale: Формы «богов» и «святых» морфологически множественны, а говорящий — вавилонский царь; поэтому основной текст не устраняет вероятный политеистический оттенок. Возможное понимание как указания на единого Бога сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Синтаксис слегка уплотнён ради ясности, но повтор способности и контраст между мудрецами и Валтасаром сохранены. Маркер сноски поставлен непосредственно после спорного выражения.
