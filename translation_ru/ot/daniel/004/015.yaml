  source_fidelity: 'Текст точно передаёт структуру и смысл арамейского оригинала: сон отнесён к царю Навуходоносору, к Валтасару обращён призыв истолковать его, неспособность всех царских мудрецов выражена без ослабления, а способность Валтасара противопоставлена ей. «Дух святых богов» обоснованно сохраняет морфологическое множественное число оригинала и языческую окраску речи царя.'
