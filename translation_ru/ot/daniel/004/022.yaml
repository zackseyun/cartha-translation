source:
  edition: WLC
  text: וְ/לָ֣/ךְ טָֽרְדִ֣ין מִן אֲנָשָׁ֡/א וְ/עִם חֵיוַ֣ת בָּרָ/א֩ לֶהֱוֵ֨ה מְדֹרָ֜/ךְ וְ/עִשְׂבָּ֥/א כְ/תוֹרִ֣ין לָ֣/ךְ יְטַֽעֲמ֗וּן וּ/מִ/טַּ֤ל שְׁמַיָּ/א֙ לָ֣/ךְ מְצַבְּעִ֔ין וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עֲלָ֑/יךְ עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/022.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and you will be drenched with the dew of heaven, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: ru
  text: Тебя изгонят из среды людей, и будешь ты жить со зверями полевыми. Тебя будут кормить травой, как волов; небесная роса будет покрывать тебя, и семь времён пройдут над тобой[a], пока ты не узнаешь, что Всевышний властвует над царством людей[b] и отдаёт его тому, кому пожелает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь периодов»; многие понимают это как «семь лет».'
    reason: Слово עִדָּנִין не определяет точную продолжительность названных времён.
  - marker: b
    text: «Царство людей» может означать человеческое правление или царство в мире людей.
    reason: Выражение מַלְכוּת אֲנָשָׁא допускает оба близких смысловых оттенка.
lexical_decisions:
- source_word: טָרְדִין מִן אֲנָשָׁא
  choice: тебя изгонят из среды людей
  rationale: Арамейская активная форма множественного числа имеет неопределённый субъект; русское неопределённо-личное предложение естественно передаёт и грамматику, и насильственный характер удаления из человеческого общества.
- source_word: חֵיוַת בָּרָא
  choice: зверями полевыми
  rationale: Выражение обозначает диких наземных животных; традиционная формулировка сохраняет возвышенный регистр и противопоставление цивилизованному человеческому миру.
- source_word: מְדֹרָךְ
  choice: будешь ты жить
  rationale: Вместо буквального «твоё жилище будет» выбран естественный современный русский оборот, точно передающий место и образ обитания.
- source_word: וְעִשְׂבָּא כְתוֹרִין לָךְ יְטַעֲמוּן
  choice: тебе дадут есть траву, как волам
  rationale: 'Сохранён каузативный смысл глагола: пища и состояние навязаны царю. «Волам» точно передаёт образ пасущегося крупного рогатого скота.'
- source_word: מִטַּל שְׁמַיָּא לָךְ מְצַבְּעִין
  choice: ты будешь орошаем небесной росой
  rationale: Формулировка передаёт насыщение влагой и сохраняет возвышенный образ росы небесной, не усиливая значение до непременно сильного промокания.
- source_word: שִׁבְעָה עִדָּנִין
  choice: семь времён
  rationale: עִדָּנִין обозначает времена или периоды неопределённой длительности; перевод сохраняет неоднозначность и не уточняет её как годы.
- source_word: יַחְלְפוּן עֲלָיךְ
  choice: пройдут над тобой
  rationale: Сохранён необычный пространственно-временной образ арамейского оборота и его личная направленность.
- source_word: עַד דִּי תִנְדַּע
  choice: пока ты не узнаешь
  rationale: Базовое значение глагола — «знать, узнать»; контекст допускает опытное признание, но перевод не подменяет его более толковательным «признаешь».
- source_word: שַׁלִּיט עִלָּיָא
  choice: Всевышний властвует
  rationale: Именование Бога и глагол господства переданы прямо, с сохранением утверждения о верховной власти.
- source_word: מַלְכוּת אֲנָשָׁא
  choice: царством человеческим
  rationale: Формулировка сохраняет возможный смысл как человеческого царства или владычества, так и сферы человеческого общества.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: и отдаёт его тому, кому пожелает
  rationale: Местоимение соотнесено с «царством»; глагол воли передан без богословского расширения.
theological_decisions:
- issue: Длительность суда, выраженная словом עִדָּנִין
  choice: семь времён
  alternative: семь периодов; семь лет
  rationale: Источник не называет точной календарной единицы. Основной текст сохраняет эту неопределённость, а распространённое понимание как семи лет отмечено в сноске.
- issue: Смысл выражения מַלְכוּת אֲנָשָׁא
  choice: царство человеческое
  alternative: владычество людей; царство человечества
  rationale: Перевод оставляет открытым, относится ли выражение прежде всего к человеческому правлению или к царству в сфере человечества, не сужая богословское утверждение о власти Всевышнего.
- issue: Характер знания в עַד דִּי תִנְדַּע
  choice: пока ты не узнаешь
  alternative: пока ты не признаешь
  rationale: Контекст предполагает усвоенное через опыт признание Божьей власти, однако лексема прямо означает знание; основной текст сохраняет более широкий смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Сохранены образы «зверей полевых», «небесной росы» и времён, проходящих «над тобой», при этом синтаксис сделан понятным обычному современному читателю.
