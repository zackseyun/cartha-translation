base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/003.yaml
  text: And by me a decree was issued to bring before me all the wise men of Babylon[a], that they might make known to me the interpretation of the dream.
translation:
  language: ru
  text: И я издал указ привести ко мне всех мудрецов Вавилона, чтобы они сообщили мне толкование сна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дали мне знать значение сна».'
    reason: 'Лексическая альтернатива: каузатив ידע допускает буквальное «дать знать», а פְשַׁר может передаваться как «значение».'
lexical_decisions:
- source_word: וּמִנִּי
  choice: И мною
  rationale: Предлог מן с суффиксом 1-го лица указывает на источник распоряжения; в царском административном контексте «мною» естественно передаёт исходящую от царя инициативу, а союз וּ сохранён как «и».
- source_word: שִׂים טְעֵם
  choice: был издан указ
  rationale: Сочетание глагола «положить, установить» с существительным טְעֵם в административном арамейском обозначает издание официального распоряжения. Пассивная конструкция сохраняет форму и звучит естественно по-русски.
- source_word: לְהַנְעָלָה קָדָמַי
  choice: привести ко мне
  rationale: Каузативный инфинитив выражает побуждение войти или предстать, а קָדָמַי означает «передо мной, в моё присутствие». «Привести ко мне» ясно и естественно передаёт придворную ситуацию.
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: всех мудрецов Вавилона
  rationale: Конструктивное сочетание обозначает вавилонских придворных знатоков. Традиционное «мудрецы» понятно современному читателю и не сужает их роль до одной специальности.
- source_word: דִּי
  choice: чтобы
  rationale: Частица вводит целевое придаточное; русский союз «чтобы» непосредственно выражает эту функцию.
- source_word: פְשַׁר חֶלְמָא
  choice: толкование сна
  rationale: פְשַׁר — характерное для книги Даниила обозначение истолкования сна или тайны. Определённость חֶלְמָא передана контекстуально; притяжательное «моего» не добавлено, поскольку его нет в исходном тексте.
- source_word: יְהוֹדְעֻנַּנִי
  choice: они сообщили мне
  rationale: Каузативная форма от ידע буквально означает «дали мне знать». «Сообщили мне» естественно передаёт этот смысл, не уточняя способ объяснения.
