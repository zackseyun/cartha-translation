  text: חֵ֥לֶם חֲזֵ֖ית וִֽ/ידַחֲלִנַּ֑/נִי וְ/הַרְהֹרִין֙ עַֽל מִשְׁכְּבִ֔/י וְ/חֶזְוֵ֥י רֵאשִׁ֖/י יְבַהֲלֻנַּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/002.yaml
  text: I saw a dream[a], and it frightened me; and the thoughts on my bed and the visions of my head terrified me.
translation:
  language: ru
  text: Мне приснился сон, и он испугал меня; мысли, приходившие ко мне в постели, и видения в моей голове привели меня в ужас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «мысли на моём ложе и видения моей головы ужаснули меня».'
    reason: Сохраняет для читателя буквальную пространственную образность и конструкцию оригинала, которые в основном тексте переданы естественнее по-русски.
lexical_decisions:
- source_word: חֵלֶם חֲזֵית
  choice: Мне приснился сон
  rationale: 'Буквально: «я увидел сон». Современное русское выражение «мне приснился сон» естественно передаёт арамейскую идиому, не меняя смысла.'
- source_word: וִידַחֲלִנַּנִי
  choice: и он испугал меня
  rationale: Форма с местоименным суффиксом указывает на говорящего как объект; единственное число естественно соотносится со словом «сон».
- source_word: וְהַרְהֹרִין
  choice: мысли
  rationale: Существительное обозначает мысли, раздумья или размышления. «Мысли» — ясный современный эквивалент, сохраняющий параллель с видениями.
- source_word: עַל מִשְׁכְּבִי
  choice: приходившие ко мне в постели
  rationale: Буквальный образ «на моём ложе» передан естественным русским оборотом; добавленное «приходившие ко мне» делает связь определения со словом «мысли» ясной.
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: и видения в моей голове
  rationale: Сохранён семитский образ головы как места внутренних видений, но русский предлог «в» делает выражение понятным и естественным.
- source_word: יְבַהֲלֻנַּנִי
  choice: привели меня в ужас
  rationale: Глагол выражает сильное потрясение, ужас или смятение. Этот вариант передаёт большую интенсивность по сравнению с предшествующим «испугал» и согласуется с составным множественным подлежащим.
