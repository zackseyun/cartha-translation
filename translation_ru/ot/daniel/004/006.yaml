source:
  edition: WLC
  text: בֵּלְטְשַׁאצַּר֮ רַ֣ב חַרְטֻמַיָּ/א֒ דִּ֣י אֲנָ֣ה יִדְעֵ֗ת דִּ֠י ר֣וּחַ אֱלָהִ֤ין קַדִּישִׁין֙ בָּ֔/ךְ וְ/כָל רָ֖ז לָא אָנֵ֣ס לָ֑/ךְ חֶזְוֵ֨י חֶלְמִ֧/י דִֽי חֲזֵ֛ית וּ/פִשְׁרֵ֖/הּ אֱמַֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/006.yaml
  text: Belteshazzar[a], chief of the magicians, whom I know has the spirit of the holy gods in you, and no mystery is too difficult for you, tell me the visions of my dream that I saw, and its interpretation.
translation:
  language: ru
  text: 'Валтасар[a], глава чародеев: я знаю, что в тебе дух святых богов и никакая тайна для тебя не трудна. Расскажи мне видения моего сна, которые я видел, и их истолкование.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух святого Бога»; или: «дух святого Бога».'
    reason: Арамейское выражение допускает обсуждаемое в традиции понимание как ссылки на единого Бога, хотя форма множественного числа поддерживает основной перевод.
lexical_decisions:
- source_word: בֵּלְטְשַׁאצַּר
  choice: Валтасар
  rationale: Традиционная русская форма вавилонского имени Даниила; сохраняет узнаваемость библейского именования.
- source_word: רַב חַרְטֻמַיָּא
  choice: глава чародеев
  rationale: רַב обозначает начальника или главу, а חַרְטֻמַיָּא — придворных специалистов по тайным знаниям и толкованию; «чародеи» — понятное и традиционное русское обозначение этой группы.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: дух святых богов
  rationale: Множественное согласование אֱלָהִין и קַדִּישִׁין и речь Навуходоносора естественнее всего поддерживают множественное число; спорное единственное понимание сохранено в сноске.
- source_word: וְכָל רָז לָא אָנֵס לָךְ
  choice: и никакая тайна для тебя не трудна
  rationale: 'Передаёт смысл идиомы: нет тайны, которая была бы Даниилу не по силам; формулировка ясна и естественна по-русски.'
- source_word: חֶזְוֵי חֶלְמִי
  choice: видения моего сна
  rationale: Сохраняет множественное число חֶזְוֵי и различие между самим сном и увиденными в нём образами.
- source_word: דִי חֲזֵית
  choice: который я видел
  rationale: Прямо передаёт относительное придаточное и личный опыт говорящего; по форме относится к слову «сон».
- source_word: וּפִשְׁרֵהּ אֱמַר
  choice: и его истолкование расскажи мне
  rationale: פִּשְׁרֵהּ — техническое обозначение истолкования сна, а אֱמַר в обращении имеет смысл «скажи, сообщи»; в русском предложении общий императив естественно передан как «расскажи мне».
theological_decisions:
- issue: Следует ли понимать רוּחַ אֱלָהִין קַדִּישִׁין как языческое множественное выражение или как указание на единого Бога
  choice: дух святых богов
  alternative: Дух святого Бога; дух святого Бога
  rationale: Грамматическое множественное число и точка зрения Навуходоносора поддерживают основной перевод во множественном числе. Вариант с единственным числом остаётся возможным толкованием и поэтому указан в сноске без устранения богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Обращение отделено восклицательным знаком для ясности синтаксиса; сохранены «видения» во множественном числе и термин «истолкование».
