revisions:
- from: Валтасар[a], глава чародеев! Я знаю, что в тебе дух святых богов и никакая тайна для тебя не трудна. Расскажи мне видения моего сна, который я видел, и его истолкование.
  to: 'Валтасар[a], глава чародеев: я знаю, что в тебе дух святых богов и никакая тайна для тебя не трудна. Расскажи мне видения моего сна, которые я видел, и их истолкование.'
  rationale: Исправлена связь относительного придаточного, чтобы «я видел» относилось к «видениям», как в арамейском тексте. Местоимение в «их истолкование» согласовано с ближайшим и исходным референтом — множественными «видениями»; при этом смысл истолкования сна не меняется. Пунктуация обращения сделана менее экспрессивной и более связной.
