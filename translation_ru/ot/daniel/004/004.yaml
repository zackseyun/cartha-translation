id: DAN.4.4
reference: Daniel 4:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בֵּ/אדַ֣יִן עללין חַרְטֻמַיָּ/א֙ אָֽשְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א וְ/חֶלְמָ֗/א אָמַ֤ר אֲנָה֙ קֳדָ֣מֵי/ה֔וֹן וּ/פִשְׁרֵ֖/הּ לָא מְהוֹדְעִ֥ין לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/004.yaml
  text: Then the magicians[a], enchanters, Chaldeans, and diviners came in, and I told the dream before them[b], but they did not make its interpretation known to me.
translation:
  language: ru
  text: Тогда вошли маги, заклинатели, халдеи[a] и гадатели. Я рассказал им сон, но они не открыли мне его толкования[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь слово «халдеи» может обозначать не только народ, но и особый разряд вавилонских придворных мудрецов.
    reason: cultural_note
  - marker: b
    text: 'В арамейском тексте прямо сказано, что они не открыли толкования. В контексте это можно понимать как неспособность его сообщить; поэтому возможен перевод: «не смогли открыть мне его толкование».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер обозначает следующий момент в последовательности событий; «тогда» естественно передаёт ход рассказа.
- source_word: עללין
  choice: вошли
  rationale: Глагол обозначает вхождение или явку; в придворном контексте краткое «вошли» точно и естественно.
- source_word: חַרְטֻמַיָּא
  choice: маги
  rationale: Устоявшееся обозначение группы вавилонских придворных мудрецов, связанных с тайными знаниями и обрядами.
- source_word: אָשְׁפַיָּא
  choice: заклинатели
  rationale: Термин обозначает особую группу специалистов по оккультным практикам и позволяет отличить её от остальных перечисленных групп.
- source_word: כשדי/א
  choice: халдеи
  rationale: Сохранено прямое этническое или профессиональное наименование источника; в данном придворном перечне оно, вероятно, обозначает также особый разряд вавилонских учёных.
- source_word: גָזְרַיָּא
  choice: гадатели
  rationale: В контексте слово обозначает тех, кто посредством гадания определяет или провозглашает скрытое; «гадатели» понятно современному читателю.
- source_word: חֶלְמָא
  choice: сон
  rationale: Определённость ясна из контекста; по-русски после глагола «рассказал» дополнительное указательное слово не требуется.
- source_word: אָמַר אֲנָה קֳדָמֵיהוֹן
  choice: Я рассказал им сон
  rationale: Идиома буквально говорит о сообщении сна перед ними, то есть в их присутствии. Русское «рассказал им» естественно передаёт адресованное им изложение сна без неуместной буквальности.
- source_word: וּפִשְׁרֵהּ
  choice: его толкования
  rationale: В книге Даниила это технический термин для истолкования сна или тайны; «толкование» сохраняет данный оттенок точнее, чем общее «значение».
- source_word: לָא מְהוֹדְעִין לִי
  choice: они не открыли мне
  rationale: Каузативная форма означает «дать знать, сообщить, открыть». Перевод не добавляет прямо не выраженной модальности неспособности.
theological_decisions:
- issue: Следует ли передавать заключительную фразу как неспособность истолкователей или только как факт, что толкование не было сообщено?
  choice: они не открыли мне его толкования
  alternative: они не смогли открыть мне его толкование
  rationale: Арамейский текст прямо отрицает действие сообщения, но не употребляет отдельного выражения неспособности. Контекст может подразумевать, что они не смогли истолковать сон, однако перевод сохраняет сдержанность исходной формулировки.
translation_notes:
  register: Современный литературный русский язык; повествование лаконичное и dignified, а названия придворных групп различены без архаизации. Синтаксис слегка сглажен ради естественности, при этом сохранены последовательность перечня и неоднозначность заключительной фразы.
