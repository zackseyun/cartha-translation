  text: אֱדַ֨יִן דָּֽנִיֵּ֜אל דִּֽי שְׁמֵ֣/הּ בֵּלְטְשַׁאצַּ֗ר אֶשְׁתּוֹמַם֙ כְּ/שָׁעָ֣ה חֲדָ֔ה וְ/רַעְיֹנֹ֖/הִי יְבַהֲלֻנֵּ֑/הּ עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר בֵּלְטְשַׁאצַּר֙ חֶלְמָ֤/א וּ/פִשְׁרֵ/א֙ אַֽל יְבַהֲלָ֔/ךְ עָנֵ֤ה בֵלְטְשַׁאצַּר֙ וְ/אָמַ֔ר מרא/י חֶלְמָ֥/א ל/שנאי/ך וּ/פִשְׁרֵ֥/הּ ל/ערי/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/016.yaml
  text: Then Daniel[a], whose name was Belteshazzar, was appalled for about an hour, and his thoughts terrified him. The king answered and said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar answered and said, “My lord, may the dream be for those who hate you[b], and its interpretation for your enemies.”
translation:
  language: ru
  text: 'Тогда Даниил, которого звали Валтасаром, примерно на час[b] оцепенел[a], и мысли приводили его в ужас. Царь сказал: «Валтасар, пусть сон и его истолкование не ужасают тебя». Валтасар ответил: «Господин мой! Пусть этот сон будет для тех, кто ненавидит тебя, а его истолкование — для твоих врагов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был потрясён», «был ошеломлён». Арамейский глагол может обозначать потрясение, от которого человек на время лишается речи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как на один час». Выражение может указывать на приблизительный промежуток времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: דָּנִיֵּאל דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: Даниил, которого звали Валтасаром
  rationale: Относительная конструкция поясняет вавилонское имя Даниила; русская форма естественна для повествования в прошедшем времени.
- source_word: אֶשְׁתּוֹמַם
  choice: оцепенел
  rationale: Глагол обозначает потрясение, способное привести к безмолвию; «оцепенел» передаёт и внутреннее смятение, и остановку речи, не сводя значение к простому удивлению.
- source_word: כְּשָׁעָה חֲדָה
  choice: примерно на час
  rationale: Конструкция указывает приблизительную продолжительность; перевод сохраняет временной смысл и не делает меру времени излишне механически точной.
- source_word: וְרַעְיֹנֹהִי יְבַהֲלֻנֵּהּ
  choice: и мысли его ужаснули
  rationale: Сохраняются существительное «мысли» и сильное значение глагола, выражающего страх и смятение.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Царь сказал
  rationale: Устойчивую семитскую формулу речи передаёт естественный русский глагол без тяжеловесного «ответил и сказал»; по контексту это обращение царя к молчащему Даниилу.
- source_word: חֶלְמָא וּפִשְׁרֵא אַל יְבַהֲלָךְ
  choice: пусть сон и его истолкование не ужасают тебя
  rationale: Отрицательное пожелание передано естественной русской конструкцией; повтор корня בהל отражён тем же глаголом «ужасать», что и ранее.
- source_word: מָרִי
  choice: Господин мой
  rationale: Это почтительное придворное обращение к царю; оно сохраняет высокий регистр и в данном контексте не является божественным титулом.
- source_word: לְשָׂנְאָיִךְ ... לְעָרָיִךְ
  choice: для тех, кто ненавидит тебя ... для твоих врагов
  rationale: Предлог ל выражает желаемое отнесение содержания сна к недругам царя. Формулировка сохраняет параллелизм и не утверждает, будто сам сон буквально поражает их.
- source_word: וּפִשְׁרֵהּ
  choice: его истолкование
  rationale: Слово обозначает именно истолкование сна; местоимение ясно соотносится со сном.
theological_decisions:
- issue: Значение обращения מָרִי к Навуходоносору
  choice: Господин мой
  alternative: Владыка мой; государь
  rationale: В царском контексте это человеческий почтительный титул, а не указание на божественность; выбранный вариант точно и естественно сохраняет придворную почтительность.
- issue: Пожелание о применении сна к врагам царя
  choice: Пусть этот сон будет для тех, кто ненавидит тебя
  alternative: Пусть этот сон исполнится над теми, кто ненавидит тебя
  rationale: Более формальный вариант сохраняет неоднозначность предлога ל и дипломатическое пожелание Даниила, не добавляя прямо отсутствующий в тексте глагол «исполниться».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным придворным регистром. Повтор «ужаснули / не ужасают» намеренно сохраняет общий арамейский корень. Порядок маркеров [b] и [a] определяется их фактическим местом при соответствующих словам и исправляет несоответствие маркеров в консультационном английском слое.
