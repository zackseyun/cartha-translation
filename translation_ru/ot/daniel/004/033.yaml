  source_fidelity: В целом перевод точно передаёт последовательность арамейского текста, повтор «вернулся ко мне», неявную агентность пассивных форм и различение советников и вельмож. Однако «стали искать меня» вносит невыраженный начинательный оттенок, а «вместе со славой» несколько сглаживает связь, обозначенную לִיקַר («для/во славу»).
  naturalness: Современный литературный регистр выдержан. «Разыскали меня» естественнее в повествовательном контексте, чем «стали искать меня», а перестановка в заключительной части делает фразу более плавной без изменения смысла.
  terminology: «Разум», «величие», «великолепие», «советники» и «вельможи» удачны для царского контекста. «Был вновь утверждён над моим царством» сохраняет смысл оригинала, хотя несколько торжественно; такой регистр здесь уместен.
