source:
  edition: WLC
  text: בֵּ/הּ זִמְנָ֞/א מַנְדְּעִ֣/י יְת֣וּב עֲלַ֗/י וְ/לִ/יקַ֨ר מַלְכוּתִ֜/י הַדְרִ֤/י וְ/זִוִ/י֙ יְת֣וּב עֲלַ֔/י וְ/לִ֕/י הַדָּֽבְרַ֥/י וְ/רַבְרְבָנַ֖/י יְבַע֑וֹן וְ/עַל מַלְכוּתִ֣/י הָתְקְנַ֔ת וּ/רְב֥וּ יַתִּירָ֖ה ה֥וּסְפַת לִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/033.yaml
  text: At that time my reason returned to me[a], and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my nobles sought me, and I was reestablished over my kingdom[c][b], and surpassing greatness was added to me.
translation:
  language: ru
  text: В то время разум вернулся ко мне[a], и для славы моего царства ко мне вернулись моё величие и великолепие. Мои советники и вельможи разыскали меня[b]. Я был вновь утверждён над моим царством[c], и мне было прибавлено ещё больше величия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понимание вернулось ко мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мои советники и знатные люди обратились ко мне».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «я был восстановлен на царстве»; возможный смысл: «я был прочно утверждён над моим царством».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: В то время
  rationale: Естественно передаёт арамейское временное выражение и последовательность повествования, не усиливая значение до «в тот же миг».
- source_word: מַנְדְּעִי
  choice: разум
  rationale: В контексте возвращения Навуходоносора к нормальному состоянию обозначает способность здраво мыслить; «разум» точно и понятно передаёт смысл.
- source_word: יְתוּב עֲלַי
  choice: вернулся ко мне
  rationale: Сохраняет буквальный образ возвращения и повтор глагола в первой половине стиха.
- source_word: לִיקַר מַלְכוּתִי
  choice: вместе со славой моего царства
  rationale: Предлог ל допускает смысл отношения или сопутствующего результата. Такая формулировка естественно связывает восстановление царской славы с возвращением величия и великолепия, не вводя лишней причинности.
- source_word: הַדְרִי וְזִוִי
  choice: моё величие и великолепие
  rationale: Передаёт царственное достоинство и внешний блеск двумя различными, но сочетающимися русскими словами.
- source_word: הַדָּבְרַי וְרַבְרְבָנַי
  choice: мои советники и вельможи
  rationale: «Советники» обозначает придворных советников, а «вельможи» — высокопоставленных лиц царства; сочетание сохраняет различие терминов.
- source_word: יְבַעוֹן
  choice: стали искать меня
  rationale: Сохраняет основное значение «искать, разыскивать» и в данном контексте выражает возобновление обращения придворных к царю.
- source_word: עַל מַלְכוּתִי הָתְקְנַת
  choice: я был вновь утверждён над моим царством
  rationale: Передаёт пассивное восстановление и прочное утверждение царя у власти; «над царством» сохраняет конструкцию оригинала.
- source_word: וּרְבוּ יַתִּירָה הוּסְפַת לִי
  choice: мне было прибавлено ещё больше величия
  rationale: Естественно передаёт усилительное значение יַתִּירָה и пассивную форму, оставляя источник прибавления не названным.
theological_decisions:
- issue: Божественное действие при восстановлении царя
  choice: Сохранить неявную субъектность посредством форм «был вновь утверждён» и «было прибавлено».
  alternative: Прямо добавить, что Бог восстановил царя и даровал ему величие.
  rationale: Контекст связывает восстановление со Всевышним, однако сам стих не называет действующего субъекта; перевод не должен делать его явным.
- issue: Связь славы царства с возвращением царских качеств
  choice: Передать конструкцию как «вместе со славой моего царства».
  alternative: «Для славы моего царства» или «ради славы моего царства».
  rationale: Арамейский предлог допускает несколько оттенков. Выбранная формулировка сохраняет связь событий, не утверждая однозначно целевое значение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Повтор «вернулся ко мне» сохранён ради структуры оригинала. Архаизмы сведены к минимуму; слово «вельможи» оставлено как понятное обозначение высшей царской знати.
