base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/017.yaml
  text: The tree that you saw[a], which grew and became strong, whose height reached to the heavens and was visible to all the earth—
translation:
  language: ru
  text: Дерево, которое ты видел, которое выросло и окрепло, высота которого достигала небес и которое было видно по всей земле[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Арамейское אַרְעָא может также означать «страна»; здесь «земля» лучше соответствует всеобщему масштабу образа во сне.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִילָנָא
  choice: дерево
  rationale: Обычное арамейское слово «дерево»; определённость передаётся контекстом и указанием на уже увиденное во сне дерево.
- source_word: דִּי חֲזַיְתָ
  choice: которое ты видел
  rationale: Относительная частица с формой перфекта второго лица мужского рода единственного числа; перевод сохраняет прямое обращение к царю.
- source_word: רְבָה וּתְקִף
  choice: выросло и окрепло
  rationale: Глаголы описывают увеличение дерева и приобретение им силы; эта формулировка естественна для образа растущего дерева и сохраняет последовательность действий.
- source_word: וְרוּמֵהּ
  choice: высота которого
  rationale: Существительное обозначает высоту с местоименным суффиксом третьего лица; «высота которого» точнее передаёт форму оригинала, чем «вершина».
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: достигала небес
  rationale: Глагол означает «достигать», а арамейская форма «небеса» естественно передаётся русским множественным числом.
- source_word: וַחֲזוֹתֵהּ לְכָל אַרְעָא
  choice: и которое было видно со всей земли
  rationale: Оборот передаёт видимость дерева во всём земном пространстве; по-русски «было видно со всей земли» звучит естественно и сохраняет вселенский масштаб образа.
theological_decisions:
- issue: Масштаб значения אַרְעָא в образе царского сна
  choice: земля
  alternative: страна
  rationale: Слово допускает оба значения, но дерево достигает небес и видно отовсюду, поэтому «земля» лучше сохраняет намеренно всеобщий масштаб видения, не добавляя дальнейших богословских выводов.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным библейским звучанием. Повтор относительной конструкции сохраняет структуру арамейского описания; тире в конце показывает, что фраза продолжается в следующем стихе.
