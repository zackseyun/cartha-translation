base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/027.yaml
  text: The king answered and said[a], “Is this not Babylon the Great[b], which I myself built as a royal residence by the might of my power and for the glory of my majesty?”
translation:
  language: ru
  text: 'Царь сказал: «Не тот ли это великий Вавилон, который я сам построил как царскую столицу[a] могуществом моей силы и во славу моего величия?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. «для дома царства»; возможно также: «как царскую резиденцию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: сказал
  rationale: Стандартная арамейская повествовательная формула буквально содержит два глагола, но в данном контексте не обозначает ответ на обращённую к царю реплику; естественное русское «сказал» точно передаёт её функцию.
- source_word: הֲלָא
  choice: Не тот ли это
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: בָּבֶל רַבְּתָא
  choice: великий Вавилон
  rationale: Передаёт постпозитивное определение и хвастливую торжественность, не превращая описательную фразу в закреплённый титул.
- source_word: אֲנָה
  choice: я сам
  rationale: Самостоятельное местоимение выражает эмфатическое самовозвеличивание царя, но не исключительность в смысле «я один».
- source_word: לְבֵית מַלְכוּ
  choice: как царскую столицу
  rationale: Буквально «для дома царства/царской власти»; в отношении города выражение указывает на центр царской власти. «Царская столица» естественно по-русски и не сужает смысл до одного дворца.
- source_word: בִּתְקַף חִסְנִי
  choice: могуществом моей силы
  rationale: Сохраняет намеренное торжественное усиление и смысловую избыточность царской похвальбы.
- source_word: וְלִיקָר הַדְרִי
  choice: во славу моего величия
  rationale: Передаёт различие между יְקָר — «слава, честь» и הֲדָר — «величие, великолепие», сохраняя возвышенный регистр.
theological_decisions:
- issue: Характер похвальбы Навуходоносора о Вавилоне
  choice: великий Вавилон
  alternative: Вавилон Великий
  rationale: В арамейском это описательное словосочетание, а не обязательно технический титул; строчная форма сохраняет величавый тон, не привнося более поздних ассоциаций.
- issue: Значение לְבֵית מַלְכוּ применительно к Вавилону
  choice: как царскую столицу
  alternative: как царскую резиденцию; для дома царства
  rationale: Фраза допускает образ «дома царской власти». Контекст целого города благоприятствует значению центра царствования, однако примечание сохраняет буквальную и более узкую возможности.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно торжественным звучанием. Риторический вопрос и самовозвеличивающая смысловая избыточность оригинала сохранены; неестественная для русского двойная формула «ответил и сказал» не воспроизводится механически.
