source:
  edition: WLC
  text: וְ֠/הוּא מְהַשְׁנֵ֤א עִדָּנַיָּ/א֙ וְ/זִמְנַיָּ֔/א מְהַעְדֵּ֥ה מַלְכִ֖ין וּ/מְהָקֵ֣ים מַלְכִ֑ין יָהֵ֤ב חָכְמְתָ/א֙ לְ/חַכִּימִ֔ין וּ/מַנְדְּעָ֖/א לְ/יָדְעֵ֥י בִינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/021.yaml
  text: He changes times and seasons[a]; he removes kings and sets up kings[b]; he gives wisdom to the wise and knowledge to those who have understanding.
translation:
  language: ru
  text: Он изменяет времена и сроки[a], низлагает царей и возводит царей; Он даёт мудрость мудрым и знание тем, кто обладает разумением[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «времена и назначенные сроки». Арамейская пара может обозначать как времена вообще, так и определённые для чего-либо сроки.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тем, кто знает разумение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהַשְׁנֵא
  choice: изменяет
  rationale: Передаёт каузативное значение причастия — «делает иными, изменяет» — и его продолжающийся характер.
- source_word: עִדָּנַיָּא וְזִמְנַיָּא
  choice: времена и сроки
  rationale: 'Сохраняет два близких, но не полностью тождественных понятия: периоды времени и определённые или подходящие сроки.'
- source_word: מְהַעְדֵּה
  choice: низлагает
  rationale: В отношении царей естественно передаёт устранение от власти, не ослабляя активного действия Бога; более общее буквальное значение — «удаляет».
- source_word: מַלְכִין
  choice: царей
  rationale: Прямое соответствие арамейскому существительному во множественном числе.
- source_word: מְהָקֵים
  choice: возводит
  rationale: В сочетании с «царями» естественно выражает поставление у власти и образует ясную смысловую пару с «низлагает».
- source_word: יָהֵב
  choice: даёт
  rationale: Прямое и естественное соответствие обычному арамейскому глаголу «давать».
- source_word: חָכְמְתָא לְחַכִּימִין
  choice: мудрость мудрым
  rationale: Сохраняет корневой повтор и афористичность исходного текста.
- source_word: מַנְדְּעָא
  choice: знание
  rationale: Сохраняет различие между знанием и последующим понятием разумения.
- source_word: לְיָדְעֵי בִינָה
  choice: тем, кто обладает разумением
  rationale: Естественно по-русски передаёт смысл выражения, буквально называющего людей «знающими разумение».
theological_decisions:
- issue: Божественная власть над политическими правителями
  choice: Прямо сказать, что Бог низлагает и возводит царей.
  alternative: Бог лишь допускает возвышение и падение царей.
  rationale: Арамейский текст непосредственно приписывает Богу оба действия. Перевод сохраняет это сильное утверждение, не развивая его в отдельную детерминистскую или пермиссивную систему.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллельные конструкции и повтор слова «царей» сохранены ради ритма и структуры оригинала; местоимение «Он» во второй части написано с прописной буквы как ясная отсылка к Богу, без добавления отсутствующего в арамейском имени.
