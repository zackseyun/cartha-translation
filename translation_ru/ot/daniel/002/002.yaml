  text: וַ/יֹּ֣אמֶר הַ֠/מֶּלֶךְ לִ/קְרֹ֨א לַֽ/חַרְטֻמִּ֜ים וְ/לָֽ/אַשָּׁפִ֗ים וְ/לַֽ/מְכַשְּׁפִים֙ וְ/לַ/כַּשְׂדִּ֔ים לְ/הַגִּ֥יד לַ/מֶּ֖לֶךְ חֲלֹמֹתָ֑י/ו וַ/יָּבֹ֕אוּ וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/002.yaml
  text: Then the king ordered the magicians[a], the enchanters, the sorcerers, and the Chaldeans to tell the king his dreams[b]. So they came and stood before the king.
translation:
  language: ru
  text: Тогда царь велел созвать[b] магов, заклинателей, колдунов и халдеев[a], чтобы они рассказали царю его сны. Они пришли и встали перед царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Халдеями» могли называться как представители халдейского народа, так и, в данном контексте, особая группа вавилонских придворных мудрецов.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «царь сказал позвать»; это выражение означает, что царь распорядился созвать их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִקְרֹא
  choice: велел созвать
  rationale: Буквально конструкция означает «сказал позвать», но в данном контексте это распоряжение царя. «Велел созвать» естественно передаёт и директивную силу, и значение инфинитива «позвать, созвать».
- source_word: חַרְטֻמִּים
  choice: маги
  rationale: Слово обозначает придворных специалистов по тайным знаниям, гаданию или магическим практикам. «Маги» — понятное современному читателю и достаточно широкое соответствие.
- source_word: אַשָּׁפִים
  choice: заклинатели
  rationale: Точное значение названия этой группы спорно. «Заклинатели» отличает её от магов и колдунов, не вводя более узкого и не вполне надёжного значения «астрологи».
- source_word: מְכַשְּׁפִים
  choice: колдуны
  rationale: Слово связано с занятием колдовством. «Колдуны» ясно и естественно передаёт отрицательную оккультную окраску.
- source_word: כַּשְׂדִּים
  choice: халдеи
  rationale: 'Передача сохраняет исходное наименование и его неоднозначность: речь может идти об этнических халдеях либо о категории вавилонских придворных мудрецов.'
- source_word: לְהַגִּיד
  choice: рассказали
  rationale: Глагол означает «сообщить, объявить, рассказать». В сочетании со снами русское «рассказали» звучит естественно и сохраняет требование изложить их содержание.
- source_word: חֲלֹמֹתָיו
  choice: его сны
  rationale: Сохранено множественное число еврейского текста и местоименный суффикс третьего лица мужского рода, относящийся к царю.
- source_word: וַיָּבֹאוּ
  choice: они пришли
  rationale: Прямая и естественная передача последовательного повествовательного действия.
- source_word: וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: встали перед царём
  rationale: Сохраняет конкретный образ исходного выражения, которое также подразумевает явку и готовность служить перед правителем.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Перечень придворных специалистов передан различимыми и понятными словами без архаизмов; неоднозначность слова «халдеи» сохранена и пояснена в сноске. Повтор слова «царь» сохранён вслед за еврейским текстом, чтобы не ослаблять формальную сцену придворного вызова.
