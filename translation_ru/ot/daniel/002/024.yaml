  text: כָּ/ל קֳבֵ֣ל דְּנָ֗ה דָּֽנִיֵּאל֙ עַ֣ל עַל אַרְי֔וֹךְ דִּ֚י מַנִּ֣י מַלְכָּ֔/א לְ/הוֹבָדָ֖ה לְ/חַכִּימֵ֣י בָבֶ֑ל אֲזַ֣ל וְ/כֵ֣ן אֲמַר לֵ֗/הּ לְ/חַכִּימֵ֤י בָבֶל֙ אַל תְּהוֹבֵ֔ד הַעֵ֨לְ/נִי֙ קֳדָ֣ם מַלְכָּ֔/א וּ/פִשְׁרָ֖/א לְ/מַלְכָּ֥/א אֲחַוֵּֽא־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/024.yaml
  text: 'Therefore Daniel went in to Arioch[a], whom the king had appointed to destroy the wise men of Babylon. He went and said this to him: “Do not destroy the wise men of Babylon. Bring me in before the king[b], and I will show the interpretation to the king.”'
translation:
  language: ru
  text: 'Поэтому Даниил пришёл к Ариоху, которого царь назначил истребить вавилонских мудрецов. Он пришёл и сказал ему: «Не истребляй вавилонских мудрецов. Введи меня к царю, и я сообщу царю истолкование».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и я покажу царю истолкование».'
    reason: 'Лексическая альтернатива: арамейский глагол אֲחַוֵּא может означать «показать» или «дать знать, сообщить».'
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Поэтому
  rationale: Передаёт арамейскую причинно-следственную связку и естественно связывает действие Даниила с предшествующим откровением тайны.
- source_word: עַל עַל אַרְיוֹךְ
  choice: пришёл к Ариоху
  rationale: Глагол может обозначать вход или приближение; в данном придворном контексте нейтральное «пришёл к» сохраняет смысл, не уточняя сверх текста, вошёл ли Даниил в помещение.
- source_word: דִּי מַנִּי מַלְכָּא
  choice: которого царь назначил
  rationale: Точно передаёт официальное поручение Ариоху.
- source_word: לְהוֹבָדָה / אַל תְּהוֹבֵד
  choice: истребить / не истребляй
  rationale: Каузатив от אבד означает «погубить, уничтожить»; «истребить» естественно относится к казни целой группы и позволяет сохранить лексическое соответствие двух употреблений.
- source_word: לְחַכִּימֵי בָבֶל
  choice: вавилонских мудрецов
  rationale: Естественная русская передача обозначения придворных мудрецов Вавилона.
- source_word: אֲזַל וְכֵן אֲמַר לֵהּ
  choice: Он пришёл и сказал ему
  rationale: Сохраняет повтор глагола движения и ввод прямой речи; отдельное «так/следующее» по-русски здесь избыточно, поскольку содержание сразу следует.
- source_word: הַעֵלְנִי קֳדָם מַלְכָּא
  choice: Введи меня к царю
  rationale: Каузатив «ввести» и выражение «пред царём/в присутствие царя» естественно объединены в современной русской придворной формулировке.
- source_word: וּפִשְׁרָא
  choice: истолкование
  rationale: Передаёт специальный для повествования термин, обозначающий толкование сна и его содержания.
- source_word: אֲחַוֵּא
  choice: сообщу
  rationale: Глагол означает «показать, дать знать, сообщить»; с дополнением «истолкование» русское «сообщу» звучит естественно и сохраняет значение раскрытия знания.
