  yaml_path: translation/ot/daniel/002/015.yaml
  text: He answered and said to Arioch[a], the king’s commander[b], “Why is the decree so harsh from before the king?” Then Arioch made the matter known to Daniel.
translation:
  language: ru
  text: 'Он ответил и сказал Ариоху, царскому сановнику[a]: «Почему царский указ был издан с такой поспешностью[b]?» Тогда Ариох сообщил Даниилу, в чём дело.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царскому начальнику». Арамейское слово обозначает наделённого властью царского служащего; в данном контексте Ариох исполняет царский приговор.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «так суров» или «требует такой срочности». Арамейское слово может сочетать оттенки поспешности, суровости и неотложности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  choice: ответил и сказал
  rationale: Сохранена характерная для семитского повествования парная формула; по-русски она звучит несколько торжественно, но остаётся понятной и передаёт фактуру оригинала.
- source_word: שַׁלִּיטָא דִי מַלְכָּא
  choice: царский начальник
  rationale: Слово обозначает наделённого властью царского служащего. В данном контексте Ариоху поручено привести приговор в исполнение, однако более конкретное «военачальник» выходило бы за пределы значения самой фразы.
- source_word: עַל מָה
  choice: почему
  rationale: Естественный русский эквивалент вопросительного оборота «по какой причине».
- source_word: דָתָא
  choice: указ
  rationale: В придворном контексте речь идёт о властном постановлении царя, а не о законе вообще.
- source_word: מְהַחְצְפָה
  choice: настолько суров
  rationale: Редкое слово передаёт представление о резкой, жёсткой либо поспешно проводимой мере. В основном тексте отражена суровость указа, а связанная с ней срочность исполнения отмечена в сноске.
- source_word: מִן קֳדָם מַלְכָּא
  choice: царя
  rationale: Арамейская идиома буквально означает «от лица/из присутствия царя» и указывает, что указ исходит от его власти. Естественное русское сочетание «указ царя» передаёт это без искусственной кальки.
- source_word: אֱדַיִן
  choice: тогда
  rationale: Передаёт обычный повествовательный переход.
- source_word: מִלְּתָא
  choice: в чём дело
  rationale: Широкое по значению слово здесь относится к обстоятельствам и причине царского решения; русский оборот естественно передаёт смысл.
- source_word: הוֹדַע
  choice: объяснил
  rationale: Передаёт каузативное значение «дал узнать, сообщил», а в контексте — разъяснил Даниилу происходящее.
