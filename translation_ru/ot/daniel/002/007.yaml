base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/007.yaml
  text: They answered a second time and said[a], “Let the king tell the dream to his servants[b], and we will show the interpretation.”
translation:
  language: ru
  text: 'Они во второй раз ответили и сказали[a]: «Пусть царь расскажет сон своим слугам, и мы сообщим его толкование[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снова». Арамейское слово точнее означает «во второй раз».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы объявим его толкование».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ
  choice: ответили
  rationale: Пеаль, перфект, 3-е лицо множественного числа; прямое повествовательное значение соответствует контексту диалога.
- source_word: תִנְיָנוּת
  choice: во второй раз
  rationale: Передаёт выраженное в арамейском наречии порядковое значение точнее, чем более общее «снова».
- source_word: וְאָמְרִין
  choice: и сказали
  rationale: Сохраняет отдельный глагол речи оригинала и естественно вводит прямую речь.
- source_word: מַלְכָּא
  choice: царь
  rationale: Существительное выступает подлежащим при глаголе пожелания, а не обращением.
- source_word: חֶלְמָא
  choice: сон
  rationale: Обычное арамейское обозначение сна; определённость ясна из контекста.
- source_word: יֵאמַר
  choice: пусть … расскажет
  rationale: Передаёт волитивно-просительный оттенок имперфекта; в русском «рассказать сон» естественнее буквального «сказать сон».
- source_word: לְעַבְדוֹהִי
  choice: своим слугам
  rationale: В придворной речи это почтительное самообозначение состоящих при царе людей; «рабам» здесь могло бы чрезмерно подчеркнуть их несвободный статус.
- source_word: וּפִשְׁרָה
  choice: его толкование
  rationale: פשר обозначает истолкование или объяснение сна, а суффикс указывает на принадлежность толкования этому сну.
- source_word: נְהַחֲוֵה
  choice: мы сообщим
  rationale: Гапель глагола חוה означает «показать, дать знать»; «сообщим толкование» естественно передаёт каузативный смысл в данном контексте.
