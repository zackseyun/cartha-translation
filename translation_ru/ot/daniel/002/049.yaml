base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/049.yaml
  text: And Daniel requested of the king[a], and he appointed Shadrach, Meshach, and Abed-nego over the administration of the province of Babylon. But Daniel remained at the king’s court.
translation:
  language: ru
  text: И Даниил попросил царя, и царь назначил Седраха, Мисаха и Авденаго над делами провинции Вавилона. Сам же Даниил оставался при царском дворе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у царских ворот». Вероятно, речь идёт о царском дворе или о месте, где велись государственные дела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָא מִן מַלְכָּא
  choice: попросил царя
  rationale: Глагол означает «просить»; естественная русская конструкция с прямым дополнением передаёт официальную просьбу, не придавая ей излишне юридического оттенка.
- source_word: וּמַנִּי
  choice: и тот поставил
  rationale: Форма означает «назначил, поставил». Подлежащее прямо не названо, но из контекста им является царь; местоимение «тот» ясно обозначает смену действующего лица.
- source_word: עַל עֲבִידְתָּא דִּי מְדִינַת בָּבֶל
  choice: над управлением Вавилонской областью
  rationale: עֲבִידְתָּא может обозначать работу, службу или административные дела, а מְדִינָה — административную область. В данном придворно-государственном контексте речь идёт об управленческих обязанностях.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Седраха, Мисаха и Авденаго
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, понятные русскому читателю.
- source_word: וְדָנִיֵּאל
  choice: Сам же Даниил
  rationale: 'Союз вводит смысловое противопоставление: друзья Даниила получили обязанности в области, тогда как он находился в царской административной сфере.'
- source_word: בִּתְרַע מַלְכָּא
  choice: при царском дворе
  rationale: Буквально выражение означает «у/в царских ворот». В древневосточной придворной речи ворота могли обозначать место царского присутствия и управления; идиоматический перевод понятнее в основном тексте, а буквальный смысл сохранён в примечании.
