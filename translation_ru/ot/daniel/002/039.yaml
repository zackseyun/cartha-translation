base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/039.yaml
  text: And after you another kingdom[a], inferior to yours, will arise; and yet a third kingdom, of bronze[b], which will rule over all the earth.
translation:
  language: ru
  text: После тебя возникнет другое царство, ниже твоего[a], а затем — третье царство, бронзовое, которое будет властвовать над всей землёй[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ниже тебя». Арамейское выражение необычно; вероятный смысл в том, что следующее царство будет ниже царства Навуходоносора по достоинству или славе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «над всей страной». Арамейское слово может означать как «землю», так и «страну»; здесь, вероятно, имеется в виду обширное имперское господство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתְרָךְ
  choice: После тебя
  rationale: Предложное сочетание указывает на временную последовательность после Навуходоносора. Союз וּ естественно передаётся связностью русского предложения без обязательного начального «и».
- source_word: תְּקוּם
  choice: возникнет
  rationale: Глагол буквально означает «встать, подняться», а применительно к царству — «возникнуть, прийти к власти». «Возникнет» естественно передаёт появление следующего царства и сохраняет образ последовательного восхождения.
- source_word: מַלְכוּ אָחֳרִי
  choice: другое царство
  rationale: Существительное обозначает здесь политическое царство или державу, а прилагательное — следующее, отличное от первого.
- source_word: ארעא מִנָּךְ
  choice: ниже твоего
  rationale: Арамейское выражение необычно и допускает более буквальное «ниже тебя». В контексте истукана речь, вероятнее всего, идёт о более низком достоинстве следующего царства; притяжательное «твоего» ясно показывает, что сравниваются царства.
- source_word: וּמַלְכוּ תליתיא
  choice: а затем — третье царство
  rationale: Союз продолжает последовательность царств. «А затем» естественно выражает переход к третьему царству, не добавляя его исторической идентификации.
- source_word: דִּי נְחָשָׁא
  choice: медное
  rationale: Нְחָשָׁא обозначает медь или бронзу. В русском библейском и литературном употреблении «медное царство» кратко и естественно соотносится с материалом истукана.
- source_word: דִּי תִשְׁלַט
  choice: которое будет властвовать
  rationale: Глагол означает осуществлять власть или господство. «Будет властвовать» сохраняет сильный смысл державного господства.
- source_word: בְּכָל אַרְעָא
  choice: над всей землёй
  rationale: אַרְעָא может означать как всю землю, так и всю страну. Универсализирующая речь о мировой державе поддерживает основной вариант «над всей землёй», при этом альтернатива отмечена в сноске.
theological_decisions:
- issue: Сравнительный смысл ארעא מִנָּךְ
  choice: ниже твоего
  alternative: ниже тебя; обращённое к земле по сравнению с тобой
  rationale: Синтаксис выражения труден. Смысл более низкого достоинства согласуется с нисходящей ценностью материалов истукана, но перевод не связывает царство с какой-либо конкретной поздней исторической державой.
- issue: Объём выражения בְּכָל אַרְעָא
  choice: над всей землёй
  alternative: над всей страной
  rationale: Широкая риторика всемирного господства в видении поддерживает «землёй», однако возможное значение «страной» сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным повествовательным ритмом. Формулировка избегает архаизмов и не вводит историко-конфессиональной идентификации царств; подлинная неоднозначность двух арамейских выражений сохранена в сносках.
