  text: So the decree went out[a], and the wise men were being killed[b]; and they sought Daniel and his companions to kill them.
translation:
  language: ru
  text: Итак, указ был обнародован[a], и мудрецов уже предавали смерти[b]. Разыскивали Даниила и его товарищей, чтобы убить их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышел»; то есть царский указ был официально издан или объявлен.'
