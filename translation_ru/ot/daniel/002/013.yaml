  - marker: b
    text: 'Или: «убивали». Арамейская форма указывает, что казни уже происходили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָתָא
  choice: указ
  rationale: Имперско-арамейское слово обозначает официальное правовое постановление или царское распоряжение; «указ» естественно для придворного контекста.
- source_word: נֶפְקַת
  choice: был обнародован
  rationale: Буквально «вышел»; здесь речь о доведении царского указа до исполнения. «Был обнародован» ясно передаёт контекстуальный смысл, а буквальный образ отмечен в сноске.
- source_word: חַכִּימַיָּא
  choice: мудрецов
  rationale: Устойчивое обозначение учёных советников при царском дворе в книге Даниила; «мудрецы» узнаваемо и не сужает состав этой группы.
- source_word: מִתְקַטְּלִין
  choice: уже предавали смерти
  rationale: Причастная форма изображает продолжающееся действие; «уже» делает явным, что казни начались, не представляя их завершёнными.
- source_word: וּבְעוֹ
  choice: стали искать
  rationale: В данном контексте глагол означает разыскивать людей; форма естественно передаёт начавшиеся официальные поиски.
- source_word: חַבְרוֹהִי
  choice: его товарищей
  rationale: Слово обозначает связанных с Даниилом людей; «товарищи» звучит естественно и не добавляет более личного оттенка слова «друзья».
- source_word: לְהִתְקְטָלָה
  choice: чтобы убить их
  rationale: Инфинитив выражает цель поисков — предать смерти Даниила и его товарищей; добавленное «их» ясно указывает на всю названную группу.
