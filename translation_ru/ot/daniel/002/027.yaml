id: DAN.2.27
reference: Daniel 2:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עָנֵ֧ה דָנִיֵּ֛אל קֳדָ֥ם מַלְכָּ֖/א וְ/אָמַ֑ר רָזָ/ה֙ דִּֽי מַלְכָּ֣/א שָׁאֵ֔ל לָ֧א חַכִּימִ֣ין אָֽשְׁפִ֗ין חַרְטֻמִּין֙ גָּזְרִ֔ין יָכְלִ֖ין לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/027.yaml
  text: Daniel answered before the king and said[a], “The mystery that the king asks, no wise men, enchanters, magicians[b], or diviners are able to make known to the king.”
translation:
  language: ru
  text: 'Даниил ответил в присутствии царя и сказал: «Тайну[a], о которой спрашивает царь, не могут открыть царю ни мудрецы, ни заклинатели[b], ни маги, ни гадатели».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокрытое дело». Арамейское слово обозначает скрытую вещь, которую необходимо открыть; «тайна» сохраняет повторяющуюся тему этой главы.'
    reason: lexical_alternative
  - marker: b
    text: 'Точное значение арамейского названия этой группы вавилонских специалистов неясно; возможный перевод: «астрологи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה
  choice: ответил
  rationale: Обычный арамейский глагол ответа в повествовательном диалоге; сохраняет торжественный характер придворной сцены.
- source_word: קֳדָם
  choice: в присутствии
  rationale: Передаёт пространственно-реляционное значение «перед, в присутствии» и естественно звучит в современном русском языке.
- source_word: רָזָה
  choice: тайну
  rationale: Обозначает сокрытое дело — сон и его значение, которые может открыть только Бог. «Тайна» сохраняет повторяющуюся тему главы и естественнее русского «секрет» в данном возвышенном контексте.
- source_word: דִּי
  choice: о которой
  rationale: Относительная частица связывает «тайну» с просьбой царя; русское управление глагола «спрашивать» здесь естественно передаётся сочетанием «о которой».
- source_word: שָׁאֵל
  choice: спрашивает
  rationale: Передаёт продолжающий оставаться актуальным запрос царя без добавления временного оттенка.
- source_word: חַכִּימִין
  choice: мудрецы
  rationale: Устоявшееся обозначение сословия учёных царских советников в книге Даниила.
- source_word: אָשְׁפִין
  choice: заклинатели
  rationale: Точное значение технического названия не вполне ясно; выбран осторожный эквивалент для отдельной группы вавилонских специалистов по оккультным практикам.
- source_word: חַרְטֻמִּין
  choice: маги
  rationale: Ясное и традиционно понятное обозначение придворных специалистов по магическим и тайным искусствам.
- source_word: גָּזְרִין
  choice: гадатели
  rationale: Передаёт функцию людей, пытавшихся определять и возвещать скрытое; слово понятно современному русскому читателю и не архаично.
- source_word: יָכְלִין
  choice: не могут
  rationale: Прямо выражает отсутствие способности и позволяет построить естественную русскую фразу с перечислением после сказуемого.
- source_word: לְהַחֲוָיָה
  choice: открыть
  rationale: Каузативный инфинитив означает «дать узнать, сообщить, раскрыть»; «открыть тайну» естественно передаёт смысл разглашения сокрытого, не добавляя толкования.
- source_word: לְמַלְכָּא
  choice: царю
  rationale: Передаёт косвенный объект сообщения и отличается от более раннего קֳדָם «в присутствии царя».
theological_decisions:
- issue: Характер тайны и пределы человеческого знания
  choice: Сохранено прямое утверждение, что перечисленные специалисты не способны открыть тайну царю.
  alternative: Уточнить в основном тексте, что открыть её способен только Бог.
  rationale: В этом стихе прямо говорится лишь о неспособности человеческих специалистов; божественное откровение названо в следующем стихе, поэтому здесь оно не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным придворным регистром. Сохранена исходная формула «ответил… и сказал», а порядок частей предложения слегка перестроен ради естественного русского синтаксиса. Перечень четырёх групп передан раздельными терминами без попытки искусственно уточнить их функции.
