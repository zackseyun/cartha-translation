  text: וּ/מִלְּתָ֨/א דִֽי מַלְכָּ֤/ה שָׁאֵל֙ יַקִּירָ֔ה וְ/אָחֳרָן֙ לָ֣א אִיתַ֔י דִּ֥י יְחַוִּנַּ֖/הּ קֳדָ֣ם מַלְכָּ֑/א לָהֵ֣ן אֱלָהִ֔ין דִּ֚י מְדָ֣רְ/ה֔וֹן עִם בִּשְׂרָ֖/א לָ֥א אִיתֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/011.yaml
  text: And the thing that the king asks is difficult[a], and there is no other who can declare it before the king except the gods[b], whose dwelling is not with flesh.
translation:
  language: ru
  text: То, о чём спрашивает царь, трудно[a], и никто другой не может открыть это царю, кроме богов[b], чьё обиталище не среди плоти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дело, о котором спрашивает царь, трудно»; буквально: «тяжело».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кроме богов, чьё обиталище не среди людей»; возможный смысл: «не среди смертных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּתָא
  choice: то
  rationale: В данном контексте слово обозначает предмет царской просьбы — содержание сна и его истолкование. Местоименная конструкция «то, чего просит царь» естественна по-русски и не сужает значение до одного лишь «слова».
- source_word: שָׁאֵל
  choice: просит
  rationale: Причастная форма обозначает то, о чём царь просит. «Требует» возможно по контексту, но сильнее непосредственного лексического значения.
- source_word: יַקִּירָה
  choice: трудно
  rationale: В контексте прилагательное характеризует царскую просьбу как чрезвычайно тяжёлую для исполнения. Наречное сказуемое «трудно» естественно согласуется с конструкцией «то, чего просит царь».
- source_word: וְאָחֳרָן לָא אִיתַי
  choice: и никто другой не может
  rationale: Арамейский оборот утверждает отсутствие кого-либо иного, способного дать ответ. Русское «никто другой» ясно передаёт личный референт, подразумеваемый последующим относительным предложением.
- source_word: יְחַוִּנַּהּ
  choice: открыть это
  rationale: Глагол означает показать, сообщить или сделать известным. «Открыть» уместно для тайного знания, которое требуется сообщить царю, и естественно звучит в русском контексте.
- source_word: קֳדָם מַלְכָּא
  choice: царю
  rationale: Буквально выражение означает «перед царём», то есть в его присутствии. При русском глаголе «открыть» дательный падеж естественно передаёт адресата сообщения, не изменяя смысла.
- source_word: לָהֵן
  choice: кроме
  rationale: Частица вводит единственное исключение из общего отрицания; «кроме» является прямым и ясным русским соответствием.
- source_word: אֱלָהִין
  choice: богов
  rationale: Форма множественного числа и речь вавилонских мудрецов указывают на богов, а не на единственного Бога. Перевод сохраняет грамматику и историческую обстановку.
- source_word: מְדָרְהוֹן
  choice: обитают
  rationale: Исходный текст буквально говорит об их «обиталище». Глагольная конструкция «которые не обитают» передаёт тот же смысл более естественно для современного русского языка.
- source_word: עִם בִּשְׂרָא
  choice: с плотью
  rationale: Перевод сохраняет конкретный образ арамейского текста и противопоставление богов воплощённым смертным. Более разъясняющие варианты вынесены в примечание.
- source_word: לָא אִיתוֹהִי
  choice: не обитают
  rationale: Отрицательная бытийная конструкция относится к обиталищу богов; в русском предложении её смысл естественно выражен отрицанием глагола «обитают».
theological_decisions:
- issue: Референт אֱלָהִין
  choice: богов
  alternative: божественных существ; Бога
  rationale: Множественное число и языческий придворный контекст благоприятствуют обычному значению «боги». Единственное число «Бог» внесло бы в речь вавилонских советников чуждое ей уточнение.
- issue: Передача בִּשְׂרָא
  choice: плотью
  alternative: людьми; смертными
  rationale: Буквальный образ «плоти» сохраняет напряжение между божественными существами и телесными смертными, не сводя выражение заранее к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; архаизмы устранены, а образ «плоти» сохранён как значимый элемент исходного текста.
