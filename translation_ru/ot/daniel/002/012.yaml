  to: Из-за этого[a] царь пришёл в ярость и сильно разгневался и приказал[b] погубить всех мудрецов Вавилона.
  rationale: Сноска b перенесена к «приказал», которое она объясняет. «Истребить» заменено на «погубить», чтобы не усиливать значение арамейского לְהוֹבָדָה и сохранить неопределённость относительно способа гибели. Союз перед «и приказал» опущен ради естественного русского однородного ряда; последовательность действий и связь с оригиналом сохранены.
