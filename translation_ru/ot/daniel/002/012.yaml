base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/012.yaml
  text: Because of this[a], the king became furious and very enraged[b], and he commanded that all the wise men of Babylon be destroyed.
translation:
  language: ru
  text: Из-за этого[a] царь пришёл в ярость и сильно разгневался и приказал[b] погубить всех мудрецов Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По этой причине»; «Поэтому».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально глагол означает «сказал», но здесь он вводит царский указ, поэтому переведено: «приказал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Из-за этого
  rationale: Арамейское причинное выражение передаёт значение «по этой причине / вследствие этого». Выбран естественный русский оборот с явной причинной связью.
- source_word: מַלְכָּא
  choice: царь
  rationale: Определённая эмфатическая форма; в данном повествовательном контексте естественно передаётся словом «царь».
- source_word: בְּנַס
  choice: пришёл в ярость
  rationale: Глагол обозначает сильный гнев или переход в состояние гнева; выражение сохраняет динамику и интенсивность исходного текста.
- source_word: וּקְצַף שַׂגִּיא
  choice: и сильно разгневался
  rationale: קְצַף выражает гнев, а שַׂגִּיא усиливает его. Сочетание сохраняет намеренное нагромождение близких обозначений гнева, не звуча неестественно по-русски.
- source_word: וַאֲמַר
  choice: и приказал
  rationale: Буквально глагол означает «сказал», но здесь он вводит царское распоряжение с последующим инфинитивом; «приказал» естественно передаёт его контекстуальную силу.
- source_word: לְהוֹבָדָה
  choice: истребить
  rationale: Каузативная форма от אבד означает причинить гибель, погубить. В контексте царского указа «истребить» точно и ёмко передаёт смысл.
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: всех мудрецов Вавилона
  rationale: Конструктивное сочетание с показателем совокупности означает всех представителей придворной группы вавилонских мудрецов.
