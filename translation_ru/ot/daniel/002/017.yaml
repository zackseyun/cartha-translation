  terminology: Анания, Мисаил и Азария соответствуют закрепившейся русской библейской передаче имён. «Товарищи» приемлемо передаёт חַבְרוֹהִי без навязывания более узкого значения «друзья». «Сообщил ... об этом деле» передаёт каузативное הוֹדַע и широкое значение מִלְּתָא.
