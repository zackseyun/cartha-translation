  text: אֱדַ֥יִן דָּֽנִיֵּ֖אל לְ/בַיְתֵ֣/הּ אֲזַ֑ל וְ֠/לַ/חֲנַנְיָה מִֽישָׁאֵ֧ל וַ/עֲזַרְיָ֛ה חַבְר֖וֹ/הִי מִלְּתָ֥/א הוֹדַֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/017.yaml
  text: Then Daniel went to his house and made the matter known to Hananiah[a], Mishael, and Azariah, his companions.
translation:
  language: ru
  text: Тогда Даниил пошёл к себе домой и сообщил своим товарищам — Анании, Мисаилу и Азарии — об этом деле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейское наречие обозначает последовательность событий; «тогда» естественно передаёт развитие повествования.
- source_word: לְבַיְתֵהּ
  choice: к себе домой
  rationale: Предлог с существительным «дом» и суффиксом 3-го лица указывает направление. Русское «к себе домой» естественно и однозначно показывает, что речь идёт о доме Даниила.
- source_word: אֲזַל
  choice: пошёл
  rationale: Обычный арамейский глагол движения; «пошёл» точно и естественно соответствует контексту.
- source_word: מִלְּתָא
  choice: обо всём
  rationale: В данном контексте существительное указывает на только что изложенное дело — царское требование, угрозу и обращение Даниила к Ариоху. «Рассказал обо всём» звучит естественно, хотя более формально буквальный вариант — «сообщил об этом деле».
- source_word: הוֹדַע
  choice: рассказал
  rationale: Каузативная форма глагола «знать» означает «дать знать, сообщить». В сочетании с «обо всём» русское «рассказал» ясно и естественно передаёт смысл.
- source_word: וְלַחֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: Анании, Мисаилу и Азарии
  rationale: Имена переданы в привычной русской библейской форме; единое управление дательным падежом естественно воспроизводит арамейскую конструкцию.
- source_word: חַבְרוֹהִי
  choice: своим товарищам
  rationale: Слово обозначает людей, связанных с Даниилом как близкие спутники или соратники. «Товарищи» сохраняет широкий характер этой связи и не сводит её исключительно к личной дружбе.
