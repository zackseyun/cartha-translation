  text: כָּ/ל קֳבֵ֣ל דִּֽי חֲזַ֡יְתָ דִּ֣י מִ/טּוּרָ/א֩ אִתְגְּזֶ֨רֶת אֶ֜בֶן דִּי לָ֣א בִ/ידַ֗יִן וְ֠/הַדֶּקֶת פַּרְזְלָ֨/א נְחָשָׁ֤/א חַסְפָּ/א֙ כַּסְפָּ֣/א וְ/דַהֲבָ֔/א אֱלָ֥הּ רַב֙ הוֹדַ֣ע לְ/מַלְכָּ֔/א מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/יַצִּ֥יב חֶלְמָ֖/א וּ/מְהֵימַ֥ן פִּשְׁרֵֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/045.yaml
  text: Just as you saw that a stone was cut from the mountain not by hands[a], and that it crushed the iron, the bronze, the clay, the silver, and the gold, the great God has made known to the king what will happen after this. The dream is certain, and its interpretation is trustworthy.
translation:
  language: ru
  text: Подобно тому как ты видел, что камень был отсечён от горы не руками[a] и раздробил железо, бронзу, глину, серебро и золото, великий Бог открыл царю, что произойдёт после этого. Сон несомненен, и его истолкование достоверно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без рук» или «не с помощью рук»; арамейское выражение указывает, что камень был отсечён не человеческим действием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: Так как
  rationale: Арамейский оборот вводит вывод из увиденной детали сна; русское «так как» естественно передаёт здесь объяснительно-причинную связь, не превращая её в отдельное утверждение.
- source_word: מִטּוּרָא אִתְגְּזֶרֶת אֶבֶן
  choice: от горы был отсечён камень
  rationale: Сохраняются определённость слова «гора», пассивная форма глагола и образ отделения камня от горы.
- source_word: דִּי לָא בִידַיִן
  choice: не руками
  rationale: Буквальный идиоматический оборот сохраняет подразумеваемое нечеловеческое действие, не уточняя его в основном тексте.
- source_word: וְהַדֶּקֶת
  choice: и раздробил
  rationale: Глагол обозначает сокрушение, раздробление; форма мужского рода естественно соотносится с камнем.
- source_word: פַּרְזְלָא נְחָשָׁא חַסְפָּא כַּסְפָּא וְדַהֲבָא
  choice: железо, бронзу, глину, серебро и золото
  rationale: Порядок материалов полностью сохранён; נְחָשָׁא в данном контексте передано как «бронза».
- source_word: אֱלָהּ רַב
  choice: великий Бог
  rationale: Прямо передаёт сочетание существительного с прилагательным без добавочного конфессионального толкования.
- source_word: הוֹדַע לְמַלְכָּא
  choice: дал царю знать
  rationale: Передаёт каузативное значение «сделал известным» естественным русским оборотом.
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: что произойдёт после этого
  rationale: Ясно и современно передаёт будущую направленность высказывания.
- source_word: וְיַצִּיב חֶלְמָא
  choice: Сон верен
  rationale: יַצִּיב означает твёрдый, несомненный, достоверный; «верен» лаконично выражает надёжность сна как откровения.
- source_word: וּמְהֵימַן פִּשְׁרֵהּ
  choice: и истолкование его достоверно
  rationale: Сохраняется различие между характеристиками сна и его истолкования; «достоверно» передаёт надёжность מְהֵימַן.
theological_decisions:
- issue: Смысл выражения «не руками»
  choice: Сохранить идиому «не руками» без пояснения в основном тексте
  alternative: не человеческими руками
  rationale: Оригинал подразумевает нечеловеческое, в контексте — божественное действие, но не выражает слово «человеческими»; буквальная идиома сохраняет богословскую напряжённость и межтекстовые связи.
translation_notes:
  register: 'Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис сохраняет единство аргумента: увиденное царём служит основанием утверждения о том, что великий Бог открыл будущее. Архаизмы по возможности исключены.'
