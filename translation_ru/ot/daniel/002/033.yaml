source:
  edition: WLC
  text: שָׁק֖וֹ/הִי דִּ֣י פַרְזֶ֑ל רַגְל֕וֹ/הִי מנ/הון דִּ֣י פַרְזֶ֔ל ו/מנ/הון דִּ֥י חֲסַֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/033.yaml
  text: its legs were of iron[a], its feet partly of iron and partly of clay.
translation:
  language: ru
  text: голени его — из железа, ступни его — частью из железа, частью из глины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обожжённой глины»; возможно также: «керамики».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקוֹהִי
  choice: голени его
  rationale: Арамейское слово обозначает нижние части ног; «голени» точно передаёт анатомическое отличие от следующих далее ступней и естественно звучит при описании изваяния.
- source_word: דִּי
  choice: из
  rationale: Относительная частица связывает части тела с материалом; по-русски состав естественно выражается конструкцией «из железа».
- source_word: פַרְזֶל
  choice: железо
  rationale: Обычное и однозначное соответствие арамейскому названию металла.
- source_word: רַגְלוֹהִי
  choice: ступни его
  rationale: В данном противопоставлении слово обозначает ступни, отличные от упомянутых прежде голеней; «ступни» сохраняет анатомическую последовательность образа.
- source_word: מנ/הון
  choice: частью
  rationale: 'Буквально «из них» здесь имеет распределительное значение: одна часть ступней состоит из одного материала, другая — из другого.'
- source_word: ו/מנ/הון
  choice: частью
  rationale: Союз и повтор распределительной конструкции естественно передаются параллельным оборотом «частью... частью...».
- source_word: חֲסַף
  choice: глина
  rationale: Слово может обозначать глину либо изготовленный из неё керамический материал; «глина» ясно и традиционно передаёт вещество в образе смешанных ступней, а альтернативы отмечены в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконизмом, соответствующими перечню частей изваяния. Параллельная конструкция «частью... частью...» сохраняет ритм арамейского текста; настоящее связочное сказуемое в русском опущено естественным образом.
