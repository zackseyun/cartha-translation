  yaml_path: translation/ot/daniel/002/026.yaml
  text: The king answered and said to Daniel, whose name was Belteshazzar, “Are you able to make known to me the dream that I saw, and its interpretation?”
translation:
  language: ru
  text: 'Царь ответил и сказал Даниилу, которого звали Валтасаром: «Можешь ли ты поведать мне сон, который я видел, и дать его истолкование?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Царь ответил и сказал
  rationale: Сохранена характерная для библейского арамейского парная повествовательная формула, хотя в современном русском она звучит несколько торжественно.
- source_word: לְדָנִיֵּאל
  choice: Даниилу
  rationale: Естественная русская передача адресата при глаголе речи и традиционная форма имени.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: которого звали Валтасаром
  rationale: Относительная конструкция со значением «имя которого — Валтасар» естественно передаётся по-русски глаголом «звали»; употреблён творительный падеж согласно современной литературной норме.
- source_word: הֲאִיתָךְ כָּהֵל
  choice: Можешь ли ты
  rationale: Кратко и естественно передаёт прямой вопрос о способности совершить названное действие.
- source_word: לְהוֹדָעֻתַנִי
  choice: открыть мне
  rationale: Каузатив ידע означает «дать узнать, сделать известным». «Открыть мне» сохраняет смысл сообщения ранее неизвестного и хорошо сочетается и со сном, и с его истолкованием.
- source_word: חֶלְמָא דִי חֲזֵית
  choice: сон, который я видел
  rationale: Сохранена исходная метафора «видеть сон», естественная и в русском языке, без замены на более идиоматическое «который мне приснился».
- source_word: וּפִשְׁרֵהּ
  choice: и его истолкование
  rationale: «Истолкование» передаёт специальное значение פשר в книге Даниила точнее, чем более широкое «смысл».
