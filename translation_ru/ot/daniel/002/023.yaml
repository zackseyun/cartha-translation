reference: Daniel 2:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ֣/ךְ אֱלָ֣הּ אֲבָהָתִ֗/י מְהוֹדֵ֤א וּ/מְשַׁבַּח֙ אֲנָ֔ה דִּ֧י חָכְמְתָ֛/א וּ/גְבוּרְתָ֖/א יְהַ֣בְתְּ לִ֑/י וּ/כְעַ֤ן הֽוֹדַעְתַּ֨/נִי֙ דִּֽי בְעֵ֣ינָא מִנָּ֔/ךְ דִּֽי מִלַּ֥ת מַלְכָּ֖/א הוֹדַעְתֶּֽ/נָא׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/023.yaml
  text: To you[a], O God of my fathers, I give thanks and praise, because you have given me wisdom and might, and now you have made known to me what we requested from you[c][b], for you have made known to us the king’s matter.
translation:
  language: ru
  text: Тебя, Боже моих отцов[a], я благодарю и прославляю, потому что Ты даровал мне мудрость и силу и теперь открыл мне то, о чём мы просили Тебя[b], — ведь Ты открыл нам дело царя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Боже моих предков». Буквально по-арамейски: «Боже моих отцов» — выражение, связывающее Даниила с предшествующими поколениями.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «то, чего мы искали у Тебя».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «слово царя» или «вопрос царя». Арамейское слово имеет широкий смысл и обозначает дело, поставленное царём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהּ אֲבָהָתִי
  choice: Боже моих отцов
  rationale: Сохраняет буквальный семейно-заветный образ арамейского выражения и естественно звучит как русское обращение.
- source_word: מְהוֹדֵא וּמְשַׁבַּח אֲנָה
  choice: я благодарю и прославляю
  rationale: Передаёт два параллельных причастных сказуемых и подчёркнутое אֲנָה, не сводя благодарение и хвалу к одному действию.
- source_word: דִּי
  choice: потому что / ведь
  rationale: В первом случае союз вводит причину благодарения; во втором — пояснительное основание заключительного утверждения.
- source_word: חָכְמְתָא וּגְבוּרְתָא
  choice: мудрость и силу
  rationale: «Сила» естественно и достаточно широко передаёт גְבוּרָה как дарованную Богом способность и могущество, не ограничивая смысл физической силой.
- source_word: יְהַבְתְּ לִי
  choice: Ты даровал мне
  rationale: «Даровал» точно передаёт совершившееся даяние и поддерживает dignified молитвенный регистр.
- source_word: וּכְעַן
  choice: и теперь
  rationale: Сохраняет переход от ранее дарованных качеств к непосредственному откровению.
- source_word: הוֹדַעְתַּנִי
  choice: открыл мне
  rationale: Естественно передаёт каузатив «сделал известным мне» в контексте божественного сообщения.
- source_word: דִּי בְעֵינָא מִנָּךְ
  choice: то, о чём мы просили Тебя
  rationale: Сохраняет первое лицо множественного числа и молитвенный контекст; значение глагола допускает оттенок «искали/домогались».
- source_word: מִלַּת מַלְכָּא
  choice: дело царя
  rationale: Сохраняет широту מִלָּה («слово, дело, вопрос») и не добавляет прямо не названные здесь сон и его истолкование.
- source_word: הוֹדַעְתֶּנָא
  choice: Ты открыл нам
  rationale: Точно сохраняет суффикс первого лица множественного числа и общинный характер ответа на молитву Даниила и его товарищей.
theological_decisions:
- issue: Заветно-семейная формула обращения к Богу
  choice: Боже моих отцов
  alternative: Боже моих предков
  rationale: Буквальное «отцов» сохраняет традиционную библейскую формулу и связь Даниила с прежними поколениями, не добавляя догматического толкования.
- issue: Смена единственного числа на множественное во второй половине стиха
  choice: открыл мне то, о чём мы просили Тебя ... открыл нам
  alternative: открыл мне то, о чём я просил Тебя ... открыл мне
  rationale: Арамейский текст явно сочетает единственное число הוֹדַעְתַּנִי с множественным בְעֵינָא и הוֹדַעְתֶּנָא; эта напряжённость сохранена без гармонизации.
- issue: Характер полученного знания
  choice: открыл
  alternative: дал узнать
  rationale: «Открыл» естественно для контекста Божьего ответа, но само по себе не уточняет механизм откровения и не вносит дополнительной доктринальной схемы.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным молитвенным тоном. Заглавное «Ты» последовательно употреблено при обращении к Богу. Сохранены повторы «открыл» и намеренная смена «мне — мы — нам».
