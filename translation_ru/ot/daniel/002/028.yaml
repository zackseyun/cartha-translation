source:
  edition: WLC
  text: בְּרַ֡ם אִיתַ֞י אֱלָ֤הּ בִּ/שְׁמַיָּ/א֙ גָּלֵ֣א רָזִ֔ין וְ/הוֹדַ֗ע לְ/מַלְכָּ/א֙ נְבֽוּכַדְנֶצַּ֔ר מָ֛ה דִּ֥י לֶהֱוֵ֖א בְּ/אַחֲרִ֣ית יוֹמַיָּ֑/א חֶלְמָ֨/ךְ וְ/חֶזְוֵ֥י רֵאשָׁ֛/ךְ עַֽל מִשְׁכְּבָ֖/ךְ דְּנָ֥ה הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/028.yaml
  text: 'But there is a God in heaven who reveals mysteries[a], and he has made known to King Nebuchadnezzar what will happen in the latter days. Your dream, and the visions of your head as you lay on your bed[c][b], were these:'
translation:
  language: ru
  text: 'Но есть на небесах Бог[a], открывающий тайны, и Он дал знать царю Навуходоносору, что произойдёт в последние дни[b]. Вот твой сон и видения, которые были у тебя в голове, когда ты лежал на постели[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «есть Бог на небесах». Арамейское выражение формально не имеет показателя определённости, хотя в данном контексте явно относится к истинному Богу.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в грядущие дни»; буквально: «в конце дней». Выражение может обозначать решающий будущий период, не задавая само по себе определённой эсхатологической системы.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «видения твоей головы на твоём ложе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Но
  rationale: Противительный союз подчёркивает контраст с бессилием вавилонских мудрецов в предыдущем контексте.
- source_word: אִיתַי אֱלָהּ בִּשְׁמַיָּא
  choice: есть на небесах Бог
  rationale: Сохраняет экзистенциальную конструкцию и формальную неопределённость арамейского существительного, при этом по-русски естественно указывает на истинного Бога.
- source_word: גָּלֵא רָזִין
  choice: открывающий тайны
  rationale: Причастный оборот передаёт характеристику постоянного действия Бога; «тайны» сохраняет ключевой мотив книги Даниила.
- source_word: וְהוֹדַע
  choice: и Он дал знать
  rationale: Передаёт каузативное значение «сделал известным» и отличает этот глагол от предшествующего «открывающий».
- source_word: מָה דִּי לֶהֱוֵא
  choice: что произойдёт
  rationale: Естественно передаёт будущее событие, не утяжеляя русский текст буквальным «что будет».
- source_word: בְּאַחֲרִית יוֹמַיָּא
  choice: в последние дни
  rationale: Близко передаёт арамейское временное выражение и сохраняет его возможную эсхатологическую значимость без привязки к определённой системе.
- source_word: חֶלְמָךְ וְחֶזְוֵי רֵאשָׁךְ
  choice: твой сон и видения, возникшие у тебя в голове
  rationale: «Твой сон» передаёт обращение во втором лице; выражение о видениях сформулировано естественно для современного русского, а буквальный образ отмечен в сноске.
- source_word: עַל מִשְׁכְּבָךְ
  choice: когда ты лежал на постели
  rationale: Передаёт обстоятельство, при котором царь видел сон и видения, естественным современным русским языком.
- source_word: דְּנָה הוּא
  choice: Вот каковы были
  rationale: Идиоматически вводит последующее изложение содержания сна и согласуется с русским множественным рядом «сон и видения».
theological_decisions:
- issue: Формально неопределённое אֱלָהּ в монотеистическом контексте
  choice: есть на небесах Бог
  alternative: есть Бог на небесах; есть на небесах некий бог; есть Бог небесный
  rationale: Порядок слов позволяет сохранить экзистенциальный и формально неопределённый характер выражения без неестественного и богословски вводящего в заблуждение русского «некий Бог». Заглавная буква отражает ясную контекстуальную отнесённость к истинному Богу.
- issue: Временное выражение בְּאַחֲרִית יוֹמַיָּא
  choice: в последние дни
  alternative: в грядущие дни; в конце дней
  rationale: Выбор сохраняет возможный эсхатологический оттенок, но не уточняет, к какой именно схеме или периоду относится пророчество.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис сделан ясным для широкого читателя; арамейские идиомы, которые при буквальном воспроизведении звучали бы неестественно, переданы функционально и отмечены в сносках.
