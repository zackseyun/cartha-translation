base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/014.yaml
  text: Then Daniel answered Arioch[a], the chief of the king’s executioners, with counsel and discretion—the one who had gone out to kill the wise men of Babylon.
translation:
  language: ru
  text: Тогда Даниил благоразумно и рассудительно ответил Ариоху[a], начальнику царских палачей, который вышел убивать вавилонских мудрецов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальнику царской стражи». Арамейский титул буквально означает «начальник убивающих» и при царском дворе мог обозначать начальника палачей или стражи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер обозначает следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: הֲתִיב
  choice: ответил
  rationale: Глагол обычно вводит словесный ответ; русский глагол сохраняет повествовательный смысл и умеренно высокий регистр.
- source_word: עֵטָא וּטְעֵם
  choice: благоразумно и рассудительно
  rationale: 'Сочетание существительных описывает разумный, взвешенный характер ответа. Наречная передача естественна по-русски и сохраняет два смысловых компонента: мудрую осмотрительность и здравое суждение.'
- source_word: לְאַרְיוֹךְ
  choice: Ариоху
  rationale: Личное имя передано традиционной русской транслитерацией и поставлено в дательный падеж по управлению глагола «ответил».
- source_word: רַב טַבָּחַיָּא דִּי מַלְכָּא
  choice: начальнику царских палачей
  rationale: Буквально титул связан с главой тех, кто убивает; в данном контексте непосредственной казни мудрецов «палачи» яснее всего передаёт функцию, а примечание сохраняет возможное придворно-военное значение.
- source_word: דִּי נְפַק
  choice: который вышел
  rationale: Относительное предложение характеризует Ариоха. Простое прошедшее время естественно в русском повествовании и не требует явно выраженного предпрошедшего времени.
- source_word: לְקַטָּלָה
  choice: убивать
  rationale: Инфинитив выражает цель или поручение; несовершенный вид уместен применительно к группе намеченных жертв и не смягчает суровость указа.
- source_word: לְחַכִּימֵי בָּבֶל
  choice: вавилонских мудрецов
  rationale: Естественная русская передача обозначения придворной группы и её принадлежности к Вавилону.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством придворного повествования. Наречная конструкция «благоразумно и рассудительно ответил» звучит естественнее буквального «ответил советом и рассудительностью», не устраняя двухчастность арамейского выражения. Слово «палачи» выбрано по ближайшему контексту, а альтернативное понимание титула вынесено в примечание.
