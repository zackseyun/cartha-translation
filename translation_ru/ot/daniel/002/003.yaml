  text: And the king said to them[a], “I have dreamed a dream[c][b], and my spirit is troubled to know the dream.”
translation:
  language: ru
  text: 'И царь сказал им: «Мне приснился сон[a], и дух мой встревожен[b] желанием узнать этот сон[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «сон я видел во сне»; в еврейском тексте существительное и глагол однокоренные, что усиливает выражение.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «дух мой встревожился» или «дух мой в смятении».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «узнать этот сон» может относиться к его содержанию, смыслу или к тому и другому; еврейский текст здесь не уточняет.
    reason: ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם הַמֶּלֶךְ
  choice: И царь сказал им
  rationale: Обычная повествовательная конструкция с wayyiqtol передана естественной русской связкой «И»; адресат и определённость существительного сохранены.
- source_word: חֲלוֹם חָלָמְתִּי
  choice: Мне приснился сон
  rationale: Естественная русская конструкция сохраняет родство слов «приснился» и «сон», отражая еврейское сочетание однокоренных глагола и дополнения без тяжеловесной буквальности.
- source_word: וַתִּפָּעֶם
  choice: встревожен
  rationale: Глагол обозначает внутреннее смятение или возбуждение. Настоящее состояние уместно в прямой речи царя и не ослабляет эмоциональной силы исходного выражения.
- source_word: רוּחִי
  choice: дух мой
  rationale: Сохраняется исходное антропологическое слово רוּחַ и несколько приподнятый порядок слов; перевод не сводит его без необходимости к «разуму» или просто к местоимению «я».
- source_word: לָדַעַת אֶת־הַחֲלוֹם
  choice: я хочу узнать этот сон
  rationale: Русская формулировка естественно выражает направленность состояния, обозначенную инфинитивом לָדַעַת, и сохраняет широкое значение «узнать», не решая, идёт ли речь о содержании сна, его смысле или о том и другом.
theological_decisions:
- issue: Что именно царь желает узнать о сне
  choice: Сохранено широкое выражение «узнать этот сон»
  alternative: «узнать значение сна» или «вспомнить сон»
  rationale: Еврейский текст здесь не называет прямо ни истолкование, ни припоминание. Более конкретный перевод преждевременно разрешил бы повествовательную и богословскую напряжённость контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «дух мой» сохраняет достоинство прямой речи, а двоеточие делает связь между тревогой и желанием узнать сон ясной без чрезмерного истолкования.
