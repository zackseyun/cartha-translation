base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/043.yaml
  text: As you saw the iron mixed with clay[a], they will mix themselves with the seed of man, but they will not hold together, this one with that one[c][b], just as iron does not mix with pottery.
translation:
  language: ru
  text: И как ты видел железо, смешанное с глиной, так они смешаются с семенем человека[a], но не соединятся одно с другим[b], как железо не смешивается с керамикой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с семенем человека». Это выражение нередко понимают как указание на смешанные браки, однако арамейский текст сам по себе не уточняет его смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «это с этим»; возможный перевод: «друг с другом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «с глиной», «с глиняным изделием». Арамейское слово может обозначать керамику, глиняное изделие или керамический материал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַיְתָ
  choice: ты видел
  rationale: Прямая передача арамейской формы 2-го лица мужского рода единственного числа, обращённой к Навуходоносору.
- source_word: פַּרְזְלָא
  choice: железо
  rationale: Обычное значение слова; сохраняет образ истукана в контексте главы.
- source_word: מְעָרַב בַּחֲסַף טִינָא
  choice: смешанное с глиной
  rationale: Естественно передаёт материальный образ смеси железа и глины; определённость конструкции отражена контекстом, без тяжеловесного артиклевого эквивалента.
- source_word: מִתְעָרְבִין לֶהֱוֺן
  choice: смешаются
  rationale: Возвратная форма русского глагола естественно передаёт рефлексивно-медиальное значение арамейской конструкции.
- source_word: בִּזְרַע אֲנָשָׁא
  choice: с семенем человеческим
  rationale: Сохраняет буквальный образ «семени человека» и намеренную неясность выражения, но звучит по-русски литературно.
- source_word: דָּבְקִין
  choice: соединятся
  rationale: Передаёт значение сцепления, прилипания и устойчивого единства в данном образе.
- source_word: דְּנָה עִם דְּנָה
  choice: одно с другим
  rationale: Естественный русский эквивалент взаимно-распределительного выражения «это с этим».
- source_word: חַסְפָּא
  choice: глиняный сосуд
  rationale: Слово может обозначать керамику или глиняное изделие; такой перевод сохраняет отличие от более общего «глина» в первой части стиха.
theological_decisions:
- issue: К кому относится «они» и что означает смешение с человеческим семенем
  choice: Сохранить неопределённое «они» и буквальный образ «с семенем человеческим»
  alternative: «Они будут вступать в смешанные браки» или иная конкретная историческая идентификация сторон
  rationale: Арамейский текст не поясняет здесь референт местоимения и допускает несколько толкований. Перевод не должен превращать одно из них в сам текст.
- issue: Характер отсутствия единства
  choice: «не соединятся одно с другим»
  alternative: «не будут держаться вместе» или «не прилипнут друг к другу»
  rationale: Выбранная формулировка сохраняет физический образ несовместимых материалов и применима к символическим сторонам, не уточняя их природу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка приподнят, но понятен; тёмное выражение о «семени» не истолковано внутри основного текста. Конструкция «И как… так…» естественно связывает увиденный образ с его объяснением.
