base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/004.yaml
  text: 'Then the Chaldeans spoke to the king in Aramaic: “O king[a], live forever! Tell the dream to your servants[c][b], and we will declare the interpretation.”'
translation:
  language: ru
  text: Тогда халдеи сказали царю по-арамейски:[a] «Царь, живи вовеки![b] Расскажи сон своим слугам, и мы сообщим[c] его истолкование».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: С этого места начинается арамейский текст, который продолжается до Дан. 7:28.
    reason: cross_reference
  - marker: b
    text: 'Или: «пусть царь живёт вовеки».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дадим знать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Тогда … сказали
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַכַּשְׂדִּים
  choice: халдеи
  rationale: Сохранено этническое и придворное наименование группы, без пояснительной замены на «астрологи» или «мудрецы».
- source_word: אֲרָמִית
  choice: по-арамейски
  rationale: Кратко и естественно обозначает язык последующей речи и переход к арамейской части книги.
- source_word: מַלְכָּא לְעָלְמִין חֱיִי
  choice: Царь, живи вовеки!
  rationale: Сохранена традиционная придворная формула-пожелание и её торжественный тон.
- source_word: אֱמַר חֶלְמָא
  choice: Расскажи сон
  rationale: В данном контексте глагол означает изложить содержание сна; «расскажи» звучит по-русски естественнее буквального «скажи».
- source_word: לְעַבְדָךְ
  choice: своим слугам
  rationale: В придворной речи это почтительное самоназвание советников; «слуги» уместнее, чем обозначение юридического рабства.
- source_word: וּפִשְׁרָא
  choice: его истолкование
  rationale: «Истолкование» сохраняет специальное значение термина применительно к снам и видениям; местоимение естественно связывает его с упомянутым сном.
- source_word: נְחַוֵּא
  choice: мы сообщим
  rationale: Передаёт каузативный смысл «дать узнать, сделать известным» и естественно сочетается с «истолкованием».
