  text: עָנֵה֩ מַלְכָּ֨/א לְ/דָנִיֵּ֜אל וְ/אָמַ֗ר מִן קְשֹׁט֙ דִּ֣י אֱלָהֲ/כ֗וֹן ה֣וּא אֱלָ֧הּ אֱלָהִ֛ין וּ/מָרֵ֥א מַלְכִ֖ין וְ/גָלֵ֣ה רָזִ֑ין דִּ֣י יְכֵ֔לְתָּ לְ/מִגְלֵ֖א רָזָ֥/ה דְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/047.yaml
  text: The king answered Daniel and said[a], “Truly, your God is God of gods and Lord of kings, and a revealer of mysteries, because you were able to reveal this mystery.”
translation:
  language: ru
  text: 'Царь ответил Даниилу и сказал: «Воистину, ваш Бог — Бог богов, Владыка царей и Открывающий тайны, раз ты смог открыть эту тайну».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: ответил ... и сказал
  rationale: Сохранена обычная арамейская повествовательная формула с обоими глаголами; по-русски она звучит естественно в библейском повествовании.
- source_word: מִן קְשֹׁט
  choice: Воистину
  rationale: Передаёт усилительное значение «истинно, несомненно» и соответствует возвышенной царской речи, оставаясь понятным современному читателю.
- source_word: אֱלָהֲכוֹן
  choice: ваш Бог
  rationale: Арамейская форма второго лица множественного числа указывает на Бога Даниила и его товарищей; «ваш» точно сохраняет это число.
- source_word: אֱלָהּ אֱלָהִין
  choice: Бог богов
  rationale: Конструкция выражает верховенство Бога Даниила над богами, но сама по себе не утверждает, что царь уже отверг существование или почитание всех иных богов.
- source_word: וּמָרֵא מַלְכִין
  choice: Владыка царей
  rationale: «Владыка» естественно передаёт титульное значение מָרֵא («господин, владыка») и сохраняет возвышенный регистр.
- source_word: וְגָלֵה רָזִין
  choice: и Открывающий тайны
  rationale: Причастная конструкция характеризует Бога по Его действию; субстантивированное причастие сохраняет предикативную и титульную силу выражения.
- source_word: רָזִין / רָזָה
  choice: тайны / тайну
  rationale: В книге Даниила слово обозначает сокрытое, становящееся известным через божественное откровение. «Тайна» сохраняет тематическую лексику лучше, чем более бытовое «секрет».
- source_word: דִּי יְכֵלְתָּ
  choice: раз ты смог
  rationale: Дִּי вводит основание царского признания. «Раз» естественно выражает причинную связь в современной русской речи, а «смог» передаёт засвидетельствованную способность Даниила.
- source_word: לְמִגְלֵא רָזָה דְנָה
  choice: открыть эту тайну
  rationale: Повтор «открывающий — открыть» сохраняет корневую связь с двумя употреблениями גלה в арамейском тексте.
theological_decisions:
- issue: Подразумевает ли признание Навуходоносора полноценное обращение к единобожию
  choice: 'Сохранено сильное признание верховенства Бога Даниила: «Бог богов, Владыка царей».'
  alternative: «Только ваш Бог есть Бог» либо ослабленное «один из высших богов».
  rationale: Арамейский текст ясно утверждает превосходство Бога Даниила, но не говорит прямо, что царь отверг всех прочих богов. Перевод не разрешает эту богословскую напряжённость за рамками текста.
- issue: Кто непосредственно открывает тайну
  choice: Бог назван «Открывающим тайны», тогда как о Данииле сказано, что он «смог открыть эту тайну».
  alternative: Перефразировать так, будто Даниил раскрыл тайну исключительно собственной силой, или заменить его действие пассивной конструкцией.
  rationale: Текст одновременно приписывает откровение Богу и фактическое раскрытие Даниилу как Его посреднику; эта взаимосвязь сохранена без поясняющей вставки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксический параллелизм и повтор корня «открыть» сохранены; архаизирующее «воистину» употреблено точечно как естественный эквивалент эмфатической формулы.
