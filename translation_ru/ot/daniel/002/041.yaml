base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/041.yaml
  text: And as you saw the feet and toes[a], partly of potter’s clay and partly of iron, the kingdom will be divided; yet some of the firmness of iron will be in it[b], just as you saw the iron mixed with clay mud.
translation:
  language: ru
  text: А то, что ты видел ступни и пальцы ног — частью из горшечной глины, частью из железа, — означает, что царство будет разделено; однако в нём будет некоторая доля прочности железа[a], подобно тому как ты видел железо, смешанное с глинистой массой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «некоторая сила железа» либо «некоторая устойчивость железа». Арамейское слово может означать прочность, силу или устойчивость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с сырой глиной». В арамейском здесь соединены слова, обозначающие глину и грязь, что подчёркивает непрочность смеси.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלַיָּא וְאֶצְבְּעָתָא
  choice: ступни и пальцы ног
  rationale: В связи с пальцами רַגְלַיָּא обозначает именно ступни статуи; уточнение «ног» естественно и устраняет возможную неясность.
- source_word: מנ/הון ... ו/מנ/הון
  choice: частью ... частью
  rationale: Передаёт распределение двух материалов между ступнями и пальцами естественным русским оборотом.
- source_word: חֲסַף דִּי פֶחָר
  choice: горшечная глина
  rationale: Сохраняет указание и на материал, и на его связь с ремеслом горшечника.
- source_word: פַּרְזֶל
  choice: железо
  rationale: Прямой и общеупотребительный эквивалент названия металла.
- source_word: מַלְכוּ פְלִיגָה תֶּהֱוֵה
  choice: царство будет разделено
  rationale: Передаёт состояние внутреннего разделения царства без добавления толкования о его исторической идентичности.
- source_word: וּמִן נִצְבְּתָא דִי פַרְזְלָא לֶהֱוֵא בַהּ
  choice: в нём останется некоторая крепость железа
  rationale: נִצְבְּתָא может выражать крепость, силу или устойчивость; «крепость» сохраняет конкретную связь с образом железа, а «некоторая» передаёт частичность וּמִן.
- source_word: כָּל־קֳבֵל דִּי
  choice: подобно тому как
  rationale: В данном объяснении оборот соотносит истолкование с увиденным образом; перевод сохраняет сравнительный оттенок, не превращая его однозначно в причинный.
- source_word: מְעָרַב בַּחֲסַף טִינָא
  choice: смешанное с глинистой грязью
  rationale: «Смешанное» точно передаёт причастие, а «глинистая грязь» отражает сочетание двух арамейских обозначений глины и грязи, не сводя его к одному слову.
theological_decisions:
- issue: Характер разделённого царства
  choice: Без исторической или конфессиональной идентификации царства
  alternative: Назвать конкретную империю либо политический строй
  rationale: Стих описывает свойства символизируемого царства, но сам по себе не называет его исторического соответствия.
- issue: Значение כָּל־קֳבֵל דִּי
  choice: Сравнительное «подобно тому как»
  alternative: Причинное «потому что»
  rationale: Контекст допускает оттенок основания, однако сравнительная формулировка сохраняет связь между видением и истолкованием и не устраняет возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «А то, что ты видел...» естественно связывает толкование с предшествующим видением; тире выделяют описание состава ступней и пальцев. Термины оставлены конкретными и образными, без внесения историко-догматического толкования.
