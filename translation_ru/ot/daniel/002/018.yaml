base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/018.yaml
  text: and to seek mercy from before the God of heaven concerning this mystery[a], so that Daniel and his companions might not perish with the rest of the wise men of Babylon.
translation:
  language: ru
  text: и просить милости у Бога небес об этой тайне[a], чтобы Даниил и его товарищи не погибли вместе с остальными мудрецами Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «секрет». Арамейское слово означает сокрытое дело, для понимания которого необходимо откровение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַחֲמִין לְמִבְעֵא
  choice: и просить милости
  rationale: Множественное רַחֲמִין здесь идиоматически обозначает милость или сострадание, а инфинитив выражает цель данного ранее наставления. «Просить милости» естественно передаёт молитвенное обращение.
- source_word: מִן קֳדָם אֱלָהּ שְׁמַיָּא
  choice: у Бога небес
  rationale: Оборот מִן קֳדָם буквально связан с пребыванием «перед» чьим-либо лицом, но в контексте просьбы естественно передаётся русской конструкцией «просить у». Титул «Бог небес» сохранён.
- source_word: עַל רָזָה דְּנָה
  choice: о этой тайне
  rationale: עַל в данном контексте означает «о, относительно», а רָז обозначает сокрытое дело, которое нуждается в божественном откровении.
- source_word: דִּי לָא יְהֹבְדוּן
  choice: чтобы ... не погибли
  rationale: Сочетание דִּי с отрицанием и глагольной формой выражает цель или желаемый результат. «Не погибли» естественно передаёт каузативный глагол со значением уничтожения, не уточняя способ исполнения приговора.
- source_word: וְחַבְרוֹהִי
  choice: и его товарищи
  rationale: Слово обозначает близких соратников Даниила в повествовании; «товарищи» ясно и нейтрально для современного русского языка.
- source_word: עִם שְׁאָר חַכִּימֵי בָבֶל
  choice: вместе с остальными мудрецами Вавилона
  rationale: Формулировка сохраняет включение Даниила и его товарищей в более широкую группу придворных мудрецов, которой угрожала гибель.
theological_decisions:
- issue: Передача רָז в придворном повествовании Даниила
  choice: тайна
  alternative: секрет
  rationale: «Тайна» передаёт не просто скрываемую людьми информацию, а сокрытое дело, недоступное человеческой мудрости и требующее откровения от Бога, не навязывая при этом позднейшего специального богословского смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «и» и инфинитивная конструкция сохранены как продолжение наставления из предыдущего стиха. Буквальное «из-пред Бога» заменено естественным русским управлением «просить у Бога».
