  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר מִן יַצִּיב֙ יָדַ֣ע אֲנָ֔ה דִּ֥י עִדָּנָ֖/א אַנְתּ֣וּן זָבְנִ֑ין כָּ/ל קֳבֵל֙ דִּ֣י חֲזֵית֔וֹן דִּ֥י אַזְדָּ֖א מִנִּ֥/י מִלְּתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/008.yaml
  text: The king answered and said[a], “I know for certain that you are trying to gain time, because you have seen that the matter has gone from me.”
translation:
  language: ru
  text: 'Царь ответил и сказал: «Я доподлинно знаю, что вы стараетесь выиграть время, потому что увидели, что дело ушло от меня[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово ушло от меня», «дело ускользнуло от меня»; возможно также: «моё повеление непреложно». Арамейская фраза кратка и в этом контексте понимается по-разному.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן יַצִּיב
  choice: доподлинно
  rationale: Передаёт наречное значение уверенности — «несомненно, с полной уверенностью» — естественно и выразительно для современного литературного русского языка.
- source_word: יָדַע אֲנָה
  choice: я знаю
  rationale: Прямое соответствие глаголу знания в первом лице; сохраняет категоричность заявления царя.
- source_word: עִדָּנָא
  choice: время
  rationale: Существительное обозначает время или срок; контекстуальный оттенок промедления выражен сочетанием «выиграть время».
- source_word: אַנְתּוּן זָבְנִין
  choice: вы стараетесь выиграть
  rationale: Буквально причастие связано с покупкой, но сочетание означает стремление выиграть время. Такой перевод естественен по-русски и сохраняет обвинительный смысл.
- source_word: כָּל־קֳבֵל דִּי
  choice: потому что
  rationale: Ясно передаёт причинную связь, вводимую арамейским оборотом.
- source_word: חֲזֵיתוֹן
  choice: увидели
  rationale: Передаёт перфект второго лица множественного числа без добавления толкования «поняли».
- source_word: אַזְדָּא מִנִּי
  choice: ушло от меня
  rationale: Формально близко к арамейскому выражению и намеренно не уточняет, забыл ли царь сон или говорит о непреложности своего слова.
- source_word: מִלְּתָא
  choice: дело
  rationale: Слово может означать дело, слово, высказывание или повеление. «Дело» сохраняет широту значения и не разрешает контекстуальную неоднозначность.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: царь ответил и сказал
  rationale: Сохраняет оба глагола традиционной арамейской повествовательной формулы, оставаясь понятным в современном русском тексте.
theological_decisions:
- issue: Неоднозначность מִלְּתָא / אַזְדָּא מִנִּי
  choice: дело ушло от меня
  alternative: слово ушло от меня; дело ускользнуло от меня; моё повеление непреложно
  rationale: Арамейская фраза допускает понимание как утраты царём содержания сна, так и твёрдости уже высказанного решения. Основной текст сохраняет буквальную неоднозначность, а примечание обозначает главные варианты, не отдавая предпочтения конфессиональному или гармонизирующему толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской повествовательной формулой. Выражение «дело ушло от меня» сохранено несколько необычным, чтобы не устранять реальную неоднозначность арамейского текста.
