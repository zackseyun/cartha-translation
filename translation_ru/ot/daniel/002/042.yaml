base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/042.yaml
  text: And as the toes of the feet were partly iron and partly clay[a], so part of the kingdom will be strong[b], and part of it will be brittle.
translation:
  language: ru
  text: И как пальцы ног были отчасти железными, отчасти глиняными[a], так и царство отчасти будет крепким, а отчасти хрупким[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из глиняного (керамического) изделия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ломким», «непрочным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְבְּעָת רַגְלַיָּא
  choice: пальцы ног
  rationale: Естественно передаёт арамейское сочетание и сохраняет связь с образом ног истукана.
- source_word: מנ/הון ... ו/מנ/הון
  choice: частью ... частью
  rationale: Повторённая конструкция буквально указывает на доли состава; русское «частью… частью» ясно передаёт смешанный состав.
- source_word: פַּרְזֶל
  choice: железо
  rationale: Обычное и контекстуально точное обозначение металла в образе истукана.
- source_word: חֲסַף
  choice: глина
  rationale: В контексте противопоставления железу обозначает глиняный или керамический материал; «глина» наиболее естественно продолжает образ главы.
- source_word: מִן קְצָת
  choice: частью
  rationale: Передаёт частичный, распределительный характер признака царства без излишнего уточнения структуры его частей.
- source_word: מַלְכוּתָא
  choice: царство
  rationale: Стандартный и ясный русский эквивалент обозначенного во сне политического владычества.
- source_word: תֶּהֱוֵה
  choice: будет
  rationale: Передаёт предсказанное будущее состояние царства современным русским языком.
- source_word: תַקִּיפָה
  choice: крепким
  rationale: В паре с железом выражает прочность и силу; «крепким» создаёт точный контраст с «хрупким».
- source_word: וּ/מִנַּהּ
  choice: а частью
  rationale: Суффикс относится к царству, а русская конструкция естественно сохраняет распределительный контраст.
- source_word: תְבִירָה
  choice: хрупким
  rationale: Передаёт подверженность разрушению или ломкости, уместную для контраста железа и глины, не утверждая однозначно, что царство уже разбито.
