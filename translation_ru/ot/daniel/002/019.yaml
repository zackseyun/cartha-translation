  text: אֱדַ֗יִן לְ/דָנִיֵּ֛אל בְּ/חֶזְוָ֥/א דִֽי לֵילְיָ֖/א רָזָ֣/ה גֲלִ֑י אֱדַ֨יִן֙ דָּֽנִיֵּ֔אל בָּרִ֖ךְ לֶ/אֱלָ֥הּ שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/019.yaml
  text: Then the mystery was revealed to Daniel in a vision of the night[c][b][a]. Then Daniel blessed the God of heaven.
translation:
  language: ru
  text: Тогда Даниилу в ночном видении[a] была открыта тайна[b]. Тогда Даниил благословил[c] Бога небес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в видении ночи»; возможно также: «в видении ночью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сокровенное».'
    reason: lexical_alternative
  - marker: c
    text: То есть восхвалил.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер обозначает последовательность событий. Повтор сохранён в обеих частях стиха.
- source_word: בְּחֶזְוָא דִי לֵילְיָא
  choice: в ночном видении
  rationale: Естественная русская передача выражения «в видении ночи», сохраняющая указание и на видение, и на ночное время.
- source_word: רָזָה
  choice: тайна
  rationale: В контексте книги Даниила слово обозначает сокрытое содержание сна царя и его смысл, которые становятся известны через Божье откровение.
- source_word: גֲלִי
  choice: была открыта
  rationale: Страдательная форма сохраняет мысль о раскрытии прежде сокрытого, не называя прямо действующее лицо, как и арамейский текст.
- source_word: בָּרִךְ
  choice: благословил
  rationale: Прямая передача глагола ברך применительно к Богу; сохраняет библейскую формулу, тогда как «прославил» или «восхвалил» были бы контекстуальными толкованиями.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: Бога небес
  rationale: Устойчивый библейский титул, близко передающий определённое арамейское выражение и множественную форму «небеса».
- source_word: דָנִיֵּאל
  choice: Даниил
  rationale: Традиционная и общепринятая русская форма личного имени.
theological_decisions:
- issue: Характер сообщения сокрытого Даниилу
  choice: тайна была открыта
  alternative: секрет был раскрыт
  rationale: «Тайна» и «открыта» сохраняют язык божественного откровения, но страдательная конструкция не добавляет прямо названного деятеля, которого в стихе нет.
- issue: Ответ Даниила Богу в глаголе בָּרִךְ
  choice: Даниил благословил Бога небес
  alternative: Даниил восхвалил Бога небес
  rationale: «Благословил» точнее сохраняет исходный глагол и богословское напряжение библейской речи о человеке, благословляющем Бога; возможное значение «восхвалил» отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Порядок слов сделан естественным для русского языка; повтор «Тогда» и пассивная конструкция исходного текста сохранены. Все варианты в сносках привязаны к соответствующим словам основного текста.
