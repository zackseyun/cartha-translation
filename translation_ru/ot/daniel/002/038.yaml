  text: וּ/בְ/כָל דִּ֣י דארין בְּֽנֵי אֲ֠נָשָׁ/א חֵיוַ֨ת בָּרָ֤/א וְ/עוֹף שְׁמַיָּ/א֙ יְהַ֣ב בִּ/ידָ֔/ךְ וְ/הַשְׁלְטָ֖/ךְ בְּ/כָלְּ/ה֑וֹן אַנְתְּה ה֔וּא רֵאשָׁ֖/ה דִּ֥י דַהֲבָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/038.yaml
  text: And wherever the children of men dwell[a], the beasts of the field and the birds of the heavens—he has given them into your hand and made you ruler over all of them[c][b]. You are the head of gold.
translation:
  language: ru
  text: Людей, полевых зверей и птиц небесных — где бы они ни обитали — Он отдал в твою руку и поставил тебя владыкой над всеми. Ты — голова из золота.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל דִּי דארין
  choice: И где бы ни жили
  rationale: 'Арамейская конструкция имеет обобщённо-местное значение: «везде, где» или «где бы ни». Выбран естественный для современного русского языка оборот.'
- source_word: בְּנֵי אֲנָשָׁא
  choice: люди
  rationale: Буквально «сыны человеческие», но в арамейском это обычное обозначение людей вообще. «Люди» точно передаёт смысл и не создаёт ошибочного впечатления, будто речь идёт только о мужчинах; буквальный образ отмечен в сноске.
- source_word: חֵיוַת בָּרָא
  choice: полевых зверей
  rationale: Сочетание обозначает животных открытой местности. «Полевые звери» сохраняет конкретный образ оригинала и соответствует возвышенному повествовательному регистру.
- source_word: וְעוֹף שְׁמַיָּא
  choice: птиц небесных
  rationale: Буквально «птиц небес». Формулировка сохраняет образ оригинала; более обыденный вариант приведён в сноске.
- source_word: יְהַב בִּידָךְ
  choice: отдал в твою руку
  rationale: Сохранена метафора руки как власти и распоряжения. Глагол передан совершенным видом как завершённое дарование власти.
- source_word: וְהַשְׁלְטָךְ
  choice: и поставил тебя владыкой
  rationale: Каузативная форма означает, что царь был наделён правом властвовать. «Поставил тебя владыкой» передаёт как назначение, так и господство.
- source_word: בְּכָלְּהוֹן
  choice: над всеми ими
  rationale: Местоименный суффикс отсылает ко всем перечисленным ранее живым существам. Формулировка не сужает возможный объём отсылки.
- source_word: אַנְתְּה הוּא רֵאשָׁה דִּי דַהֲבָא
  choice: Ты — голова из золота
  rationale: Прямое отождествление Навуходоносора с головой истукана сохранено без замены предметного образа прилагательным «золотая».
theological_decisions:
- issue: Не названный прямо субъект глаголов «отдал» и «поставил»
  choice: Передать подразумеваемый субъект местоимением «Он», не добавляя в основной текст слово «Бог».
  alternative: «Бог отдал… и поставил…»
  rationale: В предыдущем стихе субъектом назван Бог небесный, тогда как здесь арамейский текст не повторяет Его имени. Местоимение сохраняет связность контекста и не вносит отсутствующего в стихе существительного.
- issue: Объём выражения בְּנֵי אֲנָשָׁא
  choice: Передать как «люди», указав буквальный образ в сноске.
  alternative: «сыны человеческие»
  rationale: Выражение относится к человеческим существам вообще. Современное «люди» сохраняет универсальный смысл, тогда как буквальная формула в русском может быть понята как относящаяся лишь к мужчинам.
- issue: К кому относится «над всеми ими»
  choice: Сохранить широкую местоименную отсылку без поясняющего сужения.
  alternative: «над всеми зверями и птицами»
  rationale: Арамейское местоимение может охватывать весь предшествующий перечень, включая людей, зверей и птиц. Явное ограничение животными преждевременно разрешило бы синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Архаизмы сведены к минимуму; метафоры «в твою руку», «владыкой» и «голова из золота» сохранены как значимые образы оригинала.
