base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/046.yaml
  text: Then King Nebuchadnezzar fell on his face and paid homage to Daniel[c][b][a], and he commanded that an offering and incense be offered to him.
translation:
  language: ru
  text: Тогда царь Навуходоносор пал ниц и поклонился Даниилу[a]. Он повелел совершить для него приношение[b] и воскурить благовония[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «простёрся перед Даниилом». Арамейский глагол может обозначать глубокое почтительное поклонение, а в некоторых контекстах — культовое поклонение.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «дар» или «хлебное приношение».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «приятные ароматы» или «благоухания».'
    reason: lexical_alternative
  - marker: d
    text: Глагол в конце фразы точнее означает «совершить возлияние» или «излить»; здесь он употреблён в распоряжении о названных приношениях.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: מַלְכָּא נְבוּכַדְנֶצַּר
  choice: царь Навуходоносор
  rationale: Титул и имя переданы в обычном для современного русского языка порядке.
- source_word: נְפַל עַל אַנְפּוֹהִי
  choice: пал ниц
  rationale: Устойчивое русское выражение сохраняет зримый образ падения лицом к земле и соответствует возвышенному повествовательному регистру.
- source_word: סְגִד
  choice: поклонился
  rationale: Глагол обозначает простирание или глубокое почтительное поклонение. Выбор сохраняет сильный жест почтения, не утверждая однозначно, что речь идёт о поклонении Даниилу как божеству.
- source_word: מִנְחָה
  choice: приношение
  rationale: Слово может обозначать дар или культовое приношение; контекст требует сохранить религиозно-обрядовый оттенок, не уточняя без достаточных оснований вид дара.
- source_word: נִיחֹחִין
  choice: благовония
  rationale: Множественное число связано с приятными, благоуханными запахами приношения; «благовония» естественно передаёт контекст воскурения, сохраняя образ запаха.
- source_word: אֲמַר לְנַסָּכָה לֵהּ
  choice: велел принести ему
  rationale: אֲמַר с инфинитивом здесь выражает распоряжение. Русская формулировка естественно охватывает оба названных предмета, тогда как значение глагола נסך, связанное с возлиянием, отмечено в сноске.
theological_decisions:
- issue: Следует ли передавать סְגִד как однозначное религиозное поклонение Даниилу
  choice: поклонился Даниилу
  alternative: поклонился Даниилу как божеству / совершил поклонение Даниилу
  rationale: Арамейский глагол допускает как почтительное простирание, так и культовое поклонение. Нейтральное «поклонился» сохраняет необычайную силу царского жеста и богословское напряжение эпизода, не объявляя Даниила божеством и не сводя поступок к обычной придворной вежливости.
- issue: Кому предназначены приношение и благовония
  choice: ему, то есть Даниилу
  alternative: Богу Даниила
  rationale: Местоименный суффикс мужского рода единственного числа грамматически отсылает к Даниилу, ближайшему названному участнику. Перевод сохраняет эту трудную формулировку и не заменяет адресата богословски мотивированным уточнением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пал ниц» сохраняет физическую выразительность оригинала, а «поклонился» и «приношение» понятны широкому читателю и не снимают неоднозначности религиозно-придворной сцены.
