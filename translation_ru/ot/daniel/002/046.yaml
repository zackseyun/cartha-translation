  to: Тогда царь Навуходоносор пал ниц и поклонился Даниилу[a]. Он повелел совершить для него приношение[b] и воскурить благовония[c][d].
  rationale: Изменена только заключительная часть, чтобы русский текст обозначал ритуальное совершение приношения и воскурение благовоний, а не простое принесение предметов. Адресат «для него» сохранён, как и неоднозначность жеста царя перед Даниилом. Сноска о специальном значении глагола возлияния сохранена и привязана к заключительной формуле.
