    rationale: Вариант «принести ему приношение и благовония» может означать лишь доставить два предмета. Контекст מִנְחָה, נִיחֹחִין и לְנַסָּכָה требует по возможности передать совершение приношения и воскурение/благоухание; специальный оттенок «возлияния» следует оставить в сноске.
  - severity: low
    issue: Сноска a предлагает стилистически тяжёлое «совершил поклонение Даниилу».
    rationale: Для современного русского естественнее «простёрся перед Даниилом»; альтернативу с культовым значением лучше сформулировать как возможное «поклонение» без доктринального утверждения.
