  yaml_path: translation/ot/daniel/002/036.yaml
  text: This was the dream[a], and we will tell its interpretation before the king.
translation:
  language: ru
  text: Вот сон[a], и его истолкование мы изложим перед царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот сон; теперь мы изложим перед царём его истолкование». Арамейский текст допускает несколько различную пунктуацию и передачу видо-временного оттенка без изменения общего смысла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Вот этот
  rationale: Указательное слово отсылает к только что рассказанному сну; сочетание «вот этот» естественно завершает его изложение и вводит переход к истолкованию.
- source_word: חֶלְמָא
  choice: сон
  rationale: Определённость арамейской формы передана русским указательным сочетанием «этот сон».
- source_word: וּפִשְׁרֵהּ
  choice: и его истолкование
  rationale: Слово פִשְׁרָא в книге Даниила обозначает истолкование сна или тайны; местоимение «его» относится ко сну.
- source_word: נֵאמַר
  choice: мы изложим
  rationale: Форма первого лица множественного числа имеет здесь значение предстоящего сообщения. «Изложим» естественно сочетается с истолкованием и сохраняет множественное число исходного текста.
- source_word: קֳדָם
  choice: перед
  rationale: Передаёт пространственно-придворное значение «перед, в присутствии».
- source_word: מַלְכָּא
  choice: царём
  rationale: Определённый арамейский существительный обозначает известного из контекста царя; собственное имя в перевод не добавляется.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Сохранено исходное «мы», не уточняя, включает ли Даниил своих товарищей или говорит как их представитель.
