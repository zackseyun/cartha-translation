  variant: modern literary Russian
source:
  edition: WLC
  text: וּֽ/בְ/יוֹמֵי/ה֞וֹן דִּ֧י מַלְכַיָּ֣/א אִנּ֗וּן יְקִים֩ אֱלָ֨הּ שְׁמַיָּ֤/א מַלְכוּ֙ דִּ֤י לְ/עָלְמִין֙ לָ֣א תִתְחַבַּ֔ל וּ/מַ֨לְכוּתָ֔/ה לְ/עַ֥ם אָחֳרָ֖ן לָ֣א תִשְׁתְּבִ֑ק תַּדִּ֤ק וְ/תָסֵיף֙ כָּל אִלֵּ֣ין מַלְכְוָתָ֔/א וְ/הִ֖יא תְּק֥וּם לְ/עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/044.yaml
  text: And in the days of those kings[a], the God of heaven will set up a kingdom that will never be destroyed, and the kingdom will not be left to another people. It will crush and put an end to all these kingdoms[b], and it will stand forever.
translation:
  language: ru
  text: И во дни тех царей[a] Бог небес воздвигнет царство, которое никогда не будет разрушено; это царство не будет передано другому народу. Оно сокрушит и положит конец всем этим царствам[b], а само будет стоять вечно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Те цари» — цари или царства, представленные во сне Навуходоносора; толкователи по-разному определяют их точное историческое соответствие.
    reason: alternative_reading
  - marker: b
    text: Арамейский глагол, переведённый как «сокрушит», также может означать «раздробит» или «разобьёт на части».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹמֵיהוֹן דִּי מַלְכַיָּא אִנּוּן
  choice: И во дни тех царей
  rationale: Сохраняет повествовательную связь, временное значение и анафорическую отсылку к ранее представленным царям, не уточняя спорный исторический референт.
- source_word: יְקִים
  choice: воздвигнет
  rationale: Передаёт значение учреждения или установления царства и сохраняет возвышенный, но понятный библейский регистр.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: Бог небес
  rationale: Близко передаёт устойчивый арамейский титул и естественно звучит в русском библейском стиле.
- source_word: מַלְכוּ דִּי לְעָלְמִין לָא תִתְחַבַּל
  choice: царство, которое никогда не будет разрушено
  rationale: Ясно выражает непреходящую неразрушимость, передаваемую отрицанием и לְעָלְמִין.
- source_word: וּמַלְכוּתָהּ לְעַם אָחֳרָן לָא תִשְׁתְּבִק
  choice: это царство не будет передано другому народу
  rationale: Суффикс соотнесён с только что названным царством; «передано» естественно выражает мысль, что оно не перейдёт во владение иного народа.
- source_word: תַּדִּק
  choice: сокрушит
  rationale: Передаёт сильное значение раздробления или раздавливания и соответствует образу камня в ближайшем контексте.
- source_word: וְתָסֵיף
  choice: и положит конец
  rationale: Сохраняет причинное значение «довести до конца, прекратить» и не смешивает его с предшествующим «сокрушит».
- source_word: כָּל אִלֵּין מַלְכְוָתָא
  choice: всем этим царствам
  rationale: Демонстратив указывает на царства, представленные во сне; форма «этим» уместна в непосредственном объяснении видения.
- source_word: וְהִיא תְּקוּם לְעָלְמַיָּא
  choice: а само будет стоять вечно
  rationale: «Стоять» сохраняет метафору קום, а «само» подчёркивает контраст с царствами, которым оно положит конец.
theological_decisions:
- issue: Природа установленного Богом царства
  choice: Передать его божественное происхождение, неразрушимость, победу и вечность без прямого отождествления с конкретной позднейшей богословской формулой.
  alternative: Назвать его в основном тексте мессианским царством Христа либо истолковать лишь как общее будущее Божье владычество.
  rationale: Арамейский текст утверждает, что царство установит Бог небес и что оно превзойдёт все прочие царства, но не даёт здесь развёрнутого доктринального наименования.
- issue: Референт выражения «тех царей»
  choice: Сохранить анафорическое «тех царей», не уточняя историческую идентификацию.
  alternative: Уточнить как царей разделённого царства, все четыре царства или правителей заключительной фазы.
  rationale: Фраза отсылает к царям и царствам сна, однако точный исторический объём этой отсылки остаётся предметом толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены образ «стоять вечно» и различие между «сокрушит» и «положит конец». Маркеры сносок размещены при тех выражениях, которые они поясняют; их порядок исправлен относительно консультационного английского слоя, где содержание сносок и маркеры, по-видимому, были переставлены.
