  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֔/א מֶ֖לֶךְ מַלְכַיָּ֑/א דִּ֚י אֱלָ֣הּ שְׁמַיָּ֔/א מַלְכוּתָ֥/א חִסְנָ֛/א וְ/תָקְפָּ֥/א וִֽ/יקָרָ֖/א יְהַב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/037.yaml
  text: You[a], O king, are the king of kings, to whom the God of heaven has given the kingdom, the might, the power, and the glory.
translation:
  language: ru
  text: Ты, царь, — царь царей, которому Бог небес дал царство, могущество, силу и славу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «честь» или «великолепие».'
    reason: Арамейское וִיקָרָא допускает значения славы, чести и великолепия в контексте царского величия.
lexical_decisions:
- source_word: אַנְתְּה מַלְכָּא
  choice: Ты, царь
  rationale: Независимое местоимение второго лица и определённое существительное передают прямое торжественное обращение; современное русское «Ты, царь» естественнее архаического «о царь».
- source_word: מֶלֶךְ מַלְכַיָּא
  choice: царь царей
  rationale: Конструкция сопряжённого состояния буквально выражает превосходящий царский титул и естественно передаётся устойчивым русским сочетанием.
- source_word: דִּי
  choice: которому
  rationale: Относительная частица вводит придаточное, где адресат является косвенным дополнением при глаголе «дал».
- source_word: אֱלָהּ שְׁמַיָּא
  choice: Бог небес
  rationale: Сохраняет арамейскую форму титула с морфологически множественным «небес» и звучит естественно в библейском русском регистре.
- source_word: מַלְכוּתָא
  choice: царство
  rationale: Слово охватывает царскую власть и подвластное царство; «царство» сохраняет эту широту без лишнего уточнения.
- source_word: חִסְנָא
  choice: могущество
  rationale: Передаёт силу и мощь в царском контексте и позволяет сохранить смысловое соседство, но не полное тождество со следующим существительным.
- source_word: תָקְפָּא
  choice: силу
  rationale: Обозначает силу, мощь или власть; «силу» естественно продолжает ряд и сохраняет частичное смысловое наложение оригинала.
- source_word: וִיקָרָא
  choice: славу
  rationale: В данном царском контексте слово означает славу, честь или великолепие; «слава» сохраняет возвышенный тон, а альтернативы отмечены в сноске.
- source_word: יְהַב לָךְ
  choice: дал
  rationale: Перфект Peal обозначает совершившийся дар; русское прошедшее время ясно выражает завершённое действие и не требует добавления видовой или временной нюансировки.
theological_decisions:
- issue: Источник царской власти Навуходоносора
  choice: Царство, могущество, сила и слава представлены как данные ему Богом небес.
  alternative: Царь обладает ими сам по себе благодаря завоеваниям или положению.
  rationale: Текст прямо называет Бога дающим все перечисленные признаки царского величия; перевод сохраняет это утверждение без богословского расширения.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Порядок перечисления сохранён; смысловое наложение между «могуществом» и «силой» не устранено. Тире обозначает именную связку и делает прямое обращение ясным.
