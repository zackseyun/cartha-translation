  text: וּ/בִ/שְׁנַ֣ת שְׁתַּ֗יִם לְ/מַלְכוּת֙ נְבֻֽכַדְנֶצַּ֔ר חָלַ֥ם נְבֻֽכַדְנֶצַּ֖ר חֲלֹמ֑וֹת וַ/תִּתְפָּ֣עֶם רוּח֔/וֹ וּ/שְׁנָת֖/וֹ נִהְיְתָ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/001.yaml
  text: In the second year of Nebuchadnezzar’s reign[a], Nebuchadnezzar dreamed dreams, and his spirit was troubled[c][b], and his sleep left him.
translation:
  language: ru
  text: Во второй год царствования Навуходоносора Навуходоносору снились сны, и дух его встревожился[a], и сон покинул его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух его пришёл в смятение».'
    reason: Смысл глагола допускает оттенки тревоги, возбуждения и внутреннего смятения.
  - marker: b
    text: 'Буквально: «сон его был на нём»; это необычное выражение обычно понимают в смысле: «сон покинул его».'
    reason: Примечание точно отражает форму еврейского выражения и отмечает, что его идиоматическое значение передано в основном тексте.
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁתַּיִם
  choice: Во второй год
  rationale: Начальное וּ здесь естественно передаётся без отдельного «и»; порядковое значение выражено по-русски сочетанием «во второй год».
- source_word: לְמַלְכוּת
  choice: царствования
  rationale: В данном временном обороте слово обозначает период правления царя, а не царство как территорию.
- source_word: נְבֻכַדְנֶצַּר
  choice: Навуходоносор
  rationale: Употреблена традиционная и общеизвестная русская форма имени.
- source_word: חָלַם ... חֲלֹמוֹת
  choice: снились сны
  rationale: Сохранена внутренняя фигура еврейского оборота с однокоренными понятиями, но в естественной русской конструкции.
- source_word: וַתִּתְפָּעֶם רוּחוֹ
  choice: дух его встревожился
  rationale: Передано внутреннее смятение или возбуждение; «дух» сохраняет широкий смысл רוּחַ и не сужает его до «ума».
- source_word: וּשְׁנָתוֹ נִהְיְתָה עָלָיו
  choice: сон покинул его
  rationale: Еврейский идиоматический оборот передан ясной современной фразой, означающей утрату сна.
