  variant: modern literary Russian
source:
  edition: WLC
  text: חָזֵ֣ה הֲוַ֗יְתָ עַ֠ד דִּ֣י הִתְגְּזֶ֤רֶת אֶ֨בֶן֙ דִּי לָ֣א בִ/ידַ֔יִן וּ/מְחָ֤ת לְ/צַלְמָ/א֙ עַל רַגְל֔וֹ/הִי דִּ֥י פַרְזְלָ֖/א וְ/חַסְפָּ֑/א וְ/הַדֵּ֖קֶת הִמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/034.yaml
  text: You were watching until a stone was cut out[a], not by hands[b], and it struck the statue on its feet of iron and clay and crushed them.
translation:
  language: ru
  text: Ты смотрел, пока не был отсечён камень — не руками[a]. Он ударил статую[b] по её ступням, сделанным из железа и глины, и раздробил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть без участия человеческих рук.
    reason: idiom_clarification
  - marker: b
    text: Или «изображение».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוַיְתָ
  choice: ты продолжал смотреть
  rationale: Сочетание причастия с формой глагола «быть» выражает продолженное действие в прошлом. «Продолжал смотреть» естественно передаёт длительность наблюдения.
- source_word: עַד דִּי
  choice: пока не
  rationale: Оборот обозначает предел продолжавшегося наблюдения; в современном русском повествовании естественно передаётся конструкцией «пока не».
- source_word: הִתְגְּזֶרֶת אֶבֶן
  choice: не был отсечён камень
  rationale: Глагольная форма описывает камень как отсечённый или отделённый. «Отсечён» сохраняет конкретный образ и пассивную конструкцию оригинала.
- source_word: דִּי לָא בִידַיִן
  choice: не руками
  rationale: Близкая передача арамейской идиомы сохраняет её богословски значимый образ и указывает на отсутствие человеческого участия, не уточняя прямо действующего субъекта.
- source_word: וּמְחָת
  choice: он ударил
  rationale: Подлежащее — камень; русский мужской род требует местоимения «он». Глагол «ударил» ясно и энергично передаёт столкновение.
- source_word: לְצַלְמָא
  choice: статую
  rationale: צְלֵם может означать изображение или статую. В контексте огромной человекоподобной фигуры сна слово «статуя» конкретно, нейтрально и не вносит обязательного оттенка идолопоклонства.
- source_word: עַל רַגְלֹוהִי דִּי פַרְזְלָא וְחַסְפָּא
  choice: по её ногам из железа и глины
  rationale: Переданы и точная часть фигуры — ноги, и материалы, из которых они состояли. Предлог «по» естественен при русском глаголе «ударить».
- source_word: וְהַדֵּקֶת הִמּוֹן
  choice: и раздробил их
  rationale: Глагол выражает дробление или размельчение. «Раздробил» передаёт силу и результат действия, а местоимение «их» сохраняет отнесённость к ногам.
theological_decisions:
- issue: Идиома, обозначающая нечеловеческое действие
  choice: не руками
  alternative: без участия человеческих рук
  rationale: Основной текст сохраняет образную и богословски значимую формулировку оригинала, не называя прямо того, кто отсёк камень. Сноска разъясняет подразумеваемое отсутствие человеческого действия.
- issue: Значение слова צְלֵם
  choice: статуя
  alternative: изображение
  rationale: «Статуя» соответствует видимой в сне большой фигуре и не навязывает ей культового значения; более широкое значение «изображение» сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Длительность действия передана словами «продолжал смотреть»; архаичные «изваяние» и «сокрушил» не использованы. Тире обособляет идиому «не руками» и устраняет возможное ощущение неестественного двойного отрицания в конструкции «пока не был… не руками».
