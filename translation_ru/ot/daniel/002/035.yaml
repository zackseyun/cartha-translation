  source_fidelity: 'В целом последовательность материалов, одновременность их сокрушения, образ мякины, унесённой ветром, и превращение камня в большую гору переданы верно. Однако «не осталось от них и следа» заменяет образ оригинала («для них не нашлось никакого места») более сильной русской идиомой; безопаснее сохранить исходную формулировку. «На летних гумнах» также несколько меняет отношение: мякина уподобляется мякине, происходящей с летних гумен, а не находящейся на них.'
