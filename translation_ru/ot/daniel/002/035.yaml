  text: בֵּ/אדַ֣יִן דָּ֣קוּ כַ/חֲדָ֡ה פַּרְזְלָ/א֩ חַסְפָּ֨/א נְחָשָׁ֜/א כַּסְפָּ֣/א וְ/דַהֲבָ֗/א וַ/הֲווֹ֙ כְּ/ע֣וּר מִן אִדְּרֵי קַ֔יִט וּ/נְשָׂ֤א הִמּוֹן֙ רוּחָ֔/א וְ/כָל אֲתַ֖ר לָא הִשְׁתֲּכַ֣ח לְ/ה֑וֹן וְ/אַבְנָ֣/א דִּֽי מְחָ֣ת לְ/צַלְמָ֗/א הֲוָ֛ת לְ/ט֥וּר רַ֖ב וּ/מְלָ֥ת כָּל אַרְעָֽ/א־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/035.yaml
  text: Then the iron[a], the clay, the bronze, the silver, and the gold were crushed all at once and became like chaff from the summer threshing floors, and the wind carried them away so that no place was found for them[c][b]. But the stone that struck the statue became a great mountain and filled the whole earth.
translation:
  language: ru
  text: Тогда железо, глина, бронза, серебро и золото — всё вместе[a] — были раздроблены и стали как мякина[b] с летних гумен. Ветер унёс их, и для них нигде не нашлось места. А камень, ударивший в статую, стал огромной горой и наполнил всю землю[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одновременно», «в один миг».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как труха»; арамейское слово обозначает лёгкие отходы молотьбы, уносимые ветром.'
    reason: lexical_alternative
  - marker: c
    text: Слово «земля» может также означать «страна»; здесь широкий масштаб видения говорит в пользу перевода «земля».
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность.
- source_word: דָּקוּ
  choice: были раздроблены
  rationale: Страдательная форма обозначает разрушение и измельчение материалов; выбор согласуется с последующим образом мякины.
- source_word: כַחֲדָה
  choice: всё вместе
  rationale: Выражение означает совместность или одновременность; основной текст сохраняет идею совокупности, а сноска — возможный временной оттенок.
- source_word: פַּרְזְלָא חַסְפָּא נְחָשָׁא כַּסְפָּא וְדַהֲבָא
  choice: железо, глина, бронза, серебро и золото
  rationale: Материалы перечислены прямо и в порядке арамейского текста; נְחָשָׁא в контексте истукана передано традиционно и уместно как «бронза».
- source_word: וַהֲווֹ כְּעוּר
  choice: стали как мякина
  rationale: עוּר обозначает лёгкие отходы молотьбы, уносимые ветром; «мякина» точно сохраняет земледельческий образ.
- source_word: מִן אִדְּרֵי קַיִט
  choice: на летних гумнах
  rationale: Передаёт место и сезон молотьбы естественным современным русским выражением.
- source_word: וּנְשָׂא הִמּוֹן רוּחָא
  choice: Ветер унёс их
  rationale: Сохраняет ветер как грамматический субъект и полноту удаления раздробленных материалов.
- source_word: וְכָל אֲתַר לָא הִשְׁתֲּכַח לְהוֹן
  choice: и не осталось от них и следа
  rationale: Естественный русский эквивалент идиомы «никакого места не нашлось для них», выражающий полное исчезновение.
- source_word: וְאַבְנָא דִּי מְחָת לְצַלְמָא
  choice: А камень, ударивший в истукана
  rationale: Причастный оборот ясно определяет камень; «истукан» сохраняет обозначение огромного изваяния из контекста видения.
- source_word: הֲוָת לְטוּר רַב וּמְלָת כָּל אַרְעָא
  choice: стал огромной горой и наполнил всю землю
  rationale: Передаёт превращение камня, величину горы и всеохватность результата без добавочного толкования.
theological_decisions:
- issue: Объём значения אַרְעָא
  choice: землю
  alternative: страну
  rationale: Слово допускает оба значения, однако всемирный масштаб видения и выражение «всю» здесь благоприятствуют переводу «всю землю»; неоднозначность отмечена в сноске.
- issue: Союз перед упоминанием камня
  choice: А камень
  alternative: И камень
  rationale: Формально арамейский союз означает «и», но в контексте подчёркнуто противопоставление исчезнувших материалов и растущего камня; русское «а» естественно выражает этот контраст без усиления до «но».
translation_notes:
  register: Современный литературный русский, понятный широкому читателю, с торжественным повествовательным тоном. Сохранены конкретные образы гумна, мякины, ветра, истукана и горы; синтаксис слегка сглажен ради естественности, а реальные лексические альтернативы вынесены в сноски.
