base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/040.yaml
  text: And the fourth kingdom will be strong like iron[a], because iron crushes and shatters everything; and like iron that breaks all these things[b], it will crush and shatter.
translation:
  language: ru
  text: А четвёртое царство будет крепким, как железо[a], потому что железо дробит и сокрушает всё; и подобно железу, которое разбивает всё это[b], оно будет дробить и сокрушать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В арамейском перед словом «царство» нет определённого артикля; однако из контекста ясно, что речь идёт о четвёртом царстве в последовательности.
    reason: lexical_alternative
  - marker: b
    text: Слова «всё это», вероятно, относятся к предшествующим царствам, изображённым в видении в виде статуи.
    reason: cross_reference
lexical_decisions:
- source_word: וּמַלְכוּ רביעיה
  choice: А четвёртое царство
  rationale: Союз וּ продолжает последовательность толкования; רביעיה обозначает четвёртое царство. Определённость следует из контекста, хотя формального определённого артикля при מַלְכוּ нет.
- source_word: תֶּהֱוֵא תַקִּיפָה כְּפַרְזְלָא
  choice: будет крепким, как железо
  rationale: תֶּהֱוֵא выражает будущее состояние, תַקִּיפָה — силу и прочность; «крепким» естественно сочетается со сравнением с железом.
- source_word: כָּל קֳבֵל דִּי
  choice: потому что
  rationale: Оборот вводит основание для сравнения царства с железом.
- source_word: מְהַדֵּק וְחָשֵׁל כֹּלָּא
  choice: дробит и сокрушает всё
  rationale: Два глагола передают близкие, но не полностью тождественные виды разрушительного действия; пара сохраняет нарастающую силу образа.
- source_word: וּכְפַרְזְלָא דִּי מְרָעַע
  choice: и подобно железу, которое разбивает
  rationale: Сохраняется повторное сравнение с железом; «разбивает» передаёт значение разрушения у מְרָעַע, не смешивая его с соседними глаголами.
- source_word: כָּל אִלֵּין
  choice: всё это
  rationale: 'Указательное выражение оставлено достаточно широким: вероятно, оно отсылает к предшествующим царствам или частям истукана, но сам текст не уточняет референт полностью.'
- source_word: תַּדִּק וְתֵרֹעַ
  choice: оно будет дробить и сокрушать
  rationale: Два будущих глагола описывают всеобъемлющую разрушительную силу четвёртого царства и перекликаются с предшествующим описанием железа.
