  text: דִּ֣י הֵן חֶלְמָ/א֩ לָ֨א תְהֽוֹדְעֻנַּ֜/נִי חֲדָה הִ֣יא דָֽתְ/כ֗וֹן וּ/מִלָּ֨ה כִדְבָ֤ה וּ/שְׁחִיתָה֙ הזמנתון לְ/מֵאמַ֣ר קָֽדָמַ֔/י עַ֛ד דִּ֥י עִדָּנָ֖/א יִשְׁתַּנֵּ֑א לָהֵ֗ן חֶלְמָ/א֙ אֱמַ֣רוּ לִ֔/י וְֽ/אִנְדַּ֕ע דִּ֥י פִשְׁרֵ֖/הּ תְּהַחֲוֻנַּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/009.yaml
  text: But if you do not make the dream known to me[a], there is only one decree for you, for you have agreed to speak lying and corrupt words before me until the time changes. Therefore tell me the dream[c][b], and I will know that you can make its interpretation known to me.
translation:
  language: ru
  text: Если же вы не сообщите мне сон, для вас один приговор[a], потому что вы условились[b] говорить передо мной лживые и извращённые слова, пока не изменится время[c]. Поэтому расскажите мне сон, и тогда я буду знать, что вы сможете открыть мне его толкование.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для вас одно постановление» или «для вас один закон». Арамейское דָּת в обстановке царского суда может означать постановление, закон или судебный приговор.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вы приготовились» или «вы заранее решили». Глагол указывает на намеренную подготовку; «условились» передаёт предполагаемый царём совместный замысел.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «пока не изменятся времена» или, по смыслу, «пока не изменятся обстоятельства». В основном тексте сохранено единственное число арамейского слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי הֵן
  choice: Если же
  rationale: Передаёт условное значение и противопоставление предыдущему требованию царя.
- source_word: חֶלְמָא
  choice: сон
  rationale: Речь идёт о конкретном сне, уже известном из контекста; в русском языке определённость не требует отдельного показателя.
- source_word: לָא תְהוֹדְעֻנַּנִי
  choice: не сообщите мне
  rationale: 'Сохраняет каузативный смысл глагола ידע: сделать известным, сообщить.'
- source_word: חֲדָה הִיא דָתְכוֹן
  choice: приговор для вас один
  rationale: В контексте царского суда דָּת обозначает властное постановление или судебный приговор; формулировка подчёркивает единую участь всех мудрецов.
- source_word: וּמִלָּה כִדְבָה וּשְׁחִיתָה
  choice: лживые и пагубные слова
  rationale: «Лживые» передаёт כִדְבָה, а «пагубные» — разрушительный и испорченный характер שְׁחִיתָה, не сводя выражение лишь к фактической ошибке.
- source_word: הזמנתון
  choice: вы условились
  rationale: Глагол означает подготовить или устроить; в данном обвинении форма множественного числа указывает на совместный, заранее обдуманный замысел.
- source_word: לְמֵאמַר קָדָמַי
  choice: говорить передо мной
  rationale: Близко передаёт буквальное «говорить в моём присутствии», сохраняя придворный оттенок сцены.
- source_word: עַד דִּי עִדָּנָא יִשְׁתַּנֵּא
  choice: пока не изменится время
  rationale: Сохраняет единственное число עִדָּנָא и неоднозначный образ изменения времени, не заменяя его толкованием «пока не изменятся обстоятельства».
- source_word: לָהֵן
  choice: Поэтому
  rationale: Ясно выражает вывод царя из предшествующего обвинения.
- source_word: אֱמַרוּ לִי
  choice: расскажите мне
  rationale: Естественная русская передача повеления назвать содержание сна.
- source_word: וְאִנְדַּע
  choice: и тогда я буду знать
  rationale: Передаёт ожидаемый результат исполнения требования; «тогда» естественно раскрывает логическую последовательность.
- source_word: פִשְׁרֵהּ תְּהַחֲוֻנַּנִי
  choice: что вы откроете мне и его толкование
  rationale: Сохраняет утвердительную форму исходного текста и техническое для книги Даниила значение פְּשַׁר — «толкование»; частица «и» по-русски подчёркивает связь между сообщением сна и его толкованием.
