base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/005.yaml
  text: 'The king answered and said to the Chaldeans[a], “The word from me is firm: if you do not make known to me the dream and its interpretation, you will be made into limbs[b], and your houses will be made a refuse heap.”'
translation:
  language: ru
  text: 'Царь ответил и сказал халдеям: «Моё слово непреложно[a]: если вы не сообщите мне сон и его истолкование, вас расчленят[b], а ваши дома превратят в свалки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слово вышло от меня».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «вас превратят в части тела»; то есть вас расчленят. Часто переводится: «вас разрубят на части».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: царь
  rationale: Обычный и естественный русский эквивалент царского титула в повествовательном контексте.
- source_word: לכשדיא
  choice: халдеям
  rationale: Сохранено исходное этническое и одновременно профессиональное обозначение придворных мудрецов, без замены на толкование их функции.
- source_word: מִלְּתָא מִנִּי אַזְדָּא
  choice: Моё слово непреложно
  rationale: Передаёт наиболее вероятный в контексте смысл твёрдого, не подлежащего изменению царского решения и звучит естественно по-русски; альтернативное понимание отмечено в сноске.
- source_word: תְהוֹדְעוּנַּנִי
  choice: не сообщите мне
  rationale: Передаёт каузативный смысл «не дадите мне узнать» без неестественной русской конструкции.
- source_word: חֶלְמָא וּפִשְׁרֵהּ
  choice: сон и его истолкование
  rationale: «Истолкование» сохраняет технический смысл слова פשר в арамейской части книги Даниила.
- source_word: הַדָּמִין תִּתְעַבְדוּן
  choice: вас расчленят
  rationale: Естественно и точно передаёт пассивную угрозу разделения тела на члены, не ослабляя жестокий телесный образ исходного текста.
- source_word: וּבָתֵּיכוֹן נְוָלִי יִתְּשָׂמוּן
  choice: ваши дома превратят в свалки
  rationale: Современная и понятная передача превращения домов в осквернённые места для отбросов; активная неопределённо-личная конструкция естественно выражает арамейский пассив.
theological_decisions:
- issue: Значение מִנִּי אַזְדָּא
  choice: Царское слово твёрдо и непреложно.
  alternative: Слово вышло от меня.
  rationale: Форма אַזְדָּא допускает разные объяснения. Контекст угрозы поддерживает значение окончательного царского решения, однако альтернативное прочтение сохранено в сноске.
- issue: Передача הַדָּמִין
  choice: вас расчленят
  alternative: вас разрубят на части
  rationale: Выбранный вариант сохраняет прямую связь с членами тела и ясно выражает угрозу физического расчленения, тогда как более общее «на части» частично устраняет телесный образ.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «ответил и сказал» сохранена как допустимый повествовательный семитизм; угрозы переданы ясно, без архаизмов и без смягчения исходной жестокости.
