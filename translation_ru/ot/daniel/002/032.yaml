base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/032.yaml
  text: That image—its head was of fine gold[a], its chest and its arms of silver[c][b], its belly and its thighs of bronze.
translation:
  language: ru
  text: У этого изваяния[a] голова была из отборного золота[b], грудь и руки — из серебра, а живот и бёдра — из бронзы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «статуя». Арамейское צַלְמָא может означать изображение или статую.
    reason: lexical_alternative
  - marker: b
    text: 'Или «чистого золота». Буквально: «хорошего золота», то есть золота высокого качества.'
    reason: lexical_alternative
  - marker: c
    text: Или «меди». Арамейское נְחָשׁ в таком контексте обычно понимается как бронза, хотя названия металлов в древности могли частично пересекаться по значению.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַלְמָא
  choice: изваяние
  rationale: Арамейское слово обозначает изображение или статую. «Изваяние» естественно передаёт объёмную человекоподобную фигуру в данном видении, не добавляя пренебрежительного оттенка слова «истукан».
- source_word: רֵאשֵׁהּ
  choice: голова у него
  rationale: Притяжательная форма прямо указывает на голову изваяния; русская конструкция «у этого изваяния голова» звучит естественно.
- source_word: דִּי
  choice: из
  rationale: В перечислении частей тела частица связывает каждую часть с материалом, из которого она сделана; по-русски это естественно передаётся предлогом «из».
- source_word: דְהַב טָב
  choice: отборное золото
  rationale: Буквально «хорошее золото»; сочетание указывает на высокое качество. «Отборное» сохраняет этот смысл, не превращая его без необходимости в техническое утверждение об абсолютной чистоте.
- source_word: חֲדוֹהִי
  choice: грудь
  rationale: Слово обозначает переднюю часть туловища; «грудь» — ясный и современный русский эквивалент.
- source_word: דְרָעוֹהִי
  choice: руки
  rationale: Обычное русское обозначение верхних конечностей; в данном описании анатомической фигуры смысл однозначен.
- source_word: כְסַף
  choice: серебро
  rationale: Прямое соответствие названию металла.
- source_word: מְעוֹהִי
  choice: живот
  rationale: Слово обозначает живот или внутреннюю среднюю часть тела; «живот» ясно соответствует последовательности частей фигуры.
- source_word: יַרְכָתֵהּ
  choice: бёдра
  rationale: Форма обозначает область верхней части ног или боков тела. «Бёдра» наиболее точно соответствует анатомическому перечислению и не расширяет значение до всех ног.
- source_word: נְחָשׁ
  choice: бронза
  rationale: В библейских перечнях металлов это традиционное и контекстуально уместное обозначение, хотя древняя терминология могла охватывать также медь.
- source_word: הוּא
  choice: у этого изваяния
  rationale: Местоимение возобновляет упоминание уже описанной фигуры; указательное «этого» естественно связывает стих с предшествующим контекстом.
