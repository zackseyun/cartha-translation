source:
  edition: WLC
  text: וְ/הֵ֨ן חֶלְמָ֤/א וּ/פִשְׁרֵ/הּ֙ תְּֽהַחֲוֺ֔ן מַתְּנָ֤ן וּ/נְבִזְבָּה֙ וִ/יקָ֣ר שַׂגִּ֔יא תְּקַבְּל֖וּן מִן קֳדָמָ֑/י לָהֵ֕ן חֶלְמָ֥/א וּ/פִשְׁרֵ֖/הּ הַחֲוֺֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/006.yaml
  text: But if you make known the dream and its interpretation[a], you will receive from me gifts and rewards and great honor. Therefore make known to me the dream and its interpretation.
translation:
  language: ru
  text: Но если вы сообщите мне сон и его толкование, то получите от меня дары, награду и великие почести. Поэтому сообщите мне сон и его толкование.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵן
  choice: Но если
  rationale: Выражение вводит условие, противопоставленное угрозе предыдущего стиха; «но если» естественно передаёт и связь, и контраст.
- source_word: חֶלְמָא
  choice: сон
  rationale: Речь идёт о конкретном сне царя, уже известном из контекста; в русском языке определённость выражается контекстом.
- source_word: וּפִשְׁרֵהּ
  choice: и его толкование
  rationale: В арамейском языке книги Даниила פשר обозначает истолкование или объяснение сна; «толкование» точно и естественно в данном контексте.
- source_word: תְּהַחֲוֺן / הַחֲוֺנִי
  choice: сообщите мне
  rationale: Каузативная форма חוה означает «дать знать, сообщить, объявить». Один и тот же перевод сохраняет повтор глагола в обеих частях стиха.
- source_word: מַתְּנָן
  choice: дары
  rationale: Существительное во множественном числе обозначает ценные подношения или пожалования.
- source_word: וּנְבִזְבָּה
  choice: награду
  rationale: Существительное в единственном числе обозначает царское вознаграждение или пожалование; форма «награду» сохраняет число исходного текста WLC.
- source_word: וִיקָר שַׂגִּיא
  choice: и великие почести
  rationale: יקָר означает честь, почёт или высокий статус, а שַׂגִּיא усиливает значение. Множественное «почести» идиоматично по-русски после глагола «получите».
- source_word: תְּקַבְּלוּן
  choice: получите
  rationale: Имперфект 2-го лица множественного числа выражает будущее следствие условия.
- source_word: מִן קֳדָמַי
  choice: от меня
  rationale: В данном арамейском обороте царь представлен источником обещанных даров и почестей; буквальное «от лица моего» было бы неестественно.
- source_word: לָהֵן
  choice: Поэтому
  rationale: Слово вводит вывод и последующее повеление на основании обещанной награды.
theological_decisions: []
