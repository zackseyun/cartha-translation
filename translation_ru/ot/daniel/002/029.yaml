  source_fidelity: 'Смысл передан точно: подчеркнутое обращение к царю, его мысли на ложе, предмет этих мыслей («что будет после этого») и последующее сообщение о будущем сохранены. Однако «А у тебя ... на постели возникли мысли» в русском несколько тяжеловесно и допускает неудачное присоединение обстоятельства к «мыслям», а не к царю.'
  naturalness: 'Для современного литературного русского естественнее прямо назвать царя субъектом размышления: «Ты, царь, на постели размышлял...». Это передаёт смысл арамейского образа возникновения мыслей без неестественной конструкции. «Дал тебе знать» допустимо и ясно передаёт каузатив «сделал известным».'
  terminology: «Тот, кто открывает тайны» точно передаёт арамейское причастное выражение, не добавляя слова «Бог» и не навязывая более жёсткий титул. Строчная буква в «тот» не кодирует средствами русской орфографии богословское отождествление, отсутствующее в самой формулировке стиха, хотя референт ясен из контекста.
