  text: אַ֣נְתְּה מַלְכָּ֗/א רַעְיוֹנָ/ךְ֙ עַל מִשְׁכְּבָ֣/ךְ סְלִ֔קוּ מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/גָלֵ֧א רָזַיָּ֛/א הוֹדְעָ֖/ךְ מָה דִ֥י לֶהֱוֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/029.yaml
  text: As for you[a], O king, your thoughts came up on your bed about what would happen after this, and he who reveals mysteries has made known to you what would happen.
translation:
  language: ru
  text: Ты, царь, на постели размышлял о том, что будет после этого, и тот, кто открывает тайны, дал тебе знать, что будет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַ֣נְתְּה
  choice: А у тебя
  rationale: Самостоятельное местоимение имеет тематически-эмфатическую функцию. Оборот «А у тебя» естественно выделяет царя как тему и плавно вводит последующее описание его мыслей.
- source_word: מַלְכָּא
  choice: царь
  rationale: Форма является прямым обращением; русская пунктуация «царь» с обособлением передаёт звательный смысл без архаизирующей частицы «о».
- source_word: רַעְיוֹנָךְ
  choice: мысли
  rationale: Существительное обозначает мысли или размышления; «мысли» сохраняет широкий смысл и звучит естественно.
- source_word: עַל מִשְׁכְּבָךְ
  choice: на постели
  rationale: Буквальный пространственный образ сохраняется; «постель» соответствует возвышенному, но понятному повествовательному регистру.
- source_word: סְלִקוּ
  choice: возникли
  rationale: Глагол буквально передаёт подъём или появление. В сочетании с мыслями русское «возникли» естественно воспроизводит эту метафору.
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: о том, что будет после этого
  rationale: Оборот передаёт содержание мыслей и сохраняет как будущую направленность, так и указательное «после этого».
- source_word: וְגָלֵא רָזַיָּא
  choice: и Тот, кто открывает тайны
  rationale: Причастное выражение описывает действующего как открывающего тайны. Описательный оборот сохраняет его титулоподобную функцию, не добавляя отсутствующего в тексте слова «Бог».
- source_word: הוֹדְעָךְ
  choice: дал тебе знать
  rationale: Каузатив означает «сделал известным». Русский оборот «дал тебе знать» передаёт это действие ясно и естественно.
- source_word: מָה דִי לֶהֱוֵא
  choice: что будет
  rationale: Краткое повторение сохраняет намеренную повторность арамейского текста и его будущий смысл.
theological_decisions:
- issue: Передача וְגָלֵא רָזַיָּא как обозначения Бога
  choice: Тот, кто открывает тайны
  alternative: Открывающий тайны
  rationale: В арамейском нет прямо названного слова «Бог», а употреблено причастное выражение. Выбранный вариант сохраняет подразумеваемого личного деятеля и титулоподобное звучание, не делая выражение более формальным титулом, чем позволяет источник.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Сохранены обращение к царю, образ мыслей, возникающих на постели, повтор «что будет» и описательное обозначение открывающего тайны; ненужная архаизация исключена.
