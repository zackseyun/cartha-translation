id: DAN.2.31
reference: Daniel 2:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א חָזֵ֤ה הֲוַ֨יְתָ֙ וַ/אֲל֨וּ צְלֵ֥ם חַד֙ שַׂגִּ֔יא צַלְמָ֨/א דִּכֵּ֥ן רַ֛ב וְ/זִיוֵ֥/הּ יַתִּ֖יר קָאֵ֣ם לְ/קָבְלָ֑/ךְ וְ/רֵוֵ֖/הּ דְּחִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/031.yaml
  text: You[a], O king, were watching, and behold, there was one great statue[b]. That statue was immense, and its splendor was extraordinary; it was standing before you[c], and its appearance was terrifying.
translation:
  language: ru
  text: Ты, царь, смотрел, и вот — одно огромное изваяние[a]. Это изваяние было громадным, и блеск его — необычайным[b]; оно стояло перед тобой, и вид его был страшен[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образ» или «статуя». Арамейское צְלֵם обозначает изображение, образ или изваяние; здесь речь идёт о большой фигуре, стоящей перед царём.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сияние его было превосходящим всё». Выражение подчёркивает исключительный блеск или великолепие изваяния.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «облик его внушал ужас». Арамейское выражение описывает вид, вызывающий страх.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה מַלְכָּ֗א
  choice: Ты, царь
  rationale: Сохраняет прямое обращение к Навуходоносору и возвышенный придворный тон без архаического русского «о царь».
- source_word: חָזֵ֤ה הֲוַ֨יְתָ֙
  choice: смотрел
  rationale: Причастие со вспомогательным глаголом обозначает продолженное действие в прошлом; несовершенный вид русского глагола передаёт эту длительность.
- source_word: וַאֲל֨וּ
  choice: и вот
  rationale: Естественно вводит внезапно представший взору образ и сохраняет указательную силу арамейского междометия.
- source_word: צְלֵ֥ם חַד֙ שַׂגִּ֔יא
  choice: одно огромное изваяние
  rationale: «Изваяние» передаёт крупную видимую фигуру, не привнося обязательного значения идола; «одно» сохраняет חַד, а «огромное» выражает величину.
- source_word: צַלְמָ֨א דִּכֵּ֥ן רַ֛ב
  choice: Это изваяние было громадным
  rationale: Указательное «это» возобновляет упоминание фигуры; «громадным» сохраняет повторное усиленное указание на её размеры, не повторяя дословно «огромное».
- source_word: וְזִיוֵ֥הּ יַתִּ֖יר
  choice: и блеск его — необычайным
  rationale: זִיו обозначает блеск, сияние или великолепие, а יַתִּיר подчёркивает его исключительность. Именная конструкция естественна в русском описании.
- source_word: קָאֵ֣ם לְקָבְלָ֑ךְ
  choice: оно стояло перед тобой
  rationale: Передаёт статичную сцену и пространственное значение «перед, напротив» без ненужного уточнения.
- source_word: וְרֵוֵ֖הּ דְּחִֽיל
  choice: и вид его был страшен
  rationale: Сохраняет прямое описание облика как вызывающего страх, не уточняя сверх текста характер этого ужаса.
