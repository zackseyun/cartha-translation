  text: И Даниил вошёл и попросил царя дать ему время, чтобы он мог сообщить царю толкование.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: вошёл
  rationale: В данном контексте арамейский глагол означает вход к царю, то есть явиться к нему.
- source_word: זְמָן
  choice: время
  rationale: 'Прямое и естественное соответствие: Даниил просит отсрочку для исполнения требования царя.'
- source_word: פִשְׁרָא
  choice: толкование
  rationale: Устойчивое значение арамейского слова в книге Даниила — истолкование сна.
- source_word: לְהַחֲוָיָה
  choice: сообщить
  rationale: Инфинитив каузативной породы передаёт значение «дать знать, объявить»; «сообщить» естественно по-русски и не добавляет идеи доказательства.
