base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/010.yaml
  text: The Chaldeans answered before the king and said, “There is not a man on earth who can make known the king’s matter, because no great and powerful king has asked for a thing like this from any diviner-priest, enchanter, or Chaldean.”
translation:
  language: ru
  text: 'Халдеи ответили царю: «Нет на земле человека, который мог бы сообщить царю то, чего он требует. Ведь ни один великий и могущественный царь не требовал ничего подобного ни от заклинателя, ни от чародея, ни от халдея».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֳדָם מַלְכָּא
  choice: царю
  rationale: В данном контексте арамейское выражение означает ответ, обращённый к царю; буквальное «перед царём» по-русски менее естественно.
- source_word: מִלַּת מַלְכָּא
  choice: то, чего он требует
  rationale: מִלָּה здесь обозначает предмет царского требования, а не просто произнесённое «слово»; местоимение устраняет тяжеловесное повторение титула.
- source_word: עַל יַבֶּשְׁתָּא
  choice: на земле
  rationale: Естественный русский эквивалент идиомы со значением «на суше, в обитаемом мире».
- source_word: חַרְטֹּם
  choice: заклинатель
  rationale: Обозначает придворного специалиста по тайным знаниям и ритуалам; выбор не сводит термин к современному сценическому «фокуснику».
- source_word: אָשַׁף
  choice: чародей
  rationale: Передаёт специалиста по магическим практикам и отличает его от חַרְטֹּם.
- source_word: כַשְׂדָּי
  choice: халдей
  rationale: В перечне придворных мудрецов это профессионально-сословное обозначение, совпадающее с этнонимом.
theological_decisions:
- issue: Пределы человеческой способности открыть тайное
  choice: Сохранено категорическое «нет на земле человека»
  alternative: «Никто не способен» без указания «на земле»
  rationale: Формулировка сохраняет контраст между человеческой неспособностью и последующим Божьим откровением, не добавляя его в сам стих.
translation_notes:
  register: Современный литературный русский язык; речь придворных звучит уважительно, но настойчиво. Сохранены трёхчастный перечень и повтор «ни… ни… ни». Терминология не привязана к конкретной конфессиональной традиции.
