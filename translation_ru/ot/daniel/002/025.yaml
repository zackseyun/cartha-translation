base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/025.yaml
  text: Then Arioch hurriedly brought Daniel before the king and said to him[a], “I have found a man from among the exiles of Judah who will make the interpretation known to the king.”
translation:
  language: ru
  text: 'Тогда Ариох поспешно привёл Даниила к царю и сказал ему: «Я нашёл среди изгнанников из Иудеи[a] человека, который сообщит царю толкование».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди иудейских изгнанников»; возможно также: «среди изгнанников-иудеев». Арамейское выражение обозначает Даниила как принадлежащего к народу Иудеи, находящемуся в изгнании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: בְּהִתְבְּהָלָה
  choice: поспешно
  rationale: Выражение передаёт поспешность и срочность; контекст поддерживает значение быстроты, а не обязательно испуга.
- source_word: הַנְעֵל
  choice: привёл
  rationale: Каузативный глагол означает «привести, ввести»; сочетание «привёл Даниила к царю» естественно передаёт введение в царское присутствие.
- source_word: קֳדָם מַלְכָּא
  choice: к царю
  rationale: В данном контексте это придворное выражение означает доставить человека в присутствие царя; по-русски естественно «привёл к царю».
- source_word: הַשְׁכַּחַת
  choice: Я нашёл
  rationale: Перфект первого лица обозначает завершённое обнаружение, о котором Ариох докладывает царю.
- source_word: גְּבַר
  choice: человека
  rationale: Существительное обозначает взрослого мужчину; русское «человека» в этой конструкции естественно и не устраняет мужской референции.
- source_word: מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: среди переселенцев из Иудеи
  rationale: Передаёт принадлежность к общине уведённых в изгнание жителей Иудеи, избегая буквального и неестественного «из сынов изгнания».
- source_word: פִשְׁרָא
  choice: толкование
  rationale: В книге Даниила это устойчивый термин для истолкования сна или тайны; «толкование» сохраняет эту связь.
- source_word: יְהוֹדַע
  choice: сообщит
  rationale: Каузатив имеет значение «дать знать, сделать известным»; «сообщит царю толкование» точно и естественно передаёт смысл без усиления до «откроет».
theological_decisions:
- issue: Историко-этническое обозначение דִּי יְהוּד
  choice: из Иудеи
  alternative: иудейских; из иудеев
  rationale: В контексте изгнания выражение может указывать как на происхождение из Иудеи, так и на принадлежность к её народу. Основной текст сохраняет географически-историческую форму, а примечание отмечает допустимые этнические варианты.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Прямая речь звучит естественно для царского доклада; ключевой термин «толкование» согласуется с лексикой книги Даниила.
