  text: וַ/אֲנָ֗ה לָ֤א בְ/חָכְמָה֙ דִּֽי אִיתַ֥י בִּ/י֙ מִן כָּל חַיַּיָּ֔/א רָזָ֥/א דְנָ֖ה גֱּלִ֣י לִ֑/י לָהֵ֗ן עַל דִּבְרַת֙ דִּ֤י פִשְׁרָ/א֙ לְ/מַלְכָּ֣/א יְהוֹדְע֔וּן וְ/רַעְיוֹנֵ֥י לִבְבָ֖/ךְ תִּנְדַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/030.yaml
  text: But as for me[a], this mystery has been revealed to me not because of wisdom that is in me more than in all the living, but in order that the interpretation may be made known to the king[b], and that you may know the thoughts of your heart.
translation:
  language: ru
  text: А мне эта тайна[a] открыта не потому, что во мне больше мудрости, чем во всех живущих, но для того, чтобы истолкование стало известно царю и чтобы ты узнал мысли своего сердца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это сокровенное». Арамейское слово обозначает нечто скрытое; в книге Даниила оно часто относится к тайне, которую открывает Бог.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мысли твоего сердца». Здесь «сердце» означает внутренний мир человека, включая его мысли.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַאֲנָה
  choice: А мне
  rationale: Самостоятельное местоимение с союзом выделяет Даниила и создаёт контраст между его ролью и Божьим откровением; «А мне» естественно передаёт это тематическое выделение по-русски.
- source_word: לָא בְחָכְמָה דִּי אִיתַי בִּי מִן כָּל חַיַּיָּא
  choice: не потому, что во мне больше мудрости, чем во всех живущих
  rationale: Предлог ב выражает основание или причину, а מִן — сравнение. Формулировка сохраняет прямое отрицание превосходства Даниила в мудрости.
- source_word: רָזָא דְנָה
  choice: эта тайна
  rationale: В книге Даниила слово обозначает сокрытое дело, раскрываемое Богом. «Тайна» сохраняет как скрытость, так и контекст откровения.
- source_word: גֱּלִי לִי
  choice: мне ... открыта
  rationale: Пассивная конструкция показывает, что Даниил является получателем, а не источником откровения.
- source_word: לָהֵן עַל דִּבְרַת דִּי
  choice: но для того, чтобы
  rationale: Сочетание вводит цель и одновременно противопоставляет её отвергнутой причине; русская конструкция передаёт обе функции.
- source_word: פִשְׁרָא
  choice: истолкование
  rationale: Это обычный в арамейской части Даниила термин для истолкования сна или тайны; «истолкование» точно и уместно в литературном библейском регистре.
- source_word: לְמַלְכָּא יְהוֹדְעוּן
  choice: царю стало известно
  rationale: Форма множественного числа имеет здесь безличное, близкое к пассивному значение. Русская безличная конструкция не вводит отсутствующего в тексте деятеля.
- source_word: וְרַעְיוֹנֵי לִבְבָךְ
  choice: помышления своего сердца
  rationale: «Помышления» передаёт внутренние мысли и размышления, а «сердце» сохраняет антропологический образ оригинала, включающий разум и внутреннюю жизнь.
- source_word: תִּנְדַּע
  choice: ты узнал
  rationale: В зависимой целевой конструкции русское прошедшее совершенного вида после «чтобы» естественно передаёт арамейский имперфект со значением цели.
theological_decisions:
- issue: Отрицание личного превосходства Даниила как причины откровения
  choice: 'Сохранено явное сравнение: «не потому, что во мне больше мудрости, чем во всех живущих»'
  alternative: 'Передать лишь общее отрицание: «не по моей мудрости»'
  rationale: Сравнительная конструкция מִן כָּל חַיַּיָּא прямо отрицает, что откровение было дано из-за превосходящей мудрости Даниила; её нельзя опускать или ослаблять.
- issue: Значение слова «сердце»
  choice: Сохранено «сердце»
  alternative: Заменить на «ум» или «разум»
  rationale: В библейской антропологии сердце включает мыслительную и волевую внутреннюю жизнь. Сохранение образа не сужает значение до современной категории рассудка.
- issue: Источник откровения
  choice: Использована пассивная формулировка «тайна открыта» без названного деятеля
  alternative: Добавить «Бог открыл мне эту тайну»
  rationale: Контекст ясно указывает на Бога, однако в самом стихе деятель грамматически не назван. Пассив сохраняет формальную сдержанность и богословскую направленность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для русского читателя без устранения сравнительной конструкции, пассивности откровения и образа сердца. Маркеры [a] и [b] размещены непосредственно при поясняемых выражениях.
