  text: אֱדַ֨יִן מַלְכָּ֜/א לְ/דָנִיֵּ֣אל רַבִּ֗י וּ/מַתְּנָ֨ן רַבְרְבָ֤ן שַׂגִּיאָן֙ יְהַב לֵ֔/הּ וְ/הַ֨שְׁלְטֵ֔/הּ עַ֖ל כָּל מְדִינַ֣ת בָּבֶ֑ל וְ/רַב סִגְנִ֔ין עַ֖ל כָּל חַכִּימֵ֥י בָבֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/048.yaml
  text: Then the king made Daniel great and gave him many great gifts[b][a], and he made him ruler over the whole province of Babylon and chief prefect over all the wise men of Babylon.
translation:
  language: ru
  text: Тогда царь возвысил Даниила[a], дал ему много ценных даров, поставил его правителем над всей областью Вавилона и главой[b] над всеми мудрецами Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал Даниила великим»; в данном контексте речь идёт о царском возвышении или повышении Даниила.'
    reason: lexical_alternative
  - marker: b
    text: Арамейское выражение обозначает высокопоставленного чиновника, поставленного над другими должностными лицами или управителями.
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Последовательное наречие вводит следующее событие повествования; «тогда» естественно передаёт ход рассказа.
- source_word: מַלְכָּא
  choice: царь
  rationale: Определённая форма арамейского существительного; в русском контексте определённость ясна без артикля.
- source_word: לְדָנִיֵּאל
  choice: Даниила
  rationale: Традиционная русская форма имени в винительном падеже, обусловленном конструкцией с переходным глаголом.
- source_word: רַבִּי
  choice: возвысил
  rationale: Глагол буквально означает «сделал великим», а в придворном контексте указывает на возвышение или повышение; «возвысил» сохраняет образ и звучит естественно.
- source_word: וּמַתְּנָן רַבְרְבָן שַׂגִּיאָן יְהַב לֵהּ
  choice: дал ему множество щедрых даров
  rationale: מַתְּנָן — «дары», а определения выражают их многочисленность и значительность. «Множество щедрых даров» естественно передаёт оба оттенка, не сводя их только к денежной ценности.
- source_word: וְהַשְׁלְטֵהּ
  choice: поставил его правителем
  rationale: Каузативная форма от שלט означает «дать власть, поставить править»; выбранная формулировка ясно сохраняет каузативный смысл.
- source_word: עַל כָּל מְדִינַת בָּבֶל
  choice: над всей областью Вавилонской
  rationale: מְדִינָה в имперском контексте обозначает административную область, а כָּל при существительном в единственном числе — всю область целиком.
- source_word: וְרַב סִגְנִין
  choice: и главным начальником
  rationale: רַב означает «главный», а סִגְנִין связано с высокопоставленными должностными лицами. Фраза «главный начальник» передаёт административное превосходство без навязывания поздней конкретной системы титулов.
- source_word: עַל כָּל חַכִּימֵי בָבֶל
  choice: над всеми мудрецами Вавилона
  rationale: «Мудрецы» — точное и традиционно понятное обозначение придворных учёных и советников в книге Даниила.
