    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלֵא
  choice: открывает
  rationale: Причастная форма обозначает действие Бога, делающего неизвестное явным; «открывает» естественно и уместно в контексте откровения тайны.
- source_word: עַמִּיקָתָא
  choice: глубокое
  rationale: Субстантивированное прилагательное во множественном числе передано собирательной формой среднего рода, сохраняющей метафору глубины.
- source_word: וּמְסַתְּרָתָא
  choice: и сокровенное
  rationale: Слово обозначает скрытое или тайное; «сокровенное» сохраняет параллелизм с «глубокое» и имеет достойное, понятное звучание.
- source_word: יָדַע מָה
  choice: знает, что
  rationale: Прямая и естественная передача арамейского оборота, вводящего содержание Божьего знания.
- source_word: בַחֲשׁוֹכָא
  choice: во тьме
  rationale: Сохраняется конкретный образ тьмы без избыточного добавления глагольной связки, необязательной в русском настоящем времени.
- source_word: וּנְהִירָא
  choice: и свет
  rationale: «Свет» прямо передаёт существительное и сохраняет поэтическое противопоставление тьме.
- source_word: עִמֵּהּ שְׁרֵא
  choice: обитает с Ним
  rationale: Глагол выражает пребывание или обитание; такой перевод сохраняет динамичный поэтический образ, а не сводит его к простому наличию.
- source_word: הוּא
  choice: Он
  rationale: Начальное местоимение относится к Богу и сохраняется как подлежащее; прописная буква соответствует русской традиции благоговейного текста.
theological_decisions:
- issue: Олицетворение света в его отношении к Богу
  choice: и свет обитает с Ним
  alternative: и свет — с Ним
  rationale: Арамейский глагол שְׁרֵא означает пребывание или обитание. «Обитает» сохраняет поэтическое олицетворение, не превращая его в дополнительное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Формы «глубокое и сокровенное» передают арамейские субстантивированные множественные прилагательные естественными русскими собирательными формами; местоимение о Боге написано с прописной буквы.
