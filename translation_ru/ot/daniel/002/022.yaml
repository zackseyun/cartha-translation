  text: He reveals deep and hidden things[a]; he knows what is in the darkness[b], and light dwells with him.
translation:
  language: ru
  text: Он открывает глубокое и сокровенное[a], знает, что во тьме, и свет обитает с Ним[b].
  philosophy: optimal-equivalence
