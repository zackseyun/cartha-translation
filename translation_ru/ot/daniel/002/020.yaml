base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/020.yaml
  text: 'Daniel answered and said: “Blessed be the name of God from everlasting to everlasting[b][a], for wisdom and might belong to him.”'
translation:
  language: ru
  text: 'Даниил ответил и сказал:


    «Да будет благословенно имя Бога от века и до века[a],


    потому что мудрость и могущество принадлежат Ему[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из века в век»; или: «во веки веков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мудрость и сила — Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: начал говорить
  rationale: Арамейская парная формула буквально означает «ответил и сказал», но здесь речь не является ответом собеседнику. Русское «начал говорить» естественно вводит последующую хвалу, не добавляя отсутствующего адресата.
- source_word: לֶהֱוֵא ... מְבָרַךְ
  choice: да будет благословенно
  rationale: Волитивная форма выражает благословение-пожелание; конструкция «да будет благословенно» сохраняет его возвышенный и доксологический характер.
- source_word: שְׁמֵהּ דִּי אֱלָהָא
  choice: имя Бога
  rationale: Прямо передаёт арамейскую генитивную конструкцию и сохраняет библейский образ имени как выражения Божьей явленной личности и чести.
- source_word: מִן עָלְמָא וְעַד עָלְמָא
  choice: от века и до века
  rationale: Сохраняет повтор существительного и широкий временной охват исходной формулы; альтернативы указаны в сноске.
- source_word: דִּי
  choice: потому что
  rationale: Частица вводит основание благословения. «Потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: חָכְמְתָא
  choice: мудрость
  rationale: Прямое соответствие абстрактному существительному.
- source_word: גְבוּרְתָא
  choice: могущество
  rationale: Передаёт силу и власть, обозначаемые арамейским словом, и естественно сочетается с «мудростью» в возвышенной речи.
- source_word: דִּי לֵהּ הִיא
  choice: принадлежат Ему
  rationale: Передаёт именную конструкцию обладания без добавления значения исключительности, которого исходный текст прямо не выражает.
theological_decisions:
- issue: Формула славословия и Божьи свойства
  choice: Имя Бога благословляется на основании того, что мудрость и могущество принадлежат Ему.
  alternative: 'Более буквально: «Да будет имя Бога благословенно… ибо мудрость и могущество — Его».'
  rationale: Перевод сохраняет структуру славословия и причинную связь, не превращая стих в отвлечённое догматическое определение и не добавляя утверждения об исключительности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, молитвенно-доксологическим звучанием. Поэтическое членение отражает благословение Даниила. Все сносочные маркеры помещены непосредственно при соответствующих выражениях.
