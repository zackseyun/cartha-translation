base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/008.yaml
  text: As for me[a], I heard, but I did not understand. So I said, “My lord, what will be the outcome of these things?”
translation:
  language: ru
  text: 'Я слышал, но не понял. Тогда я сказал: «Господин мой, чем всё это завершится?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каков конец всего этого?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Я
  rationale: Самостоятельное местоимение подчёркивает личную перспективу Даниила; в современном русском это естественно передаётся явным «я», без тяжеловесного «что до меня».
- source_word: שָׁמַעְתִּי
  choice: слышал
  rationale: Форма qal означает слуховое восприятие откровения; «слышал» точно и естественно передаёт смысл.
- source_word: וְלֹא אָבִין
  choice: но не понимал
  rationale: 'Союз в контексте имеет противительный оттенок: Даниил слышал, однако смысла не постигал. Имперфект после повествовательной формы естественно описывает состояние непонимания.'
- source_word: וָאֹמְרָה
  choice: Тогда я спросил
  rationale: Хотя буквально глагол означает «сказал», следующая прямая речь является вопросом; «спросил» естественно выражает речевой акт, а «тогда» передаёт развитие повествования.
- source_word: אֲדֹנִי
  choice: Господин мой
  rationale: Это уважительное обращение к небесному собеседнику. Такая форма сохраняет буквальное значение и не отождествляет адресата однозначно с Богом.
- source_word: מָה אַחֲרִית אֵלֶּה
  choice: чем всё это завершится?
  rationale: אַחֲרִית может обозначать конец, исход или итог. Русская формулировка естественно передаёт вопрос о конечном исходе предсказанных событий, не уточняя его сверх текста.
theological_decisions:
- issue: К кому относится אֲדֹנִי
  choice: Уважительное обращение «Господин мой» без однозначного указания на божественность адресата.
  alternative: 'Обращение непосредственно к Богу: «Господи».'
  rationale: Ближайший контекст допускает обращение к небесному вестнику или толкователю; перевод не должен привносить более определённую идентификацию, чем даёт текст.
- issue: Значение אַחֲרִית
  choice: 'Конечный исход событий: «чем всё это завершится?»'
  alternative: 'Более буквально: «каков конец всего этого?»'
  rationale: Слово сохраняет эсхатологическую направленность, но может обозначать как конец, так и результат; выбранная формулировка не сужает его до одной технической схемы.
translation_notes:
  register: Современный литературный русский язык; речь краткая, достоинственная и понятная. Сохранены противопоставление между слышанием и пониманием и уважительный, но не богословски предрешённый характер обращения.
