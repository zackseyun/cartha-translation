base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/011.yaml
  text: And from the time that the regular offering is removed and the abomination that desolates is set up[b][a], there will be 1,290 days.
translation:
  language: ru
  text: И со времени, когда будет отменено регулярное приношение[a] и установлена мерзость, вызывающая запустение[b], пройдёт тысяча двести девяносто дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному переводу: «ежедневная жертва». Еврейское תָּמִיד здесь служит кратким культовым обозначением регулярного храмового приношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «мерзость запустения» или «опустошающая мерзость».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵעֵת
  choice: И со времени, когда
  rationale: Союз ו связывает стих с предыдущим контекстом, а сочетание מִן + עֵת обозначает исходную точку отсчёта. Добавленное «когда» естественно вводит в русском языке следующие события.
- source_word: הוּסַר
  choice: будет отменено
  rationale: Пассивная форма глагола סור означает устранение или прекращение. В данном культовом контексте «отменено» ясно передаёт прекращение регулярного приношения и согласуется с будущей временной перспективой пророчества.
- source_word: הַתָּמִיד
  choice: постоянное приношение
  rationale: Слово תָּמִיד употреблено как культовое сокращённое обозначение регулярно совершаемого храмового приношения. Перевод не добавляет отсутствующего в тексте уточнения «всесожжение».
- source_word: וְלָתֵת
  choice: и установлена
  rationale: Буквально инфинитив означает «и поставить/поместить». В русской временной конструкции пассивная форма естественно обозначает установление названной далее мерзости и соотносится с пассивным глаголом первой части.
- source_word: שִׁקּוּץ שֹׁמֵם
  choice: мерзость, несущая опустошение
  rationale: «Мерзость» сохраняет устойчивую библейскую лексику для שִׁקּוּץ, а причастный оборот «несущая опустошение» передаёт определяющую функцию и действенный смысл שֹׁמֵם, не устраняя неоднозначность выражения.
- source_word: יָמִים אֶלֶף מָאתַיִם וְתִשְׁעִים
  choice: пройдёт тысяча двести девяносто дней
  rationale: В еврейском тексте продолжительность выражена краткой именной группой. Глагол «пройдёт» делает русское предложение полным и естественно обозначает срок от названной исходной точки.
theological_decisions:
- issue: Передача הַתָּמִיד в храмово-апокалиптическом контексте
  choice: постоянное приношение
  alternative: ежедневная жертва; постоянное всесожжение
  rationale: Еврейское слово эллиптично обозначает регулярный храмовый обряд. Выбранный вариант сохраняет культовый смысл, но не сужает его до конкретного вида жертвы, прямо не названного в стихе.
- issue: Передача שִׁקּוּץ שֹׁמֵם
  choice: мерзость, несущая опустошение
  alternative: мерзость запустения; опустошающая мерзость
  rationale: Выбранная формулировка непосредственно передаёт причастный характер שֹׁמֵם и сохраняет активный оттенок воздействия. Традиционная формула приведена в примечании ввиду её устойчивости и межтекстового значения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для русского читателя, при этом сохранены союзная связь с контекстом, храмовая терминология, образ «мерзости» и неоднозначность причастного оборота.
