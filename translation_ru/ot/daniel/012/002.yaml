  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/רַבִּ֕ים מִ/יְּשֵׁנֵ֥י אַדְמַת עָפָ֖ר יָקִ֑יצוּ אֵ֚לֶּה לְ/חַיֵּ֣י עוֹלָ֔ם וְ/אֵ֥לֶּה לַ/חֲרָפ֖וֹת לְ/דִרְא֥וֹן עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/002.yaml
  text: And many of those sleeping in the dust of the earth will awake[a], these to everlasting life, and those to reproaches[c][b], to everlasting contempt.
translation:
  language: ru
  text: 'И многие[a] из спящих в прахе земном пробудятся: эти — к вечной жизни, а те — к поношениям[b], к вечному презрению[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «множество спящих в прахе земном». В еврейском тексте сказано «многие», а не прямо «все».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «к стыду» или «к бесчестию». Еврейское слово стоит во множественном числе и может обозначать поношения, укоризны или позор.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к вечному отвращению» или «к вечному омерзению». Сходное выражение в контексте суда см. в Ис. 66:24.'
    reason: cross_reference
lexical_decisions:
- source_word: רַבִּים
  choice: многие
  rationale: Прямое значение — «многие». Перевод не расширяет его до «все» и сохраняет открытым вопрос об объёме воскресения.
- source_word: מִיְּשֵׁנֵי
  choice: из спящих
  rationale: Причастная форма обозначает спящих; такой перевод сохраняет метафору сна как смерти.
- source_word: אַדְמַת עָפָר
  choice: в прахе земном
  rationale: Естественная для литературного русского передача образа пыльной земли, погребения и смертности.
- source_word: יָקִיצוּ
  choice: пробудятся
  rationale: Сохраняет значение пробуждения и продолжает метафору сна, не подменяя её глаголом «восстанут».
- source_word: אֵלֶּה ... וְאֵלֶּה
  choice: эти ... а те
  rationale: Передаёт буквальное противопоставление указательных местоимений, не сглаживая его до «одни ... другие».
- source_word: לְחַיֵּי עוֹלָם
  choice: к вечной жизни
  rationale: Предлог «к» естественно обозначает итог или предназначение, а «вечной» передаёт עוֹלָם и поддерживает параллелизм.
- source_word: חֲרָפוֹת
  choice: к поношениям
  rationale: Множественное число сохраняет форму еврейского существительного и социальный оттенок поношения, укоризны и бесчестия.
- source_word: דִרְאוֹן
  choice: к презрению
  rationale: Редкое слово выражает сильное отвращение или презрение. «Презрение» ясно для современного читателя и не сливается с предшествующими «поношениями».
- source_word: עוֹלָם
  choice: вечной / вечному
  rationale: Оба вхождения переданы последовательно словом «вечный», чтобы сохранить смысл непреходящей длительности и параллелизм стиха.
theological_decisions:
- issue: Объём воскресения, подразумеваемый словом רַבִּים
  choice: Сохранить «многие», не заменяя его словом «все».
  alternative: «Все» как истолкование всеобщего воскресения; «множество» как указание на великое число.
  rationale: В еврейском тексте стоит «многие». Перевод сохраняет эту формулировку и не разрешает средствами перевода вопрос, может ли она в данном контексте охватывать всех умерших.
- issue: Характер отрицательной участи
  choice: 'Передать два отдельных выражения: «к поношениям, к вечному презрению».'
  alternative: «К стыду и вечному отвращению»; «к бесчестию и вечному омерзению».
  rationale: Еврейский текст содержит два связанных, но разных существительных. Их раздельная передача сохраняет напряжённость и полноту формулировки, не сводя её к одному позднейшему догматическому понятию.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Синтаксический параллелизм и метафора сна сохранены; архаизмы и конфессионально окрашенные пояснения не вводятся.
