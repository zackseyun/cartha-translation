base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/003.yaml
  text: And those who have insight will shine like the brightness of the expanse[a], and those who make the many righteous[c][b], like the stars forever and ever.
translation:
  language: ru
  text: А обладающие разумением будут сиять, как сияние небосвода[a], и ведущие многих к праведности[b] — как звёзды, во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «твердь». Еврейское слово обозначает распростёртое небесное пространство; возможен также перевод: «небесный свод».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оправдывающие многих»; более буквально: «делающие многих праведными». Еврейское выражение допускает как признание праведными, так и приведение к праведности.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּשְׂכִּלִים
  choice: обладающие разумением
  rationale: Причастие от שכל обозначает людей, отличающихся пониманием и проницательностью. «Обладающие разумением» сохраняет эту характеристику и звучит достойно и понятно; возможное «мудрые» отмечено косвенно смыслом, но не сужает значение до общего обозначения мудрецов.
- source_word: יַזְהִרוּ
  choice: будут сиять
  rationale: Порода hифиль глагола זהר здесь выражает яркое сияние; русское «будут сиять» естественно сочетается с последующим сравнением.
- source_word: כְּזֹהַר
  choice: как сияние
  rationale: זֹהַר означает блеск, яркость или сияние. Повтор корня по смыслу в выражении «сиять, как сияние» допустим в возвышенной поэтической речи и точно передаёт образ.
- source_word: הָרָקִיעַ
  choice: небосвода
  rationale: רָקִיעַ обозначает распростёртое небесное пространство или свод. «Небосвод» — современное литературное слово, сохраняющее образ лучше, чем обобщённое «небо», и не имеющее архаичности «тверди».
- source_word: וּמַצְדִּיקֵי
  choice: делающие … праведными
  rationale: Причастие hифиля от צדק имеет каузативную силу и допускает значения «делать праведными», «признавать/оправдывать» или «вести к праведности». Основной текст передаёт форму наиболее прямо, не подменяя её исключительно наставническим или судебным смыслом.
- source_word: הָרַבִּים
  choice: многих
  rationale: В русском определённость еврейского выражения естественно передаётся контекстом; буквальное «этих многих» или субстантивированное «множество» было бы тяжеловесно. «Многих» сохраняет количественный охват.
- source_word: כַּכּוֹכָבִים
  choice: как звёзды
  rationale: Прямое и естественное воспроизведение сравнительного оборота.
- source_word: לְעוֹלָם וָעֶד
  choice: во веки веков
  rationale: Устойчивое русское выражение передаёт усиленную формулу вечной длительности и соответствует возвышенному регистру стиха.
theological_decisions:
- issue: Смысл מַצְדִּיקֵי הָרַבִּים
  choice: делающие многих праведными
  alternative: оправдывающие многих; обращающие многих к праведности; ведущие многих к праведности
  rationale: Еврейское каузативное причастие допускает как преобразовательный, так и декларативно-судебный оттенок. Основной текст сохраняет формальную каузативность и богословское напряжение, а примечание представляет основные возможные понимания, не закрепляя позднейшую конфессиональную трактовку.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической интонацией. Синтаксический параллелизм еврейского стиха сохранён; тире во второй половине естественно восполняет подразумеваемое «будут сиять». Все примечания имеют маркеры в основном тексте.
