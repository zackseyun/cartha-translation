  text: וָ/אֶשְׁמַ֞ע אֶת הָ/אִ֣ישׁ לְב֣וּשׁ הַ/בַּדִּ֗ים אֲשֶׁ֣ר מִ/מַּעַל֮ לְ/מֵימֵ֣י הַ/יְאֹר֒ וַ/יָּ֨רֶם יְמִינ֤/וֹ וּ/שְׂמֹאל/וֹ֙ אֶל הַ/שָּׁמַ֔יִם וַ/יִּשָּׁבַ֖ע בְּ/חֵ֣י הָ/עוֹלָ֑ם כִּי֩ לְ/מוֹעֵ֨ד מֽוֹעֲדִ֜ים וָ/חֵ֗צִי וּ/כְ/כַלּ֛וֹת נַפֵּ֥ץ יַד עַם קֹ֖דֶשׁ תִּכְלֶ֥ינָה כָל אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/007.yaml
  text: Then I heard the man clothed in linen[a], who was above the waters of the river, and he raised his right hand and his left hand to heaven and swore by him who lives forever that it would be for a time, times, and half a time; and when the shattering of the power of the holy people is finished[b], all these things will be completed.
translation:
  language: ru
  text: И услышал я человека, одетого в льняные одежды, стоявшего над водами реки. Он поднял к небу обе руки — правую и левую — и поклялся Тем, Кто живёт вечно, что это будет длиться время, времена и половину времени[a]. А когда сила святого народа будет окончательно сокрушена[b], всё это завершится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «на назначенное время, назначенные времена и половину»; многие понимают это как «на год, два года и полгода».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «рука святого народа»; слово «рука» здесь, вероятно, означает силу или могущество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבוּשׁ הַבַּדִּים
  choice: одетый в льняную одежду
  rationale: Естественно передаёт причастную конструкцию и сохраняет конкретный образ льняного одеяния.
- source_word: הַיְאֹר
  choice: река
  rationale: В контексте видения речь идёт о реке; перевод не вносит не требуемого контекстом отождествления с Нилом.
- source_word: וַיָּרֶם יְמִינוֹ וּשְׂמֹאלוֹ
  choice: поднял правую и левую руки
  rationale: Сохраняет явное упоминание обеих рук и торжественный жест клятвы.
- source_word: בְּחֵי הָעוֹלָם
  choice: Живущим вечно
  rationale: Передаёт формулу клятвы с личным божественным референтом; прописная буква показывает титульное употребление без добавления имени.
- source_word: לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: пройдёт время, времена и половина времени
  rationale: Сохраняет загадочность апокалиптической формулы и не определяет единицы как годы; глагольная формулировка естественна в русском после клятвы о длительности.
- source_word: וּכְכַלּוֹת
  choice: и когда ... завершится
  rationale: 'Передаёт временное значение инфинитивной конструкции: событие достигает своего завершения.'
- source_word: נַפֵּץ יַד
  choice: сокрушение силы
  rationale: «Сила» раскрывает метонимическое значение слова «рука», а «сокрушение» сохраняет насильственный оттенок глагольного корня.
- source_word: עַם קֹדֶשׁ
  choice: святой народ
  rationale: Краткий и естественный русский эквивалент для народа, посвящённого Богу.
- source_word: תִּכְלֶינָה כָל אֵלֶּה
  choice: тогда завершится всё это
  rationale: Передаёт достижение предсказанными событиями их конца; «тогда» ясно связывает итог с предшествующим временным условием.
theological_decisions:
- issue: Толкование апокалиптической формулы לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: время, времена и половина времени
  alternative: назначенный срок, назначенные сроки и половина; год, два года и полгода
  rationale: Текст не называет единицы прямо. Формальный перевод сохраняет намеренную неоднозначность и не закрепляет одно хронологическое толкование.
- issue: Метонимическое значение יַד в выражении נַפֵּץ יַד עַם קֹדֶשׁ
  choice: сила святого народа
  alternative: рука святого народа; мощь святого народа
  rationale: В данном сочетании «рука» обозначает силу или могущество. «Сила» понятно передаёт смысл, не ослабляя образ полного сокрушения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены повтор «время, времена» и явное упоминание обеих рук. Формула времени не конкретизирована сверх еврейского текста.
