lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: Последовательная форма wayyiqtol продолжает повествование; русский союз «и» естественно сохраняет связь с предыдущей репликой.
- source_word: לֵךְ
  choice: Иди
  rationale: Прямой и естественный перевод императива הלך; в данном контексте означает, что Даниилу следует оставить вопрос и продолжать свой путь, но расширять это в основном тексте необязательно.
- source_word: דָּנִיֵּאל
  choice: Даниил
  rationale: Устоявшаяся русская форма личного имени.
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно передаёт причинную связь: повеление обосновано тем, что слова остаются недоступными до назначенного срока.'
- source_word: סְתֻמִים
  choice: сокрыты
  rationale: Пассивное причастие от סתם указывает на закрытость или недоступность слов; «сокрыты» звучит естественно и достойно, не смешиваясь со следующим образом печати.
- source_word: וַחֲתֻמִים
  choice: и запечатаны
  rationale: Прямо сохраняет образ документа, скреплённого печатью, и второе пассивное причастие еврейского текста.
- source_word: הַדְּבָרִים
  choice: эти слова
  rationale: דברים здесь относится к ранее сообщённому откровению. Указательное «эти» естественно обозначает данный контекст, хотя формально в еврейском стоит определённый артикль.
- source_word: עַד עֵת קֵץ
  choice: до времени конца
  rationale: Формально и понятно сохраняет характерное для книги Даниила выражение, не уточняя природу или хронологию конца сверх исходного текста.
theological_decisions:
- issue: Эсхатологическое значение עֵת קֵץ
  choice: до времени конца
  alternative: до конца времён
  rationale: Выбранный вариант сохраняет структуру еврейского выражения и его богословскую напряжённость. Альтернатива могла бы ошибочно представить «времена» как множественное число и сильнее истолковать фразу.
- issue: Степень недоступности откровения в סְתֻמִים וַחֲתֻמִים
  choice: сокрыты и запечатаны
  alternative: закрыты и запечатаны
  rationale: Перевод сохраняет два отдельных образа и не определяет, означает ли недоступность прежде всего непонимание, неразглашение или сохранение текста до назначенного срока.
