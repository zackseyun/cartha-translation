reference: Daniel 12:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לָ/אִישׁ֙ לְב֣וּשׁ הַ/בַּדִּ֔ים אֲשֶׁ֥ר מִ/מַּ֖עַל לְ/מֵימֵ֣י הַ/יְאֹ֑ר עַד מָתַ֖י קֵ֥ץ הַ/פְּלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/006.yaml
  text: And he said to the man clothed in linen[a], who was above the waters of the river[b], “How long until the end of these wonders?”
translation:
  language: ru
  text: 'И он сказал человеку, одетому в льняные одежды, который находился над водами реки[a]: «Сколько ещё до конца этих чудес[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потока».'
    reason: У слова יְאֹר возможны значения реки, водного потока или канала; здесь контекст не требует отождествлять его с Нилом.
  - marker: b
    text: 'Или: «этих поразительных событий».'
    reason: הַפְּלָאוֹת может обозначать не только чудеса в узком смысле, но и необычайные, вызывающие изумление события.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: Обычная повествовательная форма глагола אמר; союз сохраняет связь с предшествующим видением, а местоимение не уточняет личность говорящего сверх сказанного в тексте.
- source_word: לָאִישׁ
  choice: человеку
  rationale: Артикль указывает на определённого, уже известного из контекста человека.
- source_word: לְבוּשׁ הַבַּדִּים
  choice: одетому в льняные одежды
  rationale: Причастная конструкция описывает одежду; явное «одежды» естественно по-русски и передаёт множественную форму הַבַּדִּים без предположений о её покрое или священническом назначении.
- source_word: אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר
  choice: который находился над водами реки
  rationale: מִמַּעַל обозначает положение сверху, а יְאֹר здесь лучше передать общим словом «река», не внося не требуемой контекстом отсылки к Нилу.
- source_word: עַד מָתַי
  choice: Сколько ещё
  rationale: Краткий современный русский оборот передаёт вопрос о времени, остающемся до названного предела, без архаического «доколе».
- source_word: קֵץ הַפְּלָאוֹת
  choice: до конца этих чудес
  rationale: קֵץ обозначает конечный предел, а הַפְּלָאוֹת — необычайные, вызывающие изумление события; указательное «этих» естественно связывает их с событиями видения.
theological_decisions:
- issue: Кто говорит и кем является человек в льняных одеждах
  choice: Сохранить простое «он сказал» и описательное обозначение «человек, одетый в льняные одежды».
  alternative: Прямо назвать говорящего ангелом либо отождествить человека в льняных одеждах с Христом.
  rationale: Сам стих не устанавливает таких отождествлений; их добавление устранило бы намеренно сохранённую текстом неопределённость.
- issue: Характер הַפְּלָאוֹת
  choice: Передать как «чудеса», сохраняя широкий смысл необычайных событий.
  alternative: Передать как «поразительные события» или истолковать исключительно как сверхъестественные чудотворения.
  rationale: Еврейское слово допускает акцент как на чудесности, так и на поразительности происходящего; основной текст сохраняет традиционно понятное слово, а примечание отмечает более широкий оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для апокалиптического видения. Синтаксис сделан естественным без архаизма «доколе»; образное пространственное описание и неопределённость действующих лиц сохранены.
