  text: Blessed is the one who waits and reaches the 1,335 days[a].
translation:
  language: ru
  text: Блажен тот, кто ждёт и достигнет тысячи трёхсот тридцати пяти дней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Счастлив тот, кто продолжает ждать и доживёт до тысячи трёхсот тридцати пяти дней».'
    reason: Лексическая альтернатива для אַשְׁרֵי, продолжающегося значения причастия הַמְחַכֶּה и временного смысла וְיַגִּיעַ.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Передаёт состояние благословенности и сохраняет возвышенную форму блаженства, уместную в пророческом контексте.
- source_word: הַמְחַכֶּה
  choice: тот, кто ждёт
  rationale: Причастие обозначает продолжающееся ожидание; русская конструкция естественно передаёт обобщённое единственное число.
- source_word: וְיַגִּיעַ
  choice: и достигнет
  rationale: В данном контексте форма глагола נגע означает достижение указанного временного рубежа.
- source_word: לְיָמִים
  choice: дней
  rationale: Предлог при глаголе указывает на достижение определённого числа дней; по-русски это естественно выражается беспредложным родительным сочетанием после «достигнет».
- source_word: אֶלֶף שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: тысячи трёхсот тридцати пяти
  rationale: Еврейская последовательность числительных составляет 1335; словесная запись поддерживает достоинство и плавность библейского текста.
theological_decisions:
- issue: Смысл блаженства в апокалиптическом исчислении времени
  choice: Временное указание сохранено без истолкования 1335 дней как буквального или символического периода.
  alternative: Понимать число либо как строго буквальный хронологический срок, либо как символическое апокалиптическое число.
  rationale: Еврейский текст провозглашает блаженство тому, кто дождётся указанного срока, но сам не разъясняет характер этого числа; перевод не должен устранять данную богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным звучанием. Формула «Блажен тот» сохраняет характер блаженства; синтаксис остаётся естественным для обычного читателя.
