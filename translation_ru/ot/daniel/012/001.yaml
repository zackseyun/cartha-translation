  - severity: medium
    issue: Неясная временная формулировка
    rationale: «С тех пор, как существует народ, и до того времени» звучит синтаксически сбивчиво. Требуется прямо обозначить диапазон от возникновения народа до названного времени, не заменяя единственное число גּוֹי на множественное.
  - severity: low
