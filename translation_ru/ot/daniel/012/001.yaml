  text: וּ/בָ/עֵ֣ת הַ/הִיא֩ יַעֲמֹ֨ד מִֽיכָאֵ֜ל הַ/שַּׂ֣ר הַ/גָּד֗וֹל הָ/עֹמֵד֮ עַל בְּנֵ֣י עַמֶּ/ךָ֒ וְ/הָיְתָה֙ עֵ֣ת צָרָ֔ה אֲשֶׁ֤ר לֹֽא נִהְיְתָה֙ מִֽ/הְי֣וֹת גּ֔וֹי עַ֖ד הָ/עֵ֣ת הַ/הִ֑יא וּ/בָ/עֵ֤ת הַ/הִיא֙ יִמָּלֵ֣ט עַמְּ/ךָ֔ כָּל הַ/נִּמְצָ֖א כָּת֥וּב בַּ/סֵּֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/001.yaml
  text: And at that time Michael[a], the great prince who stands over the sons of your people, will arise. And there will be a time of distress such as has not happened since there was a nation until that time. And at that time your people will escape[c][b], everyone who is found written in the book.
translation:
  language: ru
  text: И в то время восстанет Михаил, великий князь, стоящий на защите сынов твоего народа[a]. И наступит время бедствия[b], какого не бывало с тех пор, как появился народ, до того времени. И в то время спасётся твой народ — каждый, кто окажется записанным в книге[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стоящий над сынами твоего народа»; также возможно: «стоящий за сынов твоего народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «время скорби».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будет избавлен»; также возможно: «избежит гибели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: восстанет
  rationale: Глагол буквально означает «станет, встанет», а в данном апокалиптическом контексте передаёт решительное выступление Михаила; «восстанет» сохраняет образ и динамику действия.
- source_word: הַשַּׂר הַגָּדוֹל
  choice: великий князь
  rationale: שַׂר обозначает князя, правителя или начальника; в контексте книги Дании традиционное и уместное «князь» сохраняет небесно-политическую образность.
- source_word: הָעֹמֵד עַל
  choice: стоящий за
  rationale: Сочетание буквально связано со стоянием «над/при», но здесь подразумевает защиту или представительство. Русское «стоящий за» естественно передаёт обе возможности без излишней конкретизации.
- source_word: בְּנֵי עַמֶּךָ
  choice: сынов твоего народа
  rationale: Сохранено формальное выражение «сыны народа», обозначающее принадлежащих к народу; родительный оборот звучит литературно и близок к структуре еврейского текста.
- source_word: עֵת צָרָה
  choice: время бедствия
  rationale: צָרָה может означать бедствие, тесноту, скорбь или тяжёлое испытание; «бедствие» ясно и передаёт высокую степень тяжести.
- source_word: אֲשֶׁר לֹא נִהְיְתָה מִהְיוֹת גּוֹי
  choice: какого не бывало с тех пор, как существует народ
  rationale: Формулировка близко передаёт сравнение со всей предшествующей историей существования народа, не уточняя без необходимости, идёт ли речь об одном народе или народах вообще.
- source_word: יִמָּלֵט
  choice: спасётся
  rationale: Нифаль глагола מלט допускает значения «избежать, спастись, быть избавленным». «Спасётся» естественно по-русски и сохраняет неоднозначность между бегством и избавлением.
- source_word: כָּל הַנִּמְצָא כָּתוּב
  choice: каждый, кто будет найден записанным
  rationale: Сохранена формальная конструкция «будет найден записанным», выражающая обнаружение человека среди внесённых в запись.
- source_word: בַּסֵּפֶר
  choice: в книге
  rationale: סֵפֶר может обозначать книгу, свиток или письменную запись; «книга» является естественным соответствием и сохраняет небесный реестр без поясняющего добавления.
theological_decisions:
- issue: Характер действия Михаила
  choice: «восстанет» — Михаил решительно выступает как небесный защитник
  alternative: «встанет» или «станет», с более буквальным и менее явно динамическим оттенком
  rationale: Контекст допускает военное, защитительное или судебное выступление, но не позволяет точнее определить его природу; «восстанет» передаёт активность, не развивая ангелологию сверх текста.
- issue: Смысл יִמָּלֵט
  choice: «спасётся», с открытостью к значениям избавления и выхода невредимым
  alternative: «избежит гибели», «будет избавлен» или «спасётся бегством»
  rationale: Еврейская форма допускает как собственно спасение, так и избавление/бегство. Нейтральное «спасётся» не ограничивает речь только физическим бегством или только богословским спасением.
- issue: Кто подразумевается словом גּוֹי
  choice: сохранено единственное число «народ»
  alternative: обобщающее «народы» или «с тех пор, как появились народы»
  rationale: Масоретский текст имеет единственное число; перевод сохраняет его и не устраняет возможную обобщённость выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим регистром. Повтор «в то время» сохранён как структурный элемент стиха. В заключительном предложении «Но» передаёт смысловой контраст между беспримерным бедствием и спасением народа, хотя еврейский союз формально может быть передан и как «и».
