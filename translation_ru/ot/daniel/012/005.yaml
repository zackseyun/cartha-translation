  text: וְ/רָאִ֨יתִי֙ אֲנִ֣י דָנִיֵּ֔אל וְ/הִנֵּ֛ה שְׁנַ֥יִם אֲחֵרִ֖ים עֹמְדִ֑ים אֶחָ֥ד הֵ֨נָּה֙ לִ/שְׂפַ֣ת הַ/יְאֹ֔ר וְ/אֶחָ֥ד הֵ֖נָּה לִ/שְׂפַ֥ת הַ/יְאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/005.yaml
  text: 'Then I[a], Daniel, looked, and behold, two others were standing: one on this bank of the river, and one on that bank of the river.'
translation:
  language: ru
  text: 'Тогда я, Даниил, увидел: вот, двое других стояли — один на этом берегу реки, а другой на том берегу реки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Тогда я… посмотрел и увидел
  rationale: Сочетание waw с формой qatal продолжает повествование; «тогда» передаёт последовательность, а естественное русское «посмотрел и увидел» сохраняет зрительное восприятие, вводя новую картину видения.
- source_word: אֲנִי דָנִיֵּאל
  choice: я, Даниил
  rationale: Явное местоимение вместе с именем имеет самоидентифицирующую и слегка эмфатическую функцию; конструкция «я, Даниил» естественно сохраняет её по-русски.
- source_word: וְהִנֵּה
  choice: 'и увидел:'
  rationale: Частица привлекает внимание к внезапно открывшейся взору картине. В современном литературном русском эту функцию естественно передают глагольная формула и двоеточие, без архаичного «вот» или «се».
- source_word: שְׁנַיִם אֲחֵרִים
  choice: двое других
  rationale: Форма указывает на двух лиц, отличных от уже присутствующего в контексте; перевод не уточняет их природу.
- source_word: עֹמְדִים
  choice: стояли
  rationale: Причастие изображает продолжающееся положение фигур; русское прошедшее несовершенного вида передаёт фоновую длительность.
- source_word: הֵנָּה
  choice: на этом… на том
  rationale: Дважды употреблённое указание места образует контраст между противоположными берегами; по-русски он ясно выражается параллельной конструкцией «на этом… на том».
- source_word: לִשְׂפַת
  choice: на… берегу
  rationale: Буквально существительное обозначает край или кромку; применительно к реке естественный русский эквивалент — «берег».
- source_word: הַיְאֹר
  choice: реки
  rationale: В данном контексте слово обозначает реку видения; перевод «река» не вносит необоснованного отождествления с Нилом.
theological_decisions:
- issue: Кем были «двое других»
  choice: Сохранено нейтральное «двое других» без уточнения их природы.
  alternative: «два других ангела» или «два других небесных существа»
  rationale: Еврейский текст этого стиха не называет их ангелами и не определяет иначе; конкретизация внесла бы отсутствующее в тексте богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным звучанием. Синтаксический параллелизм двух берегов сохранён; архаизмы и конфессионально окрашенные уточнения исключены.
