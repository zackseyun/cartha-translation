source:
  edition: WLC
  text: יִ֠תְבָּֽרֲרוּ וְ/יִֽתְלַבְּנ֤וּ וְ/יִצָּֽרְפוּ֙ רַבִּ֔ים וְ/הִרְשִׁ֣יעוּ רְשָׁעִ֔ים וְ/לֹ֥א יָבִ֖ינוּ כָּל רְשָׁעִ֑ים וְ/הַ/מַּשְׂכִּלִ֖ים יָבִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/010.yaml
  text: Many will purify themselves and make themselves white and be refined[a], but the wicked will act wickedly; and none of the wicked will understand[b], but those who have insight will understand.
translation:
  language: ru
  text: Многие очистятся, убелятся и будут очищены плавлением[a], а нечестивые будут поступать нечестиво. Никто из нечестивых не поймёт, но обладающие разумением[b] поймут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Многие будут очищены, убелены и очищены плавлением». Формы первых двух еврейских глаголов допускают пассивный смысл, хотя могут иметь и возвратный или средний оттенок, отражённый в основном тексте.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «мудрые».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְבָּרֲרוּ
  choice: очистятся
  rationale: Форма хитпаэль допускает возвратное или средне-пассивное понимание. Русское «очистятся» естественно передаёт процесс очищения, не называя явно действующее лицо и не устраняя заложенную в форме неоднозначность.
- source_word: יִתְלַבְּנוּ
  choice: убелятся
  rationale: Хитпаэль от לבן буквально передаёт становление белыми или убеление. «Убелятся» сохраняет конкретный образ белизны и одновременно допускает смысл очищения.
- source_word: יִצָּרְפוּ
  choice: будут переплавлены
  rationale: Нифаль от צרף обозначает очищение металла посредством плавки. «Будут переплавлены» сохраняет пассивную форму и металлургический образ испытующего очищения.
- source_word: רַבִּים
  choice: многие
  rationale: Субстантивированное прилагательное обозначает неопределённое множество людей; «многие» передаёт это кратко и естественно.
- source_word: הִרְשִׁיעוּ רְשָׁעִים
  choice: нечестивые будут поступать нечестиво
  rationale: Сочетание однокоренных слов подчёркивает нечестивый характер действий. Русская формулировка сохраняет этот корневой повтор без неестественной тяжеловесности.
- source_word: וְלֹא יָבִינוּ כָּל רְשָׁעִים
  choice: никто из нечестивых не поймёт
  rationale: Еврейская конструкция «все» при отрицательном глаголе выражает полное отрицание. По-русски это естественно передаётся словами «никто из нечестивых».
- source_word: הַמַּשְׂכִּלִים
  choice: обладающие разумением
  rationale: Причастие от שכל обозначает людей, способных разуметь и распознавать. Выбор сохраняет связь с последующим глаголом «поймут» и не расширяет значение до общей характеристики «мудрые».
- source_word: יָבִינוּ
  choice: поймут
  rationale: Глагол בין означает понимать или различать. «Поймут» ясно сохраняет прямое противопоставление двух групп в стихе.
theological_decisions:
- issue: Передавать ли первые три глагола как действие самих людей или как совершаемое над ними очищение
  choice: В основном тексте первые два глагола переданы формами «очистятся» и «убелятся», допускающими средне-возвратный оттенок, а третий — пассивным «будут переплавлены».
  alternative: «Многие будут очищены, убелены и переплавлены».
  rationale: Первые два еврейских глагола стоят в хитпаэле и допускают возвратное либо средне-пассивное понимание; третий стоит в нифале и естественнее звучит пассивно. Перевод сохраняет эту грамматическую неоднородность и не называет Бога действующим лицом там, где текст прямо этого не делает.
- issue: Перевод הַמַּשְׂכִּלִים как характеристики мудрости или способности понимать
  choice: «обладающие разумением»
  alternative: «мудрые»
  rationale: В книге Даниила слово может обозначать мудрых и проницательных людей, однако здесь его корневая связь с глаголом «поймут» особенно заметна. Основной вариант сохраняет эту связь, не привнося более широкую категорию мудрости.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. «Убелятся» и «будут переплавлены» сохраняют конкретные образы оригинала; синтаксис разделён на два предложения для ясности без изменения смыслового противопоставления.
