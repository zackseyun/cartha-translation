base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/013.yaml
  text: But as for you[a], go to the end[d][c][b]; and you will rest and stand in your allotted place at the end of the days.
translation:
  language: ru
  text: А ты иди до конца[a]; и упокоишься[b], и встанешь, чтобы получить свой удел[c], в конце дней[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иди к концу» либо «иди своим путём до конца».'
    reason: lexical_alternative
  - marker: b
    text: «Упокоишься», вероятно, означает, что Даниил умрёт прежде окончательного свершения.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «встанешь для своего жребия»; то есть получишь назначенную тебе долю или наследие. В контексте слова «встанешь» могут также подразумевать воскресение.'
    reason: lexical_alternative
  - marker: d
    text: Выражение «в конце дней» имеет эсхатологический смысл; ср. Дан. 12:2.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Союз с самостоятельным местоимением обозначает контрастный переход от видений к личной участи Даниила; «А ты» естественно передаёт этот оттенок по-русски.
- source_word: לֵךְ לַקֵּץ
  choice: иди до конца
  rationale: Императив הלך передаёт повеление идти своим путём, а לַקֵּץ указывает на конечный предел. Формулировка сохраняет краткость и допускаемую неоднозначность выражения.
- source_word: וְתָנוּחַ
  choice: и упокоишься
  rationale: נוח означает покоиться, отдыхать. В контексте подразумевается смерть Даниила до окончательного свершения, однако перевод не делает этот смысл более явным, чем еврейский текст.
- source_word: וְתַעֲמֹד
  choice: и встанешь
  rationale: עמד буквально означает «стоять, встать». Русское «встанешь» сохраняет образ и его возможный эсхатологический оттенок, не превращая его в прямое утверждение о воскресении.
- source_word: לְגֹרָלְךָ
  choice: чтобы получить свой удел
  rationale: גּוֹרָל буквально означает «жребий», а также определённую жребием долю или удел. Контекстуальное выражение понятно современному читателю и передаёт назначенную Даниилу долю.
- source_word: לְקֵץ הַיָּמִין
  choice: в конце дней
  rationale: Формулировка близко передаёт эсхатологическое выражение «к концу дней», не уточняя сверх текста, какие именно дни имеются в виду.
theological_decisions:
- issue: Означает ли וְתָנוּחַ прямо смерть Даниила
  choice: Сохранено «упокоишься» без прямого добавления «умрёшь».
  alternative: «умрёшь и упокоишься» или «уснёшь смертным сном»
  rationale: Контекст предполагает смерть до окончательного свершения, но сам глагол означает покой; перевод сохраняет недосказанность оригинала.
- issue: Следует ли передавать וְתַעֲמֹד как прямое указание на воскресение
  choice: Передано «встанешь».
  alternative: «воскреснешь»
  rationale: Контекст Даниила 12 допускает и усиливает воскресный смысл, однако עמד буквально означает «стоять/встать». Прямое «воскреснешь» устранило бы подлинную смысловую напряжённость.
- issue: Смысл לְגֹרָלְךָ
  choice: «чтобы получить свой удел»
  alternative: «для своего жребия» или «на своём месте, определённом тебе по жребию»
  rationale: Речь может идти о назначенной доле, наследии или месте. Основной текст передаёт общий смысл удела, а примечание сохраняет буквальный образ жребия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Упокоишься» выбрано как понятное, но возвышенное слово, сохраняющее связь покоя со смертью. Пунктуация делает последовательность повеления и обещания ясной; богословские выводы не конкретизированы сверх еврейского текста.
