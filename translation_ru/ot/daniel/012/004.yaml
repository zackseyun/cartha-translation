  text: וְ/אַתָּ֣ה דָֽנִיֵּ֗אל סְתֹ֧ם הַ/דְּבָרִ֛ים וַ/חֲתֹ֥ם הַ/סֵּ֖פֶר עַד עֵ֣ת קֵ֑ץ יְשֹׁטְט֥וּ רַבִּ֖ים וְ/תִרְבֶּ֥ה הַ/דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/004.yaml
  text: But you[a], Daniel, shut up the words and seal the book until the time of the end. Many will roam about[b], and knowledge will increase.
translation:
  language: ru
  text: А ты, Даниил, сокрой эти слова и запечатай книгу[a] до времени конца. Многие будут странствовать[b], и знание умножится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свиток».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут бегать туда и сюда». Еврейский глагол может также указывать на поиск или исследование; тогда возможен смысл: «Многие будут искать, и знание умножится».'
    reason: alternative_reading
lexical_decisions:
- source_word: סְתֹם
  choice: сокрой
  rationale: Повелительная форма передаёт идею закрытия и недоступности полученного откровения. «Сокрой» естественно звучит по-русски и сохраняет апокалиптический образ, не утверждая, что слова должны навсегда остаться неизвестными.
- source_word: הַדְּבָרִים
  choice: эти слова
  rationale: דבר может означать «слово» или «дело»; здесь речь идёт о только что сообщённом Даниилу откровении, поэтому «эти слова» ясно указывает на ближайший контекст.
- source_word: חֲתֹם
  choice: запечатай
  rationale: Глагол обозначает наложение печати на письменный документ; «запечатай» сохраняет конкретный образ сохранности и ограниченного доступа.
- source_word: הַסֵּפֶר
  choice: книгу
  rationale: סֵפֶר обозначает письменный документ, в данном культурном контексте обычно свиток. «Книга» — естественный широкий русский эквивалент; материальная форма уточнена в сноске.
- source_word: עַד עֵת קֵץ
  choice: до времени конца
  rationale: Буквальная и устоявшаяся формулировка сохраняет эсхатологический смысл выражения, не конкретизируя природу или дату конца.
- source_word: יְשֹׁטְטוּ רַבִּים
  choice: Многие будут странствовать
  rationale: שוטט описывает движение туда и сюда, хождение или разыскивание. «Будут странствовать» сохраняет общий образ передвижения, а возможный смысл поиска разъясняется в сноске.
- source_word: וְתִרְבֶּה הַדָּעַת
  choice: и знание умножится
  rationale: רבה означает увеличение или умножение, а דעת — знание. Формулировка близка к еврейскому тексту и не решает заранее, идёт ли речь об общем знании или о понимании пророчества.
theological_decisions:
- issue: Смысл יְשֹׁטְטוּ רַבִּים וְתִרְבֶּה הַדָּעַת
  choice: Сохранено общее утверждение о странствовании многих и умножении знания без уточнения, имеется ли в виду физическое передвижение, исследование текста или рост понимания пророчества.
  alternative: 'Возможны чтения: «многие будут бегать туда и сюда, и общее человеческое знание возрастёт» либо «многие будут исследовать книгу, и понимание пророчества возрастёт».'
  rationale: Еврейская формулировка допускает несколько оттенков. Основной текст не связывает стих исключительно ни с развитием транспорта и технологий, ни с изучением пророческой книги.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и ясен; формулировки сохраняют образность и неоднозначность еврейского текста. Маркер [a] поставлен после слова «книгу», к которому относится сноска.
