  yaml_path: translation/ot/daniel/010/009.yaml
  text: Then I heard the sound of his words[a], and when I heard the sound of his words, I fell into a deep sleep on my face[b], with my face to the ground.
translation:
  language: ru
  text: И я услышал звук его слов[a]. И когда я услышал звук его слов, я погрузился в глубокий сон[b], лёжа лицом вниз, и лицо моё было обращено к земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голос его слов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заснул глубоким сном»; еврейское слово обозначает глубокий, тяжёлый сон и может подразумевать подобное сну оцепенение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: И услышал я
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; такой порядок слов естественно сохраняет торжественный библейский регистр без архаизации.
- source_word: קוֹל דְּבָרָיו
  choice: звук его слов
  rationale: קוֹל может означать и «звук», и «голос», а דְּבָרָיו — «его слова». Выбранный вариант сохраняет необычное сочетание и не сводит его однозначно к голосу говорящего.
- source_word: וּכְשָׁמְעִי
  choice: Когда же я услышал
  rationale: Конструкция с כְּ имеет временное значение. Частица «же» плавно передаёт связь с предыдущей фразой и сохраняет повтор исходного текста.
- source_word: נִרְדָּם
  choice: впал в глубокий сон
  rationale: Нифаль от רדם обозначает глубокий, тяжёлый сон или оцепенение, подобное сну. «Впал» передаёт наступление описанного состояния, не вводя специального понятия транса.
- source_word: עַל פָּנַי
  choice: лёжа лицом вниз
  rationale: Естественная русская передача положения «на лице», не предполагающая дополнительно поклонения как истолкования.
- source_word: וּפָנַי אָרְצָה
  choice: и лицо моё было обращено к земле
  rationale: Сохраняет отдельную, усиливающую картину исходного текста и направительное значение אָרְצָה — «к земле».
theological_decisions:
- issue: Характер состояния Даниила во время видения
  choice: глубокий сон при телесном падении лицом вниз
  alternative: экстатический транс или оцепенение
  rationale: נִרְדָּם прежде всего обозначает глубокий, тяжёлый сон. Перевод не исключает состояния потрясения, но и не вводит отсутствующий в тексте технический термин «транс».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Лексический повтор «услышал звук его слов» сохранён как значимая особенность еврейского текста; синтаксис сделан естественным для современного читателя.
