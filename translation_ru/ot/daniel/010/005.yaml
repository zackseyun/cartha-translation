  variant: modern literary Russian
source:
  edition: WLC
  text: וָ/אֶשָּׂ֤א אֶת עֵינַ/י֙ וָ/אֵ֔רֶא וְ/הִנֵּ֥ה אִישׁ אֶחָ֖ד לָב֣וּשׁ בַּדִּ֑ים וּ/מָתְנָ֥י/ו חֲגֻרִ֖ים בְּ/כֶ֥תֶם אוּפָֽז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/005.yaml
  text: I lifted up my eyes and looked[a], and behold, a man clothed in linen, with his waist girded with the gold of Uphaz.
translation:
  language: ru
  text: 'Я поднял глаза и увидел: вот — человек, одетый в льняные одежды; его стан был опоясан золотом Уфаза[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чистым золотом из Уфаза». Еврейское выражение может указывать как на высокое качество золота, так и на его происхождение.'
    reason: 'Лексическая альтернатива: כֶּתֶם может подчёркивать чистоту или высокое качество золота, тогда как сочетание с Уфазом допускает указание на его происхождение.'
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת עֵינַי
  choice: Я поднял глаза
  rationale: Сохранён естественный и для русского языка образ направления взгляда; явное упоминание глаз не сглажено, поскольку далее отдельно стоит глагол ראׂה.
- source_word: וָאֵרֶא
  choice: и увидел
  rationale: Основное значение ראׂה — «видеть, увидеть». В русском сочетание «поднял глаза и увидел» естественно передаёт последовательность двух действий.
- source_word: וְהִנֵּה
  choice: вот
  rationale: «Вот» сохраняет указательную силу частицы и торжественную непосредственность видения без излишней архаизации.
- source_word: אִישׁ אֶחָד
  choice: человек
  rationale: Фраза обозначает одного человека мужского пола. Русское «человек» звучит естественно и не добавляет к описанию указания на ангельскую или божественную природу фигуры.
- source_word: לָבוּשׁ בַּדִּים
  choice: одетый в льняные одежды
  rationale: בַּדִּים обозначает лён или льняные одежды; развёрнутая передача ясна современному читателю и не уточняет вид одежды сверх текста.
- source_word: מָתְנָיו חֲגֻרִים
  choice: его стан был опоясан
  rationale: Оборот передаёт область поясницы и пассивный образ опоясывания в современном литературном русском, избегая архаического «чресла».
- source_word: בְּכֶתֶם אוּפָז
  choice: золотом Уфаза
  rationale: כֶּתֶם означает драгоценное, очищенное золото, а אוּפָז передано как имя собственное. Основной текст сохраняет компактность и возможную связь золота с Уфазом; оттенок качества отмечен в сноске.
theological_decisions:
- issue: Кем является фигура в видении
  choice: Нейтральное описание «человек» без дальнейшего отождествления
  alternative: Ангельское существо, Мессия или богоявление
  rationale: В данном стихе фигура описана по внешнему виду и одежде, но прямо не названа ни ангелом, ни Мессией, ни явлением Бога. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом, подходящим для рассказа о видении. Архаизмы вроде «чресла» и «се» не используются; образность и синтаксическая торжественность оригинала сохранены.
