base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/004.yaml
  text: On the twenty-fourth day of the first month[a], I was by the side of the great river—that is, the Tigris.
translation:
  language: ru
  text: В двадцать четвертый день первого месяца я был у великой реки — Тигра[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское название: Хиддекель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: В двадцать четвертый день
  rationale: Еврейская календарная формула использует количественное числительное, но по-русски дата естественно передаётся порядковым числительным. Начальный союз отдельно не выражен, поскольку связь с контекстом и без него ясна.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: первого месяца
  rationale: Передаёт указание на первый месяц календаря без добавления отсутствующего в тексте названия месяца.
- source_word: וַאֲנִי הָיִיתִי
  choice: я был
  rationale: Простая и естественная передача глагола бытия, который здесь указывает местонахождение Даниила.
- source_word: עַל יַד
  choice: у
  rationale: Идиома означает нахождение рядом, возле чего-либо. Русское «у» естественно передаёт пространственный смысл, не конкретизируя его до «на берегу», чего исходный текст прямо не говорит.
- source_word: הַנָּהָר הַגָּדוֹל
  choice: великой реки
  rationale: Сохраняет прямое значение существительного с определением и традиционно возвышенный, но понятный современному читателю регистр.
- source_word: הוּא חִדָּקֶל
  choice: то есть Тигра[a]
  rationale: Местоимение הוּא вводит пояснение, естественно передаваемое словами «то есть». Для חִדָּקֶל использовано общепринятое русское название реки — «Тигр», а еврейская форма отмечена в сноске.
