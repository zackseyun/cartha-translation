  text: Again one with the appearance of a man touched me and strengthened me[a].
translation:
  language: ru
  text: И снова меня коснулся и укрепил тот, кто выглядел как человек[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобный человеку»; букв.: «как облик человека». Еврейское выражение описывает видимое сходство, не утверждая прямо, что этот некто был человеком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: снова
  rationale: Глагол יסף перед следующим личным глаголом обозначает повторение действия; «снова» естественно передаёт значение «ещё раз».
- source_word: וַיִּגַּע בִּי
  choice: коснулся меня
  rationale: נגע с предлогом ב здесь обозначает физическое прикосновение в ходе видения; контекст не предполагает удара.
- source_word: כְּמַרְאֵה אָדָם
  choice: некто с обликом человека
  rationale: מַרְאֶה указывает на видимый облик, а כ — на подобие. Формулировка описывает фигуру, не утверждая, что она была обычным человеком.
- source_word: וַיְחַזְּקֵנִי
  choice: укрепил меня
  rationale: Пиэль от חזק означает «укрепить, придать сил» и сохраняет как физическую, так и внутреннюю сторону переживания Даниила.
theological_decisions:
- issue: Кем является фигура с человеческим обликом
  choice: Передать только данное в тексте описание, не определяя её природу
  alternative: Прямо назвать фигуру ангелом или предвечным Христом
  rationale: Еврейский текст сообщает лишь о человеческом облике фигуры; её более точное отождествление выходило бы за пределы данного стиха и устраняло бы сохранённую в нём неопределённость.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет повторное действие, физическое прикосновение и последующее укрепление. Слово «некто» позволяет естественно выразить подразумеваемого участника видения, не уточняя его личность.
