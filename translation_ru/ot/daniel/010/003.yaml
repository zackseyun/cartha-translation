base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/003.yaml
  text: I ate no delicacies[a], and no meat or wine entered my mouth, nor did I anoint myself at all[b], until the completion of three full weeks.
translation:
  language: ru
  text: Изысканной пищи[a] я не ел, мясо и вино не входили в мои уста, и я совсем не умащал себя — пока не исполнились три полные недели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб желанных вещей»; то есть отборная, приятная пища.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «три недели дней»; то есть три полные недели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֲמֻדוֹת
  choice: изысканная пища
  rationale: Буквально «хлеб желанных/драгоценных вещей»; в данном контексте это идиома, обозначающая отборную, приятную пищу, а не только хлеб.
- source_word: בָשָׂר
  choice: мясо
  rationale: В контексте еды это естественный и точный русский эквивалент.
- source_word: יַיִן
  choice: вино
  rationale: Прямой и общепринятый эквивалент.
- source_word: לֹא בָא אֶל־פִּי
  choice: не входили в мои уста
  rationale: Сохраняет образ еврейского текста и при этом ясно передаёт полное воздержание от употребления.
- source_word: סוֹךְ ... סָכְתִּי
  choice: совсем не умащал себя
  rationale: Глагол означает нанесение масла на тело как часть обычного ухода или освежения; «умащал себя» точно передаёт действие, а «совсем» отражает усиленное отрицание.
- source_word: עַד מְלֹאת
  choice: пока не исполнились
  rationale: Естественно по-русски выражает завершение указанного периода.
- source_word: שְׁלֹשֶׁת שָׁבֻעִים יָמִים
  choice: три полные недели
  rationale: Буквально «три недели дней»; смысл выражения — три полных, обычных недельных периода.
