base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/008.yaml
  text: So I alone was left and saw this great vision[a], and no strength remained in me; my splendor was turned to ruin upon me[b], and I retained no strength.
translation:
  language: ru
  text: А я остался один и увидел это великое видение[a]. Во мне не осталось сил; мой цветущий вид сменился измождённостью[b], и я не сохранил сил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это великое явление»; или: «это великое зрелище».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «моё великолепие обратилось во мне в разрушение». Возможно также: «мой облик пришёл в упадок» или «моя жизненная сила истощилась».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַרְתִּי לְבַדִּי
  choice: я остался один
  rationale: Передаёт значение שׁאר «остаться» и подчёркивающий оборот לְבַדִּי «один» естественным современным русским языком.
- source_word: הַמַּרְאָה הַגְּדֹלָה הַזֹּאת
  choice: это великое видение
  rationale: מַרְאָה может означать видимое явление, зрелище или видение; в откровенном контексте Дан. 10 слово «видение» наиболее естественно, а варианты сохранены в сноске.
- source_word: כֹּחַ
  choice: силы
  rationale: В обоих случаях речь идёт о телесной способности Даниила держаться; русское «силы» точно и идиоматично передаёт это значение.
- source_word: הוֹדִי
  choice: мой цветущий вид
  rationale: Буквально הוֹדִי означает «моё великолепие/сияние», но здесь обозначает обычный здоровый, достойный внешний вид Даниила. «Цветущий вид» естественно выражает эту контекстуальную сторону, не сводя выражение только к чертам лица.
- source_word: נֶהְפַּךְ עָלַי לְמַשְׁחִית
  choice: сменился измождённым
  rationale: Оборот описывает резкое превращение здорового облика в разрушенное, болезненное состояние. Такое выражение по-русски естественно передаёт результат, тогда как буквальное «обратился на мне в разрушение» было бы непонятно.
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: я совсем лишился сил
  rationale: עצר здесь означает удержать или сохранить силу. Формулировка передаёт полную неспособность сохранить её и естественно завершает стих.
theological_decisions:
- issue: Характер מַרְאָה в апокалиптическом контексте
  choice: видение
  alternative: явление; зрелище
  rationale: Контекст носит откровенный характер, однако лексическая неоднозначность слова не устраняется и отмечена в сноске.
- issue: Значение הוֹדִי применительно к состоянию Даниила
  choice: мой цветущий вид
  alternative: моё великолепие; мой облик; моя жизненная сила
  rationale: В данном контексте слово, буквально связанное с великолепием или сиянием, вероятнее всего описывает заметно изменившийся здоровый внешний вид Даниила. Выбор не вводит особого богословского толкования, а альтернативы указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; повтор слова «силы» сохранён, поскольку он структурно и смыслово подчёркнут в еврейском тексте. Необычная образность второй части передана естественно, а более буквальная форма и лексические варианты вынесены в сноску.
