base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/007.yaml
  text: And I[a], Daniel, alone saw the vision, and the men who were with me did not see the vision; but a great trembling fell upon them[b], and they fled to hide themselves.
translation:
  language: ru
  text: Только я, Даниил, видел это видение; мужчины же, бывшие со мной, видения не видели. Но великий трепет охватил их[a], и они убежали, чтобы спрятаться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великий ужас напал на них». Еврейское слово חֲרָדָה может означать дрожь, страх или ужас.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они убежали и спрятались»; «они скрылись». Еврейская форма בְּהֵחָבֵא может указывать на цель или на образ действия при бегстве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אֲנִי דָנִיֵּאל לְבַדִּי
  choice: Только я, Даниил, видел
  rationale: Эксплицитное местоимение и לְבַדִּי подчёркивают, что видение видел один Даниил; такой порядок слов естественно передаёт эмфазу по-русски.
- source_word: הַמַּרְאָה
  choice: видение
  rationale: В апокалиптическом контексте существительное обозначает явленное Даниилу зрелище или откровение; «видение» точно и естественно передаёт смысл.
- source_word: וְהָאֲנָשִׁים אֲשֶׁר הָיוּ עִמִּי
  choice: люди же, бывшие со мной
  rationale: אֲנָשִׁים здесь обозначает находившихся с Даниилом мужчин или людей; «люди» не добавляет отсутствующей в контексте информации, а частица «же» ясно выражает противопоставление.
- source_word: לֹא רָאוּ אֶת הַמַּרְאָה
  choice: видения не видели
  rationale: Повтор корня и существительного сохраняет прямой контраст с тем, что Даниил видел видение.
- source_word: חֲרָדָה גְדֹלָה נָפְלָה עֲלֵיהֶם
  choice: великий трепет охватил их
  rationale: חֲרָדָה совмещает значения дрожи, страха и ужаса. «Трепет» сохраняет телесно-эмоциональную многозначность, а «охватил» естественно передаёт еврейскую идиому «пал на них».
- source_word: וַיִּבְרְחוּ
  choice: и они убежали
  rationale: Глагол сообщает о поспешном бегстве и продолжает повествовательную последовательность.
- source_word: בְּהֵחָבֵא
  choice: чтобы спрятаться
  rationale: Инфинитив допускает оттенок цели или сопутствующего образа действия; основной текст передаёт наиболее естественное целевое понимание.
