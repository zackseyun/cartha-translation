base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/016.yaml
  text: And behold[a], something like the likeness of a son of man touched my lips. Then I opened my mouth and spoke, and I said to the one standing before me, “My lord, because of the vision my pains have come upon me[c][b], and I have retained no strength.”
translation:
  language: ru
  text: 'И вот, нечто, подобное человеческому облику[a], коснулось моих уст. Тогда я открыл рот, заговорил и сказал стоявшему передо мной: «Господин мой, из-за этого видения меня охватили муки[b], и сил у меня не осталось[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально выражение необычно и многослойно: «как подобие сынов человеческих», то есть людей. Возможный перевод: «некто в человеческом облике».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «меня охватила мучительная боль» или «на меня напали страдания». Исходное выражение описывает сильнейшую боль или тревогу, овладевшую Даниилом.'
    reason: lexical_alternative
  - marker: c
    text: 'Более буквально: «и я не сохранил силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְמוּת בְּנֵי אָדָם
  choice: подобный обликом человеку
  rationale: 'Сочетание намеренно многослойно: כְּ выражает подобие, דְּמוּת — облик или образ, а בְּנֵי אָדָם — людей, человеческий род. Русская формулировка сохраняет сравнение и неопределённость видения, но не превращает выражение в титул «Сын Человеческий».'
- source_word: נֹגֵעַ עַל שְׂפָתָי
  choice: коснулся моих уст
  rationale: Глагол נגע с עַל обозначает прикосновение. Причастие мужского рода в последовательности повествования естественно передаётся русским глаголом прошедшего времени.
- source_word: וָאֶפְתַּח פִּי
  choice: Тогда я открыл рот
  rationale: Сохранён обычный древнееврейский оборот, обозначающий начало речи; «тогда» ясно передаёт последовательность событий.
- source_word: וָאֲדַבְּרָה וָאֹמְרָה
  choice: заговорил и сказал
  rationale: Оба исходных глагола сохранены без неестественного для современного русского повтора «говорил и сказал».
- source_word: הָעֹמֵד לְנֶגְדִּי
  choice: стоявшему передо мной
  rationale: לְנֶגֶד может означать положение перед кем-либо или напротив него; выбран естественный русский оборот, не исключающий пространственного смысла.
- source_word: אֲדֹנִי
  choice: Господин мой
  rationale: Это почтительное обращение к небесному существу, а не имя Яхве. Формулировка сохраняет почтительность, не отождествляя собеседника с Господом.
- source_word: בַּמַּרְאָה
  choice: из-за этого видения
  rationale: Предлог בְּ здесь естественно понимать как указание на причину состояния Даниила. Указательное «этого» связывает слова с только что переживаемым видением.
- source_word: נֶהֶפְכוּ צִירַי עָלַי
  choice: меня охватили муки
  rationale: צִירִים обозначает сильные боли, муки или схваткообразные страдания, а всё выражение описывает страдание, внезапно овладевшее Даниилом. Перевод передаёт интенсивность, не уточняя сверх текста её телесный или душевный характер.
- source_word: וְלֹא עָצַרְתִּי כֹחַ
  choice: и сил у меня не осталось
  rationale: עצר в этом сочетании выражает сохранение или удержание силы. Идиоматический русский перевод ясно передаёт полное изнеможение.
theological_decisions:
- issue: Значение בְּנֵי אָדָם в описании видения
  choice: общее указание на человеческий облик
  alternative: титульное «Сын Человеческий»
  rationale: Форма множественного числа находится внутри сравнительного оборота и обозначает людей или человеческий род. Контекст не даёт оснований превращать её в мессианский титул.
- issue: Передача אֲדֹנִי
  choice: Господин мой
  alternative: Господь мой
  rationale: Это уважительное обращение к стоящему перед Даниилом существу, а не передача имени Яхве. «Господин» сохраняет различие и не предрешает личность собеседника.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования о видении. Синтаксис остаётся близким к древнееврейской последовательности, но устранены неестественные кальки. «Уста» и обращение «Господин мой» поддерживают возвышенный регистр без излишней архаизации.
