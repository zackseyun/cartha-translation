  text: אֲבָל֙ אַגִּ֣יד לְ/ךָ֔ אֶת הָ/רָשׁ֥וּם בִּ/כְתָ֖ב אֱמֶ֑ת וְ/אֵ֨ין אֶחָ֜ד מִתְחַזֵּ֤ק עִמִּ/י֙ עַל אֵ֔לֶּה כִּ֥י אִם מִיכָאֵ֖ל שַׂרְ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/021.yaml
  text: But I will tell you what is recorded in the writing of truth[a]. And there is no one who stands firmly with me against these except Michael[b], your prince.
translation:
  language: ru
  text: Но я скажу тебе, что записано в писании истины[a]. И нет никого, кто твёрдо стоит вместе со мной против них[b], кроме Михаила, вашего князя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что написано в писании истины».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто поддерживает меня в этих делах». Еврейское выражение может означать, что кто-либо твёрдо стоит рядом с говорящим; слова «против них» могут относиться либо к враждебным силам, либо к обсуждаемым делам.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲבָל
  choice: Но
  rationale: Передаёт противопоставление предыдущему рассуждению прямо и естественно.
- source_word: אַגִּיד לְךָ
  choice: я скажу тебе
  rationale: Естественно передаёт каузативную форму נגד в значении «сообщить, объявить, поведать», сохраняя будущее значение и прямое обращение.
- source_word: הָרָשׁוּם
  choice: что записано
  rationale: Передаёт субстантивированное страдательное причастие от רשם как нечто внесённое в письменную запись.
- source_word: בִּכְתָב אֱמֶת
  choice: в писании истины
  rationale: Сохраняет значение כְּתָב как письменного документа и конструкцию с אֱמֶת, не уточняя без необходимости, идёт ли речь именно о книге или свитке.
- source_word: וְאֵין אֶחָד
  choice: И нет никого
  rationale: Естественная русская передача отрицательной бытийной конструкции с אֶחָד.
- source_word: מִתְחַזֵּק עִמִּי
  choice: кто твёрдо стоял бы вместе со мной
  rationale: Передаёт возвратно-интенсивный оттенок התחזק как проявление стойкости рядом с говорящим, избегая буквального и неестественного «укрепляет себя».
- source_word: עַל אֵלֶּה
  choice: против них
  rationale: В контексте небесного противостояния עַל вероятнее всего имеет противительное значение; местоимение оставляет референт зависимым от контекста.
- source_word: כִּי אִם
  choice: кроме
  rationale: Естественно передаёт исключительную конструкцию после отрицания.
- source_word: מִיכָאֵל
  choice: Михаил
  rationale: Общепринятая русская форма личного имени.
- source_word: שַׂרְכֶם
  choice: вашего князя
  rationale: Сохраняет титул שַׂר и его связь с народом Даниила, не добавляя отсутствующего в стихе определения «архангел».
theological_decisions:
- issue: Личность и роль Михаила
  choice: «Михаила, вашего князя»
  alternative: «Михаила, вашего архангела» или истолкование Михаила как символического представителя Израиля
  rationale: Стих называет Михаила שַׂרְכֶם — «вашим князем» — и не употребляет здесь термин «архангел»; перевод сохраняет собственную формулировку текста и не разрешает более широкий богословский вопрос.
- issue: К чему относится עַל אֵלֶּה
  choice: «против них»
  alternative: «в этих делах» / «в этом»
  rationale: Контекст борьбы поддерживает противительное понимание, но грамматика допускает отнесение выражения к обсуждаемым делам; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка «писание истины» намеренно сохраняет образ письменного небесного документа, не конкретизируя его как книгу или свиток. Строчная буква в слове «писание» не превращает выражение автоматически в позднейшее название канонического Писания.
