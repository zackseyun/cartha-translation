base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/015.yaml
  text: And when he spoke these words with me[b][a], I set my face toward the ground and became speechless.
translation:
  language: ru
  text: Когда он говорил со мной, произнося эти слова[a], я опустил лицо к земле и онемел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пока он говорил со мной, произнося эти слова».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и лишился дара речи»; возможно также: «и стал безмолвен» или «и был приведён к молчанию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ
  choice: Когда он говорил
  rationale: Конструкция ב с инфинитивом в сопряжённой форме и местоименным суффиксом имеет временное значение. Несовершенный вид естественно передаёт происходившую речь, не навязывая точного соотношения моментов.
- source_word: עִמִּי
  choice: со мной
  rationale: Прямо передаёт обычное значение предлога עִם и естественно звучит по-русски в сочетании «говорил со мной».
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В непосредственном контексте речи דְּבָרִים означает именно слова; указательное местоимение передано как «эти».
- source_word: נָתַתִּי פָנַי אַרְצָה
  choice: я опустил лицо к земле
  rationale: Так естественно передаётся еврейский образ направления лица вниз. Буквальное «обратил/положил лицо» в современном русском здесь звучало бы неясно или искусственно.
- source_word: אַרְצָה
  choice: к земле
  rationale: Форма с направительным окончанием указывает движение или направленность к земле.
- source_word: וְנֶאֱלָמְתִּי
  choice: и онемел
  rationale: Кратко и естественно передаёт наступившую неспособность говорить, не обязательно подразумевая постоянную физическую немоту.
