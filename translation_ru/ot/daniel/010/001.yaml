source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁל֗וֹשׁ לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס דָּבָר֙ נִגְלָ֣ה לְ/דָֽנִיֵּ֔אל אֲשֶׁר נִקְרָ֥א שְׁמ֖/וֹ בֵּלְטְשַׁאצַּ֑ר וֶ/אֱמֶ֤ת הַ/דָּבָר֙ וְ/צָבָ֣א גָד֔וֹל וּ/בִין֙ אֶת הַ/דָּבָ֔ר וּ/בִ֥ינָה ל֖/וֹ בַּ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/001.yaml
  text: In the third year of Cyrus king of Persia[a], a word was revealed to Daniel, who was called Belteshazzar. The word was true, and it concerned a great conflict; and he understood the word and had understanding in the vision.
translation:
  language: ru
  text: В третий год Кира, царя Персии, Даниилу, которого звали Валтасаром, было открыто слово. Слово было истинным и касалось великой борьбы[a]. Даниил понял это слово и получил понимание в видении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «и великая война». Еврейское слово может также обозначать «войско» или «воинскую службу».'
    reason: Сохраняет военный оттенок и лексическую неоднозначность выражения צָבָא גָדוֹל, не навязывая один спорный вариант.
lexical_decisions:
- source_word: דָּבָר
  choice: слово
  rationale: Сохраняет повтор ключевого еврейского существительного и естественно обозначает содержание откровения.
- source_word: נִגְלָה
  choice: было открыто
  rationale: Нифаль глагола גלה здесь обозначает раскрытие ранее сокрытого; русское выражение уместно для данного откровения.
- source_word: נִקְרָא שְׁמוֹ
  choice: которого звали
  rationale: Естественно передаёт еврейскую формулу наречения именем без тяжеловесного буквального оборота.
- source_word: בֵּלְטְשַׁאצַּר
  choice: Валтасар
  rationale: Использована укоренившаяся в русской библейской традиции форма вавилонского имени Даниила.
- source_word: וֶאֱמֶת הַדָּבָר
  choice: Это слово было истинно
  rationale: Передаёт утверждение о достоверности откровения и сохраняет повтор דָּבָר.
- source_word: וְצָבָא גָדוֹל
  choice: говорило о великой борьбе
  rationale: צָבָא может обозначать войско, военную службу или борьбу. В контексте Дан 10–12 выражение, вероятнее всего, характеризует содержание откровения как великий конфликт; неоднозначность отмечена в сноске.
- source_word: וּבִין אֶת הַדָּבָר
  choice: Даниил понял слово
  rationale: Императивное по форме וּבִין в данном повествовательном заголовке естественно понимается как указание вникнуть в сообщение либо как констатация понимания; контекст и следующая именная конструкция допускают передачу как достигнутого понимания.
- source_word: וּבִינָה לוֹ בַּמַּרְאֶה
  choice: и уразумел видение
  rationale: Естественная русская передача того, что Даниил обладал пониманием применительно к видению, без искусственного удвоения слова «понимание».
theological_decisions:
- issue: Смысл צָבָא גָדוֹל в апокалиптическом откровении
  choice: говорило о великой борьбе
  alternative: и великая война / и великое воинство
  rationale: Контекст последующих глав говорит о масштабном земном и небесном противостоянии. Основной текст передаёт вероятный смысл, а сноска сохраняет военный оттенок и подлинную лексическую неоднозначность.
- issue: Синтаксис заключительных слов стиха
  choice: Даниил понял слово и уразумел видение
  alternative: вникни в слово и уразумей видение
  rationale: Масоретская вокализация וּבִין допускает императивное прочтение, тогда как продолжение בינה לו указывает на наличие понимания у Даниила. Основной текст следует цельному заголовочному прочтению, альтернативная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён ради ясности, но повтор «слово» сохранён как значимый элемент оригинала. Традиционные имена «Кир», «Даниил» и «Валтасар» обеспечивают узнаваемость.
