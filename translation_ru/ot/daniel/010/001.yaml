revisions:
- from: В третий год Кира, царя Персии, Даниилу, которого звали Валтасаром, было открыто слово. Это слово было истинно и говорило о великой борьбе[a]. Даниил понял слово и уразумел видение.
  to: В третий год Кира, царя Персии, Даниилу, которого звали Валтасаром, было открыто слово. Слово было истинным и касалось великой борьбы[a]. Даниил понял это слово и получил понимание в видении.
  rationale: Правка уточняет последнюю часть стиха в соответствии с различием между «понял слово» (וּבִין אֶת־הַדָּבָר) и «получил понимание в видении» (וּבִינָה לוֹ בַּמַּרְאֶה). Также слегка выравнивает русский стиль и делает сноску к צָבָא גָדוֹל более точной. Императивный облик масоретской формы וּבִין отмечает текстологико-синтаксическую трудность, но в данном заголовочном контексте повествовательная передача «понял» остаётся безопасной и соответствует английскому аудиторскому решению.
