  text: בַּ/יָּמִ֖ים הָ/הֵ֑ם אֲנִ֤י דָֽנִיֵּאל֙ הָיִ֣יתִי מִתְאַבֵּ֔ל שְׁלֹשָׁ֥ה שָׁבֻעִ֖ים יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/002.yaml
  text: In those days[a], I, Daniel, was mourning for three weeks of days.
translation:
  language: ru
  text: В те дни я, Даниил, скорбел три недели[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три недели дней». Такое уточнение, вероятно, подчёркивает, что речь идёт об обычных неделях, состоящих из дней, а не о символических «седминах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Стандартное временное выражение; сохраняет множественное число יָמִים и естественно звучит в современном русском повествовании.
- source_word: אֲנִי דָנִיֵּאל
  choice: я, Даниил,
  rationale: Самостоятельное местоимение с именем имеет самоидентифицирующий и слегка эмфатический характер; русское приложение с запятыми передаёт его естественно.
- source_word: הָיִיתִי מִתְאַבֵּל
  choice: скорбел
  rationale: Сочетание היה с причастием породы хитпаэль обозначает продолжительное состояние или действие в прошлом. Русский глагол несовершенного вида передаёт эту длительность без тяжеловесности.
- source_word: שְׁלֹשָׁה שָׁבֻעִים יָמִים
  choice: три недели[a]
  rationale: В основном тексте естественное русское выражение передаёт продолжительность, а необычное добавление יָמִים сохраняется в примечании, не превращаясь в неясное «три недели дней».
theological_decisions:
- issue: Значение добавочного יָמִים после «три недели»
  choice: Передать в тексте «три недели» и отметить буквальную форму в сноске.
  alternative: «три полные недели» или «три недели дней»
  rationale: «Полные» яснее раскрывает вероятную функцию оборота, но добавляет характеристику, не выраженную отдельным словом; буквальное «недели дней» в русском неестественно. Сноска сохраняет возможное противопоставление обычных недель из дней символическим седминам, не закрепляя его как единственно допустимое толкование.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. «Скорбел» сохраняет длительный характер действия и не вводит не названный в стихе объект оплакивания.
