base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/017.yaml
  text: So how can this servant of my lord speak with my lord like this? As for me[a], from now on no strength remains in me[c][b], and no breath is left in me.
translation:
  language: ru
  text: Как же этому слуге моего господина говорить с этим моим господином? А я теперь совсем без сил, и дыхания во мне не осталось.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с этой минуты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיךְ יוּכַל
  choice: Как же ... могу
  rationale: Сочетание передаёт связь с предыдущей репликой и риторический вопрос о способности говорить; форма первого лица естественно согласуется с самообозначением Даниила.
- source_word: עֶבֶד אֲדֹנִי
  choice: я, слуга господина моего
  rationale: עֶבֶד здесь — почтительное самообозначение, а не указание на рабский статус. «Господин» сохраняет уважительное обращение и не смешивается с передачей имени YHWH.
- source_word: לְדַבֵּר עִם אֲדֹנִי
  choice: говорить с вами, господин мой
  rationale: Передаёт значение предлога עִם («с») и в русском естественно выражает прямое почтительное обращение.
- source_word: זֶה ... זֶה
  choice: я ... с вами
  rationale: Дважды повторённое указательное слово передано естественными для русского непосредственными формами самоуказания и обращения; буквальная структура отмечена в сноске.
- source_word: מֵעַתָּה
  choice: теперь
  rationale: В данном контексте обозначает нынешнее состояние Даниила; «теперь» избегает возможного ложного оттенка необратимости, присущего выражению «отныне».
- source_word: לֹא יַעֲמָד בִּי כֹחַ
  choice: во мне не осталось сил
  rationale: Естественно передаёт еврейскую идиому, буквально описывающую силу как более не способную «стоять» в говорящем.
- source_word: וּנְשָׁמָה לֹא נִשְׁאֲרָה בִי
  choice: и не осталось дыхания
  rationale: נְשָׁמָה в сочетании с утратой сил означает прежде всего физическое дыхание или жизненное дыхание, а не «дух» как отдельную внутреннюю сущность.
theological_decisions:
- issue: Передача אֲדֹנִי при обращении к возвышенному посланнику
  choice: господин мой
  alternative: владыка мой
  rationale: Речь идёт о почтительном титуле, а не об имени YHWH. «Господин мой» сохраняет придворный и уважительный тон, не приписывая адресату божественный статус.
translation_notes:
  register: Современный литературный русский язык с почтительным, слегка возвышенным тоном прямой речи. Синтаксис сделан естественным для русского, а необычное повторение указательного זֶה сохранено в сноске.
