id: DAN.10.20
reference: Daniel 10:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֲ/יָדַ֨עְתָּ֙ לָ/מָּה בָּ֣אתִי אֵלֶ֔י/ךָ וְ/עַתָּ֣ה אָשׁ֔וּב לְ/הִלָּחֵ֖ם עִם שַׂ֣ר פָּרָ֑ס וַ/אֲנִ֣י יוֹצֵ֔א וְ/הִנֵּ֥ה שַׂר יָוָ֖ן בָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/020.yaml
  text: Then he said[a], “Do you know why I have come to you? And now I will return to fight against the prince of Persia; and when I go out, behold[c][b], the prince of Greece is coming.”
translation:
  language: ru
  text: 'И он сказал: «Знаешь ли ты, зачем я пришёл к тебе? Теперь я возвращусь, чтобы сражаться с князем Персии. И когда я выйду[a], вот, придёт князь Греции[b][c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и я выхожу». Еврейская фраза кратка и может обозначать как простое отправление, так и временную последовательность: «когда я выйду».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «князь Явана»; название «Яван» обычно обозначает Грецию или греческую державу.'
    reason: lexical_alternative
  - marker: c
    text: Слово «князь» здесь, вероятнее всего, обозначает сверхъестественного правителя, связанного с народом, хотя в этом стихе он прямо так не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Знаешь ли ты
  rationale: Вопросительная форма от ידע естественно выражает вопрос о том, известно ли Даниилу назначение прихода говорящего.
- source_word: לָמָּה
  choice: зачем
  rationale: В данном контексте вопрос направлен на цель прихода; «зачем» звучит естественно и точно.
- source_word: בָּאתִי אֵלֶיךָ
  choice: я пришёл к тебе
  rationale: Русское прошедшее время естественно передаёт завершённое действие, сохраняющее значение для текущей беседы.
- source_word: וְעַתָּה
  choice: Теперь
  rationale: Передаёт переход к следующему действию без стилистически тяжёлого накопления союзов.
- source_word: אָשׁוּב
  choice: я возвращусь
  rationale: Имперфект имеет здесь будущее значение, а глагол указывает на возвращение к уже происходившему противостоянию.
- source_word: לְהִלָּחֵם עִם
  choice: чтобы сражаться с
  rationale: Естественно передаёт цель возвращения и конфликтное значение сочетания לחם с עִם.
- source_word: שַׂר פָּרָס
  choice: князем Персии
  rationale: «Князь» сохраняет широкий смысл שַׂר и не вводит в основной текст прямого определения существа как ангельского или демонического.
- source_word: וַאֲנִי יוֹצֵא
  choice: когда я выйду
  rationale: Временное прочтение естественно связывает краткую еврейскую фразу с последующим сообщением; буквальное сочинительное прочтение отмечено в сноске.
- source_word: וְהִנֵּה
  choice: вот
  rationale: «Вот» привлекает внимание к последующему событию и сохраняет возвышенность, оставаясь современным русским словом.
- source_word: שַׂר יָוָן
  choice: князь Греции
  rationale: יָוָן в контексте обозначает Грецию или греческую державу; понятный современному читателю эквивалент — «Греция».
- source_word: בָּא
  choice: придёт
  rationale: Причастие описывает наступающее или близкое действие; в русском контексте естественна будущая форма «придёт».
theological_decisions:
- issue: Кем являются «князь Персии» и «князь Греции»
  choice: В основном тексте сохранить слово «князь», не уточняя природу этих лиц.
  alternative: Сверхъестественный правитель, связанный с определённым народом; либо человеческий политический правитель.
  rationale: Ближайший контекст убедительно указывает на сверхъестественных существ, однако сам этот стих прямо их так не называет. Формулировка сохраняет богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством визионерского повествования. Синтаксис сделан ясным для обычного читателя; «вот» сохраняет указательную выразительность הִנֵּה без архаического «се».
