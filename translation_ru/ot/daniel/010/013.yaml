base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/013.yaml
  text: But the prince of the kingdom of Persia stood against me for twenty-one days[a], and behold, Michael, one of the chief princes, came to help me[b], and I was left there beside the kings of Persia.
translation:
  language: ru
  text: Но князь Персидского царства противостоял мне двадцать один день. И вот Михаил, один из главных князей[a], пришёл мне на помощь, а я остался там рядом с царями Персии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один из первых князей»; или: «один из высших князей».'
    reason: Еврейское הָרִאשֹׁנִים может указывать на первенство по времени, положению или значимости.
  - marker: b
    text: 'В еврейском тексте стоит множественное число: «цари Персии»; его иногда передают единственным числом — «царь Персии».'
    reason: Сохраняется грамматическое множественное число оригинала и отмечается распространённое сглаживание.
lexical_decisions:
- source_word: שַׂר מַלְכוּת פָּרַס
  choice: князь Персидского царства
  rationale: «Князь» сохраняет неоднозначность שַׂר и не уточняет прямо, идёт ли речь о небесном существе или земном правителе; конструкция с «царством» передаёт מַלְכוּת פָּרַס.
- source_word: עֹמֵד לְנֶגְדִּי
  choice: противостоял мне
  rationale: Естественно передаёт длительное противодействие, выраженное причастием עֹמֵד с לְנֶגֶד.
- source_word: עֶשְׂרִים וְאֶחָד יוֹם
  choice: двадцать один день
  rationale: Точное и естественное обозначение продолжительности по-русски.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет функцию привлечения внимания и внезапность появления Михаила без архаического оттенка.
- source_word: מִיכָאֵל
  choice: Михаил
  rationale: Принятая русская форма библейского имени.
- source_word: אַחַד הַשָּׂרִים הָרִאשֹׁנִים
  choice: один из главных князей
  rationale: «Главных» естественно выражает первенство по положению; возможные значения «первых» и «первейших» отмечены в сноске.
- source_word: בָּא לְעָזְרֵנִי
  choice: пришёл мне на помощь
  rationale: Современное естественное соответствие сочетанию глагола движения с целью помощи.
- source_word: נוֹתַרְתִּי
  choice: я остался
  rationale: Nifal от יתר допускает значения «остаться» и «быть оставленным»; «остался» звучит естественно и не перегружает фразу пассивной конструкцией.
- source_word: אֵצֶל מַלְכֵי פָרָס
  choice: там при царях Персии
  rationale: «При» передаёт пространственно-реляционное значение אֵצֶל («у, рядом с, при») и сохраняет трудность контекста; множественное число מַלְכֵי передано буквально.
theological_decisions:
- issue: Кем являются «князь Персидского царства» и «главные князья»
  choice: Сохранить обозначение «князь», не добавляя «ангел» или иного толкования.
  alternative: Небесный покровитель территории; земной правитель; сочетание небесного и земного планов.
  rationale: Контекст указывает на сверхъестественный конфликт, однако еврейское שַׂר само по себе не называет персонажа ангелом. Перевод сохраняет намеренную недосказанность.
- issue: Множественное число מַלְכֵי פָרָס
  choice: «цари Персии»
  alternative: «царь Персии»; династическое обозначение персидских царей.
  rationale: Масоретский текст употребляет множественное число, поэтому оно сохранено без согласования с привычным толкованием или исправления на единственное.
- issue: Значение נוֹתַרְתִּי
  choice: «я остался»
  alternative: «я был оставлен».
  rationale: Форма допускает как значение оставшегося состояния, так и пассивный оттенок. Основной текст использует естественное русское выражение, не уточняя, кто именно оставил говорящего.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «И вот» сохраняет выразительность הִנֵּה, а повтор «князь/князей» — связь между персидским князем и Михаилом. Маркеры сносок поставлены непосредственно при тех выражениях, которые они поясняют.
