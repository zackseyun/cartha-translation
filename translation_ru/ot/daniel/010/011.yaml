  text: וַ/יֹּ֣אמֶר אֵלַ֡/י דָּנִיֵּ֣אל אִישׁ חֲ֠מֻדוֹת הָבֵ֨ן בַּ/דְּבָרִ֜ים אֲשֶׁר֩ אָנֹכִ֨י דֹבֵ֤ר אֵלֶ֨י/ךָ֙ וַ/עֲמֹ֣ד עַל עָמְדֶ֔/ךָ כִּ֥י עַתָּ֖ה שֻׁלַּ֣חְתִּי אֵלֶ֑י/ךָ וּ/בְ/דַבְּר֥/וֹ עִמִּ֛/י אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עָמַ֥דְתִּי מַרְעִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/011.yaml
  text: And he said to me[a], “Daniel, man greatly beloved, understand the words that I am speaking to you, and stand in your place, for now I have been sent to you.” And when he spoke this word to me[c][b], I stood trembling.
translation:
  language: ru
  text: 'Он сказал мне: «Даниил, высоко ценимый муж[a], пойми слова, которые я говорю тебе, и встань на своё место[b], потому что теперь я послан к тебе». Когда он сказал мне это[c], я встал, дрожа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «драгоценный муж». Буквально еврейское выражение описывает Даниила как человека драгоценного или желанного и употреблено здесь как почётное обращение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «встань прямо» или «займи своё место». Буквально: «встань на своём стоянии (месте)».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «когда он сказал мне это слово» или «когда он передал мне это сообщение». Еврейское слово может означать «слово», «дело» или «сообщение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: драгоценный муж
  rationale: Выражение характеризует Даниила как желанного, драгоценного или высоко ценимого человека и служит почётным обращением. Этот вариант сохраняет образ драгоценности и не уточняет, кем именно Даниил любим или ценим.
- source_word: הָבֵן
  choice: пойми
  rationale: Повелительная форма призывает Даниила уразуметь содержание последующей речи; «пойми» прямо и естественно передаёт этот смысл.
- source_word: בַּדְּבָרִים
  choice: слова
  rationale: В данном контексте דָּבָר относится к произносимой речи, что подтверждается продолжением «которые я говорю тебе».
- source_word: דֹבֵר אֵלֶיךָ
  choice: говорю тебе
  rationale: Причастная форма обозначает происходящую в данный момент речь; настоящее время естественно передаёт её актуальность.
- source_word: וַעֲמֹד עַל עָמְדֶךָ
  choice: встань на своё место
  rationale: Перевод сохраняет пространственный образ еврейского оборота, буквально построенного как «стань на своём стоянии», не сводя его исключительно к значению «выпрямись».
- source_word: שֻׁלַּחְתִּי אֵלֶיךָ
  choice: я послан к тебе
  rationale: Страдательная форма сохраняется; настоящее краткое причастие в русском языке подчёркивает актуальность поручения в данной сцене.
- source_word: וּבְדַבְּרוֹ עִמִּי אֶת־הַדָּבָר הַזֶּה
  choice: когда он сказал мне это
  rationale: 'Оборот обозначает сопутствующее действие. Местоимение «это» звучит естественно и оставляет открытым диапазон значений דָּבָר: слово, сообщение или сказанное.'
- source_word: מַרְעִיד
  choice: дрожа
  rationale: Форма от רעד описывает физическую дрожь; деепричастие кратко и естественно передаёт состояние Даниила, когда тот встал.
theological_decisions:
- issue: Почётная характеристика Даниила в обращении небесного посланника
  choice: драгоценный муж
  alternative: муж, высоко ценимый; муж желаний
  rationale: Выбранный вариант передаёт почётный и тёплый характер обращения, но не добавляет отсутствующего в еврейском тексте указания, кем именно Даниил любим или ценим.
- issue: Смысл повеления וַעֲמֹד עַל עָמְדֶךָ
  choice: встань на своё место
  alternative: встань прямо; займи своё место
  rationale: Формулировка сохраняет смысловую напряжённость между физическим вставанием и занятием надлежащего положения, не разрешая её односторонне.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Слово «муж» сохранено в почётном обращении как уместный элемент высокого регистра; остальной синтаксис сделан естественным и понятным современному читателю.
