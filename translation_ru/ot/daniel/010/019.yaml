  text: וַ/יֹּ֜אמֶר אַל תִּירָ֧א אִישׁ חֲמֻד֛וֹת שָׁל֥וֹם לָ֖/ךְ חֲזַ֣ק וַ/חֲזָ֑ק וּֽ/בְ/דַבְּר֤/וֹ עִמִּ/י֙ הִתְחַזַּ֔קְתִּי וָ/אֹֽמְרָ֛/ה יְדַבֵּ֥ר אֲדֹנִ֖/י כִּ֥י חִזַּקְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/019.yaml
  text: And he said[a], “Do not fear, man greatly beloved; peace be to you. Be strong, yes, be strong.” And when he spoke with me, I was strengthened and said, “Let my lord speak, for you have strengthened me.”
translation:
  language: ru
  text: 'И он сказал: «Не бойся, человек, столь дорогой[a]! Мир тебе. Будь силён, будь силён!» Когда он говорил со мной, я укрепился и сказал: «Пусть мой господин говорит, потому что ты укрепил меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек желаний» или «человек драгоценностей». Еврейская идиома обозначает человека, особенно дорогого или пользующегося особым расположением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: дорогой Богу человек
  rationale: Буквально сочетание означает «человек желаний/драгоценностей» и идиоматически указывает на особое благоволение и высокую ценность адресата. Добавление «Богу» естественно передаёт подразумеваемый источник благоволения, а примечание сохраняет буквальную неоднозначность.
- source_word: שָׁלוֹם לָךְ
  choice: мир тебе
  rationale: Краткая и естественная русская формула благословения, сохраняющая смысл пожелания мира и благополучия.
- source_word: חֲזַק וַחֲזָק
  choice: будь твёрд, будь твёрд
  rationale: Повтор повелительной формы сохранён как средство усиления. «Твёрд» звучит естественно как призыв обрести внутреннюю силу и позволяет поддержать связь с последующими формами корня חזק.
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: когда он заговорил со мной
  rationale: Предлог с инфинитивом передаёт временное отношение. Выбор подчёркивает наступившее в ходе речи укрепление Даниила.
- source_word: הִתְחַזַּקְתִּי
  choice: я укрепился
  rationale: Возвратная форма естественно передаёт вхождение в состояние силы под воздействием слов говорящего, не исключая ни внутреннего обретения сил, ни внешнего укрепления.
- source_word: יְדַבֵּר אֲדֹנִי
  choice: пусть мой господин говорит
  rationale: Имперфект имеет побудительно-разрешительный оттенок в почтительной просьбе. Строчная буква показывает, что это уважительное обращение к говорящему, а не передача Божьего имени.
- source_word: כִּי חִזַּקְתָּנִי
  choice: потому что ты укрепил меня
  rationale: Союз выражает причину, а «укрепил» сохраняет лексическую связь трёх употреблений корня חזק в стихе.
theological_decisions:
- issue: Смысл אִישׁ חֲמֻדוֹת
  choice: дорогой Богу человек
  alternative: драгоценный человек; человек, пользующийся особым расположением
  rationale: Контекст небесного обращения указывает на особое благоволение к Даниилу, однако еврейская идиома сама по себе не называет Бога прямо. Поэтому основной текст даёт естественный контекстуальный смысл, а примечание открыто сообщает о буквальной форме и возможных передачах.
- issue: Передача אֲדֹנִי при обращении к говорящему
  choice: мой господин
  alternative: мой владыка; Господь
  rationale: Это уважительное обращение в единственном числе. Строчная буква не отождествляет небесного посланника с Господом Богом и не вносит в текст отсутствующего в нём богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены настойчивый повтор призыва и цепочка однокоренных слов о силе; уважительное «господин» написано со строчной буквы.
