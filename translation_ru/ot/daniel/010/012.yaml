  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ אַל תִּירָ֣א דָנִיֵּאל֒ כִּ֣י מִן הַ/יּ֣וֹם הָ/רִאשׁ֗וֹן אֲשֶׁ֨ר נָתַ֧תָּ אֶֽת לִבְּ/ךָ֛ לְ/הָבִ֧ין וּ/לְ/הִתְעַנּ֛וֹת לִ/פְנֵ֥י אֱלֹהֶ֖י/ךָ נִשְׁמְע֣וּ דְבָרֶ֑י/ךָ וַ/אֲנִי בָ֖אתִי בִּ/דְבָרֶֽי/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/012.yaml
  text: Then he said to me[a], “Do not fear, Daniel, because from the first day that you set your heart to understand and to humble yourself before your God, your words were heard[b], and I have come because of your words.”
translation:
  language: ru
  text: 'И он сказал мне: «Не бойся, Даниил. С первого дня, когда ты устремил своё сердце к тому, чтобы понять и смирить себя[a] перед своим Богом, твои слова были услышаны, и я пришёл по причине твоих слов[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергнуть себя лишениям». Еврейское слово в молитвенном контексте может обозначать добровольное самоограничение или смирение себя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в ответ на твои слова».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Естественная русская передача отрицательного повеления; сохраняет краткость и торжественный тон небесного утешения.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן
  choice: с первого же дня
  rationale: Передаёт исходную временную точку; частица «же» естественно подчёркивает, что ответ последовал с самого начала.
- source_word: נָתַתָּ אֶת לִבְּךָ
  choice: ты всем сердцем решил
  rationale: Еврейская идиома обозначает сознательную направленность внутренней воли и внимания. Такая формулировка звучит естественно по-русски и сохраняет как волевой, так и сердечный аспект.
- source_word: לְהָבִין
  choice: понять
  rationale: Прямо передаёт значение глагола בין в породе хифиль — понять, обрести понимание.
- source_word: וּלְהִתְעַנּוֹת
  choice: смирить себя
  rationale: В данном молитвенно-покаянном контексте форма хитпаэль указывает на добровольное самоуничижение или самоограничение перед Богом; основной вариант не конкретизирует внешний обряд.
- source_word: לִפְנֵי אֱלֹהֶיךָ
  choice: перед своим Богом
  rationale: Естественно и близко к еврейскому выражению со значением «перед, в присутствии».
- source_word: נִשְׁמְעוּ דְבָרֶיךָ
  choice: твои слова были услышаны
  rationale: Сохраняет пассивную форму и слово «слова», не заменяя его более истолковывающим «молитвы».
- source_word: וַאֲנִי בָאתִי בִּדְבָרֶיךָ
  choice: и я пришёл из-за твоих слов
  rationale: Предлог ב здесь допускает причинное или ответное понимание. Основной текст сохраняет причинную связь, а близкая альтернатива приведена в сноске.
theological_decisions:
- issue: Смысл действия Даниила в וּלְהִתְעַנּוֹת
  choice: смирить себя
  alternative: подвергнуть себя лишениям
  rationale: Основной вариант выражает покаянно-молитвенное смирение перед Богом, не утверждая без необходимости конкретную аскетическую практику; более буквальная возможность сохранена в сноске.
- issue: Значение בִּדְבָרֶיךָ в конце стиха
  choice: из-за твоих слов
  alternative: в ответ на твои слова
  rationale: Фраза указывает, что слова Даниила стали поводом для прихода вестника, но не объясняет механизм небесного поручения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Идиома о сердце передана естественно, без архаизма «положил сердце», при этом сохранены её волевой и внутренний аспекты. Пассив «были услышаны» оставляет подразумеваемого слышащего невыраженным, как в еврейском тексте.
