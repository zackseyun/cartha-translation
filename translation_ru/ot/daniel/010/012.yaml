revisions:
- from: 'И он сказал мне: «Не бойся, Даниил. С первого же дня, когда ты всем сердцем решил понять и смирить себя[a] перед своим Богом, твои слова были услышаны, и я пришёл из-за твоих слов[b]».'
  to: 'И он сказал мне: «Не бойся, Даниил. С первого дня, когда ты устремил своё сердце к тому, чтобы понять и смирить себя[a] перед своим Богом, твои слова были услышаны, и я пришёл по причине твоих слов[b]».'
  rationale: Правка точнее воспроизводит еврейскую идиому «положить/направить сердце» как внутреннее устремление к пониманию и смирению. Убраны не выраженные в оригинале усилительная частица «же» и глагол «решил». Причинная связь в בִּדְבָרֶיךָ передана нейтральным литературным выражением «по причине твоих слов», при сохранении возможного ответного оттенка в сноске.
