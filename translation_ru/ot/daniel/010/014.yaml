base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/014.yaml
  text: And I have come to make you understand what will happen to your people in the latter days[b][a], for the vision is yet for days to come.
translation:
  language: ru
  text: И я пришёл, чтобы объяснить тебе, что произойдёт с твоим народом в последние дни[a], ибо это видение относится к дням, которые ещё впереди[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в конце дней». Это еврейское пророческое выражение указывает на будущее завершение событий, не уточняя само по себе конкретную эсхатологическую схему.'
    reason: alternative_reading
  - marker: b
    text: 'Возможный смысл: «видение относится ко многим дням впереди» или «к отдалённому будущему». Еврейская фраза указывает на время, которое ещё не наступило; возможен также оттенок значительной временной удалённости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתִי
  choice: И я пришёл
  rationale: Форма совершенного вида обозначает состоявшееся прибытие говорящего, который теперь объясняет его цель; простое русское прошедшее время естественно передаёт это в контексте.
- source_word: לַהֲבִינְךָ
  choice: чтобы объяснить тебе
  rationale: Каузативная форма глагола בין означает привести адресата к пониманию. «Объяснить тебе» естественно по-русски передаёт эту направленную на понимание цель, не прибегая к двусмысленному обороту «дать тебе понять».
- source_word: אֵת אֲשֶׁר יִקְרָה לְעַמְּךָ
  choice: что произойдёт с твоим народом
  rationale: Оборот אֵת אֲשֶׁר вводит содержание объяснения, а קרה с ל обозначает то, что случится с затронутой стороной. Формулировка не приписывает событиям заранее ни бедственного, ни благоприятного характера.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в конце дней
  rationale: Близкая к форме еврейского пророческого выражения передача сохраняет его широкий эсхатологический горизонт и не сводит его к заранее заданной системе толкования.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит поясняющее основание; «ведь» естественно связывает вторую часть фразы с первой в современном русском языке.
- source_word: עוֹד חָזוֹן לַיָּמִים
  choice: это видение относится к грядущим дням
  rationale: Фраза указывает, что видение касается ещё предстоящего времени. Указательное «это» естественно отсылает к обсуждаемому видению; сноска сохраняет возможный количественный оттенок выражения לַיָּמִים.
theological_decisions:
- issue: Эсхатологическое выражение בְּאַחֲרִית הַיָּמִים
  choice: в конце дней
  alternative: в последние дни
  rationale: Буквально близкая формулировка сохраняет пророческую открытость выражения и не уточняет сверх текста, идёт ли речь об абсолютном конце истории или о будущем завершении описываемых событий.
- issue: Временная направленность עוֹד חָזוֹן לַיָּמִים
  choice: это видение относится к грядущим дням
  alternative: это видение — ещё на многие дни
  rationale: Основной текст ясно выражает отнесённость видения к будущему, а примечание сохраняет возможность понимать оборот как указание на значительную временную удалённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; подлинные временные и эсхатологические неоднозначности вынесены в примечания.
