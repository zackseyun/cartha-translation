base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/006.yaml
  text: His body was like beryl[a], his face like the appearance of lightning, his eyes like torches of fire, his arms and his feet like the gleam of polished bronze[c][b], and the sound of his words like the sound of a multitude.
translation:
  language: ru
  text: Тело его было подобно хризолиту[a], лицо — словно сияние молнии, глаза — словно огненные факелы, руки и ноги — словно блеск отполированной бронзы[b], а звук его слов — словно гул множества[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «топазу», «бериллу» либо иному драгоценному камню; точное значение еврейского слова «таршиш» неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «словно вид начищенной бронзы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «словно шум толпы»; еврейское слово может указывать как на множество людей, так и на производимый ими гул.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְוִיָּתוֹ
  choice: тело его
  rationale: גְוִיָּה обозначает тело или телесный облик; «тело» естественно и конкретно передаёт образ.
- source_word: כְתַרְשִׁישׁ
  choice: подобно хризолиту
  rationale: תַּרְשִׁישׁ — название драгоценного камня с неустановленной точной идентификацией. «Хризолит» сохраняет традиционный и понятный образ, а неопределённость отмечена в сноске.
- source_word: כְמַרְאֵה בָרָק
  choice: словно сияние молнии
  rationale: מַרְאֶה указывает на видимое явление или облик; «сияние молнии» естественно передаёт зрительную яркость образа, не сводя его к буквальному тождеству.
- source_word: כְלַפִּידֵי אֵשׁ
  choice: словно огненные факелы
  rationale: לַפִּיד — факел или пылающая головня. «Огненные факелы» передаёт яркий образ и естественно звучит по-русски.
- source_word: זְרֹעֹתָיו וּמַרְגְּלֹתָיו
  choice: руки и ноги
  rationale: Обычные анатомические соответствия сохраняют параллельное перечисление видимых частей тела.
- source_word: כְעֵין נְחֹשֶׁת קָלָל
  choice: словно блеск отполированной бронзы
  rationale: עֵין в этой конструкции означает вид или блеск, נְחֹשֶׁת — бронзу либо медь, а קָלָל, вероятно, указывает на отполированную, сверкающую поверхность. Формулировка сохраняет зрительный образ без чрезмерной точности.
- source_word: קוֹל דְּבָרָיו
  choice: звук его слов
  rationale: Формально передаёт сочетание «звук/голос его слов» и подчёркивает слуховое впечатление от речи.
- source_word: כְקוֹל הָמוֹן
  choice: словно гул множества
  rationale: 'הָמוֹן может обозначать множество людей и производимый ими шум. «Гул множества» сохраняет обе стороны образа: многочисленность и мощное звучание.'
theological_decisions:
- issue: Природа описываемой фигуры
  choice: Оставить фигуру без дополнительного отождествления и передать только данное в стихе описание.
  alternative: Назвать её ангелом, богоявлением или явлением Христа до воплощения.
  rationale: Сам стих описывает человекоподобную фигуру, но прямо не устанавливает её природу; уточняющее отождествление внесло бы в перевод спорное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством и образностью пророческого видения. Повтор «словно» сохраняет цепочку сравнений, а краткие именные конструкции делают описание ритмичным и ясным.
