base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/021.yaml
  text: And the shaggy male goat is the king of Greece[b][a], and the great horn that is between his eyes is the first king.
translation:
  language: ru
  text: А косматый козёл — царь Греции[a], и большой рог между его глазами — первый царь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Иаван» — название, которое здесь обозначает Грецию или греческую державу.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּפִיר הַשָּׂעִיר
  choice: косматый козёл
  rationale: Сочетание обозначает самца козы и подчёркивает его густую шерсть; «косматый козёл» сохраняет яркость еврейского образа и естественно звучит по-русски.
- source_word: מֶלֶךְ יָוָן
  choice: царь Греции
  rationale: В данном контексте יָוָן обозначает Грецию или греческую державу, а מֶלֶךְ имеет единственное число и буквально означает «царь».
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: большой рог
  rationale: Прилагательное указывает на величину и значительность рога; «большой рог» прямо и естественно передаёт символический образ.
- source_word: אֲשֶׁר בֵּין עֵינָיו
  choice: между его глазами
  rationale: Краткая русская конструкция точно передаёт относительное описание; местоимение мужского рода согласуется с образом козла.
- source_word: הוּא הַמֶּלֶךְ הָרִאשׁוֹן
  choice: первый царь
  rationale: רִאשׁוֹן здесь означает первого по порядку; повтор слова «царь» сохраняет лексическую связь с первой частью стиха.
theological_decisions:
- issue: Кого обозначают козёл и рог
  choice: Козёл представлен как царь Греции, а большой рог — как первый царь.
  alternative: Понимать козла собирательно как греческое царство.
  rationale: Еврейский текст буквально называет козла «царём Греции», а рог — «первым царём». Перевод сохраняет эту формулировку и не добавляет конкретного исторического имени.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой, торжественной структуры толкования видения. Образное выражение «косматый козёл» передаёт оба элемента еврейского словосочетания без сглаживания.
