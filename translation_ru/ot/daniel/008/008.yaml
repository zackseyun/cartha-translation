  yaml_path: translation/ot/daniel/008/008.yaml
  text: And the male goat grew exceedingly great[a], but when he was strong, the great horn was broken[b], and in its place four conspicuous horns came up toward the four winds of heaven.
translation:
  language: ru
  text: Козёл стал чрезвычайно велик. Но когда он достиг полной силы, большой рог сломался, и вместо него[a] поднялись четыре заметных рога[b] — к четырём ветрам небесным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под ним»; в этом контексте: «вместо него».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте слово «рога» здесь не повторено и восстановлено из контекста; определение может означать «заметные», «видные» или «выдающиеся».
    reason: lexical_alternative
lexical_decisions:
- source_word: צְפִיר הָעִזִּים
  choice: козёл
  rationale: Еврейское словосочетание обозначает именно самца козы. Русское «козёл» передаёт это точно и естественно, без избыточного «козёл-самец».
- source_word: הִגְדִּיל עַד מְאֹד
  choice: необычайно возвеличился
  rationale: Глагольная форма выражает резкое возрастание величия, силы или влияния, а עַד מְאֹד усиливает его до крайней степени. «Необычайно возвеличился» сохраняет интенсивность и возвышенный характер видения, не уточняя преждевременно, идёт ли речь о политическом могуществе или внешнем величии.
- source_word: וּכְעָצְמוֹ
  choice: когда он достиг могущества
  rationale: Оборот указывает на время, когда козёл стал силён. «Достиг могущества» естественно выражает достижение полноты силы в данном символическом контексте.
- source_word: נִשְׁבְּרָה
  choice: сломался
  rationale: Нифаль от שבר передаёт страдательное событие без названного деятеля. Русское «сломался» естественно применительно к рогу и не добавляет того, кто его сломал.
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: большой рог
  rationale: «Рог» буквально сохраняет апокалиптический образ, а «большой» передаёт как размер, так и значительность, не подменяя символ его истолкованием.
- source_word: וַתַּעֲלֶנָה
  choice: поднялись
  rationale: עלה описывает появление или вырастание вверх. «Поднялись» сохраняет зрительный образ и хорошо сочетается с рогами.
- source_word: חָזוּת אַרְבַּע
  choice: четыре заметных рога
  rationale: חָזוּת характеризует появившееся как видимое, выдающееся или заметное. Существительное «рога» восстановлено из непосредственного контекста и отмечено сноской, поскольку формально в данном обороте оно не повторено.
- source_word: תַּחְתֶּיהָ
  choice: вместо него
  rationale: Буквально выражение означает «под ним», однако в контексте замещения естественно передаётся как «вместо него». Сноска сохраняет буквальную пространственную образность.
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: к четырём ветрам небесным
  rationale: Сохранён библейский образ четырёх небесных ветров, обозначающих четыре направления, без его сведения в основном тексте к абстрактным сторонам света.
theological_decisions:
- issue: Сохранение символического языка видения или его историческое истолкование в основном тексте
  choice: Сохранить образы «рога» и «четырёх ветров небесных» без отождествления с царями, царствами или сторонами света.
  alternative: Заменить символы их предполагаемыми историческими или географическими соответствиями.
  rationale: Сам стих сообщает видение, а его истолкование даётся далее в главе. Перевод не должен заранее устранять образность или вводить спорное историческое отождествление.
- issue: Смысл חָזוּת в сочетании חָזוּת אַרְבַּע
  choice: Передать как «четыре заметных рога», сохранив значение зрительной заметности или выдающегося характера.
  alternative: «Четыре видения», «четыре выдающихся» или просто «четыре рога».
  rationale: В контексте речь идёт о четырёх новых рогах; вместе с тем редкая конструкция допускает оттенки видимости и приметности. «Заметных» сохраняет этот оттенок, а сноска сообщает о добавлении слова «рога» из контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией, подходящей для апокалиптического видения. Синтаксис сделан ясным для чтения вслух; символические образы оригинала сохранены, а необходимые пояснения вынесены в сноски.
