base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/016.yaml
  text: And I heard the voice of a man between the banks of the Ulai[a], and he called out and said, “Gabriel[c][b], make this one understand the vision.”
translation:
  language: ru
  text: 'И услышал я голос человека между берегами Улая[a]. Он воззвал и сказал: «Гавриил, дай этому человеку понять видение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между Улаем»; возможно также: «посреди Улая» или «между сторонами Улая». Вероятно, имеется в виду пространство между его берегами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: И услышал я
  rationale: Форма продолжает последовательное повествование. Постпозиция местоимения естественна для возвышенного русского рассказа и сохраняет акцент на новом восприятии Даниила.
- source_word: קוֹל אָדָם
  choice: голос человека
  rationale: Буквально передаёт сочетание «голос человека», не превращая его в более отвлечённое «человеческий голос» и не уточняя пол там, где русское «человек» достаточно точно.
- source_word: בֵּין אוּלָי
  choice: между берегами Улая
  rationale: Предлог означает «между», а Улай в контексте является водным потоком. Упоминание берегов естественно раскрывает пространственный смысл, при этом буквальная неоднозначность отмечена в сноске.
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: Он воззвал и сказал
  rationale: 'Сохранены оба глагола: первый обозначает громкий призыв, второй вводит содержание речи.'
- source_word: גַּבְרִיאֵל
  choice: Гавриил
  rationale: Устоявшаяся русская форма личного имени.
- source_word: הָבֵן
  choice: дай … понять
  rationale: 'Побудительная порода глагола בין требует каузативного смысла: Гавриил должен привести адресата к пониманию, а не сам понять видение.'
- source_word: לְהַלָּז
  choice: этому человеку
  rationale: Редкое указательное выражение обозначает находящегося в сцене Даниила. «Этому человеку» естественно по-русски и не оставляет неясным адресата действия.
- source_word: אֶת הַמַּרְאֶה
  choice: видение
  rationale: В апокалиптическом контексте מַרְאֶה обозначает увиденное в откровении, поэтому «видение» точнее возможного «явление» или «увиденное».
theological_decisions:
- issue: Кто говорит голосом человека
  choice: Не отождествлять говорящего сверх того, что сказано в стихе
  alternative: Назвать говорящего человеком, ангелом или божественным лицом
  rationale: Текст сообщает лишь, что Даниил услышал «голос человека», и не даёт в этом стихе достаточного основания для более точного богословского отождествления.
- issue: Смысл повеления Гавриилу
  choice: «дай этому человеку понять видение»
  alternative: «объясни этому человеку видение»
  rationale: Выбранная формулировка сохраняет каузативную форму исходного глагола и не сводит способ приведения к пониманию исключительно к словесному объяснению.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным строем. Формула «И услышал я» и глагол «воззвал» поддерживают достоинство пророческого повествования, не делая текст архаичным. Каузатив «дай … понять» намеренно сохранён, хотя вариант «объясни» звучал бы разговорнее.
