source:
  edition: WLC
  text: וְ/עָצַ֤ם כֹּח/וֹ֙ וְ/לֹ֣א בְ/כֹח֔/וֹ וְ/נִפְלָא֥וֹת יַשְׁחִ֖ית וְ/הִצְלִ֣יחַ וְ/עָשָׂ֑ה וְ/הִשְׁחִ֥ית עֲצוּמִ֖ים וְ/עַם קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/024.yaml
  text: His power will become strong[a], but not by his own power. He will bring about extraordinary destruction, and he will succeed and act; he will destroy the mighty and the people of the holy ones.
translation:
  language: ru
  text: Его сила возрастёт[a], но не благодаря его собственной силе. Он совершит небывалые разрушения, преуспеет и будет действовать; он погубит могущественных и народ святых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станет могущественной».'
    reason: Выражение וְעָצַם כֹּחוֹ описывает становление силы мощной; основной вариант естественно передаёт этот динамический смысл.
  - marker: b
    text: 'Или: «святой народ»; возможно также: «народ святых существ».'
    reason: Конструкция עַם קְדֹשִׁים допускает как более буквальное понимание «народ святых», так и идиоматическое «святой народ»; сноска сохраняет неоднозначность.
lexical_decisions:
- source_word: וְעָצַם כֹּחוֹ
  choice: Его сила возрастёт
  rationale: Глагол עָצַם с כֹּחַ передаёт усиление, становление мощным. «Сила возрастёт» естественно по-русски выражает этот динамический смысл.
- source_word: וְלֹא בְכֹחוֹ
  choice: но не его собственной силой
  rationale: Предлог בְּ обозначает средство; «собственной» ясно передаёт противопоставление и внешний источник его могущества.
- source_word: וְנִפְלָאוֹת יַשְׁחִית
  choice: Он будет производить небывалые разрушения
  rationale: נִפְלָאוֹת означает нечто необычайное, изумительное; вместе с שׁחת выражение указывает на разрушения необычайного масштаба. «Небывалые разрушения» сохраняет силу образа без положительного оттенка слова «чудеса».
- source_word: וְהִצְלִיחַ
  choice: преуспеет
  rationale: Hiphil от צלח означает «иметь успех, преуспевать». Здесь слово сообщает об успешности действий, не подразумевая их нравственного одобрения.
- source_word: וְעָשָׂה
  choice: и будет действовать
  rationale: עשה имеет широкое значение «делать, действовать». Перевод не добавляет отсутствующего в тексте смысла «как ему угодно».
- source_word: וְהִשְׁחִית
  choice: он погубит
  rationale: В контексте насильственного угнетения שׁחת означает губить или уничтожать. «Погубит» естественно сочетается как с людьми, так и с народом.
- source_word: עֲצוּמִים
  choice: могущественных
  rationale: Субстантивированное прилагательное обозначает сильных или могущественных людей.
- source_word: וְעַם קְדֹשִׁים
  choice: народ святых
  rationale: Так передаётся конструкция «народ святых/святых существ» с сохранением множественного числа קְדֹשִׁים. Возможное идиоматическое понимание как «святой народ» отмечено в сноске.
theological_decisions:
- issue: Значение וְעַם קְדֹשִׁים
  choice: народ святых
  alternative: святой народ; народ святых существ
  rationale: Еврейское קְדֹשִׁים стоит во множественном числе и может обозначать «святых» или «святых существ», тогда как вся конструкция может идиоматически относиться к Божьему святому народу. Основной текст сохраняет формальную неоднозначность, а сноска представляет другие возможные понимания.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный пророческий регистр. Синтаксический параллелизм еврейского текста сохранён без искусственной архаизации.
