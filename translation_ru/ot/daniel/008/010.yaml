  text: וַ/תִּגְדַּ֖ל עַד צְבָ֣א הַ/שָּׁמָ֑יִם וַ/תַּפֵּ֥ל אַ֛רְצָ/ה מִן הַ/צָּבָ֥א וּ/מִן הַ/כּוֹכָבִ֖ים וַֽ/תִּרְמְסֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/010.yaml
  text: It grew as high as the host of heaven[a], and it cast some of the host and some of the stars down to the earth, and trampled them.
translation:
  language: ru
  text: Он вырос до воинства небесного[a], низверг на землю часть воинства и часть звёзд и попрал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесного войска». Выражение может символически обозначать небесных существ, народ Божий или небесные силы; еврейский текст оставляет образ открытым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְדַּל
  choice: Он вырос
  rationale: Qal wayyiqtol от גדל описывает возрастание величины или могущества. «Вырос» естественно продолжает образ рога и не привносит рефлексивного значения «возвеличил себя».
- source_word: עַד
  choice: до
  rationale: Предлог обозначает предел, которого достиг рост. В сочетании «вырос до воинства небесного» сохраняется направленный вверх образ без лишнего истолкования.
- source_word: צְבָא הַשָּׁמַיִם
  choice: воинство небесное
  rationale: צָבָא может означать воинство или войско. Традиционное и понятное выражение сохраняет открытым вопрос, обозначены ли небесные существа, народ Божий или небесные силы/светила.
- source_word: וַתַּפֵּל
  choice: низверг
  rationale: Hiphil от נפל имеет каузативное значение «заставить упасть». «Низверг» кратко и выразительно передаёт насильственное низведение сверху вниз.
- source_word: אַרְצָה
  choice: на землю
  rationale: Направительная форма אֶרֶץ указывает на движение к земле; «на землю» естественно передаёт космическую вертикаль образа.
- source_word: מִן הַצָּבָא וּמִן הַכּוֹכָבִים
  choice: часть воинства и часть звёзд
  rationale: 'מִן здесь естественно понимать партитивно: низвергнуты некоторые из воинства и звёзд, а не обязательно все. «Часть» ясно выражает это в русском.'
- source_word: הַכּוֹכָבִים
  choice: звёзд
  rationale: Прямое соответствие כּוֹכָבִים; возможный символический смысл не подставляется вместо исходного образа.
- source_word: וַתִּרְמְסֵם
  choice: и попрал их
  rationale: רמס означает топтать, попирать. «Попрал» сохраняет сильный, возвышенный образ и согласуется с местоименным суффиксом множественного числа.
theological_decisions:
- issue: Следует ли отождествлять «воинство небесное» и «звёзды» с ангелами, святыми или небесными светилами
  choice: Сохранить в основном тексте буквальные апокалиптические образы без определения их референтов
  alternative: Передать как «ангелы», «народ Божий/святые» или символических правителей
  rationale: Еврейский текст в данном стихе прямо не устанавливает референты. Перевод сохраняет подлинную многозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Воинство» и «попрал» уместны в апокалиптическом контексте и при этом остаются понятными; синтаксис сделан плавным и компактным.
