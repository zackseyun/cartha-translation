base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/001.yaml
  text: In the third year of the reign of Belshazzar the king[a], a vision appeared to me—I, Daniel—after the one that had appeared to me at the first.
translation:
  language: ru
  text: В третий год царствования царя Валтасара мне, Даниилу, явилось видение — после того, которое явилось мне вначале.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «после видения, которое явилось мне вначале». Еврейский текст отсылает к более раннему явлению и, вероятно, к предыдущему видению Даниила.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ
  choice: В третий год
  rationale: В формуле датировки количественное числительное שָׁלוֹשׁ имеет порядковое значение; русская естественная передача — «в третий год».
- source_word: לְמַלְכוּת
  choice: царствования
  rationale: מַלְכוּת в хронологической формуле обозначает период царского правления; «царствование» точно и естественно передаёт этот смысл.
- source_word: בֵּלְאשַׁצַּר הַמֶּלֶךְ
  choice: царя Валтасара
  rationale: Приложение «царь» передано естественной русской конструкцией с родительным падежом; имя дано в закрепившейся русской библейской форме.
- source_word: חָזוֹן נִרְאָה אֵלַי
  choice: мне … явилось видение
  rationale: Нифаль נִרְאָה в контексте видения естественно означает «явилось»; порядок слов приспособлен к современному русскому синтаксису.
- source_word: אֲנִי דָנִיֵּאל
  choice: мне, Даниилу
  rationale: Явное местоимение и имя передают самоидентификацию автора. Дательная конструкция сохраняет смысл и звучит по-русски естественнее, чем буквальное «я, Даниил» в данной фразе.
- source_word: אַחֲרֵי הַנִּרְאָה אֵלַי בַּתְּחִלָּה
  choice: после того, которое явилось мне прежде
  rationale: Субстантивированная форма הַנִּרְאָה передана нейтральным «того, которое», не добавляя повторно слово «видение» в основном тексте; בַּתְּחִלָּה здесь указывает на более раннее явление.
