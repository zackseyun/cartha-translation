base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/013.yaml
  text: Then I heard a holy one speaking[a], and one holy one said to the one speaking, “How long is the vision concerning the regular burnt offering and the desolating transgression[d][c][b], and the giving over of both the sanctuary and the host to be trampled?”
translation:
  language: ru
  text: 'И услышал я, как говорил один святой, и другой святой сказал тому, кто говорил[a]: «Доколе будет продолжаться это видение о постоянной жертве всесожжения[b], об опустошительном преступлении[c] и о предании святилища и воинства[d] на попрание?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Палмонию, который говорил», если לַפַּלְמוֹנִי понимать как имя или титул, а не как неопределённое обозначение собеседника.'
    reason: alternative_reading
  - marker: b
    text: 'Традиционно: «ежедневной жертве». Еврейское תָּמִיד обозначает регулярное, постоянно совершаемое приношение в храмовом служении.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «о преступлении, которое опустошает».'
    reason: lexical_alternative
  - marker: d
    text: «Воинство» может означать людей, связанных со святилищем, войско или иную совокупность сил; еврейское слово здесь не указывает на это однозначно.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדוֹשׁ
  choice: святой
  rationale: Субстантивированное прилагательное в контексте видения обозначает небесное святое существо. «Святой» сохраняет форму оригинала и не добавляет прямо слово «ангел».
- source_word: לַפַּלְמוֹנִי
  choice: тому
  rationale: Редкая и неясная форма, вероятно, указывает на определённого, но не названного собеседника. Нейтральное «тому, кто говорил» не превращает её без достаточных оснований в имя собственное; такая возможность отмечена в сноске.
- source_word: הַמְדַבֵּר
  choice: кто говорил
  rationale: Причастие определяет адресата как говорившего; придаточная конструкция естественна для современного русского языка.
- source_word: הֶחָזוֹן
  choice: это видение о
  rationale: Следующие выражения раскрывают содержание видения. Предлог «о» ясно передаёт эту связь, не уточняя её сверх оригинала.
- source_word: הַתָּמִיד
  choice: постоянная жертва всесожжения
  rationale: В храмовом контексте термин обозначает регулярное, постоянно приносимое жертвоприношение. Выбранная формулировка понятна читателю, а традиционный вариант и смысловая широта термина отмечены в сноске.
- source_word: הַפֶּשַׁע שֹׁמֵם
  choice: опустошительное преступление
  rationale: Компактное выражение сохраняет связь тяжкого нарушения с опустошением, не отождествляя его с более поздней технической формулой.
- source_word: תֵּת
  choice: предание
  rationale: Отглагольное существительное передаёт инфинитив со значением отдания во власть, вследствие которого святилище и воинство оказываются попираемыми.
- source_word: קֹדֶשׁ
  choice: святилище
  rationale: В храмовом контексте слово обозначает конкретное священное место, а не отвлечённую святость.
- source_word: צָבָא
  choice: воинство
  rationale: Русское «воинство» сохраняет широту слова, которое может обозначать войско, небесное воинство или связанную со святилищем общность, не решая спорный вопрос в основном тексте.
- source_word: מִרְמָס
  choice: на попрание
  rationale: Формулировка близко передаёт существительное со значением топтания и осквернения и естественно сочетается с «преданием».
theological_decisions:
- issue: Кто такие «святые»
  choice: небесные святые существа, названные просто «святыми»
  alternative: люди-святые или прямо названные ангелы
  rationale: Обстановка видения указывает на небесных собеседников, однако оригинал не употребляет слово «ангел». Перевод сохраняет его лексическую сдержанность.
- issue: Кого или что обозначает צָבָא
  choice: референт не конкретизирован; сохранено широкое «воинство»
  alternative: народ Божий, небесное воинство или земное войско
  rationale: Контекст допускает несколько толкований. Основной текст не снимает эту богословскую и образную неоднозначность.
- issue: Характер הַפֶּשַׁע שֹׁמֵם
  choice: преступление, связанное с опустошением
  alternative: преступление, которое опустошает; либо преступление, вызывающее ужас
  rationale: Выражение оставлено компактным и не отождествлено безоговорочно с иной формулой из книги Даниила.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Инверсия «услышал я» поддерживает повествовательный регистр Даниила, тогда как синтаксис реплик остаётся понятным. Формула «На какой срок дано это видение» сохраняет сжатость еврейского вопроса и не добавляет отсутствующего в оригинале прямого утверждения о прекращении жертвы.
