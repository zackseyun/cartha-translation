  text: וּ/רְאִיתִ֞י/ו מַגִּ֣יעַ אֵ֣צֶל הָ/אַ֗יִל וַ/יִּתְמַרְמַ֤ר אֵלָי/ו֙ וַ/יַּ֣ךְ אֶת הָ/אַ֔יִל וַ/יְשַׁבֵּר֙ אֶת שְׁתֵּ֣י קְרָנָ֔י/ו וְ/לֹא הָ֥יָה כֹ֛חַ בָּ/אַ֖יִל לַ/עֲמֹ֣ד לְ/פָנָ֑י/ו וַ/יַּשְׁלִיכֵ֤/הוּ אַ֨רְצָ/ה֙ וַֽ/יִּרְמְסֵ֔/הוּ וְ/לֹא הָיָ֥ה מַצִּ֛יל לָ/אַ֖יִל מִ/יָּדֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/007.yaml
  text: And I saw him come up to the ram[a], and he was enraged against him, and he struck the ram and broke its two horns. And there was no strength in the ram to stand before him; he threw him to the ground and trampled him[d][c][b], and there was no one to rescue the ram from his hand.
translation:
  language: ru
  text: Я видел, как он приблизился к барану[a], исполнился ярости против него[b], ударил барана и сломал оба его рога. У барана не было сил устоять перед ним[c]. Он поверг его на землю и растоптал, и никто не мог спасти барана из его руки[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дошёл до барана». Древнееврейский глагол может означать как приближение, так и достижение объекта.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ожесточился против него» или «озлобился на него». Выражение передаёт крайнюю враждебность и ярость.'
    reason: lexical_alternative
  - marker: c
    text: «Устоять перед ним» в контексте сражения также означает «противостоять ему».
    reason: lexical_alternative
  - marker: d
    text: «Из его руки» — древнееврейский оборот, означающий избавление из-под чьей-либо власти.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתִיו מַגִּיעַ אֵצֶל הָאַיִל
  choice: Я видел, как он приблизился к барану
  rationale: Местоименный суффикс мужского рода указывает на козла из контекста, а מַגִּיעַ אֵצֶל передаёт приближение или достижение объекта. Русское «приблизился к» естественно и сохраняет основное значение.
- source_word: וַיִּתְמַרְמַר אֵלָיו
  choice: яростно бросился на него
  rationale: Форма от מרר выражает ожесточение, озлобление и сильную враждебность. В контексте непосредственного нападения русская формулировка передаёт и эмоциональный накал, и направленность против барана, не сводя выражение к нейтральному движению.
- source_word: וַיַּךְ אֶת הָאַיִל
  choice: ударил барана
  rationale: נכה обычно означает «ударить, поразить». «Ударил» прямо передаёт глагол и соответствует сцене боя.
- source_word: וַיְשַׁבֵּר אֶת שְׁתֵּי קְרָנָיו
  choice: сломал оба его рога
  rationale: שבר означает «ломать». «Оба» естественно передаёт שְׁתֵּי, а местоимение относится к барану.
- source_word: וְלֹא הָיָה כֹחַ בָּאַיִל לַעֲמֹד לְפָנָיו
  choice: У барана не было сил устоять перед ним
  rationale: כֹחַ здесь обозначает физическую силу или способность сопротивляться. «Устоять перед ним» сохраняет образ стояния и одновременно естественно выражает невозможность противостоять нападающему.
- source_word: וַיַּשְׁלִיכֵהוּ אַרְצָה
  choice: Он поверг его на землю
  rationale: השליך выражает бросание или низвержение, а אַרְצָה — движение вниз, на землю. «Поверг на землю» уместно в возвышенном повествовательном регистре и ясно описывает действие.
- source_word: וַיִּרְמְסֵהוּ
  choice: и растоптал
  rationale: רמס означает топтать или попирать. «Растоптал» кратко и выразительно передаёт завершённое насильственное действие.
- source_word: וְלֹא הָיָה מַצִּיל לָאַיִל מִיָּדוֹ
  choice: и никто не мог спасти барана из его руки
  rationale: מַצִּיל — тот, кто спасает или избавляет. Оборот «из его руки» сохраняет древнееврейский образ власти и контроля; его смысл пояснён в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис сделан ясным и динамичным; образы «устоять перед ним» и «из его руки» сохранены, а их идиоматический смысл пояснён в сносках. Все местоимения мужского рода соответствуют грамматическому роду животных в еврейском тексте и русскому контексту.
