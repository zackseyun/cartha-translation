base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/004.yaml
  text: I saw the ram charging westward and northward and southward[a], and no beasts could stand before him, and there was no one who could rescue from his hand. He did as he pleased and became great.
translation:
  language: ru
  text: Я видел, как баран бодал к западу, к северу и к югу, и ни один зверь не мог устоять перед ним; никто не мог спасти от его руки. Он поступал по своей воле и стал великим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвеличился» или «возвысил себя». Еврейское слово может обозначать как достижение величия, так и самовозвышение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Я видел
  rationale: Форма qal, перфект, 1-е лицо единственного числа, естественно передаётся как повествовательное прошедшее время.
- source_word: הָאַיִל
  choice: баран
  rationale: אַיִל обозначает барана; определённость в русском контексте видения не требует отдельного формального показателя.
- source_word: מְנַגֵּחַ
  choice: бодал
  rationale: Причастие от נגח описывает удары рогами. «Бодал» точно сохраняет образ рогатого животного и направленное силовое действие.
- source_word: יָמָּה וְצָפוֹנָה וָנֶגְבָּה
  choice: к западу, к северу и к югу
  rationale: Направительное окончание -ה указывает на движение в соответствующие стороны; конструкция с «к» естественна для современного русского языка.
- source_word: וְכָל חַיּוֹת לֹא
  choice: и ни один зверь не
  rationale: חַיּוֹת в образном контексте означает зверей; сочетание с отрицанием идиоматично передано как «ни один зверь не».
- source_word: לֹא יַעַמְדוּ לְפָנָיו
  choice: не мог устоять перед ним
  rationale: Оборот выражает неспособность противостоять; сохранён библейский образ «устоять перед» без излишней буквальности.
- source_word: וְאֵין מַצִּיל מִיָּדוֹ
  choice: никто не мог спасти от его руки
  rationale: Hiphil от נצל означает спасать или избавлять. Образ «от его руки», то есть из-под его власти, сохранён.
- source_word: וְעָשָׂה כִרְצֹנוֹ
  choice: Он поступал по своей воле
  rationale: Передаёт действие согласно собственной воле, сохраняя нейтральность еврейской формулировки и её продолжительный контекстуальный оттенок.
- source_word: וְהִגְדִּיל
  choice: и возвеличился
  rationale: Hiphil от גדל допускает значение приобретения величия или самовозвышения. «Возвеличился» сохраняет эту многозначность лучше, чем однозначно нравственно окрашенное «превознёсся».
theological_decisions:
- issue: Следует ли понимать וְהִגְדִּיל как достижение величия или как сознательное самовозвышение
  choice: и возвеличился
  alternative: и стал великим; и возвысил себя
  rationale: В еврейском тексте нет отдельного возвратного местоимения, но форма допускает оттенок самовозвышения. Основной перевод сохраняет напряжение между возрастанием силы и возвеличиванием себя, а примечание прямо указывает возможные прочтения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Образность оригинала («бодал», «от его руки», «устоять перед ним») сохранена, при этом синтаксис сделан понятным обычному читателю.
