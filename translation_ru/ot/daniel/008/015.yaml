source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/רְאֹתִ֛/י אֲנִ֥י דָנִיֵּ֖אל אֶת הֶ/חָז֑וֹן וָ/אֲבַקְשָׁ֣/ה בִינָ֔ה וְ/הִנֵּ֛ה עֹמֵ֥ד לְ/נֶגְדִּ֖/י כְּ/מַרְאֵה גָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/015.yaml
  text: And it happened[a], when I, Daniel, had seen the vision and was seeking understanding, behold, standing before me was one with the appearance of a man.
translation:
  language: ru
  text: 'И было так: когда я, Даниил, увидел видение и старался понять его, вот, передо мной стоял некто, по виду похожий на мужчину.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вид мужчины».'
    reason: Еврейское כְּמַרְאֵה גָבֶר буквально описывает фигуру через сравнение с видимым обликом мужчины; основной текст передаёт это естественной русской конструкцией, не определяя природу фигуры.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Передаёт обычное древнееврейское повествовательное введение без излишне архаичного русского оборота «и случилось».
- source_word: בִּרְאֹתִי
  choice: когда я... увидел
  rationale: Инфинитивная конструкция с בְּ вводит временное придаточное; совершенный вид естественно обозначает предшествующее восприятие видения.
- source_word: אֲנִי דָנִיֵּאל
  choice: я, Даниил
  rationale: Сохраняет подчёркнутое самообозначение, выраженное отдельным местоимением и именем.
- source_word: הֶחָזוֹן
  choice: это видение
  rationale: Указательное «это» естественно отсылает к только что описанному конкретному видению; существительное сохраняет значение חזון.
- source_word: וָאֲבַקְשָׁה בִינָה
  choice: и старался понять его
  rationale: Передаёт настойчивое стремление обрести понимание; местоимение «его» делает объект понимания ясным по-русски, не меняя смысла.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет функцию внезапного привлечения внимания и подходит современному возвышенному повествованию.
- source_word: עֹמֵד לְנֶגְדִּי
  choice: передо мной стоял
  rationale: Причастие עֹמֵד описывает положение фигуры, а לְנֶגְדִּי — её нахождение непосредственно перед Даниилом.
- source_word: כְּמַרְאֵה גָבֶר
  choice: некто, видом подобный мужчине
  rationale: Сохраняет сравнительную силу כְּ и феноменологическое описание внешности, не утверждая природу существа.
- source_word: גָבֶר
  choice: мужчина
  rationale: В контексте видимого облика слово обозначает взрослого человека мужского пола; «мужчина» точнее сохраняет гендерную определённость, чем общее «человек».
theological_decisions:
- issue: Природа фигуры, описанной словами כְּמַרְאֵה גָבֶר
  choice: 'Феноменологическое описание: «некто, видом подобный мужчине»'
  alternative: «ангел в человеческом облике», «мужчина» или «предвечная божественная фигура»
  rationale: Сам стих сообщает лишь о наблюдаемом сходстве фигуры с мужчиной. Перевод не отождествляет её с конкретным существом и сохраняет неопределённость текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. «Вот» сохраняет выразительность еврейского הִנֵּה; конструкция не вводит конфессионального толкования личности фигуры.
