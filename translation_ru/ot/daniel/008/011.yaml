  text: וְ/עַ֥ד שַֽׂר הַ/צָּבָ֖א הִגְדִּ֑יל וּ/מִמֶּ֨/נּוּ֙ הרים הַ/תָּמִ֔יד וְ/הֻשְׁלַ֖ךְ מְכ֥וֹן מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/011.yaml
  text: It even magnified itself up to the Prince of the host[a], and from him the regular offering was taken away[c][b], and the place of his sanctuary was cast down.
translation:
  language: ru
  text: Он возвеличил себя даже до Князя воинства, и от него[b] было отнято постоянное жертвоприношение[a], а место[c] его святилища было низвергнуто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непрерывное приношение» или «ежедневная жертва». В храмовом контексте הַתָּמִיד обозначает регулярно совершаемое жертвенное служение, традиционно понимаемое как постоянное всесожжение.'
    reason: lexical_alternative
  - marker: b
    text: Буквально еврейское местоимение означает «от него»; к кому именно оно относится, остаётся спорным.
    reason: alternative_reading
  - marker: c
    text: 'Или: «основание его святилища». Еврейское слово может означать как место или местопребывание, так и основание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד
  choice: даже до
  rationale: עַד обозначает предел или степень («до, вплоть до»), а וְ продолжает и усиливает описание возвышения рога. «Даже до» естественно передаёт необычайную высоту его притязаний.
- source_word: שַׂר הַצָּבָא
  choice: Вождя воинства
  rationale: שַׂר может означать князя, правителя или военачальника. «Вождь» сохраняет высокий титул, а «воинство» не сужает צָבָא до обычной человеческой армии и допускает небесный смысл.
- source_word: הִגְדִּיל
  choice: возвеличил себя
  rationale: В контексте главы хифиль от גדל выражает самовозвеличивание. Возвратная конструкция по-русски ясно передаёт подразумеваемую направленность действия на самого деятеля.
- source_word: וּמִמֶּנּוּ
  choice: у него
  rationale: Местоименный суффикс имеет мужской род и единственное число. «У него было отнято» естественно передаёт значение удаления от кого-либо, не определяя спорный антецедент.
- source_word: הרים
  choice: было отнято
  rationale: Хотя согласный текст связан с идеей поднятия, в сочетании с הַתָּמִיד контекст указывает на прекращение или удаление регулярного храмового служения. Пассив сохраняет структуру и не называет деятеля.
- source_word: הַתָּמִיד
  choice: постоянное жертвоприношение
  rationale: תָּמִיד буквально означает «постоянное, регулярное» и здесь эллиптически обозначает установленное храмовое жертвенное служение. Выбор не добавляет прямо отсутствующее в тексте уточнение «всесожжение».
- source_word: וְהֻשְׁלַךְ
  choice: было низвергнуто
  rationale: Хофаль выражает пассивное действие. «Низвергнуто» сохраняет образ насильственного повержения и соответствует возвышенному пророческому регистру.
- source_word: מְכוֹן
  choice: место
  rationale: מָכוֹן может обозначать установленное место, основание или местопребывание. «Место» естественно сочетается со святилищем и не ограничивает смысл только архитектурным фундаментом.
- source_word: מִקְדָּשׁוֹ
  choice: его святилища
  rationale: מִקְדָּשׁ означает святилище или святое место. «Святилище» сохраняет культовый смысл, не отождествляя слово непременно со всем храмовым комплексом.
theological_decisions:
- issue: Кого обозначает «Вождь воинства»
  choice: Титул передан без отождествления его носителя с конкретной фигурой.
  alternative: Бог; небесный князь или ангельский правитель; первосвященник Ония III; Мессия.
  rationale: Сам еврейский титул возвышен, но не устанавливает однозначно личность носителя. Нейтральная передача сохраняет богословскую и историческую неоднозначность.
- issue: Антецедент местоимения в וּמִמֶּנּוּ
  choice: Сохранено «у него» со строчной буквы и снабжено примечанием.
  alternative: «У него» как указание на Вождя воинства; «у него» как указание на рог; «у него/от него» в ином синтаксическом понимании.
  rationale: Мужской суффикс допускает спорное соотнесение в контексте. Строчная буква не навязывает отождествление с Богом, а примечание сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Возвеличил себя» и «низвергнуто» поддерживают образное противопоставление возвышения и падения. Местоимения, относящиеся к спорному носителю титула, оставлены со строчной буквы, чтобы перевод не предрешал его идентичность.
