lexical_decisions:
- source_word: וַיָּבֹא עַד
  choice: подошёл к
  rationale: Сочетание глагола בוא с עַד обозначает движение вплоть до объекта; «подошёл к» естественно передаёт приближение и достижение цели.
- source_word: הָאַיִל
  choice: барану
  rationale: אַיִל здесь означает самца овцы — барана, увиденного Даниилом.
- source_word: בַּעַל הַקְּרָנַיִם
  choice: с двумя рогами
  rationale: Буквально — «обладателю двух рогов»; русская конструкция «с двумя рогами» естественно передаёт принадлежность, сохраняя двойственное число.
- source_word: אֲשֶׁר רָאִיתִי עֹמֵד
  choice: которого я видел стоящим
  rationale: Формулировка сохраняет относительное придаточное и причастное значение עֹמֵד, не добавляя отсутствующей в еврейском тексте временной конкретизации.
- source_word: לִפְנֵי הָאֻבָל
  choice: перед каналом
  rationale: אוּבָל обозначает водоток; «канал» лучше всего соответствует контексту видения в Дан 8, хотя возможно и более общее понимание.
- source_word: וַיָּרָץ אֵלָיו
  choice: и побежал на него
  rationale: רוץ буквально означает «бежать»; сочетание «на него» в данном столкновении передаёт направленное враждебное движение.
- source_word: בַּחֲמַת כֹּחוֹ
  choice: в неистовстве своей мощи
  rationale: 'Перевод сохраняет оба существительных: חֵמָה выражает ярость или неистовство, а כֹּחַ — силу или мощь. Необычная связь между ними оставлена без поясняющей парафразы.'
