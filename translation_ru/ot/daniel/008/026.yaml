revisions:
- from: И видение о вечере и утре, о котором было сказано, истинно. А ты сохрани видение в тайне[a], потому что оно относится к далёким дням.
  to: И видение о вечере и утре, о котором было сказано, — истинно. А ты запечатай это видение, ибо оно относится к отдалённым временам.[a]
  rationale: Основной текст заменён только там, где прежняя передача сужала образ еврейского повеления. «Запечатай» прямо отражает исходный глагол и согласуется с английским audit trail; сноска сохраняет альтернативные оттенки. Заключительная фраза сделана более естественной по-русски без изменения её намеренной временной неопределённости.
