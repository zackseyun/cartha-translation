    issue: «Сохрани видение в тайне» интерпретирует сְתֹם
    rationale: Еврейский глагол прежде всего обозначает закрыть/запереть; значение сохранения в тайне возможно контекстуально, но не должно заменять образ оригинала в основном тексте, особенно когда естественный русский эквивалент доступен.
  - severity: low
    issue: «К далёким дням» звучит менее естественно по-русски
    rationale: Выражение «к отдалённым временам» естественнее и передаёт «многие дни» как отдалённый период, не добавляя глагола «исполнится».
