  text: וּ/מַרְאֵ֨ה הָ/עֶ֧רֶב וְ/הַ/בֹּ֛קֶר אֲשֶׁ֥ר נֶאֱמַ֖ר אֱמֶ֣ת ה֑וּא וְ/אַתָּה֙ סְתֹ֣ם הֶֽ/חָז֔וֹן כִּ֖י לְ/יָמִ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/026.yaml
  text: And the vision of the evening and the morning that was spoken is true; but you, seal up the vision, for it concerns many days from now.
translation:
  language: ru
  text: И видение о вечере и утре, о котором было сказано, — истинно. А ты запечатай это видение, ибо оно относится к отдалённым временам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закрой» или «сокрой это видение». Буквально: «ибо [это] на многие дни».'
    reason: Сохраняет образный диапазон глагола סְתֹם и временную формулировку לְיָמִים רַבִּים без утверждения, что видение непременно исполнится через определённый срок.
lexical_decisions:
- source_word: מַרְאֵה
  choice: видение
  rationale: Обычное пророческое значение слова в данном контексте; оно соотносится с ранее данным откровением о вечере и утре.
- source_word: הָעֶרֶב וְהַבֹּקֶר
  choice: о вечере и утре
  rationale: Сохраняет определённую формулировку исходного текста и связь с выражением «вечер — утро» в Дан 8:14, не превращая её в более истолковывающее «вечера и утра».
- source_word: נֶאֱמַר
  choice: было сказано
  rationale: Передаёт безличный пассив и не добавляет в текст прямо не названного говорящего.
- source_word: אֱמֶת הוּא
  choice: истинно
  rationale: Естественно передаёт утверждение о достоверности видения.
- source_word: סְתֹם
  choice: сохрани в тайне
  rationale: В контексте повеление означает закрыть или сделать недоступным содержание видения; русская формулировка передаёт этот смысл без неестественного буквального «запечатай».
- source_word: לְיָמִים רַבִּים
  choice: относится к далёким дням
  rationale: Сохраняет временную отдалённость, выраженную буквально через «многие дни», и естественно звучит по-русски.
theological_decisions:
- issue: Смысл повеления סְתֹם
  choice: сохрани видение в тайне
  alternative: запечатай видение
  rationale: Глагол допускает образы закрытия и запечатывания. Основной текст передаёт функцию повеления, а сноска сохраняет буквальный образ и неоднозначность.
- issue: Временная направленность לְיָמִים רַבִּים
  choice: оно относится к далёким дням
  alternative: оно исполнится через много дней
  rationale: Исходный текст не употребляет глагола «исполниться»; выбранный вариант не уточняет сверх текста, идёт ли речь об исполнении, понимании или сохранении видения до отдалённого времени.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; при этом сохранены повтор «видение» и временная неоднозначность заключительной фразы.
