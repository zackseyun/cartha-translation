  yaml_path: translation/ot/daniel/008/020.yaml
  text: The ram that you saw[a], the one with the two horns, is the kings of Media and Persia.
translation:
  language: ru
  text: Овен, которого ты видел[a], с двумя рогами, — это цари Мидии и Персии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Овен, которого ты видел, обладатель двух рогов, — цари Мидии и Персии».'
    reason: Буквальный оборот בַּעַל הַקְּרָנַיִם («обладатель двух рогов») в основном тексте передан естественным русским выражением «с двумя рогами».
lexical_decisions:
- source_word: הָאַיִל
  choice: овен
  rationale: אַיִל обозначает взрослого самца овцы; «овен» — точный и естественный русский эквивалент в контексте видения.
- source_word: אֲשֶׁר רָאִיתָ
  choice: которого ты видел
  rationale: Относительная частица אֲשֶׁר вводит определительное придаточное, а форма רָאִיתָ — Qal perfect, 2-е лицо мужского рода единственного числа; прошедшее время естественно передаёт отсылку к увиденному видению.
- source_word: בַּעַל הַקְּרָנַיִם
  choice: с двумя рогами
  rationale: Буквально בַּעַל означает «обладатель», но в этом определительном обороте идиоматически указывает на наличие; двойственное число הַקְּרָנַיִם означает именно два рога.
- source_word: מַלְכֵי
  choice: цари
  rationale: Форма множественного числа в сопряжённом состоянии означает «цари [кого/чего]». Перевод сохраняет множественное число и не заменяет царей царствами.
- source_word: מָדַי וּפָרָס
  choice: Мидии и Персии
  rationale: Традиционные и общепонятные русские названия соответствующих народов и держав; родительный падеж обусловлен словом «цари».
theological_decisions:
- issue: Передача безглагольного отождествления символа с его истолкованием
  choice: — это цари Мидии и Персии
  alternative: символизирует царей Мидии и Персии
  rationale: В еврейском тексте нет выраженного глагола со значением «символизировать» или «представлять». Оборот с «это» естественен по-русски, позволяет прямо связать образ с истолкованием и сохраняет исходное напряжение между единственным числом «овен» и множественным «цари», не вводя лишнего толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Тире и указательное «это» обеспечивают естественную передачу безглагольной древнееврейской конструкции, не устраняя её смысловой напряжённости.
