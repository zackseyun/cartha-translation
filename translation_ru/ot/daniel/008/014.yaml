  yaml_path: translation/ot/daniel/008/014.yaml
  text: And he said to me[a], “Until 2,300 evenings and mornings[b]; then the sanctuary will be restored.”
translation:
  language: ru
  text: 'И он сказал мне: «До двух тысяч трёхсот вечеров и утр[a]; затем святилище будет приведено в надлежащее состояние[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально означает «вечер — утро, две тысячи триста». Оно может относиться либо к 2300 полным суткам, либо к 2300 вечерним и утренним жертвоприношениям, то есть примерно к 1150 суткам.
    reason: alternative_reading
  - marker: b
    text: 'Или: «тогда святилище будет очищено», «оправдано» или «восстановлено в своих правах». Еврейский глагол буквально передаёт мысль о приведении в правильное, надлежащее состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И он сказал мне
  rationale: Последовательная повествовательная форма וַיֹּאמֶר и предложное сочетание אֵלַי естественно передаются прямой русской конструкцией без добавления временного оттенка.
- source_word: עַד
  choice: До
  rationale: Предлог обозначает временной предел и в ответе на вопрос «доколе?» точнее всего передаётся словом «до».
- source_word: עֶרֶב בֹּקֶר
  choice: вечеров и утр
  rationale: Сохраняется необычная парная формула еврейского текста и не разрешается спор о том, обозначает ли счёт полные сутки или отдельные вечерние и утренние жертвоприношения.
- source_word: אַלְפַּיִם וּשְׁלֹשׁ מֵאוֹת
  choice: двух тысяч трёхсот
  rationale: Числительное передано словами в форме, требуемой русским предлогом «до».
- source_word: וְנִצְדַּק
  choice: будет приведено в должное состояние
  rationale: 'Нифаль глагола צדק имеет широкий смысл: быть исправленным, восстановленным в правоте или приведённым в надлежащее состояние. Выбранная формулировка сохраняет этот смысл и не сужает его до ритуального очищения.'
- source_word: קֹדֶשׁ
  choice: святилище
  rationale: В контексте осквернения храмового богослужения слово естественно обозначает святилище, а не абстрактную святость.
theological_decisions:
- issue: Продолжительность периода, обозначенного עֶרֶב בֹּקֶר
  choice: Сохранить буквальную формулу «двух тысяч трёхсот вечеров и утр»
  alternative: «двух тысяч трёхсот суток» или около 1150 суток при счёте вечерних и утренних жертвоприношений
  rationale: Еврейская формула допускает разные хронологические толкования; основной текст не должен выбирать одно из них.
- issue: Значение וְנִצְדַּק קֹדֶשׁ
  choice: «святилище будет приведено в должное состояние»
  alternative: «святилище будет очищено», «оправдано» или «восстановлено в своих правах»
  rationale: В еврейском употреблён корень צדק, а не обычный глагол со значением ритуального очищения. Широкая передача не навязывает конкретную богословскую или историческую схему.
translation_notes:
  register: Современный литературный русский язык; стиль сдержанный и достойный. Необычная временная формула сохранена ради смысловой неоднозначности, а редкий оборот «приведено в должное состояние» выбран для точной передачи широты еврейского глагола.
