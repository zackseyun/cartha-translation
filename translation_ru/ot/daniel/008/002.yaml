base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/002.yaml
  text: And I saw in the vision[a], and when I saw, I was in Susa the citadel, which is in the province of Elam; and I saw in the vision that I was beside the Ulai Canal.
translation:
  language: ru
  text: 'И увидел я в видении: когда я смотрел, я находился в Сузах, крепости в области Элам. И увидел я в видении, что я был у канала Улай[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «река Улай»; или: «поток Улай». Еврейское слово имеет более широкое значение — «водоток», однако для предполагаемых окрестностей Суз лучше подходит перевод «канал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: И увидел я
  rationale: Форма глагола ראה повествует о событии в прошлом; инверсия сохраняет возвышенный повествовательный тон, оставаясь понятной современному читателю.
- source_word: בֶּחָזוֹן
  choice: в видении
  rationale: Сочетание обозначает среду и характер пророческого восприятия; русский язык естественно передаёт это без артикля.
- source_word: וַיְהִי בִּרְאֹתִי
  choice: и, когда я смотрел
  rationale: Еврейская идиома вводит временное придаточное; такой перевод передаёт её функцию без буквального и неестественного «и было при моём видении».
- source_word: בְּשׁוּשַׁן
  choice: в Сузах
  rationale: «Сузы» — принятая в русском языке форма древнего топонима Шушан.
- source_word: הַבִּירָה
  choice: в крепости
  rationale: בִּירָה обозначает укреплённый царский или административный комплекс; «крепость» сохраняет основной смысл, не сужая его до одного дворца.
- source_word: אֲשֶׁר בְּעֵילָם הַמְּדִינָה
  choice: которая находится в области Элам
  rationale: Относительное предложение географически определяет крепость; «область» естественно передаёт административное значение מְדִינָה.
- source_word: וַאֲנִי הָיִיתִי
  choice: что был
  rationale: Союз «что» ясно вводит содержание увиденного; подлежащее восстанавливается по контексту, как естественно в русском повествовании.
- source_word: עַל
  choice: у
  rationale: При названии водотока предлог указывает на положение рядом с ним, а не буквально на его поверхности.
- source_word: אוּבַל
  choice: канал
  rationale: Слово обозначает водоток или русло; в окрестностях Суз вероятнее всего имеется в виду искусственный канал.
- source_word: אוּלָי
  choice: Улай
  rationale: Собственное географическое название передано транслитерацией.
