    issue: Неестественная пунктуационно-синтаксическая связь в первой части.
    rationale: Сочетание «в видении; и, когда я смотрел, я был» механически воспроизводит союзную цепочку и затрудняет чтение. Двоеточие естественно вводит уточняющее временное описание, не меняя смысла.
  - severity: low
    issue: Относительное «которая находится» излишне фиксирует антецедент.
    rationale: Конструкция «в Сузах, в крепости, которая находится в области Элам» грамматически относит определение к «крепости». Приложение «в Сузах, крепости в области Элам» лучше передаёт компактную номинальную конструкцию оригинала без лишней экспликации.
  - severity: low
    issue: Формулировка вариантов в сноске не вполне естественна по-русски.
    rationale: Следует писать «река Улай» и «поток Улай», а не «реки Улай» и «потока Улай».
