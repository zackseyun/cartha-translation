- from: И увидел я в видении; и, когда я смотрел, я был в Сузах, в крепости, которая находится в области Элам. И увидел я в видении, что был у канала Улай[a].
  to: 'И увидел я в видении: когда я смотрел, я находился в Сузах, крепости в области Элам. И увидел я в видении, что я был у канала Улай[a].'
  rationale: Перевод пересмотрен только для устранения тяжеловесного синтаксиса и для более нейтральной передачи связи «Сузы, крепость в области Элам». Повтор «увидел я в видении», временное «когда я смотрел», прошедшее местонахождение и значение «у канала Улай» сохранены. Сноска исправлена стилистически, сохраняя её лексическое содержание.
