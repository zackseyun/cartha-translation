base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/005.yaml
  text: As I was considering[a], behold, a male goat came from the west over the face of the whole earth, without touching the ground[c][b]; and the goat had a conspicuous horn between its eyes.
translation:
  language: ru
  text: 'Пока я размышлял, и вот: с запада над всей землёй нёсся козёл[a], не касаясь земли[b]. У этого козла был заметный рог между глазами[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение особо указывает на самца козы.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и [он] не касается земли» — образ необычайно быстрого движения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выдающийся рог». Еврейское слово подчёркивает, что рог особенно заметен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי מֵבִין
  choice: Пока я размышлял
  rationale: Конструкция היה с причастием передаёт продолжающееся действие. В данном контексте מבין означает активное осмысление увиденного, а не уже достигнутое понимание.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет характерный для видения указательный переход к внезапно появляющемуся образу, не превращая его в чисто временное наречие.
- source_word: צְפִיר הָעִזִּים
  choice: козёл
  rationale: Еврейское выражение обозначает самца козы; русское «козёл» точно и естественно передаёт это значение.
- source_word: מִן הַמַּעֲרָב
  choice: с запада
  rationale: Прямое и естественное соответствие географическому значению מַעֲרָב.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: по поверхности всей земли
  rationale: Сохраняет пространственный образ движения над или по поверхности земли и широкий масштаб видения.
- source_word: וְאֵין נוֹגֵעַ בָּאָרֶץ
  choice: не касаясь земли
  rationale: Естественно передаёт необычную еврейскую конструкцию и зрительный образ чрезвычайно быстрого движения.
- source_word: קֶרֶן חָזוּת
  choice: приметный рог
  rationale: «Рог» сохраняет буквальный и символический образ, а «приметный» передаёт заметность и особую выразительность, заключённые в חָזוּת, без преждевременного истолкования символа.
- source_word: בֵּין עֵינָיו
  choice: между глазами
  rationale: Прямо передаёт пространственное положение рога, не заменяя выражение толкующим «на лбу».
theological_decisions:
- issue: Символические образы животного и рога в апокалиптическом видении
  choice: Сохранить буквальные образы «козёл» и «рог», не называя здесь их исторические или политические соответствия.
  alternative: Передать образы истолковательно, заранее обозначив царство или правителя.
  rationale: В этом стихе представлены сами образы видения; их объяснение даётся позднее. Перевод сохраняет последовательность текста и его символическое напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и зрительной выразительности пророческого видения. Синтаксис слегка упрощён ради ясности, однако указательное «вот» и буквальные символические образы сохранены.
