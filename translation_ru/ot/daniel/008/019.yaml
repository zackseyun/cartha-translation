  text: וַ/יֹּ֨אמֶר֙ הִנְ/נִ֣י מוֹדִֽיעֲ/ךָ֔ אֵ֥ת אֲשֶׁר יִהְיֶ֖ה בְּ/אַחֲרִ֣ית הַ/זָּ֑עַם כִּ֖י לְ/מוֹעֵ֥ד קֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/019.yaml
  text: Then he said, “Look, I am making known to you what will happen in the latter part of the indignation, for the end is for the appointed time.”
translation:
  language: ru
  text: 'И он сказал: «Вот, я открываю тебе, что произойдёт в последнюю пору гнева, потому что конец наступит в назначенное время».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: вот, я
  rationale: Сохраняет указательно-эмфатическую силу еврейского выражения и естественно вводит прямую речь по-русски.
- source_word: מוֹדִיעֲךָ
  choice: открываю тебе
  rationale: В данном контексте речь идёт не просто о сообщении, а о раскрытии смысла видения; выражение остаётся понятным и не добавляет специальной терминологии.
- source_word: בְּאַחֲרִית הַזָּעַם
  choice: в последнюю пору гнева
  rationale: Передаёт אַחֲרִית как заключительную часть или поздний этап периода, не сводя выражение исключительно к последнему мгновению.
- source_word: לְמוֹעֵד קֵץ
  choice: конец наступит в назначенное время
  rationale: Естественная русская передача с сохранением связи конца с установленным сроком; глагол «наступит» эксплицирует подразумеваемое отношение без изменения смысла.
theological_decisions:
- issue: Референт «гнева» и характер «конца»
  choice: Сохранены общие слова «гнев» и «конец» без уточнения их исторического или эсхатологического референта.
  alternative: Уточнить как «Божий гнев», «конец времён» или конкретный исторический период.
  rationale: Еврейский текст сам не выражает такие уточнения; их добавление преждевременно разрешило бы сохраняемую текстом богословскую и историческую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок слов слегка перестроен ради естественности; образ назначенного срока и напряжение между периодом гнева и его концом сохранены.
