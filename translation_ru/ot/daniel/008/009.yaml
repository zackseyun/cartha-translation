    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הָאַחַת מֵהֶם
  choice: И от одного из них
  rationale: Конструкция с מִן указывает на источник или происхождение; формулировка сохраняет местоименную неоднозначность оригинала.
- source_word: יָצָא קֶרֶן אַחַת מִצְּעִירָה
  choice: вышел небольшой рог
  rationale: Сохранён апокалиптический образ рога без истолкования как царя или державы. מִצְּעִירָה передаёт малый размер или незначительность.
- source_word: וַתִּגְדַּל יֶתֶר
  choice: и чрезвычайно разросся
  rationale: Глагол передаёт рост или увеличение, а יֶתֶר усиливает степень; «разросся» естественно выражает направленное расширение.
- source_word: אֶל הַנֶּגֶב וְאֶל הַמִּזְרָח
  choice: к югу, к востоку
  rationale: В географическом перечислении נגב и מזרח естественно обозначают стороны света.
- source_word: וְאֶל הַצְּבִי
  choice: и к Прекрасной земле
  rationale: צבי означает красоту, великолепие или желанность; описательный титул сохранён, а вероятный географический референт не подставлен в основной текст.
theological_decisions:
- issue: Истолковывать ли символ «рог» как царя, царство или политическую силу
  choice: Сохранить в основном тексте образ «рога»
  alternative: Передать как «царь», «держава» или «царство»
  rationale: Еврейский текст использует символический образ; его раскрытие непосредственно в переводе устранило бы намеренную образность.
- issue: Как передать הַצְּבִי
  choice: «Прекрасная земля» с пояснением в сноске
  alternative: «славная земля», «желанная земля» или прямое указание на землю Израиля
  rationale: Перевод сохраняет описательный характер выражения и не превращает вероятное толкование в явное содержание оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и апокалиптической образности. Прописная буква в сочетании «Прекрасная земля» подчёркивает употребление выражения как описательного названия.
