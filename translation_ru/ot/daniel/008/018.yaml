base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/018.yaml
  text: And while he was speaking with me[a], I fell into a deep sleep with my face to the ground[b]; but he touched me and made me stand up where I had been standing.
translation:
  language: ru
  text: Пока он говорил со мной, я погрузился в глубокий сон[a], лёжа лицом к земле. Но он коснулся меня и поставил там, где я стоял прежде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «меня охватило глубокое оцепенение». Еврейское слово может обозначать глубокий сон или подобное сну оцепенение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поставил меня на моё стояние». Вероятно, имеется в виду, что он вновь поставил Даниила прямо на прежнем месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: Пока он говорил со мной
  rationale: Предлог ב с инфинитивом выражает одновременность, а עִם обычно означает «с». Такая передача естественна по-русски и сохраняет смысл продолжающейся речи.
- source_word: נִרְדַּמְתִּי
  choice: я погрузился в глубокий сон
  rationale: Нифаль глагола רדם обозначает наступление глубокого сна или оцепенения; выбранная формулировка передаёт динамический оттенок, не вводя специального понятия «транс».
- source_word: עַל־פָּנַי אָרְצָה
  choice: лёжа лицом к земле
  rationale: Буквально выражение описывает положение «на лице, к земле». Добавление «лёжа» делает позу ясной и естественной для современного русского языка.
- source_word: וַיִּגַּע בִּי
  choice: он коснулся меня
  rationale: Глагол נגע с предлогом ב здесь имеет обычное значение физического прикосновения; контекст не требует более сильного смысла.
- source_word: וַיַּעֲמִידֵנִי עַל־עָמְדִי
  choice: поставил там, где я стоял прежде
  rationale: Каузативная форма עמד означает «поставить», а сжатое выражение עַל־עָמְדִי — буквально «на моё стояние». Перевод сохраняет как восстановление стоячего положения, так и возможный пространственный оттенок.
theological_decisions:
- issue: Характер состояния Даниила во время видения
  choice: глубокий сон или вызванное им оцепенение без специального богословского термина
  alternative: транс; экстатическое состояние
  rationale: Еврейский глагол רדם описывает глубокий сон или оцепенение, но сам по себе не требует технического обозначения экстаза. Перевод сохраняет повествовательную неопределённость.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным регистром. Синтаксис сохраняет последовательность еврейского текста, избегая конфессионально нагруженной терминологии.
