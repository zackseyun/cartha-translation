  text: וַ/אֲנִ֣י דָנִיֵּ֗אל נִהְיֵ֤יתִי וְ/נֶֽחֱלֵ֨יתִי֙ יָמִ֔ים וָ/אָק֕וּם וָ/אֶֽעֱשֶׂ֖ה אֶת מְלֶ֣אכֶת הַ/מֶּ֑לֶךְ וָ/אֶשְׁתּוֹמֵ֥ם עַל הַ/מַּרְאֶ֖ה וְ/אֵ֥ין מֵבִֽין־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/027.yaml
  text: And I[a], Daniel, was overcome and was sick for days. Then I rose and did the king’s work, but I was appalled by the vision, and there was no one who understood it.
translation:
  language: ru
  text: И я, Даниил, обессилел и болел несколько дней. Затем я встал и исполнял царские обязанности. Я был потрясён видением, но никто его не понимал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но я его не понимал». Еврейское выражение кратко и допускает как безличное прочтение («никто не понимал»), так и отнесение к самому Даниилу.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִהְיֵיתִי
  choice: обессилел
  rationale: В данном контексте форма от היה обозначает наступившее после видения состояние изнеможения, а не простое «был». «Обессилел» естественно передаёт физическую и душевную подавленность, не утверждая прямо, что Даниил потерял сознание.
- source_word: וְנֶחֱלֵיתִי יָמִים
  choice: и болел несколько дней
  rationale: Нифаль глагола חלה означает болезнь или ослабление, а יָמִים указывает на неопределённый период, измеряемый днями. По-русски «несколько дней» естественно сохраняет эту неопределённость.
- source_word: וָאָקוּם
  choice: Затем я встал
  rationale: Последовательная форма продвигает повествование и указывает на возвращение Даниила к деятельности после болезни.
- source_word: וָאֶעֱשֶׂה אֶת מְלֶאכֶת הַמֶּלֶךְ
  choice: исполнял царские обязанности
  rationale: מְלֶאכֶת הַמֶּלֶךְ — работа или поручения царя. Выражение «царские обязанности» ясно передаёт служебную деятельность Даниила, не добавляя конкретных деталей.
- source_word: וָאֶשְׁתּוֹמֵם
  choice: был потрясён
  rationale: Глагол выражает сильное ошеломление и внутреннюю опустошённость, а не простое удивление. «Потрясён» звучит естественно и сохраняет силу реакции.
- source_word: הַמַּרְאֶה
  choice: видением
  rationale: В контексте книги Даниила слово обозначает увиденное откровение, поэтому «видение» точнее, чем нейтральное «зрелище» или «увиденное».
- source_word: וְאֵין מֵבִין
  choice: но никто его не понимал
  rationale: 'В еврейском тексте буквально стоит безлично-бытийная конструкция без явно названного субъекта: «и нет понимающего». Основной перевод сохраняет наиболее прямое безличное прочтение, а возможное отнесение к самому Даниилу отмечено в сноске.'
theological_decisions:
- issue: Кто является субъектом выражения וְאֵין מֵבִין
  choice: 'Безличное прочтение: «никто его не понимал»'
  alternative: 'Личное прочтение о Данииле: «но я его не понимал»'
  rationale: В масоретском тексте нет местоимения первого лица, поэтому безличное прочтение формально ближе к еврейской конструкции. Однако ближайший контекст допускает, что подразумевается непонимание самого Даниила; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Формулировка «исполнял царские обязанности» естественнее буквального «делал работу царя»; неоднозначность заключительной еврейской конструкции не устранена, а вынесена в сноску.
