  text: וְ/הַ֨/נִּשְׁבֶּ֔רֶת וַ/תַּֽעֲמֹ֥דְנָה אַרְבַּ֖ע תַּחְתֶּ֑י/הָ אַרְבַּ֧ע מַלְכֻי֛וֹת מִ/גּ֥וֹי יַעֲמֹ֖דְנָה וְ/לֹ֥א בְ/כֹחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/022.yaml
  text: 'And as for the broken horn[a], in whose place four arose: four kingdoms will arise from that nation, but not with its power.'
translation:
  language: ru
  text: То, что рог был сломлен и вместо него поднялись четыре, означает, что из этого народа возникнут четыре царства, но не с его силой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но не с прежней силой», то есть не с силой царства, представленного сломанным рогом.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁבֶּרֶת
  choice: сломанный рог
  rationale: Причастие женского рода «сломанный» отсылает к существительному женского рода «рог» в предыдущем стихе; подразумеваемое слово восполнено для ясности.
- source_word: וַתַּעֲמֹדְנָה אַרְבַּע תַּחְתֶּיהָ
  choice: вместо которого поднялись четыре
  rationale: עמד здесь обозначает появление и возвышение политических сил, а תַּחְתֶּיהָ — занятие места сломанного рога.
- source_word: אַרְבַּע מַלְכֻיּוֹת
  choice: четыре царства
  rationale: В апокалиптическом политическом контексте מַלְכוּת естественно обозначает царства или царские владения, а не только отвлечённую царскую власть.
- source_word: מִגּוֹי
  choice: из этого народа
  rationale: Указательное «этого» естественно передаёт обратную отсылку к ранее названному народу, не добавляя конкретного исторического имени.
- source_word: יַעֲמֹדְנָה
  choice: возникнут
  rationale: Глагол עמד здесь говорит о возникновении политических образований; «возникнут» естественно звучит в пророческом объяснении.
- source_word: וְלֹא בְכֹחוֹ
  choice: но не с его силой
  rationale: Местоименный суффикс имеет мужской род и наиболее прямо допускает отсылку к первому царю, представленному сломанным рогом. Русское «его» сохраняет эту грамматическую форму, однако контекст оставляет некоторую неоднозначность.
theological_decisions:
- issue: Референт местоименного суффикса в וְלֹא בְכֹחוֹ
  choice: «не с его силой» — вероятная отсылка к силе первого царя, представленного сломанным рогом
  alternative: «не с прежней силой» или понимание как силы первоначального царства/рога
  rationale: Суффикс в еврейском тексте мужского рода, поэтому личная отсылка грамматически естественна. Вместе с тем символический язык тесно связывает царя, рог и царство; примечание сохраняет эту смысловую открытость без называния исторической личности.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным пророческим звучанием. Добавлено «означает», чтобы естественно передать пояснительный характер толкования видения; двоеточие отделяет символ от его истолкования.
