base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/003.yaml
  text: Then I lifted up my eyes and saw[a], and behold, one ram was standing before the canal, and it had two horns. The horns were high, but one was higher than the other[b], and the higher one came up last.
translation:
  language: ru
  text: 'Я поднял глаза и увидел: вот, перед каналом[a] стоял один баран. У него было два рога; оба рога были высокими, но один был выше другого, а более высокий появился последним[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потоком» или «рекой». Еврейское слово обозначает водный поток; в книге Даниила, вероятно, имеется в виду канал.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и более высокий поднялся позже».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Я поднял глаза
  rationale: Передаёт обычный древнееврейский оборот о направлении взгляда, сохраняя образность и естественно звуча по-русски.
- source_word: וָאֶרְאֶה וְהִנֵּה
  choice: 'и увидел: вот'
  rationale: Двоеточие естественно вводит содержание увиденного, а «вот» сохраняет указательную силу הִנֵּה и живость рассказа о видении.
- source_word: אַיִל אֶחָד
  choice: один баран
  rationale: «Баран» точно передаёт אַיִל, а «один» отражает אֶחָד и подчёркивает появление единственного символического животного.
- source_word: עֹמֵד לִפְנֵי הָאֻבָל
  choice: перед каналом стоял
  rationale: Причастие передано описанием положения животного; «перед» сохраняет пространственное значение לִפְנֵי, а «канал» наиболее вероятен для אֻבָל в контексте Даниила.
- source_word: וְלוֹ קְרָנָיִם
  choice: У него было два рога
  rationale: Естественная русская конструкция принадлежности точно передаёт буквальное «и у него — два рога».
- source_word: וְהַקְּרָנַיִם גְּבֹהוֹת
  choice: оба рога были высокими
  rationale: «Высокими» прямо передаёт значение גְּבֹהוֹת; «оба» естественно отсылает к уже названным двум рогам.
- source_word: וְהָאַחַת גְּבֹהָה מִן הַשֵּׁנִית
  choice: но один был выше другого
  rationale: Естественный русский сравнительный оборот сохраняет противопоставление и повтор корня со значением высоты.
- source_word: וְהַגְּבֹהָה עֹלָה בָּאַחֲרֹנָה
  choice: и более высокий вырос последним
  rationale: В данном образе עֹלָה обозначает появление или рост рога, а בָּאַחֲרֹנָה указывает, что это произошло после другого; вариант с «поднялся позже» сохранён в сноске.
theological_decisions:
- issue: Символические образы животного и рогов в апокалиптическом видении
  choice: Сохранить конкретные образы «баран» и «рога» без истолкования в основном тексте.
  alternative: Включить в стих объяснение того, какие царства или правители обозначены этими образами.
  rationale: Само видение сначала даёт символические образы, а их толкование следует далее в главе; перевод не должен преждевременно устранять эту композиционную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией рассказа о видении. Синтаксис сделан ясным для обычного читателя; частица «вот» сохраняет библейскую выразительность без архаизации.
