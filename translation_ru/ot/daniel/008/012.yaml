base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/012.yaml
  text: And a host was given over with the regular burnt offering because of transgression[a]; and it cast truth to the ground[c][b], and it acted and prospered.
translation:
  language: ru
  text: И воинство было отдано вместе[b] с регулярной жертвой всесожжения[a] из-за преступления; и повергла[c] истину на землю, действовала и преуспевала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «постоянное»; то есть регулярно приносившаяся храмовая жертва. Возможные переводы: «ежедневная жертва» или «постоянное приношение».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «против регулярной жертвы всесожжения». Еврейская конструкция и значение предлога здесь не вполне ясны.'
    reason: alternative_reading
  - marker: c
    text: В еврейском тексте глаголы «повергла», «действовала» и «преуспевала» стоят в женском роде единственного числа. В сжатом языке видения не вполне ясно, к кому именно они относятся; возможно, к враждебной силе, представленной в предшествующем контексте.
    reason: alternative_reading
lexical_decisions:
- source_word: וְצָבָא
  choice: воинство
  rationale: Слово צָבָא может обозначать войско или организованное множество. «Воинство» сохраняет собирательность и не сужает образ до обычной армии.
- source_word: תִּנָּתֵן
  choice: было предано
  rationale: Страдательная форма נתן означает «быть отданным, преданным». «Было предано» передаёт переход во власть враждебной силы.
- source_word: עַל
  choice: вместе с
  rationale: Связь, выраженная עַל, синтаксически трудна. «Вместе с» передаёт общую участь воинства и постоянного приношения, не исключая альтернативного значения «против».
- source_word: הַתָּמִיד
  choice: постоянная жертва всесожжения
  rationale: Субстантивированное תָּמִיד в храмовом контексте обозначает регулярно приносимую жертву. Развёрнутый перевод понятен современному читателю и сохраняет культовый смысл.
- source_word: בְּפָשַׁע
  choice: из-за преступления
  rationale: Предлог בְּ здесь естественно понимать причинно. Формулировка не уточняет, чьё именно преступление имеется в виду.
- source_word: וְתַשְׁלֵךְ
  choice: повергла
  rationale: Форма Hiphil глагола שלך означает «бросить, повергнуть». «Повергла» соответствует возвышенному регистру и образу низвержения истины на землю.
- source_word: אֱמֶת
  choice: истину
  rationale: אֱמֶת охватывает значения истины, верности и подлинности. «Истина» сохраняет широкую нравственно-религиозную силу слова.
- source_word: אַרְצָה
  choice: на землю
  rationale: Направительная форма от אֶרֶץ идиоматически означает движение вниз, к земле.
- source_word: וְעָשְׂתָה
  choice: действовала
  rationale: עשה без выраженного дополнения имеет широкое значение «делать, действовать». Перевод сохраняет лаконичность и не добавляет смысла «делала что хотела».
- source_word: וְהִצְלִיחָה
  choice: преуспевала
  rationale: Hiphil צלח означает добиваться успеха, преуспевать. Несовершенный вид по-русски естественно передаёт разворачивающееся в видении успешное действие.
theological_decisions:
- issue: К кому относятся глаголы женского рода в заключительной части стиха
  choice: Сохранено местоимение женского рода «она» без прямого отождествления его референта.
  alternative: «Он поверг истину»; «рог поверг истину»; «воинство повергло истину».
  rationale: В еврейском тексте стоят формы женского рода единственного числа, а референт в сжатом языке видения не назван однозначно. Перевод сохраняет эту грамматическую особенность и толковательную напряжённость.
- issue: Значение הַתָּמִיד
  choice: «постоянная жертва всесожжения»
  alternative: «ежедневная жертва»; «постоянное приношение».
  rationale: В данном храмовом контексте слово обозначает регулярное жертвоприношение; основной текст делает жертвенный смысл явным, а примечание сохраняет возможные способы передачи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой лексикой. «Воинство», «повергла» и «преуспевала» сохраняют достоинство текста, оставаясь понятными. Необычное «она» намеренно удерживает грамматическую и образную неоднозначность еврейского оригинала.
