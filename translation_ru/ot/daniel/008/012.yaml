  source_fidelity: 'Основной смысл передан верно: צָבָא передано собирательным «воинство», תִּנָּתֵן — страдательной конструкцией, בְּפָשַׁע — без уточнения субъекта преступления, а заключительные глаголы сохраняют женский род и не получают догматического истолкования. Однако «постоянная жертва всесожжения» менее точно и естественно передаёт культовое תָּמִיד, чем «регулярная жертва всесожжения».'
  naturalness: «Было отдано» естественнее современного «было предано», которое может вызывать значение измены. Явное местоимение «она» после слов «жертва всесожжения» в русском почти неизбежно отсылает именно к жертве и тем самым создаёт ложную синтаксическую определённость. Нулевое подлежащее при женских формах лучше сохраняет сжатость и неопределённость видения; примечание поясняет эту особенность.
  terminology: «Регулярная жертва всесожжения» ясно передаёт регулярный храмовый характер הַתָּמִיד и соответствует английскому POB audit trail («regular burnt offering»). «Истина» и «воинство» уместны по регистру и значению.
