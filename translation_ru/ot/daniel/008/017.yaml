  text: וַ/יָּבֹא֙ אֵ֣צֶל עָמְדִ֔/י וּ/בְ/בֹא֣/וֹ נִבְעַ֔תִּי וָ/אֶפְּלָ֖/ה עַל פָּנָ֑/י וַ/יֹּ֤אמֶר אֵלַ/י֙ הָבֵ֣ן בֶּן אָדָ֔ם כִּ֖י לְ/עֶת קֵ֥ץ הֶ/חָזֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/017.yaml
  text: So he came near where I was standing[a], and when he came, I was terrified and fell on my face. Then he said to me, “Understand, son of man[b], that the vision is for the time of the end.”
translation:
  language: ru
  text: 'Он подошёл к тому месту, где я стоял. Когда он приблизился, я ужаснулся и пал ниц. Он сказал мне: «Пойми, сын человеческий[a], что видение относится ко времени конца[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын человека»; возможно также: «человек» или «смертный».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «видение — о времени конца».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵצֶל עָמְדִי
  choice: к тому месту, где я стоял
  rationale: אֵצֶל выражает близость, а עָמְדִי указывает на место, где стоял Даниил. Такой перевод естественно передаёт пространственный смысл, не превращая выражение в прямое «ко мне».
- source_word: נִבְעַתִּי
  choice: я ужаснулся
  rationale: Форма нифаль от בעת обозначает сильный испуг, охвативший человека; «ужаснулся» сохраняет интенсивность реакции.
- source_word: וָאֶפְּלָה עַל־פָּנַי
  choice: и пал ниц
  rationale: Устойчивое еврейское выражение буквально описывает падение на лицо; русское «пал ниц» кратко и точно передаёт позу глубокого потрясения или преклонения.
- source_word: הָבֵן
  choice: Пойми
  rationale: Повелительная форма от בין призывает уразуметь смысл откровения. «Пойми» прямо и естественно передаёт это обращение.
- source_word: בֶּן אָדָם
  choice: сын человеческий
  rationale: Буквальное выражение подчёркивает человеческую природу Даниила и сохраняет словесные и тематические связи внутри книги, не сводя обращение к одному из возможных толкований.
- source_word: לְעֵת קֵץ
  choice: для времени конца
  rationale: Перевод близко следует конструкции с לְ и передаёт направленность видения к времени завершения, не уточняя сверх текста, какой именно эсхатологический период имеется в виду.
- source_word: הֶחָזוֹן
  choice: это видение
  rationale: Определённая форма отсылает к только что описанному видению. Указательное «это» в русском ясно выражает такую отсылку, не добавляя нового содержания.
theological_decisions:
- issue: Передача בֶּן אָדָם в апокалиптическом контексте
  choice: сын человеческий
  alternative: человек; смертный
  rationale: Буквальная форма сохраняет обращение к Даниилу как к человеку и возможные межтекстовые отголоски, не утверждая, что здесь употреблён позднейший титул.
- issue: Смысл לְעֵת קֵץ
  choice: это видение — для времени конца
  alternative: это видение относится ко времени конца; это видение касается установленного конца
  rationale: 'Основной перевод сохраняет неопределённость формулировки: видение направлено к некоторому времени завершения, но стих сам по себе не задаёт подробной эсхатологической схемы. Слово «установленного» не выражено явно и потому оставлено только как возможное смысловое прочтение.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пал ниц» сохранено как общеупотребительное и точное выражение; синтаксис сделан ясным для современного читателя без устранения смысловой открытости последней фразы.
