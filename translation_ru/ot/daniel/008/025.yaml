id: DAN.8.25
reference: Daniel 8:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַל שִׂכְל֗/וֹ וְ/הִצְלִ֤יחַ מִרְמָה֙ בְּ/יָד֔/וֹ וּ/בִ/לְבָב֣/וֹ יַגְדִּ֔יל וּ/בְ/שַׁלְוָ֖ה יַשְׁחִ֣ית רַבִּ֑ים וְ/עַ֤ל שַׂר שָׂרִים֙ יַעֲמֹ֔ד וּ/בְ/אֶ֥פֶס יָ֖ד יִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/025.yaml
  text: And through his shrewdness he will make deceit prosper in his hand; and in his heart he will magnify himself. In a time of security he will destroy many[a], and he will rise up against the Prince of princes; but he will be broken without hand.
translation:
  language: ru
  text: Благодаря своей проницательности он обеспечит успех обману в своих руках. В своём сердце он будет превозносить себя. В пору безопасности он погубит многих и выступит против Князя князей, но будет сокрушён не рукой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «без руки»; вероятный смысл — не человеческой рукой, то есть не обычной человеческой силой.'
    reason: Лаконичный еврейский оборот допускает буквальную передачу, но подразумевает отсутствие обычного человеческого воздействия.
lexical_decisions:
- source_word: שִׂכְלוֹ
  choice: своей проницательности
  rationale: Слово обозначает разумение, рассудительность или искусность; в данном враждебном контексте «проницательность» сохраняет значение умственных способностей, не усиливая его до однозначно отрицательной «хитрости».
- source_word: וְהִצְלִיחַ מִרְמָה
  choice: обеспечит успех обману
  rationale: Каузативная форма глагола צלח указывает, что он сделает обман успешным, а не просто сам будет преуспевать.
- source_word: בְּיָדוֹ
  choice: в своих руках
  rationale: Сохранён образ руки как сферы власти и управления; русское выражение естественно передаёт, что обман становится действенным под его контролем.
- source_word: וּבִלְבָבוֹ יַגְדִּיל
  choice: в своём сердце он будет превозносить себя
  rationale: Перевод сохраняет образ сердца как внутреннего мира и подразумеваемую возвратность глагола גדל, выражающую внутреннюю гордыню.
- source_word: וּבְשַׁלְוָה
  choice: в пору безопасности
  rationale: שַׁלְוָה может означать покой, безмятежность или защищённость. Формулировка сохраняет обстоятельственную неоднозначность и передаёт состояние спокойствия, при котором жертвы не ожидают нападения.
- source_word: יַשְׁחִית רַבִּים
  choice: погубит многих
  rationale: Каузативная форма שׁחת здесь естественно означает привести к гибели или разорению; «погубит» уместно в возвышенном, но современном русском регистре.
- source_word: שַׂר שָׂרִים
  choice: Князя князей
  rationale: Сочетание выражает высшее положение среди правителей. «Князь князей» сохраняет структуру и возвышенный титульный характер оригинала.
- source_word: יַעֲמֹד עַל
  choice: выступит против
  rationale: Глагол с עַל выражает враждебное противостояние; «выступит против» естественно передаёт этот смысл по-русски.
- source_word: וּבְאֶפֶס יָד
  choice: и не рукой
  rationale: Сжатая формулировка сохраняет эллиптичность и образность еврейского выражения, не добавляя в основной текст отсутствующее в оригинале слово «человеческой».
- source_word: יִשָּׁבֵר
  choice: будет сокрушён
  rationale: Страдательная форма שׁבר передаёт образ слома и поражения; «сокрушён» сохраняет метафору и соответствует возвышенному контексту видения.
theological_decisions:
- issue: Референт и написание שַׂר שָׂרִים
  choice: Князя князей
  alternative: князя князей; верховного правителя
  rationale: Контекст представляет носителя титула как высшего над всеми правителями, вероятно божественного или трансцендентного. Прописная буква отмечает титульное употребление, но перевод не уточняет личность референта сверх сказанного в стихе.
- issue: Смысл וּבְאֶפֶס יָד
  choice: будет сокрушён — и не рукой
  alternative: будет сокрушён не человеческой рукой
  rationale: Еврейский текст не содержит слова «человеческой», хотя оборот, вероятно, указывает на поражение не обычной человеческой силой. Основной текст сохраняет лаконичность и напряжение оригинала, а примечание поясняет вероятный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, соответствующим апокалиптическому видению. Синтаксис сделан ясным для широкого читателя, при этом сохранены ключевые образы сердца, руки, возвышения и сокрушения.
