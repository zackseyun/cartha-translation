revisions:
- from: И под конец их царства, когда отступники достигнут полной меры, восстанет царь с дерзким лицом, искусный в хитросплетениях[a].
  to: И под конец их царства, когда отступники достигнут полной меры, восстанет царь с суровым лицом, понимающий загадки[a].
  rationale: Исправление возвращает заключительное определение к основному, нерасширенному смыслу еврейского חִידוֹת и сохраняет допустимую альтернативу в сноске. Также устранён не вполне естественный русский образ «дерзкого лица» без изменения характеристики царя.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:45Z'
review_pass:
  verdict: revise
  source_fidelity: Начальная временная формула, единственное «их царства», полнота проступков и восшествие царя переданы точно. Однако «искусный в хитросплетениях» заметно сужает и конкретизирует חִידוֹת, которое прежде всего обозначает загадки, загадочные/тёмные изречения; политическая интрига возможна лишь как контекстуальный вывод. «С дерзким лицом» также менее естественно по-русски и несколько ослабляет смысл жёсткого, сурового облика в עַז פָּנִים.
  naturalness: «Под конец их царства» и «восстанет царь» естественны в современном литературном русском с уместным пророческим оттенком. Оборот «с дерзким лицом» звучит менее идиоматично, чем «с суровым лицом».
  terminology: «Отступники» допустимо передаёт הַפֹּשְׁעִים как сознательных нарушителей верности. «Загадки» сохраняет основной лексический смысл חִידוֹת; альтернативное «тёмные изречения» следует оставить в примечании, не утверждая спорную интерпретацию как основной текст.
  issues:
  - severity: medium
    issue: «искусный в хитросплетениях»
    rationale: Это контекстуально мотивированная, но чрезмерно конкретная интерпретация חִידוֹת. Основной текст должен сохранять буквальный смысл «загадки»; возможный смысл загадочных или тёмных речений можно пояснить в сноске.
  - severity: low
    issue: «с дерзким лицом»
    rationale: 'Русское сочетание стилистически неловко: дерзким обычно бывает человек, взгляд или выражение, а не лицо. «С суровым лицом» естественнее и передаёт жёсткость/свирепость еврейского идиома.'
  revised_text: И под конец их царства, когда отступники достигнут полной меры, восстанет царь с суровым лицом, понимающий загадки[a].
