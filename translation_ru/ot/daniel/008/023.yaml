source:
  edition: WLC
  text: וּֽ/בְ/אַחֲרִית֙ מַלְכוּתָ֔/ם כְּ/הָתֵ֖ם הַ/פֹּשְׁעִ֑ים יַעֲמֹ֛ד מֶ֥לֶךְ עַז פָּנִ֖ים וּ/מֵבִ֥ין חִידֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/023.yaml
  text: And at the latter end of their kingdom[a], when the transgressors have reached their full measure, a king will arise, fierce in countenance and skilled in intrigue.
translation:
  language: ru
  text: И под конец их царства, когда отступники достигнут полной меры, восстанет царь с суровым лицом, понимающий загадки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понимающий тёмные изречения».'
    reason: 'Лексическая неоднозначность חִידוֹת: слово может обозначать загадки или загадочные, тёмные изречения.'
lexical_decisions:
- source_word: וּבְאַחֲרִית מַלְכוּתָם
  choice: И под конец их царства
  rationale: אַחֲרִית обозначает заключительную часть или конец периода; מַלְכוּת стоит в единственном числе с суффиксом 3-го лица множественного числа, поэтому сохранено собирательное «их царства», а не «их царств».
- source_word: כְּהָתֵם הַפֹּשְׁעִים
  choice: когда отступники достигнут полной меры
  rationale: תמם выражает завершённость или полноту. Формулировка передаёт достижение мятежом полной меры, не создавая впечатления, будто сами нарушители перестанут существовать. «Отступники» сохраняет присущий פשׁע оттенок сознательного мятежа и нарушения верности.
- source_word: יַעֲמֹד מֶלֶךְ
  choice: восстанет царь
  rationale: В контексте смены властителей עמד означает появление или возвышение правителя; «восстанет» естественно для возвышенного пророческого регистра.
- source_word: עַז פָּנִים
  choice: с дерзким лицом
  rationale: Буквально «сильный/жёсткий лицом»; оборот указывает на наглость, суровость и неустрашимую дерзость. Перевод сохраняет образ лица и звучит понятно по-русски.
- source_word: וּמֵבִין חִידוֹת
  choice: искусный в хитросплетениях
  rationale: בין с חידות может означать понимание загадок, тёмных изречений или сложных, коварных замыслов. В описании враждебного царя «искусный в хитросплетениях» передаёт практическую проницательность и коварство, а буквальные возможности сохранены в примечании.
theological_decisions:
- issue: Смысл וּמֵבִין חִידוֹת
  choice: Практическая проницательность и искусность в сложных либо коварных замыслах
  alternative: «понимающий загадки» или «понимающий тёмные изречения»
  rationale: Контекст характеризует опасного правителя, поэтому политическая хитрость вероятна, однако еврейский оборот допускает более буквальный смысл; неоднозначность явно сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис близок к еврейскому, но остаётся естественным и понятным; неоднозначность заключительного определения не устранена, а вынесена в примечание.
