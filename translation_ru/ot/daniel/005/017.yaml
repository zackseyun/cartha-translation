base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/017.yaml
  text: Then Daniel answered and said before the king, “Let your gifts remain yours, and give your rewards to another. Nevertheless, I will read the writing for the king and make its interpretation known to him.”
translation:
  language: ru
  text: 'Тогда Даниил ответил и сказал перед царём: «Пусть твои дары останутся у тебя, а награды свои отдай другому. Но я прочту царю надпись и объясню ему её значение».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее действие; «тогда» естественно передаёт последовательность событий.
- source_word: עָנֵה ... וְאָמַר
  choice: ответил и сказал
  rationale: Сохранены оба глагола устойчивой семитской повествовательной формулы, поскольку по-русски сочетание остаётся понятным и уместным в библейском повествовании.
- source_word: קֳדָם מַלְכָּא
  choice: перед царём
  rationale: Передаёт буквальное значение присутствия перед царём и сохраняет придворную обстановку.
- source_word: מַתְּנָתָךְ ... לָךְ לֶהֶוְיָן
  choice: Пусть твои дары останутся у тебя
  rationale: Естественно выражает отказ Даниила от даров, сохраняя принадлежность царю, обозначенную арамейской конструкцией.
- source_word: נְבָזְבְּיָתָךְ לְאָחֳרָן הַב
  choice: награды свои отдай другому
  rationale: «Награды» соответствует обещанному царскому вознаграждению, а «другому» сохраняет форму единственного числа.
- source_word: בְּרַם
  choice: Но
  rationale: 'Передаёт контраст: Даниил отвергает вознаграждение, но соглашается прочесть и истолковать надпись. В современном русском «но» звучит естественнее тяжеловесного «тем не менее».'
- source_word: כְּתָבָא
  choice: написанное
  rationale: В контексте речь идёт о загадочной надписи на стене; субстантивированное «написанное» естественно передаёт арамейское слово без добавления отсутствующей в стихе стены.
- source_word: אֶקְרֵא לְמַלְכָּא
  choice: я прочту царю
  rationale: Передаёт действие и адресата, сохраняя явное упоминание царя.
- source_word: פִשְׁרָא אֲהוֹדְעִנֵּהּ
  choice: объясню ему его смысл
  rationale: Функционально передаёт технический термин «толкование» и каузатив «дам узнать» естественным современным русским выражением; первое «его» относится к царю, второе — к написанному.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксический дублет «ответил и сказал» сохранён ради близости к арамейскому тексту; остальная фраза сформулирована естественно и ясно. Стих не содержит текстологических или богословских неоднозначностей, требующих сноски.
