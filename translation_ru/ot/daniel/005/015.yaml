  text: וּ/כְעַ֞ן הֻעַ֣לּוּ קָֽדָמַ֗/י חַכִּֽימַיָּ/א֙ אָֽשְׁפַיָּ֔/א דִּֽי כְתָבָ֤/ה דְנָה֙ יִקְר֔וֹן וּ/פִשְׁרֵ֖/הּ לְ/הוֹדָעֻתַ֑/נִי וְ/לָֽא כָהֲלִ֥ין פְּשַֽׁר מִלְּתָ֖/א לְ/הַחֲוָיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/015.yaml
  text: And now the wise men, the enchanters, have been brought before me to read this writing and make its interpretation known to me, but they were not able to show the interpretation of the message.
translation:
  language: ru
  text: И вот мудрецы и заклинатели были приведены ко мне, чтобы прочитать эту надпись и сообщить мне её толкование, но они не смогли объяснить смысл написанного.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְעַן
  choice: И вот
  rationale: Передаёт арамейский переход к текущему моменту рассказа естественно для современного русского языка.
- source_word: חַכִּימַיָּא אָשְׁפַיָּא
  choice: мудрецы и заклинатели
  rationale: Сохраняет две отдельные придворные группы; אָשְׁפַיָּא обозначает специалистов по заклинаниям.
- source_word: כְתָבָה דְנָה
  choice: эту надпись
  rationale: В контексте речь идёт о письменных знаках на стене; «надпись» звучит точнее и естественнее, чем общее «писание».
- source_word: פִשְׁרֵהּ
  choice: её толкование
  rationale: Арамейское פשר означает истолкование или разъяснение загадочного текста.
- source_word: פְּשַׁר מִלְּתָא לְהַחֲוָיָה
  choice: объяснить смысл написанного
  rationale: Идиоматично передаёт «показать/сообщить толкование дела (слова)» и связывает выражение с надписью, не добавляя особого богословского смысла.
