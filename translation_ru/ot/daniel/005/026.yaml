  text: 'This is the interpretation of the message: MENE—God has numbered your kingdom and finished it[a][b].'
translation:
  language: ru
  text: 'Вот истолкование написанного[b]: МЕНЕ[a] — Бог исчислил твоё царство и положил ему конец.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
