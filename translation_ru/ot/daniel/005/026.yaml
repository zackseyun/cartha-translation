lexical_decisions:
- source_word: דְּנָה
  choice: Вот
  rationale: Указательное слово вводит непосредственное объяснение; «Вот» естественно передаёт эту функцию в современном русском.
- source_word: פְּשַׁר
  choice: истолкование
  rationale: В книге Даниила слово обозначает раскрытие смысла загадочного сна или текста; «истолкование» сохраняет торжественный и точный регистр.
- source_word: מִלְּתָא
  choice: написанного
  rationale: Слово может означать «слово», «дело» или «высказывание»; в данном контексте речь идёт о надписи на стене. Субстантивированное «написанное» звучит естественно, а примечание сохраняет широту значения.
- source_word: מְנֵא
  choice: МЕНЕ
  rationale: Это цитируемое слово надписи, поэтому оно сохраняется в транслитерации и затем объясняется родственным глаголом.
- source_word: מְנָה
  choice: исчислил
  rationale: Глагол означает «сосчитал, исчислил». «Исчислил» передаёт судебно-торжественный оттенок и поддерживает словесную связь с МЕНЕ.
- source_word: אֱלָהָא
  choice: Бог
  rationale: Определённая форма в контексте естественно передаётся русским «Бог».
- source_word: מַלְכוּתָךְ
  choice: твоё царство
  rationale: Слово обозначает царство, царскую власть или правление; «твоё царство» является прямым и контекстуально уместным соответствием.
- source_word: וְהַשְׁלְמַהּ
  choice: и положил ему конец
  rationale: Причинная порода глагола со значением завершения здесь указывает на прекращение царства. Эта формулировка ясно передаёт итоговый судебный смысл, не предполагая успешного завершения.
theological_decisions:
- issue: Характер Божьего действия в объяснении МЕНЕ
  choice: Бог исчислил царство Валтасара и положил ему конец
  alternative: Бог исчислил дни твоего царства и завершил его
  rationale: Текст прямо говорит об исчислении самого царства и его прекращении. Добавление «дни» могло бы пояснить образ, но отсутствует в данном стихе; поэтому оно не внесено, а напряжение между исчислением и окончанием сохранено.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной торжественностью. Транслитерированное слово надписи выделено прописными буквами; синтаксис краток и пригоден для публичного чтения.
