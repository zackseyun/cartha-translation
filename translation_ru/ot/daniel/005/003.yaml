  text: Then they brought in the gold vessels that had been taken out of the temple[a], the house of God, which was in Jerusalem, and the king and his nobles[b], his wives and his concubines drank from them.
translation:
  language: ru
  text: Тогда принесли золотые сосуды, которые вынесли из храма[a] — дома Божьего в Иерусалиме, — и царь, его вельможи, его жёны и наложницы пили из них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые были вынесены из храма». В арамейском употреблена активная форма, однако по-русски возможна пассивная конструкция, сохраняющая внимание на сосудах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: הַיְתִיו
  choice: принесли
  rationale: В сочетании с прямым дополнением «золотые сосуды» глагол обозначает внесение или доставку предметов; неопределённо-личная русская конструкция не добавляет отсутствующего в тексте конкретного деятеля.
- source_word: מָאנֵי דַהֲבָא
  choice: золотые сосуды
  rationale: מָאנֵי обозначает сосуды, утварь или предметы; «сосуды» точно подходит для храмовой утвари и сохраняет традиционный, но понятный образ.
- source_word: דִּי הַנְפִּקוּ
  choice: которые были вынесены
  rationale: Форма буквально допускает активное «которые вынесли», однако пассивная русская конструкция удерживает внимание на сосудах и не вводит неуказанный субъект; активная форма отмечена в сноске.
- source_word: מִן הֵיכְלָא
  choice: из храма
  rationale: В данном контексте הֵיכְלָא означает храмовое здание в Иерусалиме; «храм» — точный и общепонятный эквивалент.
- source_word: דִּי בֵית אֱלָהָא
  choice: дома Божьего
  rationale: Это приложение, поясняющее слово «храм»; оборот сохраняет библейское выражение и естественно звучит по-русски.
- source_word: דִּי בִירוּשְׁלֶם
  choice: в Иерусалиме
  rationale: Местоположение дома Божьего передано компактно; отдельное относительное предложение по-русски было бы избыточным.
- source_word: וְאִשְׁתִּיו בְּהוֹן
  choice: и … пили из них
  rationale: Предлог указывает на использование сосудов для питья; «пили из них» — естественная современная формулировка.
- source_word: מַלְכָּא
  choice: царь
  rationale: Прямой эквивалент арамейского существительного в данном историко-повествовательном контексте.
- source_word: רַבְרְבָנוֹהִי
  choice: его вельможи
  rationale: Слово обозначает высокопоставленных людей или сановников царя; «вельможи» сохраняет достоинство стиля и исторический колорит.
- source_word: שֵׁגְלָתֵהּ
  choice: жёны
  rationale: Термин относится к царским жёнам или супругам; «жёны» прозрачно передаёт смысл, не сужая его до главных цариц. Альтернатива указана в сноске.
- source_word: וּלְחֵנָתֵהּ
  choice: наложницы
  rationale: Установившийся точный эквивалент для женщин царского гарема, имевших более низкий брачный статус.
