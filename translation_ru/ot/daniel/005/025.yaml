  text: 'И вот надпись, которая была начертана: «МЕНЕ[a], МЕНЕ, ТЕКЕЛ и ПАРСИН».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Арамейские слова оставлены в транслитерации, потому что далее Даниил истолковывает их через игру слов: «МЕНЕ» связывается с исчислением, «ТЕКЕЛ» — со взвешиванием, а «ПАРСИН»/«ПЕРЕС» — с разделением и также перекликается с названием персов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְנָה
  choice: И вот
  rationale: Передаёт соединительный ו и указательное דְנָה, естественно вводя содержание надписи в русском повествовании.
- source_word: כְתָבָא
  choice: надпись
  rationale: В контексте письменных знаков на стене «надпись» точнее общего «письмо» или «написание».
- source_word: דִּי רְשִׁים
  choice: которая была начертана
  rationale: Относительная конструкция и пассив переданы прямо; «начертана» естественно сочетается со словом «надпись» и сохраняет торжественный регистр.
- source_word: מְנֵא מְנֵא
  choice: МЕНЕ, МЕНЕ
  rationale: Транслитерация сохраняет загадочность надписи, последующую игру слов и точный повтор исходного текста.
- source_word: תְּקֵל
  choice: ТЕКЕЛ
  rationale: Транслитерация не предваряет данное далее толкование через значение взвешивания.
- source_word: וּפַרְסִין
  choice: и ПАРСИН
  rationale: Сохранён явный союз ו и арамейская форма множественного числа; транслитерация позволяет удержать игру слов с разделением и персами.
