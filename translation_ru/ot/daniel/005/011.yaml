base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/011.yaml
  text: There is a man in your kingdom in whom is a spirit of the holy gods[a], and in the days of your father light and insight and wisdom like the wisdom of the gods were found in him. And King Nebuchadnezzar, your father, appointed him chief of the magicians, enchanters, Chaldeans, and diviners—your father[b], the king.
translation:
  language: ru
  text: В твоём царстве есть человек, в котором есть дух святых богов[a]. Во дни твоего отца в нём обнаружились свет, проницательность и мудрость, подобная мудрости богов. Царь Навуходоносор, твой отец, поставил его главой заклинателей, чародеев, халдеев и прорицателей — твой отец[b], царь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух святого Бога» либо «дух святого Бога». В арамейском тексте слово «боги» и согласованное с ним определение стоят во множественном числе, однако некоторые понимают слова царицы как указание на единого истинного Бога.'
    reason: alternative_reading
  - marker: b
    text: Слова «твой отец» в придворном и династическом контексте могут также означать «твой предок» или «твой предшественник».
    reason: cultural_note
