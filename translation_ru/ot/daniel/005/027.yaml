    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקֵל
  choice: Текел
  rationale: Сохраняется транслитерация написанного арамейского слова, которое Даниил затем истолковывает; прямой перевод стёр бы различие между словом надписи и его объяснением.
- source_word: תְּקִילְתָּה
  choice: ты был взвешен
  rationale: Пассивная глагольная форма обращена к Валтасару и обозначает совершившееся действие оценки; русское прошедшее время естественно передаёт этот смысл.
- source_word: בְמֹאזַנְיָא
  choice: на весах
  rationale: Речь идёт о приспособлении для взвешивания. В современном русском нормативно и естественно выражение «взвешен на весах»; оно сохраняет образ оценки.
- source_word: וְהִשְׁתְּכַחַתְּ
  choice: и найден
  rationale: Передаёт результат обнаружения после проверки и сохраняет параллельную пассивную конструкцию арамейского текста.
- source_word: חַסִּיר
  choice: неполновесным
  rationale: Слово обозначает недостаточность, нехватку. «Неполновесным» одновременно сохраняет буквальный образ недостающего веса и переносный смысл несоответствия требуемой мере.
theological_decisions:
- issue: Характер образа суда
  choice: Сохранён образ божественной оценки через взвешивание и обнаруженную неполноценность, без поясняющего догматического расширения.
  alternative: 'Передать прямо: «Бог осудил тебя и признал виновным».'
  rationale: Исходный текст выражает приговор посредством метафоры взвешивания. Её следует сохранить, не сводя к буквальной торговой операции и не заменяя истолковывающим пересказом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. «Неполновесным» понятно в контексте весов и сохраняет смысловую связь между буквальным образом недостаточного веса и судебной оценкой.
