lexical_decisions:
- source_word: אִשְׁתִּיו
  choice: они пили
  rationale: Пеаль, перфект, 3-е лицо множественного числа; в повествовательной последовательности естественно передаётся русским прошедшим временем несовершенного вида, обозначающим происходившее во время пира действие.
- source_word: חַמְרָא
  choice: вино
  rationale: Эмфатическое состояние указывает на конкретное вино, однако русский язык обычно не выражает здесь определённость отдельным средством; «пили вино» звучит естественно.
- source_word: וְשַׁבַּחוּ
  choice: и восхваляли
  rationale: Глагол означает воздавать хвалу; «восхваляли» сохраняет культовый оттенок и соответствует параллельному длительному описанию действий.
- source_word: לֵאלָהֵי
  choice: богов из
  rationale: Предлог ל отмечает объект хвалы, а последующие названия материалов характеризуют изображения божеств. Русское «богов из…» ясно и естественно передаёт смысл.
- source_word: דַּהֲבָא וְכַסְפָּא
  choice: золота и серебра
  rationale: Названия материалов переданы родительным падежом после «из».
- source_word: נְחָשָׁא
  choice: меди
  rationale: Арамейское слово может обозначать медь или бронзу. Основной текст сохраняет более прямое русское соответствие «медь», а вариант «бронза» указан в сноске.
- source_word: פַרְזְלָא
  choice: железа
  rationale: Стандартное соответствие названию металла.
- source_word: אָעָא
  choice: дерева
  rationale: Стандартное соответствие в перечне материалов идолов.
- source_word: וְאַבְנָא
  choice: камня
  rationale: В контексте материала для изображений естественно русское «камень».
theological_decisions:
- issue: Передача אֱלָהֵי как «боги» или «Бог»
  choice: богов
  alternative: Бога
  rationale: Форма множественного числа и перечень материалов однозначно указывают на языческих богов, представленных их изображениями; речь не идёт о Боге Израиля.
- issue: Следует ли явно назвать их идолами или изображениями
  choice: сохранить «богов из…»
  alternative: «идолов из…» или «изображения богов из…»
  rationale: Источник говорит буквально о «богах» из перечисленных материалов. Такая формулировка сохраняет полемическую силу и не вносит пояснение непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повторяющиеся действия переданы несовершенным видом («пили», «восхваляли»); перечень материалов оформлен естественной русской конструкцией с предлогом «из».
