base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/010.yaml
  text: Because of the words of the king and his nobles[a], the queen entered the banquet hall. The queen spoke and said, “O king, live forever! Do not let your thoughts terrify you[b], and do not let your face grow pale.”
translation:
  language: ru
  text: 'Из-за слов царя и его вельмож царица вошла в пиршественный зал. Царица заговорила и сказала[a]: «Царь, живи вовеки! Пусть мысли твои не ужасают тебя и лицо твоё не бледнеет[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ответила и сказала». Арамейский оборот может вводить как ответ, так и начало высказывания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть сияние твоё не изменяется». Оборот относится к внешнему виду лица; ср. сходное выражение в этой главе об изменении цвета лица от страха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקֳבֵל מִלֵּי
  choice: услышав слова
  rationale: 'Предлог לָקֳבֵל указывает здесь на причину или повод для действия: царица входит вследствие слов царя и вельмож. Русское деепричастное сочетание естественно передаёт повествовательную связь, хотя восприятие этих слов подразумевается контекстом.'
- source_word: רַבְרְבָנוֹהִי
  choice: его вельмож
  rationale: Слово обозначает высокопоставленных сановников. «Вельможи» ясно передаёт их высокий придворный статус и соответствует торжественному повествовательному регистру.
- source_word: לְבֵית מִשְׁתְּיָא
  choice: в пиршественный зал
  rationale: Буквально выражение означает «в дом пира/питья»; «пиршественный зал» естественно обозначает место царского пира.
- source_word: עללת
  choice: вошла
  rationale: Прямое и естественное соответствие глаголу со значением входа.
- source_word: עֲנָת ... וַאֲמֶרֶת
  choice: заговорила и сказала
  rationale: Двойная формула может означать «ответила и сказала», но прямого обращения к царице перед этим нет. «Заговорила и сказала» сохраняет начало речи без внесения обязательного оттенка ответа.
- source_word: לְעָלְמִין חֱיִי
  choice: Царь, живи вовеки!
  rationale: Сохранена стандартная придворная формула пожелания жизни царю.
- source_word: רַעְיוֹנָךְ
  choice: мысли твои
  rationale: Существительное обозначает мысли или размышления; тревожащая сила выражена следующим глаголом, поэтому она не переносится в значение самого существительного.
- source_word: יְבַהֲלוּךְ
  choice: не ужасают тебя
  rationale: Глагол выражает сильное смятение, испуг или ужас; формулировка передаёт интенсивность состояния царя.
- source_word: זִיוָיָךְ ... יִשְׁתַּנּוֹ
  choice: лицо твоё не бледнеет
  rationale: Буквально речь идёт об изменении сияния или внешнего вида; в контексте это идиома изменения цвета лица от страха. «Не бледнеет» естественно выражает смысл, а сноска сохраняет буквальный образ и его более широкую возможность.
