base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/020.yaml
  text: But when his heart was lifted up and his spirit was hardened in arrogance[a], he was brought down from his royal throne[b], and his glory was taken away from him.
translation:
  language: ru
  text: Но когда сердце его вознеслось и дух его ожесточился в дерзости[a], он был низведён с царского престола, и слава его[b] была отнята у него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух его укрепился в самонадеянной дерзости»; или: «дух его стал надменным».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «честь его»; или: «величие его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְדִי
  choice: Но когда
  rationale: Передаёт временное значение арамейского союза и контраст с предшествующим описанием величия царя.
- source_word: רִם לִבְבֵהּ
  choice: сердце его вознеслось
  rationale: Сохраняет исходную метафору возвышенного сердца и её ясный контекстуальный смысл — гордость.
- source_word: וְרוּחֵהּ תִּקְפַת לַהֲזָדָה
  choice: дух его ожесточился в высокомерии
  rationale: Передаёт внутреннее укрепление или ожесточение духа, направленное к надменной, самонадеянной дерзости; примечание сохраняет возможные смысловые оттенки.
- source_word: הָנְחַת
  choice: он был низведён
  rationale: Сохраняет пассивность формулировки и мотив унижения, противопоставленный вознесению сердца, не называя прямо действующее лицо.
- source_word: מִן כָּרְסֵא מַלְכוּתֵהּ
  choice: с царского престола
  rationale: Естественно по-русски передаёт престол царской власти.
- source_word: וִיקָרֵהּ
  choice: слава его
  rationale: В царском контексте יְקָר обозначает славу, честь или величие; основной вариант сохраняет широкое значение слова.
- source_word: הֶעְדִּיוּ מִנֵּהּ
  choice: была отнята у него
  rationale: Пассивная конструкция естественно передаёт неопределённого деятеля множественного числа, не вводя отсутствующего в стихе явного субъекта.
theological_decisions:
- issue: Характер падения Навуходоносора
  choice: Низложение передано пассивной конструкцией без прямого упоминания Бога в этом стихе.
  alternative: Передать конструкцию как явный божественный пассив, назвав Бога действующим лицом.
  rationale: Более широкий контекст указывает на Божье действие, однако данная строка прямо не называет действующего; перевод сохраняет эту сдержанность и не устраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Порядок «сердце его», «дух его», «слава его» поддерживает достоинство речи, оставаясь понятным современному читателю.
