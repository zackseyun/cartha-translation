source:
  edition: WLC
  text: בֵּלְשַׁאצַּ֞ר אֲמַ֣ר בִּ/טְעֵ֣ם חַמְרָ֗/א לְ/הַיְתָיָה֙ לְ/מָאנֵי֙ דַּהֲבָ֣/א וְ/כַסְפָּ֔/א דִּ֤י הַנְפֵּק֙ נְבוּכַדְנֶצַּ֣ר אֲב֔/וּהִי מִן הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וְ/יִשְׁתּ֣וֹן בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/002.yaml
  text: Belshazzar gave the order[a], as he tasted the wine, to bring the vessels of gold and silver that Nebuchadnezzar his father had taken out of the temple that was in Jerusalem, so that the king and his nobles, his wives and his concubines[b], might drink from them.
translation:
  language: ru
  text: Когда Валтасар пил вино[a], он приказал принести золотые и серебряные сосуды, которые Навуходоносор, его отец[b], вынес из храма в Иерусалиме, чтобы царь, его вельможи, жёны и наложницы пили из них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находясь под воздействием вина»; буквально по-арамейски: «во вкусе вина».'
    reason: lexical_alternative
  - marker: b
    text: 'По-арамейски: «его отец»; в царской речи это слово также могло означать «его предок» или «предшественник».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַר
  choice: приказал
  rationale: Глагол буквально означает «сказал», но здесь вводит распоряжение принести сосуды; «приказал» естественно передаёт его побудительную силу в придворном контексте.
- source_word: בִּטְעֵם חַמְרָא
  choice: вкусив вина
  rationale: Оборот буквально означает «во вкусе вина». Выбранная формулировка сохраняет конкретный образ и не утверждает однозначно, что царь был пьян; возможный смысл опьянения отмечен в сноске.
- source_word: לְהַיְתָיָה
  choice: принести
  rationale: Каузативная форма обозначает доставление сосудов к царю; «принести» точно и естественно передаёт действие.
- source_word: מָאנֵי דַּהֲבָא וְכַסְפָּא
  choice: золотые и серебряные сосуды
  rationale: מָאנֵי — широкое обозначение утвари или сосудов. «Сосуды» сохраняет храмовый оттенок и не сужает значение до чаш.
- source_word: הַנְפֵּק
  choice: вынес
  rationale: Глагол означает «вывести/вынести». В данном контексте речь идёт об изъятии священных сосудов из Иерусалимского храма.
- source_word: אֲבוּהִי
  choice: его отец
  rationale: Сохранено буквальное значение арамейского слова; более широкое царское употребление — «предок» или «предшественник» — указано в сноске.
- source_word: הֵיכְלָא
  choice: храм
  rationale: В связи с Иерусалимом слово однозначно обозначает храм.
- source_word: וְיִשְׁתּוֹן בְּהוֹן
  choice: чтобы … пили из них
  rationale: Форма выражает цель распоряжения. Русская конструкция с «чтобы» естественно передаёт это целевое значение.
- source_word: רַבְרְבָנוֹהִי
  choice: его вельможи
  rationale: Слово обозначает высокопоставленных сановников или знатных людей; «вельможи» соответствует царскому придворному контексту.
- source_word: שֵׁגְלָתֵהּ
  choice: жёны
  rationale: Слово относится к царским женщинам или супругам; «жёны» не предполагает, что каждая из них имела официальный титул царицы.
- source_word: לְחֵנָתֵהּ
  choice: наложницы
  rationale: Термин обозначает женщин царского дома, имевших более низкий статус, чем жёны; «наложницы» — точный и традиционно понятный эквивалент.
theological_decisions:
- issue: Обозначение родства Навуходоносора с Валтасаром
  choice: Сохранить в основном тексте буквальное «его отец»
  alternative: «его предок» или «его предшественник»
  rationale: Арамейский текст употребляет обычное слово «отец», однако в царской и родословной речи оно может иметь более широкое значение. Перевод не разрешает историческую неоднозначность в основном тексте, а поясняет её в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис сделан ясным для широкого читателя; сохранены храмовая лексика и неоднозначность арамейских выражений. Маркеры сносок поставлены непосредственно при соответствующих словам и оборотах.
