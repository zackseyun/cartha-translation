  text: קָרֵ֤א מַלְכָּ/א֙ בְּ/חַ֔יִל לְ/הֶֽעָלָה֙ לְ/אָ֣שְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/חַכִּימֵ֣י בָבֶ֗ל דִּ֣י כָל אֱ֠נָשׁ דִּֽי יִקְרֵ֞ה כְּתָבָ֣/ה דְנָ֗ה וּ/פִשְׁרֵ/הּ֙ יְחַוִּנַּ֔/נִי אַרְגְּוָנָ֣/א יִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארֵ֔/הּ וְ/תַלְתִּ֥י בְ/מַלְכוּתָ֖/א יִשְׁלַֽט׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/007.yaml
  text: The king called out loudly to bring in the enchanters[a], the Chaldeans, and the diviners. The king answered and said to the wise men of Babylon, “Any man who reads this writing and makes its interpretation known to me shall be clothed with purple, have a chain of gold around his neck[c][b], and rule as third in the kingdom.”
translation:
  language: ru
  text: 'Царь громко велел привести заклинателей, халдеев[a] и прорицателей. Обратившись к вавилонским мудрецам, царь сказал: «Всякий, кто прочтёт эту надпись и объявит мне её истолкование, будет облачён в пурпур, будет носить золотую цепь на шее и станет третьим правителем в царстве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «астрологов». Слово «халдеи» здесь может обозначать не только народ, но и особую группу вавилонских придворных мудрецов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет третьим по власти в царстве». Арамейское выражение обозначает высокий ранг и, вероятнее всего, третье место по власти.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵא ... בְּחַיִל
  choice: громко велел
  rationale: Сочетание выражает громкий, настойчивый царский призыв; в контексте последующий инфинитив передаёт распоряжение привести придворных специалистов.
- source_word: לְהֶעָלָה
  choice: привести
  rationale: Каузативный инфинитив в придворном контексте означает вызвать людей и привести их к царю.
- source_word: אָשְׁפַיָּא
  choice: заклинатели
  rationale: Термин обозначает особую категорию специалистов по оккультным практикам; перевод сохраняет отличие от общего обозначения мудрецов.
- source_word: כשדיא
  choice: халдеи
  rationale: Сохраняется традиционное наименование, которое здесь может обозначать как халдеев, так и профессиональную группу вавилонских придворных мудрецов; неоднозначность отмечена в сноске.
- source_word: גָזְרַיָּא
  choice: прорицатели
  rationale: Слово обозначает толкователей знамений и предсказателей; «прорицатели» естественно и ясно передаёт эту функцию.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Обратившись ... царь сказал
  rationale: Устойчивая арамейская формула буквально содержит «ответил и сказал», но здесь не отвечает на прямую реплику; естественная русская формулировка сохраняет переход к царскому обращению.
- source_word: לְחַכִּימֵי בָבֶל
  choice: к вавилонским мудрецам
  rationale: Передаёт придворную категорию мудрецов и географическую принадлежность без излишней архаизации.
- source_word: כָל אֱנָשׁ
  choice: всякий, кто
  rationale: Грамматически мужское единственное выражение имеет обобщающее значение; русский оборот естественно передаёт смысл «любой человек».
- source_word: כְּתָבָה דְנָה
  choice: эту надпись
  rationale: В данном контексте речь идёт о написанном на стене сообщении; «надпись» точнее контекстуально, чем общее «письмена» или «написание».
- source_word: וּפִשְׁרֵהּ יְחַוִּנַּנִי
  choice: объявит мне её истолкование
  rationale: Существительное означает истолкование, а глагол — сообщить или сделать известным; перевод сохраняет оба компонента.
- source_word: אַרְגְּוָנָא יִלְבַּשׁ
  choice: будет облачён в пурпур
  rationale: Пурпурная одежда является знаком высокого достоинства; формулировка передаёт торжественный характер царской награды.
- source_word: והמונכא די דהבא על צוארהּ
  choice: получит золотую цепь на шею
  rationale: Речь об почётном золотом нашейном украшении; русский оборот ясно передаёт вручение награды.
- source_word: וְתַלְתִּי בְמַלְכוּתָא יִשְׁלַט
  choice: станет третьим правителем в царстве
  rationale: Форма תַלְתִּי допускает понимание как третьего по рангу или одного из трёх правителей; основной текст выбирает вероятное ранговое значение, а альтернатива сохранена в сноске.
theological_decisions:
- issue: Значение положения תַלְתִּי в царстве
  choice: третий правитель в царстве
  alternative: один из трёх правителей царства
  rationale: Арамейская форма допускает обе трактовки. Контекст награждения высоким рангом поддерживает значение «третий по власти», однако грамматическая неоднозначность требует сохранить альтернативу в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным регистром. Избегаются ненужные архаизмы, но сохраняются придворная обстановка, различия между категориями мудрецов и неоднозначность обещанного ранга.
