base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/001.yaml
  text: King Belshazzar made a great feast for a thousand of his nobles[a], and in the presence of the thousand he was drinking wine.
translation:
  language: ru
  text: Царь Валтасар устроил большой пир для тысячи своих вельмож и в присутствии этой тысячи пил вино.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и перед этой тысячей пил вино». Арамейское выражение буквально может быть переведено словом «перед», но здесь, вероятно, означает, что царь публично пил вино в присутствии тысячи гостей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: царь
  rationale: 'Эмфатическая форма существительного употреблена как титул при имени; по-русски естественно: «царь Валтасар».'
- source_word: עֲבַד
  choice: устроил
  rationale: Буквально глагол означает «сделал», но применительно к пиру современное русское «устроил» точно и естественно передаёт действие.
- source_word: לְחֶם רַב
  choice: большой пир
  rationale: לְחֶם буквально обозначает хлеб или пищу, но в данном контексте речь идёт о пире; רַב передано словом «большой».
- source_word: לְרַבְרְבָנֹוהִי
  choice: для тысячи своих вельмож
  rationale: Слово обозначает высокопоставленных сановников или знатных лиц; «вельможи» сохраняет придворный оттенок и понятно современному читателю.
- source_word: אֲלַף
  choice: тысячи
  rationale: Прямое соответствие количественному числительному.
- source_word: וְלָקֳבֵל
  choice: и в присутствии
  rationale: Выражение может буквально означать «перед», но здесь, вероятнее всего, указывает на публичное питьё вина в присутствии собравшихся гостей.
- source_word: חַמְרָא
  choice: вино
  rationale: Обычное арамейское обозначение вина.
- source_word: שָׁתֵה
  choice: пил
  rationale: Причастная форма выражает продолжающееся действие; в русском повествовании несовершенный вид «пил» естественно сохраняет эту длительность.
