base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/029.yaml
  text: Then Belshazzar gave the command[a], and they clothed Daniel with purple, put a chain of gold around his neck[b], and proclaimed concerning him that he should be the third ruler in the kingdom.
translation:
  language: ru
  text: Тогда Валтасар приказал, и Даниила облачили в пурпур[a], возложили ему на шею золотую цепь и провозгласили, что он будет третьим правителем[b] в царстве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одели Даниила в пурпурную одежду». Арамейское слово может обозначать пурпурную ткань или одежду как знак царской почести.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «третьим по власти в царстве». Выражение указывает на ранг Даниила, но не уточняет устройство царской власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: אֲמַר
  choice: приказал
  rationale: Буквально глагол означает «сказал», но последующие действия исполнителей показывают, что слова царя имели силу распоряжения.
- source_word: בֵּלְשַׁאצַּר
  choice: Валтасар
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: וְהַלְבִּישׁוּ לְדָנִיֵּאל אַרְגְּוָנָא
  choice: Даниила облачили в пурпур
  rationale: Каузативный глагол передаёт одевание, а אַרְגְּוָנָא может обозначать пурпурную одежду либо пурпурную ткань как знак царской почести. «Облачили в пурпур» сохраняет эту широту значения и торжественный контекст.
- source_word: וְהַמּוֹנְכָא דִי דַהֲבָא
  choice: золотую цепь
  rationale: Речь идёт о шейном украшении из золота, служившем знаком высокого положения; «золотая цепь» естественно звучит по-русски.
- source_word: עַל צַוְּארֵהּ
  choice: ему на шею
  rationale: Предлог буквально означает «на»; в сочетании с глаголом «возложили» русская формулировка ясно описывает помещение украшения на шею.
- source_word: וְהַכְרִזוּ עֲלוֹהִי
  choice: и провозгласили
  rationale: Глагол обозначает публичное объявление; содержание объявления непосредственно следует далее, поэтому отдельное «о нём» в русском не требуется.
- source_word: דִּי לֶהֱוֵא
  choice: что он будет
  rationale: Конструкция вводит содержание официального провозглашения и назначение Даниила на определённое положение.
- source_word: שַׁלִּיט תַּלְתָּא
  choice: третьим правителем
  rationale: Сочетание обозначает лицо, обладающее властью, и его третий ранг; перевод не уточняет сверх текста устройство верховной власти.
- source_word: בְּמַלְכוּתָא
  choice: в царстве
  rationale: Слово обозначает царство или область царской власти; «в царстве» — прямой и естественный русский эквивалент.
theological_decisions:
- issue: Значение выражения «третий правитель»
  choice: Сохранено буквальное обозначение ранга без объяснения политического устройства царства.
  alternative: Передать как «третий по власти» или пояснить, что Даниил занимал место после двух высших правителей.
  rationale: Арамейский текст указывает третий ранг, но сам по себе не объясняет, как именно распределялась власть; конкретизация могла бы внести историческое толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией дворцового повествования. Слова «облачили» и «провозгласили» соответствуют церемониальному контексту, оставаясь понятными обычному читателю. Маркеры сносок поставлены непосредственно при выражениях, к которым относятся.
