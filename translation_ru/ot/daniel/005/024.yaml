  text: בֵּ/אדַ֨יִן֙ מִן קֳדָמ֔וֹ/הִי שְׁלִ֖יַחַ פַּסָּ֣/א דִֽי יְדָ֑/א וּ/כְתָבָ֥/א דְנָ֖ה רְשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/024.yaml
  text: Then from before him the palm of a hand was sent[b][a], and this writing was inscribed.
translation:
  language: ru
  text: Тогда от Него была послана кисть руки[a], и начертана эта надпись[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица Его» или «из Его присутствия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и эта надпись была написана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: מִן קֳדָמוֹהִי
  choice: от Него
  rationale: Буквально «от лица Его / от присутствия Его»; в современном русском «от Него» ясно обозначает источник, а прописная буква по ближайшему контексту указывает на Всевышнего, не вводя Его имени в сам текст.
- source_word: שְׁלִיחַ
  choice: была послана
  rationale: Прямо передаёт пассивную форму глагола «посылать».
- source_word: פַּסָּא דִי יְדָא
  choice: кисть руки
  rationale: פַּסָּא обозначает конечную часть руки, вероятно кисть или ладонь; «кисть руки» естественна по-русски и не сводит образ только к ладони.
- source_word: וּכְתָבָא דְנָה
  choice: эта надпись
  rationale: Существительное обозначает написанный текст; в сцене письма на стене «надпись» точнее и естественнее общего «письмо».
- source_word: רְשִׁים
  choice: начертана
  rationale: Глагол допускает значения «написать, начертать»; «начертана» соответствует надписи на поверхности и сохраняет торжественный регистр.
theological_decisions:
- issue: К кому относится местоимение во фразе מִן קֳדָמוֹהִי
  choice: «от Него» — от Всевышнего Бога, упомянутого непосредственно перед этим
  alternative: «от его лица / из его присутствия», без типографического обозначения референта
  rationale: Контекст стиха 23 указывает на Бога как источник, однако перевод не добавляет явного подлежащего «Бог». Сноска сохраняет буквальный образ исходящего из Его присутствия.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской интонацией. Инверсия «начертана эта надпись» сохраняет арамейское выдвижение результата и звучит естественно в данном регистре.
