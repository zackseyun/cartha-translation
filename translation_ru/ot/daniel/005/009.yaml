lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность.
- source_word: מַלְכָּא בֵלְשַׁאצַּר
  choice: царь Валтасар
  rationale: Титул и традиционная русская форма имени переданы в обычном для русского языка порядке.
- source_word: שַׂגִּיא מִתְבָּהַל
  choice: сильно испугался
  rationale: Интенсив שַׂגִּיא усиливает состояние тревоги или испуга, выраженное מִתְבָּהַל; формулировка передаёт сильную непосредственную реакцию без излишней архаичности.
- source_word: וְזִיוֹהִי שָׁנַיִן עֲלוֹהִי
  choice: лицо его изменилось
  rationale: זִיו обозначает сияние, вид или выражение лица; вся арамейская идиома описывает заметную перемену во внешности от страха. «Лицо его изменилось» естественно и сохраняет некоторую широту образа.
- source_word: וְרַבְרְבָנוֹהִי
  choice: вельможы его
  rationale: Слово обозначает высокопоставленных придворных или знатных сановников; «вельможы» точно соответствует дворцовому контексту.
- source_word: מִשְׁתַּבְּשִׁין
  choice: пришли в замешательство
  rationale: Причастная форма обозначает смятение, растерянность или нарушение упорядоченности; русское выражение передаёт возникшее состояние.
