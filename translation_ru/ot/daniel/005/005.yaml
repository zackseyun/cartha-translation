  text: At that moment the fingers of a human hand came out and wrote opposite the lampstand on the plaster of the wall of the king’s palace[e][d][c][b][a], and the king saw the palm of the hand that was writing.
translation:
  language: ru
  text: В тот же миг вышли пальцы человеческой руки[a] и стали писать напротив светильника[b], на штукатурке стены царского дворца[c]. Царь увидел кисть руки[d], которая писала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пальцы руки человека». Арамейское слово אֱנָשׁ может означать «человек» или, в более общем смысле, «человеческое существо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед светильником».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на известковой штукатурке» или «на побелке»; «царского зала». Арамейское слово может обозначать дворец или большой зал в нём.'
    reason: lexical_alternative
  - marker: d
    text: 'Возможно также: «ладонь» или просто «руку»; точное значение арамейского слова פַּס здесь неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָה
  choice: В тот же миг
  rationale: Арамейское временное выражение указывает на непосредственность события; этот вариант естественно передаёт внезапность.
- source_word: נפקו
  choice: появились
  rationale: Буквально глагол означает «вышли», однако применительно к внезапно возникшим пальцам современное русское «появились» звучит естественнее без уточнения не названного в тексте места, откуда они вышли.
- source_word: אֶצְבְּעָן דִּי יַד אֱנָשׁ
  choice: пальцы человеческой руки
  rationale: Передаёт конструкцию буквально и сохраняет общее значение אֱנָשׁ — «человек, человеческое существо», не вводя конкретного мужчину.
- source_word: וְכָתְבָן
  choice: и стали писать
  rationale: Женская форма множественного числа согласуется с «пальцами»; выражение передаёт начавшееся и наблюдаемое действие в повествовательной последовательности.
- source_word: לָקֳבֵל נֶבְרַשְׁתָּא
  choice: напротив светильника
  rationale: לָקֳבֵל обозначает положение напротив или перед чем-либо, а נֶבְרַשְׁתָּא — светильник или подставку для светильников.
- source_word: עַל גִּירָא
  choice: на штукатурке
  rationale: גִּירָא обозначает известковую штукатурку либо побелку; общее слово «штукатурка» понятно и не перегружает основной текст.
- source_word: דִּי כְתַל הֵיכְלָא דִּי מַלְכָּא
  choice: стены царского дворца
  rationale: הֵיכְלָא в данном придворном контексте естественно понимать как дворец, хотя возможно значение большого дворцового зала.
- source_word: וּמַלְכָּא חָזֵה
  choice: Царь видел
  rationale: Передаёт наблюдаемое царём действие без добавления причинных или богословских пояснений.
- source_word: פַּס יְדָה
  choice: кисть руки
  rationale: Значение פַּס в этом сочетании спорно; русское «кисть руки» сохраняет обозначение видимой части руки и избегает необоснованного выбора между ладонью и тыльной стороной.
- source_word: דִּי כָתְבָה
  choice: которая писала
  rationale: Относительное придаточное передаёт руку в процессе письма; форма единственного числа согласуется с יְדָה.
