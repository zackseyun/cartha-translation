base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/013.yaml
  text: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
translation:
  language: ru
  text: 'Тогда Даниила привели к царю. Царь обратился к Даниилу и сказал: «Ты тот самый Даниил, один из изгнанников Иудеи, которого царь, мой отец[a], увёл из Иудеи?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой предшественник». В царской речи слово «отец» могло обозначать предка или прежнего царя, а не только непосредственного биологического отца.'
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: הֻעַל
  choice: привели
  rationale: Каузативно-пассивная форма указывает, что Даниила ввели другие; в придворном контексте по-русски естественно «привели к царю».
- source_word: קֳדָם מַלְכָּא
  choice: к царю
  rationale: Выражение буквально указывает на присутствие перед царём; вместе с глаголом движения русское «привели к царю» звучит естественнее, не теряя смысла.
- source_word: עָנֵה ... וְאָמַר
  choice: обратился ... и сказал
  rationale: Сохранены оба элемента семитской формулы, но «ответил и сказал» без предшествующей реплики было бы неестественно в современном русском.
- source_word: אַנְתָּה הוּא דָנִיֵּאל
  choice: Так ты и есть тот Даниил
  rationale: Передаёт вопросительную идентификацию и оттенок узнавания или некоторой дистанции, заключённый в сочетании местоимения со связкой.
- source_word: דִּי מִן בְּנֵי גָלוּתָא
  choice: один из переселенцев
  rationale: Буквально «из сынов изгнания»; «один из переселенцев» понятно обозначает принадлежность к насильственно перемещённой иудейской общине.
- source_word: יְהוּד
  choice: Иудея
  rationale: Здесь слово имеет географический смысл — страна, откуда были уведены пленники. Современная русская форма «Иудея» яснее, чем двусмысленное «Иуда».
- source_word: דִּי הַיְתִי מַלְכָּא אַבִי מִן יְהוּד
  choice: которых царь, мой отец, увёл из Иудеи
  rationale: Глагол передаёт выведение или депортацию из страны. Множественное «которых» естественно соотносит придаточное с группой переселенцев, к которой принадлежит Даниил, а буквальное «мой отец» сохранено.
theological_decisions:
- issue: Значение אַבִי («мой отец») в царской речи
  choice: мой отец
  alternative: мой предшественник
  rationale: Основной текст сохраняет прямое обозначение источника и не снимает историческую напряжённость толкованием. В древневосточной царской речи «отец» мог означать предка или прежнего царя, что поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством придворного повествования. Семитская формула речи передана естественно, без ненужной архаизации; историческая неоднозначность слова «отец» сохранена и пояснена сноской.
