  text: 'Peres: your kingdom has been divided and given to the Medes and Persians[a].'
translation:
  language: ru
  text: 'Перес: твоё царство разделено и отдано мидянам и персам[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Арамейское слово надписи «Перес» созвучно глаголу «разделено», а также названию Персии и персов; так в толковании сохраняется игра слов.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרֵס
  choice: Перес
  rationale: Транслитерация сохраняет форму истолковываемого слова надписи и позволяет передать его звуковую связь как с последующим глаголом «разделено», так и с названием персов.
- source_word: פְּרִיסַת
  choice: разделено
  rationale: Глагол того же корня, что и פְּרֵס, обозначает разделение; краткая результативная форма естественно передаёт совершившийся и решительно объявленный суд.
- source_word: מַלְכוּתָךְ
  choice: твоё царство
  rationale: «Царство» естественно обозначает владение, находившееся под властью Валтасара, а не только его царский статус.
- source_word: וִיהִיבַת
  choice: и отдано
  rationale: 'Передаёт пассивно-результативный смысл: царство передано другим правителям.'
- source_word: לְמָדַי
  choice: мидянам
  rationale: Название передано как обозначение народа и согласовано с параллельным «персам».
- source_word: וּפָרָס
  choice: и персам
  rationale: Передаёт исторический референт как название народа, одновременно сохраняя в русском тексте заметное созвучие «Перес — персам».
