  text: In that very night Belshazzar[a], the Chaldean king, was killed.
translation:
  language: ru
  text: В ту же ночь Валтасар, царь халдеев, был убит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּהּ בְּלֵילְיָא
  choice: В ту же ночь
  rationale: Сочетание предлога с местоименным суффиксом и последующего обозначения времени идиоматически указывает на ту самую ночь. Русское «в ту же ночь» естественно передаёт временную отсылку и её усиление.
- source_word: קְטִיל
  choice: был убит
  rationale: Форма выражает пассивное/resultative значение. «Был убит» ясно и по-современному передаёт пассив, не уточняя исполнителя или обстоятельства смерти.
- source_word: בֵּלְאשַׁצַּר
  choice: Валтасар
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, узнаваемая современным читателем.
- source_word: מַלְכָּא כשדיא
  choice: царь халдеев
  rationale: 'Более прямо сохраняет арамейскую связь титула с этнонимом: царь халдеев. Это естественно по-русски и не заменяет лексически конкретное «халдеи» более широким «вавилоняне».'
