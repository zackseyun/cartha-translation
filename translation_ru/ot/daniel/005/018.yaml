base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/018.yaml
  text: As for you[a], O king, the Most High God gave kingship and greatness and glory and majesty to Nebuchadnezzar your father.
translation:
  language: ru
  text: Что касается тебя, царь, то Всевышний Бог даровал Навуходоносору, твоему отцу[a], царскую власть, величие, славу и великолепие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоему предку» или «твоему предшественнику». Арамейское слово буквально означает «твоему отцу», но в языке царских родословий могло употребляться шире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אנתה
  choice: Что касается тебя
  rationale: Вынесенное вперёд самостоятельное местоимение подчёркивает обращение; эта русская конструкция естественно передаёт тематическое выделение.
- source_word: מַלְכָּא
  choice: царь
  rationale: Слово употреблено как прямое почтительное обращение; в современном русском звательная функция передаётся формой «царь» без архаизирующего «о».
- source_word: אֱלָהָא עִלָּיָא
  choice: Всевышний Бог
  rationale: Устойчиво и ясно передаёт арамейский титул Бога, сохраняя его возвышенный характер.
- source_word: מַלְכוּתָא
  choice: царскую власть
  rationale: Здесь речь о дарованном Навуходоносору царском положении и правлении, а не прежде всего о территории государства.
- source_word: רְבוּתָא
  choice: величие
  rationale: Передаёт значение высокого положения и величия в ряду царских даров.
- source_word: וִיקָרָא
  choice: славу
  rationale: В царском контексте слово обозначает славу и почёт; «слава» сохраняет возвышенный регистр.
- source_word: וְהַדְרָה
  choice: великолепие
  rationale: Передаёт царственную пышность и отличает этот дар от предшествующей «славы».
- source_word: יְהַב
  choice: даровал
  rationale: Глагол означает «дал»; «даровал» естественно сочетается с перечнем царских благ и сохраняет достоинство речи.
- source_word: לִנְבֻכַדְנֶצַּר
  choice: Навуходоносору
  rationale: Имя передано в принятой русской библейской форме.
- source_word: אֲבוּךְ
  choice: твоему отцу
  rationale: Основное значение родственного термина сохранено буквально; возможное более широкое династическое употребление пояснено в сноске.
theological_decisions:
- issue: Значение выражения «твой отец» в царской и династической речи
  choice: Сохранить в основном тексте буквальное «твоему отцу».
  alternative: «твоему предку» или «твоему предшественнику»
  rationale: Источник употребляет обычное слово «отец», которое в древней царской речи могло обозначать не только непосредственного родителя, но также предка или династического предшественника. Перевод не разрешает эту историческую неоднозначность молча.
translation_notes:
  register: Современный литературный русский с достоинством придворной речи. Тематическое выделение начального местоимения передано конструкцией «Что касается тебя», а накопительный ряд царских даров сохранён без конфессионального истолкования.
