  text: וּ/מִן בְּנֵי֩ אֲנָשָׁ֨/א טְרִ֜יד וְ/לִבְבֵ֣/הּ עִם חֵיוְתָ֣/א שוי וְ/עִם עֲרָֽדַיָּ/א֙ מְדוֹרֵ֔/הּ עִשְׂבָּ֤/א כְ/תוֹרִין֙ יְטַ֣עֲמוּנֵּ֔/הּ וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּֽי יְדַ֗ע דִּֽי שַׁלִּ֞יט אֱלָהָ֤/א עלי/א בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖ה יְהָקֵ֥ים עלי/ה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/021.yaml
  text: He was driven away from the sons of men[a], and his heart was made like the beasts, and his dwelling was with the wild donkeys. He was fed grass like oxen, and his body was drenched with the dew of heaven[d][c][b], until he knew that the Most High God rules over the kingdom of mankind and sets over it whomever he wills.
translation:
  language: ru
  text: Он был изгнан из среды людей[a], сердце его стало как у зверей[b], и жил он с дикими ослами[c]. Его кормили травой, как волов, и тело его пропитывалось небесной росой, пока он не познал, что Всевышний Бог властвует над царством человеческим[d] и ставит над ним того, кого пожелает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от сынов человеческих».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разум его стал как у зверей»; арамейское слово «сердце» может обозначать внутренний склад и разум.'
    reason: lexical_alternative
  - marker: c
    text: То есть с онаграми — дикими ослами.
    reason: cultural_note
  - marker: d
    text: 'Или: «над царством людей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְרִיד
  choice: был изгнан
  rationale: Передаёт пассивно-результативный смысл и насильственное удаление Навуходоносора из человеческого общества.
- source_word: בְּנֵי אֲנָשָׁא
  choice: из среды людей
  rationale: Естественно передаёт арамейскую идиому «от сынов человеческих» и сохраняет противопоставление людям и зверям без ненужного гендерного сужения.
- source_word: לִבְבֵהּ עִם חֵיוְתָא שוי
  choice: сердце его стало подобно сердцу зверей
  rationale: Сохраняет образ «сердца» как внутреннего склада и восполняет подразумеваемое основание сравнения, чтобы по-русски не возникало смысла, будто сердце уподобилось самим зверям физически.
- source_word: עֲרָדַיָּא
  choice: дикие ослы
  rationale: Точно обозначает онагров и звучит понятно в современном русском языке.
- source_word: מְדוֹרֵהּ
  choice: жил он
  rationale: Динамически и естественно передаёт буквальное «его жилище было», не меняя смысла совместного обитания.
- source_word: יְטַעֲמוּנֵּהּ
  choice: его кормили
  rationale: Каузативная форма означает, что ему давали есть; неопределённо-личная конструкция сохраняет невыраженного деятеля.
- source_word: כְתוֹרִין
  choice: как волов
  rationale: Конкретно сохраняет сравнение с волами, а не расширяет его до скота вообще.
- source_word: יִצְטַבַּע
  choice: орошалось
  rationale: В сочетании с небесной росой это естественное и достойное русское выражение, передающее продолжительное смачивание тела.
- source_word: אֱלָהָא עליא
  choice: Всевышний Бог
  rationale: Обычное русское соответствие арамейскому божественному титулу.
- source_word: מַלְכוּת אֲנָשָׁא
  choice: царство человеческое
  rationale: Сохраняет буквальную конструкцию и обозначает сферу человеческого царствования, не ограничивая её мужчинами.
- source_word: יְהָקֵים
  choice: ставит
  rationale: Передаёт активное установление правителя Богом без добавления специальной богословской терминологии.
theological_decisions:
- issue: Утверждение о Божьей власти над человеческим царством
  choice: Всевышний Бог властвует над царством человеческим и ставит над ним того, кого пожелает
  alternative: Всевышний Бог господствует над царством людей и назначает над ним, кого хочет
  rationale: Формулировка прямо сохраняет Божье действующее владычество и свободу поставить правителя, не усиливая текст систематической терминологией.
- issue: Значение «сердца» Навуходоносора
  choice: сердце его стало подобно сердцу зверей
  alternative: разум его стал подобен разуму зверей
  rationale: «Сердце» непосредственно соответствует источнику и допускает широкий смысл внутреннего склада, разума и расположения, не сводя его только к интеллекту.
- issue: Обобщающее значение אֲנָשָׁא
  choice: людей / человеческое
  alternative: сынов человеческих / царством людей
  rationale: Источник говорит о человечестве в целом; выбранные формы естественны по-русски и не создают впечатления, что речь идёт лишь о мужчинах.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и общедоступным; сохранены образ «сердца», конкретные дикие ослы и волы, а также прямое утверждение о власти Всевышнего.
