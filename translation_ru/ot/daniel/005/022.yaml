  text: ו/אנתה בְּרֵ/הּ֙ בֵּלְשַׁאצַּ֔ר לָ֥א הַשְׁפֵּ֖לְתְּ לִבְבָ֑/ךְ כָּ/ל קֳבֵ֕ל דִּ֥י כָל דְּנָ֖ה יְדַֽעְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/022.yaml
  text: But you[a], his son, Belshazzar, have not humbled your heart, though you knew all this.
translation:
  language: ru
  text: Но ты, Валтасар, его сын[a], не смирил своего сердца, хотя знал всё это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Арамейское «сын» может также означать «потомок» или «преемник».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנְתָּה
  choice: Но ты
  rationale: Союз с самостоятельным местоимением выражает резкое противопоставление Валтасара ранее упомянутому Навуходоносору; «но ты» естественно передаёт эту силу.
- source_word: בְּרֵהּ
  choice: сын его
  rationale: Буквально «его сын»; в библейском арамейском слово может также обозначать потомка или преемника. Основной текст сохраняет исходное династическое выражение, а диапазон значений отмечен в сноске.
- source_word: בֵּלְשַׁאצַּר
  choice: Валтасар
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: הַשְׁפֵּלְתְּ לִבְבָךְ
  choice: не смирил своего сердца
  rationale: 'Сохраняется образное выражение оригинала: глагол означает «смирить, унизить», а «сердце» обозначает внутреннего человека, включая волю и разум.'
- source_word: כָּל־קֳבֵל דִּי
  choice: хотя
  rationale: 'В данном контексте оборот имеет уступительное значение: Валтасар не смирился, несмотря на известные ему события.'
- source_word: כָל־דְּנָה יְדַעְתָּ
  choice: знал всё это
  rationale: Кратко и естественно передаёт указание на все ранее рассказанные события, связанные с Навуходоносором.
theological_decisions:
- issue: Значение выражения «сын его» применительно к Навуходоносору и Валтасару
  choice: Сохранить в основном тексте выражение «сын его», не определяя его как указание исключительно на прямое биологическое родство.
  alternative: «его потомок» или «его преемник»
  rationale: Арамейское слово допускает более широкое династическое или преемственное значение. Перевод сохраняет неоднозначность оригинала и не вносит в текст историческую гармонизацию.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «смирить сердце». Порядок «Валтасар, сын его» выбран ради ясной привязки местоимения и естественной русской фразы; тон прямой, торжественный и обвинительный.
