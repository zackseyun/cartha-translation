source:
  edition: WLC
  text: וּ/מִן רְבוּתָ/א֙ דִּ֣י יְהַב לֵ֔/הּ כֹּ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ/א֙ וְ/לִשָּׁ֣נַיָּ֔/א הֲו֛וֹ זאעין וְ/דָחֲלִ֖ין מִן קֳדָמ֑וֹ/הִי דִּֽי הֲוָ֨ה צָבֵ֜א הֲוָ֣א קָטֵ֗ל וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מַחֵ֔א וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מָרִ֔ים וְ/דִֽי הֲוָ֥ה צָבֵ֖א הֲוָ֥ה מַשְׁפִּֽיל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/019.yaml
  text: And because of the greatness that he gave him[a], all peoples, nations, and languages were trembling and fearing before him. Whomever he wanted, he killed; and whomever he wanted, he kept alive; and whomever he wanted, he raised up; and whomever he wanted[c][b], he humbled.
translation:
  language: ru
  text: И из-за величия, которое он даровал ему[a], все народы, племена и языки перед ним трепетали и страшились. Кого хотел, он убивал; кого хотел — оставлял в живых[b]; кого хотел — возвышал; кого хотел — унижал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Бог, упомянутый в предыдущем стихе.
    reason: cross_reference
  - marker: b
    text: 'Или: «щадил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְבוּתָא
  choice: величие
  rationale: Слово обозначает величие или высокий статус; «величие» естественно по-русски и сохраняет связь с царским могуществом, дарованным свыше.
- source_word: יְהַב לֵהּ
  choice: Он даровал ему
  rationale: Активная форма означает «дал ему». Прописная буква у местоимения помогает связать невыраженный субъект с Богом из предыдущего стиха, не вставляя имя «Бог» в сам текст.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: народы, племена и языки
  rationale: Сохранена характерная для Даниила трёхчастная формула. «Языки» передаёт языковые сообщества, а «племена» отличает второе обозначение групп людей от первого.
- source_word: זאעין וְדָחֲלִין
  choice: трепетали и страшились
  rationale: Переданы оба усиливающих друг друга причастия; сочетание звучит возвышенно, но понятно современному читателю.
- source_word: מִן קֳדָמוֹהִי
  choice: его
  rationale: В сочетании «страшились его» русский винительный падеж естественно передаёт арамейскую идиому «перед ним / от его присутствия».
- source_word: דִּי הֲוָה צָבֵא
  choice: кого хотел
  rationale: Повторяющаяся конструкция подчёркивает неограниченную личную волю царя; лаконичная русская формула сохраняет ритм оригинала.
- source_word: קָטֵל
  choice: убивал
  rationale: Прямое соответствие значению «убивать», сохраняющее суровую силу высказывания.
- source_word: מַחֵא
  choice: оставлял в живых
  rationale: В противопоставлении «убивал» глагол означает сохранение жизни; эта формулировка точна и естественна по-русски.
- source_word: מָרִים
  choice: возвышал
  rationale: Передаёт образ поднятия как повышения положения или статуса и образует ясную антитезу с «унижал».
- source_word: מַשְׁפִּיל
  choice: унижал
  rationale: Глагол означает делать низким, умалять статус. «Унижал» сохраняет метафорическую противоположность возвышению без излишнего пояснения.
theological_decisions:
- issue: Кто даровал Навуходоносору величие
  choice: 'Сохранить местоименный субъект: «Он даровал ему», обозначив Бога прописной буквой и пояснив отсылку в сноске.'
  alternative: 'Вставить в основной текст: «Бог даровал ему».'
  rationale: В арамейской клаузе субъект не назван явно, но из предыдущего стиха им является Всевышний Бог. Решение сохраняет местоименную форму источника и одновременно делает межстиховую связь доступной русскому читателю.
- issue: Смысл מַחֵא в противопоставлении убийству
  choice: «оставлял в живых»
  alternative: «щадил»
  rationale: «Оставлял в живых» передаёт объективное сохранение жизни и не добавляет оттенка милосердия, который может подразумеваться словом «щадил».
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Повтор «кого хотел» сохранён ради риторической силы оригинала; во второй половине использованы тире и союз «а» для ясного ритма и антитезы.
