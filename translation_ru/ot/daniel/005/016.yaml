source:
  edition: WLC
  text: וַ/אֲנָה֙ שִׁמְעֵ֣ת עלי/ך דִּֽי תוכל פִּשְׁרִ֛ין לְ/מִפְשַׁ֖ר וְ/קִטְרִ֣ין לְ/מִשְׁרֵ֑א כְּעַ֡ן הֵן֩ תוכל כְּתָבָ֜/א לְ/מִקְרֵ֗א וּ/פִשְׁרֵ/הּ֙ לְ/הוֹדָ֣עֻתַ֔/נִי אַרְגְּוָנָ֣/א תִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארָ֔/ךְ וְ/תַלְתָּ֥א בְ/מַלְכוּתָ֖/א תִּשְׁלַֽט־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/016.yaml
  text: But I have heard about you that you are able to give interpretations and to solve difficulties[a]. Now, if you are able to read the writing and make its interpretation known to me, you shall be clothed with purple, and a chain of gold shall be put around your neck[b], and you shall rule as third in the kingdom.
translation:
  language: ru
  text: Но я слышал о тебе, что ты умеешь истолковывать и распутывать узлы[a]. Итак, если ты сможешь прочитать эту надпись и объяснить мне её значение, то будешь облачён в пурпур, на шею тебе возложат золотую цепь, и ты станешь третьим правителем в царстве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-арамейски: «развязывать узлы» — образное выражение, означающее разрешать трудные или запутанные вопросы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будешь занимать третье место в царстве». Вероятно, речь идёт о третьем по значимости положении в государстве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנָה
  choice: Но я
  rationale: Союз с самостоятельным местоимением обозначает личный контраст и переход в речи Валтасара; «Но я» естественно передаёт этот оттенок.
- source_word: פִּשְׁרִין לְמִפְשַׁר
  choice: истолковывать
  rationale: Арамейское сочетание существительного и глагола означает способность давать истолкования; по-русски это естественно передаётся одним глаголом.
- source_word: וְקִטְרִין לְמִשְׁרֵא
  choice: распутывать узлы
  rationale: Сохранён яркий арамейский образ развязывания узлов, то есть разрешения трудных и запутанных вопросов; сноска поясняет идиому.
- source_word: כְּתָבָא
  choice: эту надпись
  rationale: В контексте речь идёт о конкретных словах, появившихся на стене; «надпись» точно и естественно обозначает данный письменный текст.
- source_word: וּפִשְׁרֵהּ לְהוֹדָעוּתַנִי
  choice: объяснить мне её значение
  rationale: Передаёт каузативное «сделать известным мне её истолкование» ясным современным русским языком.
- source_word: אַרְגְּוָנָא תִלְבַּשׁ
  choice: будешь облачён в пурпур
  rationale: Формулировка сохраняет торжественный придворный регистр и смысл пожалования почётного царского одеяния.
- source_word: וְתַלְתָּא בְמַלְכוּתָא תִּשְׁלַט
  choice: станешь третьим правителем в царстве
  rationale: Передаёт наиболее вероятное значение третьего места по рангу, не превращая его в неопределённое «править как третий»; альтернативная возможность отмечена в сноске.
theological_decisions:
- issue: Значение положения תַלְתָּא в царстве
  choice: третий правитель в царстве
  alternative: занимать третье место в царстве / править как третий
  rationale: Арамейская конструкция допускает описание как третьего правителя, так и третьего ранга. Основной текст использует естественную русскую формулировку, а сноска сохраняет нюанс альтернативного понимания.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Образ «распутывать узлы» сохранён ради выразительности оригинала и пояснён в сноске; наградная формула передана торжественно, но понятно.
