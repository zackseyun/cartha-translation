  text: Then all the king’s wise men came in[b][a], but they were not able to read the writing or make its interpretation known to the king.
translation:
  language: ru
  text: Тогда вошли все царские мудрецы, но они не смогли ни прочитать написанное[a], ни сообщить царю его толкование[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прочитать письмена». Арамейское слово может обозначать сам письменный текст или послание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «объяснить царю его смысл». Арамейское слово, переведённое как «толкование», неоднократно употребляется в книге Даниила при объяснении таинственного сообщения или сна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: עללין
  choice: вошли
  rationale: Форма множественного числа обозначает вхождение, здесь — появление мудрецов перед царём; «вошли» точно и естественно для придворной сцены.
- source_word: כֹּל חַכִּימֵי מַלְכָּא
  choice: все царские мудрецы
  rationale: Сочетание обозначает всю группу мудрецов, состоявших при царе; русское прилагательное естественно передаёт принадлежность царскому двору.
- source_word: וְלָא כָהֲלִין
  choice: но они не смогли
  rationale: Отрицательная конструкция выражает неспособность исполнить требуемое, а союз в контексте имеет противительное значение.
- source_word: כְּתָבָא לְמִקְרֵא
  choice: прочитать написанное
  rationale: כְּתָבָא может обозначать письменный текст или послание; «написанное» сохраняет широту значения и не уточняет без необходимости вид текста.
- source_word: וּפִשְׁרָא
  choice: его толкование
  rationale: פְּשַׁר — повторяющийся в книге Даниила термин для объяснения загадочного сна или сообщения; «толкование» сохраняет эту терминологическую связь.
- source_word: לְהוֹדָעָה לְמַלְכָּא
  choice: сообщить царю
  rationale: Каузативный инфинитив от ידע означает «дать знать, сообщить»; этот вариант ясно и естественно передаёт действие по отношению к царю.
