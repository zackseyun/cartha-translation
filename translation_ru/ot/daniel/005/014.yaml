base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/014.yaml
  text: And I have heard about you that the spirit of the gods is in you[b][a], and that light and insight and extraordinary wisdom are found in you.
translation:
  language: ru
  text: Я слышал о тебе, что в тебе есть дух богов[a] и что в тебе нашли свет[b], разумение и необычайную мудрость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «дух Бога» или «Дух Бога». Буквально по-арамейски: «дух богов»; такая формулировка отражает речь царя.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «свет» или «сияние»; здесь это образ ясности ума.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁמְעֵת עֲלָיִךְ
  choice: Я слышал о тебе
  rationale: Перфект передаёт полученные царём сведения; сочетание «слышал о тебе» естественно выражает значение арамейского предлога.
- source_word: דִּי
  choice: что
  rationale: Союз вводит содержание услышанного.
- source_word: רוּחַ אֱלָהִין
  choice: дух богов
  rationale: אֱלָהִין морфологически имеет форму множественного числа, а слова языческого царя отражают вавилонскую придворную речь. Перевод сохраняет точку зрения говорящего.
- source_word: בָּךְ
  choice: в тебе пребывает / в тебе обнаружены
  rationale: Простое обозначение нахождения внутри человека передано естественными для соответствующих русских конструкций оборотами.
- source_word: נַהִירוּ
  choice: свет
  rationale: Сохраняется буквальный образ света, который в данном контексте метафорически обозначает ясность ума.
- source_word: שָׂכְלְתָנוּ
  choice: разумение
  rationale: Слово обозначает понимание и способность здраво судить; «разумение» сохраняет отличие от мудрости и соответствует возвышенному повествовательному регистру.
- source_word: חָכְמָה יַתִּירָה
  choice: необычайная мудрость
  rationale: יַתִּירָה указывает на мудрость, превосходящую обычную меру; «необычайная» ясно и естественно передаёт усилительное значение.
- source_word: הִשְׁתְּכַחַת
  choice: обнаружены
  rationale: Глагол означает «быть найденным, обнаружиться»; форма во множественном числе в русском согласована с перечисленными качествами.
theological_decisions:
- issue: Передавать ли אֱלָהִין как единственное число «Бог» или как множественное «боги» в речи языческого царя
  choice: дух богов
  alternative: дух Бога / Дух Бога
  rationale: Непосредственно говорит Валтасар, а арамейская форма морфологически множественная и соответствует вавилонскому способу выражения. Такой перевод не заменяет слова царя позднейшим монотеистическим или христианским истолкованием; возможное понимание в единственном числе отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством придворно-повествовательной сцены. Синтаксический повтор «что в тебе» сохраняет структуру сообщения и делает длинное перечисление ясным; метафора света оставлена без истолковывающей замены.
