source:
  edition: WLC
  text: כָּ/ל קֳבֵ֡ל דִּ֣י ר֣וּחַ יַתִּירָ֡ה וּ/מַנְדַּ֡ע וְ/שָׂכְלְתָנ֡וּ מְפַשַּׁ֣ר חֶלְמִין֩ וַֽ/אַֽחֲוָיַ֨ת אֲחִידָ֜ן וּ/מְשָׁרֵ֣א קִטְרִ֗ין הִשְׁתְּכַ֤חַת בֵּ/הּ֙ בְּ/דָ֣נִיֵּ֔אל דִּֽי מַלְכָּ֥/א שָׂם שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר כְּעַ֛ן דָּנִיֵּ֥אל יִתְקְרֵ֖י וּ/פִשְׁרָ֥/ה יְהַֽחֲוֵֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/012.yaml
  text: because an extraordinary spirit[a], knowledge, and understanding to interpret dreams, explain riddles, and solve difficulties were found in him, in Daniel, whom the king named Belteshazzar. Now let Daniel be called[c][b], and he will show the interpretation.
translation:
  language: ru
  text: 'потому что в Данииле, которого царь назвал Валтасаром, обнаружились необыкновенный дух[a], знание и разумение: он умеет истолковывать сны, разъяснять загадки и разрешать затруднения[b]. Пусть же теперь позовут Даниила, и он сообщит истолкование[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превосходный дух».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «развязывать узлы» — образное выражение, означающее разрешать сложные задачи.'
    reason: cultural_note
  - marker: c
    text: 'Или: «объявит истолкование».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: потому что
  rationale: Передаёт причинное значение арамейского оборота и естественно связывает стих с рекомендацией царицы.
- source_word: רוּחַ יַתִּירָה
  choice: необыкновенный дух
  rationale: Сохраняет значение исключительности, не уточняя сверх текста, идёт ли речь о человеческом духе или о божественном даровании.
- source_word: מַנְדַּע וְשָׂכְלְתָנוּ
  choice: знание и разумение
  rationale: Передаёт два близких, но различимых качества и сохраняет их накопительное перечисление.
- source_word: מְפַשַּׁר חֶלְמִין
  choice: способность истолковывать сны
  rationale: Причастная конструкция описывает присущую Даниилу способность; русская номинальная формулировка согласуется с перечнем найденных в нём качеств.
- source_word: אַחֲוָיַת אֲחִידָן
  choice: разъяснять загадки
  rationale: Естественно передаёт раскрытие смысла трудных или загадочных высказываний в придворном контексте.
- source_word: מְשָׁרֵא קִטְרִין
  choice: разрешать трудности
  rationale: Передаёт смысл метафоры «развязывать узлы» понятным современным русским выражением; буквальный образ сохранён в сноске.
- source_word: הִשְׁתְּכַחַת בֵּהּ
  choice: обнаружились ... в Данииле
  rationale: Сохраняет безлично-пассивный оттенок исходного выражения и охватывает весь перечень качеств и способностей.
- source_word: דִּי מַלְכָּא שָׂם שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: которого царь назвал Валтасаром
  rationale: Идиоматически передаёт арамейское «положил ему имя» и использует закрепившуюся русскую библейскую форму имени.
- source_word: כְּעַן דָּנִיֵּאל יִתְקְרֵי
  choice: Пусть же теперь позовут Даниила
  rationale: Передаёт переходный маркер и пассивно-юссивное значение естественным русским побуждением.
- source_word: פִשְׁרָה יְהַחֲוֵה
  choice: он сообщит истолкование
  rationale: Точно передаёт значение «сделает известным истолкование» и звучит естественнее буквального «покажет истолкование».
theological_decisions:
- issue: Значение слова «дух» в описании мудрости Даниила
  choice: необыкновенный дух без уточнения его источника
  alternative: явное указание на Духа Божьего либо только на человеческий характер и способности
  rationale: В данном предложении текст прямо не отождествляет этот дух с Духом Божьим. Перевод сохраняет формулировку и её богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён ради ясности, но причинная связь, накопительный перечень качеств, пассивное побуждение и метафорическая основа выражения о трудностях сохранены.
