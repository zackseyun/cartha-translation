  to: 'потому что в Данииле, которого царь назвал Валтасаром, обнаружились необыкновенный дух[a], знание и разумение: он умеет истолковывать сны, разъяснять загадки и разрешать затруднения[b]. Пусть же теперь позовут Даниила, и он сообщит истолкование[c].'
