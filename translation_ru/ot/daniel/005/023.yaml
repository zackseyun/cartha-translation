source:
  edition: WLC
  text: וְ/עַ֣ל מָרֵֽא שְׁמַיָּ֣/א הִתְרוֹמַ֡מְתָּ וּ/לְ/מָֽאנַיָּ֨/א דִֽי בַיְתֵ֜/הּ הַיְתִ֣יו קדמי/ך ו/אנתה ו/רברבני/ך שֵֽׁגְלָתָ֣/ךְ וּ/לְחֵנָתָ/ךְ֮ חַמְרָ/א֮ שָׁתַ֣יִן בְּ/הוֹן֒ וְ/לֵֽ/אלָהֵ֣י כַסְפָּֽ/א וְ֠/דַהֲבָ/א נְחָשָׁ֨/א פַרְזְלָ֜/א אָעָ֣/א וְ/אַבְנָ֗/א דִּ֠י לָֽא חָזַ֧יִן וְ/לָא שָׁמְעִ֛ין וְ/לָ֥א יָדְעִ֖ין שַׁבַּ֑חְתָּ וְ/לֵֽ/אלָהָ֞/א דִּֽי נִשְׁמְתָ֥/ךְ בִּ/ידֵ֛/הּ וְ/כָל אֹרְחָתָ֥/ךְ לֵ֖/הּ לָ֥א הַדַּֽרְתָּ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/023.yaml
  text: But you have exalted yourself against the Lord of heaven[a], and the vessels of his house were brought before you, and you and your nobles, your wives, and your concubines have been drinking wine from them. And you have praised the gods of silver and gold, bronze, iron, wood, and stone, which do not see or hear or know; but the God in whose hand is your breath, and to whom belong all your ways[c][b], you have not honored.
translation:
  language: ru
  text: Но ты вознёсся против Владыки небес[a]. Сосуды из Его дома принесли к тебе, и ты, твои вельможи, жёны и наложницы пили из них вино. Ты восхвалял богов из серебра и золота, меди, железа, дерева и камня, которые не видят, не слышат и не знают. А Бога, в руке которого — твоё дыхание[b] и которому принадлежат все твои пути, ты не почтил[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господина небес». Арамейское слово может означать как владыку, так и господина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бога, который держит твоё дыхание в Своей руке».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не прославил»; буквальный смысл также можно передать: «не воздал славы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרֵא שְׁמַיָּא
  choice: Владыка небес
  rationale: מָרֵא означает господина или владыку. «Владыка» естественно звучит как возвышенный титул Бога и передаёт идею верховной власти; שְׁמַיָּא здесь передано традиционным собирательным «небес».
- source_word: הִתְרוֹמַמְתָּ
  choice: ты вознёсся против
  rationale: Возвратная форма обозначает самовозвышение, а сочетание с עַל выражает направленность против Владыки небес.
- source_word: מָאנַיָּא דִּי בַיְתֵהּ
  choice: сосуды из Его дома
  rationale: «Сосуды» точно подходит для храмовой утвари, а «дом» сохраняет конкретный образ исходного текста вместо поясняющего «храм».
- source_word: רַבְרְבָנַיִךְ
  choice: твои вельможи
  rationale: Слово обозначает высокопоставленных людей при царском дворе; «вельможи» кратко и уместно передаёт этот статус.
- source_word: שֵׁגְלָתָךְ וּלְחֵנָתָךְ
  choice: жёны и наложницы
  rationale: Передано различие между царскими жёнами и женщинами более низкого брачного статуса без лишнего истолкования.
- source_word: חַמְרָא שָׁתַיִן בְּהוֹן
  choice: пили из них вино
  rationale: Русский несовершенный вид естественно передаёт изображённое продолжающееся действие; «из них» выражает употребление сосудов для питья.
- source_word: שַׁבַּחְתָּ
  choice: восхвалял
  rationale: Глагол означает хвалить или превозносить; «восхвалял» сохраняет торжественный контекст идолопоклонства.
- source_word: אֱלָהֵי כַסְפָּא וְדַהֲבָא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא
  choice: богов из серебра и золота, меди, железа, дерева и камня
  rationale: Оборот с «из» естественно по-русски показывает, что перечислены материалы идолов, сохраняя полный порядок списка.
- source_word: דִּי לָא חָזַיִן וְלָא שָׁמְעִין וְלָא יָדְעִין
  choice: которые не видят, не слышат и не знают
  rationale: Сохранена трёхчастная характеристика бессилия идолов и прямое значение יָדְעִין — «знают», без замены на толковательное «понимают».
- source_word: אֱלָהָא דִּי נִשְׁמְתָךְ בִּידֵהּ
  choice: Бога, в руке которого — твоё дыхание
  rationale: Сохранены конкретные образы руки и дыхания, выражающие Божью власть над жизнью человека.
- source_word: וְכָל אֹרְחָתָךְ לֵהּ
  choice: и которому принадлежат все твои пути
  rationale: Дательная конструкция принадлежности передана прямо, а метафора «пути» сохранена без сужения до судьбы или поступков.
- source_word: לָא הַדַּרְתָּ
  choice: ты не почтил
  rationale: «Почтил» естественно передаёт оказание чести и оставляет в сноске близкую возможность «прославил».
theological_decisions:
- issue: Божественный титул מָרֵא
  choice: Владыка небес
  alternative: Господин небес
  rationale: «Владыка» передаёт верховную власть Бога и звучит как естественный божественный титул, не превращая это арамейское слово в особое конфессиональное обозначение.
- issue: Контраст между идолами и истинным Богом
  choice: сохранить образы «твоё дыхание» и «все твои пути»
  alternative: передать толковательно как «твоя жизнь» и «твоя судьба»
  rationale: Конкретные образы исходного текста подчёркивают Божью власть над жизнью и всем человеческим путём, не сводя смысл к одному абстрактному толкованию.
- issue: Значение הַדַּרְתָּ
  choice: не почтил
  alternative: не прославил
  rationale: Основной текст подчёркивает отказ воздать Богу должную честь, а близкое значение прославления сохранено в примечании, чтобы не устранять смысловой диапазон глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Синтаксис сделан ясным для устного и самостоятельного чтения; при этом сохранены исходные образы дома, сосудов, дыхания, руки и путей. Формы обращения последовательно стоят в единственном числе, а перечисления сохраняют ритм арамейского текста.
