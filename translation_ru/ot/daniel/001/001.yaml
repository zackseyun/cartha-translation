  text: בִּ/שְׁנַ֣ת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֑ה בָּ֣א נְבוּכַדְנֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל יְרוּשָׁלִַ֖ם וַ/יָּ֥צַר עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/001.yaml
  text: In the third year of the reign of Jehoiakim king of Judah[b][a], Nebuchadnezzar king of Babylon came to Jerusalem and besieged it.
translation:
  language: ru
  text: На третьем году царствования Иоакима, царя Иудеи, Навуходоносор, царь Вавилона, пришёл к Иерусалиму и осадил его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и осадил его» — буквально: «и осаждал его»; также: «и держал его в осаде».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ
  choice: На третьем году
  rationale: В формуле датировки по годам правления количественное числительное в еврейском передаётся по-русски порядковым; оборот сохраняет структуру исходного текста и звучит естественно в историческом повествовании.
- source_word: לְמַלְכוּת
  choice: царствования
  rationale: Слово обозначает период царского правления; «царствование» точно и естественно для хронологической формулы.
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Иоакима, царя Иудеи
  rationale: Имена и географические названия переданы в закрепившейся русской библейской форме; приложение оформлено по нормам современного русского языка.
- source_word: בָּא
  choice: пришёл
  rationale: Прямое значение глагола — «пришёл». Более военное «выступил» или «подступил» добавляло бы оттенок, не выраженный самим глаголом.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Навуходоносор, царь Вавилона
  rationale: Использована традиционная русская форма имени; титул и владение переданы приложением без избыточного определённого артикля, отсутствующего в русском.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалиму
  rationale: Предлог в русском управлении при глаголе движения естественно передаётся конструкцией «к Иерусалиму», не подразумевая входа в город.
- source_word: וַיָּצַר עָלֶיהָ
  choice: и осадил его
  rationale: В военном контексте сочетание צור с על означает осаду города. Краткий глагол «осадил» точно передаёт действие; местоимение согласовано с русским словом «Иерусалим».
