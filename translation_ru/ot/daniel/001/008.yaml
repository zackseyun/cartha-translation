  text: וַ/יָּ֤שֶׂם דָּנִיֵּאל֙ עַל לִבּ֔/וֹ אֲשֶׁ֧ר לֹֽא יִתְגָּאַ֛ל בְּ/פַתְבַּ֥ג הַ/מֶּ֖לֶךְ וּ/בְ/יֵ֣ין מִשְׁתָּ֑י/ו וַ/יְבַקֵּשׁ֙ מִ/שַּׂ֣ר הַ/סָּרִיסִ֔ים אֲשֶׁ֖ר לֹ֥א יִתְגָּאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/008.yaml
  text: But Daniel resolved in his heart that he would not defile himself with the king’s food or with the wine he drank[a], and he sought permission from the chief of the eunuchs that he might not defile himself.
translation:
  language: ru
  text: Но Даниил твёрдо решил в сердце своём не оскверняться царской пищей и вином, которое пил царь. Он попросил начальника евнухов[a] позволить ему не оскверняться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальника придворных чиновников». Еврейское слово может обозначать как евнухов, так и высокопоставленных служащих царского двора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... עַל לִבּוֹ
  choice: твёрдо решил в сердце своём
  rationale: Еврейская идиома буквально означает «положил на сердце» и выражает внутреннее, осознанное решение. Выбранная формулировка сохраняет образ сердца и при этом естественно звучит по-русски.
- source_word: יִתְגָּאַל
  choice: оскверняться
  rationale: Форма хитпаэль указывает на осквернение самого себя. Этот глагол сохраняет нравственно-ритуальный оттенок, не уточняя причину осквернения сверх сказанного в тексте.
- source_word: פַּתְבַּג
  choice: царская пища
  rationale: Слово обозначает выделенную царём провизию, вероятно придворную еду. «Царская пища» передаёт и саму пищу, и её связь с царём, не усиливая значение до «деликатесов».
- source_word: יֵין מִשְׁתָּיו
  choice: вино, которое пил царь
  rationale: Конструкция буквально означает «вино его питья/пира». Такая передача ясно относит вино к царю и естественна для современного русского языка.
- source_word: שַׂר הַסָּרִיסִים
  choice: начальник евнухов
  rationale: סָרִיס может обозначать как евнуха, так и придворного чиновника. В основном тексте сохранено прямое лексическое значение, а более широкое административное значение отмечено в сноске.
- source_word: וַיְבַקֵּשׁ
  choice: попросил ... позволить
  rationale: Глагол означает «просить» или «добиваться». Контекст показывает, что Даниил просил разрешения, поэтому подразумеваемое содержание просьбы выражено явно.
- source_word: אֲשֶׁר לֹא יִתְגָּאָל
  choice: позволить ему не оскверняться
  rationale: Формулировка передаёт содержание и цель просьбы Даниила, сохраняя повтор ключевого глагола из еврейского текста.
theological_decisions:
- issue: Причина отказа Даниила от царской пищи и вина
  choice: Сохранить общее понятие «оскверняться», не уточняя источник осквернения.
  alternative: Указать нарушение пищевых предписаний Моисеева закона, ритуальную нечистоту либо связь пищи с языческим культом.
  rationale: Стих не объясняет, почему царская пища и вино могли осквернить Даниила. Общее обозначение сохраняет заложенную в тексте неоднозначность.
- issue: Значение סָרִיסִים
  choice: В основном тексте — «евнухов», с альтернативой «придворных чиновников» в сноске.
  alternative: Начальник придворных чиновников; главный царедворец.
  rationale: Термин может относиться и к физически оскоплённым евнухам, и шире к служащим царского двора. Прямое значение сохранено в тексте, историческая неоднозначность — в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Оборот «в сердце своём» сохраняет еврейский образ без архаичного «положил на сердце». Повтор «не оскверняться» намеренно воспроизводит повтор ключевого глагола в оригинале. Маркер сноски перенесён к слову «евнухов», поскольку примечание относится именно к нему.
