base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/018.yaml
  text: And at the end of the days that the king had said to bring them in[a], the chief of the eunuchs brought them before Nebuchadnezzar.
translation:
  language: ru
  text: По окончании срока, по истечении которого царь велел привести их, начальник евнухов[a] привёл их к Навуходоносору.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальник придворных». Еврейское слово может обозначать как евнуха, так и, в более широком смысле, царского придворного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִקְצָת הַיָּמִים
  choice: По окончании срока
  rationale: Оборот обозначает завершение установленного периода. «Срок» естественно передаёт контекст ранее назначенных трёх лет, не требуя буквального, но не вполне естественного «по окончании дней».
- source_word: אֲשֶׁר אָמַר הַמֶּלֶךְ
  choice: когда царь велел
  rationale: Глагол אָמַר буквально означает «сказал», но при инфинитиве в данном контексте выражает распоряжение царя. «Велел» передаёт эту синтаксическую функцию без добавления идеи формального назначения.
- source_word: לַהֲבִיאָם
  choice: привести их
  rationale: Каузативная форма בוא означает «привести». В русском языке это естественно описывает введение юношей в присутствие царя.
- source_word: וַיְבִיאֵם
  choice: привёл их
  rationale: Повтор того же каузативного глагола сохранён, поскольку он связывает исполнение с прежним царским повелением.
- source_word: שַׂר הַסָּרִיסִים
  choice: начальник евнухов
  rationale: Это прямое и традиционное значение выражения; при этом סָרִיס может обозначать и придворного чиновника, что отмечено в сноске.
- source_word: לִפְנֵי
  choice: к Навуходоносору
  rationale: Буквально «перед лицом / перед» указывает на доставление в присутствие царя. Русское «привёл к» естественно выражает это значение.
- source_word: נְבֻכַדְנֶצַּר
  choice: Навуходоносор
  rationale: Использована устоявшаяся русская библейская форма имени.
