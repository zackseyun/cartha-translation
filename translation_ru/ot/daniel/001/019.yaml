  text: וַ/יְדַבֵּ֣ר אִתָּ/ם֮ הַ/מֶּלֶךְ֒ וְ/לֹ֤א נִמְצָא֙ מִ/כֻּלָּ֔/ם כְּ/דָנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָ֑ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/019.yaml
  text: The king spoke with them[a], and among them all no one was found like Daniel, Hananiah, Mishael, and Azariah; so they stood before the king.
translation:
  language: ru
  text: Царь поговорил с ними, и среди них не нашлось никого, подобного Даниилу, Ханании, Мисаилу и Азарии; и они стали служить при царе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и они стояли перед царём» — придворное выражение, означающее службу в присутствии царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם
  choice: поговорил с ними
  rationale: Сочетание דבר с אִתָּם обозначает непосредственную беседу. «Поговорил с ними» естественно по-русски и не добавляет более узкого смысла «провёл собеседование».
- source_word: וְלֹא נִמְצָא מִכֻּלָּם
  choice: и среди них не нашлось никого
  rationale: Нифаль глагола מצא передан возвратной формой «не нашлось», а מִכֻּלָּם — естественным русским сравнительным оборотом «среди них».
- source_word: כְּדָנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: подобного Даниилу, Ханании, Мисаилу и Азарии
  rationale: Предлог כְּ выражает сравнение. Личные имена переданы в традиционных русских библейских формах.
- source_word: וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: и они стали служить при царе
  rationale: Буквально выражение означает «и они стояли перед царём», но в придворном контексте это устойчивое обозначение службы в царском присутствии. Основной текст передаёт смысл идиомы, а буквальный образ сохранён в примечании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и dignified, без архаизмов. Имена сохранены в привычных русских библейских формах. Придворная идиома передана смысловым эквивалентом с буквальным вариантом в сноске.
