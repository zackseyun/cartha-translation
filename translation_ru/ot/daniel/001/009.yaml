translation:
  language: ru
  text: И Бог даровал Даниилу благосклонность и сострадание в глазах начальника евнухов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальника придворных» либо «начальника дворцовых служащих»; еврейское слово может обозначать как евнухов в буквальном смысле, так и царских служащих вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: даровал
  rationale: Форма глагола נתן прямо представляет Бога как источник благосклонного отношения к Даниилу. «Даровал» естественно передаёт эту мысль в достойном повествовательном стиле.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В данном контексте существительное обозначает истинного Бога; тетраграмматон здесь не употреблён.
- source_word: אֶת דָּנִיֵּאל
  choice: Даниилу
  rationale: Показатель прямого дополнения отдельно не переводится. Дательный падеж обусловлен естественным русским управлением при глаголе «даровал».
- source_word: לְחֶסֶד
  choice: благосклонность
  rationale: Здесь חֶסֶד описывает благоприятное отношение придворного начальника к Даниилу, а не прямо заветную верность Бога. «Благосклонность» точно соответствует придворному и межличностному контексту.
- source_word: וּלְרַחֲמִים
  choice: сострадание
  rationale: Множественное существительное выражает сочувствие и милосердное расположение. «Сострадание» ясно передаёт эмоциональную сторону отношения начальника к Даниилу.
- source_word: לִפְנֵי
  choice: со стороны
  rationale: Буквально выражение означает «перед лицом» или «в присутствии». В данном сочетании русский оборот «со стороны» естественно показывает, чьё отношение к Даниилу имеется в виду, не меняя участников действия.
- source_word: שַׂר
  choice: начальник
  rationale: שַׂר обозначает высокопоставленного руководителя. «Начальник» ясно передаёт его власть над названной группой придворных.
- source_word: הַסָּרִיסִים
  choice: евнухов
  rationale: סָרִיסִים может обозначать как евнухов в буквальном смысле, так и придворных или дворцовых служащих вообще. В основном тексте сохранено прямое значение, а более широкое — в примечании.
theological_decisions:
- issue: Значение סָרִיסִים при вавилонском дворе
  choice: евнухов
  alternative: придворных или дворцовых служащих
  rationale: Еврейское слово допускает как буквальное, так и должностное понимание. Контекст не позволяет с полной уверенностью устранить одно из них, поэтому прямое значение оставлено в тексте, а реальная лексическая альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Оборот «со стороны» выбран вместо буквального «перед лицом», поскольку в русском он яснее выражает источник благосклонности и сострадания. Союз «И» сохранён как повествовательная связь с предыдущим стихом.
