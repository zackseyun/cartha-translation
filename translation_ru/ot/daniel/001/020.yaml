  yaml_path: translation/ot/daniel/001/020.yaml
  text: And in every matter of wisdom and understanding that the king asked of them[b][a], he found them ten times better than all the magicians and enchanters who were in all his kingdom.
translation:
  language: ru
  text: И во всяком деле мудрости и разумения, о котором царь спрашивал их, он находил, что они в десять раз превосходят[a] всех чародеев и заклинателей[b] во всём его царстве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на десять рук выше». Это древнееврейское выражение означает явное превосходство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «магов и астрологов». Второе слово обозначает одну из групп вавилонских мудрецов, но его точное значение неясно.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹל דְּבַר
  choice: И во всяком вопросе
  rationale: דָּבָר здесь обозначает предмет расспроса или рассмотрения, а не отдельное слово; «вопрос» естественно соответствует контексту царской проверки.
- source_word: חָכְמַת בִּינָה
  choice: требовавшем мудрости и понимания
  rationale: Такая передача ясно выражает область интеллектуального испытания и сохраняет оба близких, но не тождественных понятия.
- source_word: אֲשֶׁר בִּקֵּשׁ מֵהֶם הַמֶּלֶךְ
  choice: о чём царь спрашивал их
  rationale: בקשׁ с מן в данном контексте означает расспрашивать или требовать ответа; формулировка естественна по-русски и не добавляет специального вида экзамена.
- source_word: וַיִּמְצָאֵם
  choice: он находил их
  rationale: 'Сохранены личный субъект — царь — и оценочный смысл глагола: по результатам расспросов он убеждался в их превосходстве.'
- source_word: עֶשֶׂר יָדוֹת עַל
  choice: в десять раз лучше
  rationale: Буквально выражение означает «на десять рук выше», но это древнееврейская идиома ярко выраженного превосходства; естественный русский эквивалент сохраняет числовую гиперболу.
- source_word: הַחַרְטֻמִּים
  choice: чародеев
  rationale: Термин обозначает придворных специалистов по сакральным и тайным искусствам; «чародеи» понятно современному читателю и не приписывает им чрезмерно узкой функции.
- source_word: הָאַשָּׁפִים
  choice: заклинателей
  rationale: Точное значение названия этой группы вавилонских мудрецов не вполне ясно; «заклинатели» передаёт вероятную связь с заклинаниями и отличает их от первой группы.
- source_word: אֲשֶׁר בְּכָל מַלְכוּתוֹ
  choice: во всём своём царстве
  rationale: Передаёт распространённость этих придворных специалистов по всему царству и сохраняет отнесение царства к царю.
theological_decisions:
- issue: Передача названий вавилонских придворных специалистов без чрезмерной конкретизации
  choice: чародеев и заклинателей
  alternative: магов и астрологов
  rationale: Еврейские термины относятся к разным группам специалистов по тайным и сакральным искусствам, но их точные обязанности спорны. Выбранная пара сохраняет противопоставление данной Богом мудрости Даниила и его друзей официальной мудрости Вавилона, не утверждая, что вторая группа непременно была именно астрологами.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный и доступный стиль. Синтаксис близок к исходному тексту, но конструкция с חָכְמַת בִּינָה раскрыта естественным оборотом «требовавшем мудрости и понимания».
