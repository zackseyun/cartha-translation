  text: И он прислушался к ним в этом деле[a] и проверял их в течение десяти дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выслушал их в этом деле» или «внял им в этом деле»; еврейский глагол может означать как слушать, так и прислушаться, приняв просьбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע לָהֶם
  choice: он послушал их
  rationale: Глагол שׁמע с предлогом לְ может означать «слушать», «прислушаться» или «внять». В данном контексте человек принимает предложение Даниила; «послушал их» сохраняет образ слушания и естественно подразумевает согласие, не передавая социальных отношений как подчинение.
- source_word: לַדָּבָר הַזֶּה
  choice: в этом деле
  rationale: דָּבָר здесь обозначает обсуждаемое дело или предложение. Формулировка «в этом деле» естественна по-русски и не сужает значение до одних лишь произнесённых слов.
- source_word: וַיְנַסֵּם
  choice: испытывал их
  rationale: Форма Piel глагола נסה означает подвергать испытанию или проверке. Несовершенный вид «испытывал» хорошо передаёт продолжавшуюся десять дней проверку.
- source_word: יָמִים עֲשָׂרָה
  choice: десять дней
  rationale: Винительный длительности естественно передаётся по-русски без предлога; продолжительность ясна из сочетания с глаголом несовершенного вида.
