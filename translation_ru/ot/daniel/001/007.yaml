lexical_decisions:
- source_word: וַיָּשֶׂם לָהֶם שֵׁמוֹת
  choice: дал им новые имена
  rationale: Еврейская идиома буквально означает «положил/назначил имена». Русское «дал им новые имена» естественно передаёт переименование; слово «новые» ясно выражает подразумеваемый контраст с уже названными еврейскими именами.
- source_word: שַׂר הַסָּרִיסִים
  choice: начальник евнухов
  rationale: שַׂר обозначает начальника или главу, а סָרִיסִים в прямом значении — евнухов; возможное расширенное значение «придворные» сохранено в примечании.
- source_word: וַיָּשֶׂם לְדָנִיֵּאל בֵּלְטְשַׁאצַּר
  choice: Даниила он назвал Валтасаром
  rationale: Повтор глагола שׂים в контексте наречения имени естественно передаётся русским «назвал» с творительным падежом.
- source_word: בֵּלְטְשַׁאצַּר / שַׁדְרַךְ / מֵישַׁךְ / עֲבֵד נְגוֹ
  choice: Валтасар / Седрах / Мисах / Авденаго
  rationale: Использованы укоренившиеся в русской библейской традиции формы личных имён, остающиеся понятными современному читателю.
