  text: וַ/יְהִ֥י בָ/הֶ֖ם מִ/בְּנֵ֣י יְהוּדָ֑ה דָּנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/006.yaml
  text: And among them[a], from the sons of Judah, were Daniel, Hananiah, Mishael, and Azariah.
translation:
  language: ru
  text: Среди них, из сынов Иуды[a], были Даниил, Анания, Мисаил и Азария.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из иудеев», то есть из народа Иуды. Буквально: «из сынов Иуды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: были
  rationale: Форма היה с повествовательным waw вводит сообщение о наличии названных людей; русское «были» естественно передаёт эту конструкцию без буквального и тяжеловесного «и случилось».
- source_word: בָהֶם
  choice: среди них
  rationale: Предлог ב с местоименным суффиксом здесь обозначает принадлежность к ранее упомянутой группе; «среди них» точно и естественно передаёт этот смысл.
- source_word: מִבְּנֵי יְהוּדָה
  choice: из сынов Иуды
  rationale: Сохранён буквальный образ еврейского выражения בני יהודה и его мужская форма. Возможное более идиоматическое понимание — «из иудеев» или «из народа Иуды» — отмечено в сноске.
- source_word: דָּנִיֵּאל
  choice: Даниил
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: חֲנַנְיָה
  choice: Анания
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: מִישָׁאֵל
  choice: Мисаил
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: וַעֲזַרְיָה
  choice: и Азария
  rationale: Союз ו соединяет последнее имя с перечислением; использована устоявшаяся русская библейская форма имени.
