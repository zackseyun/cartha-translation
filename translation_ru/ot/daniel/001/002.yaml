  text: וַ/יִּתֵּן֩ אֲדֹנָ֨/י בְּ/יָד֜/וֹ אֶת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֗ה וּ/מִ/קְצָת֙ כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יְבִיאֵ֥/ם אֶֽרֶץ שִׁנְעָ֖ר בֵּ֣ית אֱלֹהָ֑י/ו וְ/אֶת הַ/כֵּלִ֣ים הֵבִ֔יא בֵּ֖ית אוֹצַ֥ר אֱלֹהָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/002.yaml
  text: And the Lord gave Jehoiakim king of Judah into his hand[a], along with some of the vessels of the house of God. He brought them to the land of Shinar, to the house of his god[c][b], and he brought the vessels into the treasury of his god.
translation:
  language: ru
  text: И Господь отдал Иоакима, царя Иудеи, в его власть[a], а также часть сосудов дома Божьего. Он принёс их в землю Сеннаар[b], в дом своего бога[c], а сосуды принёс в сокровищницу своего бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его руку»; или: «предал Иоакима, царя Иудеи, в его власть».'
    reason: lexical_alternative
  - marker: b
    text: Сеннаар — древнее название Вавилонии.
    reason: cultural_note
  - marker: c
    text: 'Или: «в храм своего бога»; далее: «в хранилище своего бога». В еврейском тексте слово «дом» употреблено и о доме Божьем, и о доме вавилонского божества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господь
  rationale: В согласном тексте стоит אֲדֹנָי, а не имя יהוה; поэтому передаётся как «Господь», без подмены формой, принятой для тетраграмматона.
- source_word: וַיִּתֵּן ... בְּיָדוֹ
  choice: отдал ... в его руку
  rationale: נתן означает «дать, отдать», а בְּיָדוֹ буквально сохраняет образ руки как власти. Такая формулировка передаёт активное действие Бога и не сводит его к простому попущению.
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Иоакима, царя Иудеи
  rationale: Использована традиционная русская форма имени и естественная современная аппозиция.
- source_word: וּמִקְצָת כְּלֵי בֵית הָאֱלֹהִים
  choice: а также часть сосудов дома Божьего
  rationale: מִקְצָת — «часть, некоторое количество»; כְּלֵי в храмовом контексте естественно передаётся как «сосуды». «Дом Божий» сохраняет буквальную лексику и параллель с домом вавилонского бога.
- source_word: וַיְבִיאֵם
  choice: Он принёс их
  rationale: Местоименный суффикс мужского рода множественного числа допускает совокупную отсылку к Иоакиму и сосудам; местоимение «их» сохраняет эту особенность текста.
- source_word: אֶרֶץ שִׁנְעָר
  choice: землю Сеннаар
  rationale: Сохранено слово אֶרֶץ «земля» и употреблена закрепившаяся в русской библейской традиции форма географического названия «Сеннаар».
- source_word: בֵּית אֱלֹהָיו
  choice: в дом своего бога
  rationale: Буквальное «дом» сохраняет литературную параллель с «домом Божьим»; строчная буква указывает на языческое божество.
- source_word: וְאֶת הַכֵּלִים הֵבִיא בֵּית אוֹצַר אֱלֹהָיו
  choice: а сосуды принёс в сокровищницу своего бога
  rationale: אוֹצָר здесь означает хранилище ценностей, то есть «сокровищницу». Повтор глагола «принёс» воспроизводит повтор в еврейском тексте.
theological_decisions:
- issue: Божественная власть в падении Иерусалима
  choice: Господь активно «отдал» Иоакима во власть завоевателя.
  alternative: Господь лишь допустил поражение Иоакима.
  rationale: Бог является подлежащим при глаголе נתן; перевод сохраняет прямое утверждение текста о Божьем действии, не смягчая его до одного лишь позволения.
- issue: Референт местоимения וַיְבִיאֵם
  choice: Сохранено множественное «их», наиболее естественно охватывающее Иоакима и сосуды.
  alternative: Понимать местоимение как относящееся только к сосудам, несмотря на грамматический мужской род множественного числа.
  rationale: Еврейская форма допускает совокупный объект, тогда как последующее отдельное упоминание сосудов поддерживает сохранение неоднозначности без уточняющей вставки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя, но сохранены ключевые повторы, образ «руки» и параллель между двумя «домами».
