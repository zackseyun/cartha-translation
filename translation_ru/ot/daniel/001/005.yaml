base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/005.yaml
  text: And the king assigned to them a daily portion from the king’s food and from the wine he drank[a], and to bring them up for three years[c][b]; and at the end of them they were to stand before the king.
translation:
  language: ru
  text: Царь назначил им на каждый день ежедневную долю из царской пищи[a] и вина, которое пил царь, и велел растить их в течение трёх лет. По окончании этого срока[b] они должны были предстать перед царём[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «царских яств» или «царской изысканной пищи». Еврейское выражение обозначает припасы с царского стола и может подразумевать отборную, роскошную еду.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по окончании их», то есть по окончании трёх лет.'
    reason: lexical_alternative
  - marker: c
    text: «Предстать перед царём» — придворное выражение, которое может означать явиться для службы при царе или исполнять обязанности в его присутствии.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַן
  choice: назначил
  rationale: Глагол обозначает властное установление или выделение положенного; «назначил» естественно передаёт административное распоряжение царя.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: на каждый день долю
  rationale: Еврейское выражение означает установленное ежедневное довольствие; перевод сохраняет как регулярность, так и представление о выделенной доле.
- source_word: מִפַּת בַּג הַמֶּלֶךְ
  choice: царской пищи
  rationale: Речь идёт о припасах или отборной пище с царского стола. Нейтральное «царская пища» не делает оттенок роскоши обязательным; возможный нюанс отмечен в сноске.
- source_word: וּמִיֵּין מִשְׁתָּיו
  choice: и вина, которое пил сам
  rationale: Фраза указывает на вино, предназначенное для питья царя. Слово «сам» естественно обозначает царя в русском контексте и сохраняет личную связь с его столом.
- source_word: וּלְגַדְּלָם
  choice: распорядился растить их так
  rationale: Каузативная форма передаёт выращивание, содержание и доведение до зрелости. «Растить» сохраняет широту значения, не сводя его только к кормлению или формальному обучению; «так» связывает процесс с установленным довольствием.
- source_word: שָׁנִים שָׁלוֹשׁ
  choice: три года
  rationale: Прямое обозначение продолжительности установленного периода.
- source_word: וּמִקְצָתָם
  choice: по окончании этого срока
  rationale: Буквально выражение отсылает к «концу их», то есть трёх лет. Русская формулировка ясно передаёт референт без неестественной двусмысленности.
- source_word: יַעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: они должны были предстать перед царём
  rationale: «Предстать перед царём» сохраняет придворную формулу стояния перед правителем и при этом звучит естественно в современном литературном русском.
