  text: וַ/יֹּ֥אמֶר דָּנִיֵּ֖אל אֶל הַ/מֶּלְצַ֑ר אֲשֶׁ֤ר מִנָּה֙ שַׂ֣ר הַ/סָּֽרִיסִ֔ים עַל דָּנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/011.yaml
  text: Then Daniel said to the steward whom the chief of the eunuchs had appointed over Daniel[a], Hananiah, Mishael, and Azariah,
translation:
  language: ru
  text: 'Тогда Даниил сказал распорядителю, которого начальник евнухов[a] поставил над Даниилом, Ананией, Мисаилом и Азарией:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придворных чиновников»; еврейское слово, переведённое как «евнухи», в некоторых контекстах может обозначать царских придворных в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт смену действия и его последовательность.
- source_word: הַמֶּלְצַר
  choice: распорядителю
  rationale: Редкий термин, вероятно обозначающий должностное лицо, непосредственно надзиравшее за юношами и их питанием. «Распорядитель» передаёт служебную роль без неясной транслитерации.
- source_word: אֲשֶׁר מִנָּה
  choice: которого ... поставил
  rationale: Относительное предложение указывает, что это должностное лицо было назначено начальником евнухов. «Поставил» естественно сочетается с последующим «над» и сохраняет образ исходного текста.
- source_word: שַׂר הַסָּרִיסִים
  choice: начальник евнухов
  rationale: Прямо передаёт שַׂר как начальника и обычное значение סָרִיסִים как евнухов; более широкое придворное значение отмечено в сноске.
- source_word: עַל
  choice: над
  rationale: В контексте назначения обозначает полномочия и ответственность за перечисленных юношей.
- source_word: דָּנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: Даниилом, Ананией, Мисаилом и Азарией
  rationale: Сохранены употреблённые в еврейском тексте имена; падежные формы соответствуют русскому управлению предлога «над».
theological_decisions:
- issue: Значение סָרִיסִים
  choice: 'В основном тексте: «евнухов»'
  alternative: «придворных» или «царедворцев»
  rationale: «Евнухи» — прямое и распространённое значение термина, однако в придворном контексте он мог обозначать чиновников шире; неоднозначность сохранена сноской, а не устранена в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, повествовательной интонацией. Двоеточие в конце отражает то, что речь Даниила продолжается в следующем стихе.
