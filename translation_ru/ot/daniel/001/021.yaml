    text: 'Или: «И Даниил был до первого года царя Кира». Еврейский глагол буквально означает «был», но здесь, вероятно, передаёт смысл продолжавшегося пребывания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: оставался там
  rationale: Буквально глагол означает «и был», но при личном субъекте и временном עַד естественно передаёт продолжавшееся пребывание. «Оставался там» ясно выражает этот смысл, не утверждая, что служение или жизнь Даниила завершились в названный год.
- source_word: דָּנִיֵּאל
  choice: Даниил
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: עַד
  choice: до
  rationale: Обычный русский эквивалент временного предлога, обозначающего предел продолжительности.
- source_word: שְׁנַת אַחַת
  choice: первого года
  rationale: Сочетание существительного с количественным числительным здесь идиоматически обозначает первый год царствования.
- source_word: לְכוֹרֶשׁ
  choice: царя Кира
  rationale: В формуле датировки предлог לְ указывает на правителя, по годам царствования которого ведётся отсчёт; по-русски это естественно передаётся родительным падежом.
- source_word: הַמֶּלֶךְ
  choice: царя
  rationale: Царский титул сохранён и поставлен перед именем согласно естественному русскому порядку слов.
theological_decisions:
- issue: Означает ли «до первого года» окончание жизни или служения Даниила?
  choice: Перевод передаёт только продолжавшееся пребывание Даниила до указанной временной точки.
  alternative: Понять фразу как утверждение, что в первый год Кира жизнь или служение Даниила закончились.
  rationale: Предлог עַד сам по себе не определяет, что произошло после названного срока; контекст книги также упоминает Даниила позднее. Поэтому перевод не должен добавлять вывода об окончании его жизни или служения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Частица «И» сохраняет повествовательную связь с предыдущим текстом; «оставался там» звучит естественно и одновременно допускает буквальную альтернативу в сноске.
