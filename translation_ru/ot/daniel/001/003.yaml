base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/003.yaml
  text: Then the king told Ashpenaz[a], the chief of his court officials, to bring some of the sons of Israel, both from the royal offspring and from the nobles,
translation:
  language: ru
  text: И сказал царь Ашпеназу, начальнику своих придворных[a], привести некоторых из сынов Израиля — как из царского рода, так и из знати,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальнику своих евнухов». Еврейское слово может обозначать как евнухов в буквальном смысле, так и царских придворных вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная формула с вау-консекутивом; зависимый инфинитив «привести» по-русски естественно передаёт распорядительный смысл, не усиливая глагол до «приказал».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Прямое соответствие существительному с определённым артиклем; в русском контексте определённость выражается без артикля.
- source_word: לְאַשְׁפְּנַז
  choice: Ашпеназу
  rationale: Имя передано принятой русской библейской транслитерацией и поставлено в дательный падеж согласно предлогу לְ.
- source_word: רַב סָרִיסָיו
  choice: начальнику своих придворных
  rationale: רַב обозначает главу или начальника, а סָרִיס может означать как евнуха, так и царского придворного. В основном тексте выбран более широкий придворный смысл; буквальная и традиционная альтернатива сохранена в сноске.
- source_word: לְהָבִיא
  choice: привести
  rationale: Каузативный инфинитив породы hifil от בוא после глагола речи естественно передаётся как «привести».
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: некоторых из сынов Израиля
  rationale: Предлог מִן здесь имеет выборочное значение «из числа». Формула «сыны Израиля» сохраняет образ и традиционную связь с названием народа.
- source_word: וּמִזֶּרַע הַמְּלוּכָה
  choice: как из царского рода
  rationale: זֶרַע буквально означает «семя, потомство»; «царский род» естественно передаёт происхождение и не звучит архаично или биологически.
- source_word: וּמִן הַפַּרְתְּמִים
  choice: так и из знати
  rationale: Редкое слово обозначает высокопоставленных вельмож или знатных людей. «Знать» кратко и естественно передаёт социальный статус без чрезмерной конкретизации.
