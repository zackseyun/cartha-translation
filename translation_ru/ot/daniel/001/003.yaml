translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской формулой «сыны Израиля». Парная конструкция «как… так и…» отражает два названных круга происхождения. Конечная запятая сохранена, поскольку стих синтаксически продолжается в Дан 1:4.
