  verdict: revise
  source_fidelity: Временной оборот, сравнение со всеми остальными юношами и «царская пища» переданы верно. נִרְאָה מַרְאֵיהֶם выражает наблюдаемую оценку их внешнего вида; «вид у них оказался лучше» передаёт это точнее и идиоматичнее, чем конструкция с настоящим временем «оказалось, что они выглядят». «Телом ... здоровее» сохраняет смысл בְּרִיאֵי בָשָׂר — телесно более крепкие/здоровые — без неоправданного сужения до медицинского диагноза.
