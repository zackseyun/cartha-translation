  footnotes:
  - marker: a
    text: 'Или: «пищу из посеянного». Еврейское слово обозначает растительную пищу, происходящую от посева или выращенную из семян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַס נָא
  choice: Прошу, испытай
  rationale: Императив выражает просьбу провести испытание, а частица נָא смягчает его; «прошу» передаёт вежливый, почтительный тон.
- source_word: עֲבָדֶיךָ
  choice: рабов твоих
  rationale: В контексте придворного обращения это почтительное самообозначение подчинённых; «рабов твоих» сохраняет библейскую социальную формулу без уточнения правового статуса.
- source_word: יָמִים עֲשָׂרָה
  choice: в течение десяти дней
  rationale: Так естественно передаётся еврейский винительный длительности.
- source_word: וְיִתְּנוּ לָנוּ
  choice: пусть нам дают
  rationale: Форма 3-го лица множественного числа выражает пожелание или просьбу; действующие лица в тексте не названы.
- source_word: מִן הַזֵּרֹעִים
  choice: пищу из семян
  rationale: Существительное связано с посеянным или выращенным из семян и обозначает растительную пищу; буквальный оттенок сохранён, а широта значения пояснена в сноске.
- source_word: וְנֹאכְלָה וּמַיִם וְנִשְׁתֶּה
  choice: и мы будем есть, и воду — и мы будем пить
  rationale: Когортативные формы переданы как желаемое следствие просьбы; сохранён еврейский параллелизм еды и питья.
