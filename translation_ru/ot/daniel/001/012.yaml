  naturalness: Предложение «пусть нам дают пищу из семян, и мы будем есть, и воду — и мы будем пить» механически воспроизводит еврейскую координацию и звучит тяжеловесно по-русски. Целевые обороты естественно выражают назначение выданной пищи и воды, не меняя смысла просьбы.
