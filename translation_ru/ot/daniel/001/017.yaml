  text: וְ/הַ/יְלָדִ֤ים הָ/אֵ֨לֶּה֙ אַרְבַּעְתָּ֔/ם נָתַ֨ן לָ/הֶ֧ם הָֽ/אֱלֹהִ֛ים מַדָּ֥ע וְ/הַשְׂכֵּ֖ל בְּ/כָל סֵ֣פֶר וְ/חָכְמָ֑ה וְ/דָנִיֵּ֣אל הֵבִ֔ין בְּ/כָל חָז֖וֹן וַ/חֲלֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/017.yaml
  text: As for these four youths[a], God gave them knowledge and insight in every kind of literature and wisdom[b]; and Daniel had understanding in every vision and dream.
translation:
  language: ru
  text: Этим четырём юношам Бог дал знание и понимание во всякой письменной учёности и мудрости, а Даниил понимал всякие видения и сны[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понимал всякое видение и сны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים הָאֵלֶּה אַרְבַּעְתָּם
  choice: этим четырём юношам
  rationale: «Юноши» передаёт их молодой возраст в контексте придворного обучения, не делая их детьми и не представляя вполне взрослыми мужчинами; конструкция с указательным словом и числительным естественно передана по-русски.
- source_word: נָתַן לָהֶם הָאֱלֹהִים
  choice: Бог дал
  rationale: Сохраняется прямое указание на Бога как подателя способностей и обычное значение глагола נתן.
- source_word: מַדָּע וְהַשְׂכֵּל
  choice: знание и понимание
  rationale: Эта пара передаёт как приобретённые познания, так и способность осмысливать их, не сливая два еврейских понятия в одно.
- source_word: בְּכָל סֵפֶר
  choice: всякой письменности
  rationale: Слово סֵפֶר буквально означает «книга», но здесь, вероятно, обозначает область письменного знания; «письменность» естественно передаёт широкий смысл и сохраняет связь с текстами и обучением.
- source_word: וְחָכְמָה
  choice: и мудрости
  rationale: Сохранено обычное и контекстуально уместное значение חָכְמָה, дополняющее книжные познания более широкой разумной компетентностью.
- source_word: הֵבִין בְּכָל חָזוֹן וַחֲלֹמוֹת
  choice: разбирался во всяких видениях и снах
  rationale: Формулировка передаёт особую способность Даниила понимать видения и сны, не уточняя сверх текста, шла ли речь исключительно об их истолковании или также об ином понимании.
theological_decisions:
- issue: Бог как источник способностей юношей
  choice: Прямо утверждается, что знание и понимание дал им Бог.
  alternative: Представить способности лишь результатом природной одарённости или обучения.
  rationale: В еврейском тексте Бог является явным подлежащим глагола «дал»; это указание сохранено без ослабления.
- issue: Характер дара Даниила в отношении видений и снов
  choice: Даниил обладал пониманием в области видений и снов.
  alternative: Уточнить, что Даниил либо получал все видения и сны, либо только истолковывал их.
  rationale: Исходная формулировка говорит о понимании, но не определяет точнее его действие; перевод сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Юноши» и «письменность» понятны широкому читателю; оборот «разбирался во всяких видениях и снах» звучит естественно и сохраняет смысловую широту оригинала.
