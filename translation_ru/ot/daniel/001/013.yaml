  text: וְ/יֵרָא֤וּ לְ/פָנֶ֨י/ךָ֙ מַרְאֵ֔י/נוּ וּ/מַרְאֵה֙ הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֣ג הַ/מֶּ֑לֶךְ וְ/כַ/אֲשֶׁ֣ר תִּרְאֵ֔ה עֲשֵׂ֖ה עִם עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/013.yaml
  text: Then let our appearance and the appearance of the youths who are eating the king’s food be seen before you[a], and according to what you see, deal with your servants.
translation:
  language: ru
  text: Тогда посмотри, как выглядим мы и как выглядят юноши, которые едят царскую пищу[a], и поступи со своими слугами в соответствии с тем, что увидишь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «положенную царём долю»; возможно также: «царские яства». Еврейское слово обозначает царскую провизию, вероятно отборную пищу с царского стола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרָאוּ לְפָנֶיךָ
  choice: тогда посмотри
  rationale: Буквально конструкция означает «пусть будут видны перед тобой». В современном русском активная формулировка естественно передаёт просьбу представить обе группы на суд чиновника, не добавляя явно отсутствующего в тексте глагола «сравнить».
- source_word: מַרְאֵינוּ וּמַרְאֵה הַיְלָדִים
  choice: как выглядим мы и как выглядят юноши
  rationale: Существительное מַרְאֶה обозначает видимый облик. Придаточная конструкция звучит по-русски естественнее буквального повторения «наш внешний вид и внешний вид», а יְלָדִים в контексте придворного обучения — юноши, не малые дети.
- source_word: הָאֹכְלִים
  choice: которые едят
  rationale: Причастие обозначает продолжающееся или обычное действие; русское придаточное сохраняет этот смысл без стилистической тяжеловесности.
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: царскую пищу
  rationale: Персидское заимствование обозначает провизию или отборную пищу, предоставляемую царём. «Царская пища» точно и ясно передаёт основной смысл, не усиливая оттенок роскоши.
- source_word: וְכַאֲשֶׁר תִּרְאֵה
  choice: в соответствии с тем, что увидишь
  rationale: Фраза подчёркивает, что дальнейшее решение должно основываться на личном наблюдении чиновника.
- source_word: עֲשֵׂה עִם עֲבָדֶיךָ
  choice: поступи со своими слугами
  rationale: Идиома עשה עם означает «поступить с кем-либо». Здесь עֲבָדֶיךָ служит почтительным придворным самообозначением, поэтому «слуги» уместнее, чем «рабы».
theological_decisions:
- issue: Передача עֲבָדֶיךָ
  choice: со своими слугами
  alternative: со своими рабами
  rationale: Даниил почтительно обращается к поставленному над ним чиновнику; социально-правовой статус здесь не выдвинут на первый план. Контекстуальное «слуги» сохраняет придворный тон, не отрицая возможной зависимости этих юношей.
translation_notes:
  register: Современный литературный русский язык с уважительным придворным тоном. Избегнуты архаизмы вроде «пред тобою» и излишне интерпретирующее «сравни»; повтор исходного מַרְאֶה передан естественной параллельной конструкцией «как выглядим мы и как выглядят юноши».
