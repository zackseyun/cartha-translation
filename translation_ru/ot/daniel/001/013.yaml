  source_fidelity: 'Перевод точно передаёт просьбу Даниила: чиновнику предлагается самому увидеть внешний вид обеих групп, а затем поступить с говорящими сообразно увиденному. Активное «посмотри» естественно выражает еврейскую пассивно-побудительную конструкцию «пусть будут видны перед тобой», не внося существенного дополнительного смысла. «Юноши» соответствует יְלָדִים в придворном контексте, а «царская пища» адекватно передаёт פַּתְבַּג הַמֶּלֶךְ.'
