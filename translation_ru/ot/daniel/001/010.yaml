base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/010.yaml
  text: But the chief of the eunuchs said to Daniel[a], “I fear my lord the king, who assigned your food and your drink[c][b]. Why should he see your faces looking worse than the youths who are of your own age? Then you would endanger my head with the king.”
translation:
  language: ru
  text: 'Но начальник евнухов сказал Даниилу: «Я боюсь моего господина, царя, который назначил вам пищу и питьё. Почему он должен увидеть ваши лица более мрачными, чем у юношей вашего возраста? Ведь вы подвергнете мою жизнь опасности перед царём».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы сделаете мою голову виновной перед царём»; это идиоматическое выражение ответственности перед царём, грозящей жизнью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הַסָּרִיסִים
  choice: начальник евнухов
  rationale: Наиболее прямо передаёт сочетание שַׂר «начальник» и סָרִיסִים «евнухи»; последнее также может обозначать придворных служащих, однако контекст не требует заменять прямое значение более общим.
- source_word: יָרֵא אֲנִי אֶת אֲדֹנִי הַמֶּלֶךְ
  choice: Я боюсь моего господина, царя
  rationale: Сохраняет значение продолжающегося опасения и придворное почтительное именование царя.
- source_word: מִנָּה אֶת מַאֲכַלְכֶם וְאֶת מִשְׁתֵּיכֶם
  choice: назначил вам пищу и питьё
  rationale: מִנָּה означает назначить или определить; существительные обозначают предоставленные пищу и питьё без необходимости уточнять, что питьём было вино.
- source_word: פְּנֵיכֶם זֹעֲפִים
  choice: вы выглядите хуже
  rationale: В сравнительном контексте естественно выражает видимое неблагополучие, буквально описанное как угрюмые, мрачные или осунувшиеся лица.
- source_word: הַיְלָדִים אֲשֶׁר כְּגִילְכֶם
  choice: юношей вашего возраста
  rationale: יְלָדִים в контексте придворного обучения обозначает юношей, а כְּגִילְכֶם — принадлежность к той же возрастной группе.
- source_word: וְחִיַּבְתֶּם אֶת רֹאשִׁי לַמֶּלֶךְ
  choice: вы сделаете меня виновным перед царём и поставите под угрозу мою жизнь
  rationale: Передаёт одновременно идею ответственности перед царём и подразумеваемую смертельную угрозу; образ «головы» раскрыт по смыслу ради ясности современному читателю.
