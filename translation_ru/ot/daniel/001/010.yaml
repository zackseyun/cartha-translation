revisions:
- from: 'Но начальник евнухов сказал Даниилу: «Я боюсь моего господина, царя, который назначил вам пищу и питьё. Если он увидит, что вы выглядите хуже юношей вашего возраста, вы сделаете меня виновным перед царём и поставите под угрозу мою жизнь».[a]'
  to: 'Но начальник евнухов сказал Даниилу: «Я боюсь моего господина, царя, который назначил вам пищу и питьё. Почему он должен увидеть ваши лица более мрачными, чем у юношей вашего возраста? Ведь вы подвергнете мою жизнь опасности перед царём».[a]'
  rationale: Восстановлен риторический вопрос исходного текста. «Более мрачными» точнее передаёт описание лиц, а опасность для жизни естественно выражает силу идиомы о «голове». Сноска сохраняет буквальный образ и объясняет его без навязывания дополнительного толкования.
