  terminology: «Начальник евнухов», «мой господин, царь», «пища и питьё» и «юноши вашего возраста» приемлемы и соответствуют еврейскому тексту. Значение זֹעֲפִים следует передать как мрачный/угрюмый вид, не сводя его только к общему «хуже».
