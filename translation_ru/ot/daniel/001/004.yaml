- source_word: כֹּחַ בָּהֶם
  choice: пригодных
  rationale: В данном контексте כֹּחַ обозначает способность и соответствие требованиям царской службы, а не только физическую силу.
- source_word: לַעֲמֹד בְּהֵיכַל הַמֶּלֶךְ
  choice: стоять во дворце царя
  rationale: Сохранён конкретный образ исходного текста; выражение также может идиоматически означать служение или присутствие при царском дворе, что отмечено в сноске.
- source_word: הֵיכַל
  choice: дворец
  rationale: В царском вавилонском контексте слово обозначает дворец, а не храм.
- source_word: לְלַמְּדָם
  choice: чтобы обучить их
  rationale: Естественная передача цели царского распоряжения и педагогического значения формы.
- source_word: סֵפֶר
  choice: письменности
  rationale: В контексте обучения слово охватывает письмо, тексты и книжно-писцовую традицию; «письменность» передаёт это шире, чем единичное «книга».
- source_word: לְשׁוֹן כַּשְׂדִּים
