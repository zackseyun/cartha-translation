revisions:
- from: Когда вы услышите звук рога, свирели, лиры, тригона, псалтири, симфонии[b] и всевозможных музыкальных инструментов, падите ниц и поклонитесь[a] золотому истукану, которого поставил царь Навуходоносор.
  to: Когда вы услышите звук рога, свирели, лиры, тригона, псалтерия, сумпонии[b] и всевозможной музыки, падите ниц и поклонитесь[a] золотому истукану, которого поставил царь Навуходоносор.
  rationale: Правка сохраняет синтаксис и приказной смысл арамейского текста, но устраняет современную ложную ассоциацию слова «симфония», делает название псалтерия однозначно инструментальным, не сужает обобщение о музыке до одних инструментов и приводит сноску о поклонении к лексически нейтральной формулировке.
