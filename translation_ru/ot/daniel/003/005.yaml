source:
  edition: WLC
  text: בְּ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַ֠שְׁרוֹקִיתָ/א קיתרוס סַבְּכָ֤א פְּסַנְתֵּרִין֙ סוּמְפֹּ֣נְיָ֔ה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א תִּפְּל֤וּן וְ/תִסְגְּדוּן֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/005.yaml
  text: At the time when you hear the sound of the horn[a], pipe, lyre, trigon, psaltery, bagpipe, and every kind of music[b], you are to fall down and pay homage to the golden image that King Nebuchadnezzar has set up.
translation:
  language: ru
  text: Когда вы услышите звук рога, свирели, лиры, тригона, псалтерия, сумпонии[b] и всевозможной музыки, падите ниц и поклонитесь[a] золотому истукану, которого поставил царь Навуходоносор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздайте почести». Арамейский глагол обозначает почтительное преклонение или падение ниц; в данном контексте оно обращено к истукану и потому носит идолопоклоннический характер.'
    reason: alternative_reading
  - marker: b
    text: Точное значение названия «сумпония» неизвестно; возможно, имеется в виду волынка или двойная свирель.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעִדָּנָא דִּי
  choice: Когда
  rationale: Естественно передаёт арамейский временной оборот «в то время, когда» без избыточной тяжеловесности.
- source_word: קָל קַרְנָא
  choice: звук рога
  rationale: Сохраняет общее обозначение духового инструмента, не уточняя его как бараний рог или корнет.
- source_word: מַשְׁרוֹקִיתָא
  choice: свирель
  rationale: Понятное литературное обозначение духового инструмента типа флейты или дудки без чрезмерной конкретизации.
- source_word: קיתרוס
  choice: лира
  rationale: Передаёт заимствованное название струнного инструмента ясным современному читателю словом.
- source_word: סַבְּכָא
  choice: тригон
  rationale: Сохраняет отдельное название предположительно треугольного струнного инструмента и не отождествляет его с другими инструментами списка.
- source_word: פְּסַנְתֵּרִין
  choice: псалтирь
  rationale: Традиционное русское название древнего струнного инструмента, отличающее его от лиры и тригона.
- source_word: סוּמְפֹּנְיָה
  choice: симфония
  rationale: Транслитерация сохраняет неопределённость редкого названия инструмента; возможные идентификации пояснены в сноске.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: и всевозможных музыкальных инструментов
  rationale: В контексте перечня инструментов слово זְמָרָא естественно понимается как собирательное обозначение музыкального сопровождения или инструментов.
- source_word: תִּפְּלוּן וְתִסְגְּדוּן
  choice: падите ниц и поклонитесь
  rationale: Передаёт предписывающую силу форм и различает физическое падение ниц и последующее выражение почтения перед изображением.
- source_word: צֶלֶם דַּהֲבָא
  choice: золотой истукан
  rationale: «Истукан» естественно обозначает культовое изваяние и соответствует явно идолопоклонническому контексту, не меняя предмет высказывания на абстрактный «образ».
theological_decisions:
- issue: Значение סגד в контексте идолопоклонства
  choice: поклонитесь
  alternative: поклонитесь как божеству; воздайте почести
  rationale: Глагол обозначает земной поклон или почтительное преклонение и в данном контексте имеет культовый, идолопоклоннический характер. «Поклонитесь» сохраняет как телесный, так и религиозный оттенок, а сноска сообщает более явную альтернативу.
translation_notes:
  register: Современный литературный и торжественный регистр. Названия сравнительно известных инструментов переведены функциональными соответствиями, а спорное סוּמְפֹּנְיָה транслитерировано с пояснением. Повелительное «падите ниц» передаёт царский приказ ясно и естественно.
