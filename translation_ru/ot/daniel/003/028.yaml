reference: Daniel 3:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עָנֵ֨ה נְבֽוּכַדְנֶצַּ֜ר וְ/אָמַ֗ר בְּרִ֤יךְ אֱלָהֲ/הוֹן֙ דִּֽי שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ דִּֽי שְׁלַ֤ח מַלְאֲכֵ/הּ֙ וְ/שֵׁיזִ֣ב לְ/עַבְד֔וֹ/הִי דִּ֥י הִתְרְחִ֖צוּ עֲל֑וֹ/הִי וּ/מִלַּ֤ת מַלְכָּ/א֙ שַׁנִּ֔יו וִ/יהַ֣בוּ גשמי/הון דִּ֠י לָֽא יִפְלְח֤וּן וְ/לָֽא יִסְגְּדוּן֙ לְ/כָל אֱלָ֔הּ לָהֵ֖ן לֵ/אלָֽהֲ/הֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/028.yaml
  text: Nebuchadnezzar answered and said[a], “Blessed be the God of Shadrach, Meshach, and Abed-nego, who sent his angel and delivered his servants, who trusted in him, and set aside the king’s command, and gave up their bodies[c][b], that they might not serve or worship any god except their own God.”
translation:
  language: ru
  text: 'Навуходоносор сказал в ответ: «Благословен Бог Седраха, Мисаха и Авденаго, пославший Своего ангела[a] и спасший Своих рабов, которые положились на Него, не подчинились царскому повелению[b] и отдали свои тела, чтобы не служить и не поклоняться[c] никакому богу, кроме своего Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «вестника». Арамейское слово может означать как ангела, так и вестника.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «изменили слово царя»; по смыслу — отказались исполнить царское повеление.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «падать ниц перед». Здесь это телесное выражение поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: сказал в ответ
  rationale: Естественно передаёт арамейскую повествовательную формулу «ответил и сказал», не создавая тяжеловесного буквального оборота.
- source_word: בְּרִיךְ
  choice: Благословен
  rationale: Сохраняет форму торжественного благословения и естественно звучит по-русски.
- source_word: אֱלָהֲהוֹן דִּי שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Бог Седраха, Мисаха и Авденаго
  rationale: Передаёт притяжательное значение суффикса через перечисление имён; использованы закрепившиеся в русской библейской традиции формы имён.
- source_word: שְׁלַח מַלְאֲכֵהּ
  choice: пославший Своего ангела
  rationale: В контексте чудесного избавления «ангел» является наиболее естественным значением, при этом возможное значение «вестник» отмечено в сноске.
- source_word: וְשֵׁיזִב
  choice: и спасший
  rationale: Глагол обозначает избавление от непосредственной опасности; «спасший» здесь ясно и естественно передаёт действие.
- source_word: לְעַבְדוהִי
  choice: Своих рабов
  rationale: «Рабы» сохраняет распространённое библейское обозначение людей, принадлежащих Богу и служащих Ему; контекст не говорит о социальном рабстве.
- source_word: הִתְרְחִצוּ עֲלוֹהִי
  choice: положились на Него
  rationale: Передаёт доверие как уверенное упование и зависимость от Бога, а не только внутреннее убеждение.
- source_word: וּמִלַּת מַלְכָּא שַׁנִּיו
  choice: не подчинились царскому повелению
  rationale: 'Контекстуально раскрывает идиому «изменили слово царя»: они отказались исполнить приказ. Буквальный образ сохранён в сноске.'
- source_word: וִיהַבוּ גֶּשְׁמֵיהוֹן
  choice: и отдали свои тела
  rationale: Сохраняет конкретный образ добровольной готовности подвергнуть тело опасности, не добавляя прямо отсутствующего в тексте слова «смерть».
- source_word: לָא יִפְלְחוּן וְלָא יִסְגְּדוּן
  choice: не служить и не поклоняться
  rationale: 'Сохраняет два взаимодополняющих действия: религиозное служение и телесный акт почитания.'
- source_word: לָהֵן לֵאלָהֲהוֹן
  choice: кроме своего Бога
  rationale: 'Частица выражает исключение, а суффикс — принадлежность: никакому иному богу, кроме их Бога.'
theological_decisions:
- issue: Кого обозначает מַלְאֲכֵהּ в рассказе об избавлении
  choice: Своего ангела
  alternative: Своего вестника; более конкретное христологическое отождествление
  rationale: Арамейское слово допускает значения «ангел» и «вестник». Контекст поддерживает «ангела», но сам стих не требует более конкретного богословского отождествления.
- issue: Смысл отдачи тел
  choice: отдали свои тела
  alternative: отдали свои тела на смерть
  rationale: Перевод сохраняет сильный образ исходного текста и подразумеваемую готовность пострадать, не делая подразумеваемое слово «смерть» частью основного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис разгружен формулой «сказал в ответ»; имена даны в привычных русскому читателю традиционных формах. Заглавные местоимения при обращении к Богу использованы последовательно в пределах цитаты.
