  - severity: low
    issue: «Он сказал в ответ, чтобы печь раскалили»
    rationale: Смысл понятен, но для царского приказа естественнее «он велел раскалить печь»; это передаёт инфинитив распоряжения без менее ясной конструкции с «сказал в ответ».
