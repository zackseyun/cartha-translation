base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/019.yaml
  text: Then Nebuchadnezzar was filled with fury[a], and the expression of his face was changed against Shadrach, Meshach, and Abed-nego. He answered and said to heat the furnace seven times more than it was usually heated.
translation:
  language: ru
  text: Тогда Навуходоносор исполнился ярости, и выражение его лица изменилось по отношению к Седраху, Мисаху и Авденаго. Он велел раскалить печь в семь раз[a] сильнее, чем обычно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семикратно». Арамейское выражение означает, что печь велено было раскалить в семь раз сильнее, чем обычно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: הִתְמְלִי חֱמָא
  choice: исполнился ярости
  rationale: Сочетание обозначает, что Навуходоносор стал полон сильного гнева; формулировка сохраняет образ наполнения и интенсивность чувства.
- source_word: וּצְלֵם אַנְפּוֹהִי אשתנו
  choice: выражение его лица изменилось
  rationale: Буквально говорится об изменении «облика его лица»; речь идёт о заметной перемене выражения лица.
- source_word: עַל שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: когда он посмотрел на Седраха, Мисаха и Авденаго
  rationale: Предлог עַל обозначает направленность лица и в данном контексте несёт враждебный оттенок; русская конструкция естественно связывает изменение выражения с обращённым на них взглядом, не добавляя прямого указания на действие против них.
- source_word: עָנֵה וְאָמַר
  choice: Он сказал в ответ
  rationale: Обычная семитская формула «ответил и сказал» передана естественным современным русским выражением без потери значения ответа.
- source_word: לְמֵזֵא לְאַתּוּנָא
  choice: чтобы печь раскалили
  rationale: Инфинитив выражает распоряжение повысить жар печи; «раскалили» ясно и идиоматично передаёт это действие.
- source_word: חַד שִׁבְעָה
  choice: в семь раз
  rationale: Арамейское выражение указывает на семикратную степень усиления жара; современная формулировка понятна без архаизма «семикратно».
- source_word: עַל דִּי חֲזֵה לְמֵזְיֵהּ
  choice: сильнее обычного
  rationale: Идиоматическая фраза буквально указывает на жар сверх того, до какой степени печь считалось надлежащим или обычным нагревать.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Седрах, Мисах и Авденаго
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, хорошо узнаваемые современным читателем.
