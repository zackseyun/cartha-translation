lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Поэтому
  rationale: Арамейское причинно-следственное выражение естественно передано кратким русским союзным наречием, связывающим обвинение с предшествующими событиями.
- source_word: בֵּהּ זִמְנָא
  choice: в то время
  rationale: Точно и естественно передаёт временное указание, не сужая его до одного мгновения.
- source_word: קְרִבוּ
  choice: выступили вперёд
  rationale: В придворном контексте передаёт буквальную идею приближения и одновременно публичное выступление с обвинением.
- source_word: גֻּבְרִין כַּשְׂדָּאִין
  choice: несколько халдеев
  rationale: Передаёт неопределённую группу мужчин-халдеев без необоснованного уточнения их должности; по-русски отдельное слово «мужчины» здесь избыточно.
- source_word: וַאֲכַלוּ קַרְצֵיהוֹן
  choice: со злым умыслом обвинили
  rationale: Арамейская идиома буквально говорит о «поедании кусков» и обозначает враждебный донос или злонамеренное обвинение; перевод сохраняет как юридический, так и недоброжелательный оттенок.
- source_word: דִּי יְהוּדָיֵא
  choice: иудеев
  rationale: Обычное русское библейское обозначение представителей народа Иудеи; возможный этногеографический оттенок отмечен в сноске.
