base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/002.yaml
  text: Then King Nebuchadnezzar sent to assemble the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces, to come to the dedication of the image that King Nebuchadnezzar had set up.
translation:
  language: ru
  text: И царь Навуходоносор приказал созвать сатрапов, наместников, правителей, советников, казначеев, судей, должностных лиц и всех чиновников областей, чтобы они пришли на церемонию посвящения изваяния[a], которое установил царь Навуходоносор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «статуя». Арамейское слово может обозначать образ или изображение вообще, а в данном контексте — монументальную статую.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְמִכְנַשׁ
  choice: повелел собрать
  rationale: Буквально сочетание означает «послал собрать», но в административном контексте речь идёт о царском распоряжении созвать должностных лиц; выбранная формулировка естественна по-русски и сохраняет смысл.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапов
  rationale: Персидское административное заимствование; исторический термин точно передаёт имперский контекст.
- source_word: סִגְנַיָּא
  choice: наместников
  rationale: Высокий административный титул; «наместники» передаёт управленческую должность, не смешивая её с сатрапами.
- source_word: פַחֲוָתָא
  choice: правителей
  rationale: Обозначает представителей власти, обычно управлявших территориями; общий русский эквивалент позволяет отличить эту должность от предыдущей.
- source_word: אֲדַרְגָּזְרַיָּא
  choice: советников
  rationale: Точное содержание редкого титула не вполне ясно; традиционное функциональное соответствие сохраняет вероятную совещательную роль без чрезмерной конкретизации.
- source_word: גְדָבְרַיָּא
  choice: казначеев
  rationale: Слово обычно понимается как обозначение чиновников, ведавших казной.
- source_word: דְּתָבְרַיָּא
  choice: судей
  rationale: Термин связан с принятием правовых решений; это наиболее прямой русский эквивалент.
- source_word: תִּפְתָּיֵא
  choice: должностных лиц
  rationale: Точная функция этой категории чиновников спорна; обобщённый перевод избегает необоснованного уточнения вроде «магистратов» или «законоведов».
- source_word: שִׁלְטֹנֵי מְדִינָתָא
  choice: всех начальников областей
  rationale: Собирательное обозначение властей областей; «начальники» сохраняет значение лиц, наделённых властью, после перечня конкретных должностей.
- source_word: חֲנֻכַּת
  choice: посвящение
  rationale: Слово обозначает церемонию посвящения или торжественного введения объекта в употребление.
- source_word: צַלְמָא
  choice: изваяния
  rationale: Арамейское слово может обозначать образ, изображение или статую; в данном контексте речь идёт о монументальном объёмном сооружении, поэтому «изваяние» звучит естественно, сохраняя смысловой диапазон через примечание.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественно-официальным оттенком, соответствующим перечню имперских чинов. Редкие административные титулы переданы либо исторически закреплённым термином («сатрапы»), либо понятными функциональными обозначениями; неопределённость двух редких названий должностей не скрыта посредством чрезмерно точных соответствий.
