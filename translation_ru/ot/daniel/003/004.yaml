lexical_decisions:
- source_word: כָרוֹזָא
  choice: глашатай
  rationale: Обозначает официального публичного возвещателя; «глашатай» сохраняет придворный и торжественный характер сцены.
- source_word: קָרֵא
  choice: провозгласил
  rationale: Глагол означает громко воззвать; в контексте официального объявления «провозгласил» естественно передаёт публичный характер речи.
- source_word: בְחָיִל
  choice: громко
  rationale: Буквально «с силой»; здесь выражение описывает силу или громкость голоса.
- source_word: לְכוֹן
  choice: вам
  rationale: Дательный падеж местоимения второго лица множественного числа, вводящий адресатов объявления.
- source_word: אָמְרִין
  choice: объявляется
  rationale: Формально «говорят», но форма употреблена как безличная официальная формула; пассивно-безличное «объявляется» передаёт её функцию без указания не названного субъекта.
- source_word: עַמְמַיָּא
  choice: народы
  rationale: Множественное число обозначает отдельные этнические или политические общности.
- source_word: אֻמַּיָּא
  choice: племена
  rationale: Выбрано для сохранения различия между двумя близкими арамейскими существительными в трёхчастном перечне; возможный перевод — «нации».
- source_word: לִשָּׁנַיָּא
  choice: языки
  rationale: Буквально «языки»; здесь метонимически названы языковые общности, что соответствует имперской формуле обращения.
