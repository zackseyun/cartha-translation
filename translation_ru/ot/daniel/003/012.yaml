base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/012.yaml
  text: 'There are certain Jewish men whom you have appointed over the administration of the province of Babylon—Shadrach[a], Meshach, and Abed-nego. These men have paid no attention to you, O king: they do not serve your gods[b], and they do not worship the golden image that you have set up.'
translation:
  language: ru
  text: 'Есть иудеи, которых ты поставил управлять областью Вавилона: Седрах, Мисах и Авденаго. Эти люди, царь, не считаются с тобой[a]: твоим богам они не служат и золотой статуе, которую ты воздвиг, не поклоняются[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «не оказывают тебе почтения» или «не обращают на тебя внимания». Арамейское выражение буквально говорит, что они не «положили» на царя внимания или почтения.'
    reason: lexical_alternative
  - marker: b
    text: 'В арамейском тексте употреблены разные глаголы: богам они не «служат», а статуе не «поклоняются».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי גֻּבְרִין יְהוּדָאיִן
  choice: Есть иудеи
  rationale: Арамейская бытийная конструкция вводит обвинение. «Есть иудеи» естественно по-русски и не требует добавления отсутствующего в оригинале неопределённого определения; слово גֻּבְרִין здесь можно не воспроизводить отдельно, поскольку «иудеи» уже обозначает людей мужского пола в данном контексте.
- source_word: דִּי מַנִּיתָ יָתְהוֹן עַל עֲבִידַת מְדִינַת בָּבֶל
  choice: которых ты поставил управлять областью Вавилон
  rationale: מַנִּיתָ означает назначение, а עֲבִידַת в административном контексте — ведение дел или управление. Глагольная конструкция звучит естественнее буквального «над управлением».
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Седрах, Мисах и Авденаго
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, узнаваемые современным читателем.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: Эти люди
  rationale: Сохраняется подчёркнутое возобновление упоминания названных лиц.
- source_word: לָא שָׂמוּ עֲלַיִךְ ... טְעֵם
  choice: не считаются с тобой
  rationale: Идиома буквально говорит, что они не «положили» к царю внимания или почтения. «Не считаются с тобой» сохраняет личную направленность обвинения и не подменяет её более узким упоминанием царского приказа.
- source_word: מַלְכָּא
  choice: царь
  rationale: Русская форма обращения без частицы «о» звучит современно и сохраняет придворный вокатив.
- source_word: לֵאלָהַיִךְ לָא פָלְחִין
  choice: твоим богам они не служат
  rationale: «Служат» передаёт культовое служение и сохраняет отличие פְלַח от следующего סְגַד.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: золотому истукану
  rationale: צֶלֶם обозначает изображение или статую. «Истукан» — понятное и укоренённое в русском библейском регистре обозначение культового изображения; прилагательное передаёт материал.
- source_word: דִּי הֲקֵימְתָּ
  choice: которого ты воздвиг
  rationale: Глагол означает поднять, установить или воздвигнуть; выбранное слово соответствует монументальному изображению и достоинству повествования.
- source_word: לָא סָגְדִין
  choice: не поклоняются
  rationale: Передаёт поклонение с телесным преклонением и отличается от культового «служат» в предыдущей части.
theological_decisions:
- issue: Различение двух глаголов религиозного действия
  choice: פָלְחִין передано как «служат», а סָגְדִין — как «поклоняются»
  alternative: Передать оба глагола словом «поклоняются»
  rationale: Сохранение разных русских глаголов отражает различие оригинала между культовым служением богам и поклонением перед изображением, не сглаживая формулировку обвинения.
- issue: Объект проявленного неуважения
  choice: «не считаются с тобой»
  alternative: «не повинуются твоему приказу»
  rationale: В тексте непосредственно назван сам царь, а значение טְעֵם в этой идиоме допускает внимание, почтение или распоряжение. Выбранный вариант сохраняет личную направленность и смысловую неоднозначность, не добавляя явно не названный приказ.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прямой и понятный; традиционные формы имён и слово «истукан» обеспечивают узнаваемость, не создавая чрезмерной архаичности. Все сноски отмечены в основном тексте.
