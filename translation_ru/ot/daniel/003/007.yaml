  naturalness: После правок текст остаётся современным литературным русским. «Золотое изваяние» естественнее и нейтральнее, чем несколько архаичное «истукан». «Пали ниц и поклонились» удачно передаёт два арамейских глагольных действия.
  terminology: Названия «рог», «свирель», «лира», «треугольная арфа» и «псалтирь» допустимы при сохранённых сносках о неопределённости двух редких инструментов. «Народы, племена и языки» сохраняет традиционную трёхчленную формулу без догматического истолкования.
