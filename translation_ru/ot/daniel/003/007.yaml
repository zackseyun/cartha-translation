base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/007.yaml
  text: Therefore[a], at that time, when all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image that King Nebuchadnezzar had set up.
translation:
  language: ru
  text: Поэтому в то время, когда все народы услышали звук рога, свирели, лиры, треугольной арфы[a], псалтири[b] и всякого рода музыки, все народы, племена и языки пали ниц и поклонились золотому изваянию, которое поставил царь Навуходоносор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точная идентификация некоторых названных здесь инструментов неизвестна. Под этим словом, возможно, подразумевается треугольный струнный инструмент; встречаются также переводы «самбука» и «арфа».
    reason: lexical_alternative
  - marker: b
    text: Здесь «псалтирь» — древний струнный инструмент, возможно родственный цитре или арфе; его точное устройство неизвестно.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Поэтому
  rationale: Передаёт выводное значение арамейского оборота и естественно связывает исполнение указа с предыдущим повелением.
- source_word: בֵּהּ זִמְנָא
  choice: в то время
  rationale: Точно и естественно обозначает время исполнения повеления.
- source_word: כְּדִי שָׁמְעִין
  choice: как только ... услышали
  rationale: Контекст описывает немедленное исполнение царского приказа; русское выражение естественно передаёт временную последовательность, хотя оттенок непосредственности определяется контекстом.
- source_word: כָּל עַמְמַיָּא
  choice: все народы
  rationale: Сохраняет множественное число и этнический смысл обозначения.
- source_word: קָל
  choice: звук
  rationale: В данном контексте речь идёт о звучании музыкальных инструментов.
- source_word: קַרְנָא
  choice: рог
  rationale: Общее обозначение духового инструмента не вносит неподтверждённой конкретизации.
- source_word: מַשְׁרוֹקִיתָא
  choice: свирель
  rationale: Понятное современному читателю общее название духового инструмента, подходящее к неопределённой идентификации арамейского термина.
- source_word: קיתרס
  choice: лира
  rationale: Доступный русский эквивалент греческого заимствования, обозначающего струнный инструмент типа кифары.
- source_word: שַׂבְּכָא
  choice: треугольная арфа
  rationale: Вероятная, но не вполне достоверная идентификация инструмента; неопределённость отмечена сноской.
- source_word: פְּסַנְטֵרִין
  choice: псалтирь
  rationale: Традиционное русское название древнего струнного инструмента; не следует смешивать с книгой Псалтирью, а точная конструкция инструмента неизвестна.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: и всевозможных музыкальных инструментов
  rationale: В контексте перечня передаёт широкий итоговый охват; слово זְמָרָא может обозначать музыку либо музыкальное сопровождение, поэтому формулировка ориентирована на конкретный синтаксический ряд.
- source_word: נָפְלִין
  choice: пали ниц
  rationale: Передаёт как буквальное падение, так и телесную позу полного преклонения, не дублируя последующий глагол поклонения.
- source_word: צֶלֶם דַּהֲבָא
  choice: золотой истукан
  rationale: «Истукан» естественно обозначает культовое изваяние и сохраняет религиозный контекст, не уточняя его форму.
theological_decisions:
- issue: Характер действия перед золотым изваянием
  choice: поклонились
  alternative: почтили; совершили поклонение
  rationale: Арамейский סגד обозначает поклонение или простирание перед кем-либо. В культовом контексте золотого изваяния русское «поклонились» сохраняет религиозную силу действия, но не добавляет к глаголу лишней конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным ритмом. Перечень инструментов сохранён, а неопределённость двух редких заимствованных названий вынесена в сноски. Формула «народы, племена и языки» передаёт трёхчастный имперский охват оригинала без искусственного буквального «народы, нации и языки».
