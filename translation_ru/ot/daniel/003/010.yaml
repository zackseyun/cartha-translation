id: DAN.3.10
reference: Daniel 3:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אנתה מַלְכָּ/א֮ שָׂ֣מְתָּ טְּעֵם֒ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִשְׁמַ֡ע קָ֣ל קַרְנָ֣/א מַ֠שְׁרֹקִיתָ/א קיתרס שַׂבְּכָ֤א פְסַנְתֵּרִין֙ ו/סיפניה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א יִפֵּ֥ל וְ/יִסְגֻּ֖ד לְ/צֶ֥לֶם דַּהֲבָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/010.yaml
  text: You[a], O king, have issued a decree that every man who hears the sound of the horn, pipe, lyre[b], trigon, psaltery, and bagpipe, and every kind of music, must fall down and worship the golden image.
translation:
  language: ru
  text: 'Ты, царь, издал указ: всякий человек, услышав звук рога, свирели, кифары, тригона, псалтири, волынки[a] и всякого рода музыки, должен пасть ниц и поклониться золотому истукану.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двойной свирели»; точное значение арамейского названия инструмента неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה מַלְכָּא
  choice: Ты, царь
  rationale: Независимое местоимение и обращение переданы прямо и естественно для современной русской речи; отдельное усиление «сам» контекстом не требуется.
- source_word: שָׂמְתָּ טְּעֵם
  choice: издал указ
  rationale: Арамейская идиома буквально означает «установил повеление»; русский юридико-административный оборот сохраняет её смысл и официальный тон.
- source_word: כָל אֱנָשׁ
  choice: всякий человек
  rationale: Сочетание имеет обобщающее значение. «Всякий человек» сохраняет единственное число и универсальный охват, не ограничивая указ только мужчинами.
- source_word: יִשְׁמַע קָל
  choice: услышав звук
  rationale: Передаёт буквальное «услышит звук» естественной русской конструкцией, связанной с последующим требованием указа.
- source_word: קַרְנָא
  choice: рог
  rationale: Общее обозначение духового инструмента; источник не уточняет, был ли это именно бараний рог.
- source_word: מַשְׁרֹקִיתָא
  choice: свирель
  rationale: Осторожное и понятное обозначение духового инструмента без чрезмерно точной идентификации.
- source_word: קיתרס
  choice: кифара
  rationale: Заимствованное название струнного инструмента, соответствующее арамейской форме и позволяющее отличить его от других инструментов списка.
- source_word: שַׂבְּכָא
  choice: тригон
  rationale: Сохраняет традиционную идентификацию треугольного струнного инструмента и не смешивает его с кифарой или псалтирью.
- source_word: פְסַנְתֵּרִין
  choice: псалтирь
  rationale: Устоявшееся русское название древнего струнного инструмента; здесь слово употреблено в значении инструмента, а не библейской книги.
- source_word: סִיפֹנְיָה
  choice: волынка
  rationale: Традиционное и возможное соответствие спорному названию инструмента; неопределённость отмечена в сноске.
- source_word: כֹל זְנֵי זְמָרָא
  choice: всевозможных музыкальных инструментов
  rationale: Буквально «всех видов музыки/музыкального исполнения»; в контексте перечня инструментов русская формулировка естественно выражает совокупность остальных их видов.
- source_word: יִפֵּל וְיִסְגֻּד
  choice: должен пасть ниц и поклониться
  rationale: Модальность указа выражена словом «должен», а два последовательных действия сохранены раздельно.
- source_word: צֶלֶם דַּהֲבָא
  choice: золотому истукану
  rationale: «Истукан» естественно обозначает культовое изображение и сохраняет отрицательно окрашенный религиозный контекст, не добавляя отдельного слова «идол».
theological_decisions:
- issue: Обобщающее значение כָל אֱנָשׁ
  choice: всякий человек
  alternative: всякий мужчина
  rationale: Форма единственного числа грамматически мужская, но в указе имеет родовое, универсальное значение. Русское «человек» передаёт это без необоснованного ограничения адресатов мужчинами.
- issue: Религиозная сила וְיִסְגֻּד
  choice: поклониться
  alternative: совершить поклон / воздать почести
  rationale: Действие направлено на золотое культовое изображение; «поклониться» сохраняет как телесный, так и религиозный смысл и не сводит действие к придворному почтению.
- issue: Различение יִפֵּל и וְיִסְגֻּד
  choice: пасть ниц и поклониться
  alternative: пасть ниц в поклонении
  rationale: Источник называет два координированных действия. Раздельная передача не устраняет смысловое напряжение между позой и актом поклонения.
translation_notes:
  register: Современный литературный русский язык с торжественно-официальным оттенком придворной речи. Перечень инструментов сохраняет историческую специфику, а синтаксис упрощён ровно настолько, чтобы стих был понятен обычному современному читателю.
