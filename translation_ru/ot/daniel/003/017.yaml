base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/017.yaml
  text: If it is so[a], our God whom we serve is able to deliver us from the furnace of blazing fire, and he will deliver us from your hand[c][b], O king.
translation:
  language: ru
  text: Если так[a], наш Бог, которому мы служим, может спасти нас из печи с пылающим огнём, и от твоей руки, царь, Он спасёт нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Если существует [такой случай]». Арамейское выражение идиоматично и отсылает к угрозе наказания, высказанной царём. Возможен также перевод: «Если наш Бог, которому мы служим, может спасти нас…»'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Он может спасти нас» или «пусть Он спасёт нас». Арамейскую форму можно понять по-разному; основной текст передаёт её как уверенное утверждение о будущем.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן אִיתַי
  choice: Если так
  rationale: Арамейское идиоматическое сочетание вводит условие и отсылает к объявленной царём угрозе; краткая русская формула естественна и сохраняет условный смысл.
- source_word: אֱלָהַנָא
  choice: наш Бог
  rationale: Прямая передача существительного с притяжательным суффиксом в естественном русском порядке слов.
- source_word: דִּי אֲנַחְנָא פָלְחִין
  choice: Которому мы служим
  rationale: Глагол פְּלַח обозначает служение, в данном контексте имеющее религиозный характер; «служим» сохраняет и прямое значение, и контекстный оттенок поклонения.
- source_word: יָכִל
  choice: может
  rationale: Передаёт способность Бога совершить избавление без избыточно книжной конструкции «в силах».
- source_word: לְשֵׁיזָבוּתַנָא
  choice: спасти нас
  rationale: Глагол означает избавление от непосредственной опасности; «спасти» естественно по-русски и позволяет повторить тот же корень при передаче последующего יְשֵׁיזִב.
- source_word: מִן אַתּוּן נוּרָא יָקִדְתָּא
  choice: из печи, пылающей огнём
  rationale: 'Переданы все три образных компонента: печь, огонь и горение; формулировка звучит естественно на современном русском языке.'
- source_word: וּמִן יְדָךְ
  choice: и от твоей руки
  rationale: Сохранена арамейская метафора руки как власти и контроля.
- source_word: מַלְכָּא
  choice: царь
  rationale: Форма обращения передана без архаизирующей частицы «о»; обращение ясно благодаря пунктуации.
- source_word: יְשֵׁיזִב
  choice: он спасёт нас
  rationale: Основной текст понимает имперфект как уверенное утверждение о будущем избавлении, одновременно отмечая возможные модальные прочтения в сноске.
theological_decisions:
- issue: Смысловая сила заключительного имперфекта יְשֵׁיזִב
  choice: 'уверенное утверждение: «он спасёт нас»'
  alternative: «он может спасти нас» или «пусть он спасёт нас»
  rationale: Контекст допускает уверенное исповедание Божьей способности и предстоящего избавления. При этом грамматическая форма может пониматься модально или как пожелание, поэтому неоднозначность не устраняется, а отмечается в сноске; богословское напряжение с последующим стихом сохраняется.
- issue: Условное начало הֵן אִיתַי
  choice: «Если так» — условие относится к объявленной царём угрозе
  alternative: 'более буквально: «Если существует [такой случай]»; возможно также синтаксическое сближение условия с утверждением о способности Бога'
  rationale: Идиоматическое прочтение лучше соответствует развитию речи, но буквальная конструкция допускает иную синтаксическую расстановку, что указано в сноске без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаизированным звучанием. Сохранены метафора «от твоей руки», повтор глагола «спасти» и прямое обращение «царь». Местоимение «он» написано со строчной буквы по общим нормам современной русской орфографии.
