source:
  edition: WLC
  text: אֱדַ֨יִן֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א תְּוַ֖הּ וְ/קָ֣ם בְּ/הִתְבְּהָלָ֑ה עָנֵ֨ה וְ/אָמַ֜ר לְ/הַדָּֽבְר֗וֹ/הִי הֲ/לָא֩ גֻבְרִ֨ין תְּלָתָ֜א רְמֵ֤ינָא לְ/גוֹא נוּרָ/א֙ מְכַפְּתִ֔ין עָנַ֤יִן וְ/אָמְרִין֙ לְ/מַלְכָּ֔/א יַצִּיבָ֖א מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/024.yaml
  text: Then King Nebuchadnezzar was astonished and rose up in haste[a]. He answered and said to his counselors, “Did we not throw three men, bound, into the midst of the fire?” They answered and said to the king, “Certainly[b], O king.”
translation:
  language: ru
  text: 'Тогда царь Навуходоносор изумился и поспешно встал. Он спросил своих советников[a]: «Разве не троих связанных мужчин бросили мы в самое пламя?» Они ответили царю: «Верно, царь!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих сановников»; арамейское слово обозначает людей, служивших при царском дворе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: תְּוַהּ
  choice: изумился
  rationale: Глагол обозначает сильное потрясение или изумление от увиденного; контекст подчёркивает неожиданность.
- source_word: בְּהִתְבְּהָלָה
  choice: поспешно
  rationale: Слово передаёт поспешность, вызванную волнением; наречие естественно сочетается с «встал».
- source_word: עָנֵה וְאָמַר
  choice: спросил
  rationale: Устойчивая семитская формула буквально означает «ответил и сказал», но здесь вводит вопрос; «спросил» передаёт её функцию естественным современным русским языком.
- source_word: לְהַדָּבְרוֹהִי
  choice: своих советников
  rationale: Термин обозначает придворных сановников или советников царя; точный статус не вполне определён, поэтому альтернатива отмечена в сноске.
- source_word: הֲלָא
  choice: Разве не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ.
- source_word: גֻבְרִין תְּלָתָא
  choice: троих мужчин
  rationale: Прямо передаёт число и обозначение взрослых лиц мужского пола.
- source_word: רְמֵינָא
  choice: бросили мы
  rationale: Форма первого лица множественного числа означает «мы бросили»; порядок слов сохраняет естественную выразительность риторического вопроса.
- source_word: לְגוֹא נוּרָא
  choice: в самое пламя
  rationale: Выражение буквально указывает на внутренность, середину огня. «В самое пламя» сохраняет пространственное усиление и звучит естественно по-русски.
- source_word: מְכַפְּתִין
  choice: связанных
  rationale: Причастие описывает состояние мужчин в момент, когда их бросили в огонь.
- source_word: עָנַיִן וְאָמְרִין
  choice: Они ответили
  rationale: Семитская формула «ответили и сказали» функционально и естественно передаётся одним глаголом.
- source_word: יַצִּיבָא
  choice: Верно
  rationale: Утвердительное слово означает «истинно, верно» и здесь подтверждает слова царя.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Семитские речевые формулы переданы функционально, чтобы избежать неестественного «ответил и сказал». Пространственная сила выражения לְגוֹא נוּרָא сохранена оборотом «в самое пламя». Обращение «царь» оставлено без частицы «о», которая в современном русском звучала бы архаично.
