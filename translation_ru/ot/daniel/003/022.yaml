base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/022.yaml
  text: Because of this, since the king’s command was harsh and the furnace had been heated exceedingly, the flame of the fire killed those men who brought up Shadrach, Meshach, and Abed-nego.
translation:
  language: ru
  text: Поэтому, так как царское повеление было суровым, а печь раскалена чрезвычайно сильно, пламя огня убило тех людей, которые подняли Седраха, Мисаха и Авденаго.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: И поскольку
  rationale: Арамейское причинно-следственное выражение связывает гибель исполнителей с суровостью приказа и чрезмерным жаром печи; по-русски связь естественно передаётся союзом «поскольку» после соединительного «и».
- source_word: מִלַּת מַלְכָּא מַחְצְפָה
  choice: царское повеление было суровым
  rationale: מִלָּה здесь означает приказ или повеление, а מַחְצְפָה — неотступно суровое, жёсткое требование; «суровым» сохраняет смысл без необоснованного сведения к одной лишь срочности.
- source_word: אַתּוּנָא אֵזֵה יַתִּירָא
  choice: печь раскалили чрезвычайно сильно
  rationale: Форма אֵזֵה выражает сильное нагревание печи, а יַתִּירָא — чрезвычайную степень; активная русская конструкция естественна в контексте ранее отданного приказа.
- source_word: דִּי הַסִּקוּ
  choice: которые подняли туда
  rationale: Глагол סלק буквально обозначает движение вверх или поднесение; «подняли туда» сохраняет пространственный оттенок, не добавляя отсутствующего в тексте указания на бросание.
- source_word: שְׁבִיבָא דִּי נוּרָא
  choice: пламя огня
  rationale: Сочетание обозначает вспышку или язык огня; традиционно ясное «пламя огня» близко к форме оригинала и подчёркивает непосредственную причину смерти.
