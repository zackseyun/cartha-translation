revisions:
- from: 'Навуходоносор спросил их: «Правда ли[a], Седрах, Мисах и Авденаго, что вы не служите моему богу и не поклоняетесь золотому истукану, которого я воздвиг?»'
  to: 'Навуходоносор сказал им: «Правда ли[a], Седрах, Мисах и Авденаго, что вы не служите моему богу и не падаете ниц перед золотым изваянием, которое я воздвиг?»'
  rationale: Правка уточняет физический смысл арамейского глагола «падать ниц» и заменяет архаичное, потенциально оценочное «истукан» на нейтральное «изваяние». Вводная формула упрощена до естественного русского «сказал им» без изменения смысла последующего вопроса. Сноска сохраняет спорную лексическую альтернативу הַצְדָּא.
