id: DAN.3.14
reference: Daniel 3:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עָנֵ֤ה נְבֻֽכַדְנֶצַּר֙ וְ/אָמַ֣ר לְ/ה֔וֹן הַ/צְדָּ֕א שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לֵֽ/אלָהַ֗/י לָ֤א אִֽיתֵי/כוֹן֙ פָּֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימֶת לָ֥א סָֽגְדִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/014.yaml
  text: Nebuchadnezzar answered and said to them[a], “Is it true, Shadrach, Meshach, and Abed-nego, that you do not serve my god and do not bow down to the golden image that I have set up?”
translation:
  language: ru
  text: 'Навуходоносор сказал им: «Правда ли[a], Седрах, Мисах и Авденаго, что вы не служите моему богу и не падаете ниц перед золотым изваянием, которое я воздвиг?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Арамейское слово הַצְדָּא может также означать «намеренно» или «нарочно»: «Намеренно ли вы, Седрах, Мисах и Авденаго, не служите моему богу…?»'
    reason: Лексическая неоднозначность между истинностью сообщения и намеренностью поступка.
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: спросил
  rationale: Арамейская повествовательная формула буквально означает «ответил и сказал», но здесь вводит обращённый к обвиняемым вопрос; «спросил» естественно передаёт её функцию в современном русском языке.
- source_word: לְהוֹן
  choice: их
  rationale: Местоимение третьего лица множественного числа относится ко всем троим и естественно оформляется как дополнение при глаголе «спросил».
- source_word: הַצְדָּא
  choice: Правда ли
  rationale: В данном контексте слово может указывать как на истинность донесения, так и на намеренность поступка. Основной текст передаёт наиболее непосредственный вопрос о достоверности обвинения, а иной смысл сохранён в сноске.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Седрах, Мисах и Авденаго
  rationale: Использованы устойчивые русские библейские формы имён, хорошо узнаваемые читателями.
- source_word: לֵאלָהַי
  choice: моему богу
  rationale: Форма в данном предложении — единственное число с местоименным суффиксом первого лица; перевод сохраняет морфологию источника без замены множественным числом.
- source_word: פָּלְחִין
  choice: служите
  rationale: Глагол обозначает служение, в том числе культовое. «Служите» сохраняет отличие от следующего глагола, описывающего поклон.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: золотому истукану
  rationale: «Истукан» ясно обозначает воздвигнутое культовое изображение и естественно звучит в русском библейском повествовании; определение «золотому» передаёт арамейскую конструкцию.
- source_word: דִּי הֲקֵימֶת
  choice: которого я воздвиг
  rationale: Глагол обозначает установление или возведение изображения; «воздвиг» кратко и точно описывает завершённое действие царя.
- source_word: סָגְדִין
  choice: поклоняетесь
  rationale: Глагол обозначает поклон, простирание ниц в знак почитания. Этот вариант сохраняет отдельное от «служите» действие и естественен по-русски.
theological_decisions:
- issue: Сохранять ли два разных обозначения идолопоклоннических действий
  choice: Переданы раздельно как «служите» и «поклоняетесь»
  alternative: Объединить оба действия общим понятием «поклоняться» или «почитать»
  rationale: 'Арамейский текст употребляет разные глаголы: один обозначает культовое служение, другой — поклон или простирание. Различие сохранено без сведения их к одной богословской категории.'
- issue: Значение הַצְדָּא
  choice: 'В основном тексте: «Правда ли»'
  alternative: «Намеренно ли» или «нарочно ли»
  rationale: Контекст допускает как вопрос о достоверности обвинения, так и вопрос о сознательном неповиновении. Первый смысл выбран для основного текста, второй указан в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для прямой речи; традиционные формы имён сохранены ради узнаваемости. Маркер сноски помещён непосредственно после неоднозначного выражения.
