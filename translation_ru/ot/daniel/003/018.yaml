base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/018.yaml
  text: But if not[a], let it be known to you, O king, that we will not serve your gods, and we will not bow down to the golden image that you have set up.
translation:
  language: ru
  text: 'Но если нет[a], знай, царь: мы не будем служить твоим богам и не поклонимся золотому изваянию, которое ты поставил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но даже если нет»; согласно предыдущему стиху подразумевается: «даже если Он не избавит нас».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵן לָא
  choice: Но если нет
  rationale: Сохраняет краткую арамейскую условную конструкцию и её эллиптичность; подразумеваемое «если Он не избавит нас» ясно из предыдущего стиха, но здесь прямо не выражено.
- source_word: יְדִיעַ לֶהֱוֵא לָךְ
  choice: то знай
  rationale: Естественно передаёт формулу «да будет тебе известно» на современном русском, сохраняя решительный декларативный тон.
- source_word: מַלְכָּא
  choice: царь
  rationale: Передаёт звательную функцию существительного без архаического звательного оформления.
- source_word: לֵאלָהָיִךְ ... פָלְחִין
  choice: не будем служить твоим богам
  rationale: Глагол обозначает служение божествам; форма с причастием в данном контексте выражает твёрдый отказ, направленный в настоящее и будущее.
- source_word: צֶלֶם דַּהֲבָא
  choice: золотому истукану
  rationale: «Истукан» естественно обозначает культовое изваяние и не сводит выражение к нейтральному изображению; прилагательное передаёт материал конструкции «из золота».
- source_word: הֲקֵימְתָּ
  choice: которого ты поставил
  rationale: Передаёт завершённое действие царя и естественно сочетается в русском с обозначением изваяния.
- source_word: נִסְגֻּד
  choice: не поклонимся
  rationale: Сохраняет конкретный смысл физического поклонения или простирания, не заменяя его более общим и интерпретирующим «не будем поклоняться».
theological_decisions:
- issue: Передача начального условного оборота
  choice: Но если нет
  alternative: Но даже если Он не избавит нас
  rationale: В самом стихе объект условия не назван; он восстанавливается из предыдущего контекста. Краткая формулировка сохраняет подлинную эллиптичность и напряжение текста, а примечание поясняет возможный смысл.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаичным тоном. Формула «то знай, царь» звучит естественно и решительно; «истукан» подчёркивает культовый характер золотого изваяния.
