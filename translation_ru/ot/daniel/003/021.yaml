base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/021.yaml
  text: Then these men were bound in their trousers[a], their tunics, their cloaks, and their other garments[b], and they were thrown into the midst of the blazing furnace.
translation:
  language: ru
  text: Тогда этих людей связали — в шароварах, туниках[a], плащах и прочей одежде — и бросили в самую середину пылающей печи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «головных уборах»; арамейское слово встречается редко, и его точное значение неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «печи горящего огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: этих людей
  rationale: Существительное с указательным местоимением отсылает к трём уже упомянутым иудеям.
- source_word: כְּפִתוּ
  choice: связали
  rationale: Форма описывает, что людей связали перед казнью; русская неопределённо-личная конструкция естественно удерживает внимание на пострадавших.
- source_word: סַרְבָּלֵיהוֹן
  choice: в шароварах
  rationale: Персидское заимствование, вероятнее всего, обозначает одежду для нижней части тела; «шаровары» уместны для древней одежды и точнее, чем общее «одежды».
- source_word: פטישיהון
  choice: туниках
  rationale: Редкое слово с не вполне ясным значением обозначает один из предметов одежды; «туники» — осторожный и понятный вариант, а возможность головного убора отмечена в сноске.
- source_word: כַרְבְּלָתְהוֹן
  choice: плащах
  rationale: Слово обозначает верхнюю одежду или накидку; «плащи» ясно отличают её от остальных перечисленных предметов.
- source_word: לְבֻשֵׁיהוֹן
  choice: прочей одежде
  rationale: Общее обозначение одежды после перечня конкретных предметов имеет итоговый характер; «прочей» делает эту функцию явной.
- source_word: וּרְמִיו
  choice: и бросили
  rationale: Неопределённо-личная русская конструкция естественно передаёт действие исполнителей, не названных в стихе, и сохраняет фокус на трёх людях.
- source_word: לְגוֹא
  choice: в самую середину
  rationale: Слово обозначает внутренность или середину; перевод сохраняет выразительность пространственного образа.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: пылающей печи
  rationale: Нагромождение слов «печь», «огонь» и «горящий» естественно передано по-русски как «пылающая печь», а буквальная структура отмечена в сноске.
