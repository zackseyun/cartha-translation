  source_fidelity: 'Перевод точно передаёт последовательность и синтаксическую перспективу арамейского текста: этих людей связывают, не снимая перечисленной одежды, и бросают внутрь раскалённой печи. «Тогда», «этих людей», «связали» и «бросили» адекватно отражают повествовательный маркер, указательное выражение и пассивные по смыслу формы. «В самую середину» приемлемо передаёт לְגוֹא («внутрь, в середину»), не меняя события.'
