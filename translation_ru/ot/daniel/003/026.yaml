source:
  edition: WLC
  text: בֵּ/אדַ֜יִן קְרֵ֣ב נְבוּכַדְנֶצַּ֗ר לִ/תְרַע֮ אַתּ֣וּן נוּרָ֣/א יָקִֽדְתָּ/א֒ עָנֵ֣ה וְ/אָמַ֗ר שַׁדְרַ֨ךְ מֵישַׁ֧ךְ וַ/עֲבֵד נְג֛וֹ עַבְד֛וֹ/הִי דִּֽי אֱלָהָ֥/א עלי/א פֻּ֣קוּ וֶ/אֱת֑וֹ בֵּ/אדַ֣יִן נָֽפְקִ֗ין שַׁדְרַ֥ךְ מֵישַׁ֛ךְ וַ/עֲבֵ֥ד נְג֖וֹ מִן גּ֥וֹא נוּרָֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/026.yaml
  text: Then Nebuchadnezzar came near to the door of the blazing fiery furnace[a]. He answered and said, “Shadrach, Meshach, and Abed-nego, servants of the Most High God, come out and come here.” Then Shadrach, Meshach[b], and Abed-nego came out from the midst of the fire.
translation:
  language: ru
  text: 'Тогда Навуходоносор подошёл ко входу в пылающую огненную печь[a] и сказал: «Седрах, Мисах и Авденаго, слуги Бога Всевышнего! Выйдите и подойдите сюда!» Тогда Седрах, Мисах и Авденаго вышли из огня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к отверстию пылающей огненной печи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: קְרֵב
  choice: подошёл
  rationale: Глагол обозначает физическое приближение; «подошёл» естественно и точно описывает движение царя ко входу печи.
- source_word: לִתְרַע
  choice: ко входу
  rationale: Существительное может означать ворота, дверь или вход. Для печи наиболее естественно «вход»; альтернативное «отверстие» отмечено в сноске.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: пылающую огненную печь
  rationale: Передаёт сочетание слов «печь», «огонь» и определения со значением «горящая, пылающая», сохраняя усиленное описание.
- source_word: עָנֵה וְאָמַר
  choice: и сказал
  rationale: Устойчивая семитская речевая формула буквально означает «ответил и сказал», но в данном русском контексте естественно передаётся одним глаголом «сказал», поскольку явного собеседника в предшествующей реплике нет.
- source_word: עַבְדֹוהִי
  choice: слуги
  rationale: Слово допускает значения «слуги» и «рабы»; здесь речь о принадлежности Богу и служении Ему, поэтому «слуги» уместно в почтительном контексте.
- source_word: אֱלָהָא עליא
  choice: Бога Всевышнего
  rationale: Передаёт признанный божественный титул естественным для русского библейского стиля сочетанием без дополнительного богословского истолкования.
- source_word: פֻּקוּ
  choice: Выйдите
  rationale: Повелительная форма означает выход из внутреннего пространства; русское «выйдите» точно передаёт направление движения.
- source_word: וֶאֱתוֹ
  choice: подойдите сюда
  rationale: Второе повеление указывает на движение к говорящему после выхода; «подойдите сюда» делает эту направленность ясной.
- source_word: נָפְקִין
  choice: вышли
  rationale: Повествовательная форма соответствует повелению выйти и естественно передаётся русским «вышли».
- source_word: מִן גּוֹא נוּרָא
  choice: из огня
  rationale: Буквально выражение указывает на выход «изнутри огня». Краткое «из огня» естественно по-русски и сохраняет основной пространственный смысл.
theological_decisions:
- issue: Передача божественного титула אֱלָהָא עליא
  choice: Бога Всевышнего
  alternative: Всевышнего Бога
  rationale: Оба порядка слов возможны. «Бога Всевышнего» звучит естественно в прямом обращении и сохраняет титульный характер выражения и признание Божьего верховенства, не добавляя позднейшего доктринального содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имена переданы в укоренившейся русской библейской форме. Семитская формула речи сглажена ради естественности, тогда как повтор «пылающая огненная печь» сохранён как намеренно усиленное описание источника.
