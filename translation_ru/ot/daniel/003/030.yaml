lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер обозначает следствие предшествующих событий и последовательность действий; «тогда» естественно звучит по-русски.
- source_word: מַלְכָּא
  choice: царь
  rationale: Слово в определённом состоянии означает «царь». Из контекста ясно, что речь о Навуходоносоре, но в данном стихе имя не повторяется.
- source_word: הַצְלַח
  choice: даровал ... успех
  rationale: Каузативная форма указывает, что царь обеспечил им успех или преуспевание. Такая передача сохраняет широту значения и не сводит действие исключительно к повышению в должности.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Седраху, Мисаху и Авденаго
  rationale: Использованы устоявшиеся русские библейские формы личных имён; падежные формы соответствуют синтаксису русского предложения.
- source_word: בִּמְדִינַת בָּבֶל
  choice: в области Вавилонской
  rationale: מְדִינָה обозначает административную область или провинцию. Формулировка «область Вавилонская» ясна, литературна и сохраняет административный смысл.
