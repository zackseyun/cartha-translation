  text: Then Nebuchadnezzar, in rage and fury, commanded that Shadrach, Meshach, and Abed-nego be brought in. Then these men were brought before the king.
translation:
  language: ru
  text: Тогда Навуходоносор в ярости и гневе приказал привести Седраха, Мисаха и Авденаго. Тогда этих людей привели перед царём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: בִּרְגַז וַחֲמָה
  choice: в ярости и гневе
  rationale: Два близких по значению существительных усиливают описание состояния царя; сочетание сохраняет риторическое удвоение и звучит естественно по-русски.
- source_word: אֲמַר לְהַיְתָיָה
  choice: приказал привести
  rationale: Сочетание глагола «сказать» с каузативным инфинитивом имеет силу приказа; русский перевод ясно передаёт распоряжение доставить названных людей.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Седраха, Мисаха и Авденаго
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, узнаваемые современным читателем.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: этих людей
  rationale: Указательное выражение непосредственно отсылает к трём только что названным мужчинам.
- source_word: הֵיתָיוּ קֳדָם מַלְכָּא
  choice: привели к царю
  rationale: Форма глагола в контексте передаёт каузативно-пассивное доставление, а קֳדָם обозначает прибытие в присутствие царя; по-русски это естественно выражается оборотом «привели к царю».
