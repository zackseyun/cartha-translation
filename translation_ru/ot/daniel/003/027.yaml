  text: וּ֠/מִֽתְכַּנְּשִׁין אֲחַשְׁדַּרְפְּנַיָּ֞/א סִגְנַיָּ֣/א וּ/פַחֲוָתָ/א֮ וְ/הַדָּבְרֵ֣י מַלְכָּ/א֒ חָזַ֣יִן לְ/גֻבְרַיָּ֣/א אִלֵּ֡ךְ דִּי֩ לָֽא שְׁלֵ֨ט נוּרָ֜/א בְּ/גֶשְׁמְ/ה֗וֹן וּ/שְׂעַ֤ר רֵֽאשְׁ/הוֹן֙ לָ֣א הִתְחָרַ֔ךְ וְ/סָרְבָּלֵי/ה֖וֹן לָ֣א שְׁנ֑וֹ וְ/רֵ֣יחַ נ֔וּר לָ֥א עֲדָ֖ת בְּ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/027.yaml
  text: And the satraps[a], the prefects, the governors, and the king’s counselors gathered together and saw concerning these men that the fire had no power over their bodies, and the hair of their heads was not singed, and their cloaks were not changed, and no smell of fire had come upon them.
translation:
  language: ru
  text: 'Сатрапы, наместники, правители и царские советники собрались и увидели, что огонь не имел власти над телами этих людей: волосы на их головах не были опалены, их одежды[a] не изменились, и запаха огня от них не было.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верхние одежды»; точное значение арамейского названия этого предмета одежды неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתְכַּנְּשִׁין
  choice: собрались
  rationale: Причастная арамейская форма от כנס обозначает совместное собирание; в русском повествовании естественно передаётся личной формой прошедшего времени.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапы
  rationale: Персидский административный термин; историческое название должности точнее общего обозначения чиновников.
- source_word: סִגְנַיָּא
  choice: наместники
  rationale: Термин обозначает высокопоставленных администраторов; «наместники» сохраняет различие между перечисленными должностями и понятно современному читателю.
- source_word: פַחֲוָתָא
  choice: правители
  rationale: Передаёт название областных правителей, не перегружая ряд повтором слова «наместники».
- source_word: הַדָּבְרֵי מַלְכָּא
  choice: царские советники
  rationale: В придворном контексте выражение обозначает царских должностных лиц или советников; перевод не приписывает им более узкой функции.
- source_word: חָזַיִן לְגֻבְרַיָּא אִלֵּךְ דִּי
  choice: увидели, что ... над телами этих людей
  rationale: Конструкция с לְ указывает на предмет наблюдения. Русская конструкция «увидели, что» естественно передаёт свидетельское наблюдение, а референт «эти люди» сохраняется внутри придаточного.
- source_word: לָא שְׁלֵט נוּרָא בְּגֶשְׁמְהוֹן
  choice: огонь не имел власти над телами этих людей
  rationale: שׁלט означает власть или господство; формулировка сохраняет более сильный образ, чем простое «не повредил».
- source_word: וּשְׂעַר רֵאשְׁהוֹן לָא הִתְחָרַךְ
  choice: волосы на их головах не были опалены
  rationale: Глагол точно описывает опаление волос; русская форма естественна и сохраняет подчеркнутую полноту избавления.
- source_word: וְסָרְבָּלֵיהוֹן לָא שְׁנוֹ
  choice: их одежды не изменились
  rationale: Точное обозначение предмета одежды спорно, поэтому в основном тексте выбран нейтральный родовой термин; необычное утверждение «не изменились» сохраняет буквальный смысл арамейского.
- source_word: וְרֵיחַ נוּר לָא עֲדָת בְּהוֹן
  choice: даже запаха огня от них не было
  rationale: Идиоматический русский оборот передаёт отсутствие приставшего к ним запаха огня; «даже» выявляет кульминацию ряда, не меняя смысла.
theological_decisions:
- issue: Степень воздействия огня
  choice: огонь не имел власти над телами этих людей
  alternative: огонь не повредил их тел
  rationale: Источник использует язык власти (שׁלט), поэтому сохранён сильный образ полного бессилия огня, а не только отсутствие видимого ущерба.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Перечень должностей сохранён, но синтаксис сделан естественным для русского читателя; лексическая неопределённость названия одежды вынесена в сноску.
