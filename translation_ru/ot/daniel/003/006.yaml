  yaml_path: translation/ot/daniel/003/006.yaml
  text: And whoever does not fall down and worship shall in that hour be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: ru
  text: А кто не падёт ниц и не поклонится, тот в тот же час[a] будет брошен внутрь печи, пылающей огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в тот час»; этот арамейский оборот означает «немедленно», «тотчас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: А кто
  rationale: Неопределённо-относительный оборот вводит общее условие; краткая русская формула сохраняет его универсальный смысл.
- source_word: לָא יִפֵּל
  choice: не падёт ниц
  rationale: Глагол буквально означает «пасть», а в данном контексте описывает телесное действие почтительного простирания; «ниц» ясно передаёт позу.
- source_word: וְיִסְגֻּד
  choice: и не поклонится
  rationale: Глагол обозначает поклонение или почтительное простирание. «Поклонится» естественно передаёт действие перед истуканом, не устраняя возможного оттенка выражения почтения.
- source_word: בַּהּ שַׁעֲתָא
  choice: в тот же час
  rationale: Перевод близок к арамейской форме «в тот час» и по-русски выражает немедленное исполнение приговора; значение идиомы пояснено в сноске.
- source_word: יִתְרְמֵא
  choice: будет брошен
  rationale: Передаёт пассивную форму и звучит естественно в современном русском языке.
- source_word: לְגוֹא
  choice: внутрь
  rationale: Сохраняет указание на внутренность печи, не перегружая русскую фразу буквальным «в середину».
- source_word: אַתּוּן
  choice: печи
  rationale: В контексте повествования слово обозначает большую огненную печь, используемую как орудие казни.
- source_word: נוּרָא יָקִדְתָּא
  choice: пылающей огнём
  rationale: Сохраняет усиленный образ буквально «огонь горящий» и естественно согласуется в русском языке со словом «печь».
