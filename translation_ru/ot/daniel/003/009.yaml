base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/009.yaml
  text: They answered and said to King Nebuchadnezzar[a], “O king, live forever!”
translation:
  language: ru
  text: 'Они ответили царю Навуходоносору: «Царь, живи вовеки!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנוֹ וְאָמְרִין
  choice: Они ответили
  rationale: Арамейская формула буквально сочетает глаголы «отвечать» и «говорить». В современном русском языке одного глагола «ответили» достаточно для естественной передачи формульного введения речи без потери смысла.
- source_word: לִנְבוּכַדְנֶצַּר מַלְכָּא
  choice: царю Навуходоносору
  rationale: Предлог обозначает адресата, а первое מַלְכָּא является титулом Навуходоносора. Порядок «царю Навуходоносору» естественен для современного литературного русского языка.
- source_word: מַלְכָּא
  choice: Царь
  rationale: Второе употребление слова является прямым обращением. Русская форма без частицы «о» звучит современно, торжественно и сохраняет придворный характер обращения.
- source_word: לְעָלְמִין חֱיִי
  choice: живи вовеки
  rationale: Императив חֱיִי передаёт благопожелание, а לְעָלְמִין буквально означает «на века / вовеки». Формула «живи вовеки» точно и естественно передаёт придворное приветствие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной придворной окраской. Формульное «ответили и сказали» сокращено до естественного русского «ответили»; архаизирующая частица «о» при обращении не используется. «Вовеки» сохраняет возвышенность и множественное значение арамейского выражения.
