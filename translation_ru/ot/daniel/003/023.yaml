    text: 'Или, передавая смысл контекста: «были брошены внутрь пылающей огненной печи». Сам арамейский глагол означает «упали», хотя из контекста ясно, что их туда бросили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֻבְרַיָּא אִלֵּךְ תְּלָתֵּהוֹן
  choice: эти трое мужчин
  rationale: Передаёт указательное местоимение, число и обозначение мужчин естественным современным русским выражением.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Седрах, Мисах и Авденаго
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, хорошо узнаваемые читателями.
- source_word: נְפַלוּ
  choice: упали
  rationale: Арамейский глагол прямо означает «упали». Контекст сообщает, что мужчин бросили в печь, однако это не подменяет форму данного стиха пассивом «были брошены».
- source_word: לְגוֹא
  choice: в самое
  rationale: Выражает направленность внутрь, в середину; по-русски «в самое ... горнило» естественно сохраняет пространственную выразительность.
- source_word: אַתּוּן
  choice: горнило
  rationale: В данном повествовании речь идёт о большой огненной печи. «Горнило» — точное, узнаваемое и стилистически достойное русское соответствие.
- source_word: נוּרָא יָקִדְתָּא
  choice: пылающее огнём
  rationale: Сохраняет оба элемента арамейского выражения — «огонь» и «горящий/пылающий» — без неестественной русской тавтологии.
- source_word: מְכַפְּתִין
  choice: связанными
  rationale: Пассивное причастие означает, что они были связаны; творительный предикативный естественно сочетается в русском с глаголом «упали».
