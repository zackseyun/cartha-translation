  yaml_path: translation/ot/daniel/003/023.yaml
  text: And these three men—Shadrach[a], Meshach[b], and Abed-nego—fell bound into the midst of the blazing furnace.
translation:
  language: ru
  text: И эти трое мужчин — Седрах, Мисах и Авденаго — упали связанными внутрь пылающей огненной печи.[a]
  philosophy: optimal-equivalence
  footnotes:
