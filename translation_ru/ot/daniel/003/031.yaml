base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/031.yaml
  text: 'King Nebuchadnezzar[a], to all peoples, nations[b], and languages that dwell in all the earth: May your peace abound.'
translation:
  language: ru
  text: 'Царь Навуходоносор — всем народам, племенам и людям всех языков, живущим по всей земле[a]: да умножится ваш мир[b]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «по всей земле» — традиционная формула имперского воззвания; по смыслу оно может означать «по всему царству».
    reason: cultural_note
  - marker: b
    text: 'Или: «Да умножится ваше благополучие!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: Царь
  rationale: 'Существительное стоит при имени как царский титул; по-русски естественно поставить его перед именем: «царь Навуходоносор».'
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: всем народам, племенам и людям разных языков
  rationale: Имперская триада охватывает разные этнические и языковые группы. Передача третьего элемента через «людей разных языков» яснее современному читателю, чем буквальное «языкам».
- source_word: דִּי דארין
  choice: живущим
  rationale: Причастная конструкция естественно и точно передаётся русским причастием, сохраняя стиль официального воззвания.
- source_word: בְּכָל אַרְעָא
  choice: по всей земле
  rationale: אַרְעָא допускает значения «земля» и «страна»; формула царского указа риторически расширяет охват, поэтому основной текст сохраняет «по всей земле», а примечание поясняет имперский характер выражения.
- source_word: שְׁלָמְכוֹן
  choice: у вас мир
  rationale: Шְׁלָם означает мир, благополучие и целостность. «Мир» сохраняет семитскую формулу приветствия, а оборот «у вас» естественнее буквального «ваш мир» с глаголом «умножиться».
- source_word: יִשְׂגֵּא
  choice: да умножится
  rationale: Глагол означает «возрасти, умножиться». Оптативная конструкция с «да» передаёт пожелание торжественно и естественно.
