  text: כְּעַ֞ן הֵ֧ן אִֽיתֵי/כ֣וֹן עֲתִידִ֗ין דִּ֣י בְ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַשְׁרוֹקִיתָ֣/א קיתרס שַׂבְּכָ֡א פְּסַנְתֵּרִין֩ וְ/סוּמְפֹּ֨נְיָ֜ה וְ/כֹ֣ל זְנֵ֣י זְמָרָ֗/א תִּפְּל֣וּן וְ/תִסְגְּדוּן֮ לְ/צַלְמָ֣/א דִֽי עַבְדֵת֒ וְ/הֵן֙ לָ֣א תִסְגְּד֔וּן בַּ/הּ שַׁעֲתָ֣/ה תִתְרְמ֔וֹן לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּ֑/א וּ/מַן ה֣וּא אֱלָ֔הּ דֵּ֥י יְשֵֽׁיזְבִנְ/כ֖וֹן מִן יְדָֽ/י־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/015.yaml
  text: Now if you are ready[a], when you hear the sound of the horn, pipe, lyre, trigon, harp, and bagpipe, and every kind of music, to fall down and worship the image that I have made, well and good. But if you do not worship, in that very hour you will be thrown into the midst of a blazing furnace of fire[d][c][b]. And who is the god who will deliver you out of my hands?
translation:
  language: ru
  text: Итак, если вы готовы, то, когда услышите звуки рога, свирели, лиры, тригона[a], арфы[b], волынки[c] и всякого рода музыки, падите ниц и поклонитесь изваянию, которое я сделал, — тогда хорошо[d]. Но если не поклонитесь, в тот же час вас бросят в самую середину пылающей огненной печи. И кто тот бог, который спасёт вас из моих рук?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «треугольной арфы»; точный вид инструмента, обозначенного словом שַׂבְּכָא, неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный вариант: «псалтири» (פְּסַנְתֵּרִין).'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «двойной свирели»; точное значение סוּמְפֹּנְיָה остаётся спорным. Передача «симфония» отражает лишь форму древнего слова и не означает современный оркестр.'
    reason: lexical_alternative
  - marker: d
    text: 'После слов «которое я сделал» арамейская фраза обрывается; слова «тогда хорошо» восполняют подразумеваемый смысл: если они подчинятся, наказания не последует.'
    reason: source_ellipsis
lexical_decisions:
- source_word: כְּעַן
  choice: Итак
  rationale: Дискурсивное наречие вводит возобновлённый царём вызов; «итак» естественно передаёт переход и непосредственную риторическую силу.
- source_word: אִיתֵיכון עֲתִידִין
  choice: если вы готовы
  rationale: Арамейское сочетание выражает готовность к немедленному действию; краткая русская формулировка сохраняет условный смысл.
- source_word: בְעִדָּנָא דִּי תִשְׁמְעוּן
  choice: как только услышите
  rationale: Оборот обозначает момент, в который должно последовать действие; «как только» естественно передаёт требование немедленной реакции.
- source_word: קַרְנָא מַשְׁרוֹקִיתָא קיתרס
  choice: рога, свирели, лиры
  rationale: Выбраны понятные современные названия, не уточняющие без достаточных оснований точную конструкцию древних инструментов.
- source_word: שַׂבְּכָא
  choice: тригона
  rationale: Точная идентификация инструмента неясна; заимствованный термин сохраняет вероятное название, а возможное значение поясняется в сноске.
- source_word: פְּסַנְתֵּרִין
  choice: арфы
  rationale: Доступное обозначение струнного инструмента; традиционный вариант «псалтирь» сохранён в сноске.
- source_word: סוּמְפֹּנְיָה
  choice: волынки
  rationale: Распространённая современная идентификация, однако спорность значения прямо отмечена в сноске.
- source_word: כֹל זְנֵי זְמָרָא
  choice: всевозможных музыкальных инструментов
  rationale: В контексте перечня выражение охватывает все прочие виды музыкального звучания или инструментов; русский вариант сохраняет эту широту и согласуется с синтаксисом списка.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: раскалённую огненную печь
  rationale: Формулировка сохраняет оба образа исходного текста — огонь и пылающий жар — в естественном русском выражении.
- source_word: וּמַן הוּא אֱלָהּ
  choice: И какой бог
  rationale: Передаёт вызывающий общий вопрос царя без отождествления с Богом Израиля и естественно звучит по-русски.
theological_decisions:
- issue: Передача סגד в контексте идолопоклонства
  choice: поклонитесь
  alternative: совершите поклон / почтите
  rationale: Глагол здесь обозначает религиозное поклонение изваянию; телесная поза отдельно передана словами «падите ниц».
- issue: Передача אֱלָהּ в вызывающем вопросе Навуходоносора
  choice: бог со строчной буквы
  alternative: Бог с прописной буквы
  rationale: Царь говорит неопределённо и вызывающе о любом божестве, способном спасти пленников, а не исповедует Бога Израиля.
- issue: Эллиптическое условие после слов об изваянии
  choice: — тогда хорошо
  alternative: оставить условную конструкцию незавершённой
  rationale: В арамейском положительная аподосис подразумевается. Краткое дополнение делает русское предложение грамматически цельным, а факт дополнения раскрыт в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным тоном. Перечень инструментов сохранён без искусственной архаизации; редкий термин «тригон» сопровождается пояснением. Угроза царя передана резко и непосредственно.
