base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/003.yaml
  text: Then the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces were assembled for the dedication of the image that King Nebuchadnezzar had set up, and they stood before the image that Nebuchadnezzar had set up.
translation:
  language: ru
  text: Тогда сатрапы, наместники, правители, советники, казначеи, судьи, судебные чиновники и все чиновники областей собрались на посвящение изваяния[a], которое воздвиг царь Навуходоносор, и встали перед изваянием, которое воздвиг Навуходоносор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изображения», «статуи»; арамейское слово צַלְמָא может обозначать физическое изображение или монументальную фигуру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность.
- source_word: מִתְכַּנְּשִׁין
  choice: собрались
  rationale: Форма обозначает совместное собирание; русское возвратное прошедшее время естественно в повествовании.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапы
  rationale: Устоявшееся обозначение конкретной персидской административной должности.
- source_word: סִגְנַיָּא
  choice: наместники
  rationale: Передаёт административную должность и сохраняет отличие от прочих перечисленных чинов.
- source_word: פַחֲוָתָא
  choice: правители
  rationale: Понятное общее обозначение провинциальных руководителей, отличающее их от сатрапов и наместников.
- source_word: אֲדַרְגָּזְרַיָּא
  choice: советники
  rationale: Точное значение должности не вполне ясно; широкий эквивалент не создаёт ложной определённости.
- source_word: גְדָבְרַיָּא
  choice: казначеи
  rationale: Термин обычно понимается как обозначение служащих казначейства.
- source_word: דְּתָבְרַיָּא
  choice: судьи
  rationale: Вероятное обозначение должностных лиц с судебными функциями.
- source_word: תִּפְתָּיֵא
  choice: магистраты
  rationale: Передаёт ещё одну судебно-административную должность и отличает её от судей.
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: все чиновники областей
  rationale: Обобщающая формула для остальных носителей власти; «чиновники» понятно современному читателю.
- source_word: לַחֲנֻכַּת
  choice: на посвящение
  rationale: Обозначает официальную церемонию посвящения или торжественного введения.
- source_word: צַלְמָא
  choice: истукан
  rationale: В данном контексте речь идёт о воздвигнутом монументальном изображении; «истукан» сохраняет вещественный и культовый оттенок, а примечание отмечает более нейтральные варианты.
- source_word: הֲקֵים
  choice: воздвиг
  rationale: Передаёт установление крупного монументального объекта и сохраняет повтор исходного текста.
theological_decisions:
- issue: Характер צַלְמָא
  choice: истукан
  alternative: изваяние; статуя; образ
  rationale: Арамейское слово само по себе не определяет точный вид фигуры. Основной вариант соответствует культово-монументальному контексту, а сноска сохраняет лексическую широту.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Сохранены полный перечень должностей и риторический повтор «которого воздвиг Навуходоносор».
