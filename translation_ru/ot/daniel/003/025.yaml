  text: עָנֵ֣ה וְ/אָמַ֗ר הָֽא אֲנָ֨ה חָזֵ֜ה גֻּבְרִ֣ין אַרְבְּעָ֗ה שְׁרַ֨יִן֙ מַהְלְכִ֣ין בְּ/גֽוֹא נוּרָ֔/א וַ/חֲבָ֖ל לָא אִיתַ֣י בְּ/ה֑וֹן וְ/רֵוֵ/הּ֙ דִּ֣י רביעי/א דָּמֵ֖ה לְ/בַר אֱלָהִֽין־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/025.yaml
  text: He answered and said[a], “Look! I see four men unbound, walking in the midst of the fire, and there is no harm on them; and the appearance of the fourth is like a son of the gods.”
translation:
  language: ru
  text: 'Он сказал в ответ: «Вот, я вижу четырёх мужчин без пут: они ходят посреди огня, и им нет никакого вреда. А облик четвёртого подобен сыну богов[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному христианскому толкованию: «подобен Сыну Божьему». Более буквально арамейский текст говорит: «подобен сыну богов», передавая точку зрения самого Навуходоносора.'
    reason: Альтернативное традиционное прочтение и богословски значимая неоднозначность.
lexical_decisions:
- source_word: הָא
  choice: Вот
  rationale: Арамейское указательное восклицание вводит внезапное, подчёркнутое наблюдение; «вот» естественно звучит в современном русском и сохраняет непосредственность речи.
- source_word: חָזֵה
  choice: я вижу
  rationale: Форма передаёт непосредственное наблюдение царя в момент речи.
- source_word: גֻּבְרִין אַרְבְּעָה
  choice: четырёх мужчин
  rationale: Существительное обозначает здесь мужчин; перевод сохраняет конкретность исходного текста.
- source_word: שְׁרַיִן
  choice: без пут
  rationale: Слово указывает, что прежде связанные мужчины теперь освобождены от пут. Формулировка «без пут» ясна и избегает возможной двусмысленности русского «не связанных».
- source_word: מַהְלְכִין בְּגוֹא נוּרָא
  choice: они ходят посреди огня
  rationale: Причастная форма описывает продолжающееся действие, а בְּגוֹא передаёт нахождение внутри, в самой середине огня.
- source_word: וַחֲבָל לָא אִיתַי בְּהוֹן
  choice: и им нет никакого вреда
  rationale: Естественная русская формулировка сохраняет утверждение об отсутствии какого-либо повреждения.
- source_word: רֵוֵהּ דִּי רביעיא
  choice: облик четвёртого
  rationale: Речь идёт о видимом облике четвёртой фигуры, а не о её прямо установленной сущности.
- source_word: דָּמֵה
  choice: подобен
  rationale: Глагол выражает сходство, а не тождество; «подобен» сохраняет наблюдательный характер высказывания.
- source_word: לְבַר אֱלָהִין
  choice: сыну богов
  rationale: Буквальное сочетание «сын богов» наиболее естественно отражает слова Навуходоносора и его собственную религиозную перспективу, не внося в основной текст более позднего христианского отождествления.
theological_decisions:
- issue: Кем является четвёртая фигура в описании Навуходоносора
  choice: 'Передать слова царя с его собственной точки зрения: «подобен сыну богов».'
  alternative: «подобен Сыну Божьему»; либо обобщённо «подобен божественному существу».
  rationale: Арамейский текст сообщает впечатление Навуходоносора и не требует здесь прямого мессианского отождествления. В стихе 28 царь называет эту фигуру Божьим ангелом. Традиционное христианское прочтение сохранено в примечании, но не подменяет формулировку исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Синтаксис сделан ясным и естественным; образ пут, хождение посреди огня и сравнительный, а не отождествляющий характер последней фразы сохранены.
