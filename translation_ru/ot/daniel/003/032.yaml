lexical_decisions:
- source_word: אָתַיָּא וְתִמְהַיָּא
  choice: знамения и чудеса
  rationale: Устойчивая парная формула для необычайных Божьих деяний; «знамения» передаёт их смысловую значимость, а «чудеса» — вызывающий изумление характер.
- source_word: עֲבַד
  choice: совершил
  rationale: Естественно сочетается со «знамениями и чудесами» и передаёт арамейское «сделал, совершил» без лишнего истолкования.
- source_word: עִמִּי
  choice: для меня
  rationale: Буквально «со мной»; в контексте речь идёт о том, что Бог совершил по отношению к Навуходоносору. Основной текст передаёт вероятный благоприятный оттенок, а буквальная форма отмечена в сноске.
- source_word: אֱלָהָא עִלָּיָא
  choice: Всевышний Бог
  rationale: Передаёт возвышенный суперлативный титул Бога естественной и традиционно понятной русской формой.
- source_word: שְׁפַר קָדָמַי
  choice: я счёл благим
  rationale: Передаёт официальную формулу царского одобрения или решения, буквально связанную с тем, что нечто «хорошо передо мной».
- source_word: לְהַחֲוָיָה
  choice: возвестить
  rationale: Передаёт значение «объявить, сделать известным» и соответствует публичному, торжественному характеру царского обращения.
theological_decisions:
- issue: Передача титула אֱלָהָא עִלָּיָא
  choice: Всевышний Бог
  alternative: Бог Всевышний
  rationale: Оба порядка слов возможны; выбранный вариант естественен для современного русского языка и сохраняет прямой титул без внесения позднейших догматических формулировок.
- issue: Значение עִמִּי в описании Божьего действия
  choice: для меня
  alternative: со мной
  rationale: Контекст допускает отношение или действие, направленное на царя. «Для меня» естественно по-русски, но потенциальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством царского воззвания. Вынесение «знамений и чудес» в начало сохраняет актуальное членение арамейской фразы и позволяет избежать тяжеловесного безличного оборота.
