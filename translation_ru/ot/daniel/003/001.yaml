  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א עֲבַד֙ צְלֵ֣ם דִּֽי דְהַ֔ב רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֣ין שִׁ֑ת אֲקִימֵ/הּ֙ בְּ/בִקְעַ֣ת דּוּרָ֔א בִּ/מְדִינַ֖ת בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/001.yaml
  text: King Nebuchadnezzar made an image of gold[a], its height sixty cubits and its width six cubits. He set it up in the plain of Dura[b], in the province of Babylon.
translation:
  language: ru
  text: 'Царь Навуходоносор сделал изваяние из золота[a]: высотой в шестьдесят локтей[b] и шириной в шесть локтей. Он установил его на равнине Дура, в провинции Вавилона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «статую», «изображение». Арамейское слово само по себе не обязательно означает идола; культовая роль изваяния становится ясна из дальнейшего повествования.'
    reason: lexical_alternative
  - marker: b
    text: Локоть — древняя мера длины, приблизительно равная расстоянию от локтя до кончиков пальцев.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְכָּא
  choice: царь
  rationale: В сочетании с именем это титул; порядок «царь Навуходоносор» естественен для русского повествования.
- source_word: עֲבַד
  choice: сделал
  rationale: Прямо передаёт обычное значение глагола, не уточняя способ изготовления.
- source_word: צְלֵם
  choice: изваяние
  rationale: Слово обозначает изображение или статую. «Изваяние» естественно для крупного объёмного сооружения и не вводит заранее религиозную оценку, заключённую в слове «идол».
- source_word: דִּי דְהַב
  choice: золотое
  rationale: Естественная русская передача материала; сама формулировка не требует понимать изваяние как сделанное из сплошного золота, а не покрытое им.
- source_word: רוּמֵהּ / פְּתָיֵהּ
  choice: высотой / шириной
  rationale: Ясно и по-современному передаёт указанные размеры.
- source_word: אֲקִימֵהּ
  choice: установил его
  rationale: Передаёт возведение и размещение изваяния без излишне технического оттенка.
- source_word: בְּבִקְעַת
  choice: на равнине
  rationale: Существительное обозначает широкую равнину или равнинную долину; предлог «на» естественен в русском с названием открытой местности.
- source_word: דּוּרָא
  choice: Деир
  rationale: Традиционная русская библейская форма географического названия Дура.
- source_word: בִּמְדִינַת בָּבֶל
  choice: в области Вавилонской
  rationale: מְדִינָה означает административную область или провинцию; формулировка сохраняет различие между местностью Деир и более крупной областью Вавилона.
theological_decisions:
- issue: Следует ли передавать צְלֵם словом с явно религиозной оценкой
  choice: изваяние
  alternative: идол; статуя; изображение
  rationale: В этом стихе предмет описан по материалу, размерам и месту, но ещё не назван объектом поклонения. Нейтральное «изваяние» позволяет последующему контексту раскрыть его культовую функцию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и ясным; сохранены нейтральность исходного обозначения изваяния и административно-географическая структура фразы.
