base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/020.yaml
  text: And he commanded certain mighty men of valor who were in his army to bind Shadrach[a], Meshach, and Abednego, to throw them into the blazing furnace of fire.
translation:
  language: ru
  text: И он приказал нескольким сильным воинам из своего войска связать Седраха, Мисаха и Авденаго и бросить их в пылающую огнём печь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְגֻבְרִין גִּבָּרֵי חַיִל
  choice: нескольким сильным воинам
  rationale: Сочетание обозначает могучих, способных воинов; «сильным воинам» естественно передаёт и физическую силу, и военный контекст, а неопределённое «нескольким» отражает отсутствие определённости у существительного.
- source_word: דִּי בְחַיְלֵהּ
  choice: из своего войска
  rationale: חיל здесь означает военную силу, то есть войско царя. Русское «из своего войска» естественно выражает принадлежность этих воинов к его армии.
- source_word: אֲמַר
  choice: приказал
  rationale: Хотя глагол буквально может означать «сказал», последующие инфинитивы выражают распоряжение, поэтому в контексте уместно «приказал».
- source_word: לְכַפָּתָה
  choice: связать
  rationale: Глагол означает связать или скрутить; «связать» точно и естественно для повествования.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Седраха, Мисаха и Авденаго
  rationale: Использованы закрепившиеся в русской библейской традиции формы этих личных имён, понятные русскому читателю.
- source_word: לְמִרְמֵא
  choice: бросить
  rationale: Глагол означает бросить или ввергнуть; современное «бросить» непосредственно и ясно передаёт действие.
- source_word: לְאַתּוּן נוּרָא יָקִדְתָּא
  choice: в пылающую огнём печь
  rationale: 'Переданы все элементы арамейского выражения: печь, огонь и горение. Формулировка сохраняет эмфатический образ, оставаясь естественной по-русски.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис сделан естественным для русского, без архаизмов; военный и насильственный характер приказа передан прямо.
