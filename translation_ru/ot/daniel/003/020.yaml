  source_fidelity: 'Текст точно передаёт арамейский смысл: приказ адресован сильным воинам из царского войска; им велено связать трёх названных людей и бросить их в печь, характеризуемую как огненная и пылающая. «Нескольким» допустимо передаёт неопределённую форму множественного числа в контексте («некоторым/отдельным людям»), не создавая существенного дополнительного смысла.'
