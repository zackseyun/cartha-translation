  text: And whoever does not fall down and worship shall be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: ru
  text: И кто не падёт ниц и не поклонится, тот будет брошен в печь с пылающим огнём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дословно: «внутрь печи пылающего огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: А кто… тот
  rationale: Сочетание вводит неопределённое относительное условие «кто бы ни / кто», а коррелятивная конструкция «кто… тот» естественна для русского текста указа; союз וּ передан как связующее «А».
- source_word: לָא יִפֵּל
  choice: не падёт ниц
  rationale: В контексте предписанного почитания речь идёт о намеренном простирании перед истуканом, а не о случайном падении; «пасть ниц» сохраняет телесный образ.
- source_word: וְיִסְגֻּד
  choice: и не поклонится
  rationale: Глагол обозначает поклонение или выражение почтения посредством простирания; «поклонится» сохраняет возможный религиозно-политический диапазон значения, не уточняя его сверх контекста.
- source_word: יִתְרְמֵא
  choice: будет брошен
  rationale: Пассивная форма и контекст царского указа выражают установленное наказание; будущее время естественно передаёт это по-русски.
- source_word: לְגוֹא
  choice: в
  rationale: Слово указывает на внутренность печи; в русском направлении внутрь уже ясно выражено винительным падежом после «брошен в», тогда как буквальное «в середину» звучало бы тяжеловесно.
- source_word: אַתּוּן
  choice: печь
  rationale: Существительное обозначает печь для сильного нагрева; «печь» — традиционное, понятное и контекстуально точное соответствие.
- source_word: נוּרָא יָקִדְתָּא
  choice: раскалённую огнём
  rationale: Арамейское сочетание буквально характеризует печь через горящий огонь. Русская формулировка передаёт и огонь, и интенсивность горения без неестественного нагромождения определений.
