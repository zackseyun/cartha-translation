  text: עֲנ֗וֹ שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ וְ/אָמְרִ֖ין לְ/מַלְכָּ֑/א נְבֽוּכַדְנֶצַּ֔ר לָֽא חַשְׁחִ֨ין אֲנַ֧חְנָה עַל דְּנָ֛ה פִּתְגָ֖ם לַ/הֲתָבוּתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/016.yaml
  text: Shadrach, Meshach, and Abed-nego answered and said to the king, Nebuchadnezzar, “We have no need to give you an answer concerning this matter.”
translation:
  language: ru
  text: 'Шадрах, Мисах и Авденаго ответили царю Навуходоносору: «Нам нет нужды отвечать тебе по этому поводу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנוֹ ... וְאָמְרִין
  choice: ответили
  rationale: Арамейская парная формула буквально означает «ответили и сказали», но в современном русском естественно передаётся одним глаголом без потери смысла.
- source_word: לְמַלְכָּא נְבוּכַדְנֶצַּר
  choice: царю Навуходоносору
  rationale: Дательный оборот точно и естественно передаёт адресата; имя понимается как приложение к титулу.
- source_word: לָא חַשְׁחִין אֲנַחְנָה
  choice: нам нет нужды
  rationale: Передаёт значение отсутствия необходимости, не усиливая его до отказа или неспособности.
- source_word: עַל דְּנָה פִּתְגָם לַהֲתָבוּתָךְ
  choice: отвечать тебе на это
  rationale: Идиоматично передаёт буквальное «возвратить тебе слово по поводу этого» и сохраняет связь с предъявленным царём требованием.
theological_decisions:
- issue: Характер ответа трёх иудеев царю
  choice: «Нам нет нужды отвечать тебе на это»
  alternative: «Мы не обязаны давать тебе ответ по этому делу»
  rationale: Выбранный вариант сохраняет спокойную уверенность исходного выражения и не вносит дополнительного оттенка юридического неповиновения.
translation_notes:
  register: Современный литературный русский, сдержанный и достойный. Устранена семитская парная формула «ответили и сказали» как неестественная для обычного русского повествования; смысл полностью сохранён.
