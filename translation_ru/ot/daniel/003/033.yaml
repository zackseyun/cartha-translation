  variant: modern literary Russian
source:
  edition: WLC
  text: אָת֨וֹ/הִי֙ כְּ/מָ֣ה רַבְרְבִ֔ין וְ/תִמְה֖וֹ/הִי כְּ/מָ֣ה תַקִּיפִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/שָׁלְטָנֵ֖/הּ עִם דָּ֥ר וְ/דָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/033.yaml
  text: How great are his signs[a], and how mighty are his wonders! His kingdom is an everlasting kingdom[c][b], and his dominion is from generation to generation.
translation:
  language: ru
  text: Как велики Его знамения[a] и как могучи Его чудеса! Его царство — царство вечное[b], и Его владычество — из поколения в поколение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его дивные знаки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царство навеки».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально по-арамейски: «с поколением и поколением» — то есть во всех сменяющихся поколениях.'
    reason: cultural_note
lexical_decisions:
- source_word: אָתוֹהִי
  choice: Его знамения
  rationale: В библейском арамейском слово обозначает знаки, в том числе чудесные. «Знамения» естественно образует традиционную и понятную пару с «чудесами», сохраняя различие между двумя существительными.
- source_word: כְּמָה רַבְרְבִין
  choice: как велики
  rationale: כְּמָה вводит восклицание, а רַבְרְבִין здесь выражает величие, а не количество. Русская конструкция точно передаёт восхищение.
- source_word: תִמְהוֹהִי
  choice: Его чудеса
  rationale: Слово указывает на деяния, вызывающие изумление. «Чудеса» ясно и естественно звучит в данном славословии.
- source_word: כְּמָה תַקִּיפִין
  choice: как могучи
  rationale: Прилагательное описывает силу и мощь чудес. «Могучи» сохраняет краткость, параллелизм и возвышенный, но понятный тон.
- source_word: מַלְכוּתֵהּ מַלְכוּת עָלַם
  choice: Его царство — царство вечное
  rationale: Повтор существительного сохранён как выразительный параллелизм оригинала; עָלַם передаёт неограниченную длительность.
- source_word: שָׁלְטָנֵהּ
  choice: Его владычество
  rationale: «Владычество» передаёт царственную власть и соответствует параллели с «царством», не сводя смысл лишь к процессу правления.
- source_word: עִם דָּר וְדָר
  choice: из поколения в поколение
  rationale: Это естественный русский эквивалент семитского оборота, выражающего непрерывность Божьего владычества во всех сменяющихся поколениях.
theological_decisions:
- issue: К кому относятся местоименные суффиксы третьего лица
  choice: Передать их местоимением «Его» без поясняющего добавления имени Бога
  alternative: Вставить в основной текст «Бога» или «Всевышнего»
  rationale: Из контекста ясно, что речь идёт о Всевышнем; добавление явного наименования устранило бы контекстуальную связь ценой расширения исходного текста.
- issue: Характер продолжительности царства
  choice: Сохранить формулировку «царство вечное»
  alternative: Передать как «царство навеки»
  rationale: Оригинал утверждает неограниченную длительность Божьего царства, не развивая здесь дополнительных догматических уточнений о природе вечности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом славословия. Синтаксический параллелизм и повтор слова «царство» сохранены; архаизмы по возможности исключены, однако «владычество» оставлено как точный и понятный термин царственной власти.
