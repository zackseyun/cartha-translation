base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/021.yaml
  text: And in his place a despised man will arise[a], on whom they had not bestowed the majesty of kingship[b]; he will come in quietly and seize the kingdom by intrigues.
translation:
  language: ru
  text: На его место встанет презренный человек, которому не будет дано царское величие; он придёт спокойно[a] и завладеет царством лестью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мирно», «в спокойствии» или «тихо». Еврейское выражение בְשַׁלְוָה может обозначать спокойствие, безопасность или ненавязчивый характер прихода; оно не обязательно означает отсутствие сопротивления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хитрыми происками». Буквальный образ еврейского слова בַּחֲלַקְלַקּוֹת связан с «гладкостью» — льстивой, обманчивой речью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל־כַּנּוֹ
  choice: И на его месте встанет
  rationale: В контексте смены правителей עמד указывает на появление и приход к власти преемника, а עַל־כַּנּוֹ — на занятие места предшественника. «Встанет» сохраняет образ и пророческую форму оригинала.
- source_word: נִבְזֶה
  choice: презренный человек
  rationale: Слово обозначает человека, которого презирают или считают ничтожным. «Презренный» передаёт оценочную силу формы без архаического «подлый» и без уточнения причины презрения.
- source_word: וְלֹא נָתְנוּ עָלָיו הוֹד מַלְכוּת
  choice: которому не оказали царских почестей
  rationale: Буквально речь идёт о том, что ему не дали «величия/блеска царствования». Русское выражение передаёт отсутствие официально признанного царского достоинства, не добавляя конкретного порядка престолонаследия.
- source_word: וּבָא בְשַׁלְוָה
  choice: он придёт без сопротивления
  rationale: בְשַׁלְוָה может выражать спокойствие, безопасность или беспрепятственность. В контексте захвата власти «без сопротивления» естественно передаёт спокойный, невоенный характер прихода, тогда как буквальные оттенки отмечены в сноске.
- source_word: וְהֶחֱזִיק מַלְכוּת
  choice: и завладеет царством
  rationale: Hiphil от חזק здесь означает получить прочную власть или овладеть ею. «Завладеет» передаёт решительное установление контроля, а «царством» сохраняет политический объект оригинала.
- source_word: בַּחֲלַקְלַקּוֹת
  choice: лестью
  rationale: Существительное связано с гладкостью речи и обозначает льстивые, обманчиво убедительные слова или приёмы. «Лестью» сохраняет конкретный образ средств захвата власти; более широкое политическое понимание дано в сноске.
