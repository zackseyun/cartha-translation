  text: וּ/מַשְׂכִּ֣ילֵי עָ֔ם יָבִ֖ינוּ לָֽ/רַבִּ֑ים וְ/נִכְשְׁל֞וּ בְּ/חֶ֧רֶב וּ/בְ/לֶהָבָ֛ה בִּ/שְׁבִ֥י וּ/בְ/בִזָּ֖ה יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/033.yaml
  text: And those among the people who have insight will give understanding to the many[a], but they will stumble by sword and by flame, by captivity and by plunder[d][c][b], for days.
translation:
  language: ru
  text: Разумные среди народа наставят многих[a], но они будут падать[b] от меча и пламени, попадать в плен[c] и терпеть разграбление — некоторое время[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дадут многим понять»; также возможно: «вразумят многих».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потерпят поражение»; в данном контексте образ падения может включать страдание, поражение или смерть во время гонений.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пленом»; возможно также: «будут уведены в плен».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «дни»; то есть в течение неопределённого периода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּילֵי עָם
  choice: разумные среди народа
  rationale: Причастие от שׂכל обозначает людей, обладающих пониманием и проницательностью; «разумные» естественно звучит по-русски, а «среди народа» передаёт связь с עָם без добавления этнического уточнения.
- source_word: יָבִינוּ לָרַבִּים
  choice: наставят многих
  rationale: 'В данной конструкции Hiphil глагола בין имеет каузативно-наставительный смысл: разумные помогают многим понять. «Наставят» передаёт это естественнее, чем буквальное «дадут понимание».'
- source_word: וְנִכְשְׁלוּ
  choice: но они будут падать
  rationale: Глагол כשל сохраняет образ падения и может включать гибель, поражение или крушение под гонениями; перевод не сужает его значение до одной лишь смерти.
- source_word: בְּחֶרֶב וּבְלֶהָבָה
  choice: от меча и пламени
  rationale: Сохраняются конкретные образы меча и пламени; предлог «от» естественно обозначает причину страдания или падения в русском языке.
- source_word: בִּשְׁבִי
  choice: попадать в плен
  rationale: Идиоматическая русская формулировка ясно передаёт состояние плена, хотя еврейская конструкция формально параллельна остальным членам перечня.
- source_word: וּבְבִזָּה
  choice: подвергаться разграблению
  rationale: Передаёт בִּזָּה как разграбление или расхищение имущества и естественно сочетается с перечислением бедствий.
- source_word: יָמִים
  choice: некоторое время
  rationale: Неопределённое множественное число «дни» употреблено обстоятельственно и указывает на ограниченную, но не уточнённую продолжительность.
theological_decisions:
- issue: Означает ли נִכְשְׁלוּ непременно гибель или более широко поражение и страдание?
  choice: будут падать
  alternative: будут погибать; потерпят поражение
  rationale: «Падать» сохраняет многозначный еврейский образ и допускает как смерть, так и поражение либо крушение в ходе гонений.
- issue: К кому относится подразумеваемое подлежащее וְנִכְשְׁלוּ?
  choice: они, с естественной отсылкой к разумным, но без повторного называния
  alternative: разумные будут падать; многие будут падать
  rationale: Еврейский глагол не называет подлежащее заново. Местоимение «они» сохраняет некоторую синтаксическую открытость, хотя ближайшая смысловая линия связывает страдания с разумными среди народа.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксический параллелизм исходного перечня слегка адаптирован ради естественности: «попадать в плен» и «подвергаться разграблению». Многозначность образа падения сохранена и пояснена в сноске.'
