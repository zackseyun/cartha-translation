  text: וּ/מִן הַ/מַּשְׂכִּילִ֣ים יִכָּֽשְׁל֗וּ לִ/צְר֥וֹף בָּ/הֶ֛ם וּ/לְ/בָרֵ֥ר וְ/לַ/לְבֵּ֖ן עַד עֵ֣ת קֵ֑ץ כִּי ע֖וֹד לַ/מּוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/035.yaml
  text: And some of those who have insight will stumble[a], so that they may be refined among them, purified, and made white, until the time of the end[d][c][b]; for it is still for the appointed time.
translation:
  language: ru
  text: Некоторые из разумных падут[a], чтобы они были испытаны, очищены и убелены[b] до времени конца, ибо назначенный срок ещё не настал[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «споткнутся». Еврейский глагол сохраняет образ преткновения и может означать падение или поражение вследствие преследования либо испытания.'
    reason: lexical_alternative
  - marker: b
    text: «Убелены» буквально передаёт еврейский образ «сделаны белыми». Первый глагол этой цепочки связан с очищением металла огнём; его можно передать также как «переплавлены». Местоимение в еврейском тексте синтаксически неоднозначно и допускает понимание «среди них», «ими» или «через них».
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 'Или: «ибо это ещё относится к назначенному сроку». Еврейская фраза эллиптична; она указывает, что назначенное время ещё впереди.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הַמַּשְׂכִּילִים
  choice: И некоторые из разумных
  rationale: מִן при существительном во множественном числе имеет партитивное значение — «некоторые из». Субстантивированное причастие הַמַּשְׂכִּילִים обозначает людей, обладающих пониманием и рассудительностью; «разумные» естественно и ёмко передаёт это в контексте Даниила.
- source_word: יִכָּשְׁלוּ
  choice: потерпят падение
  rationale: Глагол כשל сохраняет образ преткновения или падения, но контекст не уточняет, идёт ли речь о гибели, преследовании либо ином поражении. «Потерпят падение» передаёт образ и не сводит его к нравственному проступку.
- source_word: לִצְרוֹף בָּהֶם וּלְבָרֵר וְלַלְבֵּן
  choice: 'чтобы среди них совершилось очищение: чтобы они были испытаны, очищены и убелены'
  rationale: Цепочка инфинитивов выражает цель или результат падения. צרף — металлургический образ испытания и очищения огнём; ברר — очищение или отделение чистого; לבן — буквально «делать белым». Трудное בָּהֶם сохранено как «среди них», а двоеточие помогает ясно выразить связь фраз по-русски.
- source_word: עַד עֵת קֵץ
  choice: до времени конца
  rationale: Формально близкая и понятная передача устойчивого выражения книги Даниила без уточнения того, что именно завершается.
- source_word: כִּי עוֹד לַמּוֹעֵד
  choice: ибо назначенный срок ещё впереди
  rationale: מוֹעֵד — установленное, назначенное время. Эллиптическая еврейская фраза естественно передаётся по-русски как указание на то, что этот срок ещё не наступил.
theological_decisions:
- issue: Цель или результат страдания разумных
  choice: Падение представлено как ведущее к испытанию и очищению
  alternative: Падение лишь предсказано, без указания на его очистительную функцию
  rationale: Инфинитивная последовательность после יִכָּשְׁלוּ естественно выражает цель или результат, однако перевод не разворачивает это в более широкое учение о страдании.
- issue: Референт местоимения в בָּהֶם
  choice: «среди них» с последующим отнесением действий к разумным
  alternative: «ими» или «через них», то есть очищение других посредством падения разумных
  rationale: Синтаксис краток и допускает разные отношения. Основной текст следует контекстуально вероятному пониманию процесса внутри этой группы, а примечание сохраняет альтернативы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Слова «убелены» и «время конца» сохранены ради образности и терминологической связи с книгой Даниила; трудные места разъяснены в примечаниях.
