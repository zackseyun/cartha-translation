  text: וַ/אֲנִי֙ בִּ/שְׁנַ֣ת אַחַ֔ת לְ/דָרְיָ֖וֶשׁ הַ/מָּדִ֑י עָמְדִ֛/י לְ/מַחֲזִ֥יק וּ/לְ/מָע֖וֹז לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/001.yaml
  text: And as for me[a], in the first year of Darius the Mede[b], I stood up to strengthen and be a fortress to him.
translation:
  language: ru
  text: А я[a], в первый год правления Дария Мидянина[b], встал, чтобы укреплять его и быть ему оплотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «А я ... стоял, чтобы укреплять и быть ему крепостью».'
    reason: lexical_alternative
  - marker: b
    text: В еврейской традиции это Дан. 11:1; в некоторых изданиях с иным делением текста соответствующий фрагмент относят к Дан. 10:21б–11:1.
    reason: textual_variant
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Союз с самостоятельным местоимением обозначает переход к говорящему и слегка выделяет его; «А я» естественно передаёт это в современном русском языке.
- source_word: בִּשְׁנַת אַחַת
  choice: в первый год
  rationale: В формуле датировки по годам правления выражение означает первый год, а не неопределённое «в один год».
- source_word: לְדָרְיָוֶשׁ הַמָּדִי
  choice: Дария Мидянина
  rationale: Предлог при обозначении года правления по-русски передаётся родительным падежом; этническое определение выражено традиционной библейской формой «Мидянин».
- source_word: עָמְדִי
  choice: встал
  rationale: Форма связана с עמד, «стоять, вставать, занимать положение»; в данном контексте «встал» передаёт активное выступление в поддержку, не уточняя способ действия.
- source_word: לְמַחֲזִיק
  choice: чтобы укреплять его
  rationale: Каузативное значение корня חזק указывает на придание силы или поддержку. Местоименный объект, естественно подразумеваемый в русском, выражен явно ради ясности.
- source_word: וּלְמָעוֹז
  choice: и быть ему оплотом
  rationale: מָעוֹז — существительное со значением укреплённого места, твердыни или оплота. Именная конструкция сохраняет образ оригинала точнее, чем отвлечённое «защищать».
- source_word: לוֹ
  choice: его / ему
  rationale: Местоимение мужского рода единственного числа по ближайшему контексту относится к Дарию; русское управление требует «его» после «укреплять» и «ему» после «быть оплотом».
theological_decisions:
- issue: Кто говорит и к кому относится местоимение לוֹ
  choice: Говорящий — небесный посланник из предшествующего контекста; местоимение передано как относящееся к Дарию Мидянину.
  alternative: Иное деление глав может сильнее связывать стих с концом 10-й главы, однако само по себе не требует иной идентификации говорящего или референта местоимения.
  rationale: Перевод следует непосредственной повествовательной связи, но не вводит более точного имени или богословской идентификации небесного говорящего, которых в стихе нет.
- issue: Образ מָעוֹז
  choice: Сохранена метафора «быть ему оплотом».
  alternative: Функциональный перевод «защищать его».
  rationale: Именная метафора оригинала богословски и литературно значима; её можно естественно сохранить по-русски без добавочного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Слово «оплот» сохраняет конкретную метафору крепости и остаётся понятным современному читателю; синтаксис упрощён до естественной русской целевой конструкции.
