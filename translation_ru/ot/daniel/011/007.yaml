  text: And one from a branch of her roots shall arise in his place[a], and he shall come against the army and enter the fortress of the king of the north[d][c][b], and he shall act against them and prevail.
translation:
  language: ru
  text: И восстанет на его месте отпрыск, происходящий от её корней[a]. Он выступит против войска, войдёт в крепость царя севера[b], будет действовать против них[c] и одержит верх[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «побег от её корней», то есть человек из её рода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «войдёт в твердыню царя севера».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поступит с ними» или «будет действовать среди них»; еврейский оборот имеет широкое значение.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «проявит силу» или «добьётся превосходства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  choice: восстанет
  rationale: В контексте смены правителей глагол означает появление или возвышение преемника, а не просто физическое стояние.
- source_word: מִנֵּצֶר שָׁרָשֶׁיהָ
  choice: один из побегов от её корней
  rationale: Сохраняет растительную метафору נֵצֶר и её родословный смысл; оборот указывает на представителя её семейной линии.
- source_word: כַּנּוֹ
  choice: на его месте
  rationale: Передаёт идею замещения или преемства, не уточняя неоднозначного референта местоимения.
- source_word: הַחַיִל
  choice: войско
  rationale: В данном военном контексте חַיִל обозначает вооружённую силу, а не богатство или доблесть.
- source_word: בְּמָעוֹז מֶלֶךְ הַצָּפוֹן
  choice: в крепость царя севера
  rationale: מָעוֹז — укреплённое место или оплот; при глаголе движения предлог естественно передаётся как вход внутрь крепости.
- source_word: וְעָשָׂה בָהֶם
  choice: будет действовать против них
  rationale: Сохраняет широту еврейского оборота עשה ב и в военном контексте выражает враждебное действие, не конкретизируя его сверх текста.
- source_word: וְהֶחֱזִיק
  choice: одержит верх
  rationale: В породе хифиль חזק здесь выражает проявление силы и достижение превосходства; русский оборот естественно передаёт военный результат.
