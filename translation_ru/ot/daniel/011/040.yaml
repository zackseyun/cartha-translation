  terminology: «Царь юга» и «царь севера» — точные и устойчивые для данного контекста титулы. «Колесницы, всадники и множество кораблей» удачно передаёт военный перечень. Местоимения намеренно оставлены без раскрытия; это соответствует исходному тексту.
  issues:
  - severity: medium
