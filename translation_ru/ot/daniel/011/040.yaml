  to: Во время конца царь юга вступит с ним в столкновение[a], и царь севера стремительно устремится на него[b] с колесницами, всадниками и множеством кораблей. Он войдёт в земли[c], нахлынет и пройдёт.
  rationale: Убрано невыраженное в оригинале сравнение «словно буря»; его образная основа сохранена наречием «стремительно» и пояснена в сноске. «Пройдёт дальше» сокращено до «пройдёт», чтобы не добавлять смысловой оттенок. Остальная синтаксическая и местоименная неоднозначность сохранена.
