source:
  edition: WLC
  text: וּ/בְ/עֵ֣ת קֵ֗ץ יִתְנַגַּ֤ח עִמּ/וֹ֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יִשְׂתָּעֵ֨ר עָלָ֜י/ו מֶ֣לֶךְ הַ/צָּפ֗וֹן בְּ/רֶ֨כֶב֙ וּ/בְ/פָ֣רָשִׁ֔ים וּ/בָ/אֳנִיּ֖וֹת רַבּ֑וֹת וּ/בָ֥א בַ/אֲרָצ֖וֹת וְ/שָׁטַ֥ף וְ/עָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/040.yaml
  text: At the time of the end[a], the king of the South will clash with him, and the king of the North will storm against him with chariots, horsemen, and many ships[d][c][b]; he will enter into the lands and sweep through and pass on.
translation:
  language: ru
  text: Во время конца царь юга вступит с ним в столкновение[a], и царь севера стремительно устремится на него[b] с колесницами, всадниками и множеством кораблей. Он войдёт в земли[c], нахлынет и пройдёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально глагол рисует бодание или удар рогами; здесь этот образ употреблён о враждебном столкновении.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «яростно устремится на него». Глагол передаёт образ бурного, стремительного натиска.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в страны». Еврейское слово во множественном числе может обозначать земли, территории или страны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת קֵץ
  choice: А при наступлении конца
  rationale: Передаёт временное выражение о заключительном, назначенном периоде, не уточняя его хронологию; начальное «А» отражает связку וּ.
- source_word: יִתְנַגַּח עִמּוֹ
  choice: вступит с ним в столкновение
  rationale: Сохраняет образ враждебного столкновения, заложенный в глаголе נגח, и прямо передаёт предлог עִם как «с».
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: южный царь
  rationale: Естественное русское обозначение повторяющегося в Дан 11 геополитического титула; речь идёт о южном направлении, а не о необходимости транслитерировать Негев.
- source_word: וְיִשְׂתָּעֵר עָלָיו
  choice: устремится на него, словно буря
  rationale: Передаёт образ стремительного, неистового натиска, присущий глаголу, не сводя его к нейтральному «нападёт».
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: северный царь
  rationale: Последовательно и естественно передаёт геополитический титул, параллельный «южному царю».
- source_word: בְּרֶכֶב וּבְפָרָשִׁים וּבָאֳנִיּוֹת רַבּוֹת
  choice: с колесницами, всадниками и множеством кораблей
  rationale: Сохраняет военный перечень и значение предлога בְּ; собирательное רֶכֶב естественно передано множественным числом.
- source_word: וּבָא בָאֲרָצוֹת
  choice: Он войдёт в земли
  rationale: Формально передаёт глагол входа и множественное число «земли», не усиливая его до истолковывающего «вторгнется в страны».
- source_word: וְשָׁטַף וְעָבָר
  choice: нахлынет и пройдёт дальше
  rationale: «Нахлынет» сохраняет метафору разлива или потока в военном контексте, а «пройдёт дальше» передаёт последующее продвижение без тавтологии.
theological_decisions:
- issue: Референт местоимений «с ним» и «на него»
  choice: Оставить местоимения без указания конкретного лица
  alternative: Назвать презренного царя из предшествующего контекста, конечного эсхатологического правителя либо одного из двух названных царей
  rationale: В еврейском тексте стоит только местоимение, и его антецедент в самом стихе не назван. Сохранение неопределённости не навязывает конкретную эсхатологическую схему.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Военные образы сохранены без архаизации. Неопределённый референт местоимений намеренно не раскрыт; последовательность единственного числа в последнем предложении отнесена к ближайшему подлежащему — северному царю.
