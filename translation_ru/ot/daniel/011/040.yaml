  source_fidelity: 'В целом переданы временная формула, неопределённые местоименные референты, парные титулы царей, военный перечень и последовательность глаголов. Однако «словно буря» вводит в основной текст явное сравнение, которого в еврейском тексте нет: глагол וְיִשְׂתָּעֵר сам несёт образ бурного натиска, но частицы «как/словно» здесь нет. «Пройдёт дальше» также слегка усиливает значение עָבָר («пройдёт, пройдёт через»).'
