    rationale: Еврейский глагол передаёт бурное, стремительное движение, но в стихе отсутствует отдельное сравнительное слово. Этот образ уместнее сохранить в сноске, а не оформлять как эксплицитное сравнение в переводе.
  - severity: low
    issue: «Пройдёт дальше» добавляет оттенок дальнейшего движения.
    rationale: וְעָבָר означает «пройдёт / пройдёт через»; слово «дальше» не обязательно и не выражено явно.
