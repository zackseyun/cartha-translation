source:
  edition: WLC
  text: וּ/בָא֙ בְּ/אֶ֣רֶץ הַ/צְּבִ֔י וְ/רַבּ֖וֹת יִכָּשֵׁ֑לוּ וְ/אֵ֨לֶּה֙ יִמָּלְט֣וּ מִ/יָּד֔/וֹ אֱד֣וֹם וּ/מוֹאָ֔ב וְ/רֵאשִׁ֖ית בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/041.yaml
  text: 'He will enter into the Beautiful Land[a], and many will stumble; but these will escape from his hand: Edom, Moab[c][b], and the foremost of the sons of Ammon.'
translation:
  language: ru
  text: 'Он войдёт в Прекрасную землю[a], и многие падут[b], но эти спасутся от его руки: Эдом, Моав и главные среди сынов Аммона[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Славную землю»; или: «Желанную землю».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «многие»; подразумеваться могут люди или земли (страны).'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «главные из аммонитян». Буквально: «главные среди сынов Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Он войдёт
  rationale: Глагол בוא с предлогом בְּ и словом «земля» естественно передаётся как «войти». Будущее время соответствует продолжающемуся пророческому описанию.
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: в Прекрасную землю
  rationale: צְבִי обозначает красоту, великолепие или желанность. «Прекрасная земля» сохраняет образ и не подставляет прямо географическое толкование «Израиль».
- source_word: וְרַבּוֹת
  choice: и многие
  rationale: Субстантивированное прилагательное женского рода множественного числа употреблено без названного существительного. Краткое «многие» не добавляет прямо ни «народы», ни «земли»; неоднозначность поясняется в сноске.
- source_word: יִכָּשֵׁלוּ
  choice: падут
  rationale: Нифаль глагола כשל может означать «споткнуться», «пасть» или потерпеть поражение. В военно-политическом контексте «падут» звучит естественно и сохраняет образ падения.
- source_word: וְאֵלֶּה יִמָּלְטוּ מִיָּדוֹ
  choice: но эти спасутся от его руки
  rationale: Союз передаёт контраст. ימלטו означает избавление или спасение, а буквальный образ «от его руки» понятен как освобождение от власти.
- source_word: אֱדוֹם וּמוֹאָב
  choice: Эдом, Моав
  rationale: Принятые в современной русской библейской традиции формы географических и этнических названий.
- source_word: וְרֵאשִׁית בְּנֵי עַמּוֹן
  choice: и лучшая часть сынов Аммона
  rationale: רֵאשִׁית может обозначать первую, главную или лучшую часть. Эта передача сохраняет частичный характер выражения и буквальную конструкцию «сыны Аммона», не превращая её без пояснения во всех аммонитян.
theological_decisions:
- issue: К чему относится выражение «Прекрасная земля»
  choice: Оставлено как образное географическое обозначение без вставки «Израиль» или «Иудея»
  alternative: Прямо назвать землю Израиля/Иудеи либо перевести «славная земля»
  rationale: В контексте Даниила это, вероятно, земля Израиля/Иудеи, но сам еврейский текст сохраняет образное наименование.
- issue: Подразумеваемое существительное при וְרַבּוֹת
  choice: «многие» с пояснением неоднозначности в сноске
  alternative: «многие люди» или «многие земли/страны»
  rationale: В еврейском тексте существительное не выражено, поэтому перевод не должен без необходимости окончательно устанавливать референт.
- issue: Значение רֵאשִׁית в выражении о сынах Аммона
  choice: «лучшая часть сынов Аммона»
  alternative: «главные из аммонитян» или «первые из сынов Аммона»
  rationale: Формулировка передаёт значение главной/отборной части, не принимая спорное значение «остаток» и не утверждая, что речь идёт обо всех аммонитянах.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, библейски уместным регистром. Формы «Эдом», «Моав» и «сыны Аммона» сохраняют узнаваемую историко-библейскую лексику; архаические грамматические формы не используются.
