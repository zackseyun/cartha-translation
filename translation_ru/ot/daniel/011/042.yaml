  text: He will stretch out his hand against the countries[a], and the land of Egypt will not escape.
translation:
  language: ru
  text: Он прострёт руку на страны, и земле Египта не будет спасения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля Египта не избежит [его]». Еврейский текст буквально: «не будет для спасения».'
