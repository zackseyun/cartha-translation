lexical_decisions:
- source_word: וְיִשְׁלַח
  choice: прострёт
  rationale: Глагол שׁלח означает «посылать, простирать»; в сочетании с «рукой» передаёт распространение власти или военное нападение. «Прострёт» сохраняет образ исходного текста.
- source_word: יָדוֹ
  choice: руку
  rationale: Буквальная передача сохраняет древнееврейский образ действия силой; притяжательность однозначно выражена формой русского глагольного оборота с названным субъектом, поэтому «свою» не обязательно.
- source_word: בָּאֲרָצוֹת
  choice: на страны
  rationale: В военном контексте предлог בְּ указывает на направленность враждебного действия. Русский оборот «простереть руку на» естественно передаёт нападение или посягательство, а множественное число «страны» сохраняет אֲרָצוֹת.
- source_word: וְאֶרֶץ מִצְרַיִם
  choice: и земля Египта
  rationale: Сохранена конструкция «земля Египта», а не сокращённое «Египет», чтобы передать географический акцент оригинала без архаичного оборота «земля Египетская».
- source_word: לֹא תִהְיֶה לִפְלֵיטָה
  choice: не спасётся
  rationale: Существительное פְּלֵיטָה обозначает спасение, избавление или уцелевших. В данном контексте естественный смысл — Египет не сможет избежать его власти; русский глагол «не спасётся» ясно передаёт это, а буквальная конструкция отмечена в сноске.
