reference: Daniel 11:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/שַׁלְוָ֞ה וּ/בְ/מִשְׁמַנֵּ֣י מְדִינָה֮ יָבוֹא֒ וְ/עָשָׂ֗ה אֲשֶׁ֨ר לֹא עָשׂ֤וּ אֲבֹתָי/ו֙ וַ/אֲב֣וֹת אֲבֹתָ֔י/ו בִּזָּ֧ה וְ/שָׁלָ֛ל וּ/רְכ֖וּשׁ לָ/הֶ֣ם יִבְז֑וֹר וְ/עַ֧ל מִבְצָרִ֛ים יְחַשֵּׁ֥ב מַחְשְׁבֹתָ֖י/ו וְ/עַד עֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/024.yaml
  text: 'In a time of security he will come into the richest parts of the province[a], and he will do what neither his fathers nor his fathers’ fathers did: he will scatter among them plunder, spoil, and goods; and against fortresses he will devise his plans[c][b], but only until a time.'
translation:
  language: ru
  text: 'В пору спокойствия он войдёт в самые богатые места области[a] и сделает то, чего не делали ни его отцы, ни отцы его отцов: он рассеет среди них добычу, трофеи и имущество[b]. Он будет разрабатывать свои планы против крепостей, но лишь до поры[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мирно» либо «неожиданно войдёт в самые богатые места области».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он раздаст им добычу, трофеи и имущество».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный перевод: «Он будет строить козни против укреплений — до назначенного времени».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשַׁלְוָה
  choice: В пору спокойствия
  rationale: Слово обозначает спокойствие, безмятежность или безопасность. Временная формулировка естественна по-русски и сохраняет политический оттенок благополучной, не настороженной обстановки, не утверждая однозначно, что он войдёт мирно.
- source_word: וּבְמִשְׁמַנֵּי מְדִינָה
  choice: в самые богатые места области
  rationale: Буквально речь идёт о «тучных», то есть богатых или плодородных, местах. «Область» передаёт обычное административно-территориальное значение מְדִינָה.
- source_word: יָבוֹא
  choice: он войдёт
  rationale: Сохранено обычное значение глагола «входить, приходить» без добавления более сильного военного смысла «вторгнется».
- source_word: וְעָשָׂה אֲשֶׁר לֹא עָשׂוּ
  choice: и сделает то, чего не делали
  rationale: Прямая формулировка сохраняет подчёркнутое сопоставление с предшественниками.
- source_word: אֲבֹתָיו וַאֲבוֹת אֲבֹתָיו
  choice: ни его отцы, ни отцы его отцов
  rationale: Сохранён явный повтор исходного текста, обладающий большей риторической силой, чем обобщённое «предки».
- source_word: בִּזָּה וְשָׁלָל וּרְכוּשׁ
  choice: добычу, трофеи и имущество
  rationale: Три существительных переданы тремя близкими, но не полностью совпадающими понятиями; этим сохранено накопление выражений в исходном тексте.
- source_word: לָהֶם יִבְזוֹר
  choice: он рассеет среди них
  rationale: Глагол буквально означает «рассеивать, разбрасывать». Образ сохранён, а контекст позволяет понимать его как широкую раздачу захваченного богатства.
- source_word: וְעַל מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו
  choice: Он будет разрабатывать свои планы против крепостей
  rationale: Однокоренное сочетание «мыслить мысли/замыслы» естественно передано как обдумывание и разработка планов; направленность против укреплений сохранена.
- source_word: וְעַד עֵת
  choice: но лишь до поры
  rationale: Исходное выражение буквально означает «и до времени» и само по себе не содержит слова «назначенный». Русское «до поры» сохраняет неопределённость и одновременно указывает на предел.
theological_decisions:
- issue: Следует ли прямо обозначить этот временной предел как установленный Богом
  choice: но лишь до поры
  alternative: до назначенного времени
  rationale: В выражении עַד עֵת отсутствует явное определение «назначенное». Основной текст не уточняет природу предела и тем самым сохраняет присущую оригиналу богословскую напряжённость; более истолковывающий вариант приведён в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; явный повтор «отцы… отцы его отцов» сохранён ради риторической силы оригинала. Неопределённое «до поры» намеренно не превращено в прямое утверждение о назначенном свыше сроке.
