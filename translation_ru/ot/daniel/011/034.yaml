  text: When they stumble[a], they will receive a little help, and many will join themselves to them with smooth words.
translation:
  language: ru
  text: Когда они споткнутся, им будет оказана небольшая помощь, и многие примкнут к ним с лестью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с льстивыми речами». Еврейское слово буквально связано с «гладким» и образно обозначает льстивую или обманчивую речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּשְׁלָם
  choice: Когда они будут спотыкаться
  rationale: Конструкция с ב и инфинитивом выражает временное обстоятельство. «Спотыкаться» сохраняет образ и не усиливает его до полного падения.
- source_word: יֵעָזְרוּ
  choice: им окажут помощь
  rationale: Нифаль передаёт получение помощи; безличная русская конструкция естественно сохраняет пассивный смысл.
- source_word: עֵזֶר מְעָט
  choice: небольшую помощь
  rationale: Передаёт ограниченность помощи и звучит естественно в современном литературном русском.
- source_word: וְנִלְווּ עֲלֵיהֶם
  choice: примкнут к ним
  rationale: Глагол обозначает присоединение к группе; «примкнут» кратко и естественно передаёт этот смысл.
- source_word: רַבִּים
  choice: многие
  rationale: Прямое соответствие количественному обозначению.
- source_word: בַּחֲלַקְלַקּוֹת
  choice: с льстивыми речами
  rationale: Слово буквально связано с «гладкостью» и метафорически обозначает льстивую, неискреннюю речь. Такой перевод ясно передаёт смысл, а буквальный образ сохраняется в примечании.
