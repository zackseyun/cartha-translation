base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/012.yaml
  text: And when the multitude is carried away[a], his heart will be lifted up, and he will cast down tens of thousands[c][b], but he will not prevail.
translation:
  language: ru
  text: И когда это множество будет унесено[a], сердце его вознесётся[b]; он повергнет десятки тысяч, но не одолеет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И это множество будет поднято» либо «будет устранено». Древнееврейский глагол может означать как поднятие, так и унесение или удаление; военный контекст говорит в пользу значения «будет унесено».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сердце его вознесётся» — древнееврейское выражение, означающее, что он возгордится.'
    reason: cultural_note
  - marker: c
    text: 'Или: «но не станет сильным» либо «но не укрепится». Древнееврейский глагол может указывать как на неспособность одержать верх, так и на неспособность упрочить свою силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשָּׂא
  choice: и когда ... будет унесено
  rationale: Нифаль глагола נשׂא допускает значения «быть поднятым», «быть унесённым» и «быть удалённым». В военном контексте наиболее вероятно, что речь идёт об устранении или разгроме множества; временная связь «когда» естественно передаёт последовательность событий.
- source_word: הֶהָמוֹן
  choice: это множество
  rationale: הָמוֹן обозначает множество, массу людей или многочисленное скопление. Контекст подразумевает войско, но «множество» не вносит в текст лишнего уточнения.
- source_word: ירום לְבָבוֹ
  choice: вознесётся его сердце
  rationale: Сохранён древнееврейский образ, выражающий гордость и самопревозношение; его смысл пояснён в сноске.
- source_word: וְהִפִּיל
  choice: он повергнет
  rationale: Каузативная форма נפל буквально означает «заставить пасть»; в военном контексте «повергнет» кратко и естественно передаёт поражение или гибель.
- source_word: רִבֹּאוֹת
  choice: десятки тысяч
  rationale: Форма множественного числа обозначает десятки тысяч, то есть огромные количества; этот вариант точен и понятен современному читателю.
- source_word: וְלֹא יָעוֹז
  choice: но не одолеет
  rationale: Глагол עוז/עזז может обозначать силу, укрепление или способность одержать верх. «Не одолеет» естественно передаёт контекстуальный смысл, а более буквальная возможность отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Образ «вознесётся его сердце» оставлен в основном тексте ради связи с древнееврейской идиомой; необычное значение пояснено сноской. Подлинная неоднозначность глаголов נשׂא и עוז сохранена в примечаниях.
