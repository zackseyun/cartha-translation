base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/025.yaml
  text: And he will stir up his power and his heart against the king of the South with a great army[a], and the king of the South will engage in battle with a very great and mighty army, but he will not stand[b], for they will devise schemes against him.
translation:
  language: ru
  text: И он поднимет свою силу и сердце против царя юга, выступив с большим войском. Царь юга вступит в сражение с очень большим и сильным войском, но не устоит[a], потому что против него будут строить козни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не одержит верх»; возможно также: «не удержит своих позиций». Буквально: «не устоит».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «замыслят против него недоброе». В еврейском тексте употреблён однокоренной оборот, буквально: «будут замышлять против него замыслы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָעֵר
  choice: возбудит
  rationale: Порода hифиль от עור выражает побуждение или приведение в действие; «возбудит» естественно сочетается и с силой, и с сердцем, сохраняя образ оригинала.
- source_word: כֹּחוֹ וּלְבָבוֹ
  choice: свою силу и своё сердце
  rationale: 'Буквальная образность сохранена: לְבָב обозначает внутреннюю решимость и мужество, но перевод не сужает его до одного значения.'
- source_word: עַל מֶלֶךְ הַנֶּגֶב
  choice: против царя юга
  rationale: В контексте Даниила 11 נֶגֶב служит геополитическим обозначением южной державы.
- source_word: בְּחַיִל גָּדוֹל
  choice: выступив с большим войском
  rationale: חַיִל в военном контексте означает войско; деепричастная конструкция ясно передаёт сопутствующее обстоятельство и направление действий.
- source_word: יִתְגָּרֶה לַמִּלְחָמָה
  choice: приготовится к войне
  rationale: Hitpael от גרה здесь означает подняться или решительно вступить в военное противоборство; выбранная формулировка естественна по-русски и не предполагает, что южный царь первым провоцирует войну.
- source_word: בְּחַיִל גָּדוֹל וְעָצוּם עַד מְאֹד
  choice: с войском великим и чрезвычайно могучим
  rationale: Переданы оба определения — величина и мощь — вместе с усилением עַד מְאֹד.
- source_word: וְלֹא יַעֲמֹד
  choice: но не устоит
  rationale: «Не устоит» сохраняет метафору עמד и одновременно естественно выражает неспособность удержаться или одержать верх.
- source_word: יַחְשְׁבוּ עָלָיו מַחֲשָׁבוֹת
  choice: против него замыслят козни
  rationale: Однокоренная еврейская конструкция буквально означает «подумают против него замыслы» и в контексте указывает на враждебный заговор.
