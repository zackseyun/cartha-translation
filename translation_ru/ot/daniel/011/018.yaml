revisions:
- from: Затем он обратит своё лицо к приморским землям[a] и овладеет многими. Но один военачальник положит конец его поношению против него; более того, он обратит его поношение на него самого.[b]
  to: Затем он обратится к приморским землям[a] и овладеет многими. Но военачальник положит конец его поношению; более того, он обратит это поношение на него самого.[b]
  rationale: Правка устраняет русские кальки, не меняя выбранного основного разбора трудных заключительных клауз. Неопределённость местоименных референтов сохранена в основном тексте, а альтернативное, привативное понимание בלתי оставлено в сноске.
