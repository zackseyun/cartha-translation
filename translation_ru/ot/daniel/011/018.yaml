  yaml_path: translation/ot/daniel/011/018.yaml
  text: Then he will turn his face to the coastlands and capture many[b][a]. But a commander will put an end to his reproach against him; indeed, he will repay his reproach to him.
translation:
  language: ru
  text: Затем он обратится к приморским землям[a] и овладеет многими. Но военачальник положит конец его поношению; более того, он обратит это поношение на него самого.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к островам». Еврейское слово может обозначать как острова, так и в более широком смысле приморские земли и области за морем.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительные слова еврейского текста трудны для понимания. Возможно и другое прочтение: «Но военачальник положит конец его поношению, и поношение не обратится на самого военачальника».'
    reason: alternative_reading
lexical_decisions:
- source_word: וישב פניו
  choice: обратит своё лицо
  rationale: Сохраняет образность еврейской идиомы и естественно передаёт направленность к новой цели.
- source_word: לאיים
  choice: к приморским землям
  rationale: אִיִּים может обозначать как острова, так и более широко прибрежные и заморские области; выбранный вариант не сужает значение до буквальных островов.
- source_word: ולכד רבים
  choice: и овладеет многими
  rationale: לכד обозначает захват или овладение в военном контексте, а субстантивированное רבים оставлено без добавленного существительного, как в еврейском тексте.
- source_word: קצין
  choice: один военачальник
  rationale: קָצִין обозначает начальника или военного предводителя; контекст поддерживает военное значение.
- source_word: והשבית
  choice: положит конец
  rationale: Каузативная форма от שבת означает прекращение чего-либо; русское выражение передаёт её силу естественно.
- source_word: חרפתו לו
  choice: его поношению против него
  rationale: Сохраняет трудную местоименную конструкцию и её неясные референты, не подставляя исторических имён.
- source_word: בלתי חרפתו ישיב לו
  choice: более того, он обратит его поношение на него самого
  rationale: Передаёт ישיב как возвращение поношения на обидчика, а בלתי — в усилительном понимании; из-за спорности синтаксиса иной вариант отмечен в сноске.
theological_decisions:
- issue: Референты местоимений и синтаксис заключительных частей стиха
  choice: Военачальник прекращает поношение со стороны царя и обращает это поношение на него самого.
  alternative: Военачальник прекращает поношение, причём его собственное поношение не обращается на него; либо он снимает поношение с себя.
  rationale: Еврейская фраза крайне сжата и допускает разные разборы. Основной текст следует чтению, при котором קצין является субъектом обоих глаголов, но не вводит конкретной исторической идентификации и прямо отмечает альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Сохранены образ «обратить лицо», эллиптическое «многими» и намеренно неуточнённые местоимения; сноски фиксируют реальные лексические и синтаксические альтернативы.
