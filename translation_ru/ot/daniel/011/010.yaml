revisions:
- from: Его сыновья поднимутся на борьбу и соберут огромные военные силы. Один из них непременно выступит[a], нахлынет, словно поток, и пройдёт дальше. Затем он вернётся и будет вести войну вплоть до его крепости[b].
  to: Его сыновья вступят в борьбу и соберут множество войск. И он непременно придёт, хлынет потоком и пройдёт; затем вернётся и вновь вступит в борьбу вплоть до его крепости[a].
  rationale: Перевод сохраняет множественное число «его сыновья», последующий переход к единственному числу и неясный антецедент суффикса в «его крепости». Убраны добавленные уточнения «из них» и «дальше», а образ военного потока передан без превращения метафоры в явное сравнение. Сноски объединены под одним якорем после «крепости», поскольку обе отмеченные неоднозначности относятся к сохранённым в тексте грамматическим особенностям стиха.
