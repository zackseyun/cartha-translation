source:
  edition: WLC
  text: ו/בנ/ו יִתְגָּר֗וּ וְ/אָסְפוּ֙ הֲמוֹן֙ חֲיָלִ֣ים רַבִּ֔ים וּ/בָ֥א ב֖וֹא וְ/שָׁטַ֣ף וְ/עָבָ֑ר וְ/יָשֹׁ֥ב ו/יתגרו עַד מעז/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/010.yaml
  text: His sons will stir themselves up and assemble a multitude of great forces[a], and one will certainly come and overflow and pass through[b]; then he will return and stir up war as far as his fortress.
translation:
  language: ru
  text: Его сыновья вступят в борьбу и соберут множество войск. И он непременно придёт, хлынет потоком и пройдёт; затем вернётся и вновь вступит в борьбу вплоть до его крепости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до его укрепления». Еврейский текст не уточняет, кому принадлежит крепость; после слов о сыновьях во множественном числе он переходит к единственному числу.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָנָיו
  choice: Его сыновья
  rationale: בנים в контексте династической борьбы обозначает именно сыновей правителя, а не детей вообще.
- source_word: יִתְגָּרוּ
  choice: поднимутся на борьбу
  rationale: Форма хитпаэль от גרה передаёт вовлечение себя в столкновение или военные действия; русский оборот сохраняет побудительно-возвратный оттенок и ясно звучит в военном контексте.
- source_word: וְאָסְפוּ הֲמוֹן חֲיָלִים רַבִּים
  choice: соберут огромные военные силы
  rationale: Передаёт как массовость הֲמוֹן, так и военное значение חֲיָלִים רַבִּים, избегая тяжеловесного буквального сочетания «множество многочисленных войск».
- source_word: וּבָא בּוֹא
  choice: Один из них непременно выступит
  rationale: Сочетание личной формы с абсолютным инфинитивом усиливает действие, а переход от множественного числа к единственному сохранён без отождествления действующего сына с конкретным историческим лицом.
- source_word: וְשָׁטַף
  choice: нахлынет, словно поток
  rationale: Сохраняется образ неудержимого потока, метафорически описывающий наступление войска.
- source_word: וְעָבָר
  choice: пройдёт дальше
  rationale: Глагол עבר продолжает описание продвижения через территорию; «дальше» естественно передаёт последовательность наступления.
- source_word: וְיָשֹׁב
  choice: Затем он вернётся
  rationale: שוב прямо обозначает возвращение, а «затем» естественно отмечает последовательность действий.
- source_word: וְיִתְגָּר
  choice: будет вести войну
  rationale: Второе употребление גרה в данном контексте ясно относится к продолжению военных действий; перевод передаёт смысл без неестественного повторения возвратного оборота.
- source_word: עַד מָעֻזֹּה
  choice: вплоть до его крепости
  rationale: מָעוֹז означает укреплённое место или крепость; местоименный суффикс мужского рода единственного числа передан буквально, а его референт оставлен неуточнённым.
theological_decisions:
- issue: К кому относится единственное число после слов «его сыновья»
  choice: «Один из них непременно выступит» без уточнения личности сына
  alternative: «Он непременно выступит» либо прямое историческое отождествление одного из сыновей
  rationale: Еврейский текст переходит от множественного числа к единственному. Перевод делает этот переход понятным, но не вносит отсутствующего в тексте исторического имени.
- issue: Кому принадлежит «его крепость»
  choice: Сохранить «его крепости» с неявным антецедентом
  alternative: Уточнить владельца крепости или сгладить выражение как «их крепости»
  rationale: Еврейский суффикс стоит в единственном числе, однако его отнесение допускает разные толкования; перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Военная образность потока сохранена, но синтаксис сделан естественным и понятным; исторические референты, не названные в стихе, не добавлены.
