base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/043.yaml
  text: And he will rule over the treasures of gold and silver[a], and over all the precious things of Egypt[b]; and the Libyans and Cushites will be in his train.
translation:
  language: ru
  text: И он будет распоряжаться сокрытыми запасами золота и серебра[a] и всеми ценностями Египта; ливийцы и кушиты будут следовать за ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровищами золота и серебра»; еврейское слово указывает на спрятанные или хранимые в укрытии ценности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будут у его шагов»; возможно также: «будут в его свите».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁל
  choice: И он завладеет
  rationale: Глагол משל с предлогом ב здесь означает установление власти или контроля над чем-либо. «Завладеет» естественно передаёт контроль над перечисленными богатствами.
- source_word: בְּמִכְמַנֵּי
  choice: тайными хранилищами
  rationale: מִכְמָן обозначает спрятанное или хранимое в укрытии имущество. Выражение сохраняет оттенок скрытых запасов, не сводя его просто к «сокровищам».
- source_word: הַזָּהָב וְהַכֶּסֶף
  choice: золота и серебра
  rationale: Прямые и общеупотребительные соответствия названиям материалов.
- source_word: וּבְכֹל חֲמֻדוֹת מִצְרָיִם
  choice: и всеми драгоценностями Египта
  rationale: חֲמֻדוֹת — желанные, ценные вещи; «драгоценности» передаёт их ценность, не ограничивая смысл денежными запасами.
- source_word: לֻבִים
  choice: ливийцы
  rationale: Этноним обычно обозначает ливийские народы; русское историко-географическое название понятно современному читателю.
- source_word: כֻשִׁים
  choice: кушиты
  rationale: «Кушиты» сохраняет древний историко-географический этноним и не создаёт ошибочной прямой связи с современным государством Эфиопия.
- source_word: בְּמִצְעָדָיו
  choice: будут идти за ним
  rationale: Оборот связан с шагами, шествием или продвижением. Перевод сохраняет образ следования за правителем и не уточняет без достаточных оснований, входят ли эти народы в его свиту или войско.
