  text: וּ/לְ/קֵ֤ץ שָׁנִים֙ יִתְחַבָּ֔רוּ וּ/בַ֣ת מֶֽלֶךְ הַ/נֶּ֗גֶב תָּבוֹא֙ אֶל מֶ֣לֶךְ הַ/צָּפ֔וֹן לַ/עֲשׂ֖וֹת מֵישָׁרִ֑ים וְ/לֹֽא תַעְצֹ֞ר כּ֣וֹחַ הַ/זְּר֗וֹעַ וְ/לֹ֤א יַעֲמֹד֙ וּ/זְרֹע֔/וֹ וְ/תִנָּתֵ֨ן הִ֤יא וּ/מְבִיאֶ֨י/הָ֙ וְ/הַ/יֹּ֣לְדָ֔/הּ וּ/מַחֲזִקָ֖/הּ בָּ/עִתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/006.yaml
  text: At the end of years they will join together[a], and the daughter of the king of the South will come to the king of the North to make an agreement. But she will not retain the strength of her arm, and he and his arm will not stand; and she will be given up, along with those who brought her, and the one who fathered her[b], and the one who supported her in those times.
translation:
  language: ru
  text: По прошествии лет они заключат союз, и дочь царя юга придёт к царю севера, чтобы заключить соглашение.[a] Но она не сохранит силы своей руки, и ни он, ни его сила не устоят; она будет выдана вместе с теми, кто привёл её, с её отцом[b] и с тем, кто поддерживал её в те времена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы совершить справедливости»; возможные значения: «установить справедливые условия» или «достичь справедливого урегулирования». В данном дипломатическом контексте речь, вероятно, идёт о соглашении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с породившим её». Маскулинная форма еврейского причастия указывает на отца. Некоторые переводы понимают это слово иначе, например как указание на её потомка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקֵץ שָׁנִים
  choice: По прошествии лет
  rationale: Передаёт идиоматический смысл окончания некоторого периода лет естественным современным русским языком, не добавляя отсутствующего в тексте точного срока.
- source_word: יִתְחַבָּרוּ
  choice: они заключат союз
  rationale: Возвратная порода глагола חבר обозначает соединение или вступление в союз; политический контекст делает «заключат союз» ясным и уместным.
- source_word: וּבַת מֶלֶךְ הַנֶּגֶב
  choice: дочь царя южного
  rationale: Сохраняется устойчивое для Дан 11 политико-географическое обозначение; строчная буква не превращает описательный титул в имя собственное.
- source_word: תָּבוֹא אֶל מֶלֶךְ הַצָּפוֹן
  choice: придёт к царю северному
  rationale: בוא выражает движение к адресату; «придёт к» буквально и естественно передаёт выбранную перспективу.
- source_word: לַעֲשׂוֹת מֵישָׁרִים
  choice: чтобы установить согласие
  rationale: Множественное מֵישָׁרִים буквально связано с прямотой, справедливостью и равными условиями; в дипломатическом контексте речь идёт об урегулировании или соглашении. Сноска сохраняет буквальный оттенок.
- source_word: וְלֹא תַעְצֹר כּוֹחַ הַזְּרוֹעַ
  choice: она не сохранит силы своей руки
  rationale: Сохраняется образ руки как силы или власти, а עצר передаётся в значении удержать, сохранить.
- source_word: וְלֹא יַעֲמֹד וּזְרֹעוֹ
  choice: он не устоит, как и его сила
  rationale: Мужской субъект оставлен без уточнения, поскольку еврейский текст прямо его не называет; זְרוֹעַ передано по метафорическому смыслу как «сила», чтобы фраза звучала естественно.
- source_word: וְתִנָּתֵן הִיא
  choice: она будет предана
  rationale: Пассивная форма נתן указывает, что её выдадут или отдадут; «будет предана» сохраняет пассивность и допускает смысл выдачи на погибель.
- source_word: וּמְבִיאֶיהָ
  choice: вместе с теми, кто привёл её
  rationale: Причастная форма во множественном числе прямо обозначает сопровождавших или доставивших её людей без дополнительной конкретизации.
- source_word: וְהַיֹּלְדָהּ
  choice: с её отцом
  rationale: Маскулинная причастная форма ילד буквально обозначает породившего её, то есть отца. Краткая русская формулировка естественна; текстовая неоднозначность отмечена в сноске.
- source_word: וּמַחֲזִקָהּ
  choice: с тем, кто поддерживал её
  rationale: Причастие породы hифиль от חזק может означать укрепляющего, поддерживающего или покровительствующего; нейтральное «поддерживал» не уточняет характера поддержки.
- source_word: בָּעִתִּים
  choice: в те времена
  rationale: Сохраняется множественное число «времена» и указание на упомянутый исторический период.
theological_decisions:
- issue: К кому относится мужское «он» в выражении וְלֹא יַעֲמֹד
  choice: Сохранить местоимение «он» без явного отождествления
  alternative: 'Уточнить: «царь северный не устоит»'
  rationale: Грамматический род допускает связь с царём северным, однако исходный текст не повторяет его титул; перевод не должен устранять эту референциальную неоднозначность.
- issue: Значение «руки» в двух параллельных выражениях
  choice: В первом сохранить телесную метафору, во втором передать её смыслом «сила»
  alternative: В обоих случаях употребить либо «рука», либо «сила»
  rationale: Так сохраняется образ исходного текста там, где он развёрнут как «сила руки», но избегается неясное русское «он и его рука не устоят»; богословская или историческая конкретизация не вносится.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Формы «царь южный» и «царь северный» сохраняют повторяющиеся обозначения главы, не превращая их в имена собственные. Архаизмы сведены к минимуму; подлинные лексические и референциальные неоднозначности вынесены в сноски или сохранены в основном тексте.
