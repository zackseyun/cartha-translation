  text: וְ/גַ֣ם אֱֽלֹהֵי/הֶ֡ם עִם נְסִֽכֵי/הֶם֩ עִם כְּלֵ֨י חֶמְדָּתָ֜/ם כֶּ֧סֶף וְ/זָהָ֛ב בַּ/שְּׁבִ֖י יָבִ֣א מִצְרָ֑יִם וְ/הוּא֙ שָׁנִ֣ים יַעֲמֹ֔ד מִ/מֶּ֖לֶךְ הַ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/008.yaml
  text: He will also carry off to Egypt their gods[a], with their cast images and with their precious vessels of silver and gold, as plunder; and for some years he will stand aloof from the king of the north.
translation:
  language: ru
  text: Он также увезёт в Египет их богов, их литые изваяния и их драгоценные сосуды из серебра и золота — как добычу; и несколько лет он будет держаться в стороне от царя севера[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «несколько лет он проживёт дольше царя севера» или «несколько лет он будет сильнее царя севера». Еврейская фраза сжата и может выражать сравнение, а не уклонение от действий.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: также
  rationale: Передаёт добавочное значение сочетания и естественно связывает действие с предыдущим контекстом.
- source_word: אֱלֹהֵיהֶם
  choice: их богов
  rationale: Прямо передаёт форму множественного числа, не добавляя в основной текст оценочного слова «идолы».
- source_word: נְסִכֵיהֶם
  choice: их литые изваяния
  rationale: Сохраняет указание на изготовление изображений посредством литья; «изваяния» звучит естественно и уместно для культовых образов.
- source_word: כְּלֵי חֶמְדָּתָם
  choice: драгоценные сосуды
  rationale: В контексте храмовых или царских сокровищ כְּלֵי допускает значение «сосуды», а חֶמְדָּתָם указывает на их ценность.
- source_word: כֶּסֶף וְזָהָב
  choice: из серебра и золота
  rationale: Материал сосудов выражен естественной русской конструкцией.
- source_word: בַּשְּׁבִי
  choice: как добычу
  rationale: По отношению к увозимым предметам обозначает военную добычу, а не плен в буквальном смысле.
- source_word: יָבִא מִצְרָיִם
  choice: увезёт в Египет
  rationale: В военном контексте каузатив глагола בוא обозначает доставку захваченных ценностей; «увезёт» ясно передаёт их перемещение.
- source_word: שָׁנִים
  choice: несколько лет
  rationale: Передаёт неопределённую продолжительность без указания точного числа.
- source_word: יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: будет держаться в стороне от царя севера
  rationale: Сохраняет образ глагола עמד и возможное разделительное значение מן, не уточняя его как прямой отказ от нападения.
theological_decisions:
- issue: Толкование וְהוּא שָׁנִים יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: несколько лет он будет держаться в стороне от царя севера
  alternative: несколько лет он переживёт царя севера; несколько лет он будет превосходить царя севера
  rationale: Сжатая еврейская конструкция допускает как значение удаления или невмешательства, так и сравнительное понимание מן. Основной текст сохраняет наиболее прозрачный пространственно-разделительный образ, а иные вероятные прочтения отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; неоднозначность заключительной фразы сохранена посредством сноски.
