base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/023.yaml
  text: And from the time of an alliance with him[a], he will act deceitfully; and he will rise and become strong with a small nation.
translation:
  language: ru
  text: И со времени заключения союза с ним он будет поступать коварно; он возвысится и станет сильным с малочисленным народом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с немногими людьми». Краткое еврейское выражение בִּמְעַט גּוֹי может указывать либо на малочисленный народ, либо на небольшое число людей, благодаря которым он становится сильным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הִתְחַבְּרוּת אֵלָיו
  choice: И со времени заключения союза с ним
  rationale: Отглагольное существительное от חבר обозначает соединение или союз; в политическом контексте естественно «заключение союза». Предлог אֶל при таком существительном по-русски передаётся как «с ним». וּמִן сохраняется как «и со времени», указывая на исходный момент последующих действий.
- source_word: יַעֲשֶׂה מִרְמָה
  choice: он будет действовать обманом
  rationale: Буквально «совершит обман»; выбранная формулировка естественна по-русски и сохраняет значение намеренного коварства, не уточняя его форму.
- source_word: וְעָלָה
  choice: он возвысится
  rationale: עלה может означать подъём или восхождение; здесь речь идёт о политическом возвышении, поэтому «возвысится» передаёт контекстуальный смысл без добавления идеи военного наступления.
- source_word: וְעָצַם
  choice: и станет сильным
  rationale: Глагол означает стать сильным или могущественным; «станет сильным» сохраняет динамическое, начинательное значение формы.
- source_word: בִּמְעַט גּוֹי
  choice: с малым народом
  rationale: Компактная еврейская конструкция допускает понимание как малого народа, так и немногих людей. Основной текст близко воспроизводит форму оригинала, а альтернативный количественный смысл отмечен в сноске.
