base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/015.yaml
  text: Then the king of the north will come and heap up a siege ramp and capture a fortified city[a], and the forces of the south will not stand, nor his choice troops[b], for there will be no strength to stand.
translation:
  language: ru
  text: 'Тогда царь севера придёт, насыплет осадный вал и захватит укреплённый город. Ни войска юга[a], ни его отборные воины[b] не устоят: не будет сил устоять.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «руки юга»; «рука» здесь служит образом военной силы или войск.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его избранные люди»; в данном военном контексте, вероятнее всего, имеются в виду лучшие, отборные воины царя юга.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָבֹא
  choice: Тогда ... придёт
  rationale: Союз ו при имперфекте продвигает пророческое повествование; «тогда» естественно передаёт последовательность событий.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: царь севера
  rationale: Сохранено устойчивое в Дан 11 обозначение и противопоставление с югом.
- source_word: וְיִשְׁפֹּךְ סֹלֲלָה
  choice: насыплет осадный вал
  rationale: Еврейское военное выражение обозначает сооружение насыпи для осады; буквальное «выльет» по-русски исказило бы смысл.
- source_word: וְלָכַד עִיר מִבְצָרוֹת
  choice: и захватит укреплённый город
  rationale: Глагол передаёт военный захват, а конструкция с множественным числом מִבְצָרוֹת характеризует город как укреплённый.
- source_word: וּזְרֹעוֹת הַנֶּגֶב
  choice: войска юга
  rationale: Буквально «руки (мышцы) юга»; здесь это метафора военной силы, естественно передаваемая словом «войска».
- source_word: לֹא יַעֲמֹדוּ
  choice: не устоят
  rationale: Сохранён образ «стоять», который в военном контексте означает выдержать натиск или оказать сопротивление.
- source_word: וְעַם מִבְחָרָיו
  choice: ни его отборные воины
  rationale: В контексте выражение, вероятнее всего, относится к избранным, лучшим воинам царя юга. Конструкция «ни ... ни» ясно связывает обе группы с глаголом «не устоят».
- source_word: וְאֵין כֹּחַ לַעֲמֹד
  choice: не будет сил устоять
  rationale: Фраза естественно передаёт отсутствие способности сопротивляться и сохраняет повтор корня со значением «стоять».
theological_decisions:
- issue: Референт местоименного суффикса в מִבְחָרָיו
  choice: «его» относится к стороне юга, то есть к царю юга
  alternative: Суффикс может быть понят менее определённо как относящийся к силам юга в целом
  rationale: Ближайший контекст говорит о военных силах юга; перевод не вводит дополнительной исторической или конфессиональной идентификации.
- issue: Значение עַם в выражении עַם מִבְחָרָיו
  choice: «отборные воины»
  alternative: «его избранный народ» или «его избранные люди»
  rationale: Военный контекст и параллель с «войсками юга» поддерживают значение отборного воинского подразделения, однако лексическая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Военная терминология ясна обычному читателю; повтор «устоят — устоять» намеренно сохраняет повтор еврейского корня. Синтаксис «ни ... ни» делает связь однородных военных сил естественной по-русски, не добавляя исторических имён.
