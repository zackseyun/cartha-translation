base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/037.yaml
  text: He will show no regard for the gods of his fathers[a], or for the desire of women, or for any god[b], because he will magnify himself above all.
translation:
  language: ru
  text: Он не обратит внимания ни на богов своих отцов[a], ни на желание женщин[b], ни на какого-либо бога, ибо превознесёт себя выше всех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бога своих отцов». Еврейская форма имеет множественное число («богов»), однако некоторые понимают это известное выражение как обозначение Бога Израиля.'
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение «желание женщин» может означать «то, чего желают женщины» или «того, кого желают женщины».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: богов своих отцов
  rationale: Форма אֱלֹהֵי допускает морфологически множественное прочтение; ближайший контекст с упоминанием любого бога поддерживает его. «Отцов» близко передаёт אֲבֹתָיו, не заменяя его толкованием «предков».
- source_word: לֹא יָבִין
  choice: не обратит внимания
  rationale: Хотя בין буквально означает «понимать, рассматривать», в сочетании с עַל здесь речь идёт о внимании и почтительном отношении. Русское выражение естественно передаёт этот смысл.
- source_word: חֶמְדַּת נָשִׁים
  choice: желание женщин
  rationale: 'Буквальный оборот сохраняет неоднозначность конструкции: это может быть то, чего желают женщины, или тот, кого они желают.'
- source_word: כָּל אֱלוֹהַּ
  choice: какого-либо бога
  rationale: כָּל с существительным в единственном числе имеет распределительное значение — «любой, какой-либо бог».
- source_word: כִּי עַל כֹּל יִתְגַּדָּל
  choice: потому что превознесёт себя выше всех
  rationale: Порода хитпаэль передаёт самовозвеличивание, а עַל כֹּל — превосходство над всеми; «выше всех» оставляет референт обобщённым, как в еврейском тексте.
theological_decisions:
- issue: Толкование חֶמְדַּת נָשִׁים
  choice: В основном тексте сохранено неоднозначное выражение «желание женщин».
  alternative: «То, чего желают женщины» или «тот, кого желают женщины».
  rationale: Еврейская конструкция не позволяет уверенно выбрать между общим объектом желания и конкретным желанным лицом; уточнение внесло бы в перевод спорное историческое или богословское толкование.
- issue: Число в אֱלֹהֵי אֲבֹתָיו
  choice: 'Передано во множественном числе: «богов своих отцов».'
  alternative: «Бога своих отцов».
  rationale: Множественное прочтение непосредственно соответствует форме и согласуется с контекстом, но единственное число возможно как традиционная библейская идиома, поэтому отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской торжественности. Повтор «не обратит внимания» воспроизводит параллельную структуру еврейского стиха; неоднозначные выражения не конкретизированы.
