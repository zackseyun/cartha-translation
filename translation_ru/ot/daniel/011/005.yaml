base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/005.yaml
  text: Then the king of the South will grow strong[a], but one of his commanders will grow stronger than he and will rule, and his dominion will be a great dominion.
translation:
  language: ru
  text: И царь юга станет силён; но один из его военачальников станет сильнее его и будет править, и его владычество будет великим.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а один из его сановников станет силён над ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶחֱזַק
  choice: станет силён
  rationale: Qal-имперфект глагола חזק обозначает обретение политической и военной силы; будущее время передаёт ход пророческого повествования.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: царь юга
  rationale: Сохраняет устойчивый географическо-политический титул, повторяющийся в этой главе.
- source_word: וּמִן שָׂרָיו
  choice: но один из его военачальников
  rationale: מן при существительном во множественном числе указывает на одного из числа царских сановников; שַׂר в данном военно-политическом контексте естественно передать как «военачальник». Союз «но» ясно выражает подразумеваемое противопоставление.
- source_word: וְיֶחֱזַק עָלָיו
  choice: станет сильнее его
  rationale: Сочетание חזק с עַל здесь выражает превосходство над ранее названным царём; сравнительная конструкция естественна по-русски.
- source_word: וּמָשָׁל
  choice: будет править
  rationale: Форма с союзом продолжает последовательность событий пророческого повествования; «править» точно передаёт политическое владычество.
- source_word: מִמְשָׁל רַב מֶמְשַׁלְתּוֹ
  choice: власть его будет велика
  rationale: Передаёт усилительную конструкцию и значительный размах правления естественным современным русским языком, хотя формальная игра однокоренными словами сглаживается.
