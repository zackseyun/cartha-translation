  text: וְ/עָמַ֖ד מֶ֣לֶךְ גִּבּ֑וֹר וּ/מָשַׁל֙ מִמְשָׁ֣ל רַ֔ב וְ/עָשָׂ֖ה כִּ/רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/003.yaml
  text: Then a mighty king will arise[a], and he will rule with great dominion and do as he pleases.
translation:
  language: ru
  text: Тогда восстанет могущественный царь, и будет править с великой властью, и поступать как пожелает[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и действовать по своей воле».'
    reason: Сноска сохраняет более формальный вариант передачи כִּרְצוֹנוֹ, буквально указывающий на соответствие действий собственной воле царя.
lexical_decisions:
- source_word: וְעָמַד
  choice: Тогда восстанет
  rationale: В пророческом повествовании עמד обозначает появление правителя на исторической сцене. «Восстанет» сохраняет образ исходного глагола, а «тогда» естественно передаёт последовательность событий, выраженную союзом וְ.
- source_word: מֶלֶךְ גִּבּוֹר
  choice: могущественный царь
  rationale: גִּבּוֹר указывает на силу и могущество, не обязательно ограничиваясь воинской доблестью; «могущественный» естественно передаёт широкий смысл слова применительно к царю.
- source_word: וּמָשַׁל
  choice: и будет править
  rationale: Глагол משל означает осуществлять власть, править. Такой перевод сохраняет политический смысл и не добавляет более узкого династического оттенка.
- source_word: מִמְשָׁל רַב
  choice: с великой властью
  rationale: Однокоренное с משל существительное מִמְשָׁל подчёркивает масштаб осуществляемой власти. Формулировка сохраняет это усиление и остаётся понятной по-русски.
- source_word: וְעָשָׂה כִּרְצוֹנוֹ
  choice: и поступать как пожелает
  rationale: Выражение буквально указывает на действия согласно собственной воле и в данном контексте подразумевает свободу поступать по своему желанию. Русская идиома передаёт это естественно, не устраняя оттенок неограниченной власти.
