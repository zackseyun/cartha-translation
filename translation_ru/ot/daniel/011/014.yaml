  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם רַבִּ֥ים יַֽעַמְד֖וּ עַל מֶ֣לֶךְ הַ/נֶּ֑גֶב וּ/בְנֵ֣י פָּרִיצֵ֣י עַמְּ/ךָ֗ יִֽנַּשְּׂא֛וּ לְ/הַעֲמִ֥יד חָז֖וֹן וְ/נִכְשָֽׁלוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/014.yaml
  text: And in those times many will rise up against the king of the South[a], and the violent among your people will lift themselves up to establish the vision[c][b], but they will stumble.
translation:
  language: ru
  text: В те времена многие восстанут против царя Юга, и жестокие люди из твоего народа[a] вознесутся[b], чтобы утвердить видение[c], но они споткнутся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья насильников (или нарушителей) твоего народа»; точное устройство этого еврейского выражения допускает разные толкования.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «станут превозноситься».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «осуществить видение»; также возможно: «исполнить видение».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: В те времена
  rationale: Передаёт указание на определённый период в разворачивающейся исторической последовательности; современно и естественно по-русски.
- source_word: רַבִּים
  choice: многие
  rationale: Прилагательное употреблено субстантивно; добавлять слово «люди» здесь не требуется.
- source_word: יַעַמְדוּ עַל
  choice: восстанут против
  rationale: В контексте противостояния сочетание обозначает активное выступление против кого-либо, а не просто нахождение перед ним.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: царь Юга
  rationale: В Даниила 11 נֶגֶב служит геополитическим обозначением южного царства; прописная буква показывает титульное употребление направления.
- source_word: וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: буйные люди из твоего народа
  rationale: Сложное сочетание буквально включает «сыновей» и слово со значением насильников, нарушителей или мятежников. Выбранный вариант сохраняет отрицательную характеристику группы, не отождествляя её с какой-либо позднейшей партией или сектой.
- source_word: יִנַּשְּׂאוּ
  choice: вознесутся
  rationale: Возвратная форма выражает самоутверждение или самовозвышение; «вознесутся» сохраняет образ подъёма и допускает политический оттенок выступления.
- source_word: לְהַעֲמִיד חָזוֹן
  choice: чтобы утвердить видение
  rationale: Глагол буквально означает «поставить, сделать стоящим, утвердить». Формулировка остаётся близкой к еврейскому тексту и не решает заранее, стремятся ли эти люди исполнить пророчество или подтвердить его.
- source_word: חָזוֹן
  choice: видение
  rationale: Обычное для книги Даниила обозначение пророческого видения; оно не сужается до одной лишь словесной «проповеди» или «пророчества».
- source_word: וְנִכְשָׁלוּ
  choice: но они споткнутся
  rationale: Сохраняет образ еврейского глагола כשל и оставляет открытым, идёт ли речь о неудаче, падении или гибели.
theological_decisions:
- issue: Кого обозначает וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: буйные люди из твоего народа
  alternative: сыновья насильников из твоего народа; беззаконники из твоего народа
  rationale: Перевод передаёт отрицательную нравственно-политическую характеристику, но не навязывает конкретной исторической или конфессиональной идентификации.
- issue: Значение לְהַעֲמִיד חָזוֹן
  choice: утвердить видение
  alternative: осуществить видение; исполнить видение
  rationale: В исходном тексте стоит глагол «поставить, утвердить», а не однозначный глагол исполнения. Основной текст сохраняет напряжение, а более толковательное понимание вынесено в сноску.
- issue: Исход выступления группы
  choice: они споткнутся
  alternative: они падут; они потерпят неудачу
  rationale: Образ «споткнуться» не уточняет сверх текста, означает ли это провал замысла, политическое поражение или окончательную гибель.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохранён компактным, метафоры возвышения и спотыкания оставлены видимыми. Архаизмы вроде «преткнутся» и конфессионально окрашенные исторические отождествления не использованы.
