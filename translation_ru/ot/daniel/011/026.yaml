  yaml_path: translation/ot/daniel/011/026.yaml
  text: Those who eat his food will break him[a], and his army will be swept away[c][b], and many slain will fall.
translation:
  language: ru
  text: Те, кто ест его пищу[a], сокрушат его[b]; его войско будет смыто[c], и многие падут убитыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «те, кто ест хлеб с его стола». Это выражение указывает на приближённых или зависимых от правителя людей, способных предать его изнутри.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сломают его»; это образное выражение означает, что они приведут его к краху.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский глагол вызывает образ разлившегося потока; его можно передать также: «его войско хлынет (как поток)». В данном контексте «будет смыто» передаёт образ разгрома войска.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכְלֵי פַת בָּגוֹ
  choice: те, кто ест его пищу
  rationale: Выражение обозначает людей, пользующихся пищей и содержанием правителя, то есть его приближённых или зависимых от него лиц. Такой перевод звучит естественно и не добавляет прямо не названного в тексте стола.
- source_word: יִשְׁבְּרֻהוּ
  choice: сокрушат его
  rationale: Глагол שׁבר буквально означает «ломать, разбивать» и может образно указывать на гибель или крах. «Сокрушат» сохраняет образ и подходит к контексту внутреннего предательства.
- source_word: חֵילוֹ
  choice: его войско
  rationale: В военном контексте חַיִל обозначает военную силу или армию; «войско» ясно и стилистически уместно.
- source_word: יִשְׁטוֹף
  choice: будет смыто
  rationale: Глагол שטף вызывает образ разлива или бурного потока. Пассивная русская конструкция передаёт подразумеваемый разгром войска, сохраняя образ наводнения.
- source_word: וְנָפְלוּ חֲלָלִים רַבִּים
  choice: и многие падут убитыми
  rationale: חֲלָלִים — сражённые или убитые. Формулировка сохраняет и глагол «падут», и указание на их гибель.
