id: DAN.11.36
reference: Daniel 11:36
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עָשָׂ֨ה כִ/רְצוֹנ֜/וֹ הַ/מֶּ֗לֶךְ וְ/יִתְרוֹמֵ֤ם וְ/יִתְגַּדֵּל֙ עַל כָּל אֵ֔ל וְ/עַל֙ אֵ֣ל אֵלִ֔ים יְדַבֵּ֖ר נִפְלָא֑וֹת וְ/הִצְלִ֨יחַ֙ עַד כָּ֣לָה זַ֔עַם כִּ֥י נֶחֱרָצָ֖ה נֶעֱשָֽׂתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/036.yaml
  text: And the king will do as he pleases[a]. He will exalt himself and magnify himself above every god, and against the God of gods he will speak astonishing things. And he will prosper until the indignation is finished[c][b], for what has been decreed will be done.
translation:
  language: ru
  text: Царь будет поступать по своей воле. Он превознесётся и возвеличит себя выше всякого бога и станет говорить против Бога богов поразительные вещи[a]. Он будет преуспевать, пока не завершится гнев[b], потому что предрешённое исполнится[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «необычайные» или «дивные вещи». Еврейское слово обозначает нечто необыкновенное или вызывающее изумление; в данном контексте речь звучит дерзко и кощунственно.'
    reason: Лексический диапазон נִפְלָאוֹת шире, чем однозначно отрицательная характеристика.
  - marker: b
    text: 'Или: «пока не исчерпается негодование».'
    reason: זַעַם может передаваться как «гнев» или «негодование», а выражение указывает на его установленное завершение.
  - marker: c
    text: 'Или: «потому что определённое будет исполнено».'
    reason: Еврейская формулировка сочетает принятое решение с его неизбежным осуществлением.
lexical_decisions:
- source_word: וְעָשָׂה כִרְצוֹנוֹ
  choice: будет поступать по своей воле
  rationale: Передаёт буквальное значение «поступать согласно своей воле» и подчёркивает самовластие царя, не усиливая его сверх смысла еврейского текста.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное передано прямо; контекст не требует уточнять личность царя.
- source_word: וְיִתְרוֹמֵם וְיִתְגַּדֵּל
  choice: превознесётся и возвеличит себя
  rationale: Сохранены возвратный смысл обоих глаголов и их риторическое нарастание.
- source_word: עַל כָּל אֵל
  choice: выше всякого бога
  rationale: При глаголах возвышения предлог עַל выражает превосходство; «всякого» естественно передаёт distributive כָּל.
- source_word: וְעַל אֵל אֵלִים
  choice: против Бога богов
  rationale: Здесь עַל обозначает направленность враждебной речи, а сочетание אֵל אֵלִים — верховного Бога.
- source_word: יְדַבֵּר נִפְלָאוֹת
  choice: станет говорить поразительные вещи
  rationale: נִפְלָאוֹת обозначает нечто необычайное, изумительное или поразительное. Формулировка сохраняет широту слова, а контекст придаёт речи дерзкий оттенок.
- source_word: וְהִצְלִיחַ
  choice: будет преуспевать
  rationale: Передаёт временный успех царя и соответствует возвышенному пророческому регистру.
- source_word: עַד כָּלָה זַעַם
  choice: пока не завершится гнев
  rationale: זַעַם означает гнев или негодование, а כָּלָה указывает на достижение установленного конца. Субъект гнева не добавлен.
- source_word: כִּי נֶחֱרָצָה נֶעֱשָׂתָה
  choice: потому что предрешённое исполнится
  rationale: «Предрешённое» передаёт установленное решение, а «исполнится» — его неизбежное осуществление; пророческое значение еврейской формы естественно выражено будущим временем.
theological_decisions:
- issue: Референт אֵל אֵלִים
  choice: «Бога богов» с прописной буквы
  alternative: «бога богов» как общее обозначение верховного божества
  rationale: Контраст со «всяким богом» и общий контекст указывают на Бога как верховного Владыку; прописная буква обозначает вероятный референт, не добавляя пояснений в текст.
- issue: Характер זַעַם
  choice: «гнев» без названного субъекта
  alternative: «негодование» или явное «Божий гнев»
  rationale: Пророческий контекст допускает и, вероятно, предполагает Божий гнев, однако сам стих прямо не называет его субъект. Перевод сохраняет эту сдержанность.
- issue: Неизбежность предрешённого
  choice: «предрешённое исполнится»
  alternative: «то, что определено, будет сделано»
  rationale: Фраза выражает установленный исход и его осуществление, но не уточняет в основном тексте ни действующее лицо, ни содержание решения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сделан ясным для широкого читателя; сохранены параллелизм, нарастание самовозвышения и богословская неопределённость относительно прямо не названного субъекта гнева.
