  text: וּ/זְרֹע֥וֹת הַ/שֶּׁ֛טֶף יִשָּׁטְפ֥וּ מִ/לְּ/פָנָ֖י/ו וְ/יִשָּׁבֵ֑רוּ וְ/גַ֖ם נְגִ֥יד בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/022.yaml
  text: The flood-like forces will be swept away from before him and be broken[b][a], and also the prince of the covenant.
translation:
  language: ru
  text: Подобные потоку войска будут сметены перед ним и сокрушены[a]; также будет сметён и сокрушён князь завета[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «руки потока»; вероятно, имеются в виду неудержимые военные силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «правитель завета»; еврейское слово также можно передать как «предводитель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרֹעוֹת הַשֶּׁטֶף
  choice: подобные потоку войска
  rationale: Буквально сочетание означает «руки потока», но в военно-политическом контексте זְרֹעוֹת обозначает вооружённую силу или войска, а הַשֶּׁטֶף сохраняет образ неудержимого потока.
- source_word: יִשָּׁטְפוּ
  choice: будут сметены
  rationale: 'Нифаль передаёт страдательное значение: силы будут унесены или сметены; этот выбор естественно сохраняет образ потока.'
- source_word: מִלְּפָנָיו
  choice: перед ним
  rationale: 'Передаёт пространственно-конфронтационный смысл: войска устраняются с его пути или терпят поражение перед ним.'
- source_word: וְיִשָּׁבֵרוּ
  choice: и сокрушены
  rationale: שבר в нифале означает «быть сломанным, разбитым, сокрушённым»; «сокрушены» уместно для войск и сохраняет возвышенный регистр.
- source_word: וְגַם
  choice: а вместе с ними — и
  rationale: Ясно показывает, что названный далее вождь также подпадает под действие предшествующих глаголов, не меняя добавочного смысла выражения.
- source_word: נְגִיד בְּרִית
  choice: вождь завета
  rationale: נְגִיד — предводитель, правитель или князь; «вождь» не предполагает царского происхождения. Определённость «завета» допустима по контексту, хотя в еврейском артикль отсутствует.
theological_decisions:
- issue: Личность и определённость «вождя завета»
  choice: Сохранить титул без отождествления лица; в основном тексте передать «вождь завета».
  alternative: «вождь некоего завета»; историческое отождествление с первосвященником Онией III; более общее обозначение договорного союзника; мессианское прочтение.
  rationale: Еврейский текст не называет этого человека и сам по себе не разрешает спор о его исторической или богословской идентичности. Перевод не должен вносить такое отождествление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Образ потока сохранён, а трудная еврейская идиома раскрыта без излишней интерпретации.
