id: DAN.11.11
reference: Daniel 11:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יִתְמַרְמַר֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יָצָ֕א וְ/נִלְחַ֥ם עִמּ֖/וֹ עִם מֶ֣לֶךְ הַ/צָּפ֑וֹן וְ/הֶעֱמִיד֙ הָמ֣וֹן רָ֔ב וְ/נִתַּ֥ן הֶ/הָמ֖וֹן בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/011.yaml
  text: Then the king of the South will become enraged and go out and fight with him[a], with the king of the North; and he will raise up a great multitude[c][b], but the multitude will be given into his hand.
translation:
  language: ru
  text: Тогда царь юга придёт в ярость[a], выступит и сразится с ним — с царём севера. Тот соберёт огромное войско, но это войско будет отдано в руки царя юга[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильно возмутится»; еврейский глагол передаёт глубокое внутреннее возбуждение или ожесточение, побуждающее к действию.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет отдано в его руку». Выражение «отдать в руку» означает отдать под чью-либо власть.'
    reason: cultural_note
lexical_decisions:
- source_word: וְיִתְמַרְמַר
  choice: придёт в ярость
  rationale: Hitpael от מרמר выражает сильное внутреннее возмущение или ожесточение, побуждающее к действию; эта формулировка естественна по-русски и сохраняет эмоциональную силу глагола.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: царь юга
  rationale: Сохраняет устойчивое географическое обозначение правителя, употребляемое в Дан 11.
- source_word: וְיָצָא
  choice: выступит
  rationale: В военном контексте русский глагол «выступит» естественно передаёт буквальное «выйдет», подразумевая выступление в поход.
- source_word: וְנִלְחַם עִמּוֹ עִם מֶלֶךְ הַצָּפוֹן
  choice: сразится с ним — с царём севера
  rationale: Сохраняет местоимение и поясняющее приложение еврейского текста; тире ясно показывает, кого обозначает «ним».
- source_word: וְהֶעֱמִיד הָמוֹן רָב
  choice: Тот соберёт огромное войско
  rationale: Hiphil от עמד означает «поставить, выставить, собрать», а המון в данном военном контексте обозначает многочисленную массу воинов. «Тот» однозначно возвращает к ближайшему названному царю севера.
- source_word: וְנִתַּן הֶהָמוֹן בְּיָדוֹ
  choice: но это войско будет отдано в руки царя юга
  rationale: Пассивная форма נתן передаёт вручение или предание во власть. Явное «царя юга» устраняет неестественную для русского языка местоименную двусмысленность, разрешаемую синтаксисом и ходом повествования.
theological_decisions:
- issue: К кому относятся подлежащие в двух последних предложениях
  choice: Царь севера собирает войско, а войско отдаётся во власть царя юга.
  alternative: Царь юга собирает войско, которое затем отдаётся в его же руки.
  rationale: В первой части стиха царь юга выступает против царя севера; после непосредственного упоминания царя севера форма «он поставит» естественно относится к нему, тогда как «в его руку» возвращает к царю юга как победителю. Такое понимание также согласуется с продолжением в ст. 12, где южный царь уносит множество.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Военная обстановка передана естественными словами «выступит», «сразится», «соберёт войско». Местоименные связи уточнены существительными ради ясности, при этом последовательность участников и образ еврейской идиомы отражены в тексте и сноске.
