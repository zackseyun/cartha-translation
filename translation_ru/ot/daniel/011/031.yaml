base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/031.yaml
  text: And forces from him will arise[a], and they will profane the sanctuary fortress, and remove the regular burnt offering[d][c][b], and set up the abomination that desolates.
translation:
  language: ru
  text: И выступят от него войска[a], и осквернят святилище — твердыню[b], и прекратят постоянное жертвоприношение[c], и установят мерзость, опустошающую[d].
  philosophy: optimal-equivalence
  footnotes:
