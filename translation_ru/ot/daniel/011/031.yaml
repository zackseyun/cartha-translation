    text: 'Буквально: «руки»; здесь — вооружённые силы или войска.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально ставит рядом слова «святилище» и «твердыня»; возможно также: «укреплённое святилище» или «святилище, твердыню».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «постоянное»; имеется в виду регулярно совершаемое храмовое жертвоприношение.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «мерзость, вызывающую опустошение»; традиционно: «мерзость запустения».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּזְרֹעִים
  choice: войска
  rationale: Буквально «руки», но в данном военно-политическом контексте слово обозначает вооружённые силы; «войска» естественно передаёт этот смысл.
- source_word: מִמֶּנּוּ
  choice: от него
  rationale: Местоименный суффикс естественно отсылает к упомянутому ранее царю и сохраняет краткость оригинала.
- source_word: יַעֲמֹדוּ
  choice: выступят
  rationale: Глагол буквально означает «встанут», но здесь описывает выход войск для действия или занятие ими позиции.
- source_word: וְחִלְּלוּ
  choice: осквернят
  rationale: Порода пиэль выражает превращение святого в профанное, то есть осквернение святилища.
- source_word: הַמִּקְדָּשׁ הַמָּעוֹז
  choice: святилище-твердыню
  rationale: Дефисное сочетание удерживает оба существительных и компактную, не вполне однозначную связь между ними, не сводя выражение просто к прилагательному.
- source_word: וְהֵסִירוּ
  choice: отменят
  rationale: В контексте регулярного храмового служения речь идёт не о физическом перемещении предмета, а о прекращении установленного жертвоприношения; «отменят» естественно выражает результат действия.
- source_word: הַתָּמִיד
  choice: постоянную жертву
  rationale: Буквально «постоянное»; в культовом контексте Даниила это сокращённое обозначение регулярно приносимой жертвы. Слово «жертву» добавлено для ясности без излишнего уточнения её вида.
- source_word: וְנָתְנוּ
  choice: установят
  rationale: Глагол означает «поместят, поставят»; применительно к культовому или идольскому объекту «установят» звучит естественно.
- source_word: הַשִּׁקּוּץ
  choice: мерзость
  rationale: Устоявшееся и понятное русское обозначение чего-либо отвратительного и культово неприемлемого, нередко связанного с идолопоклонством.
- source_word: מְשׁוֹמֵם
  choice: опустошающую
  rationale: Причастие допускает причинный смысл — «приводящую к опустошению»; согласование с «мерзостью» сохраняет сжатую форму оригинала.
theological_decisions:
- issue: Связь слов הַמִּקְדָּשׁ и הַמָּעוֹז
  choice: святилище-твердыню
  alternative: укреплённое святилище; святилище, твердыню
  rationale: В еврейском два определённых существительных стоят рядом без явного связующего элемента. Дефис сохраняет оба образа и возможное приложение, не устраняя синтаксическую неоднозначность.
- issue: Смысл הַתָּמִיד
  choice: постоянную жертву
  alternative: постоянное; постоянное приношение; постоянную всесожигаемую жертву
  rationale: Субстантивированное прилагательное буквально не называет жертву, однако храмовый контекст указывает на регулярное жертвоприношение. Более узкое «всесожжение» оставлено за рамками основного текста, чтобы не конкретизировать сверх необходимого.
- issue: Значение причастия מְשׁוֹמֵם
  choice: мерзость, опустошающую
  alternative: мерзость, вызывающую опустошение; мерзость запустения
  rationale: Активная формулировка сохраняет вероятный причинный оттенок причастия, тогда как традиционное «мерзость запустения» может восприниматься как обозначение состояния или принадлежности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Военная и храмовая лексика ясна обычному читателю; компактность и неоднозначность еврейского текста по возможности сохранены.
