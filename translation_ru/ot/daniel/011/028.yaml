- from: Затем он возвратится в свою землю с великим богатством[a]. Сердце его будет против святого завета; он совершит задуманное и возвратится в свою землю.
  to: Затем он возвратится в свою землю с большим богатством, но сердце его будет против святого завета; он будет действовать и возвратится в свою землю.
  rationale: 'Исправление устраняет смысловое добавление в передаче וְעָשָׂה: «будет действовать» оставляет действие неуточнённым, как в еврейском тексте. Также «с большим богатством» даёт более естественное современное русское выражение. Повтор «возвратится», «святой завет» и отсутствие интерпретирующего пояснения сохранены.'
