    issue: «Он совершит задуманное»
    rationale: У וְעָשָׂה нет выраженного объекта и нет слова со значением «задуманное». Формулировка выводит действие из намерения сердца и добавляет смысл, которого текст прямо не сообщает.
  - severity: low
    issue: «С великим богатством»
    rationale: Смысл передан, но сочетание менее естественно в современном русском, чем «с большим богатством».
  revised_text: Затем он возвратится в свою землю с большим богатством, но сердце его будет против святого завета; он будет действовать и возвратится в свою землю.
  revised_footnotes:
