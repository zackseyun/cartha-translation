source:
  edition: WLC
  text: וְ/יָשֹׁ֤ב אַרְצ/וֹ֙ בִּ/רְכ֣וּשׁ גָּד֔וֹל וּ/לְבָב֖/וֹ עַל בְּרִ֣ית קֹ֑דֶשׁ וְ/עָשָׂ֖ה וְ/שָׁ֥ב לְ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/028.yaml
  text: Then he will return to his land with great wealth[a], but his heart will be against the holy covenant[b]; and he will act and return to his land.
translation:
  language: ru
  text: Затем он возвратится в свою землю с большим богатством, но сердце его будет против святого завета; он будет действовать и возвратится в свою землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשֹׁב אַרְצוֹ
  choice: Затем он возвратится в свою землю
  rationale: Глагол שוב означает «возвращаться», а начальное וְ передаёт дальнейшее развитие повествования. В русском предложное направление естественно выражено как «в свою землю».
- source_word: בִּרְכוּשׁ גָּדוֹל
  choice: с великим богатством
  rationale: רְכוּשׁ обозначает имущество, добро или богатство; широкий вариант «богатство» не уточняет без достаточного основания, что речь непременно о добыче.
- source_word: וּלְבָבוֹ עַל
  choice: Сердце его будет против
  rationale: Буквальная и естественная формулировка сохраняет образ сердца как внутренней направленности и передаёт враждебное отношение, выраженное сочетанием с עַל.
- source_word: בְּרִית קֹדֶשׁ
  choice: святого завета
  rationale: Существительное קֹדֶשׁ характеризует завет как святой. Традиционно понятное «святой завет» сохраняет собственно заветную категорию текста.
- source_word: וְעָשָׂה
  choice: он совершит задуманное
  rationale: Употреблённый без объекта глагол עשה предельно краток и может означать «сделает, совершит, поступит». Русское «совершит задуманное» естественно связывает действие с только что названным намерением сердца, не конкретизируя само действие.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: и возвратится в свою землю
  rationale: Повтор «возвратится» сохраняет повторение שוב в еврейском тексте и отмечает окончательное возвращение после промежуточного действия.
theological_decisions:
- issue: Значение выражения «святой завет»
  choice: Сохранить выражение «святой завет» без поясняющей конкретизации.
  alternative: иудейская вера; народ и установления Божьего завета
  rationale: Контекст может указывать на заветный порядок, связанный со святым народом Бога, однако сам стих говорит именно о завете. Перевод не сужает это понятие до одной интерпретации.
- issue: Неуточнённое действие וְעָשָׂה
  choice: Передать как «совершит задуманное», не называя конкретных поступков.
  alternative: будет действовать; сделает [это]; поступит по своему усмотрению
  rationale: Объект действия в еврейском тексте отсутствует. Выбранная формулировка сохраняет неопределённость самого поступка, одновременно естественно передавая связь с враждебной направленностью сердца.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сделан ясным для обычного читателя; повтор глагола «возвратится» сохранён как значимая особенность исходного текста.
