source:
  edition: WLC
  text: וְ/לֶ/אֱלֹ֨הַּ֙ מָֽעֻזִּ֔ים עַל כַּנּ֖/וֹ יְכַבֵּ֑ד וְ/לֶ/אֱל֜וֹהַּ אֲשֶׁ֧ר לֹא יְדָעֻ֣/הוּ אֲבֹתָ֗י/ו יְכַבֵּ֛ד בְּ/זָהָ֥ב וּ/בְ/כֶ֛סֶף וּ/בְ/אֶ֥בֶן יְקָרָ֖ה וּ/בַ/חֲמֻדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/038.yaml
  text: Instead[a], he will honor a god of fortresses in his place; he will honor a god whom his fathers did not know with gold, silver, precious stones[c][b], and desirable things.
translation:
  language: ru
  text: Но бога крепостей он будет чтить на его месте[a]; бога, которого не знали его отцы, он будет чтить золотом, серебром, драгоценными камнями[b] и ценными вещами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на его основании» или «на его постаменте»; еврейское выражение трудно для понимания и может означать «на его месте» или «вместо него».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «драгоценным камнем»; возможно также: «драгоценными камнями».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сокровищами», «желанными вещами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֶאֱלֹהַּ מָעֻזִּים
  choice: Но бога крепостей
  rationale: Сочетание передано описательно, без отождествления с конкретным божеством; וְ в контексте выражает противопоставление предыдущему стиху, а מָעֻזִּים обозначает укреплённые места, крепости.
- source_word: עַל־כַּנּוֹ
  choice: вместо него
  rationale: Трудное выражение буквально связано с основанием или постаментом, но в данном контексте, вероятно, имеет заместительный смысл. Местоимение оставлено без уточнения референта, чтобы не устранять неоднозначность.
- source_word: יְכַבֵּד
  choice: будет чтить
  rationale: Порода piel глагола כבד здесь означает оказывать честь, почитать; «чтить» естественно звучит в контексте отношения к божеству и сохранено в обоих случаях.
- source_word: אֲבֹתָיו
  choice: его отцы
  rationale: Буквальная родовая формулировка сохраняет мужское множественное число и значение предков по линии прежних поколений.
- source_word: בְּזָהָב וּבְכֶסֶף
  choice: золотом и серебром
  rationale: Предлог ב передаёт средство или то, посредством чего оказывается почесть; русский творительный падеж выражает это естественно.
- source_word: וּבְאֶבֶן יְקָרָה
  choice: драгоценным камнем
  rationale: Сохранено грамматическое единственное число еврейского אֶבֶן; возможное собирательное понимание отмечено в сноске.
- source_word: וּבַחֲמֻדוֹת
  choice: и сокровищами
  rationale: חֲמֻדוֹת обозначает желанные, ценные вещи; «сокровища» естественно передаёт смысл в перечне материальных ценностей, не сужая его до конкретного вида даров.
theological_decisions:
- issue: Идентичность «бога крепостей»
  choice: Описательное «бог крепостей» без конкретной идентификации
  alternative: Определённый бог войны, военная мощь как объект почитания или конкретное историческое божество
  rationale: Сам стих не даёт достаточных данных для однозначного отождествления; перевод сохраняет историческую и богословскую неопределённость.
- issue: Значение עַל־כַּנּוֹ
  choice: «вместо него» с примечанием о буквальном пространственном смысле
  alternative: «на его основании/постаменте» или «на своём месте»
  rationale: Сжатая конструкция допускает как пространственное, так и заместительное понимание. В контексте противопоставления наиболее естественно «вместо него», однако буквальные варианты сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка остаётся ясной для широкого читателя; повтор «будет чтить» сохраняет структуру оригинала. Все сноски обозначены в основном тексте.
