  source_fidelity: 'Нужна правка. В начале стиха отсутствует противительный союз «но»: וּכְעָמְדוֹ вводит временное обстоятельство («когда он возвысится / придёт к власти»), а не противопоставление. «Утвердится» возможно, но несколько смещает значение от самого восхождения к власти. Формулировка «не сохранит того могущества» необоснованно делает царство активным субъектом и передаёт не прямо выраженную идею сохранения; еврейский текст сопоставляет последующее распределение с прежним владычеством царя. В исправлении сохранены династическое понимание אַחֲרִיתוֹ и неопределённая отсылка אֵלֶּה.'
  naturalness: Исправленный текст сохраняет современный литературный русский и умеренно возвышенную пророческую интонацию. «На четыре стороны света» естественно по-русски передаёт направительный образ; сноска отмечает буквальное выражение «четыре ветра небесные».
  terminology: «Царство», «потомки», «владычество» и «вырвано с корнем» точно передают политико-династическую и образную лексику текста. «Владычество» позволяет передать связь מָשְׁלוֹ / מָשָׁל без добавления исторических отождествлений.
