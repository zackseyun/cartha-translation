  text: וּ/כְ/עָמְד/וֹ֙ תִּשָּׁבֵ֣ר מַלְכוּת֔/וֹ וְ/תֵחָ֕ץ לְ/אַרְבַּ֖ע רוּח֣וֹת הַ/שָּׁמָ֑יִם וְ/לֹ֣א לְ/אַחֲרִית֗/וֹ וְ/לֹ֤א כְ/מָשְׁל/וֹ֙ אֲשֶׁ֣ר מָשָׁ֔ל כִּ֤י תִנָּתֵשׁ֙ מַלְכוּת֔/וֹ וְ/לַ/אֲחֵרִ֖ים מִ/לְּ/בַד אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/004.yaml
  text: And as soon as he has arisen[a], his kingdom will be broken and divided toward the four winds of heaven, but not to his posterity, and not according to the dominion with which he ruled[b]; for his kingdom will be uprooted and given to others besides these.
translation:
  language: ru
  text: Когда он возвысится, царство его будет сокрушено и разделено на четыре стороны света[a], но не его потомкам[b] и не в соответствии с владычеством, которым он владел; ибо царство его будет вырвано с корнем и отдано другим, помимо этих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к четырём ветрам небесным» — образное обозначение четырёх сторон света, то есть всех направлений.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «не к его последующему (или концу)». В этом династическом контексте, вероятно, имеются в виду те, кто должен был бы наследовать ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעָמְדוֹ
  choice: Но когда он утвердится
  rationale: Форма от עמד обозначает момент, когда царь встанет у власти или утвердится; перевод передаёт политический контекст, не сводя выражение к физическому вставанию. Сам предлог כְ надёжнее передаётся как «когда», без усиления «едва», которое не обязательно выражено грамматически.
- source_word: תִּשָּׁבֵר מַלְכוּתוֹ
  choice: его царство будет сокрушено
  rationale: Страдательная форма от שבר указывает на разрушение царства; «сокрушено» сохраняет силу образа и подходит возвышенному повествовательному регистру.
- source_word: וְתֵחָץ
  choice: и разделено
  rationale: Передаёт пассивный смысл разделения царства на части без уточнения исторических участников.
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: по четырём ветрам небесным
  rationale: Сохранён древнееврейский пространственный образ четырёх направлений; предлог «по» естественно выражает распределение в разные стороны.
- source_word: וְלֹא לְאַחֲרִיתוֹ
  choice: однако не достанется его потомкам
  rationale: В контексте династической преемственности אַחֲרִיתוֹ относится к тем, кто идёт после царя. Глагол «достанется» восполняет подразумеваемый переход царства и делает фразу ясной по-русски.
- source_word: וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל
  choice: и не сохранит того могущества, с каким правил он
  rationale: Передаёт отрицание прежнего масштаба власти и по возможности сохраняет связь однокоренных существительного и глагола מָשְׁל / מָשַׁל через слова «могущество» и «правил».
- source_word: כִּי תִנָּתֵשׁ מַלְכוּתוֹ
  choice: Его царство будет вырвано с корнем
  rationale: נתש выражает насильственное вырывание или искоренение. Русское выражение сохраняет растительную метафору и показывает окончательность устранения.
- source_word: וְלַאֲחֵרִים מִלְּבַד אֵלֶּה
  choice: и отдано другим, помимо них
  rationale: «Отдано» — минимально необходимое восполнение идеи передачи власти; «помимо них» сохраняет неопределённую отсылку местоимения אֵלֶּה, не навязывая конкретной исторической идентификации.
theological_decisions:
- issue: Историческая идентификация царя и получателей царства
  choice: Не называть в основном тексте конкретного царя, династию или государства.
  alternative: Прямо отождествить царя и части распавшегося царства с известными историческими лицами и державами.
  rationale: Сам стих описывает распад и перераспределение царства, но не называет участников. Перевод не должен вносить в текст выводы исторического толкования.
- issue: Масштаб власти после разделения
  choice: Передать, что прежнее могущество царства не сохранится.
  alternative: Понимать фразу только как утверждение, что ни один преемник не будет править точно так же.
  rationale: Еврейская конструкция допускает некоторую синтаксическую сжатость, но ясно противопоставляет последующее состояние прежнему владычеству царя; формулировка сохраняет этот общий смысл без уточнения механизма.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Образы «четыре ветра небесные» и «вырвано с корнем» сохранены, но синтаксис сделан понятным обычному читателю. Сноски поставлены у тех выражений, которые они действительно поясняют.
