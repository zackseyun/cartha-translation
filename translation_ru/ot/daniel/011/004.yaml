revisions:
- from: Но когда он утвердится, его царство будет сокрушено и разделено по четырём ветрам небесным[a], однако не достанется его потомкам[b] и не сохранит того могущества, с каким правил он. Его царство будет вырвано с корнем и отдано другим, помимо них.
  to: Когда он возвысится, царство его будет сокрушено и разделено на четыре стороны света[a], но не его потомкам[b] и не в соответствии с владычеством, которым он владел; ибо царство его будет вырвано с корнем и отдано другим, помимо этих.
  rationale: Удалён не имеющий опоры в оригинале противительный союз; «утвердится» заменено на «возвысится». Перестроена передача фразы о владычестве, чтобы не приписывать царству действие «сохранять» могущество и прямо выразить сопоставление с прежней властью. Идиома о четырёх ветрах передана естественным русским эквивалентом, а её буквальный образ сохранён в сноске. Обе сноски привязаны к соответствующим выражениям и не вносят историко-конфессиональных идентификаций.
