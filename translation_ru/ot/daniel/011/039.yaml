  text: וְ/עָשָׂ֞ה לְ/מִבְצְרֵ֤י מָֽעֻזִּים֙ עִם אֱל֣וֹהַּ נֵכָ֔ר אֲשֶׁ֥ר הכיר יַרְבֶּ֣ה כָב֑וֹד וְ/הִמְשִׁילָ/ם֙ בָּֽ/רַבִּ֔ים וַ/אֲדָמָ֖ה יְחַלֵּ֥ק בִּ/מְחִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/039.yaml
  text: And he will act against the strongest fortresses with a foreign god[a]. Those whom he acknowledges, he will increase with honor, and he will make them rule over many[d][c][b], and he will divide land for a price.
translation:
  language: ru
  text: И он будет действовать против укреплённых твердынь с чужим богом[a]. Тех, кого он признает[b], он возвеличит, поставит их правителями над многими и разделит землю за плату[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством чужого бога». Предлог «с» может указывать как на сопровождение, так и на средство действия. Еврейское выражение о твердынях сжато; его также понимают иначе, например как «для крепостей-твердынь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тех, кто признаёт его»; еврейское построение допускает иное соотнесение участников, хотя форма глагола непосредственно означает «кого он признаёт».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «распределит землю за вознаграждение». Выражение подразумевает передачу земли на условиях платы или награды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: И он выступит
  rationale: Глагол עשה имеет широкое значение «делать, действовать». В военном контексте «выступит» естественно передаёт направленное действие, не уточняя его сверх текста.
- source_word: לְמִבְצְרֵי מָעֻזִּים
  choice: против самых укреплённых крепостей
  rationale: מִבְצָר означает укреплённое место или крепость, а מָעוֹז — силу или твердыню. Предлог לְ здесь понят как указывающий на направленность действия; сочетание передано естественной русской усилительной конструкцией.
- source_word: עִם אֱלוֹהַּ נֵכָר
  choice: с чужим богом
  rationale: עִם обычно означает «с». Перевод сохраняет возможные оттенки сопровождения и средства, не выбирая один из них.
- source_word: אֲשֶׁר הִכִּיר
  choice: Тех, кого он признает
  rationale: 'Форма הִכִּיר — 3-е лицо мужского рода единственного числа в хифиле: царь является субъектом, а последующее местоименное окончание во множественном числе указывает на признанных им людей.'
- source_word: יַרְבֶּה כָבוֹד
  choice: он возвеличит
  rationale: Сжатое выражение буквально говорит об умножении почёта. «Возвеличит» кратко и естественно передаёт наделение большим почётом.
- source_word: וְהִמְשִׁילָם בָּרַבִּים
  choice: поставит их правителями над многими
  rationale: Хифиль глагола משל означает «дать власть, поставить править»; בָּרַבִּים естественно передаётся как «над многими».
- source_word: וַאֲדָמָה יְחַלֵּק בִּמְחִיר
  choice: за плату разделит землю
  rationale: חלק в пиэле означает «делить, распределять», מְחִיר — «цена, плата». Формулировка сохраняет транзакционный смысл, не уточняя природу платы.
theological_decisions:
- issue: К кому относятся признанные во второй части стиха люди
  choice: Царь признаёт определённых людей, возвеличивает их и наделяет властью.
  alternative: Люди, признающие чужого бога или самого царя, получают награду.
  rationale: Форма הִכִּיר естественнее всего понимается как глагол 3-го лица единственного числа с царём в роли субъекта. Такой перевод не вносит отсутствующего в тексте уточнения о поклонниках чужого бога.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и достойный. Сохранена сжатость пророческого повествования и неоднозначность оборота «с чужим богом».
