id: DAN.11.9
reference: Daniel 11:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָ֗א בְּ/מַלְכוּת֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/שָׁ֖ב אֶל אַדְמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/009.yaml
  text: Then he will come into the realm of the king of the South[a], but he will return to his own land.
translation:
  language: ru
  text: Тогда он войдёт во владения южного царя, но возвратится в свою землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: Тогда он войдёт
  rationale: Сочетание waw с перфектом в пророческом повествовании передаёт последующее будущее действие. «Тогда» естественно связывает стих с предыдущими событиями, а «войдёт» в сочетании с направительным בְ ясно выражает вступление в чужие владения.
- source_word: בְּמַלְכוּת
  choice: во владения
  rationale: מַלְכוּת может обозначать царство, царскую власть или подвластную территорию. Здесь военно-политический контекст указывает на территориальные владения; направительное значение בְ передано предлогом «во».
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: южного царя
  rationale: В Дан 11 это устойчивое геополитическое обозначение правителя южной державы. Русское «южный царь» естественно и не превращает הַנֶּגֶב в местное название Негев.
- source_word: וְשָׁב
  choice: но возвратится
  rationale: Формально waw означает «и», однако возвращение образует смысловой поворот после вторжения. Союз «но» естественно передаёт этот контраст, не устраняя самого значения глагола שׁוב.
- source_word: אֶל אַדְמָתוֹ
  choice: в свою землю
  rationale: אֲדָמָה здесь обозначает родную территорию правителя, а не почву как вещество. Возвратный притяжательный оборот «в свою землю» идиоматично передаёт суффикс третьего лица.
