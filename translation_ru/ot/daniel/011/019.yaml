  text: וְ/יָשֵׁ֣ב פָּנָ֔י/ו לְ/מָעוּזֵּ֖י אַרְצ֑/וֹ וְ/נִכְשַׁ֥ל וְ/נָפַ֖ל וְ/לֹ֥א יִמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/019.yaml
  text: Then he will turn his face toward the fortresses of his own land[a], but he will stumble and fall[b], and he will not be found.
translation:
  language: ru
  text: Тогда он обратит лицо к крепостям своей земли[a], но споткнётся и падёт, и его не найдут[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к укреплениям своей земли». Еврейское слово обозначает место силы, защиты или убежище.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и не будет найден». Этот оборот означает, что он исчезнет со сцены, вероятно вследствие смерти или свержения, но не уточняет, как именно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֵׁב
  choice: Тогда он обратит
  rationale: Глагол שׁוב означает «повернуться, возвратиться»; вместе с «лицо» здесь естественно передаёт смену направления. «Тогда» плавно выражает повествовательную связь.
- source_word: פָּנָיו
  choice: лицо
  rationale: Сохранён буквальный образ, который в данном обороте обозначает направленность движения или внимания.
- source_word: לְמָעוּזֵּי
  choice: к крепостям
  rationale: מָעוֹז обозначает укреплённое место, оплот или убежище; в военно-политическом контексте наиболее естественно «крепости».
- source_word: אַרְצוֹ
  choice: своей земли
  rationale: אֶרֶץ здесь означает принадлежащую ему землю или страну; возвратное «своей» естественно соотносит её с подлежащим.
- source_word: וְנִכְשַׁל
  choice: но споткнётся
  rationale: Нифаль глагола כשל передаёт падение или преткновение. «Но» уместно выражает контекстуальный перелом, не устраняя образ.
- source_word: וְנָפַל
  choice: и падёт
  rationale: נפל буквально означает «пасть». «Падёт» соответствует возвышенному повествовательному регистру и сохраняет последовательность «споткнётся и падёт».
- source_word: וְלֹא יִמָּצֵא
  choice: и его не станет
  rationale: 'Буквально: «и не будет найден». Русский идиоматический оборот «его не станет» передаёт исчезновение со сцены и вероятную смерть, не уточняя её обстоятельств.'
theological_decisions:
- issue: Характер окончательного исчезновения правителя
  choice: Не уточнять способ его гибели или устранения
  alternative: Прямо сказать, что он умрёт или будет свергнут
  rationale: Еврейский текст использует косвенное «не будет найден», поэтому перевод сохраняет недосказанность и не определяет конкретный исход сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ «обратить лицо» и последовательность «споткнётся и падёт»; заключительная идиома передана естественно по-русски, а буквальная форма вынесена в примечание.
