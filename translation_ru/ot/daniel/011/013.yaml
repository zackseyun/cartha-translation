base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/013.yaml
  text: Then the king of the north will return and raise a multitude greater than the former one[a]; and at the end of the times, after some years[c][b], he will surely come with a great army and with much equipment.
translation:
  language: ru
  text: Тогда царь севера вернётся и соберёт войско многочисленнее прежнего[a]. К концу сроков, спустя годы[b], он непременно придёт с великим войском и огромными запасами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и соберёт великое множество, больше прежнего». Еврейское выражение может подчёркивать как численность, так и величину собранных сил.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к концу назначенных времён, спустя годы». Еврейское выражение сжато и может подчёркивать завершение установленного срока.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «с огромным имуществом» или «со множеством снаряжения». Еврейское слово широко обозначает имущество и материальные средства, сопровождающие поход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Тогда ... вернётся
  rationale: Глагол שׁוּב означает «возвращаться», а союз וְ продолжает повествование; «тогда» естественно передаёт последовательность событий.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: царь севера
  rationale: Сохраняет устойчивый в этой главе титул и буквальное указание направления.
- source_word: וְהֶעֱמִיד הָמוֹן רַב
  choice: соберёт войско
  rationale: Порода Hiphil глагола עמד здесь указывает на выставление или сбор сил; הָמוֹן в военном контексте обозначает многочисленную массу людей. Русское «соберёт войско» ясно выражает контекст, не добавляя вида войск.
- source_word: מִן הָרִאשׁוֹן
  choice: многочисленнее прежнего
  rationale: Предлог מִן имеет сравнительное значение, а «прежнего» отсылает к ранее упомянутому войску.
- source_word: וּלְקֵץ הָעִתִּים שָׁנִים
  choice: По прошествии времён, через несколько лет
  rationale: Сжатая еврейская конструкция содержит как идею завершения периодов времени, так и упоминание лет; перевод сохраняет оба элемента и некоторую неоднозначность их соотношения.
- source_word: יָבוֹא בּוֹא
  choice: он непременно придёт
  rationale: Сочетание личной формы глагола с абсолютным инфинитивом усиливает уверенность или интенсивность действия.
- source_word: בְּחַיִל גָּדוֹל
  choice: с великим войском
  rationale: חַיִל может означать силу, богатство или войско; военный контекст делает значение «войско» наиболее вероятным.
- source_word: וּבִרְכוּשׁ רָב
  choice: и огромными запасами
  rationale: רְכוּשׁ обозначает имущество, достояние или материальные ресурсы; в контексте похода «запасы» естественно передаёт ресурсы, сопровождающие войско, не сводя их только к оружию.
