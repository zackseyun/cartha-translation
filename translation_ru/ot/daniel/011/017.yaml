base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/017.yaml
  text: He will set his face to come with the strength of his whole kingdom[a], and upright terms will be with him; and he will act. He will give him the daughter of women to destroy it, but she will not stand[d][c][b], and she will not be for him.
translation:
  language: ru
  text: И он намерится прийти со всей силой своего царства; справедливые условия будут с ним[a], и он будет действовать. Он отдаст ему дочь женщин[b], чтобы погубить её[c], но она не устоит[d] и не будет на его стороне[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с ним будут люди праведные (или честные)»; возможно также: «он заключит с ним соглашение». Еврейское выражение буквально означает «прямые, справедливые» и в этом контексте может обозначать либо людей, либо справедливые условия или договорённости.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «дочь женщин». Вероятно, имеется в виду царская дочь, которую отдают замуж ради политического союза.'
    reason: cultural_note
  - marker: c
    text: Еврейский местоименный суффикс имеет форму женского рода. Он может относиться к женщине либо к иному объекту, например царству или замыслу, обозначенному в еврейском языке словом женского рода.
    reason: lexical_alternative
  - marker: d
    text: 'Или: «но это не осуществится»; возможно также: «но она не преуспеет». Форма женского рода может относиться как к женщине, так и к задуманному предприятию.'
    reason: alternative_reading
  - marker: e
    text: 'Буквально: «и не будет ему/для него». Возможны оттенки принадлежности, выгоды или лояльности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֵׂם פָּנָיו
  choice: он решит
  rationale: Еврейская идиома буквально означает «обратит/устремит своё лицо» и выражает твёрдое намерение. В современном русском «решит» естественно передаёт решимость, не сохраняя неясный буквализм.
- source_word: לָבוֹא
  choice: прийти
  rationale: Глагол בוא имеет широкое значение «приходить, входить». Перевод «вторгнуться» был бы более конкретным, чем исходный текст.
- source_word: בְּתֹקֶף כָּל מַלְכוּתוֹ
  choice: со всей силой своего царства
  rationale: תֹּקֶף обозначает силу или мощь; конструкция указывает на совокупную силу всего царства.
- source_word: וִישָׁרִים עִמּוֹ
  choice: с ним будут и праведные
  rationale: ישרים — форма множественного числа прилагательного «прямые, праведные», которая на поверхности текста может обозначать людей. Контекст допускает дипломатическое понимание — «справедливые условия» или «соглашение»; оно сохранено в сноске.
- source_word: וְעָשָׂה
  choice: он осуществит задуманное
  rationale: Буквально «и сделает». В данном контексте русская формулировка передаёт совершение намеченного действия, не уточняя его содержание.
- source_word: וּבַת הַנָּשִׁים
  choice: дочь женщин
  rationale: Сохранено необычное еврейское выражение. Вероятнее всего, речь идёт о царской дочери, выдаваемой замуж ради политического союза, но сам текст этого прямо не поясняет.
- source_word: יִתֶּן לוֹ
  choice: отдаст ему
  rationale: В контексте женщины и предполагаемого брачного союза «отдаст ему» звучит естественно и сохраняет значение передачи, выраженное נתן.
- source_word: לְהַשְׁחִיתָהּ
  choice: чтобы погубить её
  rationale: Местоименный суффикс женского рода допускает отнесение к женщине, а также к подразумеваемому царству или замыслу. Основной текст следует ближайшему возможному референту, сохраняя альтернативы в сноске.
- source_word: וְלֹא תַעֲמֹד
  choice: но она не устоит
  rationale: Глагол стоит в женском роде и буквально означает «не встанет/не устоит». Местоимение может относиться к дочери либо к замыслу; русская формулировка сохраняет это напряжение настолько, насколько позволяет грамматика.
- source_word: וְלֹא לוֹ תִהְיֶה
  choice: и не будет на его стороне
  rationale: Краткая еврейская конструкция буквально означает «и не будет ему/для него». Перевод естественно выражает вероятную политическую лояльность, тогда как значение принадлежности остаётся возможным.
