source:
  edition: WLC
  text: וּ/בָ֨אוּ ב֜/וֹ צִיִּ֤ים כִּתִּים֙ וְ/נִכְאָ֔ה וְ/שָׁ֛ב וְ/זָעַ֥ם עַל בְּרִֽית ק֖וֹדֶשׁ וְ/עָשָׂ֑ה וְ/שָׁ֣ב וְ/יָבֵ֔ן עַל עֹזְבֵ֖י בְּרִ֥ית קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/030.yaml
  text: For ships of Kittim will come against him[a], and he will be disheartened. Then he will turn back and rage against the holy covenant, and he will act[b]. He will turn back and pay attention to those who forsake the holy covenant.
translation:
  language: ru
  text: Ибо против него придут корабли Киттима[a], и он падёт духом. Он повернёт назад, разгневается на святой завет и будет действовать. Затем он снова обратится и уделит внимание[b] тем, кто оставляет святой завет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корабли из Киттима». Киттим может обозначать Кипр или, шире, западные морские державы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проявит расположение к» тем, кто оставляет святой завет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים כִּתִּים
  choice: корабли Киттима
  rationale: צִיִּים в данном военно-морском контексте обозначает суда или морские силы, а כִּתִּים — Киттим, то есть Кипр либо шире западные морские державы. Традиционное географическое название сохраняет открытость референции.
- source_word: וְנִכְאָה
  choice: и он падёт духом
  rationale: Форма передаёт подавленность, испуг или унижение после столкновения; русское выражение естественно передаёт внутреннюю сломленность, не утверждая физического уничтожения.
- source_word: וְשָׁב
  choice: он повернёт назад / затем он снова обратится
  rationale: Повторяющийся глагол שׁוב обозначает смену направления или возвращение. В первом случае контекст требует отступления, во втором — нового обращения к определённой группе.
- source_word: וְזָעַם עַל
  choice: изольёт ярость на
  rationale: זעם выражает сильный гнев или негодование, направленное против объекта; формулировка передаёт враждебное действие естественным современным русским языком.
- source_word: בְּרִית קֹדֶשׁ / בְּרִית קוֹדֶשׁ
  choice: святой завет
  rationale: Прямо сохраняется характеристика завета как святого без добавочного уточнения его участников или богословского содержания.
- source_word: וְעָשָׂה
  choice: и начнёт действовать
  rationale: Глагол עשה здесь употреблён без названного объекта и остаётся широким по смыслу. Перевод сохраняет лаконичность и не конкретизирует неуказанное действие.
- source_word: וְיָבֵן עַל
  choice: и уделит внимание
  rationale: בין в данной конструкции означает обратить внимание, принять во внимание или проявить расположение. Основной текст сохраняет широкий смысл, не утверждая прямо союза или сговора.
- source_word: עֹזְבֵי
  choice: тем, кто оставляет
  rationale: Причастие обозначает людей, покидающих или отвергающих завет. Нейтральная формулировка не вводит более позднего технического термина.
theological_decisions:
- issue: Референт выражения «святой завет»
  choice: Сохранить «святой завет» без дальнейшего уточнения.
  alternative: «завет Бога с Израилем» или «иудейский завет»
  rationale: Контекст связывает завет со святым народом и богослужением, однако сам стих не даёт развёрнутого определения; перевод не должен сужать его смысл.
- issue: Характер отношения к оставляющим завет
  choice: «уделит внимание»
  alternative: «проявит расположение» или «войдёт в сговор»
  rationale: Контекст допускает благосклонность или политическое сотрудничество, но значение וְיָבֵן само по себе шире. Более нейтральный вариант сохраняет смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис остаётся сжатым, как в еврейском тексте; при этом повторы שׁוב переданы разными естественными оборотами по непосредственному контексту.
