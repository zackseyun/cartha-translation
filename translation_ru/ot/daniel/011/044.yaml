base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/044.yaml
  text: But reports from the east and from the north will alarm him[b][a], and he will go out with great fury to destroy and to devote many to destruction.
translation:
  language: ru
  text: Но вести с востока и с севера встревожат его[a], и он выступит в великой ярости, чтобы истребить и предать заклятию многих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слухи» либо «сообщения».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может означать «наложить заклятие» или «предать уничтожению»; его смысл сильнее и специфичнее, чем у предшествующего глагола «истребить».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֻעוֹת
  choice: вести
  rationale: Множественное число обозначает услышанные сведения или сообщения. «Вести» естественно звучит по-русски и не сводит смысл к неподтверждённым слухам.
- source_word: יְבַהֲלֻהוּ
  choice: встревожат его
  rationale: Пиэль от בהל выражает причинение внезапного смятения или тревоги; этот перевод сохраняет каузативный смысл, не усиливая его до ужаса.
- source_word: מִמִּזְרָח וּמִצָּפוֹן
  choice: с востока и с севера
  rationale: Сохраняется параллельное обозначение направлений с предлогом מן.
- source_word: וְיָצָא
  choice: и он выступит
  rationale: В данном военном контексте «выступит» естественно передаёт выход для действия, не добавляя более конкретного указания на поход или сражение.
- source_word: בְּחֵמָא גְדֹלָה
  choice: в великой ярости
  rationale: חֵמָה означает гнев, ярость; выражение сохраняет силу образа и определение «великая».
- source_word: לְהַשְׁמִיד
  choice: чтобы истребить
  rationale: Хифиль от שׁמד означает уничтожить или истребить. «Истребить» уместно в военном контексте и позволяет отличить этот глагол от следующего חרם.
- source_word: וּלְהַחֲרִים
  choice: и предать заклятию
  rationale: Хифиль от חרם обозначает предание заклятию, обычно с последующим уничтожением. Традиционный русский оборот сохраняет специальный смысл, который поясняется в сноске.
- source_word: רַבִּים
  choice: многих
  rationale: Прямой и естественный перевод субстантивированного прилагательного со значением множества людей.
theological_decisions:
- issue: Передача חרם в контексте военного уничтожения
  choice: предать заклятию
  alternative: полностью уничтожить; обречь на уничтожение
  rationale: В еврейском тексте לְהַשְׁמִיד и וּלְהַחֲרִים различаются. Перевод сохраняет особый смысл חרם и не превращает два глагола в простые синонимы, не добавляя при этом конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, соответствующим пророческому повествованию звучанием. Специальный оборот «предать заклятию» сохранён ради смыслового различия между двумя еврейскими глаголами и пояснён в сноске.
