base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/020.yaml
  text: Then one will arise in his place who will send an exactor through the splendor of the kingdom[a]; but within a few days he will be broken[c][b], though not in anger and not in battle.
translation:
  language: ru
  text: И на его месте восстанет тот, кто пошлёт сборщика податей через славное царство[a]. Но через несколько дней он будет сокрушён — не во гневе и не в сражении[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проведёт сборщика податей через великолепие царства». Еврейское выражение может обозначать как славную часть владений, так и величие царства в целом; слово, переведённое как «сборщик податей», может также означать взыскателя дани или притеснителя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но не посредством гнева и не в войне». Еврейское выражение здесь сжато; предлог может передавать обстоятельственный или орудийный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל כַּנּוֹ
  choice: И на его месте восстанет
  rationale: Устойчивая формула преемства в Дан 11 указывает на появление следующего правителя; «восстанет» сохраняет образ еврейского глагола и звучит естественно в повествовании.
- source_word: מַעֲבִיר
  choice: кто пошлёт ... через
  rationale: Причастие породы хифиль выражает побуждение пройти; в данном административном контексте естественный русский эквивалент — «пошлёт ... через».
- source_word: נוֹגֵשׂ
  choice: сборщика податей
  rationale: Слово обозначает человека, взыскивающего дань или обязательные платежи. Этот вариант понятен современному читателю и не сужает значение до обычного служащего налогового ведомства.
- source_word: הֶדֶר מַלְכוּת
  choice: славное царство
  rationale: Конструкция допускает понимание как «великолепие царства», так и обозначение славной, лучшей части владений. Основной текст передаёт её естественно, а неоднозначность отмечена в сноске.
- source_word: וּבְיָמִים אֲחָדִים
  choice: Но через несколько дней
  rationale: Фраза указывает на краткий срок и не обязательно требует строго буквального числа дней.
- source_word: יִשָּׁבֵר
  choice: он будет сокрушён
  rationale: Страдательная форма שבר метафорически описывает гибель или устранение правителя; «сокрушён» сохраняет исходный образ, не уточняя способ его конца.
- source_word: וְלֹא בְאַפַּיִם
  choice: не во гневе
  rationale: אַפַּיִם обычно означает гнев или ярость, а ב допускает обстоятельственное либо орудийное понимание. Буквально сдержанная формулировка сохраняет сжатость и неоднозначность оригинала.
- source_word: וְלֹא בְמִלְחָמָה
  choice: и не в сражении
  rationale: «Сражение» естественно обозначает непосредственный военный способ гибели и сохраняет противопоставление необычному концу правителя.
