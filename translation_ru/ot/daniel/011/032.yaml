  text: וּ/מַרְשִׁיעֵ֣י בְרִ֔ית יַחֲנִ֖יף בַּ/חֲלַקּ֑וֹת וְ/עַ֛ם יֹדְעֵ֥י אֱלֹהָ֖י/ו יַחֲזִ֥קוּ וְ/עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/032.yaml
  text: He will corrupt with smooth words those who act wickedly against the covenant[b][a], but the people who know their God will stand firm and take action.
translation:
  language: ru
  text: Тех, кто поступает нечестиво против завета, он совратит гладкими речами[a], но народ, знающий своего Бога, устоит и будет действовать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лестью».'
    reason: Лексическая альтернатива для בַּחֲלַקּוֹת, которое может обозначать как «гладкие речи», так и прямо лесть.
  - marker: b
    text: 'Или: «будет силён и будет действовать». В еврейском тексте глаголы стоят во множественном числе: «будут сильны и будут действовать».'
    reason: Сохраняет более формальную передачу יַחֲזִקוּ וְעָשׂוּ и поясняет, что русское единственное число обусловлено собирательным словом «народ».
lexical_decisions:
- source_word: וּמַרְשִׁיעֵי בְרִית
  choice: тех, кто поступает нечестиво против завета
  rationale: Причастная форма от רשע обозначает поступающих нечестиво или виновных; сочетание с בְרִית описывает их нечестие по отношению к завету. Формулировка сохраняет эту связь, не сужая смысл до одного конкретного вида нарушения.
- source_word: יַחֲנִיף
  choice: совратит
  rationale: Hiphil от חנף здесь указывает на приведение к нечестию или нравственно-религиозное развращение. «Совратит» естественно передаёт направленное воздействие посредством льстивой речи, не добавляя более узкого смысла.
- source_word: בַּחֲלַקּוֹת
  choice: гладкими речами
  rationale: Слово от חלק буквально связано с гладкостью и идиоматически обозначает льстивую, вкрадчивую речь. Перевод сохраняет образ; значение «лестью» дано в сноске.
- source_word: וְעַם
  choice: но народ
  rationale: Хотя וְ формально означает «и», здесь оно вводит явное противопоставление между отступниками и знающими Бога, поэтому по-русски уместно «но».
- source_word: יֹדְעֵי אֱלֹהָיו
  choice: знающий своего Бога
  rationale: Причастие выражает устойчивое, личное и заветное знание Бога. Единственное число согласовано с собирательным существительным «народ», а «своего» естественно передаёт местоименный суффикс.
- source_word: יַחֲזִקוּ
  choice: устоит
  rationale: Форма от חזק в данном контексте передаёт крепость и стойкость перед давлением. «Устоит» ясно выражает результативную стойкость, тогда как более формальное «проявит силу» сохраняется в сноске.
- source_word: וְעָשׂוּ
  choice: и будет действовать
  rationale: עשה имеет широкое значение «делать, действовать». В контексте сопротивления речь идёт о реальных действиях, но перевод не добавляет традиционного и более узкого значения «совершит подвиги».
theological_decisions:
- issue: Характер ответа верных в заключительной части стиха
  choice: Народ, знающий Бога, сохраняет стойкость и действует.
  alternative: 'Более формально: «проявит силу и будет действовать» или «укрепятся и будут делать».'
  rationale: Так сохраняется противопоставление между совращёнными нарушителями завета и верным Богу народом. Перевод передаёт решительность, но не уточняет характер действий и не вводит позднейших богословских толкований.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Тон сдержанный и возвышенный без архаизмов; образ «гладких речей» сохранён, а синтаксис приспособлен к естественному согласованию с собирательным словом «народ».
