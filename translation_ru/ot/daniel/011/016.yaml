  text: וְ/יַ֨עַשׂ הַ/בָּ֤א אֵלָי/ו֙ כִּ/רְצוֹנ֔/וֹ וְ/אֵ֥ין עוֹמֵ֖ד לְ/פָנָ֑י/ו וְ/יַעֲמֹ֥ד בְּ/אֶֽרֶץ הַ/צְּבִ֖י וְ/כָלָ֥ה בְ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/016.yaml
  text: And the one who comes against him will do as he pleases[a], and no one will stand before him. He will stand in the Beautiful Land[b], and it will be consumed in his hand.
translation:
  language: ru
  text: Тот, кто выступит против него, будет поступать по своей воле, и никто не устоит перед ним. Он утвердится в Прекрасной земле[a], и разорение будет в его руке[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Славной земле». Еврейское выражение обозначает землю красоты или великолепия; здесь имеется в виду земля Израиля/Иудеи.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза предельно кратка. Возможен также перевод: «и она будет разорена его рукой». Выражение может указывать на разрушительную силу, находящуюся под его контролем.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַעַשׂ
  choice: будет поступать
  rationale: Глагол עשה имеет широкое значение «делать, поступать». В данном контексте «будет поступать» естественно передаёт свободу действий, не уточняя их сверх сказанного.
- source_word: הַבָּא אֵלָיו
  choice: тот, кто выступит против него
  rationale: Предлог אֶל буквально указывает движение к кому-либо, но военный контекст придаёт выражению значение враждебного выступления.
- source_word: כִּרְצוֹנוֹ
  choice: по своей воле
  rationale: Формально и ясно передаёт «согласно его желанию/воле», подчёркивая беспрепятственность действий.
- source_word: וְאֵין עוֹמֵד לְפָנָיו
  choice: и никто не устоит перед ним
  rationale: Сохраняет образ стояния перед противником и естественно выражает неспособность оказать сопротивление.
- source_word: וְיַעֲמֹד
  choice: Он утвердится
  rationale: В военно-политическом контексте עמד означает не только физически «стоять», но и занять прочное положение; «утвердится» естественно передаёт этот оттенок.
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: в Прекрасной земле
  rationale: צְבִי здесь обозначает красоту, великолепие или желанность и служит наименованием земли Израиля/Иуды. Перевод сохраняет образное географическое название.
- source_word: וְכָלָה בְיָדוֹ
  choice: и она будет разорена его рукой
  rationale: Краткая и эллиптическая фраза допускает понимание כָלָה как формы со значением завершения или уничтожения, относящейся к земле. «Разорена его рукой» естественно передаёт результат завоевания, не усиливая его до обязательного полного истребления.
theological_decisions:
- issue: К чему относится название «Прекрасная земля»
  choice: К земле Израиля/Иуды в рамках видения Даниила
  alternative: Общее обозначение некой прекрасной или славной земли без явной идентификации
  rationale: В книге Даниила это выражение функционирует как географическое название. Основной текст сохраняет образ, а примечание поясняет референт без внесения дополнительных богословских выводов.
- issue: Смысл заключительной фразы וְכָלָה בְיָדוֹ
  choice: Земля будет разорена его рукой
  alternative: Разорение будет в его руке, то есть разрушительная сила окажется под его контролем
  rationale: Еврейская фраза предельно сжата и допускает как глагольное понимание, относящееся к земле, так и понимание כָלָה как обозначения гибели или разорения. Альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Сохранены военный контекст, образное название земли и неоднозначность заключительной еврейской фразы; архаические и конфессионально окрашенные формулы не использованы.
