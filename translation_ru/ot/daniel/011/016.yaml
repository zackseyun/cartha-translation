  naturalness: «Тот, кто выступит против него», «по своей воле», «никто не устоит перед ним» и «утвердится» естественны для современного литературного русского и соответствуют возвышенному повествовательному регистру. Формула «разорение будет в его руке» несколько образна, но намеренно сохраняет компактность и метафору оригинала; пояснение дано в примечании.
