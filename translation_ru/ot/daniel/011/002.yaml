source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֱמֶ֖ת אַגִּ֣יד לָ֑/ךְ הִנֵּה עוֹד֩ שְׁלֹשָׁ֨ה מְלָכִ֜ים עֹמְדִ֣ים לְ/פָרַ֗ס וְ/הָֽ/רְבִיעִי֙ יַעֲשִׁ֤יר עֹֽשֶׁר גָּדוֹל֙ מִ/כֹּ֔ל וּ/כְ/חֶזְקָת֣/וֹ בְ/עָשְׁר֔/וֹ יָעִ֣יר הַ/כֹּ֔ל אֵ֖ת מַלְכ֥וּת יָוָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/002.yaml
  text: 'And now I will tell you the truth: behold[a], three more kings will arise for Persia, and the fourth will become far richer than all of them; and when he becomes strong through his riches[c][b], he will stir up everyone against the kingdom of Greece.'
translation:
  language: ru
  text: 'И теперь я возвещу тебе истину: вот, у Персии появятся ещё три царя[a]. Четвёртый же разбогатеет больше всех, и, став сильным благодаря своему богатству, он поднимет всех[b] против царства Греции[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ещё три царя встанут для Персии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приведёт в движение всё».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «царства Явана»; Яван — древнееврейское название Греции и греков.'
    reason: historical_name
lexical_decisions:
- source_word: וְעַתָּה אֱמֶת אַגִּיד לָךְ
  choice: И теперь я возвещу тебе истину
  rationale: 'Сохраняет соединительное «и», переход к следующему этапу откровения и торжественный, но понятный смысл глагола נגד в породе хифиль: «сообщить, возвестить».'
- source_word: הִנֵּה
  choice: вот
  rationale: Естественно передаёт указательно-эмфатическую функцию частицы в современном литературном русском языке.
- source_word: עוֹד שְׁלֹשָׁה מְלָכִים עֹמְדִים לְפָרַס
  choice: у Персии появятся ещё три царя
  rationale: «Ещё» передаёт добавочное значение עוֹד; конструкция «у Персии появятся» естественно выражает принадлежность царей Персидскому царству, сохраняя отношение, обозначенное לְ, без неестественного русского «восстанут для Персии».
- source_word: יַעֲשִׁיר עֹשֶׁר גָּדוֹל מִכֹּל
  choice: разбогатеет больше всех
  rationale: Кратко и естественно передаёт усилительную конструкцию с однокоренными глаголом и существительным, а также сравнительное מִכֹּל.
- source_word: וּכְחֶזְקָתוֹ בְעָשְׁרוֹ
  choice: став сильным благодаря своему богатству
  rationale: Передаёт обстоятельственно-временную функцию כְ и связь силы царя с его богатством, не уточняя сверх текста, является ли богатство единственным источником его силы.
- source_word: יָעִיר הַכֹּל
  choice: поднимет всех
  rationale: Глагол עור в хифиле означает «пробудить, поднять, побудить»; в военно-политическом контексте «поднимет» допускает как мобилизацию, так и подстрекательство. «Всех» естественно понимается как совокупность людей, но буквальная широта הַכֹּל отмечена в сноске.
- source_word: אֵת מַלְכוּת יָוָן
  choice: против царства Греции
  rationale: 'В данном контексте сочетание с יָעִיר получает направленно-враждебный смысл: царь поднимает всех против греческого царства. Традиционное географическое соответствие יָוָן — Греция; исходное имя указано в сноске.'
theological_decisions:
- issue: Историко-политический смысл заключительной части стиха
  choice: Богатый четвёртый персидский царь поднимет находящихся под его властью людей против греческого царства.
  alternative: Он приведёт в движение всё, включая греческое царство, либо поднимет всех вместе с греческим царством.
  rationale: Контекст военного противостояния и употребление עור поддерживают направленно-враждебное понимание. При этом перевод не отождествляет царя с конкретной исторической личностью, поскольку сам стих её не называет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Архаическое «се» заменено на ясное «вот»; громоздкие буквальные конструкции вынесены в сноски. Синтаксис разделён на два предложения для удобства чтения без изменения логической связи.
