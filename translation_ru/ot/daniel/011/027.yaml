  text: וּ/שְׁנֵי/הֶ֤ם הַ/מְּלָכִים֙ לְבָבָ֣/ם לְ/מֵרָ֔ע וְ/עַל שֻׁלְחָ֥ן אֶחָ֖ד כָּזָ֣ב יְדַבֵּ֑רוּ וְ/לֹ֣א תִצְלָ֔ח כִּי ע֥וֹד קֵ֖ץ לַ/מּוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/027.yaml
  text: As for both of them[a], the kings—their hearts are set on evil, and at one table they will speak lies, but it will not succeed[c][b], for the end is still for the appointed time.
translation:
  language: ru
  text: 'У обоих царей сердца будут устремлены ко злу; за одним столом они будут говорить ложь[a], но успеха не будет[b], ибо конец ещё не настал: он наступит в назначенный срок[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут говорить ложь»; возможно также: «будут говорить лживо» или «будут лгать».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но это не будет иметь успеха». Еврейский глагол стоит в женском роде единственного числа при невыраженном подлежащем; он, вероятно, относится к их замыслу, делу или исходу.'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Или: «ибо конец ещё [предстоит] к назначенному времени». Формулировка подчёркивает, что исход наступит лишь в установленный срок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵיהֶם הַמְּלָכִים
  choice: У обоих этих царей
  rationale: Сочетание указывает на двух царей, уже известных из контекста. Такая конструкция естественно вводит их как общую тему высказывания.
- source_word: לְבָבָם לְמֵרָע
  choice: сердца будут устремлены ко злу
  rationale: 'Буквально: «их сердце — ко злу». Множественное «сердца» естественно по-русски передаёт злой умысел обоих царей, а «устремлены» сохраняет направленность их намерений.'
- source_word: וְעַל שֻׁלְחָן אֶחָד
  choice: Сидя за одним столом
  rationale: Сохраняется конкретный образ совместной трапезы или переговоров; деепричастная конструкция звучит естественно в современном русском.
- source_word: כָּזָב יְדַבֵּרוּ
  choice: они будут говорить друг другу ложь
  rationale: כָּזָב означает ложь или обман. «Друг другу» ясно передаёт взаимную ложь двух правителей в данной сцене, не меняя сути исходного выражения.
- source_word: וְלֹא תִצְלָח
  choice: но их замысел не увенчается успехом
  rationale: Глагол стоит в женском роде единственного числа без явно названного подлежащего и, вероятно, безлично относится к замыслу или исходу их действий. Подстановка «их замысел» делает русский текст ясным, не уточняя содержание замысла.
- source_word: כִּי עוֹד קֵץ לַמּוֹעֵד
  choice: ведь конец ещё впереди — в назначенное время
  rationale: Формулировка сохраняет значение отсроченного конца и его связи с установленным сроком, оставаясь естественной по-русски.
theological_decisions:
- issue: Предполагаемый Божий суверенитет в словах о назначенном времени
  choice: Сохранить указание на назначенное время, не добавляя прямого упоминания Бога
  alternative: «ведь конец наступит в назначенное Богом время»
  rationale: В контексте книги установленный срок подразумевает Божье владычество над историей, однако в самом стихе Бог прямо не назван. Перевод не делает подразумеваемое утверждение явным.
- issue: Неопределённое подлежащее при וְלֹא תִצְלָח
  choice: «их замысел не увенчается успехом»
  alternative: «но это не увенчается успехом»
  rationale: Женская форма единственного числа допускает безличное понимание и может относиться к замыслу, делу или исходу. «Замысел» обеспечивает ясность, не связывая неудачу только с ложными словами одного из царей.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранён образ одного стола и напряжение между человеческим обманом и установленным сроком конца; архаичные обороты исключены.
