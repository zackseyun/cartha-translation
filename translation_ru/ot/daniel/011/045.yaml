  text: וְ/יִטַּע֙ אָהֳלֶ֣י אַפַּדְנ֔/וֹ בֵּ֥ין יַמִּ֖ים לְ/הַר צְבִי קֹ֑דֶשׁ וּ/בָא֙ עַד קִצּ֔/וֹ וְ/אֵ֥ין עוֹזֵ֖ר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/045.yaml
  text: He will pitch the tents of his royal pavilion between the seas and the beautiful holy mountain[a]; yet he will come to his end[b], and there will be no one to help him.
translation:
  language: ru
  text: Он раскинет шатры своего царского павильона[a] между морями и прекрасной святой горой[b]. Но он придёт к своему концу, и никто ему не поможет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дворца», «дворцового шатра» или «павильона». Редкое слово, вероятно, обозначает царскую резиденцию или государственный павильон.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «горой святого великолепия» либо «славной святой горой». Еврейское выражение может обозначать святую гору в её красоте или великолепии; вероятно, имеется в виду Сион или Иерусалим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִטַּע
  choice: Он раскинет
  rationale: Глагол נטע буквально означает «сажать», но с шатрами идиоматически передаёт их установку; по-русски естественно «раскинуть шатры».
- source_word: אָהֳלֵי
  choice: шатры
  rationale: Сохранено множественное число, которое может обозначать царский походный комплекс.
- source_word: אַפַּדְנוֹ
  choice: своего царского павильона
  rationale: Редкое заимствованное слово, вероятно, обозначает дворец либо царский походный павильон; контекст шатров поддерживает второй вариант.
- source_word: בֵּין יַמִּים
  choice: между морями
  rationale: Сохранено буквальное множественное число географического выражения без уточнения, отсутствующего в еврейском тексте.
- source_word: לְהַר צְבִי קֹדֶשׁ
  choice: и прекрасной святой горой
  rationale: צבי может выражать красоту, великолепие или славу; конструкция понимается как второй ориентир после «между» и не получает добавленного географического имени.
- source_word: וּבָא עַד קִצּוֹ
  choice: Но он придёт к своему концу
  rationale: Передан естественный русский оборот и контекстуальное противопоставление его внешней силе, хотя союз буквально может быть простым соединительным.
- source_word: וְאֵין עוֹזֵר לוֹ
  choice: и никто ему не поможет
  rationale: Естественно передаёт отсутствие какого-либо помощника.
theological_decisions:
- issue: Кого обозначает действующее лицо в Дан 11:45
  choice: Оставить его не названным, используя местоимение «он»
  alternative: Антиох IV Эпифан; эсхатологический антихрист; собирательный или типологический правитель
  rationale: Еврейский текст не называет лицо в этом стихе, поэтому перевод не разрешает спорный вопрос толкования.
- issue: Отождествление святой горы
  choice: Не добавлять в основной текст названия «Сион» или «Иерусалим»
  alternative: Явно назвать Сион или Иерусалим
  rationale: Такое отождествление вероятно по контексту, но в самом выражении географическое имя отсутствует.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но понятный библейский регистр. Сохранены множественное число «морями» и неопределённость относительно личности правителя. Маркер [a] поставлен непосредственно после спорного географического выражения; примечание также поясняет редкое אַפַּדְנוֹ без дополнительного маркера.
