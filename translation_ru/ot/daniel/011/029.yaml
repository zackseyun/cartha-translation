  yaml_path: translation/ot/daniel/011/029.yaml
  text: At the appointed time he will return and come into the south[a], but it will not be as the former or as the latter.
translation:
  language: ru
  text: В назначенное время он вернётся и придёт на юг, но будет не так, как в прежний и последующий раз.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст выражен сжато: буквально сказано «не будет как первая/прежняя и как последняя/последующая», без названного предмета сравнения. Возможен также перевод: «но будет не так, как прежде и впоследствии».'
    reason: Передаёт эллиптический характер сравнения и отмечает допустимое временное понимание, не навязывая конкретный референт.
lexical_decisions:
- source_word: לַמּוֹעֵד
  choice: В назначенное время
  rationale: מוֹעֵד обозначает установленное, назначенное время; перевод сохраняет временную определённость, не придавая слову значения праздника или собрания.
- source_word: יָשׁוּב
  choice: он вернётся
  rationale: Глагол שׁוּב в породе qal обычно означает «вернуться» или «повернуть назад»; в контексте повторного военного похода естественно «вернётся».
- source_word: וּבָא
  choice: и придёт
  rationale: בוא означает «приходить, входить». Буквальное сочетание двух глаголов движения сохранено, поскольку оно понятно по-русски и передаёт последовательность еврейского текста.
- source_word: בַנֶּגֶב
  choice: на юг
  rationale: נֶגֶב может обозначать Негев, однако в геополитическом противопоставлении севера и юга в Дан 11 речь идёт о южной стране или царстве. Русское «на юг» естественно передаёт направление похода.
- source_word: וְלֹא תִהְיֶה
  choice: но всё будет не так
  rationale: Форма женского рода, вероятно, подразумевает поход или военную экспедицию, прямо не названные в тексте. Безличная русская конструкция сохраняет неопределённость референта.
- source_word: כָרִאשֹׁנָה
  choice: как в прежний раз
  rationale: רִאשׁוֹנָה может значить «первая» или «прежняя». Выражение «в прежний раз» естественно по-русски и сохраняет сжатое сравнение.
- source_word: וְכָאַחֲרֹנָה
  choice: и в последующий раз
  rationale: אַחֲרוֹנָה может значить «последняя, последующая» или указывать на то, что будет после. «В последующий раз» сохраняет соотнесённость с прежним случаем, не уточняя неназванный предмет сравнения.
