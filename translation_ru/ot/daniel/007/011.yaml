id: DAN.7.11
reference: Daniel 7:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית בֵּ/אדַ֗יִן מִן קָל֙ מִלַּיָּ֣/א רַבְרְבָתָ֔/א דִּ֥י קַרְנָ֖/א מְמַלֱּלָ֑ה חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּ֨י קְטִילַ֤ת חֵֽיוְתָ/א֙ וְ/הוּבַ֣ד גִּשְׁמַ֔/הּ וִ/יהִיבַ֖ת לִ/יקֵדַ֥ת אֶשָּֽׁא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/011.yaml
  text: I kept watching then because of the sound of the great words that the horn was speaking. I kept watching until the beast was killed[a], and its body was destroyed and given over to the burning fire.
translation:
  language: ru
  text: Тогда я продолжал смотреть из-за звука великих слов[a], которые произносил рог. Я продолжал смотреть, пока зверь не был убит, а его тело не было уничтожено и не предано пылающему огню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хвастливых слов»; или: «надменных слов»; буквально: «великих слов».'
    reason: 'Лексическая альтернатива: выражение буквально означает «великие слова», но в контексте может обозначать хвастливую или надменную речь.'
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: я продолжал смотреть
  rationale: Причастие со вспомогательным глаголом выражает длительное действие в прошлом; формулировка передаёт продолжающееся наблюдение Даниила.
- source_word: בֵּאדַיִן
  choice: тогда
  rationale: Кратко и естественно обозначает последовательность событий в видении.
- source_word: מִן קָל
  choice: из-за звука
  rationale: מִן здесь указывает на причину или повод продолжать смотреть, а קָל обозначает слышимый звук; перевод сохраняет оба элемента выражения.
- source_word: מִלַּיָּא רַבְרְבָתָא
  choice: великих слов
  rationale: Это формально близкий перевод выражения; подразумеваемый оттенок хвастовства или надменности указан в сноске, а не внесён безоговорочно в основной текст.
- source_word: קַרְנָא
  choice: рог
  rationale: Сохранён образ видения без истолкования символа.
- source_word: מְמַלֱּלָה
  choice: произносил
  rationale: Передаёт продолжающуюся речь рога и естественно сочетается в русском языке со словом «слова».
- source_word: עַד דִּי
  choice: пока ... не
  rationale: Естественная русская временная конструкция, обозначающая предел продолжавшегося наблюдения.
- source_word: קְטִילַת חֵיוְתָא
  choice: зверь не был убит
  rationale: Прямо передаёт пассивную конструкцию, не прибегая к архаичному «заклан».
- source_word: וְהוּבַד גִּשְׁמַהּ
  choice: тело его не было уничтожено
  rationale: Сохраняет различие между самим зверем и его телом и прямо передаёт значение уничтожения.
- source_word: וִיהִיבַת לִיקֵדַת אֶשָּׁא
  choice: не предано огню на сожжение
  rationale: Передаёт пассивную передачу тела огню и сохраняет образ огненного сожжения в естественной русской форме.
theological_decisions:
- issue: Следует ли прямо истолковать «великие слова» как хвастливые, надменные или богохульные
  choice: Сохранить в основном тексте «великие слова»
  alternative: «хвастливые слова», «надменные слова» или «богохульные слова»
  rationale: Контекст указывает на высокомерный характер речи, однако само арамейское выражение буквально означает «великие слова». Основной текст сохраняет эту формулировку, а вероятный смысловой оттенок отмечен в сноске.
- issue: Следует ли раскрыть значение зверя и рога как царства или правителя
  choice: Сохранить образы «зверя», «рога» и его тела
  alternative: Передать символы истолкованно, например как царство или правителя
  rationale: Стих описывает увиденное Даниилом; истолкование символов в самом переводе внесло бы вывод, не выраженный непосредственно в данном стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования о видении. Повтор «я продолжал смотреть» сохранён ради структуры и длительного характера действия в оригинале; символика не истолковывается внутри перевода.
