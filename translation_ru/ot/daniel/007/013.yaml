base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/013.yaml
  text: I kept looking in the visions of the night[a], and behold, with the clouds of heaven one like a son of man was coming, and he came to the Ancient of Days[b], and they brought him near before him.
translation:
  language: ru
  text: 'Я продолжал смотреть в ночных видениях, и вот: с небесными облаками[a] приближался некто, подобный сыну человеческому[b]. Он достиг Ветхого днями, и подвели его пред Него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный вариант: «на облаках небесных». В арамейском тексте стоит предлог «с», который может указывать на сопровождение, не уточняя, что фигура двигалась именно на облаках.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «некто, подобный человеку». Буквально по-арамейски: «как сын человеческий» — выражение, которое может обозначать человеческую фигуру, а в последующем библейском истолковании приобретает особое мессианское значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Я продолжал смотреть
  rationale: Сочетание причастия с הוה выражает продолжающееся действие в прошлом; такой перевод естественно передаёт длительность наблюдения.
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: в ночных видениях
  rationale: Сохранены множественное число «видения» и связь с ночью; формулировка естественна для современного русского языка.
- source_word: וַאֲרוּ
  choice: и вот
  rationale: Выражение вводит новую, поразительную сцену и сохраняет живость апокалиптического повествования.
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  choice: вместе с облаками небесными
  rationale: Предлог עִם означает «с, вместе с» и сам по себе не утверждает, что фигура движется на облаках. Порядок слов сохраняет возвышенный регистр.
- source_word: כְּבַר אֱנָשׁ
  choice: некто, подобный сыну человеческому
  rationale: «Некто» естественно обозначает увиденную фигуру, «подобный» сохраняет сравнительную частицу כְ, а традиционное выражение «сын человеческий» не устраняет значимой связи с последующим библейским употреблением.
- source_word: אָתֵה הֲוָה
  choice: приближался
  rationale: Продолженная форма описывает движение к Ветхому днями. «Приближался» передаёт процесс и естественно сочетается с последующим сообщением о достижении цели.
- source_word: וְעַד עַתִּיק יוֹמַיָּא מְטָה
  choice: Он дошёл до Ветхого днями
  rationale: Глагол מְטָה обозначает достижение цели, а «Ветхий днями» — укоренившийся русский эквивалент арамейского титула, сохраняющий его торжественный характер.
- source_word: וּקְדָמוֹהִי הַקְרְבוּהִי
  choice: и его подвели к Нему
  rationale: Сохранена активная форма множественного числа с не названными в тексте действующими лицами; местоимение с прописной буквы ясно отсылает к Ветхому днями.
theological_decisions:
- issue: Передача мессиански значимого выражения כְּבַר אֱנָשׁ
  choice: некто, подобный сыну человеческому
  alternative: некто, подобный человеку
  rationale: Основной текст сохраняет и формальное сравнение, и традиционно значимое выражение, но не превращает его в однозначный титул посредством прописных букв и не отождествляет фигуру с кем-либо за пределами сказанного в стихе.
- issue: Образ движения при עִם עֲנָנֵי שְׁמַיָּא
  choice: вместе с облаками небесными
  alternative: на облаках небесных
  rationale: Арамейский предлог прямо означает сопровождение или совместность, тогда как вариант «на облаках» конкретизирует пространственное отношение, не выраженное однозначно в исходном тексте.
- issue: Передача титула עַתִּיק יוֹמַיָּא
  choice: Ветхий днями
  alternative: Древний днями
  rationale: Традиционная русская формула остаётся понятной как титул и сохраняет межтекстовую узнаваемость; она не добавляет к образу отдельного догматического истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, соответствующим видению регистром. Синтаксис сделан ясным без устранения повторного движения к Ветхому днями и без уточнения не названных субъектов, которые подводят фигуру.
