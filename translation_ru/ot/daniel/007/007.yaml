id: DAN.7.7
reference: Daniel 7:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּאתַ֣ר דְּנָה֩ חָזֵ֨ה הֲוֵ֜ית בְּ/חֶזְוֵ֣י לֵֽילְיָ֗/א וַ/אֲר֣וּ חֵיוָ֣ה רביעיה דְּחִילָה֩ וְ/אֵֽימְתָנִ֨י וְ/תַקִּיפָ֜א יַתִּ֗ירָא וְ/שִׁנַּ֨יִן דִּֽי פַרְזֶ֥ל לַ/הּ֙ רַבְרְבָ֔ן אָֽכְלָ֣ה וּ/מַדֱּקָ֔ה וּ/שְׁאָרָ֖/א ב/רגלי/ה רָפְסָ֑ה וְ/הִ֣יא מְשַׁנְּיָ֗ה מִן כָּל חֵֽיוָתָ/א֙ דִּ֣י קָֽדָמַ֔י/הּ וְ/קַרְנַ֥יִן עֲשַׂ֖ר לַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/007.yaml
  text: After this I kept looking in the visions of the night[a], and behold, a fourth beast, terrifying and dreadful and exceedingly strong. It had large iron teeth; it devoured and crushed, and it trampled the remainder with its feet. It was different from all the beasts that were before it[b], and it had ten horns.
translation:
  language: ru
  text: 'После этого я продолжал смотреть в ночных видениях — и вот четвёртый зверь: страшный, внушающий ужас и необычайно сильный.[a] У него были большие железные зубы; он пожирал и сокрушал, а остаток попирал ногами. Он отличался от всех зверей, бывших до него,[b] и у него было десять рогов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грозный, устрашающий и чрезвычайно могучий».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от всех зверей, которые были перед ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: После этого
  rationale: Естественно передаёт временной переход к следующей сцене видения.
- source_word: חָזֵה הֲוֵית
  choice: я продолжал смотреть
  rationale: Причастие со вспомогательным глаголом выражает продолженное действие в прошлом.
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: в ночных видениях
  rationale: Кратко и естественно сохраняет смысл арамейского сочетания и ночную обстановку видения.
- source_word: וַאֲרוּ
  choice: и вот
  rationale: Передаёт указательный маркер, внезапность и наглядность появления нового образа.
- source_word: חֵיוָה רביעיה
  choice: четвёртый зверь
  rationale: В контексте Дан 7 речь идёт о символическом звере, а не просто о живом существе.
- source_word: דְּחִילָה וְאֵימְתָנִי
  choice: страшный, внушающий ужас
  rationale: Сохраняет два близких, но усиливающих друг друга определения, не сводя их к одному.
- source_word: וְתַקִּיפָא יַתִּירָא
  choice: необычайно сильный
  rationale: Передаёт исключительную силу, выраженную прилагательным с усилителем.
- source_word: וְשִׁנַּיִן דִּי פַרְזֶל לַהּ רַבְרְבָן
  choice: У него были большие железные зубы
  rationale: Естественная русская конструкция сохраняет указание и на материал, и на размер.
- source_word: אָכְלָה וּמַדֱּקָה
  choice: он пожирал и сокрушал
  rationale: Сохраняет образ зверя и последовательность разрушительных действий.
- source_word: וּשְׁאָרָא בְרגליה רָפְסָה
  choice: а остаток попирал ногами
  rationale: Прямо передаёт שְׁאָרָא и подчёркивает контраст между пожираемым и тем, что оставалось для попрания.
- source_word: מְשַׁנְּיָה
  choice: отличался
  rationale: Передаёт отличие четвёртого зверя от предшествующих без дополнительного толкования.
- source_word: וְקַרְנַיִן עֲשַׂר לַהּ
  choice: у него было десять рогов
  rationale: Прямой и естественный перевод символической детали.
theological_decisions:
- issue: Отождествление четвёртого зверя
  choice: Сохранить образ символического зверя без указания конкретного царства
  alternative: Отождествить его в тексте с Римом, эллинистическим царством или будущей составной державой
  rationale: Сам стих описывает зверя, но не называет представляемое им царство; перевод не должен встраивать спорное историко-богословское толкование.
- issue: Соотношение двух определений ужаса
  choice: 'Передать оба определения: «страшный, внушающий ужас»'
  alternative: Свести их к одному определению или заменить второе характеристикой величия
  rationale: Арамейский текст использует два отдельных слова, усиливающих устрашающий образ; их различие следует по возможности сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Сохранены продолженность наблюдения, яркое «и вот», тройное описание зверя и последовательность его разрушительных действий; спорное историческое отождествление не внесено.
