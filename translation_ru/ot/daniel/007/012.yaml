  text: וּ/שְׁאָר֙ חֵֽיוָתָ֔/א הֶעְדִּ֖יו שָׁלְטָנְ/ה֑וֹן וְ/אַרְכָ֧ה בְ/חַיִּ֛ין יְהִ֥יבַת לְ/ה֖וֹן עַד זְמַ֥ן וְ/עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/012.yaml
  text: As for the rest of the beasts[a], their dominion was taken away, but an extension of life was given to them for a time and a season.
translation:
  language: ru
  text: Что же до остальных зверей, их власть была отнята, но им было даровано продление жизни на время и срок.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до времени и срока». Арамейское выражение может указывать на предел дарованного им продления жизни.'
    reason: Альтернативное понимание временного выражения עַד זְמַן וְעִדָּן.
lexical_decisions:
- source_word: וּשְׁאָר חֵיוָתָא
  choice: Что же до остальных зверей
  rationale: Оборот передаёт контрастный переход к прочим зверям видения; «звери» точно соответствует символическим существам в контексте Даниила 7.
- source_word: הֶעְדִּיו שָׁלְטָנְהוֹן
  choice: их власть была отнята
  rationale: Пассивная конструкция естественна по-русски, не называет не указанного в тексте деятеля и передаёт лишение правящей власти.
- source_word: וְאַרְכָה בְחַיִּין יְהִיבַת לְהוֹן
  choice: но им было даровано продление жизни
  rationale: Противительный союз выявляет контраст между утратой власти и сохранением жизни; формулировка сохраняет пассив и не уточняет дарующего.
- source_word: עַד זְמַן וְעִדָּן
  choice: на время и срок
  rationale: Передаёт ограниченную продолжительность, сохраняет парность двух арамейских обозначений времени и не вводит специальной эсхатологической схемы.
theological_decisions:
- issue: Временное выражение о продолжении жизни зверей после утраты власти
  choice: на время и срок
  alternative: до времени и срока
  rationale: Основной вариант подчёркивает ограниченность дарованного продления жизни, а сноска сохраняет возможность понимать עַד как указание на предел этого периода.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, с сохранением образности видения и смысловой неоднозначности заключительного временного оборота.
