base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/025.yaml
  text: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
translation:
  language: ru
  text: Он будет произносить слова против Всевышнего и изнурять святых Всевышнего[a]. Он замыслит изменить времена[b] и закон, и они[c] будут отданы в его руку до времени, времён и половины времени[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святые существа Всевышнего». В контексте главы наиболее вероятно имеются в виду принадлежащие Богу люди, однако выражение само по себе этого прямо не уточняет.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «установленные времена»; возможно, речь идёт о назначенных сроках, временах праздников или богослужебном календаре.'
    reason: lexical_alternative
  - marker: c
    text: То есть, вероятнее всего, святые будут отданы ему; подлежащее в арамейском тексте прямо не названо.
    reason: alternative_reading
  - marker: d
    text: 'Буквально: «до времени, времён и половины времени». Это выражение указывает на ограниченный срок; его нередко понимают как три с половиной периода или года, но сам текст не называет календарную единицу.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִלִּין לְצַד עֶלְיָא יְמַלִּל
  choice: будет произносить слова против Всевышнего
  rationale: Сохраняет существительное «слова», предсказательный характер глагола и контекстуально обусловленное противительное значение предлога; по-русски звучит естественнее, чем буквальное «будет говорить слова».
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: святых Всевышнего
  rationale: Кратко и формально передаёт «святых/святые существа Всевышнего», не добавляя в основной текст уточнения «народ» и тем самым сохраняя допустимую неоднозначность.
- source_word: יְבַלֵּא
  choice: изнурять
  rationale: Передаёт образ длительного изматывания и притеснения, заложенный в арамейском глаголе.
- source_word: יִסְבַּר לְהַשְׁנָיָה
  choice: замыслит изменить
  rationale: Выражает намерение, не утверждая, что задуманное изменение непременно осуществится.
- source_word: זִמְנִין וְדָת
  choice: времена и закон
  rationale: Сохраняет лаконичную формулировку источника; более специальное значение «установленные времена» отмечено в сноске.
- source_word: יִתְיַהֲבוּן בִּידֵהּ
  choice: они будут отданы в его руку
  rationale: Сохраняет пассивную конструкцию и библейский образ руки как власти, не заменяя его толкованием в основном тексте.
- source_word: עַד עִדָּן וְעִדָּנִין וּפְלַג עִדָּן
  choice: до времени, времён и половины времени
  rationale: Формально воспроизводит апокалиптическую формулу и не превращает её без достаточного основания в точное число календарных лет.
theological_decisions:
- issue: Кого обозначают «святые Всевышнего»
  choice: Сохранить выражение «святые Всевышнего» без уточнения в основном тексте
  alternative: «святой народ Всевышнего» или «святые существа Всевышнего»
  rationale: В контексте Дан 7 наиболее вероятен народ Бога, получающий царство, однако сама формулировка допускает более широкое обозначение святых; перевод не должен устранять эту напряжённость.
- issue: Подразумеваемое подлежащее при «будут отданы»
  choice: Сохранить местоимение «они» и пояснить, что наиболее естественный референт — святые
  alternative: Явно написать «святые будут отданы» либо отнести форму к временам и закону
  rationale: В арамейском тексте подлежащее не названо повторно. Контекст склоняет к святым, но сноска лучше основного текста передаёт это толкование.
- issue: Продолжительность заключительного периода
  choice: Сохранить формулу «время, времена и половина времени»
  alternative: «три с половиной года» или символически ограниченный срок
  rationale: Источник не переводит формулу в календарные единицы; буквальная передача не навязывает определённую эсхатологическую схему.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены образы «в его руку» и «время, времена и половина времени», поскольку они значимы для формы текста и не затрудняют понимание. Синтаксис разбит на два предложения для ясности.
