source:
  edition: WLC
  text: וְ/קַרְנַיָּ֣/א עֲשַׂ֔ר מִנַּ/הּ֙ מַלְכוּתָ֔/ה עַשְׂרָ֥ה מַלְכִ֖ין יְקֻמ֑וּן וְ/אָחֳרָ֞ן יְק֣וּם אַחֲרֵי/ה֗וֹן וְ/ה֤וּא יִשְׁנֵא֙ מִן קַדְמָיֵ֔/א וּ/תְלָתָ֥ה מַלְכִ֖ין יְהַשְׁפִּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/024.yaml
  text: As for the ten horns[a], out of this kingdom ten kings will arise; and another will arise after them. He will be different from the former ones[b], and he will humble three kings.
translation:
  language: ru
  text: 'Что касается десяти рогов: из этого царства восстанут десять царей, а после них восстанет ещё один. Он будет отличаться от прежних[a] и унизит трёх царей[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет не таким, как прежние».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «низложит» или «подчинит» трёх царей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: десять рогов
  rationale: Сохраняется апокалиптический образ без преждевременного истолкования; далее сам стих раскрывает, что рога соответствуют царям.
- source_word: מִנַּהּ מַלְכוּתָה
  choice: из этого царства
  rationale: Женский суффикс соотносится с царством; русская формулировка естественно передаёт происхождение царей из него.
- source_word: מַלְכִין יְקֻמוּן
  choice: восстанут десять царей
  rationale: В данном контексте קום означает появление и возвышение правителей; «восстанут» сохраняет пророческий регистр и не означает здесь мятеж.
- source_word: וְאָחֳרָן יְקוּם אַחֲרֵיהוֹן
  choice: а после них восстанет ещё один
  rationale: Передаёт как появление другого царя, так и указанную в тексте временную последовательность.
- source_word: יִשְׁנֵא מִן קַדְמָיֵא
  choice: будет отличаться от прежних
  rationale: В контексте глагол выражает отличие или несходство. Перевод не уточняет, в чём именно состоит отличие этого правителя.
- source_word: וּתְלָתָה מַלְכִין יְהַשְׁפִּל
  choice: и унизит трёх царей
  rationale: Порода Haphel глагола שׁפל буквально выражает приведение в низкое положение. «Унизит» сохраняет образ понижения, не определяя точный политический способ.
theological_decisions:
- issue: Характер отличия последнего правителя от прежних царей
  choice: Он будет отличаться от прежних
  alternative: Он будет более суровым, чем прежние; он изменится по сравнению с прежними
  rationale: Арамейский текст утверждает отличие, но не раскрывает здесь его характер; перевод не привносит определённую эсхатологическую схему.
- issue: Способ воздействия на трёх царей
  choice: унизит трёх царей
  alternative: низложит трёх царей; подчинит трёх царей
  rationale: Исходный глагол допускает разные проявления «понижения». Основной текст сохраняет метафору, а примечание отмечает политически конкретные варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Оборот «что касается» передаёт тематическое выдвижение начальной именной группы; повтор «восстанут / восстанет» сохраняет параллелизм оригинала.
