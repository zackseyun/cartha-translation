id: DAN.7.4
reference: Daniel 7:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: קַדְמָיְתָ֣/א כְ/אַרְיֵ֔ה וְ/גַפִּ֥ין דִּֽי נְשַׁ֖ר לַ֑/הּ חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּי מְּרִ֨יטוּ גַפַּ֜י/הּ וּ/נְטִ֣ילַת מִן אַרְעָ֗/א וְ/עַל רַגְלַ֨יִן֙ כֶּ/אֱנָ֣שׁ הֳקִימַ֔ת וּ/לְבַ֥ב אֱנָ֖שׁ יְהִ֥יב לַֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/004.yaml
  text: The first was like a lion[a], and it had the wings of an eagle. I kept watching until its wings were plucked off, and it was lifted up from the earth and made to stand on two feet like a man[c][b], and a human heart was given to it.
translation:
  language: ru
  text: Первый был подобен льву и имел орлиные крылья. Я продолжал смотреть, пока у него не вырвали крылья[a]. Затем его подняли с земли и поставили на ноги, как человека[b], и дали ему человеческое сердце[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оторвали»; возможно также: «ощипали».'
    reason: 'Передаёт диапазон значений глагола מְּרִיטוּ: выдёргивать, срывать или обдирать.'
  - marker: b
    text: 'Буквально: «поставили на ноги, подобно человеку»; в арамейском тексте не сказано «на две ноги».'
    reason: Поясняет образ сравнения и сохраняет отсутствие невыраженного числительного.
  - marker: c
    text: 'Или: «сердце человека».'
    reason: Сочетание לְבַב אֱנָשׁ допускает как качественное «человеческое сердце», так и более формальное «сердце человека».
lexical_decisions:
- source_word: קַדְמָיְתָא
  choice: Первый
  rationale: Форма женского рода указывает на первого зверя в последовательности; в русском по смысловому слову «зверь» естественно употребить мужской род.
- source_word: כְאַרְיֵה
  choice: был подобен льву
  rationale: Префикс כ выражает сравнение, а не тождество; «подобен льву» сохраняет возвышенный характер видения.
- source_word: וְגַפִּין דִּי נְשַׁר לַהּ
  choice: и имел орлиные крылья
  rationale: Арамейская конструкция обладания буквально означает, что у него были крылья орла; русский оборот передаёт это естественно.
- source_word: חָזֵה הֲוֵית
  choice: Я продолжал смотреть
  rationale: Причастие со вспомогательным глаголом обозначает продолжавшееся в прошлом действие.
- source_word: מְּרִיטוּ גַפַּיהּ
  choice: крылья у него не были вырваны
  rationale: Глагол передаёт насильственное выдёргивание или отрывание; «вырваны» естественно и образно.
- source_word: וּנְטִילַת מִן אַרְעָא
  choice: его подняли с земли
  rationale: Пассивная форма описывает удаление зверя от земли; русская неопределённо-личная конструкция сохраняет неназванного деятеля.
- source_word: וְעַל רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת
  choice: поставили на ноги, как человека
  rationale: Каузатив указывает, что зверя заставили стоять; «поставили на ноги» не добавляет не выраженного явно числительного и естественно передаёт образ.
- source_word: וּלְבַב אֱנָשׁ יְהִיב לַהּ
  choice: дали ему человеческое сердце
  rationale: Оборот обозначает наделение человеческим сердцем, внутренним складом или разумом, сохраняя противопоставление звериного и человеческого.
theological_decisions:
- issue: Антропологическая лексика в превращении зверя
  choice: «как человека» и «человеческое сердце»
  alternative: «как мужчину» и «сердце человека»
  rationale: Арамейское אֱנָשׁ здесь обозначает человека как представителя человечества, а не подчёркивает мужской пол; перевод сохраняет противопоставление звериного и человеческого, не конкретизируя его богословский смысл.
- issue: Неназванный деятель пассивных форм
  choice: Сохранить неназванного деятеля посредством форм «подняли», «поставили» и «дали»
  alternative: Назвать Бога действующим лицом
  rationale: Исходный текст не называет деятеля; его явное отождествление с Богом было бы истолкованием, внесённым в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; последовательность пассивных преобразований и намеренная неопределённость действующего лица сохранены.
