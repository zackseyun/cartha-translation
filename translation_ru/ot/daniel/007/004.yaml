  source_fidelity: 'Смысловой ход и ключевые образы переданы верно: первый зверь подобен льву, имеет орлиные крылья, лишается их, поднимается от земли, ставится на ноги по-человечески и получает человеческое сердце. Однако конструкция «пока крылья у него не были вырваны» для современного русского неудачна и может восприниматься как отрицание результата, а не как временной предел. Естественная неопределённо-личная форма сохраняет неназванного деятеля исходного пассива.'
  naturalness: 'Текст в целом литературный и ясный. «Пока у него не вырвали крылья» значительно естественнее. Оборот «поставили на ноги, как человека» допустим, но примечание не должно утверждать, что он буквально совпадает с арамейской формой: в русском винительный падеж обусловлен управлением глагола, тогда как сравнение в оригинале относится к положению зверя на ногах, подобно человеку.'
