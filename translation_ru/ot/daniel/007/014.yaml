source:
  edition: WLC
  text: וְ/לֵ֨/הּ יְהִ֤יב שָׁלְטָן֙ וִ/יקָ֣ר וּ/מַלְכ֔וּ וְ/כֹ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ֛/א וְ/לִשָּׁנַיָּ֖/א לֵ֣/הּ יִפְלְח֑וּן שָׁלְטָנֵ֞/הּ שָׁלְטָ֤ן עָלַם֙ דִּֽי לָ֣א יֶעְדֵּ֔ה וּ/מַלְכוּתֵ֖/הּ דִּי לָ֥א תִתְחַבַּֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/014.yaml
  text: And to him was given dominion and glory and a kingdom[a], that all peoples, nations, and languages should serve him. His dominion is an everlasting dominion, which will not pass away, and his kingdom is one that will not be destroyed.
translation:
  language: ru
  text: И ему были даны власть, слава и царство, чтобы все народы, племена и языки служили ему[a]. Его власть — власть вечная, которая не исчезнет, и его царство не будет разрушено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонялись ему» либо «выражали ему почтение и покорность». Арамейский глагол может обозначать служение, в том числе религиозное, поэтому его смысл здесь может быть шире одного лишь политического подчинения.'
    reason: Лексическая неоднозначность глагола יִפְלְחוּן и связанное с ней богословское напряжение.
lexical_decisions:
- source_word: יְהִיב
  choice: были даны
  rationale: Пассивная форма сохраняет подразумеваемое дарование свыше, не называя прямо того, кто даровал власть, славу и царство.
- source_word: שָׁלְטָן
  choice: власть
  rationale: Слово обозначает правление и верховную власть. «Власть» ясно для современного читателя и позволяет сохранить повтор того же арамейского существительного во второй части стиха.
- source_word: וִיקָר
  choice: слава
  rationale: В данном царственно-богословском контексте слово передаёт почёт, величие и славу; «слава» сохраняет возвышенный регистр.
- source_word: מַלְכוּ
  choice: царство
  rationale: Существительное может обозначать как царствование, так и царство. В сочетании с дарованной властью и последующим упоминанием неразрушимого царства этот вариант наиболее естественен.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: народы, племена и языки
  rationale: Так сохраняется трёхчастный перечень, выражающий всеобщность. «Языки» передаёт арамейскую метонимию для языковых сообществ, а «племена» отличает вторую группу от первой без неестественного сочетания «народы и нации».
- source_word: יִפְלְחוּן
  choice: служили ему
  rationale: Глагол обозначает служение, в том числе религиозное. Нейтральное «служили» не сводит смысл только к политическому подчинению или только к поклонению; конструкция с «чтобы» передаёт целевой или результативный оттенок.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: Его власть — власть вечная
  rationale: Повтор существительного сохранён как смысловое и риторическое усиление; «вечная» ясно противопоставляет эту власть преходящим земным царствам.
- source_word: יֶעְדֵּה
  choice: не пройдёт
  rationale: Передаёт значение исчезновения, прекращения или удаления, сохраняя образ преходящего правления.
- source_word: תִתְחַבַּל
  choice: не будет разрушено
  rationale: В контексте царств речь идёт о разрушении или уничтожении, а не о нравственном повреждении.
theological_decisions:
- issue: Значение יִפְלְחוּן по отношению к фигуре, подобной Сыну человеческому
  choice: служили ему
  alternative: поклонялись ему; выражали ему почтение и покорность
  rationale: В книге Даниила этот глагол способен иметь оттенок религиозного служения, что богословски значимо. Однако перевод «поклонялись» однозначно разрешил бы вопрос, который арамейский текст оставляет открытым. «Служили» сохраняет напряжение между царским подчинением, почитанием и религиозным служением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, подходящим для апокалиптического видения регистром. Синтаксический параллелизм и повтор слова «власть» сохранены; архаизмы и конфессионально маркированная терминология не используются.
