  source_fidelity: 'Основной смысл передан точно: приход Древнего днями, судебное решение в пользу святых Всевышнего, наступление времени и получение ими царства. Бенефактивное понимание לְ («в пользу») контекстуально обосновано, а альтернативное «святым» надлежащим образом отмечено. Однако примечание b неоправданно вводит «святых существ» и утверждение о неопределённости природы референта: такая формулировка не является нейтральной лексической альтернативой к данному выражению и способна исказить его смысл.'
