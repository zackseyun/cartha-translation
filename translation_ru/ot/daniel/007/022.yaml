source:
  edition: WLC
  text: עַ֣ד דִּֽי אֲתָ֗ה עַתִּיק֙ יֽוֹמַיָּ֔/א וְ/דִינָ֣/א יְהִ֔ב לְ/קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/זִמְנָ֣/א מְטָ֔ה וּ/מַלְכוּתָ֖/א הֶחֱסִ֥נוּ קַדִּישִֽׁין־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/022.yaml
  text: until the Ancient of Days came[a], and judgment was given to the saints of the Most High, and the time arrived[c][b], and the saints took possession of the kingdom.
translation:
  language: ru
  text: пока не пришёл Древний днями и суд не был вынесен в пользу святых Всевышнего[a][b], и настало время, и святые овладели царством[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и суд был дан святым Всевышнего». Арамейский предлог может указывать как на решение в их пользу, так и на передачу суда им.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «святых Всевышнего» можно передать как «святых Божьих».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стали владеть царством».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד דִּי
  choice: пока не
  rationale: Сочетание обозначает временной предел предшествующего притеснения; в русском повествовании конструкция «пока не» естественно вводит момент, положивший ему конец.
- source_word: אֲתָה
  choice: пришёл
  rationale: Глагол означает приход или прибытие; «пришёл» сохраняет повествовательную простоту оригинала.
- source_word: עַתִּיק יוֹמַיָּא
  choice: Древний днями
  rationale: Передаёт образ глубокой древности и форму божественного наименования, оставаясь понятным современному читателю.
- source_word: וְדִינָא יְהִב
  choice: решение суда было вынесено
  rationale: דִּין допускает значения суда, судебного решения и правосудия. Выбранная формулировка естественно передаёт юридический смысл и арамейскую безлично-пассивную конструкцию.
- source_word: לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: в пользу святых Всевышнего
  rationale: В контексте речь идёт об оправдании преследуемых святых; предлог לְ понят как бенефактивный. Возможное понимание «святым» сохранено в примечании.
- source_word: וְזִמְנָא מְטָה
  choice: Тогда настало время
  rationale: Глагол выражает наступление решающего момента. «Тогда» естественно связывает этот момент с приходом Древнего днями и судебным решением, не добавляя идеи заранее назначенного срока.
- source_word: וּמַלְכוּתָא
  choice: царством
  rationale: В контексте Даниила 7 существительное обозначает царство или царское владычество; «царство» — наиболее прямой и естественный русский эквивалент.
- source_word: הֶחֱסִנוּ
  choice: овладели
  rationale: Глагол означает вступить во владение или обладать. «Овладели царством» ясно выражает переход царства во владение святых.
- source_word: קַדִּישִׁין
  choice: святые
  rationale: Сохраняет повтор одного и того же обозначения и не сужает его референт до какой-либо частной богословской схемы.
theological_decisions:
- issue: Смысл выражения וְדִינָא יְהִב לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: решение суда было вынесено в пользу святых Всевышнего
  alternative: суд был дан святым Всевышнего
  rationale: Контекст поддерживает оправдательный вердикт в пользу преследуемых святых, однако предлог допускает понимание святых как получателей суда; эта неоднозначность сохранена в примечании.
- issue: Кого обозначает קַדִּישִׁין
  choice: святые
  alternative: святые существа
  rationale: Перевод оставляет обозначение столь же широким, как в тексте, и не навязывает идентификацию исключительно с людьми или небесными существами.
- issue: Характер обладания царством
  choice: овладели царством
  alternative: стали владеть царством
  rationale: Основной текст подчёркивает вступление во владение, но форма глагола допускает более общее обозначение обладания; вариант отмечен без построения дополнительной эсхатологической схемы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Сохранены последовательность трёх событий, юридическая образность и неоднозначность того, вынесен ли суд в пользу святых или передан им. Наименование «Древний днями» передаёт образ оригинала современнее архаичного «Ветхий днями».
