  text: וְ/אַרְבַּ֤ע חֵיוָן֙ רַבְרְבָ֔ן סָלְקָ֖ן מִן יַמָּ֑/א שָׁנְיָ֖ן דָּ֥א מִן דָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/003.yaml
  text: And four great beasts were coming up from the sea[a], different from one another.
translation:
  language: ru
  text: И четыре огромных зверя поднимались из моря[a], отличаясь друг от друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выходили из моря».'
    reason: Возможная передача направленного движения изнутри моря наружу; основной текст подчёркивает движение вверх.
lexical_decisions:
- source_word: וְ/אַרְבַּע
  choice: И четыре
  rationale: Простой соединительный союз продолжает последовательность видения, не добавляя специально выраженного временного оттенка.
- source_word: חֵיוָן
  choice: зверя
  rationale: В апокалиптическом контексте речь идёт о грозных звероподобных существах; слово «звери» сохраняет как зоологический образ, так и его зловещую символическую силу.
- source_word: רַבְרְבָן
  choice: огромных
  rationale: Арамейское прилагательное обозначает большую величину; «огромных» естественно передаёт внушительные размеры этих существ, не добавляя им нравственной оценки.
- source_word: סָלְקָן
  choice: поднимались
  rationale: Форма изображает разворачивающееся перед пророком движение вверх; несовершенный вид сохраняет продолжительность действия.
- source_word: מִן יַמָּא
  choice: из моря
  rationale: Предлог указывает на исходную точку движения; это краткая и естественная русская передача.
- source_word: שָׁנְיָן
  choice: отличаясь
  rationale: В данном сравнительном обороте слово указывает на различие между существами, а не на процесс их изменения.
- source_word: דָּא מִן דָּא
  choice: друг от друга
  rationale: Устойчивый русский взаимный оборот точно передаёт различие каждого зверя по отношению к остальным.
theological_decisions:
- issue: Символическая сила חֵיוָן в апокалиптическом контексте
  choice: «зверя»
  alternative: «живых существа» или «животных»
  rationale: «Звери» сохраняют грозный апокалиптический образ и допускают последующее истолкование существ как царств, не вводя это истолкование непосредственно в данный стих.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и зрительной силы апокалиптического повествования. Причастно-деепричастный оборот делает заключительную характеристику естественной по-русски, не устраняя взаимного сопоставления четырёх зверей.
