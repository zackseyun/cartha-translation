source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֗ית עַ֣ד דִּ֤י כָרְסָוָן֙ רְמִ֔יו וְ/עַתִּ֥יק יוֹמִ֖ין יְתִ֑ב לְבוּשֵׁ֣/הּ כִּ/תְלַ֣ג חִוָּ֗ר וּ/שְׂעַ֤ר רֵאשֵׁ/הּ֙ כַּ/עֲמַ֣ר נְקֵ֔א כָּרְסְיֵ/הּ֙ שְׁבִיבִ֣ין דִּי נ֔וּר גַּלְגִּלּ֖וֹ/הִי נ֥וּר דָּלִֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/009.yaml
  text: I kept watching until thrones were set in place[a], and the Ancient of Days took his seat. His clothing was white as snow, and the hair of his head was like pure wool. His throne was flames of fire[b]; its wheels were a burning fire.
translation:
  language: ru
  text: Я продолжал смотреть, пока не были поставлены престолы[a] и не воссел Ветхий днями[b]. Одежда на Нём была бела, как снег, и волосы на Его голове — как чистая шерсть. Его престол — языки пламени, а колёса престола — пылающий огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были размещены престолы». Традиционный перевод «были низвергнуты престолы» здесь менее вероятен, поскольку далее изображается созыв небесного суда.'
    reason: alternative_reading
  - marker: b
    text: Арамейский титул «Ветхий днями», подчёркивающий великую древность и вечное величие.
    reason: cultural_note
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Я продолжал смотреть
  rationale: Причастие со вспомогательным глаголом передаёт продолженное действие в прошлом; формулировка естественно выражает длительность видения.
- source_word: עַד דִּי
  choice: пока не
  rationale: Оборот обозначает предел, до которого Даниил продолжал смотреть; в данном русском синтаксисе «пока не» звучит естественнее буквального «до тех пор, пока».
- source_word: כָרְסָוָן
  choice: престолы
  rationale: Речь идёт о царских или судейских престолах небесного суда, а не об обычных сиденьях.
- source_word: רְמִיו
  choice: были поставлены
  rationale: В контексте созыва небесного суда глагол лучше понимать как установление престолов; значение «были низвергнуты» возможно лексически, но менее соответствует ближайшему контексту.
- source_word: וְעַתִּיק יוֹמִין
  choice: Ветхий днями
  rationale: Устоявшийся русский библейский титул близко передаёт арамейский образ глубокой древности и величия, сохраняя торжественный регистр.
- source_word: יְתִב
  choice: воссел
  rationale: Глагол означает «сел, занял место»; «воссел» уместно и лаконично передаёт судебно-царский контекст.
- source_word: לְבוּשֵׁהּ כִּתְלַג חִוָּר
  choice: Одежда на Нём была бела, как снег
  rationale: Сохраняются единственное собирательное значение слова «одежда», явное указание на белизну и сравнение со снегом.
- source_word: וּשְׂעַר רֵאשֵׁהּ כַּעֲמַר נְקֵא
  choice: волосы на Его голове — как чистая шерсть
  rationale: נְקֵא передаёт чистоту; перевод не заменяет её словом «белая», хотя белизна подразумевается параллельным образом.
- source_word: כָּרְסְיֵהּ שְׁבִיבִין דִּי נוּר
  choice: Его престол был пламенем огня
  rationale: שְׁבִיבִין может обозначать языки пламени или огненные искры; «пламя огня» сохраняет яркий образ и возвышенность исходного выражения.
- source_word: גַּלְגִּלּוֹהִי נוּר דָּלִק
  choice: колёса престола — пылающим огнём
  rationale: Местоименный суффикс отнесён к престолу; явное повторение слова «престола» устраняет неестественную для русского двусмысленность и сохраняет образ престола-колесницы.
theological_decisions:
- issue: Передача עַתִּיק יוֹמִין как божественного титула
  choice: Ветхий днями
  alternative: Древний днями; Древний
  rationale: Фраза действует как благоговейный титул в сцене небесного суда. Традиционная русская форма узнаваема, достаточно близка исходнику и не сводит образ к пояснительному толкованию.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Традиционный титул «Ветхий днями» сохранён ради узнаваемости и сакральной выразительности; прочая фразировка избегает излишней архаики.
