lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: заговорил и сказал
  rationale: Арамейская повествовательная формула вводит речь. Буквальное «ответил и сказал» в современном русском предполагает заданный вопрос, которого здесь нет; «заговорил и сказал» сохраняет двучленность формулы без такого ложного оттенка.
- source_word: חָזֵה הֲוֵית
  choice: видел я
  rationale: Сочетание причастия со вспомогательным глаголом передаёт продолженное восприятие в прошлом. Русский несовершенный вид «видел» естественно выражает эту длительность; инверсия поддерживает торжественный повествовательный строй.
- source_word: בְּחֶזְוִי עִם לֵילְיָא
  choice: в ночном видении
  rationale: Сжатая русская формулировка естественно передаёт и принадлежность видения говорящему, ясную из «видел я», и ночное время; она не создаёт тяжеловесного «в моём видении ночью».
- source_word: וַאֲרוּ
  choice: вот
  rationale: Указательная частица привлекает внимание к открывающейся картине; «вот» сохраняет живость и апокалиптическую выразительность без архаичного «се».
- source_word: אַרְבַּע רוּחֵי שְׁמַיָּא
  choice: четыре небесных ветра
  rationale: В сцене воздействия на море значение «ветры» наиболее непосредственно. Прилагательное «небесных» естественно передаёт арамейскую конструкцию принадлежности; возможное значение «духи» сохранено в сноске.
- source_word: מְגִיחָן
  choice: вздымали
  rationale: Причастие описывает продолжающееся сильное воздействие на море. «Вздымали» естественно рисует ветры, поднимающие и волнующие морские воды, сохраняя динамику образа.
- source_word: לְיַמָּא רַבָּא
  choice: великое море
  rationale: Прямое и стилистически уместное соответствие выражению; сохраняет как масштаб образа, так и возможный оттенок устойчивого наименования.
theological_decisions:
- issue: רוּחֵי в апокалиптическом видении
  choice: ветры
  alternative: духи
  rationale: Непосредственный образ небесных сил, воздействующих на море, благоприятствует значению «ветры». Однако многозначность арамейского слова и символический характер видения позволяют понимать его как «духи», поэтому альтернатива не устраняется, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, образным строем. Избегаются как разговорность, так и неоправданные архаизмы; инверсия «Видел я» передаёт возвышенный тон видения.
