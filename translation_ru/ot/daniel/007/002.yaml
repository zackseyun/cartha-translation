    rationale: «Заговорил и сказал» в современном русском воспринимается как стилистически неловкая тавтология. Арамейская формула часто служит просто для введения прямой речи; «Даниил сказал» передаёт эту функцию без ложного предположения, что он начал говорить после молчания или отвечает на заданный вопрос.
  - severity: low
    issue: Не вполне прозрачное выражение принадлежности видения
    rationale: В оригинале имеется суффикс первого лица («в моём видении»). Инверсия «Видел я в ночном видении» частично это подразумевает, но «В своём ночном видении я видел» выражает признак прямо и остаётся литературным.
  revised_text: 'Даниил сказал: «В своём ночном видении я видел: вот, четыре небесных ветра[a] вздымали великое море».'
