  yaml_path: translation/ot/daniel/007/002.yaml
  text: Daniel answered and said[a], “I was seeing in my vision by night, and behold, the four winds of heaven were stirring up the great sea.”
translation:
  language: ru
  text: 'Даниил сказал: «В своём ночном видении я видел: вот, четыре небесных ветра[a] вздымали великое море».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четыре небесных духа». Арамейское слово может означать как «ветры», так и «духи».'
