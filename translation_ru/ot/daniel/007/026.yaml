base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/026.yaml
  text: But the court will sit[a], and his dominion will be taken away[c][b], to be destroyed and annihilated to the end.
translation:
  language: ru
  text: Но суд воссядет[a], и его власть отнимут[b], чтобы уничтожить и истребить её до конца[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начнётся суд»; арамейское выражение может обозначать как то, что судьи займут свои места, так и само судебное заседание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его господство» или «его правление».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «до конца»; выражение подчёркивает окончательность приговора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִינָא
  choice: суд
  rationale: В библейском арамейском слово может обозначать как судебное разбирательство, так и судебное собрание. В сочетании с глаголом «воссядет» здесь естественно передаётся образ небесного суда, приступающего к заседанию.
- source_word: יִתִּב
  choice: воссядет
  rationale: Глагол буквально означает «сядет». В судебном контексте речь идёт о начале заседания; «воссядет» сохраняет образ и соответствует возвышенному апокалиптическому регистру.
- source_word: שָׁלְטָנֵהּ
  choice: его власть
  rationale: Существительное обозначает господство, правление или властные полномочия. «Власть» ясно и естественно передаёт смысл в современном русском языке, не сужая его до территории или царства.
- source_word: יְהַעְדּוֹן
  choice: будет отнята
  rationale: Форма множественного числа имеет неопределённо-личное значение. Русская пассивная конструкция сохраняет отсутствие явно названного исполнителя и согласуется с существительным «власть».
- source_word: לְהַשְׁמָדָה וּלְהוֹבָדָה
  choice: чтобы истребить и уничтожить её
  rationale: Два параллельных инфинитива усиливают идею полного прекращения власти. Активная целевая конструкция с местоимением естественна по-русски и оставляет подразумеваемого исполнителя неназванным.
- source_word: עַד סוֹפָא
  choice: до конца
  rationale: Буквально «до конца»; выражение подчёркивает окончательность и полноту приговора без дополнительного толкования.
theological_decisions:
- issue: К кому относится местоимение в выражении «его власть»
  choice: 'Сохранено единственное число без уточнения личности: «его власть».'
  alternative: Прямо отнести власть либо к малому рогу и представленному им правителю, либо ко всему четвёртому зверю и его царству.
  rationale: Ближайший контекст сосредоточен на надменном роге, но тот неотделим от звериного царства. Перевод сохраняет местоимение исходного текста и не разрешает эту смысловую напряжённость добавленным толкованием.
- issue: Что именно подвергается истреблению
  choice: 'Грамматически объектом оставлена «власть»: «истребить и уничтожить её».'
  alternative: Понять инфинитивы как указание на уничтожение самого правителя или зверя.
  rationale: Непосредственно перед инфинитивами названа отнимаемая власть; русский текст сохраняет эту синтаксическую связь, не исключая более широкого итога суда в контексте видения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. «Воссядет» сохраняет судебный образ и достоинство стиля; остальная фраза построена ясно и без архаической перегруженности.
