id: DAN.7.21
reference: Daniel 7:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית וְ/קַרְנָ֣/א דִכֵּ֔ן עָבְדָ֥ה קְרָ֖ב עִם קַדִּישִׁ֑ין וְ/יָכְלָ֖ה לְ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/021.yaml
  text: I kept watching[a], and that horn was making war with the holy ones and was prevailing over them,
translation:
  language: ru
  text: 'Я продолжал смотреть: тот рог вёл войну со святыми[a] и одолевал их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «святым народом Божьим». Арамейское слово буквально означает «святые» и само по себе не уточняет их природу.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Я продолжал смотреть
  rationale: Сочетание причастия с глаголом бытия выражает продолженное действие в прошлом; этот перевод естественно передаёт длительное наблюдение.
- source_word: וְקַרְנָא דִכֵּן
  choice: тот рог
  rationale: Указательное слово отсылает к уже описанному рогу; «тот рог» ясно и естественно передаёт эту связь.
- source_word: עָבְדָה קְרָב
  choice: вёл войну
  rationale: Арамейское сочетание буквально означает «совершать войну/битву». Русское «вёл войну» идиоматично и сохраняет продолженный характер сцены.
- source_word: עִם
  choice: со
  rationale: Предлог буквально означает «с»; в сочетании «вёл войну со» враждебный смысл однозначен.
- source_word: קַדִּישִׁין
  choice: святыми
  rationale: Субстантивированное прилагательное буквально означает «святые». Такой перевод не сужает спорный референт до одной конкретной группы.
- source_word: וְיָכְלָה לְהוֹן
  choice: и одолевал их
  rationale: Глагол может означать «быть способным, превозмогать, одолевать». Несовершенный вид передаёт разворачивающееся в видении превосходство рога, не представляя его окончательным результатом.
theological_decisions:
- issue: Кого обозначает קַדִּישִׁין
  choice: святые
  alternative: святой народ Божий; святые существа
  rationale: Арамейское выражение само по себе не разрешает полностью, идёт ли речь прежде всего о посвящённом Богу народе или о святых в более широком смысле. Буквальный вариант сохраняет эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. «Вёл войну» и «одолевал» естественно передают продолженное действие, а «святые» сохраняет смысловую широту оригинала.
