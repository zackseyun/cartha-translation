base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/015.yaml
  text: As for me[a], Daniel, my spirit was distressed within me, and the visions of my head terrified me.
translation:
  language: ru
  text: Я, Даниил, — дух мой был встревожен в своей телесной оболочке[a], и видения, представшие мне, ужаснули меня.
  philosophy: optimal-equivalence
  footnotes:
