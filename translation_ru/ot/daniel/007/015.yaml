    text: 'Буквально: «внутри своей оболочки». Редкое арамейское слово образно обозначает тело как оболочку, в которой пребывает дух.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתְכְּרִיַּת
  choice: был глубоко встревожен
  rationale: Глагол выражает сильное внутреннее смятение или мучительное беспокойство; добавление «глубоко» естественно передаёт интенсивность состояния, не вводя буквального, но неясного образа пронзённости.
- source_word: רוּחִי
  choice: духом
  rationale: Здесь רוּחַ обозначает внутренний дух Даниила, а не ветер или дыхание. Творительный падеж позволяет естественно связать его состояние с редкой метафорой телесной оболочки.
- source_word: בְּגוֹא נִדְנֶה
  choice: в своей телесной оболочке
  rationale: Редкое נִדְנֶה буквально связано с оболочкой или футляром и метафорически обозначает тело, в котором пребывает дух. Перевод сохраняет образ, одновременно делая его понятным по-русски.
- source_word: חֶזְוֵי רֵאשִׁי
  choice: видения, представшие моему взору
  rationale: Буквальное «видения моей головы» в современном русском звучит неестественно. Выбранная формулировка передаёт увиденные Даниилом образы, не сводя их просто к мыслям.
- source_word: יְבַהֲלֻנַּנִי
  choice: ужаснули меня
  rationale: Глагол выражает сильный испуг и потрясение; «ужаснули» сохраняет его интенсивность и высокий повествовательный регистр.
theological_decisions:
- issue: Соотношение духа и телесной оболочки
  choice: Сохранить образ духа внутри телесной оболочки
  alternative: 'Передать обобщённо: «мой дух во мне был встревожен»'
  rationale: Арамейский текст использует редкую метафору оболочки или футляра. Её сохранение отражает исходный образ, но не превращает его в доктринальное утверждение о природе человека.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Редкая исходная метафора сохранена в понятной форме; неестественный для русского оборот «видения моей головы» передан идиоматически.
