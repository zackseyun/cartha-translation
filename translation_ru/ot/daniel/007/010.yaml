  text: נְהַ֣ר דִּי נ֗וּר נָגֵ֤ד וְ/נָפֵק֙ מִן קֳדָמ֔וֹ/הִי אֶ֤לֶף אלפים יְשַׁמְּשׁוּנֵּ֔/הּ וְ/רִבּ֥וֹ רבון קָֽדָמ֣וֹ/הִי יְקוּמ֑וּן דִּינָ֥/א יְתִ֖ב וְ/סִפְרִ֥ין פְּתִֽיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/010.yaml
  text: A river of fire was flowing and coming out from before him[a]; a thousand thousands were serving him, and ten thousand times ten thousand were standing before him. The court sat[c][b], and the books were opened.
translation:
  language: ru
  text: Огненная река текла и исходила из Его присутствия; тысяча тысяч служила Ему, и десять тысяч раз по десять тысяч стояли перед Ним.[a] Суд начал заседание,[b] и книги[c] были раскрыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «тысячи тысяч служили Ему, и мириады мириад стояли перед Ним». Числовые выражения подчёркивают необозримое множество.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «суд сел»; то есть небесный суд занял место и приступил к заседанию.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «свитки». Это слово может обозначать книги, свитки или письменные записи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהַר דִּי נוּר
  choice: река огня
  rationale: Сохраняет конкретный и величественный образ арамейского текста; конструкция с родительным падежом естественна для современного литературного русского языка.
- source_word: נָגֵד וְנָפֵק
  choice: текла и исходила
  rationale: Два глагола передают продолжающееся движение реки. «Исходила» сохраняет возвышенный характер видения, не сливая оба действия в одно.
- source_word: מִן קֳדָמוֹהִי
  choice: от Него
  rationale: Передаёт направленность движения от восседающего на престоле. Более буквальное «из-перед Него» неестественно по-русски, а «из Его присутствия» чрезмерно абстрагирует пространственный образ.
- source_word: אֶלֶף אלפים
  choice: тысяча тысяч
  rationale: Сохраняет числовой образ и необычную усилительную форму оригинала, не заменяя её общим указанием на неисчислимое множество.
- source_word: יְשַׁמְּשׁוּנֵּהּ
  choice: служила Ему
  rationale: Глагол обозначает служение или прислуживание; широкое «служила» не привносит специально литургического смысла.
- source_word: וְרִבּוֹ רבון
  choice: десять тысяч десятков тысяч
  rationale: Формально воспроизводит числовое наращение арамейского выражения и величину небесного сонма.
- source_word: קָדָמוֹהִי יְקוּמוּן
  choice: стояли перед Ним
  rationale: Естественно передаёт положение небесных служителей перед престолом, сохраняя пространственный смысл.
- source_word: דִּינָא יְתִב
  choice: Суд начал заседание
  rationale: Буквально выражение означает «суд сел», но в судебном контексте это идиома начала заседания. Выбранный вариант ясен современному читателю и не добавляет не названных в тексте судей.
- source_word: וְסִפְרִין פְּתִיחוּ
  choice: и книги были раскрыты
  rationale: סִפְרִין может обозначать книги, свитки или письменные записи. «Книги» сохраняет традиционный широкий смысл, а страдательная конструкция соответствует оригиналу.
theological_decisions:
- issue: Судебная идиома דִּינָא יְתִב
  choice: Суд начал заседание
  alternative: 'Буквально: «суд сел»; возможно также: «суд занял своё место»'
  rationale: Формулировка передаёт созыв небесного суда, не превращая «суд» в отвлечённый приговор и не уточняя состав суда сверх сказанного в тексте.
- issue: Числовые обозначения небесных служителей
  choice: тысяча тысяч ... десять тысяч десятков тысяч
  alternative: тысячи тысяч ... несметные множества
  rationale: Сохранены числовые образы оригинала без решения вопроса, следует ли понимать их буквально или как апокалиптическое обозначение неисчислимого множества.
- issue: Предметы, раскрытые перед судом
  choice: книги
  alternative: свитки
  rationale: Арамейское слово допускает оба представления; основной текст использует более широкое «книги», а возможный историко-материальный образ свитков отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией, соответствующей апокалиптическому видению. Местоимения, относящиеся к восседающему на престоле, написаны с прописной буквы как уважительная издательская норма; это не устраняет неоднозначностей самого образа. Необычные числовые формулы намеренно сохранены, а буквальность судебной идиомы разъяснена в сноске.
