base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/027.yaml
  text: And the kingdom and the dominion and the greatness of the kingdoms under all heaven shall be given to the people of the saints of the Most High[a]. His kingdom shall be an everlasting kingdom[c][b], and all dominions shall serve and obey him.
translation:
  language: ru
  text: И царство, и власть, и величие царств под всем небом будут отданы народу святых Всевышнего[a]. Его[b] царство будет вечным царством, и все власти будут служить[c] ему и повиноваться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святому народу Всевышнего»; также возможно: «народу святых Всевышнего».'
    reason: lexical_alternative
  - marker: b
    text: 'В арамейском тексте здесь употреблены формы единственного числа: «Его царство… служить ему и повиноваться». Они могут указывать на единственного представителя-правителя, показанного ранее в видении, хотя царство отдано народу святых.'
    reason: alternative_reading
  - marker: c
    text: Глагол «служить» в книге Даниила, когда служение обращено к Божеству, может также иметь смысл «поклоняться».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתָה
  choice: царство
  rationale: Слово обозначает как царство, так и царскую власть; «царство» естественно передаёт здесь оба оттенка и согласуется с дальнейшим упоминанием царств.
- source_word: שָׁלְטָנָא
  choice: власть
  rationale: Передаёт правление и верховные полномочия, сохраняя связь с формой множественного числа в конце стиха.
- source_word: רְבוּתָא
  choice: величие
  rationale: Прямо передаёт значение величия или могущества и сохраняет возвышенный регистр.
- source_word: דִּי מַלְכְוָת תְּחוֹת כָּל שְׁמַיָּא
  choice: царств под всем небом
  rationale: Естественно передаёт арамейскую конструкцию и её всемирный охват.
- source_word: יְהִיבַת
  choice: будут отданы
  rationale: Формально перфектная форма в апокалиптическом контексте описывает предстоящий итог видения; множественное число согласовано с однородными подлежащими русского предложения.
- source_word: לְעַם קַדִּישֵׁי עֶלְיוֹנִין
  choice: народу святых Всевышнего
  rationale: Сохраняет коллективное «народ» и неоднозначность слова «святые», которое может обозначать святых или святых существ Всевышнего.
- source_word: מַלְכוּתֵהּ
  choice: Его царство
  rationale: Сохранён мужской род единственного числа арамейского суффикса, без замены на множественное или безличное выражение.
- source_word: מַלְכוּת עָלַם
  choice: царство вечное
  rationale: Кратко и торжественно передаёт непреходящий характер царства.
- source_word: שָׁלְטָנַיָּא
  choice: все власти
  rationale: Форма может обозначать правящие власти или владычества; «власти» сохраняет политический смысл и лексическую связь с שָׁלְטָנָא.
- source_word: יִפְלְחוּן
  choice: будут служить ему
  rationale: «Служить» сохраняет широкий смысл глагола, который в книге Даниила может также подразумевать поклонение, не навязывая этот более узкий смысл в основном тексте.
- source_word: וְיִשְׁתַּמְּעוּן
  choice: и повиноваться
  rationale: В контексте царской власти глагол означает послушание; форма естественно сочетается со «служить».
theological_decisions:
- issue: Референт местоимений единственного числа во второй части стиха
  choice: 'Сохранить единственное число: «Его царство… служить ему и повиноваться».'
  alternative: Передать во множественном числе («их царство… служить им») либо обезличить («служить царству»).
  rationale: В арамейском тексте стоят формы мужского рода единственного числа. Это сохраняет напряжение между передачей царства народу святых и правлением единственного представителя, не разрешая его толкованием.
- issue: Значение выражения קַדִּישֵׁי עֶלְיוֹנִין
  choice: «святых Всевышнего»
  alternative: «святому народу Всевышнего» или «святым существам Всевышнего»
  rationale: Форма может пониматься как обозначение святых или небесных святых существ; буквальная конструкция сохраняет эту подлинную неоднозначность.
- issue: Оттенок глагола יִפְלְחוּן
  choice: «служить» с пояснением в сноске
  alternative: «поклоняться»
  rationale: Глагол допускает культовый смысл, особенно когда служение относится к Божеству, но «служить» не сужает значение преждевременно.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «и» сохраняет риторическую структуру арамейского перечисления; инверсия «царство вечное» подчёркивает возвышенный регистр без архаизации.
