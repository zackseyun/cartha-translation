source:
  edition: WLC
  text: מִשְׂתַּכַּ֨ל הֲוֵ֜ית בְּ/קַרְנַיָּ֗/א וַ֠/אֲלוּ קֶ֣רֶן אָחֳרִ֤י זְעֵירָה֙ סִלְקָ֣ת ביני/הון וּ/תְלָ֗ת מִן קַרְנַיָּ/א֙ קַדְמָ֣יָתָ֔/א אתעקרו מִן קדמי/ה וַ/אֲל֨וּ עַיְנִ֜ין כְּ/עַיְנֵ֤י אֲנָשָׁ/א֙ בְּ/קַרְנָ/א דָ֔א וּ/פֻ֖ם מְמַלִּ֥ל רַבְרְבָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/008.yaml
  text: I was considering the horns[a], and behold, another horn, a little one, came up among them, and three of the first horns were uprooted before it. And behold, in this horn were eyes like the eyes of a man[b], and a mouth speaking great things.
translation:
  language: ru
  text: Я всматривался в рога, и вот, среди них поднялся ещё один рог, небольшой; и три из прежних рогов были вырваны с корнем перед ним. И вот, на этом роге были глаза, как глаза у человека[a], и уста, говорившие великие слова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глаза, похожие на человеческие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уста, говорившие надменные слова»; или: «изрекавшие хвастливые речи».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׂתַּכַּל הֲוֵית
  choice: Я всматривался
  rationale: Причастие со вспомогательным глаголом выражает продолженное действие в прошлом. «Всматривался» передаёт внимательное, сосредоточенное наблюдение и естественно звучит в описании видения.
- source_word: בְּקַרְנַיָּא
  choice: в рога
  rationale: Определённая форма множественного числа указывает на уже упомянутые рога; русский контекст позволяет передать определённость без отдельного показателя.
- source_word: וַאֲלוּ
  choice: и вот
  rationale: Частица вводит яркий новый момент видения; «и вот» сохраняет возвышенный повествовательный тон и остаётся современным русским выражением.
- source_word: קֶרֶן אָחֳרִי זְעֵירָה
  choice: ещё один рог, небольшой
  rationale: 'Сохраняется последовательность арамейского выражения: сначала иной, дополнительный рог, затем его характеристика как малого. «Небольшой» естественнее в данной русской конструкции, чем терминологизированное «малый рог».'
- source_word: סִלְקָת בֵּינֵיהוֹן
  choice: между ними поднялся
  rationale: Глагол обозначает восхождение или появление снизу вверх, а предлог указывает на положение среди рогов. Такая формулировка ясно передаёт зрительный образ.
- source_word: וּתְלָת מִן קַרְנַיָּא קַדְמָיָתָא
  choice: три из прежних рогов
  rationale: Прилагательное указывает на рога, существовавшие ранее. «Прежних» в этом контексте звучит естественнее, чем «первых», не меняя последовательности событий.
- source_word: אתעקרו
  choice: были вырваны с корнем
  rationale: Форма выражает устранение посредством искоренения; русский оборот сохраняет как пассивность, так и силу образа.
- source_word: מִן קֳדָמֵיהּ
  choice: перед ним
  rationale: Фраза может обозначать удаление из пространства перед рогом или из его присутствия. Буквальное «перед ним» сохраняет эту пространственно-причинную неоднозначность.
- source_word: עַיְנִין כְּעַיְנֵי אֲנָשָׁא
  choice: глаза, как глаза у человека
  rationale: Передан явный сравнительный оборот и сохранено единственное число слова «человек». Более идиоматичный обобщённый вариант вынесен в сноску.
- source_word: בְּקַרְנָא דָא
  choice: на этом роге были
  rationale: В русском описании видимого образа «на этом роге» естественно передаёт наличие глаз на роге, не сводя выражение к отвлечённому обладанию.
- source_word: וּפֻם מְמַלִּל רַבְרְבָן
  choice: и уста, говорившие великие слова
  rationale: «Уста» соответствует одушевлённому и возвышенному образу апокалиптического видения. «Великие слова» сохраняет формальную широту רַבְרְבָן, тогда как оттенок надменного хвастовства отмечен в сноске.
theological_decisions:
- issue: Следует ли истолковывать רַבְרְבָן непосредственно как надменную или хвастливую речь
  choice: великие слова
  alternative: надменные слова; хвастливые речи
  rationale: Само арамейское выражение буквально говорит о «великом», а надменность становится яснее из контекста. Основной текст сохраняет формальную неоднозначность, а контекстуальное понимание приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, соответствующим апокалиптическому видению. Синтаксис сохраняет повтор «и вот» и последовательность зрительных деталей оригинала, но избегает архаической грамматики и конфессионально закреплённых толкований.
