  yaml_path: translation/ot/daniel/007/001.yaml
  text: In the first year of Belshazzar king of Babylon[a], Daniel saw a dream and visions in his head while on his bed. Then he wrote down the dream—the summary of the words he told.
translation:
  language: ru
  text: В первый год правления Валтасара, царя Вавилона, Даниил увидел сон и видения в его уме, когда лежал на постели[b]. Тогда он записал сон и изложил главное из сказанного[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он сказал голову слов». Слово «голова» в этом арамейском обороте, вероятно, означает главное, основное содержание сказанного.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «видения его головы»; арамейский оборот обозначает внутренние видения.'
    reason: idiomatic_expression
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה לְבֵלְאשַׁצַּר
  choice: В первый год правления Валтасара
  rationale: Арамейская конструкция представляет собой формулу датировки по году царствования; слово «правления» добавлено для естественности и ясности по-русски.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Обычная конструкция, обозначающая царский титул Валтасара.
- source_word: חֵלֶם חֲזָה
  choice: увидел сон
  rationale: Сохраняет буквальное значение глагола «видеть» и подчёркивает характер откровения, не заменяя его более привычным, но менее точным «приснился сон».
- source_word: וְחֶזְוֵי רֵאשֵׁהּ
  choice: и видения в своей голове
  rationale: Передаёт внутренние видения и сохраняет конкретное арамейское слово «голова»; более гладкое «в своём сознании» было бы интерпретацией.
- source_word: עַל מִשְׁכְּבֵהּ
  choice: когда лежал на постели
  rationale: Естественно передаёт местонахождение Даниила; глагольная форма по-русски делает обстоятельство понятным без изменения смысла.
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Стандартная передача арамейского показателя последовательности повествования.
- source_word: חֶלְמָא כְתַב
  choice: он записал сон
  rationale: «Записал» естественно выражает совершённое письменное фиксирование сна.
- source_word: רֵאשׁ מִלִּין אֲמַר
  choice: изложил суть сказанного
  rationale: Буквально «сказал главу/начало слов»; идиома, вероятно, указывает на главное содержание или краткое изложение. Формулировка сохраняет отличие между записью сна и изложением его основного содержания.
