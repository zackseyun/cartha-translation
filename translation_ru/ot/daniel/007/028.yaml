id: DAN.7.28
reference: Daniel 7:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַד כָּ֖ה סוֹפָ֣/א דִֽי מִלְּתָ֑/א אֲנָ֨ה דָֽנִיֵּ֜אל שַׂגִּ֣יא רַעְיוֹנַ֣/י יְבַהֲלֻנַּ֗/נִי וְ/זִיוַ/י֙ יִשְׁתַּנּ֣וֹן עֲלַ֔/י וּ/מִלְּתָ֖/א בְּ/לִבִּ֥/י נִטְרֵֽת־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/028.yaml
  text: This is the end of the matter[a]. As for me, Daniel, my thoughts greatly terrified me, and my appearance changed because of it[b]; but I kept the matter in my heart.
translation:
  language: ru
  text: На этом — конец рассказа[a]. Я, Даниил, своими мыслями был приведён в сильный ужас, и облик мой изменился[b], но я сохранил это в сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «На этом — конец дела»; буквально: «До сих пор — конец дела (слова)».'
    reason: Сочетание עַד כָּה с סוֹפָא דִי מִלְּתָא допускает как естественную контекстуальную передачу «конец рассказа», так и более буквальные варианты; מִלְּתָא может означать «дело», «слово», «содержание сказанного».
  - marker: b
    text: 'Или: «выражение моего лица изменилось»; возможно также: «сияние моё изменилось».'
    reason: Арамейское זִיו обозначает внешний вид или выражение лица, а также может означать сияние.
lexical_decisions:
- source_word: עַד כָּה סוֹפָא דִי מִלְּתָא
  choice: На этом повествование заканчивается
  rationale: Фраза отмечает конец рассказа о видении. «На этом» естественно передаёт עַד כָּה, а «повествование» в данном контексте выражает מִלְּתָא как сообщённое содержание, не сводя его к отдельному «слову».
- source_word: אֲנָה דָנִיֵּאל
  choice: Меня же, Даниила
  rationale: Самостоятельное местоимение и имя имеют эмфатический характер; конструкция «Меня же, Даниила» естественно сохраняет это выделение в русском предложении.
- source_word: שַׂגִּיא רַעְיוֹנַי יְבַהֲלֻנַּנִי
  choice: мои мысли сильно ужаснули
  rationale: רַעְיוֹנַי означает «мои мысли», שַׂגִּיא усиливает действие, а форма от בהל выражает сильный испуг или потрясение. Перевод сохраняет интенсивность без добавления причины.
- source_word: וְזִיוַי יִשְׁתַּנּוֹן עֲלַי
  choice: и вид мой изменился
  rationale: זִיו допускает значения внешнего вида, облика, выражения лица или сияния. «Вид мой» естественно описывает заметную внешнюю перемену и оставляет более узкие варианты для примечания.
- source_word: וּמִלְּתָא בְּלִבִּי נִטְרֵת
  choice: но всё это я сохранил в своём сердце
  rationale: נִטְרֵת означает «сохранил, удержал»; «в сердце» прямо передаёт библейский образ внутреннего человека. «Всё это» естественно отсылает к содержанию видения, обозначенному מִלְּתָא.
theological_decisions:
- issue: Библейская антропологическая лексика בְּלִבִּי
  choice: сохранить «в своём сердце» в основном тексте
  alternative: «в своём уме» или «в памяти»
  rationale: «Сердце» передаёт исходный образ и не ограничивает внутреннее хранение видения только познавательной или мнемонической функцией.
- issue: Степень страха в יְבַהֲלֻנַּנִי
  choice: «ужаснули»
  alternative: «встревожили» или «смутил»
  rationale: Наречие שַׂגִּיא усиливает глагол, поэтому сильное обозначение испуга уместно; при этом перевод не вводит богословского объяснения переживания Даниила.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан плавным и понятным, при этом сохранены эмфаза самоназвания Даниила, интенсивность его испуга и образ сердца как внутреннего средоточия человека.
