source:
  edition: WLC
  text: וְ/עַל קַרְנַיָּ֤/א עֲשַׂר֙ דִּ֣י בְ/רֵאשַׁ֔/הּ וְ/אָחֳרִי֙ דִּ֣י סִלְקַ֔ת ו/נפלו מִן קדמי/ה תְּלָ֑ת וְ/קַרְנָ֨/א דִכֵּ֜ן וְ/עַיְנִ֣ין לַ֗/הּ וְ/פֻם֙ מְמַלִּ֣ל רַבְרְבָ֔ן וְ/חֶזְוַ֖/הּ רַ֥ב מִן חַבְרָתַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/020.yaml
  text: and about the ten horns that were on its head[a], and the other horn that came up, before which three fell—the horn that had eyes and a mouth speaking great things, and whose appearance was greater than that of its companions.
translation:
  language: ru
  text: и о десяти рогах на его голове, и о другом роге, который поднялся и перед которым пали три, — о том роге, у которого были глаза и уста, говорившие великое[a], и который видом превосходил своих собратьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изрекавшие хвастливые речи»; или: «произносившие великие похвальбы».'
    reason: 'Лексическая альтернатива: רַבְרְבָן буквально означает «великое», но в контексте может подразумевать надменную, хвастливую речь.'
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: десяти рогах
  rationale: Сохраняет арамейский символический образ и сочетание существительного с числительным без истолкования символа.
- source_word: בְרֵאשַׁהּ
  choice: у него на голове
  rationale: Суффикс женского рода относится к зверю; по-русски местоименное согласование естественно следует грамматическому роду слова «зверь».
- source_word: אָחֳרִי דִּי סִלְקַת
  choice: о другом роге, который поднялся
  rationale: «Другой» отличает этот рог от десяти ранее названных, а «поднялся» сохраняет зрительный образ его появления.
- source_word: וּנְפַלוּ מִן קֳדָמַיהּ תְּלָת
  choice: перед которым пали три
  rationale: Передаёт относительную конструкцию и не уточняет сверх текста, были ли три рога низложены им или пали в его присутствии.
- source_word: וְקַרְנָא דִכֵּן
  choice: о том роге
  rationale: Возобновляющая конструкция вновь выделяет рассматриваемый рог; повтор с предлогом естественно продолжает начальное «о».
- source_word: וְעַיְנִין לַהּ
  choice: у которого были глаза
  rationale: Прямо и образно передаёт наличие глаз у рога.
- source_word: וְפֻם מְמַלִּל רַבְרְבָן
  choice: уста, говорившие великое
  rationale: Сохраняет буквальную неопределённость «великое», не подменяя её более истолковывающим «хвастливое»; «уста» соответствует возвышенному библейскому регистру.
- source_word: וְחֶזְוַהּ רַב מִן חַבְרָתַהּ
  choice: который с виду был величественнее своих собратьев
  rationale: Передаёт сравнительную значительность внешнего вида, а не только физический размер; «собратья» сохраняет соотнесённость с другими рогами.
theological_decisions:
- issue: Следует ли истолковывать רַבְרְבָן как хвастливую или надменную речь
  choice: говорившие великое
  alternative: говорившие хвастливое; произносившие великие похвальбы
  rationale: Арамейский текст буквально говорит о «великом»; контекст допускает смысл надменной похвальбы, но не требует вносить его в основной текст.
- issue: Смысл превосходства в רַב מִן חַבְרָתַהּ
  choice: с виду был величественнее своих собратьев
  alternative: с виду был больше своих собратьев
  rationale: רַב может обозначать как величину, так и значительность. «Величественнее» сохраняет акцент на производимом внешнем впечатлении, не сводя сравнение к размеру.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет развернутую структуру арамейского перечисления, но проясняется повтором «о том роге». Термины «рога», «глаза» и «уста» оставлены как образы видения без символического толкования.
