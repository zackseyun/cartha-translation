base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/016.yaml
  text: I approached one of those standing there and asked him the certainty about all this[b][a]. So he told me and made known to me the interpretation of the matter.
translation:
  language: ru
  text: Я подошёл к одному из стоявших там и спросил его, какова истина обо всём этом.[a] Он ответил мне и сообщил мне толкование этих слов.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достоверность всего этого». Арамейское слово может обозначать то, что твёрдо, достоверно или истинно.'
    reason: lexical_alternative
  - marker: b
    text: «Слов» — буквально; здесь это выражение, вероятно, относится к содержанию видения.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבֵת
  choice: Я подошёл
  rationale: Форма первого лица единственного числа передаёт приближение к одному из присутствующих; «подошёл» естественно звучит в современном русском повествовании.
- source_word: עַל חַד מִן קָאֲמַיָּא
  choice: к одному из стоявших там
  rationale: Сохраняется значение одного лица из числа находившихся рядом и стоявших перед престолом; «там» не уточняет его личность.
- source_word: וְיַצִּיבָא אֶבְעֵא מִנֵּהּ עַל כָּל דְּנָה
  choice: и спросил у него правду обо всём этом
  rationale: יַצִּיבָא обозначает то, что твёрдо, достоверно или истинно, а בעא מן — обращение с вопросом или просьбой. «Правду обо всём этом» естественно передаёт стремление получить достоверное объяснение, не устраняя лексическую многозначность, отмеченную в сноске.
- source_word: וַאֲמַר לִי
  choice: Он ответил мне
  rationale: В данном контексте речь следует за вопросом, поэтому «ответил» естественно выражает функцию глагола אמר, сохраняя последовательность повествования.
- source_word: וּפְשַׁר מִלַּיָּא
  choice: толкование этих слов
  rationale: פשר означает толкование или объяснение, а מִלַּיָּא буквально означает «слова», хотя в контексте может относиться к содержанию видения в целом. Основной текст сохраняет более формальное соответствие.
- source_word: יְהוֹדְעִנַּנִי
  choice: сообщил
  rationale: Каузативная форма от ידע означает «дал узнать, сообщил». Русское «сообщил» передаёт каузативный смысл без тяжеловесного повтора.
