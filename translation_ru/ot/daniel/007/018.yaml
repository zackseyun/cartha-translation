source:
  edition: WLC
  text: וִֽ/יקַבְּלוּן֙ מַלְכוּתָ֔/א קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/יַחְסְנ֤וּן מַלְכוּתָ/א֙ עַֽד עָ֣לְמָ֔/א וְ/עַ֖ד עָלַ֥ם עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/018.yaml
  text: But the holy ones of the Most High will receive the kingdom and possess the kingdom forever—forever and ever[a].
translation:
  language: ru
  text: Но святые Всевышнего[a] получат царство и будут владеть царством вовеки — во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святые, принадлежащие Всевышнему». Арамейское выражение может обозначать святой народ Бога; некоторые толкователи усматривают в данном контексте также указание на небесных существ.'
    reason: Лексическая и референтная неоднозначность выражения קַדִּישֵׁי עֶלְיוֹנִין.
lexical_decisions:
- source_word: וִיקַבְּלוּן
  choice: получат
  rationale: Порода peal глагола קבל в библейском арамейском обычно означает «получать, принимать». Такой перевод не подразумевает ни захвата силой, ни прямо выраженного в тексте пассива.
- source_word: מַלְכוּתָא
  choice: царство
  rationale: Слово может обозначать как царство, так и царскую власть; «царство» естественно по-русски и сохраняет связь с противопоставлением царств в Дан 7.
- source_word: קַדִּישֵׁי
  choice: святые
  rationale: Субстантивированное прилагательное буквально обозначает «святых». В сочетании с примечанием этот вариант сохраняет возможность понимать выражение и как Божий народ, и как небесных святых существ.
- source_word: עֶלְיוֹנִין
  choice: Всевышнего
  rationale: В контексте это Божий титул; «Всевышний» — точный и общепринятый русский эквивалент.
- source_word: וְיַחְסְנוּן
  choice: будут владеть
  rationale: Глагол передаёт устойчивое обладание. «Будут владеть» естественнее русского «обладают царством» и не вносит более узкого значения «унаследуют».
- source_word: עַד עָלְמָא
  choice: вовеки
  rationale: Устойчиво передаёт неограниченную длительность и позволяет сохранить последующее усиление формулой «во веки веков».
- source_word: וְעַד עָלַם עָלְמַיָּא
  choice: во веки веков
  rationale: Традиционная, понятная современному читателю формула передаёт эмфатическое нарастание арамейского выражения.
theological_decisions:
- issue: Кого обозначает קַדִּישֵׁי עֶלְיוֹנִין
  choice: «святые Всевышнего» без уточнения их природы
  alternative: «святой народ Всевышнего» или «небесные святые существа Всевышнего»
  rationale: Контекст допускает отнесение выражения к Божьему святому народу, а некоторые толкователи видят здесь также небесный смысл. Основной текст не должен устранять эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Формула «во веки веков» сохранена как понятное и уместное торжественное усиление; пунктуация передаёт нарастание исходной фразы.
