base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/019.yaml
  text: Then I wanted to know for certain about the fourth beast[a], which was different from all of them, exceedingly terrifying, with teeth of iron and claws of bronze, which devoured, crushed[b], and trampled what was left with its feet.
translation:
  language: ru
  text: Тогда я захотел доподлинно узнать о четвёртом звере[a], который отличался от всех остальных и был необычайно страшен. Зубы у него были железные, а когти[b] — бронзовые; он пожирал и сокрушал, а оставшееся попирал ногами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «захотел удостовериться относительно четвёртого зверя». Арамейское выражение передаёт желание узнать нечто с уверенностью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ногти». Арамейское слово может означать когти или ногти; «когти» лучше соответствует образу зверя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Передаёт временной маркер и последовательность видения и последующего вопроса Даниила.
- source_word: צְבִית לְיַצָּבָא
  choice: я захотел доподлинно узнать
  rationale: Сочетание выражает желание установить нечто с уверенностью; «доподлинно узнать» естественно передаёт и стремление, и оттенок достоверности.
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: о четвёртом звере
  rationale: Прямой перевод арамейского словосочетания с порядковым числительным.
- source_word: דִּי הֲוָת שָׁנְיָה מִן כלהון
  choice: который отличался от всех остальных
  rationale: 'Сохраняет сравнительный смысл: четвёртый зверь был иным, чем все прочие звери.'
- source_word: דְּחִילָה יַתִּירָה
  choice: был необычайно страшен
  rationale: Передаёт усилительную конструкцию и устрашающий характер зверя современным литературным русским языком.
- source_word: שני/ה דִּי פַרְזֶל
  choice: зубы у него были железные
  rationale: Сохраняет конкретную образность и естественный для русского описательный строй.
- source_word: וְטִפְרַי/הּ דִּי נְחָשׁ
  choice: а когти — бронзовые
  rationale: טפר допускает значения «коготь» и «ноготь»; в образе зверя предпочтительно «когти». נְחָשׁ обозначает медь или бронзу; «бронзовые» ясно передаёт металлический образ.
- source_word: אָכְלָה מַדֲּקָה
  choice: он пожирал и сокрушал
  rationale: Передаёт два последовательных насильственных действия без их слияния.
- source_word: וּשְׁאָרָא בְּרַגְלַי/הּ רָפְסָה
  choice: а оставшееся попирал ногами
  rationale: «Оставшееся» непосредственно передаёт остаток после пожирания и сокрушения; «попирал» сохраняет сильный и торжественный оттенок глагола.
