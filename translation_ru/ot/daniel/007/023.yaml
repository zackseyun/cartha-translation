  text: כֵּן֮ אֲמַר֒ חֵֽיוְתָ/א֙ רְבִיעָ֣יְתָ֔/א מַלְכ֤וּ רביעי/א תֶּהֱוֵ֣א בְ/אַרְעָ֔/א דִּ֥י תִשְׁנֵ֖א מִן כָּל מַלְכְוָתָ֑/א וְ/תֵאכֻל֙ כָּל אַרְעָ֔/א וּ/תְדוּשִׁנַּ֖/הּ וְ/תַדְּקִנַּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/023.yaml
  text: 'Thus he said: ‘The fourth beast will be a fourth kingdom on the earth[a], which will be different from all the kingdoms[b]; and it will devour the whole earth and trample it down and crush it.’'
translation:
  language: ru
  text: 'Он сказал так: «Четвёртый зверь будет четвёртым царством на земле[a]. Оно будет отличаться от всех остальных царств, пожрёт всю землю, растопчет её и раздробит[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране». Арамейское слово может означать как землю вообще, так и отдельную страну или территорию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сокрушит её» или «разобьёт её на части».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן אֲמַר
  choice: Он сказал так
  rationale: Сохраняет вводную формулу объяснения и естественно звучит в современном русском повествовании.
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: четвёртый зверь
  rationale: «Зверь» точно передаёт образ грозного существа в апокалиптическом видении Даниила.
- source_word: מַלְכוּ רביעיא
  choice: четвёртое царство
  rationale: В данном истолковании зверь прямо отождествляется с политическим царством; форма «четвёртое» естественна по-русски.
- source_word: בְאַרְעָא
  choice: на земле
  rationale: В контексте всемирного размаха видения речь, вероятнее всего, идёт о земле в широком смысле, хотя возможно значение «в стране» или «на земле» как территории.
- source_word: דִּי תִשְׁנֵא מִן כָּל מַלְכְוָתָא
  choice: Оно будет отличаться от всех остальных царств
  rationale: Передаёт сравнительное значение глагола и ясно показывает, что имеются в виду прочие царства.
- source_word: וְתֵאכֻל כָּל אַרְעָא
  choice: пожрёт всю землю
  rationale: «Пожрёт» сохраняет метафору зверя и её насильственную выразительность.
- source_word: וּתְדוּשִׁנַּהּ
  choice: растопчет её
  rationale: Точно и естественно передаёт действие попрания ногами.
- source_word: וְתַדְּקִנַּהּ
  choice: раздробит
  rationale: Передаёт усиление разрушительного действия после попрания; возможный более общий вариант — «сокрушит».
theological_decisions:
- issue: Отношение четвёртого зверя к царству
  choice: «Четвёртый зверь будет четвёртым царством»
  alternative: Оставить политическое значение образа менее определённым
  rationale: Сам арамейский текст прямо истолковывает зверя как царство, поэтому эта связь должна быть выражена в переводе.
- issue: Масштаб царства
  choice: «пожрёт всю землю»
  alternative: «пожрёт всю страну»
  rationale: Контекст последовательности мировых царств поддерживает широкий масштаб, но лексическая возможность более локального значения отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык; тон торжественный, но ясный. Сохранены последовательность образов зверя и нарастающая сила глаголов: пожрёт, растопчет, раздробит.'
