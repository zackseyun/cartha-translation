  text: אִלֵּין֙ חֵיוָתָ֣/א רַבְרְבָתָ֔/א דִּ֥י אִנִּ֖ין אַרְבַּ֑ע אַרְבְּעָ֥ה מַלְכִ֖ין יְקוּמ֥וּן מִן אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/017.yaml
  text: These great beasts[a], which are four, are four kings who will arise from the earth.
translation:
  language: ru
  text: Эти огромные звери, числом четыре, — четыре царя, которые восстанут из земли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из страны». Арамейское слово אַרְעָא может означать как землю вообще, так и определённую землю или страну; здесь избрано широкое значение в соответствии с масштабом видения.'
    reason: Лексическая неоднозначность слова אַרְעָא.
lexical_decisions:
- source_word: אִלֵּין
  choice: эти
  rationale: Указательное местоимение относится к зверям, только что увиденным Даниилом в видении.
- source_word: חֵיוָתָא
  choice: звери
  rationale: В апокалиптическом контексте слово передаёт грозный характер символических животных естественнее, чем нейтральное «животные».
- source_word: רַבְרְבָתָא
  choice: огромные
  rationale: Прилагательное обозначает величину или значительность; применительно к зверям «огромные» естественно передаёт прежде всего их исполинский облик.
- source_word: דִּי אִנִּין אַרְבַּע
  choice: числом четыре
  rationale: Оборот сохраняет отдельное указание источника на число зверей и при этом звучит естественно в современном литературном русском.
- source_word: אַרְבְּעָה מַלְכִין
  choice: четыре царя
  rationale: В арамейском тексте прямо сказано «цари», а не «царства»; перевод сохраняет эту формулировку, не подменяя её толкованием символа.
- source_word: יְקוּמוּן
  choice: восстанут
  rationale: Глагол означает «встать, подняться, возникнуть»; «восстанут» сохраняет образ появления правителей и торжественный пророческий регистр.
- source_word: מִן אַרְעָא
  choice: из земли
  rationale: Предлог и существительное буквально передают происхождение «из земли»; русское «земля» также допускает широкий пространственный смысл, уместный в видении.
theological_decisions:
- issue: Соотношение четырёх царей и царств в символике видения
  choice: В основном тексте оставить «четыре царя».
  alternative: Передать толковательно как «четыре царства».
  rationale: Источник употребляет מַלְכִין («цари»). Возможную связь царей с царствами не следует вносить в перевод ценой замены прямого значения слова.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Конструкция «числом четыре» сохраняет повтор числа в источнике без тяжеловесного буквального оборота; тире ясно вводит истолкование символа.
