base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/017.yaml
  text: Then the king gave the command[a], and they brought Daniel and threw him into the den of lions. The king answered and said to Daniel, “Your God, whom you continually serve[b], he will deliver you.”
translation:
  language: ru
  text: 'Тогда царь приказал, и Даниила привели и бросили в львиный ров. Царь обратился к Даниилу со словами: «Твой Бог, которому ты постоянно служишь, — он избавит тебя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да избавит он тебя». Арамейскую форму можно понимать как пожелание, хотя основное чтение передаёт её как прямое утверждение: «он избавит тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный указатель вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: מַלְכָּא אֲמַר
  choice: царь приказал
  rationale: Буквально глагол означает «сказал», но здесь речь царя представляет собой распоряжение, немедленно приведённое в исполнение.
- source_word: וְהַיְתִיו
  choice: привели
  rationale: Каузативная форма глагола «приходить» в данном контексте означает, что Даниила доставили по приказу царя.
- source_word: וּרְמוֹ
  choice: бросили
  rationale: Глагол выражает действие бросания и передаёт насильственный характер происходящего.
- source_word: לְגֻבָּא דִּי אַרְיָוָתָא
  choice: в львиный ров
  rationale: Сочетание буквально обозначает ров или яму со львами; «львиный ров» — ясное и устойчивое русское соответствие.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Царь обратился к Даниилу со словами
  rationale: Естественно передаёт семитскую речевую формулу «ответил и сказал», не создавая в русском ложного впечатления, будто царь отвечал на непосредственно предшествующую реплику.
- source_word: דִּי אנתה פָּלַח לֵהּ
  choice: Которому ты … служишь
  rationale: Глагол פלח может обозначать служение божеству, включая поклонение; «служишь» сохраняет широту значения.
- source_word: בִּתְדִירָא
  choice: неизменно
  rationale: Передаёт постоянство и непрерывную верность Даниила в служении Богу.
- source_word: הוּא יְשֵׁיזְבִנָּךְ
  choice: Он спасёт тебя
  rationale: Самостоятельное местоимение подчёркивает действующее лицо, а глагол означает избавление или спасение от опасности.
theological_decisions:
- issue: Смысл заключительных слов царя
  choice: 'уверенное утверждение: «Он спасёт тебя»'
  alternative: 'пожелание или мольба: «да спасёт Он тебя»'
  rationale: Арамейская глагольная форма естественно допускает прямое утверждение о будущем. При этом контекст позволяет некоторым понимать слова как пожелание; эта неоднозначность отмечена в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского читателя; семитская формула речи передана функционально, а богословски значимая неоднозначность заключительной фразы сохранена в сноске.
