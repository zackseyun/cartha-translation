  text: בֵּ/אדַ֜יִן דָּרְיָ֣וֶשׁ מַלְכָּ֗/א כְּ֠תַב לְֽ/כָל עַֽמְמַיָּ֞/א אֻמַיָּ֧/א וְ/לִשָּׁנַיָּ֛/א דִּֽי דארין בְּ/כָל אַרְעָ֖/א שְׁלָמְ/כ֥וֹן יִשְׂגֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/026.yaml
  text: 'Then King Darius wrote to all the peoples[a], nations[b], and languages that dwell in all the earth: “May your peace abound.”'
translation:
  language: ru
  text: 'Тогда царь Дарий написал всем народам, племенам и языкам, живущим по всей земле[b]: «Да умножится ваш мир[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да возрастёт ваше благополучие!»'
    reason: Лексема שְׁלָם может обозначать как мир, так и благополучие, а יִשְׂגֵּא — умножение или возрастание.
  - marker: b
    text: «По всей земле» буквально передаёт арамейское выражение; в данном контексте речь идёт обо всей державе Дария.
    reason: Царская формула имеет универсальный оттенок, но практически относится к территории и народам империи.
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее по порядку событие; «тогда» естественно передаёт ход рассказа.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: царь Дарий
  rationale: Такой порядок титула и имени соответствует естественному русскому словоупотреблению.
- source_word: כְּתַב
  choice: написал
  rationale: Глагол непосредственно означает письменное действие; контекст царского воззвания не требует добавлять отсутствующее в исходном тексте слово «указ».
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: всем народам, племенам и языкам
  rationale: Сохранена трёхчастная формула Даниила. «Языкам» буквально передаёт исходный образ, а «племенам» естественно различает близкие понятия עַמְמַיָּא и אֻמַיָּא без чрезмерно современного «этническим группам».
- source_word: דִּי דארין
  choice: живущим
  rationale: Причастная конструкция точно и естественно передаёт относительное описание адресатов.
- source_word: בְּכָל אַרְעָא
  choice: по всей земле
  rationale: Сохраняется буквальная широта царской формулы; возможное контекстуальное ограничение пределами державы не вносится в основной текст.
- source_word: שְׁלָמְכוֹן
  choice: ваш мир
  rationale: 'Сохраняется явное притяжательное значение и многозначность существительного: мир, благополучие, благоденствие.'
- source_word: יִשְׂגֵּא
  choice: да умножится
  rationale: Желательная конструкция естественно оформляет приветственное благопожелание и близко передаёт значение увеличения.
