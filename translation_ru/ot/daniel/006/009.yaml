base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/009.yaml
  text: Now[a], O king, establish the injunction and sign the document so that it cannot be changed, according to the law of the Medes and Persians[b], which cannot be revoked.
translation:
  language: ru
  text: Итак, царь, утверди этот запрет и составь письменное постановление, чтобы его нельзя было изменить[a], согласно закону мидян и персов, который не может быть отменён[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которое нельзя изменять». Арамейский текст подчёркивает неизменность письменного постановления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «который не может быть упразднён». Буквально: «который не проходит» — юридическая идиома, указывающая на неотменимость закона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Итак
  rationale: Дискурсивное наречие вводит настойчивое обращение советников; «итак» естественно передаёт переход к требуемому действию, не усиливая причинного значения.
- source_word: מַלְכָּא
  choice: царь
  rationale: Слово употреблено как обращение; в современном русском звательная функция ясно выражается без частицы «о».
- source_word: תְּקִים
  choice: утверди
  rationale: Глагол означает установить или сделать твёрдым; в юридико-административном контексте «утверди» передаёт введение предписания в силу.
- source_word: אֱסָרָא
  choice: этот запрет
  rationale: Речь о предложенном ранее обязательном запрете. Указательное «этот» естественно связывает стих с контекстом, а «запрет» точнее широкого слова «указ».
- source_word: וְתִרְשֻׁם
  choice: и подпиши
  rationale: Буквально глагол связан с письменной фиксацией, но в данном правовом контексте обозначает официальное письменное удостоверение царём; «подпиши» ясно передаёт эту функцию.
- source_word: כְּתָבָא
  choice: документ
  rationale: Имеется в виду официальный письменный правовой акт; «документ» звучит современно и сохраняет акцент на письменной форме.
- source_word: דִּי לָא לְהַשְׁנָיָה
  choice: чтобы его нельзя было изменить
  rationale: Оборот выражает требуемую неизменность письменного акта; формулировка сохраняет целевое значение и юридическую категоричность.
- source_word: כְּדָת
  choice: согласно закону
  rationale: Слово обозначает закон, установление или правовой обычай; «согласно закону» естественно для данного юридического контекста.
- source_word: מָדַי וּפָרַס
  choice: мидян и персов
  rationale: Форма называет народы, чей закон приводится как основание; традиционная русская формулировка точна и понятна.
- source_word: דִּי לָא תֶעְדֵּא
  choice: который не может быть отменён
  rationale: Буквально закон «не проходит», то есть не утрачивает силы и не упраздняется; «не может быть отменён» передаёт юридическую идиому без буквалистской неясности.
