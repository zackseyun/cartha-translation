base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/016.yaml
  text: Then these men came by agreement to the king and said to the king[a], "Know, O king[b], that it is a law of the Medes and Persians that any injunction or statute that the king establishes cannot be changed."
translation:
  language: ru
  text: 'Тогда эти люди сообща явились к царю[a] и сказали ему: «Знай, царь: по закону мидян и персов никакой запрет или постановление[b], утверждённые царём, не могут быть изменены».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «сообща выступили против царя». Арамейский глагол может подразумевать согласованное и настойчивое действие, а не просто приближение.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод юридической пары: «никакое предписание или установление». Вместе эти слова охватывают разные виды обязательных царских решений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер обозначает следующий момент в последовательности событий; «тогда» естественно передаёт ход рассказа.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: эти люди
  rationale: Выражение указывает на уже упомянутых мужчин, действующих против Даниила.
- source_word: הַרְגִּשׁוּ עַל
  choice: сообща явились к
  rationale: Редкий арамейский оборот обозначает согласованное, настойчивое выступление группы; перевод сохраняет идею совместного действия, не сводя её к простому приближению.
- source_word: וְאָמְרִין לְמַלְכָּא
  choice: и сказали ему
  rationale: Местоимение устраняет неестественный для русского повтор слова «царь», сохраняя ясного адресата речи.
- source_word: דַּע מַלְכָּא
  choice: Знай, царь
  rationale: Сохраняются повелительное наклонение и прямое придворное обращение; частица «о» в современном русском звучала бы излишне архаично.
- source_word: דִּי דָת לְמָדַי וּפָרַס
  choice: по закону мидян и персов
  rationale: Естественная русская юридическая формулировка точно передаёт ссылку говорящих на обязательную правовую норму.
- source_word: כָל אֱסָר
  choice: никакой запрет
  rationale: אֱסָר обозначает обязательный запрет или ограничительное предписание; «запрет» ясно и точно передаёт его основной смысл.
- source_word: וּקְיָם
  choice: или постановление
  rationale: Слово обозначает установленное, имеющее силу решение; «постановление» сохраняет юридический регистр и отличается от «запрета».
- source_word: דִּי מַלְכָּא יְהָקֵים
  choice: утверждённые царём
  rationale: Причастная конструкция естественна по-русски и передаёт введение царём правового акта в силу.
- source_word: לָא לְהַשְׁנָיָה
  choice: не могут быть изменены
  rationale: Формулировка ясно выражает практическую неизменяемость таких царских актов.
