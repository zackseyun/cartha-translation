base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/012.yaml
  text: Then these men came by agreement and found Daniel petitioning and pleading before his God[a][b].
translation:
  language: ru
  text: Тогда эти люди явились сообща[a] и застали Даниила, когда он просил и умолял перед своим Богом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрались вместе»; возможно также: «пришли шумно». Арамейский глагол, вероятно, указывает на согласованное совместное действие этих людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «молился и возносил мольбы перед своим Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейское наречие продолжает последовательность событий; «тогда» естественно передаёт ход повествования.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: эти люди
  rationale: Сочетание существительного с указательным словом отсылает к только что упомянутым заговорщикам.
- source_word: הַרְגִּשׁוּ
  choice: действуя сообща
  rationale: В контексте главы глагол указывает на согласованное совместное действие; перевод сохраняет оттенок заранее скоординированного замысла, не сводя значение только к шумному сборищу.
- source_word: וְהַשְׁכַּחוּ
  choice: застали
  rationale: Глагол означает «нашли, обнаружили»; русское «застали» естественно показывает, что Даниила обнаружили во время действия.
- source_word: לְדָנִיֵּאל
  choice: Даниила
  rationale: Традиционная русская форма имени с винительным падежом после «застали».
- source_word: בָּעֵא
  choice: за молитвой
  rationale: Причастие обозначает обращение с просьбой; в данном контексте это молитвенное прошение. Конструкция «застали за молитвой» звучит естественно по-русски.
- source_word: וּמִתְחַנַּן
  choice: и мольбой
  rationale: Причастие передаёт настойчивое прошение о милости или благоволении. «Мольба» сохраняет интенсивность, не добавляя отсутствующего в тексте прямого объекта.
- source_word: קֳדָם
  choice: перед
  rationale: Обычное значение предлога — «перед, в присутствии»; «перед» кратко и уместно в молитвенном контексте.
- source_word: אֱלָהֵהּ
  choice: его Богом
  rationale: Форма содержит местоименный суффикс третьего лица мужского рода; творительный падеж обусловлен русским предлогом «перед».
theological_decisions:
- issue: Передача молитвенных действий Даниила без внесения дополнительного объекта просьбы
  choice: за молитвой и мольбой перед его Богом
  alternative: прося и умоляя перед своим Богом
  rationale: Два арамейских причастия описывают просьбу и настойчивую мольбу, но не называют прямо, о чём именно просил Даниил. Перевод сохраняет оба аспекта и не добавляет «о милости» или «о благоволении» как явный объект.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Действуя сообща» передаёт заговорщический оттенок без архаизма, а «застали за молитвой и мольбой» естественно выражает два одновременных молитвенных действия.
