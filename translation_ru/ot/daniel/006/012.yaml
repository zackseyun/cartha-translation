  source_fidelity: 'Основной смысл передан верно: אֱדַיִן — «тогда», גֻּבְרַיָּא אִלֵּךְ — «эти люди», וְהַשְׁכַּחוּ — «застали». Однако «действуя сообща» несколько ослабляет глагольное движение הַרְגִּשׁוּ («явились/собрались согласованно»), а именная конструкция «за молитвой и мольбой перед его Богом» менее точно отражает два арамейских причастия.'
