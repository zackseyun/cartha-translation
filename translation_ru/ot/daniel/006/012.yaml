  terminology: «Бог» и имя «Даниил» переданы корректно. «Перед своим Богом» точно воспроизводит קֳדָם и суффикс «его», при этом возвратное местоимение по-русски однозначно относится к Даниилу. Дополнительный объект просьбы не вводится.
