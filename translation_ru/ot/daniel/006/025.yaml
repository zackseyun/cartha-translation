  text: וַ/אֲמַ֣ר מַלְכָּ֗/א וְ/הַיְתִ֞יו גֻּבְרַיָּ֤/א אִלֵּךְ֙ דִּֽי אֲכַ֤לוּ קַרְצ֨וֹ/הִי֙ דִּ֣י דָֽנִיֵּ֔אל וּ/לְ/גֹ֤ב אַרְיָוָתָ/א֙ רְמ֔וֹ אִנּ֖וּן בְּנֵי/ה֣וֹן וּ/נְשֵׁי/ה֑וֹן וְ/לָֽא מְט֞וֹ לְ/אַרְעִ֣ית גֻּבָּ֗/א עַ֠ד דִּֽי שְׁלִ֤טֽוּ בְ/הוֹן֙ אַרְיָ֣וָתָ֔/א וְ/כָל גַּרְמֵי/ה֖וֹן הַדִּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/025.yaml
  text: Then the king commanded[a], and those men who had maliciously accused Daniel were brought and thrown into the lions’ den—they, their sons, and their wives. And before they reached the bottom of the den, the lions overpowered them and crushed all their bones.
translation:
  language: ru
  text: Тогда царь приказал, и привели тех людей, которые злонамеренно обвинили[a] Даниила. Их самих, их сыновей и их жён бросили в львиный ров. Не успели они достичь дна рва, как львы одолели их и сокрушили все их кости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ели его куски» — арамейская идиома со значением «клеветали», «злонамеренно обвиняли» или «доносили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר
  choice: Тогда царь приказал
  rationale: Глагол буквально означает «сказал», но в царском повествовательном контексте последующее исполнение приговора показывает силу распоряжения. «Тогда» передаёт развитие повествования.
- source_word: וְהַיְתִיו
  choice: привели
  rationale: Каузативная форма указывает, что этих людей велели привести. Неопределённо-личная русская конструкция естественна и сохраняет отсутствие названного исполнителя.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: тех людей
  rationale: Сочетание существительного с указательным словом отсылает к конкретной, уже известной группе обвинителей Даниила.
- source_word: אֲכַלוּ קַרְצֹוהִי דִּי דָנִיֵּאל
  choice: злонамеренно обвинили Даниила
  rationale: Арамейская идиома буквально говорит о «поедании кусков» человека и означает клеветнически обвинять или доносить на него. Выбранная формулировка сохраняет как обвинительный, так и враждебный оттенок.
- source_word: וּלְגֹב אַרְיָוָתָא רְמוֹ
  choice: бросили в львиный ров
  rationale: גּוֹב обозначает яму или ров; «львиный ров» соответствует контексту главы и привычно звучит по-русски. «Бросили» передаёт насильственный характер действия.
- source_word: אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן
  choice: их самих, их сыновей и их жён
  rationale: Усилительное местоимение передано словами «их самих». Источник прямо называет сыновей, а не детей вообще.
- source_word: וְלָא מְטוֹ לְאַרְעִית גֻּבָּא עַד דִּי
  choice: Не успели они достичь дна рва, как
  rationale: 'Естественная русская конструкция точно выражает отрицательно-временное отношение: нападение произошло прежде, чем они достигли дна.'
- source_word: שְׁלִטוּ בְהוֹן אַרְיָוָתָא
  choice: львы одолели их
  rationale: Глагол выражает господство или превосходство над кем-либо; «одолели» ясно и естественно передаёт это в сцене нападения.
- source_word: וְכָל גַּרְמֵיהוֹן הַדִּקוּ
  choice: и сокрушили все их кости
  rationale: Формулировка сохраняет полноту, выраженную словом «все», и сильное значение раздробления костей.
theological_decisions:
- issue: Наказание семей обвинителей вместе с ними
  choice: 'Сохранено прямое упоминание: «их самих, их сыновей и их жён».'
  alternative: Обобщить как «их детей» либо смягчить или опустить упоминание семей.
  rationale: Арамейский текст недвусмысленно включает сыновей и жён в исполнение царского приговора. Перевод не должен ни смягчать тяжесть повествования, ни добавлять отсутствующую в стихе нравственную оценку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; жестокость сцены и конкретное упоминание членов семей сохранены без смягчения и без добавочного комментария.
