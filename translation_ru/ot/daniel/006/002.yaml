- source_word: עַל מַלְכוּתָא
  choice: над царством
  rationale: Предложное сочетание обозначает сферу административной власти назначаемых чиновников.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапов
  rationale: Исторически точное и принятое русское наименование высокопоставленных областных правителей Персидской державы; пояснительная альтернатива дана в сноске.
- source_word: מְאָה וְעֶשְׂרִין
  choice: сто двадцать
  rationale: Числительное передано словами в соответствии с нормой связного литературного текста.
- source_word: דִּי לֶהֱוֺן
  choice: чтобы они были
  rationale: Относительная частица с имперфектом здесь выражает предполагаемый результат или цель назначения; русский оборот сохраняет эту перспективную направленность.
- source_word: בְּכָל מַלְכוּתָא
  choice: по всему царству
  rationale: Выражение указывает на распределение чиновников по всей территории державы.
