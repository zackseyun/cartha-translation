base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/021.yaml
  text: And when he came near the den[a], he cried out to Daniel with a distressed voice. The king spoke and said to Daniel, “Daniel, servant of the living God, has your God, whom you continually serve[c][b], been able to deliver you from the lions?”
translation:
  language: ru
  text: 'И когда он приблизился ко рву, то скорбным голосом громко позвал Даниила. Царь сказал Даниилу: «Даниил, служитель живого Бога! Смог ли твой Бог, Которому ты постоянно служишь[b], спасти тебя от львов?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «Которому ты постоянно поклоняешься». Арамейский глагол может обозначать религиозное служение или поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמִקְרְבֵהּ
  choice: И когда он приблизился
  rationale: Арамейская конструкция вводит временное обстоятельство; «когда он приблизился» точно и естественно передаёт последовательность действий.
- source_word: גֻבָּא
  choice: ко рву
  rationale: Слово обозначает яму или ров; в данном повествовании речь идёт об углублённом месте содержания львов. «Ров» сохраняет конкретный образ и привычен для русского библейского повествования.
- source_word: בְּקָל עֲצִיב
  choice: скорбным голосом
  rationale: Прилагательное передаёт скорбь, печаль и душевную боль; сочетание естественно звучит по-русски.
- source_word: זְעִק
  choice: окликнул
  rationale: Глагол обозначает громкий, настойчивый зов; «окликнул» подходит к обращению царя к находящемуся во рву Даниилу.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Царь заговорил и сказал
  rationale: Устойчивая арамейская формула вводит речь. «Заговорил и сказал» сохраняет её двучленность, не предполагая обязательно ответа на предшествующую реплику.
- source_word: עֲבֵד אֱלָהָא חַיָּא
  choice: служитель живого Бога
  rationale: עֲבֵד может означать раба или слугу; здесь это почётное обозначение преданного Богу человека. «Служитель» естественно передаёт религиозно-служебный смысл без излишнего социально-правового оттенка.
- source_word: דִּי אנתה פָּלַח לֵהּ בִּתְדִירָא
  choice: Которому ты постоянно служишь
  rationale: Пָלַח обозначает религиозное служение, включая поклонение, а בִּתְדִירָא — непрерывность или постоянство. Выбор сохраняет широкий смысл и связь со словом «служитель».
- source_word: הַיְכִל לְשֵׁיזָבוּתָךְ
  choice: Смог ли ... спасти тебя
  rationale: Вопрос относится к уже совершившейся попытке избавления. «Спасти» естественно передаёт физическое избавление от смертельной опасности, не исключая богословского звучания.
- source_word: מִן אַרְיָוָתָא
  choice: от львов
  rationale: Прямой и достаточный эквивалент арамейской предложной конструкции.
theological_decisions:
- issue: Характер отношений Даниила с Богом в выражении עֲבֵד אֱלָהָא
  choice: служитель живого Бога
  alternative: раб живого Бога; слуга живого Бога
  rationale: В контексте царского обращения выражение подчёркивает верность и посвящённое служение Даниила. «Служитель» сохраняет почётный религиозный оттенок, не делая главным юридический статус раба.
- issue: Значение религиозного глагола פָּלַח
  choice: Которому ты постоянно служишь
  alternative: Которому ты постоянно поклоняешься
  rationale: Глагол охватывает как служение, так и поклонение. «Служишь» сохраняет более широкий смысл постоянной верности и лексическую связь с обозначением Даниила как служителя; альтернативу следует отметить в сноске.
- issue: Смысл избавления в לְשֵׁיזָבוּתָךְ
  choice: спасти тебя
  alternative: избавить тебя; вызволить тебя
  rationale: Здесь непосредственно имеется в виду физическое спасение от львов. Формулировка не ограничивает и не преувеличивает возможный богословский резонанс.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис сохраняет заметную двучленность арамейской формулы речи, но остаётся понятным. Маркер [b] расположен непосредственно после слова, к которому относится примечание.
