  text: בֵּ/אדַ֣יִן מַלְכָּ֗/א שַׂגִּיא֙ טְאֵ֣ב עֲל֔וֹ/הִי וּ/לְ/דָ֣נִיֵּ֔אל אֲמַ֖ר לְ/הַנְסָקָ֣ה מִן גֻּבָּ֑/א וְ/הֻסַּ֨ק דָּנִיֵּ֜אל מִן גֻּבָּ֗/א וְ/כָל חֲבָל֙ לָא הִשְׁתְּכַ֣ח בֵּ֔/הּ דִּ֖י הֵימִ֥ן בֵּ/אלָהֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/024.yaml
  text: Then the king was very glad because of him[a], and he ordered that Daniel be brought up from the pit. So Daniel was brought up from the pit, and no kind of harm was found on him[b], because he had trusted in his God.
translation:
  language: ru
  text: Тогда царь очень обрадовался за него и велел поднять Даниила из ямы[a]. Даниила подняли из ямы, и на нём не нашли никаких повреждений, потому что он доверился своему Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изо рва». Арамейское слово обозначает ямообразное углубление или помещение; здесь речь идёт о львином рве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поверил своему Богу». Арамейский глагол может означать как веру, так и доверие; в данном контексте «доверился» подчёркивает личное упование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: שַׂגִּיא טְאֵב עֲלוֹהִי
  choice: очень обрадовался за него
  rationale: Сочетание наречия степени с глаголом передаёт сильную радость царя по поводу Даниила; выражение «обрадовался за него» естественно в современном русском языке.
- source_word: וּלְדָנִיֵּאל אֲמַר לְהַנְסָקָה
  choice: велел поднять Даниила
  rationale: Хотя буквально сказано «сказал о Данииле, чтобы поднять», инфинитивная конструкция в контексте выражает распоряжение.
- source_word: מִן גֻּבָּא
  choice: из ямы
  rationale: Существительное обозначает углублённое, ямообразное место или помещение. «Яма» непосредственно передаёт пространственный образ; по контексту это львиный ров.
- source_word: וְהֻסַּק
  choice: подняли
  rationale: Каузативная пассивная форма означает, что Даниила подняли или извлекли наверх; безличная активная конструкция естественна по-русски и сохраняет связь с царским приказом.
- source_word: וְכָל חֲבָל לָא הִשְׁתְּכַח בֵּהּ
  choice: и на нём не нашли никаких повреждений
  rationale: חֲבָל здесь означает телесный вред или повреждение, а כָל при отрицании придаёт всеохватный смысл. «На нём не нашли» передаёт результат осмотра.
- source_word: דִּי הֵימִן בֵּאלָהֵהּ
  choice: потому что он доверился своему Богу
  rationale: דִּי вводит причину, а הֵימִן выражает веру или доверие. «Доверился» подчёркивает личное упование, не исключая значения «поверил»; притяжательное «своему» естественно передаёт суффикс третьего лица.
theological_decisions:
- issue: Основание избавления Даниила
  choice: потому что он доверился своему Богу
  alternative: потому что он поверил своему Богу
  rationale: Текст прямо связывает отсутствие повреждений с доверием Даниила Богу. Перевод сохраняет эту причинную связь, не уточняя сверх сказанного механизм избавления и не превращая доверие в отвлечённое интеллектуальное согласие.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом и умеренно торжественным библейским звучанием. Лексические повторы исходного текста сохранены там, где они поддерживают связность рассказа.
