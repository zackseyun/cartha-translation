  yaml_path: translation/ot/daniel/006/028.yaml
  text: who rescues and delivers, and works signs and wonders in heaven and on earth—he who rescued Daniel from the power of the lions.
translation:
  language: ru
  text: Он спасает и избавляет, совершает знамения и чудеса на небе и на земле — Он спас Даниила от власти львов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשֵׁיזִב וּמַצִּל
  choice: спасает и избавляет
  rationale: Сохраняет парные арамейские причастия со сходными, но не полностью тождественными значениями.
- source_word: וְעָבֵד אָתִין וְתִמְהִין
  choice: совершает знамения и чудеса
  rationale: Естественная русская библейская формула, точно передающая действие и устойчивую пару существительных.
- source_word: בִּשְׁמַיָּא וּבְאַרְעָא
  choice: на небе и на земле
  rationale: Передаёт пространственные выражения современно и без ненужной архаизации.
- source_word: מִן יַד אַרְיָוָתָא
  choice: от власти львов
  rationale: Идиома «из руки» здесь обозначает власть или силу; буквальное «из лап» было бы конкретнее исходного образа и стилистически снижено.
theological_decisions:
- issue: Связь заключительной относительной конструкции דִּי שֵׁיזִיב
  choice: — Он спас Даниила
  alternative: — Тот, кто спас Даниила
  rationale: Арамейское דִּי допускает относительное продолжение; самостоятельное «Он спас» естественно по-русски и сохраняет смысл без искусственного утяжеления.
translation_notes:
  register: Современный литературный русский язык с достоинством царского исповедания; сохранён поэтический параллелизм, избегнута излишняя церковнославянская окраска.
