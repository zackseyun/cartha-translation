  text: וְ/עֵ֤לָּא מִנְּ/הוֹן֙ סָרְכִ֣ין תְּלָתָ֔א דִּ֥י דָנִיֵּ֖אל חַֽד מִנְּ/ה֑וֹן דִּֽי לֶהֱוֺ֞ן אֲחַשְׁדַּרְפְּנַיָּ֣/א אִלֵּ֗ין יָהֲבִ֤ין לְ/הוֹן֙ טַעְמָ֔/א וּ/מַלְכָּ֖/א לָֽא לֶהֱוֵ֥א נָזִֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/003.yaml
  text: And over them were three high officials[a], of whom Daniel was one[b], so that these satraps might give account to them and the king might suffer no loss.
translation:
  language: ru
  text: А над ними были три высших сановника, одним из которых был Даниил, чтобы сатрапы отчитывались перед ними[a] и царь не терпел ущерба[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представляли им отчёт»; арамейское выражение может обозначать отчёт или доклад в административном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царю не был причинён вред»; вероятнее всего, имеется в виду административный или финансовый ущерб царским интересам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵלָּא מִנְּהוֹן
  choice: А над ними были
  rationale: Оборот обозначает более высокий уровень управления над сатрапами; «над ними» естественно передаёт иерархический смысл.
- source_word: סָרְכִין תְּלָתָא
  choice: три высших сановника
  rationale: Термин называет высокопоставленных надзирателей над сатрапами. «Высшие сановники» сохраняет ранг и исторический колорит, не используя современное политическое звание «президенты».
- source_word: דִּי דָנִיֵּאל חַד מִנְּהוֹן
  choice: одним из которых был Даниил
  rationale: Относительное придаточное ясно и естественно указывает, что Даниил входил в число троих.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапы
  rationale: Это устоявшееся историческое обозначение персидской административной должности, сохраняющее культурный контекст.
- source_word: יָהֲבִין לְהוֹן טַעְמָא
  choice: сатрапы отчитывались перед ними
  rationale: В административном контексте выражение передаёт подотчётность или представление доклада. «Отчитывались перед ними» естественно выражает эту функцию по-русски.
- source_word: וּמַלְכָּא לָא לֶהֱוֵא נָזִק
  choice: и царь не терпел ущерба
  rationale: В данном бюрократическом контексте נזק означает ущерб царским интересам, вероятно финансовый или административный; формулировка не ограничивает смысл физическим вредом.
