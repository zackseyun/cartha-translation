  text: אֱדַ֨יִן סָֽרְכַיָּ֜/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֗/א הֲו֨וֹ בָעַ֧יִן עִלָּ֛ה לְ/הַשְׁכָּחָ֥ה לְ/דָנִיֵּ֖אל מִ/צַּ֣ד מַלְכוּתָ֑/א וְ/כָל עִלָּ֨ה וּ/שְׁחִיתָ֜ה לָא יָכְלִ֣ין לְ/הַשְׁכָּחָ֗ה כָּ/ל קֳבֵל֙ דִּֽי מְהֵימַ֣ן ה֔וּא וְ/כָל שָׁלוּ֙ וּ/שְׁחִיתָ֔ה לָ֥א הִשְׁתְּכַ֖חַת עֲלֽוֹ/הִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/005.yaml
  text: Then the high officials and satraps tried to find grounds for accusing Daniel in matters of the kingdom, but they could find no grounds for accusation or corruption, because he was trustworthy[a], and no negligence[b] or corruption could be found against him.
translation:
  language: ru
  text: Тогда высшие сановники и сатрапы стали искать основания обвинить Даниила в том, что касалось управления царством, но не смогли найти ни оснований для обвинения, ни злоупотребления, потому что он был надёжен[a], и у него не нашлось ни упущения[b], ни злоупотребления.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верен»; арамейское слово здесь говорит о том, что Даниил заслуживал доверия при исполнении своих обязанностей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ошибки», «промаха» или «небрежности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Передаёт последовательное развитие повествования естественным современным русским языком.
- source_word: סָרְכַיָּא
  choice: высшие сановники
  rationale: Передаёт высокий административный ранг, не навязывая спорной точной идентификации должности.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапы
  rationale: Устоявшийся исторический термин для правителей областей в персидской административной системе.
- source_word: בָעַיִן ... לְהַשְׁכָּחָה
  choice: стали искать
  rationale: Естественно передаёт начавшиеся и продолжавшиеся попытки найти повод для обвинения.
- source_word: עִלָּה
  choice: основания обвинить / основания для обвинения
  rationale: Существительное обозначает повод или основание для выдвижения обвинения; вариативное синтаксическое оформление избегает тяжёлого повтора.
- source_word: מִצַּד מַלְכוּתָא
  choice: в том, что касалось управления царством
  rationale: Контекст указывает на служебную деятельность Даниила в государственном управлении, а не на царство вообще.
- source_word: שְׁחִיתָה
  choice: злоупотребление
  rationale: В административном контексте обозначает порочное или коррупционное поведение; «злоупотребление» звучит естественно и не сужает значение до взяточничества.
- source_word: מְהֵימַן
  choice: надёжен
  rationale: Передаёт служебную добросовестность и доверие к Даниилу без обязательного религиозного оттенка слова «верен».
- source_word: שָׁלוּ
  choice: упущение
  rationale: Сохраняет диапазон значения служебной ошибки, промаха или небрежности.
- source_word: הִשְׁתְּכַחַת עֲלֹוהִי
  choice: у него не нашлось
  rationale: Естественно по-русски выражает результат проверки; контекст ясно показывает, что речь идёт о возможных проступках, которые могли быть поставлены ему в вину.
theological_decisions:
- issue: Характер надёжности Даниила
  choice: «он был надёжен» — в смысле добросовестности и надёжности на государственной службе
  alternative: «он был верен» или «ему можно было доверять»
  rationale: Контекст непосредственно касается исполнения должностных обязанностей. Выбор не исключает нравственной верности, но не превращает стих в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Административная лексика ясна обычному читателю; сохранён исторический термин «сатрапы». Повтор ключевых понятий в основном удержан, но синтаксис сделан естественным для русского языка.
