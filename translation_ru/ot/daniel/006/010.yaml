lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Поэтому
  rationale: Арамейское устойчивое выражение указывает на следствие предшествующих событий; «поэтому» естественно и точно передаёт эту связь.
- source_word: מַלְכָּא דָּרְיָוֶשׁ
  choice: царь Дарий
  rationale: Сохранены царский титул и обычная для современного русского языка последовательность титула и имени.
- source_word: רְשַׁם
  choice: подписал
  rationale: В данном юридико-административном контексте глагол обозначает письменное оформление, которым царь придаёт постановлению силу; «подписал» естественно передаёт это действие, хотя более формально возможно «записал».
- source_word: כְּתָבָא
  choice: документ
  rationale: Слово обозначает письменный текст или официальный документ; выбран современный нейтральный юридический термин.
- source_word: וֶאֱסָרָא
  choice: с запретом
  rationale: Существительное обозначает обязательный запрет. Конструкция «документ с запретом» ясно передаёт связь двух существительных и избегает неестественного впечатления, будто царь подписал два отдельных предмета.
