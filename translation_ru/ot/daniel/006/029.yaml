source:
  edition: WLC
  text: וְ/דָנִיֵּ֣אל דְּנָ֔ה הַצְלַ֖ח בְּ/מַלְכ֣וּת דָּרְיָ֑וֶשׁ וּ/בְ/מַלְכ֖וּת כּ֥וֹרֶשׁ פרסי/א׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/029.yaml
  text: And this Daniel prospered during the reign of Darius and during the reign of Cyrus the Persian[a].
translation:
  language: ru
  text: И этот Даниил преуспевал во время царствования Дария и во время царствования Кира Персидского[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «во время царствования Дария, то есть царствования Кира Персидского», если оба имени относятся к одному правителю.'
    reason: Альтернативное понимание синтаксической связи между двумя оборотами сохраняет возможность отождествления Дария и Кира, не вводя её в основной текст.
lexical_decisions:
- source_word: דְּנָה
  choice: этот
  rationale: Указательное местоимение особо выделяет уже упомянутого Даниила; оборот «этот Даниил» сохраняет эмфатическую, возобновляющую функцию арамейского выражения.
- source_word: הַצְלַח
  choice: преуспевал
  rationale: Глагол означает быть успешным, благополучно действовать или преуспевать. «Преуспевал» кратко передаёт длительный характер действия и не ограничивает успех только материальным достатком.
- source_word: בְּמַלְכוּת
  choice: во время царствования
  rationale: Хотя буквально возможно «в царстве/царствовании», здесь оборот имеет прежде всего временной смысл и указывает на период правления соответствующего царя.
- source_word: דָּרְיָוֶשׁ
  choice: Дария
  rationale: Традиционная и общепринятая русская форма царского имени в требуемом родительном падеже.
- source_word: וּבְמַלְכוּת
  choice: и во время царствования
  rationale: Повтор предложно-именного оборота сохранён ради ясности и соответствия структуре источника.
- source_word: כּוֹרֶשׁ
  choice: Кира
  rationale: Традиционная и общепринятая русская форма царского имени в требуемом родительном падеже.
- source_word: פרסי
  choice: Персидского
  rationale: Определение обозначает персидскую принадлежность Кира. «Кир Персидский» — прямое и естественное русское соответствие.
theological_decisions:
- issue: Соотношение Дария и Кира в стихе
  choice: Обе части переданы прямо, без уточнения, являются ли Дарий и Кир разными правителями или двумя именами одного правителя.
  alternative: 'Понять вторую часть как пояснение: «во время царствования Дария, то есть царствования Кира Персидского».'
  rationale: Арамейский текст соединяет два оборота союзом, но сам по себе не разрешает историческую идентификацию правителей. Основной перевод сохраняет эту неоднозначность, а возможное пояснительное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; повтор «во время царствования» намеренно сохраняет структуру и ритм источника.
