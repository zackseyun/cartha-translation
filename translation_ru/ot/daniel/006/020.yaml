lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: מַלְכָּא
  choice: царь
  rationale: Эмфатическая форма определённа; по-русски определённость однозначно задаётся контекстом.
- source_word: בִּשְׁפַּרְפָּרָא
  choice: на рассвете
  rationale: Обозначает ранний рассвет, начало дня; выбран естественный современный эквивалент.
- source_word: יְקוּם
  choice: встал
  rationale: Глагол означает вставать или подниматься; «встал» точно и естественно в данном повествовании.
- source_word: בְּנָגְהָא
  choice: при первых лучах света
  rationale: Слово связано со светом и сиянием. Отдельная передача сохраняет усиление, создаваемое двумя близкими обозначениями рассвета.
- source_word: וּבְהִתְבְּהָלָה
  choice: и поспешно
  rationale: Существительное выражает поспешность, смятение или тревожную срочность; наречие естественно передаёт образ действия, не исключая эмоционального оттенка.
- source_word: לְגֻבָּא
  choice: ко рву
  rationale: Слово обозначает яму или ров; в русском библейском контексте «львиный ров» точно описывает место содержания львов.
- source_word: דִי
  choice: со
  rationale: Относительная частица связывает ров со львами; русская конструкция «ров со львами» естественно передаёт отношение без лишнего уточнения.
- source_word: אַרְיָוָתָא
  choice: львами
  rationale: Множественное число эмфатической формы указывает на известных из контекста львов; русская предложная конструкция не требует отдельного показателя определённости.
- source_word: אֲזַל
  choice: пошёл
  rationale: Обычный арамейский глагол движения; «пошёл» прямо передаёт направленное действие.
