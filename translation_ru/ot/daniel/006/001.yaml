lexical_decisions:
- source_word: וְ/דָרְיָוֶשׁ
  choice: И Дарий
  rationale: Союз וְ передан нейтральным «И», что сохраняет связь с предшествующим повествованием, не уточняя её характер.
- source_word: מָדָיָא
  choice: Мидянин
  rationale: Арамейское обозначение происхождения естественно передаётся традиционным русским этнонимом «Мидянин».
- source_word: קַבֵּל
  choice: получил
  rationale: Основное значение глагола — «получить, принять». Этот вариант не утверждает, каким именно образом Дарий пришёл к власти.
- source_word: מַלְכוּתָא
  choice: царство
  rationale: «Царство» естественно передаёт здесь сферу царской власти, сохраняя традиционную и понятную русскую формулировку.
- source_word: כְּבַר שְׁנִין
  choice: когда ему было около … лет
  rationale: Возрастная формула передана современным русским оборотом; «около» сохраняет приблизительность арамейской конструкции.
- source_word: שִׁתִּין וְתַרְתֵּין
  choice: шестидесяти двух
  rationale: Числительное передано в нормативной современной русской форме с учётом управления в возрастном обороте.
theological_decisions:
- issue: Характер воцарения Дария
  choice: получил царство
  alternative: овладел царством
  rationale: Формулировка близка к арамейскому тексту и не решает исторический вопрос о том, завоевал ли Дарий царство, унаследовал его или получил власть иным способом.
