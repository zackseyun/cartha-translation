  source_fidelity: 'Текст точно передаёт арамейскую последовательность и смысл: выделенное «этот Даниил», его превосходство над сановниками и сатрапами, причинное «потому что», неопределённо-открытое выражение «необыкновенный дух» и ещё не осуществлённое намерение царя поставить его над всем царством. «Дух» не истолкован как однозначно божественный либо как простая способность.'
