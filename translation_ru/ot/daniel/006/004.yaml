id: DAN.6.4
reference: Daniel 6:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֱדַ֨יִן֙ דָּנִיֵּ֣אל דְּנָ֔ה הֲוָ֣א מִתְנַצַּ֔ח עַל סָרְכַיָּ֖/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֑/א כָּ/ל קֳבֵ֗ל דִּ֣י ר֤וּחַ יַתִּירָא֙ בֵּ֔/הּ וּ/מַלְכָּ֣/א עֲשִׁ֔ית לַ/הֲקָמוּתֵ֖/הּ עַל כָּל מַלְכוּתָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/004.yaml
  text: Then this Daniel distinguished himself above the high officials and the satraps[a], because an extraordinary spirit was in him[b], and the king planned to set him over the whole kingdom.
translation:
  language: ru
  text: Тогда этот Даниил превосходил высших сановников и сатрапов, потому что в нём был необыкновенный дух[a], и царь намеревался[b] поставить его над всем царством.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превосходный дух». Это выражение может в широком смысле указывать на исключительные внутренние качества, мудрость или склад характера Даниила.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «задумал». Речь идёт о намерении царя назначить Даниила, а не о состоявшемся назначении.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Передаёт последовательное развитие повествования естественным современным русским языком.
- source_word: דָּנִיֵּאל דְּנָה
  choice: этот Даниил
  rationale: Сохраняет выделительное указательное местоимение דְּנָה, а не сводит выражение к простому имени.
- source_word: הֲוָא מִתְנַצַּח
  choice: превосходил
  rationale: Передаёт продолжительное или характерное превосходство Даниила без тяжеловесного буквального воспроизведения арамейской конструкции.
- source_word: סָרְכַיָּא
  choice: высших сановников
  rationale: Обозначает высокопоставленных царских должностных лиц; формулировка понятна и не навязывает спорного точного соответствия административной должности.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапов
  rationale: Сохраняет исторически конкретное название должности в персидском государственном управлении.
- source_word: כָּל־קֳבֵל דִּי
  choice: потому что
  rationale: Ясно выражает указанную в тексте причину превосходства Даниила.
- source_word: רוּחַ יַתִּירָא
  choice: необыкновенный дух
  rationale: Сохраняет образ «духа» и значение исключительного качества, не сводя выражение только к способностям, характеру или прямому указанию на Святого Духа.
- source_word: וּמַלְכָּא עֲשִׁית
  choice: и царь намеревался
  rationale: Передаёт замысел или намерение царя, а не уже совершённое назначение.
- source_word: לַהֲקָמוּתֵהּ
  choice: поставить его
  rationale: Естественно передаёт каузативное значение «сделать стоящим», то есть возвести или назначить на положение власти.
- source_word: עַל כָּל מַלְכוּתָא
  choice: над всем царством
  rationale: Выражает предполагаемую власть над всей областью царского правления.
theological_decisions:
- issue: Значение слова «дух» как причины превосходства Даниила
  choice: Сохранено выражение «необыкновенный дух» без уточнения его природы.
  alternative: «выдающиеся способности», «превосходный характер» или явное отождествление со Святым Духом.
  rationale: Арамейский текст говорит, что в Данииле был רוּחַ יַתִּירָא, но в этом стихе не определяет, идёт ли речь о складе личности, мудрости, даровании или особом действии Бога. Буквенный образ сохраняет эту смысловую и богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Этот Даниил» намеренно сохраняет выделение оригинала; «сатрапы» оставлено как узнаваемый исторический термин. Синтаксис сделан ясным и плавным, без архаизмов.
