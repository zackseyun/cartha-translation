  text: אֱלָהִ֞/י שְׁלַ֣ח מַלְאֲכֵ֗/הּ וּֽ/סֲגַ֛ר פֻּ֥ם אַרְיָוָתָ֖/א וְ/לָ֣א חַבְּל֑וּ/נִי כָּ/ל קֳבֵ֗ל דִּ֤י קָֽדָמ֨וֹ/הִי֙ זָכוּ֙ הִשְׁתְּכַ֣חַת לִ֔/י וְ/אַ֤ף קדמי/ך מַלְכָּ֔/א חֲבוּלָ֖ה לָ֥א עַבְדֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/023.yaml
  text: My God sent his angel and shut the mouths of the lions[a], and they have not harmed me, because innocence was found in me before him; and also before you, O king[c][b], I have done no harm.
translation:
  language: ru
  text: Бог мой послал своего ангела и закрыл пасти львов[a], и они не причинили мне вреда, потому что перед Ним во мне была найдена невиновность[b]; и перед тобой, царь, я также не сделал ничего дурного[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего посланника». Арамейское слово может обозначать как посланника, так и ангела; в данном чудесном контексте предпочтительно «ангела».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед Ним во мне были найдены чистота» или «непорочность». Букв.: «перед Ним была найдена во мне невиновность».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и перед тобой, царь, я не совершил проступка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהִי
  choice: Бог мой
  rationale: Личное обращение Даниила сохраняет притяжательное значение; порядок слов придаёт фразе естественный для торжественной русской речи оттенок.
- source_word: מַלְאֲכֵהּ
  choice: Своего ангела
  rationale: Слово может означать посланника или ангела; чудесное избавление указывает здесь на небесного посланника. «Своего» ясно относит ангела к Богу.
- source_word: וּסֲגַר פֻּם אַרְיָוָתָא
  choice: и закрыл пасти львам
  rationale: Передаёт образ закрытых львиных пастей естественно и близко к арамейской конструкции.
- source_word: וְלָא חַבְּלוּנִי
  choice: и они не причинили мне вреда
  rationale: Множественное число относится ко львам; выражение охватывает как телесное повреждение, так и вред вообще.
- source_word: כָּל־קֳבֵל דִּי
  choice: потому что
  rationale: Ясно передаёт причинную связь между признанной невиновностью и избавлением.
- source_word: זָכוּ הִשְׁתְּכַחַת לִי
  choice: я оказался невиновен
  rationale: Естественно по-русски передаёт судебно-нравственный смысл буквального «невиновность была найдена у меня», не утверждая безгрешность Даниила вообще.
- source_word: קָדָמוֹהִי
  choice: перед Ним
  rationale: Сохраняет пространственно-судебную метафору оценки в Божьем присутствии.
- source_word: וְאַף קֳדָמָיךְ מַלְכָּא
  choice: и перед тобой, царь, я также
  rationale: Сохраняет добавление второй стороны, перед которой Даниил невиновен, и прямое обращение к царю.
- source_word: חֲבוּלָה לָא עַבְדֵת
  choice: не сделал ничего дурного
  rationale: Передаёт отсутствие причинённого ущерба или совершённого проступка в естественной современной русской форме.
theological_decisions:
- issue: Кого обозначает מַלְאֲכֵהּ в рассказе о чудесном избавлении
  choice: Своего ангела
  alternative: Своего посланника
  rationale: Контекст указывает на сверхъестественного Божьего посланника, но перевод не уточняет его личность сверх сказанного в тексте.
- issue: Объём утверждения о невиновности Даниила
  choice: перед Ним я оказался невиновен
  alternative: во мне была найдена чистота
  rationale: Фраза передаёт оправдание Даниила в данном деле перед Богом, не превращая его слова в заявление об абсолютной безгрешности.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Сохранены прямое обращение к царю, судебный оттенок невиновности и различие между Божьим оправданием и отсутствием вреда, причинённого царю.
