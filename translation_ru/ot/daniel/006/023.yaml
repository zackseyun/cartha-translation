  rationale: Исправлена двусмысленная конструкция «закрыл пасти львам» на ясное «закрыл пасти львов». Пассивная формула о найденной невиновности восстановлена ближе к арамейскому тексту и согласована со сноской, без утверждения абсолютной безгрешности. Остальная структура, причинная связь, обращение к царю и лексическая альтернатива для «ангела/посланника» сохранены.
