  text: אֱדַ֨יִן מַלְכָּ֜/א כְּ/דִ֧י מִלְּתָ֣/א שְׁמַ֗ע שַׂגִּיא֙ בְּאֵ֣שׁ עֲל֔וֹ/הִי וְ/עַ֧ל דָּנִיֵּ֛אל שָׂ֥ם בָּ֖ל לְ/שֵׁיזָבוּתֵ֑/הּ וְ/עַד֙ מֶֽעָלֵ֣י שִׁמְשָׁ֔/א הֲוָ֥א מִשְׁתַּדַּ֖ר לְ/הַצָּלוּתֵֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/015.yaml
  text: Then the king[a], when he heard the statement, was greatly distressed, and he set his mind on delivering Daniel; and until the going down of the sun he kept striving to rescue him.
translation:
  language: ru
  text: Тогда царь, услышав эти слова, сильно огорчился[a] и решил спасти Даниила; до самого захода солнца он прилагал все усилия, чтобы избавить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был очень недоволен собой»; буквально арамейская идиома означает «сильно огорчился (или был недоволен) из-за себя / на себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее по времени событие; «тогда» естественно передаёт последовательность.
- source_word: מַלְכָּא
  choice: царь
  rationale: Существительное в определённом (эмфатическом) состоянии указывает на уже известного из контекста царя.
- source_word: כְּדִי מִלְּתָא שְׁמַע
  choice: услышав эти слова
  rationale: כְּדִי вводит временную связь, а מִלְּתָא означает «слово, высказывание, дело». Деепричастный оборот естественно передаёт связь действий; «эти слова» указывает на только что сказанное в контексте.
- source_word: שַׂגִּיא בְּאֵשׁ עֲלוֹהִי
  choice: сильно огорчился
  rationale: Идиома выражает сильное внутреннее огорчение или недовольство; возможный рефлексивный оттенок сохранён в сноске.
- source_word: וְעַל דָּנִיֵּאל שָׂם בָּל
  choice: и решил спасти Даниила
  rationale: Буквально «на Даниила положил сердце»; в контексте это означает, что царь направил свою волю и внимание на его спасение. «Решил» передаёт целенаправленную решимость без неестественной кальки.
- source_word: לְשֵׁיזָבוּתֵהּ
  choice: спасти Даниила
  rationale: Глагольное существительное обозначает избавление или спасение; имя повторено по-русски для ясности.
- source_word: וְעַד מֶעָלֵי שִׁמְשָׁא
  choice: до самого захода солнца
  rationale: Арамейское выражение означает закат; частица «самого» естественно подчёркивает предельный момент продолжительных усилий.
- source_word: הֲוָא מִשְׁתַּדַּר
  choice: он прилагал все усилия
  rationale: Перифрастическая конструкция передаёт продолжительное, настойчивое действие; русский оборот ясно выражает интенсивные усилия.
- source_word: לְהַצָּלוּתֵהּ
  choice: чтобы избавить его
  rationale: Второй термин спасения передан словом «избавить», что сохраняет смысл освобождения от грозящей опасности и позволяет избежать тяжёлого повтора.
