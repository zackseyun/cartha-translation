id: DAN.6.14
reference: Daniel 6:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בֵּ֠/אדַיִן עֲנ֣וֹ וְ/אָמְרִין֮ קֳדָ֣ם מַלְכָּ/א֒ דִּ֣י דָנִיֵּ֡אל דִּי֩ מִן בְּנֵ֨י גָלוּתָ֜/א דִּ֣י יְה֗וּד לָא שָׂ֨ם עלי/ך מַלְכָּ/א֙ טְעֵ֔ם וְ/עַל אֱסָרָ֖/א דִּ֣י רְשַׁ֑מְתָּ וְ/זִמְנִ֤ין תְּלָתָה֙ בְּ/יוֹמָ֔/א בָּעֵ֖א בָּעוּתֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/014.yaml
  text: Then they answered and said before the king[a], “Daniel, who is one of the exiles from Judah, pays no attention to you, O king, or to the injunction that you have signed[c][b], but three times a day he makes his petition.”
translation:
  language: ru
  text: 'Тогда они ответили и сказали перед царём: «Даниил, один из изгнанников из Иудеи, не считается с тобой, царь[a], и с запретом, который ты подписал[b], но три раза в день возносит своё прошение[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не придаёт тебе значения» или «не обращает на тебя внимания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с постановлением»; здесь имеется в виду обязательный правовой запрет.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ищет своего прошения». Адресат здесь прямо не назван, хотя из контекста ясно, что Даниил обращается к своему Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: עֲנוֹ וְאָמְרִין
  choice: они ответили и сказали
  rationale: Сохранены оба глагола распространённой семитской речевой формулы.
- source_word: קֳדָם מַלְכָּא
  choice: перед царём
  rationale: Передаёт буквальный пространственно-придворный оттенок קֳדָם и официальную обстановку обвинения.
- source_word: דִּי מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: один из изгнанников из Иудеи
  rationale: Идиома обозначает человека из сообщества уведённых в изгнание; формулировка сохраняет уничижительно-обвинительный акцент на происхождении Даниила.
- source_word: לָא שָׂם עֲלַיִךְ ... טְעֵם
  choice: не считается с тобой
  rationale: Естественная русская идиома передаёт отсутствие почтения и отказ принимать царскую власть во внимание.
- source_word: מַלְכָּא
  choice: царь
  rationale: Сохранено явное повторное обращение к царю, усиливающее риторическое давление обвинителей.
- source_word: וְעַל אֱסָרָא דִּי רְשַׁמְתָּ
  choice: и с запретом, который ты подписал
  rationale: אֱסָרָא здесь означает обязательный правовой запрет, а רְשַׁמְתָּ в контексте официального письменного акта — его подписание.
- source_word: וְזִמְנִין תְּלָתָה בְּיוֹמָא
  choice: но три раза в день
  rationale: Естественно передаёт регулярность действия; противительный союз отражает смысловой контраст обвинения.
- source_word: בָּעֵא בָּעוּתֵהּ
  choice: возносит своё прошение
  rationale: Передаёт глагольно-именное сочетание со значением настойчивого обращения с просьбой, не добавляя прямо не названного адресата.
theological_decisions:
- issue: Следует ли прямо назвать Бога адресатом прошения Даниила
  choice: 'Оставить адресата невыраженным: «возносит своё прошение»'
  alternative: «молится своему Богу» / «возносит прошение Богу»
  rationale: В данной арамейской фразе адресат прямо не назван, хотя из контекста ясно, что это Бог Даниила. Перевод сохраняет недосказанность исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством придворного повествования. Сохранены семитская формула речи, повторное обращение «царь» и юридический оттенок обвинения; синтаксис при этом остаётся понятным современному читателю.
