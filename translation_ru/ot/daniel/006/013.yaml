source:
  edition: WLC
  text: בֵּ֠/אדַיִן קְרִ֨יבוּ וְ/אָמְרִ֥ין קֳדָם מַלְכָּ/א֮ עַל אֱסָ֣ר מַלְכָּ/א֒ הֲ/לָ֧א אֱסָ֣ר רְשַׁ֗מְתָּ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִבְעֵה֩ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/ג֖וֹב אַרְיָותָ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר יַצִּיבָ֧א מִלְּתָ֛/א כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/013.yaml
  text: 'Then they came near and spoke before the king concerning the king’s injunction: “Did you not sign an injunction that any man who makes a petition to any god or man for thirty days[a], except to you, O king, shall be thrown into the lions’ den?” The king answered and said, “The matter is certain, according to the law of the Medes and Persians[c][b], which cannot be changed.”'
translation:
  language: ru
  text: 'Тогда они подошли и сказали царю о царском запрете: «Разве не подписал ты запрет, по которому всякий, кто в течение тридцати дней обратится с просьбой к какому-либо богу или человеку, кроме тебя, царь, будет брошен в львиный ров?» Царь ответил и сказал: «Это непреложно по закону мидян и персов и не может быть отменено[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изменено» или «отозвано».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Тогда
  rationale: Арамейский повествовательный маркер вводит следующее событие; «тогда» естественно передаёт последовательность действий.
- source_word: קְרִיבוּ
  choice: они приблизились
  rationale: Глагол обозначает приближение; перевод сохраняет конкретное движение к царю.
- source_word: וְאָמְרִין קֳדָם מַלְכָּא
  choice: и заговорили перед царём
  rationale: Передаёт речевое действие и официальную придворную обстановку, выраженную קֳדָם.
- source_word: עַל אֱסָר מַלְכָּא
  choice: о царском запрете
  rationale: אֱסָר обозначает обязательный запрет, а не просто постановление; «запрет» ясно и естественно передаёт ограничительный смысл.
- source_word: הֲלָא אֱסָר רְשַׁמְתָּ
  choice: Разве не подписал ты запрет
  rationale: הֲלָא вводит риторический вопрос, ожидающий подтверждения; в юридическом контексте רשם указывает на письменное утверждение документа.
- source_word: כָל אֱנָשׁ
  choice: всякий
  rationale: Мужское существительное единственного числа имеет в правовой формуле обобщающее значение; «всякий» сохраняет форму и не утяжеляет русский текст.
- source_word: יִבְעֵה מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: обратится с просьбой к какому-либо богу или человеку
  rationale: Глагол означает просьбу или прошение; русский оборот естественно передаёт как действие, так и адресата просьбы.
- source_word: עַד יוֹמִין תְּלָתִין
  choice: в течение тридцати дней
  rationale: Выражение задаёт срок действия запрета; данный перевод ясно передаёт продолжительность.
- source_word: לָהֵן מִנָּךְ מַלְכָּא
  choice: кроме тебя, царь
  rationale: Фраза обозначает исключение из запрета и сохраняет прямое обращение к царю.
- source_word: יִתְרְמֵא לְגוֹב אַרְיָותָא
  choice: будет брошен в львиный ров
  rationale: Пассивная форма выражает установленное законом наказание; «львиный ров» точно и традиционно передаёт место казни.
- source_word: יַצִּיבָא מִלְּתָא
  choice: Это твёрдо установлено
  rationale: Передаёт значение достоверности и юридической силы царского решения без неестественной буквальности.
- source_word: דִּי לָא תֶעְדֵּא
  choice: не может быть отменено
  rationale: В контексте неизменности закона глагол означает, что постановление нельзя устранить или отменить.
theological_decisions:
- issue: Обобщающее אֱנָשׁ в правовой формуле
  choice: всякий
  alternative: любой человек; всякий человек
  rationale: Источник использует мужское существительное единственного числа с обобщающей силой. Русское «всякий» сохраняет эту форму и естественно охватывает любого подпадающего под закон.
- issue: Значение אֱסָר
  choice: запрет
  alternative: указ; постановление
  rationale: В данном контексте речь идёт именно об обязательном ограничении. «Запрет» сохраняет специфическую юридическую силу слова, не превращая его в общий царский указ.
- issue: Неизменность закона мидян и персов
  choice: не может быть отменено
  alternative: не может быть изменено; не может быть отозвано
  rationale: Формулировка сохраняет заявленную в повествовании юридическую окончательность, не делая дополнительных исторических или богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством придворно-правовой сцены. Синтаксис прямой речи сделан естественным, при этом сохранены риторический вопрос, обращение «царь» и формальная сила наказания.
