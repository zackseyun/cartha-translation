id: DAN.6.8
reference: Daniel 6:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִתְיָעַ֜טוּ כֹּ֣ל סָרְכֵ֣י מַלְכוּתָ֗/א סִגְנַיָּ֤/א וַֽ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ הַדָּֽבְרַיָּ֣/א וּ/פַחֲוָתָ֔/א לְ/קַיָּמָ֤ה קְיָם֙ מַלְכָּ֔/א וּ/לְ/תַקָּפָ֖ה אֱסָ֑ר דִּ֣י כָל דִּֽי יִבְעֵ֣ה בָ֠עוּ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/גֹ֖ב אַרְיָוָתָֽ/א׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/008.yaml
  text: 'All the high officials of the kingdom[a], the prefects and satraps, the counselors and governors, have agreed together to establish a royal statute and to enforce an injunction: that whoever makes a petition to any god or man for thirty days, except to you, O king[c][b], shall be thrown into the lions’ den.'
translation:
  language: ru
  text: 'Все высшие сановники царства, наместники, сатрапы, советники и правители сообща решили[a] утвердить царский указ и ввести в силу запрет[b]: всякого, кто в течение тридцати дней обратится с просьбой к какому-либо богу или человеку, кроме тебя, царь, следует бросить в львиный ров.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообща посоветовались». Глагол может подчёркивать как совместное обсуждение, так и принятое всеми решение.'
    reason: lexical_alternative
  - marker: b
    text: 'Арамейские юридические термины здесь имеют близкие значения: указ, постановление, обязательный запрет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִתְיָעַטוּ
  choice: сообща решили
  rationale: Возвратная порода передаёт совместное совещание и достигнутое общее решение; этот вариант естественно выражает оба оттенка.
- source_word: סָרְכֵי מַלְכוּתָא
  choice: высшие сановники царства
  rationale: Обобщающее обозначение высших царских должностных лиц; «сановники» сохраняет официальный и высокий статус.
- source_word: סִגְנַיָּא
  choice: наместники
  rationale: Передаёт административный титул достаточно ясно для современного русского читателя.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапы
  rationale: Устоявшийся исторический термин для правителей областей Персидской державы.
- source_word: הַדָּבְרַיָּא
  choice: советники
  rationale: Прямо передаёт совещательную функцию царских должностных лиц.
- source_word: פַחֲוָתָא
  choice: правители
  rationale: Отражает государственную должность и позволяет избежать повторения слова «наместники».
- source_word: לְקַיָּמָה קְיָם מַלְכָּא
  choice: утвердить царский указ
  rationale: Сочетание глагола и однокоренного существительного означает придание царскому постановлению обязательной силы.
- source_word: וּלְתַקָּפָה אֱסָר
  choice: ввести в силу запрет
  rationale: Передаёт смысл юридического закрепления и обязательности запрета естественным современным выражением.
- source_word: יִבְעֵה בָעוּ
  choice: обратится с просьбой
  rationale: Однокоренная конструкция обозначает просьбу или прошение; вариант сохраняет более широкий смысл, чем исключительно религиозное «помолится».
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: к какому-либо богу или человеку
  rationale: Предлог буквально имеет значение «от», то есть просьба ищется у кого-либо; по-русски адресат просьбы естественно оформляется предлогом «к».
- source_word: עַד יוֹמִין תְּלָתִין
  choice: в течение тридцати дней
  rationale: Ясно передаёт продолжительность установленного запрета.
- source_word: לָהֵן מִנָּךְ
  choice: кроме тебя
  rationale: Точно выражает единственное исключение из запрета.
- source_word: יִתְרְמֵא לְגֹב אַרְיָוָתָא
  choice: следует бросить в львиный ров
  rationale: Передаёт пассивную форму и юридически предписанное наказание; «львиный ров» — ясное и традиционно узнаваемое обозначение.
theological_decisions:
- issue: Характер запрещённого обращения
  choice: «обратится с просьбой», а не «помолится»
  alternative: «помолится»
  rationale: Арамейская идиома охватывает прошение как к божеству, так и к человеку. Более широкая формулировка сохраняет намеренное соединение религиозной и придворно-политической сфер.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательно-официальным тоном. Исторический термин «сатрапы» сохранён; менее прозрачные административные титулы переданы функциональными русскими соответствиями. Синтаксис сделан ясным, но юридическая напряжённость и широкий смысл просьбы сохранены.
