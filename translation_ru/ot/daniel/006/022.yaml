- source_word: מַלִּל
  choice: заговорил
  rationale: Форма глагола означает «говорить»; «заговорил» хорошо передаёт начало речевого действия в повествовательной последовательности, не добавляя отсутствующего в тексте значения «ответил».
- source_word: מַלְכָּא
  choice: Царь
  rationale: Второе употребление является обращением. Русский именительный обращения звучит естественно и сохраняет торжественный тон без архаического «о царь».
- source_word: לְעָלְמִין
  choice: вечно
  rationale: Устойчивое арамейское выражение длительности; «вечно» соответствует традиционной формуле царского приветствия.
- source_word: חֱיִי
  choice: живи
  rationale: Императивная форма в данном этикетном благопожелании имеет оптативный смысл; буквальное «живи» сохраняет форму и остаётся понятным по-русски.
