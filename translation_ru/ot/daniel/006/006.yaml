base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/006.yaml
  text: Then these men said[a], ‘We will not find any charge against this Daniel unless we find it against him in the law of his God.’
translation:
  language: ru
  text: 'Тогда эти люди сказали: «Мы не найдём против этого Даниила никакого основания для обвинения, если только не найдём такого основания в законе его Бога».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Передаёт последовательное развитие повествования естественным современным русским языком.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: эти люди
  rationale: Сохраняет буквальное значение, не подменяя обычное обозначение более конкретным титулом из контекста.
- source_word: אָמְרִין
  choice: сказали
  rationale: Совершенный вид естественен для последовательного повествования по-русски.
- source_word: דִּי לָא נְהַשְׁכַּח
  choice: Мы не найдём
  rationale: Форма выражает ожидаемый результат поисков и вывод говорящих.
- source_word: לְדָנִיֵּאל דְּנָה
  choice: против этого Даниила
  rationale: Предлог передан в юридически направленном смысле, а указательное местоимение сохранено вместе с его возможным пренебрежительным оттенком.
- source_word: כָּל עִלָּא
  choice: никакого основания для обвинения
  rationale: עִלָּה обозначает повод или юридическое основание для обвинения; развёрнутая русская формулировка точнее и естественнее, чем просто «обвинение».
- source_word: לָהֵן
  choice: если только не
  rationale: Ясно выражает единственное исключение из предыдущего отрицательного утверждения.
- source_word: הַשְׁכַּחְנָה
  choice: не найдём его
  rationale: Сохраняет повтор корня «найти» и соотносит местоимение с основанием для обвинения.
- source_word: עֲלוֹהִי
  choice: против него
  rationale: В данном юридическом контексте передаёт направленность обвинения, но в русском предложении референт выражен через «против этого Даниила» ранее, поэтому отдельное «против него» не повторяется.
- source_word: בְּדָת אֱלָהֵהּ
  choice: в законе его Бога
  rationale: 'Сохраняет конструкцию источника и возможную смысловую широту связи: основание будет найдено в сфере закона, которому Даниил верен.'
theological_decisions:
- issue: Прописная буква в אֱלָהֵהּ
  choice: его Бога
  alternative: его бога
  rationale: В контексте имеется в виду Бог Даниила как определённый личный референт; прописная буква соответствует норме русского религиозного письма, не добавляя отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранено указательное «этого Даниила» и повтор глагола «найти». Юридическое значение עִלָּה раскрыто как «основание для обвинения» без необходимости сноски.
