  text: מִן קֳדָמַ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י בְּ/כָל שָׁלְטָ֣ן מַלְכוּתִ֗/י לֶהֱוֺ֤ן זאעין וְ/דָ֣חֲלִ֔ין מִן קֳדָ֖ם אֱלָהֵ֣/הּ דִּי דָֽנִיֵּ֑אל דִּי ה֣וּא אֱלָהָ֣/א חַיָּ֗/א וְ/קַיָּם֙ לְ/עָ֣לְמִ֔ין וּ/מַלְכוּתֵ/הּ֙ דִּֽי לָ֣א תִתְחַבַּ֔ל וְ/שָׁלְטָנֵ֖/הּ עַד סוֹפָֽ/א־׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/027.yaml
  text: A decree is issued by me[a], that in all the dominion of my kingdom people are to tremble and fear before the God of Daniel, for he is the living God, enduring forever; and his kingdom will not be destroyed[c][b], and his dominion will be to the end.
translation:
  language: ru
  text: 'Мною издано повеление: во всех пределах моего царства люди должны трепетать и страшиться перед Богом Даниила, потому что Он — Бог живой, пребывающий вовеки; Его царство не будет разрушено, и Его владычество — до конца.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его власть — до конца». Арамейская фраза буквально: «Его владычество — до конца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן קֳדָמַי שִׂים טְעֵם
  choice: Мною издано повеление
  rationale: Арамейская административная формула буквально говорит об установлении распоряжения, исходящего от царя. Русская пассивная конструкция сохраняет официальный тон и ясно указывает на царскую власть.
- source_word: בְּכָל שָׁלְטָן מַלְכוּתִי
  choice: по всей области моего царства
  rationale: שָׁלְטָן здесь обозначает сферу власти или подвластную территорию. «По всей области моего царства» естественно передаёт полный территориально-политический охват.
- source_word: לֶהֱוֺן זאעין וְדָחֲלִין
  choice: люди должны трепетать и страшиться
  rationale: Форма לֶהֱוֺן выражает предписанное состояние подданных, подразумеваемых контекстом. Пара глаголов сохранена без смягчения до одного лишь почтения.
- source_word: מִן קֳדָם אֱלָהֵהּ דִּי דָנִיֵּאל
  choice: перед Богом Даниила
  rationale: Предлог обозначает положение перед лицом Бога, а конструкция имени — связь Бога с Даниилом. Краткое русское выражение точно и естественно.
- source_word: דִּי הוּא אֱלָהָא חַיָּא
  choice: потому что Он — Бог живой
  rationale: Исповедальное определение противопоставляет Бога безжизненным божествам. Постпозиция «Бог живой» сохраняет торжественный библейский регистр без архаизации.
- source_word: וְקַיָּם לְעָלְמִין
  choice: пребывающий вовеки
  rationale: קַיָּם выражает устойчивое, продолжающееся существование, а לְעָלְמִין — неограниченную длительность. Выбор передаёт оба оттенка естественным литературным русским языком.
- source_word: וּמַלְכוּתֵהּ דִּי לָא תִתְחַבַּל
  choice: Его царство не будет разрушено
  rationale: В данном контексте глагол означает приведение к гибели или разрушение. Будущее страдательное выражение прямо передаёт неразрушимость царства.
- source_word: וְשָׁלְטָנֵהּ עַד סוֹפָא
  choice: Его владычество — до конца
  rationale: 'Именная формулировка близко следует арамейскому тексту и сохраняет неоднозначность: речь может идти о владычестве, существующем или продолжающемся до предела/конца.'
theological_decisions:
- issue: Предписанное отношение к Богу Даниила
  choice: трепетать и страшиться перед Богом Даниила
  alternative: почитать и бояться Бога Даниила
  rationale: Два арамейских причастия выражают сильный страх и благоговейный трепет. Основной текст сохраняет интенсивность и не сводит первый термин к более мягкому толкованию «почитать».
- issue: Постоянство Бога и неразрушимость Его царства
  choice: Он — Бог живой, пребывающий вовеки; Его царство не будет разрушено
  alternative: Он — живой Бог и утверждён навеки; Его царство никогда не погибнет
  rationale: Выбранный вариант прямо выражает жизнь и вечное пребывание Бога, а также неразрушимость царства, не добавляя отсутствующих в тексте доктринальных уточнений.
- issue: Значение עַד סוֹפָא в отношении владычества
  choice: Его владычество — до конца
  alternative: Его владычество будет длиться до конца
  rationale: Краткая именная конструкция сохраняет лаконизм и возможную временную неоднозначность оригинала, не уточняя искусственно, какой именно «конец» имеется в виду.
translation_notes:
  register: Современный литературный русский с торжественным звучанием царского указа. Синтаксис упрощён до естественной русской нормы, но парные выражения и богословская напряжённость оригинала сохранены.
