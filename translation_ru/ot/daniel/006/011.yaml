  text: וְ֠/דָנִיֵּאל כְּ/דִ֨י יְדַ֜ע דִּֽי רְשִׁ֤ים כְּתָבָ/א֙ עַ֣ל לְ/בַיְתֵ֔/הּ וְ/כַוִּ֨ין פְּתִיחָ֥ן לֵ/הּ֙ בְּ/עִלִּיתֵ֔/הּ נֶ֖גֶד יְרוּשְׁלֶ֑ם וְ/זִמְנִין֩ תְּלָתָ֨ה בְ/יוֹמָ֜/א ה֣וּא בָּרֵ֣ךְ עַל בִּרְכ֗וֹ/הִי וּ/מְצַלֵּ֤א וּ/מוֹדֵא֙ קֳדָ֣ם אֱלָהֵ֔/הּ כָּ/ל קֳבֵל֙ דִּֽי הֲוָ֣א עָבֵ֔ד מִן קַדְמַ֖ת דְּנָֽה־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/011.yaml
  text: And when Daniel knew that the document had been signed[a], he went to his house. Now the windows in his upper room were open toward Jerusalem, and three times a day he knelt on his knees and prayed and gave thanks before his God[c][b], just as he had been doing before this.
translation:
  language: ru
  text: Когда Даниил узнал, что указ был подписан[a], он пошёл к себе домой. Окна в его верхней комнате были открыты в сторону Иерусалима[b]. Три раза в день он становился на колени[c], молился и воздавал благодарность перед своим Богом, как делал это и прежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «письменное постановление было официально утверждено». Арамейское выражение говорит о письменном указе, которому придали законную силу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были обращены к Иерусалиму».'
    reason: lexical_alternative
  - marker: c
    text: 'Выражение описывает позу Даниила во время молитвы: он становился на колени.'
    reason: cultural_note
lexical_decisions:
- source_word: כְּדִי יְדַע
  choice: когда Даниил узнал
  rationale: Оборот вводит временное обстоятельство и сообщает об осведомлённости Даниила; «когда… узнал» естественно передаёт повествовательную последовательность.
- source_word: רְשִׁים כְּתָבָא
  choice: указ был подписан
  rationale: Арамейское сочетание обозначает официальное письменное постановление, получившее законную силу. В данном контексте «указ» яснее буквального «письменный документ», а «подписан» сохраняет юридико-административный смысл.
- source_word: עַל לְבַיְתֵהּ
  choice: он пошёл к себе домой
  rationale: Контекст указывает на возвращение Даниила в свой дом; современная русская формулировка передаёт движение естественно и без лишней конкретизации.
- source_word: כַוִּין פְּתִיחָן
  choice: окна… были открыты
  rationale: Форма описывает состояние окон, не утверждая, что Даниил открыл их именно после издания указа.
- source_word: בְּעִלִּיתֵהּ
  choice: в его верхней комнате
  rationale: Слово обозначает помещение в верхней части дома; «верхняя комната» точно и понятно без архаизации.
- source_word: נֶגֶד יְרוּשְׁלֶם
  choice: в сторону Иерусалима
  rationale: Передаёт пространственную ориентацию окон; возможный оттенок «напротив, лицом к» отмечен в сноске.
- source_word: זִמְנִין תְּלָתָה בְיוֹמָא
  choice: три раза в день
  rationale: Прямой и естественный русский эквивалент временного выражения.
- source_word: בָּרֵךְ עַל בִּרְכֹוהִי
  choice: преклонял колени
  rationale: В сочетании с упоминанием коленей глагол описывает позу молящегося. Русская идиома передаёт смысл без тавтологии «становился на свои колени».
- source_word: מְצַלֵּא
  choice: молился
  rationale: Основное значение глагола в данном контексте; несовершенный вид передаёт регулярное, продолжавшееся действие.
- source_word: מוֹדֵא קֳדָם אֱלָהֵהּ
  choice: благодарил своего Бога
  rationale: В молитвенном контексте глагол естественно означает выражение благодарности Богу; притяжательное «своего» по-русски передаёт отношение, выраженное арамейским суффиксом.
- source_word: כָּל קֳבֵל דִּי הֲוָא עָבֵד מִן קַדְמַת דְּנָה
  choice: как делал это и прежде
  rationale: Фраза подчёркивает, что Даниил продолжал уже установившийся обычай, а не вводил новую практику в ответ на указ.
theological_decisions:
- issue: Характер молитвы Даниила после издания царского указа
  choice: 'Действия описаны как продолжение прежней практики: он преклонял колени, молился и благодарил Бога.'
  alternative: Можно было бы усилить мотив открытого неповиновения царскому указу.
  rationale: Сам стих подчёркивает постоянство поведения Даниила, но прямо не называет его поступок протестом или демонстративным вызовом; перевод не добавляет этой интерпретации.
- issue: Направление молитвы к Иерусалиму
  choice: Ориентация окон передана буквально, без пояснения её богословского значения в основном тексте.
  alternative: Можно было бы прямо сказать, что сам Даниил молился лицом к Иерусалиму.
  rationale: Грамматически выражение непосредственно относится к открытым окнам. Связь с позой Даниила вероятна, однако перевод сохраняет синтаксическую сдержанность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на три ясных предложения. Несовершенный вид глаголов «преклонял», «молился», «благодарил» подчёркивает регулярность привычной практики. Архаизмы и конфессионально маркированные формулы не используются.
