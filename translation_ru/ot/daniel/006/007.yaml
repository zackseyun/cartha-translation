translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной речью в царском приветствии. «Высшие сановники» понятно передаёт высокий ранг, а исторический термин «сатрапы» сохраняет обстановку Персидской империи. Сноски расположены непосредственно после выражений, к которым относятся.
