base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/007.yaml
  text: 'Then these high officials and satraps came before the king and said this to him: “King Darius[b][a], live forever!”'
translation:
  language: ru
  text: 'Тогда эти высшие сановники и сатрапы все вместе пришли к царю[a] и сказали ему: «Царь Дарий, живи вовеки!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «собрались перед царём», «по общему согласию пришли к царю» или «шумно явились к царю». Арамейское выражение подчёркивает согласованное выступление всей группы и в данном контексте может подразумевать заговорщический умысел.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живи на века». Это обычное придворное приветствие, а не буквальное пожелание бессмертия.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: Тогда
  rationale: Передаёт последовательность событий и естественно продолжает повествование.
- source_word: סָרְכַיָּא
  choice: высшие сановники
  rationale: Современное и понятное обозначение высокопоставленных имперских должностных лиц без привязки к устаревшему традиционному термину.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: сатрапы
  rationale: Устоявшийся исторический термин, сохраняющий персидский административный контекст.
- source_word: אִלֵּן
  choice: эти
  rationale: Сохраняет указательное значение и отсылает к только что упомянутым чиновникам.
- source_word: הַרְגִּשׁוּ עַל
  choice: все вместе пришли к
  rationale: Передаёт согласованное коллективное прибытие, не утверждая прямо ни шумного поведения, ни заговорщического умысла; возможные оттенки отмечены в сноске.
- source_word: וְכֵן אָמְרִין לֵהּ
  choice: и сказали ему
  rationale: Естественная русская формула введения прямой речи; отдельная передача כֵן здесь не требуется, поскольку её функция выражена самой конструкцией.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Царь Дарий
  rationale: Естественный русский порядок титула и имени при прямом обращении.
- source_word: לְעָלְמִין חֱיִי
  choice: живи вовеки
  rationale: Сохраняет форму традиционного придворного приветствия и множественное значение «на века» в ясной, возвышенной русской формулировке.
