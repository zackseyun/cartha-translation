  text: וְ/הֵיתָ֨יִת֙ אֶ֣בֶן חֲדָ֔ה וְ/שֻׂמַ֖ת עַל פֻּ֣ם גֻּבָּ֑/א וְ/חַתְמַ֨/הּ מַלְכָּ֜/א בְּ/עִזְקְתֵ֗/הּ וּ/בְ/עִזְקָת֙ רַבְרְבָנ֔וֹ/הִי דִּ֛י לָא תִשְׁנֵ֥א צְב֖וּ בְּ/דָנִיֵּֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/018.yaml
  text: Then a stone was brought and placed over the mouth of the pit[a], and the king sealed it with his signet ring and with the signet rings of his nobles, so that nothing concerning Daniel might be changed.
translation:
  language: ru
  text: Затем принесли камень и положили на устье рва. Царь запечатал его своим перстнем и перстнями своих вельмож, чтобы ничего касавшегося Даниила нельзя было изменить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы дело о Данииле не было изменено»; арамейское слово может означать дело, решение, намерение или волю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיתָיִת אֶבֶן חֲדָה
  choice: Затем принесли камень
  rationale: Последовательное ו передано словом «затем». חֲדָה буквально означает «один», но в данном контексте служит естественным обозначением одного принесённого камня; русское «один камень» могло бы создать ненужное противопоставление.
- source_word: וְשֻׂמַת עַל פֻּם גֻּבָּא
  choice: и положили на устье рва
  rationale: פֻּם буквально означает «уста, устье» и образно обозначает отверстие; «устье рва» сохраняет конкретный образ оригинала. גֻּבָּא — яма или ров, здесь львиный ров.
- source_word: וְחַתְמַהּ מַלְכָּא
  choice: Царь запечатал его
  rationale: Глагол передан прямо как «запечатал», а местоимение относится к камню, названному непосредственно перед этим.
- source_word: בְּעִזְקְתֵהּ
  choice: своим перстнем
  rationale: עִזְקְתָא обозначает перстень, использовавшийся как личная печать. «Перстень» естественно передаёт придворный способ опечатывания.
- source_word: וּבְעִזְקָת רַבְרְבָנוֹהִי
  choice: и перстнями своих вельмож
  rationale: Повтор существительного сохранён. רַבְרְבָנִין обозначает высокопоставленных людей или вельмож; «вельможи» соответствует придворному контексту.
- source_word: דִּי לָא תִשְׁנֵא צְבוּ בְּדָנִיֵּאל
  choice: чтобы ничего касавшегося Даниила нельзя было изменить
  rationale: צְבוּ допускает значения «дело», «решение», «намерение» или «воля». Обобщённая русская формулировка сохраняет эту широту и не уточняет без достаточных оснований, что именно не должно было измениться.
theological_decisions:
- issue: Предмет, который опечатывает царь
  choice: Местоимение «его» грамматически соотнесено с камнем.
  alternative: Понимать подразумеваемым предметом опечатывания вход или устье рва.
  rationale: В арамейском употреблено местоименное дополнение мужского рода, естественно относящееся к ближайшему существительному «камень»; практический смысл опечатывания входа при этом остаётся очевидным.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Слова «устье», «перстень» и «вельможи» сохраняют конкретность и придворный колорит, оставаясь понятными современному читателю.
