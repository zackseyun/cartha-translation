base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/020.yaml
  text: While I was still speaking and praying[a], confessing my sin and the sin of my people Israel, and presenting my plea before Yahweh my God concerning the holy mountain of my God[b],
translation:
  language: ru
  text: Пока я ещё говорил и молился, исповедуя свой грех и грех моего народа Израиля и принося свою мольбу[a] перед Яхве, моим Богом, о святой горе моего Бога[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заставляя мою мольбу пасть перед»; это еврейское выражение означает обратиться с мольбой или прошением.'
    reason: lexical_alternative
  - marker: b
    text: «Святая гора моего Бога» — Сион, то есть Иерусалим, где находилось Божье святилище.
    reason: cultural_note
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר וּמִתְפַּלֵּל
  choice: Пока я ещё говорил и молился
  rationale: Передаёт продолжающееся действие и естественно вводит одновременные события; формы мужского рода соответствуют говорящему Даниилу.
- source_word: וּמִתְוַדֶּה
  choice: исповедуя
  rationale: В сочетании с חַטָּאת («грех») глагол означает признание и исповедание греха, а не благодарение или прославление.
- source_word: חַטָּאתִי וְחַטַּאת עַמִּי יִשְׂרָאֵל
  choice: свой грех и грех моего народа Израиля
  rationale: Сохраняет различие между личным грехом Даниила и грехом народа, а также приложение «Израиля» к «моего народа».
- source_word: וּמַפִּיל תְּחִנָּתִי
  choice: и принося свою мольбу
  rationale: Естественно передаёт еврейскую идиому «заставлять мольбу пасть перед кем-либо» и сохраняет смысл настойчивого прошения о милости.
- source_word: לִפְנֵי יְהוָה אֱלֹהַי
  choice: пред Яхве, моим Богом
  rationale: «Пред» поддерживает торжественный молитвенный регистр; личное обозначение Бога сохранено, а имя יהוה передано как «Яхве».
- source_word: עַל הַר קֹדֶשׁ אֱלֹהָי
  choice: о святой горе моего Бога
  rationale: Предлог עַל здесь обозначает предмет мольбы; повтор «моего Бога» сохранён ради точности и авторского акцента.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблено личное четырёхбуквенное имя Бога; транслитерация «Яхве» отличает его от титула «Господь», не вводя дополнительного толкования.
- issue: Значение «святой горы»
  choice: сохранить образ без подстановки названия
  alternative: Сион; Иерусалим
  rationale: Основной текст сохраняет образную формулировку оригинала, а историко-географическая отсылка поясняется в сноске, чтобы не сужать текст скрытой интерпретацией.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным молитвенным оттенком. Союзная и причастная структура сохраняет поток незавершённой фразы, продолжающейся в следующем стихе; поэтому в конце поставлены запятая и тире.
