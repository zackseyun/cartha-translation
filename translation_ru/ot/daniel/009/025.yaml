  text: וְ/תֵדַ֨ע וְ/תַשְׂכֵּ֜ל מִן מֹצָ֣א דָבָ֗ר לְ/הָשִׁיב֙ וְ/לִ/בְנ֤וֹת יְרֽוּשָׁלִַ֨ם֙ עַד מָשִׁ֣יחַ נָגִ֔יד שָׁבֻעִ֖ים שִׁבְעָ֑ה וְ/שָׁבֻעִ֞ים שִׁשִּׁ֣ים וּ/שְׁנַ֗יִם תָּשׁוּב֙ וְ/נִבְנְתָה֙ רְח֣וֹב וְ/חָר֔וּץ וּ/בְ/צ֖וֹק הָ/עִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/025.yaml
  text: 'So know and understand: from the issuing of the word to restore and rebuild Jerusalem until an anointed one[a], a prince, there will be seven weeks, and for sixty-two weeks it will be restored and rebuilt, with plaza and moat[c][b], but in troubled times.'
translation:
  language: ru
  text: 'Итак, знай и уразумей: с того времени, как вышло слово о восстановлении и строительстве Иерусалима, до помазанника[a], правителя, пройдёт семь седмин[b]. И в течение шестидесяти двух седмин Иерусалим будет восстановлен и отстроен — с площадью и рвом[c], но это будет во времена бедствий.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до Мессии, Правителя»; или: «до Помазанника-Князя». Буквально еврейский текст говорит о «помазаннике, правителе (князе)».'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово можно передать как «недели» или «семёрки»; поэтому выражения можно перевести также «семь недель» или «семь семёрок», а далее — «шестьдесят две недели» или «шестьдесят две семёрки». Само слово не уточняет здесь продолжительность каждой такой единицы.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «с площадью и траншеей (канавой)». Значение переведённого словом «ров» еврейского существительного в этом контексте не вполне ясно; возможно, имеется в виду оборонительный ров или иная выемка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתֵדַע וְתַשְׂכֵּל
  choice: Итак, знай и уразумей
  rationale: Формы обращены к Даниилу в единственном числе и имеют побудительную силу. «Уразумей» передаёт значение обретения понимания и сохраняет возвышенный, но понятный библейский регистр.
- source_word: מִן מֹצָא דָבָר
  choice: с того времени, как вышло слово
  rationale: מֹצָא буквально обозначает выход или появление, а דָבָר — слово, дело или повеление. Формулировка сохраняет образ «вышедшего слова» и не сужает смысл до официального царского указа.
- source_word: לְהָשִׁיב וְלִבְנוֹת יְרוּשָׁלַם
  choice: о восстановлении и отстройке Иерусалима
  rationale: В данном контексте הֵשִׁיב указывает на возвращение города к прежнему состоянию, а בנה — на его строительство. Сочетание естественно передаёт оба действия по-русски.
- source_word: עַד מָשִׁיחַ נָגִיד
  choice: до помазанника, правителя
  rationale: מָשִׁיחַ означает помазанного человека и не обязательно является здесь однозначным титулом «Мессия»; נָגִיד обозначает предводителя, правителя или князя. Приложение через запятую сохраняет два еврейских обозначения без преждевременного отождествления лица.
- source_word: שָׁבֻעִים שִׁבְעָה
  choice: семь седмин
  rationale: שָׁבֻעַ — период или единица из семи. Традиционное русское «седмина» передаёт семеричную единицу, не утверждая прямо, что речь идёт об обычной неделе или о семи годах.
- source_word: וְשָׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: И в течение шестидесяти двух седмин
  rationale: Формулировка обозначает следующий временной промежуток и следует масоретическому членению, при котором «семь седмин» завершает предыдущую часть фразы.
- source_word: תָּשׁוּב וְנִבְנְתָה
  choice: он будет восстановлен и отстроен
  rationale: Еврейские глаголы стоят в женском роде и относятся к Иерусалиму, который в русском языке мужского рода. Пассивная формулировка естественно передаёт возобновление и застройку города.
- source_word: רְחוֹב וְחָרוּץ
  choice: с площадью и рвом
  rationale: רְחוֹב обозначает широкое открытое городское пространство, площадь; значение חָרוּץ в этом контексте не вполне ясно, но оно, вероятно, указывает на ров или траншею. Неопределённость отмечена в сноске.
- source_word: וּבְצוֹק הָעִתִּים
  choice: но это будет во времена бедствий
  rationale: צֹק передаёт тесноту, притеснение или бедствие. Русская формулировка ясно связывает тяжёлые времена с восстановлением города; союз «но» выражает контекстуальное противопоставление.
theological_decisions:
- issue: Следует ли передавать מָשִׁיחַ как однозначный титул «Мессия»
  choice: В основном тексте — «помазанник» со строчной буквы.
  alternative: «Мессия», «Мессия-Правитель» или «Помазанник, Князь».
  rationale: Само еврейское слово обозначает «помазанного» и допускает более широкое употребление. Такой перевод не исключает мессианского толкования, но и не вводит его в текст как единственно возможное.
- issue: Как понимать שָׁבֻעִים в пророческой хронологии
  choice: «седмины» без уточнения их длительности.
  alternative: «недели», «семёрки» или «семилетия».
  rationale: Еврейское слово обозначает семеричную единицу, тогда как конкретная продолжительность обсуждается. «Седмина» сохраняет традиционную форму и не разрешает хронологический спор средствами перевода.
- issue: Синтаксическое членение семи и шестидесяти двух седмин
  choice: После «семи седмин» поставлена точка; восстановление города отнесено к шестидесяти двум седминам.
  alternative: Объединить семь и шестьдесят две седмины в один период до помазанника, а затем сообщить о восстановлении города.
  rationale: Такое членение соответствует масоретическому сильному разделительному акценту после שִׁבְעָה. При этом сама последовательность чисел сохранена без вычисления или богословской идентификации.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Седмина» сохранена как понятный в пророческом контексте термин, позволяющий не навязывать длительность периода. Синтаксис сделан ясным, но ключевые лексические и богословские неоднозначности вынесены в сноски.
