base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/007.yaml
  text: To you[a], O Lord, belongs righteousness, but to us belongs shame of face, as it is this day—to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those who are near and those who are far away[b], in all the lands where you have driven them[c], because of their unfaithfulness that they committed against you.
translation:
  language: ru
  text: 'Тебе, Господи, принадлежит праведность, а нам — стыд на лицах, как и ныне: людям Иуды, жителям Иерусалима и всему Израилю — тем, кто близко, и тем, кто далеко, во всех землях, куда Ты изгнал их за их вероломство против Тебя.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «за их вероломство, которым они вероломно поступили против Тебя». Здесь повторены однокоренные существительное и глагол, подчёркивающие нарушение верности Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Звательная форма естественно передаёт прямое молитвенное обращение к Богу; это אֲדֹנָי, а не имя יהוה.
- source_word: הַצְּדָקָה
  choice: праведность
  rationale: В покаянном контексте слово обозначает нравственную правоту Бога и справедливость Его действий; «праведность» сохраняет более широкий богословский смысл, чем одно лишь «справедливость».
- source_word: בֹּשֶׁת הַפָּנִים
  choice: стыд на лицах
  rationale: Сохранён образный еврейский оборот, означающий явный, публичный позор; по-русски он понятен и передаёт множественное הַפָּנִים.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть ныне
  rationale: Передано указание на нынешнее, очевидное положение народа без архаического «как в сей день».
- source_word: לְאִישׁ יְהוּדָה
  choice: у каждого в Иудее
  rationale: 'Единственное число אִישׁ понято дистрибутивно: речь идёт о каждом представителе Иудеи. Такое решение точнее естественного русского, чем буквальное «у мужа Иуды».'
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: у жителей Иерусалима
  rationale: Естественная передача причастного обозначения постоянно живущих в городе.
- source_word: כָּל יִשְׂרָאֵל
  choice: у всего Израиля
  rationale: Сохраняется коллективное обозначение всего народа завета.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: у тех, кто близко, и у тех, кто далеко
  rationale: Сохранено пространственное противопоставление находящихся близко и рассеянных вдали.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: во всех землях
  rationale: «Земли» не вносит современного политического понятия государств и подходит контексту рассеяния.
- source_word: הִדַּחְתָּם
  choice: Ты изгнал их
  rationale: 'Каузативная форма подчёркивает Божье действие: Он удалил народ в изгнание; «изгнал» передаёт это сильнее, чем нейтральное «рассеял».'
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בָךְ
  choice: за их неверность Тебе
  rationale: מעל обозначает вероломное нарушение верности. Русская формулировка сохраняет принадлежность проступка народу и его направленность против Бога, избегая тяжёлого повтора однокоренных слов.
theological_decisions:
- issue: Праведность Бога и стыд Израиля
  choice: Противопоставлены Божья правота и заслуженный публичный стыд народа.
  alternative: Понимать הַצְּדָקָה исключительно как судебную справедливость.
  rationale: «Праведность» сохраняет как судебный, так и нравственно-заветный смысл и не снимает напряжения между Божьей правотой и виной народа.
- issue: Дистрибутивное אִישׁ в לְאִישׁ יְהוּדָה
  choice: «у каждого в Иудее»
  alternative: «у мужей Иудеи» или «у народа Иудеи»
  rationale: Форма мужского единственного числа имеет дистрибутивную силу. «У каждого» отражает её без неестественной буквальности и без сведения выражения к географической области как таковой.
- issue: Божье действие в изгнании
  choice: «куда Ты изгнал их»
  alternative: «где они были рассеяны»
  rationale: Активная формулировка сохраняет явную божественную субъектность каузативного глагола и исповедальный смысл наказания.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Заглавные местоимения «Тебя/Ты» употреблены как принятая русская форма благоговейного обращения к Богу. Образ «стыд на лицах» сохранён, но синтаксис упрощён для ясности.
