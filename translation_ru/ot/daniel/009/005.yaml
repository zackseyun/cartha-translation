base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/005.yaml
  text: We have sinned and done wrong and acted wickedly and rebelled[b][a], turning aside from your commandments and your judgments.
translation:
  language: ru
  text: Мы согрешили, поступали беззаконно[a], творили зло и восставали, уклоняясь от Твоих заповедей и установлений[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступали неправедно». Еврейский глагол может выражать нравственную кривизну, извращённость и вину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «судебных решений». Еврейское слово может означать решения суда, правовые нормы или предписанные установления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: Мы согрешили
  rationale: Прямо передаёт qal perfect 1-го лица множественного числа от חטא и естественно звучит как признание совершённых грехов в молитве.
- source_word: וְעָוִינוּ
  choice: поступали беззаконно
  rationale: Передаёт заложенные в עוה значения нравственной неправоты, извращённости и вины, сохраняя отличие от общего глагола «согрешили».
- source_word: וְהִרְשַׁעְנוּ
  choice: творили зло
  rationale: Передаёт каузативную форму от רשע как деятельное совершение зла и сохраняет отдельный элемент накопительного исповедания.
- source_word: וּמָרָדְנוּ
  choice: восставали против Тебя
  rationale: מרד означает мятеж или неповиновение. Дополнение «против Тебя» естественно по-русски и ясно выражает подразумеваемую направленность мятежа против Бога.
- source_word: וְסוֹר
  choice: уклоняясь
  rationale: 'Передаёт продолжение исповедания формой от סור: отступление, уклонение от Божьей воли. Деепричастие естественно связывает его с предшествующими глаголами.'
- source_word: מִמִּצְוֺתֶיךָ
  choice: от Твоих заповедей
  rationale: «Заповеди» — точный, понятный и уместный в заветном контексте эквивалент מצוות.
- source_word: וּמִמִּשְׁפָּטֶיךָ
  choice: и установлений
  rationale: «Установления» естественно обозначает предписанные правовые нормы и сохраняет отличие משפטים от заповедей; юридический оттенок раскрыт в сноске.
theological_decisions:
- issue: Сохранение цепочки близких по смыслу глаголов исповедания
  choice: согрешили, поступали беззаконно, творили зло и восставали
  alternative: согрешили и поступали нечестиво
  rationale: Еврейский текст намеренно накапливает отдельные обозначения греха, неправды, злодеяния и мятежа. Их объединение ослабило бы риторическую и богословскую напряжённость исповедания.
- issue: Уточнение подразумеваемого объекта глагола מרד
  choice: восставали против Тебя
  alternative: восставали
  rationale: В контексте молитвы мятеж направлен против Бога. Русское дополнение делает фразу естественной, не вводя нового богословского утверждения.
- issue: Передача משפטים
  choice: установлений
  alternative: судов; судебных решений; правил
  rationale: Слово может обозначать судебные решения, правовые нормы или предписания. «Установления» сохраняет правовой и нормативный смысл и не сводит многозначный термин только к акту суда.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного исповедания. Ритмическое накопление глаголов сохранено; архаизмы и конфессионально маркированные формулировки не использованы. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской библейской традиции.
