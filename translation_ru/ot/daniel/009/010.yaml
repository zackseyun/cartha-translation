base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/010.yaml
  text: and we have not obeyed the voice of Yahweh our God[a], to walk in his laws, which he set before us through his servants the prophets.
translation:
  language: ru
  text: и не слушались голоса Яхве, нашего Бога, и не следовали Его законам, которые Он поставил перед нами через Своих слуг — пророков[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Своих слуг — пророков»; это еврейский оборот со значением «через Своих слуг — пророков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ בְּקוֹל
  choice: слушались голоса
  rationale: Сочетание שׁמע с בְּקוֹל означает не просто слышать, а внимать с послушанием. Русское «слушаться голоса» сохраняет и образ голоса, и смысл повиновения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לָלֶכֶת
  choice: чтобы следовать
  rationale: Инфинитив поясняет, в чём должно было проявляться послушание. «Следовать» естественно передаёт метафору хождения как образа жизни, не перегружая русскую фразу библеизмом.
- source_word: בְּתוֹרֹתָיו
  choice: Его законам
  rationale: Множественное число обозначает данные Богом установления. «Законы» соответствует контексту заветного непослушания, хотя תּוֹרָה может шире означать наставление.
- source_word: אֲשֶׁר נָתַן לְפָנֵינוּ
  choice: которые Он дал нам
  rationale: Еврейское выражение буквально говорит о том, что законы были даны или поставлены перед народом. В современном русском «дал нам» естественно выражает их предъявление народу.
- source_word: בְּיַד
  choice: через
  rationale: Буквально «рукой»; здесь это устойчивое обозначение посредничества или действующего лица. Буквальная форма отмечена в сноске.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: Своих слуг — пророков
  rationale: עֶבֶד в формуле пророческого служения обозначает Божьего служителя. «Слуги» ясно передаёт служебное поручение, а приложение «пророков» определяет этих людей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Значение множественного בְּתוֹרֹתָיו
  choice: Его законам
  alternative: Его наставлениям; Его учениям
  rationale: Контекст исповедания непослушания и образ следования указывают на конкретные Божьи установления, при этом более широкое значение «наставления» остаётся лексически возможным.
- issue: Связь инфинитива לָלֶכֶת с непослушанием
  choice: чтобы следовать
  alternative: следуя; и не следовали
  rationale: Формулировка сохраняет зависимость инфинитива от предшествующего выражения и не сводит его однозначно только к средству или отдельному параллельному действию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Начальное «и» сохранено как связь с предыдущей частью молитвы.
