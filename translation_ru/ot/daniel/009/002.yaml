source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת אַחַת֙ לְ/מָלְכ֔/וֹ אֲנִי֙ דָּֽנִיֵּ֔אל בִּינֹ֖תִי בַּ/סְּפָרִ֑ים מִסְפַּ֣ר הַ/שָּׁנִ֗ים אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֶל יִרְמִיָ֣ה הַ/נָּבִ֔יא לְ/מַלֹּ֛אות לְ/חָרְב֥וֹת יְרוּשָׁלִַ֖ם שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/002.yaml
  text: 'In the first year of his reign[a], I, Daniel, understood from the books the number of the years about which the word of Yahweh had come to Jeremiah the prophet, for the completion of the desolations of Jerusalem: seventy years.'
translation:
  language: ru
  text: 'В первый год его царствования я, Даниил, понял из книг[a] число лет, о которых слово Яхве было к пророку Иеремии: семьдесят лет для завершения опустошений Иерусалима.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из свитков». Еврейское слово может обозначать письменные документы вообще; вариант «книги» естественен по-русски, а «свитки» точнее указывает на древнюю форму письменного текста.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת לְמָלְכוֹ
  choice: В первый год его царствования
  rationale: Количественное числительное в этой конструкции имеет порядковое значение; «царствования» естественно передаёт период его правления.
- source_word: בִּינֹתִי בַּסְּפָרִים
  choice: понял из книг
  rationale: Глагол בין обозначает понимание или уразумение, а предлог ב здесь естественно понимать как указание на источник, из которого Даниил получил это понимание.
- source_word: מִסְפַּר הַשָּׁנִים
  choice: сколько лет
  rationale: Естественная русская передача значения «число лет» в составе зависимого вопросительного оборота; конкретное число названо в конце стиха.
- source_word: דְבַר יְהוָה
  choice: слову Яхве
  rationale: Сохраняется личное имя Бога, представленное тетраграмматоном, а דְבַר передаётся обычным для пророческой речи словом «слово».
- source_word: לְמַלֹּאות לְחָרְבוֹת יְרוּשָׁלִַם שִׁבְעִים שָׁנָה
  choice: должны длиться опустошения Иерусалима, — семьдесят лет
  rationale: Фраза передаёт достижение полной меры назначенного срока опустошений. Такая формулировка естественна по-русски, сохраняет множественное число חָרְבוֹת и не вводит дополнительного деятеля, исполняющего пророчество.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл לְמַלֹּאות в связи с пророчеством Иеремии
  choice: должны длиться опустошения Иерусалима, — семьдесят лет
  alternative: до завершения опустошений Иерусалима — семьдесят лет; чтобы исполнились опустошения Иерусалима
  rationale: Выбранная передача выражает полноту назначенного семидесятилетнего срока, избегая неясной по-русски буквальности и не уточняя сверх текста, кто или что является субъектом исполнения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис слегка упрощён ради ясности, при этом сохранены личное имя Бога, множественное число «опустошения» и акцент на семидесятилетнем сроке. Маркер сноски поставлен после слова «книг», к которому относится примечание.
