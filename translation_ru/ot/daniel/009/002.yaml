- from: В первый год его царствования я, Даниил, понял из книг[a], сколько лет, согласно слову Яхве, данному пророку Иеремии, должны длиться опустошения Иерусалима, — семьдесят лет.
  to: 'В первый год его царствования я, Даниил, понял из книг[a] число лет, о которых слово Яхве было к пророку Иеремии: семьдесят лет для завершения опустошений Иерусалима.'
