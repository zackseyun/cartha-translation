revisions:
- from: Пока я ещё говорил в молитве, муж Гавриил, которого я видел в видении прежде, стремительно прилетев[a], приблизился ко мне около времени вечернего приношения.
  to: Когда я ещё говорил в молитве, человек Гавриил, которого я видел в видении в начале, стремительно прилетел и коснулся меня примерно во время вечернего приношения.[a]
  rationale: Исправление восстанавливает прямое значение «коснулся меня», сохраняет «в начале» как явный, но не чрезмерно истолкованный временной ориентир и устраняет неестественное удвоение движения. Сноска сохраняет отмеченную в английском аудите лексическую неопределённость выражения מֻעָף בִּיעָף.
