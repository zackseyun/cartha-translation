base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/021.yaml
  text: while I was still speaking in prayer[a], the man Gabriel, whom I had seen in the vision at the beginning, came to me in swift flight at the time of the evening offering.
translation:
  language: ru
  text: Когда я ещё говорил в молитве, человек Гавриил, которого я видел в видении в начале, стремительно прилетел и коснулся меня примерно во время вечернего приношения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, менее вероятно: «утомлённый» или «в изнеможении». Еврейское выражение трудно для понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר בַּתְּפִלָּה
  choice: Пока я ещё говорил в молитве
  rationale: Передаёт одновременность продолжающейся молитвенной речи и прибытия Гавриила, сохраняя более конкретное «говорил», а не сводя выражение к «молился».
- source_word: הָאִישׁ גַּבְרִיאֵל
  choice: муж Гавриил
  rationale: Сохраняет прямое обозначение человеческого облика Гавриила; «муж» здесь звучит достойно и естественно в библейском повествовании.
- source_word: אֲשֶׁר רָאִיתִי בֶחָזוֹן בַּתְּחִלָּה
  choice: которого я видел в видении прежде
  rationale: בַּתְּחִלָּה буквально связано с началом или прежним временем; в контексте это отсылка к предыдущему видению Гавриила. «Прежде» естественно передаёт эту временную отсылку без чрезмерного уточнения.
- source_word: מֻעָף בִּיעָף
  choice: стремительно прилетев
  rationale: Передаёт традиционное и контекстуально вероятное понимание как быстрого полёта, при этом трудность еврейского выражения отмечена в сноске.
- source_word: נֹגֵעַ אֵלַי
  choice: приблизился ко мне
  rationale: נגע может означать «коснуться» или «достичь». В контексте прибытия «приблизился ко мне» сохраняет направленность движения, не утверждая с полной определённостью физическое прикосновение.
- source_word: כְּעֵת מִנְחַת עָרֶב
  choice: около времени вечернего приношения
  rationale: כְּ передаёт приблизительное временное соответствие, а מִנְחָה оставлено широким словом «приношение», без необоснованного сужения до конкретного вида жертвы.
theological_decisions:
- issue: Характер движения Гавриила в выражении מֻעָף בִּיעָף
  choice: Гавриил стремительно прилетел.
  alternative: Гавриил пришёл утомлённым или в изнеможении.
  rationale: Еврейское выражение трудно для толкования. Контекст внезапного прибытия и традиционное понимание поддерживают значение быстрого полёта, но возможная связь с утомлением сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис сохраняет развитие одной фразы оригинала, но остаётся понятным современному читателю.
