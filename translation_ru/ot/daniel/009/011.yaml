id: DAN.9.11
reference: Daniel 9:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל עָֽבְרוּ֙ אֶת תּ֣וֹרָתֶ֔/ךָ וְ/ס֕וֹר לְ/בִלְתִּ֖י שְׁמ֣וֹעַ בְּ/קֹלֶ֑/ךָ וַ/תִּתַּ֨ךְ עָלֵ֜י/נוּ הָ/אָלָ֣ה וְ/הַ/שְּׁבֻעָ֗ה אֲשֶׁ֤ר כְּתוּבָה֙ בְּ/תוֹרַת֙ מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֔ים כִּ֥י חָטָ֖אנוּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/011.yaml
  text: All Israel has transgressed your law and turned aside[a], not listening to your voice. So the curse and the oath that are written in the law of Moses, the servant of God, have been poured out on us, because we have sinned against him.
translation:
  language: ru
  text: Весь Израиль преступил твой закон и уклонился, не слушая твоего голоса. Поэтому на нас излились проклятие и клятва[a], записанные в Законе Моисея, Божьего слуги, потому что мы согрешили против него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «проклятие, подтверждённое клятвой». В еврейском тексте буквально: «проклятие и клятва»; вероятно, имеются в виду скреплённые клятвой наказания за нарушение завета, записанные в Законе Моисея.'
    reason: Лексическая и синтаксическая неоднозначность выражения הָאָלָה וְהַשְּׁבֻעָה.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Весь Израиль
  rationale: Передаёт народ как единое целое и сохраняет всеохватный характер исповедания.
- source_word: עָבְרוּ אֶת תּוֹרָתֶךָ
  choice: преступил твой закон
  rationale: Глагол עבר в сочетании с Торой означает нарушение установленных границ, то есть преступление закона; единственное число естественно согласуется в русском с собирательным названием «Израиль».
- source_word: וְסוֹר לְבִלְתִּי שְׁמֹעַ בְּקוֹלֶךָ
  choice: и уклонился, не слушая твоего голоса
  rationale: «Уклонился» сохраняет образ отхода от пути послушания, а «не слушая» близко передаёт отрицательную инфинитивную конструкцию, не усиливая её до явного «отказался».
- source_word: וַתִּתַּךְ עָלֵינוּ
  choice: на нас излились
  rationale: Сохраняет метафору излияния суда; в русском множественное число естественно при двух названных далее существительных.
- source_word: הָאָלָה וְהַשְּׁבֻעָה
  choice: проклятие и клятва
  rationale: Оба еврейских термина переданы раздельно и буквально, без сведения к одному истолкованному выражению.
- source_word: אֲשֶׁר כְּתוּבָה בְּתוֹרַת מֹשֶׁה
  choice: записанные в Законе Моисея
  rationale: «Закон Моисея» ясно обозначает заветный свод; русское множественное согласование соответствует двум однородным существительным, хотя еврейское причастие стоит в единственном числе.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: Божьего слуги
  rationale: Естественно и с достоинством передаёт почётное обозначение Моисея как служителя Бога.
- source_word: כִּי חָטָאנוּ לוֹ
  choice: потому что мы согрешили против него
  rationale: Глагол חטא с предлогом ל обозначает согрешение против кого-либо; местоимение относится к Богу.
theological_decisions:
- issue: Корпоративная вина Израиля
  choice: «Весь Израиль преступил… уклонился», затем «на нас… мы согрешили»
  alternative: 'Передать начальные глаголы множественным числом: «все израильтяне преступили… уклонились»'
  rationale: Формулировка сохраняет Израиль как корпоративное целое и одновременно включённость Даниила в общее исповедание вины.
- issue: Соотношение проклятия и клятвы
  choice: 'Сохранить два термина: «проклятие и клятва»'
  alternative: 'Истолковать как единое понятие: «проклятие, подтверждённое клятвой» или «клятвенное проклятие»'
  rationale: Исходный текст формально называет оба понятия; их раздельная передача сохраняет возможную заветную напряжённость и не устраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Местоимения, относящиеся к Богу, даны со строчной буквы по современным общеиздательским нормам; название «Закон Моисея» — с прописной как устойчивое наименование корпуса.
