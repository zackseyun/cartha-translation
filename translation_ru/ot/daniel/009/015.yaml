revisions:
- from: А теперь, Господь, Бог наш, Ты, Который вывел Свой народ из земли Египетской сильной рукой и приобрёл Себе имя, как видно и по сей день[a], — мы согрешили, мы поступали нечестиво.
  to: И ныне, Господи, Боже наш, Ты вывел народ Твой из земли Египта сильной рукой и сделал Себе имя, как и по сей день[a], — мы согрешили; мы поступили нечестиво.
  rationale: Исправление устраняет добавленное значение «видно», делает выражение об «имени» однозначнее как сохранённую идиому о славе и обновляет несколько архаичную географическую формулу. Двойное исповедание оставлено раздельным, чтобы передать два еврейских глагола.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: исповедальная молитва, исход из Египта «сильной рукой», Божье «имя» и двойное признание вины сохранены. Однако «как видно» добавляет к כַּיּוֹם הַזֶּה значение зрительной очевидности, которого в тексте нет; лучше передать временно-сопоставительный оборот без этой добавки. «Приобрёл Себе имя» в русском может означать получение собственного имени, а не обретение славы.'
  naturalness: «Из земли Египетской» и относительное «Ты, Который» создают несколько архаизированную и тяжёлую конструкцию. «Из земли Египта» и прямое «Ты вывел» естественнее для современного литературного русского при сохранении молитвенного достоинства.
  terminology: «Господи, Боже наш», «народ Твой» и «сильной рукой» уместны. Идиому וַתַּעַשׂ לְךָ שֵׁם точнее и понятнее передаёт «сделал Себе имя»; она сохраняет образ оригинала, не подменяя его отвлечённой «славой».
  issues:
  - severity: medium
    issue: Добавлено значение «как видно»
    rationale: Оборот כַּיּוֹם הַזֶּה означает «как в этот день / как и по сей день» и характеризует продолжающуюся реальность имени (славы) Бога; он не содержит глагола «видно».
  - severity: medium
    issue: «Приобрёл Себе имя» двусмысленно
    rationale: По-русски это может быть понято как получение имени, тогда как еврейская идиома говорит о создании себе имени, то есть обретении известности.
  - severity: low
    issue: Не вполне современная формулировка «из земли Египетской»
    rationale: Она допустима в высоком библейском стиле, но для заявленного современного литературного варианта «из земли Египта» естественнее и столь же точно.
  revised_text: И ныне, Господи, Боже наш, Ты вывел народ Твой из земли Египта сильной рукой и сделал Себе имя, как и по сей день[a], — мы согрешили; мы поступили нечестиво.
