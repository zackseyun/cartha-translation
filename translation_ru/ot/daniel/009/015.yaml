source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י אֱלֹהֵ֗י/נוּ אֲשֶׁר֩ הוֹצֵ֨אתָ אֶֽת עַמְּ/ךָ֜ מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ בְּ/יָ֣ד חֲזָקָ֔ה וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כַּ/יּ֣וֹם הַ/זֶּ֑ה חָטָ֖אנוּ רָשָֽׁעְנוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/015.yaml
  text: And now[a], O Lord our God, who brought your people out of the land of Egypt with a strong hand and made for yourself a name, as it is this day—we have sinned[c][b]; we have acted wickedly.
translation:
  language: ru
  text: И ныне, Господи, Боже наш, Ты вывел народ Твой из земли Египта сильной рукой и сделал Себе имя, как и по сей день[a], — мы согрешили; мы поступили нечестиво.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как в этот день»; также возможно: «по сей день».'
    reason: Устойчивый еврейский оборот сопоставляет Божье имя, обретённое при исходе, с его сохраняющейся реальностью в настоящее время; буквальная русская передача без пояснения была бы неясна.
lexical_decisions:
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: Господь, Бог наш
  rationale: Естественное для современной русской молитвенной речи обращение, сохраняющее оба божественных титула.
- source_word: הוֹצֵאתָ אֶת עַמְּךָ מֵאֶרֶץ מִצְרַיִם
  choice: вывел Свой народ из земли Египетской
  rationale: «Вывел» точно передаёт каузатив יצא и сохраняет устойчивую формулу исхода; «земля Египетская» звучит возвышенно, но понятно.
- source_word: בְּיָד חֲזָקָה
  choice: сильной рукой
  rationale: Сохраняет конкретный образ и устойчивую формулу исхода без излишнего истолкования как абстрактной силы.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: приобрёл Себе имя
  rationale: Передаёт еврейскую идиому об обретении известности, сохраняя образ «имени» и оставаясь понятным по-русски.
- source_word: כַּיּוֹם הַזֶּה
  choice: как видно и по сей день
  rationale: Передаёт сохраняющуюся до настоящего времени очевидность Божьей славы и естественно связывает оборот с предшествующей идиомой.
- source_word: חָטָאנוּ רָשָׁעְנוּ
  choice: мы согрешили, мы поступали нечестиво
  rationale: 'Различает два исповедальных глагола: первый обозначает грех, второй — нечестивое поведение; повтор «мы» сохраняет торжественную напряжённость признания.'
theological_decisions:
- issue: Аллюзия на исход и Божье имя
  choice: Сохранить формулу исхода «сильной рукой» и образ приобретения имени.
  alternative: 'Передать динамически: «могуществом спас Свой народ из Египта и прославился».'
  rationale: Более буквальные образы сохраняют связь с повествованием об исходе и богословскую тему Божьей славы, не вводя конфессионального толкования.
- issue: Связь оборота כַּיּוֹם הַזֶּה с предшествующей фразой
  choice: «как видно и по сей день» — Божье имя и слава остаются явными до настоящего времени.
  alternative: 'Более формально: «как в этот день» или просто «по сей день».'
  rationale: Исходный оборот допускает формальную передачу, но в русском «как в этот день» неясно; выбранный вариант сохраняет временную продолженность и смысл публичной очевидности.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Синтаксис сохраняет протяжённое обращение оригинала, но проясняется местоимением «Ты». Заглавные буквы в местоимениях о Боге соответствуют принятому русскому библейскому регистру.
