  text: וְ/עַתָּ֣ה שְׁמַ֣ע אֱלֹהֵ֗י/נוּ אֶל תְּפִלַּ֤ת עַבְדְּ/ךָ֙ וְ/אֶל תַּ֣חֲנוּנָ֔י/ו וְ/הָאֵ֣ר פָּנֶ֔י/ךָ עַל מִקְדָּשְׁ/ךָ֖ הַ/שָּׁמֵ֑ם לְמַ֖עַן אֲדֹנָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/017.yaml
  text: And now[a], our God, hear the prayer of your servant and his pleas for mercy, and let your face shine upon your sanctuary, which lies desolate, for the Lord’s sake.
translation:
  language: ru
  text: А теперь, Боже наш, услышь молитву твоего раба и его мольбы о милости, и да воссияет лицо твоё над твоим святилищем, лежащим в запустении, ради Господа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради Тебя Самого, Господи». В еврейском тексте буквально: «ради Господа» — божественный титул употреблён в третьем лице внутри прямого обращения.'
    reason: Альтернативное прочтение и пояснение необычной грамматической формы.
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и соединительный союз, и временно-дискурсивный переход к новой просьбе.
- source_word: שְׁמַע אֱלֹהֵינוּ
  choice: Боже наш, услышь
  rationale: Естественная для русской молитвенной речи форма прямого обращения, точно передающая повелительное שְׁמַע и אֱלֹהֵינוּ.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: молитву твоего раба
  rationale: Сохраняет конструкцию принадлежности и смиренное самообозначение молящегося.
- source_word: תַּחֲנוּנָיו
  choice: его мольбы о милости
  rationale: Передаёт не только настойчивость прошений, но и присущий слову смысл обращения за благосклонностью и милостью.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: и да воссияет лицо твоё
  rationale: Сохраняет образ сияющего лица как знака Божьего благоволения и звучит естественно в возвышенной современной русской речи.
- source_word: עַל מִקְדָּשְׁךָ
  choice: над твоим святилищем
  rationale: «Святилище» точнее более узкого «храм» и сохраняет значение святого места, принадлежащего Богу; предлог «над» естественно сочетается в русском с образом сияющего лица.
- source_word: הַשָּׁמֵם
  choice: лежащим в запустении
  rationale: Относительно-причастный оборот передаёт состояние разорённого, опустошённого святилища, не сводя смысл лишь к отсутствию людей.
- source_word: לְמַעַן אֲדֹנָי
  choice: ради Господа
  rationale: Формально сохраняет божественный титул в третьем лице внутри прямого обращения и не устраняет необычность еврейской формулировки.
theological_decisions:
- issue: Божественное самообозначение в לְמַעַן אֲדֹנָי
  choice: ради Господа
  alternative: ради Тебя Самого, Господи
  rationale: В еврейском тексте стоит титул אֲדֹנָי, а не местоимение второго лица. Основной текст сохраняет эту риторически необычную форму, а более естественное понимание прямого обращения приводится в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Архаические формы избегаются; традиционный библейский образ сияющего лица сохранён. Местоимения, относящиеся к Богу, даны со строчной буквы согласно нейтральной современной издательской норме.
