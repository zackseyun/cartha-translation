base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/004.yaml
  text: And I prayed to Yahweh my God and confessed and said[a], “Please, Lord, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: ru
  text: 'И я помолился Яхве, Богу моему, исповедовался и сказал: «О Господь, великий и внушающий трепет Бог[a], хранящий завет и являющий неизменную любовь[b] к тем, кто любит Тебя и соблюдает Твои заповеди,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грозный Бог». Еврейское слово обозначает Того, Кто внушает благоговейный страх.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верность завету»; также возможно: «милость». Еврейское חֶסֶד выражает верную любовь, милость и преданность в отношениях завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלְלָה
  choice: И я помолился
  rationale: Форма wayyiqtol передаёт последовательное действие в повествовании; совершенный вид естественен в русском контексте.
- source_word: לַיהוָה אֱלֹהַי
  choice: Яхве, Богу моему
  rationale: Сохраняются личное имя יהוה, адресат молитвы, и явный суффикс первого лица в אֱלֹהַי.
- source_word: וָאֶתְוַדֶּה
  choice: исповедовался
  rationale: Hitpael глагола ידה здесь означает признание грехов; русский возвратный глагол передаёт это без добавления отсутствующего в еврейском тексте прямого дополнения.
- source_word: וָאֹמְרָה
  choice: и сказал
  rationale: Сохраняет последовательность вводных действий и естественно вводит прямую речь.
- source_word: אָנָּא
  choice: О
  rationale: В данном торжественном обращении русская частица «О» естественно передаёт настойчивое, благоговейное воззвание; буквальное «прошу» потребовало бы синтаксического продолжения, которого здесь нет.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Передаёт титул обращения и отличает его от ранее названного имени Яхве.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: великий и внушающий трепет Бог
  rationale: Сохраняет описание Бога и смысл נורא как вызывающего благоговейный страх, избегая как разговорного «потрясающий», так и преимущественно отрицательного оттенка слова «страшный».
- source_word: שֹׁמֵר הַבְּרִית
  choice: хранящий завет
  rationale: Причастная конструкция передаёт постоянное свойство Бога; «хранить завет» — ясное и традиционно понятное выражение верности завету.
- source_word: וְהַחֶסֶד
  choice: и неизменную любовь
  rationale: Передаёт одновременно любовь, милость и устойчивую верность, особенно значимые в сочетании с заветом.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: к тем, кто любит Тебя и соблюдает Твои заповеди
  rationale: Естественная русская относительная конструкция сохраняет оба параллельных определения; второе лицо соответствует прямому обращению к Богу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, отличное от титула אֲדֹנָי далее в стихе; транслитерация сохраняет это различие.
- issue: Передача נורא
  choice: внушающий трепет
  alternative: грозный
  rationale: Выбранный вариант сохраняет идею благоговейного страха и не сводит характеристику Бога только к угрозе или суровости.
- issue: Передача חֶסֶד в контексте завета
  choice: неизменная любовь
  alternative: верность завету / милость
  rationale: חֶסֶד включает милость, преданность и верную любовь; сочетание с «заветом» подчёркивает устойчивый, обязательственный характер этой любви, не устраняя её личностного измерения.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенным регистром. Прямое обращение к Богу передано местоимениями второго лица с прописной буквы. Конечная запятая сохранена, поскольку синтаксически молитва продолжается в следующем стихе.
