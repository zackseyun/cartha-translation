  text: אֲדֹנָ֤/י שְׁמָ֨עָ/ה֙ אֲדֹנָ֣/י סְלָ֔חָ/ה אֲדֹנָ֛/י הַֽקֲשִׁ֥יבָ/ה וַ/עֲשֵׂ֖ה אַל תְּאַחַ֑ר לְמַֽעֲנְ/ךָ֣ אֱלֹהַ֔/י כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל עִירְ/ךָ֖ וְ/עַל עַמֶּֽ/ךָ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/019.yaml
  text: Lord[a], hear! Lord, forgive! Lord, pay attention and act! Do not delay, for your own sake, my God, because your name is called over your city and your people.
translation:
  language: ru
  text: Господи, услышь! Господи, прости! Господи, внемли и действуй! Не медли ради Себя, Боже мой, ибо Твоим именем названы Твой город и Твой народ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Твоё имя призвано над Твоим городом и Твоим народом». Эта еврейская формула выражает их принадлежность Богу и связь с Его именем.'
    reason: Сноска сохраняет буквальный образ исходной пассивной конструкции при естественной русской передаче в основном тексте.
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Звательная форма естественно передаёт прямое молитвенное обращение к Богу; притяжательное значение формы в русском обращении обычно не выражается.
- source_word: שְׁמָעָה
  choice: услышь
  rationale: Передаёт настоятельную молитвенную просьбу и сохраняет отличие от следующего, более интенсивного призыва внимать.
- source_word: סְלָחָה
  choice: прости
  rationale: Прямой и естественный эквивалент повелительной формы в контексте покаянной молитвы.
- source_word: הַקֲשִׁיבָה
  choice: внемли
  rationale: Выражает внимательное, действенное слушание и уместно в возвышенной, но понятной молитвенной речи.
- source_word: וַעֲשֵׂה
  choice: и действуй
  rationale: В контексте это просьба о Божьем вмешательстве; «действуй» естественно передаёт подразумеваемый смысл широкого глагола «делать».
- source_word: אַל תְּאַחַר
  choice: не медли
  rationale: Кратко и настоятельно передаёт запрет откладывать действие.
- source_word: לְמַעַנְךָ
  choice: ради Себя Самого
  rationale: Выражает просьбу действовать ради Божьего собственного имени и чести, сохраняя усилительный оттенок.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Сохраняет личное притяжательное обращение исходного текста.
- source_word: כִּי
  choice: ведь
  rationale: Естественно вводит основание предшествующей просьбы; причинный смысл сохраняется без чрезмерно тяжёлой конструкции.
- source_word: שִׁמְךָ נִקְרָא עַל
  choice: Твоё имя наречено над
  rationale: Сохраняет пассивную конструкцию и образ имени, провозглашённого над городом и народом, не сводя его сразу к более гладкому толкованию принадлежности.
- source_word: עִירְךָ
  choice: Твоим городом
  rationale: Прямо передаёт притяжательную форму; в контексте имеется в виду Иерусалим.
- source_word: עַמֶּךָ
  choice: Твоим народом
  rationale: Прямо передаёт притяжательную форму и параллелизм с городом.
theological_decisions:
- issue: Передача формулы שִׁמְךָ נִקְרָא עַל, обозначающей принадлежность и связь с Божьим именем
  choice: Твоё имя наречено над Твоим городом и Твоим народом
  alternative: Твой город и Твой народ названы Твоим именем
  rationale: 'Основной текст сохраняет грамматический образ еврейского оригинала и его богословскую многозначность: Божье имя провозглашено над городом и народом, тем самым отмечая их принадлежность Ему. Более идиоматическое понимание дано в сноске.'
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Краткие восклицания сохраняют настойчивый ритм оригинала; «внемли» несколько возвышенно, но общеупотребительно в религиозно-литературном регистре. Маркер сноски помещён непосредственно после спорной формулы.
