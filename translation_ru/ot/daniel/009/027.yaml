  text: וְ/הִגְבִּ֥יר בְּרִ֛ית לָ/רַבִּ֖ים שָׁב֣וּעַ אֶחָ֑ד וַ/חֲצִ֨י הַ/שָּׁב֜וּעַ יַשְׁבִּ֣ית זֶ֣בַח וּ/מִנְחָ֗ה וְ/עַ֨ל כְּנַ֤ף שִׁקּוּצִים֙ מְשֹׁמֵ֔ם וְ/עַד כָּלָה֙ וְ/נֶ֣חֱרָצָ֔ה תִּתַּ֖ךְ עַל שֹׁמֵֽם׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/027.yaml
  text: And he will make a firm covenant with the many for one week[a], and for half of the week he will put a stop to sacrifice and offering. And on the wing of abominations will come one who makes desolate[e][d][c][b], until the decreed end is poured out on the desolator.
translation:
  language: ru
  text: И он утвердит завет со многими на одну седмину[a], а на половину седмины прекратит жертву и приношение[b]. И на крыле мерзостей появится опустошитель[c][d], пока предопределённый конец не изольётся на опустошителя[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на одну неделю». Еврейское слово может обозначать период из семи единиц.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертву и хлебное приношение». Второе слово может обозначать приношение из муки или зерна.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на крыле мерзостей». Выражение трудно для понимания; возможны переводы: «на вершине мерзостей» или «на краю мерзостей».'
    reason: alternative_reading
  - marker: d
    text: 'Или: «тот, кто опустошает»; «причиняющий опустошение».'
    reason: lexical_alternative
  - marker: e
    text: 'Или: «на опустошённого» либо «на опустошённое место». Заключительная фраза синтаксически трудна, хотя еврейский текст устойчив.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגְבִּיר
  choice: утвердит
  rationale: Порода хифиль от גבר передаёт придание силы или действенности. «Утвердит» естественно сочетается с «заветом», при этом примечание сохраняет варианты «укрепит» и «сделает действенным».
- source_word: בְּרִית
  choice: завет
  rationale: Библейский термин «завет» сохраняет вес и религиозно-правовой смысл בְּרִית, не сводя его к обычному соглашению.
- source_word: לָרַבִּים
  choice: со многими
  rationale: В сочетании с утверждением завета предлог ל передан естественным русским «со»; «многими» сохраняет собирательный смысл, не уточняя личность группы.
- source_word: שָׁבוּעַ אֶחָד
  choice: на одну седмину
  rationale: В контексте Дан 9 שָׁבוּעַ означает семичастный период. «Седмина» сохраняет эту структуру и не навязывает буквальные семь дней.
- source_word: וַחֲצִי הַשָּׁבוּעַ
  choice: а на половине седмины
  rationale: Так передаётся временная точка прекращения жертв внутри обозначенного периода; выражение остаётся близким к еврейскому и естественным по-русски.
- source_word: יַשְׁבִּית
  choice: прекратит
  rationale: Хифиль от שבת имеет каузативный смысл «заставит прекратиться»; русский переходный глагол «прекратит» кратко и естественно передаёт его.
- source_word: זֶבַח וּמִנְחָה
  choice: жертву и приношение
  rationale: «Жертва» передаёт זֶבַח, а более широкое «приношение» — מִנְחָה; возможный узкий смысл хлебного приношения отмечен в сноске.
- source_word: וְעַל כְּנַף שִׁקּוּצִים
  choice: И на крыле мерзостей
  rationale: Буквальное «крыло» сохраняет трудную метафору כָּנָף и не подменяет её спорным архитектурным толкованием «вершина» или «край».
- source_word: מְשֹׁמֵם
  choice: будет опустошитель
  rationale: Причастие обозначает того, кто опустошает. Связка «будет» добавлена для связного русского синтаксиса без определения личности действующего лица.
- source_word: וְעַד כָּלָה וְנֶחֱרָצָה
  choice: пока предопределённый конец
  rationale: Сочетание выражает завершение, которое решено или постановлено; «предопределённый конец» сжато сохраняет оба элемента.
- source_word: תִּתַּךְ
  choice: не изольётся
  rationale: Глагол נתך буквально описывает излияние; форма с «пока не» естественно передаёт предел действия и будущую завершённость.
- source_word: עַל שֹׁמֵם
  choice: на опустошителя
  rationale: Мужское единственное причастие наиболее прямо понимается как обозначение действующего лица; иные синтаксические возможности вынесены в примечание.
theological_decisions:
- issue: Личность субъекта «он» в начале стиха
  choice: Местоимение «он» оставлено без отождествления.
  alternative: Помазанник; грядущий правитель из предыдущего стиха; Антиох IV; эсхатологический противник.
  rationale: Еврейский текст в самом стихе прямо не называет субъекта, а традиции расходятся в определении его антецедента.
- issue: Смысл выражения כְּנַף שִׁקּוּצִים
  choice: «на крыле мерзостей»
  alternative: «на вершине мерзостей»; «на краю мерзостей»; «с мерзостями».
  rationale: Лексика и синтаксис выражения трудны; буквальный образ позволяет сохранить подлинную неоднозначность.
- issue: Референт שֹׁמֵם в заключительной фразе
  choice: «опустошитель»
  alternative: «опустошённый»; «опустошённое место».
  rationale: Мужское единственное причастие естественнее всего обозначает деятеля, однако трудность синтаксиса требует отметить другие возможные прочтения.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Термин «седмина» выбран как понятный в библейском контексте способ обозначить период из семи единиц без сведения его к семи дням. Трудные образы сохранены, а не истолкованы в основном тексте; личность субъекта не уточняется.
