base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/001.yaml
  text: In the first year of Darius son of Ahasuerus[a], of the offspring of the Medes, who was made king over the kingdom of the Chaldeans—
translation:
  language: ru
  text: В первый год Дария, сына Ахашвероша, из рода мидян, которого поставили царём над царством халдеев[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилонян». В еврейском тексте стоит «халдеев», но здесь это слово может обозначать Вавилонское царство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת
  choice: В первый год
  rationale: В формуле датировки по годам правления сочетание с количественным числительным идиоматически означает «в первый год».
- source_word: לְדָרְיָוֶשׁ
  choice: Дария
  rationale: Предлог לְ выражает отнесённость года к правлению Дария; русский родительный падеж естественно передаёт эту формулу.
- source_word: בֶּן אֲחַשְׁוֵרוֹשׁ
  choice: сына Ахашвероша
  rationale: בֶּן прямо обозначает сыновство; имя передано транслитерацией с еврейского.
- source_word: מִזֶּרַע מָדָי
  choice: из рода мидян
  rationale: זֶרַע здесь обозначает происхождение или род, а не буквальное семя; מָדָי — собирательное обозначение мидян.
- source_word: הָמְלַךְ
  choice: которого поставили царём
  rationale: Пассивно-каузативная порода глагола указывает, что Дарий получил царскую власть; формулировка сохраняет этот оттенок, не называя действующее лицо.
- source_word: עַל מַלְכוּת
  choice: над царством
  rationale: עַל обозначает власть над чем-либо, а מַלְכוּת здесь означает царство или державу.
- source_word: כַּשְׂדִּים
  choice: халдеев
  rationale: Основной текст сохраняет еврейский этноним; контекстуальный вариант «вавилонян» вынесен в примечание.
