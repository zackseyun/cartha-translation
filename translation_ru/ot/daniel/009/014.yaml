  text: וַ/יִּשְׁקֹ֤ד יְהוָה֙ עַל הָ֣/רָעָ֔ה וַ/יְבִיאֶ֖/הָ עָלֵ֑י/נוּ כִּֽי צַדִּ֞יק יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַל כָּל מַֽעֲשָׂי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/לֹ֥א שָׁמַ֖עְנוּ בְּ/קֹלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/014.yaml
  text: So Yahweh kept watch over the disaster and brought it upon us[a], for Yahweh our God is righteous in all the works that he has done[c][b], and we have not listened to his voice.
translation:
  language: ru
  text: И Яхве неусыпно следил за бедствием и навёл его на нас[a], ибо Яхве, наш Бог, праведен во всех делах, которые Он совершил, а мы не слушались Его голоса[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастье». Еврейское слово может также означать «зло», но здесь речь идёт о бедствии суда, постигшем народ. Выражение «неусыпно следил» можно также передать как «бодрствовал над» или, более толковательно, «поспешил осуществить».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не слушали Его голоса»; это выражение подразумевает, что Его словам не повиновались.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁקֹד
  choice: неусыпно следил
  rationale: 'Глагол שׁקד выражает бодрствование, бдительность и неослабное внимание. Перевод сохраняет исходный образ: Яхве бодрствовал над объявленным судом, пока не осуществил его, не сводя смысл к более толковательному «поспешил».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: הָרָעָה
  choice: бедствие
  rationale: В данном контексте רָעָה означает губительное бедствие как суд, а не нравственное зло. «Бедствие» естественно по-русски и не устраняет судебный характер события.
- source_word: וַיְבִיאֶהָ עָלֵינוּ
  choice: навёл его на нас
  rationale: Женский суффикс отсылает к «бедствию»; сочетание передаёт каузативное значение בוא и направленность עָלֵינוּ естественным русским оборотом.
- source_word: כִּי
  choice: ведь
  rationale: 'Союз вводит основание сказанного: совершившийся суд согласуется с праведностью Яхве.'
- source_word: צַדִּיק
  choice: праведен
  rationale: «Праведен» сохраняет морально-судебный и заветный объём еврейского צַדִּיק лучше, чем более узкое «справедлив».
- source_word: עַל כָּל מַעֲשָׂיו אֲשֶׁר עָשָׂה
  choice: во всех делах, которые Он совершил
  rationale: עַל понимается как «в отношении / применительно к»; русское «праведен во всех делах» ясно выражает, что праведность Бога проявляется во всех Его действиях.
- source_word: וְלֹא שָׁמַעְנוּ בְּקֹלוֹ
  choice: а мы не слушались Его голоса
  rationale: Конструкция שׁמע בקול означает не просто слышать, а внимать с послушанием. «Не слушались Его голоса» сохраняет образ голоса и передаёт подразумеваемое неповиновение; «а» естественно обозначает контраст между Божьей праведностью и поведением народа.
theological_decisions:
- issue: Значение רָעָה применительно к действию Бога
  choice: бедствие
  alternative: зло; несчастье
  rationale: В контексте заветного суда слово обозначает постигшую народ катастрофу. Такой перевод сохраняет утверждение, что Бог действительно навёл суд, не создавая неуместного смысла, будто Он совершил нравственное зло.
- issue: Связь Божьей праведности и признания вины народа
  choice: «ведь» вводит основание, а «а» сохраняет контраст
  alternative: «потому что… и мы не слушали»
  rationale: Текст одновременно утверждает праведность Божьих действий и непослушание народа. Перевод не объясняет сверх текста точную логику воздаяния, но ясно сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены личное имя «Яхве», метафора бдительного наблюдения и образ слушания голоса; синтаксис сделан естественным для обычного современного читателя.
