  text: וַ/יָּ֜קֶם אֶת דברי/ו אֲשֶׁר דִּבֶּ֣ר עָלֵ֗י/נוּ וְ/עַ֤ל שֹֽׁפְטֵ֨י/נוּ֙ אֲשֶׁ֣ר שְׁפָט֔וּ/נוּ לְ/הָבִ֥יא עָלֵ֖י/נוּ רָעָ֣ה גְדֹלָ֑ה אֲשֶׁ֣ר לֹֽא נֶעֶשְׂתָ֗ה תַּ֚חַת כָּל הַ/שָּׁמַ֔יִם כַּ/אֲשֶׁ֥ר נֶעֶשְׂתָ֖ה בִּ/ירוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/012.yaml
  text: He has confirmed his words that he spoke against us and against our judges who judged us[a], by bringing upon us a great disaster such as had not been done under all heaven, as it was done in Jerusalem.
translation:
  language: ru
  text: Он подтвердил свои слова, которые говорил против нас и против наших судей, судивших нас[a], наведя на нас великое бедствие, какого не бывало под всем небом, как в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наших правителей, управлявших нами» или «наших вождей, руководивших нами». Еврейские слова, переведённые как «судьи» и «судивших», могут обозначать власть и управление в более широком смысле, а не только деятельность судей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: подтвердил
  rationale: Порода hифиль глагола קום в сочетании со «словами» означает утвердить, подтвердить или привести сказанное в исполнение. «Подтвердил» передаёт, что Бог сделал истинным ранее произнесённый приговор.
- source_word: דבריו
  choice: свои слова
  rationale: Сохранено множественное число еврейского текста; возвратное «свои» естественно по-русски при том же субъекте.
- source_word: דִּבֶּר עָלֵינוּ
  choice: говорил против нас
  rationale: В контексте суда предлог עַל имеет направленное против кого-либо значение, а не просто нейтральное «о нас».
- source_word: שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ
  choice: наших судей, судивших нас
  rationale: Сохранены общий корень и формальное повторение оригинала. Более широкое значение властителей отмечено в сноске.
- source_word: לְהָבִיא עָלֵינוּ
  choice: наведя на нас
  rationale: Деепричастная конструкция естественно выражает средство, посредством которого Бог подтвердил сказанные слова.
- source_word: רָעָה גְדֹלָה
  choice: великое бедствие
  rationale: В контексте Божьего суда רָעָה обозначает бедствие или calamity, а не нравственное зло; «великое» сохраняет возвышенный регистр.
- source_word: אֲשֶׁר לֹא נֶעֶשְׂתָה
  choice: какого не бывало
  rationale: Идиоматичная русская формулировка ясно передаёт беспримерность бедствия, не создавая неестественной пассивной конструкции.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: под всем небом
  rationale: Сохранён еврейский образ, обозначающий весь мир, без поясняющего расширения в основном тексте.
- source_word: כַּאֲשֶׁר נֶעֶשְׂתָה בִּירוּשָׁלָם
  choice: подобное тому, что произошло в Иерусалиме
  rationale: Формулировка сохраняет сравнение с совершившимся в Иерусалиме бедствием и звучит естественно по-русски.
theological_decisions:
- issue: Подразумеваемое подлежащее стиха
  choice: Местоимение «Он» относится к Богу, что следует из контекста молитвы.
  alternative: Вставить в текст имя «Бог» или «Господь».
  rationale: В еврейском тексте имя субъекта здесь не повторено. Местоимение сохраняет связность с ближайшим контекстом, не добавляя отсутствующего в стихе наименования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены образ «под всем небом», повтор корня «суд» и неоднозначность обозначения властей; тяжеловесные буквальные пассивные обороты заменены естественными русскими конструкциями.
