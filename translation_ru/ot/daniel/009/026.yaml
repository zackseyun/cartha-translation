id: DAN.9.26
reference: Daniel 9:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַחֲרֵ֤י הַ/שָּׁבֻעִים֙ שִׁשִּׁ֣ים וּ/שְׁנַ֔יִם יִכָּרֵ֥ת מָשִׁ֖יחַ וְ/אֵ֣ין ל֑/וֹ וְ/הָ/עִ֨יר וְ/הַ/קֹּ֜דֶשׁ יַ֠שְׁחִית עַ֣ם נָגִ֤יד הַ/בָּא֙ וְ/קִצּ֣/וֹ בַ/שֶּׁ֔טֶף וְ/עַד֙ קֵ֣ץ מִלְחָמָ֔ה נֶחֱרֶ֖צֶת שֹׁמֵמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/026.yaml
  text: And after the sixty-two weeks[a], an anointed one will be cut off and will have nothing. And the city and the sanctuary the people of the coming ruler will destroy. Its end will come with a flood, and until the end there will be war[d][c][b]; desolations are decreed.
translation:
  language: ru
  text: И после шестидесяти двух недель помазанник[a] будет отсечён, и у него ничего не будет[b]. Город и святилище разрушит народ грядущего правителя[c]. Его конец придёт с потопом[d], и до самого конца будет война; запустения предопределены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мессия». Еврейское слово означает «помазанник»; толкователи расходятся в том, употреблено ли оно здесь как особый титул Мессии.'
    reason: alternative_reading
  - marker: b
    text: 'Возможные переводы: «и не будет ничего для него» или «и никого у него не будет». Еврейская фраза кратка и трудна для однозначного понимания.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «народ грядущего князя». Еврейское נָגִיד может означать правителя, вождя или князя.'
    reason: lexical_alternative
  - marker: d
    text: 'Неясно, к кому или к чему относится слово «его»: к правителю, святилищу либо к только что описанному разрушению. Также возможно: «его конец будет в потопе».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: шестидесяти двух недель
  rationale: «Недели» прямо и узнаваемо передаёт שָׁבֻעַ, сохраняя характерный для Даниила образ временных семериц без добавления в основной текст толкования о длительности каждой единицы.
- source_word: יִכָּרֵת
  choice: будет отсечён
  rationale: Страдательная форма глагола כרת передаёт насильственное устранение или гибель. «Будет отсечён» сохраняет исходный образ и его торжественно-грозное звучание.
- source_word: מָשִׁיחַ
  choice: помазанник
  rationale: Существительное употреблено без артикля и буквально обозначает помазанного человека. Строчная буква не предрешает спорный вопрос о том, является ли здесь слово особым мессианским титулом.
- source_word: וְאֵין לוֹ
  choice: и у него ничего не будет
  rationale: Краткая еврейская фраза допускает понимание как утраты, отсутствия достояния или отсутствия поддержки. Русская формулировка сохраняет эту недосказанность.
- source_word: הָעִיר וְהַקֹּדֶשׁ
  choice: город и святилище
  rationale: В данном контексте הַקֹּדֶשׁ обозначает святое место, то есть храмовое святилище; это естественная русская пара к слову «город».
- source_word: יַשְׁחִית
  choice: разрушит
  rationale: Порода хифиль глагола שׁחת здесь выражает разрушительное действие против города и святилища.
- source_word: עַם נָגִיד הַבָּא
  choice: народ грядущего правителя
  rationale: נָגִיד означает вождя или правителя, а причастие הַבָּא характеризует его как грядущего. Выбранная формулировка современна и не уточняет сверх текста его личность.
- source_word: וְקִצּוֹ בַשֶּׁטֶף
  choice: Его конец придёт с потопом
  rationale: Местоименный суффикс буквально передан словом «его», а образ שֶׁטֶף сохранён как «потоп». Поскольку отнесение местоимения спорно, это поясняется в сноске.
- source_word: וְעַד קֵץ מִלְחָמָה
  choice: и до самого конца будет война
  rationale: Фраза естественно передаёт продолжающуюся войну вплоть до конца, не конкретизируя, какой именно конец имеется в виду.
- source_word: נֶחֱרֶצֶת שֹׁמֵמוֹת
  choice: запустения предопределены
  rationale: Страдательная форма חרץ выражает твёрдое решение или определение, а שֹׁמֵמוֹת — состояния опустошения и запустения во множественном числе.
theological_decisions:
- issue: Следует ли передавать מָשִׁיחַ в основном тексте как особый титул «Мессия»
  choice: помазанник
  alternative: Мессия
  rationale: Еврейское слово само по себе означает помазанника и здесь не имеет артикля. Основной текст не отождествляет названное лицо заранее, а важное мессианское прочтение сохранено в сноске.
- issue: Как понимать краткую фразу וְאֵין לוֹ
  choice: и у него ничего не будет
  alternative: и не будет ничего для него; и никого у него не будет
  rationale: Фраза может указывать на лишение, оставленность либо отсутствие принадлежавшего ему. Перевод намеренно не связывает её с одним богословским объяснением.
- issue: К кому относится местоименный суффикс в וְקִצּוֹ
  choice: сохранить неоднозначное «его конец»
  alternative: конец города и святилища; конец грядущего правителя
  rationale: Грамматика допускает разные соотнесения суффикса в контексте. Русское «его» и сноска сохраняют эту реальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Сохранены библейские образы «отсечён», «потоп» и «запустения», но устранены ненужные архаизмы. Строчное «помазанник» служит для передачи отсутствия артикля и не предрешает идентификацию лица.
