source:
  edition: WLC
  text: וְ/לֹ֤א שָׁמַ֨עְנוּ֙ אֶל עֲבָדֶ֣י/ךָ הַ/נְּבִיאִ֔ים אֲשֶׁ֤ר דִּבְּרוּ֙ בְּ/שִׁמְ/ךָ֔ אֶל מְלָכֵ֥י/נוּ שָׂרֵ֖י/נוּ וַ/אֲבֹתֵ֑י/נוּ וְ/אֶ֖ל כָּל עַ֥ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/006.yaml
  text: We have not listened to your servants the prophets[a], who spoke in your name to our kings, our officials, our fathers[b], and to all the people of the land.
translation:
  language: ru
  text: Мы не слушали Твоих слуг — пророков[a], которые от Твоего имени говорили нашим царям, нашим правителям, нашим отцам[b] и всему народу страны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повиновались». Еврейский глагол может означать не просто слышать, а внимать услышанному и поступать соответственно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нашим предкам». Буквально: «нашим отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: не слушали
  rationale: Глагол שׁמע с אֶל означает «слушать, внимать» и подразумевает отклик и послушание. «Не слушали» сохраняет оба оттенка, не сводя смысл только к физическому восприятию или только к повиновению.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: Твоих слуг — пророков
  rationale: 'עבד здесь обозначает людей, состоящих на служении Богу; «слуги» естественно передаёт почётное обозначение пророков. Тире ясно выражает приложительное отношение: слуги, то есть пророки.'
- source_word: דִּבְּרוּ בְּשִׁמְךָ
  choice: от Твоего имени говорили
  rationale: Оборот בְּשֵׁם указывает на речь с полномочиями и от лица Бога. Русское «от Твоего имени» естественно выражает это представительство.
- source_word: שָׂרֵינוּ
  choice: нашим правителям
  rationale: שׂרים обозначает стоящих у власти князей или сановников. «Правители» понятно современному читателю и не ограничивает значение наследственной знатью.
- source_word: אֲבֹתֵינוּ
  choice: нашим отцам
  rationale: Формально точная передача мужского множественного числа. В данном перечислении слово может обозначать отцов и предшествующие поколения; этот диапазон отмечен в сноске.
- source_word: כָּל עַם הָאָרֶץ
  choice: всему народу страны
  rationale: עַם — собирательное «народ», а הָאָרֶץ в контексте обозначает страну/землю и её население. «Народ страны» сохраняет структуру исходного выражения и звучит естественно по-русски.
theological_decisions:
- issue: Передавать ли שָׁמַעְנוּ как слушание или как послушание
  choice: не слушали
  alternative: не повиновались
  rationale: Исповедальный контекст подразумевает неповиновение, однако еврейский глагол шире и соединяет слушание с должным откликом. Основной текст сохраняет эту смысловую напряжённость.
- issue: Передавать ли אֲבֹתֵינוּ буквально или обобщённо
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Буквальная мужская форма сохранена в основном тексте, тогда как возможный контекстуальный смысл «предки» указан в сноске без нейтрализации исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного исповедания. Порядок перечисления сохранён; местоимения, обращённые к Богу, написаны с прописной буквы. Формулировки понятны широкому читателю и не вводят конфессионально специфических толкований.
