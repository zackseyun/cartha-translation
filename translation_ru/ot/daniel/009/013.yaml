base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/013.yaml
  text: Just as it is written in the Law of Moses[a], all this calamity has come upon us[c][b], yet we have not sought the favor of Yahweh our God by turning from our iniquities and by gaining insight into your truth.
translation:
  language: ru
  text: Как написано в Законе Моисея, всё это бедствие[a] постигло нас, но мы не искали благоволения[b] Яхве, нашего Бога, чтобы отвратиться от наших беззаконий и вникнуть в Твою истину[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё это несчастье» или «всё это зло». Здесь еврейское слово обозначает губительное бедствие, пришедшее как суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не умоляли лица Яхве, нашего Бога» — еврейское выражение со значением искать Его милости или благоволения.'
    reason: idiom_explanation
  - marker: c
    text: 'Возможно также: «обретая разумение благодаря Твоей истине» или «постигая Твою верность». Слово, переведённое как «истина», может также означать «верность».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר כָּתוּב
  choice: Как написано
  rationale: Естественная русская формула ссылки на Писание; передаёт соответствие случившегося написанному, не перегружая фразу буквальным «точно так, как».
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: в Законе Моисея
  rationale: В данном контексте תּוֹרָה обозначает Моисеев закон как корпус заветных предписаний и предупреждений; это устойчивое и понятное русское выражение.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: всё это бедствие
  rationale: רָעָה здесь означает постигшее народ губительное бедствие как суд, а не нравственное зло.
- source_word: בָּאָה עָלֵינוּ
  choice: постигло нас
  rationale: Естественно передаёт еврейскую идиому «пришло на нас» применительно к бедствию.
- source_word: וְלֹא חִלִּינוּ אֶת פְּנֵי
  choice: но мы не искали благоволения
  rationale: Порода piel глагола חלה в сочетании с פְּנֵי образует идиому со значением умолять, добиваться милости или благоволения; русский вариант передаёт смысл без буквального и неясного «умоляли лицо».
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Яхве, нашего Бога
  rationale: Сохраняется личное заветное имя יהוה и притяжательное обозначение «наш Бог».
- source_word: לָשׁוּב מֵעֲוֺנֵנוּ
  choice: отвратившись от своих беззаконий
  rationale: שׁוב выражает поворот или возвращение, а עָוֹן — виновное беззаконие; деепричастная конструкция передаёт способ искания Божьего благоволения.
- source_word: וּלְהַשְׂכִּיל בַּאֲמִתֶּךָ
  choice: и постигая Твою истину
  rationale: Hiphil שׂכל может означать разумение, обретение проницательности или благоразумное внимание. «Постигая» естественно связывается с истиной, сохраняя интеллектуально-нравственный оттенок; ב передано через прямое управление русского глагола.
theological_decisions:
- issue: Значение רָעָה в описании Божьего суда
  choice: бедствие
  alternative: зло; несчастье; беда
  rationale: Контекст говорит о последствиях заветного суда, постигших народ, а не приписывает Богу нравственное зло.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет различие между личным именем и титулом.
- issue: Связь инфинитивов לָשׁוּב и לְהַשְׂכִּיל с исканием благоволения
  choice: 'способ искания благоволения: «отвратившись… и постигая…»'
  alternative: 'цель: «чтобы отвратиться… и постичь…»'
  rationale: Инфинитивы допускают оттенок цели или пояснения, однако в контексте покаяния естественно описывают то, в чём должно было проявиться обращение к Богу. Отрицание основной конструкции охватывает и эти неосуществлённые действия.
- issue: Значение אֱמֶת
  choice: истина
  alternative: верность; надёжность
  rationale: «Истина» естественно сочетается с глаголом разумения, но примечание сохраняет возможный оттенок Божьей верности.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейским достоинством. Синтаксис остаётся ясным для обычного читателя; местоимение «Твою» пишется с прописной буквы как уместная в прямом обращении к Богу форма уважительного религиозного регистра.
