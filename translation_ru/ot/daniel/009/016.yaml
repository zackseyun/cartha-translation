  text: אֲדֹנָ֗/י כְּ/כָל צִדְקֹתֶ֨/ךָ֙ יָֽשָׁב נָ֤א אַפְּ/ךָ֙ וַ/חֲמָ֣תְ/ךָ֔ מֵ/עִֽירְ/ךָ֥ יְרוּשָׁלִַ֖ם הַר קָדְשֶׁ֑/ךָ כִּ֤י בַ/חֲטָאֵ֨י/נוּ֙ וּ/בַ/עֲוֺנ֣וֹת אֲבֹתֵ֔י/נוּ יְרוּשָׁלִַ֧ם וְ/עַמְּ/ךָ֛ לְ/חֶרְפָּ֖ה לְ/כָל סְבִיבֹתֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/016.yaml
  text: Lord[a], according to all your righteous acts, please let your anger and your wrath turn away from your city Jerusalem, your holy mountain; because through our sins and the iniquities of our fathers[b], Jerusalem and your people have become a reproach to all those around us.
translation:
  language: ru
  text: Господи, по всем Твоим праведным делам[a] молю, да отвратятся гнев Твой и ярость Твоя от Твоего города — Иерусалима, Твоей святой горы, ибо из-за наших грехов и беззаконий наших отцов[b] Иерусалим и народ Твой стали предметом поношения у всех окружающих нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всей праведности Твоей» либо «по всем справедливым деяниям Твоим». В еврейском тексте стоит множественное число, вероятно указывающее на конкретные праведные дела Бога, а не только на отвлечённое качество.'
    reason: lexical_alternative
  - marker: b
    text: Под «нашими отцами» имеются в виду прежние поколения, предки народа.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Естественная русская форма прямого обращения, передающая божественный титул без добавления притяжательного значения «мой».
- source_word: כְּכָל צִדְקֹתֶיךָ
  choice: по всем праведным делам Твоим
  rationale: Предлог כְּ выражает меру или основание просьбы, а множественное число צְדָקוֹת указывает прежде всего на конкретные проявления Божьей праведности.
- source_word: יָשָׁב נָא
  choice: да отвратятся, молю
  rationale: Побудительная форма с נָא передаёт почтительную просьбу; при гневе и ярости как подлежащих שׁוב означает «отвратиться, отступить».
- source_word: אַפְּךָ וַחֲמָתְךָ
  choice: гнев Твой и ярость Твоя
  rationale: Сохраняется пара близких, но не тождественных обозначений сильного Божьего негодования.
- source_word: מֵעִירְךָ יְרוּשָׁלַם הַר קָדְשֶׁךָ
  choice: от города Твоего Иерусалима, святой горы Твоей
  rationale: Сохранены принадлежность города Богу и приложение, отождествляющее Иерусалим с Его святой горой.
- source_word: בַחֲטָאֵינוּ וּבַעֲוֹנוֹת אֲבֹתֵינוּ
  choice: из-за наших грехов и беззаконий наших отцов
  rationale: Предлог בְּ имеет здесь причинное значение; עָוֹן передано как «беззаконие», чтобы отличить его от חֵטְא и сохранить оттенок виновности.
- source_word: לְחֶרְפָּה
  choice: стали предметом поношения
  rationale: Конструкция לְ выражает результирующее униженное состояние; русская фраза ясно передаёт общественный позор и поругание.
- source_word: לְכָל סְבִיבֹתֵינוּ
  choice: для всех, кто вокруг нас
  rationale: Субстантивированное выражение обозначает окружающие Иудею народы или людей; нейтральная формулировка не уточняет их сверх текста.
theological_decisions:
- issue: Смысл множественного צִדְקֹתֶיךָ в обращении к Богу
  choice: праведные дела Твои
  alternative: праведность Твоя; справедливые деяния Твои
  rationale: Множественное число благоприятствует пониманию как конкретных Божьих деяний, но сноска сохраняет связь с более широкими понятиями праведности и справедливости.
- issue: Совместная и межпоколенческая исповедь вины
  choice: наши грехи и беззакония наших отцов
  alternative: наши грехи и беззакония наших предков
  rationale: Перевод сохраняет явное различение нынешнего сообщества и прежних поколений, не делая вывода о механизме наследования личной вины.
- issue: Причинная связь между грехами и поношением
  choice: из-за наших грехов... стали предметом поношения
  alternative: через наши грехи... являются поношением
  rationale: Так естественно по-русски выражены причинный בְּ и результирующая конструкция לְחֶרְפָּה без чрезмерного уточнения подразумеваемой связки.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Умеренно возвышенные формы «да отвратятся, молю» и «поношение» соответствуют торжественному контексту, оставаясь понятными; прописные местоимения при обращении к Богу применены последовательно.
