lexical_decisions:
- source_word: לַאדֹנָי
  choice: Господу … принадлежат
  rationale: Предлог לְ выражает принадлежность; добавленный глагол «принадлежат» естественно передаёт смысл безглагольного еврейского предложения.
- source_word: אֱלֹהֵינוּ
  choice: нашему Богу
  rationale: Сохранено прямое значение формы с местоименным суффиксом 1-го лица множественного числа.
- source_word: הָרַחֲמִים
  choice: милосердие
  rationale: Формально множественное существительное здесь естественно понимать как отвлечённое понятие; «милосердие» звучит по-русски современно и достойно.
- source_word: וְהַסְּלִחוֹת
  choice: и прощение
  rationale: Множественная форма может обозначать полноту или множество актов прощения, но в современном русском отвлечённое единственное число наиболее естественно.
- source_word: כִּי
  choice: ведь
  rationale: Частица сохраняет объяснительно-мотивирующую связь с исповеданием, не делая причинную формулу по-русски чрезмерно жёсткой; возможное уступительное понимание отмечено в сноске.
- source_word: מָרַדְנוּ
  choice: мы восстали
  rationale: Глагол מרד означает сознательное неповиновение, мятеж или восстание, а не просто грех вообще.
- source_word: בּוֹ
  choice: против Него
  rationale: При глаголе מרד предлог בְ обозначает лицо, против которого направлен мятеж; буквальное «в Нём» по-русски исказило бы смысл.
theological_decisions:
- issue: Связь Божьего милосердия с признанием мятежа
  choice: ведь мы восстали против Него
  alternative: хотя мы восстали против Него
  rationale: כִּי обычно имеет причинно-объяснительное значение, но в данном контексте допускает уступительный оттенок. Основной текст сохраняет объяснительную связь, а сноска не скрывает возможное прочтение.
- issue: Божественный титул אֲדֹנָי
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественный и укоренившийся русский эквивалент божественного титула; «Владыка» возможно, но здесь менее нейтрально.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской торжественностью без архаизмов. Порядок «Господу, нашему Богу» сохраняет акцент исходного текста; прописная буква в «Него» соответствует русской традиции уважительного обозначения Бога.
