  text: Господу, нашему Богу, принадлежат милосердие и прощение[a], ибо мы восстали против Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «милости и прощения». В еврейском тексте оба существительных стоят во множественном числе, которое может выражать изобилие либо иметь значение отвлечённого понятия.'
