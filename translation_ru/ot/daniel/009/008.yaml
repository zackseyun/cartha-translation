base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/008.yaml
  text: O Lord[a], to us belongs shame of face—to our kings, to our princes[b], and to our fathers—because we have sinned against you.
translation:
  language: ru
  text: Яхве, позор лежит на нас, на наших царях, правителях и отцах[b], потому что мы согрешили против тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стыд лица» — еврейское выражение, обозначающее явный позор и унижение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предках».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно представленное тетраграмматоном в еврейском тексте, а не заменяет его титулом.
- source_word: לָנוּ בֹּשֶׁת הַפָּנִים
  choice: на нас лежит позор
  rationale: Естественно по-русски выражает принадлежность народу публичного стыда и унижения; буквальный образ лица пояснён в сноске.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ
  choice: на наших царях, правителях
  rationale: Повторение «на» сохраняет параллелизм ל; «правители» передаёт широкий политико-административный смысл שָׂרִים без неоправданного сужения до царских сыновей.
- source_word: וְלַאֲבֹתֵינוּ
  choice: и отцах
  rationale: Сохраняет конкретное мужское обозначение אָבוֹת; в данном контексте речь идёт о предках народа.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: потому что мы согрешили против тебя
  rationale: אֲשֶׁר вводит основание позора, а ל при חטא обозначает того, против кого совершён грех.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя, и его транслитерация сохраняет это различие, не подменяя имя титулом.
- issue: Коллективная ответственность в исповедании
  choice: мы согрешили
  alternative: они согрешили
  rationale: Форма первого лица множественного числа прямо включает молящегося и народ в общее признание вины; её нельзя переносить только на перечисленных царей, правителей и отцов.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Конструкция «на нас лежит позор» естественна и сохраняет распределение вины между всеми перечисленными группами; личное имя передано как «Яхве».
