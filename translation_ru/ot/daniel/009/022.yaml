base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/022.yaml
  text: He made me understand[a], and spoke with me, and said, “Daniel[b], I have now come out to give you insight and understanding.”
translation:
  language: ru
  text: 'Он вразумил меня, говорил со мной и сказал: «Даниил, теперь я вышел, чтобы дать тебе разумение»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы научить тебя разумению»; еврейское выражение означает наделить способностью понимать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: Он вразумил меня
  rationale: 'Форма от בין в данном контексте естественно понимается каузативно: посланник помогает Даниилу понять. «Вразумил» кратко и ясно передаёт этот смысл.'
- source_word: וַיְדַבֵּר עִמִּי
  choice: говоря со мной
  rationale: Предлог עִם буквально обозначает «с»; русское «говоря со мной» сохраняет эту особенность и естественно соединяется с последующим «сказал».
- source_word: וַיֹּאמַר
  choice: сказал
  rationale: Обычный повествовательный глагол, вводящий прямую речь.
- source_word: דָּנִיֵּאל
  choice: Даниил
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: עַתָּה
  choice: теперь
  rationale: Передаёт указание на настоящий момент в речи посланника.
- source_word: יָצָאתִי
  choice: я вышел
  rationale: Сохраняет буквальный пространственный образ глагола יצא и не уточняет исходную точку, которая в стихе прямо не названа.
- source_word: לְהַשְׂכִּילְךָ בִינָה
  choice: чтобы дать тебе разумение
  rationale: Инфинитив שכל в каузативном значении вместе с בינה образует единое выражение о сообщении способности понимать; по-русски тавтологичное «дать тебе понимание и разумение» неоправданно раздваивало бы тесную еврейскую конструкцию.
theological_decisions:
- issue: Направление действия в יָצָאתִי
  choice: я вышел
  alternative: я пришёл / я был послан
  rationale: Исходный глагол означает «выйти» и сам по себе не выражает ни прибытия, ни прямо сформулированного послания. Перевод сохраняет образ и его допустимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сочетание «говоря со мной, сказал» сохраняет оба еврейских глагола без тяжеловесного «говорил со мной и сказал».
