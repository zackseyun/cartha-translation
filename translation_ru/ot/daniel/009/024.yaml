base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/024.yaml
  text: 'Seventy weeks are decreed concerning your people and your holy city: to finish the transgression[a], to seal up sins, to make atonement for iniquity, to bring in everlasting righteousness, to seal up vision and prophet[d][c][b], and to anoint the most holy place.'
translation:
  language: ru
  text: Семьдесят седмиц[a] определены для твоего народа и твоего святого города, чтобы положить конец преступлению, запечатать грехи[b], совершить искупление за беззаконие, принести вечную праведность, запечатать видение и пророка[c] и помазать Святое святых[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семьдесят семёрок»; многие понимают это как семьдесят периодов по семь лет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «положить конец грехам».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте: «видение и пророка»; выражение также понимают как «видение и пророчество».'
    reason: alternative_reading
  - marker: d
    text: Еврейское выражение может обозначать святейшее место или предмет; некоторые понимают его как указание на святейшего человека.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁבֻעִים שִׁבְעִים
  choice: семьдесят седмиц
  rationale: שָׁבוּעַ обозначает семидневный период или единицу из семи. «Седмицы» сохраняет форму исходного образа и не добавляет прямо не названные в стихе годы; распространённое понимание как семилетий отмечено в сноске.
- source_word: נֶחְתַּךְ
  choice: определены
  rationale: Нифаль глагола חתך здесь выражает назначение или твёрдое установление срока. «Определены» естественно по-русски и не воспроизводит неясную буквальность «отсечены».
- source_word: עַל עַמְּךָ וְעַל עִיר קָדְשֶׁךָ
  choice: для твоего народа и твоего святого города
  rationale: Предлог עַל обозначает здесь область приложения установленного срока. «Для» естественно передаёт его направленность, не исключая значения «о/относительно».
- source_word: לְכַלֵּא הַפֶּשַׁע
  choice: положить конец преступлению
  rationale: Форма от כלא/כלה в данной текстовой традиции связана с прекращением или завершением. Русское выражение передаёт конечный результат и сохраняет определённое единственное число הַפֶּשַׁע.
- source_word: וְלַחְתֹּם חטאות
  choice: запечатать грехи
  rationale: חתם буквально означает «запечатать». Метафора сохранена в основном тексте, тогда как возможный смысл «положить конец грехам» дан в сноске.
- source_word: וּלְכַפֵּר עָוֺן
  choice: искупить беззаконие
  rationale: כפר обозначает совершение искупления или очищения. «Искупить» кратко и естественно передаёт культово-богословскую ёмкость глагола; «беззаконие» сохраняет отличие עָוֺן от предшествующих слов о преступлении и грехах.
- source_word: וּלְהָבִיא צֶדֶק עֹלָמִים
  choice: установить вечную праведность
  rationale: הביא буквально значит «принести/ввести», а в сочетании с абстрактным существительным естественное русское «установить» передаёт наступление нового непреходящего состояния. Множественная форма עֹלָמִים выражает длительность и постоянство.
- source_word: וְלַחְתֹּם חָזוֹן וְנָבִיא
  choice: запечатать видение и пророка
  rationale: Масоретский текст содержит конкретное נָבִיא, «пророк», а не отвлечённое «пророчество». Необычная формулировка сохранена, чтобы не исправлять исходный текст интерпретацией; альтернатива отмечена в сноске.
- source_word: וְלִמְשֹׁחַ
  choice: помазать
  rationale: משׁח — обычный глагол для обрядового помазания; прямой русский эквивалент сохраняет его смысл без поясняющего расширения.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: Святое святых
  rationale: Устойчивое русское библейское выражение передаёт еврейскую превосходную конструкцию и допускает отнесение к святейшему месту или предмету. Возможное личное прочтение вынесено в сноску.
theological_decisions:
- issue: Референт קֹדֶשׁ קָדָשִׁים
  choice: Святое святых
  alternative: нечто самое святое; святейший; самое святое место
  rationale: Еврейское выражение обычно относится к святейшему месту или священному предмету, но само по себе не уточняет референт окончательно. Формула «Святое святых» сохраняет сакральный смысл и не вводит в основной текст однозначное мессианское отождествление.
- issue: Характер семидесяти שָׁבֻעִים
  choice: семьдесят седмиц
  alternative: семьдесят семилетий; семьдесят периодов по семь
  rationale: Исходное слово называет единицы из семи, но данный стих прямо не добавляет слово «годы». Поэтому основной текст не превращает распространённое толкование в явное содержание еврейской фразы.
- issue: Значение запечатывания видения и пророка
  choice: сохранить метафору «запечатать» и конкретное «пророка»
  alternative: завершить или подтвердить видение и пророчество
  rationale: חתם может подразумевать закрытие, завершение или удостоверение, а נָבִיא по масоретской огласовке означает «пророк». Перевод сохраняет обе напряжённости, не выбирая без необходимости один богословский смысл.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. «Седмицы» и «Святое святых» оставлены как понятные традиционные термины, поскольку они точно сохраняют форму и неоднозначность оригинала; синтаксис упрощён до ясного ряда целевых инфинитивов.
