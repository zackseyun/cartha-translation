base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/018.yaml
  text: Incline your ear[a], my God, and hear; open your eyes and see our desolations and the city that is called by your name. For we are not presenting our pleas before you because of our righteousnesses[b], but because of your abundant mercies.
translation:
  language: ru
  text: Склони ухо Твоё, Боже мой, и услышь; открой глаза Твои и увидь наши разорённые места и город, носящий Твоё имя[a]. Ибо мы повергаем перед Тобою наши мольбы не потому, что у нас есть праведные дела[b], а по Твоему великому милосердию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «город, над которым наречено Твоё имя»; еврейское выражение указывает на особую связь города с Богом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наши праведности»; вероятно, имеются в виду праведные дела или притязания на собственную праведность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Склони ухо Твоё
  rationale: Сохраняет повелительную форму и телесный образ еврейской молитвенной речи; «склони» звучит возвышенно, но понятно современному читателю.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Естественная русская форма прямого обращения с суффиксом первого лица единственного числа.
- source_word: פְּקַחָה עֵינֶיךָ וּרְאֵה
  choice: открой глаза Твои и увидь
  rationale: Сохраняет множественное число «глаза», повелительные формы и параллелизм с призывом услышать.
- source_word: שֹׁמְמֹתֵינוּ
  choice: наше запустение
  rationale: Передаёт состояние разорения и оставляет в поле зрения как бедственное положение народа, так и опустошённые места; буквальное множественное число по-русски звучало бы неестественно.
- source_word: אֲשֶׁר נִקְרָא שִׁמְךָ עָלֶיהָ
  choice: над которым наречено имя Твоё
  rationale: Сохраняет образ исходной идиомы — имя призывается или нарекается над городом — и выражаемую ею принадлежность Богу.
- source_word: מַפִּילִים תַּחֲנוּנֵינוּ לְפָנֶיךָ
  choice: Мы повергаем наши мольбы пред Тобою
  rationale: Передаёт идиоматический смысл принесения прошения и одновременно сохраняет образ «повергать» из каузативной формы נפל; «пред Тобою» поддерживает молитвенный регистр.
- source_word: לֹא עַל צִדְקֹתֵינוּ
  choice: полагаясь не на свои праведные дела
  rationale: Множественное צִדְקוֹת понимается как праведные поступки или основания для притязания на праведность. Формулировка естественна по-русски и ясно выражает основание прошения.
- source_word: עַל רַחֲמֶיךָ הָרַבִּים
  choice: а на Твоё великое милосердие
  rationale: Русское собирательное «милосердие» естественно передаёт множественное רַחֲמִים, а «великое» выражает его обилие и силу без неестественного буквального множественного числа.
theological_decisions:
- issue: Антропоморфные образы Божьего уха и глаз
  choice: 'Сохранены прямо: «Склони ухо Твоё» и «открой глаза Твои»'
  alternative: 'Истолковывающая передача: «внемли» и «обрати внимание»'
  rationale: Исходный текст намеренно использует телесные образы в молитвенном обращении; их сохранение передаёт риторику текста, не утверждая ограниченности Бога.
- issue: Основание молитвенного обращения
  choice: Просители полагаются не на свои праведные дела, а на Божье великое милосердие
  alternative: Обобщённая передача через отсутствие человеческих заслуг без отражения множественного צִדְקוֹת
  rationale: Так сохраняется явное противопоставление человеческой праведности и Божьего милосердия без добавления конфессионально обусловленного толкования.
- issue: Божье имя, наречённое над городом
  choice: Сохранена исходная идиома с пояснением в сноске
  alternative: «город, который носит Твоё имя»
  rationale: Более буквальный образ сохраняет оттенки принадлежности, покровительства и связи города с Богом, не сводя их к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Формы «Боже мой», «пред Тобою» и «наречено имя Твоё» поддерживают достоинство текста, оставаясь понятными; синтаксис сделан естественным для русского языка, а исходные метафоры и богословское противопоставление сохранены.
