base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/023.yaml
  text: At the beginning of your pleas[a], a word went out, and I have come to tell it, because you are greatly beloved[b]. So consider the word and understand the vision.
translation:
  language: ru
  text: В начале твоих молений было дано слово[a], и я пришёл возвестить его, потому что ты весьма дорог[b]. Поэтому вникни в слово и пойми видение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «было отдано повеление»; также возможно: «была дана весть». Буквально: «вышло слово»; еврейское выражение может обозначать сообщение или отданное повеление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты горячо любим»; также возможно: «ты высоко ценим». Еврейское выражение указывает, что Даниил особенно дорог и ценен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת תַּחֲנוּנֶיךָ
  choice: В самом начале твоих молений
  rationale: Передаёт временную точку начала и сохраняет смысл усердных молитвенных прошений; «молений» звучит современно, достойно и уместно в молитвенном контексте.
- source_word: יָצָא דָבָר
  choice: вышло слово
  rationale: 'Сохраняет конкретный образ и лексическую неопределённость еврейского выражения: речь может идти о сообщении, повелении или решении.'
- source_word: וַאֲנִי בָּאתִי לְהַגִּיד
  choice: и я пришёл возвестить его
  rationale: «Возвестить» передаёт цель прихода в возвышенном, но понятном регистре; местоимение «его» естественно отсылает к ранее упомянутому слову.
- source_word: חֲמוּדוֹת אָתָּה
  choice: ты весьма дорог
  rationale: Передаёт особую ценность Даниила и допускает как оттенок любви, так и высокой оценки, не сводя выражение только к одному из них.
- source_word: וּבִין בַּדָּבָר
  choice: Поэтому вникни в это слово
  rationale: «Вникни» естественно выражает призыв обдумать и постичь сказанное; «слово» сохраняет связь с первым употреблением דָבָר.
- source_word: וְהָבֵן בַּמַּרְאֶה
  choice: и пойми видение
  rationale: Прямо передаёт повеление понять показанное в откровении; в контексте Даниила מַרְאֶה обозначает видение.
theological_decisions:
- issue: Смысл выражения חֲמוּדוֹת אָתָּה о положении Даниила перед Богом
  choice: ты весьма дорог
  alternative: ты горячо любим; ты высоко ценим
  rationale: Выбранная формулировка сохраняет одновременно личностный оттенок любви и значение особой ценности, не вводя дополнительных доктринальных выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор слова דָבָר и неопределённость выражения о том, что Даниил «весьма дорог». Все сноски привязаны к соответствующим словам основного текста.
