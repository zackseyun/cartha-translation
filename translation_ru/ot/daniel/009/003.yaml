base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/003.yaml
  text: So I turned my face to the Lord God[a], to seek prayer and pleas for mercy, with fasting, sackcloth[b], and ashes.
translation:
  language: ru
  text: И я обратил лицо к Господу Богу[a], чтобы обратиться с молитвой и мольбами, с постом, во вретище[b] и пепле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «направил» или «устремил своё лицо к Господу Богу». Этот еврейский оборот выражает сосредоточенное, решительное обращение к кому-либо.'
    reason: lexical_alternative
  - marker: b
    text: Вретище — грубая ткань или одежда из неё, которую носили в знак скорби, смирения и покаяния.
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת־פָּנַי
  choice: я обратил лицо
  rationale: Буквально оборот означает «дал/направил своё лицо» и выражает сознательную направленность и решимость. «Обратил лицо» естественно по-русски и сохраняет конкретный образ оригинала.
- source_word: אֶל אֲדֹנָי הָאֱלֹהִים
  choice: к Господу Богу
  rationale: אֲדֹנָי здесь является титулом «Господь», а не именем יהוה; הָאֱלֹהִים передано словом «Бог».
- source_word: לְבַקֵּשׁ
  choice: чтобы искать Его
  rationale: Инфинитив выражает цель. Объект в еврейском тексте не назван прямо, но по контексту подразумевается Господь Бог; местоимение делает русский текст естественным, а неоднозначность конструкции отмечена в сноске.
- source_word: תְּפִלָּה וְתַחֲנוּנִים
  choice: в молитве и мольбах
  rationale: תְּפִלָּה — общее обозначение молитвы, тогда как תַחֲנוּנִים обозначает настойчивые смиренные просьбы о милости. Предлог «в» передаёт молитву и мольбы как способ искания Бога.
- source_word: בְּצוֹם
  choice: с постом
  rationale: Предлог ב обозначает сопутствующее обстоятельство; «с постом» ясно передаёт практику воздержания.
- source_word: וְשַׂק
  choice: во вретище
  rationale: «Вретище» — закрепившееся в русском библейском языке название грубой ткани, носимой в знак скорби и покаяния; значение поясняется в сноске.
- source_word: וָאֵפֶר
  choice: и пепле
  rationale: Пепел служил знаком скорби, уничижения и покаяния; форма согласована с рядом сопутствующих обстоятельств.
theological_decisions:
- issue: Передача Божьего титула אֲדֹנָי הָאֱלֹהִים
  choice: Господь Бог
  alternative: Господь, Бог
  rationale: В тексте стоит אֲדֹנָי, а не יהוה, поэтому употреблён титул «Господь» без типографического обозначения передачи Божьего имени.
- issue: Неявный объект глагола לְבַקֵּשׁ
  choice: искать Его в молитве и мольбах
  alternative: обратиться с молитвой и мольбами / искать молитвы и мольбы
  rationale: Контекст обращения лица к Господу естественно указывает на Бога как подразумеваемый объект. При этом еврейская конструкция допускает понимание молитвы и мольбы как содержания или средства искания, поэтому альтернативная передача дана в сноске без устранения напряжения текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены конкретный образ обращённого лица и традиционный термин «вретище», но последний пояснён для современного читателя. Формулировка не привносит конфессионально специфического толкования.
