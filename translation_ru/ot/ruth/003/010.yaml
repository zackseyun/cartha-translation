base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: ru
  text: 'Он сказал: «Да благословит тебя Яхве, дочь моя! Твоя нынешняя доброта[a] превзошла прежнюю: ты не пошла за юношами — ни бедными, ни богатыми».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность», «преданная любовь» или «заветная верность». Еврейское слово חֶסֶד обозначает деятельную, неизменную доброту и преданность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: Да благословит тебя Яхве
  rationale: Предикативная форма в контексте выражает благословение-пожелание; по-русски естественно передаётся конструкцией «Да благословит тебя…».
- source_word: בִּתִּי
  choice: дочь моя
  rationale: Сохраняет тёплое обращение старшего к младшей и его семейно-социальный оттенок.
- source_word: הֵיטַבְתְּ ... הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: Этой последней ... ты превзошла прежнюю
  rationale: Передаёт сравнительный смысл глагола и противопоставление нынешнего поступка Руфи прежнему, не утяжеляя русскую фразу.
- source_word: חַסְדֵּךְ
  choice: своей верностью
  rationale: В данном контексте речь идёт о деятельной преданности Руфи Ноемини и семье умершего; «верность» лучше, чем общее «доброта», выражает устойчивый relationalный смысл חֶסֶד, не сводя его исключительно к формальному завету.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: ты не стала искать
  rationale: Естественно передаёт объясняющий оборот и брачный контекст идиомы «идти за» кем-либо.
- source_word: הַבַּחוּרִים
  choice: молодых мужчин
  rationale: Прямо обозначает потенциальных молодых брачных партнёров; «юношей» могло бы создать слишком юный возрастной оттенок.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: ни бедных, ни богатых
  rationale: В отрицательной русской конструкции парное «ни ... ни ...» естественно передаёт охват всех имущественных возможностей.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Значение חֶסֶד в похвале Руфи
  choice: верность
  alternative: доброта; преданная любовь; заветная верность
  rationale: Контекст подчёркивает не просто добрый поступок, а преданность семье Ноемини и роду умершего. При этом примечание сохраняет более широкий диапазон слова и не навязывает узко заветное толкование.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное божественное имя; транслитерация сохраняет это различие.
- issue: Отношение «последней» верности к «прежней»
  choice: нынешний поступок Руфи назван превосходящим прежний
  alternative: она проявила последнюю верность лучше первой
  rationale: Сохраняется сравнительная оценка Вооза без уточнения в самом стихе, какой именно прежний поступок он имеет в виду.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Благословение передано естественной формулой; синтаксис слегка перестроен ради ясности. Формулировка не уточняет сверх текста, кому именно была оказана прежняя и последняя верность.
