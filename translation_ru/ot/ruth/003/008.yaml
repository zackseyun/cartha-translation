  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: ru
  text: В полночь мужчина вздрогнул и повернулся[a] — и вот у его ног[b] лежала женщина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изогнулся», «резко переменил положение». Еврейский глагол редок, и точный характер движения неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у его ступней»; еврейское выражение может обозначать также область у ног или их нижней части.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: В полночь
  rationale: Отдельное соответствие формуле וַיְהִי опущено ради естественного русского повествования; последовательность событий передана началом нового предложения.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: в полночь
  rationale: Естественно и кратко передаёт буквальное «в середине ночи».
- source_word: וַיֶּחֱרַד
  choice: вздрогнул
  rationale: Передаёт внезапную телесную реакцию, не уточняя без необходимости, была ли её причиной именно боязнь.
- source_word: הָאִישׁ
  choice: мужчина
  rationale: В данном контексте אִישׁ обозначает Вооза как мужчину; такой перевод конкретнее русского «человек» и не приписывает ему статус мужа.
- source_word: וַיִּלָּפֵת
  choice: повернулся
  rationale: Редкий глагол описывает движение тела, но его точный характер неясен; нейтральный перевод не конкретизирует движение сверх исходного текста.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет значение внезапного обнаружения и повествовательный акцент.
- source_word: אִשָּׁה
  choice: женщина
  rationale: Прямое контекстуальное значение существительного без ошибочного значения «жена».
- source_word: שֹׁכֶבֶת
  choice: лежала
  rationale: Передаёт продолжающееся положение женщины в момент, когда мужчина её обнаружил.
- source_word: מַרְגְּלֹתָיו
  choice: у его ног
  rationale: Естественно передаёт местоположение; выражение может охватывать область ступней или нижней части ног, что отмечено в сноске.
theological_decisions:
- issue: Возможное сексуальное или эвфемистическое прочтение сцены
  choice: Прямо сказать, что женщина лежала у ног Вооза.
  alternative: Использовать более расплывчатое или эвфемистическое выражение «у нижней части его ног», подчёркивая возможный намёк.
  rationale: Еврейский текст прямо не описывает полового действия. Перевод сохраняет напряжённость сцены, но не вносит в неё отсутствующего в тексте нравственного или сексуального суждения; диапазон значения обозначения места отражён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным оборотом «и вот». Тире передаёт резкий переход к неожиданному обнаружению. Архаизмы и конфессионально окрашенные формулы не используются.
