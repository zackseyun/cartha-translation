base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: ru
  text: 'Он спросил: «Кто ты?» Она ответила: «Я Руфь, твоя служанка. Простри своё крыло над своей служанкой[a], ведь ты — искупитель[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Накрой свою служанку краем своей одежды». Еврейское слово может означать и «крыло», и край одежды; этот образ может также намекать на покровительство и брачный союз.'
    reason: lexical_alternative
  - marker: b
    text: То есть родственник-искупитель — близкий родственник, который мог действовать в интересах своего родича, в том числе для восстановления его положения.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: твоя служанка / своей служанкой
  rationale: Слово обозначает женщину-служанку и здесь служит смиренным самообозначением Руфи. «Служанка» естественно звучит по-русски и сохраняет повтор исходного слова.
- source_word: וּפָרַשְׂתָּ
  choice: простри
  rationale: Глагол означает протянуть или распростереть что-либо над кем-либо. «Простри» сохраняет конкретный образ и соответствует достоинству речи, оставаясь понятным современному читателю.
- source_word: כְנָפֶךָ
  choice: своё крыло
  rationale: Слово прежде всего означает «крыло», но может также обозначать край одежды. Основной текст сохраняет образ крыла и его связь с защитой, а возможный смысл края одежды поясняется в сноске.
- source_word: עַל
  choice: над
  rationale: Предлог естественно передаёт положение покрывающего крыла по отношению к служанке.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание просьбы Руфи. «Ведь» естественно для прямой речи и ясно выражает причинную связь.
- source_word: גֹאֵל
  choice: искупитель
  rationale: Термин обозначает родственника, имеющего признанное семейно-правовое право и обязанность выкупать или восстанавливать положение родича. «Искупитель» сохраняет ключевой краткий термин, а родственный аспект разъясняется в сноске.
- source_word: אָנֹכִי רוּת
  choice: Я Руфь
  rationale: Безглагольное представление естественно передаётся по-русски именной конструкцией «Я Руфь».
- source_word: מִי אָתּ
  choice: Кто ты?
  rationale: Прямой и естественный перевод вопроса о личности говорящей.
theological_decisions:
- issue: Образ «твоего крыла» в просьбе Руфи
  choice: Сохранить «крыло» в основном тексте, не сводя образ только к брачному жесту или краю одежды.
  alternative: «Накрой свою служанку краем своей одежды».
  rationale: Еврейское слово допускает намеренное сочетание образов края одежды, покровительства и крыла. Буквальный образ сохраняет литературную и богословскую многозначность.
- issue: Передача גֹאֵל
  choice: «Искупитель» в основном тексте с пояснением родственно-правовой роли в сноске.
  alternative: «Родственник-искупитель» или «родовой заступник».
  rationale: Краткое «искупитель» сохраняет ключевую лексику и не перегружает реплику пояснением; существенная для книги Руфь семейная сторона значения раскрыта в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но понятной речью. «Простри» поддерживает достоинство библейского диалога без архаизации; «ведь» делает причинное пояснение естественным. Все сноски привязаны к соответствующим словам основного текста.
