  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: ru
  text: Когда он ляжет, заметь место, где он будет лежать. Потом подойди, открой ему ноги[a] и ляг[b]. Он скажет тебе, что делать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открой то, что у его ног». Еврейское слово может обозначать ноги, место у ног или нижнюю часть тела лежащего человека.'
    reason: lexical_alternative
  - marker: b
    text: В записанном еврейском тексте стоит форма «и я лягу», но традиционное чтение и контекст дают смысл «и ты ляг».
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: Когда он ляжет
  rationale: Конструкция вводит следующий этап наставления и имеет временное значение; по-русски естественно передаётся придаточным времени.
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: заметь место
  rationale: ידע здесь означает внимательно определить и запомнить место, а не просто абстрактно «знать».
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: где он лёг
  rationale: Относительное придаточное обозначает выбранное Воозом место для сна; форма совершенного вида естественна в последовательности будущих действий.
- source_word: וּבָאת
  choice: Потом подойди
  rationale: בוא допускает значения движения «прийти/подойти»; «подойди» ясно передаёт приближение Руфи к месту, где лежит Вооз.
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: открой у его ног
  rationale: מרגלות может обозначать не только сами ступни, но и место у ног или нижнюю часть лежащего человека. Формулировка сохраняет предметную неоднозначность и не добавляет отсутствующего в еврейском тексте прямого дополнения вроде «покрывало».
- source_word: וְשָׁכָבְתִּי / וְשָׁכַבְתְּ
  choice: и ложись
  rationale: Контекст и масоретское чтение обращены к Руфи во 2-м лице женского рода; повелительная русская форма естественно продолжает наставление.
- source_word: וְהוּא יַגִּיד לָךְ
  choice: Он скажет тебе
  rationale: נגד в породе hифиль обычно означает «сообщить, сказать»; отдельное местоимение слегка подчёркивает, что дальнейшее указание даст сам Вооз.
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: что делать
  rationale: Русский инфинитив после «скажет тебе» естественно выражает предписание, не превращая его в простое предсказание будущего.
theological_decisions:
- issue: Возможный сексуальный подтекст указания открыть место у ног Вооза и лечь
  choice: Сохранить буквальную, но неоднозначную формулировку, не представляя поступок ни явно сексуальным, ни заведомо невинным.
  alternative: Истолковать выражение как сексуальный эвфемизм либо как чисто практический способ разбудить Вооза.
  rationale: Еврейский рассказ допускает напряжённость и двусмысленность; перевод не должен разрешать её без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык; наставление передано кратко и достойно. Выражение «открой у его ног» намеренно не уточняет, что именно открывает Руфь, и тем самым сохраняет неоднозначность исходного текста.
