- source_word: וַתֹּאמֶר
  choice: Тогда ... сказала
  rationale: Вав с последовательной формой глагола развивает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: נָעֳמִי
  choice: Ноеминь
  rationale: Использована традиционная русская библейская форма имени, понятная современному читателю.
- source_word: חֲמוֹתָהּ
  choice: её свекровь
  rationale: Существительное с суффиксом 3-го лица женского рода обозначает родство Ноемини с Руфью.
- source_word: בִּתִּי
  choice: Дочь моя
  rationale: Сохранено буквальное ласковое семейное обращение без добавочного усиления.
- source_word: הֲלֹא אֲבַקֶּשׁ
  choice: не поискать ли мне
  rationale: Такая конструкция естественно передаёт риторический вопрос, предполагающий согласие, и намерение Ноемини действовать ради Руфи.
- source_word: מָנוֹחַ
  choice: пристанище
  rationale: Слово обозначает покой либо место устойчивого и безопасного устроения. «Пристанище» сохраняет пространственную метафору и не вводит брак непосредственно в основной текст.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: где тебе будет хорошо
  rationale: Передаёт желаемое благополучие Руфи и естественно связывает его с найденным пристанищем, не сужая смысл до одной лишь материальной выгоды.
