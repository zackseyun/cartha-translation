source:
  edition: WLC
  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: ru
  text: Останься здесь на ночь. А утром, если он выкупит тебя[a], — хорошо, пусть выкупит. Если же он не захочет выкупить тебя, я сам выкуплю тебя — жив Яхве! Лежи до утра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «выкупить» означает исполнить семейно-правовую обязанность родича-искупителя.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: Переночуй здесь этой ночью
  rationale: Глагол לון означает провести ночь, переночевать. «Переночуй» естественно и точно передаёт смысл; «здесь» проясняет подразумеваемое контекстом место, а «этой ночью» соответствует הַלַּיְלָה.
- source_word: אִם יִגְאָלֵךְ
  choice: если он выкупит тебя
  rationale: Глагол גאל обозначает действие родича-искупителя в семейно-правовом контексте. «Выкупит» сохраняет повтор ключевого корня и тему искупления, а специальный правовой смысл поясняется в сноске.
- source_word: טוֹב יִגְאָל
  choice: хорошо, пусть выкупит
  rationale: 'Краткое טוֹב выражает одобрение возможного исхода, а יִגְאָל после него имеет разрешительно-утвердительный оттенок: Вооз принимает первоочередное право другого родича.'
- source_word: לֹא יַחְפֹּץ לְגָאֳלֵךְ
  choice: не захочет выкупить тебя
  rationale: חפץ передаёт желание или готовность. Современное «не захочет» естественно выражает волевой смысл без его усиления.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: я сам выкуплю тебя
  rationale: Отдельное местоимение אָנֹכִי при уже выраженном в глаголе лице подчёркивает личное обязательство Вооза; это передано словами «я сам».
- source_word: חַי יְהוָה
  choice: жив Яхве!
  rationale: Сохранена краткая древнееврейская формула клятвы и личное имя Бога. Восклицательный знак помогает современному читателю распознать торжественную силу выражения.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: Лежи до утра
  rationale: По контексту Руфь уже лежит, поэтому «лежи», а не «ложись», точно передаёт повеление оставаться на месте до утра.
theological_decisions:
- issue: Семейно-правовой смысл корня גאל
  choice: В основном тексте последовательно употреблено «выкупить», а роль родича-искупителя пояснена в сноске.
  alternative: «Исполнить долг родича-искупителя» или «стать твоим родичем-искупителем».
  rationale: Краткое «выкупить» сохраняет лексический повтор и богословскую тему искупления, не сводя текст к одной поздней доктринальной трактовке. Сноска сообщает необходимый семейно-правовой фон.
- issue: Передача имени יְהוָה в формуле клятвы
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, то есть личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие.
- issue: Сила выражения טוֹב יִגְאָל
  choice: «хорошо, пусть выкупит» как одобрение и признание права другого родича
  alternative: «тогда он выкупит» как простое предсказание
  rationale: Эллиптическое טוֹב оставляет фразу предельно краткой, а следующий глагол естественно понимается как принятие этого исхода. Перевод не приписывает Воозу сопротивления или скрытого условия.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Сохранены краткость, повтор глагола «выкупить» и напряжение между преимущественным правом другого родича и клятвенным обещанием Вооза. Формула «жив Яхве» намеренно имеет библейскую торжественность, но остаётся понятной по контексту.
