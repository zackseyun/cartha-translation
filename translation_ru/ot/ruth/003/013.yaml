  source_fidelity: 'Смысл передан точно: повеление остаться на ночь, условие о более близком родиче, одобрительное «хорошо», обещание Вооза и клятва сохранены. Однако «Переночуй здесь этой ночью» стилистически тавтологично: значение «ночью» уже заключено в «переночуй». Сноска чрезмерно конкретизирует лексему, называя родича «ближайшим», хотя это уточнение находится в контексте (Руфь 3:12), а не в самом слове גאל и не в данном стихе.'
