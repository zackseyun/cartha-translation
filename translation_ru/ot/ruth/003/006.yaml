  text: И она спустилась на гумно и сделала всё, что велела ей свекровь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: пошла
  rationale: Глагол ירד буквально обозначает движение вниз. В данном контексте естественное русское «пошла на гумно» передаёт перемещение к месту действия; буквальное «спустилась» без известного русскому читателю рельефа звучало бы несколько искусственно.
- source_word: הַגֹּרֶן
  choice: на гумно
  rationale: גֹּרֶן — площадка, где молотили и веяли зерно. Традиционное русское «гумно» точно называет это место и подходит к историко-аграрному контексту.
- source_word: וַתַּעַשׂ
  choice: и сделала
  rationale: Обычное значение עשה — «делать». В сочетании с последующим оборотом русское «сделала всё, как…» естественно и точно передаёт исполнение указаний.
- source_word: כְּכֹל אֲשֶׁר
  choice: всё, как
  rationale: Оборот выражает полное соответствие данным ранее указаниям. Формулировка «сделала всё, как» сохраняет значение всеохватности כֹל и звучит естественно по-русски.
- source_word: צִוַּתָּה
  choice: велела
  rationale: צוה имеет силу распоряжения или повеления. «Велела» сохраняет эту силу, но в семейном повествовательном контексте звучит естественнее, чем более официальное «приказала».
- source_word: חֲמוֹתָהּ
  choice: ей свекровь
  rationale: חמות обозначает мать мужа, то есть свекровь; местоименное значение суффикса естественно передано русским «ей».
- source_word: וַ
  choice: И
  rationale: Начальный waw продолжает последовательное повествование. Союз «И» непосредственно сохраняет эту связь с предыдущим стихом.
