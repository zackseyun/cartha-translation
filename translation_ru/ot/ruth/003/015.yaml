  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: ru
  text: 'Тогда он сказал: «Подай сюда накидку, которая на тебе, и держи её». Она взялась за неё, а он отмерил шесть мер ячменя[a] и положил их на неё. Затем он пошёл в город[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шесть ячменя»; единица измерения в еврейском тексте не названа.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых древних переводах и во многих переводах: «Затем она пошла в город». В масоретском тексте: «Затем он пошёл в город».'
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: Подай сюда
  rationale: Женская форма повелительного наклонения в данном контексте выражает просьбу подать Воозу предмет; «подай сюда» естественно передаёт направленность действия.
- source_word: הַמִּטְפַּחַת
  choice: накидку
  rationale: Слово обозначает предмет одежды или покрывало, достаточно большое, чтобы нести в нём зерно. «Накидка» не создаёт ошибочного образа лёгкой лицевой вуали.
- source_word: וְאֶחֳזִי בָהּ
  choice: и держи её
  rationale: Глагол אחז означает «держать, схватить». Формулировка сохраняет прямой смысл, не добавляя отсутствующего в еврейском тексте указания раскрыть или растянуть ткань.
- source_word: וַיָּמָד
  choice: отмерил
  rationale: Передаёт намеренное измерение и выделение определённого количества зерна.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: шесть мер ячменя
  rationale: Буквально в еврейском тексте — «шесть ячменя»; единица измерения не названа. Слово «мер» добавлено как минимально необходимое пояснение без необоснованного уточнения объёма.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: и возложил это на неё
  rationale: Сохраняет образ груза, помещённого на Руфь для переноски, и не вводит отсутствующего в тексте уточнения «на плечи».
- source_word: וַיָּבֹא הָעִיר
  choice: Затем он пошёл в город
  rationale: В масоретском тексте употреблён глагол мужского рода, поэтому основным субъектом оставлен Вооз; вариант с Руфью отмечен в сноске.
theological_decisions:
- issue: Субъект заключительной фразы וַיָּבֹא הָעִיר
  choice: Затем он пошёл в город
  alternative: Затем она пошла в город
  rationale: Это текстологическая и повествовательная неоднозначность, а не доктринальный вопрос. Основной текст следует масоретскому чтению с формой мужского рода, а древний вариант с женским субъектом сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Устаревшие названия одежды и чрезмерно конкретные реконструкции меры объёма исключены; синтаксис остаётся ясным для обычного читателя.
