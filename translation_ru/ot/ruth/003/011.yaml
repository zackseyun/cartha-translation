lexical_decisions:
- source_word: בִּתִּי
  choice: дочь моя
  rationale: Сохранено буквальное родственное обращение, которое здесь выражает тёплое, покровительственное отношение Вооза и не обязательно указывает на биологическое родство.
- source_word: אַל תִּירְאִי
  choice: не бойся
  rationale: Естественная и близкая к форме еврейского запрета передача, одновременно звучащая как ободрение.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: Всё, что ты скажешь, я сделаю для тебя
  rationale: Сохранён широкий смысл глагола «сказать» без сужения до «попросить», хотя в контексте речь идёт о просьбе Руфи.
- source_word: כָּל שַׁעַר עַמִּי
  choice: весь мой народ у городских ворот
  rationale: Еврейское «все ворота моего народа» метонимически обозначает людей, собиравшихся у ворот как в общественном и судебном центре. Русская формулировка раскрывает идиому, сохраняя образ ворот.
- source_word: אֵשֶׁת חַיִל
  choice: достойная женщина
  rationale: חַיִל охватывает достоинство, силу, доблесть, состоятельность и умелость. Выбранное выражение естественно по-русски и передаёт общественно признанные нравственные и практические достоинства Руфи, не сводя смысл к воинской доблести.
theological_decisions:
- issue: Передача характеристики אֵשֶׁת חַיִל
  choice: достойная женщина
  alternative: доблестная женщина; добродетельная женщина; женщина редких достоинств
  rationale: Выбор сохраняет широкую похвалу достоинствам, силе характера и безупречной репутации Руфи. Более узкое «добродетельная» может свести смысл только к нравственности, а «доблестная» в современном русском часто воспринимается как воинская характеристика.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общедоступным звучанием. Порядок слов «дочь моя» сохраняет достоинство библейской речи; древняя реалия ворот пояснена сноской.
