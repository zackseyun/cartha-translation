  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: ru
  text: А теперь, дочь моя, не бойся. Всё, что ты скажешь, я сделаю для тебя, ведь весь мой народ знает, что ты — достойная женщина[b].
  philosophy: optimal-equivalence
