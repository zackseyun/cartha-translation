base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: ru
  text: А теперь разве Вооз не наш родственник[a], с чьими работницами ты была[b]? Вот, этой ночью он будет веять ячмень на гумне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наш сородич». Еврейское слово может обозначать родственника или человека, связанного с семьёй или родом, а не просто знакомого.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с чьими служанками ты была». Еврейское слово может обозначать молодых женщин, работниц или служанок из хозяйства Вооза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт и соединительное וְ, и временно-дискурсивное עַתָּה, вводя следующий шаг в замысле Ноемини.
- source_word: הֲלֹא
  choice: разве… не
  rationale: Естественная русская форма риторического вопроса, предполагающего утвердительный ответ.
- source_word: מֹדַעְתָּנוּ
  choice: наш родственник
  rationale: В данном контексте слово указывает на родственную или родовую связь, а не просто на знакомство; современное «родственник» яснее архаичного «сородич».
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: со служанками которого ты была
  rationale: Сохраняет относительную конструкцию и связь Руфи с молодыми женщинами из хозяйства Вооза. «Служанки» естественно в контексте его работников, при этом возможная более широкая передача отмечена в сноске.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-привлекающую внимание функцию слова без архаичного «се».
- source_word: זֹרֶה
  choice: будет веять
  rationale: Причастная форма описывает намеченное или происходящее в ближайшее время действие; при указании «этой ночью» будущее время естественно по-русски.
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: веять ячмень на гумне
  rationale: 'Буквальная конструкция называет объектом «гумно ячменя», но по смыслу гумно выступает метонимически: веют ячмень, находящийся на гумне. Русская передача ясно выражает действие и место, не создавая впечатления, будто веют само гумно.'
- source_word: הַלָּיְלָה
  choice: этой ночью
  rationale: Естественно передаёт обстоятельственное указание времени — в предстоящую ночь.
