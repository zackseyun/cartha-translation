  language: ru
  text: 'Она сказала ей: «Всё, что ты скажешь, я сделаю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Она ответила
  rationale: Форма wayyiqtol от אמר продолжает повествование. В данном диалогическом контексте естественное русское «ответила» точно передаёт реплику Руфи в ответ на наставления Ноемини, не меняя её содержания.
- source_word: אֵלֶיהָ
  choice: ей
  rationale: Предлог אֶל с суффиксом 3-го лица женского рода единственного числа указывает на адресата речи; русское «ей» передаёт это кратко и естественно.
- source_word: כֹּל אֲשֶׁר
  choice: всё, что
  rationale: Сочетание выражает полноту, ограниченную относительным придаточным. «Всё, что» близко к еврейской конструкции и естественно для современного русского языка.
- source_word: תֹּאמְרִי
  choice: ты скажешь
  rationale: Имперфект qal 2-го лица женского рода единственного числа здесь относится к указаниям Ноемини; будущее время по-русски естественно сочетается с обещанием Руфи исполнить всё сказанное.
- source_word: אֶעֱשֶׂה
  choice: я сделаю
  rationale: Имперфект qal 1-го лица единственного числа выражает твёрдое намерение Руфи. «Я сделаю» прямо передаёт смысл, не добавляя отсутствующего в оригинале отдельного объекта.
