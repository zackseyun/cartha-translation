base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: ru
  text: Вооз поел и выпил, и на сердце у него стало весело[a]. Потом он пошёл и лёг у края вороха зерна. Тогда она тихо подошла, открыла ему ноги[b] и легла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ему стало радостно»; «он был в хорошем расположении духа». Еврейская идиома выражает весёлое, довольное состояние, но сама по себе не означает, что Вооз был пьян.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «открыла ему ноги». Одни понимают это как простое буквальное действие, другие усматривают возможный двусмысленный намёк. Сама еврейская формулировка сдержанна и прямо не описывает полового действия.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: поел
  rationale: Простой повествовательный глагол; совершенный вид естественно передаёт завершённое действие в русской последовательности событий.
- source_word: וַיֵּשְׁתְּ
  choice: выпил
  rationale: Прямая передача глагола «пить» без уточнения количества или степени опьянения, которых еврейский текст не указывает.
- source_word: וַיִּיטַב לִבּוֹ
  choice: на сердце у него стало весело
  rationale: Сохраняет образ еврейской идиомы и передаёт хорошее, радостное расположение духа, не утверждая опьянения.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: пошёл и лёг
  rationale: В данном повествовательном ракурсе בוא естественно передаётся глаголом движения «пошёл», а שׁכב означает лечь; текст не говорит прямо, что Вооз уснул.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: у края вороха зерна
  rationale: קצה обозначает край или конец, а עֲרֵמָה — кучу или ворох; контекст гумна позволяет естественно уточнить, что речь идёт о зерне.
- source_word: בַלָּט
  choice: тихо
  rationale: Передаёт скрытность и бесшумность приближения, не добавляя оценки намерений Руфи.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: открыла его ноги
  rationale: По возможности прямо сохраняет сдержанную еврейскую формулировку о раскрытии области ног и не превращает её в явное описание соблазнения или полового действия.
- source_word: וַתִּשְׁכָּב
  choice: легла
  rationale: Прямая передача глагола «лечь»; сексуальный смысл не добавляется, поскольку сам стих его прямо не выражает.
theological_decisions:
- issue: Следует ли явно придавать действиям Руфи сексуальный смысл
  choice: 'Оставить буквальное и сдержанное описание: она открыла ноги Вооза и легла.'
  alternative: Передать действия как соблазнение или половой контакт.
  rationale: Еврейский текст допускает обсуждение возможного подтекста, но прямо сообщает лишь о тихом приближении, открытии ног и о том, что Руфь легла. Перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с ясным повествовательным ритмом. Выражение «на сердце у него стало весело» сохраняет библейский образ, оставаясь понятным; «ворох зерна» естественно обозначает сложенное на гумне зерно. Формулировки не усиливают возможный сексуальный подтекст и не устраняют его интерпретационную возможность.
