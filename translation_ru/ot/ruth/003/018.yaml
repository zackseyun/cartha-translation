base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: ru
  text: 'Она сказала: «Подожди, дочь моя, пока не узнаешь, чем кончится это дело[a]. Этот человек[b] не успокоится, пока сегодня не доведёт дело до конца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как падёт дело», то есть «как оно обернётся».'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о Воозе, хотя еврейский текст здесь не называет его по имени.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁבִי
  choice: Подожди
  rationale: Буквально глагол означает «сиди» или «оставайся», но в данном контексте Ноеминь призывает Руфь спокойно ждать исхода; «подожди» естественно передаёт прагматический смысл.
- source_word: בִתִּי
  choice: дочь моя
  rationale: Сохранены и ласковое семейное обращение, и явно выраженное в еврейском тексте притяжательное значение.
- source_word: תֵּדְעִין
  choice: не узнаешь
  rationale: 'Здесь ידע обозначает будущее получение знания: Руфь должна ждать, пока исход не станет ей известен.'
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: чем кончится это дело
  rationale: Еврейский оборот буквально говорит о том, «как падёт дело»; русская формулировка естественно передаёт вопрос о конечном исходе, а буквальный образ отмечен в сноске.
- source_word: הָאִישׁ
  choice: этот человек
  rationale: Определённое существительное по контексту указывает на Вооза, но перевод не подставляет его имя, поскольку в еврейском тексте оно здесь не названо.
- source_word: יִשְׁקֹט
  choice: не успокоится
  rationale: 'Передаёт значение бездействия или покоя: Вооз не остановится, пока не завершит дело.'
- source_word: כִּי אִם
  choice: пока не
  rationale: 'В отрицательной конструкции естественно передаёт ограничительно-условный смысл: человек не успокоится до завершения дела.'
- source_word: כִּלָּה הַדָּבָר
  choice: не доведёт дело до конца
  rationale: Сохраняет основное значение כלה — закончить, завершить — и естественно звучит применительно к предстоящему решению вопроса.
- source_word: הַיּוֹם
  choice: ещё сегодня
  rationale: Передаёт временное указание и подчёркивает уверенность Ноемини, что дело будет завершено в тот же день.
