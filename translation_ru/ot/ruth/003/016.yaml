base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: ru
  text: 'Когда Руфь пришла к свекрови, та спросила: «Кто ты, дочь моя?»[a] И Руфь рассказала ей обо всём, что сделал для неё этот человек.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «Как всё прошло, дочь моя?» Буквально по-древнееврейски: «Кто ты, дочь моя?» Возможно, Ноеминь спрашивает об исходе встречи или о том, изменилось ли положение Руфи.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא אֶל חֲמוֹתָהּ
  choice: Когда Руфь пришла к свекрови
  rationale: Повествовательная форма продвигает рассказ; придаточное с «когда» естественно связывает приход Руфи с последующим вопросом. Имя «Руфь» и отсутствие притяжательного местоимения устраняют неясность русских местоимений, не меняя референта.
- source_word: וַתֹּאמֶר
  choice: та спросила
  rationale: Глагол буквально означает «сказала», но прямая речь имеет форму вопроса; «спросила» естественно передаёт речевое действие, а «та» однозначно указывает на свекровь.
- source_word: מִי אַתְּ
  choice: Кто ты
  rationale: Сохранено буквальное и намеренно неоднозначное значение еврейского текста; возможный смысл вопроса об исходе встречи или изменившемся положении Руфи вынесен в сноску.
- source_word: בִּתִּי
  choice: дочь моя
  rationale: Сохраняет буквальное родственное обращение и тёплый тон Ноемини; порядок слов уместен для достойной современной русской речи.
- source_word: וַתַּגֶּד לָהּ
  choice: И Руфь рассказала ей
  rationale: Порода hифиль глагола נגד означает «сообщить, рассказать». Повтор имени делает субъект ясным в русском тексте.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לָהּ הָאִישׁ
  choice: обо всём, что сделал для неё тот человек
  rationale: «Обо всём» естественно передаёт полноту сообщения; לָהּ в данном контексте обозначает действие в её пользу, поэтому выбрано «для неё». «Тот человек» сохраняет употреблённое здесь обозначение без имени Вооза.
theological_decisions:
- issue: Смысл вопроса מִי אַתְּ
  choice: В основном тексте сохранено буквальное «Кто ты?»
  alternative: «Как всё прошло, дочь моя?» или «Кем ты теперь стала?»
  rationale: Контекст допускает вопрос об исходе встречи и, возможно, о новом статусе Руфи, однако еврейская формулировка остаётся открытой. Перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Буквальная необычность ключевого вопроса сохранена, а возможное контекстуальное толкование дано в сноске.
