base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: ru
  text: Вымойся[a], умастись и надень свою верхнюю одежду[b], а потом спустись на гумно[c]. Не показывайся этому человеку, пока он не закончит есть и пить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искупайся». Еврейский глагол может означать как мытьё, так и омовение всего тела.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «надень свою одежду». Еврейское слово обозначает одежду вообще или верхнее одеяние; понимание её как лучшей либо праздничной одежды является толкованием.'
    reason: lexical_alternative
  - marker: c
    text: 'Согласная форма еврейского текста здесь необычна; по контексту её обычно понимают как продолжение наставления Ноемини Руфи: «спустись на гумно».'
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: Вымойся
  rationale: Глагол רחץ обозначает мытьё или омовение тела; возвратная форма естественно передаёт обращённое к Руфи повеление.
- source_word: וָסַכְתְּ
  choice: умастись
  rationale: סוך означает натирать или помазывать тело маслом либо благовонием. «Умастись» точно и кратко сохраняет древнюю бытовую реалии без уточнения, что это были духи.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: надень свою верхнюю одежду
  rationale: שִׂמְלָה — одежда, часто верхнее одеяние. Перевод не добавляет отсутствующего в еврейском тексте значения «лучшая» или «праздничная» одежда.
- source_word: וירדתי הַגֹּרֶן
  choice: а потом спустись на гумно
  rationale: Несмотря на необычную согласную форму, контекст последовательных наставлений Ноемини поддерживает чтение как повеление Руфи во 2-м лице женского рода. גֹּרֶן передано традиционным и точным словом «гумно».
- source_word: אַל תִּוָּדְעִי לָאִישׁ
  choice: Не показывайся этому человеку
  rationale: Нифаль от ידע здесь означает не дать человеку узнать о своём присутствии. «Этому человеку» сохраняет указание на конкретного мужчину в контексте, не подставляя имя Вооза.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: пока он не закончит есть и пить
  rationale: Конструкция с כלה выражает завершение действий; русский оборот естественно передаёт временной предел.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Умастись» и «гумно» сохраняют культурно-историческую точность; синтаксис сделан ясным для современного читателя. Маркеры сносок поставлены непосредственно после соответствующих выражений.
