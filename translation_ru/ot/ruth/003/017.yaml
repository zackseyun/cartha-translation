  text: וַ/תֹּ֕אמֶר שֵׁשׁ הַ/שְּׂעֹרִ֥ים הָ/אֵ֖לֶּה נָ֣תַן לִ֑/י כִּ֚י אָמַ֣ר אַל תָּב֥וֹאִי רֵיקָ֖ם אֶל חֲמוֹתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: ru
  text: 'Она сказала: «Вот эти шесть мер ячменя он дал мне, потому что сказал: „Не возвращайся к своей свекрови с пустыми руками“».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эти шесть ячменей». Конкретная единица измерения в еврейском тексте не указана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Она сказала
  rationale: Нарративная форма вводит слова Руфи; союз וַ- в русском повествовании естественно не выражать отдельно.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: вот эти шесть мер ячменя
  rationale: В еврейском тексте буквально сказано «эти шесть ячменей», но единица измерения не названа. «Мер» восполняет подразумеваемое и сохраняет неопределённость конкретного объёма; «вот» естественно передаёт указательное значение הָאֵלֶּה.
- source_word: נָתַן לִי
  choice: он дал мне
  rationale: Перфект Qal 3 м. р. ед. ч. с объектным суффиксом 1 л. ед. ч. естественно передаётся русским прошедшим временем.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение причины, по которой Вооз дал ячмень.
- source_word: אָמַר
  choice: сказал
  rationale: Прошедшее время естественно вводит прямую речь Вооза внутри рассказа Руфи.
- source_word: אַל תָּבוֹאִי
  choice: Не возвращайся
  rationale: בוא обозначает движение к месту или лицу; в контексте речь идёт о возвращении Руфи к Ноемини. Такой перевод естественнее буквального «не приходи» и не меняет смысла.
- source_word: רֵיקָם
  choice: с пустыми руками
  rationale: Идиоматически выражает возвращение без дара или припасов.
- source_word: אֶל חֲמוֹתֵךְ
  choice: к своей свекрови
  rationale: חֲמוֹת означает «свекровь»; возвратное «своей» естественно в русской косвенно вложенной речи.
theological_decisions: []
