lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и соединительный союз, и переход к следующему положению в речи Вооза.
- source_word: כִּי אָמְנָם כִּי אִם
  choice: правда
  rationale: Передаёт подтверждение и уступительный оттенок конструкции без избыточного усиления; последующее «но» естественно выражает ограничение, вводимое второй частью стиха.
- source_word: גֹאֵל
  choice: родственник-искупитель
  rationale: Обозначает близкого родственника, наделённого признанными семейно-правовыми обязанностями по выкупу. Составное наименование точнее простого «искупитель» и не сводит роль лишь к степени родства.
- source_word: אָנֹכִי
  choice: я —
  rationale: Самостоятельное местоимение выражено явно; тире естественно оформляет именное сказуемое в русском языке.
- source_word: וְגַם יֵשׁ
  choice: но есть
  rationale: В контексте добавочная частица вводит обстоятельство, ограничивающее притязание Вооза. «Но есть» естественно передаёт этот контраст; наличие ещё одного родственника выражено самой конструкцией.
- source_word: קָרוֹב מִמֶּנִּי
  choice: ближе меня
  rationale: Сохраняет краткость и сравнительную форму оригинала; контекст и примечание поясняют, что речь идёт о более близком родстве, а не о расстоянии.
theological_decisions:
- issue: Значение גֹאֵל в семейно-правовом контексте
  choice: родственник-искупитель
  alternative: искупитель; родственник, имеющий право выкупа
  rationale: Речь идёт не об отвлечённом духовном искуплении, а об установленной семейной роли. Выбранное выражение сохраняет как идею родства, так и обязанность выкупа, не уточняя сверх текста весь объём прав и обязанностей.
- issue: Соотношение роли Вооза и более близкого родственника
  choice: Вооз признаёт себя родственником-искупителем, но указывает на более близкого родственника
  alternative: Вооз отрицает своё право на выкуп
  rationale: Текст одновременно утверждает статус Вооза и первенство другого родственника; перевод сохраняет это напряжение и не превращает его слова в отказ от собственной роли.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-сдержанным синтаксисом. Термин «родственник-искупитель» требует пояснения, но точно удерживает семейно-правовой смысл древнееврейского גֹאֵל. Маркеры примечаний поставлены непосредственно после поясняемых выражений.
