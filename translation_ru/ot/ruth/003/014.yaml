  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: ru
  text: И пролежала она у его ног до утра, а встала прежде, чем один человек мог узнать другого.[a] И он сказал:[b] «Пусть не станет известно, что женщина пришла на гумно».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Близко к буквальному: «прежде, чем человек мог узнать своего товарища». Это еврейское выражение означает, что при слабом свете люди ещё не могли различить друг друга.'
    reason: lexical_alternative
  - marker: b
    text: 'Судя по контексту, говорит Вооз, однако в еврейском тексте сказано только: «И он сказал».'
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: у его ног
  rationale: Передаёт место у ног Вооза естественным русским выражением, не добавляя деталей о позе или ложе.
- source_word: בטרום
  choice: прежде, чем
  rationale: Ясно выражает предшествование во времени и естественно вводит придаточное предложение.
- source_word: יכיר
  choice: мог узнать
  rationale: Передаёт значение узнавания или распознавания и подразумеваемую невозможность различить человека при слабом свете.
- source_word: איש את רעהו
  choice: один человек мог узнать другого
  rationale: 'Сохраняет единичную идиоматическую конструкцию оригинала, но звучит естественно и охватывает общий смысл: люди ещё не могли различить друг друга.'
- source_word: אל יוודע
  choice: Пусть не станет известно
  rationale: Сохраняет отрицательное пожелание или повеление и страдательный смысл еврейской формы.
- source_word: האשה
  choice: женщина
  rationale: В составе русского придаточного с союзом «что» определённость конкретной женщины понятна из контекста; форма «эта женщина» внесла бы лишний указательный оттенок.
- source_word: הגרן
  choice: гумно
  rationale: Традиционное и точное русское обозначение площадки для молотьбы; соответствует сельскохозяйственной реалии текста.
- source_word: ויאמר
  choice: И он сказал
  rationale: Сохраняет не названного прямо подлежащего мужского рода; контекст позволяет видеть в говорящем Вооза, не вставляя его имя в текст.
theological_decisions:
- issue: Кто говорит в ויאמר
  choice: «И он сказал» без имени Вооза в основном тексте.
  alternative: «И сказал Вооз» для большей ясности.
  rationale: Из контекста почти несомненно следует, что говорит Вооз, однако еврейский текст оставляет подлежащее невыраженным; перевод сохраняет эту особенность.
- issue: Возможный нравственный или сексуальный подтекст пребывания Руфи у ног Вооза
  choice: Пространственное описание «у его ног» без истолковывающих добавлений.
  alternative: Эвфемистическое указание на половую связь либо пояснение, прямо отрицающее её.
  rationale: Сам стих сообщает о месте и времени, не утверждая и не отрицая полового действия; перевод сохраняет повествовательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Гумно» сохранено как точный и узнаваемый термин; синтаксис сделан ясным для обычного современного читателя.
