  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: ru
  text: 'Она сказала: «Позволь мне, пожалуйста, подбирать колосья и собирать их среди снопов вслед за жнецами». С тех пор как она пришла, она здесь с самого утра и до сих пор; в укрытии она побыла лишь немного.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст последней части стиха труден для понимания. Возможно также: «Она лишь немного отдохнула в укрытии». Слово, переданное как «укрытие», буквально означает «дом» и здесь, вероятно, обозначает навес или помещение для работников.'
    reason: Сохраняет текстовую и смысловую неопределённость сжатой еврейской фразы и поясняет контекстуальное значение הַבַּיִת.
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: Позволь мне, пожалуйста, подбирать колосья
  rationale: Когортатив с частицей נָּא выражает почтительную просьбу. В данном земледельческом контексте לקט означает подбирать оставшиеся после жатвы колосья.
- source_word: וְאָסַפְתִּי
  choice: и собирать их
  rationale: Глагол отличён от לקט и передаёт собирание подобранного; местоимение «их» естественно связывает действие с колосьями.
- source_word: בָעֳמָרִים
  choice: между снопами
  rationale: עֳמָרִים — связанные снопы; предлог ב здесь естественно передаёт нахождение среди них.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: вслед за жнецами
  rationale: 'Сохраняется прежде всего пространственный смысл: Руфь подбирает колосья позади продвигающихся жнецов.'
- source_word: וַתָּבֹא וַתַּעֲמֹד
  choice: Она пришла и остаётся здесь
  rationale: Буквальное «пришла и стояла» в сочетании с последующим указанием времени описывает её продолжающееся пребывание; настоящее «остаётся» естественно передаёт длительность до момента речи.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: с самого утра до сих пор
  rationale: Передаёт непрерывный промежуток от утра до момента, когда надсмотрщик говорит с Воозом.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: лишь немного времени она провела в укрытии
  rationale: Еврейская фраза синтаксически трудна. Перевод сохраняет наиболее вероятный общий смысл — в укрытии Руфь находилась совсем недолго, — не уточняя, сидела ли она или отдыхала.
