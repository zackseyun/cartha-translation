base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: ru
  text: Она пошла, пришла и подбирала колосья на поле за жнецами. И так вышло[a], что она оказалась на участке поля, принадлежавшем Воозу, из рода Елимелеха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «и случился её случай» — идиома, выражающая кажущуюся случайность с человеческой точки зрения; вместе с тем общий ход повествования позволяет увидеть в случившемся действие Божьего провидения.'
    reason: Лексическая альтернатива и сохранение повествовательной богословской напряжённости.
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: она пошла, пришла
  rationale: Сохраняет последовательность двух еврейских глаголов движения и живой пошаговый ритм повествования, не сливая их в один глагол.
- source_word: וַתְּלַקֵּט
  choice: стала подбирать колосья
  rationale: В данном контексте לקט означает собирать оставшееся после жнецов. Такое выражение понятно современному читателю и передаёт конкретный сельскохозяйственный обычай без редкого слова «подбирать пожнивные остатки».
- source_word: בַּשָּׂדֶה אַחֲרֵי הַקֹּצְרִים
  choice: на поле … за жнецами
  rationale: 'Предлог אַחֲרֵי здесь имеет пространственный смысл: Руфь двигалась следом за теми, кто жал зерно. «Жнецы» точно и естественно передаёт הַקֹּצְרִים.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: и так вышло, что она оказалась
  rationale: Передаёт идиому с однокоренными глаголом и существительным как кажущуюся случайность с человеческой точки зрения, избегая как неестественного буквализма, так и явного истолкования события как действия Провидения.
- source_word: חֶלְקַת הַשָּׂדֶה לְבֹעַז
  choice: на участке поля, принадлежавшем Воозу
  rationale: חֶלְקָה обозначает отдельную часть или земельный участок, а לְ выражает принадлежность или связь с Воозом.
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: из рода Елимелеха
  rationale: מִשְׁפָּחָה здесь обозначает родовую или семейную группу. «Из рода» кратко и естественно выражает эту связь в библейском повествовании, не сужая её до ближайшей семьи.
theological_decisions:
- issue: Кажущаяся случайность и Божье провидение
  choice: 'Сохранить в основном тексте обычное выражение кажущейся случайности: «так вышло».'
  alternative: 'Явно назвать произошедшее Божьим промыслом либо буквально передать: «случай её приключился».'
  rationale: Еврейская идиома описывает событие с точки зрения человеческого восприятия, тогда как более широкий ход книги позволяет читателю увидеть действие провидения. Перевод сохраняет это напряжение и не разрешает его истолковательной добавкой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Традиционные формы имён «Вооз» и «Елимелех» сохранены. Выражение «подбирать колосья» выбрано ради понятности обычному читателю; синтаксис слегка сглажен, но последовательность действий и намеренная двусмысленность идиомы о случайности сохранены.
