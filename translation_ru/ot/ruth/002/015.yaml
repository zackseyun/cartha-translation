  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: ru
  text: 'Когда она встала подбирать колосья, Вооз приказал своим работникам: «Пусть она подбирает колосья даже среди снопов[a], и не унижайте её[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между снопами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не стыдите её» или «не позорьте её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  choice: Когда она встала, чтобы собирать оставшиеся колосья
  rationale: 'В повествовании форма с וַ־ продвигает действие, а инфинитив выражает цель. В русском контексте жатвы «собирать оставшиеся колосья» яснее обычному читателю передаёт специальное значение לקט, чем редкое «подбирать». '
- source_word: וַיְצַו ... לֵאמֹר
  choice: Вооз приказал ...
  rationale: צוה обозначает властное распоряжение. Отдельное «сказав» опущено как избыточная для естественной русской речи формула введения прямой речи.
- source_word: נְעָרָיו
  choice: своим работникам
  rationale: נַעַר может означать молодого мужчину, слугу или подчинённого. Здесь речь о мужчинах, работающих на поле Вооза; «работникам» естественно передаёт их роль без ненужного акцента на возрасте.
- source_word: גַּם בֵּין הָעֳמָרִים תְּלַקֵּט
  choice: Пусть она собирает даже среди снопов
  rationale: Имперфект имеет разрешительно-повелительный оттенок; גַּם расширяет предоставленное Руфи право, а בֵּין указывает на пространство между или среди уже связанных снопов.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: и не стыдите её
  rationale: Каузативная форма כלם означает подвергать стыду, позорить или унижать. «Не стыдите» сохраняет связь с общественным бесчестием и звучит естественно как запрет.
