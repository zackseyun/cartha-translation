revisions:
- from: 'Когда она встала, чтобы собирать оставшиеся колосья, Вооз приказал своим работникам: «Пусть она собирает даже среди снопов[a], и не стыдите её[b]».'
  to: 'Когда она встала подбирать колосья, Вооз приказал своим работникам: «Пусть она подбирает колосья даже среди снопов[a], и не унижайте её[b]».'
  rationale: Убрано невыраженное в еврейском тексте определение «оставшиеся». Запрет передан более естественным современным глаголом «не унижайте», при сохранении близких вариантов в сноске. Структура, маркеры сносок и смысл исходного текста сохранены.
