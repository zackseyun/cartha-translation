  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: ru
  text: 'И Вооз сказал Руфи: «Послушай, дочь моя: не ходи подбирать колосья на другое поле и не уходи отсюда, а оставайся с моими работницами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Послушай
  rationale: 'Еврейская вопросительная формула буквально означает «разве ты не слышала?», но в данном обращении естественно выражает настойчивое привлечение внимания: «Послушай». Такой перевод сохраняет речевую функцию без неестественной двусмысленности в русском.'
- source_word: בִּתִּי
  choice: дочь моя
  rationale: Уважительное и покровительственное обращение старшего мужчины к молодой женщине; родства не подразумевает.
- source_word: לִלְקֹט
  choice: подбирать колосья
  rationale: Глагол обозначает сбор оставшегося после жатвы; в контексте Руфи естественная русская конкретизация — «подбирать колосья».
- source_word: לֹא תַעֲבוּרִי מִזֶּה
  choice: не уходи отсюда
  rationale: Контекстуальное значение — не покидать это место и не переходить на другое поле.
- source_word: תִדְבָּקִין עִם נַעֲרֹתָי
  choice: держись рядом с моими работницами
  rationale: דבק передаёт тесное следование или близость, а נַעֲרוֹת здесь обозначает молодых женщин из рабочей группы Вооза. «Работницы» яснее русского «девушки» передаёт их роль в сцене.
