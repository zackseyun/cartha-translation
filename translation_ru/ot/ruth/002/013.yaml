base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: ru
  text: 'И сказала она: «Да обрету я благоволение в твоих глазах, господин мой, ведь ты утешил меня и ласково говорил с рабой твоей[a], хотя я не такая, как одна из твоих рабынь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил к сердцу рабы твоей»; то есть говорил ласково, с утешением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: Да обрету я благоволение
  rationale: Имперфект здесь передаёт почтительное пожелание. Формула сохраняет смысл просьбы о благосклонности и соответствует возвышенному, но понятному русскому регистру.
- source_word: בְּעֵינֶיךָ
  choice: в твоих глазах
  rationale: Сохранён прозрачный древнееврейский образ оценки и благосклонности; выражение естественно и в современном литературном русском.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это почтительное обращение к Воозу, а не божественный титул. Инверсия передаёт социальную почтительность речи Руфи.
- source_word: נִחַמְתָּנִי
  choice: ты утешил меня
  rationale: Глагол נחם обозначает утешение в положении уязвимости; «утешил» точно и естественно передаёт эмоциональный смысл.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: говорил к сердцу
  rationale: Сохранена образность буквальной еврейской идиомы; её более гладкий смысл дан в примечании.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: рабы твоей / твоих рабынь
  rationale: Существительное обозначает женщину-служанку или рабыню. «Раба/рабыни» сохраняет социальное самоуничижение Руфи и лексическую связь обоих употреблений.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: хотя я и не стою в ряду
  rationale: 'Оборот передаёт уступительное противопоставление: Вооз оказал Руфи милость, хотя она не принадлежит даже к числу его служанок. «Не стою в ряду» естественно выражает статусное сравнение, не превращая форму אהיה в утверждение о будущем.'
