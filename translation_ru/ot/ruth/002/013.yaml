  terminology: «Господин мой» уместно как уважительное обращение к человеку. «Раба/рабыни» последовательно передаёт שִׁפְחָה и сохраняет социально подчинённое самоназвание Руфи; термин не следует сглаживать. «Благоволение» допустимо в умеренно возвышенном библейском регистре.
