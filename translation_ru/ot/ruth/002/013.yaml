  source_fidelity: 'Основной смысл передан верно: почтительное пожелание Руфи, «благоволение в глазах», утешение Вооза и контраст с его рабынями сохранены. Однако «не стою в ряду твоих рабынь» заменяет прямое сравнение статусов («не подобна одной из...») метафорой, которой нет в оригинале.'
