- from: 'Ноеминь сказала своей невестке[a]: «Да будет он благословен Господом, который не оставил Своей милостью ни живых, ни умерших». И сказала ей Ноеминь: «Этот человек — наш близкий родственник; он один из тех, кто имеет право выкупить наше наследие[b]».'
  to: 'Ноеминь сказала своей невестке: «Да будет он благословен Господом, не оставившим без Своей милости ни живых, ни умерших»[a]. И сказала ей Ноеминь: «Этот человек — наш близкий родственник; он один из наших родственников, имеющих право выкупа»[b].'
  rationale: Исправлены неестественное русское управление при «милости» и невыраженная в оригинале конкретизация «нашего наследия». Основной текст следует избранному прочтению, в котором милость относится к Господу; допустимое отнесение к Воозу ясно сохранено в сноске. Правка не снимает исходную текстовую неоднозначность и не вносит конфессионального толкования.
