base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: ru
  text: 'Ноеминь сказала своей невестке: «Да будет он благословен Господом, не оставившим без Своей милости ни живых, ни умерших»[a]. И сказала ей Ноеминь: «Этот человек — наш близкий родственник; он один из наших родственников, имеющих право выкупа»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет он благословен Господом: он не оставил без своей милости ни живых, ни умерших». В этом прочтении милость относится к Воозу, а не к Господу.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «он один из наших выкупщиков». Речь о близком родственнике, имевшем признанное право или обязанность выкупить семейную собственность и защищать интересы рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: Да будет он благословен Господом
  rationale: Безглагольная формула выражает благословение или пожелание. Русская конструкция естественна и передаёт Господа как источник благословения.
- source_word: חַסְדּוֹ
  choice: Своей милостью
  rationale: חֶסֶד здесь охватывает милость, доброту и верность. Прописная буква отражает принятое в основном тексте отнесение местоимения к Господу, тогда как допустимое отнесение к Воозу сохранено в сноске.
- source_word: לֹא עָזַב
  choice: не оставил ... милостью
  rationale: 'Буквальная образность глагола עזב сохранена, но русское управление сделано естественным: «не оставить своей милостью».'
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: ни живых, ни умерших
  rationale: После отрицания парная конструкция «ни… ни…» естественно передаёт еврейское «и… и…» и полноту охвата.
- source_word: קָרוֹב לָנוּ
  choice: наш близкий родственник
  rationale: קָרוֹב обозначает здесь близость родства, а не пространственную близость.
- source_word: מִגֹּאֲלֵנוּ
  choice: один из тех, кто имеет право выкупить наше наследие
  rationale: Форма от גאל обозначает близкого родственника, обладавшего признанным правом и обязанностью выкупа. Развёрнутый перевод понятнее современному читателю и не создаёт впечатления, будто речь прямо идёт о духовном спасении.
theological_decisions:
- issue: 'К кому относится местоимение в выражении «его милость»: к Господу или к Воозу'
  choice: В основном тексте милость отнесена к Господу
  alternative: 'Милость может быть отнесена к Воозу: «Да благословит его Господь! Он не оставил своей милостью ни живых, ни умерших»'
  rationale: Ближайшим грамматическим предшественником относительного оборота является имя Господа, и такое прочтение соответствует теме Божьей милости, действующей через людей. Однако еврейский текст допускает отнесение к Воозу, поэтому неоднозначность отмечена в сноске.
- issue: Смысл обозначения גֹּאֵל
  choice: родственник, имеющий право выкупить семейное наследие
  alternative: родственник-искупитель / один из наших выкупщиков
  rationale: Контекст относится к установленной родственной функции выкупа имущества и защиты интересов семьи. Перевод не переносит на этот термин более поздний богословский смысл и сохраняет его семейно-правовое содержание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранено традиционное русское имя «Ноеминь» и передача тетраграмматона как «Господь». Юридико-родственный термин объяснён в основном тексте и сноске без конфессиональной терминологии.
