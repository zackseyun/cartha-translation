base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: ru
  text: 'Вооз ответил ей: «Мне подробно рассказали обо всём, что ты сделала для своей свекрови после смерти мужа: как ты оставила отца, мать и родную землю и пошла к народу, которого прежде не знала[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которого ты не знала ни вчера, ни позавчера».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: Мне подробно рассказали
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает значение сообщения. Русская безличная конструкция естественно передаёт пассивный смысл, а «подробно» — подчёркнутую полноту известий.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: обо всём, что ты сделала для своей свекрови
  rationale: «Обо всём» сохраняет обобщающее כֹּל, а «для своей свекрови» естественно выражает направленность поступков Руфи на благо Ноемини.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: после смерти мужа
  rationale: Сохраняет именную форму и сдержанный повествовательный тон исходного текста; принадлежность мужа ясна из обращения к Руфи.
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: ты оставила отца, мать
  rationale: «Оставила» — нейтральный современный эквивалент; оба родителя названы отдельно, как в еврейском тексте.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: родную землю
  rationale: Естественное русское выражение для земли рождения и происхождения без излишне политического оттенка.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: пошла к народу
  rationale: Передаёт глагол движения הלך и сохраняет перспективу Руфи, покинувшей Моав.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: которого ... не знала
  rationale: ידע здесь означает прежнее знакомство с народом, а не отсутствие отвлечённых сведений о нём.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: прежде
  rationale: Идиома буквально называет «вчера и третьего дня», но в контексте означает прежнее время; буквальный образ сохранён в примечании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь Вооза передана достойно и естественно, без архаизмов. Формула «ответил ей» сохранена, но избыточное для русского «и сказал» опущено. Усиленная еврейская конструкция сообщения передана словом «подробно».
