base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: ru
  text: Она взяла собранное зерно и пришла в город. Свекровь увидела то, что она насобирала. Затем Руфь достала и отдала ей то, что у неё осталось после того, как она насытилась[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того как поела досыта».'
    reason: Лексическая альтернатива для מִשָּׂבְעָהּ, передающая насыщение как результат еды.
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: Она подняла собранное зерно
  rationale: נשׂא означает «поднять, понести». Дополнение в еврейском тексте подразумевается из предыдущего контекста; «собранное зерно» естественно передаёт, что Руфь подняла и понесла домой намолоченное зерно.
- source_word: וַתָּבוֹא הָעִיר
  choice: пришла в город
  rationale: בוא с указанием места передаёт прибытие или вход в город. «Пришла в город» естественно для русской повествовательной речи и сохраняет прямое значение עִיר — «город».
- source_word: חֲמוֹתָהּ
  choice: свекровь
  rationale: В русском языке мать мужа называется «свекровью»; это точное обозначение Ноемини по отношению к Руфи.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: сколько зерна она насобирала
  rationale: לקט обозначает собирание оставшегося после жнецов. В данном месте зерно уже обмолочено, поэтому буквальное «колосья» было бы неточно; «насобирала» сохраняет повторный, постепенный характер действия и звучит естественно.
- source_word: וַתּוֹצֵא
  choice: Руфь достала
  rationale: Каузативная форма יצא означает «вынести, достать». Имя «Руфь» названо для устранения возникающей в русском языке двусмысленности после упоминания свекрови; смены действующего лица в еврейском тексте нет.
- source_word: וַתִּתֶּן לָהּ
  choice: отдала ей
  rationale: Передаёт действие и явно выраженного косвенного адресата לָהּ; «отдала» естественно в контексте передачи сохранённой еды Ноемини.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: то, что оставила
  rationale: Форма от יתר означает оставить или иметь в остатке. Здесь речь о части еды, которую Руфь сохранила после трапезы.
- source_word: מִשָּׂבְעָהּ
  choice: насытившись
  rationale: שׂבע выражает насыщение, а предлог מִן указывает на остаток после насыщения. Деепричастие кратко и естественно передаёт компактное еврейское выражение, не уточняя сверх текста, чем именно она насытилась.
