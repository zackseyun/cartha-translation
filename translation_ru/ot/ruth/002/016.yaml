  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: ru
  text: 'И ещё: намеренно вынимайте для неё колосья из связок[a] и оставляйте их, чтобы она могла их подобрать[b], и не укоряйте её».'
