  - marker: b
    text: 'Или: «чтобы она собирала колосья». Здесь употреблён обычный еврейский глагол, обозначающий подбирание колосьев на убранном поле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: И ещё
  rationale: 'Передаёт как соединительную, так и добавочную силу выражения: Вооз дополняет предыдущее распоряжение новым указанием.'
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: обязательно вытаскивайте
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повеление; по контексту работники должны намеренно вытаскивать колосья для Руфи, а не просто случайно ронять их.
- source_word: לָהּ
  choice: для неё
  rationale: 'Предлог здесь обозначает пользу: зерно следует вытаскивать ради Руфи.'
- source_word: מִן הַצְּבָתִים
  choice: колосья из связок
  rationale: צְבָתִים — собранные вместе пучки стеблей; «связки» ясно передаёт образ ещё до окончательного формирования снопов, а слово «колосья» естественно восполняет подразумеваемый объект глагола в русском языке.
- source_word: וַעֲזַבְתֶּם
  choice: и оставляйте их
  rationale: Работники должны оставлять намеренно вынутые колосья на поле, чтобы Руфь могла их подобрать.
- source_word: וְלִקְּטָה
  choice: чтобы она могла подбирать
  rationale: לקט — обычный глагол для подбирания остатков урожая после жнецов. Формулировка естественна по-русски и сохраняет сельскохозяйственный контекст.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: и не браните её
  rationale: גער обозначает резкий укор или выговор; «браните» сохраняет силу запрета и подходит к достоинству повествовательного стиля.
