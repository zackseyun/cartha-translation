  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: ru
  text: 'И свекровь сказала ей: «Где ты сегодня подбирала колосья? Где работала? Пусть будет благословен тот, кто обратил на тебя внимание!» Она рассказала свекрови, с кем она работала[a], и сказала: «Человека, с которым я сегодня работала, зовут Вооз».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «что она делала с ним» и далее: «человек, с которым я сегодня делала». В контексте речь идёт о работе Руфи на поле.'
