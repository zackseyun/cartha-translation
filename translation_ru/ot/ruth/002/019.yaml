lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: свекровь
  rationale: Обычное русское обозначение матери мужа; родственная связь сохраняется и после смерти мужа Руфи.
- source_word: לִקַּטְתְּ
  choice: подбирала колосья
  rationale: Глагол обозначает собирание оставшихся после жатвы колосьев; такая формулировка естественна по-русски и сохраняет сельскохозяйственный и правовой контекст повествования.
- source_word: עָשִׂית
  choice: работала
  rationale: Буквальное «делала» в данном контексте относится к труду Руфи в поле; «работала» ясно передаёт контекстуальный смысл.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: Пусть будет благословен тот, кто обратил на тебя внимание
  rationale: מכיר указывает на того, кто заметил или признал Руфь; выражение «обратил внимание» естественно передаёт оказанное ей благосклонное внимание.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ / אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: у кого работала / у которого я сегодня работала
  rationale: Контекст показывает, что речь идёт о работе на поле, связанном с этим человеком. Русское «у кого работала» не создаёт ошибочного впечатления, будто Руфь трудилась бок о бок с ним; буквальная структура отмечена в сноске.
- source_word: בֹּעַז
  choice: Вооз
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, хорошо узнаваемая читателями.
