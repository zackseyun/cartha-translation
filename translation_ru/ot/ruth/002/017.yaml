  text: וַ/תְּלַקֵּ֥ט בַּ/שָּׂדֶ֖ה עַד הָ/עָ֑רֶב וַ/תַּחְבֹּט֙ אֵ֣ת אֲשֶׁר לִקֵּ֔טָה וַ/יְהִ֖י כְּ/אֵיפָ֥ה שְׂעֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: ru
  text: Так Руфь подбирала колосья на поле до вечера, а потом обмолотила собранное. Получилось около ефы ячменя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ефа — древняя мера объёма сыпучих тел, примерно 20–22 литра.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: Так Руфь подбирала колосья
  rationale: Глагол לקט в данном контексте означает собирать оставшиеся после жнецов колосья. Имя «Руфь» естественно восстанавливает подлежащее по контексту, а «так» плавно передаёт повествовательную связь.
- source_word: בַּשָּׂדֶה עַד הָעָרֶב
  choice: на поле до вечера
  rationale: Прямо и естественно передаёт место и продолжительность труда.
- source_word: וַתַּחְבֹּט
  choice: а потом обмолотила
  rationale: חבט обозначает выбивание зерна из собранных колосьев; «обмолотила» точно и понятно передаёт действие, а «потом» выражает последовательность повествования.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: собранное
  rationale: Краткая русская субстантивированная форма естественно обозначает то, что Руфь подобрала на поле, без тяжеловесного повтора.
- source_word: וַיְהִי כְּאֵיפָה
  choice: Получилось около ефы
  rationale: וַיְהִי здесь вводит итоговый объём, а приставка כ־ указывает на приблизительность. Историческая мера сохранена транслитерацией и пояснена в сноске.
- source_word: שְׂעֹרִים
  choice: ячменя
  rationale: Обычное русское обозначение зерна; родительный падеж естествен после меры объёма.
