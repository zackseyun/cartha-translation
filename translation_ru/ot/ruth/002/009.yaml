base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: ru
  text: Смотри на поле, где жнут, и иди за жницами. Разве я не приказал молодым людям не трогать тебя[a]? Когда захочешь пить, иди к сосудам и пей воду, которую начерпают молодые люди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу контекста: «не сметь приставать к тебе» или «не поднимать на тебя руку». Буквально: «не касаться тебя»; запрет может подразумевать защиту от домогательств или нападения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ
  choice: Смотри
  rationale: Именная конструкция «твои глаза — на поле» имеет подразумеваемую побудительную силу; естественный русский императив передаёт указание быть внимательной к тому, где ведётся жатва.
- source_word: בַּשָּׂדֶה אֲשֶׁר יִקְצֹרוּן
  choice: на поле, где жнут
  rationale: Сохраняется единственное число שׂדה и относительное определение поля по происходящей на нём жатве; безлично-определённое «жнут» естественно по-русски и не вводит лишнего референта.
- source_word: וְהָלַכְתִּ אַחֲרֵיהֶן
  choice: и иди следом за ними
  rationale: Передаёт последовательное указание и пространственное значение «за ними». Женский род множественного суффикса указывает на женщин из предыдущего контекста, но русское местоимение после предлога рода не выражает.
- source_word: הֲלוֹא צִוִּיתִי
  choice: Я ведь приказал
  rationale: הֲלוֹא вводит риторическое заверение. Утвердительная русская конструкция с «ведь» естественно передаёт ожидаемый положительный ответ, а «приказал» сохраняет властную силу צוה.
- source_word: הַנְּעָרִים
  choice: молодые работники
  rationale: Слово обозначает молодых мужчин, работающих у Вооза. «Работники» раскрывает контекст, а «молодые» и грамматический мужской род сохраняют возрастно-половое различие с женской группой.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: не трогать тебя
  rationale: Сохраняет прямое значение נגע и одновременно допускает контекстуальный смысл защиты от домогательств или насилия, не сужая его в основном тексте.
- source_word: וְצָמִת
  choice: Когда захочешь пить
  rationale: Естественно передаёт ожидаемую ситуацию жажды как условие следующего действия.
- source_word: הַכֵּלִים
  choice: сосуды
  rationale: כֵּלִים — общее обозначение ёмкостей. «Сосуды» сохраняет широту слова, не уточняя без достаточных оснований материал или форму как «кувшины».
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן
  choice: и пей то, что начерпают
  rationale: Русское будущее совершенного вида естественно выражает воду, которую работники будут черпать для питья; объект «воду» остаётся понятным из контекста.
theological_decisions:
- issue: Характер запрета работникам
  choice: не трогать тебя
  alternative: не сметь приставать к тебе / не поднимать на тебя руку
  rationale: Еврейский глагол буквально означает «касаться», но контекст может включать домогательства, притеснение или физическое нападение. Основной текст сохраняет смысловую широту, а примечание поясняет вероятную защитную направленность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Краткие повелительные формы сохраняют заботливый, но властный тон Вооза. Архаизмы избегаются; неопределённость глагола נגע и общего существительного כֵּלִים не устраняется чрезмерной конкретизацией.
