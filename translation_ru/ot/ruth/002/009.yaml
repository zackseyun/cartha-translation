  source_fidelity: 'Основной смысл передан верно: указание держаться поля жатвы, идти за женской группой, защита со стороны Вооза и разрешение пить воду из сосудов сохранены. Однако еврейское הֲלוֹא требует риторического вопроса, а не утвердительного «Я ведь приказал». Кроме того, женский суффикс в אַחֲרֵיהֶן можно естественно и без излишней интерпретации передать словом «жницы».'
