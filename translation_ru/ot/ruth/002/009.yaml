  terminology: «Сосуды» удачно сохраняет широту כֵּלִים. «Молодые работники» допустимо, но «молодые люди» точнее передаёт הַנְּעָרִים как мужскую группу, не сводя значение только к должностной функции. Основной глагол «не трогать» сохраняет буквальную широту נגע; примечание корректно отмечает возможный контекстуальный оттенок.
