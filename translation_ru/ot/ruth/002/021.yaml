base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: ru
  text: 'Тогда моавитянка Руфь сказала: «Он также сказал мне: „Держись рядом с моими работниками[a], пока они не закончат всю мою жатву“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с моими юношами» или «с моими молодыми людьми». В еврейском тексте стоит форма мужского рода; в этом контексте она может обозначать молодых слуг или работников.'
    reason: Сохраняет мужскую форму הַנְּעָרִים и отражает её возможный диапазон значений в контексте жатвы, не сглаживая различие с женской формой в соседних стихах.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда ... сказала
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующей реплике.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: моавитянка Руфь
  rationale: Современное русское обозначение происхождения и естественный порядок слов при подлежащем после нарративного перехода.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: Он ещё сказал мне
  rationale: גַּם выражает добавление к уже переданным словам Вооза; «ещё» естественно в данном диалоге.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: моих работников
  rationale: В еврейском стоит форма мужского рода множественного числа הַנְּעָרִים. В контексте жатвы она может обозначать молодых мужчин или слуг-работников; перевод сохраняет мужскую референцию и трудовой контекст.
- source_word: תִּדְבָּקִין
  choice: Держись
  rationale: דבק означает тесно держаться рядом, не отходить; краткая форма естественно передаёт практическое наставление.
- source_word: עַד אִם כִּלּוּ
  choice: пока они не окончат
  rationale: Оборот обозначает предел продолжающегося действия и сохраняет множественное число действующих лиц.
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: у меня всю жатву
  rationale: Передаёт полноту жатвы и её принадлежность Воозу без тяжеловесного буквального оборота «всю жатву, которая у меня».
theological_decisions:
- issue: Пол работников, к которым Руфь должна была держаться ближе
  choice: 'Сохранена мужская форма источника: «работников»'
  alternative: «работниц» по ближайшему контексту Руфь 2:8 и 2:22
  rationale: Масоретский текст этого стиха недвусмысленно употребляет הַנְּעָרִים, форму мужского рода. Замена на женский род устранила бы заметное различие между словами Руфи здесь и советом Ноемини в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной интонацией. Формулировка сохраняет различие между мужской формой в этом стихе и женской формой в соседнем контексте, не сглаживая текстовую напряжённость.
