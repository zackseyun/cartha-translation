base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: ru
  text: 'И вот[a], Вооз пришёл из Вифлеема и сказал жнецам: «Яхве да будет с вами!» Они ответили ему: «Да благословит тебя Яхве!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также передать: «И смотри» или «И вот что случилось». Оно живо вводит нового участника повествования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет функцию еврейского маркера, живо вводящего Вооза в сцену, но звучит естественно и достойно в современном русском языке.
- source_word: בֹּעַז
  choice: Вооз
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: בָּא
  choice: пришёл
  rationale: Прямо передаёт обычное значение глагола בוא в данном повествовательном контексте.
- source_word: מִבֵּית לֶחֶם
  choice: из Вифлеема
  rationale: Предлог מן передан как «из», а название города — в общепринятой русской форме.
- source_word: לַקֹּצְרִים
  choice: жнецам
  rationale: Точно и кратко обозначает людей, которые жнут урожай; соответствует сельскохозяйственной обстановке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עִמָּכֶם
  choice: да будет с вами
  rationale: Безглагольная фраза буквально означает «Яхве с вами», однако в данном приветствии имеет благопожелательный оттенок, естественно выражаемый частицей «да».
- source_word: יְבָרֶכְךָ
  choice: Да благословит тебя
  rationale: Форма глагола выражает пожелание или благословение; конструкция с «да» сохраняет эту модальность и торжественную естественность.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вносит конфессиональной замены.
- issue: Характер приветствия יְהוָה עִמָּכֶם
  choice: 'благопожелание: «Яхве да будет с вами»'
  alternative: 'утверждение: «Яхве с вами»'
  rationale: Глагол в еврейской фразе отсутствует, поэтому грамматически возможна и констатация; однако контекст обмена приветствиями поддерживает благопожелательное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным оттенком прямой речи. «И вот» естественнее архаичного «и се», а конструкции «да будет» и «да благословит» ясно передают взаимные благопожелания. Местоимения во множественном и единственном числе сохранены в соответствии с еврейским текстом.
