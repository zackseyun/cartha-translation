  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: ru
  text: Так Руфь держалась рядом с работницами Вооза, собирая колосья, до окончания жатвы ячменя и жатвы пшеницы. И жила она со своей свекровью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «И оставалась она со своей свекровью». Еврейский глагол может означать «оставаться», «пребывать» или «жить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: держалась рядом
  rationale: Глагол דבק передаёт тесную и устойчивую привязанность или близость. В данном повествовательном контексте «держалась рядом» естественно выражает постоянное пребывание Руфи возле работниц Вооза, не создавая впечатления буквального физического цепляния.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: со служанками Вооза
  rationale: נַעֲרוֹת здесь обозначает молодых женщин, работавших у Вооза. «Служанки» кратко и естественно передаёт их положение в хозяйстве, а предлог «со» согласуется с выражением «держалась рядом».
- source_word: לְלַקֵּט
  choice: и собирала оставшиеся колосья
  rationale: Инфинитив указывает, ради чего Руфь находилась рядом с работницами. Русское выражение раскрывает древнюю практику подбирания оставшихся после жнецов колосьев яснее, чем редкое самостоятельное «подбирать», при этом смысл передан без добавления конфессиональной трактовки.
- source_word: עַד כְּלוֹת
  choice: пока не окончились
  rationale: Конструкция обозначает продолжительность до полного завершения. «Пока не окончились» естественна в современном русском повествовании.
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: жатва ячменя и жатва пшеницы
  rationale: Повтор слова «жатва» сохраняет параллелизм еврейского текста и подчёркивает два последовательных периода сбора урожая.
- source_word: וַתֵּשֶׁב
  choice: жила
  rationale: ישב допускает значения «сидеть», «оставаться», «пребывать» и «жить». Здесь наиболее вероятна речь о проживании Руфи со свекровью, однако возможное значение «оставалась» отмечено в сноске.
- source_word: אֶת חֲמוֹתָהּ
  choice: со своей свекровью
  rationale: В сочетании с ישב выражение естественно передаётся по-русски как совместное проживание. Возвратное притяжательное местоимение «своей» соответствует современному русскому употреблению.
