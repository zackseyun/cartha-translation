  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: ru
  text: 'Ноеминь сказала своей невестке Руфи: «Хорошо, дочь моя, что ты будешь ходить вместе с женщинами, работающими у него, чтобы в другом поле к тебе никто не приставал[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы в другом поле тебя не встретили / не тронули / не обидели». Еврейский глагол может означать простую встречу или враждебное столкновение. Забота Ноемини о безопасности Руфи указывает здесь на отрицательный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: сказала
  rationale: Форма с повествовательным וַ продолжает последовательность событий; в русском порядок повествования естественно передаётся прошедшим временем без обязательного отдельного «тогда».
- source_word: כַּלָּתָהּ
  choice: своей невестке
  rationale: Слово прямо обозначает родство Руфи с Ноеминью; возвратное местоимение естественно передаёт суффикс третьего лица в русском предложении.
- source_word: טוֹב
  choice: хорошо
  rationale: Сохранена простая положительная оценка Ноемини без усиления до «лучше всего».
- source_word: בִּתִּי
  choice: дочь моя
  rationale: Сохранено родственное и ласковое обращение, хотя Руфь не является родной дочерью Ноемини.
- source_word: כִּי תֵצְאִי
  choice: что ты будешь выходить
  rationale: כִּי вводит содержание оценки, а תֵצְאִי буквально означает «выходить»; цель выхода — собирать колосья — не добавлена в сам глагол.
- source_word: עִם נַעֲרוֹתָיו
  choice: вместе с его девушками
  rationale: נַעֲרוֹת обозначает молодых женщин из людей Вооза. «Девушки» звучит естественно и не уточняет их правовой статус как служанок.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: тогда ... к тебе не пристанут
  rationale: В данном контексте פגע указывает на нежелательную или опасную встречу. «Не пристанут» естественно выражает угрозу домогательства, не усиливая её однозначно до физического нападения.
- source_word: בְּשָׂדֶה אַחֵר
  choice: в другом поле
  rationale: Прямой и естественный перевод предложной и именной группы.
