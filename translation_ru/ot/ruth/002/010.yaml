  text: וַ/תִּפֹּל֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תֹּ֣אמֶר אֵלָ֗י/ו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ לְ/הַכִּירֵ֔/נִי וְ/אָּנֹכִ֖י נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: ru
  text: 'Тогда она пала ниц, поклонилась до земли и сказала ему: «Почему я обрела благосклонность в твоих глазах, что ты обратил на меня внимание[a], хотя я чужеземка?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнал меня», «признал меня» или «удостоил меня внимания».'
    reason: 'Лексическая альтернатива: לְהַכִּירֵנִי допускает значения узнавания, признания, принятия во внимание и проявления внимания.'
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: она пала ниц
  rationale: Еврейское выражение буквально описывает падение на лицо как знак глубокого смирения. Русское «пала ниц» естественно и ёмко передаёт ту же позу и сохраняет возвышенный повествовательный регистр.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: поклонилась до земли
  rationale: Глагол обозначает низкий поклон или простирание перед кем-либо. В данном межличностном контексте формулировка передаёт почтительность, не приписывая действию значение религиозного поклонения.
- source_word: מַדּוּעַ
  choice: почему
  rationale: Прямой и естественный современный русский эквивалент вопросительного слова о причине.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: я обрела благосклонность в твоих глазах
  rationale: Сохранён образ еврейской идиомы «найти благосклонность в глазах»; «благосклонность» здесь точно передаёт общественное расположение и не вносит излишне богословского оттенка слова «благодать».
- source_word: לְהַכִּירֵנִי
  choice: что ты обратил на меня внимание
  rationale: В каузативной форме глагол может означать заметить, признать или удостоить внимания. В контексте Руфь удивляется благосклонному вниманию Вооза; основной вариант естественно выражает этот смысл, а подлинная лексическая широта отмечена в сноске.
- source_word: וְאָנֹכִי
  choice: хотя я
  rationale: 'Союз и самостоятельное местоимение в контексте создают уступительное противопоставление: Вооз проявил внимание вопреки её положению. «Хотя я» ясно передаёт эту связь по-русски.'
- source_word: נָכְרִיָּה
  choice: чужеземка
  rationale: Форма женского рода обозначает женщину из другого народа. «Чужеземка» сохраняет и значение иностранного происхождения, и грамматический род, оставаясь понятным литературным словом.
theological_decisions:
- issue: Возможный культовый оттенок וַתִּשְׁתַּחוּ
  choice: Передать как почтительный земной поклон перед Воозом, а не как богослужебное поклонение
  alternative: Перевести словом «поклонилась» в значении религиозного поклонения или употребить «поклонилась ему» без уточнения физического жеста
  rationale: В повествовательном контексте Руфь выражает Воозу глубокое почтение, а не поклоняется ему как Богу. «Поклонилась до земли» сохраняет видимое действие и не вносит отсутствующего в тексте богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Выражения «пала ниц» и «поклонилась до земли» естественно передают последовательные жесты глубокого смирения; образ «в твоих глазах» сохранён как понятная исходная метафора.
