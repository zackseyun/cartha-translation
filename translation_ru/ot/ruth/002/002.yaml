  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: ru
  text: 'И сказала Руфь-моавитянка Ноемини: «Позволь мне пойти в поле и собирать колосья за тем, кто окажет мне благосклонность[a]». Она ответила ей: «Иди, дочь моя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за тем, у кого я найду благосклонность в его глазах» — еврейское выражение со значением «кто отнесётся ко мне благосклонно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: моавитянка
  rationale: Естественное современное обозначение происхождения Руфи, сохраняющее повествовательный акцент на её чужеземном статусе.
- source_word: אֵלְכָה נָּא
  choice: Позволь мне пойти
  rationale: Когортатив с נָא передаёт вежливую просьбу и намерение, а не простое сообщение о будущем действии.
- source_word: הַשָּׂדֶה
  choice: в поле
  rationale: Контекстуально естественная русская передача сельскохозяйственного участка, где шла жатва.
- source_word: וַאֲלַקֳטָּה
  choice: и подбирать
  rationale: Глагол обозначает собирание оставшегося после жнецов; русский глагол передаёт конкретное действие понятнее, чем редкое «подбирать остатки жатвы».
- source_word: בַשִּׁבֳּלִים
  choice: колосья
  rationale: שִׁבֳּלִים — колосья зерновых, а не связанные снопы.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: вслед за тем, у кого я найду благосклонность
  rationale: Сохраняет конструкцию с неопределённым лицом и мужской единственной формой, а также образность еврейской идиомы без чрезмерной буквальности.
- source_word: חֵן
  choice: благосклонность
  rationale: В данном социальном контексте речь идёт о благоприятном отношении и дозволении, а не о специально богословском понятии благодати.
- source_word: לְכִי בִתִּי
  choice: Иди, дочь моя
  rationale: Передаёт краткое разрешение и тёплое семейное обращение Ноемини.
