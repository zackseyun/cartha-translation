  variant: modern literary Russian
source:
  edition: WLC
  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: ru
  text: У Ноемини был родственник со стороны мужа[a] — влиятельный и состоятельный человек[b] из рода Елимелеха[c]; звали его Вооз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знакомый её мужа». Еврейское слово может обозначать человека, известного мужу или связанного с ним; упоминание рода Елимелеха указывает здесь на родственную связь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально это выражение может передавать значения силы, способности, высокого положения и богатства; также возможно: «человек большого достоинства» или «видный человек».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из семьи Елимелеха»; еврейское слово может обозначать как семью, так и более широкий круг родства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנָעֳמִי
  choice: У Ноемини был
  rationale: Конструкция естественно вводит новый факт повествования. Союз וּ передан связностью русского повествования без искусственного начального «теперь».
- source_word: מידע
  choice: родственник
  rationale: Слово обозначает человека, связанного с мужем Ноемини; последующее указание на род Елимелеха поддерживает понимание родственной связи, хотя возможен и более общий смысл «знакомый».
- source_word: לְאִישָׁהּ
  choice: со стороны мужа
  rationale: Предлог и суффикс указывают, что связь этого человека определяется через мужа Ноемини. Такая формулировка естественна по-русски и не приписывает ему преждевременно конкретную юридическую роль.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: влиятельный и состоятельный человек
  rationale: В немилитаристском контексте Руфи выражение охватывает силу, способность, общественное положение и имущественную состоятельность. Выбранная формулировка передаёт наиболее уместные здесь социально-экономические оттенки, а примечание сохраняет более широкий диапазон.
- source_word: מִמִּשְׁפַּחַת
  choice: из рода
  rationale: מִשְׁפָּחָה может обозначать не только ближайшую семью, но и более широкую родственную группу. Русское «род» естественно сохраняет эту широту.
- source_word: וּשְׁמוֹ
  choice: звали его
  rationale: Естественная русская повествовательная формула для представления нового лица.
- source_word: בֹּעַז
  choice: Вооз
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
theological_decisions:
- issue: Степень родства и будущая роль Вооза
  choice: родственник со стороны мужа
  alternative: близкий родственник; родственник-искупитель
  rationale: Исходный стих не уточняет степень родства и ещё не называет Вооза юридическим термином גֹּאֵל. Перевод не предвосхищает последующее развитие повествования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; традиционные формы имён сохранены. Формулировки не вводят военную окраску и не определяют заранее юридическую роль Вооза.
