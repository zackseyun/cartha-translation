base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: ru
  text: 'Во время еды Вооз сказал ей: «Подойди сюда, поешь хлеба и обмакни свой кусок в кислое вино[a]». Она села рядом со жнецами, и он подал ей жареного зерна. Она поела, насытилась, и у неё ещё осталось.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в уксус». Еврейское слово חֹמֶץ может означать уксус либо кислый винный напиток; в контексте трапезы работников, вероятно, имеется в виду кислое вино.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: Во время еды
  rationale: Естественно передаёт идиоматическое указание на время общей трапезы работников.
- source_word: גֹּשִׁי הֲלֹם
  choice: Подойди сюда
  rationale: Сохраняет значение физического приближения и звучит естественно в прямом приглашении.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: поешь хлеба
  rationale: Родительный падеж передаёт частичное значение предлога מִן и естественен в современном русском.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: обмакни свой кусок в кислое вино
  rationale: «Кусок» сохраняет некоторую неопределённость פַּת, хотя из контекста подразумевается хлеб; «кислое вино» передаёт вероятный напиток работников, а вариант «уксус» отмечен в сноске.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: рядом со жнецами
  rationale: Ясно передаёт положение возле жнецов и сохраняет сельскохозяйственный контекст.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: он подал ей жареного зерна
  rationale: Редкий глагол по контексту обозначает передачу или подачу пищи; «жареное зерно» доступно передаёт קָלִי.
- source_word: וַתִּשְׂבַּע
  choice: насытилась
  rationale: Точно и лаконично передаёт состояние сытости.
- source_word: וַתֹּתַר
  choice: у неё ещё осталось
  rationale: Сохраняет женский субъект последовательности глаголов и естественно выражает, что часть полученной пищи осталась после еды.
