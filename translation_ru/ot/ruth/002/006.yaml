  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: ru
  text: 'Юноша, поставленный над жнецами, ответил: «Это молодая моавитянка, которая вернулась с Ноеминью с полей Моава[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с поля Моава»; еврейское слово в единственном числе может собирательно обозначать сельские земли Моава.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ответил
  rationale: В еврейской повествовательной формуле два глагола буквально означают «ответил и сказал», однако по-русски «ответил» естественно передаёт всю формулу без тяжеловесного дублирования.
- source_word: הַנַּעַר
  choice: юноша
  rationale: Слово обозначает юношу или молодого слугу; роль этого человека отдельно выражена причастным оборотом, поэтому нейтральное «юноша» не привносит в существительное значение «надсмотрщик».
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: поставленный над жнецами
  rationale: Передаёт как положение назначенного лица, так и его власть над работниками, сохраняя образную структуру еврейского выражения.
- source_word: הַקּוֹצְרִים
  choice: жнецами
  rationale: Прямое и естественное обозначение людей, жнущих зерновые, в данном сельскохозяйственном контексте.
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: молодая моавитянка
  rationale: Передаёт и возрастную характеристику, и происхождение женщины; «девушка» могло бы сильнее подразумевать незамужний статус.
- source_word: הִיא
  choice: это
  rationale: В русском представлении или опознании женщины конструкция «это молодая моавитянка» звучит естественнее буквального «она — молодая моавитянка».
- source_word: הַשָּׁבָה
  choice: которая вернулась
  rationale: Сохраняет мотив возвращения, выраженный глаголом שוב, не заменяя его более общим «пришла».
- source_word: עִם נָעֳמִי
  choice: с Ноеминью
  rationale: Прямо передаёт совместность действия и использует традиционную русскую форму имени с нормативным склонением.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: с полей Моава
  rationale: Единственное число שְׂדֵה может иметь собирательное или территориальное значение; множественное «поля» естественно передаёт сельскую местность Моава.
