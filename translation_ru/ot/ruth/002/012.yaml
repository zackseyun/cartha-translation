base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: ru
  text: Пусть Яхве воздаст тебе за твой труд, и пусть твоя награда от Яхве, Бога Израиля, будет полной — ведь под Его крылья ты пришла искать убежища.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть твоя плата будет полной». Еврейское слово, переданное как «награда», может означать и плату; слова, переданные как «воздаст» и «полной», в еврейском тексте однокоренные.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: Пусть ... воздаст
  rationale: Форма пиэль выражает пожелание в благословении Вооза; «пусть воздаст» естественно передаёт и волитивность, и смысл достойного ответа на поступок Руфи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: פָּעֳלֵךְ
  choice: за твой труд
  rationale: Существительное обозначает труд, дело или поступок; в сочетании с «воздаст» русский предлог «за» ясно выражает основание воздаяния, а «труд» охватывает верность и действия Руфи.
- source_word: וּתְהִי
  choice: и пусть ... будет
  rationale: Юссив продолжает параллельное пожелание первой части стиха.
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: твоя награда
  rationale: Слово может обозначать плату или награду; здесь речь о воздаянии от Бога, поэтому «награда» наиболее естественна.
- source_word: שְׁלֵמָה
  choice: полной
  rationale: Прилагательное передаёт полноту или завершённость и перекликается с корнем שׁלם в глаголе «воздаст».
- source_word: מֵעִם
  choice: от
  rationale: Предлог указывает на источник награды.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: אֲשֶׁר בָּאת לַחֲסוֹת
  choice: под чьи ... ты пришла искать убежища
  rationale: Женский род соответствует Руфи; «пришла искать убежища» сохраняет движение и целевое значение инфинитива.
- source_word: תַּחַת כְּנָפָיו
  choice: под чьи крылья
  rationale: Сохранён исходный образ крыльев как места защиты, без замены метафоры пояснительным понятием.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Образ убежища под крыльями Бога
  choice: сохранить метафору «под чьи крылья»
  alternative: передать как «под чью защиту»
  rationale: Исходный текст прямо использует образ крыльев; его сохранение не устраняет богословскую и поэтическую насыщенность выражения.
translation_notes:
  register: Современный литературный русский язык с достойной, но понятной формой благословения. Параллелизм двух пожеланий сохранён; метафора крыльев передана буквально. Маркер сноски поставлен после всего стиха, поскольку поясняет взаимосвязанные слова в обеих его частях.
