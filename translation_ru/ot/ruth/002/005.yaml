  text: וַ/יֹּ֤אמֶר בֹּ֨עַז֙ לְ/נַעֲר֔/וֹ הַ/נִּצָּ֖ב עַל הַ/קּֽוֹצְרִ֑ים לְ/מִ֖י הַ/נַּעֲרָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/005.yaml
  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
translation:
  language: ru
  text: 'Тогда Вооз спросил своего слугу, поставленного над жнецами: «Чья это молодая женщина?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кому принадлежит эта молодая женщина?» Еврейский вопрос может касаться её принадлежности к семье или дому.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... спросил
  rationale: Вав с последовательным имперфектом продвигает повествование; «тогда» естественно передаёт последовательность. По контексту глагол речи вводит вопрос, поэтому по-русски уместно «спросил».
- source_word: בֹּעַז
  choice: Вооз
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
- source_word: לְנַעֲרוֹ
  choice: своего слугу
  rationale: נַעַר может обозначать молодого человека, слугу или помощника. Здесь лицо исполняет служебную надзорную роль; «слуга» звучит естественно и не дублирует последующее описание.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: поставленного над жнецами
  rationale: Передаёт пассивный оттенок причастия Niphal и значение порученного надзора, не сводя выражение к буквальному «стоящему над».
- source_word: לְמִי
  choice: Чья
  rationale: Кратко и естественно передаёт еврейский вопрос о принадлежности, семейной или хозяйственной связи.
- source_word: הַנַּעֲרָה
  choice: молодая женщина
  rationale: Передаёт возрастно-половое значение נַעֲרָה без архаичного «девица» и без необоснованного указания на статус служанки.
- source_word: הַזֹּאת
  choice: эта
  rationale: Прямой и естественный эквивалент указательного определения.
