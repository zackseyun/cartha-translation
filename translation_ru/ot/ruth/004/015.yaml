base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: ru
  text: Он станет для тебя тем, кто возвратит тебе жизнь[a] и поддержит тебя в старости[b], ведь его родила твоя невестка, которая любит тебя, — она для тебя лучше семерых сыновей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «восстановит твою жизнь»; буквально по-еврейски: «возвращающий жизнь (или душу)».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-еврейски: «поддерживать твою седину».'
    reason: lexical_alternative
  - marker: c
    text: Число семь часто выражает полноту или завершённость. Смысл сравнения в том, что Руфь дороже для Ноемини, чем идеализированное благословение иметь многих сыновей.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Он станет
  rationale: Форма выражает ожидаемый результат и будущее значение в словах женщин о ребёнке; «станет» естественно передаёт эту перспективу.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: тем, кто возвратит тебе жизнь
  rationale: מֵשִׁיב передаёт возвращение или восстановление, а נֶפֶשׁ здесь обозначает жизнь, человека в его жизненной полноте, а не отвлечённую «душу».
- source_word: וּלְכַלְכֵּל
  choice: и поддержит
  rationale: Глагол означает обеспечивать, питать или поддерживать; в контексте старости «поддержит» охватывает как заботу, так и обеспечение.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: тебя в старости
  rationale: Буквальный образ седины в данном контексте обозначает преклонные годы; русская формулировка естественно передаёт смысл заботы о Ноемини.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для предшествующего утверждения; «ведь» сохраняет пояснительную связь и звучит естественно по-русски.
- source_word: כַלָּתֵךְ
  choice: твоя невестка
  rationale: Это обычное контекстуальное обозначение отношений Руфи к Ноемини.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: которая любит тебя
  rationale: Перфект описывает доказанную и сохраняющуюся любовь; настоящее время хорошо передаёт устойчивый характер отношений.
- source_word: יְלָדַתּוּ
  choice: родила его
  rationale: Местоименный суффикс мужского рода относится к упомянутому ребёнку; перевод не добавляет отсутствующее в форме слово «сына».
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: она для тебя лучше
  rationale: Конструкция с מן имеет сравнительное значение и указывает на ценность Руфи для Ноемини.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: семерых сыновей
  rationale: Сохраняется прямое указание на сыновей и культурно значимое число семь, выражающее полноту желанного семейного благословения.
theological_decisions:
- issue: Передача נֶפֶשׁ
  choice: жизнь
  alternative: душа; сама ты; жизненные силы
  rationale: Контекст говорит о восстановлении жизни Ноемини и заботе о её будущем, а не формулирует учение о нематериальной душе. «Жизнь» сохраняет конкретный смысл и не вносит позднейших антропологических категорий.
- issue: Гендерно определённое сравнение מִשִּׁבְעָה בָּנִים
  choice: семерых сыновей
  alternative: семерых детей
  rationale: Еврейский текст прямо говорит о сыновьях, отражая древнее представление об их особой роли в продолжении рода и обеспечении родителей; нейтрализация устранила бы существенную часть сравнения.
- issue: Характер будущего утверждения וְהָיָה
  choice: 'утверждение о будущем результате: «станет»'
  alternative: 'пожелание: «пусть станет»'
  rationale: В контексте возможно благословительное звучание, однако форма естественно читается как уверенное утверждение женщин о том, кем ребёнок будет для Ноемини. Перевод не усиливает это до безусловного пророчества.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным синтаксисом. Сохранены образ возвращения жизни, причинная связь и культурно значимое сравнение с семью сыновьями; буквальный образ седины пояснён в сноске.
