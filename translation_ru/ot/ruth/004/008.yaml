  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: ru
  text: 'Тогда родственник, имевший право выкупа[a], сказал Воозу: «Купи для себя». И тот снял свою сандалию.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкупщик». Еврейское слово обозначает близкого родственника, который в предусмотренных случаях имел право и обязанность выкупать семейное имущество.'
    reason: lexical_alternative
  - marker: b
    text: Снятие сандалии служило принятым знаком юридического подтверждения такой сделки; см. Руфь 4:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַגֹּאֵל
  choice: родственник-выкупщик
  rationale: Термин обозначает близкого родственника, наделённого правом и обязанностью выкупать семейное имущество и поддерживать продолжение рода; составное обозначение сохраняет оба смысловых компонента.
- source_word: לְבֹעַז
  choice: Воозу
  rationale: Предлог обозначает адресата речи; имя передано в принятой русской библейской форме.
- source_word: קְנֵה לָךְ
  choice: Купи себе
  rationale: Императив קנה в данной имущественно-правовой ситуации означает покупку, а לָךְ указывает, что Вооз должен приобрести имущество для себя.
- source_word: וַיִּשְׁלֹף
  choice: И снял он
  rationale: Глагол означает вытянуть или снять; применительно к обуви естественно русское «снял». Постпозиция местоимения помогает ясно отнести действие к родственнику-выкупщику.
- source_word: נַעֲלוֹ
  choice: свою сандалию
  rationale: Древнееврейское слово обозначает обувь, в данном культурном контексте — сандалию; возвратное «свою» ясно передаёт притяжательный суффикс.
