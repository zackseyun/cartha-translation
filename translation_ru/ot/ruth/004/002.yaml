lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Основное значение לקח — «взять». В данном контексте речь идёт о привлечении старейшин к судебно-правовому разбирательству; буквальный вариант сохраняет формулировку оригинала, а возможный смысл выбора пояснён в сноске.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: десять человек
  rationale: В контексте имеются в виду десять взрослых мужчин — городских старейшин. По-русски сочетание «десять человек» естественно и не устраняет указание на их статус, выраженное далее.
- source_word: מִזִּקְנֵי הָעִיר
  choice: из числа городских старейшин
  rationale: 'Предлог מִן имеет здесь партитивный смысл: эти десять были взяты из более широкого круга признанных городских старейшин. Формулировка передаёт их общественный статус и естественно звучит по-русски.'
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Прямой и нейтральный эквивалент обычного повествовательного глагола перед повелительной репликой.
- source_word: שְׁבוּ
  choice: Сядьте
  rationale: Повелительная форма ישב приглашает старейшин занять места для разбирательства. «Сядьте» кратко и естественно передаёт это действие.
- source_word: פֹה
  choice: здесь
  rationale: Прямой и идиоматичный эквивалент указательного наречия פֹה.
- source_word: וַיֵּשֵׁבוּ
  choice: они сели
  rationale: Формулировка сохраняет повтор корня ישב и прямо описывает исполнение повеления.
