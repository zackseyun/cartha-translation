    issue: «Яхве даровал ей зачать»
    rationale: После «даровал» инфинитив «зачать» не передаёт прямо еврейское הֵרָיוֹן, существительное со значением «зачатие/беременность». Формулировка «даровал ей зачатие» и точнее, и стилистически цельнее.
  - severity: low
    issue: Вариант в примечании «Яхве дал ей забеременеть»
    rationale: Это неестественное русское выражение и менее близко к именной конструкции подлинника. Лучше дать естественный пояснительный вариант «Яхве позволил ей зачать», ясно обозначив его как смысловой.
