revisions:
- from: И взял Вооз Руфь, и она стала его женой. Он вошёл к ней, и Яхве даровал ей зачать[a], и она родила сына.
  to: Вооз взял Руфь, и она стала его женой. Он вошёл к ней, и Яхве даровал ей зачатие[a], и она родила сына.
  rationale: Исправлена передача הֵרָיוֹן с инфинитивной конструкции на существительное «зачатие», чтобы точнее отразить исходный текст. Уточнено примечание и слегка нормализован порядок слов; смысл, сдержанный регистр и эвфемизм исходного повествования сохранены.
