base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: ru
  text: Вооз взял Руфь, и она стала его женой. Он вошёл к ней, и Яхве даровал ей зачатие[a], и она родила сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Яхве дал ей зачатие»; также возможно: «Яхве позволил ей зачать».'
    reason: Еврейское הֵרָיוֹן обозначает зачатие, а в зависимости от контекста может относиться и к наступившей беременности. Примечание сохраняет буквальную именную конструкцию и даёт естественный смысловой вариант.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Сохранено прямое значение глагола לקח; брачный смысл ясно выражен следующими словами о том, что Руфь стала женой Вооза.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: она стала его женой
  rationale: Естественно передаёт древнееврейскую формулу установления брачного статуса и последовательность повествования.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: он вошёл к ней
  rationale: Сохранён сдержанный библейский эвфемизм для супружеской близости без излишнего уточнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: Яхве даровал ей зачать
  rationale: Формулировка сохраняет явную Божественную инициативу и значение зачатия/наступления беременности, оставаясь понятной в современном русском тексте.
- source_word: וַתֵּלֶד בֵּן
  choice: она родила сына
  rationale: Прямой и естественный русский эквивалент повествовательной формулы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Действующее лицо при зачатии Руфи
  choice: Яхве даровал ей зачать
  alternative: Яхве дал ей беременность; Яхве сделал её способной зачать
  rationale: Перевод сохраняет прямое утверждение исходного текста о дарующем действии Яхве, не развивая его в дополнительное богословское объяснение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксический повтор «и» сохраняет последовательное движение древнееврейского рассказа; выражение «вошёл к ней» оставлено как деликатный библейский эвфемизм.
