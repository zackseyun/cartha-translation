base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: ru
  text: 'Тогда родственник с правом выкупа[b] сказал: «Я не могу выкупить это для себя, чтобы не повредить собственному наследству. Выкупи себе моё право выкупа[a], потому что я не могу этого выкупить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «мой выкуп». Здесь еврейское существительное означает принадлежащее этому родственнику право или обязанность совершить семейный выкуп.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о ближайшем родственнике, чьё право выкупа было первоочередным перед правом Вооза.
    reason: cultural_note
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: родственник, имевший право выкупа
  rationale: Причастие от גאל обозначает человека, обладающего семейным правом и обязанностью выкупа. Развёрнутая формулировка понятна современному русскому читателю и передаёт юридический смысл без неясного неологизма «выкупщик».
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: выкупить / выкупи / то, на что имею право выкупа я
  rationale: Повторение корня גאל по возможности сохранено словами одного русского корневого ряда. Существительное גְּאֻלָּה в данном контексте обозначает принадлежащее говорящему право или обязанность семейного выкупа; конструкция с «правом выкупа» естественнее и яснее буквального «мой выкуп».
- source_word: לִי
  choice: для себя
  rationale: Дательный личной заинтересованности показывает, что выкуп затрагивал бы имущество самого говорящего.
- source_word: פֶּן
  choice: чтобы не
  rationale: В контексте выражает опасение нежелательного последствия; эта конструкция естественна в современной русской речи и не превращает опасение в утверждение неизбежного результата.
- source_word: אַשְׁחִית
  choice: не повредить
  rationale: Hiphil от שׁחת здесь означает причинить серьёзный ущерб наследственному владению, а не буквально уничтожить его. «Повредить» сохраняет широту и степень неопределённости исходного выражения.
- source_word: נַחֲלָתִי
  choice: собственному наследству
  rationale: נַחֲלָה обозначает наследственное родовое имущество. «Собственному» подчёркивает противопоставление выкупаемому владению.
- source_word: לְךָ אַתָּה
  choice: ты для себя
  rationale: Сочетание местоименного суффикса и отдельного אַתָּה эмфатично; порядок слов по-русски естественно выделяет адресата и его личную заинтересованность.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение повторного отказа и естественно передаётся причинной связью.
theological_decisions:
- issue: Характер права גְּאֻלָּה
  choice: Передать как семейное право выкупа, не уточняя здесь все связанные с ним обязанности.
  alternative: Истолковать как совокупную обязанность выкупить землю и вступить в брак с Руфью.
  rationale: Сам стих называет выкуп и наследство, но не формулирует брачное обязательство прямо. Более широкая сюжетная связь важна, однако её не следует превращать в явное содержание данного выражения.
translation_notes:
  register: Современный литературный русский язык с ясной юридической лексикой. Синтаксис прямой речи сохраняет настойчивое повторение отказа и корневую связь слов о выкупе; архаизмы и конфессионально окрашенные термины не используются. Маркеры сносок размещены у тех выражений, которые они поясняют.
