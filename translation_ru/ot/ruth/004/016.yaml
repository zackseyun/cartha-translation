lexical_decisions:
- source_word: וַתִּקַּח
  choice: взяла
  rationale: Обычное значение לקח в данной последовательности повествовательных форм; контекст описывает физическое действие с ребёнком.
- source_word: הַיֶּלֶד
  choice: ребёнка
  rationale: יֶלֶד может означать ребёнка или мальчика; в контексте речь идёт о новорождённом, поэтому «ребёнок» естественнее.
- source_word: וַתְּשִׁתֵהוּ
  choice: положила его
  rationale: Глагол означает «поместить, положить»; выбран естественный русский оборот для младенца.
- source_word: בְחֵיקָהּ
  choice: к себе на колени
  rationale: חֵיק обозначает область груди или коленей; этот вариант сохраняет телесный образ и звучит естественно по-русски, не уточняя, что ребёнка приложили к груди.
- source_word: וַתְּהִי לוֹ
  choice: стала … о нём
  rationale: Конструкция היה + ל указывает на возникшую роль или отношение; по-русски это естественно передаётся глаголом «стала».
- source_word: לְאֹמֶנֶת
  choice: стала заботиться о нём и растить его
  rationale: אֹמֶנֶת обозначает женщину, которая опекает и растит ребёнка. Описательная передача ясна современному читателю и не создаёт узкого впечатления, будто речь обязательно идёт о грудном вскармливании или медицинской профессии.
