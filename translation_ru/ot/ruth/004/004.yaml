base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: ru
  text: 'И я решил сообщить тебе[a]: «Купи её в присутствии сидящих здесь и старейшин моего народа. Если ты выкупишь её, выкупи; а если он не выкупит её[b], скажи мне, чтобы я знал, потому что, кроме тебя, выкупить её некому, а после тебя — я». Он ответил: «Я выкуплю её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыть твоё ухо» — еврейская идиома со значением «сообщить тебе» или «поставить тебя в известность».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит форма «если он не выкупит». По контексту некоторые понимают её как «если ты не выкупишь», устраняя переход от второго лица к третьему.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: сообщить тебе
  rationale: Буквально выражение означает «открыть твоё ухо», но это идиома со значением «поставить в известность, сообщить». Выбран естественный современный русский эквивалент; буквальный образ сохранён в сноске.
- source_word: קְנֵה
  choice: купи её
  rationale: В данном юридическом контексте קנה означает приобрести имущество посредством покупки. «Купи» звучит естественно и прямо; местоимение «её» отсылает к земле, о которой идёт речь в контексте.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: перед сидящими здесь
  rationale: נגד обозначает совершение действия в присутствии свидетелей, а причастие הַיֹּשְׁבִים буквально указывает на сидящих. Добавление «здесь» естественно передаёт непосредственную обстановку у ворот.
- source_word: זִקְנֵי עַמִּי
  choice: старейшинами моего народа
  rationale: Сохраняется прямое значение עַמִּי — «моего народа» — без неоправданного сужения до рода или клана.
- source_word: תִּגְאַל ... גְּאָל
  choice: если ты выкупишь её, выкупи
  rationale: Повтор корня גאל сохранён ради присущего еврейскому тексту юридического акцента. «Выкупить» ясно передаёт осуществление родственного права выкупа земли.
- source_word: וְאִם לֹא יִגְאַל
  choice: а если он не выкупит её
  rationale: Сохранена форма третьего лица единственного числа маскулинного рода в масоретском тексте, несмотря на её резкий переход от обращения во втором лице. Возможное контекстуальное понимание как второго лица указано в сноске.
- source_word: הַגִּידָה לִּי
  choice: скажи мне
  rationale: Прямой императив передан простым и естественным русским выражением, подходящим для живой речи в официальной обстановке.
- source_word: אֵין זוּלָתְךָ
  choice: кроме тебя, ... некому
  rationale: 'Русская отрицательная конструкция естественно и точно выражает исключительность: иного лица с преимущественным правом нет.'
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: а после тебя — я
  rationale: Фраза указывает на очерёдность юридического права или обязанности. Краткая русская конструкция сохраняет эту последовательность без лишнего истолкования.
- source_word: אָנֹכִי אֶגְאָל
  choice: я выкуплю её
  rationale: Ответ прямо принимает право и обязанность выкупа; объект восполнен из ближайшего контекста ради естественности русского языка.
theological_decisions:
- issue: Передача גאל в родственном и имущественно-правовом контексте
  choice: выкупить
  alternative: исполнить обязанности родственника-выкупщика; возвратить себе за выкуп
  rationale: «Выкупить» сохраняет ключевую юридическую и богословскую лексику, не вставляя в каждый случай развёрнутое толкование роли родственника-выкупщика и не сводя действие к обычной покупке.
- issue: Смена второго лица на третье в וְאִם לֹא יִגְאַל
  choice: если он не выкупит её
  alternative: если ты не выкупишь её
  rationale: Основной текст следует масоретской огласовке и сохраняет реальную грамматическую напряжённость. Более гладкое контекстуальное прочтение не подставлено молча, а отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим публично-правовой сцене у городских ворот. Повтор «выкупишь — выкупи» намеренно сохранён как особенность исходного текста; резкая смена лица также не сглажена. Местоимение женского рода отсылает к выкупаемой земле в ближайшем контексте.
