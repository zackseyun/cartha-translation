lexical_decisions:
- source_word: עַמִּינָדָב
  choice: Амминадав
  rationale: Личное имя передано современной русской транслитерацией еврейской формы с сохранением удвоенного согласного.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В родословном контексте форма породы хифиль от ילד означает «произвёл на свет, стал отцом». Такой перевод естественен в современном русском языке и сохраняет мужскую линию родословия.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного лексического соответствия в русском языке; его функция выражена синтаксисом.
- source_word: נַחְשׁוֹן
  choice: Нахшон
  rationale: Личное имя передано непосредственно с еврейской формы; сочетание «хш» отражает согласные исходного имени точнее традиционной формы «Наассон».
- source_word: וְ
  choice: а
  rationale: Союз связывает две последовательные родословные формулы. Русское «а» естественно отмечает смену подлежащего без смыслового противопоставления.
- source_word: שַׂלְמָה
  choice: Салма
  rationale: Передана именно форма שַׂלְמָה масоретского текста данного стиха, без согласования с отличающимися формами имени в параллельных родословиях.
