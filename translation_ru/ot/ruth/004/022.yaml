lexical_decisions:
- source_word: וְ
  choice: а
  rationale: Союз связывает два последовательных звена родословия; во второй части русское «а» естественно продолжает цепь без выраженного противопоставления. Начальный союз отдельно не передан, поскольку стих непосредственно продолжает предыдущий перечень и по-русски начальное «и» здесь необязательно.
- source_word: עֹבֵד
  choice: Овид
  rationale: Традиционная и узнаваемая русская библейская форма личного имени.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד в родословиях означает «породил, стал отцом». Выражение «стал отцом» точно передаёт мужскую генеалогическую связь и звучит естественно в современном литературном русском.
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения, не имеющий самостоятельного соответствия в русском; его функция передана синтаксисом.
- source_word: יִשַׁי / יִשָׁי
  choice: Иессей
  rationale: Традиционная русская библейская форма имени, сохраняющая узнаваемость персонажа.
- source_word: דָּוִד
  choice: Давид
  rationale: Устоявшаяся русская форма библейского личного имени.
theological_decisions:
- issue: Передача глагола родословия
  choice: стал отцом
  alternative: родил; породил
  rationale: Выбранный вариант сохраняет биологический и генеалогический смысл еврейского הוֹלִיד, избегая как возможной для современного читателя странности мужского субъекта при «родил», так и архаического оттенка слова «породил». Дополнительных богословских утверждений перевод не вносит.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью, соответствующими заключительной строке родословия. Традиционные русские формы имён сохранены ради узнаваемости.
