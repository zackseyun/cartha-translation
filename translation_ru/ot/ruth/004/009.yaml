  text: וַ/יֹּאמֶר֩ בֹּ֨עַז לַ/זְּקֵנִ֜ים וְ/כָל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ הַ/יּ֔וֹם כִּ֤י קָנִ֨יתִי֙ אֶת כָּל אֲשֶׁ֣ר לֶֽ/אֱלִימֶ֔לֶךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/כִלְי֖וֹן וּ/מַחְל֑וֹן מִ/יַּ֖ד נָעֳמִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: ru
  text: 'Тогда Боаз сказал старейшинам и всему народу: «Сегодня вы свидетели того, что я приобрёл[a] у Нооми[b] всё, что принадлежало Элимелеху, и всё, что принадлежало Кильону и Махлону».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «купил». Еврейский глагол может обозначать приобретение посредством покупки в рамках юридической сделки.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из руки Нооми» — то есть из её владения или распоряжения.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: старейшинам и всему народу
  rationale: Сохранены обе группы участников публичной юридической процедуры; повтор предлога в русском не требуется.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Сегодня вы свидетели
  rationale: Передаёт предикативную конструкцию ясным современным русским языком, сохраняя акцент на дне совершения сделки.
- source_word: כִּי
  choice: того, что
  rationale: Союз вводит содержание свидетельства, а не причину; конструкция «свидетели того, что» естественна по-русски.
- source_word: קָנִיתִי
  choice: я приобрёл
  rationale: Глагол обозначает приобретение в юридической сделке; этот вариант не сужает смысл непременно до денежной покупки.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: всё, что принадлежало Элимелеху
  rationale: Еврейская конструкция принадлежности передана естественным русским оборотом.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: и всё, что принадлежало Кильону и Махлону
  rationale: Сохранён синтаксический параллелизм с имуществом Элимелеха и совместное упоминание двух владельцев.
- source_word: מִיַּד נָעֳמִי
  choice: у Нооми
  rationale: Буквально «из руки Нооми»; в данном юридическом контексте выражение означает получение из её владения или распоряжения. «У Нооми» естественно передаёт смысл, а образное выражение отмечено в сноске.
theological_decisions:
- issue: Характер сделки Боаза
  choice: «приобрёл» как обозначение юридического перехода имущества
  alternative: «купил» или «выкупил»
  rationale: Стих говорит обо всём, что принадлежало Элимелеху, Кильону и Махлону и находилось в распоряжении Нооми. «Приобрёл» сохраняет юридический смысл, не утверждая сверх текста ни конкретной формы оплаты, ни приобретения людей.
translation_notes:
  register: 'Современный литературный русский язык с dignified, но не архаичным звучанием. Имена переданы близко к еврейской форме: Боаз, Нооми, Элимелех, Кильон, Махлон. Юридическая торжественность публичного свидетельства сохранена без канцелярской тяжеловесности.'
