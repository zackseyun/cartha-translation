  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: ru
  text: 'Тогда женщины сказали Ноемини: «Благословен Яхве, который сегодня не оставил тебя без искупителя[a][b]! Да будет славно имя его в Израиле[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственника-искупителя», «защитника рода». Древнееврейское слово обозначает близкого родственника, который по семейному праву защищал и восстанавливал положение рода.'
    reason: lexical_alternative
  - marker: b
    text: Под «искупителем» может подразумеваться новорождённый ребёнок; однако некоторые относят это слово к Воозу, исполнившему обязанности родственника-искупителя.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «и да будет названо его имя в Израиле»; то есть пусть его имя станет известным и почитаемым среди израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Тогда … сказали
  rationale: Форма wayyiqtol продолжает последовательность повествования; «тогда» естественно передаёт переход к следующему событию.
- source_word: הַנָּשִׁים
  choice: женщины
  rationale: Определённое существительное во множественном числе обозначает женщин общины, присутствующих при происходящем.
- source_word: בָּרוּךְ יְהוָה
  choice: Благословен Яхве
  rationale: Сохранена традиционная библейская формула благословения и личное имя Бога, переданное транслитерацией тетраграмматона.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: который … не оставил тебя без
  rationale: Каузативная форма глагола שבת здесь означает не допустить отсутствия или прекращения; по-русски сочетание «не оставил тебя без» ясно и естественно выражает этот смысл.
- source_word: גֹּאֵל
  choice: искупителя
  rationale: Термин обозначает близкого родственника, который по семейному праву защищает интересы рода и восстанавливает его положение. «Искупитель» сохраняет ключевой образ книги, а юридико-родственная сторона поясняется в сноске.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественная передача временного наречия в современном русском языке.
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: Да прославится его имя
  rationale: Буквально — «и да будет названо его имя». В контексте благословения выражение говорит о том, что имя станет известным и почитаемым; выбранная формулировка передаёт идиоматический смысл.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предложная конструкция обозначает среду, среди которой имя будет известно и почитаемо.
theological_decisions:
- issue: Кого обозначает «искупитель» (גֹּאֵל)
  choice: В основном тексте слово «искупитель» оставлено без уточнения личности.
  alternative: Речь может идти непосредственно о новорождённом ребёнке, который восстановит жизнь Ноемини, либо о Воозе как родственнике-искупителе, благодаря которому родился ребёнок.
  rationale: Ближайший контекст рождения и последующее упоминание «его имени» указывают прежде всего на ребёнка, однако юридическая и повествовательная роль Вооза также остаётся значимой. Перевод не устраняет неоднозначность древнееврейского текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой благословения. Имя יהוה передано как «Яхве». Синтаксис сохраняет краткость и возвышенность реплики женщин, не становясь архаичным.
