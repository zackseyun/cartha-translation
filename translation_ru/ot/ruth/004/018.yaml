lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Формула вводит новый раздел — родословную. «Вот» естественно передаёт указательно-вводную функцию сочетания, не добавляя временного значения.
- source_word: תּוֹלְדוֹת
  choice: родословие
  rationale: В данном контексте существительное вводит генеалогический перечень. «Родословие» естественно и точно передаёт эту функцию в современном русском языке.
- source_word: פָּרֶץ
  choice: Фарес
  rationale: Использована устоявшаяся русская библейская форма имени, соответствующая еврейскому פֶּרֶץ.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Каузативная форма ילד в генеалогии означает «породил, стал отцом». Выбран современный и достойный русский оборот без архаизма «родил» применительно к мужчине.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель определённого прямого дополнения не имеет отдельного соответствия в русском языке.
- source_word: חֶצְרוֹן
  choice: Есром
  rationale: Использована устоявшаяся русская библейская форма имени Хецрон.
