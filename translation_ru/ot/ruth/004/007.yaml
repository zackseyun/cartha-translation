base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: ru
  text: 'Прежде в Израиле при выкупе и обмене был такой обычай: чтобы подтвердить всякое дело[a], человек снимал свою сандалию и отдавал её своему ближнему; это и было свидетельством в Израиле[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы утвердить всякую договорённость».'
    reason: Слово דָּבָר имеет широкий смысл («дело», «слово»); в данном контексте оно может обозначать договорённость или сделку.
  - marker: b
    text: 'Или: «это было удостоверением в Израиле».'
    reason: הַתְּעוּדָה может обозначать свидетельство либо формальное удостоверение; основной текст сохраняет образную и юридически не суженную формулировку.
lexical_decisions:
- source_word: לְפָנִים
  choice: прежде
  rationale: Кратко и естественно передаёт указание на существовавший в прошлом обычай.
- source_word: הַגְּאוּלָּה
  choice: выкуп
  rationale: Передаёт юридически значимый выкуп имущества в контексте родственного права, не вводя лишней конфессиональной терминологии.
- source_word: הַתְּמוּרָה
  choice: обмен
  rationale: Сохраняет прямое значение обмена или передачи взамен чего-либо, не уточняя спорный правовой механизм.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: чтобы подтвердить всякое дело
  rationale: Сохраняет широкий смысл כָּל דָּבָר и юридическую силу глагола קום в породе пиэль.
- source_word: שָׁלַף ... נַעֲלוֹ
  choice: снимал свою сандалию
  rationale: Естественно по-русски передаёт конкретное действие и культурно уместный вид обуви.
- source_word: לְרֵעֵהוּ
  choice: отдавал другому
  rationale: В данном юридическом контексте речь идёт о другой стороне дела; это яснее современному читателю, чем буквальное «ближнему своему».
- source_word: הַתְּעוּדָה
  choice: так ... удостоверяли сделку
  rationale: Функционально передаёт свидетельствующий и подтверждающий характер обряда; дополнение «сделку» определяется юридическим контекстом.
