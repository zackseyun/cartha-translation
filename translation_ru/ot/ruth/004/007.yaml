- from: А прежде в Израиле при выкупе и обмене, чтобы подтвердить всякое дело[a], один человек снимал свою сандалию и отдавал другому; так в Израиле удостоверяли сделку[b].
  to: 'Прежде в Израиле при выкупе и обмене был такой обычай: чтобы подтвердить всякое дело[a], человек снимал свою сандалию и отдавал её своему ближнему; это и было свидетельством в Израиле[b].'
  rationale: 'Исправление ближе воспроизводит пояснительную конструкцию еврейского текста: прежний обычай, его цель, конкретное действие и его статус как свидетельства. Убраны добавленный противительный оттенок и сужение до одной «сделки», при этом сохранены современный литературный русский и необходимые юридические оттенки.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:39:05Z'
