  - severity: low
    issue: Формы имён «Фарес» и «Фамарь»
    rationale: Это традиционные русские формы, но «Перец» и «Тамар» точнее отражают еврейские פֶּרֶץ и תָּמָר и лучше соответствуют исходному тексту и английской аудиторской записи Perez/Tamar.
