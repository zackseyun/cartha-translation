base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: ru
  text: И пусть твой дом будет подобен дому Переца[a], которого Тамар родила Иуде, — из потомства[b], которое Яхве даст тебе от этой молодой женщины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом» здесь означает не только жилище, но также семью, род и линию потомков.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «из семени». Еврейское слово «семя» часто употребляется в значении «потомство» или «потомки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: И пусть ... будет
  rationale: Форма выражает пожелание-благословение; русское «пусть» естественно передаёт оптативный смысл.
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: твой дом / дому Фареса
  rationale: Сохраняется еврейский образ «дома», включающий семью, род и линию потомков.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: которого Фамарь родила Иуде
  rationale: Прямо передаёт относительное предложение, глагол рождения и генеалогическое значение предлога ל.
- source_word: מִן הַזֶּרַע
  choice: благодаря потомству
  rationale: Первое מִן естественно понимается как основание или средство исполнения благословения; «потомство» передаёт идиоматическое значение זֶרַע, тогда как буквальное «семя» здесь менее ясно.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: которое Яхве даст тебе
  rationale: Имперфект в контексте благословения выражает ожидаемый Божий дар; имя יְהוָה передано как «Яхве».
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: от этой молодой женщины
  rationale: «Молодая женщина» точно передаёт נַעֲרָה, а «от» сохраняет значение происхождения потомства, выраженное מִן.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение בֵּית в родовом благословении
  choice: дом
  alternative: семья / род
  rationale: '«Дом» сохраняет многозначность еврейского образа: домашнее сообщество, семью и родовую линию.'
- issue: Синтаксическая роль מִן הַזֶּרַע
  choice: благодаря потомству
  alternative: от потомства / через потомство
  rationale: Связь может обозначать источник, средство или основание уподобления. Основной текст выбирает естественное по-русски понимание, а примечание сохраняет формальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией благословения. Традиционные русские формы библейских имён «Фарес», «Фамарь» и «Иуда» обеспечивают узнаваемость; синтаксис остаётся ясным для обычного читателя.
