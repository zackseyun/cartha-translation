  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: Хецрон
  rationale: Личное имя передано транслитерацией непосредственно с еврейского; начальный союз не выделен отдельно, поскольку стих продолжает генеалогическую цепь, а по-русски такое начало естественно без союза.
- source_word: הוֹלִיד
  choice: родил
  rationale: В породной генеалогической формуле каузативная форма глагола ילד означает «стал отцом / произвёл на свет». Краткое «родил» естественно для русской библейской родословной и сохраняет мужскую генеалогическую связь.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском; его функция выражена винительным падежом имени.
- source_word: רָם
  choice: Рам
  rationale: Личное имя транслитерировано с масоретского еврейского текста без замены формой, восходящей к греческой традиции.
- source_word: וְ/רָם
  choice: а Рам
  rationale: Союз связывает последовательные звенья родословной. Русское «а» естественно отмечает смену подлежащего без смыслового противопоставления.
- source_word: הוֹלִיד
  choice: родил
  rationale: Повтор исходного глагола сохранён одинаковым русским соответствием ради ритма и точности генеалогической формулы.
- source_word: עַמִּינָדָב
  choice: Амминадав
  rationale: Имя транслитерировано с еврейского; удвоенное «мм» отражает дагеш в מ и отличает исходную форму от традиционного варианта «Аминадав».
