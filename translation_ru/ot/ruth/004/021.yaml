lexical_decisions:
- source_word: וְ/שַׂלְמוֹן
  choice: И Салмон
  rationale: Союз וְ передан как «и», чтобы сохранить последовательность и многосоюзие еврейского родословия; имя передано в принятой русской библейской форме «Салмон».
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד в родословиях означает «породил, стал отцом». Выражение «стал отцом» естественно для современного русского языка и сохраняет мужскую генеалогическую связь.
- source_word: אֶת
  choice: не переводится
  rationale: Частица אֶת служит показателем определённого прямого дополнения и не имеет отдельного соответствия в русском тексте.
- source_word: בֹּעַז
  choice: Вооза
  rationale: Использована традиционная русская библейская форма имени «Вооз» в винительном падеже.
- source_word: וּ/בֹעַז
  choice: а Вооз
  rationale: Присоединительный союз передан как «а», что естественно связывает последовательные звенья родословия и при этом сохраняет явную координацию оригинала.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Повторён тот же эквивалент ради единообразия формулы родословия.
- source_word: עוֹבֵד
  choice: Овида
  rationale: Использована традиционная русская библейская форма имени «Овид» в винительном падеже.
