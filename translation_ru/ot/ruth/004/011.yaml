base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: ru
  text: 'И весь народ, бывший у ворот, и старейшины сказали: «Мы свидетели. Пусть Яхве сделает женщину, входящую в твой дом, подобной Рахили и Лии, которые вдвоём построили дом Израиля. Да преуспеешь ты[a] в Ефрафе и приобрети себе имя в Вифлееме».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прояви доблесть», «покажи свою состоятельность» или «приобрети богатство». Еврейское выражение может обозначать силу, доблесть, состоятельность, богатство или успешное преуспевание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: Мы свидетели
  rationale: Именное еврейское высказывание естественно передаётся по-русски с подразумеваемой связкой «мы»; это формула публичного свидетельства.
- source_word: יִתֵּן יְהוָה
  choice: Пусть Яхве сделает
  rationale: Форма выражает пожелание; נתן буквально означает «дать», но в конструкции с объектом и сравнением имеет смысл «сделать … подобной».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: женщину, входящую в твой дом
  rationale: Сохранены причастная форма и конкретный образ вступления женщины в дом через брак.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: которые вдвоём создали дом Израиля
  rationale: «Создали дом» сохраняет метафору בנָה и одновременно естественно указывает на основание рода; «вдвоём» передаёт שְׁתֵּיהֶם.
- source_word: וַעֲשֵׂה חַיִל
  choice: Преуспевай
  rationale: В контексте брачного благословения выражает пожелание успеха и благополучия, при этом широкий диапазон חַיִל отмечен в сноске.
- source_word: בְּאֶפְרָתָה
  choice: в Ефрафе
  rationale: Сохранено древнее географическое название, связанное с областью Вифлеема.
- source_word: וּקְרָא שֵׁם
  choice: прославь своё имя
  rationale: Буквально выражение связано с «провозглашением имени», но здесь означает приобретение известности и доброй славы; добавленное «своё» естественно раскрывает подразумеваемый смысл.
- source_word: בְּבֵית לָחֶם
  choice: в Вифлееме
  rationale: Употреблена традиционная русская форма географического названия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Образ Рахили и Лии как создавших дом Израиля
  choice: которые вдвоём создали дом Израиля
  alternative: которые вдвоём построили дом Израиля
  rationale: Сохранена библейская метафора основания рода без уточнения роли служанок и без внесения богословского объяснения, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной брачной формулы. Синтаксис сохраняет последовательность коллективного свидетельства и благословения; традиционные русские формы библейских имён употреблены без архаизации.
