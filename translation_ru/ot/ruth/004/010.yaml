  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: ru
  text: Также и Руфь, моавитянку, жену Махлона, я приобрёл себе в жёны[a], чтобы закрепить имя умершего за его наследственным уделом, чтобы имя умершего не пресеклось среди его братьев[b] и у ворот его города[c]. Сегодня вы свидетели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я купил себе в жёны». Древнееврейский глагол может обозначать приобретение посредством покупки в рамках юридической сделки.'
    reason: lexical_alternative
  - marker: b
    text: То есть чтобы сохранить род умершего, а также его общественно-правовое имя в связи с наследственным уделом.
    reason: cultural_note
  - marker: c
    text: Городские ворота служили общественным местом, где при свидетелях разбирали и утверждали юридические дела.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Также и
  rationale: Передаёт присоединительное значение и связь с предшествующим объявлением о законной сделке.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: Руфь-моавитянку
  rationale: Естественно передаёт имя и женскую форму этнонима в современном русском языке.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: жену Махлона
  rationale: Следует буквальному значению древнееврейского сочетания; в самом тексте употреблено «жена», а не специальное слово «вдова».
- source_word: קָנִיתִי לִי לְאִשָּׁה
  choice: я приобрёл себе в жёны
  rationale: Сохраняет юридически-сделочный оттенок глагола קנה и одновременно ясно выражает брачную цель, не сводя высказывание к покупке человека.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: чтобы восстановить имя умершего
  rationale: Передаёт образ «поднять/поставить имя» естественным русским выражением, сохраняя мысль о продолжении рода и общественно-правового положения умершего.
- source_word: עַל נַחֲלָתוֹ
  choice: в его наследственном уделе
  rationale: Связывает имя умершего с принадлежавшим ему наследственным владением; «удел» сохраняет земельно-наследственный смысл נַחֲלָה.
- source_word: וְלֹא יִכָּרֵת
  choice: чтобы … не пресеклось
  rationale: Глагол «пресечься» естественно применим к имени и роду и сохраняет образ прекращения, заложенный в כרת.
- source_word: מֵעִם אֶחָיו
  choice: среди его братьев
  rationale: Сохраняет прямое значение אֶחָיו, не заменяя его более широким толкованием «родственники».
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: и у ворот его города
  rationale: Передаёт ворота как место общественного признания и суда; «город» естественно выражает здесь место проживания общины.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Сегодня вы свидетели
  rationale: Ясная и торжественная формула публичного юридического засвидетельствования.
theological_decisions:
- issue: Характер действия Вооза по отношению к Руфи в контексте выкупа и восстановления наследия
  choice: «я приобрёл себе в жёны» с указанием цели — восстановить имя умершего
  alternative: «я купил себе в жёны»; «я взял себе в жёны»
  rationale: Выбранная формулировка сохраняет сделочно-правовой смысл קנה, но не усиливает представление о Руфи как о товаре и не смягчает текст до простой романтической женитьбы.
- issue: Смысл восстановления имени умершего
  choice: Сохранить одновременно родовую преемственность, общественно-правовое имя и его связь с наследственным уделом
  alternative: Понимать выражение только как рождение биологического потомка либо только как сохранение земельной собственности
  rationale: Текст соединяет имя умершего, его наследие, братьев и городские ворота; перевод не сводит эту многослойную цель к одному аспекту.
- issue: Объём значения אֶחָיו
  choice: «его братьев»
  alternative: «его родственников»; «его сородичей»
  rationale: Перевод сохраняет конкретное слово исходного текста, хотя в клановом контексте круг подразумеваемых лиц мог быть шире родных братьев.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием юридического объявления. Синтаксис сохраняет последовательность целей исходного текста, а культурно обусловленные детали поясняются в сносках без конфессионального истолкования.
