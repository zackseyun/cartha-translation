base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: ru
  text: 'Тогда соседки дали ему имя, говоря: «Ноемини родился сын»[a]. Они назвали его Овидом. Он был отцом Иессея, отца Давида.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ноемини родился сын». Соседки говорят о восстановлении семьи и рода Ноемини через ребёнка Руфи, а не о том, что Ноеминь была его биологической матерью.'
    reason: Сохранить необычную формулировку оригинала и пояснить семейное отношение, не устраняя его из основного текста.
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: соседки
  rationale: Форма женского рода во множественном числе обозначает живших по соседству женщин; «соседки» естественно и точно передаёт и пол, и местную связь.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: дали ему имя
  rationale: Русская идиома естественно передаёт буквальное «назвали ему имя» и сохраняет косвенное дополнение לוֹ.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Обычная передача еврейского инфинитива, вводящего содержание последующего высказывания.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: Ноемини родился сын
  rationale: Дательная конструкция сохраняет связь новорождённого с Ноеминью и не подменяет её более определённым словом «внук»; совершенный вид естественен для русского повествования.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: Они назвали его Овидом
  rationale: Естественная современная русская формула наречения имени, соответствующая прямой еврейской конструкции.
- source_word: עוֹבֵד
  choice: Овид
  rationale: Использована укоренившаяся русская библейская форма личного имени; значение имени («служащий», «слуга») в основном тексте не переводится.
- source_word: אֲבִי
  choice: отцом
  rationale: В данном непосредственном генеалогическом звене речь идёт об отцовстве, поэтому нет оснований расширять значение до «предок».
- source_word: יִשַׁי
  choice: Иессей
  rationale: Употреблена традиционная и узнаваемая русская библейская форма имени.
- source_word: דָוִד
  choice: Давид
  rationale: Употреблена стандартная русская форма имени.
theological_decisions:
- issue: Отношение Ноемини к новорождённому в словах «Ноемини родился сын»
  choice: Сохранить в основном тексте дательную конструкцию, не называя ребёнка внуком и не представляя Ноеминь биологической матерью прямо.
  alternative: «У Ноемини родился внук» или «Ноеминь получила сына».
  rationale: Еврейский текст намеренно передаёт взгляд соседок на восстановление семьи и рода Ноемини через ребёнка Руфи. Уточнение «внук» устранило бы литературное и семейное напряжение исходного высказывания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Традиционные русские формы имён сохранены ради узнаваемости; синтаксис сделан ясным и естественным без устранения смысловой напряжённости оригинала.
