base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: ru
  text: 'Тогда он сказал родственнику, имеющему право выкупа[a]: «Наоми, вернувшаяся из земли Моава[b], продаёт[c] участок поля, принадлежавший нашему брату Элимелеху».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть родственнику, имевшему право выкупить семейное имущество.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «с поля Моава»; это выражение означает землю или область Моава.'
    reason: cultural_note
  - marker: c
    text: 'Или: «продала». Еврейскую форму можно понять как обозначение уже совершившегося действия, однако здесь она передана настоящим временем в контексте продолжающихся переговоров.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Последовательная форма с וַ продвигает повествование; русский союз «и» сохраняет связь с предыдущим действием и звучит естественно в повествовательном стиле.
- source_word: לַגֹּאֵל
  choice: родственнику-искупителю
  rationale: גֹּאֵל обозначает родственника, наделённого семейно-правовой обязанностью выкупить имущество и защитить интересы рода. Составное обозначение передаёт обе стороны понятия и не сводит его просто к покупателю.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: участок поля
  rationale: חֶלְקָה — выделенная часть или участок; выражение «участок поля» близко к еврейскому и естественно в контексте сделки с землёй.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: принадлежавший нашему брату Элимелеху
  rationale: Конструкция с לְ выражает принадлежность или связь. «Брат» сохраняет родственный язык оригинала, который в данном контексте может обозначать не только родного брата, но и члена рода.
- source_word: מָכְרָה
  choice: продаёт
  rationale: Хотя перфект обычно представляет действие как совершившееся, в этой правовой сцене он может сообщать о продаже как о текущем деле, которое Вооз предлагает завершить. Настоящее время естественно передаёт ход переговоров, а альтернативное понимание отмечено в сноске.
- source_word: נָעֳמִי
  choice: Наоми
  rationale: Устоявшаяся русская передача личного имени.
- source_word: הַשָּׁבָה
  choice: вернувшаяся
  rationale: Форма с артиклем характеризует Наоми как ту, которая возвратилась; причастие естественно сохраняет эту определительную функцию.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: из земли Моава
  rationale: Буквально «с поля Моава»; это выражение обозначает территорию или сельскую область Моава. «Из земли Моава» ясно передаёт идиоматический географический смысл.
theological_decisions:
- issue: Значение титула גֹּאֵל
  choice: родственник-искупитель
  alternative: выкупщик; ближайший родственник
  rationale: Выбранный вариант одновременно передаёт родство и установленную законом функцию, не приписывая персонажу христологическое или иное конфессиональное значение сверх контекста.
- issue: Временной аспект מָכְרָה
  choice: продаёт
  alternative: продала
  rationale: Контекст допускает понимание продажи как ещё обсуждаемой сделки, однако форма может обозначать уже совершённое действие. Неопределённость сохранена посредством сноски.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Юридико-родовой термин раскрыт без архаизма «гоэл»; синтаксис перестроен для ясности, при этом все смысловые элементы еврейского текста сохранены.
