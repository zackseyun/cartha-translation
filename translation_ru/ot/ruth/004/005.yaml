  rationale: Исправление согласует временные формы, делает понятной юридико-родовую связь имени умершего с его наследственным владением и уточняет, что масоретское קניתי является формой «я приобрёл». Контекстуальное чтение второго лица и соответствующая текстовая неопределённость сохранены в сноске.
