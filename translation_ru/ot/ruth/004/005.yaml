revisions:
- from: 'Тогда Вооз сказал: «В тот день, когда ты приобретёшь поле у Ноемини, ты также приобретаешь[a] Руфь Моавитянку, жену умершего[b], чтобы сохранить имя умершего за его наследственным владением[c]».'
