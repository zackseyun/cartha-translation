base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: ru
  text: 'Тогда Вооз сказал: «В тот день, когда ты приобретёшь поле у Ноемини, ты также приобретёшь[a] Руфь-моавитянку, жену умершего[b], чтобы имя умершего сохранилось в его наследственном владении[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По огласовке еврейского текста буквально: «я приобрёл Руфь-моавитянку» (или: «я приобрёл Руфь-моавитянку в собственность»). Однако по контексту многие понимают здесь смысл: «ты также приобретёшь».'
    reason: textual_variant
  - marker: b
    text: 'Или: «жену покойного».'
    reason: lexical_alternative
  - marker: c
    text: То есть чтобы сохранить род умершего и его право на место в наследственном владении семьи.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: В тот день, когда ты приобретёшь
  rationale: Сохраняет юридико-временную формулу оригинала, но звучит естественно по-русски.
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Прямое обозначение конкретного обсуждаемого участка.
- source_word: מִיַּד נָעֳמִי
  choice: у Ноемини
  rationale: Естественно передаёт еврейскую идиому «из руки Ноемини», то есть переход имущества из её распоряжения.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה ... קניתי
  choice: ты также приобретаешь Руфь Моавитянку
  rationale: 'Передаёт требуемый повествовательным контекстом смысл: приобретение поля влечёт обязанность по отношению к Руфи; трудность масоретского чтения отмечена в сноске.'
- source_word: אֵשֶׁת הַמֵּת
  choice: жену умершего
  rationale: Близко к буквальному смыслу и не заменяет выражение толковательным словом «вдова».
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: чтобы сохранить имя умершего
  rationale: Русское «восстановить/воздвигнуть имя» здесь менее прозрачно; «сохранить имя» естественно выражает продолжение рода и прав умершего.
- source_word: עַל נַחֲלָתוֹ
  choice: за его наследственным владением
  rationale: Передаёт устойчивую связь имени умершего с принадлежавшим его роду наследственным участком.
theological_decisions:
- issue: Текстовая и синтаксическая трудность формы קניתי в речи Вооза
  choice: 'В основном тексте смысл обращён ко второму лицу: «ты также приобретаешь Руфь».'
  alternative: 'По огласовке масоретского текста: «я приобрёл» или «я приобретаю Руфь Моавитянку»; возможно также иное синтаксическое присоединение слов «от Руфи».'
  rationale: Ход диалога показывает, что Вооз разъясняет ближайшему родственнику последствие выкупа поля. Контекстуальный смысл дан в тексте, а подлинная неопределённость еврейской формы сохранена в сноске.
- issue: Смысл сохранения имени умершего
  choice: Сохранена юридико-родовая связь имени умершего с наследственным владением.
  alternative: Понять выражение лишь как общее увековечение памяти.
  rationale: Контекст касается продолжения семейной линии и сохранения притязания умершего в родовом наследии, а не только памяти о нём.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридический характер сцены сохранён без архаизмов; «Ноемини» и «Руфь Моавитянку» следуют устоявшейся русской библейской форме имён и этнонима.
