review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл трудного места передан верно: Вооз обращается к ближайшему родственнику и объясняет, что приобретение поля связано с Руфью и сохранением имени умершего. Однако в русском тексте нужно устранить несогласование будущего «приобретёшь» с настоящим «приобретаешь» и точнее передать связь имени умершего с наследственным владением. Сноска a неточно представляет масоретскую форму קניתי как возможное настоящее время; это форма 1-го лица ед. числа перфекта.'
  naturalness: 'Фраза «ты также приобретаешь» после «когда ты приобретёшь» звучит грамматически и стилистически неровно. Оборот «сохранить имя умершего за его наследственным владением» в современном русском неясен: «сохранить за» обычно означает закрепить право, а не передаёт еврейскую формулу о сохранении имени в связи с уделом. Исправленная формулировка остаётся литературной и юридически окрашенной.'
  terminology: «Поле», «Руфь-моавитянка», «жена умершего» и «наследственное владение» уместны. «Жена умершего» сохраняет буквальность אֵשֶׁת הַמֵּת, не подменяя её словом «вдова». Формулировка «сохранилось в его наследственном владении» естественно передаёт לְהָקִים שֵׁם ... עַל נַחֲלָתוֹ, не навязывая более конкретного механизма.
  issues:
  - severity: medium
    issue: Временная форма в главном тексте
    rationale: 'Сочетание «когда ты приобретёшь ... ты также приобретаешь» неестественно. Для контекстуального второго лица следует последовательно употребить будущее: «ты также приобретёшь».'
  - severity: medium
    issue: Передача עַל נַחֲלָתוֹ
    rationale: «Сохранить имя умершего за его наследственным владением» неясно и может читаться как юридическое закрепление имени «за» имуществом. Нужна формулировка, выражающая сохранение имени в связи с наследственным владением.
  - severity: medium
    issue: 'Сноска a: значение קניתי'
    rationale: 'Огласованная форма קָנִיתִי — перфект первого лица: «я приобрёл» / «я приобрёл в собственность», а не «я приобретаю». Неопределённость контекстуального понимания следует сохранить, но морфологию не следует описывать неточно.'
