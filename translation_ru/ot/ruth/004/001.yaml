base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: ru
  text: 'Вооз пошёл к городским воротам и сел там[a]. И вот, мимо проходил тот самый родственник-выкупщик, о котором говорил Вооз. Вооз сказал ему: «Подойди и сядь здесь, такой-то[b]». Тот подошёл и сел.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У городских ворот проходили публичные собрания, в том числе разбирательства по правовым и общественным делам.
    reason: cultural_note
  - marker: b
    text: Еврейское выражение «Пелони Алмони» — намеренно безымянное обозначение человека, подобное «такой-то».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: поднялся к городским воротам
  rationale: Сохраняет основное значение עָלָה («подниматься») и естественно обозначает движение к месту действия; «городским» проясняет, о каких воротах идёт речь.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательный повествовательный маркер, привлекающий внимание к своевременному появлению человека.
- source_word: הַגֹּאֵל
  choice: родственник-выкупщик
  rationale: Сочетание передаёт как родственную связь, так и предусмотренную обычаем и правом обязанность выкупа, не сводя значение лишь к ближайшему родственнику.
- source_word: עֹבֵר
  choice: мимо проходил
  rationale: Передаёт продолжающееся действие, выраженное причастием.
- source_word: אֲשֶׁר דִּבֶּר בֹּעַז
  choice: о котором говорил Вооз
  rationale: Естественно идентифицирует человека как ранее упомянутого Воозом без излишнего уточнения времени.
- source_word: סוּרָה שְׁבָה פֹה
  choice: Сверни сюда и присядь
  rationale: Передаёт отход человека с его пути и приглашение занять место; в русском это звучит естественнее буквального «уклонись, сядь здесь».
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: такой-то
  rationale: Русский заполнитель имени сохраняет намеренную безымянность человека; мужской род понятен из контекста.
- source_word: וַיָּסַר וַיֵּשֵׁב
  choice: Тот свернул и сел
  rationale: Сохраняет лексическое соответствие повелениям Вооза и подчёркивает исполнение приглашения.
theological_decisions:
- issue: Значение правового термина גֹּאֵל
  choice: родственник-выкупщик
  alternative: выкупщик; ближайший родственник
  rationale: Выбранный вариант удерживает одновременно семейный и правовой аспекты термина, не приписывая персонажу более узкий статус, чем прямо выражено здесь.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским повествовательным регистром. Частица «вот» сохраняет живость сцены. Намеренно безымянное обращение передано как «такой-то» без искусственного титула.
