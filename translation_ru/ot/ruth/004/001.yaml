  source_fidelity: В целом перевод точно передаёт последовательность действий, הִנֵּה («и вот»), participial עֹבֵר («проходил мимо») и намеренную безымянность פְּלֹנִי אַלְמֹנִי («такой-то»). Однако «поднялся к городским воротам» несколько неестественно и может создать ненужный образ физического подъёма к воротам; в русском нейтральнее «пошёл к воротам».
  naturalness: 'Современный литературный регистр в целом выдержан. «Сверни сюда» звучит разговорно и пространственно не вполне ясно: סוּרָה означает отойти/свернуть с пути к Воозу, а не обязательно «сюда». «Подойди и сядь здесь» естественно и передаёт приглашение оставить путь и присоединиться к Воозу.'
  terminology: «Родственник-выкупщик» удачно передаёт גֹּאֵל в данном правовом и семейном контексте, не навязывая конфессионального толкования. «Такой-то» — естественный русский аналог намеренно не названного имени; сноска к нему полезна, поскольку это особый еврейский оборот.
