base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: ru
  text: Тогда она встала вместе со своими невестками и отправилась обратно с полей Моава, потому что там, в Моаве, услышала, что Яхве посетил Свой народ, чтобы дать им пищу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб». Еврейское לֶחֶם может означать как хлеб, так и пищу вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Тогда она встала
  rationale: Форма wayyiqtol продолжает последовательность событий; «тогда» ясно передаёт движение повествования, а «встала» сохраняет образ исходного глагола קום.
- source_word: וְכַלֹּתֶיהָ
  choice: вместе со своими невестками
  rationale: Союз перед существительным в данном контексте естественно выражает сопровождение; русский оборот ясно показывает, что невестки отправились с ней.
- source_word: וַתָּשָׁב
  choice: отправилась обратно
  rationale: Глагол שׁוב означает возвращение или движение назад. Поскольку Ноеминь ещё только начинает путь, «отправилась обратно» естественнее, чем завершённое «вернулась».
- source_word: מִשְּׂדֵי מוֹאָב
  choice: с полей Моава
  rationale: Сохранён конкретный образ множественного שׂדי, которое также может обозначать область или земли страны.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: там, в Моаве
  rationale: Еврейское выражение указывает на местонахождение Ноемини, когда она услышала весть. Буквальное «на поле Моава» в современном русском создало бы ложное впечатление об одном конкретном сельскохозяйственном поле.
- source_word: פָּקַד
  choice: посетил
  rationale: Глагол פקד здесь обозначает благосклонное вмешательство Яхве ради Своего народа. «Посетил» сохраняет библейский образ и не уточняет сверх текста способ оказанной помощи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: Возвратное притяжательное местоимение естественно для русского языка и сохраняет отношения принадлежности, выраженные еврейским суффиксом.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: дав ему пищу
  rationale: Инфинитив выражает результат благосклонного посещения. לֶחֶם буквально означает хлеб, но здесь может обозначать пищу вообще на фоне голода; буквальный вариант отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Значение פקד применительно к Божьему действию
  choice: посетил Свой народ
  alternative: позаботился о Своём народе; пришёл на помощь Своему народу
  rationale: «Посетил» сохраняет образ исходного глагола и его оттенок действенного благоволения, не сводя значение только к заботе или избавлению.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Конструкция «отправилась обратно» показывает начало возвращения, а не его завершение. Повтор географического обозначения слегка сглажен во второй части ради естественности русского языка; образ «полей Моава» сохранён при первом упоминании.
