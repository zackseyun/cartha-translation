  text: וַ/יָּ֥מָת אֱלִימֶ֖לֶךְ אִ֣ישׁ נָעֳמִ֑י וַ/תִּשָּׁאֵ֥ר הִ֖יא וּ/שְׁנֵ֥י בָנֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: ru
  text: Елимелех, муж Ноемини, умер, и она осталась с двумя сыновьями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и осталась она и двое её сыновей».'
    reason: Сноска сохраняет формальное строение еврейской фразы, где Ноеминь названа первым субъектом в единственном числе, а двое сыновей присоединены после неё.
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Форма wayyiqtol продолжает последовательное повествование; в русском связь естественно передаётся союзом «и», без обязательного добавления «затем».
- source_word: אֱלִימֶלֶךְ
  choice: Елимелех
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: אִישׁ נָעֳמִי
  choice: муж Ноемини
  rationale: В сочетании с именем женщины אִישׁ здесь обозначает мужа, а не просто мужчину; русская конструкция прямо и естественно передаёт брачное отношение.
- source_word: וַתִּשָּׁאֵר
  choice: она осталась
  rationale: Глагол שׁאר описывает того, кто остался после смерти близкого. Русское «осталась» сохраняет результат утраты и звучит естественнее буквального пассива.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: она осталась с двумя сыновьями
  rationale: Идиоматическая русская конструкция ясно сообщает, что после смерти Елимелеха остались Ноеминь и оба её сына; необычное согласование и присоединение второго субъекта в еврейском отражены в сноске.
