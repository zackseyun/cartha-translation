  source_fidelity: 'Основной смысл передан верно: два повеления, обращение «дочери мои», возраст Ноемини, гипотетическая последовательность и именно «сыновья» сохранены. «Выйти замуж» — допустимый естественный эквивалент להיות לאיש, однако он несколько конкретизирует еврейское реляционное выражение «быть/принадлежать мужу»; это следует отметить сноской. Гипотетическая незавершённость в конце стиха должна быть сохранена.'
  naturalness: Текст в целом литературен и понятен. «Даже если бы этой ночью я вышла замуж и родила сыновей» может создать ненамеренное впечатление, что и брак, и рождение должны произойти в одну ночь. Формулировка «обрела мужа этой ночью и родила сыновей» лучше сохраняет временной акцент на обретении мужа и не меняет аргумента.
  terminology: «Дочери мои», «надежда» и «сыновья» уместны. Сохранение «сыновей», а не нейтрального «детей», необходимо. Следует восстановить сноску к брачной идиоме, соответствующую английскому аудиторскому следу, и поставить её у релевантного русского выражения, а не у первого повеления.
