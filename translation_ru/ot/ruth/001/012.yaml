  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: ru
  text: 'Возвращайтесь, дочери мои, идите, ведь я уже слишком стара, чтобы выйти замуж[a]. Даже если бы я сказала[b]: «У меня есть надежда», — даже если бы я обрела мужа этой ночью и родила сыновей, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иметь мужа». Буквально: «быть для мужчины/мужа».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст выстраивает цепь предположений: «Если бы я сказала: „У меня есть надежда“, — даже если бы этой ночью у меня был муж и я родила сыновей…»'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: Возвращайтесь
  rationale: Повелительная форма женского рода множественного числа от שוב; в контексте Ноеминь убеждает обеих женщин вернуться и не сопровождать её дальше.
- source_word: בְנֹתַי
  choice: дочери мои
  rationale: Сохраняет буквальное родственное обращение, его сердечность и достоинство речи.
- source_word: לֵכְנָה
  choice: идите
  rationale: Второе повеление женского рода множественного числа; естественно передаёт призыв продолжать путь отдельно от Ноемини.
- source_word: זָקַנְתִּי
  choice: я уже слишком стара
  rationale: Перфект обозначает наступившее состояние; «слишком стара» выражает подразумеваемую невозможность реалистично рассчитывать на новый брак.
- source_word: מִהְיוֹת לְאִישׁ
  choice: чтобы выйти замуж
  rationale: Буквально «быть мужчине/мужу»; русский идиоматический эквивалент «выйти замуж» ясно передаёт брачный смысл без неестественной кальки.
- source_word: כִּי אָמַרְתִּי
  choice: Даже если бы я сказала
  rationale: Вводит гипотетическую цепь всё менее вероятных условий, а не простое причинное пояснение.
- source_word: יֶשׁ לִי תִקְוָה
  choice: У меня есть надежда
  rationale: Естественно передаёт еврейскую экзистенциальную конструкцию, сохраняя само слово «надежда» без добавочного истолкования.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: даже если бы этой ночью я вышла замуж
  rationale: Передаёт воображаемое немедленное обретение мужа и подчёркивает הַלַּיְלָה «этой ночью»; брачная формулировка естественна по-русски.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: и родила сыновей
  rationale: Сохраняет буквальное указание на рождение именно сыновей, существенное для дальнейшего довода Ноемини.
theological_decisions:
- issue: Мужской род потомства в контексте семейного продолжения
  choice: сыновей
  alternative: детей
  rationale: В еврейском тексте прямо стоит בָנִים «сыновья»; довод следующего стиха предполагает потенциальных мужей для Руфи и Орфы, поэтому нейтрализация неоправданна.
- issue: Степень определённости гипотетической цепи
  choice: Даже если бы… даже если бы…
  alternative: Если бы… и также…
  rationale: Повтор «даже» передаёт нарастание заведомо невероятных допущений, не превращая их в утверждение о реальной надежде Ноемини.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Брачная идиома передана естественным выражением «выйти замуж»; синтаксическая незавершённость в конце сохранена, поскольку мысль продолжается в следующем стихе.
