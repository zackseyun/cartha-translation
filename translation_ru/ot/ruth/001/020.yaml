base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: ru
  text: 'Но она сказала им: «Не называйте меня Ноеминью[a], называйте меня Марой, потому что Всемогущий сделал меня очень горькой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Ноеминь» связано с приятностью, а «Мара» означает «горькая».
    reason: Игра значений имён существенна для смысла слов Ноемини, но не выражена переводом имён в основном тексте.
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: Но она сказала им
  rationale: Противительное «но» естественно передаёт ответ-коррекцию Ноемини; местоимение относится к женщинам Вифлеема, что ясно из контекста.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: Не называйте меня Ноеминью
  rationale: קרא в сочетании с именем означает «называть»; творительный падеж после русского «называть» обеспечивает естественную современную формулировку.
- source_word: קְרֶאןָ לִי מָרָא
  choice: называйте меня Марой
  rationale: Повтор глагола сохраняет риторическое противопоставление двух имён; личное обозначение транслитерируется, а его смысл поясняется в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит названную Ноеминью причину смены имени.
- source_word: הֵמַר ... לִי מְאֹד
  choice: сделал мою жизнь весьма горькой
  rationale: Каузативная форма מרר допускает значение «сделал горьким». Добавление «мою жизнь» естественно выражает затронувший её опыт и избегает неясного русского «сделал меня горькой», сохраняя словесную связь с именем Мара.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Божественный титул передан традиционным и семантически прозрачным русским соответствием.
theological_decisions:
- issue: Передача божественного титула שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: Это божественный титул; перевод раскрывает его общепринятое значение, не вводя конфессионального толкования.
- issue: Субъект причинённой горечи
  choice: Прямо сохранено утверждение Ноемини, что её жизнь сделал горькой Всемогущий
  alternative: Всемогущий допустил её горести
  rationale: Смягчающая формулировка «допустил» отсутствует в еврейском тексте и разрешила бы богословское напряжение вместо его сохранения.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Сохранены повтор «называйте» и горькое обвинительное напряжение высказывания; архаическое «зовите» и неестественное «сделал меня горькой» не использованы.
