  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: ru
  text: Тогда они снова громко заплакали. Орфа поцеловала свою свекровь, а Руфь крепко держалась за неё[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и Руфь крепко держалась за неё». Еврейский союз можно перевести просто как «и», хотя контекст указывает на сопоставление между прощальным поцелуем Орфы и тем, что Руфь продолжала держаться Ноемини.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן וַתִּבְכֶּינָה
  choice: они громко заплакали
  rationale: Еврейская идиома буквально говорит, что они «возвысили свой голос и заплакали». В современном русском «громко заплакали» естественно передаёт слышимый плач, не создавая тяжеловесной кальки.
- source_word: עוֹד
  choice: снова
  rationale: Наречие указывает на повторение плача, о котором уже сказано в Руфь 1:9.
- source_word: וַתִּשַּׁק
  choice: поцеловала
  rationale: Прямое и естественное соответствие еврейскому глаголу «целовать».
- source_word: לַחֲמוֹתָהּ
  choice: свою свекровь
  rationale: Существительное обозначает свекровь, а местоименный суффикс относится к Орфе. Русское возвратное притяжательное местоимение ясно передаёт эту связь.
- source_word: דָּבְקָה בָּהּ
  choice: крепко держалась за неё
  rationale: דבק выражает тесную, стойкую привязанность. Эта формулировка естественна по-русски и передаёт как физический образ, так и решимость Руфи, не добавляя отсутствующего в стихе богословского уточнения.
- source_word: וְ
  choice: а
  rationale: Союз формально означает «и», но в контексте сопоставляет поступки Орфы и Руфи. Русское «а» сохраняет этот контраст мягче, чем явно противительное «но».
- source_word: עָרְפָּה
  choice: Орфа
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: רוּת
  choice: Руфь
  rationale: Традиционная и узнаваемая русская передача личного имени.
theological_decisions:
- issue: Характер связи между поступками Орфы и Руфи
  choice: а Руфь крепко держалась за неё
  alternative: и Руфь крепко держалась за неё
  rationale: 'Еврейский וְ допускает простое соединение «и», однако контекст создаёт сопоставление: Орфа прощается поцелуем, тогда как Руфь остаётся с Ноеминью. Союз «а» передаёт этот контекстуальный контраст, не превращая его в более резкое противопоставление.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Выражение «громко заплакали» предпочтено буквальной кальке «возвысили голос», а «крепко держалась» передаёт силу דבק естественно и понятно. Имена даны в традиционной русской библейской форме.
