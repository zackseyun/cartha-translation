base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: ru
  text: Где умрёшь ты, там умру и я, и там буду погребена. Пусть Яхве так поступит со мной и ещё больше[a], если что-либо, кроме смерти, разлучит меня с тобой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Пусть Яхве так сделает со мной и так добавит». Это еврейская формула клятвы, в которой человек призывает на себя Божий суд за нарушение обещания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ибо смерть разлучит меня с тобой». В контексте клятвы смысл состоит в том, что только смерть может положить конец их совместной жизни.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Где
  rationale: Сочетание предлога ב с относительным אֲשֶׁר обозначает место — «там, где». Краткое «где» естественно по-русски и сохраняет пространственную связь с последующим «там».
- source_word: תָּמוּתִי / אָמוּת
  choice: умрёшь ты, там умру и я
  rationale: Парные формы глагола מות образуют торжественный параллелизм обещания. Местоимения «ты» и «я» передают смысловое противопоставление, выраженное личными формами еврейского глагола.
- source_word: וְשָׁם אֶקָּבֵר
  choice: и там буду погребена
  rationale: וְשָׁם продолжает указание на место, а нифаль אֶקָּבֵר имеет страдательное значение. Женский род определяется говорящей Руфью.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: Пусть Яхве так поступит со мной и ещё больше
  rationale: 'Сохранена традиционная самообязывающая формула клятвы: говорящая призывает на себя Божий суд, если нарушит обещание. Русская формулировка остаётся торжественной, но понятной; подразумеваемое наказание не конкретизируется, как и в источнике.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, поскольку в исходном тексте употреблено именно имя Бога.
- source_word: כִּי הַמָּוֶת
  choice: если не одна лишь смерть
  rationale: В контексте формулы клятвы כִּי вводит условие, а смерть названа единственно допустимой причиной разлуки. Отрицательная конструкция по-русски естественно выражает смысл «если что-либо, кроме смерти»; неоднозначность более буквальной формы отмечена в сноске.
- source_word: יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: разлучит меня с тобой
  rationale: Хифиль глагола פרד означает «разделить, разлучить». Русское «разлучит меня с тобой» естественно передаёт конструкцию «между мной и тобой» и её личностный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передача «Яхве» сохраняет личное имя, прямо стоящее в еврейском тексте, и не подменяет его титулом.
- issue: Смысл заключительного условия клятвы
  choice: если не одна лишь смерть разлучит меня с тобой
  alternative: если что-либо, кроме смерти, разлучит меня с тобой; если смерть разлучит меня с тобой
  rationale: В контексте всей речи Руфи смерть представлена единственным пределом её верности Ноемини. При этом сама краткая еврейская конструкция допускает более буквальное чтение, поэтому оно не скрыто, а указано в сноске.
- issue: Характер формулы כֹּה יַעֲשֶׂה ... וְכֹה יֹסִיף
  choice: сохранить формулу самоосуждающей клятвы без уточнения кары
  alternative: 'передать прямо: «пусть Яхве сурово накажет меня»'
  rationale: Источник намеренно не называет конкретного наказания. Сохранение формулы удерживает её торжественность и не добавляет отсутствующих в тексте деталей.
translation_notes:
  register: Современный литературный русский язык с торжественным оттенком, соответствующим клятве. Параллелизм «умрёшь ты — умру и я» сохранён; устаревшие обороты и конфессионально маркированная замена имени Бога титулом не использованы.
