base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: ru
  text: 'И она сказала: «Вот, твоя невестка вернулась к своему народу и к своим богам[a]. Возвращайся вслед за своей невесткой».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово стоит во множественном числе: «к своим богам»; некоторые переводят: «к своему богу». В данном контексте множественное число, вероятно, относится к божествам Моава.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «И она сказала: „Вот, твоя невестка возвратилась к своему народу и к своим богам. Возвратись вслед за своей невесткой“». Еврейский глагол שוב повторён и в сообщении о поступке Орфы, и в обращённом к Руфи повелении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И сказала она
  rationale: Стандартная передача повествовательной формы wayyiqtol; сохраняет течение еврейского рассказа и не уточняет имя говорящей, отсутствующее в стихе.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественная для современного литературного русского указательная частица, привлекающая внимание к уже сложившейся ситуации.
- source_word: שָׁבָה / שׁוּבִי
  choice: вернулась / Возвращайся
  rationale: Однокоренные русские формы сохраняют намеренный повтор еврейского שוב, обозначая соответственно завершившееся действие Орфы и повеление Руфи.
- source_word: יְבִמְתֵּךְ
  choice: твоя невестка / своей невесткой
  rationale: В контексте это естественное и понятное русское обозначение женщины, связанной с Руфью через брак с братом её мужа; лексема передана последовательно в обоих случаях.
- source_word: אֶל עַמָּהּ
  choice: к своему народу
  rationale: עַם здесь обозначает народ и этническую общность Орфы, а не только ближайших родственников.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: и к своим богам
  rationale: Форма и контекст возвращения в Моав вероятнее всего указывают на моавитских божеств; строчная буква отличает их от Бога Израиля.
- source_word: אַחֲרֵי
  choice: вслед за
  rationale: Передаёт образ следования примеру и пути невестки естественнее, чем буквальное и стилистически неловкое «после».
theological_decisions:
- issue: Число и смысл אֱלֹהֶיהָ применительно к моавитскому культу
  choice: к своим богам
  alternative: к своему богу
  rationale: Хотя אֱלֹהִים в иных контекстах может иметь единственное значение, здесь грамматическая форма и религиозно-культурный контекст Моава поддерживают множественное «богам». Перевод не отождествляет их с Господом, но сохраняет контраст принадлежности к народу и его культу.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Формы «вернулась / возвращайся» звучат естественно и сохраняют корневой повтор. Местоимения, относящиеся к людям и языческим богам, даны со строчной буквы. Сноска отмечена в основном тексте.
