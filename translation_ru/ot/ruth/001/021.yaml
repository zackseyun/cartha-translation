language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: ru
  text: Я ушла полной, а Яхве вернул меня пустой. Почему вы называете меня Наоми[a], если Яхве свидетельствовал против меня[b] и Всемогущий навёл на меня беду[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Наоми» связано с представлением о приятности, отраде или благополучии.
    reason: name_meaning
  - marker: b
    text: 'Или: «выступил против меня». Еврейский глагол может означать ответ или свидетельство против кого-либо.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «причинил мне зло (несчастье)». Здесь речь идёт о бедствии, а не о нравственном зле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: полной
  rationale: Предикативное прилагательное передаёт прежнее состояние Наоми и сохраняет резкое противопоставление слову «пустой».
- source_word: הָלַכְתִּי
  choice: я ушла
  rationale: В данном контексте глагол обозначает уход из Вифлеема; «ушла» естественно передаёт значение отправления.
- source_word: וְרֵיקָם
  choice: пустой
  rationale: Сохранён буквальный и выразительный контраст «полной — пустой» без уточнения, что именно Наоми утратила.
- source_word: הֱשִׁיבַנִי
  choice: вернул меня
  rationale: Каузативная форма שוב прямо указывает на то, что возвращение совершилось по действию Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: Зачем вы называете меня Наоми
  rationale: Риторический вопрос обращён к женщинам Вифлеема; множественное число глагола сохранено.
- source_word: נָעֳמִי
  choice: Наоми
  rationale: Имя передано близкой к еврейскому звучанию современной транслитерацией; его значимое для контекста значение пояснено в сноске.
- source_word: עָנָה בִי
  choice: засвидетельствовал против меня
  rationale: 'Передан возможный судебный оттенок конструкции: Яхве свидетельствует против Наоми. Неопределённость глагола сохранена указанием альтернативы в сноске.'
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Божественный титул переведён по значению в традиционной и понятной русской форме.
- source_word: הֵרַע לִי
  choice: навёл на меня беду
  rationale: Каузативная форма выражает причинение бедствия. Формулировка сохраняет прямое указание на Божье действие, но не приписывает Богу нравственного зла.
theological_decisions:
- issue: Высказывание Наоми о Божьем участии в её страданиях
  choice: 'Сохранить прямую божественную причинность: «Яхве засвидетельствовал против меня» и «Всемогущий навёл на меня беду».'
  alternative: 'Смягчить формулировку: «Яхве допустил, чтобы меня постигла беда».'
  rationale: Еврейский текст прямо связывает тяжёлую участь Наоми с действием Яхве и Шаддая. Перевод сохраняет эту богословскую напряжённость и не подменяет причинность простым допущением.
- issue: Соотношение двух заключительных высказываний
  choice: Передать עָנָה בִי как свидетельство против Наоми, а הֵרַע לִי как наведение беды.
  alternative: Понять оба выражения как почти синонимичные указания на причинённое страдание.
  rationale: Такой перевод сохраняет различие образов в параллельных частях и не сводит первый глагол без необходимости к значению «поразил» или «причинил страдание».
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного поэтического противопоставления «полной — пустой». Прямое именование Божьего действия не смягчено. Имя Наоми дано в современной транслитерации; его смысл вынесен в сноску.
