  verdict: revise
  source_fidelity: Благословительное «пусть Яхве даст» верно передаёт юссивную форму יִתֵּן, имя Яхве передано последовательно, а «покой» точно сохраняет основной смысл מְנוּחָה. Однако исходное «даст вам обрести покой — каждой...» синтаксически неудачно связывает инфинитив с «вам» и затем добавляет распределительное «каждой»; явное «каждой из вас» точнее передаёт אִשָּׁה. Заключительное «громко зарыдали» допустимо по смыслу, но сжимает два еврейских действия и усиливает их; лучше сохранить «подняли голос и заплакали».
