lexical_decisions:
- source_word: יִתֵּן
  choice: Пусть ... даст
  rationale: Форма выражает пожелание-благословение; конструкция «пусть даст» естественно передаёт это значение по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, непосредственно стоящее в еврейском тексте.
- source_word: וּמְצֶאןָ
  choice: обрести
  rationale: Глагол продолжает пожелание после יִתֵּן; по-русски естественно соединяется с «даст вам» как инфинитив.
- source_word: מְנוּחָה
  choice: покой
  rationale: Сохраняет основной образ еврейского слова, которое здесь подразумевает спокойную, устроенную и защищённую жизнь в новом браке.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: каждой в доме своего мужа
  rationale: 'Передаёт распределительное значение: пожелание относится отдельно к каждой из двух женщин.'
- source_word: וַתִּשַּׁק לָהֶן
  choice: Потом она поцеловала их
  rationale: Естественная русская повествовательная передача последовательного действия.
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  choice: они громко зарыдали
  rationale: Идиома буквально говорит, что женщины «подняли свой голос и заплакали»; цельная русская формулировка передаёт слышимый, сильный плач без неестественной кальки.
