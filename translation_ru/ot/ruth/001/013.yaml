  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: ru
  text: Неужели вы стали бы ждать, пока они вырастут? Неужели ради них вы воздерживались бы от брака? Нет[a], дочери мои! Ведь мне гораздо горше, чем вам, потому что рука Яхве обратилась против меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели ради них вы оставались бы незамужними?» Еврейский глагол редок и, вероятно, означает воздержание от брака в ожидании будущих мужей.'
    reason: lexical_alternative
