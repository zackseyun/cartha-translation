lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: Потом умерли
  rationale: Форма wayyiqtol продвигает повествование; «потом» естественно передаёт последовательность событий.
- source_word: גַם שְׁנֵיהֶם
  choice: и оба её сына
  rationale: גַם связывает эту смерть с предшествующей утратой, а שְׁנֵיהֶם подчёркивает, что умерли оба. Добавление «сына» проясняет местоименную отсылку из контекста, не изменяя смысла.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Махлон и Хилъон
  rationale: Имена переданы принятой русской библейской транслитерацией.
- source_word: וַתִּשָּׁאֵר
  choice: осталась
  rationale: Глагол שׁאר означает «остаться, быть оставленной»; русское «осталась без» естественно передаёт и выживание, и состояние утраты.
- source_word: הָאִשָּׁה
  choice: эта женщина
  rationale: Сохранено повествовательное обозначение «женщина», а указательное «эта» делает определённость артикля естественной по-русски, не подменяя его именем Ноеминь.
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: без двух своих детей
  rationale: Предлог מִן при שׁאר выражает лишение. יְלָדִים буквально обозначает детей или потомство и здесь относится к взрослым сыновьям; «детей» сохраняет материнскую перспективу и лексическую широту.
- source_word: וּמֵאִישָׁהּ
  choice: и без мужа
  rationale: אִישׁ с притяжательным суффиксом здесь означает мужа; повторное מִן продолжает значение лишения, естественно выраженное конструкцией «без».
