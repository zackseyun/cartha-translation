  text: 'Но они сказали ей: «Нет, мы вернёмся с тобой к твоему народу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Ибо с тобой мы вернёмся к твоему народу».'
