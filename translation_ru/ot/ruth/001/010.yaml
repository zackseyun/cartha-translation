lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Но они сказали
  rationale: Форма женского рода множественного числа относится к обеим невесткам; «но» естественно передаёт противопоставление предыдущему призыву Ноемини, хотя союз וַ сам по себе также допускает «и».
- source_word: לָּהּ
  choice: ей
  rationale: Предлог ל с суффиксом 3-го лица женского рода единственного числа обозначает адресата речи — Ноеминь.
- source_word: כִּי
  choice: Нет
  rationale: В данном ответе כִּי вводит настойчивое возражение просьбе Ноемини. Русское «нет» естественно выражает эту функцию; более буквальная связка отражена в сноске.
- source_word: אִתָּךְ
  choice: с тобой
  rationale: Предлог אֵת с суффиксом 2-го лица женского рода единственного числа выражает сопровождение.
- source_word: נָשׁוּב
  choice: мы пойдём
  rationale: Глагол שׁוּב буквально означает «вернуться», однако женщины не возвращаются к народу Ноемини в строгом пространственном смысле. «Пойдём» естественно передаёт намерение сопровождать её, а буквальная формулировка сохранена в сноске.
- source_word: לְעַמֵּךְ
  choice: к твоему народу
  rationale: עַם здесь обозначает народ и общину Ноемини, а не только её ближайших родственников.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, естественная прямая речь. Местоимение «тобой» оставлено со строчной буквы как обычное обращение человека к человеку. Частица «нет» передаёт настойчивое возражение, а сноска сохраняет более буквальную структуру еврейского текста.
