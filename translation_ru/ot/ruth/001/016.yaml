  text: וַ/תֹּ֤אמֶר רוּת֙ אַל תִּפְגְּעִי בִ֔/י לְ/עָזְבֵ֖/ךְ לָ/שׁ֣וּב מֵ/אַחֲרָ֑יִ/ךְ כִּ֠י אֶל אֲשֶׁ֨ר תֵּלְכִ֜י אֵלֵ֗ךְ וּ/בַ/אֲשֶׁ֤ר תָּלִ֨ינִי֙ אָלִ֔ין עַמֵּ֣/ךְ עַמִּ֔/י וֵ/אלֹהַ֖יִ/ךְ אֱלֹהָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: ru
  text: 'Но Руфь сказала: «Не уговаривай меня оставить тебя и повернуть назад, перестав идти за тобой[a]. Ведь куда ты пойдёшь, туда и я пойду; где ты будешь ночевать, там и я буду ночевать. Твой народ — мой народ, и твой Бог — мой Бог[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернуть назад от тебя». Это выражение означает перестать следовать за тобой и вернуться.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском обе фразы безглагольные: «твой народ — мой народ, и твой Бог — мой Бог». По смыслу их можно понимать и как обещание на будущее: «твой народ будет моим народом, и твой Бог будет моим Богом».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: не настаивай
  rationale: Сочетание פגע с ב может означать настойчиво просить, убеждать или понуждать. «Не настаивай» естественно передаёт просьбу Руфи прекратить уговоры, не создавая оттенка физического воздействия.
- source_word: לְעָזְבֵךְ
  choice: чтобы я оставила тебя
  rationale: עזב здесь означает оставить или покинуть. «Оставила тебя» — ясный современный вариант без излишне тяжёлого оттенка слова «покинула» или возможной богословской окраски «оставить навсегда».
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: повернула назад, перестав следовать за тобой
  rationale: שׁוב выражает возвращение или поворот назад, а מֵאַחֲרָיִךְ буквально указывает на прекращение следования за Ноеминью. Формулировка сохраняет оба элемента и звучит по-русски естественно.
- source_word: כִּי
  choice: смысловая связь передана без отдельного союза
  rationale: כִּי вводит основание просьбы Руфи. В русском непосредственный переход к торжественному обещанию естественно выражает эту причинно-пояснительную связь без обязательного «ведь» или «потому что».
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: Куда ты пойдёшь, туда и я пойду
  rationale: Парная конструкция «куда… туда…» точно и естественно передаёт направление и подчёркивает параллелизм обещания.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: где ты будешь ночевать, там и я буду ночевать
  rationale: לון обычно означает провести ночь или ночевать. «Ночевать» точнее, чем более широкое «жить» или «оставаться», и сохраняет параллельную структуру.
- source_word: עַמֵּךְ עַמִּי
  choice: Твой народ — мой народ
  rationale: В еврейском это безглагольное именное предложение. Русское настоящее время естественно передаётся тире и сохраняет краткость и торжественность признания.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: и твой Бог — мой Бог
  rationale: Безглагольная конструкция сохранена средствами русского именного предложения. Форма и контекст указывают на единственного Бога Ноемини.
theological_decisions:
- issue: Временное значение двух безглагольных формул самоотождествления
  choice: 'Передать обе формулы русскими именными предложениями настоящего времени: «Твой народ — мой народ, и твой Бог — мой Бог»'
  alternative: «Твой народ будет моим народом, и твой Бог будет моим Богом»
  rationale: Еврейский текст не содержит связки и допускает понимание как нынешнего признания, так и обязательства на будущее. Русские именные предложения сохраняют формальную краткость и не устраняют эту смысловую напряжённость; контекст обещания по-прежнему позволяет услышать направленность в будущее.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем прямой речи. Параллелизм «куда… туда…; где… там…» передаёт поэтическую форму оригинала. Имена и обращения согласованы в женском роде; имя Ноемини в самом стихе не добавляется.
