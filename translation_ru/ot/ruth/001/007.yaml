base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: ru
  text: И она вышла из места, где была, вместе с обеими своими невестками; и они пошли по дороге, чтобы возвратиться в землю Иуды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: И вышла она
  rationale: Последовательная форма с וַ продвигает повествование; «вышла» сохраняет конкретное значение יצא и естественно звучит по-русски.
- source_word: מִן הַמָּקוֹם
  choice: из того места
  rationale: Предлог и определённое существительное переданы естественным русским сочетанием; указательное «того» связывает место с уже описанным местом пребывания Ноемини.
- source_word: אֲשֶׁר הָיְתָה שָׁמָּה
  choice: где жила
  rationale: 'Буквально: «где находилась/была». В контексте длительного пребывания «жила» ясно и естественно, не добавляя нового места или события.'
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: и обе её невестки — с ней
  rationale: כַּלָּה здесь означает «невестка»; «обе» естественно передаёт שְׁתֵּי при двух известных участницах. Тире помогает сохранить присоединительную структуру «с ней».
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: Они отправились в путь
  rationale: Сочетание глагола движения с בַּדֶּרֶךְ передано современным русским оборотом, сохраняющим образ начавшегося пути и не утверждающим специально, что они шли пешком.
- source_word: לָשׁוּב
  choice: чтобы возвратиться
  rationale: Инфинитив цели передан конструкцией «чтобы»; «возвратиться» сохраняет тематически важное значение שׁוב.
- source_word: אֶל אֶרֶץ יְהוּדָה
  choice: в землю Иуды
  rationale: אֶרֶץ сохранено как «земля», а יְהוּדָה передано традиционным русским именем «Иуда» в родительном падеже.
