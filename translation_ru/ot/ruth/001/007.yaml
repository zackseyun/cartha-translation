revisions:
- from: И вышла она из того места, где жила[a], и обе её невестки — с ней. Они отправились в путь, чтобы возвратиться в землю Иуды.
  to: И она вышла из места, где была, вместе с обеими своими невестками; и они пошли по дороге, чтобы возвратиться в землю Иуды.
  rationale: Исправление сохраняет последовательность повествования, конкретное «вышла», множественность двух невесток, движение по дороге и цель возвращения, но устраняет не заданное оригиналом утверждение о проживании и минимизирует интерпретацию глагола движения.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:38:32Z'
review_pass:
  verdict: revise
  source_fidelity: «Где жила» конкретизирует еврейское הָיְתָה שָׁמָּה («где была/находилась») как проживание; такая конкретизация не обязательна и не передаёт нейтральность исходного выражения. «Отправились в путь» допустимо по смыслу, но несколько сильнее простого «пошли по дороге».
  naturalness: Исходный текст в целом литературен, однако «и обе её невестки — с ней» звучит как присоединённый фрагмент. Оборот «вместе с обеими своими невестками» естественно связывает участников, не меняя смысла.
  terminology: «Невестки», «возвратиться» и «земля Иуды» точны и соответствуют современному литературному библейскому регистру. Имя «Иуда» в географическом выражении передано корректно.
  issues:
  - severity: medium
    issue: «где жила» вместо нейтрального «где была/находилась»
    rationale: Глагол היה в данном контексте обозначает пребывание в том месте и сам по себе не утверждает проживание. Сноска признаёт буквальное значение, но основной текст выбирает более узкое толкование без необходимости.
  - severity: low
    issue: «Они отправились в путь» несколько эксплицирует начало путешествия
    rationale: וַתֵּלַכְנָה בַּדֶּרֶךְ буквально сообщает, что они пошли по дороге; «отправились в путь» естественно, но слегка интерпретирует формулировку.
  - severity: low
    issue: Сноска сформулирована неточно и больше не нужна
    rationale: В ней «где находилась» названо буквальным вариантом наряду с «где была», тогда как еврейское выражение включает также наречие «там». После нейтрального перевода в основном тексте лексическая сноска не требуется.
  revised_text: И она вышла из места, где была, вместе с обеими своими невестками; и они пошли по дороге, чтобы возвратиться в землю Иуды.
