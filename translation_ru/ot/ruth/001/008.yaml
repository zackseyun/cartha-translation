base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: ru
  text: 'И сказала Ноеминь двум своим невесткам: «Ступайте, возвращайтесь, каждая — в дом своей матери. Пусть Яхве проявит к вам доброту[a], как вы проявляли её к умершим и ко мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милость», «неизменную любовь», «верную любовь» (евр. хесед).'
    reason: Слово חֶסֶד включает оттенки милости, доброты, неизменной и верной любви; один русский эквивалент не исчерпывает его значения.
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: двум своим невесткам
  rationale: В данном контексте כַּלָּה означает жену сына; «невестки» — точный и естественный русский эквивалент.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: Ступайте, возвращайтесь
  rationale: Сохранены оба повелительных глагола, передающие настойчивость Ноемини; «ступайте» придаёт речи естественное достоинство без архаической тяжеловесности.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: каждая в дом своей матери
  rationale: אִשָּׁה имеет распределительное значение «каждая»; конкретный образ материнского дома сохранён, а не обобщён до родного дома.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: חֶסֶד
  choice: верность
  rationale: Здесь слово обозначает деятельную, преданную доброту. «Верность» хорошо связывает просьбу к Яхве с уже проявленной женщинами преданностью, а более широкий спектр значения отмечен в сноске.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: как вы являли её умершим и мне
  rationale: Глагол עשה при חֶסֶד описывает проявление верной доброты; местоимение «её» естественно связывает придаточное предложение с существительным «верность». «Умершим» сохраняет собирательную множественность исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл חֶסֶד
  choice: верность
  alternative: милость; доброта; неизменная любовь
  rationale: Не следует сводить многозначное חֶסֶד только к чувству или общей доброте. В контексте поступков невесток «верность» передаёт преданность, выраженную делами, тогда как сноска сохраняет другие возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор двух повелительных глаголов и конкретное выражение «дом своей матери» сохранены; синтаксис сделан естественным для современного читателя.
