base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: ru
  text: Имя этого человека было Элимелех, имя его жены — Ноеминь, а имена двух его сыновей — Махлон и Килион. Они были ефрафянами из Вифлеема Иудейского. Они пришли на поля Моава[a] и были там[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в землю Моава» или «в область Моава»; буквально: «на поля Моава».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «остались там» или «пребывали там»; буквально: «и были там».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: Имя этого человека было
  rationale: Естественно передаёт еврейскую формулу именования и сохраняет связь с человеком, упомянутым в предыдущем стихе.
- source_word: אֱלִימֶלֶךְ
  choice: Элимелех
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: אִשְׁתּוֹ
  choice: его жены
  rationale: Прямо и естественно передаёт притяжательную конструкцию в данном контексте.
- source_word: נָעֳמִי
  choice: Ноеминь
  rationale: Сохранена укоренившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: שְׁנֵי בָנָיו
  choice: двух его сыновей
  rationale: Точно передаёт числительное и притяжательное значение еврейской конструкции.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Махлон и Килион
  rationale: Имена транслитерированы; начальное כ в כִלְיוֹן передано как «к», а не как «х».
- source_word: אֶפְרָתִים
  choice: ефрафянами
  rationale: Передаёт этникон, связанный с Ефрафой, и не смешивает его с ефремлянами из колена Ефрема.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: из Вифлеема Иудейского
  rationale: Естественная русская географическая формула, указывающая на Вифлеем в Иудее.
- source_word: וַיָּבֹאוּ
  choice: Они пришли
  rationale: Сохраняет базовое значение глагола בוא и последовательность повествования.
- source_word: שְׂדֵי מוֹאָב
  choice: на поля Моава
  rationale: Сохраняет конкретный образ множественного числа «поля», хотя выражение может обозначать также область или землю Моава.
- source_word: וַיִּהְיוּ שָׁם
  choice: и остались там
  rationale: Передаёт контекстуальный смысл пребывания, при этом буквальное «и были там» отмечено в сноске.
