base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: ru
  text: 'И обе они шли, пока не пришли в Вифлеем. Когда они пришли в Вифлеем, весь город пришёл в волнение из-за них, и женщины сказали: «Это Ноеминь?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: И шли они обе
  rationale: Форма глагола продолжает повествовательную последовательность и описывает дальнейший путь; «они обе» сохраняет явное указание на двух женщин.
- source_word: עַד בֹּאנָה
  choice: пока не пришли
  rationale: עַד с בוא обозначает конечную точку пути; русская конструкция естественно передаёт значение «до тех пор, пока не».
- source_word: בֵּית לָחֶם
  choice: Вифлеем
  rationale: Употреблена традиционная и общепонятная русская форма географического названия.
- source_word: וַיְהִי כְּבֹאנָה
  choice: Когда они пришли
  rationale: Еврейская повествовательная формула вводит следующее событие; по-русски временное значение передано без буквального и тяжеловесного «и было».
- source_word: וַתֵּהֹם כָּל הָעִיר
  choice: весь город пришёл в волнение
  rationale: המה обозначает сильное коллективное возбуждение или смятение. Выражение сохраняет эмоциональную широту слова, не усиливая его до «поднял шум» или «пришёл в ярость».
- source_word: עֲלֵיהֶן
  choice: из-за них
  rationale: Предлог указывает на женщин как на повод или причину общего волнения.
- source_word: וַתֹּאמַרְנָה
  choice: женщины говорили
  rationale: Глагольная форма женского рода множественного числа указывает, что говорившими были женщины; это выражено явно, поскольку русский глагол во множественном числе сам по себе рода не показывает.
- source_word: הֲזֹאת נָעֳמִי
  choice: Неужели это Ноеминь?
  rationale: Вопрос передаёт изумлённое узнавание. Частица «неужели» естественно выражает это в русском, не добавляя утверждения о причине перемен во внешности Ноемини.
