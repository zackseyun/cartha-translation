  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: ru
  text: В те дни, когда судьи вершили суд[a], в стране случился голод. И один человек ушёл из Вифлеема Иудейского, чтобы временно поселиться[b] на полях Моава[c] — он, его жена и двое его сыновей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда судили судьи». Еврейский текст повторяет один и тот же корень; выражение можно также перевести: «когда правили судьи».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол подразумевает проживание в качестве пришельца и не обязательно означает окончательное переселение.
    reason: cultural_note
  - marker: c
    text: 'Или: «в области Моава», «в стране Моав». Буквально: «на полях Моава».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: случился; и … ушёл
  rationale: Повествовательная форма глагола היה открывает рассказ и затем продвигает действие. В современном русском её функции естественно переданы сказуемым «случился» и союзом «и», без архаического «и было».
- source_word: בִּימֵי
  choice: в те дни
  rationale: Естественная русская передача еврейского временного оборота; она сохраняет библейскую выразительность, оставаясь понятной современному читателю.
- source_word: שְׁפֹט הַשֹּׁפְטִים
  choice: когда судьи вершили суд
  rationale: Передача сохраняет повтор корня «суд», присутствующий в еврейском тексте, но избегает неестественного русского «когда судьи судили» и не сужает роль судей только до политического правления.
- source_word: רָעָב
  choice: голод
  rationale: Обычное и точное русское обозначение тяжёлой нехватки пищи в целой области.
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: В данном повествовательном контексте אֶרֶץ обозначает землю или страну, из которой человек уходит; «в стране» звучит естественно и не добавляет отсутствующего в стихе названия.
- source_word: אִישׁ
  choice: один человек
  rationale: Сохраняется указание на конкретного мужчину, который будет назван далее; «один» естественно вводит нового участника рассказа.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: из Вифлеема Иудейского
  rationale: Традиционная и ясная русская форма географического обозначения отличает этот Вифлеем как находящийся в Иудее.
- source_word: לָגוּר
  choice: чтобы временно поселиться
  rationale: Глагол גור обозначает проживание пришельцем, часто без смысла окончательного переселения. Выбранная формулировка естественна по-русски и сохраняет временный характер пребывания; социальный оттенок пояснён в сноске.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: на полях Моава
  rationale: Сохраняется конкретный образ множественного числа שְׂדֵי («поля»), который также может обозначать область или территорию Моава.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: он, его жена и двое его сыновей
  rationale: Передан простой перечислительный строй еврейского текста и явно сохранено число сыновей.
theological_decisions:
- issue: Характер власти судей в выражении שְׁפֹט הַשֹּׁפְטִים
  choice: когда судьи вершили суд
  alternative: когда правили судьи
  rationale: Еврейский корень שׁפט охватывает судебную и управленческую деятельность. Перевод сохраняет корневой повтор и не разрешает неоднозначность в пользу исключительно политического смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Архаические формулы вроде «и было» и книжное «странствовать» не используются. Корневой повтор в первой временной фразе сохранён в естественной русской форме; конкретный аграрный образ «полей Моава» оставлен в основном тексте.
