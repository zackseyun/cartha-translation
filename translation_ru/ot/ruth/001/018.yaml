translation:
  language: ru
  text: Когда Ноеминь увидела, что Руфь твёрдо решила идти с ней, она перестала с ней разговаривать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Когда Ноеминь увидела
  rationale: Последовательная форма с וַ продвигает повествование, а придаточное с «когда» естественно связывает восприятие Ноемини с её последующей реакцией. Имя названо для устранения неясности русских местоимений.
- source_word: כִּי
  choice: что
  rationale: 'Союз вводит содержание увиденного: Ноеминь поняла, что Руфь полна решимости.'
- source_word: מִתְאַמֶּצֶת
  choice: твёрдо решила
  rationale: Форма хитпаэль от אמץ передаёт внутреннее укрепление, решимость и настойчивость; выбранное выражение естественно и сохраняет оттенок твёрдой воли.
- source_word: הִיא
  choice: Руфь
  rationale: Самостоятельное местоимение подчёркивает субъект. Имя делает русскую фразу ясной, не меняя референта, установленного контекстом.
- source_word: לָלֶכֶת אִתָּהּ
  choice: идти с ней
  rationale: הלך в контексте пути означает «идти», а אִתָּהּ указывает на сопровождение Ноемини.
- source_word: וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ
  choice: перестала её отговаривать
  rationale: חדל означает прекращение действия, а буквальное «говорить ей» в данном контексте относится к попыткам убедить Руфь вернуться. Контекстуальный смысл вынесен в основной текст, а более формальная передача сохранена в примечании.
