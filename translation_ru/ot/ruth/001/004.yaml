base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: ru
  text: Они взяли себе в жёны моавитянок[a]. Одну звали Орфой, а другую — Руфью. Они прожили там около десяти лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женились на моавитянках». Буквально еврейский текст говорит: «взяли себе моавитянок в жёны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים מֹאֲבִיּוֹת
  choice: взяли себе в жёны моавитянок
  rationale: Сочетание נָשָׂא с נָשִׁים обозначает вступление в брак. Русское выражение сохраняет образность еврейского оборота, включая значение личной заинтересованности в לָהֶם, и при этом ясно передаёт брачный смысл.
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: Одну звали ... а другую —
  rationale: Естественная современная русская формула именования передаёт параллельное противопоставление двух женщин. «Другую» идиоматичнее по-русски, чем буквальное «вторую», при этом смысл הַשֵּׁנִית сохраняется.
- source_word: עָרְפָּה
  choice: Орфа
  rationale: Традиционная и узнаваемая русская форма библейского имени.
- source_word: רוּת
  choice: Руфь
  rationale: Традиционная и узнаваемая русская форма библейского имени.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Они прожили там
  rationale: Глагол יָשַׁב здесь означает длительное проживание. «Прожили» естественно сочетается с последующим указанием продолжительности.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: около десяти лет
  rationale: Префикс כְּ выражает приблизительность, которую явно передаёт «около».
