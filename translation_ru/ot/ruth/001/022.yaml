base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: ru
  text: И вернулась Ноеминь, и вместе с ней — Руфь, моавитянка, её невестка, которая вернулась с полей Моава[a]. Они пришли в Вифлеем в начале жатвы ячменя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более естественно по-русски: «из земли Моава». В еврейском тексте буквально: «с полей Моава».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: Так вернулась
  rationale: Глагол שוב означает возвращение; форма с וַ продолжает и подытоживает повествование. «Так вернулась» естественно передаёт эту связь.
- source_word: הַמּוֹאֲבִיָּה
  choice: моавитянка
  rationale: Женская форма этнонима сохраняет подчёркнутое в повествовании происхождение Руфи.
- source_word: כַלָּתָהּ
  choice: её невестка
  rationale: Прямой и естественный русский эквивалент термина родства.
- source_word: עִמָּהּ
  choice: вместе с ней
  rationale: Передаёт сопровождение Ноемини Руфью и звучит естественно по-русски.
- source_word: הַשָּׁבָה
  choice: которая вернулась
  rationale: Причастие женского рода единственного числа передано определительным придаточным; по ближайшему синтаксическому соотнесению оно относится к Руфи, как и в исходной консультационной версии.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: с полей Моава
  rationale: Сохраняется буквальный образ множественного числа שָׂדֶה; возможное более широкое территориальное значение отмечено в сноске.
- source_word: וְהֵמָּה בָּאוּ
  choice: Они пришли
  rationale: Самостоятельное местоимение выражено явным подлежащим; отдельное предложение естественно передаёт переход к прибытию.
- source_word: בֵּית לֶחֶם
  choice: Вифлеем
  rationale: Устоявшаяся русская форма библейского топонима.
- source_word: בִּתְחִלַּת
  choice: в начале
  rationale: Точно и естественно передаёт временное значение конструктивной формы.
- source_word: קְצִיר שְׂעֹרִים
  choice: жатвы ячменя
  rationale: Передаёт конструкцию «жатва/сбор ячменя» в традиционном, но понятном современному читателю выражении.
theological_decisions:
- issue: К кому относится הַשָּׁבָה («вернувшаяся»)
  choice: 'К Руфи: «которая вернулась»'
  alternative: К Ноемини либо менее определённая перестройка предложения
  rationale: Форма грамматически женского рода и сама по себе допускает соотнесение с любой из двух женщин, однако её положение после обозначения Руфи и приложение к ближайшей именной группе поддерживают отнесение к Руфи. Это сохраняет примечательное употребление языка возвращения по отношению к Руфи, не добавляя объясняющей богословской трактовки.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Устоявшиеся формы имён «Ноеминь», «Руфь» и «Вифлеем» сохранены; синтаксис упрощён до двух ясных предложений без устранения повтора глагола «вернулась».
