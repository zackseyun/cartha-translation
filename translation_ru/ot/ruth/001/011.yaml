base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: ru
  text: 'Но Ноеминь сказала: «Возвращайтесь, дочери мои! Зачем вам идти со мной? Разве у меня ещё есть сыновья в утробе, которые могли бы стать вашими мужьями?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Но Ноеминь сказала
  rationale: Последовательный вав продолжает повествование, а союз «но» естественно передаёт противопоставление намерению невесток идти с Ноеминью.
- source_word: שֹׁבְנָה
  choice: Возвращайтесь
  rationale: Форма множественного числа от שׁוב выражает призыв вернуться; «возвращайтесь» ясно и естественно в современном русском.
- source_word: בְנֹתַי
  choice: дочери мои
  rationale: Сохранено буквальное родственное обращение, которым Ноеминь с теплотой называет своих невесток; в русском контексте оно понятно без пояснения.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: Зачем вам идти со мной?
  rationale: Инфинитивная русская конструкция естественно передаёт риторический вопрос и оттенок нецелесообразности, не превращая его в простой вопрос о будущем.
- source_word: הַעוֹד לִי
  choice: Разве у меня ... ещё есть
  rationale: «Разве» передаёт риторическую вопросительную частицу הֲ, а «ещё есть» — сочетание עוֹד с конструкцией обладания.
- source_word: בָנִים
  choice: сыновья
  rationale: Еврейское слово означает именно сыновей, что существенно для предполагаемой возможности брака с ними.
- source_word: בְּמֵעַי
  choice: во чреве
  rationale: В контексте деторождения слово обозначает утробу. «Во чреве» точно и достойно передаёт образ, хотя имеет слегка возвышенную окраску.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: которые могли бы стать вашими мужьями
  rationale: Условная форма «могли бы стать» естественно связывает этот результат с невозможным предположением о сыновьях во чреве; אֲנָשִׁים здесь по контексту означает мужей.
theological_decisions:
- issue: Предполагаемый брак невесток с будущими сыновьями Ноемини
  choice: Передать риторическую и гипотетическую логику без добавления названия или объяснения брачного обычая
  alternative: Добавить пояснение о левиратном браке
  rationale: Сам стих лишь подчёркивает невозможность такого исхода; конкретизация правового обычая выходила бы за пределы текста и могла бы преждевременно разрешить историко-богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «во чреве». Обращение «дочери мои» сохранено буквально и звучит естественно как выражение семейной привязанности; поэтому сноска не требуется.
