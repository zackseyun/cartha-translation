id: JOL.3.1
reference: Joel 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֣ה אַֽחֲרֵי כֵ֗ן אֶשְׁפּ֤וֹךְ אֶת רוּחִ/י֙ עַל כָּל בָּשָׂ֔ר וְ/נִבְּא֖וּ בְּנֵי/כֶ֣ם וּ/בְנֽוֹתֵי/כֶ֑ם זִקְנֵי/כֶם֙ חֲלֹמ֣וֹת יַחֲלֹמ֔וּ/ן בַּח֣וּרֵי/כֶ֔ם חֶזְיֹנ֖וֹת יִרְאֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/001.yaml
  text: And it will happen afterward that I will pour out my Spirit on all flesh[a]; and your sons and your daughters will prophesy, your old men will dream dreams[b], your young men will see visions.
translation:
  language: ru
  text: 'И будет после этого: Я изолью Свой Дух на всякую плоть[a]. Ваши сыновья и дочери будут пророчествовать, ваши старики будут видеть сны, а ваши юноши — видения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на всех людей», «на всё человечество». Буквально: «на всякую плоть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Формульное выражение вводит будущее событие; краткая русская передача сохраняет библейскую торжественность без архаизма «и будет в последние дни» или добавления отсутствующего смысла.
- source_word: אַחֲרֵי כֵן
  choice: после этого
  rationale: Точно обозначает последующее время и естественно связывает обещание с предшествующим контекстом.
- source_word: אֶשְׁפּוֹךְ
  choice: Я изолью
  rationale: Сохраняет конкретную метафору глагола שפך и будущую речь Бога от первого лица.
- source_word: רוּחִי
  choice: Мой Дух
  rationale: Контекст пророчества, снов и видений указывает на Божий Дух как источник пророческого вдохновения; прописная буква соответствует русской издательской норме, хотя в еврейском регистр не обозначен.
- source_word: עַל כָּל בָּשָׂר
  choice: на всякую плоть
  rationale: Сохраняет еврейский образ и его широкую, намеренно не до конца уточнённую сферу; «всех людей» было бы более толковательным.
- source_word: וְנִבְּאוּ
  choice: будут пророчествовать
  rationale: Естественно и точно передаёт пророческую речь или действие под вдохновением.
- source_word: בְּנֵיכֶם וּבְנוֹתֵיכֶם
  choice: ваши сыновья и дочери
  rationale: Передаёт явно названные мужскую и женскую группы, не сводя их к общему «дети».
- source_word: זִקְנֵיכֶם
  choice: ваши старики
  rationale: В параллели с юношами основным является возрастной контраст, а не должность старейшин.
- source_word: חֲלֹמוֹת יַחֲלֹמוּן
  choice: будут видеть сны
  rationale: Это естественная современная русская идиома; сочетание «снить сны» невозможно, а «сновидеть» не соответствует требуемому регистру.
- source_word: בַּחוּרֵיכֶם
  choice: ваши юноши
  rationale: Точно передаёт молодых мужчин и сохраняет противопоставление старикам.
- source_word: חֶזְיֹנוֹת יִרְאוּ
  choice: видения
  rationale: В эллиптической второй части общего сказуемого «будут видеть» слово «видения» естественно и точно передаёт пророческий термин.
theological_decisions:
- issue: Значение רוּחִי при обещании пророческого излияния
  choice: Мой Дух
  alternative: мой дух
  rationale: Говорящий Бог изливает то, что приводит к пророчеству, снам и видениям, поэтому наиболее вероятен Божий Дух. Возможность передачи со строчной буквы относится прежде всего к графической конвенции, а не к иному еврейскому написанию.
- issue: Объём выражения כָּל בָּשָׂר
  choice: всякую плоть
  alternative: всех людей / всё человечество
  rationale: Буквальная идиома сохраняет как широту обещания, так и напряжение между всеобщим звучанием и непосредственно названными группами внутри обращённого сообщества.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским ритмом. Сохранены конкретная метафора излияния, возрастные и гендерные параллели. Во второй половине использован естественный русский эллипсис: «будут видеть сны, а… — видения».'
