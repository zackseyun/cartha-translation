  terminology: «Дух», «изолью», «пророчествовать», «видения» и «всякая плоть» удачно сохраняют библейский и в то же время понятный современному читателю регистр. Прописная буква в «Дух» является оправданным контекстуальным издательским решением. Сноска a стоит непосредственно после выражения, к которому относится, и адекватно поясняет буквальное значение и варианты передачи.
