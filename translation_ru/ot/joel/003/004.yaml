source:
  edition: WLC
  text: הַ/שֶּׁ֨מֶשׁ֙ יֵהָפֵ֣ךְ לְ/חֹ֔שֶׁךְ וְ/הַ/יָּרֵ֖חַ לְ/דָ֑ם לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/004.yaml
  text: The sun will be turned to darkness[a], and the moon to blood[c][b], before the coming of the great and fearful day of Yahweh.
translation:
  language: ru
  text: Солнце обратится во тьму, а луна — в кровь[a], прежде чем придёт великий и грозный день Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в кровь»; возможный смысл — луна станет кроваво-красной.'
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога, передаваемое также традиционно как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: солнце
  rationale: Определённое существительное, прямо обозначающее небесное светило.
- source_word: יֵהָפֵךְ
  choice: обратится
  rationale: Нифаль глагола הפך выражает переход в иное состояние; «обратится» естественно передаёт результативное значение и сохраняет возвышенный пророческий регистр.
- source_word: לְחֹשֶׁךְ
  choice: во тьму
  rationale: Предлог לְ указывает на состояние, ставшее результатом перемены; по-русски сочетание «обратится во тьму» звучит естественно.
- source_word: וְהַיָּרֵחַ
  choice: а луна
  rationale: Союз передан как «а», чтобы естественно сопоставить два параллельных небесных знамения; глагол во второй части подразумевается.
- source_word: לְדָם
  choice: в кровь
  rationale: Сохранён буквальный и выразительный пророческий образ; толкование «станет кроваво-красной» не внесено в основной текст.
- source_word: לִפְנֵי בּוֹא
  choice: прежде чем придёт
  rationale: Оборот буквально означает «перед приходом»; придаточная конструкция ясна и естественна для современного русского языка.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Сохранена устойчивая пророческая формула, а тетраграмматон передан как личное имя.
- source_word: הַגָּדוֹל
  choice: великий
  rationale: Передаёт величие и исключительную значимость этого дня без дополнительного истолкования.
- source_word: וְהַנּוֹרָא
  choice: и грозный
  rationale: «Грозный» выражает внушаемые этим днём страх и трепет, сохраняя также оттенок величия; это естественнее по-русски, чем буквальное «страшный».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Характер космического образа
  choice: Сохранить буквальную формулировку «луна — в кровь»
  alternative: луна станет кроваво-красной
  rationale: Текст допускает образное и апокалиптическое понимание, но сам не разъясняет природу знамения; перевод не должен устранять эту напряжённость.
- issue: Значение נורא
  choice: грозный
  alternative: страшный; внушающий трепет
  rationale: Слово может обозначать то, что вызывает страх, благоговейный трепет и ужас. «Грозный» сохраняет этот диапазон лучше, чем однозначно негативное «ужасный».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Синтаксический параллелизм и резкая космическая образность оригинала сохранены; архаизмы и конфессионально окрашенные истолкования не добавлены.
