source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֧ל אֲשֶׁר יִקְרָ֛א בְּ/שֵׁ֥ם יְהוָ֖ה יִמָּלֵ֑ט כִּ֠י בְּ/הַר צִיּ֨וֹן וּ/בִ/ירוּשָׁלִַ֜ם תִּֽהְיֶ֣ה פְלֵיטָ֗ה כַּֽ/אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה וּ/בַ֨/שְּׂרִידִ֔ים אֲשֶׁ֥ר יְהוָ֖ה קֹרֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/005.yaml
  text: And it will happen that everyone who calls on the name of Yahweh will be delivered[a]; for on Mount Zion and in Jerusalem there will be escape, as Yahweh has said[c][b], among the survivors whom Yahweh calls.
translation:
  language: ru
  text: 'И будет: всякий, кто призовёт имя Яхве, будет избавлен[a]. Ибо на горе Сион и в Иерусалиме будет спасение[b], как сказал Яхве, — среди уцелевших, которых призывает Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасётся» либо «избежит гибели».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово פְלֵיטָה может означать «спасение», «избавление», «возможность спастись» или «спасшиеся, уцелевшие».
    reason: lexical_alternative
  - marker: c
    text: 'В стихе рядом стоят два действия: люди призывают имя Яхве, а Яхве призывает уцелевших.'
    reason: theological_tension
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Краткая и естественная формула вводит предстоящее событие и сохраняет связь с предыдущим пророческим контекстом.
- source_word: כֹּל אֲשֶׁר
  choice: всякий, кто
  rationale: Передаёт личный и дистрибутивный характер оборота, не сужая всеобщего охвата обещания.
- source_word: יִקְרָא בְּשֵׁם יְהוָה
  choice: призовёт имя Яхве
  rationale: Сохраняет устойчивый библейский смысл обращения к Яхве и мольбы о помощи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: יִמָּלֵט
  choice: будет избавлен
  rationale: Форма Niphal выражает избавление или спасение от опасности; выбранный вариант достаточно широк и не ограничивает смысл только физическим бегством.
- source_word: כִּי
  choice: ибо
  rationale: Передаёт объяснительную связь со сказанным ранее в достойном, но понятном современном регистре.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלִַם
  choice: на горе Сионе и в Иерусалиме
  rationale: Естественно передаёт различие между горой и городом без толковательного расширения.
- source_word: תִּהְיֶה פְלֵיטָה
  choice: будет спасение
  rationale: 'Сохраняет отвлечённую форму единственного существительного פְלֵיטָה и его широкий диапазон: спасение, избавление, возможность уцелеть или группа спасшихся.'
- source_word: כַּאֲשֶׁר אָמַר יְהוָה
  choice: как сказал Яхве
  rationale: Прямо и естественно передаёт ссылку на ранее данное слово Яхве.
- source_word: וּבַשְּׂרִידִים
  choice: среди уцелевших
  rationale: Передаёт людей, оставшихся после бедствия; слово «уцелевшие» прозрачно в непосредственном контексте суда.
- source_word: אֲשֶׁר יְהוָה קֹרֵא
  choice: которых призывает Яхве
  rationale: Настоящее время естественно передаёт причастие קֹרֵא и сохраняет смысл продолжающегося или характерного действия Бога.
theological_decisions:
- issue: Соотношение человеческого призывания имени Яхве и призвания людей Яхве
  choice: 'В основном тексте сохранены оба утверждения: всякий призывающий имя Яхве будет избавлен, а уцелевших призывает Яхве.'
  alternative: Истолковать последнюю часть либо как строгое ограничение первого обещания, либо как несущественное приложение к нему.
  rationale: Еврейский текст ставит рядом человеческое обращение и Божье призвание, не разъясняя их систематического соотношения; перевод сохраняет это напряжение.
- issue: Смысл פְלֵיטָה в контексте суда
  choice: будет спасение
  alternative: будут спасшиеся; будет избавление; будет возможность спастись
  rationale: Выбранный вариант сохраняет грамматически отвлечённое существительное и не сводит фразу ни исключительно к физическому бегству, ни к позднейшему систематическому пониманию спасения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формула «И будет» и союз «ибо» сохраняют достоинство и связность текста без архаической перегруженности. Тире перед последней фразой обозначает её тесную, но синтаксически сжатую связь с обещанием спасения, не устраняя неоднозначность еврейской конструкции.
