  rationale: Передаёт связь с предыдущим обещанием и эмфатическое включение ещё одной, неожиданной с точки зрения общественного положения, группы.
- source_word: עַל הָעֲבָדִים וְעַל הַשְּׁפָחוֹת
  choice: на рабов и рабынь
  rationale: Сохраняет мужской и женский компоненты параллельной пары и ясно передаёт подневольный социальный статус, обозначенный еврейскими словами.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: в те дни
  rationale: Естественное и точное соответствие обычному пророческому обозначению времени.
- source_word: אֶשְׁפּוֹךְ
  choice: изолью
  rationale: Сохраняет образ обильного излияния; совершенный вид естественно выражает будущее действие после личной формы «Я».
- source_word: אֶת רוּחִי
  choice: Мой Дух
  rationale: В контексте речь идёт о Божьем собственном Духе, изливаемом на людей; прописная буква обозначает этот контекстуальный референт.
theological_decisions:
- issue: Передача социального статуса עֲבָדִים / שְׁפָחוֹת
  choice: рабы / рабыни
  alternative: слуги / служанки
  rationale: Форма «рабы и рабыни» не смягчает подневольную социальную реальность и сохраняет акцент пророчества на том, что излияние Духа охватывает людей независимо от пола и положения.
- issue: Референт רוּחִי
  choice: Мой Дух
  alternative: мой дух
  rationale: Контекст указывает на принадлежащий Богу Дух, который Он изливает на людей. Написание с прописной буквы отражает этот референт, не уточняя сверх сказанного характер Его действия.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок слов в основном следует еврейскому стиху, но остаётся естественным по-русски; повтор предлога עַל перед второй группой не воспроизведён, поскольку русское однородное сочетание ясно сохраняет параллельность.
