  text: וְ/נָֽתַתִּי֙ מֽוֹפְתִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ דָּ֣ם וָ/אֵ֔שׁ וְ/תִֽימֲר֖וֹת עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/003.yaml
  text: 'And I will give wonders in the heavens and on the earth: blood and fire and columns of smoke[a].'
translation:
  language: ru
  text: 'И явлю чудеса на небесах и на земле: кровь, огонь и столпы дыма[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клубы дыма».'
    reason: 'Лексическая альтернатива: еврейское выражение может обозначать поднимающиеся столбообразные массы или клубы дыма.'
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И явлю
  rationale: Буквально נתן означает «дать, поместить, установить», однако по-русски сочетание «дать чудеса» неестественно. «Явлю» передаёт совершение Богом знаменательных явлений, не добавляя идеи простого показа.
- source_word: מוֹפְתִים
  choice: чудеса
  rationale: Слово обозначает необычайные знамения или чудесные явления. «Чудеса» естественно по-русски и сохраняет оттенок вызывающих трепет сверхъестественных событий.
- source_word: בַּשָּׁמַיִם
  choice: на небесах
  rationale: Сохраняется множественное число еврейского выражения и его космический охват; «в небе» могло бы неоправданно сузить смысл до видимого небосвода.
- source_word: וּבָאָרֶץ
  choice: и на земле
  rationale: Естественная русская формулировка для земной области, противопоставленной небесам.
- source_word: דָּם
  choice: кровь
  rationale: Прямое соответствие исходному существительному без истолковывающего перефразирования.
- source_word: וָאֵשׁ
  choice: огонь
  rationale: Прямое соответствие исходному слову; союз в перечислении по-русски естественно заменён пунктуацией.
- source_word: וְתִימֲרוֹת עָשָׁן
  choice: и столпы дыма
  rationale: תִימֲרוֹת описывает поднимающиеся вертикальные массы дыма. «Столпы дыма» сохраняет яркий образ и достойный библейский регистр; более нейтральный вариант дан в сноске.
theological_decisions:
- issue: Характер описанных явлений
  choice: Космические знамения Божьего вмешательства или суда без уточнения узкой эсхатологической схемы
  alternative: Понимать их исключительно как буквальные физические явления либо исключительно как символический образ потрясений
  rationale: Перевод сохраняет конкретную и грозную образность текста, не решая за читателя, являются ли все её элементы буквальными, символическими или сочетают оба измерения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формула «столпы дыма» образна и понятна, хотя слегка традиционна; сноска предлагает более нейтральный современный вариант.
