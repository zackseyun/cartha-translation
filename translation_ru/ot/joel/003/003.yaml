  source_fidelity: '«И явлю чудеса» адекватно передаёт וְנָתַתִּי מוֹפְתִים в пророческом контексте: буквальное «дам» по-русски здесь неестественно, а «явлю» передаёт установление/появление знаменательных явлений без сужения их смысла. «На небесах и на земле», а также перечисление «кровь, огонь и столпы дыма» сохраняют космический охват, образность и синтаксическую структуру еврейского текста. Неоднозначность характера знамений не устранена переводом.'
