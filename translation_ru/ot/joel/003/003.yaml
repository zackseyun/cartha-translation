  terminology: «Чудеса» соответствует מוֹפְתִים и согласуется с английским audit trail («wonders»), не смешивая термин без необходимости с «знамениями». «Столпы дыма» хорошо передаёт תִימֲרוֹת עָשָׁן; сноска с вариантом «клубы дыма» корректно отмечает допустимую образную альтернативу. Якорь [a] поставлен непосредственно после соответствующего выражения.
