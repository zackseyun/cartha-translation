base_translation:
  language: en
  yaml_path: translation/ot/joel/002/023.yaml
  text: And you[a], children of Zion, rejoice and be glad in Yahweh your God, for he has given you the early rain for righteousness[c][b]; and he causes the rain to come down for you—the early rain and the latter rain as before.
translation:
  language: ru
  text: И вы, дети Сиона, ликуйте и радуйтесь Яхве, вашему Богу, ибо Он дал вам ранний дождь в должной мере[a] и пошлёт вам дожди — ранний и поздний, как прежде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он дал вам учителя для праведности». Еврейское слово морэ может означать и «учитель», и «ранний дождь»; дальнейшее упоминание раннего и позднего дождей поддерживает здесь значение «ранний дождь». Буквально: «для праведности»; это выражение также может означать «для вашей правоты (оправдания)».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в первом месяце». Еврейское выражение допускает календарное понимание, хотя в контексте восстановления естественно значение «как прежде».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי צִיּוֹן
  choice: И вы, дети Сиона
  rationale: Обращение относится ко всему народу Сиона; «дети» сохраняет образ принадлежности, не ограничивая его мужчинами. וּ передано как «И», а подразумеваемое обращение подчёркнуто естественным русским «вы».
- source_word: גִּילוּ וְשִׂמְחוּ
  choice: ликуйте и радуйтесь
  rationale: Два повелительных глагола передают усиленный призыв к радости; сочетание естественно для современного литературного русского языка.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  choice: о Яхве, вашем Боге
  rationale: Предлог ב обозначает основание и предмет радости. «Радоваться о» — достоинная библейская формулировка, а личное имя יהוה передано как «Яхве».
- source_word: כִּי נָתַן לָכֶם
  choice: потому что Он дал вам
  rationale: כִּי вводит причину призыва; перфект נָתַן передан завершённым действием.
- source_word: אֶת הַמּוֹרֶה לִצְדָקָה
  choice: ранний дождь по правде
  rationale: Непосредственный сельскохозяйственный контекст поддерживает значение מוֹרֶה «ранний дождь», хотя возможно и «учитель». Оборот «по правде» сохраняет связь לִצְדָקָה с правдой/праведностью и допускает смысл справедливой, должной меры, не сводя выражение только к одному толкованию.
- source_word: וַיּוֹרֶד לָכֶם גֶּשֶׁם
  choice: и ниспослал вам дождь
  rationale: Каузативная форма ירד значит «заставил сойти, ниспослал»; в русском «ниспослал дождь» естественно и передаёт направление свыше.
- source_word: מוֹרֶה וּמַלְקוֹשׁ
  choice: ранний и поздний
  rationale: 'Термины обозначают сезонные дожди: ранний осенний и поздний весенний; повтор слова «дождь» в русском не требуется.'
- source_word: בָּרִאשׁוֹן
  choice: как прежде
  rationale: В контексте восстановления вероятно наречное значение «как прежде»; возможное календарное понимание вынесено в примечание.
theological_decisions:
- issue: 'Значение הַמּוֹרֶה: ранний дождь или учитель'
  choice: 'В основном тексте: «ранний дождь»'
  alternative: «учитель правды» или «учитель для праведности»
  rationale: Следующие слова прямо называют дождь, ранний и поздний, поэтому метеорологическое значение лучше связано с ближайшим контекстом. Альтернатива сохранена в примечании без навязывания мессианского или иного догматического толкования.
- issue: Значение לִצְדָקָה
  choice: «по правде»
  alternative: «в должной мере» или «для вашего оправдания»
  rationale: Перевод сохраняет нравственно-заветный оттенок корня צדק и одновременно оставляет открытым смысл действия согласно справедливости; более узкие контекстуальные варианты приведены в примечании.
- issue: Значение בָּרִאשׁוֹן
  choice: «как прежде»
  alternative: «в первом месяце»
  rationale: Контекст восстановления благословений поддерживает сопоставление с прежним временем, но грамматически возможно календарное прочтение, поэтому оно отмечено отдельно.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Сохранены параллелизм повелений, личное имя Яхве и неоднозначности ключевых еврейских выражений; архаизмы и конфессионально обусловленные толкования не вводятся.
