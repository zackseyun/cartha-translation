revisions:
- from: И вы, дети Сиона, ликуйте и радуйтесь о Яхве, вашем Боге, потому что Он дал вам ранний дождь по правде[a] и ниспослал вам дождь — ранний и поздний, как прежде[b].
  to: И вы, дети Сиона, ликуйте и радуйтесь Яхве, вашему Богу, ибо Он дал вам ранний дождь в должной мере[a] и пошлёт вам дожди — ранний и поздний, как прежде[b].
  rationale: Исправлена неудачная русская калька «по правде» на контекстуально ясное «в должной мере», при этом буквальное и альтернативные значения לִצְדָקָה сохранены в сноске. Выбор «ранний дождь» остаётся основным вследствие непосредственного метеорологического контекста, а вариант «учитель» отмечен без конфессионального истолкования. Синтаксис и формы дождей приведены к естественному современному литературному русскому; «пошлёт» отражает обещательный ход фразы.
