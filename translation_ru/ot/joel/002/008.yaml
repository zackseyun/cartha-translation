lexical_decisions:
- source_word: אִישׁ אָחִיו
  choice: Никто… другого
  rationale: Дистрибутивное выражение, буквально «муж — брата своего», описывает взаимное невмешательство участников войска. По-русски естественно передано конструкцией «никто… другого».
- source_word: יִדְחָקוּן
  choice: не теснит
  rationale: Глагол דחק означает «теснить, давить, толкать». «Не теснит» сохраняет образ плотного, но упорядоченного движения.
- source_word: גֶּבֶר
  choice: каждый
  rationale: 'Слово возобновляет дистрибутивную мысль: каждый отдельный участник движется по своей линии. Контекст допускает «воин», но само существительное этого не уточняет.'
- source_word: בִּמְסִלָּתוֹ
  choice: своей дорогой
  rationale: מְסִלָּה обозначает дорогу, тракт или путь движения. В контексте имеется в виду установленная для каждого линия продвижения; «своей дорогой» естественно передаёт этот смысл.
- source_word: יֵלֵכוּן
  choice: идёт
  rationale: הלך — общий глагол движения «идти, ходить». Выбрано нейтральное «идёт», без контекстуально возможного, но более узкого «марширует».
- source_word: וּבְעַד הַשֶּׁלַח
  choice: среди оружия
  rationale: שֶׁלַח может обозначать оружие, в частности метательное, а בעד — движение через или среди чего-либо. «Среди оружия» сохраняет образ прохождения под ударом, не уточняя вид оружия.
- source_word: יִפֹּלוּ
  choice: они падают
  rationale: נפל прямо означает «падать». Перевод не добавляет отсутствующего в тексте уточнения «поражённые».
- source_word: לֹא יִבְצָעוּ
  choice: не сходят со строя
  rationale: Форма от בצע здесь лексически трудна. В военном контексте фраза, вероятно, выражает то, что наступающие не прекращают движения и не нарушают построения; «не сходят со строя» передаёт этот контекстуальный смысл, сохраняя альтернативу в сноске.
