  text: י֧וֹם חֹ֣שֶׁךְ וַ/אֲפֵלָ֗ה י֤וֹם עָנָן֙ וַ/עֲרָפֶ֔ל כְּ/שַׁ֖חַר פָּרֻ֣שׂ עַל הֶֽ/הָרִ֑ים עַ֚ם רַ֣ב וְ/עָצ֔וּם כָּמֹ֗/הוּ לֹ֤א נִֽהְיָה֙ מִן הָ֣/עוֹלָ֔ם וְ/אַֽחֲרָי/ו֙ לֹ֣א יוֹסֵ֔ף עַד שְׁנֵ֖י דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/002.yaml
  text: A day of darkness and gloom[a], a day of clouds and thick darkness; like dawn spread over the mountains, a great and mighty people comes. Nothing like it has ever been from of old, and after it there will not again be any[c][b], through the years of generation after generation.
translation:
  language: ru
  text: День тьмы и мрака, день облаков и густой мглы! Словно заря, разлившаяся по горам, — народ многочисленный и могучий[b]. Подобного ему не бывало издревле, и после него не будет подобного во все грядущие поколения[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Многочисленный и могучий народ» может означать вторгшееся войско, рой саранчи, описанный военными образами, либо намеренно объединять оба образа.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «до лет рода и рода» — еврейская идиома, обозначающая неопределённо долгую череду поколений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֧וֹם
  choice: день
  rationale: Основное временное значение существительного; повтор сохранён ради поэтического ритма и пророческой формулы возвещения.
- source_word: חֹשֶׁךְ וַאֲפֵלָה
  choice: тьма и мрак
  rationale: Два близких по значению слова переданы привычной русской парой, причём второе усиливает образ непроглядной тьмы.
- source_word: עָנָן וַעֲרָפֶל
  choice: облака и густая мгла
  rationale: עָנָן обозначает облако или облачность, а עֲרָפֶל — плотную, застилающую видимость тьму или мглу; определение «густая» сохраняет нарастание образа.
- source_word: כְּשַׁחַר
  choice: словно заря
  rationale: Обычное значение שַׁחַר — «заря». Образ света, быстро разливающегося по горным склонам, естественно сочетается с причастием «раскинувшийся», хотя контекст допускает редкое и спорное понимание как «чернота».
- source_word: פָּרֻשׂ עַל הֶהָרִים
  choice: раскинулся по горам
  rationale: Пассивное причастие описывает нечто простёршееся или распространившееся над горами. В русском предложении форма преобразована в личный глагол и согласована с «народ», чтобы образ звучал естественно.
- source_word: עַם רַב וְעָצוּם
  choice: многочисленный и могучий народ
  rationale: עַם оставлено в широком значении «народ», без уточнения «войско». רַב в данном контексте подчёркивает многочисленность, а עָצוּם — силу и грозное могущество.
- source_word: כָּמֹהוּ לֹא נִהְיָה מִן הָעוֹלָם
  choice: подобного ему не бывало издревле
  rationale: Формулировка сохраняет коллективный мужской референт «народ» и передаёт מִן הָעוֹלָם как указание на отдалённое прошлое.
- source_word: עַד שְׁנֵי דּוֹר וָדוֹר
  choice: во все грядущие поколения
  rationale: Еврейская формула буквально говорит о «годах поколения и поколения» и означает неопределённо долгую череду поколений; естественная русская идиома передаёт этот смысл без ложной точности.
theological_decisions:
- issue: Кого обозначает «многочисленный и могучий народ»
  choice: Сохранено общее слово «народ», без отождествления с войском или саранчой.
  alternative: Нашествие саранчи, человеческое войско либо намеренно слитный образ природного бедствия и военного вторжения.
  rationale: В самом стихе употреблено עַם («народ»), а образ остаётся многозначным. Более конкретный перевод преждевременно снял бы заложенное в тексте толковательное напряжение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Параллелизм двух начальных конструкций «день… день…» сохранён; восклицательный знак передаёт напряжённость возвещения. Синтаксис образа зари перестроен минимально ради естественности русского текста, без уточнения природы наступающего «народа».
