  rationale: Центральный образ переработан так, чтобы пассивное причастие פָּרוּשׂ было выражено русским причастным оборотом и не получало излишне определённого синтаксического истолкования. Заключительная формула слегка выровнена для более близкой передачи повторяемого «подобный/подобного». Сноска a сохранена как предусмотренная лексическая альтернатива, но её якорь в основном тексте не ставится, поскольку выбранное чтение «заря» является основным; якорь b оставлен при «народе», а c — при формуле о поколениях.
