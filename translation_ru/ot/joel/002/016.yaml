  yaml_path: translation/ot/joel/002/016.yaml
  text: Gather the people[a]; consecrate the assembly; gather the elders; gather the children, even the nursing infants. Let the bridegroom come out from his room[c][b], and the bride from her chamber.
translation:
  language: ru
  text: Соберите народ, освятите собрание, созовите старейшин, соберите детей и грудных младенцев. Пусть жених выйдет из своей комнаты, а невеста — из своего свадебного полога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из своего брачного покоя». Еврейское слово может означать свадебный полог либо брачный покой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ
  choice: соберите
  rationale: Повелительная форма глагола אסף прямо призывает собрать людей; повтор переведён тем же глаголом, чтобы сохранить риторическую структуру.
- source_word: קַדְּשׁוּ קָהָל
  choice: освятите собрание
  rationale: קדשׁ в породе пиэль здесь означает отделить собрание для священной цели; «освятите» сохраняет культовый смысл и звучит естественно в библейском контексте.
- source_word: קִבְצוּ זְקֵנִים
  choice: созовите старейшин
  rationale: קבץ близко по смыслу к אסף, но «созовите» естественно передаёт сбор определённой группы и сохраняет некоторое лексическое различие; זְקֵנִים передано как общественно признанные старейшины.
- source_word: עוֹלָלִים וְיֹנְקֵי שָׁדָיִם
  choice: детей и грудных младенцев
  rationale: Перевод различает малых детей и младенцев, буквально питающихся грудью, и подчёркивает включение самых маленьких.
- source_word: יֵצֵא
  choice: пусть … выйдет
  rationale: Юссивная форма передана побудительной конструкцией, продолжающей ряд призывов.
- source_word: חָתָן מֵחֶדְרוֹ
  choice: жених … из своей комнаты
  rationale: חֶדֶר обозначает внутреннюю комнату или покой; современное «комната» не добавляет к исходному тексту брачной конкретизации.
- source_word: כַלָּה מֵחֻפָּתָהּ
  choice: невеста — из-под своего свадебного полога
  rationale: חֻפָּה может обозначать брачный полог или связанное с ним брачное помещение. «Свадебный полог» сохраняет конкретный образ и сопровождается примечанием об альтернативе.
theological_decisions:
- issue: Сакральный характер общего созыва
  choice: «освятите собрание»
  alternative: «отделите собрание» или «посвятите собрание»
  rationale: Контекст торжественного покаянного созыва требует сохранить культовый смысл קדשׁ, не уточняя не названные в тексте обряды.
- issue: Значение זְקֵנִים
  choice: «старейшин»
  alternative: «стариков»
  rationale: В общественно-религиозном контексте слово, вероятнее всего, обозначает признанных старейшин, хотя его возрастное значение остаётся возможным.
- issue: Образ חֻפָּה
  choice: «свадебный полог»
  alternative: «брачный покой»
  rationale: Еврейское слово допускает оба понимания; основной текст передаёт предметный образ полога, а примечание сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого призыва. Последовательность кратких повелений сохранена; архаизмы вроде «чертог» и «сосущие груди» устранены. Единственный маркер [a] помещён непосредственно после спорного выражения.
