  text: לְ/פָנָי/ו֙ אָ֣כְלָה אֵ֔שׁ וְ/אַחֲרָ֖י/ו תְּלַהֵ֣ט לֶֽהָבָ֑ה כְּ/גַן עֵ֨דֶן הָ/אָ֜רֶץ לְ/פָנָ֗י/ו וְ/אַֽחֲרָי/ו֙ מִדְבַּ֣ר שְׁמָמָ֔ה וְ/גַם פְּלֵיטָ֖ה לֹא הָ֥יְתָה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/003.yaml
  text: Before it[a], fire devours; behind it, a flame blazes. The land before it is like the garden of Eden, but behind it is a desolate wilderness; indeed, nothing escapes it.
translation:
  language: ru
  text: Впереди него огонь пожирает, позади него пламя пылает. Земля перед ним — как сад Эдема, а позади него — опустошённая пустыня; и от него ничто не спасается[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у него не осталось уцелевших»; возможно также: «от него нет спасения». Еврейское слово может означать как спасение или избавление, так и уцелевшего человека либо остаток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו / וְאַחֲרָיו
  choice: перед ним / позади него
  rationale: Пространственные выражения образуют параллель. Мужской род сохраняет еврейские суффиксы 3-го лица единственного числа и коллективное олицетворение наступающей силы, не утверждая, что речь идёт об отдельном человеке.
- source_word: אָכְלָה אֵשׁ
  choice: пожирает огонь
  rationale: Перфект в живом пророческом описании передан настоящим временем; «пожирает» сохраняет образ всепоглощающего разрушения.
- source_word: תְּלַהֵט לֶהָבָה
  choice: пылает пламя
  rationale: Порода пиэль выражает интенсивное горение; сочетание естественно для современного русского языка и сохраняет усиленную образность.
- source_word: כְּגַן עֵדֶן
  choice: словно Эдемский сад
  rationale: Передаёт сравнение и узнаваемую отсылку к саду Эдема без утраты естественности русской речи.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте сельскохозяйственного опустошения обозначает местность или территорию, а не весь мир.
- source_word: מִדְבַּר שְׁמָמָה
  choice: безлюдная пустыня
  rationale: שְׁמָמָה обозначает запустение, опустошённость и безлюдье; формулировка сохраняет образ территории, лишённой жизни и обитателей.
- source_word: וְגַם
  choice: и
  rationale: Соединительный элемент вводит кульминационный итог; в русском языке его усилительная сила достаточно выражена порядком и абсолютностью следующего отрицания.
- source_word: פְּלֵיטָה לֹא הָיְתָה לוֹ
  choice: ничто от него не спасается
  rationale: Идиоматически выражает полное отсутствие спасения или уцелевшего остатка, сохраняя при этом лексическую неоднозначность существительного פְּלֵיטָה в примечании.
theological_decisions:
- issue: Референт суффиксов мужского рода единственного числа
  choice: Передать как «ним / него», относя к коллективно представленной наступающей силе
  alternative: Использовать средний род («перед ним» невозможно нейтрализовать без называния референта) либо прямо назвать войско или рой
  rationale: Еврейский текст сохраняет мужской род и коллективное олицетворение. Русское местоимение мужского рода точнее воспроизводит форму, не вводя в стих отсутствующее существительное.
- issue: Значение פְּלֵיטָה в заключительной фразе
  choice: Основной текст передаёт отсутствие возможности спастись
  alternative: «У него не осталось уцелевших» или «для него не было спасения»
  rationale: Слово может обозначать спасение, избежание бедствия либо уцелевшего человека или остаток. Основной вариант естественен по-русски, а примечание сохраняет смысловой диапазон и богословски значимую напряжённость между полным разорением и отсутствием уцелевших.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой образностью. Сохранены симметрия «перед ним — позади него», настоящее время живого описания и контраст Эдемского сада с опустошённой пустыней.
