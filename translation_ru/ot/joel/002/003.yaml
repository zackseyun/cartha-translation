  rationale: Правка устраняет сужение смысла «запустения» до одного лишь безлюдья, делает заключительную фразу естественной по-русски и уточняет альтернативное примечание. Мужской род местоимений сохранён вслед за еврейскими суффиксами и не требует отождествлять коллективную наступающую силу с отдельным человеком.
