base_translation:
  language: en
  yaml_path: translation/ot/joel/002/025.yaml
  text: I will restore to you the years that the swarming locust has eaten—the hopper[a], the destroyer[b], and the cutter—my great army that I sent among you.
translation:
  language: ru
  text: Я возмещу вам годы, которые пожрали роевая саранча, молодая саранча, саранча-пожиратель и саранча-грызун[a], — Моё великое войско, которое Я послал среди вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Четыре еврейских слова, вероятно, обозначают разные виды или стадии развития саранчи. Их точные зоологические различия неизвестны; возможны также переводы «ползучая саранча», «пожиратель» и «подрезающий».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которое Я послал против вас». Еврейский предлог здесь допускает оба понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Я возмещу
  rationale: Пиэль глагола שלם выражает возмещение или восполнение понесённой утраты. «Возмещу» естественно передаёт обещание Бога восполнить последствия разорения, не сводя его к денежной выплате.
- source_word: לָכֶם
  choice: вам
  rationale: Предлог ל обозначает тех, кому предназначено обещанное возмещение.
- source_word: הַשָּׁנִים
  choice: годы
  rationale: 'Сохранён буквальный и выразительный образ еврейского текста: саранча словно пожрала сами годы, то есть их урожаи и плоды.'
- source_word: אֲשֶׁר אָכַל
  choice: которые пожрали
  rationale: Глагол אכל буквально означает «есть, пожирать». Множественное число в русском согласовано с последующим перечислением четырёх обозначений саранчи.
- source_word: הָאַרְבֶּה
  choice: стадная саранча
  rationale: אַרבה — обычное обозначение саранчи; уточнение «стадная» отражает её роевой характер и помогает отличить первый термин от следующих, не выдавая его за точное название биологического вида.
- source_word: הַיֶּלֶק
  choice: молодая саранча
  rationale: Точное зоологическое значение неясно; слово может обозначать молодую или ползающую стадию саранчи. Выбрано понятное современному читателю обозначение.
- source_word: וְהֶחָסִיל
  choice: саранча-пожиратель
  rationale: Название связано с уничтожением и пожиранием. Функциональное обозначение сохраняет разрушительный оттенок, не создавая ложной таксономической точности.
- source_word: וְהַגָּזָם
  choice: саранча-грызун
  rationale: Термин традиционно связывают с подрезанием или обгрызанием. «Саранча-грызун» отличает его от остальных названий и передаёт предполагаемый смысл.
- source_word: חֵילִי הַגָּדוֹל
  choice: Моё великое войско
  rationale: חיל здесь означает войско или военную силу. Перевод сохраняет военный образ, которым описано нашествие саранчи, и прямое указание на власть Бога над ним.
- source_word: אֲשֶׁר שִׁלַּחְתִּי בָּכֶם
  choice: которое Я послал среди вас
  rationale: Форма первого лица прямо приписывает Богу посылание бедствия. Предлог ב допускает пространственное понимание «среди вас», хотя возможно и направленное «против вас».
theological_decisions:
- issue: Следует ли понимать названия буквально как саранчу или только как образ человеческого войска
  choice: Реальное нашествие саранчи, описанное военным языком
  alternative: Человеческое войско, полностью скрытое за метафорой саранчи
  rationale: Четыре специальных названия насекомых, после которых они названы «Моим великим войском», лучше всего сохраняют одновременно буквальный план бедствия и военную метафору, не устраняя возможного более широкого образного звучания.
- issue: Божественная причастность к бедствию
  choice: Бог прямо говорит, что послал это войско
  alternative: Бог лишь допустил бедствие
  rationale: Еврейский текст содержит недвусмысленное «Я послал». Перевод не ослабляет это утверждение до одного лишь попущения.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа «возместить годы». Перечень передан понятными описательными названиями, поскольку точное различие четырёх древнееврейских терминов неизвестно. Заглавные местоимения в прямой речи Бога соответствуют принятому русскому библейскому регистру.
