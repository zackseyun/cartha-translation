  text: בֵּ֤ין הָ/אוּלָם֙ וְ/לַ/מִּזְבֵּ֔חַ יִבְכּוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָ֑ה וְֽ/יֹאמְר֞וּ ח֧וּסָ/ה יְהוָ֣ה עַל עַמֶּ֗/ךָ וְ/אַל תִּתֵּ֨ן נַחֲלָתְ/ךָ֤ לְ/חֶרְפָּה֙ לִ/מְשָׁל בָּ֣/ם גּוֹיִ֔ם לָ֚/מָּה יֹאמְר֣וּ בָֽ/עַמִּ֔ים אַיֵּ֖ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/017.yaml
  text: Let the priests[a], the ministers of Yahweh, weep between the portico and the altar, and let them say, “Spare your people, Yahweh, and do not make your inheritance a reproach, a byword among the nations. Why should they say among the peoples[b], ‘Where is their God?’”
translation:
  language: ru
  text: 'Между притвором[a] и жертвенником пусть плачут священники, служители Яхве, и пусть говорят:


    «Пощади, Яхве, свой народ,

    не предавай своё наследие поруганию,

    на посмешище народам.[b]


    Зачем народам говорить:

    „Где их Бог?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между портиком и жертвенником»; возможный вариант: «между преддверием и жертвенником».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможное прочтение: «не предавай своё наследие поруганию, чтобы народы властвовали над ними». Еврейское выражение допускает значение как насмешливой присказки, так и чужеземного господства; ближайший контекст с вопросом «Где их Бог?» скорее указывает на публичную насмешку.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין הָאוּלָם וְלַמִּזְבֵּחַ
  choice: между притвором и жертвенником
  rationale: אוּלָם обозначает входную часть храма, то есть притвор или портик. «Притвор» — естественный русский храмовый термин, сохраняющий конкретную культовую обстановку.
- source_word: יִבְכּוּ ... וְיֹאמְרוּ
  choice: пусть плачут ... и пусть говорят
  rationale: В данном призывном контексте формы выражают побуждение; повтор «пусть» ясно передаёт эту функцию по-русски.
- source_word: הַכֹּהֲנִים מְשָׁרְתֵי יְהוָה
  choice: священники, служители Яхве
  rationale: Причастное обозначение מְשָׁרְתֵי указывает на их официальное храмовое служение; «служители» сохраняет этот смысл и возвышенный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: חוּסָה עַל עַמֶּךָ
  choice: пощади свой народ
  rationale: Императив просит удержать губительный суд и проявить сострадание. Русское «пощади» ёмко выражает оба аспекта; предлог עַל в сочетании с глаголом естественно передаётся прямым дополнением.
- source_word: וְאַל תִּתֵּן נַחֲלָתְךָ לְחֶרְפָּה
  choice: не предавай своё наследие поруганию
  rationale: «Предавать поруганию» естественно передаёт конструкцию נתן לְ и значение публичного унижения; «наследие» сохраняет заветный образ народа как принадлежащего Богу удела.
- source_word: לִמְשָׁל בָּם גּוֹיִם
  choice: на посмешище народам
  rationale: В связи с חֶרְפָּה и последующей насмешливой репликой מָשָׁל здесь вероятнее обозначает предмет насмешек или унизительную присказку. Формулировка естественна по-русски и не устраняет альтернативное понимание, отмеченное в сноске.
- source_word: לָמָּה יֹאמְרוּ בָעַמִּים
  choice: зачем среди народов будут говорить
  rationale: Будущее время передаёт опасаемое последствие, а безлично-неопределённое «будут говорить» соответствует отсутствию явно названного подлежащего.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение לִמְשָׁל בָּם גּוֹיִם
  choice: на посмешище народам
  alternative: чтобы народы властвовали над ними
  rationale: Корень משל допускает связь либо с притчей/насмешливой присказкой, либо с владычеством. Параллель с «поруганием» и следующий вопрос «Где их Бог?» поддерживают значение публичной насмешки, но альтернативное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-пророческим звучанием. Синтаксический параллелизм и храмовая терминология сохранены; архаизмы и конфессионально окрашенные замены имени Бога не использованы. Местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с нейтральной современной издательской практикой.
