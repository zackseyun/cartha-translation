  yaml_path: translation/ot/joel/002/024.yaml
  text: The threshing floors will be filled with grain[a], and the vats will overflow with new wine and oil.
translation:
  language: ru
  text: Гумна наполнятся зерном, а чаны[a] будут переливаться через край от молодого вина и оливкового масла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «давильни».'
    reason: Лексема может обозначать давильню либо связанную с ней ёмкость для сбора вина или масла; контекст переливания через край поддерживает перевод «чаны».
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: наполнятся
  rationale: Форма совершенного вида с союзом в пророческом контексте выражает будущее состояние как результат восстановления.
- source_word: הַגֳּרָנוֹת
  choice: гумна
  rationale: Слово обозначает площадки для молотьбы; традиционное русское «гумна» точно и достаточно понятно передаёт сельскохозяйственный образ.
- source_word: בָּר
  choice: зерном
  rationale: Здесь имеется в виду зерно вообще, а не только пшеница.
- source_word: וְהֵשִׁיקוּ
  choice: будут переполняться
  rationale: Передаёт образ жидкости, обильно наполняющей ёмкости и переливающейся через край.
- source_word: הַיְקָבִים
  choice: чаны
  rationale: Речь идёт о ёмкостях при давильнях, куда стекали вино и масло; «чаны» естественно сочетается с образом переполнения.
- source_word: תִּירוֹשׁ
  choice: молодым вином
  rationale: Обозначает свежее вино как продукт нового урожая; «молодое вино» сохраняет сезонный сельскохозяйственный оттенок.
- source_word: וְיִצְהָר
  choice: оливковым маслом
  rationale: В данном сельскохозяйственном контексте слово обозначает масло, обычно оливковое; уточнение предотвращает современное понимание как любого растительного масла.
