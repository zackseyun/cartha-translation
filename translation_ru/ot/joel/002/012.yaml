base_translation:
  language: en
  yaml_path: translation/ot/joel/002/012.yaml
  text: “Yet even now,” declares Yahweh[a], “return to me with all your heart, and with fasting, and with weeping, and with mourning.”
translation:
  language: ru
  text: «Но даже теперь, — возвещает Яхве, — обратитесь ко Мне всем сердцем, с постом, плачем и скорбью».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернитесь ко Мне». В заветном контексте глагол также может означать «покайтесь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם עַתָּה
  choice: Но и теперь
  rationale: Сочетание вводит уступительный поворот на фоне предшествующего суда и подчёркивает, что возможность возвращения сохраняется даже теперь.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная пророческая формула; «возвещает» естественно передаёт её весомость. Имя יהוה передано как «Яхве», а не заменено титулом.
- source_word: שֻׁבוּ עָדַי
  choice: обратитесь ко Мне
  rationale: שוב обозначает поворот или возвращение; в сочетании с עָדַי выражает направленное к Богу восстановление отношений. «Обратитесь» сохраняет образ поворота и естественно звучит по-русски.
- source_word: בְּכָל לְבַבְכֶם
  choice: всем сердцем
  rationale: לבב обозначает внутреннего человека, включая волю и чувства; устойчивое русское выражение точно передаёт полноту посвящения.
- source_word: וּבְצוֹם וּבְבְכִי וּבְמִסְפֵּד
  choice: с постом, плачем и скорбью
  rationale: Три существительных передают телесно выраженное покаяние. Повтор предлога в древнееврейском допускает естественное русское перечисление с одним «с»; «скорбь» сохраняет широкий смысл מספד, не сводя его только к погребальному обряду.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное заветное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Значение שׁוב в призыве к Израилю
  choice: обратитесь ко Мне
  alternative: вернитесь ко Мне; покайтесь
  rationale: Глагол буквально выражает поворот или возвращение, а в заветном контексте подразумевает покаяние. «Обратитесь ко Мне» сохраняет направленность к Богу и не сужает смысл до отвлечённого термина.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Прямой призыв передан ясно и ритмично; прописное «Мне» употреблено как традиционный знак почтения к Богу.
