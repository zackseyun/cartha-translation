source:
  edition: WLC
  text: תִּקְע֨וּ שׁוֹפָ֜ר בְּ/צִיּ֗וֹן וְ/הָרִ֨יעוּ֙ בְּ/הַ֣ר קָדְשִׁ֔/י יִרְגְּז֕וּ כֹּ֖ל יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּֽי בָ֥א יוֹם יְהוָ֖ה כִּ֥י קָרֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/001.yaml
  text: Blow a horn in Zion[a], and sound an alarm on my holy mountain; let all the inhabitants of the land tremble, for the day of Yahweh is coming—indeed, it is near.
translation:
  language: ru
  text: Трубите в рог на Сионе, бейте тревогу на Моей святой горе! Пусть трепещут все жители земли[a], потому что наступает день Яхве — да, он близок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово אֶרֶץ может обозначать как конкретную землю или страну, так и всю землю, то есть мир.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּקְעוּ שׁוֹפָר
  choice: Трубите в рог
  rationale: Глагол תקע в сочетании с שׁוֹפָר обозначает трубный сигнал. «Рог» точно передаёт древний сигнальный инструмент, не создавая образа современной металлической трубы.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: В русском библейском и географическом употреблении применительно к Сиону как горе и священному месту естественно «на Сионе»; контекст далее прямо говорит о святой горе.
- source_word: וְהָרִיעוּ
  choice: бейте тревогу
  rationale: Побудительная форма רוע здесь означает подать громкий сигнал тревоги. Русское выражение передаёт предупреждающую функцию и образует естественный параллелизм с трубным сигналом.
- source_word: בְּהַר קָדְשִׁי
  choice: на Моей святой горе
  rationale: Предлог при слове «гора» естественно передаётся как «на»; суффикс первого лица сохранён в «Моей».
- source_word: יִרְגְּזוּ
  choice: Пусть трепещут
  rationale: Форма выражает побуждение или ожидаемую реакцию после повелений. «Трепещут» передаёт как физическую дрожь, так и страх, не уточняя сверх текста.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: все жители земли
  rationale: Слово אֶרֶץ допускает как местное значение «земля, страна», так и широкое «земля, мир». Русское «земли» сохраняет часть этой неоднозначности; возможный охват пояснён в сноске.
- source_word: כִּי בָא יוֹם יְהוָה
  choice: потому что наступает день Яхве
  rationale: בָא указывает на приближающееся наступление дня. «Наступает» естественно сочетается со словом «день» и передаёт неотвратимую близость события.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменено титулом.
- source_word: כִּי קָרוֹב
  choice: да, он близок
  rationale: Второе כִּי может иметь пояснительный или усилительный оттенок. «Да» сохраняет усиление, не сводя связь исключительно к причинной.
theological_decisions:
- issue: 'Охват הָאָרֶץ: конкретная земля или вся земля'
  choice: земли
  alternative: страны; всей земли (мира)
  rationale: Упоминание Сиона и святой горы поддерживает местный смысл, тогда как тема дня Яхве допускает более широкий охват. Основной текст и сноска сохраняют эту смысловую напряжённость.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Краткие повеления и восклицательный знак передают срочность предупреждения; архаизмы по возможности исключены.
