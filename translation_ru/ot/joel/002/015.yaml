  text: Blow a trumpet in Zion[a]; consecrate a fast[c][b]; call a solemn assembly.
translation:
  language: ru
  text: Трубите в рог на Сионе[a], освятите пост[b], созовите торжественное собрание[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шофар» вместо «рог». Шофар — сигнальный духовой инструмент из рога, которым возвещали тревогу или созывали народ.'
    reason: lexical_alternative
  - marker: b
    text: То есть посвятите пост священной цели, установив его как особое религиозное соблюдение.
    reason: lexical_clarification
  - marker: c
    text: 'Или: «священное собрание». Еврейское слово обозначает особое официальное религиозное собрание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Трубите
  rationale: Форма повелительного наклонения множественного числа от תקע; в сочетании с שׁוֹפָר естественно передаётся глаголом «трубить» и сохраняет прямой призыв.
- source_word: שׁוֹפָר
  choice: рог
  rationale: Слово обозначает сигнальный духовой инструмент из рога, употреблявшийся для тревоги и священного созыва. «Рог» точнее сохраняет предметную специфику, чем общее «труба».
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Предлог ב допускает пространственное значение; по-русски применительно к Сиону как горе и священному месту естественно «на Сионе».
- source_word: קַדְּשׁוּ
  choice: освятите
  rationale: 'Пиэль, повелительное наклонение множественного числа от קדשׁ: отделить для священной цели, объявить священным. «Освятите» кратко и точно передаёт культовый смысл.'
- source_word: צוֹם
  choice: пост
  rationale: Существительное обозначает конкретно назначаемый пост как общинное религиозное соблюдение.
- source_word: קִרְאוּ
  choice: созовите
  rationale: В сочетании с обозначением собрания קרא означает призвать людей собраться; «созовите» естественно передаёт это значение и повелительную силу.
- source_word: עֲצָרָה
  choice: торжественное собрание
  rationale: Обозначает официальное священное собрание. В современном русском библейском регистре «торжественное собрание» передаёт формальность и особую религиозную значимость, не сводя слово лишь к эмоциональной печали.
theological_decisions:
- issue: Характер עֲצָרָה
  choice: торжественное собрание
  alternative: священное собрание; строгое собрание
  rationale: Еврейское слово обозначает особый официальный религиозный сход и само по себе не требует толковать его исключительно как скорбный или покаянный; контекст поста сообщает серьёзность призыва.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим ритмом. Три параллельных повеления сохранены. «Трубите в рог» звучит естественно и конкретно; «торжественное собрание» сохраняет традиционный сакральный оттенок без архаизации.
