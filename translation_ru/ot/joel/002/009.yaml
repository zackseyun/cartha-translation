  text: They rush through the city[a]; they run on the wall; they climb into the houses; they enter through the windows like a thief.
translation:
  language: ru
  text: Они носятся по городу[a], бегут по стене, забираются в дома, проникают через окна, словно воры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в городе»; еврейский предлог буквально означает «в», однако при глаголе движения здесь естественно понимать перемещение по городу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁקּוּ
  choice: мечутся
  rationale: Глагол передаёт стремительное, порывистое движение. «Мечутся» естественно звучит по-русски и сохраняет картину быстрого перемещения по городу.
- source_word: בָּעִיר
  choice: по городу
  rationale: Предлог ב буквально указывает на нахождение «в» городе, но при глаголе движения русское «по городу» естественно передаёт перемещение в его пределах.
- source_word: יְרֻצוּן
  choice: бегут
  rationale: Прямое соответствие обычному глаголу רוץ; сохраняет лаконичность и параллелизм ряда движений.
- source_word: בַּחוֹמָה
  choice: по стене
  rationale: При глаголе движения сочетание естественно означает бег по городской стене; единственное число сохраняет образ укрепления города.
- source_word: יַעֲלוּ
  choice: взбираются
  rationale: Глагол означает «подниматься, восходить»; в контексте проникновения в дома «взбираются» передаёт подъём без излишнего уточнения способа.
- source_word: בַּבָּתִּים
  choice: в дома
  rationale: Предлог с определённой формой существительного в данном контексте обозначает направленность проникновения внутрь домов.
- source_word: בְּעַד הַחַלּוֹנִים
  choice: через окна
  rationale: בְּעַד обозначает движение через отверстие или проём; «через окна» — точная и естественная русская формулировка.
- source_word: יָבֹאוּ
  choice: проникают
  rationale: Обычное значение — «входят, приходят»; «проникают» естественно передаёт незваное вторжение через окна, поддержанное сравнением с вором.
- source_word: כַּגַּנָּב
  choice: словно вор
  rationale: Сохраняет прямое сравнение и его оттенок тайного, незаконного проникновения, не привнося позднейших богословских ассоциаций.
theological_decisions:
- issue: Кто подразумевается под наступающими
  choice: Сохранить невыраженное подлежащее во множественном числе («они»), не называя его прямо.
  alternative: Прямо назвать саранчу или человеческое войско.
  rationale: В еврейском тексте здесь стоят глаголы третьего лица множественного числа без названного подлежащего. Контекст книги Иоиля допускает наложение образов нашествия саранчи и военного вторжения, поэтому перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом. Цепочка глаголов настоящего времени сохраняет живость пророческой картины; лексика понятна широкому читателю и не закрепляет спорный референт образа.
