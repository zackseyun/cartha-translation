lexical_decisions:
- source_word: כְּמַרְאֵה סוּסִים מַרְאֵהוּ
  choice: Вид у них — как у коней
  rationale: Мַרְאֶה обозначает видимый облик. Повтор существительного в еврейском в русском передан естественной сравнительной конструкцией; суффикс 3-го лица мужского рода единственного числа понят собирательно по контексту.
- source_word: וּכְפָרָשִׁים
  choice: словно всадники
  rationale: פָּרָשִׁים — всадники, то есть конные воины; «всадники» сохраняет военный образ и понятно современному читателю.
- source_word: כֵּן יְרוּצוּן
  choice: и несутся они
  rationale: Рוץ означает «бежать». В контексте сравнения с конями и всадниками «несутся» естественно передаёт стремительное движение, а построение фразы сохраняет связь между обликом и движением.
