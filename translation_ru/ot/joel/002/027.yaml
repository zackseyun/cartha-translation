source:
  edition: WLC
  text: וִ/ידַעְתֶּ֗ם כִּ֣י בְ/קֶ֤רֶב יִשְׂרָאֵל֙ אָ֔נִי וַ/אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם וְ/אֵ֣ין ע֑וֹד וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/027.yaml
  text: Then you will know that I am in the midst of Israel[a], and that I am Yahweh your God, and there is no other; and my people will never again be put to shame.
translation:
  language: ru
  text: И тогда вы узнаете, что Я пребываю среди Израиля, что Я — Яхве, ваш Бог, и нет другого. И Мой народ никогда больше не будет посрамлён.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Мой народ не будет посрамлён вовек».'
    reason: לְעוֹלָם буквально означает «вовек»; в основном тексте его контекстуальная сила передана словами «никогда больше».
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: И тогда вы узнаете
  rationale: Форма с союзом в данном пророческом контексте указывает на будущий результат обещанного восстановления; «тогда» естественно передаёт следственную связь.
- source_word: בְקֶרֶב יִשְׂרָאֵל
  choice: среди Израиля
  rationale: בְּקֶרֶב обозначает пребывание внутри сообщества, в его среде. Русское «среди Израиля» ясно и естественно передаёт присутствие Бога в народе.
- source_word: וַאֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: что Я — Яхве, ваш Бог
  rationale: Повтор местоимения сохраняется, а второе «что» ясно связывает фразу с глаголом «узнаете». Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: וְאֵין עוֹד
  choice: и нет другого
  rationale: Кратко и без добавления отсутствующего в еврейском тексте уточнения передаёт утверждение об исключительности Яхве.
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי
  choice: И Мой народ … не будет посрамлён
  rationale: Глагол בוש здесь выражает не только внутренний стыд, но и публичное унижение, которое Бог устраняет; «будет посрамлён» сохраняет этот смысл.
- source_word: לְעוֹלָם
  choice: никогда больше
  rationale: В контексте восстановления выражение указывает на окончательное прекращение прежнего позора. Более буквальное «вовек» приведено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» непосредственно передаёт тетраграмматон, не заменяя его титулом.
- issue: Смысл וְאֵין עוֹד
  choice: и нет другого
  alternative: и никого больше нет
  rationale: Выбранная формулировка сохраняет лаконичность и подлинную недосказанность объекта сравнения, одновременно передавая утверждение об исключительности Яхве.
- issue: Смысл формулы לֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: Мой народ никогда больше не будет посрамлён
  alternative: Мой народ не будет посрамлён вовек
  rationale: Основной текст естественно выражает постоянное прекращение позора после восстановления; сноска сохраняет более буквальную временную формулу.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной пророческой интонацией. Эмфатическое повторение «Я» сохранено; пунктуация делает параллельные утверждения ясными.
