source:
  edition: WLC
  text: וְ/קִרְע֤וּ לְבַבְ/כֶם֙ וְ/אַל בִּגְדֵי/כֶ֔ם וְ/שׁ֖וּבוּ אֶל יְהוָ֣ה אֱלֹֽהֵי/כֶ֑ם כִּֽי חַנּ֤וּן וְ/רַחוּם֙ ה֔וּא אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/013.yaml
  text: Tear your hearts and not your garments[a], and return to Yahweh your God, for he is gracious and compassionate, slow to anger and abundant in steadfast love[b], and relenting concerning the disaster.
translation:
  language: ru
  text: Разорвите свои сердца, а не одежды[a], и вернитесь к Яхве, вашему Богу, ибо Он милостив и сострадателен, не спешит гневаться, щедр на верную любовь и отказывается наводить бедствие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздерите свои сердца».'
    reason: Лексический вариант глагола קָרַע; сохраняет образ разрывания, но в современном русском менее обычен.
  - marker: b
    text: 'Буквально: «сожалеет о бедствии». Речь идёт об отказе от возвещённого бедствия, то есть от суда.'
    reason: Поясняет контекстуальное значение נִחָם עַל־הָרָעָה, не устраняя антропопатический характер еврейского выражения.
lexical_decisions:
- source_word: קִרְעוּ
  choice: разорвите
  rationale: Повелительная форма буквально означает «разорвите, раздерите». Современное «разорвите» ясно передаёт сильный образ внутреннего покаяния.
- source_word: לְבַבְכֶם
  choice: свои сердца
  rationale: Множественное число согласуется с обращением ко многим людям и сохраняет метафору внутренней перемены.
- source_word: וְאַל בִּגְדֵיכֶם
  choice: а не одежды
  rationale: Противительный союз естественно передаёт противопоставление подлинного внутреннего обращения внешнему обряду раздирания одежды.
- source_word: וְשׁוּבוּ
  choice: и вернитесь
  rationale: Глагол שוב означает «вернуться, обратиться». «Вернитесь» сохраняет направленность движения к Богу и не сужает смысл до одного внутреннего чувства.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, непосредственно присутствующее в еврейском тексте.
- source_word: חַנּוּן וְרַחוּם
  choice: милостив и сострадателен
  rationale: Два разных прилагательных переданы раздельно, чтобы сохранить полноту формулы Божьего милосердия.
- source_word: אֶרֶךְ אַפַּיִם
  choice: медлен на гнев
  rationale: Понятный русский смысловой эквивалент еврейской идиомы, буквально связанной с «долготой ноздрей».
- source_word: רַב חֶסֶד
  choice: богат неизменной любовью
  rationale: «Неизменная любовь» передаёт устойчивую, верную любовь חסד, а «богат» отражает значение רב.
- source_word: וְנִחָם עַל הָרָעָה
  choice: Он сожалеет о бедствии
  rationale: Формулировка сохраняет антропопатический язык и смысловую напряжённость глагола נחם, не сводя его без оговорки лишь к отмене наказания; רעה в данном контексте означает бедствие, а не нравственное зло.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст употребляет собственное заветное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Описание Бога словами וְנִחָם עַל הָרָעָה
  choice: Он сожалеет о бедствии
  alternative: Он отменяет бедствие; Он отказывается наводить бедствие
  rationale: Основной текст сохраняет присущую еврейской формуле напряжённость и человекоподобный язык. Примечание поясняет контекстуальный смысл, не утверждая, будто Бог совершил нравственную ошибку.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Синтаксис сохраняет последовательность еврейского призыва и традиционной формулы Божьего милосердия; архаизмы сведены к минимуму.
