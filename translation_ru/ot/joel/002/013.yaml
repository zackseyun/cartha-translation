revisions:
- from: Разорвите свои сердца, а не одежды[a], и вернитесь к Яхве, вашему Богу, ведь Он милостив и сострадателен, медлен на гнев и богат неизменной любовью; Он сожалеет о бедствии[b].
  to: Разорвите свои сердца, а не одежды[a], и вернитесь к Яхве, вашему Богу, ибо Он милостив и сострадателен, не спешит гневаться, щедр на верную любовь и отказывается наводить бедствие[b].
  rationale: Исправлена формулировка о נִחָם, чтобы русский текст не создавал впечатления, будто речь только о сожалении по поводу уже случившегося несчастья. Идиома «долог/медлен на гнев» передана естественным современным русским выражением. Сохранены множественное обращение, личное имя Яхве, контраст внутреннего обращения с раздиранием одежд и различение Божьей милости, сострадания, терпения и верной любви.
