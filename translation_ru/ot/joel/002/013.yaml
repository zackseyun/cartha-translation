  source_fidelity: 'Основная проблема — «Он сожалеет о бедствии»: в современном русском это прежде всего выражает сожаление о самом бедствии, а не значение נִחָם עַל־הָרָעָה — отказ/отступление от ранее возвещённого бедствия. Следует явно передать это контекстуальное значение, не приписывая тексту объяснения причин или богословских выводов.'
