  text: מִ֥י יוֹדֵ֖עַ יָשׁ֣וּב וְ/נִחָ֑ם וְ/הִשְׁאִ֤יר אַֽחֲרָי/ו֙ בְּרָכָ֔ה מִנְחָ֣ה וָ/נֶ֔סֶךְ לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/014.yaml
  text: Who knows? He may turn and relent[a], and leave behind him a blessing—an offering and a drink offering for Yahweh your God.
translation:
  language: ru
  text: Кто знает? Может быть, Он обратится и смилостивится и оставит после Себя благословение — хлебное приношение и возлияние Господу, вашему Богу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Кто знает?
  rationale: Краткий риторический вопрос естественно передаёт выраженную в еврейском тексте неопределённость, не превращая возможность в уверенность.
- source_word: יָשׁוּב
  choice: обратится
  rationale: Глагол שׁוב означает «повернуться, обратиться, возвратиться»; здесь речь идёт не о пространственном возвращении, а о повороте от объявленного суда.
- source_word: וְנִחָם
  choice: и смилостивится
  rationale: В контексте грозящего суда נחם указывает на отказ от совершения объявленного бедствия и может включать оттенок сострадания. «Смилостивится» звучит естественно и благоговейно, не подразумевая, что Бог согрешил или ошибся.
- source_word: וְהִשְׁאִיר
  choice: и оставит
  rationale: Порода хифиль глагола שׁאר означает «оставить, сохранить как остаток»; простой русский глагол точно передаёт действие.
- source_word: אַחֲרָיו
  choice: после Себя
  rationale: Сохраняется еврейский образ Бога, после прохождения Которого остаётся не опустошение, а благословение.
- source_word: בְּרָכָה
  choice: благословение
  rationale: Существительное обозначает здесь конкретный благой остаток, благодаря которому вновь становится возможно богослужебное приношение.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В сочетании с возлиянием слово употреблено в специальном жертвенном значении и обозначает приношение из плодов земли, прежде всего муки или зерна.
- source_word: וָנֶסֶךְ
  choice: и возлияние
  rationale: Технический культовый термин обозначает жидкость, изливаемую как жертва. «Возлияние» — точный и устоявшийся русский эквивалент.
- source_word: לַיהוָה
  choice: Господу
  rationale: Имя יהוה передано принятой в русском библейском стиле формой «Господь»; дательный падеж естественно обозначает Того, Кому предназначено приношение.
- source_word: אֱלֹהֵיכֶם
  choice: вашему Богу
  rationale: Сохранено прямое обращение к общине и выраженная притяжательным суффиксом связь с Богом.
theological_decisions:
- issue: Язык о перемене объявленного Богом суда
  choice: Может быть, Он обратится и смилостивится
  alternative: Может быть, Он обратится и изменит решение
  rationale: Формулировка сохраняет человеческую неуверенность, заданную словами «Кто знает?», и реальную возможность отмены объявленного суда. При этом она не утверждает, будто Бог допустил ошибку или получил ранее неизвестные сведения.
- issue: Значение מִנְחָה в жертвенном контексте
  choice: хлебное приношение
  alternative: приношение
  rationale: Соседство с «возлиянием» убедительно указывает на специальное культовое значение. Более точное обозначение уместно в основном тексте и остаётся понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм еврейского текста сохранён без архаизмов; местоимение «Себя» написано с прописной буквы как традиционное уважительное обозначение Бога.
