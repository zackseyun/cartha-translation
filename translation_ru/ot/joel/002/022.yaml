  text: אַל תִּֽירְאוּ֙ בַּהֲמ֣וֹת שָׂדַ֔י כִּ֥י דָשְׁא֖וּ נְא֣וֹת מִדְבָּ֑ר כִּֽי עֵץ֙ נָשָׂ֣א פִרְי֔/וֹ תְּאֵנָ֥ה וָ/גֶ֖פֶן נָתְנ֥וּ חֵילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/022.yaml
  text: Do not fear[a], beasts of the field, for the pastures of the wilderness have become green; for the tree bears its fruit, the fig tree and the vine have given their wealth.
translation:
  language: ru
  text: Не бойтесь, полевые звери, ведь пастбища в степи зазеленели; деревья приносят плод, смоковница и виноградная лоза дают свой урожай[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдают свою силу»; то есть проявляют плодородную силу, дают обильный урожай.'
    reason: Сохраняет метафору и смысловой диапазон еврейского חֵילָם, который здесь может обозначать силу, производительность или изобилие.
lexical_decisions:
- source_word: אַל תִּירְאוּ
  choice: Не бойтесь
  rationale: Прямой запрет во множественном числе; естественно передаёт обращение к полевым животным.
- source_word: בַּהֲמוֹת שָׂדַי
  choice: полевые звери
  rationale: Сохраняет образ и возвышенный пророческий регистр, оставаясь понятным современному читателю.
- source_word: דָשְׁאוּ
  choice: зазеленели
  rationale: Глагол обозначает появление свежей зелени; совершенный вид передаёт наступившее восстановление.
- source_word: נְאֹות מִדְבָּר
  choice: пастбища в степи
  rationale: נְאֹות — места выпаса, а מִדְבָּר здесь обозначает незаселённую открытую местность, не обязательно песчаную пустыню.
- source_word: עֵץ נָשָׂא פִרְיוֹ
  choice: деревья приносят плод
  rationale: Еврейское единственное число допускает собирательное значение; русское множественное число естественно согласуется с последующим перечислением плодовых растений.
- source_word: תְּאֵנָה וָגֶפֶן
  choice: смоковница и виноградная лоза
  rationale: Передаёт конкретные сельскохозяйственные образы текста; «виноградная лоза» яснее отдельного слова «лоза».
- source_word: נָתְנוּ חֵילָם
  choice: дают свой урожай
  rationale: В данном сельскохозяйственном контексте חֵילָם указывает на производительную силу и её плод — обильный урожай; буквальная «дают свою силу» по-русски была бы неясна.
