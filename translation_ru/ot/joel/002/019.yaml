base_translation:
  language: en
  yaml_path: translation/ot/joel/002/019.yaml
  text: Then the LORD answered and said to his people, “Look, I am sending you the grain, the new wine, and the fresh oil, and you will be satisfied with it; and I will no longer make you a reproach among the nations.”
translation:
  language: ru
  text: 'И ответил Господь Своему народу: «Вот, Я посылаю вам зерно, молодое вино и свежее масло, и вы насытитесь ими. Я больше не сделаю вас предметом поношения среди народов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; сохраняет отличие имени Бога без неестественной для широкого читателя транслитерации.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт указательно-эмфатическую конструкцию и подчёркивает непосредственное действие говорящего.
- source_word: הַדָּגָן
  choice: зерно
  rationale: Обобщённое обозначение хлебных злаков или урожая зерновых; «зерно» естественно в данном перечне даров земли.
- source_word: הַתִּירוֹשׁ
  choice: молодое вино
  rationale: Передаёт тирош как свежий виноградный продукт/новое вино, не сужая значение до одного лишь виноградного сока.
- source_word: הַיִּצְהָר
  choice: свежее масло
  rationale: Обозначает свежий масличный продукт, прежде всего оливковое масло, и соответствует сельскохозяйственной триаде стиха.
- source_word: חֶרְפָּה
  choice: поругание
  rationale: Сохраняет значение публичного позора и насмешки со стороны других народов; оборот «отдать на поругание» естественен в возвышенной современной русской речи.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана общепринятая русская библейская форма, не вводящая конфессионально маркированной практики произношения; речь при этом ясно принадлежит Богу завета.
- issue: Число в выражении וּשְׂבַעְתֶּם אֹתוֹ
  choice: «вы насытитесь ими» — согласование со всем перечнем даров
  alternative: «вы насытитесь этим» — буквальное сохранение единственного числа местоимения
  rationale: Еврейское местоимение единственного числа обобщает перечисленное снабжение; русское множественное число естественно соотносит насыщение с зерном, вином и маслом, не меняя смысла.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным библейским звучанием. Формула ויען ... ויאמר передана без тавтологического «ответил и сказал»: «ответил ...:». Заглавные «Я» и «Своему» употреблены в традиционном русском оформлении прямой Божьей речи.'
