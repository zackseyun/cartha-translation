  source_fidelity: 'Основной смысл передан точно: усиленная конструкция при «есть», насыщение, хвала имени Яхве и постоянное обещание избавления народа от посрамления сохранены. Оборот עָשָׂה עִמָּכֶם לְהַפְלִיא буквально говорит о чудесном действии Бога по отношению к народу; вариант «дивно поступил с вами» возможен формально, но в современном русском неточно окрашен.'
  naturalness: «Дивно поступил с вами» звучит архаично и в современном употреблении глагол «поступить с кем-либо» часто подразумевает обращение с человеком, нередко неблагоприятное. «Совершил для вас дивные дела» естественнее и ясно выражает чудесное божественное действие. Также строчное «мой» в прямой речи Бога соответствует современному литературному оформлению.
  terminology: «Яхве», «имя», «прославите» и «посрамлён вовек» уместны. «Вовек» допустимо как умеренно возвышенное библейское слово; оно точно передаёт לְעוֹלָם без добавления «больше».
