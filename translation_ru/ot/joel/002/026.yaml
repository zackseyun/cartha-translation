  text: וַ/אֲכַלְתֶּ֤ם אָכוֹל֙ וְ/שָׂב֔וֹעַ וְ/הִלַּלְתֶּ֗ם אֶת שֵׁ֤ם יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר עָשָׂ֥ה עִמָּ/כֶ֖ם לְ/הַפְלִ֑יא וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/026.yaml
  text: You will surely eat and be satisfied[a], and you will praise the name of Yahweh your God, who has dealt wondrously with you[c][b]; and my people will never again be put to shame.
translation:
  language: ru
  text: Вы непременно будете есть и насытитесь[a], и прославите имя Яхве, вашего Бога, Который совершил для вас дивные дела[b]; и мой народ не будет посрамлён вовек[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы будете есть вдоволь и насытитесь». В еврейском тексте употреблена усилительная конструкция, буквально: «есть будете».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Который дивно поступил с вами».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «никогда больше не будет посрамлён». Буквально: «не будет посрамлён вовек».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אָכוֹל
  choice: Вы непременно будете есть
  rationale: Сочетание личной формы глагола с абсолютным инфинитивом усиливает действие. «Непременно будете есть» передаёт эмфазу, не добавляя отсутствующего в самом обороте прямого указания на количество пищи.
- source_word: וְשָׂבוֹעַ
  choice: и насытитесь
  rationale: Форма выражает достижение сытости. «Насытитесь» естественно звучит по-русски и точно передаёт результат принятия пищи.
- source_word: וְהִלַּלְתֶּם
  choice: и прославите
  rationale: Порода пиэль глагола הלל здесь означает хвалить или прославлять. «Прославите» естественно сочетается с выражением «имя Яхве».
- source_word: שֵׁם יְהוָה אֱלֹהֵיכֶם
  choice: имя Яхве, вашего Бога
  rationale: Слово «имя» сохранено как указание на явленную личность и славу Бога; тетраграмматон передан формой «Яхве».
- source_word: אֲשֶׁר עָשָׂה עִמָּכֶם לְהַפְלִיא
  choice: Который дивно поступил с вами
  rationale: Перевод сохраняет значение чудесного, необычайного действия и непосредственное соответствие предлогу עִם — «с». Возможное понимание действия как совершённого «для вас» вынесено в примечание.
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי
  choice: и народ Мой не будет посрамлён
  rationale: בושׁ может обозначать не только внутренний стыд, но и публичное посрамление либо крушение надежд. Страдательная формулировка хорошо передаёт этот смысл в контексте восстановления народа.
- source_word: לְעוֹלָם
  choice: вовек
  rationale: «Вовек» кратко и возвышенно, но понятно передаёт буквальную идею непрекращающейся длительности, не добавляя к еврейскому тексту слова «снова».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон. Форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Характер обещания в выражении וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: народ Мой не будет посрамлён вовек
  alternative: народ Мой никогда больше не будет посрамлён
  rationale: Основной текст сохраняет буквальное «вовек» и не вводит явно отсутствующее наречие «больше». Альтернативный перевод естественно выражает восстановительный контекст, но несколько явнее истолковывает его.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Вовек» сохранено как общеупотребительное в религиозно-литературном регистре; синтаксис остаётся ясным для современного читателя. Эмфаза еврейской конструкции передана наречием «непременно», а неоднозначность оборота עשה עמכם отмечена в сноске.
