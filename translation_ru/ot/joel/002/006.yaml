  - marker: b
    text: 'Буквально в еврейском тексте: «все лица собрали פָארוּר». Это редкое выражение обычно понимают как утрату лицом цвета; редкое слово פָארוּר также связывали с румянцем или багровым оттенком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפָּנָיו
  choice: Перед ним
  rationale: Сочетание מִן с פָּנִים и местоименным суффиксом передаёт нахождение перед чьим-либо лицом или присутствием. «Перед ним» естественно по-русски и не уточняет неоднозначный референт местоимения.
- source_word: יָחִילוּ
  choice: корчатся
  rationale: Форма от חול в породе qal может обозначать дрожь, мучительные судороги или подобное родовым мукам телесное страдание. «Корчатся» сохраняет яркий образ охватившего народы ужаса.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число обозначает человеческие сообщества в широком смысле; «народы» не сводит их к современным государствам.
- source_word: כָּל־פָּנִים
  choice: все лица
  rationale: Сохранено собирательное выражение оригинала, естественное и понятное по-русски.
- source_word: קִבְּצוּ פָארוּר
  choice: бледнеют
  rationale: Редкое сочетание, буквально включающее глагол «собирать», обычно понимается как идиома утраты лицом цвета от страха. Естественный русский глагол передаёт смысл выражения, а необычность оригинала отмечена в сноске.
theological_decisions:
- issue: Референт местоименного суффикса 3-го лица мужского рода в מִפָּנָיו
  choice: «ним» без уточняющего существительного
  alternative: «перед Господом» или «перед ним» с явной отсылкой к наступающему войску
  rationale: Контекст допускает связь как с персонифицированной наступающей силой, так и с явлением дня Господня. Перевод не разрешает эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым ритмом пророческой речи. «Корчатся» намеренно сохраняет телесную выразительность еврейского глагола; «бледнеют» естественно передаёт трудную для буквального воспроизведения идиому.
