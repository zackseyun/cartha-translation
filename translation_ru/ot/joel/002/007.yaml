source:
  edition: WLC
  text: כְּ/גִבּוֹרִ֣ים יְרֻצ֔וּ/ן כְּ/אַנְשֵׁ֥י מִלְחָמָ֖ה יַעֲל֣וּ חוֹמָ֑ה וְ/אִ֤ישׁ בִּ/דְרָכָי/ו֙ יֵֽלֵכ֔וּ/ן וְ/לֹ֥א יְעַבְּט֖וּ/ן אֹרְחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/007.yaml
  text: Like warriors they run[a]; like men of war they climb the wall. Each goes in his own way[b], and they do not swerve from their paths.
translation:
  language: ru
  text: Словно могучие воины, они бегут; словно бойцы, взбираются на стену. Каждый идёт своей дорогой, и они не сворачивают со своих путей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не нарушают строя». Еврейский глагол редок и может обозначать как отклонение от пути, так и нарушение порядка движения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגִבּוֹרִים
  choice: словно могучие воины
  rationale: Слово גִּבּוֹרִים в военном контексте обозначает сильных, доблестных воинов. «Могучие воины» передаёт и значение силы, и военный образ.
- source_word: יְרֻצוּן
  choice: они бегут
  rationale: Форма от רוץ прямо означает «бежать»; настоящее время сохраняет живость пророческого описания.
- source_word: כְּאַנְשֵׁי מִלְחָמָה
  choice: словно бойцы
  rationale: Буквально — «словно люди войны». «Бойцы» естественно звучит по-русски, сохраняет военный смысл и избегает тяжеловесного повтора слова «воины».
- source_word: יַעֲלוּ חוֹמָה
  choice: взбираются на стену
  rationale: עלה означает движение вверх; при חוֹמָה речь идёт о восхождении на городскую стену. «Взбираются» ясно передаёт это действие.
- source_word: וְאִישׁ בִּדְרָכָיו יֵלֵכוּן
  choice: Каждый идёт своей дорогой
  rationale: אִישׁ употреблено распределительно — «каждый». Единственное число в русском естественно передаёт упорядоченное движение каждого участника множества.
- source_word: וְלֹא יְעַבְּטוּן
  choice: и они не сворачивают
  rationale: Редкий глагол в данном контексте, вероятно, обозначает отклонение или нарушение направления движения. «Не сворачивают» сохраняет связь с последующим «со своих путей», не сужая смысл до строевой терминологии.
- source_word: אֹרְחוֹתָם
  choice: со своих путей
  rationale: אֹרַח означает путь или тропу. «Пути» сохраняет параллелизм с предшествующей «дорогой», не воспроизводя одно и то же русское слово.
theological_decisions:
- issue: Мужской род в военном сравнении и распределительной конструкции
  choice: Сохранить мужские формы «воины», «бойцы» и «каждый»
  alternative: Употребить обобщённые или нейтральные формы
  rationale: Еврейский текст использует явно мужские существительные и распределительное אִישׁ. Сохранение мужского рода точно отражает грамматику и военный образ, не добавляя отдельного богословского толкования.
- issue: Характер движения войска
  choice: Передать как движение без отклонения от путей
  alternative: Конкретизировать как «не нарушают строя»
  rationale: Контекст допускает представление о дисциплинированном строе, но редкий глагол не требует исключительно строевого смысла. Основной текст сохраняет более широкое значение, а возможная конкретизация вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с живым, но торжественным ритмом. Параллелизм двух сравнений сохранён; буквальное «люди войны» заменено естественным словом «бойцы».
