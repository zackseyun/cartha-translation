  text: אַל תִּֽירְאִ֖י אֲדָמָ֑ה גִּ֣ילִי וּ/שְׂמָ֔חִי כִּֽי הִגְדִּ֥יל יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/021.yaml
  text: Do not fear[a], O land; rejoice and be glad, for Yahweh has done great things.
translation:
  language: ru
  text: Не бойся, земля! Ликуй и радуйся, потому что Яхве совершил великие дела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская идиома; также можно передать: «Яхве действовал величественно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Не бойся
  rationale: Сочетание אַל с формой имперфекта выражает запрет; женский род соответствует обращению к אֲדָמָה.
- source_word: אֲדָמָה
  choice: земля
  rationale: В данном контексте олицетворена земля Иудеи как территория и возделываемая почва; «земля» сохраняет обе смысловые стороны.
- source_word: גִּילִי וּשְׂמָחִי
  choice: Ликуй и радуйся
  rationale: 'Два различных глагола передают поэтическое усиление: первый обозначает восторженное ликование, второй — радость.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующего призыва и ясно передаёт причинную связь.
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: совершил великие дела
  rationale: Еврейское идиоматическое сочетание буквально описывает великое действие; естественный русский эквивалент передаёт совершённые Яхве могущественные деяния.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Субъект великих деяний
  choice: Яхве совершил великие дела
  alternative: Яхве действовал величественно
  rationale: Идиома допускает акцент как на величии действия, так и на великих делах; основной текст использует естественное русское выражение, а примечание сохраняет альтернативный оттенок.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Олицетворённое обращение к земле и параллелизм двух повелений сохранены; избыточно архаичные формы не использованы.
