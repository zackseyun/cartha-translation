  text: Like the sound of chariots[a], they leap on the tops of the mountains; like the sound of a flame of fire consuming stubble[c][b]; like a mighty people arrayed for battle.
translation:
  language: ru
  text: Как грохот колесниц, они скачут[a] по вершинам гор[b]; как шум огненного пламени, пожирающего жнивьё; как могучий народ, выстроенный для битвы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прыгают», «подскакивают»; еврейский глагол обозначает живое пружинистое движение и может также употребляться о пляске.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по головам гор».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «построенный в боевой порядок»; еврейское выражение подчёркивает организованное военное построение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקוֹל מַרְכָּבוֹת
  choice: словно с грохотом колесниц
  rationale: כְּ выражает сравнение, а קוֹל — звук или шум. В данном военном образе «грохот» естественно передаёт громкий звук колесниц, не добавляя слова «боевые», которого нет в еврейском тексте.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: по вершинам гор
  rationale: Буквально — «по головам гор». Русское «по вершинам гор» сохраняет пространственный образ и звучит естественно.
- source_word: יְרַקֵּדוּן
  choice: они скачут
  rationale: Глагол רקד обозначает подпрыгивание, скачки или пляску. «Скачут» передаёт стремительное пружинистое движение в контексте наступления, не создавая впечатления праздничного танца.
- source_word: כְּקוֹל לַהַב אֵשׁ אֹכְלָה קָשׁ
  choice: словно с шумом пламени, пожирающего солому
  rationale: Повторено сравнение со звуком. לַהַב אֵשׁ означает огненное пламя, а אֹכְלָה описывает его как активно пожирающее קָשׁ — сухую солому или жнивьё.
- source_word: כְּעַם עָצוּם
  choice: словно могучий народ
  rationale: עָצוּם может означать сильный, могучий или многочисленный. В военном контексте «могучий» сохраняет широту значения и подчёркивает силу.
- source_word: עֱרוּךְ מִלְחָמָה
  choice: выстроенный для битвы
  rationale: Причастие ערוך выражает упорядоченное построение или приведение в боевой порядок; перевод сохраняет образ организованного войска.
