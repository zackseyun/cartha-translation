  text: וְֽ/אֶת הַ/צְּפוֹנִ֞י אַרְחִ֣יק מֵ/עֲלֵי/כֶ֗ם וְ/הִדַּחְתִּי/ו֮ אֶל אֶ֣רֶץ צִיָּ֣ה וּ/שְׁמָמָה֒ אֶת פָּנָ֗י/ו אֶל הַ/יָּם֙ הַ/קַּדְמֹנִ֔י וְ/סֹפ֖/וֹ אֶל הַ/יָּ֣ם הָ/אַֽחֲר֑וֹן וְ/עָלָ֣ה בָאְשׁ֗/וֹ וְ/תַ֨עַל֙ צַחֲנָת֔/וֹ כִּ֥י הִגְדִּ֖יל לַ/עֲשֽׂוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/020.yaml
  text: And I will remove the northerner far from you[a], and I will drive him into a dry and desolate land, his front into the eastern sea and his rear into the western sea; his stench will rise, and his foul smell will rise[c][b], because he has done great things.
translation:
  language: ru
  text: 'А того, кто с севера, Я далеко удалю от вас[a] и прогоню его в сухую и пустынную землю: его переднюю часть — к восточному морю, а заднюю — к западному морю[b]. Поднимется его смрад, поднимется его зловоние, потому что он совершил великое[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «северное войско». В еврейском тексте буквально: «северный» — олицетворённое обозначение в единственном числе.'
    reason: lexical_alternative
  - marker: b
    text: «Восточное море», вероятно, означает Мёртвое море, а «западное море» — Средиземное.
    reason: cultural_note
  - marker: c
    text: 'Или: «потому что он поступил надменно». Буквально: «потому что он совершил великое»; в данном контексте выражение, вероятно, имеет отрицательный смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצְּפוֹנִי
  choice: тот, кто с севера
  rationale: Передаёт субстантивированное прилагательное «северный / северянин» в единственном числе и сохраняет олицетворение, не уточняя в основном тексте, что речь идёт именно о войске.
- source_word: אַרְחִיק
  choice: удалю ... от вас
  rationale: Каузативная форма выражает устранение на большое расстояние; русский глагол «удалю» вместе с «от вас» естественно передаёт это значение.
- source_word: וְהִדַּחְתִּיו
  choice: прогоню его
  rationale: Передаёт насильственное изгнание или оттеснение, подразумеваемое каузативной формой נדח.
- source_word: אֶרֶץ צִיָּה וּשְׁמָמָה
  choice: сухую и пустынную землю
  rationale: 'Сохраняет оба признака: безводность и запустение; формулировка естественна для современного литературного русского языка.'
- source_word: פָּנָיו
  choice: его переднюю часть
  rationale: Буквально «его лицо», но в противопоставлении «концу / задней части» обозначает переднюю часть олицетворённой массы. Перевод сохраняет пространственный образ, не вводя прямо военную терминологию.
- source_word: הַיָּם הַקַּדְמֹנִי
  choice: восточное море
  rationale: Передаёт географическое значение выражения, буквально связанного с передней, то есть восточной, стороной; вероятное отождествление с Мёртвым морем вынесено в примечание.
- source_word: סֹפוֹ
  choice: заднюю часть
  rationale: Основное значение — «конец»; в паре с передней частью здесь естественно обозначает задний край или тыл.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: западное море
  rationale: Буквально «заднее / последнее море» — древнееврейское пространственное обозначение моря на западе. Конкретное отождествление вынесено в примечание.
- source_word: בָאְשׁוֹ
  choice: его смрад
  rationale: Кратко и сильно передаёт значение дурного, гнилостного запаха.
- source_word: צַחֲנָתוֹ
  choice: его зловоние
  rationale: Сохраняет параллелизм двух близких обозначений отвратительного запаха, не сводя их к дословному повтору.
- source_word: כִּי הִגְדִּיל לַעֲשׂוֹת
  choice: потому что он совершил великое
  rationale: Максимально сохраняет неоднозначную идиому «сделал великое». В данном контексте она, вероятно, указывает на дерзкие или чрезмерные действия врага, однако основной текст не устраняет намеренное смысловое напряжение.
theological_decisions:
- issue: Кого обозначает «тот, кто с севера»
  choice: Олицетворённый враждебный пришелец или вражеская сила в единственном числе
  alternative: Северное войско; конкретный исторический народ; олицетворённая саранча; северный ветер
  rationale: Единственное число и упоминание передней и задней частей поддерживают олицетворение. Стих сам по себе не позволяет уверенно назвать конкретный народ или свести образ только к природному явлению.
- issue: Смысл выражения «совершил великое»
  choice: Сохранить неоднозначную древнееврейскую идиому в основном тексте
  alternative: «Поступил надменно» или «натворил ужасных дел»
  rationale: В контексте суда над врагом выражение, вероятно, имеет отрицательный оттенок — дерзость, самовозвеличивание или чрезмерность. Однако та же идиома способна описывать великие деяния положительно, поэтому толкование не встроено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и олицетворённое единственное число сохранены; конкретная идентификация противника и отрицательная интерпретация заключительной идиомы оставлены в примечаниях.
