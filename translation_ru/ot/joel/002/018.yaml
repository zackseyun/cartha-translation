  text: Then Yahweh became jealous for his land and had compassion on his people[a].
translation:
  language: ru
  text: Тогда Яхве воспылал ревностью за Свою землю[a] и сжалился над Своим народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проявил рвение за Свою землю». Еврейский глагол может обозначать как ревность, так и пылкое рвение; здесь он выражает горячую заботу Яхве о том, что принадлежит Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנֵּא
  choice: возревновал
  rationale: Глагол קנא выражает ревность или рвение. Русское «возревновал» сохраняет как эмоциональную силу, так и оттенок горячей, оберегающей заботы о принадлежащем Богу; форма с вау передаёт последовательное действие в прошлом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом.
- source_word: לְאַרְצוֹ
  choice: о Своей земле
  rationale: Здесь אֶרֶץ означает прежде всего землю завета, а управление «ревновать о» естественно передаёт объект ревностной заботы.
- source_word: וַיַּחְמֹל
  choice: сжалился
  rationale: חמל может означать жалость, сострадание или пощаду. «Сжалился» естественно и ёмко передаёт сострадательное отношение в данном контексте, не сводя смысл только к отказу от наказания.
- source_word: עַל עַמּוֹ
  choice: над Своим народом
  rationale: Сочетание חמל с עַל обозначает объект сострадания; по-русски нормативно «сжалиться над». עַם передано как «народ», что сохраняет коллективный и заветный смысл.
theological_decisions:
- issue: Передача Божьей ревности или рвения
  choice: Яхве возревновал о Своей земле
  alternative: Яхве исполнился ревностного рвения о Своей земле
  rationale: «Возревновал» сохраняет присущие קנא оттенки исключительной принадлежности и горячей защитной заботы. Возможный оттенок рвения указан в сноске, чтобы не устранять смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятую русскую религиозно-литературную норму.
