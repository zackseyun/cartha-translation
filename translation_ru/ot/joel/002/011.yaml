  text: וַֽ/יהוָ֗ה נָתַ֤ן קוֹל/וֹ֙ לִ/פְנֵ֣י חֵיל֔/וֹ כִּ֣י רַ֤ב מְאֹד֙ מַחֲנֵ֔/הוּ כִּ֥י עָצ֖וּם עֹשֵׂ֣ה דְבָר֑/וֹ כִּֽי גָד֧וֹל יוֹם יְהוָ֛ה וְ/נוֹרָ֥א מְאֹ֖ד וּ/מִ֥י יְכִילֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/011.yaml
  text: And Yahweh gives his voice before his army[a], for his camp is exceedingly great; for mighty is the one who does his word[c][b]. For the day of Yahweh is great and exceedingly dreadful—who can endure it?
translation:
  language: ru
  text: И Яхве подаёт голос перед Своим войском[a], ибо стан Его чрезвычайно велик; ибо могуч тот, кто исполняет Его слово[b]. Ибо велик день Яхве и весьма страшен[c] — кто сможет выдержать его?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возглашает перед Своим войском». Буквально: «даёт Свой голос».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исполняет Его повеление». Слово, переведённое как «слово», в этом контексте может означать приказ.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «весьма ужасен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: И Яхве
  rationale: Союз сохраняет связь с предшествующим контекстом, а тетраграмматон передан как «Яхве».
- source_word: נָתַן קוֹלוֹ
  choice: подаёт голос
  rationale: Передаёт буквальный образ «даёт Свой голос» естественным для русского языка возвышенным выражением; возможное значение «возглашает» отмечено в сноске.
- source_word: לִפְנֵי חֵילוֹ
  choice: перед Своим войском
  rationale: חַיִל в данном военном контексте обозначает организованную силу; притяжательное местоимение сохраняет представление о войске под властью Яхве.
- source_word: כִּי רַב מְאֹד מַחֲנֵהוּ
  choice: потому что стан Его чрезвычайно велик
  rationale: «Стан» сохраняет военный образ מַחֲנֶה и не отождествляет его без остатка с самим войском; רַב מְאֹד передано без сведения смысла только к численности.
- source_word: כִּי עָצוּם עֹשֵׂה דְבָרוֹ
  choice: потому что могуч исполняющий Его слово
  rationale: Единственное число причастия сохранено, не уточняя, является ли носитель действия отдельным или собирательным; «исполняющий Его слово» естественно передаёт действие по слову, которое в контексте может быть повелением.
- source_word: כִּי גָדוֹל יוֹם יְהוָה
  choice: Ибо велик день Яхве
  rationale: Сохранены эмфатический порядок слов и устойчивое пророческое выражение «день Яхве».
- source_word: וְנוֹרָא מְאֹד
  choice: и весьма страшен
  rationale: В контексте суда נוֹרָא обозначает внушающий страх; «страшен» звучит естественно и сохраняет угрожающую силу.
- source_word: וּמִי יְכִילֶנּוּ
  choice: кто сможет выдержать его?
  rationale: Глагол передаёт способность вынести или выдержать; местоимение отнесено к «дню» без добавления идеи выживания, которой нет непосредственно в тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Кого обозначают «Его войско» и «Его стан»
  choice: Сила представлена как принадлежащая Яхве и исполняющая Его слово, без уточнения её природы
  alternative: Только нашествие саранчи; только человеческая армия
  rationale: Притяжательные суффиксы и упоминание исполнения слова указывают на власть Яхве над этой силой, но сам стих не требует однозначно выбирать между буквальным войском, саранчой или совмещением образов.
- issue: Число и референт выражения עֹשֵׂה דְבָרוֹ
  choice: исполняющий Его слово
  alternative: исполняющие Его слово; исполняющий Его повеление
  rationale: Сохранено грамматическое единственное число и более широкое «слово», чтобы не устранять возможность собирательного смысла и не сужать דָּבָר до повеления прямо в основном тексте.
translation_notes:
  register: Современный литературный русский с возвышенным пророческим звучанием. Инверсия «велик день Яхве» и слово «стан» сохраняют торжественный ритм, оставаясь понятными современному читателю. Заглавные буквы в местоимениях, относящихся к Яхве, употреблены последовательно.
