    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Перед Ним
  rationale: Оборот с לְ и פָּנִים допускает значения «перед ним» и «в его присутствии». «Перед Ним» естественно по-русски и сохраняет пространственно-реляционный образ.
- source_word: רָגְזָה
  choice: содрогается
  rationale: Глагол обозначает дрожь, потрясение или волнение; при подлежащем «земля» слово «содрогается» ярко передаёт сейсмический образ.
- source_word: אֶרֶץ
  choice: земля
  rationale: Хотя слово может означать отдельную страну или сушу, перечисление небес, солнца, луны и звёзд указывает здесь на космический масштаб.
- source_word: רָעֲשׁוּ
  choice: колеблются
  rationale: Передаёт дрожь и сотрясение небес, сохраняя параллелизм и избегая однообразного повтора «содрогаются».
- source_word: שָׁמָיִם
  choice: небеса
  rationale: Множественная форма и возвышенный пророческий контекст естественно передаются словом «небеса».
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: Солнце и луна
  rationale: Прямой перевод сохраняет последовательность небесных светил в еврейском тексте.
- source_word: קָדָרוּ
  choice: меркнут
  rationale: Глагол описывает потемнение или утрату света; «меркнут» кратко и естественно передаёт этот процесс применительно к светилам.
- source_word: וְכוֹכָבִים
  choice: и звёзды
  rationale: Прямой перевод сохраняет космическую образность и поэтическое развитие строки.
- source_word: אָסְפוּ
  choice: скрывают
  rationale: Буквально глагол означает «собирают»; в сочетании с сиянием выражает образ светил, словно убирающих или втягивающих свой свет. «Скрывают» сохраняет образность и понятно передаёт результат.
- source_word: נָגְהָם
  choice: своё сияние
  rationale: Слово означает блеск, сияние или свет. «Сияние» соответствует возвышенному поэтическому регистру.
theological_decisions:
- issue: Масштаб образов космического потрясения
  choice: Передать космическое потрясение непосредственно, не сводя его только к метафоре и не превращая перевод в указание на определённую эсхатологическую схему.
  alternative: Понимать описание исключительно как образ ужаса перед войском либо как однозначное предсказание конкретных событий конца времён.
  rationale: Пророческая поэзия сохраняет смысловую напряжённость между историческим, образным и эсхатологическим измерениями; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Заглавная буква в местоимении «Ним» отмечает отнесённость к Богу в принятой русской библейской традиции, не добавляя имени, отсутствующего в стихе.
