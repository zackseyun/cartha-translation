  text: Before him the earth quakes[a]; the heavens tremble. The sun and the moon grow dark[b], and the stars withdraw their brightness.
translation:
  language: ru
  text: Перед ним содрогается земля[a], колеблются небеса. Солнце и луна меркнут, и звёзды скрывают своё сияние[b].
  philosophy: optimal-equivalence
  footnotes:
