  yaml_path: translation/ot/joel/004/021.yaml
  text: I will avenge their blood that I have not avenged[a], and Yahweh dwells in Zion.
translation:
  language: ru
  text: И Я взыщу за их кровь, за которую доныне не взыскивал[a]. И Господь обитает на Сионе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не оставлю безнаказанными виновных в пролитии их крови». В еврейском тексте один и тот же глагол повторён с отрицанием; фразу можно понимать либо как обещание взыскать за кровь, за которую прежде не было взыскано, либо как обещание не оставить это кровопролитие без наказания.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקֵּיתִי
  choice: И Я взыщу
  rationale: 'В сочетании с «их кровь» и с последующим отрицательным повтором глагола נקה форма передаёт судебное действие: Бог не оставит кровопролитие без возмездия. «Взыщу за» естественно по-русски выражает ответственность и возмездие, не подменяя образ крови.'
- source_word: דָּמָם
  choice: их кровь
  rationale: Сохранён буквальный образ крови; в контексте он означает пролитую кровь, требующую справедливого возмездия.
- source_word: לֹא נִקֵּיתִי
  choice: за которую ещё не взыскал
  rationale: Повтор того же глагола с отрицанием передан как прежнее, пока не совершённое возмездие. «Ещё» ясно выражает подразумеваемую временную напряжённость, но альтернативная идиоматическая трактовка сохранена в сноске.
- source_word: וַיהוָה
  choice: И Господь
  rationale: Тетраграмматон передан традиционным русским библейским соответствием «Господь» без конфессионально специфического истолкования.
- source_word: שֹׁכֵן
  choice: обитает
  rationale: Причастие обозначает продолжающееся пребывание; настоящее время «обитает» сохраняет этот длительный смысл и возвышенный, но понятный регистр.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Русская библейская и литературная норма обычно говорит «на Сионе», воспринимая Сион как гору и священное место, хотя еврейский предлог ב допускает более буквальное «в Сионе».
theological_decisions:
- issue: Значение נקה при слове «кровь» в контексте суда
  choice: Бог взыщет за пролитую кровь, совершив справедливое возмездие.
  alternative: Бог очистит от вины за кровь или объявит невиновными.
  rationale: Контекст суда над враждебными народами и оправдания Иуды поддерживает судебно-возмездный смысл. При этом перевод не уточняет способ или меру наказания.
- issue: Связь отрицательного повтора לֹא נִקֵּיתִי с первым глаголом
  choice: 'Прежде не совершённое взыскание теперь обещано: «за которую ещё не взыскал».'
  alternative: 'Усиленное утверждение: «Я не оставлю их кровь безнаказанной».'
  rationale: Еврейская фраза кратка и допускает обе трактовки. Основной текст сохраняет повтор и напряжение между прежним отсутствием возмездия и будущим действием, а сноска отмечает идиоматическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Краткость и параллельность еврейской строки сохранены; подлинная неоднозначность повторённого глагола вынесена в сноску.
