  yaml_path: translation/ot/joel/004/020.yaml
  text: But Judah will be inhabited forever[a], and Jerusalem from generation to generation.
translation:
  language: ru
  text: Но Иудея будет населена вовеки[a], и Иерусалим — из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но Иудея будет обитать вовеки». Еврейский глагол буквально может означать «обитать» или «сидеть», однако применительно к стране или городу, вероятно, означает «быть населённой» или «оставаться населённой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוּדָה
  choice: Но Иудея
  rationale: Союз ו связывает стих с предшествующим судом над враждебными народами и здесь естественно передаётся противительным «но». Название обозначает территорию, поэтому выбрано «Иудея».
- source_word: לְ/עוֹלָם
  choice: вовеки
  rationale: עוֹלָם обозначает неограниченную продолжительность в будущем; «вовеки» сохраняет торжественный пророческий регистр и понятно современному читателю.
- source_word: תֵּשֵׁב
  choice: будет населена
  rationale: Форма женского рода согласуется с Иудеей; применительно к стране или городу ישׁב может означать «быть населённым». Такой перевод естественнее буквального олицетворённого «будет жить/сидеть».
- source_word: וִ/ירוּשָׁלִַם
  choice: и Иерусалим
  rationale: Второй ו имеет обычное присоединительное значение и передан союзом «и».
- source_word: לְ/ד֥וֹר וָ/דֽוֹר
  choice: из поколения в поколение
  rationale: Устойчивое сочетание דּוֹר וָדוֹר выражает непрерывность на протяжении сменяющихся поколений; русский оборот сохраняет повтор и звучит естественно.
theological_decisions:
- issue: Характер обещания о непреходящем будущем Иудеи и Иерусалима
  choice: Передать текст как прямое пророческое обещание длительной населённости, не уточняя способ и горизонт его исполнения.
  alternative: Истолковать обещание исключительно как буквальную геополитическую неизменность либо исключительно символически, экклезиологически или эсхатологически.
  rationale: Еврейский текст утверждает непрерывное будущее Иудеи и Иерусалима, но сам не определяет исчерпывающим образом характер исполнения; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Эллиптическое тире во второй части естественно восполняет сказуемое и сохраняет лаконичный параллелизм оригинала.
