  yaml_path: translation/ot/joel/004/015.yaml
  text: The sun and the moon grow dark[a], and the stars withdraw their brightness.
translation:
  language: ru
  text: Солнце и луна меркнут, и звёзды удерживают своё сияние.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «собирают своё сияние»; то есть удерживают или забирают свой свет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: Солнце и луна
  rationale: Прямой и естественный перевод названий небесных светил; в русском языке в данном поэтическом контексте артикли не требуются.
- source_word: קָדָרוּ
  choice: меркнут
  rationale: Глагол передаёт наступление темноты или утрату света. Настоящее время естественно для русского пророческого описания и сохраняет живость картины.
- source_word: וְכוֹכָבִים
  choice: и звёзды
  rationale: Прямой перевод формы множественного числа, продолжающий образ космического помрачения.
- source_word: אָסְפוּ
  choice: скрывают
  rationale: Буквально глагол означает «собирать, убирать». В сочетании с «сиянием» выражает образ светил, словно убирающих или удерживающих свой свет; «скрывают» ясно и поэтично передаёт этот смысл.
- source_word: נָגְהָם
  choice: своё сияние
  rationale: נֹגַהּ обозначает сияние, блеск, свет. «Сияние» точнее сохраняет образ лучезарности, чем общее слово «свет».
theological_decisions:
- issue: Космическое помрачение в пророческой картине суда
  choice: Передать образ прямо, не уточняя, является ли он буквальным, метафорическим или апокалиптически-символическим.
  alternative: Истолковать помрачение как исключительно буквальное астрономическое явление либо исключительно как метафору суда.
  rationale: Еврейский текст кратко и поэтически описывает космические явления, не разрешая вопрос об их точной природе; перевод сохраняет эту богословскую и образную напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим звучанием. «Меркнут» и «скрывают своё сияние» понятны широкому читателю и сохраняют поэтический параллелизм оригинала.
