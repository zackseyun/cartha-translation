- source_word: אֲשֶׁר
  choice: за то, что
  rationale: В данном контексте частица вводит основание суда, описанного перед этим; русская причинная конструкция передаёт эту связь естественно.
- source_word: כַּסְפִּי וּזְהָבִי
  choice: Моё серебро и Моё золото
  rationale: Прямо переданы существительные с притяжательными суффиксами первого лица.
- source_word: לְקַחְתֶּם
  choice: вы взяли
  rationale: Нейтральное и точное соответствие обычному значению глагола לקח; контекст сам придаёт действию смысл незаконного присвоения.
- source_word: וּמַחֲמַדַּי הַטֹּבִים
  choice: Мои драгоценности
  rationale: Естественно передаёт обозначение ценных, желанных предметов вместе с качественным определением «хорошие», не добавляя более узкого понятия «сокровища».
- source_word: הֲבֵאתֶם
  choice: внесли
  rationale: Передаёт каузативное значение «принесли, ввели» с учётом движения внутрь здания.
- source_word: לְהֵיכְלֵיכֶם
  choice: в свои храмы
  rationale: הֵיכָל может означать храм или дворец. В контексте присвоения принадлежащих Богу ценностей предпочтительно культовое значение; притяжательное «свои» естественно соотносится с подлежащим «вы».
theological_decisions:
- issue: Значение הֵיכְלֵיכֶם и характер присвоения принадлежащих Богу ценностей
  choice: культовые здания — «в свои храмы»
  alternative: царские здания — «в свои дворцы»
  rationale: Контекст допускает понимание переноса ценностей в святилища чужих народов, что подчёркивает святотатственный характер поступка. Поскольку само еврейское слово сохраняет оба значения, вариант «дворцы» указан в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная без архаизмов. Противопоставительное «а» помогает ясно отделить присвоение серебра и золота от переноса драгоценностей в храмы.
