  yaml_path: translation/ot/joel/004/012.yaml
  text: Let the nations awaken and come up to the Valley of Jehoshaphat[a], for there I will sit to judge all the surrounding nations.
translation:
  language: ru
  text: Пусть пробудятся народы и поднимутся к долине Иосафата[a], ибо там я сяду судить все народы вокруг.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Иосафат», вероятно, означает «Господь судит», усиливая здесь тему Божьего суда.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעֹרוּ
  choice: пусть пробудятся
  rationale: Форма выражает призыв, а глагол сохраняет образ пробуждения и побуждения к действию.
- source_word: וְיַעֲלוּ
  choice: и взойдут
  rationale: Передаёт обычное значение עלה — движение вверх или к назначенному месту — и сохраняет направление к долине суда.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Речь идёт об окружающих чужеземных народах; «народы» точнее и нейтральнее, чем конфессионально окрашенное «язычники».
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: долину Иосафата
  rationale: Имя собственное передано традиционной русской транслитерацией, а его смысловой отклик объяснён в сноске.
- source_word: כִּי שָׁם
  choice: ибо там
  rationale: Союз вводит основание призыва; «ибо» кратко и уместно в достоинственном литературном регистре.
- source_word: אֵשֵׁב
  choice: я воссяду
  rationale: В сочетании с «судить» глагол изображает Судью, занимающего своё место; «воссяду» сохраняет судебный и царственный оттенок.
- source_word: לִשְׁפֹּט
  choice: чтобы судить
  rationale: Прямо передаёт судебное действие, не уточняя заранее характер или исход приговора.
- source_word: כָּל הַגּוֹיִם מִסָּבִיב
  choice: все окрестные народы
  rationale: «Окрестные» естественно передаёт пространственное значение מִסָּבִיב — народы, находящиеся вокруг.
theological_decisions:
- issue: Передача имени יְהוֹשָׁפָט и заключённого в нём указания на Божий суд
  choice: Сохранить имя «Иосафат» в основном тексте и раскрыть его вероятное значение в сноске.
  alternative: Перевести название как «долина, где Господь судит» или «долина Господнего суда».
  rationale: Сохранение имени не превращает толкование в основной текст, тогда как сноска позволяет передать значимую связь названия с последующим «судить».
translation_notes:
  register: Современный литературный русский с достоинственным пророческим звучанием. «Воссяду» несколько приподнято, но понятно и подчёркивает образ Судьи, занимающего место для суда. Божественное местоимение оставлено со строчной буквы как нейтральная современная издательская норма.
