base_translation:
  language: en
  yaml_path: translation/ot/joel/004/017.yaml
  text: Then you will know that I am Yahweh your God[a], dwelling in Zion, my holy mountain. And Jerusalem will be holy, and strangers will pass through her no more.
translation:
  language: ru
  text: И узнаете, что Я — Яхве, ваш Бог, обитающий на Сионе, Моей святой горе. Иерусалим будет святым, и чужие[a] больше не будут проходить через него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземцы», «посторонние». Еврейское слово זָרִים обозначает чужих, иноземцев или тех, кто не принадлежит к данному месту или сообществу. Здесь, вероятно, имеются в виду те, кому не место в святом городе, а не обязательно все неевреи без исключения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: И узнаете
  rationale: Союз ו связывает итог этого стиха с предшествующим пророческим контекстом; будущее «узнаете» сохраняет смысл удостоверения и признания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, не заменяя её титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Сохраняет суффикс второго лица множественного числа и выраженное в нём отношение Бога к адресатам.
- source_word: שֹׁכֵן בְּצִיּוֹן
  choice: обитающий на Сионе
  rationale: Причастие передано причастной конструкцией; русское «на Сионе» естественно при обозначении горы и священного места.
- source_word: הַר קָדְשִׁי
  choice: Моей святой горе
  rationale: Естественно передаёт определительную конструкцию и притяжательный суффикс первого лица.
- source_word: וְהָיְתָה יְרוּשָׁלִַם קֹדֶשׁ
  choice: Иерусалим будет святыней
  rationale: Существительное קֹדֶשׁ буквально обозначает святость или святыню; предикативное «будет святыней» сохраняет его существительную форму и сакральный смысл.
- source_word: וְזָרִים
  choice: и чужеземцы
  rationale: זָרִים обозначает посторонних, чужих или иноземцев; «чужеземцы» сохраняет возможный этнический оттенок, а примечание ограничивает чрезмерно широкое толкование.
- source_word: לֹא יַעַבְרוּ בָהּ עוֹד
  choice: больше не пройдут через него
  rationale: Сохраняет движение, выраженное עבר, и значение прекращения в עוֹד; местоимение согласовано в русском с названием «Иерусалим».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Статус Иерусалима в выражении קֹדֶשׁ
  choice: будет святыней
  alternative: будет свят; будет святым местом
  rationale: Так сохраняется существительная форма еврейского קֹדֶשׁ и не уточняется сверх текста, идёт ли речь о качестве города или о его статусе как священного места.
- issue: Кого обозначает זָרִים
  choice: чужеземцы
  alternative: посторонние; чужие
  rationale: Слово допускает значение иноземцев и вообще тех, кто не принадлежит к освящённому сообществу или месту. Основной текст сохраняет обычное значение, а сноска — контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Порядок фраз близок к еврейскому оригиналу; «святыней» сохраняет образную и богословскую напряжённость существительного קֹדֶשׁ.
