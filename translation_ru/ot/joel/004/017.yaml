  source_fidelity: 'Основная структура и ключевые соответствия переданы точно: будущее познание, имя Яхве, «ваш Бог», пребывание на Сионе, святость Иерусалима и прекращение прохода זָרִים сохранены. Однако «святыней» сужает и слегка изменяет предикат קֹדֶשׁ: в русском это прежде всего священный предмет либо особо почитаемое место, тогда как здесь говорится о святости самого города. «Чужеземцы» чрезмерно закрепляет этническое значение זָרִים, хотя в данном контексте слово может обозначать чужих/посторонних, не принадлежащих святому городу.'
