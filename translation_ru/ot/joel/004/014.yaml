  yaml_path: translation/ot/joel/004/014.yaml
  text: Multitudes[a], multitudes in the Valley of Decision! For the day of Yahweh is near in the Valley of Decision.
translation:
  language: ru
  text: Толпы, толпы в долине Решения[a]! Ибо близок день Яхве в долине Решения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «долина Суда» или «долина Молотьбы». Еврейское слово указывает на решающее постановление и может также вызывать образ молотьбы.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמוֹנִים
  choice: Толпы
  rationale: Слово обозначает огромную массу, множество людей; повтор сохранён, поскольку он усиливает ощущение масштаба и неотложности.
- source_word: בְּעֵמֶק
  choice: в долине
  rationale: Прямо передаёт обычное значение עֵמֶק и сохраняет конкретный пространственный образ.
- source_word: הֶחָרוּץ
  choice: Решения
  rationale: Слово связано с решённым, постановленным и окончательным приговором, но может также вызывать образ молотьбы острым орудием. «Решения» сохраняет смысл решающего постановления, не сводя многозначность только к суду или молотьбе.
- source_word: כִּי
  choice: Ведь
  rationale: В данном контексте союз вводит основание предшествующего восклицания; «ведь» естественно передаёт эту пояснительно-причинную связь в современном русском языке.
- source_word: קָרוֹב
  choice: близок
  rationale: Точно и лаконично передаёт предикативное значение близости.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Сохраняет устойчивое пророческое выражение о дне решающего Божьего вмешательства и передаёт тетраграмматон как личное имя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога позволяет не заменять его титулом и соответствует выбранному в консультационном слое решению.
theological_decisions:
- issue: Значение עֵמֶק הֶחָרוּץ
  choice: долина Решения
  alternative: долина Суда; долина Молотьбы
  rationale: Еврейское выражение допускает оттенки окончательного постановления, суда и молотьбы как образа суда. Основной текст передаёт центральную идею решающего определения, а примечание сохраняет остальные существенные оттенки.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим ритмом. Повтор сохранён. Заглавная буква в сочетании «долина Решения» подчёркивает характер обозначения, не превращая его в однозначно установленное географическое имя.
