source:
  edition: WLC
  text: הִנְ/נִ֣י מְעִירָ֔/ם מִן הַ֨/מָּק֔וֹם אֲשֶׁר מְכַרְתֶּ֥ם אֹתָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִׁבֹתִ֥י גְמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/007.yaml
  text: Look[a], I am stirring them up from the place where you sold them[b], and I will return your recompense on your own head.
translation:
  language: ru
  text: Вот, Я поднимаю их[a] из того места, куда вы их продали, и обращу ваше воздаяние на ваши же головы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пробуждаю их». Еврейский глагол может означать «будить», «поднимать» или «побуждать к действию».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть: «воздам вам»; буквально — «обращу ваше воздаяние на ваши головы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» естественно для современного литературного русского языка передаёт указательно-эмфатическую силу торжественного Божьего заявления, не прибегая к архаизмам.
- source_word: מְעִירָם
  choice: поднимаю их
  rationale: Причастная форма породы hифиль от עור обозначает побуждение к пробуждению или действию. «Поднимаю» сохраняет широту образа и в данном контексте естественно указывает на вывод проданных людей из места их пребывания, не сводя действие ни к эмоциональному пробуждению, ни к военной мобилизации.
- source_word: מִן הַמָּקוֹם
  choice: из того места
  rationale: Предлог מן выражает движение из места; указательное «того» естественно связывает существительное с последующим определительным придаточным.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתָם שָׁמָּה
  choice: куда вы их продали
  rationale: Наречие направления שָׁמָּה буквально указывает «туда», поэтому русское «куда» точнее сохраняет направительный смысл, чем простое «где».
- source_word: וַהֲשִׁבֹתִי
  choice: и обращу
  rationale: Форма hифиль от שוב означает возвращение или обращение чего-либо обратно. При дополнении «воздаяние» глагол «обращу» сохраняет метафору ответного действия, возвращающегося к виновным.
- source_word: גְמֻלְכֶם
  choice: ваше воздаяние
  rationale: גמול обозначает воздаяние или отплату. «Воздаяние» передаёт нравственно-судебную силу слова и не сужает его до коммерческой платы.
- source_word: בְּרֹאשְׁכֶם
  choice: на ваши же головы
  rationale: Сохранён конкретный древнееврейский образ возмездия, возвращающегося на виновных. Частица «же» ясно передаёт возвратную направленность без замены образа общим словом «накажу».
theological_decisions:
- issue: Характер Божьего действия в מְעִירָם
  choice: Бог действенно поднимает проданных людей и выводит их из места, куда они были проданы.
  alternative: Бог лишь внутренне пробуждает их либо побуждает к военному выступлению.
  rationale: Глагол допускает пробуждение и побуждение к действию, однако ближайший контекст говорит о движении из места продажи. Перевод сохраняет эту широту и не добавляет узкого психологического или военного смысла.
- issue: Смысл выражения גְמֻלְכֶם בְּרֹאשְׁכֶם
  choice: Воздаяние за поступки виновных возвращается на них самих.
  alternative: Обобщённое «Я накажу вас».
  rationale: Исходный текст использует не общий глагол наказания, а конкретный образ ответного воздаяния. Его сохранение передаёт нравственную соразмерность суда, не вводя дополнительных богословских утверждений.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены конкретные образы исходного текста — поднятие людей и воздаяние, обращённое на головы виновных; синтаксис сделан естественным для русского читателя.
