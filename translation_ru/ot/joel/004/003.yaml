  register: Современный литературный русский язык с кратким, суровым ритмом обвинительной речи. Формы «бросали», «отдавали», «продавали», «пили» передают последовательность повествовательных форм без ненужной канцелярской тяжести. Заглавная буква в «Моём» обозначает речь Бога согласно принятой русской библейской типографике.
