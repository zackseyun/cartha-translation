  text: And they cast lots for my people[a]; they gave a boy for a prostitute, and sold a girl for wine[b], and drank it.
translation:
  language: ru
  text: 'О Моём народе бросили жребий: мальчика отдали за проститутку, девочку продали за вино и выпили его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶל עַמִּי
  choice: И о народе Моём
  rationale: Предлог אֶל в сочетании с идиомой «бросать жребий» обозначает тех, чью участь решают жребием. Русское «о народе» естественно передаёт объект жеребьёвки, не добавляя отсутствующего в тексте результата.
- source_word: יַדּוּ גוֹרָל
  choice: бросали жребий
  rationale: Устойчивое еврейское сочетание передано соответствующей русской идиомой.
- source_word: עַמִּי
  choice: народе Моём
  rationale: Сохраняются притяжательное значение и заветный оттенок слова עַם; постпозиция местоимения придаёт речи достоинство без архаизации.
- source_word: וַיִּתְּנוּ
  choice: отдавали
  rationale: Глагол буквально означает «дали/отдали». «Отдавали» сохраняет его прямое значение и в данном контексте естественно выражает сделку, не усиливая её до более конкретного «обменивали».
- source_word: הַיֶּלֶד
  choice: мальчика
  rationale: Артикль здесь допускает родовое употребление; «мальчика» точно передаёт пол и создаёт параллель с «девочкой».
- source_word: בַּזּוֹנָה
  choice: за блудницу
  rationale: Предлог בְּ обозначает цену или встречное предоставление. «За блудницу» сохраняет краткость и резкую предметность текста; слово «блудница» литературно и общеупотребительно в библейском контексте.
- source_word: וְהַיַּלְדָּה מָכְרוּ
  choice: а девочку продавали
  rationale: «Продавали» прямо передаёт מָכְרוּ, а «девочку» — יַלְדָּה. Союз «а» ясно оформляет параллельный второй случай.
- source_word: בַיַּיִן
  choice: за вино
  rationale: Предлог указывает на цену продажи; русское «продать за вино» естественно и точно.
- source_word: וַיִּשְׁתּוּ
  choice: и пили его
  rationale: В еврейском объект подразумевается из предыдущей части. Местоимение «его» естественно восполняет объект по-русски и однозначно относится к вину.
