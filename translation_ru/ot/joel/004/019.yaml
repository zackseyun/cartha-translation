  text: מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה תִֽהְיֶ֔ה וֶ/אֱד֕וֹם לְ/מִדְבַּ֥ר שְׁמָמָ֖ה תִּֽהְיֶ֑ה מֵֽ/חֲמַס֙ בְּנֵ֣י יְהוּדָ֔ה אֲשֶׁר שָׁפְכ֥וּ דָם נָקִ֖יא בְּ/אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/019.yaml
  text: Egypt will become a desolation[a], and Edom a desolate wilderness, because of the violence done to the sons of Judah[c][b], whose innocent blood they shed in their land.
translation:
  language: ru
  text: Египет станет пустошью, а Эдом — безлюдной пустыней за насилие над сынами Иуды[a], чью невинную кровь[b] они пролили на их земле[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Иуды»; выражение может собирательно означать народ Иуды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кровь невиновных».'
    reason: lexical_alternative
  - marker: c
    text: Вероятнее всего, речь о земле сынов Иуды; грамматически возможно и иное отнесение местоимения.
    reason: ambiguity
lexical_decisions:
- source_word: מִצְרַיִם לִשְׁמָמָה תִהְיֶה
  choice: Египет станет пустошью
  rationale: Сочетание לְ с существительным שְׁמָמָה и глаголом היה обозначает переход в итоговое состояние; «станет пустошью» сохраняет образ существительного и естественно звучит по-русски.
- source_word: וֶאֱדוֹם לְמִדְבַּר שְׁמָמָה תִהְיֶה
  choice: а Эдом — безлюдной пустыней
  rationale: מִדְבָּר означает пустынную, необитаемую местность, а שְׁמָמָה усиливает значение опустошения и безлюдности. Эллипсис глагола во второй части естественен для русского параллелизма.
- source_word: מֵחֲמַס
  choice: за насилие над
  rationale: Предлог מִן имеет здесь причинное значение, а חָמָס обозначает насилие, жестокость или неправду; «за насилие над» ясно передаёт основание суда.
- source_word: בְּנֵי יְהוּדָה
  choice: сынами Иуды
  rationale: Формально передаёт еврейское выражение; в контексте оно может собирательно обозначать народ Иуды.
- source_word: אֲשֶׁר שָׁפְכוּ
  choice: за то, что они пролили
  rationale: Относительная конструкция раскрывает содержание осуждаемого насилия. Причинная русская формулировка передаёт её связь с предшествующим מֵחֲמַס без неясного местоименного оборота.
- source_word: דָם נָקִיא
  choice: невинную кровь
  rationale: Устойчивое и точное соответствие еврейскому словосочетанию; допускает понимание как крови невиновных людей.
- source_word: בְּאַרְצָם
  choice: на их земле
  rationale: Сохраняет местоименный суффикс третьего лица множественного числа и не устраняет полностью возможную неоднозначность его отнесения.
theological_decisions:
- issue: К кому относится местоименный суффикс в בְּאַרְצָם
  choice: В основном тексте сохранено «на их земле», наиболее естественно относимое к сынам Иуды
  alternative: Земля Египта и Эдома либо намеренно неоднозначная отсылка
  rationale: 'Ближайший и контекстуально наиболее связный антецедент — «сыны Иуды»: народы осуждаются за пролитие их крови на их собственной земле. Сноска сохраняет грамматически возможную неоднозначность.'
- issue: Значение דָם נָקִיא
  choice: невинную кровь
  alternative: кровь невиновных
  rationale: Основной вариант сохраняет краткую образность исходного выражения, а сноска указывает на возможное личное понимание — кровь невиновных людей.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм сохранён, тяжеловесный буквализм устранён; ключевые образы опустошения, насилия и невинной крови оставлены без конфессионального истолкования.
