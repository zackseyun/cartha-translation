    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְאוּ זֹאת בַּגּוֹיִם
  choice: Провозгласите это среди народов
  rationale: קרא в данном контексте означает публично возвестить; указательное זֹאת сохранено как «это», а בַּגּוֹיִם естественно передано «среди народов».
- source_word: קַדְּשׁוּ מִלְחָמָה
  choice: Освятите войну
  rationale: Формулировка сохраняет культовую силу קדשׁ — отделить или посвятить как святое, — не сводя выражение лишь к практической подготовке к битве.
- source_word: הָעִירוּ הַגִּבּוֹרִים
  choice: поднимите воинов
  rationale: Каузативная форма עור означает «пробудить, поднять, побудить»; «поднимите» естественно звучит как призыв мобилизовать воинов.
- source_word: יִגְּשׁוּ
  choice: Пусть приблизятся
  rationale: Юссивное значение формы передано побудительной конструкцией; «приблизятся» сохраняет формальный смысл приближения к месту сбора или сражения.
- source_word: יַעֲלוּ
  choice: пусть выступят
  rationale: עלה буквально обозначает движение вверх, но в военном призыве может выражать выход или выступление в поход; «выступят» естественно передаёт контекст, не превращая глагол просто в «нападут».
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: все воины
  rationale: Еврейское выражение буквально означает «все мужи войны»; современное русское «все воины» точно и без стилистической архаики передаёт обозначение мужчин, участвующих в сражении.
theological_decisions:
- issue: Сохранение культового оттенка קדשׁ в призыве к войне
  choice: Освятите войну
  alternative: Приготовьтесь к войне
  rationale: В контексте военного сбора выражение может идиоматически означать подготовку к войне, однако קדשׁ вносит смысл посвящения или отделения как святого. Основной текст сохраняет эту богословскую напряжённость, а примечание поясняет идиоматическое значение.
