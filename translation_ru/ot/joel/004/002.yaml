reference: Joel 4:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/קִבַּצְתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וְ/ה֣וֹרַדְתִּ֔י/ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט וְ/נִשְׁפַּטְתִּ֨י עִמָּ֜/ם שָׁ֗ם עַל עַמִּ֨/י וְ/נַחֲלָתִ֤/י יִשְׂרָאֵל֙ אֲשֶׁ֣ר פִּזְּר֣וּ בַ/גּוֹיִ֔ם וְ/אֶת אַרְצִ֖/י חִלֵּֽקוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/002.yaml
  text: I will gather all the nations and bring them down to the Valley of Jehoshaphat[a], and there I will enter into judgment with them on behalf of my people and my inheritance, Israel[b], whom they scattered among the nations and divided up my land.
translation:
  language: ru
  text: Я соберу все народы, сведу их в долину Иосафата[a] и там буду судиться с ними за[b] Мой народ и Моё наследие — Израиль, который они рассеяли среди народов, а Мою землю разделили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Долина Иосафата» — название места; имя «Иосафат» может также напоминать выражение «Господь судит».
    reason: cultural_note
  - marker: b
    text: 'Или: «из-за Моего народа и Моего наследия — Израиля»; возможно также: «о Моём народе и Моём наследии — Израиле». Еврейский предлог допускает несколько близких значений в этом судебном контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִבַּצְתִּי
  choice: соберу
  rationale: Передаёт обычное значение קבץ — собрать множество в одном месте — естественным современным русским глаголом.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: В контексте имеются в виду чужеземные народы как совокупность, а не позднейшее техническое обозначение «язычники».
- source_word: הוֹרַדְתִּים
  choice: приведу их в долину
  rationale: Контекст долины сохраняет пространственную направленность вниз, тогда как «приведу» звучит естественнее архаичного «низведу» и передаёт каузативное действие.
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: долина Иосафата
  rationale: Выражение оформлено как географическое название; традиционная русская форма имени сохраняется, а возможный смысл имени отмечен в сноске.
- source_word: וְנִשְׁפַּטְתִּי עִמָּם
  choice: вступлю с ними в суд
  rationale: Сохраняет судебно-состязательный оттенок нифаля שפט с предлогом עִם, не сводя выражение только к вынесению приговора.
- source_word: עַל עַמִּי וְנַחֲלָתִי יִשְׂרָאֵל
  choice: за Мой народ и Моё наследие — Израиль
  rationale: «За» естественно выражает судебное выступление в защиту народа, но остающаяся неоднозначность עַל раскрыта в сноске; тире ясно передаёт приложение «Израиль».
- source_word: פִּזְּרוּ בַגּוֹיִם
  choice: они рассеяли среди народов
  rationale: Сохраняет образ насильственного рассеяния Израиля среди других народов.
- source_word: אַרְצִי חִלֵּקוּ
  choice: Мою землю разделили
  rationale: Формально и ясно передаёт конкретный раздел принадлежащей Господу земли без разговорного усиления.
theological_decisions:
- issue: Заветный смысл נַחֲלָתִי
  choice: Моё наследие
  alternative: Моё достояние; Моё владение
  rationale: «Наследие» сохраняет устойчивый библейский образ особой принадлежности Израиля Богу и не ограничивает его одним имущественным значением.
- issue: Значение עַל в судебной формуле
  choice: за Мой народ
  alternative: из-за Моего народа; о Моём народе
  rationale: Предлог может указывать на основание, предмет либо защитную направленность суда. Основной текст передаёт вероятный смысл действия в защиту народа, а сноска сохраняет близкие возможные прочтения.
- issue: Характер суда в וְנִשְׁפַּטְתִּי עִמָּם
  choice: вступлю с ними в суд
  alternative: буду судить их; буду судиться с ними
  rationale: Выбранная формулировка сохраняет юридическое противостояние и не опережает текст указанием только на приговор.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным без архаизмов; юридическая образность и неоднозначность предлога עַל сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
