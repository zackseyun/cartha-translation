lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительную и обосновывающую связь с предшествующим контекстом.
- source_word: הִנֵּה
  choice: вот
  rationale: Естественная для современного русского пророческого стиля частица, привлекающая внимание к значимому будущему событию.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: в те дни
  rationale: Точно и естественно передаёт стандартное временное выражение.
- source_word: וּבָעֵת הַהִיא
  choice: и в то время
  rationale: Сохраняет параллельное временное уточнение и его усилительную функцию.
- source_word: אֲשֶׁר
  choice: когда
  rationale: В данном синтаксическом окружении вводит временное придаточное; «когда» естественнее буквального относительного оборота.
- source_word: אָשׁוּב אֶת־שְׁבוּת
  choice: Я восстановлю благополучие
  rationale: Передаёт идиоматический смысл возвращения народа из бедственного состояния, не ограничивая выражение только физическим возвращением пленников; альтернативы отмечены в сноске.
- source_word: יְהוּדָה
  choice: Иудеи
  rationale: Нормативная русская библейская форма названия страны и народа в требуемом падеже.
- source_word: וִירוּשָׁלִָם
  choice: и Иерусалима
  rationale: Нормативная русская форма названия города, синтаксически соединённого с Иудеей.
theological_decisions:
- issue: Идиоматический смысл שׁוּב אֶת־שְׁבוּת
  choice: «восстановлю благополучие» в основном тексте
  alternative: «возвращу из плена» или «верну пленников»
  rationale: Еврейское выражение может обозначать как возвращение из плена, так и более широкое избавление от бедствия и восстановление прежнего благополучия. Основной вариант сохраняет широту идиомы, а историко-пленнический оттенок прозрачно представлен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Частицы «ибо вот» сохраняют связь с контекстом и торжественный акцент оригинала; порядок временных оборотов следует еврейскому тексту. Прописная «Я» отражает принятое русское оформление прямой речи Бога.
