  text: כֹּ֤תּוּ אִתֵּי/כֶם֙ לַֽ/חֲרָב֔וֹת וּ/מַזְמְרֹֽתֵי/כֶ֖ם לִ/רְמָחִ֑ים הַֽ/חַלָּ֔שׁ יֹאמַ֖ר גִּבּ֥וֹר אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/010.yaml
  text: Beat your plowshares into swords[a], and your pruning hooks into spears; let the weak say[b], “I am a warrior.”
translation:
  language: ru
  text: 'Перекуйте ваши лемехи в мечи[a], а ваши садовые ножи — в копья. Пусть слабый скажет: «Я воин[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот образ обращает вспять сказанное в Ис. 2:4 и Мих. 4:3, где оружие перековывают в земледельческие орудия.
    reason: cross_reference
  - marker: b
    text: 'Или: «Я силён», «Я могуч». Еврейское слово גִּבּוֹר может обозначать могучего или сильного человека, а также воина; здесь военный контекст поддерживает перевод «воин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתּוּ
  choice: Перекуйте
  rationale: Повелительная форма множественного числа от כתת передаёт ударную обработку металла и превращение одного орудия в другое; «перекуйте» естественно и точно выражает этот образ по-русски.
- source_word: אִתֵּיכֶם
  choice: ваши лемехи
  rationale: Слово обозначает орудия для пахоты или обработки земли. «Лемехи» сохраняет конкретный земледельческий образ и узнаваемую связь с Ис 2:4 и Мих 4:3.
- source_word: לַחֲרָבוֹת
  choice: в мечи
  rationale: Предлог ל здесь указывает на результат превращения; русская конструкция «перековать в мечи» передаёт это естественно.
- source_word: וּמַזְמְרֹתֵיכֶם
  choice: а ваши садовые ножи
  rationale: מַזְמֵרָה — орудие для обрезки растений, особенно виноградной лозы. «Садовые ножи» понятно современному читателю и не создаёт неуместного образа крюка.
- source_word: לִרְמָחִים
  choice: в копья
  rationale: רֹמַח обозначает копьё или пику; «копья» — наиболее естественный и общеупотребительный русский эквивалент.
- source_word: הַחַלָּשׁ
  choice: слабый
  rationale: Субстантивированное прилагательное обозначает слабого человека; единственное число сохраняет обобщённую форму еврейского текста.
- source_word: יֹאמַר
  choice: пусть ... скажет
  rationale: Форма имперфекта после повелений имеет побудительный оттенок, который естественно передаётся конструкцией «пусть скажет».
- source_word: גִּבּוֹר
  choice: воин
  rationale: גִּבּוֹר может означать сильного, могучего человека или доблестного воина. Военный контекст превращения земледельческих орудий в оружие поддерживает перевод «воин», при сохранении альтернатив в сноске.
- source_word: אָנִי
  choice: Я
  rationale: Явно выраженное местоимение подчёркивает самоутверждение говорящего; в русской именной конструкции настоящего времени связка не требуется.
theological_decisions:
- issue: Межтекстовое обращение образа мирного пророчества
  choice: Сохранить узнаваемое превращение лемехов в мечи и орудий обрезки в копья как призыв вооружиться перед судом.
  alternative: Передать общий смысл вооружения, не сохраняя словесной связи с Ис 2:4 и Мих 4:3.
  rationale: Еврейский текст намеренно обращает вспять формулу Ис 2:4 и Мих 4:3. Конкретные названия земледельческих орудий и оружия позволяют увидеть эту напряжённую связь без внесения дополнительного толкования в основной текст.
- issue: Значение גִּבּוֹר в самоутверждении слабого
  choice: Перевести «Я воин», учитывая непосредственный военный контекст.
  alternative: Перевести «Я силён» или «Я могуч».
  rationale: Лексема допускает как характеристику силы, так и обозначение воина. Контекст подготовки оружия склоняет к «воин», однако смысловая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом повеления. Сохранены конкретность земледельческих и военных образов, обобщённое единственное число «слабый» и торжественное самоутверждение в прямой речи.
