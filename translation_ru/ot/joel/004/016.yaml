base_translation:
  language: en
  yaml_path: translation/ot/joel/004/016.yaml
  text: And Yahweh roars from Zion and gives his voice from Jerusalem[a], and the heavens and the earth quake; but Yahweh is a refuge for his people[b], and a stronghold for the sons of Israel.
translation:
  language: ru
  text: Яхве возрычит с Сиона и возвысит Свой голос из Иерусалима[a]; содрогнутся небеса и земля. И Яхве — убежище для Своего народа и твердыня для сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даст Свой голос» — еврейское выражение, означающее громко или грозно подать голос.'
    reason: lexical_alternative
  - marker: b
    text: 'Или более идиоматично: «для потомков Израиля» либо «для народа Израиля». Буквально: «для сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, в принятой современной русской транслитерации, а не заменяет его титулом.
- source_word: מִצִּיּוֹן
  choice: с Сиона
  rationale: Предлог указывает на исходный пункт; с названием возвышенности «с Сиона» по-русски естественнее, чем «из Сиона».
- source_word: יִשְׁאָג
  choice: возрычит
  rationale: Глагол обозначает мощный рык, в частности львиный; «возрычит» сохраняет яркий образ и пророческую торжественность.
- source_word: וּמִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Прямо передаёт пространственное значение предлога и сохраняет параллелизм с Сионом.
- source_word: יִתֵּן קוֹלוֹ
  choice: возвысит Свой голос
  rationale: Еврейская идиома буквально означает «даст Свой голос» и описывает громкое, мощное звучание; выбран естественный русский эквивалент без ослабления образа.
- source_word: וְרָעֲשׁוּ
  choice: содрогнутся
  rationale: Передаёт сильное сотрясение космического масштаба и естественно сочетается с подлежащими «небеса и земля».
- source_word: שָׁמַיִם וָאָרֶץ
  choice: небеса и земля
  rationale: Сохраняет грамматическое число еврейского שָׁמַיִם и всеохватный космический меризм.
- source_word: מַחֲסֶה
  choice: убежище
  rationale: Обозначает место защиты и прибежища; «убежище» ясно и естественно в современном литературном русском.
- source_word: לְעַמּוֹ
  choice: для Своего народа
  rationale: 'Предлог выражает отношение и пользу: Яхве служит убежищем Своему народу.'
- source_word: וּמָעוֹז
  choice: твердыня
  rationale: Передаёт укреплённое место или источник защищённости и силы; сохраняет торжественный пророческий регистр.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Формально сохраняет мужское множественное בְּנֵי и традиционное национально-родовое обозначение; возможный более идиоматический смысл пояснён в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. Транслитерация «Яхве» сохраняет различие между личным именем и титулом, не вводя конфессиональной замены.
- issue: Объём выражения בְּנֵי יִשְׂרָאֵל
  choice: 'сыны/сыновья Израиля в национально-родовом смысле: «для сынов Израиля»'
  alternative: для потомков Израиля; для народа Израиля
  rationale: Буквальная мужская форма сохранена в основном тексте, но выражение может обозначать совокупность потомков или народ в целом; эта смысловая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Формы «возрычит» и «твердыня» сохраняют возвышенный библейский регистр, оставаясь понятными; синтаксис краток и передаёт контраст между космическим судом и защитой Божьего народа.
