base_translation:
  language: en
  yaml_path: translation/ot/joel/004/004.yaml
  text: And also[a], what are you to me, Tyre and Sidon, and all the regions of Philistia? Are you repaying me with recompense? If you are dealing out repayment against me[b], swiftly and quickly I will return your repayment on your own head.
translation:
  language: ru
  text: 'И ещё: что вам до Меня[a], Тир и Сидон и все области Филистии[b]? Неужели вы отплачиваете Мне возмездием? Если вы отплачиваете Мне, Я тотчас, без промедления, обращу вашу отплату на вашу же голову.


    [a] Буквально: «что вы Мне?» Это еврейское выражение передаёт вызов и решительное неприятие притязаний собеседника.


    [b] Или: «округа»; также возможно: «владения филистимлян».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что вы Мне?» Это еврейское выражение передаёт вызов и решительное неприятие притязаний собеседника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «округа»; также возможно: «владения филистимлян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם מָה אַתֶּם לִי
  choice: 'И ещё: что вам до Меня'
  rationale: «И ещё» передаёт усилительную связку וְגַם, а естественное русское «что вам до Меня» сохраняет конфронтационный характер идиомы מָה אַתֶּם לִי. Буквальная форма отмечена в сноске.
- source_word: צֹר וְצִידוֹן
  choice: Тир и Сидон
  rationale: Употреблены закрепившиеся в русской библейской и общеязыковой традиции формы географических названий.
- source_word: וְכֹל גְּלִילוֹת פְּלָשֶׁת
  choice: и все области Филистии
  rationale: גְּלִילוֹת означает области или округа, а פְּלָשֶׁת здесь естественно передать названием страны «Филистия». Возможные варианты сохранены в сноске.
- source_word: הַגְּמוּל אַתֶּם מְשַׁלְּמִים עָלָי
  choice: Неужели вы воздаёте Мне?
  rationale: Вопросительная конструкция передаёт вызов; «воздаёте» выражает смысл ответного возмездия, не добавляя отсутствующего в тексте основания или мотива.
- source_word: וְאִם גֹּמְלִים אַתֶּם עָלַי
  choice: Если вы воздаёте Мне
  rationale: Повтор глагола с тем же русским корнем сохраняет настойчивый мотив воздаяния и условную форму еврейского текста.
- source_word: קַל מְהֵרָה
  choice: тотчас, без промедления
  rationale: Два русских выражения передают усиленную парную формулу быстроты, не сводя её к одному наречию.
- source_word: אָשִׁיב גְּמֻלְכֶם בְּרֹאשְׁכֶם
  choice: обращу ваше воздаяние на вашу же голову
  rationale: «Обращу» сохраняет образ возврата совершённого на самих виновников, «воздаяние» поддерживает лексический повтор, а «на вашу же голову» естественно передаёт еврейскую формулу личной ответственности.
theological_decisions:
- issue: Характер Божьего ответа
  choice: Прямая угроза ответного воздаяния сохранена без смягчения
  alternative: Обобщённое утверждение о безличных последствиях поступков
  rationale: Повтор корня גמל и оборот «на вашу голову» описывают личное и непосредственное ответное действие Бога, а не безличный нравственный закон.
- issue: Неопределённость условного оборота וְאִם
  choice: Сохранено прямое условие «Если вы воздаёте Мне»
  alternative: Уступительное «даже если вы воздаёте Мне» или волевое «если вы хотите воздать Мне»
  rationale: Еврейский текст допускает риторический оттенок, но прямо не выражает ни уступки, ни намерения; поэтому они не внесены в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Заглавные формы «Меня», «Мне», «Я» указывают на говорящего Бога по нормам русского религиозного регистра. Повтор «воздаёте / воздаяние» намеренно сохранён ради ключевой словесной связи оригинала.
