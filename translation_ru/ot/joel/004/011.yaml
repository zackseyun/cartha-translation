  text: ע֣וּשׁוּ וָ/בֹ֧אוּ כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה הַֽנְחַ֥ת יְהוָ֖ה גִּבּוֹרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/011.yaml
  text: Hasten and come[a], all you nations from every side, and gather yourselves there. Bring down your mighty ones[b], O Yahweh.
translation:
  language: ru
  text: Поспешите и придите[a], все народы со всех сторон, и соберитесь там. Низведи Своих могучих[b], Яхве!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поторопитесь и придите… и соберитесь там».'
    reason: Лексическая альтернатива для редкой формы עוּשׁוּ и близкого по смыслу выражения срочности.
  - marker: b
    text: 'Или: «Ниспошли, Яхве, Своих воинов». Еврейское выражение «Своих могучих» может обозначать могущественных, принадлежащих Яхве, не уточняя, люди они или небесные существа.'
    reason: Альтернативная передача глагола и существительного при сохранении неопределённости относительно того, кто именно назван могучими.
lexical_decisions:
- source_word: ע֣וּשׁוּ
  choice: Поспешите
  rationale: Редкая форма в данном контексте выражает настоятельный призыв двигаться без промедления; «поспешите» естественно передаёт срочность и сохраняет повелительное наклонение.
- source_word: וָ/בֹ֧אוּ
  choice: и придите
  rationale: Повелительная форма глагола בוא передана прямо, а союз сохранён ради последовательности и риторического нарастания призыва.
- source_word: כָֽל הַ/גּוֹיִ֛ם
  choice: все народы
  rationale: В контексте повелительных форм словосочетание имеет силу обращения; русская пунктуация и порядок слов ясно передают это без добавления местоимения.
- source_word: מִ/סָּבִ֖יב
  choice: со всех сторон
  rationale: Передаёт движение народов из окружающих мест к одной точке и звучит естественно по-русски.
- source_word: וְ/נִקְבָּ֑צוּ
  choice: и соберитесь
  rationale: Нифаль в контексте призыва обозначает совместное собирание. Возвратная форма «соберитесь» сохраняет этот оттенок лучше, чем более отвлечённое «сойдитесь».
- source_word: שָׁ֕מָּ/ה
  choice: там
  rationale: Кратко и точно передаёт направительное указание на уже подразумеваемое место.
- source_word: הַֽנְחַ֥ת
  choice: Низведи
  rationale: Каузативная повелительная форма передаёт действие сверху вниз. «Низведи» сохраняет направление движения и уместна в торжественной молитвенной речи.
- source_word: יְהוָ֖ה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом; обращение отмечено запятой.
- source_word: גִּבּוֹרֶֽי/ךָ
  choice: Своих могучих
  rationale: Субстантивированное «могучих» сохраняет широкое значение сильных и могущественных деятелей, не уточняя без достаточного основания, люди это или небесные существа. Возвратное притяжательное местоимение естественно указывает на принадлежность адресату повеления.
theological_decisions:
- issue: Кто такие «могучие» Яхве
  choice: Своих могучих
  alternative: Своих воинов; Своих героев; небесное воинство
  rationale: Еврейское גִּבּוֹרֶיךָ обозначает принадлежащих Яхве могущественных деятелей, но не называет их прямо людьми или ангельскими существами. Основной текст сохраняет эту неопределённость.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя сохранено как имя, а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Краткие повелительные формы сохраняют напор исходного текста; «низведи» выбрано как понятное, но возвышенное слово, точно передающее движение вниз.
