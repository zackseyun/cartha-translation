base_translation:
  language: en
  yaml_path: translation/ot/joel/004/013.yaml
  text: Send in the sickle, for the harvest is ripe. Come, go down, for the winepress is full; the vats overflow, for their evil is great.
translation:
  language: ru
  text: 'Пустите серп, ибо жатва созрела. Идите, спускайтесь[a], ибо давильня полна, чаны переполняются: велико их зло.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «спускайтесь». Возможно, имеется в виду спуск в давильню; некоторые переводы передают по смыслу: «топчите».'
    reason: Поясняет непривычное в данном контексте буквальное значение רְדוּ, не устраняя возможный образ топтания винограда.
lexical_decisions:
- source_word: שִׁלְחוּ מַגָּל
  choice: Пускайте серп
  rationale: Сохраняет образ и повелительную форму еврейского выражения «пошлите/пустите серп», передавая его естественным современным русским оборотом.
- source_word: בָשַׁל קָצִיר
  choice: жатва созрела
  rationale: Глагол означает «созреть», а קָצִיר здесь обозначает урожай, готовый к жатве, либо саму жатву как образ.
- source_word: בֹּאוּ רְדוּ
  choice: Идите, спускайтесь
  rationale: Оба повеления переданы отдельно. רְדוּ по масоретской огласовке значит «спускайтесь»; контекст давильни допускает связь со входом в неё, но не требует замены глаголом «топчите».
- source_word: גַּת
  choice: давильня
  rationale: Обозначает место или устройство для выдавливания виноградного сока; «давильня» понятно и отличает его от следующих накопительных чанов.
- source_word: הַיְקָבִים
  choice: чаны
  rationale: Множественное число обозначает ёмкости, куда стекает выжатый сок.
- source_word: רַבָּה רָעָתָם
  choice: велико их зло
  rationale: Передаёт нравственный смысл רָעָה и сохраняет обобщённость исходного обвинения.
theological_decisions:
- issue: Образ суда как сбора урожая и виноделия
  choice: Сохранить два параллельных образа без поясняющей вставки
  alternative: Прямо назвать жатву и давильню образами Божьего суда
  rationale: Исходный текст выражает суд метафорически и сам связывает его с великим злом людей; эксплицитное толкование сузило бы поэтическую напряжённость.
- issue: Значение רְדוּ в контексте давильни
  choice: «спускайтесь» с примечанием
  alternative: «топчите»
  rationale: Масоретский текст указывает на глагол «спускаться». Контекст может подразумевать спуск в давильню для топтания винограда, однако самого глагола «топтать» здесь нет.
translation_notes:
  register: Современный литературный русский язык с кратким, повелительным и торжественным ритмом. «Давильня» и «чаны» сохраняют различие между местом выжимания винограда и ёмкостями для сока. Местоимение «их» оставлено без уточнения референта, как в исходном тексте.
