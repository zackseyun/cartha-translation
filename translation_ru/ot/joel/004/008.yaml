base_translation:
  language: en
  yaml_path: translation/ot/joel/004/008.yaml
  text: And I will sell your sons and your daughters into the hand of the sons of Judah[a], and they will sell them to the Sabeans, to a distant nation[b]; for Yahweh has spoken.
translation:
  language: ru
  text: И Я продам ваших сыновей и ваших дочерей в руки сынов Иуды, а они продадут их савеям[a], далёкому народу, — ибо Яхве сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Савеи — народ Савы (Шевы).
    reason: cultural_note
lexical_decisions:
- source_word: וּמָכַרְתִּי
  choice: И Я продам
  rationale: Глагол מכר в породе каль означает «продавать». Прямое значение сохраняет образ возмездия и не смягчает его до общего «передам».
- source_word: בְּנֵיכֶם ... בְּנוֹתֵיכֶם
  choice: ваших сыновей и ваших дочерей
  rationale: Исходный текст раздельно называет сыновей и дочерей; это различие сохранено.
- source_word: בְּיַד
  choice: в руки
  rationale: Еврейская идиома буквально говорит о передаче «в руку», то есть под чью-либо власть. Русское «в руки» естественно и сохраняет исходный образ.
- source_word: בְּנֵי יְהוּדָה
  choice: сынов Иуды
  rationale: Формулировка сохраняет родовой оборот исходного текста и его связь с последующим действием этой группы. По смыслу речь идёт о народе Иуды.
- source_word: וּמְכָרוּם
  choice: а они продадут их
  rationale: Повторён тот же глагол «продать», что и в начале стиха; местоимение относится к ранее названным сыновьям и дочерям.
- source_word: לִשְׁבָאיִם
  choice: савеям
  rationale: Форма обозначает народ Савы (Шевы), а не отвлечённое название местности. Традиционное русское этническое наименование пояснено в сноске.
- source_word: אֶל גּוֹי רָחוֹק
  choice: далёкому народу
  rationale: Оборот характеризует савеев как удалённый народ. «Далёкому народу» естественно передаёт и значение גּוֹי, и пространственный смысл רָחוֹק.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: ибо Яхве сказал
  rationale: כִּי вводит основание и подтверждение неизбежности сказанного. דִּבֵּר естественно передано глаголом «сказал», сохраняя торжественную заключительную формулу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон — личное имя Бога. Форма «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Субъект первого лица в начале стиха
  choice: Я
  alternative: он
  rationale: Форма וּמָכַרְתִּי имеет первое лицо единственного числа и продолжает прямую речь Яхве; прописная буква помогает русскому читателю распознать говорящего, не добавляя нового титула.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «ваших» сохранён ради ритма и соответствия параллельной структуре. Оборот «сыны Иуды» оставляет родовой образ оригинала, а сноска кратко поясняет менее знакомое название народа.
