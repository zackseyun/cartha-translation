id: JOL.4.18
reference: Joel 4:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא יִטְּפ֧וּ הֶ/הָרִ֣ים עָסִ֗יס וְ/הַ/גְּבָעוֹת֙ תֵּלַ֣כְנָה חָלָ֔ב וְ/כָל אֲפִיקֵ֥י יְהוּדָ֖ה יֵ֣לְכוּ מָ֑יִם וּ/מַעְיָ֗ן מִ/בֵּ֤ית יְהוָה֙ יֵצֵ֔א וְ/הִשְׁקָ֖ה אֶת נַ֥חַל הַ/שִּׁטִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/018.yaml
  text: And in that day the mountains will drip sweet wine[a], and the hills will flow with milk, and all the streambeds of Judah will flow with water; and a spring will come out from the house of Yahweh and will water the Valley of Shittim.
translation:
  language: ru
  text: 'И будет в тот день:

    горы будут источать молодое вино,

    с холмов потечёт молоко,

    по всем руслам Иудеи потечёт вода.

    Из дома Яхве забьёт источник

    и напоит долину Шиттим[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долину акаций»; возможно также: «вади Акаций».'
    reason: Еврейское נַחַל הַשִּׁטִּים допускает как топонимическое, так и нарицательное понимание; נַחַל обозначает долину сезонного потока или вади.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохраняет традиционную пророческую формулу и её будущую направленность, оставаясь естественной для современного русского языка.
- source_word: יִטְּפוּ
  choice: будут источать
  rationale: Передаёт образ капающей, обильно текущей жидкости; в сочетании с горами по-русски звучит естественнее буквального «будут капать».
- source_word: עָסִיס
  choice: молодое вино
  rationale: Обозначает свежий виноградный сок или молодое вино; выбранный вариант сохраняет винодельческий образ и допускаемую контекстом ферментацию.
- source_word: תֵּלַכְנָה חָלָב
  choice: с холмов потечёт молоко
  rationale: Еврейское «пойдут молоком» идиоматически передано как течение молока; перестройка фразы естественна по-русски.
- source_word: אֲפִיקֵי יְהוּדָה
  choice: все русла Иудеи
  rationale: אֲפִיקִים — русла водотоков, нередко пересыхающих; «русла» конкретно и понятно, не вводя менее знакомый термин «вади».
- source_word: יֵלְכוּ מָיִם
  choice: потечёт вода
  rationale: Буквальное «пойдут воды» в данном контексте естественно передаётся глаголом течения.
- source_word: מַעְיָן ... יֵצֵא
  choice: забьёт источник
  rationale: Передаёт появление и истечение родниковой воды из святилища живым русским выражением без добавления идеи искусственного фонтана.
- source_word: מִבֵּית יְהוָה
  choice: из дома Яхве
  rationale: Сохраняет буквальное «дом» и его храмовый смысл, не заменяя его более толковательным словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְהִשְׁקָה
  choice: напоит
  rationale: Глагол в породе хифиль означает «дать пить, напоить, оросить»; «напоит» сохраняет олицетворённую образность источника.
- source_word: נַחַל הַשִּׁטִּים
  choice: долину Шиттим
  rationale: נַחַל может обозначать долину сезонного потока, а הַשִּׁטִּים может быть топонимом. Основной текст сохраняет вероятное географическое название, а нарицательное понимание вынесено в примечание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Топоним или нарицательное значение הַשִּׁטִּים
  choice: долину Шиттим
  alternative: долину акаций; вади Акаций
  rationale: Форма допускает понимание как известного места Шиттим и как указания на акации. Возможная двусмысленность сохранена с помощью примечания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим ритмом. Параллелизм оригинала сохранён разбивкой на строки. Архаизмы и узкоспециальная географическая лексика в основном тексте избегаются; неоднозначность последнего топонима отмечена в сноске.
