base_translation:
  language: en
  yaml_path: translation/ot/joel/004/006.yaml
  text: And the sons of Judah and the sons of Jerusalem you sold to the sons of the Greeks[b][a], in order to remove them far from their border.
translation:
  language: ru
  text: И сынов Иуды и сынов Иерусалима вы продали грекам[a], чтобы увести их далеко от их земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам греков»; возможно также: «ионийцам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от их границ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה וּבְנֵי יְרוּשָׁלִַם
  choice: А сынов Иуды и сынов Иерусалима
  rationale: Сохраняется повтор еврейского בְּנֵי и семейно-народный образ «сынов», при этом русская конструкция звучит естественно и торжественно.
- source_word: מְכַרְתֶּם
  choice: вы продали
  rationale: Форма qal perfect 2-го лица множественного числа выражает совершённое действие и прямое обвинение.
- source_word: לִבְנֵי הַיְּוָנִים
  choice: грекам
  rationale: הַיְּוָנִים обозначает греков, исторически также ионийцев; в русском «грекам» естественно передаёт значение всей конструкции «сынам греков».
- source_word: לְמַעַן הַרְחִיקָם
  choice: чтобы увести их далеко
  rationale: לְמַעַן обозначает цель, а hифиль רחק — причинение удаления. «Увести» уместно для проданных людей, не уточняя сверх текста способ их перемещения.
- source_word: מֵעַל גְּבוּלָם
  choice: от их земли
  rationale: גְּבוּל может означать границу, пределы или территорию. В данном контексте удаления людей «их земля» естественно передаёт территориальный смысл.
