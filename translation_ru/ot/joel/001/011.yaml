base_translation:
  language: en
  yaml_path: translation/ot/joel/001/011.yaml
  text: Be ashamed[a], farmers; wail, vinedressers, over the wheat and over the barley[b], because the harvest of the field has perished.
translation:
  language: ru
  text: Стыдитесь[a], земледельцы; рыдайте[b], виноградари, о пшенице и о ячмене, ибо погиб урожай поля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте посрамлены»; возможно также: «Будьте в смятении». Еврейский глагол может выражать стыд или посрамление, а также смятение перед бедствием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «войте». Еврейский глагол обозначает громкий крик скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: Стыдитесь
  rationale: Форма повелительного наклонения во множественном числе сохраняет прямой пророческий призыв. Глагол בוש допускает оттенки стыда, посрамления и потрясения; основной текст передаёт его наиболее буквально, не устраняя многозначности.
- source_word: אִכָּרִים
  choice: земледельцы
  rationale: Слово обозначает людей, возделывающих землю. «Земледельцы» — точное, современное и стилистически уместное обозначение в контексте гибели зерновых.
- source_word: הֵילִילוּ
  choice: рыдайте
  rationale: Глагол ילל означает громкий скорбный плач. «Рыдайте» естественно звучит по-русски и передаёт силу выражения, тогда как буквальное «войте» может вызвать нежелательные ассоциации.
- source_word: כֹּרְמִים
  choice: виноградари
  rationale: Точное современное название тех, кто выращивает виноград и ухаживает за виноградниками.
- source_word: עַל
  choice: о
  rationale: В контексте плача предлог вводит предмет скорби. Повтор «о пшенице и о ячмене» сохраняет повторение еврейского предлога и естественен по-русски.
- source_word: חִטָּה
  choice: пшеница
  rationale: Обычное и точное соответствие названию зерновой культуры.
- source_word: שְׂעֹרָה
  choice: ячмень
  rationale: Обычное и точное соответствие названию зерновой культуры.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для призыва к плачу. «Ибо» сохраняет причинную связь и соответствует возвышенному, но понятному библейскому регистру.
- source_word: אָבַד
  choice: погиб
  rationale: Глагол выражает утрату, гибель или исчезновение. «Погиб» кратко и выразительно передаёт совершившуюся полную потерю урожая без добавления явного деятеля разрушения.
- source_word: קְצִיר שָׂדֶה
  choice: урожай поля
  rationale: Сохраняется компактная именная конструкция оригинала и непосредственный сельскохозяйственный образ; «поля» здесь не расширяется до более общего «земли».
