  yaml_path: translation/ot/joel/001/003.yaml
  text: Tell your children about it[a], and let your children tell their children, and their children tell another generation.
translation:
  language: ru
  text: Расскажите об этом своим детям[a], и пусть ваши дети расскажут своим детям, а их дети — последующему поколению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вашим сыновьям… их сыновьям… их сыновья»; здесь употреблено слово «дети», поскольку речь идёт о передаче памяти последующим поколениям в целом, а не только потомкам мужского пола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיהָ
  choice: об этом
  rationale: Предлог עַל с местоименным суффиксом женского рода отсылает к ранее описанному бедствию; по-русски естественно передать эту ссылку нейтральным «об этом».
- source_word: לִבְנֵיכֶם
  choice: своим детям
  rationale: בנים может означать как сыновей, так и детей вообще; в контексте передачи памяти из поколения в поколение уместно обобщающее «детям». Возвратное «своим» естественно соотносит детей с адресатами повеления.
- source_word: סַפֵּרוּ
  choice: Расскажите
  rationale: Форма пиэль, повелительное наклонение множественного числа, выражает призыв намеренно пересказать событие; «расскажите» точно и естественно передаёт этот смысл.
- source_word: וּבְנֵיכֶם לִבְנֵיהֶם
  choice: а ваши дети пусть расскажут своим детям
  rationale: В еврейском последующие звенья цепи эллиптически продолжают глагол «рассказывать». В русском его восстановление делает связь ясной, а конструкция с «пусть» сохраняет побудительную силу.
- source_word: וּבְנֵיהֶם
  choice: и те
  rationale: Местоименное «те» избегает тяжеловесного повтора «их дети», при этом однозначно обозначает третье названное поколение.
- source_word: לְדוֹר אַחֵר
  choice: следующему поколению
  rationale: Буквально — «другому поколению», то есть последующему по отношению к уже названным. В данной цепочке русское «следующему поколению» звучит естественно и сохраняет последовательность передачи.
