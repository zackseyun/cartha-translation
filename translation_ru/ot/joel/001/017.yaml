base_translation:
  language: en
  yaml_path: translation/ot/joel/001/017.yaml
  text: The seeds have shriveled beneath their clods[a]; the storehouses are desolate, the granaries are torn down[b], because the grain has dried up.
translation:
  language: ru
  text: Семена сморщились под комьями земли[a]; хранилища пришли в запустение, разрушены зернохранилища, потому что засохло зерно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские слова, переведённые как «семена» и «комья земли», редки и не вполне ясны. Возможны также значения «зёрна» и «борозды»; последнее слово иногда понимают как «мотыги» или «лопаты».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְשׁוּ
  choice: сморщились
  rationale: Глагол указывает на высыхание и сморщивание; это естественно описывает семена, погибшие в сухой почве.
- source_word: פְרֻדוֹת
  choice: семена
  rationale: Редкое и не вполне ясное существительное, вероятнее всего, обозначает семенные зёрна; «семена» понятно современному читателю и не создаёт лишней конкретики.
- source_word: תַּחַת מֶגְרְפֹתֵיהֶם
  choice: под комьями земли
  rationale: Смысл редкого слова מֶגְרְפֹתֵיהֶם спорен. В земледельческом контексте сочетание естественно понимать как указание на комья почвы, под которыми лежат семена.
- source_word: נָשַׁמּוּ אֹצָרוֹת
  choice: опустели хранилища
  rationale: В данном аграрном контексте אֹצָרוֹת — помещения для хранения урожая, а נָשַׁמּוּ описывает их запустение вследствие неурожая.
- source_word: נֶהֶרְסוּ מַמְּגֻרוֹת
  choice: разрушены зернохранилища
  rationale: מַמְּגֻרוֹת обозначает сооружения для хранения зерна, а נֶהֶרְסוּ — их разрушение или разборку.
- source_word: כִּי הֹבִישׁ דָּגָן
  choice: потому что засохло зерно
  rationale: כִּי вводит причину. הֹבִישׁ в контексте гибели урожая передаёт высыхание и неудачу посева; «засохло» сохраняет конкретный земледельческий образ.
