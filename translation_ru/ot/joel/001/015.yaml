lexical_decisions:
- source_word: אֲהָהּ לַיּוֹם
  choice: Увы, что за день!
  rationale: Междометие передаёт скорбь и тревогу, а идиоматическая русская конструкция естественно выражает плач по поводу наступающего дня.
- source_word: קָרוֹב יוֹם יְהוָה
  choice: Близок день Яхве
  rationale: Предикативное «близок» передаёт близость и неотвратимость дня; личное имя יהוה сохранено как «Яхве».
- source_word: וּכְשֹׁד
  choice: и придёт он, словно разорение
  rationale: שֹׁד означает насильственное разорение, опустошение или гибель; «словно» сохраняет сравнительную силу כְּ.
- source_word: מִשַׁדַּי
  choice: от Всемогущего
  rationale: Предлог מִן указывает на источник, а традиционное смысловое соответствие «Всемогущий» ясно передаёт титул שַׁדַּי; его еврейская форма отмечена в сноске ради игры слов.
- source_word: יָבֹוא
  choice: придёт
  rationale: Имперфект здесь естественно выражает близкое будущее; будущее время по-русски подчёркивает грядущее событие без ослабления его уверенности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Связь שֹׁד и שַׁדַּי
  choice: разорение от Всемогущего
  alternative: разорение от Шаддая
  rationale: Основной текст передаёт смысл обоих слов естественным русским языком, а созвучие и форма имени Шаддай сохраняются в сноске, поскольку равноценную игру слов по-русски воспроизвести невозможно.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Междометие «увы» сохраняет интонацию плача; синтаксис остаётся ясным для широкого круга читателей.
