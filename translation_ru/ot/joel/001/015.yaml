  source_fidelity: 'Вторая часть точно передаёт структуру и смысл еврейского текста: близость дня Яхве и его приход «как разорение от Всемогущего». Имя יהוה последовательно передано как «Яхве», а שַׁדַּי — как «Всемогущий». Однако «что за день» в современном русском обычно является разговорным оценочным восклицанием и не столь ясно выражает плачевное «увы о дне» (אֲהָהּ לַיּוֹם).'
