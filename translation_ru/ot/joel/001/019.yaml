  source_fidelity: 'Текст точно передаёт еврейский оригинал: обращение к Яхве, призыв пророка, причинную связь и две завершённые картины уничтожения — огонь «пожрал» пастбища и пламя «опалило» деревья. Русские прошедшие формы уместно передают еврейские перфекты. «Пастбища пустыни» корректно отражает נְאוֹת מִדְבָּר как пастбищные угодья степной/пустынной местности, не сужая значение до песчаной пустыни.'
