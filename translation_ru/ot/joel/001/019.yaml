  text: אֵלֶ֥י/ךָ יְהוָ֖ה אֶקְרָ֑א כִּ֣י אֵ֗שׁ אָֽכְלָה֙ נְא֣וֹת מִדְבָּ֔ר וְ/לֶ֣הָבָ֔ה לִהֲטָ֖ה כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/019.yaml
  text: To you[a], O Yahweh, I call, for fire has devoured the pastures of the wilderness[c][b], and flame has scorched all the trees of the field.
translation:
  language: ru
  text: К Тебе, Яхве[a], я взываю, потому что огонь пожрал пастбища пустыни, и пламя опалило все деревья в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ»; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: К Тебе
  rationale: Предлог אֶל с суффиксом 2-го лица мужского рода единственного числа указывает, к кому обращён призыв; «К Тебе» естественно по-русски и сохраняет направленность обращения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֶקְרָא
  choice: я взываю
  rationale: Qal imperfect 1-го лица единственного числа от קרא в молитвенном плаче выражает призыв о помощи; «взываю» естественно и передаёт напряжённость контекста.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание для обращения пророка; современная и ясная причинная связь.
- source_word: אֵשׁ אָכְלָה
  choice: огонь пожрал
  rationale: Глагол אכל буквально связан с поеданием и образно описывает разрушительное действие огня; «пожрал» сохраняет яркость метафоры.
- source_word: נְאוֹת מִדְבָּר
  choice: пастбища пустыни
  rationale: נְאוֹת здесь обозначает места выпаса, а מִדְבָּר — безлюдную открытую местность; краткое буквальное сочетание понятно в контексте бедствия.
- source_word: וְלֶהָבָה
  choice: и пламя
  rationale: Сохраняет параллельный образ второй поэтической строки.
- source_word: לִהֲטָה
  choice: опалило
  rationale: Глагол להט обозначает обжигающее действие пламени; «опалило» передаёт этот оттенок и не дублирует «пожрал».
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: все деревья в поле
  rationale: Передаёт совокупность деревьев на открытой земле; русское «деревья в поле» звучит естественнее буквального «деревья поля».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Образность еврейского текста сохранена без архаизмов; синтаксис сделан естественным для чтения вслух.
