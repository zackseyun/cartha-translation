base_translation:
  language: en
  yaml_path: translation/ot/joel/001/002.yaml
  text: 'Hear this[a], you elders, and give ear, all inhabitants of the land: Has this happened in your days[b], or in the days of your fathers?'
translation:
  language: ru
  text: 'Слушайте это, старейшины, и внимайте, все жители страны[a]: бывало ли такое в ваши дни или во дни ваших отцов[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все жители земли» или «все жители мира». Еврейское слово может означать как определённую страну, так и землю вообще; здесь ближайшему контексту лучше соответствует первое значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ваших предков». Буквально: «ваших отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Слушайте это
  rationale: Множественное повелительное наклонение и прямое дополнение переданы ясно и естественно; «слушайте» сохраняет призыв услышать весть.
- source_word: הַזְּקֵנִים
  choice: старейшины
  rationale: Слово может обозначать пожилых мужчин и старейшин общины; в пророческом обращении «старейшины» сохраняет возрастной и общественный оттенки.
- source_word: וְהַאֲזִינוּ
  choice: и внимайте
  rationale: Более выразительный глагол отличён от שׁמע и передаёт призыв сосредоточенно прислушаться, сохраняя поэтический параллелизм.
- source_word: כֹּל יוֹשְׁבֵי הָאָרֶץ
  choice: все жители земли
  rationale: В ближайшем контексте речь, вероятнее всего, идёт о земле Иудеи; «жители земли» естественно передаёт собирательное выражение, а более широкое значение отмечено в сноске.
- source_word: הֶהָיְתָה זֹּאת
  choice: бывало ли такое
  rationale: Русский идиоматический вопрос точно передаёт выяснение, случалось ли подобное прежде, без неестественной буквальности.
- source_word: בִּימֵיכֶם
  choice: в ваши дни
  rationale: Сохранён древнееврейский временной оборот, понятный и уместный в литературном русском языке.
- source_word: וְאִם
  choice: или
  rationale: В вопросе сочетание вводит вторую сопоставляемую возможность, а не реальное условие.
- source_word: בִּימֵי אֲבֹתֵיכֶם
  choice: во дни ваших отцов
  rationale: Передано буквально и торжественно, с сохранением мужского множественного אבות; возможное более широкое «предков» отмечено в сноске.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: земли
  alternative: всей земли / мира
  rationale: Контекст обращения к старейшинам и местным жителям поддерживает значение конкретной страны, вероятно Иудеи. Возможный более широкий смысл еврейского слова сохранён в сноске.
- issue: Передача אֲבֹתֵיכֶם
  choice: ваших отцов
  alternative: ваших предков
  rationale: Основной текст сохраняет явную форму мужского рода и межпоколенческое сопоставление; «предков» возможно по смыслу и указано в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Пара «слушайте — внимайте» сохраняет риторический параллелизм; оборот «во дни» выбран ради достоинства и ритма, оставаясь понятным современному читателю.
