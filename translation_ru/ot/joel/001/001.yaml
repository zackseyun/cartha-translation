  text: דְּבַר יְהוָה֙ אֲשֶׁ֣ר הָיָ֔ה אֶל יוֹאֵ֖ל בֶּן פְּתוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/001.yaml
  text: The word of Yahweh that came to Joel son of Pethuel[a][b].
translation:
  language: ru
  text: Слово Яхве, которое пришло к Иоилю, сыну Петуила[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Весть Яхве, которая пришла к Иоилю, сыну Петуила».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: יהוה (ЙХВХ); традиционно переводится как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר
  choice: слово
  rationale: Сохраняет устойчивую пророческую формулу «слово Яхве» и формальную связь с исходным словом; «весть» яснее передаёт функцию, но несколько сильнее истолковывает выражение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое пришло к
  rationale: Естественно по-русски передаёт обычную древнееврейскую формулу получения пророческого откровения, не воспроизводя буквально конструкцию «которое было к».
- source_word: יוֹאֵל
  choice: Иоиль
  rationale: Традиционная русская форма библейского личного имени.
- source_word: בֶּן
  choice: сыну
  rationale: В сочетании «к Иоилю, сыну Петуила» естественно передаёт родственное обозначение без добавления отсутствующего в оригинале определения.
- source_word: פְּתוּאֵל
  choice: Петуил
  rationale: Традиционная русская форма библейского личного имени.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале непосредственно употреблён тетраграмматон. Форма «Яхве» сохраняет личное имя и не подменяет его титулом; примечание указывает традиционный вариант.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и лаконичности пророческой вводной формулы. Оборот «пришло к» выбран вместо архаичного буквального «было к»; имена переданы в традиционных русских библейских формах.
