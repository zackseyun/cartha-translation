  text: קַדְּשׁוּ צוֹם֙ קִרְא֣וּ עֲצָרָ֔ה אִסְפ֣וּ זְקֵנִ֗ים כֹּ֚ל יֹשְׁבֵ֣י הָ/אָ֔רֶץ בֵּ֖ית יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/זַעֲק֖וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/014.yaml
  text: Consecrate a fast; call a solemn assembly. Gather the elders[a], all the inhabitants of the land, to the house of Yahweh your God, and cry out to Yahweh.
translation:
  language: ru
  text: Освятите пост, созовите торжественное собрание. Соберите старейшин и всех жителей страны[a] в доме Яхве, вашего Бога, и воззовите к Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех жителей земли». Еврейское слово может означать как определённую страну или край, так и землю в более широком смысле; здесь призыв собраться в храме указывает, вероятнее всего, на местное значение.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Освятите
  rationale: Императив קדשׁ означает посвятить пост священной цели; «освятите» сохраняет религиозно-культовый смысл и звучит естественно в данном контексте.
- source_word: צוֹם
  choice: пост
  rationale: Обычное соответствие существительному צוֹם, обозначающему воздержание от пищи как религиозное действие.
- source_word: קִרְאוּ עֲצָרָה
  choice: созовите торжественное собрание
  rationale: קרא здесь выражает призыв собраться, а עֲצָרָה — особо назначенное собрание для поклонения; сочетание передаёт и действие, и серьёзный священный характер события.
- source_word: אִסְפוּ זְקֵנִים
  choice: Соберите старейшин
  rationale: זקנים в общественном контексте естественнее понимать как старейшин — признанных руководителей общины, а не просто пожилых мужчин.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: всех жителей страны
  rationale: Причастная конструкция означает всех проживающих на данной территории. В храмовом и общенародном контексте Иудеи местное значение «страна» вероятнее универсального «земля».
- source_word: בֵּית יְהוָה אֱלֹהֵיכֶם
  choice: в доме Яхве, вашего Бога
  rationale: Хотя отдельного предлога перед בֵּית нет, эта группа указывает место, где следует собрать народ. Русское «в доме» естественно передаёт место собрания; приложение «вашего Бога» сохраняет обращение во втором лице множественного числа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, представленное тетраграмматоном יהוה, передано транслитерацией «Яхве», а не заменено титулом.
- source_word: וְזַעֲקוּ אֶל יְהוָה
  choice: и воззовите к Яхве
  rationale: זעק обозначает настойчивый крик о помощи или мольбу в бедствии. «Воззовите» сохраняет силу и молитвенную направленность выражения без сведения его к нейтральному «помолитесь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное заветное имя Бога. Транслитерация сохраняет имя и не подменяет его титулом.
- issue: Объём значения הָאָרֶץ
  choice: страны
  alternative: земли; всей земли
  rationale: Призыв обращён к местному сообществу и сосредоточен на доме Яхве, поэтому контекст поддерживает значение страны или края. Возможное более широкое значение сохранено в примечании.
- issue: Место или направление в выражении בֵּית יְהוָה
  choice: в доме Яхве
  alternative: в дом Яхве
  rationale: В еврейском тексте предлог отсутствует, и синтаксис допускает понимание храма как места итогового собрания либо его направления. Основной текст выбирает естественное русское обозначение места, не изменяя сути призыва.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Краткая цепочка повелений сохранена; архаизирующее «воззовите» оставлено как уместное и общеупотребительное в молитвенном контексте.
