  text: הֲ/ל֛וֹא נֶ֥גֶד עֵינֵ֖י/נוּ אֹ֣כֶל נִכְרָ֑ת מִ/בֵּ֥ית אֱלֹהֵ֖י/נוּ שִׂמְחָ֥ה וָ/גִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/016.yaml
  text: Is not food cut off before our eyes[b][a], joy and gladness from the house of our God?
translation:
  language: ru
  text: Не на наших ли глазах отнята пища, а из дома нашего Бога — радость и ликование?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из храма нашего Бога». Буквально по-еврейски: «из дома нашего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Не … ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественной русской конструкцией.
- source_word: נֶגֶד עֵינֵינוּ
  choice: на наших глазах
  rationale: Естественный русский фразеологизм, сохраняющий смысл явного и непосредственно наблюдаемого бедствия.
- source_word: אֹכֶל
  choice: пища
  rationale: Общее обозначение еды, не ограниченное хлебом; соответствует контексту гибели сельскохозяйственных плодов.
- source_word: נִכְרָת
  choice: отнята
  rationale: В данном контексте передаёт прекращение доступа к пище; буквальное «отсечена» по-русски звучало бы неестественно применительно к пище.
- source_word: מִבֵּית אֱלֹהֵינוּ
  choice: из дома нашего Бога
  rationale: Сохраняет буквальный образ еврейского текста; по контексту речь идёт о храме.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Прямой и естественный эквивалент первого существительного поэтической пары.
- source_word: וָגִיל
  choice: и ликование
  rationale: Передаёт более выраженный оттенок торжествующей, открыто проявляемой радости и сохраняет поэтическую пару близких понятий.
theological_decisions:
- issue: Синтаксическая сфера риторического вопроса и пропущенный глагол во второй части
  choice: Риторический вопрос охватывает обе утраты; во второй части глагольная идея «отнята» подразумевается, но по-русски передана эллиптически тире.
  alternative: 'Повторить глагол: «а из дома нашего Бога отняты радость и ликование?»'
  rationale: Еврейская поэзия допускает отсутствие повторного глагола. Русская эллиптическая конструкция сохраняет параллелизм и ясно показывает, что исчезли как пища, так и радость богослужебного празднования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Конструкция «Не на наших ли глазах…» сохраняет риторическую силу; «дом нашего Бога» оставляет исходную метафору, а храмовое значение указано в сноске.
