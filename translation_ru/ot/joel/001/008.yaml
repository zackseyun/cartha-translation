lexical_decisions:
- source_word: אֱלִי
  choice: Рыдай
  rationale: Форма повелительного наклонения женского рода единственного числа призывает к громкому, слышимому плачу; «рыдай» естественно передаёт силу пророческого призыва.
- source_word: כִּבְתוּלָה
  choice: как дева
  rationale: Префикс כְּ выражает сравнение, а בְּתוּלָה обычно означает деву. Это сохраняет образ и его намеренную поэтическую напряжённость.
- source_word: חֲגֻרַת שַׂק
  choice: опоясанная вретищем
  rationale: Передаёт буквальный образ «опоясанная [тканью]» и состояние скорбящей женщины. Более общеупотребительное «одетая во вретище» приведено в примечании.
- source_word: שַׂק
  choice: вретище
  rationale: Устоявшееся русское библейское обозначение грубой ткани, которую надевали в знак скорби; слово сохраняет достоинство и узнаваемость образа.
- source_word: עַל
  choice: о
  rationale: В контексте плача предлог вводит объект или причину скорби; русское «рыдать о ком-либо» звучит естественно.
- source_word: בַּעַל
  choice: муж
  rationale: В сочетании с «своей юности» слово обозначает супруга. Возможное понимание как жениха или суженого не внесено в основной текст, чтобы не снимать неоднозначность образа.
- source_word: נְעוּרֶיהָ
  choice: своей юности
  rationale: Зависимая конструкция характеризует мужа, с которым связана её молодость; возвратное местоимение естественно указывает на субъект женского рода.
theological_decisions:
- issue: Образ девы и мужа её юности
  choice: Сохранить в основном тексте оба элемента еврейского образа без согласующего пояснения.
  alternative: Передать בַּעַל как «жених» или перефразировать образ как плач молодой невесты о женихе.
  rationale: Еврейская поэзия оставляет культурно и смыслово сжатое сочетание «дева» и «муж её юности». Перевод не должен устранять эту напряжённость за счёт неявного толкования.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой речи. «Вретище» — традиционный, но понятный библейский термин; «опоясанная» точно удерживает телесный образ исходного текста. Маркеры примечаний поставлены непосредственно после соответствующего образа.
