  text: הַ/גֶּ֣פֶן הוֹבִ֔ישָׁה וְ/הַ/תְּאֵנָ֖ה אֻמְלָ֑לָה רִמּ֞וֹן גַּם תָּמָ֣ר וְ/תַפּ֗וּחַ כָּל עֲצֵ֤י הַ/שָּׂדֶה֙ יָבֵ֔שׁוּ כִּֽי הֹבִ֥ישׁ שָׂשׂ֖וֹן מִן בְּנֵ֥י אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/012.yaml
  text: The vine has dried up[a], and the fig tree has withered; the pomegranate, also the palm and the apple tree—all the trees of the field have dried up. Indeed[b], joy has dried up from the sons of man.
translation:
  language: ru
  text: 'Виноградная лоза засохла,

    смоковница увяла;

    гранатовое дерево, финиковая пальма и яблоня[a] —

    все деревья в поле засохли.

    Ибо радость

    иссякла у людей[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, «абрикосовое дерево»; точный вид растения, обозначаемого еврейским словом «таппуах», неизвестен.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от сынов человека»; то есть от людей, от человечества.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: виноградная лоза
  rationale: Передаёт культурную виноградную лозу и естественно звучит в русском перечне плодовых деревьев и растений.
- source_word: הוֹבִישָׁה
  choice: засохла
  rationale: В земледельческом контексте форма обозначает высыхание растения, а не стыд; совершенный вид выражает наступившее бедствие.
- source_word: הַתְּאֵנָה
  choice: смоковница
  rationale: Традиционное и литературно понятное русское название фигового дерева.
- source_word: אֻמְלָלָה
  choice: увяла
  rationale: Передаёт ослабление и увядание растения, сохраняя отличие от повторяющегося глагола «засохнуть».
- source_word: רִמּוֹן
  choice: гранатовое дерево
  rationale: В перечне растений явно подразумевается дерево, поэтому развёрнутое название устраняет возможное понимание как плода.
- source_word: תָּמָר
  choice: финиковая пальма
  rationale: Уточняет наиболее вероятный вид пальмы и остаётся общеупотребительным названием.
- source_word: תַפּוּחַ
  choice: яблоня
  rationale: Это традиционное и наиболее узнаваемое соответствие; неопределённость точного ботанического вида отмечена в сноске.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: все деревья в поле
  rationale: Естественно передаёт всеохватность выражения и сохраняет полевой образ.
- source_word: יָבֵשׁוּ
  choice: засохли
  rationale: Повторение того же русского корня поддерживает накопительный эффект картины засухи.
- source_word: כִּי
  choice: да
  rationale: Здесь частица вводит подчёркнутое итоговое утверждение; «да» естественно передаёт подтверждающе-эмфатическую силу, не навязывая строго причинного отношения.
- source_word: הֹבִישׁ
  choice: засохла
  rationale: Намеренное повторение земледельческого образа применительно к радости сохраняет поэтическую связь между гибелью растений и человеческим горем.
theological_decisions:
- issue: Передача אָדָם в обобщающем выражении בְּנֵי אָדָם
  choice: сыны человеческие
  alternative: люди / человечество
  rationale: Основной текст сохраняет образную форму исходного выражения, обозначающего человеческий род, а сноска поясняет его обобщающий смысл, чтобы выражение не было понято как относящееся только к мужчинам.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Строки сохраняют перечисление, параллелизм и повтор образа высыхания; «сыны человеческие» оставлено как прозрачное библейское выражение и разъяснено в сноске.
