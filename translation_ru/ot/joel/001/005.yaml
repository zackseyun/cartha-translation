base_translation:
  language: en
  yaml_path: translation/ot/joel/001/005.yaml
  text: Wake up[a], you drunkards, and weep; wail, all you drinkers of wine, over the sweet wine, because it has been cut off from your mouth.
translation:
  language: ru
  text: Очнитесь, пьяницы, и плачьте! Вопите, все, кто пьёт вино, о сладком вине[a], ибо оно отнято от ваших уст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о молодом вине», «о свежем вине» или «о сусле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָקִיצוּ
  choice: Пробудитесь
  rationale: Повелительное множественного числа означает пробуждение от сна или оцепенения; «пробудитесь» сохраняет силу пророческого призыва и уместный возвышенный регистр.
- source_word: שִׁכּוֹרִים
  choice: пьяницы
  rationale: Форма употреблена как обращение и характеризует людей по пьянству; прямое «пьяницы» передаёт резкость обличения.
- source_word: וּבְכוּ
  choice: и плачьте
  rationale: Обычный глагол плача и скорби; выбран естественный русский эквивалент.
- source_word: וְהֵילִלוּ
  choice: Рыдайте
  rationale: Глагол обозначает громкий скорбный вопль; «рыдайте» усиливает предыдущее «плачьте», не привнося животного оттенка слова «войте».
- source_word: כָּל שֹׁתֵי יָיִן
  choice: все, кто пьёт вино
  rationale: Причастный оборот обозначает людей, характеризуемых употреблением вина; русская конструкция естественна и сохраняет обращение.
- source_word: עַל
  choice: о
  rationale: Предлог вводит предмет или причину плача; «рыдать о» естественно связывает скорбь с утратой вина.
- source_word: עָסִיס
  choice: сладком вине
  rationale: Слово обозначает свежий виноградный напиток, сусло или молодое сладкое вино. «Сладкое вино» понятно современному читателю, а неоднозначность отмечена в сноске.
- source_word: נִכְרַת
  choice: его отняли
  rationale: Нифаль от כרת буквально выражает отсечение или устранение. В данном образе «отняли» естественно передаёт прекращение доступа, сохраняя результативность перфекта.
- source_word: מִפִּיכֶם
  choice: у ваших уст
  rationale: Сохраняется телесный образ внезапно отнятого питья; «у уст» в сочетании с «отняли» звучит естественнее буквального «из вашего рта».
