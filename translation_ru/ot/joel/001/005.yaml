  source_fidelity: 'Основной смысл передан верно: обращение к пьяницам, два повеления скорби, предмет плача и утрата напитка сохранены. Однако «его отняли» вводит неопределённого деятеля, которого в страдательной форме נִכְרַת нет; предпочтительнее результативная безлично-страдательная формулировка. Альтернатива «свежий виноградный сок» слишком сужает и может исключать винный характер עָסִיס.'
