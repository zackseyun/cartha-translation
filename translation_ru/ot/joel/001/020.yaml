base_translation:
  language: en
  yaml_path: translation/ot/joel/001/020.yaml
  text: Even the beasts of the field pant for you[a], because the channels of water have dried up[c][b], and fire has consumed the pastures of the wilderness.
translation:
  language: ru
  text: Даже полевые звери томятся по Тебе[a], потому что пересохли русла потоков[b] и огонь пожрал пастбища пустыни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тянутся к Тебе»; глагол может обозначать жаждущее, мучительное стремление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «водные потоки».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть пастбища в необрабатываемой открытой местности; возможный перевод: «степные пастбища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Даже
  rationale: 'Начальная частица подчёркивает, что бедствие затронуло не только людей: даже животные устремляются к Богу.'
- source_word: בַּהֲמוֹת שָׂדֶה
  choice: полевые звери
  rationale: Сочетание обозначает животных открытой местности в целом, а не только домашний скот; эта формулировка естественна для современного русского библейского стиля.
- source_word: תַּעֲרֹג אֵלֶיךָ
  choice: тянутся к Тебе
  rationale: Глагол передаёт томительное стремление, связанное здесь с жаждой, а предлог сохраняет направленность к Богу. Формулировка не сводит образ ни только к физическому учащённому дыханию, ни только к молитвенному воззванию.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину отчаянного стремления животных к Богу.
- source_word: יָבְשׁוּ אֲפִיקֵי מָיִם
  choice: пересохли русла потоков
  rationale: אֲפִיקִים — русла, водотоки или потоки; «русла потоков» ясно передаёт, что доступные водные потоки иссякли.
- source_word: וְאֵשׁ אָכְלָה
  choice: и огонь пожрал
  rationale: Буквальный образ огня, который «ест», естественно и выразительно передаётся русским глаголом «пожрал».
- source_word: נְאוֹת הַמִּדְבָּר
  choice: пастбища пустыни
  rationale: נְאוֹת в данном контексте означает места выпаса, а מִדְבָּר — необрабатываемую засушливую открытую местность; перевод сохраняет оба элемента образа.
theological_decisions:
- issue: К кому направлено действие в אֵלֶיךָ
  choice: К Богу («к Тебе»)
  alternative: Понимать выражение лишь как безличное томление животных от жажды
  rationale: Местоименный суффикс второго лица единственного числа прямо указывает на адресата, а предшествующий стих представляет речь как обращение к Богу. При этом «тянутся» сохраняет образ зависимости и не уточняет, является ли это сознательной молитвой животных.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Заглавная буква в «Тебе» ясно обозначает обращение к Богу. «Пожрал» сохраняет олицетворяющую силу еврейской идиомы, а примечания отмечают реальные лексические варианты без перегрузки основного текста.
