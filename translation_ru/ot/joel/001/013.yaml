  text: חִגְר֨וּ וְ/סִפְד֜וּ הַ/כֹּהֲנִ֗ים הֵילִ֨ילוּ֙ מְשָׁרְתֵ֣י מִזְבֵּ֔חַ בֹּ֚אוּ לִ֣ינוּ בַ/שַּׂקִּ֔ים מְשָׁרְתֵ֖י אֱלֹהָ֑/י כִּ֥י נִמְנַ֛ע מִ/בֵּ֥ית אֱלֹהֵי/כֶ֖ם מִנְחָ֥ה וָ/נָֽסֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/013.yaml
  text: Gird yourselves and mourn[a], O priests; wail, you ministers of the altar. Come, spend the night in sackcloth, you ministers of my God[b], because grain offering and drink offering are withheld from the house of your God.
translation:
  language: ru
  text: Препояшьтесь и скорбите[a], священники! Рыдайте, служители жертвенника! Придите, проведите ночь во вретище, служители моего Бога, потому что хлебное приношение и возлияние не поступают в дом вашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «препояшьтесь». В данном контексте речь идёт о приготовлении к трауру; далее прямо упомянуто вретище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ
  choice: Препояшьтесь
  rationale: Сохраняет буквальный образ еврейского повеления и не вводит слово «вретище» раньше его явного появления далее в стихе; контекст указывает на приготовление к трауру.
- source_word: וְסִפְדוּ
  choice: и скорбите
  rationale: Передаёт обрядовую и эмоциональную скорбь, сохраняя отличие от более сильного הֵילִילוּ — «рыдайте».
- source_word: הֵילִילוּ
  choice: Рыдайте
  rationale: Выражает громкий, напряжённый плач и усиливает предыдущее «скорбите».
- source_word: מְשָׁרְתֵי מִזְבֵּחַ
  choice: служители жертвенника
  rationale: Естественно и точно обозначает священническое служение при жертвеннике.
- source_word: לִינוּ בַשַּׂקִּים
  choice: проведите ночь во вретище
  rationale: לִינוּ означает остаться на ночь, а «вретище» — традиционное и понятное в библейском регистре обозначение грубой траурной одежды; еврейское множественное число передано русским собирательным употреблением.
- source_word: מְשָׁרְתֵי אֱלֹהָי
  choice: служители моего Бога
  rationale: Сохраняет первое лицо пророка и его риторическое отличие от последующего «вашего Бога».
- source_word: נִמְנַע
  choice: прекратились
  rationale: В контексте храмового богослужения передаёт прекращение поступления и совершения приношений; согласуется с составным подлежащим во множественном числе.
- source_word: מִנְחָה וָנָסֶךְ
  choice: хлебное приношение и возлияние
  rationale: מִנְחָה здесь обозначает растительное, прежде всего зерновое, приношение; «хлебное приношение» является ясным культовым термином, а «возлияние» точно передаёт נֶסֶךְ.
- source_word: מִבֵּית אֱלֹהֵיכֶם
  choice: в доме вашего Бога
  rationale: В русском при глаголе «прекратились» исходное מִן естественно передаётся указанием места «в доме»; «дом» сохраняет образ оригинала без замены на толковательное «храм».
theological_decisions:
- issue: Различие אֱלֹהָי / אֱלֹהֵיכֶם
  choice: Сохранить «моего Бога» и «вашего Бога»
  alternative: Сгладить оба выражения как «нашего Бога»
  rationale: Смена лица присутствует в еврейском тексте и создаёт риторическое напряжение между речью пророка и ответственностью священников; её не следует устранять.
- issue: Значение מִבֵּית применительно к приношениям
  choice: «в доме вашего Бога» при глаголе «прекратились»
  alternative: «удержаны от дома вашего Бога» или «не поступают в дом вашего Бога»
  rationale: Перевод сохраняет факт прекращения храмовых приношений, не решая сверх текста, вызвано ли это отсутствием продуктов, невозможностью обряда или иной причиной.
translation_notes:
  register: Современный литературный русский с возвышенным пророческим ритмом. Формы «препояшьтесь», «жертвенник» и «вретище» сохранены как понятные библейские термины; синтаксис сделан прямым и энергичным. Единственный маркер [a] стоит непосредственно после поясняемого выражения.
