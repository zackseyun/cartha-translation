  text: שֻׁדַּ֣ד שָׂדֶ֔ה אָבְלָ֖ה אֲדָמָ֑ה כִּ֚י שֻׁדַּ֣ד דָּגָ֔ן הוֹבִ֥ישׁ תִּיר֖וֹשׁ אֻמְלַ֥ל יִצְהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/010.yaml
  text: The field is devastated; the ground mourns[a], for the grain is devastated, the new wine has dried up, the oil has failed.
translation:
  language: ru
  text: Поле разорено, земля скорбит, потому что зерно погублено, молодое вино иссякло, масло оскудело.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁדַּד
  choice: разорено / погублен
  rationale: Страдательная форма от שׁדד передаёт насильственное опустошение. В первом полустишии «разорено» естественно сочетается с полем; во втором «погублен» избегает тяжеловесного повтора, сохраняя силу образа.
- source_word: שָׂדֶה
  choice: поле
  rationale: Основное значение слова; единственное число сохранено как собирательный поэтический образ.
- source_word: אָבְלָה
  choice: скорбит
  rationale: Глагол означает скорбеть, оплакивать. Перевод сохраняет олицетворение земли, не сводя образ к физическому высыханию.
- source_word: אֲדָמָה
  choice: земля
  rationale: В данном параллелизме обозначает почву, землю и естественно отличается от «поля».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину скорби земли и выражает причинную связь ясно для современного читателя.
- source_word: דָּגָן
  choice: хлеб
  rationale: В библейском поэтическом контексте «хлеб» естественно обозначает зерновой урожай; здесь это не готовая буханка, а хлебные злаки как основная продукция земли.
- source_word: הוֹבִישׁ
  choice: иссякло
  rationale: В сельскохозяйственном контексте форма от יבש указывает на высыхание и исчезновение запаса; «иссякло» естественно сочетается с молодым вином и передаёт результат.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Термин обозначает свежий продукт винограда, молодое вино или сусло, а не вино вообще.
- source_word: אֻמְלַל
  choice: оскудело
  rationale: Глагол передаёт увядание, истощение или утрату силы. С маслом «оскудело» естественно выражает нехватку урожая и запасов.
- source_word: יִצְהָר
  choice: масло
  rationale: Слово обозначает свежее растительное масло, обычно оливковое, в устойчивой триаде «хлеб, молодое вино и масло». Контекст позволяет не перегружать основной текст уточнением.
