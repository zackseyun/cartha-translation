  text: שָׂ֤ם גַּפְנִ/י֙ לְ/שַׁמָּ֔ה וּ/תְאֵנָתִ֖/י לִ/קְצָפָ֑ה חָשֹׂ֤ף חֲשָׂפָ/הּ֙ וְ/הִשְׁלִ֔יךְ הִלְבִּ֖ינוּ שָׂרִיגֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/007.yaml
  text: It has made my vine a desolation and my fig tree splinters[a]; it has stripped it bare and thrown it down[b]; its branches have turned white.
translation:
  language: ru
  text: 'Он превратил мою виноградную лозу в пустошь,

    а мою смоковницу — в обломки[a];

    ободрал её догола и бросил наземь;

    побелели её ветви[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в щепы» либо «в обрубок». Еврейское слово встречается редко и обозначает разбитые, обломанные остатки; точный образ неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «побелели её побеги (или усики)» — вероятно, потому что после снятия коры обнажилась светлая древесина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם ... לְשַׁמָּה
  choice: превратил ... в пустошь
  rationale: Конструкция שׂים с לְ выражает приведение к результату; «превратил ... в пустошь» сохраняет образ полного опустошения и именную форму שַׁמָּה.
- source_word: גַּפְנִי
  choice: мою виноградную лозу
  rationale: גֶּפֶן означает именно лозу, а не весь виноградник; определение «виноградную» делает русское обозначение растения однозначным.
- source_word: וּתְאֵנָתִי
  choice: а мою смоковницу
  rationale: תְּאֵנָה обозначает смоковницу. Союз передан как «а», чтобы естественно связать параллельные части стиха без усиления противопоставления.
- source_word: לִקְצָפָה
  choice: в обломки
  rationale: Редкое существительное описывает разрушенные или отколотые остатки. «Обломки» передаёт результат сокрушения, не сводя неоднозначный образ исключительно к щепкам или пню.
- source_word: חָשֹׂף חֲשָׂפָהּ
  choice: ободрал её догола
  rationale: Инфинитив абсолютный с личной формой усиливает действие. Выражение «ободрал ... догола» естественно передаёт полное снятие коры.
- source_word: וְהִשְׁלִיךְ
  choice: и бросил наземь
  rationale: Глагол שלך означает бросить или отбросить. «Бросил наземь» передаёт насильственное низвержение в контексте погубленного дерева, не уточняя сверх текста, что именно было отброшено отдельно от дерева.
- source_word: הִלְבִּינוּ שָׂרִיגֶיהָ
  choice: побелели её ветви
  rationale: Форма הִלְבִּינוּ указывает на ставшее белым состояние, а שָׂרִיגֶיהָ может обозначать ветви, побеги или усики. «Ветви» понятно современному читателю и согласуется со смоковницей; вероятный образ — обнажившаяся после снятия коры древесина.
theological_decisions:
- issue: Принадлежность лозы и смоковницы говорящему
  choice: 'Сохранено первое лицо: «мою ... мою»'
  alternative: Устранить притяжательность или пояснить, что растения принадлежат Господу
  rationale: Еврейские суффиксы первого лица существенны для плача говорящего; текст стиха не следует расширять богословским пояснением личности говорящего.
- issue: Род и референт действующего лица
  choice: «Он» с мужским родом и без поясняющего существительного
  alternative: «Этот народ» или «саранча»
  rationale: Еврейский глагол стоит в мужском роде единственного числа и отсылает к образу народа из предыдущего стиха. Местоимение сохраняет связь с контекстом и не разрешает образ в пользу одного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены поэтический параллелизм, краткие энергичные глаголы и неоднозначность редкой лексемы; архаизмы и конфессионально маркированные пояснения не добавлялись.
