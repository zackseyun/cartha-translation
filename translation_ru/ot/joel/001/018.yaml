source:
  edition: WLC
  text: מַה נֶּאֶנְחָ֣ה בְהֵמָ֗ה נָבֹ֨כוּ֙ עֶדְרֵ֣י בָקָ֔ר כִּ֛י אֵ֥ין מִרְעֶ֖ה לָ/הֶ֑ם גַּם עֶדְרֵ֥י הַ/צֹּ֖אן נֶאְשָֽׁמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/018.yaml
  text: How the animals groan! The herds of cattle wander in confusion[a], because there is no pasture for them[b]; even the flocks of sheep suffer.
translation:
  language: ru
  text: Как стонет скот! Стада крупного скота растерянно бродят[a], потому что для них нет пастбища; даже стада овец терпят бедствие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришли в замешательство», «растеряны».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также означать «несут вину» или «признаны виновными»; здесь, вероятно, речь о том, что овцы испытывают последствия опустошения.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶּאֶנְחָה
  choice: Как стонет
  rationale: מַה выступает как восклицательная частица, а נאנח передаёт слышимый стон от страдания.
- source_word: בְהֵמָה
  choice: скот
  rationale: Собирательное обозначение домашних животных; «скот» естественно в данном сельскохозяйственном контексте и не ограничивает смысл следующим упоминанием крупного скота.
- source_word: נָבֹכוּ
  choice: растерянно бродят
  rationale: Передаёт и дезориентацию, и наблюдаемое движение стад, лишившихся пастбища; буквальная смысловая возможность «пришли в замешательство» отмечена в сноске.
- source_word: עֶדְרֵי בָקָר
  choice: стада крупного скота
  rationale: Точно передаёт сочетание עדרי и בקר и естественно звучит по-русски.
- source_word: כִּי אֵין מִרְעֶה לָהֶם
  choice: потому что для них нет пастбища
  rationale: Сохраняет причинную связь כִּי и предметное значение מִרְעֶה — места для выпаса.
- source_word: גַּם
  choice: даже
  rationale: Подчёркивает распространение бедствия также на мелкий скот.
- source_word: עֶדְרֵי הַצֹּאן
  choice: стада овец
  rationale: В контексте צאן обозначает мелкий скот; «овец» соответствует контексту и принятому уточнению, а «стада» сохраняет повтор עֶדְרֵי.
- source_word: נֶאְשָׁמוּ
  choice: терпят бедствие
  rationale: Нейтрально передаёт пагубные последствия опустошения для овец, не приписывая животным нравственной вины; судебно-виновностный оттенок корня אשם сохранён в сноске.
theological_decisions:
- issue: Судебный оттенок נֶאְשָׁמוּ применительно к овцам
  choice: «терпят бедствие» в основном тексте с указанием судебно-виновностных вариантов в сноске
  alternative: «несут вину», «признаны виновными» или «несут наказание»
  rationale: Контекст ясно описывает страдание животных вследствие опустошения, однако форма от אשם допускает оттенок вины или ответственности. Основной текст не приписывает овцам нравственной виновности, а сноска сохраняет подлинную лексическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Восклицание и параллелизм сохранены; формулировки понятны обычному читателю, а неоднозначность заключительного глагола вынесена в сноску.
