  text: כִּֽי גוֹי֙ עָלָ֣ה עַל אַרְצִ֔/י עָצ֖וּם וְ/אֵ֣ין מִסְפָּ֑ר שִׁנָּי/ו֙ שִׁנֵּ֣י אַרְיֵ֔ה וּֽ/מְתַלְּע֥וֹת לָבִ֖יא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/006.yaml
  text: For a nation has come up against my land[a], mighty and without number; its teeth are the teeth of a lion[b], and it has the fangs of a lioness.
translation:
  language: ru
  text: Ибо народ вторгся в мою землю[a], могучий и бесчисленный. Зубы у него — зубы льва, и клыки у него — клыки львицы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «племя», «нация». Еврейское слово обычно означает народ или народность; здесь оно образно описывает нашествие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «льва». Еврейское слово может обозначать сильного зрелого льва и не обязательно львицу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предшествующим призывом и сохраняет весомый пророческий тон.
- source_word: גוֹי
  choice: народ
  rationale: Основное значение — «народ, племя, нация»; здесь слово метафорически представляет нашествие как вражеское войско. «Народ» естественнее в русском библейско-пророческом контексте и не снимает метафору.
- source_word: עָלָה עַל
  choice: вторгся в
  rationale: Идиома буквально описывает выступление или подъём против чего-либо; в данном контексте ясно выражает враждебное нашествие. Буквальное «поднялся на» в современном русском неестественно.
- source_word: אַרְצִי
  choice: мою землю
  rationale: Сохраняет явный суффикс первого лица и территориальный смысл существительного אֶרֶץ.
- source_word: עָצוּם
  choice: могучий
  rationale: Передаёт грозную силу захватчика и соответствует возвышенному, но понятному пророческому регистру.
- source_word: וְאֵין מִסְפָּר
  choice: и бесчисленный
  rationale: Естественно передаёт еврейскую формулу «нет числа», характеризующую неисчислимое множество.
- source_word: שִׁנָּיו
  choice: зубы у него
  rationale: Мужской единственный суффикс соотносится с собирательным существительным גוֹי; русский мужской род «народ» позволяет сохранить это согласование.
- source_word: שִׁנֵּי אַרְיֵה
  choice: зубы льва
  rationale: Близко передаёт генитивную конструкцию и сохраняет прямой, сильный образ.
- source_word: מְתַלְּעוֹת
  choice: клыки
  rationale: Слово обозначает разрывающие зубы или челюстные зубы хищника; «клыки» ясно и выразительно передают функцию в современном русском.
- source_word: לָבִיא
  choice: львица
  rationale: Допустимое и традиционно распространённое понимание слова в этом месте; поскольку оно также может обозначать сильного зрелого льва без точного указания пола, неоднозначность отмечена в сноске.
- source_word: לוֹ
  choice: у него
  rationale: Предлог с местоименным суффиксом выражает обладание; русская конструкция «у него» передаёт её естественно.
theological_decisions:
- issue: Метафорическое отождествление вторгшегося «народа»
  choice: Сохранить в основном тексте слово «народ», не заменяя его саранчой или роем.
  alternative: Передать как «рой», «саранча» или «народ саранчи».
  rationale: В еврейском тексте стоит גוֹי, а военная метафора является существенной частью пророческого образа. Её явное истолкование как роя в основном тексте устранило бы намеренное образное напряжение.
- issue: Зоологический оттенок לָבִיא
  choice: Передать как «львица», сохранив альтернативу в сноске.
  alternative: «Могучий лев», «зрелый лев» или просто «лев».
  rationale: Точный оттенок слова спорен и богословски не определяющий; сноска сохраняет лексическую неоднозначность, не перегружая стих.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан ясным и ритмичным; военная и хищническая образность оригинала сохранена без конфессионального истолкования.
