lexical_decisions:
- source_word: יֶתֶר
  choice: что оставила
  rationale: В повторяющейся конструкции существительное со значением «остаток, оставшееся» естественно передано по-русски придаточным оборотом «что оставила»; так сохраняется картина последовательного уничтожения остатков.
- source_word: גָּזָם
  choice: грызущая саранча
  rationale: Слово обозначает один из видов или этапов развития саранчи либо другое пожирающее растение насекомое; определение «грызущая» передаёт предполагаемый образ объедания, не выдавая его за точную зоологическую классификацию.
- source_word: אָכַל
  choice: съела
  rationale: Форма глагола описывает завершённое действие. Повтор «съела» сохраняет простоту и нарастающий ритм еврейского текста.
- source_word: אַרְבֶּה
  choice: роевая саранча
  rationale: Это обычное еврейское название саранчи, связанной с нашествием роёв. Определение «роевая» помогает отличить данный термин от трёх других в стихе.
- source_word: יָּלֶק / יֶּלֶק
  choice: скачущая саранча
  rationale: Точное значение как вида или стадии развития неясно. «Скачущая саранча» создаёт понятное различие, не утверждая точной биологической идентификации; различие в написании внутри стиха не меняет смысла.
- source_word: חָסִיל
  choice: пожирающая саранча
  rationale: Название связано с полным истреблением или пожиранием; этот перевод передаёт разрушительную силу заключительного звена последовательности.
- source_word: וְ
  choice: ; / а
  rationale: Повторяющийся союз связывает части в накопительную цепь. Точка с запятой и «а» перед последней частью естественно воспроизводят эту связь и ритм в современном русском языке.
