source:
  edition: WLC
  text: הָכְרַ֥ת מִנְחָ֛ה וָ/נֶ֖סֶךְ מִ/בֵּ֣ית יְהוָ֑ה אָֽבְלוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/009.yaml
  text: The grain offering and the drink offering are cut off from the house of Yahweh[a]; the priests mourn[c][b], the ministers of Yahweh.
translation:
  language: ru
  text: Не стало хлебного приношения и возлияния в доме Яхве[a][b]; скорбят священники — служители Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное еврейскими согласными יהוה (ЙХВХ).
    reason: divine_name
  - marker: b
    text: «Дом Яхве» — храм, святилище.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «те, кто служит Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכְרַת
  choice: не стало
  rationale: 'Форма глагола כרת выражает совершившееся прекращение: храмовые приношения пресеклись. «Не стало» естественно передаёт результативный смысл в контексте плача.'
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В богослужебном контексте מִנְחָה обозначает бескровное приношение из продуктов земледелия; традиционное и понятное русское соответствие — «хлебное приношение».
- source_word: נֶסֶךְ
  choice: возлияние
  rationale: Обычный богослужебный термин для жидкой жертвы, которую выливали перед Богом.
- source_word: מִבֵּית יְהוָה
  choice: в доме Яхве
  rationale: Предлог מִן при глаголе прекращения указывает на устранение из храма; русское «не стало … в доме» естественно передаёт этот смысл, сохраняя образ «дома».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אָבְלוּ
  choice: скорбят
  rationale: Глагол обозначает глубокую скорбь и траур; настоящее время сохраняет непосредственность пророческого плача.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямое и общепринятое соответствие в контексте храмового служения.
- source_word: מְשָׁרְתֵי יְהוָה
  choice: служители Яхве
  rationale: Причастное выражение характеризует священников как тех, кто совершает служение Яхве; тире ясно передаёт приложительную связь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Связь выражения מְשָׁרְתֵי יְהוָה со словом «священники»
  choice: 'приложение: «священники — служители Яхве»'
  alternative: 'самостоятельная группа: «священники и служители Яхве»'
  rationale: Отсутствие союза и параллельное положение выражений естественнее понимать второе как уточняющую характеристику тех же священников.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Формулировка «не стало» передаёт прекращение храмовых жертв естественнее буквального «отсечено», а тире сохраняет компактное еврейское приложение.
