source:
  edition: WLC
  text: כִּ֣י חֲמַ֤ס לְבָנוֹן֙ יְכַסֶּ֔/ךָּ וְ/שֹׁ֥ד בְּהֵמ֖וֹת יְחִיתַ֑/ן מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/017.yaml
  text: For the violence done to Lebanon will cover you[a], and the destruction of beasts will terrify you, because of the blood of man and the violence done to the land, to the city[b], and to all who dwell in it.
translation:
  language: ru
  text: 'Ибо насилие над Ливаном покроет тебя[a],

    и истребление зверей устрашит их[b] —

    за кровь человека[c]

    и насилие над землёй, городом

    и всеми, кто живёт в нём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрушится на тебя», «поглотит тебя». Буквально еврейский глагол означает «покроет».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «устрашит их»; местоимение, по-видимому, относится к зверям. Сочетание можно также понять как «опустошение, произведённое зверями».'
    reason: textual_ambiguity
  - marker: c
    text: То есть за пролитую человеческую кровь; еврейское «человек» употреблено в единственном числе и может иметь представительное значение.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַס לְבָנוֹן
  choice: насилие над Ливаном
  rationale: חָמָס обозначает насилие, жестокую несправедливость или злодеяние; предлог при «Ливане» естественно передаёт его как объект насилия.
- source_word: יְכַסֶּךָּ
  choice: покроет тебя
  rationale: Глагол כסה буквально означает «покрывать». Сохранён пророческий образ воздаяния, которое покроет виновного, без замены его более толковательным «обрушится».
- source_word: שֹׁד בְּהֵמוֹת
  choice: истребление зверей
  rationale: שֹׁד передаёт разорение, опустошение или уничтожение; בְּהֵמוֹת здесь понимается как подвергшиеся истреблению животные. «Звери» сохраняет возвышенный пророческий регистр и не сужает смысл до домашнего скота.
- source_word: יְחִיתַן
  choice: устрашит их
  rationale: 'Форма глагола חתת в породе Hiphil имеет суффикс 3-го лица множественного числа: буквально «устрашит их». Ближайший грамматический антецедент — звери; необычная образность исходного текста сохранена.'
- source_word: מִדְּמֵי אָדָם
  choice: за кровь человека
  rationale: מִן имеет причинное значение «за, из-за», а множественная форма דָּמִים указывает на пролитую кровь. Единственное אָדָם передано формально, при этом оно может иметь собирательно-представительное значение.
- source_word: וַחֲמַס אֶרֶץ
  choice: и насилие над землёй
  rationale: Повтор חָמָס параллелен насилию над Ливаном; «над землёй» ясно передаёт землю как объект причинённого зла.
- source_word: קִרְיָה
  choice: городом
  rationale: קִרְיָה означает город. Определённость естественно следует из контекста предыдущего упоминания города, построенного на крови (ст. 12), хотя артикля в еврейском нет.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: и всеми, кто живёт в нём
  rationale: Причастная конструкция буквально обозначает всех живущих в городе; современная относительная конструкция звучит естественно и сохраняет полноту охвата.
theological_decisions:
- issue: Представительное значение אָדָם
  choice: кровь человека
  alternative: человеческое кровопролитие
  rationale: Еврейское единственное число сохранено, но сноска поясняет возможное представительное значение и идиоматический смысл пролитой человеческой крови.
- issue: Объект глагола יְחִיתַן
  choice: устрашит их
  alternative: устрашит тебя
  rationale: Масоретский текст содержит объектный суффикс множественного числа «их». Более гладкое обращение «тебя» устранило бы реальную грамматическую трудность и необычность текста.
- issue: Отношение между שֹׁד и בְּהֵמוֹת
  choice: истребление зверей
  alternative: опустошение, произведённое зверями
  rationale: В контексте обвинения завоевателя наиболее вероятно насилие, причинённое животным, однако конструкция сопряжения сама по себе допускает различное понимание отношения; это отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого, торжественного ритма пророческой речи. Повтор «насилие» удерживает композиционную связь двух частей стиха; необычные метафоры и местоименная форма исходного текста не сглажены.
