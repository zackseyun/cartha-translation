  text: ה֚וֹי מַשְׁקֵ֣ה רֵעֵ֔/הוּ מְסַפֵּ֥חַ חֲמָתְ/ךָ֖ וְ/אַ֣ף שַׁכֵּ֑ר לְמַ֥עַן הַבִּ֖יט עַל מְעוֹרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/015.yaml
  text: Woe to him who makes his neighbor drink[a], pouring out your wrath and even making him drunk[c][b], in order to look on their nakedness.
translation:
  language: ru
  text: Горе тому, кто поит своего ближнего, примешивая твою ярость[a][b], да ещё и напаивает его допьяна, чтобы смотреть на их наготу[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «примешивая твой яд»; слово, переведённое как «ярость», может также означать жар или яд.'
    reason: lexical_alternative
  - marker: b
    text: Еврейская фраза трудна. В ней неожиданно появляется обращение «твою» среди речи о человеке в третьем лице; предлагаются и другие толкования, например «добавляя твой мех с вином» или сглаженное «примешивая свою ярость».
    reason: alternative_reading
  - marker: c
    text: Буквально речь идёт об обнажённости; слово может конкретнее указывать на интимные части тела. Еврейский текст употребляет здесь множественное число — «их».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое междометие вводит обличение и возвещение суда; «горе» — естественное и традиционно понятное соответствие в современном литературном русском.
- source_word: מַשְׁקֵה
  choice: кто поит
  rationale: Причастие породы hифиль от שׁקה обозначает побуждение или принуждение пить; глагол «поит» краток и сохраняет активную роль виновника.
- source_word: רֵעֵהוּ
  choice: ближнего своего
  rationale: רֵעַ может обозначать ближнего, товарища или другого человека. «Ближний» соответствует этическому контексту и не предполагает близкой дружбы.
- source_word: מְסַפֵּחַ
  choice: примешивая
  rationale: Форма трудна и может передавать добавление или присоединение. В контексте питья «примешивая» естественно выражает внесение пагубной примеси, не скрывая образности следующего слова.
- source_word: חֲמָתְךָ
  choice: ярость твою
  rationale: חֵמָה обычно означает жар, ярость или гнев, но может иметь оттенок яда. Основной текст сохраняет обычное значение и необычное второе лицо; вариант «яд» вынесен в примечание.
- source_word: וְאַף שַׁכֵּר
  choice: да ещё и напаивает его допьяна
  rationale: וְאַף усиливает нарастание действия, а שׁכר обозначает доведение до опьянения. Русская формулировка ясно передаёт и усиление, и результат.
- source_word: לְמַעַן הַבִּיט
  choice: чтобы смотреть
  rationale: לְמַעַן вводит цель, а נבט означает направленный взгляд. Перевод сохраняет намеренный и нравственно обличаемый характер поступка без лишнего истолкования.
- source_word: מְעוֹרֵיהֶם
  choice: их наготу
  rationale: Редкое слово указывает на обнажённость, вероятно включая интимные части тела, в контексте позора. «Нагота» передаёт смысл достойно и достаточно ясно; более конкретный оттенок отмечен отдельно.
theological_decisions:
- issue: Переход от третьего лица к суффиксу второго лица в חֲמָתְךָ
  choice: Сохранить в основном тексте форму «ярость твою»
  alternative: Сгладить переход как «свою ярость» или принять иное понимание трудной фразы
  rationale: Масоретский текст содержит резкий переход к обращению во втором лице. Его сохранение передаёт текстуальную и риторическую напряжённость, а не устраняет её без предупреждения.
- issue: Смена числа между «ближнего своего» и מְעוֹרֵיהֶם
  choice: Сохранить «их наготу»
  alternative: Согласовать по-русски как «его наготу»
  rationale: Еврейский текст переходит от единственного числа к суффиксу множественного числа. Основной перевод не исправляет эту особенность молча.
- issue: Образ унизительного обнажения
  choice: Передать как намеренное опьянение ради созерцания наготы
  alternative: 'Передать более отвлечённо: «смотреть на их позор»'
  rationale: Текст прямо связывает опьянение с обнажением. Перевод сохраняет нравственную остроту образа, не добавляя подробностей сверх еврейского текста.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Оборот «ближнего своего» слегка возвышен, но общеупотребителен в библейском контексте. Необычные переходы лица и числа сохранены как особенности еврейского текста и пояснены в примечаниях.
