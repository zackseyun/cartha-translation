    issue: «Из деревянной кладки» вместо מֵעֵץ
    rationale: Еврейский текст говорит просто «из дерева/древесины». «Деревянная кладка» добавляет не выраженное в тексте понятие кладки и создаёт неестественный русский технический образ.
  - severity: low
    issue: Выбор «перекладина» для כָּפִיס
    rationale: Слово כָּפִיס редкое и его точная строительная референция спорна. «Балка» является более нейтральным и широким вариантом, поддержанным английским audit trail («beam»).
  revised_text: Ибо камень из стены закричит, и деревянная балка ответит ему.
