  text: For a stone will cry out from the wall, and a beam from the woodwork will answer it.
translation:
  language: ru
  text: Ибо камень из стены закричит, и деревянная балка ответит ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּזְעָק
  choice: возопиёт
  rationale: Передаёт сильный публичный крик, выраженный еврейским корнем זעק, и сохраняет торжественный пророческий тон.
- source_word: כָפִיס
  choice: перекладина
  rationale: Редкое слово обозначает деревянный строительный элемент; «перекладина» естественно сочетается с образом стены и не сужает значение до конкретного вида кровельной балки.
- source_word: מֵעֵץ
  choice: из деревянной кладки
  rationale: Буквально «из дерева»; по контексту это деревянная часть сооружения, параллельная каменной стене. Формулировка сохраняет строительный образ.
- source_word: יַעֲנֶנָּה
  choice: ответит ему
  rationale: Местоименный суффикс женского рода относится к слову «камень», которое в еврейском женского рода; в русском согласование естественно передано мужским местоимением по роду слова «камень».
theological_decisions:
- issue: Олицетворённое свидетельство постройки
  choice: Сохранить буквальные действия «возопиёт» и «ответит»
  alternative: 'Передать объяснительно: «сама постройка засвидетельствует»'
  rationale: Исходный текст намеренно изображает камень и деревянный элемент как свидетелей; прямой образ сохраняет пророческую силу и не добавляет толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм еврейского текста сохранён; устаревшие или узкотехнические термины избегаются.
