  text: ה֣וֹי אֹמֵ֤ר לָ/עֵץ֙ הָקִ֔יצָ/ה ע֖וּרִי לְ/אֶ֣בֶן דּוּמָ֑ם ה֣וּא יוֹרֶ֔ה הִנֵּה ה֗וּא תָּפוּשׂ֙ זָהָ֣ב וָ/כֶ֔סֶף וְ/כָל ר֖וּחַ אֵ֥ין בְּ/קִרְבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/019.yaml
  text: Woe to the one who says to wood[a], “Wake up!” and to silent stone, “Arise!” Can it teach? Look— it is overlaid with gold and silver, yet there is no breath at all within it.
translation:
  language: ru
  text: 'Горе тому, кто говорит дереву: «Проснись!» — и безмолвному камню: «Пробудись!» Разве он может наставлять? Вот, он обложен золотом и серебром, но в нём нет никакого дыхания[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духа». Еврейское слово может означать «дыхание», «ветер» или «дух»; здесь оно подчёркивает, что в идоле нет жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Сохраняет силу пророческого обличения и возвещения суда.
- source_word: לָעֵץ
  choice: дереву
  rationale: Передаёт материал идола и сохраняет краткий параллелизм с камнем.
- source_word: הָקִיצָה / עוּרִי
  choice: «Проснись!» / «Пробудись!»
  rationale: Два близких повеления переданы разными естественными русскими глаголами, чтобы сохранить поэтическую вариативность и иронию обращения к неодушевлённому идолу.
- source_word: לְאֶבֶן דּוּמָם
  choice: безмолвному камню
  rationale: «Безмолвный» естественно передаёт неспособность камня говорить или отвечать.
- source_word: הוּא יוֹרֶה
  choice: Разве он может наставлять?
  rationale: Контекст поддерживает риторический вопрос; «наставлять» сохраняет значение породы ירה и религиозно-нравственный оттенок ожидаемого от идола руководства.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественно привлекает внимание к очевидной нелепости описываемого идола.
- source_word: תָּפוּשׂ זָהָב וָכֶסֶף
  choice: обложен золотом и серебром
  rationale: Передаёт покрытие изготовленного идола драгоценными металлами без предположения о конкретной технике.
- source_word: וְכָל רוּחַ אֵין בְּקִרְבּוֹ
  choice: но в нём нет никакого дыхания
  rationale: В контексте противопоставляется внешнее великолепие идола его полной безжизненности; «никакого» передаёт усиление כָל.
theological_decisions:
- issue: Значение רוּחַ в заключительной фразе
  choice: дыхание
  alternative: дух
  rationale: В полемике против идолов прежде всего подчёркнуто отсутствие жизни. При этом многозначность еврейского слова не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие повеления и риторический вопрос сохраняют насмешливую силу оригинала; без архаизмов и конфессионально окрашенных уточнений.
