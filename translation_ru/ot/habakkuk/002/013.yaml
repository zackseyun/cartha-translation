revisions:
- from: Разве не от Яхве Воинств исходит то, что народы трудятся для огня[a], а племена изнуряют себя ради пустоты[b]?
  to: Разве не Яхве Воинств установил, что народы трудятся для огня, а народы изнуряют себя впустую?[a][b]
  rationale: Исправление устраняет неоправданное сужение значения לְאֻמִּים в слове «племена» и делает синтаксис естественным. «Установил» в данном контексте передаёт, что названный итог исходит от Яхве Воинств как установленный судом порядок, не утверждая морального авторства злых действий народов. Сноски привязаны непосредственно к словам «огня» и «впустую».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:05:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: риторический вопрос, источник в Яхве Воинств, труд народов, обречённый огню, и изнурение ради тщеты сохранены. Однако «племена» неоправданно сужает לְאֻמִּים до родо-племенных групп; в данном параллелизме это другой общий термин для народов, а не указание на племена. Оборот «исходит то, что» формально возможен, но тяжеловесен и несколько размывает непосредственную связь «от Яхве Воинств» с названной реальностью.'
  naturalness: «Разве не от Яхве Воинств исходит то, что…» звучит по-русски канцелярски и синтаксически перегруженно. Формула «Разве не Яхве Воинств установил, что…» естественна для современного литературного русского и ясно вводит содержание риторического вопроса. «Ради пустоты» допустимо, но «впустую» существенно естественнее и передаёт идиоматическую силу בְּדֵי רִיק.
  terminology: '«Яхве Воинств» последовательно передаёт тетраграмматон и צְבָאוֹת. «Народы» уместно для עַמִּים и также допустимо для לְאֻמִּים в русском параллелизме: попытка непременно различать эти близкие еврейские слова не должна вести к смысловому сужению.'
