  text: הֲ/ל֣וֹא הִנֵּ֔ה מֵ/אֵ֖ת יְהוָ֣ה צְבָא֑וֹת וְ/יִֽיגְע֤וּ עַמִּים֙ בְּ/דֵי אֵ֔שׁ וּ/לְאֻמִּ֖ים בְּ/דֵי רִ֥יק יִעָֽפוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/013.yaml
  text: Is it not indeed from Yahweh of hosts that peoples labor for fire[b][a], and nations weary themselves for emptiness?
translation:
  language: ru
  text: Разве не Яхве Воинств установил, что народы трудятся для огня, а народы изнуряют себя впустую?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для пламени», то есть ради того, что будет уничтожено огнём.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради пустоты»; также возможно: «ради тщеты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא הִנֵּה
  choice: Разве не… исходит то, что
  rationale: Передаёт риторический вопрос, ожидающий утвердительного ответа, и усиление הִנֵּה естественным современным русским оборотом без архаичного «вот».
- source_word: מֵאֵת
  choice: от… исходит
  rationale: Сохраняет значение источника или происхождения, не сводя его заранее ни к простому знанию Бога, ни к моральному авторству человеческого зла.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога и сохраняет широту титула צְבָאוֹת, не ограничивая его только земными армиями.
- source_word: וְיִיגְעוּ עַמִּים
  choice: народы трудятся
  rationale: Передаёт напряжённый труд; «народы» естественно соответствует עַמִּים и позволяет отличить его от параллельного לְאֻמִּים.
- source_word: בְּדֵי אֵשׁ
  choice: для огня
  rationale: Сохраняет сжатый образ труда, плод которого предназначен огню или будет им уничтожен, не раскрывая образ прямо в основном тексте.
- source_word: וּלְאֻמִּים
  choice: а племена
  rationale: Союз передан как «а» для естественного русского параллелизма; «племена» сохраняет лексическое отличие от עַמִּים, не меняя общего смысла о народах.
- source_word: בְּדֵי רִיק
  choice: ради пустоты
  rationale: Сохраняет существительное רִיק и мотив тщетности, а также параллель с «для огня».
- source_word: יִעָפוּ
  choice: изнуряют себя
  rationale: Выражает достигаемое усилиями изнеможение и уместную в контексте возвратно-результативную окраску.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Причинная сила מֵאֵת יְהוָה צְבָאוֹת
  choice: «от Яхве Воинств исходит то, что» — итог труда народов находится в сфере Божьего суда и установления
  alternative: Бог лишь знает об этом; Бог непосредственно производит злое желание народов
  rationale: 'Формулировка сохраняет напряжение исходного текста: тщетный итог представлен как исходящий от Яхве, но перевод не приписывает ему нравственное авторство зла и не ослабляет причинность до простого знания.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Риторический вопрос и параллелизм двух строк сохранены; выражения «для огня» и «ради пустоты» намеренно оставлены образными и краткими.
