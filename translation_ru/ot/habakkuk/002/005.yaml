source:
  edition: WLC
  text: וְ/אַף֙ כִּֽי הַ/יַּ֣יִן בּוֹגֵ֔ד גֶּ֥בֶר יָהִ֖יר וְ/לֹ֣א יִנְוֶ֑ה אֲשֶׁר֩ הִרְחִ֨יב כִּ/שְׁא֜וֹל נַפְשׁ֗/וֹ וְ/ה֤וּא כַ/מָּ֨וֶת֙ וְ/לֹ֣א יִשְׂבָּ֔ע וַ/יֶּאֱסֹ֤ף אֵלָי/ו֙ כָּל הַ/גּוֹיִ֔ם וַ/יִּקְבֹּ֥ץ אֵלָ֖י/ו כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/005.yaml
  text: Moreover[a], wine betrays; an arrogant man does not remain at rest. He enlarges his appetite like Sheol, and he is like death and is never satisfied[c][b]. He gathers to himself all the nations and collects to himself all the peoples.
translation:
  language: ru
  text: Более того[a], вино коварно; надменный человек не знает покоя[b]. Он делает свою алчность безмерной, словно Шеол[c]; он подобен смерти и никогда не насыщается. Он собирает к себе все народы и стягивает к себе все племена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и действительно»; всю фразу можно также передать: «вино вероломно» или «вино обманывает». Еврейский текст здесь краток и несколько труден; некоторые понимают эти слова шире — как указание на опьянённую самонадеянность гордого завоевателя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не остаётся дома», «не пребывает». Значение еврейского глагола не вполне ясно; основной текст передаёт подразумеваемую в контексте неугомонность.'
    reason: lexical_alternative
  - marker: c
    text: 'Шеол — мир мёртвых; возможно также: «могила».'
    reason: cultural_note
lexical_decisions:
- source_word: וְאַף כִּי
  choice: Более того
  rationale: Сочетание имеет усилительно-переходный характер и вводит дальнейшее обличение; причинное значение здесь не навязывается.
- source_word: הַיַּיִן בּוֹגֵד
  choice: вино коварно
  rationale: Сохраняется явно названное в еврейском тексте вино и характеристика его как вероломного, обманчивого; краткая русская формулировка передаёт олицетворение.
- source_word: גֶּבֶר יָהִיר
  choice: надменный человек
  rationale: Передаёт человека, отличающегося дерзкой гордыней, без неоправданного уточнения «воин» или «сильный человек».
- source_word: וְלֹא יִנְוֶה
  choice: не знает покоя
  rationale: Трудный глагол может обозначать пребывание, обитание или покой. В контексте ненасытной захватнической устремлённости естественная русская формулировка выражает беспокойную неуёмность, не исключая буквальных альтернатив.
- source_word: הִרְחִיב ... נַפְשׁוֹ
  choice: расширяет свои желания
  rationale: Глагол сохраняет образ расширения, а נֶפֶשׁ в данном контексте обозначает алчное желание или аппетит, а не отвлечённую «душу».
- source_word: כִּשְׁאוֹל
  choice: словно Шеол
  rationale: Сохраняется древнееврейское обозначение мира мёртвых и образ его ненасытности; термин поясняется в сноске.
- source_word: וְהוּא כַמָּוֶת וְלֹא יִשְׂבָּע
  choice: он подобен смерти и никогда не насыщается
  rationale: Прямое сравнение со смертью сохранено, а форма глагола передана как постоянная ненасытность.
- source_word: וַיֶּאֱסֹף ... כָּל הַגּוֹיִם וַיִּקְבֹּץ ... כָּל הָעַמִּים
  choice: собирает к себе все народы и стягивает к себе все племена
  rationale: Параллелизм двух глаголов и двух обозначений народов сохранён без их полного стилистического отождествления.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация сохраняет образ мира мёртвых в древнееврейской картине мира и не сводит его лишь к отдельному месту погребения.
- issue: Связь вина с надменным завоевателем
  choice: Сохранить краткое самостоятельное утверждение «вино коварно»
  alternative: Истолковать всю строку как описание опьянённой вином гордыни завоевателя
  rationale: Еврейская фраза сжата и трудна. Основной текст не устраняет упоминание вина и не превращает возможную контекстуальную связь в однозначное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; параллелизм и образы ненасытных Шеола и смерти сохранены. Неясные места не сглажены без сносок.
