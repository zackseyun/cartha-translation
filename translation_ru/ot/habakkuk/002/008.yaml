source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה שַׁלּ֨וֹתָ֙ גּוֹיִ֣ם רַבִּ֔ים יְשָׁלּ֖וּ/ךָ כָּל יֶ֣תֶר עַמִּ֑ים מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/008.yaml
  text: Because you have plundered many nations[a], all the remnant of the peoples will plunder you—because of human blood and violence done to the land, to the city, and to all who dwell in it.
translation:
  language: ru
  text: За то, что ты разграбил многие народы, все уцелевшие из народов разграбят тебя — за пролитую человеческую кровь и насилие над землёй, городом и всеми его жителями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוֹתָ / יְשָׁלּוּךָ
  choice: ты разграбил / разграбят тебя
  rationale: '«Разграбить» естественно передаёт захват добычи силой и сохраняет подчёркнутый в еврейском тексте поворот: грабитель сам будет разграблен.'
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: В международном и политическом контексте גּוֹיִם обозначает народы; этот вариант соответствует обстановке пророчества.
- source_word: כָּל יֶתֶר עַמִּים
  choice: все уцелевшие из народов
  rationale: יֶתֶר обозначает оставшуюся часть. «Уцелевшие из народов» ясно выражает смысл остатка или переживших разорение и естественно звучит по-русски.
- source_word: מִדְּמֵי אָדָם
  choice: за пролитую человеческую кровь
  rationale: Предлог מִן имеет причинное значение, а множественное דְּמֵי в таком контексте указывает на кровопролитие. Формулировка передаёт родовое значение אָדָם без мужской специфики.
- source_word: וַחֲמַס אֶרֶץ
  choice: и насилие над землёй
  rationale: חָמָס означает насилие, жестокое беззаконие; «над землёй» естественно выражает эллиптическое отношение к объекту.
- source_word: קִרְיָה וְכָל יֹשְׁבֵי בָהּ
  choice: городом и всеми его жителями
  rationale: Краткая современная формулировка точно передаёт город и всех живущих в нём, а местоимение «его» грамматически соотносится с городом.
theological_decisions:
- issue: Родовое значение אָדָם в выражении דְּמֵי אָדָם
  choice: человеческую кровь
  alternative: кровь человека
  rationale: Здесь אָדָם относится к людям вообще, а не к конкретному мужчине. «Человеческую кровь» сохраняет родовое значение и естественно звучит в современном русском языке.
- issue: Значение множественного דְּמֵי в контексте обвинения
  choice: пролитую человеческую кровь
  alternative: человеческую кровь
  rationale: Форма множественного числа часто обозначает кровь, пролитую при убийствах. Слово «пролитую» делает подразумеваемое кровопролитие ясным, не меняя основания суда.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Синтаксический параллелизм «ты разграбил — разграбят тебя» сохранён; архаизмы и конфессионально окрашенные термины не использованы.
