base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/006.yaml
  text: Will not all of these take up a taunt against him[a], with mockery and riddles about him, and say, “Woe to him who heaps up what is not his—how long?—and loads himself with pledged goods!”
translation:
  language: ru
  text: 'Разве не все они произнесут против него насмешливое изречение, загадочные речи о нём, и скажут:


    «Горе тому, кто копит то, что ему не принадлежит, —

    доколе? —

    и нагружает себя залогами[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «густой глиной». Редкое еврейское слово может заключать игру слов между имуществом, взятым в залог, и тяжёлой массой, которая обременяет того, кто её копит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָשָׁל
  choice: насмехаться… в притчах
  rationale: В данном пророческом контексте слово обозначает не просто поучительную притчу, а образное изречение, направленное на осмеяние притеснителя. Такая формулировка передаёт и жанр, и насмешливую функцию.
- source_word: יִשָּׂאוּ
  choice: станут… [насмехаться]
  rationale: Глагол в сочетании с מָשָׁל означает произнесение или подхватывание формального изречения. По-русски значение естественно выражается началом насмешливой речи без буквального образа «поднимать».
- source_word: מְלִיצָה חִידוֹת
  choice: загадочные речи
  rationale: Сочетание обозначает острые, насмешливые и иносказательные высказывания. «Загадочные речи» сохраняет их непрямой, требующий разгадки характер, тогда как насмешливый тон уже выражен сказуемым.
- source_word: הוֹי
  choice: Горе
  rationale: Традиционное и понятное русское соответствие пророческому возгласу, соединяющему осуждение с возвещением бедствия.
- source_word: הַמַּרְבֶּה לֹּא לוֹ
  choice: кто копит чужое
  rationale: Кратко и естественно передаёт накопление того, что человеку не принадлежит, и сохраняет нравственное обвинение в неправедном обогащении.
- source_word: עַד מָתַי
  choice: доколе это будет?
  rationale: Передаёт внезапный возглас протеста и сохраняет торжественный регистр; добавленное «это будет» делает отдельный вопрос естественным по-русски, не устраняя его резкости.
- source_word: וּמַכְבִּיד עָלָיו
  choice: обременяет себя
  rationale: 'Сохраняет образ тяжести, которую накопитель возлагает на самого себя, и тем самым иронию: приобретённое неправедно становится его бременем.'
- source_word: עַבְטִיט
  choice: взятым в залог
  rationale: Редкое слово вероятнее всего связано с залогами или долговыми обязательствами. Субстантивированное выражение «взятым в залог» ясно передаёт экономический образ и допускает собирательное значение.
theological_decisions:
- issue: Толкование редкого слова עַבְטִיט
  choice: 'экономический образ: имущество, взятое в залог'
  alternative: «тяжёлая глина» или «густая грязь»
  rationale: Контекст обличает хищническое накопление и эксплуатацию, поэтому значение, связанное с залогами и долгами, наиболее уместно. Однако редкость слова и возможность игры слов не позволяют исключить вещественный образ тяжёлой глины; он сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис упрощён ради ясности, но риторический вопрос, насмешливый жанр, резкая вставка «доколе?» и двусмысленный образ бремени сохранены.
