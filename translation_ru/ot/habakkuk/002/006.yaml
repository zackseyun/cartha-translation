  source_fidelity: 'Начальная часть черновика смешивает два элемента исходной конструкции: מָשָׁל передаётся как «притчи», но его насмешливо-обличительная функция перенесена в глагол «насмехаться». В результате менее ясно, что народы произносят против угнетателя формальное насмешливое изречение вместе с загадочными/язвительными речениями. В исправлении сохранены оба элемента. «Доколе?» передано без добавления «это будет», поскольку добавка несколько конкретизирует намеренно резкий, эллиптический вопрос. Неоднозначное עַבְטִיט оставлено в основном тексте в экономическом смысле и снабжено сноской.'
