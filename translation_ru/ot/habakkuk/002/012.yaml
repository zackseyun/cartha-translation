  text: ה֛וֹי בֹּנֶ֥ה עִ֖יר בְּ/דָמִ֑ים וְ/כוֹנֵ֥ן קִרְיָ֖ה בְּ/עַוְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/012.yaml
  text: Woe to him who builds a city with bloodshed and establishes a town by injustice[a][b].
translation:
  language: ru
  text: Горе тому, кто строит город кровопролитием[a] и основывает город беззаконием[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кровями»; это древнееврейское выражение может означать кровопролитие или вину за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утверждает город».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе тому
  rationale: Пророческое междометие вводит обличение и возвещение суда; выражение «горе тому» сохраняет его силу и естественно сочетается с причастной конструкцией.
- source_word: בֹּנֶה
  choice: кто строит
  rationale: Причастие Qal описывает человека по его действию; русская конструкция с «кто строит» передаёт это ясно и естественно.
- source_word: עִיר
  choice: город
  rationale: Обычное значение слова; далее употреблён его поэтический синоним קִרְיָה.
- source_word: בְּדָמִים
  choice: кровопролитием
  rationale: Множественное число «крови» часто обозначает пролитие крови или вину за него; творительный падеж передаёт средство, которым строится город.
- source_word: וְכוֹנֵן
  choice: и основывает
  rationale: Глагол означает прочно учреждать, устраивать или утверждать; «основывает» сохраняет строительный образ и параллелизм.
- source_word: קִרְיָה
  choice: поселение
  rationale: Поэтический синоним слова «город»; вариант «поселение» сохраняет лексическое различие между двумя полустишиями без изменения основного смысла.
- source_word: בְּעַוְלָה
  choice: беззаконием
  rationale: Существительное обозначает неправду, несправедливость и нравственно порочное действие; «беззаконием» звучит весомо в пророческом обличении и передаёт инструментальный смысл предлога.
theological_decisions:
- issue: Характер возвещаемого горя
  choice: Пророческое обличение созидания общественной и политической силы посредством кровопролития и беззакония
  alternative: Общий плач о разложении городской жизни
  rationale: Формула הוֹי и указание на кровопролитие и беззаконие имеют обвинительный характер. Перевод сохраняет нравственную остроту текста, не привязывая его к позднейшей богословской системе.
translation_notes:
  register: Современный литературный русский язык с краткой и торжественной пророческой интонацией. Восклицательный знак передаёт силу формулы «горе». Поэтический параллелизм сохранён посредством пар «строит — основывает», «город — поселение», «кровопролитием — беззаконием».
