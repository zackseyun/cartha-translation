  text: כִּ֚י תִּמָּלֵ֣א הָ/אָ֔רֶץ לָ/דַ֖עַת אֶת כְּב֣וֹד יְהוָ֑ה כַּ/מַּ֖יִם יְכַסּ֥וּ עַל יָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/014.yaml
  text: For the earth will be filled with the knowledge of the glory of Yahweh[a], as the waters cover the sea.
translation:
  language: ru
  text: Ибо земля наполнится знанием славы Яхве[a], как воды покрывают море.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна», если понимать это слово в более узком, местном смысле; здесь «земля» предпочтительнее ввиду, по-видимому, всеобщего охвата стиха.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительно-причинную связь с предшествующим контекстом и соответствует возвышенному, но понятному пророческому стилю.
- source_word: תִּמָּלֵא
  choice: наполнится
  rationale: Нифаль имперфекта передаёт будущее состояние или результат; русское «наполнится» естественно сохраняет эту семантику.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Русское «земля» способно обозначать как всю землю, так и страну; в данном контексте сравнение с водами моря поддерживает широкий, вселенский охват.
- source_word: לָדַעַת אֶת כְּבוֹד
  choice: знанием славы
  rationale: Передаёт субстантивную силу инфинитива «знать» после глагола наполнения и сохраняет объект знания — славу Яхве.
- source_word: כְּבוֹד
  choice: слава
  rationale: Обычное и смыслово ёмкое соответствие כבוד применительно к Богу; включает представления о величии, весомости и явленном великолепии.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כַּמַּיִם יְכַסּוּ עַל יָם
  choice: как воды покрывают море
  rationale: Естественная русская сравнительная конструкция; предлог עַל не воспроизводится отдельно, поскольку его смысл уже выражен переходным глаголом «покрывают».
theological_decisions:
- issue: Охват הָאָרֶץ
  choice: земля в универсальном смысле
  alternative: страна, суша
  rationale: Широкий образ вод, покрывающих море, и пророческая перспектива поддерживают вселенский смысл, однако русское слово «земля» не устраняет полностью присущую еврейскому слову многозначность.
- issue: Характер «знания» славы Яхве
  choice: знание
  alternative: познание
  rationale: «Знание» формальнее соответствует לָדַעַת и не уточняет без необходимости, имеется ли в виду процесс познания, опытное узнавание или достигнутое состояние.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксический параллелизм и образность оригинала сохранены без архаизации.
