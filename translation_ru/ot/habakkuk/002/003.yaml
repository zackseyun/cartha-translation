  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י ע֤וֹד חָזוֹן֙ לַ/מּוֹעֵ֔ד וְ/יָפֵ֥חַ לַ/קֵּ֖ץ וְ/לֹ֣א יְכַזֵּ֑ב אִם יִתְמַהְמָהּ֙ חַכֵּה ל֔/וֹ כִּֽי בֹ֥א יָבֹ֖א לֹ֥א יְאַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/003.yaml
  text: For the vision is still for the appointed time[a]; it hastens toward the end and will not lie. If it delays, wait for it, for it will surely come[b]; it will not be late.
translation:
  language: ru
  text: Ибо видению ещё предстоит исполниться в назначенный срок; оно устремляется к концу[a] и не обманет. Если оно медлит, жди его[b], ибо оно непременно придёт и не опоздает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Трудный еврейский глагол можно также понять как «тяжело дышит, устремляясь к концу» или «возвещает о конце». Здесь он передан как настойчивое движение видения к исполнению.
    reason: lexical_alternative
  - marker: b
    text: 'Местоимения относятся прежде всего к «видению», которое в еврейском языке мужского рода. Возможно и личное прочтение: «если он медлит, жди его»; так эта строка применяется в Евр 10:37.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוֹן
  choice: видение
  rationale: Обычное обозначение пророческого откровения; соответствует контексту того, что Аввакум должен записать и чего должен ожидать.
- source_word: לַמּוֹעֵד
  choice: к назначенному сроку
  rationale: מוֹעֵד обозначает установленное время; «назначенный срок» передаёт определённость момента исполнения.
- source_word: וְיָפֵחַ
  choice: оно устремляется
  rationale: Трудный глагол может передавать образ дыхания или учащённого дыхания, а также, по иной трактовке, речи. В контексте «устремляется» естественно выражает движение видения к исполнению, не скрывая трудности исходного слова, отмеченной в сноске.
- source_word: לַקֵּץ
  choice: к концу
  rationale: קֵץ указывает на конечный момент, то есть на завершение или исполнение возвещённого.
- source_word: וְלֹא יְכַזֵּב
  choice: и не обманет
  rationale: Сохраняет прямое значение глагола «лгать, обманывать» и олицетворение видения.
- source_word: אִם יִתְמַהְמָהּ
  choice: если оно медлит
  rationale: Передаёт задержку или промедление без утверждения, что назначенный Богом срок действительно нарушен.
- source_word: חַכֵּה לוֹ
  choice: жди его
  rationale: Местоименный суффикс мужского рода естественно согласуется с חָזוֹן, которое в иврите также мужского рода. В русском «его» сохраняет грамматическую соотнесённость с «видением» и одновременно допускает личное прочтение, пояснённое в сноске.
- source_word: כִּי בֹא יָבֹא
  choice: ибо оно непременно придёт
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает уверенность; «непременно придёт» передаёт это подчёркивание.
- source_word: לֹא יְאַחֵר
  choice: и не опоздает
  rationale: Передаёт мысль о том, что исполнение не выйдет за назначенный срок, и избегает буквального повтора «медлить».
theological_decisions:
- issue: К чему относятся местоимения во второй половине стиха
  choice: В основном тексте они относятся к видению и его исполнению.
  alternative: 'Возможна личная отнесённость: «если он медлит, жди его»; такое применение отражено в Евр 10:37.'
  rationale: Ближайший антецедент в еврейском тексте — חָזוֹן («видение»), существительное мужского рода. Поэтому контекст прежде всего указывает на видение, однако грамматика русского перевода «жди его» не устраняет личного прочтения; оно открыто обозначено в сноске.
- issue: Кажущееся промедление и установленный срок
  choice: Сохранено напряжение между «если оно медлит» и «не опоздает».
  alternative: Можно было сгладить фразу как «если кажется, что оно медлит», но такого уточнения в еврейском тексте нет.
  rationale: Исходный текст сопоставляет воспринимаемую задержку с уверенностью в точном исполнении; перевод не должен устранять это напряжение поясняющей вставкой.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным ритмом. Олицетворение видения сохранено. Формулировка «относится к назначенному сроку» передаёт лаконичную именную конструкцию оригинала, а пара «медлит — не опоздает» сохраняет намеренное смысловое напряжение.
