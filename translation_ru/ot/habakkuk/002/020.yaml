  text: וַֽ/יהוָ֖ה בְּ/הֵיכַ֣ל קָדְשׁ֑/וֹ הַ֥ס מִ/פָּנָ֖י/ו כָּל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/020.yaml
  text: But Yahweh is in his holy temple[c][b][a]; let all the earth be silent before him.
translation:
  language: ru
  text: А Яхве — в Своём святом храме[a]. Да умолкнет[b] перед Ним вся земля[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Своём святом святилище»; еврейское слово также может означать «дворец».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть хранит молчание»; также возможно резкое повеление: «тихо!»'
    reason: lexical_alternative
  - marker: c
    text: 'Или, в более узком смысле: «вся страна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: А Яхве
  rationale: Союз וַ в контексте противопоставляет живого Яхве безмолвным идолам предыдущего стиха; «а» естественно передаёт этот контраст. Имя יהוה передано как «Яхве».
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: в Своём святом храме
  rationale: הֵיכָל может означать храм, святилище или дворец; «храм» сохраняет культовый смысл и не уточняет без достаточных оснований, идёт ли речь о земном или небесном месте пребывания Бога.
- source_word: הַס
  choice: да умолкнет
  rationale: Междометие-повеление требует благоговейной тишины. Форма «да умолкнет» звучит торжественно, но остаётся понятной и согласуется с подлежащим «вся земля».
- source_word: מִפָּנָיו
  choice: перед Ним
  rationale: Буквально выражение связано с лицом или присутствием; русское «перед Ним» естественно передаёт пребывание в Его присутствии.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: אָרֶץ допускает значения «земля» и «страна». В кульминационном призыве предпочтителен универсальный смысл, при этом более узкое значение отмечено в сноске.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя יהוה; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Местопребывание Бога в выражении בְּהֵיכַל קָדְשׁוֹ
  choice: в Своём святом храме
  alternative: в Своём святом дворце / святилище
  rationale: «Храм» сохраняет одновременно представления о святом месте и царственном присутствии Бога, не разрешая прямо вопрос о земном или небесном храме.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Инверсия «А Яхве — в Своём святом храме» подчёркивает контраст с идолами; прописные местоимения передают традиционное русское благоговейное оформление, не добавляя смыслового уточнения.
