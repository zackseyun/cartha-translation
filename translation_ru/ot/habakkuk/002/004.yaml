source:
  edition: WLC
  text: הִנֵּ֣ה עֻפְּלָ֔ה לֹא יָשְׁרָ֥ה נַפְשׁ֖/וֹ בּ֑/וֹ וְ/צַדִּ֖יק בֶּ/אֱמוּנָת֥/וֹ יִחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/004.yaml
  text: 'Look: his soul is puffed up; it is not upright within him, but the righteous will live by his faithfulness.'
translation:
  language: ru
  text: Вот, душа его надменна, в нём нет прямоты; а праведник своей верностью будет жить.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а праведник будет жить своей верой». Еврейское слово может означать верность, стойкость или веру.'
    reason: Семантический диапазон אֱמוּנָה значим для понимания и истории толкования стиха; основной текст выбирает контекстуально вероятное «верностью», а примечание сохраняет подлинную неоднозначность.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественный для современного литературного русского указательный возглас, привлекающий внимание к резкому противопоставлению.
- source_word: עֻפְּלָה
  choice: надменна
  rationale: Редкая и трудная форма обозначает внутреннюю раздутость, высокомерие; «надменна» передаёт образ без тяжеловесной буквальности «вздута».
- source_word: נֶפֶשׁ
  choice: душа
  rationale: Сохраняет антропологический образ исходного текста; здесь речь о внутреннем существе и настрое человека.
- source_word: יָשְׁרָה
  choice: пряма
  rationale: Сохраняет метафору нравственной прямоты и противопоставление надменности.
- source_word: צַדִּיק
  choice: праведник
  rationale: Устоявшееся и точное обозначение человека, который прав перед Богом.
- source_word: אֱמוּנָה
  choice: верность
  rationale: В данном контексте еврейское слово естественно обозначает стойкую надёжность и верность; при этом местоименный суффикс сохранён как «своей».
- source_word: יִחְיֶה
  choice: будет жить
  rationale: Передаёт несовершенный вид и контекстуальную направленность обещания в будущее.
theological_decisions:
- issue: Значение בֶּאֱמוּנָתוֹ и принадлежность суффикса
  choice: «своей верностью» — верностью праведника
  alternative: «своей верой»; либо «его верностью» — верностью Бога
  rationale: Ближайший грамматический референт — «праведник», а אֱמוּנָה здесь допускает значение стойкости и верности. Перевод не отрицает богословского значения веры, но не подменяет конкретную семантику еврейского выражения позднейшими формулировками.
- issue: Характер обещанной жизни
  choice: Оставлено общее «будет жить»
  alternative: «останется в живых» или «получит вечную жизнь»
  rationale: Исходный текст не уточняет здесь объём понятия жизни; формулировка сохраняет его намеренную широту и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Инверсия «надменна душа его» слегка возвышает регистр, оставаясь понятной; точка с запятой ясно оформляет противопоставление двух типов человека.
