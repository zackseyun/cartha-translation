lexical_decisions:
- source_word: הֲלוֹא
  choice: Разве не
  rationale: Вводит риторический вопрос, предполагающий утвердительный ответ, и естественно сочетается с будущим временем.
- source_word: פֶתַע
  choice: внезапно
  rationale: Кратко и естественно передаёт неожиданность действия.
- source_word: יָקוּמוּ
  choice: восстанут
  rationale: Передаёт как вставание, так и враждебное выступление против адресата пророчества.
- source_word: נֹשְׁכֶיךָ
  choice: твои заимодавцы
  rationale: В контексте накопленного чужого имущества слово может обозначать тех, кто взыскивает долг; буквальный образ кусающих сохранён в сноске.
- source_word: וְיִקְצוּ
  choice: не пробудятся
  rationale: Сохраняет образ пробуждения и поэтический параллелизм с «восстанут».
- source_word: מְזַעְזְעֶיךָ
  choice: те, кто заставит тебя трепетать
  rationale: Передаёт каузативную идею потрясения и страха, не сужая её до конкретного вида мучения.
- source_word: וְהָיִיתָ
  choice: Тогда ты станешь
  rationale: «Тогда» естественно выражает результирующую связь с риторическим вопросом.
- source_word: לִמְשִׁסּוֹת
  choice: добычей
  rationale: Обозначает имущество или жертву, захваченные при разграблении; слово естественно в современном русском.
- source_word: לָמוֹ
  choice: для них
  rationale: Ясно указывает, что адресат станет добычей восставших против него.
