base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/002.yaml
  text: 'Then Yahweh answered me and said: “Write the vision; make it plain on tablets[a], so that one who reads it may run.”'
translation:
  language: ru
  text: 'И ответил мне Яхве и сказал: «Запиши видение и изложи его ясно на табличках, чтобы читающий его мог бежать».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «чтобы читающий мог бежать с ним» или «чтобы его можно было прочитать на бегу (быстро)». Еврейская фраза кратка и допускает несколько толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַיַּעֲנֵנִי וַיֹּאמֶר
  choice: И ответил мне… и сказал
  rationale: Сохраняет последовательность двух повествовательных форм и естественно звучит в возвышенной современной русской речи.
- source_word: כְּתוֹב חָזוֹן
  choice: Запиши видение
  rationale: «Запиши» естественно выражает повеление зафиксировать конкретное пророческое видение письменно.
- source_word: וּבָאֵר
  choice: ясно начертай его
  rationale: В контексте письма на табличках глагол указывает на ясное, разборчивое изложение; «начертай» сохраняет связь с физической записью.
- source_word: עַל הַלֻּחוֹת
  choice: на табличках
  rationale: Не уточняет материал, которого еврейский текст не называет.
- source_word: לְמַעַן יָרוּץ קוֹרֵא בוֹ
  choice: чтобы читающий его мог бежать
  rationale: Сохраняет компактный синтаксис, образ бега и неоднозначность связи чтения с бегом.
theological_decisions:
- issue: Смысл оборота לְמַעַן יָרוּץ קוֹרֵא בוֹ
  choice: чтобы читающий его мог бежать
  alternative: «чтобы прочитавший мог бежать с ним»; «чтобы его можно было прочитать на бегу (быстро)»
  rationale: Основной текст максимально близко воспроизводит явного субъекта «читающий» и глагол «бежать», не добавляя отсутствующего объекта «с ним» и не превращая образ в наречное указание скорости. Подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. «Таблички» выбрано вместо архаичного «скрижали», поскольку материал и культовая ассоциация в тексте не уточнены; «начертай» придаёт достоинство и передаёт физическую ясность записи.
