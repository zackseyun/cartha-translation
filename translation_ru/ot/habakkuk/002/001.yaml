base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/001.yaml
  text: I will stand at my guard post and station myself on the rampart[a]; I will keep watch to see what he will speak in me[b], and what I should answer concerning my complaint.
translation:
  language: ru
  text: Я встану на страже моей и стану на укреплении. Буду наблюдать, чтобы увидеть, что Он скажет мне[a] и что мне ответить относительно моей жалобы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что Он скажет во мне»; возможно, речь идёт о внутреннем пророческом слове.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «относительно моего упрёка (обличения)» или «относительно моего возражения (довода)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמַרְתִּי
  choice: на своём сторожевом посту
  rationale: Существительное может обозначать как несение стражи, так и место наблюдения; конкретный образ сторожевого поста естественно сочетается с глаголом «встану».
- source_word: אֶעֱמֹדָה
  choice: я встану
  rationale: Форма выражает решительное намерение пророка занять место и ждать ответа.
- source_word: וְאֶתְיַצְּבָה
  choice: и займу место
  rationale: Возвратная порода передаёт намеренное, твёрдое занятие позиции; русский оборот избегает тяжеловесного буквального «поставлю себя».
- source_word: מָצוֹר
  choice: укреплении
  rationale: Слово может обозначать укрепление или осадное сооружение; здесь оно служит возвышенной наблюдательной позицией. Нейтральное «укрепление» сохраняет образ без излишней конкретизации.
- source_word: וַאֲצַפֶּה
  choice: буду всматриваться
  rationale: Глагол обозначает напряжённое, ожидающее наблюдение; «всматриваться» передаёт и длительность, и сосредоточенность.
- source_word: לִרְאוֹת
  choice: чтобы увидеть
  rationale: Инфинитив выражает цель наблюдения; буквальная зрительная метафора сохраняется, хотя ожидается слово.
- source_word: מַה יְדַבֶּר בִּי
  choice: что Он скажет во мне
  rationale: Предлог בְּ буквально означает «в/во» и допускает понимание внутренней пророческой речи. Необычность выражения сохранена, а более идиоматичное понимание «мне» дано в сноске.
- source_word: אָשִׁיב
  choice: что мне ответить
  rationale: В данном контексте форма передаёт обдумывание ответа, который пророк даст после полученного слова.
- source_word: עַל תּוֹכַחְתִּי
  choice: по поводу моей жалобы
  rationale: תּוֹכַחַת имеет значения упрёка, обличения, возражения или спорного довода. В связи с предшествующим протестом Аввакума «жалоба» наиболее ясно передаёт контекст, а альтернативы отмечены в сноске.
theological_decisions:
- issue: Значение בִּי в выражении מַה יְדַבֶּר בִּי
  choice: внутренняя пророческая речь — «скажет во мне»
  alternative: обращённая к пророку речь — «скажет мне»
  rationale: Буквальное значение предлога поддерживает «во мне», тогда как контекст ожидания Божьего ответа позволяет понимать его идиоматически как «мне». Основной текст сохраняет формальную неоднозначность, а сноска сообщает естественную контекстуальную альтернативу.
- issue: Значение תּוֹכַחְתִּי
  choice: жалоба пророка
  alternative: упрёк, обличение или возражение/довод
  rationale: Предыдущая речь Аввакума является протестом перед Богом, поэтому «жалоба» звучит естественно и не предполагает, кто именно кого обличает. Лексически возможные более конфронтационные и судебные оттенки сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сторожевая метафора сохранена; синтаксис сделан ясным для обычного читателя. Местоимение «Он» указывает на подразумеваемого Бога, не добавляя имени, отсутствующего в еврейском тексте.
