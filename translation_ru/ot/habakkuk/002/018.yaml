  text: מָֽה הוֹעִ֣יל פֶּ֗סֶל כִּ֤י פְסָל/וֹ֙ יֹֽצְר֔/וֹ מַסֵּכָ֖ה וּ/מ֣וֹרֶה שָּׁ֑קֶר כִּ֣י בָטַ֞ח יֹצֵ֤ר יִצְר/וֹ֙ עָלָ֔י/ו לַ/עֲשׂ֖וֹת אֱלִילִ֥ים אִלְּמִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/018.yaml
  text: What profit is an idol when its maker has carved it— a cast image and a teacher of lies? For the one who formed it trusts in it[d][c][b][a], making mute idols.
translation:
  language: ru
  text: Что пользы от идола[a], раз его вырезал мастер, — от литого изваяния[b] и учителя лжи[c]? Ведь создатель полагается на своё творение, изготовляя немых идолов[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «резного изваяния». Слово обозначает изображение, служащее предметом ложного поклонения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изваяния из расплавленного металла».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «учителя лжи»; вероятно, идол олицетворён как тот, кто вводит своих почитателей в заблуждение.'
    reason: lexical_alternative
  - marker: d
    text: Еврейское слово אֱלִילִים может также передавать смысл «ничтожные идолы» или «ничто».
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הוֹעִיל
  choice: Какая польза
  rationale: Риторический вопрос передаёт значение пользы или выгоды и естественно звучит в современном русском языке.
- source_word: פֶּסֶל
  choice: идол
  rationale: Слово обозначает культовое изваяние, обычно резное; «идол» ясно передаёт его назначение, а способ изготовления выражен следующим глаголом.
- source_word: כִּי פְסָלוֹ יֹצְרוֹ
  choice: если мастер сам вырезал его
  rationale: Фраза подчёркивает абсурдность доверия предмету, изготовленному человеком. «Сам» естественно выявляет заложенную в контексте иронию, не добавляя нового участника.
- source_word: מַסֵּכָה
  choice: литое изваяние
  rationale: Имеется в виду металлическое изображение, изготовленное литьём; этот вариант точен и понятен современному читателю.
- source_word: וּמוֹרֶה שָּׁקֶר
  choice: учителя лжи
  rationale: Сохранена метафорическая персонификация идола как того, кто вводит поклоняющихся ему в заблуждение.
- source_word: כִּי בָטַח
  choice: Ведь … полагается
  rationale: «Ведь» сохраняет пояснительно-причинную связь, а «полагается на» естественно передаёт בטח с предлогом עַל.
- source_word: יֹצֵר יִצְרוֹ
  choice: тот, кто создал его
  rationale: Передано отношение между создателем и созданным предметом; буквальный этимологический повтор в русском был бы тяжеловесен.
- source_word: לַעֲשׂוֹת
  choice: делая
  rationale: Деепричастие сохраняет смысл сопутствующего действия либо результата, не устраняя возможный оттенок цели.
- source_word: אֱלִילִים
  choice: идолов
  rationale: Это ясное обозначение объектов ложного поклонения; возможный оттенок ничтожности вынесен в примечание.
- source_word: אִלְּמִים
  choice: немых
  rationale: Точно передаёт неспособность идолов говорить и сохраняет пророческую насмешку.
theological_decisions:
- issue: К кому относится выражение «учитель лжи»
  choice: К литому изваянию, персонифицированному как учитель лжи
  alternative: К мастеру или отдельному лжеучителю
  rationale: Синтаксис естественнее всего связывает «литое изваяние» и «учителя лжи» как два обозначения идола; при этом речь остаётся метафорической и не расширяется до отдельного догматического утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический вопрос и персонификация сохранены; архаизмы вроде «истукан» и «кумир» не использованы, чтобы текст оставался ясным обычному современному читателю.
