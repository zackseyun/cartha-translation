  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/016.yaml
  text: You have had your fill of shame instead of glory. Drink, you also, and show your uncircumcision! The cup from the LORD’s right hand will come around to you, and utter disgrace will be upon your glory.
translation:
  language: ru
  text: Ты пресытился позором вместо славы. Пей же и ты, и покажи свою необрезанность! Чаша из правой руки Господа обойдёт кругом и дойдёт до тебя, и полнейший позор[a] обрушится на твою славу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово редкое; его точный оттенок спорен. Здесь оно передано как усиленное обозначение позора.
    reason: Отмечает текстологически значимую лексическую неопределённость, не добавляя к тексту значение «мерзость» или иную спорную этимологию.
lexical_decisions:
- source_word: שָׂבַעְתָּ קָלוֹן מִכָּבוֹד
  choice: Ты пресытился позором вместо славы
  rationale: Сохраняет противопоставление «позор — слава» и образ насыщения до предела; предлог מִ передаёт замену ожидаемой славы позором.
- source_word: וְהֵעָרֵל
  choice: и покажи свою необрезанность
  rationale: Передаёт масоретское чтение как повеление от корня ערל и сохраняет унизительный образ публичного обнаружения необрезанности.
- source_word: תִּסּוֹב עָלֶיךָ כּוֹס יְמִין יְהוָה
  choice: Чаша из правой руки Господа обойдёт кругом и дойдёт до тебя
  rationale: Образ общей чаши, переходящей по кругу к адресату, выражен естественно по-русски; מִן понимается как движение чаши от правой руки Господа.
- source_word: קִיקָלוֹן
  choice: полнейший позор
  rationale: Редкое усиленное обозначение бесчестья передано без чрезмерно конкретизирующего истолкования.
theological_decisions:
- issue: Образ необрезанности
  choice: 'Сохранить буквально: «покажи свою необрезанность»'
  alternative: «обнажись» или «зашатайся»
  rationale: Масоретский текст прямо использует форму от ערל; буквальный образ важен для риторики унижения и не должен сглаживаться.
- issue: Чаша Господнего суда
  choice: Сохранить метафору чаши без поясняющей вставки «гнева»
  alternative: «чаша гнева Господа»
  rationale: Слово «гнев» в стихе отсутствует; контекст суда понятен, но добавлять богословское уточнение в основной текст не следует.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Параллелизм и резкие образы сохранены; синтаксис сделан понятным обычному читателю.
