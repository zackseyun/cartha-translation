lexical_decisions:
- source_word: יָעַצְתָּ
  choice: ты замыслил
  rationale: Qal perfect 2 м. ед. от יעץ обозначает намеренное обдумывание замысла; «замыслил» естественно передаёт враждебную направленность контекста.
- source_word: בֹּשֶׁת
  choice: позор
  rationale: Слово обозначает стыд или бесчестье; «позор» здесь ясно передаёт публичное унижение, навлечённое на дом.
- source_word: לְבֵיתֶךָ
  choice: для своего дома
  rationale: בַּיִת может означать дом, семью или династию. Буквальное «дом» сохраняет широту значения, а возвратное «своего» естественно при совпадении обладателя с субъектом.
- source_word: קְצוֹת
  choice: истребляя
  rationale: Инфинитив передаёт уничтожение или отсечение множества народов и может пониматься как обстоятельство средства; «истребляя» естественно выражает это по-русски.
- source_word: עַמִּים רַבִּים
  choice: многие народы
  rationale: עַמִּים — множественное коллективное обозначение народов; русский вариант не привносит современного смысла национального государства.
- source_word: וְחוֹטֵא
  choice: и согрешил
  rationale: Причастие Qal м. ед. от חטא после личной глагольной формы имеет последовательную глагольную функцию; прошедшее время сохраняет прямое обвинение.
- source_word: נַפְשֶׁךָ
  choice: собственной жизни
  rationale: נֶפֶשׁ может означать жизнь, душу или самого человека. В контексте суда «жизнь» подчёркивает саморазрушительное последствие поступков, не навязывая позднейшей антропологической схемы.
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте пророческого суда
  choice: жизнь
  alternative: душа; сам себя
  rationale: Контекст обличает насилие, обращающееся против самого виновника. «Жизнь» передаёт конкретную угрозу существованию, а сноска сохраняет реальные лексические альтернативы.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим обличением. Сохранены образ «дома» и неоднозначность נֶפֶשׁ; синтаксис сделан естественным без конфессиональной конкретизации.
