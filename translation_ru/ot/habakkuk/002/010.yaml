base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/010.yaml
  text: You have devised shame for your house by cutting off many peoples[a], and have sinned against your own life.
translation:
  language: ru
  text: Ты замыслил позор своему дому, истребляя многие народы и согрешая против собственной жизни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против собственной души»; или: «против самого себя».'
