base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/009.yaml
  text: Woe to him who gains evil profit for his house, to set his nest on high, to escape from the grasp of harm.
translation:
  language: ru
  text: Горе тому, кто наживает нечестную прибыль для своего дома, чтобы устроить своё гнездо на высоте и спастись из-под власти беды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из ладони беды». «Ладонь» здесь образно означает власть или хватку; слово «беда» может также означать зло, вред или несчастье.'
    reason: Поясняет образное выражение מִכַּף רָע и сохраняет семантическую неоднозначность רָע без неестественной буквальной кальки в основном тексте.
lexical_decisions:
- source_word: בֹּצֵעַ בֶּצַע רָע
  choice: наживает неправедную прибыль
  rationale: Однокоренное сочетание подчёркивает корыстное приобретение; «неправедную» естественно передаёт нравственную оценку רָע в данном контексте.
- source_word: לְבֵיתוֹ
  choice: для своего дома
  rationale: Сохраняет возможный смысл как семьи/династии, так и хозяйства, не сужая образ до одного значения.
- source_word: לָשׂוּם בַּמָּרוֹם קִנּוֹ
  choice: чтобы устроить своё гнездо на высоте
  rationale: Сохраняет метафору защищённого жилища, помещённого в недосягаемом месте.
- source_word: מִכַּף רָע
  choice: от руки беды
  rationale: כַּף буквально обозначает ладонь/руку и здесь выражает власть или хватку; רָע допускает значения зла, беды и вреда. «Беда» сохраняет смысл угрожающего несчастья.
theological_decisions:
- issue: Значение «дома»
  choice: Сохранено широкое «для своего дома»
  alternative: «для своей семьи» или «для своей династии»
  rationale: Еврейское בַּיִת может охватывать домохозяйство, семью и династию; контекст не требует выбрать лишь одно.
- issue: Неоднозначность רָע во второй строке
  choice: «беда»
  alternative: «зло», «вред», «несчастье»
  rationale: Фраза говорит о попытке избежать угрожающей силы или последствий; «беда» передаёт эту направленность, не вводя отдельного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой формулы «Горе тому» и образа высоко устроенного гнезда. Синтаксис сделан ясным, но параллелизм и причинно-целевая связь оригинала сохранены.
