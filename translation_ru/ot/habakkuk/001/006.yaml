source:
  edition: WLC
  text: כִּֽי הִנְ/נִ֤י מֵקִים֙ אֶת הַ/כַּשְׂדִּ֔ים הַ/גּ֖וֹי הַ/מַּ֣ר וְ/הַ/נִּמְהָ֑ר הַֽ/הוֹלֵךְ֙ לְ/מֶרְחֲבֵי אֶ֔רֶץ לָ/רֶ֖שֶׁת מִשְׁכָּנ֥וֹת לֹּא לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/006.yaml
  text: For behold[a], I am raising up the Chaldeans, that bitter and hasty nation[b], which marches through the broad places of the earth to seize dwelling places not its own.
translation:
  language: ru
  text: Ибо вот, Я поднимаю[a] халдеев[b] — народ свирепый[c] и стремительный, идущий по просторам земли, чтобы завладеть чужими жилищами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «побуждаю выступить»; еврейский глагол может означать как воздвижение силы, так и побуждение её к действию.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть вавилонян. В еврейском тексте буквально: «халдеев» — народ, связанный с Нововавилонской державой.'
    reason: historical_clarification
  - marker: c
    text: 'Буквально: «горький»; здесь слово характеризует суровый, жестокий нрав народа.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующего Божьего ответа и сохраняет причинно-пояснительную связь.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Передаёт указательно-эмфатическую силу конструкции естественно для современной литературной русской речи.
- source_word: מֵקִים
  choice: поднимаю
  rationale: Каузативная форма от קום означает, что Бог вызывает появление или выступление этой силы; «поднимаю» сохраняет прямое указание на Божье действие.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохранён буквальный этноним; исторически здесь имеются в виду халдеи, связанные с Нововавилонской державой.
- source_word: הַגּוֹי
  choice: народ
  rationale: В данном контексте слово обозначает этнополитическую общность; «народ» звучит естественнее русского «нация» в пророческом тексте.
- source_word: הַמַּר
  choice: свирепый
  rationale: Буквальное «горький» в этом описании выражает жестокий, суровый характер народа; «свирепый» ясно передаёт контекстуальный смысл, а буквальная метафора отмечена в сноске.
- source_word: וְהַנִּמְהָר
  choice: стремительный
  rationale: Передаёт быстроту и порывистость, выраженные прилагательным от מהר, без излишнего уточнения как «безрассудный».
- source_word: הַהוֹלֵךְ
  choice: идущий
  rationale: Сохраняет значение причастия «идущий» и не добавляет отсутствующего в оригинале прямого обозначения военного марша.
- source_word: לְמֶרְחֲבֵי אֶרֶץ
  choice: по просторам земли
  rationale: Естественно и близко передаёт образ широких пространств земли и масштаб продвижения.
- source_word: לָרֶשֶׁת
  choice: чтобы завладеть
  rationale: Глагол ירשׁ здесь означает овладение и занятие мест посредством завоевания; «завладеть» сохраняет идею присвоения.
- source_word: מִשְׁכָּנוֹת לֹא לוֹ
  choice: чужими жилищами
  rationale: Кратко и естественно передаёт «жилища, не принадлежащие ему»; форма согласуется с собирательным единственным числом «народ».
theological_decisions:
- issue: Божье действие в возвышении халдеев
  choice: Я поднимаю халдеев
  alternative: Я побуждаю халдеев выступить
  rationale: Еврейский текст прямо приписывает Богу действие, приводящее халдеев в движение или возвышающее их. Перевод сохраняет это напряжённое утверждение, не конкретизируя способ причинности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конструкция «Ибо вот, Я…» сохраняет торжественное эмфатическое начало без архаического «се». Причастие «идущий» удерживает образ оригинала, а «по просторам земли» звучит естественно и масштабно.
