  text: כֻּלֹּ/ה֙ בְּ/חַכָּ֣ה הֵֽעֲלָ֔ה יְגֹרֵ֣/הוּ בְ/חֶרְמ֔/וֹ וְ/יַאַסְפֵ֖/הוּ בְּ/מִכְמַרְתּ֑/וֹ עַל כֵּ֖ן יִשְׂמַ֥ח וְ/יָגִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/015.yaml
  text: He brings all of them up with a hook[a]; he drags him away with his net, and gathers him in with his dragnet[b]. Therefore he rejoices and exults.
translation:
  language: ru
  text: Всех их он вытаскивает крючком[a], увлекает добычу своей сетью и собирает её своим неводом[b]. Поэтому он радуется и ликует.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимает крючком». Еврейский текст переходит от собирательного обозначения всей добычи к формам единственного числа.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь употреблены два разных еврейских слова, обозначающих рыболовные сети: «сеть» и «невод».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: всех их
  rationale: Форма морфологически единственного числа имеет собирательное значение и относится к людям, уподобленным рыбам; русское «всех их» естественно передаёт эту множественность.
- source_word: בְּחַכָּה
  choice: крючком
  rationale: חַכָּה обозначает рыболовный крючок; краткое «крючком» ясно сохраняет образ рыбной ловли.
- source_word: הֵעֲלָה
  choice: вытаскивает
  rationale: Каузатив от עלה здесь означает поднятие улова из воды; «вытаскивает» естественно передаёт действие в контексте ловли.
- source_word: יְגֹרֵהוּ
  choice: увлекает добычу
  rationale: Глагол означает тащить или увлекать. Существительное «добычу» позволяет сохранить грамматический переход к единственному числу, не создавая в русском неясного местоимения мужского рода.
- source_word: בְחֶרְמוֹ
  choice: своей сетью
  rationale: חֵרֶם здесь означает рыболовную сеть; «своей» естественно передаёт притяжательный суффикс.
- source_word: וְיַאַסְפֵהוּ
  choice: и собирает её
  rationale: אָסַף означает собирать; местоимение единственного числа согласуется с «добычу» и сохраняет единственное число еврейского объектного суффикса.
- source_word: בְּמִכְמַרְתּוֹ
  choice: своим неводом
  rationale: מִכְמֶרֶת — вид сети, которой захватывают или стягивают улов. «Невод» отличает этот термин от חֵרֶם и остаётся понятным русскому читателю.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Оборот выражает следствие успешного захвата добычи.
- source_word: יִשְׂמַח וְיָגִיל
  choice: радуется и ликует
  rationale: Два близких глагола радости переданы разными русскими словами, причём «ликует» сохраняет усиление второго глагола.
theological_decisions:
- issue: Референт образа рыбной ловли
  choice: Сохранить метафору завоевателя, ловящего народы как рыбу, без поясняющей вставки в основной текст.
  alternative: Истолковать описание как буквальную рыбную ловлю или прямо назвать халдея и покорённые народы.
  rationale: Контекст Авв 1:14–17 указывает на метафору имперского насилия; перевод должен сохранить образность, не подменяя её толкованием.
- issue: Переход от собирательного объекта к единственному числу
  choice: Передать «всех их», а затем «добычу… её», сохранив смысловой переход к единственному числу.
  alternative: Всюду употребить множественное число ради синтаксической ровности.
  rationale: У יְגֹרֵהוּ и וְיַאַסְפֵהוּ имеются объектные суффиксы 3-го лица мужского рода единственного числа. Сглаживание до множественного числа устранило бы подлинную особенность еврейской поэтики.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Рыболовная метафора сохранена; различие двух видов сети отражено словами «сеть» и «невод». Формулировка «добычу… её» делает смену числа доступной и естественной по-русски.
