lexical_decisions:
- source_word: הַמַּשָׂא
  choice: пророческое изречение
  rationale: В заголовках пророческих книг מַשָּׂא обозначает весомое пророческое возвещение, нередко связанное с судом. «Пророческое изречение» передаёт жанровый смысл и не сводит слово к субъективному «бремени».
- source_word: אֲשֶׁר
  choice: которое
  rationale: Относительное местоимение естественно связывает заголовок с глаголом «увидел» и согласуется с существительным «изречение».
- source_word: חָזָה
  choice: увидел
  rationale: Сохранён буквальный зрительный образ древнееврейского глагола, употребляемого для пророческого восприятия откровения; способ откровения не уточняется пересказом.
- source_word: חֲבַקּוּק
  choice: Аввакум
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: הַנָּבִיא
  choice: пророк
  rationale: Титул прямо обозначает служение Аввакума и естественно передаётся по-русски.
theological_decisions:
- issue: Передача пророческого заголовка מַשָּׂא
  choice: пророческое изречение
  alternative: бремя; возвещение
  rationale: Основной вариант обозначает весомое пророческое сообщение, не утверждая, что речь непременно только о суде, и не превращая его в личную эмоциональную ношу пророка. Лексическая многозначность отражена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского заголовка. Формула «которое увидел» намеренно сохраняет пророческую зрительную метафору оригинала, хотя по-русски она несколько необычна.
