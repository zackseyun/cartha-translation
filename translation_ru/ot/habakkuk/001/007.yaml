  text: אָיֹ֥ם וְ/נוֹרָ֖א ה֑וּא מִמֶּ֕/נּוּ מִשְׁפָּט֥/וֹ וּ/שְׂאֵת֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/007.yaml
  text: It is dreadful and fearsome; its justice and authority[a] come from itself.
translation:
  language: ru
  text: Он грозен и страшен; его суд и власть[a] исходят от него самого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его право и достоинство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָיֹם
  choice: грозен
  rationale: Передаёт внушаемый ужас и угрожающую силу народа халдеев; в современном русском естественно сочетается со словом «страшен».
- source_word: וְנוֹרָא
  choice: и страшен
  rationale: Сохраняет усилительный параллелизм двух прилагательных и значение того, кто внушает страх.
- source_word: הוּא
  choice: он
  rationale: Местоимение мужского рода согласуется с подразумеваемым народом, о котором говорится в предыдущем стихе.
- source_word: מִמֶּנּוּ
  choice: от него самого
  rationale: 'Передаёт источник: этот народ не признаёт над собой внешней нормы, а выводит суд и власть из самого себя.'
- source_word: מִשְׁפָּטוֹ
  choice: его суд
  rationale: '«Суд» сохраняет широкий смысл מִשְׁפָּט: судебное решение, право и установленный порядок, не сужая его до современного понятия справедливости.'
- source_word: וּשְׂאֵתוֹ
  choice: и власть
  rationale: В данном параллелизме слово обозначает возвышенное положение или достоинство, проявляющееся как самоприсвоенная властная значимость; более буквальная альтернатива дана в сноске.
- source_word: יֵצֵא
  choice: исходят
  rationale: Передаёт образ происхождения из названного источника; множественное число естественно в русском при двух однородных подлежащих, хотя в еврейском стоит форма единственного числа.
