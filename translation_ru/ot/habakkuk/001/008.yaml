base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/008.yaml
  text: His horses are swifter than leopards and fiercer than wolves at dusk[a]. His horsemen spread out; his horsemen come from far away. They fly like an eagle hurrying to devour.
translation:
  language: ru
  text: Его кони быстрее леопардов и свирепее волков в сумерках. Его всадники рассыпаются; его всадники приходят издалека. Они летят, как орёл[a], что спешит пожрать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как гриф». Еврейское נֶשֶׁר может обозначать крупную хищную птицу или птицу, питающуюся падалью, не обязательно орла в современном зоологическом смысле.'
    reason: Лексическая неоднозначность названия птицы.
lexical_decisions:
- source_word: קַלּוּ מִנְּמֵרִים
  choice: быстрее барсов
  rationale: Форма от קלל здесь выражает быстроту в сравнении с נמר. «Барс» — естественное и традиционное русское обозначение крупной пятнистой кошки, соответствующее значению «леопард/пантера».
- source_word: סוּסָיו
  choice: его кони
  rationale: Сохранены притяжательное местоимение и множественное число; «кони» уместно в возвышенном повествовательном контексте и не звучит архаично.
- source_word: וְחַדּוּ מִזְּאֵבֵי עֶרֶב
  choice: и свирепее вечерних волков
  rationale: Буквальная идея остроты передана контекстуальным «свирепее». Сочетание «вечерние волки» сохраняет краткий и несколько поэтический образ исходного текста, не уточняя сверх сказанного, идёт ли речь о сумерках или о проголодавшихся к вечеру волках.
- source_word: וּפָשׁוּ
  choice: рассыпаются
  rationale: Глагол описывает широкое развёртывание или движение конницы. «Рассыпаются» естественно передаёт движение всадников в разные стороны, не вводя более конкретной тактики.
- source_word: פָּרָשָׁיו
  choice: его всадники
  rationale: Сохранён конкретный образ конных воинов и намеренный повтор слова в двух соседних частях стиха.
- source_word: מֵרָחוֹק יָבֹאוּ
  choice: издалека приходят
  rationale: Прямо переданы пространственное значение מֵרָחוֹק и обычное значение глагола בוא.
- source_word: יָעֻפוּ
  choice: они летят
  rationale: Прямое значение глагола сохраняет стремительность сравнения, не усиливая его до более конкретного «налетают» или «пикируют».
- source_word: כְּנֶשֶׁר
  choice: как орёл
  rationale: «Орёл» сохраняет традиционное и контекстуально подходящее обозначение крупной стремительной хищной птицы; более широкая зоологическая возможность отмечена в сноске.
- source_word: חָשׁ לֶאֱכוֹל
  choice: спешащий пожрать
  rationale: Причастная конструкция передаёт поспешность, а «пожрать» — хищнический и насильственный оттенок употреблённого применительно к птице глагола «есть», без добавления отсутствующего в еврейском тексте объекта.
