base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/016.yaml
  text: Therefore he sacrifices to his net and burns incense to his dragnet[a], because by them his portion is rich and his food is plentiful.
translation:
  language: ru
  text: Поэтому он приносит жертвы своей сети и воскуряет фимиам своему неводу, ведь благодаря им доля его богата и пища его обильна.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доля его тучна, и пища его тучна (отборна)». В еврейском тексте тучность служит образом достатка и процветания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт логическое следствие из предшествующего описания успехов завоевателя.
- source_word: יְזַבֵּחַ
  choice: приносит жертвы
  rationale: Порода piel здесь обозначает жертвоприношение, а не просто заклание.
- source_word: לְחֶרְמוֹ
  choice: своей сети
  rationale: В рыболовной метафоре חֵרֶם означает сеть; притяжательное местоимение передаёт суффикс первого лица владельца в отношении действующего лица.
- source_word: וִיקַטֵּר
  choice: и воскуряет
  rationale: Сохраняет культовый смысл кадильного приношения и звучит естественно в возвышенном библейском регистре.
- source_word: לְמִכְמַרְתּוֹ
  choice: своему неводу
  rationale: Невод обозначает большую заградительную рыболовную сеть и позволяет сохранить различие между חֵרֶם и מִכְמֶרֶת.
- source_word: כִּי בָהֵמָּה
  choice: ведь благодаря им
  rationale: 'Предлог בְּ имеет инструментальное значение: богатство приобретается посредством этих орудий.'
- source_word: שָׁמֵן חֶלְקוֹ
  choice: доля его тучна
  rationale: Сохраняет конкретный древнееврейский образ тучности как знака изобилия, не сводя его только к абстрактному богатству.
- source_word: וּמַאֲכָלוֹ בְּרִיאָה
  choice: и пища его изобильна
  rationale: בְּרִיאָה применительно к пище выражает упитанность, добротность и обилие; «изобильна» естественно передаёт смысл в современном русском.
theological_decisions:
- issue: Идолопоклоннический язык в отношении орудий завоевания
  choice: Сохранено прямое изображение жертвоприношения сети и воскурения неводу.
  alternative: Передать это только как чрезмерное упование на военную силу.
  rationale: Еврейский текст употребляет явные культовые глаголы; возможный переносный смысл должен возникать из этого образа, а не заменять его.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Воскуряет» сохраняет культовую окраску, а пара «сеть — невод» воспроизводит различие двух рыболовных орудий. Местоимения после существительных в заключительной строке поддерживают поэтический ритм.
