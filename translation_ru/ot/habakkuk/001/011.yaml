  yaml_path: translation/ot/habakkuk/001/011.yaml
  text: Then he sweeps by like the wind and passes on—he becomes guilty[b][a]; this strength of his is his god.
translation:
  language: ru
  text: Тогда он проносится, как ветер[a], и проходит дальше — становится виновным; эта его сила — его бог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «ветер», может также означать «дух»; здесь контекст указывает на стремительное, неудержимое движение, подобное ветру.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и становится виновным, приписывая эту силу своему богу»; возможно также: «его сила принадлежит его богу». Заключительная еврейская фраза сжата и допускает несколько истолкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной переход к следующему этапу описания естественным современным русским языком.
- source_word: חָלַף
  choice: проносится
  rationale: В сочетании с רוּחַ выражает стремительное движение, подобное порыву ветра, и соответствует военному контексту.
- source_word: רוּחַ
  choice: словно ветер
  rationale: Слово может означать «ветер» или «дух»; контекст стремительного движения делает образ ветра наиболее вероятным. «Словно» естественно передаёт сжатое сравнение.
- source_word: וַיַּעֲבֹר
  choice: и идёт дальше
  rationale: Продолжает образ неудержимого продвижения и сохраняет последовательность действий.
- source_word: וְאָשֵׁם
  choice: и становится виновным
  rationale: Сохраняет глагольный смысл приобретения или навлечения вины, не сводя выражение к статическому признаку.
- source_word: זוּ
  choice: эта
  rationale: Указательное слово соотнесено с последующим существительным женского рода «сила».
- source_word: כֹחוֹ
  choice: его сила
  rationale: Обозначает описанную выше военную мощь; «сила» сохраняет прямоту исходного образа.
- source_word: לֵאלֹהוֹ
  choice: его бог
  rationale: Сжатая конструкция с ל допускает несколько истолкований; в основном тексте передано понимание, согласно которому завоеватель делает собственную силу своим богом.
theological_decisions:
- issue: Толкование заключительной фразы זוּ כֹחוֹ לֵאלֹהוֹ
  choice: Завоеватель виновен, потому что его собственная сила стала для него богом.
  alternative: Он виновен, приписывая эту силу своему богу; либо его сила принадлежит его богу.
  rationale: Еврейская фраза предельно сжата и синтаксически неоднозначна. В контексте высокомерного насилия чтение о превращении собственной мощи в бога хорошо связывает заключительную фразу с обвинением во вине, однако иные грамматические истолкования сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Динамичные глаголы передают стремительность завоевателя; неоднозначность заключительной фразы не скрыта, а вынесена в примечание.
