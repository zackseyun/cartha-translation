base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/017.yaml
  text: Will he therefore keep emptying his net and continually slaughtering nations without mercy?[a][b]
translation:
  language: ru
  text: Неужели поэтому он будет и дальше опорожнять свой невод[a] и непрестанно убивать народы, не щадя их?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою рыболовную сеть». Еврейское слово обозначает рыболовную снасть, в данном контексте — сеть или невод.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не жалея их». Еврейский глагол может означать как «щадить», так и «жалеть, проявлять сострадание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל כֵּן
  choice: Неужели поэтому
  rationale: Вопросительная частица вместе с עַל־כֵּן вводит риторический вопрос, вытекающий из предыдущего стиха; перевод сохраняет и вопросительную, и следственную связь.
- source_word: יָרִיק
  choice: будет и дальше опустошать
  rationale: Порода hифиль глагола ריק означает «опорожнять, опустошать». В образе рыбака речь идёт об освобождении невода от улова; сочетание «и дальше» передаёт продолжительный или повторяющийся характер имперского насилия.
- source_word: חֶרְמוֹ
  choice: свой невод
  rationale: Существительное обозначает рыболовную сеть, вероятно крупную сеть типа невода. «Невод» естественно продолжает рыболовную метафору и не смешивается с обычным современным значением слова «сеть».
- source_word: וְתָמִיד
  choice: и непрестанно
  rationale: תָמִיד выражает постоянство или непрерывную повторяемость действия; «непрестанно» сохраняет эту усиленную характеристику.
- source_word: לַהֲרֹג
  choice: убивать
  rationale: Инфинитив הרג означает «убивать». Контекст массового покорения народов уже ясно передаёт жестокость, поэтому нейтрально-сильное «убивать» не добавляет к исходному слову оттенков способа убийства.
- source_word: גּוֹיִם
  choice: народы
  rationale: Здесь גּוֹיִם обозначает покоряемые этнополитические общности; «народы» уместнее, чем конфессионально окрашенное «язычники».
- source_word: לֹא יַחְמֹל
  choice: не щадя их
  rationale: חמל может означать «щадить» или «жалеть, проявлять сострадание». Деепричастная конструкция естественна по-русски и сохраняет отрицание; местоимение «их» явно соотносит действие с народами.
theological_decisions:
- issue: Продолжится ли безнаказанное насилие завоевателя
  choice: Сохранён открытый риторический вопрос без добавленного ответа
  alternative: Передать как утверждение или явно обозначить ожидаемый отрицательный ответ
  rationale: Еврейский текст завершает жалобу вопросом и оставляет напряжение перед последующим ответом Бога; перевод не должен преждевременно разрешать его.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Риторическое «неужели» передаёт протест пророка; «и дальше» естественно выражает повторяемость действия. Рыболовная метафора сохранена без пояснения в основном тексте.
