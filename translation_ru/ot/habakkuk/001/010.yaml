base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/010.yaml
  text: He mocks kings[a], and rulers are a laughingstock to him. He laughs at every fortress; he heaps up earth and captures it.
translation:
  language: ru
  text: Он насмехается над царями, и правители для него — посмешище. Он смеётся над любой крепостью, насыпает землю[a] и захватывает её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «насыпает землю (или прах)». Речь идёт о земляной осадной насыпи, по которой войско подступало к укреплению, чтобы взять его.'
    reason: cultural_note
lexical_decisions:
- source_word: יִתְקַלָּס
  choice: насмехается
  rationale: Возвратная порода передаёт презрительную насмешку; этот вариант естественен по-русски и соответствует параллельной строке.
- source_word: רֹזְנִים
  choice: правители
  rationale: Слово обозначает влиятельных властителей или высших сановников; «правители» ясно и без архаизации передаёт политический смысл.
- source_word: מִשְׂחָק לוֹ
  choice: для него — посмешище
  rationale: Существительное обозначает предмет смеха и презрения; «посмешище» сохраняет резкую уничижительную окраску.
- source_word: מִבְצָר
  choice: крепость
  rationale: Слово обозначает укреплённое место; «крепость» естественно передаёт военный смысл и сохраняет обобщающее единственное число.
- source_word: יִשְׂחָק
  choice: смеётся над
  rationale: Форма от שׂחק выражает здесь презрительный смех; буквальный образ сохранён без замены на более толковательное выражение.
- source_word: וַיִּצְבֹּר עָפָר
  choice: насыпает землю
  rationale: Сохранён буквальный образ насыпания земли, тогда как его осадный смысл пояснён в сноске.
- source_word: וַיִּלְכְּדָהּ
  choice: захватывает её
  rationale: Глагол имеет военное значение захвата, а местоимение женского рода соотнесено с «крепостью».
- source_word: הוּא
  choice: Он
  rationale: Местоимение относится к описанному в контексте завоевателю как собирательно представленному лицу; мужской род сохраняет структуру еврейского текста.
