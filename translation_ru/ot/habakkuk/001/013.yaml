  text: טְה֤וֹר עֵינַ֨יִם֙ מֵ/רְא֣וֹת רָ֔ע וְ/הַבִּ֥יט אֶל עָמָ֖ל לֹ֣א תוּכָ֑ל לָ֤/מָּה תַבִּיט֙ בּֽוֹגְדִ֔ים תַּחֲרִ֕ישׁ בְּ/בַלַּ֥ע רָשָׁ֖ע צַדִּ֥יק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/013.yaml
  text: Your eyes are too pure to look on evil[a], and you cannot gaze at wrongdoing[c][b]. Why then do you look on the treacherous and keep silent when the wicked swallows up one more righteous than he?
translation:
  language: ru
  text: Твои глаза слишком чисты, чтобы видеть зло[a], и Ты не можешь смотреть на злодеяние[b]. Почему же Ты смотришь на вероломных и молчишь, когда нечестивый пожирает того, кто праведнее его[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чист глазами от видения зла»; возможный перевод: «слишком чист, чтобы смотреть на зло».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «бедствие», «тяготу» или «зло, причиняющее страдание».
    reason: lexical_alternative
  - marker: c
    text: То есть праведнее самого нечестивого; это сравнительное утверждение, а не обязательно признание абсолютной праведности.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְהוֹר עֵינַיִם מֵרְאוֹת רָע
  choice: Твои глаза слишком чисты, чтобы видеть зло
  rationale: Сохранён еврейский образ «чистых глаз» и выраженная конструкцией с מִן несовместимость со злом; русское «слишком чисты, чтобы» естественно передаёт смысл, не превращая поэтическое утверждение в отрицание Божьего знания о зле.
- source_word: וְהַבִּיט אֶל עָמָל לֹא תוּכָל
  choice: и смотреть на злодеяние Ты не можешь
  rationale: «Смотреть на» передаёт הביט и сохраняет связь с последующим риторическим вопросом. עָמָל в данном контексте обозначает нравственное зло, причиняющее страдание; «злодеяние» выражает этот оттенок без устранения других возможных значений, отмеченных в сноске.
- source_word: לָמָּה תַבִּיט בּוֹגְדִים
  choice: Почему же Ты смотришь на вероломных
  rationale: «Же» естественно обозначает резкий риторический контраст. «Вероломные» передаёт причастное בּוֹגְדִים — людей, поступающих неверно и предательски.
- source_word: תַּחֲרִישׁ
  choice: молчишь
  rationale: Прямо передаёт חרש в значении «быть безмолвным, не отвечать» и сохраняет жалобу пророка на кажущееся отсутствие Божьего вмешательства.
- source_word: בְּבַלַּע רָשָׁע
  choice: когда нечестивый пожирает
  rationale: Конструкция с инфинитивом обозначает обстоятельство, при котором Бог молчит. «Пожирает» сохраняет яркий образ поглощения и насилия.
- source_word: צַדִּיק מִמֶּנּוּ
  choice: того, кто праведнее его
  rationale: Сравнительное מִן передано явно. Формулировка говорит об относительной праведности жертвы по сравнению с нечестивым, не приписывая ей абсолютной безгрешности.
theological_decisions:
- issue: Отношение Бога ко злу в начальном утверждении
  choice: Сохранить поэтическое утверждение о Божьей нравственной чистоте и несовместимости со злом, не истолковывая его как буквальную неспособность Бога замечать зло.
  alternative: 'Перевести более толковательно: «Ты не можешь терпеть зло».'
  rationale: Последующий вопрос сам говорит, что Бог «смотрит» на вероломных. Эта напряжённость составляет суть жалобы Аввакума и не должна устраняться переводом.
- issue: Характер праведности жертвы
  choice: 'Передать צַדִּיק מִמֶּנּוּ сравнительно: «того, кто праведнее его».'
  alternative: Назвать жертву просто «праведником».
  rationale: Еврейский текст прямо сравнивает двух участников и не требует утверждения об абсолютной праведности поглощаемого.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Синтаксический параллелизм и намеренное напряжение между «не можешь смотреть» и «почему же Ты смотришь» сохранены.
