  text: הֲ/ל֧וֹא אַתָּ֣ה מִ/קֶּ֗דֶם יְהוָ֧ה אֱלֹהַ֛/י קְדֹשִׁ֖/י לֹ֣א נָמ֑וּת יְהוָה֙ לְ/מִשְׁפָּ֣ט שַׂמְתּ֔/וֹ וְ/צ֖וּר לְ/הוֹכִ֥יחַ יְסַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/012.yaml
  text: Are you not from of old, O Yahweh my God, my Holy One? We will not die.[a] O Yahweh, you have appointed him for judgment, and you, O Rock, have established him for reproof.
translation:
  language: ru
  text: Не Ты ли издревле, Яхве, Бог мой, Святой мой? Мы не умрём.[a] Яхве, Ты поставил его для суда, и Ты, Скала, утвердил его для обличения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно иному чтению, сохранившемуся в некоторых традициях: «Ты не умираешь». В еврейском масоретском тексте: «Мы не умрём».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹוא
  choice: Не Ты ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет характер обращения пророка к Богу.
- source_word: מִקֶּדֶם
  choice: издревле
  rationale: Обозначает существование с древнейших времён, не усиливая выражение до однозначного философского утверждения «от вечности».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: Сохраняет первое лицо единственного числа и личный характер обращения.
- source_word: קְדֹשִׁי
  choice: мой Святой
  rationale: Прилагательное употреблено как существительное с притяжательным суффиксом; русский вариант сохраняет обращение-титул.
- source_word: לֹא נָמוּת
  choice: Мы не умрём
  rationale: Масоретская огласовка и форма глагола указывают на первое лицо множественного числа; перевод сохраняет прямое чтение текста.
- source_word: לְמִשְׁפָּט
  choice: для суда
  rationale: Передаёт судебную цель назначения халдеев как орудия Божьего суда.
- source_word: שַׂמְתּוֹ
  choice: Ты поставил его
  rationale: Глагол שׂים означает «поставить, поместить, назначить»; здесь речь о целевом назначении Божьего орудия.
- source_word: צוּר
  choice: Скала
  rationale: Сохраняет традиционный божественный титул, выражающий твёрдость, надёжность и силу.
- source_word: לְהוֹכִיחַ
  choice: для обличения
  rationale: Сохраняет судебно-дисциплинарный диапазон значения יכח и не сужает его до одного лишь наказания.
- source_word: יְסַדְתּוֹ
  choice: утвердил его
  rationale: Передаёт значение прочного установления или определения для назначенной цели.
theological_decisions:
- issue: Лицо и смысл выражения לֹא נָמוּת
  choice: Мы не умрём
  alternative: Ты не умираешь
  rationale: Масоретский текст читается в первом лице множественного числа и выражает уверенность пророка, что народ не будет окончательно уничтожен судом. Альтернативное чтение, засвидетельствованное некоторыми традициями и относящее бессмертие непосредственно к Богу, сохранено в сноске, но не заменяет основное чтение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Безглагольная формула «Не Ты ли издревле» сохраняет лаконичность и некоторую синтаксическую напряжённость еврейского обращения. Божественные титулы «Святой» и «Скала» написаны с прописной буквы.
