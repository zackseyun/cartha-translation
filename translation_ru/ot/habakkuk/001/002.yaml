  text: עַד אָ֧נָה יְהוָ֛ה שִׁוַּ֖עְתִּי וְ/לֹ֣א תִשְׁמָ֑ע אֶזְעַ֥ק אֵלֶ֛י/ךָ חָמָ֖ס וְ/לֹ֥א תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/002.yaml
  text: How long, O LORD, have I cried for help and you do not hear? I cry out to you, “Violence!” and you do not save.
translation:
  language: ru
  text: 'Доколе, Господи, я взываю о помощи, а Ты не слышишь? Я кричу Тебе: «Насилие!» — а Ты не спасаешь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Доколе
  rationale: Краткая и dignified современная литературная передача вопроса о продолжительности невыносимого положения.
- source_word: יְהוָה
  choice: Господи
  rationale: В обращении передаёт тетраграмматон традиционным русским титулом в звательном значении.
- source_word: שִׁוַּעְתִּי
  choice: я буду взывать о помощи
  rationale: Глагол обозначает настойчивый зов о помощи; в сочетании с עַד־אָנָה совершенная форма выражает продолжающееся до настоящего момента действие, естественно передаваемое по-русски конструкцией «буду взывать».
- source_word: תִשְׁמָע
  choice: слышишь
  rationale: Сохраняет прямой антропоморфный язык жалобы и не ослабляет его до «не отвечаешь».
- source_word: חָמָס
  choice: Насилие!
  rationale: Передаёт возглас, называющий жестокое беззаконие и взывающий о вмешательстве.
- source_word: תוֹשִׁיעַ
  choice: спасаешь
  rationale: Сохраняет широкий смысл избавления или спасительного вмешательства без добавления объекта.
theological_decisions:
- issue: Форма жалобы о том, что Бог не слышит и не спасает
  choice: 'Сохранено прямое обращение: «Ты не слышишь… Ты не спасаешь»'
  alternative: Смягчить до «не отвечаешь» или «не вмешиваешься»
  rationale: Еврейский текст намеренно выражает напряжённую пророческую жалобу; перевод не должен заранее разрешать её богословское напряжение.
- issue: Временное значение שִׁוַּעְתִּי после עַד־אָנָה
  choice: «я буду взывать»
  alternative: «я взывал» / «я взываю»
  rationale: Вопрос «доколе» представляет действие как уже продолжающееся и всё ещё не завершённое; русская конструкция естественно выражает эту длительность, хотя морфологически еврейский глагол имеет перфектную форму.
translation_notes:
  register: Современный литературный русский с достоинством пророческой жалобы. «Доколе» уместно в возвышенном обращении, но остаётся широко понятным. Заглавные «Ты/Тебе» использованы как русская издательская форма почтительного обращения к Богу.
