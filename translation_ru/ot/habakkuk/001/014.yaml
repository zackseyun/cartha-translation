base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/014.yaml
  text: You make man like the fish of the sea[a], like creeping things that have no ruler over them.
translation:
  language: ru
  text: Ты делаешь людей подобными морским рыбам[a], подобными ползающим существам, над которыми нет правителя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рыбам моря».'
    reason: Сохраняется буквальная форма еврейского поэтического выражения, тогда как в основном тексте употреблена более естественная русская конструкция.
lexical_decisions:
- source_word: וַתַּעֲשֶׂה
  choice: Ты сделал
  rationale: Форма с вау и имперфектом в обращённой к Богу жалобе допускает описание совершённого им положения. Русское прошедшее время естественно передаёт итоговое состояние и сохраняет прямоту обвинения.
- source_word: אָדָם
  choice: людей
  rationale: Существительное стоит в единственном числе, но здесь имеет собирательное значение — человечество или людей вообще. В современном русском множественное «людей» ясно выражает эту референцию без архаического оттенка слова «человек» в собирательном употреблении.
- source_word: כִּדְגֵי הַיָּם
  choice: подобными морским рыбам
  rationale: Передаёт сравнительную конструкцию и естественно звучит по-русски; «морским рыбам» соответствует буквальному «рыбам моря».
- source_word: כְּרֶמֶשׂ
  choice: пресмыкающимся
  rationale: רֶמֶשׂ обозначает ползающих или мелких движущихся существ. «Пресмыкающиеся» сохраняет традиционный библейский образ, не сводя его строго к современной зоологической категории.
- source_word: לֹא מֹשֵׁל בּוֹ
  choice: у которых нет правителя
  rationale: Причастие מֹשֵׁל передано существительным «правитель». Хотя местоименный суффикс в еврейском единственного числа, в русском согласование во множественном числе естественно относится к собирательно понятым людям и существам сравнения.
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: людей
  alternative: человека; человечество
  rationale: Контекст представляет людей как беспомощное множество, подобное рыбам и ползающим существам. «Людей» сохраняет общий человеческий охват, тогда как «человечество» звучало бы более отвлечённо, а «человека» могло бы быть понято как указание на отдельное лицо.
- issue: Время וַתַּעֲשֶׂה в жалобе пророка
  choice: Ты сделал
  alternative: Ты делаешь
  rationale: Обе формы возможны по контексту пророческой жалобы. Прошедшее время подчёркивает положение, в которое Бог допустил попасть людям, не устраняя напряжения прямого обращения к Нему.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной прямоты пророческой жалобы. Местоимение «Ты» написано с прописной буквы как принятая в русском библейском стиле форма обращения к Богу. Синтаксис сохраняет два параллельных сравнения.
