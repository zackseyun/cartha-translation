id: HAB.1.3
reference: Habakkuk 1:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ֣/מָּה תַרְאֵ֤/נִי אָ֨וֶן֙ וְ/עָמָ֣ל תַּבִּ֔יט וְ/שֹׁ֥ד וְ/חָמָ֖ס לְ/נֶגְדִּ֑/י וַ/יְהִ֧י רִ֦יב וּ/מָד֖וֹן יִשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/003.yaml
  text: Why do you make me see wrongdoing[a], and why do you look at trouble? Destruction and violence are before me; strife comes to be[c][b], and contention rises up.
translation:
  language: ru
  text: Почему Ты заставляешь меня видеть беззаконие[a] и смотришь на бедствие? Разорение[b] и насилие — передо мной; возникает распря, и поднимается раздор[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему Ты показываешь мне неправду?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Опустошение» или «грабёж».'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительные слова можно также передать: «появляется распря, и раздор набирает силу»; буквально последняя форма связана с поднятием или несением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Почему
  rationale: Краткое и естественное вопросительное слово сохраняет форму прямой жалобы.
- source_word: תַרְאֵנִי
  choice: заставляешь меня видеть
  rationale: Передаёт каузативную форму глагола ראה и не смягчает напряжённость обращения пророка к Богу.
- source_word: אָוֶן
  choice: беззаконие
  rationale: В данном контексте слово обозначает нравственное зло и неправедные поступки; «беззаконие» уместно в возвышенной, но понятной современной речи.
- source_word: עָמָל
  choice: бедствие
  rationale: Здесь слово указывает не на нейтральный труд, а на тягостное зло, причиняемый вред и страдание.
- source_word: תַּבִּיט
  choice: смотришь на
  rationale: Прямо передаёт значение «смотреть, взирать», не добавляя толкования о Божьем попустительстве или бездействии.
- source_word: שֹׁד
  choice: разорение
  rationale: Передаёт насильственное опустошение и допускаемый контекстом оттенок грабежа.
- source_word: חָמָס
  choice: насилие
  rationale: Обычное и прозрачное соответствие пророческому термину, который включает насильственную несправедливость.
- source_word: לְנֶגְדִּי
  choice: передо мной
  rationale: Естественно передаёт то, что постоянно находится перед глазами пророка.
- source_word: וַיְהִי
  choice: возникает
  rationale: Сохраняет событийную динамику формы היה, а не сводит её к простому «есть».
- source_word: רִיב
  choice: распря
  rationale: Передаёт спор и общественную вражду, не ограничивая значение исключительно судебной тяжбой.
- source_word: מָדוֹן
  choice: раздор
  rationale: Сохраняет параллелизм с «распрей», одновременно различая близкие по смыслу слова.
- source_word: יִשָּׂא
  choice: поднимается
  rationale: Сохраняет образ подъёма или усиления раздора, не делая более определённым неоднозначный краткий оборот.
theological_decisions:
- issue: Следует ли смягчать подразумеваемую в первых глаголах причастность Бога к тому, что видит пророк
  choice: 'Сохранить прямое обращение и каузатив: «Ты заставляешь меня видеть… и смотришь…»'
  alternative: «Ты позволяешь мне видеть… и терпишь…»
  rationale: Еврейский текст прямо обращён к Богу и употребляет каузативную форму «заставляешь видеть», за которой следует простой глагол «смотреть». Перевод сохраняет напряжённость плача, не превращая её в готовое богословское объяснение.
- issue: Следует ли понимать заключительные слова как простое наличие конфликта или как его возникновение и усиление
  choice: «возникает распря, и поднимается раздор»
  alternative: «есть распря, и раздор усиливается»
  rationale: Выбранная формулировка сохраняет глагольную динамику וַיְהִי и образ подъёма в יִשָּׂא, не устраняя синтаксическую и образную напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Прямота обращения к Богу сохранена; архаизмы и конфессионально окрашенные уточнения не добавлены. Пара «распря — раздор» воспроизводит смысловой параллелизм близких еврейских существительных.
