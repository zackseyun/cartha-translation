  text: עַל כֵּן֙ תָּפ֣וּג תּוֹרָ֔ה וְ/לֹֽא יֵצֵ֥א לָ/נֶ֖צַח מִשְׁפָּ֑ט כִּ֤י רָשָׁע֙ מַכְתִּ֣יר אֶת הַ/צַּדִּ֔יק עַל כֵּ֛ן יֵצֵ֥א מִשְׁפָּ֖ט מְעֻקָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/004.yaml
  text: Therefore the law grows numb, and justice never goes forth. For the wicked surrounds the righteous; therefore justice goes forth twisted.
translation:
  language: ru
  text: Поэтому закон бездействует, и правосудие никогда не вершится. Ведь нечестивый окружает праведного; поэтому правосудие вершится превратно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּפוּג תּוֹרָה
  choice: закон утратил силу
  rationale: Глагол פוג передаёт ослабление, оцепенение или утрату действенности; сочетание естественно выражает мысль о законе, который перестал действовать. תּוֹרָה здесь — закон/наставление в общественно-нравственном контексте.
- source_word: וְלֹא־יֵצֵא לָנֶצַח מִשְׁפָּט
  choice: и правосудие никогда не совершается
  rationale: Буквально משפט «не выходит»; в контексте речь о том, что справедливое судебное решение не осуществляется. לָנֶצַח в отрицательной конструкции передано как «никогда».
- source_word: מַכְתִּיר אֶת־הַצַּדִּיק
  choice: теснит праведного
  rationale: Редкая форма допускает образы окружения, обступания или стеснения. «Теснит» сохраняет враждебное преобладание нечестивого и звучит естественно, не уточняя сверх текста, полностью ли он окружает праведного.
- source_word: יֵצֵא מִשְׁפָּט מְעֻקָּל
  choice: суд выходит извращённым
  rationale: Сохранён повтор глагола יצא и образ искривлённого, искажённого суда; מְעֻקָּל означает «искривлённый, извращённый», то есть утративший справедливость.
theological_decisions:
- issue: Значение תּוֹרָה
  choice: закон
  alternative: наставление
  rationale: Контекст насилия и судебной несправедливости поддерживает общественно-правовой оттенок, но перевод не ограничивает слово конкретным законодательным кодексом.
- issue: Соотношение משפט как процесса и решения
  choice: «правосудие» в первой строке, «суд» во второй
  alternative: в обоих случаях «правосудие» или «суд»
  rationale: Первое употребление естественно обозначает осуществление справедливости, второе — результат судебного процесса. Различение передаёт контекстуальные оттенки без изменения богословского содержания.
translation_notes:
  register: Современный литературный русский язык, сдержанный пророческий регистр. Сохранены причинные связки «поэтому — ведь — поэтому» и напряжение между бездействующим законом и действующим, но искажённым судом.
