base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/005.yaml
  text: Look among the nations and see[a]; be astonished, be astounded[b]. For I am doing a work in your days that you would not believe if it were told.
translation:
  language: ru
  text: Посмотрите на народы и вглядитесь; изумитесь, глубоко изумитесь[a]! Ведь Я совершаю в ваши дни дело, которому вы не поверили бы, если бы вам о нём рассказали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изумитесь, изумитесь»; повтор однокоренных форм усиливает повеление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ведь в ваши дни совершается дело, которому вы не поверите, когда о нём расскажут». В еврейском тексте субъект действия прямо не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ בַגּוֹיִם
  choice: Посмотрите на народы
  rationale: Множественное повелительное רְאוּ передаёт призыв посмотреть, а בַגּוֹיִם допускает значение «на народы» или «среди народов». В основном тексте выбрано естественное русское «на народы», при сохранении альтернативы в примечании.
- source_word: וְהַבִּיטוּ
  choice: и вглядитесь
  rationale: Глагол הביט обозначает направленный, внимательный взгляд. «Вглядитесь» отличает его от предшествующего ראה и сохраняет нарастание призыва.
- source_word: וְהִתַּמְּהוּ תְּמָהוּ
  choice: изумитесь, поразитесь
  rationale: Две формы одного корня תמה создают усиление. Пара близких русских глаголов передаёт повтор и риторическую силу без неестественной тавтологии.
- source_word: פֹעַל פֹּעֵל
  choice: Я совершаю ... дело
  rationale: Сочетание существительного и причастия от одного корня подчёркивает действие. Русская конструкция естественна и сохраняет слово «дело»; местоимение «Я» восполняет подразумеваемого в контексте божественного говорящего.
- source_word: בִּימֵיכֶם
  choice: в ваши дни
  rationale: Близкая к форме оригинала и понятная по-русски передача временной непосредственности пророчества.
- source_word: לֹא תַאֲמִינוּ כִּי יְסֻפָּר
  choice: которому вы не поверили бы, если бы вам о нём рассказали
  rationale: 'Условная русская конструкция ясно передаёт смысл: сообщённое дело показалось бы слушателям невероятным. Пассив יְסֻפָּר естественно развёрнут без указания конкретного рассказчика.'
theological_decisions:
- issue: Подразумеваемый субъект действия
  choice: Я совершаю
  alternative: совершается дело
  rationale: В самой фразе явное местоимение отсутствует, но контекст речи Господа позволяет восполнить первое лицо. Альтернативная безличная передача отмечена в сноске, чтобы не скрывать грамматическую неоднозначность.
- issue: Интенсивность двойного повеления от תמה
  choice: изумитесь, поразитесь
  alternative: изумляйтесь, изумляйтесь
  rationale: Выбранная формулировка сохраняет два повеления и усиление, но звучит естественнее в современном литературном русском.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис остаётся ясным для обычного читателя; «в ваши дни» сохраняет библейскую сдержанность без архаизации.
