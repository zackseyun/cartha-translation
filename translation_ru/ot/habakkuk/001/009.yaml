lexical_decisions:
- source_word: כֻּלֹּה
  choice: Все они
  rationale: Форма с суффиксом 3-го лица единственного числа относится к войску как к собирательному целому; по-русски контекстуально естественно множественное «все они».
- source_word: לְחָמָס
  choice: ради насилия
  rationale: חָמָס обозначает насилие и жестокое беззаконие; предлог לְ здесь выражает направленность или цель.
- source_word: יָבוֹא
  choice: идут
  rationale: Глагол בוא буквально означает «приходить, идти». Настоящее «идут» естественно передаёт наступление войска и согласуется с русским множественным подлежащим.
- source_word: מְגַמַּת פְּנֵיהֶם קָדִימָה
  choice: устремление их лиц — вперёд
  rationale: Редкое מְגַמַּת может указывать на направленность или устремление; сохранён образ лиц и основное пространственное прочтение קָדִימָה как «вперёд», без устранения возможного значения «на восток».
- source_word: וַיֶּאֱסֹף
  choice: и они собирают
  rationale: В еврейском глагол стоит в единственном числе, представляя войско как единое целое; русское множественное число естественно согласуется с «все они», а собирательность отмечена в сноске.
- source_word: כַּחוֹל
  choice: как песок
  rationale: Прямой и естественный образ неисчислимого множества.
- source_word: שֶׁבִי
  choice: пленников
  rationale: Существительное может обозначать как плен, так и пленённых; при глаголе «собирать» личное значение естественнее, при сохранении абстрактной альтернативы в сноске.
