  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через вздыбленную массу многих вод». Значение еврейского слова не вполне ясно: оно может обозначать груду, плотную массу или бурлящую толщу воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַכְתָּ
  choice: Ты прошёл
  rationale: Глагол буквально обозначает ступание, попирание или движение шагом. «Прошёл» естественно передаёт целенаправленное движение Бога в поэтической теофании, не усиливая без необходимости оттенок попрания.
- source_word: בַיָּם
  choice: через море
  rationale: Предлог ב обычно означает «в», но при глаголе движения может указывать на прохождение через пространство. Русское «через море» ясно передаёт пересечение моря.
- source_word: סוּסֶיךָ
  choice: со Своими конями
  rationale: Буквально — «Твои кони». Творительная конструкция с «со» естественно связывает коней с движением Бога и не уточняет сверх текста, ехал ли Он верхом или в колеснице.
- source_word: חֹמֶר
  choice: громаду
  rationale: Редкое и трудное в данном контексте слово может обозначать груду, массу или вздыбленную толщу. «Громада» сохраняет образ огромной массы воды; лексическая неопределённость отмечена в сноске.
- source_word: מַיִם רַבִּים
  choice: могучих вод
  rationale: Буквально — «многих вод» или «великих вод». «Могучих вод» по-русски передаёт и огромный объём, и силу воды, сохраняя возвышенную поэтическую речь.
theological_decisions:
- issue: Образ Бога-воителя в поэтической теофании
  choice: Сохранён конкретный образ Бога, проходящего через море со Своими конями.
  alternative: Истолковать коней как облака или небесное воинство либо заменить образ общим утверждением о власти Бога над морем.
  rationale: Еврейский текст рисует Бога как царственного воина. Перевод не аллегоризирует коней и не сводит образ к отвлечённой богословской формуле.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской традиции.
