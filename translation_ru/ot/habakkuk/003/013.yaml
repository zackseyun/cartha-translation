source:
  edition: WLC
  text: יָצָ֨אתָ֙ לְ/יֵ֣שַׁע עַמֶּ֔/ךָ לְ/יֵ֖שַׁע אֶת מְשִׁיחֶ֑/ךָ מָחַ֤צְתָּ רֹּאשׁ֙ מִ/בֵּ֣ית רָשָׁ֔ע עָר֛וֹת יְס֥וֹד עַד צַוָּ֖אר סֶֽלָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/013.yaml
  text: You went out for the salvation of your people[a], for the salvation of your anointed one; you crushed the head of the house of the wicked, laying bare the foundation up to the neck[c][b]. Selah
translation:
  language: ru
  text: Ты вышел ради спасения Твоего народа[a], ради спасения Твоего помазанника[b]; Ты сокрушил главу дома нечестивого, обнажив основание до самой шеи[c]. Села
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально повторяет оборот «ради спасения»: «ради спасения Твоего народа, ради спасения Твоего помазанника».'
    reason: lexical_alternative
  - marker: b
    text: «Твой помазанник» может обозначать царя из рода Давида, народ в собирательном или представительном смысле либо, прообразовательно, Мессию; еврейский текст не требует здесь единственного толкования.
    reason: alternative_reading
  - marker: c
    text: 'Или: «до шеи обнажив основание». Еврейский образ труден для понимания и, возможно, соединяет картину разрушения дома с образом обнажённого тела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָאתָ
  choice: Ты вышел
  rationale: Прямо передаёт qal перфект 2-го лица мужского рода единственного числа от יצא и решительное выступление Бога ради действия; «выступил в поход» было бы более толковательным.
- source_word: לְיֵשַׁע
  choice: ради спасения
  rationale: Существительное יֵשַׁע означает спасение или избавление. Повтор оборота сохранён, чтобы передать еврейский параллелизм и богословскую насыщенность слова.
- source_word: עַמֶּךָ
  choice: Твоего народа
  rationale: Естественно передаёт существительное с суффиксом 2-го лица и сохраняет его заветный коллективный смысл.
- source_word: לְיֵשַׁע אֶת מְשִׁיחֶךָ
  choice: ради спасения Твоего помазанника
  rationale: Сохранён повтор «ради спасения», а אֶת понят как показатель прямого дополнения. «Помазанник» точно передаёт מָשִׁיחַ, не превращая его без достаточных оснований в однозначное собственное имя.
- source_word: מָחַצְתָּ רֹּאשׁ
  choice: Ты сокрушил главу
  rationale: מחץ обозначает сокрушительный удар; «глава» сохраняет сильный телесный образ и одновременно допускает значение вершины или главы дома.
- source_word: מִבֵּית רָשָׁע
  choice: дома нечестивого
  rationale: 'Формулировка следует последовательности еврейских слов и сохраняет неопределённость: רָשָׁע может обозначать нечестивого как владельца или представителя дома, тогда как «глава» может пониматься лично либо архитектурно.'
- source_word: עָרוֹת יְסוֹד
  choice: обнажив основание
  rationale: Передаёт действие ערה — «обнажать, открывать» — как сопутствующее или результирующее по отношению к сокрушению; «основание» сохраняет образ здания.
- source_word: עַד צַוָּאר
  choice: до самой шеи
  rationale: Буквальный необычный образ сохранён без попытки устранить напряжение между образами разрушенного здания и обнажённого тела.
- source_word: סֶלָה
  choice: Села
  rationale: Сохранена традиционная транслитерация, поскольку точное значение и функция термина не установлены.
theological_decisions:
- issue: Кого обозначает «Твой помазанник»
  choice: Оставлено описательное «Твой помазанник» без уточнения личности.
  alternative: Давидический царь; народ как коллективный помазанник; мессианская или прообразовательная фигура, указывающая на Мессию.
  rationale: מְשִׁיחֶךָ имеет царские и богословские ассоциации, однако контекст не требует единственного толкования. Перевод сохраняет эту многозначность и не превращает слово в однозначный титул.
- issue: Образ «главы дома нечестивого»
  choice: Сохранено выражение «главу дома нечестивого».
  alternative: «Главу нечестивого дома» или «вершину дома нечестивого».
  rationale: Еврейский текст допускает наложение личного и архитектурного образов. Более конкретный вариант преждевременно устранил бы эту выразительную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Прописные местоимения при обращении к Богу поддерживают принятую русскую библейскую традицию. Повторы оригинала и резкое смешение образов сохранены; «Села» дано без перевода.
