source:
  edition: WLC
  text: רָא֤וּ/ךָ יָחִ֨ילוּ֙ הָרִ֔ים זֶ֥רֶם מַ֖יִם עָבָ֑ר נָתַ֤ן תְּהוֹם֙ קוֹל֔/וֹ ר֖וֹם יָדֵ֥י/הוּ נָשָֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/010.yaml
  text: The mountains saw you and writhed[a]; a torrent of waters swept by. The deep gave its voice[c][b]; it lifted its hands on high.
translation:
  language: ru
  text: Горы увидели тебя и содрогнулись[a]; пронёсся поток вод[b]. Пучина подала голос; высоко подняла свои руки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «задрожали», «забились в муках» или «заколебались». Еврейский глагол может описывать как дрожь, так и судорожные движения, подобные родовым мукам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «прошёл» или «миновал». Перевод «пронёсся» передаёт стремительность потока в данном поэтическом образе.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «высоко подняла свои руки». Некоторые понимают «руки» как поэтический образ вздымающихся волн пучины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: увидели тебя
  rationale: Прямо передаёт Qal ראה с суффиксом 2-го лица мужского рода единственного числа и сохраняет олицетворение гор.
- source_word: יָחִילוּ
  choice: содрогнулись
  rationale: Глагол חול/חיל может обозначать дрожь, мучительное волнение или судорожные движения. «Содрогнулись» естественно звучит о горах и сохраняет интенсивность образа, не сводя его лишь к обычной дрожи.
- source_word: זֶרֶם מַיִם
  choice: поток вод
  rationale: זֶרֶם обозначает стремительный поток, ливень или разлив. В сочетании с מַיִם выражение передаёт мощное движение воды; глагол «пронёсся» добавляет подразумеваемую стремительность без избыточного эпитета.
- source_word: עָבָר
  choice: пронёсся
  rationale: Основное значение עבר — «прошёл, миновал». При подлежащем «поток вод» слово «пронёсся» естественно передаёт как движение мимо, так и силу поэтической картины.
- source_word: נָתַן תְּהוֹם קוֹלוֹ
  choice: Пучина подала голос
  rationale: Сохраняется еврейское олицетворение и образ буквального «предоставления/подачи голоса». «Пучина» уместно обозначает космические глубинные воды и не привносит позднейших ассоциаций, возможных у слова «бездна».
- source_word: רוֹם
  choice: высоко
  rationale: Существительное со значением «высота» здесь употреблено обстоятельственно; «высоко» прямо и естественно передаёт направление жеста.
- source_word: יָדֵיהוּ נָשָׂא
  choice: подняла свои руки
  rationale: Сохранён буквальный антропоморфный образ рук пучины, а не истолкование их как волн. Русское согласование по женскому роду обусловлено выбором существительного «пучина».
theological_decisions:
- issue: Олицетворение творения в картине богоявления
  choice: Сохранить горы и пучину как действующих участников, реагирующих на явление Бога.
  alternative: 'Передать образ как чисто природное явление: горы дрожали, а волны вздымались.'
  rationale: Поэтический текст намеренно изображает творение личностно реагирующим на Бога. Буквальное сохранение рук и голоса удерживает богословскую напряжённость образа и не превращает его в метеорологическую прозу.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической образностью. Архаизмы сведены к минимуму; олицетворение и параллелизм еврейского стиха сохранены. Местоимение «тебя» дано со строчной буквы как грамматическая форма, без внесения конфессиональной издательской практики.
