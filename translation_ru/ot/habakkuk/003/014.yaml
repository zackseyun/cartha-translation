  text: נָקַ֤בְתָּ בְ/מַטָּי/ו֙ רֹ֣אשׁ פרז/ו יִסְעֲר֖וּ לַ/הֲפִיצֵ֑/נִי עֲלִ֣יצֻתָ֔/ם כְּמוֹ לֶ/אֱכֹ֥ל עָנִ֖י בַּ/מִּסְתָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/014.yaml
  text: You pierced the head of his warriors with his own staffs; they stormed out to scatter me[a], their exultation like one about to devour the poor in secret.
translation:
  language: ru
  text: Ты пронзил его же жезлами главу его воинов[a]. Они вихрем ринулись, чтобы рассеять меня, ликуя, словно готовы были тайком пожрать бедняка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главу его селений»; возможно также: «главу его полчищ». Еврейское слово неясно, и его нередко понимают в более общем смысле — как вражеские отряды или их предводителей.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָקַבְתָּ
  choice: Ты пронзил
  rationale: Глагол נקב в породе qal обозначает прокалывание или пронзание; «пронзил» естественно передаёт воинственный образ.
- source_word: בְמַטָּיו
  choice: его же жезлами
  rationale: 'מַטֶּה означает жезл или посох. Частица «же» ясно передаёт местоименный суффикс и иронию: враг поражён собственным оружием.'
- source_word: רֹאשׁ
  choice: главу
  rationale: רֹאשׁ может означать как голову, так и предводителя. «Главу» сохраняет образ и в данном контексте естественно допускает значение предводителя.
- source_word: פרזיו
  choice: его воинов
  rationale: Форма трудна и спорна. Военное окружение поддерживает понимание как обозначение вражеских воинов или отрядов; иные прочтения вынесены в сноску.
- source_word: יִסְעֲרוּ
  choice: они вихрем ринулись
  rationale: Глагол סער описывает бурное, стремительное движение. Этот перевод сохраняет образ вихря и передаёт внезапный натиск.
- source_word: לַהֲפִיצֵנִי
  choice: чтобы рассеять меня
  rationale: Порода hiphil глагола פוץ означает рассеивать, разгонять; выбран прямой и понятный эквивалент.
- source_word: עֲלִיצוּתָם
  choice: они ликовали
  rationale: Существительное обозначает бурное ликование. Глагольная конструкция звучит по-русски естественно и сохраняет злорадную радость нападающих.
- source_word: כְּמוֹ לֶאֱכֹל
  choice: словно собирались ... пожрать
  rationale: Оборот выражает сравнение с хищническим намерением; «собирались пожрать» передаёт направленность действия и силу образа.
- source_word: עָנִי
  choice: бедняка
  rationale: עָנִי может обозначать бедного, нуждающегося или угнетённого. «Бедняка» соответствует социальной окраске образа и форме единственного числа.
- source_word: בַּמִּסְתָּר
  choice: тайком
  rationale: Слово обозначает тайное или укромное место. «Тайком» кратко и естественно передаёт скрытный характер нападения.
theological_decisions:
- issue: Толкование трудного существительного פרזיו в военном контексте
  choice: его воинов
  alternative: его селений / его полчищ
  rationale: Контекст изображает вражеский натиск, поэтому обозначение воинов лучше всего согласуется с ходом стиха. Поскольку еврейская форма неясна и допускает другие понимания, неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической лексикой. Образы пронзания, вихря и пожирания сохранены; спорное военное обозначение не представлено как бесспорное.
