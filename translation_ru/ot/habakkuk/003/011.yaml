base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/011.yaml
  text: Sun and moon stood in their lofty place[a]; at the light of your arrows they went[c][b], at the brightness of the flash of your spear.
translation:
  language: ru
  text: Солнце и луна остановились в высокой обители[a]; при свете Твоих стрел двигались[b], при сиянии вспышки Твоего копья[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей обители». Еврейское слово זְבֻלָה означает возвышенное жилище или высокое место.'
    reason: lexical_alternative
  - marker: b
    text: Еврейская фраза предельно сжата. «Двигались» может относиться к солнцу и луне либо, вероятнее по образу и близости слова «стрелы», к летящим Божьим стрелам.
    reason: alternative_reading
  - marker: c
    text: 'Или: «при сиянии молнии Твоего копья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ יָרֵחַ
  choice: Солнце и луна
  rationale: Два небесных светила названы прямо; отсутствие артиклей естественно для русского языка и сохраняет поэтическую краткость.
- source_word: עָמַד
  choice: остановились
  rationale: Глагол может означать «стоять» или «остановиться». В контексте теофании и движения светил «остановились» естественно передаёт прекращение движения, не объясняя его механизма.
- source_word: זְבֻלָה
  choice: в высокой обители
  rationale: Слово обозначает возвышенное жилище или высокое место. «Высокая обитель» сохраняет пространственную возвышенность и поэтический регистр, не вводя более конкретной космологии.
- source_word: לְאוֹר חִצֶּיךָ
  choice: при свете Твоих стрел
  rationale: Сохранены образ света, исходящего от стрел, и параллелизм со следующей строкой; предлог «при» не навязывает исключительно инструментального значения.
- source_word: יְהַלֵּכוּ
  choice: двигались они
  rationale: Глагол передаёт движение. Инверсия воспроизводит поэтическую сжатость и не добавляет нового явно названного субъекта, хотя в русском местоимение естественно тяготеет к солнцу и луне; неоднозначность пояснена в сноске.
- source_word: לְנֹגַהּ
  choice: при сиянии
  rationale: נֹגַהּ означает яркость, сияние или блеск; «при сиянии» поддерживает параллель с «при свете».
- source_word: בְּרַק חֲנִיתֶךָ
  choice: вспышки Твоего копья
  rationale: בָּרָק может обозначать молнию или ослепительный блеск. «Вспышка копья» передаёт зрительный образ сверкающего оружия, а буквальная возможность «молнии» сохранена в сноске.
theological_decisions:
- issue: К чему относится форма «двигались»
  choice: Субъект не назван заново; сохранена сжатая конструкция «двигались они».
  alternative: Явно отнести движение либо к солнцу и луне, либо к Божьим стрелам и копью.
  rationale: 'Еврейская поэзия допускает обе связи: грамматически субъектом могут оставаться солнце и луна, но образ и близость существительного «стрелы» позволяют понимать движение как полёт Божьего оружия. Основной текст не должен без необходимости устранять эту напряжённость.'
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Синтаксическая инверсия сохраняет сжатость древнееврейской строки; обращённые к Богу местоимения написаны с прописной буквы как издательская норма, без доктринальной нагрузки.
