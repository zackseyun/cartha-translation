  source_fidelity: 'Основной смысл передан точно: солнце и луна прекращают движение в возвышенном месте, далее сохраняются свет стрел и сияние/вспышка копья. Однако местоимение «они» в русском тексте почти неизбежно связывает «двигались» с солнцем и луной, тогда как еврейская сжатая конструкция также позволяет соотнести глагол со стрелами. Его следует убрать, сохранив невыраженный субъект.'
