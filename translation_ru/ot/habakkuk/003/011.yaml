  terminology: '«Высокая обитель», «стрелы» и «копьё» адекватны. Прописное «Твоих/Твоего» приемлемо как редакционная норма и не меняет смысла. В сноске о референте движения не следует говорить, что к нему относится также копьё: глагол стоит во множественном числе, и наиболее непосредственная альтернативная связь — со «стрелами».'
