lexical_decisions:
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Передаёт пространственное значение выражения — движение впереди божественного воина — без добавочного толкования.
- source_word: יֵלֶךְ
  choice: идёт
  rationale: Настоящее время естественно передаёт живое поэтическое изображение действия и сохраняет параллель движения в обоих полустишиях.
- source_word: דָּבֶר
  choice: мор
  rationale: «Мор» точно обозначает повальную смертоносную болезнь и сохраняет возвышенный поэтический регистр, не сливаясь с последующим רֶשֶׁף.
- source_word: וְיֵצֵא
  choice: выступает
  rationale: Глагол сохраняет образ силы, выходящей и сопровождающей шествие; в русском поэтическом контексте звучит естественнее буквального «выходит».
- source_word: רֶשֶׁף
  choice: горячка
  rationale: Слово может обозначать жар, лихорадку или губительную болезнь; «горячка» сохраняет связь с палящим жаром и одновременно поддерживает параллель с мором. Другие значения и возможное имя Решеф вынесены в примечание.
- source_word: לְרַגְלָיו
  choice: у его ног
  rationale: Сохраняет конкретный образ еврейского выражения и не исключает подразумеваемого движения следом за ним.
theological_decisions:
- issue: Возможный мифологический фон слова רֶשֶׁף
  choice: В основном тексте передать как нарицательное «горячка».
  alternative: «Решеф» — имя связанного с мором древнего божества; также возможны «жгучая зараза» или «чума».
  rationale: Поэтический контекст может содержать отголосок древневосточного образа, однако параллелизм с דָּבֶר позволяет понимать רֶשֶׁף как губительную силу. Нарицательное сохраняет смысл стиха, не утверждая спорную мифологическую идентификацию.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим ритмом. «Мор» поддерживает библейский регистр, оставаясь понятным; «горячка» передаёт болезненный жар и сохраняет отличие второго образа от первого.
