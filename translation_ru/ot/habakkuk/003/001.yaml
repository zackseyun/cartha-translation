translation:
  language: ru
  text: Молитва пророка Аввакума — на шигйонот.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «в сопровождении шигйонот» или «в стиле шигйонот». Вероятно, это музыкальный или богослужебный термин, обозначающий напев, манеру исполнения либо страстную песнь.'
    reason: Смысл редкого еврейского термина и точное значение предлога при нём остаются неясными.
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Молитва
  rationale: Существительное обозначает молитву или молитвенную песнь; в заголовке естественна краткая именная форма без артикля, которого в русском языке нет.
- source_word: לַחֲבַקּוּק
  choice: пророка Аввакума
  rationale: Предлог ל в надписаниях часто указывает на авторство или принадлежность. Русский родительный падеж естественно передаёт «молитва Аввакума», а приложение «пророка» сохраняет структуру и смысл еврейского заголовка.
- source_word: הַנָּבִיא
  choice: пророка
  rationale: Определённое приложение называет служение Аввакума. В русском сочетание «пророка Аввакума» звучит естественно и сохраняет торжественный стиль надписания.
- source_word: עַל
  choice: на
  rationale: В музыкальных или богослужебных надписаниях слово может указывать на напев, лад, стиль или способ исполнения. «На» сохраняет краткость указания и не конкретизирует сверх меры неясную связь.
- source_word: שִׁגְיֹנוֹת
  choice: шигионо́т
  rationale: Редкий и не вполне ясный музыкальный или литургический термин, вероятно связанный с שִׁגָּיוֹן в Псалме 7:1. Транслитерация избегает ложной определённости; ударение помогает русскому читателю произнести незнакомое слово.
