  text: כִּֽי תְאֵנָ֣ה לֹֽא תִפְרָ֗ח וְ/אֵ֤ין יְבוּל֙ בַּ/גְּפָנִ֔ים כִּחֵשׁ֙ מַעֲשֵׂה זַ֔יִת וּ/שְׁדֵמ֖וֹת לֹא עָ֣שָׂה אֹ֑כֶל גָּזַ֤ר מִ/מִּכְלָה֙ צֹ֔אן וְ/אֵ֥ין בָּקָ֖ר בָּ/רְפָתִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/017.yaml
  text: Though the fig tree does not blossom[a], and there is no produce on the vines; the yield of the olive fails, and the fields produce no food; the flock is cut off from the fold, and there is no herd in the stalls[b],
translation:
  language: ru
  text: Хотя смоковница не расцветёт[a] и на виноградных лозах не будет плода, урожай маслин не уродится[b] и поля не дадут пищи, стадо будет отсечено от загона и в стойлах не останется крупного скота,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо смоковница не расцветает…» Начальная еврейская частица может иметь причинное значение («ибо») или уступительное («хотя»); уступительное прочтение хорошо согласуется с заявлением о радости в следующем стихе.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «произведение маслины обмануло (оказалось ложным)» — образное выражение о неудавшемся урожае маслин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Хотя
  rationale: В данном поэтическом контексте частица вводит ряд уступительных обстоятельств перед заявлением о радости в ст. 18. Причинное «ибо» также возможно и отмечено в сноске.
- source_word: תְאֵנָה לֹא תִפְרָח
  choice: смоковница не расцветёт
  rationale: Сохраняет образ дерева и значение глагола «цвести, распускаться»; будущее время естественно передаёт рассматриваемую возможность в русском контексте.
- source_word: אֵין יְבוּל בַּגְּפָנִים
  choice: на виноградных лозах не будет плода
  rationale: Естественно передаёт отсутствие урожая на лозах, не смешивая этот образ со следующим упоминанием маслин.
- source_word: כִּחֵשׁ מַעֲשֵׂה זַיִת
  choice: урожай маслин не уродится
  rationale: Еврейское выражение буквально говорит, что произведение маслины «обмануло» или «оказалось ложным»; русский сельскохозяйственный оборот ясно передаёт неудавшийся урожай.
- source_word: שְׁדֵמוֹת לֹא עָשָׂה אֹכֶל
  choice: поля не дадут пищи
  rationale: Передаёт буквальный образ полей, которые не производят пищу, естественным и поэтически сжатым русским выражением.
- source_word: גָּזַר מִמִּכְלָה צֹאן
  choice: стадо исчезнет из загона
  rationale: Глагол буквально означает «быть отсечённым»; «исчезнет» естественно выражает полное отсутствие мелкого скота, тогда как «стадо» сохраняет коллективный и не обязательно только овечий смысл צֹאן.
- source_word: אֵין בָּקָר בָּרְפָתִים
  choice: в стойлах не останется скота
  rationale: בָּקָר обозначает крупный рогатый скот; в контрасте со стадом мелкого скота краткое «скота» звучит естественно, а «стойла» передаёт места его содержания.
theological_decisions:
- issue: Значение начальной частицы כִּי
  choice: Уступительное «Хотя»
  alternative: Причинное «Ибо» или «Ведь»
  rationale: Уступительное прочтение хорошо связывает перечисление бедствий с решимостью радоваться Господу в следующем стихе, однако грамматически возможное причинное значение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Сельскохозяйственные образы сохранены, но буквальные идиомы переданы естественными русскими оборотами. Ритм строится как нарастающее перечисление полной утраты урожая и скота; завершающая запятая сохраняет синтаксический переход к ст. 18.
