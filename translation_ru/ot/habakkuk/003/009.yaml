  text: Your bow is laid bare[a]; the rods are sworn by command. Selah[b]. You split the earth with rivers.
translation:
  language: ru
  text: 'Обнажён твой лук;


    жезлы связаны клятвами по слову.[a]


    Села.


    Ты рассекаешь землю реками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейская фраза «жезлы связаны клятвами по слову» крайне трудна и допускает другие понимания, например: «клятвы племен были изречены». Слово, переданное как «жезлы», может также означать «племена»; по-разному понимается и связь слов «клятвы», «жезлы/племена» и «слово».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְיָה תֵעוֹר
  choice: обнажён
  rationale: Сочетание усиленно выражает обнажение или раскрытие лука, то есть его извлечение и готовность к действию; краткая форма сохраняет сжатость поэзии.
- source_word: קַשְׁתֶּךָ
  choice: твой лук
  rationale: Прямо сохраняет воинский образ и обращение к Богу во втором лице.
- source_word: שְׁבֻעוֹת
  choice: клятвами скреплены
  rationale: Передаёт основное значение «клятвы», а также возможную предикативную связь в крайне сжатой и трудной строке, не истолковывая её чрезмерно конкретно.
- source_word: מַטּוֹת
  choice: жезлы
  rationale: Сохраняет предметное значение «жезлы/посохи» и связь с воинской образностью; возможное значение «племена» отмечено в сноске.
- source_word: אֹמֶר
  choice: по слову
  rationale: Буквально сохраняет значение «слово, изречение»; выражение допускает смысл повеления, но не сводит неоднозначный оригинал только к нему.
- source_word: סֶלָה
  choice: Села
  rationale: Транслитерация сохраняет неясный древнееврейский литургический или музыкальный термин без ложной определённости.
- source_word: נְהָרוֹת תְּבַקַּע אָרֶץ
  choice: Ты рассекаешь землю реками
  rationale: Сохраняет обращение во втором лице, интенсивное значение глагола בקע и космический масштаб слова «земля»; «реками» естественно передаёт инструментальную связь.
theological_decisions:
- issue: Толкование трудной фразы שְׁבֻעוֹת מַטּוֹת אֹמֶר
  choice: клятвами скреплены жезлы по слову
  alternative: «клятвы племен были изречены»; «клятвенные жезлы по слову»; «по слову обнажены стрелы»
  rationale: Древнееврейская строка эллиптична и допускает несколько синтаксических и лексических разборов. Основной текст удерживает понятия клятв, жезлов и слова, а сноска прямо сохраняет подлинную неопределённость.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Сохранены краткость, воинская образность и синтаксическая напряжённость оригинала; термин «Села» оставлен без перевода.
