base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/008.yaml
  text: Was your anger against the rivers[a], Yahweh? Was your wrath against the rivers, or your fury against the sea, that you rode on your horses, on your chariots of salvation?
translation:
  language: ru
  text: Разве воспылал Твой гнев на реки, Яхве? Разве на реки обращён Твой гнев или на море — Твоя ярость, что Ты ехал на Своих конях, на Своих колесницах спасения?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «ибо Ты ехал на Своих конях, на Своих победоносных колесницах». Еврейское יְשׁוּעָה здесь может означать также избавление или победу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבִנְהָרִים חָרָה יְהוָה
  choice: Разве на реки, Яхве, воспылал Твой гнев?
  rationale: Вопросительная частица הֲ и предлог בְּ передают риторический вопрос об объекте гнева. Глагол חרה буквально изображает гнев как разгорающийся; «воспылал гнев» естественно сохраняет этот образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אַפֶּךָ
  choice: Твой гнев
  rationale: אַף здесь идиоматически означает гнев. Повтор слова «гнев» сохраняет параллелизм еврейской строки.
- source_word: עֶבְרָתֶךָ
  choice: Твоя ярость
  rationale: עֶבְרָה обозначает сильный, переполняющий гнев; «ярость» передаёт усиление относительно אַף.
- source_word: כִּי תִרְכַּב עַל־סוּסֶיךָ
  choice: что Ты воссел на Своих коней
  rationale: כִּי связывает образ шествия с предыдущими риторическими вопросами, не требуя однозначного выбора между причинным и пояснительным оттенком. Поэтическое «воссел» соответствует возвышенному контексту רכב.
- source_word: מַרְכְּבֹתֶיךָ יְשׁוּעָה
  choice: Свои колесницы спасения
  rationale: Краткое именное сочетание сохраняет синтаксическую сжатость оригинала и широкий смысл יְשׁוּעָה — спасение, избавление или победа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יהוה; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение יְשׁוּעָה в образе божественного воина
  choice: спасения
  alternative: победоносные; избавления
  rationale: «Спасение» сохраняет широкий богословский смысл божественного избавления, тогда как «победоносные» сужает его до военной победы. Возможный контекстуальный оттенок отмечен в сноске.
- issue: Направленность риторических вопросов
  choice: Гнев Бога не утверждается как направленный на воды, а ставится под вопрос
  alternative: Прямое утверждение гнева на реки и море
  rationale: Повторяющиеся вопросительные конструкции противопоставляют воды цели божественного шествия, не устраняя поэтического напряжения между судом и спасением.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической окраской. Риторическая трёхчастная структура и параллелизм сохранены; местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
