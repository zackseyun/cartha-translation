id: HAB.3.3
reference: Habakkuk 3:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֱל֨וֹהַ֙ מִ/תֵּימָ֣ן יָב֔וֹא וְ/קָד֥וֹשׁ מֵֽ/הַר פָּארָ֖ן סֶ֑לָה כִּסָּ֤ה שָׁמַ֨יִם֙ הוֹד֔/וֹ וּ/תְהִלָּת֖/וֹ מָלְאָ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/003.yaml
  text: God comes from Teman[a], and the Holy One from Mount Paran. Selah. His splendor covers the heavens[d][c][b], and his praise fills the earth.
translation:
  language: ru
  text: 'Бог приходит из Фемана[a],

    и Святой — с горы Фаран.

    Села[b].

    Его величие[c] покрывает небеса,

    и Его хвала наполняет землю[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Феман» можно также понять в более общем смысле как «юг», но здесь, вероятнее всего, это название местности, параллельное горе Фаран.
    reason: lexical_alternative
  - marker: b
    text: Села — литургический или музыкальный термин с неясным значением; по традиции его оставляют без перевода.
    reason: cultural_note
  - marker: c
    text: 'Или: «Его великолепие» либо «Его слава».'
    reason: lexical_alternative
  - marker: d
    text: 'В поэтическом контексте возможно также: «Его хвала наполнила землю» или «Его хвала наполнит землю».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלוֹהַ
  choice: Бог
  rationale: Единственное число прямо обозначает Бога; обычное русское соответствие не добавляет отсутствующих в тексте оттенков.
- source_word: מִתֵּימָן
  choice: из Фемана
  rationale: Возможны значение «с юга» и географическое название, однако параллель с горой Фаран делает топоним наиболее вероятным.
- source_word: יָבוֹא
  choice: приходит
  rationale: Настоящее время передаёт живую непосредственность поэтического богоявления, не сводя его только к прошлому или будущему.
- source_word: וְקָדוֹשׁ
  choice: и Святой
  rationale: Субстантивированное прилагательное выступает как наименование Бога и параллельно слову «Бог».
- source_word: מֵהַר פָּארָן
  choice: с горы Фаран
  rationale: Прямое и ясное воспроизведение географического выражения.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение древнего литургического или музыкального термина неизвестно, поэтому он оставлен без перевода в транслитерации.
- source_word: כִּסָּה
  choice: покрывает
  rationale: Настоящее время согласуется с живым изображением богоявления в первой строке.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Множественное число сохраняет возвышенный поэтический строй и космический масштаб.
- source_word: הוֹדוֹ
  choice: Его величие
  rationale: הוֹד обозначает величие, великолепие или славу. «Величие» естественно и достойно передаёт образ божественного присутствия, покрывающего небеса.
- source_word: וּתְהִלָּתוֹ
  choice: и Его хвала
  rationale: Буквальное притяжательное выражение сохраняет возможность понимать слово и как хвалу, воздаваемую Богу, и как хвалу, принадлежащую Ему по праву.
- source_word: מָלְאָה הָאָרֶץ
  choice: наполняет землю
  rationale: «Землю», а не «страну», подсказывает космический параллелизм с небесами; настоящее время поддерживает непосредственность поэтической сцены.
theological_decisions:
- issue: Временной план богоявления
  choice: 'Еврейские глагольные формы переданы живым настоящим временем: «приходит», «покрывает», «наполняет».'
  alternative: Возможны прошедшее время («пришёл», «покрыло», «наполнила») или передача как будущего явления.
  rationale: Глава одновременно вспоминает и заново представляет явление Бога. Настоящее время сохраняет литургическую непосредственность и не ограничивает смысл исключительно прошлым либо будущим.
- issue: Кого обозначает «Святой»
  choice: Это божественное наименование, параллельное слову «Бог».
  alternative: Понимание как отдельного святого существа.
  rationale: Синонимический параллелизм двух строк указывает на одного и того же божественного действующего Лица; перевод не вводит не подтверждённого текстом различия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Краткие параллельные строки сохраняют ритм гимна; географические названия и неясный термин «Села» переданы в традиционной русской форме.
