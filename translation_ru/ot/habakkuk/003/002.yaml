  text: יְהוָ֗ה שָׁמַ֣עְתִּי שִׁמְעֲ/ךָ֮ יָרֵאתִי֒ יְהוָ֗ה פָּֽעָלְ/ךָ֙ בְּ/קֶ֤רֶב שָׁנִים֙ חַיֵּ֔י/הוּ בְּ/קֶ֥רֶב שָׁנִ֖ים תּוֹדִ֑יעַ בְּ/רֹ֖גֶז רַחֵ֥ם תִּזְכּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/002.yaml
  text: Yahweh[a], I have heard the report of you; I stand in awe. Yahweh, revive your work in the midst of the years; in the midst of the years make it known[e][d][c][b]; in wrath remember mercy.
translation:
  language: ru
  text: Господи[a], я услышал весть о Тебе и устрашился[b]. Господи, среди лет оживи[c] Твоё дело, среди лет яви его; во гневе[d] вспомни о милости[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст содержит имя Бога YHWH (обычно передаваемое как «Яхве»), традиционно переводимое словом «Господь».
    reason: divine_name
  - marker: b
    text: 'Или: «исполнился благоговейного трепета»; еврейский глагол может выражать страх и благоговение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сохрани его живым», «обнови его». Буквально: «сделай его живым». Выражение «среди лет» буквально означает «посреди лет».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «в смятении», «в ярости».'
    reason: lexical_alternative
  - marker: e
    text: Буквально еврейское выражение можно понять как «помни сострадать» или «вспомни о сострадании».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении употреблена традиционная русская передача имени YHWH словом «Господь» в форме звательного обращения; собственное имя отмечено в сноске.
- source_word: שָׁמַעְתִּי שִׁמְעֲךָ
  choice: я услышал весть о Тебе
  rationale: Сочетание родственных форм שמע передаёт услышанное пророком сообщение о Господе; «весть о Тебе» естественно по-русски и не сводит смысл лишь к славе или репутации.
- source_word: יָרֵאתִי
  choice: устрашился
  rationale: Глагол выражает страх, который в молитвенном контексте сопряжён с благоговением. «Устрашился» сохраняет эту напряжённость лучше, чем однозначное «исполнился благоговения».
- source_word: פָּעָלְךָ
  choice: Твоё дело
  rationale: Существительное обозначает дело или деяние; широкое слово «дело» не уточняет сверх текста, какие именно Божьи действия имеются в виду.
- source_word: בְּקֶרֶב שָׁנִים
  choice: в наши годы
  rationale: Буквально выражение означает «посреди лет». Контекстуальное «в наши годы» передаёт просьбу о Божьем действии во время жизни нынешнего поколения и сохраняет повтор выражения.
- source_word: חַיֵּהוּ
  choice: оживи
  rationale: Побудительная форма от חיה буквально призывает сделать Божье дело живым; «оживи» сохраняет образ жизни, не ограничивая смысл только возобновлением или сохранением.
- source_word: תּוֹדִיעַ
  choice: сделай его явным
  rationale: Порода hифиль означает «дать узнать, сделать известным». Местоимение «его» естественно соотносится с ранее названным Божьим делом.
- source_word: בְּרֹגֶז
  choice: во гневе
  rationale: רֹגֶז может обозначать ярость, возбуждение или смятение; просьба о милости в контексте Божьего суда поддерживает значение «гнев», а иные возможности отражены в сноске.
- source_word: רַחֵם תִּזְכּוֹר
  choice: вспомни о милости
  rationale: Еврейское выражение буквально соединяет «помнить» с глаголом «миловать, сострадать». Русская формулировка естественно передаёт молитвенную просьбу, не предполагая, будто Бог прежде забыл милость.
theological_decisions:
- issue: Характер реакции пророка на услышанное о Господе
  choice: «устрашился» — страх, допускающий благоговение
  alternative: «исполнился благоговения» или «испугался»
  rationale: Еврейский ירא охватывает как страх, так и благоговейный трепет. Более сильное «устрашился» сохраняет напряжение между поклонением и боязнью перед Божьим действием.
- issue: Смысл просьбы оживить Божье дело
  choice: просьба вновь явить Божье действие в истории
  alternative: просьба лишь сохранить дело живым или обновить его
  rationale: Местоименный суффикс отсылает к «Твоему делу», однако текст не уточняет конкретного деяния; перевод сохраняет этот широкий смысл и образ дарования жизни.
- issue: Связь гнева и милости
  choice: просьба проявить милость во время гнева
  alternative: просьба о сострадании во время смятения или потрясения
  rationale: Перевод не устраняет одновременное присутствие суда и милости и не превращает их в взаимоисключающие состояния.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической торжественностью. Заглавные местоимения в обращении к Богу следуют принятой русской религиозной письменной норме. Повтор «в наши годы» воспроизводит поэтический параллелизм; смысловые неоднозначности вынесены в сноски.
