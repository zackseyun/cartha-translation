  text: Я увидел шатры Кушана в бедствии; полотнища шатров земли Мадиама дрожали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אָוֶן
  choice: в бедствии
  rationale: תחת здесь описывает состояние или обстоятельства, а אָוֶן допускает значения «беда, бедствие, страдание»; буквальное «под бедствием» по-русски неестественно.
- source_word: אָהֳלֵי כוּשָׁן
  choice: шатры Кушана
  rationale: Сохраняется собственное имя Кушан без попытки отождествить его с Кушем; «шатры» естественно передаёт кочевое жилище.
- source_word: יְרִיעוֹת
  choice: полотнища шатров
  rationale: Слово обозначает тканевые полотнища, служившие покрытием шатра; добавление «шатров» делает образ ясным по-русски и соответствует параллелизму.
- source_word: יִרְגְּזוּן
  choice: дрожали
  rationale: Форма выражает сильное содрогание или трепет; «дрожали» естественно передаёт зрительный образ и согласуется с прошедшим временем видения.
theological_decisions:
- issue: Причина бедствия и дрожи
  choice: Не уточнять, что это страх перед Богом или прямое наказание
  alternative: «страдали под Божьей карой» / «трепетали перед Ним»
  rationale: Сам стих изображает бедствие и дрожь на фоне богоявления, но не выражает эти причинные связи прямо.
- issue: Соотношение Кушана и Мидьяна
  choice: Сохранить два обозначения, не объявляя их одним народом или одной областью
  alternative: Отождествить Кушан с Мидьяном либо с Кушем
  rationale: Поэтический параллелизм сближает их, однако точное географическое или этническое отношение остаётся неясным.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью. Сохранён параллелизм двух строк; архаизмы и излишнее прояснение неоднозначной географии исключены.
