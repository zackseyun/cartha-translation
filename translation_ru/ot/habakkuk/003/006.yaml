  text: עָמַ֣ד וַ/יְמֹ֣דֶד אֶ֗רֶץ רָאָה֙ וַ/יַּתֵּ֣ר גּוֹיִ֔ם וַ/יִּתְפֹּֽצְצוּ֙ הַרְרֵי עַ֔ד שַׁח֖וּ גִּבְע֣וֹת עוֹלָ֑ם הֲלִיכ֥וֹת עוֹלָ֖ם לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/006.yaml
  text: He stood and measured the earth[a]; he looked and made nations tremble. The ancient mountains were shattered; the everlasting hills sank low[b]. His ways are everlasting.
translation:
  language: ru
  text: Он встал и измерил землю; взглянул — и привёл народы в смятение[a]. Рассыпались древние горы, поникли вечные холмы. Его пути — извечны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «заставил народы содрогнуться», «встревожил народы» или «рассеял народы». Значение еврейского глагола здесь неясно и остаётся предметом споров.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «Его хождения — вечные»; возможно также: «Его шествия — издревле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמַד
  choice: Он встал
  rationale: Передаёт основное значение глагола «стоять, встать» и сохраняет величественный образ явления Бога без дополнительного истолкования.
- source_word: וַיְמֹדֶד אֶרֶץ
  choice: и измерил землю
  rationale: Обычное значение корня מדד — «мерить, измерять»; это чтение следует масоретскому тексту, не подменяя его контекстуальными вариантами «поколебал» или «заставил дрожать».
- source_word: רָאָה
  choice: взглянул
  rationale: Естественно передаёт краткое зрительное действие в последовательности ярких поэтических образов.
- source_word: וַיַּתֵּר גּוֹיִם
  choice: и привёл народы в смятение
  rationale: Редкий и спорный глагол указывает на сильное потрясение или тревогу народов; выбранная формулировка сохраняет этот общий эффект, а иные возможные значения отмечены в сноске.
- source_word: וַיִּתְפֹּצְצוּ
  choice: рассыпались
  rationale: Передаёт образ насильственного распада гор и звучит естественно в современной русской поэзии высокого регистра.
- source_word: הַרְרֵי עַד
  choice: древние горы
  rationale: עַד здесь выражает вековую древность и кажущуюся незыблемость; «древние» естественно сочетается с параллельным образом вечных холмов.
- source_word: שַׁחוּ
  choice: поникли
  rationale: 'Сохраняет двуплановый образ: холмы опускаются и словно склоняются перед Богом.'
- source_word: גִּבְעוֹת עוֹלָם
  choice: вечные холмы
  rationale: Передаёт поэтическую идею вековой, кажущейся вечной устойчивости холмов.
- source_word: הֲלִיכוֹת עוֹלָם לוֹ
  choice: Его пути — извечны
  rationale: הליכות может обозначать хождения, шествия или пути, а עוֹלָם — вечность либо глубокую древность. Краткая формула сохраняет обобщённый и богословски напряжённый характер заключения; буквальные оттенки вынесены в сноску.
theological_decisions:
- issue: Антропоморфный язык и образы космической теофании
  choice: Сохранить поэтическое изображение явления и действия Бога, затрагивающего народы и творение.
  alternative: Свести действия только к метафоре политических событий либо представить стих как строго буквальное космологическое описание.
  rationale: Аввакум 3 использует возвышенную теофаническую поэзию. Перевод сохраняет величие и напряжение образов, не навязывая узкой конфессиональной или натуралистической трактовки.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Краткие параллельные фразы сохраняют ритм теофанического гимна; тире перед заключительной характеристикой подчёркивает итоговую строку.
