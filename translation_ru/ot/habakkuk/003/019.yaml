base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/019.yaml
  text: 'The LORD, my Lord, is my strength; he makes my feet like the deer’s, and he causes me to tread on my heights.


    For the choir director: with my stringed instruments.'
translation:
  language: ru
  text: 'Господь, мой Владыка, — сила моя;

    Он делает мои ноги, как у ланей,

    и даёт мне ступать по моим высотам.


    Для руководителя хора. Под аккомпанемент моих струнных инструментов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֲדֹנָי
  choice: Господь Владыка
  rationale: Передаёт сочетание личного имени Бога и титула «Владыка», избегая неестественного повтора «Господь, мой Господь»; притяжательное значение далее выражено словами «сила моя».
- source_word: חֵילִי
  choice: сила моя
  rationale: Прямое и естественное соответствие в контексте исповедания доверия.
- source_word: כָּאַיָּלוֹת
  choice: как у ланей
  rationale: Женская форма множественного числа обозначает ланей; сравнение относится к уверенной и проворной поступи в горах.
- source_word: יַדְרִכֵנִי
  choice: ведёт меня
  rationale: Глагол может означать «заставляет ступать», «даёт ходить» или «ведёт»; выбран естественный русский оборот без устранения образа движения.
- source_word: בָּמוֹתַי
  choice: по моим высотам
  rationale: Сохранены буквальный образ высот и притяжательный суффикс, несмотря на возможные оттенки победного или безопасного хождения.
- source_word: לַמְנַצֵּחַ בִּנְגִינוֹתָי
  choice: Начальнику хора. На моих струнных инструментах.
  rationale: Передана заключительная музыкально-литургическая ремарка; «моих» сохраняет необычный притяжательный суффикс исходного текста.
theological_decisions:
- issue: Передача сочетания יהוה אדני
  choice: Господь Владыка
  alternative: Господь, мой Господь; Яхве, Владыка
  rationale: Выбор различает имя и титул, оставаясь в привычном русском библейском регистре и не вводя конфессионально маркированного произношения имени.
- issue: Смысл «моих высот»
  choice: Сохранить без толкования
  alternative: по высотам; по вершинам; попирать высоты врагов
  rationale: Исходный текст допускает образ безопасного хождения и возможный победный оттенок, но не требует однозначного истолкования.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Сохранены поэтический параллелизм, метафора горной поступи и отдельная заключительная музыкальная ремарка.
