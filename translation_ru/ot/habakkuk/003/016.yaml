base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/016.yaml
  text: I heard[a], and my inward parts trembled; at the sound my lips quivered. Rot enters into my bones, and beneath me I tremble, as I wait quietly for the day of distress[b], for the coming up of the people who will invade us.
translation:
  language: ru
  text: 'Я услышал — и затрепетало всё внутри меня;

    при этом звуке задрожали мои губы.


    Гниль проникла в мои кости,

    и ноги подо мной задрожали.


    Я тихо жду[a] дня бедствия,

    когда выступит тот, кто нападёт на народ и разорит его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы мне обрести покой в день бедствия». Еврейский глагол может означать «покоиться», «успокоиться» или «оставаться в покое»; здесь он передан как тихое ожидание грядущей беды.'
    reason: alternative_reading
  - marker: b
    text: 'Или, с иным разбором трудной еврейской конструкции: «когда против народа выступят грабители» или «когда выступит народ, совершающий набег». В еврейском тексте местоименный суффикс при глаголе означает «его», то есть, вероятно, народ как собирательное целое.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Я услышал
  rationale: Форма совершенного вида вводит реакцию пророка на услышанное; простое прошедшее время естественно для русского поэтического повествования.
- source_word: וַתִּרְגַּז בִּטְנִי
  choice: затрепетало всё внутри меня
  rationale: Буквально בטן — «живот, чрево», но здесь слово обозначает внутренность человека как средоточие телесного страха. Перевод сохраняет физическую образность и звучит естественно по-русски.
- source_word: לְקוֹל
  choice: при этом звуке
  rationale: קוֹל может означать «звук» или «голос». Более широкое «звук» не устраняет неоднозначность природы услышанного.
- source_word: צָלֲלוּ שְׂפָתַי
  choice: задрожали мои губы
  rationale: Глагол передаёт непроизвольную телесную дрожь; «задрожали» ясно и естественно выражает её по-русски.
- source_word: יָבוֹא רָקָב בַּעֲצָמַי
  choice: Гниль проникла в мои кости
  rationale: רָקָב означает гниение, тление. Сильная метафора внутреннего распада сохранена без смягчения.
- source_word: וְתַחְתַּי אֶרְגָּז
  choice: и ноги подо мной задрожали
  rationale: Буквально выражение говорит о дрожи «подо мной» и передаёт утрату устойчивости. Упоминание ног естественно раскрывает образ по-русски, не превращая его в дрожание земли.
- source_word: אֲשֶׁר אָנֻוּחַ
  choice: Я тихо жду
  rationale: נוּחַ может означать «покоиться», «успокоиться», «оставаться в покое». В контексте страха перед грядущим бедствием «тихо жду» сохраняет сочетание ужаса и покорного ожидания; иной смысл отмечен в сноске.
- source_word: לְיוֹם צָרָה
  choice: дня бедствия
  rationale: צָרָה обозначает беду, притеснение или тяжёлое бедствие. Выбранное слово сохраняет серьёзность выражения, не уточняя природу события.
- source_word: לַעֲלוֹת
  choice: когда выступит
  rationale: עָלָה буквально означает «подниматься, восходить», а в военном контексте — выступать или наступать. «Выступит» сохраняет военный образ и естественно связывает его с народом.
- source_word: לְעַם יְגוּדֶנּוּ
  choice: народ, который нападёт на нас
  rationale: Корень גדד связан с набегом и нападением. Относительная конструкция ясно передаёт в основном тексте наступление вражеского народа; трудность еврейского синтаксиса и возможный оттенок набега отмечены в сноске.
theological_decisions:
- issue: Смысл אֲשֶׁר אָנֻוּחַ в контексте
  choice: Пророк тихо ожидает назначенного дня бедствия.
  alternative: «Чтобы мне обрести покой в день бедствия» или «чтобы я покоился до дня бедствия».
  rationale: Контекст соединяет телесный ужас с верным ожиданием. Основной перевод не превращает эту строку в более определённое обещание избавления, чем позволяет еврейский текст.
- issue: Кто выступает и на кого направлено нападение в последней строке
  choice: Наступает народ, который нападёт на говорящего и его сообщество.
  alternative: 'Последнюю строку можно понимать как выступление против народа, совершающего набег, либо передать более неопределённо: «когда на нас поднимутся грабители».'
  rationale: Еврейская конструкция с לַעֲלוֹת לְעַם и местоименным суффиксом синтаксически трудна. Основной текст следует контексту вражеского вторжения, а сноска сохраняет альтернативу, не делая из неё отдельного богословского утверждения.
