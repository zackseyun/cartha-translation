  text: בְּ/זַ֖עַם תִּצְעַד אָ֑רֶץ בְּ/אַ֖ף תָּד֥וּשׁ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/012.yaml
  text: In wrath you marched through the earth[b][a]; in anger you threshed the nations.
translation:
  language: ru
  text: 'В ярости Ты шествовал по земле[a],

    в гневе молотил народы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по стране»; еврейское слово может обозначать как землю вообще, так и определённую страну.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «попирал народы»; еврейский глагол обозначает обмолот, который часто совершали, попирая зерно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזַעַם
  choice: В ярости
  rationale: Сочетание предлога ב с זַעַם описывает состояние или образ действия. «В ярости» естественно по-русски передаёт силу Божьего негодования.
- source_word: תִּצְעַד
  choice: Ты шествовал
  rationale: Глагол צעד обозначает шагание, поступь. В контексте поэтической теофании «шествовал» передаёт величественное и целенаправленное движение, не добавляя явно не выраженного направления.
- source_word: אָרֶץ
  choice: по земле
  rationale: אָרֶץ может означать как всю землю, так и отдельную страну. В космической картине явления Бога и при параллели с народами предпочтительно широкое значение «земля».
- source_word: בְּאַף
  choice: в гневе
  rationale: אַף буквально означает «нос», но устойчиво выражает гнев. «В гневе» — естественный русский эквивалент, сохраняющий параллелизм первой строки.
- source_word: תָּדוּשׁ
  choice: молотил
  rationale: דושׁ прежде всего обозначает обмолот, часто совершаемый попиранием. «Молотил» сохраняет земледельческую метафору и её суровую образность.
- source_word: גּוֹיִם
  choice: народы
  rationale: גּוֹיִם здесь обозначает народы, подвергающиеся Божьему суду. Этот перевод прям и не вносит более поздних конфессиональных оттенков слова «язычники».
theological_decisions:
- issue: Масштаб значения אָרֶץ в картине Божьего суда
  choice: земля
  alternative: страна
  rationale: Контекст гимна рисует широкую, космическую картину Божьего шествия, а упоминание народов поддерживает значение «земля». Возможность локального значения сохранена в сноске.
- issue: Образ действия над народами в תָּדוּשׁ
  choice: молотил народы
  alternative: попирал народы
  rationale: Основной перевод сохраняет метафору обмолота и не сглаживает напряжённый образ Божьего суда; сноска поясняет подразумеваемое попирание.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим регистром. Параллелизм строк и земледельческая метафора оригинала сохранены; местоимение «Ты» написано с прописной буквы как уважительное обращение к Богу.
