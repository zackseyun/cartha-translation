  text: וַ/אֲנִ֖י בַּ/יהוָ֣ה אֶעְל֑וֹזָה אָגִ֖ילָה בֵּ/אלֹהֵ֥י יִשְׁעִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/018.yaml
  text: Yet I will rejoice in Yahweh[b][a]; I will exult in the God of my salvation.
translation:
  language: ru
  text: А я всё же буду радоваться в Яхве, буду ликовать в Боге моего спасения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я всё же
  rationale: Самостоятельное местоимение подчёркивает личную решимость пророка, а союз в контексте выражает резкое противопоставление бедствию, описанному в предыдущем стихе.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב указывает на того, в ком сосредоточена радость; личное имя יהוה передано транслитерацией «Яхве».
- source_word: אֶעְלוֹזָה
  choice: буду радоваться
  rationale: Глагол выражает ликующую радость; «радоваться» естественно звучит по-русски и допускает поэтическое усиление следующим близким по смыслу глаголом.
- source_word: אָגִילָה
  choice: буду ликовать
  rationale: Глагол גיל обозначает бурную, торжествующую радость; «ликовать» сохраняет усиление и не сводит два еврейских глагола к одному русскому слову.
- source_word: בֵּאלֹהֵי
  choice: в Боге
  rationale: Повтор предлога ב сохранён, а сочетание передаёт конструкцию сопряжённого состояния с последующим существительным.
- source_word: יִשְׁעִי
  choice: моего спасения
  rationale: Существительное ישע может означать спасение или избавление; «моего спасения» сохраняет личный суффикс и возвышенный поэтический регистр.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо употреблено личное имя Бога, поэтому оно сохранено как «Яхве», без замены титулом.
- issue: Смысл выражения בֵּאלֹהֵי יִשְׁעִי
  choice: в Боге моего спасения
  alternative: в Боге, Который спасает меня
  rationale: 'Сохранена неоднозначная именная конструкция оригинала: Бог может осмысляться и как источник спасения, и как Само спасение говорящего; развёрнутая передача сузила бы её смысл.'
translation_notes:
  register: Современный литературный русский язык с поэтической приподнятостью. Пара «радоваться — ликовать» передаёт параллелизм и нарастание эмоциональной силы; «А я всё же» естественно выражает контраст с предыдущим стихом.
