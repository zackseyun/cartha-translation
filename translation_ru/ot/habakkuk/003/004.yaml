lexical_decisions:
- source_word: נֹגַהּ
  choice: сияние
  rationale: Слово обозначает яркое сияние или блеск; «сияние» естественно для возвышенной поэзии и не усиливает значение до «славы» или «великолепия».
- source_word: כָּאוֹר
  choice: словно свет
  rationale: Префикс כְּ выражает сравнение, а אוֹר означает «свет». Формулировка сохраняет образ и его лаконичность.
- source_word: תִּהְיֶה
  choice: передано именной конструкцией «Сияние Его — словно свет»
  rationale: Еврейская форма допускает временную неоднозначность в поэтическом описании явления Бога. Русская именная конструкция звучит естественно и не навязывает прошедшее либо будущее время.
- source_word: קַרְנַיִם
  choice: лучи
  rationale: Буквально двойственное число от «рог», но здесь выступы света осмысляются как лучи. Основной текст передаёт контекстуальный образ, а буквальное значение отмечено в сноске.
- source_word: מִיָּדוֹ
  choice: из Его руки
  rationale: יָד обычно означает «рука», а מִן указывает на источник. Телесный поэтический образ сохранён без абстрагирующего пересказа.
- source_word: לוֹ
  choice: отражено в отнесении лучей к Нему
  rationale: Местоименный элемент синтаксически непрост; русский текст естественно связывает лучи с божественным лицом через выражение «из Его руки», не добавляя отдельного тяжеловесного «у Него».
- source_word: חֶבְיוֹן
  choice: сокрыта
  rationale: Существительное означает сокрытие или тайное место. В русском языке предикативная форма «сокрыта» ясно передаёт смысл и сохраняет поэтическую сжатость.
- source_word: עֻזּוֹ
  choice: Его сила
  rationale: עֹז означает силу, мощь или могущество. «Сила» — прямой и богословски нейтральный русский эквивалент.
theological_decisions:
- issue: Антропоморфный образ руки в богоявлении
  choice: Сохранить выражение «из Его руки»
  alternative: 'Передать отвлечённо: «исходят от Него» или «рядом с Ним»'
  rationale: В еврейском тексте использован телесный образ. Его сохранение уважает поэтическую форму источника и не требует буквального или демифологизирующего истолкования.
- issue: Временная отнесённость תִּהְיֶה
  choice: Использовать русскую именную конструкцию без явного времени
  alternative: «было», «будет» или «стало»
  rationale: Форма несовершенного вида в поэтическом видении может пониматься по-разному. Безглагольная конструкция сохраняет эту неоднозначность и подходит для живого описания богоявления.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Синтаксис сохраняет краткость и образность еврейской строки; местоимение «Его» добавлено в первой фразе для ясного указания на Бога в русском контексте.
