  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: ru
  text: то и Я пойду против вас в яростной вражде[a] и Сам семикратно накажу вас за ваши грехи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ярости противления»; традиционно: «пойду против вас в ярости».'
