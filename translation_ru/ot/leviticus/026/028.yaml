  - marker: b
    text: 'Или: «накажу вас семь раз за ваши грехи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי עִמָּכֶם
  choice: и Я пойду против вас
  rationale: Сохранён образ «хождения», повторяющийся в Лев 26; предлог עִם буквально означает «с», но вместе с קֶרִי выражает здесь противостояние.
- source_word: בַּחֲמַת קֶרִי
  choice: в яростной вражде
  rationale: חֵמָה передаёт ярость или гнев, а редкое и трудное קֶרִי в контексте обозначает враждебное противодействие. Сочетание сохраняет силу выражения, не выдавая спорную этимологию за несомненную.
- source_word: וְיִסַּרְתִּי
  choice: накажу
  rationale: יסר может обозначать наказание, взыскание или вразумляющее исправление. В контексте усиливающихся заветных кар «накажу» звучит естественно и не исключает дисциплинарного оттенка.
- source_word: אַף אֲנִי
  choice: и Сам
  rationale: 'Передаёт усилительное значение: действующим лицом выступает Сам Бог; начальное «и» также сохраняет значение אַף как присоединительного усиления.'
- source_word: שֶׁבַע
  choice: всемеро
  rationale: Кратко и естественно передаёт идиоматическое семикратное усиление кары; буквальная возможность «семь раз» отмечена в сноске.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: за ваши грехи
  rationale: Предлог עַל указывает на основание наказания; русское «за» ясно и естественно выражает эту причинную связь.
theological_decisions:
- issue: Характер Божьего ответа в проклятиях завета
  choice: Сохранить и язык противостояния («пойду против вас»), и многозначный язык взыскания («накажу»).
  alternative: Передать יסר как «буду вразумлять» или, напротив, свести всё высказывание к чисто карательной формуле.
  rationale: Еврейский текст соединяет образ Божьего противостояния с глаголом יסר, который допускает как карательный, так и исправительный оттенок. Перевод не должен ни смягчать враждебность суда, ни исключать дисциплинарную смысловую составляющую.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Пойду» сохраняет сквозной образ главы, «всемеро» естественно передаёт усиление. Все сноски отмечены в основном тексте.
