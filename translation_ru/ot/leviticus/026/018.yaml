base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: ru
  text: Если же, несмотря на это[a], вы не станете слушать Меня, то Я буду и дальше наказывать вас семикратно за ваши грехи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после всего этого». Еврейское выражение относится к предшествующим карам и в данном контексте подразумевает, что народ всё ещё не слушает Бога вопреки им.'
    reason: lexical_alternative
  - marker: b
    text: 'Также: «в семь раз» или «всемеро». Здесь может подразумеваться усиленная мера наказания, а не строго определённое число отдельных наказаний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם עַד אֵלֶּה
  choice: Если же и после этого
  rationale: Условное וְאִם продолжает ряд предостережений, а идиома עַד אֵלֶּה в данном контексте означает упорство вопреки уже совершившимся карам. Русское «и после этого» естественно передаёт эту контекстуальную связь; альтернативное «несмотря на всё это» указано в сноске.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: вы не станете слушать Меня
  rationale: שׁמע с ל подразумевает не только слышание, но и послушный отклик. «Слушать Меня» сохраняет образ исходного текста, не сводя его явно только к повиновению.
- source_word: וְיָסַפְתִּי לְיַסְּרָה אֶתְכֶם
  choice: Я продолжу наказывать вас
  rationale: יסף выражает продолжение и усиление уже начатых мер, а יסר в контексте заветных кар совмещает наказание с исправительной целью. «Продолжу наказывать» звучит естественно и сохраняет реальную суровость контекста.
- source_word: שֶׁבַע
  choice: в семь раз строже
  rationale: Числительное употреблено наречно и может обозначать семикратную меру либо предельное усиление наказания. «В семь раз строже» ясно связывает его с интенсивностью наказания, не утверждая число отдельных актов.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: за ваши грехи
  rationale: עַל указывает на основание наказания; русское «за ваши грехи» кратко и естественно передаёт причинно-возмездную связь.
theological_decisions:
- issue: Характер יסר в контексте проклятий завета
  choice: наказывать
  alternative: вразумлять; подвергать взысканию
  rationale: Контекст требует сохранить карательную силу действия, однако глагол יסר может включать исправительную цель. «Наказывать» не исключает этой цели, а сноска не нужна, поскольку в данном стихе основное значение достаточно ясно.
- issue: Значение שֶׁבַע
  choice: в семь раз строже
  alternative: семикратно; семь раз
  rationale: Формула допускает как количественное, так и усилительное понимание. Основной текст передаёт усиление меры, а сноска сохраняет возможность более буквального прочтения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Прописная буква в «Меня» следует принятой русской библейской издательской норме для местоимения, относящегося к Богу. Формулировка избегает архаизмов и сохраняет условный ход речи, суровость заветной кары и неоднозначность семикратной меры.
