    rationale: וְאֵין רֹדֵף — сочинённое сообщение «и нет преследующего». Контекст действительно выражает парадокс панического бегства, но нейтральное «и никто не будет гнаться за вами» точнее сохраняет синтаксис; уступительное осмысление уместно отметить в сноске.
