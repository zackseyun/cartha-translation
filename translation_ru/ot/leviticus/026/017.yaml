base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: ru
  text: Я обращу лицо Моё против вас[a], и вы будете разбиты[b] перед своими врагами. Те, кто вас ненавидит, будут господствовать над вами, и вы обратитесь в бегство, и никто не будет гнаться за вами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я обращу лицо Моё против вас»; это древнееврейский образ решительного противостояния и суда.'
    reason: cultural_note
  - marker: b
    text: 'Или: «вы потерпите поражение».'
    reason: lexical_alternative
  - marker: c
    text: 'Или, по смыслу: «хотя никто не будет гнаться за вами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: Я обращу Моё лицо против вас
  rationale: Сохранён древнееврейский образ личного и решительного противостояния Бога в суде. Глагол «обращу» естественнее для современного русского языка, чем буквальное «положу», а «Моё лицо» передаёт פָנַי.
- source_word: וְנִגַּפְתֶּם
  choice: вы будете разбиты
  rationale: Форма нифаль от נגף в военном контексте означает быть поражёнными или потерпеть поражение. «Будете разбиты» сохраняет образность и силу выражения.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: перед своими врагами
  rationale: 'Прямо передаёт пространственно-военное значение выражения: поражение произойдёт перед лицом врагов.'
- source_word: וְרָדוּ בָכֶם
  choice: будут господствовать над вами
  rationale: רדה обозначает владычество или господство. Выбор передаёт подчинение власти ненавидящих, не усиливая текст до прямо не выраженной тирании.
- source_word: שֹׂנְאֵיכֶם
  choice: ненавидящие вас
  rationale: Причастие обозначает именно тех, кто ненавидит адресатов, и сохраняет отличие от ранее употреблённого אֹיְבֵיכֶם — «ваши враги».
- source_word: וְנַסְתֶּם
  choice: вы побежите
  rationale: נוס — обычный глагол бегства; в данном контексте «побежите» естественно передаёт паническое отступление.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: хотя никто не будет вас преследовать
  rationale: Русский уступительный союз ясно передаёт контекстуальный смысл панического бегства без реального преследователя; формально сочинительное прочтение отмечено в сноске.
theological_decisions:
- issue: Антропоморфное описание Божьего суда
  choice: 'Сохранить образ: «Я обращу Моё лицо против вас»'
  alternative: «Я выступлю против вас»
  rationale: Образ лица выражает личное, заветное и решительное противостояние Бога и не должен сводиться к абстрактному обозначению враждебности.
- issue: Характер власти ненавидящих Израиль
  choice: «будут господствовать над вами»
  alternative: «будут угнетать вас»
  rationale: Текст прямо говорит о господстве и подчинении, но в этой фразе не уточняет форму или степень жестокости; перевод не добавляет такого уточнения.
- issue: Логическая связь в заключительной фразе
  choice: «хотя никто не будет вас преследовать»
  alternative: «и никто не будет вас преследовать»
  rationale: Контекст поддерживает уступительное понимание, однако древнееврейский союз допускает более формальное сочинение; альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллелизм, военная образность и антропоморфный оборот оригинала; синтаксис остаётся ясным для обычного современного читателя.
