base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: ru
  text: 'И пошлю на вас диких зверей[a]: они лишат вас детей[b], истребят ваш скот и уменьшат ваше число, и ваши дороги опустеют[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «полевых зверей».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «лишат вас»; глагол обычно подразумевает лишение детей.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ваши пути придут в запустение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: И пошлю на вас
  rationale: Глагол в породе hифиль прямо выражает действие «послать», а ב при враждебном воздействии естественно передаётся по-русски как «на вас».
- source_word: חַיַּת הַשָּׂדֶה
  choice: диких зверей
  rationale: Сочетание обозначает диких наземных животных; «дикие звери» естественно, ясно и сохраняет собирательный смысл.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: они лишат вас детей
  rationale: Пиэль שׁכל обычно означает лишение детей. Дополнение «детей» подразумевается идиомой и вынесено в сноску как экспликация, поскольку в еврейском тексте оно не названо отдельно.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: истребят ваш скот
  rationale: הכרית в контексте суда означает уничтожить, истребить; «истребят» передаёт силу выражения естественнее буквального «отсекут». בְּהֵמָה здесь — домашний скот.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: уменьшат ваше число
  rationale: Каузатив מעט означает «сделать малочисленными»; выбранная формулировка ясно передаёт сокращение численности народа.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: так что ваши дороги опустеют
  rationale: נשׁם выражает запустение, а множественное דְּרָכִים в данном контексте естественно понимать как реальные дороги или пути сообщения. «Так что» передаёт итоговую связь последнего положения с предшествующим бедствием.
theological_decisions:
- issue: Подразумеваемый объект при שׁכל
  choice: В основном тексте уточнено «лишат вас детей», с пояснением в сноске.
  alternative: Оставить более формальное и двусмысленное «лишат вас близких» или «сделают вас бездетными».
  rationale: В библейском употреблении данный глагол обычно говорит об утрате детей. Уточнение делает идиому понятной современному читателю, а сноска честно отмечает, что слово «детей» отдельно не стоит в исходном тексте.
- issue: Значение דַּרְכֵיכֶם
  choice: Буквальные дороги, которые опустеют.
  alternative: Переносное «ваши пути» в смысле образа жизни.
  rationale: Контекст обезлюдения вследствие нападений диких зверей поддерживает буквальное значение дорог и путей сообщения, но лексическая возможность «пути» сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Синтаксис сохраняет последовательность угроз исходного текста; лексика понятна широкому кругу читателей.
