  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: ru
  text: 'Напрасно истощатся ваши силы[a]: ваша земля не даст урожая, и деревья этой земли не принесут плодов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «ваши силы иссякнут впустую»; далее букв.: «дерево этой земли не даст своего плода».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: истощатся
  rationale: Глагол תמם здесь означает, что силы иссякнут или будут израсходованы; «истощатся» естественно передаёт этот смысл.
- source_word: לָרִיק
  choice: напрасно
  rationale: Выражает тщетность и отсутствие результата; «напрасно» ясно и идиоматично в контексте заветного проклятия.
- source_word: כֹּחֲכֶם
  choice: ваши силы
  rationale: В контексте земледельческого труда כח обозначает физические силы и усилия; множественное число естественно по-русски.
- source_word: תִתֵּן
  choice: даст / принесут
  rationale: Буквальное «давать» сохранено для земли, тогда как с деревьями русское «принесут плоды» звучит естественно и точно передаёт сельскохозяйственный смысл.
- source_word: אַרְצְכֶם
  choice: ваша земля
  rationale: Здесь ארץ означает принадлежащую народу и возделываемую землю, а не земной шар или государство.
- source_word: יְבוּלָהּ
  choice: урожая
  rationale: יבול обозначает плодородный выход земли, её урожай; это наиболее ясный современный русский эквивалент.
- source_word: וְעֵץ הָאָרֶץ
  choice: деревья на земле
  rationale: Единственное עץ имеет собирательное значение; по-русски естественно передать его множественным числом. Предлог «на» в данном контексте яснее обозначает растущие там деревья.
- source_word: פִּרְיוֹ
  choice: плодов
  rationale: Еврейское местоименное окончание единственного числа согласовано с собирательным עץ; русский перевод во множественном числе согласован с «деревья».
