  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: ru
  text: Вы будете есть старые, давно хранившиеся запасы и уберёте старые из-за новых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и вынесете старое из-за нового».'
    reason: Сноска сохраняет более формальную передачу תּוֹצִיאוּ («вынесете») и компактное субстантивированное единственное число еврейского текста.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: вы будете есть
  rationale: Форма с вау в последовательности благословений имеет значение будущего обещания; русское будущее время передаёт это естественно.
- source_word: יָשָׁן
  choice: старые запасы
  rationale: Прилагательное употреблено субстантивно и подразумевает припасы прежних урожаев. «Запасы» сохраняет обобщённость, не сводя смысл только к зерну.
- source_word: נוֹשָׁן
  choice: долго хранившиеся
  rationale: Форма подчёркивает давность запасов. Такой перевод передаёт длительность хранения без отрицательного оттенка испорченности.
- source_word: וְיָשָׁן
  choice: старое
  rationale: Повторное субстантивированное прилагательное обозначает прежние запасы; компактный перевод сохраняет параллелизм оригинала.
- source_word: מִפְּנֵי
  choice: ради
  rationale: Предлог выражает обусловленность или вытеснение старого новым. «Ради» естественно передаёт, что старое убирают в связи с появлением нового, не перегружая основной текст пояснением.
- source_word: חָדָשׁ
  choice: нового
  rationale: Субстантивированное прилагательное обозначает новые припасы или новый урожай; краткая форма сохраняет лаконичность еврейского текста.
- source_word: תּוֹצִיאוּ
  choice: уберёте
  rationale: Каузатив от יצא буквально означает «вынесете». В данном контексте речь идёт об удалении прежних запасов перед новыми; «уберёте» естественно выражает практический смысл, а буквальный вариант отмечен в сноске.
