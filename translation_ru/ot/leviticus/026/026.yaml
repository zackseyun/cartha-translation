translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и образности исходного текста. Заглавная буква в «Я» указывает на говорящего Бога по контексту. Синтаксис слегка сглажен для естественности, но последовательность угрозы — скудость — выдача по весу — ненасыщение сохранена.
