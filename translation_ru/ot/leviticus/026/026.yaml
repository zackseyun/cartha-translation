base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: ru
  text: Когда Я лишу вас хлебного запаса[a], десять женщин будут печь ваш хлеб в одной печи и выдавать вам хлеб на вес. Вы будете есть, но не насытитесь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посох хлеба» — идиоматическое обозначение хлебного запаса, поддерживающего жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: Когда Я сокрушу
  rationale: Инфинитивная конструкция с בְּ образует временное придаточное. «Сокрушу» сохраняет яркий образ суда и метафорическое значение שׁבר.
- source_word: מַטֵּה לֶחֶם
  choice: опору хлеба
  rationale: Буквально «посох хлеба»; это образ хлеба как средства, поддерживающего жизнь. «Опора хлеба» сохраняет метафору, а буквальный образ поясняется в сноске.
- source_word: עֶשֶׂר נָשִׁים
  choice: десять женщин
  rationale: Прямой перевод, сохраняющий конкретную бытовую картину приготовления хлеба.
- source_word: בְּתַנּוּר אֶחָד
  choice: в одной печи
  rationale: Естественное русское выражение; одна печь на десять женщин подчёркивает крайнюю скудость припасов.
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם
  choice: и отдавать вам его
  rationale: Hiphil שׁוב означает «возвращать, отдавать обратно». Местоимение устраняет неестественный для русского повтор слова «хлеб».
- source_word: בַּמִּשְׁקָל
  choice: по весу
  rationale: Передаёт выдачу скудного хлеба строго взвешенными порциями.
- source_word: וְלֹא תִשְׂבָּעוּ
  choice: но не насытитесь
  rationale: שׂבע обозначает насыщение пищей; «не насытитесь» точно и естественно передаёт телесный голод.
