id: LEV.26.41
reference: Leviticus 26:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: ru
  text: И Я буду поступать с ними враждебно и приведу их в землю их врагов; или тогда[c] смирится их необрезанное сердце[a], и тогда они примут наказание за своё беззаконие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их необрезанное сердце». Это заветная метафора внутренней нечистоты и упорства.'
    reason: cultural_note
  - marker: b
    text: 'Возможные переводы: «понесут наказание за своё беззаконие», «возместят свою вину» или «их беззаконие будет искуплено». Еврейское выражение говорит о принятии или несении положенного последствия вины.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «или тогда». Еврейская конструкция трудна; она может вводить момент, когда их сердце смирится.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: И Я
  rationale: Сочетание אַף с самостоятельным местоимением подчёркивает ответное действие Бога. В русском контексте эту взаимность естественно передают союз «и» и выделенное местоимение «Я».
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: поступлю с ними враждебно
  rationale: Буквально говорится о хождении с ними враждебно или вопреки им. «Поступлю с ними враждебно» естественно звучит по-русски и сохраняет мотив ответной враждебности, повторяющийся в главе.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: и приведу их в землю их врагов
  rationale: Порода hифиль глагола בוא означает «привести»; формулировка сохраняет тему изгнания в чужую землю.
- source_word: אוֹ אָז
  choice: или тогда
  rationale: Сохранена необычная разделительная конструкция еврейского текста без устранения её синтаксической трудности.
- source_word: יִכָּנַע
  choice: смирится
  rationale: Нифаль от כנע означает «быть смирённым, покориться». Возвратное «смирится» при слове «сердце» естественно передаёт внутреннее сокрушение, не исключая значения покорения.
- source_word: לְבָבָם הֶעָרֵל
  choice: их необрезанное сердце
  rationale: Сохранена буквальная заветная метафора, важная для связей с Второзаконием и пророческими книгами; она не сведена к одному толкованию вроде «упрямое».
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: и тогда они понесут наказание за своё беззаконие
  rationale: Идиома указывает на несение или удовлетворение последствий вины. «Понесут наказание» ясно выражает судебный смысл и не подразумевает самостоятельного искупления заслугами.
theological_decisions:
- issue: Метафора הֶעָרֵל применительно к сердцу
  choice: Сохранить «необрезанное сердце»
  alternative: «упрямое сердце» или «нераскаянное сердце»
  rationale: Исходный текст использует насыщенную заветную метафору. Её сохранение не сужает смысл до одного психологического качества и поддерживает межтекстовые связи.
- issue: Значение יִרְצוּ אֶת עֲוֺנָם
  choice: «понесут наказание за своё беззаконие»
  alternative: «искупят своё беззаконие», «возместят за своё беззаконие» или «примут наказание за своё беззаконие»
  rationale: Контекст говорит о несении положенного последствия вины. Выбор не вносит представления о заслуженном человеком самоискуплении, но сохраняет судебную сторону выражения.
- issue: Необычная связь אוֹ אָז
  choice: Сохранить «или тогда»
  alternative: 'Сгладить как «когда же» или понять условно: «если тогда»'
  rationale: Еврейская конструкция трудна и допускает разные способы синтаксического понимания; буквальная связка сохраняет эту реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксическая трудность «или тогда» и метафора «необрезанное сердце» сохранены; чрезмерные архаизмы исключены.
