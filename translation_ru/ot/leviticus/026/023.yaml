source:
  edition: WLC
  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: ru
  text: Если же и через всё это вы не примете от Меня вразумления и будете враждебны Мне[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «будете ходить со Мной враждебно (или: наперекор Мне)». Значение еврейского слова допускает оттенки враждебности, противления и упрямого несогласия.'
    reason: Сохранение необычной еврейской идиомы и неоднозначности редкого слова קֶרִי.
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: и через всё это
  rationale: 'Предлог בְּ понят инструментально: речь о предшествующих карах, посредством которых Бог вразумляет народ. Частица «и» передаёт усилительный оттенок в условной конструкции.'
- source_word: תִוָּסְרוּ לִי
  choice: не примете от Меня вразумления
  rationale: Нифаль глагола יסר обозначает подвергнуться исправляющему наказанию или быть вразумлённым. По-русски буквальная пассивная конструкция звучала бы тяжеловесно; выбранная формулировка ясно показывает, что Божье воздействие имело место, но не было принято, и сохраняет связь местоимения לִי с Богом.
- source_word: וַהֲלַכְתֶּם
  choice: и будете
  rationale: В условном периоде форма с waw продолжает описание поведения адресатов. Смысловой глагол «ходить» в русском не воспроизводится отдельно, поскольку выражение עִמִּי קֶרִי передано естественным описанием отношения.
- source_word: עִמִּי קֶרִי
  choice: будете враждебны Мне
  rationale: Редкое существительное קֶרִי в Левите 26 выражает противление или враждебную установку, а עִמִּי буквально означает «со Мной». Русская формулировка передаёт отношение к Богу естественно и не сводит его просто к непослушанию.
theological_decisions:
- issue: Значение заветного выражения עִמִּי קֶרִי
  choice: будете враждебны Мне
  alternative: будете поступать со Мной наперекор
  rationale: Основной текст передаёт устойчивое в контексте значение враждебного противления Богу, а примечание сохраняет необычный образ «хождения с Богом» в состоянии противодействия, не устраняя лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «примете… вразумление» понятна обычному читателю и передаёт безуспешность уже совершавшегося Божьего исправляющего воздействия. Стих оканчивается запятой, поскольку синтаксически продолжается следующим стихом.
