  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: ru
  text: Вот уставы, постановления и законы, которые Яхве дал как условия между Собой и сынами Израиля на горе Синай через Моисея[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Моисея»; это выражение означает «через Моисея».'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Естественное русское указательное начало итоговой формулы; вводит перечисление предшествующих установлений.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Передаёт закреплённые предписания חֻקִּים в формальном правовом регистре.
- source_word: הַמִּשְׁפָּטִים
  choice: установления
  rationale: Передаёт מִשְׁפָּטִים как правовые нормы и решения, сохраняя отличие от соседних חֻקִּים и תּוֹרֹת без неестественного здесь русского «суды».
- source_word: הַתּוֹרֹת
  choice: законы
  rationale: Во множественном числе и в составе юридической триады תּוֹרֹת обозначает авторитетные наставления или комплексы законов; «законы» естественно в данном контексте.
- source_word: אֲשֶׁר נָתַן
  choice: которые ... дал
  rationale: Прямо передаёт обычное значение נָתַן и не заменяет исходную формулировку толкованием «установил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени, представленного тетраграмматоном, а не замена его титулом.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: как условия между Собой и сынами Израиля
  rationale: Добавление «как условия» делает по-русски понятной необычную конструкцию «дал между», а «сынами Израиля» сохраняет форму этноковенантного выражения.
- source_word: בְּהַר סִינַי
  choice: у горы Синай
  rationale: בְּ допускает локативное значение; «у горы Синай» естественно обозначает место дарования закона, не утверждая однозначно, что весь Израиль находился на вершине.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Естественно передаёт древнееврейскую идиому «рукой Моисея», обозначающую посредничество.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя; транслитерация сохраняет его и не подменяет титулом.
- issue: Смысл конструкции נָתַן ... בֵּינוֹ וּבֵין
  choice: дал как условия между Собой и сынами Израиля
  alternative: дал между Собой и сынами Израиля
  rationale: Буквальная конструкция неестественна по-русски. «Как условия» эксплицирует ковенантно-правовую связь, не превращая глагол «дал» в более интерпретативное «установил».
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Сохраняется традиционное и формально близкое этноковенантное выражение; современный собирательный эквивалент указан в примечании.
translation_notes:
  register: Современный литературный русский с торжественным юридико-заветным оттенком. Триада правовых терминов сохранена, но разграничена естественными русскими словами. Заглавная буква в «Собой» относится к Яхве и облегчает соотнесение местоимения.
