  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: ru
  text: И Я обращусь к вам, сделаю вас плодовитыми и многочисленными и утвержу Мой завет с вами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подтвержу Мой завет с вами».'
    reason: Еврейский оборот с глаголом קום может означать установление, подтверждение или поддержание завета.
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: И Я обращусь к вам
  rationale: Сохраняет конкретный образ еврейского פנה с направительным אֶל; в контексте благословений обращение Бога подразумевает благоволение, но не подменяется его истолкованием.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: сделаю вас плодовитыми
  rationale: Передаёт каузативный Hiphil глагола פרה и сохраняет лексику библейской формулы плодородия и умножения.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: и многочисленными
  rationale: В сочетании с общим глаголом «сделаю» естественно передаёт каузативное значение רבה — сделать народ многочисленным; по-русски это яснее, чем буквальное «умножу вас».
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי
  choice: и утвержу Мой завет
  rationale: В сочетании с «заветом» Hiphil קום означает установить, подтвердить или утвердить его. «Утвержу» естественно допускает как подтверждение уже данного завета, так и придание ему прочной силы.
- source_word: אִתְּכֶם
  choice: с вами
  rationale: Прямо и естественно передаёт участников заветных отношений.
theological_decisions:
- issue: Следует ли прямо выражать благоволение в словах о Божьем обращении к народу
  choice: Сохранить конкретное «Я обращусь к вам»
  alternative: «Я благосклонно взгляну на вас»
  rationale: Контекст несомненно благоприятный, однако сам глагол означает «повернуться, обратиться». Основной текст сохраняет образ и не сводит его к одному истолкованию.
- issue: Как передать формулу плодородия и умножения
  choice: «сделаю вас плодовитыми и многочисленными»
  alternative: «сделаю вас плодовитыми и умножу вас»
  rationale: Выбранная формулировка сохраняет два координированных каузативных значения и звучит естественно в современном русском, не ограничивая благословение исключительно арифметическим ростом.
- issue: Значение וַהֲקִימֹתִי при уже существующем завете
  choice: «утвержу Мой завет»
  alternative: «установлю Мой завет»
  rationale: «Утвержу» сохраняет напряжение между установлением и подтверждением завета и хорошо соответствует контексту отношений, уже описанных в Пятикнижии.
translation_notes:
  register: Современный литературный русский с достоинством прямой божественной речи. Местоимения первого лица в речи Бога написаны с прописной буквы. Пара «плодовитыми и многочисленными» передаёт библейскую формулу естественно для обычного читателя; сноска отмечает реальную смысловую широту заветного глагола.
