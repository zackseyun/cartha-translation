source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: ru
  text: Но ради них Я вспомню завет с прежними поколениями[a], которых Я вывел из земли Египетской перед глазами народов, чтобы быть их Богом. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «завет с предками». Буквально: «завет [с] прежними»; дальнейшие слова указывают на тех, кого Бог вывел из Египта.'
    reason: Лексическая и синтаксическая неоднозначность выражения בְּרִית רִאשֹׁנִים.
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Но ... Я вспомню
  rationale: Союз וְ в контексте вводит противопоставленный суду поворот к милости; «но» естественно передаёт ход мысли.
- source_word: לָהֶם
  choice: ради них
  rationale: Передаёт значение ל как направленность воспоминания им во благо; по-русски естественнее, чем буквальное «для них».
- source_word: בְּרִית רִאשֹׁנִים
  choice: завет с прежними поколениями
  rationale: רִאשֹׁנִים — субстантивированное множественное «прежние/первые»; формулировка сохраняет историческую отсылку и не сужает её до патриархов, поскольку далее речь идёт о выведенных из Египта.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: которых Я вывел
  rationale: Относительное предложение относится к людям, обозначенным словом רִאשֹׁנִים, а не к завету.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет торжественную и узнаваемую формулу исхода, оставаясь понятной современному читателю.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: перед глазами народов
  rationale: Близко передаёт еврейскую идиому и подчёркивает публичный, засвидетельствованный характер исхода.
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: чтобы быть их Богом
  rationale: Естественная русская форма стандартной формулы завета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
theological_decisions:
- issue: К кому относится выражение בְּרִית רִאשֹׁנִים
  choice: Завет с прежними поколениями, которых Бог вывел из Египта
  alternative: Завет с праотцами / первый завет как установление
  rationale: Сжатая еврейская конструкция допускает разные способы выражения, однако последующее «которых Я вывел» указывает на людей — поколение или поколения исхода. Перевод не отождествляет их без оговорок с патриархами.
- issue: Смысл Божьего «воспоминания»
  choice: Сохранён глагол «вспомню» как язык заветного действия
  alternative: «Не забуду» или «исполню обещанное»
  rationale: Перефразирование могло бы преждевременно истолковать библейский антропоморфный и заветный язык; прямой перевод сохраняет его богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Прописная «Я» употреблена в прямой речи Бога; двоеточие перед заключительной формулой заменено точкой ради естественного русского синтаксиса.
