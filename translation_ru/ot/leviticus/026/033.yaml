base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: ru
  text: А вас Я рассею среди народов и обнажу меч[a], преследуя вас; земля ваша станет пустыней, а города ваши — развалинами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обнажу меч вслед за вами».'
    reason: Буквальный вариант еврейской идиомы; основной текст передаёт её значение военного преследования в естественной русской форме.
lexical_decisions:
- source_word: אֱזָרֶה
  choice: рассею
  rationale: Глагол זרה в породе hифиль означает разбрасывать, рассеивать. «Рассею» естественно передаёт принудительное расселение среди других народов и сохраняет образ суда.
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь обозначает чужие народы как политико-этнические общности. «Среди народов» точно передаёт контекст изгнания и не привносит более поздних оттенков слова «язычники».
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: обнажу меч
  rationale: Сочетание ריק с חֶרֶב — идиома со значением вынуть меч из ножен, обнажить его. «Обнажу меч» кратко и естественно сохраняет конкретный военный образ.
- source_word: אַחֲרֵיכֶם
  choice: вслед за вами
  rationale: Буквально «за вами»; в данном контексте выражает преследование. «Вслед за вами» сохраняет образную формулировку оригинала, не заменяя её истолкованием.
- source_word: שְׁמָמָה
  choice: пустыней
  rationale: Существительное обозначает опустошённое, безлюдное место. Творительный предикатив после «станет» сохраняет именную конструкцию и звучит естественно по-русски.
- source_word: חָרְבָּה
  choice: развалинами
  rationale: Слово обозначает разрушенное место или руины. В сочетании с городами множественное «развалинами» ясно передаёт итог разорения.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: станет ... — развалинами
  rationale: 'Формы היה в контексте кары имеют результативный оттенок: земля и города перейдут в состояние запустения. Во второй части связка подразумевается согласно естественной русской норме.'
theological_decisions:
- issue: Прямое действие Бога в суде за нарушение завета
  choice: 'Сохранено первое лицо и непосредственная божественная субъектность: «Я рассею… обнажу»'
  alternative: Смягчить формулировку пассивными или безличными конструкциями
  rationale: Еврейский текст прямо представляет рассеяние и военное преследование как действия говорящего Бога; перевод не должен ослаблять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Заглавная буква в местоимении «Я» отражает русскую библейскую издательскую традицию. Союз «А» передаёт вынесенное וְאֶתְכֶם и подчёркивает переход к участи людей на фоне ближайшего контекста. Двоеточие еврейского стиха передано точкой с запятой, чтобы сохранить тесную причинно-результативную связь частей.
