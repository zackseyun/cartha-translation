  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: ru
  text: Соблюдайте Мои субботы и чтите Моё святилище[a]. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бойтесь Моего святилища»; возможно также: «благоговейте перед Моим святилищем». Еврейский глагол может выражать страх, почтение или благоговение — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: Мои субботы
  rationale: Форма множественного числа с суффиксом первого лица буквально означает «Мои субботы» и может охватывать всю совокупность установленных Богом субботних времён.
- source_word: תִּשְׁמֹרוּ
  choice: соблюдайте
  rationale: В контексте заповеди שׁמר означает внимательно хранить и исполнять предписание; «соблюдайте» естественно передаёт это значение в современном русском языке.
- source_word: וּמִקְדָּשִׁי
  choice: и Моё святилище
  rationale: מִקְדָּשׁ обозначает святое место, святилище; «святилище» является точным и устоявшимся соответствием в культовом контексте.
- source_word: תִּירָאוּ
  choice: чтите
  rationale: Глагол ירא может выражать страх, благоговение или почтение. В отношении святилища «чтите» естественно передаёт требование благоговейного отношения, не сводя его к испугу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, что сохраняет прямое самоименование говорящего.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует исходной форме лучше, чем замена титулом.
- issue: Смысл ירא применительно к святилищу
  choice: чтите
  alternative: бойтесь; благоговейте перед
  rationale: Контекст требует священного почтения и благоговения. Основной текст использует естественное русское «чтите», а примечание сохраняет более буквальную и семантически широкую альтернативу.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием заповеди. Повелительные формы передают обращение во втором лице множественного числа. Прописные буквы в притяжательных местоимениях отражают традиционное русское благоговейное оформление речи Бога.
