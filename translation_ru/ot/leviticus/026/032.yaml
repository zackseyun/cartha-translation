base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: ru
  text: Я сам опустошу землю, и ваши враги, живущие на ней, будут потрясены её видом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придут в ужас от неё» или «поразятся ей». Еврейский глагол может выражать ошеломлённое изумление и ужас в ответ на опустошение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: опустошу
  rationale: Каузативная форма от שׁמם означает «сделать безлюдным, опустошить». «Опустошу» естественно и точно передаёт действие над землёй.
- source_word: אֲנִי
  choice: Я Сам
  rationale: Самостоятельное местоимение при уже выраженном в глаголе лице несёт эмфатическую нагрузку; «Я Сам» сохраняет это подчёркивание.
- source_word: הָאָרֶץ
  choice: эту землю
  rationale: В контексте заветных проклятий речь идёт о конкретной земле Израиля, а не обо всей земле как мире. Указательное «эту» естественно передаёт определённость референта в русском языке.
- source_word: וְשָׁמְמוּ
  choice: ужаснутся
  rationale: Простая порода שׁמם здесь, при одушевлённом подлежащем «ваши враги», естественно обозначает потрясённое изумление или ужас перед опустошением. Перевод не представляет врагов самих как опустошённых.
- source_word: עָלֶיהָ
  choice: глядя на неё
  rationale: Предлог עַל при שׁמם указывает на объект или повод потрясения. По-русски «ужаснутся, глядя на неё» естественно связывает реакцию врагов с видом опустошённой земли.
- source_word: אֹיְבֵיכֶם
  choice: ваши враги
  rationale: Прямо передаёт существительное с местоименным суффиксом второго лица множественного числа.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: живущие на ней
  rationale: Причастие от ישׁב обозначает проживание или пребывание. «Живущие на ней» понятно современному читателю и сохраняет связь с землёй.
theological_decisions:
- issue: Референт הָאָרֶץ в контексте суда за нарушение завета
  choice: эта земля — конкретная земля Израиля/Ханаана
  alternative: земля как весь мир
  rationale: Ближайший контекст описывает наказание народа и опустошение его земли; универсализировать этот суд оснований нет.
- issue: Значение וְשָׁמְמוּ применительно к врагам
  choice: враги ужаснутся при виде опустошённой земли
  alternative: враги сами окажутся опустошены или земля станет безлюдной из-за них
  rationale: Одушевлённое подлежащее и конструкция с עָלֶיהָ поддерживают значение потрясённой реакции, хотя многозначность корня שׁמם отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия не используется; эмфаза исходного текста сохранена формой «Я Сам». Не вполне естественная русская конструкция «ужаснутся ей» заменена на идиоматическое «ужаснутся, глядя на неё», а более буквальные варианты вынесены в сноску.
