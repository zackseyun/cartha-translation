  source_fidelity: 'Основной смысл передан верно: ответное действие Бога, наведение ужаса и болезней, истощение глаз и жизни, тщетный посев и захват посева врагами. Однако древнееврейское זַרְעֲכֶם («ваше семя», собирательно также посев) стоит в единственном числе; русское «свои семена ... их» неоправданно дробит этот образ.'
  naturalness: Текст в целом литературный и понятный. «Лихорадка» является более нейтральным современным обозначением для הַקַּדַּחַת, чем несколько разговорно-устаревающее в данном контексте «горячка». «Посев» естественно сохраняет сельскохозяйственный собирательный смысл и позволяет ясно соотнести местоимение «его» с исходным текстом.
  terminology: «Изнуряющая болезнь» удачно не отождествляет שַׁחֶפֶת с конкретным современным диагнозом. «Жизнь» для נֶפֶשׁ в данном контексте корректна и не вносит богословских предпосылок. «Наведу на вас» — естественная и уместная передача וְהִפְקַדְתִּי עֲלֵיכֶם.
