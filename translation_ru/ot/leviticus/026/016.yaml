  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: ru
  text: 'То и Я поступлю с вами так: наведу на вас внезапный ужас[a], изнуряющую болезнь[b] и лихорадку, от которых слабеют глаза и угасает жизнь[c]. Вы будете напрасно сеять свой посев, и его съедят ваши враги.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «панику» или «смятение».'
    reason: lexical_alternative
  - marker: b
    text: Точный вид болезни, обозначенной древнееврейским словом, неизвестен; речь, вероятно, идёт об истощающем недуге.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «истощающие глаза и заставляющие жизнь угасать». Смысл древнееврейской фразы не вполне ясен.'
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: אַף אֲנִי
  choice: то и Я
  rationale: Сочетание אַף с самостоятельным местоимением подчёркивает ответное действие Бога; в условном контексте главы естественное русское соответствие — «то и Я».
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: поступлю с вами так
  rationale: Передаёт направленное против адресатов действие естественным современным русским оборотом.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: наведу на вас
  rationale: Hiphil глагола פקד здесь означает возложение или наведение бедствия; выбранный оборот ясен по-русски и уместен в контексте заветных проклятий.
- source_word: בֶּהָלָה
  choice: внезапный ужас
  rationale: Существительное обозначает ужас, смятение или панику; «внезапный ужас» сохраняет оттенок внезапного потрясения.
- source_word: הַשַּׁחֶפֶת
  choice: изнуряющую болезнь
  rationale: Точный вид древней болезни неизвестен; перевод передаёт её истощающий характер без необоснованно точного диагноза.
- source_word: הַקַּדַּחַת
  choice: горячку
  rationale: Слово связано с жаром и лихорадочным состоянием; «горячка» — понятное и стилистически уместное существительное в перечне бедствий.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: от которых меркнут глаза
  rationale: Причастие от כלה выражает истощение или угасание; формулировка сохраняет образ поражённых глаз и звучит естественно по-русски.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: и угасает жизнь
  rationale: Трудная фраза описывает истощение жизненных сил; נֶפֶשׁ передано как «жизнь», без внесения позднейшего противопоставления души и тела.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: Вы будете напрасно сеять свои семена
  rationale: לָרִיק означает без пользы, тщетно; буквальный земледельческий образ сохранён.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: и съедят их ваши враги
  rationale: Союз ו передан прямо как «и»; местоименное дополнение соотнесено с семенами или выросшим урожаем, без добавления причинной связи.
theological_decisions:
- issue: Значение נֶפֶשׁ в описании проклятия
  choice: жизнь
  alternative: душа; жизненная сила
  rationale: Контекст говорит о телесном истощении и угасании живого человека. «Жизнь» сохраняет широту древнееврейского понятия и не навязывает дуалистического понимания человека.
- issue: Характер Божьего действия во фразе וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: наведу на вас
  alternative: поставлю над вами; пошлю на вас
  rationale: Перевод ясно представляет бедствия как действие заветного суда, сохраняя смысл глагола без попытки смягчить или дополнительно объяснить богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной интонацией. Сохранены прямота заветного суда и земледельческий образ; медицинские термины не конкретизированы сверх данных древнееврейского текста. Все маркеры сносок помещены непосредственно после соответствующих выражений.
