  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: ru
  text: Вы погибнете среди народов, и земля ваших врагов пожрёт вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «съест вас».'
    reason: Лексическое примечание сохраняет прозрачность исходной метафоры глагола אכל, который в прямом значении означает «есть».
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: вы погибнете
  rationale: Глагол אבד в породе qal здесь обозначает гибель или исчезновение как следствие проклятия; «погибнете» естественно передаёт тяжесть исходного выражения, не уточняя способ гибели.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם означает «народы»; предлог ב в контексте рассеяния естественно передаётся как «среди». Перевод «язычники» привнёс бы более позднюю религиозную окраску.
- source_word: וְאָכְלָה
  choice: пожрёт
  rationale: אכל буквально означает «есть». При подлежащем «земля» глагол образует сильную метафору поглощения; «пожрёт» сохраняет её выразительность и олицетворение.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Показатель прямого дополнения с местоименным суффиксом второго лица множественного числа естественно передаётся как «вас».
- source_word: אֶרֶץ
  choice: земля
  rationale: В данном контексте אֶרֶץ обозначает землю или страну изгнания; «земля» сохраняет как территориальный смысл, так и образ земли, поглощающей изгнанников.
- source_word: אֹיְבֵיכֶם
  choice: ваших врагов
  rationale: Форма множественного числа с суффиксом второго лица множественного числа образует определение к слову «земля»; прямой перевод сохраняет смысл и структуру исходного текста.
theological_decisions:
- issue: Метафорический образ земли врагов, поглощающей изгнанников
  choice: 'Сохранить олицетворённую метафору: «земля ваших врагов пожрёт вас».'
  alternative: 'Передать разъясняющим оборотом: «земля ваших врагов погубит вас».'
  rationale: Исходный текст употребляет обычный глагол «есть» с землёй в роли действующего лица. Сохранение образа передаёт суровость заветного проклятия и не сводит неоднозначную поэтическую картину к одному объяснению.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формулировка. «Пожрёт» выбрано как понятное и выразительное слово, уместное для образа заветного проклятия.
