  naturalness: Текст в целом литературный, но «у себя» менее точно передаёт повторённое לָכֶם, чем «себе», а «потому что» несколько разговорнее для краткой законодательной формулы. Координация запретов также становится яснее при сохранении отдельного запрета на изваяние и каменный столб.
