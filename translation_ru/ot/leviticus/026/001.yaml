source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: ru
  text: Не делайте себе идолов и не ставьте себе ни изваяния, ни каменного столба; не помещайте в вашей земле камня с изображением[a], чтобы поклоняться ему, ибо Я — Яхве, ваш Бог.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «резной камень» либо «каменное изображение». Точный нюанс еврейского выражения оспаривается; речь идёт о каменном предмете, связанном с запрещённым поклонением. Также возможно: «чтобы простираться на нём».'
    reason: lexical_alternative
  - marker: b
    text: Евр. ЙХВХ — личное имя Бога; традиционно передаётся словом «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: идолы
  rationale: Передаёт культовые изображения и сохраняет отрицательную оценку в контексте запрета, не добавляя толкования «ничтожные» или «ложные боги».
- source_word: פֶסֶל
  choice: изваяние
  rationale: Обозначает изготовленное, обычно высеченное изображение; слово естественно для современного литературного русского языка и не смешивается с более широким «идол».
- source_word: מַצֵּבָה
  choice: каменный столб
  rationale: Передаёт вертикально установленный каменный памятник или культовый столб без внесения в само существительное дополнительного определения «священный».
- source_word: אֶבֶן מַשְׂכִּית
  choice: камень с изображением
  rationale: Сохраняет вероятный смысл обработанного камня с изображением и отличает его от פֶסֶל; неопределённость точного вида предмета отмечена в сноске.
- source_word: תַעֲשׂוּ לָכֶם
  choice: не делайте себе
  rationale: Естественно передаёт глагол и возвратно-бенефактивное לָכֶם.
- source_word: תָקִימוּ לָכֶם
  choice: не ставьте у себя
  rationale: Передаёт каузативное значение «устанавливать, воздвигать» и отношение предметов к адресатам закона.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: не помещайте в вашей земле
  rationale: Сохраняет локативное значение и прямое упоминание земли, принадлежащей адресатам завета.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: чтобы поклоняться ему
  rationale: Инфинитив передаёт цель; местоимение относится к камню. «Поклоняться» естественно включает культовое преклонение, тогда как буквальное «падать ниц» здесь менее ясно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: потому что Я — Яхве, ваш Бог
  rationale: כִּי вводит основание запрета; формула сохранена как прямое утверждение заветного имени и отношений с Израилем.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его традиционным титулом.
- issue: Различение запрещённых культовых предметов
  choice: идолы; изваяние; каменный столб; камень с изображением
  alternative: Обобщить все предметы словами «идолы» или «изображения»
  rationale: Накопление разных еврейских терминов намеренно конкретизирует запрет; их различение сохраняет юридическую и риторическую структуру стиха.
- issue: Объект поклонения в עָלֶיהָ
  choice: поклоняться ему, то есть камню
  alternative: поклоняться на нём
  rationale: Предлог допускает обсуждение, однако в данном культовом контексте наиболее вероятно, что камень является объектом поклонения. Менее вероятное пространственное понимание не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой закона. Разные названия культовых предметов сохранены, архаизмы «кумир», «истукан» и «изваянный образ» не использованы. Пунктуация подчёркивает последовательность трёх запретов и заключительную формулу основания.
