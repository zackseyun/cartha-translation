base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: ru
  text: Я превращу ваши города в развалины, опустошу ваши святилища и не буду обонять приятного благоухания ваших приношений[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вашего приятного благоухания». Это устойчивое выражение, связанное с жертвоприношениями и их принятием Богом; слово «приношений» добавлено для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה
  choice: Я превращу ваши города в развалины
  rationale: נתן буквально означает «дать, положить, сделать», но в этой конструкции с предикативным חָרְבָּה выражает превращение городов в разорённые места. «Превращу… в развалины» естественно передаёт причинный смысл и конкретный образ.
- source_word: וַהֲשִׁמּוֹתִי
  choice: опустошу
  rationale: 'Порода hифиль глагола שמם имеет причинное значение: сделать безлюдным, разорить, опустошить. Русское «опустошу» точно и естественно передаёт этот смысл.'
- source_word: מִקְדְּשֵׁיכֶם
  choice: ваши святилища
  rationale: Форма множественного числа обозначает священные места; «святилища» сохраняет культовый смысл и число исходного текста.
- source_word: וְלֹא אָרִיחַ
  choice: и не стану вдыхать
  rationale: Глагол ריח сохраняет образ обоняния. «Вдыхать» звучит в современном русском естественнее, чем книжное «обонять», не заменяя при этом образ толкованием «принимать».
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: приятное благоухание ваших приношений
  rationale: רֵיחַ נִיחֹחַ — устойчивое жертвенное выражение о благоухании, угодном Богу. Слово «приношений» добавлено для ясности культового значения, поскольку буквальное «ваше приятное благоухание» по-русски может быть ошибочно понято как запах самих людей.
theological_decisions:
- issue: Передавать ли заключительную фразу буквальным образом обоняния или истолковать её как отказ принять жертвы
  choice: 'Сохранить антропоморфный образ: «не стану вдыхать приятное благоухание ваших приношений»'
  alternative: «не приму ваших жертв» или «не благоволю к вашим жертвам»
  rationale: Исходный текст прямо употребляет глагол обоняния и устойчивое жертвенное выражение «приятное благоухание». Сохранение образа передаёт культовую и богословскую фактуру текста, не сводя её к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллельные угрозы переданы последовательно и энергично; архаичное «обонять» заменено естественным «вдыхать», а множественное число «святилища» сохранено.
