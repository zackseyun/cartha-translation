  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: ru
  text: то Я дам вам дожди в своё время[a], и земля даст свой урожай, и полевые деревья[b] дадут свои плоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в надлежащий срок»; «в положенное время».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «полевое дерево»; единственное число употреблено в собирательном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Я дам
  rationale: Прямо передаёт обычное значение נתן и сохраняет форму Божьего обещания; начальное «то» естественно связывает стих с условием предыдущего стиха.
- source_word: גִשְׁמֵיכֶם
  choice: вам дожди
  rationale: Множественное число «дожди» сохраняет еврейское обозначение сезонных дождей, а дательный оборот естественно передаёт, что они даруются народу.
- source_word: בְּעִתָּם
  choice: в своё время
  rationale: Естественное русское выражение для дождей, приходящих в надлежащий срок, без излишнего уточнения.
- source_word: וְנָתְנָה הָאָרֶץ יְבוּלָהּ
  choice: и земля даст свой урожай
  rationale: Сохраняет повтор глагола נתן («дать») и конкретный земледельческий смысл יְבוּל — урожай, плодородный результат земли.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: и полевые деревья
  rationale: Еврейское единственное число имеет собирательное значение; русское множественное число естественно выражает весь класс деревьев, растущих на полях.
- source_word: יִתֵּן פִּרְיוֹ
  choice: дадут свои плоды
  rationale: Сохраняет повторение נתן и согласуется с естественным русским множественным выражением «полевые деревья».
theological_decisions:
- issue: Заветное благословение в виде дождя и плодородия за послушание
  choice: Передать обещание буквально как дарование своевременных дождей и земного урожая.
  alternative: Истолковать его как универсальное обещание материального благополучия либо как исключительно духовную метафору.
  rationale: В данном контексте речь непосредственно идёт о земледельческих благословениях завета; перевод не должен ни расширять обещание до общей доктрины процветания, ни устранять его конкретный смысл посредством аллегоризации.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным звучанием. Сохранены конкретная земледельческая образность и повтор глагола «дать»; собирательное еврейское единственное число передано естественным русским множественным.
