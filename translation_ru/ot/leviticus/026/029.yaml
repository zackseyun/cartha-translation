source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: ru
  text: И будете есть плоть своих сыновей, и плоть своих дочерей будете есть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: И будете есть
  rationale: Форма Qal, 2-е лицо множественного числа, в последовательности проклятий передана русским будущим временем; начальный союз וַ выражен союзом «и».
- source_word: בְּשַׂר
  choice: плоть
  rationale: Слово «плоть» прямо и без эвфемизма передаёт בָּשָׂר и сохраняет ужасающую конкретность предупреждения; «мясо» звучало бы более обыденно и кулинарно.
- source_word: בְּנֵיכֶם
  choice: своих сыновей
  rationale: Сохранено конкретное значение «сыновья», поскольку далее отдельно названы дочери. Возвратное «своих» естественно для русского при совпадении обладателя с субъектом.
- source_word: וּבְשַׂר
  choice: и плоть
  rationale: Повтор существительного сохранён ради еврейского параллелизма и суровой ритмики высказывания.
- source_word: בְּנֹתֵיכֶם
  choice: своих дочерей
  rationale: Прямой перевод сохраняет явную пару «сыновья — дочери».
- source_word: תֹּאכֵלוּ
  choice: будете есть
  rationale: Второй глагол сохранён и поставлен в конце второй части, как в еврейском тексте, что передаёт параллелизм и эмфатический повтор.
theological_decisions:
- issue: Передача каннибализма как части проклятия за нарушение завета
  choice: 'Прямое предсказательное утверждение: «будете есть плоть своих сыновей… дочерей»'
  alternative: Смягчённая или эвфемистическая передача
  rationale: Еврейский текст формулирует буквальное и предельно суровое предупреждение. Перевод не смягчает его и не добавляет богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с намеренно суровой, лаконичной интонацией. Синтаксическая инверсия во второй части сохраняет порядок и риторический нажим оригинала; архаическое «будете вкушать» отвергнуто.
