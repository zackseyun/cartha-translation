source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: ru
  text: И наведу на вас меч, совершающий возмездие завета[a]; и вы будете собраны в своих городах. Я пошлю среди вас мор, и вы будете отданы в руки врага.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «меч, мстящий мщением завета». Это усилительная древнееврейская конструкция. Возможны также переводы: «меч, совершающий возмездие за завет» или «меч, исполняющий возмездие завета». Связь возмездия с заветом может пониматься по-разному: как возмездие за завет, в защиту завета или как возмездие, предусмотренное заветом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם
  choice: И наведу на вас
  rationale: Каузативная форма בוא с עַל передаёт действие Бога, направляющего враждебную силу против народа. «Наведу на вас» естественно по-русски и сохраняет образ суда.
- source_word: חֶרֶב
  choice: меч
  rationale: Слово обозначает меч как орудие войны и суда; в русском неопределённый артикль не требуется.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: мстящий за нарушение завета
  rationale: Причастие с однокоренным существительным образует усилительную конструкцию («мстящий мщением»). В контексте проклятий за непослушание месть обусловлена нарушением завета; основной текст передаёт это естественно, а буквальная выразительность и допустимые оттенки сохранены в сноске.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: Вы укроетесь в своих городах
  rationale: Нифаль אסף здесь описывает сосредоточение жителей в городах перед лицом меча, вероятно ради защиты. «Укроетесь» естественно передаёт контекст осады, не делая пассивную форму неуклюжей по-русски.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: но Я пошлю среди вас мор
  rationale: 'דֶבֶר в формулах проклятия означает смертоносную эпидемию; «мор» сохраняет библейскую весомость и остаётся понятным. Союз «но» ясно выражает контраст: города не обеспечат безопасности.'
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: и вы будете отданы в руки врага
  rationale: Пассивная форма נתן обозначает передачу под власть противника. Русская идиома «в руки врага» сохраняет древнееврейский образ руки как власти; множественное «руки» нормативно в русском при единственном «враг».
theological_decisions:
- issue: Смысл выражения נְקַם בְּרִית («мщение завета»)
  choice: Суд, вызванный нарушением завета
  alternative: Месть в защиту завета или возмездие, предусмотренное заветом
  rationale: 'Конструкция допускает несколько тесно связанных оттенков: завет служит основанием, объектом защиты либо источником санкций. Контекст Лев 26 прямо связывает наказания с непослушанием завету, однако сноска сохраняет более буквальную формулировку и её многозначность.'
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Мор» выбран как краткое и весомое обозначение эпидемии; синтаксис сделан естественным для широкого круга читателей. Заглавная «Я» обозначает говорящего Бога согласно принятой русской издательской практике.
