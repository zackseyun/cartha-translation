base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: ru
  text: Я — Яхве, ваш Бог, который вывел вас из земли Египта, чтобы вы больше не были их рабами. Я сломал перекладины вашего ярма и дал вам ходить прямо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дал вам ходить с высоко поднятой головой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: В формуле завета форма обозначает единственного Бога — Яхве; местоимение относится ко всему Израилю.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: вывел вас из земли Египетской
  rationale: Каузатив глагола יצא естественно передаётся русским «вывел» и сохраняет мотив исхода.
- source_word: מִהְיֹת לָהֶם עֲבָדִים
  choice: чтобы вы больше не были у египтян рабами
  rationale: Передаёт избавление от состояния рабства; «у египтян» ясно выражает местоименную отсылку, а «рабами» не смягчает подневольный статус.
- source_word: מֹטֹת עֻלְּכֶם
  choice: перекладины вашего ярма
  rationale: Сохраняет конкретный образ поперечных частей ярма; «ярмо» в данном контексте естественно выражает порабощение.
- source_word: וָאוֹלֵךְ אֶתְכֶם קוֹמְמִיּוּת
  choice: дал вам ходить с поднятой головой
  rationale: Передаёт каузативное действие и образ выпрямленной позы как знак возвращённого достоинства; возможен более буквальный вариант в сноске.
theological_decisions:
- issue: Статус Израиля в Египте
  choice: рабами
  alternative: слугами
  rationale: Контекст говорит о насильственной зависимости и освобождении, поэтому «слугами» неоправданно смягчало бы смысл.
- issue: Заключительный образ освобождения
  choice: дал вам ходить с поднятой головой
  alternative: дал вам ходить прямо
  rationale: Еврейское קוֹמְמִיּוּת обозначает выпрямленную, гордую позу; основной вариант естественно раскрывает образ, а сноска сохраняет его более буквальную форму.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены личное имя «Яхве», конкретный образ ярма и резкий язык рабства. Синтаксис разделён на два предложения для естественного русского ритма; формула «Я — Яхве» сохраняет торжественное самооткровение.
