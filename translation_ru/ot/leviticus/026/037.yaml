  text: וְ/כָשְׁל֧וּ אִישׁ בְּ/אָחִ֛י/ו כְּ/מִ/פְּנֵי חֶ֖רֶב וְ/רֹדֵ֣ף אָ֑יִן וְ/לֹא תִֽהְיֶ֤ה לָ/כֶם֙ תְּקוּמָ֔ה לִ/פְנֵ֖י אֹֽיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: ru
  text: Они будут спотыкаться друг о друга[a], словно перед мечом, хотя никто не будет их преследовать; и вы не сможете устоять перед своими врагами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек о своего брата»; здесь имеется в виду, что в панике люди будут сталкиваться и спотыкаться друг о друга.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у вас не будет сил держаться перед своими врагами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: будут спотыкаться
  rationale: Глагол כשל передаёт образ спотыкания, шатания или падения; «спотыкаться» сохраняет конкретный образ паники.
- source_word: אִישׁ בְּאָחִיו
  choice: друг о друга
  rationale: 'Буквально: «человек о своего брата». В данном контексте это распределительно-взаимная конструкция: охваченные страхом люди сталкиваются и спотыкаются друг о друга.'
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: словно спасаясь от меча
  rationale: Сочетание сравнительного כְּ с מִפְּנֵי буквально выражает движение «как от лица меча». Русское «словно спасаясь от меча» естественно передаёт подразумеваемое паническое бегство, не утверждая наличия реального преследователя.
- source_word: וְרֹדֵף אָיִן
  choice: хотя никто не будет их преследовать
  rationale: 'Буквально: «и преследователя нет». Союз «хотя» ясно передаёт контекстуальный контраст между паническим бегством и отсутствием погони.'
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: вы не сможете устоять
  rationale: תְּקוּמָה обозначает вставание, способность стоять или держаться. В военном контексте речь идёт о неспособности выдержать натиск врагов.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: перед своими врагами
  rationale: Обычное пространственно-конфронтационное значение לִפְנֵי; по-русски естественно передаётся как «перед врагами».
