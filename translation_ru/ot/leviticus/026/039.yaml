    issue: Смена лиц в местоимениях не отражена.
    rationale: В тексте стоят עֲוֹנָם и אֲבֹתָם («их»), но אֹיְבֵיכֶם («ваших»). «Своё беззаконие» и «своих врагов» нейтрализуют намеренно сохранённую в оригинале смену адресации.
  - severity: medium
