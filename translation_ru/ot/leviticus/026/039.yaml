  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: ru
  text: А те из вас, кто останется, будут чахнуть[a] в землях ваших врагов из-за их беззакония; также из-за беззаконий их отцов, вместе с ними[b], будут чахнуть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут истлевать», «будут изнемогать». Еврейский глагол передаёт постепенное истощение, угасание или разложение под судом.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «вместе с ними» неоднозначно: оно может означать, что беззакония отцов остаются с потомками, либо что потомки чахнут вместе с продолжающими действовать последствиями этих беззаконий.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: А те из вас, кто останется
  rationale: Передаёт причастие от שׁאר как людей, оставшихся после суда, и естественно включает обращённое к народу בכם — «из вас».
- source_word: יִמַּקּוּ
  choice: будут чахнуть
  rationale: Нифаль глагола מקק обозначает постепенное истощение, разложение или угасание под судом. «Будут чахнуть» звучит естественно и сохраняет образ длительного угасания; одинаковый перевод употреблён в обоих случаях.
- source_word: בַּעֲוֺנָם
  choice: за своё беззаконие
  rationale: עָוֹן может обозначать беззаконие, вину и её последствия. Предлог ב здесь естественно понимать причинно; «за» сохраняет судебный оттенок, не сводя значение только к внутреннему состоянию.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: в землях своих врагов
  rationale: Сохраняется множественное число «землях» и контекст рассеяния среди вражеских народов. Возвратное «своих» соответствует смене обращения на третье лицо внутри стиха.
- source_word: וְאַף
  choice: и также
  rationale: Передаёт присоединительно-усилительное значение выражения без ненужного усиления толкованием.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: за беззакония своих отцов
  rationale: Сохраняются множественное число «беззакония» и буквальное родственное обозначение «отцов», а причинное «за» соответствует первой половине стиха.
- source_word: אִתָּם
  choice: вместе с ними
  rationale: Краткая предложная фраза оставлена без явного определения референта местоимения, чтобы не устранять неоднозначность еврейского текста.
theological_decisions:
- issue: Межпоколенческая вина и суд
  choice: Сохранено прямое указание как на собственное беззаконие оставшихся, так и на беззакония их отцов.
  alternative: Истолковать речь исключительно как последствия грехов предков либо как повторение потомками тех же грехов.
  rationale: Еврейский текст называет обе причины и не объясняет здесь соотношение личной ответственности, общей вины и унаследованных последствий. Перевод не должен разрешать это напряжение вместо текста.
- issue: Референт אִתָּם («с ними»)
  choice: Сохранена компактная и неоднозначная формулировка «вместе с ними».
  alternative: 'Уточнить: «поскольку беззакония отцов остаются с ними» или «вместе со своими отцами».'
  rationale: Грамматика допускает разные способы соотнесения фразы с ближайшим контекстом. Явное дополнение отсутствующих в оригинале слов закрепило бы только одно толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «будут чахнуть» сохранён ради структуры и настойчивости еврейского текста; архаизмы и конфессионально окрашенные уточнения не добавлены.
