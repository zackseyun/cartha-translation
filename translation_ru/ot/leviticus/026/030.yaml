    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: уничтожу
  rationale: Форма хифиль от שׁמד выражает причинение гибели или уничтожение; «уничтожу» точно и естественно передаёт силу глагола.
- source_word: בָּמֹתֵיכֶם
  choice: ваши высоты
  rationale: במות обозначает культовые возвышения или святилища на высотах; «высоты» — краткий, традиционный и понятный в контексте библейского культа эквивалент.
- source_word: הִכְרַתִּי
  choice: сокрушу
  rationale: כרת буквально означает «отсечь, срубить». Для культовых сооружений «сокрушу» звучит естественно и сохраняет образ физического разрушения, не утверждая их точную форму.
- source_word: חַמָּנֵיכֶם
  choice: ваши солнечные столбы
  rationale: חמנים — культовые предметы, вероятно связанные с солнечным культом; точный вид спорен. В основном тексте выбран конкретный вероятный смысл, а альтернативный функциональный перевод дан в сноске.
- source_word: פִּגְרֵיכֶם ... פִּגְרֵי גִּלּוּלֵיכֶם
  choice: ваши трупы на трупы ваших идолов
  rationale: Повтор «трупы» воспроизводит повтор פגר и намеренно представляет идолов как мёртвые, бессильные тела, соединяя осуждение людей с унижением их богов.
- source_word: גִּלּוּלֵיכֶם
  choice: ваших идолов
  rationale: Грубая пренебрежительная окраска слова גִּלּוּלִים не имеет краткого естественного соответствия в русском; «идолы» ясно передаёт референт, а контекст сохраняет презрение.
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: душа Моя возгнушается вами
  rationale: Сохранено буквальное נַפְשִׁי, чтобы не сглаживать яркое антропопатическое выражение Божьего отвращения и отвержения.
