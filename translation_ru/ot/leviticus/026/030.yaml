- issue: Антропопатическое выражение Божьего отвращения
  choice: душа Моя возгнушается вами
  alternative: Я возгнушаюсь вами; Я отвергну вас
  rationale: Исходный текст прямо говорит «душа Моя». Сохранение этой формулировки передаёт напряжённость и эмоциональную силу текста, не сводя её к отвлечённому отвержению.
