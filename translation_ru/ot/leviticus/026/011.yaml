  text: וְ/נָתַתִּ֥י מִשְׁכָּנִ֖/י בְּ/תוֹכְ/כֶ֑ם וְ/לֹֽא תִגְעַ֥ל נַפְשִׁ֖/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: ru
  text: И поставлю Моё жилище среди вас, и душа Моя не возгнушается вами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: Моё жилище
  rationale: Существительное מִשְׁכָּן обозначает место обитания Бога, а в контексте Левита также соотносится со святилищем. «Жилище» сохраняет исходный образ и не сужает его до одного конкретного сооружения.
- source_word: בְּתוֹכְכֶם
  choice: среди вас
  rationale: Естественно передаёт пространственно-реляционное значение «в вашей среде».
- source_word: נַפְשִׁי
  choice: душа Моя
  rationale: Эксплицитно сохраняет נֶפֶשׁ и подчёркнутую личную формулировку оригинала, не сводя её к простому «Я».
- source_word: תִגְעַל
  choice: не отвергнет
  rationale: Глагол גָּעַל выражает сильное неприятие или отвращение. «Отвергнет» звучит достойно и естественно применительно к «душе», сохраняя идею решительного неприятия.
theological_decisions:
- issue: Антропоморфное выражение «душа Моя» о Боге
  choice: 'сохранить буквально: «душа Моя»'
  alternative: «Я не отвергну вас»
  rationale: В еврейском тексте прямо стоит נַפְשִׁי. Сохранение выражения передаёт богословскую и риторическую напряжённость оригинала и согласуется с предоставленным аудированным английским слоем.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «душа Моя» поддерживает торжественный тон, оставаясь понятной современному читателю.
