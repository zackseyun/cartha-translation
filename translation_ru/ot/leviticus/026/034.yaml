base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: ru
  text: Тогда земля получит возмещение за свои субботы во все дни своего запустения[a], когда вы будете в земле ваших врагов; тогда земля будет покоиться и получит возмещение за свои субботы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насладится своими субботами». Еврейский глагол в данном контексте может выражать получение землёй того, что ей причиталось за её субботние покои.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: тогда
  rationale: Временное наречие указывает на следствие предшествующего суда и естественно передаётся словом «тогда».
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: возместит себе / возместит себе
  rationale: В данном контексте глагол רצה говорит о получении землёй причитающегося ей за ранее не соблюдённые субботние покои. «Возместит себе» передаёт компенсаторный смысл и сохраняет повтор одного корня в обеих частях стиха.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Здесь имеется в виду земля Израиля в рамках завета, а не весь мир; русское «земля» сохраняет и конкретный, и олицетворённый характер выражения.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: свои субботы
  rationale: Выражение относится к субботним периодам покоя земли, прежде всего к субботним годам; буквальная формулировка сохраняет связь со словом «суббота».
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: во все дни своего запустения
  rationale: Фраза обозначает всю продолжительность разорённого, необрабатываемого состояния земли; местоимение «своего» передаёт еврейский суффикс.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: пока вы будете в земле ваших врагов
  rationale: Оборот имеет обстоятельственное временное значение и описывает период изгнания адресатов.
- source_word: תִּשְׁבַּת
  choice: будет покоиться
  rationale: Глагол שבת здесь означает прекращение обработки земли и её субботний покой; «будет покоиться» естественно сохраняет субботнюю тему.
theological_decisions:
- issue: Отношение земли к её субботам во время изгнания народа
  choice: Земля получает возмещение за ранее не предоставленные ей субботние периоды покоя.
  alternative: Земля «насладится» своими субботами или «будет удовлетворена» ими.
  rationale: Контекст заветных наказаний связывает запустение земли с несоблюдёнными субботними годами. «Возместит себе» сохраняет судебно-компенсаторный оттенок, не сводя образ к эмоциональному наслаждению.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксический параллелизм и олицетворение земли сохранены; неоднозначность глагола רצה отмечена в сноске.
