  yaml_path: translation/ot/leviticus/026/007.yaml
  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: ru
  text: Вы будете преследовать своих врагов, и они падут перед вами от меча.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: вы будете преследовать
  rationale: Глагол רדף обычно означает «преследовать, гнаться». Этот выбор естественно звучит по-русски и сохраняет военный смысл.
- source_word: אֹיְבֵיכֶם
  choice: своих врагов
  rationale: Существительное אֹיֵב — обычное обозначение врага; возвратное притяжательное местоимение «своих» естественно передаёт суффикс второго лица при подлежащем «вы».
- source_word: וְנָפְלוּ
  choice: и они падут
  rationale: נפל буквально значит «падать». В военном контексте подразумевается гибель или поражение, однако «падут» сохраняет образность и допускает уточнение последующей фразой.
- source_word: לִפְנֵיכֶם
  choice: перед вами
  rationale: לִפְנֵי с местоименным суффиксом идиоматически означает «перед кем-либо»; русский оборот точен и естествен в военном контексте.
- source_word: לֶחָרֶב
  choice: от меча
  rationale: Сочетание предлога ל с חֶרֶב здесь указывает на средство или причину гибели. Русское библейское выражение «пасть от меча» естественно, понятно и не переуточняет смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Форма «падут» сохраняет лаконичность и военную образность древнееврейского текста; «от меча» является естественным русским соответствием конструкции לֶחָרֶב.
