  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: ru
  text: и если вы отвергнете Мои установления, и если ваша душа будет гнушаться Моими судебными решениями[a], так что вы не будете исполнять все Мои заповеди и тем самым нарушите Мой завет[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если всё ваше существо будет гнушаться Моими судебными решениями». «Судебные решения» можно также перевести как «правовые нормы» или «постановления».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тем самым нарушите Мой завет»; «сделаете Мой завет недействительным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: Мои установления
  rationale: «Установления» передаёт предписанный, законодательно закреплённый характер חֻקִּים и позволяет отличить этот термин от מִשְׁפָּטִים далее.
- source_word: תִּמְאָסוּ
  choice: отвергнете
  rationale: Глагол מאס означает отвергать, нередко с оттенком презрения; «отвергнете» ясно и естественно передаёт сознательный отказ.
- source_word: מִשְׁפָּטַי
  choice: Мои судебные решения
  rationale: מִשְׁפָּטִים обозначает судебные решения или правовые нормы. Такой перевод сохраняет юридический оттенок и отличие от «установлений».
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: вам станут отвратительны
  rationale: Буквально субъектом является נֶפֶשׁ, «ваша душа/всё ваше существо», а געל выражает сильное отвращение. Основной текст передаёт смысл естественно по-русски, буквальный образ сохранён в сноске.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: так что вы не будете исполнять
  rationale: Конструкция может указывать на следствие или цель; «так что» сохраняет эту связь без излишнего уточнения мотива.
- source_word: כָּל מִצְוֺתַי
  choice: всех Моих заповедей
  rationale: «Заповеди» — точный и устоявшийся эквивалент מִצְוֹת в заветно-правовом контексте.
- source_word: לְהַפְרְכֶם
  choice: тем самым нарушите
  rationale: Hiphil от פרר означает нарушить, сделать недействительным или расторгнуть. «Тем самым нарушите» естественно связывает непослушание с нарушением завета.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: «Завет» является точным и общепринятым эквивалентом בְּרִית.
theological_decisions:
- issue: Передача נֶפֶשׁ в выражении תִּגְעַל נַפְשְׁכֶם
  choice: 'В основном тексте: «вам станут отвратительны»; буквальная антропологическая формулировка вынесена в сноску.'
  alternative: «вашей душе станут отвратительны» или «всё ваше существо возненавидит».
  rationale: Здесь נֶפֶשׁ образует еврейское выражение, подчёркивающее глубокое внутреннее отвращение. Буквальное «вашей душе» по-русски звучит менее естественно и может ошибочно восприниматься как техническое учение о составе человека.
- issue: Разграничение терминов закона завета
  choice: «установления / судебные решения / заповеди / завет»
  alternative: «постановления / законы / повеления / завет»
  rationale: Разные русские соответствия сохраняют накопление и различие еврейских юридико-заветных терминов, не превращая их в искусственно строгие технические категории.
- issue: Смысл לְהַפְרְכֶם אֶת־בְּרִיתִי
  choice: «тем самым нарушите Мой завет»
  alternative: «расторгнете Мой завет» или «сделаете Мой завет недействительным».
  rationale: «Нарушите» сохраняет юридико-заветный смысл, не утверждая сверх текста, что человеческое непослушание окончательно упраздняет Божий завет.
translation_notes:
  register: Современный литературный русский язык с dignified юридико-заветным регистром. Повтор «и если» сохранён ради структуры еврейского предупреждения. Прописные местоимения при обращении Бога к Своему установлены в традиционном русском библейском стиле; стих синтаксически продолжается далее, поэтому завершён запятой.
