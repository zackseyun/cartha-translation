id: LEV.26.44
reference: Leviticus 26:44
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: ru
  text: Но и тогда, когда они будут в земле своих врагов, Я не отвергну их и не возгнушаюсь ими настолько, чтобы истребить их и нарушить Мой завет с ними; ведь Я — Яхве, их Бог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: Но и тогда
  rationale: 'Сочетание вводит усиленную уступку на фоне предшествующих наказаний; «Но и тогда» естественно передаёт смысл: даже при этих обстоятельствах Божье обязательство остаётся в силе.'
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: когда они будут в земле своих врагов
  rationale: Инфинитивная конструкция с בְּ выражает временное обстоятельство; будущее время уместно в контексте предсказанного изгнания.
- source_word: לֹא מְאַסְתִּים
  choice: Я не отвергну их
  rationale: מָאַס здесь обозначает отказ, отвержение; русский глагол сохраняет заветно-отношенческий оттенок.
- source_word: וְלֹא גְעַלְתִּים
  choice: и не возгнушаюсь ими
  rationale: גָּעַל выражает сильное отвращение. «Возгнушаюсь» точно и достойно передаёт эту интенсивность, оставаясь понятным в литературном русском.
- source_word: לְכַלֹּתָם
  choice: настолько, чтобы истребить их
  rationale: Инфинитив указывает на предел или результат отвержения и отвращения — полное уничтожение. «Настолько, чтобы» ясно раскрывает синтаксическую связь.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: и нарушить Мой завет с ними
  rationale: הֵפֵר применительно к завету означает нарушить, упразднить или сделать недействительным; «нарушить» естественно и сохраняет серьёзность заветного обязательства.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: ведь Я — Яхве, их Бог
  rationale: כִּי вводит основание обещания, а личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому транслитерация «Яхве» сохраняет различие между именем и титулом без внесения конфессионального толкования.
- issue: Временная направленность форм לֹא מְאַסְתִּים и לֹא גְעַלְתִּים
  choice: 'будущее: «не отвергну… не возгнушаюсь»'
  alternative: 'прошедшее: «не отверг… не возгнушался»; настоящее: «не отвергаю… не гнушаюсь»'
  rationale: Хотя в еврейском употреблены формы qatal, контекст описывает предстоящее пребывание в земле врагов и заверение Бога при этих обстоятельствах. Будущее по-русски лучше передаёт обещательный характер, не превращая грамматический аспект в жёсткое временное значение.
- issue: Связь двух инфинитивов לְכַלֹּתָם לְהָפֵר
  choice: 'координированные последствия: «чтобы истребить их и нарушить Мой завет»'
  alternative: 'последовательность: «истребить их, тем самым нарушив Мой завет»'
  rationale: Еврейский допускает тесную смысловую связь между полным истреблением народа и нарушением завета, но не требует явно выражать причинно-следственное отношение; сочинение сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы как издательская норма русского религиозного текста. Архаизм «возгнушаюсь» сохранён из-за его точности и узнаваемости; остальной синтаксис модернизирован.
