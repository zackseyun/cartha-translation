  source_fidelity: 'Текст точно передаёт условное, контрастное введение וְאִם («Но если»), отрицательное обращение ко множественному адресату и две раздельные части: не слушать Бога и не исполнять заповеди. «Слушать Меня» сохраняет буквальную образность שׁמע ל, не подменяя её сразу толкованием «повиноваться»; «исполните всех этих заповедей» адекватно передаёт עשה и כָּל הַמִּצְוֺת הָאֵלֶּה.'
