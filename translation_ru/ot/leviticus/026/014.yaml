source:
  edition: WLC
  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: ru
  text: Но если вы не будете слушать Меня[a] и не исполните всех этих заповедей,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будете повиноваться Мне». Еврейский глагол обозначает слушание, которое предполагает послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит противопоставление предшествующему разделу о благословениях, сохраняя условное значение אִם.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: вы не будете слушать Меня
  rationale: שׁמע с ל означает «слушать кого-либо» и подразумевает послушание. Эта передача сохраняет образ слушания и не сливает его со следующим указанием об исполнении заповедей.
- source_word: וְלֹא תַעֲשׂוּ
  choice: и не исполните
  rationale: В законодательном контексте עשה означает не просто совершение действия, а выполнение предписанного; «исполните» естественно и достойно звучит по-русски.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: всех этих заповедей
  rationale: כָּל передано как «всех», מִצְוֺת — точным юридико-заветным термином «заповедей», а הָאֵלֶּה — указательным словом «этих».
theological_decisions:
- issue: Передача שׁמע ל как буквального «слушать» или истолковывающего «повиноваться»
  choice: слушать Меня
  alternative: повиноваться Мне
  rationale: Основной текст сохраняет различие между слушанием Бога и исполнением заповедей в следующей части стиха. При этом примечание указывает на заложенный в еврейском глаголе смысл послушания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Будущее время естественно передаёт условную конструкцию. Местоимение «Меня» написано с прописной буквы как традиционное обозначение Бога. Конечная запятая сохранена, поскольку стих представляет собой придаточную условную часть, продолжение которой следует далее.
