source:
  edition: WLC
  text: וְ/הָלַכְתִּ֧י אַף אֲנִ֛י עִמָּ/כֶ֖ם בְּ/קֶ֑רִי וְ/הִכֵּיתִ֤י אֶתְ/כֶם֙ גַּם אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: ru
  text: тогда и Я пойду против вас[a] и Сам поражу вас всемеро[b] за ваши грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду поступать с вами враждебно»; «буду противиться вам». Редкое еврейское слово, переведённое здесь выражением «против вас», неоднократно повторяется в Левите 26 и описывает взаимное противостояние Израиля и Господа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «семь раз».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: тогда … пойду
  rationale: Глагол הלך буквально означает «идти, ходить». Перевод сохраняет образ движения, повторяющийся в этой главе, а союз передан как «тогда», поскольку фраза продолжает последовательность условных предостережений.
- source_word: אַף אֲנִי
  choice: и Я
  rationale: Сочетание выражает ответное действие Бога; «и Я» естественно передаёт значение «Я, в Свою очередь».
- source_word: עִמָּכֶם בְּקֶרִי
  choice: против вас
  rationale: Буквально עִמָּכֶם означает «с вами», однако вместе с редким בקרי выражение обозначает противодействие. «Пойду против вас» сохраняет образ исходного текста и взаимный характер противостояния.
- source_word: וְהִכֵּיתִי אֶתְכֶם
  choice: и … поражу вас
  rationale: נכה обозначает нанесение удара или поражение. «Поражу» уместно для Божьего суда и остаётся понятным в современном литературном русском языке.
- source_word: גַּם אָ֔נִי
  choice: Сам
  rationale: Повторное местоименное усиление подчёркивает, что наказание исходит непосредственно от Бога; русское «Сам» передаёт это без тяжеловесного повтора.
- source_word: שֶׁבַע
  choice: всемеро
  rationale: Числительное входит в формулу усиленного наказания. «Всемеро» сохраняет числовой образ и риторическую силу, не сводя выражение непременно к точному арифметическому расчёту.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: за ваши грехи
  rationale: Предлог עַל указывает здесь на основание наказания; «за ваши грехи» естественно передаёт причинно-возмездный смысл.
theological_decisions:
- issue: Передача взаимного противостояния Израиля и Господа в выражении בְּקֶרִי
  choice: пойду против вас
  alternative: буду поступать с вами враждебно; буду противиться вам
  rationale: Выбранный вариант сохраняет буквальный образ «идти» и ключевую для Левита 26 взаимность действий, не сводя смысл только к эмоциональной враждебности.
- issue: Степень буквальности формулы наказания שֶׁבַע
  choice: всемеро
  alternative: семь раз
  rationale: «Всемеро» передаёт усиление суда и сохраняет семикратный образ, не навязывая исключительно арифметическое прочтение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Сохранены повторяющийся образ «идти против» и усилительная формула суда.
