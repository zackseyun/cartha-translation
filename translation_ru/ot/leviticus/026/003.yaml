  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: ru
  text: Если вы будете поступать по Моим установлениям[a], соблюдать Мои заповеди и исполнять их,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ходить в Моих установлениях», то есть строить свою жизнь в соответствии с ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Передаёт явное условие, вводящее условную часть заветной формулы.
- source_word: בְּחֻקֹּתַי תֵּלֵכוּ
  choice: будете поступать по Моим установлениям
  rationale: Русское «поступать по» естественно передаёт идиому «ходить в» как образ жизни и поведения, сохраняя её нормативный, заветный смысл.
- source_word: מִצְוֺתַי
  choice: Мои заповеди
  rationale: «Заповеди» точно соответствует юридико-заветному значению מִצְוֹת и естественно звучит в современном литературном русском.
- source_word: תִּשְׁמְרוּ
  choice: соблюдать
  rationale: В контексте предписаний שׁמר означает хранить верность им, то есть соблюдать; это нормативное и ясное русское соответствие.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: и исполнять их
  rationale: Передаёт практическое осуществление заповедей и сохраняет усиление после «соблюдать», не устраняя исходную смысловую повторность.
theological_decisions:
- issue: Заветная идиома «ходить в Моих установлениях»
  choice: поступать по Моим установлениям
  alternative: ходить по Моим установлениям
  rationale: Буквальная калька на русском может быть понята пространственно и звучит неестественно. «Поступать по» сохраняет значение устроения жизни согласно Божьим предписаниям, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской издательской традиции. Конечная запятая сохранена, поскольку стих представляет условную придаточную часть, продолжение которой следует далее.
