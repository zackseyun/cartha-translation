  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: ru
  text: Я буду ходить среди вас и буду вашим Богом, а вы будете Моим народом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: Я буду ходить
  rationale: Возвратная порода глагола הלך здесь передаёт движение и присутствие Бога среди народа. «Буду ходить» сохраняет конкретный образ оригинала; «буду обитать» было бы более истолковывающим переводом.
- source_word: בְּתוֹכְכֶם
  choice: среди вас
  rationale: Выражение означает присутствие посреди сообщества. «Среди вас» естественно звучит по-русски и не создаёт возможного у «внутри вас» смысла внутреннего пребывания в отдельных людях.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: и буду вашим Богом
  rationale: Естественная русская передача устойчивой формулы завета, сохраняющая её взаимный и личностный характер.
- source_word: לֵאלֹהִים
  choice: Богом
  rationale: В контексте завета слово обозначает Бога Израиля, а не неопределённое божество; прописная буква соответствует современному русскому употреблению.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: а вы будете Моим народом
  rationale: Эта формулировка естественно передаёт вторую часть взаимной формулы завета. Союз «а» ясно выражает соотнесённость двух сторон без противопоставления.
theological_decisions:
- issue: Передача формулы завета
  choice: «Я буду вашим Богом, а вы будете Моим народом»
  alternative: «Я буду для вас Богом, а вы будете для Меня народом»
  rationale: Выбранный вариант сохраняет взаимность отношений завета и при этом звучит естественно на современном русском языке, не добавляя к исходному тексту конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. Конкретный образ хождения сохранён, а местоимение «Моим» оформлено с прописной буквы по принятой благоговейной издательской традиции.
