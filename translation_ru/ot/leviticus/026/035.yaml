  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: ru
  text: Во все дни своего запустения она будет покоиться столько, сколько не покоилась в ваши субботы[a], когда вы жили на ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ваши субботы» здесь — периоды субботнего покоя, полагавшиеся земле, особенно субботние годы, о которых говорится в ближайшем контексте.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: Во все дни своего запустения
  rationale: Оборот כָּל יְמֵי выражает всю продолжительность времени, а суффикс при הַשַּׁמָּה относится к земле. «Запустение» передаёт состояние опустошённой и необитаемой земли.
- source_word: תִּשְׁבֹּת
  choice: она будет покоиться
  rationale: Форма женского рода относится к земле; «покоиться» сохраняет основное значение שׁבת и связь с субботним покоем.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: тем покоем, которого у неё не было
  rationale: Идиоматическая русская передача трудного объектного оборота; существительное «покой» воспроизводит смысл повторённого еврейского глагола שׁבת, не приписывая земле сознательного действия.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: в ваши субботы
  rationale: Сохраняет буквальное «ваши субботы» и связь с корнем שׁבת; контекстуальный смысл земельных суббот поясняется в сноске.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: когда вы жили на ней
  rationale: Естественно передаёт временное значение инфинитивного оборота и проживание Израиля на земле.
theological_decisions:
- issue: К чему относятся «ваши субботы»
  choice: Сохранено широкое выражение «ваши субботы», с пояснением о положенном земле субботнем покое.
  alternative: Перевести непосредственно как «ваши субботние годы».
  rationale: В ближайшем контексте речь прежде всего о субботних годах земли, однако само еврейское выражение формально шире; перевод не должен устранять эту лексическую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «она» сохраняет грамматическую отсылку к земле из контекста; повтор «покоиться — покоем» намеренно удерживает еврейскую игру однокоренных слов.
