  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: ru
  text: Но если и при всём этом вы не станете слушаться Меня[a] и будете поступать Мне наперекор[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после этого»; выражение также может означать: «несмотря на всё это».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будете ходить со Мной в противлении»; это выражение обозначает противостояние Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит следующую, усиленную ступень условного предостережения; «но если» передаёт и условие, и противопоставление предшествующему.
- source_word: בְּזֹאת
  choice: и после этого
  rationale: 'В контексте выражение отсылает к уже названным мерам наказания и имеет уступительный смысл: «несмотря на всё это». Формулировка «и после этого» естественна по-русски и сохраняет отсылку к контексту.'
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: не послушаете Меня
  rationale: Глагол שׁמע с предлогом ל подразумевает не только слышание, но и послушное следование. «Не послушаете» сохраняет слуховой образ и подразумевает отказ повиноваться.
- source_word: וַהֲלַכְתֶּם
  choice: будете поступать
  rationale: הלך здесь обозначает образ поведения. Буквальное «ходить» в данном сочетании менее естественно для современного русского текста, поэтому идиома передана как «поступать».
- source_word: עִמִּי בְּקֶרִי
  choice: Мне наперекор
  rationale: Трудное сочетание буквально описывает хождение «со Мной в противлении». Русская идиома «поступать Мне наперекор» естественно передаёт направленное противодействие, не уточняя сверх текста его точный оттенок.
theological_decisions:
- issue: Заветная формула עִמִּי בְּקֶרִי в Левите 26
  choice: будете поступать Мне наперекор
  alternative: будете враждебно поступать против Меня; будете ходить со Мной в противлении
  rationale: Выбор сохраняет не просто непослушание, а устойчивую позицию противодействия Богу. При этом неоднозначное קֶרִי не сужается до явно выраженной ненависти или иной более специальной богословской характеристики.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимение «Меня» написано с прописной буквы по принятой русской библейской традиции. Синтаксис оставлен незавершённым запятой, поскольку стих образует условную протазу, продолженную в следующем стихе.
