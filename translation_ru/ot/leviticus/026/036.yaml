  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: ru
  text: А тем из вас, кто останется, Я вселю робость в их сердца в землях их врагов. Их будет преследовать шелест гонимого листа[a]; они побегут, как бегут от меча, и падут, хотя никто не будет их преследовать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шелест листа, уносимого ветром».'
    reason: Лексема נִדָּף описывает лист как гонимый или уносимый; ветер подразумевается контекстом, но прямо в еврейском тексте не назван.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: тем из вас, кто останется
  rationale: Передаёт причастие «оставшиеся» и сохраняет прямое обращение, выраженное בכם, естественным современным русским оборотом.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: Я вселю робость в сердца
  rationale: Каузативное «принесу/введу» естественно передано глаголом «вселю»; «робость» обозначает утрату мужества и внутреннюю боязливость, не сводя выражение ни к простому испугу, ни к полному отчаянию.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: в землях их врагов
  rationale: Сохранены множественное число «земли» и прямое обозначение врагов.
- source_word: וְרָדַף אֹתָם קוֹל עָלֶה נִדָּף
  choice: Их будет преследовать даже шелест гонимого листа
  rationale: '«Шелест» естественно обозначает звук листа по-русски; «гонимого» сохраняет пассивный смысл נדף, не называя ветер прямо. Частица «даже» эксплицирует очевидную контекстуальную иронию: преследователем становится ничтожный звук.'
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: они побегут, как бегут от меча
  rationale: Передаёт образ панического бегства перед вооружённой угрозой и сохраняет образ «меча» без конкретизации нападающего.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: и падут, хотя никто не будет их преследовать
  rationale: «Падут» сохраняет краткость и неоднозначность נפל, а уступительное «хотя» ясно передаёт парадокс отсутствия реального преследователя.
theological_decisions:
- issue: Характер описанного суда
  choice: Посланные Богом внутренняя робость и паническое бегство в изгнании
  alternative: Только внешнее военное преследование или лишь образное беспокойство
  rationale: Сам Бог представлен причиной внутренней утраты мужества, после чего люди бегут от незначительного звука при отсутствии преследователя. Перевод сохраняет и Божье действие, и психологическое измерение суда, не добавляя позднейших доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык с достойной библейской интонацией. Синтаксис упрощён для ясности, при этом сохранены прямое обращение, образ меча, Божья причинность и намеренная парадоксальность заключительной фразы.
