base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: ru
  text: Если же вы будете поступать Мне наперекор[a] и не захотите слушать Меня, то Я ещё семикратно поражу вас — сообразно вашим грехам.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете враждовать со Мной» или «будете противиться Мне». Буквальная еврейская идиома трудна для истолкования; в этой главе она выражает противление, а не действие наугад.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «Я добавлю вам поражение семикратно, сообразно вашим грехам».'
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: наперекор
  rationale: Редкое и трудное слово в повторяющейся формуле Левита 26 обозначает противление или враждебную установку. «Наперекор» естественно передаёт направленность поведения против Бога, не сводя выражение к случайности.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: будете поступать Мне наперекор
  rationale: Глагол «ходить» здесь идиоматически означает образ поведения. По-русски «поступать Мне наперекор» ясно и естественно передаёт смысл, не создавая неясной буквальной конструкции.
- source_word: תֹאבוּ
  choice: не захотите
  rationale: Глагол выражает нежелание и волевой отказ, а не простое отсутствие действия.
- source_word: לִשְׁמֹעַ לִי
  choice: слушать Меня
  rationale: Сохранено основное значение «слушать»; подразумеваемый в контексте оттенок послушания не подменяет собой исходную формулировку.
- source_word: וְיָסַפְתִּי
  choice: ещё
  rationale: Еврейский глагол буквально означает «добавлю, продолжу». В русской фразе нарастание наказания естественно выражено наречием «ещё».
- source_word: מַכָּה
  choice: поражу вас
  rationale: Существительное обозначает удар или поражение, включая бедствие, но не требует узкого перевода «язва». Глагольная передача соответствует синтаксису естественного русского языка.
- source_word: שֶׁבַע
  choice: всемеро
  rationale: В формуле усиления наказания слово употреблено наречно; «всемеро» передаёт семикратное усиление без излишне буквальной тяжеловесности.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: по вашим грехам
  rationale: Предлог כְּ выражает соответствие или соразмерность. Формула сохраняет связь меры наказания с грехами и не сводит её лишь к причинному «за».
theological_decisions:
- issue: Характер усиленного наказания за нарушение завета
  choice: Передать нарастание Божьего суда сообразно грехам, не уточняя вид бедствия сверх сказанного в тексте.
  alternative: Перевести מַכָּה узко как «язва» или כְּחַטֹּאתֵיכֶם только причинно — «за ваши грехи».
  rationale: Контекст описывает усиливающиеся санкции завета, однако данная формулировка не ограничивает поражение одним конкретным бедствием. «По вашим грехам» сохраняет оттенок соответствия между грехами и наказанием.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и пророческого контекста. Обращение к Богу оформлено традиционными прописными местоимениями. Идиоматическое «поступать Мне наперекор» предпочтено неестественному буквальному «ходить со Мной в противлении»; тире подчёркивает соразмерность наказания грехам.
