source:
  edition: WLC
  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: ru
  text: Я сломлю гордость вашей силы и сделаю небо над вами[a] словно железо, а вашу землю — словно медь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваши небеса». Еврейское слово имеет форму множественного числа, но обычно обозначает небо над землёй.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бронзу». Еврейское слово может обозначать медь или бронзу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Я сломлю
  rationale: Глагол שׁבר означает «ломать, сокрушать». «Сломлю» естественно сочетается с «гордостью» и передаёт решительное уничижение без лишнего усиления.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: гордость вашей силы
  rationale: 'Сохранена неоднозначная еврейская конструкция: גָּאוֹן может означать гордость, величие или высокомерие, а עֹז — силу или мощь. В контексте заветного наказания «гордость» передаёт отрицательный оттенок самонадеянности, не превращая образ в пояснение.'
- source_word: וְנָתַתִּי
  choice: и сделаю
  rationale: Хотя נתן буквально означает «дать, положить», в данной конструкции оно выражает придание небу и земле названного свойства; «сделаю» естественно передаёт этот смысл по-русски.
- source_word: שְׁמֵיכֶם
  choice: небо над вами
  rationale: Форма множественного числа שָׁמַיִם обозначает небо. Русское единственное число здесь естественнее; слова «над вами» сохраняют значение местоименного суффикса и связь с землёй адресатов.
- source_word: כַּבַּרְזֶל
  choice: словно железо
  rationale: Сравнение изображает небо твёрдым и неподатливым. «Словно железо» ясно и естественно сохраняет метафору.
- source_word: אַרְצְכֶם
  choice: вашу землю
  rationale: אֶרֶץ может обозначать землю, страну или почву. В контексте сельскохозяйственного бедствия «земля» сохраняет и территориальный, и почвенный оттенки.
- source_word: כַּנְּחֻשָׁה
  choice: словно медь
  rationale: נְחֻשָׁה может обозначать медь или бронзу. «Медь» — прямое и понятное русское соответствие; возможный вариант «бронза» отмечен в сноске.
theological_decisions:
- issue: Смысл образов железного неба и медной земли
  choice: Сохранить метафорическое описание заветного суда, при котором небо и земля становятся неподатливыми.
  alternative: Разъяснить непосредственно как засуху и бесплодие земли.
  rationale: Контекст указывает на засуху и неурожай, однако сам стих выражает это через напряжённый поэтический образ. Перевод не подменяет метафору толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм «небо… железо / земля… медь» и неоднозначная конструкция «гордость вашей силы» сохранены.
