source:
  edition: WLC
  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: ru
  text: Но земля будет оставлена ими и получит причитающиеся ей субботние покои, оставаясь опустошённой без них; а они понесут наказание за своё беззаконие[a], ибо — именно ибо — они отвергли Мои судебные решения, и их душа возгнушалась Моими установлениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примут своё беззаконие»; возможно также: «искупят своё беззаконие». Еврейское выражение допускает несколько пониманий; здесь оно передано в судебном смысле, соответствующем контексту наказания за нарушение завета.'
    reason: Лексическая неоднозначность оборота רצה + עון.
lexical_decisions:
- source_word: תֵּעָזֵב מֵהֶם
  choice: будет оставлена ими
  rationale: Нифаль передаёт пассивное значение «быть оставленной»; מֵהֶם здесь указывает на отсутствие народа и допускает естественное русское «ими».
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: и возместит свои субботы
  rationale: В контексте Лев 26:34, 43 земля получает причитающийся ей субботний покой и тем самым восполняет пропущенные субботы. «Возместит» сохраняет связь с повторным רצה в следующей части стиха лучше, чем исключительно пояснительное «насладится».
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: оставаясь опустошённой без них
  rationale: Передаёт одновременно состояние запустения земли и отсутствие изгнанного народа.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: понесут наказание за своё беззаконие
  rationale: עָוֹן может обозначать беззаконие, вину или её карательное последствие; в контексте заветных кар и изгнания выражение имеет преимущественно судебный смысл. Сноска сохраняет подлинную лексическую неоднозначность.
- source_word: יַעַן וּבְיַעַן
  choice: за то, именно за то
  rationale: Повтор причинного оборота имеет усилительное значение; русская конструкция сохраняет эмфатическое повторение без искусственного буквального синтаксиса.
- source_word: בְּמִשְׁפָּטַי
  choice: Мои установления
  rationale: מִשְׁפָּטִים здесь обозначает обязательные правовые установления завета; выбор отличает термин от חֻקּוֹת и звучит естественно в современном русском.
- source_word: מָאָסוּ
  choice: отвергли
  rationale: Передаёт сознательное неприятие, подразумеваемое глаголом מאס, без неоправданного усиления.
- source_word: חֻקֹּתַי
  choice: Мои постановления
  rationale: «Постановления» естественно передаёт חֻקּוֹת как предписанные нормы и сохраняет различие с מִשְׁפָּטִים.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: их душа возгнушалась
  rationale: Сохранён коллективный единственный образ «их душа» и сильное значение געל — испытывать отвращение, гнушаться.
theological_decisions:
- issue: Смысл עָוֹן в обороте יִרְצוּ אֶת עֲוֺנָם
  choice: 'судебный смысл: «понесут наказание за своё беззаконие»'
  alternative: «примут своё беззаконие» или «искупят своё беззаконие»
  rationale: Контекст заветного суда, изгнания и восстановления суббот земли выдвигает на первый план последствие вины. Формулировка «понесут наказание» не привносит идеи самостоятельного заслуживающего искупления, а сноска отмечает широту еврейского выражения.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Сохранены усилительный причинный повтор и коллективный образ «их душа»; различие между מִשְׁפָּטִים и חֻקּוֹת передано словами «установления» и «постановления».
