  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: ru
  text: И они признают свою вину и вину своих отцов — свою измену Мне, то, что они изменили Мне[a], — а также то, что они шли Мне наперекор[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё вероломство, то, что они вероломно поступили против Меня». В еврейском тексте употреблены однокоренные существительное и глагол, подчёркивающие нарушение верности: буквально — «в своей неверности, которой они нарушили верность Мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «враждебно поступали со Мной». Еврейское выражение буквально говорит, что они «шли со Мной в кери»; значение слова קֶרִי спорно, но в этой главе оно описывает упорное противодействие или враждебность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: И они признают
  rationale: Порода хитпаэль глагола ידה здесь означает признание, исповедание вины. Союз ו передан прямо; условная связь определяется более широким контекстом и не выражена в данном стихе отдельной частицей.
- source_word: עֲוֺנָם וְאֶת עֲוֺן אֲבֹתָם
  choice: свою вину и вину своих отцов
  rationale: עָוֹן может обозначать греховность, вину или её последствия; здесь речь идёт о виновности, которую признают. «Отцов» точно передаёт אֲבֹתָם и сохраняет корпоративное, межпоколенческое измерение высказывания.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: свою неверность, с которой они были неверны Мне
  rationale: Существительное מַעַל и однокоренной глагол מָעַל подчёркивают нарушение верности. Намеренно сохранён однокоренной повтор, хотя по-русски он звучит несколько торжественно и напряжённо.
- source_word: וְאַף אֲשֶׁר
  choice: а также то, что
  rationale: Оборот добавляет ещё один предмет признания; такой перевод естественно связывает его с глаголом «признают».
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: они шли Мне наперекор
  rationale: Трудное קֶרִי в Левите 26 обозначает противодействующее, враждебное поведение. «Шли Мне наперекор» сохраняет образ хождения и естественно выражает направленную против Бога оппозицию.
theological_decisions:
- issue: Признание вины отцов наряду с собственной виной
  choice: Сохранено прямое выражение «вину своих отцов».
  alternative: «грехи своих предков» или пояснение, что потомки лишь разделяли последствия их поступков
  rationale: Еврейский текст прямо ставит рядом их собственную вину и вину отцов. Перевод не ограничивает смысл индивидуалистическим толкованием и не добавляет объяснения о вменении или последствиях.
- issue: Условный или последовательный характер начала стиха
  choice: «И они признают»
  alternative: «Но если они признают» / «тогда они признают»
  rationale: В самом еврейском тексте стоит союз ו с перфектом, без отдельной условной частицы. Прямой перевод сохраняет синтаксическую зависимость от предыдущего контекста, не превращая её без необходимости в явно сформулированное условие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Однокоренной повтор «неверность — неверны» сохранён ради заметной риторической связи оригинала. Местоимение «Мне» написано с прописной буквы по принятой русской библейской традиции.
