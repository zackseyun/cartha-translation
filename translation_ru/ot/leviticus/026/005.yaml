  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: ru
  text: Ваша молотьба продлится до сбора винограда, а сбор винограда — до посева. Вы будете есть хлеб досыта и жить в безопасности на своей земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשִּׂיג לָכֶם
  choice: будет продолжаться
  rationale: Буквально «достигнет для вас»; в данном временном контексте естественно передаёт то, что одна сельскохозяйственная работа продлится до начала следующей.
- source_word: דַּיִשׁ
  choice: молотьба
  rationale: Обозначает обмолот урожая зерновых, а не жатву в целом.
- source_word: בָצִיר
  choice: сбор винограда
  rationale: Точное современное обозначение виноградной страды.
- source_word: לָשֹׂבַע
  choice: досыта
  rationale: Передаёт достаточность пищи и полное насыщение.
- source_word: וִישַׁבְתֶּם לָבֶטַח
  choice: жить в безопасности
  rationale: Глагол ישׁב допускает значения «сидеть», «обитать», «жить»; здесь речь о спокойной и безопасной жизни в земле.
theological_decisions:
- issue: Характер обещанного благословения
  choice: Сохранена конкретная картина непрерывного сельскохозяйственного изобилия, сытости и безопасности.
  alternative: Обобщить как обещание процветания.
  rationale: Исходный текст выражает благословение через конкретные циклы молотьбы, сбора винограда и посева; обобщение ослабило бы образность и содержание.
translation_notes:
  register: Современный литературный русский язык; ясный, dignified и естественный синтаксис. Параллелизм двух сельскохозяйственных периодов сохранён, во второй части опущенный глагол передан тире.
