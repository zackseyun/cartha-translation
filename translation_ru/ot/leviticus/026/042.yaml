base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: ru
  text: Тогда[a] Я вспомню Мой завет с Иаковом, и также Мой завет с Исааком, и также Мой завет с Авраамом вспомню; и землю вспомню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Я вспомню». Еврейский союз может передаваться простым «и»; вариант «тогда» отражает связь стиха с предшествующим контекстом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Тогда Я вспомню
  rationale: Глагол זכר в контексте завета означает не простое воспоминание, а памятование, подразумевающее последующее действие. Союз וְ буквально может означать «и», однако «тогда» естественно передаёт связь с предшествующим условным контекстом; альтернативу отмечает сноска.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: «Завет» — точный и общепринятый русский эквивалент בְּרִית, сохраняющий смысл обязательного отношения Бога с патриархами. Местоимение повторено вслед за еврейским текстом.
- source_word: וְאַף
  choice: и также
  rationale: Передаёт соединительное и добавочно-усилительное значение сочетания וְאַף, не прибегая к излишне резкому «и даже».
- source_word: אֶזְכֹּר
  choice: вспомню
  rationale: Повтор глагола сохранён, поскольку в еврейском тексте он риторически выделяет Авраама, а затем землю.
- source_word: וְהָאָרֶץ
  choice: и землю
  rationale: В данном контексте הָאָרֶץ обозначает землю обетования. Русское «землю» естественно и сохраняет намеренную краткость оригинала.
theological_decisions:
- issue: Порядок и выделение заветов с патриархами
  choice: Сохранить порядок Иаков, Исаак, Авраам и повторить «Мой завет» при каждом имени.
  alternative: Переставить имена в хронологическом порядке или объединить их в формулу «завет с Авраамом, Исааком и Иаковом».
  rationale: Обратный хронологический порядок и троекратное упоминание завета принадлежат структуре еврейского текста и не должны сглаживаться.
- issue: Смысл Божьего памятования
  choice: Перевести глагол буквально как «вспомню», не раскрывая подразумеваемое действие.
  alternative: «Вспомню и исполню» или «возобновлю».
  rationale: В контексте завета Божье памятование подразумевает действие, но сам стих прямо говорит лишь о памятовании; буквальная передача сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Заглавные местоимения при обращении Бога к Самому Себе соответствуют принятой русской издательской традиции. Повторы и необычный порядок имён намеренно сохранены.
