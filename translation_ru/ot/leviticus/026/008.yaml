  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: ru
  text: Пятеро из вас будут преследовать сотню[a], и сотня из вас будет преследовать десять тысяч[b], а враги ваши падут перед вами от меча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гнаться за» — здесь и в следующей части стиха.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово רְבָבָה может означать «десять тысяч» или «несметное множество»; здесь «десять тысяч» соответствует числовому параллелизму.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: будут преследовать / будет преследовать
  rationale: Глагол רדף означает «преследовать, гнаться за». «Преследовать» естественно звучит в военном контексте и сохраняет прямой смысл обеих параллельных частей.
- source_word: מִכֶּם
  choice: из вас
  rationale: 'Предлог מן с местоименным суффиксом имеет здесь партитивное значение: «пятеро из вас», «сотня из вас».'
- source_word: חֲמִשָּׁה ... מֵאָה
  choice: пятеро ... сотню
  rationale: Для обозначения пяти человек употреблено собирательное числительное «пятеро»; объект «сто человек» естественно передан словом «сотню».
- source_word: רְבָבָה
  choice: десять тысяч
  rationale: Слово может обозначать десять тысяч или несметное множество; конкретное число лучше соответствует нарастающему числовому параллелизму стиха.
- source_word: וְנָפְלוּ
  choice: падут
  rationale: Сохранён буквальный образ падения в бою, без поясняющего добавления «будут поражены».
- source_word: אֹיְבֵיכֶם לִפְנֵיכֶם
  choice: враги ваши падут перед вами
  rationale: Формулировка близко передаёт еврейское выражение и ясно означает военное поражение врагов.
- source_word: לֶחָרֶב
  choice: от меча
  rationale: Русское выражение «пасть от меча» естественно передаёт гибель от оружия и сохраняет военный образ исходного текста.
theological_decisions:
- issue: 'Военное обещание как благословение завета: гипербола или буквальное соотношение сил'
  choice: Сохранено прямое конкретное обещание несоразмерной победы без истолкования степени буквальности чисел.
  alternative: Передать числа как общее образное обещание превосходства либо прямо обозначить их как гиперболу.
  rationale: Исходный текст формулирует обещание в конкретных военных и числовых образах, но сам не разъясняет, следует ли понимать числа строго буквально; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Формы «враги ваши» и «падут ... от меча» сохраняют достоинство и военную образность текста, оставаясь понятными современному читателю.
