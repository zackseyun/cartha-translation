  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: ru
  text: Я дам мир в стране, и вы будете ложиться спать, и никто не будет внушать вам страха. Я удалю из страны опасных зверей[a], и меч[b] не пройдёт по вашей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «опасного зверя». Слово רָעָה характеризует животное как опасное или вредоносное, а не как нравственно злое; речь не ограничивается хищниками.'
    reason: lexical_alternative
  - marker: b
    text: «Меч» — образное обозначение войны или вооружённого вторжения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם בָּאָרֶץ
  choice: И дам мир земле
  rationale: Глагол נתן прямо передан как «дам», а שָׁלוֹם — как «мир», поскольку контекст описывает даруемую Богом безопасность и благополучие на земле Израиля. Русское управление «дать мир земле» естественно и сохраняет территориальную направленность выражения.
- source_word: וּשְׁכַבְתֶּם
  choice: и вы будете ложиться отдыхать
  rationale: שׁכב буквально означает «ложиться». Добавление «отдыхать» делает образ естественным по-русски и сохраняет смысл безопасного покоя, не сводя его только ко сну.
- source_word: וְאֵין מַחֲרִיד
  choice: и никто не устрашит вас
  rationale: Причастие מַחֲרִיד обозначает того, кто вызывает страх. Формулировка сохраняет каузативный смысл и звучит кратко и достойно.
- source_word: וְהִשְׁבַּתִּי חַיָּה רָעָה מִן הָאָרֶץ
  choice: Я удалю из земли хищных зверей
  rationale: Порода Hiphil глагола שׁבת означает прекращение или устранение. חַיָּה רָעָה — опасные, вредоносные животные; в данном контексте естественное русское обозначение — «хищные звери», с примечанием о более широком значении.
- source_word: וְחֶרֶב לֹא תַעֲבֹר בְּאַרְצְכֶם
  choice: и меч не пройдёт по вашей земле
  rationale: Сохранён буквальный образ меча как метонимии войны или вооружённого вторжения. Глагол עבר передан как «пройдёт», а предлог בְּ в данном контексте естественно выражен сочетанием «по вашей земле».
theological_decisions:
- issue: Объём обещанного мира
  choice: Обещание относится к заветной безопасности Израиля на его земле и включает спокойный отдых, отсутствие угрозы со стороны зверей и военного вторжения.
  alternative: Только внутренний духовный мир или исключительно политическое спокойствие.
  rationale: Конкретные образы покоя без страха, удаления опасных зверей и отсутствия меча указывают на целостное, но материально выраженное благословение; перевод не сужает его до одной сферы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краткий и ясный; конкретные древнееврейские образы сохранены, а потенциально неочевидные значения пояснены в сносках.
