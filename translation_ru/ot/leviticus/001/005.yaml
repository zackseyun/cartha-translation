  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: ru
  text: Пусть он заколет молодого быка[a] перед Яхве, а сыновья Аарона, священники, поднесут кровь и выплеснут кровь на жертвенник со всех сторон[b], который находится у входа в шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сына крупного скота» — еврейское идиоматическое обозначение животного из крупного рогатого скота.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обрызгают кровью»; традиционно: «окропят кровью». Еврейский глагол обозначает бросание или выплёскивание крови при обрядовом нанесении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: пусть он заколет
  rationale: В последовательности обрядовых предписаний форма выражает распоряжение. «Заколет» точно передаёт ритуальное умерщвление животного.
- source_word: בֶּן הַבָּקָר
  choice: молодого быка
  rationale: Буквально «сын крупного скота»; это идиоматическое обозначение животного из крупного рогатого скота, в данном контексте — молодого быка.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняет пространственно-обрядовый смысл выражения и передаёт личное имя יהוה как «Яхве».
- source_word: וְהִקְרִיבוּ
  choice: поднесут
  rationale: Порода hiphil от קרב означает «приблизить, поднести». Здесь непосредственный объект — кровь, поэтому «поднесут» точнее, чем более широкое «принесут в жертву».
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: сыновья Аарона, священники
  rationale: Сохранены и родственное обозначение, и поясняющее наименование их священнического служения.
- source_word: וְזָרְקוּ אֶת הַדָּם עַל הַמִּזְבֵּחַ סָבִיב
  choice: плеснут ею на жертвенник со всех сторон
  rationale: זרק обозначает бросание или выплёскивание жидкости при обрядовом нанесении. «Плеснут» естественно передаёт энергичное движение и не сводит его безоговорочно к мелкому окроплению; местоимение устраняет тяжёлый повтор слова «кровь».
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: на жертвенник, стоящий у входа в шатёр встречи
  rationale: Относительное предложение отнесено к жертвеннику и ясно указывает его местоположение.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прямой и прозрачный перевод названия, не подменяющий его более поздним традиционным термином «скиния».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Характер нанесения крови на жертвенник
  choice: плеснут ею на жертвенник
  alternative: окропят жертвенник кровью; бросят кровь на жертвенник
  rationale: Глагол זרק указывает на бросательное или выплёскивающее движение, но не определяет с полной точностью технику. Основной текст передаёт физическую силу действия, а примечание сохраняет традиционный вариант.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-торжественным звучанием. Повелительно-инструктивная последовательность передана конструкцией «пусть… затем…». Повтор определения жертвенника в конце сохранён в естественной русской форме для устранения возможной синтаксической двусмысленности.
