revisions:
- from: И пусть он заколет молодого быка[a] перед Яхве. Затем сыновья Аарона, священники, поднесут кровь и плеснут ею на жертвенник со всех сторон[b] — на жертвенник, стоящий у входа в шатёр встречи.
  to: Пусть он заколет молодого быка[a] перед Яхве, а сыновья Аарона, священники, поднесут кровь и выплеснут кровь на жертвенник со всех сторон[b], который находится у входа в шатёр встречи.
  rationale: Правка устраняет синтаксически неестественный повтор «жертвенник» и делает связь относительного предложения с жертвенником прямой. «Выплеснут кровь» сохраняет физически энергичный оттенок זָרַק, не подменяя его без пояснения более узким традиционным «окропят». Смысл и порядок ритуальных действий не изменены.
