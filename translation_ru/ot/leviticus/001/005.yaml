  source_fidelity: 'В целом переданы все основные элементы масоретского текста: заклание жертвенного животного перед Яхве, участие сыновей Аарона как священников, принесение крови и её ритуальное нанесение на жертвенник вокруг, расположенный у входа в шатёр встречи. Однако повтор «на жертвенник ... — на жертвенник» не соответствует структуре относительного предложения אֲשֶׁר и создаёт неудачную русскую конструкцию. «Плеснут ею» допустимо, но при таком порядке слов «со всех сторон» звучит присоединённо и менее ясно передаёт סָבִיב.'
