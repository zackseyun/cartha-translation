  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: ru
  text: А внутренности и ноги он должен вымыть водой, и священник сожжёт всё это на жертвеннике — всесожжение, жертву, сжигаемую на огне[a], благоухание, приятное Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огненная жертва»; возможно также: «пищевой дар». Значение еврейского слова אִשֶּׁה не вполне определённо.'
    reason: lexical_alternative
  - marker: b
    text: «Благоухание, приятное Яхве» — устойчивая жертвенная формула, указывающая на благосклонное принятие жертвы.
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: внутренности
  rationale: В контексте жертвоприношения слово обозначает внутренние органы животного; «внутренности» конкретно, естественно и понятно современному читателю.
- source_word: כְרָעָיו
  choice: голени
  rationale: Слово указывает на нижние части ног животного. «Голени» точнее общего «ноги» и при этом остаётся общеупотребительным.
- source_word: יִרְחַץ בַּמָּיִם
  choice: пусть он вымоет водой
  rationale: Форма передаёт предписание, а творительный падеж «водой» естественно выражает средство омовения по-русски.
- source_word: וְהִקְטִיר
  choice: сожжёт
  rationale: В жертвенном контексте глагол означает сжечь приношение на жертвеннике так, чтобы оно восходило дымом. «Сожжёт» звучит естественно; специальный дымовой оттенок определяется контекстом и не требует неуклюжего оборота «обратит в дым».
- source_word: אֶת־הַכֹּל
  choice: всё это
  rationale: 'Передаёт подчёркнутую полноту: на жертвеннике сжигается всё подготовленное животное.'
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся и точный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Значение термина обсуждается; основной текст сохраняет его очевидную связь с огнём, а примечание указывает возможное понимание как пищевого дара.
- source_word: רֵיחַ נִיחוֹחַ
  choice: благоухание, приятное
  rationale: Сохраняет образность устойчивой жертвенной формулы и выражает благоприятность жертвы, не устраняя метафору.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; «Яхве» сохраняет различие между именем и титулом, не навязывая конфессиональной замены.
- issue: Значение אִשֶּׁה
  choice: огненная жертва
  alternative: пищевой дар
  rationale: Этимология и употребление допускают традиционное понимание как приношения, сжигаемого в огне, и предложенное исследователями понимание как пищевого дара. Основной текст сохраняет огненную образность, а примечание — реальную лексическую неоднозначность.
- issue: Смысл формулы רֵיחַ נִיחוֹחַ
  choice: благоухание, приятное Яхве
  alternative: успокоительное благоухание для Яхве
  rationale: Выбранная формулировка сохраняет жертвенную метафору и идею благоприятного принятия, не делая дополнительных утверждений о природе Божьего восприятия.
translation_notes:
  register: Современный литературный русский с достоинством ритуально-законодательного текста. Синтаксис разделён на два предложения ради естественности; второе сохраняет цепочку приложений еврейского оригинала. Архаизмы сведены к укоренившемуся термину «всесожжение».
