translation:
  language: ru
  text: Сыновья Аарона, священника, разведут огонь на жертвеннике и разложат дрова поверх огня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: положат
  rationale: Глагол נתן здесь обозначает помещение огня на жертвенник; форма будущего времени естественно передаёт предписывающую силу ритуальной инструкции.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: сыновья священника Аарона
  rationale: Такой порядок слов ясно относит единственное число «священник» к Аарону и сохраняет указание на его сыновей как исполнителей действия.
- source_word: אֵשׁ
  choice: огонь
  rationale: В данном описании жертвоприношения имеется в виду буквальный огонь.
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвенник
  rationale: Русский винительный падеж с «на» естественно выражает направленное помещение огня на жертвенник.
- source_word: וְעָרְכוּ
  choice: и разложат
  rationale: ערך означает упорядоченно расположить; «разложат» естественно описывает размещение дров и сохраняет идею намеренного порядка.
- source_word: עֵצִים
  choice: дрова
  rationale: В контексте разведения жертвенного огня русское «дрова» точнее и естественнее общего «дерево» и не уточняет форму древесины.
- source_word: עַל הָאֵשׁ
  choice: на огне
  rationale: Прямо передаёт повтор предлога עַל и последовательность ритуальных действий.
