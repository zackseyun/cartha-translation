  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: ru
  text: Затем он снимет кожу с жертвы всесожжения и рассечёт её на части.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассечёт её на её части»; речь идёт о разделении туши животного на части для обряда.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: снимет кожу
  rationale: В породе хифиль глагол פשט в контексте жертвоприношения означает снять с животного шкуру. Выражение «снимет кожу» ясно передаёт конкретное обрядовое действие на современном русском языке.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: עֹלָה — принятый в книге Левит термин для жертвы, целиком сжигаемой на жертвеннике. «Всесожжение» точно и кратко обозначает этот вид жертвы.
- source_word: וְנִתַּח
  choice: и рассечёт
  rationale: Глагол נתּח означает разделить тушу на отдельные части. «Рассечёт» естественно сочетается с «на части» и точнее передаёт разделку туши, чем общее «разрежет».
- source_word: לִנְתָחֶיהָ
  choice: на части
  rationale: Существительное נתח обозначает отрезанную часть или секцию; конструкция с ל указывает на результат разделения. Русское «на части» естественно передаёт смысл, не внося неуказанного числа или размера кусков.
- source_word: וְ
  choice: Затем
  rationale: Союз продолжает последовательность обрядовых действий предыдущего стиха; «затем» ясно выражает эту процедурную связь.
