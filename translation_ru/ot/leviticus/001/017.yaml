  terminology: «Всесожжение» — точный устоявшийся термин для עֹלָה. «Огненная жертва» приемлемо передаёт אִשֶּׁה, но сноска должна представлять вариант «жертва, сжигаемая на огне»/«жертва огненная» как более прямую альтернативу, а не создавать впечатление, что значение слова в целом неясно. Имя «Яхве» соответствует исходному тексту и аудиторскому следу.
