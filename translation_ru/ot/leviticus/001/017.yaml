base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ru
  text: Пусть он разорвёт птицу за крылья, но не разделит её. Затем священник сожжёт её на жертвеннике, на дровах, лежащих на огне. Это всесожжение, огненная жертва[a], благоухание, приятное Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва, сжигаемая на огне»; возможен также перевод: «пища, приносимая в жертву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁסַּע
  choice: рассечёт
  rationale: Глагол обозначает разрывание или рассечение тела птицы; последующее запрещение разделять её надвое показывает, что птицу раскрывают, но не разнимают полностью.
- source_word: בִכְנָפָיו
  choice: по крыльям
  rationale: Предлог допускает понимание места или направления действия. «По крыльям» сохраняет конкретный образ и естественно звучит по-русски.
- source_word: לֹא יַבְדִּיל
  choice: не разделяет её надвое
  rationale: Форма породы hифиль означает отделение или разделение. Добавление «надвое» ясно передаёт запрет полностью разъединять рассечённую птицу.
- source_word: וְהִקְטִיר
  choice: сожжёт
  rationale: В жертвенном контексте глагол означает сожжение на жертвеннике с восхождением дыма; контекст жертвенника позволяет употребить ясное русское «сожжёт».
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: на дровах, лежащих на огне
  rationale: Передаёт повторённый еврейский предлог и расположение жертвы на дровах над огнём, не утяжеляя русскую фразу буквальным повтором.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике; он точно соответствует культовому употреблению слова в Левите.
- source_word: אִשֵּׁה
  choice: огненная жертва
  rationale: Слово обозначает приношение, связанное с огнём. Такой перевод сохраняет вероятный смысл и культовую формулу, не вводя менее очевидное понятие пищи в основной текст.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Формула выражает угодность жертвы Богу через образ запаха. Такая формулировка сохраняет метафору и остаётся понятной современному читателю.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а предшествующее «приятное» естественно выражает отношение, отмеченное предлогом ל.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В исходном тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл формулы רֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  alternative: успокоительное благоухание для Яхве
  rationale: Выбранный вариант сохраняет жертвенную метафору и идею угодности, но не усиливает её до утверждения, будто жертва буквально успокаивает Бога.
- issue: Значение אִשֵּׁה
  choice: огненная жертва
  alternative: пища, приносимая в жертву
  rationale: Этимология и точный оттенок слова обсуждаются. Основной перевод следует прозрачной связи с огненным приношением, а возможный пищевой оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением установленной жертвенной терминологии. Синтаксис сделан ясным для обычного читателя; конкретные образы исходного текста и его культовая формула сохранены.
