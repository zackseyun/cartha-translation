source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ru
  text: А внутренности и голени пусть он омоет водой. Священник принесёт всё это и сожжёт на жертвеннике. Это всесожжение, огненная жертва[a], благоухание, приятное ГОСПОДУ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва, приносимая на огне».'
    reason: Лексическая альтернатива для אִשֵּׁה, поясняющая более буквальный огненный оттенок термина.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: внутренности
  rationale: В контексте жертвоприношения слово обозначает внутренние органы животного; «внутренности» — точный и естественный русский эквивалент.
- source_word: הַכְּרָעַיִם
  choice: голени
  rationale: Речь идёт прежде всего о нижних частях ног жертвенного животного; «голени» точнее общего слова «ноги».
- source_word: יִרְחַץ בַּמָּיִם
  choice: пусть он омоет водой
  rationale: Передаёт значение רחץ и явно сохраняет указание на воду как средство омовения. Местоимение восстанавливает подразумеваемого исполнителя из контекста.
- source_word: וְהִקְרִיב
  choice: принесёт
  rationale: В породе hифиль глагол означает приблизить или представить жертву; «принесёт» естественно звучит в русском описании жертвенного обряда и не сливает действие с последующим сожжением.
- source_word: אֶת־הַכֹּל
  choice: всё это
  rationale: Сохраняет полноту выражения и ясно отсылает ко всем подготовленным частям жертвы.
- source_word: וְהִקְטִיר
  choice: сожжёт
  rationale: Специальный жертвенный глагол описывает сжигание с превращением в дым; «сожжёт» понятно современному читателю и в сочетании с жертвенником сохраняет культовый смысл.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Естественно передаёт направительно-локативную форму и место совершения обряда.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике; он сохраняет отличие этого вида жертвы от других.
- source_word: אִשֵּׁה
  choice: огненная жертва
  rationale: Передаёт связь термина с огнём, не добавляя спорного толкования «пища»; более развернутый смысл указан в сноске.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Сохраняет образ запаха и одновременно выражает благоприятность и приемлемость жертвы, не устраняя антропоморфную образность исходного текста.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции формой, выделенной прописными буквами для отличия от обычного титула.
theological_decisions:
- issue: Антропоморфный образ в רֵיחַ נִיחֹחַ
  choice: благоухание, приятное ГОСПОДУ
  alternative: успокоительное благоухание ГОСПОДУ
  rationale: Выбранная формулировка сохраняет чувственный образ запаха как выражение принятия жертвы Богом, но не усиливает возможное представление о том, будто жертва буквально успокаивает Бога.
- issue: Значение אִשֵּׁה
  choice: огненная жертва
  alternative: пищевое приношение
  rationale: Этимология и точный оттенок термина обсуждаются; перевод сохраняет явную огненную составляющую жертвенного обряда и не вводит толкование о божественной пище. Развёрнутый вариант дан в сноске.
translation_notes:
  register: Современный литературный русский с достоинством ритуально-правового текста. Синтаксис сделан ясным без устранения образности оригинала; специализированный термин «всесожжение» сохранён как общеупотребительный библейский эквивалент.
