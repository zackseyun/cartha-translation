  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: ru
  text: '«Скажи израильтянам[a]: „Если кто-нибудь[b] из вас принесёт приношение Яхве, то приносите ваше приношение из домашнего скота — из крупного скота или из мелкого скота“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человек из вас»; здесь слово «человек» обозначает любого представителя общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтянам
  rationale: Естественная современная передача названия народа в формуле обращения; буквальный еврейский оборот отмечен в сноске.
- source_word: אָדָם ... מִכֶּם
  choice: кто-нибудь из вас
  rationale: В данном условном установлении אָדָם обозначает отдельного представителя общины. Эта формулировка естественна по-русски и сохраняет обобщающий смысл.
- source_word: יַקְרִיב / תַּקְרִיבוּ
  choice: принесёт / приносите
  rationale: Глагол קרב в породе хифиль в жертвенном контексте означает принести или представить; повтор одного русского корня сохраняет связь двух форм в еврейском тексте.
- source_word: קָרְבָּן
  choice: приношение
  rationale: Широкое культовое обозначение дара, представляемого Богу; слово «жертва» здесь могло бы неоправданно сузить значение.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה, непосредственно стоящее в исходном тексте.
- source_word: הַבְּהֵמָה
  choice: домашний скот
  rationale: Общее обозначение домашних животных, из которых допускается приношение.
- source_word: הַבָּקָר
  choice: крупный скот
  rationale: Обозначает крупный рогатый скот как одну из двух названных категорий.
- source_word: הַצֹּאן
  choice: мелкий скот
  rationale: Собирательное обозначение овец и коз; «мелкий скот» точно противопоставлен крупному скоту.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет его отличие от титула «Господь».
- issue: Обобщающее значение אָדָם
  choice: кто-нибудь
  alternative: человек
  rationale: В условной формуле существительное вводит любого отдельного человека из общины, а не подчёркивает мужской пол; буквальная форма сохранена в сноске.
- issue: Формула בְּנֵי יִשְׂרָאֵל
  choice: израильтяне
  alternative: сыны Израиля
  rationale: Современное название народа передаёт адресата без архаизации; буквальная идиома указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранён переход от единственного числа в условной части к обращению во множественном числе в предписании. Терминология различает общее «домашний скот» и две его категории — крупный и мелкий скот.
