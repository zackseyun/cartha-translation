base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: ru
  text: Если же его приношение во всесожжение — из мелкого скота, из овец или из коз, пусть он принесёт самца без изъяна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как всесожжение». «Без изъяна» означает без телесного недостатка — в состоянии, требуемом для этой жертвы.'
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Естественно вводит следующий условный случай и сохраняет связующую силу וְ, не создавая резкого противопоставления.
- source_word: מִן הַצֹּאן
  choice: из мелкого скота
  rationale: צֹאן — собирательное обозначение домашних овец и коз; последующее уточнение называет обе группы.
- source_word: קָרְבָּנוֹ
  choice: его приношение
  rationale: קָרְבָּן обозначает то, что приносят и представляют Богу; «приношение» ясно передаёт культовый смысл.
- source_word: מִן הַכְּשָׂבִים
  choice: из овец
  rationale: כְּשָׂבִים здесь обозначает категорию овец в противопоставлении козам, без необходимого ограничения по возрасту.
- source_word: אוֹ מִן הָעִזִּים
  choice: или коз
  rationale: עִזִּים — обычное множественное обозначение коз; русский родительный падеж естественно зависит от повторяемого по смыслу «из».
- source_word: לְעֹלָה
  choice: во всесожжение
  rationale: עֹלָה — установленный вид жертвы, полностью сжигавшейся на жертвеннике; «всесожжение» точно и традиционно называет эту категорию.
- source_word: זָכָר
  choice: животное мужского пола
  rationale: Сохраняет явное требование к полу жертвенного животного и по-русски звучит яснее, чем субстантивированное «самца» после глагола.
- source_word: תָּמִים
  choice: без изъяна
  rationale: В жертвенном контексте означает отсутствие телесного недостатка или повреждения.
- source_word: יַקְרִיבֶנּוּ
  choice: пусть он принесёт
  rationale: Hiphil от קרב в жертвенном контексте означает представить или принести жертву; форма «пусть принесёт» передаёт предписывающую силу без архаизма.
theological_decisions:
- issue: Передача жертвенного термина עֹלָה
  choice: всесожжение
  alternative: возносимая жертва
  rationale: «Всесожжение» понятно называет установленный вид левитской жертвы и отражает её полное сожжение; этимологический вариант «возносимая жертва» сохраняет образ восхождения, но менее ясно обозначает культовую категорию.
- issue: Требование к полу животного
  choice: животное мужского пола
  alternative: самца
  rationale: Еврейский текст прямо определяет пол жертвенного животного; перевод сохраняет эту конкретность без переноса требования на человеческий референт.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён для ясности, при этом сохранены условная структура, культовая терминология и все требования исходного текста.
