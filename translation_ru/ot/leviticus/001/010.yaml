  source_fidelity: 'Смысловые компоненты еврейского текста переданы: условное продолжение, приношение из мелкого скота с уточнением «из овец или из коз», назначение как всесожжения, требование самца без телесного изъяна. Однако в исходной русской фразе «во всесожжение» несколько оторвано от «приношение», а «животное мужского пола» излишне канцелярски и менее естественно, чем «самца».'
