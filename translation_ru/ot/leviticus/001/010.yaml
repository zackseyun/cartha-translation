  terminology: «Приношение», «мелкий скот», «овцы», «козы», «всесожжение» и «без изъяна» уместны в библейско-культовом контексте. «Самца» точно передаёт זָכָר, не добавляя возрастного ограничения. Сноска к «во всесожжение» сохраняет допустимую альтернативу передачи לְעֹלָה.
