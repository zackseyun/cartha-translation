- from: Если же его приношение — из мелкого скота, из овец или коз, во всесожжение[a], пусть он принесёт животное мужского пола без изъяна[b].
  to: Если же его приношение во всесожжение — из мелкого скота, из овец или из коз, пусть он принесёт самца без изъяна[a].
  rationale: Редакция устраняет небольшую синтаксическую неясность и заменяет тяжеловесное «животное мужского пола» естественным «самца». Поскольку оба исходных примечания относятся к разным словам, а после перестройки текста удобна одна конечная позиция сноски, они объединены под одним маркером без утраты содержания.
