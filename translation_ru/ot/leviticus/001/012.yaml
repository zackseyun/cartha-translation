  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: ru
  text: Пусть он разделает её на части, включая голову и жир[a], а священник разложит всё это на дровах, лежащих на огне, который находится на жертвеннике.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нутряным жиром». Еврейское слово обозначает жировую ткань жертвенного животного, вероятно связанную с внутренностями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: Пусть он разрежет её на части
  rationale: В контексте жертвоприношения נתח означает разделать животное, разрезав его на отдельные части. Конструкция с формой глагола в последовательности предписаний передана естественным для современного русского повелительным оборотом «пусть».
- source_word: רֹאשׁוֹ
  choice: с головой
  rationale: Обычное анатомическое значение; предлог «с» естественно объединяет голову и жир с упомянутыми частями, не меняя состава перечисления.
- source_word: פִּדְרוֹ
  choice: жиром
  rationale: Редкое культовое слово обозначает жировую ткань жертвенного животного, вероятно жир у внутренностей. Общее «жир» сохраняет краткость и не устраняет лексическую неопределённость; уточнение вынесено в сноску.
- source_word: וְעָרַךְ
  choice: разложит
  rationale: ערך означает упорядоченно расположить или уложить. «Разложит» ясно и естественно описывает размещение частей на дровах, сохраняя идею целенаправленного порядка.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Стандартное русское соответствие כהן в контексте левитского богослужения.
- source_word: אֹתָם
  choice: всё это
  rationale: Местоимение относится совместно к частям, голове и жиру. «Всё это» естественнее русского «их» при ряде существительных разных грамматических родов и чисел.
- source_word: עַל הָעֵצִים
  choice: на дровах
  rationale: Множественное עֵצִים в данном контексте означает древесину, приготовленную для огня; русское «дрова» конкретно и естественно для жертвенника.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: которые лежат на огне, что на жертвеннике
  rationale: 'Сохранены обе вложенные относительные конструкции и пространственная последовательность оригинала: дрова находятся на огне, а огонь — на жертвеннике.'
