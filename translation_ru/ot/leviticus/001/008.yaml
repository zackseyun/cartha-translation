base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: ru
  text: И сыновья Аарона, священники, разложат части туши, голову и жир[a] на дровах, лежащих на огне, находящемся на жертвеннике.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сальник» или «жировой покров»; еврейское слово обозначает жировую часть животного, предназначенную для жертвоприношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: разложат
  rationale: Глагол ערך в контексте жертвоприношения означает упорядоченно разложить или расположить. Будущее время естественно передаёт предписание в русском повествовательно-законодательном стиле.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: сыновья Аарона, священники
  rationale: Слово «священники» выступает приложением и уточняет служение сыновей Аарона; запятые ясно передают эту связь.
- source_word: הַנְּתָחִים
  choice: части туши
  rationale: Существительное обозначает куски разделанного животного. Добавление «туши» естественно связывает выражение с разделкой, упомянутой в предыдущем стихе, и исключает неопределённость русского слова «части».
- source_word: הָרֹאשׁ
  choice: голову
  rationale: Прямое обозначение части тела животного.
- source_word: הַפָּדֶר
  choice: жир
  rationale: Редкое слово обозначает жировую часть жертвенного животного, вероятно сальник или жировой покров. «Жир» — наиболее ясный и нейтральный вариант; более точные возможные значения сохранены в сноске.
- source_word: עַל הָעֵצִים
  choice: на дровах
  rationale: עֵצִים здесь обозначает древесное топливо на жертвеннике; русское «дрова» конкретно и естественно в данном контексте.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: лежащих на огне, который на жертвеннике
  rationale: 'Сохранена последовательность двух относительных конструкций: дрова находятся на огне, а огонь — на жертвеннике. Причастие «лежащих» делает фразу естественнее по-русски, не меняя пространственной связи.'
