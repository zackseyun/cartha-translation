  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: ru
  text: Он должен заколоть его у северной стороны жертвенника, перед Яхве, а сыновья Аарона, священники, должны выплеснуть его кровь на жертвенник со всех сторон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросят его кровь на жертвенник со всех сторон». Еврейский глагол обозначает энергичное бросательное движение, а не лёгкое окропление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: пусть он заколет
  rationale: Глагол שׁחט обозначает заклание животного, особенно в жертвенном контексте; «заколет» точнее общего «убьёт» и сохраняет ритуально-предписывающий регистр.
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: с северной стороны жертвенника
  rationale: יֶרֶךְ буквально означает «бок, сторона», а צָפֹנָה указывает на север; выбран естественный русский оборот, точно передающий место действия.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Культовое выражение означает совершение действия в присутствии Яхве; «пред» сохраняет достоинство и краткость исходной формулы.
- source_word: וְזָרְקוּ
  choice: пусть плеснут
  rationale: זרק выражает бросательное, энергичное нанесение жидкости. «Плеснут» естественно по-русски передаёт направленное и достаточно сильное движение крови, в отличие от более слабого «окропят».
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: сыновья Аарона, священники
  rationale: 'Сохранена аппозиция исходного текста: сыновья Аарона отождествляются со священниками без утраты ни родства, ни служения.'
- source_word: דָּמוֹ
  choice: его кровь
  rationale: В русском языке по отношению к упомянутому жертвенному животному естественно мужское местоимение, согласованное с «его» в первой части стиха.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: на жертвенник со всех сторон
  rationale: עַל указывает на направленность крови на жертвенник, а סָבִיב — на действие вокруг него, по всем его сторонам.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством ритуально-правового предписания. Повтор «пусть» ясно передаёт последовательные обязательные действия; терминология остаётся понятной неспециалисту.
