  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] позвал Моисея и сказал ему из Шатра Встречи:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ) — личное имя Бога; в традиционных русских переводах обычно передаётся словом «Господь».
    reason: Поясняет передачу тетраграмматона «Яхве» и указывает традиционный вариант без утверждения, что в еврейском тексте стоит титул.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: И позвал
  rationale: Глагол קרא с предлогом אֶל обозначает обращённый к Моисею призыв. «Позвал» естественно передаёт смысл, не усиливая его до властного «призвал» и не уточняя способ зова.
- source_word: מֹשֶׁה
  choice: Моисея
  rationale: Устоявшаяся русская форма имени משה; винительный падеж соответствует естественному русскому управлению глагола «позвал».
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Глагол דבר передаёт речь, здесь — торжественное Божье обращение. «Говорил» сохраняет отличие от последующего לֵאמֹר («сказав»).
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог с местоименным суффиксом относится к Моисею; «говорил ему» точно и естественно передаёт направленность речи.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: из шатра встречи
  rationale: אֹהֶל — «шатёр», а מוֹעֵד в данном наименовании указывает на назначенное место встречи Бога с Израилем. Формулировка прозрачна и не добавляет отсутствующего здесь термина «скиния».
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Инфинитив вводит содержание следующей далее прямой речи; русское «сказав» сохраняет формальную двухчастную формулу речи.
- source_word: וַ
  choice: И
  rationale: Начальный повествовательный союз связывает стих с предшествующим повествованием книги Исход; русское «И» сохраняет эту связь без излишнего уточнения последовательности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, а не титул אֲדֹנָי. Транслитерация «Яхве» сохраняет это различие; традиционная замена «Господь» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм еврейского повествования сохранён, но управление глаголов сделано естественным для русского языка.
