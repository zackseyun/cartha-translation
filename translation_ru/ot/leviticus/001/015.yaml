review_pass:
  verdict: revise
  source_fidelity: 'Основные действия переданы верно: священник подносит птицу к жертвеннику, совершает обозначенное редким техническим глаголом действие с её головой, затем сжигает жертву, а кровь выжимается на стену жертвенника. Однако «кровь птицы будет выжата на боковую стенку» неестественно по-русски и несколько затрудняет связь действия с птицей. Не следует безоговорочно конкретизировать приём глагола מלק как «свернёт».'
  naturalness: '«Отщипнёт ей голову» понятно, но тяжеловесно; более плавно: «отщипнёт ей голову». Главная необходимая правка относится к последней клаузе: активная конструкция «выжмет кровь птицы на стенку жертвенника» естественна в русском законодательном описании и передаёт результат древнееврейского пассива без смыслового изменения.'
  terminology: «Священник» и «жертвенник» соответствуют регистру и терминологии Левита. «Стенка жертвенника» сохраняет буквальное קִיר; добавление «боковая» допустимо как пояснение, но не требуется. Сноска к מלק должна отражать технический характер слова и не представлять «свернёт» как предпочтительное точное значение.
