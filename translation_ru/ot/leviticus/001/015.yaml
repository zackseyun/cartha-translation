  - severity: low
    issue: Сноска к מלק чрезмерно выдвигает вариант «свернёт»
    rationale: Глагол является редким техническим термином; базовое значение связано с отщипыванием/отделением головы, тогда как точная техника оспаривается. Вариант «свернёт» лучше обозначить лишь как возможную интерпретацию, не называя его точным переводом.
