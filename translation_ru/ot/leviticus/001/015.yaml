  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: ru
  text: Священник поднесёт птицу к жертвеннику, отщипнёт ей голову[a] и сожжёт её на жертвеннике; затем выжмет кровь птицы на стенку жертвенника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол обозначает особое действие священника при умерщвлении жертвенной птицы; точный способ действия не вполне ясен. Возможное понимание: «свернёт ей голову».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на стену жертвенника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: поднесёт птицу
  rationale: Хифиль глагола קרב обозначает приближение или поднесение. Уточнение «птицу» естественно передаёт местоименный суффикс по контексту и не смешивает поднесение с последующим принесением жертвы.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное и точное обозначение служителя культа в законодательных текстах Левита.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: к жертвеннику
  rationale: Предлог אֶל указывает на движение к цели; русское «к жертвеннику» естественно передаёт это направление.
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: отщипнёт ей голову[a]
  rationale: מלק — редкий специальный термин для умерщвления жертвенной птицы рукой священника. «Отщипнёт» конкретно передаёт основное лексическое значение, а сноска сохраняет неопределённость точного приёмa.
- source_word: וְהִקְטִיר
  choice: сожжёт её
  rationale: В жертвенном контексте קטר означает сожжение на жертвеннике с превращением жертвы в дым. Русское «сожжёт» ясно и естественно в данном описании обряда.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Форма с направительным окончанием в данном контексте относится к месту сожжения; «на жертвеннике» точно описывает действие.
- source_word: וְנִמְצָה דָמוֹ
  choice: кровь птицы будет выжата
  rationale: 'Нифаль глагола מצה сохраняет пассивное значение: кровь выдавливают или выжимают. «Будет выжата» точнее, чем более общее «стечёт», передаёт намеренное действие.'
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: на боковую стенку жертвенника[b]
  rationale: קִיר буквально означает «стена, стенка»; применительно к жертвеннику речь идёт о его вертикальной боковой поверхности. Формулировка остаётся понятной современному читателю.
