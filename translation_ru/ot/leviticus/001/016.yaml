base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: ru
  text: Пусть он удалит у птицы зоб[a] вместе с её оперением[b] и бросит всё это рядом с жертвенником, с восточной стороны, на место пепла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает птичий зоб; возможно, здесь подразумевается также его содержимое.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с её оперением». Некоторые переводы понимают это выражение как «с его нечистотами».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: пусть он удалит
  rationale: Порода хифиль глагола סור выражает устранение или удаление; конструкция с «пусть» естественно передаёт предписывающую силу ритуальной инструкции.
- source_word: מֻרְאָתוֹ
  choice: у птицы зоб
  rationale: Редкое существительное в контексте жертвоприношения птицы обозначает зоб. Добавление «у птицы» устраняет неестественное для русского языка местоименное сочетание, не добавляя нового содержания.
- source_word: בְּנֹצָתָהּ
  choice: вместе с перьями
  rationale: Согласный текст и масоретская огласовка естественнее всего связывают слово с נוצה, «перо, оперение». Трудность выражения и традиционное понимание как нечистот отмечены в сноске.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: и бросит всё это
  rationale: Глагол שלך означает «бросать». Выражение «всё это» естественно по-русски обозначает удаляемый зоб вместе с перьями, тогда как буквальное местоимение женского рода невозможно согласовать с русским словом «зоб».
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: рядом с жертвенником
  rationale: Предлог אצל указывает на расположение возле или сбоку от предмета; «рядом с жертвенником» точно и естественно передаёт пространственное значение.
- source_word: קֵדְמָה
  choice: с восточной стороны
  rationale: Направительное наречие указывает на восточную сторону жертвенника; выбранная формулировка ясна в описании места.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: в место для пепла
  rationale: В жертвенном контексте דשן обозначает снимаемый с жертвенника пепел, возможно с остатками жира. Перевод сохраняет конкретное назначение места, не вводя излишней детализации.
