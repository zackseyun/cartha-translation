  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: ru
  text: Если его приношение — всесожжение из крупного скота, пусть он принесёт самца без изъяна. Пусть приведёт его ко входу в шатёр встречи, чтобы он был принят перед Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по своей доброй воле перед Яхве». Еврейское выражение может указывать либо на благоприятное принятие, либо на добровольность приношения.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский жертвенный термин для приношения, целиком сжигаемого на жертвеннике; точно и без лишнего пояснения передаёт культовый смысл.
- source_word: קָרְבָנוֹ
  choice: его приношение
  rationale: קרבן обозначает то, что подносят Богу; «приношение» естественно для данного контекста и сохраняет связь с действием принесения.
- source_word: מִן הַבָּקָר
  choice: из крупного скота
  rationale: הבקר здесь обозначает крупный рогатый скот, в противопоставлении мелкому скоту далее в главе. Краткое «крупный скот» понятно и точно.
- source_word: זָכָר תָּמִים
  choice: самца без изъяна
  rationale: Передаёт как требование к полу животного, так и его жертвенную непорочность, то есть отсутствие физического дефекта.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: пусть он принесёт / пусть приведёт его
  rationale: В первом случае «принесёт» передаёт жертвенное представление; во втором «приведёт» естественно указывает на доставление живого животного ко входу и избегает тяжёлого повтора.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в шатёр встречи
  rationale: Передаёт место представления жертвы. «Шатёр встречи» сохраняет смысл назначенного места встречи, не подменяя его более поздней храмовой терминологией.
- source_word: לִרְצֹנוֹ
  choice: чтобы тот был принят
  rationale: В жертвенном контексте выражение вероятнее всего указывает на благоприятное принятие приношения или приносящего. Местоимение «тот» сохраняет референциальную неоднозначность между человеком и его приношением.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי означает «перед, в присутствии», а личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит тетраграмматон; «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение לִרְצֹנוֹ
  choice: чтобы тот был принят
  alternative: по своей доброй воле
  rationale: Главный текст передаёт вероятный культовый смысл благоприятного принятия, но не уточняет без достаточных оснований, принимается ли человек или приношение. Традиционное понимание как добровольности отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством культового наставления. Императивные формы с «пусть» передают еврейский предписывающий имперфект естественнее, чем канцелярское «должен». Терминология последовательна и доступна обычному читателю.
