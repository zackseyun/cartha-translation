  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: ru
  text: Если же он приносит Яхве всесожжение из птиц, то пусть он принесёт своё приношение из горлиц или молодых голубей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Условная частица вводит следующий случай в ряду предписаний, а «же» естественно передаёт связь с предыдущими стихами.
- source_word: מִן הָעוֹף
  choice: из птиц
  rationale: עוֹף здесь обозначает птиц как категорию жертвенных животных; современное русское выражение ясно и точно.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике; он передаёт культовую категорию, не сводя её к этимологии корня.
- source_word: קָרְבָּנוֹ
  choice: его приношение
  rationale: קָרְבָּן — то, что приносят Богу; «приношение» сохраняет широкий ритуальный смысл и естественно звучит в данном контексте.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל при обозначении адресата жертвы естественно передаётся русским дательным падежом; личное имя יהוה транслитерируется как «Яхве».
- source_word: וְהִקְרִיב
  choice: пусть он принесёт
  rationale: Хифиль глагола קרב означает поднести или представить жертву. Русская повелительная конструкция точно передаёт предписание, следующее из условия.
- source_word: מִן הַתֹּרִים אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: горлицу или молодого голубя
  rationale: Еврейские формы с מִן указывают на выбор из двух допустимых видов. В русском после глагола «принесёт» естественны винительный падеж и единственное число; בְּנֵי הַיּוֹנָה — устойчивое обозначение молодых голубей.
- source_word: אֶת קָרְבָּנוֹ
  choice: в приношение
  rationale: Повтор существительного в еврейском завершает и уточняет объект глагола; конструкция «принесёт в приношение» сохраняет этот смысл без тяжеловесного повтора «своё приношение».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного библейского термина «всесожжение». Синтаксис сделан ясным и нормативным; архаизмы и избыточная буквальность устранены.
