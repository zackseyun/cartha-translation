- from: Если же его приношение Яхве — всесожжение из птиц, пусть он принесёт в приношение горлицу или молодого голубя.
  to: Если же он приносит Яхве всесожжение из птиц, то пусть он принесёт своё приношение из горлиц или молодых голубей.
  rationale: Текст перестроен так, чтобы ясно передать, что приношение адресовано Яхве, сохранить условно-предписательный характер стиха и воспроизвести повтор «приношение» без неестественной русской тавтологии. Множественное число названий птиц приведено в соответствие с исходным текстом.
