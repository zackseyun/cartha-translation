  rationale: 'Уточнено только значение לוֹ: «в его пользу» яснее передаёт бенефициарное значение и избегает возможного причинного оттенка оборота «ради него». Синтаксис, ритуальная терминология и сохранённая в сноске неоднозначность пассивной формы оставлены без содержательных изменений.'
