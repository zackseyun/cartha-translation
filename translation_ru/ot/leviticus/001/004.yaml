  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: ru
  text: И возложит он руку на голову жертвы всесожжения, и она будет принята в его пользу, чтобы совершить за него искупление.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и он будет принят» — еврейскую пассивную форму можно понимать как относящуюся непосредственно к приносящему, а не к жертве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: И возложит
  rationale: В жертвенном контексте סמך обозначает ритуальное возложение руки на животное; «возложит» естественно и достойно передаёт действие, не уточняя чрезмерно силу нажима.
- source_word: יָדוֹ
  choice: он руку
  rationale: Сохранено единственное число еврейского текста; принадлежность руки субъекту однозначно выражена русской конструкцией.
- source_word: עַל רֹאשׁ
  choice: на голову
  rationale: Прямо и естественно передаёт физическое направление ритуального жеста.
- source_word: הָעֹלָה
  choice: жертвы всесожжения
  rationale: Устоявшийся русский эквивалент названия жертвы, полностью сжигаемой на жертвеннике; он яснее буквального этимологического варианта «жертва возношения».
- source_word: וְנִרְצָה
  choice: и она будет принята
  rationale: Нифаль от רצה передан пассивом; местоимение женского рода в русском указывает на «жертву», ближайший контекстуальный референт.
- source_word: לוֹ
  choice: ради него
  rationale: Передаёт значение пользы и благоприятного принятия в отношении приносящего, сохраняя отличие от последующего עָלָיו.
- source_word: לְכַפֵּר
  choice: чтобы совершить искупление
  rationale: Сохраняет ключевой культово-богословский смысл כפר, не закрепляя за словом какую-либо одну теорию искупления.
- source_word: עָלָיו
  choice: за него
  rationale: В сочетании с כפר предлог על обозначает лицо, в пользу которого совершается искупление; русский оборот краток и естественен.
theological_decisions:
- issue: Референт пассивного глагола וְנִרְצָה
  choice: Принятой считается жертва всесожжения
  alternative: Принят будет сам приносящий
  rationale: Ближайший контекстуальный референт — жертва всесожжения, и последовательность действий естественно описывает её принятие ради приносящего. При этом еврейская форма допускает соотнесение принятия непосредственно с человеком, поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет последовательность еврейского текста, но избегает неестественного повтора «для него… за него».
