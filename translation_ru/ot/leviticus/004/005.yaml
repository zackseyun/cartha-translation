id: LEV.4.5
reference: Leviticus 4:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: ru
  text: И помазанный священник возьмёт часть крови быка и внесёт её в шатёр встречи[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от крови быка». Вероятнее всего, еврейский предлог имеет здесь значение части целого: священник берёт часть крови.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к шатру встречи»; перевод «в шатёр» учитывает обрядовый контекст, поскольку последующие действия совершаются внутри святилища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: И ... возьмёт
  rationale: В последовательности обрядовых предписаний форма с וְ передаёт следующий обязательный шаг; русское будущее время естественно выражает это значение.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: помазанный священник
  rationale: Буквально передаёт обозначение священника по его помазанному статусу, не заменяя его толковательным титулом «первосвященник» и не привнося мессианского смысла.
- source_word: מִדַּם הַפָּר
  choice: часть крови быка
  rationale: 'Предлог מִן здесь, вероятнее всего, имеет партитивное значение: берётся не вся кровь, а некоторое её количество.'
- source_word: וְהֵבִיא אֹתוֹ
  choice: и внесёт её
  rationale: Местоименный суффикс относится к крови; глагол «внесёт» естественно передаёт доставление крови внутрь святилища, подразумеваемое дальнейшими действиями.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: в шатёр встречи
  rationale: אֶל буквально указывает направление («к»), однако последующий обряд совершается внутри; «в» сохраняет естественный русский язык и контекстуально подразумеваемое вхождение. «Шатёр встречи» прямо и понятно передаёт название אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Передача הַכֹּהֵן הַמָּשִׁיחַ
  choice: помазанный священник
  alternative: первосвященник; посвящённый священник
  rationale: Сохранено собственно лексическое значение «помазанный», без подмены толковательным наименованием должности и без внесения позднейших христологических ассоциаций.
translation_notes:
  register: Современный литературный русский язык с достоинством обрядового предписания. Синтаксис краткий и последовательный; терминология сохраняет конкретность еврейского текста.
