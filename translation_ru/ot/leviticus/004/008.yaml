base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: ru
  text: 'И пусть он отделит от него весь жир быка жертвы за грех: жир, покрывающий внутренности, и весь жир, находящийся на внутренностях.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быка очистительной жертвы». Еврейское слово חַטָּאת может обозначать как «грех», так и жертву, связанную с устранением греха или ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: весь
  rationale: 'Сохраняет полноту охвата: требуется отделить весь предписанный жировой слой.'
- source_word: חֵלֶב
  choice: жир
  rationale: Прямое и естественное обозначение жировых частей жертвенного животного; анатомические уточнения далее задают культовый контекст.
- source_word: פַּר הַחַטָּאת
  choice: быка жертвы за грех
  rationale: 'Естественно передаёт конструктивную связь: речь идёт о быке, предназначенном для данного вида жертвы.'
- source_word: יָרִים
  choice: пусть он отделит
  rationale: В контексте разделки жертвы глагол обозначает изъятие и отделение указанных частей; «отделит» точно передаёт ритуальное действие.
- source_word: מִמֶּנּוּ
  choice: от него
  rationale: Местоимение относится к быку; в русском языке при обозначении животного нормативно употребление формы мужского рода.
- source_word: הַמְכַסֶּה
  choice: покрывающий
  rationale: Причастие естественно передаёт атрибутивную функцию еврейской формы и расположение жира.
- source_word: קֶּרֶב
  choice: внутренности
  rationale: Понятное современному читателю анатомическое обозначение внутренних органов в жертвенном контексте.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: находящийся на внутренностях
  rationale: Сохраняет пространственное значение עַל и отличает этот жир от жира, покрывающего внутренности.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное и широко понятное выражение «жертва за грех» сохраняет связь термина с грехом; примечание указывает на возможный очистительный оттенок, не устраняя лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Формула «пусть он отделит» передаёт предписание без архаического «да отделит»; анатомические выражения конкретны и понятны.
