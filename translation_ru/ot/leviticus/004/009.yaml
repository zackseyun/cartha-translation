base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: ru
  text: Обе почки, жир, который на них и который находится у поясницы, и придаток на печени[a] — всё это он должен отделить вместе с почками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долю печени». Точное значение еврейского анатомического термина неясно; перевод «придаток» намеренно осторожен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: обе почки
  rationale: Передаёт конкретное указание на две почки естественным современным русским выражением.
- source_word: הַחֵלֶב
  choice: жир
  rationale: В контексте жертвоприношений обозначает предназначенные для сожжения жировые части; «жир» ясно и доступно, тогда как «тук» устарел.
- source_word: אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: жир на них у поясницы
  rationale: Сохраняет связь жира с почками и его расположение в области поясницы, не перегружая фразу буквальным повторением относительных оборотов.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: придаток на печени
  rationale: Осторожно передаёт не вполне определённый анатомический термин и сохраняет значение предлога עַל, не отождествляя эту часть уверенно с конкретной долей печени.
- source_word: עַל הַכְּלָיוֹת
  choice: вместе с почками
  rationale: В повторяющейся жертвенной формуле выражение указывает, что названную часть печени отделяют одновременно с почками; буквальное «на почках» создало бы в русском неверное представление о расположении.
- source_word: יְסִירֶנָּה
  choice: его следует отделить
  rationale: Передаёт предписывающую силу формы и её местоименный суффикс женского рода, согласующийся с יוֹתֶרֶת; «отделить» точно описывает снятие указанной части с туши.
