lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Естественно вводит альтернативный случай в продолжающемся своде жертвенных предписаний и сохраняет связь с предыдущим контекстом.
- source_word: כֶּבֶשׂ
  choice: ягнёнка
  rationale: В данном жертвенном контексте обозначает животное из овец; традиционное и понятное «ягнёнок» согласуется с последующим уточнением пола.
- source_word: יָבִיא
  choice: приносит
  rationale: Каузативная форма глагола בוא в жертвенном контексте означает «приносить»; русский глагол передаёт конкретное действие и его культовую функцию.
- source_word: קָרְבָּנוֹ
  choice: в жертву
  rationale: קָרְבָּן означает приношение, подносимое Богу. Оборот «приносит в жертву» естественен по-русски и передаёт значение существительного с притяжательным суффиксом без тяжеловесного повтора.
- source_word: לְחַטָּאת
  choice: за грех
  rationale: В данном контексте חַטָּאת обозначает установленный вид жертвы, связанный с устранением греха и осквернения. Формула «жертва за грех» традиционна и понятна, а альтернативный оттенок отмечен в сноске.
- source_word: נְקֵבָה
  choice: самку
  rationale: Прямо указывает пол животного; форма винительного падежа естественно зависит от «пусть принесёт».
- source_word: תְמִימָה
  choice: без порока
  rationale: В жертвенном законодательстве תמים описывает животное без физического изъяна; «без порока» — точная, краткая и устоявшаяся формулировка.
- source_word: יְבִיאֶנָּה
  choice: пусть принесёт
  rationale: Передаёт предписывающую силу формы и сохраняет повтор глагола из еврейского текста; объект выражен словом «самку».
theological_decisions:
- issue: Передача חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное название «жертва за грех» ясно связывает обряд с грехом, тогда как «очистительная жертва» подчёркивает его функцию устранения ритуального осквернения. Поскольку термин способен охватывать оба аспекта, основной текст сохраняет привычное название, а реальная смысловая альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой, подходящей для законодательного контекста. «Пусть принесёт» звучит естественнее архаичного «да принесёт» и сохраняет предписывающий характер текста.
