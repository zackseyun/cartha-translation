  text: как отделяют от быка мирной жертвы, и священник сожжёт их на жертвеннике всесожжения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Естественно вводит сопоставление с порядком жертвоприношения, описанным ранее.
- source_word: יוּרַם
  choice: снимают
  rationale: Глагол буквально связан с поднятием, но здесь обозначает снятие с животного жировых частей, перечисленных в предыдущем стихе.
- source_word: מִשּׁוֹר
  choice: с быка
  rationale: В данном жертвенном контексте שׁוֹר обозначает крупное рогатое животное мужского пола; «бык» ясно и естественно продолжает описание жертвенного животного.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: принесённого в жертву примирения
  rationale: Передаёт конструкцию «жертва шламим» естественным русским оборотом и сохраняет традиционную смысловую связь שְׁלָמִים с миром/примирением, не сводя её лишь к общению или трапезе.
- source_word: וְהִקְטִירָם
  choice: Священник сожжёт всё это
  rationale: Форма множественного числа отсылает к жировым частям предыдущего стиха; «всё это» устраняет неясный русский местоименный референт, не добавляя нового содержания.
- source_word: הַכֹּהֵן
  choice: Священник
  rationale: Стандартное обозначение служителя, совершающего обряд.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: на жертвеннике всесожжения
  rationale: Устоявшееся и точное русское обозначение жертвенника, связанного с жертвой всесожжения.
