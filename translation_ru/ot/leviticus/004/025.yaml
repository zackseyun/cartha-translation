  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: ru
  text: Затем священник возьмёт пальцем немного крови жертвы за грех[a] и нанесёт её на рога жертвенника всесожжения, а остальную кровь выльет у основания жертвенника всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительной жертвы». Еврейское слово может обозначать жертву, связанную как с удалением ритуальной нечистоты, так и с грехом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем … возьмёт
  rationale: Сочетание союза с глагольной формой продолжает последовательность обрядовых предписаний; «затем» естественно передаёт очередность действий по-русски.
- source_word: מִדַּם
  choice: немного крови
  rationale: 'Предлог מִן употреблён партитивно: священник берёт лишь часть крови. Формулировка «немного крови» естественна и не задаёт отсутствующего в тексте точного количества.'
- source_word: הַחַטָּאת
  choice: жертва за грех
  rationale: В данном обрядовом контексте слово обозначает жертвоприношение, связанное с грехом и очищением, а не абстрактный «грех». Традиционное и понятное русское соответствие — «жертва за грех».
- source_word: בְּאֶצְבָּעוֹ
  choice: пальцем
  rationale: 'Предлог בְּ указывает здесь на орудие действия: священник берёт и наносит кровь своим пальцем. Притяжательное значение ясно из подлежащего и по-русски не требует слова «своим».'
- source_word: וְנָתַן עַל
  choice: и нанесёт её на
  rationale: Буквально глагол означает «даст, поместит», но применительно к крови и поверхности жертвенника «нанесёт» точно и естественно описывает обрядовое действие.
- source_word: קַרְנֹת
  choice: рога
  rationale: Имеются в виду рогообразные выступы жертвенника; «рога» — точный и устойчивый библейский термин.
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник всесожжения
  rationale: Конструкция называет жертвенник, предназначенный для всесожжений; это ясное и принятое русское обозначение.
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: а остальную кровь выльет
  rationale: До этого часть крови уже взята для нанесения на рога, поэтому «остальную» явно передаёт подразумеваемый остаток. Противительный союз «а» естественно разграничивает два способа употребления крови.
- source_word: אֶל יְסוֹד
  choice: у основания
  rationale: יְסוֹד обозначает основание или нижнюю часть жертвенника. «У основания» естественно передаёт место, куда выливают кровь, не уточняя сверх еврейского текста точную поверхность.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Еврейское слово допускает акцент как на грехе, так и на очищении. Основной текст сохраняет традиционную и общепонятную категорию «жертва за грех», не закрепляя узкой теории искупления; альтернативный обрядовый акцент отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством обрядового предписания. Будущее совершенного вида передаёт нормативную последовательность действий без тяжеловесного повторения «должен»; терминология сохраняет узнаваемые библейские названия.
