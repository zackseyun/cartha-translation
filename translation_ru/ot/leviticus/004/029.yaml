    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: И пусть он возложит
  rationale: В контексте жертвоприношения סמך обозначает ритуальное возложение руки на животное. Конструкция «пусть…» естественно передаёт предписывающую силу формы в русском законодательном тексте.
- source_word: יָדוֹ
  choice: руку
  rationale: Еврейская форма стоит в единственном числе; оно сохранено без обобщения до множественного.
- source_word: עַל רֹאשׁ
  choice: на голову
  rationale: Прямой и естественный русский эквивалент, сохраняющий конкретность ритуального действия.
- source_word: הַחַטָּאת
  choice: жертвы за грех
  rationale: В данном контексте חטאת обозначает жертвенное животное или соответствующий вид жертвы. Традиционный русский термин понятен и не устраняет возможный оттенок очищения, который отмечен в сноске.
- source_word: וְשָׁחַט
  choice: и заколет
  rationale: «Заколоть» — обычный русский библейско-ритуальный глагол для умерщвления жертвенного животного; он точнее нейтрального «убить» и естественнее технического «зарезать» в данном регистре.
- source_word: בִּמְקוֹם
  choice: там, где закалывают
  rationale: Буквально выражение означает «на месте». Развёрнутая русская формулировка ясно показывает, что речь идёт о месте совершения всесожжения, а не о замене одной жертвы другой.
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: «Всесожжение» — устоявшийся и точный русский термин для עֹלָה; в составе фразы добавлено «жертву» для естественности и ясности.
theological_decisions:
- issue: Передача חטאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Слово имеет здесь техническое значение названия жертвы, связанной с грехом и очищением. Основной текст сохраняет знакомое обозначение «жертва за грех», а сноска сообщает существенную лексическую альтернативу, не разрешая однозначно смысловое напряжение.
- issue: Передача предписывающей последовательности еврейских глагольных форм
  choice: пусть он возложит… и заколет
  alternative: он возложит… и заколет
  rationale: Форма с «пусть» ясно и естественно передаёт ритуальное предписание в современном русском языке, не превращая его в рассказ о прошлом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным регистром. Сохранены технические жертвенные термины «жертва за грех» и «всесожжение»; синтаксис оформлен как ясное ритуальное предписание.
