base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: ru
  text: Священник обмакнёт палец в кровь и семь раз покропит кровью перед Яхве[a], по направлению к передней стороне завесы святилища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед Яхве — переднюю сторону завесы святилища». Или: «перед завесой Святого места».'
    reason: Еврейское אֶת־פְּנֵי («переднюю сторону, лицевую сторону») уточняет направление кропления; הַקֹּדֶשׁ может пониматься как «святилище» или «Святое место».
lexical_decisions:
- source_word: וְטָבַל
  choice: обмакнёт
  rationale: Форма продолжает последовательность предписанных обрядовых действий. «Обмакнёт» естественно передаёт погружение пальца в кровь.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Определённое существительное в единственном числе обозначает священника, совершающего обряд.
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: палец в кровь
  rationale: Суффикс указывает на палец священника; предлог ב обозначает вещество, в которое его обмакивают. В русском принадлежность ясна из подлежащего и не требует местоимения «свой».
- source_word: וְהִזָּה מִן־הַדָּם
  choice: покропит кровью
  rationale: В священническом обрядовом контексте נזה в породе hифиль означает ритуальное кропление, а מן указывает на кровь, часть которой используется. Творительный падеж даёт естественную русскую формулировку.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямое и естественное соответствие числовому обстоятельству.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי выражает пространственную и культовую направленность действия перед Богом; личное имя יהוה передано как «Яхве».
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: перед завесой святилища
  rationale: Выражение с פְּנֵי указывает на лицевую сторону или пространство перед предметом. «Завеса святилища» ясно и без излишней технической детализации передаёт культовый объект и связанную с ним святую область.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение и синтаксическая связь פָּרֹכֶת הַקֹּדֶשׁ
  choice: завеса святилища
  alternative: завеса Святого места; священная завеса
  rationale: Сочетание может обозначать завесу, относящуюся к святой части святилища. Основной перевод сохраняет пространственно-культовый смысл, не навязывая более узкую архитектурную классификацию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным обрядовым регистром. Будущее совершенного вида естественно передаёт последовательность предписаний; термин «покропит» сохраняет привычный культовый оттенок и остаётся понятным современному читателю.
