base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: ru
  text: И когда станет известен грех, который они совершили[a], собрание должно представить быка из стада в жертву за грех и привести его перед шатёр собрания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское חַטָּאת (хатта́т) употреблено в этом стихе дважды: сначала в значении «грех», затем — «жертва за грех».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: и когда станет известен
  rationale: Нифаль глагола ידע передаёт наступление известности без указания того, кто обнаружил грех; условно-временная связь с последующим предписанием естественно выражена через «когда».
- source_word: הַחַטָּאת
  choice: грех
  rationale: Относительное предложение «который они совершили» требует здесь значения совершённого греха, а не жертвы.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: который они совершили
  rationale: Это естественное русское сочетание сохраняет отнесённость к конкретному проступку; предлог עַל в данной конструкции отдельно не воспроизводится.
- source_word: הַקָּהָל
  choice: собрание
  rationale: Передаёт корпоративный субъект в культово-правовом контексте и не вносит специфически церковного оттенка.
- source_word: וְהִקְרִיבוּ
  choice: пусть представит
  rationale: Каузатив от קרב в жертвенном контексте означает представить или поднести предназначенное для жертвы; «представит» позволяет отличить этот глагол от последующего «приведёт».
- source_word: פַּר בֶּן בָּקָר
  choice: быка из крупного скота
  rationale: Идиоматично передаёт быка как животное из стада крупного рогатого скота, не превращая буквальное «сына стада» в неестественную русскую формулу.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Здесь חטאת обозначает установленный вид жертвы; формула ясна современному читателю и сохраняет связь с грехом.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: и приведёт его
  rationale: Глагол בוא в хифиле означает привести или доставить; местоимение однозначно относится к быку.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: к шатру встречи
  rationale: Передаёт культовое место назначения естественно по-русски; «шатёр встречи» ближе к составу еврейского выражения, чем традиционно-интерпретирующее «скиния собрания».
theological_decisions:
- issue: Два значения חַטָּאת в одном стихе
  choice: Первое употребление переведено как «грех», второе — как «жертва за грех».
  alternative: Передать оба употребления одинаково либо назвать вторую жертву «очистительной жертвой».
  rationale: Контекст различает совершённый проступок и предписанную жертву, сохраняя при этом лексическую связь между ними; более специальное «очистительная жертва» могло бы преждевременно снять смысловую напряжённость термина.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным предписывающим тоном. Начальное «и» сохранено как связь с предыдущим условным контекстом. Термин «шатёр встречи» выбран вместо более традиционного, но менее буквального «скиния собрания».
