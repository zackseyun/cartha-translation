base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: ru
  text: И возложит он руку на голову козла, и заколет его на том месте, где закалывают всесожжение пред Яхве. Это жертва за грех.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это очистительная жертва». Еврейское слово חַטָּאת может обозначать как «грех», так и жертву, связанную с очищением от греха или ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: И возложит он руку
  rationale: Оборот סמך יד в жертвенном контексте обозначает установленное ритуальное возложение руки; единственное число יָדוֹ сохранено.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: на голову козла
  rationale: שָׂעִיר здесь означает козла, предназначенного для жертвоприношения; формулировка естественна и точно передаёт конструкцию.
- source_word: וְשָׁחַט אֹתוֹ
  choice: и заколет его
  rationale: Глагол שׁחט обозначает ритуальный забой; «заколет» сохраняет жертвенный контекст и возвышенный законодательный регистр.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: на том месте, где закалывают
  rationale: Безлично-личная форма по-русски естественно передаёт неопределённого деятеля активной еврейской конструкции.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Традиционный и понятный русский термин для жертвы עֹלָה, полностью сжигаемой на жертвеннике.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» передаёт пространственно-культовое значение לִפְנֵי, а личное имя Яхве прямо представляет тетраграмматон.
- source_word: חַטָּאת הוּא
  choice: Это жертва за грех
  rationale: Предикативная конструкция классифицирует животное как חַטָּאת; основной вариант сохраняет устоявшееся культовое обозначение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует консультационному слою.
- issue: Культовое значение חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может обозначать как грех, так и связанную с устранением греха или нечистоты жертву. Устоявшийся вариант помещён в основной текст, а существенная смысловая альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством законодательного культового текста. Синтаксис близок к еврейскому, но не перегружен буквализмами; сохранены единственное число «руку» и активное «где закалывают».
