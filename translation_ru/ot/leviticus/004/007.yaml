  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: ru
  text: И священник нанесёт часть крови на роги жертвенника благовонных курений, стоящего перед Яхве в шатре встречи, а всю кровь быка[a] выльет у основания жертвенника всесожжения, который находится у входа в шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всю кровь быка». По ходу обряда имеется в виду вся кровь, оставшаяся после того, как часть её была нанесена на роги жертвенника.'
    reason: Сохранить буквальную формулировку оригинала в основном тексте и пояснить подразумеваемый контекстом смысл.
lexical_decisions:
- source_word: וְנָתַן
  choice: нанесёт
  rationale: В данном обрядовом контексте נתן обозначает нанесение крови на роги жертвенника; «нанесёт» естественно передаёт конкретное действие, не уточняя его способ.
- source_word: מִן הַדָּם
  choice: часть крови
  rationale: 'Предлог מן употреблён партитивно: священник берёт не всю кровь, а некоторую её часть.'
- source_word: קַרְנוֹת
  choice: роги
  rationale: Сохраняется традиционное и точное обозначение выступов по углам жертвенника.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: жертвенник благовонных курений
  rationale: סמים указывает на ароматические вещества; формулировка сохраняет описательный смысл всей еврейской конструкции.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Передаёт пространственно-богослужебный смысл выражения и сохраняет личное имя Бога.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Современный понятный перевод устойчивого названия места встречи Яхве с Израилем.
- source_word: כָּל דַּם הַפָּר
  choice: всю кровь быка
  rationale: Формально сохраняет כָּל без добавления отсутствующего в оригинале слова «оставшуюся»; контекстуальный смысл пояснён в сноске.
- source_word: יִשְׁפֹּךְ אֶל יְסוֹד
  choice: выльет к основанию
  rationale: שפך означает «выливать», а אל сохраняет направленность действия к основанию жертвенника.
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник всесожжения
  rationale: Устоявшееся точное обозначение жертвенника, на котором приносили жертвы, сжигавшиеся целиком.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה; форма «Яхве» передаёт его как имя, а не заменяет титулом.
- issue: Значение כָּל דַּם הַפָּר после использования части крови
  choice: всю кровь быка
  alternative: всю оставшуюся кровь быка
  rationale: Перевод следует явной формулировке оригинала и сохраняет её напряжение с предшествующим упоминанием части крови; подразумеваемый остаток поясняется сноской, а не вводится в основной текст.
- issue: Связь אֲשֶׁר בְּאֹהֶל מוֹעֵד
  choice: стоящего перед Яхве в шатре встречи
  alternative: который находится в шатре встречи, перед Яхве
  rationale: Относительное предложение относится к жертвеннику курений; русская перестройка делает эту связь ясной, сохраняя пространственное указание «перед Яхве».
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для обрядового предписания. Будущее совершенного вида передаёт предписывающую последовательность действий без тяжеловесного многократного «должен». Термины «роги», «жертвенник», «всесожжение» сохраняют узнаваемую библейскую лексику; «шатёр встречи» выбран вместо архаичного «скиния собрания».
