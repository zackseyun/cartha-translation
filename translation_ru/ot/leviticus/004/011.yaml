  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: ru
  text: А шкуру[a] быка[b] и всё его мясо вместе с головой, ногами, внутренностями[c] и помётом —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кожу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бычка».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «внутренними частями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: шкуру
  rationale: В контексте разделанного жертвенного животного «шкура» звучит естественнее, чем более общее «кожа», и точно передаёт значение еврейского слова.
- source_word: הַפָּר
  choice: быка
  rationale: Пַר обозначает быка или молодого быка; нейтральное «бык» соответствует контексту, не добавляя невыраженного акцента на возрасте.
- source_word: כָּל בְּשָׂרוֹ
  choice: всё его мясо
  rationale: Здесь בָּשָׂר обозначает плоть животного; в русском описании разделки «мясо» естественно и конкретно, тогда как «плоть» звучала бы архаично.
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: вместе с головой, ногами
  rationale: В перечислении עַל указывает на включение этих частей в совокупность; «вместе с» естественно передаёт эту функцию. כְּרָעַיִם здесь обозначает ноги животного.
- source_word: וְקִרְבּוֹ
  choice: внутренностями
  rationale: В жертвенном контексте קֶרֶב обозначает внутренние органы или внутренние части животного; «внутренности» ясно и конкретно передаёт смысл.
- source_word: וּפִרְשׁוֹ
  choice: помётом
  rationale: Пֶרֶשׁ обозначает экскременты животного. «Помёт» точно и приемлемо для современного литературного русского языка, не смешивая их с внутренностями.
