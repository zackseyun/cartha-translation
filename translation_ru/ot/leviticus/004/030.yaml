  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: ru
  text: И священник возьмёт пальцем часть её крови[a] и нанесёт её на рога жертвенника всесожжения[b], а всю её кровь[c] выльет у основания жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из её крови»; вероятно, имеется в виду часть крови.'
    reason: lexical_alternative
  - marker: b
    text: Рога — рогообразные выступы по углам жертвенника.
    reason: cultural_note
  - marker: c
    text: После того как часть крови была нанесена на рога, под «всей её кровью» здесь подразумевается вся оставшаяся кровь.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: И … возьмёт
  rationale: В контексте предписания форма обозначает очередное ритуальное действие; русский совершенный вид в будущем времени естественно передаёт инструкцию.
- source_word: מִדָּמָהּ
  choice: немного её крови
  rationale: 'Предлог מִן здесь имеет партитивное значение: священник берёт часть крови, а не всю кровь.'
- source_word: בְּאֶצְבָּעוֹ
  choice: пальцем
  rationale: Инструментальное בְּ указывает на средство совершения действия; краткая русская форма звучит естественно.
- source_word: וְנָתַן
  choice: нанесёт её
  rationale: נתן буквально означает «дать, положить», но применительно к крови на поверхности жертвенника естественное и точное русское выражение — «нанести»; местоимение проясняет объект без изменения смысла.
- source_word: קַרְנֹת מִזְבַּח הָעֹלָה
  choice: рога жертвенника всесожжения
  rationale: Сохранён конкретный культовый термин «рога» и конструкция, обозначающая жертвенник, предназначенный для всесожжений.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: а всю её кровь
  rationale: Сохранено буквальное כָּל — «всю», хотя по последовательности действий имеется в виду кровь, оставшаяся после нанесения части на рога.
- source_word: יִשְׁפֹּךְ
  choice: выльет
  rationale: שׁפך в жертвенном контексте означает вылить кровь; совершенный вид соответствует последовательности предписанных действий.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: к основанию жертвенника
  rationale: יְסוֹד означает основание или нижнюю часть; предлог אֶל передан как направленность действия — «к основанию».
theological_decisions:
- issue: Вид и временная форма ритуального предписания
  choice: 'Последовательность передана будущим временем совершенного вида: «возьмёт… нанесёт… выльет».'
  alternative: 'Историческое повествование в прошедшем времени: «взял… нанёс… вылил».'
  rationale: Контекст главы представляет нормативную жертвенную процедуру, а не описание единичного прошлого события.
- issue: Название выступов жертвенника
  choice: Сохранено буквальное культовое обозначение «рога».
  alternative: Передать функционально как «углы» или «выступы».
  rationale: Слово קֶרֶן обозначает характерные рогообразные выступы; буквальный термин сохраняет образ и не навязывает толкования.
- issue: Соотношение части крови и «всей крови»
  choice: В основном тексте сохранено «всю её кровь», а подразумеваемый остаток разъяснён в сноске.
  alternative: Сразу перевести «всю оставшуюся кровь».
  rationale: Так сохраняется формулировка оригинала и одновременно устраняется возможное практическое недоумение без скрытого уточнения текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены традиционные и понятные культовые термины «священник», «жертвенник», «всесожжение» и «рога»; синтаксис сделан ясным и последовательным.
