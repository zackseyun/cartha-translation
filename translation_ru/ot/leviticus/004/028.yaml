reference: Leviticus 4:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: ru
  text: Или, если ему станет известен грех, который он совершил[a], пусть он принесёт в жертву за совершённый им грех козу без порока.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если ему сообщат о совершённом им грехе». Еврейская пассивная форма может означать как то, что человек сам узнаёт или осознаёт свой грех, так и то, что ему сообщают о нём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Или, если
  rationale: «Или» вводит иной случай в последовательности постановлений, а «если» естественно передаёт условный смысл этой правовой формулировки по-русски.
- source_word: הוֹדַע אֵלָיו
  choice: ему станет известен
  rationale: 'Хофаль от ידע имеет пассивное значение: грех доводится до сведения человека или становится ему известен. Формулировка сохраняет неопределённость между личным осознанием и сообщением извне.'
- source_word: חַטָּאתוֹ ... אֲשֶׁר חָטָא
  choice: грех, который он совершил
  rationale: Здесь חטאת означает совершённый грех, а не жертву; сочетание с חטא естественно передаётся современным русским оборотом «совершить грех».
- source_word: וְהֵבִיא קָרְבָּנוֹ
  choice: пусть он принесёт в жертву
  rationale: В правовом предписании וְהֵבִיא выражает требуемое последующее действие. «Пусть принесёт» сохраняет предписывающую силу, а «в жертву» естественно передаёт функцию קָרְבָּנוֹ.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: козу
  rationale: Конструкция обозначает животное женского пола; русское «коза» уже прямо выражает и вид, и пол, поэтому дополнительное «самку» было бы избыточным.
- source_word: תְּמִימָה
  choice: без порока
  rationale: Устойчивое и понятное обозначение жертвенного животного без физического изъяна.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: за совершённый им грех
  rationale: עַל указывает, в связи с каким грехом приносится жертва. «За» естественно для русского жертвенного контекста и не превращает חטאת в название жертвы.
theological_decisions:
- issue: Значение חַטָּאת в обоих случаях
  choice: грех
  alternative: жертва за грех / очистительная жертва
  rationale: В этом стихе сама жертва уже обозначена словом קָרְבָּנוֹ и уточнена как коза; оба употребления חַטָּאתוֹ относятся к проступку, из-за которого её приносят.
- issue: Способ, которым грех становится известен человеку
  choice: сохранить неопределённость пассивной формы
  alternative: он осознает свой грех / ему сообщат о его грехе
  rationale: Еврейская форма допускает как личное обнаружение, так и сообщение извне; основной текст не должен выбирать только один вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном правового текста. Синтаксис сделан ясным для обычного читателя; сохранены повтор «греха» и неопределённость пассивной формы исходного текста.
