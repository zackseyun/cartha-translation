base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: ru
  text: Пусть он вынесет всего быка за пределы стана, на чистое место[a], к месту высыпания пепла[b], и сожжёт его на дровах в огне; на месте высыпания пепла он должен быть сожжён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть место, чистое в обрядовом смысле.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к месту высыпания пепла»; имеется в виду отведённое место, куда относили пепел с жертвенника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: пусть он вынесет
  rationale: Порода hифиль глагола יצא выражает вынесение наружу. Конструкция с «пусть» естественно передаёт предписание закона и сохраняет подразумеваемого исполнителя.
- source_word: כָּל הַפָּר
  choice: всего быка
  rationale: כָּל при определённом существительном подчёркивает, что вынести следует животное целиком, а не отдельные части.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Фраза обозначает место вне границ стана; этот вариант ясен, точен и соответствует возвышенному повествовательному регистру.
- source_word: מָקוֹם טָהוֹר
  choice: чистое место
  rationale: טָהוֹר может означать ритуальную чистоту, однако добавлять это уточнение прямо в текст необязательно; культовый оттенок отмечен в сноске.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: туда, куда высыпают пепел
  rationale: Описательный перевод передаёт буквальный образ места высыпания и указывает на предназначенный для пепла участок, не создавая современного бытового образа мусорной свалки.
- source_word: וְשָׂרַף אֹתוֹ
  choice: и сожжёт его
  rationale: שׂרף означает «сжигать»; будущее время после «пусть он вынесет» естественно продолжает единое предписание.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: в огне на дровах
  rationale: Перевод сохраняет оба элемента еврейского выражения — огонь и древесное топливо — в естественном для русского языка порядке.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: там, куда высыпают пепел, он должен быть сожжён
  rationale: Пассивная конструкция и повтор места сохранены как часть юридического акцента исходного текста.
theological_decisions:
- issue: Оттенок ритуальной чистоты в טָהוֹר
  choice: чистое место
  alternative: ритуально чистое место
  rationale: В контексте Левита речь, вероятно, идёт о культовой чистоте, но исходное слово само по себе не содержит отдельного термина «ритуально». Поэтому основной текст сохраняет краткость оригинала, а значение разъясняется в сноске.
- issue: Характер места שֶׁפֶךְ הַדֶּשֶׁן
  choice: место, куда высыпают пепел
  alternative: пепелище / место для пепла
  rationale: Исходная фраза указывает на предназначенное место высыпания пепла. Описательный перевод сохраняет эту конкретику и не предполагает сверх текста ни яму, ни кучу, ни обычную свалку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром законодательного текста. «Стан» сохранён как понятный библейский термин; синтаксис сделан естественным для русского языка, при этом повтор места высыпания пепла и пассивная форма заключительной части сохранены.
