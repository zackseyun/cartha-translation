base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: ru
  text: Пусть он вынесет быка за пределы стана и сожжёт его, как сжёг первого быка. Это жертва за грех[a] собрания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительная жертва». Еврейское слово может подчёркивать очистительную функцию этого приношения, а не только его связь с грехом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Пусть он вынесет
  rationale: Каузативная форма глагола יצא означает «вывести, вынести». В данном контексте речь идёт о перемещении туши быка за стан.
- source_word: הַפָּר
  choice: быка
  rationale: Слово פַּר обозначает быка или молодого быка; краткое «быка» точно и естественно в данном жертвенном контексте.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Сочетание предлогов выражает движение в место вне границ стана. Такой перевод естественно передаёт и направление, и местонахождение.
- source_word: וְשָׂרַף אֹתוֹ
  choice: и сожжёт его
  rationale: Глагол שׂרף имеет обычное значение «сжигать»; форма будущего времени с побудительным оттенком продолжает предписание.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: как сжёг
  rationale: כַּאֲשֶׁר вводит прямое сравнение с ранее описанным действием.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: первого быка
  rationale: רִאשׁוֹן указывает на быка из ранее описанного случая; буквальное «первого» сохраняет связь с предшествующим текстом.
- source_word: חַטַּאת
  choice: жертва за грех
  rationale: В жертвенном законодательстве חַטָּאת обозначает не отвлечённый грех, а приношение, связанное с устранением вины и/или ритуального осквернения. «Жертва за грех» — понятный и укоренившийся русский эквивалент.
- source_word: הַקָּהָל
  choice: всего собрания
  rationale: קָהָל обозначает собранную общину Израиля. «Собрание» сохраняет коллективный смысл, а «всего» естественно выражает принадлежность жертвы общине в целом.
- source_word: הוּא
  choice: Это
  rationale: 'Местоимение образует именное отождествляющее предложение: данный бык является жертвой за грех собрания.'
theological_decisions:
- issue: Передача חַטַּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может подчёркивать как связь с грехом, так и очистительное действие обряда. Основной перевод сохраняет традиционную и понятную формулировку, а допустимый смысловой вариант указан в сноске без устранения лексической многозначности.
- issue: Отнесение הוּא к жертвенному быку
  choice: Это жертва за грех всего собрания
  alternative: Он — жертва за грех собрания
  rationale: Еврейское местоимение предикативно определяет быка как жертву. Русское «это» естественно отождествляет описанное приношение с жертвой собрания и не вводит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой Пятикнижия. Слово «стан» сохранено как узнаваемое и точное обозначение лагеря Израиля; синтаксис сделан ясным для современного читателя.
