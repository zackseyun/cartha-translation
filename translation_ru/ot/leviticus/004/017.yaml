base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: ru
  text: Затем священник обмакнёт палец в кровь и семь раз покропит кровью перед Яхве, перед завесой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед завесой». Еврейское слово обозначает завесу святилища, отделявшую священное пространство.'
    reason: Передаёт лексическую альтернативу и поясняет культовое значение פָּרֹכֶת без излишней конкретизации.
lexical_decisions:
- source_word: וְטָבַל
  choice: Затем ... обмакнёт
  rationale: Глагол טבל означает «обмакивать, погружать». Форма продолжает последовательность обрядовых действий; «затем» естественно передаёт эту связь по-русски.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Стандартное соответствие для כהן в законодательстве о жертвоприношениях; определённость ясна из контекста.
- source_word: אֶצְבָּעוֹ
  choice: палец
  rationale: Буквально «свой/его палец»; русская конструкция с подлежащим «священник» позволяет естественно опустить притяжательное местоимение без потери смысла.
- source_word: מִן הַדָּם
  choice: в кровь
  rationale: После «обмакнуть» русское управление требует «в кровь». Еврейский предлог מן здесь указывает на кровь как на вещество, из которого берётся некоторое количество, но по-русски выражение «в часть крови» было бы неестественным.
- source_word: וְהִזָּה
  choice: покропит кровью
  rationale: В священническом обрядовом контексте נזה обозначает кропление жидкостью. Творительный падеж естественно восполняет подразумеваемый объект — кровь на пальце.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямое и естественное соответствие числительному и существительному.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Кратко передаёт значение «перед, в присутствии». Личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: перед завесой
  rationale: Фраза буквально указывает на лицевую сторону или пространство перед внутренней завесой святилища. «Перед завесой» естественно и сохраняет пространственную направленность.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Передача פָּרֹכֶת
  choice: завеса
  alternative: занавес
  rationale: «Завеса» остаётся понятным современному читателю и обозначает культовую перегородку святилища; «занавес» звучит менее уместно в данном торжественно-обрядовом контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной обрядовой лексикой. Будущее совершенного вида передаёт предписывающую последовательность действий; архаизм «пред» сохранён только в устойчивом сакральном сочетании «пред Яхве».
