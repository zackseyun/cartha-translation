base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: ru
  text: И пусть он возложит руку на голову жертвы за грех[a] и заколет её как жертву за грех на том месте, где закалывают жертву всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительной жертвы»; так можно перевести оба употребления выражения «жертва за грех» в этом стихе. Еврейское слово может обозначать жертву, связанную с устранением греха и ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: и пусть он возложит руку
  rationale: Глагол סמך в жертвенном контексте обозначает ритуальное возложение руки на животное; единственное число יָדוֹ сохранено.
- source_word: עַל רֹאשׁ הַחַטָּאת
  choice: на голову жертвы за грех
  rationale: Передаёт конкретное ритуальное действие и сохраняет традиционно понятное обозначение жертвы חטאת.
- source_word: וְשָׁחַט אֹתָהּ
  choice: и заколет её
  rationale: «Заколоть» естественно передаёт технический глагол שׁחט о ритуальном умерщвлении животного; женский род местоимения соотнесён со словом «жертва».
- source_word: לְחַטָּאת
  choice: как жертву за грех
  rationale: Предлог לְ указывает здесь на назначение животного; «как» ясно выражает его жертвенный статус.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: на том месте, где закалывают
  rationale: Безлично-личная форма по-русски естественно передаёт обычное предписанное действие, не вводя неопределённого конкретного исполнителя.
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: Устоявшийся русский термин для עֹלָה в законодательстве о жертвоприношениях.
theological_decisions:
- issue: Значение חטאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное выражение «жертва за грех» понятно читателю и соответствует связи термина с грехом; при этом возможный очистительный оттенок не исключён и указан в сноске.
translation_notes:
  register: Современный литературный русский с ясной формой законодательного предписания. Сохранено единственное число «руку»; ритуальная терминология передана традиционными, но понятными выражениями.
