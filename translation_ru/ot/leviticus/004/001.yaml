  yaml_path: translation/ot/leviticus/004/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH); имя также передают как «Иегова».
    reason: Указание формы тетраграмматона и традиционного варианта передачи имени.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в формуле введения божественной речи естественно передаётся по-русски глаголом «сказал»; союз וַ вводит новый речевой эпизод и передан союзом «и».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан распространённой научной транслитерацией личного имени Бога, а не заменён титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Предлог אֶל обозначает адресата речи; в современном русском это естественно выражается дательным падежом.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «говоря» вводит содержание последующей речи. В современном русском его функцию естественнее передаёт двоеточие, без тяжеловесного буквального оборота.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте стоит личное имя Бога. Форма «Яхве» сохраняет его как имя и соответствует наиболее принятой реконструкции произношения; подстановка титула устранила бы различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык. Формульность оригинала сохранена начальным «И», но לֵאמֹר передано пунктуационно, поскольку буквальное «говоря» здесь неестественно. Маркер сноски поставлен после имени адресата в соответствии с предоставленным консультационным текстом, хотя содержание сноски относится к имени «Яхве».
