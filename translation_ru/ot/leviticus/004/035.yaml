base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: ru
  text: Он отделит все её жирные части, как отделяют жир ягнёнка из мирной жертвы, и священник сожжёт их на жертвеннике поверх жертв, сжигаемых для Яхве[a]. Так священник совершит за него искупление его греха, который тот совершил, и ему будет прощено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жертв Яхве, приносимых огнём». Это специальный жертвенный термин; его также можно передать: «пища Яхве, приносимая в огне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חֶלְבָּהּ / חֵלֶב
  choice: все её жирные части / жир
  rationale: חֵלֶב обозначает предназначенный для жертвенника животный жир. Во множественном числе «жирные части» естественно передаёт совокупность отделяемых кусков и согласуется с последующим еврейским местоимением אֹתָם «их».
- source_word: יָסִיר / יוּסַר
  choice: отделит / отделяют
  rationale: В данном обрядовом контексте формы סור означают удаление жира с туши; русское «отделить» точно и естественно описывает действие.
- source_word: הַכֶּשֶׂב
  choice: ягнёнка
  rationale: В жертвенном контексте כֶּשֶׂב указывает на животное из мелкого рогатого скота, здесь естественно — ягнёнка.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: мирной жертвы
  rationale: «Мирная жертва» — понятное и укоренившееся русское название данной категории жертв, сохраняющее связь שְׁלָמִים с миром и благополучием.
- source_word: וְהִקְטִיר
  choice: сожжёт
  rationale: В жертвенной терминологии глагол означает возжигание на жертвеннике с превращением в дым; «сожжёт» ясно передаёт действие в данном контексте.
- source_word: אֹתָם
  choice: их
  rationale: Передано множественным числом в соответствии с еврейской формой; местоимение относится к перечисленным жирным частям.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: поверх огненных жертв Яхве
  rationale: עַל сохраняет пространственный оттенок «поверх», а אִשֵּׁי передано как техническое обозначение жертв, возжигаемых на огне. Имя יהוה транслитерировано как «Яхве».
- source_word: וְכִפֶּר עָלָיו
  choice: совершит за него искупление
  rationale: Формулировка сохраняет широкий обрядово-богословский смысл כפר, не сводя его к одной теории искупления.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: за грех, который тот совершил
  rationale: Передаёт объект искупления и еврейское повторение корня חטא без неестественного русского тавтологического оборота.
- source_word: וְנִסְלַח לוֹ
  choice: и ему будет прощено
  rationale: Безличная русская конструкция близка еврейскому выражению и сохраняет некоторую неопределённость относительно грамматически невыраженного предмета прощения.
theological_decisions:
- issue: Значение священнического искупления
  choice: совершит за него искупление
  alternative: очистит его от вины
  rationale: Основной вариант сохраняет традиционную широту כפר и не навязывает узкое объяснение механизма обряда.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация передаёт личное заветное имя, присутствующее в исходном еврейском тексте, а не заменяет его титулом.
- issue: Предмет прощения в וְנִסְלַח לוֹ
  choice: ему будет прощено
  alternative: он будет прощён
  rationale: 'Выбранная конструкция сохраняет лаконичность и синтаксическую неопределённость исходного выражения: текст сообщает о дарованном человеку прощении, не уточняя здесь его предмет отдельным существительным.'
