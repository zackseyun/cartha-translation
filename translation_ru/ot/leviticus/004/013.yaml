source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: ru
  text: Если же всё общество Израиля согрешит по ошибке[a], и дело останется скрытым от глаз собрания[b], и они совершат что-либо из того, что Яхве повелел не делать, то они станут виновны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согрешит ненамеренно». Речь идёт о грехе, совершённом по заблуждению или недосмотру, а не о сознательном неповиновении.'
    reason: lexical_alternative
  - marker: b
    text: «Останется скрытым от глаз собрания» — еврейский оборот со значением «останется незамеченным собранием».
    reason: cultural_note
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: общество Израиля
  rationale: עֵדָה обозначает общину как единое сообщество; «общество Израиля» естественно в современном русском и позволяет отличить это слово от הַקָּהָל — «собрание».
- source_word: יִשְׁגּוּ
  choice: согрешит по ошибке
  rationale: В контексте жертвенного законодательства שׁגה указывает на ненамеренное нарушение, совершённое по заблуждению или недосмотру, а не на сознательный мятеж.
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: дело останется скрытым от глаз собрания
  rationale: Перевод сохраняет пассивную форму и еврейский образ глаз как восприятия; смысл идиомы поясняется в сноске.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: они сделают что-либо из того, чего, согласно заповедям Яхве, делать не следует
  rationale: Фраза передаёт совершение одного из запрещённых действий и сохраняет связь запрета с заповедями Яхве, не создавая неестественной русской конструкции «сделают одну из заповедей».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וְאָשֵׁמוּ
  choice: они станут виновны
  rationale: Глагол выражает наступившее вследствие нарушения состояние виновности; перевод не добавляет значения искупления или наказания.
theological_decisions:
- issue: Характер греха, обозначенного שׁגה
  choice: согрешит по ошибке
  alternative: заблудится; согрешит ненамеренно
  rationale: Контекст Левита 4 касается проступков по ошибке. Формулировка сохраняет ненамеренный характер нарушения, не подразумевая сознательного неповиновения.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Коллективная виновность общины
  choice: они станут виновны
  alternative: она станет виновна
  rationale: Еврейский текст после коллективных существительных употребляет множественное число. Русское «они» сохраняет взгляд на общину как на совокупность её членов, не уточняя сверх текста механизм вменения вины.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Сохранено различие между עֵדָה («общество») и קָהָל («собрание»), а также образное выражение «от глаз». Синтаксис упрощён настолько, чтобы длинное условное предложение оставалось ясным без устранения исходной последовательности условий и результата.
