source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: ru
  text: И весь его жир он сожжёт на жертвеннике, как жир мирной жертвы[a]. Священник совершит для него искупление за его грех[b], и он будет прощён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «мирная жертва», может также обозначать жертву общения или благополучия.
    reason: lexical_alternative
  - marker: b
    text: Еврейское חַטָּאת может означать как «грех», так и «жертва за грех»; здесь, вероятнее всего, имеется в виду грех человека.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: его жир
  rationale: חֵלֶב обозначает предназначенные для сожжения жировые части жертвенного животного; местоименный суффикс передан словом «его».
- source_word: יַקְטִיר
  choice: сожжёт
  rationale: В породе хифиль глагол קטר в жертвенном контексте означает сжечь на жертвеннике, вознося дым; «сожжёт» естественно передаёт действие по-русски.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Хотя направительный суффикс указывает на движение к жертвеннику, в данном ритуальном контексте естественное русское выражение — «сжечь на жертвеннике».
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: как жир мирной жертвы
  rationale: Выражение сопоставляет этот обряд с установленным порядком сожжения жира жертвы שְׁלָמִים. «Мирная жертва» — узнаваемое русское наименование этой категории, а её более широкий смысл отмечен в сноске.
- source_word: וְכִפֶּר עָלָיו
  choice: священник совершит для него искупление
  rationale: В священническом жертвенном контексте כפר обозначает обрядовое искупление или устранение вины; формулировка не навязывает более узкой теории искупления.
- source_word: מֵחַטָּאתוֹ
  choice: за его грех
  rationale: חַטָּאת может означать и грех, и жертву за грех, но здесь сочетание с כפר и последующим прощением человека наиболее естественно указывает на его грех.
- source_word: וְנִסְלַח לוֹ
  choice: и он будет прощён
  rationale: Нифаль глагола סלח с לְ указывает на получателя прощения. Русская личная пассивная конструкция ясно и естественно передаёт смысл, сохраняя подразумеваемого совершающего прощение.
theological_decisions:
- issue: Передача жертвенного термина שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Термин может выражать мир, целостность, благополучие и общение. В основном тексте сохранено традиционно узнаваемое и уместное здесь название, а широта значения отражена в сноске.
- issue: Значение חַטָּאת в מֵחַטָּאתוֹ
  choice: его грех
  alternative: его жертва за грех
  rationale: Двойное значение существительного сохраняется в сноске, однако синтаксис и завершающее обещание прощения делают значение «грех» наиболее вероятным в основном тексте.
- issue: Подразумеваемый деятель прощения
  choice: пассивная формулировка «он будет прощён»
  alternative: Бог простит его
  rationale: Еврейский текст не называет деятеля прямо. Пассив сохраняет это умолчание и не добавляет отсутствующего в стихе подлежащего.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Культовые термины переданы последовательно и понятно; подлинная лексическая неоднозначность вынесена в сноски.
