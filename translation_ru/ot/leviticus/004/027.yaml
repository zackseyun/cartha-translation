base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: ru
  text: Если кто-либо из простого народа[a] невольно согрешит, сделав что-либо из того, что Яхве заповедал не делать, и станет виновен[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из народа земли». Здесь это выражение означает обычного члена общины, в отличие от священника или вождя, упомянутых в соседних постановлениях.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «и понесёт вину» или «и окажется виновен». Еврейский глагол может обозначать как наступление состояния виновности, так и несение вины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: кто-либо
  rationale: В данном юридическом контексте נֶפֶשׁ обозначает отдельного человека. Неопределённое «кто-либо» естественно передаёт обобщённый единичный субъект условия.
- source_word: תֶּחֱטָא
  choice: согрешит
  rationale: Обычный и точный русский эквивалент глагола חטא, уместный в контексте закона о жертве за грех.
- source_word: בִשְׁגָגָה
  choice: невольно
  rationale: Передаёт непреднамеренный характер проступка и сохраняет юридико-сакральный оттенок лучше, чем разговорное «по ошибке».
- source_word: מֵעַם הָאָרֶץ
  choice: из простого народа
  rationale: В окружающих постановлениях выражение обозначает обычного члена общины в отличие от помазанного священника, всей общины как целого и вождя. Буквальный вариант отмечен в сноске.
- source_word: בַּעֲשֹׂתָהּ אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: нарушив одну из заповедей Яхве о том, чего нельзя делать
  rationale: Формулировка естественно передаёт еврейскую конструкцию о совершении запрещённого одной из заповедей, сохраняет единичность нарушения и нормативную силу запрета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְאָשֵׁם
  choice: и станет виновен
  rationale: Передаёт наступление состояния виновности вследствие совершённого проступка, не устраняя возможного оттенка несения вины.
theological_decisions:
- issue: Значение מֵעַם הָאָרֶץ в жертвенном законодательстве
  choice: из простого народа
  alternative: из народа земли
  rationale: Контекст противопоставляет обычного члена общины священнику и вождю. Основной вариант ясно выражает эту правовую категорию, а буквальная форма сохранена в сноске.
- issue: Смысл וְאָשֵׁם
  choice: и станет виновен
  alternative: и понесёт вину / и окажется виновен
  rationale: Выбранный вариант сохраняет переход от поступка к состоянию виновности, не вводя дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Условное предложение намеренно оставлено незавершённым запятой, поскольку его продолжение следует в следующем стихе.
