source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: ru
  text: 'Скажи сынам Израиля[a]: если человек согрешит по неведению, нарушив одну из заповедей Яхве, запрещающих что-либо делать, и сделает одно из такого[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам»; буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: '«По неведению» может также означать «по ошибке», «непреднамеренно»: речь идёт о проступке, совершённом неумышленно, а не о сознательном дерзком нарушении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Скажи
  rationale: Императив вводит прямое повеление Моисею обратиться к народу; «скажи» естественно передаёт его в русском языке.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранён буквальный родственный образ еврейского выражения; более идиоматический вариант — «израильтянам».
- source_word: נֶפֶשׁ
  choice: кто-нибудь
  rationale: В данном законодательном контексте נֶפֶשׁ означает отдельного человека, а не «душу» как нематериальную часть человека.
- source_word: בִשְׁגָגָה
  choice: по неведению
  rationale: Выражение обозначает непреднамеренный проступок, совершённый по ошибке или недосмотру, в отличие от сознательного дерзкого нарушения.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: нарушив какую-либо из заповедей Яхве
  rationale: Предлог מן при глаголе «грешить» обозначает отношение проступка к заповеди; «нарушив» ясно передаёт юридический смысл, не представляя саму заповедь как запрещённое действие.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: о том, чего нельзя делать
  rationale: Сохранено безлично-пассивное значение относительной конструкции, указывающей на запрещённые поступки.
- source_word: מֵאַחַת מֵהֵנָּה
  choice: что-либо из этого
  rationale: Оборот отсылает к только что названным запрещённым действиям; русский вариант сохраняет неопределённость и естественно завершает условную часть.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное заветное имя «Яхве», а не заменён титулом; это соответствует непосредственно засвидетельствованному в еврейском тексте имени.
- issue: Характер греха בִשְׁגָגָה
  choice: непреднамеренный грех — «по неведению»
  alternative: по ошибке; нечаянно
  rationale: Формулировка отличает рассматриваемый проступок от сознательного дерзкого нарушения, не отрицая его реальной виновности и необходимости жертвы.
translation_notes:
  register: Современный литературный русский язык с достойным законодательным регистром. Буквальное «сынам Израиля» сохранено в тексте, но пояснено более естественным вариантом в сноске. Синтаксис несколько упрощён ради ясности без устранения условного характера незавершённого стиха.
