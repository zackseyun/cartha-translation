  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: נֶפֶשׁ обозначает отдельного человека, בִּשְׁגָגָה — непреднамеренность, а заключительный оборот относится к запрещённым деяниям. Однако «какую-либо из заповедей ... о том, чего нельзя делать» синтаксически делает заповеди предметом, который совершается; в еврейском запретительные заповеди характеризуются как то, чего не должно делать. Также מֵאַחַת מֵהֵנָּה точнее передать как «одно из них/одно из таких деяний», а не неопределённым «что-либо из этого».'
