  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: ru
  text: С этим быком священник должен поступить так же, как он поступил с быком жертвы за грех[a]; так он должен поступить с ним. Священник совершит за них искупление, и они будут прощены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с быком очистительной жертвы». Еврейское слово может обозначать жертву, связанную с грехом и совершаемую для очищения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: И пусть он поступит с этим быком
  rationale: Глагол עשה с предлогом ל здесь описывает предписанное ритуальное действие над животным. «Поступить с быком» естественно по-русски и сохраняет инструктивную силу формы.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: так же, как поступил
  rationale: Оборот вводит точное сопоставление с ранее описанным обрядом.
- source_word: לְפַר הַחַטָּאת
  choice: с быком жертвы за грех
  rationale: Конструкция указывает на ранее описанного жертвенного быка. Традиционное «жертва за грех» понятно читателю, а возможное значение очищения отмечено в сноске.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: пусть сделает с ним то же самое
  rationale: Передаёт соответствие предыдущему порядку действий и сохраняет повтор исходного текста, не делая русскую фразу неестественной.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: Священник совершит за них искупление
  rationale: כפר — ключевой культовый термин; «совершить искупление» сохраняет его богословскую и ритуальную весомость. על указывает на тех, ради кого или в пользу кого совершается действие.
- source_word: וְנִסְלַח לָהֶם
  choice: и они будут прощены
  rationale: Пассивная форма выражает дарованное людям прощение; личная русская конструкция ясна и точно передаёт смысл.
theological_decisions:
- issue: Значение חטאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может обозначать жертву, устраняющую последствия греха посредством очищения. Основной перевод сохраняет узнаваемое обозначение «жертва за грех», а реальная лексическая альтернатива вынесена в сноску без устранения смыслового напряжения.
