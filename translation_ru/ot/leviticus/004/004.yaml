base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: ru
  text: Пусть он приведёт быка ко входу шатра встречи, перед Яхве, возложит руку на голову быка и заколет быка перед Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Пусть он приведёт
  rationale: Каузативная форма глагола בוא в последовательности ритуальных предписаний указывает, что приносящий должен привести животное. Конструкция «пусть он приведёт» естественно передаёт предписывающую силу текста.
- source_word: הַפָּר
  choice: быка
  rationale: פַּר обозначает быка, нередко молодого быка в жертвенном контексте. Определение «молодой» в самом стихе отсутствует, поэтому не добавляется.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в шатёр встречи
  rationale: פֶּתַח означает «отверстие, вход»; אֹהֶל מוֹעֵד — устойчивое обозначение святилища. Формулировка естественна по-русски и сохраняет конкретный образ шатра.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי может означать «перед, пред, в присутствии». Краткое «пред Яхве» сохраняет форму культового выражения, а возможный смысл присутствия отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: возложит руку на голову быка
  rationale: סמך в жертвенном ритуале обозначает возложение или опирание руки на животное. Перевод передаёт само действие, не добавляя толкования его символического смысла.
- source_word: וְשָׁחַט
  choice: и заколет
  rationale: שׁחט — специальный глагол заклания жертвенного животного. «Заколет» сохраняет ритуально-жертвенный оттенок точнее, чем общее «убьёт».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Смысл возложения руки при жертве за грех
  choice: Передать физическое действие без пояснения его символики
  alternative: Явно истолковать действие как отождествление с жертвой или перенесение вины
  rationale: Данный стих описывает ритуальный жест, но не объясняет его полного богословского значения; перевод не должен устранять эту смысловую напряжённость добавленным толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной ритуальной лексикой. «Шатёр встречи», «пред Яхве» и «заколет» сохраняют сакральный контекст, оставаясь понятными современному читателю. Союзы еврейской последовательности переданы естественной русской цепочкой однородных сказуемых.
