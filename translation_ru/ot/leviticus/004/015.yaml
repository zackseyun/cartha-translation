base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: ru
  text: И старейшины общины возложат руки на голову быка пред Яхве, и заколет[a] быка пред Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте после множественного «старейшины» стоит глагол в единственном числе, но исполнитель прямо не назван. Возможно также: «и бык будет заколот пред Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: возложат
  rationale: В контексте жертвоприношения глагол סמך обозначает обрядовое возложение рук на жертвенное животное; «возложат» точно и естественно передаёт этот установленный акт.
- source_word: זִקְנֵי הָעֵדָה
  choice: старейшины общины
  rationale: «Старейшины» передаёт זִקְנֵי, а «община» — עֵדָה как организованное собрание народа завета.
- source_word: אֶת יְדֵיהֶם
  choice: руки
  rationale: Сохранено множественное число еврейского существительного с суффиксом 3-го лица множественного числа.
- source_word: עַל רֹאשׁ הַפָּר
  choice: на голову быка
  rationale: Прямое и естественное обозначение места ритуального действия; פַּר здесь — «бык».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» кратко и точно передаёт לִפְנֵי в культовом контексте, то есть действие перед лицом или в присутствии Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены его титулом.
- source_word: וְשָׁחַט
  choice: и он заколет
  rationale: Форма глагола имеет 3-е лицо мужского рода единственного числа. «Заколет» естественно для русского языка жертвенного законодательства и сохраняет переход от множественного к единственному числу.
- source_word: הַפָּר
  choice: быка
  rationale: Существительное פַּר непосредственно обозначает быка; возраст животного в этом стихе дополнительно не уточняется.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Переход от множественного подлежащего к единственному глаголу וְשָׁחַט
  choice: 'сохранить единственное число: «и он заколет»'
  alternative: «и бык будет заколот» или «и они заколют»
  rationale: Еврейский текст после множественного «старейшины» употребляет глагол в единственном числе и не называет нового подлежащего. Перевод сохраняет эту особенность и не отождествляет исполнителя со всеми старейшинами; сноска отмечает сохраняющуюся неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для текста жертвенного законодательства. Формула «пред Яхве» сохраняет библейскую торжественность, оставаясь понятной; синтаксическая смена числа в оригинале не сглажена.
