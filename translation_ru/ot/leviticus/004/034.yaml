base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: ru
  text: Затем священник должен взять пальцем немного крови жертвы за грех[a], нанести её на роги жертвенника всесожжения и вылить всю её кровь у основания жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительной жертвы». Еврейское слово может обозначать жертву, приносимую в связи с грехом и обрядовым очищением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем ... пусть возьмёт
  rationale: Сочетание союза с перфектной формой продолжает последовательность предписанных обрядовых действий; «затем» естественно передаёт очередность, а конструкция с «пусть» — предписывающую силу.
- source_word: מִדַּם הַחַטָּאת
  choice: немного крови жертвы за грех
  rationale: 'Предлог מִן имеет здесь партитивное значение: священник берёт часть крови. חַטָּאת в данном жертвенном контексте обозначает приношение, связанное с грехом и очищением.'
- source_word: בְּאֶצְבָּעוֹ
  choice: пальцем
  rationale: Предлог בְּ указывает на орудие действия; краткая русская форма точно и естественно передаёт смысл.
- source_word: וְנָתַן
  choice: и нанесёт её
  rationale: Хотя נתן буквально имеет широкое значение «дать, положить», в контексте нанесения крови на роги жертвенника русский глагол «нанести» точнее описывает обрядовое действие.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: на роги жертвенника всесожжения
  rationale: «Роги» сохраняет конкретный культовый образ выступов жертвенника, а «жертвенник всесожжения» является ясным и устойчивым обозначением.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: а всю её кровь
  rationale: Перевод сохраняет выраженную словом כָּל полноту, не заменяя её контекстуально возможным, но менее буквальным «оставшуюся кровь». Местоимение относится к жертве.
- source_word: יִשְׁפֹּךְ אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: выльет к основанию жертвенника
  rationale: שפך обозначает намеренное выливание, а אֶל יְסוֹד — направленность к нижней части, основанию жертвенника.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: В данном контексте слово несомненно обозначает жертвенное приношение, но допускает акцент как на связи с грехом, так и на очистительной функции обряда. Основной вариант традиционно понятен русскому читателю, а альтернативный сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией, уместной для обрядового законодательства. Синтаксис сохраняет последовательность предписаний, не становясь архаичным; культовые термины «роги», «жертвенник» и «всесожжение» сохранены ради точности и узнаваемости.
