base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: ru
  text: Если помазанный священник согрешит и тем навлечёт вину на народ[a], пусть он принесёт за совершённый им грех быка из стада без порока Господу в жертву за грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно также понять как «к вине народа». Оно кратко указывает, что грех помазанного священника влечёт виновность, затрагивающую народ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: помазанный священник
  rationale: Буквально передаёт еврейское «священник, помазанный», не добавляя отсутствующего в тексте титула «первосвященник».
- source_word: יֶחֱטָא
  choice: согрешит
  rationale: Условная форма после אִם естественно передаётся русским будущим совершенного вида.
- source_word: לְאַשְׁמַת הָעָם
  choice: и тем навлечёт вину на народ
  rationale: Передаёт сжатое указание на последствие греха священника для народа, не уточняя сверх текста механизм общей виновности.
- source_word: וְהִקְרִיב
  choice: пусть он принесёт
  rationale: В жертвенном контексте глагол означает принести или представить жертву; эта формулировка естественна для русского законодательного предписания.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: за совершённый им грех
  rationale: Ясно передаёт основание жертвоприношения и сохраняет смысл еврейской конструкции без неестественного повтора.
- source_word: פַּר בֶּן בָּקָר
  choice: молодого быка
  rationale: Устойчиво и естественно передаёт обозначение быка из крупного рогатого скота; слово בֶּן допускает традиционное возрастное уточнение.
- source_word: תָּמִים
  choice: без порока
  rationale: Стандартное русское обозначение ритуально приемлемого жертвенного животного без физического изъяна.
- source_word: לַיהוָה
  choice: Господу
  rationale: Передаёт тетраграмматон принятой в русской библейской речи формой, сохраняя достоинство и ясность текста.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Здесь חַטָּאת обозначает жертвоприношение, связанное с грехом, а не только сам грех.
theological_decisions:
- issue: Следует ли понимать הַכֹּהֵן הַמָּשִׁיחַ как «помазанный священник» или прямо как «первосвященник»
  choice: помазанный священник
  alternative: помазанный первосвященник
  rationale: Контекст может указывать на первосвященника, однако отдельного слова «первосвященник» в еврейском тексте нет; основной текст сохраняет формулировку источника.
- issue: Как выразить общественное последствие в לְאַשְׁמַת הָעָם
  choice: и тем навлечёт вину на народ
  alternative: к вине народа
  rationale: Выбранный вариант по-русски ясно показывает связь греха священника с виновностью народа, но не объясняет её природу сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной и богослужебной речи. Синтаксис упрощён ради ясности, при этом сохранены условная структура, ритуальная терминология и смысловая напряжённость выражения о вине народа.
