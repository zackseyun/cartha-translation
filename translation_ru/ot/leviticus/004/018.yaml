  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: ru
  text: Часть крови[a] он нанесёт на роги жертвенника, который находится перед Яхве в шатре встречи, а всю кровь выльет к основанию жертвенника всесожжения, стоящего у входа в шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из крови он положит». Выражение имеет частичное значение: на роги наносится лишь часть крови, в отличие от «всей крови» далее в стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: Часть крови
  rationale: 'Предлог מִן имеет здесь частичное значение: на роги наносится лишь часть крови, в отличие от «всей крови» далее. Русское выражение естественно передаёт подразумеваемый партитив.'
- source_word: יִתֵּן
  choice: нанесёт
  rationale: Буквально נתן означает «дать, положить». Применительно к крови на рогах жертвенника «нанесёт» естественно описывает ритуальное действие, не добавляя способа нанесения.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: роги жертвенника
  rationale: Сохранён буквальный и устоявшийся термин «роги», обозначающий выступы по углам жертвенника.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: который находится пред Яхве
  rationale: לִפְנֵי передаёт пространственное положение «перед, пред лицом»; форма «пред Яхве» сохраняет также оттенок пребывания в Божьем присутствии.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой в современном русском языке транслитерацией, а не заменено титулом.
- source_word: אֲשֶׁר בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Прозрачный перевод названия святилища אֹהֶל מוֹעֵד; он понятен современному читателю и не подменяет исходный образ более специальным термином.
- source_word: וְאֵת כָּל הַדָּם
  choice: а всю кровь
  rationale: Сохранено буквальное «всю кровь», хотя по ходу обряда имеется в виду кровь, оставшаяся после нанесения части на роги. Союз «а» ясно выражает сопоставление двух действий.
- source_word: יִשְׁפֹּךְ
  choice: выльет
  rationale: Естественный русский эквивалент глагола שׁפך «лить, выливать» в данном ритуальном контексте.
- source_word: אֶל יְסוֹד
  choice: к подножию
  rationale: יְסוֹד означает основание или нижнюю часть сооружения; «к подножию» естественно обозначает место, куда выливают кровь у основания жертвенника.
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенника всесожжения
  rationale: «Всесожжение» — точный и узнаваемый русский термин для עֹלָה, жертвы, целиком возносившейся в огне.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: стоящего у входа в шатёр встречи
  rationale: Передано пространственное указание у входа; причастие «стоящего» естественно восполняет отсутствующую в еврейском именную связку без изменения смысла.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. «Яхве» сохраняет его как личное имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Соотношение части крови и «всей крови»
  choice: Сохранить «часть крови» и затем буквальное «всю кровь»
  alternative: Передать второе выражение как «всю оставшуюся кровь»
  rationale: Контекст подразумевает остаток крови, однако еврейский текст буквально говорит «всю кровь». Формулировка сохраняет текстовое напряжение, не внося отсутствующее слово «оставшуюся».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Сохранены традиционные культовые термины «роги жертвенника» и «всесожжение», а название אֹהֶל מוֹעֵד передано прозрачно как «шатёр встречи».
