source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: ru
  text: Он должен отделить весь её жир, как отделяют жир от мирной жертвы[a], и священник сожжёт его на жертвеннике как благоухание, приятное Господу[b]. И священник совершит за него искупление, и ему будет прощено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения».'
    reason: lexical_alternative
  - marker: b
    text: «Благоухание, приятное Господу» — устойчивая жертвенная формула, обозначающая приношение, угодное Господу.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָהּ / חֵלֶב
  choice: весь её жир / жир
  rationale: В данном обрядовом контексте слово обозначает жир, отделяемый для сожжения на жертвеннике. Прямой эквивалент «жир» сохраняет формулировку еврейского текста и не добавляет уточнение «жировые части».
- source_word: יָסִיר
  choice: пусть он отделит
  rationale: Каузативная форма глагола סור означает удаление или отделение. Конструкция с «пусть» естественно передаёт предписывающий характер текста на современном русском языке.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: как отделяют
  rationale: Сравнение отсылает к установленному порядку принесения жертвы. Обобщённо-личная форма естественна для русского законодательного изложения и не ограничивает действие одним прошлым случаем.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: мирная жертва
  rationale: «Мирная жертва» — традиционное и понятное название данной категории жертв. Возможное «жертва общения» яснее подчёркивает аспект совместности, но уже содержит толкование.
- source_word: וְהִקְטִיר
  choice: и священник сожжёт его
  rationale: В жертвенном контексте глагол обозначает сожжение на жертвеннике. Местоимение относится к собирательному существительному «жир».
- source_word: לְרֵיחַ נִיחֹחַ
  choice: в приятное благоухание
  rationale: Сохранён образ устойчивой жертвенной формулы, обозначающей угодность приношения Богу, без сведения её к одному лишь абстрактному понятию принятия.
- source_word: לַיהוָה
  choice: Господу
  rationale: Передача тетраграмматона как «Господь» соответствует устойчивому русскому библейскому употреблению и здесь оформлена дательным падежом согласно направленности приношения.
- source_word: וְכִפֶּר עָלָיו
  choice: священник совершит за него искупление
  rationale: Формула сохраняет культовый смысл כפר и участие священника, не уточняя сверх текста последующий богословский механизм.
- source_word: וְנִסְלַח לוֹ
  choice: и ему будет прощено
  rationale: Безлично-пассивная русская конструкция близко передаёт еврейскую форму и результат — дарованное согрешившему прощение — не вводя явно названного субъекта действия.
theological_decisions:
- issue: Связь священнического искупления и прощения
  choice: «священник совершит за него искупление, и ему будет прощено»
  alternative: «священник очистит его, и он получит прощение»
  rationale: 'Выбранная формулировка сохраняет последовательность исходного текста: священническое искупительное действие и последующее прощение. Она не сводит כפר только к очищению и не объясняет механизм прощения догматически.'
- issue: Образ «приятного благоухания»
  choice: сохранить жертвенную метафору
  alternative: 'передать только смыслом: «как угодную Господу жертву»'
  rationale: Еврейский текст использует конкретную устойчивую метафору. Её сохранение передаёт образность и не подменяет текст богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, предписывающим звучанием. Синтаксис сохраняет последовательность еврейского текста, но избегает архаических оборотов. Маркеры сносок поставлены непосредственно при выражениях, к которым относятся примечания.
