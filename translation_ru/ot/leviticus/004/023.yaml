base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: ru
  text: Или, если ему станет известно о совершённом им грехе,[a] пусть он принесёт как своё приношение козла без изъяна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «или если станет известен ему его грех, которым он согрешил».'
    reason: Сноска передаёт более формальное устройство еврейской фразы, включая пассивную формулировку и повтор слова «грех».
lexical_decisions:
- source_word: אֽוֹ
  choice: или
  rationale: Простой разделительный союз, продолжающий изложение данного правового случая.
- source_word: הוֹדַע אֵלָיו
  choice: ему укажут
  rationale: 'Хофаль от ידע выражает пассивно-каузативный смысл: человек узнаёт о проступке потому, что тот доведён до его сведения. Русская неопределённо-личная конструкция естественно передаёт это, не называя действующее лицо.'
- source_word: חַטָּאתוֹ
  choice: грех
  rationale: Здесь слово обозначает проступок, а не жертву за грех, что подтверждает следующее определительное предложение о совершённом им грехе.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: который он совершил
  rationale: Естественная русская передача оборота; местоименный суффикс при предлоге בְּ входит в древнееврейское управление глагола «грешить» и отдельно по-русски не воспроизводится.
- source_word: וְהֵבִיא
  choice: пусть он принесёт
  rationale: В законодательном контексте форма выражает предписанное действие как следствие указанного условия.
- source_word: קָרְבָּנוֹ
  choice: как своё приношение
  rationale: קרבן — то, что приносят или представляют Богу. Формулировка ясна и соответствует синтаксису после глагола «принести».
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: козла
  rationale: Русское «козёл» само по себе однозначно обозначает самца козы, поэтому пол животного передан без неестественного повтора «козла-самца».
- source_word: תָּמִים
  choice: без изъяна
  rationale: Устойчивое и понятное обозначение жертвенного животного, не имеющего физических дефектов.
theological_decisions:
- issue: Значение חַטָּאת в этом стихе
  choice: грех, проступок
  alternative: жертва за грех
  rationale: Определительное предложение «который он совершил» указывает на проступок; само приношение далее отдельно названо словом קָרְבָּן.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Неопределённо-личное «ему укажут» сохраняет подразумеваемое внешнее доведение греха до сведения человека.
