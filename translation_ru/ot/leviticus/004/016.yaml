lexical_decisions:
- source_word: וְהֵבִיא
  choice: Затем … внесёт
  rationale: Форма продолжает последовательность предписанных действий. «Затем» естественно передаёт последовательность, а будущее время в русском языке уместно выражает нормативное указание.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: помазанный священник
  rationale: הַמָּשִׁיחַ здесь обозначает священника, помазанного для служения, а не мессианский титул. Буквальное «помазанный» сохраняет связь с обрядом помазания.
- source_word: מִדַּם הַפָּר
  choice: часть крови быка
  rationale: 'Предлог מִן, вероятнее всего, имеет партитивное значение: в шатёр вносится не вся кровь, а некоторое её количество. «Часть крови» ясно и естественно выражает этот смысл.'
- source_word: אֶל
  choice: в
  rationale: В контексте внесения крови к месту назначения предлог подразумевает движение внутрь священного шатра.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт состав и смысл еврейского наименования прозрачно для современного читателя. Традиционное «скиния собрания» сохранено в примечании как известный вариант.
theological_decisions:
- issue: Значение הַמָּשִׁיחַ применительно к священнику
  choice: помазанный
  alternative: посвящённый; Мессия
  rationale: В данном обрядовом контексте слово характеризует священника, введённого в служение посредством помазания. «Посвящённый» менее точно передаёт образ исходного слова, а «Мессия» ошибочно превратило бы описание должности в мессианский титул.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис сохраняет характер последовательного обрядового предписания, избегая как архаизации, так и излишней разговорности.
