  source_fidelity: 'В исходном варианте относительное предложение имеет неверную синтаксическую привязку: «чего не велел делать Яхве» означает, что Яхве не велел совершать нечто, тогда как древнееврейский текст говорит о поступке, запрещённом заповедями Яхве. Исправленный текст передаёт партитивное «одно из всего», неумышленность действия, имя Яхве, суффикс «его Бог» и последующее возникновение вины.'
  naturalness: «Правитель» — естественное современное обозначение признанного руководителя в данном законодательном контексте. Формулировка «запрещено заповедями Яхве» ясна и не создаёт двусмысленной связи. «Навлечёт на себя вину» — литературное и естественное выражение юридически-религиозного последствия.
  terminology: «Яхве» и «его Бога» сохранены. «По неведению» адекватно передаёт בִּשְׁגָגָה. Термин «вина» передаёт אָשֵׁם без навязывания спорного оттенка осознания вины.
