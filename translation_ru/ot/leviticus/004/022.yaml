  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: ru
  text: Если правитель[a] согрешит и по неведению совершит что-либо из того, что запрещено заповедями Яхве, его Бога, и тем навлечёт на себя вину,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глава», «предводитель», «вождь»; еврейское נָשִׂיא обозначает признанного руководителя или главу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «станет виновным» или «окажется виновным»; древнееврейское выражение указывает на состояние виновности, наступающее вследствие проступка.'
    reason: ambiguity
lexical_decisions:
- source_word: נָשִׂיא
  choice: предводитель
  rationale: Обозначает признанного главу или руководителя общины; «предводитель» передаёт статус, не предполагая непременно царского достоинства.
- source_word: יֶחֱטָא
  choice: согрешит
  rationale: Прямой и общепонятный эквивалент стандартного древнееврейского глагола со значением совершения греха.
- source_word: וְעָשָׂה אַחַת מִכָּל מִצְוֺת
  choice: сделав что-либо из того
  rationale: 'Передаёт частичную конструкцию: речь идёт об одном из множества запрещённых поступков, определяемых далее относительным предложением.'
- source_word: יְהוָה אֱלֹהָיו
  choice: Яхве, его Бог
  rationale: Сохраняются личное имя Бога и значимое местоименное отношение «его Бог».
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: чего не велел делать
  rationale: Естественно по-русски передаёт запретительную силу сочетания «заповеди... которые не должны исполняться», связывая её с понятием заповеди.
- source_word: בִּשְׁגָגָה
  choice: по неведению
  rationale: В контексте жертвенного законодательства обозначает неумышленное нарушение, совершённое без осознания или намерения.
- source_word: וְאָשֵׁם
  choice: и станет виновен
  rationale: Передаёт наступившее вследствие проступка состояние виновности, не уточняя, означает ли форма осознание вины или объективное её возникновение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Смысл וְאָשֵׁם
  choice: станет виновен
  alternative: осознает свою вину
  rationale: Древнееврейская форма допускает обсуждение оттенка, но в данном контексте прежде всего указывает на состояние виновности; перевод не вводит явно отсутствующий глагол осознания.
