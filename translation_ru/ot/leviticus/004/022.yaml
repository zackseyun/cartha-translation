revisions:
- from: Если предводитель согрешит, по неведению сделав что-либо из того, чего не велел делать Яхве, его Бог,[a] и станет виновен,[b]
  to: Если правитель[a] согрешит и по неведению совершит что-либо из того, что запрещено заповедями Яхве, его Бога, и тем навлечёт на себя вину,[b]
  rationale: Исправлена смысловая связь запретительной части с «заповедями», а сноска о слове נָשִׂיא перенесена к своему анкеру. «Правитель» заменяет несколько менее точное в данном контексте «предводитель» и не предполагает непременно монархического титула. Условная незавершённость стиха сохранена.
