  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: ru
  text: Пусть возьмут другие камни и принесут их вместо тех камней[a]; затем пусть он возьмёт другую землю[b] и обмажет дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под камни»; здесь это означает «вместо камней», то есть на место удалённых камней.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «другую землю» или «другую пыль»; имеется в виду материал, которым покрывали стены дома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ אֲבָנִים אֲחֵרוֹת
  choice: Пусть затем возьмут другие камни
  rationale: Форма множественного числа сохранена, а последовательное значение וְ передано словом «затем». «Другие камни» естественно выражает замену удалённых камней.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: и положат их на место прежних[a]
  rationale: В данном контексте תַּחַת обозначает замену, а не физическое положение под камнями. Глагол «положат» естественнее для установки строительных камней, чем буквальное «принесут»; «прежних» уточняет подразумеваемые удалённые камни без изменения смысла.
- source_word: וְעָפָר אַחֵר
  choice: другую штукатурную смесь[b]
  rationale: Основное значение עָפָר — «пыль, земля», но здесь речь о земляном материале для нового покрытия стен. «Штукатурная смесь» ясно передаёт его функцию, а буквальное значение сохраняется в сноске.
- source_word: יִקַּח
  choice: пусть возьмёт
  rationale: Сохранён неожиданный переход еврейского текста от множественного числа к мужскому роду единственного числа; субъект остаётся неопределённым.
- source_word: וְטָח אֶת הַבָּיִת
  choice: и оштукатурит дом
  rationale: טוח означает покрывать поверхность обмазкой или штукатуркой. Русское «оштукатурит» точно и естественно передаёт строительное действие.
