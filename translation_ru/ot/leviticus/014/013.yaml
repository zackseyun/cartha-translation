base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: ru
  text: И пусть он заколет ягнёнка в том месте, где закалывают жертву за грех[a] и жертву всесожжения, в святом месте. Ведь жертва повинности[b], как и жертва за грех, принадлежит священнику; это великая святыня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительную жертву». Еврейское חַטָּאת в священническом законодательстве может подчёркивать очистительную функцию обряда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертва возмещения». Еврейское אָשָׁם может подчёркивать возмещение причинённого ущерба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: И пусть он заколет
  rationale: Глагол שׁחט в жертвенном контексте означает ритуальный закол; форма «пусть он заколет» естественно передаёт предписание.
- source_word: הַכֶּבֶשׂ
  choice: ягнёнка
  rationale: כֶּבֶשׂ обозначает ягнёнка, нередко молодого барашка; контекст уже определяет жертвенное животное.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: на том месте, где закалывают
  rationale: Единственное число еврейского глагола имеет обобщённо-неопределённое значение; русская безличная конструкция сохраняет норму ритуальной практики.
- source_word: הַחַטָּאת
  choice: жертву за грех
  rationale: Это традиционное и понятное обозначение данной жертвенной категории; очистительный аспект отмечен в сноске.
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: Устоявшийся русский эквивалент для עֹלָה, то есть жертвы, целиком сжигаемой на жертвеннике.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: на святом месте
  rationale: Артикль указывает на установленное священное место; повтор предлога сохранён как отдельное уточнение.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: Ведь жертва повинности, как и жертва за грех, принадлежит священнику
  rationale: Формулировка ясно передаёт аналогию между двумя жертвами и значение לַכֹּהֵן как священнического права на жертву.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: это великая святыня
  rationale: «Великая святыня» естественно передаёт техническую превосходную конструкцию «святыня святынь» и её особую степень ритуальной святости.
theological_decisions:
- issue: Значение חַטָּאת в священническом жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может акцентировать как грех, так и ритуальное очищение. В основном тексте сохранено общепонятное название жертвенной категории, а значимая функциональная альтернатива вынесена в сноску.
- issue: Значение אָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения
  rationale: «Жертва повинности» сохраняет установленную жертвенную категорию и понятие вины; альтернатива подчёркивает связанный с ней аспект возмещения и потому отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром. Синтаксис юридического предписания сохранён, но сделан естественным для современного читателя; технические названия жертв переданы последовательно и без конфессионального уточнения.
