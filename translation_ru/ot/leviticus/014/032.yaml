  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: ru
  text: Вот закон для человека, у которого есть поражение кожи[a] и у которого недостаточно средств для очищения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское цараат традиционно переводили как «проказа», но в книге Левит это название охватывает разные тяжёлые поражения кожи и связанную с ними обрядовую нечистоту; оно не означает исключительно современную болезнь Хансена.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чья рука не достигает при его очищении» — то есть у кого недостаточно средств для предписанных при очищении приношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: закон
  rationale: В священнических установлениях תּוֹרָה обозначает предписанный порядок или правило; «закон» здесь кратко и естественно передаёт юридико-обрядовый смысл.
- source_word: אֲשֶׁר בּוֹ נֶגַע צָרָעַת
  choice: о человеке, у которого поражение кожной болезнью
  rationale: Оборот בּוֹ указывает на наличие поражения у человека. נֶגַע передано словом «поражение», а צָרָעַת — описательно как кожная болезнь, поскольку это древняя обрядово-диагностическая категория, не тождественная современной болезни Хансена.
- source_word: אֲשֶׁר לֹא תַשִּׂיג יָדוֹ
  choice: которому не хватает средств
  rationale: Буквально «чья рука не достигает» — древнееврейская идиома, обозначающая недостаток материальных возможностей; смысл передан естественным современным русским выражением.
- source_word: בְּטָהֳרָתוֹ
  choice: на очищение
  rationale: В контексте речь идёт о средствах, необходимых для установленного обряда очищения; предлог «на» ясно выражает назначение расходов без излишнего уточнения.
theological_decisions:
- issue: Характер очищения
  choice: очищение
  alternative: исцеление; очищение от греха
  rationale: טָהֳרָה в данном разделе относится к восстановлению обрядовой чистоты. Перевод не отождествляет его ни с медицинским исцелением, ни с прощением грехов.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной формулировкой. Конструкция «Вот закон о человеке» сохраняет характер итогового установления; идиома о «руке» раскрыта в основном тексте по смыслу, а буквальный образ приведён в примечании.
