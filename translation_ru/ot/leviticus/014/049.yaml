id: LEV.14.49
reference: Leviticus 14:49
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: ru
  text: И пусть он возьмёт для очищения дома[a] двух птиц, кедровую древесину, алую нить[b] и иссоп.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть для обрядового очищения дома от осквернения; также возможно: «чтобы очистить дом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «алую пряжу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: И пусть он возьмёт
  rationale: Форма с союзом продолжает последовательность обрядовых предписаний; конструкция с «пусть» естественно передаёт предписывающую силу, сохраняя достоинство законодательного стиля.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: для очищения дома
  rationale: Пиэль глагола חטא в данном обрядовом контексте означает очистить от ритуального осквернения. Краткая формулировка не приписывает физическому дому моральной вины и не вводит прямо не выраженное здесь понятие искупления.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: двух птиц
  rationale: Еврейский текст этого стиха говорит только о двух птицах; определение «живых» здесь не добавляется из соседнего контекста.
- source_word: וְעֵץ אֶרֶז
  choice: кедровую древесину
  rationale: Так естественно передаётся название ритуального материала без впечатления, будто требуется взять целое кедровое дерево.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: алую нить
  rationale: Выражение обозначает окрашенный в алый цвет материал, вероятно нить или пряжу. «Алая нить» ясно и естественно звучит по-русски, а лексическая неопределённость отмечена в сноске.
- source_word: וְאֵזֹב
  choice: иссоп
  rationale: Традиционное и узнаваемое соответствие; точное ботаническое отождествление растения остаётся спорным.
theological_decisions:
- issue: Обрядовое значение לְחַטֵּא применительно к дому
  choice: для очищения дома
  alternative: чтобы очистить дом от осквернения; для очищения дома от греха; для искупления дома
  rationale: Речь идёт об обрядовом устранении нечистоты из заражённого дома. Перевод сохраняет ритуальный смысл глагола, но не наделяет дом нравственной виновностью и не утверждает механизм искупления, прямо не названный в стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным оттенком, соответствующим обрядово-законодательному контексту. Перечень передан ясно и без добавлений из соседних стихов.
