  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ»; традиционно переводится «ГОСПОДЬ».'
    reason: Указывает еврейскую форму имени и традиционный вариант перевода.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в повествовательной форме вводит новое обращение Бога. В современной русской речи «сказал» естественно передаёт эту формулу; более буквальное «говорил» здесь могло бы ошибочно указывать на длительное действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно обозначает адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит содержание последующей прямой речи. В современном русском эту функцию естественно и точно выполняет двоеточие, избегая тяжеловесного «сказав» или архаичного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. Форма «Яхве» представляет распространённую научную реконструкцию произношения; традиционная замена «ГОСПОДЬ» указана в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формула божественной речи. Двоеточие естественно вводит слова, следующие в стихе 2.
