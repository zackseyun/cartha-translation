base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: ru
  text: На восьмой день он должен принести их для своего очищения[a] к священнику, ко входу в шатёр встречи, перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для своего ритуального очищения». Здесь еврейское слово обозначает очищение в обрядовом смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: он должен принести
  rationale: В контексте законодательного предписания форма выражает обязательное последующее действие; такая передача естественна для современного русского языка.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение мужского рода во множественном числе отсылает к жертвенным предметам, перечисленным в предыдущем стихе.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: на восьмой день
  rationale: Обычная русская передача данного обстоятельства времени.
- source_word: לְטָהֳרָתוֹ
  choice: для своего очищения
  rationale: Слово обозначает здесь обрядовое очищение; выбранная формулировка сохраняет культовый смысл и остаётся понятной современному читателю.
- source_word: אֶל הַכֹּהֵן
  choice: к священнику
  rationale: Точно передаёт направленность действия и естественно звучит по-русски.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в шатёр встречи
  rationale: Сохраняет направительное значение אֶל и устойчивый смысл названия אֹהֶל מוֹעֵד, не превращая его в более поздний храмовый термин.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Кратко и точно передаёт культовую формулу пребывания перед лицом или в присутствии Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, а не заменяет её титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет это отличие от титула אֲדֹנָי.
- issue: Обрядовый смысл לְטָהֳרָתוֹ
  choice: для своего очищения
  alternative: для своего ритуального очищения
  rationale: Основной текст передаёт обрядовый процесс без добавления отсутствующего в еврейском тексте уточняющего прилагательного; контекст раскрывает характер очищения, а примечание делает его явным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Формула «пред Яхве» сохраняет достоинство и краткость исходного культового выражения; «шатёр встречи» понятен и близок структуре еврейского названия.
