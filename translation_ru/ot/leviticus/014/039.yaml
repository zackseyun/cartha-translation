  text: На седьмой день священник вернётся и осмотрит дом; если поражение распространилось по стенам дома,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: вернётся
  rationale: Передаёт возврат священника после установленного срока; будущее время естественно выражает предписание в данном контексте.
- source_word: וְרָאָה
  choice: осмотрит дом
  rationale: В контексте проверки дома глагол означает целенаправленный осмотр; дополнение «дом» восстановлено из ближайшего контекста для естественного русского синтаксиса.
- source_word: הַנֶּגַע
  choice: поражение
  rationale: Нейтральный и контекстуально подходящий термин для наблюдаемого явления на доме; не навязывает современный медицинский диагноз.
- source_word: פָשָׂה
  choice: распространилось
  rationale: Точно передаёт увеличение области поражения.
- source_word: בְּקִירֹת הַבָּיִת
  choice: по стенам дома
  rationale: Естественно передаёт распространение поражения на поверхности стен.
theological_decisions:
- issue: Условное значение сочетания וְהִנֵּה
  choice: Если поражение распространилось
  alternative: и вот, поражение распространилось
  rationale: В процедуре осмотра וְהִנֵּה вводит обнаруженное условие; русское «если» ясно передаёт условную структуру, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык, сдержанный нормативный стиль. Стих сохранён как незавершённая условная часть предложения, продолжающегося в следующем стихе.
