id: LEV.14.8
reference: Leviticus 14:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: ru
  text: Человек, проходящий обряд очищения[a], должен выстирать свои одежды, сбрить все волосы и омыться водой; тогда он будет чист. После этого он может войти в стан[b], но семь дней должен оставаться вне своего шатра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очищаемый». Еврейское слово обозначает человека, проходящего предписанное обрядовое очищение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он войдёт в стан». Еврейскую форму можно понять и как простое будущее, и как указание на разрешённое возвращение; дальнейшее ограничение позволяет предпочесть второй смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: очищаемый
  rationale: Причастная форма породы хитпаэль обозначает человека, проходящего предписанное обрядовое очищение. «Очищаемый» кратко и точно передаёт этот процессуальный смысл.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Глагол כִּבֵּס обычно обозначает стирку одежды; «выстирать свою одежду» естественно звучит по-русски и отличает это действие от последующего омовения тела.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: сбрить все волосы
  rationale: Сочетание глагола с כָּל подчёркивает полное удаление волос; русский глагол «сбрить» ясно выражает результат.
- source_word: רָחַץ בַּמַּיִם
  choice: омыться водой
  rationale: В обрядовом контексте речь идёт об омовении тела. Возвратная форма естественна для русского языка и не смешивает это действие со стиркой одежды.
- source_word: וְטָהֵר
  choice: тогда он будет чист
  rationale: Фраза обозначает наступивший вследствие предписанных действий обрядовый статус; «тогда» естественно передаёт последовательность.
- source_word: וְאַחַר
  choice: после этого
  rationale: Выражение вводит следующий этап обряда и естественно передаётся современным русским оборотом.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: он может войти в стан
  rationale: 'С учётом следующего ограничения форма допускает разрешительное понимание: человеку уже разрешено вернуться в стан, хотя ещё не в свой шатёр. Неоднозначность отмечена в сноске.'
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: но ... должен оставаться вне своего шатра
  rationale: יָשַׁב здесь означает временно пребывать или оставаться. «Но» естественно выявляет контраст между возвращением в стан и сохраняющимся ограничением.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое и идиоматичное обозначение продолжительности.
theological_decisions:
- issue: Характер языка чистоты
  choice: «очищаемый» и «чист» как обозначения обрядового статуса
  alternative: «тот, кто проходит очищение» и «очищен»; либо «очищающийся» и «чист»
  rationale: Контекст говорит о предписанном обрядовом восстановлении, а не непосредственно о нравственном состоянии. Выбранные слова сохраняют категорию ритуальной чистоты без внесения дополнительных богословских утверждений.
- issue: Модальность возвращения в стан
  choice: «может войти»
  alternative: «войдёт» или «должен войти»
  rationale: Еврейский имперфект сам по себе допускает простое будущее или предписывающее прочтение, однако контекст последующего ограничения поддерживает разрешительный смысл. Альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Стан» и «шатёр» сохранены как понятные историко-культурные термины; синтаксис сделан ясным для обычного читателя.
