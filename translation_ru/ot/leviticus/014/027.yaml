  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: ru
  text: Затем священник правым пальцем семь раз окропит перед Яхве, взяв масла с его левой ладони.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: Затем ... окропит
  rationale: Глагол נזה в породе хифиль в обрядовом контексте означает «кропить, окроплять»; союз передан словом «затем», естественно обозначающим следующий шаг обряда.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное и точное соответствие еврейскому כֹּהֵן в культовом законодательстве.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: правым пальцем
  rationale: Сохраняются единственное число и указание на правую сторону; выражение подразумевает палец правой руки и естественно звучит по-русски.
- source_word: מִן הַשֶּׁמֶן
  choice: маслом
  rationale: В контексте кропления русский творительный естественно передаёт вещество, часть которого берётся с ладони; количественная частичность ясна из самого действия.
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: которое у него на левой ладони
  rationale: כַּף здесь обозначает именно ладонь; оборот сохраняет конкретную обрядовую картину.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямое и идиоматичное соответствие счётному выражению.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי обозначает совершение действия перед лицом, то есть в присутствии Бога; «пред» соответствует возвышенному законодательному регистру, а имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному решению для данного проекта.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейско-законодательным оттенком. Порядок слов сделан естественным для русского языка, при этом сохранены последовательность обряда, правая сторона, левая ладонь и семикратность действия.
