  text: וְ/צִוָּ֨ה הַ/כֹּהֵ֜ן וּ/פִנּ֣וּ אֶת הַ/בַּ֗יִת בְּ/טֶ֨רֶם יָבֹ֤א הַ/כֹּהֵן֙ לִ/רְא֣וֹת אֶת הַ/נֶּ֔גַע וְ/לֹ֥א יִטְמָ֖א כָּל אֲשֶׁ֣ר בַּ/בָּ֑יִת וְ/אַ֥חַר כֵּ֛ן יָבֹ֥א הַ/כֹּהֵ֖ן לִ/רְא֥וֹת אֶת הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: ru
  text: Тогда священник велит вынести всё из дома, прежде чем войдёт осмотреть поражённое место[a], чтобы всё находящееся в доме не стало нечистым. После этого священник войдёт осмотреть дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поражение», «след поражения»; традиционно: «язва». Еврейское не́га обозначает поражённое место или состояние, подлежащее осмотру священником.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Тогда священник велит
  rationale: Вав с перфектом в последовательности предписаний естественно передаётся как следующий этап процедуры; настоящее-будущее «велит» сохраняет нормативный характер.
- source_word: וּפִנּוּ אֶת־הַבַּיִת
  choice: вынести всё из дома
  rationale: Глагол פנה в данном контексте означает освободить дом от содержимого; такая формулировка естественнее по-русски, чем буквальное «опустошить дом», и согласуется с целью сохранить вещи от нечистоты.
- source_word: לִרְאוֹת
  choice: осмотреть
  rationale: Хотя буквальное значение — «увидеть», в контексте официального священнического обследования уместно «осмотреть».
- source_word: הַנֶּגַע
  choice: поражённое место
  rationale: נגע обозначает наблюдаемое поражение или его участок, не обязательно соответствующий современной категории инфекции или болезни; вариант сохраняет предметность и не переуточняет природу явления.
- source_word: וְלֹא יִטְמָא
  choice: чтобы ... не стало нечистым
  rationale: Фраза передаёт предупредительную цель распоряжения; «нечистым» сохраняет ритуальный смысл טמא без морализации.
- source_word: כָּל־אֲשֶׁר בַּבָּיִת
  choice: всё находящееся в доме
  rationale: Выражение относится ко всему содержимому дома; причастный оборот точен и естествен в юридико-ритуальном контексте.
- source_word: וְאַחַר כֵּן
  choice: После этого
  rationale: Ясно обозначает следующий шаг предписанной процедуры.
- source_word: לִרְאוֹת אֶת־הַבָּיִת
  choice: осмотреть дом
  rationale: Во второй фразе объектом осмотра назван весь дом, а не только поражённый участок; различие сохранено.
theological_decisions:
- issue: Терминология ритуальной нечистоты
  choice: стало нечистым
  alternative: осквернилось; стало ритуально нечистым
  rationale: טמא здесь обозначает культово-ритуальный статус, а не нравственную вину. «Стало нечистым» — традиционно узнаваемая и при этом ясная формулировка; добавление «ритуально» внесло бы отсутствующее в тексте пояснение.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис упрощён для ясности, но последовательность действий и различие между осмотром поражённого места и осмотром всего дома сохранены.
