  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: ru
  text: Остаток масла, который находится на ладони священника, он нанесёт на голову очищающегося, и священник совершит искупление за него перед Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: Остаток масла
  rationale: Субстантивированное причастие от נותר обозначает то, что осталось; בַּשֶּׁמֶן в данном сочетании естественно передаётся по-русски как указание на целое, частью которого является остаток.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: который будет на ладони священника
  rationale: כַּף здесь конкретно означает ладонь, а עַל — нахождение на ней. Будущее время в русском согласует описание остатка масла с последовательностью предписанных действий.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: нанесёт на голову
  rationale: נתן может означать «дать», «положить», «поместить»; применительно к маслу русское «нанесёт» естественно описывает действие, не добавляя значения помазания.
- source_word: הַמִּטַּהֵר
  choice: очищающегося
  rationale: Форма Hitpael и причастное значение передают человека, проходящего процесс ритуального очищения; «очищающегося» сохраняет процессуальный и возвратный оттенок.
- source_word: וְכִפֶּר עָלָיו
  choice: и священник совершит за него искупление
  rationale: В священническом ритуальном контексте כפר передано традиционным, но не привязанным к частной теории выражением «совершить искупление»; עָלָיו естественно передаётся как «за него».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי означает «перед, в присутствии», а тетраграмматон передан личным именем «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит тетраграмматон; форма «Яхве» сохраняет личное заветное имя, тогда как «Господь» является традиционной заменой.
- issue: Значение כפר в священническом обряде
  choice: совершит за него искупление
  alternative: совершит за него очищение
  rationale: «Искупление» сохраняет устойчивое ритуально-богословское значение корня כפר и не сводит его исключительно к очищению, хотя в данном контексте речь идёт об обряде очищения.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет последовательность еврейского предписания, но формулировки адаптированы к естественному описанию нанесения масла. Тон достойный и общепонятный, без конфессионально специфической терминологии.
