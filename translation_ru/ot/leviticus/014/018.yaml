  source_fidelity: Проект в целом верно передаёт последовательность ритуального действия, «ладонь», процессуальное значение הַמִּטַּהֵר, искупительное значение כפר и имя Яхве. Однако будущее время «который будет на ладони» не соответствует относительному описанию масла, уже находящегося на ладони священника.
  naturalness: «Который будет на ладони» звучит по-русски как указание на будущее состояние и создаёт ненужную временную неоднозначность. Также порядок «совершит за него искупление» менее естественен, чем «совершит искупление за него».
  terminology: «Яхве» точно передаёт тетраграмматон в соответствии с предоставленной редакционной установкой. «Искупление» допустимо и сохраняет широкий ритуальный смысл כפר, не навязывая частного богословского истолкования. «Очищающийся» удачно выражает причастное, процессуальное значение.
