base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: ru
  text: И пусть он разрушит дом — его камни, деревянные части и всю штукатурку дома[a] — и вынесет всё это за город, в нечистое место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всю пыль (или землю) дома»; в данном строительном контексте, вероятно, имеется в виду земляная обмазка, штукатурка или снятый со стен материал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: И пусть он разрушит
  rationale: Глагол נתץ обозначает разрушение или разбор строения. «Разрушит» естественно передаёт предписанное полное уничтожение заражённого дома; союз «и» сохраняет последовательную связь с предыдущим контекстом.
- source_word: הַבַּיִת
  choice: дом
  rationale: Здесь בַּיִת означает именно физическое строение, подвергаемое осмотру и разборке.
- source_word: אֲבָנָיו
  choice: его камни
  rationale: Перевод сохраняет конкретное значение множественного числа и образ каменной кладки дома.
- source_word: עֵצָיו
  choice: брёвна
  rationale: Слово обозначает деревянные части строения. «Брёвна» в данном контексте естественно указывает на его конструкционные деревянные элементы, не ограничивая смысл только балками.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: всю штукатурку дома
  rationale: עָפָר буквально означает «пыль, рыхлая земля», но в строительном контексте речь, вероятнее всего, идёт о земляной обмазке или снятом со стен штукатурном материале. «Штукатурка» понятно современному читателю; буквальное значение сохранено в примечании.
- source_word: וְהוֹצִיא
  choice: и вынесет всё это
  rationale: Каузативный глагол означает «вывести, вынести наружу». Добавление «всё это» естественно объединяет перечисленные строительные материалы и не меняет смысла.
- source_word: אֶל מִחוּץ לָעִיר
  choice: за город
  rationale: Краткий русский оборот точно передаёт направленное перемещение за пределы поселения.
- source_word: אֶל מָקוֹם טָמֵא
  choice: в нечистое место
  rationale: «Нечистое» последовательно передаёт ключевой для Левита термин ритуальной нечистоты, а не обычную физическую загрязнённость.
theological_decisions:
- issue: Передача терминологии ритуальной чистоты
  choice: нечистое
  alternative: осквернённое; ритуально нечистое
  rationale: Прилагательное טָמֵא входит в правовую и обрядовую систему чистоты книги Левит. «Нечистое» сохраняет этот установленный смысл без добавления толкования непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного предписания. Конструкция «пусть он» сохраняет форму повелительного предписания и не уточняет подразумеваемого исполнителя. Тире ясно выделяет перечень частей разбираемого дома.
