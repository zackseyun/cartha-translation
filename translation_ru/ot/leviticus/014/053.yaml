base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: ru
  text: Затем он выпустит живую птицу за город, в открытое поле. Так он совершит искупление за дом[a], и дом будет чист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистит дом»; возможен также смысл: «совершит обряд очищения за дом». В еврейском тексте здесь употреблён священнический язык искупления в контексте ритуального очищения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: Потом он выпустит
  rationale: Порода пиэль глагола שלח здесь обозначает ритуальное отпускание птицы на волю; «выпустит» естественно передаёт это действие, а «потом» выражает последовательность.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: живую птицу
  rationale: Прилагательное подчёркивает противопоставление птице, ранее умерщвлённой в ходе обряда.
- source_word: אֶל מִחוּץ לָעִיר
  choice: за город
  rationale: Оборот указывает на движение за городские пределы; это краткий и естественный русский эквивалент.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: в открытое поле
  rationale: Идиоматическое выражение указывает на открытую местность; перевод сохраняет образ поля без буквального и неестественного «к лицу поля».
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: он совершит искупление за дом
  rationale: Сохранён характерный для священнической обрядовой речи глагол כפר и возникающее напряжение при его употреблении по отношению к дому; формулировка не сводит смысл лишь к очищению.
- source_word: וְטָהֵר
  choice: и дом будет чист
  rationale: Глагол обозначает итоговый статус ритуальной чистоты. Повтор существительного естественно и недвусмысленно указывает, что чистым становится дом.
theological_decisions:
- issue: Передача כפר в контексте ритуального очищения дома
  choice: совершит искупление за дом
  alternative: очистит дом; совершит обряд очищения за дом
  rationale: Еврейский текст применяет к дому священнический язык искупления. Перевод сохраняет эту необычную богословскую формулировку, не подменяя её исключительно санитарным или общим понятием очищения и не привнося позднейшую теорию искупления.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим обрядовому законодательству. Синтаксис ясен для широкого читателя; сохранена необычная формулировка об искуплении дома.
