  text: זֹ֖את הַ/תּוֹרָ֑ה לְ/כָל נֶ֥גַע הַ/צָּרַ֖עַת וְ/לַ/נָּֽתֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: ru
  text: Вот закон о всяком поражении, называемом цараат[a], и о нетеке[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цараат — древнееврейское обозначение ряда поражений, делавших человека или предмет ритуально нечистым; оно не обязательно означает современную проказу (болезнь Хансена).
    reason: lexical_clarification
  - marker: b
    text: Точное медицинское соответствие еврейского термина неизвестно; традиционно его переводили как «парша». Речь идёт об особом поражении на коже головы или в области бороды.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Вот закон
  rationale: Именная формула естественно передаётся по-русски словами «Вот закон»; «закон» здесь обозначает установленное предписание о распознавании и очищении.
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: о всяком поражении цараат
  rationale: Предлог לְ передаёт предмет регулирования, а נֶגַע — отдельное поражение или проявление. Транслитерация «цараат» не отождествляет древнюю категорию с современной болезнью Хансена и сохраняет широту термина в Левите.
- source_word: וְלַנָּתֶק
  choice: и о поражении кожи головы или бороды
  rationale: נֶתֶק обозначает особое поражение в области волос на голове или бороде (Лев 13:29–37). Описательный перевод понятен современному читателю и не приписывает термину недоказанный точный медицинский диагноз.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая заключительная правовая формула сохранена. Неясные древние медицинские категории не отождествлены с конкретными современными диагнозами.
