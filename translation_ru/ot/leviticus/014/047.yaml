base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: ru
  text: Кто ляжет[a] в этом доме, тот должен выстирать свою одежду; и кто поест в этом доме, тот должен выстирать свою одежду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет спать». Еврейский глагол может означать как «лечь, лежать», так и «спать»; здесь более широкое «ляжет» лучше соответствует правовому контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: Кто ляжет
  rationale: Субстантивированное причастие имеет обобщённое значение. Глагол שׁכב означает «лечь, лежать», а в зависимости от контекста также «спать»; «ляжет» сохраняет более широкое значение, уместное в правовом предписании.
- source_word: בַּבַּיִת
  choice: в этом доме
  rationale: Определённый артикль указывает на уже упомянутый поражённый дом; русское «в этом доме» естественно передаёт контекстуальную определённость.
- source_word: יְכַבֵּס
  choice: должен выстирать
  rationale: В священническом законодательстве имперфект выражает обязательное предписание. «Должен выстирать» ясно передаёт нормативную силу и относится именно к одежде.
- source_word: אֶת־בְּגָדָיו
  choice: свою одежду
  rationale: בֶּגֶד обозначает одежду или предмет одежды. Возвратное притяжательное местоимение «свою» естественно по-русски передаёт принадлежность субъекту, не создавая ненужного указания на пол.
- source_word: וְהָאֹכֵל
  choice: и кто поест
  rationale: Субстантивированное причастие имеет обобщённо-правовое значение. Совершенный вид «поест» естественно обозначает факт принятия пищи в доме как условие последующего предписания.
theological_decisions:
- issue: Передача грамматически мужского единственного числа в обобщённом правовом предписании
  choice: «кто… свою одежду»
  alternative: «тот, кто… его одежду» или явно мужская форма «лежащий… его одежду»
  rationale: Русская конструкция «кто… свою» охватывает любого человека и при этом точно сохраняет единственное число и связь одежды с действующим лицом. Она не вводит утверждения, будто предписание относится только к мужчинам.
- issue: Степень обязательности предписания יְכַבֵּס
  choice: «должен выстирать»
  alternative: «пусть выстирает» или простое будущее «выстирает»
  rationale: Контекст законов о ритуальной нечистоте требует ясно выразить обязанность, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с ясной нормативной формулировкой. Повтор исходного текста сохранён; точка с запятой подчёркивает параллелизм двух условий. Слово «этом» восстанавливает контекстуальную определённость дома без пояснительной вставки.
