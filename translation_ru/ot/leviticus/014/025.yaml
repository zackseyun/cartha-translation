  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: ru
  text: Затем он заколет ягнёнка для жертвы повинности, и священник возьмёт крови жертвы повинности и нанесёт её на мочку правого уха очищаемого[a], на большой палец его правой руки и на большой палец его правой ноги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на край правого уха очищаемого». Еврейское слово обозначает наружную крайнюю часть уха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Затем он заколет
  rationale: В контексте жертвоприношения שׁחט обозначает ритуальный закол; будущее совершенного вида естественно передаёт последовательность предписанных действий.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: ягнёнка для жертвы повинности
  rationale: Сочетание обозначает ягнёнка, предназначенного для конкретного вида жертвы; такая формулировка ясна и естественна по-русски.
- source_word: אָשָׁם
  choice: жертва повинности
  rationale: Здесь слово обозначает установленный вид левитской жертвы, а не отвлечённое чувство вины; выражение «жертва повинности» сохраняет терминологическую точность.
- source_word: מִדַּם הָאָשָׁם
  choice: крови жертвы повинности
  rationale: 'Предлог מִן имеет партитивное значение: священник берёт некоторое количество крови; русский родительный после «возьмёт» естественно передаёт эту частичность.'
- source_word: תְּנוּךְ אֹזֶן
  choice: мочка ... уха
  rationale: Редкое анатомическое слово указывает на наружную крайнюю часть уха; «мочка» — традиционное и понятное соответствие, при этом возможное более широкое значение отмечено в сноске.
- source_word: הַמִּטַּהֵר
  choice: очищаемый
  rationale: Причастие породы hitpael обозначает человека, проходящего обряд очищения; форма сохраняет процессуальное значение.
- source_word: בֹּהֶן יָדוֹ
  choice: большой палец его правой руки
  rationale: При слове «рука» בֹּהֶן означает большой палец.
- source_word: בֹּהֶן רַגְלוֹ
  choice: большой палец его правой ноги
  rationale: При слове «нога» בֹּהֶן означает большой палец ноги; контекст устраняет двусмысленность.
- source_word: וְנָתַן
  choice: нанесёт её
  rationale: Буквально глагол значит «даст/положит», но применительно к крови на части тела естественное русское выражение — «нанесёт»; местоимение «её» уточняет объект.
theological_decisions:
- issue: Передача названия жертвы אָשָׁם
  choice: жертва повинности
  alternative: жертва за вину; жертва возмещения
  rationale: «Жертва повинности» обозначает особую жертву без сведения её смысла лишь к внутреннему чувству вины или лишь к возмещению ущерба; тем самым сохраняется широта культового термина.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным регистром. Синтаксис сохраняет последовательность ритуальных действий, но избегает архаизмов. Маркер сноски поставлен непосредственно после спорного анатомического выражения.
