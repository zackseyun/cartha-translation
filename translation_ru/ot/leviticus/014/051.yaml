id: LEV.14.51
reference: Leviticus 14:51
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: ru
  text: Затем пусть он возьмёт кедровую древесину, иссоп, багряную нить[a] и живую птицу, окунёт их в кровь заколотой птицы и в проточную воду[b] и семь раз окропит дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «багрянец червеца»; обычно это выражение понимают как нить или пряжу, окрашенную багряной краской.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живую воду», то есть свежую воду из текущего источника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем пусть он возьмёт
  rationale: В последовательности обрядовых предписаний форма выражает очередное предписанное действие; конструкция с «пусть» естественно передаёт это значение в современном русском языке.
- source_word: עֵץ הָאֶרֶז
  choice: кедровую древесину
  rationale: Сочетание обозначает кедровое дерево как обрядовый материал; «древесина» ясно передаёт вещественное значение без добавления отсутствующего в тексте указания на форму предмета.
- source_word: הָאֵזֹב
  choice: иссоп
  rationale: Устоявшееся русское название растения, соответствующее обычному значению еврейского слова.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: багряную нить
  rationale: Выражение буквально связано с багряной краской, получаемой из червеца, и традиционно понимается как окрашенная нить или пряжа. «Багряная нить» кратко и понятно передаёт предмет обряда.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: живую птицу
  rationale: Определение отличает эту птицу от заколотой; буквальное и естественное соответствие.
- source_word: וְטָבַל אֹתָם
  choice: окунёт их
  rationale: Глагол означает погружение или обмакивание; «окунёт» естественно звучит применительно к перечисленным обрядовым предметам.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: в кровь заколотой птицы
  rationale: «Заколотой» сохраняет обрядовый оттенок глагола שׁחט точнее, чем общее «убитой».
- source_word: וּבַמַּיִם הַחַיִּים
  choice: и в проточную воду
  rationale: Буквально «живую воду»; в данном обрядовом контексте идиома обозначает свежую воду из действующего, обычно текущего источника. «Проточная» передаёт предметный смысл, а буквальная форма отмечена в сноске.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: и окропит дом
  rationale: Форма глагола נזה обозначает обрядовое окропление; русская конструкция с прямым дополнением естественна и не требует буквального воспроизведения предлога אֶל.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямое и однозначное соответствие числовому обстоятельству.
theological_decisions:
- issue: Передача выражения מַיִם חַיִּים в обрядовом законодательстве
  choice: проточная вода
  alternative: живая вода; свежая вода
  rationale: Буквальная передача «живая вода» сохраняет образность, но в современном русском может вызвать не требуемые этим контекстом богословские ассоциации. «Проточная вода» ясно передаёт обычный предметный смысл идиомы; буквальный вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для обрядового законодательства. Синтаксис сохраняет последовательность еврейского предписания, но избегает тяжеловесной буквальности; традиционные термины «иссоп» и «окропит» оставлены как понятные и точные.
