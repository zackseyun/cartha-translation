base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: ru
  text: 'Вот закон о человеке с цараат[a] в день его очищения: его приведут к священнику.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цараат — передача еврейского названия состояния, традиционно называемого «проказой»; оно не обязательно соответствует современной болезни Хансена.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Вот закон
  rationale: Естественная для современного русского формула введения установления; значение еврейской связки в предписывающем контексте передано всей конструкцией, без тяжеловесного «это будет».
- source_word: תּוֹרַת
  choice: закон о
  rationale: Здесь תּוֹרָה обозначает установленный порядок обряда. «Закон» сохраняет традиционную лексику Левита, а предлог «о» естественно передаёт конструктивную связь с обозначением человека.
- source_word: הַמְּצֹרָע
  choice: человеке, поражённом цараат
  rationale: מְצֹרָע — человек, имеющий состояние צָרַעַת. Транслитерация не отождествляет древнее понятие с современной болезнью Хансена, а слово «человек» не сводит личность к её состоянию.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: в день его очищения
  rationale: Прямо передаёт временную конструкцию и ритуальный смысл корня טהר, не подменяя его медицинским выздоровлением.
- source_word: וְהוּבָא
  choice: его приведут
  rationale: Русская неопределённо-личная конструкция естественно передаёт еврейский пассив хофала и последовательность предписанной процедуры.
- source_word: אֶל הַכֹּהֵן
  choice: к священнику
  rationale: Передаёт направление движения и определённость служителя, предусмотренного данным обрядом.
theological_decisions:
- issue: Соотношение צָרַעַת с традиционным понятием проказы
  choice: цараат
  alternative: проказа; кожная болезнь
  rationale: Еврейское название охватывает ритуально значимое состояние и не совпадает однозначно ни с современной болезнью Хансена, ни с общим понятием кожной болезни. Транслитерация с пояснением сохраняет эту историко-богословскую неопределённость.
translation_notes:
  register: Современный литературный русский с краткой, ясной формой законодательного предписания. Термин «цараат» пояснён сноской, чтобы сохранить точность и не создавать ложного медицинского отождествления.
