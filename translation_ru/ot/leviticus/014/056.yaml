lexical_decisions:
- source_word: שְׂאֵת
  choice: припухлость
  rationale: В контексте Лев 13–14 слово обозначает приподнятый участок или опухание кожи. «Припухлость» передаёт этот признак нейтрально и без излишне точного диагноза.
- source_word: סַפַּחַת
  choice: сыпь
  rationale: Точное дерматологическое значение неясно; речь идёт о кожном высыпании или поражённом участке. Современное слово «сыпь» понятно читателю, а другие возможные значения приведены в сноске.
- source_word: בֶּהֶרֶת
  choice: светлое пятно
  rationale: Слово указывает на светлый или блестящий участок кожи. «Светлое пятно» сохраняет основной смысл, не уточняя без необходимости, что пятно непременно белое.
- source_word: וְ/לַ
  choice: и о
  rationale: Повтор сочетания союза с предлогом продолжает перечень предписаний; «и о» сохраняет его ритм и юридический характер.
