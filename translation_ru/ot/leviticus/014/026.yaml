lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: И масла
  rationale: Союз продолжает последовательность обрядовых действий, а מִן указывает на источник или часть вещества. В русском при глаголе «налить» родительный «масла» естественно передаёт значение «из масла / некоторое количество масла» без тяжеловесной конструкции.
- source_word: יִצֹק
  choice: пусть … нальёт
  rationale: Форма yiqtol в обрядовом предписании выражает инструкцию; конструкция «пусть нальёт» естественна для современного русского нормативного текста.
- source_word: הַ/כֹּהֵן
  choice: священник
  rationale: Обычный и контекстуально точный эквивалент כֹּהֵן в культовом законодательстве.
- source_word: עַל כַּף
  choice: на ладонь
  rationale: עַל при глаголе наливания обозначает направленность на поверхность, а כַּף здесь конкретно означает ладонь, а не руку вообще.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: своей левой руки
  rationale: Так по-русски естественно обозначается левая ладонь самого действующего священника; при этом буквальное построение еврейского текста отмечено в сноске.
