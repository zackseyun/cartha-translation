base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: ru
  text: 'из того, что ему по средствам[a]: одну — в жертву за грех[b], а другую — во всесожжение, вместе с хлебным приношением. Так священник совершит искупление за очищаемого пред Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, чего достигнет его рука», то есть то, что он может себе позволить.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в очистительную жертву».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: то, что ему по средствам
  rationale: Еврейская идиома буквально говорит о том, чего «достигает его рука», и обозначает материальные возможности человека. Выбран естественный современный русский эквивалент.
- source_word: חַטָּאת
  choice: жертва за грех
  rationale: Традиционный и узнаваемый термин для данного вида левитской жертвы; возможное значение ритуального очищения отмечено в сноске.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшееся русское обозначение жертвы, целиком возносимой на жертвеннике в дыме.
- source_word: עַל הַמִּנְחָה
  choice: вместе с приношением из зерна
  rationale: Предлог עַל здесь обозначает сопровождение или добавление. «Приношение из зерна» ясно передаёт культовое значение מִנְחָה в данном контексте.
- source_word: וְכִפֶּר
  choice: совершит искупление
  rationale: Сохраняет культовый и богословский вес глагола כפר, не уточняя сверх текста конкретный механизм искупления.
- source_word: הַמִּטַּהֵר
  choice: проходящий очищение
  rationale: Причастная форма обозначает человека, находящегося в процессе обрядового очищения; формулировка естественна по-русски и не смешивает его со священником, совершающим обряд.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» передаёт значение присутствия перед Богом, а личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача жертвенной терминологии без чрезмерного уточнения богословия искупления
  choice: «жертва за грех», «всесожжение», «совершит искупление»
  alternative: «очистительная жертва», «жертва, сжигаемая целиком», «совершит очищение»
  rationale: Выбранные культовые термины привычны русскому читателю и сохраняют формулировки еврейского текста; альтернативная функция חַטָּאת как очистительной жертвы отмечена отдельно.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя в соответствии с проектным решением и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства культового контекста. Начальная синтаксическая зависимость от предыдущего стиха сохранена, поскольку еврейский текст стиха 31 продолжает предшествующее предложение. Эллиптические «одну… другую» опираются на названных в предыдущем стихе птиц и не вносят нового содержания.
