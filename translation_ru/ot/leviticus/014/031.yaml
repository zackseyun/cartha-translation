  source_fidelity: 'Смысл передан в целом точно: выражение о материальных возможностях, два вида жертвы, хлебное приношение, действие священника и формула «пред Яхве» соответствуют еврейскому тексту. Однако начальное «то, что ему по средствам: одну...» по-русски создаёт неудачную синтаксическую связь среднего рода с «одну/другую»; в оригинале это продолжение предыдущего стиха и подразумевает выбранных птиц.'
