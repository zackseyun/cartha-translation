  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: ru
  text: А на восьмой день пусть он возьмёт двух ягнят-самцов без изъяна, одну годовалую ягницу без изъяна, три десятых эфы[a] муки тонкого помола для хлебного приношения, смешанной с маслом, и один лог[b] масла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфа — древняя мера сыпучих тел; три десятых эфы составляли около 6–7 литров.
    reason: Поясняет древнюю меру и передаёт приблизительный характер её современного пересчёта.
  - marker: b
    text: Лог — небольшая древнеизраильская мера жидкости, предположительно около трети литра.
    reason: Поясняет специальную меру, не подменяя её условным современным эквивалентом.
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: А на восьмой день
  rationale: Союз и предлог передают продолжение последовательных обрядовых предписаний; «А на» естественно звучит по-русски.
- source_word: יִקַּח
  choice: пусть он возьмёт
  rationale: Имперфект в законодательном контексте выражает предписание; такая конструкция ясна и сохраняет нормативную силу.
- source_word: שְׁנֵי כְבָשִׂים תְּמִימִים
  choice: двух ягнят-самцов без изъяна
  rationale: Мужской род животных сделан явным ввиду последующего противопоставления ягнице; תמים в жертвенном контексте означает отсутствие физического дефекта.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ תְּמִימָה
  choice: одну годовалую ягницу без изъяна
  rationale: Сохранены пол, возраст и жертвенное требование к животному; «годовалая» естественно передаёт идиому «дочь своего года».
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: три десятых эфы
  rationale: עשרון — мера в одну десятую эфы; подразумеваемая основная единица названа для понятности и снабжена примечанием.
- source_word: סֹלֶת מִנְחָה
  choice: лучшей муки для хлебного приношения
  rationale: סלת обозначает высококачественную тонкую муку; מנחה в данном культовом контексте — приношение из муки. «Хлебное приношение» сохраняет принятую русскую библейскую терминологию без предположения, что речь идёт о готовом хлебе.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Причастие женского рода относится к муке и описывает её приготовление.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: и один лог масла
  rationale: Сохранено специальное название древней жидкой меры, поскольку точного современного эквивалента нет; значение поясняется в примечании.
