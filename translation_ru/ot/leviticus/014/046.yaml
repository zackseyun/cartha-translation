base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: ru
  text: Всякий, кто войдёт в дом в течение всего времени, пока его держат в изоляции[a], будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока он закрыт» или «пока он находится под ограничением». Еврейское слово обозначает, что дом по распоряжению священника изолирован на время осмотра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: Всякий, кто войдёт
  rationale: Субстантивированное причастие имеет обобщающий смысл; эта формулировка естественно передаёт норму, относящуюся к любому вошедшему.
- source_word: אֶל הַ/בַּיִת
  choice: в дом
  rationale: Сочетание בוא с אֶל обозначает движение внутрь; русское «войти в дом» точно и естественно передаёт этот смысл.
- source_word: כָּל יְמֵי
  choice: в те дни, когда
  rationale: Фраза охватывает весь период установленной изоляции дома, а выбранная конструкция звучит естественно в современном русском.
- source_word: הִסְגִּיר אֹתוֹ
  choice: он изолирован
  rationale: В предписаниях Левита глагол סגר обозначает помещение под ограничение для последующего осмотра. «Изолирован» передаёт ритуально-правовой смысл, не создавая впечатления, будто дом был физически заперт и в него невозможно войти.
- source_word: יִטְמָא
  choice: будет нечист
  rationale: Глагол обозначает состояние ритуальной нечистоты, возникающее вследствие входа в такой дом; формулировка сохраняет лаконичный правовой регистр.
- source_word: עַד הָ/עָרֶב
  choice: до вечера
  rationale: Это обычное обозначение срока временной ритуальной нечистоты.
theological_decisions:
- issue: Характер нечистоты
  choice: Сохранено выражение «будет нечист» без поясняющего добавления «ритуально».
  alternative: «будет ритуально нечист»
  rationale: Контекст закона ясно указывает на обрядовую нечистоту, но самого уточняющего слова в еврейском тексте нет; краткая формулировка сохраняет стиль оригинала.
translation_notes:
  register: Современный литературный русский с лаконичным правовым звучанием. Синтаксис упрощён без утраты временного охвата и ритуального смысла нормы.
