base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: ru
  text: И принесёт священник жертву за грех[a] и совершит искупление за очищаемого от его нечистоты; после этого он заколет жертву всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву очищения». Еврейское слово חַטָּאת в левитских обрядах может обозначать жертву, служащую для очищения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: совершит
  rationale: В сочетании с названием жертвы глагол עשה обозначает совершение жертвоприношения; «совершит» сохраняет связь с буквальным значением «делать» и естественно звучит в ритуальном контексте.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное соответствие определённому существительному в левитском ритуальном контексте.
- source_word: הַחַטָּאת
  choice: жертву за грех
  rationale: Здесь חַטָּאת является прямым дополнением при глаголе жертвенного действия и обозначает особый вид жертвы. Традиционное и понятное выражение «жертва за грех» оставлено в тексте, а контекстуальный вариант «жертва очищения» указан в сноске.
- source_word: וְכִפֶּר
  choice: и совершит искупление
  rationale: В священнической обрядовой речи כפר обозначает действие, устраняющее препятствие нечистоты или вины и восстанавливающее ритуальное положение. Эта формулировка сохраняет богословскую ёмкость термина, не сводя его к одной теории искупления.
- source_word: עַל
  choice: за
  rationale: При כפר предлог עַל указывает на человека, ради которого или в отношении которого совершается искупление.
- source_word: הַמִּטַּהֵר
  choice: очищаемого
  rationale: Причастие породы hitpael обозначает человека, проходящего установленное очищение; форма «очищаемого» передаёт процессуальный и пассивно-возвратный оттенок.
- source_word: מִטֻּמְאָתוֹ
  choice: от его нечистоты
  rationale: טֻמְאָה в данном разделе означает обрядовую нечистоту; местоимение «его» передаёт мужской род и единственное число еврейского суффикса.
- source_word: וְאַחַר
  choice: после этого
  rationale: Ясно обозначает последовательность предписанных обрядовых действий.
- source_word: יִשְׁחַט
  choice: заколет
  rationale: Глагол שחט является обычным термином для заклания жертвенного животного; «заколет» сохраняет специальный жертвенный смысл.
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: Устоявшееся русское обозначение жертвы עֹלָה, целиком возносимой на жертвеннике.
theological_decisions:
- issue: Значение חַטָּאת в контексте очищения
  choice: жертва за грех
  alternative: жертва очищения
  rationale: Термин является названием жертвы и традиционно передаётся как «жертва за грех», но в левитских обрядах, особенно связанных с нечистотой, он может подчёркивать очистительную функцию. Альтернатива сохранена в сноске, чтобы не устранять эту смысловую напряжённость.
- issue: Значение כפר применительно к очищаемому
  choice: совершить искупление за человека
  alternative: очистить человека посредством обряда
  rationale: Формулировка «совершить искупление» сохраняет самостоятельную ритуально-богословскую силу корня כפר и не отождествляет его без пояснения с одним лишь очищением.
- issue: Мужской суффикс в מִטֻּמְאָתוֹ
  choice: от его нечистоты
  alternative: от нечистоты
  rationale: Еврейский текст прямо содержит суффикс мужского рода единственного числа, поэтому он сохранён, а не нейтрализован.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной обрядовой лексикой. Термины «совершит искупление», «заколет» и «жертва всесожжения» сохраняют точность культового контекста, оставаясь понятными без архаической грамматики.
