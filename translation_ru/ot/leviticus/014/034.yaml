source:
  edition: WLC
  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: ru
  text: Когда вы войдёте в землю Ханаанскую, которую Я даю вам во владение, и Я наведу поражение цараат[a] в доме в земле вашего владения,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «цараат» обозначает различные поражения людей, одежды и домов; оно не тождественно болезни, которую сегодня называют проказой.
    reason: Пояснение древней ритуально-диагностической категории и предупреждение ложного современного медицинского отождествления.
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: Когда вы войдёте
  rationale: כִּי вводит ожидаемое в будущем обстоятельство, а форма בוא во втором лице множественного числа обозначает вступление Израиля в землю; «когда вы войдёте» естественно для законодательного контекста.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: в землю Ханаанскую
  rationale: Традиционное и понятное русское географическое обозначение, сохраняющее направление движения.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: которую Я даю вам
  rationale: Причастие נֹתֵן передаёт совершающееся или предстоящее Божье действие; настоящее время сохраняет его аспект.
- source_word: לַאֲחֻזָּה
  choice: во владение
  rationale: אֲחֻזָּה означает земельное владение или надел; эта формулировка естественна по-русски и не добавляет отсутствующего здесь акцента на наследовании.
- source_word: וְנָתַתִּי
  choice: и Я наведу
  rationale: Буквально глагол означает «дам/помещу». В сочетании с поражением русское «наведу» естественно выражает причинение и сохраняет прямо названное Божье действие.
- source_word: נֶגַע צָרַעַת
  choice: поражение цараат
  rationale: נֶגַע обозначает поражение, язву или повреждённый участок, а צָרַעַת — ритуально значимую категорию поражений людей, тканей и домов. Транслитерация не сводит термин к современной болезни и подходит к дому.
- source_word: בְּבֵית
  choice: на какой-нибудь дом
  rationale: В русском сочетание «навести поражение на дом» естественнее буквального «в доме»; неопределённое «какой-нибудь» передаёт неспецифический характер существительного без артикля.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: в земле вашего владения
  rationale: Формулировка сохраняет повтор корня אֲחֻזָּה и подчёркивает статус земли как данного Израилю владения.
theological_decisions:
- issue: Божественная причинность поражения дома
  choice: 'Сохранено прямое действие Бога: «Я наведу поражение».'
  alternative: 'Обезличить: «на доме появится поражение».'
  rationale: В еврейском тексте стоит первое лицо וְנָתַתִּי — «и Я дам/помещу». Перевод сохраняет богословское напряжение и не смягчает выраженную причинность.
- issue: Идентификация צָרַעַת
  choice: Термин передан транслитерацией «цараат» с пояснением.
  alternative: «Проказа» или «кожная болезнь».
  rationale: Поскольку в данном случае поражён дом, ни современная «проказа», ни «кожная болезнь» не охватывают значение термина. Транслитерация сохраняет древнюю категорию без ложной медицинской конкретизации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены повтор слова «владение», открыто выраженная Божья причинность и незавершённый синтаксис стиха, который продолжается в следующем предписании.
