  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: ru
  text: Затем священник велит заколоть одну из птиц над глиняным сосудом со свежей водой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живая вода», то есть свежая или проточная вода.'
    reason: Сохраняет буквальный образ еврейского выражения מַיִם חַיִּים и указывает его значение в данном ритуальном контексте.
lexical_decisions:
- source_word: וְצִוָּה
  choice: Затем … велит
  rationale: Вав с перфектом в последовательном ритуальном предписании передаёт очередной обязательный шаг; «затем» выражает последовательность, а «велит» — властное распоряжение священника.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное и точное обозначение служителя культа в данном контексте.
- source_word: וְשָׁחַט
  choice: заколоть
  rationale: Инфинитив после «велит» естественно передаёт предписанное действие; «заколоть» уместно для ритуального умерщвления птицы и не утверждает, что действие обязательно совершает сам священник.
- source_word: אֶת הַצִּפּוֹר הָאֶחָת
  choice: одну из птиц
  rationale: Фраза выделяет одну птицу из пары, указанной в предыдущем стихе; такой перевод естественен по-русски и ясно сохраняет эту соотнесённость.
- source_word: כְּלִי חֶרֶשׂ
  choice: глиняный сосуд
  rationale: Ясное современное обозначение сосуда из обожжённой глины.
- source_word: אֶל כְּלִי חֶרֶשׂ עַל מַיִם חַיִּים
  choice: над глиняным сосудом со свежей водой
  rationale: Передаёт пространственное отношение заклания к сосуду и естественно выражает, что вода находится в сосуде. Формулировка не создаёт неестественного впечатления, будто птицу закалывают внутрь сосуда.
- source_word: מַיִם חַיִּים
  choice: свежая вода
  rationale: В ритуальном контексте выражение обозначает нестоячую, свежую воду из естественного источника. Буквальный образ сохранён в сноске.
theological_decisions:
- issue: Передача выражения מַיִם חַיִּים в ритуальном контексте
  choice: свежая вода
  alternative: живая вода; проточная вода
  rationale: Основной текст передаёт практический смысл выражения, не навязывая ему более позднюю богословскую символику. Сноска сохраняет буквальную формулировку и допустимый смысл «проточная».
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и предписывающая, без архаизмов. «Заколоть» сохраняет ритуальную точность, а конструкция «велит заколоть» не определяет исполнителя точнее, чем исходный текст.
