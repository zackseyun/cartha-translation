  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: ru
  text: Но если священник войдёт, осмотрит дом и увидит, что поражение[a] не распространилось по дому после того, как дом был оштукатурен, то священник объявит дом чистым[b], потому что поражение исцелилось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язва». Еврейское слово נגע обозначает поражение; здесь речь идёт о поражении дома, а не о точно установленной современной болезни.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очистит дом». В этом контексте еврейский глагол טהר может обозначать священническое признание дома ритуально чистым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Условие противопоставлено описанному ранее случаю; «но если» естественно передаёт этот переход в последовательности предписаний.
- source_word: בֹּא יָבֹא
  choice: войдёт
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагольное действие. В русском процедурный смысл естественно передаётся простым глаголом «войдёт», без тяжеловесного «непременно войдёт».
- source_word: וְרָאָה וְהִנֵּה
  choice: осмотрит дом и увидит, что
  rationale: Глагол ראה буквально означает «увидит», а הִנֵּה обращает внимание на обнаруженный результат. В контексте проверки дома сочетание «осмотрит… и увидит» ясно передаёт и действие, и его результат.
- source_word: הַנֶּגַע
  choice: поражение
  rationale: נגע обозначает поражение или болезненное проявление, затронувшее дом, без необходимости отождествлять его с конкретной современной болезнью. «Поражение» точнее и шире, чем традиционное, но потенциально вводящее в заблуждение «язва» или «проказа».
- source_word: לֹא פָשָׂה הַנֶּגַע בַּבַּיִת
  choice: поражение не распространилось по дому
  rationale: פשה в Левите 13–14 означает распространение поражения. Русское «по дому» естественно описывает его дальнейшее распространение внутри строения.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: после того, как дом был оштукатурен
  rationale: טוח означает покрыть раствором или штукатуркой. Пассивная конструкция сохраняет отсутствие названного исполнителя и точно описывает произведённую обработку.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבַּיִת
  choice: то священник объявит дом чистым
  rationale: В данном ритуально-правовом контексте טהר обозначает признание или провозглашение чистоты священником, а не физическую уборку дома.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: потому что поражение исцелилось
  rationale: נרפא происходит от רפא, «исцелять». Необычная применительно к дому метафора намеренно сохранена, а не заменена более общим «исчезло».
theological_decisions:
- issue: Ритуальное признание чистоты или физическое очищение в וְטִהַר
  choice: священник объявит дом чистым
  alternative: священник очистит дом
  rationale: Контекст представляет священника как того, кто после осмотра устанавливает ритуальный статус дома. Такой перевод не приписывает ему выполнение уже завершённых физических работ и сохраняет юридико-ритуальную функцию глагола.
translation_notes:
  register: Современный литературный русский язык с ясной правовой последовательностью. Сохранены технический термин «оштукатурен», ритуальная категория «чистым» и намеренно необычная древнееврейская метафора исцеления поражения дома.
