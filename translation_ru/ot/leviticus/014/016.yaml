base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: ru
  text: Священник обмакнёт палец правой руки в масло, которое у него на левой ладони, и этим пальцем семь раз покропит маслом перед Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: обмакнёт
  rationale: Глагол обозначает погружение в жидкость; «обмакнёт» естественно передаёт краткое ритуальное действие с пальцем.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: палец правой руки
  rationale: Так по-русски естественно и точно передаётся буквальное «его правый палец» без неопределённости относительно стороны тела.
- source_word: מִן הַשֶּׁמֶן
  choice: в масло
  rationale: После глагола «обмакнуть» исходный предлог מִן идиоматично передаётся русским винительным с «в»; речь идёт о соприкосновении пальца с частью масла.
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: которое у него на левой ладони
  rationale: כַּף здесь означает ладонь; конструкция сохраняет пространственное «на» и звучит естественно по-русски.
- source_word: הִזָּה
  choice: покропит
  rationale: В священническом ритуальном контексте глагол означает предписанное окропление; «покропит» сохраняет возвышенный, но понятный культовый регистр.
- source_word: בְּאֶצְבָּעוֹ
  choice: этим пальцем
  rationale: Предлог בְּ обозначает орудие действия; указательное слово естественно связывает выражение с уже упомянутым пальцем.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Буквальная передача сохраняет ритуально значимое число.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: «Перед» сохраняет пространственно-культовую формулу присутствия, а личное имя передаётся непосредственно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан распространённой современной русской транслитерацией личного имени, без подмены титулом.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит Тетраграмматон; «Яхве» сохраняет личное заветное имя, тогда как «ГОСПОДЬ» отражает традицию заместительного чтения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной ритуальной лексикой. Синтаксис остаётся ясным для обычного читателя; форма будущего совершенного вида последовательно передаёт предписанное действие.
