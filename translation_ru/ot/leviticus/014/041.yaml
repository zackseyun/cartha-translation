    rationale: Глагол שׁפך обозначает выливание, высыпание или сбрасывание. «Вынесут» передаёт лишь транспортировку и не отражает предписанного действия соскобленного материала.
  - severity: low
    issue: «Оскоблить»
    rationale: Слово не ошибочно, но «соскоблить» является более естественным и понятным современным литературным соответствием для קצע в данном контексте.
  revised_text: Пусть он велит соскоблить дом изнутри со всех сторон, а пыль, снятую при соскабливании, пусть высыплют в нечистое место за пределами города.
