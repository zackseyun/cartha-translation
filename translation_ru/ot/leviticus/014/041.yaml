revisions:
- from: Пусть он велит оскоблить дом изнутри со всех сторон, а снятую при соскабливании пыль пусть вынесут за город, на нечистое место.
  to: Пусть он велит соскоблить дом изнутри со всех сторон, а пыль, снятую при соскабливании, пусть высыплют в нечистое место за пределами города.
  rationale: Исправление восстанавливает конкретное значение וְשָׁפְכוּ («высыплют») и делает русский глагол для соскабливания более современным, сохраняя каузативное распоряжение, переход от единственного числа к исполнителям во множественном числе, ритуальный термин «нечистое» и отсутствие излишней конкретизации материала.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'Каузатив יַקְצִעַ верно передан как распоряжение выполнить работу; внутренние поверхности дома и их круговой охват также переданы точно. Однако וְשָׁפְכוּ означает «высыплют/выльют, сбросят», а не просто «вынесут»: последнее опускает прямо названное действие удаления материала. Направление к месту вне города и к нечистому месту следует сохранить.'
  naturalness: «Оскоблить» возможно, но в современном литературном русском менее обычно и менее прозрачно, чем «соскоблить». Конструкция «за город, на нечистое место» понятна, однако «в нечистое место за пределами города» яснее передаёт два направительных оборота оригинала.
  terminology: «Нечистое место» удачно сохраняет техническую левитскую категорию טָמֵא без моральной окраски. «Пыль» допустимо передаёт עָפָר и не добавляет неуказанный материал покрытия стен.
