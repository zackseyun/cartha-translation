source:
  edition: WLC
  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: ru
  text: Пусть он велит соскоблить дом изнутри со всех сторон, а пыль, снятую при соскабливании, пусть высыплют в нечистое место за пределами города.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַקְצִעַ
  choice: пусть он велит оскоблить
  rationale: Каузативная форма указывает, что священник распоряжается выполнить работу, а не обязательно делает её сам; «велит оскоблить» естественно передаёт это по-русски.
- source_word: מִבַּיִת סָבִיב
  choice: дом изнутри со всех сторон
  rationale: Оборот обозначает внутренние поверхности дома по всему периметру.
- source_word: וְשָׁפְכוּ
  choice: пусть вынесут
  rationale: Буквально глагол означает «высыпать/вылить», однако вместе с направлением за город речь идёт об удалении материала; «вынесут» ясно и естественно передаёт действие в данном контексте, не уточняя способ окончательного сброса.
- source_word: הֶעָפָר
  choice: пыль
  rationale: Прямое значение — «пыль, прах». Контекст допускает пыль или крошево от покрытия стен, но добавление «штукатурка» было бы конкретизацией сверх текста.
- source_word: אֲשֶׁר הִקְצוּ
  choice: снятую при соскабливании
  rationale: Передаёт материал, удалённый со стен тем же действием, которое названо в первой части стиха.
- source_word: אֶל מִחוּץ לָעִיר
  choice: за город
  rationale: Естественно передаёт направленное движение за пределы поселения.
- source_word: אֶל מָקוֹם טָמֵא
  choice: на нечистое место
  rationale: Сохраняет левитский термин ритуальной нечистоты и не придаёт ему нравственного смысла.
theological_decisions:
- issue: Передача טָמֵא в контексте левитской чистоты
  choice: нечистое
  alternative: осквернённое; ритуально нечистое
  rationale: «Нечистое» сохраняет техническую категорию ритуальной нечистоты; «осквернённое» могло бы ошибочно подразумевать нравственную вину, а вставка «ритуально» излишне разъясняет сам текст.
translation_notes:
  register: Современный литературный русский язык с ясной повелительно-нормативной формой. Сохранён переход от единственного числа распорядителя к неопределённым исполнителям; терминология не привязана к конфессиональной традиции.
