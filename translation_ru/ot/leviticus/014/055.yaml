  footnotes:
  - marker: a
    text: Еврейское цара́ат традиционно переводят словом «проказа», однако в книге Левит этот термин имеет более широкое значение и охватывает различные поражения, в том числе поражения одежды и домов.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: и о
  rationale: Союз с предлогом продолжает перечень случаев, к которым относится изложенный закон; «и о» естественно передаёт эту связь по-русски.
- source_word: צָרַעַת
  choice: поражение
  rationale: В Левите термин обозначает широкий разряд видимых поражений, включая поражения одежды и домов; поэтому традиционное «проказа» здесь было бы слишком узким и клинически вводящим в заблуждение.
- source_word: הַבֶּגֶד
  choice: на одежде
  rationale: Существительное обозначает предмет одежды; предлог «на» выражает место проявления поражения, ясное из контекста главы.
- source_word: וְלַבָּיִת
  choice: или на доме
  rationale: Еврейский союз буквально продолжает ряд, а русское «или» естественно передаёт перечисление различных объектов одного и того же вида поражения; «на доме» сохраняет представление о поражении его поверхности.
