  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: ru
  text: Тогда священник прикажет вынуть камни, в которых есть поражение, и выбросить их за город, в нечистое место.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוָּה
  choice: Тогда священник прикажет
  rationale: Сочетание waw с перфектом продолжает последовательность предписанных действий; «тогда» естественно передаёт переход к следующему этапу, а будущее совершенного вида сохраняет предписывающую силу.
- source_word: וְחִלְּצוּ
  choice: вынуть
  rationale: Глагол обозначает извлечение или удаление; применительно к камням стены «вынуть» конкретно и естественно, не добавляя не выраженных в тексте подробностей.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: на которых поражение
  rationale: נֶגַע в Лев 13–14 обозначает видимое поражение, вызывающее ритуальную нечистоту. «Поражение» не отождествляет явление с определённой современной болезнью или плесенью; предлог «на» естественен по-русски для признака на строительных камнях.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: и выбросить их
  rationale: В данном контексте השליך означает удалить посредством выбрасывания; инфинитив зависит от «прикажет» и образует естественную русскую конструкцию.
- source_word: אֶל מִחוּץ לָעִיר
  choice: за город
  rationale: Передаёт направленное движение во внешнее по отношению к поселению пространство и звучит естественно в современном русском языке.
- source_word: אֶל מָקוֹם טָמֵא
  choice: в нечистое место
  rationale: «Нечистое» сохраняет ключевую левитскую категорию ритуальной чистоты и не сводит её к обычной грязи или санитарной опасности.
theological_decisions:
- issue: Передача левитской терминологии ритуальной нечистоты
  choice: «нечистое» для טָמֵא и «поражение» для נֶגַע
  alternative: «осквернённое/нечистое» для טָמֵא; «заражение», «язва» или «плесень» для נֶגַע
  rationale: Текст регулирует ритуальную нечистоту, не устанавливая современного медицинского или научного диагноза. «Нечистое» сохраняет категориальный смысл, а «поражение» оставляет природу явления открытой.
translation_notes:
  register: Современный литературный русский язык; сдержанный, ясный регистр ритуально-правового предписания. Синтаксис упрощён без потери последовательности действий и без архаизации.
