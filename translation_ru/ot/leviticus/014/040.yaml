  source_fidelity: 'В целом смысл передан точно: священник отдаёт распоряжение удалить обозначенные камни и выбросить их за пределы города, в место, характеризуемое как ритуально нечистое. Однако еврейское בָּהֵן («в них») в основном тексте заменено на «на которых». Такая адаптация понятна по-русски, но пространственное соотнесение с камнями лучше сохранить без изменения.'
  naturalness: Конструкция с двумя инфинитивами после «прикажет» естественна для современного литературного русского. «Вынуть камни» и «выбросить их за город» ясны и соответствуют предписывающему регистру. Формулировка «в которых есть поражение» несколько менее гладка, чем «на которых», но остаётся понятной и точнее передаёт исходный текст.
  terminology: «Священник», «поражение» и «нечистое место» выбраны удачно. «Поражение» не навязывает современный диагноз и не сводит נֶגַע к плесени либо инфекции; «нечистое» сохраняет ритуально-категориальный смысл טָמֵא.
