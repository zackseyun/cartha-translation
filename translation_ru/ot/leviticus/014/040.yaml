  rationale: Убрана ненужная смена пространственной конструкции «в которых» на «на которых». Это приводит основной текст в более близкое соответствие с еврейским оригиналом; отдельная сноска больше не требуется. Остальные формулировки точны, естественны и сохраняют ритуально-правовой регистр.
