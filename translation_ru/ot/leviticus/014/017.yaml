base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: ru
  text: А из оставшегося масла, которое у него на ладони, священник пусть нанесёт немного на мочку правого уха очищаемого[a], на большой палец его правой руки и на большой палец правой ноги — поверх крови жертвы повинности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на кончик правого уха очищаемого». Еврейское слово обозначает наружную крайнюю часть уха; в данном обрядовом описании «мочка» — наиболее ясная передача.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: из оставшегося масла
  rationale: Передаёт значение остатка и партитивную силу предлога מִן естественным современным русским языком.
- source_word: עַל כַּפּוֹ
  choice: которое у него на ладони
  rationale: כַּף обозначает ладонь или углубление кисти; сочетание «на ладони» сохраняет пространственный образ еврейского עַל.
- source_word: יִתֵּן
  choice: пусть нанесёт немного
  rationale: В данном обрядовом контексте נתן означает нанесение масла; «немного» естественно показывает, что используется лишь часть оставшегося масла.
- source_word: תְּנוּךְ אֹזֶן
  choice: мочку ... уха
  rationale: Термин указывает на наружную крайнюю часть уха; «мочка уха» — ясное и традиционно понятное анатомическое обозначение в этом контексте.
- source_word: הַמִּטַּהֵר
  choice: очищаемого
  rationale: Причастная форма породы hitpael обозначает человека, проходящего обрядовое очищение; русский страдательный смысл сохраняет процессуальный оттенок.
- source_word: בֹּהֶן יָדוֹ
  choice: большой палец его ... руки
  rationale: בֹּהֶן применительно к руке обозначает большой палец.
- source_word: בֹּהֶן רַגְלוֹ
  choice: большой палец его ... ноги
  rationale: То же слово применительно к ноге обозначает большой палец ноги.
- source_word: עַל דַּם הָאָשָׁם
  choice: поверх крови жертвы повинности
  rationale: עַל здесь указывает, что масло наносят на те же места поверх уже нанесённой крови; אָשָׁם передан устойчивым русским названием данного вида жертвы.
theological_decisions:
- issue: Передача אָשָׁם как названия жертвоприношения
  choice: жертва повинности
  alternative: жертва за вину; жертва возмещения
  rationale: «Жертва повинности» — узнаваемый и достаточно точный русский термин для особого левитского жертвоприношения, связанного с виновностью и обязательством возмещения; он не сводит термин только к субъективному чувству вины.
translation_notes:
  register: Современный литературный русский язык с достойным обрядовым регистром. Синтаксис слегка упрощён ради ясности, повторяющаяся принадлежность частей тела сохранена. Подлинная пространственная связь масла с ранее нанесённой кровью выражена словом «поверх».
