  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: ru
  text: Затем священник возьмёт часть масла из лога[a] и нальёт его на ладонь своей левой руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Лог — древняя мера объёма жидкостей.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем священник возьмёт
  rationale: Форма с וְ продолжает последовательность предписанных обрядовых действий; русское будущее время естественно передаёт инструктивный характер текста.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: часть масла из лога
  rationale: 'Предлог מִן имеет здесь исходно-партитивный смысл: священник берёт не всю меру, а некоторое количество масла из неё.'
- source_word: לֹג
  choice: лог
  rationale: Сохранено название древней меры жидкости; замена современным объёмом создала бы ложную точность.
- source_word: וְיָצַק
  choice: и нальёт
  rationale: Будущее время согласовано с предыдущим глаголом и естественно передаёт очередное действие ритуального предписания.
- source_word: עַל כַּף
  choice: на ладонь
  rationale: עַל буквально указывает на помещение масла на поверхность ладони; русское «налить на ладонь» естественно и сохраняет конкретную деталь обряда.
- source_word: הַכֹּהֵן הַשְּׂמָאלִית
  choice: себе на ладонь левой руки
  rationale: Повтор слова «священник» в еврейском тексте уточняет, что речь идёт о его собственной левой ладони; возвратное местоимение «себе» передаёт это без тяжеловесного повтора.
