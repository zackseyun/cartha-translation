lexical_decisions:
- source_word: וְעָשָׂה
  choice: И пусть он принесёт
  rationale: Хотя глагол буквально означает «делать, совершать», в контексте жертвоприношения он обозначает принесение жертвы. Такой перевод естественно передаёт культовый смысл.
- source_word: אֶת הָאֶחָד
  choice: одну / одного
  rationale: Форма означает одну птицу из названных далее разновидностей; род числительного согласован в русском языке с каждым названием птицы.
- source_word: מִן הַתֹּרִים
  choice: из горлиц
  rationale: תֹּרִים обозначает именно горлиц, регулярно упоминаемых в предписаниях о жертвоприношениях.
- source_word: אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: или одного из молодых голубей
  rationale: Буквально «из сынов голубя» — устойчивое древнееврейское обозначение молодых голубей. Повтор числительного необходим для ясного и грамматически естественного русского текста.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: в зависимости от того, что ему по средствам
  rationale: Буквально «из того, чего достигнет его рука»; это древнееврейская идиома, указывающая на материальные возможности человека. Выражение «ему по средствам» ясно и естественно передаёт экономический смысл.
