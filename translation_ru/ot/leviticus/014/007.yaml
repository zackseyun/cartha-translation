  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: ru
  text: Он семь раз окропит очищаемого от кожной болезни[a], объявит его чистым[b] и выпустит живую птицу в открытое поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционный перевод — «проказа». Еврейское слово обозначает в Левите более широкий круг кожных поражений и не обязательно соответствует современной проказе.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «признает его чистым». Речь идёт об обрядово-правовом решении священника, а не только о медицинском заключении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: окропит
  rationale: В обрядовом контексте порода hифиль глагола נזה означает разбрызгивание или окропление жидкостью. По-русски переходный глагол естественно соединяется здесь с обозначением человека, на которого совершается окропление; подразумеваемая жидкость ясна из предыдущего стиха.
- source_word: הַמִּטַּהֵר
  choice: очищаемого
  rationale: Причастие породы hitпаэль от טהר обозначает человека, проходящего установленный обряд очищения. Форма «очищаемого» сохраняет процессуальный и обрядовый смысл.
- source_word: מִן הַצָּרַעַת
  choice: от кожной болезни
  rationale: Термин צָרַעַת в Левите охватывает категорию кожных поражений и не тождествен современному диагнозу болезни Хансена. Выражение «кожная болезнь» понятно современному читателю и не создаёт ложной медицинской точности.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямой и естественный русский эквивалент числового обстоятельства.
- source_word: וְטִהֲרוֹ
  choice: объявит его чистым
  rationale: В священническом и правовом контексте действие означает официальное признание обрядового статуса человека, а не только физическое исцеление или очищение.
- source_word: וְשִׁלַּח
  choice: выпустит
  rationale: Глагол שׁלח здесь обозначает отпускание живой птицы. «Выпустит» естественно передаёт освобождение птицы в рамках обряда.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: живую птицу
  rationale: Определение отличает эту птицу от заколотой ранее; русский оборот краток и точен.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: в открытое поле
  rationale: Еврейское выражение передаёт движение птицы на открытый простор поля. Такой перевод сохраняет пространственный образ и звучит естественно по-русски.
theological_decisions:
- issue: Передача צָרַעַת
  choice: кожная болезнь
  alternative: проказа
  rationale: Библейский термин обозначает более широкую обрядовую категорию, чем современная проказа; поэтому традиционный эквивалент мог бы внести анахроничную медицинскую определённость.
- issue: Характер действия וְטִהֲרוֹ
  choice: объявит его чистым
  alternative: очистит его
  rationale: Формулировка сохраняет священнический, обрядово-правовой характер решения и не сводит его к медицинскому действию.
translation_notes:
  register: Современный литературный русский язык с краткой, предписывающей синтаксической формой. Сохранены обрядовая терминология, последовательность действий и различие между процессом очищения и официальным признанием чистоты.
