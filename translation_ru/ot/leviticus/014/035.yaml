  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: ru
  text: 'Тогда хозяин дома пусть придёт и сообщит священнику: «В доме у меня появилось что-то вроде поражения».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как поражение». Хозяин сообщает лишь о внешне похожем явлении, не ставя окончательного диагноза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Тогда ... пусть придёт
  rationale: Соединённая с союзом форма перфекта в последовательности правовых предписаний обозначает следующий этап процедуры; «тогда» и «пусть придёт» естественно передают это в современном русском языке.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: хозяин дома
  rationale: 'Буквально: «тот, кому принадлежит дом». «Хозяин дома» — краткое и естественное обозначение владельца без изменения смысла.'
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: и сообщит священнику
  rationale: Hифиль глагола נגד означает «дать знать, сообщить»; русский глагол «сообщить» сохраняет официальный характер обращения.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский вводный оборот «говоря» в современном русском естественно передаётся пунктуационным введением прямой речи.
- source_word: כְּנֶגַע
  choice: нечто похожее на поражение
  rationale: Префикс כ выражает подобие и неуверенность, а נגע в данном разделе обозначает наблюдаемое поражение дома. Формулировка не приписывает хозяину окончательный диагноз.
- source_word: נִרְאָה לִי
  choice: у меня появилось
  rationale: Нифаль ראה может означать «показалось, появилось, было замечено». В сочетании с осторожным כְּנֶגַע эта формулировка естественно передаёт личное наблюдение владельца.
- source_word: בַּבָּיִת
  choice: в доме
  rationale: Предлог ב здесь указывает на дом как место обнаруженного поражения; широкое «в доме» точно и естественно.
theological_decisions:
- issue: Кто устанавливает наличие ритуально значимого поражения
  choice: 'Речь хозяина оставлена предварительной: «нечто похожее на поражение».'
  alternative: «В доме появилась язва/проказа».
  rationale: 'Текст не позволяет хозяину ставить окончательный диагноз: כ («как, похожее на») сохраняет различие между его наблюдением и последующим решением священника.'
translation_notes:
  register: Современный литературный русский язык с достоинством правового предписания. «Поражение» выбрано вместо медицински узкого «инфекция» и двусмысленного для современного читателя «язва»; осторожность исходной формулировки сохранена.
