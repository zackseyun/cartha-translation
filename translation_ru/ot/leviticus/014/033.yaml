  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею и Аарону:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма вводит новый речевой акт. В современной русской библейской прозе «сказал» естественно передаёт формулу וַיְדַבֵּר ... לֵאמֹר без тяжеловесного «говорил, говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно обозначает обоих адресатов речи; повтор предлога в русском не требуется.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив вводит последующую прямую речь. Поскольку её содержание следует в следующем стихе, двоеточие функционально и естественно передаёт еврейскую формулу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное божественное имя. «Яхве» прямо передаёт тетраграмматон, не заменяя его титулом и не навязывая конфессиональную традицию произношения «Иегова».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формульное לֵאמֹר передано пунктуационно, чтобы избежать неестественного «говоря»; двоеточие также показывает, что прямая речь продолжается в следующем стихе.
