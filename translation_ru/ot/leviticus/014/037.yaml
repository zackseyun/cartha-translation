id: LEV.14.37
reference: Leviticus 14:37
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/רָאָ֣ה אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ בְּ/קִירֹ֣ת הַ/בַּ֔יִת שְׁקַֽעֲרוּרֹת֙ יְרַקְרַקֹּ֔ת א֖וֹ אֲדַמְדַּמֹּ֑ת וּ/מַרְאֵי/הֶ֥ן שָׁפָ֖ל מִן הַ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: ru
  text: Он осмотрит поражённое место, и если увидит, что на стенах дома есть зеленоватые или красноватые впадины[a] и на вид они ниже поверхности стены[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «углубления».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и вид их ниже стены», то есть они кажутся углублёнными относительно поверхности стены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Он осмотрит
  rationale: В контексте установленного священнического обследования глагол означает не просто зрительное восприятие, а внимательный осмотр.
- source_word: הַנֶּגַע
  choice: поражённое место
  rationale: В отношении дома слово обозначает аномальный участок поражения; эта формулировка естественнее по-русски, чем «язва» или «чума», и не предполагает собственно медицинской инфекции.
- source_word: וְהִנֵּה
  choice: и если увидит, что
  rationale: В процедурной речи оборот вводит обнаруженное при осмотре условие; перевод передаёт его функцию без архаического «вот».
- source_word: בְּקִירֹת הַבַּיִת
  choice: на стенах дома
  rationale: Русское «на стенах» естественно обозначает видимые участки в поверхности стен, не отрицая их углублённости.
- source_word: שְׁקַעֲרוּרֹת
  choice: впадины
  rationale: Редкое слово обозначает углублённые, запавшие участки; «впадины» ясно и кратко передаёт этот признак.
- source_word: יְרַקְרַקֹּת
  choice: зеленоватые
  rationale: Редуплицированная форма выражает оттенок цвета, а не обязательно насыщенный зелёный цвет.
- source_word: אֲדַמְדַּמֹּת
  choice: красноватые
  rationale: Редуплицированная форма указывает на красноватый оттенок.
- source_word: וּמַרְאֵיהֶן שָׁפָל מִן הַקִּיר
  choice: и на вид они ниже поверхности стены
  rationale: Сохранено буквальное пространственное сравнение «ниже стены», а добавление «поверхности» делает подразумеваемую точку сравнения ясной по-русски.
