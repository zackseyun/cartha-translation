  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: ru
  text: И двух горлиц или двух молодых голубей, если позволяют ему средства. Одна птица будет жертвой за грех[a], а другая — жертвой всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительной жертвой». Еврейское слово может обозначать жертву, служащую для ритуального очищения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: и двух горлиц
  rationale: Союз продолжает перечень предыдущего стиха; תֹרִים точно обозначает горлиц как один из видов жертвенных птиц.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: или двух молодых голубей
  rationale: Еврейское выражение буквально означает «два птенца голубя» и указывает на молодых голубей.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: каких он в состоянии приобрести
  rationale: Идиома «которых достигнет его рука» обозначает доступность по средствам; формулировка связывает относительное местоимение именно с птицами и естественно передаёт экономическое ограничение.
- source_word: וְהָיָה אֶחָד
  choice: Одна птица будет
  rationale: Добавление «птица» ясно передаёт подразумеваемый референт и распределение двух птиц по видам жертвы.
- source_word: חַטָּאת
  choice: жертвой за грех
  rationale: Это традиционный и узнаваемый русский культовый термин; возможный оттенок очистительной жертвы сохранён в сноске.
- source_word: וְהָאֶחָד עֹלָה
  choice: а другая — всесожжением
  rationale: Артикль и повтор числительного создают противопоставление «одна — другая»; עֹלָה передано устоявшимся русским термином «всесожжение».
theological_decisions:
- issue: Значение חַטָּאת в обряде очищения
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин связан как с грехом, так и с ритуальным очищением. В основном тексте сохранено традиционное обозначение, а ритуальный оттенок отмечен в сноске, чтобы не устранять смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением принятой библейской жертвенной терминологии. Эллипсис во второй части передан естественной конструкцией «одна… а другая…».
