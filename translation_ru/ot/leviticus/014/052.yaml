source:
  edition: WLC
  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: ru
  text: Так он очистит дом кровью птицы, живой водой[a], живой птицей, кедровой древесиной, иссопом и алой нитью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть свежей или проточной водой из источника; буквально: «живой водой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «алой пряжей». Еврейское выражение обозначает окрашенный в алый цвет материал, использовавшийся в обряде очищения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: Так он очистит
  rationale: Пиэль глагола חטא в данном обрядовом контексте означает очистить от ритуального осквернения. «Так» естественно связывает итоговое действие с описанной выше процедурой.
- source_word: הַבַּיִת
  choice: дом
  rationale: Здесь בַּיִת обозначает физическое строение, которое подвергается обрядовому очищению.
- source_word: בְּדַם הַצִּפּוֹר
  choice: кровью птицы
  rationale: Предлог ב обозначает средство очищения; русский творительный падеж передаёт это естественно и точно.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: живой водой
  rationale: Сохранено буквальное и устойчивое библейское выражение «живая вода», обозначающее свежую воду из текущего источника; пояснение дано в сноске.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: живой птицей
  rationale: Определение отличает эту птицу от заколотой птицы, кровь которой используется в обряде.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: кедровой древесиной
  rationale: עֵץ с названием породы дерева здесь указывает на древесину, использованную в обряде; «древесина» точнее, чем название самого дерева.
- source_word: וּבָאֵזֹב
  choice: иссопом
  rationale: «Иссоп» — традиционное обозначение обрядового растения; его точная ботаническая идентификация остаётся спорной.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: алой нитью
  rationale: Выражение обозначает окрашенный в алый цвет материал, вероятно нить или пряжу. «Алая нить» ясно и естественно звучит на современном русском языке.
theological_decisions:
- issue: Значение חטא в породе пиэль применительно к дому
  choice: очистит
  alternative: совершит очищение за дом / искупит дом
  rationale: Контекст описывает устранение ритуального осквернения дома, а не прощение нравственной вины; перевод «очистит» передаёт обрядовый смысл, не привнося дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского обрядового выражения «живая вода». Перечень средств очищения передан параллельными формами творительного падежа. Архаичное «червлёная» заменено общепонятным «алая».
