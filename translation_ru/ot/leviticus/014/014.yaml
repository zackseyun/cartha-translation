  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: ru
  text: И возьмёт священник немного крови жертвы повинности[a] и нанесёт её на мочку правого уха[b] очищаемого, на большой палец его правой руки и на большой палец его правой ноги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из крови жертвы повинности».'
    reason: Сноска сохраняет формальную конструкцию оригинала, тогда как основной текст естественно выражает её партитивный смысл.
  - marker: b
    text: 'Возможный перевод: «на край правого уха».'
    reason: Точное анатомическое значение תְּנוּךְ не вполне определённо; основной текст использует традиционно вероятное «мочка», а сноска сохраняет лексическую альтернативу.
lexical_decisions:
- source_word: מִדַּם
  choice: немного крови
  rationale: 'Предлог מִן при слове «кровь» имеет здесь партитивный смысл: священник берёт часть крови для обряда. «Немного крови» ясно и естественно передаёт этот смысл по-русски.'
- source_word: הָאָשָׁם
  choice: жертва повинности
  rationale: В левитском жертвенном контексте אָשָׁם обозначает особый вид жертвы; «жертва повинности» — точный и узнаваемый русский эквивалент, не сводящий её значение только к возмещению ущерба.
- source_word: תְּנוּךְ אֹזֶן
  choice: мочка уха
  rationale: תְּנוּךְ обозначает крайнюю или мягкую часть уха; «мочка уха» является естественным современным анатомическим обозначением, хотя возможен более общий перевод «край уха».
- source_word: הַמִּטַּהֵר
  choice: очищаемый
  rationale: Причастие породы hitpael в данном ритуальном контексте обозначает человека, проходящего обряд очищения. Русское «очищаемый» сохраняет процессуальность и не подразумевает самостоятельного очищения.
- source_word: בֹּהֶן יָדוֹ
  choice: большой палец его руки
  rationale: При слове «рука» בֹּהֶן означает большой палец.
- source_word: בֹּהֶן רַגְלוֹ
  choice: большой палец его ноги
  rationale: При слове «нога» בֹּהֶן означает большой палец ноги; такая формулировка естественна в современном русском.
- source_word: וְלָקַח ... וְנָתַן
  choice: возьмёт ... нанесёт
  rationale: В предписывающем контексте эти формы выражают обязательное ритуальное действие. Будущее совершенного вида естественно передаёт библейскую законодательную инструкцию; «нанесёт» точнее описывает нанесение крови на части тела, чем нейтральное «положит».
theological_decisions:
- issue: Характер очищения участника обряда
  choice: «очищаемый» — человек, проходящий совершаемый над ним обряд очищения
  alternative: «очищающий себя» или «очистившийся»
  rationale: Контекст описывает действия священника над участником обряда. Выбор сохраняет процессуальный смысл еврейского причастия и не приписывает человеку автономного самоочищения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, законодательным ритмом. Повтор подлежащего во второй еврейской клаузе не воспроизведён, поскольку по-русски он тяжеловесен и не добавляет смысла. Порядок трёх частей тела сохранён.
