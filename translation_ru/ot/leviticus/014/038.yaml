lexical_decisions:
- source_word: וְיָצָא
  choice: Тогда ... выйдет
  rationale: В процедурно-правовом контексте форма с וְ продвигает последовательность действий; «тогда» естественно передаёт очередность предписанных шагов.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Стандартное соответствие для כֹּהֵן в законодательных текстах Левита; определённость ясна из контекста.
- source_word: מִן הַבַּיִת
  choice: из дома
  rationale: При глаголе движения יָצָא сочетание естественно передаётся по-русски как «выйдет из дома».
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: ко входу в дом
  rationale: פֶּתַח обозначает вход или проём; «вход в дом» звучит естественно и не предполагает непременно наличия двери.
- source_word: וְהִסְגִּיר
  choice: и запрёт
  rationale: Порода хифиль глагола סגר здесь означает закрыть дом, прекратив к нему доступ на установленный срок. «Запрёт» сохраняет конкретный образ действия, а примечание отражает более общее значение ограничения доступа.
- source_word: אֶת הַבַּיִת
  choice: дом
  rationale: Показатель прямого дополнения не переводится; определённый объект естественно передан существительным «дом».
- source_word: שִׁבְעַת יָמִים
  choice: на семь дней
  rationale: Русский предлог «на» естественно выражает срок, в течение которого дом остаётся закрытым.
