  verdict: revise
  source_fidelity: 'Основной смысл передан верно: условие, возвращение נגע, его новое проявление в доме и три предшествующих действия сохранены. Однако «распространится по дому» сильнее, чем וּפָרַח בַּבַּיִת: глагол образно говорит о появлении/вспышке, но не обязательно о распространении по всему дому. Наречие «снова» также излишне добавляет повторность ко второму глаголу, тогда как повторное появление уже выражено «вернётся».'
  naturalness: «Поражение вернётся и вновь проявится в доме» естественно для современного литературного русского и сохраняет два глагола оригинала. «Соскоблили покрытие с дома» яснее и современнее, чем редкое «оскоблили дом», при этом передаёт физическое действие, а не обобщённую очистку. Конечная запятая необходима, поскольку фраза продолжается в следующем стихе.
  terminology: «Поражение» удачно передаёт технически широкий נגע, который в данном разделе относится также к дому и не должен безоговорочно называться инфекцией. Сноска сохранена, но её варианты и пояснение уточнены, чтобы не характеризовать состояние как непременно инфекционное или медицински установленное.
