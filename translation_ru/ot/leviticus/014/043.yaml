base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: ru
  text: Но если поражение[a] вернётся и вновь проявится в доме после того, как удалили камни, после того, как соскоблили покрытие с дома, и после того, как его оштукатурили,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заражение» или «недуг». Еврейское нега́ — специальный термин в книге Левит для поражающего состояния или явления, которое может относиться к людям, одежде или домам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Вводит следующий условный случай в последовательности предписаний; «но» естественно обозначает контраст с ожидаемым результатом очистки.
- source_word: יָשׁוּב הַנֶּגַע
  choice: поражение вернётся
  rationale: שוב указывает на повторное появление, а נגע — техническое обозначение заметного патологического состояния, которое в Левите может относиться к людям, одежде и домам.
- source_word: וּפָרַח בַּבַּיִת
  choice: и снова распространится по дому
  rationale: פרח буквально связано с прорастанием или разрастанием, а здесь образно описывает новое развитие поражения; «распространится» ясно передаёт смысл применительно к дому. «Снова» естественно выражает повторность, заданную сочетанием с ישוב.
- source_word: אַחַר חִלֵּץ אֶת הָאֲבָנִים
  choice: после того, как вынули камни
  rationale: Безличная форма не уточняет исполнителя действия и естественно передаёт предписанное удаление поражённых камней.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת הַבַּיִת
  choice: после того, как оскоблили дом
  rationale: Глагол обозначает физическое соскабливание поверхности, а не обобщённую уборку или очистку.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: и после того, как его оштукатурили
  rationale: טוח означает покрытие обмазкой или штукатуркой; местоимение «его» ясно отсылает к дому, не вводя неуказанного деятеля.
