  rationale: Исправлен чрезмерно сильный оттенок «распространится по дому» на «вновь проявится в доме», что точнее воспроизводит различие между «вернётся» и образным «расцветёт/вспыхнет». Уточнено действие соскабливания в естественной русской форме. Сноска переработана для терминологической нейтральности и сохранения широты еврейского נגע.
