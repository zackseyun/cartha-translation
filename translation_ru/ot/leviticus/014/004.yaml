base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: ru
  text: Затем священник велит взять для очищаемого двух живых чистых птиц, кедровую древесину, алую пряжу[a] и иссоп[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «алую нить». Еврейское выражение שְׁנִי תוֹלַעַת обозначает материал, окрашенный в ярко-красный цвет; точная форма этого материала не указана.'
    reason: lexical_alternative
  - marker: b
    text: Точно определить растение, названное еврейским словом אֵזֹב, невозможно; здесь сохранён традиционный перевод «иссоп».
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: Затем священник велит
  rationale: В последовательности обрядовых предписаний форма с וְ продвигает повествование к следующему действию; настоящее время в русском естественно выражает обязательное предписание.
- source_word: וְלָקַח
  choice: взять
  rationale: Хотя еврейский глагол имеет форму 3-го лица единственного числа, после повеления священника он идиоматически обозначает то, что велено доставить необходимые предметы; инфинитив естественно передаёт эту зависимость.
- source_word: לַמִּטַּהֵר
  choice: для очищаемого
  rationale: Причастие породы Hitpael обозначает человека, проходящего обряд очищения; вариант сохраняет значение продолжающегося процесса и ритуальный контекст.
- source_word: שְׁתֵּי צִפֳּרִים חַיּוֹת טְהֹרוֹת
  choice: двух живых чистых птиц
  rationale: צִפּוֹר — общее обозначение птицы, без основания уточнять вид; определения «живых» и «чистых» сохранены в их прямом ритуальном значении.
- source_word: עֵץ אֶרֶז
  choice: кедровое дерево
  rationale: Сочетание обозначает древесину кедра как обрядовый материал; русский вариант не добавляет отсутствующего в тексте уточнения о размере или форме куска.
- source_word: שְׁנִי תוֹלַעַת
  choice: червлёную пряжу
  rationale: Выражение обозначает материал, окрашенный в ярко-красный цвет красителем, получаемым из насекомого; «пряжа» ясно передаёт вид материала, но допустимо и «нить».
- source_word: אֵזֹב
  choice: иссоп
  rationale: Сохранено традиционное библейское название растения, поскольку его точная ботаническая идентификация остаётся спорной.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным регистром обрядового предписания. Порядок фразы слегка адаптирован к русскому синтаксису, при этом весь перечень предметов однозначно зависит от глагола «взять». Маркеры сносок поставлены непосредственно после соответствующих спорных терминов.
