  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: ru
  text: Затем священник возьмёт ягнёнка для жертвы повинности[a] и лог масла[b], и священник совершит над ними обряд потрясания пред Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ягнёнка жертвы повинности».'
    reason: lexical_alternative
  - marker: b
    text: Лог — древнеизраильская мера объёма жидкостей.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем ... возьмёт
  rationale: Форма с союзом продолжает последовательность обрядовых предписаний; «затем» естественно передаёт переход к следующему действию.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычный эквивалент в культовом контексте; повтор подлежащего сохранён вслед за еврейским текстом.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: ягнёнка для жертвы повинности
  rationale: Конструкция обозначает ягнёнка, предназначенного для особого вида жертвы אָשָׁם. «Жертва повинности» сохраняет категорию жертвоприношения и связь с возникшей виной или ответственностью.
- source_word: לֹג הַשָּׁמֶן
  choice: лог масла
  rationale: לֹג — конкретная древнеизраильская мера жидкости; транслитерация сохраняет техническую точность, а пояснение дано в сноске.
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: совершит ими обряд возношения
  rationale: Сочетание родственных глагола и существительного обозначает ритуальное представление дара движением перед Яхве. Русская формулировка передаёт единый обряд и избегает неестественного буквального повтора.
- source_word: אֹתָם
  choice: ими
  rationale: Множественное местоимение совместно относится к ягнёнку и логу масла; творительный падеж естественно сочетается с выбранной русской конструкцией.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Культовая формула указывает на совершение обряда в присутствии Бога; имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; «Яхве» передаёт личное заветное имя и соответствует принятому принципу перевода.
- issue: Передача אָשָׁם как названия жертвы
  choice: жертва повинности
  alternative: жертва за вину; жертва преступления
  rationale: «Жертва повинности» выражает особую культовую категорию, связанную с виной и обязательством возмещения, не отождествляя её без пояснения с другими жертвами.
- issue: Характер действия תנופה
  choice: обряд возношения
  alternative: потрясание; жертва потрясания; представление движением
  rationale: Точный вид ритуального движения не вполне ясен; формулировка сохраняет технический культовый смысл и не навязывает излишне конкретную реконструкцию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром, уместным для обрядового законодательства. Технические термины сохранены там, где их обобщение привело бы к потере смысла; все сноски отмечены в основном тексте.
