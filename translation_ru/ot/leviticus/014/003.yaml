  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: ru
  text: 'Священник выйдет за пределы стана и осмотрит его. И вот: поражение, называемое цараат[a], прошло у человека, поражённого цараат,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское цараат — общее название ряда поражений кожи, связанных с ритуальной нечистотой; оно не обязательно означает проказу в современном медицинском смысле. Традиционный перевод: «проказа».'
    reason: Уточнение историко-медицинского значения термина и сохранение традиционного соответствия.
lexical_decisions:
- source_word: וְיָצָא
  choice: выйдет
  rationale: В предписывающем контексте форма обозначает следующее действие священника; русское будущее время естественно передаёт порядок обряда.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное соответствие культовому термину; второе упоминание не повторено, поскольку в русском при одном действующем лице оно утяжеляет фразу без потери смысла.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Передаёт направленность אֶל и местонахождение вне стана естественным современным русским выражением.
- source_word: וְרָאָה
  choice: осмотрит больного
  rationale: В законодательстве об освидетельствовании ראה означает не просто увидеть, а внимательно осмотреть; подразумеваемое дополнение выражено для ясности.
- source_word: וְהִנֵּה
  choice: и вот, если
  rationale: «И вот» сохраняет указательную силу частицы, а «если» естественно вводит обнаруженное при осмотре условие в русском процедурном изложении.
- source_word: נִרְפָּא
  choice: прошло
  rationale: Нифаль обозначает наступившее исцеление или исчезновение поражения; применительно к поражению кожи «прошло» звучит естественно и сохраняет результативность.
- source_word: נֶגַע הַצָּרַעַת
  choice: поражение цараат
  rationale: נגע передано как «поражение», а транслитерация цараат избегает ошибочного отождествления древней категории с современной болезнью Хансена.
- source_word: מִן הַצָּרוּעַ
  choice: у поражённого
  rationale: Предлог מן выражает удаление поражения от человека; русское «прошло у» естественно передаёт этот смысл. Субстантивированное «поражённый» сохраняет связь с צָרַעַת.
theological_decisions:
- issue: Значение צָרַעַת и הַצָּרוּעַ
  choice: цараат / поражённый
  alternative: проказа / прокажённый; кожная болезнь / больной кожной болезнью
  rationale: Библейское צָרַעַת охватывает ритуально значимые поражения и не тождественно современной болезни Хансена. Транслитерация сохраняет особую древнюю категорию, а примечание разъясняет её без ложной медицинской определённости.
- issue: Условная или указательная сила וְהִנֵּה
  choice: и вот, если
  alternative: и вот; и если
  rationale: Сочетание сохраняет заметность еврейской частицы и одновременно ясно показывает условный характер результата осмотра в законодательном контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейско-правовым регистром. «Стан» сохранён как понятное традиционное обозначение лагеря Израиля. Термин «цараат» транслитерирован и пояснён в сноске; пунктуация показывает, что стих синтаксически продолжается далее.
