  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: ru
  text: чтобы наставлять о том, что нечисто и что чисто. Вот закон о поражении, связанном с ритуальной нечистотой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «проказа». Еврейское слово обозначает поражения, которые могли обнаруживаться у людей, на тканях или в домах, и не ограничивается современной болезнью Хансена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: чтобы указывать
  rationale: Форма породы хифиль передаёт авторитетное указание или наставление, позволяющее распознавать установленные законом состояния.
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: когда оно нечисто и когда чисто
  rationale: Оборот с בְּיוֹם здесь обозначает время или случай наступления состояния, а не два буквальных календарных дня. Местоимение сохраняет обобщённость, поскольку предыдущие постановления касаются людей, тканей и домов.
- source_word: תּוֹרַת
  choice: закон о
  rationale: В заключительной формуле תּוֹרָה обозначает совокупность обязательных предписаний по названному вопросу; «закон» естественно передаёт юридико-наставительный характер контекста.
- source_word: הַצָּרָעַת
  choice: поражение, вызывающее нечистоту
  rationale: Еврейское слово обозначает особую ритуальную категорию, которая может относиться к человеческому телу, тканям и домам. Выбранное выражение не сводит её к конкретному современному заболеванию и передаёт общий для всех случаев результат — состояние нечистоты.
theological_decisions:
- issue: Передача צָרַעַת в законах о чистоте
  choice: поражение, вызывающее нечистоту
  alternative: проказа; кожная болезнь; цараат
  rationale: «Проказа» может ошибочно отождествить древнюю категорию с болезнью Хансена, а «кожная болезнь» не охватывает ткани и дома. Описательная передача сохраняет ритуально-правовой смысл и широту еврейского термина, не превращая нечистоту в нравственную вину.
translation_notes:
  register: Современный литературный русский язык с краткой заключительной формулой. Строчная начальная буква сохранена, поскольку инфинитивная конструкция синтаксически продолжает предыдущее предложение. Формулировка избегает как устаревшего медицинского отождествления, так и морального оттенка слова «осквернение».
