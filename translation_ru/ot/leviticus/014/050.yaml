  source_fidelity: 'В черновике неверно соотнесены пространственные отношения: «над глиняным сосудом с живой водой» представляет сосуд как место над которым совершается действие, тогда как אֶל כְּלִי חֶרֶשׂ указывает на сосуд как на принимающий кровь, а עַל относится к живой воде. Русская формулировка должна ясно показать сосуд, содержащий воду, и заклание над ним. Определённое «птицу, одну» в контексте двух птиц лучше передать как «одну из птиц».'
