  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: ru
  text: Затем пусть он заколет одну из птиц над глиняным сосудом, в котором находится живая вода[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живая вода»; то есть свежая, проточная вода.'
    reason: Поясняется древнееврейский идиоматический оборот, буквальная форма которого сохранена в тексте.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Затем пусть он заколет
  rationale: Последовательная глагольная форма продолжает порядок обрядовых предписаний. «Затем» передаёт последовательность, «пусть» — предписывающую силу, а «заколет» точно обозначает ритуальное умерщвление.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: одну птицу
  rationale: Сочетание буквально означает «птицу, одну» и выделяет одну из двух ранее названных птиц, не называя её первой.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: над глиняным сосудом
  rationale: 'Предлог אֶל указывает направленность действия к сосуду: птицу закалывают так, чтобы кровь попадала в него. В сочетании с последующим עַל естественный русский оборот «над сосудом» передаёт практическую обстановку обряда без неуклюжего «в сосуд» при глаголе «заколоть».'
- source_word: כְּלִי חֶרֶשׂ
  choice: глиняный сосуд
  rationale: Современное и точное обозначение сосуда из обожжённой глины; оно понятно обычному читателю и соответствует ритуальному контексту.
- source_word: עַל מַיִם חַיִּים
  choice: с живой водой
  rationale: עַל здесь связывает сосуд с находящейся в нём водой. Оборот «с живой водой» естественно выражает это по-русски, а буквальный образ מַיִם חַיִּים сохраняется в основном тексте.
theological_decisions:
- issue: Передача מַיִם חַיִּים в предписании об очищении
  choice: живая вода
  alternative: свежая или проточная вода
  rationale: Буквальное «живая вода» сохраняет устойчивый библейский образ и его возможные межтекстовые связи, не превращая их в толкование. Предметный смысл — свежая, текущая, не застоявшаяся вода — пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным стилем ритуального предписания. Конструкция «пусть он заколет» сохраняет нормативный характер текста; архаизмы не используются.
