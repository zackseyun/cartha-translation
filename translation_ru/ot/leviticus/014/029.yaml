  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: ru
  text: А оставшееся масло, которое на ладони священника, он нанесёт на голову того, кто проходит очищение, чтобы совершить за него искупление пред Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן־הַשֶּׁמֶן
  choice: А оставшееся масло
  rationale: Причастие הַנּוֹתָר обозначает то, что осталось; русское «оставшееся масло» естественно передаёт партитивную конструкцию с מִן и сохраняет связь с предшествующими действиями обряда.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: которое на ладони священника
  rationale: כַּף здесь означает ладонь или углубление ладони. Предлог עַל передан прямо как «на»; оборот остаётся конкретным и понятным в контексте обряда.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: он нанесёт на голову
  rationale: נתן имеет широкое значение «дать, положить, поместить». Применительно к маслу русское «нанесёт» естественно описывает ритуальное действие, не добавляя способа нанесения.
- source_word: הַמִּטַּהֵר
  choice: того, кто проходит очищение
  rationale: Причастная форма Hitpael указывает на человека, находящегося в процессе обрядового очищения. Такая формулировка яснее и естественнее буквального «очищающегося» и не представляет очищение уже завершённым.
- source_word: לְכַפֵּר עָלָיו
  choice: чтобы совершить за него искупление
  rationale: כפר — ключевой культовый термин; «совершить искупление» сохраняет его богословский вес, а עָלָיו обозначает человека, ради которого совершается действие.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי выражает совершение обряда в присутствии Бога, а имя יהוה передано как «Яхве», то есть как личное заветное имя.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и отличает его от титула «Господь».
- issue: Значение לְכַפֵּר в обрядовом контексте
  choice: совершить искупление
  alternative: очистить / загладить вину
  rationale: Перевод сохраняет традиционную культовую многозначность корня כפר и не сводит действие исключительно к очищению либо прощению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Форма «пред Яхве» сохраняет торжественность, а выражение «проходит очищение» делает ритуальный процесс понятным современному читателю.
