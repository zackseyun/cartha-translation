  source_fidelity: 'Основной смысл передан верно: священник берёт одного из ягнят, представляет его как אָשָׁם вместе с логом масла и совершает ритуальное действие над обоими предметами перед Яхве. Однако «обряд возношения» может ошибочно сводить הניף/תְּנוּפָה к поднятию; здесь следует сохранить техническое значение ритуального потрясания/помахивания.'
  naturalness: «Пусть возьмёт» в законодательном повествовании менее естественно, чем простое будущее время. Формула «совершит ими обряд» несколько тяжеловесна; «совершит над ними обряд потрясания» яснее и естественнее.
  terminology: «Жертва повинности» — приемлемая передача אָשָׁם, а «Яхве» точно передаёт тетраграмматон. «Лог» уместно сохранён как специальная мера. Технический термин תְּנוּפָה лучше передавать как «обряд потрясания», а не «возношение», поскольку направление движения в еврейском тексте не уточняется.
