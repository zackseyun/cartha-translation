  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: ru
  text: Затем священник возьмёт одного ягнёнка и представит его в качестве жертвы повинности[a] вместе с логом масла[b]; он совершит над ними обряд потрясания перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в качестве жертвы возмещения». Еврейское слово אָשָׁם может указывать как на виновность, так и на возмещение причинённого ущерба.'
    reason: lexical_alternative
  - marker: b
    text: Лог — небольшая древнеизраильская мера жидкости, приблизительно треть литра.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем ... пусть возьмёт
  rationale: Последовательный waw продолжает описание обряда; «затем» ясно передаёт переход к следующему действию, а конструкция с «пусть» сохраняет предписывающий характер текста.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное соответствие термину כֹּהֵן в культовом контексте.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: одного ягнёнка
  rationale: Кֶבֶשׂ обозначает ягнёнка, в данном жертвенном контексте — самца; форма с числительным выделяет одного из животных, названных в обряде.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: и представит его
  rationale: В жертвенном контексте הקריב означает подвести или представить для принесения; «представит» не уточняет преждевременно последующее жертвенное действие.
- source_word: לְאָשָׁם
  choice: как жертву повинности
  rationale: אָשָׁם — технический термин левитского жертвенного законодательства. Традиционное русское выражение сохраняет связь с виной, а сноска отмечает аспект возмещения.
- source_word: לֹג הַשָּׁמֶן
  choice: логом масла
  rationale: לֹג — конкретная древнеизраильская мера жидкости; транслитерация сохраняет точность, а значение поясняется в сноске.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: он совершит ими обряд возношения
  rationale: 'Глагол הניף и существительное תְּנוּפָה вместе описывают ритуальное движение-представление. Формулировка передаёт специальный обряд естественным современным русским языком и сохраняет множественное число: действие совершается ягнёнком и маслом.'
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» естественно передаёт ритуальное לִפְנֵי, а личное имя Яхве непосредственно отражает יהוה.
theological_decisions:
- issue: Передача אָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения
  rationale: Термин включает как виновность, так и идею возмещения. В основном тексте сохранено устоявшееся и понятное название, а альтернативный смысл указан в сноске без устранения смыслового напряжения.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное заветное имя יהוה; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Характер действия הניף / תְּנוּפָה
  choice: совершит ими обряд возношения
  alternative: будет потрясать ими как потрясаемым приношением
  rationale: Выбранная формулировка обозначает ритуальное представление предметов перед Яхве, не навязывая точную реконструкцию направления или формы движения, которой сам стих не объясняет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом законодательного текста. Культовые термины сохранены там, где они существенны, но синтаксис сделан понятным обычному читателю; архаизмы сведены к уместному ритуальному «пред Яхве».
