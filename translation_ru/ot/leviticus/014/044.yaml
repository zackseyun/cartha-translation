  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: ru
  text: Тогда священник придёт и осмотрит дом. И если окажется, что поражение распространилось по дому, то это губительная цараат[a] в доме; дом нечист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цараат — особая категория поражения, вызывающего ритуальную нечистоту; в книге Левит этот термин относится к людям, одежде и домам. Его не следует отождествлять только с современной лепрой или плесенью.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: тогда ... придёт
  rationale: В контексте последовательных предписаний форма передаёт следующий этап установленной процедуры, а не простое повествование о прошлом.
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В данном священническом предписании глагол означает целенаправленное обследование и оценку состояния дома.
- source_word: וְהִנֵּה
  choice: если окажется, что
  rationale: Оборот вводит результат осмотра; условная формулировка естественно передаёт его функцию в русском процедурном тексте.
- source_word: פָּשָׂה הַנֶּגַע
  choice: поражение распространилось
  rationale: נגע обозначает обнаруживаемое поражение или очаг, а פשה — его распространение; перевод не навязывает современного медицинского либо микологического диагноза.
- source_word: צָרַעַת
  choice: цараат
  rationale: Транслитерация сохраняет единый особый библейский термин, применяемый в Левите к людям, одежде и домам, и не отождествляет его ни с современной лепрой, ни конкретно с плесенью.
- source_word: מַמְאֶרֶת
  choice: разъедающая
  rationale: Слово выражает тяжёлый, разрушительный характер поражения; «разъедающая» уместно применительно к дому и сохраняет образ потребляющего воздействия.
- source_word: טָמֵא הוּא
  choice: дом нечист
  rationale: Мужской род местоимения позволяет отнести заключение к дому; явное повторение существительного устраняет неестественную для русского языка неоднозначность местоимения и сохраняет ритуальный термин «нечист».
theological_decisions:
- issue: Обозначение צָרַעַת применительно к дому
  choice: цараат
  alternative: проказа; плесень; губительное поражение
  rationale: Текст устанавливает категорию ритуальной нечистоты, не давая основания для точного современного диагноза. Транслитерация сохраняет необычное применение одного и того же древнееврейского термина к человеку, ткани и дому.
- issue: Референт заключительного טָמֵא הוּא
  choice: дом нечист
  alternative: оно нечисто; это нечисто
  rationale: Местоимение мужского рода естественно согласуется с בַּיִת («дом»), тогда как в русском переводе местоименная передача могла бы ошибочно относиться к «цараат» или «поражению».
- issue: Процедурный характер синтаксиса
  choice: будущее время в последовательном предписании
  alternative: прошедшее время повествования
  rationale: Стих является частью законодательной процедуры осмотра, поэтому будущее время по-русски точнее передаёт предписанный порядок действий.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис сделан ясным для обычного читателя; специальный древнееврейский термин сохранён и кратко объяснён в сноске, чтобы не подменять неопределённое явление современным диагнозом.
