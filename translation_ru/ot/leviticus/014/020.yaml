  terminology: «Жертва всесожжения», «хлебное приношение» и «жертвенник» уместны. «Совершит искупление за него» точнее передаёт כפר в культовом контексте, не навязывая конкретного объяснения механизма обряда. «Он будет чист» корректно сохраняет выражение итогового ритуального статуса.
