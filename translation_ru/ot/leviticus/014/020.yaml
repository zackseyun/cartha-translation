  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: ru
  text: И вознесёт священник жертву всесожжения и хлебное приношение на жертвенник, и совершит священник искупление за него, и он будет чист.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: и вознесёт
  rationale: В породе хифиль глагол עלה в жертвенном контексте означает вознести жертву на жертвенник; «вознесёт» сохраняет культовый смысл и связь с названием всесожжения.
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: עלה здесь — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; этот традиционный русский термин точен и понятен.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В законодательстве Левита מִנְחָה обозначает бескровное приношение из муки или зерна; «хлебное приношение» точнее для данного культового контекста, чем общее «дар».
- source_word: הַמִּזְבֵּחָה
  choice: на жертвенник
  rationale: Направительный суффикс -ה при מזבח выражает движение к жертвеннику, тогда как глагол жертвоприношения подразумевает возложение на него; русский винительный с «на» естественно передаёт оба оттенка.
- source_word: וְכִפֶּר עָלָיו
  choice: и совершит священник очищение за него
  rationale: В священническом контексте כפר означает обрядовое устранение нечистоты или вины посредством жертвы. «Совершит очищение за него» сохраняет культовый характер действия и благодетельное значение עָלָיו, не сводя его к нравственному прощению.
- source_word: וְטָהֵר
  choice: и он будет чист
  rationale: Форма qal описывает наступившее состояние ритуальной чистоты, а не сам процесс очищения.
theological_decisions:
- issue: Характер чистоты в священническом законе
  choice: ритуальная чистота, выраженная словами «он будет чист»
  alternative: нравственная чистота или формулировка «он очистится»
  rationale: Контекст Левит 14 говорит о восстановлении ритуального статуса после нечистоты, связанной с кожным заболеванием. Перевод сохраняет простое утверждение исходного текста и не превращает его в заявление о нравственном преображении.
- issue: Значение כפר в данном обряде
  choice: «совершит очищение за него»
  alternative: «искупит его» или «совершит умилостивление за него»
  rationale: В непосредственном контексте целью обряда является восстановление чистоты. Выбранная формулировка передаёт ритуальный результат, не исключая более широкого диапазона כפר и не привнося узкую конфессиональную трактовку.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, пригодным для священнического законодательства строем. Повтор слова «священник» сохранён вслед за еврейским текстом; последовательность сочинительных конструкций передаёт ритуальную пошаговость оригинала.
