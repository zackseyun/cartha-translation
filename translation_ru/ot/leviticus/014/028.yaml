revisions:
- from: И пусть священник нанесёт немного масла, которое у него на ладони, на мочку правого уха очищаемого, на большой палец его правой руки и на большой палец его правой ноги — на то место, где была кровь жертвы за вину.[a]
  to: И пусть священник нанесёт немного масла, которое находится на его ладони, на мочку правого уха очищаемого, на большой палец его правой руки и на большой палец его правой ноги — на то место, куда была нанесена кровь жертвы за вину.[a]
  rationale: Внесены только уточнение контекстуальной функции «места крови» и небольшая стилистическая правка конструкции о масле на ладони. Значение, ритуальная терминология и исходная неоднозначность относительно видимого присутствия крови не изменены.
  reviewer_model: gpt-5.6-terra
