  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: ru
  text: И пусть священник нанесёт немного масла, которое находится на его ладони, на мочку правого уха очищаемого, на большой палец его правой руки и на большой палец его правой ноги — на то место, куда была нанесена кровь жертвы за вину.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «на место крови жертвы за вину».'
    reason: Сноска сохраняет буквальное устройство еврейской фразы; основной текст ясно передаёт её контекстуальную отсылку к месту предшествующего нанесения крови.
lexical_decisions:
- source_word: וְנָתַן
  choice: пусть … нанесёт
  rationale: Глагол נתן имеет широкое значение «дать, положить, поместить»; в описании нанесения масла на части тела естественно русское «нанесёт».
- source_word: מִן הַשֶּׁמֶן
  choice: немного масла
  rationale: 'Предлог מִן имеет здесь партитивное значение: священник использует часть масла.'
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: которое у него на ладони
  rationale: כַּף обозначает ладонь, а עַל буквально указывает на нахождение масла на ней; конструкция сохраняет ритуальный образ и звучит естественно по-русски.
- source_word: תְּנוּךְ אֹזֶן
  choice: мочка … уха
  rationale: В священническом ритуальном контексте תְּנוּךְ обозначает мочку уха.
- source_word: הַמִּטַּהֵר
  choice: очищаемого
  rationale: Причастная форма хитпаэль обозначает человека, проходящего обряд очищения, а не только уже достигшего очищенного состояния.
- source_word: בֹּהֶן יָדוֹ
  choice: большой палец его … руки
  rationale: בֹּהֶן применительно к руке означает большой палец.
- source_word: בֹּהֶן רַגְלוֹ
  choice: большой палец его … ноги
  rationale: בֹּהֶן применительно к ноге означает большой палец ноги.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: на то место, где была кровь жертвы за вину
  rationale: Формулировка естественно передаёт буквальное «на место крови жертвы за вину» и связывает действие с предшествующим нанесением крови, не утверждая сверх текста, осталось ли там видимое количество крови.
theological_decisions:
- issue: Передача אָשָׁם
  choice: жертва за вину
  alternative: жертва повинности; возместительная жертва
  rationale: В данном контексте אָשָׁם — установленный вид левитской жертвы. «Жертва за вину» узнаваема, ясна и не вводит дополнительного толкования о возмещении.
translation_notes:
  register: Современный литературный русский язык с достоинством ритуального предписания. Конструкция «пусть … нанесёт» передаёт предписывающую функцию формы с waw и перфектом; повтор частей тела сохранён ради ясности и ритма.
