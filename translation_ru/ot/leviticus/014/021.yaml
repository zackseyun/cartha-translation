id: LEV.14.21
reference: Leviticus 14:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: ru
  text: Если же он беден и средств у него недостаточно[a], пусть возьмёт одного агнца в жертву повинности для совершения обряда возношения, чтобы совершить за него искупление, одну десятую эфы тонкой муки, смешанной с маслом, в хлебное приношение и один лог масла[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его рука не достигает», то есть у него недостаточно средств.'
    reason: lexical_alternative
  - marker: b
    text: Лог — небольшая древнеизраильская мера жидкости.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: беден
  rationale: Прямо передаёт низкое имущественное положение человека в данном правовом контексте.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: средств у него недостаточно
  rationale: Естественно передаёт экономический смысл еврейской идиомы, буквально говорящей о руке, которая «не достигает».
- source_word: כֶּבֶשׂ אֶחָד
  choice: одного ягнёнка
  rationale: כֶּבֶשׂ обозначает ягнёнка мужского пола; в русском языке немаркированное «ягнёнок» обычно имеет мужской род, а уточнение «самца» здесь звучало бы тяжеловесно.
- source_word: אָשָׁם
  choice: жертву повинности
  rationale: Устоявшийся русский термин для особой жертвенной категории אָשָׁם, сохраняющий её отличие от других жертв.
- source_word: לִתְנוּפָה
  choice: чтобы совершить им обряд возношения
  rationale: Показывает, что ягнёнок является жертвой повинности, над которой совершается ритуальное движение, а не отдельной категорией «жертвы возношения».
- source_word: לְכַפֵּר עָלָיו
  choice: искупить себя
  rationale: Кратко и естественно передаёт совершение обряда искупления ради этого человека, не уточняя механизм искупления.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: одну десятую эфы лучшей муки
  rationale: עִשָּׂרוֹן в жертвенном законодательстве означает десятую часть эфы; סֹלֶת — муку высокого качества, тонкого помола.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Ясно и точно передаёт соединение муки с маслом.
- source_word: לְמִנְחָה
  choice: в хлебное приношение
  rationale: Передаёт специальное значение מִנְחָה в левитском жертвенном контексте и звучит естественнее, чем буквальное «зерновое приношение», поскольку приносится мука.
- source_word: לֹג שָׁמֶן
  choice: один лог масла
  rationale: Сохраняет точную древнеизраильскую меру жидкости без спорной замены современным эквивалентом.
theological_decisions:
- issue: Передача терминологии жертвенного обряда
  choice: Сохранены разграниченные термины «жертва повинности», «обряд возношения», «искупить» и «хлебное приношение».
  alternative: Заменить их пояснительными выражениями вроде «возместительная жертва» или «ритуально представить».
  rationale: Формулировки сохраняют особые категории священнического законодательства, не навязывая определённой теории искупления.
- issue: Связь לִתְנוּפָה с жертвой повинности
  choice: «в жертву повинности, чтобы совершить им обряд возношения»
  alternative: «в жертву повинности и в жертву возношения»
  rationale: Еврейская конструкция описывает обряд, совершаемый с тем же ягнёнком, а не вторую самостоятельную жертвенную категорию.
translation_notes:
  register: Современный литературный русский с достоинством правового и богослужебного текста. Синтаксис упрощён настолько, чтобы длинное перечисление оставалось понятным, но последовательность предписаний оригинала сохранена.
