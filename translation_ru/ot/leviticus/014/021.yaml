revisions:
- from: Если же он беден и средств у него недостаточно[a], пусть возьмёт одного ягнёнка в жертву повинности, чтобы совершить им обряд возношения и искупить себя, одну десятую эфы лучшей муки, смешанной с маслом, в хлебное приношение и один лог масла[b].
  to: Если же он беден и средств у него недостаточно[a], пусть возьмёт одного агнца в жертву повинности для совершения обряда возношения, чтобы совершить за него искупление, одну десятую эфы тонкой муки, смешанной с маслом, в хлебное приношение и один лог масла[b].
  rationale: 'Исправлена референция местоимения при כפר: искупление совершается за человека, а не «собой» или над собой. «Агнец» передаёт обозначение молодого самца овцы и соответствует возвышенно-правовому регистру. «Тонкая мука» непосредственно отражает значение סֹלֶת; остальные жертвенно-ритуальные термины и обе сноски сохранены.'
