  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: ru
  text: 'А в седьмой день он должен сбрить все свои волосы: волосы на голове, бороду и брови. Он должен сбрить все свои волосы, выстирать одежду и омыть тело водой — и станет чист.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: А в седьмой день
  rationale: Еврейская конструкция вводит следующий этап обряда. Русское «А в седьмой день» естественно передаёт и последовательность, и переход к новой процедуре.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: он должен сбрить все свои волосы
  rationale: Пиэль глагола גלח обозначает сбривание волос; «сбрить» ясно выражает полное удаление, а «все свои волосы» сохраняет всеохватность כָּל.
- source_word: אֶת רֹאשׁוֹ וְאֶת זְקָנוֹ וְאֵת גַּבֹּת עֵינָיו
  choice: на голове, бороду и брови
  rationale: После общего упоминания волос перечисляются участки. Для רֹאשׁוֹ по-русски необходимо естественное уточнение «волосы на голове», которое в данной синтаксической конструкции выражено как «на голове»; זָקָן и גַּבֹּת עֵינַיִם переданы обычными словами «борода» и «брови».
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: Он должен сбрить все свои волосы
  rationale: Повтор исходного текста сохранён, поскольку он подчёркивает полноту удаления волос и не должен быть молча свёрнут.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: выстирать одежду
  rationale: כּבס в этой форме обычно обозначает стирку одежды. «Выстирать одежду» естественно и точно передаёт завершённое ритуальное действие.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: омыть тело водой
  rationale: בָּשָׂר буквально означает «плоть», но здесь обозначает тело человека. «Омыть тело водой» сохраняет ритуальный оттенок и ясно передаёт средство омовения.
- source_word: וְטָהֵר
  choice: и станет чист
  rationale: Форма указывает на наступившее после действий состояние ритуальной чистоты. «Станет чист» передаёт результат, не превращая его в моральную оценку.
theological_decisions:
- issue: Терминология ритуальной чистоты
  choice: чист
  alternative: очищен; чистым
  rationale: В контексте левитского законодательства речь идёт о ритуальном статусе, а не о нравственной невиновности. «Станет чист» сохраняет категорию состояния и последовательность обряда; «будет очищен» могло бы сильнее представить это как внешне совершённое над человеком действие.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены процедурная последовательность и подчёркивающий полноту повтор исходного текста; архаизмы и конфессионально окрашенные формулировки не использованы.
