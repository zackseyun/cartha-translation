base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: ru
  text: И священник, совершающий очищение, представит мужчину, проходящего очищение, вместе со всем этим перед Яхве, у входа в шатёр встречи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: поставит
  rationale: Порода хифиль глагола עמד означает «поставить, сделать так, чтобы стоял». В данном обрядовом контексте «поставит… перед Яхве» естественно по-русски и сохраняет конкретный образ исходного текста.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: священник, совершающий очищение
  rationale: Причастие от טהר обозначает обрядовую функцию священника во всём процессе очищения; эта передача не сводит его роль лишь к объявлению человека чистым и не подразумевает нравственного очищения.
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: очищаемого мужчину
  rationale: Существительное הָאִישׁ прямо обозначает мужчину, а форма הַמִּטַּהֵר — того, кто проходит обрядовое очищение. Краткая русская формулировка передаёт обе особенности.
- source_word: וְאֹתָם
  choice: вместе со всем этим
  rationale: Местоимение во множественном числе отсылает к перечисленным в предыдущем стихе предметам. «Вместе со всем этим» ясно показывает неодушевлённый референт и не создаёт впечатления, будто речь идёт о людях.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняется обычная культовая формула пребывания перед Богом, а тетраграмматон передаётся личным именем «Яхве».
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: Передача точно и естественно обозначает место обряда; «шатёр встречи» сохраняет смысл устойчивого еврейского наименования святилища.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. «Яхве» передаёт личное заветное имя и следует предоставленному актуальному доктринальному решению.
- issue: Характер очищения
  choice: обрядовое очищение выражено без поясняющей вставки в стих
  alternative: очищение от греха; объявление чистым
  rationale: Контекст главы говорит о ритуальном статусе и установленной процедуре. Перевод не превращает действие в нравственное очищение и не сужает роль священника до одного объявления.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Синтаксис остаётся близким к еврейскому, но звучит естественно; буква «ё» последовательно употреблена в слове «шатёр».
