base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: ru
  text: Он возьмёт живую птицу, кедровую древесину, алую нить и иссоп и окунёт эти предметы и живую птицу в кровь птицы, зарезанной над свежей водой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живая вода»; возможно также: «проточная вода».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: живая птица
  rationale: Передаёт атрибутивное חַיָּה и сохраняет явное противопоставление зарезанной птице.
- source_word: יִקַּח
  choice: он возьмёт
  rationale: Будущее совершенного вида естественно передаёт предписывающую силу имперфекта в русском языке.
- source_word: עֵץ הָאֶרֶז
  choice: кедровое дерево
  rationale: Обозначает используемый в обряде кусок или материал кедровой древесины; формулировка сохраняет предметность еврейского выражения.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: алая нить
  rationale: Понятно передаёт окрашенный алый материал, не пытаясь воспроизвести буквально указание на источник красителя.
- source_word: הָאֵזֹב
  choice: иссоп
  rationale: Традиционный прозрачный эквивалент ритуального растения, точная ботаническая идентификация которого остаётся спорной.
- source_word: וְטָבַל
  choice: и окунёт
  rationale: Естественно обозначает краткое погружение предметов в жидкость.
- source_word: אוֹתָם
  choice: всё это
  rationale: Мужское множественное местоимение относится к перечисленным обрядовым предметам; по-русски «всё это» устраняет неясность рода и числа.
- source_word: הַצִּפֹּר הַשְּׁחֻטָה
  choice: птица, зарезанная
  rationale: «Зарезанная» сохраняет конкретный ритуальный способ умерщвления, выраженный שׁחט.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: над свежей водой
  rationale: В контексте выражение указывает на свежую, проточную воду; буквальный образ сохранён в примечании.
theological_decisions:
- issue: Передача מַיִם חַיִּים в обряде очищения
  choice: свежая вода
  alternative: живая вода; проточная вода
  rationale: «Свежая вода» естественно выражает контекстуальный смысл, не привнося позднейших богословских ассоциаций; буквальная и возможная контекстуальная передачи даны в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным законодательным тоном. Синтаксис слегка упрощён ради ясности, при этом последовательность обрядовых действий и повтор «живой птицы» сохранены.
