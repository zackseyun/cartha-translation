revisions:
- from: Живую птицу он возьмёт вместе с кедровым деревом, алой нитью и иссопом и окунёт всё это вместе с живой птицей в кровь птицы, зарезанной над свежей водой.[a]
  to: Он возьмёт живую птицу, кедровую древесину, алую нить и иссоп и окунёт эти предметы и живую птицу в кровь птицы, зарезанной над свежей водой.[a]
  rationale: 'Исправлены только два безопасных места: материал из кедра назван «кедровой древесиной», а объекты погружения выражены так, чтобы «эти предметы» не включали живую птицу до её отдельного упоминания. Значение, порядок ритуальных действий и отмеченная в сноске лексическая неоднозначность сохранены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:38:57Z'
