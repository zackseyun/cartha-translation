  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: ru
  text: Не следуйте установлениям народа, который Я прогоняю от вас[a], ибо они совершали всё это, и Я испытал к ним отвращение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица вашего»; то есть из вашего присутствия.'
    reason: literal_rendering
  - marker: b
    text: 'Или: «они стали Мне отвратительны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ בְּחֻקֹּת
  choice: не следуйте обычаям
  rationale: Буквальное «не ходите по установлениям» в данном нравственно-поведенческом контексте означает не поступать согласно принятым нормам и практикам. «Следовать обычаям» естественно передаёт смысл и сохраняет представление об устойчивых практиках народа.
- source_word: הַגּוֹי
  choice: народа
  rationale: Существительное стоит в единственном числе и собирательно обозначает вытесняемое население; «народ» здесь естественнее русского «нация» и не привносит позднейших коннотаций слова «язычники».
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: прогоняю от вас
  rationale: Причастие выражает совершающееся действие, а сочетание с מִפְּנֵיכֶם означает удаление из присутствия Израиля. «Прогоняю от вас» передаёт и изгнание, и исходный пространственный оборот.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: они делали всё это
  rationale: כִּי вводит основание запрета; в русском двоеточие естественно выражает причинную связь. Несовершенный вид «делали» указывает на практиковавшиеся поступки, перечисленные в контексте.
- source_word: וָאָקֻץ בָּם
  choice: и Я возгнушался ими
  rationale: Глагол קוץ выражает сильное отвращение. Русское «возгнушался» точно передаёт силу и направленность чувства и сочетается с творительным падежом, соответствующим объектной функции בָּם.
theological_decisions:
- issue: Сила выражения Божьего нравственного отвращения
  choice: и Я возгнушался ими
  alternative: и они стали Мне отвратительны
  rationale: Выбранный вариант сохраняет прямое сильное аффективное высказывание исходного текста, не ослабляя его до неодобрения и не добавляя богословских пояснений.
- issue: 'Объект отвращения: люди или их дела'
  choice: ими
  alternative: их делами
  rationale: Местоимение בָּם грамматически отсылает к представителям народа, тогда как причиной названы их поступки. Перевод сохраняет эту напряжённость и не подменяет людей их делами.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Выражение «следуйте обычаям» понятно широкому читателю; «возгнушался» несколько возвышенно, но остаётся точным и уместным для сильного исходного глагола.
