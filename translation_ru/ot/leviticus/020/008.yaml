source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: ru
  text: Соблюдайте Мои установления и исполняйте их. Я — Яхве, освящающий вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делающий вас святыми».'
    reason: Лексическая альтернатива поясняет значение причастия מְקַדִּשְׁכֶם современным общеупотребительным выражением.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Соблюдайте
  rationale: שׁמר в контексте закона означает хранить и соблюдать предписания. Русское повелительное «соблюдайте» естественно передаёт обязательную силу древнееврейской формы.
- source_word: חֻקֹּתַי
  choice: Мои установления
  rationale: חֻקָּה обозначает предписанное установление или устав; «установления» сохраняет юридический оттенок и звучит понятно в современном русском языке.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: и исполняйте их
  rationale: עשה с предписаниями означает осуществлять, исполнять их. «Исполняйте» естественнее русского буквального «делайте» и сохраняет практический смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: מְקַדִּשְׁכֶם
  choice: освящающий вас
  rationale: Причастная форма от קדשׁ представляет освящение как характерное действие Яхве; «освящающий» сохраняет связь с библейской лексикой святости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение מְקַדִּשְׁכֶם в контексте завета
  choice: освящающий вас
  alternative: делающий вас святыми
  rationale: «Освящающий» сохраняет богословскую и лексическую связь с корнем קדשׁ, не ограничивая смысл только нравственным совершенствованием; более прозрачная формулировка дана в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным правовым и заветным регистром. Заглавная буква в «Мои» отражает принятое русское благоговейное оформление прямой речи Бога; местоимение «вас» оставлено со строчной буквы по современной орфографической норме.
