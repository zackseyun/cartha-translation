translation:
  language: ru
  text: Освятите себя[a] и будьте святы, потому что Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятите себя», «сделайте себя святыми». Еврейский глагол имеет возвратное значение и призывает Израиль к активному самоосвящению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Освящайте себя
  rationale: 'Форма хитпаэль от קדשׁ передаёт возвратно-активный призыв: Израиль должен сознательно посвящать себя святости. Такой перевод сохраняет отличие от следующего повеления «будьте святы».'
- source_word: וִהְיִיתֶם
  choice: и будьте
  rationale: Форма היה после первого повеления естественно понимается как второе, согласованное с ним повеление. «Будьте» ясно и естественно передаёт эту функцию по-русски.
- source_word: קְדֹשִׁים
  choice: святы
  rationale: В контексте завета и нравственных требований книги Левит слово обозначает святость; вариант «отделены» передал бы лишь один аспект значения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание повеления; «потому что» прямо и естественно выражает причинную связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Хотя אֱלֹהִים имеет морфологически множественную форму, здесь оно обозначает единого Бога Израиля; суффикс указывает на множественное число адресатов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» передаёт тетраграмматон как имя, не заменяя его титулом.
- issue: Соотношение человеческого освящения и состояния святости
  choice: 'Сохранены два согласованных повеления: «освящайте себя» и «будьте святы»'
  alternative: «Освящайте себя, чтобы стать святыми»
  rationale: Еврейский текст соединяет части союзом וְ и не выражает явно целевую зависимость. Перевод не превращает это соотношение в причинно-целевое и сохраняет богословское напряжение между активным посвящением себя и призванием быть святыми.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью без архаизмов. Местоимение «Я» написано с прописной буквы по русской религиозной издательской традиции; обращение во множественном числе передано строчной формой «себя».
