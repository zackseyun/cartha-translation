base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: ru
  text: Если мужчина совершит прелюбодеяние с женой мужчины — если он совершит прелюбодеяние с женой своего ближнего, — то прелюбодей и прелюбодейка непременно должны быть преданы смерти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с женой мужчины… с женой своего ближнего». Повтор в правовой формулировке усиливает и уточняет описание проступка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Если мужчина
  rationale: Сочетание союза, существительного и относительной частицы вводит казуистическую правовую норму; условная конструкция естественно передаёт эту функцию по-русски.
- source_word: יִנְאַף
  choice: совершит прелюбодеяние
  rationale: Глагол נאף обозначает именно супружескую измену, а не половую безнравственность вообще.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: с женой другого мужчины
  rationale: 'Буквально: «с женой мужчины». Слово «другого» естественно выражает подразумеваемое отношение: женщина состоит в браке не с виновным мужчиной.'
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: с женой своего ближнего
  rationale: רֵעַ здесь означает другого члена сообщества, а не только человека, живущего по соседству; «ближний» сохраняет этот широкий правовой смысл.
- source_word: מוֹת יוּמַת
  choice: непременно должны быть преданы смерти
  rationale: Инфинитив абсолютный при личной форме глагола усиливает категоричность смертного приговора; перевод сохраняет эмфазу и не уточняет не названный здесь способ казни.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: прелюбодей и прелюбодейка
  rationale: Мужское и женское субстантивированные причастия прямо и симметрично называют обе виновные стороны.
theological_decisions:
- issue: Гендерно маркированный язык правовой нормы
  choice: Сохранены «мужчина», «прелюбодей» и «прелюбодейка».
  alternative: «Если кто-либо совершит прелюбодеяние… оба должны быть преданы смерти».
  rationale: Еврейский текст явно называет мужчину в описании случая и отдельно обозначает виновных мужчину и женщину; нейтрализация стёрла бы эту форму исходного текста.
- issue: Формула смертного приговора
  choice: «непременно должны быть преданы смерти» без указания способа.
  alternative: «должны быть казнены».
  rationale: Текст категорически устанавливает смерть обоих виновных, но в этом стихе не называет способ исполнения приговора; перевод не добавляет сведений из иных текстов или традиций.
translation_notes:
  register: Современный литературный русский язык с ясным, строгим правовым регистром. Повтор исходного текста сохранён как значимый элемент юридической формулировки; тире отделяет уточняющее повторение. Маркер сноски помещён после полного предложения.
