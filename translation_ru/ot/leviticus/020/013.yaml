source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: ru
  text: Если мужчина ляжет с мужчиной[a], как ложатся с женщиной[b], то оба они совершили мерзость. Они непременно должны быть преданы смерти; кровь их на них[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское זָכָר означает лицо мужского пола; здесь оно отличается от אִישׁ («мужчина») в начале стиха.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ложами женщины» — еврейский оборот, обозначающий половое сношение с женщиной.'
    reason: lexical_alternative
  - marker: c
    text: 'Или по смыслу: «вина за их кровь лежит на них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Если мужчина
  rationale: В формулировке казуистического закона сочетание вводит условие. «Если мужчина» естественно передаёт юридическую конструкцию и значение אִישׁ.
- source_word: יִשְׁכַּב אֶת
  choice: ляжет с
  rationale: В данном контексте שׁכב с дополнением обозначает половое сношение. Русский библейский оборот «лечь с» сохраняет образ исходного текста и остаётся понятным.
- source_word: זָכָר
  choice: с мужчиной
  rationale: Буквально זָכָר означает лицо мужского пола, тогда как в начале стиха стоит אִישׁ. В основном тексте выбрано естественное русское «мужчина», а лексическое различие отмечено в сноске.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: как ложатся с женщиной
  rationale: Буквально — «ложа/лежания женщины»; это идиоматическое обозначение полового сношения с женщиной. Перевод передаёт смысл без неестественной кальки.
- source_word: תּוֹעֵבָה
  choice: мерзость
  rationale: Слово обозначает нечто отвратительное и запретное в религиозно-нравственном смысле. «Мерзость» сохраняет вес термина и его библейские межтекстовые связи.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: оба они совершили
  rationale: Перевод сохраняет явное указание исходного текста на обоих участников и множественное число глагола.
- source_word: מוֹת יוּמָתוּ
  choice: они непременно должны быть преданы смерти
  rationale: Сочетание абсолютного инфинитива с пассивной глагольной формой усиливает категоричность приговора. Перевод сохраняет усиление и пассивное значение.
- source_word: דְּמֵיהֶם בָּם
  choice: кровь их на них самих
  rationale: Сохранён краткий юридико-нравственный образ, возлагающий ответственность за их смерть на самих осуждённых; возможное смысловое раскрытие дано в сноске.
theological_decisions:
- issue: Передача нравственно и общественно спорного запрета
  choice: Сохранено описание конкретного действия в тех категориях, которыми пользуется еврейский закон, без смягчения запрета или расширяющего современного ярлыка.
  alternative: Передать выражение обобщёнными словами о сексуальной ориентации или «гомосексуальных отношениях».
  rationale: Исходный текст говорит о поступке, а не формулирует современную категорию идентичности. Поэтому перевод не добавляет отсутствующих в тексте понятий.
- issue: Различие אִישׁ и זָכָר
  choice: В основном тексте оба слова переданы естественным русским «мужчина», а более широкое лексическое значение זָכָר пояснено в сноске.
  alternative: Передать זָכָר как «лицо мужского пола».
  rationale: Альтернатива формально точнее отражает различие слов, но звучит в русском тексте тяжеловесно и канцелярски. Сноска позволяет сохранить исходное различие без ущерба для литературности.
- issue: Формула דְּמֵיהֶם בָּם
  choice: Сохранён образ «кровь их на них самих».
  alternative: «Вина за их кровь лежит на них самих».
  rationale: Образная формула допускает оттенки ответственности за смерть и кровной вины. Буквальный образ в тексте и пояснение в сноске не сводят её к одному толкованию.
translation_notes:
  register: Современный литературный русский с достоинством юридического библейского текста. Синтаксис прямой и понятный; сохранены исходные эвфемистические образы «лечь с» и «кровь на них», а места, где буквальная форма могла бы быть непонятна или скрыть лексическое различие, пояснены сносками.
