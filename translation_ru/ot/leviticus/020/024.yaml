  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: ru
  text: 'А вам Я сказал: «Вы овладеете их землёй, и Я сам дам вам во владение землю, текущую молоком и мёдом[b]». Я — Яхве[c], ваш Бог, который отделил вас от народов[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Выражение «земля, текущая молоком и мёдом» — еврейский образ изобилия и плодородия.
    reason: cultural_note
  - marker: c
    text: Еврейское имя יהוה (YHWH), традиционно передаваемое как «Господь».
    reason: alternative_reading
  - marker: d
    text: 'Или: «выделил вас из народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לָכֶם
  choice: А вам Я сказал
  rationale: Начальное ו связывает фразу с контекстом и здесь допускает контрастное «а»; вынесенное «вам» естественно передаёт адресованность высказывания Израилю.
- source_word: תִּירְשׁוּ ... לָרֶשֶׁת
  choice: овладеете ... во владение
  rationale: Корень ירשׁ может означать как наследование, так и вступление во владение. Выбранная формулировка сохраняет активный оттенок и повтор корня, не делая наследование единственно возможным смыслом.
- source_word: אַדְמָתָם
  choice: их землёй
  rationale: В территориальном контексте אדמה естественно обозначает землю, а не только почву или грунт.
- source_word: וַאֲנִי אֶתְּנֶנָּה לָכֶם
  choice: и Я Сам дам её вам
  rationale: Самостоятельное местоимение אֲנִי подчёркивает действующего; «Я Сам» сохраняет это смысловое ударение.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: землю, текущую молоком и мёдом
  rationale: Сохранён традиционный и понятный образ изобилия и плодородия, близкий к форме еврейского выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, без замены его титулом.
- source_word: הִבְדַּלְתִּי אֶתְכֶם מִן הָעַמִּים
  choice: отделивший вас от других народов
  rationale: Причастная конструкция по-русски естественно характеризует Бога через совершённое действие; «отделивший» прямо передаёт בדל, а «народы» не привносит политического оттенка слова «нации».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл отделения Израиля от народов
  choice: отделивший вас от других народов
  alternative: выделивший вас из народов
  rationale: Перевод сохраняет прямой смысл божественного отделения, не уточняя сверх текста его последующие богословские категории.
- issue: Значение ירשׁ применительно к земле
  choice: овладеете ... во владение
  alternative: унаследуете ... в наследие
  rationale: Оба оттенка допустимы; основной текст передаёт вступление во владение, а наследственный оттенок отмечен в сноске, чтобы не устранять лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественного для широкого читателя, но сохранены повтор корня ירשׁ, образ «молока и мёда», эмфатическое «Я Сам» и личное имя Яхве.
