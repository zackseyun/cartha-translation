id: LEV.20.14
reference: Leviticus 20:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: ru
  text: Если мужчина возьмёт женщину и её мать[a], это разврат[b]. Его и их обеих должны сжечь огнём, чтобы среди вас не было разврата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женится на женщине и её матери». Еврейский глагол «возьмёт» в правовом контексте может подразумевать брак, но прямо брак здесь не назван.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также передаваться как «злодеяние», «гнусный поступок» или «распутство»; здесь оно обозначает тяжкое сексуальное нарушение.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: мужчина
  rationale: Существительное стоит в мужском роде и обозначает мужчину, совершающего запрещённое действие.
- source_word: יִקַּח
  choice: возьмёт
  rationale: Глагол буквально означает «взять» и в правовом контексте может подразумевать вступление в брак или брачный союз. Буквальное «возьмёт» сохраняет широту исходной формулировки.
- source_word: אִשָּׁה
  choice: женщину
  rationale: Слово может означать и «женщина», и «жена». Здесь более широкое «женщину» не вводит брачный статус, прямо не названный в еврейском тексте.
- source_word: אִמָּהּ
  choice: её мать
  rationale: Местоименный суффикс однозначно связывает мать с ранее упомянутой женщиной.
- source_word: זִמָּה
  choice: разврат
  rationale: В законах Левита слово обозначает тяжкое и предосудительное сексуальное нарушение. «Разврат» ясно передаёт сексуальную природу проступка, а примечание сохраняет более широкий нравственно-оценочный оттенок термина.
- source_word: בָּאֵשׁ
  choice: огнём
  rationale: Предлог указывает на средство исполнения наказания; творительный падеж естественно передаёт это значение по-русски.
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: Его и их обеих должны сжечь
  rationale: Сохранена активная правовая формулировка с неопределённым исполнителем. «Их обеих» недвусмысленно указывает на женщину и её мать.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: чтобы среди вас не было разврата
  rationale: Союз и форма фразы допускают целевое или результативное понимание; «чтобы» естественно выражает цель наказания, а «среди вас» передаёт בְּתוֹכְכֶם.
theological_decisions:
- issue: Характер отношений, подразумеваемых словами «возьмёт женщину и её мать»
  choice: Сохранить широкую формулировку «возьмёт», не уточняя, что речь непременно идёт о браке.
  alternative: «женится на женщине и её матери» или «возьмёт в жёны женщину и её мать»
  rationale: Глагол לקח в правовых контекстах может относиться к браку, однако отдельного обозначения брака здесь нет. Более широкая передача сохраняет неоднозначность источника.
- issue: Форма предписания о наказании
  choice: «Его и их обеих должны сжечь огнём»
  alternative: «Он и они обе должны быть сожжены огнём»
  rationale: В еврейском тексте употреблена активная форма третьего лица множественного числа с прямыми дополнениями. Русская конструкция сохраняет активное действие, не добавляя не названного исполнителя.
translation_notes:
  register: Современный литературный русский язык с ясной, строгой правовой интонацией. Формулировка сохраняет лаконичность и суровость исходного текста, избегая архаизмов и конфессионально окрашенных уточнений.
