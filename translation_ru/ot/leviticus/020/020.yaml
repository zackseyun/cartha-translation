base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: ru
  text: Если мужчина ляжет с женой своего дяди, он открыл наготу своего дяди. Они понесут свой грех[a] и умрут бездетными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понесут свою вину». Еврейский оборот может означать как сам грех, так и лежащую на человеке вину или ответственность за него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Если мужчина
  rationale: Условная формулировка естественно передаёт казуистическую структуру закона, сохраняя мужской род исходного текста.
- source_word: יִשְׁכַּב אֶת
  choice: ляжет с
  rationale: Сохраняет устойчивый библейский эвфемизм половой связи и остаётся понятным современному читателю.
- source_word: דֹּדָתוֹ
  choice: со своей тёткой
  rationale: Слово обозначает жену дяди; «тётка» кратко и точно выражает это родство в данном контексте.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: он открыл наготу своего дяди
  rationale: Сохранён характерный для Левита оборот, обозначающий нарушение запретной половой связи с женой дяди.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: Оба понесут свой грех
  rationale: Форма множественного числа относит ответственность к обоим участникам; חטא допускает значения греха и вины.
- source_word: עֲרִירִים יָמֻתוּ
  choice: умрут бездетными
  rationale: Передаёт два связанных элемента краткой санкции, не уточняя не названный в тексте механизм или время наступления бездетности.
theological_decisions:
- issue: Смысл санкции עֲרִירִים יָמֻתוּ
  choice: умрут бездетными
  alternative: умрут, не оставив детей / потомства
  rationale: Еврейский текст указывает итоговое состояние, но не объясняет механизм наказания и не уточняет, означает ли это отсутствие детей вообще или отсутствие пережившего их потомства.
- issue: חֶטְאָם как грех или вина
  choice: понесут свой грех
  alternative: понесут свою вину / ответственность за свой грех
  rationale: Основной текст сохраняет буквальный образ несения греха, а примечание отмечает возможный оттенок виновности или ответственности.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского стиля. «Тётка» выбрано вместо разговорно окрашенного в некоторых контекстах «тётя», чтобы обозначить точное родство; культурное уточнение вынесено в сноску. Левитический оборот «открыл наготу» сохранён без сглаживания.
