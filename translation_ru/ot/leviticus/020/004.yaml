base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: ru
  text: Если же народ страны намеренно закроет глаза[a] на того человека, когда тот отдаст кого-либо из своих детей[b] Молоху[c], чтобы не предать его смерти,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «скроет свои глаза от того человека»; это еврейское выражение означает намеренно не замечать его поступка и не принимать мер.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из своего семени»; здесь имеется в виду кто-либо из его детей или потомков.'
    reason: lexical_alternative
  - marker: c
    text: 'Молох может быть именем или обозначением божества либо названием обряда принесения детей в жертву. Некоторые предлагают иное чтение: «царю».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: намеренно закроет глаза
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает действие, а выражение с «глазами» означает сознательно не замечать и не принимать мер. Русская идиома сохраняет и образ, и смысл.
- source_word: עַם הָאָרֶץ
  choice: народ этой земли
  rationale: В данном правовом контексте речь идёт о населении земли, то есть об общине в целом, а не об отдельном общественном сословии.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: закроет глаза на того человека
  rationale: Буквально еврейский текст говорит о сокрытии глаз «от» человека; естественная русская идиома «закрыть глаза на» передаёт сознательное уклонение от реакции на его поступок.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: когда тот отдаст кого-либо из своих детей
  rationale: 'Предлог מִן имеет здесь частичное значение: человек отдаёт кого-то из своего потомства, не обязательно всех. В данном контексте «детей» яснее современному читателю, чем буквальное «семени».'
- source_word: לַמֹּלֶךְ
  choice: Молоху
  rationale: В контексте Левита 18:21 и 20:2–5 традиционная транслитерация имени или культового обозначения лучше всего сохраняет референцию без поясняющего истолкования в основном тексте.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: чтобы не предать его смерти
  rationale: Конструкция выражает цель или результат непринятия мер. «Предать смерти» соответствует юридическому контексту и сохраняет связь с предписанной казнью.
theological_decisions:
- issue: Значение культового обозначения לַמֹּלֶךְ
  choice: Молох
  alternative: царь
  rationale: Хотя одни и те же согласные теоретически допускают чтение «царь», контекст запрета в Левите 18:21 и 20:2–5 убедительно указывает на имя или обозначение адресата запрещённого культа. Транслитерация сохраняет эту референцию, не определяя сверх текста, идёт ли речь о божестве или названии обряда.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-сакрального контекста. Сохранена незавершённость условного предложения, поскольку стих продолжается в следующем стихе. Выражение «закроет глаза» естественно по-русски и одновременно передаёт образность еврейской идиомы; «народ этой земли» сохраняет общинный характер исходного выражения без сословного оттенка.
