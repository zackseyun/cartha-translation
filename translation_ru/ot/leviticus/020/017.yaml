source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: ru
  text: Если мужчина возьмёт[a] свою сестру, дочь своего отца или дочь своей матери, увидит её наготу, а она увидит его наготу, то это позорное дело; они будут отсечены[b] на глазах у сыновей их народа. Он обнажил наготу своей сестры — он понесёт свою вину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол «возьмёт» может в данном контексте подразумевать, что мужчина берёт её в жёны или вступает с ней в половую связь; еврейский текст не уточняет это прямо.
    reason: lexical_alternative
  - marker: b
    text: «Будут отсечены» — еврейская юридическая формула, которая сама по себе здесь не уточняет, означает ли кара смерть, изгнание или иной вид удаления из общины.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: мужчина
  rationale: Сохраняет мужской род и юридическую формулировку еврейского текста.
- source_word: יִקַּח
  choice: возьмёт
  rationale: Передаёт буквальное значение глагола, не уточняя без достаточных оснований, идёт ли речь о браке или непосредственно о половом акте.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: свою сестру, дочь своего отца или дочь своей матери
  rationale: Сохраняет пояснительную конструкцию и явно включает сестру как по отцу, так и по матери.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: увидит её наготу, а она увидит его наготу
  rationale: Сохраняет образ и взаимность еврейской юридико-сексуальной идиомы; контекст указывает на запретную половую связь.
- source_word: חֶסֶד
  choice: позорное дело
  rationale: В данном редком отрицательном употреблении слово обозначает постыдный, предосудительный поступок, а не обычные для него милость или верность.
- source_word: וְנִכְרְתוּ
  choice: они будут отсечены
  rationale: Сохраняет юридическую формулу и её намеренную неопределённость относительно конкретного вида кары.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: на глазах у сынов своего народа
  rationale: Близко передаёт образную социально-родственную формулу оригинала.
- source_word: גִּלָּה
  choice: обнажил
  rationale: Естественно передаёт устойчивую левитскую идиому раскрытия наготы и сохраняет связь с предыдущей фразой.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: он понесёт свою вину
  rationale: Сохраняет одновременно юридический и нравственно-богословский вес формулы, не сводя её только к наказанию.
theological_decisions:
- issue: Значение חֶסֶד в этом стихе
  choice: 'редкое отрицательное значение: «позорное дело»'
  alternative: 'обычное положительное значение: «милость», «верность»'
  rationale: Запретительный и карательный контекст требует отрицательного значения; положительный перевод исказил бы смысл.
- issue: Характер кары в формуле וְנִכְרְתוּ
  choice: сохранить формулу «будут отсечены» без уточнения механизма кары
  alternative: казнь, изгнание либо иное исключение из общины
  rationale: Сам еврейский текст здесь не определяет точный способ осуществления кары, поэтому перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранены ключевые образы «увидеть наготу», «обнажить наготу» и «быть отсечёнными», чтобы не устранять смысловую и юридическую неоднозначность оригинала.
