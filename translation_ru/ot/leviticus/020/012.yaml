source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: ru
  text: Если мужчина ляжет со своей невесткой, оба непременно должны быть преданы смерти. Они совершили извращение[a]; их кровь — на них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смешение», «позорный поступок» или «гнусность». Еврейское слово תֶּבֶל в этом правовом контексте обозначает тяжко порицаемый поступок, нарушающий установленный порядок.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть они сами несут ответственность за свою смерть; возможен также перевод: «вина за их кровь — на них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Если мужчина
  rationale: В формуле казуистического закона сочетание вводит условие; «если мужчина» естественно передаёт его юридическую функцию и сохраняет мужской род субъекта.
- source_word: יִשְׁכַּב אֶת
  choice: ляжет с
  rationale: Устойчивый библейский оборот обозначает половую связь; формулировка сохраняет образ исходного текста и остаётся понятной современному читателю.
- source_word: כַּלָּתוֹ
  choice: со своей невесткой
  rationale: כַּלָּה здесь означает жену сына; «невестка» — точный и естественный русский термин в данном контексте.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: оба непременно должны быть преданы смерти
  rationale: Инфинитив абсолютный при личной форме усиливает предписание; «непременно» передаёт эмфазу, а «преданы смерти» — пассивную юридическую формулу.
- source_word: תֶּבֶל עָשׂוּ
  choice: Они совершили мерзость
  rationale: תֶּבֶל характеризует поступок как нравственно извращённый и позорный. «Мерзость» передаёт сильную отрицательную оценку, не конкретизируя её сверх исходного текста.
- source_word: דְּמֵיהֶם בָּם
  choice: кровь их на них
  rationale: Сохранена краткая древнееврейская юридическая идиома, возлагающая на виновных ответственность за их смерть.
theological_decisions:
- issue: Мужской субъект закона
  choice: «мужчина»
  alternative: «человек» или «кто-либо»
  rationale: אִישׁ обозначает мужчину, а содержание запрета также предполагает именно мужского участника; нейтрализация рода ослабила бы точность.
- issue: Нравственная характеристика תֶּבֶל
  choice: «мерзость»
  alternative: «извращение», «позорный поступок» или «смешение»
  rationale: Исходный текст сам даёт поступку резко отрицательную нравственную оценку. «Мерзость» сохраняет её, тогда как варианты вынесены в примечание для передачи лексической широты слова.
- issue: Смысл формулы דְּמֵיהֶם בָּם
  choice: 'Сохранить образно: «кровь их на них»'
  alternative: 'Разъяснить: «они сами несут ответственность за свою смерть»'
  rationale: Буквальная идиома сохраняет юридико-богословскую напряжённость текста; пояснение в сноске раскрывает смысл, не подменяя образ толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством юридического текста. Сохранены условная формула, эмфатическое предписание смертной казни и образная формула о крови; редкие или неоднозначные элементы пояснены сносками.
