base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: ru
  text: Я Сам обращу Моё лицо против того человека и отсеку его от его народа, потому что он отдал кого-либо из своих потомков Молоху[a], чтобы осквернить Моё святилище и осквернить Моё святое имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принёс в жертву кого-либо из своих детей Молоху». Буквально по-еврейски: «отдал кого-либо из своих потомков Молоху»; жертвенный смысл следует из более широкого контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Я Сам
  rationale: Самостоятельное местоимение подчёркивает личное участие Бога; «Я Сам» естественно передаёт это усиление по-русски.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: обращу лицо Моё против того человека
  rationale: Сохраняет образность еврейской судебной формулы и значение намеренного Божьего противостояния; указательное «того» передаёт הַהוּא.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: и истреблю его
  rationale: В данной формуле Hiphil כרת означает устранение человека из общины Божьим судом. «Истреблю» сохраняет тяжесть угрозы, не уточняя способ исполнения приговора.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: из среды его народа
  rationale: Точно сохраняет общинную рамку формулы исключения и звучит достойно и понятно в современном литературном русском.
- source_word: מִזַּרְעוֹ
  choice: кого-то из своих потомков
  rationale: 'Передаёт потомство без архаичного «семени», а также партитивную силу מִן: речь идёт о ком-то или части потомства, а не обязательно обо всех детях.'
- source_word: נָתַן לַמֹּלֶךְ
  choice: отдал … Молоху
  rationale: Глагол נתן буквально означает «дал/отдал»; перевод не добавляет в основной текст прямо не выраженное слово «принёс в жертву». מֹלֶךְ передано традиционной русской формой имени «Молох».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно выражает цель или предполагаемый результат, не устраняя присущую конструкции смысловую напряжённость.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: осквернить Моё святилище
  rationale: «Осквернить» точно передаёт культовое значение טמא, а «святилище» — מִקְדָּשׁ в священническом контексте.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: и обесчестить Моё святое имя
  rationale: «Обесчестить» естественно и весомо передаёт חלל применительно к Божьему имени — обращение со святым как с лишённым святости.
theological_decisions:
- issue: Характер действия, связанного с Молохом
  choice: В основном тексте сохранено буквальное «отдал кого-то из своих потомков Молоху».
  alternative: «принёс в жертву кого-то из своих детей Молоху»
  rationale: Ближайший контекст указывает на жертвенный обряд, однако сам этот стих использует общий глагол נתן, «дать/отдать». Уточнение вынесено в сноску, чтобы не снять подлинную лексическую неоднозначность.
- issue: Личное участие Бога в суде
  choice: «Я Сам обращу лицо Моё против того человека»
  alternative: «Я выступлю против того человека»
  rationale: Выбранный перевод сохраняет усиление וַאֲנִי и весомый антропоморфный судебный образ, не сводя его к общему понятию противодействия.
- issue: Смысл кары כרת
  choice: «истреблю его из среды его народа»
  alternative: «отсеку его от его народа»
  rationale: Точный способ Божьего суда формулой не разъясняется. «Истреблю из среды» передаёт суровость и окончательность, не утверждая конкретного механизма кары.
translation_notes:
  register: Современный литературный русский с dignified библейской весомостью. Сохранены образная формула «обращу лицо Моё против», мужской референт «тот человек» и различие между культовым «осквернить» и обесчещиванием святого имени. Заглавные буквы в местоимениях, относящихся к Богу, использованы последовательно в рамках русского религиозно-литературного регистра.
