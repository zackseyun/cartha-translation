  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: ru
  text: Если человек обратится к медиумам и гадателям[a], чтобы предаваться блуду, следуя за ними[b], Я обращу Свое лицо против этого человека и отсеку его из среды его народа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские названия этих двух видов оккультных практиков допускают разные толкования; возможный перевод: «к вызывающим умерших и к ведунам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы блудодействовать вслед за ними»; это метафора неверности Богу через обращение к запретным духовным практикам.'
    reason: metaphor_clarification
  - marker: c
    text: «Отсеку» — устойчивая правовая формула. В этом стихе не уточняется, каким именно образом исполняется данный приговор.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: человек
  rationale: В данном правовом контексте נֶפֶשׁ обозначает отдельного человека, а не исключительно нематериальную «душу».
- source_word: תִּפְנֶה
  choice: обратится
  rationale: Сохраняет образ поворота к кому-либо и естественно передаёт намеренное обращение за помощью или советом.
- source_word: הָאֹבֹת
  choice: медиумам
  rationale: Здесь термин, вероятнее всего, обозначает людей, посредством которых вопрошали умерших или духов; современное слово «медиумы» кратко и понятно передаёт эту функцию.
- source_word: הַיִּדְּעֹנִים
  choice: вызывателям духов
  rationale: Передаёт вторую категорию оккультных практиков и отличает её от первой, не прибегая к устаревшему или чрезмерно широкому слову «волшебники».
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: чтобы блудодействовать вслед за ними
  rationale: Сохраняет прямую метафору блуда как неверности и образ следования за запретными духовными посредниками.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: Я обращу Своё лицо против этого человека
  rationale: Сохраняет еврейский образ лица и ясно выражает Божье противостояние человеку в суде.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: и отсеку его
  rationale: Воспроизводит устойчивую правовую формулу с глаголом כרת и не уточняет сверх текста конкретный способ наказания.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: от его народа
  rationale: Естественно передаёт удаление человека из среды принадлежащего ему народа и сочетается с сохранённым образом «отсечения».
theological_decisions:
- issue: Сохранение метафоры блуда как нарушения верности
  choice: чтобы блудодействовать вслед за ними
  alternative: чтобы, изменив Мне, последовать за ними
  rationale: В еврейском тексте прямо употреблён глагол זנה. Выбранная передача сохраняет резкую метафору неверности, не добавляя в основной текст прямо не названный объект измены.
- issue: Значение судебной формулы «отсечь»
  choice: и отсеку его от его народа
  alternative: и истреблю его из среды его народа
  rationale: Точный способ наказания формулой כרת здесь не определяется. Буквенный образ сохраняет строгость приговора, но не сводит его однозначно к казни либо к изгнанию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Образы обращения лица, блуда и отсечения сохранены ради смысловой и богословской напряжённости оригинала; узкоконфессиональные толкования не внесены.
