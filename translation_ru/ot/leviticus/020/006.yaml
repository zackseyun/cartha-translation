  rationale: Исправление уточняет различие между двумя древнееврейскими обозначениями, не выдавая спорную этимологию за установленный смысл. Оно также делает русский синтаксис современным и литературным, сохраняя юридическую и метафорическую силу оригинала. Сноски остаются привязанными к соответствующим словам и сохраняют важную неопределённость формулы «отсеку».
