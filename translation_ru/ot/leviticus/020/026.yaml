id: LEV.20.26
reference: Leviticus 20:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: ru
  text: Будьте святы для Меня, потому что Я, Яхве, свят. Я отделил вас от народов[a], чтобы вы были Моими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от наций». Еврейское עַמִּים может обозначать как народы, так и, в некоторых контекстах, нации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם לִי קְדֹשִׁים
  choice: Будьте святы для Меня
  rationale: В данном законодательно-наставительном контексте форма выражает требование с направленностью на последующий результат. «Будьте» естественно передаёт это по-русски; «для Меня» сохраняет значение принадлежности и посвящённости, не сводя святость только к отделённости.
- source_word: כִּי קָדוֹשׁ אֲנִי
  choice: потому что Я… свят
  rationale: כִּי вводит основание требования. Причинное «потому что» ясно передаёт связь между святостью народа и святостью Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: Я отделил вас
  rationale: Глагол בדל обозначает отделение или разграничение. «Отделил» сохраняет отличие этого действия от קדש — «быть святым» — и передаёт завершённое действие с сохраняющимся результатом.
- source_word: מִן הָעַמִּים
  choice: от народов
  rationale: עַמִּים — множественное обозначение народов или этнических сообществ. Слово «других» не добавлено, поскольку в еврейском тексте оно лишь подразумевается контекстом.
- source_word: לִהְיוֹת לִי
  choice: чтобы вы были Моими
  rationale: Инфинитивная конструкция выражает цель или результат отделения, а לִי — принадлежность. Формулировка естественна по-русски и сохраняет язык заветной принадлежности.
theological_decisions:
- issue: Святость Израиля может быть сведена либо только к нравственной чистоте, либо только к обособленности.
  choice: Сохранить «святы» для קדש и «отделил» для בדל.
  alternative: Передать оба слова через «отделять/обособлять» либо заменить святость понятием чистоты.
  rationale: Сам стих связывает требуемую святость народа со святостью Яхве, а затем отдельно говорит об отделении от народов. Разные русские слова сохраняют и связь, и смысловое напряжение оригинала.
- issue: Передача имени יְהוָה.
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале стоит личное имя Бога, а не титул. «Яхве» передаёт его принятой научной транслитерацией.
- issue: Отношение формы וִהְיִיתֶם к повелению и результату.
  choice: Будьте
  alternative: Вы будете; и будьте
  rationale: Контекст поддерживает обязательное наставление, но форма также допускает оттенок ожидаемого результата. Русское «Будьте» передаёт нормативную силу без дополнительного разъяснения этой напряжённости.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Синтаксис сделан естественным для широкого читателя; сохранены повтор темы святости, различие между святостью и отделением и язык принадлежности Богу.
