base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: ru
  text: Всякий, кто проклянёт своего отца или свою мать, непременно должен быть предан смерти. Он проклял своего отца и свою мать; его кровь на нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть ответственность за его смерть лежит на нём самом. Возможный перевод: «вина за его кровь на нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: всякий, кто
  rationale: 'Удвоенное אִישׁ имеет распределительное значение: «всякий», «кто бы ни». Русская конструкция естественно передаёт норму общего применения, не воспроизводя неестественное «человек, человек».'
- source_word: יְקַלֵּל / קִלֵּל
  choice: проклянёт / проклял
  rationale: Пиэль глагола קלל здесь означает произнесение проклятия против родителей, а не просто непочтительность или оскорбление.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: своего отца или свою мать
  rationale: 'Хотя в еврейском стоит союз «и», в правовой норме сочетание имеет распределительный смысл: наказание относится к проклятию любого из родителей. «Или» ясно выражает этот смысл по-русски.'
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает категоричность приговора; пассивная конструкция сохраняет судебный характер формулы.
- source_word: דָּמָיו בּוֹ
  choice: кровь его на нём
  rationale: Буквально и кратко сохраняет древнееврейскую юридическую формулу, возлагающую ответственность за смерть осуждённого на него самого.
theological_decisions:
- issue: Распределительное значение אִישׁ אִישׁ
  choice: всякий, кто
  alternative: всякий мужчина, который
  rationale: В данном законодательном контексте мужская форма служит общей правовой формулой. «Всякий, кто» передаёт её область действия без утверждения, что норма относится исключительно к мужчинам.
- issue: Связь между упоминаниями отца и матери
  choice: или в обоих случаях
  alternative: и, согласно буквальной форме союза
  rationale: 'Выбрано распределительное правовое прочтение: проклятие одного из родителей уже влечёт названное наказание. Оно не исключает случая, когда прокляты оба.'
- issue: Формула דָּמָיו בּוֹ
  choice: кровь его на нём
  alternative: вина за его кровь на нём
  rationale: Основной текст сохраняет образность и юридическое напряжение оригинала, не сводя выражение только к отвлечённому понятию вины; пояснение дано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Конструкция «должен быть предан смерти» передаёт обязательный судебный приговор без архаичного «да будет». Местоимение «своего» естественно связывает родителей с субъектом; формула «кровь его на нём» намеренно сохраняет библейскую образность.
