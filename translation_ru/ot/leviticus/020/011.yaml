  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: ru
  text: Если мужчина ляжет с женой своего отца, он обнажит наготу своего отца. Оба они непременно должны быть преданы смерти; кровь их на них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Кровь их на них» — юридическая формула, означающая, что ответственность за их смерть лежит на них.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Если мужчина
  rationale: В контексте казуистического закона сочетание союза, существительного и относительной частицы естественно передаётся условной конструкцией; мужской субъект сохранён.
- source_word: יִשְׁכַּב אֶת
  choice: ляжет с
  rationale: Устойчивое выражение в законах о половых отношениях обозначает половой акт; традиционная русская формула сохраняет достоинство и юридическую сдержанность.
- source_word: אֵשֶׁת אָבִיו
  choice: женой своего отца
  rationale: Передана буквальная формулировка «жена его отца» без сужающего толкования «мачеха».
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: он открыл наготу своего отца
  rationale: Сохранена характерная для Левита формула, связывающая этот стих с другими запретами; совершенный вид выражает уже совершённое нарушение.
- source_word: מוֹת יוּמְתוּ
  choice: непременно должны быть преданы смерти
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает категоричность приговора, не указывая не названный в тексте способ казни.
- source_word: שְׁנֵיהֶם
  choice: оба они
  rationale: Сохранено явное указание на обоих участников.
- source_word: דְּמֵיהֶם בָּם
  choice: кровь их на них самих
  rationale: Буквально сохранена юридическая формула, возлагающая ответственность за смертный приговор на самих виновных.
theological_decisions:
- issue: Передача формулы о наготе отца
  choice: он открыл наготу своего отца
  alternative: он сексуально обесчестил своего отца
  rationale: Буквальная идиома сохраняет внутрибиблейские связи и не сводит многозначный образ только к поясняющему толкованию.
- issue: Грамматический род субъекта закона
  choice: Если мужчина
  alternative: Если кто-либо
  rationale: Еврейский текст прямо говорит о мужчине и описывает специфическое для него нарушение; нейтрализация рода сделала бы норму менее точной.
- issue: Ответственность обоих участников за смертный приговор
  choice: кровь их на них самих
  alternative: они сами виновны в своей смерти
  rationale: Сохранена традиционная юридическая метафора исходного текста, а сноска разъясняет её смысл без подмены текста толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством и сдержанным юридическим тоном. Сохранены ключевые левитские формулы «открыть наготу» и «кровь … на них», при этом архаичность ограничена конструкциями, необходимыми для межтекстовой связи.
