source:
  edition: WLC
  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: ru
  text: Если женщина приблизится к какому-либо животному, чтобы оно совокупилось с ней[a], то убей женщину и животное. Они непременно должны быть преданы смерти[b]; их кровь на них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы оно покрыло её». Еврейский глагол обозначает половое совокупление, в частности покрытие самки самцом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вина за их кровь на них». Этот оборот означает, что ответственность за их смерть лежит на них самих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: приблизится
  rationale: Глагол קרב означает «приближаться, подходить». Перевод сохраняет конкретное действие, тогда как его сексуальная цель выражена следующим оборотом.
- source_word: כָּל בְּהֵמָה
  choice: какому-либо животному
  rationale: בְּהֵמָה здесь обозначает животное в широком смысле, а כָּל в условной правовой формулировке передаёт значение «какое-либо, любое».
- source_word: לְרִבְעָה אֹתָהּ
  choice: чтобы оно совокупилось с ней
  rationale: 'Глагол רבע в данном контексте означает половое совокупление, связанное с покрытием. Суффикс אֹתָהּ указывает на женщину как объект действия: буквально речь идёт о том, чтобы животное покрыло её. Формулировка ясна современному читателю и сохраняет направление действия в еврейском тексте.'
- source_word: וְהָרַגְתָּ
  choice: то убей
  rationale: Форма единственного числа обращена к адресату закона и имеет предписывающую силу. «Убей» прямо передаёт правовую санкцию без добавочного толкования.
- source_word: מוֹת יוּמָתוּ
  choice: Они непременно должны быть преданы смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает категоричность смертного приговора. «Непременно» передаёт это усиление, а страдательная конструкция соответствует формуле исполнения приговора.
- source_word: דְּמֵיהֶם בָּם
  choice: их кровь на них
  rationale: Перевод сохраняет образный правовой оборот еврейского текста, возлагающий на виновных ответственность за собственную смерть, не подменяя образ техническим термином «вина в крови».
theological_decisions:
- issue: Передача суровой правовой нормы о половом акте с животным
  choice: Прямо передать как само действие, так и смертную санкцию, без смягчающего эвфемизма и без дополнительного нравственного комментария.
  alternative: Использовать менее определённое «лечь с ним» либо расширенное толкование «вступить в половую связь».
  rationale: Законодательный характер стиха требует ясности и точности. Выбранный перевод сохраняет тяжесть санкции, но не привносит конфессиональных или иных выводов сверх сказанного в тексте.
- issue: Направление действия в выражении לְרִבְעָה אֹתָהּ
  choice: «чтобы оно совокупилось с ней»
  alternative: «чтобы совокупиться с ним»
  rationale: Женский объектный суффикс при инфинитиве относится к женщине и представляет животное действующим субъектом полового акта. Это синтаксическое различие сохранено, хотя общий смысл запрета от него не меняется.
translation_notes:
  register: Современный литературный русский язык с кратким и строгим правовым звучанием. Слова «совокупилось», «убей» и «преданы смерти» прямо передают содержание и силу исходного текста; библейский образ «их кровь на них» сохранён и пояснён в сноске.
