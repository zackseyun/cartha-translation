lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Форма Piel с последовательным וַ вводит новую речевую единицу; в устойчивой библейской формуле естественно передаётся русским «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом «Господь».
- source_word: אֶל
  choice: '(дательный падеж: Моисею)'
  rationale: Предлог обозначает адресата речи и естественно передаётся в русском языке дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисею
  rationale: Общепринятая русская форма имени Моисей, поставленная в дательном падеже по синтаксису фразы.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Формульное «сказав» вводит содержание последующей прямой речи; в современном русском переводе эту функцию естественно и без потери смысла выполняет двоеточие.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как собственное имя. «Яхве» прямо передаёт это имя, тогда как «Господь» заменяет его титулом, а «Иегова» отражает более позднюю гибридную вокализацию.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и формульности повествования. Двоеточие вместо буквального «сказав» делает ввод речи естественным; несовершенный вид «говорил» поддерживает традиционную формулу и указывает на начинающуюся далее речь.
