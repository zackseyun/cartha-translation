source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: ru
  text: Если мужчина ляжет с женщиной во время её менструальной нечистоты[a] и откроет её наготу — он обнажил источник её крови[b], а она открыла источник своей крови, — то оба они будут отсечены от своего народа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда у неё менструация». Еврейское слово обозначает также связанную с менструацией ритуальную нечистоту.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он обнажил её источник, а она открыла источник своей крови». «Источник» — евфемистическое обозначение телесного истечения крови.'
    reason: lexical_alternative
  - marker: c
    text: «Будут отсечены» — устойчивая правовая формула Торы. Здесь не уточняется, каким именно образом осуществляется это удаление из народа.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: мужчина
  rationale: Мужской род исходной правовой формулировки существенен в данном сексуальном контексте.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: ляжет с женщиной
  rationale: Сохранена понятная по-русски библейская идиома, обозначающая половую связь, без излишне клинического пояснения.
- source_word: דָּוָה
  choice: во время её менструальной нечистоты
  rationale: Слово указывает не просто на менструацию, но и на связанную с ней ритуальную нечистоту в контексте Левита.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: откроет её наготу
  rationale: Сохранена характерная для законов Левита идиома сексуального обнажения и связи.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: он обнажил источник её кровотечения
  rationale: Передана метафора «источника» и значение глагола «обнажить»; слово «кровотечение» проясняет телесный смысл, не устраняя образ.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: а она открыла источник своей крови
  rationale: Сохранены параллелизм исходного текста и указание на участие женщины.
- source_word: וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: оба они будут отсечены от своего народа
  rationale: Сохранена стандартная формула Торы и её неопределённость относительно конкретного способа наказания.
theological_decisions:
- issue: Характер состояния, обозначенного דָּוָה
  choice: менструальная нечистота
  alternative: во время менструации
  rationale: В законах Левита речь идёт о менструации как состоянии ритуальной нечистоты, а не о болезни вообще.
- issue: Смысл наказания וְנִכְרְתוּ
  choice: будут отсечены
  alternative: будут казнены; будут изгнаны из общины; умрут бездетными
  rationale: Исходная формула в этом стихе не уточняет, каким именно образом совершается отсечение; перевод не разрешает спорный вопрос за текст.
- issue: Ответственность женщины
  choice: 'сохранено самостоятельное указание: «она открыла источник своей крови»'
  alternative: свести всё описание только к действию мужчины
  rationale: Еврейский текст прямо описывает действия обоих участников и назначает наказание обоим; этот параллелизм нельзя опускать.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Сохранены характерные для Левита выражения «открыть наготу» и «быть отсечёнными», а непривычная телесная метафора пояснена в сноске. Временной переход от условного будущего к описательному прошедшему отражает смену еврейских глагольных форм и подчёркивает состав совершённого проступка.
