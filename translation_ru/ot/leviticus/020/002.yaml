base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: ru
  text: 'И скажи сынам Израиля: всякий из сынов Израиля или из пришельцев, живущих в Израиле[a], кто отдаст кого-либо из своих потомков[b] Молоху[c], непременно должен быть предан смерти; народ страны должен побить его камнями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из пришельца, живущего в Израиле». Слово «пришелец» обозначает чужеземца, постоянно проживающего среди израильтян; в еврейском тексте употреблены однокоренные существительное и глагол.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из своего семени»; здесь «семя» означает потомство, детей.'
    reason: lexical_alternative
  - marker: c
    text: Молох может быть именем или титулом божества, традиционно связываемого с жертвоприношением детей. Некоторые исследователи понимают это слово как название особого вида приношения.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля / из сынов Израиля
  rationale: Сохранено традиционное и формально близкое еврейское выражение; в данном законодательном контексте оно обозначает израильтян.
- source_word: אִישׁ אִישׁ
  choice: всякий человек
  rationale: Удвоенное אִישׁ имеет распределительное значение — «всякий», «кто бы ни»; выбран естественный русский эквивалент без утраты всеобщности предписания.
- source_word: הַגֵּר הַגָּר
  choice: из пришельцев, живущих
  rationale: «Пришелец» передаёт статус постоянно проживающего чужеземца, а причастный оборот отражает сочетание однокоренных существительного и глагола, насколько это допускает естественный русский язык.
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: отдаст кого-либо из своих потомков Молоху
  rationale: זֶרַע буквально означает «семя», но здесь указывает на потомство. «Кого-либо из» передаёт частичное מִן и не уточняет сверх текста ни возраст, ни способ совершения обряда.
- source_word: לַמֹּלֶךְ
  choice: Молоху
  rationale: В основном тексте сохранено традиционное понимание слова как имени или титула; альтернативное толкование как обозначения вида приношения отмечено в сноске.
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает категоричность судебного приговора; страдательная конструкция показывает, что речь идёт о казни, а не просто о смерти.
- source_word: עַם הָאָרֶץ
  choice: народ земли
  rationale: Сохранено буквальное выражение без привнесения более позднего специального социального значения; здесь имеется в виду местное общество, исполняющее приговор.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: пусть побьёт его камнями
  rationale: Русская формула естественно передаёт казнь через побивание камнями и сохраняет прямо названное в еврейском тексте орудие.
theological_decisions:
- issue: Значение передачи потомка Молоху
  choice: Текст говорит об отдаче потомка Молоху, не добавляя в переводе способ совершения обряда.
  alternative: Понять מֹלֶךְ как название особого вида приношения, а не как имя или титул божества.
  rationale: Контекст связывает действие с тяжким культовым преступлением, традиционно понимаемым как жертвоприношение детей, однако сам стих не упоминает огонь и не описывает обряд. Поэтому перевод сохраняет лаконичность и неоднозначность исходного текста, а альтернативу выносит в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным законодательным звучанием. Синтаксис упрощён лишь настолько, чтобы длинная правовая формула оставалась понятной; традиционные библейские выражения «сыны Израиля», «Молох» и «народ земли» сохранены.
