  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: ru
  text: Если мужчина или женщина окажется медиумом[a] или вызывающим духов[b], их непременно должны предать смерти; их должны побить камнями. Кровь их — на них самих[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אוֹב может обозначать как медиума, вызывающего умерших, так и связанного с некромантией духа.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское יִדְּעֹנִי — не вполне ясный термин, обозначающий человека, связанного с обращением к духам или получением тайного знания; он может также относиться к духу. Традиционный перевод: «волшебник».'
    reason: lexical_alternative
  - marker: c
    text: '«Кровь их — на них самих» — юридическая формула: осуждённые сами несут ответственность за постигшую их смерть.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: Если мужчина или женщина
  rationale: Сохранена явно названная в еврейском тексте пара полов. Начальное וְ в данном завершающем правовом постановлении не требует отдельного «и» в естественном русском синтаксисе.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: окажется
  rationale: Еврейская конструкция буквально говорит о наличии в человеке אוֹב или יִדְּעֹנִי. По-русски связка «окажется медиумом или прорицателем» естественно передаёт юридически значимое состояние или занятие, не утверждая сверх текста, каким именно образом оно проявлялось.
- source_word: אוֹב
  choice: медиум
  rationale: В данном контексте слово обозначает человека, связанного с вызыванием умерших или обращением к духу, хотя может обозначать и самого такого духа. «Медиум» — понятное современному читателю обозначение; лексическая неоднозначность отмечена в сноске.
- source_word: יִדְּעֹנִי
  choice: прорицатель
  rationale: Термин обозначает лицо или духа, связанного с оккультным получением знания, и стоит в паре с אוֹב. «Прорицатель» звучит естественно и достойно, не вызывая сказочно-фэнтезийных ассоциаций слова «волшебник»; точная древняя классификация остаётся открытой в сноске.
- source_word: מוֹת יוּמָתוּ
  choice: непременно должны быть преданы смерти
  rationale: Инфинитив абсолютный при личной форме усиливает категоричность смертного приговора; «непременно» передаёт это усиление.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: Пусть их забросают камнями
  rationale: Переданы как само побиение, так и прямо названное орудие — камень; множественное «камнями» естественно для русского языка.
- source_word: דְּמֵיהֶם בָּם
  choice: Кровь их — на них самих
  rationale: Сохранён образный юридический оборот о том, что осуждённые сами несут ответственность за свою смерть; «самих» ясно передаёт возвратный смысл בָּם.
theological_decisions:
- issue: Обозначение запрещённых практик אוֹב и יִדְּעֹנִי
  choice: «медиум» и «прорицатель» с пояснением неоднозначности в сносках
  alternative: «дух умершего» и «дух-прорицатель» либо традиционные «вызыватель мёртвых» и «волшебник»
  rationale: Контекст выносит приговор людям, занимающимся запретным обращением к духам, но сами древнееврейские термины могут называть как практиков, так и связанных с ними духов. Основной текст должен быть понятным, а сноски сохраняют реальную лексическую неопределённость без догматического решения природы этих явлений.
- issue: Сохранение формулы «мужчина или женщина»
  choice: Сохранить оба явно названных пола
  alternative: Обобщить как «всякий» или «любой человек»
  rationale: Еврейский текст намеренно называет мужчину и женщину; перевод сохраняет эту форму закона.
- issue: Смысл формулы דְּמֵיהֶם בָּם
  choice: Сохранить «Кровь их — на них самих» и пояснить юридическое значение
  alternative: Истолковать в тексте как «они сами виновны в своей смерти»
  rationale: Образная формула важна для текста и не должна молча заменяться толкованием. Сноска сообщает её правовой смысл.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Термины «медиум» и «прорицатель» доступны обычному читателю; категоричность приговора и краткая заключительная формула сохранены. Переход от единственного распределительного «мужчина или женщина» к множественному «они / их» следует грамматике еврейского текста и охватывает оба названных случая.
