  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: ru
  text: Если мужчина возьмёт жену своего брата, это нечистота; он открыл наготу своего брата. Они будут бездетны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они умрут бездетными». Еврейское выражение буквально означает: «они будут бездетны»; оно само по себе не уточняет, каким образом исполнится этот приговор.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Если мужчина
  rationale: В данной правовой формуле относительная конструкция с имперфектом имеет условный смысл; русское «если» естественно передаёт казуистическую форму закона. Союз ו не требует отдельного «и» в самостоятельном русском стихе.
- source_word: יִקַּח
  choice: возьмёт
  rationale: Глагол לקח буквально означает «взять» и в брачном контексте может подразумевать вступление в союз, однако перевод не уточняет формальную процедуру сверх сказанного в еврейском тексте.
- source_word: אֵשֶׁת אָחִיו
  choice: жену своего брата
  rationale: Обычная русская передача сопряжённой конструкции; возвратное местоимение ясно соотносит брата с мужчиной — субъектом предложения.
- source_word: נִדָּה הִוא
  choice: это осквернение
  rationale: נִדָּה обозначает нечистоту, в том числе ритуально-нравственную; средний род «это» относит оценку к самому союзу или поступку, а не объявляет женщину лично нечистой.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: он открыл наготу своего брата
  rationale: Сохранена характерная для Левита правовая эвфемистическая формула об illicit sexual relations; буквальная образность важна для межтекстовой связи.
- source_word: עֲרִירִים יִהְיוּ
  choice: Они останутся бездетными
  rationale: Множественное число относится к обоим участникам; עֲרִירִים означает отсутствие детей, не определяя прямо, каким образом исполнится приговор.
theological_decisions:
- issue: Характер связи с женой брата
  choice: возьмёт жену своего брата
  alternative: женится на жене своего брата
  rationale: 'Выбрана менее конкретизирующая передача: текст запрещает такую связь, но сам глагол не требует вводить указание на официальную брачную церемонию. Стих следует читать в контексте иных законов, включая особый случай левирата, не добавляя сюда отсутствующих оговорок.'
- issue: Смысл עֲרִירִים יִהְיוּ
  choice: Они останутся бездетными
  alternative: Они умрут бездетными
  rationale: Еврейский текст прямо утверждает бездетность, но не называет смерть и не раскрывает механизм суда; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства правовой речи и ключевой левитской формулы «открыть наготу». «Осквернение» звучит естественнее отвлечённого «нечистота» применительно к поступку и не переносит характеристику на женщину. Единственная сноска отмечает подлинную неоднозначность заключительной санкции; маркер [a] присутствует в основном тексте.
