- from: Если мужчина возьмёт жену своего брата, это осквернение; он открыл наготу своего брата. Они останутся бездетными.[a]
  to: Если мужчина возьмёт жену своего брата, это нечистота; он открыл наготу своего брата. Они будут бездетны.[a]
  rationale: 'Устранены две небольшие смысловые конкретизации: «останутся» заменено на нейтральное будущее «будут», а «осквернение» — на более прямое терминологическое соответствие «нечистота». Сноска теперь действительно фиксирует альтернативное понимание — смерть без детей — и одновременно поясняет, что оно не выражено прямо в еврейском тексте.'
