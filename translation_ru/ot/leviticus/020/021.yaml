  terminology: «Нечистота» последовательно передаёт נִדָּה как ритуально-нравственную нечистоту. Формула «открыл наготу» сохранена как важный терминологический и межтекстовый оборот. Сноска должна отмечать возможное понимание итоговой формулы как смерти без детей, не утверждая его как прямое значение текста.
