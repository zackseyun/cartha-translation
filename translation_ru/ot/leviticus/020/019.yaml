base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: ru
  text: Не открывай наготы сестры своей матери или сестры своего отца, ибо он обнажил свою родственницу[a]; они понесут свою вину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свою плоть». Еврейское слово здесь обозначает близкое кровное родство; возможно также: «свою близкую родственницу».'
    reason: lexical_alternative
  - marker: b
    text: '«Понесут свою вину» может также означать «понесут наказание за свой грех»: еврейская формула охватывает как виновность, так и её последствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת … לֹא תְגַלֵּה
  choice: не открывай наготы
  rationale: Сохранена устойчивая левитская формула, обозначающая запрет половой связи. Буквенный образ важен для единства контекста и при этом понятен в русском библейско-правовом стиле.
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: сестры своей матери или сестры своего отца
  rationale: Родство названо непосредственно, как в еврейском тексте. Союз «или» естественно передаёт два равным образом запрещённых варианта под общим отрицанием.
- source_word: כִּי
  choice: ведь
  rationale: Передаёт обосновывающий характер следующей части и естественно звучит в современном русском.
- source_word: שְׁאֵרוֹ
  choice: собственную плоть
  rationale: Сохранён конкретный образ שְׁאֵר — «плоть», обозначающий близкое кровное родство; более явные варианты приведены в сноске.
- source_word: הֶעֱרָה
  choice: обнажил
  rationale: Глагол ערה означает «обнажить, сделать нагим». Выбор сохраняет связь с образом наготы, не повторяя буквально глагол «открывать».
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: они понесут свою вину
  rationale: 'Сохранена формула «нести вину» и её намеренная смысловая ёмкость: עָוֹן может обозначать проступок, виновность и связанные с ними последствия.'
theological_decisions:
- issue: Переход от единственного числа в обосновании к множественному числу в заключении
  choice: «он обнажил собственную плоть; они понесут свою вину»
  alternative: 'Согласовать всё во множественном числе: «они обнажили собственную плоть; они понесут свою вину»'
  rationale: В еврейском тексте у שְׁאֵרוֹ и הֶעֱרָה стоит мужское единственное число, а у עֲוֺנָם יִשָּׂאוּ — множественное. Переход сохранён, чтобы не устранять возможное различие между описанием поступка мужчины и ответственностью обоих участников.
- issue: Степень явности полового эвфемизма
  choice: Сохранить формулу «открывать наготу»
  alternative: 'Передать прямо: «не вступай в половую связь»'
  rationale: Исходный текст использует характерный для этого раздела юридический эвфемизм. Его сохранение поддерживает межтекстовые связи и не навязывает более узкую формулировку.
translation_notes:
  register: Современный литературный русский с dignified юридико-библейским звучанием. Порядок слов сделан естественным для русского языка, а ключевые образы и грамматический переход числа сохранены.
