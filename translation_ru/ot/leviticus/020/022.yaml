base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: ru
  text: Поэтому соблюдайте все Мои постановления и все Мои законы и исполняйте их[b], чтобы земля, в которую Я веду вас, чтобы вы поселились в ней, не извергла вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не извергла вас». Еврейский глагол означает «извергать рвотой» и образно представляет землю изгоняющей осквернивших её жителей.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст использует два разных правовых термина, которые также можно передать как «Мои установления и Мои судебные решения».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Поэтому соблюдайте
  rationale: שׁמר в заветно-правовом контексте означает соблюдать, хранить предписания. Союз связывает повеление с предшествующим предупреждением; «поэтому» естественно передаёт эту связь.
- source_word: חֻקֹּתַי
  choice: Мои постановления
  rationale: חֻקָּה обозначает установленное предписание; «постановления» сохраняет официальный правовой оттенок и отличается от следующего термина.
- source_word: מִשְׁפָּטַי
  choice: Мои законы
  rationale: מִשְׁפָּט здесь относится к обязательным правовым нормам. «Законы» понятно современному читателю и сохраняет отличие от «постановлений», хотя диапазон слова включает также судебные решения и установления.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: и исполняйте их
  rationale: עשה с правовыми предписаниями означает исполнять, осуществлять их; это естественнее по-русски, чем буквальное «делайте их».
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: чтобы ... не извергла вас
  rationale: קיא буквально означает «извергать рвотой». Глагол «извергнуть» сохраняет резкий телесный образ и олицетворение земли, оставаясь уместным в литературном русском.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте речь идёт о земле, куда Бог вводит Израиль; обычное русское соответствие — «земля».
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: в которую Я веду вас
  rationale: Причастная форма מֵבִיא представляет действие Бога как происходящее; «веду» передаёт направленное движение и звучит естественно.
- source_word: לָשֶׁבֶת בָּהּ
  choice: поселиться
  rationale: ישׁב здесь означает жить или обосноваться в земле. «Поселиться» кратко и естественно выражает цель введения в неё без избыточного местоименного повтора.
theological_decisions:
- issue: Образ земли, извергающей осквернившихся жителей
  choice: 'Сохранить олицетворение и резкую метафору: «земля ... не извергла вас».'
  alternative: «земля не отвергла вас» или «не исторгла вас»
  rationale: Еврейский קיא обозначает рвоту и намеренно создаёт сильный образ изгнания из осквернённой земли. Смягчение до «отвергла» ослабило бы предупреждение.
- issue: Различение חֻקּוֹת и מִשְׁפָּטִים
  choice: 'Передать двумя разными правовыми терминами: «постановления» и «законы».'
  alternative: «установления и судебные решения» либо обобщённое «законы» для обоих слов
  rationale: Оригинал использует два различных термина. Раздельная передача сохраняет структуру правовой лексики, не навязывая жёсткого систематического разграничения их категорий.
- issue: Связь повеления с угрозой изгнания
  choice: 'Передать וְלֹא конструкцией цели/предотвращаемого результата: «чтобы ... не извергла».'
  alternative: 'Сочинительное предупреждение: «и земля не извергнет вас»'
  rationale: В данном контексте отрицательная форма после повеления естественно выражает предотвращаемый итог соблюдения заповедей, но не превращается в безусловную гарантию вне заветного предупреждения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской правовой речи. Синтаксис упрощён без утраты связи между повелением и предупреждением; яркая метафора оригинала сохранена. Все сноски отмечены в основном тексте.
