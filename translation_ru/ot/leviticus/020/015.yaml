  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: ru
  text: Если мужчина вступит в половую связь с животным, он непременно должен быть предан смерти, а животное убейте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: мужчина
  rationale: Существительное стоит в мужском роде и обозначает именно мужчину; следующий стих отдельно рассматривает женщину.
- source_word: אֲשֶׁר
  choice: если
  rationale: В казуистической правовой формуле относительная конструкция естественно передаётся по-русски условным союзом «если».
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: вступит в половую связь
  rationale: Еврейское выражение буквально связано с «ложем/лежанием», но служит идиомой полового сношения; выбран ясный, современный и достойный русский эквивалент.
- source_word: בִּבְהֵמָה
  choice: с животным
  rationale: בְּהֵמָה здесь обозначает животное; этот вариант точен и естественен в современном русском языке.
- source_word: מוֹת יוּמָת
  choice: его непременно следует предать смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает категоричность смертного приговора; «непременно» передаёт эмфазу.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: убейте также и животное
  rationale: Форма второго лица множественного числа прямо обращена к исполнителям постановления; частицы «также и» естественно подчёркивают вынесенный вперёд объект и присоединение второй меры.
theological_decisions:
- issue: Указание пола виновного
  choice: конкретно мужчина
  alternative: обобщённое «человек»
  rationale: Мужской пол обозначен исходным словом, а случай женщины рассматривается отдельно в следующем стихе; обобщение стёрло бы структуру закона.
- issue: Степень категоричности смертного приговора
  choice: «непременно следует предать смерти»
  alternative: «да будет предан смерти»
  rationale: Выбранная формулировка сохраняет как нормативную силу закона, так и усиление конструкции מוֹת יוּמָת, не уточняя способ исполнения.
translation_notes:
  register: Современный литературный русский язык; правовая формулировка остаётся строгой и ясной. Идиома передана прямо, без эвфемистической неясности и без излишне медицинского оттенка.
