base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: ru
  text: то Я Сам обращу Своё лицо против того человека и против его семьи; Я отсеку[a] его и всех, кто вслед за ним предаётся блуду, предаваясь блуду вслед за Молохом[b], из среды их народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Отсеку» — выражение суда в рамках завета. Здесь не уточняется, означает ли оно смерть, изгнание или иной вид удаления Божьим судом.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «предаваться блуду вслед за Молохом». Древнееврейский текст метафорически изображает идолопоклонство как половую неверность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: то Я Сам обращу Своё лицо против
  rationale: Сохраняет древнееврейскую идиому направленного Божьего противодействия и передаёт усилительное אֲנִי словом «Сам».
- source_word: בָּאִישׁ הַהוּא
  choice: против того человека
  rationale: Естественно передаёт указание на конкретного виновного; русское «человек» здесь не устраняет контекстуальную мужскую референцию.
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: и против его семьи
  rationale: מִשְׁפָּחָה может обозначать семью или более широкий род; «семья» наиболее естественно в современном русском и сохраняет допустимую широту.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: Я отторгну его
  rationale: «Отторгну» сохраняет образ удаления из общины и формульный характер заветного суда, не уточняя его механизм.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: и всех, кто вслед за ним предаётся блуду
  rationale: Сохраняет метафору половой неверности для идолопоклоннического отступничества; «вслед за ним» передаёт אַחֲרָיו и связь с примером виновного.
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: идя за Молохом
  rationale: В русском дословное повторение «блудить… чтобы блудить вслед» звучит неестественно. Оборот передаёт направленность преданности Молоху, тогда как метафора блуда уже сохранена непосредственно перед ним.
- source_word: הַמֹּלֶךְ
  choice: Молох
  rationale: Традиционная и узнаваемая русская передача имени божества в данном контексте; артикль отдельно не воспроизводится.
- source_word: מִקֶּרֶב עַמָּם
  choice: из среды их народа
  rationale: Сохраняет идиому удаления из общины и множественный суффикс в עַמָּם, относящийся к совокупному объекту суда.
theological_decisions:
- issue: Метафора половой неверности применительно к идолопоклонству
  choice: Сохранить образ выражением «предаётся блуду».
  alternative: «отступает», «изменяет Мне» или «поклоняется идолам»
  rationale: Корень זנה намеренно выражает идолопоклонство как неверность в отношениях завета; более отвлечённые варианты ослабили бы риторическую и богословскую силу текста.
- issue: Смысл кары כרת
  choice: Передать как «отторгну», не уточняя способ исполнения суда.
  alternative: «предам смерти», «изгоню» или «истреблю»
  rationale: Стих утверждает Божий суд и удаление из народа, но не определяет однозначно, совершается ли оно через смерть, изгнание или иное действие.
- issue: Суд над семьёй виновного
  choice: Сохранить прямое утверждение «против его семьи».
  alternative: Истолковать семью только как соучастников и явно добавить это условие.
  rationale: Исходный текст называет семью без пояснения степени её участия; перевод не должен ни устранять напряжение, ни добавлять отсутствующее условие.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Сохранены идиома о Божьем лице, метафора блуда и неопределённость формулы כרת; синтаксис слегка сглажен ради ясности без устранения богословского напряжения.
