  source_fidelity: 'Основная смысловая структура передана верно: усиленное «Я Сам», направленность суда против человека и его семьи, множественный «их народа» и неуточнённый характер кары сохранены. Однако «идя за Молохом» не передаёт повторённый в еврейском тексте глагол זנה («блудодействовать/предаваться блуду») в инфинитиве לִזְנוֹת. Его следует сохранить и во второй части оборота.'
  naturalness: Текст в целом литературен и понятен. «Отсеку» — более прозрачное и устойчивое русское соответствие формуле כרת, чем «отторгну», при этом оно не вынуждает выбирать между смертью, изгнанием и иным Божьим удалением. Повтор «следуя» несколько тяжеловесен, но в законодательной речи оправдан точностью и сохраняет намеренный повтор исходного текста.
  terminology: '«Молох» является традиционной русской передачей имени. «Предаваться блуду» сохраняет метафору неверности; во второй части также нужен этот образ. Сноски должны оставаться привязаны: a — к «отсеку», b — к Молоху/обороту о блуде вслед за Молохом.'
