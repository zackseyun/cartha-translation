  source_fidelity: 'Первая часть точно передаёт предписание проводить различие между чистыми и нечистыми животными и птицами. «Не делайте себя отвратительными» удачно сохраняет отдельную лексику שׁקץ, не подменяя её «осквернением». Однако «— всем тем, что Я отделил...» неудачно меняет синтаксическую связь: относительное определение в еврейском тексте относится к последнему обобщающему обозначению существ, ползающих по земле, а не вводит обособленное «всё то» после всего ряда.'
