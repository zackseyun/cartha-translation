source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: ru
  text: Отличайте чистое животное от нечистого и нечистую птицу от чистой. Не делайте себя[b] отвратительными[a] ни животным, ни птицей, ни чем-либо, что ползает по земле и что Я отделил для вас как нечистое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мерзкими». Еврейский глагол выражает идею отвращения или омерзительности; это не обычный глагол со значением «становиться нечистым».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ваши души»; здесь это еврейский способ сказать «самих себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: Отличайте
  rationale: Побудительное значение формы в данном контексте передано естественным русским императивом; глагол сохраняет идею проведения различия.
- source_word: הַבְּהֵמָה
  choice: животное
  rationale: Широкое и современное обозначение наземного животного; «скот» здесь было бы чрезмерно узким, а «зверь» — стилистически и семантически менее точным.
- source_word: הַטְּהֹרָה / הַטְּמֵאָה / הַטָּמֵא / הַטָּהֹר
  choice: чистое / нечистое
  rationale: Сохраняются установленные в Левите категории обрядовой чистоты без их морализации.
- source_word: הָעוֹף
  choice: птица
  rationale: В контексте пищевых установлений это наиболее ясное и естественное русское соответствие.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: Не делайте ... отвратительными
  rationale: Передаёт каузативно-рефлексивный смысл и семантику отвращения корня שׁקץ, не смешивая его с терминологией нечистоты טמא.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: себя
  rationale: נפשׁ обозначает здесь самих людей, а не отдельно понимаемую нематериальную душу; русское «себя» естественно передаёт идиому.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: ни чем-либо ползающим по земле
  rationale: Сохраняет широкое значение движущихся у земли существ и естественно соединяется с отрицательной конструкцией «ни ... ни».
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: всем тем, что Я отделил для вас как нечистое
  rationale: «Отделил» поддерживает повтор корня בדל, а «как нечистое» ясно выражает установленную Богом классификацию.
theological_decisions:
- issue: Обрядовые категории или нравственная оценка
  choice: «чистое / нечистое» как категории установленной для Израиля чистоты
  alternative: «непорочное / порочное» либо морализующее толкование
  rationale: Контекст касается различения животных в рамках законов святости; текст не сводит эти категории ни к нравственным качествам животных, ни к гигиене.
- issue: Значение נֶפֶשׁ во множественном выражении אֶת נַפְשֹׁתֵיכֶם
  choice: «себя», то есть самих людей
  alternative: «ваши души»
  rationale: Идиома указывает на целого человека и не требует антропологического противопоставления души телу.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Императивы кратки и ясны; сохранено различие между лексикой отвращения (שׁקץ) и обрядовой нечистоты (טמא). Повтор корня בדל частично отражён глаголами «отличайте» и «отделил».
