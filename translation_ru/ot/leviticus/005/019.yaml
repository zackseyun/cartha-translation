base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: ru
  text: Это жертва повинности[a]; он действительно виновен перед ГОСПОДОМ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это жертва за вину; он несомненно виновен перед ГОСПОДОМ». В еврейском тексте существительное «вина / жертва повинности» и глагол «быть виновным» образованы от одного корня; повтор усиливает утверждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: жертва повинности
  rationale: В данном жертвенном контексте существительное обозначает установленный вид жертвы за вину. «Жертва повинности» сохраняет связь с виновностью и отличает её от жертвы за грех.
- source_word: הוּא
  choice: это
  rationale: Местоимение выполняет функцию именной связки и указывает на только что описанную жертву.
- source_word: אָשֹׁם אָשַׁם
  choice: действительно виновен
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает утверждение. Наречие «действительно» естественно передаёт это усиление по-русски.
- source_word: לַיהוָה
  choice: перед ГОСПОДОМ
  rationale: Предлог ל при глаголе אָשַׁם выражает виновность и ответственность по отношению к Богу. «Перед ГОСПОДОМ» сохраняет судебно-религиозный оттенок, не сводя выражение исключительно к прямому проступку против Бога.
- source_word: יהוה
  choice: ГОСПОДЬ
  rationale: Тетраграмматон передан традиционным русским эквивалентом «ГОСПОДЬ», с прописным начертанием для обозначения Божьего имени.
theological_decisions:
- issue: Связь לַיהוָה с заключительным утверждением о виновности
  choice: «виновен перед ГОСПОДОМ» — человек несёт реальную ответственность перед Богом
  alternative: «виновен против ГОСПОДА» либо «жертва повинности ГОСПОДУ»
  rationale: Синтаксис естественно связывает לַיהוָה с глаголом אָשַׁם. Формулировка «перед ГОСПОДОМ» передаёт ответственность перед Богом и сохраняет более широкий смысл предлога, тогда как «против» сильнее подчёркивало бы непосредственную направленность проступка против Бога.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой. Термин «жертва повинности» выбран как узнаваемое название данного вида жертвы; усилительная еврейская конструкция передана естественным русским наречием.
