  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: ru
  text: 'Если кто-либо проявит неверность и непреднамеренно согрешит против святынь Яхве, пусть он принесёт Яхве жертву возмещения[a]: барана без порока из мелкого скота, стоимостью, по твоей оценке, в серебряных сиклях по священному сиклю[b], в жертву возмещения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву повинности» или «жертву за вину». Еврейское слово אָשָׁם может обозначать как ответственность за проступок, так и жертву, посредством которой устранялись его последствия и совершалось возмещение.'
    reason: lexical_alternative
  - marker: b
    text: «Священный сикль» — установленная мера веса, применявшаяся при оценке святынь.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: кто-либо
  rationale: В правовом контексте слово обозначает отдельного человека; русское «кто-либо» естественно вводит общее условие закона.
- source_word: תִמְעֹל מַעַל
  choice: проявит неверность
  rationale: Сочетание глагола с однокоренным существительным усиливает мысль о нарушении священного обязательства; «проявит неверность» передаёт это без излишне архаичной формулировки.
- source_word: וְחָטְאָה בִּשְׁגָגָה
  choice: по неосторожности согрешит
  rationale: בִּשְׁגָגָה указывает на непреднамеренный проступок, а не на сознательное дерзкое нарушение.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: против святынь Яхве
  rationale: Фраза обозначает проступок, затрагивающий посвящённые Богу предметы, приношения или повинности; «против святынь» кратко и естественно выражает направленность нарушения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: жертва возмещения
  rationale: אָשָׁם может обозначать как возникшую виновность, так и жертву, связанную с устранением вины и возмещением ущерба. В данном контексте оценки священного имущества особенно заметен возместительный смысл.
- source_word: אַיִל תָּמִים
  choice: баран без порока
  rationale: В жертвенном контексте תָּמִים означает отсутствие физического изъяна; эта формула ясна и привычна в русском библейском стиле.
- source_word: מִן הַצֹּאן
  choice: из мелкого скота
  rationale: צֹאן — собирательное название мелкого домашнего скота; поскольку אַיִל уже уточняет, что речь о баране, буквальная категория сохраняется без двусмысленности.
- source_word: בְּעֶרְכְּךָ כֶּסֶף שְׁקָלִים
  choice: стоимостью, по твоей оценке, в серебряных сиклях
  rationale: Формулировка сохраняет обращение во втором лице единственного числа и ясно показывает, что стоимость животного определяется денежной оценкой.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному сиклю
  rationale: Речь идёт о нормативной мере веса, применявшейся при священных оценках.
theological_decisions:
- issue: Передача названия жертвы אָשָׁם
  choice: жертва возмещения
  alternative: жертва повинности; жертва за вину
  rationale: Выбранный вариант передаёт восстановительно-возместительную сторону обряда в законе об ущербе святыням. Альтернативы остаются филологически возможными, поэтому они отмечены в сноске.
- issue: Обобщённый субъект и последующее мужское единственное число
  choice: «кто-либо… пусть он принесёт»
  alternative: «если человек… пусть принесёт»
  rationale: Сохранена форма единичного представителя, характерная для еврейского правового изложения, без ограничения закона только мужчинами.
- issue: Связь проступка со святынями
  choice: «согрешит против святынь»
  alternative: «согрешит в отношении святынь»
  rationale: Предлог מִן допускает контекстуальное понимание затронутой сферы или объекта. «Против» выражает нарушение, но не уточняет сверх текста конкретный вид присвоения либо ущерба.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным правовым и богослужебным оттенком. Синтаксис сделан ясным для обычного читателя; сохранены единичная законодательная формула, личное имя Яхве и технические реалии жертвенного закона.
