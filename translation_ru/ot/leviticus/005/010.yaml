base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: ru
  text: Вторую же птицу пусть принесёт во всесожжение по установленному порядку[a]. Так священник совершит за него искупление за грех, который он совершил, и ему будет прощено[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как предписано».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и будет прощено ему»; пассивная формула оставляет Подателя прощения неназванным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: вторую птицу
  rationale: Порядковое прилагательное отсылает ко второй из двух птиц в предыдущем контексте; существительное «птицу» восполнено для естественности и ясности по-русски.
- source_word: יַעֲשֶׂה עֹלָה
  choice: пусть принесёт во всесожжение
  rationale: В жертвенном контексте широкое עשה обозначает совершение предписанного приношения; русская формула передаёт действие естественно, не сводя его лишь к приготовлению.
- source_word: כַּמִּשְׁפָּט
  choice: по установленному порядку
  rationale: מִשְׁפָּט здесь означает предписанную норму или процедуру совершения жертвы.
- source_word: וְכִפֶּר עָלָיו
  choice: совершит за него искупление
  rationale: Сохраняется принятая культовая терминология книги Левит и значение действия священника в интересах приносящего жертву.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: от греха, который тот совершил
  rationale: Предлог מן при כפר допускает оттенок освобождения от греха; местоимение «тот» устраняет возможную русскую двусмысленность относительно того, кто согрешил.
- source_word: וְנִסְלַח לוֹ
  choice: и ему будет прощено
  rationale: Безлично-пассивная формула близко отражает еврейский текст и оставляет совершающего прощение не названным.
theological_decisions:
- issue: Значение священнического כפר
  choice: совершит за него искупление
  alternative: очистит его; испросит ему прощение
  rationale: «Совершит искупление» сохраняет культово-богословскую ёмкость термина, не ограничивая его только очищением или ходатайством.
- issue: Неявный субъект прощения
  choice: ему будет прощено
  alternative: Господь простит его; он будет прощён
  rationale: Еврейская пассивная формула не называет Бога прямо; перевод сохраняет эту сдержанность и не заменяет предмет прощения лицом без необходимости.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для текста закона и богослужебного установления. Синтаксис разделён на два предложения ради ясности; сохранены ритуальная терминология и пассивная формула прощения.
