  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: ru
  text: 'Он должен принести Яхве свою жертву повинности[a]: барана без порока из мелкого скота, по твоей оценке, в жертву повинности, к священнику.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово אָשָׁם может означать вину, возмещение за неё или особую жертву, приносимую в связи с виной.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: свою жертву повинности
  rationale: В данном предписании אָשָׁם обозначает приношение, связанное с виной и возмещением ущерба. «Жертва повинности» передаёт принятую культовую категорию, а примечание сохраняет более широкий смысл слова.
- source_word: יָבִיא
  choice: пусть он принесёт
  rationale: Каузативный имперфект в юридическом предписании выражает обязательное действие; русская конструкция «пусть принесёт» сохраняет предписывающую силу и звучит естественно.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, а не заменяет его титулом «Господь».
- source_word: אַיִל תָּמִים
  choice: барана без порока
  rationale: אַיִל — взрослый самец овцы; תָּמִים в жертвенном контексте означает отсутствие телесного изъяна, делающего животное неприемлемым.
- source_word: מִן הַצֹּאן
  choice: из мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз; слово «баран» уже уточняет вид требуемого животного.
- source_word: בְּעֶרְכְּךָ
  choice: по твоей оценке
  rationale: Сохраняет юридический смысл определения стоимости и форму второго лица единственного числа, хотя адресат внутри самого стиха прямо не назван.
- source_word: לְאָשָׁם
  choice: в жертву повинности
  rationale: Здесь לְאָשָׁם указывает на назначение барана как жертвы установленной категории.
- source_word: אֶל הַכֹּהֵן
  choice: к священнику
  rationale: Буквально передаёт направление принесения животного к священнику.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя и не смешивает с титулом.
- issue: Два употребления אָשָׁם в одном стихе
  choice: В обоих случаях «жертва повинности», с пояснением смыслового диапазона первого употребления
  alternative: Первое употребление — «возмещение» или «приношение за вину», второе — «жертва повинности»
  rationale: Одинаковый перевод сохраняет явный лексический повтор еврейского текста и культовую категорию жертвы, не устраняя при этом репаративный оттенок, отмеченный в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Сохранены юридическая предписывающая форма, повтор ключевого термина и несколько необычный порядок заключительной фразы; традиционное «без порока» здесь ясно и точно передаёт жертвенную пригодность.
