base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: ru
  text: Он принесёт их священнику, а священник сначала представит ту птицу, что предназначена для жертвы за грех[a], затем надломит ей голову с передней стороны шеи[b], но не отделит её полностью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חַטָּאת можно также передать как «очистительная жертва», особенно в контексте жертвенных предписаний книги Левит.
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол обозначает особое обрядовое действие священника с головой жертвенной птицы; точный способ действия установить трудно. Выражение «с передней стороны шеи» передаёт трудную древнееврейскую пространственную формулу.
    reason: lexical_alternative
  - marker: c
    text: То есть голову нельзя было полностью отделять от туловища.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: Он принесёт их священнику
  rationale: Будущее время передаёт предписывающую силу формы в контексте закона; множественное «их» сохраняет отсылку к двум птицам из предыдущего стиха.
- source_word: וְהִקְרִיב
  choice: и тот… представит
  rationale: В породе хифиль глагол обозначает ритуальное представление или принесение жертвы. Местоимение «тот» естественно указывает на священника как исполнителя последующего обряда, не смешивая доставление птиц со священнодействием.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: сначала… птицу, предназначенную для жертвы за грех
  rationale: Переданы как первоочерёдность действия, так и назначение одной из двух птиц; слово «птицу» восстановлено из ближайшего контекста для ясности по-русски.
- source_word: חַטָּאת
  choice: жертва за грех
  rationale: Это понятный и укоренившийся русский термин для данного вида левитской жертвы; возможный акцент на очищении отмечен в сноске.
- source_word: וּמָלַק
  choice: надломит
  rationale: Редкий технический глагол описывает особое ручное действие священника с головой или шеей жертвенной птицы. «Надломит» согласуется с прямым объектом «голову» и с последующим запретом полностью отделять её.
- source_word: מִמּוּל עָרְפּוֹ
  choice: у затылка
  rationale: עֹרֶף обозначает заднюю часть шеи, затылок; трудное מִמּוּל указывает на место или сторону действия. Краткая формулировка не создаёт ложной анатомической точности.
- source_word: וְלֹא יַבְדִּיל
  choice: но не отделит её полностью
  rationale: В данном обрядовом контексте запрет означает, что голову нельзя полностью отделять от тела; наречие «полностью» делает практический смысл ясным.
