source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: ru
  text: Или если он прикоснётся к человеческой нечистоте[a] — к любой нечистоте, от которой человек становится нечистым, — и это будет скрыто от него[b], а потом он узнает об этом, то он виновен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечистоте, исходящей от человека». Здесь имеется в виду ритуальная нечистота.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и это было скрыто от него», то есть в тот момент он этого не осознавал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: прикоснётся к
  rationale: Глагол נגע с предлогом ב обозначает физическое соприкосновение; «прикоснётся к» прямо и естественно передаёт это значение.
- source_word: טֻמְאַת אָדָם
  choice: человеческой нечистоте
  rationale: В данном правовом контексте טֻמְאָה обозначает ритуальную нечистоту, а אָדָם указывает на человека как её источник, без ограничения по полу.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: к любой нечистоте
  rationale: Фраза охватывает любой вид нечистоты, связанной с человеческим источником; местоименный суффикс естественно передан по-русски без буквального «его».
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: от которой человек становится нечистым
  rationale: Относительное придаточное описывает действие нечистоты. Обобщённое «человек» сохраняет общий смысл и ясно выражает ритуальный статус.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: и это будет скрыто от него
  rationale: 'Сохранена пассивная форма еврейского нифаля: случившееся осталось вне осознания человека.'
- source_word: וְהוּא יָדַע
  choice: а потом он узнает об этом
  rationale: Контекст задаёт последующее осознание после первоначального неведения; «потом» естественно делает эту временную последовательность явной.
- source_word: וְאָשֵׁם
  choice: то он виновен
  rationale: В правовом и жертвенном контексте אשם обозначает наличие вины или ответственности; «виновен» кратко сохраняет судебно-правовой смысл.
theological_decisions:
- issue: Характер טֻמְאָה в законе Левита
  choice: нечистота
  alternative: осквернение; греховность
  rationale: Речь идёт о ритуальной нечистоте, возникающей от соприкосновения, а не о нравственной греховности как таковой. Перевод сохраняет установленную текстом культово-правовую категорию.
- issue: Обобщённое значение אָדָם
  choice: человеческая
  alternative: мужская; принадлежащая мужчине
  rationale: אָדָם здесь обозначает человека вообще, а не лицо мужского пола; выбранный вариант сохраняет общий охват исходного выражения.
- issue: Связь неведения, последующего знания и вины
  choice: 'сохранить последовательность: обстоятельство было скрыто, затем человек узнал, и он виновен'
  alternative: истолковать вину как возникающую только в момент осознания
  rationale: Еврейская последовательность допускает напряжение между объективной нечистотой, неведением и признанием вины; перевод не уточняет сверх текста точный момент возникновения вины.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Синтаксис сохраняет последовательность еврейского оригинала, но остаётся понятным обычному читателю; термин «нечистота» последовательно употреблён в ритуально-правовом смысле.
