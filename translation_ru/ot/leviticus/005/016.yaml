  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: ru
  text: Пусть он возместит ущерб, причинённый святыне[a], прибавит к этому пятую часть и отдаст священнику. Священник совершит за него искупление бараном, принесённым в жертву повинности[b], и ему будет прощено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возместит то, что неправомерно удержал из посвящённого». Еврейский оборот обозначает возмещение за проступок, связанный со святыней или священным имуществом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посредством барана для жертвы повинности»; возможный перевод названия жертвы — «жертва возмещения».'
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: то, в чём согрешил против святыни
  rationale: Оборот указывает на проступок, связанный со священным имуществом или положенными святыне приношениями. Формулировка сохраняет широту еврейского הַקֹּדֶשׁ и не сужает значение до храма или конкретно удержанного имущества.
- source_word: יְשַׁלֵּם
  choice: возместит
  rationale: В данном юридическом контексте форма глагола שלם означает восстановление причинённого имущественного ущерба, а не просто уплату.
- source_word: חֲמִישִׁתוֹ יוֹסֵף עָלָיו
  choice: прибавит к этому пятую часть
  rationale: Передаёт дополнительную выплату в размере одной пятой от основной суммы естественным современным русским языком.
- source_word: לַכֹּהֵן
  choice: священнику
  rationale: Прямое и общепринятое соответствие; дательный падеж естественно выражает адресата передачи.
- source_word: יְכַפֵּר עָלָיו
  choice: совершит за него искупление
  rationale: Сохраняет культово-жертвенное значение כפר и привычную библейскую терминологию, оставаясь понятным современному читателю.
- source_word: בְּאֵיל הָאָשָׁם
  choice: посредством барана — жертвы повинности
  rationale: Предлог ב передаёт средство совершения искупления, а конструкция связывает барана с установленным видом жертвы. Тире делает русскую формулировку ясной, не устраняя возможный оттенок возмещения.
- source_word: וְנִסְלַח לוֹ
  choice: и ему будет прощено
  rationale: Безлично-пассивная формулировка близко отражает еврейскую конструкцию и не называет явно подразумеваемого Бога субъектом прощения.
theological_decisions:
- issue: Передача жертвенного термина אָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения
  rationale: «Жертва повинности» передаёт связь термина с виновностью и является узнаваемым библейским обозначением. Альтернатива сильнее подчёркивает возмещение, которое в этом стихе уже ясно выражено предписанием возместить ущерб и добавить пятую часть.
- issue: Субъект прощения в וְנִסְלַח לוֹ
  choice: ему будет прощено
  alternative: Бог простит его
  rationale: Еврейский текст выражает прощение пассивной конструкцией и не называет субъекта. Выбранный вариант сохраняет это благоговейное умолчание и не добавляет в основной текст отсутствующее слово.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим законодательному и культовому контексту. Синтаксис сделан ясным для обычного читателя; сохранены ключевые библейские термины «святыня», «искупление» и «жертва повинности». Формы «пусть возместит» и «будет прощено» передают предписывающий характер текста без архаического «да».
