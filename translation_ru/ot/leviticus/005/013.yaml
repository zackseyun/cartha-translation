  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: ru
  text: Так священник совершит для него искупление за его грех, совершённый им в одном из этих случаев, и этот человек будет прощён[a]. Это приношение будет принадлежать священнику, как хлебное приношение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «и будет ему прощено». В еврейском тексте стоит пассивная форма, и прощающий прямо не назван.'
    reason: Альтернативная передача пассивной формулы וְנִסְלַח לוֹ.
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: совершит за него искупление
  rationale: В священническом ритуальном контексте כפר с עַל обозначает совершение искупительного обряда за согрешившего; формулировка сохраняет культовый смысл и не связывает его с одной частной теорией искупления.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное и контекстуально точное соответствие для כֹּהֵן в законодательстве Левита.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: за грех, который тот совершил
  rationale: Хотя חטאת может обозначать и грех, и жертву за грех, относительное предложение אֲשֶׁר חָטָא указывает здесь на совершённый проступок. Местоимение «тот» естественно отличает согрешившего от священника.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: в одном из этих случаев
  rationale: Фраза отсылает к перечисленным выше ситуациям; «в одном из этих случаев» естественно передаёт частичное значение конструкции.
- source_word: וְנִסְלַח לוֹ
  choice: и он будет прощён
  rationale: Русская пассивная конструкция естественна, обозначает прощение согрешившего и, как еврейский текст, не называет прощающего.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: Это приношение будет принадлежать священнику
  rationale: Форма указывает на то, что принесённое переходит священнику. Добавление «это приношение» устраняет в русском языке неясную местоименную отсылку, не вводя нового участника или действия.
- source_word: כַּמִּנְחָה
  choice: как и хлебное приношение
  rationale: В данном разделе מִנְחָה обозначает приношение из муки; традиционно понятное «хлебное приношение» передаёт его как особый вид бескровной жертвы, а частица «и» естественно выражает сопоставление правил.
theological_decisions:
- issue: Формула прощения после жертвенного обряда
  choice: и он будет прощён
  alternative: и будет ему прощено
  rationale: Основной вариант ясно относит результат к согрешившему, сохраняя пассив и не называя Бога грамматическим субъектом. Альтернатива ближе воспроизводит безличность еврейской формулы, поэтому отмечена в сноске.
- issue: Значение חטאת в выражении עַל חַטָּאתוֹ
  choice: за грех
  alternative: за жертву за грех
  rationale: Слова «который совершил» требуют понимания חטאת как проступка, а не как жертвенного дара; это следует синтаксису и не добавляет богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, подходящей для законодательного и богослужебного контекста. Синтаксис упрощён для ясности, но пассивная формула прощения и культовая терминология сохранены.
