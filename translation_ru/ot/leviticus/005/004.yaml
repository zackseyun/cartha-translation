  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: ru
  text: Или если кто-нибудь необдуманно произнесёт клятву сделать зло или добро[a] — что бы человек ни произнёс в клятве, — и это будет от него скрыто[b], а затем он узнает об этом и окажется виновен в одном из этих случаев,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение может означать просто «произнесёт своими устами»; в данном контексте оно, вероятно, указывает на поспешную или необдуманную клятву.
    reason: lexical_alternative
  - marker: b
    text: То есть человек некоторое время не осознаёт этого; еврейский текст не уточняет, идёт ли речь о самой клятве, её последствиях или нарушении.
    reason: ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: кто-нибудь
  rationale: В законодательной формуле слово обозначает отдельного человека, а не нематериальную «душу»; неопределённое местоимение естественно вводит условный случай по-русски.
- source_word: תִשָּׁבַע
  choice: поклянётся
  rationale: Форма глагола שׁבע здесь означает принесение клятвы; совершенный вид естественен в русском условном предложении.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: необдуманно поклянётся своими устами
  rationale: Сохранён образ уст как указание на словесно произнесённую клятву. Наречие «необдуманно» передаёт вероятный контекстуальный оттенок поспешного высказывания, а примечание сохраняет более нейтральную возможность понимания.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: сделать зло или добро
  rationale: Передана широкая полярная формула содержания клятвы без сужения до причинения вреда или оказания помощи.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: что бы человек ни высказал под клятвой
  rationale: Фраза обобщает названные случаи. «Человек» естественно передаёт родовое значение הָאָדָם и не ограничивает действие закона мужчинами.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: это останется от него скрытым
  rationale: 'Сохранена пассивная образность еврейского текста и неоднозначность того, что именно не было осознано: сама клятва, её последствия либо нарушение.'
- source_word: וְהוּא יָדַע
  choice: а потом он осознает это
  rationale: «Потом» ясно передаёт переход от прежней неосведомлённости к последующему осознанию.
- source_word: וְאָשֵׁם
  choice: окажется виновен
  rationale: Формулировка передаёт установленную виновность и юридическую ответственность, не утверждая, что нравственная вина возникает лишь в момент осознания.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: в чём-либо из этого
  rationale: Выражение отсылает к перечисленным случаям и сохраняет обобщённый характер формулы.
theological_decisions:
- issue: Момент возникновения виновности
  choice: «а потом он осознает это и окажется виновен»
  alternative: «и, узнав это, станет виновен»
  rationale: Выбранная формулировка передаёт последовательность текста, но не решает богословски, возникает ли вина только при осознании или тогда лишь становится известной человеку.
- issue: Родовое значение הָאָדָם
  choice: «человек»
  alternative: «мужчина»
  rationale: В данном юридическом обобщении הָאָדָם обозначает любого человека; перевод «мужчина» необоснованно сузил бы область действия закона.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным юридическим звучанием. Сохранена незавершённость синтаксиса стиха посредством конечной запятой, поскольку условная конструкция продолжается в следующем стихе.
