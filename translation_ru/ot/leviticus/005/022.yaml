  text: אֽוֹ מָצָ֧א אֲבֵדָ֛ה וְ/כִ֥חֶשׁ בָּ֖/הּ וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר עַל אַחַ֗ת מִ/כֹּ֛ל אֲשֶׁר יַעֲשֶׂ֥ה הָ/אָדָ֖ם לַ/חֲטֹ֥א בָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: ru
  text: или нашёл потерянное и солгал об этом, и ложно поклялся — в чём бы то ни было из всего того, что человек может сделать, согрешая этим, —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: потерянное
  rationale: Субстантивированное прилагательное естественно передаёт найденную потерянную вещь, не сужая значение до конкретного вида имущества.
- source_word: וְכִחֶשׁ בָּהּ
  choice: и солгал об этом
  rationale: Глагол כחש в данном контексте означает отрицать или лгать относительно найденного; местоимение отсылает к находке.
- source_word: וְנִשְׁבַּע עַל שָׁקֶר
  choice: и поклялся ложно
  rationale: Сохраняется прямое указание на ложную клятву без добавления отсутствующих в тексте обстоятельств.
- source_word: הָאָדָם
  choice: человек
  rationale: Здесь существительное обозначает человека вообще, а не специально мужчину; современное русское «человек» сохраняет родовое значение.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: и тем согрешить
  rationale: Передаёт целевое/результативное значение инфинитива и инструментально-обстоятельственный оттенок בָהֵנָּה, сохраняя связь греха с перечисленными поступками.
theological_decisions:
- issue: Обобщающий субъект הָאָדָם
  choice: человек
  alternative: мужчина
  rationale: Контекст устанавливает общую нравственную ответственность; еврейское הָאָדָם здесь родовое и не требует полового уточнения.
- issue: Связь поступков с грехом
  choice: что человек может сделать и тем согрешить
  alternative: что человек делает, согрешая этим
  rationale: Выбранная формулировка сохраняет несколько шероховатую смысловую связь оригинала и не превращает её в более узкое толкование.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Стих синтаксически продолжается далее, поэтому сохранены начальное «или» и завершающее тире с запятой; лишние пояснения не добавлены.
