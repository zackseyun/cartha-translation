  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: ru
  text: И пусть он покропит бок жертвенника частью крови жертвы за грех[a], а оставшуюся кровь выжмет у основания жертвенника. Это жертва за грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или в обоих случаях: «очистительная жертва» (в начале стиха: «частью крови очистительной жертвы»). Еврейское слово חַטָּאת может обозначать жертву за грех, подчёркивая её очистительную функцию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: пусть он покропит
  rationale: Каузативная порода глагола נזה в жертвенном контексте обозначает обрядовое нанесение крови кроплением; «покропит» точно и естественно передаёт это действие.
- source_word: מִדַּם הַחַטָּאת
  choice: кровью жертвы за грех
  rationale: 'Предлог מִן имеет здесь партитивный смысл: используется часть крови. В русском языке при глаголе «покропить» это естественно выражается творительным падежом без обязательного добавления слова «частью».'
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: бок жертвенника
  rationale: קִיר буквально означает «стена», но применительно к жертвеннику речь идёт о его боковой поверхности; «бок» передаёт конкретный смысл без неуместного архитектурного оттенка.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: а оставшуюся кровь
  rationale: Субстантивированное причастие от שׁאר означает то, что осталось; русская конструкция «оставшуюся кровь» кратка и естественна.
- source_word: יִמָּצֶה
  choice: выжмет
  rationale: Глагол מצה обозначает выжимание или извлечение оставшейся крови, особенно из птичьей жертвы; «выжмет» точнее, чем общее «выльет».
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: у основания жертвенника
  rationale: יְסוֹד — основание или нижняя часть жертвенника; предлог אֶל при таком действии допускает естественное русское обозначение места «у основания».
- source_word: חַטָּאת הוּא
  choice: Это жертва за грех
  rationale: Заключительная фраза определяет вид жертвы; сохранён тот же термин, что и в первой части стиха.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: חַטָּאת может называть жертву в связи с грехом и одновременно подчёркивать её очистительную функцию. Основной текст сохраняет узнаваемое «жертва за грех», а значимая смысловая альтернатива отмечена в сноске без устранения напряжения между оттенками.
