id: LEV.5.18
reference: Leviticus 5:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: ru
  text: Пусть он приведёт к священнику из мелкого скота барана без изъяна, по твоей оценке, в жертву повинности[a]. Священник совершит за него искупление за ошибку, которую тот допустил ненамеренно, не зная об этом[b], и он будет прощён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как жертву повинности»; возможный перевод: «как возместительную жертву». Еврейское אָשָׁם обозначает особую категорию жертвоприношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за его неумышленный грех». Еврейское выражение подчёркивает, что проступок был совершён по ошибке, без осознания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Пусть он приведёт
  rationale: В законодательном контексте форма выражает предписание; конструкция с «пусть» естественно передаёт это значение в современном русском языке.
- source_word: אַיִל תָּמִים
  choice: барана без изъяна
  rationale: אַיִל обозначает взрослого самца овцы, а תָּמִים в жертвенном контексте — животное без физического порока.
- source_word: מִן הַצֹּאן
  choice: из мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз; поскольку אַיִל уже уточняет вид животного, формулировка остаётся точной и естественной.
- source_word: בְּעֶרְכְּךָ
  choice: по твоей оценке
  rationale: Сохранены обращение во втором лице и значение установленной оценки без добавочного уточнения о том, кто именно её производит.
- source_word: לְאָשָׁם
  choice: в жертву повинности
  rationale: אָשָׁם здесь называет особую категорию жертвоприношения; традиционно узнаваемый термин сохраняет связь повинности и возмещения.
- source_word: וְכִפֶּר עָלָיו
  choice: Священник совершит за него искупление
  rationale: Формулировка передаёт священническое жертвенное действие כפר и значение עָלָיו как действия в пользу виновного.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: за ошибку, которую тот допустил ненамеренно
  rationale: Сохранены смысл непреднамеренного проступка и повтор корня שׁגג, насколько это допускает естественная русская речь, без усиления до умышленного преступления.
- source_word: וְהוּא לֹא יָדַע
  choice: не зная об этом
  rationale: Деепричастная конструкция ясно передаёт отсутствие осознания и связь этой оговорки с ненамеренным характером проступка.
- source_word: וְנִסְלַח לוֹ
  choice: и ему будет прощено
  rationale: Безлично-пассивная формулировка сохраняет подразумеваемого, но не названного в еврейском тексте дарующего прощение.
theological_decisions:
- issue: Передача жертвенного термина אָשָׁם
  choice: жертва повинности
  alternative: возместительная жертва
  rationale: В книге Левит אָשָׁם является названием отдельной категории жертв. Основной вариант узнаваем в русской библейской лексике, а примечание отмечает возместительный оттенок, не сводя значение только к чувству вины.
- issue: Передача глагола כפר
  choice: совершить за него искупление
  alternative: очистить его посредством обряда
  rationale: Выбранный вариант сохраняет богословскую весомость и жертвенно-священнический характер действия, не определяя сверх текста точный механизм искупления.
- issue: Характер проступка в שׁגגה / שׁגג
  choice: ошибка, допущенная ненамеренно
  alternative: неумышленный грех
  rationale: Основной текст следует лексической форме еврейского выражения и сохраняет акцент на непреднамеренности; более явно нравственно-религиозное прочтение дано в примечании.
translation_notes:
  register: Современный литературный русский язык с dignified законодательным ритмом. Сохранены культовые термины «жертва повинности» и «искупление», но синтаксис сделан понятным обычному читателю. Повтор, связанный с непреднамеренностью и незнанием, не устранён, поскольку он значим в исходном тексте.
