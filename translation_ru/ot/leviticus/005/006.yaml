id: LEV.5.6
reference: Leviticus 5:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: ru
  text: 'И пусть он принесёт Яхве за совершённый им грех жертву повинности[a]: самку из мелкого скота — овцу или козу — в жертву за грех. Священник совершит за него искупление за его грех[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «приношение за свою вину» или «возместительную жертву». Еврейское слово אָשָׁם связано с виной и возмещением, тогда как далее животное предназначается «в жертву за грех».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от его греха». Предлог может подчёркивать удаление греха как результат искупления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: И пусть он принесёт
  rationale: В данном законодательном контексте форма выражает предписание. Конструкция с «пусть» естественно передаёт это значение в современном русском языке.
- source_word: אֲשָׁמוֹ
  choice: жертву повинности
  rationale: Сохраняет особый термин אָשָׁם и не устраняет его намеренное соседство с обозначением «жертва за грех» далее в стихе.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: за совершённый им грех
  rationale: Естественно передаёт основание принесения жертвы и сохраняет прямое упоминание совершённого греха.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: самку из мелкого скота
  rationale: Явно сохраняет указание пола; «мелкий скот» точно охватывает следующих далее овцу и козу.
- source_word: כִּשְׂבָּה אֽוֹ שְׂעִירַת עִזִּים
  choice: овцу или козу
  rationale: Контекст уже определяет животное как самку, поэтому повторение «самку овцы или самку козы» по-русски избыточно.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Передаёт культовое значение חַטָּאת и сохраняет отличие от ранее употреблённого אָשָׁם.
- source_word: וְכִפֶּר עָלָיו
  choice: Священник совершит за него искупление
  rationale: Сохраняет культово-богословский смысл כפר, не сводя его к какой-либо одной поздней теории искупления.
- source_word: מֵחַטָּאתוֹ
  choice: за его грех
  rationale: Это естественное русское управление при выражении «совершить искупление»; буквальный оттенок удаления, выраженный предлогом מִן, отмечен в сноске.
theological_decisions:
- issue: Сочетание терминов אָשָׁם и חַטָּאת в одном стихе
  choice: 'Сохранены разные обозначения: «жертва повинности» и «жертва за грех»'
  alternative: Передать אָשָׁם более общо как «приношение за вину» либо назвать חַטָּאת «очистительной жертвой»
  rationale: Сам еврейский текст сополагает два термина. Их унификация скрыла бы реальное напряжение исходного текста.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, стоящее в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным законодательным слогом. Традиционные жертвенные термины сохранены там, где они отражают различия еврейского текста; синтаксис упрощён для естественного чтения.
