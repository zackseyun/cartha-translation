revisions:
- from: И священник совершит за него искупление пред Яхве, и ему будет прощён любой из поступков, которыми он навлёк на себя вину.[a]
  to: И священник совершит за него искупление пред Яхве, и ему будет прощено за любое из всего, что он сделает, навлекая этим на себя вину.[a]
  rationale: 'Исправление восстанавливает синтаксические роли оригинала: прощение даруется человеку, а «любое из всего, что он сделает» обозначает отдельный случай, за который оно даруется. Пассивная безличная форма сохраняет подразумеваемого в еврейском тексте прощающего.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:06:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'В исходном тексте וְנִסְלַח לוֹ означает, что прощение получает человек («ему будет прощено» / «он будет прощён»), тогда как עַל אַחַת מִכֹּל относится к проступку, за который прощение даруется. В черновике эта связь смещена: «ему будет прощён любой из поступков» делает поступок грамматическим объектом прощения.'
  naturalness: «Пред Яхве» и «совершит за него искупление» уместны в современном литературном библейском регистре. Исправленная безлично-пассивная конструкция «ему будет прощено за…» естественна и сохраняет невыраженного деятеля прощения.
  terminology: «Священник», «искупление», «Яхве» и «вина» передают культовую и богословскую лексику без конфессиональных уточнений. «Навлекая этим на себя вину» адекватно передаёт связь действия и виновности в לְאַשְׁמָה בָהּ.
  issues:
  - severity: high
    issue: Перепутаны получатель прощения и основание/предмет, в связи с которым оно даруется.
    rationale: «Ему будет прощён любой из поступков» утверждает прощение поступка. Еврейское לו́ обозначает человека, которому прощается, а עַל אַחַת… — отдельный проступок как основание прощения.
  - severity: low
    issue: Форма «любой из поступков» сужает невыраженное в еврейском тексте «всё, что он сделает» до явно названных поступков.
    rationale: Это не меняет существенно контекстный смысл, но «любое из всего, что он сделает» ближе к синтаксису оригинала и английскому аудиторскому следу.
  revised_text: И священник совершит за него искупление пред Яхве, и ему будет прощено за любое из всего, что он сделает, навлекая этим на себя вину.[a]
