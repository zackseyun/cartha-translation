  text: וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה וְ/נִסְלַ֣ח ל֑/וֹ עַל אַחַ֛ת מִ/כֹּ֥ל אֲשֶֽׁר יַעֲשֶׂ֖ה לְ/אַשְׁמָ֥ה בָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: ru
  text: И священник совершит за него искупление пред Яхве, и ему будет прощено за любое из всего, что он сделает, навлекая этим на себя вину.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «за одно из всего, что он сделает, став через это виновным».'
    reason: Еврейский оборот допускает более буквальное, но менее естественное по-русски выражение связи между совершённым действием и возникновением вины.
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: совершит за него искупление
  rationale: Пиэль глагола כפר в жертвенном контексте означает совершение искупления за человека; эта формулировка сохраняет культовый смысл, не уточняя механизм искупления.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Прямой перевод определённого существительного в культовом контексте.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי обозначает пребывание перед Богом, особенно в святилище; имя יהוה передано как «Яхве».
- source_word: וְנִסְלַח לוֹ
  choice: и ему будет прощён
  rationale: Нифаль глагола סלח выражает полученное прощение; пассивная конструкция сохраняет Бога подразумеваемым действующим лицом, не называя его прямо.
- source_word: עַל אַחַת מִכֹּל
  choice: любой из поступков
  rationale: Оборот выделяет отдельный случай из всей совокупности перечисленных деяний; «любой из» естественно передаёт распределительное значение.
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: которыми он навлёк на себя вину
  rationale: Фраза описывает деяния, посредством которых человек становится виновным. Русская формулировка ясно передаёт эту связь, не смешивая вину с жертвой повинности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — собственное имя Бога; «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Подразумеваемый источник прощения
  choice: пассивное «ему будет прощён»
  alternative: «Бог простит ему»
  rationale: Исходный текст использует пассивную форму и оставляет прощающего подразумеваемым; перевод не делает неявный субъект явным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. «Пред» выбрано как уместная, понятная форма для культового контекста; синтаксис упрощён ради ясности без устранения пассивной формулировки прощения.
