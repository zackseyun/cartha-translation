  to: Если кто услышит призыв дать свидетельство под клятвой[a] и, будучи свидетелем — видел ли он или знал, — не сообщит об этом, то согрешит и понесёт свою вину[b].
  rationale: 'Перестроен условный период: услышанный призыв и статус/знание свидетеля образуют условия случая, а несообщение прямо названо грехом и основанием последующей вины. Сохранены правовой смысл קוֹל אָלָה, различие между видением и иным знанием, а также широкая идиома «нести вину». Сноски сохранены с более нейтральным пояснением.'
