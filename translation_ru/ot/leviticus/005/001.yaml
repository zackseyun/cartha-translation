  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: ru
  text: Если кто услышит призыв дать свидетельство под клятвой[a] и, будучи свидетелем — видел ли он или знал, — не сообщит об этом, то согрешит и понесёт свою вину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышит голос клятвы (или заклятия)». В правовом контексте это торжественный призыв к тому, кто может дать свидетельство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «понесёт своё беззаконие». Еврейское выражение означает, что человек остаётся виновным и несёт ответственность за то, что не сообщил известное ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: кто
  rationale: В законодательной формуле слово обозначает человека; русское условное «если кто» естественно передаёт неопределённое лицо без метафизического оттенка слова «душа».
- source_word: תֶחֱטָא
  choice: согрешит
  rationale: Глагол указывает на виновное нарушение и сохраняет одновременно нравственный и правовой смысл.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: услышит призыв дать свидетельство под клятвой
  rationale: Буквально «услышит голос клятвы/заклятия»; в данном правовом контексте выражение означает торжественный призыв к знающему дело человеку выступить со свидетельством.
- source_word: וְהוּא עֵד
  choice: будучи свидетелем
  rationale: Оборот ясно выражает статус человека по отношению к делу и естественно связывается с последующим уточнением.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: видел ли он сам или узнал иным образом
  rationale: Пара охватывает как непосредственное зрительное свидетельство, так и знание, полученное иначе; это различие стоит сохранить явно.
- source_word: אִם לֹא יַגִּיד
  choice: не сообщит об этом
  rationale: Порода hифиль глагола נגד означает сделать известным, объявить; «сообщит» не сужает смысл исключительно до формальной судебной процедуры.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: понесёт на себе свою вину
  rationale: Сохраняет образ и юридико-нравственную весомость еврейской идиомы, не сводя её только к наказанию.
theological_decisions:
- issue: Неопределённое лицо и грамматический род в правовом установлении
  choice: Передать נֶפֶשׁ конструкцией «если кто», далее использовать мужской род как грамматическое согласование
  alternative: «Если человек… он» либо множественное гендерно-нейтральное изложение
  rationale: Русская условная конструкция «если кто» включает любое лицо и при этом позволяет сохранить единственное число исходного правового случая без искусственной смены числа.
- issue: Смысл קוֹל אָלָה
  choice: Контекстуально раскрыть как призыв дать свидетельство под клятвой, сохранив буквальный вариант в примечании
  alternative: 'Буквально: «голос клятвы» или «голос заклятия»'
  rationale: Контекст говорит об известном свидетелю факте и его обязанности сообщить о нём. Перевод раскрывает правовую функцию выражения, но примечание сохраняет его подлинную лексическую неоднозначность.
- issue: Значение «нести вину»
  choice: Сохранить формулировку «понесёт на себе свою вину»
  alternative: «Понесёт наказание за свой грех»
  rationale: Исходная идиома может охватывать и состояние виновности, и ответственность за её последствия; конкретизация как одного лишь наказания сняла бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством правового установления. Синтаксис сделан ясным для обычного читателя; тире отделяют уточнение о способе получения свидетельского знания. Архаизмы и конфессионально окрашенные формулы не используются.
