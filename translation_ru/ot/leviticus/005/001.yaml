review_pass:
  verdict: revise
  source_fidelity: Нужна правка синтаксической связи. Формула «согрешит тем, что услышит» делает само услышанное призыва основанием греха, тогда как еврейское установление связывает виновность с несообщением известного после такого призыва. Перестановка в русском тексте ясно относит «согрешит» к неисполнению обязанности сообщить, не меняя содержания. «Призыв дать свидетельство под клятвой» допустимо передаёт משפטный смысл קוֹל אָלָה; буквальная неоднозначность сохранена в сноске.
  naturalness: Исправленный условный период звучит естественно для современного литературного русского и яснее выделяет условие, нарушение и последствие. «Понесёт свою вину» сохраняет образ исходной идиомы без тяжеловесного «на себе».
  terminology: «Свидетель», «сообщит», «вина» последовательно передают правовой регистр. Основной текст не утверждает, что речь обязательно идёт о формальном суде; сноска поясняет торжественный характер призыва. Не следует вводить в основной текст слово «публичный», которого в еврейском тексте нет.
  issues:
  - severity: high
    issue: Оборот «согрешит тем, что услышит» неверно связывает грех с услышанным призывом.
    rationale: וְשָׁמְעָה описывает ситуацию, в которой свидетель слышит клятвенное заклятие/призыв; виновным действием является отказ сообщить (אִם לֹא יַגִּיד). Русское «тем, что» выражает причину или содержание проступка и тем самым искажает логическую связь.
  - severity: low
