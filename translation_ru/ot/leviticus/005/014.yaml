  text: 'И сказал Яхве[a] Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH), тетраграмматон; традиционно передаётся как «Господь».
    reason: Пояснение формы и традиционной передачи божественного имени.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным вау вводит новое речевое событие. В устойчивой русской формуле «сказал кому-либо» звучит естественнее, чем более тяжёлое «говорил к».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: Направленность речи естественно выражается в русском языке дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Принятая в русском языке форма библейского имени; в данном контексте употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив вводит содержание следующей прямой речи. В современном русском переводе эту функцию естественно и точно передаёт двоеточие, без избыточного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя YHWH. Форма «Яхве» прямо передаёт его и не подменяет титулом; при этом примечание указывает еврейское написание.
translation_notes:
  register: Современный литературный русский язык с краткой, достоинственной формулой божественной речи. Частица «и» сохраняет повествовательную связь с предыдущим контекстом; двоеточие указывает, что содержание речи следует в следующем стихе.
