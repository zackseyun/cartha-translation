  naturalness: Текст в целом литературен и сохраняет незавершённую условную конструкцию. «Посредством грабежа» здесь неестественно и создаёт ошибочную смысловую связь. «Совершит вероломство против Яхве» яснее передаёт направленность מעַל ביהוה и усилительную однокоренную конструкцию, чем «проявит неверность Яхве».
