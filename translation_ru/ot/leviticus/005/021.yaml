  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: ru
  text: Если кто-либо согрешит и совершит вероломство против Яхве, обманув своего ближнего в деле имущества, отданного ему на хранение, или залога[a], или по поводу грабежа, или притеснит своего ближнего,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, что было передано ему в руки». Точное значение еврейского выражения неясно; оно может обозначать залог, обеспечение или иное вверенное имущество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: кто-либо
  rationale: В данном правовом контексте слово обозначает отдельного человека, а не «душу» как внутреннюю часть личности. Условная конструкция «если кто-либо» естественна для современного русского юридического изложения.
- source_word: כִּי תֶחֱטָא
  choice: если ... согрешит
  rationale: כִּי с имперфектом вводит казуистическое условие; русский оборот с «если» ясно передаёт эту функцию.
- source_word: וּמָעֲלָה מַעַל
  choice: и проявит неверность
  rationale: Однокоренная конструкция выражает вероломное нарушение верности. Выбранная формулировка сохраняет нравственно-религиозный смысл и не сводит выражение к узкому техническому термину.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: 'Предлог указывает, что проступок направлен против Яхве: обман ближнего одновременно представлен как неверность Богу. Личное имя передано транслитерацией «Яхве».'
- source_word: וְכִחֵשׁ בַּעֲמִיתוֹ
  choice: обманув ближнего
  rationale: Глагол может означать ложь, отрицание факта или обман. Деепричастный оборот естественно связывает конкретный проступок с неверностью Яхве; עָמִית передано привычным словом «ближний».
- source_word: בְּפִקָּדוֹן
  choice: относительно имущества, отданного ему на хранение
  rationale: Существительное обозначает имущество, доверенное человеку для сохранения. Развёрнутый русский оборот яснее, чем неоднозначное «вклад» или канцелярское «депозит».
- source_word: בִתְשׂוּמֶת יָד
  choice: залога
  rationale: Буквально выражение связано с тем, что «помещено в руку»; вероятно, речь идёт о переданном обеспечении или ином вверенном имуществе. «Залог» кратко и естественно передаёт вероятный юридический смысл, а неоднозначность отмечена в сноске.
- source_word: בְגָזֵל
  choice: посредством грабежа
  rationale: Слово обозначает грабёж либо насильно отнятое имущество. Формулировка сохраняет предложную конструкцию и не уточняет без достаточных оснований, идёт ли речь о способе обмана или о предмете отрицания.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: притеснит своего ближнего
  rationale: Глагол охватывает притеснение, эксплуатацию, вымогательство и неправомерное удержание чужого. Общее «притеснит» сохраняет широту исходного слова.
theological_decisions:
- issue: Социально-экономический проступок как неверность Богу
  choice: проявит неверность Яхве, обманув ближнего
  alternative: поступит вероломно против Яхве и обманет ближнего
  rationale: Исходный текст прямо связывает обман человека с неверностью Яхве. Деепричастная связь ясно передаёт это отношение, не добавляя богословского объяснения.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано как «Яхве», что отличает его от титула «Господь» и соответствует указанному в материале доктринальному решению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет незавершённость условного предложения, поскольку стих продолжается далее. Юридические понятия переданы понятно для неспециалиста; архаизмы и конфессионально окрашенные термины по возможности исключены.
