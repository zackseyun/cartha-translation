source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: ru
  text: Если кто-либо согрешит и совершит что-либо из всего того, что запрещено заповедями Яхве, хотя он и не знал этого, он виновен и понесёт своё беззаконие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понесёт свою вину». Еврейское выражение может обозначать несение вины, ответственности или последствий проступка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: кто-либо
  rationale: В данном правовом контексте נֶפֶשׁ обозначает отдельного человека; «кто-либо» естественно передаёт обобщённый характер предписания.
- source_word: תֶחֱטָא
  choice: согрешит
  rationale: Глагол חטא в священническом законодательном контексте прямо обозначает совершение греха.
- source_word: וְעָשְׂתָה אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: сделает что-нибудь из того, что по заповедям Яхве нельзя делать
  rationale: Формулировка сохраняет распределительный смысл «одно из всего запрещённого», но звучит естественно и ясно по-русски.
- source_word: וְלֹא יָדַע
  choice: даже не зная об этом
  rationale: Деепричастная конструкция естественно выражает незнание совершённого нарушения, не устраняя его юридического значения.
- source_word: וְאָשֵׁם
  choice: он виновен
  rationale: Форма אָשֵׁם обозначает возникшую виновность или ответственность за проступок, несмотря на незнание.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: понесёт на себе своё беззаконие
  rationale: Сохранён весомый древнееврейский образ несения собственного беззакония, который может включать виновность и её последствия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и согласуется с предоставленным доктринальным решением.
- issue: Ответственность за неосознанный проступок
  choice: даже не зная об этом, он виновен
  alternative: если он не знал, то, осознав вину
  rationale: Еврейская последовательность связывает незнание с последующим וְאָשֵׁם, не освобождая человека от виновности; перевод не добавляет отсутствующего условия последующего осознания.
- issue: Значение идиомы נשׂא עון
  choice: понесёт на себе своё беззаконие
  alternative: понесёт свою вину / наказание за свой проступок
  rationale: Более буквальная формулировка сохраняет богословскую и юридическую многозначность между виной, ответственностью и последствиями, не сводя идиому только к наказанию.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис упрощён относительно еврейского оригинала ради ясности, но сохранены правовой оттенок виновности, значение незнания и образ «нести беззаконие».
