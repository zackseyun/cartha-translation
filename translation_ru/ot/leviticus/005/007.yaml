  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: ru
  text: 'Если же у него не хватает средств на овцу, пусть он принесёт Господу в жертву повинности за совершённый им грех двух горлиц или двух молодых голубей: одну птицу — в жертву за грех[a], а другую — во всесожжение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское חַטָּאת может обозначать как грех, так и жертву, связанную с устранением греха или ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: у него не хватает средств на овцу
  rationale: Еврейская идиома буквально говорит, что его рука не достигает достаточного для овцы; русский оборот естественно и точно передаёт недостаток материальных средств.
- source_word: אֲשָׁמוֹ
  choice: в жертву повинности
  rationale: В данном жертвенном контексте אָשָׁם обозначает приношение, связанное с виной; «жертва повинности» — устоявшийся и достаточно прозрачный русский термин.
- source_word: אֲשֶׁר חָטָא
  choice: за совершённый им грех
  rationale: Передаёт связь жертвы с проступком и естественно выражает эллиптическую еврейскую конструкцию.
- source_word: שְׁתֵּי תֹרִים
  choice: двух горлиц
  rationale: Обычное русское наименование птиц, обозначенных תֹרִים, в библейском жертвенном контексте.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: двух молодых голубей
  rationale: Еврейская идиома «сыновья голубя» означает молодых голубей; перевод сохраняет указание на возраст и звучит естественно.
- source_word: לַיהוָה
  choice: Господу
  rationale: Традиционная русская передача тетраграмматона, соответствующая литературному и богослужебно узнаваемому регистру.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном законодательстве חַטָּאת обозначает приношение, связанное с грехом и очищением; основной текст использует понятный традиционный термин, а альтернативный функциональный перевод дан в сноске.
- source_word: לְעֹלָה
  choice: во всесожжение
  rationale: Устоявшийся русский термин для עֹלָה — жертвы, целиком сжигаемой на жертвеннике.
theological_decisions:
- issue: Передача жертвенного термина חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может подчёркивать как связь жертвы с грехом, так и её очистительную функцию. Традиционное и понятное выражение помещено в основной текст, а значимая лексико-богословская альтернатива сохранена в сноске.
- issue: Соотношение אָשָׁם и двух птичьих жертв
  choice: общее приношение названо «жертвой повинности», после чего птицы распределены между жертвой за грех и всесожжением
  alternative: сгладить терминологию и назвать всё приношением за вину
  rationale: 'Перевод сохраняет напряжение исходного текста: אֲשָׁמוֹ характеризует приношение, тогда как далее одна птица прямо назначается לְחַטָּאת, а другая לְעֹלָה.'
translation_notes:
  register: Современный литературный русский язык с сохранением устоявшейся жертвенной терминологии. Синтаксис упрощён для ясности без устранения терминологического напряжения оригинала.
