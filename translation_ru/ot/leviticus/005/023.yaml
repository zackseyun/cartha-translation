  text: וְ/הָיָה֮ כִּֽי יֶחֱטָ֣א וְ/אָשֵׁם֒ וְ/הֵשִׁ֨יב אֶת הַ/גְּזֵלָ֜ה אֲשֶׁ֣ר גָּזָ֗ל א֤וֹ אֶת הָ/עֹ֨שֶׁק֙ אֲשֶׁ֣ר עָשָׁ֔ק א֚וֹ אֶת הַ/פִּקָּד֔וֹן אֲשֶׁ֥ר הָפְקַ֖ד אִתּ֑/וֹ א֥וֹ אֶת הָ/אֲבֵדָ֖ה אֲשֶׁ֥ר מָצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: ru
  text: И когда он согрешит и будет виновен[a], он должен возвратить то, что он похитил, или то, что отнял притеснением[b], или отданное ему на хранение, или найденную им потерянную вещь[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если он согрешит и навлечёт на себя вину». Еврейскую правовую формулу можно понимать и условно; глагол также выражает состояние виновности или ответственности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «то, чем завладел через притеснение»; возможен также смысл неправомерного удержания или присвоения чужого имущества обманом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «найденное им потерянное имущество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Еврейская формула вводит правовой случай. «Когда» естественно передаёт ожидаемую ситуацию, при этом возможное условное понимание отмечено в сноске.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: он согрешит и окажется виновным
  rationale: Сохраняются как нравственно-религиозное значение חטא, так и юридическая виновность или ответственность, выраженная אָשֵׁם; субъективное осознание в текст не добавляется.
- source_word: וְהֵשִׁיב
  choice: пусть возвратит
  rationale: В данном законодательном контексте форма выражает обязательное возмещение или возвращение; «пусть возвратит» звучит по-русски естественно и сохраняет предписывающую силу.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: похищенное, которое похитил
  rationale: Сохранён характерный для еврейского текста повтор однокоренных слов, подчёркивающий неправомерное завладение имуществом.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: то, что присвоил притеснением
  rationale: Термин עשׁק охватывает завладение или удержание чужого посредством притеснения, злоупотребления либо обмана. Формулировка сохраняет имущественный смысл и способ действия.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: отданное ему на хранение
  rationale: Речь идёт об имуществе, вверенном человеку для хранения; русская формулировка ясна без излишне специального слова «депозит».
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: найденную им потерянную вещь
  rationale: Передаётся конкретная потерянная собственность, найденная виновным, без добавления невыраженных деталей.
theological_decisions:
- issue: Значение וְאָשֵׁם
  choice: окажется виновным
  alternative: осознает свою вину
  rationale: Форма прежде всего указывает на состояние виновности и ответственности. Перевод через осознание мог бы неоправданно сделать субъективное понимание главным смыслом.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис сохраняет незавершённость стиха и продолжение правового предписания в следующем стихе; запятая в конце соответствует исходному фрагменту. Однокоренной повтор в первой позиции перечня намеренно сохранён как черта оригинала.
