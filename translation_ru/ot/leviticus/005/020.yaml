  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/020.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יְהוָה — личное имя Бога; традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма וַיְדַבֵּר открывает новый речевой эпизод и связывает его с предшествующим повествованием. Русское «сказал» естественно вводит прямую речь; союз «и» передаёт וַ־.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом. Форма «Яхве» общепринята в современной русской библеистике.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного сочетанием אֶל с личным именем.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В этой устойчивой формуле инфинитив вводит последующую прямую речь. В современном русском ту же функцию естественно выполняет двоеточие; буквальное «говоря» было бы тяжеловесным.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя, поэтому оно сохранено в основном тексте. Традиционная замена «Господь» отмечена в сноске, не смешивая имя с титулом.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулой введения прямой речи. Двоеточие передаёт функцию לֵאמֹר без неестественного буквального оборота «говоря».
