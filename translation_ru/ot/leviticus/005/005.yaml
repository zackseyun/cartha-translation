base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: ru
  text: И когда он окажется виновным[a] в одном из этих случаев, то пусть признается в том, в чём согрешил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навлечёт на себя вину»; еврейский глагол обозначает объективную виновность и ответственность, а не только осознание проступка.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в том, в чём он согрешил»; это относится к одному из только что перечисленных случаев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Передаёт переходную формулу закона и ожидаемое наступление обстоятельства, не превращая его в чисто условное «если» и не воспроизводя неестественное для современного русского «и будет».
- source_word: יֶאְשַׁם
  choice: окажется виновным
  rationale: Глагол אשם указывает на объективную виновность и связанную с ней ответственность; перевод не добавляет отсутствующую в тексте мысль об осознании вины.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: в чём-либо из этого
  rationale: Фраза отсылает к одному из ранее перечисленных случаев. Русская формулировка сохраняет неопределённость референта и звучит естественно.
- source_word: וְהִתְוַדָּה
  choice: пусть признается
  rationale: Возвратная форма выражает признание совершённого греха; «пусть» ясно передаёт предписание закона без архаического оборота.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: в чём он согрешил
  rationale: Формулировка естественно передаёт содержание признания и соотнесённость греха с конкретным случаем, на который указывает местоименный суффикс.
theological_decisions:
- issue: Означает ли יֶאְשַׁם осознание вины или сам факт юридической виновности
  choice: окажется виновным
  alternative: осознает свою вину
  rationale: Еврейский глагол сам по себе подчёркивает виновность и ответственность; внутреннее осознание не следует вносить в основной текст без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. Сохранена последовательность условия и предписания, но тяжеловесная калька «и будет» устранена. Терминология не привязана к конфессионально специфическому пониманию исповеди.
