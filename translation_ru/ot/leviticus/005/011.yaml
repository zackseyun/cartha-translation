source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: ru
  text: Если же у него не хватит средств[a] на двух горлиц или двух молодых голубей, пусть он принесёт за совершённый им грех десятую часть эфы муки тонкого помола как жертву за грех. Пусть не добавляет к ней масла и не кладёт на неё ладана, потому что это жертва за грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если его рука не достигает» — еврейское выражение, означающее, что у человека недостаточно средств.'
    reason: Сохраняет исходный образ имущественной идиомы, который ради ясности передан в тексте по смыслу.
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: у него хватит средств
  rationale: Буквально выражение говорит о том, достигает ли его рука; в данном законе это еврейская идиома, обозначающая достаточность материальных средств. Русское выражение ясно передаёт экономический смысл и сохраняет условный характер постановления.
- source_word: תֹרִים
  choice: горлицы
  rationale: В жертвенном контексте слово обозначает именно горлиц, а не голубей вообще.
- source_word: בְנֵי יוֹנָה
  choice: молодые голуби
  rationale: Буквально «птенцы голубя»; устойчивое обозначение молодых голубей, пригодных для жертвоприношения.
- source_word: קָרְבָּנוֹ
  choice: принесёт
  rationale: Существительное обозначает то, что подносят как приношение. В русском предложении его смысл естественно выражен глаголом «принесёт», тогда как состав приношения далее назван прямо.
- source_word: אֲשֶׁר חָטָא
  choice: за совершённый им грех
  rationale: Краткая еврейская относительная конструкция связывает приношение с проступком человека; русский оборот передаёт эту связь ясно и без догматического расширения.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: десятую часть эфы
  rationale: Сохранена древняя мера сыпучих тел без приблизительной современной конвертации.
- source_word: סֹלֶת
  choice: пшеничная мука тонкого помола
  rationale: Термин обозначает высококачественную тонко смолотую муку, обычно пшеничную, употреблявшуюся для приношений. Формулировка понятна современному читателю и точнее общего слова «мука».
- source_word: לְחַטָּאת
  choice: как жертву за грех
  rationale: В жертвенном законодательстве חַטָּאת здесь обозначает не сам грех, а предназначенное в связи с ним приношение.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: пусть не добавляет к ней масла
  rationale: Передан прямой запрет добавлять масло к мучной жертве; формулировка естественна для современного русского языка.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: и не кладёт на неё ладана
  rationale: לְבֹנָה — ароматическая смола, традиционно и точно называемая по-русски ладаном. Сохранён образ помещения вещества на приношение.
- source_word: כִּי חַטָּאת הִיא
  choice: потому что это жертва за грех
  rationale: Заключительная фраза объясняет отсутствие масла и ладана принадлежностью данного приношения к категории жертвы за грех.
theological_decisions:
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: грех
  rationale: Хотя слово может обозначать как грех, так и связанную с ним жертву, синтаксис и обрядовые предписания здесь относятся к приносимому веществу. Перевод сохраняет культовый смысл, не привнося позднейших богословских категорий.
- issue: Передача имущественного условия תַשִּׂיג יָדוֹ
  choice: у него не хватит средств
  alternative: рука его не достигнет
  rationale: Постановление предусматривает уступку человеку с ограниченными средствами. Смысловая передача делает юридическое условие понятным, а буквальный образ сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Формы «пусть принесёт», «пусть не добавляет» передают предписывающую силу еврейского имперфекта без архаического «да принесёт». Термин «эфа» сохранён как древняя мера; «жертва за грех» последовательно передаёт культовое значение חַטָּאת.
