  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: ru
  text: Пусть он принесёт её священнику, и священник возьмёт из неё полную пригоршню как её памятную часть и сожжёт на жертвеннике поверх огненных приношений Яхве. Это жертва за грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это очистительная жертва». Еврейское слово может обозначать жертву, которая устраняет последствия греха посредством очищения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Пусть он принесёт её
  rationale: Форма глагола בוא в хифиле означает принесение жертвенного вещества; местоимение женского рода соотносится с мукой или жертвой из предыдущего контекста.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: возьмёт ... полную горсть
  rationale: Передаёт техническое обрядовое действие и сохраняет выраженное в еврейском тексте значение меры — столько, сколько вмещает горсть.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: как её памятную часть
  rationale: אַזְכָּרָה — специальное обозначение части хлебного приношения, сжигаемой на жертвеннике; «памятная часть» сохраняет культовый смысл термина.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: и сожжёт на жертвеннике
  rationale: В жертвенном контексте קטר в хифиле означает сжечь жертву на жертвеннике, вознеся её в дыме.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: поверх огненных приношений Яхве
  rationale: עַל естественно передаётся как «поверх/на», а אִשֶּׁה — как приношение, сжигаемое в огне. Такое решение ближе к форме исходного текста и не вводит спорное толкование «в дополнение к».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: חַטָּאת הִוא
  choice: Это жертва за грех
  rationale: В данном обрядовом предписании חַטָּאת обозначает вид жертвы, связанной с устранением греха; традиционное русское выражение ясно и узнаваемо.
theological_decisions:
- issue: Значение חַטָּאת в священническом жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Контекст классифицирует приношение как жертву, связанную с грехом, однако термин также допускает акцент на очистительной функции обряда. Основной текст сохраняет привычное обозначение, а существенная альтернатива отмечена в сноске.
- issue: Связь памятной части с אִשֵּׁי יְהוָה
  choice: поверх огненных приношений Яхве
  alternative: в дополнение к огненным приношениям Яхве
  rationale: Предлог עַל буквально указывает на положение «на/поверх» и может в ритуальном контексте выражать присоединение к другим приношениям. Более формальное значение оставлено в тексте без устранения возможной смысловой широты.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного культового текста. Синтаксис сделан ясным для обычного читателя, при этом сохранены ключевые жертвенные термины и личное имя Яхве.
