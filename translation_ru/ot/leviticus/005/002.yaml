  verdict: revise
  source_fidelity: В целом перечисление категорий нечистых животных и различение диких, домашних и шэрец переданы точно. Однако «останется от него скрытым» в русском условном периоде неестественно и создаёт ненужный оттенок будущего продолженного состояния; וְנֶעְלַם מִמֶּנּוּ означает, что обстоятельство ускользнуло от его осознания. וְאָשֵׁם лучше передать прямым «виновен», сохраняя юридически-ритуальную неоднозначность еврейского слова.
  naturalness: «Труп» в данном контексте понятен, хотя относится именно к мёртвому телу животного; перечисление звучит нормально. Замена «и это останется от него скрытым» на «и он не заметит этого» делает фразу современной и естественной. Буквальный образ исходного текста сохранён в сноске.
  terminology: «Нечистый» — верный устоявшийся термин для טמא и не смешивает ритуальную нечистоту с нравственным злом. «Ползающее существо» допустимо для שׁרץ как доступная передача широкой категории; не следует сужать её до одних пресмыкающихся. «Виновен» точнее и компактнее, чем «несёт вину».
