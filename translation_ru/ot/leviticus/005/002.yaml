id: LEV.5.2
reference: Leviticus 5:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: ru
  text: Или если кто-нибудь прикоснётся к чему-либо нечистому — к трупу нечистого дикого животного, к трупу нечистого домашнего животного или к трупу нечистого ползающего существа — и он не заметит этого[a], то он нечист и виновен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это скрыто от него», то есть он не осознаёт этого.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду вина или ответственность, возникшая в связи с нечистотой; само прикосновение к трупу не обязательно является нравственным злом в том же смысле, что и намеренный грех.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: кто-нибудь
  rationale: В данном правовом контексте слово обозначает отдельного человека, а не нематериальную «душу»; неопределённое местоимение естественно передаёт общий случай.
- source_word: תִּגַּע בְּ
  choice: прикоснётся к
  rationale: Глагол נגע с предлогом ב обозначает физическое соприкосновение; этот перевод точен и естествен по-русски.
- source_word: כָל דָּבָר טָמֵא
  choice: к чему-либо нечистому
  rationale: דָּבָר имеет широкое значение и здесь вводит общую категорию, которую далее поясняют примеры.
- source_word: נִבְלַת
  choice: к трупу
  rationale: В законах о чистоте נְבֵלָה означает мёртвое тело животного. «Труп» точно и понятно передаёт это значение, тогда как «падаль» могло бы неоправданно подчеркнуть разложение или пищевое употребление.
- source_word: חַיָּה טְמֵאָה
  choice: нечистого дикого животного
  rationale: חַיָּה здесь противопоставлено בְּהֵמָה и обозначает дикое наземное животное.
- source_word: בְּהֵמָה טְמֵאָה
  choice: нечистого домашнего животного
  rationale: בְּהֵמָה в данном противопоставлении указывает на одомашненное четвероногое; формулировка шире и точнее, чем «скотина».
- source_word: שֶׁרֶץ טָמֵא
  choice: нечистого ползающего существа
  rationale: שֶׁרֶץ обозначает категорию мелких существ, передвигающихся множеством или кишащих; «ползающее существо» понятно современному читателю и соответствует традиционной категории законов о чистоте.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: и это останется от него скрытым
  rationale: 'Сохранён образ еврейского текста: случившееся скрыто от человека, то есть он этого не осознаёт. Сноска поясняет подразумеваемый смысл.'
- source_word: וְהוּא טָמֵא
  choice: то он нечист
  rationale: Фраза обозначает наступившее состояние ритуальной нечистоты. «То» естественно связывает условную конструкцию по-русски, не уточняя сверх текста точную логику связи.
- source_word: וְאָשֵׁם
  choice: и несёт вину
  rationale: אָשֵׁם выражает состояние виновности или ответственности. Настоящее время ближе к форме еврейского текста, чем явно результативное «становится виновен».
theological_decisions:
- issue: Характер нечистоты
  choice: Передавать טָמֵא/טְמֵאָה как «нечистый», а не как «осквернённый» или «греховный».
  alternative: «ритуально нечистый»; «осквернённый»
  rationale: Речь идёт о статусе в системе обрядовой чистоты вследствие прикосновения к трупу животного, а не о том, что само прикосновение непременно является нравственным злом. Слово «нечистый» сохраняет библейскую категорию без добавления отсутствующего в основном тексте пояснения «ритуально».
- issue: Значение וְאָשֵׁם
  choice: «несёт вину» с пояснительной сноской о правовой ответственности в связи с нечистотой.
  alternative: «становится виновен»; «оказывается виновен»; «подлежит ответственности»
  rationale: Еврейское слово допускает оттенки виновности и понесённой ответственности. Перевод сохраняет напряжение текста, а сноска предохраняет от ошибочного отождествления обрядовой нечистоты с намеренным нравственным злом.
- issue: Родовое обозначение человека
  choice: Использовать «кто-нибудь», а далее мужское местоимение «он».
  alternative: «человек»; повторение безличной конструкции
  rationale: נֶפֶשׁ обозначает любого человека; «кто-нибудь» естественно вводит общий правовой случай, а «он» соответствует мужскому единственному числу последующих еврейских форм.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Синтаксис сделан плавным, но последовательность трёх видов животных и координация заключительных состояний сохранены. Термины «нечистый» и «труп» понятны широкому читателю и соответствуют контексту левитских законов.
