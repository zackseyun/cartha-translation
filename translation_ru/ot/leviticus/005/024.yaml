  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: ru
  text: или что-либо, относительно чего он дал ложную клятву, — он должен полностью возместить это и прибавить к этому пятую часть. В день принесения им повинной жертвы он должен отдать это тому, кому оно принадлежит[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в день его вины». Еврейское слово может обозначать как вину, так и повинную жертву; в данном контексте основной текст следует жертвенному значению.'
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּל אֲשֶׁר
  choice: или что-либо другое, о чём
  rationale: Оборот продолжает перечень из предыдущего стиха и охватывает любой иной предмет ложной клятвы. Слово «другое» естественно передаёт связь с предшествующим перечислением.
- source_word: יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒
  choice: он поклялся ложно
  rationale: Краткая и естественная передача клятвы, данной во лжи относительно упомянутого имущества или дела.
- source_word: וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ
  choice: пусть возместит это сполна
  rationale: Буквальное «с его главной суммой» является юридической идиомой, обозначающей возвращение всей основной стоимости без надбавки.
- source_word: וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו
  choice: и прибавит к этому пятую часть
  rationale: Передаёт установленную законом надбавку в размере одной пятой от основной суммы.
- source_word: לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ
  choice: тому, кому оно принадлежит
  rationale: Естественная русская передача еврейского оборота, указывающего на законного владельца.
- source_word: בְּ/י֥וֹם אַשְׁמָתֽ/וֹ
  choice: в день, когда окажется виновен
  rationale: Сохраняет основной смысл אַשְׁמָה как вины и передаёт временную формулу естественным современным русским языком, не устраняя возможный жертвенный оттенок термина.
theological_decisions:
- issue: Значение אַשְׁמָתוֹ в юридико-жертвенном контексте
  choice: когда окажется виновен
  alternative: в день принесения им повинной жертвы
  rationale: Слово может обозначать как вину, так и связанную с ней повинную жертву. Основной текст сохраняет непосредственный смысл вины, а примечание отмечает культовое прочтение, поддерживаемое ближайшим контекстом.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим оттенком. Повеления переданы формой «пусть», естественной для законодательного контекста; подлинная неоднозначность заключительной формулы сохранена в примечании.
