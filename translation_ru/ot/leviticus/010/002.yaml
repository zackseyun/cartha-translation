base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: ru
  text: И огонь вышел из присутствия Яхве[a], поглотил их, и они умерли перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из пред лица Яхве»; также возможно: «от Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: вышел
  rationale: Форма от יצא последовательно развивает повествование и обозначает направленное движение огня от Божьего присутствия.
- source_word: אֵשׁ
  choice: огонь
  rationale: Существительное прямо обозначает огонь, ставший орудием немедленного суда.
- source_word: מִלִּפְנֵי יְהוָה
  choice: от Яхве
  rationale: Выражение буквально связано с лицом или присутствием Яхве. Основной вариант естественен по-русски и ясно передаёт источник огня; более буквальная пространственная образность сохранена в сноске.
- source_word: וַתֹּאכַל
  choice: поглотил
  rationale: Хотя אכל буквально значит «есть», применительно к огню глагол «поглотил» естественно передаёт уничтожающее действие.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к Надаву и Авиуду из непосредственного контекста.
- source_word: וַיָּמֻתוּ
  choice: они умерли
  rationale: Сохранена активная непереходная форма еврейского глагола; причина смерти уже названа в предшествующей части стиха.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Торжественное и понятное выражение сохраняет пространственно-богословский смысл пребывания перед Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, непосредственно стоящее в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» сохраняет заветное имя, употреблённое в исходном тексте, не заменяя его титулом.
- issue: Причинность в וַיָּמֻתוּ
  choice: они умерли
  alternative: они были убиты
  rationale: Еврейский текст использует активный непереходный глагол «умерли», а причинная связь с огнём уже выражена контекстом; пассивная формулировка добавила бы отсутствующую грамматическую деталь.
translation_notes:
  register: Современный литературный русский язык с торжественной повествовательной интонацией. Союзное построение и повтор имени Яхве сохраняют ритм и напряжённость еврейского текста; форма «пред Яхве» уместна в сакральном контексте и остаётся понятной современному читателю.
