  rationale: Перевод уточнён, чтобы в первой части сохранить выраженный в еврейском тексте пространственный смысл מִלִּפְנֵי יְהוָה, параллельный заключительному «перед Яхве». Имя Яхве и простой результативный глагол «умерли» сохранены. Сноска фиксирует буквальную образность и более краткий вариант без утверждения спорного толкования.
