source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: ru
  text: 'И сказал Аарон Моисею: «Вот, сегодня они принесли пред Яхве свою жертву за грех[a] и своё всесожжение, а со мной случилось такое[b]. Если бы я сегодня съел жертву за грех, разве это было бы хорошо в глазах Яхве?[c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву очищения» (также далее в этом стихе). Еврейское слово חַטָּאת может обозначать как грех, так и жертву, связанную с очищением от греха или нечистоты; в книге Левит традиционно переводится как «жертва за грех».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а меня постигло подобное». Аарон имеет в виду бедствия этого дня, прежде всего смерть своих сыновей.'
    reason: cultural_note
  - marker: c
    text: 'Или: «разве это было бы угодно Яхве?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт частицу, привлекающую внимание к объяснению Аарона, естественно и без архаизации.
- source_word: הִקְרִיבוּ
  choice: принесли
  rationale: В породе хифиль глагол имеет жертвенное значение «принести, представить в качестве жертвы»; «принесли» естественно для русского библейского контекста.
- source_word: חַטָּאתָם / חַטָּאת
  choice: свою жертву за грех / жертву за грех
  rationale: В данном жертвенном контексте חַטָּאת обозначает жертвоприношение, а не отвлечённый грех; сохранён привычный и понятный термин.
- source_word: עֹלָתָם
  choice: своё всесожжение
  rationale: Стандартный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Кратко и близко передаёт культовое выражение «перед лицом / в присутствии Яхве».
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: а со мной случилось такое
  rationale: Естественно передаёт идиому о постигших Аарона бедствиях, не уточняя сверх текста их ритуальное значение.
- source_word: וְאָכַלְתִּי
  choice: Если бы я сегодня ел
  rationale: В контексте форма вводит подразумеваемое условие перед риторическим вопросом; русский условный оборот ясно передаёт этот смысл, не утверждая, что Аарон ел жертву.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: разве это было бы угодно в глазах Яхве?
  rationale: Сохраняет образный еврейский оборот «быть хорошим в глазах» и одновременно естественно выражает вопрос о Божьем одобрении.
theological_decisions:
- issue: Основание, по которому Аарон не ел жертву за грех
  choice: Сохранить связь отказа с постигшим Аарона несчастьем, не уточняя, состояла ли проблема в трауре, обрядовом состоянии или общей уместности.
  alternative: Прямо истолковать слова как указание на обрядовую нечистоту либо только на личную скорбь.
  rationale: Еврейский текст связывает риторический вопрос с событиями этого дня, но не называет точную причину, по которой вкушение могло не получить одобрения Яхве.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет ход речи Аарона и риторический вопрос; избегнуты как архаическое «се», так и излишне разговорные обороты. Божественное имя передано как «Яхве» в соответствии с предоставленным консультационным слоем.
