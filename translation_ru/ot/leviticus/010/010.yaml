id: LEV.10.10
reference: Leviticus 10:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: ru
  text: чтобы отличать священное от обычного[a] и нечистое от чистого[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священное от несвященного». Здесь противопоставляется то, что отделено как священное, тому, что священным не является; слово «обычное» не подразумевает кощунства или нечестия.'
    reason: lexical_alternative
  - marker: b
    text: То есть ритуально нечистое от ритуально чистого.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: чтобы отличать
  rationale: Инфинитив с ל выражает цель в продолжение предыдущего стиха. «Отличать» естественно передаёт обязанность распознавать категории, не сводя смысл к их физическому разделению.
- source_word: בֵּין
  choice: от … от
  rationale: Повторённая еврейская конструкция «между … и между …» обозначает противопоставление парных категорий; по-русски в сочетании с «отличать» это естественно выражается конструкцией «отличать … от …».
- source_word: הַקֹּדֶשׁ
  choice: священное
  rationale: Существительное обозначает категорию того, что отделено как святое. «Священное» ясно и естественно передаёт здесь категориальный смысл.
- source_word: הַחֹל
  choice: обычное
  rationale: В священнической терминологии это слово означает то, что не является священным, а не обязательно нечестивое или осквернённое. «Обычное» сохраняет противопоставление без лишнего оттенка кощунства.
- source_word: הַטָּמֵא
  choice: нечистое
  rationale: В законодательстве Левита слово прежде всего обозначает состояние ритуальной нечистоты; традиционное «нечистое» сохраняет эту особую категорию.
- source_word: הַטָּהוֹר
  choice: чистое
  rationale: В паре с «нечистым» это наиболее естественное русское обозначение состояния ритуальной чистоты.
theological_decisions:
- issue: Противопоставление קֹדֶשׁ и חֹל в священническом контексте
  choice: священное и обычное
  alternative: священное и несвященное; святое и мирское
  rationale: Речь идёт о культовых категориях. «Обычное» обозначает то, что не отделено как священное, не приписывая ему нравственной порочности; примечание сохраняет более буквальную альтернативу.
- issue: Характер категорий טָמֵא и טָהוֹר
  choice: нечистое и чистое как категории ритуального состояния
  alternative: нечистое и чистое как нравственные характеристики; осквернённое и чистое
  rationale: Контекст книги Левит прежде всего связан с ритуальным статусом. Примечание предупреждает, что нечистота здесь не тождественна нравственной вине.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified формулировкой. Синтаксис согласован с целевым инфинитивом предыдущего контекста; сохранены строчная буква в начале и запятая в конце как признаки фрагмента продолжающегося предложения.
