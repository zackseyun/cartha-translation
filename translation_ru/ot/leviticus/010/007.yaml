base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: ru
  text: Не выходите от входа в шатёр встречи, иначе умрёте, потому что на вас — масло помазания Яхве». И они поступили по слову Моисея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: за вход
  rationale: Предлог מִן при глаголе движения обозначает исходную точку или предел, за который нельзя выходить. По-русски «не выходите за вход» естественно передаёт запрет покидать священное пространство через вход.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Устойчивое культовое обозначение святилища; «шатёр встречи» точно и понятно передаёт оба элемента еврейского выражения.
- source_word: לֹא תֵצְאוּ
  choice: не выходите
  rationale: Отрицание с имперфектом здесь выражает прямой запрет; русский повелительный оборот передаёт его ясно и без архаизации.
- source_word: פֶּן תָּמֻתוּ
  choice: чтобы вам не умереть
  rationale: פֶּן вводит предостережение о возможном смертельном последствии. Эта формулировка сохраняет целевой оттенок предупреждения и звучит естественно в современном русском.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: масло помазания Яхве
  rationale: Сочетание обозначает священное масло помазания, принадлежащее Яхве или установленное им; буквальная конструкция сохраняет эту связь, не уточняя её однозначно.
- source_word: עֲלֵיכֶם
  choice: на вас
  rationale: Предлог עַל буквально указывает, что масло находится на посвящённых священниках; краткая русская формулировка сохраняет образ.
- source_word: וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה
  choice: И они поступили по слову Моисея
  rationale: Глагол продолжает повествование, а כִּדְבַר выражает соответствие сказанному Моисеем. «Поступили по слову» сохраняет близость к форме оригинала и ясно обозначает послушание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, а не титул. «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
- issue: Смысл выражения «масло помазания Яхве»
  choice: Сохранена конструкция без уточнения типа связи
  alternative: масло, которым Яхве помазал вас; принадлежащее Яхве масло помазания
  rationale: Еврейская конструкция допускает связь масла с Яхве как с его установлением, принадлежностью или освящающим назначением. Перевод не сужает эту смысловую ёмкость.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаической интонацией. Сохранены лаконичность запрета, предупреждение о смерти и культовая терминология.
