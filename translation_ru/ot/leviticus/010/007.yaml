  verdict: revise
  source_fidelity: 'Смысл запрета, мотивировка маслом помазания Яхве и заключительное сообщение о послушании переданы верно. Однако «не выходите за вход» в русском языке двусмысленно и неудачно: оно может означать движение наружу за пределы входа, тогда как еврейский текст запрещает удаляться от входа в шатёр. Предупредительное פֶּן естественнее передать как последствие: «иначе умрёте».'
  naturalness: «Не выходите от входа в шатёр встречи» ясно передаёт требование не покидать вход и сохраняет современный литературный регистр. «Иначе умрёте» звучит естественно и сжато, сохраняя серьёзность предупреждения.
  terminology: «Шатёр встречи», «масло помазания» и «Яхве» уместны и последовательно передают культовую терминологию и тетраграмматон. «Поступили по слову Моисея» допустимо и близко к כִּדְבַר מֹשֶׁה.
  issues:
  - severity: medium
    issue: Оборот «Не выходите за вход в шатёр встречи»
    rationale: Русское «выходить за вход» не является естественным способом сказать «не покидайте вход/не удаляйтесь от входа» и может неверно направить пространственный смысл. Употребление «от входа» точнее отражает מִפֶּתַח при глаголе выхода.
  - severity: low
    issue: Оборот «чтобы вам не умереть»
    rationale: Он грамматически возможен, но может звучать как выражение цели. פֶּן вводит предостережение о последствии; «иначе умрёте» передаёт его яснее.
  revised_text: Не выходите от входа в шатёр встречи, иначе умрёте, потому что на вас — масло помазания Яхве». И они поступили по слову Моисея.
