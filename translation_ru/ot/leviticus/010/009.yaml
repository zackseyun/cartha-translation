  source_fidelity: 'Смысл передан в целом точно: запрет относится к вину и шехару именно при входе в шатёр встречи; адресованы Аарон и его сыновья; предупреждение о смерти и постоянный характер установления сохранены. Однако «для вас» в заключительной формуле не имеет ясной самостоятельной опоры помимо суффикса во фразе «ваши поколения» и утяжеляет русский текст.'
