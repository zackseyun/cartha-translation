source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: ru
  text: «Вина и хмельного напитка не пейте — ни ты, ни твои сыновья с тобой, — когда входите в шатёр встречи, чтобы вы не умерли. Это вечное установление из поколения в поколение».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַיִן
  choice: вино
  rationale: Обычное древнееврейское обозначение вина из винограда; контекст не требует расширять или сужать значение.
- source_word: שֵׁכָר
  choice: хмельной напиток
  rationale: Слово обозначает опьяняющий напиток, отличный от вина. «Хмельной напиток» естественно и достаточно широко передаёт смысл, не ограничивая его пивом или крепким алкоголем.
- source_word: אַל תֵּשְׁתְּ
  choice: не пейте
  rationale: אַל с глагольной формой выражает запрет. Русское повелительное «не пейте» прямо и естественно передаёт его силу.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: ни ты, ни твои сыновья с тобой
  rationale: Сохраняет обоих названных адресатов и явное אִתָּךְ («с тобой»); конструкция с «ни… ни…» естественно включается в отрицательный запрет.
- source_word: בְּבֹאֲכֶם
  choice: когда входите
  rationale: Инфинитив с בְּ обозначает время или обстоятельство входа. Множественное число соответствует Аарону и его сыновьям.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Буквально и понятно передаёт традиционное название священного шатра, где Бог встречается со Своим народом; строчная буква уместна в связном тексте.
- source_word: וְלֹא תָמֻתוּ
  choice: чтобы вам не умереть
  rationale: Передаёт предупредительно-предотвращающий смысл следующей за запретом клаузы, не превращая её в независимое обещание.
- source_word: חֻקַּת עוֹלָם
  choice: вечное установление
  rationale: Устойчивая юридико-заветная формула об установлении длительной силы; «вечное» сохраняет силу עוֹלָם, а «установление» естественно для חֻקָּה.
- source_word: לְדֹרֹתֵיכֶם
  choice: для вас из поколения в поколение
  rationale: Передаёт продолжающееся действие нормы во всех последующих поколениях и естественно звучит по-русски.
theological_decisions:
- issue: Смысл предупреждения о смерти
  choice: «чтобы вам не умереть»
  alternative: «иначе умрёте»; «и не умрёте»
  rationale: Еврейская последовательность после запрета допускает оттенок предотвращаемого смертельного последствия. Выбранная формулировка сохраняет связь запрета с угрозой смерти, не делая её ни безусловным предсказанием, ни самостоятельным обещанием.
- issue: Объём запрета
  choice: Запрет относится к употреблению вина и хмельного напитка при входе в шатёр встречи.
  alternative: Полное воздержание священников от алкоголя при любых обстоятельствах.
  rationale: Временная конструкция בְּבֹאֲכֶם прямо ограничивает запрет обстоятельством входа в шатёр встречи; перевод не расширяет его до всеобщего и постоянного запрета на любое употребление.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и священного наставления. Инверсия «Вина и хмельного напитка не пейте» сохраняет вынесенные вперёд объекты еврейского текста и подчёркивает предмет запрета; тире помогают ясно оформить адресатов. Архаизмы и конфессионально окрашенные расширения исключены.
