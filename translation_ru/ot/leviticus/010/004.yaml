base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: ru
  text: 'Моисей позвал Мисаила и Елцафана, сыновей Уззиила, дяди Аарона, и сказал им: «Подойдите и вынесите ваших братьев[a] от места перед святилищем[b] за пределы стана».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «братья» может обозначать и близких родственников мужского пола; Надав и Авиуд приходились им двоюродными братьями.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица святыни»; возможно также: «от святого места».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В повествовательном контексте קרא означает позвать или призвать; «позвал» естественно передаёт обращение Моисея к названным людям.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: сыновей Уззиила
  rationale: Конструкция прямо называет Мисаила и Елцафана сыновьями Уззиила, а не его более отдалёнными потомками.
- source_word: דֹּד אַהֲרֹן
  choice: дяди Аарона
  rationale: דּוֹד в данном родословном контексте естественно означает «дядя»; приложение относится к Уззиилу.
- source_word: קִרְבוּ
  choice: Подойдите
  rationale: Повелительная форма קרב выражает пространственное приближение; «подойдите» звучит естественно и сохраняет этот смысл.
- source_word: שְׂאוּ
  choice: вынесите
  rationale: נשא означает поднять и нести; в контексте удаления тел русское «вынесите» ясно передаёт действие и его направленность.
- source_word: אֲחֵיכֶם
  choice: ваших братьев
  rationale: אָח буквально значит «брат», но может обозначать близкого родственника мужского пола. Основной текст сохраняет исходный термин, а примечание поясняет родство.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: от святилища
  rationale: Оборот выражает удаление от места перед святыней/святилищем. Краткое русское выражение естественно передаёт пространственный смысл, а примечание сохраняет более буквальную возможность.
- source_word: הַקֹּדֶשׁ
  choice: святилища
  rationale: В данном контексте הַקֹּדֶשׁ обозначает священное место или святилище, а не отвлечённую святость.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Фраза обозначает направленное движение наружу; «за пределы стана» ясно и литературно передаёт это значение.
