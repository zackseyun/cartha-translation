id: LEV.10.11
reference: Leviticus 10:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: ru
  text: и учить сынов Израиля всем постановлениям, которые Яхве изрёк им через Моисея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: и учить
  rationale: Союз и инфинитив породы хифиль продолжают перечисление обязанностей священников из предыдущего стиха; «учить» естественно и точно передаёт наставление.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено буквальное родовое выражение; в контексте оно обозначает весь народ завета.
- source_word: כָּל הַחֻקִּים
  choice: всем постановлениям
  rationale: חֻקִּים обозначает установленные предписания; «постановления» сохраняет юридический и заветный регистр. Дательный падеж естественно обусловлен русским управлением глагола «учить».
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: которые Яхве изрёк
  rationale: «Изрёк» передаёт завершённую божественную речь и поддерживает dignified, но понятный библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲלֵיהֶם
  choice: им
  rationale: Прямо передаёт адресатов речи Яхве.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Естественная русская передача еврейской идиомы посредничества «рукой Моисея»; смысл посредничества сохранён без неясной кальки.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; израильтяне
  rationale: Сохранён мужской род исходного родового выражения без отрицания его корпоративного значения для народа в целом.
- issue: Посредничество Моисея в בְּיַד מֹשֶׁה
  choice: через Моисея
  alternative: рукой Моисея
  rationale: Предлог с «рукой» выражает посредничество. Естественная русская формулировка не добавляет частного богословского истолкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис сохраняет зависимость от предыдущего стиха, начиная с «и». «Через Моисея» предпочтено буквальной кальке «рукой Моисея» ради ясности.
