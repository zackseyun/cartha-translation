  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: ru
  text: Вот, кровь её не была внесена внутрь святилища.[a] Вам непременно следовало съесть её на святом месте, как я повелел.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутрь святого места». Еврейское выражение называет священную область и особо указывает на движение внутрь.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «есть — должны есть». Такое сочетание форм усиливает требование; в данном контексте оно относится к тому, что следовало сделать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт призыв обратить особое внимание на сказанное и естественно звучит в возвышенной современной русской речи.
- source_word: הוּבָא
  choice: не была внесена
  rationale: Пассивная форма глагола בוא обозначает, что кровь не внесли внутрь; «была внесена» ясно передаёт движение в священное пространство.
- source_word: דָּמָהּ
  choice: кровь её
  rationale: Женский суффикс относится к жертве; местоимение женского рода сохраняет грамматическую связь с подразумеваемой жертвой.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: внутрь святилища
  rationale: «Святилище» передаёт культовое значение הַקֹּדֶשׁ, а «внутрь» сохраняет направительное значение פְּנִימָה без неестественного повтора.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: вам непременно следовало съесть
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол; контекст упрёка за уже совершённое действие требует русского оборота о неисполненной обязанности в прошлом.
- source_word: אֹתָהּ
  choice: её
  rationale: Прямое дополнение относится к жертве, поэтому женское местоимение естественно и сохраняет связь с контекстом.
- source_word: בַּקֹּדֶשׁ
  choice: на святом месте
  rationale: Обозначает предписанное освящённое место для вкушения жертвы; «на святом месте» естественно по-русски и не отождествляет его автоматически с внутренней частью святилища.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: как я повелел
  rationale: Прямо передаёт ссылку Моисея на ранее данное им повеление и соответствует достоинству контекста.
theological_decisions:
- issue: Различение культовых пространств
  choice: Первое выражение передано как «внутрь святилища», второе — как «на святом месте».
  alternative: Передать оба выражения одинаково как «в святом месте» либо уточнить первое как «за завесу».
  rationale: В первом выражении есть направительное פְּנִימָה, тогда как второе называет место, где священники должны были есть жертву. Различение сохраняет ритуальную логику текста, не добавляя отсутствующего в стихе уточнения «за завесу».
- issue: Временная и модальная сила אָכוֹל תֹּאכְלוּ
  choice: «вам непременно следовало съесть»
  alternative: «непременно ешьте» или «вы непременно должны есть»
  rationale: Форма сама по себе усиливает действие, а ближайший контекст показывает, что Моисей осуждает уже допущенное нарушение. Перевод сохраняет и усиление, и ретроспективный упрёк.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис сделан ясным для обычного читателя; культовые термины и усиление исходной конструкции сохранены.
