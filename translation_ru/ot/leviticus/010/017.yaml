source:
  edition: WLC
  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: ru
  text: Почему вы не съели жертву за грех[a] на святом месте? Ведь она — великая святыня, и Он дал её вам, чтобы вы несли вину общины и совершали за них искупление пред Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительную жертву». Еврейское слово חַטָּאת может обозначать жертву, связанную как с грехом, так и с устранением ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: Почему вы не съели
  rationale: Прямой вопрос о причине; перфект в контексте упрёка естественно передаётся русским прошедшим временем.
- source_word: הַחַטָּאת
  choice: жертву за грех
  rationale: В данном контексте слово обозначает жертвоприношение; традиционное русское выражение ясно передаёт его связь с грехом, а очистительный аспект отмечен в сноске.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: на святом месте
  rationale: Речь идёт об отведённом священном месте, где священники должны были есть жертву.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Еврейская усилительная конструкция указывает на высшую степень святости; устойчивое русское культовое выражение не смешивает жертву со Святым святых как частью святилища.
- source_word: וְאֹתָהּ נָתַן לָכֶם
  choice: и Он дал её вам
  rationale: Глагол имеет подразумеваемое подлежащее мужского рода; по контексту им является Бог. Заглавная буква помогает обозначить этот референт без добавления имени в текст.
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: чтобы вы несли вину общины
  rationale: Сочетание נשא עון допускает значения несения вины, беззакония или его последствий. «Нести вину» сохраняет культовую и представительскую напряжённость, не уточняя механизм.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: совершали за них искупление
  rationale: Устоявшаяся формулировка для כפר в жертвенном контексте; предлог «за» естественно передаёт направленность действия на общину.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» сохраняет культовый смысл действия в присутствии Бога, а «Яхве» передаёт личное имя יהוה.
theological_decisions:
- issue: Значение חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: То, что речь идёт о жертве, несомненно; основная формулировка сохраняет традиционную связь с грехом, тогда как возможный акцент на очищении указан в сноске.
- issue: Подразумеваемое подлежащее נָתַן
  choice: Он, то есть Бог
  alternative: 'безличная передача: «она дана вам»'
  rationale: Форма глагола имеет подразумеваемое подлежащее в 3-м лице мужского рода, и контекст указывает на Бога как давшего священникам эту жертву.
- issue: Смысл несения עֲוֺן общины
  choice: нести вину общины
  alternative: нести беззаконие общины; нести наказание общины
  rationale: Основной вариант сохраняет неоднозначность выражения между виной и её последствиями и не вводит конкретную теорию священнического посредничества.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Синтаксис прямой и понятный; сохранены традиционные библейские выражения «великая святыня», «нести вину» и «совершать искупление».
