- from: Пусть принесут бедро, отделённое как священный дар[c], и грудь приношения-представления[a] вместе с огненными приношениями из жирных частей, чтобы совершить обряд представления перед Яхве[b]. Они будут принадлежать тебе и твоим сыновьям вместе с тобой по вечному установлению, как повелел Яхве.
  to: Бедро приношения выделенной доли и грудь приношения представления[a] пусть принесут на огненных жертвах из жирных частей, чтобы представить их как приношение представления перед Яхве[b]. Это будет для тебя и для твоих сыновей, которые с тобой, вечным установлением, как повелел Яхве.
  rationale: Исправлены синтаксис первой именной группы и значение предлога עַל; восстановлена терминологическая связь между существительным תְּנוּפָה и глаголом לְהָנִיף. Сноска c сохранена как полезное пояснение к теруме, однако её якорь следует поставить после слов «приношения выделенной доли». Перевод не определяет спорную механику ритуального движения и сохраняет имя Яхве.
