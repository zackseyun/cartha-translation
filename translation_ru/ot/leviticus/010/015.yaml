base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: ru
  text: Бедро приношения выделенной доли и грудь приношения представления[a] пусть принесут на огненных жертвах из жирных частей, чтобы представить их как приношение представления перед Яхве[b]. Это будет для тебя и для твоих сыновей, которые с тобой, вечным установлением, как повелел Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское «приношение представления» (тенуфа) обозначает ритуальное представление дара перед Яхве; традиционный перевод: «приношение потрясания». Точный характер сопровождавшего его движения не вполне ясен.'
    reason: cultural_note
  - marker: b
    text: «Яхве» передаёт еврейское личное имя Бога יהוה (YHWH), которое в ряде переводов заменяется словом «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: бедро
  rationale: Обозначает часть задней ноги жертвенного животного; «бедро» точно передаёт анатомический смысл, тогда как традиционные варианты вроде «лопатка» здесь менее точны.
- source_word: תְּרוּמָה
  choice: священный дар
  rationale: Слово обозначает выделенную и посвящённую долю. Выражение понятно современному читателю и не навязывает спорного представления о конкретном движении вверх.
- source_word: חָזֶה
  choice: грудь
  rationale: Обычное обозначение грудной части жертвенного животного в данном культовом контексте.
- source_word: תְּנוּפָה
  choice: приношение-представление
  rationale: Термин указывает на ритуальное представление приношения перед Богом; составное обозначение сохраняет технический характер слова, не утверждая точную траекторию движения, которая из самого термина не вполне ясна.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: вместе с огненными приношениями из жирных частей
  rationale: עַל здесь естественно понимается как сопутствие, а אִשֵּׁי связано с приношениями, сжигаемыми на жертвеннике; «жирные части» обозначают конкретные жертвенные доли.
- source_word: לְהָנִיף תְּנוּפָה
  choice: чтобы совершить обряд представления
  rationale: Передаёт сочетание глагола и однокоренного существительного как формулу ритуального действия, избегая тяжеловесного буквального повтора.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняет пространственно-культовое выражение «перед» и передаёт личное имя יהוה как «Яхве».
- source_word: לְחָק עוֹלָם
  choice: по вечному установлению
  rationale: Передаёт предписанный и длительно обязательный характер постановления без архаического оборота.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Исходный текст содержит тетраграмматон; транслитерация сохраняет явное личное имя, не подменяя его титулом.
- issue: Характер обряда תנופה
  choice: приношение-представление; обряд представления
  alternative: приношение потрясания; потрясать
  rationale: Точный способ ритуального движения остаётся не вполне определённым. Выбранная формулировка передаёт представление дара перед Яхве и не конкретизирует движение сверх имеющихся данных.
- issue: Число в заключительной фразе וְהָיָה
  choice: Они будут принадлежать
  alternative: Оно будет принадлежать
  rationale: Единственное число еврейского сказуемого может охватывать совокупность названных священнических долей. В русском множественное число яснее соотносит обещание и с бедром, и с грудью, не ограничивая его только ближайшим существительным.
translation_notes:
  register: Современный литературный русский с достоинством законодательного культового текста. Специальные термины пояснены, но синтаксис остаётся доступным. Формула «вместе с тобой» сохранена ввиду её наличия в еврейском тексте, несмотря на некоторую непривычность по-русски.
