source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: ru
  text: Ешьте её в святом месте, ибо это твоя доля и доля твоих сыновей от приношений, сжигаемых для Яхве[a], ибо так мне повелено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от пищевых приношений Яхве». Еврейское אִשֶּׁה — культовый термин для приношения; он может пониматься в связи со сжиганием приношения или как приношение пищи Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Ешьте
  rationale: Форма обращена к нескольким мужчинам и в данном наставлении выражает предписание; русский повелительный оборот передаёт его естественно и прямо.
- source_word: אֹתָהּ
  choice: её
  rationale: Местоимение женского рода отсылает к доле хлебного приношения, упомянутой в предыдущем стихе.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: на святом месте
  rationale: Неопределённая еврейская конструкция не требует значения конкретного помещения святилища; «святое место» сохраняет культовый смысл без лишнего уточнения.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: доля, положенная тебе и твоим сыновьям
  rationale: В священническом контексте חֹק обозначает установленную, причитающуюся долю, а не отвлечённое постановление. Формулировка также сохраняет единственное число обращения к Аарону и прямое упоминание его сыновей.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: от огненных приношений Яхве
  rationale: Перевод сохраняет традиционно и этимологически обоснованную связь אִשֶּׁה с жертвенным огнём, не создавая впечатления, будто священники едят ту часть, которая сожжена. Альтернативное понимание термина отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: так мне повелено
  rationale: Краткая русская формула сохраняет пассивную конструкцию и не называет прямо того, от кого Моисей получил повеление, как и исходный текст.
theological_decisions:
- issue: Значение חֹק в священническом контексте
  choice: доля, положенная тебе и твоим сыновьям
  alternative: установление для тебя и твоих сыновей
  rationale: Речь идёт о причитающейся священникам части приношения; конкретное значение «доля» лучше соответствует контексту, не устраняя идею установленного права.
- issue: Значение אִשֵּׁי יְהוָה
  choice: огненные приношения Яхве
  alternative: пищевые приношения Яхве
  rationale: Термин допускает культовое осмысление как приношений, связанных с жертвенным огнём, и как пищи, приносимой Богу. Основной текст сохраняет более буквальную связь с огнём, а сноска фиксирует другую лексически возможную трактовку.
- issue: К кому относится «твоим сыновьям»
  choice: тебе и твоим сыновьям
  alternative: вам и вашим детям
  rationale: Еврейский текст обращается к Аарону в единственном числе и прямо называет его сыновей; обобщение устранило бы священническую и родовую конкретику.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным культовым регистром. Повелительная форма звучит естественно; синтаксис сохраняет переход от предписания к его основанию и затем к указанию на полученное Моисеем повеление.
