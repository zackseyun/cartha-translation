base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: ru
  text: 'И сказал Моисей Аарону: «Вот что сказал Яхве: “Среди тех, кто приближается ко Мне, Я явлю Свою святость[a], и перед всем народом буду прославлен[b]”». Аарон молчал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теми, кто приближается ко Мне, Я буду признан святым». Еврейское выражение может указывать как на явление Божьей святости, так и на признание Его святым теми, кто к Нему приближается.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «буду почитаем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה לֵאמֹר
  choice: Вот о чём говорил Яхве
  rationale: Естественно по-русски передаёт указательную конструкцию и глагол דבר, не добавляя смысла «имел в виду».
- source_word: בִּקְרֹבַי
  choice: В тех, кто приближается ко Мне
  rationale: Сохраняет предлог ב и намеренно не сужает круг приближающихся до одних священников; в контексте слышен культовый смысл приближения к Богу.
- source_word: אֶקָּדֵשׁ
  choice: явлю Я Свою святость
  rationale: Передаёт нифаль קדש как проявление Божьей святости, оставаясь понятным современному читателю; возможный оттенок признания Бога святым отмечен в сноске.
- source_word: וְעַל־פְּנֵי כָל־הָעָם
  choice: и перед всем народом
  rationale: Естественный русский эквивалент выражения со значением публичности, на виду у всего народа.
- source_word: אֶכָּבֵד
  choice: буду прославлен
  rationale: Нифаль כבד обозначает публичное обретение славы или почтения; «прославлен» сохраняет богословскую весомость слова.
- source_word: וַיִּדֹּם
  choice: Аарон молчал
  rationale: Кратко и торжественно передаёт молчание или безмолвную неподвижность Аарона в ответ на случившееся.
theological_decisions:
- issue: Проявление Божьей святости среди приближающихся к Нему
  choice: В тех, кто приближается ко Мне, явлю Я Свою святость
  alternative: Теми, кто приближается ко Мне, Я буду признан святым
  rationale: Еврейская форма допускает как проявление Божьей святости в суде, так и признание или почитание Его святым. Основной текст сохраняет Божью инициативу, а сноска — неустранимую смысловую напряжённость.
- issue: Публичное прославление Бога
  choice: перед всем народом буду прославлен
  alternative: перед всем народом буду почитаем
  rationale: «Прославлен» точно и естественно выражает богословскую силу כבד, тогда как «почитаем» представляет допустимый оттенок значения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Инверсия «явлю Я» подчёркивает параллелизм двух Божьих утверждений. Заглавные местоимения при обращении к Богу применены как уместная русская издательская конвенция.
