lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И говорил
  rationale: Ваййиктоль с דבר продолжает повествование; «говорил» точно передаёт формулу введения прямой речи и не дублирует следующее לֵאמֹר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: אֶל־אַהֲרֹן
  choice: Аарону
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Деепричастие сохраняет формальную вводную конструкцию перед содержанием речи и отражает отличие от וַיְדַבֵּר.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон; «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной библейской ритмикой. Конструкция «говорил… сказав» намеренно сохраняет формульность еврейского текста; двоеточие вводит последующую прямую речь.
