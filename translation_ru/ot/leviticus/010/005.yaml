lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: они подошли
  rationale: Форма qal wayyiqtol от קרב обозначает приближение к телам; «подошли» естественно передаёт направленное движение без добавления ритуального оттенка.
- source_word: וַיִּשָּׂאֻם
  choice: вынесли их
  rationale: נשׂא с местоименным суффиксом 3-го лица множественного числа здесь означает перенос тел Надава и Авиуда; приставка «вы-» естественно выражает удаление за пределы стана.
- source_word: בְּכֻתֳּנֹתָם
  choice: в их хитонах
  rationale: כֻּתֹּנֶת обозначает длинную нижнюю одежду, здесь священническую; «хитон» — точный и привычный библейский термин. Предлог ב допускает как значение состояния («в хитонах»), так и средства («за хитоны»), поэтому альтернатива отмечена в сноске.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Сочетание אֶל и מִחוּץ выражает движение наружу; русская конструкция «за пределы стана» ясно и естественно сохраняет направленность.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: как повелел Моисей
  rationale: דבר буквально значит «говорил/сказал», но в непосредственном контексте речь Моисея была распоряжением; «повелел» естественно обозначает исполнение его ранее данных слов.
