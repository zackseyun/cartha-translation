  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: усиленный поиск Моисея, обнаружение козла в сожжённом состоянии, его гнев на Елеазара и Ифамара как оставшихся сыновей Аарона и ввод последующей речи. «Тщательно разыскивал» уместно передаёт эмфатическую конструкцию דָּרֹשׁ דָּרַשׁ; «и оказалось» естественно воспроизводит повествовательную функцию וְהִנֵּה, не добавляя нового факта. «Был сожжён» сохраняет осторожность исходного причастия и не утверждает в основном тексте, что козёл был непременно сожжён целиком.'
