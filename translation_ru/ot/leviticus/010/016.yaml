source:
  edition: WLC
  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: ru
  text: 'Моисей тщательно разыскивал козла жертвы за грех[a], и оказалось, что тот был сожжён[b]. Тогда он разгневался на Елеазара и Ифамара, оставшихся сыновей Аарона[c], и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «искал, искал козла жертвы за грех». В еврейском тексте абсолютный инфинитив употреблён вместе с личной формой глагола для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «был полностью сожжён». Еврейская форма описывает козла в состоянии после сожжения.'
    reason: lexical_alternative
  - marker: c
    text: «Оставшиеся сыновья Аарона» — это Елеазар и Ифамар, оставшиеся после смерти Надава и Авиуда (Лев 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: козла жертвы за грех
  rationale: שְׂעִיר обозначает козла, а הַחַטָּאת — установленную жертву за грех. Формулировка естественна по-русски и сохраняет жертвенный термин.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: тщательно разыскивал
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает действие. Наречие «тщательно» передаёт эмфазу, а «разыскивал» указывает на настойчивый поиск и выяснение судьбы козла.
- source_word: וְהִנֵּה
  choice: и оказалось
  rationale: הִנֵּה привлекает внимание к неожиданно обнаруженному положению дел. «И оказалось» естественно передаёт этот повествовательный поворот в современном русском языке.
- source_word: שֹׂרָף
  choice: тот был сожжён
  rationale: Пассивное причастие описывает козла в обнаруженном состоянии. Перевод сохраняет пассивность, не уточняя в основном тексте сверх меры, был ли он сожжён полностью.
- source_word: וַיִּקְצֹף
  choice: он разгневался
  rationale: Глагол выражает сильный гнев. «Разгневался» соответствует достоинству повествования, не усиливая значение до ярости.
- source_word: הַנּוֹתָרִם
  choice: оставшихся
  rationale: Причастие обозначает сыновей Аарона, которые остались после смерти Надава и Авиуда; «оставшихся» кратко и точно сохраняет эту связь.
- source_word: לֵאמֹר
  choice: 'и сказал:'
  rationale: Стандартная формула введения прямой речи естественно передаётся по-русски личной формой глагола и двоеточием.
