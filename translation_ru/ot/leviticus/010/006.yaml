base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: ru
  text: 'И сказал Моисей Аарону и его сыновьям Елеазару и Ифамару: «Не оставляйте волосы распущенными[a] и не разрывайте своих одежд, чтобы вам не умереть и чтобы Он не разгневался на всю общину. А братья ваши — весь дом Израиля — пусть оплакивают пожар, который зажёг Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «не обнажайте голов» или «не оставляйте волосы неприбранными». Еврейское выражение обозначает траурный знак, связанный с головой или волосами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сожжение, которое сжёг Яхве». В русском переводе употреблено «пожар, который зажёг Яхве», чтобы естественно передать однокоренное еврейское выражение и образ огня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל־תִּפְרָעוּ
  choice: Не распускайте волос на головах
  rationale: Глагол פרע здесь обозначает оставление волос распущенными или неухоженными как знак траура. Перевод передаёт действие естественно по-русски, не сводя его к снятию головного убора.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: не разрывайте одежд
  rationale: פרם означает разрывать одежду, в данном контексте — в знак скорби.
- source_word: וְלֹא תָמֻתוּ
  choice: чтобы вам не умереть
  rationale: Передана угроза последствия нарушения запрета без архаического оборота «дабы не умереть».
- source_word: וְעַל כָּל־הָעֵדָה יִקְצֹף
  choice: и чтобы гнев не обрушился на всю общину
  rationale: В еврейском тексте глагол стоит без явно названного подлежащего; перевод сохраняет эту неявность посредством существительного «гнев», не добавляя прямо имя Бога.
- source_word: וַאֲחֵיכֶם כָּל־בֵּית יִשְׂרָאֵל
  choice: братья ваши — весь дом Израиля
  rationale: Сохранено буквальное «братья» и поясняющее приложение, охватывающее весь народ Израиля.
- source_word: יִבְכּוּ אֶת־הַשְּׂרֵפָה
  choice: пусть оплакивают сожжение
  rationale: «Сожжение» сохраняет конкретный образ гибели от божественного огня и не заменяет его толкованием вроде «бедствие» или «суд».
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: которое произвёл Яхве
  rationale: В оригинале употреблена этимологическая фигура «сожжение, которое сжёг Яхве». Русская формулировка избегает неестественного повтора, сохраняя прямую божественную причинность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом «Господь».
theological_decisions:
- issue: Неявное подлежащее при יִקְצֹף
  choice: гнев не обрушился
  alternative: Он не разгневался на всю общину
  rationale: Еврейский глагол имеет форму третьего лица единственного числа, но подлежащее прямо не названо. Номинальная русская конструкция сохраняет эту синтаксическую сдержанность и смысл угрозы всей общине.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер траурного запрета
  choice: Не распускайте волос на головах
  alternative: Не обнажайте голов
  rationale: Контекст указывает на запрет священникам проявлять обычные знаки траура. Основной текст передаёт наиболее вероятное отношение глагола к волосам, а традиционная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены термины «община» и «дом Израиля»; архаизмы и конфессионально обусловленные уточнения не вводились.
