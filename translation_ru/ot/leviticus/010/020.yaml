  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: ru
  text: Моисей услышал, и это показалось ему правильным[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и это было хорошо в его глазах»; также возможно: «и он одобрил».'
    reason: Пояснение еврейской идиомы и её возможной смысловой передачи.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: выслушал его
  rationale: Глагол שׁמע в данном контексте означает, что Моисей услышал предшествующее объяснение Аарона. Русское «выслушал» естественно передаёт восприятие объяснения, не утверждая сверх текста, что Моисей полностью его понял или безоговорочно согласился; местоимение «его» относится к Аарону и восстанавливается по контексту.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепонятная русская форма библейского имени.
- source_word: וַיִּיטַב
  choice: это показалось правильным
  rationale: 'Глагол יטב в сочетании с בְּעֵינָיו выражает положительную оценку: нечто оказалось хорошим, приемлемым или правильным. Выбранная передача естественна для современного русского языка и сохраняет оценочный, а не обязательно эмоциональный смысл.'
- source_word: בְּעֵינָיו
  choice: ему
  rationale: Еврейское выражение буквально означает «в его глазах», но в данном обороте соответствует русскому «ему» при глаголе «показалось». Буквальный образ сохранён в примечании.
