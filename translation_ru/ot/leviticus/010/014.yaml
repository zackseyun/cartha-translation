source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: ru
  text: Ты, твои сыновья и дочери вместе с тобой должны есть грудину потрясания[a] и бедро возношения[b] в чистом месте, потому что они даны тебе и твоим сыновьям как положенная вам доля от мирных жертв[c] сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грудину приношения, которым потрясают». Еврейское слово обозначает часть жертвы, которую ритуально двигали перед Господом, представляя Ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бедро поднятого приношения». Еврейское слово обозначает приношение, которое поднимали или особо отделяли как долю священников.'
    reason: lexical_alternative
  - marker: c
    text: «Мирные жертвы» можно также передать как «жертвы общения»; еврейское название связано с миром, целостностью и благополучием и имеет более широкий оттенок.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: грудина потрясания
  rationale: חֲזֶה обозначает грудную часть жертвенного животного, а תְּנוּפָה — ритуальное движение или представление дара перед Господом. «Грудина потрясания» сохраняет специальный культовый смысл и традиционную библейскую терминологию; пояснение дано в сноске.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: бедро возношения
  rationale: שׁוֹק здесь означает бедро или верхнюю часть ноги животного; תְּרוּמָה — выделенное и, вероятно, ритуально поднимаемое приношение, передаваемое священникам. «Бедро возношения» кратко передаёт оба элемента выражения.
- source_word: תֹּאכְלוּ
  choice: ешьте
  rationale: Форма множественного числа имеет предписывающую силу и относится к Аарону и перечисленным вместе с ним членам семьи. Русский императив естественно передаёт юридическое предписание.
- source_word: בְּמָקוֹם טָהוֹר
  choice: на чистом месте
  rationale: טָהוֹר в контексте Левита означает ритуальную чистоту. Краткое «на чистом месте» не перегружает основной текст уточнением, понятным из контекста.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: ты, твои сыновья и дочери вместе с тобой
  rationale: Сохранено прямое упоминание сыновей и дочерей, а также выражение «вместе с тобой». В русском устранено лишь избыточное повторение притяжательного местоимения перед «дочерьми».
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: тебе и твоим сыновьям как положенная вам доля
  rationale: חֹק здесь означает не отвлечённое постановление, а установленную священническую долю. Формулировка сохраняет получателей — Аарона и его сыновей — и ясно выражает характер дара.
- source_word: נִתְּנוּ
  choice: даны
  rationale: Страдательный перфект обозначает состоявшееся и сохраняющее силу установление. Русское краткое причастие естественно выражает этот результат.
- source_word: זִבְחֵי שַׁלְמֵי
  choice: мирные жертвы
  rationale: Традиционный русский термин сохраняет связь שְׁלָמִים с миром, целостностью и благополучием и не сужает значение до одного лишь общения или совместной трапезы.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формальное родовое обозначение сохранено в соответствии с еврейским выражением; здесь оно корпоративно называет народ Израиля.
theological_decisions:
- issue: Кому разрешено есть священническую долю и кому она дана
  choice: Сыновья и дочери названы среди едящих, но установленная доля обозначена как данная Аарону и его сыновьям.
  alternative: Сгладить различие и сказать, что доля дана всей семье.
  rationale: Еврейский текст намеренно включает дочерей в круг тех, кто может есть, но в формуле назначения доли повторяет только Аарона и его сыновей. Это различие сохранено без богословского выравнивания.
- issue: Передача שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения
  rationale: «Мирные жертвы» сохраняют широкий смысловой диапазон мира, целостности и благополучия; вариант «жертвы общения» более истолковательный и может неоправданно сузить значение.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Сохранена образная филиальная форма оригинала, хотя в данном контексте она обозначает Израиль как народ в целом.
translation_notes:
  register: Современный литературный русский с достоинством законодательного культового текста. Технические выражения «грудина потрясания» и «бедро возношения» сохранены ради точности и преемственности, но разъяснены в сносках. Порядок слов слегка перестроен для естественного русского синтаксиса; тире выделяют поясняющее перечисление участников.
