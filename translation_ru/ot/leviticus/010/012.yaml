source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: ru
  text: 'Затем Моисей сказал Аарону, а также Елеазару и Ифамару, его оставшимся сыновьям: «Возьмите хлебное приношение, оставшееся от огненных приношений Яхве[a], и ешьте его без закваски возле жертвенника, потому что это великая святыня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «от приношений, совершаемых огнём, Яхве».'
    reason: Лексическая альтернатива к еврейскому культовому термину אִשֵּׁי; основной текст сохраняет краткое терминологическое соответствие «огненные приношения».
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Затем Моисей сказал
  rationale: Форма с последовательным вавом продолжает повествование; «затем» естественно передаёт развитие событий, не добавляя противопоставления.
- source_word: הַנּוֹתָרִים
  choice: его оставшимся сыновьям
  rationale: Причастие указывает на сыновей Аарона, оставшихся после смерти Надава и Авиуда. Формулировка сохраняет связь с контекстом без усиления до «выжившим».
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В левитской жертвенной терминологии מִנְחָה обозначает приношение из муки или зерна, а не приношение вообще. «Хлебное приношение» — понятный и укоренившийся русский эквивалент.
- source_word: הַנּוֹתֶרֶת
  choice: оставшееся
  rationale: Форма женского рода согласуется с מִנְחָה и обозначает ту часть приношения, которая осталась после принесения доли Яхве.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: от приношений, сжигаемых для Яхве
  rationale: אִשֶּׁה связано с жертвами, предаваемыми огню. Описательная формулировка сохраняет образ огня и звучит по-русски яснее, чем буквальное «огненные приношения».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом «Господь».
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: и ешьте его без закваски
  rationale: מַצּוֹת здесь указывает, что приношение следует есть в незаквашенном виде. «Без закваски» естественно и точно передаёт смысл.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: возле жертвенника
  rationale: אֵצֶל обозначает близость; «возле» не предполагает непосредственного соприкосновения.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Еврейская конструкция выражает высшую степень святости. В русской библейской и культовой речи «великая святыня» ясно передаёт эту категорию, не смешивая её со Святым святых как помещением.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский с достоинством культового предписания. Перестановка имён после пояснения «его оставшимся сыновьям» устраняет возможную синтаксическую тяжеловесность, не меняя состава адресатов. Терминология остаётся понятной без конфессионально специфических уточнений.
