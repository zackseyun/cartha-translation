source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: ru
  text: Надав и Авиуд, сыновья Аарона, взяли каждый свою кадильницу, положили в них огонь, сверху насыпали благовония и принесли перед Яхве недозволенный огонь[a], которого Он не повелел им приносить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чужой огонь» или «посторонний огонь». Следующая фраза поясняет, что Яхве не повелел им приносить такой огонь.'
    reason: Лексическая альтернатива для אֵשׁ זָרָה и пояснение её культово-правового значения.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взяли
  rationale: Обычное повествовательное значение לקח; естественно передаёт начало последовательности действий.
- source_word: בְנֵי אַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: Надав и Авиуд, сыновья Аарона
  rationale: Сохраняет имена и родственную связь, выражая их естественным современным русским порядком слов.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: каждый свою кадильницу
  rationale: אִישׁ имеет распределительное значение «каждый», а מַחְתָּה обозначает сосуд для углей и курения; «кадильница» кратко и понятно передаёт культовую функцию.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: положили в них огонь
  rationale: Сохраняется множественное местоимение женского рода, относящееся к двум кадильницам.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: насыпали на него благовония
  rationale: В контексте благовония кладут на огонь; «насыпали» естественно для ароматического состава. Единственное местоимение соответствует еврейской форме, не устраняя возможную грамматическую неоднозначность её референта.
- source_word: וַיַּקְרִבוּ לִפְנֵי יְהוָה
  choice: принесли пред Яхве
  rationale: Hiphil קרב в культовом контексте означает принесение или представление приношения; «пред Яхве» сохраняет торжественный сакральный регистр и передаёт личное имя יְהוָה.
- source_word: אֵשׁ זָרָה
  choice: недозволенный огонь
  rationale: זָר здесь указывает на огонь, не разрешённый для священного служения, что поясняется следующей относительной частью; примечание сохраняет буквальные альтернативы.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: которого Он им не повелевал
  rationale: Сохраняет прямую связь с огнём и явно передаёт объектный суффикс «им/их», не уточняя сверх текста, какое именно предписание было нарушено.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; «Яхве» непосредственно передаёт его и не заменяет титулом.
- issue: Смысл выражения אֵשׁ זָרָה
  choice: недозволенный огонь
  alternative: чуждый огонь; посторонний огонь
  rationale: Последующая фраза связывает нарушение с отсутствием Божьего повеления. Основной текст передаёт юридико-культовый смысл, а примечание сохраняет буквальную образность и лексическую широту.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Форма «пред Яхве» поддерживает культовый контекст, не делая остальную фразу архаичной. Последовательность действий и смена множественного и единственного местоимений по возможности отражают еврейский текст.
