base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: ru
  text: 'И нанеси на неё масло[a] и положи на неё ладан: это хлебное приношение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «положи на неё масло… и помести на неё ладан». Оба еврейских глагола — обычные слова со значениями «дать, положить, поместить»; в данном обрядовом контексте речь идёт о нанесении масла и помещении ладана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: И возлей
  rationale: נתן имеет широкое значение «дать, положить, поместить»; при масле в данном обрядовом контексте естественное русское «возлей» точно передаёт нанесение масла, не уточняя его вид.
- source_word: עָלֶיהָ
  choice: на неё
  rationale: Предлог עַל с суффиксом 3-го лица женского рода указывает на нанесение или помещение поверх приношения; женский род соотносится с מִנְחָה.
- source_word: שֶׁמֶן
  choice: масло
  rationale: Еврейское слово обозначает масло; хотя в жертвенном контексте обычно имеется в виду оливковое, источник здесь этого прямо не уточняет.
- source_word: וְשַׂמְתָּ
  choice: и положи
  rationale: שׂים означает «класть, помещать»; «положи» естественно передаёт намеренное помещение ладана.
- source_word: לְבֹנָה
  choice: ладан
  rationale: לְבֹנָה обозначает именно ладан, а не благовоние вообще.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В жертвенном законодательстве Левита מִנְחָה — приношение из продуктов земледелия, прежде всего муки или зерна; традиционно понятное «хлебное приношение» точнее общего «дар» и не предполагает, что здесь обязательно имеется готовый хлеб.
- source_word: הִוא
  choice: это
  rationale: Местоимение подытоживает и определяет только что описанное как хлебное приношение; русское «это» естественно передаёт простую именную конструкцию.
