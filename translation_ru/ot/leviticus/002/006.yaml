translation:
  language: ru
  text: Разломи её на куски и полей её маслом — это хлебное приношение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּתוֹת אֹתָהּ פִּתִּים
  choice: Разломи её на куски
  rationale: Инфинитив абсолютный פָּתוֹת употреблён как повеление, а פִּתִּים обозначает получившиеся куски. Местоимение женского рода сохраняет согласование с подразумеваемым приношением, названным в ближайшем контексте.
- source_word: וְיָצַקְתָּ עָלֶיהָ שָׁמֶן
  choice: и полей маслом
  rationale: Глагольная форма продолжает последовательность предписаний; «полей маслом» естественно передаёт нанесение масла сверху, не добавляя отсутствующего в еврейском тексте уточнения «оливковым».
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В Левите 2 это специальное жертвенное приношение из муки или приготовленных мучных изделий. «Хлебное приношение» точнее по контексту, чем общее «дар», и не сужает значение до цельного зерна.
- source_word: הִוא
  choice: это
  rationale: Самостоятельное местоимение вводит краткое отождествление только что описанного предмета с хлебным приношением.
