  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: ru
  text: И принеси Яхве[a] хлебное приношение, приготовленное из этого; пусть он представит его священнику и поднесёт к жертвеннику.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Яхве». Еврейский предлог может указывать как на направление, так и на посвящение.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте после обращения «принеси» следуют глаголы в 3-м лице единственного числа; их действующее лицо прямо не названо.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: И принеси
  rationale: Форма 2-го лица единственного числа в законодательном наставлении передаёт предписание; повелительное наклонение звучит естественно по-русски, а союз сохраняет связь с предыдущими указаниями.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В Левите 2 מִנְחָה обозначает особое приношение из муки или зерна. Устоявшееся русское «хлебное приношение» точнее культового контекста, чем общее «дар».
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: приготовленное одним из этих способов
  rationale: Пассивная форма עשה означает «сделанное, приготовленное», а מֵאֵלֶּה отсылает к перечисленным выше разновидностям приготовления. Формулировка естественно выражает эту контекстуальную связь.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано как «Яхве». При глаголе «принести» русский дательный падеж естественно допускает как направление, так и посвящение приношения.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: его передадут священнику
  rationale: הקריב в породе хифиль означает «приблизить, представить». Неопределённо-личная конструкция сохраняет неявность действующего лица при форме 3-го лица и ясно обозначает переход приношения к священнику.
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: и тот поднесёт его к жертвеннику
  rationale: Хифиль נגשׁ означает «поднести, приблизить». Местоимение «тот» естественно указывает на только что названного священника и сохраняет последовательность ритуальных действий.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо употреблено собственное имя Бога, поэтому транслитерация сохраняет имя завета, не заменяя его титулом.
- issue: Значение предлога ל при имени Яхве
  choice: принеси Яхве
  alternative: принеси для Яхве
  rationale: Предлог может выражать как направление, так и посвящение. Русский дательный падеж при «принеси» сохраняет оба оттенка; альтернатива вынесена в примечание.
- issue: Смена действующего лица в ритуальной последовательности
  choice: неопределённо-личное «его передадут», затем явное указание на священника
  alternative: «он передаст его священнику и поднесёт его к жертвеннику»
  rationale: После формы 2-го лица еврейский текст переходит к формам 3-го лица, не называя первого действующего лица. Русская конструкция не приписывает оба действия одному лицу и сохраняет естественное понимание последнего действия как священнического.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной культовой лексикой. «Хлебное приношение» сохраняет принятую библейскую терминологию; синтаксис упрощён для ясности без устранения отмеченной в примечании неоднозначности еврейского текста.
