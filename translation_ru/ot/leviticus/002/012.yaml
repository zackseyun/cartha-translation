    rationale: Еврейское «не взойдут» сохраняет образ подъёма на жертвенник, но в современном русском естественнее передать запрет через «их нельзя возносить на жертвенник», не меняя смысла.
  - severity: low
    issue: Первая часть звучит как прямой приказ и тяжеловесна.
    rationale: В контексте это разрешение на представление указанных предметов как начатков, в противопоставлении запрету возносить их на жертвенник. «Вы можете принести» передаёт это яснее.
  - severity: medium
