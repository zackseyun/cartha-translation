  source_fidelity: 'Смысл передан в целом точно: речь о тех же предметах из предыдущего стиха, которые допустимо принести Яхве как начатки, но нельзя возносить на жертвенник в качестве «приятного благоухания». Однако русское «они не должны возноситься» неестественно при неодушевлённом подлежащем и размывает подразумеваемое действие приношения на жертвенник. Модальная возможность в первой части лучше выражает контекстуально допустительное значение формы תקריבו.'
  naturalness: «Как приношение начатков приносите их» тяжеловесно и может звучать как безусловное повеление. «Вы можете принести их Яхве как приношение начатков» — современно, ясно и сохраняет смысл. «Их нельзя возносить на жертвенник» естественно для русского библейского регистра.
  terminology: «Яхве», «приношение начатков», «жертвенник» и «приятное благоухание» уместны и последовательно передают ключевые термины. Сноску к лексическому варианту следует привязать к «начатков», а не к имени Яхве; сноска о буквальном образе восхождения должна быть привязана к выражению «приятное благоухание».
