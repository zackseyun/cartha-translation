  rationale: Правка делает фразу естественной для современного литературного русского, сохраняет контраст между принесением Яхве и вознесением на жертвенник, а также исправляет привязку сноски. Формулировка не уточняет спорным образом способ жертвоприношения и сохраняет образ «приятного благоухания».
