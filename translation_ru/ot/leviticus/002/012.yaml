  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: ru
  text: Как приношение начатков[a] вы можете принести их Яхве, но на жертвенник их нельзя возносить как приятное благоухание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как приношение первых плодов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не взойдут на жертвенник для приятного благоухания». Это жертвенная формула, относящаяся к приношению на жертвеннике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: приношение начатков
  rationale: Сочетание обозначает приношение первых плодов или первой части урожая. «Приношение начатков» сохраняет структуру еврейского выражения и культовый смысл.
- source_word: תַּקְרִיבוּ אֹתָם
  choice: приносите их
  rationale: Глагол в породе хифиль в жертвенном контексте означает представить или принести Богу как дар. Местоимение «их» сохраняет связь с закваской и мёдом из предыдущего стиха.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: но на жертвенник они не должны возноситься
  rationale: 'Союз передаёт противопоставление: их можно принести Яхве как начатки, но нельзя возносить на жертвенник. «Возноситься» сохраняет образ буквального восхождения, одновременно оставаясь понятным в жертвенном контексте.'
- source_word: לְרֵיחַ נִיחֹחַ
  choice: как приятное благоухание
  rationale: Устойчивое жертвенное выражение сохранено как метафора угодного Богу приношения; формулировка естественна для современного литературного русского языка.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет это различие без внесения конфессионального толкования.
- issue: Смысл выражения о восхождении на жертвенник
  choice: не должны возноситься как приятное благоухание
  alternative: не должны приноситься на жертвеннике как угодная жертва
  rationale: Выбранная формулировка сохраняет конкретный образ исходного текста и не сводит его молча к богословскому толкованию об угодности.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Сохранены местоименная связь с предыдущим стихом, контраст между принесением Яхве и вознесением на жертвенник, а также образ «приятного благоухания».
