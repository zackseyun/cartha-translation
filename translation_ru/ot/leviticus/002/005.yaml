  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: ru
  text: Если же твоё приношение — хлебное приношение, приготовленное на сковороде[a], пусть оно будет из муки тонкого помола, смешанной с маслом, без закваски.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на плоской сковороде». Еврейское слово обозначает поверхность или утварь для приготовления этого хлебного приношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В контексте Левита 2 слово обозначает особый вид приношения из муки или зерна. Устоявшееся русское выражение «хлебное приношение» сохраняет культовый смысл и отличает его от приношения вообще.
- source_word: עַל הַמַּחֲבַת
  choice: приготовленное на сковороде
  rationale: Предлог указывает на приготовление на поверхности утвари; добавление «приготовленное» делает связь естественной по-русски. Точный вид утвари не вполне определён, поэтому альтернативное понимание дано в сноске.
- source_word: קָרְבָּנְךָ
  choice: твоё приношение
  rationale: Сохраняет прямое обращение и общее значение жертвенного дара, не отождествляя его с более узким термином מִנְחָה.
- source_word: סֹלֶת
  choice: мука тонкого помола
  rationale: Передаёт качественную, тщательно размолотую муку ясным современным русским выражением без неоправданного уточнения вида зерна.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Причастие обозначает соединение муки с маслом, но не требует уточнять конкретный способ смешивания.
- source_word: מַצָּה
  choice: без закваски
  rationale: Передаёт требуемое состояние приношения и не превращает определение в отдельное существительное «опреснок».
- source_word: תִהְיֶה
  choice: пусть оно будет
  rationale: Естественно передаёт предписывающую силу древнееврейского имперфекта, не усиливая её до категорического «должно».
