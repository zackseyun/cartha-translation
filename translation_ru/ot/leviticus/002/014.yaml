    rationale: В оригинале повторяется глагол «принести» и вновь называется приношение первых плодов; притяжательное «своё» отсутствует и делает русскую фразу менее ясной.
  - severity: low
    issue: «Дроблёные зёрна» в основном тексте.
    rationale: Гֶּרֶשׂ обозначает дроблёный зерновой продукт; «дроблёное зерно» лучше передаёт это как вещественное обозначение и естественнее по-русски.
