  naturalness: «Принеси как своё приношение первых плодов» звучит тяжеловесно и синтаксически неясно в современном литературном русском. Более прямое повторение «принеси приношение из первых плодов» естественно и сохраняет ритуальный повтор оригинала.
  terminology: «Яхве», «приношение», «первые плоды», «свежие колосья», «обжаренные на огне» и «дроблёное зерно нового урожая» приемлемы. Массовое «зерно» в основном тексте точнее и естественнее, чем исчисляемое «зёрна», для גֶּרֶשׂ.
  issues:
