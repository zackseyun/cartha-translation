source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: ru
  text: 'Если же ты приносишь Яхве приношение из первых плодов, то принеси приношение из первых плодов: свежие колосья, обжаренные на огне, — дроблёное зерно нового урожая.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зелёные колосья, обжаренные на огне, — дроблёное зерно свежего урожая».'
    reason: Слова אָבִיב и כַּרְמֶל описывают свежее, ещё не высохшее зерно; точное соотношение выражений «свежие колосья» и «дроблёное зерно» допускает близкие варианты перевода.
lexical_decisions:
- source_word: מִנְחַת
  choice: приношение
  rationale: В Левите 2 слово обозначает установленное приношение из растительных продуктов. Более общее «приношение» сохраняет формулировку еврейского текста, а зерновой состав прямо указан далее.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: первые плоды
  rationale: Так передаётся культовое значение первых созревших плодов урожая, приносимых Богу.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, непосредственно употреблённое в еврейском тексте.
- source_word: אָבִיב
  choice: свежие колосья
  rationale: Слово обозначает зерно в колосе на ранней, ещё не высохшей стадии; перевод сохраняет конкретный земледельческий образ без излишней ботанической точности.
- source_word: קָלוּי בָּאֵשׁ
  choice: обжаренные на огне
  rationale: Ясно и естественно передаёт приготовление зерна непосредственным воздействием огня.
- source_word: גֶּרֶשׂ
  choice: дроблёные зёрна
  rationale: Существительное обозначает раздробленное или крупно истолчённое зерно; выбран конкретный и понятный современный эквивалент.
- source_word: כַּרְמֶל
  choice: нового урожая
  rationale: В данном сочетании слово относится к свежему зерну или свежему урожаю, а не к географическому названию. Перевод подчёркивает свежесть продукта и избегает неуместного топонима.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: приносишь ... принеси
  rationale: Повтор корня קרב сохранён, но первая форма естественно передана условно-настоящим временем, а вторая — предписанием.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Характер מִנְחָה в данном стихе
  choice: приношение
  alternative: хлебное приношение
  rationale: Контекст однозначно указывает на зерно, однако само слово имеет более широкое значение «дар, приношение». Общее обозначение сохраняет лексическую широту, не скрывая состава дара.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический повтор исходного текста сохранён, а трудная цепочка зерновых терминов оформлена через тире как пояснение без добавления отсутствующего в еврейском тексте союза.
