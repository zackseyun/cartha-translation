  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: ru
  text: А оставшееся от хлебного приношения — Аарону и его сыновьям; это величайшая святыня из приношений, совершаемых огнём для Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из огненных приношений Яхве»; возможно также: «из пищевых приношений Яхве».'
    reason: Лексическое значение אִשֶּׁה допускает как акцент на совершении приношения огнём, так и понимание этого слова как технического обозначения пищевых приношений.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: то, что останется
  rationale: Субстантивированная форма обозначает оставшуюся часть приношения; выбран естественный современный русский оборот.
- source_word: מִן הַמִּנְחָה
  choice: от хлебного приношения
  rationale: В контексте Левита 2 מִנְחָה — приношение из зерна или муки. Традиционное русское «хлебное приношение» охватывает эту категорию и не сводит её к готовому хлебу.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: предназначается Аарону и его сыновьям
  rationale: Предлог לְ выражает передачу или назначение доли; формулировка ясно передаёт право священников на остаток.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Еврейское усилительное сочетание обозначает высшую степень ритуальной святости. «Великая святыня» понятно передаёт культовую категорию и не создаёт впечатления, будто речь идёт о помещении «Святое святых».
- source_word: מֵאִשֵּׁי יְהוָה
  choice: из огненных приношений Яхве
  rationale: אִשֶּׁה — специальный жертвенный термин, обычно связанный с приношением на огне. Перевод сохраняет этот образ, а возможное понимание как пищевого приношения отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, представленное тетраграмматоном, передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача культовой категории קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  alternative: святыня святынь; величайшая святыня
  rationale: Выбранная формулировка сохраняет высшую степень святости остатка приношения, но не смешивает эту категорию со Святым святых как частью святилища.
- issue: Значение технического термина אִשֵּׁי יְהוָה
  choice: огненные приношения Яхве
  alternative: приношения, возносимые Яхве на огне; пищевые приношения Яхве
  rationale: Основной текст сохраняет явную связь термина с огнём, не устраняя возможность его более широкого технического понимания; значимые варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис разделён на два предложения ради ясности; культовые термины переданы последовательно и без архаизации.
