  naturalness: «Великая святыня» возможно в традиционном библейском употреблении, но в современном литературном русском «величайшая святыня» яснее выражает еврейскую превосходную культовую категорию קֹדֶשׁ קָדָשִׁים. Формулировка «из огненных приношений» тяжеловесна и не вполне естественна.
