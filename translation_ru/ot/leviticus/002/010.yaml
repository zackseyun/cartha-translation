id: LEV.2.10
reference: Leviticus 2:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: ru
  text: А оставшееся от хлебного приношения предназначается Аарону и его сыновьям. Это великая святыня из огненных приношений Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из пищевых приношений Яхве»; также возможно: «из приношений, сжигаемых для Яхве».'
    reason: Еврейское אִשֶּׁה — специальный жертвенный термин, который может передаваться как огненное приношение, как приношение, сжигаемое на жертвеннике, или идиоматически как пищевое приношение Богу.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: А оставшееся
  rationale: Субстантивированная форма обозначает оставшуюся часть приношения; перевод сохраняет эту функцию и естественно звучит по-русски.
- source_word: מִן הַמִּנְחָה
  choice: от хлебного приношения
  rationale: В Левите 2 מִנְחָה означает приношение из муки или зерна. «Хлебное приношение» — понятный русский культовый термин, не сводящий его к уже испечённому хлебу.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: предназначается Аарону и его сыновьям
  rationale: Предлог לְ выражает назначение или передачу доли; настоящее время уместно для предписания и восполняет отсутствующую в еврейском связку.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Еврейское сочетание выражает высшую степень святости и служит классификацией жертвенной доли. Русское «великая святыня» передаёт смысл естественнее буквального «святыня святынь».
- source_word: מֵאִשֵּׁי
  choice: из огненных приношений
  rationale: Слово обозначает культовые приношения Яхве, связанные с огнём жертвенника. «Из» сохраняет частичное/классифицирующее значение מִן; возможный смысл «пищевые приношения» отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Степень святости оставшейся доли
  choice: великая святыня
  alternative: святыня святынь; нечто особо святое
  rationale: Формула קֹדֶשׁ קָדָשִׁים указывает на высшую категорию ритуальной святости; перевод не добавляет отдельного богословского толкования.
- issue: Значение אִשֵּׁי יְהוָה
  choice: из огненных приношений Яхве
  alternative: из пищевых приношений Яхве; из приношений, сжигаемых для Яхве
  rationale: Основной текст сохраняет связь термина с огнём жертвенника и неоднозначное отношение родительного оборота к имени Яхве; лексическая альтернатива приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной культовой лексикой. Короткое второе предложение ясно относит формулу высшей святости к оставшейся доле, не добавляя отсутствующего в источнике слова «часть».
