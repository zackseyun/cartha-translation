review_pass:
  verdict: revise
  source_fidelity: Первая часть точно передаёт מִנְחָה как специальное зерновое приношение и запрет на его квасное приготовление. Во второй части лучше сохранить форму прямого запрета, обращённого к «вы» (לֹא תַקְטִירוּ), а не безличное «нельзя». «На жертвеннике» смыслово уместно, но прямо в стихе не названо; его лучше не включать в основной текст. Исправленный вариант передаёт запрет сжигать закваску или мёд в качестве огненной жертвы Яхве.
  naturalness: «Зерновое приношение» — естественный для современного литературного библейского русского термин. Формулировка «не сжигайте как огненную жертву Яхве» ясна, законодательна по регистру и не содержит тяжеловесного повтора «сжигать ... как жертву, сжигаемую».
  terminology: «Закваска» верно передаёт שְׂאֹר; «мёд» с культурной сноской сохраняет широту דְּבַשׁ. «Огненная жертва» является кратким и привычным соответствием אִשֶּׁה; сноска поясняет, что речь о приношении, сжигаемом на жертвеннике. Имя יהוה последовательно передано как «Яхве».
  issues:
  - severity: medium
    issue: Безличное «нельзя сжигать» вместо прямого запрета.
    rationale: Еврейское לֹא תַקְטִירוּ — запретительное обращение во 2-м лице множественного числа («не сжигайте»). Безличная конструкция несколько ослабляет и меняет законодательную форму высказывания.
  - severity: low
    issue: «На жертвеннике» добавлено в основной текст.
    rationale: Сжигание на жертвеннике подразумевается культовым термином, но слово «жертвенник» в еврейском тексте этого стиха отсутствует. Его следует оставить в пояснительной сноске, а не представлять как эксплицитную часть стиха.
  - severity: medium
    issue: Тавтологичная формулировка «сжигать ... как жертву, сжигаемую».
    rationale: Она стилистически тяжела и размывает технический термин אִשֶּׁה. «Огненная жертва» в основном тексте с поясняющей сноской передаёт термин компактнее и точнее.
