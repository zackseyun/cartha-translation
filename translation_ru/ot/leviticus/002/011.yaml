  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: ru
  text: Никакое зерновое приношение, которое вы приносите Яхве, не должно быть квасным, ибо ни закваску, ни мёд[a] не сжигайте как огненную жертву Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В древнем употреблении слово «мёд» могло обозначать также густой фруктовый сироп, а не только пчелиный мёд.
    reason: cultural_note
  - marker: b
    text: 'Или: «как жертву, сжигаемую для Яхве». Еврейский термин обозначает приношение, сжигаемое на жертвеннике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: приношение из зерна
  rationale: В контексте Левита 2 слово обозначает приношение из муки или зерна; такой перевод точнее общего «приношение» и понятнее современному читателю, чем традиционное «хлебное приношение».
- source_word: תַּקְרִיבוּ
  choice: приносите
  rationale: В породе хифиль глагол קרב в жертвенном контексте означает представлять или приносить дар Богу.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя יהוה.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: не должно быть квасным
  rationale: Передаёт запрещённое состояние приготовленного приношения без искусственного сужения смысла до современных пекарских дрожжей.
- source_word: שְׂאֹר
  choice: закваска
  rationale: Обозначает вещество, вызывающее брожение теста; «закваска» является точным и естественным русским соответствием.
- source_word: דְּבַשׁ
  choice: мёд
  rationale: Это основное значение слова; возможное включение фруктового сиропа отмечено в сноске.
- source_word: לֹא תַקְטִירוּ
  choice: нельзя сжигать на жертвеннике
  rationale: В жертвенном контексте хифиль от קטר означает заставлять подниматься в дыму, то есть сжигать на жертвеннике; формулировка ясна без архаичного «воскурять».
- source_word: מִמֶּנּוּ
  choice: ни закваску, ни мёд
  rationale: По-русски отрицательная конструкция естественно выражает запрет сжигать что-либо из названных веществ; неоднозначность местоименной отсылки не превращена в отдельное богословское утверждение.
- source_word: אִשֶּׁה
  choice: жертва, сжигаемая для Яхве
  rationale: Передаёт культовое приношение, возносимое посредством огня, и избегает предположения, будто речь идёт о жертве, состоящей из огня.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Культовый термин אִשֶּׁה
  choice: жертва, сжигаемая для Яхве
  alternative: огненная жертва; жертва, возносимая в огне
  rationale: Основной текст ясно передаёт способ принесения, а сноска сохраняет традиционную краткую альтернативу без утверждения спорной этимологии.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной культовой лексикой. Избегнуты как разговорные обороты, так и малопонятные архаизмы вроде «воскурять»; сохранён нормативный оттенок законодательного текста.
