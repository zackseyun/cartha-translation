base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: ru
  text: Всякое приношение твоего хлебного дара приправляй солью[a]. Не допускай, чтобы на твоём хлебном даре не было соли завета Бога твоего[b]. Со всяким приношением твоим приноси соль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «солью соли»; еврейский текст употребляет существительное «соль» с однокоренным глаголом.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «соль завета Бога твоего» передано буквально; сам стих не разъясняет его образный смысл.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבַּן
  choice: приношение
  rationale: Широкий жертвенный термин; «приношение» естественно в современном русском и сохраняет связь с действием принесения.
- source_word: מִנְחָה
  choice: хлебный дар
  rationale: В Левите 2 слово обозначает приношение из муки или зерна. «Хлебный дар» сохраняет культовую специфику и традиционную библейскую образность, не сужая значение до готового хлеба.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: соли солью
  rationale: Сохраняет выразительное сочетание существительного и однокоренного глагола в еврейском; повелительное значение передано формой настоящего-будущего предписания.
- source_word: תַשְׁבִּית ... מֵעַל
  choice: не оставляй ... без
  rationale: Естественно передаёт запрет устранить или допустить отсутствие соли на хлебном даре.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: соль завета Бога твоего
  rationale: Буквально сохраняет неразъяснённое в стихе заветное выражение и его образность.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: со всяким приношением твоим
  rationale: Передаёт сопровождение каждого приношения солью; буквальное «на всяком» также возможно, но в русском здесь менее ясно сочетается с глаголом «приноси».
- source_word: תַּקְרִיב
  choice: приноси
  rationale: Обычное русское соответствие каузативной форме קרב в жертвенном контексте.
theological_decisions:
- issue: Следует ли объяснить символический смысл «соли завета» непосредственно в тексте
  choice: Сохранить выражение «соль завета Бога твоего» без истолковывающего дополнения
  alternative: соль, служащая знаком завета Бога твоего
  rationale: Исходный текст не объясняет символику соли; буквальная передача сохраняет богословскую образность и напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским строем. Инверсия «хлебного дара твоего» и «Бога твоего» поддерживает достоинство культовой речи, оставаясь понятной; архаичные формы и узкоконфессиональная терминология не используются.
