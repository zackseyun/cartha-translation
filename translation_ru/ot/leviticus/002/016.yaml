    rationale: אֶת אַזְכָּרָתָהּ — прямое дополнение к «сожжёт». Оборот «сожжёт ... как памятную часть» несколько ослабляет это отношение.
  - severity: medium
    issue: Сноска смешивает лексическую альтернативу для зерна с маслом
    rationale: מִגִּרְשָׂהּ относится к дроблёному/крупно размолотому зерну; масло передаётся следующим членом וּמִשַּׁמְנָהּ. Альтернативное чтение не должно говорить «и его масла».
