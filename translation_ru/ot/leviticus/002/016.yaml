base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: ru
  text: 'И пусть священник сожжёт на жертвеннике памятную часть: часть её толчёного зерна[a] и масла, вместе со всем её ладаном. Это — огненная жертва Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крупно размолотого зерна». Еврейское слово обозначает раздробленные зёрна, приготовленные для хлебного приношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: сожжёт на жертвеннике
  rationale: В жертвенном контексте каузативная форма קטר означает сжечь приношение на жертвеннике, чтобы оно поднялось в дыме. Уточнение «на жертвеннике» естественно передаёт ритуальный смысл.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычный и точный русский эквивалент культового термина כהן.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: как памятную часть приношения
  rationale: Технический термин אַזכרה обозначает представительную часть хлебного приношения, сжигаемую на жертвеннике. Формулировка сохраняет идею памятной части и ясно показывает её отношение ко всему приношению.
- source_word: מִגִּרְשָׂהּ
  choice: немного толчёного зерна
  rationale: גרש обозначает раздробленные или крупно размолотые зёрна. «Толчёное зерно» понятно современному читателю; «немного» передаёт партитивное значение предлога מן.
- source_word: וּמִשַּׁמְנָהּ
  choice: и масла
  rationale: Предлог מן указывает, что памятная часть берётся также из масла; в русском партитивный смысл естественно выражается контекстом и словом «немного», относящимся к однородным компонентам.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: вместе со всем ладаном
  rationale: 'В данном жертвенном предписании על выражает сопровождение: памятную часть сжигают со всем ладаном.'
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Культовый термин אשה обозначает жертву, предаваемую огню. «Огненная жертва» кратко, понятно и не вносит спорного представления о буквальной пище для Бога.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет прямо употреблённое в еврейском тексте заветное имя; дательный оттенок посвящения выражен конструкцией «жертва Яхве».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господу; Иегове
  rationale: Еврейский текст прямо содержит тетраграмматон. «Яхве» сохраняет личное заветное имя и соответствует принятому для проекта решению, не заменяя его титулом.
- issue: Значение אַזְכָּרָה в жертвенном обряде
  choice: памятная часть приношения
  alternative: часть в напоминание; памятная жертва
  rationale: Текст не уточняет, кому или о чём служит напоминание. Перевод сохраняет культовый термин и его смысловую открытость, не разрешая богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного культового текста. Повелительная конструкция «И пусть…» естественно передаёт еврейский имперфект предписания. Термины сделаны понятными без устранения ритуальной специфики.
