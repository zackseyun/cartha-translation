    rationale: 'Еврейский текст дважды употребляет מִן: мемориальная часть берётся и из дроблёного зерна, и из масла. В конструкции «немного толчёного зерна и масла» слово «немного» может быть воспринято как относящееся преимущественно к зерну.'
  - severity: low
