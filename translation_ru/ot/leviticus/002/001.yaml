source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: ru
  text: Если кто-либо приносит Яхве[a] хлебное приношение, его приношение должно быть из тонко смолотой муки[b]; он должен полить его маслом и положить на него ладан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господу». Здесь в еврейском тексте стоит личное имя Бога — יהוה (Яхве).'
    reason: divine_name
  - marker: b
    text: Еврейское слово обозначает тонко смолотую муку, употреблявшуюся для приношения.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: кто-нибудь
  rationale: В культово-правовом контексте слово обозначает отдельного человека, а не «душу» как особую составляющую человека. Неопределённое «кто-нибудь» естественно передаёт условную конструкцию.
- source_word: תַקְרִיב קָרְבַּן
  choice: приносит ... приношение
  rationale: Глагол в породе хифиль буквально выражает приближение или представление дара; в русском языке культовое «приносит приношение» точно сохраняет действие и его объект.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В данном разделе это бескровное приношение из муки или приготовленных зерновых продуктов. Традиционное русское выражение «хлебное приношение» охватывает категорию лучше, чем узкое «зерновое».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה, а предлог ל выражен русским дательным падежом.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Слово обозначает высококачественную тонко смолотую муку. «Лучшая мука» понятно современному читателю; примечание уточняет её тонкий помол.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: пусть он польёт его маслом
  rationale: Последовательная глагольная форма здесь имеет предписывающую силу. Местоимение относится к приношению; мужской род обусловлен русским существительным.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: положит на него ладан
  rationale: לְבֹנָה — ароматическая смола, употреблявшаяся при богослужении; стандартный русский эквивалент — «ладан».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет различие между личным именем Бога и титулом «Господь».
- issue: Род и число участника в правовом предписании
  choice: кто-нибудь ... его ... он
  alternative: человек ... своё ... тот
  rationale: נֶפֶשׁ грамматически женского рода, но последующее קָרְבָּנוֹ имеет суффикс 3-го лица мужского рода единственного числа. Русская формулировка сохраняет единичного типового участника, не утверждая, что предписание относится только к мужчинам.
translation_notes:
  register: Современный литературный русский язык с достоинством правового богослужебного текста. Повелительная конструкция «пусть» естественно передаёт предписание; сохранён типовой участник в единственном числе. Термин «хлебное приношение» выбран как понятное и достаточно широкое название данной жертвенной категории.
