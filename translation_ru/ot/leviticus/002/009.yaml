id: LEV.2.9
reference: Leviticus 2:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: ru
  text: И пусть священник возьмёт из хлебного приношения его памятную часть и сожжёт её на жертвеннике как огненную жертву[a] — благоухание, приятное ГОСПОДУ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пищевое приношение, благоухание, приятное ГОСПОДУ».'
    reason: Лексическое значение אִשֵּׁה допускает традиционное понимание как жертвы, совершаемой посредством огня, и контекстуальное понимание как пищевого приношения Богу.
lexical_decisions:
- source_word: וְהֵרִים
  choice: и пусть … возьмёт
  rationale: Форма породы hифиль здесь обозначает ритуальное изъятие части приношения. «Возьмёт» естественно звучит по-русски и не вводит дополнительного толкования способа действия.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное соответствие еврейскому термину в культовом контексте.
- source_word: מִן הַמִּנְחָה
  choice: из хлебного приношения
  rationale: В Левите 2 מִנְחָה обозначает приношение из продуктов земледелия. «Хлебное приношение» — понятный и укоренившийся русский термин, охватывающий муку и приготовленные изделия, упомянутые в главе.
- source_word: אַזְכָּרָתָהּ
  choice: его памятную часть
  rationale: Речь идёт не обо всём приношении, а о его представительной части, сжигаемой на жертвеннике. «Памятная часть» сохраняет смысловой компонент напоминания и культовую функцию термина.
- source_word: וְהִקְטִיר
  choice: и сожжёт её
  rationale: В жертвенном контексте глагол означает сжечь на жертвеннике, обратив в дым. Русское «сожжёт» ясно и естественно передаёт действие.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс в данном устойчивом обороте естественно передаётся по-русски местом совершения действия.
- source_word: אִשֵּׁה
  choice: огненную жертву
  rationale: Термин обозначает жертву, предаваемую огню. Перевод сохраняет традиционную связь с огнём и не превращает образ автоматически в пищу для Бога; возможное иное понимание отмечено в сноске.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Устойчивое жертвенное выражение сохраняет образ запаха и указывает на благоприятное принятие жертвы. Формулировка современна и при этом возвышенна.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Тетраграмматон передан принятой в русском библейском стиле заменой «ГОСПОДЬ», с прописным написанием для отличения божественного имени.
theological_decisions:
- issue: Передача жертвенной формулы אִשֵּׁה רֵיחַ נִיחֹחַ
  choice: огненную жертву, благоухание, приятное ГОСПОДУ
  alternative: пищевое приношение, благоухание, приятное ГОСПОДУ
  rationale: Основной текст сохраняет явный культовый образ жертвы, предаваемой огню, и антропоморфный образ приятного запаха, не объясняя его через более позднюю богословскую систему. Лексически возможное понимание אִשֵּׁה как пищевого приношения сохранено в сноске.
- issue: Передача имени יהוה
  choice: ГОСПОДУ
  alternative: Яхве
  rationale: 'Выбрана укоренившаяся русская форма благоговейного замещения имени. Она не устраняет различие полностью: прописное написание указывает, что в исходном тексте стоит собственное божественное имя.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным культовым регистром. Синтаксис следует структуре еврейского стиха, но остаётся естественным для чтения вслух. Термины «хлебное приношение», «памятная часть» и «жертвенник» последовательно обозначают реалии священнического текста.
