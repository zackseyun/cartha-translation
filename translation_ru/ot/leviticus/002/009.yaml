- from: И пусть священник возьмёт из хлебного приношения его памятную часть и сожжёт её на жертвеннике — огненную жертву[a], благоухание, приятное ГОСПОДУ.
  to: И пусть священник возьмёт из хлебного приношения его памятную часть и сожжёт её на жертвеннике как огненную жертву[a] — благоухание, приятное ГОСПОДУ.
  rationale: Внесено только безопасное синтаксическое уточнение «как», чтобы формула אִשֵּׁה риторически и грамматически относилась к сожжению памятной части. Значение стиха, его культовая образность и отмеченная в сноске лексическая неоднозначность сохранены.
