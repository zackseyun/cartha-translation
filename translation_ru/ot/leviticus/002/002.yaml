revisions:
- from: Он принесёт её к сыновьям Аарона, священникам, и один из них возьмёт оттуда полную горсть её тонкой муки и её масла вместе со всем её ладаном. Священник сожжёт эту памятную часть на жертвеннике как огненную жертву[a], как благоухание, приятное Яхве.
  to: Он принесёт её к сыновьям Аарона, священникам, и один из них возьмёт оттуда полную горсть её тонкой муки и немного её масла вместе со всем её ладаном. Священник сожжёт эту памятную часть на жертвеннике как огненную жертву[a] — благоухание, приятное Яхве.
  rationale: 'Добавлено «немного её масла», чтобы передать частичное взятие, выраженное предлогом מִן. Заключительная формула перестроена как приложение с тире, что точнее отражает еврейский синтаксис и делает русский текст плавнее. Остальные решения сохранены: субъект действия обоснованно уточнён как один из священников, а «оттуда» передаёт מִשָּׁם без излишнего толкования.'
  reviewer_model: gpt-5.6-terra
