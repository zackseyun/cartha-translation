  revision_rationale: 'Добавлено «немного её масла», чтобы передать частичное взятие, выраженное предлогом מִן. Заключительная формула перестроена как приложение с тире, что точнее отражает еврейский синтаксис и делает русский текст плавнее. Остальные решения сохранены: субъект действия обоснованно уточнён как один из священников, а «оттуда» передаёт מִשָּׁם без излишнего толкования.'
