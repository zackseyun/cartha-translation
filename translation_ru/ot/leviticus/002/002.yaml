source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ru
  text: Он принесёт её к сыновьям Аарона, священникам, и один из них возьмёт оттуда полную горсть её тонкой муки и немного её масла вместе со всем её ладаном. Священник сожжёт эту памятную часть на жертвеннике как огненную жертву[a] — благоухание, приятное Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «пища-жертва» или «жертва, сжигаемая на огне».'
    reason: Технический термин אִשֵּׁה может пониматься как обозначение жертвы, предаваемой огню, либо связываться с пищей, предлагаемой на жертвеннике; основной текст сохраняет традиционно понятный смысл, а примечание отмечает лексическую неопределённость.
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Он принесёт её
  rationale: Форма Hiphil от בוא с местоименным дополнением женского рода указывает на принесение хлебного приношения; будущее время естественно передаёт предписание.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: к сыновьям Аарона, священникам
  rationale: Сохранены и родственная характеристика, и пояснительное наименование служителей.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: один из них возьмёт ... полную горсть
  rationale: Глагол обозначает взятие рукой, а выражение буквально указывает на полноту горсти. «Один из них» естественно связывает единственное число глагола с названной группой священников, не смешивая приносящего со священником.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Прямо сохраняет пространственное наречие «оттуда», не заменяя его местоименным «из неё».
- source_word: מִסָּלְתָּהּ
  choice: её тонкой муки
  rationale: סֹלֶת обозначает особо тонкую, очищенную муку, употреблявшуюся для приношений.
- source_word: וּמִשַּׁמְנָהּ
  choice: и её масла
  rationale: Сохраняется зависимость от действия взятия части приношения; количество определяется выражением о полной горсти.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: вместе со всем её ладаном
  rationale: Передаёт включение всего ладана, в отличие от частично взятых муки и масла.
- source_word: אַזְכָּרָתָהּ
  choice: эту памятную часть
  rationale: Сохраняет техническое значение представительной части приношения, сжигаемой на жертвеннике как напоминание перед Богом.
- source_word: וְהִקְטִיר ... הַמִּזְבֵּחָה
  choice: сожжёт ... на жертвеннике
  rationale: В жертвенном контексте Hiphil קטר означает вознесение посредством сожжения; направительная форма указывает на жертвенник как место действия.
- source_word: אִשֵּׁה
  choice: огненную жертву
  rationale: Формально и прозрачно передаёт священнический термин для приношения, предаваемого огню, не утверждая спорную этимологическую связь с «пищей».
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Передаёт устойчивую жертвенную формулу и её образ принятия жертвы Богом современным литературным русским языком.
- source_word: יהוה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное заветное имя, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; «Яхве» сохраняет личное имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение אִשֵּׁה
  choice: огненная жертва
  alternative: пища-жертва; жертва, сжигаемая на огне
  rationale: Значение технического термина и его этимология обсуждаются. Основной текст сохраняет несомненную связь с жертвенным сожжением, а примечание отмечает пищевую интерпретацию, не разрешая спор молча.
- issue: Субъект וְקָמַץ
  choice: один из сыновей Аарона, священников
  alternative: приносящий; священник
  rationale: В форме глагола субъект прямо не назван, но ближайшее множественное обозначение священников и последующее упоминание священника поддерживают понимание, что действие совершает один из них. Формулировка «один из них» делает русскую синтаксическую связь ясной.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, ритуально-правовым звучанием. Сохранены повторяющиеся притяжательные формы, важные для связи всех составляющих с хлебным приношением; архаизмы и конфессионально маркированная замена имени Яхве титулом исключены.
