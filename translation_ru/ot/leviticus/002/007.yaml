lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Передаёт условие и связь с последовательным перечислением видов хлебного приношения; «же» естественно выражает переход к следующему случаю.
- source_word: מִנְחַת
  choice: хлебное приношение
  rationale: В Левите 2 слово обозначает приношение из муки или зерна, а не дар вообще; традиционное русское сочетание понятно в данном культовом контексте.
- source_word: מַרְחֶשֶׁת
  choice: сковорода
  rationale: Речь идёт о сосуде для приготовления пищи, однако его точный вид неизвестен; общеупотребительное слово вынесено в текст, а неопределённость отмечена в сноске.
- source_word: קָרְבָּנֶךָ
  choice: твоё … приношение
  rationale: Притяжательный суффикс передан местоимением «твоё»; отдельное повторение русского слова «приношение» не требуется, поскольку оно уже соответствует сочетанию מִנְחַת … קָרְבָּנֶךָ.
- source_word: סֹלֶת
  choice: тонкая мука
  rationale: Обозначает муку тонкого помола, употребляемую для приношений; формулировка точна и понятна современному читателю.
- source_word: בַּשֶּׁמֶן
  choice: с маслом
  rationale: Предлог обозначает сопровождающий материал приготовления; перевод не уточняет способ соединения муки с маслом сверх сказанного в еврейском тексте.
- source_word: תֵּעָשֶׂה
  choice: пусть оно будет сделано
  rationale: Сохраняет страдательное значение нифаля и предписывающую силу формы в естественной русской конструкции.
