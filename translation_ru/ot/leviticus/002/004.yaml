  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: ru
  text: 'Если же ты приносишь хлебное приношение, испечённое в печи, оно должно быть из муки тонкого помола: пресные лепёшки, замешанные с маслом, или[a] пресные тонкие лепёшки, смазанные маслом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и пресные тонкие лепёшки». Еврейский союз обычно означает «и», но здесь, вероятно, вводит другой допустимый вид хлебного приношения, испечённого в печи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если же
  rationale: Передаёт условное введение нового случая и одновременно сохраняет связь с предыдущими предписаниями.
- source_word: תַקְרִב קָרְבַּן מִנְחָה
  choice: ты приносишь хлебное приношение
  rationale: Глагол Hiphil от קרב обозначает принесение или представление жертвы перед Богом. В русском буквальное «приближаешь приношение» звучало бы неестественно; «приносишь» сохраняет ритуальный смысл. מִנְחָה здесь обозначает установленную жертву из муки и масла, поэтому выбрано понятное категориальное название «хлебное приношение».
- source_word: מַאֲפֵה תַנּוּר
  choice: испечённое в печи
  rationale: Естественно передаёт способ приготовления, выраженный еврейским сочетанием со значением печёного изделия из печи.
- source_word: סֹלֶת
  choice: мука тонкого помола
  rationale: Передаёт высококачественную мелко размолотую муку без добавления не выраженного прямо в тексте указания на конкретный злак.
- source_word: חַלּוֹת מַצּוֹת בְּלוּלֹת בַּשֶּׁמֶן
  choice: пресные лепёшки, замешанные с маслом
  rationale: חַלּוֹת обозначает хлебные изделия или лепёшки, מַצּוֹת — приготовленные без закваски, а בְּלוּלֹת указывает на смешивание масла с тестом.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: или[a] пресные тонкие лепёшки
  rationale: רְקִיקִים — тонкие хлебные изделия. В контексте перечисляются два допустимых вида печёного приношения, поэтому в основном тексте употреблено «или», а буквальное значение союза וְ отмечено в сноске.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: смазанные маслом
  rationale: Причастие от משׁח буквально связано с помазанием или намазыванием; применительно к тонким хлебным изделиям «смазанные маслом» точно и естественно описывает действие, не привнося дополнительного сакрального оттенка.
theological_decisions:
- issue: Значение מִנְחָה в жертвенном контексте
  choice: хлебное приношение
  alternative: дар; приношение из зерна
  rationale: В Левите 2 это название отдельной жертвенной категории, приготовляемой из муки и масла. «Хлебное приношение» сохраняет культовую определённость и остаётся понятным современному читателю, не сводя термин к общему «дару».
- issue: Отношение между двумя видами печёных изделий
  choice: или, со сноской о буквальном «и»
  alternative: и
  rationale: Еврейский союз допускает обычное соединительное прочтение, однако в данном процедурном перечне, вероятно, представляет второй допустимый способ приготовления. Перевод сообщает наиболее вероятную связь, а сноска сохраняет подлинную языковую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для законодательного богослужебного текста. Избегаются архаизмы «елей» и «опресноки»; конкретные кулинарные действия переданы общеупотребительными словами. Синтаксис слегка сглажен ради ясности, при этом последовательность и различия исходных деталей сохранены.
