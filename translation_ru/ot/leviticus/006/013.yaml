id: LEV.6.13
reference: Leviticus 6:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: ru
  text: 'Вот приношение Аарона и его сыновей, которое они должны приносить ГОСПОДУ в день его помазания[a]: десятую часть эфы муки тонкого помола как регулярное хлебное приношение — половину утром и половину вечером.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в день помазания его». В еврейском тексте местоимение стоит в единственном числе, хотя перед этим названы Аарон и его сыновья.'
    reason: Сохранение грамматической неоднозначности исходного текста.
lexical_decisions:
- source_word: קָרְבַּן
  choice: приношение
  rationale: Широкий термин для дара, приносимого Богу; «приношение» естественно звучит в культовом контексте и не сужает значение до конкретного вида жертвы.
- source_word: יַקְרִיבוּ
  choice: должны приносить
  rationale: В породе hифиль глагол קרב в жертвенном контексте означает представить или принести жертву; выбранная формулировка передаёт предписывающий характер текста.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Тетраграмматон передан традиционным русским эквивалентом «ГОСПОДЬ», с прописным написанием для обозначения Божьего имени.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: в день его помазания
  rationale: Формулировка сохраняет временное значение оборота и единственное число местоименного суффикса, не устраняя неоднозначность при упоминании Аарона и его сыновей.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: десятую часть эфы
  rationale: Точная и привычная передача древней меры объёма без приблизительной метрической замены.
- source_word: סֹלֶת
  choice: муки тонкого помола
  rationale: Передаёт значение тщательно обработанной муки для хлебных приношений; нейтральнее, чем добавление прямо не названного в стихе вида зерна.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В законодательстве Левита термин обозначает приношение из муки или зерна; «хлебное приношение» — понятный и укоренившийся русский культовый термин.
- source_word: תָּמִיד
  choice: постоянное
  rationale: Обозначает установленную регулярность приношения, совершаемого утром и вечером, а не обязательно непрерывное действие.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: половину ... и половину
  rationale: Прямо и естественно передаёт разделение общего количества на две равные части.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: утром ... вечером
  rationale: Естественная современная русская передача временных оборотов.
theological_decisions:
- issue: Единственное число местоимения в выражении о помазании после упоминания Аарона и его сыновей
  choice: 'Сохранить единственное число: «в день его помазания»'
  alternative: 'Передать по смыслу во множественном числе: «в день их помазания» или «когда их помажут»'
  rationale: Масоретский текст содержит местоименный суффикс единственного числа. Перевод сохраняет эту грамматическую напряжённость и не решает за читателя, относится ли выражение прежде всего к Аарону или распределительно к каждому помазываемому священнику.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром законодательного текста. Синтаксис сделан ясным, но единственное число в обороте о помазании намеренно сохранено. Термины «приношение», «хлебное приношение» и «эфа» поддерживают точность культовой лексики без излишней архаизации.
