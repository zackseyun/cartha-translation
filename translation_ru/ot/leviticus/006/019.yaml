lexical_decisions:
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычный и точный русский эквивалент כֹּהֵן; определённость естественно передана контекстом и порядком слов.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: совершающий с ней обряд жертвы за грех
  rationale: 'Пиэль-причастие от חטא здесь имеет специальный жертвенный смысл: священник совершает предписанный обряд с жертвой за грех. Формулировка сохраняет культовый смысл, не сводя его исключительно к искуплению или очищению.'
- source_word: יֹאכֲלֶנָּה
  choice: должен есть её
  rationale: Имперфект в законодательном контексте выражает предписание; «должен есть» ясно передаёт обязательность.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: на святом месте
  rationale: Естественное русское культовое выражение; отсутствие артикля у מָקוֹם не требует неопределённого местоимения в русском.
- source_word: תֵּאָכֵל
  choice: её следует есть
  rationale: Передаёт пассивное предписание естественнее, чем буквальное «она должна быть съедена», сохраняя фокус на жертве.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: во дворе Шатра встречи
  rationale: Точно обозначает двор святилища; «Шатёр встречи» — ясное и устойчивое соответствие אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Культовый смысл חטא в священническом законодательстве
  choice: совершающий с ней обряд жертвы за грех
  alternative: совершающий ею искупление; очищающий ею; приносящий её как жертву за грех
  rationale: Еврейское причастие обозначает участие священника в специальном обряде жертвы за грех. Выбранная формулировка сохраняет широту культового значения и не вносит более узкое богословское толкование.
- issue: Референт местоименных суффиксов женского рода
  choice: её / с ней — жертва за грех
  alternative: его / с ним — животное или приношение
  rationale: В русском контексте подразумевается «жертва», существительное женского рода, что также соответствует грамматическому роду еврейских местоимений.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного культового текста. Использовано «есть», а не разговорное «съесть»; «Шатёр встречи» оформлен как название святилища.
