base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: ru
  text: Её не следует печь с закваской. Я дал её им как долю от моих огненных приношений[a]. Она — величайшая святыня, как жертва за грех и жертва повинности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моих пищевых приношений»; также возможно: «моих приношений, сжигаемых на огне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертва возмещения»; традиционно также: «жертва за преступление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה
  choice: нельзя печь
  rationale: Страдательная форма нифаля относится к приношению; безличная русская конструкция естественно передаёт пассивное предписание и юридический запрет.
- source_word: חָמֵץ
  choice: с закваской
  rationale: В контексте выпечки существительное обозначает закваску или квасное; этот вариант естественен по-русски и не добавляет отсутствующего в тексте слова «хлеб».
- source_word: חֶלְקָם
  choice: им как долю
  rationale: Сохраняет смысл назначенной священникам доли и множественный притяжательный суффикс.
- source_word: נָתַתִּי אֹתָהּ
  choice: Я дал её
  rationale: Прошедшее время передаёт совершенный глагол и установленное Богом пожалование, сохраняющее силу в данном предписании.
- source_word: מֵאִשָּׁי
  choice: от Моих огненных приношений
  rationale: Передаёт техническое жертвенное обозначение אִשֶּׁה и сохраняет образ огня; возможное понимание как пищевых приношений отмечено в сноске.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Идиоматично передаёт еврейскую превосходную конструкцию и обозначает высшую степень ритуальной святости, а не помещение «Святое святых».
- source_word: כַּחַטָּאת
  choice: как жертва за грех
  rationale: Предлог כ передаёт сопоставление статуса приношения со жертвой за грех.
- source_word: וְכָאָשָׁם
  choice: и жертва повинности
  rationale: Устоявшийся современный русский термин для жертвенного אָשָׁם; сохраняет связь с виной, не сводя смысл исключительно к материальному возмещению.
theological_decisions:
- issue: Передача жертвенного термина אָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения; традиционное «жертва за преступление»
  rationale: Основной вариант узнаваем в русской библейской речи и передаёт категорию жертвы, связанную с виной; сноска сохраняет возможный акцент на возмещении.
- issue: Передача технического термина אִשֶּׁה
  choice: огненные приношения
  alternative: пищевые приношения; приношения, сжигаемые на огне
  rationale: Основной вариант близок к форме и жертвенному контексту еврейского термина, а сноска сохраняет альтернативное лексическое понимание без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Юридическая категоричность запрета сохранена без архаизмов. Местоимение «Моих» написано с прописной буквы как обращённое к Богу. Маркеры сносок поставлены непосредственно после тех терминов, к которым относятся лексические варианты.
