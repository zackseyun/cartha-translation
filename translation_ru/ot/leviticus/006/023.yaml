  text: וְ/כָל חַטָּ֡את אֲשֶׁר֩ יוּבָ֨א מִ/דָּמָ֜/הּ אֶל אֹ֧הֶל מוֹעֵ֛ד לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ לֹ֣א תֵאָכֵ֑ל בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: ru
  text: И всякую жертву за грех[a], часть крови которой внесут в шатёр встречи, чтобы совершить искупление в святилище, нельзя есть; её следует сжечь в огне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «очистительную жертву». Еврейское слово חַטָּאת в книге Левит может обозначать жертву, посредством которой устраняются грех и ритуальная нечистота.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: И всякую
  rationale: Союз «и» связывает предписание с предыдущим контекстом, а «всякую» сохраняет всеохватность כָל и согласуется с винительной конструкцией русского предложения.
- source_word: חַטָּאת
  choice: жертву за грех
  rationale: В данном жертвенном контексте слово обозначает не грех как таковой, а приношение, связанное с устранением греха и нечистоты. «Жертва за грех» — ясный и узнаваемый русский культовый термин; допустимая альтернатива отмечена в сноске.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: часть крови которой внесут
  rationale: 'Предлог מִן при слове «кровь» имеет партитивный смысл: внутрь вносят часть крови, а не обязательно всю кровь. Неопределённо-личная конструкция естественно передаёт еврейский пассив в русском законодательном контексте.'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: в шатёр встречи
  rationale: Передаёт направление внутрь священного шатра и сохраняет буквальное значение устойчивого еврейского наименования אֹהֶל מוֹעֵד современным понятным языком.
- source_word: לְכַפֵּר
  choice: чтобы совершить искупление
  rationale: Сохраняет ритуально-богословскую ёмкость глагола כפר, не сводя его значение к одной частной теории искупления.
- source_word: בַּקֹּדֶשׁ
  choice: в святилище
  rationale: В контексте речь идёт о священной области шатра, а не об абстрактной святости. «В святилище» звучит естественно и не требует искусственного уточнения.
- source_word: לֹא תֵאָכֵל
  choice: нельзя есть
  rationale: 'Естественная русская форма категорического запрета сохраняет пассивную направленность предписания: жертва не предназначена для употребления в пищу.'
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: её следует сжечь в огне
  rationale: Передаёт обязательность предписания и сохраняет явное упоминание огня, присутствующее в еврейской идиоме.
theological_decisions:
- issue: Значение חַטָּאת в священническом жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: В стихе явно подразумевается жертвенное приношение. Основной вариант сохраняет традиционно понятную связь с грехом, тогда как сноска сообщает о реальном очистительном оттенке термина, не делая его единственным толкованием.
- issue: Объём крови, вносимой в святилище
  choice: часть крови которой внесут
  alternative: кровь которой внесут
  rationale: Предлог מִן указывает на партитивность. Явное «часть» сохраняет ритуальную деталь и не создаёт впечатления, будто внутрь вносили всю кровь.
- issue: Значение כפר в данном обряде
  choice: совершить искупление
  alternative: совершить очищение
  rationale: «Совершить искупление» сохраняет более широкий смысл культового действия и богословское напряжение термина, не исключая его очистительного действия.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным законодательным звучанием. Термин «шатёр встречи» выбран вместо архаичного «скиния собрания»; синтаксис слегка разглажен ради естественности, при этом партитивность выражения о крови и культовая терминология сохранены.
