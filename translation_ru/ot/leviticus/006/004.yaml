  source_fidelity: 'Текст точно передаёт последовательность действий в еврейском оригинале: снять прежние одежды, надеть другие и вынести золу за пределы стана в чистое место. «Золу» корректно передаёт הַדֶּשֶׁן в данном жертвенном контексте; направления «за пределы стана» и «на чистое место» сохранены.'
