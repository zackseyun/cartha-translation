  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: ru
  text: Затем он снимет свои одежды и наденет другие, вынесет[a] золу за пределы стана, на чистое[b] место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удалит» либо «вынесет прочь».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «чистое» означает ритуально чистое согласно установлениям книги Левит.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: Затем он снимет
  rationale: В контексте одежды פשט означает «снять». «Затем» естественно передаёт последовательность предписанных действий, выраженную союзом וְ.
- source_word: בְּגָדָיו
  choice: свои одежды
  rationale: בגד — обычное обозначение одежды; форма с местоименным суффиксом указывает на одежду священника. «Одежды» сохраняет достойный ритуальный регистр.
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: и наденет другие
  rationale: לבש обозначает надевание одежды, а אחרים — другую одежду, отличную от снятой. В русском повтор слова «одежды» не требуется.
- source_word: וְהוֹצִיא
  choice: вынесет
  rationale: Порода хифиль глагола יצא означает вынести или удалить наружу. «Вынесет» конкретно и естественно описывает перемещение золы за стан.
- source_word: הַדֶּשֶׁן
  choice: золу
  rationale: В данном предписании דשן обозначает золу и остатки всесожжения на жертвеннике. Русское собирательное существительное «зола» соответствует контексту.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Выражение указывает на движение наружу, за границу лагеря. «Стан» сохраняет принятую библейскую лексику и остаётся понятным современному читателю.
- source_word: אֶל מָקוֹם טָהוֹר
  choice: на чистое место
  rationale: טָהוֹר в левитском контексте относится к ритуальной чистоте. Прямое «чистое» сохраняет категорию исходного текста, не перегружая основной текст пояснением.
theological_decisions:
- issue: Ритуальный смысл טָהוֹר
  choice: чистое место
  alternative: ритуально чистое место; незагрязнённое место
  rationale: Перевод «чистое место» сохраняет краткость и категориальный язык Левита. Ритуальный смысл пояснён в сноске, а не встроен в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром. Слово «стан» выбрано как понятный традиционный термин для лагеря Израиля; синтаксис сохраняет последовательность ритуальных действий без искусственной архаизации.
