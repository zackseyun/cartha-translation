lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в повествовательной формуле вводит прямую речь; «сказал» естественно и точно звучит в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, не заменяя его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: двоеточие после «сказал Моисею»
  rationale: Инфинитивная формула вводит последующую прямую речь; в современном русском её функцию естественно передаёт двоеточие, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Форма «Яхве» прямо сохраняет его как имя; традиционная замена «Господь» отражает практику чтения, а «Иегова» представляет более позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык. Сохранена краткая и торжественная формула введения божественной речи; לֵאמֹר передано русской пунктуацией, а не буквальным причастием.
