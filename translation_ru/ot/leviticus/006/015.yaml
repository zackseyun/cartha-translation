  rationale: 'Исправлено значение לַיהוה: «для Господа» вместо «пред Господом». «Вечное установление» ближе к חק עולם, а менее сильный по длительности вариант сохранён в сноске. Переформулирована заключительная часть, чтобы отразить культово-технический смысл קטר и сохранить указание на полное воскурение.'
