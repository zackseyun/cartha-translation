base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: ru
  text: 'И помазанный священник из числа его сыновей, который станет его преемником[a], должен приготовить это. Это — вечное установление для Господа[b]: всё приношение должно быть целиком воскурено[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вместо него» или «под ним».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «постоянное установление».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «целиком должно быть воскурено»; то есть приношение полностью сжигается на жертвеннике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: помазанный священник
  rationale: Сохраняет культовое обозначение священника, помазанного для служения, не придавая выражению мессианского смысла.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: из числа его сыновей, который станет его преемником
  rationale: Передаёт происхождение преемника из сыновей действующего священника и контекстуальный смысл תַּחְתָּיו — занятие его места.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: должен приготовить это
  rationale: Глагол עשה имеет широкое значение «делать»; в данном обрядовом контексте «приготовить» естественно передаёт предписанное действие, не уточняя его сверх исходного текста.
- source_word: חָק עוֹלָם
  choice: постоянное установление
  rationale: Современная и понятная передача непреходящей обязательности постановления без архаического оттенка.
- source_word: לַיהוָה
  choice: пред Господом
  rationale: Имя יהוה передано традиционным русским «Господь»; предлоговая формула понимается как установление, действующее перед Господом и в отношении служения Ему.
- source_word: כָּלִיל תָּקְטָר
  choice: всё приношение целиком должно быть обращено в дым
  rationale: Передаёт полное сожжение приношения на жертвеннике и специфический смысл каузативной формы קטר — превращение жертвы в дым.
theological_decisions:
- issue: Кого обозначает «помазанный священник»
  choice: Священника, помазанного для должности и наследующего служение, то есть преемника первосвященника
  alternative: Любого помазанного священника или мессианскую фигуру
  rationale: Контекст священнического служения и слова о преемнике из числа сыновей указывают на наследуемую священническую должность, а не на мессианский титул.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская передача сохраняет благоговейную практику замещения тетраграмматона титулом; написание с прописной буквы обозначает божественное имя в контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном, уместным для законодательного и богослужебного текста. Формулировки избегают как архаизмов, так и разговорности; неоднозначность תַּחְתָּיו и חָק עוֹלָם отмечена в сносках.
