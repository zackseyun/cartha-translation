  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: ru
  text: Глиняный сосуд, в котором она варилась, должен быть разбит. Если же она варилась в медном сосуде[a], его следует тщательно вычистить и ополоснуть водой.
