    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: глиняный сосуд
  rationale: Сочетание обозначает сосуд из обожжённой глины; этот естественный русский эквивалент сохраняет важное для предписания различие материалов.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: варилось мясо
  rationale: В данном жертвенном контексте בשׁל означает приготовление посредством варки. Слово «мясо» явно восстанавливает подразумеваемый объект из ближайшего контекста и делает русский текст естественным.
- source_word: יִשָּׁבֵר
  choice: должен быть разбит
  rationale: Нифаль imperfect в законодательном контексте выражает обязательное предписание; эта формулировка ясна и современна.
- source_word: כְלִי נְחֹשֶׁת
  choice: медный сосуд
  rationale: נְחֹשֶׁת может обозначать медь или бронзу. «Медный» — естественный русский вариант, а реальная лексическая неоднозначность сохранена в сноске.
- source_word: וּמֹרַק
  choice: следует тщательно вычистить
  rationale: מרק передаёт интенсивное очищение трением; «тщательно вычистить» понятно современному читателю и не предполагает простого полирования.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: и ополоснуть водой
  rationale: שטף указывает на промывание или ополаскивание водой и описывает отдельное действие после тщательной чистки.
