base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: ru
  text: Оставшуюся часть приношения должны есть Аарон и его сыновья[a]. Её следует есть без закваски[b] в святом месте[c]; должны есть её во дворе Шатра Встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаток от него»; речь идёт об оставшейся части хлебного приношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пресной». Еврейское выражение указывает, что приношение едят в пресном виде.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в святом месте», а не «в Святом месте»; следующая часть стиха уточняет, что это двор Шатра Встречи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: Оставшуюся часть приношения
  rationale: Субстантивированное причастие женского рода обозначает остаток хлебного приношения. Явное «приношения» естественно по-русски и сохраняет связь с контекстом.
- source_word: יֹאכְלוּ
  choice: пусть едят
  rationale: Имперфект в законодательном контексте выражает предписание; конструкция с «пусть» передаёт обязательный характер без архаичного оттенка.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Аарон и его сыновья
  rationale: Здесь имеются в виду сыновья Аарона, исполняющие священническое служение.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: Её следует есть без закваски
  rationale: Форма מַצּוֹת указывает, что приношение должно быть съедено в пресном виде; перевод не добавляет конкретной формы выпечки.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: на святом месте
  rationale: В еврейском слово «место» не имеет артикля; последующая фраза уточняет, что имеется в виду двор Шатра встречи.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: во дворе Шатра встречи
  rationale: Перевод сохраняет образ ограждённого двора и традиционно понятное буквальное название святилища.
- source_word: יֹאכְלוּהָ
  choice: пусть едят её
  rationale: Повтор предписания сохранён, поскольку еврейский текст вновь называет действие и добавляет место его исполнения.
