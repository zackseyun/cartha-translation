source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: ru
  text: Всё, что прикоснётся к её плоти, станет святым. Если же одежда будет забрызгана её кровью[a], вымой одежду, на которую попала кровь, в святом месте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежда будет окроплена её кровью». Еврейский глагол может обозначать ритуальное кропление; «будет забрызгана» передаёт попадание крови на одежду, которую затем следует вымыть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Всё, что
  rationale: Неопределённо-обобщающая конструкция охватывает всякого человека или любой предмет, соприкоснувшийся с жертвой; русское «всё, что» естественно сохраняет широту выражения.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: прикоснётся к её плоти
  rationale: «Плоть» непосредственно передаёт בָּשָׂר и сохраняет конкретную жертвенную лексику; местоимение женского рода соответствует суффиксу, относящемуся к жертве за грех.
- source_word: יִקְדָּשׁ
  choice: станет святым
  rationale: Форма обозначает обретение священного статуса вследствие соприкосновения; перевод не подразумевает отдельного обряда посвящения и не превращает культовую святость в нравственную.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: Если же её кровь брызнет
  rationale: В данном контексте глагол указывает на попадание крови на одежду. «Брызнет» естественно описывает это действие, при этом возможный специальный смысл ритуального кропления сохранён в сноске.
- source_word: עַל הַבֶּגֶד
  choice: на одежду
  rationale: Единственное число употреблено обобщённо, как обычно в правовом предписании; «одежда» звучит в современном русском естественнее, чем «одеяние».
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: ту часть одежды, на которую попала кровь
  rationale: Так ясно выражена отсылка к месту попадания крови на одежде. Добавление «часть одежды» делает подразумеваемый объект стирки понятным, не меняя требования текста.
- source_word: תְּכַבֵּס
  choice: вымой
  rationale: Повелительная форма второго лица единственного числа сохраняет прямое предписание ответственному служителю; «вымой» подходит для очищения одежды и звучит естественно.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: в святом месте
  rationale: У существительного нет артикля, поэтому перевод не отождествляет это место с каким-либо одним конкретным отделением святилища.
theological_decisions:
- issue: Святость, приобретаемая через соприкосновение с плотью жертвы за грех
  choice: Соприкоснувшееся с жертвой становится святым, то есть получает особый культовый статус.
  alternative: Соприкоснувшееся лишь ограничивается священным употреблением, без формулировки «становится святым».
  rationale: «Станет святым» сохраняет прямой смысл יִקְדָּשׁ и богословское напряжение текста, тогда как контекст позволяет понимать эту святость как обрядовую, а не как внутреннее нравственное преображение.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной правовой формулировкой. Сохранены второе лицо единственного числа и культовая лексика «плоть», «святой»; технический ритуальный оттенок не перегружен архаизмами.
