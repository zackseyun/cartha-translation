  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: ru
  text: Священник пусть наденет свою льняную одежду и льняное нижнее одеяние на своё тело[b], затем уберёт пепел от всесожжения, которое огонь поглотил на жертвеннике[a], и положит его возле жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «пепел, который огонь поглотит от всесожжения». Еврейское выражение кратко и допускает несколько близких вариантов перевода.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на плоть свою».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: свою льняную одежду
  rationale: В контексте священнического облачения מִדּוֹ обозначает предмет одежды, а בַד указывает на лён; общее «одежда» не уточняет крой сверх данных текста.
- source_word: מִכְנְסֵי בַד
  choice: льняное нижнее платье
  rationale: Речь о льняной одежде для нижней части тела, надеваемой непосредственно на тело; формулировка современна и сохраняет ритуальную функцию предмета.
- source_word: עַל בְּשָׂרוֹ
  choice: на тело своё
  rationale: Буквально «на свою плоть»; «на тело своё» естественно по-русски и сохраняет указание на непосредственное ношение.
- source_word: וְהֵרִים
  choice: уберёт
  rationale: Хотя глагол буквально означает «поднимет», в данной ритуальной процедуре имеется в виду удаление пепла с жертвенника.
- source_word: הַדֶּשֶׁן
  choice: пепел
  rationale: В жертвенном контексте слово обозначает остаток сгоревшей жертвы; русское «пепел» ясно передаёт этот смысл.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: в который огонь превратил всесожжение
  rationale: Еврейская конструкция компактна и буквально говорит о том, что огонь «съел/поглотил» всесожжение. Перевод ясно связывает пепел с результатом сгорания, не устраняя неоднозначность без примечания.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: возле жертвенника
  rationale: Передаёт пространственную близость, выраженную אֵצֶל, естественным современным русским языком.
