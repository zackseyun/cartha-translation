  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: ru
  text: Огонь на жертвеннике должен гореть непрестанно; он не должен угасать. Каждое утро[a] священник должен подкладывать в огонь дрова, раскладывать на нём всесожжение и сжигать на нём жирные части мирных жертв[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «утро за утром». Повтор слова «утро» передаёт распределительное значение: действие совершается каждое утро.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертв благополучия»; также возможно: «жертв общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: должен гореть непрестанно
  rationale: Форма глагола указывает на поддержание огня в горящем состоянии. Такой перевод естественно передаёт длительное культовое требование, не сводя смысл к простому утверждению, что огонь горит.
- source_word: בּוֹ
  choice: на жертвеннике
  rationale: Предлог относится к жертвеннику; в русском языке огонь естественно описывается как горящий на жертвеннике.
- source_word: לֹא תִכְבֶּה
  choice: он не должен угасать
  rationale: Передаёт требование непрерывности огня современным и ясным русским языком.
- source_word: וּבִעֵר ... עֵצִים
  choice: должен подкладывать в огонь дрова
  rationale: В данном контексте речь не о разжигании нового огня, а о его ежедневном поддержании добавлением дров. Перевод передаёт действие естественно, не меняя ритуального смысла.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: каждое утро
  rationale: Повтор существительного имеет распределительное значение и указывает на ежедневное действие.
- source_word: וְעָרַךְ
  choice: раскладывать
  rationale: Глагол обозначает упорядоченное размещение жертвы на жертвеннике; «раскладывать» сохраняет ритуальный и пространственный смысл.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Это устоявшееся русское обозначение жертвы, целиком сжигаемой на жертвеннике, и оно ясно сохраняет отдельную категорию жертвоприношения.
- source_word: וְהִקְטִיר
  choice: сжигать
  rationale: В жертвенном контексте глагол означает предавать огню на жертвеннике, так что жертва восходит в дыме. «Сжигать» понятно современному читателю и не требует архаичного «воскурять».
- source_word: חֶלְבֵי
  choice: жирные части
  rationale: Речь идёт именно о предназначенных для сожжения частях жира, а не метафорически о лучших частях.
- source_word: הַשְּׁלָמִים
  choice: мирные жертвы
  rationale: Устоявшийся русский термин сохраняет узнаваемость данной жертвенной категории; возможные значения благополучия и общения отмечены в сноске.
theological_decisions:
- issue: Передача терминов жертвоприношения
  choice: Использованы традиционные и понятные термины «всесожжение» и «мирные жертвы», при этом ритуальные действия названы прямо.
  alternative: 'Более этимологические варианты: «жертва восхождения», «жертвы благополучия» или «жертвы общения».'
  rationale: Стих содержит культовое предписание, поэтому важно сохранить различимость жертвенных категорий, не добавляя к ним конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Архаизмы сведены к минимуму; устоявшийся библейский термин «всесожжение» сохранён ради точного обозначения жертвенной категории. Все сноски поставлены непосредственно после соответствующих выражений.
