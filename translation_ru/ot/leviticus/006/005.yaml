  source_fidelity: 'Перевод точно передаёт предписание: огонь на жертвеннике поддерживается горящим и не должен угасать; священник ежедневно добавляет дрова, располагает всесожжение и сжигает жирные части мирных жертв. «Каждое утро» корректно передаёт распределительное повторение בַּבֹּקֶר בַּבֹּקֶר. Местоименные связи («на нём», «в огонь») ясны в контексте жертвенника и соответствуют ритуальному действию.'
  naturalness: Текст звучит естественно на современном литературном русском, сохраняя сдержанный нормативный регистр. «Подкладывать в огонь дрова» — идиоматичное и контекстуально точное выражение; «всесожжение» и «мирные жертвы» уместны как устоявшиеся специальные термины.
  terminology: «Всесожжение» точно различает עֹלָה как жертвенную категорию, а «мирные жертвы» — признанный нейтральный эквивалент שְׁלָמִים. «Жирные части» адекватно передаёт חֶלְבֵי как части жира, предназначенные для сожжения, без неоправданного истолкования. Сноска b корректно отмечает допустимые терминологические альтернативы.
