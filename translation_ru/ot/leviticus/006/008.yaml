  source_fidelity: 'Смысл в целом передан точно: берутся часть тонкой муки и масла, весь ладан, а затем на жертвеннике сжигается мемориальная доля. Однако «мелкая мука» в современном русском двусмысленно (может означать малое количество), тогда как סֹלֶת обозначает муку тонкого помола. Формулу רֵיחַ נִיחֹחַ естественнее передать предложной конструкцией «в благоухание, приятное Яхве».'
