id: LEV.6.8
reference: Leviticus 6:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: ru
  text: Пусть он возьмёт из него горсть муки тонкого помола от хлебного приношения и часть его масла[a], а также весь ладан, который находится на хлебном приношении, и сожжёт на жертвеннике памятную часть приношения[b] в благоухание, приятное Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднимет из него, взяв горсть». Сочетание еврейских глагола и существительного подчёркивает, что из приношения берут предназначенную для этого горсть.'
    reason: lexical_alternative
  - marker: b
    text: «Памятная часть» — специальное название представляющей всё хлебное приношение доли, которую сжигали на жертвеннике.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: возьмёт из него горсть
  rationale: Передаёт извлечение установленной части приношения и естественно выражает количество, захватываемое рукой; оттенок поднятия здесь подчинён культовому значению изъятия доли.
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: мелкой муки хлебного приношения
  rationale: סֹלֶת обозначает тонко смолотую муку, а מִנְחָה в данном культовом контексте — хлебное, то есть растительное, приношение.
- source_word: וּמִשַּׁמְנָהּ
  choice: и часть его масла
  rationale: 'Повторный предлог מִן имеет частичное значение: берётся некоторое количество масла, в отличие от всего ладана.'
- source_word: וְאֵת כָּל הַלְּבֹנָה
  choice: а также весь ладан
  rationale: לְבֹנָה — именно ладан, не благовоние вообще; כָּל подчёркивает, что используется весь ладан.
- source_word: וְהִקְטִיר הַמִּזְבֵּחַ
  choice: сожжёт на жертвеннике
  rationale: В жертвенном контексте глагол означает сожжение приношения на жертвеннике; русский оборот ясен и сохраняет культовый смысл.
- source_word: אַזְכָּרָתָהּ
  choice: памятную часть приношения
  rationale: Технический термин обозначает представляющую всё приношение долю, которую сжигали на жертвеннике; добавление «приношения» устраняет неясность местоименной связи.
- source_word: רֵיחַ נִיחֹחַ
  choice: как благоухание, приятное
  rationale: Сохраняет образ запаха и идею благосклонного принятия, не сводя выражение к буквальному удовольствию от запаха.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное заветное имя יהוה передано транслитерацией, а дательный падеж естественно выражает направленность и угодность приношения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет Тетраграмматон; «Яхве» сохраняет личное заветное имя и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Смысл выражения רֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  alternative: успокоительное благоухание; приятный запах
  rationale: Выбранная формулировка сохраняет культовый образ и указывает на принятие приношения Богом, не навязывая механистического понимания жертвы.
- issue: Значение אַזְכָּרָה
  choice: памятная часть приношения
  alternative: часть в напоминание; поминальная жертва
  rationale: Сохранён технический и намеренно не до конца раскрытый смысл термина без уточнения, кого или о чём эта часть должна напоминать.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Культовые термины переданы последовательно и понятно; архаизмы и конфессионально окрашенные уточнения исключены.
