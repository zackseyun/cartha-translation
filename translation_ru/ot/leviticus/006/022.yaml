translation:
  language: ru
  text: Каждый мужчина из числа священников может есть её; это величайшая святыня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «святыня святынь» — еврейский способ выразить наивысшую степень святости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: всякий мужчина
  rationale: Сочетание с существительным в единственном числе имеет распределительное значение. «Мужчина» естественно передаёт здесь принадлежность к мужскому полу, не заменяя её более общим словом «человек».
- source_word: בַּכֹּהֲנִים
  choice: из священников
  rationale: 'Предлог בְּ обозначает принадлежность к группе: речь идёт о всяком мужчине, принадлежащем к числу священников.'
- source_word: יֹאכַל
  choice: может есть
  rationale: В данном правовом контексте имперфект выражает разрешённое, установленное действие, а не обязательное повеление каждому священнику.
- source_word: אֹתָהּ
  choice: её
  rationale: Местоимение женского рода отсылает к жертве или приношению, упомянутому в контексте; русский язык позволяет сохранить это согласование без поясняющего добавления.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Еврейское сочетание «святыня святынь» является способом выражения превосходной степени и обозначает предмет наивысшей святости. «Великая святыня» естественно и традиционно передаёт этот культовый термин по-русски.
- source_word: הִוא
  choice: это
  rationale: Самостоятельное местоименное предложение естественно передано по-русски указательным «это» со сказуемым «великая святыня».
theological_decisions:
- issue: Характер действия, выраженного יֹאכַל
  choice: 'разрешение: «может есть»'
  alternative: 'предписание: «пусть ест» или «будет есть»'
  rationale: Контекст устанавливает круг лиц, которым дозволено есть святыню, а не обязывает каждого священника мужского пола участвовать в еде.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Сохранён культовый термин «святыня», а буквальная форма еврейской превосходной степени вынесена в примечание.
