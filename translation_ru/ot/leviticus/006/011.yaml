  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: ru
  text: Всякий мужчина из сыновей Аарона может есть её. Это вечное установление на все ваши поколения, касающееся доли от огненных приношений Яхве. Всё, что прикоснётся к ним, станет святым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет освящено». Еврейский текст может говорить о приобретении святости через соприкосновение; некоторые понимают эту фразу более ограничительно: прикасаться к этим приношениям может лишь то, что уже свято.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  choice: всякий мужчина
  rationale: Передаёт распределительное значение выражения и точно обозначает мужской пол в контексте допуска к священнической пище.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: из сынов Аарона
  rationale: Сохраняет устойчивое священническое обозначение и не расширяет его до более общего «потомков».
- source_word: יֹאכֲלֶנָּה
  choice: может есть её
  rationale: В данном законодательном контексте форма выражает разрешённое право участвовать в жертвенной пище; местоимение женского рода отсылает к хлебному приношению из предыдущего контекста.
- source_word: חָק עוֹלָם
  choice: вечное установление
  rationale: Передаёт постоянную обязательную норму. Контекст допускает оттенок установленной доли, но формулировка «установление» не сужает смысл только до материального удела.
- source_word: לְדֹרֹתֵיכֶם
  choice: для всех ваших поколений
  rationale: Естественно передаёт действие предписания в последовательных поколениях.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: относительно огненных приношений Яхве
  rationale: אִשֶּׁה обозначает жертвенное приношение, связанное с огнём жертвенника; такая передача сохраняет культовый образ и связь установления с этими приношениями.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: всё, что прикоснётся к ним
  rationale: Сохраняет широту еврейской конструкции, которая прямо не уточняет, идёт ли речь о человеке или предмете.
- source_word: יִקְדָּשׁ
  choice: станет святым
  rationale: Передаёт результирующее изменение состояния вследствие соприкосновения, не сводя глагол к простому разрешению приближаться.
theological_decisions:
- issue: Смысл перехода святости в заключительной части стиха
  choice: Соприкосновение с этими святыми приношениями приводит соприкоснувшееся с ними к состоянию святости.
  alternative: Только уже освящённое может прикасаться к ним; либо прикоснувшееся посвящается и подпадает под связанные со святыней требования.
  rationale: Последовательность «прикоснётся — станет святым» естественнее всего выражает результат соприкосновения. Сноска сохраняет возможное ограничительное понимание и не устраняет напряжение, присущее культовому понятию святости.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного культового текста. Синтаксис сделан ясным для обычного читателя; сохранены термины «огненные приношения», «установление» и личное имя «Яхве».
