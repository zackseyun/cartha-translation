  - severity: low
    issue: Синтаксис средней фразы недостаточно естественен для современного русского.
    rationale: «Для всех ваших поколений относительно…» канцелярски тяжеловесно. Перестройка сохраняет законодательный регистр и делает отношение к жертвенной доле ясным.
