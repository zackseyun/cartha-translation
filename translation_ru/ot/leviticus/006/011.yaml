review_pass:
  verdict: revise
  source_fidelity: 'Начальная и заключительная части переданы по существу верно: сохраняются круг допущенных к вкушению («всякий мужчина из сыновей Аарона»), право есть от приношения и широкий субъект заключительной формулы. Однако «относительно огненных приношений» ослабляет и несколько меняет связь מֵאִשֵּׁי יהוה: речь идёт о доле/предписании, относящемся к приношениям Яхве, а предлог «из/от» следует отразить яснее.'
  naturalness: «Всякий мужчина из сынов Аарона» понятен, но сочетание «сынов Аарона» в современном литературном русском менее естественно, чем «сыновей Аарона». Оборот «для всех ваших поколений относительно» тяжеловесен; «на все ваши поколения, касающееся доли от…» яснее и естественнее в законодательном регистре.
  terminology: «Яхве», «огненные приношения» и «станет святым» приемлемы. Добавление «доли» в средней фразе делает понятной связь с жертвенными приношениями и не меняет смысла предписания; חֹק в этом контексте допускает смысл установленной доли наряду с устойчивым значением установления. Сноска корректно сохраняет спорность заключительной формулы.
  issues:
