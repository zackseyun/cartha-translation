id: LEV.6.7
reference: Leviticus 6:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: ru
  text: 'Вот закон[a] о хлебном приношении: сыновья Аарона должны поднести его пред Яхве, перед жертвенником.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление»; или: «установление».'
    reason: Лексема תּוֹרָה здесь обозначает предписанный порядок жертвоприношения и допускает эти смысловые оттенки.
lexical_decisions:
- source_word: וְזֹאת
  choice: Вот
  rationale: Сочетание союза с указательным местоимением вводит новый раздел предписаний; русское «Вот» естественно выполняет эту функцию без тяжеловесного «И вот».
- source_word: תּוֹרַת
  choice: закон
  rationale: В данном жертвенном установлении слово обозначает обязательное предписание о порядке обряда. «Закон» сохраняет юридико-культовый характер, а возможные оттенки отмечены в сноске.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В контексте Левита מִנְחָה обозначает приношение из муки или зерновых продуктов, а не дар вообще. «Хлебное приношение» — понятный и укоренившийся русский библейский термин.
- source_word: הַקְרֵב אֹתָהּ
  choice: должны поднести его
  rationale: Форма выражает обрядовое предписание о приближении и представлении дара. «Поднести» сохраняет пространственно-культовый смысл корня קרב, а «должны» ясно передаёт предписывающую силу конструкции.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновья Аарона
  rationale: Формально близкое выражение сохраняет родовое обозначение священников в книге Левит.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Выражение указывает на совершение действия в присутствии Бога; «пред» кратко и достойно передаёт этот культовый оборот.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет явное присутствие Божьего имени в еврейском тексте.
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: перед жертвенником
  rationale: Оборот обозначает конкретное пространственное положение у передней стороны жертвенника. Отличная от «пред Яхве» формулировка не смешивает богословское и пространственное отношения.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как собственное имя. «Яхве» непосредственно передаёт это имя и не заменяет его титулом.
- issue: Значение תּוֹרָה в жертвенном законодательстве
  choice: закон
  alternative: наставление; установление
  rationale: «Закон» сохраняет обязательный характер предписания, тогда как сноска открыто указывает на более широкий смысл слова и не сводит его только к современному юридическому понятию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Формулировка краткая и ясная; архаизирующее «пред» сохранено только в устойчивом обороте о Божьем присутствии, тогда как пространственное указание передано обычным «перед».
