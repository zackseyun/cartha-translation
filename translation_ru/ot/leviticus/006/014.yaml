source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: ru
  text: Её следует приготовить на сковороде с маслом[a] и хорошо замесить; затем принеси её. Испечённое[b] хлебное приношение, разделённое на куски, преподнеси как приятное Яхве благоухание[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в масле».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переданное как «испечённое», редко; оно может обозначать испечённое или приготовленное на сковороде.
    reason: lexical_alternative
  - marker: c
    text: «Приятное Яхве благоухание» — устойчивая жертвенная формула, указывающая, что приношение угодно Богу.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: сковорода
  rationale: Слово обозначает плоскую металлическую посуду для приготовления хлебного приношения; «сковорода» — естественный и понятный русский эквивалент.
- source_word: בַּשֶּׁמֶן
  choice: с маслом
  rationale: Предлог ב допускает значения «в» и «с»; в русском описании приготовления «с маслом» естественно передаёт инструментально-средственный смысл, не исключая понимания «в масле».
- source_word: תֵּעָשֶׂה
  choice: следует приготовить
  rationale: Пассивная форма עשה предписывает приготовление приношения; безличная конструкция сохраняет нормативный характер и звучит естественно по-русски.
- source_word: מֻרְבֶּכֶת
  choice: хорошо перемешав
  rationale: Редкая форма, по-видимому, описывает тщательное смешивание или замешивание с маслом. Перевод сохраняет вероятный кулинарный смысл, а неопределённость отмечается в сноске.
- source_word: תְּבִיאֶנָּה
  choice: принеси её
  rationale: Глагол буквально означает «принести», а женский суффикс относится к хлебному приношению.
- source_word: תֻּפִינֵי
  choice: испечёнными кусками
  rationale: Редкое кулинарное слово связано с выпеканием; в сочетании с последующим פִּתִּים перевод указывает на выпеченные части, не утверждая точного способа приготовления.
- source_word: מִנְחַת
  choice: хлебное приношение
  rationale: В левитском контексте מִנְחָה обозначает приношение из муки или зерна. «Хлебное приношение» сохраняет его культовую специфику и привычно для современного русского библейского языка.
- source_word: פִּתִּים
  choice: разделённое на части
  rationale: Существительное обозначает куски или части; формулировка передаёт, что приготовленное приношение подаётся разделённым.
- source_word: תַּקְרִיב
  choice: преподнеси
  rationale: В породе hифиль קרב в жертвенном контексте означает поднести или представить приношение. «Преподнеси» сохраняет культовую торжественность и не повторяет «принеси».
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Устойчивая жертвенная формула выражает угодность приношения Богу. «Благоухание, приятное» сохраняет образ запаха и богословскую функцию формулы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה транслитерацией «Яхве», а не заменено титулом, что сохраняет присутствующее в исходном тексте имя Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Исходный текст содержит тетраграмматон как личное заветное имя. «Яхве» прямо передаёт это имя, тогда как «Господь» является традиционной заменой-титулом.
- issue: Смысл формулы רֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  alternative: успокоительное благоухание для Яхве
  rationale: Выбранная формулировка сохраняет образ и указывает на принятие жертвы, но не навязывает спорное буквальное представление о том, что запах успокаивает Бога.
- issue: Синтаксическая связь רֵיחַ נִיחֹחַ с приношением
  choice: преподнеси как благоухание
  alternative: преподнеси в благоухание
  rationale: «Как благоухание» естественно связывает жертвенное действие с последующей формулой приемлемости, не превращая её в отдельный предмет приношения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным культовым регистром. Синтаксис разделён на два предложения ради ясности сложной еврейской последовательности; редкая кулинарная терминология не конкретизирована сверх данных источника.
