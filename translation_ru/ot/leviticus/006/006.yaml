- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Стандартная пространственная и культовая формулировка; определённость понятна из контекста.
- source_word: לֹא תִכְבֶּה
  choice: не должен угасать
  rationale: Сохраняет отрицательное предписание и непереходное значение глагола — огонь не угасает.
