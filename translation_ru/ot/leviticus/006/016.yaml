  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: ru
  text: И всякое хлебное приношение священника должно быть сожжено целиком[a]; его нельзя есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «должно быть целым». Еврейское слово означает нечто полное, целиком отданное; применительно к жертве здесь имеется в виду, что всё приношение сжигается и ничего из него не едят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: И всякое
  rationale: 'Союз וְ продолжает ряд предписаний, а כָּל при существительном в единственном числе имеет распределительное значение: «всякое».'
- source_word: מִנְחַת
  choice: хлебное приношение
  rationale: В книге Левит מִנְחָה — установленное обозначение приношения из продуктов земледелия. «Хлебное приношение» сохраняет привычный жертвенный термин и не сужает его до приношения только зерна.
- source_word: כֹּהֵן
  choice: священника
  rationale: Сопряжённая конструкция מִנְחַת כֹּהֵן означает приношение, совершаемое священником или принадлежащее ему как приносящему; русский родительный падеж сохраняет эту лаконичность.
- source_word: כָּלִיל תִּהְיֶה
  choice: должно быть сожжено целиком
  rationale: כָּלִיל означает «целое, полностью отданное» и в жертвенном контексте указывает, что всё приношение предаётся огню. Русская формулировка естественно передаёт практический смысл, хотя глагол «сжечь» в этой фразе подразумевается контекстом.
- source_word: לֹא תֵאָכֵל
  choice: его нельзя есть
  rationale: 'Страдательная форма выражает запрет: приношение не должно употребляться в пищу. «Его нельзя есть» естественно и ясно передаёт эту норму по-русски.'
theological_decisions:
- issue: Полная передача священнического приношения
  choice: Не уточнять, кто именно мог бы есть приношение, и передать только полный запрет на его употребление в пищу.
  alternative: 'Добавить: «никто не должен его есть» или «священник не должен его есть».'
  rationale: Еврейский текст употребляет безличную страдательную конструкцию и не называет возможного едока; такое уточнение неоправданно сузило бы запрет.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным юридико-ритуальным звучанием. Формула «должно быть» передаёт предписывающую силу древнееврейской глагольной формы, а «его нельзя есть» звучит естественнее буквального пассива.
