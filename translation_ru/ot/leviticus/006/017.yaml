lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: В этой устойчивой формуле введения прямой речи глагол דבר естественно передаётся по-русски как «сказал»; союз «и» сохраняет повествовательную связь, не добавляя явно выраженного значения последовательности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного сочетанием предлога אֶל с именем Моисея.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: В формуле перед прямой речью русский синтаксис естественно передаёт לֵאמֹר двоеточием; буквальное «говоря» здесь было бы неестественным и избыточным.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя. «Яхве» сохраняет это имя, тогда как «Господь» заменяет его титулом, а «Иегова» отражает более позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формула введения речи. Двоеточие предполагает продолжение прямой речи в следующем стихе.
