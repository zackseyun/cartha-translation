id: LEV.6.2
reference: Leviticus 6:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: ru
  text: 'Повели Аарону и его сыновьям: «Вот закон[a] о всесожжении: само всесожжение должно оставаться на месте горения[b] на жертвеннике всю ночь до утра, и огонь жертвенника должен поддерживаться на нём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот наставление о всесожжении».'
    reason: lexical_alternative
  - marker: b
    text: То есть на очаге, или на месте, где сжигается жертва.
    reason: lexical_clarification
lexical_decisions:
- source_word: צַו
  choice: Повели
  rationale: Императив выражает прямое властное распоряжение; «повели» сохраняет его силу и соответствует возвышенному законодательному контексту.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: Аарону и его сыновьям
  rationale: Контекст относится к Аарону и его сыновьям-священникам; дательный падеж естественен после русского «повели».
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Русская конструкция с двоеточием естественно передаёт функцию еврейского инфинитива, вводящего прямую речь, без тяжеловесного «сказав».
- source_word: זֹאת תּוֹרַת
  choice: Вот закон о
  rationale: В данном жертвенном предписании תּוֹרָה обозначает установленное правило. «Закон» сохраняет формально-правовой тон; допустимый оттенок «наставление» отмечен в сноске.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике; он точнее и естественнее буквального «жертва возношения».
- source_word: הִוא הָעֹלָה
  choice: само всесожжение
  rationale: Повтор существительного с местоимением имеет выделительную силу; «само» передаёт акцент без неестественного буквального синтаксиса.
- source_word: עַל מוֹקְדָה
  choice: должно оставаться на месте горения
  rationale: Редкое מוֹקְדָה обозначает место, где горит жертва, или очаг. Добавление «должно оставаться» естественно выражает продолжающееся пребывание жертвы там в течение ночи.
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Прямое и традиционное обозначение места принесения жертвы.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: всю ночь до утра
  rationale: Точно и естественно передаёт временную протяжённость предписания.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: и огонь жертвенника должен поддерживаться на нём
  rationale: Форма תּוּקַד указывает не просто на горение, а на поддержание огня. «На нём» сохраняет местоименный суффикс בּוֹ и в русском контексте естественно относится к жертвеннику.
theological_decisions:
- issue: Значение תּוֹרָה в жертвенном законодательстве
  choice: закон
  alternative: наставление; предписание
  rationale: «Закон» сохраняет формальный характер культового установления, но здесь слово не обязательно обозначает всю Тору как единое каноническое целое. Лексическая широта отмечена в сноске.
- issue: Характер требования об огне на жертвеннике
  choice: должен поддерживаться
  alternative: должен гореть
  rationale: Еврейская глагольная форма представляет поддержание огня как предписание, а не только констатирует, что огонь горит.
- issue: Референт местоименного суффикса בּוֹ
  choice: на нём — на жертвеннике
  alternative: на месте горения; на всесожжении
  rationale: Ближайший грамматически подходящий и контекстуально естественный референт — жертвенник. Местоименная форма сохранена, не перегружая основной текст пояснением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным законодательным тоном. Традиционные культовые термины «всесожжение» и «жертвенник» сохранены ради точности и узнаваемости; синтаксис упрощён до естественной русской прямой речи.
