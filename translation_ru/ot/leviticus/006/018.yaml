base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: ru
  text: 'Скажи Аарону и его сыновьям: «Вот закон о жертве за грех[a]: в том месте, где закалывают жертву всесожжения, жертву за грех следует закалывать перед Яхве. Это великая святыня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об очистительной жертве». Еврейское слово חַטָּאת может обозначать как грех, так и связанную с очищением от него жертву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו לֵאמֹר
  choice: Скажи Аарону и его сыновьям
  rationale: Императив דבר передан естественной русской формулой прямого предписания; לֵאמֹר не воспроизводится отдельным деепричастием, поскольку двоеточие идиоматично вводит содержание речи.
- source_word: זֹאת תּוֹרַת הַחַטָּאת
  choice: Вот закон о жертве за грех
  rationale: תּוֹרָה здесь обозначает установленное правило жертвоприношения; «закон о» сохраняет законодательный регистр. חַטָּאת в данном контексте — название жертвы, а не отвлечённого греха.
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: на том месте, где закалывают жертву всесожжения
  rationale: Пассивная еврейская конструкция естественно передана русской неопределённо-личной; «закалывают» точно выражает жертвенный смысл שׁחט.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: пусть закалывают и жертву за грех
  rationale: Имперфект имеет предписывающее значение. Частица «и» ясно выражает совпадение места заклания, подразумеваемое параллельной конструкцией.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» сохраняет культовую формулу присутствия перед Богом, а личное имя יהוה передано как «Яхве».
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: Это великая святыня
  rationale: Конструкция «святыня святынь» выражает высшую степень святости; «великая святыня» — традиционное и понятное русское обозначение особо святой категории жертв.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное заветное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Значение חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Оба наименования отражают стороны функции жертвы. В основном тексте выбран узнаваемый термин «жертва за грех», а ритуально-очистительный оттенок сохранён в сноске.
- issue: Степень святости קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  alternative: святыня святынь / величайшая святыня
  rationale: Фраза обозначает высшую культовую категорию святости, а не отождествляет жертву со Святым святых как частью святилища.
translation_notes:
  register: Современный литературный русский с умеренно торжественным законодательным звучанием. Синтаксис упрощён там, где буквальное воспроизведение еврейской формулы было бы неестественно, при сохранении культовых терминов и структуры предписания.
