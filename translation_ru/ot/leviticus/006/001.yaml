  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится как «Господь».'
    reason: Указывает еврейскую форму Божьего имени и традиционный вариант её передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма с повествовательным וַ вводит следующий шаг повествования. Русское «И … сказал» естественно передаёт формулу введения речи; буквальное «и говорил» здесь звучало бы как указание на длительное или повторяющееся действие, которого еврейская форма не требует.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Предлог אֶל при глаголе речи естественно передаётся русским дательным падежом; מֹשֶׁה имеет общепринятую русскую форму «Моисей».
- source_word: לֵאמֹר
  choice: ':'
  rationale: В формуле введения прямой речи еврейское «говоря» в современном русском естественно выражается двоеточием, поскольку сама речь следует далее.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя YHWH. Форма «Яхве» сохраняет имя как имя; традиционная замена «Господь» указана в примечании, а «Иегова» отражает более позднее смешанное прочтение.
translation_notes:
  register: Современный литературный русский язык с краткой и достойной библейской формулой. Двоеточие вместо буквального «говоря» избегает архаизма и ясно вводит речь следующего стиха.
