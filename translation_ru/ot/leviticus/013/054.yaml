base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: ru
  text: Тогда священник велит выстирать то, на чём есть поражение[a], и снова изолирует это на семь дней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, в чём [находится] поражение». В данном контексте речь идёт об исследуемом предмете — одежде, ткани или коже; поэтому возможно также: «то, на чём есть поражение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «закроет это ещё на семь дней». Еврейский глагол означает держать взаперти или отдельно для наблюдения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Тогда ... велит
  rationale: Вав с перфектом продолжает последовательность предписаний; «тогда» естественно передаёт следующий этап процедуры, а настоящее-будущее «велит» соответствует русскому стилю нормативного текста.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное и контекстуально точное обозначение священнослужителя, проводящего осмотр.
- source_word: וְכִבְּסוּ
  choice: велит выстирать
  rationale: Форма 3-го лица множественного числа указывает на неназванных исполнителей. Конструкция с каузативным «велит» сохраняет это, не добавляя конкретного субъекта.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: то, на чём появилось поражение
  rationale: Местоименное «то» сохраняет намеренно широкую отсылку к исследуемому предмету; «на чём» естественно для поражения ткани или кожи в данном контексте.
- source_word: הַנָּגַע
  choice: поражение
  rationale: Слово подходит к видимому патологическому или оскверняющему явлению как на человеке, так и на предмете и не навязывает современного представления о микробной инфекции.
- source_word: וְהִסְגִּירוֹ
  choice: изолирует это
  rationale: Передаёт процедурное отделение предмета для последующего осмотра; буквальное «запрёт» по-русски могло бы неверно акцентировать способ хранения.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: снова ... на семь дней
  rationale: Естественно и ясно обозначает повторный семидневный срок изоляции.
