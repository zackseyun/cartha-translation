base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: ru
  text: 'На седьмой день священник осмотрит его. Если поражение действительно распространилось по коже, священник объявит его нечистым: это поражение, относящееся к кожной болезни[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционный перевод — «проказа». Еврейское слово обозначает более широкую категорию поражений, рассматриваемых в законах Израиля о ритуальной чистоте, и не обязательно означает современную проказу (болезнь Хансена).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: осмотрит его
  rationale: Глагол ראה буквально означает «видеть», но в данном священническом диагностическом контексте обозначает целенаправленный осмотр.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: на седьмой день
  rationale: Прямой и естественный перевод временного оборота.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: если поражение действительно распространилось
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; «действительно» передаёт это усиление естественно для русского языка.
- source_word: בָּעוֹר
  choice: по коже
  rationale: При русском глаголе «распространиться» этот вариант естественно передаёт распространение поражения на поверхности или в пределах кожи, не внося излишней медицинской точности.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: священник объявит его нечистым
  rationale: Священник выносит официальный ритуальный вердикт, а не делает человека нечистым причинно.
- source_word: נֶגַע
  choice: поражение
  rationale: В Левите 13 слово обозначает наблюдаемое поражение или болезненный знак; «поражение» сохраняет необходимую широту и подходит к контексту осмотра кожи.
- source_word: צָרַעַת
  choice: кожная болезнь
  rationale: Термин шире современной болезни Хансена и в данном контексте относится к состоянию кожи; традиционный вариант «проказа» указан в сноске.
- source_word: הִוא
  choice: это
  rationale: Местоимение отождествляет наблюдаемое поражение с названной категорией болезни.
theological_decisions:
- issue: Передача צָרַעַת в законах о ритуальной чистоте
  choice: кожная болезнь
  alternative: проказа
  rationale: Еврейский термин не тождествен современной болезни Хансена и охватывает более широкую категорию состояний. Основной текст избегает анахроничного медицинского отождествления, а традиционный перевод сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Формулировка «объявит его нечистым» подчёркивает официальный ритуальный вердикт; повтор слова «поражение» делает явным подразумеваемое подлежащее глагола «распространилось».
