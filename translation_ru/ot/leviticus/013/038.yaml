  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: ru
  text: Если у мужчины или женщины на коже тела появятся светлые пятна[a], белые пятна,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «яркие пятна».'
    reason: Еврейское слово может подчёркивать как светлый цвет, так и яркий вид пятен.
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: у мужчины или женщины
  rationale: Прямо сохранено упоминание обоих полов; форма соответствует казуистическому изложению закона.
- source_word: כִּי יִהְיֶה
  choice: если ... появятся
  rationale: В данном предписании כִּי вводит условный диагностический случай, а глагол естественно передаётся по-русски как появление пятен.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: на коже тела
  rationale: Сочетание обозначает кожу человеческого тела; такой перевод сохраняет телесную конкретность и звучит естественно в современном русском языке.
- source_word: בֶּהָרֹת
  choice: светлые пятна
  rationale: Существительное обозначает заметно светлые или яркие участки кожи; «светлые пятна» ясно передаёт смысл в диагностическом контексте.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: белые пятна
  rationale: Прилагательное уточняет цвет пятен. Повтор слова «пятна» сохранён вслед за еврейским текстом.
