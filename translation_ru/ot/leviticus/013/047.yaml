  text: וְ/הַ/בֶּ֕גֶד כִּֽי יִהְיֶ֥ה ב֖/וֹ נֶ֣גַע צָרָ֑עַת בְּ/בֶ֣גֶד צֶ֔מֶר א֖וֹ בְּ/בֶ֥גֶד פִּשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: ru
  text: Если на одежде появится поражение, называемое цараат[a], — будь то шерстяная или льняная одежда, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский термин «цараат» традиционно передают словом «проказа», однако здесь он обозначает более широкую категорию поражений или загрязнений, в том числе на одежде, а не только современную болезнь Хансена.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: одежда
  rationale: בגד обозначает предмет одежды. В казуистической норме русское неопределённо-обобщённое «на одежде» естественно передаёт типовой случай.
- source_word: כִּי יִהְיֶה בוֹ
  choice: если же на одежде появится
  rationale: כי с имперфектом вводит условный правовой случай; היה בו выражает наличие явления на предмете. Для видимого поражения одежды по-русски естественно «появится на».
- source_word: נֶגַע
  choice: поражение
  rationale: נגע в Лев 13 обозначает наблюдаемое патологическое пятно или поражённый участок. «Поражение» достаточно широко и подходит как для человека, так и для ткани.
- source_word: צָרָעַת
  choice: цараат
  rationale: Транслитерация сохраняет особую древнееврейскую категорию и не отождествляет её ошибочно с современной болезнью Хансена; значение поясняется в сноске.
- source_word: בְּבֶגֶד צֶמֶר
  choice: на шерстяной одежде
  rationale: צמר означает шерсть, а בגד צמר — одежду из шерсти. Предлог «на» естественно передаёт локализацию видимого поражения на ткани.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: или на льняной
  rationale: פשתים здесь обозначает лён как материал ткани. Эллипсис слова «одежде» естественен в русском и не меняет смысла повторённой еврейской конструкции.
theological_decisions:
- issue: Соотношение צָרָעַת с проказой
  choice: Передать термин как «цараат» и объяснить его в сноске.
  alternative: «проказа»
  rationale: В данном контексте явление поражает одежду, поэтому оно явно шире современной болезни Хансена. Транслитерация сохраняет древнюю категорию ритуально значимого поражения, не навязывая медицинской идентификации.
translation_notes:
  register: Современный литературный русский с достоинством правового текста. Сохранена условная казуистическая форма и повтор локализации по смыслу; термин цараат оставлен без ложного медицинского уточнения.
