- from: Если же на одежде появится поражение цараат[a] — на шерстяной одежде или на льняной, —
  to: Если на одежде появится поражение, называемое цараат[a], — будь то шерстяная или льняная одежда, —
  rationale: Удалено невыраженное в оригинале «же». Термин цараат сохранён как специальное обозначение, но синтаксически пояснён, чтобы русская фраза была прозрачной. Конструкция «будь то шерстяная или льняная одежда» передаёт альтернативное перечисление материалов и сохраняет обобщённый характер предписания.
