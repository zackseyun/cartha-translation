  text: וְ/אִם֙ מִ/פְּאַ֣ת פָּנָ֔י/ו יִמָּרֵ֖ט רֹאשׁ֑/וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: ru
  text: Если у него выпадут волосы в передней части головы, то он лыс спереди; он чист.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: спереди на его голове
  rationale: Буквально выражение указывает на край или сторону со стороны лица; в контексте противопоставления предыдущему стиху речь идёт о передней части головы.
- source_word: יִמָּרֵט רֹאשׁוֹ
  choice: волосы выпадут ... на его голове
  rationale: Нифаль глагола описывает обнажение головы из-за утраты волос. По-русски естественно прямо назвать выпадение волос, сохраняя условный характер диагноза.
- source_word: גִּבֵּחַ
  choice: лысина на лбу
  rationale: Термин обозначает переднее облысение и противопоставлен слову для облысения задней части или темени в предыдущем стихе.
- source_word: טָהוֹר
  choice: чист
  rationale: В законодательстве Левита это термин ритуального статуса, а не нравственная оценка.
theological_decisions:
- issue: Терминология ритуального статуса в законах о чистоте
  choice: чист
  alternative: нечистоты нет / чистый в ритуальном отношении
  rationale: Краткое «чист» сохраняет установленную категорию книги Левит и не превращает её в утверждение о нравственной чистоте.
translation_notes:
  register: Современный литературный русский язык; формулировка естественная и ясная, при этом сохранены юридико-ритуальный регистр и различие между передним и задним облысением.
