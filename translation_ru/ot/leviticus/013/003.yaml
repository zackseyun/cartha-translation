  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: ru
  text: Священник осмотрит поражённое место на коже тела. Если волосы на поражённом месте побелели и оно на вид глубже кожи тела, то это — поражение цараат[a]. Осмотрев человека, священник объявит его нечистым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское цараат обозначает древнюю ритуальную категорию, не совпадающую с современной лепрой (болезнью Хансена); традиционный перевод — «проказа».
    reason: Уточнение значения термина и сохранение традиционного варианта без отождествления с конкретным современным диагнозом.
lexical_decisions:
- source_word: נֶגַע
  choice: поражённое место / поражение
  rationale: В контексте осмотра кожи слово обозначает видимый поражённый участок; русское «поражение» естественно для диагностического описания и не предполагает конкретной современной болезни.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: на коже тела
  rationale: Передаёт анатомический смысл обоих существительных современным и понятным русским языком.
- source_word: שֵׂעָר בַּנֶּגַע הָפַךְ לָבָן
  choice: волосы на поражённом месте побелели
  rationale: Форма глагола указывает на наблюдаемый итог изменения; множественное «волосы» идиоматично по-русски при собирательном еврейском существительном.
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: оно на вид глубже кожи тела
  rationale: «На вид» сохраняет מַרְאֵה и показывает, что речь идёт о визуальной оценке, не утверждая измеренной глубины.
- source_word: נֶגַע צָרַעַת
  choice: поражение цараат
  rationale: Транслитерация сохраняет особую древнееврейскую категорию и избегает ошибочного отождествления с современной лепрой; значение поясняется в сноске.
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: осмотрев человека, священник
  rationale: Местоименный суффикс допускает формальную неоднозначность «его/это», но в контексте итоговый статус относится к осматриваемому человеку. Деепричастный оборот естественно передаёт последовательность действий.
- source_word: וְטִמֵּא אֹתוֹ
  choice: объявит его нечистым
  rationale: В священническом правовом контексте глагол выражает вынесение решения о ритуальном статусе, а не причинение нечистоты.
theological_decisions:
- issue: Передача термина צָרַעַת в законах о чистоте
  choice: цараат
  alternative: проказа; кожная болезнь
  rationale: Термин охватывает древнюю ритуально-диагностическую категорию, которая не совпадает точно с современной болезнью Хансена. Транслитерация не вносит анахроничной медицинской определённости, а сноска делает текст понятным.
- issue: Характер действия священника в וְטִמֵּא אֹתוֹ
  choice: объявит его нечистым
  alternative: сделает его нечистым
  rationale: Священник устанавливает и оглашает предусмотренный законом ритуальный статус; перевод не должен подразумевать, будто он сам вызывает нечистоту.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис разбит на три предложения ради ясности; сохранены визуальные признаки, последовательность осмотра и официальный характер священнического решения.
