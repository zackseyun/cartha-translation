base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: ru
  text: Но если на коже его тела есть белое пятно[a], на вид не глубже кожи, и волосы на нём не побелели, то священник должен на семь дней поместить человека с этим поражением в изоляцию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «блестящее пятно»; речь идёт о заметном светлом изменении кожи.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «изолировать поражение». В данном предписании это означает временно изолировать человека с поражённым участком для последующего наблюдения.'
    reason: source_form_and_clarity
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: светлое пятно
  rationale: Слово обозначает заметное светлое или блестящее изменение кожи; «светлое пятно» естественно по-русски и отличает его от припухлости, упомянутой выше.
- source_word: לְבָנָה
  choice: белое
  rationale: Прилагательное прямо указывает на белый цвет пятна.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: на коже его тела
  rationale: Передаёт анатомический смысл еврейского выражения без неестественного для современного русского оборота «на коже его плоти».
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: на вид не глубже кожи
  rationale: Сохраняет диагностический критерий видимой глубины и наблюдательный характер слова מַרְאֶה.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: волосы на нём не побелели
  rationale: Единственное собирательное «волос» естественно передано русским множественным; глагол выражает изменение состояния.
- source_word: וְהִסְגִּיר
  choice: должен ... изолировать
  rationale: Глагол обозначает временное отделение на срок наблюдения; «изолировать» ясно передаёт процедурный смысл, не предполагая окончательного диагноза.
- source_word: אֶת־הַנֶּגַע
  choice: человека с этим поражением
  rationale: Буквальный объект глагола — «поражение», однако фактически изоляции подвергается носитель поражения; это раскрыто в тексте, а буквальная конструкция отмечена в сноске.
- source_word: שִׁבְעַת יָמִים
  choice: на семь дней
  rationale: Естественная русская формула продолжительности временной изоляции.
