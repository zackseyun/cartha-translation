base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: ru
  text: 'Священник осмотрит его, и вот: волос на светлом пятне побелел, а само пятно на вид глубже кожи. Это кожное заболевание[a], появившееся на месте ожога. Священник объявит человека нечистым: это поражение, связанное с кожным заболеванием.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. цараат — широкий термин для серьёзного поражения кожи; традиционно переводится как «проказа».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: осмотрит
  rationale: В контексте священнического установления состояния кожи глагол обозначает целенаправленный осмотр, а не простое зрительное восприятие.
- source_word: בַּהֶרֶת
  choice: светлое пятно
  rationale: Передаёт видимый светлый участок кожи без внесения современной медицинской терминологии.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: волос ... побелел
  rationale: Сохраняет единственное число собирательного שֵׂעָר и выражает произошедшее изменение цвета.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: само пятно на вид глубже кожи
  rationale: Естественно передаёт диагностический признак видимой углублённости, сохраняя компонент зрительного восприятия מַרְאֶה.
- source_word: צָרַעַת
  choice: кожное заболевание
  rationale: Термин обозначает широкую категорию тяжёлых поражений, связанную с ритуальной нечистотой, и не тождествен исключительно современной болезни Хансена.
- source_word: מִכְוָה
  choice: место ожога
  rationale: Обозначает обожжённый участок или след ожога; выбранная формулировка не уточняет сверх текста, сформировался ли рубец.
- source_word: פָּרָחָה
  choice: появившееся
  rationale: В контексте кожных поражений глагол описывает возникновение или высыпание болезни; нейтральное «появившееся» естественно по-русски.
- source_word: טִמֵּא אֹתוֹ
  choice: объявит человека нечистым
  rationale: Передаёт авторитетное священническое заключение, а не причинение нечистоты; существительное «человека» устраняет неясность русского местоимения после упоминания пятна.
- source_word: נֶגַע צָרַעַת
  choice: поражение кожным заболеванием
  rationale: נֶגַע означает поражение или болезненный знак; формулировка сохраняет связь с ранее названным צָרַעַת и избегает сомнительного диагноза «инфекция».
theological_decisions:
- issue: Передача צָרַעַת в законах о чистоте
  choice: кожное заболевание
  alternative: проказа
  rationale: «Проказа» в современном русском обычно понимается как конкретная болезнь Хансена, тогда как древнееврейский термин охватывает более широкую ритуально-диагностическую категорию.
- issue: Смысл священнического действия טִמֵּא
  choice: объявит ... нечистым
  alternative: сделает ... нечистым
  rationale: Священник выносит установленное законом заключение о состоянии человека; текст не требует понимать его действие как причинение нечистоты.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной формулировкой закона. Частица וְהִנֵּה сохранена как «и вот». Короткие предложения делают последовательность диагностических признаков понятной, не устраняя юридико-ритуальный характер текста.
