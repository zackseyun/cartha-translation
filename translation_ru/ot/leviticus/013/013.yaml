  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: ru
  text: 'Священник осмотрит его и увидит, что кожная болезнь покрыла всё его тело. Тогда священник объявит поражённого чистым[a]: всё стало белым; он чист.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «объявит поражение чистым»; вердикт относится к человеку, у которого оно обнаружено.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте священнической проверки глагол означает не просто зрительное восприятие, а осмотр.
- source_word: וְהִנֵּה
  choice: и увидит, что
  rationale: Естественно передаёт результат, обнаруженный при осмотре, без архаичного «вот».
- source_word: הַצָּרַעַת
  choice: кожная болезнь
  rationale: צָרַעַת обозначает более широкую категорию кожных поражений, а не обязательно современную болезнь Хансена.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: всё его тело
  rationale: В данном контексте בשר относится к телесной поверхности человека; это естественнее современного русского «вся его плоть».
- source_word: וְטִהַר
  choice: объявит ... чистым
  rationale: Порода пиэль здесь выражает священническое признание ритуального статуса, а не действие по очищению.
- source_word: אֶת הַנָּגַע
  choice: поражённого
  rationale: Буквально объектом названо «поражение», но решение относится к человеку, на котором оно находится; формулировка сохраняет эту смысловую метонимию в понятном русском виде.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: всё стало белым
  rationale: Сохраняет тотальность כֻּלּוֹ и результат изменения цвета, не уточняя неоднозначный грамматический референт местоимения.
- source_word: טָהוֹר הוּא
  choice: он чист
  rationale: «Чист» — стандартное и контекстуально ясное обозначение статуса чистоты в книге Левит; добавление «ритуально» было бы пояснением.
theological_decisions:
- issue: Передача צָרַעַת в законах о чистоте
  choice: кожная болезнь
  alternative: проказа
  rationale: Перевод не отождествляет древнееврейскую категорию с современной болезнью Хансена и не вносит ложной медицинской точности.
- issue: Характер действия священника в וְטִהַר
  choice: объявит поражённого чистым
  alternative: очистит поражённого
  rationale: Священник выносит решение о статусе чистоты, а не исцеляет и не совершает здесь очищающий обряд.
- issue: Необычный объект אֶת הַנָּגַע
  choice: поражённого
  alternative: объявит поражение чистым
  rationale: Еврейский текст буквально называет объектом «поражение», однако итоговая формула «он чист» показывает, что вердикт относится к человеку. Сноска сохраняет буквальную особенность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Терминология чистоты сохранена без конфессиональных уточнений; синтаксис сделан естественным, а буквальная необычность объекта отмечена в сноске.
