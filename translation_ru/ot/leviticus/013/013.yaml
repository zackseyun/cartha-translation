  source_fidelity: 'Перевод верно передаёт ход предписания: священник производит осмотр, кожная болезнь покрывает всё тело, затем выносится декларативное решение о чистоте, поскольку всё стало белым. «Объявит ... чистым» точно отражает судебно-декларативную функцию וְטִהַר, а не лечение или обряд очищения. Метонимическое личное «поражённого» допустимо в свете заключительного «он чист» и пояснено сноской.'
