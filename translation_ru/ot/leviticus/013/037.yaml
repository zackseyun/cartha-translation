base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: ru
  text: Но если при осмотре священник увидит, что поражённый участок остался без изменений и на нём выросли чёрные волосы, то поражение исцелилось. Этот человек чист, и священник объявит его чистым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол можно также перевести как «признает его чистым» или, более буквально, «очистит его»; здесь речь идёт об официальном заключении священника после исцеления поражения.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: по его наблюдению
  rationale: Оборот буквально означает «в его глазах» и указывает на оценку священника при осмотре; выбран естественный русский эквивалент, сохраняющий ситуацию наблюдения.
- source_word: עָמַד
  choice: осталось без изменений
  rationale: В контексте повторного осмотра глагол указывает, что состояние поражённого участка не изменилось; буквальное «стояло» по-русски было бы неясно.
- source_word: הַנֶּתֶק
  choice: поражённое место / поражение
  rationale: Термин обозначает особое поражение кожи головы или бороды. Такой перевод понятен современному читателю и не использует архаичное либо чрезмерно конкретное медицинское название.
- source_word: שֵׂעָר שָׁחֹר
  choice: чёрные волосы
  rationale: Прямой перевод диагностического признака, противопоставленного нездоровому изменению волос в ближайшем контексте.
- source_word: צָמַח בּוֹ
  choice: на нём выросли
  rationale: В русском языке волосы естественно растут «на» поражённом месте; это передаёт смысл еврейского בּוֹ без неестественной кальки «в нём».
- source_word: נִרְפָּא
  choice: исцелилось
  rationale: Пассивно-результативная форма сообщает, что поражение прошло; формулировка отделяет исцеление от последующего решения священника.
- source_word: טָהוֹר הוּא
  choice: этот человек чист
  rationale: Местоимение относится к осматриваемому человеку. Явное существительное устраняет возможную русскую двусмысленность между человеком и поражением.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: священник объявит его чистым
  rationale: В данном юридико-обрядовом контексте священник выносит официальное заключение о чистоте, а не производит физическое исцеление.
theological_decisions:
- issue: Характер действия священника при установлении ритуальной чистоты
  choice: священник объявит его чистым
  alternative: священник очистит его
  rationale: Текст сначала констатирует исцеление поражения, а затем говорит о решении священника. Перевод сохраняет это различие и не приписывает священнику совершение самого исцеления.
translation_notes:
  register: Современный литературный русский язык; формулировки ясные и достойные, без архаизма «паршивость» и без навязывания современного медицинского диагноза. Повтор слова «чист» сохранён как значимый язык обрядово-правового заключения.
