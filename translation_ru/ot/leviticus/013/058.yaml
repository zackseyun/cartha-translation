  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: ru
  text: Одежду, основу, уток[a] или любое изделие из кожи, которые ты выстираешь и с которых исчезнет поражение, следует выстирать ещё раз, и они станут чистыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Уток — поперечные нити ткани.
    reason: Пояснение специального ткацкого термина для современного читателя.
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: одежду
  rationale: בגד обозначает одежду или предмет одежды; «одежда» — естественный и достаточно широкий русский эквивалент.
- source_word: הַשְּׁתִי
  choice: основу
  rationale: Технический ткацкий термин для продольных нитей; в русском языке стандартная пара — «основа и уток».
- source_word: הָעֵרֶב
  choice: уток[a]
  rationale: Технический термин для поперечных нитей ткани. «Уток» точно передаёт значение и образует общепринятую пару с «основой»; сноска помогает неспециалисту.
- source_word: כָל כְּלִי הָעוֹר
  choice: любое кожаное изделие
  rationale: כְּלִי здесь имеет широкое значение предмета или изделия; перевод не сужает его до сосуда либо орудия.
- source_word: תְּכַבֵּס
  choice: ты выстираешь
  rationale: Форма 2-го лица единственного числа сохранена; «выстирать» естественно для одежды, ткани и рассматриваемых изделий.
- source_word: הַנָּגַע
  choice: поражение
  rationale: Нейтральный контекстуальный термин для наблюдаемого поражённого участка без привнесения современного медицинского или микологического диагноза.
- source_word: וְסָר מֵהֶם
  choice: и с которого сойдёт поражение
  rationale: Сохранена соединительная конструкция еврейского текста; «сойдёт» естественно описывает исчезновение поражения с предмета. Единственное число согласовано по-русски с обобщённым предметом в перечислении.
- source_word: וְכֻבַּס שֵׁנִית
  choice: следует выстирать ещё раз
  rationale: Передаёт пассивное предписание и повторность действия естественным современным русским языком.
- source_word: וְטָהֵר
  choice: и оно станет чистым
  rationale: Передаёт итоговый статус чистоты в ритуальном контексте, не добавляя отсутствующего в тексте уточнения «обрядово».
theological_decisions:
- issue: Характер чистоты в וְטָהֵר
  choice: «станет чистым» без поясняющего определения
  alternative: «станет обрядово чистым»
  rationale: Контекст книги указывает на ритуальный статус, но само определение «обрядово» в стихе отсутствует; краткий перевод сохраняет смысл и не устраняет контекстуальную многозначность.
- issue: Связь стирки с исчезновением поражения
  choice: сохранена конструкция «и с которого сойдёт поражение»
  alternative: условное «если с него сойдёт поражение»
  rationale: Еврейский текст связывает части союзом וְ внутри относительной конструкции. Условное понимание возможно по контексту, однако явное «если» добавляло бы логическую маркировку, которой нет в форме исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным тоном ритуального предписания. Сохранено обращение на «ты», соответствующее форме 2-го лица единственного числа; технические термины «основа» и «уток» переданы точно, причём менее знакомый термин пояснён в сноске.
