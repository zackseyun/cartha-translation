source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֨ה תִפְשֶׂ֤ה הַ/מִּסְפַּ֨חַת֙ בָּ/ע֔וֹר אַחֲרֵ֧י הֵרָאֹת֛/וֹ אֶל הַ/כֹּהֵ֖ן לְ/טָהֳרָת֑/וֹ וְ/נִרְאָ֥ה שֵׁנִ֖ית אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: ru
  text: Но если поражение и в самом деле распространится по коже после того, как человек показался священнику, чтобы быть признанным чистым,[a][b][c] то он должен снова показаться священнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыпь», «кожное высыпание»; традиционно — «струп». Еврейское слово обозначает поверхностное кожное проявление, которое осматривает священник.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол усилен: буквально «если поражение действительно распространится».'
    reason: lexical_alternative
  - marker: c
    text: То есть человек явился на осмотр, чтобы священник определил, можно ли признать его чистым.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: и в самом деле распространится
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает значение פשה; оборот передаёт эмфазу естественным современным русским языком.
- source_word: הַמִּסְפַּחַת
  choice: поражение
  rationale: Термин обозначает поверхностное кожное проявление, подлежащее осмотру. «Поражение» достаточно широко и не вводит более узкий диагноз, тогда как традиционное «лишай» может звучать как конкретное современное заболевание.
- source_word: בָּעוֹר
  choice: по коже
  rationale: В контексте распространения кожного проявления русское «по коже» естественно передаёт локативное значение без добавления отсутствующего в еврейском притяжательного местоимения.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: после того, как человек показался
  rationale: Нифаль от ראה здесь относится к явке для священнического осмотра. Слово «человек» проясняет подразумеваемое лицо и избегает двусмысленного местоимения.
- source_word: לְטָהֳרָתוֹ
  choice: чтобы быть признанным чистым
  rationale: В данном юридико-обрядовом контексте речь идёт об осмотре с целью вынесения решения о чистоте; перевод не предполагает, что очищение уже состоялось.
- source_word: וְנִרְאָה שֵׁנִית אֶל הַכֹּהֵן
  choice: то он должен снова показаться священнику
  rationale: Вав-последовательность в правовом предписании выражает требуемое последующее действие; «должен» ясно передаёт нормативный смысл.
theological_decisions:
- issue: Значение לְטָהֳרָתוֹ в законах о кожных поражениях
  choice: чтобы быть признанным чистым
  alternative: для своего очищения
  rationale: Контекст описывает священническое освидетельствование и объявление статуса, а не обязательно обряд или процесс физического исцеления. Формулировка сохраняет связь с категорией ритуальной чистоты.
translation_notes:
  register: Современный литературный русский язык с юридико-обрядовой ясностью. Сохранена эмфаза еврейской конструкции, но исключены архаизмы и необоснованная медицинская конкретизация.
