  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: ru
  text: Но если поражённый участок действительно распространится по коже после того, как его признали чистым,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает особое поражение кожи головы или бороды, описанное в этой главе, вероятно сопровождавшееся изменением или выпадением волос. Точный современный медицинский диагноз неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит условный случай, противопоставленный предыдущему этапу осмотра; «но если» естественно передаёт этот переход.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: продолжит распространяться
  rationale: Сочетание абсолютного инфинитива с личной формой подчёркивает реальное или дальнейшее распространение; в данном процедурном контексте это естественно выражается глаголом «продолжит».
- source_word: הַנֶּתֶק
  choice: поражённый участок
  rationale: Термин обозначает особое поражение кожи головы или бороды, связанное с изменением волос; нейтральный перевод не навязывает современный медицинский диагноз.
- source_word: בָּעוֹר
  choice: по коже
  rationale: В русском языке распространение кожного поражения обычно описывается как распространение «по коже»; это точно передаёт локативный смысл.
- source_word: אַחֲרֵי טָהֳרָתוֹ
  choice: после признания его чистым
  rationale: В контексте священнического осмотра речь идёт о ранее установленном статусе ритуальной чистоты, а не обязательно о лечении или физическом очищении.
theological_decisions:
- issue: Значение טָהֳרָתוֹ в законе об осмотре
  choice: после признания его чистым
  alternative: после его очищения
  rationale: Выбранная формулировка яснее сохраняет ритуально-правовой контекст и не создаёт впечатления, будто человек непременно прошёл лечение или нравственное очищение.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и dignified, без архаичного или сомнительного медицинского термина. Запятая в конце сохранена, поскольку стих синтаксически продолжается далее.
