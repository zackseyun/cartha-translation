lexical_decisions:
- source_word: אוֹ כִּי
  choice: Или если
  rationale: Сочетание разделительного אוֹ и условного כִּי вводит альтернативный случай в порядке распознавания болезни.
- source_word: יָשׁוּב
  choice: снова
  rationale: Глагол שׁוב указывает на возвращение к прежнему состоянию; вместе с последующим глаголом естественно передаётся наречием «снова».
- source_word: הַבָּשָׂר הַחַי
  choice: обнажённая живая ткань
  rationale: Буквально выражение означает «живая плоть», но в данном диагностическом контексте обозначает видимую открытую живую ткань; выбранная формулировка ясна современному читателю и сохраняет определение «живая».
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: станет белой
  rationale: Нифаль глагола הפך выражает изменение состояния; по-русски результат естественно передаётся глаголом «стать».
- source_word: וּבָא אֶל־הַכֹּהֵן
  choice: пусть человек придёт к священнику
  rationale: Форма продолжает предписанную последовательность действий. Подлежащее уточнено как «человек», чтобы не возникло грамматического впечатления, будто к священнику приходит ткань.
