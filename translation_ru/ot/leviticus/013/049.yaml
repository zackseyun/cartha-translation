id: LEV.13.49
reference: Leviticus 13:49
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: ru
  text: Если пятно на одежде, на выделанной коже, на основе или утке[a] либо на любом кожаном изделии окажется зеленоватым или красноватым, то это поражение цараат[b]; его следует показать священнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Основа — продольные нити ткани, уток — поперечные.
    reason: Пояснение специальных ткацких терминов.
  - marker: b
    text: 'Традиционно: «проказа». Еврейское слово «цараат» в этой главе обозначает более широкую категорию поражений, которые могли обнаруживаться не только на коже человека, но и на ткани или кожаных изделиях; это не точное обозначение современной лепры.'
    reason: Сохранение древней категории без ошибочного современного медицинского отождествления.
lexical_decisions:
- source_word: נֶגַע
  choice: пятно / поражение
  rationale: В первой части стиха речь идёт о видимом пятне на материале, поэтому естественно «пятно». В сочетании נֶגַע צָרַעַת слово передано как «поражение», что лучше выражает диагностическую категорию и избегает неестественного повтора.
- source_word: יְרַקְרַק
  choice: зеленоватый
  rationale: Редуплицированная форма обозначает оттенок зелёного; «зеленоватый» сохраняет приблизительность цветового описания.
- source_word: אֲדַמְדָּם
  choice: красноватый
  rationale: Редуплицированная форма указывает на красноватый оттенок, а не обязательно на чистый ярко-красный цвет.
- source_word: בֶּגֶד
  choice: одежда
  rationale: В контексте главы слово обозначает предмет из ткани, прежде всего одежду; современное русское «одежда» понятно и соответствует перечню материалов и изделий.
- source_word: עוֹר
  choice: выделанная кожа
  rationale: Здесь имеется в виду материал, а не кожа живого человека. Уточнение «выделанная» устраняет возможную двусмысленность.
- source_word: שְׁתִי / עֵרֶב
  choice: основа / уток
  rationale: Это точные русские ткацкие термины для продольной и поперечной систем нитей; пояснение дано в сноске.
- source_word: כְּלִי עוֹר
  choice: кожаное изделие
  rationale: כְּלִי имеет широкое значение предмета или принадлежности; «кожаное изделие» естественно и не сужает его до сосуда.
- source_word: נֶגַע צָרַעַת
  choice: поражение цараат
  rationale: Транслитерация сохраняет особую левитскую категорию, которая относится не только к человеческой коже, но также к тканям и кожаным изделиям; современный медицинский термин был бы вводящим в заблуждение.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: его следует показать священнику
  rationale: Безлично-пассивная конструкция сохраняет отсутствие названного действующего лица в еврейской форме и естественно звучит по-русски.
theological_decisions:
- issue: Передача צָרַעַת в священническом законодательстве
  choice: цараат
  alternative: проказа
  rationale: В Левите 13 цараат может обнаруживаться на человеческой коже, одежде и кожаных предметах, поэтому отождествление с современной лепрой слишком узко. Транслитерация сохраняет ритуально-диагностическую категорию текста без навязывания медицинского диагноза.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным тоном, подходящим для священнического постановления. Специальные термины сведены к минимуму и пояснены; синтаксис сделан ясным без устранения исходной неопределённости относительно того, кто показывает предмет священнику.
