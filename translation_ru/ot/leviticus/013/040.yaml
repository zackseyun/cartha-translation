  text: Если мужчина лишится волос на голове[a], он лыс; он чист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если мужчина облысеет». Еврейский глагол может означать, что голова становится оголённой или лишается волос; основной текст сохраняет различие между утратой волос и последующим утверждением: «он лыс».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: у мужчины
  rationale: Существительное мужского рода вводит частный случай в постановлении; форма «у мужчины» естественно сочетается с русским выражением «выпадут волосы» и сохраняет указание на мужчину.
- source_word: כִּי
  choice: если
  rationale: В данном правовом и диагностическом контексте союз вводит условный случай.
- source_word: יִמָּרֵט
  choice: выпадут волосы
  rationale: Нифаль глагола מרט передаёт утрату волос или оголение; перевод не уточняет причину и сохраняет отличие глагольного события от последующего определения «лыс».
- source_word: רֹאשׁוֹ
  choice: на голове
  rationale: Так по-русски естественно обозначается место выпадения волос; притяжательное значение ясно из конструкции «у мужчины».
- source_word: קֵרֵחַ
  choice: лыс
  rationale: Краткое прилагательное точно и естественно обозначает состояние облысения.
- source_word: טָהוֹר
  choice: чист
  rationale: В Левите 13 это установленный ритуально-диагностический статус, а не нравственная характеристика.
- source_word: הוּא ... הוּא
  choice: он ... он
  rationale: 'Повторение местоимения сохранено в двух параллельных утверждениях: «он лыс; он чист».'
theological_decisions:
- issue: Терминология ритуального статуса в постановлениях Левита о нечистоте
  choice: чист
  alternative: чистый; не является нечистым
  rationale: «Чист» прямо сохраняет культово-правовую категорию טָהוֹר и не придаёт ей значения нравственной безупречности.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и dignified, с сохранением структуры диагностического постановления и различия между облысением и признанием ритуально чистым.
