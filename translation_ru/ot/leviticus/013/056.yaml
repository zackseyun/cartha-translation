  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: ru
  text: Но если священник осмотрит и увидит, что после того, как изделие выстирали, поражённое место поблёкло, пусть он вырвет поражённый участок из одежды, из кожаного изделия, из основы или из утка[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Основа — продольные нити ткани, уток — поперечные.
    reason: Пояснение специальных ткацких терминов, соответствующих הַשְּׁתִי и הָעֵרֶב.
lexical_decisions:
- source_word: וְאִם רָאָה הַכֹּהֵן
  choice: Но если священник осмотрит
  rationale: Условное продолжение предшествующего предписания передано через «но если»; ראה в контексте установленной проверки естественно передаётся как «осмотрит».
- source_word: וְהִנֵּה כֵּהָה הַנֶּגַע
  choice: и увидит, что поражённое место ... поблёкло
  rationale: וְהִנֵּה здесь вводит обнаруженный результат осмотра; буквальное «вот» в русском юридико-повествовательном контексте было бы тяжеловесно. כֵּהָה обозначает уменьшение яркости или заметности поражения.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: после стирки оно
  rationale: Сохраняется пассивный смысл формы הֻכַּבֵּס, но по-русски конструкция «после стирки» звучит естественнее и ясно относится к предмету.
- source_word: וְקָרַע אֹתוֹ
  choice: пусть он вырвет его
  rationale: Глагол קרע требует удалить поражённую часть разрыванием; местоимение сохраняет формальную неоднозначность объекта, проясняемую контекстом как поражённый участок.
- source_word: מִן הַבֶּגֶד א֣וֹ מִן הָעוֹר
  choice: из одежды, кожи
  rationale: בגד — одежда или тканое изделие; עור в данном материальном контексте — кожа как выделанный либо кожаный материал.
- source_word: מִן הַשְּׁתִי א֥וֹ מִן הָעֵרֶב
  choice: основы или утка
  rationale: 'Сохранены точные русские ткацкие термины: основа — продольные нити, уток — поперечные.'
theological_decisions: []
