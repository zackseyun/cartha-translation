  terminology: «Священник» и «нечистым» сохраняют установившуюся ритуально-правовую терминологию. Транслитерация «цараат» оправданно избегает ложного отождествления с болезнью Хансена; сноска корректно объясняет традиционное «проказа» и более широкий объём термина. Якорь сноски поставлен непосредственно после термина.
