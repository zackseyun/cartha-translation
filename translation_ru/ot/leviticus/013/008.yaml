  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: ru
  text: 'И осмотрит его священник: если окажется, что шелушащееся поражение распространилось по коже, священник объявит его нечистым. Это цараат[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. цараат — традиционно «проказа», однако в книге Левит этот термин охватывает более широкий круг поражений и не равнозначен современной болезни Хансена.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте священнического освидетельствования глагол обозначает не простое зрительное восприятие, а целенаправленный осмотр.
- source_word: וְהִנֵּה
  choice: если окажется, что
  rationale: Оборот вводит обнаруженный при осмотре признак; такое выражение естественно передаёт его условно-результативную функцию, сохраняя оттенок выявления.
- source_word: הַמִּסְפַּחַת
  choice: шелушащееся поражение
  rationale: Слово обозначает поверхностное кожное поражение; перевод достаточно конкретен для данного диагностического контекста, но не приписывает ему современный точный диагноз.
- source_word: פָּשְׂתָה ... בָּעוֹר
  choice: распространилось по коже
  rationale: Передаёт диагностически значимое расширение поражения на коже.
- source_word: וְטִמְּאוֹ
  choice: объявит его нечистым
  rationale: Священник авторитетно устанавливает и объявляет ритуальный статус человека, а не делает его нечистым причинно.
- source_word: צָרַעַת
  choice: цараат
  rationale: Транслитерация сохраняет особый библейский термин и не отождествляет его ошибочно ни с современной лепрой, ни только с одним классом кожных болезней; значение поясняется в сноске.
theological_decisions:
- issue: Передача термина צָרַעַת в законодательстве о ритуальной чистоте
  choice: цараат
  alternative: проказа; кожная болезнь; тяжёлое кожное заболевание
  rationale: Термин шире современной болезни Хансена, а в других местах относится также к одежде и домам. Транслитерация сохраняет его категориальную неоднозначность и не вносит ложной медицинской точности.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Сохранён ритуальный смысл «нечистого»; архаическое «вот» не воспроизводится буквально, но оттенок обнаружения передан словами «если окажется».
