source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: ru
  text: 'Вот закон о поражении цараат[a] на одежде из шерсти или льна, в основе или в утке либо на любом кожаном изделии: для признания таких вещей чистыми или нечистыми.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «цараат» обозначает особое поражение, из-за которого человек или предмет мог считаться ритуально нечистым. Оно употребляется о людях, одежде и домах и не равнозначно современной болезни Хансена, которую обычно называют проказой.
    reason: Сохраняет широту и особый смысл еврейского термина, не навязывая ошибочно узкий медицинский диагноз.
lexical_decisions:
- source_word: תּוֹרַת
  choice: закон о
  rationale: В данном итоговом постановлении תּוֹרָה обозначает установленное правило или предписание; «закон о» естественно передаёт также конструктивную связь со следующим выражением.
- source_word: נֶגַע צָרַעַת
  choice: поражение цараат
  rationale: נֶגַע обозначает наблюдаемое поражение, а צָרַעַת — особую библейскую категорию, распространяющуюся здесь на ткань и кожу. Транслитерация не сводит её ошибочно к современной болезни Хансена и не приписывает ей более узкий медицинский смысл.
- source_word: בֶּגֶד הַצֶּמֶר אוֹ הַפִּשְׁתִּים
  choice: на шерстяной или льняной одежде
  rationale: По контексту речь идёт об одежде из шерсти или льна; повтор слова «одежда» по-русски не требуется.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: на нитях основы или утка
  rationale: «Основа» и «уток» — современные русские названия продольной и поперечной систем нитей в ткани. Добавление «нитях» делает технические термины понятнее и согласуется с контекстом.
- source_word: כָּל כְּלִי עוֹר
  choice: на любом кожаном изделии
  rationale: כְּלִי имеет широкое значение предмета или изделия; «кожаное изделие» естественно и не сужает вид вещи.
- source_word: לְטַהֲרוֹ אוֹ לְטַמְּאוֹ
  choice: как объявлять его чистым или нечистым
  rationale: В священническом законодательстве глаголы обозначают установление и объявление ритуального статуса, а не физическую очистку или загрязнение. «Его» относится к рассматриваемому изделию.
theological_decisions:
- issue: Передача צָרַעַת применительно к одежде и коже
  choice: цараат с пояснительной сноской
  alternative: проказа; проказное поражение; кожная болезнь
  rationale: Термин охватывает людей, одежду и строения и не совпадает однозначно с современной болезнью Хансена. «Кожная болезнь» здесь семантически неуместна, поскольку речь идёт о материалах, а «проказа» создаёт ложную медицинскую определённость. Транслитерация сохраняет самостоятельную библейскую категорию.
- issue: Чистота и нечистота как статус
  choice: объявлять чистым или нечистым
  alternative: очищать или осквернять
  rationale: Контекст говорит о распознавании и официальном определении ритуального статуса вещи, а не обязательно о причинении ей чистоты или нечистоты.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного итога. Технические ткацкие термины даны в принятой форме («основа», «уток»), но пояснены словом «нити». Конструкция после двоеточия естественно выражает назначение данного правила.
