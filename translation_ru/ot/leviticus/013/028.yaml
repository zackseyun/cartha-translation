  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: ru
  text: Но если светлое пятно остаётся на месте, не распространяется по коже и бледнеет, то это припухлость от ожога. Священник объявит человека чистым, потому что это рубец от ожога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: остаётся на месте
  rationale: Буквально выражение означает «стоит под ней», однако в диагностическом контексте речь о том, что пятно остаётся неподвижным и не распространяется.
- source_word: הַבַּהֶרֶת
  choice: светлое пятно
  rationale: Слово обозначает заметный светлый участок кожи; этот вариант естественен по-русски и сохраняет зрительный характер признака.
- source_word: לֹא פָשְׂתָה בָעוֹר
  choice: не распространяется по коже
  rationale: Глагол обозначает распространение поражения, а русский предлог «по» естественно передаёт расширение его площади на коже.
- source_word: כֵהָה
  choice: бледнеет
  rationale: Прилагательное указывает на уменьшение яркости или заметности пятна; в контексте осмотра кожи естественна глагольная передача.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: припухлость от ожога
  rationale: שְׂאֵת обозначает приподнятый, опухший участок, а הַמִּכְוָה — ожог или ожоговую рану.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: священник объявит человека чистым
  rationale: В данном священническом предписании глагол означает вынесение заключения о чистоте, а не физическое очищение.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: рубец от ожога
  rationale: צָרֶבֶת означает след или рубцовое изменение, оставшееся после ожога; «рубец» точно и естественно передаёт этот смысл.
theological_decisions:
- issue: Значение ритуальной чистоты
  choice: объявит человека чистым
  alternative: очистит его
  rationale: Контекст описывает диагностическое решение священника, поэтому перевод не должен создавать впечатление, будто священник непосредственно исцеляет или очищает человека.
translation_notes:
  register: Современный литературный русский язык; ясная медицинско-правовая формулировка без избыточного архаизма. Неясная при буквальном переводе еврейская идиома передана по смыслу как «остаётся на месте».
