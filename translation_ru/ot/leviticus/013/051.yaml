  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: ru
  text: На седьмой день он осмотрит поражение; если поражение распространилось по одежде, в основе или утке ткани либо на коже — на любом изделии из кожи[b], — то это губительная цараат[a]; поражение нечисто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цараат — особый библейский термин для поражения, влекущего ритуальную нечистоту. Его традиционно переводили как «проказа», но в Левите он имеет более широкое значение и может относиться даже к одежде и коже.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейскую фразу можно также передать: «при любом применении кожи»; она охватывает любой предмет, сделанный из кожи для употребления или работы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте священнической проверки глагол означает не просто зрительное восприятие, а целенаправленный осмотр. Подлежащее «священник» восстановлено из ближайшего контекста (ст. 50), чтобы русская фраза была ясной.
- source_word: הַנֶּגַע
  choice: поражение
  rationale: Слово обозначает заметный очаг или повреждение, влекущее статус нечистоты. «Поражение» применимо и к человеку, и к ткани или коже, не навязывая современного медицинского диагноза.
- source_word: פָשָׂה
  choice: распространилось
  rationale: Передаёт наблюдаемое увеличение или распространение поражённого участка.
- source_word: בֶּגֶד
  choice: одежда
  rationale: Обычное значение — предмет одежды; в данном контексте слово также может охватывать тканое изделие, однако «одежда» сохраняет основное лексическое значение.
- source_word: שְׁתִי ... עֵרֶב
  choice: основа ... уток ткани
  rationale: Это стандартные современные русские термины для продольной и поперечной систем нитей в тканом полотне.
- source_word: עוֹר
  choice: кожа
  rationale: Речь идёт о шкуре как материале для изготовления изделий; по-русски «кожа» естественно охватывает обработанный материал.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: по любой вещи, для изготовления которой используется кожа
  rationale: Формулировка естественно передаёт широкий охват любых изготовленных из кожи предметов, сохраняя при этом некоторую синтаксическую неоднозначность еврейской фразы в примечании.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: разъедающая цараат
  rationale: Транслитерация сохраняет особый левитский термин, который не совпадает с современной лепрой и здесь относится к неодушевлённым материалам. «Разъедающая» передаёт вредоносный, разрушительный оттенок מַמְאֶרֶת без чрезмерно медицинского толкования.
- source_word: טָמֵא הוּא
  choice: поражение нечисто
  rationale: Сохраняется грамматическая отсылка местоимения к слову «поражение» и юридико-ритуальный смысл статуса нечистоты.
theological_decisions:
- issue: Значение צָרַעַת в законах о чистоте
  choice: цараат
  alternative: проказа; кожная болезнь; оскверняющее поражение
  rationale: В Левите термин охватывает состояния людей, одежды и кожи, поэтому его нельзя без оговорки отождествлять с болезнью Хансена или только с кожной болезнью. Транслитерация сохраняет единство технического термина и не устраняет присущую тексту категориальную напряжённость.
- issue: К чему относится заключение טָמֵא הוּא
  choice: поражение нечисто
  alternative: вещь нечиста
  rationale: Мужское местоимение в еврейском тексте грамматически согласуется с נֶגַע («поражение»), хотя практическое следствие закона касается поражённого предмета. Основной текст сохраняет грамматическую форму оригинала, не подменяя её выводом из контекста.
translation_notes:
  register: Современный литературный русский язык с ясным нормативно-ритуальным тоном. Технические ткацкие термины даны в современной форме («основа», «уток»), а специфический термин צָרַעַת транслитерирован и объяснён в сноске. Точка после первого предложения улучшает читаемость, не меняя логической связи еврейского текста.
