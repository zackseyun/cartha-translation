  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: ru
  text: На седьмой день священник осмотрит поражённое место[a]. Если поражение не распространилось по коже и на вид оно не глубже кожи[b], священник объявит этого человека чистым[c]. Тот вымоет свою одежду — и будет чист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское не́тек обозначает особое поражение кожи головы или бороды; его точное соответствие среди современных диагнозов неясно. Возможные переводы: «шелушащееся поражение», «парша».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «оно не глубже кожи» — обычный для этой главы критерий: поражённое место не выглядит углублённым относительно окружающей кожи.'
    reason: cultural_note
  - marker: c
    text: То есть священник официально признаёт человека чистым; речь не о том, что священник исцеляет заболевание.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: поражённое место / поражение
  rationale: Еврейское слово обозначает особое поражение кожи головы или подбородка, подлежащее осмотру священником. Нейтральная передача не навязывает точного современного диагноза и естественно звучит по-русски.
- source_word: פָשָׂה
  choice: распространилось
  rationale: В данном диагностическом контексте глагол означает дальнейшее распространение поражения по коже.
- source_word: בָּעוֹר
  choice: по коже
  rationale: При глаголе распространения это наиболее естественная русская формулировка, передающая охват поверхности кожи.
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: на вид оно не глубже кожи
  rationale: 'Сохранён зрительный характер критерия и буквальная образность: поражение не выглядит углублённым относительно окружающей кожи.'
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: священник объявит этого человека чистым
  rationale: В законах о чистоте священник выносит официальное решение о статусе человека, а не исцеляет его.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Тот вымоет свою одежду
  rationale: Местоимение ясно указывает на осматриваемого человека; собирательное «одежду» естественно в современном русском языке.
- source_word: וְטָהֵר
  choice: и будет чист
  rationale: Передаёт наступающий после омовения одежды статус ритуальной чистоты.
- source_word: וְהִנֵּה
  choice: Если
  rationale: В формуле осмотра частица вводит установленное при осмотре условие; условная конструкция естественна по-русски.
- source_word: וְרָאָה
  choice: осмотрит
  rationale: Глагол описывает официальный осмотр священником, а не простое зрительное восприятие.
theological_decisions:
- issue: Характер действия священника в законе о чистоте
  choice: Священник официально объявляет человека чистым.
  alternative: Священник очищает человека.
  rationale: В этом юридико-ритуальном контексте форма טהר означает установление статуса чистоты. Такая передача не приписывает священнику медицинского исцеления или непосредственного совершения очищения.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным тоном, соответствующим законодательному контексту. Синтаксис упрощён ради ясности, но последовательность осмотра, решения и омовения сохранена. Терминология не связывает древнее поражение с конкретным современным заболеванием.
