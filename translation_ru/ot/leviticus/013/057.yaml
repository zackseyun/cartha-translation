  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: ru
  text: Но если оно снова появится на одежде, на основе или утке[a] либо на каком-нибудь кожаном изделии, то это — разрастающееся поражение[b]. Сожги в огне то, в чём находится поражение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Уток — поперечные нити ткани; основа — её продольные нити.
    reason: lexical_clarification
  - marker: b
    text: 'Еврейское нега — техническое обозначение поражённого участка в Левите; традиционные переводы: «язва», «пятно» или «зараза».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: снова появится
  rationale: Нифаль глагола ראה передаёт появление чего-либо в поле зрения, а עוֹד в данном процедурном контексте указывает на повторное обнаружение после обработки.
- source_word: בֶּגֶד
  choice: одежда
  rationale: Обычное значение слова в контексте Левита 13; оно может обозначать предмет одежды или тканое изделие, однако здесь «одежда» сохраняет принятую в главе терминологию.
- source_word: שְׁתִי
  choice: основа
  rationale: Технический ткацкий термин для продольных нитей ткани.
- source_word: עֵרֶב
  choice: уток
  rationale: Технический ткацкий термин для поперечных нитей, парный слову שְׁתִי «основа».
- source_word: כְּלִי עוֹר
  choice: кожаное изделие
  rationale: Широкое обозначение предмета или принадлежности, сделанных из кожи; перевод не сужает круг возможных предметов.
- source_word: פֹּרַחַת הִוא
  choice: это разрастающееся поражение
  rationale: Причастие от פרח буквально связано с ростом или распусканием и здесь образно описывает активное распространение поражённого участка.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: сожги в огне
  rationale: Сохраняется прямое предписание во втором лице единственного числа и юридически обязательный тон.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: то, на чём находится поражение
  rationale: Естественная русская передача относительной конструкции; предлог «на» соответствует пятну на поверхности ткани или кожаного изделия.
- source_word: הַנָּגַע
  choice: поражение
  rationale: В Левите это техническое обозначение поражённого или осквернённого участка, не обязательно соответствующего конкретному современному медицинскому диагнозу.
