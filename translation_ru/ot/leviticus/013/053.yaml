  text: וְ/אִם֮ יִרְאֶ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔גַע בַּ/בֶּ֕גֶד א֥וֹ בַ/שְּׁתִ֖י א֣וֹ בָ/עֵ֑רֶב א֖וֹ בְּ/כָל כְּלִי עֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: ru
  text: Но если священник осмотрит и увидит, что поражение не распространилось ни на одежде, ни на основе, ни на утке[a], ни на каком кожаном изделии,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Уток — поперечные нити ткани; основа — продольные.
    reason: Пояснение специальных текстильных терминов, соответствующих שתי и ערב.
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Передаёт условное продолжение предыдущего предписания и лёгкое противопоставление иному результату осмотра.
- source_word: יִרְאֶה הַכֹּהֵן
  choice: священник осмотрит
  rationale: В данном обрядово-правовом контексте глагол «увидит» обозначает официальный осмотр; «осмотрит» естественно передаёт эту функцию.
- source_word: וְהִנֵּה
  choice: и окажется
  rationale: Естественно для современного русского языка вводит обнаруженный при осмотре результат, сохраняя смысл указательного маркера.
- source_word: לֹא פָשָׂה הַנֶּגַע
  choice: поражение не распространилось
  rationale: פשה означает распространение поражённого участка, а נגע здесь обозначает поражение без навязывания конкретного современного диагноза.
- source_word: בַּבֶּגֶד
  choice: на одежде
  rationale: Русское «на одежде» естественно описывает распространение видимого поражения по материалу; ב допускает такое контекстуальное соответствие.
- source_word: בַשְּׁתִי
  choice: на основе
  rationale: שתי — продольные нити ткани; технический термин «основа» точен и употребителен по-русски.
- source_word: בָעֵרֶב
  choice: на утке
  rationale: ערב — поперечные нити ткани; «уток» является точным современным текстильным термином.
- source_word: בְּכָל כְּלִי עוֹר
  choice: ни на каком-либо кожаном изделии
  rationale: כלי здесь имеет широкое значение предмета или изделия, а עור в контексте изготовленной вещи естественно передаётся как «кожаный».
