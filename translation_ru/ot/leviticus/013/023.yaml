base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: ru
  text: Но если светлое пятно остаётся на месте и не распространяется[a], то это рубец от нарыва, и священник объявит этого человека чистым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под нею стоит светлое пятно». Значение этого еврейского выражения в данном контексте не вполне ясно; вероятно, оно означает, что пятно остаётся на месте, а не распространяется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Передаёт условное противопоставление предыдущему случаю и естественно звучит по-русски.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: остаётся на месте
  rationale: Буквально сочетание означает «стоит под нею/на своём месте»; в данном диагностическом контексте речь о том, что пятно не выходит за прежние границы.
- source_word: הַבַּהֶרֶת
  choice: светлое пятно
  rationale: Обозначает заметный светлый участок кожи; перевод сохраняет наблюдаемый признак, не навязывая современного медицинского диагноза.
- source_word: לֹא פָשָׂתָה
  choice: не распространяется
  rationale: В Левите 13 этот глагол регулярно описывает распространение поражения по коже.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: рубец от нарыва
  rationale: צָרֶבֶת здесь обозначает след или рубец, оставшийся после воспалённого поражения, а שְׁחִין — нарыв.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: священник объявит этого человека чистым
  rationale: Порода hифиль глагола טהר в контексте священнического осмотра означает признание или объявление ритуально чистым, а не физическое очищение.
theological_decisions:
- issue: Ритуальная чистота или медицинское исцеление
  choice: «священник объявит этого человека чистым»
  alternative: «священник очистит его»
  rationale: Стих описывает установление священником статуса ритуальной чистоты, а не лечение или совершение действия, физически очищающего человека.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной лексикой. «Светлое пятно» сохраняет визуальный характер признака, а «этого человека» устраняет неестественную для русского языка двусмысленность местоимения.
