base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: ru
  text: 'Священник осмотрит — и вот: на коже тела тускло-белые пятна. Это кожное высыпание[a], выступившее на коже; он чист.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кожная сыпь», «пятнистое высыпание». Еврейское слово обозначает кожное состояние, которое не делает человека нечистым и отличается от более серьёзного поражения, рассматриваемого в этой главе.'
    reason: Лексическая альтернатива для редкого термина בֹּהַק и пояснение его контекстуального значения.
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит и увидит
  rationale: В контексте священнического освидетельствования глагол обозначает не просто зрительное восприятие, а внимательный осмотр; сочетание передаёт и действие, и установленный результат.
- source_word: בְעוֹר בְּשָׂרָם
  choice: на коже тела
  rationale: Естественная современная русская передача конкретного еврейского выражения «на коже их плоти» без неуместно тяжёлой буквальности.
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: тускло-белые пятна
  rationale: כֵּהוֹת указывает на слабую, неяркую окраску пятен и отличает их от ярко-белых поражений.
- source_word: בֹּהַק
  choice: кожное высыпание[a]
  rationale: Редкое название неоскверняющего кожного состояния. Общее выражение сохраняет медицинскую неопределённость древнего термина и не добавляет оценку «безвредное» в основной текст.
- source_word: פָּרַח
  choice: появившееся
  rationale: При описании кожного состояния глагол означает, что высыпание проступило или возникло на коже.
- source_word: טָהוֹר הוּא
  choice: человек чист
  rationale: Краткая формула передаёт установленный священником статус чистоты; слово «человек» ясно обозначает носителя статуса при обобщённой формулировке.
theological_decisions:
- issue: Характер заключения священника
  choice: человек чист
  alternative: человек ритуально чист
  rationale: В контексте Левита речь идёт о культово-правовом статусе, а не о нравственной безупречности или медицинском исцелении. Краткое «чист» сохраняет библейскую категорию, не вводя пояснение в сам текст.
translation_notes:
  register: Современный литературный русский язык с ясной процедурной формулировкой. Сохранён сдержанный, юридико-священнический тон; древнее кожное состояние не отождествляется с конкретным современным диагнозом.
