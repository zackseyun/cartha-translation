  to: 'Священник осмотрит — и вот: на коже тела тускло-белые пятна. Это кожное высыпание[a], выступившее на коже; он чист.'
  rationale: Редакция устраняет смысловое дублирование, восстанавливает функцию «и вот» и сохраняет все существенные элементы еврейского текста. Безличное «на коже тела» позволяет не утяжелять русский текст буквальным, но неестественным воспроизведением формы «их плоти»; лицо, о котором идёт речь, обозначено последующим «он чист» и задаётся ближайшим контекстом закона.
