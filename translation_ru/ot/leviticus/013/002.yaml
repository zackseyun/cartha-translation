  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: ru
  text: Если у человека на коже тела появится припухлость, струп или светлое пятно и на коже его тела это станет поражённым местом, связанным с кожной болезнью[a], его должны привести к священнику Аарону или к одному из его сыновей-священников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «поражением проказы» или «проказой». Еврейское צָרָעַת (цараат) обозначает более широкую категорию кожных поражений и не должно автоматически отождествляться с современной болезнью Хансена.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: человек
  rationale: В формулировке казуистического закона слово обозначает отдельного человека вообще; русское «человек» естественно передаёт родовое значение без неоправданного ограничения мужским полом.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: на коже тела / на коже его тела
  rationale: Сохранена повторяющаяся анатомическая формула оригинала; «тело» в современном русском здесь естественнее буквальной «плоти».
- source_word: שְׂאֵת
  choice: припухлость
  rationale: Слово указывает на приподнятый участок кожи. «Припухлость» передаёт видимый признак и не предполагает опухолевого диагноза.
- source_word: סַפַּחַת
  choice: струп
  rationale: Точное дерматологическое значение неясно; «струп» — конкретный и традиционный эквивалент, не создающий излишне точного современного диагноза.
- source_word: בַּהֶרֶת
  choice: светлое пятно
  rationale: Передаёт яркую или бледную отметину на коже, не сужая смысл до непременно белого пятна.
- source_word: לְנֶגַע צָרָעַת
  choice: поражением кожной болезнью
  rationale: נֶגַע передано как «поражение», а צָרָעַת — как более широкая библейская категория кожной болезни, которую нельзя автоматически отождествлять с современной болезнью Хансена.
- source_word: וְהוּבָא
  choice: его должны привести
  rationale: Безлично-пассивная русская конструкция естественно сохраняет обязательную процедурную силу древнееврейской формы.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: священнику Аарону
  rationale: Естественный русский порядок слов передаёт имя и титул без изменения смысла.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: к одному из его сыновей-священников
  rationale: Сложное наименование ясно сохраняет и родство, и священническое служение сыновей Аарона.
theological_decisions:
- issue: Передача צָרָעַת
  choice: кожная болезнь
  alternative: проказа; цараат
  rationale: Термин охватывает библейскую категорию диагностируемых поражений и не требует отождествления с современной проказой. Нейтральная формулировка сохраняет границы исходного смысла, а традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксический повтор «на коже тела / на коже его тела» намеренно сохранён вслед за оригиналом; медицинская терминология не делается точнее, чем позволяет древнееврейский текст.
