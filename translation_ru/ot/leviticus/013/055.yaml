base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: ru
  text: 'После того как поражённое место вымыли[a], священник осмотрит его. Если поражённое место не изменило своего вида[b] и не распространилось, изделие нечисто. Сожги его в огне: это разъедающее повреждение[c] на одной или другой стороне изделия[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того как вымыли поражённую вещь». Еврейская конструкция допускает понимание поражения как поражённого материала в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «не изменило цвета». Буквально по-еврейски: «не изменило своего глаза», то есть видимого облика.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «разъедающая порча». Редкое еврейское слово обозначает разрушительное повреждение материала; точный характер поражения неизвестен.'
    reason: lexical_alternative
  - marker: d
    text: 'Заключительные слова трудны для понимания. Буквально: «на его плеши или на его лысине спереди»; применительно к ткани или коже они, вероятно, обозначают две стороны либо поверхности изделия, но точное различие неизвестно.'
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: וְרָאָה
  choice: священник осмотрит
  rationale: В контексте священнической проверки ראה означает целенаправленно осмотреть, а не просто увидеть.
- source_word: אַחֲרֵי הֻכַּבֵּס אֶת הַנֶּגַע
  choice: после того как поражённое место вымыли
  rationale: Пассивная форма כבס указывает на совершённое мытьё; נגע здесь обозначает поражённый участок материала.
- source_word: הַנֶּגַע
  choice: поражённое место
  rationale: Нейтрально обозначает видимый поражённый участок, не навязывая современный диагноз и не используя архаичное «язва» применительно к ткани или коже.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: не изменилось на вид
  rationale: Еврейский оборот буквально говорит, что поражение «не изменило своего глаза», то есть видимого облика; цвет возможен, но несколько уже.
- source_word: לֹא פָשָׂה
  choice: не распространилось
  rationale: פשה в диагностических предписаниях означает распространение поражения.
- source_word: טָמֵא הוּא
  choice: эта вещь нечиста
  rationale: «Нечиста» сохраняет установленное значение ритуальной нечистоты; слово «вещь» проясняет, что статус относится к проверяемому изделию.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Сожги её в огне
  rationale: Сохранено прямое предписание во втором лице единственного числа и явное упоминание огня.
- source_word: פְּחֶתֶת
  choice: разъедающее повреждение
  rationale: Редкое слово указывает на разрушительное, въедающееся повреждение материала; перевод не приписывает ему точного современного диагноза.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: на её изнанке или лицевой стороне
  rationale: Буквальные названия видов облысения здесь метафорически применены к двум поверхностям изделия. Выбор передаёт вероятное контекстуальное значение, а неопределённость отмечена в сноске.
