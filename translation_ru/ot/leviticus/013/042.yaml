revisions:
- from: Но если на лысине сзади или на лысине спереди появится белое красноватое пятно[a], то это кожная болезнь[b], разрастающаяся на его лысине сзади или спереди.
  to: Но если на лысине в задней части головы или в передней части головы есть беловато-красное пятно[a], то это распространяющееся кожное поражение[b] на его лысине в задней части головы или в передней части головы[c].
  rationale: Перестроена заключительная часть, чтобы «распространяющееся» характеризовало кожное поражение, а повторённые обстоятельства места сохраняли функцию еврейского текста. Цвет передан естественным современным русским составным прилагательным. Примечания сохраняют традиционное «проказа», избегая отождествления с болезнью Хансена, и поясняют различие двух терминов для облысения.
  reviewer_model: gpt-5.6-terra
