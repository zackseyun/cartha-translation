  terminology: '«Кожное поражение» здесь точнее и естественнее, чем «кожная болезнь»: оно соотносится с видимым נֶגַע и не выдаёт древнюю ритуально-диагностическую категорию за современный медицинский диагноз. Сноску о традиционном «проказа» следует сохранить. Добавлена сноска, поясняющая различие קָרַחַת и גַּבַּחַת, поскольку это существенная парная терминология оригинала.'
