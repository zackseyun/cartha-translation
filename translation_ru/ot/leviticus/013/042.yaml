  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: ru
  text: Но если на лысине в задней части головы или в передней части головы есть беловато-красное пятно[a], то это распространяющееся кожное поражение[b] на его лысине в задней части головы или в передней части головы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «белое с красноватым оттенком».'
    reason: Лаконичное сочетание двух еврейских прилагательных допускает более развёрнутую передачу смешанной окраски.
  - marker: b
    text: 'Традиционно: «проказа». Еврейское слово обозначает более широкий круг кожных поражений и не равнозначно современной болезни Хансена.'
    reason: Сохраняет традиционную лексическую альтернативу и предупреждает ошибочное медицинское отождествление.
  - marker: c
    text: Два еврейских слова различают облысение в задней и в передней части головы.
    reason: Поясняет сохранённое в переводе терминологическое различие парных обозначений.
lexical_decisions:
- source_word: וְכִי יִהְיֶה
  choice: Но если ... появится
  rationale: Условная формула продолжает правовое предписание и противопоставляет этот случай предыдущему; «появится» естественно передаёт возникновение видимого пятна.
- source_word: בַקָּרַחַת אוֹ בַגַּבַּחַת
  choice: на лысине сзади или на лысине спереди
  rationale: Сохранено различие между двумя еврейскими обозначениями облысения задней и передней части головы без неясных для современного читателя специальных терминов.
- source_word: נֶגַע
  choice: пятно
  rationale: В контексте осмотра это видимый поражённый участок; нейтральное «пятно» не вносит излишне точного современного диагноза.
- source_word: לָבָן אֲדַמְדָּם
  choice: белое красноватое
  rationale: Сохранены порядок цветов и несколько необычное сочетание исходного текста; сноска отмечает возможное понимание оттенка.
- source_word: צָרַעַת
  choice: кожная болезнь
  rationale: Термин охватывает более широкий круг состояний, чем современная болезнь Хансена, поэтому традиционная «проказа» могла бы ввести читателя в заблуждение.
- source_word: פֹּרַחַת
  choice: разрастающаяся
  rationale: Причастие от פרח изображает болезнь как распространяющуюся или развивающуюся; «разрастающаяся» естественно сочетается с кожным поражением.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: на его лысине сзади или спереди
  rationale: Притяжательный суффикс передан словом «его», а пространственное различие повторено в сжатой и естественной форме.
theological_decisions:
- issue: Соотношение צָרַעַת с проказой
  choice: кожная болезнь
  alternative: проказа
  rationale: Исходный термин нельзя строго отождествлять с болезнью Хансена; нейтральный вариант сохраняет широту древнего понятия и не превращает ритуальную классификацию в современный медицинский диагноз.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Повтор «лысине сзади ... спереди» намеренно сохраняет различие двух терминов оригинала; медицинская терминология остаётся нейтральной.
