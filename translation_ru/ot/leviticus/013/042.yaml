  source_fidelity: 'В целом верно переданы условная конструкция, видимый признак, различие задней и передней частей облысевшей головы и широкий смысл צָרַעַת. Однако «кожная болезнь, разрастающаяся на его лысине» синтаксически и смыслово несколько неудачно: создаётся впечатление, что болезнь разрастается по уже названной лысине, тогда как еврейский текст квалифицирует описанное поражение как צָרַעַת פֹּרַחַת и затем вновь указывает его локализацию. «Появится» допустимо в контексте осмотра, хотя само יִהְיֶה буквально имеет экзистенциальное значение («будет/есть»).'
