  source_fidelity: 'В целом переданы все элементы еврейского текста: кожная болезнь без отождествления с болезнью Хансена, повторное упоминание поражения, разорванные одежды, распущенные волосы, прикрытие области верхней губы и двойное публичное объявление ритуальной нечистоты. Однако «пусть носит разорванную одежду» несколько смещает смысл состояния одежд к действию ношения; в оригинале сказано, что одежды должны быть разорваны.'
