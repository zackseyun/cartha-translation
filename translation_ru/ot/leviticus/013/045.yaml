base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: ru
  text: 'А у поражённого кожной болезнью, у которого есть это поражение, одежды пусть будут разорваны, волосы — распущены; пусть он прикрывает верхнюю губу[a] и кричит: «Нечист! Нечист!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прикрывает усы». Еврейское слово может обозначать верхнюю губу или усы; речь идёт о прикрытии этой части лица.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: поражённый кожной болезнью
  rationale: Термин обозначает человека с одной из описанных в главе кожных патологий и не должен сужаться до болезни Хансена; причастная форма сохраняет характеристику лица без добавления существительного «мужчина».
- source_word: הַנֶּגַע
  choice: это поражение
  rationale: «Поражение» передаёт наблюдаемое патологическое проявление, не внося современного представления об инфекции; указательное «это» естественно связывает выражение с уже названной болезнью.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: пусть носит разорванную одежду
  rationale: Еврейская конструкция буквально говорит, что его одежды должны быть разорваны; русская формулировка естественно выражает предписанное постоянное внешнее состояние.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: волосы его пусть будут распущены
  rationale: פָרוּעַ здесь вероятнее указывает на распущенные, неубранные волосы, а не на обнажённую голову; перевод конкретен, но не добавляет идеи намеренной неопрятности.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: пусть он закрывает верхнюю губу
  rationale: שָׂפָם обозначает область верхней губы или усов. «Верхняя губа» точнее сохраняет анатомический образ; примечание указывает допустимый вариант.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: 'и кричит: «Нечист! Нечист!»'
  rationale: Повтор передаёт настойчивое публичное объявление состояния ритуальной нечистоты; «кричит» естественно выражает громкое предупреждение.
theological_decisions:
- issue: Характер нечистоты в Левите 13
  choice: «Нечист» как обозначение ритуального и общественного статуса
  alternative: «Осквернён» или медицинское обозначение заразности
  rationale: טָמֵא в данном законодательном контексте обозначает культовую нечистоту и связанные с ней ограничения, не утверждая сам по себе нравственной вины и не вводя современного медицинского диагноза.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного предписания. Повтор «Нечист! Нечист!» сохранён. Формы с «пусть» передают предписывающую силу еврейского имперфекта; терминология не отождествляет заболевание с проказой в современном медицинском смысле.
