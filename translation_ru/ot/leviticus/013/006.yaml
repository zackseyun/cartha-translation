  source_fidelity: 'Перевод точно передаёт последовательность еврейского текста: повторный осмотр на седьмой день, ослабление видимого поражения, отсутствие его распространения по коже, официальное объявление человека чистым, стирка одежды и наступление чистоты. «Поражённое место побледнело» естественно передаёт כֵּהָה, не выдавая древнее описание за современный диагноз. Условное «если» эксплицирует подразумеваемую в диагностической формуле зависимость и не меняет смысла.'
