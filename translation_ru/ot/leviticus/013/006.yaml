base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: ru
  text: 'На седьмой день священник снова осмотрит его. И если поражённое место побледнело и поражение не распространилось по коже, священник объявит его чистым: это сыпь[a]. Он должен выстирать свою одежду — и будет чист.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «короста». Точное значение еврейского слова неясно; оно обозначает сравнительно небольшое кожное высыпание, а не более серьёзное распространяющееся поражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте священнического распознавания состояния кожи глагол обозначает не просто зрительное восприятие, а официальный осмотр.
- source_word: שֵׁנִית
  choice: снова
  rationale: Передаёт наречное значение повторного осмотра естественным современным русским языком.
- source_word: כֵּהָה
  choice: побледнело
  rationale: Глагол указывает, что поражённое место стало менее заметным или утратило яркость; «побледнело» ясно передаёт наблюдаемый признак.
- source_word: הַנֶּגַע
  choice: поражение / поражённое место
  rationale: נגע здесь означает видимое поражение кожи, исследуемое священником. Такое решение не навязывает современный медицинский диагноз и позволяет избежать вводящего в заблуждение слова «инфекция».
- source_word: פָשָׂה
  choice: не распространилось
  rationale: В законах о кожных поражениях глагол обозначает увеличение поражённой области по коже.
- source_word: בָּעוֹר
  choice: по коже
  rationale: Так по-русски естественно описывается распространение кожного поражения; значение существительного «кожа» сохранено.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: священник объявит его чистым
  rationale: Формулировка передаёт официальный вердикт о ритуальном статусе, а не физическое очищение или исцеление.
- source_word: מִסְפַּחַת
  choice: сыпь
  rationale: Слово обозначает сравнительно неопасное кожное высыпание, противопоставленное распространяющемуся поражению; точный вид состояния остаётся неясным и отмечен в сноске.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Он должен выстирать свою одежду
  rationale: Передаёт предписанное действие естественным современным русским языком; собирательное «одежда» соответствует контексту.
- source_word: וְטָהֵר
  choice: и будет чист
  rationale: Обозначает наступающий после стирки статус ритуальной чистоты.
theological_decisions:
- issue: Вердикт о ритуальной чистоте или физическое исцеление
  choice: «священник объявит его чистым» и «будет чист»
  alternative: «священник очистит его» или «он исцелён»
  rationale: Речь идёт об официальном установлении ритуального статуса после осмотра, а не обязательно о медицинском исцелении. Перевод сохраняет правовой и культовый смысл без добавления богословских или медицинских выводов.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной формулировкой. Медицински узкий термин «инфекция» не использован, поскольку еврейское נגע обозначает наблюдаемое поражение без точного диагноза. Маркер сноски поставлен непосредственно после слова, к которому относится.
