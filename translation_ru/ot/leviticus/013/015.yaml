  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: ru
  text: Когда священник увидит открытую живую ткань[a], он объявит этого человека нечистым[b]. Открытая живая ткань нечиста; это заболевание кожи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живую плоть»; имеется в виду открытая, видимая живая ткань.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «признает этого человека нечистым». Священник выносит официальное решение о ритуальной нечистоте.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «проказа». Еврейское слово обозначает более широкий круг поражений кожи и не обязательно соответствует современной болезни Хансена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Когда … увидит
  rationale: В законодательном контексте сочетание союза с перфектной формой продолжает последовательность предписаний; временное придаточное естественно передаёт эту функцию по-русски.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное обозначение священнослужителя, который в данном разделе осматривает человека и выносит решение о его ритуальном состоянии.
- source_word: הַבָּשָׂר הַחַי
  choice: открытая живая ткань
  rationale: Буквально выражение означает «живая плоть». В контексте осмотра поражённой кожи речь идёт о видимой открытой живой ткани; такой перевод понятен современному читателю и не создаёт впечатления, будто противопоставляется живая и мёртвая плоть.
- source_word: וְטִמְּאוֹ
  choice: он объявит этого человека нечистым
  rationale: Пиэль глагола טמא в священническом законодательстве обозначает официальное признание ритуальной нечистоты, а не причинение нечистоты самим священником. Уточнение «этого человека» естественно передаёт местоименный объект мужского рода.
- source_word: טָמֵא הוּא
  choice: нечиста
  rationale: Термин сохраняет установленную в Левите категорию ритуальной нечистоты; женский род согласован с русским словом «ткань».
- source_word: צָרַעַת
  choice: заболевание кожи
  rationale: Еврейский термин охватывает более широкую категорию поражений, чем современная болезнь Хансена. Перевод избегает ложной медицинской точности и соответствует контексту осмотра кожи.
theological_decisions:
- issue: Значение צָרַעַת в законах о ритуальной чистоте
  choice: заболевание кожи
  alternative: проказа; поражение цараат
  rationale: Текст устанавливает ритуально-правовую категорию, а не даёт точного современного диагноза. «Проказа» неоправданно сужает значение до болезни Хансена, тогда как транслитерация без пояснения была бы непонятна большинству читателей.
- issue: Роль священника при признании человека нечистым
  choice: объявит этого человека нечистым
  alternative: сделает его нечистым; признает его нечистым
  rationale: Формулировка показывает, что священник выносит официальное решение о состоянии человека, а не вызывает это состояние.
translation_notes:
  register: Современный литературный русский язык с кратким, предписывающим строем. Термины ритуальной чистоты переданы последовательно, а медицинская конкретизация ограничена тем, что позволяет древнееврейский текст.
