  source_fidelity: 'Перевод точно передаёт последовательность еврейского текста: условно-временную процедуру осмотра, священническое объявление человека нечистым, оценку «живой плоти» как нечистой и отнесение случая к צָרַעַת. «Открытая живая ткань» — контекстуально оправданная передача «живой плоти» (то есть сырой/обнажённой ткани), а не необоснованное медицинское уточнение.'
