base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: ru
  text: 'На седьмой день священник осмотрит его, и вот: поражённое место[a], по его наблюдению, не изменилось[b] и не распространилось по коже. Тогда священник изолирует его[c] ещё на семь дней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поражение», «отметина». Еврейское слово не обязательно обозначает конкретную болезнь в современном медицинском смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поражение осталось стоять в его глазах», то есть при осмотре оно показалось священнику неизменившимся.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «заключит его», «будет держать его отдельно»; буквально: «закроет его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: священник осмотрит его
  rationale: В контексте священнической проверки ראה означает не просто «увидеть», а внимательно осмотреть человека для обрядового заключения.
- source_word: וְהִנֵּה
  choice: 'и увидит:'
  rationale: Дискурсивный маркер вводит наблюдаемый результат осмотра. Русское «и увидит» сохраняет зрительный аспект и звучит естественнее буквального «и вот» в этой синтаксической конструкции.
- source_word: הַנֶּגַע
  choice: поражённое место
  rationale: נגע здесь обозначает видимое изменение кожи, подлежащее осмотру, а не обязательно болезнь в современном медицинском смысле. Выбор передаёт конкретный локальный признак без излишней медицинской определённости.
- source_word: עָמַד בְּעֵינָיו
  choice: осталось в его глазах без изменения
  rationale: 'Перевод сохраняет образ еврейской идиомы «стояло в его глазах» и одновременно раскрывает её смысл: при осмотре священнику место кажется неизменившимся.'
- source_word: לֹא פָשָׂה ... בָּעוֹר
  choice: не распространилось по коже
  rationale: פשׂה в диагностическом контексте означает распространение поражения; русское «по коже» естественно обозначает увеличение затронутой области.
- source_word: וְהִסְגִּירוֹ
  choice: изолирует его
  rationale: Глагол означает «закрыть, держать отдельно». «Изолирует» ясно передаёт предписанное отделение, не внося современной медицинской специфики слова «карантин».
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: ещё на семь дней
  rationale: Естественная русская формулировка точно передаёт повторный семидневный срок.
theological_decisions:
- issue: Характер кожного явления
  choice: Не называть его проказой или определённой болезнью
  alternative: «проказа», «болезнь»
  rationale: נגע в данном стихе обозначает наблюдаемое поражение или отметину; точный медицинский диагноз текстом не устанавливается.
- issue: Характер отделения
  choice: «изолирует» без уточнения медицинской цели
  alternative: «поместит в карантин»
  rationale: Текст предписывает священническое отделение, но не позволяет свести его исключительно к современной противоэпидемической процедуре.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием, уместным для законодательного текста. Синтаксис упрощён для ясности, но сохранены зрительная перспектива священника, неопределённость природы поражения и повторность семидневной изоляции.
