base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: ru
  text: Если же священник осмотрит светлое пятно и увидит, что на нём нет белых волос, что оно не углублено относительно поверхности кожи[a] и тусклое, то священник изолирует этого человека[b] на семь дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не ниже кожи», то есть пятно не кажется впалым по сравнению с окружающей кожей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заключит его отдельно»; возможно также: «поместит его на карантин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֶּהֶרֶת
  choice: на светлом пятне
  rationale: Слово обозначает светлый или белёсый след поражения на коже. «Светлое пятно» сохраняет зрительный признак, не навязывая современного медицинского диагноза.
- source_word: שֵׂעָר לָבָן
  choice: белых волос
  rationale: Собирательное единственное число естественно передаётся по-русски множественным числом в описании диагностического признака.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: оно не углублено относительно поверхности кожи
  rationale: 'Прилагательное указывает на более низкое, впалое положение. Формулировка передаёт видимый признак: пятно не кажется расположенным ниже окружающей кожи.'
- source_word: כֵהָה
  choice: потускнело
  rationale: Слово указывает на ослабление яркости или выраженности пятна; «потускнело» естественно передаёт это изменение без излишней медицинской конкретизации.
- source_word: וְהִסְגִּירוֹ
  choice: священник изолирует этого человека
  rationale: Глагол означает заключить или отделить человека на время наблюдения. «Изолирует» ясно описывает процедуру и меньше связано с современной санитарной терминологией, чем «поместит на карантин».
- source_word: שִׁבְעַת יָמִים
  choice: на семь дней
  rationale: Прямой и естественный перевод указания срока.
- source_word: יִרְאֶנָּה
  choice: осмотрит светлое пятно
  rationale: Хотя глагол буквально означает «увидит», в контексте установленного священнического обследования «осмотрит» точнее передаёт функцию действия.
- source_word: וְהִנֵּה
  choice: и увидит, что
  rationale: Дискурсивный указатель вводит результат осмотра. В современном русском «и увидит, что» естественно сохраняет наблюдательный смысл без архаичного «вот».
