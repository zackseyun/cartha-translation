  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: ru
  text: И осмотрит священник поражённое место[a] и изолирует человека с этим поражением на семь дней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поражение», «пятно»; традиционно также «язва». Еврейское слово обозначает видимый признак или поражённый участок, который осматривает священник, и не обязательно соответствует определённой современной категории заболевания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «заключит» или «запрёт». Имеется в виду временная изоляция для наблюдения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте установленной священнической процедуры глагол ראה означает не просто зрительное восприятие, а внимательный осмотр.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычная и точная передача כֹּהֵן; определённость в русском естественно выражается контекстом.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: поражённое место
  rationale: נגע здесь обозначает наблюдаемый участок или признак поражения, а не однозначно установленную современную болезнь. В первом упоминании выражение передано явно, а во втором — местоимением ради естественности русского текста.
- source_word: וְהִסְגִּיר
  choice: изолирует
  rationale: Порода hифиль глагола סגר выражает закрытие или отделение объекта на время наблюдения; «изолирует» передаёт смысл без чрезмерно современного медицинского оттенка слова «карантин».
- source_word: שִׁבְעַת יָמִים
  choice: на семь дней
  rationale: Естественное русское обозначение срока временной изоляции.
