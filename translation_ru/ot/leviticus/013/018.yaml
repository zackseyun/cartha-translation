  text: And when the body has a boil in its skin[a], and it heals[c][b],
translation:
  language: ru
  text: Если у человека на коже был нарыв и он зажил,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: у человека
  rationale: Буквально «плоть», но в данном правовом и диагностическом контексте слово обозначает человека как носителя кожного поражения; по-русски «у человека» звучит естественно и не создаёт впечатления, будто речь только о мышечной ткани.
- source_word: כִּי
  choice: если
  rationale: Частица вводит условный случай казуистического закона. Русское «если» естественно передаёт условность, не превращая предписание в утверждение о неизбежном событии.
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: на коже появится
  rationale: Буквально конструкция означает «будет у него/в нём, в его коже». В русском диагностическом описании появление поражения естественно выражается оборотом «на коже появится».
- source_word: שְׁחִין
  choice: нарыв
  rationale: Слово обозначает воспалённое кожное поражение, нарыв или язву. «Нарыв» — понятный современный эквивалент, сохраняющий медицинский характер описания без излишней специализации.
- source_word: וְנִרְפָּא
  choice: и заживёт
  rationale: Нифаль глагола רפא здесь допускает значение состояния или результата исцеления. В отношении нарыва естественное русское выражение — «заживёт».
