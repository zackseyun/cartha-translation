lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: у мужчины или женщины
  rationale: Еврейский текст прямо называет оба пола; русская конструкция естественно сохраняет это различение.
- source_word: כִּי
  choice: если
  rationale: В данном законодательном контексте частица вводит условный случай; «если» точно и естественно передаёт эту функцию.
- source_word: יִהְיֶה בּוֹ
  choice: появится
  rationale: Буквально речь идёт о наличии поражения у человека; «появится» идиоматично вводит диагностируемый случай и не меняет смысла.
- source_word: נָגַע
  choice: поражение
  rationale: Широкий термин обозначает заметное телесное проявление, подлежащее осмотру священником. «Поражение» не навязывает современный диагноз, в отличие от более узкого «инфекция».
- source_word: בְּ/רֹאשׁ
  choice: на голове
  rationale: Сохраняется более широкое значение еврейского רֹאשׁ; контекст допускает более узкое понимание «на коже головы», отмеченное в сноске.
- source_word: בְ/זָקָן
  choice: в бороде
  rationale: זָקָן означает «борода»; по-русски местоположение кожного поражения в области роста волос естественно передаётся выражением «в бороде».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной законодательной формулировкой. Термин «поражение» сохраняет медицинскую неопределённость древнееврейского נָגַע. Союз в начале еврейского стиха не воспроизведён, поскольку отдельное русское предложение естественно продолжает перечень случаев и без начального «и».
