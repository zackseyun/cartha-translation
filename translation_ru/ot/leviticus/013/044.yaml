base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: ru
  text: 'Он — человек, поражённый кожной болезнью[a]; он нечист. Священник непременно объявит его нечистым: его поражение — на голове.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «прокажённый». Еврейский термин обозначает кожное заболевание, рассматриваемое в этой главе, и не обязательно соответствует современной проказе (болезни Хансена).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ צָרוּעַ
  choice: человек, поражённый кожной болезнью
  rationale: Передаёт мужской единичный случай и состояние, обозначаемое צרע, не отождествляя его с современной болезнью Хансена. Слово «человек» здесь естественнее тяжеловесного «мужчина», а причастная конструкция сохраняет смысл поражённости.
- source_word: טָמֵא הוּא
  choice: он нечист
  rationale: В контексте Левита речь идёт прежде всего о культовом статусе нечистоты; традиционное «нечист» точно и понятно передаёт этот смысл.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: непременно должен объявить его нечистым
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает утверждение. В данном диагностико-правовом контексте священник официально объявляет статус, а не делает человека нечистым.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычный и точный русский эквивалент названия культового служителя.
- source_word: בְּרֹאשׁוֹ
  choice: у него на голове
  rationale: Передаёт локальное значение предлога ב без неоправданного уточнения «на коже головы».
- source_word: נִגְעוֹ
  choice: поражение
  rationale: В Лев 13 נגע обозначает наблюдаемое болезненное поражение. «Поражение» сохраняет диагностическую широту и не привносит значения эпидемии, свойственного слову «язва» или «чума» в некоторых контекстах.
theological_decisions:
- issue: Характер нечистоты
  choice: Сохранено краткое утверждение «он нечист» без пояснения в основном тексте.
  alternative: «Он ритуально нечист».
  rationale: Контекст книги задаёт культовый смысл, но еврейский текст не содержит отдельного слова «ритуально»; добавление могло бы чрезмерно истолковывать формулировку.
- issue: Роль священника
  choice: Священник «объявляет» человека нечистым.
  alternative: Священник «делает» его нечистым.
  rationale: В контексте осмотра священник устанавливает и официально провозглашает статус; перевод не должен создавать впечатление, будто сам обряд причиняет нечистоту.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксический повтор еврейского оригинала частично сохранён; усилительная конструкция передана словом «непременно». Медицински вводящий в заблуждение термин «прокажённый» не использован.
