  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: ru
  text: Священник осмотрит её и увидит, что она кажется ниже уровня кожи, а волосы на ней побелели. Тогда священник объявит его нечистым. Это поражение цараат[a], проявившееся в нарыве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «цараат» традиционно переводят как «проказа», однако в книге Левит оно, вероятно, обозначает более широкий круг серьёзных поражений кожи, а не только современную болезнь Хансена.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте священнической диагностики глагол означает целенаправленный осмотр, а не просто зрительное восприятие.
- source_word: וְהִנֵּה
  choice: и увидит, что
  rationale: Передаёт внимание к обнаруженному диагностическому признаку естественным современным русским оборотом без архаического «вот».
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: она кажется углублённой по сравнению с кожей
  rationale: Сохраняет указание именно на внешний вид поражённого места и передаёт שָׁפָל как визуальную впалость относительно окружающей кожи.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: волосы на ней побелели
  rationale: Суффикс относится к поражённому месту; множественное «волосы» звучит естественно по-русски, хотя еврейское собирательное существительное формально стоит в единственном числе.
- source_word: וְטִמְּאוֹ
  choice: объявит его нечистым
  rationale: Священник выносит авторитетное ритуальное заключение, а не делает человека нечистым физически.
- source_word: נֶגַע צָרַעַת
  choice: поражение цараат
  rationale: «Поражение» передаёт נֶגַע, а транслитерация «цараат» сохраняет особый и более широкий смысл древнееврейского термина, не отождествляя его с современной болезнью Хансена.
- source_word: בַּשְּׁחִין
  choice: в нарыве
  rationale: שְׁחִין обозначает воспалённую язву или нарыв; «нарыв» здесь ясно и естественно.
- source_word: פָּרָחָה
  choice: появившееся
  rationale: В данной фразе глагол описывает проявление или возникновение поражения в нарыве и сам по себе не требует смысла распространения по телу.
theological_decisions:
- issue: Передача צָרַעַת в законах о ритуальной чистоте
  choice: цараат
  alternative: проказа; тяжёлое кожное заболевание
  rationale: Транслитерация сохраняет историко-ритуальную категорию и не навязывает анахроничное отождествление с болезнью Хансена; сноска объясняет вероятный диапазон значения.
- issue: Роль священника в признании нечистоты
  choice: объявит его нечистым
  alternative: сделает его нечистым
  rationale: Форма передаёт диагностико-правовой характер решения священника и не утверждает, будто само произнесение создаёт состояние нечистоты.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Синтаксис сделан ясным для обычного читателя; сохранены ритуальная терминология, визуальная неопределённость выражения о глубине поражения и особое значение צָרַעַת.
