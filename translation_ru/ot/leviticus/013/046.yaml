  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: ru
  text: Во все дни, пока на нём остаётся поражение[a], он будет нечист.[b] Он нечист. Он будет жить отдельно; его жилище будет вне стана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «недуг» либо «болезненное поражение». Еврейское слово имеет широкое значение и здесь обозначает состояние, распознанное по правилам этой главы.'
    reason: lexical_alternative
  - marker: b
    text: «Нечист» здесь означает статус нечистоты по левитскому закону и не обязательно указывает на личную нравственную вину.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: поражение
  rationale: נֶגַע — широкое обозначение поражения, недуга или болезненного состояния. В контексте Левита 13 речь идёт о распознанном поражении кожи; «поражение» сохраняет широту еврейского слова и не отождествляет его без достаточных оснований с конкретной современной болезнью.
- source_word: בּוֹ
  choice: на нём
  rationale: Предлог ב допускает значения «в/на». Для видимого кожного поражения по-русски естественно «на нём»; это также ближе к пространственному образу исходного выражения.
- source_word: יִטְמָא
  choice: он будет нечист
  rationale: Форма Qal от טמא в данном законодательном контексте обозначает продолжающийся статус нечистоты. Будущее время естественно передаёт нормативную силу еврейского имперфекта.
- source_word: טָמֵא הוּא
  choice: Он нечист
  rationale: Отдельное безглагольное предложение подчёркнуто повторяет установленный статус человека. Краткая самостоятельная фраза сохраняет этот акцент.
- source_word: בָּדָד
  choice: отдельно
  rationale: בָּדָד означает «один, обособленно». «Отдельно» здесь естественно выражает требуемое отделение, не усиливая текст до абсолютного одиночества.
- source_word: יֵשֵׁב
  choice: пусть живёт
  rationale: ישב может означать сидеть, пребывать или жить. В постановлении о месте проживания «пусть живёт» звучит естественно и передаёт предписывающую силу формы.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: вне стана
  rationale: Устойчивое и точное обозначение пространства за пределами израильского лагеря в пустыне; «стан» сохраняет библейско-исторический контекст и остаётся понятным.
- source_word: מוֹשָׁבוֹ
  choice: его жилище
  rationale: מוֹשָׁב обозначает место пребывания или проживания. «Жилище» кратко и конкретно передаёт смысл.
theological_decisions:
- issue: Характер нечистоты в Левите 13
  choice: Передать טמא словом «нечист», не добавляя в основной текст «ритуально» или «обрядово».
  alternative: «ритуально нечист»; «обрядово нечист»
  rationale: Еврейский текст прямо утверждает нечистоту, а контекст закона показывает её левитский статус. Уточнение в основном тексте сузило бы исходную формулировку; примечание предотвращает ошибочное отождествление с личной нравственной виной.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой («стан»). Короткие предложения сохраняют юридическую категоричность и emphатическое повторение оригинала. Все примечания отмечены в основном тексте.
