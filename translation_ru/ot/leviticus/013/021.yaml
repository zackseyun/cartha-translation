base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: ru
  text: Но если священник осмотрит поражённое место и увидит, что на нём нет белых волос, оно не выглядит углублённым ниже уровня кожи и тусклое, то священник изолирует этого человека[a] на семь дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отделит этого человека на семь дней». Еврейский глагол означает, что человека помещают отдельно для наблюдения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Условие противопоставлено предыдущему диагностическому случаю; «но если» естественно передаёт переход к иной ситуации.
- source_word: יִרְאֶנָּה הַכֹּהֵן
  choice: священник осмотрит поражённое место
  rationale: Глагол «видеть» в контексте предписанного священнического обследования означает внимательный осмотр; явное «поражённое место» делает женский объект понятным по-русски.
- source_word: וְהִנֵּה
  choice: и увидит, что
  rationale: Осмотровая формула передана естественной современной русской конструкцией, отмечающей установленный при осмотре факт.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: на нём нет белых волос
  rationale: Сохраняется конкретный диагностический признак; русский предлог «на» здесь естественнее буквального «в».
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: оно не углублено по сравнению с кожей
  rationale: Передаёт буквальный пространственный признак — поражение не ниже поверхности кожи — без придания ему дополнительного медицинского толкования.
- source_word: וְהִיא כֵהָה
  choice: и поблекло
  rationale: כֵהָה указывает на ослабленную, менее заметную окраску; «поблекло» естественно описывает внешний вид пятна и сохраняет отличие от следующего диагноза.
- source_word: וְהִסְגִּירוֹ
  choice: то священник изолирует этого человека
  rationale: Глагол означает отделение или помещение под наблюдение, а мужское местоименное окончание относится к человеку, а не к поражённому месту.
- source_word: שִׁבְעַת יָמִים
  choice: на семь дней
  rationale: Прямое и естественное обозначение срока.
