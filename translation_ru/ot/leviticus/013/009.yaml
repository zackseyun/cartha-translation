  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: ru
  text: Если у человека появится проказное поражение[a], его приведут к священнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово צָרַעַת (цараат), традиционно передаваемое словом «проказа», могло обозначать различные кожные заболевания или поражения, а не только заболевание, известное сегодня как болезнь Хансена.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: поражение
  rationale: В диагностическом контексте Левита 13 слово обозначает видимое болезненное изменение; «поражение» точно и естественно, не сужая значение до инфекции.
- source_word: צָרַעַת
  choice: проказа
  rationale: Сохранён традиционный и узнаваемый русский эквивалент, но его более широкий древнееврейский смысл пояснён в сноске, чтобы не отождествлять термин исключительно с современной болезнью Хансена.
- source_word: כִּי תִהְיֶה
  choice: когда … появится
  rationale: כִּי вводит предусмотренный законом случай, а русское «появится» естественно передаёт возникновение у человека диагностируемого поражения, не меняя процедурного смысла.
- source_word: בְּאָדָם
  choice: у человека
  rationale: В данном общем правовом случае אָדָם означает человека как представителя человеческого рода; русская конструкция «у человека» идиоматична для обозначения заболевания.
- source_word: וְהוּבָא אֶל הַכֹּהֵן
  choice: его приведут к священнику
  rationale: Неопределённо-личная русская конструкция сохраняет пассивный смысл и обязательную процедурную последовательность, не добавляя не названного в тексте исполнителя.
theological_decisions:
- issue: Объём значения צָרַעַת
  choice: проказа с пояснительной сноской
  alternative: кожная болезнь; цараат
  rationale: Традиционное название сохраняет связь с библейской лексикой, а сноска предотвращает неоправданное медицинское отождествление с одной современной болезнью.
- issue: Обобщающее значение אָדָם
  choice: человек
  alternative: мужчина
  rationale: Контекст устанавливает общий порядок для заболевшего человека и не указывает специально на мужской пол; «человек» передаёт родовое значение русского и древнееврейского слов.
translation_notes:
  register: Современный литературный русский язык с краткой формулировкой, соответствующей стилю правового предписания. Традиционный термин сопровождается пояснением; синтаксис остаётся ясным для обычного читателя.
