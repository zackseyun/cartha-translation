revisions:
- from: 'И осмотрит его священник[a], и вот: поражённое место стало белым. Тогда священник объявит поражённое место чистым[b]. Оно чисто.'
  to: 'И священник осмотрит его[a]; и вот: поражённый участок стал белым. Тогда священник объявит поражённый участок чистым[b]; он чист[c].'
  rationale: Исправлены неверная отсылка в существующем примечании и потеря грамматико-контекстной неоднозначности в заключительной формуле. «Поражённый участок» выбран вместо среднего рода «поражённое место», чтобы русское «он» могло, как и еврейское הוּא, соотноситься либо с человеком, либо с поражением. Смысл ритуального решения и повтор исходного термина сохранены.
