  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: ru
  text: 'И священник осмотрит его[a]; и вот: поражённый участок стал белым. Тогда священник объявит поражённый участок чистым[b]; он чист[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидит его». В данном контексте глагол обозначает священнический осмотр. Местоимение может относиться к человеку, пришедшему к священнику в предыдущем стихе, либо формально — к поражению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «признает поражённый участок чистым». Священник выносит решение о ритуальной чистоте, а не исцеляет поражение.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «чист он». Мужское местоимение может относиться к человеку, которого осматривают, либо к поражённому участку (евр. נגע, мужского рода).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: осмотрит его
  rationale: Глагол ראה буквально означает «увидеть», но в контексте священнической проверки обозначает осмотр. Мужское местоимение сохранено и отнесено к נגע.
- source_word: הַנֶּגַע
  choice: поражённое место
  rationale: נגע здесь обозначает видимый поражённый участок, подлежащий осмотру, без навязывания современного медицинского диагноза.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательный дискурсивный маркер, обращающий внимание на результат осмотра.
- source_word: נֶהְפַּךְ ... לְלָבָן
  choice: стало белым
  rationale: Естественно передаёт изменение состояния и цвета, выраженное формой нифаль и לְלָבָן.
- source_word: וְטִהַר
  choice: объявит ... чистым
  rationale: В данном контексте священник выносит решение о ритуальном статусе, а не исцеляет или физически очищает поражённое место.
- source_word: טָהוֹר הוּא
  choice: Оно чисто
  rationale: Сохраняет отдельную итоговую формулу и мужской род еврейского местоимения через соотнесение с существительным «место».
theological_decisions:
- issue: Характер действия священника в законах о чистоте
  choice: Священник объявляет поражённое место чистым.
  alternative: Священник очищает поражённое место.
  rationale: В Левите 13 священник осматривает и устанавливает ритуальный статус; текст не описывает совершаемое им исцеление или физическое очищение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Повтор «поражённое место» сохраняет ясность и соответствует повтору הַנֶּגַע; формула «Оно чисто» передаёт краткость и категоричность еврейского заключения.
