    issue: Примечание a неверно утверждает, что «его» относится к נגע.
    rationale: В ст. 16 поражённый человек приходит к священнику, а в ст. 17 священник «видит его». Хотя суффикс формально может быть соотнесён и с мужским נגע, однозначно относить его к поражённому месту нельзя.
  - severity: medium
    issue: «Оно чисто» устраняет исходную референциальную неоднозначность טָהוֹר הוּא.
    rationale: Мужское местоимение в еврейском тексте может относиться к человеку или к мужскому существительному נגע. Выбор мужского «он» при мужском «участок» позволяет сохранить оба возможных антецедента; примечание делает это явным.
