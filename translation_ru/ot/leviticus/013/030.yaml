base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: ru
  text: Священник осмотрит поражённое место и увидит, что оно кажется глубже кожи и что в нём есть тонкие жёлтые волосы; тогда священник объявит этого человека нечистым. Это парша[a] — кожная болезнь[b] головы или бороды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское נֶתֶק обозначает особое поражение головы или бороды; точное соответствие современному медицинскому диагнозу неизвестно.
    reason: lexical_alternative
  - marker: b
    text: Еврейское צָרַעַת — широкое обозначение серьёзного поражения кожи; оно не обязательно означает проказу в современном смысле (болезнь Хансена).
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: поражённое место
  rationale: В данном контексте это видимый участок, который осматривает священник. Такой перевод конкретен и не придаёт слову значения раны, язвы или эпидемии.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: оно на вид глубже кожи
  rationale: Передаёт диагностическое описание внешнего вида поражения, не уточняя без достаточных оснований, было ли оно впалым или проникало под кожу.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: тонкие жёлтые волосы
  rationale: Сохраняет оба признака — жёлтый цвет и тонкость волос; единственное число в еврейском может иметь собирательное значение.
- source_word: וְטִמֵּא אֹתוֹ
  choice: объявит этого человека нечистым
  rationale: Священник выносит заключение о ритуальном состоянии человека, а не делает его нечистым.
- source_word: נֶתֶק
  choice: парша
  rationale: Это отдельное название поражения головы или бороды. «Парша» кратко и узнаваемо передаёт категорию, а медицинская неопределённость отмечена в сноске.
- source_word: צָרַעַת
  choice: кожная болезнь
  rationale: Древнееврейское слово обозначает более широкую категорию поражений, чем современная болезнь Хансена; перевод избегает медицинского анахронизма.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: головы или бороды
  rationale: Сохраняет близкую к оригиналу локализацию заболевания без интерпретирующего сужения слова «голова» до «кожи головы».
theological_decisions:
- issue: Характер провозглашаемой нечистоты
  choice: объявит этого человека нечистым
  alternative: сделает его нечистым
  rationale: Форма выражает священническое определение ритуального статуса на основании осмотра, а не причинение нечистоты.
translation_notes:
  register: Современный литературный русский язык с близким следованием диагностической формулировке оригинала. Оборот «и вот» сохраняет וְהִנֵּה и подчёркивает обнаруженный при осмотре признак; терминология остаётся понятной без неоправданной современной медицинской конкретизации.
