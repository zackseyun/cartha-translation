lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте предписанной диагностики глагол означает целенаправленный осмотр, а не просто зрительное восприятие.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное обозначение уполномоченного служителя в законах о ритуальной чистоте.
- source_word: וְהִנֵּה
  choice: если
  rationale: 'В данной формуле казуистического закона вводит обнаруженные при осмотре признаки; русское «если» естественно передаёт условно-диагностическое построение, хотя буквально выражение указывает: «вот».'
- source_word: שְׂאֵת לְבָנָה
  choice: белая припухлость
  rationale: שְׂאֵת здесь — техническое обозначение приподнятого кожного поражения; «припухлость» понятно и сохраняет его физический характер.
- source_word: בָּעוֹר
  choice: на коже
  rationale: Естественное русское обозначение места проявления кожного поражения; еврейский предлог допускает понимание «на/в коже».
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: которая сделала волос белым
  rationale: Женское местоимение относится к припухлости; формулировка сохраняет её как грамматический субъект и передаёт изменение цвета волоса.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: и в припухлости — участок живой плоти
  rationale: Буквально выражение содержит «живую плоть» и обозначает видимую область живой ткани внутри поражения; «участок» делает медицинско-диагностический смысл ясным, не устраняя буквальный образ.
- source_word: בַּשְׂאֵת
  choice: в припухлости
  rationale: Повтор того же термина сохраняет лексическую связность и точно указывает местонахождение живой ткани.
