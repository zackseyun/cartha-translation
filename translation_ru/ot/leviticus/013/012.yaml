id: LEV.13.12
reference: Leviticus 13:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: ru
  text: Если же кожное поражение[a] широко распространится по коже и покроет всю кожу поражённого[b] — с головы до ног, насколько может видеть священник,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское צָרַעַת (цараат) в книге Левит обозначает различные ритуально значимые поражения кожи и не сводится к современной проказе (болезни Хансена).
    reason: cultural_note
  - marker: b
    text: 'Буквально: «всю кожу поражения». Еврейское выражение относится к коже человека, охваченной поражением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: широко распространится
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает идею распространения. «Широко распространится» естественно передаёт интенсивность и обширность процесса.
- source_word: הַצָּרַעַת
  choice: кожное поражение
  rationale: Термин צָרַעַת в Левите охватывает ряд ритуально значимых поражений и не должен без оговорок отождествляться с современной болезнью Хансена. «Кожное поражение» ясно и не создаёт ложной медицинской точности.
- source_word: בָּעוֹר
  choice: по коже
  rationale: Предлог ב здесь обозначает поверхность, по которой распространяется поражение; русское «по коже» естественно сочетается с глаголом «распространится».
- source_word: וְכִסְּתָה
  choice: и покроет
  rationale: 'В условной конструкции форма продолжает описание возможного развития: поражение распространяется и покрывает кожу. Будущее время естественно согласуется с русским «если».'
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: всю кожу поражённого
  rationale: Буквально выражение допускает передачу «всю кожу поражения», но по контексту речь идёт о коже человека, охваченной поражением. Основной текст делает референт понятным, а буквальная особенность отмечена в сноске.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: с головы до ног
  rationale: Устойчивый меризм выражает полную протяжённость по телу; русская формула точно и естественно передаёт этот смысл.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: насколько может видеть священник
  rationale: Буквальный оборот о «всём видимом глазам священника» означает всю доступную ему при осмотре область. Выбранная формулировка передаёт предел непосредственного наблюдения.
