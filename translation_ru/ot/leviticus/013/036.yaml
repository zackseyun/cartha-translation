base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: ru
  text: 'Если священник осмотрит его и увидит, что это поражение кожи[a] распространилось по коже, священнику не нужно проверять наличие жёлтых волос: этот человек нечист.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает особое шелушащееся поражение, преимущественно волосистой части головы или бороды; его точное соответствие современным медицинским диагнозам неизвестно.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: если священник осмотрит его
  rationale: В контексте священнического освидетельствования ראה означает не просто зрительное восприятие, а осмотр; условное «если» естественно передаёт синтаксическую связь с предшествующим постановлением.
- source_word: וְהִנֵּה
  choice: и увидит, что
  rationale: Передаёт указание на обнаруженный при осмотре факт без неестественного для современного русского оборота «и вот».
- source_word: פָּשָׂה
  choice: распространилась
  rationale: Обычное значение глагола в предписаниях Левита о расширении кожного поражения.
- source_word: הַנֶּתֶק
  choice: парша
  rationale: Краткое традиционное обозначение особого шелушащегося поражения волосистой части головы или бороды; примечание предупреждает, что точный современный диагноз неизвестен.
- source_word: בָּעוֹר
  choice: по коже
  rationale: Русский оборот естественно описывает распространение поражения, хотя еврейский предлог буквально может передаваться как «в коже».
- source_word: לֹא יְבַקֵּר
  choice: не нужно искать
  rationale: Отрицание указывает, что после установления распространения поражения дополнительная проверка этого диагностического признака не требуется.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: жёлтый волос
  rationale: Единственное число соответствует собирательно-диагностическому употреблению в контексте и прямо передаёт цветовой признак.
- source_word: טָמֵא הוּא
  choice: этот человек нечист
  rationale: Местоимение относится к осматриваемому человеку, а не только к поражению; явное существительное устраняет возможную русскую двусмысленность.
theological_decisions:
- issue: Значение טָמֵא в законах о чистоте
  choice: нечист
  alternative: ритуально нечист; осквернён
  rationale: Здесь определяется статус человека согласно священническому закону, а не его нравственная виновность. «Нечист» сохраняет установленную библейскую терминологию, не добавляя в основной текст пояснения, уже задаваемого контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным тоном законодательного текста. Сохранена последовательность диагностического предписания, но буквальное «и вот» передано естественным русским оборотом.
