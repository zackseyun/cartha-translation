revisions:
- from: Если священник осмотрит очаг чешуйчатого поражения[a] и увидит, что тот на вид не углублён в кожу и что в нём нет чёрных волос, то священник должен изолировать человека с этим поражением на семь дней.
  to: Если священник осмотрит очаг чешуйчатого поражения[a] и обнаружит, что тот не выглядит углублённым относительно кожи и что в нём нет чёрных волос, то священник должен изолировать человека с этим поражением на семь дней.
  rationale: Исправлена формулировка диагностического признака, чтобы передать зрительно воспринимаемую «углублённость» поражения по отношению к коже, а не проникновение в неё. Также устранена лёгкая стилистическая тавтология. Остальные решения, включая метонимическую передачу изоляции поражённого человека, сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:38:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Переданы условная процедура осмотра, отсутствие видимой углублённости поражения относительно кожи, отсутствие чёрных волос и семидневная изоляция. Однако формулировка «не углублён в кожу» неточно и несколько неестественно передаёт מַרְאֵהוּ עָמֹק מִן־הָעוֹר: речь идёт о том, как поражение выглядит по отношению к уровню кожи.'
  naturalness: Текст в целом современный и ясный. Сочетание «осмотрит ... и увидит» избыточно; «обнаружит» естественнее передаёт הנה («вот/и вот оказывается») в контексте осмотра. «Не выглядит углублённым относительно кожи» точнее и литературнее.
  terminology: «Очаг чешуйчатого поражения» и сноска корректно сохраняют осторожность относительно נֶתֶק. «Чёрные волосы» следует сохранить буквально. «Изолировать человека с этим поражением» — допустимая естественная передача того, что в еврейском выражено метонимически через «поражённый участок».
  issues:
  - severity: medium
    issue: Неточная передача пространственного признака
    rationale: «Не углублён в кожу» может означать проникновение поражения внутрь кожи. Еврейский текст говорит, что его вид не является более глубоким, чем кожа, то есть оно не выглядит углублённым относительно её поверхности.
  - severity: low
    issue: Стилистическая избыточность «осмотрит ... и увидит»
    rationale: Вторая глагольная форма передаёт הנה как констатацию результата осмотра; «обнаружит» делает русскую фразу плавнее, не меняя смысла.
  revised_text: Если священник осмотрит очаг чешуйчатого поражения[a] и обнаружит, что тот не выглядит углублённым относительно кожи и что в нём нет чёрных волос, то священник должен изолировать человека с этим поражением на семь дней.
