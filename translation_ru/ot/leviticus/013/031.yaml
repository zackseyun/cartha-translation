base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: ru
  text: Если священник осмотрит очаг чешуйчатого поражения[a] и обнаружит, что тот не выглядит углублённым относительно кожи и что в нём нет чёрных волос, то священник должен изолировать человека с этим поражением на семь дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очаг парши»; точный характер обозначенного еврейским словом נֶתֶק поражения кожи головы или бороды неизвестен.'
    reason: Лексическая альтернатива и неопределённость древнего медицинского термина.
lexical_decisions:
- source_word: נֶגַע
  choice: очаг поражения
  rationale: В контексте осмотра это видимый поражённый участок, а не «чума» в современном смысле; слово «очаг» естественно передаёт локализованный характер признака.
- source_word: נֶתֶק
  choice: чешуйчатое поражение
  rationale: Точный медицинский диагноз неизвестен; выражение обозначает особое поражение головы или бороды, связанное с изменением либо выпадением волос. Выбор понятен современному читателю, а лексическая неопределённость отмечена в сноске.
- source_word: מַרְאֵהוּ
  choice: тот на вид
  rationale: Передаёт зрительно определяемый внешний вид поражённого участка и естественно сочетается с процедурой осмотра.
- source_word: עָמֹק מִן־הָעוֹר
  choice: не углублён в кожу
  rationale: Сохраняет пространственный диагностический признак еврейского текста — поражение не выглядит уходящим глубже поверхности кожи.
- source_word: שֵׂעָר שָׁחֹר
  choice: чёрные волосы
  rationale: Точно сохраняет названный в еврейском тексте цвет волос, являющийся частью диагностического критерия.
- source_word: וְהִסְגִּיר
  choice: должен изолировать человека
  rationale: Глагол обозначает временное отделение для дальнейшего наблюдения. Хотя формальным объектом в еврейском тексте является поражение, практически изолируют поражённого человека; это естественная передача подразумеваемой метонимии.
- source_word: שִׁבְעַת יָמִים
  choice: на семь дней
  rationale: Естественное русское обозначение срока изоляции.
- source_word: וְכִי
  choice: Если
  rationale: В русском условное начало достаточно ясно связывает данный случай с продолжающимся сводом предписаний; начальное «и» было опущено ради естественности.
- source_word: יִרְאֶה
  choice: осмотрит
  rationale: В юридико-диагностическом контексте глагол «видеть» обозначает целенаправленный священнический осмотр.
theological_decisions: []
