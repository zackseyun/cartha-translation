source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: ru
  text: Он должен сжечь одежду, основу или уток[a] из шерсти или льна либо любое кожаное изделие, на котором есть поражение, потому что это разъедающая цараат[b]; его следует сжечь в огне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Основа — продольные нити ткани, уток — поперечные.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «цараат», традиционно переводимое как «проказа», обозначает более широкую категорию ритуально оскверняющего поражения, чем современная проказа (болезнь Хансена); в этой главе оно относится также к одежде, кожаным изделиям и домам.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Пусть он сожжёт
  rationale: В последовательности предписаний форма с союзом выражает очередное обязательное действие; такая конструкция естественно передаёт предписывающую силу по-русски.
- source_word: הַבֶּגֶד
  choice: одежду
  rationale: בגד — общее обозначение одежды; контекст допускает предмет одежды как целое, в отличие от отдельно названных нитей основы и утка.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: основу или уток
  rationale: 'Это парные технические термины ткачества: продольные и поперечные нити ткани. Русские «основа» и «уток» являются их стандартными соответствиями.'
- source_word: בַּצֶּמֶר אוֹ בַפִּשְׁתִּים
  choice: из шерсти или льна
  rationale: Предлог обозначает материал; в современном русском «из шерсти или льна» яснее и естественнее буквального воспроизведения конструкции.
- source_word: כָּל כְּלִי הָעוֹר
  choice: любое кожаное изделие
  rationale: כלי здесь широко обозначает предмет или изделие, а не обязательно сосуд; «кожаное изделие» сохраняет эту широту.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: на котором есть поражение
  rationale: נגע в этой главе обозначает наблюдаемый признак поражения. Формулировка не приписывает ему конкретной современной медицинской природы.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: губительная проказа
  rationale: «Проказа» сохраняет традиционно узнаваемую связь с особой левитской категорией צרעת, а «губительная» передаёт ממארת как стойкое, разрушительное поражение. Сноска предохраняет от отождествления с современной болезнью Хансена.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: Всё это следует сжечь в огне
  rationale: Страдательная форма выражает обязательный результат. «Всё это» естественно охватывает любой из перечисленных предметов и устраняет двусмысленность русского местоимения по роду.
theological_decisions:
- issue: Передача צָרַעַת в законах о ритуальной нечистоте
  choice: проказа с пояснительной сноской
  alternative: цараат; заразное поражение; кожная болезнь
  rationale: Термин обозначает более широкую левитскую категорию, чем современная проказа, и применяется также к тканям и домам. Традиционное слово сохраняет межтекстовую связь и непривычность самого образа, а сноска прямо исключает ошибочную медицинскую идентификацию.
translation_notes:
  register: Современный литературный русский язык с ясной предписывающей формой. Технические ткацкие термины сохранены и кратко объяснены; традиционный термин «проказа» сопровождается необходимым культурно-медицинским уточнением.
