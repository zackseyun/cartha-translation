revisions:
- from: Пусть он сожжёт одежду, основу или уток[a] из шерсти или льна либо любое кожаное изделие, на котором есть поражение, потому что это губительная проказа[b]. Всё это следует сжечь в огне.
  to: Он должен сжечь одежду, основу или уток[a] из шерсти или льна либо любое кожаное изделие, на котором есть поражение, потому что это разъедающая цараат[b]; его следует сжечь в огне.
  rationale: 'Перевод уточнён прежде всего в передаче צָרַעַת: транслитерация «цараат» не навязывает современный медицинский диагноз и естественнее в стихе о предметах, а сноска сообщает традиционный перевод и необходимый культурный контекст. «Разъедающая» точнее передаёт מַמְאֶרֶת. Ткацкие термины и структура перечисления сохранены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:38:48Z'
review_pass:
  verdict: revise
  source_fidelity: В целом перечисление предметов и предписание сжечь переданы верно. Однако «проказа» в самом тексте неоправданно медицински конкретна и в данном контексте (поражение ткани и кожи) по-русски особенно вводит в заблуждение. Кроме того, «губительная» несколько сильнее и менее точно передаёт מַמְאֶרֶת, чем «разъедающая/разрушительная»; уместнее сохранить неопределённость как «разъедающая цараат».
  naturalness: Текст в целом литературный. «Пусть он сожжёт» приемлемо в законодательном контексте, но «он должен сжечь» чуть прямее. «Всё это следует сжечь» естественно, но не нужно добавлять «всё», поскольку еврейское местоимение относится к каждому затронутому предмету; «его следует сжечь» достаточно и согласуется с собирательным перечислением.
  terminology: «Основа» и «уток» — точная стандартная пара ткацких терминов; сноска полезна. Для צָרַעַת лучше транслитерировать «цараат» и пояснить в сноске, поскольку это не болезнь кожи в данном стихе и не современная проказа. «Поражение» удачно передаёт נגע.
  issues:
  - severity: medium
    issue: «Проказа» как основной перевод צָרַעַת
    rationale: Слово обычно вызывает представление о человеческой болезни, тогда как здесь речь идёт об одежде, тканой основе/утке и кожаном предмете. Сноска смягчает проблему, но не устраняет неестественное и потенциально ложное медицинское значение в основном тексте. Транслитерация сохраняет техническую левитскую категорию без излишней конкретизации.
  - severity: low
    issue: «Губительная» для מַמְאֶרֶת
    rationale: Это возможная передача, но русское «разъедающая» лучше выражает идею губительного, разрушающего поражения и не придаёт абстрактно-катастрофического оттенка.
  - severity: low
    issue: Формулировка завершающего предписания
    rationale: «Всё это» — допустимое разъяснение, но отсутствует в оригинале. Нейтральное «его следует сжечь в огне» точнее сохраняет референцию к любому предмету из перечня.
