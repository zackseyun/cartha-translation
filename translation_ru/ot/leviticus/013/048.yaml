  text: א֤וֹ בִֽ/שְׁתִי֙ א֣וֹ בְ/עֵ֔רֶב לַ/פִּשְׁתִּ֖ים וְ/לַ/צָּ֑מֶר א֣וֹ בְ/ע֔וֹר א֖וֹ בְּ/כָל מְלֶ֥אכֶת עֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: ru
  text: или на продольных, или на поперечных нитях льняной или шерстяной ткани, или на коже, или на любом изделии из кожи —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: продольные нити
  rationale: Термин обозначает нити основы, идущие вдоль ткани. Описательный вариант понятнее современному широкому читателю, чем специальное «основа» без пояснения.
- source_word: עֵרֶב
  choice: поперечные нити
  rationale: Термин обозначает уток — поперечные нити, переплетаемые с основой. Формулировка сохраняет противопоставление направлений и остаётся общепонятной.
- source_word: לַפִּשְׁתִּים
  choice: льняная ткань
  rationale: Хотя פִּשְׁתִּים буквально может обозначать лён, контекст ткачества указывает на льняной материал.
- source_word: וְלַצָּמֶר
  choice: шерстяная ткань
  rationale: צֶמֶר означает шерсть; добавление слова «ткань» естественно по-русски и связывает материал с упомянутыми нитями.
- source_word: עוֹר
  choice: кожа
  rationale: В контексте изготовленных предметов речь, вероятнее всего, идёт о коже как материале, а не о шкуре на туше.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: на любом изделии из кожи
  rationale: מְלָאכָה здесь обозначает изготовленную вещь или продукт ремесла. Перевод передаёт конкретный предметный смысл естественным современным русским языком.
- source_word: אוֹ ... אוֹ
  choice: или ... или
  rationale: Повтор союза сохраняет структуру еврейского перечня альтернатив.
theological_decisions: []
