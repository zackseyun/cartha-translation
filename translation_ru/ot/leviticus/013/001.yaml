  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве[a] Моисею и Аарону:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон), личное имя Бога; в традиционных переводах обычно передаётся как «Господь».'
    reason: Уточнение еврейской формы божественного имени и традиционной передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … обратился
  rationale: Последовательная форма глагола דבר вводит новое речевое событие. «Обратился» естественно передаёт направленную к названным адресатам речь и сохраняет несколько более официальный оттенок, чем простое «сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: к Моисею и Аарону
  rationale: Предлог אֶל отмечает адресатов речи; в русском языке при однородных членах повтор предлога не требуется.
- source_word: לֵאמֹר
  choice: 'со словами:'
  rationale: Инфинитив вводит содержание последующей речи. Русская формула «со словами» и двоеточие естественно связывают стих со следующим высказыванием без архаичного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Передача «Яхве» сохраняет различие между личным именем и титулом, а примечание сообщает о традиционной замене.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной формулы. Оборот «обратился … со словами» избегает как разговорного оттенка, так и архаичного «говоря».
