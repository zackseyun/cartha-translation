  source_fidelity: Черновик верно передаёт предписание обриться, запрет брить נתק и повторный семидневный срок. Однако буквальное «священник изолирует поражённое место» в русском звучит так, будто можно изолировать участок кожи, тогда как в контексте глагол обозначает помещение человека под наблюдение; прямое дополнение «поражение» в еврейском, вероятно, метонимично. Исправленный текст естественно передаёт подразумеваемый объект, а буквальность отмечает в сноске.
