  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: ru
  text: Пусть он обреется, но поражённое место[a] брить не должен; затем священник вновь изолирует его[b] на семь дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает особое поражение кожи головы или бороды, обычно сопровождавшееся выпадением волос; точный характер заболевания неясен.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «священник изолирует поражённое место». В данном предписании это, по-видимому, означает изоляцию человека с этим поражением для повторного осмотра.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: Пусть он обреется
  rationale: 'Хитпаэль глагола גלח имеет возвратное значение: человек должен обриться сам или распорядиться, чтобы его обрили. Формулировка естественна для современной русской правовой инструкции.'
- source_word: הַנֶּתֶק
  choice: поражённое место
  rationale: В Лев 13 נֶתֶק обозначает особое поражение кожи головы или бороды, связанное с выпадением волос; нейтральное выражение не сводит его к зуду или шелушению и сохраняет диагностическую неопределённость древнего термина.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: но поражённое место не бреет
  rationale: Еврейский текст прямо называет נתק объектом, который не следует брить. Перевод не заменяет это указанием брить вокруг него, хотя такой практический смысл возможен.
- source_word: וְהִסְגִּיר
  choice: затем ... изолирует
  rationale: В данном ритуально-диагностическом контексте глагол означает временное отделение для наблюдения. «Изолирует» понятно современному читателю и не вводит более узкое понятие медицинского карантина.
- source_word: שֵׁנִית
  choice: ещё
  rationale: Наречие указывает на повторный семидневный срок; по-русски «ещё на семь дней» естественно и ясно передаёт второй период изоляции.
