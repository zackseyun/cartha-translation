  terminology: «Поражённое место» остаётся нейтральным обозначением נתק и не предрешает характер кожного заболевания. «Священник» и «изолирует» соответствуют ритуально-процедурному контексту. Не следует называть состояние чесоткой, паршой или конкретной болезнью.
