    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: появится
  rationale: В предписании о распознавании поражения глагол указывает на возникновение признака на месте прежнего нарыва; «появится» естественно передаёт этот смысл.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: на месте нарыва
  rationale: Естественное русское обозначение участка, где прежде был нарыв; שְׁחִין передано как воспалённая гнойная опухоль кожи.
- source_word: שְׂאֵת לְבָנָה
  choice: белая припухлость
  rationale: שְׂאֵת в Лев 13 обозначает приподнятое поражение кожи; «припухлость» ясно и естественно передаёт этот признак.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: красновато-белое светлое пятно
  rationale: Сохранены как светлый характер пятна, так и сочетание белого с красноватым оттенком; порядок слов приспособлен к современному русскому.
- source_word: וְנִרְאָה אֶל־הַכֹּהֵן
  choice: то это место нужно показать священнику
  rationale: Контекст требует представить поражённый участок для осмотра; безличная конструкция естественно передаёт предписывающую силу фразы, не устраняя буквальной возможности «быть увиденным».
