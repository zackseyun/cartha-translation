translation:
  language: ru
  text: 'Священник осмотрит его, и вот: припухлость поражённого участка на лысине сзади или на лысине спереди[b] — белая с красноватым оттенком, по виду похожая на кожное заболевание[a] на коже тела,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское צָרַעַת традиционно переводят словом «проказа», однако в книге Левит оно обозначает более широкий круг кожных поражений, а не только болезнь Хансена.
    reason: lexical_alternative
  - marker: b
    text: Два еврейских слова, обозначающих облысение, вероятно, различают заднюю и переднюю части головы; это различие передано словами «лысина сзади» и «лысина спереди».
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте священнического освидетельствования глагол ראה означает не просто зрительное восприятие, а внимательный осмотр.
- source_word: וְהִנֵּה
  choice: и если … окажется
  rationale: В русском правовом описании наблюдаемый признак естественно передаётся условно-результативной конструкцией; она сохраняет функцию הִנֵּה как указания на обнаруженное при осмотре, хотя не воспроизводит его буквально словом «вот».
- source_word: שְׂאֵת הַנֶּגַע
  choice: припухлость поражённого места
  rationale: שְׂאֵת обозначает приподнятость или припухлость, а נֶגַע — поражение; формулировка передаёт оба понятия без неестественного сочетания «припухлость заболевания».
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: белой с красноватым оттенком
  rationale: Переданы оба цветовых признака, причём редуплицированная форма אֲדַמְדֶּמֶת выражена как красноватый оттенок.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: на лысине сзади или на лысине спереди
  rationale: Сохранено вероятное различие между облысением задней и передней части головы, не превращая его в более точную анатомическую классификацию, чем допускает древнееврейский текст.
- source_word: צָרַעַת
  choice: кожное заболевание
  rationale: Традиционное «проказа» слишком узко связывает слово с болезнью Хансена; в Левите термин охватывает более широкую категорию поражений.
- source_word: עוֹר בָּשָׂר
  choice: на коже тела
  rationale: Естественно передаёт сочетание «кожа плоти», сохраняя телесную локализацию и отличие от поражений на иных поверхностях в Левите 13.
