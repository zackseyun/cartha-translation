  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: ru
  text: 'Но если оно действительно распространится по коже, священник объявит его нечистым[a]: это поражение[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признает его нечистым». Речь идёт об официальном определении ритуального статуса.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «болезнь», «язва» или «поражённое место». Еврейское слово имеет широкое значение и не соответствует какому-либо одному современному медицинскому диагнозу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз с условной частицей вводит случай, противопоставленный предыдущему; «но если» естественно передаёт этот переход.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: всё же распространится
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагольное значение. Частица «всё же» передаёт эмфазу без тяжеловесного буквального повтора.
- source_word: בָּעוֹר
  choice: по коже
  rationale: עוֹר означает «кожа»; в русском описании кожного поражения распространение естественно обозначается сочетанием «по коже».
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: священник объявит его нечистым
  rationale: В священническом правовом контексте Piel глагола טמא означает официальное установление и провозглашение ритуального статуса, а не причинение нечистоты.
- source_word: נֶגַע הִוא
  choice: это поражение
  rationale: נֶגַע — широкий термин для поражения, язвы или болезненного проявления; «поражение» сохраняет широту значения и не навязывает современный медицинский диагноз.
theological_decisions:
- issue: Характер решения священника о нечистоте
  choice: Священник объявляет человека нечистым, то есть официально устанавливает его ритуальный статус.
  alternative: Священник делает человека нечистым.
  rationale: Контекст предписанной священнику диагностики указывает на авторитетное признание статуса, а не на то, что слова священника сами причиняют нечистоту.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой закона. Местоимение «оно» сохраняет связь с кожным проявлением из предшествующего контекста; терминология не приписывает тексту современную медицинскую точность.
