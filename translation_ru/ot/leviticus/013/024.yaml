base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: ru
  text: Или если у человека на коже будет ожог от огня и живая ткань на месте ожога станет[a] светлым пятном — красновато-белым или белым,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живая ткань ожога». Еврейское выражение обозначает живую, обнажённую ткань, видимую в области ожога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Или если
  rationale: Вводит ещё один возможный случай в последовательности предписаний; условная форма естественна для русского законодательного изложения.
- source_word: בָשָׂר ... בְּעֹרוֹ
  choice: на коже тела
  rationale: בָשָׂר здесь обозначает тело или телесную ткань, а בְּעֹרוֹ — его кожу. Формулировка сохраняет оба элемента и избегает неестественного «плоть».
- source_word: מִכְוַת אֵשׁ
  choice: ожог от огня
  rationale: Точно и естественно передаёт ожог, причинённый огнём.
- source_word: וְהָיְתָה
  choice: станет
  rationale: В описании диагностического случая обозначает возникновение указанного признака.
- source_word: מִחְיַת הַמִּכְוָה
  choice: поражённое место ожога
  rationale: Выражение указывает на живую или обнажённую ткань в области ожога. В данном контексте «поражённое место» звучит естественно, не внося излишне конкретного медицинского диагноза.
- source_word: בַּהֶרֶת
  choice: блестящим пятном
  rationale: В Левите 13 обозначает заметное светлое или блестящее пятно на коже; этот термин сохраняет зрительный характер признака.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: красновато-белым
  rationale: Передаёт сочетание белого и красноватого оттенков без устранения необычной цветовой характеристики оригинала.
- source_word: אוֹ לְבָנָה
  choice: или белым
  rationale: Прямо сохраняет альтернативное описание цвета.
