base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: ru
  text: 'На седьмой день священник осмотрит поражённое место, и вот: чешуйчатое поражение[a] не распространилось, в нём нет жёлтых волос и на вид оно не глубже кожи,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское נֶתֶק обозначает особое поражение волосистой части головы или бороды; его точный медицинский характер неясен. В традиционных переводах встречается «парша».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: осмотрит
  rationale: В контексте священнического освидетельствования глагол означает целенаправленный осмотр, а не просто зрительное восприятие.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное обозначение уполномоченного лица, проводящего осмотр по предписаниям Левита.
- source_word: הַנֶּגַע
  choice: поражённое место
  rationale: Широкое значение נֶגַע передано без привязки к конкретному современному диагнозу; здесь речь идёт об осматриваемом участке.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: на седьмой день
  rationale: Прямо передаёт назначенное время повторного осмотра.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохранён указательный дискурсивный оборот, вводящий результаты осмотра.
- source_word: לֹא פָשָׂה
  choice: не распространилось
  rationale: В описаниях кожных поражений פשׂה обозначает распространение по коже.
- source_word: הַנֶּתֶק
  choice: чешуйчатое поражение
  rationale: Передаёт особый вид поражения волосистой части головы или бороды, не навязывая спорный современный медицинский диагноз; более понятно современному читателю, чем архаичное «парша».
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: жёлтых волос на нём нет
  rationale: Естественно передаёт отсутствие диагностического признака и сохраняет связь волос с поражённым участком.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: и на вид оно не глубже кожи
  rationale: מַרְאֶה указывает на видимое впечатление при осмотре; формулировка сохраняет сравнение с поверхностью кожи и не превращает его в точное измерение.
