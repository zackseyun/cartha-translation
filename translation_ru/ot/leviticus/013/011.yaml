  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: ru
  text: Это застарелое кожное заболевание на его теле. Священник объявит его нечистым; изолировать его не следует, потому что он нечист.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרַעַת
  choice: кожное заболевание
  rationale: Еврейский термин в Левите охватывает различные серьёзные поражения кожи и не обозначает исключительно современную болезнь Хансена; поэтому традиционное «проказа» было бы неоправданно узким.
- source_word: נוֹשֶׁנֶת
  choice: застарелое
  rationale: Причастная форма указывает на давнее, уже длительно существующее состояние; «застарелое» естественно передаёт этот смысл по-русски, не превращая текст в современный медицинский диагноз.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: на коже его тела
  rationale: В данном контексте ב может естественно обозначать локализацию; «тела» звучит современнее и яснее буквального «плоти».
- source_word: וְטִמְּאוֹ
  choice: объявит его нечистым
  rationale: Священник не делает человека нечистым, а официально устанавливает и объявляет его ритуальный статус.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Прямое и общепринятое обозначение культового служителя.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: не станет изолировать его
  rationale: Глагол описывает временное отделение для наблюдения; «изолировать» ясно передаёт процедуру без излишне медицинского оттенка слова «карантин».
- source_word: כִּי טָמֵא הוּא
  choice: потому что тот нечист
  rationale: 'Сохраняется причинное объяснение: дальнейшее наблюдение не требуется, поскольку статус уже установлен; местоимение «тот» устраняет двусмысленность русского «он» после упоминания священника.'
theological_decisions:
- issue: Передача терминологии ритуальной нечистоты
  choice: нечист / объявит нечистым
  alternative: ритуально нечист / объявит ритуально нечистым
  rationale: «Нечист» сохраняет устойчивую библейскую терминологию и не добавляет отсутствующего в самом стихе пояснения; в контексте речь идёт о ритуально-правовом статусе, а не о личной нравственной вине.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис сохранён близким к еврейскому, но устранена местоименная неясность. Терминология не предполагает современного точного медицинского диагноза.
