source:
  edition: WLC
  text: וּ/בְ/י֨וֹם הֵרָא֥וֹת בּ֛/וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/014.yaml
  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: ru
  text: Но в тот день, когда на нём покажется живая плоть, он станет нечистым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּשָׂר חַי
  choice: живая плоть
  rationale: Буквально передаёт сочетание «живая/здоровая плоть» и сохраняет связь с формулировкой предыдущего стиха; речь идёт о живой, необесцвеченной ткани в поражённом месте.
- source_word: בּוֹ
  choice: на нём
  rationale: Местоименный суффикс мужского рода естественно соотнести с человеком, на котором появляется живая плоть; русский предлог «на» ясно выражает место появления признака.
- source_word: יִטְמָא
  choice: он станет нечистым
  rationale: Передаёт состояние ритуальной нечистоты, наступающее при появлении указанного признака, без добавления подразумеваемого исполнителя признания нечистым.
theological_decisions:
- issue: Характер нечистоты
  choice: нечистым
  alternative: осквернённым
  rationale: В контексте священнических предписаний טמא обозначает ритуальный статус; «нечистый» сохраняет установленную библейскую терминологию и не придаёт выражению прежде всего нравственного смысла.
- issue: Референт בּוֹ
  choice: на нём, то есть на человеке
  alternative: в нём/в поражённом месте
  rationale: Грамматический мужской род допускает отнесение к человеку, и это даёт естественный русский текст. При этом по контексту плоть появляется именно в области поражения; смысловая разница невелика и не требует пояснительной вставки.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства законодательного текста. Союз «Но» передаёт контраст וּ; оборот «в тот день, когда» естественно воспроизводит временную конструкцию וּבְיוֹם הֵרָאוֹת.
