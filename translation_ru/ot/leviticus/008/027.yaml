  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: ru
  text: И положил всё это на ладони Аарона и на ладони его сыновей, и совершил ими обряд потрясания пред Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: И положил
  rationale: В данном обрядовом контексте נתן обозначает физическое помещение частей жертвы на ладони, а не передачу во владение.
- source_word: אֶת הַכֹּל
  choice: всё это
  rationale: Выражение охватывает все части, перечисленные в предыдущем стихе; указательное «это» естественно связывает стих с контекстом.
- source_word: עַל כַּפֵּי
  choice: на ладони
  rationale: Сохраняет обычное значение предлога עַל («на») и конкретное значение כַּף («ладонь»); по контексту подразумеваются раскрытые ладони.
- source_word: בָנָיו
  choice: его сыновей
  rationale: Точно передаёт мужской род и родственную связь, существенные в повествовании о посвящении священников.
- source_word: וַיָּנֶף אֹתָם תְּנוּפָה
  choice: и совершил ими потрясание
  rationale: Передаёт однокоренную конструкцию глагола נוף и технического обрядового существительного תְּנוּפָה; местоимение относится к жертвенным частям, а не к людям.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» естественно и торжественно передаёт совершение обряда в присутствии Бога; личное имя передано как «Яхве» согласно проектной норме.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя в исходном тексте и соответствует заданной норме проекта, не подменяя его титулом.
- issue: Референт местоимения אֹתָם
  choice: 'жертвенные части: «ими»'
  alternative: Аарон и его сыновья
  rationale: Ближайший и обрядово осмысленный антецедент — всё положенное на ладони; именно эти части Моисей представляет посредством потрясания.
- issue: Передача תְּנוּפָה
  choice: потрясание
  alternative: жертва потрясания
  rationale: Здесь винительный оборот описывает способ ритуального представления перечисленных частей. «Потрясание» сохраняет технический обрядовый смысл, не добавляя в этот стих прямо отсутствующего слова «жертва».
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксический параллелизм «на ладони Аарона и на ладони его сыновей» сохранён. «Пред Яхве» выбрано как краткая, понятная и достойная формула.
