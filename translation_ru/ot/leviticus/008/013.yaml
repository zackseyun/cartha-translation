  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Затем Моисей подвёл сыновей Аарона[a], одел их в хитоны, опоясал их поясами[b] и повязал им головные уборы — как Яхве[c] повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представил сыновей Аарона». Древнееврейский глагол может означать как «подвести, приблизить», так и «представить» в обрядовой обстановке.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «опоясал их поясом»; имеется в виду, что каждого сына Аарона опоясали его священническим поясом.'
    reason: lexical_alternative
  - marker: c
    text: В древнееврейском тексте стоит имя יהוה (YHWH), традиционно передаваемое как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: подвёл
  rationale: Форма гифиль от קרב означает «приблизить, подвести» и в данном обрядовом контексте может также подразумевать представление посвящаемых. «Подвёл» сохраняет конкретный образ приближения, не превращая его без необходимости в специальный термин.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновей Аарона
  rationale: Прямая и естественная передача древнееврейской сопряжённой конструкции.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: одел их в хитоны
  rationale: Гифиль לבשׁ означает «одеть кого-либо», а כֻּתֹּנֶת — длинную нижнюю или основную одежду рубашечного покроя; «хитон» является устоявшимся русским библейским обозначением.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: опоясал каждого поясом
  rationale: 'חגר означает «опоясывать», а אַבְנֵט обозначает тканый священнический пояс. Единственное число существительного при множественном объекте понято распределительно: каждому был дан свой пояс.'
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: повязал им головные уборы
  rationale: חבשׁ указывает на закрепление или повязывание, а מִגְבָּעוֹת — на особые головные уборы рядовых священников. Нейтральное «головные уборы» не смешивает их с головным убором первосвященника и не уточняет форму сверх источника.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Всё было сделано так, как Яхве повелел Моисею
  rationale: Естественная русская передача повторяющейся формулы точного исполнения повеления. Добавленное «Всё было сделано» эксплицирует подразумеваемое соответствие перечисленных действий, не меняя смысла.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь»; русская форма «Яхве» широко понятна и соответствует проектному решению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие; традиционный вариант указан в примечании.
- issue: Обрядовый смысл וַיַּקְרֵב
  choice: подвёл
  alternative: представил
  rationale: Глагол допускает как пространственный, так и обрядовый оттенок. Основной текст сохраняет образ приближения, а возможное значение «представил» отмечено без превращения неоднозначного слова в однозначный технический термин.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для повествования о священническом посвящении. «Хитоны» сохраняют узнаваемую библейскую лексику; более редкие или искусственно архаические слова вроде «препоясал» и «кидары» не используются. Синтаксис сделан ясным для широкого круга читателей.
