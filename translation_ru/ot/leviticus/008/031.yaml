  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: ru
  text: 'Моисей сказал Аарону и его сыновьям: «Сварите мясо у входа в шатёр встречи и там ешьте его вместе с хлебом, который находится в корзине для посвящения[a], как я повелел, сказав: „Аарон и его сыновья должны есть это“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в корзине приношений посвящения». Еврейское слово относится к обряду посвящения — введения священников в служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: Сварите
  rationale: В контексте приготовления жертвенного мяса глагол обозначает варку; этот вариант конкретнее общего «приготовьте».
- source_word: הַבָּשָׂר
  choice: мясо
  rationale: Речь идёт о съедобной части жертвенного животного; «мясо» естественно для современного русского языка, тогда как «плоть» здесь звучало бы неуместно архаично.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: Передаёт место действия и сохраняет устойчивое культовое обозначение אֹהֶל מוֹעֵד без ненужного пояснения.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: и там ешьте его
  rationale: Сохраняет подчёркнутое указание места, выраженное наречием שָׁם.
- source_word: הַלֶּחֶם
  choice: хлеб
  rationale: Прямое и контекстуально точное обозначение хлеба, сопровождавшего обряд посвящения.
- source_word: סַל הַמִּלֻּאִים
  choice: корзина приношений посвящения
  rationale: מִלֻּאִים обозначает обряд введения Аарона и его сыновей в священническое служение. Формулировка передаёт ритуальный контекст, не связывая его с позднейшими церковными формами рукоположения.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: как я и повелел, сказав
  rationale: Сохраняет структуру исходного текста, где לֵאמֹר вводит прямую цитату повеления.
- source_word: יֹאכְלֻהוּ
  choice: должны есть это
  rationale: Имперфект в цитируемом предписании имеет обязательную, а не просто будущую силу; нейтральное «должны» естественно передаёт её по-русски.
theological_decisions:
- issue: Значение מִלֻּאִים в контексте введения священников в служение
  choice: приношения посвящения
  alternative: приношения для поставления на священническое служение
  rationale: Выбранный вариант кратко передаёт связь с посвящением Аарона и его сыновей и не привносит терминологию какой-либо поздней конфессиональной традиции.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Шатёр встречи» сохраняет образ переносного святилища. Союзное «вместе с» естественно выражает совместное употребление мяса и хлеба, не добавляя нового смыслового отношения.
