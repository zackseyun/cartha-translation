base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: ru
  text: Он заколол его, и Моисей взял немного его крови и нанёс её на мочку[a] правого уха Аарона, на большой палец его правой руки и на большой палец его правой ноги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наружный край уха».'
    reason: Еврейское תְּנוּךְ может обозначать мочку либо наружную крайнюю часть уха.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Он заколол его
  rationale: В контексте жертвоприношения שׁחט означает ритуальное заклание; местоименный объект естественно восстанавливается из ближайшего контекста.
- source_word: מִדָּמוֹ
  choice: немного его крови
  rationale: Предлог מִן указывает на взятие части крови, а не всей крови животного.
- source_word: וַיִּתֵּן עַל
  choice: помазал ею
  rationale: В данном ритуальном контексте это естественно передаёт нанесение крови на названные части тела; буквальное «положил» по-русски звучало бы неестественно применительно к жидкости.
- source_word: תְּנוּךְ אֹזֶן
  choice: мочку … уха
  rationale: Термин обозначает наружную крайнюю часть уха; традиционно и понятно по-русски передаётся как «мочка уха», при этом возможное более широкое значение отмечено в сноске.
- source_word: הַיְמָנִית
  choice: правого / правой
  rationale: Прилагательное указывает на правую сторону и согласуется в русском с соответствующей частью тела.
- source_word: בֹּהֶן יָדוֹ
  choice: большой палец его правой руки
  rationale: בֹּהֶן применительно к руке обозначает большой палец.
- source_word: בֹּהֶן רַגְלוֹ
  choice: большой палец его правой ноги
  rationale: בֹּהֶן применительно к ноге обозначает большой палец ноги.
theological_decisions:
- issue: Нанесение жертвенной крови на части тела Аарона
  choice: Передать действие описательно, без объяснения его символики
  alternative: Включить в основной текст толкование как знака посвящения
  rationale: Стих повествует о ритуальном действии, но сам не раскрывает его символический смысл; перевод не должен добавлять отсутствующее в тексте богословское объяснение.
translation_notes:
  register: Современный литературный русский язык; повествовательный и достойный регистр. Синтаксис сохраняет последовательность еврейского рассказа, но формулировки естественны для современного читателя.
