    issue: «Помазал ею» вместо прямого описания нанесения крови
    rationale: Еврейское וַיִּתֵּן עַל означает «положил/нанёс на», а не специальный термин «помазал». В данном контексте «помазал» возможно, но вносит чуть более ритуально-интерпретирующую окраску и не выражает явно нанесение на каждую из трёх частей тела.
