  text: 'И сказал Яхве[a] Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (ЙХВХ); традиционно передаётся как «Господь». Также встречается вариант «Иегова».
    reason: Уточняет способы передачи тетраграмматона, не представляя принятое в основном тексте «Яхве» как альтернативу самому себе.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма с последовательным וַ продолжает повествование; «и сказал» естественно передаёт ввод речи в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном יהוה, а не заменяющий его титул.
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: При русском глаголе речи адресат естественно выражается дательным падежом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула вводит последующую прямую речь; в современном русском её функцию естественно выполняет двоеточие без избыточного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога. «Яхве» сохраняет его как имя и представляет наиболее распространённую научную реконструкцию произношения; традиционные варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная формула сохраняет достоинство библейского стиля. Двоеточие естественно вводит речь, следующую в следующем стихе.
