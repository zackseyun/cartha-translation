  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: ru
  text: Как было сделано в этот день, так Яхве повелел сделать, чтобы совершить искупление за вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Как… так
  rationale: Парная конструкция естественно передаёт сравнительное значение еврейского оборота и связывает уже совершённый обряд с данным повелением.
- source_word: עָשָׂה
  choice: было сделано
  rationale: Хотя форма глагола — 3-е лицо мужского рода единственного числа, деятель здесь прямо не назван; безличная пассивная конструкция по-русски естественно указывает на только что совершённые обрядовые действия, не добавляя субъекта.
- source_word: בַּיּוֹם הַזֶּה
  choice: сегодня
  rationale: Передаёт указание на текущий день кратко и естественно; более буквальное «в этот день» также возможно.
- source_word: צִוָּה
  choice: повелел
  rationale: Соответствует значению глагола и сохраняет торжественный, но понятный регистр речи о Божьем установлении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לַעֲשֹׂת
  choice: поступать
  rationale: Инфинитив повторяет корень עשה. В данном контексте «поступать» естественно обозначает исполнение предписанных обрядовых действий без добавления прямо не названного исполнителя.
- source_word: לְכַפֵּר
  choice: чтобы совершать искупление
  rationale: Сохраняет целевое значение инфинитива и специальный священнический смысл כפר, не сводя его к одной позднейшей богословской модели.
- source_word: עֲלֵיכֶם
  choice: за вас
  rationale: С כפר предлог על обозначает тех, ради кого или в отношении кого совершается искупление; «за вас» естественно в русском языке.
theological_decisions:
- issue: Значение כפר в жертвенно-обрядовом контексте
  choice: совершать искупление за вас
  alternative: очищать вас; совершать обряд искупления ради вас
  rationale: «Совершать искупление» сохраняет традиционное широкое значение священнического термина. Перевод «очищать» мог бы неоправданно сузить его до очищения, а более специальные термины заранее определили бы богословский механизм, не раскрытый в стихе.
- issue: Связь совершённого в этот день обряда с повелением Яхве
  choice: Как было сделано сегодня, так Яхве повелел поступать
  alternative: Как было сделано сегодня, Яхве повелел сделать, чтобы совершить искупление за вас
  rationale: Основной текст передаёт сравнительную силу כַּאֲשֶׁר конструкцией «как… так», но не уточняет сверх текста продолжительность или повторяемость обряда. Альтернативный синтаксический разбор приведён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной обрядовой лексикой. Сохранены безличность первого глагола, личное имя Яхве и широкое священническое значение термина «искупление».
