  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: ru
  text: И возложил на него нагрудник[a], и вложил в нагрудник урим и туммим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нагрудное украшение». Еврейское חֹשֶׁן обозначает особый предмет первосвященнического облачения, носимый на груди; речь не обязательно идёт о защитной части доспехов.'
    reason: lexical_alternative
  - marker: b
    text: «Урим» и «туммим» — транслитерированные еврейские названия священных предметов; их точный вид и способ использования остаются неясными.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: возложил
  rationale: Глагол שׂוּם означает «класть, помещать, возлагать». В контексте облачения «возложил» естественно передаёт церемониальное действие и сохраняет отличие от следующего נָתַן.
- source_word: עָלָיו
  choice: на него
  rationale: Предлог עַל с местоименным суффиксом здесь имеет пространственное значение и указывает на Аарона, которого облачают.
- source_word: הַחֹשֶׁן
  choice: нагрудник
  rationale: חֹשֶׁן — особый предмет первосвященнического облачения, носимый на груди. «Нагрудник» — понятный современный эквивалент; одинаковый перевод в обоих случаях сохраняет лексическую связность стиха.
- source_word: וַיִּתֵּן
  choice: вложил
  rationale: 'נָתַן имеет широкий диапазон значений: «давать, класть, помещать». При помещении предметов внутрь нагрудника русское «вложил» точно и естественно передаёт контекстуальный смысл.'
- source_word: אֶל הַחֹשֶׁן
  choice: в нагрудник
  rationale: Хотя אֶל обычно выражает направление «к», здесь сочетание с נָתַן описывает помещение урима и туммима внутрь нагрудника; по-русски это естественно передаётся как «в нагрудник».
- source_word: הָאוּרִים
  choice: урим
  rationale: אוּרִים — специальный культовый термин с не вполне ясными формой и способом употребления. Транслитерация не навязывает предположительного толкования вроде «светы».
- source_word: הַתֻּמִּים
  choice: туммим
  rationale: תֻּמִּים — парный к уриму специальный культовый термин. Транслитерация сохраняет еврейское обозначение и не подменяет его спорной этимологической интерпретацией.
theological_decisions:
- issue: Передача священнических предметов אוּרִים וְתֻּמִּים
  choice: транслитерировать как «урим и туммим»
  alternative: «светы и совершенства» или «священные жребии»
  rationale: Точная природа и способ использования этих предметов неясны, хотя они связаны со священническим узнаванием Божьего решения. Транслитерация сохраняет конкретность и неоднозначность исходного текста, не вводя спорного объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. «Возложил» уместно для церемониального облачения, тогда как «вложил» ясно передаёт помещение предметов внутрь. Технические термины «урим» и «туммим» оставлены без перевода и написаны со строчной буквы как традиционные названия предметов.
