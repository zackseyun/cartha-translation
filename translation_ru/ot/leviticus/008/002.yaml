base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: ru
  text: «Возьми Аарона вместе с его сыновьями, одежды, масло для помазания, быка для жертвы за грех[a], двух баранов и корзину пресных хлебов».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быка для очистительной жертвы». Еврейское слово может обозначать жертву, связанную как с грехом, так и с обрядовым очищением.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Возьми
  rationale: Прямо передаёт повелительную форму 2-го лица единственного числа; в данном обрядовом предписании не требуется уточнять движение глаголом «приведи».
- source_word: אַהֲרֹן וְאֶת בָּנָיו אִתּוֹ
  choice: Аарона и его сыновей вместе с ним
  rationale: Сохраняет явно выраженное אִתּוֹ («вместе с ним»), относящееся к Аарону, не устраняя кажущуюся избыточность исходного текста.
- source_word: הַבְּגָדִים
  choice: священные одежды
  rationale: Буквально это «одежды», но определённый артикль и контекст посвящения священников указывают на уже названные священнические одежды; «священные одежды» естественно и понятно по-русски.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло для помазания
  rationale: Естественно передаёт конструкцию «масло помазания» и её обрядовое назначение.
- source_word: פַּר הַחַטָּאת
  choice: быка для жертвы за грех
  rationale: В жертвенном контексте חַטָּאת обозначает жертву, связанную с грехом и очищением. Предлог «для» ясно показывает, что бык предназначен для этой жертвы.
- source_word: שְׁנֵי הָאֵילִים
  choice: двух баранов
  rationale: Прямое и обычное русское соответствие числительному и названию жертвенных животных.
- source_word: סַל הַמַּצּוֹת
  choice: корзину пресных хлебов
  rationale: מַצּוֹת — изделия из теста без закваски; множественное «пресных хлебов» сохраняет число и не вводит не указанную здесь конкретную форму выпечки.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Основной вариант сохраняет традиционно узнаваемую связь термина с грехом. Альтернатива отражает важную обрядово-очистительную функцию этой жертвы; неоднозначность отмечена в сноске, а не устранена молча.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной формулировкой. Перечень сохранён без многократного повторения союза «и», что естественно для русского синтаксиса. Маркер сноски поставлен непосредственно после спорного термина חַטָּאת; английское размещение маркера после слов о сыновьях, по-видимому, не соответствует содержанию самой сноски.
