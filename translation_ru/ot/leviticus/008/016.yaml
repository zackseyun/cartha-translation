base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: ru
  text: Моисей взял весь жир, покрывавший внутренности, долю печени[a], обе почки и жир на них, а затем сжёг всё это на жертвеннике[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придаток печени»; еврейское выражение обозначает определённую часть печени, удалявшуюся при подготовке жертвы.'
    reason: lexical_alternative
  - marker: b
    text: Глагол может точнее передаваться как «обратил в дым» или «вознёс в дыму» в контексте жертвоприношения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Он взял
  rationale: Форма wayyiqtol передаёт последовательное действие в повествовании; начальный союз по-русски естественно опущен.
- source_word: כָּל הַחֵלֶב
  choice: весь жир
  rationale: В жертвенном контексте חֵלֶב обозначает предназначенные для сожжения жировые части; простой анатомический эквивалент сохраняет ясность.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: покрывавший внутренности
  rationale: קֶרֶב здесь относится к внутренним органам животного, а предлог עַל указывает на находящийся на них жир; причастный оборот звучит естественно по-русски.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: долю печени
  rationale: Выражение обозначает определённую удаляемую при подготовке жертвы часть печени. «Доля печени» понятно современному читателю, а возможное значение «придаток печени» сохранено в сноске.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: обе почки
  rationale: 'Естественная русская передача двойственного значения: речь идёт о двух почках одного животного.'
- source_word: חֶלְבְּהֶן
  choice: жир на них
  rationale: Местоименный суффикс относится к почкам; конструкция уточняет, что имеется в виду покрывающий их жир.
- source_word: וַיַּקְטֵר
  choice: сжёг всё это
  rationale: В жертвенном контексте глагол означает сжигание приношения на алтаре, буквально с обращением его в дым. Дополнение «всё это» естественно восполняет подразумеваемый объект из перечня.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс при существительном по смыслу указывает на место совершения сожжения; это стандартная русская формулировка.
