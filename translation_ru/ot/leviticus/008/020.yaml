lexical_decisions:
- source_word: הָאַיִל
  choice: овна
  rationale: В контексте жертвоприношения אַיִל обозначает взрослого самца овцы; естественный русский эквивалент — «овен».
- source_word: נִתַּח לִנְתָחָיו
  choice: рассёк на части
  rationale: Глагол и однокоренное существительное передают разделку туши на отдельные части; «рассёк на части» точно и естественно воспроизводит это действие.
- source_word: וַיַּקְטֵר
  choice: сжёг на жертвеннике, обращая в дым
  rationale: Каузативная форма קטר в культовом контексте означает сжечь приношение так, чтобы оно восходило дымом; уточнение «на жертвеннике» следует из непосредственного ритуального контекста и делает выражение естественным по-русски.
- source_word: הָרֹאשׁ
  choice: голову
  rationale: Прямое обозначение анатомической части.
- source_word: הַנְּתָחִים
  choice: части туши
  rationale: Существительное обозначает части разделанного животного; добавление «туши» устраняет неясность в русском тексте, не меняя смысла.
- source_word: הַפָּדֶר
  choice: жир
  rationale: Редкий культовый термин פדר обозначает жирную часть жертвенного животного. Более конкретное «жирный курдюк» возможно применительно к барану, но лексически не вполне бесспорно, поэтому основной текст сохраняет более широкое «жир».
