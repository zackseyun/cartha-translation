base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: ru
  text: Он надел на него хитон, опоясал его поясом, облачил его в верхнюю одежду, надел на него эфод, опоясал его искусно вытканным поясом эфода[a] и закрепил на нём эфод этим поясом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «украшенный пояс эфода» или «поясная повязка эфода».'
    reason: lexical_alternative
  - marker: b
    text: Редкий еврейский глагол, вероятно, означает, что эфод был закреплён на Аароне с помощью его тканого пояса.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: хитон
  rationale: Обозначает основную длинную одежду священника, надевавшуюся непосредственно на тело; «хитон» — устоявшийся и достаточно понятный русский библейский термин.
- source_word: אַבְנֵט
  choice: пояс
  rationale: Речь идёт о матерчатом поясе, которым опоясывали священника; «пояс» естественнее в современном русском, чем архаическое «опоясание».
- source_word: מְעִיל
  choice: верхнее одеяние
  rationale: Одежда, надевавшаяся поверх хитона. Описательный перевод понятен современному читателю и не приписывает предмету более точную форму, чем позволяет еврейский термин.
- source_word: אֵפֹד
  choice: эфод
  rationale: Специальное священническое облачение без точного русского соответствия; транслитерация сохраняет культовую специфику термина.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: искусно вытканный пояс эфода
  rationale: В данном контексте חֵשֶׁב обозначает прикреплённый к эфоду тканый пояс или перевязь; перевод передаёт и его функцию, и искусную выделку, не исключая иных оттенков.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: опоясал его
  rationale: Глагол חגר означает обвязать или опоясать вокруг талии; выбранный оборот точен, естественен и уместен в описании облачения.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: закрепил на нём эфод этим поясом
  rationale: Редкий глагол, образованный от אֵפֹד, описывает закрепление эфода, а заключительное בּוֹ указывает на средство — пояс. Эксплицитный перевод делает связь ясной, не меняя смысла действия.
- source_word: וַיִּתֵּן עָלָיו
  choice: надел на него
  rationale: В контексте облачения это естественный русский эквивалент буквального «положил на него».
theological_decisions:
- issue: Передача терминов священнического облачения
  choice: Сохранить специальный термин «эфод», а более общие названия одежды перевести понятными русскими словами
  alternative: Описательно перевести «эфод» как «наподобие передника облачение» либо сохранить для מְעִיל традиционное «риза»
  rationale: Транслитерация «эфод» сохраняет культовую точность, тогда как понятные эквиваленты для остальных предметов делают перечисление доступным без привнесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом. Синтаксический ряд действий сохранён, но архаичные «препоясал» и «риза» заменены более понятными выражениями. Местоимение «него» сохраняет связь с Аароном из контекста.
