  text: וַ/יִּשְׁחָ֑ט וַ/יִּזְרֹ֨ק מֹשֶׁ֧ה אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/019.yaml
  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: ru
  text: Он заколол его, и Моисей плеснул кровью на жертвенник со всех сторон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разбрызгал кровь по жертвеннику со всех сторон». Еврейский глагол обозначает энергичное нанесение жертвенной крови, а не лёгкое кропление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Он заколол его
  rationale: В контексте жертвоприношения שׁחט обозначает заклание животного. Местоимение «его» восполняет подразумеваемое дополнение — барана из предыдущего стиха.
- source_word: וַיִּזְרֹק
  choice: плеснул
  rationale: Глагол זרק здесь обозначает энергичное нанесение жертвенной крови на жертвенник. «Плеснул» передаёт это точнее, чем «окропил», которое может создавать впечатление лёгкого кропления.
- source_word: הַדָּם
  choice: кровью
  rationale: Творительный падеж естественно передаёт по-русски вещество, которое Моисей плеснул на жертвенник, при сохранении определённости из контекста.
- source_word: הַמִּזְבֵּחַ
  choice: на жертвенник
  rationale: Стандартное современное соответствие для מִזְבֵּחַ; предлог «на» передаёт עַל в данном обрядовом контексте.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Передаёт распределительное значение действия вокруг жертвенника, то есть по его сторонам.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная русская форма библейского имени.
