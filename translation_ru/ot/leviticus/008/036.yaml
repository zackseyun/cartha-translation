  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: ru
  text: И Аарон и его сыновья исполнили всё, что Яхве повелел через Моисея[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моисея»; еврейская идиома со значением «через Моисея» или «при посредничестве Моисея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: исполнили
  rationale: Глагол עשה здесь подводит итог точному выполнению предписаний. «Исполнили» естественно сочетается с относительным оборотом «всё, что… повелел» и ясно передаёт послушное действие.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Аарон и его сыновья
  rationale: בָּנָיו в данном священническом контексте обозначает сыновей Аарона; личное имя передано в принятой русской форме.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: всё
  rationale: דברים может означать «слова», «дела», «вещи» или «предписания». Здесь речь идёт о выполнении повелений, поэтому русское «всё, что» естественно охватывает весь комплекс предписанных действий, не сужая значение.
- source_word: צִוָּה
  choice: повелел
  rationale: Форма обозначает данное Яхве повеление. Совершенный вид «повелел» естественно выражает предшествование приказа его исполнению без необходимости добавлять временные слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом; форма «Яхве» широко понятна в современном русском языке.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Буквально «рукой Моисея»; это устойчивое обозначение посредничества или передачи через человека. «Через Моисея» ясно и естественно передаёт смысл идиомы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Роль Моисея в выражении בְּיַד מֹשֶׁה
  choice: через Моисея
  alternative: рукой Моисея; посредством Моисея
  rationale: 'Формулировка сохраняет посредническую роль Моисея, не утверждая сверх того, что выражено идиомой: повеление исходит от Яхве и передаётся через Моисея.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Синтаксис лаконичен; традиционная библейская форма имени «Аарон» сохранена, а идиома раскрыта в основном тексте и отмечена сноской.
