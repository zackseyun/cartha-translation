  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: ru
  text: Затем он подвёл быка для жертвы за грех[a], и Аарон и его сыновья возложили руки на голову быка для жертвы за грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представил»; также возможно: «подвёл вперёд».'
    reason: 'Лексическая альтернатива для וַיַּגֵּשׁ: глагол может обозначать как приближение, так и ритуальное представление.'
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: подвёл
  rationale: В породе хифиль глагол נגשׁ означает «подвести, приблизить, представить». «Подвёл» естественно передаёт движение жертвенного животного к месту обряда, не исключая оттенка представления.
- source_word: פַּר
  choice: быка
  rationale: В жертвенном контексте פַּר обозначает быка; указание на его молодость в данном стихе не обязательно.
- source_word: הַחַטָּאת
  choice: жертвы за грех
  rationale: Здесь חַטָּאת обозначает не сам грех, а жертвоприношение, связанное с грехом. «Жертва за грех» — ясный и устоявшийся русский эквивалент.
- source_word: וַיִּסְמֹךְ
  choice: возложили
  rationale: В жертвенном обряде סמך описывает возложение рук на животное. Перевод сохраняет ритуальный характер действия, не уточняя степень нажима.
- source_word: יְדֵיהֶם
  choice: руки
  rationale: Сохранено множественное число еврейского текста; оно естественно по-русски при составном подлежащем.
- source_word: עַל רֹאשׁ
  choice: на голову
  rationale: Прямо и естественно передаёт пространственное отношение в описании обряда.
theological_decisions:
- issue: Значение возложения рук в жертвенном обряде
  choice: Передать только само действие, не объясняя его богословский механизм.
  alternative: Истолковать жест как отождествление с жертвой, перенесение вины либо посвящение животного.
  rationale: Стих описывает обряд, но не разъясняет значение жеста. Перевод не должен добавлять отсутствующее в тексте толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской окраской. Формулировка ясна обычному читателю и сохраняет повтор «быка для жертвы за грех», присутствующий в еврейском тексте.
