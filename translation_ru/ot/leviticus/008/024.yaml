- from: Затем он подвёл сыновей Аарона, и Моисей нанёс кровь на мочку их правого уха, на большой палец их правой руки и на большой палец их правой ноги. После этого Моисей окропил кровью жертвенник со всех сторон.
  to: Затем Моисей подвёл сыновей Аарона, взял немного крови и нанёс её на мочку их правого уха, на большой палец их правой руки и на большой палец их правой ноги. После этого Моисей окропил жертвенник кровью со всех сторон.
