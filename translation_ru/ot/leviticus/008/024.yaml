    rationale: Еврейский текст прямо указывает, что Моисей использовал часть/некоторое количество крови. Формулировка «нанёс кровь» этого ограничения не сохраняет.
  revised_text: Затем Моисей подвёл сыновей Аарона, взял немного крови и нанёс её на мочку их правого уха, на большой палец их правой руки и на большой палец их правой ноги. После этого Моисей окропил жертвенник кровью со всех сторон.
