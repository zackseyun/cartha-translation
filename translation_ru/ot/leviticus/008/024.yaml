base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: ru
  text: Затем Моисей подвёл сыновей Аарона, взял немного крови и нанёс её на мочку их правого уха, на большой палец их правой руки и на большой палец их правой ноги. После этого Моисей окропил жертвенник кровью со всех сторон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: подвёл
  rationale: В данном обрядовом контексте каузативная форма קרב означает, что Моисей велел сыновьям Аарона приблизиться или подвёл их; «подвёл» естественно передаёт действие без лишнего истолкования.
- source_word: תְּנוּךְ
  choice: мочка
  rationale: Обозначает мочку или нижнюю часть уха; в русском описании обряда естественно «мочка уха».
- source_word: בֹּהֶן
  choice: большой палец
  rationale: Слово обозначает большой палец руки, а применительно к ноге — большой палец ноги; оба значения уточнены контекстом.
- source_word: וַיִּזְרֹק
  choice: окропил
  rationale: Технический жертвенный глагол זרק описывает нанесение крови на жертвенник разбрызгиванием; «окропил кровью» является естественным и точным русским культовым выражением.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Передаёт распределение крови вокруг жертвенника, не обязательно утверждая движение по кругу.
theological_decisions:
- issue: Обрядовое значение нанесения крови на части тела
  choice: Не разъяснять символику в тексте перевода
  alternative: Добавить толкование о посвящении слуха, труда и хождения
  rationale: Еврейский текст сообщает действия, но не объясняет здесь их символику; перевод сохраняет эту сдержанность.
- issue: Способ нанесения крови на жертвенник
  choice: «окропил кровью жертвенник»
  alternative: «бросил кровь на жертвенник»
  rationale: Буквальное «бросил» по-русски звучит неестественно применительно к жидкости и может исказить обрядовый смысл технического глагола.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Повтор притяжательной конструкции сохранён настолько, насколько это естественно по-русски; «их правого уха/руки/ноги» отражает еврейские формы множественного числа без громоздкого «каждого из них».
