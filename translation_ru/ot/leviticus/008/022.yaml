base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: ru
  text: Затем он подвёл второго барана[a] — барана посвящения, и Аарон и его сыновья возложили руки на голову барана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «барана поставления». Еврейское выражение — специальный священнический термин, обозначающий обряд введения в служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Затем он подвёл
  rationale: Порода Hiphil глагола קרב означает «подвести, приблизить, представить». «Подвёл» естественно по-русски передаёт ритуальное действие, а «затем» отражает последовательность повествования.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: второго барана
  rationale: אַיִל означает «баран», а הַשֵּׁנִי — порядковое числительное «второй»; речь идёт о втором баране в последовательности жертв обряда.
- source_word: אֵיל הַמִּלֻּאִים
  choice: барана посвящения
  rationale: מִלֻּאִים буквально связано с «наполнением», но в священническом контексте является техническим обозначением введения в служение. «Баран посвящения» ясно и естественно передаёт назначение жертвы.
- source_word: וַיִּסְמְכוּ
  choice: возложили
  rationale: В жертвенном контексте סמך означает положить или прижать руки к животному. «Возложили руки» — точная и устойчивая русская формулировка ритуального действия.
- source_word: אֶת יְדֵיהֶם
  choice: руки
  rationale: Сохранено множественное число еврейского текста; по-русски сочетание «возложили руки» естественно применительно к нескольким участникам.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: на голову барана
  rationale: Прямо и ясно передаёт предлог עַל и объект ритуального жеста.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Аарон и его сыновья
  rationale: בָנָיו здесь обозначает сыновей Аарона, участвующих вместе с ним во введении в священническое служение.
theological_decisions:
- issue: Передача священнического термина מִלֻּאִים в контексте обряда
  choice: баран посвящения
  alternative: баран поставления; баран рукоположения
  rationale: Термин обозначает обряд введения Аарона и его сыновей в священническое служение. «Посвящение» остаётся понятным современному читателю и достаточно широко передаёт сакральный и установительный характер обряда, не связывая текст с терминологией отдельной конфессии. Альтернатива отмечена в сноске, чтобы сохранить технический оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис следует еврейской последовательности, но остаётся естественным; технический термин пояснён без конфессионально узкой лексики.
