base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: ru
  text: Затем Моисей взял елей для помазания, помазал скинию и всё, что в ней, и освятил их[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятил их»; также возможно: «сделал их святыми».'
    reason: 'Лексическая альтернатива: קדשׁ объединяет значения освящения и отделения для священного употребления; вариант не добавляет невыраженного в стихе адресата.'
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Затем Моисей взял
  rationale: Форма wayyiqtol продолжает последовательность повествования; «затем» естественно передаёт переход к следующему действию.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: елей для помазания
  rationale: Сочетание обозначает масло, предназначенное для обряда помазания. «Елей» сохраняет установленную библейскую культовую лексику и остаётся понятным в данном контексте.
- source_word: וַיִּמְשַׁח
  choice: помазал
  rationale: Глагол обозначает культовое нанесение елея; «помазал» точно передаёт как физическое действие, так и его обрядовый смысл.
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: «Скиния» — принятое русское обозначение священного шатра в контексте Исхода и Левита; оно точнее общего «жилище».
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: всё, что в ней
  rationale: Фраза охватывает всё находящееся в скинии, прежде всего её принадлежности; русский оборот близок к еврейскому и звучит естественно.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: и освятил их
  rationale: В священническом контексте קדשׁ означает сделать священным, отделив для Бога и священного служения. «Освятил» сохраняет ключевую лексику святости; множественное «их» относится к скинии и всему находившемуся в ней как к совокупности.
theological_decisions:
- issue: Передача קדשׁ в контексте священнического обряда
  choice: освятил
  alternative: посвятил Богу; сделал святыми
  rationale: «Освятил» сохраняет прямую связь корня קדשׁ со святостью и культовым отделением, не сводя значение лишь к назначению для определённой цели. Сноска сохраняет возможные смысловые развёртки.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Термины «елей», «помазание», «скиния» и «освятил» сохраняют культовую точность, не усложняя синтаксис.
