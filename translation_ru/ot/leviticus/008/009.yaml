id: LEV.8.9
reference: Leviticus 8:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И возложил он на его голову тюрбан, а спереди на тюрбане поместил золотую пластину — священный венец[a], как повелел Яхве Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священная диадема».'
    reason: Лексически возможный перевод נֵזֶר הַקֹּדֶשׁ; «диадема» точнее подчёркивает головное украшение, но менее общеупотребительна.
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: тюрбан
  rationale: Обозначает особый головной убор первосвященника; «тюрбан» — ясный и конкретный современный эквивалент.
- source_word: אֶל מוּל פָּנָיו
  choice: спереди на тюрбане
  rationale: Оборот указывает на переднюю, обращённую к лицу сторону тюрбана; перевод естественно передаёт место крепления украшения.
- source_word: צִיץ
  choice: золотая пластина
  rationale: Хотя слово может означать цветок или украшение, в контексте священнического облачения речь идёт о золотой пластине, прикреплённой к тюрбану.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: священный венец
  rationale: Приложение определяет золотую пластину как посвящённый Богу знак; «венец» сохраняет образ и остаётся понятным современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены его титулом.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: возложил ... поместил
  rationale: Два употребления одного еврейского глагола переданы близкими по смыслу русскими глаголами с учётом разных предметов действия и естественности речи.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: Формулировка ясно передаёт полное соответствие действия данному Моисею повелению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Значение נֵזֶר הַקֹּדֶשׁ
  choice: священный венец
  alternative: священная диадема; венец святыни
  rationale: Выражение сохранено как приложение к золотой пластине, без сведения его только к царской короне или к отвлечённому понятию святости.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Синтаксис сохраняет последовательность еврейского текста; местоимение «его» не заменено именем Аарона, поскольку в данном стихе имя прямо не названо.
