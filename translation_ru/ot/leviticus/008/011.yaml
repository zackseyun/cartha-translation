  source_fidelity: 'Текст точно передаёт еврейскую последовательность действий: окропление жертвенника елеем семь раз, помазание жертвенника, всей его утвари, умывальника и его опоры с целью их освящения. Раскрытие местоимения מִמֶּנּוּ как «елеем» обосновано непосредственным контекстом (елей помазания в ст. 10) и не меняет смысла.'
