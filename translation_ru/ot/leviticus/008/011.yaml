source:
  edition: WLC
  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: ru
  text: И он семь раз окропил жертвенник елеем[a], затем помазал жертвенник и все его принадлежности, а также умывальник и его подставку[b], чтобы освятить их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «из него» — то есть из елея помазания, упомянутого в предыдущем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «умывальник и его основание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז מִמֶּנּוּ
  choice: окропил елеем
  rationale: Глагол נזה в породе Hiphil обозначает ритуальное окропление. Буквально מִמֶּנּוּ значит «из него / от него» и по контексту относится к елею помазания из предыдущего стиха; явное «елеем» естественно передаёт эту анафору по-русски, а сноска сохраняет буквальную форму.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшийся и понятный русский эквивалент названия места жертвоприношения.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямое соответствие числовому обстоятельству повторности.
- source_word: וַיִּמְשַׁח
  choice: затем помазал
  rationale: «Помазал» сохраняет специальное ритуальное значение משׁח; «затем» естественно передаёт последовательный וַ, не утверждая большего, чем повествовательная последовательность.
- source_word: כָּל כֵּלָיו
  choice: все его принадлежности
  rationale: כְּלִי — широкое обозначение предметов или утвари. «Принадлежности» понятно современному читателю и не сужает значение до сосудов.
- source_word: הַכִּיֹּר
  choice: умывальник
  rationale: כִּיּוֹר здесь обозначает предназначенный для омовений сосуд при святилище. «Умывальник» сохраняет его функцию и звучит естественнее архаичного «умывальница».
- source_word: כַּנּוֹ
  choice: его подставку
  rationale: כֵּן обозначает опору или основание сосуда; «подставка» — ясный современный эквивалент.
- source_word: לְקַדְּשָׁם
  choice: чтобы освятить их
  rationale: Инфинитив קדשׁ с объектным суффиксом выражает цель — отделить перечисленные предметы как святые для священного употребления. «Освятить» сохраняет культовый смысл и естественно в русском библейском регистре.
theological_decisions:
- issue: Передача культовых действий и назначения священных предметов
  choice: Использованы установившиеся, но понятные слова «помазал» и «освятить».
  alternative: «Намазал елеем» и «посвятить / сделать святыми».
  rationale: Выбранные слова сохраняют ритуальный регистр текста, не привнося позднейших конфессиональных толкований; «освятить» здесь означает отделить предметы для священного употребления.
- issue: Референт местоимения מִמֶּנּוּ
  choice: В основном тексте референт раскрыт как елей, а буквальная форма отмечена в сноске.
  alternative: «И он семь раз окропил из него жертвенник».
  rationale: Контекст ясно указывает на елей помазания, однако еврейский текст использует местоименную форму. Сноска одновременно обеспечивает естественность русского текста и сохраняет формальную особенность источника.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Сохранена культовая терминология без архаизации; синтаксис сделан естественным для последовательного повествования.
