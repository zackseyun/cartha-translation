revisions:
- from: Затем Моисей взял немного масла для помазания и немного крови, которая была на жертвеннике, и окропил ими Аарона, его одежды, его сыновей и одежды его сыновей, бывших с ним. Так он посвятил[a] Аарона, его одежды, его сыновей и одежды его сыновей, бывших с ним.
  to: Затем Моисей взял немного масла для помазания и немного крови, которая была на жертвеннике, и окропил ими Аарона, его одежды, его сыновей и одежды его сыновей, бывших с ним. Так он освятил[a] Аарона, его одежды, его сыновей и одежды его сыновей, бывших с ним.
