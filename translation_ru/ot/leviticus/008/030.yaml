  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: ru
  text: Затем Моисей взял немного масла для помазания и немного крови, которая была на жертвеннике, и окропил ими Аарона, его одежды, его сыновей и одежды его сыновей, бывших с ним. Так он освятил[a] Аарона, его одежды, его сыновей и одежды его сыновей, бывших с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятил».'
    reason: 'Лексическая альтернатива для וַיְקַדֵּשׁ: в данном обрядовом контексте глагол обозначает освящение, то есть отделение для священного служения.'
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: взял немного масла ... и немного крови
  rationale: Глагол означает «взял», а повторённый предлог מִן указывает на взятие части каждой из двух субстанций; «немного» естественно передаёт партитивное значение по-русски.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло для помазания
  rationale: Передаёт культовое назначение масла ясным современным языком, не ослабляя связи с обрядом помазания.
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: кровь, которая была на жертвеннике
  rationale: Относительное предложение сохраняет прямое значение еврейского текста; прошедшее «была» естественно в русском повествовании.
- source_word: וַיַּז
  choice: окропил ими
  rationale: В породе хифиль נזה обозначает ритуальное окропление. Местоимение во множественном числе соотносится с названными маслом и кровью, не утверждая прямо, были ли они предварительно смешаны.
- source_word: בְּגָדָיו
  choice: его одежды
  rationale: «Одежды» сохраняет достоинство культового контекста и не вводит более узкого толкования «облачения».
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Мужской род и число исходного слова значимы в контексте посвящения сыновей Аарона в священническое служение.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: одежды его сыновей, бывших с ним
  rationale: Сохраняются все элементы исходной конструкции. Оборот «бывших с ним» естественно относится к сыновьям, хотя сжатость еврейской конструкции полностью устранить по-русски невозможно.
- source_word: וַיְקַדֵּשׁ
  choice: Так он посвятил
  rationale: В данном обряде קדשׁ означает отделение для святого священнического служения. «Посвятил» ясно передаёт ритуальный смысл, а «так» выражает результат предшествующего действия.
theological_decisions:
- issue: Передача קדשׁ в контексте поставления священников
  choice: посвятил
  alternative: освятил
  rationale: «Посвятил» естественно обозначает обрядовое отделение Аарона и его сыновей для священного служения. Вариант «освятил» ближе к корневой идее святости и сохранён в сноске, чтобы не скрывать смысловой диапазон.
- issue: Упоминание потомков Аарона по полу
  choice: его сыновей
  alternative: его детей
  rationale: Еврейский текст прямо говорит о сыновьях, участвующих в священническом посвящении; обобщение до «детей» было бы менее точным.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным звучанием. Сохранены повторяющийся перечень людей и одежд, а также культовые термины «помазание», «жертвенник» и «окропил». Неясность относительно того, были ли масло и кровь смешаны, не разрешается: местоимение «ими» отсылает к обеим субстанциям без уточнения способа их соединения.'
