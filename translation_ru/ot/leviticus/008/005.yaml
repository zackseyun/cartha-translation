  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: ru
  text: 'И Моисей сказал общине: «Вот что Яхве повелел сделать[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот что Яхве повелел совершить»; по смыслу возможно также: «Вот что, по повелению Яхве, должно быть сделано». Исполнитель действия в еврейском тексте прямо не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И … сказал
  rationale: Форма с повествовательным וַ последовательно развивает рассказ; союз «и» естественно сохраняет связь с предыдущим действием.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: הָעֵדָה
  choice: общине
  rationale: עֵדָה обозначает собранное общество Израиля; «община» передаёт как коллективное, так и собранийное значение и естественно звучит в современном русском языке.
- source_word: זֶה הַדָּבָר
  choice: Вот что
  rationale: Буквально сочетание означает «это — дело/слово», однако в данной указательной формуле «вот что» точно и естественно передаёт его функцию.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол выражает данное прежде обязательное распоряжение. Русский вид и контекст передают его сохраняющуюся силу без необходимости отдельной временной конструкции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: לַעֲשׂוֹת
  choice: сделать
  rationale: Инфинитив формально активен и естественно передаётся русским «сделать»; при этом субъект действия не назван, поэтому контекст допускает и безлично-пассивное понимание.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя, а не титул; транслитерация сохраняет это лексическое различие.
- issue: Субъект предписанного действия в לַעֲשׂוֹת
  choice: повелел сделать
  alternative: повелел, чтобы это было сделано
  rationale: Еврейский инфинитив имеет активную форму, но исполнитель прямо не указан. Основной текст сохраняет форму оригинала, а примечание отмечает допустимое безлично-пассивное понимание, не определяя субъекта.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим повествованию о богослужебном установлении. Формула «вот что» выбрана вместо тяжеловесного буквального «это то дело», а личное имя «Яхве» сохранено.
