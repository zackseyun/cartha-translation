revisions:
- from: Затем Моисей взял грудину и совершил ею обряд возношения пред Яхве. Она стала долей Моисея от барана посвящения[a], как Яхве и повелел Моисею.
  to: Затем Моисей взял грудную часть и потряс её перед Яхве как жертву потрясания. Это была доля Моисея от барана посвящения[a], как повелел Яхве Моисею.
  rationale: 'Исправлены два терминологических расхождения с еврейским текстом: жертвенная грудная часть передана без значения грудной кости, а תְּנוּפָה — устойчивым выражением «жертва потрясания». Остальная структура и смысл сохранены; сноска удерживает допустимую альтернативу для מִלֻּאִים.'
  reviewer_model: gpt-5.6-terra
