  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Затем Моисей взял грудную часть и потряс её перед Яхве как жертву потрясания. Это была доля Моисея от барана посвящения[a], как повелел Яхве Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от барана поставления».'
    reason: Лексема מִלֻּאִים в контексте посвящения священников обозначает обряд их введения в служение; возможны передачи «посвящение» и «поставление».
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Затем Моисей взял
  rationale: Форма wayyiqtol продолжает последовательность повествования; «затем» естественно передаёт переход к следующему действию.
- source_word: הֶחָזֶה
  choice: грудину
  rationale: В контексте жертвоприношения חָזֶה обозначает предназначенную для обряда грудную часть животного; «грудина» точно и естественно называет этот отруб.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: совершил ею обряд возношения
  rationale: Сочетание глагола נוּף с однокоренным существительным תְּנוּפָה обозначает ритуальное движение и представление дара. Русская формулировка передаёт технический культовый смысл без неестественного «помахал».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Краткая возвышенная формула естественно передаёт совершение обряда в присутствии Яхве.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: от барана посвящения
  rationale: אֵיל означает «баран», а מִלֻּאִים здесь относится к введению священников в служение. «Посвящение» понятно современному читателю и сохраняет культовый смысл; возможен более специальный вариант «поставление».
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: Она стала долей Моисея
  rationale: מָנָה — назначенная доля или часть. Женское местоимение ясно соотносится с грудиной.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как Яхве и повелел Моисею
  rationale: Формула подчёркивает точное исполнение ранее данного повеления; частица «и» идиоматично выражает соответствие приказанию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Значение מִלֻּאִים в обряде введения священников в служение
  choice: посвящение
  alternative: поставление
  rationale: Термин буквально связан с «наполнением рук», но в данном контексте обозначает обряд посвящения/поставления. Основной вариант выбран ради понятности, а более специальный отражён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Выражение «обряд возношения» передаёт ритуальный смысл נוּף/תְּנוּפָה естественнее буквального описания движения; форма «пред Яхве» сохраняет достоинство и лаконизм.
