  - severity: medium
    issue: «грудину» для הֶחָזֶה
    rationale: «Грудина» в современном русском прежде всего грудная кость; еврейское слово обозначает жертвенную грудную часть животного.
  - severity: low
    issue: «как Яхве и повелел Моисею»
    rationale: Частица «и» не нужна для передачи כַּאֲשֶׁר и несколько разговорно усиливает формулу. «Как повелел Яхве Моисею» точнее и глаже.
