lexical_decisions:
- source_word: וְ/אֵת
  choice: И
  rationale: וְ связывает эту заповедь с предыдущей последовательностью повелений; אֵת — показатель определённого прямого дополнения и отдельно по-русски не передаётся.
- source_word: כָּל הָעֵדָה
  choice: всё общество
  rationale: כָּל подчёркивает полноту, а עֵדָה обозначает собранную общину Израиля. «Всё общество» естественно и сохраняет собирательный смысл; возможно также «всё собрание».
- source_word: הַקְהֵל
  choice: собери
  rationale: 'Порода hифиль, повелительное наклонение от קהל: побудить собраться, созвать. «Собери» ясно и естественно передаёт обращённое к Моисею повеление.'
- source_word: אֶל פֶּתַח
  choice: у входа
  rationale: Хотя אֶל часто указывает направление, в сочетании с «входом» контекст обозначает место, где должно быть собрано общество; по-русски естественно «у входа».
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Устойчивое обозначение священного шатра как места встречи; «шатёр встречи» прозрачно передаёт оба компонента еврейского выражения и звучит современно.
