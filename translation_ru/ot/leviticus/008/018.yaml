base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: ru
  text: Затем он привёл[a] овна для всесожжения, и Аарон и его сыновья возложили[b] руки на голову овна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представил» или «подвёл»; еврейский глагол означает «привести, приблизить, представить».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «положили руки»; речь идёт о ритуальном действии над жертвенным животным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Затем он подвёл
  rationale: Порода hифиль от קרב означает «подвести, приблизить, представить». «Подвёл» естественно передаёт физическое приближение жертвенного животного и сохраняет ритуальный оттенок; местоимение «он» относится к Моисею из ближайшего контекста.
- source_word: אֵיל הָעֹלָה
  choice: овна для всесожжения
  rationale: אֵיל — самец овцы, «овен»; עֹלָה — установленное обозначение жертвы всесожжения. Предлог «для» естественно показывает назначение этого овна, не добавляя нового смысла.
- source_word: וַיִּסְמְכוּ
  choice: возложили
  rationale: В жертвенном контексте סמך обозначает ритуальное наложение рук на животное, возможно с нажимом. «Возложили руки» — ясное и принятое русское выражение для этого действия.
- source_word: יְדֵיהֶם
  choice: руки
  rationale: Сохранено выраженное в еврейском тексте множественное число; принадлежность рук участникам действия в русском предложении понятна без тяжеловесного «свои руки».
- source_word: עַל רֹאשׁ הָאָיִל
  choice: на голову овна
  rationale: Прямой, точный и естественный перевод предложной конструкции.
theological_decisions:
- issue: Смысл возложения рук в жертвенном обряде
  choice: возложили руки на голову овна
  alternative: опёрлись руками на голову овна; положили руки на голову овна
  rationale: Перевод описывает сам ритуальный жест, но не приписывает ему прямо не названный в стихе смысл — например, перенесение вины или отождествление с жертвой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся простым и близким к еврейскому, но сочетание «овен для всесожжения» выбрано как более естественное по-русски. Конструкция «Аарон с сыновьями» ясно выражает совместное действие и избегает повторения притяжательного местоимения.
