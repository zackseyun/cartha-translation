source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: ru
  text: Моисей сделал так, как повелел ему Яхве, и община собралась[a] у входа в шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «община была собрана».'
    reason: Еврейская форма глагола допускает как возвратно-среднюю передачу «собралась», так и явно пассивную «была собрана».
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Глагол עשה имеет широкое значение «делать, совершать»; здесь он обозначает исполнение повеления, поэтому естественно передаётся как «сделал».
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: Оборот выражает соответствие действия данному повелению; русское «так, как» точно и естественно передаёт эту связь.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол צוה обозначает властное предписание. «Повелел» сохраняет силу Божьего приказания и соответствует достоинству повествования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: אֹתוֹ
  choice: ему
  rationale: В еврейском это прямое дополнение «его», но русская конструкция «повелел ему» требует дательного падежа и точно указывает на Моисея как адресата повеления.
- source_word: וַתִּקָּהֵל
  choice: собралась
  rationale: Нифаль глагола קהל здесь естественно выражает собирание общины. Русское возвратное «собралась» сохраняет средне-пассивный оттенок формы; возможная явно пассивная передача отмечена в сноске.
- source_word: הָעֵדָה
  choice: вся община
  rationale: עֵדָה обозначает общину Израиля как единое целое. «Община» в современном русском понятнее и естественнее, чем более церковно окрашенное «общество»; «вся» поясняет собирательный смысл определённой формы.
- source_word: אֶל פֶּתַח
  choice: у входа
  rationale: Хотя אֶל обычно указывает направление, с глаголом собирания итоговое местонахождение по-русски естественно передаётся сочетанием «у входа».
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: 'Передача сохраняет оба элемента названия: אֹהֶל — «шатёр» и מוֹעֵד — назначенное место встречи. Она понятнее современному читателю, чем традиционное «скиния собрания».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Залог глагола וַתִּקָּהֵל
  choice: община собралась
  alternative: община была собрана
  rationale: Форма нифаль допускает среднее либо пассивное понимание. Основной текст использует естественную русскую формулировку, а сноска сохраняет явно пассивную возможность, не решая неоднозначность молча.
translation_notes:
  register: Современный литературный русский с ясным, сдержанно-торжественным звучанием. Синтаксис близок к еврейскому, но естественен по-русски; устаревшие слова «скиния» и «общество» не используются.
