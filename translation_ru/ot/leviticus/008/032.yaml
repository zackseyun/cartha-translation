lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: А то, что останется
  rationale: Субстантивированное причастие нифаля передаёт оставшуюся часть; эта формулировка естественна по-русски и сохраняет значение остатка.
- source_word: בַּבָּשָׂר
  choice: от мяса
  rationale: בָּשָׂר буквально означает «плоть», но в контексте жертвенной пищи речь идёт о мясе животного; «мясо» ясно и естественно передаёт смысл.
- source_word: וּבַלָּחֶם
  choice: и хлеба
  rationale: לֶחֶם — обычное обозначение хлеба; единый предлог «от» распространяется на оба однородных дополнения.
- source_word: בָּאֵשׁ
  choice: в огне
  rationale: Предлог ב обозначает здесь сферу или средство сожжения; «в огне» непосредственно передаёт еврейскую конструкцию и естественно звучит в русском предписании.
- source_word: תִּשְׂרֹפוּ
  choice: сожгите
  rationale: Имперфект второго лица множественного числа в законодательном контексте выражает повеление; русский совершенный императив точно и естественно передаёт директивную силу.
