base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: А быка вместе с его кожей[a], мясом и помётом[b] он сжёг огнём вне стана, как повелел Яхве Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шкурой».'
    reason: lexical_alternative
  - marker: b
    text: То есть испражнениями животного; еврейское слово обозначает именно помёт, а не внутренности или отходы вообще.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַפָּר
  choice: быка
  rationale: פַּר обозначает быка или молодого быка. «Бык» передаёт прямой смысл без добавления отсутствующего в стихе уточнения о жертве за грех.
- source_word: עֹרוֹ
  choice: его кожей
  rationale: עוֹר означает кожу или шкуру животного. «Кожа» точно и естественно звучит в перечне частей туши; возможный вариант отмечен в сноске.
- source_word: בְּשָׂרוֹ
  choice: мясом
  rationale: בָּשָׂר здесь обозначает плоть, то есть мясо животного. В современном русском «мясо» в данном жертвенном контексте естественнее, чем более возвышенная «плоть».
- source_word: פִּרְשׁוֹ
  choice: помётом
  rationale: פֶּרֶשׁ конкретно обозначает испражнения животного, а не внутренности или отходы вообще. «Помёт» точно передаёт значение и подходит к животному.
- source_word: שָׂרַף בָּאֵשׁ
  choice: сжёг
  rationale: Русский глагол «сжёг» уже включает значение уничтожения огнём; добавление «огнём» было бы неестественно избыточным.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: вне стана
  rationale: Устойчивое, краткое и понятное обозначение места за границами израильского стана.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как и повелел
  rationale: Оборот выражает точное соответствие действия данному повелению; частица «и» естественно передаёт этот оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, а не заменяющий его титул.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: быка вместе с его кожей, мясом и помётом
  rationale: Оборот «вместе с» естественно передаёт накопительный перечень прямых дополнений, сохраняя все названные элементы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. «Вне стана» сохраняет традиционную жертвенно-повествовательную окраску, оставаясь понятным; синтаксис сглаживает многократное еврейское וְאֶת без потери состава перечня.
