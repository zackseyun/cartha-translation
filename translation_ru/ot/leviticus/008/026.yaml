base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: ru
  text: Из корзины с пресным хлебом, находившейся перед Яхве, он взял одну пресную лепёшку, одну хлебную лепёшку с маслом[a] и одну тонкую лепёшку и положил их на жировые части и на правое бедро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одну лепёшку, замешанную с маслом». Еврейское выражение указывает на хлебное изделие, приготовленное с маслом, но точный способ приготовления не уточняет.'
    reason: Лексическая неоднозначность сочетания חַלַּת לֶחֶם שֶׁמֶן.
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: из корзины с пресным хлебом
  rationale: Предлог מִן указывает на источник, а הַמַּצּוֹת — на находившиеся в корзине пресные хлебные изделия. Формулировка естественна по-русски и сохраняет конкретную обрядовую деталь.
- source_word: לִפְנֵי יְהוָה
  choice: стоявшей перед Яхве
  rationale: Оборот לִפְנֵי передаёт нахождение в присутствии Яхве; причастный оборот естественно связывает это определение с корзиной.
- source_word: חַלַּת מַצָּה אַחַת
  choice: одну пресную лепёшку
  rationale: חַלָּה обозначает отдельное хлебное изделие, а מַצָּה уточняет, что оно было пресным. «Лепёшка» ясно передаёт форму изделия без излишней конкретизации.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: одну хлебную лепёшку с маслом
  rationale: Еврейское сочетание связывает хлебное изделие с маслом, но не уточняет способ приготовления. Перевод сохраняет эту неопределённость; возможное смешивание с маслом отмечено в сноске.
- source_word: רָקִיק אֶחָד
  choice: одну тонкую лепёшку
  rationale: רָקִיק — тонкое плоское хлебное изделие. «Тонкая лепёшка» понятнее современному русскому читателю, чем узкоспециальные варианты.
- source_word: וַיָּשֶׂם
  choice: и положил их
  rationale: Глагол в еврейском стоит в единственном числе, но относится к трём только что названным предметам; русское местоимение множественного числа требуется по смыслу.
- source_word: הַחֲלָבִים
  choice: жировые части
  rationale: В жертвенном контексте речь идёт о предназначенных для принесения жировых частях животного, а не о жире вообще.
- source_word: שׁוֹק הַיָּמִין
  choice: правое бедро
  rationale: שׁוֹק обозначает часть ноги жертвенного животного; «правое бедро» — точный и общепонятный русский эквивалент в данном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено четырёхбуквенное Божье имя. «Яхве» передаёт личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной обрядовой лексикой. Сохранены последовательность трёх хлебных изделий и неопределённость способа использования масла; архаизмы и конфессионально окрашенные термины не вводились.
