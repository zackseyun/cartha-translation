base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ru
  text: Затем Моисей взял лежавшие у них на ладонях части и сжёг их на жертвеннике поверх всесожжения. Это была жертва посвящения[a] в приятное благоухание, огненная жертва[b] Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва поставления». Еврейское מִלֻּאִים — специальный термин для жертвы при введении священников в служение; буквально он связан с «наполнением рук».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приношение пищи». Еврейское אִשֶּׁה — специальное обозначение жертвы, предаваемой огню на жертвеннике; вариант «приношение пищи» отражает другое понимание этого термина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֹתָם מֵעַל כַּפֵּיהֶם
  choice: взял всё это с их ладоней
  rationale: Местоимение во множественном числе указывает на части жертвы из предыдущего стиха. «С ладоней» точно передаёт כַּפֵּיהֶם и естественно описывает ритуальное действие.
- source_word: וַיַּקְטֵר הַמִּזְבֵּחָה
  choice: сжёг на жертвеннике
  rationale: В жертвенном контексте форма глагола קטר означает предать жертву огню, чтобы она поднялась дымом. «Сжёг» ясно и естественно передаёт действие; конечное ה в слове «жертвенник» указывает место/направление действия.
- source_word: עַל הָעֹלָה
  choice: поверх всесожжения
  rationale: Предлог עַל здесь наиболее естественно означает «на, поверх», а עֹלָה — установленный термин для жертвы всесожжения.
- source_word: מִלֻּאִים
  choice: жертва посвящения
  rationale: Это техническое обозначение жертвы в обряде поставления Аарона и его сынов на священническое служение. «Посвящение» понятно современному читателю и не переносит в текст более позднюю церковную терминологию.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: принесённая в приятное благоухание
  rationale: Передаёт устойчивую жертвенную формулу и мотив благоприятного принятия жертвы, не устраняя образ благоухания.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Технический жертвенный термин обозначает приношение, предаваемое огню. Формальный вариант сохраняет непосредственную связь с огнём; иное понимание отмечено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», чтобы сохранить его отличие от титула «Господь».
theological_decisions:
- issue: Значение технического термина מִלֻּאִים
  choice: жертва посвящения
  alternative: жертва поставления
  rationale: Контекст говорит о введении священников в служение. Выбранная формулировка передаёт освящение и назначение для служения, не связывая обряд с какой-либо поздней конфессиональной практикой.
- issue: Передача אִשֶּׁה
  choice: огненная жертва
  alternative: приношение пищи
  rationale: Еврейский термин допускает традиционное понимание как приношения, сжигаемого на жертвеннике, тогда как «приношение пищи» подчёркивает образ дара для Божьей трапезы. Основной текст сохраняет более непосредственную связь с огнём, а альтернатива вынесена в сноску.
- issue: Передача יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога и не смешивает его с титулом; традиционный вариант остаётся возможным переводческим решением.
translation_notes:
  register: Современный литературный русский язык с достоинством ритуального повествования. Синтаксис сохранён последовательным и конкретным; технические термины переданы понятно, а существенные лексические альтернативы отмечены сносками.
