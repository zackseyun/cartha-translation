revisions:
- from: Затем Моисей взял всё это с их ладоней и сжёг на жертвеннике поверх всесожжения. Это была жертва посвящения[a], принесённая в приятное благоухание, — огненная жертва[b] Яхве.
  to: Затем Моисей взял лежавшие у них на ладонях части и сжёг их на жертвеннике поверх всесожжения. Это была жертва посвящения[a] в приятное благоухание, огненная жертва[b] Яхве.
  rationale: Исправлены добавленный оттенок полноты и неестественная конструкция с «принесённая». «Лежавшие у них на ладонях части» делает ясной отсылку местоимения к частям жертвы из предыдущего стиха, не меняя смысла. Сохранены ритуальные термины, образ приятного благоухания и передача יהוה как «Яхве».
  reviewer_model: gpt-5.6-terra
