  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: ru
  text: И не отходите от входа в Шатёр Встречи семь дней, пока не завершатся дни вашего посвящения, потому что семь дней он будет посвящать вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будет наполнять вашу руку» — еврейское выражение, означающее посвящение и введение в священническое служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: И ... от входа
  rationale: Союз ו передан как «и», а сочетание מִן с פֶּתַח — пространственно как «от входа»; это естественно и сохраняет указание на границу, от которой нельзя удаляться.
- source_word: אֹהֶל מוֹעֵד
  choice: Шатёр Встречи
  rationale: Прозрачно передаёт составное название святилища и избегает менее понятного современному читателю традиционного термина «скиния».
- source_word: לֹא תֵצְאוּ
  choice: не выходите
  rationale: Запретительная форма естественно передана русским повелительным наклонением с отрицанием.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: В русском языке длительность после глагола не требует предлога.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: пока не завершатся дни вашего посвящения
  rationale: Передаёт временной предел и значение завершения, не воспроизводя тяжеловесно буквальное «до дня исполнения дней».
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание семидневного запрета и ясно выражает причинную связь.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: он будет посвящать вас
  rationale: Еврейская идиома буквально означает «наполнять вашу руку», но в данном священническом контексте обозначает введение в служение; смысл передан в тексте, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача священнической идиомы מִלֻּאִים / מִלֵּא אֶת־יָד
  choice: «посвящение» / «будет посвящать вас» с буквальным пояснением в сноске
  alternative: «рукоположение» / «будет наполнять вашу руку»
  rationale: «Посвящение» естественно для ритуального введения священников в служение и не привносит поздней конфессиональной терминологии. Сноска сохраняет доступ к образной форме оригинала.
- issue: Неуказанный субъект יְמַלֵּא
  choice: сохранить местоимение «он» без уточнения
  alternative: «Господь будет посвящать вас» или «Моисей будет посвящать вас»
  rationale: В самой глагольной форме субъект не назван явно; перевод не устраняет эту неоднозначность добавлением имени.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Название «Шатёр Встречи» оформлено с прописных букв как устойчивое наименование святилища; синтаксис упрощён без утраты причинной связи и временного предела.
