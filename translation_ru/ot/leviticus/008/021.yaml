  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Внутренности и голени он омыл водой. Затем Моисей сжёг всего барана на жертвеннике. Это было всесожжение — благоухание, приятное Яхве, огненная жертва для Яхве[a], — как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва, приносимая в огне для Яхве».'
    reason: Лексема אִשֶּׁה допускает как краткую культовую передачу «огненная жертва», так и более описательное понимание жертвы, приносимой посредством огня.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: внутренности
  rationale: Обозначает внутренние части жертвенного животного; «внутренности» конкретно, естественно и уместно в ритуальном контексте.
- source_word: הַכְּרָעַיִם
  choice: голени
  rationale: В жертвенном контексте речь идёт о нижних частях ног животного. «Голени» точнее общего слова «ноги».
- source_word: רָחַץ בַּמָּיִם
  choice: омыл водой
  rationale: Сохраняет явно названное средство омовения и передаёт ритуальный характер действия без архаической тяжеловесности.
- source_word: וַיַּקְטֵר
  choice: сжёг
  rationale: В данном контексте глагол означает сжигание жертвы на алтаре с восхождением дыма. «Сжёг» естественно по-русски; культовый смысл однозначно задаётся жертвенником и всесожжением.
- source_word: כָּל הָאַיִל
  choice: всего барана
  rationale: Передаёт охват всего животного и естественно сочетается с глаголом «сжёг».
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшееся русское обозначение жертвы, целиком сжигаемой на жертвеннике; полнота уже также выражена словами «всего барана».
- source_word: לְרֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  rationale: Сохраняет чувственный образ и смысл угодности жертвы Богу, не сводя выражение к отвлечённому понятию принятия.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Формально и понятно передаёт культовый термин как жертву, связанную со сжиганием на огне; более описательный вариант вынесен в сноску.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как Яхве и повелел Моисею
  rationale: Частица «и» естественно подчёркивает точное соответствие действия данному ранее повелению.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация сохраняет его как личное заветное имя и не подменяет титулом.
- issue: Образ לְרֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  alternative: приятное благоухание
  rationale: Выбранная формулировка ясно указывает, кому благоухание приятно, и сохраняет метафорическую напряжённость исходного культового языка, не объясняя её богословски.
- issue: Значение אִשֶּׁה
  choice: огненная жертва
  alternative: жертва, приносимая в огне
  rationale: Точная природа и этимология термина обсуждаются; основной текст сохраняет традиционную связь с огнём, а сноска предлагает описательную передачу без утверждения, что это буквально пища Бога.
translation_notes:
  register: Современный литературный русский с умеренно торжественным ритуальным регистром. Короткие предложения облегчают чтение; термины «жертвенник» и «всесожжение» сохранены как понятные и укоренённые библейские обозначения. Местоимение «он» отражает продолжающийся субъект предшествующего контекста, после чего имя Моисея названо прямо, как в еврейском тексте.
