  source_fidelity: 'Смысловые элементы еврейского текста в целом переданы верно: омовение внутренностей и голеней, сожжение всего барана на жертвеннике, а также заключительная формула о повелении Яхве Моисею. Однако дательный/целевой оттенок לַיהוָה лучше передать «для Яхве», а не родительным «Яхве».'
