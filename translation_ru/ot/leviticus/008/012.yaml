  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: ru
  text: Затем он вылил немного масла для помазания на голову Аарона и помазал его, чтобы посвятить его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: вылил
  rationale: Глагол יצק обозначает выливание жидкости; «вылил» естественно передаёт завершённое ритуальное действие.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: немного масла для помазания
  rationale: 'Предлог מִן имеет здесь партитивный смысл: была взята часть масла. «Масло для помазания» — ясное современное обозначение его ритуального назначения.'
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: на голову Аарона
  rationale: Прямая и естественная передача места действия.
- source_word: וַיִּמְשַׁח
  choice: помазал
  rationale: «Помазал» является точным и традиционно понятным соответствием משׁח в контексте посвящения священника.
- source_word: לְקַדְּשׁוֹ
  choice: чтобы посвятить его
  rationale: В данном обрядовом контексте קדשׁ означает отделение Аарона для священного служения; «посвятить» ясно передаёт эту функцию.
- source_word: וַ
  choice: Затем
  rationale: Последовательный союз продвигает повествование; «затем» естественно выражает порядок обрядовых действий.
theological_decisions:
- issue: Передача קדשׁ в контексте поставления священника
  choice: чтобы посвятить его
  alternative: чтобы освятить его; чтобы сделать его святым
  rationale: «Посвятить» передаёт ритуальное отделение Аарона для священного служения, не добавляя более поздних конфессиональных оттенков.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, с сохранением ритуальной терминологии. Повтор местоимения «его» отражает структуру еврейского текста и устраняет возможную неясность объекта посвящения.
