base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: ru
  text: Затем он взял жир, курдюк, весь жир, покрывающий внутренности, придаток печени[a], обе почки с их жиром и правое бедро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долю печени». Еврейское слово обозначает определённую часть при печени, которую отделяли при жертвоприношении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Затем он взял
  rationale: Последовательная форма с вау продвигает повествование; «затем» естественно передаёт очередность действия.
- source_word: הַחֵלֶב
  choice: жир
  rationale: Обычное обозначение жировых частей, предназначавшихся для жертвоприношения.
- source_word: הָאַלְיָה
  choice: курдюк
  rationale: Термин обозначает жирный хвост овцы; русское «курдюк» точно и кратко передаёт эту анатомическую особенность.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: весь жир, покрывающий внутренности
  rationale: קֶרֶב в жертвенном контексте относится к внутренним органам; причастный оборот звучит естественно и сохраняет пространственное отношение.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: придаток печени
  rationale: Еврейское выражение обозначает определённую часть при печени, удалявшуюся при разделке жертвы; «придаток» не создаёт ложной анатомической определённости.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: обе почки
  rationale: Естественный русский способ передать парность и определённость органов.
- source_word: חֶלְבְּהֶן
  choice: с их жиром
  rationale: Передаёт принадлежность окружающего жира почкам и естественно связывает элементы перечня.
- source_word: שׁוֹק הַיָּמִין
  choice: правое бедро
  rationale: שׁוֹק обозначает часть ноги, обычно бедро или голень; в данном жертвенном перечне «бедро» является понятным традиционным эквивалентом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена структура анатомического перечня. Термин «курдюк» точен для жирного овечьего хвоста, а менее определённое «придаток печени» сохраняет лексическую неоднозначность исходного выражения.
