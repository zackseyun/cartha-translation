  language: ru
  text: Затем Моисей подвёл Аарона и его сыновей и омыл их водой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: подвёл
  rationale: Порода hифиль глагола קרב означает «приблизить, подвести». В контексте посвящения «подвёл» естественно передаёт конкретное приближение к месту совершения обряда, не добавляя значения официального представления.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Здесь בנים обозначает сыновей Аарона, посвящаемых в священники; перевод сохраняет точность в отношении пола и родства.
- source_word: וַיִּרְחַץ
  choice: омыл
  rationale: רחץ означает «мыть, омывать». «Омыл» звучит естественно и достойно в описании обрядового действия, не уточняя, было ли омовение полным или частичным.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится совместно к Аарону и его сыновьям.
- source_word: בַּמָּיִם
  choice: водой
  rationale: Предлог ב здесь обозначает средство действия; русский творительный падеж естественно передаёт смысл «водой».
- source_word: וַ
  choice: Затем … и
  rationale: Последовательные формы продвигают повествование. «Затем» обозначает переход к следующему действию, а союз «и» сохраняет связь двух действий Моисея.
