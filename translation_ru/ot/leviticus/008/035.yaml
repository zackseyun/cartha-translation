  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: ru
  text: У входа в шатёр встречи оставайтесь днём и ночью семь дней и соблюдайте предписание Яхве, чтобы вам не умереть[a], потому что так мне было повелено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и вы не умрёте»; возможно также: «иначе умрёте».'
    reason: Сочинительная конструкция וְלֹא תָמֻתוּ допускает оттенки результата, обещания либо предупреждения.
lexical_decisions:
- source_word: וּפֶתַח אֹהֶל מוֹעֵד
  choice: У входа в шатёр встречи
  rationale: פֶתַח обозначает вход или проём; «у входа» естественно передаёт местное значение. אֹהֶל מוֹעֵד передано устойчивым и понятным выражением «шатёр встречи».
- source_word: תֵּשְׁבוּ
  choice: оставайтесь
  rationale: В данном обрядовом контексте ישב означает не просто сидеть, а непрерывно оставаться на назначенном месте.
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: днём и ночью семь дней
  rationale: Сохраняется меризм непрерывности «днём и ночью» и длительность в семь дней без ненужного добавления.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: и исполняйте предписанное Яхве
  rationale: Сочетание שמר + משמרת указывает на соблюдение вверенного предписания или обязанности. Буквальное «храните хранение» неестественно по-русски, а выбранная формулировка сохраняет обрядово-обязательный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: וְלֹא תָמֻתוּ
  choice: чтобы вам не умереть
  rationale: Формулировка естественно выражает предотвращаемое послушанием последствие, сохраняя при этом возможную смысловую связь как предупреждения или результата.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: потому что так мне было повелено
  rationale: Страдательная форма сохраняет указание Моисея на полученное им повеление; прошедшее время естественно для русского повествования.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл וְלֹא תָמֻתוּ
  choice: чтобы вам не умереть
  alternative: и вы не умрёте; иначе умрёте
  rationale: Связь с предшествующими повелениями вероятно выражает предотвращаемое последствие, однако еврейское сочинение допускает также координативное прочтение; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Синтаксис сделан ясным и естественным; техническое содержание выражения משמרת יהוה сохранено без тяжёлой буквальности.
