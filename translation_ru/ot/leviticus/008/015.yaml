    issue: «Выллил кровь к основанию жертвенника»
    rationale: Предлог «к» обозначает направление («по направлению к основанию»), тогда как в контексте требуется место выливания крови у основания жертвенника. «У основания» естественно и точно передаёт культовую сцену.
  - severity: low
    issue: «Совершить за него искупление»
    rationale: В русском «за него» обычно выражает действие в чью-либо пользу или вместо кого-либо. Для жертвенника это может затемнять то, что обряд совершается над самим жертвенником; формулировка «над ним обряд искупления» яснее.
