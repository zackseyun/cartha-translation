base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: ru
  text: Он заколол его, и Моисей взял кровь, пальцем нанёс её на рога жертвенника со всех сторон и очистил жертвенник[a]. Затем он вылил кровь у основания жертвенника и освятил его, чтобы совершить над ним обряд искупления[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил обряд очищения жертвенника». В этом обрядовом контексте еврейский глагол означает очищение от ритуальной нечистоты.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные значения: «чтобы очистить его» или «чтобы совершить за него искупление». Еврейское выражение может обозначать искупление, очищение или устранение осквернения посредством жертвенного обряда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Он заколол его
  rationale: В контексте жертвоприношения שׁחט обозначает именно ритуальный закол, а не просто убийство; местоимение «его» естественно указывает на тельца из предыдущего стиха.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: рога жертвенника
  rationale: Точный и общепонятный русский термин для рогообразных выступов жертвенника.
- source_word: סָבִיב בְּאֶצְבָּעוֹ
  choice: пальцем … со всех сторон
  rationale: Передаёт инструментальное значение בְּ и распределительное значение סָבִיב естественным русским порядком слов.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: очистил жертвенник
  rationale: Пиэль глагола חטא в священническом обрядовом контексте означает ритуально очистить, а не «ввести в грех»; «очистил» звучит ясно и естественно по-русски.
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: вылил кровь к основанию жертвенника
  rationale: יָצַק означает «лить, выливать», а יְסוֹד здесь обозначает основание жертвенника; предлог «к» сохраняет направительное значение אֶל.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: освятил его
  rationale: קדשׁ означает отделить предмет как святой и предназначенный для священного употребления; «освятил» точно и привычно передаёт это действие.
- source_word: לְכַפֵּר עָלָיו
  choice: чтобы совершить за него искупление
  rationale: Формулировка сохраняет сакральный вес כפר и представляет жертвенник объектом обряда, не сводя многозначный термин только к очищению.
theological_decisions:
- issue: Значение חטא в обряде очищения жертвенника
  choice: очистил жертвенник
  alternative: совершил обряд очищения жертвенника
  rationale: Здесь речь не о грехе самого жертвенника, а о его ритуальном очищении посредством крови; перевод не привносит позднейших догматических объяснений.
- issue: Значение כפר применительно к жертвеннику
  choice: совершить за него искупление
  alternative: очистить его; совершить над ним обряд искупления
  rationale: Еврейская конструкция допускает оттенки искупления, очищения и устранения осквернения. Основной текст сохраняет традиционный культовый термин, а примечание удерживает реальную смысловую широту и необычное отношение действия к жертвеннику.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для священнического обрядового текста. Синтаксис несколько упрощён по сравнению с цепочкой еврейских waw-последовательностей, но порядок действий сохранён. Термины «жертвенник», «освятил» и «искупление» сохраняют культовую точность, оставаясь понятными широкому читателю.
