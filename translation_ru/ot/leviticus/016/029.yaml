base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: ru
  text: 'Это будет для вас вечным установлением: в седьмом месяце, в десятый день месяца, смиряйте себя[a], и никакой работы не должен делать ни уроженец, ни переселенец, живущий среди вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «изнуряйте себя». Это выражение традиционно понимается как включающее пост.'
    reason: Лексическая альтернатива и пояснение устойчивого еврейского выражения.
lexical_decisions:
- source_word: וְהָיְתָה
  choice: И пусть это будет
  rationale: В юридической формуле глагол היה вводит обязательное установление; местоимение «это» естественно отсылает к предшествующим предписаниям.
- source_word: לְחֻקַּת עוֹלָם
  choice: вечным установлением
  rationale: חֻקָּה обозначает установленное предписание, а עוֹלָם выражает его непреходящую, постоянную силу в рамках завета.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: в седьмом месяце, в десятый день месяца
  rationale: Передаёт календарную датировку ясно и близко к еврейскому тексту.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: смиряйте себя
  rationale: Сочетание ענה в породе piel с נֶפֶשׁ выражает самоумаление или самоограничение. Перевод сохраняет широту значения и не сводит заповедь исключительно к посту.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: и не делайте никакой работы
  rationale: Прямой и естественный перевод запрета любой работы.
- source_word: הָאֶזְרָח
  choice: уроженец
  rationale: אֶזְרָח обозначает коренного члена общества и противопоставлен живущему среди народа переселенцу.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: переселенец, живущий среди вас
  rationale: גֵּר — постоянно проживающий в общине чужеземец; «переселенец» передаёт социально-правовой смысл без нежелательных современных оттенков, а причастный оборот отражает повтор корня в оригинале.
theological_decisions:
- issue: Смысл повеления о самоограничении в День искупления
  choice: смиряйте себя
  alternative: изнуряйте себя; поститесь
  rationale: Еврейское выражение шире конкретного обряда. Пост традиционно входит в его понимание, однако прямое указание только на пост сузило бы смысл исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного стиля. Синтаксис сделан ясным для обычного читателя; конструкция «ни… ни…» показывает, что запрет относится к обеим названным группам.
