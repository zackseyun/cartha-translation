review_pass:
  verdict: revise
  source_fidelity: 'Основные лексические соответствия верны: «вечное установление», датировка, «смиряйте себя» с примечанием, запрет работы и различение уроженца и гер/переселенца адекватно передают еврейский текст. Однако заключительная конструкция проекта синтаксически не связывает названные группы с запретом работы достаточно ясно.'
  naturalness: «И пусть это будет» несколько ослабляет законодательную формулу и менее естественно, чем прямое «Это будет». Оборот после тире «ни уроженец, ни переселенец» при повелительном «не делайте» создаёт синтаксическую неясность. Перестройка с «не должен делать» даёт нормативный русский юридико-законодательный стиль и ясно распространяет запрет на обе группы.
  terminology: «Уроженец» и «переселенец, живущий среди вас» удачно передают противопоставление הָאֶזְרָח и הַגֵּר הַגָּר בְּתוֹכְכֶם. «Смиряйте себя» сохраняет широту תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם, не сводя её к посту. В примечании более точна русская буквальная альтернатива без искусственного дополнения «свои души».
