  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: ru
  text: Тот, кто отсылает козла к Азазелю[a], должен выстирать свою одежду и омыть своё тело водой. После этого он может войти в стан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Азазеля». Значение еврейского слова спорно: оно может пониматься как имя или особое обозначение, либо в более функциональном смысле — как указание на удаление; отсюда традиционное выражение «козёл отпущения».'
    reason: Сохраняет спорность значения עֲזָאזֵל и возможное значение предлога, не навязывая толкования и не добавляя необязательного исторического утверждения.
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: Тот, кто отведёт
  rationale: Субстантивированное причастие обозначает человека, которому поручено увести козла; «отведёт» естественно передаёт направленное удаление животного.
- source_word: הַשָּׂעִיר
  choice: козла
  rationale: В данном обрядовом контексте речь идёт о козле-самце; русское «козёл» точно и естественно передаёт референт.
- source_word: לַעֲזָאזֵל
  choice: к Азазелю
  rationale: Транслитерация сохраняет спорность еврейского термина, а предлог «к» передаёт наиболее естественное здесь понимание направленности, не определяя природу Азазеля.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Формулировка ясно передаёт обязательное ритуальное действие современным литературным русским языком.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: и омыть своё тело водой
  rationale: «Тело» естественно передаёт בשר в контексте ритуального омовения; творительный «водой» идиоматичен по-русски и сохраняет указание на средство омовения.
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Ясно и естественно обозначает установленную последовательность действий.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: он может войти в стан
  rationale: Имперфект в контексте выражает разрешение вернуться лишь после омовения; «войти в стан» соответствует направлению внутрь лагеря и сохраняет библейски уместный регистр.
theological_decisions:
- issue: Значение לַעֲזָאזֵל в обряде Дня искупления
  choice: Передать как собственное обозначение «к Азазелю»
  alternative: «для удаления», «козла отпущения», «для Азазеля»
  rationale: Значение термина спорно. Транслитерация не отождествляет Азазеля ни с отвлечённым удалением, ни с самим козлом, ни определённо с каким-либо существом; примечание сохраняет возможное понимание предлога как «для».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром, подходящим для обрядово-правового текста. «Стан» сохранён как понятное библейское обозначение лагеря; синтаксис упрощён до двух предложений ради ясной последовательности предписания и допуска.
