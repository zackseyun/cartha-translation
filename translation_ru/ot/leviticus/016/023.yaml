  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: ru
  text: Затем Аарон войдёт в шатёр встречи, снимет льняные одежды, которые надел перед тем, как войти в святилище[a], и оставит их там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святое место»; с учётом общего контекста Дня искупления некоторые понимают это выражение более узко — как «Святое святых».'
    reason: Альтернативная передача и возможное более узкое понимание הַקֹּדֶשׁ.
lexical_decisions:
- source_word: וּבָא
  choice: Затем Аарон войдёт
  rationale: В последовательности обрядовых предписаний waw с формой qatal передаёт следующий этап действия. Будущее время естественно выражает предписание, а «затем» обозначает процедурную последовательность.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Устойчивое и прозрачное обозначение священного шатра; строчные буквы не превращают описательное наименование в имя собственное.
- source_word: וּפָשַׁט
  choice: снимет
  rationale: Обычный современный русский глагол для снятия одежды, точно передающий действие без излишней резкости или канцелярской формальности.
- source_word: בִּגְדֵי הַבָּד
  choice: льняные одежды
  rationale: Сохраняет как значение «одежды», так и важное для обряда указание на материал.
- source_word: אֲשֶׁר לָבַשׁ
  choice: которые надел
  rationale: Передаёт значение לבש как совершённого действия — облачения в названные одежды.
- source_word: בְּבֹאוֹ
  choice: перед тем, как войти
  rationale: Инфинитивная конструкция обозначает временное обстоятельство. По смыслу одежды были надеты для входа; такая формулировка естественна по-русски и не создаёт впечатления, будто Аарон надевал их уже в процессе входа.
- source_word: הַקֹּדֶשׁ
  choice: святилище
  rationale: Передаёт субстантивированное «святое [место]», не уточняя в основном тексте, идёт ли речь именно о Святом святых.
- source_word: וְהִנִּיחָם שָׁם
  choice: и оставит их там
  rationale: Естественно передаёт значение הניח — положить или оставить — без необоснованного уточнения способа размещения одежд.
theological_decisions:
- issue: К какому месту относится הַקֹּדֶשׁ
  choice: святилище
  alternative: святое место; Святое святых
  rationale: Еврейский текст использует общее выражение «святое [место]», а не полное наименование внутренней части святилища. Перевод сохраняет эту широту, тогда как примечание сообщает более узкое контекстуальное понимание.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис передаёт последовательность обрядовых действий; терминология остаётся понятной без конфессионально специфических уточнений.
