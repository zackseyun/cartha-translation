  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: ru
  text: И приведёт Аарон быка для жертвы за грех, предназначенного для себя[a], и совершит искупление за себя и за свой дом[b]; затем он заколет быка для жертвы за грех, предназначенного для себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быка жертвы за грех».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «за себя и за свой дом»; «дом» здесь означает домашних.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: и приведёт
  rationale: Хифиль глагола קרב в жертвенном контексте означает привести или представить животное перед святилищем. «Приведёт» естественно по-русски и не смешивает представление жертвы с последующим закланием.
- source_word: פַּר הַחַטָּאת
  choice: быка для жертвы за грех
  rationale: Конструкцию можно понимать как обозначение быка, предназначенного для жертвы за грех. Такой перевод сохраняет традиционный жертвенный термин и звучит естественнее буквального «бык жертвы за грех».
- source_word: אֲשֶׁר לוֹ
  choice: предназначенного для него самого
  rationale: В данном обрядовом контексте выражение указывает не просто на принадлежность быка Аарону, а на его назначение ради самого Аарона.
- source_word: וְכִפֶּר
  choice: совершит искупление
  rationale: Это устойчивый и достаточно широкий русский эквивалент священнического כפר; он не сводит значение исключительно к очищению и не навязывает конкретной теории искупления.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: за себя и за свой дом
  rationale: «За» передаёт действие ради или от имени названных лиц, а «дом» сохраняет образность еврейского ביתו и в контексте означает домашних Аарона.
- source_word: וְשָׁחַט
  choice: затем он заколет
  rationale: «Заколет» является точным литературным термином для ритуального умерщвления жертвенного животного; «затем» естественно передаёт последовательность действий.
theological_decisions:
- issue: Значение жертвенного כפר
  choice: совершит искупление
  alternative: совершит очищение
  rationale: Выбранная формулировка сохраняет широкий сакральный смысл глагола и не решает в пользу одной трактовки вопрос о том, описывает ли он прежде всего очищение, умилостивление или общее восстановление отношений.
- issue: Значение אֲשֶׁר לוֹ
  choice: предназначенного для него самого
  alternative: принадлежащего ему
  rationale: Контекст Дня искупления указывает на обрядовое назначение жертвы за самого Аарона, однако перевод не уточняет механизм или богословское основание этого действия.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно формальным библейским регистром. Сохранены повтор ключевого обозначения быка и традиционные жертвенные термины; устаревшие формы и излишне специальные богословские уточнения исключены.
