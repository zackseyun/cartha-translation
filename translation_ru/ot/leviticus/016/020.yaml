base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: ru
  text: Когда он закончит совершать искупление[a] за святилище[b], шатёр встречи и жертвенник, он представит[c] живого козла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «совершать искупление» может также означать совершать обрядовое очищение.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Святое место».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «приблизит», то есть представит для следующего обрядового действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: Когда он закончит совершать искупление
  rationale: Конструкция передаёт завершение предшествующего обрядового действия; придаточное времени естественно выражает последовательность действий по-русски.
- source_word: הַקֹּדֶשׁ
  choice: святилище
  rationale: В контексте Дня искупления слово обозначает священное пространство; «святилище» ясно и не сужает значение до одной его части.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прямой и понятный эквивалент устойчивого еврейского наименования, сохраняющий образы шатра и назначенной встречи.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычный современный русский эквивалент культового термина.
- source_word: וְהִקְרִיב
  choice: пусть подведёт
  rationale: Глагол буквально означает «приблизить, подвести»; здесь речь о выведении живого козла для следующего обрядового действия, а не о его принесении в жертву.
- source_word: הַשָּׂעִיר הֶחָי
  choice: живого козла
  rationale: Определение отличает этого козла от уже заколотого; формулировка кратка и естественна по-русски.
theological_decisions:
- issue: Значение כפר в обрядовом контексте
  choice: совершать искупление
  alternative: совершать обрядовое очищение
  rationale: «Совершать искупление» сохраняет широкий культово-богословский смысл глагола и не навязывает конкретной теории; возможный оттенок очищения отмечен в сноске.
- issue: Определение הַקֹּדֶשׁ
  choice: святилище
  alternative: Святое место
  rationale: «Святилище» естественно обозначает сакральное пространство в данном перечислении, тогда как буквальная альтернатива сохраняется в сноске.
- issue: Понимание הקריב применительно к живому козлу
  choice: подведёт
  alternative: представит
  rationale: Перевод сохраняет пространственно-обрядовый смысл «приблизить» и не создаёт впечатления, будто живого козла сейчас должны заколоть.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис ясен обычному читателю; ключевая культовая терминология и неоднозначность כפר сохранены.
