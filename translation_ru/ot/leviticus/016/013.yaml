base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: ru
  text: Он должен положить благовоние на огонь пред Яхве, чтобы облако благовония покрыло крышку искупления[a], которая находится над свидетельством, и он не умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также переводят: «престол милости» или «очистилище». Еврейское слово обозначает крышку ковчега, особенно в связи с совершаемыми над ней обрядами искупления.'
    reason: Лексическая альтернатива для הַכַּפֹּרֶת и пояснение культового значения термина.
lexical_decisions:
- source_word: וְנָתַן
  choice: пусть он положит
  rationale: В последовательности обрядовых предписаний форма выражает указание; эта конструкция естественно передаёт предписывающую силу без излишней архаизации.
- source_word: הַקְּטֹרֶת
  choice: благовоние
  rationale: Слово обозначает благовонный состав, употребляемый при святилищном обряде; единственное число сохраняет форму и собирательный смысл еврейского существительного.
- source_word: עַל הָאֵשׁ
  choice: на огонь
  rationale: Предлог указывает на помещение благовония непосредственно на огонь или горящие угли.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Выражение обозначает совершение обряда в присутствии Яхве; «пред» сохраняет краткость и культовую окраску оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: וְכִסָּה
  choice: чтобы … покрыло
  rationale: В данном контексте последовательность выражает предполагаемую цель или необходимый результат возложения благовония на огонь.
- source_word: עֲנַן הַקְּטֹרֶת
  choice: облако благовония
  rationale: Прямая передача конструкции сохраняет образ и не уточняет сверх текста, идёт ли речь именно о дыме.
- source_word: הַכַּפֹּרֶת
  choice: крышку искупления
  rationale: Термин обозначает крышку ковчега в её особой роли в обрядах искупления; перевод одновременно передаёт предмет и его культовое назначение.
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: которая находится над свидетельством
  rationale: Сохраняется традиционное обозначение «свидетельство» без пояснительного добавления о скрижалях или документе завета.
- source_word: וְלֹא יָמוּת
  choice: и чтобы он не умер
  rationale: Фраза передаёт предотвращаемое последствие и сохраняет смысловую связь с образованием покрывающего облака.
theological_decisions:
- issue: Передача הַכַּפֹּרֶת в контексте обряда искупления
  choice: крышка искупления
  alternative: престол милости; очистилище
  rationale: Основной вариант ясно обозначает реальную крышку ковчега и её связь с искуплением, не превращая предмет в буквальный престол. Исторически знакомые варианты отмечены в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в отличие от замены его титулом; форма «Яхве» соответствует принятой современной русской передаче.
- issue: Связь заключительного וְלֹא יָמוּת с предшествующим предписанием
  choice: и чтобы он не умер
  alternative: и он не умрёт; иначе он умрёт
  rationale: Целевая формулировка сохраняет защитную функцию облака благовония, не превращая фразу ни в безусловное обещание, ни в более резкое предупреждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис сохраняет последовательность обрядового предписания, но избегает устаревших форм вроде «дабы» и «да не умрёт».
