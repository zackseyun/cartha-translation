source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: ru
  text: Пусть в шатре собрания не будет никого, когда он войдёт, чтобы совершить искупление в святилище, — пока не выйдет. Он совершит искупление за себя, за свой дом и за всё собрание Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל־אָדָם לֹא יִהְיֶה
  choice: пусть никого не будет
  rationale: Естественно передаёт всеобщий запрет присутствия людей, не сужая значение אָדָם исключительно до мужчин.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт обычное значение מוֹעֵד как назначенной встречи и сохраняет культовый термин без архаичного «скиния».
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: совершить искупление / совершит искупление
  rationale: В данном ритуальном контексте כפר обозначает обрядовое устранение вины и нечистоты; устойчивая русская формула сохраняет богословскую ёмкость глагола.
- source_word: בַּקֹּדֶשׁ
  choice: в святилище
  rationale: Контекст указывает на священное пространство, куда входит первосвященник; перевод не уточняет его часть сверх выраженного в еврейском тексте.
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: Сохраняет широкое значение «дом, домочадцы, семья», не сводя его только к физическому жилищу.
- source_word: קְהַל יִשְׂרָאֵל
  choice: собрание Израиля
  rationale: Формально и понятно передаёт קהל как собравшуюся общину народа.
theological_decisions:
- issue: Круг лиц, которым запрещено находиться в шатре
  choice: никого
  alternative: ни одного мужчины / ни одного человека
  rationale: כָל־אָדָם в запретительной конструкции означает отсутствие любого человека; «никого» сохраняет универсальность и не вносит гендерного ограничения.
- issue: Значение כפר
  choice: совершить искупление
  alternative: очистить / примирить
  rationale: Оставлена традиционная многозначная культовая формула, чтобы не разрешать однозначно напряжение между очищением святыни и искуплением людей.
- issue: Значение בַּקֹּדֶשׁ
  choice: в святилище
  alternative: в Святом святых / в святом месте
  rationale: Еврейское выражение допускает контекстное отнесение к внутреннему святилищу, но само по себе не содержит полного названия «Святое святых»; перевод сохраняет эту меру определённости.
translation_notes:
  register: Современный литературный русский язык с достоинством культового повествования. Синтаксис слегка перестроен («с того времени… и до того…») ради ясной передачи временных границ בְּבֹאוֹ… עַד־צֵאתוֹ. Архаизмы исключены; ключевые богословские термины сохранены.
