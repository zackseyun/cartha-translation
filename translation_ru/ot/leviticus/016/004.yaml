source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: ru
  text: Пусть он наденет священный льняной хитон, а на теле у него будут льняные нижние одежды; пусть опояшется льняным поясом и обернёт голову льняным тюрбаном. Это священные одежды. Пусть он омоет своё тело водой и затем наденет их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: священный льняной хитон
  rationale: «Хитон» точно и привычно обозначает длинную нательную одежду библейской эпохи; קֹדֶשׁ передано прилагательным «священный», то есть предназначенный для священнослужения.
- source_word: מִכְנְסֵי בַד
  choice: льняное нижнее одеяние
  rationale: Речь идёт о льняной одежде для нижней части тела, носимой непосредственно на теле. Формулировка современна и не вызывает бытовых ассоциаций слова «шорты» или архаичности слова «исподнее».
- source_word: עַל בְּשָׂרוֹ
  choice: на теле у него
  rationale: Буквально «на его плоти»; в контексте одежды русское «на теле» естественно передаёт конкретный смысл без привнесения позднейших богословских оттенков слова «плоть».
- source_word: אַבְנֵט בַּד
  choice: льняной пояс
  rationale: אַבְנֵט обозначает тканый предмет священнического облачения, которым опоясывались; «пояс» ясно и стилистически уместно.
- source_word: יַחְגֹּר
  choice: опояшется
  rationale: Русский глагол точно передаёт действие обвязывания поясом и сохраняет возвратное значение формы.
- source_word: מִצְנֶפֶת בַּד
  choice: льняной тюрбан
  rationale: מִצְנֶפֶת — оборачиваемый вокруг головы священнический головной убор; «тюрбан» является конкретным и узнаваемым соответствием.
- source_word: יִצְנֹף
  choice: обернёт голову
  rationale: Глагол связан с обматыванием или оборачиванием головного убора; такая передача естественнее буквального «обмотается тюрбаном».
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: священные одежды
  rationale: Выражение указывает на культовую посвящённость одежды; «священные» в современном русском звучит естественнее сочетания «святые одежды».
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: омоет своё тело водой
  rationale: «Омоет» сохраняет ритуальный контекст, а «тело» естественно передаёт בָּשָׂר здесь.
- source_word: וּלְבֵשָׁם
  choice: и затем наденет их
  rationale: 'Форма продолжает предписанную последовательность действий: омовение предшествует облачению. «Затем» делает эту последовательность ясной по-русски.'
theological_decisions:
- issue: Характер священности одежд
  choice: «священные одежды» — выделенные для священнического служения
  alternative: «святые одежды»
  rationale: Перевод сохраняет культовое значение קֹדֶשׁ, не добавляя символического или конфессионального толкования.
- issue: Передача בְּשָׂרוֹ в ритуальном контексте
  choice: «тело»
  alternative: «плоть»
  rationale: В данном контексте слово обозначает физическое тело, на которое надевают одежду и которое омывают. «Тело» не устраняет смысла и избегает неуместных богословских ассоциаций.
- issue: Последовательность омовения и облачения
  choice: «и затем наденет их»
  alternative: «и наденет их»
  rationale: Контекст предписания представляет омовение как действие перед надеванием священных одежд; «затем» естественно выражает эту последовательность, не предлагая дополнительного обряда.
translation_notes:
  register: Современный литературный русский с достоинством законодательного и богослужебного контекста. Синтаксис предписания передан повтором «пусть», без тяжеловесных архаизмов. Маркеры сносок не используются, поскольку существенные альтернативы отражены в решениях и не требуют примечаний в публикационном тексте.
