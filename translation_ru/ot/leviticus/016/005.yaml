  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: ru
  text: И от общины сынов Израиля[a] он возьмёт двух козлов в жертву за грех[b] и одного барана во всесожжение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
