    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: И от
  rationale: 'Сохраняет соединительное значение וּ и указание на источник, выраженное מֵאֵת: животных берут от общины.'
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: общины сынов Израиля
  rationale: «Община» естественно передаёт обозначение собранного народа завета, а «сыны Израиля» сохраняет конкретную форму еврейского выражения; идиоматический вариант отмечен в сноске.
- source_word: יִקַּח
  choice: он возьмёт
  rationale: Будущее совершенного вида естественно передаёт предписывающую силу имперфекта в русском тексте ритуального закона.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: двух козлов
  rationale: «Козлы» ясно обозначает самцов коз; более буквальное сочетание «козлов из коз» по-русски избыточно.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Устоявшееся и понятное название жертвоприношения; возможный акцент на очищении сохранён в сноске.
- source_word: וְאַיִל אֶחָד
  choice: и одного барана
  rationale: Точно сохраняет вид животного и числительное.
- source_word: לְעֹלָה
  choice: во всесожжение
  rationale: Устоявшийся русский библейский термин для жертвы, полностью сжигаемой на жертвеннике; форма с предлогом естественна после «возьмёт».
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян / народа Израиля
  rationale: Основной текст сохраняет мужскую корпоративную формулу оригинала, не сужая её референт только до взрослых мужчин; идиоматическое значение пояснено в сноске.
- issue: Передача חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное название остаётся ясным современному читателю, однако еврейский термин в Левите также подчёркивает устранение ритуальной нечистоты; эта смысловая напряжённость не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Синтаксис краткий и прямой; сохранена последовательность еврейского оригинала без неестественного калькирования. Маркеры сносок размещены непосредственно после соответствующих выражений.
