source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: ru
  text: И пусть он возьмёт кадильницу, полную горящих углей с жертвенника, находящегося перед Яхве, и две полные пригоршни мелко истолчённого благовонного курения и внесёт всё это за завесу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутрь завесы». Имеется в виду пространство за завесой — внутреннее святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: И пусть он возьмёт
  rationale: В последовательности обрядовых предписаний форма выражает инструкцию; оборот «пусть возьмёт» естественен в современном русском и сохраняет предписывающую силу.
- source_word: מְלֹא הַמַּחְתָּה
  choice: кадильницу, полную
  rationale: Конструкция буквально обозначает наполненность кадильницы; выбранный порядок слов естественен по-русски и сохраняет указание на сосуд и его заполненность.
- source_word: גַּחֲלֵי אֵשׁ
  choice: горящих углей
  rationale: Сочетание обозначает раскалённые, огненные угли; «горящие угли» передаёт смысл яснее, чем формальное «угли огня».
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: с жертвенника
  rationale: מֵעַל указывает на снятие углей с поверхности жертвенника; русский предлог «с» точно и естественно передаёт пространственное отношение.
- source_word: מִלִּפְנֵי יְהוָה
  choice: который пред Яхве
  rationale: Фраза определяет положение жертвенника перед Яхве; относительное придаточное устраняет возможное ошибочное отнесение оборота к действию взятия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, без замены титулом.
- source_word: וּמְלֹא חָפְנָיו
  choice: обе пригоршни
  rationale: חָפְנָיו связано с двумя сложенными пригоршнями; «обе пригоршни» кратко и естественно сохраняет двойственное значение и меру количества.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: мелко истолчённого благовонного курения
  rationale: «Благовонное курение» передаёт ароматическую смесь, а «мелко истолчённого» — её измельчённое состояние, обозначенное דַּקָּה.
- source_word: וְהֵבִיא
  choice: и внесёт всё это
  rationale: Hiphil от בוא означает внесение предметов внутрь; «всё это» ясно указывает на оба ранее названных объекта и не добавляет нового содержания.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: за завесу
  rationale: В данном контексте выражение обозначает движение во внутреннее пространство по ту сторону разделительной завесы; это наиболее естественная русская формулировка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Пространственное значение מִבֵּית לַפָּרֹכֶת
  choice: за завесу
  alternative: внутрь завесы
  rationale: Контекст требует направления в пространство по другую сторону завесы, то есть во внутреннее святилище; буквальная морфология выражения необычна, поэтому альтернативу отмечает сноска.
translation_notes:
  register: Современный литературный русский с достоинством обрядового предписания. Синтаксис сделан ясным для обычного читателя; сохранены конкретные ритуальные детали и личное имя Яхве.
