revisions:
- from: 'И сказал Яхве Моисею: «Скажи Аарону, брату твоему, чтобы он не входил когда угодно в Святое место за завесу, пред крышку искупления[a], которая на ковчеге, иначе он умрёт, потому что Я являюсь в облаке над крышкой искупления».'
  to: 'И сказал Яхве Моисею: «Скажи Аарону, брату твоему, чтобы он не входил когда угодно в святилище, за завесу, перед крышкой искупления[a], которая на ковчеге, иначе он умрёт, потому что Я явлюсь в облаке над крышкой искупления».'
  rationale: 'Исправлено временное значение אֵרָאֶה: «Я явлюсь» прямо передаёт будущее явление Бога в облаке. «Пред» заменено современным «перед», а обозначение места входа слегка уточнено ради естественного русского синтаксиса. Смысл запрета на вход в произвольное время, конкретность «крышки» и краткое «ковчег» сохранены; сноска привязана к каждому употреблению термина, к которому она относится впервые.'
