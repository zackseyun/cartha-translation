source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Скажи Аарону, брату твоему, чтобы он не входил когда угодно в святилище, за завесу, перед крышкой искупления[a], которая на ковчеге, иначе он умрёт, потому что Я явлюсь в облаке над крышкой искупления».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «престол милости» — традиционное название крышки ковчега, связанной с обрядом искупления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: Скажи Аарону, брату твоему
  rationale: Естественно передаёт повеление и сохраняет порядок и родственное обозначение исходного текста.
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: чтобы он не входил когда угодно
  rationale: Отрицательная юссивная форма выражает запрет, а оборот означает не постоянное вхождение, а вход в любое произвольно избранное время.
- source_word: הַקֹּדֶשׁ מִבֵּית לַפָּרֹכֶת
  choice: в Святое место за завесу
  rationale: В данном контексте обозначено внутреннее священное пространство по ту сторону завесы; формулировка ясна современному читателю.
- source_word: אֶל פְּנֵי הַכַּפֹּרֶת
  choice: пред крышку искупления
  rationale: 'Предлог и существительное переданы конкретно: речь о приближении к передней стороне крышки ковчега, связанной с обрядом искупления.'
- source_word: הָאָרֹן
  choice: ковчеге
  rationale: Сохраняет краткую форму исходного текста без добавления слов «завета».
- source_word: וְלֹא יָמוּת
  choice: иначе он умрёт
  rationale: Ясно выражает смертельное последствие нарушения запрета без архаичного оборота.
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: потому что Я являюсь в облаке
  rationale: Форма אֵרָאֶה может описывать явление Бога; настоящее время по-русски естественно передаёт установленный характер этого явления, не исключая его событийного осуществления.
theological_decisions:
- issue: Передача כַּפֹּרֶת
  choice: крышка искупления
  alternative: престол милости
  rationale: Основной вариант сохраняет предметное значение крышки ковчега и её связь с искуплением. Традиционный богословский вариант дан в сноске, поскольку он известен, но менее прозрачен современному читателю.
- issue: Смысл בְּכָל עֵת
  choice: запрет входить когда угодно
  alternative: не входить во всякое время
  rationale: Контекст говорит об ограничении несанкционированного доступа, а не о том, что Аарон не должен входить постоянно.
- issue: Временное значение אֵרָאֶה
  choice: Я являюсь
  alternative: Я явлюсь
  rationale: Еврейская форма допускает контекстуальное прочтение как установленного или предстоящего явления. Настоящее время естественно выражает постоянное основание запрета, не устраняя событийного оттенка.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским строем. Сохранены имя «Яхве», культовая терминология и синтаксическая ясность; архаизмы сведены к уместному «пред» в пространственно-сакральном контексте.
