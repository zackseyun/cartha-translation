  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: ru
  text: 'И бросит Аарон жребии о двух козлах: один жребий — для ГОСПОДА, а другой — для Азазела[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «другой жребий — для козла отпущения». Значение еврейского слова «Азазел» спорно: оно может пониматься как имя, обозначение роли козла или слово, связанное с удалением.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: возложит
  rationale: Основное значение глагола — «дать, положить». В сочетании со «жребиями» и предлогом עַל он описывает ритуальное возложение или распределение жребиев; «возложит» естественно по-русски и сохраняет образ исходного текста.
- source_word: עַל
  choice: на
  rationale: Передаёт буквальное пространственное значение «на, над» и сохраняет ритуальный образ возложения жребиев на двух козлов.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: двух козлов
  rationale: שָׂעִיר обозначает козла; мужской пол уже выражен русским существительным «козёл», поэтому дополнительных уточнений не требуется.
- source_word: גּוֹרָלוֹת
  choice: жребии
  rationale: Стандартное русское обозначение предметов или результатов священного жребия; форма множественного числа соответствует еврейскому тексту.
- source_word: גּוֹרָל אֶחָד
  choice: один жребий
  rationale: Прямо передаёт повторяющуюся конструкцию и ритуальное распределение двух жребиев.
- source_word: לַיהוָה
  choice: для ГОСПОДА
  rationale: Предлог לְ обозначает предназначение; тетраграмматон передан принятой переводческой формой «ГОСПОДЬ» с типографическим выделением прописными буквами.
- source_word: לַעֲזָאזֵל
  choice: для Азазела
  rationale: Спорный термин עֲזָאזֵל транслитерирован как имя, чтобы не сводить неоднозначность текста к одному толкованию.
theological_decisions:
- issue: Значение עֲזָאזֵל в обряде Дня искупления
  choice: Азазел — транслитерированное имя в основном тексте
  alternative: «козёл отпущения»; «для полного удаления»; обозначение места или существа, связанного с пустыней
  rationale: Сам стих не позволяет однозначно установить, называет ли термин функцию козла, место назначения или личное существо. Транслитерация сохраняет богословскую и лексическую напряжённость; традиционный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством ритуального контекста. Синтаксический параллелизм оригинала сохранён; двоеточие и тире делают распределение жребиев ясным без излишнего истолкования.
