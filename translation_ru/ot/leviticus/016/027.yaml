base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: ru
  text: А тельца жертвы за грех и козла жертвы за грех, кровь которых была внесена для совершения искупления в святилище, пусть вынесет за пределы стана; и пусть сожгут на огне их шкуры, мясо и навоз.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте глагол «вынесет» стоит в единственном числе, а «сожгут» — во множественном.
    reason: textual_feature
lexical_decisions:
- source_word: פַּר הַחַטָּאת / שְׂעִיר הַחַטָּאת
  choice: телец жертвы за грех / козёл жертвы за грех
  rationale: Передаёт жертвенную категорию חַטָּאת узнаваемым русским выражением и сохраняет параллелизм двух словосочетаний.
- source_word: הוּבָא אֶת דָּמָם
  choice: кровь которых была внесена
  rationale: Пассивная форма בוא и контекст указывают на внесение крови внутрь священного пространства.
- source_word: לְכַפֵּר
  choice: для совершения искупления
  rationale: Устоявшаяся и понятная передача культового употребления כפר, не сводящая его значение только к очищению.
- source_word: בַּקֹּדֶשׁ
  choice: в святилище
  rationale: В данном обрядовом контексте слово обозначает священное место, а не абстрактную святость.
- source_word: יוֹצִיא אֶל מִחוּץ לַמַּחֲנֶה
  choice: пусть вынесет за пределы стана
  rationale: Естественно по-русски выражает каузативное движение наружу и направленность, заложенную в еврейской конструкции.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: и пусть сожгут на огне
  rationale: Сохраняет множественное число глагола и обычную для библейско-ритуального русского языка формулу сжигания на огне.
- source_word: עֹרֹתָם
  choice: их шкуры
  rationale: Точное обозначение снятого или подлежащего сожжению наружного покрова животных.
- source_word: בְּשָׂרָם
  choice: мясо
  rationale: В отношении туш жертвенных животных современное русское «мясо» естественнее, чем более архаичное «плоть».
- source_word: פִּרְשָׁם
  choice: нечистоты
  rationale: В контексте туши означает содержимое пищеварительного тракта, навоз или испражнения; «нечистоты» точно и без ненужной грубости передаёт ритуальный контекст.
theological_decisions:
- issue: Передача терминов חַטָּאת и כפר
  choice: «жертва за грех» и «совершение искупления»
  alternative: «очистительная жертва» и «очищение»
  rationale: Выбранные выражения сохраняют традиционно узнаваемый жертвенный и богословский смысл, не исключая очистительной стороны обряда и не навязывая ей статус единственного значения.
- issue: Переход от единственного числа יוֹצִיא к множественному וְשָׂרְפוּ
  choice: «пусть вынесет… и пусть сожгут»
  alternative: «пусть вынесут… и сожгут»
  rationale: Смена числа сохранена как реальная особенность исходного текста; она может различать распорядителя обряда и исполнителей, но перевод не уточняет их личности сверх сказанного.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Стан» сохранён как понятный традиционный термин для лагеря Израиля; синтаксис сделан естественным, при этом переход от единственного числа к множественному не сглажен.
