id: LEV.16.16
reference: Leviticus 16:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: ru
  text: Так он совершит очищение святилища от нечистоты сынов Израиля и от их преступлений — от всех их грехов; так же он поступит и с шатром встречи, который пребывает среди них, посреди их нечистоты.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершит обряд очищения святилища…». Еврейский глагол כפר в этом контексте обозначает искупительно-очистительное обрядовое действие; традиционно его также передают как «совершит искупление за святилище».'
    reason: Сохраняется широкий культовый смысл термина и отмечается традиционная альтернатива.
lexical_decisions:
- source_word: וְכִפֶּר עַל הַקֹּדֶשׁ
  choice: совершит очищение святилища
  rationale: В данном обряде כפר с объектом-святилищем обозначает ритуальное устранение осквернения. «Совершит очищение» естественно по-русски передаёт результат искупительного обряда, не подразумевая, будто грех принадлежит самому святилищу.
- source_word: מִטֻּמְאֹת בְּנֵי יִשְׂרָאֵל
  choice: от нечистоты сынов Израиля
  rationale: Предлог מן указывает, от чего очищается святилище. Собирательное русское «нечистота» звучит естественнее буквального множественного числа и сохраняет ритуальный смысл; «сыны Израиля» передаёт традиционное корпоративное наименование.
- source_word: וּמִפִּשְׁעֵיהֶם לְכָל חַטֹּאתָם
  choice: и от их преступлений — от всех их грехов
  rationale: פשע передано как «преступления», сохраняя оттенок серьёзного нарушения; חטאות по параллелизму означает грехи, а не жертвы за грех. Тире показывает пояснительное или охватывающее отношение, не устраняя возможной синтаксической неоднозначности.
- source_word: וְכֵן יַעֲשֶׂה לְאֹהֶל מוֹעֵד
  choice: так же он поступит и с шатром встречи
  rationale: Фраза указывает на соответствующее обрядовое действие над следующим священным объектом. «Шатёр встречи» прозрачно передаёт אהל מועד без подмены традиционным, но менее буквальным термином «скиния».
- source_word: הַשֹּׁכֵן אִתָּם בְּתוֹךְ טֻמְאֹתָם
  choice: который пребывает среди них, посреди их нечистоты
  rationale: Причастие שכן грамматически относится к шатру. «Пребывает» сохраняет образ постоянного присутствия, а повтор «среди… посреди» отражает различие אִתָּם и בְּתוֹךְ и подчёркивает близость святилища к нечистому народу.
theological_decisions:
- issue: Значение כפר применительно к святилищу в День очищения
  choice: совершит очищение святилища
  alternative: совершит искупление за святилище
  rationale: Контекст прямо связывает действие с ритуальной нечистотой и грехами, загрязняющими святилище. Русское «искупление за святилище» может создать ложное впечатление, будто само святилище виновно; «очищение» передаёт культовый результат, не отрицая искупительного характера обряда.
- issue: Связь לְכָל חַטֹּאתָם с предшествующими словами
  choice: пояснительно-охватывающее «от всех их грехов»
  alternative: «при всех их грехах» или отдельная категория наряду с преступлениями
  rationale: Форма допускает некоторую неоднозначность функции לְ. Перевод сохраняет естественную связь со всем перечнем, а тире не делает её более узкой, чем позволяет еврейский текст.
- issue: К чему относится הַשֹּׁכֵן
  choice: к шатру встречи
  alternative: к Божьему присутствию, подразумеваемому в шатре
  rationale: По грамматическому согласованию причастие мужского рода непосредственно определяет אֹהֶל. Перевод не вводит в текст отдельный субъект «Бог», хотя богословский образ Божьего пребывания среди народа остаётся фоном выражения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Сохранены понятные традиционные выражения «сыны Израиля» и «шатёр встречи»; избегнуты неестественные «нечистоты» во множественном числе и двусмысленное «искупление за святилище». Все маркеры примечаний присутствуют в основном тексте.
