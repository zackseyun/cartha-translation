source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: ru
  text: 'И это будет для вас вечным установлением: раз в год совершать искупление за сынов Израиля, очищая их от всех их грехов[a]. И он сделал так, как повелел Яхве Моисею.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за все их грехи». Еврейское выражение допускает акцент как на искуплении грехов, так и на очищении от них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם לְחֻקַּת עוֹלָם
  choice: И это будет для вас вечным установлением
  rationale: Сохраняет присоединительное וְ, законодательную формулу и длительную обязательность חֻקַּת עוֹלָם; «установление» естественно для современного русского библейско-правового регистра.
- source_word: לְכַפֵּר עַל בְּנֵי יִשְׂרָאֵל
  choice: совершать искупление за сынов Израиля
  rationale: «Совершать искупление» передаёт культовое значение כפר, а «за сынов Израиля» сохраняет форму традиционного коллективного этнонима и значение действия ради них.
- source_word: מִכָּל חַטֹּאתָם
  choice: очищая их от всех их грехов
  rationale: Передаёт отделительно-очистительный оттенок מִן при כפר, не сводя выражение только к причине искупления. Деепричастная конструкция делает связь с предыдущей фразой ясной по-русски.
- source_word: אַחַת בַּשָּׁנָה
  choice: раз в год
  rationale: Естественный современный русский эквивалент ежегодной периодичности.
- source_word: וַיַּעַשׂ
  choice: И он сделал
  rationale: Сохраняет невыраженный в еврейском тексте субъект и не называет его прямо, хотя контекст указывает на Аарона.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: так, как повелел Яхве Моисею
  rationale: Точно передаёт соответствие Божьему повелению; имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Значение כפר и מִן в выражении о грехах
  choice: «совершать искупление… очищая их от всех их грехов»
  alternative: «совершать искупление… за все их грехи»
  rationale: Основной текст удерживает одновременно искупительный и очистительный аспекты священнической формулы, не утверждая, что один полностью исчерпывает другой.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: «сыны Израиля»
  alternative: «израильтяне» / «народ Израиля»
  rationale: Сохранён формальный коллективный этноним исходного текста; он относится к общине Израиля как целому и не предназначен для исключения женщин.
- issue: Передача имени יהוה
  choice: «Яхве»
  alternative: «Господь»
  rationale: Транслитерация сохраняет личное заветное имя, прямо присутствующее в еврейском тексте.
- issue: Неявный субъект וַיַּעַשׂ
  choice: «он сделал»
  alternative: «Аарон сделал»
  rationale: Имя субъекта в стихе не названо; перевод сохраняет эту грамматическую особенность, хотя ближайший контекст позволяет понимать Аарона.
translation_notes:
  register: Современный литературный русский с достоинством законодательного и культового контекста. Синтаксис слегка формален, но понятен обычному читателю; архаизмы сведены к традиционному этнониму «сыны Израиля».
