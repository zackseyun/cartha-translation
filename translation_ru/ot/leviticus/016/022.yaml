  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: ru
  text: Козёл понесёт на себе все их беззакония в отрезанную землю[a], а затем отправит козла в пустыню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в уединённую землю», «в недоступную землю» или «в безлюдную землю». Еврейское выражение, вероятно, обозначает место, отрезанное от человеческого жилья или изолированное от него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: и понесёт
  rationale: Глагол נשׂא означает «нести, уносить». «Понесёт» сохраняет конкретный образ перенесения возложенных на козла беззаконий.
- source_word: הַשָּׂעִיר
  choice: козёл
  rationale: שָׂעִיר обозначает козла, нередко именно самца; русское «козёл» точно и естественно передаёт это значение.
- source_word: עָלָיו
  choice: на себе
  rationale: Предлог с местоименным суффиксом буквально указывает, что беззакония находятся «на нём»; «на себе» естественно выражает здесь соотнесённость с козлом.
- source_word: כָּל עֲוֺנֹתָם
  choice: все их беззакония
  rationale: עָוֹן может обозначать беззаконие, вину и её последствия. «Беззакония» сохраняет нравственную и обрядовую весомость слова, не сводя его к более общему «грехи».
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: в землю отрезанную
  rationale: Редкое גְּזֵרָה связано с идеей отсечения или отделённости. Формулировка намеренно близка к еврейскому образу и не устраняет лексическую неопределённость; более истолковывающие варианты вынесены в примечание.
- source_word: וְשִׁלַּח
  choice: и отпустит
  rationale: В данном обрядовом контексте שׁלח означает отослать или выпустить прочь. «Отпустит» естественно описывает удаление козла в пустыню.
- source_word: בַּמִּדְבָּר
  choice: в пустыню
  rationale: מִדְבָּר обозначает пустынную, степную или необитаемую местность. «Пустыня» — понятный и традиционно точный русский эквивалент в этом контексте.
theological_decisions:
- issue: Образ несения беззаконий козлом
  choice: Сохранить конкретное утверждение, что козёл несёт на себе беззакония народа.
  alternative: 'Передать истолковательно: «унесёт их грехи».'
  rationale: Еврейский текст изображает обрядовое возложение и удаление беззаконий. Конкретный язык сохраняет символическую напряжённость текста и не привносит в стих последующие богословские выводы.
- issue: Значение אֶרֶץ גְּזֵרָה
  choice: Передать в основном тексте как «землю отрезанную».
  alternative: «уединённую землю», «недоступную землю» или «безлюдную землю».
  rationale: Смысл выражения не вполне определён, но, вероятно, связан с отсечённостью или изоляцией. Близкий к форме оригинала перевод сохраняет эту неоднозначность, а понятные смысловые варианты приводятся в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок частей стиха и повтор слова «козёл» сохранены ради ясности обряда и соответствия еврейскому тексту; редкое выражение «землю отрезанную» сопровождено пояснительным примечанием.
