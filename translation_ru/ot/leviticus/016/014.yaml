source:
  edition: WLC
  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: ru
  text: Пусть он возьмёт немного крови быка и пальцем покропит ею переднюю сторону крышки[a], обращённую к востоку; а перед крышкой пусть пальцем покропит этой кровью семь раз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть особую крышку ковчега; возможный перевод: «крышка искупления».'
    reason: Лексическая альтернатива и краткое пояснение культового предмета.
lexical_decisions:
- source_word: וְלָקַח
  choice: Пусть он возьмёт
  rationale: Сочетание союза с перфектной формой в последовательности обрядовых предписаний передаёт не прошедшее событие, а очередное обязательное действие; конструкция с «пусть» естественна для современного русского языка.
- source_word: מִדַּם הַפָּר
  choice: крови быка
  rationale: 'Предлог מִן имеет партитивное значение: берётся часть крови. Русский родительный падеж после «возьмёт» кратко и естественно выражает эту частичность.'
- source_word: וְהִזָּה / יַזֶּה
  choice: покропит
  rationale: В священническом обрядовом контексте נזה обозначает нанесение жидкости посредством кропления. «Покропит» сохраняет конкретность и достоинство ритуального языка.
- source_word: בְאֶצְבָּעוֹ
  choice: пальцем
  rationale: Предлог בְּ обозначает орудие действия; русский творительный падеж точно и естественно передаёт этот смысл.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: крышку с восточной стороны
  rationale: Выражение указывает на поверхность крышки в её восточной части или с восточной стороны. Такой перевод естественно передаёт пространственную ориентацию, не создавая в русском тексте неясного сочетания «лицо крышки к востоку».
- source_word: הַכַּפֹּרֶת
  choice: крышка
  rationale: כַּפֹּרֶת — особая крышка ковчега. «Крышка» непосредственно передаёт предметное значение; культовое значение и возможный вариант «крышка искупления» сохранены в примечании.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: а перед крышкой
  rationale: לִפְנֵי обозначает положение перед предметом. Перевод отличает второе кропление перед крышкой от первого кропления на саму крышку.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Число явно выражено в еврейском тексте и сохраняется как существенная деталь обряда.
- source_word: מִן הַדָּם
  choice: кровью
  rationale: В контексте повторного кропления русский творительный падеж естественно указывает на используемую часть уже упомянутой крови; партитивность понятна из самого действия.
theological_decisions:
- issue: Передача культового термина הַכַּפֹּרֶת
  choice: крышка с поясняющим примечанием
  alternative: крышка искупления; место милости
  rationale: Еврейское слово обозначает крышку ковчега и связано с обрядом очищения/искупления, однако точный способ выражения этой связи в самом термине допускает разные толкования. Основной текст сохраняет конкретный предмет, а примечание — его богословско-обрядовую значимость без навязывания одного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным обрядовым регистром. Формы «пусть он возьмёт» и «пусть… покропит» ясно передают последовательность предписанных действий; устаревшая синтаксическая тяжеловесность избегается.
