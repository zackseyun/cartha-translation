  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: ru
  text: И совершит искупление священник, который будет помазан и посвящён[a], чтобы служить священником вместо своего отца, и наденет льняные одежды — священные одежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чью руку наполнят»; это древнееврейское выражение означает посвящение или поставление на священническое служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: совершит искупление
  rationale: В священническом обрядовом контексте כפר обозначает совершение предписанного действия ради искупления и очищения; формулировка сохраняет культовый смысл, не уточняя сверх текста его механизм.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: В еврейском тексте стоит общее наименование «священник», а не отдельный титул «первосвященник»; особое положение этого священника раскрывается последующими определениями.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: который будет помазан
  rationale: Имперфект в относительном придаточном указывает на законно помазанного преемника; пассивная русская конструкция естественна и не вводит не названного прямо исполнителя.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: и посвящён[a]
  rationale: Буквально «которому наполнят руку» — устойчивый древнееврейский оборот о поставлении на священническое служение. Смысл передан понятно, а буквальный образ сохранён в примечании.
- source_word: לְכַהֵן
  choice: чтобы служить священником
  rationale: Инфинитив выражает назначение и исполнение священнических обязанностей.
- source_word: תַּחַת אָבִיו
  choice: вместо своего отца
  rationale: תחת здесь обозначает преемство и замещение отца в должности.
- source_word: וְלָבַשׁ
  choice: он наденет
  rationale: Глагол обозначает действие облачения; «наденет» естественно передаёт последовательность ритуальных обязанностей.
- source_word: בִּגְדֵי הַבָּד
  choice: льняные одежды
  rationale: בד в контексте священнического облачения означает лён; выражение понятно современному читателю.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: священные одежды
  rationale: Повторное определение поясняет, что льняные одежды отделены для священного употребления; тире естественно передаёт приложение.
theological_decisions:
- issue: Передавать הַכֹּהֵן как «священник» или как «первосвященник»
  choice: священник
  alternative: первосвященник
  rationale: Контекст указывает на первосвященнического преемника, однако сам стих употребляет слово «священник» и определяет его через помазание, поставление и преемство. Перевод сохраняет формулировку источника.
- issue: Как передать идиому «наполнить руку»
  choice: посвящён[a]
  alternative: которому наполнят руку; поставлен
  rationale: Буквальная калька была бы непрозрачной для большинства современных читателей. «Посвящён» передаёт ритуальное поставление, не привязывая текст к поздней конфессиональной терминологии; буквальная идиома вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и богослужебного контекста. Сохранены «священник» вместо интерпретирующего «первосвященник» и приложение «льняные одежды — священные одежды»; синтаксис упрощён лишь настолько, чтобы стих оставался ясным обычному читателю.
