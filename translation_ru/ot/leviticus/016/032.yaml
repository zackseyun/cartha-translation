  source_fidelity: 'Основной текст точно передаёт последовательность еврейского стиха: священник характеризуется помазанием, поставлением на служение преемником отца, совершает искупление и облачается в льняные, то есть священные, одежды. «Священник», а не «первосвященник», верно сохраняет формулировку оригинала. Однако буквальная формулировка примечания неточно воспроизводит синтаксис идиомы: в еврейском тексте речь о том, что наполняют именно его руку, а не о «котором наполнят руку».'
