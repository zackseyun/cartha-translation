base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: ru
  text: 'Вот с чем Аарон должен войти в святилище: с быком из стада в жертву за грех[a] и с бараном во всесожжение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское слово может указывать как на связь жертвы с грехом, так и на совершаемое посредством неё ритуальное очищение.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזֹאת
  choice: Вот с чем
  rationale: Сочетание ב с указательным местоимением может обозначать средство или сопутствующие условия. В данном контексте далее перечисляются жертвенные животные, с которыми Аарон должен войти.
- source_word: יָבֹא
  choice: должен входить
  rationale: Имперфект в законодательном контексте выражает предписание, а не простое будущее действие.
- source_word: אֶל־הַקֹּדֶשׁ
  choice: в святилище
  rationale: Здесь הַקֹּדֶשׁ обозначает священное внутреннее пространство, куда Аарону разрешается войти; «святилище» естественно и не вносит излишней пространственной детализации.
- source_word: בְּפַר בֶּן־בָּקָר
  choice: с молодым быком
  rationale: Выражение буквально имеет форму «бык, сын крупного скота» и идиоматически обозначает молодого быка; естественный русский эквивалент сохраняет вид и возрастную характеристику животного.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном законодательстве חַטָּאת традиционно обозначает жертву за грех; возможный акцент на ритуальном очищении отмечен в сноске.
- source_word: וְאַיִל
  choice: и с бараном
  rationale: אַיִל однозначно обозначает барана; повтор предлога «с» делает русское перечисление ясным.
- source_word: לְעֹלָה
  choice: во всесожжение
  rationale: עֹלָה — установленное обозначение жертвы, полностью сжигаемой на жертвеннике; «всесожжение» является точным и привычным русским библейским термином.
theological_decisions:
- issue: Значение культового термина חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Основной текст сохраняет узнаваемое традиционное наименование, а сноска отражает присущий термину оттенок ритуального очищения, не сводя его значение только к одной стороне.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной культовой терминологией. Синтаксис предписания передан ясно и торжественно, без архаических форм.
