base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: ru
  text: Затем он выйдет к жертвеннику, который перед Яхве, и совершит очищение над ним[a]. Он возьмёт немного крови быка и немного крови козла и нанесёт кровь на роги жертвенника со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершит искупление за него». Еврейский глагол в священнических обрядах может обозначать как искупление, так и ритуальное очищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Затем он выйдет
  rationale: Будущее совершенного вида естественно передаёт очередное предписанное действие в последовательности обряда.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: к жертвеннику, который находится перед Яхве
  rationale: Сохраняет пространственный смысл לִפְנֵי и ясно определяет жертвенник в контексте святилища.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְכִפֶּר עָלָיו
  choice: и совершит очищение жертвенника
  rationale: В священническом ритуальном контексте כפר применительно к жертвеннику имеет выраженный смысл очищения; повтор существительного устраняет неясность местоимения в русском тексте.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: Он возьмёт крови быка и крови козла
  rationale: 'Родительный партитивный естественно передаёт повторённое מִן: берётся некоторое количество крови каждого животного.'
- source_word: הַשָּׂעִיר
  choice: козла
  rationale: Шָׂעִיר обозначает козла; мужской род животного сохраняется без добавления отсутствующего здесь уточнения о виде жертвы.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: и нанесёт её на роги жертвенника со всех сторон
  rationale: «Нанесёт» естественно описывает ритуальное применение крови, а местоимение единственного числа следует еврейской конструкции; סָבִיב передано как «со всех сторон».
theological_decisions:
- issue: Значение כפר в священническом обряде, когда объектом служит жертвенник
  choice: совершит очищение жертвенника
  alternative: совершит искупление за него
  rationale: Когда действие направлено на жертвенник, очистительный смысл культового обряда особенно заметен. При этом более традиционное «искупление» сохранено в сноске, чтобы не скрывать широту и богословскую значимость глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством ритуального предписания. «Жертвенник» и «роги жертвенника» сохраняют принятую библейскую лексику; синтаксис сделан ясным для обычного читателя.
