revisions:
- from: Затем он выйдет к жертвеннику, который находится перед Яхве, и совершит очищение жертвенника[a]. Он возьмёт крови быка и крови козла и нанесёт её на роги жертвенника со всех сторон.
  to: Затем он выйдет к жертвеннику, который перед Яхве, и совершит очищение над ним[a]. Он возьмёт немного крови быка и немного крови козла и нанесёт кровь на роги жертвенника со всех сторон.
  rationale: Правка сохраняет все элементы еврейского текста, включая повторённый партитив «из крови», но выражает его яснее как «немного крови» от каждого животного. Повтор существительного «кровь» вместо местоимения снимает русскую синтаксическую неоднозначность. Формулировка «очищение над ним» сохраняет направленность כפר על жертвенник и не исключает отражённого в сноске значения «совершить искупление за него».
