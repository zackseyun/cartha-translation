base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: ru
  text: Аарон приведёт быка для жертвы за грех, предназначенного ему самому[a], и совершит искупление за себя и за своё семейство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быка для очистительной жертвы». Еврейское слово חַטָּאת может обозначать жертву за грех, причём в некоторых контекстах подчёркивается обрядовое очищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: приведёт
  rationale: В жертвенном контексте форма от קרב означает привести или представить жертвенное животное перед Господом. «Приведёт» естественно по-русски и не изображает жертвоприношение уже завершённым.
- source_word: פַּר הַחַטָּאת
  choice: быка для жертвы за грех
  rationale: פַּר — бык, а חַטָּאת в данном обрядовом контексте обозначает жертву, а не отвлечённый грех. Оборот «жертва за грех» понятен современному читателю; возможный оттенок очищения отмечен в сноске.
- source_word: אֲשֶׁר לוֹ
  choice: предназначенного ему самому
  rationale: Фраза выделяет быка как жертву, назначенную для самого Аарона, в отличие от жертв народа. Такой перевод передаёт функцию животного яснее, чем буквальное «который у него».
- source_word: וְכִפֶּר
  choice: и совершит искупление
  rationale: כפר в священническом обрядовом контексте обозначает совершение искупительного обряда. Формулировка сохраняет богословскую ёмкость термина, не сводя его только к очищению.
- source_word: בַּעֲדוֹ
  choice: за себя
  rationale: בְּעַד с местоименным суффиксом выражает действие в пользу или от имени лица; «за себя» кратко и естественно.
- source_word: וּבְעַד בֵּיתוֹ
  choice: и за свой дом
  rationale: בַּיִת может обозначать не здание, а семью или домочадцев. «Свой дом» сохраняет образ и в данном контексте естественно понимается как семья Аарона.
theological_decisions:
- issue: Значение חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: В непосредственном контексте слово обозначает жертвенное животное или приношение. Традиционное «жертва за грех» сохраняет связь с базовым значением חטא, а обрядово-очистительный оттенок указан в сноске.
- issue: Объём значения בֵּיתוֹ
  choice: свой дом
  alternative: своё семейство / своих домочадцев
  rationale: В данном месте речь, вероятнее всего, идёт о семье и домочадцах Аарона. «Дом» сохраняет краткость и метафору оригинала, не подразумевая здесь строение.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и обрядового текста. Будущее время передаёт последовательность предписанных действий. Сохранено выражение «свой дом» как понятное обозначение семьи или домочадцев.
