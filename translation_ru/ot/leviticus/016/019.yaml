  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: ru
  text: И окропит его частью крови своим пальцем семь раз, очистит и освятит его от нечистот израильтян[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Буквально: «сынов Израиля»; то есть израильтян, народа Израиля.'
