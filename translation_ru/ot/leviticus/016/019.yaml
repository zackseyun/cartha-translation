lexical_decisions:
- source_word: וְהִזָּה עָלָיו מִן־הַדָּם
  choice: И покропит на него кровью
  rationale: Глагол נזה в породе hифиль обозначает ритуальное окропление; עָלָיו относится к жертвеннику из предыдущего стиха, а partitive מִן естественно передаётся русским творительным «кровью» без подразумевания всей крови.
- source_word: בְּאֶצְבָּעוֹ
  choice: с пальца
  rationale: В данном ритуальном действии кровь наносится посредством пальца; «с пальца» естественно по-русски и сохраняет конкретный образ действия.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямая передача точного числа повторений в обряде.
- source_word: וְטִהֲרוֹ
  choice: очистит его
  rationale: טהר — обычный священнический термин ритуального очищения. «Очистит» понятно современному читателю и не превращает обрядовое действие в нравственное обновление.
- source_word: וְקִדְּשׁוֹ
  choice: освятит его
  rationale: קדש здесь означает привести жертвенник в состояние святости, отделённости для Бога. «Освятит» точно и привычно передаёт это действие.
- source_word: מִטֻּמְאֹת
  choice: от нечистот
  rationale: Сохранено множественное число, обозначающее различные проявления ритуальной нечистоты в священническом контексте.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально передаёт устойчивое древнееврейское мужское собирательное выражение и при этом остаётся понятным в литературном русском.
theological_decisions:
- issue: Ритуальное очищение и освящение жертвенника
  choice: Жертвенник «очистит» и «освятит» от нечистот народа.
  alternative: «Сделает чистым» и «сделает святым».
  rationale: 'Формулировка сохраняет культово-обрядовый смысл: речь идёт не о нравственном обращении неодушевлённого предмета, а о восстановлении его ритуальной чистоты и святости.'
- issue: Значение מִטֻּמְאֹת
  choice: «от нечистот»
  alternative: «из-за нечистот» или «от осквернений».
  rationale: Предлог מִן допускает оттенок удаления или освобождения от нечистот. Выбранный вариант сохраняет этот образ и не уточняет сверх текста механизм связи между нечистотой народа и жертвенником.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: «сынов Израиля»
  alternative: «израильтян» или «народа Израиля».
  rationale: Сохраняется форма исходного устойчивого выражения без утверждения, будто речь ограничена только взрослыми мужчинами; идиоматические варианты указаны в примечании.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис следует последовательности древнееврейского текста, но остаётся естественным; термины «очистит», «освятит» и «нечистоты» сохраняют священнический ритуальный регистр.
