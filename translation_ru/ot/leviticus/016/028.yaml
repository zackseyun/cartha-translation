base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: ru
  text: Тот, кто сожжёт их, должен выстирать свою одежду и омыть своё тело[a] водой. После этого он может войти в стан[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свою плоть». В выражении об омовении имеется в виду всё тело.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он войдёт в стан». Еврейский глагол допускает значение простого будущего; в данном контексте он, вероятно, выражает разрешение вернуться после очищения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: Тот, кто сожжёт
  rationale: Причастие с артиклем употреблено как существительное и обозначает человека, сжигающего упомянутые ранее останки; по-русски естественно передать придаточным оборотом. Совершенный вид уместен для предписанного действия в данной последовательности.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения отсылает к тельцу и козлу либо к их останкам из предыдущего стиха.
- source_word: יְכַבֵּס
  choice: должен выстирать
  rationale: Имперфект в ритуальном законодательстве имеет предписывающую силу; «должен» ясно и естественно передаёт обязательность действия.
- source_word: בְּגָדָיו
  choice: свою одежду
  rationale: Единственное собирательное «одежду» естественно в современном русском и точно передаёт множественное בגדיו в данном контексте.
- source_word: וְרָחַץ
  choice: и омыть
  rationale: Глагол обозначает омовение тела; «омыть» сохраняет достоинство и ритуальный оттенок, отличая это действие от стирки одежды.
- source_word: אֶת־בְּשָׂרוֹ
  choice: своё тело
  rationale: Буквально «свою плоть», но в формуле омовения בשר означает тело человека; буквальный вариант мог бы звучать неестественно или вводить в заблуждение.
- source_word: בַּמָּיִם
  choice: водой
  rationale: В русском языке при глаголе «омыть» инструментальный оборот «водой» естественнее буквального «в воде» и передаёт тот же смысл.
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Выражение ясно обозначает временную последовательность после предписанного очищения.
- source_word: יָבֹא
  choice: может войти
  rationale: В контексте ритуального очищения форма указывает на разрешённое возвращение в стан после омовения; модальность не бесспорна и отмечена сноской.
- source_word: אֶל־הַמַּחֲנֶה
  choice: в стан
  rationale: Сочетание בוא с אֶל обозначает движение внутрь; «войти в стан» естественно передаёт возвращение за его пределы.
theological_decisions:
- issue: Ритуально-правовая сила заключительной фразы
  choice: «он может войти в стан» — разрешение вернуться после очищения
  alternative: «он войдёт в стан» — простое будущее или предписанное последующее действие
  rationale: Последовательность стиха связывает возвращение с обязательными омовениями. Перевод с «может» передаёт восстановление допуска в стан, но грамматически возможное более буквальное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Стан» сохраняет понятный историко-библейский колорит; синтаксис сделан прямым и доступным. Маркеры сносок поставлены непосредственно после соответствующих выражений.
