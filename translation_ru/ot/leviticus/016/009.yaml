  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: ru
  text: И приведёт Аарон козла, на которого пал жребий для Яхве[a], и принесёт его как жертву за грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «козла, для которого жребий для Яхве вышел».'
    reason: 'Лексическая альтернатива: сохраняет образ глагола עלה («вышел», буквально также «поднялся») в описании жребия.'
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: и приведёт
  rationale: В жертвенном контексте форма הקריב означает привести или представить животное для обряда; «приведёт» естественно по-русски и не опережает последующее указание о жертвоприношении.
- source_word: הַשָּׂעִיר
  choice: козла
  rationale: שׂעיר обозначает козла, то есть самца; русское «козла» точно передаёт это значение без дополнительного определения.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: на которого выпал жребий
  rationale: Это естественная русская передача еврейского оборота о результате жеребьёвки; она сохраняет образ жребия, выпавшего на животное.
- source_word: לַיהוָה
  choice: «для Яхве»
  rationale: Предлог ל обозначает предназначение, а тетраграмматон передан личным именем «Яхве»; кавычки показывают формулировку, нанесённую на жребий, в соответствии с контекстом стиха 8.
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: и принесёт его в жертву за грех
  rationale: В жертвенном законодательстве חטאת обозначает жертву за грех, а עשה в данном сочетании — совершение предписанного жертвоприношения. Такая формулировка ясна и естественна по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и соответствует указанному принципу проекта.
- issue: Значение חַטָּאת
  choice: жертва за грех
  alternative: грех; очистительная жертва
  rationale: В данном ритуальном контексте слово обозначает вид жертвы. «Жертва за грех» сохраняет традиционную смысловую связь с грехом, не устраняя возможного очистительного аспекта обряда.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Будущее совершенного вида передаёт предписывающее значение еврейского ве-каталя в последовательности ритуальных действий.
