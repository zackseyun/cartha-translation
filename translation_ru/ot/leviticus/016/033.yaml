id: LEV.16.33
reference: Leviticus 16:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: ru
  text: Так он совершит искупление за Святое святилище[a], за Шатёр встречи и за жертвенник; совершит искупление за священников и за весь народ общины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершит очищение». В данном обрядовом контексте древнееврейский глагол כפר может обозначать также устранение осквернения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весь народ собрания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: совершит искупление
  rationale: Повтор одного и того же культового выражения сохраняет единство обряда применительно как к священным местам и жертвеннику, так и к людям. «Искупление» передаёт богословскую силу כפר, а примечание указывает на присущий контексту оттенок очищения от осквернения.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: Святое святилище
  rationale: Передаёт сочетание «святилище» и «святость/святое», не сужая его без достаточного основания до «Святого святых».
- source_word: אֹהֶל מוֹעֵד
  choice: Шатёр встречи
  rationale: Естественно и наглядно передаёт традиционное название переносного святилища и сохраняет образ шатра.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычный и точный русский культовый термин.
- source_word: עַל
  choice: за
  rationale: В сочетании с כפר естественно выражает, в чью пользу или в отношении кого совершается искупление.
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Стандартное соответствие множественному числу древнееврейского существительного.
- source_word: כָּל עַם הַקָּהָל
  choice: весь народ общины
  rationale: 'Сохраняет оба элемента выражения: народ и собранную общину, не сводя фразу просто к «всему народу».'
theological_decisions:
- issue: Язык искупления применяется и к священным предметам, и к людям
  choice: Во всех частях стиха сохранено выражение «совершит искупление».
  alternative: Для священных мест употребить «очистит», а для людей — «совершит искупление».
  rationale: Древнееврейский текст намеренно повторяет כפר. Единое русское выражение сохраняет ритуальное единство и не навязывает тексту разделение между очищением предметов и искуплением людей; очищающий оттенок пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Повтор «совершит искупление» отражает повтор в оригинале. Маркер [b] поставлен при выражении «народ общины», к которому относится соответствующее примечание.
