  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: ru
  text: И возложит Аарон обе руки на голову живого козла и исповедует над ним все беззакония сынов Израиля[a], все их преступления, все их грехи; возложит их на голову козла и отошлёт его в пустыню через человека, назначенного для этого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; «народа Израиля». Буквально по-еврейски: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «через человека, готового для этого»; «через человека, определённого для этого». Значение еврейского обозначения этого человека не вполне ясно: оно может подчёркивать его готовность, назначение или пригодность для данного случая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: возложит
  rationale: В жертвенном контексте глагол обозначает обрядовое возложение рук на животное; «возложит» естественно для торжественного повествования и не уточняет степень нажима.
- source_word: שְׁתֵּי יָדוֹ
  choice: обе руки
  rationale: Естественно передаёт еврейское выражение «две его руки» и подчёркивает, что в обряде участвуют обе руки.
- source_word: הַשָּׂעִיר הַחַי
  choice: живого козла
  rationale: Речь идёт о козле, оставленном в живых; перевод краток и однозначен в данном контексте.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: исповедует над ним
  rationale: Сохраняет значение глагола «исповедовать» и пространственно-обрядовый смысл предлога עַל; местоимение мужского рода естественно согласуется с русским словом «козёл».
- source_word: עֲוֺנֹת
  choice: беззакония
  rationale: Передаёт нравственную и культовую тяжесть עָוֹן и сохраняет отличие от двух следующих обозначений греха.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально сохраняет родственное выражение оригинала, которое собирательно обозначает народ Израиля.
- source_word: פִּשְׁעֵיהֶם
  choice: их преступления
  rationale: Передаёт нарушение и мятежный характер פֶּשַׁע, оставаясь понятным современному читателю.
- source_word: לְכָל חַטֹּאתָם
  choice: все их грехи
  rationale: В данном перечислении выражение имеет суммирующую силу; перевод сохраняет трёхчастный ряд без неестественного буквального воспроизведения предлога לְ.
- source_word: וְנָתַן אֹתָם
  choice: возложит их
  rationale: Конкретно передаёт символическое помещение исповеданных беззаконий, преступлений и грехов на голову козла.
- source_word: וְשִׁלַּח
  choice: отошлёт его
  rationale: Сохраняет мотив удаления козла, выраженный глаголом «послать прочь», не ослабляя его до простого освобождения.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: с назначенным для этого человеком
  rationale: Естественно передаёт посредничество человека и наиболее вероятный контекстуальный смысл трудного עִתִּי — человека подготовленного или назначенного для данного случая.
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительное окончание выражает движение к пустыне; русский винительный падеж с «в» естественно передаёт это направление.
theological_decisions:
- issue: Различение трёх обозначений греха
  choice: беззакония / преступления / грехи
  alternative: вина / мятежи / грехи
  rationale: Оригинал намеренно соединяет три близких, но не тождественных слова, подчёркивая полноту вины Израиля. Разные русские соответствия сохраняют эту риторическую и богословскую полноту.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Родственное и грамматически мужское выражение оригинала сохранено, при этом сноска поясняет его собирательное значение и не ограничивает его только взрослыми мужчинами.
- issue: Символическое возложение грехов на козла
  choice: возложит их на голову козла
  alternative: положит их на голову козла
  rationale: Перевод сохраняет конкретный образ перенесения исповеданных грехов, не добавляя объяснения о механизме или богословском значении обряда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, уместным для обрядового предписания звучанием. Синтаксис следует последовательности еврейского текста, но точка с запятой облегчает длинное перечисление. Термины греха разведены без архаизации; трудное עִתִּי не истолковано чрезмерно узко.
