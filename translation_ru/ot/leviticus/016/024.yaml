id: LEV.16.24
reference: Leviticus 16:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: ru
  text: Пусть он омоет своё тело[a] водой в святом месте[b], наденет свои одежды, выйдет и принесёт своё всесожжение и всесожжение народа, и совершит искупление[c] за себя и за народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свою плоть».'
    reason: lexical_alternative
  - marker: b
    text: То есть в месте, являющемся святым; еврейский текст не обязательно подразумевает Святое — внутреннее помещение святилища.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «совершит очищение»; возможен также перевод «совершит умилостивление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: Пусть он омоет
  rationale: Перфект с союзом в последовательности предписаний передан как повелительно-нормативное действие; «омоет» сохраняет ритуальный и достойный регистр.
- source_word: בְּשָׂרוֹ
  choice: своё тело
  rationale: Буквально «свою плоть», однако в контексте омовения современное русское «тело» ясно передаёт физический смысл без посторонних богословских ассоциаций.
- source_word: בַּמַּיִם
  choice: водой
  rationale: Творительный падеж естественно передаёт средство омовения в современном русском языке.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: в святом месте
  rationale: Неопределённая формулировка отражает отсутствие артикля при מָקוֹם и не отождествляет это место автоматически со Святым отделением святилища.
- source_word: וְלָבַשׁ אֶת בְּגָדָיו
  choice: наденет свои одежды
  rationale: Формулировка сохраняет ритуально-официальный оттенок и остаётся понятной современному читателю.
- source_word: וְיָצָא
  choice: выйдет
  rationale: Прямо передаёт движение наружу после омовения и облачения.
- source_word: וְעָשָׂה
  choice: принесёт
  rationale: При жертвоприношении глагол עשה идиоматично передаётся русским «принести», а не буквальным «сделать».
- source_word: עֹלָתוֹ
  choice: своё всесожжение
  rationale: «Всесожжение» — устоявшееся и точное русское обозначение жертвы עֹלָה.
- source_word: עֹלַת הָעָם
  choice: всесожжение народа
  rationale: Сохраняется параллелизм с личным всесожжением священника и формальный стиль стиха.
- source_word: וְכִפֶּר
  choice: совершит искупление
  rationale: Устоявшаяся формулировка сохраняет широкий ритуально-богословский смысл כפר, не сводя его к одной теории искупления.
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: за себя и за народ
  rationale: Кратко и естественно передаёт действие от имени и ради священника и народа.
theological_decisions:
- issue: Значение כפר в священническом жертвенном контексте
  choice: совершит искупление
  alternative: совершит очищение; совершит умилостивление
  rationale: Основной текст сохраняет традиционно широкое значение термина, а примечание указывает возможные ритуальные оттенки, не разрешая спор односторонне.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной ритуальной лексикой. Синтаксическая последовательность еврейского предписания сохранена, но оформлена естественно для русского читателя.
