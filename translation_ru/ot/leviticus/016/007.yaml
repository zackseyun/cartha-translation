source:
  edition: WLC
  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: ru
  text: И пусть он возьмёт двух козлов и поставит их перед Яхве у входа в шатёр встречи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: И пусть он возьмёт
  rationale: В последовательности обрядовых предписаний форма передаёт очередное повеление; конструкция «пусть он возьмёт» естественна для современного русского языка.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: двух козлов
  rationale: שָׂעִיר здесь обозначает козла; мужской род животного существенен и естественно выражается русским словом «козёл».
- source_word: וְהֶעֱמִיד אֹתָם
  choice: и поставит их
  rationale: Каузативная форма глагола עמד буквально означает «поставить, заставить стоять»; перевод сохраняет конкретное пространственное действие, не сводя его лишь к представлению для обряда.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי выражает нахождение перед кем-либо, в его присутствии; личное имя יהוה передано как «Яхве».
- source_word: פֶּתַח
  choice: у входа в
  rationale: Русская конструкция «у входа в» идиоматично и точно обозначает местоположение возле входа.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: 'Перевод сохраняет оба элемента еврейского наименования: אֹהֶל — «шатёр», מוֹעֵד — назначенная встреча/собрание; «шатёр встречи» звучит понятно и не привносит позднейшую архитектурную терминологию.'
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение אֹהֶל מוֹעֵד
  choice: шатёр встречи
  alternative: скиния собрания; шатёр собрания
  rationale: Сочетание допускает оттенки назначенной встречи и собрания. «Шатёр встречи» передаёт место встречи с Богом, не устраняя полностью присущую מוֹעֵד смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством обрядового предписания. Синтаксис последовательный и ясный; устаревшие «да возьмёт» и терминологически нагруженное «скиния» не использованы.
