  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: ru
  text: Яхве сказал Моисею после смерти двух сыновей Аарона, когда они приблизились к Яхве и умерли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при их приближении перед Яхве». Возможный более формальный перевод: «когда они приблизились перед Яхве и умерли».'
    reason: Сохраняет формальную передачу בְּקָרְבָתָם לִפְנֵי יְהוָה («при их приближении перед Яхве»), тогда как основной текст использует естественную русскую конструкцию.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: В повествовательной формуле глагол דבר естественно передаётся как «говорил»; такая форма сохраняет обычное введение речи Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом «Господь».
- source_word: אַחֲרֵי מוֹת
  choice: после смерти
  rationale: Сочетание означает «после смерти»; единственное число естественно обозначает общее событие смерти обоих сыновей.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: двух сыновей Аарона
  rationale: Передача сохраняет числительное, родственную связь и естественный русский порядок слов.
- source_word: בְּקָרְבָתָם
  choice: приблизившись
  rationale: 'Предлог ב с инфинитивом קרב и суффиксом 3-го лица множественного числа имеет здесь временно-обстоятельственное значение: «при их приближении», «когда они приблизились».'
- source_word: לִפְנֵי יְהוָה
  choice: к Яхве
  rationale: В сочетании с קרב выражение естественно передаёт направленное приближение к присутствию Яхве; более формальная пространственная конструкция приведена в примечании.
- source_word: וַיָּמֻתוּ
  choice: умерли
  rationale: Глагол прямо сообщает итог события. В русском предложении он поставлен перед деепричастным оборотом, чтобы ясно отнести смерть к обоим сыновьям и избежать тяжёлого буквального порядка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Связь приближения и смерти сыновей Аарона
  choice: «которые умерли, приблизившись к Яхве»
  alternative: «когда они приблизились к Яхве и умерли»
  rationale: Еврейский текст тесно связывает смерть с их приближением, но не выражает отдельным причинным союзом, что они умерли именно «потому что» приблизились. Деепричастный оборот сохраняет эту связь, не усиливая её до явно причинной.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Перестройка последней части устраняет неестественный повтор «и умерли» после уже названной смерти, сохраняя содержание и напряжённую краткость оригинала.
