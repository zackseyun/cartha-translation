  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: ru
  text: Ибо в этот день за вас совершится искупление, чтобы очистить вас[a]; от всех ваших грехов пред Яхве[b] вы будете чисты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он совершит за вас искупление, чтобы очистить вас». Еврейский глагол стоит в единственном числе, однако субъект в этой части стиха прямо не назван.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское יהוה (YHWH), традиционно передаваемое как «ГОСПОДЬ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего установления; «ибо» передаёт пояснительно-причинную связь и сохраняет достоинство стиля.
- source_word: בַיּוֹם הַזֶּה
  choice: в этот день
  rationale: Прямо передаёт временное выражение с указательным местоимением в контексте ежегодного обряда.
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: за вас будет совершено искупление
  rationale: Глагол כפר в породе пиэль является культовым обозначением совершения искупления. Пассивная русская конструкция не называет субъекта, который в еврейской клаузе прямо не выражен, а על передаётся естественным сочетанием «за вас».
- source_word: לְטַהֵר אֶתְכֶם
  choice: чтобы очистить вас
  rationale: Инфинитив выражает цель или результат искупления; «очистить» понятно современному читателю и сохраняет ритуальный смысл.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: от всех ваших грехов
  rationale: В данном контексте חטאות обозначает грехи народа, от которых он очищается, а не жертвы за грех.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי означает нахождение перед кем-либо или в его присутствии; «пред» кратко и уместно в торжественном библейском регистре, а имя יהוה передано как «Яхве».
- source_word: תִּטְהָרוּ
  choice: вы станете чисты
  rationale: Форма qal описывает итоговое состояние чистоты и тем самым сохраняет различие с предшествующим пиэлем «очистить вас».
theological_decisions:
- issue: Неуказанный субъект глагола יְכַפֵּר
  choice: Безличная пассивная конструкция «будет совершено искупление»
  alternative: «он совершит за вас искупление»
  rationale: Еврейский глагол стоит в единственном числе мужского рода, но субъект в этой клаузе не назван. Основной текст не отождествляет его безоговорочно, а сноска сохраняет грамматическую альтернативу.
- issue: Передача культового термина כפר
  choice: искупление
  alternative: очищение; умилостивление
  rationale: «Искупление» сохраняет широкий культовый смысл текста и не навязывает более узкую теорию; очищение отдельно выражено следующим глаголом.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Транслитерация «Яхве» передаёт собственное имя Завета, не заменяя его титулом; традиционная замена указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены культовая терминология, различие между действием очищения и итоговым состоянием чистоты, а также неопределённость субъекта יְכַפֵּר.
