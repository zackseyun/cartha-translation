source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: ru
  text: 'Затем он заколет козла[a], предназначенного для жертвы за грех народа, внесёт его кровь за завесу и сделает с его кровью то же, что сделал с кровью быка: покропит ею крышку ковчега[b] и перед крышкой ковчега.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «козла в очистительную жертву за народ».'
    reason: Термин חַטָּאת может обозначать жертву за грех с выраженным очистительным назначением.
  - marker: b
    text: 'Евр. «крышка очищения» (כַּפֹּרֶת), золотая крышка ковчега; традиционные переводы: «очистилище» или «престол милости».'
    reason: Поясняет предметное значение כַּפֹּרֶת, сохраняет его связь с очищением и отмечает известные традиционные варианты.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Затем он заколет
  rationale: Глагол обозначает ритуальное заклание; форма русского совершенного будущего естественно передаёт последовательность предписанных действий.
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: козла в жертву за грех народа
  rationale: Передаёт козла как жертвенное животное, предназначенное для жертвы за грех народа, и естественно звучит по-русски.
- source_word: אֶל מִבֵּית לַפָּרֹכֶת
  choice: за завесу
  rationale: Фраза указывает на пространство по внутреннюю сторону завесы; «за завесу» ясно и идиоматично передаёт направление движения.
- source_word: וְעָשָׂה אֶת דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: сделает с его кровью то же, что сделал с кровью быка
  rationale: Сохраняет эллиптичность еврейской формулы, одновременно ясно указывая на повторение предыдущего обряда.
- source_word: וְהִזָּה אֹתוֹ
  choice: покропит ею
  rationale: «Кропить» — понятный и устойчивый русский термин для ритуального разбрызгивания крови; местоимение явно относится к крови.
- source_word: הַכַּפֹּרֶת
  choice: крышка очищения
  rationale: Термин обозначает золотую крышку ковчега и связан с корнем כפר; «крышка очищения» сохраняет предметный и обрядовый смысл, не внося позднейшего образа сиденья.
theological_decisions:
- issue: Передача כַּפֹּרֶת
  choice: крышка очищения
  alternative: престол милости; очистилище; крышка ковчега
  rationale: Основной текст одновременно обозначает сам предмет и его обрядовую связь с очищением/искуплением. Традиционные варианты важны, но «престол милости» буквально не описывает предмет, а «очистилище» малопонятно современному читателю.
- issue: Значение חַטָּאת в названии жертвы
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное и понятное обозначение сохранено в основном тексте; примечание отмечает возможный акцент на обрядовом очищении, не устраняя смысловой напряжённости термина.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохраняет последовательность обрядовых действий, но избегает архаизмов; терминология остаётся понятной неспециалисту.
