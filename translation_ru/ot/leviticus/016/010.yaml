  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: ru
  text: Но козёл, на которого выпал жребий для Азазеля[a], будет поставлен живым перед Яхве, чтобы совершить над ним искупление[b] и отослать его в пустыню к Азазелю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение еврейского слова «Азазель» спорно. В традиционных переводах: «для козла отпущения»; это слово может быть именем или обозначением, связанным с удалением.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «чтобы совершить для него искупление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: Но козла
  rationale: Союз передаёт противопоставление другому козлу из ближайшего контекста; винительный падеж естественно обусловлен последующим сказуемым «поставят».
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: на которого выпал жребий
  rationale: Естественная русская передача еврейской идиомы выбора посредством жребия.
- source_word: לַעֲזָאזֵל
  choice: для Азазеля
  rationale: Транслитерация сохраняет спорность значения עֲזָאזֵל и не подменяет его толкованием «козёл отпущения» или «удаление».
- source_word: יָעֳמַד חַי
  choice: поставят живым
  rationale: 'Хофал передаёт каузативно-пассивное действие: козла поставят или заставят стоять; «живым» подчёркивает его сохранение в живых.'
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» уместно в возвышенном культовом контексте, а «Яхве» прямо передаёт личное имя יהוה.
- source_word: לְכַפֵּר עָלָיו
  choice: совершить над ним искупление
  rationale: «Над ним» сохраняет пространственно-ритуальную силу עַל и не решает однозначно, совершается ли искупление ради козла или посредством обряда над ним.
- source_word: לְשַׁלַּח אֹתוֹ
  choice: отослать его
  rationale: Передаёт целевое значение инфинитива и мотив удаления козла.
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительный суффикс выражает движение в сторону пустыни.
theological_decisions:
- issue: Значение עֲזָאזֵל
  choice: Азазель (транслитерация)
  alternative: козёл отпущения; полное удаление
  rationale: 'Значение термина остаётся спорным: это может быть имя, обозначение места или слово, связанное с удалением. Транслитерация не снимает заложенную в тексте неоднозначность.'
- issue: Сила выражения לְכַפֵּר עָלָיו
  choice: совершить над ним искупление
  alternative: совершить для него искупление; очистить его
  rationale: Предлог עַל допускает разные способы понимания отношения козла к обряду; буквальное «над ним» сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным культовым регистром. Синтаксис остаётся ясным для широкого читателя; спорные термины и отношения намеренно не истолкованы однозначно.
