  text: וְ/אֵ֛ת חֵ֥לֶב הַֽ/חַטָּ֖את יַקְטִ֥יר הַ/מִּזְבֵּֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: ru
  text: А жир жертвы за грех он сожжёт на жертвеннике.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительной жертвы». Еврейское слово может обозначать жертву, приносимую для очищения от греха или нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: А
  rationale: Союз וְ связывает это действие с предшествующей последовательностью обряда; показатель прямого дополнения אֵת отдельно не переводится. Русское «А» естественно продолжает предписание, выделяя следующий объект действия.
- source_word: חֵלֶב
  choice: жир
  rationale: חֵלֶב обозначает предназначенный для жертвенного сожжения жир. Прямое «жир» точно передаёт форму исходного текста, не добавляя отсутствующего здесь уточнения «жирные части».
- source_word: הַחַטָּאת
  choice: жертвы за грех
  rationale: В жертвенном контексте חַטָּאת обозначает жертву, связанную с грехом и очищением. «Жертва за грех» — ясное и привычное русское соответствие; функциональная альтернатива сохранена в сноске.
- source_word: יַקְטִיר
  choice: сожжёт
  rationale: В породе хифиль глагол קטר в жертвенном контексте означает сжигать на жертвеннике, обращая приношение в дым. «Сожжёт» естественно по-русски и точно передаёт ритуальное действие в данном контексте.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс формально может выражать движение к жертвеннику, однако при глаголе жертвенного сожжения русское «на жертвеннике» идиоматично передаёт место действия.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может обозначать жертву, относящуюся как к греху, так и к ритуальному очищению от нечистоты. Основной перевод сохраняет широко понятную связь с грехом, а значимая функциональная трактовка приведена в сноске без устранения смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык; краткая законодательная формулировка сохраняет достоинство и последовательность ритуального предписания. Будущее совершенного вида передаёт предписываемое действие без утяжеляющего оборота «пусть сожжёт».
