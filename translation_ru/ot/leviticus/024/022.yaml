  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: ru
  text: 'Для вас должен быть один и тот же правовой порядок: как для переселенца, так и для коренного жителя, ибо Я — ГОСПОДЬ, ваш Бог.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: один закон суда
  rationale: Сочетание выражает единый правовой порядок или меру судебного решения. «Один закон суда» сохраняет юридический смысл מִשְׁפָּט и подчёркивает отсутствие двойного стандарта.
- source_word: גֵּר
  choice: переселенец
  rationale: В данном правовом контексте это живущий среди Израиля некоренной житель; «переселенец» понятно современному читателю и не привносит позднейшего этнического смысла слова «прозелит».
- source_word: אֶזְרָח
  choice: коренной житель
  rationale: Обозначает уроженца страны, противопоставленного переселенцу.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт традиционную русскую замену божественного имени и типографически отмечает, что в еврейском тексте стоит тетраграмматон.
theological_decisions:
- issue: Равенство переселенца и коренного жителя перед законом
  choice: как для переселенца, так и для коренного жителя
  alternative: переселенец да будет как коренной житель
  rationale: Синтаксис כַּגֵּר כָּאֶזְרָח указывает на одинаковое применение названного судебного порядка к обеим группам; выбранная формулировка ясно сохраняет это равенство.
translation_notes:
  register: Современный литературный русский язык с dignified юридическим оттенком. Сохранены категоричность повеления, параллелизм двух групп и формула божественного самообозначения.
