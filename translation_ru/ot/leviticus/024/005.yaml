  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: ru
  text: Возьми тонкую муку и испеки из неё двенадцать хлебов[a]; каждый хлеб должен быть из двух десятых эфы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двенадцать лепёшек». Еврейское слово обозначает отдельные выпеченные хлебные изделия, в том числе употреблявшиеся в обрядах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «две десятых». Здесь имеются в виду две десятых эфы на каждый хлеб.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Возьми
  rationale: В последовательности предписаний форма с союзом передаёт прямое повеление; естественный русский императив сохраняет процедурный характер текста.
- source_word: סֹלֶת
  choice: лучшую муку
  rationale: Культовый термин обозначает муку высокого качества, тонко смолотую или очищенную; «лучшая мука» понятно современному читателю и не уточняет вид зерна, не названный в еврейском тексте.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: и испеки из неё
  rationale: Местоименное дополнение женского рода отсылает к муке; по-русски естественно обозначить материал хлебов конструкцией «из неё».
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: двенадцать хлебов
  rationale: חַלּוֹת обозначает отдельные выпеченные хлебные изделия, особенно в обрядовом контексте. «Хлебы» здесь яснее и уместнее, чем «лепёшки», не определяя форму изделий.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: по две десятых эфы
  rationale: Буквально сказано «две десятых»; в священнической системе мер подразумеваются десятые доли эфы. Предлог «по» естественно передаёт распределение меры на каждый хлеб.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: на каждый хлеб должно пойти
  rationale: Буквальное «один хлеб будет» имеет распределительный смысл. Русская формулировка ясно показывает, что указанное количество муки относится к каждому из двенадцати хлебов.
