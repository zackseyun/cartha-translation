base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: ru
  text: Сын израильтянки произнёс Имя и проклял[a], и его привели к Моисею. Его мать звали Шеломит; она была дочерью Диври из колена Дана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «похулил Имя». Еврейский глагол может означать «точно назвать» или «отчётливо произнести»; в этом контексте его также можно понимать как часть выражения, обозначающего хулу.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: произнёс
  rationale: Глагол נקב может означать «точно обозначить, назвать, произнести». В сочетании с «Именем» и последующим отдельным глаголом «проклял» перевод сохраняет последовательность двух действий и не сливает их заранее в одно понятие богохульства.
- source_word: אֶת הַשֵּׁם
  choice: Имя
  rationale: Определённая форма «Имя» в данном контексте служит благоговейным обозначением Божьего имени. Заглавная буква передаёт эту отсылку, не подставляя в текст тетраграмматон.
- source_word: וַיְקַלֵּל
  choice: и проклял
  rationale: Пиэль глагола קלל обычно означает «проклинать». Прямой перевод сохраняет отличие этого глагола от предшествующего נקב.
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: сын израильтянки
  rationale: Естественная и точная русская передача конструкции, сохраняющая установленное контекстом обозначение человека через его мать.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: и его привели к Моисею
  rationale: Русская неопределённо-личная конструкция естественно передаёт еврейское множественное число с неуказанным субъектом.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: Шеломиф, дочь Диври
  rationale: Имена переданы транслитерацией; приложение «дочь Диври» ясно выражает родство.
- source_word: לְמַטֵּה דָן
  choice: из колена Дана
  rationale: Устойчивый и понятный русский эквивалент формулы племенной принадлежности.
theological_decisions:
- issue: Значение נקב при слове «Имя» в контексте богохульства
  choice: 'Передать как отдельное действие: «произнёс Имя», после чего — «и проклял».'
  alternative: «Хулил Имя и проклинал» или «похулил Имя».
  rationale: В еврейском тексте стоят два глагола, נקב и קלל. Раздельная передача сохраняет лексическую неоднозначность первого глагола и богословски значимое напряжение текста, не сводя оба действия к одному.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Имя» написано с заглавной буквы как контекстуальное обозначение Божьего имени; синтаксис сделан естественным для русского без устранения неоднозначности исходного текста.
