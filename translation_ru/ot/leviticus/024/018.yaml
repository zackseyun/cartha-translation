translation:
  language: ru
  text: 'Кто убьёт животное, тот должен возместить за него: жизнь за жизнь[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «жизнь за жизнь». В контексте возмещения за животное формула указывает на равноценность возмещения; его точная форма не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה
  choice: Кто убьёт
  rationale: Причастие породы хифиль от נכה формулирует общий правовой случай. При объекте נֶפֶשׁ בְּהֵמָה речь идёт о смертельном поражении, поэтому «убьёт» естественно и точно передаёт смысл по-русски.
- source_word: נֶפֶשׁ בְּהֵמָה
  choice: животное
  rationale: Буквально сочетание указывает на жизнь животного, однако в данном контексте означает само животное как лишённое жизни. Перевод «животное» избегает неестественного выражения «убьёт жизнь животного» и не придаёт נֶפֶשׁ значения бесплотной души.
- source_word: יְשַׁלְּמֶנָּה
  choice: должен возместить причинённый ущерб
  rationale: Пиэль от שלם означает выплатить возмещение или восполнить потерю. В русском языке дополнение «причинённый ущерб» естественно выражает требование компенсации, не уточняя её форму сверх сказанного в тексте.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: жизнь за жизнь
  rationale: Сохранена краткая юридическая формула оригинала. Предлог תַּחַת здесь выражает замену или равноценное возмещение.
theological_decisions:
- issue: Смысл формулы воздаяния применительно к убитому животному
  choice: Формула «жизнь за жизнь» сохранена как требование равноценного возмещения.
  alternative: Можно понимать её более конкретно как обязанность отдать другое животное взамен убитого либо как материальную выплату.
  rationale: Глагол שלם прямо требует возмещения, но стих не устанавливает точный способ его предоставления. Перевод не сужает смысл до денежной выплаты или обязательной замены другим животным.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Повтор «тот» при конструкции «кто…, тот…» поддерживает естественный русский синтаксис; заключительная формула сохраняет лаконичность и торжественность оригинала.
