base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: ru
  text: Каждую субботу он должен раскладывать их пред Яхве постоянно[a] — от сынов Израиля; это вечный завет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в день субботы, в день субботы»; то есть каждую субботу, из субботы в субботу. «Постоянно» здесь означает неизменно и регулярно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вечный завет». Заключительная формула характеризует это установление как пребывающее в силе; в еврейском тексте её точная синтаксическая связь с предшествующими словами сжата.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: Каждую субботу
  rationale: 'Дословное повторение «в день субботы, в день субботы» имеет распределительное значение: из субботы в субботу.'
- source_word: יַעַרְכֶנּוּ
  choice: он должен раскладывать их
  rationale: Глагол ערך означает упорядоченно раскладывать или располагать; местоименный суффикс единственного числа относится к хлебному приношению как к совокупности, но по-русски естественно согласовать местоимение с подразумеваемыми хлебами.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Культовое выражение обозначает размещение в присутствии Яхве; «пред» сохраняет достоинство и краткость исходной формулы.
- source_word: תָּמִיד
  choice: постоянно
  rationale: В священническом контексте слово указывает на неизменно продолжающееся регулярное установление, а не обязательно на непрерывное действие.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: от сынов Израиля
  rationale: מֵאֵת выражает источник, а בְּנֵי יִשְׂרָאֵל буквально означает «сыны Израиля» и здесь имеет собирательный смысл.
- source_word: בְּרִית עוֹלָם
  choice: как вечный завет
  rationale: Прямая передача заветной формулы сохраняет ее богословскую напряженность и не добавляет отсутствующее в тексте слово «обязательство».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное заветное имя; транслитерация «Яхве» прямо сохраняет это различие.
- issue: Референт единственного суффикса в יַעַרְכֶנּוּ
  choice: их
  alternative: его; это
  rationale: Единственное число в еврейском может собирательно обозначать хлебную выкладку; русское «их» естественно отсылает к хлебам из ближайшего контекста, не меняя смысла обряда.
- issue: Связь выражения בְּרִית עוֹלָם
  choice: от сынов Израиля, как вечный завет
  alternative: как вечный завет от сынов Израиля; в вечный завет для сынов Израиля
  rationale: Синтаксис допускает некоторую неопределенность в отношении того, как именно заветная формула связана с приношением и Израилем; основной текст сохраняет порядок и формулировку максимально близко к еврейскому.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Пред Яхве» сохраняет краткую культовую формулу; архаичные формы вне этой устойчивой конструкции не используются.
