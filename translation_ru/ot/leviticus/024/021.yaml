- from: Кто убьёт животное, тот должен возместить за него; а кто убьёт человека, тот должен быть предан смерти.
  to: Кто убьёт животное, тот возместит ущерб за него; а кто убьёт человека, тот будет предан смерти.
  rationale: 'Исправлены только русские способы выражения правовой формулы: будущее время заменяет интерпретирующее «должен», а «возместит ущерб за него» естественно передаёт глагол שלם с суффиксом, относящимся к животному. Смысл, симметрия противопоставления и юридический пассив сохранены.'
