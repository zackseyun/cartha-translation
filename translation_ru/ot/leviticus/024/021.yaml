  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: ru
  text: Кто убьёт животное, тот возместит ущерб за него; а кто убьёт человека, тот будет предан смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: кто убьёт
  rationale: Причастие породы хифиль от נכה буквально указывает на того, кто наносит удар; последствия в обеих частях стиха показывают, что здесь речь идёт о смертельном ударе. Русское «убьёт» ясно и естественно передаёт этот смысл.
- source_word: בְהֵמָה
  choice: животное
  rationale: Широкое обозначение животного, нередко домашнего. «Животное» точно и современно; «скот» мог бы неоправданно сузить значение.
- source_word: יְשַׁלְּמֶנָּה
  choice: должен возместить за него
  rationale: Пиэль глагола שלם в данном правовом контексте означает компенсировать ущерб. Суффикс женского рода относится к בְהֵמָה; в русском согласование передано местоимением среднего рода по слову «животное».
- source_word: אָדָם
  choice: человека
  rationale: В противопоставлении животному слово обозначает отдельного человека независимо от пола. Русское «человека» сохраняет родовое значение и естественно звучит в правовой формулировке.
- source_word: יוּמָת
  choice: должен быть предан смерти
  rationale: 'Хофаль передаёт каузативно-пассивное значение: виновного должны умертвить. Формулировка сохраняет юридический пассив и торжественный библейский регистр.'
theological_decisions:
- issue: Передача אָדָם в правовом контексте
  choice: человека
  alternative: мужчину
  rationale: Хотя еврейская форма грамматически мужского рода, אָדָם здесь противопоставлено животному и обозначает человеческое лицо вообще. Перевод «мужчину» неоправданно ограничил бы действие закона лицами мужского пола.
- issue: Характер наказания в יוּמָת
  choice: должен быть предан смерти
  alternative: умрёт
  rationale: Пассивная форма указывает не просто на последующую смерть, а на назначенное законом умерщвление виновного; перевод не уточняет способ исполнения приговора.
translation_notes:
  register: Современный литературный русский язык с краткой, симметричной правовой конструкцией. Сохранены противопоставление животного и человека и пассивная формулировка смертного наказания; архаизмы и чрезмерно техническая юридическая лексика исключены.
