source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: ru
  text: И если мужчина насмерть поразит[b] какого-либо человека[a], он непременно должен быть предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякую человеческую душу (жизнь)». Здесь имеется в виду человек как живое существо, а не нематериальная «душа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убьёт». Древнееврейский глагол буквально означает «ударит, поразит», но здесь речь идёт о смертельном ударе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: И если мужчина
  rationale: וְ связывает предписание с контекстом; כִּי вводит условие, а אִישׁ — существительное мужского рода «мужчина». Мужская форма сохранена, хотя закон имеет общее применение.
- source_word: יַכֶּה
  choice: насмерть поразит
  rationale: Глагол נכה буквально означает «ударить, поразить», но объект и формула смертной казни показывают, что здесь речь о смертельном ударе. Перевод сохраняет образ удара и ясно передаёт его исход.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: какого-либо человека
  rationale: В данном сочетании נֶפֶשׁ обозначает человеческое существо, человека как живую личность, а не нематериальную «душу»; אָדָם имеет родовое значение.
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Инфинитив абсолютный с пассивной глагольной формой усиливает категоричность приговора. Пассивная конструкция сохраняет форму древнееврейской юридической формулы.
theological_decisions:
- issue: Значение נֶפֶשׁ אָדָם
  choice: человека
  alternative: человеческую жизнь; душу человека
  rationale: Фраза обозначает убитого человека, а не отвлечённое понятие жизни и не отдельно мыслимую нематериальную душу.
- issue: Мужская форма אִישׁ
  choice: мужчина
  alternative: кто; человек
  rationale: Исходный текст употребляет конкретную форму мужского рода. Она сохранена без утверждения, будто жертвой может быть только мужчина.
- issue: Сила формулы מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  alternative: да будет предан смерти; должен умереть
  rationale: Выбранная формулировка передаёт как усиление, так и пассивный характер юридического приговора, не уточняя способ исполнения.
translation_notes:
  register: Современный литературный русский язык с достоинством юридического предписания. «Насмерть поразит» сохраняет конкретность древнееврейского глагола и одновременно устраняет ложное впечатление, будто смертная казнь назначается за любой удар. Формула «непременно должен быть предан смерти» передаёт усиление и пассив исходного текста.
