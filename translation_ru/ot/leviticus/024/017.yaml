  source_fidelity: 'Текст точно передаёт условную юридическую конструкцию: וְ/כִּי — «И если», אִישׁ сохранено как «мужчина», יַכֶּה передано конкретным «поразит» с контекстуально необходимым уточнением «насмерть», а כָּל־נֶפֶשׁ אָדָם — как «какого-либо человека». Формула מוֹת יוּמָת удачно воспроизведена усиленной пассивной юридической конструкцией «непременно должен быть предан смерти».'
