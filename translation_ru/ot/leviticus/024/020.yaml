  rationale: Эта русская соотносительная конструкция ясно передаёт сравнительное соответствие между причинённым вредом и ответным последствием.
- source_word: יִתֵּן מוּם
  choice: причинит вред
  rationale: Буквально сочетание означает «даст изъян/увечье»; в русском юридическом контексте идиоматично «причинить вред», при этом примечание сохраняет более буквальные оттенки.
- source_word: אָדָם
  choice: человеку
  rationale: В казуальном законе это родовое обозначение любого человека, а не указание исключительно на мужчину.
- source_word: יִנָּתֶן בּוֹ
  choice: должен быть причинён ему
  rationale: Пассивная форма נתן сохранена, а подразумеваемый вред выражен в русском явно; модальное «должен» естественно передаёт предписание закона.
theological_decisions:
- issue: Характер формулы воздаяния
  choice: Сохранить конкретную формулу «перелом за перелом, глаз за глаз, зуб за зуб».
  alternative: Передать её отвлечённо как «возмещение, соответствующее ущербу».
  rationale: Еврейский текст формулирует принцип через конкретные телесные повреждения. Перевод не должен заранее решать, означает ли его применение буквальное ответное повреждение или эквивалентное возмещение.
- issue: Значение מוּם в заключительной формуле
  choice: «вред» в основном тексте с уточнением в примечании.
  alternative: «увечье», «изъян» или «телесный недостаток».
  rationale: «Вред» естественно охватывает перечисленные травмы, а примечание сохраняет телесный и потенциально обезображивающий оттенок исходного слова.
