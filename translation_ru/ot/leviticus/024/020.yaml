lexical_decisions:
- source_word: שֶׁבֶר
  choice: перелом
  rationale: В данном перечне телесных повреждений существительное обозначает перелом; это точнее, чем более общее «повреждение».
- source_word: תַּחַת
  choice: за
  rationale: В формуле воздаяния выражает соответствие и естественно передаётся по-русски устойчивым оборотом «глаз за глаз».
- source_word: עַיִן
