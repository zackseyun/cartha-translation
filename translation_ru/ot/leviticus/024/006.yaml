  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: ru
  text: И разложи их двумя рядами[a], по шесть в каждом ряду, на чистом[b] столе перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двумя группами» или «двумя стопками»; еврейское слово обозначает упорядоченное расположение хлебов.'
    reason: lexical_alternative
  - marker: b
    text: То есть чистом в ритуальном смысле, а не просто физически вымытом.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: И разложи
  rationale: Глагол שׂוּם означает «класть, помещать, устанавливать»; в данном контексте «разложи» естественно передаёт предписание упорядоченно разместить хлебы. Форма обращена к одному лицу во втором лице мужского рода.
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение прямого дополнения отсылает к двенадцати хлебам из предыдущего стиха.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: двумя рядами
  rationale: מַעֲרָכָה обозначает упорядоченное расположение или группу. Для хлебов на столе «два ряда» — наиболее естественное русское выражение, хотя еврейское слово не исключает иной способ размещения.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: по шесть в каждом ряду
  rationale: 'Краткая еврейская конструкция буквально близка к «шесть [в] расположении» и имеет распределительный смысл: в каждой из двух групп по шесть хлебов.'
- source_word: עַל הַשֻּׁלְחָן
  choice: на ... столе
  rationale: עַל здесь обозначает положение на поверхности; «на столе» — прямой и естественный русский эквивалент.
- source_word: הַטָּהֹר
  choice: чистом
  rationale: טָהוֹר в контексте святилища означает ритуальную чистоту. Русское «чистый» сохраняет основное значение слова; примечание поясняет культовый смысл.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי означает «перед, в присутствии». «Пред Яхве» кратко и уместно для возвышенного культового контекста; имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное заветное имя Бога. Передача «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Культовое значение הַטָּהֹר
  choice: чистый стол
  alternative: чистый в ритуальном отношении стол; священно чистый стол
  rationale: Прилагательное указывает на ритуальную чистоту предмета святилища. Основной текст сохраняет лаконичность оригинала, а примечание предотвращает понимание лишь как бытовой опрятности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Повелительное «разложи» ясно передаёт инструкцию, а форма «пред Яхве» сохраняет краткость и культовый регистр оригинала.
