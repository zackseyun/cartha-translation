  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: ru
  text: И они поместили его под стражу, чтобы разъяснить им[a] по слову Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. глагол может означать «разъяснить» или «ясно объявить». Предмет разъяснения в тексте прямо не назван.
    reason: Сохранение неоднозначности отсутствующего дополнения при глаголе לִפְרֹשׁ.
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: И они заключили его
  rationale: Глагол в каузативной форме означает «поместили, оставили»; вместе с последующим בַּמִּשְׁמָר естественная русская юридическая формулировка — «заключили его под стражу».
- source_word: בַּמִּשְׁמָר
  choice: под стражу
  rationale: Существительное обозначает охраняемое содержание или заключение; выражение «под стражу» ясно передаёт ситуацию в данном правовом контексте.
- source_word: לִפְרֹשׁ לָהֶם
  choice: чтобы им было ясно объявлено решение
  rationale: Инфинитив от פרשׁ выражает прояснение или отчётливое объявление. Слово «решение» подразумевается судебным контекстом, но не названо в еврейском тексте, поэтому эта особенность отмечена в сноске.
- source_word: עַל־פִּי
  choice: по слову
  rationale: Идиома буквально означает «по устам» и указывает на соответствие авторитетному высказыванию; «по слову» сохраняет и речевой, и властный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Неуказанный предмет прояснения
  choice: решение
  alternative: 'оставить дополнение формально невыраженным: «чтобы прояснить им»'
  rationale: Судебный контекст показывает, что ожидалось постановление о том, как поступить с задержанным. При этом слово «решение» в еврейском тексте отсутствует, что открыто отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридическая ситуация передана естественными выражениями «заключили под стражу» и «объявлено решение»; личное имя Бога сохранено как «Яхве».
