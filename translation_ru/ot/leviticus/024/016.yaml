  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: ru
  text: Кто хулит имя Яхве, тот непременно должен быть предан смерти[a]; всё общество должно непременно забросать его камнями. Будь то пришелец или коренной житель — если он хулит Имя[b], должен быть предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произносит имя Яхве» либо «проклинает имя Яхве». Еврейский глагол здесь может означать отчётливое произнесение или называние, а также поношение.'
    reason: lexical_alternative
  - marker: b
    text: Здесь в еврейском тексте стоит просто «Имя» — благоговейное заместительное обозначение божественного имени.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: хулит / если он хулит
  rationale: Глагол נקב может означать ясное произнесение или называние, а в данном контексте — также поношение священного имени. «Хулит» естественно передаёт преступное осквернение имени, не сводя запрет к одному лишь его произнесению; неоднозначность отмечена в сноске.
- source_word: שֵׁם יְהוָה
  choice: имя Яхве
  rationale: שֵׁם означает «имя», а тетраграмматон передан как личное имя «Яхве», что сохраняет прямое обозначение Бога в еврейском тексте.
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает пассивную юридическую формулу, выражая обязательность и неотвратимость смертной казни.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: непременно должно побить его камнями
  rationale: Абсолютный инфинитив с личной формой придаёт предписанию усиление; суффикс при בו передан местоимением «его».
- source_word: כָּל הָעֵדָה
  choice: всё общество
  rationale: עֵדָה обозначает собранное сообщество Израиля. «Всё общество» понятно современному читателю и сохраняет коллективный юридический смысл.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: как пришелец, так и коренной житель
  rationale: גֵּר — живущий среди Израиля некоренной житель, а אֶזְרָח — коренной член общества. Парная конструкция передаёт равное применение закона к обоим.
- source_word: שֵׁם
  choice: Имя
  rationale: Во второй формулировке слово стоит самостоятельно и служит благоговейным заместительным обозначением божественного имени; это отражено прописной буквой.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; форма «Яхве» сохраняет его как личное заветное имя, не заменяя титулом.
- issue: Значение נקב в сочетании с божественным именем
  choice: хулит
  alternative: произносит; проклинает
  rationale: Контекст смертной казни указывает на преступное осквернение имени, однако лексическая неоднозначность глагола реальна. Основной текст передаёт контекстуальный смысл, а иные возможности сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-сакрального предписания. Усилительные еврейские конструкции переданы словом «непременно», пассивная формула казни сохранена. Архаизмы вроде «смертью да умрёт» и потенциально конфессионально окрашенная замена имени титулом не использованы.
