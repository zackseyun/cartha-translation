base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: ru
  text: «Выведи того, кто проклял, за пределы стана[a]. Пусть все, кто слышал, возложат руки ему на голову[b], и пусть всё общество побьёт его камнями».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богохульника», «того, кто хулил». В еврейском тексте буквально: «того, кто проклял».'
    reason: alternative_reading
  - marker: b
    text: Возложение рук здесь, вероятно, служило официальным подтверждением свидетелями личности виновного; некоторые также видят в нём символическое значение.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: Выведи
  rationale: Каузативный императив от יצא означает «заставить выйти, вывести»; русский глагол естественно сочетается с направлением «за пределы стана».
- source_word: הַמְקַלֵּל
  choice: того, кто проклял
  rationale: Причастие от קלל указывает на конкретного виновного и буквально обозначает того, кто проклял; формулировка не подменяет это значение более толковательным «богохульника».
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Точная и естественная передача пространственного выражения с сохранением общинно-ритуального контекста.
- source_word: וְסָמְכוּ
  choice: Пусть … возложат
  rationale: Продолжает повелительную силу начального императива; «возложить руки» — устойчивое русское соответствие סמך в этой конструкции.
- source_word: כָל הַשֹּׁמְעִים
  choice: все слышавшие
  rationale: Причастная форма передана без добавления объекта, которого в еврейском тексте нет; из контекста понятно, что это свидетели произнесённых слов.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: руки ему на голову
  rationale: Сохраняются множественное число «руки» и единственное «голова»; дательный «ему» звучит по-русски естественно.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: побьёт его камнями
  rationale: Традиционное и точное русское обозначение казни через побиение камнями; единственное число сказуемого согласовано с собирательным «общество».
- source_word: כָל הָעֵדָה
  choice: всё общество
  rationale: עֵדָה обозначает собранную общину; «общество» соответствует русскому библейскому регистру и сохраняет коллективный смысл.
theological_decisions:
- issue: Передача обозначения виновного
  choice: того, кто проклял
  alternative: богохульника / того, кто хулил
  rationale: Непосредственно употреблено причастие от קלל, «проклинать». Контекст связывает проступок с Божьим Именем, однако основной текст сохраняет буквальный лексический смысл, а толковательный вариант вынесен в примечание.
- issue: Значение возложения рук
  choice: Сохранить само действие без объяснения его смысла в основном тексте
  alternative: Истолковать как официальное опознание виновного свидетелями или как символическое действие
  rationale: Стих предписывает действие, но прямо не объясняет его символику; перевод не выбирает между возможными толкованиями.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Стан» и «общество» сохраняют принятую библейскую лексику, оставаясь понятными; синтаксис сделан прямым и ясным. Все маркеры примечаний включены в основной текст.
