  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: ru
  text: 'А сынам Израиля[a] скажи: «Если кто-либо[b] проклянёт своего Бога, то понесёт свой грех[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Израиля»; выражение обозначает народ Израиля в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человек, человек» — еврейское удвоение с распределительным значением: «всякий» или «кто бы то ни был».'
    reason: lexical_alternative
  - marker: c
    text: «Понести свой грех» — еврейский оборот со значением нести вину или ответственность за совершённый проступок.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: А сынам Израиля
  rationale: Союз וְ связывает повеление с предыдущей речью, а выражение בְּנֵי יִשְׂרָאֵל буквально означает «сыны Израиля» и здесь обозначает народ Израиля в целом.
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: скажи
  rationale: В законодательном обращении форма глагола передаёт повеление Моисею. Русское «скажи» естественно включает функцию последующего לֵאמֹר и не требует тяжеловесного «говоря».
- source_word: אִישׁ אִישׁ
  choice: кто-либо
  rationale: 'Удвоение слова אִישׁ имеет распределительное значение: речь идёт о любом отдельном человеке. «Кто-либо» естественно передаёт условную юридическую формулировку; буквальная форма поясняется в сноске.'
- source_word: כִּי יְקַלֵּל
  choice: если … проклянёт
  rationale: כִּי вводит правовой случай, а piel глагола קלל означает здесь «проклинать» или «злословить». «Проклянёт» сохраняет отличие от более конкретного оскорбления Имени в следующем стихе.
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Суффикс третьего лица передан возвратным притяжательным местоимением, естественным при совпадении обладателя с подлежащим. Перевод сохраняет притяжательное значение и не подменяет слово именем «Господь».
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: то понесёт свой грех
  rationale: Союз выражает следствие условия. Сохранён еврейский юридический оборот «нести грех», подразумевающий виновность и ответственность за проступок.
theological_decisions:
- issue: Кого обозначает אֱלֹהָיו
  choice: своего Бога
  alternative: Господа; Бога
  rationale: В еврейском тексте стоит притяжательная форма «его Бог». Её сохранение не сужает смысл до имени Господа и оставляет различие между формулировками этого и следующего стихов.
- issue: Распределительный мужской субъект אִישׁ אִישׁ
  choice: кто-либо
  alternative: всякий мужчина; всякий человек
  rationale: Удвоенная форма грамматически мужского рода служит общей распределительной формулой закона. Русское «кто-либо» передаёт её естественно, не утверждая без достаточных оснований, что предписание ограничено только мужчинами; буквальная форма отмечена в сноске.
- issue: Значение выражения «нести грех»
  choice: сохранить образный юридический оборот
  alternative: понести наказание за грех; нести вину
  rationale: חֶטְאוֹ буквально означает «его грех», а не прямо названное наказание. Перевод сохраняет смысловую напряжённость между грехом, виной и ответственностью, поясняя идиому в сноске.
translation_notes:
  register: Современный литературный русский с ясным законодательным тоном. Порядок «А сынам Израиля скажи» сохраняет связь с контекстом и звучит торжественно без архаического «говоря»; ключевой еврейский оборот «понесёт свой грех» сохранён и разъяснён.
