  yaml_path: translation/ot/leviticus/024/013.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма с последовательным וַ продвигает повествование; «и сказал» естественно передаёт формулу введения прямой речи по-русски. Еврейское דבר буквально ближе к «говорил», но в сочетании с לֵאמֹר русская конструкция «сказал:» избегает тяжеловесного повтора.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל; имя дано в принятой русской форме.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Стандартная еврейская формула, вводящая содержание последующей речи, естественно передаётся в современном русском двоеточием после глагола речи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом; «Иегова» отражает позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык; краткая и достоинственная повествовательная формула. Двоеточие указывает, что содержание речи следует в следующем стихе.
