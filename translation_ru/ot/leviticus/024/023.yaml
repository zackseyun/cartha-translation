    rationale: עָשׂוּ כַּאֲשֶׁר означает «сделали, как / согласно тому, что», но не содержит отдельного эквивалента «всё». Его следует убрать для более точного соответствия источнику.
  - severity: low
    issue: Оборот «Моисей сказал сынам Израиля» менее естественен в современном русском повествовании.
    rationale: Глагол דבר здесь обозначает обращение Моисея к народу. «Моисей обратился к сынам Израиля» естественно передаёт это значение, не добавляя содержания.
  revised_text: Моисей обратился к сынам Израиля, и они вывели за пределы стана того, кто проклял, и побили его камнями. Так сыны Израиля сделали, как Яхве повелел Моисею.
