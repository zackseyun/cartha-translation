revisions:
- from: Моисей сказал сынам Израиля, и они вывели того, кто проклял[a], за пределы стана и побили его камнями. Так сыны Израиля сделали всё, как повелел Яхве Моисею.
  to: Моисей обратился к сынам Израиля, и они вывели за пределы стана того, кто проклял, и побили его камнями. Так сыны Израиля сделали, как Яхве повелел Моисею.
  rationale: Убрано не выраженное в оригинале «всё»; начальный глагол заменён на более естественный для современного русского оборот «обратился к». Сноска уточнена так, чтобы буквально отражать форму еврейского причастия, сохраняя при этом её контекстуальную отсылку к уже совершённому проклятию.
  reviewer_model: gpt-5.6-terra
