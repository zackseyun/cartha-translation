base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: ru
  text: Моисей обратился к сынам Израиля, и они вывели за пределы стана того, кто проклял, и побили его камнями. Так сыны Израиля сделали, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в породе пиэль обычно означает «говорить». В данном повествовательном контексте «сказал» естественно передаёт обращение Моисея к народу.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально прозрачная передача еврейского выражения сохраняет его образ и мужской род множественного числа; оборот остаётся понятным в современном литературном русском языке.
- source_word: וַיּוֹצִיאוּ
  choice: вывели
  rationale: Каузативная форма глагола יצא означает «вывести, заставить выйти». «Вывели» естественно описывает исполнение судебного приговора.
- source_word: הַמְקַלֵּל
  choice: того, кто проклял
  rationale: Причастие от קלל прямо обозначает человека, который проклял; контекст указывает на ранее совершённое действие. Такая передача не подменяет лексическое значение более истолковательным словом «богохульник».
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Сочетание с глаголом движения обозначает выведение наружу, за границу стана. Русский оборот естественен и точно передаёт направление движения.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: побили его камнями
  rationale: Еврейский текст называет и действие, и орудие. Устойчивое русское выражение сохраняет оба элемента без неестественного повтора.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: сделали всё, как повелел
  rationale: Формула подводит итог исполнению ранее данного повеления. Слово «всё» естественно выражает полноту соответствия, подразумеваемую оборотом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передавать ли הַמְקַלֵּל более богословски нагруженным словом «богохульник»
  choice: того, кто проклял
  alternative: богохульника
  rationale: Хотя предшествующий контекст говорит о проклятии Божьего Имени, в самом стихе употреблено причастие от קלל — «проклинать». Основной текст сохраняет прямой лексический смысл, а контекстуальное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Обороты «сыны Израиля» и «стан» сохранены как понятные традиционные соответствия, а синтаксис сделан прямым и доступным.
