lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И говорил
  rationale: Форма с последовательным וַ продвигает повествование и вводит очередное Божье повеление. «И говорил» естественно продолжает цепь повествования и сохраняет формулу оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «говоря» вводит последующую прямую речь; в современном русском эту функцию естественно и точно выполняет двоеточие без тяжеловесного «сказав».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя; примечание сообщает традиционную русскую замену и иной вариант передачи.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского: адресат выражен дательным падежом, а לֵאמֹר передано пунктуационным введением прямой речи.'
