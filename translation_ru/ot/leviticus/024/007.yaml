  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: ru
  text: На каждый ряд[a] положи чистый ладан. Он будет служить памятной частью при хлебе — жертвой, сжигаемой для Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на расположение». В данном контексте имеются в виду два упорядоченных ряда хлебов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «огненной жертвой»; также: «приношением, сжигаемым на огне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: положи
  rationale: Форма с וְ в контексте обрядовых предписаний передаёт повеление; «положи» естественно выражает размещение ладана на рядах хлебов.
- source_word: עַל הַמַּעֲרֶכֶת
  choice: на каждый ряд
  rationale: Существительное обозначает упорядоченное расположение; в контексте предыдущего стиха речь идёт о двух рядах хлебов. Единственное число имеет распределительное значение, хотя буквально возможно «на расположение».
- source_word: לְבֹנָה זַכָּה
  choice: чистый ладан
  rationale: לְבֹנָה — благовонная смола, традиционно называемая ладаном; זַכָּה указывает на её чистоту и пригодность для священного употребления.
- source_word: וְהָיְתָה לַלֶּחֶם
  choice: он будет при хлебе
  rationale: Местоимение относится к ладану. Предлог לְ выражает его назначение по отношению к хлебу; «при хлебе» ясно показывает сопутствующую обрядовую функцию, не утверждая, что хлеб сжигался.
- source_word: לְאַזְכָּרָה
  choice: памятной частью
  rationale: Это специальное жертвенное обозначение части приношения, возносимой как напоминание перед Богом. «Памятная часть» передаёт культовую функцию точнее, чем отвлечённое «в напоминание».
- source_word: אִשֶּׁה
  choice: огненной жертвой
  rationale: В священнической обрядовой лексике слово обычно обозначает жертву, приносимую на огне. Формулировка сохраняет связь с огнём и звучит естественно по-русски.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה, а не заменено титулом «Господь».
theological_decisions:
- issue: К чему относится определение אִשֶּׁה לַיהוָה
  choice: Ладан как памятная часть является огненной жертвой Яхве
  alternative: Хлеб является огненной жертвой Яхве
  rationale: Грамматически וְהָיְתָה в женском роде относится к לְבֹנָה («ладан», женский род), а хлеб оставался для священников и не сжигался. Пунктуация сохраняет связь «огненной жертвы» с памятной частью.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Текст прямо употребляет Тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с краткой повелительной формой, соответствующей стилю обрядовых предписаний. Сохранены культовые термины «памятная часть» и «огненная жертва», а менее очевидные места пояснены сносками.
