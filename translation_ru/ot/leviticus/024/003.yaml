source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: ru
  text: Вне завесы свидетельства[a], в шатре встречи, Аарон должен приводить его в порядок от вечера до утра перед Яхве постоянно[b]. Это вечное установление для всех ваших поколений[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занавеса свидетельства».'
    reason: lexical_alternative
  - marker: b
    text: «Постоянно» здесь может означать регулярное, неизменно повторяющееся соблюдение обряда; его время указано словами «от вечера до утра».
    reason: cultural_note
  - marker: c
    text: 'Или: «непреходящее установление»; «установление навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: вне завесы свидетельства
  rationale: Сохраняет пространственное значение מִחוּץ и традиционный культовый смысл פָּרֹכֶת; сочетание הָעֵדֻת передано без уточнения, что именно является «свидетельством».
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Прямое и понятное обозначение святилища; «встреча» сохраняет смысл מוֹעֵד в данном устойчивом сочетании.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: должен устраивать его
  rationale: Глагол ערך означает приводить в порядок, располагать или обслуживать в ритуальном контексте. Местоимение мужского рода сохранено, поскольку оно отсылает к светильнику из предыдущего стиха, не названному здесь повторно.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: от вечера до утра
  rationale: Естественно и точно передаёт указанный временной промежуток.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» уместно в возвышенном культовом контексте и выражает нахождение в присутствии Бога; личное имя יהוה передано как «Яхве».
- source_word: תָּמִיד
  choice: постоянно
  rationale: Сохраняет идею непрерывно повторяющегося установленного служения, не отменяя уточнения «от вечера до утра».
- source_word: חֻקַּת עוֹלָם
  choice: вечное установление
  rationale: Передаёт долговременную обязательность предписания; «установление» естественнее в русском религиозно-правовом контексте, чем буквальное «устав».
- source_word: לְדֹרֹתֵיכֶם
  choice: для всех ваших поколений
  rationale: Ясно выражает действие предписания во всех последующих поколениях.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение תָּמִיד при указании «от вечера до утра»
  choice: постоянно
  alternative: регулярно; каждую ночь
  rationale: Слово может обозначать постоянное соблюдение обряда, тогда как сам стих ограничивает работу светильника ночным временем. Перевод сохраняет это напряжение и не добавляет отсутствующее в тексте «каждую ночь».
- issue: Референт местоимения אֹתוֹ
  choice: его
  alternative: светильник; огонь
  rationale: Местоимение, вероятно, отсылает к светильнику из предыдущего стиха, однако данный стих не повторяет существительное. Сохранение местоимения не устраняет межстиховую зависимость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Синтаксис следует порядку еврейского текста, но остаётся естественным; сохранены неоднозначность слова תָּמִיד и местоименная отсылка к предыдущему стиху.
