base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: ru
  text: Сын израильтянки — его отцом был египтянин — вышел в среду сынов Израиля[a]. В стане сын израильтянки и один израильтянин подрались[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди израильтян». Буквально: «среди сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поссорились». Глагол может обозначать как ссору, так и драку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Обычное повествовательное значение глагола יצא; исходная точка не уточняется, поэтому она не добавлена.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית וְהוּא בֶּן אִישׁ מִצְרִי
  choice: Сын израильтянки, отец которого был египтянином
  rationale: Естественно передаёт указание на материнское и отцовское происхождение, не меняя смысла еврейского текста.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: к сынам Израиля
  rationale: В сочетании с глаголом движения это естественная русская передача появления человека среди израильского сообщества; в примечании дан более плавный этноним.
- source_word: וַיִּנָּצוּ
  choice: подрались
  rationale: Глагол может обозначать ссору или драку. Контекст последующего обострения допускает физическое столкновение, однако неоднозначность отмечена в сноске.
- source_word: בַּמַּחֲנֶה
  choice: в стане
  rationale: Краткое и понятное обозначение израильского лагеря, соответствующее возвышенному повествовательному регистру.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: сын израильтянки
  rationale: Повтор исходного обозначения сохранён для идентификации участника и литературного акцента.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: и один израильтянин
  rationale: Передаёт нового, ранее не упомянутого участника и его этническую принадлежность естественным русским выражением.
theological_decisions:
- issue: Национально-заветное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формула «сыны Израиля» сохраняет традиционное и буквально гендерно маркированное обозначение народа; более идиоматичный вариант приведён в сноске, без изменения богословского содержания.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён по сравнению с еврейским нанизыванием союзов, но повтор «сын израильтянки» сохранён. Все сносочные маркеры поставлены непосредственно при соответствующих словам и выражениям.
