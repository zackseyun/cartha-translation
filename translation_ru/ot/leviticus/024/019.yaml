  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: ru
  text: Если кто причинит телесное повреждение своему ближнему[a], то и ему будет причинено такое же повреждение, какое причинил он[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своему соплеменнику» или «товарищу»; еврейское слово обозначает другого члена сообщества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как он поступил»; буквально: «как он сделал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Если кто
  rationale: В формулировке конкретного правового случая כִּי имеет условное значение. Русское «если кто» естественно передаёт конструкцию и сохраняет обобщённый смысл существительного אִישׁ.
- source_word: יִתֵּן מוּם
  choice: причинит увечье
  rationale: Буквально выражение означает «нанесёт изъян/повреждение». В данном законе מוּם обозначает телесное повреждение, поэтому «причинит увечье» точно и естественно передаёт контекстуальный смысл.
- source_word: בַּעֲמִיתוֹ
  choice: своему ближнему
  rationale: עָמִית обозначает другого члена сообщества — ближнего, соплеменника или товарища. «Своему ближнему» сохраняет межличностный и общинный оттенок слова.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: как он сделал
  rationale: Сравнительная конструкция устанавливает соответствие между причинённым вредом и наказанием без дополнительных толкований.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: так пусть будет сделано и ему
  rationale: Страдательная форма сохраняет безлично-судебный характер предписания и не представляет его призывом к личной мести.
theological_decisions:
- issue: Формула равного воздаяния в правовом контексте
  choice: 'Передать как судебный принцип соразмерного воздаяния: «как он сделал, так пусть будет сделано и ему»'
  alternative: Истолковать как разрешение пострадавшему лично отомстить обидчику
  rationale: Древнееврейский текст формулирует безличную правовую норму. Перевод сохраняет её напряжённую буквальность, но не добавляет идеи частной мести.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным правовым звучанием. Синтаксический параллелизм еврейского текста сохранён; архаизмы и конфессионально окрашенные пояснения не добавлялись.
