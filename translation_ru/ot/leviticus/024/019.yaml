    rationale: מוּם означает физический изъян, дефект или повреждение; в данном контексте речь о телесном вреде, но текст не уточняет, что вред обязательно является увечьем в современном узком смысле.
  - severity: low
    issue: «Пусть будет сделано» неточно передаёт модальность משפטной формулы.
    rationale: יִעָשֶׂה — имперфект в пассиве; в законодательном контексте русское «будет сделано/причинено» точнее сохраняет формулу предписанного воздаяния, не придавая ей оттенка пожелания.
  - severity: low
