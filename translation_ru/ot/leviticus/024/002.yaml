  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: ru
  text: Повели сынам Израиля[a] принести тебе чистое масло из толчёных оливок[b] для освещения, чтобы светильник горел постоянно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам», «народу Израиля». Буквально: «сынам Израиля» — обычное заветное обозначение народа.'
    reason: lexical_alternative
  - marker: b
    text: То есть масло из оливок, размельчённых толчением; еврейский текст указывает как на чистоту масла, так и на способ его изготовления.
    reason: lexical_clarification
lexical_decisions:
- source_word: צַו
  choice: Повели
  rationale: Императив выражает прямое властное повеление; «повели» сохраняет его силу и соответствует возвышенному, но понятному библейскому регистру.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально передаёт древнееврейское «сыны Израиля» как традиционное обозначение народа завета, не устраняя грамматически мужскую форму.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: принести тебе
  rationale: Хотя לקח буквально означает «взять», сочетание с направлением «к тебе» имеет смысл «принести» или «доставить»; инфинитив естественно зависит от русского «повели».
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: чистое масло из толчёных оливок
  rationale: Переданы исходный продукт, чистота масла и способ его изготовления. Формулировка яснее для современного читателя, чем буквальное «битое оливковое масло».
- source_word: לַמָּאוֹר
  choice: для освещения
  rationale: Передаёт назначение масла и естественно звучит по-русски, не добавляя отсутствующего в этой фразе прямого упоминания светильника или светильника-меноры.
- source_word: לְהַעֲלֹת נֵר
  choice: чтобы светильник горел
  rationale: Древнееврейская каузативная идиома буквально говорит о «возжигании/поднятии» светильника; русский оборот естественно выражает требуемый результат — поддержание его горения.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Сохраняет основной смысл непрерывности или регулярной неизменности храмового служения, не уточняя сверх текста режим горения.
theological_decisions:
- issue: Заветное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам / народу Израиля
  rationale: Основной текст сохраняет формальный образ исходного выражения. Сноска поясняет, что это принятое обозначение всего народа, не сводя адресатов к узкой группе мужчин.
- issue: Характер постоянства תָּמִיד
  choice: светильник горел постоянно
  alternative: светильник зажигали регулярно
  rationale: «Постоянно» сохраняет традиционную и контекстуально естественную передачу, одновременно не вводя точного расписания; возможный оттенок регулярности остаётся присущ самому слову и культовому контексту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён до естественной конструкции «повели… принести», при этом сохранены образное обозначение народа и существенные культовые детали.
