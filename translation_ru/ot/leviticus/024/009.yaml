base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: ru
  text: Это будет принадлежать Аарону и его сыновьям; они должны есть это в святом месте, ибо для него это — великая святыня из числа огненных приношений Яхве[a]. Это вечное установление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из числа жертв, сжигаемых для Яхве». Еврейское слово традиционно обозначает приношения, представляемые посредством огня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: И пусть он принадлежит Аарону и его сыновьям
  rationale: Конструкция היה с לְ выражает принадлежность или назначение доли. Мужской род местоимения согласован по смыслу с хлебом из предыдущего контекста; «сыновьям» точно передаёт конкретных мужских священнических потомков.
- source_word: וַאֲכָלֻהוּ
  choice: они должны есть его
  rationale: Форма продолжает предписание; «должны есть» естественно передаёт обязательный характер культового закона.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: на святом месте
  rationale: Русское «на святом месте» естественно передаёт локатив и не отождествляет выражение специально со Святым отделением святилища.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Устойчивое русское библейское выражение передаёт еврейский суперлатив, не создавая путаницы со Святым святых как помещением.
- source_word: הוּא לוֹ
  choice: он — великая святыня для него
  rationale: Сохранено единственное число לֹו, хотя ранее названы Аарон и его сыновья; Аарон может выступать представителем священнической линии.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: из огненных приношений Яхве
  rationale: אִשֶּׁה обозначает жертвенное приношение, связанное с огнём; «огненные приношения» сохраняет традиционную культовую семантику без предположения, что речь буквально идёт о пище Бога.
- source_word: חָק עוֹלָם
  choice: вечное установление
  rationale: Передаёт долговременную и обязательную силу постановления естественным, dignified современным русским языком.
theological_decisions:
- issue: Референт единственного числа לֹו после упоминания Аарона и его сыновей
  choice: Сохранено «для него»
  alternative: «для них» как согласование с совокупностью священников
  rationale: Еврейский текст использует единственное число. Его сохранение не устраняет возможную представительную роль Аарона и не сглаживает грамматическое напряжение.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя в исходном тексте и согласуется с предоставленным проектным решением.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного культового текста. Синтаксис достаточно близок к еврейскому оригиналу, но естественен по-русски; подлинная неоднозначность единственного числа сохранена.
