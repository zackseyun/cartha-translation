  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: ru
  text: На чистом светильнике он должен постоянно расставлять лампады пред Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит Божье имя יהוה (ЙХВХ), переданное как «Яхве».
    reason: divine_name
lexical_decisions:
- source_word: עַל הַמְּנֹרָה הַטְּהֹרָה
  choice: на чистом светильнике
  rationale: Предлог עַל естественно обозначает положение лампад на светильнике; מְנוֹרָה — культовый светильник, а טְהֹרָה указывает на его чистоту в священническом контексте.
- source_word: יַעֲרֹךְ
  choice: он должен расставлять
  rationale: Глагол ערך означает приводить в порядок, размещать или располагать; «расставлять» ясно передаёт упорядоченное размещение лампад без добавления более широкого смысла обслуживания.
- source_word: הַנֵּרוֹת
  choice: лампады
  rationale: נֵרוֹת обозначает отдельные сосуды со светильными фитилями на светильнике; «лампады» в данном храмовом контексте точнее русского «лампы» и отличает их от самого светильника.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי — обычное культовое выражение «перед, в присутствии»; «пред» сохраняет краткость и приподнятый библейский регистр, а личное имя передано как «Яхве».
- source_word: תָּמִיד
  choice: постоянно
  rationale: תָּמִיד в священническом контексте может обозначать непрерывность либо регулярно повторяемое установленное действие; «постоянно» сохраняет эту смысловую широту.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя, не заменяя его титулом.
- issue: Характер действия, выраженного תָּמִיד
  choice: постоянно
  alternative: всегда; регулярно
  rationale: Форма допускает как идею постоянства, так и регулярно совершаемого установленного служения; выбранное слово не сужает смысл до одного из этих оттенков.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным культовым выражением «пред Яхве». «Светильник» и «лампады» последовательно различают менору как подставку и установленные на ней отдельные светильные сосуды.
