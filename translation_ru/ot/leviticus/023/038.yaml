  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: ru
  text: Помимо суббот Яхве[a], помимо ваших даров, помимо всех ваших обетов[b] и помимо всех ваших добровольных приношений, которые вы приносите Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «помимо» здесь можно понимать как «отдельно от» или «в дополнение к»; то же относится к каждому его повторению в стихе.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всего, обещанного вами по обету» либо «всех ваших приношений по обету».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: помимо
  rationale: 'Передаёт отношение этих приношений к уже названным праздничным установлениям: они совершаются отдельно от них и в дополнение к ним. Повтор сохранён в соответствии с еврейским текстом.'
- source_word: שַׁבְּתֹת יְהוָה
  choice: суббот Яхве
  rationale: Сохраняет множественное число и конструкцию принадлежности с личным именем Бога.
- source_word: מַתְּנוֹתֵיכֶם
  choice: ваших даров
  rationale: Широкое и естественное обозначение даров, отдаваемых Богу, без неоправданного сужения значения до определённого вида жертвы.
- source_word: כָּל נִדְרֵיכֶם
  choice: всех ваших обетов
  rationale: Буквально передаёт נֶדֶר и сохраняет возможность понимать слово как обеты или как обещанное по обету в контексте приношений.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: всех ваших добровольных приношений
  rationale: В культовом контексте נְדָבָה обозначает приношение, совершаемое добровольно, а не по обязательному предписанию.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: которые вы приносите Яхве
  rationale: Глагол נתן буквально означает «давать», но применительно к дарам и жертвам естественно передаётся как «приносить». Относительное придаточное отнесено ко всему перечислению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя Бога; транслитерация «Яхве» сохраняет это имя и не заменяет его титулом.
- issue: Значение נִדְרֵיכֶם в перечне приношений
  choice: ваших обетов
  alternative: приношений по вашим обетам; обещанного вами по обету
  rationale: Форма буквально означает «ваши обеты», хотя контекст допускает метонимическое указание на приношения, обещанные по обету. Основной текст сохраняет эту смысловую напряжённость, а примечание поясняет альтернативу.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Синтаксический повтор «помимо» сохранён ради структуры и ритма исходного текста; «приносите» естественно для богослужебного контекста.
