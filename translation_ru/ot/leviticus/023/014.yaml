  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: ru
  text: Не ешьте ни хлеба, ни поджаренного зерна[a], ни свежего зерна[b] вплоть до этого самого дня — пока не принесёте приношение вашему Богу. Это вечное установление из поколения в поколение во всех местах, где вы живёте.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подсушенного зерна».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нового зерна».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «постоянное установление»; «непреходящее установление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: хлеб
  rationale: Конкретное значение «хлеб» лучше всего соответствует перечислению различных видов пищи из зерна; более широкое «пища» здесь неоправданно.
- source_word: קָלִי
  choice: жареное зерно
  rationale: Слово обозначает зерно, приготовленное обжариванием или подсушиванием; этот перевод конкретен и понятен современному читателю.
- source_word: כַרְמֶל
  choice: свежее зерно
  rationale: В ряду с хлебом и жареным зерном речь идёт о свежих, недавно созревших зёрнах или колосьях, а не о географическом названии Кармил.
- source_word: לֹא תֹאכְלוּ
  choice: не ешьте
  rationale: Отрицательная форма глагола в законодательном контексте выражает прямой запрет; русский императив естественно передаёт его силу.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: до самого этого дня
  rationale: Слово עֶצֶם усиливает указание на день; «самого этого дня» сохраняет эмфатический смысл.
- source_word: עַד הֲבִיאֲכֶם
  choice: до тех пор, пока не принесёте
  rationale: Инфинитивная конструкция обозначает действие, исполнение которого прекращает запрет; эта формулировка ясно передаёт временную границу.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: приношение вашему Богу
  rationale: קָרְבָּן — общее обозначение дара, приносимого Богу. Дательный падеж по-русски естественно выражает направленность приношения и избегает двусмысленного «приношение вашего Бога».
- source_word: חֻקַּת עוֹלָם
  choice: вечное установление
  rationale: Формулировка сохраняет выраженную в еврейском тексте длительную, непреходящую силу предписания, не разрешая богословский вопрос о его применении вне данного заветно-правового контекста.
- source_word: לְדֹרֹתֵיכֶם
  choice: для всех ваших поколений
  rationale: Передаёт продолжение действия установления в череде поколений естественным современным русским языком.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: во всех местах вашего проживания
  rationale: Сохраняет универсальный охват всех мест, где живёт народ, и остаётся понятным без архаичного оборота.
theological_decisions:
- issue: Сила выражения חֻקַּת עוֹלָם в Моисеевом законе
  choice: «вечное установление» без пояснения о дальнейших границах его действия
  alternative: «постоянное установление» или «непреложное установление»
  rationale: Еврейское выражение подчёркивает непреходящую обязательность постановления в правовом контексте Левита. Перевод сохраняет эту силу и не привносит выводов о продолжении или прекращении обрядового закона в более позднем богословском контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. Перечисление сохранено конкретным, запрет передан прямо, а синтаксис упрощён лишь настолько, чтобы стих естественно читался по-русски. Все примечания поставлены непосредственно после соответствующих выражений.
