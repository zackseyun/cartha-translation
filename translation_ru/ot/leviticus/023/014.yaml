    rationale: Русское «до самого этого дня» звучит шероховато и может восприниматься как простое указание на предел без переданного усиления. «Вплоть до этого самого дня» естественно сохраняет эмфазу עֶצֶם.
  - severity: low
    issue: Примечание c предлагает «непреложное установление».
    rationale: 'Это не нейтральная лексическая альтернатива для עוֹלָם: слово говорит о длительности, постоянстве или вечности, а не прямо о неотменяемости.'
  - severity: low
