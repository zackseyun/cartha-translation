  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: ru
  text: Ибо всякий, кто не будет смирять себя[a] в этот самый день, будет отсечён от своего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет изнурять себя». Еврейское выражение обозначает самоумаление или самоограничение; оно традиционно связывается с постом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего предписания; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет торжественный юридический регистр.
- source_word: כָל הַנֶּפֶשׁ
  choice: всякий
  rationale: נֶפֶשׁ здесь обозначает человека, а не «душу» как отдельную нематериальную сущность. Субстантивированное «всякий» ясно и естественно выражает универсальный характер нормы.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: кто не смирит себя
  rationale: В контексте Дня искупления форма от ענה обозначает добровольное смирение и самоограничение, традиционно связанное с постом. Перевод передаёт покаянный смысл, не сводя выражение исключительно к физическому страданию.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в этот самый день
  rationale: Идиома с עֶצֶם усиливает указание на время; «этот самый день» сохраняет её акцент.
- source_word: וְנִכְרְתָה
  choice: будет отсечён
  rationale: Формула сохраняет образ и юридико-богословскую весомость глагола כרת, не уточняя сверх текста, означает ли наказание смерть, исключение из общины или непосредственный Божий суд.
- source_word: מֵעַמֶּיהָ
  choice: от своего народа
  rationale: Местоименный суффикс женского рода согласован с грамматически женским נֶפֶשׁ, но относится к любому человеку; русское «своего» естественно сохраняет обобщённый смысл.
theological_decisions:
- issue: Смысл предписания «смирять/изнурять себя» в День искупления
  choice: «не смирит себя» в основном тексте
  alternative: «не подвергнет себя лишениям»; «не изнурит себя»
  rationale: Контекст указывает на покаянное самоумаление и самоограничение, традиционно выражаемое постом. «Смирит себя» передаёт внутреннюю и обрядовую сторону выражения, а более буквальная альтернатива отмечена в сноске.
- issue: Характер наказания, выраженного глаголом כרת
  choice: «будет отсечён от своего народа» без дальнейшего уточнения
  alternative: «будет исключён»; «будет истреблён»
  rationale: Еврейский текст здесь не определяет механизм наказания. Образное «отсечён» сохраняет неопределённость между исключением, смертью и непосредственным Божьим судом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром, подходящим для законодательного текста. Синтаксис упрощён без утраты причинной связи, временного усиления и намеренной неопределённости санкции.
