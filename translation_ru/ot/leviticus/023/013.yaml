  source_fidelity: 'Смысловые компоненты переданы верно: хлебное приношение, две десятые доли эфы, мука с маслом, приношение Яхве, формула благоухания и возлияние вина в объёме четверти гина. Однако «при нём» ослабляет прямую суффиксальную связь («его»), а «две десятых эфы» в современном русском требует обозначения долей. סֹלֶת точнее передавать как муку тонкого помола, а не как «лучшую» муку.'
