id: LEV.23.13
reference: Leviticus 23:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: ru
  text: 'И его хлебное приношение: две десятые части эфы муки тонкого помола, смешанной с маслом, — огненное приношение Яхве[a], благоухание, приятное Ему; и его возлияние: четверть гина вина.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приношение, сжигаемое на огне, Яхве».'
    reason: Лексическая альтернатива для אִשֶּׁה — технического жертвенного термина, который может передаваться как «огненное приношение» или «приношение, сжигаемое на огне».
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: И хлебное приношение при нём
  rationale: В жертвенном контексте מִנְחָה обозначает хлебное приношение; местоименный суффикс соотносит его с ягнёнком из предыдущего стиха. «При нём» естественно передаёт сопутствующий характер приношения и не приписывает животному владение им.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: две десятых эфы
  rationale: Буквально «две десятых»; в священническом законодательстве подразумеваются десятые доли эфы. Название древней меры сохранено.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Культовый термин обозначает высококачественную, тонко смолотую муку; «лучшая мука» понятно современному читателю и не добавляет неуказанного вида зерна.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Страдательное причастие передаёт смешивание муки с маслом; выбран естественный современный оборот.
- source_word: אִשֶּׁה לַיהוָה
  choice: огненная жертва Яхве
  rationale: אִשֶּׁה — специальное обозначение жертвы, приносимой на огне. Такой перевод ближе к форме исходного текста, чем «пища», и сохраняет культовый смысл.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное Ему
  rationale: Устойчивая жертвенная формула выражает угодность приношения Богу, сохраняя образ запаха. Местоимение делает русскую формулу естественной без устранения метафоры.
- source_word: וְנִסְכֹּה
  choice: и возлияние при нём
  rationale: נֶסֶךְ обозначает жидкое приношение; суффикс вновь относится к ягнёнку. «Возлияние» — точный и устойчивый русский культовый термин.
- source_word: יַיִן
  choice: вина
  rationale: Прямой эквивалент, поставленный в родительном падеже после пояснительной конструкции.
- source_word: רְבִיעִת הַהִין
  choice: четверть гина
  rationale: Сохранена древняя мера жидкости הִין, а дробь передана естественно по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит тетраграмматон. «Яхве» сохраняет личное заветное имя и соответствует предоставленному актуальному решению, не заменяя его титулом.
- issue: Смысл אִשֶּׁה
  choice: огненная жертва
  alternative: пищевое приношение; жертва, сжигаемая на огне
  rationale: Термин связан с жертвенным огнём, хотя его точная словообразовательная природа обсуждается. «Огненная жертва» сохраняет традиционную культовую категорию и не усиливает образ божественной пищи.
- issue: Смысл רֵיחַ נִיחֹחַ
  choice: благоухание, приятное Ему
  alternative: успокоительное благоухание; приятный аромат
  rationale: Формула передаёт угодность жертвы Яхве. Перевод сохраняет конкретный образ запаха и не сводит его лишь к абстрактному «принятию».
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксический параллелизм двух сопутствующих приношений сохранён; древние единицы «эфа» и «гин» оставлены без пересчёта, чтобы не создавать ложной метрической точности.
