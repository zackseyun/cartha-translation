  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: ru
  text: Священник совершит ими обряд потрясания перед Яхве вместе с хлебом первых плодов и двумя ягнятами. Они будут святыней, посвящённой Яхве и предназначенной для священника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵנִיף
  choice: и священник вознесёт
  rationale: Hiphil глагола נוּף обозначает установленное ритуальное движение или представление жертвы пред Богом. «Вознесёт» естественно сочетается с традиционным термином «приношение возношения», не уточняя форму движения сверх текста.
- source_word: אֹתָם
  choice: их
  rationale: Сохранена местоименная отсылка к двум хлебам из предыдущего стиха; сам стих не требует заменять её уточняющим существительным.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: вместе с хлебом первых плодов
  rationale: עַל буквально может означать «над», но здесь, вероятно, обозначает совместное ритуальное представление. Основной текст передаёт это естественным русским «вместе с», а буквальная пространственная возможность отмечена в сноске.
- source_word: לֶחֶם הַבִּכּוּרִים
  choice: хлеб первых плодов
  rationale: Сохраняется связь хлеба с первыми плодами праздника и достаточно буквально передаётся еврейская именная конструкция.
- source_word: תְּנוּפָה
  choice: приношение возношения
  rationale: Техническое обозначение приношения, ритуально представляемого пред Яхве. Формулировка сохраняет культовый характер термина и его связь с глаголом נוּף.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Обычная культовая формула действия в присутствии Бога; «пред» придаёт тексту достоинство, оставаясь понятным современному читателю.
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: вместе с двумя ягнятами
  rationale: Как и первое עַל, предлог понят как указание на совместное ритуальное представление. Возможное буквальное «над» сохранено в сноске.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: они будут святыней
  rationale: Предикативное קֹדֶשׁ выражает статус посвящённых святынь. Единственное собирательное «святыней» естественно передаёт еврейскую конструкцию при подлежащем во множественном числе.
- source_word: לַיהוָה לַכֹּהֵן
  choice: для Яхве и отданы священнику
  rationale: 'Две конструкции с לְ удерживаются рядом: священный статус относится к Яхве, тогда как доля предназначается священнику. Добавление «отданы» делает отношение понятным по-русски, не превращая священника в равноправного адресата посвящения.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не титулом, поскольку в исходном тексте стоит тетраграмматон.
theological_decisions:
- issue: Отношение святыни к Яхве и священнику
  choice: «святыней для Яхве и отданы священнику»
  alternative: «святыней для Яхве, для священника»
  rationale: Буквальная последовательность двух לְ допускает сжатую формулу, но по смыслу культового установления приношения святы для Яхве и предоставляются священнику. Перевод различает посвящение Богу и право священника, не вводя дополнительного богословского утверждения.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; «Яхве» прямо сохраняет его и соответствует предоставленному решению для данного проекта.
translation_notes:
  register: Современный литературный русский с умеренно торжественной культовой лексикой. Термины «вознесёт», «приношение возношения», «пред» и «святыня» сохраняют сакральный регистр, но синтаксис остаётся ясным для обычного читателя.
