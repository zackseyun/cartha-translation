revisions:
- from: И священник вознесёт их вместе с хлебом первых плодов как приношение возношения пред Яхве[a], вместе с двумя ягнятами. Они будут святыней для Яхве и отданы священнику.
  to: Священник совершит ими обряд потрясания перед Яхве вместе с хлебом первых плодов и двумя ягнятами. Они будут святыней, посвящённой Яхве и предназначенной для священника.
  rationale: 'Исправлена передача технического ритуального термина: «обряд потрясания» отражает נוּף / תְּנוּפָה, не смешивая его с возношением. Два случая עַל сохранены в основном тексте как совместное представление, а пространственная возможность оставлена в сноске. Последняя фраза передаёт священный статус приношений по отношению к Яхве и их предназначение священнику без искусственного противопоставления двух адресатов.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:41:10Z'
review_pass:
  verdict: revise
  source_fidelity: Основная передача двух עַל как «вместе с» обоснованно сохраняет вероятный смысл совместного ритуального представления; сноска надлежащим образом отмечает пространственную альтернативу. Однако «вознесёт» и особенно «приношение возношения» неточно смешивают תְּנוּפָה и נוּף с другим жертвенным термином «возношение»; в данном контексте речь о ритуальном потрясании/представлении.
  naturalness: Фраза «как приношение возношения» неестественна и тавтологична для современного русского. «Совершит ими обряд потрясания» — ясная литературная культовая формула. Заключительную юридико-культовую формулу лучше передать как единый статус святыни, посвящённой Яхве и предназначенной священнику.
  terminology: Яхве передано последовательно. «Хлеб первых плодов», «ягнята» и «святыня» приемлемы. Термин תְּנוּפָה следует передать через «обряд потрясания», а не «приношение возношения».
  issues:
  - severity: medium
    issue: Неточная передача נוּף / תְּנוּפָה словами «вознесёт» / «приношение возношения».
    rationale: Еврейские слова обозначают особое ритуальное потрясание (wave offering), тогда как русское «возношение» обычно вызывает иной ритуальный термин и вводит нежелательное терминологическое смешение.
  - severity: low
    issue: Заключительное «Они будут святыней для Яхве и отданы священнику» стилистически разнородно.
    rationale: «Отданы» добавляет оттенок уже совершённой передачи и не так прямо отражает сжатую формулу принадлежности. Единая конструкция со «святыней» точнее и естественнее.
  revised_text: Священник совершит ими обряд потрясания перед Яхве вместе с хлебом первых плодов и двумя ягнятами. Они будут святыней, посвящённой Яхве и предназначенной для священника.
  revised_footnotes:
