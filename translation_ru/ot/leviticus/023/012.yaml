base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: ru
  text: В тот день, когда вы будете колебать сноп[a], принесите однолетнего ягнёнка без порока во всесожжение Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «омер». Здесь это слово, вероятно, означает сноп, представляемый во время обряда, а не меру объёма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: принесите
  rationale: В контексте жертвоприношения עשה означает совершить или принести жертву; «принесите» естественно передаёт культовый смысл.
- source_word: בְּיוֹם הֲנִיפְכֶם
  choice: В тот день, когда вы будете возносить
  rationale: Временная конструкция передана естественным русским оборотом; форма от נוף обозначает ритуальное движение дара перед Яхве.
- source_word: הָעֹמֶר
  choice: сноп
  rationale: В контексте начатков жатвы עֹמֶר обозначает конкретный сноп, участвующий в обряде, хотя слово также может быть названием меры объёма.
- source_word: כֶּבֶשׂ
  choice: ягнёнка
  rationale: Существительное обозначает молодого барашка; грамматический мужской род русского слова вместе с контекстом достаточно передаёт пол животного.
- source_word: תָּמִים
  choice: без порока
  rationale: В жертвенном законодательстве слово означает отсутствие физического изъяна; это традиционное и понятное русское соответствие.
- source_word: בֶּן שְׁנָתוֹ
  choice: однолетнего
  rationale: Кратко и естественно передаёт еврейский возрастной оборот, не уточняя сверх текста, завершился ли полный год или животное находится на первом году жизни.
- source_word: לְעֹלָה
  choice: во всесожжение
  rationale: עֹלָה — техническое обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» сохраняет категорию жертвы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Исходный текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует предоставленному решению консультационного слоя.
- issue: Характер действия с עֹמֶר
  choice: возносить сноп
  alternative: колебать сноп
  rationale: Глагол נוף обозначает особое ритуальное движение. «Возносить» звучит достойно и понятно, но не задаёт точную траекторию движения, которой исходный текст не объясняет.
translation_notes:
  register: Современный литературный русский с сохранением жертвенной терминологии. Повелительная форма «принесите» естественнее буквального «сделайте». Маркер [a] помещён непосредственно после слова, к которому относится примечание.
