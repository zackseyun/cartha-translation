lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Форма от דבר вводит новый речевой эпизод; «говорил» естественно передаёт устойчивую библейскую формулу и сочетается с последующим изложением прямой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данной вводной формуле еврейский инфинитив «сказать» функционально открывает следующую прямую речь; в современном русском это естественно выражается двоеточием без избыточного «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя, а не титул. «Яхве» сохраняет это различие и является принятой научной реконструкцией произношения; точное древнее произношение не бесспорно, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «И» сохраняет связь с предшествующим повествованием; двоеточие естественно вводит речь, продолжающуюся в следующем стихе.
