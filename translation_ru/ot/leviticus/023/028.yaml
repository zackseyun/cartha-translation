source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: ru
  text: И никакой работы не делайте в этот самый день, ибо это День искупления[a], чтобы было совершено искупление за вас перед Яхве, вашим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «день искуплений». В русском языке название праздника обычно передаётся как «День искупления».'
    reason: 'Лексическая альтернатива: сохранение множественной формы древнееврейского כִּפֻּרִים.'
lexical_decisions:
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: И никакой работы не делайте
  rationale: מְלָאכָה обозначает работу, особенно в запретах, связанных с субботами и праздниками. Русский запретительный императив естественно передаёт юридическую силу древнееврейской конструкции с לֹא и имперфектом 2-го лица множественного числа.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: именно в этот день
  rationale: Идиома подчёркивает сам этот точно определённый день; «именно в этот день» ясно и естественно передаёт усиление.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета; «потому что» недвусмысленно выражает причинную связь.
- source_word: יוֹם כִּפֻּרִים
  choice: День искупления
  rationale: Буквально выражение имеет форму «день искуплений», однако «День искупления» — понятное и закрепившееся название праздника. Множественная форма отмечена в сноске.
- source_word: לְכַפֵּר עֲלֵיכֶם
  choice: чтобы совершить искупление за вас
  rationale: Пиэль כפר в культовом контексте означает совершение искупления, а עַל указывает на тех, ради кого оно совершается. Формулировка не навязывает узкой теории искупления.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: перед Яхве, вашим Богом
  rationale: לִפְנֵי выражает пребывание или действие перед лицом Бога. Имя יהוה передано транслитерацией «Яхве», а אֱלֹהֵיכֶם в формуле завета имеет единственное значение «вашим Богом».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Значение כפר и כִּפֻּרִים
  choice: искупление / День искупления
  alternative: очищение; умилостивление; День искуплений
  rationale: «Искупление» сохраняет широкий культово-примирительный смысл корня в священническом законодательстве, не сводя его только к очищению или умилостивлению. Формальное множественное число названия праздника отражено в сноске.
- issue: Целевое значение לְכַפֵּר
  choice: чтобы совершить искупление
  alternative: для совершения искупления; и будет совершено искупление
  rationale: Инфинитив с לְ естественно выражает цель или назначение дня. Текст не уточняет здесь непосредственного исполнителя действия, поэтому перевод сохраняет неопределённость, не добавляя субъекта.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис сделан понятным для широкого читателя; культовая терминология и личное имя Бога сохранены. Союз «И» отражает связь стиха с предыдущим предписанием.
