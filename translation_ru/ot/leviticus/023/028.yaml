  source_fidelity: 'Основные соответствия точны: запрет на всякую работу, эмфатическое указание на этот день, название праздника, искупление «за вас», а также «перед Яхве, вашим Богом» переданы верно. Однако в исходной формулировке «чтобы совершить искупление» инфинитив после повелительного «не делайте» может быть понят как действие, которое должны совершить адресаты. В еврейском לְכַפֵּר не называет исполнителя; его следует передать без такого синтаксического смещения.'
