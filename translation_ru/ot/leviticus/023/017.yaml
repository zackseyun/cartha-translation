base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: ru
  text: 'Из ваших селений принесите два хлеба для приношения потрясания: они должны быть из двух десятых эфы[a] тонкой муки и испечены с закваской[b], как первые плоды для Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двух десятых»; имеются в виду две десятых части эфы.'
    reason: cultural_note
  - marker: b
    text: То есть испечены из теста с закваской. Еврейский текст прямо указывает, что эти хлебы должны быть квасными.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: из ваших селений
  rationale: מוֹשָׁב обозначает место проживания или поселение; «из ваших селений» естественно передаёт указание принести хлеб от мест, где живёт народ.
- source_word: לֶחֶם תְּנוּפָה
  choice: два хлеба для возношения
  rationale: Хотя לֶחֶם имеет форму единственного числа, числительное שְׁתַּיִם требует значения двух отдельных хлебов. תְּנוּפָה — культовое подношение, представляемое особым движением перед Богом; «возношение» сохраняет технический характер термина.
- source_word: שְׁנֵי עֶשְׂרֹנִים סֹלֶת
  choice: из двух десятых эфы тонкой муки
  rationale: עִשָּׂרוֹן — мера в одну десятую эфы; добавление названия единицы делает подразумеваемую меру ясной. סֹלֶת — очищенная мука высокого качества, переданная как «тонкая мука».
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: испеките их квасными
  rationale: Сочетание указывает, что хлебы должны быть выпечены заквашенными; «квасными» — краткая и традиционно понятная русская передача.
- source_word: בִּכּוּרִים
  choice: как первые плоды
  rationale: Термин обозначает начатки урожая, посвящаемые Богу; «первые плоды» понятно современному читателю и сохраняет образ первого урожая.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל выражает посвящение, а личное имя יהוה передано как «Яхве», без замены титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Культовый термин תְּנוּפָה
  choice: возношение
  alternative: подношение, которым совершают движение перед Господом
  rationale: Краткий технический термин сохраняет ритуальный характер действия, а сноска поясняет его возможный способ, не устраняя неопределённость точного движения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, нормативным тоном. Сохранены культовая терминология и имя Яхве; древняя мера пояснена в сноске.
