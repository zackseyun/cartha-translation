base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: ru
  text: Это для вас суббота полного покоя; смиряйте себя[a]. В девятый день месяца, вечером, от вечера до вечера[b], соблюдайте этот субботний покой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергайте себя лишениям», «изнуряйте себя». Еврейский оборот обозначает покаянное самоумаление, традиционно связанное с постом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от вечера до вечера». Такая формула отражает израильский порядок отсчёта суток.'
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: суббота полного покоя
  rationale: Сочетание однокоренных существительных усиливает значение прекращения труда и покоя. Такой перевод передаёт усилительный смысл и звучит естественно по-русски.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: смиряйте себя
  rationale: В данном обрядовом контексте оборот означает добровольное самоумаление или лишение себя обычных благ, традиционно связанное с постом. «Себя» естественно передаёт возвратное значение נַפְשֹׁתֵיכֶם и не навязывает узкого представления о нематериальной душе.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: вечером девятого дня месяца
  rationale: Передаёт начало соблюдения вечером девятого дня, без добавления отсутствующего в еврейском тексте пояснения о переходе к десятому дню.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: от вечера до вечера
  rationale: Сохраняет буквальную временную формулу и не заменяет «вечер» более узким понятием «закат».
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: соблюдайте вашу субботу
  rationale: 'Передаёт идиоматический смысл глагола שבת при существительном «ваша суббота»: хранить установленный субботний покой. Формулировка сохраняет выраженное в оригинале притяжательное местоимение.'
theological_decisions:
- issue: Смысл самоумаления в обрядовом контексте
  choice: смиряйте себя
  alternative: изнуряйте себя; подвергайте себя лишениям; поститесь
  rationale: Еврейский текст не называет пост прямо, хотя тот традиционно входил в соблюдение Дня искупления. Основной текст сохраняет более широкую заповедь и не сводит её к одной конкретной практике.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным библейским регистром. Синодальное «смиряйте души ваши» не использовано, поскольку в данном обороте נֶפֶשׁ имеет возвратный смысл и не обозначает отдельно нематериальную душу.
