base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: ru
  text: Священник вознесёт сноп пред Яхве для вашего принятия[a]. На следующий день после субботы священник вознесёт его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вы были приняты». Еврейское выражение может обозначать принятие людей через это приношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף / יְנִיפֶנּוּ
  choice: пусть священник вознесёт / пусть священник вознесёт его
  rationale: Порода hифиль глагола נוף обозначает обрядовое движение или представление приношения. «Вознести» естественно для русского библейского регистра и не уточняет сверх текста точный характер движения.
- source_word: הָעֹמֶר
  choice: сноп
  rationale: Здесь עֹמֶר означает принесённый начаток жатвы — сноп, а не только единицу меры.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Оборот обозначает представление приношения в присутствии Бога; «пред» сохраняет краткий и достойный культовый стиль.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, непосредственно стоящее в еврейском тексте, без замены титулом.
- source_word: לִרְצֹנְכֶם
  choice: чтобы вы были приняты Им
  rationale: В данном культовом контексте выражение указывает на благосклонное принятие поклоняющихся посредством приношения. Добавленное «Им» естественно проясняет подразумеваемого деятеля, не меняя смысла.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: на следующий день после субботы
  rationale: Современная и ясная передача конкретного дня, следующего за субботой.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычная русская передача культового служителя כֹּהֵן.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Смысл לִרְצֹנְכֶם
  choice: чтобы вы были приняты Им
  alternative: для вашего принятия; в ваше благоволение
  rationale: Грамматически краткое выражение допускает формулировку «для вашего принятия», но в жертвенном контексте естественнее понимать его как принятие поклоняющихся Богом. Сноска сохраняет формальную альтернативу.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным культовым регистром. Порядок предложений слегка перестроен: подлежащее «священник», названное в конце еврейского стиха, поставлено в начале для ясности; повтор глагола сохранён.'
