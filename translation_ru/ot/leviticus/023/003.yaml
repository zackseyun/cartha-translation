  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽ/יהוָ֔ה בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: ru
  text: Шесть дней работа может выполняться, а в седьмой день — суббота полного покоя[a], священное собрание. Никакой работы не делайте; это суббота, посвящённая Яхве, во всех местах, где вы живёте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «субботний покой» или «суббота покоя». Еврейское сочетание усиливает мысль о полном прекращении работы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во всех ваших поселениях». Еврейское слово может обозначать места проживания или поселения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: можно работать
  rationale: 'Нифаль imperfect допускает пассивно-разрешительный смысл: работа может совершаться. По-русски «можно работать» естественно передаёт эту норму, не превращая её в жёсткое повеление.'
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: суббота полного покоя
  rationale: Сочетание усиливает идею прекращения работы и полного отдыха; формулировка сохраняет как термин «суббота», так и усилительный смысл.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Культовая формула обозначает созванное священное собрание. Этот вариант ясен современному читателю и сохраняет сакральный характер события.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Никакой работы не делайте
  rationale: Прямой запрет во втором лице множественного числа передан ясно и близко к еврейскому порядку понятий.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: это суббота Яхве
  rationale: Русский родительный оборот естественно выражает принадлежность и посвящённость дня Яхве, не уточняя сверх текста, идёт ли речь прежде всего о принадлежности или направленности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано распространённой русской транслитерацией, а не заменено титулом «Господь».
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: во всех местах, где вы живёте
  rationale: מוֹשָׁב может обозначать место проживания или поселение. Описательный русский оборот естественен и ясно передаёт всеобщую территориальную применимость предписания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет это имя, не подменяя его титулом.
- issue: Сила выражения שַׁבַּת שַׁבָּתוֹן
  choice: суббота полного покоя
  alternative: субботний покой; суббота торжественного покоя
  rationale: Выражение подчёркивает полноту прекращения обычной работы, но не требует внесения более поздних богословских уточнений.
- issue: Отношение субботы к Яхве в לַיהוָה
  choice: суббота Яхве
  alternative: суббота для Яхве
  rationale: Родительный оборот сохраняет возможные оттенки принадлежности и посвящённости, не сводя предлог ל исключительно к пользе или цели.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного библейского стиля. Синтаксис сделан ясным для обычного читателя; архаизмы устранены. Контраст между шестью днями труда и седьмым днём передан союзом «а».
