  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: ru
  text: 'И отсчитайте себе со дня, следующего за субботой, — со дня, когда вы принесёте сноп возношения: должно быть семь полных суббот[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь полных недель». Буквально в еврейском тексте: «семь полных суббот».'
    reason: Сохраняется возможное календарное значение множественного שַׁבָּתוֹת как семидневных периодов без устранения буквального смысла основного текста.
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: И отсчитайте
  rationale: В данном предписании форма с союзом выражает повеление; совершенный вид естественно передаёт требование отсчитать установленный период.
- source_word: לָכֶם
  choice: себе
  rationale: Сохраняет личную, отчасти возвратную силу дательного местоимения, не утяжеляя русскую фразу.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: со дня, следующего за субботой
  rationale: Современно и точно выражает исходный момент — день после субботы — и сохраняет культово-календарный термин «суббота».
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: со дня, когда вы принесёте
  rationale: Естественно передаёт указание на день, служащий началом отсчёта.
- source_word: עֹמֶר
  choice: сноп
  rationale: В этом обрядовом контексте слово обозначает приносимый сноп, а не прежде всего меру объёма.
- source_word: הַתְּנוּפָה
  choice: возношения
  rationale: «Сноп возношения» кратко обозначает обрядовое представление дара перед Господом; это понятнее современному читателю, чем буквальное и архаичное «потрясание».
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: семь … суббот
  rationale: Основной текст сохраняет буквальный календарный термин и не разрешает спор заранее в пользу значения «недели».
- source_word: תְּמִימֹת
  choice: полных
  rationale: В обозначении времени слово указывает на целостность и завершённость периодов, а не на нравственное совершенство или отсутствие изъяна.
- source_word: תִּהְיֶינָה
  choice: должно пройти
  rationale: Идиоматический русский оборот передаёт требование, чтобы отсчитываемые периоды были полными, без неестественной кальки «пусть будут».
theological_decisions:
- issue: Значение שַׁבָּת / שַׁבָּתוֹת в календарном предписании
  choice: В основном тексте сохранены «суббота» и «субботы».
  alternative: Передать множественное число как «недели», то есть семидневные периоды.
  rationale: Еврейский текст употребляет именно слово «суббота», а его календарное толкование связано с давним спором о начале отсчёта. Поэтому основной текст сохраняет формулировку источника, а распространённое понимание «недели» вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного предписания. Тире отделяет повторное, уточняющее указание исходного дня. Обрядовый термин передан кратко и без конфессионально окрашенной специальной лексики.
