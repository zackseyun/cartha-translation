  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: ru
  text: '«Обратись к сынам Израиля и скажи им: когда вы войдёте в землю, которую Я даю вам, и будете жать её урожай, принесите священнику сноп[a] начатка вашей жатвы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «омер». Еврейское слово здесь может означать сноп, но также употребляется как особый термин «омер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально передаёт еврейское выражение и сохраняет мужскую форму заветного обращения; это также естественная библейская формула в русском языке.
- source_word: כִּי תָבֹאוּ
  choice: когда вы войдёте
  rationale: כִּי вводит обстоятельство, при наступлении которого действует повеление; «когда» естественно передаёт ожидаемое вступление в землю.
- source_word: הָאָרֶץ אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: в землю, которую Я даю вам
  rationale: «Земля» сохраняет географический и заветный оттенок, а настоящее время «даю» отражает причастную форму נֹתֵן и изображает дарование как совершающееся действие.
- source_word: וּקְצַרְתֶּם אֶת־קְצִירָהּ
  choice: и будете жать её урожай
  rationale: Сохраняет однокоренное сочетание глагола жатвы и существительного קָצִיר, при этом звучит понятно по-русски.
- source_word: וַהֲבֵאתֶם
  choice: принесите
  rationale: В последовательности предписания форма имеет повелительный смысл; русский императив передаёт его прямо и естественно.
- source_word: עֹמֶר
  choice: сноп
  rationale: В данном сельскохозяйственном и обрядовом контексте конкретное значение «сноп» наиболее понятно; техническое обозначение «омер» отмечено в сноске.
- source_word: רֵאשִׁית קְצִירְכֶם
  choice: первых плодов вашей жатвы
  rationale: רֵאשִׁית обозначает начальную, посвящаемую Богу часть урожая; «первые плоды» сохраняет и временной, и культовый смысл.
- source_word: הַכֹּהֵן
  choice: священнику
  rationale: Стандартное русское соответствие культовому термину כֹּהֵן.
theological_decisions:
- issue: Гендерно маркированное заветное обращение
  choice: сынам Израиля
  alternative: израильтянам / народу Израиля
  rationale: Основной текст сохраняет явно мужскую форму исходного выражения, не заменяя её нейтральной, хотя в данном законодательном обращении она обозначает общину Израиля.
- issue: Культовый термин עֹמֶר
  choice: сноп
  alternative: омер
  rationale: Контекст говорит о начатке жатвы, который приносят священнику, поэтому выбран конкретный сельскохозяйственный смысл. Возможность прочтения как технического термина сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис упрощён без устранения последовательности условия и повеления; местоимение «Я» написано с прописной буквы как традиционное обозначение говорящего Бога.
