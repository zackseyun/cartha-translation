  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: ru
  text: А всякого, кто станет выполнять какую-либо работу в этот самый день, Я истреблю — этого человека — из среды его народа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я отсеку этого человека от его народа». Еврейский глагол буквально означает «погубить, истребить», а не обычное «отсечь», хотя в данном контексте он также выражает устранение человека из народа как наказание.'
    reason: Альтернативная контекстуальная передача судебной формулы; поясняется отличие еврейского глагола אבד от обычного для выражения «отсечь» глагола כרת.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: всякого / его
  rationale: В законодательной прозе נֶפֶשׁ обозначает отдельного человека, а не «душу» как нематериальную часть человека. Русская конструкция «всякого, кто… его» естественно передаёт оба употребления.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: будет делать какую-либо работу
  rationale: Сочетание עשה с מְלָאכָה означает совершение работы; «какую-либо» передаёт всеохватность כָּל, а будущее время уместно в формулировке предписания и его последствия.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в этот самый день
  rationale: Оборот עֶצֶם הַיּוֹם усиливает указание на конкретный день; «этот самый день» сохраняет эмфазу.
- source_word: וְהַאֲבַדְתִּי
  choice: Я истреблю
  rationale: Каузативная форма Hiphil глагола אבד означает «погубить, уничтожить, истребить». «Истреблю» передаёт сильное значение глагола и естественно сочетается с «из среды народа».
- source_word: מִקֶּרֶב עַמָּהּ
  choice: из среды его народа
  rationale: Формула обозначает удаление человека из сообщества вследствие суда. Женский суффикс грамматически согласован с נֶפֶשׁ; в русском смысловой мужской род служит обобщённым обозначением человека.
theological_decisions:
- issue: Характер наказания в וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ
  choice: Я истреблю из среды его народа
  alternative: Я удалю / отсеку его от его народа
  rationale: В еврейском тексте стоит Hiphil от אבד («погубить, истребить»), а не обычный для формулы «отсечь» глагол כרת. Основной текст сохраняет лексическую силу אבד, тогда как примечание указывает на возможный контекстуальный смысл удаления из народа, не определяя точный способ наказания.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис ясен для широкого круга читателей; прописное «Я» указывает на говорящего Бога в принятой русской библейской традиции.
