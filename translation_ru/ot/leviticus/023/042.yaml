  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: ru
  text: Семь дней живите в шалашах[a]; каждый уроженец Израиля должен жить в шалашах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во временных укрытиях»; еврейское слово обозначает временные праздничные шалаши. Традиционный перевод — «в кущах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: в шалашах
  rationale: Существительное סֻכּוֹת обозначает временные укрытия, сооружаемые для праздника. «Шалаши» передаёт конкретный образ естественным современным русским языком; традиционное «кущи» сегодня архаично и менее понятно.
- source_word: תֵּשְׁבוּ
  choice: живите
  rationale: В контексте пребывания в жилище глагол ישׁב означает «жить, обитать», а не буквально «сидеть». Форма повелительного наклонения естественно передаёт предписание, выраженное древнееврейским имперфектом.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: В русском языке продолжительность естественно выражается винительным падежом без предлога.
- source_word: כָּל הָאֶזְרָח
  choice: каждый коренной житель
  rationale: אֶזְרָח обозначает коренного члена общины в противопоставлении пришельцу. «Коренной житель» сохраняет этот смысл и не привносит позднейших политико-правовых представлений, связанных со словом «гражданин».
- source_word: בְּיִשְׂרָאֵל
  choice: Израиля
  rationale: Родительная конструкция «житель Израиля» естественно обозначает принадлежность к израильской общине и передаёт смысл древнееврейского выражения без неуклюжего «житель в Израиле».
- source_word: יֵשְׁבוּ
  choice: должен жить
  rationale: Повтор глагола ישׁב сохраняется в том же значении проживания. Конструкция «должен жить» ясно передаёт обязательность общего предписания применительно к каждому человеку.
theological_decisions:
- issue: Объём значения грамматически мужского единственного הָאֶזְרָח
  choice: каждый коренной житель
  alternative: каждый коренной мужчина
  rationale: Мужской род существительного имеет обобщающее значение и сам по себе не ограничивает предписание только мужчинами. Русское «житель» сохраняет грамматическую форму источника, не добавляя такого ограничения.
translation_notes:
  register: Современный литературный русский язык с ясным предписывающим тоном. «Шалаши» выбраны вместо архаичного «кущи»; параллелизм двух частей и повтор ключевого глагола сохранены.
