review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: временная конструкция, запрет выжать поле до края, запрет собирать оставшееся, адресаты и заключительная формула сохранены. Однако «не дожинай до конца край» синтаксически шероховато и может звучать так, будто «край» является объектом дожинания; более ясная перестройка точнее выражает запрет снимать урожай с края поля полностью. «Остатки жатвы» несколько широко и может быть понято как любые отходы, тогда как לקט обозначает оставшееся для подбирания после основной уборки.'
  naturalness: Нужна небольшая стилистическая правка. «Не убирай урожай с края своего поля до конца» естественно для современного литературного русского. «Оставшиеся после жатвы колосья» ясно передаёт сельскохозяйственный смысл, не прибегая к менее прозрачному для многих читателей слову «подбор». Намеренная смена множественного числа на единственное в обращении сохранена.
  terminology: '«Яхве» адекватно передаёт יהוה. Для גֵר в основном тексте допустимо «чужеземец, живущий среди вас», а примечание верно уточняет постоянное проживание и правовую защиту. Формулировку примечания следует лишь сделать менее этнически обобщающей: исходный термин описывает статус проживания, а не обязательно происхождение как таковое.'
