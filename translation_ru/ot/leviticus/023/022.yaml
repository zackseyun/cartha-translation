source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: ru
  text: Когда вы будете убирать урожай на своей земле, не убирай урожай с края своего поля до конца[a] и не подбирай оставшиеся после жатвы колосья; оставь их бедному и чужеземцу, живущему среди вас[b]. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угол своего поля». Еврейское слово может обозначать край, сторону или угол.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришельцу». Еврейское слово обозначает иноземца, постоянно живущего среди израильтян и находящегося под защитой их закона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת־קְצִיר אַרְצְכֶם
  choice: Когда вы будете жать урожай на своей земле
  rationale: Инфинитивная конструкция вводит временное обстоятельство; форма второго лица множественного числа и земледельческий контекст переданы естественно для современного русского языка.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ
  choice: не дожинай до конца край своего поля
  rationale: Порода пиэль глагола כלה выражает доведение действия до конца, а פאה обозначает край, сторону или угол поля. Перевод сохраняет запрет убирать урожай до самой границы участка.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: и не подбирай остатки своей жатвы
  rationale: לקט обозначает рассыпавшееся или оставшееся после основной жатвы, которое можно подобрать. «Остатки жатвы» понятно современному читателю и не сужает значение исключительно до колосьев.
- source_word: לֶעָנִי
  choice: бедному
  rationale: עני здесь обозначает экономически нуждающегося и социально уязвимого человека.
- source_word: וְלַגֵּר
  choice: чужеземцу, живущему среди вас
  rationale: גר — не случайный незнакомец, а человек иноземного происхождения, постоянно живущий в обществе Израиля. Развёрнутая передача делает этот правовой статус понятным без архаизма.
- source_word: תַּעֲזֹב אֹתָם
  choice: оставь их
  rationale: עזב в данном контексте означает намеренно оставить урожайные остатки для других; местоимение множественного числа сохраняет форму еврейского текста.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Я — Яхве, ваш Бог
  rationale: Личное имя יהוה передано как «Яхве», а заключительная формула сохранена краткой и торжественной.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо стоит тетраграмматон — личное заветное имя Бога; транслитерация не подменяет его титулом.
- issue: Социально-правовой смысл גֵּר
  choice: чужеземец, живущий среди вас
  alternative: пришелец
  rationale: Выбранная формулировка показывает, что речь идёт об иноземце, постоянно живущем в земле Израиля и находящемся под защитой её закона, не привязывая термин к современным миграционным категориям.
- issue: Переход от множественного числа к единственному
  choice: 'сохранить переход: «вы будете… не дожинай… ваш Бог»'
  alternative: унифицировать всё обращение во множественном числе
  rationale: Еврейский текст переходит от обращения ко всему народу к обращению к отдельному землевладельцу, а затем вновь к общине. Этот значимый правовой ракурс сохранён, хотя по-русски смена числа заметна.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис остаётся ясным и прямым; архаичное «пришелец» вынесено в примечание из-за возможной двусмысленности в современном употреблении. Смена числа в обращении намеренно сохраняет структуру еврейского текста.
