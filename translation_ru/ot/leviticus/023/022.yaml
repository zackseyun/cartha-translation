- from: Когда вы будете жать урожай на своей земле, не дожинай до конца край своего поля[a] и не подбирай остатки своей жатвы; оставь их бедному и чужеземцу, живущему среди вас[b]. Я — Яхве, ваш Бог.
  to: Когда вы будете убирать урожай на своей земле, не убирай урожай с края своего поля до конца[a] и не подбирай оставшиеся после жатвы колосья; оставь их бедному и чужеземцу, живущему среди вас[b]. Я — Яхве, ваш Бог.
  rationale: Правка устраняет две небольшие лексико-синтаксические неясности, сохраняя содержание, законодательный регистр и намеренный переход еврейского текста от множественного обращения к единственному. Примечания оставлены при тех же смысловых опорах; b уточнено в соответствии со статусным значением גֵר.
