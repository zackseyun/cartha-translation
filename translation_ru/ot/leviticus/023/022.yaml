  - severity: low
    issue: «Остатки своей жатвы» недостаточно конкретно передаёт לקט.
    rationale: Слово может обозначать отходы или общий остаток работ, тогда как в контексте речь о том, что остаётся на поле после основной уборки и что можно подобрать.
