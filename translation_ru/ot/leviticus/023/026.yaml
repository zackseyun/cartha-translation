lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В формуле введения прямой речи глагол דבר естественно передаётся современным русским «сказал»; последующее לֵאמֹר не требует отдельного буквального соответствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно выражает адресата речи без отдельного перевода предлога אֶל.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Формульный инфинитив вводит содержание следующей речи; в современном русском его функцию естественно и без избыточного «говоря» передаёт двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как собственное имя. «Яхве» сохраняет это имя, не заменяя его титулом; вариант «Иегова» отражён в примечании как традиционная альтернативная форма.
translation_notes:
  register: Современный литературный русский язык. Краткая повествовательная формула передана естественно и торжественно; двоеточие вводит речь, начинающуюся в следующем стихе.
