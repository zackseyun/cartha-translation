base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: ru
  text: 'Скажи сынам Израиля: «В седьмом месяце, в первый день месяца, пусть у вас будет торжественный покой, памятное воспоминание громкого сигнального звука[a], священное собрание».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «памятное воспоминание трубных звуков»; еврейское слово может обозначать громкий сигнальный звук вообще, в том числе возглас, звук рога или трубы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный родственный образ еврейского выражения и его собирательное значение для заветного сообщества; форма естественна для достойного библейского регистра.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: в седьмой месяц
  rationale: Прямо передаёт календарное обстоятельство времени.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Еврейская идиома буквально говорит «в один [день] месяца», то есть в первый день; русская формулировка делает подразумеваемое слово явным.
- source_word: יִהְיֶה לָכֶם
  choice: пусть у вас будет
  rationale: Естественно передаёт предписывающее значение будущей формы в законодательном контексте, не превращая её в прямой императив действия.
- source_word: שַׁבָּתוֹן
  choice: торжественный покой
  rationale: Передаёт особое праздничное прекращение обычного труда и отличает термин от простого наименования субботы.
- source_word: זִכְרוֹן תְּרוּעָה
  choice: памятное возвещение трубным звуком
  rationale: Передаёт тесную связь существительных и культовый характер памятного обряда; единственное число «звуком» не навязывает конкретное число сигналов.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Естественно по-русски передаёт созванное для священной цели собрание, сохраняя литургический регистр.
theological_decisions:
- issue: Характер תְּרוּעָה в названии праздника
  choice: трубный звук
  alternative: громкий возглас, клич или иной громкий сигнальный звук
  rationale: В календарно-богослужебном контексте вероятен звук рога или трубы, однако сам еврейский термин шире; эта неоднозначность сохранена в примечании.
- issue: Смысл זִכְרוֹן
  choice: памятное возвещение
  alternative: напоминание или памятное установление
  rationale: Перевод не уточняет, кому именно служит напоминание — Богу, народу или обоим, поскольку исходный текст этого не определяет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным законодательным и богослужебным звучанием. Кавычки обозначают содержание повеления после вводного «Скажи»; синтаксис остаётся ясным для обычного читателя.
