lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным вау вводит новый речевой акт. В устойчивой русской формуле «сказал Моисею» глагол звучит естественнее, чем более буквальное «говорил к Моисею».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: Русский дательный падеж естественно выражает адресата при глаголе «сказать».
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени; в данном контексте употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: передано двоеточием
  rationale: Вводную функцию еврейского инфинитива перед последующей прямой речью в современном русском естественно передаёт двоеточие; отдельное «говоря» было бы избыточным и менее современным.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Исходный текст содержит личное имя YHWH. Форма «Яхве» является современной научно обоснованной передачей; «Иегова» отражает позднюю гибридную вокализацию, а «ГОСПОДЬ» заменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык. Сохранена торжественная библейская простота формулы, но буквальное «говоря» заменено нормативным двоеточием. Маркер сноски поставлен непосредственно после имени, к которому относится.
