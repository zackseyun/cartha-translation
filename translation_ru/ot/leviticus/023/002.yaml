source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: ru
  text: '«Обратись к сынам Израиля[c] и скажи им: установленные времена Яхве[a], которые вы должны провозглашать как священные собрания[b], — вот Мои установленные времена».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенные сроки», «установленные праздники». Еврейское слово обозначает установленные священные случаи вообще, а не только праздничные трапезы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «священными созывами».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сынам Израиля»; это принятое заветное обозначение народа Израиля в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: В данном предписании глагол означает повеление обратиться к народу с речью; по-русски «обратись» естественно вводит последующее «скажи им» и избегает тяжеловесного повтора «говори… и скажи».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный мужской образ стандартного заветного наименования, которое в контексте относится ко всему народу Израиля.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Прямо передаёт обычную древнееврейскую формулу введения речи.
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: установленные времена / Мои установленные времена
  rationale: מוֹעֵד обозначает назначенное время или установленный случай; широкий термин уместен, поскольку далее в главе к ним отнесена и суббота, а не только праздники.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: которые вы должны объявлять
  rationale: קרא здесь означает публично объявлять или провозглашать; модальная конструкция естественно передаёт силу предписания.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: священными собраниями
  rationale: Передаёт культовое выражение о созываемых, посвящённых Богу собраниях современным и понятным русским языком.
- source_word: אֵלֶּה הֵם
  choice: вот
  rationale: Русская указательная конструкция «вот» естественно сохраняет подчёркнутое отождествление, выраженное сочетанием указательного и личного местоимений.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в тексте и не подменяет его титулом.
- issue: Следует ли сужать значение מוֹעֲדֵי до праздников
  choice: установленные времена
  alternative: праздники; праздничные дни
  rationale: Более широкая передача сохраняет смысловую область еврейского слова и не исключает субботу, упомянутую непосредственно далее.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля
  rationale: Сохранён мужской образ исходного заветного выражения, при этом сноска поясняет его корпоративный охват.
translation_notes:
  register: 'Современный литературный русский язык с достоинством законодательной речи. Синтаксис сохраняет исходный порядок: сначала названы времена Яхве, затем дано относительное определение и в конце — подчёркнутое отождествление с Его установленными временами. Заглавная буква в «Мои» обозначает речь Бога согласно русской издательской традиции.'
