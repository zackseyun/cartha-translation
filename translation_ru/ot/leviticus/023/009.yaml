  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH); традиционно передаётся «Господь».
    reason: Указывает исходную форму Божьего имени и широко известный традиционный вариант передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным וַ вводит новое речевое событие. В современной русской библейской прозе «сказал» естественно передаёт формулу וַיְדַבֵּר ... לֵאמֹר без тяжеловесного удвоения «говорил... говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте, а не заменяет его титулом.
- source_word: אֶל
  choice: '[передано управлением: «сказал Моисею»]'
  rationale: Еврейский предлог обозначает адресата речи; по-русски это естественно выражается дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисею
  rationale: Общепринятая русская форма имени Моисей, поставленная в дательном падеже как адресат речи.
- source_word: לֵאמֹר
  choice: '[передано двоеточием]'
  rationale: Инфинитив «сказать» в устойчивой формуле вводит последующую прямую речь. Поскольку содержание речи следует в следующем стихе, современное русское двоеточие передаёт эту функцию естественнее, чем буквальное «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя. «Яхве» сохраняет это имя и отличает его от титула «Господь»; вариант «Иегова» менее точно отражает наиболее вероятное древнее произношение.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной повествовательной формулой. Двоеточие сохраняет незавершённость формулы и вводит речь, начинающуюся в следующем стихе.
