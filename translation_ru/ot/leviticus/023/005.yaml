  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: ru
  text: В первый месяц, в четырнадцатый день месяца, в сумерках[a] — Пасха, посвящённая Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между вечерами» — еврейское выражение, обозначающее сумеречное время около захода солнца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пасхальное приношение»; «пасхальная жертва».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: В первый месяц
  rationale: В календарном контексте חֹדֶשׁ означает «месяц», а הָרִאשׁוֹן указывает на первый месяц священного года.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: в четырнадцатый день месяца
  rationale: Слово «день» подразумевается еврейской формулой даты и добавлено для естественного и точного русского выражения.
- source_word: בֵּין הָעַרְבָּיִם
  choice: в сумерках
  rationale: Буквально выражение означает «между вечерами» и обозначает сумеречное время около захода солнца; буквальная форма сохранена в сноске ввиду её значения для толкования времени Пасхи.
- source_word: פֶּסַח
  choice: Пасха
  rationale: Термин может обозначать как пасхальное празднование, так и пасхальную жертву. В календаре священных времён более широкое «Пасха» уместно в основном тексте, а жертвенный смысл сохранён в сноске.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל выражает посвящённость или направленность. «В честь Яхве» естественно по-русски передаёт смысл принадлежности праздника Богу, не заменяя личное имя титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон — личное заветное имя Бога; транслитерация «Яхве» сохраняет имя, не подменяя его титулом.
- issue: Значение פֶּסַח в культовом контексте
  choice: Пасха
  alternative: пасхальное приношение; пасхальная жертва
  rationale: Контекст перечня установленных времён поддерживает общее название праздника, однако еврейское слово допускает также значение обряда или жертвенного животного; эта неоднозначность отмечена, а не устранена.
- issue: Связь לַיהוָה с Пасхой
  choice: в честь Яхве
  alternative: Яхве; для Яхве
  rationale: Перевод передаёт посвящённость Пасхи Яхве, избегая неестественной русской конструкции и не уточняя сверх текста, идёт ли речь прежде всего о принадлежности, адресате или назначении.
translation_notes:
  register: Современный литературный русский язык; сохранена краткая безглагольная структура еврейского текста. Тире естественно оформляет именное сообщение. «Пасха» написана с прописной буквы как название праздника; личное имя יהוה передано как «Яхве».
