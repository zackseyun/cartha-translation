  naturalness: Предлагаемая правка сохраняет современный литературный русский и сдержанно-торжественный законодательный регистр. «Объявите священное собрание» естественно в контексте установления праздника; «пусть оно будет у вас» несколько формульно, но уместно и передаёт исходную конструкцию.
  terminology: «Священное собрание» — удачное понятное соответствие מִקְרָא קֹדֶשׁ. «Обычная работа» корректно передаёт ограниченный характер מְלֶאכֶת עֲבֹדָה и не расширяет запрет до всякой деятельности. «Установление на все времена» приемлемо для חֻקַּת עוֹלָם.
