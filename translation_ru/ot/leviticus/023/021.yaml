  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: ru
  text: В тот самый день объявите священное собрание[a]; пусть оно будет у вас. Никакой обычной работы[b] не делайте. Это установление на все времена[c] во всех местах вашего жительства, из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провозгласите священное собрание» или «объявите священный созыв». Еврейское выражение обозначает официально объявленное священное собрание.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «никакой работы-службы»; то есть никакой обычной трудовой работы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вечное установление» или «постоянное установление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: созовите
  rationale: В данном культовом контексте глагол קרא означает официальный призыв к собранию или его публичное объявление. В сочетании с מִקְרָא קֹדֶשׁ русское «созовите» естественно передаёт практический смысл выражения.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в тот самый день
  rationale: Оборот подчёркивает именно этот, точно указанный день; «тот самый день» сохраняет усиление и звучит естественно по-русски.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое культовое выражение обозначает официально созванное собрание, отделённое для священной цели. «Священное собрание» понятно современному читателю и сохраняет религиозный характер термина.
- source_word: יִהְיֶה לָכֶם
  choice: передано конструкцией «созовите священное собрание»
  rationale: Еврейская предикация буквально означает «будет у вас / для вас». В русском объединение с повелительной конструкцией позволяет без неестественного повтора передать, чем должен быть этот день для общины.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Сочетание относится к обычному служебному или трудовому занятию, а не обязательно ко всякому возможному действию. Такой перевод сохраняет более узкий объём запрета.
- source_word: לֹא תַעֲשׂוּ
  choice: не делайте
  rationale: Прямой запрет передан ясной формой повелительного наклонения, уместной в русском законодательном контексте.
- source_word: חֻקַּת עוֹלָם
  choice: установление на все времена
  rationale: Формула указывает на длительную, продолжающуюся обязательность установления. Перевод сохраняет временную открытость עוֹלָם, не превращая её без пояснения в отвлечённое метафизическое утверждение.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: во всех местах вашего жительства
  rationale: Фраза распространяет установление на все места проживания народа; перевод сохраняет распределительное значение כָּל.
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Естественная русская формула ясно выражает продолжающуюся применимость установления к последовательным поколениям.
theological_decisions:
- issue: Объём запрета на работу в праздничный день
  choice: «никакой обычной работы»
  alternative: «никакой работы»; «никакой тяжёлой работы»; «никакой служебной работы»
  rationale: Еврейское כָּל מְלֶאכֶת עֲבֹדָה обычно обозначает обычный труд или работу-службу, а не безусловный запрет любого действия. Перевод не приравнивает эту формулу к более широкому запрету без опоры в тексте.
- issue: Продолжительность действия установления
  choice: «на все времена»
  alternative: «вечное»; «постоянное»
  rationale: עוֹלָם в правовой формуле выражает непрерывную обязательность для последующих поколений, но само по себе допускает различную нюансировку. Основной текст и сноска сохраняют эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным законодательным регистром. Синтаксис упрощён ради ясности, при этом сохранены временное усиление, культовый термин, географический охват и формула преемственности поколений.
