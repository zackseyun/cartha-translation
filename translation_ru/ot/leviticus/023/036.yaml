  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: ru
  text: Семь дней приносите огненную жертву Яхве. В восьмой день будет у вас священное собрание, и принесите огненную жертву Яхве. Это торжественное собрание; никакой обычной работы не делайте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: приносите / принесите
  rationale: В породе хифиль корень קרב в культовом контексте означает представлять или приносить жертву; русское «приносить» естественно и сохраняет жертвенный смысл.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Стандартный священнический термин обозначает жертву, предаваемую огню. «Огненная жертва» точнее передаёт форму еврейского термина, чем возможное «пищевое приношение», и не ограничивает его хлебной жертвой.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל выражает направленность или посвящение, что по-русски естественно передаётся дательным падежом; личное имя יהוה передано как «Яхве».
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое праздничное выражение обозначает созванное священное собрание; этот вариант точен и понятен современному читателю.
- source_word: עֲצֶרֶת
  choice: заключительное праздничное собрание
  rationale: Слово обозначает особое собрание с прекращением обычных занятий и в данном контексте завершает праздничный цикл; перевод передаёт как собирательный, так и заключительный оттенок.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Формула запрещает повседневный труд в праздничный день, а не буквально всякую деятельность; «обычная работа» ясно передаёт это различие.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: в восьмой день
  rationale: Прямой и естественный перевод временного выражения.
- source_word: יִהְיֶה לָכֶם
  choice: пусть у вас будет
  rationale: Передаёт конструкцию היה + ל и её предписывающую силу естественным русским оборотом.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: В русском языке винительный времени без предлога естественно выражает продолжительность.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» прямо сохраняет его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Смысл עֲצֶרֶת
  choice: заключительное праздничное собрание
  alternative: торжественное собрание; день покоя
  rationale: Контекст восьмого дня поддерживает заключительный характер собрания, однако значение прекращения обычных занятий отдельно сохраняется в последующем запрете работы; перевод не вводит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным культовым регистром. Повеления переданы ясно и без архаизмов; повтор исходного текста сохранён.
