review_pass:
  verdict: revise
  source_fidelity: 'Перевод в целом верно передаёт последовательность предписаний, повтор жертвенного термина, восьмой день, священное собрание и запрет на обычный труд. Однако עֲצֶרֶת не следует безоговорочно переводить как «заключительное»: хотя в данном контексте это восьмой день, само слово прежде всего обозначает особое торжественное/священное собрание, а этимология и точный оттенок оспариваются. Добавление «заключительное» в основной текст сужает значение сильнее, чем позволяет лексема.'
  naturalness: Текст звучит естественно на современном литературном русском. «Пусть у вас будет» несколько тяжеловесно в законодательной формуле; «будет у вас» сохраняет предписывающую конструкцию и читается более плавно. «Огненная жертва» понятна, но может быть воспринята как жертва, характеризуемая огнём, поэтому полезна краткая сноска о техническом культовом значении.
  terminology: «Яхве» последовательно и точно передаёт тетраграмматон. «Священное собрание» — удачный современный эквивалент מִקְרָא קֹדֶשׁ. Для עֲצֶרֶת предпочтительно «торжественное собрание» без добавления «заключительное». «Обычная работа» хорошо передаёт מְלֶאכֶת עֲבֹדָה как не всякую деятельность, а обычный/трудовой вид работы.
  issues:
  - severity: medium
    issue: «Заключительное праздничное собрание» для עֲצֶרֶת
    rationale: Восьмой день контекстуально завершает цикл, но «заключительное» не является прямым, бесспорным значением עֲצֶרֶת и вносит интерпретацию в основной текст. Следует сохранить более нейтральное «торжественное собрание».
  - severity: low
    issue: Формула «пусть у вас будет»
    rationale: Она допустима, но «будет у вас» более компактно и естественно для предписывающего законодательного регистра, не меняя смысла.
