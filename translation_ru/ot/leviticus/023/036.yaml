revisions:
- from: Семь дней приносите огненную жертву Яхве. В восьмой день пусть у вас будет священное собрание, и принесите огненную жертву Яхве. Это заключительное праздничное собрание; никакой обычной работы не делайте.
  to: Семь дней приносите огненную жертву Яхве. В восьмой день будет у вас священное собрание, и принесите огненную жертву Яхве. Это торжественное собрание; никакой обычной работы не делайте.
