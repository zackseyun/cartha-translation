source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: ru
  text: Отмечайте его как праздник в честь Яхве семь дней в году. Это вечное установление[a] для всех ваших поколений; в седьмом месяце отмечайте его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоянное установление»; или: «установление навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: празднуйте
  rationale: Глагол חָגַג обозначает совершение или празднование праздника, в особенности паломнического. Современное «празднуйте» естественно передаёт действие; повтор глагола сохранён.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение отсылает к уже названному в контексте празднику; добавлять существительное не требуется.
- source_word: חַג
  choice: праздник
  rationale: חַג — праздник, часто паломнический. Русское «праздник» ясно и уместно в культовом контексте.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Предлог ל выражает посвящение: праздник совершается в честь Яхве. В конструкции «праздник Яхве» это естественно передано родительным падежом.'
- source_word: שִׁבְעַת יָמִים בַּשָּׁנָה
  choice: семь дней в году
  rationale: Сохраняется близкая к еврейскому тексту формулировка длительности и ежегодного совершения праздника.
- source_word: חֻקַּת עוֹלָם
  choice: постановление навеки
  rationale: חֻקָּה означает обязательное предписание, а עוֹלָם — неограниченную или длительную продолжительность в данном заветно-правовом контексте. Формулировка сохраняет силу исходного выражения, не превращая её в отвлечённое утверждение о метафизической вечности.
- source_word: לְדֹרֹתֵיכֶם
  choice: для всех ваших поколений
  rationale: Так естественно передаётся продолжающаяся обязательность постановления для сменяющих друг друга поколений.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: в седьмом месяце
  rationale: Прямое и ясное обозначение времени праздника.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Смысл עוֹלָם в культовом законодательстве
  choice: навеки
  alternative: вечное; постоянное
  rationale: «Навеки» сохраняет сильное временное значение слова и традиционный юридико-заветный оттенок, не разъясняя в самом тексте пределы действия постановления.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Императив «празднуйте» естественно передаёт еврейские формы предписания. Повтор корня חָגַג сохранён. Формулировка «праздник Яхве» передаёт посвящение праздника Богу без тяжеловесного «праздник для Яхве».
