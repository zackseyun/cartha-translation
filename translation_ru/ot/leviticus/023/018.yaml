  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ru
  text: Вместе с хлебами[a] принесите семь годовалых ягнят-самцов без порока, одного быка из стада и двух баранов. Они будут всесожжением Яхве, с полагающимися к ним хлебным приношением и возлияниями, — огненной жертвой[b], благоуханием, приятным Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помимо хлебов». Еврейский предлог здесь может обозначать сопровождение или добавление, а не положение поверх хлебов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приношением, сжигаемым на огне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: принесите
  rationale: В породе гифиль глагол קרב в жертвенном контексте означает представить или принести жертву; «принесите» естественно и точно по-русски.
- source_word: עַל הַלֶּחֶם
  choice: вместе с хлебами
  rationale: Предлог עַל здесь выражает сопровождение или добавление, а не физическое положение сверху; множественное «хлебами» учитывает два хлеба из предыдущего стиха.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: семь однолетних ягнят без порока
  rationale: כֶּבֶשׂ обозначает ягнёнка мужского пола, что в русском обычно подразумевается словом «ягнёнок»; תָּמִים — установленное требование отсутствия изъяна, а בֶּן־שָׁנָה — возрастная формула.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: одного быка из крупного скота
  rationale: Формула פַר בֶּן־בָּקָר указывает на быка из стада крупного скота; перевод не вводит более точный возраст, чем позволяет выражение.
- source_word: וְאֵילִם שְׁנָיִם
  choice: и двух баранов
  rationale: אַיִל в жертвенной терминологии означает взрослого самца овцы, то есть барана.
- source_word: יִהְיוּ עֹלָה לַיהוָה
  choice: Они будут всесожжением Яхве
  rationale: עֹלָה — техническое обозначение жертвы всесожжения и употреблено собирательно для перечисленных животных; יהוה передано как личное имя «Яхве».
- source_word: וּמִנְחָתָם וְנִסְכֵּיהֶם
  choice: вместе с хлебным приношением и возлияниями к ним
  rationale: מִנְחָה в данном культовом контексте — приношение из муки/зерна; «хлебное приношение» является понятным традиционным термином. Суффиксы связывают сопутствующие приношение и возлияния с животными, что передано словами «к ним».
- source_word: אִשֵּׁה
  choice: огненной жертвой
  rationale: Термин связан с жертвой, предаваемой огню. Это сохраняет явно присутствующий в еврейском образ и не вводит спорное толкование «пища».
- source_word: רֵיחַ נִיחֹחַ
  choice: благоуханием, приятным
  rationale: Устойчивая жертвенная формула означает приятный, умиротворяющий аромат; выбран естественный и достоинственный русский эквивалент.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет Тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер אִשֵּׁה
  choice: огненная жертва
  alternative: пищевое приношение
  rationale: Еврейский термин обозначает жертву, совершаемую посредством огня; перевод сохраняет ритуальный способ и избегает богословски нагруженного представления о пище для Бога.
translation_notes:
  register: Современный литературный русский с сохранением принятой библейской жертвенной терминологии. Синтаксис упрощён для ясности, но собирательное единственное число «всесожжением» и неоднозначность предлога עַל сохранены; все сноски отмечены в основном тексте.
