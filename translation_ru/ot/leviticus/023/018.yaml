    issue: Не обозначен мужской пол семи ягнят.
    rationale: כְּבָשִׂים — мужская форма, противопоставленная обозначению самки; русское «ягнята» не обязательно мужского пола. «Ягнят-самцов» прямо передаёт исходное различие.
  - severity: medium
    issue: Оборот «возлияниями к ним» неестественен и неудачно передаёт суффикс -הֶם.
    rationale: Суффиксы в «их хлебном приношении и их возлияниях» связывают сопутствующие дары с перечисленными животными. «С полагающимися к ним хлебным приношением и возлияниями» выражает эту связь по-русски без изменения смысла.
  - severity: low
    issue: «Бык из крупного скота» стилистически тяжеловесно.
    rationale: «Бык из стада» сохраняет значение בֶּן־בָּקָר и естественнее для современного литературного русского.
