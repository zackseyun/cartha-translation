  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: ru
  text: Так Моисей объявил сынам Израиля установленные времена Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам»; традиционно: «детям Израиля». Буквально с еврейского: «сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: объявил
  rationale: В заключительном резюме календаря глагол דבר передаёт сообщение предписаний народу; «объявил» естественно сочетается с прямым дополнением и не усиливает значение до «провозгласил».
- source_word: מֹעֲדֵי
  choice: установленные времена
  rationale: מוֹעֵד обозначает назначенное время или собрание. Здесь речь обо всём священном календаре, включая субботу, поэтому более узкое «праздники» не полностью передаёт объём понятия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל
  choice: сынам Израиля
  rationale: Предлог указывает адресата сообщения; русская дательная конструкция естественно передаёт еврейское אֶל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняется буквальный и традиционно понятный мужской собирательный оборот «сыны Израиля»; более идиоматический вариант отмечен в сноске.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; «Яхве» сохраняет личное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Так» отражает связку וַ־ и итоговый характер стиха; «сынам Израиля» сохраняет форму источника, а более обычный современный эквивалент дан в сноске.
