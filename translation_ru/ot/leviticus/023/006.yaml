base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: ru
  text: А в пятнадцатый день этого месяца — праздник Пресных хлебов, посвящённый Яхве[a]. Семь дней ешьте пресный хлеб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Яхве». Еврейский предлог может указывать на посвящение или принадлежность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: А в пятнадцатый день
  rationale: Еврейское календарное выражение естественно передаётся по-русски порядковым числительным; союз וּ продолжает последовательность установлений.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: этого месяца
  rationale: В сочетании со словом «день» оборот обозначает дату внутри указанного месяца; родительный падеж естественен для современного русского языка.
- source_word: חַג הַמַּצּוֹת
  choice: праздник Пресных хлебов
  rationale: חַג обозначает культовый праздник, а הַמַּצּוֹת является его названием. Заглавная буква отмечает собственное название праздника.
- source_word: לַיהוָה
  choice: посвящённый Яхве
  rationale: Предлог ל может выражать посвящение или принадлежность. Формулировка ясно и естественно передаёт эту связь, не сводя её только к выгоде или адресату.
- source_word: שִׁבְעַת יָמִים
  choice: Семь дней
  rationale: Временная длительность по-русски естественно выражается винительным падежом без предлога.
- source_word: מַצּוֹת
  choice: пресный хлеб
  rationale: Форма множественного числа обозначает изделия из теста без закваски; русское собирательное выражение «пресный хлеб» понятно и традиционно.
- source_word: תֹּאכֵלוּ
  choice: ешьте
  rationale: Имперфект в законодательном контексте имеет предписывающую силу; русский повелительный глагол прямо и естественно выражает её.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога — тетраграмматон יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение предлога ל при имени Яхве
  choice: посвящённый Яхве
  alternative: для Яхве
  rationale: Предлог допускает оттенки посвящения и принадлежности. Основной текст передаёт культовое посвящение, а примечание сохраняет более буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с dignified сакральным регистром. Синтаксис сделан ясным для обычного читателя; сохранены название праздника, предписывающая сила глагола и неоднозначность предлога ל.
