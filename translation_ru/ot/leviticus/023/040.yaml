id: LEV.23.40
reference: Leviticus 23:40
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: ru
  text: В первый день возьмите себе плод прекрасного дерева[a], пальмовые ветви, ветви густолиственных деревьев и ивы у потока; семь дней радуйтесь перед Яхве, вашим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, согласно более поздней иудейской традиции, «плод цитрона» (этрог). Еврейский текст говорит о «плоде прекрасного (или великолепного) дерева».
    reason: Сохраняет традиционное отождествление как возможное толкование, не подменяя им более широкое и спорное значение еврейского выражения.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: возьмите себе
  rationale: В контексте постановления глагольная форма выражает предписание; повелительное наклонение естественно передаёт его по-русски, а «себе» сохраняет לָכֶם.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: в первый день
  rationale: Прямое соответствие еврейскому временному обороту без добавления отсутствующего в стихе уточнения «праздника».
- source_word: פְּרִי עֵץ הָדָר
  choice: плоды прекрасных деревьев
  rationale: הָדָר обозначает красоту, великолепие или величие. Обобщённый перевод сохраняет неопределённость еврейского выражения и не вносит в основной текст позднейшее отождествление с этрогом.
- source_word: כַּפֹּת תְּמָרִים
  choice: пальмовые ветви
  rationale: Краткий и естественный русский эквивалент, обозначающий ветви или вайи финиковой пальмы.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: ветви густолиственных деревьев
  rationale: עָבֹת передаёт густоту или плотность, вероятнее всего густоту листвы; выбранная формулировка ясна и сохраняет образ.
- source_word: וְעַרְבֵי נָחַל
  choice: ивы, растущие у ручьёв
  rationale: עַרְבֵי обозначает ивы или сходные прибрежные деревья, а נָחַל — поток, ручей либо русло сезонного водотока. Перевод естественно выражает связь растений с водотоком.
- source_word: וּשְׂמַחְתֶּם
  choice: радуйтесь
  rationale: Прямо передаёт значение «радоваться, веселиться» и сохраняет предписывающую силу контекста.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: перед Яхве, вашим Богом
  rationale: «Перед» идиоматично передаёт לִפְנֵי, а личное имя Яхве сохраняет явное употребление יהוה в исходном тексте.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Естественное русское обозначение продолжительности действия; отдельный предлог при такой конструкции не требуется.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное заветное имя; форма «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Определение פְּרִי עֵץ הָדָר
  choice: обобщённое «плоды прекрасных деревьев»
  alternative: плод цитрона (этрог)
  rationale: Само еврейское выражение остаётся общим, тогда как отождествление с цитроном известно из более поздней иудейской традиции; поэтому оно вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с ясным предписывающим тоном. Синтаксис близок к еврейскому перечислению, но адаптирован к естественной русской речи; сакральная лексика не архаизирована.
