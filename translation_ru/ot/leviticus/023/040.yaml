  rationale: Исправлены число и синтаксическая близость к еврейскому выражению פְּרִי עֵץ הָדָר, а также убрано невыраженное в оригинале уточнение «растущие» и восстановлено единственное число при נָחַל. Точка с запятой ясно отделяет предписание взять растения от предписания радоваться в течение семи дней; смысл не изменён.
