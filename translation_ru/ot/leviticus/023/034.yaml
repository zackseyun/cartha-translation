base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: ru
  text: 'Скажи сынам Израиля: «Пятнадцатый день этого седьмого месяца — праздник Шалашей для Яхве, семь дней».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Скажи
  rationale: Повелительная форма передаёт прямое Божье поручение Моисею; «скажи» естественнее по-русски, чем буквальное «говори».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено формульное и буквально соответствующее исходному выражение; в контексте оно обозначает весь народ завета.
- source_word: לֵאמֹר
  choice: двоеточие и прямая речь
  rationale: Еврейская формула введения речи естественно передана русской пунктуацией без тяжеловесного «говоря».
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: В пятнадцатый день этого седьмого месяца
  rationale: Сохранены точная календарная дата и указательное «этого» при естественном русском порядке слов.
- source_word: חַג הַסֻּכּוֹת
  choice: праздник Шалашей
  rationale: סֻכּוֹת обозначает временные шалаши или укрытия. Прозрачное современное название предпочтено традиционному, но менее понятному «Кущей».
- source_word: שִׁבְעַת יָמִים
  choice: который длится семь дней
  rationale: Длительность праздника выражена естественной русской конструкцией без изменения смысла.
- source_word: לַיהוָה
  choice: посвящён Яхве
  rationale: Предлог ל указывает на посвящение праздника Яхве; такая передача ясна и сохраняет культовую направленность.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В основном тексте сохранено личное имя Бога, представленное тетраграмматоном, без замены титулом.
- issue: Название праздника סֻכּוֹת
  choice: праздник Шалашей
  alternative: праздник Кущей
  rationale: Основной текст передаёт конкретное значение еврейского слова, а традиционное русское название приводится в сноске для узнаваемости.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «сынам Израиля» сохранена, тогда как לֵאמֹר передано средствами русской пунктуации. Для ясности подразумеваемое начало праздника выражено глаголом «начинается».
