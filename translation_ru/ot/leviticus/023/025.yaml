- from: Не делайте никакой обычной работы и принесите Яхве жертву, сжигаемую в огне[a].
  to: Не делайте никакой обычной работы и принесите Яхве огненную жертву[a].
  rationale: 'Исправлена только передача אִשֶּׁה: «огненная жертва» не утверждает, что вся жертва непременно сжигается, и сохраняет традиционную культовую терминологию. Сноска открыто фиксирует значимые лексические варианты. Остальная формулировка верно передаёт еврейский текст, его нормативный регистр и множественное число.'
