  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: ru
  text: Не делайте никакой обычной работы и принесите Яхве огненную жертву[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву, приносимую огнём»; возможно также: «пищевую жертву».'
    reason: Лексическое значение אִשֶּׁה в жреческой терминологии допускает передачу как приношения, связанного с огнём; его точный оттенок, включая понимание «пищевая жертва», остаётся предметом обсуждения.
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: не делайте никакой
  rationale: В сочетании с отрицанием כָּל выражает полный запрет; русская конструкция «не делайте никакой» естественно передаёт этот смысл и сохраняет обращение во множественном числе.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: обычной работы
  rationale: Сочетание обозначает повседневную трудовую деятельность, запрещённую в священный день, а не вообще любое действие. «Обычная работа» звучит современно и не вносит устаревшего представления о «рабском труде».
- source_word: וְהִקְרַבְתֶּם
  choice: и принесите
  rationale: В породе hифиль глагол קרב в жертвенном контексте означает принести или представить в качестве приношения. «Принесите» естественно передаёт предписываемое культовое действие.
- source_word: אִשֶּׁה
  choice: жертву, сжигаемую в огне
  rationale: Термин обозначает жертвенное приношение, связанное с огнём; описательный перевод понятен современному читателю и не выдаёт спорную этимологическую связь с «пищей» за однозначную.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога יהוה, а не заменяющий его титул; форма «Яхве» общепонятна в современном русском библейском употреблении.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не смешивает его с титулом «Господь».
- issue: Значение культового термина אִשֶּׁה
  choice: жертву, сжигаемую в огне
  alternative: пищевую жертву
  rationale: Связь термина с огненным приношением ясна из священнического употребления, тогда как понимание его как «пищи» остаётся возможным, но спорным. Альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным нормативным тоном. Формулировка сохраняет множественное число адресатов и параллельность двух предписаний; культовый термин раскрыт без архаизма и снабжён сноской из-за реальной лексической неоднозначности.
