review_pass:
  verdict: revise
  source_fidelity: Первая часть точно передаёт полный запрет на מְלֶאכֶת עֲבֹדָה как на обычную трудовую работу. «Принесите Яхве» верно отражает וְהִקְרַבְתֶּם ... לַיהוָה и сохраняет множественное число. Однако «жертву, сжигаемую в огне» представляет אִשֶּׁה как жертву, которая целиком сжигается; это излишне конкретизирует культовый термин. Более нейтральное традиционное «огненную жертву» лучше сохраняет его значение и не исключает спорного понимания термина как «пищевой жертвы».
  naturalness: Текст в целом естественен для современного литературного русского. «Обычная работа» ясно и ненавязчиво передаёт работу повседневного характера. «Огненную жертву» следует понимать как устоявшееся культовое словосочетание; сноска делает его доступным без перифразы, создающей ложную конкретизацию.
  terminology: «Яхве» последовательно передаёт יהוה. Для אִשֶּׁה предпочтительна «огненная жертва», а альтернативы следует оставить в сноске, поскольку точная этимология и оттенок термина обсуждаемы. Это также согласуется с английским аудитным следом, где основным является «food offering», но «offering by fire / fire offering» сохранены как лексические альтернативы.
