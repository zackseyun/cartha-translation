  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: ru
  text: Вот установленные времена Яхве[a] — священные собрания[b], которые вы должны провозглашать в установленные для них времена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «установленные праздники», «назначенные сроки». Еврейское מוֹעֲדֵי обозначает назначенные времена и шире понятия праздничных трапез.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «святые созывы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово вводит следующий далее перечень; «вот» естественно и выразительно передаёт еврейскую конструкцию без связки.
- source_word: מוֹעֲדֵי
  choice: установленные времена
  rationale: מוֹעֵד обозначает назначенное время или срок и здесь шире понятия праздничного пиршества; выбор сохраняет временной смысл и связь с בְּמוֹעֲדָם в конце стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: священные собрания
  rationale: Конструкция обозначает созываемые собрания, отделённые как святые; эта формулировка естественна и понятна на современном русском языке.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: которые вы должны провозглашать
  rationale: קרא в данном контексте означает публично объявлять или назначать соблюдение этих сроков; местоименное дополнение естественно выражено относительным местоимением «которые».
- source_word: בְּמוֹעֲדָם
  choice: в назначенное для них время
  rationale: Фраза указывает на надлежащий срок каждого священного дня; перевод передаёт притяжательный суффикс и звучит естественнее буквального «в их установленное время».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Объект глагола תִּקְרְאוּ
  choice: «которые» грамматически относится к установленным временам, названным также священными собраниями
  alternative: Отнести провозглашение только к собраниям
  rationale: Еврейское אֹתָם имеет мужской род и может отсылать к обоим стоящим во множественном числе выражениям; русский перевод не сужает референцию без необходимости.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Установленные времена» сохраняет ключевой повтор корня מועד по смыслу, а «священные собрания» избегает малопонятного церковнославянизма «созывы» в основном тексте.
