base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: ru
  text: 'Вот установленные Господом сроки, которые вы должны провозглашать священными собраниями, чтобы приносить Господу жертву, сжигаемую на огне: всесожжение и хлебное приношение, жертву и возлияния — предписанное для каждого дня в его день.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: праздники
  rationale: В контексте Лев 23 речь идёт об установленных Богом праздничных сроках; естественное русское «праздники» передаёт контекстуальный смысл, не отрицая календарной установленности.
- source_word: יְהוָה
  choice: Господа / Господу
  rationale: Традиционная русская передача тетраграмматона, соответствующая принятому библейскому регистру.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: священные собрания
  rationale: Передаёт публично созываемые собрания, отделённые для священной цели.
- source_word: אִשֶּׁה
  choice: огненную жертву
  rationale: Сохраняет связь термина с приношением, сжигаемым на жертвеннике, и избегает спорного этимологического уточнения «пища».
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком возносимой в огне.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В жертвенном контексте обозначает приношение из продуктов земледелия; «хлебное» естественно и традиционно в русском библейском языке.
- source_word: זֶבַח
  choice: жертву
  rationale: Сохраняет общее обозначение закалываемой жертвы без неоправданного уточнения её вида.
- source_word: נְסָכִים
  choice: возлияния
  rationale: Точный культовый термин во множественном числе.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: каждому дню положенное в свой день
  rationale: Идиоматично выражает требование приносить предписанное для каждого дня именно в соответствующий день.
theological_decisions:
- issue: Передача אִשֶּׁה
  choice: огненная жертва
  alternative: пищевое приношение
  rationale: Еврейское слово допускает традиционное понимание как приношения, сжигаемого в огне; перевод не вводит антропоморфное представление о буквальной пище Бога.
- issue: Соотношение перечисленных жертв
  choice: сохранено перечисление без дополнительного толкования связей между членами
  alternative: объединить «жертву и возлияния» в уточняющие категории
  rationale: Синтаксис оригинала краток и допускает некоторую неоднозначность; перевод не разрешает её конфессионально или экзегетически.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. Синтаксис сделан понятным для чтения вслух; архаизмы по возможности исключены, но устоявшиеся культовые термины сохранены.
