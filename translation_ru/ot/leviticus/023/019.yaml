  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: ru
  text: И принесите одного козла в жертву за грех[a] и двух годовалых барашков в мирную жертву[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в жертву общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: и принесите
  rationale: Буквально глагол означает «сделать», но в данном жертвенном контексте естественное русское соответствие — «принести» жертву.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: одного козла
  rationale: Сочетание обозначает одну особь мужского пола; «козёл» ясно и естественно передаёт это значение.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Традиционное и понятное обозначение данной категории жертв; возможный акцент на очищении сохранён в примечании.
- source_word: וּשְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: и двух однолетних ягнят
  rationale: Переданы число, вид животных и возрастное определение; форма «ягнят» в этом жертвенном контексте естественно понимается как обозначение самцов, тогда как добавление «самцов» звучало бы тяжеловесно.
- source_word: לְזֶבַח שְׁלָמִים
  choice: в мирную жертву
  rationale: Устойчивое русское наименование жертвенной категории שְׁלָמִים; единственное число обозначает категорию жертвы, хотя еврейская форма множественного числа сохраняет смысловую широту.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Основной вариант остаётся традиционным и общепонятным, а примечание сохраняет возможный функциональный акцент на очищении, не разрешая спор односторонне.
- issue: Передача שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения
  rationale: «Мирная жертва» ближе к традиционной русской культовой терминологии и не сужает значение до одного толкования; альтернативный функциональный перевод указан в примечании.
translation_notes:
  register: Современный литературный русский язык с традиционной, но понятной жертвенной терминологией. Повелительная форма естественно продолжает законодательное наставление; синтаксис краток и достоин.
