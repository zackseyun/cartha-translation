source:
  edition: WLC
  text: כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹֽשְׁבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: ru
  text: Никакой работы не делайте. Это установление навеки[a] для всех ваших поколений, во всех местах, где вы живёте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечное установление» / «непреходящее установление». Еврейское עוֹלָם может обозначать длительность без установленного предела, постоянство или непрерывность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во всех ваших поселениях» / «во всех местах вашего проживания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Никакой работы не делайте
  rationale: Сочетание כָּל с отрицанием выражает полный запрет на работу. Такая формулировка точно передаёт юридическую силу еврейского имперфекта и естественно звучит по-русски без добавочного усиления.
- source_word: חֻקַּת עוֹלָם
  choice: установление навеки
  rationale: חֻקָּה обозначает обязательное установление или предписание, а עוֹלָם — длительность без обозначенного предела. «Навеки» сохраняет исходную временную формулу, не уточняя её сверх текста.
- source_word: לְדֹרֹתֵיכֶם
  choice: для всех ваших поколений
  rationale: Фраза указывает на действие установления в череде последующих поколений. Добавление «всех» естественно выражает охват, заложенный в контексте длительности.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: во всех местах, где вы живёте
  rationale: מוֹשָׁב здесь означает место проживания или поселение. Описательная русская формулировка ясна современному читателю и сохраняет всеобщий пространственный охват.
theological_decisions:
- issue: Продолжительность действия культового установления
  choice: установление навеки
  alternative: вечное установление; непреложное установление
  rationale: Еврейское עוֹלָם может обозначать постоянную, бессрочную или непреходящую длительность в рамках завета. «Навеки» сохраняет напряжение исходной формулировки и не превращает её в отвлечённое философское утверждение об абсолютной вневременности.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным юридическим оттенком. Инверсия «Никакой работы не делайте» передаёт вынесенный вперёд объект и категоричность запрета, оставаясь естественной для нормативной речи.
