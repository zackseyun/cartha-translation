source:
  edition: WLC
  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: ru
  text: В первый день — священное собрание[a]; никакой обычной работы не выполняйте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «созванное священное собрание». Еврейское выражение מִקְרָא קֹדֶשׁ — установленное обозначение собрания, созванного для священной цели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «никакой работы по службе». Еврейское выражение относится к обычному труду, связанному со службой или занятием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: В первый день
  rationale: Предлог בְּ с существительным «день» образует обстоятельство времени; в современном русском естественно передаётся как «в первый день».
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое культовое выражение обозначает созванное для священной цели собрание. «Священное собрание» ясно и естественно передаёт его смысл, а оттенок официального созыва отмечен в сноске.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Сочетание означает работу, связанную с обычным трудом или службой, а не полный запрет любого действия. «Обычная работа» понятно современному читателю и не вносит архаического социального оттенка выражения «рабская работа».
- source_word: לֹא תַעֲשׂוּ
  choice: не выполняйте
  rationale: Отрицательная форма второго лица множественного числа в правовом предписании естественно передаётся русским запретительным императивом; глагол «выполнять» хорошо сочетается со словом «работа».
