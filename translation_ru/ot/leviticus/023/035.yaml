  source_fidelity: «В первый день» точно передаёт בַּיּוֹם הָרִאשׁוֹן. «Священное собрание» верно отражает מִקְרָא קֹדֶשׁ, а сноска уместно уточняет оттенок созыва. «Никакой обычной работы не выполняйте» передаёт запрет כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ, не превращая его в запрет всякой деятельности.
