  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (יהוה); традиционно переводится «Господь».'
    reason: Указание формы оригинала и традиционного варианта передачи Божьего имени.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Глагол דבר в повествовательной форме вводит последовательность событий и прямую речь. Русское «сказал» естественно передаёт эту устойчивую формулу; союз «и» отражает וַ־.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, обозначенное тетраграмматоном יהוה, а не заменяющий его титул.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל; имя дано в принятой русской форме.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» служит формулой введения последующей прямой речи. В современном русском эту функцию естественно и точно выполняет двоеточие, без тяжеловесного буквального повтора.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Форма «Яхве» сохраняет его как имя, тогда как «Господь» является традиционной заменой титулом; «Иегова» представляет более позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формула введения Божьей речи. Двоеточие передаёт функцию לֵאמֹר и связывает стих с последующим высказыванием.
