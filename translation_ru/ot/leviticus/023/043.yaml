lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: чтобы ... знали
  rationale: Передаёт цель, выраженную לְמַעַן с имперфектом, естественной русской конструкцией.
- source_word: דֹרֹתֵיכֶם
  choice: ваши поколения
  rationale: Сохраняет прямой многопоколенческий смысл еврейского выражения; «ваши потомки» было бы более толковательным.
- source_word: בַסֻּכּוֹת
  choice: в шалашах
  rationale: «Шалаши» понятно обозначают временные сооружения и сохраняют связь с названием праздника Кущей.
- source_word: הוֹשַׁבְתִּי
  choice: Я поселил
  rationale: Естественно передаёт каузативную форму глагола ישׁב — Бог сделал так, чтобы они жили там.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально точно воспроизводит корпоративное наименование народа; более идиоматичное «израильтян» возможно, но менее буквально.
- source_word: בְּהוֹצִיאִי אוֹתָם
  choice: когда вывел их
  rationale: Передаёт временное значение инфинитивной конструкции с בְּ и сохраняет Божье действие исхода.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняет явное упоминание земли и звучит естественно в достойном современном библейском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Прямо и естественно передаёт формулу завета.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» сохраняет это различие, тогда как «Господь» является традиционной заменой именем-титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Выбранное выражение сохраняет буквальную корпоративную формулу еврейского текста, не отрицая того, что она обозначает весь народ.
- issue: Характер пребывания в סֻכּוֹת
  choice: поселил ... в шалашах
  alternative: давал жить ... в шалашах
  rationale: Каузатив глагола сохранён без уточнения, были ли шалаши историческими жилищами в пути или богословским образом Божьего укрытия; текст сам этого здесь не разрешает.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён близким к еврейскому, но без неестественной кальки. Местоимение «Я» написано с прописной буквы по русской библейской издательской традиции.
