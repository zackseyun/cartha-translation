id: LEV.23.8
reference: Leviticus 23:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: ru
  text: В течение семи дней приносите Яхве огненную жертву[a]. В седьмой день пусть будет священное собрание; никакой обычной работы не делайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пищевое приношение»; также возможно: «жертву, сжигаемую на огне».'
    reason: Лексическое значение אִשֶּׁה допускает как традиционную передачу через огонь, так и контекстуальное понимание жертвы как пищи.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: приносите
  rationale: В породе hифиль глагол קרב в жертвенном контексте означает подносить или представлять приношение; русское «приносите» естественно передаёт культовое действие.
- source_word: אִשֶּׁה
  choice: огненную жертву
  rationale: Священнический термин обозначает жертву, связанную с сожжением на жертвеннике. «Огненная жертва» сохраняет эту связь и не уточняет вид жертвы сверх еврейского текста; альтернативное понимание отмечено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает на адресата и посвящение жертвы, а тетраграмматон передан личным именем «Яхве».
- source_word: שִׁבְעַת יָמִים
  choice: в течение семи дней
  rationale: Оборот ясно выражает продолжительность повторяющегося принесения жертв.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: в седьмой день
  rationale: Прямое и естественное обозначение времени.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое праздничное выражение обозначает созванное для священной цели собрание; этот вариант понятнее современному читателю, чем «священное созвание».
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Сочетание относится к повседневному трудовому занятию, запрещённому в праздник, а не обязательно ко всякому возможному действию. «Обычная работа» сохраняет это различие без архаичного оттенка.
- source_word: לֹא תַעֲשׂוּ
  choice: не делайте
  rationale: Прямая форма запрета во втором лице множественного числа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Характер термина אִשֶּׁה
  choice: огненная жертва
  alternative: пищевое приношение
  rationale: Термин связан с жертвенным сожжением, однако в священническом языке жертвы также могут осмысляться как пища Бога. Основной текст сохраняет огненный аспект, а реальная лексическая неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным культовым регистром. Повелительные формы передают нормативный характер установления; точка с запятой сохраняет тесную связь священного собрания с запретом обычной работы.
