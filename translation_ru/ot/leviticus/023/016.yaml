  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: ru
  text: Отсчитайте пятьдесят дней — до дня, следующего за седьмой субботой, — и принесите Яхве новое хлебное приношение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до дня после седьмой недели». Буквально в еврейском тексте: «до дня после седьмой субботы»; толкователи по-разному понимают, как здесь выражен календарный отсчёт праздника.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד
  choice: до
  rationale: Предлог обозначает предел периода счёта; русское «до» естественно связывает его со следующим временным выражением.
- source_word: מִמָּחֳרַת
  choice: дня, следующего за
  rationale: Передаёт значение «на следующий день / день после» в ясной современной русской форме.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: седьмой субботой
  rationale: Сохраняет прямое значение שַׁבָּת и не подменяет его истолковывающим «седьмой неделей».
- source_word: תִּסְפְּרוּ
  choice: отсчитайте
  rationale: Форма повелительного наставления уместна для законодательного контекста; приставка «от-» естественно выражает завершённый счёт установленного числа дней.
- source_word: חֲמִשִּׁים יוֹם
  choice: пятьдесят дней
  rationale: Стандартная русская передача числительного с существительным.
- source_word: וְהִקְרַבְתֶּם
  choice: а затем принесите
  rationale: В жертвенном контексте глагол означает представить или принести приношение; «затем» ясно передаёт последовательность действий.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В левитском культовом контексте слово обозначает приношение из продуктов земли, прежде всего зерна; традиционный русский термин точнее общего «приношение».
- source_word: חֲדָשָׁה
  choice: новое
  rationale: Прямо сохраняет значение прилагательного и его согласование с «приношением», не добавляя отсутствующего в тексте уточнения «нового урожая».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, а дательный падеж естественно выражает направленность приношения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Текст прямо употребляет Тетраграмматон; «Яхве» сохраняет личное заветное имя и соответствует принятой для проекта передаче.
- issue: Календарное значение הַשַּׁבָּת הַשְּׁבִיעִת
  choice: седьмая суббота
  alternative: седьмая неделя
  rationale: Еврейский текст употребляет שַׁבָּת («суббота»), а не обычное слово «неделя». Основной текст сохраняет исходную формулировку, а возможное календарное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и богослужебного контекста. Синтаксис сделан ясным для обычного читателя, при этом неоднозначность календарного выражения не устранена из основного текста и отражена в сноске.
