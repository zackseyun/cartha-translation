  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: ru
  text: В первый день пусть будет у вас священное собрание[a]; никакой обычной работы не делайте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святое собрание»; возможен также смысл «священный созыв».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «никакой работы служения». Имеется в виду обычный труд, а не всякая возможная деятельность; традиционный перевод — «никакой работы рабской».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: В первый день
  rationale: Естественная русская передача временной конструкции с предлогом ב и порядковым числительным.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: В культовом контексте מִקְרָא обозначает созываемое собрание, а קֹדֶשׁ определяет его как священное; формулировка понятна современному читателю и сохраняет торжественный регистр.
- source_word: יִהְיֶה לָכֶם
  choice: пусть будет у вас
  rationale: Передаёт предписывающий смысл и сохраняет конструкцию принадлежности/отношения, не превращая её в более толковательное «соберитесь».
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Отрицательное «никакой» сохраняет всеохватность כָּל, тогда как «обычной работы» передаёт устойчивое сочетание, относящееся к повседневному трудовому занятию, а не ко всякому действию вообще.
- source_word: לֹא תַעֲשׂוּ
  choice: не делайте
  rationale: Естественная для современного русского языка форма прямого законодательного запрета.
theological_decisions:
- issue: Объём запрета в מְלֶאכֶת עֲבֹדָה
  choice: Запрещается обычная трудовая работа, а не всякое мыслимое действие.
  alternative: Запрещается абсолютно всякая работа без уточнения.
  rationale: Особое словосочетание מְלֶאכֶת עֲבֹדָה в установлениях о праздниках уже по смыслу, чем простой запрет всякой работы; перевод не должен неоправданно расширять запрет.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным законодательным звучанием. «Священное собрание» избегает архаичного «священное собрание да будет», а «обычная работа» сохраняет смысловое ограничение еврейского словосочетания.
