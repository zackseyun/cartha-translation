  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: ru
  text: Однако[a] в пятнадцатый день седьмого месяца, когда вы соберёте урожай с земли, празднуйте праздник Яхве семь дней. В первый день — торжественный покой[b], и в восьмой день — торжественный покой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Именно» или «Только». Еврейская частица может обозначать переход, ограничение либо усиление.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «субботний покой». Еврейское слово обозначает особый день отдыха, связанный со священным празднованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Однако
  rationale: Передаёт переход и уточнение по отношению к предшествующим установлениям; частица здесь не сводится к простому усилению.
- source_word: בְּאָסְפְּכֶם אֶת תְּבוּאַת הָאָרֶץ
  choice: когда вы соберёте урожай земли
  rationale: Инфинитивная конструкция с בְּ имеет временное значение, а תְּבוּאָה обозначает собранный плод или урожай земли в широком смысле.
- source_word: תָּחֹגּוּ אֶת חַג יְהוָה
  choice: празднуйте праздник Яхве
  rationale: Глагол חגג означает совершать или праздновать праздник, часто паломнический; сочетание сохраняет формальную близость и понятно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: שַׁבָּתוֹן
  choice: торжественный покой
  rationale: Обозначает особое священное прекращение обычных дел; перевод не отождествляет этот день безоговорочно с еженедельной субботой.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Значение שַׁבָּתוֹן в праздничном законодательстве
  choice: торжественный покой
  alternative: субботний покой; полный покой; день покоя
  rationale: Формулировка сохраняет связь со священным отдыхом, но не утверждает, что речь непременно идёт о еженедельной субботе.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного библейского стиля. Повелительное «празднуйте» естественно передаёт предписывающее значение еврейской глагольной формы. Именные фразы с тире сохраняют сжатость оригинала.
