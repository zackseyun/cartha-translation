id: LEV.23.27
reference: Leviticus 23:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: ru
  text: Но десятый день этого седьмого месяца — это День искупления[a]. Пусть будет у вас священное собрание; смиряйте себя[b] и приносите огненную жертву[c] Господу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «День искуплений»; в еврейском тексте слово «искупление» стоит во множественном числе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «подвергайте себя лишениям»; буквально выражение допускает также перевод «изнуряйте души ваши». Оно обозначает самоумаление и самоограничение и не сводится в самом выражении только к посту.'
    reason: lexical_alternative
  - marker: c
    text: То есть приношение, сжигаемое на огне. Еврейский культовый термин традиционно переводится также как «жертва, приносимая на огне». Тетраграмматон יהוה передан словом «Господь» (евр. Яхве).
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Передаёт ограничительно-противительный переход к особому установлению десятого дня, не усиливая частицу до «только» или «непременно».
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: в десятый день этого седьмого месяца
  rationale: Естественно передаёт временное выражение, включая указательное «этого».
- source_word: יוֹם הַכִּפֻּרִים
  choice: День искупления
  rationale: Устоявшееся и понятное русское название праздника; формальный еврейский множественный облик отмечен в сноске, поскольку по-русски буквальное «искуплений» звучит неестественно и может вводить в заблуждение.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Передаёт официально созываемое культовое собрание современным и dignified русским выражением.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: смиряйте себя
  rationale: Сохраняет широту ритуально-покаянного самоограничения и не сводит предписание исключительно к посту; возможные более буквальные оттенки указаны в сноске.
- source_word: וְהִקְרַבְתֶּם
  choice: приносите
  rationale: Обычный русский глагол для представления жертвы в культовом контексте.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Отражает связь приношения с огнём и дымом, не вводя спорное пояснение «пища», отсутствующее в самом стихе.
- source_word: לַיהוָה
  choice: Господу
  rationale: Традиционная русская передача тетраграмматона в библейском тексте; собственное имя отмечено в сноске.
theological_decisions:
- issue: Число в названии יוֹם הַכִּפֻּרִים
  choice: День искупления
  alternative: День искуплений
  rationale: Существительное имеет форму множественного числа, но в данном устойчивом названии русский единственный вариант естественнее; формальная особенность оригинала сохранена в примечании.
- issue: Содержание предписания וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: смиряйте себя
  alternative: изнуряйте себя; подвергайте себя лишениям
  rationale: Формулировка не ограничивает заповедь одним только постом и сохраняет её покаянно-ритуальную широту, избегая при этом неестественной русской кальки.
- issue: Передача אִשֶּׁה
  choice: огненная жертва
  alternative: приношение, сжигаемое на огне; пищевое приношение
  rationale: Выбор сохраняет культовую образность термина и не решает окончательно спорную этимологическую и функциональную нюансировку.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным культовым регистром. Повелительные формы во множественном числе передают нормативный характер установления. Пунктуация подчёркивает, что десятый день и есть День искупления.
