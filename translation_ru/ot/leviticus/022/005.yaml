  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: ru
  text: или кто прикоснётся к какому-либо кишащему существу, от которого станет нечистым[a], или к человеку, от которого станет нечистым, какова бы ни была его нечистота[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к какому-либо пресмыкающемуся». Еврейское слово обозначает категорию существ, которые кишат или передвигаются близко к земле, без точного зоологического уточнения.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть: при любом виде нечистоты того человека. Еврейская фраза кратка и буквально звучит: «при всей его нечистоте».'
    reason: ambiguity
lexical_decisions:
- source_word: אוֹ אִישׁ אֲשֶׁר יִגַּע
  choice: или кто прикоснётся
  rationale: В продолжающемся перечне אִישׁ имеет обобщённое юридическое значение; по-русски естественно передать его местоимением «кто», не ограничивая норму мужчинами.
- source_word: בְּכָל שֶׁרֶץ
  choice: к какому-либо мелкому существу
  rationale: שֶׁרֶץ обозначает широкую категорию небольших существ, кишащих или передвигающихся близко к земле; перевод не вводит более узкой зоологической классификации.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: от которого станет нечистым
  rationale: Передаёт источник приобретаемой обрядовой нечистоты и сохраняет пассивно-результативный смысл еврейского выражения.
- source_word: בְאָדָם
  choice: к человеку
  rationale: אָדָם здесь означает человека как возможный источник передаваемой через прикосновение нечистоты.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: какова бы ни была его нечистота
  rationale: Сохраняет компактность и некоторую неоднозначность местоименного суффикса, естественно указывая в контексте на нечистоту человека, к которому прикоснулись.
- source_word: טמא / טֻמְאָה
  choice: стать нечистым / нечистота
  rationale: Повтор одного русского корня отражает лексическую связь в еврейском тексте и обозначает обрядовый статус, а не обязательно нравственную вину.
theological_decisions:
- issue: Характер нечистоты в священническом законодательстве
  choice: Передать как «нечистый / нечистота» в обрядовом смысле.
  alternative: «осквернённый / осквернение» либо «нечистота» с нравственным оттенком.
  rationale: Контекст касается состояния ритуальной пригодности священника, а не утверждает сам по себе нравственную виновность.
- issue: К кому относится «его» в выражении טֻמְאָתוֹ
  choice: Сохранить естественное указание на нечистоту человека, которого коснулись.
  alternative: Понять как нечистоту прикоснувшегося или развернуть фразу как «любой вид человеческой нечистоты».
  rationale: Ближайший референт — אָדָם, однако краткая конструкция оригинала не оправдывает чрезмерно подробного истолкования в основном тексте.
translation_notes:
  register: Современный литературный русский язык, юридически-повествовательный регистр. Строка начинается со строчной буквы и заканчивается запятой, поскольку стих продолжает перечень и синтаксически связан с соседними стихами.
