  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: ru
  text: Когда зайдёт солнце, он будет ритуально чист и после этого может есть святыни[a], потому что это его пища[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священные приношения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «потому что это его хлеб»; здесь «хлеб» означает положенную ему пищу из священных долей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: Когда зайдёт солнце
  rationale: Еврейское идиоматическое выражение буквально говорит о «приходе» солнца, но означает его заход; выбран естественный русский оборот с временным значением.
- source_word: וְטָהֵר
  choice: он будет чист
  rationale: Форма обозначает восстановление ритуальной чистоты после захода солнца; контекст определяет культовый, а не нравственный смысл чистоты.
- source_word: וְאַחַר
  choice: и после этого
  rationale: Передаёт последовательность действий, установленную предписанием.
- source_word: יֹאכַל
  choice: сможет есть
  rationale: В данном правовом контексте несовершенный вид выражает разрешённую возможность есть после восстановления чистоты.
- source_word: מִן הַקֳּדָשִׁים
  choice: есть святыни
  rationale: Слово обозначает освящённые предметы или доли; краткое «святыни» сохраняет широту исходного выражения, а возможное уточнение вынесено в примечание.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предоставленного разрешения.
- source_word: לַחְמוֹ הוּא
  choice: это его пища
  rationale: Буквально сказано «это его хлеб», однако לֶחֶם здесь означает пищу или положенное священнику пропитание; единственное число указательного местоимения сохраняет грамматическую форму еврейского выражения.
theological_decisions:
- issue: Характер чистоты
  choice: ритуальная чистота
  alternative: нравственная или духовная чистота
  rationale: Контекст Левита 22 касается допуска священника к священной пище после состояния ритуальной нечистоты; перевод не привносит нравственного смысла.
- issue: Значение священной пищи
  choice: общее обозначение освящённых долей словом «святыни»
  alternative: конкретизация как «священные приношения»
  rationale: Исходное множественное существительное допускает широкое значение; конкретизация как приношений вероятна по контексту, но не обязательна и потому отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, ясным и достойным звучанием законодательного текста. Слово «святыни» сохраняет формальную близость к оригиналу, а сноски поясняют возможную конкретизацию и буквальную метафору «хлеба».
