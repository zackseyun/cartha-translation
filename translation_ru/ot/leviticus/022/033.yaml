  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: ru
  text: который вывел вас из земли Египта, чтобы быть вашим Богом. Я — Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (YHWH); традиционно передаётся «Господь», также встречается передача «Иегова».'
    reason: Указание исходной формы и основных вариантов передачи божественного имени.
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: который вывел
  rationale: Причастие породы хифиль от יצא с артиклем имеет здесь определительно-относительное значение и продолжает предыдущее высказывание; по-русски естественно передаётся придаточным «который вывел».
- source_word: אֶתְכֶם
  choice: вас
  rationale: Показатель прямого дополнения с суффиксом 2-го лица мужского рода множественного числа; русское «вас» точно передаёт лицо и число.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохранена полная формула исхода с упоминанием земли; традиционное и понятное русское сочетание «земля Египетская» соответствует смыслу оригинала и достойному библейскому регистру.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: чтобы быть вашим Богом
  rationale: Передаёт целевое значение לִהְיוֹת и заветную формулу принадлежности, выраженную конструкцией с לָכֶם; формулировка естественна для современного русского языка.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Именное предложение передано естественной русской конструкцией с тире; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале непосредственно употреблено личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем Бога и титулом «Господь», не подменяя исходную форму конфессионально обусловленным вариантом.
- issue: Целевое значение исхода в לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: чтобы быть вашим Богом
  alternative: чтобы стать для вас Богом
  rationale: Конструкция обозначает цель Божьего действия и заветные отношения. «Быть вашим Богом» не предполагает, будто Бог только тогда стал Богом, и вместе с тем сохраняет выраженную в тексте цель.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальная строчная буква сохранена, поскольку стих синтаксически продолжает предыдущий контекст. Формула «земля Египетская» выбрана как ясная и устойчивая, без излишней архаизации.
