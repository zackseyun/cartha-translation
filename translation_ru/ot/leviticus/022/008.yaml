  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: ru
  text: Он не должен есть животное, павшее само по себе или растерзанное зверем[a], чтобы не оскверниться им. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падаль или растерзанное животное».'
    reason: 'Лексическая альтернатива: נְבֵלָה обозначает животное, павшее без надлежащего заклания, а טְרֵפָה — животное, растерзанное хищником.'
lexical_decisions:
- source_word: נְבֵלָה
  choice: падаль
  rationale: Слово обозначает труп животного, в данном пищевом контексте — животное, умершее без надлежащего заклания. «Падаль» кратко и естественно передаёт это значение.
- source_word: וּטְרֵפָה
  choice: или растерзанное зверем
  rationale: טְרֵפָה обозначает животное, растерзанное хищником; единственное число среднего рода согласуется с подразумеваемым «животное» и сохраняет компактность оригинала.
- source_word: לֹא יֹאכַל
  choice: Он не должен есть
  rationale: Отрицательная форма имперфекта в законодательном контексте выражает запрет; эта формулировка естественно передаёт его силу в современном русском языке.
- source_word: לְטָמְאָה בָהּ
  choice: чтобы не стать нечистым от этого
  rationale: Инфинитив с לְ допускает оттенок цели или результата. Русская конструкция сохраняет связь между употреблением такой пищи и ритуальной нечистотой, не сводя её только к одному логическому оттенку.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте; тире естественно оформляет именную конструкцию по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие и соответствует предоставленному аудированному слою.
- issue: Характер нечистоты
  choice: стать нечистым
  alternative: осквернить себя
  rationale: Выбранная формулировка прямо сохраняет терминологию ритуальной чистоты корня טמא и не придаёт ей исключительно нравственного смысла.
translation_notes:
  register: Современный литературный русский язык с ясным законодательным оттенком. Формулировка краткая и достойная; термин «нечистым» сохраняет культовый контекст, а примечание разъясняет компактные древнееврейские обозначения.
