  terminology: «Оскверниться» здесь обозначает ритуальное осквернение и не требует нравственной интерпретации. «Яхве» последовательно передаёт тетраграмматон. «Павшее само по себе» отражает נְבֵלָה, а «растерзанное зверем» — טְרֵפָה.
