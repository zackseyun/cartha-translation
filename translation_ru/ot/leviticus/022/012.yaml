  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: ru
  text: Но если дочь священника выйдет замуж за несвященника[a], то она не должна есть из священных приношений[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за постороннего мужчину». Здесь имеется в виду мужчина вне священнического круга, а не обязательно чужеземец.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из приношения святынь»; также возможно: «из священных даров».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Но если дочь священника
  rationale: 'Союз וּ передаёт контраст с предыдущим положением, а сочетание בַת כֹּהֵן — конструкцию принадлежности: «дочь священника».'
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: если ... выйдет замуж за человека, не принадлежащего к священническому роду
  rationale: Оборот «стать/быть для мужчины» в данном контексте указывает на брак. זָר означает здесь не обязательно иноплеменника, а человека вне круга священнической семьи, имеющей право на священную пищу.
- source_word: הִוא
  choice: она
  rationale: Самостоятельное местоимение обозначает подлежащее и может нести лёгкое выделение; в естественном русском оно передано явным местоимением.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: из священных приношений
  rationale: תְּרוּמָה — отделённое и посвящённое приношение; форма единственного числа с множественным קֳדָשִׁים допускает буквальное «из приношения святынь», но по-русски естественнее собирательное «из священных приношений».
- source_word: לֹא תֹאכֵל
  choice: не должна есть
  rationale: Отрицательная форма в законодательном контексте выражает обязательный запрет; «не должна» передаёт нормативную силу современным русским языком.
theological_decisions:
- issue: Значение זָר в законах о священнической пище
  choice: человек, не принадлежащий к священническому роду
  alternative: посторонний; несвященник; чужеземец
  rationale: Контекст ограничивает доступ к святыням кругом священнического дома. Перевод не сводит слово к этнической чужеземности и не утверждает более узкое значение, чем требует контекст.
- issue: Объект запрета в בִּתְרוּמַת הַקֳּדָשִׁים
  choice: священные приношения
  alternative: приношение святынь; священные дары
  rationale: Фраза обозначает посвящённые доли, доступ к которым регулируется данным разделом; перевод сохраняет широкую культовую категорию.
translation_notes:
  register: Современный литературный русский; ясная нормативная формулировка без архаичного «да не ест». Термины передают священнический контекст и сохраняют смысловые варианты в сносках.
