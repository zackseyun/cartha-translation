base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: ru
  text: Не приносите Яхве животного с ушибленными[a], раздавленными, вырванными или отрезанными семенниками; и на вашей земле не делайте этого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ушибленное, раздавленное, вырванное или отрезанное»; еврейский текст перечисляет четыре вида повреждения, подразумевая мужские половые органы животного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוּךְ
  choice: ушиблены
  rationale: Причастие обозначает повреждение от давления или удара; «ушиблены» отличает этот изъян от следующего, более сильного «раздроблены».
- source_word: כָתוּת
  choice: раздроблены
  rationale: Слово означает нечто разбитое или раздавленное и передаёт тяжёлое физическое повреждение.
- source_word: נָתוּק
  choice: вырваны
  rationale: Форма указывает на отрыв или отделение посредством вырывания; этот перевод сохраняет отличие от разрезания.
- source_word: כָרוּת
  choice: отрезаны
  rationale: Слово образовано от глагола «отрезать» и здесь описывает состояние после увечья.
- source_word: תַקְרִיבוּ
  choice: не приносите
  rationale: В жертвенном контексте каузативная форма означает принести или представить животное как приношение; «приносите» естественно и не сужает действие до сожжения на жертвеннике.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה принятой русской транслитерацией.
- source_word: בְאַרְצְכֶם
  choice: в вашей земле
  rationale: Буквально и естественно передаёт указание на землю, принадлежащую адресатам.
- source_word: תַעֲשׂוּ
  choice: не делайте этого
  rationale: Глагол «делать» употреблён без явно названного дополнения и отсылает к описанному увечью; местоимение делает русскую фразу понятной, не устраняя широту выражения.
- source_word: невыраженное дополнение при четырёх причастиях
  choice: яички
  rationale: Контекст говорит о повреждении мужских половых органов жертвенного животного. Анатомически точное слово ясно выражает подразумеваемый референт без эвфемизма.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя в соответствии с исходным текстом.
- issue: Смысл заключительного запрета וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  choice: общий запрет совершать описанное увечье в земле Израиля
  alternative: запрет приносить таких животных в жертву в этой земле; запрет подготавливать их для жертвы
  rationale: Еврейское «не делайте» широко и эллиптично. Формулировка «не делайте этого» сохраняет эту широту и естественнее всего отсылает к описанным действиям, не вводя более узкого толкования.
translation_notes:
  register: Современный литературный русский язык, сдержанный и ясный. Анатомический термин употреблён прямо ради точности; синтаксическая недосказанность заключительного запрета сохранена выражением «не делайте этого».
