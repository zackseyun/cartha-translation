  source_fidelity: 'Основной текст в целом точно передаёт еврейский оригинал: נֶפֶשׁ уместно передано обобщающим «всякий», «прикоснётся к этому» не конкретизирует референт местоимения בּוֹ, а «будет нечист до вечера» сохраняет ритуальный и временной характер статуса. «Ничего из святынь» адекватно передаёт партитивное מִן הַקֳּדָשִׁים. Условие כִּי אִם + омовение передано естественно, хотя формулировка «если только не» ближе отражает ограничительное значение исходной конструкции.'
