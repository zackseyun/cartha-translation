  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: ru
  text: Всякий, кто прикоснётся к этому, будет нечист до вечера и не должен есть ничего из святынь[a], если только не омоет своё тело водой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из священных приношений»; буквально: «из святых вещей».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «омоет свою плоть в воде».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: всякий
  rationale: В данном правовом контексте слово обозначает отдельного человека, а не нематериальную «душу»; «всякий» естественно передаёт обобщённое условие.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: кто прикоснётся к этому
  rationale: Женский род глагола обусловлен грамматическим родом נֶפֶשׁ. Местоимение отсылает к источнику нечистоты из предыдущего контекста; нейтральное «к этому» не навязывает личного референта.
- source_word: וְטָמְאָה עַד הָעָרֶב
  choice: будет нечист до вечера
  rationale: Передаёт возникающее состояние ритуальной нечистоты и срок его действия в естественной форме русского законодательного изложения.
- source_word: וְלֹא יֹאכַל
  choice: и не должен есть
  rationale: Имперфект с отрицанием в правовом контексте выражает запрет; эта формулировка ясна и сохраняет нормативный тон.
- source_word: מִן הַקֳּדָשִׁים
  choice: ничего из святынь
  rationale: «Святыни» обозначают освящённые предметы или приношения, здесь употребляемые в пищу; «ничего из» передаёт партитивную силу предлога מִן.
- source_word: כִּי אִם
  choice: пока не
  rationale: В сочетании с предшествующим отрицанием идиома вводит условие, после исполнения которого запрет перестаёт действовать.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: омоет своё тело водой
  rationale: בָּשָׂר буквально означает «плоть», но здесь относится ко всему телу; «омоет» уместно в ритуальном контексте и ясно описывает физическое действие.
theological_decisions:
- issue: Характер нечистоты
  choice: ритуальная нечистота
  alternative: нравственная нечистота или вина
  rationale: Контекст регулирует допуск к святыням после соприкосновения с источником нечистоты и омовения; текст не утверждает нравственной вины.
- issue: Условие допуска к святыням
  choice: омовение как прямо названное условие
  alternative: истолковать омовение как полное и само по себе достаточное очищение
  rationale: Стих прямо называет омовение, но перевод не добавляет утверждений о его богословском механизме и не устраняет связь с нечистотой до вечера.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. «Нечист» сохраняет традиционный культовый термин, а не обозначает бытовую грязь. Все местоименные формы избегают необоснованного указания на пол.
