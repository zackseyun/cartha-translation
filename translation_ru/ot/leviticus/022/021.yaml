id: LEV.22.21
reference: Leviticus 22:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: ru
  text: Если человек принесёт Яхве мирную жертву во исполнение обета или как добровольное приношение из крупного или мелкого скота, животное должно быть без изъяна, чтобы быть принятым[a]; никакого порока не должно быть у него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы обрести благоволение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי יַקְרִיב
  choice: Если человек принесёт
  rationale: Условная правовая формула передана естественным русским оборотом. אִישׁ сохранено как «человек», грамматически мужское существительное, без неестественного для русского текста «мужчина».
- source_word: זֶבַח שְׁלָמִים
  choice: мирную жертву
  rationale: Устоявшееся русское обозначение данного вида жертвы сохраняет связь שְׁלָמִים с корнем שׁלם и не сводит её значение лишь к общению или трапезе.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное covenantное имя יהוה передано транслитерацией, а не заменено титулом «Господь».
- source_word: לְפַלֵּא נֶדֶר
  choice: во исполнение обета
  rationale: В данном жертвенном контексте сочетание означает совершение приношения, которым исполняется данный обет.
- source_word: אוֹ לִנְדָבָה
  choice: или как добровольное приношение
  rationale: נְדָבָה обозначает приношение по свободному побуждению, в отличие от приношения по обету.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: из крупного или мелкого скота
  rationale: בקר и צאן обозначают две основные группы жертвенного домашнего скота; «мелкий скот» включает овец и коз.
- source_word: תָּמִים
  choice: без изъяна
  rationale: В жертвенном законодательстве слово указывает на отсутствие физического недостатка, делающего животное непригодным.
- source_word: לְרָצוֹן
  choice: чтобы быть принятой
  rationale: Передана приемлемость жертвы перед Богом; формулировка сохраняет целевое значение לְ.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: никакого порока не должно быть на ней
  rationale: מוּם — физический порок или повреждение. Отдельная итоговая формула сохранена, несмотря на смысловое усиление предыдущего требования.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя Бога; транслитерация сохраняет его отличие от титулов.
- issue: Значение זֶבַח שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: «Мирная жертва» — понятное и укоренённое наименование, не навязывающее единственного толкования богословского смысла שְׁלָמִים.
- issue: Смысл לְרָצוֹן
  choice: чтобы быть принятой
  alternative: чтобы обрести благоволение
  rationale: Контекст непосредственно говорит о пригодности жертвы к принятию, однако еврейское רָצוֹן допускает оттенок благоволения, отмеченный в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и культового контекста. Термины «мирная жертва», «обет», «приношение», «без изъяна» и «порок» сохраняют точность, оставаясь понятными обычному читателю.
