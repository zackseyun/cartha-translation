revisions:
- from: Если человек[a] съест святыню[b] неумышленно[c], то пусть прибавит к ней пятую часть[d] и отдаст святыню священнику.
  to: Если человек[a] по ошибке[c] съест нечто священное[b], то пусть добавит к этому одну пятую[d] и отдаст священное священнику.
  rationale: Перевод «священное» вместо «святыня» устраняет неестественное сочетание «съесть святыню», при этом сохраняет намеренную широту и повтор еврейского קֹדֶשׁ. Уточнены примечания, чтобы не добавлять к тексту оттенок небрежности или излишне конкретное толкование механизма возмещения.
