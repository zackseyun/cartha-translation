source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: ru
  text: Если человек[a] по ошибке[c] съест нечто священное[b], то пусть добавит к этому одну пятую[d] и отдаст священное священнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужчина»; еврейское אִישׁ — существительное мужского рода, которое в формулировке закона может обозначать человека вообще.'
    reason: lexical_alternative
  - marker: b
    text: Под «священным» здесь понимается посвящённая Богу пища или иная священная доля, предназначенная для священников.
    reason: cultural_note
  - marker: c
    text: 'Или: «неумышленно», «по ошибке».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «прибавит к нему его пятую часть».'
    reason: translation_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: Если человек
  rationale: אִישׁ — существительное мужского рода в формулировке частного случая закона; русское «человек» сохраняет форму единственного числа и естественно допускает обобщённое употребление.
- source_word: כִּי יֹאכַל
  choice: съест
  rationale: כִּי вводит условный случай, а имперфект יֹאכַל обозначает действие в этом случае; русская конструкция «если… съест» естественно передаёт оба элемента.
- source_word: קֹדֶשׁ
  choice: святыню
  rationale: קֹדֶשׁ здесь обозначает посвящённую Богу пищу или иную священную долю. «Святыня» сохраняет широту исходного слова и повторяется во второй части стиха.
- source_word: בִּשְׁגָגָה
  choice: неумышленно
  rationale: Слово указывает на действие по ошибке, без намерения; «неумышленно» ясно передаёт важное для закона противопоставление намеренному проступку.
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: то пусть прибавит к ней пятую часть
  rationale: Фраза предписывает добавить одну пятую к возмещаемой святыне или её стоимости. Такая формулировка передаёт обязательность, не вводя современное процентное обозначение.
- source_word: וְנָתַן לַכֹּהֵן אֶת־הַקֹּדֶשׁ
  choice: и отдаст святыню священнику
  rationale: Сохранены глагол «дать/отдать», адресат и повтор слова קֹדֶשׁ. Перевод не устраняет заложенный в контексте вопрос, идёт ли речь о самой святыне или о её возмещении.
theological_decisions:
- issue: Обобщённое употребление мужского единственного числа
  choice: «человек» в основном тексте
  alternative: «мужчина» или «кто-либо»
  rationale: «Человек» естественно для современного русского закона и соответствует возможному обобщённому употреблению אִישׁ, не ограничивая норму только взрослыми мужчинами; грамматическое единственное число сохранено.
- issue: Характер священного предмета и возмещения
  choice: дважды перевести קֹדֶשׁ словом «святыня»
  alternative: «священная пища», «священная доля» или пояснительное «возместит стоимость святыни»
  rationale: Исходное слово шире, чем пища или доля, а заключительная формулировка буквально велит отдать святыню священнику. Более узкий или пояснительный перевод преждевременно снял бы смысловую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с ясной формулировкой закона. «Пусть прибавит» передаёт предписывающую силу без канцелярской тяжеловесности; «святыня» сохраняет достоинство и терминологическую связь двух употреблений קֹדֶשׁ.
