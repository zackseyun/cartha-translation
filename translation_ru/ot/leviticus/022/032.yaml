  source_fidelity: 'Первый запрет требует прямого дополнения в винительном падеже: אֶת שֵׁם קָדְשִׁי — «Моё святое имя». Родительный падеж в варианте «не оскверняйте моего святого имени» возможен как архаизирующая конструкция при отрицании, но не соответствует нейтральной современной норме и неоправданно ослабляет прямоту запрета. Нифаль וְנִקְדַּשְׁתִּי передаёт, что Яхве будет признан/почитаем святым среди Израиля; «Меня будут почитать святым» естественно выражает это значение, не подразумевая, что Бог приобретает святость. Финальное מְקַדִּשְׁכֶם корректно передано как продолжающееся действие: «освящающий вас».'
