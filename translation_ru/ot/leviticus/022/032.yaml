base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: ru
  text: Не оскверняйте Моё святое имя, и среди сынов Израиля Меня будут почитать святым[a]. Я — Яхве, освящающий вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я явлю Свою святость»; буквально: «Я буду освящён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: оскверняйте
  rationale: Порода пиэль глагола חלל здесь означает лишать святости, обращаться со святым как с обыденным. «Осквернять» естественно передаёт культовый и богословский смысл.
- source_word: שֵׁם קָדְשִׁי
  choice: моего святого имени
  rationale: Естественная русская передача сочетания «имя моей святости», сохраняющая и понятие имени, и признак святости.
- source_word: וְנִקְדַּשְׁתִּי
  choice: Я буду освящён
  rationale: 'Форма нифаль допускает пассивный оттенок: Бог будет признан, явлен или почитаем святым. Формулировка также сохраняет связь с однокоренным מְקַדִּשְׁכֶם в конце стиха.'
- source_word: בְּתוֹךְ
  choice: среди
  rationale: 'Современная и точная передача пространственно-общественного значения: в среде народа Израиля.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Передача сохраняет грамматическую форму еврейского выражения; сноска поясняет, что это устойчивое обозначение всего народа Израиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, а не заменяющий его титул.
- source_word: מְקַדִּשְׁכֶם
  choice: освящающий вас
  rationale: Причастие выражает продолжающееся действие Бога и сохраняет однокоренную связь с «буду освящён».
theological_decisions:
- issue: Значение пассивной формы וְנִקְדַּשְׁתִּי применительно к Богу
  choice: Я буду освящён
  alternative: Я явлю Свою святость / Меня будут почитать святым
  rationale: Основной текст сохраняет пассивную форму и напряжение исходного выражения, а сноска раскрывает возможный смысл, не утверждая, будто Бог прежде не был свят.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: В исходном тексте стоит личное заветное имя; транслитерация позволяет не подменять его титулом.
- issue: Объём значения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: народа Израиля / израильтян
  rationale: Основной текст сохраняет форму оригинала, а сноска указывает на её собирательное значение для всего народа.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Запрет передан естественным русским императивом. Местоимения, относящиеся к Богу, в середине предложения пишутся со строчной буквы по современной издательской норме; «Я» имеет прописную букву как начало самостоятельной части предложения.
