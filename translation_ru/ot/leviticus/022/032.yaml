  terminology: «Яхве» точно передаёт тетраграмматон. «Святой», «почитать святым» и «освящающий» сохраняют словарную и тематическую связь קדשׁ. Буквальное «сынов Израиля» допустимо при поясняющей сноске о собирательном значении выражения.
