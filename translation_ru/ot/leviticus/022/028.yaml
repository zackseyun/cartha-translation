  text: וְ/שׁ֖וֹר אוֹ שֶׂ֑ה אֹת֣/וֹ וְ/אֶת בְּנ֔/וֹ לֹ֥א תִשְׁחֲט֖וּ בְּ/י֥וֹם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: ru
  text: Не закалывайте животное из крупного или мелкого скота[a] и его детёныша[b] в один и тот же день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское слово, переведённое как «животное из крупного скота», обозначает животное из крупного рогатого скота; слово, переведённое как «животное из мелкого скота», может обозначать овцу или козу.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его и его сына»; имеется в виду животное и его потомок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: животное из крупного скота
  rationale: Слово обозначает отдельное животное из крупного рогатого скота. Такое выражение по-русски не приписывает животному пол и не создаёт узкого значения «кастрированный вол».
- source_word: שֶׂה
  choice: животное из мелкого скота
  rationale: Слово может обозначать овцу или козу; обобщающее выражение сохраняет широту древнееврейского термина и соответствует контексту закона.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: его вместе с его детёнышем
  rationale: Буквально сказано «его и его сына». «Детёныш» естественно относится к животному и не уточняет пол потомства; «вместе» ясно передаёт совместное действие запрета, не меняя его объёма.
- source_word: תִשְׁחֲטוּ
  choice: не закалывайте
  rationale: Глагол обозначает ритуальное или хозяйственное заклание животного; «закалывать» точнее общего «убивать» и уместно в законодательном контексте.
- source_word: בְּיוֹם אֶחָד
  choice: в один и тот же день
  rationale: Буквально «в один день»; русское «в один и тот же день» естественно и недвусмысленно выражает запрет заколоть обоих в пределах одного дня.
- source_word: אוֹ
  choice: или
  rationale: Союз разделяет две категории жертвенного скота.
theological_decisions:
- issue: Пол взрослого животного и характер родства
  choice: Не уточнять, что взрослое животное является матерью; передать «его детёнышем».
  alternative: «Мать и её детёныша»
  rationale: Хотя практический смысл закона может предполагать родителя, древнееврейский текст грамматически говорит «его и его сына» и в этом стихе прямо не называет взрослое животное матерью. Перевод сохраняет эту недоопределённость.
translation_notes:
  register: 'Современный литературный русский язык, ясный законодательный стиль. Родовые выражения «животное из крупного или мелкого скота» выбраны ради точности: они избегают неоправданного уточнения пола и сохраняют охват овец и коз. Формула «в один и тот же день» идиоматична и передаёт смысл буквального «в один день».'
