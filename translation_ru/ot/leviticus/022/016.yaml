  source_fidelity: 'Начальная конструкция верно передаёт каузативный смысл וְהִשִּׂיאוּ: действия подразумеваемых священников навлекают вину на другую группу. Однако «когда те будут есть свои святыни» меняет и чрезмерно уточняет местоименную структуру: «те» искусственно противопоставляет группы, а «свои» привязывает святыни к едокам. В еврейском тексте сохраняются отдельные местоименные отсылки: «на них» и «их святыни». Более точно передать причинно-обстоятельственное בְּאָכְלָם через «за то, что они едят их святыни».'
