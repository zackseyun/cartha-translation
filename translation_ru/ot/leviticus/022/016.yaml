  terminology: «Яхве» последовательно передаёт יהוה. «Святыни» допустимо сохраняет широту קָדְשֵׁיהֶם; сноска поясняет, что имеются в виду освящённые доли или приношения. Финальное «освящающий их» корректно оставляет референт суффикса מְקַדְּשָׁם неуточнённым.
