  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: ru
  text: и тем навлекут на них вину, требующую возмещения,[a] за то, что они едят их святыни.[b] Ведь Я — Яхве, освящающий их.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и возложат на них вину». Еврейское выражение трудно для истолкования и может подчёркивать ответственность за проступок, требующий повинной жертвы.'
    reason: lexical_alternative
  - marker: b
    text: «Святыни» — освящённые доли или приношения.
    reason: cultural_note
  - marker: c
    text: 'Или: «делающий их святыми»; «посвящающий их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: и тем навлекут
  rationale: Каузативная форма глагола נשׂא передаёт значение «заставить нести, навлечь». Слова «и тем» естественно выражают связь с предшествующим запретом и его последствием.
- source_word: אוֹתָם
  choice: на них
  rationale: Местоименный суффикс передан как прямое указание на людей, которым в результате нарушения вменяется вина.
- source_word: עֲוֺן אַשְׁמָה
  choice: вину, требующую возмещения
  rationale: Сочетание עון и אשמה обозначает не только виновность, но и ответственность за культовое правонарушение, предполагающую возмещение или повинную жертву. Формулировка сохраняет юридико-культовой оттенок.
- source_word: בְּאָכְלָם
  choice: когда те будут есть
  rationale: Предлог ב с инфинитивом может обозначать обстоятельство или средство. В русском придаточное времени звучит естественно и в данном контексте сохраняет причинную связь с вкушением святынь.
- source_word: קָדְשֵׁיהֶם
  choice: свои святыни
  rationale: Буквально — «их святыни»; речь идёт об освящённых долях или приношениях. «Святыни» сохраняет широту еврейского выражения, а «свои» естественно передаёт возвратное притяжательное значение при подлежащем придаточной части.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: מְקַדְּשָׁם
  choice: освящающий их
  rationale: Причастие породы piel от קדשׁ означает «освящать, делать святым, посвящать». «Освящающий» сохраняет культовый и богословский регистр Левита.
theological_decisions:
- issue: К кому относится местоимение «их» в заключительной фразе
  choice: Оставить форму «освящающий их», с наиболее естественным отнесением к людям, о которых идёт речь
  alternative: Понимать «их» как указание на святыни
  rationale: Ближайший контекст предупреждает об ответственности людей в отношении святой пищи, поэтому отнесение к священникам или израильтянам наиболее естественно. Однако перевод не заменяет местоимение более узким толкованием и тем самым сохраняет синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным культово-правовым регистром. Местоименная структура намеренно не заменена поясняющими существительными, чтобы не устранять подлинную неоднозначность еврейского текста.
