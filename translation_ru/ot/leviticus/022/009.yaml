  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: ru
  text: Пусть они соблюдают Моё предписание[a], чтобы не навлечь на себя вины за это[b] и не умереть из-за этого[c], осквернив священное[d]. Я — Яхве, освящающий их[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мою стражу»; то есть вверенную им обязанность или установленное Мною предписание.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский оборот «нести грех» может также означать «навлечь на себя вину» или «понести ответственность за грех».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не умереть из-за этого».'
    reason: lexical_alternative
  - marker: d
    text: В еврейском тексте употреблено местоимение «его», без названного в этом стихе объекта. Его можно связывать с предписанием либо, в ближайшем контексте, со святой пищей. Глагол также может означать «обойтись как с обычным».
    reason: textual_ambiguity
  - marker: e
    text: 'Или: «делающий их святыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: пусть соблюдают
  rationale: Глагол שׁמר в культово-правовом контексте означает «соблюдать, хранить, исполнять». Конструкция «пусть соблюдают» естественно передаёт обязательное предписание.
- source_word: מִשְׁמַרְתִּי
  choice: порученное Мною
  rationale: Существительное обозначает вверенную обязанность или предписанное служение. Такая передача сохраняет оттенок порученной ответственности и звучит естественнее буквального «Моё поручение».
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: понести за это грех
  rationale: Сохранён образный еврейский оборот «нести грех», который может также означать навлечь на себя вину или понести ответственность за неё.
- source_word: וּמֵתוּ בוֹ
  choice: умереть вследствие этого
  rationale: Предлог בְּ связывает смерть с нарушением и допускает причинное понимание. «Вследствие этого» передаёт связь без чрезмерного уточнения её характера.
- source_word: יְחַלְּלֻהוּ
  choice: осквернят святыню
  rationale: חלל в священническом контексте означает лишить священного статуса, осквернить или обойтись как с обычным. Слово «святыня» делает фразу понятной по-русски, тогда как сноска сохраняет неопределённость местоименного объекта в еврейском тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מְקַדְּשָׁם
  choice: освящающий их
  rationale: Причастие от קדשׁ представляет Яхве как Того, кто отделяет священников для святости; «освящающий» сохраняет ключевую лексику святости книги Левит.
theological_decisions:
- issue: К чему относятся местоимения в выражениях «за это», «вследствие этого» и при глаголе «осквернят»
  choice: В основном тексте причинные местоименные связи оставлены широкими, а объект глагола передан контекстуально как «святыня» с поясняющей сноской.
  alternative: Отнести все местоимения строго к поручению Яхве либо конкретно к святой пище из ближайшего контекста.
  rationale: В еврейском стихе употреблены местоименные формы без повторения определяемого существительного. Контекст допускает связь как с вверенной обязанностью, так и со святынями, прежде всего со святой пищей; сноска не позволяет русскому тексту скрыть эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным правовым и культовым регистром. Формула «Я — Яхве» сохраняет краткость и вес заключительного божественного самообозначения.
