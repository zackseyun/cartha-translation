source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: ru
  text: 'Скажи им: «Во все ваши поколения: всякий мужчина из числа ваших потомков, который приблизится к священным дарам, которые сыны Израиля посвящают Яхве, когда на нём остаётся нечистота, — тот человек будет отсечён[a] от Моего присутствия.[b] Я — Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Будет отсечён» — устойчивая формула заветного наказания; каким именно образом человек удаляется, в самом выражении не уточняется.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «от Моего лица».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: Скажи им
  rationale: Прямо передаёт повелительное наклонение единственного числа и адресата во множественном числе.
- source_word: לְדֹרֹתֵיכֶם
  choice: во все ваши поколения
  rationale: Сохраняет устойчивую заветно-правовую формулу о действии установления в последующих поколениях.
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: всякий мужчина из числа ваших потомков, который
  rationale: Контекст обращён к священническому потомству; «мужчина» сохраняет форму אִישׁ, а «из числа ваших потомков» естественно передаёт родовое значение זֶרַע.
- source_word: יִקְרַב
  choice: приблизится
  rationale: Сохраняет пространственно-ритуальное значение корня קרב, не уточняя сверх текста, идёт ли речь о прикосновении, вкушении или служении.
- source_word: הַקֳּדָשִׁים
  choice: святыни
  rationale: Ёмкое русское культовое обозначение посвящённых Богу предметов и приношений без неоправданного сужения значения.
- source_word: יַקְדִּישׁוּ
  choice: посвящаемым
  rationale: Передаёт каузативное значение «делать святым, посвящать» и согласуется с общим, повторяющимся характером предписания.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет формальное этническое наименование исходного текста и его торжественно-правовой регистр.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה, а не заменяет его титулом.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: пока на нём нечистота
  rationale: Сохраняет образ нечистоты, пребывающей «на» человеке, и естественно выражает сопутствующее обстоятельство.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: тот человек будет отсечён
  rationale: «Человек» идиоматически передаёт נֶפֶשׁ в правовой формуле, а «будет отсечён» сохраняет традиционную неопределённость наказания כרת.
- source_word: מִלְּפָנַי
  choice: от Моего присутствия
  rationale: Передаёт буквальный образ удаления «от Моего лица» естественным современным русским выражением, сохраняя отношение к Божьему присутствию.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Сохраняет краткую формулу божественного самообъявления и её особую emphatic силу.
theological_decisions:
- issue: Значение формулы וְנִכְרְתָה («будет отсечён»)
  choice: Формула сохранена без уточнения способа наказания.
  alternative: «будет предан смерти», «будет исключён из общины» или «будет лишён места среди народа»
  rationale: Сам стих не определяет, означает ли כרת непосредственную смерть, Божью кару, исключение или иную форму удаления; конкретизация сняла бы подлинную правовую и богословскую неоднозначность.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное заветное имя Бога; транслитерация «Яхве» отличает его от титула и соответствует заданной терминологической политике.
- issue: Смысл מִלְּפָנַי
  choice: от Моего присутствия
  alternative: от Моего лица
  rationale: Фраза может обозначать удаление от Божьего лица или присутствия; основной текст передаёт смысл естественно, а буквальный образ отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством священно-правовой речи. Синтаксис сохранён как единый условно-правовой период, но упорядочен для ясного чтения. Термины «святыни», «нечистота» и «отсечён» поддерживают культовый и заветный регистр; кавычки обозначают передаваемую Моисеем прямую речь.
