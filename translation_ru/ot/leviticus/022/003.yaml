revisions:
- from: 'Скажи им: «Во все ваши поколения всякий мужчина из числа ваших потомков, который приблизится к святыням, посвящаемым сынами Израиля Яхве, пока на нём нечистота, — тот человек будет отсечён[a] от Моего присутствия.[b] Я — Яхве».'
  to: 'Скажи им: «Во все ваши поколения: всякий мужчина из числа ваших потомков, который приблизится к священным дарам, которые сыны Израиля посвящают Яхве, когда на нём остаётся нечистота, — тот человек будет отсечён[a] от Моего присутствия.[b] Я — Яхве».'
  rationale: Уточнено обозначение הַקֳּדָשִׁים как «священные дары», чтобы избежать понимания как священных мест и сохранить культовый контекст. Относительное предложение сделано явным, а состояние нечистоты передано как продолжающееся («остаётся»). Неоднозначная формула כרת и образ удаления «от лица» сохранены без конфессионального истолкования.
