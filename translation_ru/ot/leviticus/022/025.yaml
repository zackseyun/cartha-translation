  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: ru
  text: И от иноземца не приносите ничего из этого как пищу вашему Богу[a], ибо они повреждены, у них есть изъян[b]; они не будут приняты ради вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлеб вашего Бога». Здесь «хлеб» — еврейское жертвенное выражение, обозначающее пищу, приносимую Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «порок». Еврейское слово обозначает недостаток, из-за которого животное непригодно для жертвоприношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: И из рук
  rationale: Сохраняет образ еврейского оборота «из руки», обозначающего источник, и естественно звучит по-русски во множественном числе.
- source_word: בֶּן נֵכָר
  choice: иноземца
  rationale: Еврейское выражение буквально означает «сын чужеземца» и служит обозначением человека из другого народа; «иноземец» передаёт смысл кратко и без устаревшего «иноплеменник».
- source_word: תַקְרִיבוּ
  choice: не приносите
  rationale: В жертвенном контексте каузатив глагола קרב означает подносить или приносить Богу; «приносить» — естественный русский культовый термин.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: в пищу вашему Богу
  rationale: Хотя לֶחֶם буквально значит «хлеб», в священнической жертвенной речи слово шире обозначает пищу, приносимую Богу. Предлог «в» позволяет естественно связать выражение с животными, которые нельзя приносить как жертвенную пищу.
- source_word: מִכָּל אֵלֶּה
  choice: ничего из этого
  rationale: Передаёт разделительное значение מִן при כָּל и отсылает к перечисленным ранее животным с изъянами.
- source_word: מָשְׁחָתָם
  choice: в них повреждение
  rationale: Слово может обозначать повреждённость, порчу или обезображенность. «Повреждение» сохраняет общий характер выражения и избегает современного оккультного оттенка русского слова «порча».
- source_word: מוּם
  choice: изъян
  rationale: Обозначает телесный недостаток, делающий жертвенное животное непригодным. «Изъян» ясен современному читателю и подходит к культовому контексту.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: они не будут приняты ради вас
  rationale: Передаёт страдательное значение «быть благосклонно принятым» и сохраняет לָכֶם — отнесённость принятия жертвы к тем, за кого или от кого она приносится.
theological_decisions:
- issue: Культовое значение выражения לֶחֶם אֱלֹהֵיכֶם
  choice: в пищу вашему Богу
  alternative: как хлеб вашего Бога
  rationale: Речь идёт о жертвенных животных, поэтому «пища» передаёт священническую метафору шире буквального хлеба, не добавляя доктринального толкования.
- issue: Отнесённость принятия жертвы в לֹא יֵרָצוּ לָכֶם
  choice: не будут приняты ради вас
  alternative: не будут вам угодны; не снискают вам благоволения
  rationale: Формулировка сохраняет напряжение между принятием самой жертвы и её принятием в отношении приносителей, не сводя оборот исключительно к субъективной угодности или гарантированному результату.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм «в них повреждение, в них изъян» сохраняет повтор и смысловую напряжённость еврейского текста; терминология остаётся понятной без конфессионально окрашенных уточнений.
