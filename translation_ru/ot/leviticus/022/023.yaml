source:
  edition: WLC
  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: ru
  text: Но быка или овцу с чрезмерно длинной или слишком короткой конечностью[a] можно принести как добровольную жертву, но во исполнение обета такое животное принято не будет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более обобщённо: «с телесной деформацией или недоразвитием». Еврейские слова, вероятно, обозначают противоположные виды несоразмерности частей тела.'
    reason: Лексическое значение обоих редких обозначений физических изъянов не вполне определённо.
lexical_decisions:
- source_word: וְשׁוֹר
  choice: быка
  rationale: שׁוֹר обозначает животное крупного рогатого скота; в контексте жертвенного законодательства естественно конкретное единственное число «бык».
- source_word: וָשֶׂה
  choice: или овцу
  rationale: שֶׂה — животное из мелкого скота, овца либо коза. В данном противопоставлении крупному скоту «овца» служит естественным родовым обозначением, хотя еврейское слово шире.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: с одной конечностью слишком длинной, а другой слишком короткой
  rationale: 'Парные термины, вероятно, описывают противоположные виды телесной несоразмерности: чрезмерно вытянутую и укороченную часть тела. Формулировка делает вероятный смысл понятным, а лексическая неопределённость отмечена в сноске.'
- source_word: נְדָבָה
  choice: добровольную жертву
  rationale: נְדָבָה означает добровольное приношение, не обусловленное обязательством по обету.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: можно принести
  rationale: Буквально «сделаешь его»; в жертвенном контексте по-русски естественно передать разрешение как «можно принести».
- source_word: וּלְנֵדֶר
  choice: но во исполнение обета
  rationale: נֵדֶר обозначает обет и связанное с ним обязательное приношение; перевод ясно противопоставляет его добровольной жертве.
- source_word: לֹא יֵרָצֶה
  choice: принято не будет
  rationale: Нифаль глагола רצה в жертвенном контексте выражает благосклонное принятие жертвы; пассивная формулировка сохраняет форму и не добавляет прямо не названного субъекта.
theological_decisions:
- issue: Точный характер изъянов שָׂרוּעַ и קָלוּט
  choice: Передать как слишком длинную и слишком короткую конечности.
  alternative: «уродливое или недоразвитое»; «с несоразмерно большой или малой частью тела»
  rationale: В контексте перечисления физических недостатков эти слова, вероятнее всего, обозначают противоположные виды несоразмерности. Конкретный перевод сохраняет образность, а сноска — подлинную лексическую неопределённость.
- issue: Кем принимается жертва
  choice: Сохранить пассивное «принято не будет».
  alternative: «Господь её не примет»
  rationale: В еврейском тексте субъект не выражен. Пассивная конструкция передаёт культовый смысл, не внося явного уточнения в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией, подходящей законодательному тексту. Термины жертвенного культа переданы понятно и без конфессионально окрашенных уточнений.
