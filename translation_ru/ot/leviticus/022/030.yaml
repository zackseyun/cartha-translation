source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: ru
  text: В тот же день[a] его следует съесть; не оставляйте от него ничего до утра. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тот день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: в тот же день
  rationale: Буквально «в тот день»; частица «же» естественно передаёт контекстуально подразумеваемое ограничение тем самым днём, когда принесена жертва.
- source_word: יֵאָכֵל
  choice: её следует съесть
  rationale: Нифаль imperfect выражает пассивно-безличное предписание. Русская конструкция сохраняет нормативную силу и звучит естественнее буквального «она будет съедена».
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  choice: не оставляйте от неё ничего
  rationale: Хифиль от יתר означает «оставлять, сохранять остаток»; сочетание с מִמֶּנּוּ передано естественным русским запретом без добавления нового смысла.
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Обычное временное выражение, запрещающее сохранять жертвенную пищу на ночь.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Именное древнееврейское предложение передано с тире; тетраграмматон воспроизведён как личное имя «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Род местоимения при מִמֶּנּוּ
  choice: её / неё
  alternative: это / от этого
  rationale: По контексту речь идёт о жертве благодарения (זֶבַח תּוֹדָה, ст. 29), поэтому женский род естественно соотносится с русским словом «жертва», хотя в самом стихе предмет явно не назван.
translation_notes:
  register: Современный литературный русский язык с краткой нормативной формулировкой. Сохранены пассивно-безличный характер предписания, прямой запрет и заключительная формула самоидентификации. Местоимение женского рода опирается на ближайший контекст (жертва благодарения в ст. 29).
