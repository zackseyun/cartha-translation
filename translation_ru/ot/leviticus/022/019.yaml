  source_fidelity: 'לִרְצֹנְכֶם буквально относится к «вашему принятию/обретению благоволения», то есть к принимающему жертву лицу, а не прямо к жертве как субъекту принятия. Остальные элементы переданы точно: תָּמִים — отсутствие телесного изъяна, זָכָר — самец, три группы животных сохранены.'
