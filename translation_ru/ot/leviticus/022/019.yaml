translation:
  language: ru
  text: Чтобы обрести благоволение, пусть это будет самец без изъяна из крупного рогатого скота, овец или коз.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: Чтобы жертва была принята благосклонно
  rationale: Передаёт культовый смысл принятия жертвы с благоволением. Слово «жертва» восстановлено из непосредственного контекста, поскольку еврейская фраза продолжает предыдущее предложение.
- source_word: תָּמִים
  choice: без изъяна
  rationale: В контексте жертвенного животного означает физическую неповреждённость и отсутствие порока; эта формулировка точнее и естественнее, чем морально окрашенное «непорочный».
- source_word: זָכָר
  choice: самец
  rationale: Прямое и естественное обозначение животного мужского пола.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: из крупного рогатого скота, овец или коз
  rationale: Сохраняет три названные категории животных и естественно передаёт повторяющийся еврейский предлог.
theological_decisions:
- issue: Значение לִרְצֹנְכֶם
  choice: принята благосклонно
  alternative: по вашей воле / по вашему желанию
  rationale: В законодательстве о жертвах выражение указывает прежде всего на благосклонное принятие приношения, а не просто на добровольное желание приносящего. Формулировка не уточняет сверх текста, кем именно и в каком богословском смысле осуществляется принятие.
translation_notes:
  register: Современный литературный русский язык с достоинством культового предписания. Конструкция «пусть это будет» сохраняет предписывающий характер краткой еврейской фразы, а добавление «жертва» делает зависимость от контекста ясной без изменения смысла.
