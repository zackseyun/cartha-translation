  terminology: «Самец без изъяна» — точное и естественное культовое обозначение. «Крупный рогатый скот, овцы или козы» корректно передаёт перечисление. «Обрести благоволение» передаёт культовую функцию לִרְצֹנְכֶם, не определяя сверх текста, чьё именно это благоволение.
