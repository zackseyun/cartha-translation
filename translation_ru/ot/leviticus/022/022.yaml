reference: Leviticus 22:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: ru
  text: 'Не приносите Яхве животных: слепых, с переломами, изувеченных, с бородавками, струпьями или кожной болезнью; и ничего из них не возлагайте на жертвенник как огненную жертву[a] Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву-пищу»; также: «жертву, сжигаемую на огне».'
    reason: Еврейское אִשֶּׁה — специальный жертвенный термин. Основная передача отражает обычную связь термина с огнём, а примечание сохраняет функциональное понимание «жертва-пища» и описательную альтернативу.
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: слепое
  rationale: Форма обозначает животное со слепотой; краткое прилагательное естественно открывает перечень пороков.
- source_word: שָׁבוּר
  choice: с переломом
  rationale: Причастие указывает на сломанную часть тела или конечность. Русское «с переломом» ясно передаёт физический порок и не создаёт неестественного образа «сломанного животного».
- source_word: חָרוּץ
  choice: изувеченное
  rationale: Слово связано с разрезом или рассечением тела и здесь обозначает серьёзное телесное повреждение; «изувеченное» передаёт смысл без неоправданной анатомической конкретизации.
- source_word: יַבֶּלֶת
  choice: с бородавкой
  rationale: Существительное обозначает ненормальный кожный нарост; «бородавка» — ясный современный эквивалент.
- source_word: גָרָב
  choice: струпьями
  rationale: Термин обозначает видимое кожное поражение; множественная русская форма естественна в описании состояния животного. Возможны также более специальные толкования вроде чесотки.
- source_word: יַלֶּפֶת
  choice: кожной болезнью
  rationale: Точное дерматологическое значение неясно, поэтому выбран общий эквивалент без ложной медицинской точности.
- source_word: תַקְרִיבוּ
  choice: приносите
  rationale: В жертвенном контексте Hiphil от קרב означает представить или принести Богу; «приносить» естественно и сохраняет культовый смысл.
- source_word: אֵלֶּה
  choice: таких
  rationale: Указательное местоимение отсылает к перечисленным животным; русское «таких» ясно выражает эту связь.
- source_word: וְאִשֶּׁה
  choice: как жертву-пищу
  rationale: В священнической лексике термин может обозначать жертву, представленную Богу как пища и предаваемую огню. Дефисное сочетание отличает её от хлебного приношения; традиционное понимание «огненная жертва» сохранено в примечании.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: не возлагайте их на жертвенник
  rationale: Оборот буквально говорит о помещении чего-либо из них на жертвенник; «возлагать» естественно для возвышенного культового контекста.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, а не заменяющий его титул; дательный смысл предлога в русском выражен беспредложной формой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. «Яхве» сохраняет личное имя Бога и наиболее вероятную научную реконструкцию его произношения.
- issue: Передача жертвенного термина אִשֶּׁה
  choice: жертва-пища
  alternative: огненная жертва; жертва, сжигаемая на огне
  rationale: Слово допускает понимание как жертвы, связанной с огнём, тогда как в священническом контексте оно также осмысляется как пища, приносимая Богу. Основной текст передаёт последнее, а примечание сохраняет традиционную альтернативу и подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Перечень сохранён компактным, но синтаксис адаптирован для естественного русского чтения. Неопределённость названий кожных поражений и термина אִשֶּׁה не устранена искусственно.
