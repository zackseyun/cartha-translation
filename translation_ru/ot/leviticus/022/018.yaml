revisions:
- from: 'Скажи Аарону, его сыновьям и всем сынам Израиля[a]: «Если кто-нибудь из дома Израиля или из живущих среди Израиля переселенцев принесёт своё приношение — по какому-либо обету или как добровольный дар[b] — и вознесёт его Яхве как всесожжение,'
  to: 'Скажи Аарону, его сыновьям и всем сынам Израиля[a] и передай им: «Если кто-нибудь из дома Израиля или из переселенцев, живущих в Израиле, принесёт Яхве всесожжение — приношение по какому-либо обету или добровольный дар[b], —'
  rationale: Заключительная конструкция перестроена так, чтобы «всесожжение» прямо характеризовало приношение Яхве, а не выглядело как добавленное второе действие. «Переселенцы, живущие в Израиле» точнее и естественнее передаёт гֶּר בְּיִשְׂרָאֵל. Неоднозначность связи приношения с обетом и добровольным даром сохранена в сноске.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:45:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы адресаты, различие между «домом Израиля» и גֵּר, принесение приношения, обеты/добровольные приношения, имя Яхве и термин «всесожжение». Однако союз «и вознесёт его» создаёт в русском два последовательных действия, тогда как в еврейском последняя относительная конструкция характеризует приношения как приносимые Яхве во всесожжение. Формулировка «среди Израиля» также неудачна: בְּיִשְׂרָאֵל означает «в Израиле», то есть среди израильской общины.'
  naturalness: Современный литературный регистр в основном выдержан. «Из живущих среди Израиля переселенцев» звучит тяжеловесно и семантически неточно; «из переселенцев, живущих в Израиле» естественнее. Перестройка заключительной части устраняет искусственную последовательность «принесёт ... и вознесёт».
  terminology: «Сыны Израиля», «дом Израиля», «переселенцы», «приношение», «добровольный дар», «Яхве» и «всесожжение» допустимы. В основном тексте следует яснее показать, что «добровольный дар» здесь является видом приношения; сноска сохраняет возможное более техническое понимание обоих выражений как видов приношений.
  issues:
  - severity: medium
    issue: Заключительное «и вознесёт его Яхве как всесожжение» добавляет последовательное действие.
    rationale: В еврейском тексте после «его приношение» следуют выражения об обетах и добровольных приношениях и относительное «которые они приносят Яхве во всесожжение». Это не следует представлять как отдельный второй этап после принесения приношения.
  - severity: low
    issue: «Живущих среди Израиля переселенцев» неточно и стилистически тяжеловесно.
    rationale: גֵּר בְּיִשְׂרָאֵל — переселенец, живущий в Израиле/среди израильской общины; «среди Израиля» по-русски может ошибочно восприниматься как местоположение внутри страны или народа как территории.
