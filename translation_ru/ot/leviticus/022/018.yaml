source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: ru
  text: 'Скажи Аарону, его сыновьям и всем сынам Израиля[a] и передай им: «Если кто-нибудь из дома Израиля или из переселенцев, живущих в Израиле, принесёт Яхве всесожжение — приношение по какому-либо обету или добровольный дар[b], —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем израильтянам». Буквально: «всем сынам Израиля».'
    reason: 'Лексическая альтернатива: формальное родственное выражение допускает идиоматическую передачу названием народа.'
  - marker: b
    text: 'Или: «приношение во исполнение какого-либо обета или как добровольное приношение». Еврейское выражение может обозначать как обеты и добровольные дары, так и приношения, связанные с ними.'
    reason: Сохранение смысловой неоднозначности культовой терминологии.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Скажи
  rationale: Пиэль, повелительное наклонение; в современном русском «скажи» естественно вводит прямое Божье повеление.
- source_word: בָּנָיו
  choice: его сыновьям
  rationale: Еврейское слово обозначает именно сыновей; в данном священническом контексте мужское обозначение существенно.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: всем сынам Израиля
  rationale: Сохранены родственная образность и формальная структура устойчивого еврейского выражения; идиоматический вариант отмечен в сноске.
- source_word: אִישׁ אִישׁ
  choice: если кто-нибудь
  rationale: Повтор существительного имеет дистрибутивное значение «всякий, кто»; условная русская конструкция естественно соответствует незавершённому законодательному предложению.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: из дома Израиля
  rationale: Сохранено значимое заветно-родовое выражение, а не сведено к общему «израильтянин».
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: из живущих среди Израиля переселенцев
  rationale: גֵּר — не просто незнакомец, а пришлый человек, постоянно живущий внутри общины; собирательное единственное передано естественным русским множественным числом.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: принесёт своё приношение
  rationale: В жертвенном контексте Hiphil קרב означает представить или принести дар; сочетание избегает неестественного буквального «приблизит».
- source_word: לְכָל נִדְרֵיהֶם
  choice: по какому-либо обету
  rationale: Передаёт связь приношения с обетом, не утверждая сверх текста, является ли נדר здесь самим обетом или метонимически обетным приношением.
- source_word: נִדְבוֹתָם
  choice: как добровольный дар
  rationale: Передана установленная культовая категория добровольного, не обязательного приношения.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным заветным именем, а не заменён титулом.
- source_word: לְעֹלָה
  choice: как всесожжение
  rationale: «Всесожжение» — точный и устоявшийся русский термин для жертвы עֹלָה, сжигаемой целиком.
theological_decisions:
- issue: Дистрибутивное мужское выражение אִישׁ אִישׁ
  choice: если кто-нибудь
  alternative: всякий мужчина
  rationale: В законодательном контексте выражение имеет обобщённо-дистрибутивную функцию. Русское «кто-нибудь» не вводит необоснованного ограничения пола, тогда как адресат и культовый контекст остаются явными.
- issue: Божественное имя יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передача личного имени сохраняет различие между Тетраграмматоном и титулом אֲדֹנָי.
- issue: Значение לְכָל נִדְרֵיהֶם
  choice: по какому-либо обету
  alternative: как какое-либо обетное приношение
  rationale: Основной текст сохраняет возможность понимать נדר как обет, не скрывая того, что в жертвенном контексте слово может метонимически обозначать связанное с обетом приношение.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис перестроен в естественную условную конструкцию; финальная запятая показывает, что предписание продолжается в следующем стихе. Архаизм «сыны Израиля» сохранён точечно ради исходной родственной образности, а более идиоматический вариант дан в сноске.
