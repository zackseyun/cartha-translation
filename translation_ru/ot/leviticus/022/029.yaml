base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: ru
  text: Когда вы приносите Яхве благодарственную жертву[a], приносите её так, чтобы она была принята в вашу пользу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву благодарения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Когда
  rationale: В законодательном контексте сочетание вводит обстоятельство, при котором действует предписание. Русское «когда» естественно передаёт условно-временной смысл, не превращая действие в чисто гипотетическое.
- source_word: תִזְבְּחוּ
  choice: приносите
  rationale: Глагол זבח обозначает совершение жертвоприношения. В данном культовом контексте «приносите» звучит естественнее узкого «закалываете», при этом слово «жертва» ясно сохраняет жертвенный смысл.
- source_word: זֶבַח תּוֹדָה
  choice: благодарственную жертву
  rationale: Сопряжённое сочетание обозначает жертву, выражающую благодарение. Этот вариант краток, понятен и соответствует принятой русской культовой лексике; более развёрнутый вариант указан в примечании.
- source_word: לַ/יהוָה
  choice: Яхве
  rationale: Предлог ל передаёт посвящение жертвы Богу, а тетраграмматон воспроизводится как личное имя «Яхве».
- source_word: לִֽ/רְצֹנְ/כֶם
  choice: так, чтобы она была принята ради вас
  rationale: В жертвенном контексте רָצוֹן указывает не на субъективное желание приносящих, а на принятие жертвы и связанное с этим Божье благоволение к ним. Формулировка остаётся ясной по-русски и сохраняет направленность действия на пользу приносящих.
- source_word: תִּזְבָּחוּ
  choice: приносите её
  rationale: Повтор глагола сохранён ради еврейского акцента на предписанном способе принесения; местоимение «её» естественно отсылает к благодарственной жертве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное заветное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл לִרְצֹנְכֶם в жертвенном предписании
  choice: так, чтобы она была принята ради вас
  alternative: по вашей воле; добровольно
  rationale: Ближайший культовый контекст и параллельное употребление указывают на приемлемость жертвы перед Богом ради приносящих, а не на их личное предпочтение. При этом перевод не уточняет сверх текста, каким именно образом принятие жертвы относится к людям.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной культовой терминологией. Повтор «приносите» намеренно сохраняет риторическую структуру еврейского предписания; форма множественного числа отражает обращение к общине.
