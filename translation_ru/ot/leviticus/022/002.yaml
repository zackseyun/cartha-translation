id: LEV.22.2
reference: Leviticus 22:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: ru
  text: Скажи Аарону и его сыновьям, чтобы они воздерживались[a] от святынь сынов Израиля[b], которые те посвящают Мне[c], и не оскверняли Моего святого имени. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «держались в стороне»; «отделялись».'
    reason: lexical_alternative
  - marker: b
    text: '«Сыны Израиля» — буквальная древнееврейская формула; по смыслу: «израильтян» или «народа Израиля».'
    reason: lexical_alternative
  - marker: c
    text: То есть речь идёт о святынях, которые израильтяне посвящают Яхве.
    reason: clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: Скажи
  rationale: Повелительная форма глагола דבר вводит Божье поручение Моисею. «Скажи» естественно звучит по-русски и точно передаёт направленность речи к Аарону и его сыновьям.
- source_word: וְיִנָּזְרוּ
  choice: чтобы они воздерживались
  rationale: Нифаль глагола נזר выражает отделение от чего-либо или воздержание. В данном культовом контексте «воздерживались» ясно передаёт требование не прикасаться к святыням и не пользоваться ими в состоянии, исключающем священнослужение.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: от святынь сынов Израиля
  rationale: «Святыни» сохраняет широту קָדְשֵׁי и не сужает значение до одних лишь приношений. Формула «сыны Израиля» передаёт традиционное национально-заветное обозначение בְנֵי יִשְׂרָאֵל.
- source_word: יְחַלְּלוּ
  choice: оскверняли
  rationale: Пиэль глагола חלל в контексте святости означает лишать священного почтения, профанировать. «Осквернять» — понятный современному читателю глагол возвышенного библейского регистра.
- source_word: שֵׁם קָדְשִׁי
  choice: Моего святого имени
  rationale: Естественная русская передача сочетания «имя Моей святости / Моё святое имя», сохраняющая богословскую значимость Божьего имени.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: которые те посвящают Мне
  rationale: Относительное придаточное переставлено ближе к «святыням», чтобы в русском оно не было ошибочно понято как определение к «имени». Указательное «те» отличает сынов Израиля от Аарона и его сыновей.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом «Господь».
theological_decisions:
- issue: К чему относится придаточное אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: К святыням, которые сыны Израиля посвящают Яхве
  alternative: К Божьему святому имени, которое сыны Израиля освящают
  rationale: По контексту предметом посвящения Богу служат святыни Израиля; такое прочтение также объясняет, почему недолжное обращение священников с ними оскверняет Божье имя. Перестановка придаточного в русском делает эту синтаксическую связь ясной, не добавляя нового содержания.
- issue: Смысл требования וְיִנָּזְרוּ
  choice: Священники должны воздерживаться от святынь при обстоятельствах, делающих обращение с ними недопустимым
  alternative: Священники должны вообще и постоянно держаться вдали от всех святынь
  rationale: Последующие стихи определяют состояния ритуальной нечистоты, при которых действует запрет. Сам стих сформулирован широко, поэтому конкретное условие не вставлено в основной текст.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Сохранены культовые термины «святыни», «посвящают» и «оскверняли», но синтаксис сделан естественным и прозрачным. Личные местоимения, относящиеся к Богу, написаны с прописной буквы; личное имя יהוה передано как «Яхве».
