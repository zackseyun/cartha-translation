id: LEV.22.13
reference: Leviticus 22:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: ru
  text: Но если дочь священника овдовеет или будет разведена, и у неё не будет потомства, и она вернётся в дом своего отца, как в юности, то сможет есть пищу своего отца[a]. Но никто из посторонних[b] не должен есть её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб своего отца». Здесь «хлеб», вероятно, означает пищу священнического дома в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не имеющих права». Еврейское слово обозначает человека вне допущенного священнического круга, а не обязательно чужеземца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן
  choice: Но если дочь священника
  rationale: Союз ו в контексте противопоставляет этот случай предыдущему предписанию, а כִּי вводит условие; русское «Но если» естественно передаёт правовую связь.
- source_word: אַלְמָנָה וּגְרוּשָׁה
  choice: овдовеет или будет разведена
  rationale: Хотя между обозначениями стоит ו, здесь перечислены альтернативные обстоятельства, а не требование одновременного статуса вдовы и разведённой.
- source_word: וְזֶרַע אֵין לָהּ
  choice: и у неё не будет потомства
  rationale: זֶרַע буквально означает «семя», но в семейно-правовом контексте обозначает потомство; это шире, чем только один ребёнок.
- source_word: וְשָׁבָה אֶל בֵּית אָבִיהָ כִּנְעוּרֶיהָ
  choice: и она вернётся в дом своего отца, как в юности
  rationale: Формулировка сохраняет идею возвращения в прежнее положение в отцовском доме, не добавляя отсутствующего в тексте уточнения о брачном статусе.
- source_word: מִלֶּחֶם אָבִיהָ תֹּאכֵל
  choice: то сможет есть пищу своего отца
  rationale: לֶחֶם буквально «хлеб», но здесь метонимически обозначает пищевые припасы священнического дома; «сможет» передаёт юридическое дозволение.
- source_word: וְכָל זָר לֹא יֹאכַל בּוֹ
  choice: Но никто из посторонних не должен есть её
  rationale: זָר в священническом законодательстве — лицо вне допущенного круга, а не обязательно иноплеменник. Местоимение «её» относится к пище.
theological_decisions:
- issue: Значение «хлеба отца» в законе о священнической пище
  choice: «пища своего отца»
  alternative: «хлеб своего отца»
  rationale: Контекст главы касается допуска к святыням и пище священнического дома. Более широкое «пища» ясно передаёт метонимический смысл, не уточняя сверх текста конкретный вид пищи.
- issue: Круг лиц, обозначенный словом זָר
  choice: «посторонние»
  alternative: «чужеземцы» или «не имеющие права»
  rationale: Запрет основан на принадлежности к разрешённому священническому кругу, а не на этническом происхождении; при этом «посторонние» сохраняет лаконичность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского текста. Синтаксис сохранён близким к последовательности еврейского условия, но адаптирован для ясного русского чтения.
