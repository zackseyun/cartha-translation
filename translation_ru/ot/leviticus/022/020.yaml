  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: ru
  text: Не приносите ничего с изъяном[a], потому что это не будет принято в вашу пользу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с недостатком». Здесь имеется в виду физический изъян, из-за которого животное непригодно для жертвоприношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет вам в благоволение»; то есть не будет принято благосклонно по отношению к вам. Еврейское выражение обозначает благоприятное принятие приношения в отношении приносящих.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: ничего, что имеет изъян
  rationale: 'Сочетание выражает всеобъемлющий запрет: буквально «всё, в чём есть изъян». Русская конструкция с «ничего» естественно сочетается с отрицательным повелением и сохраняет полноту запрета.'
- source_word: מוּם
  choice: изъян
  rationale: В жертвенном законодательстве слово обозначает физический недостаток, делающий животное непригодным для приношения. «Изъян» сохраняет специальный оттенок и понятно современному читателю.
- source_word: לֹא תַקְרִיבוּ
  choice: не приносите
  rationale: Порода hифиль от קרב в жертвенном контексте означает принести или представить как приношение. «Приносить» — естественный и точный русский жертвенный термин.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета; «потому что» ясно передаёт причинную связь.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: такая жертва не будет принята ради вас
  rationale: לְרָצוֹן указывает на благоприятное принятие приношения, а לָכֶם — на его принятие в интересах или от лица приносящих. Добавление «такая жертва» естественно проясняет подразумеваемый референт, не меняя смысла.
theological_decisions:
- issue: Язык культовой приемлемости
  choice: не будет принята ради вас
  alternative: не будет угодна за вас; не будет принята от вас
  rationale: Формулировка передаёт не только соответствие жертвы требованиям, но и её благоприятное принятие в отношении приносящих. «Ради вас» сохраняет направленность לָכֶם, не уточняя сверх текста точный характер этой связи.
translation_notes:
  register: Современный литературный русский язык с краткой и ясной формой законодательного предписания. Слово «изъян» сохраняет жертвенно-культовой оттенок без архаизации; неоднозначность לָכֶם вынесена в сноску.
