lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма глагола דבר с последовательным ו вводит новое речевое событие. В современной русской формуле перед прямой речью «сказал» звучит естественнее, чем более буквальное «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» служит формульным введением последующей прямой речи. В современном русском эту функцию естественно и точно выполняет двоеточие, без тяжеловесного «сказав» или «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом; вариант «Иегова» отмечен в сноске как традиционная альтернативная передача.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой и торжественной библейской формулы. Двоеточие передаёт функцию לֵאמֹר и показывает, что содержание речи следует далее.
