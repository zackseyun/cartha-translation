  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; также передаётся как «Иегова».'
