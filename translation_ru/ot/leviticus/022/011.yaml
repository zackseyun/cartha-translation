id: LEV.22.11
reference: Leviticus 22:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: ru
  text: Если же священник купит человека в собственность за свои деньги[a], тот может есть эту пищу[b]; и родившиеся в его доме могут есть его пищу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека — приобретение за его серебро», то есть человека, купленного за его деньги.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тот может есть от неё (или: от этого)»; речь идёт о священной пище, о которой говорится в контексте.'
    reason: contextual_clarification
  - marker: c
    text: 'Буквально: «его хлеб»; слово «хлеб» здесь, вероятно, обозначает пищу вообще, в частности положенную священнику священную пищу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: Если же священник
  rationale: Сочетание продолжает ряд правовых случаев и противопоставляет этот случай запрету предыдущего стиха; условное «если» естественно передаёт כִּי в данном контексте.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: купит человека
  rationale: קנה здесь означает приобретение посредством покупки, а נֶפֶשׁ обозначает человека, а не нематериальную душу.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: в собственность за свои деньги
  rationale: Перевод открыто сохраняет выраженный в еврейском тексте имущественно-правовой статус приобретённого человека и не смягчает его до общего обозначения слуги.
- source_word: הוּא יֹאכַל בּוֹ
  choice: тот может есть эту пищу
  rationale: Указательное «тот» недвусмысленно отсылает к купленному человеку. Разрешительное «может» соответствует функции имперфекта в правовом предписании, а «эту пищу» проясняет контекстуальный референт местоименного суффикса.
- source_word: וִילִיד בֵּיתוֹ
  choice: родившиеся в его доме
  rationale: Выражение обозначает людей, рождённых внутри хозяйства; грамматически единственное собирательное существительное далее раскрывается местоимением и глаголом во множественном числе.
- source_word: בְלַחְמוֹ
  choice: его пищу
  rationale: לֶחֶם буквально означает «хлеб», но здесь шире обозначает принадлежащую священнику пищу, в контексте — его долю священной пищи.
theological_decisions:
- issue: Передача имущественного статуса купленного человека
  choice: купит человека в собственность за свои деньги
  alternative: купит человека за свои деньги
  rationale: Формулировка сохраняет неудобную, но реально присутствующую в исходном тексте категорию собственности. Это описание древнего правового положения, а не его одобрение переводчиком.
- issue: К чему относится разрешение есть
  choice: эту пищу
  alternative: есть от неё / есть это
  rationale: Местоименный суффикс в בּוֹ отсылает к святой пище, обсуждаемой в ближайшем контексте. Перевод проясняет референт, не уточняя сверх текста конкретный вид приношения.
translation_notes:
  register: Современный литературный русский язык с лаконичной правовой интонацией. Формулировка намеренно сохраняет резкость имущественной терминологии оригинала; архаизмы вроде «душу» и «серебро его» в основном тексте не используются.
