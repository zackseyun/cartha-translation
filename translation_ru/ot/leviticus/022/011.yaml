  source_fidelity: Русский текст точно передаёт правовую условную конструкцию, покупку человека как собственности за деньги священника, разрешение этому человеку участвовать в священной пище и такое же разрешение для рождённых в его доме. «Эту пищу» корректно раскрывает контекстуальный референт בּוֹ, не сужая его до конкретного вида приношения.
