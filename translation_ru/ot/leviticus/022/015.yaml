base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: ru
  text: Пусть они не оскверняют святыни сынов Израиля, которые сыны Израиля возносят[a] Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые сыны Израиля приносят Яхве»; еврейский глагол буквально означает «поднимают, возносят» и в культовом контексте может обозначать представление приношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: оскверняют
  rationale: Пиэль от חלל в культовом контексте означает лишать святого подобающей ему святости, осквернять; этот русский глагол естественно передаёт противопоставление святого и обыденного.
- source_word: קָדְשֵׁי
  choice: святыни
  rationale: Существительное во множественном числе обозначает посвящённые святые предметы или дары; «святыни» сохраняет обобщённость еврейского выражения и не сужает его до одного вида приношений.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранена буквальная форма обычного заветного этнонима; в данном контексте она относится к народу Израиля.
- source_word: אֲשֶׁר יָרִימוּ
  choice: которые те возносят
  rationale: 'Гифиль от רום буквально передаёт поднятие или возношение, а в жертвенном контексте — представление дара Богу. Указательное «те» устраняет возможную русскую двусмысленность: субъект здесь сыны Израиля, а не священники из контекста.'
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное заветное имя יהוה передано транслитерацией «Яхве», а не заменено титулом.
- source_word: וְלֹא
  choice: Пусть … не
  rationale: Отрицательный имперфект в законодательной речи выражает запрет; конструкция «пусть не» звучит по-русски естественно и сохраняет предписывающий характер.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и согласуется с предоставленным актуальным богословским решением.
- issue: Кто возносит святыни
  choice: сыны Израиля («те»), а не священники
  alternative: оставить грамматическую отсылку неуточнённой
  rationale: Форма יָרִימוּ может грамматически отсылать к ближайшему множественному выражению «сыны Израиля»; контекст стихов 14–16 также поддерживает понимание святынь как того, что израильтяне посвящают Яхве. Русское «те» лишь делает эту связь читаемой, не добавляя нового участника.
translation_notes:
  register: Современный литературный русский с умеренно торжественным законодательным звучанием. «Святыни» сохраняет широту исходного קָדְשֵׁי; местоимение «те» предотвращает ошибочную привязку действия к священникам. Маркер сноски помещён непосредственно после соответствующего выражения.
