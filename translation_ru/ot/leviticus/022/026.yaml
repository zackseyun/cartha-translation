  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным ו вводит новое речевое событие. В устойчивой русской библейской формуле «сказал … Моисею» глагол звучит естественнее, чем более тяжёлое «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формульный инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно и без смысловой потери выражает двоеточие; буквальное «говоря» было бы тяжеловесным.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет его функцию и наиболее вероятное научное прочтение; примечание сообщает традиционную замену титулом.
translation_notes:
  register: Современный литературный русский с сохранением краткой торжественной формулы божественной речи. Двоеточие подготавливает продолжение прямой речи в следующем стихе.
