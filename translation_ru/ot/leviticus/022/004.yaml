base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: ru
  text: Всякий мужчина из потомков Аарона, поражённый кожной болезнью[a] или имеющий истечение, не должен есть святынь, пока не станет чист. Также тот, кто прикоснётся к чему-либо нечистому из-за мёртвого тела[b], или мужчина, у которого произошло излияние семени,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «прокажённый». Еврейское слово обозначает более широкий круг ритуально оскверняющих поражений кожи и не обязательно относится к современной проказе (болезни Хансена).'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «к человеку, ставшему нечистым от мёртвого тела». Еврейское выражение идиоматически обозначает нечистоту, связанную с человеческим трупом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן
  choice: Всякий мужчина из потомков Аарона
  rationale: Удвоенное אִישׁ имеет распределительное значение «всякий мужчина», а זֶרַע в данном контексте обозначает род и потомство Аарона.
- source_word: צָרוּעַ
  choice: поражённый кожной болезнью
  rationale: Термин обозначает ритуально оскверняющее поражение кожи и не обязательно соответствует современной болезни Хансена; перевод избегает ложной медицинской конкретизации.
- source_word: זָב
  choice: имеющий истечение
  rationale: Слово обозначает человека с телесным, в данном контексте вызывающим ритуальную нечистоту истечением. «Истечение» сохраняет краткость и достоинство законодательного стиля.
- source_word: בַּקֳּדָשִׁים לֹא יֹאכַל
  choice: не должен есть святынь
  rationale: «Святыни» здесь — освящённые доли пищи, доступные священникам; родительный падеж после «есть» естественно передаёт партитивный смысл.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: пока не станет чист
  rationale: Глагол выражает переход в состояние ритуальной чистоты, а не просто исцеление от болезни.
- source_word: וְהַנֹּגֵעַ
  choice: Также тот, кто прикоснётся
  rationale: Субстантивированное причастие вводит следующий случай ритуальной нечистоты. «Также» естественно связывает незавершённый перечень.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: к чему-либо, осквернённому мёртвым телом
  rationale: Трудное идиоматическое выражение связано с нечистотой от человеческого трупа. Перевод сохраняет возможное предметное понимание כָל и не сводит фразу безоговорочно к человеку.
- source_word: אִישׁ אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: мужчина, у которого произошло излияние семени
  rationale: Фраза прямо и достойно передаёт семяизвержение как источник ритуальной нечистоты; прошедший вид естественен по-русски для наступившего состояния.
theological_decisions:
- issue: Ритуальная нечистота и современный медицинский диагноз
  choice: «поражённый кожной болезнью» и «станет чист»
  alternative: «прокажённый» и «исцелится/очистится»
  rationale: Текст регулирует допуск священника к святыням в связи с ритуальной чистотой, не ставя современного диагноза и не представляя нечистоту как нравственную вину.
- issue: Пол субъекта правовой нормы
  choice: «всякий мужчина из потомков Аарона»
  alternative: «всякий человек / всякий из потомков Аарона»
  rationale: И грамматическая форма, и контекст священства указывают здесь на мужчин из рода Аарона; нейтрализация пола ослабила бы конкретность исходного текста.
- issue: Неоднозначность выражения טְמֵא נֶפֶשׁ
  choice: 'Основной текст сохраняет предметное понимание: «что-либо, осквернённое мёртвым телом»'
  alternative: «человек, ставший нечистым от мёртвого тела»
  rationale: Синтаксис допускает разные способы соотнести כָל и טְמֵא נֶפֶשׁ. Альтернатива отмечена в сноске, чтобы не скрывать подлинную неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с достоинством правового и культового контекста. Сохранена незавершённость стиха: предложение и перечень продолжаются в Лев 22:5. Термины ритуальной чистоты переданы последовательно без архаизации и без смешения с нравственной виной.'
