  rationale: Исправление делает передачу родовых наименований животных менее узкой и заменяет потенциально двусмысленное «огненная жертва» на формулировку, прямо выражающую культовый смысл אִשֶּׁה. Временная граница, принятие приношения и имя Яхве сохранены.
