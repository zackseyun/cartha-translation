review_pass:
  verdict: revise
  source_fidelity: Перечень животных передан в контексте рождения допустимо, но уменьшительные названия («телёнок, ягнёнок, козлёнок») несколько сужают родовые обозначения שׁוֹר, כֶשֶׂב и עֵז. Существеннее то, что «огненная жертва» звучит как характеристика самой жертвы, тогда как אִשֶּׁה — техническое культовое обозначение приношения, совершаемого посредством огня. Исправленный текст передаёт это значение яснее.
  naturalness: «Пусть он ... остаётся» в законодательной формуле возможно, но будущее «он будет оставаться» более прямо соответствует описательному וְהָיָה. «При матери» естественно и уместно. «Жертва, приносимая огнём» — современная и ясная формулировка без разговорных или архаичных оттенков.
  terminology: «Яхве» верно сохраняет тетраграмматон. «Приношение, совершаемое огнём» передаёт общий קָרְבָּן и техническое אִשֶּׁה, не сводя последнее к спорному «пищевому приношению». Сноска сохраняет полезный альтернативный способ выражения.
  issues:
  - severity: medium
    issue: «Огненная жертва» недостаточно точно передаёт אִשֶּׁה.
    rationale: Еврейский термин указывает на приношение, представляемое посредством огня; прилагательное «огненная» в русском может быть воспринято как образная характеристика, а не как культовый способ принесения.
  - severity: low
    issue: Уменьшительные наименования животных слегка сужают родовые термины оригинала.
    rationale: Контекст рождения оправдывает обозначения детёнышей, однако в исходном тексте названы категории жертвенных животных. Формулировка «из крупного рогатого скота, овца или коза» сохраняет этот охват.
  revised_text: Когда родится животное из крупного рогатого скота, овца или коза, оно будет оставаться семь дней при матери; а с восьмого дня и далее будет принято как приношение, совершаемое огнём, Яхве[a].
