  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: ru
  text: Когда родится животное из крупного рогатого скота, овца или коза, оно будет оставаться семь дней при матери; а с восьмого дня и далее будет принято как приношение, совершаемое огнём, Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как огненная жертва Яхве». Еврейское אִשֶּׁה обозначает приношение, представляемое посредством огня.'
    reason: Уточняет технический культовый смысл אִשֶּׁה и сохраняет краткий традиционный вариант передачи.
lexical_decisions:
- source_word: שׁוֹר אוֹ כֶשֶׂב אוֹ עֵז
  choice: телёнок, ягнёнок или козлёнок
  rationale: В контексте рождения русские названия детёнышей естественно передают перечисленные виды животных, не приписывая им определённого пола.
- source_word: כִּי יִוָּלֵד
  choice: когда родится
  rationale: В данном установлении כִּי вводит типичный случай, а нифаль глагола ילד означает «родиться».
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: пусть он семь дней остаётся при матери
  rationale: Буквальное «под матерью» в современном русском не передаёт естественно смысл пребывания новорождённого животного возле кормящей матери; «при матери» сохраняет предметный смысл выражения.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: а с восьмого дня и далее
  rationale: Передаёт исходную временную границу и продолжительность установленной пригодности.
- source_word: יֵרָצֶה
  choice: будет принят
  rationale: Нифаль רצה здесь обозначает принятие жертвы в культовом контексте, а не просто абстрактную допустимость.
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: как огненная жертва
  rationale: קָרְבָּן обозначает приношение, а אִשֶּׁה — жертву, связанную с принесением на огне; краткое русское сочетание сохраняет культовый характер выражения.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано распространённой русской транслитерацией «Яхве»; дательный смысл направления уже выражен конструкцией «жертва Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное заветное имя, поэтому оно сохранено в транслитерации, а не заменено титулом.
- issue: Значение אִשֶּׁה
  choice: огненная жертва
  alternative: пищевое приношение
  rationale: Этимология и употребление термина связаны с жертвой, представляемой на огне; перевод не вводит спорное толкование как «пищи» Бога.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным нормативным звучанием. Формула «при матери» выбрана вместо неестественного буквального «под матерью»; названия детёнышей делают сцену рождения ясной без изменения перечня видов.
