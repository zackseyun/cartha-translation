lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В стандартной формуле введения прямой речи русский глагол «сказал» естественно передаёт действие דבר и позволяет без тяжеловесного повтора перейти к содержанию речи в следующем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и отличает имя Бога от титула «Господь».
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: Направленность речи, выраженная предлогом אֶל, естественно передаётся в русском языке дательным падежом при глаголе «сказать».
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма личного имени; в предложении употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейский инфинитив вводит содержание последующей речи. В современном русском языке эту функцию естественно выполняет двоеточие; буквальное «говоря» здесь было бы избыточным и менее естественным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как собственное имя. Форма «Яхве» непосредственно передаёт это имя, тогда как «Господь» заменяет его титулом, а «Иегова» отражает более позднюю традиционную вокализацию.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским именем «Моисей». Союз «И» сохраняет связь с предшествующим повествованием. Формула речи передана естественно для русского синтаксиса, без буквального и стилистически тяжёлого «говоря».
