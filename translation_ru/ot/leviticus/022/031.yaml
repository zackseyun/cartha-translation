  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: ru
  text: Итак, соблюдайте мои заповеди и исполняйте их. Я — Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя יהוה (YHWH); традиционно передаётся как «Господь».
    reason: Указаны форма исходного текста и традиционный вариант передачи божественного имени.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Итак, соблюдайте
  rationale: שׁמר в законодательном и заветном контексте означает «соблюдать, хранить». Союз ו передаёт связь с предыдущим наставлением; «итак» естественно выражает здесь итоговый переход.
- source_word: מִצְוֺתַי
  choice: Мои заповеди
  rationale: מִצְוָה обозначает заповедь или повеление. «Заповеди» сохраняет принятую лексику Пятикнижия и торжественный правовой оттенок.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: и исполняйте их
  rationale: Буквально — «и делайте их». По-русски применительно к заповедям естественнее «исполняйте их»; отдельный глагол сохраняет еврейскую пару «соблюдать и делать».
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Сохранена краткая формула божественного самоотождествления; личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, а не титул אֲדֹנָי. Транслитерация позволяет различить имя и титул; традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконизмом законодательной речи. Местоимение «Мои» написано с прописной буквы согласно распространённой русской библейской традиции; повелительная форма естественно передаёт нормативную силу еврейского перфекта с ו в данном контексте.
