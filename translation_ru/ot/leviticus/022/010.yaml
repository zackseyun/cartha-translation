base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: ru
  text: Никто посторонний не должен есть святыню[a]; ни живущий у священника[b], ни наёмный работник не должны есть святыню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священную пищу», «священную долю». Еврейское слово в единственном числе, буквально «святыня», здесь обозначает пищу из священных приношений, предназначенную для священников.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «поселенец священника», «пришелец священника». Речь идёт о человеке, проживающем у или при священнике; точный социальный статус этого человека не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: посторонний
  rationale: В контексте священной пищи слово обозначает человека, не имеющего права на священническую долю, а не обязательно иноплеменника.
- source_word: קֹדֶשׁ
  choice: святыня
  rationale: Сохранено единственное число и сакральный характер еврейского существительного; в данном контексте речь идёт о пище из священных приношений.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: живущий у священника
  rationale: Передаёт человека, проживающего при доме священника, но не принадлежащего к его семье и потому не получающего права есть святыню; формулировка не навязывает этнического значения.
- source_word: שָׂכִיר
  choice: наёмный работник
  rationale: Современное и социально точное обозначение человека, работающего за плату.
- source_word: לֹא יֹאכַל
  choice: не должен есть
  rationale: Отрицательная форма глагола в законодательном контексте выражает запрет.
- source_word: וְכָל זָר
  choice: Никто посторонний
  rationale: Естественно передаёт всеобщий запрет, выраженный сочетанием וְכָל с последующим отрицанием.
theological_decisions:
- issue: Круг лиц, которым запрещено есть святыню
  choice: «посторонний» понимается как не имеющий установленного права на священническую пищу
  alternative: «иноплеменник» или этнический чужеземец
  rationale: Контекст посвящён доступу к священной пище, поэтому категория прежде всего культово-правовая, а не этническая.
- issue: Статус תּוֹשָׁב при священнике
  choice: Сохранена принадлежность к хозяйству священника без включения человека в его семью
  alternative: «пришелец священника» или «поселенец при священнике»
  rationale: Точная социальная категория допускает оттенки постоянного жильца, пришельца или зависимого домочадца; перевод и сноска сохраняют эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Повтор «не должен есть святыню» сохраняет структуру и акцент еврейского текста; «ни… ни…» естественно связывает две исключённые категории.
