  rationale: Идиома посвящения передана в основном тексте естественно и точно по смыслу, а её буквальная еврейская форма вынесена в сноску. Устранено не обусловленное текстом определение «священные», уточнены множественное число «одежды» и параллельная форма двух запретов. Смысл и культурный контекст исходного текста не изменены.
