  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: ru
  text: Первосвященник, высший среди своих братьев, на чью голову был возлит елей помазания и который был посвящён носить эти одежды, не должен ни распускать волосы, ни разрывать свои одежды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: Первосвященник, высший среди своих братьев
  rationale: «Первосвященник» — современное и общепонятное обозначение высшей священнической должности; сравнительное значение מִן передано словами «высший среди своих братьев», без сведения выражения лишь к происхождению из их числа.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: на чью голову был возлит елей помазания
  rationale: Сохранены страдательная конструкция, конкретный образ возлияния на голову и традиционное, но понятное культовое слово «елей».
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: чья рука была наполнена
  rationale: Буквально сохранена древнееврейская формула поставления; ее идиоматическое значение разъясняется в сноске.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: чтобы носить священные облачения
  rationale: «Облачения» естественно обозначает особую должностную одежду; определение «священные» явно следует из контекста посвящения первосвященника.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: не должен распускать волосы
  rationale: Глагол обозначает оставление волос распущенными или неубранными; по-русски метонимическое «распускать голову» невозможно, поэтому передан подразумеваемый предмет действия.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: и разрывать на себе одежду
  rationale: Естественно передает обычай разрывания одежды в знак скорби и сохраняет запрет как продолжение одной модальной конструкции.
theological_decisions:
- issue: Значение формулы וּמִלֵּא אֶת יָדוֹ
  choice: Сохранить буквальный образ «чья рука была наполнена» и пояснить его в сноске.
  alternative: «который был посвящён» или «который был поставлен»
  rationale: Культовая формула значима как часть языка посвящения, но без пояснения непонятна современному читателю.
- issue: Значение מֵאֶחָיו
  choice: «высший среди своих братьев»
  alternative: «из числа своих братьев»
  rationale: В данном сочетании предлог допускает понимание превосходства или выделения среди собратьев; основной текст передает наиболее вероятное сравнительное значение, не заменяя «братьев» более широким обозначением.
- issue: Запрет אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: «не должен распускать волосы»
  alternative: «не должен обнажать голову» или «не должен оставлять волосы неубранными»
  rationale: Контекст траурных знаков и употребление глагола поддерживают значение распущенных или неухоженных волос; сноска сохраняет культурный контекст, не утверждая, что речь только о длине или прическе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слова «первосвященник», «елей» и «облачения» сохраняют культовую точность, оставаясь понятными широкому читателю; синтаксис упрощен до одной ясной фразы.
