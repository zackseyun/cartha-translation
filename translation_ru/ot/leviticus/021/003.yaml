  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: ru
  text: и ради своей сестры, которая остаётся девственницей, близкой ему и не бывшей замужем[a], он может стать ритуально нечистым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которая не принадлежала мужчине»; возможно также: «которая не была с мужчиной». Еврейское выражение идиоматично и говорит о сестре, не вступившей в союз с мужчиной.'
    reason: Лексическая альтернатива сохраняет диапазон значения идиомы אֲשֶׁר לֹא הָיְתָה לְאִישׁ.
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: и ради своей сестры
  rationale: Предлог вводит ещё один случай, ради кого священнику разрешено стать ритуально нечистым; притяжательный суффикс передан словом «своей».
- source_word: הַבְּתוּלָה
  choice: девственницы
  rationale: Сохраняется прямое указание на половой статус сестры, существенное для данного установления.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: близкой ему
  rationale: Формулировка сохраняет образ близости и прежде всего обозначает близкое родство, не сводя его исключительно к эмоциональной привязанности.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: которая не была замужем
  rationale: Еврейская идиома буквально говорит, что она «не была у мужчины»; в данном семейно-правовом контексте естественный русский эквивалент указывает на отсутствие брачного союза, а возможная более широкая смысловая сторона отмечена в сноске.
- source_word: לָהּ יִטַּמָּא
  choice: он может оскверниться
  rationale: Форма в контексте перечня выражает дозволение священнику принять ритуальную нечистоту ради умершей близкой родственницы. Русское «оскверниться» традиционно и лаконично, а его ритуальный смысл определяется контекстом.
theological_decisions:
- issue: Характер осквернения в священническом законе
  choice: «оскверниться» понимается как стать ритуально нечистым вследствие соприкосновения с умершей
  alternative: понять выражение как нравственное осквернение или личный грех
  rationale: Контекст Лев 21 регулирует нечистоту священников от умерших, а не нравственную виновность.
- issue: Модальность יִטַּמָּא
  choice: «может оскверниться» — разрешение
  alternative: «пусть осквернится» или «осквернится» как предписание либо простое будущее
  rationale: Стихи 2–3 образуют перечень исключений из запрета, поэтому здесь уместна разрешительная модальность, хотя сама еврейская форма отдельно её не маркирует однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством правового сакрального текста. «Ради» естественно связывает разрешённое осквернение с умершей родственницей; «сестры-девственницы» передаёт оба определения без архаической тяжеловесности. Маркер [a] помещён непосредственно после соответствующего оборота.
