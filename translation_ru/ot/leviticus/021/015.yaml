  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: ru
  text: Он не должен осквернять своё потомство среди своего народа[a][b], ибо Я — Яхве, освящающий его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не делает своё потомство несвятым»; возможно также: «не бесчестит своё потомство». Еврейский глагол означает превращать то, что должно быть святым, в несвятое.'
    reason: lexical_alternative
  - marker: b
    text: То есть, нарушив приведённые выше брачные ограничения, он осквернил бы своё потомство среди народа завета.
    reason: cultural_note
  - marker: c
    text: 'Или: «делающий его святым», «посвящающий его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: оскверняет
  rationale: Пиэль глагола חלל в контексте святости означает делать священное несвятым, осквернять. «Оскверняет» естественно передаёт культовый и нравственный оттенок, не сводя смысл к простому бесчестию.
- source_word: זַרְעוֹ
  choice: своего потомства
  rationale: זֶרַע здесь обозначает потомство или род. В контексте брачных ограничений для первосвященника «потомство» звучит естественно и сохраняет генеалогический смысл.
- source_word: בְּעַמָּיו
  choice: среди своего народа
  rationale: Сочетание בְּ с עַם и местоименным суффиксом естественно означает «среди своего народа» и сохраняет общественный контекст запрета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом.
- source_word: מְקַדְּשׁוֹ
  choice: освящающий его
  rationale: Причастная форма от קדשׁ означает того, кто делает святым или отделяет как святыню. «Освящающий» сохраняет характерную для главы лексику святости и допускает как действие, так и устойчивую роль Яхве.
theological_decisions:
- issue: Смысл осквернения потомства и основание запрета
  choice: Текст говорит, что первосвященник не должен осквернять своё потомство среди народа, потому что его освящает Яхве.
  alternative: 'Запрет можно понимать конкретнее: брак с запрещённой женщиной лишил бы его потомков права на священническое служение.'
  rationale: Ближайший контекст указывает на брачные ограничения и священнический род, однако еврейский текст не формулирует последствие как прямое лишение священнического статуса. Поэтому основной текст сохраняет более широкую формулировку оригинала.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и ясностью. Сохранена терминология святости: «оскверняет» и «освящающий». Повелительно-запретная форма יְחַלֵּל с לֹא передана нормативным «пусть не». Маркеры сносок размещены непосредственно после соответствующих выражений.'
