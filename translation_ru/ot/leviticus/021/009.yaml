base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: ru
  text: Если дочь священника начнёт блудить, она бесчестит своего отца; её следует сжечь в огне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её должно сжечь огнём». Еврейская формула предписывает сожжение, не описывая порядок исполнения наказания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: дочь священника
  rationale: Буквально сочетание означает «дочь человека-священника», но по-русски естественно и точно передаётся как «дочь священника».
- source_word: כִּי
  choice: если
  rationale: В казуистической правовой формуле союз вводит условный случай.
- source_word: תֵחֵל לִזְנוֹת
  choice: осквернит себя блудом
  rationale: Форма от חלל в данном контексте выражает осквернение, а инфинитив от זנה уточняет, каким действием оно совершается. «Блудом» сохраняет конкретный сексуальный смысл, не сводя выражение непременно к коммерческой проституции.
- source_word: אֶת־אָבִיהָ הִיא מְחַלֶּלֶת
  choice: она оскверняет своего отца
  rationale: «Оскверняет» сохраняет повтор корня חלל и его вес в контексте священнической святости; «своего» естественно указывает на её собственного отца.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: её следует сжечь в огне
  rationale: Нифаль обозначает предписанное пассивное наказание. Конструкция «следует» ясно передаёт правовую модальность, а «в огне» близко воспроизводит еврейскую предложную конструкцию.
theological_decisions:
- issue: Передача повторяющейся лексики חלל в законе о святости священников
  choice: В обеих частях использовать слова с корнем «оскверн-»
  alternative: «обесчестит себя… позорит своего отца» или «начнёт блудить»
  rationale: Повтор подчёркивает не только общественный позор, но и нарушение священной обособленности, связанной со служением отца. При этом перевод не добавляет позднейших доктринальных выводов.
- issue: Характер наказания בָּאֵשׁ תִּשָּׂרֵף
  choice: Сохранить буквальное «сжечь в огне» без уточнения порядка казни
  alternative: Уточнить, означает ли это сожжение заживо или сожжение тела после иной казни
  rationale: Сам стих не разъясняет порядок исполнения наказания; перевод сохраняет эту неопределённость и не вносит внешнюю традицию.
translation_notes:
  register: Современный литературный русский язык с кратким и торжественным правовым звучанием. Лексический повтор «осквернит — оскверняет» намеренно сохраняет связь обеих форм еврейского корня חלל. Маркер [a] помещён в основном тексте.
