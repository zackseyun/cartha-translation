lexical_decisions:
- source_word: אוֹ
  choice: или
  rationale: Простой разделительный союз, продолжающий перечень физических недостатков.
- source_word: אִישׁ
  choice: мужчина
  rationale: В данном священническом установлении существительное мужского рода обозначает отдельного мужчину из числа священников.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: у которого
  rationale: 'Буквально: «в котором будет»; русская конструкция «у которого» естественно передаёт наличие данного состояния.'
- source_word: שֶׁבֶר
  choice: сломана
  rationale: Существительное обозначает перелом; в основном тексте естественная русская формулировка передаёт его конструкцией «сломана нога или рука».
- source_word: רָגֶל
  choice: нога
  rationale: רֶגֶל прежде всего означает ступню, но русское «сломана ступня» менее обычно; «нога» здесь естественно и не уточняет место перелома сверх контекста.
- source_word: שֶׁבֶר יָד
  choice: сломана рука
  rationale: יָד может обозначать кисть или руку; «сломана рука» — естественное русское выражение, сохраняющее допустимую широту значения.
