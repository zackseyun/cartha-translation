  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: ru
  text: Он не должен приближаться ни к какому мёртвому телу[a]; даже ради отца или матери не должен осквернять себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни к какому умершему». Буквально: «к душам умершего»; в законах о чистоте это древнееврейское выражение означает тело умершего человека.'
    reason: Лексическая альтернатива и пояснение древнееврейской идиомы.
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: не должен приближаться
  rationale: Сочетание בוא с עַל в контексте священнических предписаний запрещает приближение к умершему, предполагающее возможность ритуального осквернения; современное русское «приближаться» естественно передаёт этот смысл.
- source_word: כָּל
  choice: ни к какому
  rationale: При отрицании эта конструкция ясно выражает всеобщий характер запрета.
- source_word: נַפְשֹׁת מֵת
  choice: умершему
  rationale: Буквально выражение связано с «умершим человеком» и в законах о чистоте обозначает человеческие останки. «Умершему» звучит достойно и естественно, а сноска сохраняет более предметную альтернативу.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: даже из-за отца или матери
  rationale: Предлог לְ указывает на случай или основание осквернения. «Даже» передаёт подчёркнутое отсутствие исключения для самых близких родственников, а «или» — распределительный смысл.
- source_word: לֹא יִטַּמָּא
  choice: не должен осквернять себя
  rationale: Возвратная форма глагола טמא обозначает навлечение на себя ритуальной нечистоты. «Осквернять себя» сохраняет традиционный библейский регистр; значение ритуальной, а не обязательно нравственной нечистоты определяется контекстом.
theological_decisions:
- issue: Характер нечистоты
  choice: Сохранить язык осквернения в контексте законов о ритуальной чистоте.
  alternative: «Не должен становиться нечистым» или пояснительное «ритуально нечистым».
  rationale: Текст говорит о нечистоте от соприкосновения с умершим, а не прямо о нравственной вине. Добавление «ритуально» было бы верным пояснением, но эксплицировало бы то, что контекст уже сообщает.
- issue: Запрет в отношении родителей
  choice: Передать отсутствие исключения словом «даже».
  alternative: Оставить «из-за отца или матери» без усилительной частицы.
  rationale: Упоминание отца и матери после всеобщего запрета подчёркивает, что даже ближайшее родство не создаёт исключения для первосвященника.
translation_notes:
  register: Современный литературный русский язык с достойным законодательным регистром. Формула «не должен» понятна широкому читателю; «осквернять себя» сохраняет библейскую терминологию, не добавляя конфессионального толкования.
