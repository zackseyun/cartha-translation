lexical_decisions:
- source_word: גִבֵּן
  choice: горбатый
  rationale: Слово обозначает деформацию спины, вероятно горбатую или искривлённую спину; «горбатый» прямо и естественно передаёт наиболее вероятный смысл.
- source_word: דַּק
  choice: низкорослый
  rationale: Точное значение в данном перечне неясно; слово может указывать на малый рост, недоразвитость, худобу или истощённость. «Низкорослый» передаёт традиционно предполагаемый смысл без медицинской конкретизации.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: с изъяном на глазу
  rationale: Речь идёт о глазной аномалии, но её точный характер установить нельзя; общее слово «изъян» сохраняет эту неопределённость.
- source_word: גָרָב
  choice: страдающий чесоткой
  rationale: Термин обозначает зудящее или покрывающее коростой кожное заболевание; «чесотка» понятно современному читателю, но не претендует на точный ретроспективный диагноз.
- source_word: יַּלֶּפֶת
  choice: лишаём
  rationale: Это иное кожное заболевание, отличное от גָרָב; «лишай» сохраняет различие между двумя терминами, не сводя их к одному состоянию.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: с раздавленными яичками
  rationale: Выражение прямо указывает на раздавливание или тяжёлое повреждение яичек; анатомически ясный перевод не затемняет телесную конкретность оригинала.
- source_word: אוֹ
  choice: или
  rationale: Повторяющийся разделительный союз сохраняет структуру перечня.
theological_decisions:
- issue: Обозначение телесных изъянов в законе о священническом служении
  choice: Передать телесные состояния прямо, без эвфемизмов и без нравственной оценки.
  alternative: Смягчить формулировки либо заменить их современными медицинскими диагнозами.
  rationale: Стих перечисляет физические состояния, ограничивавшие определённое священническое служение, но не объявляет их нравственной виной. Поэтому перевод сохраняет конкретность закона, не приписывая людям греховности из-за их состояния.
translation_notes:
  register: Современный литературный русский язык; формулировка прямая и понятная, с сохранением повторяющейся структуры перечня. Неопределённость древней медицинской терминологии вынесена в сноски.
