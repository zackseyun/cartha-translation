source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: ru
  text: Он не должен брать в жёны ни вдову, ни разведённую, ни осквернённую женщину[a], ни блудницу; он должен взять в жёны только девственницу из своего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опороченную женщину»; еврейское слово обозначает женщину, чей статус считался несовместимым с требованиями священнической святости.'
    reason: Лексическая альтернатива для редкого термина חֲלָלָה, значение которого связано с профанацией или нарушением священного статуса.
lexical_decisions:
- source_word: אַלְמָנָה
  choice: вдову
  rationale: Прямое и общеупотребительное соответствие; винительный падеж естественно включён в перечень тех, кого запрещено брать в жёны.
- source_word: גְרוּשָׁה
  choice: разведённую
  rationale: Форма обозначает женщину, с которой развелись; краткое русское наименование ясно передаёт её брачный статус.
- source_word: חֲלָלָה
  choice: осквернённую женщину
  rationale: Слово связано с утратой или нарушением статуса святости в контексте священнических брачных ограничений. «Осквернённую» сохраняет культово-правовой оттенок, а примечание указывает возможные передачи.
- source_word: זֹנָה
  choice: блудницу
  rationale: Точное и уместное для библейского законодательного регистра обозначение женщины, занимающейся проституцией; слово остаётся понятным современному читателю.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: Он не должен брать в жёны ни…
  rationale: Глагол «брать» в данном контексте обозначает вступление в брак. Добавление «в жёны» ясно выражает подразумеваемое брачное значение, а конструкция с повторяющимся «ни» естественна для русского перечня.
- source_word: כִּי אִם
  choice: только
  rationale: После отрицательного запрета сочетание вводит единственно допустимую альтернативу; «только» кратко и точно передаёт это ограничение.
- source_word: בְּתוּלָה
  choice: девственницу
  rationale: В данном брачно-правовом контексте слово обозначает женщину, не имевшую половых отношений; «девственница» точнее, чем более широкое «девушка».
- source_word: מֵעַמָּיו
  choice: из своего народа
  rationale: Предлог מן указывает на происхождение из среды принадлежащего ему народа; русское «из своего народа» передаёт это естественно, не добавляя более узкого этнического или родового толкования.
- source_word: אִשָּׁה
  choice: в жёны
  rationale: В сочетании с глаголом «брать» существительное имеет брачное значение; русский оборот «брать в жёны» естественен и точен.
theological_decisions:
- issue: Передача термина חֲלָלָה в законе о браке первосвященника
  choice: осквернённую женщину
  alternative: опороченную женщину; женщину, чей священный статус нарушен
  rationale: Еврейское слово связано с профанацией или нарушением священного статуса, но точный характер такого статуса в самом стихе не разъясняется. Основной текст сохраняет категорию осквернения, а примечание не сводит её без достаточных оснований ни к нравственной вине, ни к одному конкретному юридическому случаю.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим законодательному контексту. Сохранён повтор «брать в жёны», связывающий запрет и положительное предписание; архаические синтаксические обороты устранены. Маркер примечания поставлен непосредственно после слова, к которому оно относится.
