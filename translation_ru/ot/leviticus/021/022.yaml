  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: ru
  text: Он может есть пищу своего Бога[a] — и из особо святых даров, и из святых даров.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлеб своего Бога». Здесь «хлеб» означает пищевые доли, предназначенные священникам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: пища
  rationale: Хотя слово буквально означает «хлеб», в данном жертвенно-правовом контексте оно обозначает предназначенные священникам доли пищи; «пища» не сужает смысл до печёного хлеба.
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Местоименный суффикс относится к священнику; возвратное «своего» естественно передаёт принадлежность при подлежащем «он».
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: из особо святого
  rationale: Сочетание выражает высшую степень святости и обозначает высшую категорию святынь; «особо святое» сохраняет принятую в ритуально-правовом контексте категориальную формулировку.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: и из святого
  rationale: Формулировка сохраняет лексическую связь с предыдущей категорией и различие между двумя степенями святости.
- source_word: יֹאכֵל
  choice: может есть
  rationale: 'В контексте ограничений для священника имперфект выражает разрешение: физический недостаток не лишает его права есть священные доли.'
theological_decisions:
- issue: Смысл правового имперфекта יֹאכֵל
  choice: 'разрешение: «может есть»'
  alternative: простое будущее «будет есть» или предписание «пусть ест / должен есть»
  rationale: Контекст противопоставляет запрет приближаться для служения сохранённому праву священника есть священные доли; перевод не превращает разрешение в обязанность.
translation_notes:
  register: Современный литературный русский язык с краткой правовой формулировкой. Термины «особо святое» и «святое» сохраняют различие ритуальных категорий; тире естественно вводит уточнение об обеих категориях пищи.
