id: LEV.21.23
reference: Leviticus 21:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: ru
  text: Однако к завесе[a] он не должен входить и к жертвеннику не должен приближаться, потому что у него есть телесный изъян[b]. Пусть он не оскверняет Моих святилищ[c], ведь Я — Яхве, освящающий их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к занавесу». Еврейское слово обозначает завесу святилища.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в нём изъян». Речь идёт о телесном состоянии, ограничивающем участие в этом священническом служении, а не о нравственном пороке.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте стоит множественное число — «Мои святилища»; в некоторых переводах оно передаётся единственным числом: «Моё святилище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Однако
  rationale: Слово вводит ограничение к данному в предыдущем стихе разрешению; «однако» естественно передаёт противительный оттенок.
- source_word: הַפָּרֹכֶת
  choice: завеса
  rationale: Речь идёт о культовой завесе святилища; «завеса» сохраняет точный и привычный библейский термин.
- source_word: יָבֹא אֶל
  choice: входить к
  rationale: Сочетание передаёт движение внутрь священного пространства по направлению к завесе, не добавляя отсутствующего в еврейском тексте указания «за завесу».
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычное и точное русское обозначение алтаря для жертвоприношений в священническом контексте.
- source_word: יִגַּשׁ
  choice: приближаться
  rationale: Передаёт характерный для священнических текстов язык культового приближения.
- source_word: מוּם בּוֹ
  choice: у него есть телесный изъян
  rationale: מוּם обозначает телесный недостаток, служащий основанием для ритуального ограничения, а не нравственную вину; уточнение «телесный» предотвращает моральное прочтение.
- source_word: יְחַלֵּל
  choice: оскверняет
  rationale: В контексте святости глагол означает нарушение священного статуса, обращение со святым как с обыденным; «оскверняет» звучит естественно и весомо по-русски.
- source_word: מִקְדָּשַׁי
  choice: Моих святилищ
  rationale: Сохранено множественное число еврейского текста, без сглаживания до единственного «Моё святилище».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מְקַדְּשָׁם
  choice: освящающий их
  rationale: Сохранена терминология святости; местоимение естественно соотносится с ближайшим грамматическим антецедентом — «Моих святилищ».
theological_decisions:
- issue: Референт местоименного суффикса в מְקַדְּשָׁם
  choice: «их» относится к «Моим святилищам»
  alternative: «их» относится шире к священникам или народу
  rationale: Ближайший грамматический антецедент — стоящее во множественном числе מִקְדָּשַׁי; этот смысл соответствует непосредственному контексту священных мест, хотя более широкий референт грамматически не исключён полностью.
- issue: Смысл מוּם в законе о священническом служении
  choice: телесный изъян, влекущий ритуальное ограничение
  alternative: порок или нравственный недостаток
  rationale: Контекст перечисленных телесных состояний показывает, что речь не идёт о грехе, нравственной ущербности или меньшем достоинстве человека.
- issue: Связь запрета с осквернением святилищ
  choice: 'отдельное предписание цели/предотвращения: «Пусть он не оскверняет»'
  alternative: 'следствие причины: «чтобы он не осквернял»'
  rationale: Еврейское וְלֹא יְחַלֵּל допускает координированный запрет; русский императив сохраняет нормативную силу, не навязывая исключительно целевое прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Синтаксис остаётся ясным для широкого читателя; юридическая нормативность передана конструкцией «не должен» и отдельным предписанием «пусть не». Сохранены множественное число «святилищ» и личное имя Яхве.
