  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: ru
  text: Они должны быть святы своему Богу и не должны осквернять имя своего Бога, потому что они приносят огненные жертвы Яхве — пищу своего Бога; и должны быть святы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם
  choice: они должны быть святы перед своим Богом
  rationale: В предписывающем контексте имперфект передан через «должны быть». Предлог ל обозначает отношение посвящённости Богу; русское «перед своим Богом» естественно выражает это отношение, не превращая его в принадлежность.
- source_word: יְחַלְּלוּ
  choice: осквернять
  rationale: Порода пиэль глагола חלל здесь означает лишать святости, профанировать. «Осквернять» — ясный современный культовый эквивалент, сохраняющий противопоставление святого и несвятого.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: имя своего Бога
  rationale: Прямо передаёт конструкцию принадлежности; возвратное «своего» естественно по-русски при том же подлежащем.
- source_word: אִשֵּׁי יְהוָה
  choice: огненные жертвы Яхве
  rationale: Техническое אִשֶּׁה связано с жертвами, предаваемыми огню. «Огненные жертвы» сохраняет культовый образ и не смешивает этот термин с последующим לֶחֶם.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: пищу своего Бога
  rationale: Хотя לֶחֶם буквально означает «хлеб», в жертвенном контексте слово обозначает пищу шире; «пища» избегает неоправданного сужения смысла.
- source_word: מַקְרִיבִם
  choice: приносят
  rationale: Причастие породы хифиль от קרב обозначает принесение или представление жертвы. «Приносят» — естественный русский жертвенный термин.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: поэтому они должны быть святы
  rationale: Заключительная формула вновь утверждает требуемую святость. В данном причинном построении «поэтому» естественно выявляет вывод, а «должны» сохраняет предписывающую силу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное covenantное имя; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Выражение אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם
  choice: огненные жертвы Яхве — пищу своего Бога
  alternative: пищевые приношения Яхве, пищу своего Бога; огненные приношения Яхве, хлеб своего Бога
  rationale: 'Перевод сохраняет два соседних образа: техническое обозначение жертв, предаваемых огню, и метафорическое культовое обозначение их как Божьей пищи. Тире показывает пояснительное отношение, не утверждая большего, чем позволяет синтаксис.'
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Повтор «должны быть святы» сохранён как значимый композиционный обрамляющий элемент стиха.
