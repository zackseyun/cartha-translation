  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: ru
  text: 'Он не должен выходить из святилища и не должен осквернять святилище своего Бога, потому что на нём — знак посвящения: елей помазания его Бога[a]. Я — Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «венец елея помазания его Бога — на нём». Еврейское слово может означать «венец, диадема» или указывать на посвящение и его знак.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ
  choice: из святилища
  rationale: מִקְדָּשׁ обозначает святое место, святилище; предлог מִן передаёт исходную точку движения.
- source_word: לֹא יֵצֵא
  choice: не должен выходить
  rationale: Форма имперфекта в законодательном контексте выражает запрет; перевод сохраняет конкретное значение глагола יָצָא — «выходить».
- source_word: וְלֹא יְחַלֵּל
  choice: и не должен осквернять
  rationale: В породе пиэль חלל означает лишать святости, осквернять; формулировка передаёт культовый смысл и сохраняет самостоятельность второго запрета.
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: святилище своего Бога
  rationale: Повтор слова «святилище» отражает повтор в еврейском тексте и сохраняет юридический акцент.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующих запретов.
- source_word: נֵזֶר
  choice: знак посвящения
  rationale: Слово может означать «венец, диадема» либо посвящённость и её видимый знак. В связи с елеем помазания контекстуально ясно передаётся священный статус первосвященника, при этом буквальная образность сохранена в сноске.
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: через помазание елеем его Бога
  rationale: Перевод естественно передаёт цепочку сопряжённых форм и прямо выражает помазание священным елеем, не представляя елей как буквальный венец.
- source_word: עָלָיו
  choice: на нём
  rationale: Сохранён пространственный образ еврейского выражения, обозначающий продолжающееся состояние посвящённости.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Личное имя Бога передано транслитерацией, а именная формула сохранена в краткой и торжественной форме.
theological_decisions:
- issue: Значение נֵזֶר применительно к статусу первосвященника
  choice: знак посвящения
  alternative: венец елея помазания
  rationale: В данном основании запрета речь идёт о посвящённом статусе первосвященника, обозначенном помазанием. Однако слово נֵזֶר сохраняет возможность образа венца, поэтому буквальная альтернатива отмечена в сноске, а неоднозначность не устранена молча.
- issue: Связь двух запретов
  choice: 'два координированных запрета: не выходить и не осквернять'
  alternative: не выходить, чтобы не осквернить
  rationale: Еврейский текст соединяет две отрицательные глагольные формы союзом וְ; причинная или целевая зависимость между ними прямо не выражена, поэтому она не добавлена.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром. Повтор «святилище» сохранён ради соответствия юридической риторике оригинала; «елей» употреблён как устойчивый библейский термин.
