id: LEV.21.18
reference: Leviticus 21:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: ru
  text: 'Ибо ни один мужчина, у которого есть телесный недостаток[a], не должен приближаться[b]: ни слепой, ни хромой, ни человек с повреждённым лицом[c], ни тот, у кого одна из конечностей несоразмерно длинна[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также переводиться как «изъян» или «порок»; здесь оно обозначает телесное состояние, препятствующее исполнению определённых священнических обязанностей.
    reason: lexical_alternative
  - marker: b
    text: Здесь «приближаться» означает приступать к священническому служению.
    reason: cultural_note
  - marker: c
    text: Значение редкого еврейского слова не вполне ясно; возможно, речь идёт конкретнее о повреждённом или деформированном носе.
    reason: lexical_alternative
  - marker: d
    text: Еврейское слово, вероятно, обозначает чрезмерно вытянутую или непропорциональную конечность либо другую часть тела.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующего запрета; «ибо» передаёт пояснительную связь и сохраняет достойный литературный регистр.
- source_word: כָל אִישׁ ... לֹא
  choice: ни один мужчина ... не
  rationale: Буквально «всякий мужчина ... не»; в сочетании с отрицанием естественно передаётся как «ни один мужчина». Мужской род сохранён, поскольку ближайший контекст говорит о мужчинах из рода Аарона, исполняющих священническое служение.
- source_word: אֲשֶׁר בּוֹ מוּם
  choice: у которого есть телесный недостаток
  rationale: מוּם обозначает физический изъян, служащий препятствием к священническому служению. Добавление «телесный» ясно выражает контекстуальный смысл и не представляет недостаток как нравственную вину.
- source_word: לֹא יִקְרָב
  choice: не должен приближаться
  rationale: В священническом контексте קרב означает приближение для совершения служения. Такая формулировка передаёт нормативный характер запрета, не уточняя в основном тексте больше, чем сказано по-еврейски.
- source_word: אִישׁ עִוֵּר
  choice: слепой
  rationale: Краткая и естественная передача физического состояния; повтор существительного «мужчина» в русском перечислении не требуется.
- source_word: פִסֵּחַ
  choice: хромой
  rationale: Обычная современная передача обозначения человека с нарушением способности ходить.
- source_word: חָרֻם
  choice: человек с повреждённым лицом
  rationale: Редкое слово, вероятно, обозначает увечье или деформацию лица, возможно носа. Обобщённая формулировка сохраняет лексическую неуверенность.
- source_word: שָׂרוּעַ
  choice: тот, у кого одна из конечностей несоразмерно длинна
  rationale: Слово, вероятно, указывает на чрезмерно вытянутую или непропорциональную часть тела; конкретная, но осторожная формулировка передаёт наиболее вероятный смысл.
theological_decisions:
- issue: Характер ограничения в священническом законе
  choice: Передать стих как ограничение допуска к священническому служению.
  alternative: Понять его как общее социальное исключение или суждение о достоинстве человека.
  rationale: В контексте речь идёт о потомках Аарона и их приближении для священнического служения. Стих не утверждает, что телесный недостаток является нравственной виной или умаляет достоинство человека.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Перечень передан ясно и без устаревшей либо уничижительной лексики; неопределённость двух редких еврейских терминов сохранена в сносках.
