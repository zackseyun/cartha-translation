  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: ru
  text: И сказал Моисей Аарону, его сыновьям и всем сынам Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем израильтянам»; традиционно: «всем детям Израиля». Буквально с еврейского: «всем сынам Израиля» — это устойчивое заветное наименование народа Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал Моисей
  rationale: Вайиктоль с וַ продвигает повествование и здесь завершает раздел; обычная русская библейская повествовательная формула «И сказал» точно и естественно передаёт связь с предшествующим контекстом.
- source_word: אֶל
  choice: Аарону, его сыновьям и всем сынам Израиля
  rationale: Предлог обозначает адресатов речи. В русском языке при глаголе «сказать» это естественно передаётся дательным падежом без отдельного предлога.
- source_word: בָּנָיו
  choice: его сыновьям
  rationale: Форма мужского рода во множественном числе с суффиксом 3-го лица единственного числа указывает именно на сыновей Аарона.
- source_word: כָּל
  choice: всем
  rationale: Передаёт полноту названной далее группы и согласуется с дательным падежом.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальную форму устойчивого заветного наименования народа; в сноске дан более естественный корпоративный эквивалент.
theological_decisions:
- issue: Передача заветного этнонима בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: всем израильтянам; детям Израиля
  rationale: Выбранный вариант сохраняет мужское множественное число и традиционную форму заветного обозначения, не исключая корпоративного значения всего народа; это значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской повествовательной формулой. Перечень адресатов сделан естественным для русского языка посредством дательного падежа; буквальная заветная формула сохранена в основном тексте и разъяснена в сноске.
