base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Обратись к священникам, сынам Аарона, и скажи им: пусть никто из них не оскверняет себя из-за умершего среди своего народа[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для/по отношению к נפשׁ (не́феш)». В данном контексте законов о чистоте это слово обозначает умершего; речь идёт о ритуальной, а не нравственной нечистоте. Способ её получения в этом стихе прямо не указан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: обратись ... и скажи
  rationale: Сохраняет повтор глагола речи, но по-русски избегает тяжеловесного «скажи… и скажи».
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: священникам, сынам Аарона
  rationale: Сохраняет приложение и семейно-заветное обозначение исходного текста.
- source_word: לְנֶפֶשׁ
  choice: прикосновением к умершему
  rationale: В законах о чистоте נֶפֶשׁ обозначает умершего как источник ритуальной нечистоты; упоминание прикосновения делает естественной русскую конструкцию, хотя способ осквернения в еврейском здесь прямо не назван.
- source_word: יִטַּמָּא
  choice: не оскверняет себя
  rationale: Передаёт рефлексивный оттенок и традиционный язык ритуальной нечистоты; контекст не предполагает нравственного осквернения.
- source_word: בְּעַמָּיו
  choice: среди своего народа
  rationale: Буквально и естественно передаёт местно-родственную сферу, не сужая значение до ближайших родственников.
theological_decisions:
- issue: Характер осквернения в священническом законодательстве
  choice: Ритуальное осквернение от умершего
  alternative: Нравственное осквернение
  rationale: Контекст касается культовой нечистоты, связанной с умершими, а не утверждает нравственную виновность.
- issue: Неопределённый субъект יִטַּמָּא при обращении к священникам
  choice: «пусть никто из них не…»
  alternative: «священник не должен…»
  rationale: Явно связывает единственное число глагола с коллективным адресатом, не добавляя нового существительного в качестве подлежащего.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Сынам Аарона» сохраняет формальную структуру оригинала. Формулировка о прикосновении естественна для русского, а сноска отмечает, что это контекстуальное уточнение. Закрывающая кавычка намеренно не поставлена, поскольку предоставленный английский слой оформляет стих как начало продолжающейся прямой речи.
