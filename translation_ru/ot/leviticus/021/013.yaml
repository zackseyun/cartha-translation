lexical_decisions:
- source_word: וְהוּא
  choice: И он
  rationale: Союз продолжает предыдущую речь, а самостоятельное местоимение явно обозначает и слегка выделяет подлежащее; «И он» сохраняет оба оттенка без чрезмерного усиления.
- source_word: אִשָּׁה
  choice: себе в жёны
  rationale: В сочетании с לקח слово обозначает женщину, которую берут в жёны. Русская брачная формула естественно передаёт этот смысл.
- source_word: בִּבְתוּלֶיהָ
  choice: девственницу
  rationale: Форма с предлогом בְּ буквально указывает на состояние девственности; в современном русском прямое дополнение «девственницу» естественно выражает требование к женщине в момент вступления в брак. Буквальная конструкция отмечена в сноске.
- source_word: יִקָּח
  choice: возьмёт
  rationale: Глагол לקח означает «брать» и здесь входит в устойчивую брачную формулу. Будущее совершенного вида подходит для предписания в данном законодательном контексте.
theological_decisions:
- issue: Брачная терминология в священническом законодательстве
  choice: Сохранить формулу «возьмёт себе в жёны», а не заменять её одним глаголом «женится».
  alternative: Он должен жениться на девственнице.
  rationale: Выбранная формулировка сохраняет юридико-формульный характер еврейского выражения и при этом звучит понятно и естественно по-русски.
- issue: Передача בִּבְתוּלֶיהָ
  choice: В основном тексте — «девственницу», с буквальным вариантом в сноске.
  alternative: женщину в её девственности; женщину, пока она девственна
  rationale: Еврейская конструкция буквально описывает состояние девственности, но дословная русская калька неестественна. Перевод не добавляет конфессионального толкования и сохраняет исходный смысл, а сноска сообщает форму оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным юридическим оттенком. Брачная формула сохранена, но синтаксис сделан естественным для обычного читателя.
