source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: ru
  text: Никто из потомков священника Аарона, имеющий телесный недостаток, не должен приближаться, чтобы приносить огненные приношения Яхве[a]. У него телесный недостаток; он не должен приближаться, чтобы приносить хлеб своего Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приношения Яхве, сжигаемые на огне».'
    reason: lexical_alternative
  - marker: b
    text: '«Хлеб своего Бога» — священническое выражение, обозначающее пищу, приносимую Богу в жертву; возможный перевод: «пищу своего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ אֲשֶׁר ... לֹא
  choice: Никто ... не должен
  rationale: Сочетание כָּל с последующим отрицанием выражает всеобщий запрет; по-русски естественно передаётся конструкцией «никто ... не должен».
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: из потомков священника Аарона
  rationale: זֶרַע здесь обозначает род, потомство; русский оборот ясно передаёт принадлежность к священнической линии Аарона.
- source_word: מוּם
  choice: телесный недостаток
  rationale: В данном контексте слово обозначает физическое состояние, препятствующее культовому служению. Уточнение «телесный» предотвращает ошибочное понимание как нравственного изъяна.
- source_word: יִגַּשׁ לְהַקְרִיב
  choice: не должен приближаться, чтобы приносить
  rationale: Сохранено культовое значение נגשׁ — приближаться для служения — и жертвенное значение הקריב — приносить Богу.
- source_word: אִשֵּׁי יְהוָה
  choice: жертвы Яхве, сжигаемые на огне
  rationale: אִשֶּׁה — специальное обозначение жертвенного дара, связанного с огнём. Формулировка сохраняет традиционную семантику огненного приношения, не сводя термин только к пище.
- source_word: לֶחֶם אֱלֹהָיו
  choice: хлеб своего Бога
  rationale: Буквальное «хлеб» сохраняет характерную для священнического языка метонимию, где речь идёт о жертвенной пище, представляемой Богу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя יהוה; транслитерация «Яхве» сохраняет различие между именем Бога и титулом «Господь».
- issue: Характер ограничения для священника с מוּם
  choice: Ограничение сформулировано как запрет приближаться для принесения жертв
  alternative: Общий запрет священнического служения или приближения к Богу
  rationale: Стих прямо связывает запрет с לְהַקְרִיב — принесением жертв. Перевод не расширяет его до полного исключения из священства или от Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и культового контекста. Повтор исходного текста сохранён. Термин «телесный недостаток» употреблён как контекстуально точное описание древнего культового ограничения, без добавочной нравственной оценки.
