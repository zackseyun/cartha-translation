  text: 'кроме ближайшего родственника: матери, отца, сына, дочери и брата —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: но только
  rationale: В продолжение запрета предыдущего стиха сочетание вводит исключение; «но только» естественно передаёт его ограничительный смысл и сохраняет синтаксическую связь с контекстом.
- source_word: שְׁאֵרוֹ
  choice: своего родственника
  rationale: Существительное обозначает родню, буквально связанную общей «плотью»; современное «родственник» ясно передаёт смысл без неестественного буквализма.
- source_word: הַקָּרֹב אֵלָיו
  choice: ближайшего
  rationale: Определение указывает на близость родства. «Ближайшего» кратко и естественно передаёт эту степень родственной близости.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: ради матери, ради отца, ради сына, ради дочери и ради брата
  rationale: Повтор «ради» отражает анафорическую цепочку לְ и показывает, что осквернение допускается по причине смерти каждого из перечисленных родственников.
theological_decisions:
- issue: Связь исключения с ритуальным осквернением из предыдущего стиха
  choice: Передать לְ как «ради» и начать с «но только»
  alternative: '«кроме своего ближайшего родственника: матери…»'
  rationale: 'Выбранный вариант не превращает родственника в прямой объект действия, а сохраняет смысл: священнику разрешено оскверниться ради умершего близкого родственника.'
translation_notes:
  register: Современный литературный русский, юридически ясный и торжественно-сдержанный. Повтор «ради» намеренно сохраняет структуру еврейского перечисления; конечное тире показывает продолжение списка в следующем стихе.
