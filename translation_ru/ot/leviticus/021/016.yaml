lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В повествовательной формуле введения прямой речи форма דבר естественно передаётся современным русским глаголом «сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом.
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: В данной формуле слово вводит последующее содержание речи; поскольку оно начинается в следующем стихе, русское двоеточие передаёт эту функцию без неестественного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» сохраняет его как имя и наиболее прямо отражает принятую научную реконструкцию произношения.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формула. Двоеточие сохраняет связь с речью, продолжающейся в следующем стихе.
