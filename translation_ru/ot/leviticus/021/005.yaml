source:
  edition: WLC
  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: ru
  text: Они не должны выбривать плешь на голове, сбривать край бороды[a] или делать на своём теле надрезы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сторону бороды»; еврейское слово может означать край, сторону или угол.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: не выбривают плеши
  rationale: Сочетание однокоренных глагола и существительного обозначает намеренное создание выбритого участка, а не естественное облысение. Формулировка передаёт конкретное действие и сохраняет выразительность еврейского оборота.
- source_word: בְּרֹאשָׁם
  choice: на голове
  rationale: В еврейском употреблено существительное в единственном числе с местоименным суффиксом множественного числа. Русское собирательно-распределительное единственное число здесь естественно.
- source_word: פְאַת זְקָנָם
  choice: край бороды
  rationale: פֵּאָה может означать край, сторону или угол. «Край бороды» сохраняет пространственный образ, не уточняя сверх текста конкретный способ стрижки.
- source_word: יְגַלֵּחוּ
  choice: не сбривают
  rationale: Форма пиэль указывает на удаление волос бритьём; «сбривать» естественно выражает результативный оттенок действия.
- source_word: וּבִבְשָׂרָם
  choice: на теле
  rationale: Буквально בָּשָׂר означает «плоть», однако в данном запрете речь идёт о нанесении порезов на тело. «На теле» звучит естественно по-русски и сохраняет телесную конкретность.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: не делают надрезов
  rationale: Однокоренное сочетание обозначает нанесение порезов или рассечений. «Делать надрезы» передаёт действие прямо, без излишне клинического или толковательного оттенка.
theological_decisions:
- issue: Характер запрета
  choice: Передать конкретные запреты на изменение волос и нанесение порезов, не добавляя цели обряда.
  alternative: Добавить «по умершему» или иное указание на траурный обычай на основании параллельных мест.
  rationale: Сам стих не содержит объяснения «по умершему». Его добавление сняло бы недосказанность текста и внесло бы сведения из параллельных мест непосредственно в перевод.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной формулировкой. Повтор «не» сохраняет трёхчастную структуру запрета. Маркер сноски поставлен при выражении «край бороды», к которому относится лексическая альтернатива.
