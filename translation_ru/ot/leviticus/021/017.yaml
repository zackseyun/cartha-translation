base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: ru
  text: 'Скажи Аарону: «Ни один мужчина из твоих потомков, в каком бы поколении он ни жил, если у него есть телесный недостаток[a], не должен приближаться, чтобы приносить пищу[b] своего Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское му́м означает телесный изъян или физический недостаток, который не позволяет исполнять эту священническую обязанность.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «хлеб». Здесь это слово в более широком смысле обозначает пищу жертвенных приношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: Скажи Аарону
  rationale: Естественно передаёт повеление и вводную формулу речи, не утяжеляя современный русский буквальным «говоря».
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: Никто из мужчин твоего потомства
  rationale: Сохраняет мужской референт אִישׁ в законодательстве о священническом служении и ясно выражает происхождение от Аарона.
- source_word: לְדֹרֹתָם
  choice: во всех их поколениях
  rationale: Передаёт постоянное действие установления для последующих поколений потомков Аарона.
- source_word: מוּם
  choice: телесный недостаток
  rationale: В данном священническом контексте слово обозначает физический недостаток, препятствующий исполнению конкретной храмовой обязанности; «телесный» предотвращает ошибочное нравственное истолкование.
- source_word: לֹא יִקְרַב
  choice: не должен приближаться
  rationale: Сохраняет юридическую силу запрета и характерный для священнических текстов образ приближения к святыне.
- source_word: לְהַקְרִיב
  choice: чтобы приносить
  rationale: В породе hифиль глагол קרב здесь означает представление жертвенного приношения; «приносить» естественно для русского библейского и современного религиозного языка.
- source_word: לֶחֶם אֱלֹהָיו
  choice: пищу своего Бога
  rationale: Хотя לֶחֶם буквально означает «хлеб», в жертвенном контексте оно шире обозначает пищу приношений; выбранный вариант передаёт контекстуальный смысл, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Ограничение священнического служения для потомков Аарона с телесными недостатками
  choice: Передать запрет как относящийся к приближению для принесения жертвенной пищи.
  alternative: Сформулировать его как общее отвержение человека или ограничение его принадлежности к народу завета.
  rationale: Текст регулирует исполнение определённой священнической обязанности и сам по себе не утверждает ни нравственной вины, ни меньшего достоинства человека, ни исключения из завета.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным звучанием. Формулировка сохраняет юридико-священнический характер стиха; сноски стоят непосредственно при поясняемых словах.
