id: LEV.21.8
reference: Leviticus 21:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: ru
  text: Считай его святым, потому что он приносит пищу твоего Бога. Пусть он будет свят для тебя, ибо Я, Яхве, освящающий вас, свят.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: Считай его святым
  rationale: Порода пиэль глагола קדשׁ с объектным суффиксом требует признать священника святым и соответственно относиться к нему. Такая формулировка естественна по-русски и не сводит повеление лишь к обрядовому посвящению.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: пищу твоего Бога
  rationale: Хотя לֶחֶם буквально означает «хлеб», в священническом и жертвенном контексте слово шире обозначает пищу, приносимую Богу; поэтому «пища» точнее передаёт контекстуальный смысл.
- source_word: מַקְרִיב
  choice: приносит
  rationale: Причастие хифиль от קרב в жертвенном контексте означает подносить или приносить жертву либо приношение. «Приносит» — ясный и традиционно понятный русский эквивалент.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: Пусть он будет свят для тебя
  rationale: Формулировка сохраняет модальное значение יִהְיֶה, повтор темы святости и отношение, выраженное предлогом לְ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: מְקַדִּשְׁכֶם
  choice: освящающий вас
  rationale: Причастная форма передаёт продолжающееся или характерное действие Бога и сохраняет корневую связь קדשׁ с повелением считать священника святым.
theological_decisions:
- issue: Культовое выражение לֶחֶם אֱלֹהֶיךָ
  choice: пищу твоего Бога
  alternative: хлеб твоего Бога
  rationale: В контексте священнического служения речь идёт не только о буквальном хлебе, но о жертвенных приношениях как пище Бога; более широкая передача не устраняет культовый образ.
- issue: Повтор лексики корня קדשׁ
  choice: святым / свят / освящающий
  alternative: посвяти / посвящён / посвящающий
  rationale: 'Выбранные слова сохраняют смысловую цепь: народ признаёт святость священника, она основана на служении Богу, а её высшее основание — святость Яхве, освящающего народ.'
- issue: Число адресата в стихе
  choice: твоего / для тебя, затем вас
  alternative: вашего / для вас во всём стихе
  rationale: Сохранён переход еврейского текста от единственного числа во второй части обращения к множественному в מְקַדִּשְׁכֶם, без искусственного выравнивания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор «святым — свят — освящающий» намеренно сохраняет композицию и богословскую связность еврейского текста; переход от единственного «тебя» к множественному «вас» также сохранён.
