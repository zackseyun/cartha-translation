  terminology: «Святой» и «освящающий» обеспечивают нужную лексическую связь без искусственной терминологизации. «Пища твоего Бога» адекватно выражает культовый смысл, не ограничивая לֶחֶם буквальным хлебом. Имя «Яхве» согласовано с принятой передачей тетраграмматона.
