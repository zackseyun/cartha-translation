  source_fidelity: 'Текст точно передаёт повелительный характер וְקִדַּשְׁתּוֹ как требование признавать священника святым; культовое значение לֶחֶם передано контекстуально оправданным словом «пища», а מַקְרִיב — естественным «приносит». Повтор קדשׁ сохранён: «святым — свят — освящающий». Личное имя יְהוָה последовательно передано как «Яхве». Также верно сохранён переход от единственного числа («твоего», «тебя») к множественному («вас») в заключительном причастии.'
