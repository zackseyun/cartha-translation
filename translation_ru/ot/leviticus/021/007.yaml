  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: ru
  text: Они не должны брать в жёны женщину, занимающуюся проституцией, или осквернённую[a]; не должны они брать и женщину, разведённую своим мужем, ведь священник свят для своего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишённую священного статуса». Значение еврейского слова в данном правовом контексте не вполне определённо: оно может указывать на женщину с осквернённым или нарушенным статусом.'
    reason: Сохраняет неоднозначность חֲלָלָה, не сводя термин ни к субъективной нравственной оценке, ни к одному конкретному юридическому случаю.
lexical_decisions:
- source_word: זֹנָה (zonah)
  choice: женщина, занимающаяся проституцией
  rationale: Передаёт обычное конкретное значение слова в данном брачном запрете без архаичного или оскорбительно-разговорного оттенка.
- source_word: חֲלָלָה (ḥalalah)
  choice: опороченная
  rationale: Сохраняет смысл женщины, чей статус считается нарушенным или осквернённым, не сводя термин к физической нечистоте; неоднозначность пояснена в сноске.
- source_word: יִקָּחוּ (yiqqaḥu)
  choice: брать в жёны
  rationale: В контексте требований к браку священников глагол «брать» означает вступать с женщиной в брак; дополнение делает русский текст естественным и недвусмысленным.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ (gerushah me’ishah)
  choice: женщина, разведённая с мужем
  rationale: Близко передаёт буквальный образ женщины, отосланной или разведённой своим мужем, при этом звучит понятно по-русски.
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו (qadosh hu le’lohav)
  choice: священник свят для своего Бога
  rationale: Еврейский текст переходит от множественного числа к единственному («он свят»). Явное «священник» устраняет ложную возможность отнести местоимение к мужу и передаёт собирательно-индивидуальный смысл.
theological_decisions:
- issue: Значение חֲלָלָה в брачном запрете
  choice: опороченная
  alternative: осквернённая / лишённая священного статуса
  rationale: Термин связан с корнем חלל («осквернять, лишать священного статуса») и может обозначать не просто моральную испорченность, а нарушенный статус. Основной текст оставляет формулировку широкой, а сноска сохраняет смысловой диапазон.
- issue: Переход от множественного числа к единственному
  choice: ведь священник свят для своего Бога
  alternative: ведь он свят для своего Бога
  rationale: 'Так сохраняется логика исходного текста: общий запрет относится ко всем священникам, а основание формулируется применительно к каждому священнику; при этом исключается ошибочная привязка «он» к упомянутому мужу.'
translation_notes:
  register: Современный литературный русский язык, с достоинством и без церковнославянизмов. Оборот «брать в жёны» естественно раскрывает брачный смысл глагола; повтор «не должны они брать» поддерживает торжественный законодательный ритм оригинала.
