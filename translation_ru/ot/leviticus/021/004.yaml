  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: ru
  text: Будучи мужем среди своего народа, он не должен осквернять себя и тем самым лишать себя святости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будучи знатным человеком среди своего народа, он не должен осквернять себя и тем самым лишать себя святости». Еврейская фраза трудна; её понимают и шире — как запрет осквернять себя человеку, занимающему видное положение среди своего народа, а не только мужу.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: осквернять себя
  rationale: Возвратная форма глагола טמא здесь обозначает ритуальное осквернение из-за соприкосновения с умершим. «Осквернять себя» естественно звучит по-русски и сохраняет связь с контекстом святости священника.
- source_word: בַּעַל
  choice: муж
  rationale: В этой трудной фразе слово בַּעַל понято в распространённом значении «муж», что согласуется с ближайшим контекстом правил о ритуальном осквернении при смерти близких родственников.
- source_word: בְּעַמָּיו
  choice: среди своего народа
  rationale: Передаёт буквальный смысл выражения; в данном контексте «народ» может подразумевать родственную или общинную среду.
- source_word: לְהֵחַלּוֹ
  choice: и тем самым бесчестить себя
  rationale: 'Инфинитив от חלל выражает следствие или цель: ритуально осквернившись, священник нарушил бы свой освящённый статус. «Бесчестить» сохраняет отличие этого понятия от טמא и понятно современному читателю.'
theological_decisions:
- issue: Толкование трудной фразы בַּעַל בְּעַמָּיו
  choice: 'Запрет священнику осквернять себя ради умершей жены: «как муж... среди своего народа».'
  alternative: '«Будучи знатным человеком среди своего народа, он не должен осквернять себя» или общее: «Он не должен осквернять себя среди своего народа».'
  rationale: Синтаксис еврейской фразы сжат и допускает несколько толкований. Значение «муж» для בַּעַל обычно и соответствует родственной логике ближайшего контекста, однако неоднозначность подлинна и потому отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением священнической терминологии. Трудная конструкция передана достаточно буквально, а существенная альтернатива вынесена в сноску.
