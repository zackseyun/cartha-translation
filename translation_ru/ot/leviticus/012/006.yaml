  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: ru
  text: Когда завершатся дни её очищения после рождения сына или дочери, она должна принести священнику ко входу в шатёр встречи однолетнего ягнёнка для всесожжения и молодого голубя или горлицу в жертву за грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское слово может обозначать жертву, устраняющую ритуальную нечистоту, а не только жертву за нравственный проступок.'
    reason: Лексическая неоднозначность культового термина חַטָּאת в контексте послеродового очищения.
lexical_decisions:
- source_word: וּבִמְלֹאת יְמֵי טָהֳרָהּ
  choice: Когда завершатся дни её очищения
  rationale: Сочетание предлога с инфинитивом מלא выражает завершение установленного срока; טָהֳרָה обозначает ритуальное очищение.
- source_word: לְבֵן אוֹ לְבַת
  choice: после рождения сына или дочери
  rationale: 'Контекстуально ясная русская передача: установление относится к сроку очищения после рождения ребёнка любого пола.'
- source_word: תָּבִיא
  choice: пусть она принесёт
  rationale: Имперфект в законодательном контексте выражает предписание; эта форма естественна для современного русского нормативного текста.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: однолетнего ягнёнка
  rationale: Еврейская идиома указывает на ягнёнка первого года жизни; выбранная формулировка кратка и привычна по-русски.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — устойчивый культовый термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: молодого голубя или горлицу
  rationale: בֶּן יוֹנָה обозначает молодого голубя, а תֹר — горлицу; различие между птицами сохранено.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Сохранён традиционный технический термин, а культово-очистительное значение в данном контексте отмечено в сноске.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: ко входу в шатёр встречи, к священнику
  rationale: 'Сохранены последовательность и оба ориентира исходного текста: место принесения и получатель.'
theological_decisions:
- issue: Значение חַטָּאת в контексте очищения после родов
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционная передача сохраняет связь с одноимённой категорией жертв в Левите, но сноска предупреждает, что здесь речь идёт об устранении ритуальной нечистоты и текст не называет сами роды нравственным грехом.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и культового регистра. Термин «шатёр встречи» прозрачно передаёт אֹהֶל מוֹעֵד; синтаксис остаётся естественным, но следует порядку еврейского текста в заключительной фразе.
