  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: ru
  text: Затем в течение тридцати трёх дней она должна пребывать в крови очищения[a]. Ни к чему священному она не должна прикасаться и не должна входить в святилище, пока не завершатся дни её очищения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в крови очищения». В еврейском тексте слово, переведённое как «кровь», стоит в форме множественного числа. Выражение относится к послеродовому периоду, связанному с ритуальным очищением.'
    reason: Сохраняет в основном тексте трудную формулу оригинала и поясняет её грамматическую форму и контекст, не утверждая, что кровь сама производит очищение.
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: тридцать три дня
  rationale: Еврейское «тридцать дней и три дня» естественно передаётся по-русски единым числительным.
- source_word: תֵּשֵׁב
  choice: она должна оставаться
  rationale: В данном предписании ישב обозначает продолжительное пребывание в определённом состоянии, а не буквальное сидение.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: в состоянии очищения от кровотечения
  rationale: Трудное выражение буквально связывает кровь с ритуальным очищением. Такой перевод сохраняет связь с послеродовым кровотечением, но не создаёт в русском ложного впечатления, будто сама кровь очищает женщину.
- source_word: בְּ/כָל קֹדֶשׁ לֹא תִגָּע
  choice: ни к чему священному она не должна прикасаться
  rationale: קֹדֶשׁ здесь охватывает предметы, имеющие священный статус; отрицательная конструкция естественно передана как «ни к чему».
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: и не должна входить в святилище
  rationale: מִקְדָּשׁ означает святилище, а сочетание с בוא в пространственном контексте естественно передаётся глаголом «входить».
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: пока не завершатся дни её очищения
  rationale: Передаёт временной предел и прямо выраженное местоименным суффиксом указание на её очищение.
theological_decisions:
- issue: Ритуальное очищение и нравственная вина
  choice: очищение
  alternative: очищение от греха
  rationale: Контекст говорит о ритуальном статусе после родов; текст не утверждает здесь нравственной виновности женщины.
- issue: Смысл выражения דְמֵי טָהֳרָה
  choice: состояние очищения от кровотечения
  alternative: кровь очищения
  rationale: Буквальная формула неоднозначна. Основной текст делает понятной связь с послеродовым периодом, а сноска сохраняет конкретный образ и грамматическую трудность оригинала, не утверждая, что кровь сама производит очищение.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным тоном, подходящим для ритуально-правового текста. Формула «не должна» ясна обычному читателю и сохраняет обязательный характер предписания; термин «святилище» удерживает культовый смысл.
