lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И говорил
  rationale: Форма с повествовательным וַ продвигает рассказ и вводит речь; «говорил» естественно передаёт стандартную формулу божественного обращения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно выражает адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание следующей прямой речи; в современном русском эту функцию естественно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Исходный текст содержит личное имя YHWH. «Яхве» — наиболее распространённая научная реконструкция произношения; примечание сохраняет сведения о еврейской форме и традиционной альтернативе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формульное לֵאמֹר передано пунктуационно, что естественно перед вводимой в следующем стихе прямой речью.
