  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: ru
  text: Если же она родит девочку, то будет нечиста две недели, как во время месячных[a], а затем шестьдесят шесть дней будет находиться в периоде очищения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможен более явный перевод: «как во время её менструальной нечистоты». Еврейский текст сопоставляет нечистоту после родов с ритуальным состоянием, связанным с менструацией.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «при крови очищения». Имеется в виду установленный срок послеродового очищения, а не очищение от нравственной вины.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Союз с условной частицей вводит случай, противопоставленный рождению мальчика в предыдущем стихе; «же» естественно передаёт это контекстуальное противопоставление.
- source_word: נְקֵבָה תֵלֵד
  choice: она родит девочку
  rationale: נְקֵבָה буквально обозначает лицо женского пола; в контексте родов русское «девочку» точно и естественно.
- source_word: וְטָמְאָה
  choice: то будет нечиста
  rationale: Формулировка сохраняет установленный законом ритуальный статус, не добавляя отсутствующего в еврейском тексте определения «обрядово» и не подразумевая нравственной вины.
- source_word: שְׁבֻעַיִם
  choice: две недели
  rationale: Двойственное число в данном контексте означает две недели; буквальное «две седмицы» архаично для современного русского языка.
- source_word: כְּנִדָּתָהּ
  choice: как во время месячных
  rationale: נִדָּה здесь обозначает состояние или период, связанный с менструацией. Выражение современно и ясно передаёт сравнение.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: а шестьдесят шесть дней
  rationale: Составное еврейское числительное естественно объединено по нормам русского языка; «а» обозначает переход ко второму сроку.
- source_word: תֵּשֵׁב
  choice: будет пребывать
  rationale: Буквальное значение «сидеть» в этом правовом контексте идиоматически означает продолжать находиться в определённом состоянии или периоде.
- source_word: עַל דְּמֵי טָהֳרָה
  choice: в очищении от кровотечения
  rationale: Фраза буквально связана с «кровью очищения» и обозначает установленный послеродовой период очищения. Русская формулировка передаёт смысл без неестественного буквального «на кровях очищения».
theological_decisions:
- issue: Характер нечистоты после родов
  choice: Сохранить слово «нечиста» как обозначение ритуального статуса.
  alternative: «ритуально нечиста» или «обрядово нечиста»
  rationale: В стихе говорится о культово-ритуальном состоянии, а не о личном грехе или нравственном осквернении. Уточняющее прилагательное верно объясняло бы контекст, но отсутствует в исходном тексте.
- issue: Значение выражения «кровь очищения»
  choice: Передать его как установленный период «очищения от кровотечения» и пояснить в сноске.
  alternative: Буквальное «при крови очищения» или традиционное «в очищении от кровей»
  rationale: Буквальные варианты затемняют смысл для современного читателя. Выбранная формулировка сохраняет связь с послеродовым кровотечением, а сноска исключает нравственное понимание очищения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным правовым оттенком. «Месячные» выбрано как общеупотребительное и ясное слово; «пребывать» сохраняет достоинство стиля и длительный характер состояния.
