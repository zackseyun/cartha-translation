  naturalness: Текст написан на современном литературном русском с уместно сдержанным торжественным оттенком. «Пред Яхве», «совершит за неё искупление» и «Таков закон» соответствуют законодательному и культовому регистру Левита. Формулировка «от источника своей крови» намеренно несколько буквальна, но её смысл своевременно пояснён в сноске.
