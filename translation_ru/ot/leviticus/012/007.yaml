  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: ru
  text: Он представит это пред Яхве и совершит за неё искупление; тогда она очистится от источника своей крови[a]. Таков закон о женщине, родившей мальчика или девочку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от истечения своей крови». Буквально: «от источника своей крови».'
    reason: Лексема מָקוֹר сохраняет образ источника, но в данном контексте может обозначать истечение крови или его телесный источник.
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Он представит это
  rationale: Глагол в породе hифиль обозначает принесение или представление жертвы перед Богом. Указательное «это» естественно отсылает к жертвенному приношению из предыдущего стиха и не навязывает спорную идентификацию объекта мужского рода.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Культовая формула означает представление в присутствии Бога; «пред» сохраняет торжественный, но понятный регистр. Имя יהוה передано как «Яхве».
- source_word: וְכִפֶּר עָלֶיהָ
  choice: совершит за неё искупление
  rationale: В священническом ритуальном контексте כפר обозначает действие, посредством которого достигается искупление или очищение. Формулировка сохраняет богословскую ёмкость термина, не сводя его только к одному объяснению механизма обряда.
- source_word: וְטָהֲרָה
  choice: тогда она очистится
  rationale: 'Последовательная форма выражает результат священнического действия: женщина становится ритуально чистой. «Тогда» ясно передаёт эту связь без добавления причинного толкования.'
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: от источника своей крови
  rationale: מָקוֹר буквально означает «источник, родник». Основной текст сохраняет телесный образ оригинала, а более смысловой вариант вынесен в примечание.
- source_word: זֹאת תּוֹרַת
  choice: Таков закон о
  rationale: תּוֹרָה здесь означает установленное ритуальное предписание. Формула «Таков закон о…» естественна для законодательного контекста Левита.
- source_word: הַיֹּלֶדֶת
  choice: женщине, родившей
  rationale: Причастие обозначает женщину в связи с родами. Перевод сохраняет конкретный смысл и звучит естественнее буквального «рождающей».
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: мальчика или девочку
  rationale: Буквально стоят слова «самца/мужского пола» и «самку/женского пола», но применительно к человеческому ребёнку современные русские «мальчика или девочку» точно и естественно передают смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное заветное имя יהוה. Форма «Яхве» передаёт его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Связь искупления с послеродовым очищением
  choice: совершит за неё искупление; тогда она очистится
  alternative: очистит её от истечения крови
  rationale: Раздельная передача כפר и טהר сохраняет два действия/результата оригинала и не отождествляет искупление без остатка с физическим прекращением кровотечения.
translation_notes:
  register: Современный литературный русский с умеренно торжественной культовой лексикой. Синтаксис сделан ясным для обычного читателя; буквальный образ «источника крови» сохранён и пояснён примечанием.
