  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: ru
  text: 'Скажи сынам Израиля: «Если женщина зачнёт и родит ребёнка мужского пола[a], то она будет нечиста семь дней; как в дни её менструальной нечистоты, она будет нечиста[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «родит мужское»; существительное подразумевается.'
    reason: lexical_alternative
  - marker: b
    text: Здесь речь идёт о ритуальной нечистоте, связанной с менструацией.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет традиционное национально-заветное обозначение и грамматическую форму оригинала; в данном контексте обращение относится к народу Израиля в целом.
- source_word: כִּי
  choice: если
  rationale: Частица вводит правовой казус; «если» естественно передаёт условную формулировку, хотя по контексту возможно и «когда».
- source_word: תַזְרִיעַ
  choice: зачнёт
  rationale: В сочетании с последующим упоминанием родов глагол естественно означает зачатие; буквальное «произведёт семя» по-русски не передаёт идиоматического смысла.
- source_word: וְיָלְדָה זָכָר
  choice: и родит ребёнка мужского пола
  rationale: Ясно сохраняет указание на пол младенца; более буквальное «родит мужского пола» требует подразумеваемого существительного и звучит менее естественно.
- source_word: וְטָמְאָה / תִּטְמָא
  choice: она будет нечиста
  rationale: Сохраняет повтор исходного текста и юридический регистр, не добавляя в основной текст отсутствующего определения «ритуально».
- source_word: נִדַּת דְּוֺתָהּ
  choice: нечистоты при её месячных
  rationale: Передаёт связь с менструальным истечением и состоянием нечистоты понятным современным языком, избегая архаичного или медицински неточного «недуга».
theological_decisions:
- issue: Характер нечистоты טמא в законах о чистоте
  choice: нечиста
  alternative: ритуально нечиста
  rationale: Контекст указывает на ритуально-правовой статус, но само еврейское слово не содержит отдельного определения «ритуально»; пояснение вынесено в сноску.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Формальная передача сохраняет традиционное обозначение исходного текста и не сужает адресатов до взрослых мужчин.
- issue: Условная частица כִּי
  choice: если
  alternative: когда
  rationale: Обе передачи возможны в формуле казуального права; «если» лучше сохраняет условную форму, не исключая типичности описываемого случая.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным правовым звучанием. Сохранён повтор «будет нечиста», присутствующий в еврейском тексте; терминология понятна без архаизмов.
