  source_fidelity: 'Основной смысл передан точно: обращение адресовано сынам Израиля; условная правовая формула, зачатие, рождение ребёнка мужского пола, семидневный срок и повторное утверждение нечистоты сохранены. Однако заключительное сравнение в черновике сформулировано синтаксически неудачно и менее ясно, чем еврейское כִּימֵי נִדַּת דְּוֺתָהּ («как в дни её менструальной нечистоты»).'
