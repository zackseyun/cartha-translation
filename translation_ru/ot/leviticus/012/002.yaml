  terminology: '«Сынам Израиля», «зачнёт», «нечиста» и «ребёнка мужского пола» приемлемы. Сноска a в её нынешнем виде неточна как буквальное пояснение: «родит мужского пола» не является корректной русской формой. Её следует сформулировать как указание на отсутствие выраженного существительного при еврейском «мужской [пол] / мужское».'
