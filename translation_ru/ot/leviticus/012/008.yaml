  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: ru
  text: 'Если же у неё не хватит средств на ягнёнка, пусть она возьмёт двух горлиц или двух молодых голубей: одну птицу для всесожжения, а другую — в жертву за грех[a]. Священник совершит за неё искупление, и она станет чиста.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву»; здесь жертва связана с ритуальной нечистотой после родов.'
    reason: Лексически возможное и контекстуально существенное значение חַטָּאת.
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: у неё не хватит средств на ягнёнка
  rationale: Еврейская идиома буквально говорит, что её рука не находит достаточного для ягнёнка; русский оборот естественно передаёт недостаток материальных средств.
- source_word: שֶׂה
  choice: ягнёнок
  rationale: В данном жертвенном контексте речь идёт о животном, предписанном в предыдущем стихе; «ягнёнок» — ясный и естественный эквивалент.
- source_word: שְׁתֵּי תֹרִים
  choice: двух горлиц
  rationale: תֹר обозначает именно горлицу, а не голубя вообще.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: двух молодых голубей
  rationale: Буквальное выражение «сыновья голубя» является идиомой, обозначающей молодых голубей.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский библейский термин точно передаёт жертву, целиком сжигаемую на жертвеннике.
- source_word: חַטָּאת
  choice: жертва за грех
  rationale: Сохраняется традиционное соответствие ключевому жертвенному термину, тогда как контекстуальный смысл очистительной жертвы отмечен в сноске.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: совершит за неё искупление
  rationale: Формулировка сохраняет культово-богословскую силу глагола כפר, не уточняя сверх текста механизм искупления.
- source_word: וְטָהֵרָה
  choice: она станет чиста
  rationale: Глагол означает переход в состояние ритуальной чистоты; эта краткая формулировка передаёт и результат, и изменение состояния.
theological_decisions:
- issue: Значение חַטָּאת в контексте очищения после родов
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Контекст относится к ритуальной нечистоте, а не утверждает личную нравственную вину роженицы. Однако основной текст сохраняет традиционное наименование жертвы, а сноска указывает на контекстуально возможный перевод и тем самым не снимает смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением принятой библейской жертвенной терминологии. Добавление «птицу» после распределения двух птиц служит естественной русской связности и не меняет смысла.
