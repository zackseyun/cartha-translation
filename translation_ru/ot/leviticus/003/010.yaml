base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: ru
  text: и обе почки, и жир на них, находящийся в поясничной области, и отросток[a] на печени, который он отделит вместе с почками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долю печени». Точное значение еврейского анатомического термина יֹתֶרֶת неизвестно.'
    reason: Лексическая альтернатива и сохранение неопределённости исходного термина.
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: обе почки
  rationale: Конкретное анатомическое обозначение точно передаёт כְּלָיֹת; числительное естественно выражено русским «обе».
- source_word: הַחֵלֶב
  choice: жир
  rationale: В контексте жертвоприношения слово обозначает предназначенный для жертвенника внутренний жир; общеупотребительное «жир» ясно и не требует узкоспециального термина.
- source_word: אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: на них, находящийся у поясницы
  rationale: Сохранены обе характеристики жира и их пространственный смысл; причастный оборот устраняет неясность связи в русском предложении.
- source_word: הַיֹּתֶרֶת
  choice: отросток
  rationale: Точное соответствие этого неясного анатомического термина неизвестно. «Отросток» передаёт общее значение придаточной части, не выдавая предположительное «доля» за несомненный смысл.
- source_word: עַל הַכָּבֵד
  choice: на печени
  rationale: Пространственное «на» сохраняет широту еврейского עַל и не уточняет без достаточных оснований характер анатомического соединения.
- source_word: עַל הַכְּלָיֹת
  choice: вместе с почками
  rationale: 'В жертвенной формуле оборот естественно понимается процедурно: отросток отделяют при удалении почек. Буквальное «на почках» по-русски создало бы сомнительную анатомическую связь.'
- source_word: יְסִירֶנָּה
  choice: его пусть отделит
  rationale: Побудительная конструкция передаёт предписывающую форму глагола; местоимение явно соотносится с «отростком», а «отделит» уместно для удаления жертвенной части.
