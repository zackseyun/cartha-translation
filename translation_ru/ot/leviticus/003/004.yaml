base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: ru
  text: и обе почки, и жир, покрывающий их и находящийся в области поясницы, и придаток, находящийся на печени[a], пусть он отделит вместе с почками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долю на печени». Точное значение еврейского названия этой анатомической части не установлено; в основном тексте употреблено слово «придаток», чтобы не создавать впечатления излишней точности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: обе почки
  rationale: Прямое и естественное обозначение парного анатомического органа в русском языке.
- source_word: הַחֵלֶב
  choice: жир
  rationale: В контексте жертвоприношений обозначает предназначенные для принесения жировые части; «жир» ясно и не требует узкоспециального термина.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: который на них
  rationale: Относительное предложение относится к жиру и сохраняет пространственное значение исходного текста.
- source_word: הַכְּסָלִים
  choice: у поясницы
  rationale: Термин обозначает область поясницы или боков; такой перевод естественно описывает расположение жира, не вводя излишней анатомической точности.
- source_word: הַיֹּתֶרֶת
  choice: придаток
  rationale: Точное значение трудного анатомического термина не установлено; «придаток» передаёт выступающую или добавочную часть, не отождествляя её без достаточных оснований с определённой долей.
- source_word: עַל הַכָּבֵד
  choice: печени
  rationale: В сочетании «придаток печени» по-русски естественно передаётся анатомическая связь, выраженная עַל, без чрезмерно буквального и неясного «на печени».
- source_word: עַל הַכְּלָיוֹת
  choice: вместе с почками
  rationale: В жертвенной формуле выражение указывает, что названную часть следует отделить вместе с почками; это сохраняет процедурный смысл и избегает анатомически неясного буквального оборота.
- source_word: יְסִירֶנָּה
  choice: пусть он отделит
  rationale: Передаёт предписывающую силу формы и конкретное действие по отделению жертвенных частей; местоимение мужского рода сохраняет подразумеваемого исполнителя из контекста.
