revisions:
- from: И священник сожжёт их на жертвеннике как пищу[a] — огненную жертву, благоухание, приятное Яхве[b]. Весь жир — Яхве[c].
  to: И священник сожжёт их на жертвеннике как пищу огненной жертвы — в приятное благоухание Яхве[a]. Весь жир — для Яхве[b].
  rationale: 'Перестроено первое предложение, чтобы ясно передать последовательность еврейских формул: «пища огненной жертвы» и «в приятное благоухание Яхве». Заключительная формула исправлена на «для Яхве», что естественно по-русски и точно выражает направленность/посвящение, обозначенное предлогом ל. Сноска о «пище (или хлебе)» не нужна при выбранной ясной основной передаче; сохранены только действительно полезные лексические альтернативы.'
