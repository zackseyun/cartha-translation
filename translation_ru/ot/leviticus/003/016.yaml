base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: ru
  text: И священник сожжёт их на жертвеннике как пищу огненной жертвы — в приятное благоухание Яхве[a]. Весь жир — для Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в успокоительное благоухание»; буквально: «для благоухания успокоения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Весь жир принадлежит Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: И священник сожжёт их
  rationale: Глагол קטר в породе хифиль в жертвенном контексте означает сжечь на жертвеннике, чтобы жертва поднялась в дыме. Местоименный суффикс мужского рода множественного числа передан словом «их» и отсылает к ранее названным жертвенным частям; подлежащее «священник» выражено следующим существительным.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс -ה здесь имеет местное значение; в данном контексте естественный русский эквивалент — «на жертвеннике».
- source_word: לֶחֶם אִשֶּׁה
  choice: как пищу — огненную жертву
  rationale: לֶחֶם может обозначать не только хлеб, но и пищу вообще, а אִשֶּׁה — жертву, предаваемую огню. Формулировка сохраняет оба элемента еврейского выражения, не создавая ошибочного впечатления, будто речь идёт о буквальном хлебе.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  rationale: Устойчивая жертвенная формула буквально говорит о приятном или успокоительном запахе. Русское «благоухание, приятное Яхве» сохраняет образ и не подменяет его богословским объяснением приемлемости жертвы.
- source_word: כָּל חֵלֶב
  choice: Весь жир
  rationale: כָּל придаёт выражению всеохватный смысл, а חֵלֶב в контексте обозначает жир жертвенного животного, прежде всего предписанные жировые части.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Краткая именная конструкция «Весь жир — Яхве» сохраняет буквальную и допускающую оттенки посвящения и принадлежности конструкцию с ל, не сводя её только к одному значению. Имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В тексте прямо стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и согласуется с предоставленным решением English POB.
- issue: Значение ל в формуле כָּל חֵלֶב לַיהוָה
  choice: Весь жир — Яхве
  alternative: Весь жир принадлежит Яхве
  rationale: Еврейская конструкция может выражать предназначение, посвящение или принадлежность. Эллиптическая русская формула сохраняет эту смысловую ёмкость, тогда как «принадлежит» несколько сужает её.
- issue: Жертвенная формула לְרֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  alternative: для приятного благоухания
  rationale: Выбранная передача сохраняет культовую метафору приятного запаха, не истолковывая её дополнительно как умилостивление или принятие.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. «Жертвенник» сохраняет культовую точность; «огненная жертва» компактно передаёт специальный термин אִשֶּׁה. Тире используются для ясного членения плотной еврейской формулы и сохранения краткости заключительного предписания.
