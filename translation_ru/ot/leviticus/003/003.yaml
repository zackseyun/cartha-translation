base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: ru
  text: Из мирной жертвы пусть он принесёт Яхве как жертву, сжигаемую на огне,[a] жир, покрывающий внутренности, и весь жир на внутренностях,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как пищевое приношение». Значение еврейского слова понимается по-разному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: пусть он принесёт
  rationale: Хифиль глагола קרב в жертвенном контексте обозначает ритуальное принесение или представление жертвы. Такая формулировка естественна по-русски и сохраняет предписывающий характер текста.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: из мирной жертвы
  rationale: זֶבַח обозначает закалываемую жертву, а שְׁלָמִים — традиционно называемый по-русски вид «мирной жертвы». Формулировка сохраняет узнаваемую категорию закона о жертвоприношениях.
- source_word: אִשֶּׁה
  choice: как огненное приношение
  rationale: Слово обозначает жертву, обращаемую в дым на огне, хотя возможна трактовка как пищи, приносимой Богу. Основной текст передаёт огневой аспект, а смысловая альтернатива сохранена в примечании.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а не заменено титулом.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: жир, покрывающий внутренности
  rationale: חֵלֶב здесь означает предназначенные для жертвенника жировые части, а קֶרֶב — внутренние органы животного. Причастная конструкция естественно передана определительным оборотом.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: весь жир, который находится на внутренностях
  rationale: Перевод сохраняет различие между жиром, покрывающим внутренности, и всем остальным жиром, расположенным на них.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблено заветное имя יהוה; транслитерация сохраняет различие между личным именем и титулом.
- issue: Значение אִשֶּׁה в жертвенном законодательстве
  choice: огненное приношение
  alternative: пищевое приношение
  rationale: Основной перевод сохраняет связь жертвы с огнём и дымом, не устраняя возможную культовую метафору пищи для Бога; альтернативное понимание указано в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным регистром. Синтаксис следует структуре еврейского предписания; конечная запятая сохранена, поскольку стих продолжается следующим перечнем.
