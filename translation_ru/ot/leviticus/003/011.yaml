  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: ru
  text: Священник сожжёт это на жертвеннике как пищу[a] огненного приношения для Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб огненного приношения для Яхве»; здесь слово «хлеб» в жертвенной идиоме означает пищу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: сожжёт это
  rationale: В породе хифиль глагол קטר в жертвенном контексте означает сжечь на жертвеннике так, чтобы жертва поднялась дымом. «Сожжёт» естественно и ясно по-русски, хотя оттенок восходящего дыма остаётся подразумеваемым.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное и точное обозначение служителя культа в данном контексте.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс при слове «жертвенник» в описании обряда естественно передаётся как помещение жертвы на жертвенник для сожжения.
- source_word: לֶחֶם
  choice: пища
  rationale: Хотя основное значение слова — «хлеб», здесь оно употреблено в жертвенной идиоме и обозначает пищу как долю, возносимую на жертвеннике. «Пища» не создаёт ложного впечатления, будто речь идёт именно о печёном хлебе.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Технический культовый термин обозначает жертву, приносимую посредством огня. «Огненная жертва» кратко и понятно сохраняет ритуальный смысл.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל передаёт посвящение жертвы Яхве; русская конструкция «жертва Яхве» естественно выражает адресата и принадлежность приношения.
theological_decisions:
- issue: Передача жертвенной идиомы לֶחֶם אִשֶּׁה
  choice: как пищу — огненную жертву
  alternative: как хлеб огненной жертвы; как пищу огненной жертвы
  rationale: Формулировка сохраняет сочетание образа пищи и технического названия жертвы, не утверждая, что Богу физически необходима пища. Тире допускает пояснительное отношение между двумя выражениями, не устраняя полностью синтаксическую ёмкость еврейской фразы.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной ритуальной формулировкой. Имя יהוה передано как «Яхве». Союз ו в начале стиха не воспроизведён отдельно, поскольку в русском самостоятельном стихе начальное «и» звучало бы избыточно; последовательность предписаний передаётся контекстом.
