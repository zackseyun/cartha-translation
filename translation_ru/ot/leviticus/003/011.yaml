- from: Священник сожжёт это на жертвеннике как пищу[a] — огненную жертву Яхве.
  to: Священник сожжёт это на жертвеннике как пищу[a] огненного приношения для Яхве.
  rationale: Исправление сохраняет ясное «сожжёт» для הִקְטִיר, но точнее передаёт словосочетание לֶחֶם אִשֶּׁה как «пища огненного приношения». Явное «для Яхве» отражает לַיהוָה. Сноска сохраняет буквальный образ «хлеба», не навязывая представления о буквальном хлебе или физическом питании Бога.
