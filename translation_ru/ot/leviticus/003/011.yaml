  - severity: low
    issue: Предлог לַיהוָה в основном тексте выражен недостаточно явно.
    rationale: «Жертва Яхве» в русском может означать принадлежащую Яхве или посвящённую ему; «для Яхве» непосредственно передаёт адресность еврейского предлога.
