  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: ru
  text: А если его приношение Яхве — мирная жертва из мелкого скота[a], то пусть он принесёт самца или самку без изъяна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из овец или коз». Еврейское צֹאן обозначает мелкий скот — овец и коз.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְאִם
  choice: А если
  rationale: Сохраняет связь с предыдущими предписаниями и условный характер нового случая.
- source_word: מִן הַצֹּאן
  choice: из мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз; русский термин точно передаёт категорию, не ограничивая её одним видом.
- source_word: קָרְבָּנוֹ
  choice: его приношение
  rationale: קָרְבָּן обозначает принесённый Богу дар; «приношение» естественно и уместно в культовом контексте.
- source_word: לְזֶבַח שְׁלָמִים
  choice: как жертва мирная
  rationale: Передаёт זֶבַח как жертву, а технический термин שְׁלָמִים — традиционным русским выражением, не устраняя его смысловой связи с миром, благополучием и совместной трапезой.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно присутствующее в еврейском тексте личное имя יהוה; дательный смысл предлога выражен конструкцией «приношение Яхве».
- source_word: זָכָר אוֹ נְקֵבָה
  choice: самца или самку
  rationale: Прямо и естественно обозначает допустимый пол жертвенного животного.
- source_word: תָּמִים
  choice: без изъяна
  rationale: В жертвенном контексте означает отсутствие физического дефекта; это ясная современная формулировка.
- source_word: יַקְרִיבֶנּוּ
  choice: пусть он принесёт животное
  rationale: Hiphil глагола קרב в культовом контексте означает представить или принести в жертву; явное «животное» устраняет неестественную местоименную двусмысленность по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерационная передача сохраняет личное заветное имя, не подменяя его титулом.
- issue: Значение שְׁלָמִים
  choice: жертва мирная
  alternative: жертва общения / жертва благополучия
  rationale: Традиционный термин сохраняет связь корня с миром и целостным благополучием, тогда как примечание указывает на более широкий смысл, включая общение за жертвенной трапезой.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Порядок слов слегка перестроен ради ясности: определение «без изъяна» однозначно относится к животному, а «самца или самку» сохраняет обе допустимые категории.'
