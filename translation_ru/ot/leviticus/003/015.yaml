base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: ru
  text: и обе почки, жир на них, находящийся у поясницы, и придаток печени[a] — вместе с почками[b] пусть отделит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долю печени». Точное значение еврейского анатомического термина יֹתֶרֶת неизвестно, поэтому в основном тексте употреблено более общее слово «придаток».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на почках». Здесь, вероятно, имеется в виду, что эту часть следует отделить вместе с почками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: обе почки
  rationale: Сочетание с числительным «две» естественно передаётся по-русски как «обе почки»; כְּלָיֹת в жертвенной анатомии однозначно обозначает почки.
- source_word: הַחֵלֶב
  choice: жир
  rationale: В жертвенных предписаниях חֵלֶב обозначает предназначенные для принесения жировые части. «Жир» — ясный и традиционно уместный русский эквивалент без излишней анатомической конкретизации.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: на них
  rationale: Относительное выражение относится к почкам и обозначает расположенный на них жир.
- source_word: הַכְּסָלִים
  choice: поясница
  rationale: В данном анатомическом контексте כְּסָלִים указывает на область поясницы или боков. «У поясницы» звучит естественно и не создаёт ложной точности.
- source_word: הַיֹּתֶרֶת
  choice: придаток
  rationale: Точное соответствие этой анатомической детали современному термину остаётся спорным. «Придаток» передаёт выступающую или добавочную часть, не выдавая предположение за установленную идентификацию.
- source_word: עַל הַכָּבֵד
  choice: печени
  rationale: В сочетании «придаток печени» русская родительная конструкция естественно передаёт деталь, расположенную на печени, не меняя её связи с печенью.
- source_word: עַל הַכְּלָיֹת
  choice: вместе с почками
  rationale: В жертвенной формуле выражение, вероятно, описывает совместное отделение этой части с почками. Буквальное пространственное значение отмечено в сноске.
- source_word: יְסִירֶנָּה
  choice: пусть отделит
  rationale: Каузативная форма סור предписывает отделить указанные части. «Пусть отделит» сохраняет нормативный характер ритуального указания и согласуется с контекстом, где исполнитель назван ранее.
