source:
  edition: WLC
  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: ru
  text: И сыновья Аарона сожгут его на жертвеннике поверх всесожжения, лежащего на дровах над огнём. Это огненная жертва[a] — благоухание, приятное Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пища, приносимая в жертву».'
    reason: Лексическое значение אִשֶּׁה в жертвенной формуле допускает как традиционное понимание приношения, совершаемого посредством огня, так и культовое обозначение пищи, предназначенной Богу.
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: сожгут
  rationale: В породе hифиль глагол קטר в жертвенном контексте означает сжечь приношение на жертвеннике, чтобы оно поднялось в дыму. «Сожгут» ясно и естественно передаёт предписываемое действие.
- source_word: אֹתוֹ
  choice: это
  rationale: Местоимение прямого дополнения отсылает к части мирной жертвы, описанной в предыдущем стихе.
- source_word: בְנֵי אַהֲרֹן
  choice: сыновья Аарона
  rationale: Прямой и естественный перевод сочетания, обозначающего священников из семьи Аарона.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс указывает на место, куда помещают жертву для сожжения; по-русски это естественно передаётся предложным сочетанием.
- source_word: עַל הָעֹלָה
  choice: поверх всесожжения
  rationale: עַל здесь естественнее всего обозначает расположение сверху; עֹלָה передано традиционным и точным термином «всесожжение».
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: лежащего на дровах над огнём
  rationale: Формулировка сохраняет последовательность расположения на жертвеннике, но избегает тяжеловесного буквального повтора «которое... которые». «Дрова» уместнее общего «дерево» в контексте огня жертвенника.
- source_word: אִשֵּׁה
  choice: жертва, сжигаемая в огне
  rationale: Технический жертвенный термин связан с принесением посредством огня. Описательный перевод понятен современному читателю; культовое понимание как пищи, предназначенной Богу, сохранено в примечании как возможная передача.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Устойчивая жертвенная формула выражает угодность приношения Богу. «Благоухание, приятное Яхве» сохраняет образ запаха и не сводит его к одной лишь абстрактной приемлемости.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה, а отношение, выраженное предлогом ל, естественно включено в конструкцию «приятное Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет Тетраграмматон; «Яхве» сохраняет личное заветное имя и наиболее вероятное произношение, не подменяя имя титулом.
- issue: Передача технического термина אִשֵּׁה
  choice: жертва, сжигаемая в огне
  alternative: пища, приносимая в жертву; огненная жертва
  rationale: Смысл термина допускает акцент как на принесении огнём, так и на культовой «пище» Бога. Основной текст передаёт способ принесения, не подразумевая буквальной потребности Бога в пище; иной культовый оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства ритуального предписания. Синтаксис слегка сглажен ради ясности, но последовательность элементов на жертвеннике и формульное выражение רֵיחַ נִיחֹחַ сохранены.
