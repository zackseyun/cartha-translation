  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: ru
  text: 'И пусть он принесёт из мирной жертвы[a] огненное приношение Яхве: его жир — весь курдюк[b], который он должен отделить у основания хребта[c], — а также жир, покрывающий внутренности, и весь жир на внутренностях,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; или: «жертвы благополучия».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «весь жирный хвост». Имеется в виду курдюк овцы, отделяемый целиком.'
    reason: cultural_note
  - marker: c
    text: 'Или: «напротив хребта»; возможно также: «у основания позвоночника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: мирная жертва
  rationale: Традиционный и узнаваемый русский термин для данного вида жертвы; при этом примечание сохраняет значения общения и благополучия, присутствующие в семантическом диапазоне שְׁלָמִים.
- source_word: אִשֶּׁה
  choice: приношение, сжигаемое в огне
  rationale: Передаёт ритуальное приношение, возлагаемое на алтарный огонь, и не создаёт впечатления, будто речь идёт об обычной пище.
- source_word: חֶלְבּוֹ
  choice: её жир
  rationale: Речь идёт о жировых частях животного, предназначенных для принесения; местоимение согласовано с русским словом «жертва».
- source_word: הָאַלְיָה תְמִימָה
  choice: весь жирный курдюк
  rationale: אַלְיָה обозначает характерный для курдючной овцы широкий жировой хвост, а תְמִימָה указывает, что его отделяют целиком.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: у самого позвоночника
  rationale: Естественно передаёт анатомическое место отделения курдюка, не скрывая того, что точный пространственный смысл выражения допускает и другие толкования.
- source_word: יְסִירֶנָּה
  choice: который следует отделить
  rationale: Форма глагола סור в породе hифиль означает удаление или отделение; безличная нормативная конструкция естественна для русского ритуального предписания.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: жир, покрывающий внутренности
  rationale: В жертвенно-анатомическом контексте קֶרֶב обозначает внутренние органы; формулировка конкретна и сохраняет образ покрывающего их жира.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: весь жир на внутренностях
  rationale: Сохраняет различие между жиром, который покрывает внутренности, и всем жиром, находящимся на них.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное заветное имя Бога. Форма «Яхве» передаёт имя, а не заменяет его титулом.
- issue: Значение זֶבַח הַשְּׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Термин может подчёркивать мир, благополучие и совместное участие в жертвенной трапезе. Основной текст сохраняет традиционное название, а примечание — смысловую многогранность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром. Синтаксис сохраняет перечислительную структуру еврейского текста и конечную запятую, поскольку стих продолжается в следующем предложении. Термин «курдюк» выбран как точное и понятное анатомическое обозначение.
