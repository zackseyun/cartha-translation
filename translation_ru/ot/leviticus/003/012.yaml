  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: ru
  text: Если же его приношение — коза, пусть он представит её перед Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон, личное имя Бога), передаваемое здесь как «Яхве»; традиционно в переводах заменяется словом «Господь».'
    reason: Поясняет передачу тетраграмматона и традиционную замену имени титулом без противоречия основному тексту.
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Сочетание союза с условной частицей вводит следующий случай в ряду предписаний; «если же» естественно передаёт переход и лёгкое сопоставление с предыдущими вариантами.
- source_word: עֵז
  choice: из коз
  rationale: Слово обозначает козу или животное из коз; конструкция «приношение — из коз» естественна для русского языка жертвенных предписаний и не навязывает указание на пол животного.
- source_word: קָרְבָּנוֹ
  choice: его приношение
  rationale: קָרְבָּן — общее обозначение дара, который приносят и представляют Богу; «приношение» шире и точнее, чем более узкое «жертва».
- source_word: וְהִקְרִיבוֹ
  choice: пусть он представит его
  rationale: Каузативная форма корня קרב означает «приблизить, представить»; в данном законодательном контексте «пусть» ясно передаёт предписывающую силу формы.
- source_word: לִפְנֵי
  choice: перед
  rationale: Краткое и естественное соответствие пространственному и культовому выражению «перед лицом, в присутствии».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Форма «Яхве» сохраняет личное имя и позволяет отличить его от титула.
- issue: Род животного в עֵז
  choice: из коз
  alternative: коза
  rationale: Русское «коза» обычно обозначает именно самку, тогда как контекст допускает родовое обозначение козьего животного; перевод не должен без необходимости сужать смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис краткий и ясный; сохранена последовательность условного предписания. Местоимение «его» после «представит» относится к приношению.
