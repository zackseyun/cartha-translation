  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: ru
  text: И пусть он возложит руку на голову животного и заколет его перед шатром встречи, а сыновья Аарона пусть обрызгают жертвенник его кровью со всех сторон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть выплеснут его кровь на жертвенник со всех сторон». Еврейский глагол обозначает нанесение крови броском или плеском; «обрызгают» передаёт результат этого действия более естественно по-русски.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁוֹ
  choice: возложит руку на голову животного
  rationale: Оборот обозначает ритуальное возложение или прижатие одной руки к голове жертвенного животного. «Возложит руку» естественно для русского библейского регистра; явное «животного» устраняет неясность местоимения без добавления нового смысла.
- source_word: וְשָׁחַט אֹתוֹ
  choice: заколет его
  rationale: Глагол שׁחט обозначает заклание, особенно в жертвенном контексте. «Заколет» передаёт ритуальный характер точнее, чем общее «убьёт», и остаётся понятным современному читателю.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: перед шатром встречи
  rationale: «Перед» сохраняет пространственный смысл לִפְנֵי, а «шатёр встречи» прямо передаёт אֹהֶל מוֹעֵד и звучит естественнее современного «скиния собрания».
- source_word: וְזָרְקוּ
  choice: пусть … окропят
  rationale: В жертвенном обряде זרק означает нанесение крови броском или плеском. Русское «окропят» является естественным культовым соответствием, хотя способ действия оно передаёт менее буквально; поэтому буквальная возможность отмечена в сноске.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновья Аарона
  rationale: Сохранено прямое родовое обозначение священнослужителей без замены толкованием «священники».
- source_word: אֶת דָּמוֹ
  choice: его кровью
  rationale: При глаголе «окропить» русский требует творительного падежа. Местоимение относится к жертвенному животному.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: со всех сторон окропят жертвенник
  rationale: «Со всех сторон» передаёт распределительное значение סָבִיב. Объект «жертвенник» при русском глаголе выражен прямо и естественно.
