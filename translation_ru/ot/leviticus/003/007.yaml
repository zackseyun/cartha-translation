source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: ru
  text: Если он приносит овцу как своё приношение[a], пусть представит её перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ягнёнка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Вводит условный случай в ряду предписаний о жертвах; «если» прямо передаёт условную конструкцию.
- source_word: כֶּשֶׂב
  choice: овцу
  rationale: Слово обозначает животное из овец и может подразумевать молодую овцу; широкое «овцу» не уточняет возраст без достаточных оснований, а вариант «ягнёнка» сохранён в сноске.
- source_word: מַקְרִיב אֶת קָרְבָּנוֹ
  choice: в качестве своего приношения он приносит
  rationale: Формулировка естественно передаёт внесение животного как приношения и сохраняет общее значение קָרְבָּן, не сужая его до более специального термина.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: пусть представит её
  rationale: В контексте закона форма выражает предписание; «представит» передаёт культовое приведение животного к месту жертвоприношения и сохраняет повтор корня קרב посредством близкого по смыслу глагола.
- source_word: לִפְנֵי
  choice: перед
  rationale: Кратко и точно передаёт пространственно-культовое значение «перед лицом, в присутствии».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Степень обязательности второй глагольной формы
  choice: пусть представит
  alternative: и представит; и должен представить
  rationale: В законодательном контексте וְהִקְרִיב имеет предписывающую силу. «Пусть представит» ясно выражает её, не усиливая формулировку сверх текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным культовым регистром. Конструкция перестроена ради естественного русского порядка слов, при этом сохранены условность, последовательность действий и лексическая неопределённость возраста животного.
