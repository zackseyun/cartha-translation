base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: ru
  text: 'Это — постоянное установление[a] для всех ваших поколений, где бы вы ни жили: не ешьте ни жира[b], ни крови.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечное установление», «установление навсегда». В правовых формулах еврейское слово עוֹלָם обычно указывает на длительную, сохраняющую силу обязательность.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское חֵלֶב в жертвенном контексте обозначает главным образом тук — определённые жировые части, предназначенные для жертвенника.
    reason: contextual_lexical_clarification
lexical_decisions:
- source_word: חֻקַּת
  choice: установление
  rationale: Передаёт обязательное, предписанное правило в юридико-заветном контексте и звучит естественно в современном литературном русском.
- source_word: עוֹלָם
  choice: навеки
  rationale: Сохраняет выраженную еврейским словом идею непреходящей, постоянной силы установления, не устраняя присущую формуле смысловую широту.
- source_word: לְדֹרֹתֵיכֶם
  choice: для всех ваших поколений
  rationale: Передаёт действие предписания в последовательных поколениях; слово «всех» естественно раскрывает длительный охват формулы.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: где бы вы ни жили
  rationale: Естественно по-русски выражает применимость запрета во всех местах проживания, сохраняя всеобщий пространственный охват כֹּל.
- source_word: כָּל חֵלֶב
  choice: ни жира
  rationale: В конструкции общего запрета русское «ни жира» естественно передаёт всеохватное значение כָּל. В жертвенном контексте חֵלֶב обозначает прежде всего тук, то есть определённые жировые части, но «жир» понятнее современному читателю; уточнение дано в примечании.
- source_word: וְכָל דָּם
  choice: ни крови
  rationale: Параллельная отрицательная конструкция естественно и полно передаёт запрет на употребление всякой крови.
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Прямой запрет во втором лице множественного числа точно передаёт юридическую функцию формы и звучит современно, сохраняя достоинство речи.
theological_decisions:
- issue: Продолжительность установления, выраженная словом עוֹלָם
  choice: навеки
  alternative: навсегда; вечное установление; постоянное установление
  rationale: «Навеки» сохраняет сильную формулу длительности и её традиционное звучание, а примечание поясняет, что в правовых формулах слово может подчёркивать непрерывную обязательность из поколения в поколение, не решая сверх текста вопрос об абсолютной метафизической бесконечности.
- issue: Объём запрета חֵלֶב
  choice: жир с пояснением в примечании
  alternative: тук
  rationale: Контекст жертвенных предписаний указывает прежде всего на предназначенные для жертвенника жировые части. Основной текст остаётся понятным современному читателю, а примечание сохраняет лексическую и контекстуальную точность, не расширяя и не сужая запрет без пояснения.
translation_notes:
  register: 'Современный литературный русский с краткой, торжественной формой правового предписания. Формула «где бы вы ни жили» предпочтена более буквальному, но менее естественному «во всех местах вашего жительства». В основном тексте должен стоять маркер [b] после слова «жира»: «ни жира[b], ни крови».'
