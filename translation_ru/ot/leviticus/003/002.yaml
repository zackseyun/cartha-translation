base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: ru
  text: Пусть он возложит руку на голову своей жертвы и заколет её у входа в шатёр встречи[a]. А сыновья Аарона, священники, пусть выплеснут кровь на жертвенник со всех сторон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у дверного проёма шатра встречи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть бросят кровь на жертвенник кругом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: пусть возложит
  rationale: В жертвенном контексте סמך означает положить или прижать руку к животному. «Возложит руку» точно передаёт обрядовое действие и соответствует достоинству контекста, не уточняя чрезмерно степень нажима.
- source_word: יָדוֹ
  choice: руку
  rationale: Форма единственного числа с суффиксом 3-го лица мужского рода; передаётся как одна рука приносящего жертву.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: голову своей жертвы
  rationale: קָרְבָּן — общее обозначение принесённого Богу дара; в данном контексте это жертвенное животное, поэтому русское «жертва» естественно и сохраняет культовый смысл.
- source_word: וּשְׁחָטוֹ
  choice: и заколет её
  rationale: שׁחט обозначает ритуальный убой животного. «Заколет» — традиционное, но понятное современному читателю слово, точнее общего «убьёт».
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: פֶּתַח может обозначать вход или дверной проём. «У входа» естественно по-русски; «шатёр встречи» буквально и прозрачно передаёт אֹהֶל מוֹעֵד без переноса позднейшей храмовой терминологии.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: сыновья Аарона, священники
  rationale: Сохранено приложение, отождествляющее сыновей Аарона со священниками.
- source_word: וְזָרְקוּ
  choice: пусть выплеснут
  rationale: זרק здесь означает бросить или плеснуть кровь на жертвенник, а не совершить мелкое окропление. «Выплеснут» передаёт направленное нанесение жидкости естественнее буквального «бросят кровь».
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: на жертвенник со всех сторон
  rationale: עַל указывает на нанесение крови на жертвенник, а סָבִיב — по его окружности, со всех сторон. Формулировка ясна и не ограничивает действие только верхней поверхностью.
theological_decisions:
- issue: Способ нанесения крови на жертвенник
  choice: пусть выплеснут кровь на жертвенник со всех сторон
  alternative: пусть окропят кровью жертвенник со всех сторон
  rationale: Глагол זרק выражает бросание или плескание и не требует более специального значения «окроплять». Выбранный вариант сохраняет различие между возможными видами ритуального нанесения крови.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной обрядовой лексикой. Конструкция «пусть» естественно передаёт предписывающий имперфект; «шатёр встречи» сохраняет образ и значение еврейского наименования. Все примечания отмечены в основном тексте.
