source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: ru
  text: Если его приношение — мирная жертва[a] и если он приносит её из крупного скота, то, будь то самец или самка, пусть принесёт животное без изъяна перед Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жертва мирных приношений». Возможные переводы: «жертва благополучия» или «жертва общения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед Господом». В еврейском тексте стоит имя יהוה (Яхве).'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: мирная жертва
  rationale: זֶבַח прямо обозначает жертву, а שְׁלָמִים — её вид, связанный с миром, благополучием и целостностью. Традиционное русское «мирная жертва» естественно и не сужает смысл до одного лишь общения; буквальное строение выражения отмечено в сноске.
- source_word: קָרְבָּנוֹ
  choice: его приношение
  rationale: קָרְבָּן — общее обозначение того, что подносят Богу. «Приношение» точно передаёт культовый контекст и отличается от более узкого слова «жертва».
- source_word: מִן הַבָּקָר
  choice: из крупного скота
  rationale: בָּקָר обозначает скот бычьего рода. «Крупный скот» — ясное и привычное русское обозначение в данном законодательном контексте.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: приносит / пусть принесёт
  rationale: Каузативные формы קרב в жертвенном контексте означают представление или принесение жертвы. Выбор сохраняет повтор корня и естественно звучит по-русски.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: будь то самец или самка
  rationale: Парная конструкция אִם ... אִם допускает оба пола животного. Русская конструкция естественно передаёт эту альтернативу.
- source_word: תָּמִים
  choice: без изъяна
  rationale: В жертвенном законодательстве תָּמִים означает животное без физического дефекта. «Без изъяна» точно и понятно современному читателю.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי означает «перед, в присутствии», а יהוה передано как личное имя «Яхве». Форма «пред» сохраняет dignified библейский регистр без архаизации всего предложения.
theological_decisions:
- issue: Передача названия жертвы שְׁלָמִים
  choice: мирная жертва
  alternative: жертва благополучия; жертва общения
  rationale: Еврейское слово допускает ассоциации с миром, благополучием и целостностью. «Мирная жертва» сохраняет широкое традиционное наименование; более узкие толкования не вносятся в основной текст.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, то есть личное имя Бога. «Яхве» передаёт его как имя, не заменяя титулом и не привнося конфессионально обусловленную форму.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Синтаксис законодательного предписания сохранён, но упорядочен ради ясности. «Пред Яхве» выбрано как краткая и dignified формула; терминология различает общее «приношение» и конкретную «жертву».
