base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: ru
  text: Пусть он возложит руку на голову своей жертвы и заколет её перед шатром собрания, а сыновья Аарона пусть брызнут её кровью на жертвенник со всех сторон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросят» или «выплеснут». Еврейский глагол обозначает энергичное ритуальное нанесение крови броском, а не лёгкое окропление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: возложит
  rationale: В жертвенном контексте глагол обозначает установленное обрядовое возложение руки на голову животного; «возложит» естественно для достойного современного регистра и не навязывает толкования действия.
- source_word: יָדוֹ
  choice: руку
  rationale: Сохранено единственное число еврейского текста.
- source_word: רֹאשׁ
  choice: голову
  rationale: Обычное анатомическое значение, соответствующее контексту жертвоприношения.
- source_word: קָרְבָּנוֹ
  choice: своей жертвы
  rationale: קָרְבָּן обозначает приношение, принесённое Богу; в данном контексте речь идёт о животном, которое закалывают, поэтому «жертва» звучит естественно и точно.
- source_word: וְשָׁחַט
  choice: заколет
  rationale: Технический глагол ритуального заклания жертвенного животного; «заколет» сохраняет культовый смысл точнее, чем общее «убьёт».
- source_word: לִפְנֵי
  choice: перед
  rationale: Кратко и точно передаёт пространственно-культовое значение «перед, в присутствии».
- source_word: אֹהֶל מוֹעֵד
  choice: шатром встречи
  rationale: Передаёт буквальный смысл устойчивого названия святилища современным и понятным русским выражением.
- source_word: וְזָרְקוּ
  choice: выплеснут
  rationale: Глагол обозначает энергичное ритуальное нанесение крови броском; «выплеснут» избегает неверного представления о лёгком окроплении.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновья Аарона
  rationale: Сохраняет конкретное родственное и гендерное обозначение исходного текста.
- source_word: דָּמוֹ
  choice: её кровь
  rationale: Местоимение относится к жертвенному животному; женский род согласован с русским словом «жертва».
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвенник
  rationale: С глаголом «выплеснут» естественно обозначает направленное нанесение крови на поверхность или стороны жертвенника.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Ясно передаёт распределительный смысл нанесения крови вокруг жертвенника.
theological_decisions:
- issue: Обрядовое возложение руки на жертву
  choice: Действие передано буквально как «возложит руку», без объяснения его символического смысла.
  alternative: «Обопрётся рукой» либо толкование как перенесение вины или отождествление с жертвой.
  rationale: Сам стих описывает действие, но не разъясняет его богословское значение; перевод не должен разрешать эту напряжённость за текст.
- issue: Обозначение בְּנֵי אַהֲרֹן
  choice: сыновья Аарона
  alternative: потомки Аарона; священники Аарона
  rationale: Еврейский текст прямо говорит о сыновьях; более широкие обозначения были бы интерпретирующей конкретизацией или обобщением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным богослужебным регистром. Синтаксис сохранён близким к еврейской последовательности действий, но оформлен естественно для русского читателя.
