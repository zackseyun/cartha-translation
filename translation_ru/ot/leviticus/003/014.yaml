    text: 'Или: «жертву, приносимую посредством огня». Еврейское אִשֶּׁה — технический термин для приношения, предаваемого огню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: он принесёт
  rationale: Порода hифиль глагола קרב в жертвенном контексте означает ритуально представить или принести жертву. «Принесёт» естественно по-русски и сохраняет культовый смысл.
- source_word: מִמֶּנּוּ
  choice: из неё
  rationale: Местоименный суффикс отсылает к жертвенному животному; женский род согласован с подразумеваемой жертвой или тушей в русском контексте.
- source_word: קָרְבָּנוֹ
  choice: свой дар
  rationale: קָרְבָּן — приносимый Богу жертвенный дар. «Дар» позволяет избежать тяжеловесного повтора «жертву — жертву», тогда как последующее אִשֶּׁה уточняет способ и назначение приношения.
- source_word: אִשֶּׁה
  choice: огненную жертву
  rationale: Традиционное и прозрачное для русского читателя обозначение жертвы, предаваемой огню. Поскольку точная этимология и оттенок термина спорны, альтернативное понимание отмечено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל передаётся конструкцией адресата после «жертву»; личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: жир, покрывающий внутренности
  rationale: Передаёт конкретную жировую ткань вокруг внутренних органов и сохраняет причастную конструкцию оригинала.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: и весь жир на внутренностях
  rationale: Сохраняет повтор слова «жир» и пространственное значение עַל, не сглаживая детальность жертвенного предписания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное заветное имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Значение культового термина אִשֶּׁה
  choice: огненная жертва
  alternative: пища, приносимая Яхве
  rationale: Форма связана в жреческих текстах с сожжением жертвы, но может также участвовать в образе жертвенной пищи. Основной текст следует традиционному ритуальному пониманию, а сноска сохраняет смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритуальным регистром. Синтаксический параллелизм и повтор слова «жир» сохранены; архаизмы и конфессионально маркированные обороты не использованы.
