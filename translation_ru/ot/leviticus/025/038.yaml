base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: ru
  text: Я — Яхве, ваш Бог[a], который вывел вас из земли Египта, чтобы дать вам землю Ханаана и чтобы быть вашим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (Яхве); традиционно передаётся «ГОСПОДЬ».
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое самоименование Бога в еврейском тексте; традиционная замена титулом отмечена в сноске.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Хотя форма אֱלֹהִים морфологически множественная, здесь она относится к единому Богу Израиля и входит в формулу завета.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: вывел вас
  rationale: Порода hифиль глагола יצא в контексте исхода естественно передаётся русским «вывел».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняется явно выраженное אֶרֶץ «земля»; сочетание звучит естественно и достойно в современном литературном русском.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: чтобы дать вам землю Ханаанскую
  rationale: Инфинитив с לְ передаёт цель исхода; перевод сохраняет лексику дарования земли и синтаксическую связь.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: и быть вашим Богом
  rationale: Стандартная формула завета передана идиоматично, без внесения идеи изменения в Божьем существе.
- source_word: אֲנִי
  choice: Я —
  rationale: Самостоятельное местоимение имеет эмфатическую функцию; тире естественно оформляет русское именное предложение и подчёркивает самоидентификацию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Исходный текст содержит собственное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие. Традиционная передача указана в сноске.
- issue: Формула לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: быть вашим Богом
  alternative: быть для вас Богом; стать вашим Богом
  rationale: Выбранный вариант естественно выражает отношения завета и не создаёт лишнего оттенка, будто Бог претерпевает изменение.
- issue: Связь заключительных инфинитивов
  choice: чтобы дать вам… и быть вашим Богом
  alternative: чтобы дать вам… чтобы быть вашим Богом
  rationale: Оба инфинитива зависят от самоописания Божьего действия; координация через «и» сохраняет компактность и допускаемую исходным синтаксисом связь, не усиливая причинно-следственное толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Формы «земля Египетская» и «земля Ханаанская» сохраняют достоинство стиля без архаической грамматики; личное имя «Яхве» вынесено в основной текст.
