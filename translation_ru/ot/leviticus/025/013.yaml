  to: В этот юбилейный год каждый из вас должен вернуться в свой земельный надел.[a]
  rationale: Уточнено обозначение אֲחֻזָּה, чтобы устранить русскую двусмысленность и сохранить конкретный земельный смысл термина в непосредственном контексте Левита 25. Синтаксис предписания, распределительный характер אִישׁ и модальность еврейского имперфекта сохранены. Сноска оставляет допустимую более общую альтернативу.
