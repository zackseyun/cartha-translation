  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: ru
  text: В этот юбилейный год каждый из вас должен вернуться в свой земельный надел.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в свою собственность»; еврейский термин обычно обозначает земельное владение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: В этот юбилейный год
  rationale: Предлог בְּ передаёт время действия, а יוֹבֵל в контексте Левита 25 обозначает особый юбилейный год. Такая формулировка естественна для современного русского языка и сохраняет указательное הַזֹּאת — «этот».
- source_word: תָּשֻׁבוּ
  choice: должен вернуться
  rationale: Форма второго лица множественного числа в законодательном предписании выражает обязательность. В сочетании с распределительным אִישׁ она естественно передаётся конструкцией «каждый из вас должен вернуться».
- source_word: אִישׁ
  choice: каждый из вас
  rationale: 'Существительное употреблено распределительно: предписание обращено ко всему сообществу, но относится к каждому человеку отдельно. Русская конструкция сохраняет и обращение во втором лице, и индивидуальный характер требования.'
- source_word: אֶל אֲחֻזָּתוֹ
  choice: в своё владение
  rationale: אֲחֻזָּה здесь означает принадлежащий человеку или семье земельный надел, владение либо собственность. Возвратное «своё» естественно передаёт еврейский суффикс третьего лица при подлежащем «каждый».
theological_decisions:
- issue: Распределительное мужское אִישׁ
  choice: каждый из вас
  alternative: каждый мужчина
  rationale: В данном правовом контексте אִישׁ выполняет распределительную функцию. «Каждый из вас» сохраняет обращение ко множеству и индивидуальное применение заповеди, не добавляя утверждения, будто возвращение касается исключительно взрослых мужчин.
- issue: Характер возвращаемого אֲחֻזָּה
  choice: владение
  alternative: наследственная земля
  rationale: Контекст главы связывает термин с родовым земельным наделом, однако сам стих не содержит отдельного слова «наследственный». Более широкое «владение» сохраняет лексическую сдержанность исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясной юридически-предписывающей интонацией. Формулировка избегает архаизмов «да возвратится» и «во владение своё», сохраняя торжественную сдержанность текста.
