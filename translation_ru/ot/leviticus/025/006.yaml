base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: ru
  text: 'Урожай земли во время её субботнего покоя[a] будет вам в пищу: тебе, твоему рабу, твоей рабыне, твоему наёмному работнику и пришельцу, живущему у тебя[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «суббота земли». Имеется в виду то, что земля произведёт во время своего субботнего покоя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поселенцу». Еврейское выражение обозначает некоренного жителя, поселившегося среди израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: будет
  rationale: В законодательном контексте форма выражает установленное для будущего положение; русское «будет» естественно передаёт и будущее значение, и нормативный характер.
- source_word: שַׁבַּת הָאָרֶץ
  choice: урожай земли во время её субботнего покоя
  rationale: Буквально выражение означает «суббота земли», но сочетание с «в пищу» указывает на то, что речь идёт о плодах, которые земля даст во время субботнего года. Перевод делает референт понятным, а сноска сохраняет буквальный образ.
- source_word: לָכֶם לְאָכְלָה
  choice: будет вам в пищу
  rationale: Передаёт назначение урожая для еды и сохраняет обращение к сообществу во множественном числе.
- source_word: לְךָ
  choice: тебе
  rationale: Сохраняет переход от общего множественного «вам» к единственному числу в перечне лиц.
- source_word: עַבְדְּךָ
  choice: твоему рабу
  rationale: «Раб» сохраняет обозначенный древним правовым контекстом несвободный статус и не смешивает эту категорию с наёмным работником.
- source_word: אֲמָתֶךָ
  choice: твоей рабыне
  rationale: Передаёт женскую форму термина и сохраняет различение мужчины-раба и женщины-рабыни.
- source_word: שְׂכִירְךָ
  choice: твоему наёмному работнику
  rationale: Ясно обозначает человека, работающего за плату, в отличие от раба или рабыни.
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: живущему у тебя пришельцу
  rationale: Сочетание обозначает не коренного жителя, поселившегося среди израильтян. «Пришелец» сохраняет статус чужеземца, а «живущий у тебя» передаёт постоянное или продолжительное проживание рядом с адресатом.
theological_decisions:
- issue: Передача терминов, обозначающих зависимых и наёмных работников
  choice: Различить «раба», «рабыню» и «наёмного работника».
  alternative: Передать все категории общим словом «слуга».
  rationale: Еврейский текст намеренно различает несвободных членов хозяйства и человека, работающего за плату; единое слово стёрло бы важное правовое и социальное различие.
- issue: Связь «субботы земли» с её плодами
  choice: В основном тексте указать на урожай во время субботнего покоя, сохранив буквальную формулировку в сноске.
  alternative: 'Перевести буквально: «суббота земли будет вам в пищу».'
  rationale: Буквальный оборот по-русски может ошибочно представить сам покой как пищу. Контекст говорит о том, что произрастёт в этот год, однако сноска сохраняет образ и возможную смысловую широту исходного выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис сохраняет переход от общего «вам» к личному «тебе» и последующий перечень. Архаизмы сведены к минимуму; слово «пришелец» оставлено как точный и узнаваемый библейско-правовой термин.
