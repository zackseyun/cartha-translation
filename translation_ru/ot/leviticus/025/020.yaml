source:
  edition: WLC
  text: וְ/כִ֣י תֹאמְר֔וּ מַה נֹּאכַ֤֖ל בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֑ת הֵ֚ן לֹ֣א נִזְרָ֔ע וְ/לֹ֥א נֶאֱסֹ֖ף אֶת תְּבוּאָתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: ru
  text: 'И если вы скажете: «Что же нам есть в седьмой год, ведь мы не будем ни сеять, ни собирать наш урожай?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה נֹּאכַל
  choice: Что же нам есть
  rationale: Естественная русская передача вопроса о пропитании; частица «же» уместно передаёт обеспокоенность, выраженную контекстом.
- source_word: הֵן
  choice: ведь
  rationale: Здесь частица вводит основание для вопроса; русское «ведь» естественнее буквального «вот» и сохраняет логическую связь.
- source_word: נִזְרָע
  choice: мы не будем сеять
  rationale: Форма передаёт действие в первом лице множественного числа в предполагаемой ситуации седьмого года.
- source_word: נֶאֱסֹף אֶת־תְּבוּאָתֵנוּ
  choice: собирать наш урожай
  rationale: «Урожай» в данном земледельческом контексте ясно и естественно передаёт תְּבוּאָה; глагол «собирать» сохраняет смысл жатвы и заготовки плодов.
theological_decisions:
- issue: Связь между вопросом и запретом земледельческих работ в субботний год
  choice: ведь мы не будем ни сеять, ни собирать
  alternative: вот, мы не посеем и не соберём
  rationale: Выбрана причинно-пояснительная связь, соответствующая функции הֵן в контексте, без добавления богословского толкования.
translation_notes:
  register: Современный литературный русский язык; речь звучит естественно и сохраняет обеспокоенный характер прямого вопроса. Парная конструкция «ни… ни…» идиоматично объединяет два отрицательных действия.
