  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: ru
  text: Или его может выкупить дядя, или сын его дяди[a]; или его может выкупить кто-либо из его близких кровных родственников, принадлежащих к его роду; или, если у него появятся достаточные средства[b], он может выкупить себя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть его двоюродный брат. Буквально: «сын его дяди».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если его рука достигнет»; то есть если он приобретёт достаточно средств.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «он будет выкуплен». В данном контексте речь, вероятно, о том, что, обретя средства, он сам обеспечивает свой выкуп.'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: דֹדוֹ
  choice: его дядя
  rationale: В законодательстве о родственном выкупе דּוֹד обозначает дядю; значение «возлюбленный» здесь контекстуально не подходит.
- source_word: בֶן דֹּדוֹ
  choice: сын его дяди
  rationale: Сохранено буквальное обозначение родства; современное русское «двоюродный брат» дано в сноске.
- source_word: יִגְאָלֶנּוּ
  choice: может выкупить его
  rationale: Глагол גאל обозначает родственный выкуп. «Выкупить» естественно передаёт юридический смысл, а «может» соответствует разрешительной силе нормы, не превращая её в безусловное повеление.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: кто-либо из его близких кровных родственников
  rationale: Еврейское выражение буквально связано с «плотью» и обозначает ближайшее кровное родство; перевод передаёт смысл идиомы без неестественной буквальности.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: принадлежащих к его роду
  rationale: מִשְׁפָּחָה здесь означает более широкую родственную общность, а не только ближайшую семью; «род» уместен в данном древнеизраильском правовом контексте.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: если у него появятся достаточные средства
  rationale: Буквально рука человека «достигает»; идиома означает, что он обретает материальную возможность заплатить выкуп. Смысл передан ясным современным русским языком, а образ оригинала отмечен в сноске.
- source_word: וְנִגְאָל
  choice: он может выкупить себя
  rationale: Форма буквально допускает перевод «будет выкуплен», но в контексте обретённых им средств речь идёт о выкупе, который он обеспечивает сам; русская возвратная конструкция ясно передаёт этот смысл.
theological_decisions:
- issue: Передача терминологии родственного выкупа
  choice: Последовательно передавать גאל словом «выкупить».
  alternative: «искупить»; «освободить»; «вернуть»
  rationale: «Выкупить» сохраняет юридический и имущественный характер действия в Левите 25 и не вносит в данный стих дополнительных конфессиональных оттенков слова «искупить».
- issue: Передача идиомы הִשִּׂיגָה יָדוֹ
  choice: В основном тексте раскрыть значение как «если у него появятся достаточные средства», сохранив буквальный образ в сноске.
  alternative: «если его рука достигнет достатка»; «если он преуспеет»
  rationale: Дословная калька в современном русском неясна, а «преуспеет» слишком широко. Выбранный вариант точно выражает финансовую возможность, необходимую для собственного выкупа.
- issue: Залог и субъект в וְנִגְאָל
  choice: 'Передать контекстуальный возвратный смысл: «он может выкупить себя».'
  alternative: «он будет выкуплен»
  rationale: Еврейская форма грамматически пассивна, однако условие о средствах самого человека указывает на самовыкуп. Альтернативная формальная передача отмечена в сноске, чтобы не скрывать языковую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством правового библейского текста. Синтаксический параллелизм оригинала сохранён повторением «может выкупить», но идиома о руке раскрыта ради ясности. Термин «род» передаёт более широкую родственную группу, чем ближайшая семья.
