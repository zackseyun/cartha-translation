  source_fidelity: 'Основной смысл передан верно: предписание охватывает шесть лет посева поля, обрезки виноградника и сбора произведений. Однако «его урожай» в русском языке однозначно отсылает к ближайшему слову «виноградник», тогда как женский суффикс в תְּבוּאָתָהּ не согласуется ни с «полем» (שָׂדֶה, м. р.), ни с «виноградником» (כֶּרֶם, м. р.) и, вероятнее всего, подразумевает землю (אֶרֶץ, ж. р.) в более широком контексте. Лучше не создавать в русском ложную однозначную отсылку.'
