  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: ru
  text: Шесть лет засевай своё поле, шесть лет обрезай свой виноградник и собирай урожай.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: шесть лет
  rationale: Винительный длительности обозначает период совершения действия; в русском языке естественно передаётся без предлога.
- source_word: תִּזְרַע
  choice: засевай
  rationale: Имперфект в законодательном контексте выражает предписание; форма повелительного наклонения передаёт его ясно и естественно по-русски.
- source_word: שָׂדֶךָ
  choice: своё поле
  rationale: שָׂדֶה здесь означает конкретный возделываемый участок, а не землю вообще; возвратное «своё» естественно при обращении на «ты».
- source_word: תִּזְמֹר
  choice: обрезай
  rationale: В контексте виноградника זמר означает агротехническую обрезку лоз.
- source_word: כַּרְמֶךָ
  choice: свой виноградник
  rationale: Точное и общеупотребительное соответствие для כרם.
- source_word: וְאָסַפְתָּ
  choice: и собирай
  rationale: אָסַף означает собирать; однородная повелительная форма сохраняет параллелизм законодательного предписания.
- source_word: תְּבוּאָתָהּ
  choice: его урожай
  rationale: תְּבוּאָה обозначает сельскохозяйственную продукцию, урожай. Суффикс женского рода грамматически относится к полю (שָׂדֶה в библейском иврите женского рода), поэтому русское местоимение согласовано с переводом «поле» как «его».
