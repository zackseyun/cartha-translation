lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Обычная условная частица, вводящая предусмотренный законом случай.
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: до конца срока остаётся ещё много лет
  rationale: Глагол «остаётся» подразумевается конструкцией; «до конца срока» естественно передаёт контекст оставшихся лет службы.
- source_word: לְפִיהֶן
  choice: соразмерно их числу
  rationale: Буквально «согласно им»; идиома указывает на пропорциональный расчёт по числу оставшихся лет.
- source_word: יָשִׁיב
  choice: должен возвратить
  rationale: Каузативная форма שוב в финансово-правовом контексте означает вернуть или выплатить обратно.
- source_word: גְּאֻלָּתוֹ
  choice: выкупную плату
  rationale: Здесь существительное обозначает конкретную сумму, необходимую для выкупа, а не только действие освобождения.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: из денег, заплаченных за него
  rationale: Передаёт буквальное «из денег его приобретения» ясным современным русским языком и указывает на исходную покупную сумму как основу расчёта.
