revisions:
- from: Тогда он уйдёт от тебя — он сам и его сыновья вместе с ним, — возвратится к своему роду[a] и вернётся во владение своих отцов[b].
  to: Тогда он и его сыновья вместе с ним уйдут от тебя, возвратятся к своему роду[a] и вернутся к наследственному владению его отцов[b].
  rationale: Перестроено первое предложение так, чтобы «он и его сыновья» были ясным составным подлежащим и совместный уход был выражен прямо. Второе возвращение сформулировано как возвращение к наследственному имуществу, а не как возможное вступление во владение. Сохранены повтор возврата, мужские формы родства и все сносочные якоря.
