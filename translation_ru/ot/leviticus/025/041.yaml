base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: ru
  text: Тогда он и его сыновья вместе с ним уйдут от тебя, возвратятся к своему роду[a] и вернутся к наследственному владению его отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к своей семье»; еврейское слово может обозначать широкий круг родственников, род или клан.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к владению его отцов» или «к его родовому владению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵעִמָּךְ
  choice: уйдёт от тебя
  rationale: Передаёт конкретный еврейский оборот о выходе из хозяйства и службы господина, не заменяя его более толковательным «будет освобождён».
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: он сам и его сыновья вместе с ним
  rationale: Сохраняет подчёркнутое местоимение и явно мужскую форму בָּנִים.
- source_word: וְשָׁב ... יָשׁוּב
  choice: возвратится ... вернётся
  rationale: Два однокоренных русских глагола сохраняют повтор שׁוב и при этом звучат естественно.
- source_word: מִשְׁפַּחְתּוֹ
  choice: своему роду
  rationale: В данном социально-правовом контексте слово обозначает более широкую родственную группу, а не только ближайшую семью.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: во владение своих отцов
  rationale: אֲחֻזָּה обозначает закреплённое, обычно наследственное земельное владение; формулировка сохраняет буквальный образ отцовского наследия.
theological_decisions:
- issue: Мужская терминология родства
  choice: его сыновья ... своих отцов
  alternative: его дети ... своих предков
  rationale: Еврейский текст употребляет явно мужские формы в контексте наследственного землевладения; перевод не нейтрализует их.
- issue: Социально-правовой смысл выхода
  choice: уйдёт от тебя
  alternative: будет освобождён от службы у тебя
  rationale: Юбилейное освобождение подразумевается контекстом, но сам стих использует конкретный глагол «выйти»; перевод сохраняет выражение источника без добавочного истолкования.
- issue: Характер наследственного владения
  choice: во владение своих отцов
  alternative: к наследственному владению своих предков
  rationale: Основной текст сохраняет патрилинейную формулировку и юридическую образность оригинала, не сужая אֲחֻזָּה исключительно до участка земли.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского текста. Тире выделяют присоединённое уточнение «он сам и его сыновья вместе с ним». Все сноски размещены непосредственно после соответствующих выражений.
