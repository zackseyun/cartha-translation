lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: останется мало лет
  rationale: Естественно передаёт количественный смысл מְעַט и значение остатка времени у נִשְׁאַר в данном контексте.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: юбилейный год
  rationale: Устоявшееся русское обозначение установленного в Левите 25 особого года; строчная буква соответствует нормам современного русского письма.
- source_word: וְחִשַּׁב לוֹ
  choice: пусть он сделает с ним расчёт
  rationale: Передаёт юридико-экономический смысл глагола חשב и сохраняет участие обеих сторон в расчёте.
- source_word: כְּפִי שָׁנָיו
  choice: соразмерно числу этих лет
  rationale: Ясно выражает пропорциональность, обозначенную כְּפִי; указательное «этих» связывает выражение с оставшимися до юбилейного года годами.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: возвратит сумму своего выкупа
  rationale: В данном правовом контексте גְּאֻלָּה обозначает не отвлечённое избавление, а денежную сумму выкупа; «возвратит» передаёт каузативное значение שוב.
