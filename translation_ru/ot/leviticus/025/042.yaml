  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: ru
  text: Ибо они — Мои рабы[a], которых Я вывел из земли Египта; их нельзя продавать так, как продают рабов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «слуги». Здесь выбрано «рабы», поскольку речь идёт о принадлежности Богу и о запрете продавать израильтян как обычную рабскую собственность.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «они не будут проданы продажей раба», то есть их не следует продавать посредством обычной сделки купли-продажи раба.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего предписания; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: עֲבָדַי הֵם
  choice: они — Мои рабы
  rationale: Форма עֲבָדַי означает «Мои рабы / слуги», а отдельное הֵם подчёркивает принадлежность. В данном правовом контексте, где речь идёт о владении и запрете продажи, «рабы» точнее сохраняет социально-юридическую силу слова.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: которых Я вывел
  rationale: Передаёт относительное предложение и обычную для исхода формулу Божьего избавления.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Точное и устойчивое в русском библейском регистре обозначение места исхода, остающееся понятным современному читателю.
- source_word: לֹא יִמָּכְרוּ
  choice: их нельзя продавать
  rationale: Пассивная форма в юридическом контексте выражает запрет. Безличная русская конструкция естественно передаёт нормативный смысл.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: так, как продают рабов
  rationale: Передаёт способ или вид продажи, характерный для обычной сделки с рабом, не создавая впечатления, будто запрещена вообще всякая предусмотренная контекстом долговая зависимость.
theological_decisions:
- issue: Передача עֶבֶד применительно к принадлежности израильтян Богу
  choice: рабы
  alternative: слуги
  rationale: Оба значения лексически возможны, однако аргумент стиха основан на том, что Израиль принадлежит Богу и потому не может становиться обычным товаром в руках людей. «Рабы» сохраняет эту напряжённость и связывает первую половину стиха с запретом продажи во второй.
- issue: Характер запрета в заключительной части стиха
  choice: запрещена продажа по образцу обычной продажи рабов
  alternative: абсолютный запрет любой продажи
  rationale: Выражение מִמְכֶּרֶת עָבֶד уточняет именно характер сделки. Перевод сохраняет это ограничение и не расширяет запрет сверх формулировки еврейского текста.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким юридико-библейским регистром. Тире перед именной частью подчёркивает выраженное в еврейском тексте местоимение הֵם; прописные «Мои» и «Я» следуют принятой русской практике при прямой речи Бога.
