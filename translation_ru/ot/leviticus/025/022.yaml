base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: ru
  text: В восьмой год вы будете сеять и питаться старым урожаем до девятого года; пока не появится урожай девятого года, вы будете питаться старым урожаем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: вы будете сеять
  rationale: Форма глагола в данном предписывающем контексте имеет будущее значение и описывает действия народа после субботнего года.
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: питаться старым урожаем
  rationale: תְּבוּאָה обозначает урожай или сельскохозяйственные плоды, а יָשָׁן — прежний, хранящийся урожай. Выражение передано естественно по-русски без сужения смысла до одного лишь зерна.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: до девятого года
  rationale: Прямо передаёт временной предел, выраженный в еврейском тексте.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: пока не поступит его урожай
  rationale: בּוֹא буквально означает «прийти». Глагол «поступит» естественно описывает появление нового урожая в распоряжении людей, а местоимение «его» сохраняет связь с упомянутым девятым годом.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: вы будете питаться старым урожаем
  rationale: Повтор выражения сохраняет акцент еврейского текста на продолжительном употреблении запасов прежнего урожая до появления нового.
