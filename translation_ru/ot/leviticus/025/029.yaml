  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: ru
  text: Если кто продаст жилой дом в городе, окружённом стеной, право на его выкуп сохраняется до истечения полного года со дня его продажи; право на выкуп действует в течение полного года[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дни»; в этом правовом обороте имеется в виду полный год.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Если кто
  rationale: В формуле казуистического закона сочетание вводит условный случай. Русское «если кто» естественно и не делает мужской род участника смысловым ограничением.
- source_word: בֵּית מוֹשַׁב
  choice: жилой дом
  rationale: Сочетание обозначает дом, предназначенный для проживания; «жилой дом» точно и естественно передаёт конструкцию.
- source_word: עִיר חוֹמָה
  choice: город, окружённый стеной
  rationale: Буквально речь идёт о городе со стеной. Такая передача яснее современному читателю, чем неоднозначное «укреплённый город».
- source_word: גְּאֻלָּתוֹ
  choice: право выкупить его / его можно выкупить
  rationale: В данном имущественно-правовом контексте גְּאֻלָּה означает возможность обратного выкупа проданного дома, а не религиозное «искупление».
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: до истечения полного года со дня продажи
  rationale: Фраза обозначает годичный срок, отсчитываемый от продажи, а не конец календарного года.
- source_word: יָמִים
  choice: в течение года
  rationale: В этом правовом употреблении слово «дни» обозначает годичный срок; смысл передан в тексте, а буквальная форма отмечена в сноске.
