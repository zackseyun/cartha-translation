  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: ru
  text: Если твой брат обеднеет и лишится средств к существованию, живя рядом с тобой[a], поддержи его, чтобы он жил рядом с тобой как пришелец или временный житель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и его рука ослабеет (или пошатнётся) с тобой» — образ утраты средств и способности содержать себя.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза «пришелец и временный житель» синтаксически сжата. Возможно и другое прочтение: «поддержи его — пришельца и временного жителя, — чтобы он жил рядом с тобой».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי יָמוּךְ
  choice: Если … обеднеет
  rationale: Оборот вводит условный случай закона; יָמוּךְ обозначает обеднение, ухудшение материального положения.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохранён буквальный язык родства, который в данном контексте обозначает члена общины завета.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: окажется не в силах себя содержать рядом с тобой
  rationale: Еврейская метафора ослабевшей или пошатнувшейся руки означает утрату средств и способности обеспечивать себя. Смысл передан естественно по-русски, а עִמָּךְ — как указание на жизнь рядом, внутри сообщества.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: поддержи его
  rationale: Каузативная форма חזק здесь требует оказать нуждающемуся помощь и не дать ему окончательно разориться.
- source_word: גֵּר
  choice: пришелец
  rationale: Слово обозначает не коренного уроженца, постоянно живущего среди израильского общества и пользующегося определённой правовой защитой.
- source_word: וְתוֹשָׁב
  choice: временный поселенец
  rationale: Передаёт более ограниченный или временный статус проживания и отличает תוֹשָׁב от גֵּר.
- source_word: וָחַי עִמָּךְ
  choice: чтобы он мог жить рядом с тобой
  rationale: Формулировка естественно выражает предполагаемый результат поддержки и сохраняет повтор עִמָּךְ.
theological_decisions:
- issue: Круг лиц, обозначенный словами «твой брат»
  choice: Сохранить буквальное «твой брат».
  alternative: «твой соплеменник» или «твой собрат-израильтянин»
  rationale: Родственная метафора принадлежит самому тексту и подчёркивает взаимную ответственность внутри общины, не требуя в основном тексте уточняющего толкования.
- issue: Синтаксическая функция גֵּר וְתוֹשָׁב
  choice: 'Связать выражение со статусом обедневшего брата: он продолжает жить рядом «как пришелец или временный поселенец».'
  alternative: Понять пришельца и временного поселенца как дополнительные объекты повеления о поддержке.
  rationale: Еврейская конструкция сжата и допускает оба понимания. Основной текст следует естественной связи с последующим «будет жить рядом с тобой», а иное прочтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Архаичная метафора «рука ослабеет» раскрыта в основном тексте ради ясности, но сохранена в примечании. Термин «пришелец» оставлен как понятное традиционное обозначение защищённого чужеземного жителя; «временный поселенец» различает вторую социальную категорию.
