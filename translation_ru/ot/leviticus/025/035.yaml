  source_fidelity: 'Основной смысл передан верно: условие об обедневшем «брате», обязанность поддержать его и цель/результат — чтобы он продолжал жить с адресатом. Однако «окажется не в силах себя содержать рядом с тобой» неудачно присоединяет «рядом с тобой» к способности содержать себя, тогда как עִמָּךְ обозначает положение нуждающегося внутри общины. Кроме того, завершающее «как пришелец или временный поселенец» следует расположить так, чтобы оно естественно характеризовало его дальнейшее проживание, при сохранении синтаксической неопределённости еврейского текста.'
  naturalness: «Окажется не в силах себя содержать рядом с тобой» тяжеловесно и семантически не вполне естественно для современного литературного русского. «Лишится средств к существованию, живя рядом с тобой» ясно передаёт идиому и корректно связывает обстоятельство с самим нуждающимся. «Временный житель» естественнее, чем «временный поселенец», в данном социально-правовом контексте.
