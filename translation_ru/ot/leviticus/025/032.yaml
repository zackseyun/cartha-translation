source:
  edition: WLC
  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: ru
  text: Что касается городов левитов, то за левитами навсегда сохраняется право выкупать дома в городах, находящихся в их владении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более формально: «вечное право выкупа будет у левитов».'
    reason: Сохраняет более формальную именную конструкцию еврейского текста и его юридическую формулировку.
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: Что касается городов левитов
  rationale: Союз וְ с последующей именной группой вводит новый частный случай в своде законов. Такая формулировка естественно обозначает смену темы и сохраняет связь с предшествующим контекстом.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: дома в городах, находящихся в их владении
  rationale: 'Буквально: «дома городов их владения». Предлог «в» естественно передаёт отношение местонахождения, а אֲחֻזָּה обозначает законно закреплённое, нередко наследственное земельное владение.'
- source_word: גְּאֻלַּת עוֹלָם
  choice: навсегда сохраняется право выкупать
  rationale: Сочетание существительного «выкуп» с עוֹלָם в данном юридическом контексте устанавливает неограниченное по времени право выкупа, а не описывает разовое действие.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: за левитами сохраняется
  rationale: Глагол «быть» с предлогом לְ указывает, кому принадлежит установленное право. Русская конструкция «за ними сохраняется право» ясно и естественно передаёт юридическую силу нормы.
theological_decisions:
- issue: Юридическая сила положения о выкупе домов левитов
  choice: Стих закрепляет за левитами постоянное право выкупать дома в принадлежащих им городах.
  alternative: 'Более формально: «вечное право выкупа будет у левитов».'
  rationale: Еврейская именная конструкция допускает буквальную формулировку об «вечном выкупе», однако в правовом контексте речь идёт о постоянно действующем праве. Перевод не уточняет сверх текста обстоятельства и порядок выкупа.
translation_notes:
  register: Современный литературный русский язык с ясной юридической формулировкой. Выражение «за левитами сохраняется право» звучит достойно и понятно, не прибегая ни к архаичной канцелярской речи, ни к конфессионально окрашенной терминологии.
