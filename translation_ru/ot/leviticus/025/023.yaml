  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: ru
  text: 'Землю нельзя продавать навсегда[a], потому что земля принадлежит Мне: вы у Меня — пришельцы и поселенцы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навечно», то есть с окончательным и безвозвратным отчуждением.'
    reason: lexical_alternative
  - marker: b
    text: «Пришельцы и поселенцы» — люди, живущие на земле без полного наследственного права на неё.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: нельзя продавать
  rationale: Нифаль имперфекта מכר в правовом контексте имеет пассивно-запретительную силу. Безличная конструкция естественна по-русски и сохраняет смысл запрета на продажу.
- source_word: לִצְמִתֻת
  choice: навсегда
  rationale: Слово обозначает окончательное, безвозвратное отчуждение. «Навсегда» понятно современному читателю и соответствует контексту земельного законодательства.
- source_word: כִּי לִי הָאָרֶץ
  choice: потому что земля принадлежит Мне
  rationale: כִּי вводит основание запрета, а לִי прямо утверждает принадлежность земли Богу. Глагольная русская конструкция звучит естественнее буквального «земля Моя».
- source_word: גֵרִים
  choice: переселенцы
  rationale: גֵּר обозначает человека, живущего не на своей наследственной земле и находящегося в зависимом положении. «Переселенцы» передаёт отсутствие исконного права владения без архаизма «пришельцы».
- source_word: וְתוֹשָׁבִים
  choice: временные жители
  rationale: תּוֹשָׁב — проживающий на данной земле человек без полного наследственного права на неё. В сочетании с גֵּר выражение подчёркивает временный и зависимый характер владения.
- source_word: עִמָּדִי
  choice: у Меня
  rationale: Буквальное значение — «со Мной», однако в русском «у Меня» естественно выражает положение жителей на принадлежащей Богу земле и их зависимость от Него, не добавляя идеи присутствия перед Богом.
theological_decisions:
- issue: Отношение Израиля к земле
  choice: Земля принадлежит Богу, а Израиль живёт на ней как зависимый от Него переселенец и временный житель.
  alternative: Понимать стих лишь как социально-экономическое правило либо расширять его до утверждения о полном лишении Израиля земли вне контекста юбилейного года.
  rationale: Фраза «земля принадлежит Мне» прямо даёт богословское основание правовой норме. Перевод сохраняет как Божье право собственности, так и производный характер права Израиля на землю, не выходя за пределы текста.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Заглавная буква в «Мне» обозначает говорящего Бога по принятой русской библейской традиции. Избегнуты архаизмы «пришельцы» и «поселенцы», при этом сохранены два различных еврейских обозначения зависимых жителей.
