  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: ru
  text: Покупай у своего соплеменника с учётом числа лет, прошедших после юбилейного года; он должен продавать тебе с учётом числа урожайных лет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по числу лет урожаев». Имеются в виду годы, в которые земля ещё будет приносить урожай до следующего юбилейного года; цена определялась этим числом, а не бессрочной передачей земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר שָׁנִים אַחַר הַיּוֹבֵל
  choice: учитывай число лет, прошедших после юбилейного года
  rationale: Конструкция בְּמִסְפַּר задаёт меру расчёта. «Юбилейный год» ясно передаёт יוֹבֵל в контексте Левита 25; добавление «прошедших» естественно выражает אַחַר.
- source_word: תִּקְנֶה מֵאֵת עֲמִיתֶךָ
  choice: покупая у своего соплеменника
  rationale: עָמִית в данном правовом контексте обозначает члена того же сообщества. Деепричастная конструкция позволяет по-русски ясно связать покупку с правилом расчёта.
- source_word: בְּמִסְפַּר שְׁנֵי תְבוּאֹת
  choice: число лет урожая, остающихся до следующего юбилейного года
  rationale: Буквально — «по числу лет урожаев». Речь идёт о годах получения урожая, оставшихся до следующего юбилея; это уточнение передаёт смысл в контексте временного права пользования землёй.
- source_word: יִמְכָּר לָךְ
  choice: продавая тебе, он должен учитывать
  rationale: Форма глагола в законодательной речи выражает предписание продавцу и сохраняет соответствие обязанности покупателя.
theological_decisions:
- issue: Характер продажи земли в юбилейном законодательстве
  choice: Уточнить, что считаются урожайные годы до следующего юбилейного года, в сноске
  alternative: Оставить только буквальное «по числу лет урожаев» без пояснения
  rationale: Контекст стиха 16 показывает, что цена определяется числом будущих урожаев, а не безвозвратным отчуждением земли. Сноска поясняет это, не превращая толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Юридическая симметрия покупки и продажи сохранена, однако ради естественности русского синтаксиса императивная сила выражена через «учитывай» и «должен учитывать».
