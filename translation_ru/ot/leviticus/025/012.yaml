  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: ru
  text: Ибо это юбилейный год; он будет для вас свят. Питайтесь тем, что приносит поле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «урожаем с поля», «плодами поля» или «произведениями земли». Еврейское слово обозначает то, что приносит земля или поле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит обоснование предыдущего предписания; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет достоинство законодательной речи.
- source_word: יוֹבֵל
  choice: юбилейный год
  rationale: В Левите 25 слово обозначает особый пятидесятый год, а не бараний рог. Добавление «год» устраняет современное русское понимание «юбилея» лишь как годовщины или торжества.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: он будет для вас свят
  rationale: «Свят» сохраняет религиозно-заветный смысл отделённости для Бога; местоимение согласовано с русским выражением «юбилейный год».
- source_word: מִן הַשָּׂדֶה
  choice: с поля
  rationale: Прямо передаёт исходную точку и указывает, что пищу берут из того, что приносит поле, в отличие от обычного упорядоченного сбора и хранения.
- source_word: תֹּאכְלוּ
  choice: вы будете есть
  rationale: Форма имеет будущее или предписывающее значение в законодательном контексте. Будущее время по-русски сохраняет форму установления без ненужного усиления запретительным или разрешительным оттенком.
- source_word: תְּבוּאָתָהּ
  choice: его урожай
  rationale: Слово обозначает то, что приносит земля или поле. «Урожай» кратко и естественно передаёт сельскохозяйственный смысл, а более широкие оттенки отмечены в сноске.
theological_decisions:
- issue: Святость юбилейного года
  choice: он будет для вас свят
  alternative: он будет для вас священным; он будет отделён для вас
  rationale: Перевод сохраняет утверждение о святости самого юбилейного года в отношении Израиля и не сводит её к гражданской особенности или одному лишь обрядовому статусу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным законодательным звучанием. «Юбилейный год» выбрано ради ясности для современного читателя; порядок слов остаётся близким к еврейскому тексту. Сноска поставлена непосредственно после слова, к которому относится.
