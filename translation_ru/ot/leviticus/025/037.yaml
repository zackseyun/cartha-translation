  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: ru
  text: Не давай ему свои деньги[a] под проценты и не давай ему свою пищу с надбавкой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «своё серебро». Еврейское слово כֶּסֶף означает и серебро, и деньги; здесь речь идёт о деньгах, предоставляемых взаймы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради прироста», «ради выгоды». Еврейское מַרְבִּית обозначает увеличение или выгоду, получаемую сверх предоставленного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ (כֶּסֶף)
  choice: свои деньги
  rationale: В юридико-экономическом контексте כֶּסֶף обозначает деньги, хотя буквально слово также означает серебро.
- source_word: תִתֵּן לוֹ
  choice: давай ему
  rationale: Сохранён основной смысл глагола נתן — «давать». В первой части выражение «давать деньги под проценты» естественно передаёт предоставление займа, не делая подразумеваемое значение отдельным глаголом.
- source_word: בְּנֶשֶׁךְ
  choice: под проценты
  rationale: נֶשֶׁךְ обозначает процент, взимаемый с займа. Современное русское выражение ясно передаёт экономический смысл без более узкого или архаичного оттенка слова «лихва».
- source_word: וּבְמַרְבִּית
  choice: ради прибыли
  rationale: מַרְבִּית означает увеличение, прирост или прибыль от предоставленного. В сочетании с пищей этот перевод естественно выражает извлечение дополнительной выгоды.
- source_word: אָכְלֶךָ
  choice: свою пищу
  rationale: אָכֶל прямо означает пищу или еду; «пища» сохраняет конкретность исходного слова и соответствует достоинству законодательного контекста.
- source_word: לֹא ... לֹא
  choice: не ... и не
  rationale: Повтор отрицания передан двумя согласованными запретами, что сохраняет параллельное построение еврейского текста.
theological_decisions:
- issue: Соотношение נֶשֶׁךְ и מַרְבִּית
  choice: 'Передать разными выражениями: «под проценты» и «ради прибыли».'
  alternative: Свести оба слова к общему понятию процентов или наживы.
  rationale: Еврейский текст употребляет два разных экономических термина применительно к деньгам и пище. Их различие сохранено без попытки установить более узкую систему запретов, чем позволяет стих.
translation_notes:
  register: Современный литературный русский язык с ясной законодательной интонацией. Повтор «не давай ему» сохраняет параллелизм исходного текста; формулировки избегают архаизмов «лихва» и «рост» и не ограничивают запрет лишь чрезмерными процентами.
