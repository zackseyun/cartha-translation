  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: ru
  text: То, что само вырастет после твоей жатвы[a], не жни, и винограда с твоей необрезанной лозы[b] не собирай. Это будет год полного покоя для земли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самосев после твоей жатвы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «винограда твоей отделённой лозы»; имеется в виду лоза, оставленная без ухода и обрезки в год покоя.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «субботний год для земли»; также возможно: «год торжественного покоя для земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: то, что само вырастет после твоей жатвы
  rationale: Сочетание обозначает урожай, выросший сам по себе из семян, оставшихся от прежней жатвы; описательный перевод ясно передаёт эту мысль по-русски.
- source_word: תִקְצֹר
  choice: не жни
  rationale: Глагол обозначает жатву полевых культур; «жать» сохраняет конкретный земледельческий образ.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: винограда с твоей необрезанной лозы
  rationale: В данном земледельческом контексте נָזִיר указывает на оставленную без ухода, в частности без обрезки, лозу; буквальная идея отделённости отмечена в сноске.
- source_word: תִבְצֹר
  choice: не собирай
  rationale: Глагол относится к сбору винограда; «собирать виноград» естественно и точно звучит в современном русском языке.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: год полного покоя
  rationale: שַׁבָּתוֹן выражает усиленную идею прекращения труда и полного покоя, а не только название календарного периода.
- source_word: לָאָרֶץ
  choice: для земли
  rationale: Контекст говорит о возделываемой земле, которой предписан покой.
theological_decisions:
- issue: Передача терминологии субботнего года без привнесения позднейших доктринальных или литургических ассоциаций
  choice: год полного покоя для земли
  alternative: субботний год для земли; год торжественного покоя для земли
  rationale: Формулировка передаёт усиленное значение שַׁבָּתוֹן и сохраняет богословский мотив покоя земли, не превращая выражение лишь в календарное наименование и не добавляя отсутствующих в тексте выводов.
translation_notes:
  register: Современный литературный русский язык с ясной законодательной формой. Описательная передача самосева предпочтена редкому существительному в основном тексте; земледельческие глаголы и образ покоя земли сохранены.
