  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: ru
  text: Земля даст свой плод, и вы будете есть досыта и жить на ней в безопасности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנָה
  choice: даст
  rationale: Буквально передаёт נתן («давать»), сохраняя образ земли, которая даёт плод; по-русски сочетание естественно.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте Левита 25 речь идёт о земле, где живёт и возделывает поля Израиль, а не о земле как всём мире.
- source_word: פִּרְיָהּ
  choice: свой плод
  rationale: Сохраняет конкретный образ еврейского פְּרִי и при этом может обозначать весь урожай земли.
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: и вы будете есть досыта
  rationale: Естественно передаёт буквальный смысл насыщения и достатка пищи.
- source_word: וִישַׁבְתֶּם
  choice: и жить
  rationale: В данном контексте ישב означает постоянное проживание или обитание на земле; «жить» ясно и современно.
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: Передаёт значение защищённости и спокойного проживания без добавления не выраженных в тексте оттенков.
- source_word: עָלֶיהָ
  choice: на ней
  rationale: Местоимение относится к слову «земля» и прямо передаёт еврейский предлог עַל.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет конкретный образ плодоносящей земли и звучит естественно и достойно. Лексически возможное значение «обитать» передано общеупотребительным «жить» без необходимости в примечании.
