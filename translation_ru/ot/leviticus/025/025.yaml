base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: ru
  text: Если твой брат обеднеет и продаст часть своего наследственного владения[a], то его ближайший родственник-выкупщик[b] может прийти и выкупить проданное его братом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Наследственное владение» — земельный надел, закреплённый за семьёй в Израиле и передававшийся из поколения в поколение.
    reason: cultural_note
  - marker: b
    text: Речь идёт о близком родственнике (гоэле), который мог выкупить отчуждённое семейное владение.
    reason: lexical_note
lexical_decisions:
- source_word: יָמוּךְ
  choice: обеднеет
  rationale: Глагол обозначает экономическое обнищание; «обеднеет» естественно и точно передаёт наступление такого состояния в условной правовой норме.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохранено буквальное родственное обозначение; в контексте закона оно может относиться шире к соплеменнику-израильтянину.
- source_word: מֵאֲחֻזָּתוֹ
  choice: часть своего наследственного владения
  rationale: Предлог מִן выражает отчуждение части владения, а אֲחֻזָּה в данном разделе означает закреплённый за семьёй наследственный земельный надел, а не имущество вообще.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: его ближайший родственник-выкупщик
  rationale: גֹּאֵל обозначает родственника, имеющего право и обязанность вернуть семье отчуждённую собственность; поясняющее определение передаёт приоритет близкого родства.
- source_word: וּבָא וְגָאַל
  choice: должен прийти и выкупить
  rationale: Последовательные формы в аподосисе казуистического закона переданы как предписанное юридическое действие, но возможная менее обязывающая модальная трактовка отмечена в сноске.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: проданное его братом
  rationale: מִמְכָּר может обозначать проданное имущество или предмет сделки; русская формулировка естественно указывает на отчуждённое владение.
theological_decisions:
- issue: Родственное обозначение в законе Израиля
  choice: твой брат
  alternative: твой соплеменник / твой родственник
  rationale: Перевод сохраняет конкретный образ братства исходного текста, не сужая и не расширяя его молча; более широкое общественное значение поясняется в сноске.
- issue: Передача терминов корня גאל
  choice: родственник-выкупщик / выкупить
  alternative: искупитель / возвратить
  rationale: В данном земельно-правовом контексте составное обозначение ясно выражает родственную и юридическую функцию, сохраняя связь с важным библейским понятием выкупа без внесения позднейших богословских смыслов.
- issue: Модальная сила וּבָא וְגָאַל
  choice: должен прийти и выкупить
  alternative: может прийти и выкупить
  rationale: Контекст формулирует установленный порядок возврата семейного владения, однако сами еврейские формы не содержат отдельного модального глагола; поэтому допустимая разрешительная трактовка сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной юридической формулировкой. Составной термин «родственник-выкупщик» несколько специальный, но понятен из контекста и сноски; он сохраняет одновременно родственную и правовую стороны еврейского גֹּאֵל.
