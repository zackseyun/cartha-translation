  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: ru
  text: Но поле на землях вокруг их городов[a] нельзя продавать, потому что это их постоянное владение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пастбищные угодья» или «общинные земли». Еврейское מִגְרָשׁ обозначает открытую землю вокруг города, в данном случае вокруг левитских городов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вечное владение» или «владение навеки». Еврейское עוֹלָם здесь обозначает устойчивый, неотчуждаемый статус этой земли.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה
  choice: Но поле
  rationale: שָׂדֶה передано буквально как «поле». Союз וּ в контексте противопоставляет это предписание предыдущему разрешению и естественно передаётся как «но».
- source_word: מִגְרַשׁ עָרֵיהֶם
  choice: из земель вокруг их городов
  rationale: מִגְרָשׁ обозначает открытую, в том числе пастбищную или общинную, землю при городе. Такая формулировка ясно передаёт пространственную связь и сохраняет конструкцию, в которой поле относится к землям при левитских городах.
- source_word: לֹא יִמָּכֵר
  choice: нельзя продавать
  rationale: Нифаль глагола מכר имеет пассивное значение «быть проданным», а отрицание выражает правовой запрет. Безличная русская конструкция естественна и точно передаёт обязательную силу нормы.
- source_word: כִּי
  choice: потому что
  rationale: כִּי вводит основание запрета.
- source_word: אֲחֻזַּת עוֹלָם
  choice: постоянное владение
  rationale: אֲחֻזָּה означает наследственное земельное владение, а עוֹלָם здесь указывает на его устойчивый, неотчуждаемый статус. «Постоянное владение» не усиливает выражение до отвлечённой метафизической вечности.
- source_word: הוּא לָהֶם
  choice: это их
  rationale: Местоимение с предложным оборотом указывает, что данная земля принадлежит им; по-русски это естественно выражается притяжательной конструкцией.
theological_decisions:
- issue: Значение עוֹלָם в законе о земле
  choice: постоянное владение
  alternative: вечное владение; владение навеки
  rationale: В данном правовом контексте слово обозначает непреходящий и неотчуждаемый статус земли в установленном для Израиля порядке. Перевод сохраняет юридическую силу текста, не превращая её без необходимости в утверждение о метафизической вечности.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и понятная, с умеренно официальным оттенком, соответствующим правовому контексту. Буквальное «поле» сохранено, а значение מִגְרָשׁ раскрыто без тяжеловесной конструкции.
