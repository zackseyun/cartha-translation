  text: וְ/לִ֨/בְהֶמְתְּ/ךָ֔ וְ/לַֽ/חַיָּ֖ה אֲשֶׁ֣ר בְּ/אַרְצֶ֑/ךָ תִּהְיֶ֥ה כָל תְּבוּאָתָ֖/הּ לֶ/אֱכֹֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: ru
  text: И для твоего скота, и для диких животных, которые живут на твоей земле, весь её урожай будет пищей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: для твоего скота
  rationale: Слово обозначает принадлежащих адресату домашних животных; «скот» естественно и ясно противопоставлен следующим далее диким животным.
- source_word: לַחַיָּה
  choice: для диких животных
  rationale: В противопоставлении скоту חַיָּה обозначает животных, не одомашненных человеком.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: которые живут на твоей земле
  rationale: Относительное придаточное относится к диким животным. Глагол «живут» естественно передаёт подразумеваемое пребывание, а «земля» сохраняет конкретный смысл אֶרֶץ и связь с сельскохозяйственным контекстом.
- source_word: כָּל תְּבוּאָתָהּ
  choice: весь её урожай
  rationale: תְּבוּאָה здесь означает урожай, который даёт земля; местоимение женского рода отсылает к земле.
- source_word: תִּהְיֶה ... לֶאֱכֹל
  choice: будет пищей
  rationale: Сочетание глагола היה с инфинитивом цели естественно передаётся по-русски как назначение урожая в пищу, сохраняя нормативный оттенок контекста.
