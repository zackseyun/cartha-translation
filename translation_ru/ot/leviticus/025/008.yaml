  rationale: Заменено перегруженное и малопонятное «субботних седмин лет» на «субботних семилетий». Это сохраняет понятие семилетних циклов и связь с «субботами лет», а буквальная формулировка остаётся в сноске. «Дни» сохранено как соответствие יְמֵי; перестроен итоговый оборот для естественного русского звучания.
