base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: ru
  text: Отсчитай себе семь субботних семилетий[a], семь раз по семь лет, и дни этих семи субботних семилетий составят у тебя сорок девять лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь седмин лет». Буквально: «семь суббот лет»; имеются в виду семь семилетних циклов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ
  choice: Отсчитай
  rationale: Императивное по смыслу значение формы с вавом передаёт предписание исчислить установленную последовательность периодов; «отсчитай» естественно выражает последовательный счёт.
- source_word: לְךָ
  choice: себе / для тебя
  rationale: Явно сохраняется дательный компонент второго лица, повторённый в еврейском тексте.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: семь субботних седмин лет
  rationale: «Субботних» сохраняет связь с субботним годом, а «седмин» передаёт значение семичленных периодов; буквальная конструкция поясняется в сноске.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: семь раз по семь лет
  rationale: Естественная русская формулировка ясно передаёт повторение семилетнего периода семь раз.
- source_word: יְמֵי
  choice: время
  rationale: Буквально «дни», но здесь слово обозначает совокупную продолжительность исчисляемых периодов; «время» звучит естественно и не меняет арифметического смысла.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: сорок девять лет
  rationale: Числительное передано в нормативном для современного русского языка порядке.
