  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: ru
  text: Если кто-нибудь выкупит дом у левитов[a], то проданный дом в городе, принадлежащем левитам, возвратится в юбилейный год[b], потому что дома в городах левитов — их владение среди сынов Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если кто-нибудь из левитов выкупит его». Еврейская конструкция допускает такое понимание, но предлог также может обозначать того, у кого совершается выкуп.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выйдет» — то есть выйдет из владения покупателя и возвратится.'
    reason: lexical_alternative
  - marker: c
    text: «Сыны Израиля» — традиционное еврейское обозначение народа Израиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: Если кто-нибудь из левитов выкупит его
  rationale: 'מִן допускает партитивное понимание: выкупающий принадлежит к числу левитов. Местоимение «его» восполняет подразумеваемый объект — дом — из ближайшего контекста. Неоднозначность конструкции отмечена в сноске.'
- source_word: וְיָצָא מִמְכַּר בַּיִת
  choice: проданный дом… вернётся
  rationale: Буквально וְיָצָא означает «выйдет», а מִמְכַּר может обозначать проданное имущество. В законе о юбилее речь идёт о выходе дома из владения покупателя и его возврате; «вернётся» естественно передаёт юридический результат, а буквальный образ сохранён в сноске.
- source_word: וְעִיר אֲחֻזָּתוֹ
  choice: находящийся в городе его владения
  rationale: Сжатая еврейская конструкция понимается в связи с предыдущим стихом как указание на дом в городе левита. Формулировка сохраняет юридический термин «владение» и не превращает его в более узкое «наследство».
- source_word: בַּיֹּבֵל
  choice: в юбилейный год
  rationale: Так в современном русском естественно обозначается установленный законом пятидесятый год возвращения владений.
- source_word: בָתֵּי עָרֵי הַלְוִיִּם
  choice: дома в городах левитов
  rationale: Русское «в городах» естественно передаёт смысл еврейской сопряжённой конструкции и избегает тяжеловесного «дома городов левитов».
- source_word: הִוא אֲחֻזָּתָם
  choice: их владение
  rationale: אֲחֻזָּה — закреплённое земельное владение; «владение» сохраняет юридическую широту термина, не уточняя без необходимости способ наследования.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Формально передаёт традиционное заветное обозначение народа и сохраняет образ исходного текста.
theological_decisions:
- issue: Кто совершает выкуп в выражении מִן הַלְוִיִּם
  choice: кто-нибудь из левитов
  alternative: кто-нибудь выкупит у левитов
  rationale: Предлог מִן может быть понят партитивно либо как указание на источник. Основной текст следует контекстуальному прочтению, при котором право выкупа осуществляет левит, но альтернативная синтаксическая возможность не скрыта.
- issue: Юридический смысл וְיָצָא в юбилейный год
  choice: дом вернётся
  alternative: дом выйдет из владения покупателя
  rationale: Выбрана естественная русская формула возврата проданного владения; она не определяет нового владельца сверх того, что предполагает закон о юбилее. Буквальный оборот приведён в сноске.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля; израильтяне
  rationale: Сохранено формально мужское и традиционное заветное выражение исходного текста без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Синтаксис умеренно формальный; технические понятия «выкуп», «юбилейный год» и «владение» сохранены, а подлинная неоднозначность начальной конструкции вынесена в сноску.
