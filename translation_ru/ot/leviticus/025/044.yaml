  text: וְ/עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ אֲשֶׁ֣ר יִהְיוּ לָ֑/ךְ מֵ/אֵ֣ת הַ/גּוֹיִ֗ם אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם מֵ/הֶ֥ם תִּקְנ֖וּ עֶ֥בֶד וְ/אָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: ru
  text: Что касается твоего раба и твоей рабыни, которые будут принадлежать тебе[a], то раба и рабыню можете покупать у народов, окружающих вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые будут у тебя»; возможно также: «которые будут твоими».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у народов, которые вокруг вас». Имеются в виду соседние с Израилем народы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: твоего раба
  rationale: В данном правовом контексте речь идёт о человеке, которого покупают и который находится во владении; поэтому «раб» точнее, чем смягчающее «слуга». Мужской род сохранён в паре с отдельным женским обозначением.
- source_word: אֲמָתְךָ
  choice: твоей рабыни
  rationale: Слово обозначает женщину в рабском положении и здесь образует женскую параллель к עֶבֶד. «Рабыня» — ясный современный русский эквивалент.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: которые будут принадлежать тебе
  rationale: Оборот описывает принадлежность адресату в правовом смысле. Перевод сохраняет будущее значение формы и делает притяжательное отношение понятным по-русски.
- source_word: מֵאֵת הַגּוֹיִם
  choice: у народов
  rationale: גּוֹיִם здесь означает окружающие Израиль народы. Предлог «у» естественно сочетается с русским «покупать» и передаёт источник приобретения.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: живущих вокруг вас
  rationale: Добавленное по смыслу «живущих» естественно выражает пространственное отношение и не меняет референта — соседние народы.
- source_word: מֵהֶם
  choice: у них
  rationale: Местоимение повторно указывает на окружающие народы как на тех, у кого допускается приобретение рабов, сохраняя еврейское усилительное повторение.
- source_word: תִּקְנוּ
  choice: можете покупать
  rationale: В контексте закона форма выражает разрешение, а не повеление. Несовершенный вид уместен для общего правового дозволения.
- source_word: עֶבֶד וְאָמָה
  choice: раба и рабыню
  rationale: Сохранена еврейская пара существительных мужского и женского рода, употреблённая в обобщающем единственном числе.
theological_decisions:
- issue: Передача терминов рабства в правовом тексте
  choice: «раб» и «рабыня»
  alternative: «слуга» и «служанка»
  rationale: Покупка и принадлежность составляют явный смысл данного постановления; более мягкие слова скрыли бы общественно-правовой статус, обозначенный текстом.
- issue: Модальность תִּקְנוּ
  choice: разрешительное «можете покупать»
  alternative: предписывающее «покупайте» или нейтральное «будете покупать»
  rationale: Стих определяет допустимый источник приобретения, а не обязывает каждого адресата совершать покупку.
- issue: Смена числа адресата
  choice: сохранить «тебе» и «вас / можете»
  alternative: унифицировать всё во множественном или единственном числе
  rationale: Еврейский текст переходит от единственного числа в притяжательном обороте к множественному при упоминании окружающих народов и разрешении покупать. Сохранение этой особенности не устраняет возможную коллективную адресацию.
translation_notes:
  register: Современный литературный русский язык с прямой правовой лексикой. Начальное «Что же касается…» передаёт вынесенную в начало тему еврейской фразы; повтор «у народов… у них» намеренно сохраняет структуру и акцент оригинала. Архаизмы и эвфемизмы исключены.
