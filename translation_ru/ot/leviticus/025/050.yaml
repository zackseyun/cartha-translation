source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: ru
  text: Он должен произвести расчёт со своим покупателем с года, когда продал себя ему[a], до юбилейного года. Цена его продажи должна определяться по числу лет; он будет у него как наёмный работник[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от года, когда он был продан ему». В контексте речь идёт о человеке, продавшем себя в услужение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как дни наёмного работника он будет у него». Сравнение может относиться к сроку его пребывания или к его положению у покупателя.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְחִשַּׁב עִם קֹנֵהוּ
  choice: Он должен произвести расчёт со своим покупателем
  rationale: Глагол חשׁב в данном правовом и финансовом контексте означает исчисление выкупной суммы. «Произвести расчёт» естественно передаёт и само вычисление, и согласование суммы с покупателем.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: от года, когда продал себя ему
  rationale: Формально конструкция означает «от года, когда он был продан ему», однако контекст добровольной продажи себя в долговую зависимость допускает и делает ясным возвратное выражение «продал себя»; формальная альтернатива сохранена в сноске.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: до юбилейного года
  rationale: Устойчивое и понятное обозначение установленного законом юбилейного года.
- source_word: כֶּסֶף מִמְכָּרוֹ
  choice: Цена, за которую он был продан
  rationale: כֶּסֶף буквально означает «серебро, деньги», но здесь обозначает денежную цену сделки; выбранная формулировка естественна для русского юридико-экономического контекста.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: по числу лет
  rationale: Сохраняет краткость оригинала и указывает на пропорциональное исчисление цены по количеству лет, не уточняя сверх текста, идёт ли речь о прошедших или оставшихся годах.
- source_word: כִּימֵי שָׂכִיר יִהְיֶה עִמּוֹ
  choice: время его пребывания у покупателя должно считаться временем службы наёмного работника
  rationale: Передаёт сравнение со сроком труда наёмника и связывает его с исчислением цены. Такая формулировка понятна по-русски и не превращает человека в постоянную собственность покупателя; более буквальная синтаксическая форма приведена в сноске.
theological_decisions:
- issue: Характер зависимости проданного израильтянина
  choice: Сравнение со службой наёмного работника сохранено как принцип исчисления срока и цены.
  alternative: 'Передать последнюю фразу как прямое утверждение социального статуса: «он будет у него на положении наёмника».'
  rationale: Еврейская формулировка связывает «дни наёмника» с пребыванием у покупателя, но не вполне однозначно определяет, относится ли сравнение прежде всего к статусу, длительности или оценке службы. Перевод сохраняет правовой смысл контекста, а сноска — буквальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным оттенком, соответствующим правовому характеру главы. Избегнуты архаизмы и чрезмерно буквальные обороты; ключевая неоднозначность заключительной фразы сохранена в сноске.
