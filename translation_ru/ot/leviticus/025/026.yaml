lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: Если же у человека
  rationale: Оборот вводит новый условный случай в продолжение закона. «Если же» естественно передаёт условие и противопоставление предыдущей ситуации; обобщённое «у человека» сохраняет единственное число без стилистически тяжёлого «если какой-либо мужчина».
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: нет родственника, который мог бы совершить выкуп
  rationale: В законах о земле גֹּאֵל — не просто любой избавитель, а близкий родственник, обладающий правом или обязанностью выкупить семейное владение. Описательная передача ясна современному читателю и не вводит неестественного термина.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: но его достаток возрастёт
  rationale: 'Буквально: «его рука достигнет». Здесь это идиома об увеличении материальных возможностей. Перевод передаёт экономический смысл, а буквальный образ отмечен в сноске.'
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: и у него найдётся достаточно средств для выкупа
  rationale: וּמָצָא сохраняет значение «найдёт / у него найдётся», כְּדֵי выражает достаточность, а גְאֻלָּתוֹ в контексте означает выкуп ранее проданного владения. Формулировка не перегружает стих повторным уточнением объекта.
theological_decisions:
- issue: Характер роли גֹּאֵל
  choice: родственник, который мог бы совершить выкуп
  alternative: искупитель; родственник-выкупщик
  rationale: Контекст регулирует семейно-имущественный выкуп, а не прямо богословское избавление. Описательная формулировка сохраняет юридическую роль и не навязывает конфессиональных ассоциаций; возможность права или обязанности пояснена в сноске.
