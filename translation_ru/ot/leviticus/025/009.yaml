base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: ru
  text: И подай громкий сигнал рогом[a] в седьмом месяце, в десятый день месяца. В День искупления[b] подавайте сигнал рогом по всей вашей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. шофар — сигнальный духовой инструмент из рога; традиционно его часто понимают как бараний рог.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «День искуплений»; еврейское слово стоит во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: И протруби
  rationale: Побудительная форма глагола עבר буквально означает «провести, заставить пройти», но в сочетании с שׁוֹפָר идиоматически говорит о распространении звука рога. «Протруби» естественно передаёт это действие; союз «и» сохраняет последовательную связь.
- source_word: שׁוֹפַר
  choice: рог
  rationale: Имеется в виду духовой сигнальный инструмент из рога. Слово «рог» понятно современному читателю и точнее по материалу и типу инструмента, чем общее «труба»; уточнение дано в сноске.
- source_word: תְּרוּעָה
  choice: громким сигналом
  rationale: В данном инструментальном контексте слово обозначает громкий сигнальный звук, а не человеческий крик. Творительный оборот естественен по-русски после «протруби».
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: в седьмом месяце
  rationale: Прямо передаёт временное указание без подстановки позднейшего названия месяца.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: в десятый день месяца
  rationale: Еврейская идиома буквально означает «в десятый [день] месяца»; добавление слова «день» необходимо для ясного современного русского.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: В День искупления
  rationale: Устоявшееся и понятное русское название установленного дня; морфологический plural כִּפֻּרִים отмечен в сноске.
- source_word: תַּעֲבִירוּ
  choice: протрубите
  rationale: Повторяется тот же глагол, что в начале стиха, но теперь во множественном числе. Русский перевод сохраняет переход от обращения к одному лицу к обращению ко многим.
- source_word: בְּכָל אַרְצְכֶם
  choice: по всей вашей земле
  rationale: Передаёт всеохватное распространение сигнала по территории, принадлежащей адресатам.
theological_decisions:
- issue: Передача יוֹם הַכִּפֻּרִים
  choice: День искупления
  alternative: день искуплений; день очищений
  rationale: Устоявшееся название ясно обозначает культовый день, не навязывая узкого истолкования характера обряда. Формальная множественность еврейского существительного сохранена для читателя в сноске.
- issue: Смена числа адресата
  choice: «протруби» в единственном числе, затем «протрубите» во множественном
  alternative: унифицировать обе формы как обращение во множественном числе
  rationale: Еврейский текст действительно переходит от формы второго лица единственного числа к форме множественного числа. Перевод сохраняет эту особенность и не сглаживает возможный переход от непосредственного адресата к общине.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Формы «протруби / протрубите» сохраняют повелительно-нормативный характер и смену числа в оригинале. Термин «рог» сопровождается пояснением, чтобы избежать как излишней транслитерации «шофар», так и потери предметной конкретности в слове «труба».
