  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: ru
  text: Также можете покупать людей из числа сыновей пришлых поселенцев, живущих среди вас[a], и из их семей, находящихся среди вас, — тех, кого сыновья этих поселенцев породили в вашей земле; они станут вашей собственностью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из потомков пришлых поселенцев, живущих среди вас».'
    reason: בְּנֵי буквально означает «сыновья», но в данном родовом и правовом контексте может обозначать потомков.
  - marker: b
    text: 'Буквально: «они будут для вас владением»; в ближайшем контексте это владение подлежит передаче по наследству (ст. 46).'
    reason: Поясняет юридическое значение אֲחֻזָּה, точно отделяя буквальный смысл этого стиха от явно выраженного в следующем стихе наследования.
lexical_decisions:
- source_word: וְגַם
  choice: Также и
  rationale: Передаёт добавление к разрешению предыдущего стиха без искусственного усиления.
- source_word: מִבְּנֵי הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: из сыновей поселенцев, живущих среди вас
  rationale: «Сыновей» формально сохраняет בְּנֵי, а «поселенцев, живущих среди вас» естественно передаёт сочетание תּוֹשָׁבִים и גָּרִים; возможное более широкое значение «потомков» отмечено в сноске.
- source_word: מֵהֶם תִּקְנוּ
  choice: можете покупать
  rationale: קנה здесь имеет явный коммерческий смысл, а модальная форма выражает разрешение в законодательном контексте.
- source_word: וּמִמִּשְׁפַּחְתָּם
  choice: и из их семей
  rationale: «Семьи» понятно современному читателю и допускает присущий מִשְׁפָּחָה диапазон от семьи до рода.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: тех, кого они родили в вашей земле
  rationale: Сохраняет причинно-родительное значение Hiphil הוֹלִידוּ, не вводя в русский текст неясное гендерное ограничение.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: они станут вашей собственностью
  rationale: Прямо передаёт юридический статус людей как отчуждаемого и наследуемого владения, не смягчая рабовладельческую лексику.
theological_decisions:
- issue: Передача языка рабства и владения в законодательстве Левита
  choice: «покупать» и «станут вашей собственностью»
  alternative: «приобретать» и «будут вашим владением»
  rationale: Еврейский текст говорит о покупке людей и их юридическом статусе как наследуемого имущества; эвфемистическая передача скрыла бы нравственное и богословское напряжение текста.
- issue: Объём значения בְּנֵי
  choice: В основном тексте «сыновей», с альтернативой «потомков» в сноске
  alternative: Только «потомков»
  rationale: Так сохраняется форма оригинала и одновременно признаётся вероятное родовое, а не исключительно непосредственное сыновнее значение.
translation_notes:
  register: Современный литературный русский язык с сдержанным законодательным тоном. Синтаксис близок к еврейскому, но перестроен ради ясности; резкая лексика собственности намеренно не смягчена.
