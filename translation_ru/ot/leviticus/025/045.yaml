review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: текст сохраняет разрешение покупать людей у/из среды потомков пришлых жителей и их семей, а также их статус как אֲחֻזָּה. Однако исходная конструкция «из сыновей ... можете покупать» по-русски неясна: её легко понять как покупку у сыновей, тогда как מִבְּנֵי здесь вводит круг приобретаемых лиц. Кроме того, «тех, кого они родили» оставляет неудачно размытым, кто является субъектом הוֹלִידוּ; по контексту это потомки/сыновья пришлых поселенцев.'
  naturalness: Фраза нуждается в синтаксической перестройке. «Покупать из сыновей» неестественно без «из числа», а «семей, которые находятся среди вас» тяжеловесно и повторяет тот же оборот. Перестройка с «людей из числа...» делает юридический смысл ясным и сохраняет сдержанный законодательный регистр.
  terminology: «Пришлые поселенцы» удачнее, чем просто «поселенцы», поскольку позволяет передать сочетание תּוֹשָׁבִים и גָּרִים, не превращая их в местное население. «Собственностью» — допустимая прямая передача юридического значения לַאֲחֻזָּה в данном контексте. Сноска b должна точнее воспроизводить буквальную конструкцию «будут для вас владением/собственностью», а не утверждать, что наследуемость выражена именно этим стихом; она ясно раскрывается в следующем стихе.
  issues:
  - severity: medium
    issue: Неясная синтаксическая связь «из сыновей ... можете покупать».
    rationale: Русский предлог «из» после «покупать» может означать источник покупки («покупать у сыновей»), а не категорию покупаемых лиц. «Покупать людей из числа...» передаёт функцию מִבְּנֵי однозначнее.
  - severity: low
    issue: Ослаблено различие в паре תּוֹשָׁבִים הַגָּרִים.
    rationale: Одно «поселенцы» не отражает, что речь о пришлых, не-израильских жителях. «Пришлые поселенцы» сохраняет оба компонента без излишней терминологичности.
  - severity: medium
    issue: Неудачная отсылка в «тех, кого они родили».
    rationale: В русском тексте «они» может отсылать и к семьям, и к поселенцам. Явное «которых породили сыновья этих поселенцев» сохраняет мужской субъект множественного числа у הוֹלִידוּ и делает структуру понятной.
  - severity: low
    issue: Сноска b неточно формулирует буквальное значение и чрезмерно привязывает его к наследованию.
    rationale: לַאֲחֻזָּה — «во владение/как собственность»; наследственная передача конкретно предписывается в Лев 25:46, хотя является ближайшим юридическим контекстом.
