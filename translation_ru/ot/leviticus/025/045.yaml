revisions:
- from: Также и из сыновей поселенцев, живущих среди вас, можете покупать[a], и из их семей, которые находятся среди вас, — тех, кого они родили в вашей земле; они станут вашей собственностью[b].
  to: Также можете покупать людей из числа сыновей пришлых поселенцев, живущих среди вас[a], и из их семей, находящихся среди вас, — тех, кого сыновья этих поселенцев породили в вашей земле; они станут вашей собственностью[b].
  rationale: Исправление устраняет двусмысленность русской конструкции, восстанавливает значение «пришлые» в описании жителей и делает отсылку при הוֹלִידוּ синтаксически ясной. Прямой язык покупки и собственности сохранён; смысл и правовая резкость еврейского текста не смягчаются.
