  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: ru
  text: Если пришелец, живущий среди вас, обретёт достаток, а твой брат при нём обеднеет и продаст себя этому пришельцу, живущему среди вас, или одному из членов рода пришельца[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «корню (или ответвлению) рода пришельца». Еврейское выражение имеет неясный смысл; вероятно, имеется в виду член рода пришельца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: разбогатеет
  rationale: Буквально «рука достигнет»; это устойчивое обозначение обретения достаточных средств. В данном противопоставлении последующему обнищанию краткое «разбогатеет» естественно и точно передаёт экономический смысл.
- source_word: גֵּר וְתוֹשָׁב
  choice: пришелец, живущий среди вас
  rationale: Сочетание обозначает не коренного израильтянина, постоянно проживающего в общине, а не случайного путника. Определительный оборот сохраняет и чужеземный статус, и оседлое проживание без неестественного удвоения существительных.
- source_word: וּמָךְ
  choice: обеднеет
  rationale: Глагол указывает на утрату достатка и переход в состояние бедности.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохранён буквальный язык родства, имеющий в законе социально-нравственную силу; по контексту речь идёт о соплеменнике-израильтянине.
- source_word: עִמּוֹ
  choice: рядом с ним
  rationale: Фраза соотносит обедневшего израильтянина с разбогатевшим пришельцем. «Рядом с ним» сохраняет пространственно-социальную образность, не сводя выражение только к сравнению.
- source_word: וְנִמְכַּר
  choice: продаст себя
  rationale: Форма допускает пассивное «будет продан», однако контекст долговой зависимости подразумевает поступление человека в услужение посредством самопродажи. Возвратный смысл естественно выражен по-русски.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: одному из членов рода пришельца
  rationale: Редкое עֵקֶר буквально связано с корнем или основой и здесь, вероятно, обозначает представителя либо ответвление семейной группы. Основной текст передаёт наиболее вероятный смысл, а буквальная трудность отмечена в сноске.
theological_decisions:
- issue: Родственное обозначение израильтянина в социальном законе
  choice: твой брат
  alternative: твой соплеменник; твой родственник
  rationale: «Брат» сохраняет семейно-заветную силу исходного выражения и не превращает его в чисто гражданский термин.
- issue: Характер продажи, выраженной וְנִמְכַּר
  choice: продаст себя
  alternative: будет продан
  rationale: Контекст главы говорит об обедневшем человеке, поступающем в зависимое служение. Выбранная формулировка передаёт вероятный возвратный смысл, не отождествляя этот институт без пояснений с иными формами рабства.
- issue: Соотношение גֵּר и תוֹשָׁב
  choice: 'единое описание: «пришелец, живущий среди вас»'
  alternative: «пришелец или поселенец»
  rationale: В данном обороте слова естественно читаются как совмещённые характеристики одного социального статуса. Перевод сохраняет оба компонента, не утверждая без необходимости две отдельные категории.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис оставлен незавершённым запятой, поскольку стих составляет условную часть предложения, продолжающегося в следующем стихе. Местоимение второго лица единственного числа сохранено по еврейскому тексту.
