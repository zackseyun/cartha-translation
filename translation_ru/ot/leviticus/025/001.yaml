  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве[a] Моисею на горе Синай:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ); также передаётся как «Иегова».
