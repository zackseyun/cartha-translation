lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И говорил
  rationale: Форма с повествовательным וַ вводит следующий речевой эпизод; «говорил» передаёт значение דבר и естественно открывает формулу прямой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного אֶל.
- source_word: בְּהַר סִינַי
  choice: на горе Синай
  rationale: Предлог ב употреблён в локативном значении; название горы оставлено несклоняемым согласно современной русской норме.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание последующей речи; в современном русском эту функцию естественно и без смысловой потери передаёт двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом; вариант произношения отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционно-библейской, но понятной формулой «И говорил». Двоеточие вместо буквального «говоря» естественно связывает стих с последующей прямой речью.
