id: LEV.25.36
reference: Leviticus 25:36
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: ru
  text: Не бери с него процентов и прибыли[a]; бойся своего Бога, и пусть твой брат[b] живёт с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прибавки», «выгоды». В еврейском тексте рядом стоят два близких по смыслу слова, обозначающие проценты или иную прибавку, взимаемую с нуждающегося заёмщика.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «брат» — не обязательно родной брат, а человек из того же народа и общины завета.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: Не бери
  rationale: Сочетание אַל с имперфектом выражает прямой запрет; форма «не бери» естественна в современном русском языке и сохраняет силу повеления.
- source_word: מֵאִתּוֹ
  choice: с него
  rationale: Предложное сочетание указывает на человека, с которого кредитор не должен взыскивать запрещённую прибавку.
- source_word: נֶשֶׁךְ
  choice: процентов
  rationale: Слово обозначает проценты, взимаемые по займу. «Лихва» в современном русском языке архаична и может подразумевать лишь чрезмерные проценты.
- source_word: וְתַרְבִּית
  choice: и прибыли
  rationale: В паре с נֶשֶׁךְ слово обозначает прибавку или выгоду, получаемую с нуждающегося заёмщика. «Прибыль» ясно передаёт экономический смысл, а возможные варианты отмечены в сноске.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: бойся своего Бога
  rationale: Русский императив естественно передаёт предписывающую силу древнееврейской формы; «своего Бога» сохраняет прямое обращение и заветный характер выражения.
- source_word: וְחֵי
  choice: и пусть … живёт
  rationale: Такой перевод прямо передаёт присоединение посредством וְ и волюнтативный оттенок формы, не вводя однозначного целевого значения.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохранён буквальный родственный образ, который в данном законе обозначает также соплеменника и члена общины завета.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Прямо передаёт продолжение жизни рядом с адресатом, внутри одной общины.
theological_decisions:
- issue: Социально-заветное значение слова אָחִיךָ
  choice: твой брат
  alternative: твой соплеменник; член твоего народа
  rationale: «Брат» сохраняет семейную и заветную образность исходного текста, тогда как более широкое общественное значение поясняется в сноске.
- issue: Связь заключительного предписания с запретом
  choice: и пусть твой брат живёт с тобой
  alternative: чтобы твой брат мог жить с тобой
  rationale: Союз и форма глагола допускают оттенок результата или цели, однако выбранный вариант не делает этот оттенок более определённым, чем в древнееврейском тексте.
translation_notes:
  register: Современный литературный русский язык с прямой, ясной формой законодательного предписания. Синтаксис сохраняет последовательность исходного текста; архаичные «лихва» и «рост» не употреблены.
