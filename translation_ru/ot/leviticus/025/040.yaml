source:
  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: ru
  text: Пусть он будет у тебя как наёмный работник, как временно проживающий[a]; пусть он работает у тебя до юбилейного года.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как житель-переселенец».'
    reason: Лексическая альтернатива для תּוֹשָׁב; термин обозначает проживающего среди общины человека и в данном контексте описывает социальное положение, а не этническое происхождение.
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: как наёмный работник
  rationale: שָׂכִיר обозначает человека, нанятого за плату. «Наёмный работник» ясно передаёт его положение и не создаёт подразумеваемого контекстом статуса раба.
- source_word: כְּתוֹשָׁב
  choice: как поселенец
  rationale: תּוֹשָׁב обозначает постоянно живущего среди общины человека, который не принадлежит к коренному населению. «Поселенец» кратко передаёт эту социально-правовую категорию; возможное уточнение дано в сноске.
- source_word: יִהְיֶה עִמָּךְ
  choice: пусть он будет у тебя
  rationale: Передаёт прямое значение конструкции и её нормативный оттенок в законодательном контексте; сравнительный статус выражен двумя оборотами с «как».
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: до юбилейного года
  rationale: «Юбилейный год» — естественное русское обозначение установленного в Левите 25 года освобождения и возвращения владений.
- source_word: יַעֲבֹד עִמָּךְ
  choice: работает у тебя
  rationale: В данном контексте עבד означает трудовую службу. «Работает» не привносит оттенка рабского состояния, которое ближайший контекст прямо отличает от положения этого человека; «у тебя» естественно передаёт עִמָּךְ в отношениях найма.
theological_decisions:
- issue: Положение обедневшего израильтянина, находящегося в услужении
  choice: Текст подчёркивает положение наёмного работника, а не раба.
  alternative: Перевести עבד как «служить» или назвать человека «наёмным слугой».
  rationale: В ближайшем контексте (Лев. 25:39–43) его положение противопоставлено рабскому и ограничено сроком до юбилейного года. Перевод не должен привносить более сильные ассоциации с рабством, чем допускает исходный текст.
translation_notes:
  register: Современный литературный русский язык с лаконичным законодательным тоном. Формула «пусть…» передаёт предписание без архаичного звучания; повтор «у тебя» сохраняет структуру и личную направленность еврейского текста.
