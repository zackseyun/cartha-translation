review_pass:
  verdict: revise
  source_fidelity: 'Основная структура стиха передана верно: два сравнения, пребывание у адресата и срок до юбилейного года. Однако «поселенец» в современном русском обычно означает того, кто поселился или был поселён на определённой территории, и неясно передаёт статус תּוֹשָׁב. Сноска «постоянно живущий чужеземец» также чрезмерно конкретизирует этническое происхождение в данном контексте, где речь идёт об израильтянине, уподобляемом такому социальному положению.'
  naturalness: «Пусть он будет у тебя» допустимо в законодательном стиле, но «пусть он будет работать у тебя» звучит естественнее и последовательно передаёт оба глагола как предписательные формы. «Временно проживающий» понятно и современно, хотя несколько административно по оттенку; в данном юридическом контексте это уместнее, чем двусмысленный «поселенец».
  terminology: «Наёмный работник» и «юбилейный год» удачны. Для תּוֹשָׁב выбран «временно проживающий» как нейтральное обозначение проживающего не на правах коренного члена общины; сноска отмечает более буквальную альтернативу «житель-переселенец» без утверждения, будто этот человек непременно чужеземец.
  issues:
  - severity: medium
    issue: «Поселенец» недостаточно точно и естественно передаёт תּוֹשָׁב.
    rationale: В современном употреблении слово связано прежде всего с освоением/заселением территории либо со специальными категориями поселенцев, а не с правовым положением проживающего среди общины человека.
  - severity: medium
    issue: Сноска называет תּוֹשָׁב «чужеземцем».
    rationale: Такое определение может быть уместно для категории в иных контекстах, но здесь субъектом является «твой брат» из предыдущего стиха; сравнение описывает его положение, а не устанавливает его этническую принадлежность.
  - severity: low
    issue: Сочетание «Пусть он будет ... и работает» смешивает предписательную конструкцию с изъявительным настоящим временем.
    rationale: Повтор «пусть ... будет работать» даёт ровный современный законодательный синтаксис и яснее передаёт два еврейских глагола.
  revised_text: Пусть он будет у тебя как наёмный работник, как временно проживающий[a]; пусть он работает у тебя до юбилейного года.
