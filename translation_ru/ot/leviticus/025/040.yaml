revisions:
- from: Пусть он будет у тебя как наёмный работник, как поселенец[a], и работает у тебя до юбилейного года.
  to: Пусть он будет у тебя как наёмный работник, как временно проживающий[a]; пусть он работает у тебя до юбилейного года.
  rationale: Заменены двусмысленный «поселенец» и чрезмерно конкретизирующая сноска. Синтаксис приведён к последовательной нормативной форме. Сохраняются повтор сравнений, отношение к адресату и ограничение службы юбилейным годом.
