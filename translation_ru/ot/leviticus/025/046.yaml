review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: речь идёт о передаче людей сыновьям как наследуемого владения, о принуждении их к труду и о запрете жестокого господства над собратьями-израильтянами. Однако «чтобы они наследовали их как собственность» несколько перестраивает и утяжеляет конструкцию לָרֶשֶׁת אֲחֻזָּה; «как наследственное владение» точнее передаёт юридическую формулу. «Навечно» может звучать метафизически сильнее, чем требуется в данном правовом контексте; «навсегда» сохраняет длительный, постоянный характер без лишней догматизации.'
  naturalness: 'Заключительная фраза исходного варианта тяжеловесна и тавтологична: «никто не должен господствовать жестоко — ни один над своим братом». Перестройка с «никто из вас» естественнее для современного литературного русского и сохраняет распределительный смысл איש באחיו.'
  terminology: «Сыны Израиля» и «братья» сохранены уместно. «Принуждать их к работе» яснее и точнее, чем разговорно-описательное «заставлять работать», для передачи труда, требуемого от людей, находящихся во владении. «Наследственное владение» удачно передаёт אֲחֻזָּה, не затушёвывая имущественный статус.
