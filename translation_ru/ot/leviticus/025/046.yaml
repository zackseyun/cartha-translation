  text: וְ/הִתְנַחֲלְתֶּ֨ם אֹתָ֜/ם לִ/בְנֵי/כֶ֤ם אַחֲרֵי/כֶם֙ לָ/רֶ֣שֶׁת אֲחֻזָּ֔ה לְ/עֹלָ֖ם בָּ/הֶ֣ם תַּעֲבֹ֑דוּ וּ/בְ/אַ֨חֵי/כֶ֤ם בְּנֵֽי יִשְׂרָאֵל֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: ru
  text: Вы можете передавать их в наследство своим сыновьям после вас[a], как наследственное владение навсегда; вы можете принуждать их к работе. Но над вашими братьями, сынами Израиля[b], никто из вас не должен жестоко господствовать над своим братом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «можете завещать их своим сыновьям после вас как наследственную собственность».'
    reason: lexical_alternative
  - marker: b
    text: Слова «братья» и «сыны Израиля» прямо передают еврейские термины мужского рода; закон говорит о других израильтянах как о братьях по завету.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: вы можете передавать их в наследство
  rationale: Форма от נחל здесь выражает передачу людей потомкам как наследуемого имущества. Эта формулировка естественна по-русски и сохраняет юридический смысл.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: своим сыновьям после вас
  rationale: Сохраняется прямое значение בנים — «сыновья» — и временной смысл «после вас».
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: чтобы они наследовали их как собственность
  rationale: 'Переданы оба компонента выражения: наследование и статус владения; местоимения добавлены для ясности русского синтаксиса.'
- source_word: לְעֹלָם
  choice: навечно
  rationale: В данном юридическом контексте обозначает неограниченно продолжающийся, постоянный статус владения, а не метафизическую вечность.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: их вы можете заставлять работать
  rationale: Формулировка ясно передаёт принудительный характер труда в контексте владения людьми, не смягчая его до обычной службы или найма.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: но над вашими братьями, сынами Израиля
  rationale: Сохранены контраст, родственная терминология и пояснительное наименование «сыны Израиля».
- source_word: אִישׁ בְּאָחִיו
  choice: ни один над своим братом
  rationale: 'Передаёт распределительное значение: запрет относится к каждому израильтянину в его отношении к собрату.'
- source_word: לֹא תִרְדֶּה בוֹ
  choice: никто не должен господствовать
  rationale: Глагол רדה означает осуществлять власть или господство; модальная запретительная конструкция звучит естественно в современном русском юридико-нормативном изложении.
- source_word: בְּפָרֶךְ
  choice: жестоко
  rationale: Наречие кратко передаёт суровый, безжалостный характер господства или принудительного труда, обозначенный פֶּרֶךְ.
theological_decisions:
- issue: Передача родственной терминологии в общественном законе Израиля
  choice: Сохранить «братья» и «сыны Израиля».
  alternative: «соплеменники-израильтяне» или «соотечественники»
  rationale: Еврейский текст намеренно описывает израильтян как братьев внутри заветного сообщества. Прямые мужские термины сохранены без нейтрализации.
- issue: Прямота языка о рабстве и собственности
  choice: Сохранить лексику наследования, собственности и принудительного труда.
  alternative: Использовать смягчённую лексику службы или домашнего труда.
  rationale: Исходный текст прямо говорит о людях как о наследуемом владении и о принуждении к труду; перевод не должен скрывать социальную и нравственную тяжесть этой нормы.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-библейской речи. Лексика намеренно не смягчает обозначенные в тексте наследственное владение людьми и принудительный труд. Инверсия в заключительной фразе сохраняет выразительность запрета, оставаясь понятной современному читателю.
