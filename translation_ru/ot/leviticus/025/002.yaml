  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: ru
  text: 'Обратись к сынам Израиля[a] и скажи им: «Когда вы войдёте в землю, которую Я даю вам, земля будет соблюдать субботу, посвящённую Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к израильтянам». Буквально: «к сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «земля будет покоиться субботним покоем, посвящённым Яхве». Еврейский текст представляет землю как соблюдающую субботний покой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: Интенсивный императив глагола דבר вводит прямое Божье повеление Моисею; «обратись» естественно сочетается с последующим «скажи им» и избегает тяжеловесного повтора.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранён буквальный родственный образ еврейского выражения; более обобщённый вариант «израильтянам» возможен, но менее формально близок источнику.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Прямо передаёт продолжение повеления и сохраняет торжественный ритм законодательной речи.
- source_word: כִּי תָבֹאוּ
  choice: Когда вы войдёте
  rationale: כִּי здесь вводит ожидаемое будущее обстоятельство, а בוא с אֶל обозначает вступление в землю; «когда», а не «если», соответствует контексту обещанного дара.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: которую Я даю вам
  rationale: Причастие נֹתֵן представляет дарование земли как совершающееся и определённое действие Бога.
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: земля будет соблюдать субботу
  rationale: 'Передана персонификация земли: она не просто остаётся невозделанной, а совершает посвящённый Богу субботний покой. «Соблюдать субботу» естественно по-русски и сохраняет культово-заветный оттенок.'
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל передаёт направленность или посвящение субботнего покоя Богу; «для» звучит естественно и не устраняет эту смысловую связь. Имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господа
  rationale: В исходном тексте стоит личное заветное имя יהוה; транслитерация «Яхве» делает это явным и не смешивает имя с титулом.
- issue: Характер покоя земли
  choice: земля будет соблюдать субботу для Яхве
  alternative: земля будет покоиться в субботу Господню
  rationale: Выбранная формулировка сохраняет необычную персонификацию земли и связь однокоренных форм וְשָׁבְתָה и שַׁבָּת, не сводя предписание лишь к сельскохозяйственному бездействию.
translation_notes:
  register: Современный литературный русский язык с dignified законодательной интонацией. Синтаксис достаточно близок еврейскому, но устранён неестественный по-русски повтор «говори... и скажи». Слово «суббота» написано со строчной буквы по нормам русского языка; смысл установленного священного покоя сохраняется контекстом.
