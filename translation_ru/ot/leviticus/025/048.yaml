id: LEV.25.48
reference: Leviticus 25:48
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: ru
  text: 'После того как он будет продан, его можно выкупить: один из его братьев может выкупить его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: После того как он будет продан
  rationale: Временная конструкция указывает на положение человека после совершившейся продажи. Будущее время естественно для русского языка в контексте излагаемого закона.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: его можно выкупить
  rationale: 'Буквально: «выкуп будет ему». Русская безличная конструкция ясно передаёт сохраняющуюся возможность законного родственного выкупа, не превращая её в безусловное обещание.'
- source_word: אֶחָד מֵאֶחָיו
  choice: один из его братьев
  rationale: Сохранено буквальное мужское обозначение родства «один из его братьев»; дальнейшие стихи уточняют более широкий круг родственников.
- source_word: יִגְאָלֶנּוּ
  choice: может выкупить его
  rationale: Глагол גאל обозначает выкуп со стороны родственника. «Выкупить» естественно звучит в русском правовом контексте и сохраняет связь с существительным «выкуп».
theological_decisions:
- issue: Значение אֶחָיו в законе о родственнике-выкупщике
  choice: братьев
  alternative: родственников; родичей
  rationale: Основной текст сохраняет прямое значение мужского множественного числа и не расширяет обозначенный здесь круг лиц; следующие стихи отдельно называют других родственников.
- issue: Модальность גְּאֻלָּה תִּהְיֶה לּוֹ и יִגְאָלֶנּוּ
  choice: его можно выкупить; может выкупить
  alternative: ему полагается выкуп; выкупит его
  rationale: Контекст устанавливает доступность и право выкупа, но данный стих сам по себе не утверждает, что выкуп непременно состоится.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим оттенком. Повтор «выкупить» сохранён ради точности и связи двух частей стиха; архаичные «искупить» и «родич» не используются.
