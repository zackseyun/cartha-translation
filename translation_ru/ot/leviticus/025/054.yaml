source:
  edition: WLC
  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: ru
  text: Но если он не будет выкуплен таким образом[a], то в юбилейный год он выйдет на свободу — он и его сыновья вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этими способами» — то есть посредством выкупа, предусмотренного в предыдущих стихах.'
    reason: 'Лексическая альтернатива: בְּאֵלֶּה буквально означает «этими» и отсылает к ранее изложенным положениям.'
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Передаёт условное продолжение предыдущих предписаний и лёгкое противопоставление уже названным возможностям выкупа.
- source_word: יִגָּאֵל
  choice: будет выкуплен
  rationale: Нифаль глагола גאל здесь обозначает освобождение посредством предусмотренного законом родственного или денежного выкупа.
- source_word: בְּאֵלֶּה
  choice: таким образом
  rationale: Указательное выражение отсылает к способам выкупа, описанным в предшествующих стихах; примечание сохраняет возможность более буквального понимания.
- source_word: וְיָצָא
  choice: выйдет на свободу
  rationale: Буквально «выйдет»; в контексте зависимого служения речь идёт об освобождении. Добавление «на свободу» естественно раскрывает смысл еврейской правовой идиомы.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: в юбилейный год
  rationale: Устойчивое и понятное обозначение установленного законом юбилейного года.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: он и его сыновья вместе с ним
  rationale: Сохраняет самостоятельное местоимение הוּא и явно мужское בָנָיו, не расширяя значение до «детей».
theological_decisions:
- issue: Гендерно маркированное בָנָיו
  choice: сыновья
  alternative: дети
  rationale: Еврейский текст прямо употребляет форму мужского рода во множественном числе; перевод сохраняет её без нейтрализации.
- issue: Характер выхода в юбилейный год
  choice: выйдет на свободу
  alternative: выйдет
  rationale: Контекст показывает освобождение от зависимого служения; формулировка раскрывает правовой смысл, не добавляя основания или механизма освобождения, которого нет в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского контекста. Синтаксис условного предложения сделан естественным; тире подчёркивает совместный выход самого зависимого и его сыновей.
