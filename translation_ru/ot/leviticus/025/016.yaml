  terminology: '«Цена покупки» — допустимое контекстуальное раскрытие מִקְנָתוֹ. «Урожаи» хорошо передаёт תְּבוּאוֹת в данном контексте. Сноску следует исправить: её нынешняя альтернатива меняет синтаксические отношения и не является вариантом исходного выражения.'
