  register: Современный литературный русский язык с ясной нормативной формулировкой. Императив единственного числа сохраняет обращение еврейского текста. Параллелизм увеличения и уменьшения цены передан симметрично; подразумеваемый отсчёт до юбилейного года выражен словом «остаётся» для естественности и контекстуальной ясности.
