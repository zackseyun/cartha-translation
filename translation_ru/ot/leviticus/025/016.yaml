base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: ru
  text: Соразмерно большему числу остающихся лет увеличивай цену покупки, а соразмерно меньшему числу остающихся лет уменьшай цену покупки, потому что он продаёт тебе число урожаев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «число сборов урожая»; еврейское תְּבוּאוֹת может означать «урожаи», «плоды земли» или «сборы урожая».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי רֹב הַשָּׁנִים
  choice: если лет остаётся больше
  rationale: Идиома לְפִי выражает соразмерность, а רֹב הַשָּׁנִים — большее число лет. Добавленное «остаётся» естественно передаёт подразумеваемые годы до юбилея из ближайшего контекста.
- source_word: תַּרְבֶּה מִקְנָתוֹ
  choice: увеличь цену покупки
  rationale: Каузативная форма רבה требует повышения; מִקְנָה допускает значение покупки или покупной цены. В контексте расчёта по годам яснее всего «цена покупки».
- source_word: וּלְפִי מְעֹט הַשָּׁנִים
  choice: а если лет остаётся меньше
  rationale: Фраза симметрична первой половине стиха и обозначает меньшее число оставшихся лет.
- source_word: תַּמְעִיט מִקְנָתוֹ
  choice: уменьши цену покупки
  rationale: Каузативная форма מעט означает уменьшить; формулировка сохраняет параллелизм с «увеличь цену покупки».
- source_word: מִסְפַּר תְּבוּאֹת
  choice: определённое число урожаев
  rationale: מִסְפַּר обозначает исчисляемое количество, а תְּבוּאוֹת — урожаи, плоды или сборы. «Определённое число урожаев» ясно передаёт предмет сделки, не сводя слово только к одной сельскохозяйственной культуре.
- source_word: הוּא מֹכֵר לָךְ
  choice: он продаёт тебе
  rationale: Сохранены мужской род единственного числа и обычное настоящее значение причастия מֹכֵר.
