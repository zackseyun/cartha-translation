  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: ru
  text: Исполняйте Мои установления и соблюдайте Мои законы[a], исполняйте их[b] — и будете жить на земле[c] в безопасности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте употреблены два разных правовых термина: חֻקִּים — «установления, предписания» и מִשְׁפָּטִים — «законы, правовые нормы».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст повторяет глагол «исполнять»: буквально: «исполняйте Мои установления, соблюдайте Мои законы и исполняйте их».'
    reason: lexical_alternative
  - marker: c
    text: То есть на земле, обещанной Израилю.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: Мои установления
  rationale: «Установления» передаёт предписанный, законодательно закреплённый характер חֻקִּים и позволяет отличить этот термин от מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: Мои законы
  rationale: В данном правовом контексте «законы» естественно и понятно передаёт нормы и судебно-правовые предписания, обозначаемые מִשְׁפָּטִים, не сливая их полностью с «установлениями».
- source_word: תִּשְׁמְרוּ
  choice: соблюдайте
  rationale: В контексте заветных требований שׁמר означает не просто хранить или охранять, а внимательно соблюдать предписанное.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: исполняйте ... исполняйте их
  rationale: 'Сохранён повтор глагола עשה: он подчёркивает практическое исполнение как установлений, так и законов. По-русски повтор звучит ясно и уместно в торжественно-правовом контексте.'
- source_word: וִישַׁבְתֶּם
  choice: будете жить
  rationale: ישׁב здесь обозначает устойчивое проживание на земле. «Будете жить» естественнее для современного русского языка, чем более книжное «будете обитать».
- source_word: הָאָרֶץ
  choice: земле
  rationale: Определённая форма указывает на землю, о которой говорится в контексте завета, то есть на обещанную Израилю землю. Традиционное «земля» сохраняет эту библейскую связь.
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: בֶּטַח выражает состояние защищённости и отсутствия угрозы; «в безопасности» ясно и естественно передаёт этот смысл.
theological_decisions:
- issue: Связь послушания с безопасной жизнью на земле
  choice: 'Стих представлен как заветное обещание Израилю: соблюдение Божьих установлений и законов связано с безопасной жизнью на данной ему земле.'
  alternative: Обобщённое обещание личной безопасности или благополучия всем верующим независимо от заветного и исторического контекста.
  rationale: Еврейский текст непосредственно связывает послушание с проживанием на определённой земле. Перевод не расширяет это обещание за пределы указанного контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством заветно-правовой речи. Императивные формы передают предписывающую силу контекста, а будущее время во второй части — обещанный результат. Повтор «исполняйте» намеренно сохранён как риторическое усиление оригинала.
