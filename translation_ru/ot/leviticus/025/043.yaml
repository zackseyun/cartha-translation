  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: ru
  text: Не господствуй над ним с жестокостью[a], но бойся своего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с суровостью», «беспощадно». Еврейское слово означает суровое, подавляющее обращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: господствуй
  rationale: Глагол רדה означает «властвовать, господствовать». В данном правовом контексте эта передача сохраняет отношение власти и не сводит запрет лишь к принуждению к труду.
- source_word: בּוֹ
  choice: над ним
  rationale: Местоименный объект мужского рода единственного числа относится к израильтянину, находящемуся в долговом услужении; при глаголе «господствовать» по-русски естественно управление «над ним».
- source_word: בְּפָרֶךְ
  choice: жестоко
  rationale: Слово פָרֶךְ обозначает суровое, изнуряющее обращение или гнет. Наречие «жестоко» естественно сочетается с «господствовать», а примечание сохраняет возможные оттенки суровости и беспощадности.
- source_word: וְיָרֵאתָ
  choice: но бойся
  rationale: 'Союз ו формально означает «и», однако после запрета вводит смысловой контраст: вместо жестокого господства адресат должен бояться Бога. «Но» ясно передаёт эту связь, не добавляя нового содержания.'
- source_word: מֵאֱלֹהֶיךָ
  choice: своего Бога
  rationale: 'После ירא предлог מִן вводит объект страха; по-русски это естественно передаётся без предлога: «бояться Бога». Возвратное «своего» ясно соотносит принадлежность с адресатом и звучит естественнее, чем «твоего» при повелительном глаголе.'
theological_decisions:
- issue: Заключительная заповедь как нравственное основание запрета
  choice: «но бойся своего Бога»
  alternative: «и бойся своего Бога»
  rationale: 'Перевод сохраняет богословскую мысль текста: страх перед Богом ограничивает власть человека над ближним. Контрастный союз выражает этическую логику контекста, тогда как буквальное «и» оставляет связь менее явной.'
translation_notes:
  register: Современный литературный русский язык, краткий и достойный правового наставления. «Господствуй» сохраняет властную семантику оригинала; «жестоко» понятно широкому читателю. Местоимение мужского рода сохранено по ближайшему контексту.
