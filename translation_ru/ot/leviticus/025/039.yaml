  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: ru
  text: Если твой брат, живущий с тобой, обеднеет и продаст себя тебе[b], не принуждай его к рабскому труду[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не заставляй его служить службой раба».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и будет продан тебе». Еврейскую форму можно передать пассивно; в данном контексте речь идёт о продаже себя в долговое служение из-за бедности.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי יָמוּךְ
  choice: Если… обеднеет
  rationale: Условная конструкция естественно передаётся по-русски союзом «если»; глагол обозначает впадение в бедность.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохранён буквальный родственный термин, который в контексте означает соплеменника, не подменяя его толкованием в основном тексте.
- source_word: עִמָּךְ
  choice: рядом с тобой
  rationale: Передаёт положение обедневшего человека в сфере жизни и ответственности адресата; буквальное «с тобой» по-русски здесь менее ясно.
- source_word: וְנִמְכַּר לָךְ
  choice: и продаст себя тебе
  rationale: Форма нифаль допускает пассивное прочтение «будет продан», однако в данном правовом контексте выражение может обозначать самопродажу в долговое служение; неоднозначность отмечена сноской.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: не заставляй его трудиться
  rationale: Конструкция означает требование или использование труда другого человека; такая формулировка естественна в современном русском языке.
- source_word: עֲבֹדַת עָבֶד
  choice: как раба
  rationale: Кратко и ясно передаёт буквальное «работой раба», сохраняя социально-правовую силу запрета без эвфемизма.
theological_decisions:
- issue: Обозначение статуса и труда обедневшего соплеменника
  choice: «как раба»
  alternative: «работой раба»; «как слугу»
  rationale: Текст не запрещает всякое служение, но запрещает обращать соплеменника в положение раба и возлагать на него рабский труд. «Слуга» ослабило бы смысл социального статуса.
- issue: Залог формы וְנִמְכַּר
  choice: «продаст себя» с указанием варианта в сноске
  alternative: «будет продан»
  rationale: Контекст поддерживает самопродажу из-за бедности, но еврейская форма грамматически пассивна; сноска сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Тон сдержанный и достойный; родственный термин «брат» и резкое социальное обозначение «раб» сохранены.
