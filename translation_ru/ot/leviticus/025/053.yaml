  source_fidelity: Перевод точно передаёт сравнение כִּשְׂכִיר («как наёмный работник»), ежегодно-продолжающийся оттенок שָׁנָה בְּשָׁנָה («из года в год»), а также запрет жестокого господства. «Будет у него» — допустимое контекстуальное русское выражение для буквального «будет с ним/у него» и не добавляет глагола служения. Указательное «тот» во второй фразе обоснованно проясняет подразумеваемого хозяина как субъекта запрета в контексте, не меняя смысла.
  naturalness: Текст звучит естественно на современном литературном русском языке и сохраняет сжатый предписывающий характер стиха. «У тебя на глазах» — удачный идиоматичный эквивалент לְעֵינֶיךָ. Сочетание «властвовать над ним жестоко» несколько книжное, но уместно для правового регистра и ясно.
  terminology: «Наёмный работник» точно отличает שָׂכִיר от раба и соответствует современному употреблению. «Властвовать» и «жестоко» адекватно передают רדה и בְּפֶרֶךְ без конфессиональных или интерпретационных добавлений. Сноска корректно отмечает вариант порядка слов, не создавая ложной смысловой альтернативы.
