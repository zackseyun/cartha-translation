id: LEV.25.53
reference: Leviticus 25:53
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: ru
  text: Пусть он будет у него как наёмный работник, из года в год[a]. Пусть тот не властвует над ним жестоко у тебя на глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть он из года в год будет у него как наёмный работник».'
    reason: В еврейском тексте оборот «из года в год» допускает различное естественное присоединение в русском предложении; смысл ежегодно сохраняющегося положения остаётся тем же.
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: как наёмный работник
  rationale: Префикс כְּ выражает сравнение, а שָׂכִיר обозначает нанятого за плату работника, а не раба. Такой перевод точен и естественен для современного русского языка.
- source_word: שָׁנָה בְּשָׁנָה
  choice: из года в год
  rationale: Еврейское сочетание имеет распределительно-временной смысл и указывает на ежегодно сохраняющийся статус.
- source_word: יִהְיֶה עִמּוֹ
  choice: будет у него
  rationale: Глагол буквально означает «будет с ним». В данном контексте русское «будет у него» естественно передаёт отношения работника и хозяина, не добавляя прямо не выраженного глагола «служить».
- source_word: לֹא יִרְדֶּנּוּ
  choice: не властвует над ним
  rationale: רדה означает властвовать или господствовать. «Властвовать» сохраняет смысл осуществления власти и не сужает его до одного лишь принуждения к труду.
- source_word: בְּפֶרֶךְ
  choice: жестоко
  rationale: Слово обозначает суровое, безжалостное обращение, особенно в условиях подневольного труда. Наречие естественно сочетается с «властвовать».
- source_word: לְעֵינֶיךָ
  choice: у тебя на глазах
  rationale: Это идиоматичный русский эквивалент буквального «перед твоими глазами», сохраняющий смысл видимого, допускаемого в присутствии адресата обращения.
theological_decisions:
- issue: Положение израильтянина у хозяина-иноплеменника
  choice: Его положение представлено через сравнение с наёмным работником, а не названо рабством.
  alternative: «Как наёмный слуга» или формулировка, прямо называющая его рабом.
  rationale: В стихе употреблено שָׂכִיר — «наёмный работник», и именно с ним сравнивается защищённое законом временное положение израильтянина. При этом более широкий контекст зависимого служения не отрицается.
- issue: Субъект запрета во второй части стиха
  choice: Добавлено указательное «тот», отсылающее к хозяину.
  alternative: «Он не должен властвовать над ним…»
  rationale: 'Еврейские местоименные формы допускают понятную из контекста смену референта: находящийся у хозяина израильтянин — объект, хозяин — субъект запрета. «Тот» делает синтаксис ясным, не добавляя богословского толкования.'
translation_notes:
  register: Современный литературный русский язык с достоинством правового предписания. «Пусть» передаёт предписывающие формы, «наёмный работник» избегает устаревшего и потенциально неточного «наёмник», а «у тебя на глазах» звучит естественно и сохраняет обращение к одному адресату.
