  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: ru
  text: Но если у него не найдётся достаточно средств, чтобы выкупить его, то проданное им останется у купившего его до юбилейного года. В юбилей оно выйдет из владения покупателя, а продавший вернётся в свой наследственный удел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «и оно вернётся в его наследственное владение». Последний еврейский глагол допускает понимание проданного имущества, а не продавца, как подлежащего.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ דֵּי
  choice: у него не найдётся достаточно средств
  rationale: Еврейская идиома буквально говорит, что «его рука не найдёт достаточно». В современном русском буквальная калька не вполне ясна; передача через «средства» естественно выражает способность выкупить землю.
- source_word: הָשִׁיב לוֹ
  choice: возвратить покупателю
  rationale: В контексте выкупа речь о внесении надлежащей суммы тому, кто купил участок. Дополнение «покупателю» проясняет местоимение לוֹ из контекста, не сводя выражение исключительно к общему понятию долга.
- source_word: מִמְכָּרוֹ
  choice: проданное им
  rationale: Существительное может обозначать продажу или проданное имущество; последующие слова о нахождении у покупателя до юбилея указывают здесь на проданный участок.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: в руках купившего
  rationale: Сохранён образ «в руке», обозначающий владение и контроль; русское множественное «в руках» является естественным соответствием этой юридической идиомы.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: юбилейного года
  rationale: Это ясная и устоявшаяся передача названия установленного законом юбилейного года.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: В юбилей оно выйдет из его владения
  rationale: Глагол יצא передан основным значением «выйдет», а добавление «из его владения» делает по-русски ясным подразумеваемое прекращение владения покупателя, не заменяя образ более толковательным «будет возвращено».
- source_word: לַאֲחֻזָּתוֹ
  choice: в свой наследственный удел
  rationale: אֲחֻזָּה в земельном законодательстве означает закреплённое за родом наследственное владение. «Наследственный удел» точнее контекстуально, чем общее «имущество».
theological_decisions:
- issue: Подлежащее при וְשָׁב в заключительной фразе
  choice: 'Продавший — подлежащее: «продавший вернётся в свой наследственный удел»'
  alternative: 'Проданное имущество — подлежащее: «оно вернётся в его наследственное владение»'
  rationale: Форма мужского рода единственного числа грамматически допускает отнесение как к прежнему владельцу, так и к проданному владению. Личный субъект хорошо согласуется с формулой юбилейного возвращения человека к своему уделу (ср. Лев 25:10, 13), однако подлинная синтаксическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством юридико-заветного текста. Умеренно сохранена исходная образность («в руках», «выйдет»), но неестественная калька «его рука не найдёт» заменена прозрачной русской идиомой. Термин «наследственный удел» подчёркивает земельно-родовой смысл אֲחֻזָּה.
