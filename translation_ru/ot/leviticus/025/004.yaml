revisions:
- from: Но в седьмой год земля должна покоиться полным субботним покоем[a] — это суббота в честь Яхве. Не засевай своего поля и не обрезай своего виноградника.
  to: Но в седьмой год для земли будет суббота — суббота полного покоя, посвящённая Яхве. Не засевай своё поле и не обрезай свой виноградник.
  rationale: Перевод перестроен, чтобы точнее передать еврейское «будет для земли» и естественно выразить усиленную формулу «суббота, суббота полного покоя». «Посвящённая Яхве» сохраняет посвящение, выраженное предлогом ל, без конфессионального уточнения. Сноска обновлена в соответствии с исправленной синтаксической формой.
