review_pass:
  verdict: revise
  source_fidelity: 'Смысл запретов и имя Яхве переданы верно. Однако исходное «для земли будет суббота, суббота полного покоя» точнее, чем формулировка, где земля сама «должна покоиться»: последняя допустимо передаёт смысл, но сглаживает конструкцию לָאָרֶץ и делает «полным субботним покоем» неестественным инструментальным оборотом.'
  naturalness: «Земля должна покоиться полным субботним покоем» звучит тяжеловесно и не вполне естественно по-русски. Перестройка с «для земли будет» сохраняет смысл оригинала и звучит как современная законодательная речь.
  terminology: «Яхве» согласуется с указанным богословским решением. «Посвящённая Яхве» передаёт посвятительное значение שַׁבָּת לַיהוָה точнее и естественнее, чем несколько расплывчатое «в честь Яхве». Сочетание «суббота полного покоя» сохраняет повтор и усиление שַׁבַּת שַׁבָּתוֹן.
  issues:
  - severity: medium
    issue: Неестественная и менее точная передача конструкции о покое земли
    rationale: Оборот «земля должна покоиться полным субботним покоем» заменяет конструкцию «будет для земли» активным описанием земли и создаёт тяжеловесный инструментальный оборот. Следует сохранить, что суббота-покой предназначена для земли.
  - severity: low
    issue: «В честь Яхве» несколько ослабляет посвятительное значение
    rationale: Предлог ל в שַׁבָּת לַיהוָה обозначает принадлежность или посвящение Яхве; «посвящённая Яхве» выражает это яснее, не добавляя толкования.
  - severity: low
    issue: Сноска грамматически привязана к прежнему инструментальному обороту
    rationale: После исправления основного текста альтернативу следует оформить как именительную группу, соответствующую «субботе полного покоя».
  revised_text: Но в седьмой год для земли будет суббота — суббота полного покоя, посвящённая Яхве. Не засевай своё поле и не обрезай свой виноградник.
