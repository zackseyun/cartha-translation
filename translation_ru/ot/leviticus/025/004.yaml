base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: ru
  text: Но в седьмой год для земли будет суббота — суббота полного покоя, посвящённая Яхве. Не засевай своё поле и не обрезай свой виноградник.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: Но в седьмой год
  rationale: Союз ו в контексте противопоставляет седьмой год шести годам земледельческих работ, поэтому естественно передан русским «но».
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: полным субботним покоем
  rationale: Сочетание однокоренных существительных усиливает значение прекращения работ; перевод сохраняет и понятие субботы, и эмфатическую силу выражения.
- source_word: יִהְיֶה לָאָרֶץ
  choice: земля должна покоиться
  rationale: Еврейская конструкция буквально говорит, что покой будет «для земли»; по-русски активная формулировка естественно представляет землю получающей этот покой, а модальное «должна» уместно в законодательном контексте.
- source_word: שַׁבָּת לַיהוָה
  choice: суббота в честь Яхве
  rationale: Предлог ל обозначает посвящённость; «в честь» ясно передаёт, что этот покой посвящён Яхве, не превращая его в принадлежность.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаётся личное заветное имя יהוה, а не замещающий титул.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: Не засевай своего поля
  rationale: Прямой и естественный русский запрет во втором лице единственного числа; זרע в данном земледельческом контексте означает засевать.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: и не обрезай своего виноградника
  rationale: זמר применительно к винограднику означает обрезку лоз; повторная отрицательная форма сохраняет параллелизм двух запретов.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Значение посвящения в שַׁבָּת לַיהוָה
  choice: суббота в честь Яхве
  alternative: суббота для Яхве
  rationale: Формулировка выражает посвящённость покоя Богу, не уточняя сверх текста, каким именно образом эта посвящённость понимается.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Единственное число в повелениях сохранено. Термин «субботний» удерживает словесную связь שַׁבַּת שַׁבָּתוֹן, а сноска отмечает возможный оттенок торжественности.
