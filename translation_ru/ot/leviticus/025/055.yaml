  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: ru
  text: Ибо сыны Израиля — Мои рабы; они Мои рабы, которых Я вывел из земли Египта. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание для предшествующего установления; русский оборот ясно передаёт причинно-пояснительную связь.
- source_word: לִי ... עֲבָדִים
  choice: Мои рабы
  rationale: Сочетание предлога принадлежности с существительным подчёркивает, что израильтяне принадлежат Яхве; «рабы» сохраняет связь с правовым контекстом зависимого состояния.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет семейно-корпоративный образ и грамматическую форму еврейского выражения, оставаясь понятным в библейском литературном регистре.
- source_word: עֲבָדַי הֵם
  choice: они Мои рабы
  rationale: Дословное повторение ключевого существительного передаёт эмфатическое утверждение исключительной принадлежности Израиля Яхве.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: которых Я вывел
  rationale: Форма Hiphil глагола יצא означает причинное действие «вывел» и сохраняет устойчивый мотив исхода.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Естественная для русского библейского регистра передача устойчивой формулы исхода без потери значения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Прямо и естественно передаёт форму множественного числа притяжательного суффикса в заветной формуле.
theological_decisions:
- issue: Передача עבד в контексте юбилейного законодательства и принадлежности Яхве
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет правовую и принадлежностную силу термина и контраст с человеческими хозяевами. При этом текст не отождествляет древнеизраильскую зависимость со всеми позднейшими формами рабства.
- issue: Корпоративное выражение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбор сохраняет исходную семейную метафору и мужскую форму корпоративного обозначения, не исключая женщин из обозначаемого народа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм и повтор «Мои рабы» сохранены ради смыслового ударения оригинала; личное имя יהוה передано как «Яхве».
