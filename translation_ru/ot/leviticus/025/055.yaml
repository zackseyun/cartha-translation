  terminology: '«Яхве», «сыны Израиля», «рабы» и «ваш Бог» последовательны и соответствуют исходному тексту. Повтор «Мои рабы» следует сохранить как значимый акцент. Сноски не требуются: в русском тексте нет неразмеченных утверждений, нуждающихся в пояснении.'
