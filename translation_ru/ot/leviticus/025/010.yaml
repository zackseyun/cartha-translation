  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: ru
  text: 'Освятите пятидесятый год и провозгласите освобождение в стране для всех её жителей. Он будет для вас юбилейным годом[a]: каждый из вас возвратится в своё владение[b], и каждый из вас возвратится к своему роду[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «йовел»; здесь это обозначение особого пятидесятого года.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в своё наследственное владение»; речь прежде всего о родовом земельном наделе.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к своей семье»; еврейское слово может обозначать как семью, так и более широкий родственный круг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: освятите
  rationale: Порода пиэль глагола קדשׁ означает объявить или сделать священным, посвятить Богу. «Освятите» сохраняет сакральный смысл и естественно звучит в русском библейском законодательном контексте.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: пятидесятый год
  rationale: Еврейская числовая конструкция идиоматически обозначает порядковое число.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: провозгласите освобождение
  rationale: דְּרוֹר обозначает официально объявляемое освобождение, связанное здесь с юбилейным восстановлением личной свободы и земельных прав. «Освобождение» точнее передаёт юридическое действие, чем более абстрактная «свобода».
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: в стране для всех её жителей
  rationale: Предлог ב передаёт местонахождение — «в стране», а ל обозначает тех, в чью пользу провозглашается освобождение.
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: Он будет для вас юбилейным годом
  rationale: В Левите 25 יוֹבֵל является техническим обозначением особого года, а не просто бараньего рога. Добавление «годом» в русском устраняет неясность рода местоимения и явно связывает определение с пятидесятым годом.
- source_word: אִישׁ
  choice: каждый из вас
  rationale: Именительное אִישׁ употреблено дистрибутивно внутри обращения во втором лице множественного числа. «Каждый из вас» естественно передаёт эту функцию, не превращая грамматически мужскую форму в утверждение только о мужчинах.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: в своё наследственное владение
  rationale: אֲחֻזָּה в данном земельно-правовом контексте означает закреплённый за семьёй, прежде всего наследственный, земельный надел или владение. Формулировка отражает это точнее, чем общее «собственность».
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: к своему роду
  rationale: מִשְׁפָּחָה здесь может обозначать не только ближайшую семью, но и более широкую родственную группу. «Род» сохраняет социально-правовой оттенок древнеизраильского контекста.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: возвратится ... к своему роду
  rationale: Смысл повторяющегося שוב сохранён в единой конструкции с общим сказуемым «возвратится»; русский эллипсис во второй части избегает тяжеловесности, сохраняя параллелизм двух направлений возвращения.
theological_decisions:
- issue: Объём юбилейного דְּרוֹר
  choice: освобождение
  alternative: свобода; отпущение
  rationale: Перевод сохраняет юридически оформленный характер юбилейного освобождения, не ограничивая его только освобождением рабов и не наделяя термин позднейшими богословскими значениями.
- issue: Значение יוֹבֵל
  choice: юбилейный год
  alternative: юбилей; год трубного звука
  rationale: В контексте главы слово обозначает установленный пятидесятый год восстановления; этимология или связь с рогом не должна вытеснять контекстуальное значение.
- issue: Дистрибутивное אִישׁ
  choice: каждый из вас
  alternative: каждый мужчина; каждый человек
  rationale: Форма мужского рода имеет дистрибутивную функцию в обращении к общине. Выбранный вариант передаёт индивидуальную обязанность адресатов, не решая сверх текста вопрос о точном круге юридических владельцев.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Повелительные формы естественно передают еврейские формы с вавом и перфектом в нормативном предписании. Сохранены параллелизм, обращение во множественном числе и смысл индивидуального возвращения; синтаксис слегка уплотнён ради естественного русского звучания.
