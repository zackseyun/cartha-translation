  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: ru
  text: тогда он должен рассчитать годы, прошедшие со времени продажи, возвратить остаток[a] тому человеку, которому он продал её, и вернуться в своё земельное владение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «излишек». Имеется в виду сумма, оставшаяся после расчёта стоимости ещё не прошедших лет.'
    reason: lexical_alternative
  - marker: b
    text: То есть в своё земельное владение. Вероятно, речь идёт о родовом наделе в Израиле.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: тогда пусть он рассчитает
  rationale: Глагол חשב обозначает расчёт выкупной суммы; «тогда» естественно передаёт последовательность предписанных действий, а конструкция «пусть» — нормативный характер закона.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: годы, прошедшие со времени продажи
  rationale: Буквально выражение говорит о «годах его/её продажи», но в данном порядке выкупа имеются в виду годы, истекшие после продажи земли. Формулировка передаёт этот контекстуальный смысл без двусмысленности в русском.
- source_word: וְהֵשִׁיב
  choice: возвратит
  rationale: Hифиль от שוב здесь означает вернуть или возместить причитающуюся сумму; «возвратит» сохраняет смысловую связь с последующим וְשָׁב.
- source_word: הָעֹדֵף
  choice: остаток
  rationale: Субстантивированная форма от עודף обозначает сумму, остающуюся после расчёта стоимости неиспользованных лет. «Остаток» естественнее в современном русском финансово-правовом контексте, чем «излишек».
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: тому человеку, которому продал её
  rationale: Сохраняется личное обозначение «человеку», а добавленное местоимение «её» естественно указывает на проданную землю из контекста.
- source_word: וְשָׁב
  choice: и вернётся
  rationale: Qal от שוב обозначает возвращение прежнего владельца после выкупа; будущее совершенного вида соответствует последовательности юридического предписания.
- source_word: לַאֲחֻזָּתוֹ
  choice: в своё владение
  rationale: אֲחֻזָּה в законодательстве Левита означает земельное, обычно родовое владение. «Владение» сохраняет юридический оттенок; культурно-правовая специфика пояснена в сноске.
theological_decisions:
- issue: Характер אֲחֻזָּה в законах юбилейного года
  choice: в своё владение
  alternative: в своё родовое владение; к своей собственности
  rationale: Термин обозначает не любую собственность, а закреплённый за семьёй земельный надел в Израиле. Основной текст не делает подразумеваемую родовую составляющую явно выраженной, а сноска сохраняет важный культурно-богословский фон.
translation_notes:
  register: Современный литературный русский язык с ясным юридико-предписывающим строем. Повтор корня שוב по возможности отражён словами «возвратит» и «вернётся». Местоимение «её» относится к проданной земле из ближайшего контекста.
