  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: ru
  text: Не притесняйте своего ближнего[a], но бойся Бога твоего, ибо Я — Яхве, Бог ваш.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обижайте», «не поступайте несправедливо со своим ближним» или «не используйте его в своих интересах». Еврейский глагол может означать несправедливое обращение с другим человеком или получение выгоды за его счёт, особенно в общественных и хозяйственных отношениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: не притесняйте
  rationale: В данном правовом и хозяйственном контексте глагол ינה в породе хифиль означает причинять ущерб другому, несправедливо с ним поступать или пользоваться его уязвимостью. «Притеснять» передаёт серьёзность запрета, не сужая его исключительно до финансового обмана.
- source_word: אִישׁ אֶת־עֲמִיתוֹ
  choice: друг друга
  rationale: 'Буквально сочетание имеет распределительный смысл: «каждый — своего соплеменника/ближнего». Естественное русское «друг друга» сохраняет взаимную обязанность членов общины, не вводя отсутствующего в тексте ограничения по полу.'
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: но бойся Бога твоего
  rationale: После ירא предлог מן обозначает объект страха и по-русски отдельно не передаётся. Союз ו выражен как «но», поскольку повеление бояться Бога противопоставлено притеснению ближнего. Единственное число «бойся… твоего» сохранено вслед за еврейским текстом.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание заповеди; «ибо» сохраняет причинное значение и соответствует достоинству законодательной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, а не заменяющий его титул. Форма «Яхве» является общепринятой русской научной транслитерацией тетраграмматона.
- source_word: אֱלֹהֵיכֶם
  choice: Бог ваш
  rationale: Множественное местоименное окончание обращено ко всей общине; форма «ваш» сохраняет это число и одновременно подчёркивает заветное отношение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» сохраняет его как имя, тогда как «Господь» заменяет имя титулом, а «Иегова» отражает более позднее смешанное чтение.
- issue: Смена числа в обращении
  choice: Сохранены единственное число в «бойся Бога твоего» и множественное в «Бог ваш»
  alternative: 'Согласовать всё обращение во множественном числе: «бойтесь Бога вашего… Бог ваш»'
  rationale: Еврейский текст намеренно или стилистически переходит от общины во множественном числе к отдельному израильтянину в единственном, а затем снова к общине. Сохранение этой смены не устраняет подлинную особенность текста.
- issue: Круг лиц, обозначенный עֲמִית
  choice: друг друга
  alternative: своего ближнего; своего соплеменника
  rationale: В левитском правовом контексте слово прежде всего обозначает другого члена общины. «Друг друга» естественно передаёт взаимную обязанность, не расширяя явно и не сужая догматически область применения заповеди.
translation_notes:
  register: Современный литературный русский с кратким, торжественным строем законодательной речи. Необычная смена множественного числа («не притесняйте», «Бог ваш») на единственное («бойся Бога твоего») сохранена как особенность исходного текста. Маркер [a] помещён непосредственно после выражения, к которому относится примечание.
