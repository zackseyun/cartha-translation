revisions:
- from: то Я пошлю вам Моё благословение в шестой год, и он принесёт урожай на три года.
  to: Тогда Я повелю, чтобы в шестой год Моё благословение пришло к вам, и оно даст урожай на три года.
  rationale: 'Исправление восстанавливает повелительный смысл צוה и заменяет неудачную русскую связь «год ... принесёт урожай» на естественную связь обещанного благословения с урожаем. Глагол «пришло» — необходимая русская экспликация при конструкции «повелю, чтобы», не уточняющая способ действия сверх контекста. Сноска не требуется: «урожай» достаточно точно и естественно передаёт תבואה, а английская сноска не отражает текстологической или смысловой неопределённости, нуждающейся в передаче по-русски.'
