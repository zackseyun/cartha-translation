  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: ru
  text: Тогда Я повелю, чтобы в шестой год Моё благословение пришло к вам, и оно даст урожай на три года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: то Я пошлю
  rationale: Глагол буквально означает «повелю». В сочетании с «благословением» современное русское «пошлю» естественно передаёт действенное Божье распоряжение; частица «то» связывает обещание с вопросом предыдущего стиха.
- source_word: בִּרְכָתִי
  choice: Моё благословение
  rationale: Сохраняет широкое значение дарованного Богом благоволения, конкретный земледельческий результат которого раскрыт далее.
- source_word: לָכֶם
  choice: вам
  rationale: Передаёт значение адресата и получателя благословения.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: в шестой год
  rationale: Прямая и естественная передача временного оборота в рамках семилетнего цикла.
- source_word: וְעָשָׂת
  choice: и он принесёт
  rationale: Форма женского рода допускает связь с «годом» в древнееврейском, где слово «год» женского рода. По-русски местоимение согласовано с мужским родом слова «год»; «принесёт урожай» — естественное земледельческое выражение.
- source_word: הַתְּבוּאָה
  choice: урожай
  rationale: Слово обозначает сельскохозяйственную продукцию, урожай; русский эквивалент ясен и стилистически уместен.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: на три года
  rationale: Передаёт, что урожая будет достаточно для обеспечения в течение трёх лет, не добавляя отдельного пояснительного слова «достаточный».
theological_decisions:
- issue: Характер обещанного благословения
  choice: Бог целенаправленно пошлёт благословение, которое даст необычайно обильный урожай
  alternative: Общее утверждение о Божьем провидении
  rationale: Первое лицо «Я» и глагол צוה представляют плодородие как особое действенное Божье распоряжение, а не как описание обычного хода природы.
- issue: К чему относится подлежащее וְעָשָׂת
  choice: 'к шестому году: «он принесёт урожай»'
  alternative: 'к благословению: «оно даст урожай»'
  rationale: Форма женского рода грамматически может соотноситься с древнееврейским словом «год» (שנה, женский род), тогда как «благословение» (ברכה) также женского рода. Смысл допускает обе связи; выбранная передача естественна в контексте урожая шестого года и не меняет богословского содержания.
translation_notes:
  register: 'Современный литературный русский язык; формулировка краткая, торжественная и понятная. Прописные местоимения при обращении к Богу соответствуют принятому русскому библейскому регистру. Сноска не требуется: предложенная в английском слое сноска стоит после «sixth year», но её содержание относится к слову «crop/yield», а русское «урожай» уверенно и естественно охватывает значение תבואה.'
