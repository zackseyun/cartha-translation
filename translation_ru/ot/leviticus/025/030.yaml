  source_fidelity: 'Основной текст обоснованно следует масоретскому чтению (qere) לוֹ («у которого есть стена»), а ketiv לֹא («нет») прозрачно отмечен в сноске. Это соответствует непосредственному контексту Лев 25:29–31, где дома в обнесённых стеной городах противопоставлены поселениям без стены. Юридическая последовательность передана точно: при невыкупе в течение полного года дом окончательно закрепляется за покупателем и не выходит в юбилейный год.'
  naturalness: Русский текст естественен, ясен и выдержан в современном литературном, умеренно официальном регистре. Обороты «до истечения полного года», «навсегда останется за купившим его» и «в юбилейный год» хорошо подходят к законодательному контексту.
  terminology: «Выкуплен», «купивший его» и «юбилейный год» последовательно и понятно передают юридическую терминологию главы. «Из поколения в поколение» адекватно выражает לְדֹרֹתָיו. Сноска b корректно поясняет юридический смысл идиомы «не выйдет».
