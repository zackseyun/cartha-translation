id: LEV.25.30
reference: Leviticus 25:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: ru
  text: Но если дом не будет выкуплен до истечения полного года, то дом в городе, обнесённом стеной[a], навсегда останется за купившим его, из поколения в поколение; в юбилейный год он не возвращается прежнему владельцу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте написано «в городе, у которого нет стены», но по традиционному масоретскому чтению: «в городе, у которого есть стена». Последнее чтение соответствует противопоставлению в стихах 29–31.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «он не выйдет в юбилей». То есть дом не освобождается от права покупателя и не возвращается прежнему владельцу в юбилейный год.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: будет выкуплен
  rationale: Нифаль глагола גאל в данном законе обозначает выкуп проданной собственности. «Будет выкуплен» естественно передаёт юридическое действие и сохраняет связь с тематикой выкупа в Лев 25.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: до истечения полного года
  rationale: Оборот устанавливает предельный срок выкупа — завершение полного годового периода. Русская формулировка передаёт срок естественно, не уточняя сверх текста, от какого именно события он исчисляется.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: навсегда останется
  rationale: Буквально וְקָם означает «встанет, устоит», но в юридическом контексте вместе с לַצְּמִיתֻת указывает, что право покупателя становится постоянным и неотменяемым.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לוֹ חֹמָה (קרי)
  choice: дом в городе, обнесённом стеной
  rationale: 'Перевод следует масоретскому чтению (qere) לוֹ, подтверждаемому контекстом ст. 29–31: речь идёт о доме в городе со стеной. Более буквальное «у которого есть стена» по-русски тяжеловесно.'
- source_word: לַקֹּנֶה אֹתוֹ
  choice: за купившим его
  rationale: Причастие קֹנֶה обозначает покупателя; конструкция «останется за» естественно выражает закрепление собственности в русском юридическом повествовании.
- source_word: לְדֹרֹתָיו
  choice: из поколения в поколение
  rationale: Фраза указывает на непрерывное владение в роду покупателя. Русский оборот сохраняет идею последовательных поколений, не сводя её только к непосредственным потомкам.
- source_word: לֹא יֵצֵא בַּיֹּבֵל
  choice: в юбилейный год он не возвращается прежнему владельцу
  rationale: Буквально дом «не выйдет» в юбилей, но в имущественном законе это значит, что он не освобождается и не возвращается прежнему владельцу. Смысловой перевод устраняет неясную для современного читателя кальку.
- source_word: יּוֹבֵל
  choice: юбилейный год
  rationale: В контексте Лев 25 это установленный год освобождения и восстановления имущественных прав; полная форма «юбилейный год» яснее обычному русскому читателю, чем одно слово «юбилей».
theological_decisions:
- issue: Юридическая сила продажи дома в городе, обнесённом стеной
  choice: Если дом не выкуплен в течение полного года, он окончательно закрепляется за покупателем и его родом и не возвращается в юбилейный год.
  alternative: Передать וְקָם буквально как «дом устоит», не разъясняя юридического результата.
  rationale: Сочетание וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו и לֹא יֵצֵא בַּיֹּבֵל ясно указывает на постоянное закрепление права собственности, в отличие от правил возврата другой недвижимости.
- issue: Масоретское написание לא и чтение לוֹ
  choice: 'В основном тексте следовать qere לוֹ: город «обнесён стеной».'
  alternative: 'Следовать ketiv לא: город «не имеет стены».'
  rationale: Масоретская традиция явно предлагает читать לוֹ, а противопоставление домов в городах со стеной (ст. 29–30) и поселений без стены (ст. 31) подтверждает это чтение. Расхождение сохраняется в примечании, а не замалчивается.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным тоном, соответствующим законодательному контексту. Юридический смысл выражен ясно, но без архаических оборотов; текстологическая неоднозначность ketiv/qere вынесена в примечание.
