base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: ru
  text: Но дома в селениях, не окружённых стеной, считаются сельской землёй[a]. Для них действует право выкупа, а в юбилейный год они подлежат возврату[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «считается как поле земли»; то есть в правовом отношении эти дома рассматриваются как сельская земля, а не как дома в укреплённом городе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а в юбилей он выйдет». В юридическом контексте это означает, что имущество выходит из владения покупателя и подлежит возврату в юбилейный год.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: Но дома в селениях
  rationale: חֲצֵרִים обозначает сельские поселения или селения; отсутствие стены отдельно выражено следующим определительным оборотом.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: не окружённых стеной
  rationale: Естественно передаёт отсутствие стены вокруг поселений, сохраняя противопоставление укреплённым городам.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: приравниваются к полям этой земли
  rationale: 'Глагол выражает юридическое причисление: такие дома рассматриваются по правилам сельской земли. Множественное число по-русски согласовано с «дома».'
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: Для них действует право выкупа
  rationale: Формулировка ясно передаёт юридическую возможность выкупить отчуждённую собственность; русский предлог и местоимение согласованы с множественным «дома».
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: а в юбилейный год они возвращаются прежним владельцам
  rationale: Буквально имущество «выходит»; в данном правовом контексте это означает его освобождение от владения покупателя и возврат прежнему владельцу. Необычная исходная идиома отмечена в сноске.
theological_decisions:
- issue: Кому возвращаются дома в юбилейный год
  choice: прежним владельцам
  alternative: они выходят / освобождаются
  rationale: Контекст законов о юбилее показывает юридический возврат отчуждённого имущества. Сноска сохраняет буквальную формулировку и не скрывает способ выражения в еврейском тексте.
