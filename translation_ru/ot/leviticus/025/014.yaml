source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: ru
  text: Если вы продаёте что-либо своему ближнему или покупаете у своего ближнего, не поступайте несправедливо друг с другом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не притесняйте друг друга»; глагол может означать несправедливо обходиться с другим или пользоваться им в своих интересах, особенно при торговой сделке. Буквально: «пусть никто не притесняет своего брата».'
    reason: Лексическая неоднозначность глагола ינה и буквальная форма распределительно-взаимного запрета.
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: В правовом контексте вводит условный случай; русское «если» естественно передаёт условное значение, а начальное ו не требует отдельного «и».
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: будете продавать что-либо
  rationale: Сочетание глагола и однокоренного существительного обозначает продажу товара или предмета; такой перевод точен и естествен по-русски.
- source_word: לַעֲמִיתֶךָ / עֲמִיתֶךָ
  choice: своему соплеменнику
  rationale: עָמִית обозначает члена того же сообщества. «Соплеменник» сохраняет общинно-правовой смысл и отличает это слово от последующего אָח.
- source_word: אוֹ קָנֹה מִיַּד
  choice: или покупать у
  rationale: Инфинитив абсолютный координируется с предыдущей личной формой; идиома «из руки» в данном обороте означает приобретение у кого-либо и естественно передаётся русским «покупать у».
- source_word: אַל תּוֹנוּ
  choice: не обижайте
  rationale: В коммерческом контексте ינה означает причинять ущерб, поступать несправедливо или пользоваться чужой слабостью. «Не обижайте» сохраняет более широкую семантику глагола, не сводя её исключительно к завышению цены.
- source_word: אִישׁ אֶת־אָחִיו
  choice: друг друга
  rationale: Буквально «каждый своего брата»; русское взаимное выражение естественно передаёт распределительно-взаимный смысл конструкции. Связь с братской солидарностью сообщества пояснена в сноске.
theological_decisions:
- issue: Объём запрета תונו в контексте торговли
  choice: не обижайте друг друга
  alternative: не обманывайте / не притесняйте друг друга
  rationale: Контекст указывает прежде всего на несправедливость в сделках, однако глагол шире прямого обмана и может обозначать причинение ущерба или использование другого в своих интересах. Основной текст сохраняет эту широту, а сноска уточняет коммерческое применение.
- issue: Мужские формы אִישׁ и אָחִיו
  choice: друг друга
  alternative: каждый своего брата
  rationale: В данной законодательной формуле мужские формы имеют представительно-взаимное значение. Русское «друг друга» передаёт действие между членами общины, не превращая «брата» в указание только на родного брата.
translation_notes:
  register: Современный литературный русский язык с ясным правовым оттенком. «Соплеменник» передаёт принадлежность к одной общине; «друг друга» естественно воспроизводит взаимный смысл еврейской конструкции. Сноска сохраняет буквальный образ «брата» и уточняет коммерческий контекст.
