  text: וּ/בְ/כֹ֖ל אֶ֣רֶץ אֲחֻזַּתְ/כֶ֑ם גְּאֻלָּ֖ה תִּתְּנ֥וּ לָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: ru
  text: Во всей земле, находящейся в вашем владении[a], предоставляйте право выкупа земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеется в виду земельное владение, полученное в удел в Израиле.
    reason: cultural_note
  - marker: b
    text: 'Или: «допускайте выкуп земли». Буквально: «давайте земле выкуп».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל
  choice: И по всей
  rationale: Сочетание союза, предлога и כֹּל вводит общее правило. В русском юридическом контексте «по всей» естественно выражает распространение нормы на всю указанную территорию.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: земле, которой вы владеете
  rationale: אֶרֶץ здесь означает земельную территорию, а אֲחֻזָּה — закреплённое земельное владение в рамках удела Израиля. Такая формулировка понятна современному читателю и не сводит выражение к отвлечённой собственности.
- source_word: גְּאֻלָּה
  choice: право выкупа
  rationale: В данном земельно-правовом контексте существительное обозначает возможность возвращения отчуждённой земли посредством выкупа. «Право выкупа» яснее простого «выкуп», но альтернативное более буквальное понимание отмечено в сноске.
- source_word: תִּתְּנוּ
  choice: предоставляйте
  rationale: Буквально глагол означает «давайте». В сочетании с правовой возможностью выкупа русское «предоставляйте» естественно передаёт предписание, не делая его однократным действием.
- source_word: לָאָרֶץ
  choice: земли
  rationale: Дательный оборот при גְּאֻלָּה и נתן по-русски естественно передаётся зависимым родительным в выражении «право выкупа земли».
theological_decisions:
- issue: Характер предписания о родовой земле
  choice: Предписание требует обеспечивать право выкупа земли во всех земельных владениях Израиля.
  alternative: 'Более буквально: «давайте земле выкуп», без явного указания на юридическое право.'
  rationale: Контекст Левита 25 говорит о возвращении проданной земли, однако формулировка не должна привносить позднейшие богословские значения понятия «искупление».
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного предписания. Выбрано «право выкупа», чтобы ясно передать земельно-правовой смысл גְּאֻלָּה; буквальная конструкция сохранена в сноске.
