  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: ru
  text: Это юбилей; для вас это будет пятидесятый год. Не сейте и не жните того, что вырастет само собой[a], и не собирайте винограда с необрезанных лоз[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самосева». Речь о том, что выросло без посева.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с лоз, оставленных без ухода». Еврейское слово указывает на лозы, которые не обрезали и не возделывали обычным образом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹבֵל
  choice: юбилей
  rationale: В Левите 25 слово обозначает установленный особый год, а не бараний рог; «юбилей» — укоренившееся русское библейское наименование.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: пятидесятый год
  rationale: Естественная русская передача еврейского оборота, определяющего юбилей как пятидесятый год.
- source_word: תִּהְיֶה לָכֶם
  choice: будет для вас юбилейным
  rationale: Сохраняет значение предназначения этого года для общины и по-русски естественно связывает вторую часть с предшествующим «это юбилей».
- source_word: לֹא תִזְרָעוּ
  choice: не сейте
  rationale: Прямая и естественная передача запрета в русском законодательном контексте.
- source_word: לֹא תִקְצְרוּ
  choice: не жните
  rationale: Сохраняет отдельный земледельческий глагол и не смешивает жатву зерновых со сбором винограда.
- source_word: סְפִיחֶיהָ
  choice: того, что вырастет само собой
  rationale: Передаёт урожай, появившийся без посева; выражение понятно современному читателю и не требует специального термина «самосев».
- source_word: לֹא תִבְצְרוּ
  choice: не собирайте винограда
  rationale: Глагол относится именно к сбору винограда; объект назван явно для естественности и точности по-русски.
- source_word: נְזִרֶיהָ
  choice: с необрезанных лоз
  rationale: В данном земледельческом контексте слово обозначает лозы, оставленные без обычного ухода или обрезки; перевод сохраняет конкретный образ.
