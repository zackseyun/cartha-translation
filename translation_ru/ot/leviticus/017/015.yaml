reference: Leviticus 17:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: ru
  text: Всякий, кто съест мясо животного, павшего само собой[a] или растерзанного зверем, будь то коренной житель или переселенец[b], должен выстирать свою одежду и вымыть тело водой. Он будет нечист до вечера, а затем станет чист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падаль»; имеется в виду животное, умершее без надлежащего заклания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «постоянно живущий среди израильтян чужеземец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: всякий
  rationale: В данном правовом контексте слово обозначает отдельного человека; русское «всякий, кто» естественно передаёт универсальное условие.
- source_word: נְבֵלָה
  choice: падаль
  rationale: Слово обозначает тушу животного, умершего без надлежащего заклания; «падаль» кратко и точно передаёт эту категорию, а сноска устраняет возможную неясность.
- source_word: טְרֵפָה
  choice: мясо животного, растерзанного зверем
  rationale: Передаёт животное, растерзанное хищником, и ясно показывает, что речь идёт об употреблении его мяса в пищу.
- source_word: אֶזְרָח
  choice: коренной житель
  rationale: Обозначает исконного члена израильского общества и естественно противопоставляется переселенцу.
- source_word: גֵּר
  choice: переселенец
  rationale: Речь идёт о постоянно живущем среди Израиля пришлом человеке, а не о случайном путнике.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Передаёт предписанное ритуальное действие ясным современным русским языком.
- source_word: וְרָחַץ בַּמַּיִם
  choice: вымыть тело водой
  rationale: В контексте имеется в виду телесное омовение; добавление «тело» делает значение естественным и однозначным по-русски.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: будет нечист до вечера
  rationale: «Нечист» сохраняет категорию ритуальной нечистоты и не вводит представление о физической грязи или нравственной порочности.
- source_word: וְטָהֵר
  choice: а затем станет чист
  rationale: Передаёт завершение временного состояния нечистоты после омовения и наступления вечера.
theological_decisions:
- issue: Характер нечистоты в законах Левита
  choice: «нечист / чист» как обозначение ритуального статуса
  alternative: «осквернён / очищен» как язык нравственного или внутреннего осквернения
  rationale: Стих регулирует культовый статус после употребления мяса павшего или растерзанного животного; перевод не должен сам по себе приписывать человеку нравственную вину.
- issue: Условие восстановления чистоты
  choice: Сохранить как омовение, пребывание нечистым до вечера и последующее обретение чистоты
  alternative: Представить чистоту как наступающую сразу после омовения либо только с наступлением вечера независимо от омовения
  rationale: Еврейская последовательность связывает предписанное омовение и временной предел, не разъясняя подробнее их логическое соотношение; перевод сохраняет эту последовательность без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Термины «нечист» и «чист» сохранены как устойчивые обозначения ритуального статуса; архаизмы и конфессионально окрашенные уточнения избегаются.
