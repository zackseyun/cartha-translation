source:
  edition: WLC
  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: ru
  text: Они впредь не должны приносить своих жертв козлообразным бесам[a], за которыми они блудодействуют[b]. Это будет для них постоянным установлением[c] из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «козлиным идолам», «косматым духам»; еврейское слово буквально связано с козлами или косматыми существами и в этом культовом контексте может обозначать козлоподобных существ либо идолов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «за которыми они блудодействуют»; это метафора религиозной неверности и идолопоклонства.'
    reason: cultural_note
  - marker: c
    text: 'Или: «вечным установлением», «установлением навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: пусть ... не приносят ... жертв
  rationale: Отрицательный имперфект в законодательном контексте передан естественной русской запретительной конструкцией; сочетание «приносить жертвы» ясно выражает культовое действие.
- source_word: עוֹד
  choice: впредь не
  rationale: 'В контексте прекращения прежней или продолжающейся практики выражает запрет на будущее: «больше не, впредь не».'
- source_word: זִבְחֵיהֶם
  choice: своих жертв
  rationale: Возвратное «своих» естественно соотносится с подлежащим; существительное сохраняет лексическую связь с жертвоприношением, хотя буквальный корневой повтор по-русски звучал бы тяжеловесно.
- source_word: לַשְּׂעִירִם
  choice: козлообразным бесам
  rationale: Буквально слово связано с «косматыми» или козлами, но в данном культовом контексте вероятнее обозначает сверхъестественных существ, мыслимых в козлином облике. «Козлообразным бесам» передаёт этот смысл без привнесения греко-римского образа сатиров.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: вслед за которыми они блудно ходят
  rationale: Сохранены как образ следования «за» ложными объектами поклонения, так и сексуализированная метафора религиозной неверности. «Блудно ходят» звучит достойно и понятно, не сводя образ к отвлечённому «изменяют» или «служат идолам».
- source_word: חֻקַּת עוֹלָם
  choice: постоянным установлением
  rationale: Формула обозначает устойчиво действующее предписание в рамках завета; «постоянное» не переопределяет идиому как безусловно бесконечную во всех возможных смыслах.
- source_word: לְדֹרֹתָם
  choice: во все их поколения
  rationale: Естественно передаёт распространение установления на последовательные поколения народа.
theological_decisions:
- issue: Кого обозначает שְּׂעִירִם в контексте незаконного поклонения
  choice: сверхъестественные существа в козлином облике — «козлообразные бесы»
  alternative: козлы; козлиные идолы; сатиры
  rationale: Контекст жертвоприношения и последующая метафора культовой неверности указывают не на обычных животных. Перевод сохраняет вероятный демонический референт и одновременно отмечает козлиную образность слова.
- issue: Сила метафоры זֹנִים
  choice: сохранить явную метафору блуда
  alternative: изменяют; совершают идолопоклонство
  rationale: Еврейский текст описывает незаконное поклонение языком сексуальной неверности. Прямой образ не следует заменять одним лишь толкованием.
- issue: Продолжительность חֻקַּת עוֹלָם
  choice: постоянное установление
  alternative: вечное установление; установление навеки
  rationale: עוֹלָם в законодательной формуле выражает неизменно продолжающееся действие установления в заветной и поколенческой перспективе; русский вариант сохраняет силу формулы, не снимая вопрос о точном объёме длительности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным законодательным тоном. Синтаксис сделан естественным для широкого читателя; метафора культового блуда и неоднозначность формулы длительности сохранены. Термин «козлообразные бесы» ясен, но не привносит специфически античную категорию «сатиров».
