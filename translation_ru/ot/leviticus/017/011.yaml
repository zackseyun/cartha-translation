  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: ru
  text: Ибо жизнь плоти — в крови, и Я дал её вам для совершения на жертвеннике искупления за ваши жизни[a], ибо именно кровь совершает искупление посредством жизни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. нефеш — «жизнь», а в других контекстах также «душа», «человек» или «само существо». Здесь речь идёт о жизни.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «ибо кровь совершает искупление благодаря заключённой в ней жизни».'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В жертвенном контексте слово обозначает жизнь живого существа, а не отдельно мыслимую нематериальную «душу»; одинаковый перевод сохраняет связь всех трёх употреблений.
- source_word: הַבָּשָׂר
  choice: плоть
  rationale: Прямой и уместный в контексте живых существ перевод, сохраняющий конкретность еврейского выражения.
- source_word: בַּדָּם
  choice: в крови
  rationale: 'Предлог ב с артиклем здесь естественно выражает нахождение: жизнь плоти — в крови.'
- source_word: נְתַתִּיו לָכֶם
  choice: Я дал её вам
  rationale: Совершенный вид передаёт установленное Богом и сохраняющее силу дарование крови для жертвенника; местоимение согласовано с русским словом «кровь».
- source_word: עַל הַמִּזְבֵּחַ
  choice: для жертвенника
  rationale: Русское «дать для жертвенника» естественно передаёт назначение крови, при том что её ритуальное применение происходит на жертвеннике.
- source_word: לְכַפֵּר
  choice: чтобы совершать искупление
  rationale: Сохраняет устойчивое культовое значение корня כפר, не навязывая узкой теории механизма искупления.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: за ваши жизни
  rationale: Передаёт עַל в связи с искуплением и сохраняет значение נֶפֶשׁ как «жизнь» в пределах стиха.
- source_word: כִּי הַדָּם הוּא
  choice: потому что кровь
  rationale: Передаёт объяснительную силу כִּי; русская конструкция без отдельного эквивалента הוּא звучит естественно, сохраняя акцент на крови.
- source_word: בַּנֶּפֶשׁ
  choice: посредством жизни
  rationale: Инструментальное понимание ב сохраняет связь искупительной роли крови с заключённой в ней жизнью, не устраняя синтаксическую неоднозначность.
- source_word: יְכַפֵּר
  choice: совершает искупление
  rationale: Терминологически согласовано с לְכַפֵּר и сохраняет культовый характер утверждения.
theological_decisions:
- issue: Значение נֶפֶשׁ в законе о жертвенной крови
  choice: Во всём стихе передано словом «жизнь».
  alternative: «душа» или «сам человек»
  rationale: Смысловой ход стиха связывает действенность крови с жизнью живого существа; «душа» могла бы внести не выраженное здесь противопоставление души и тела.
- issue: Значение בַּנֶּפֶשׁ в заключительной фразе
  choice: «посредством жизни»
  alternative: «за жизнь», «благодаря жизни» или «посредством заключённой в ней жизни»
  rationale: Еврейская фраза кратка и допускает разные оттенки. Основной текст сохраняет инструментальную связь, а примечание указывает более развёрнутое понимание, не объявляя его единственно возможным.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и культового контекста. Сохранены ключевые повторы «жизнь», «кровь» и «совершать искупление»; избегается конфессионально узкое истолкование механизма искупления.
