base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: ru
  text: 'Поэтому Я сказал сынам Израиля[a]: «Никто из вас не должен есть крови; а пришелец[b], живущий среди вас, не должен есть крови».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Израиля»; по смыслу также возможно: «детям Израиля» или «израильтянам».'
    reason: lexical_alternative
  - marker: b
    text: '«Пришелец» — не-местный житель, живущий среди Израиля; в данном законодательном контексте он также подпадает под законы общины. Возможные переводы: «чужеземец» или «иноземный житель».'
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего объяснения о жизни в крови и естественно звучит в современном русском языке.
- source_word: אָמַרְתִּי
  choice: Я сказал
  rationale: Простое прошедшее время точно передаёт форму глагола и сохраняет прямой характер Божьего высказывания.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный образ еврейского выражения и его традиционное русское звучание; возможные смысловые эквиваленты указаны в сноске.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: Никто из вас
  rationale: נֶפֶשׁ здесь обозначает отдельного человека; русская отрицательная конструкция ясно и естественно передаёт всеобщий запрет.
- source_word: לֹא תֹאכַל דָּם
  choice: не должен есть крови
  rationale: Передаёт юридически обязательный запрет, сохраняя конкретный глагол «есть» и слово «кровь».
- source_word: הַגֵּר
  choice: пришелец
  rationale: Обозначает неурождённого жителя, постоянно проживающего среди Израиля и находящегося под законами общины; «чужеземец» могло бы создать впечатление лишь временного внешнего посетителя.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: живущий среди вас
  rationale: Естественно передаёт причастную конструкцию и поясняет, что речь идёт о проживающем внутри общины человеке.
- source_word: לֹא יֹאכַל דָּם
  choice: не должен есть крови
  rationale: Повторяет тот же обязательный запрет применительно к пришельцу и сохраняет параллелизм двух частей стиха.
theological_decisions:
- issue: Родовое обозначение לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: детям Израиля; израильтянам
  rationale: Основной текст сохраняет мужскую форму исходного устойчивого выражения, не утверждая при этом, что запрет относился только к мужчинам.
- issue: Объём запрета для пришельца
  choice: тот же прямой запрет есть кровь
  alternative: смягчённое описание обычая Израиля
  rationale: Еврейский текст прямо повторяет запрет в отношении пришельца; перевод не ослабляет его и не добавляет позднейших конфессиональных толкований.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, юридически ясным звучанием. Повтор запрета сохранён вслед за еврейским текстом. Конструкция «есть крови» соответствует традиционной и естественной для отрицательного оборота форме родительного падежа; «пришелец» пояснён сноской, чтобы историко-правовой смысл был понятен современному читателю.
