  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: ru
  text: Священник плеснёт кровью на жертвенник Яхве[a] у входа в шатёр встречи и сожжёт жир как благоухание, приятное Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окропит кровью жертвенник» или «брызнет кровью на жертвенник». Еврейский глагол обозначает ритуальное нанесение крови броском или резким движением.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для приятного благоухания Яхве»; возможны также переводы «как благоухание, угодное Яхве» и «как успокоительное благоухание Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: плеснёт кровью
  rationale: В жертвенном контексте זָרַק обозначает ритуальное нанесение крови на жертвенник броском или резким движением. «Плеснёт» передаёт это действие точнее, чем более слабое «окропит», и звучит естественно по-русски.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Прямое и общепринятое соответствие כֹּהֵן; определённость понятна из контекста.
- source_word: עַל מִזְבַּח יְהוָה
  choice: на жертвенник Яхве
  rationale: Сочетание עַל с זָרַק указывает на направленное нанесение крови на жертвенник. Русское «плеснёт кровью на жертвенник» естественно передаёт движение и цель.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: פֶּתַח означает вход или проём, а אֹהֶל מוֹעֵד — шатёр встречи. Такая формулировка современна, понятна и сохраняет смысл исходного выражения.
- source_word: וְהִקְטִיר
  choice: сожжёт
  rationale: В священнической жертвенной лексике глагол означает сжечь жертвенную часть так, чтобы она восходила дымом; «сожжёт» ясно и кратко передаёт действие.
- source_word: הַחֵלֶב
  choice: жир
  rationale: Речь идёт о жировых частях жертвы, предназначенных для сожжения на жертвеннике.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: как благоухание, приятное
  rationale: Передаёт устойчивую жертвенную формулу и мотив угодности Богу, не сводя נִיחֹחַ только к буквальному запаху.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл выражения רֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  alternative: успокоительное благоухание; благоухание, угодное Яхве
  rationale: Формулировка сохраняет образ запаха и идею благосклонного принятия жертвы, не утверждая, будто запах буквально успокаивает Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Шатёр встречи» выбран вместо традиционного, но менее прозрачного «скиния собрания». Синтаксис сохранён компактным, а специальные жертвенные нюансы вынесены в примечания.
