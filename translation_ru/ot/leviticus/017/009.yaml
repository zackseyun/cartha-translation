  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: ru
  text: и не принесёт его ко входу в шатёр Собрания, чтобы принести его в жертву Яхве[a], тот человек будет отсечён от своего народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы сделать (или совершить) его для Яхве»; в данном жертвенном контексте еврейский оборот означает принесение жертвы.'
    reason: lexical_alternative
  - marker: b
    text: «Будет отсечён» — юридическая формула, точный вид наказания в этом стихе не указан; она может подразумевать удаление из общины завета или непосредственный Божий суд.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: вход
  rationale: Слово обозначает вход или проём; «вход» естественно звучит по-русски в контексте святилища.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Устоявшееся и прозрачное обозначение святилища; сохраняет значения обоих компонентов еврейского выражения.
- source_word: יְבִיאֶנּוּ
  choice: принесёт его
  rationale: Местоименный суффикс мужского рода отсылает к жертвенному животному или приношению из предшествующего контекста; конкретный глагол движения сохранён.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: чтобы принести его в жертву Яхве
  rationale: Буквально выражение означает «чтобы сделать/совершить его для Яхве», но в жертвенном контексте עשה идиоматически указывает на совершение жертвоприношения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: וְנִכְרַת
  choice: будет отсечён
  rationale: Формальная передача юридической формулы сохраняет её образность и не уточняет не названный в стихе способ наказания.
- source_word: הָאִישׁ הַהוּא
  choice: тот человек
  rationale: Соответствует указательному обороту и мужскому единственному числу исходного текста, сохраняя юридический стиль.
- source_word: מֵעַמָּיו
  choice: от своего народа
  rationale: Кратко и точно передаёт отделение виновного от принадлежащего ему народа или общины.
theological_decisions:
- issue: Значение наказания וְנִכְרַת («будет отсечён»)
  choice: Сохранить формулу «будет отсечён», не определяя точный вид наказания.
  alternative: «будет предан смерти», «будет исключён из общины» или «будет истреблён»
  rationale: Само еврейское выражение здесь не уточняет, идёт ли речь о смерти, исключении из общины или непосредственном Божьем суде; перевод не должен устранять эту неоднозначность.
- issue: Передача הָאִישׁ הַהוּא
  choice: «тот человек»
  alternative: «тот», «всякий такой»
  rationale: Так сохраняются грамматический мужской род, индивидуальная ответственность и юридическая форма исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Начальный союз «и» сохранён, поскольку стих синтаксически продолжает предыдущее условие. Термины подобраны понятно для широкого читателя без конфессионального уточнения неоднозначной санкции.
