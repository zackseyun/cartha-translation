base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: ru
  text: 'И скажи им: всякий мужчина из дома Израиля[a] или пришелец, живущий среди них[b], принесёт всесожжение или жертву, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужчина, мужчина» — древнееврейская юридическая формула, обозначающая каждого в отдельности.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть не-израильтянин, живущий среди израильтян; возможный перевод: «переселенец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: И скажи им
  rationale: Союз сохраняет связь с предыдущим наставлением, а императив естественно передаёт директивное значение древнееврейского имперфекта в обращении к Моисею.
- source_word: אִישׁ אִישׁ
  choice: всякий мужчина
  rationale: 'Удвоение существительного образует распределительную юридическую формулу: речь идёт о каждом отдельном мужчине; «всякий» передаёт распределительное значение, не устраняя грамматически мужскую форму оригинала.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: из дома Израиля
  rationale: Сохранено устойчивое заветно-родовое выражение «дом Израиля» и значение предлога «из».
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: или из пришельцев, живущих среди них
  rationale: «Пришелец» обозначает не просто незнакомца, а не-израильтянина, постоянно живущего в общине Израиля; причастный оборот естественно передаёт однокоренное повторение существительного и глагола в оригинале.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: который принесёт
  rationale: В сочетании с названиями жертв Hiphil глагола עלה имеет специальное значение жертвенного принесения; по-русски оно естественно выражается глаголом «принести».
- source_word: עֹלָה
  choice: всесожжение
  rationale: Традиционный и точный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: אוֹ זָבַח
  choice: или жертву
  rationale: Слово обозначает закалываемую жертву в отличие от всесожжения; краткое «жертву» ясно сохраняет данное противопоставление.
theological_decisions:
- issue: Распределительное выражение אִישׁ אִישׁ и его род
  choice: всякий мужчина
  alternative: всякий человек; всякий, кто
  rationale: В оригинале употреблено удвоенное существительное мужского рода в юридическом распределительном смысле. Перевод сохраняет как значение «каждый отдельный», так и явно мужскую форму, не расширяя её без текстового основания.
- issue: Социально-правовой статус גֵּר
  choice: пришелец
  alternative: переселенец; живущий в стране иноземец
  rationale: Термин относится к не-израильтянину, живущему среди Израиля и подпадающему под его культовые установления. «Пришелец» сохраняет библейскую правовую категорию, а сноска разъясняет её современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным юридико-культовым регистром. Термины «дом Израиля» и «всесожжение» сохранены как точные и узнаваемые библейские выражения. Конечное тире показывает, что условная конструкция продолжается в следующем стихе.
