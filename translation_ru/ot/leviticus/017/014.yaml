  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: ru
  text: 'Ведь жизнь всякой плоти — её кровь: её кровь — в её жизни[a]. Поэтому Я сказал сынам Израиля[b]: «Не ешьте крови никакой плоти, потому что жизнь всякой плоти — её кровь». Всякий, кто ест её, будет отсечён.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её кровь и есть её жизнь». Древнееврейское выражение допускает разные способы передачи тесной связи крови и жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть израильтянам; буквально: «сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В контексте запрета употреблять кровь слово обозначает жизненную силу живого существа, а не нематериальную «душу».
- source_word: בָּשָׂר
  choice: плоть
  rationale: Сохраняет повторяющееся древнееврейское выражение «всякая плоть» и его телесно-жизненный смысл.
- source_word: דָּם / דָּמוֹ
  choice: кровь / её кровь
  rationale: Кровь — центральное понятие обоснования запрета; местоимение соотнесено с существительным «плоть».
- source_word: בְנַפְשׁוֹ הוּא
  choice: в ней её жизнь
  rationale: Сжатая и неоднозначная древнееврейская конструкция передана по-русски понятно, но без устранения связи между кровью и жизнью; более буквальные и интерпретирующие варианты приведены в сноске.
- source_word: וָאֹמַר
  choice: поэтому Я сказал
  rationale: Передаёт переход от основания запрета к самому повелению и естественно звучит в русском законодательном контексте.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Буквально сохраняет традиционное древнееврейское обозначение; идиоматическое пояснение дано в сноске.
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Прямая форма запрета естественна для современного русского языка и сохраняет обращение во множественном числе.
- source_word: אֹכְלָיו
  choice: кто ест её
  rationale: Причастная форма имеет распределительное значение; местоимение «её» относится к крови.
- source_word: יִכָּרֵת
  choice: будет отсечён
  rationale: Сохраняет формулу заветной санкции, не уточняя спорным образом, идёт ли речь о смерти, исключении из общины или Божьем суде.
theological_decisions:
- issue: Значение נֶפֶשׁ в связи с кровью
  choice: 'Передано словом «жизнь»: кровь неразрывно связана с жизнью существа.'
  alternative: «душа» в метафизическом смысле либо однозначное утверждение «кровь и есть жизнь»
  rationale: Стих обосновывает запрет связью жизни с кровью, не формулируя учения о нематериальной душе; сноска сохраняет неоднозначность синтаксиса.
- issue: Смысл санкции יִכָּרֵת
  choice: «будет отсечён» без дальнейшего пояснения в основном тексте
  alternative: «будет казнён», «будет изгнан» или «будет исключён из общины»
  rationale: Древнееврейская формула допускает разные способы осуществления заветного суда, и данный стих не уточняет их.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Повторы «жизнь всякой плоти» и «её кровь» сохранены ради структуры обоснования; неоднозначность первой фразы отмечена сноской. Заглавная буква в «Я» указывает на говорящего Бога в ближайшем контексте.
