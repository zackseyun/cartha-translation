  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: ru
  text: 'а если он не принёс его ко входу в Шатёр встречи, чтобы принести его как жертву Господу перед скинией Господа, то кровь будет вменена тому человеку[a]: он пролил кровь; и будет отсечён тот человек из среды своего народа[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кровь будет сочтена тому человеку». Это юридическая формула ответственности за кровопролитие.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «будет отсечён» здесь не уточняет, идёт ли речь о смерти, изгнании или иной форме удаления из общины за нарушение завета.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: вход в Шатёр встречи
  rationale: פֶּתַח обозначает вход, а אֹהֶל מוֹעֵד — установленное название святилища. «Шатёр встречи» точно и естественно передаёт выражение в современном русском языке.
- source_word: הֱבִיאוֹ
  choice: не привёл его
  rationale: Порода hифиль глагола בוא означает «привести, принести»; местоименное дополнение относится к животному из предыдущего стиха.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: чтобы принести в жертву
  rationale: Сочетание обозначает представление Богу жертвенного дара. Такой перевод передаёт культовый смысл без неестественного повтора «принести приношение».
- source_word: לַיהוָה
  choice: Господу
  rationale: Тетраграмматон передан традиционным русским соответствием «Господь», уместным в литературном библейском регистре.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: перед скинией Господа
  rationale: לִפְנֵי имеет пространственный смысл «перед», а מִשְׁכָּן — священное жилище, традиционно называемое скинией.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: тому человеку вменяется пролитие крови
  rationale: 'Буквально: «кровь будет сочтена тому человеку». Русское выражение сохраняет судебный смысл вменения вины и вместе с тем делает понятным, что речь идёт об ответственности за пролитую кровь.'
- source_word: דָּם שָׁפָךְ
  choice: он пролил кровь
  rationale: Прямое и устойчивое соответствие еврейской правовой формуле.
- source_word: וְנִכְרַת ... מִקֶּרֶב עַמּוֹ
  choice: будет истреблён из среды своего народа
  rationale: «Истреблён» сохраняет традиционную формулу כרת и её суровую неопределённость; «из среды своего народа» близко передаёт מִקֶּרֶב עַמּוֹ.
theological_decisions:
- issue: Смысл формулы דָּם יֵחָשֵׁב
  choice: тому человеку вменяется пролитие крови
  alternative: кровь будет вменена тому человеку
  rationale: Выбранный вариант передаёт юридическую ответственность за кровопролитие, подтверждаемую следующими словами, но не вводит отдельного богословского понятия сверх текста.
- issue: Характер наказания וְנִכְרַת
  choice: будет истреблён из среды своего народа
  alternative: будет отсечён от своего народа
  rationale: В стихе не уточняется, означает ли формула смерть, изгнание или иной вид удаления из общины. Сноска сохраняет эту намеренную неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Начальный союз «а» сохраняет синтаксическую связь с условием предыдущего стиха. Термины «Шатёр встречи» и «скиния» различают אֹהֶל מוֹעֵד и מִשְׁכָּן, не стирая их смысловой близости.
