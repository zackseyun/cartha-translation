- from: чтобы сыны Израиля[a] приносили свои жертвы, которые они закалывают в открытом поле, доставляли их к Яхве, ко входу в Шатёр встречи, к священнику, и закалывали их как мирные жертвы[b] Яхве.
  to: чтобы сыны Израиля[a] приносили Яхве свои жертвы, которые они закалывают в поле, — ко входу в Шатёр встречи, к священнику, — и приносили их в жертву Яхве как мирные жертвы[b].
  rationale: Перестроена последовательность дополнений, чтобы «ко входу в Шатёр встречи, к священнику» ясно относилось к принесению жертв Яхве. «В открытом поле» заменено на более естественное в данном контексте «в поле»; смысл совершения вне святилища сохранён. Заключительный глагол передан идиоматически, сохраняя различение между принесением жертв к святилищу и принесением их как жертв шְלָמִים.
