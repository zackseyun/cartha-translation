source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: ru
  text: чтобы сыны Израиля[a] приносили Яхве свои жертвы, которые они закалывают в поле, — ко входу в Шатёр встречи, к священнику, — и приносили их в жертву Яхве как мирные жертвы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне».'
    reason: Лексическая альтернатива для более естественной передачи בְּנֵי יִשְׂרָאֵל.
  - marker: b
    text: 'Или: «жертвы общения»; или: «жертвы благополучия».'
    reason: Термин שְׁלָמִים имеет оттенки мира, целостности, благополучия и совместной трапезы.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: чтобы
  rationale: Естественно вводит в русском языке придаточное цели и сохраняет связь с предшествующим повелением.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет родственное обозначение еврейского текста и его грамматически мужскую форму; современное «израильтяне» дано как более идиоматичная альтернатива.
- source_word: זִבְחֵיהֶם
  choice: свои жертвы
  rationale: Передаёт жертвенный смысл существительного; возвратное «свои» естественно соотносит жертвы с подлежащим.
- source_word: אֲשֶׁר הֵם זֹבְחִים
  choice: которые они закалывают
  rationale: Глагол זבח обозначает ритуальное заклание; настоящее время передаёт продолжающуюся или обычную практику.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: в открытом поле
  rationale: Передаёт идиоматический смысл совершения закланий вне святилища, в открытой местности.
- source_word: וְהֱבִיאֻם
  choice: доставляли их
  rationale: Сохраняет явное местоименное дополнение, относящееся к жертвам, и продолжает целевую конструкцию без лишнего повторения «приносили».
- source_word: לַיהוָה
  choice: к Яхве / Яхве
  rationale: Передаёт личное имя יהוה транслитерацией «Яхве»; падежная форма определяется русским синтаксисом.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в Шатёр встречи
  rationale: Ясно обозначает вход в святилище; «Шатёр встречи» передаёт назначение אֹהֶל מוֹעֵד и звучит естественно и достойно.
- source_word: אֶל הַכֹּהֵן
  choice: к священнику
  rationale: Сохраняет определённость еврейского выражения в контексте служащего при святилище священника.
- source_word: וְזָבְחוּ זִבְחֵי שְׁלָמִים
  choice: и закалывали их как мирные жертвы
  rationale: Сохраняет лексическую связь между глаголом заклания и названием жертвы; «мирные жертвы» — узнаваемое обозначение особой категории שְׁלָמִים.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Формулировка сохраняет семейно-родовой образ оригинала и его мужскую грамматическую форму, не ограничивая обозначение лишь биологическими сыновьями Иакова.
- issue: Смысл זִבְחֵי שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Термин обозначает особый вид жертвоприношения и допускает смысловые оттенки мира, целостности, благополучия и общения; основной текст использует традиционно узнаваемую форму, а примечание сохраняет альтернативы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохраняет целевую последовательность оригинала, но избегает неестественного буквального воспроизведения еврейских конструкций.
