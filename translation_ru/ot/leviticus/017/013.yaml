base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: ru
  text: Если кто-нибудь из сынов Израиля или из пришельцев, живущих среди них, добудет на охоте зверя или птицу, которых можно употреблять в пищу, то он должен вылить кровь добычи и засыпать её землёй.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выльет его кровь и покроет её прахом (или землёй)». Местоимение «её» естественнее всего относится к крови.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: если кто-нибудь
  rationale: Удвоение существительного выражает распределительное значение — «всякий / кто бы ни»; по-русски условная формула «если кто-нибудь» естественно вводит правовое предписание.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: из сынов Израиля
  rationale: Сохраняет родовое и заветное выражение בני ישראל, оставаясь понятным в современном литературном русском.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: из пришельцев, живущих среди них
  rationale: «Пришелец» передаёт правовую категорию постоянно проживающего среди общины не-израильтянина; буквальный однокоренной повтор по-русски был бы тяжеловесен.
- source_word: יָצוּד צֵיד
  choice: добудет на охоте
  rationale: Естественно передаёт однокоренную конструкцию «охотиться / добыча» и подчёркивает, что речь идёт об охотничьей добыче.
- source_word: חַיָּה אוֹ עוֹף
  choice: зверя или птицу
  rationale: В контексте охоты חיה обозначает дикого зверя; «зверь» кратко и естественно противопоставлен птице.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: которых можно употреблять в пищу
  rationale: Передаёт допустимость или пригодность этих видов для еды, выраженную формой нифаль.
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: должен выпустить кровь добычи
  rationale: «Должен» ясно передаёт предписывающую силу правовой формы; явное «добычи» устраняет неестественную для русского неясность притяжательного местоимения при двух существительных разного рода.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: засыпать её землёй
  rationale: «Засыпать землёй» естественно описывает конкретное действие; местоимение ближайшим образом относится к крови, не добавляя идеи полного погребения.
theological_decisions:
- issue: Референт местоименного суффикса в וְכִסָּהוּ
  choice: кровь следует засыпать землёй
  alternative: следует покрыть или погрести животное
  rationale: Ближайший и синтаксически наиболее естественный антецедент — «кровь». Это сохраняет ритуальный акцент контекста, однако примечание отмечает, что связь задаётся местоимением и допускает формально обсуждаемую альтернативу.
translation_notes:
  register: Современный литературный русский с достоинством правового предписания. Синтаксис сделан естественным для широкого читателя; сохранены понятия «сыны Израиля» и «пришелец» как значимые категории текста. Маркер примечания поставлен после соответствующего предписания.
