id: LEV.17.2
reference: Leviticus 17:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: ru
  text: 'Обратись к Аарону, его сыновьям и ко всем израильтянам[a] и скажи им: «Вот что[b] повелел Яхве сказать:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всем сынам Израиля»; это устойчивое обозначение израильского народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение можно также передать: «Вот слово» или «Вот дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: Повелительная форма вводит поручение Моисею говорить с названными адресатами. «Обратись» естественно передаёт это в сочетании с последующим «скажи», избегая тяжеловесного повтора «говори… и скажи».
- source_word: בָּנָיו
  choice: его сыновьям
  rationale: Существительное во множественном числе с местоименным суффиксом прямо обозначает сыновей Аарона, то есть мужчин из священнической семьи.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: всем израильтянам
  rationale: Устойчивое древнееврейское этническое обозначение здесь относится к народу Израиля в целом. Современное русское «израильтянам» ясно передаёт функцию выражения; буквальная семейная форма сохранена в примечании.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Последовательное предписание передано прямой и естественной русской повелительной конструкцией.
- source_word: זֶה הַדָּבָר
  choice: Вот что
  rationale: דָּבָר может означать «слово», «дело», «то, что сказано». В данной формуле местоименная конструкция «вот что» естественно вводит содержание повеления, не закрепляя искусственно только одно из значений.
- source_word: צִוָּה
  choice: повелел
  rationale: Перфект глагола צוה обозначает данное Яхве обязательное повеление; «повелел» сохраняет его властный характер.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив вводит содержание повеления, продолжающееся в следующем стихе. Русская конструкция «повелел… сказать» передаёт эту связь естественно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Охват выражения בְּנֵי יִשְׂרָאֵל
  choice: всем израильтянам
  alternative: всем сынам Израиля; всем детям Израиля
  rationale: Хотя форма буквально означает «сыны Израиля», она служит общеупотребительным названием народа. Перевод «израильтянам» не ограничивает адресатов одними мужчинами и сохраняет этнический смысл; буквальная форма отмечена в сноске.
- issue: Связь לֵאמֹר с последующей речью
  choice: повелел Яхве сказать
  alternative: повелел Яхве, сказав
  rationale: Выбранная конструкция естественно показывает, что далее следует содержание повеления, не утверждая лишнего о способе его произнесения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повтор древнееврейских глаголов речи передан без канцелярской тяжеловесности; двоеточие указывает, что содержание повеления продолжается в следующем стихе.
