source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א יְכַבֵּ֔ס וּ/בְשָׂר֖/וֹ לֹ֣א יִרְחָ֑ץ וְ/נָשָׂ֖א עֲוֺנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: ru
  text: Но если он не выстирает одежду и не омоет своё тело[a], то понесёт свою вину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свою плоть»; здесь имеется в виду омовение тела.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «понесёт своё беззаконие» либо «понесёт наказание за своё беззаконие». Еврейское юридическое выражение может включать и вину, и её последствия.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: В контексте союз вводит противоположный случай — невыполнение предписанного очищения; «но если» естественно передаёт этот оттенок.
- source_word: יְכַבֵּס
  choice: не выстирает одежду
  rationale: Пиэль глагола כבס обычно обозначает стирку одежды. Объект, опущенный в еврейском тексте, однозначно восстанавливается из предыдущего стиха.
- source_word: וּבְשָׂרוֹ
  choice: своё тело
  rationale: Буквально «свою плоть», однако в контексте ритуального омовения слово обозначает тело человека.
- source_word: יִרְחָץ
  choice: не омоет
  rationale: Глагол רחץ здесь относится к омовению тела; «омоет» сохраняет различие между стиркой одежды и мытьём тела и соответствует достоинству законодательного стиля.
- source_word: וְנָשָׂא
  choice: то понесёт
  rationale: Сочетание с союзом выражает следствие невыполнения условия; русская конструкция «если... то...» ясно передаёт эту связь.
- source_word: עֲוֹנוֹ
  choice: свою вину
  rationale: עון может обозначать беззаконие, вину и ответственность либо последствие проступка. «Понесёт свою вину» сохраняет юридико-богословскую ёмкость выражения, не уточняя наказание.
theological_decisions:
- issue: Значение юридической формулы וְנָשָׂא עֲוֹנוֹ
  choice: «понесёт свою вину» без уточнения конкретного наказания
  alternative: «понесёт своё беззаконие» или «понесёт наказание за своё беззаконие»
  rationale: Еврейское выражение способно охватывать как виновность, так и связанную с ней ответственность и последствия. Перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким и достойным законодательным звучанием. «Выстирает одежду» восполняет ясный из контекста объект; «омоет» передаёт ритуальный контекст без архаической перегруженности.
