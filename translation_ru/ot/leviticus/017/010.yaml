base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: ru
  text: Если кто-нибудь из дома Израиля или из пришельцев, живущих среди них,[a] будет есть какую бы то ни было кровь, то Я обращу Свое лицо против того, кто ест кровь,[b] и отсеку его из среды его народа.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Пришелец» — не-израильтянин, живущий среди израильтян; также можно перевести: «чужеземец, живущий среди них».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «против души, которая ест кровь»; здесь «душа» означает самого человека.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «отсеку его из среды его народа». Это заветная формула наказания; данный стих не уточняет, означает ли она смерть, изгнание или иной Божий суд.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: Если кто-нибудь
  rationale: Удвоенное אִישׁ образует распределительную правовую формулу «всякий, кто»; по-русски условное «если кто-нибудь» естественно вводит норму, не ограничивая её только мужчинами.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: из дома Израиля
  rationale: Сохранена торжественная заветно-правовая формула «дом Израиля».
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: или из пришельцев, живущих среди них
  rationale: גֵּר обозначает не случайного чужеземца, а иноплеменного постоянного жителя; русское «пришелец» сохраняет традиционный правовой оттенок, а причастие передаёт הַגָּר.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: станет есть какую бы то ни было кровь
  rationale: Обычное значение יֹאכַל передано глаголом «есть», а כָּל דָּם — усиленным русским оборотом, выражающим полный запрет крови любого рода.
- source_word: וְנָתַתִּי פָנַי
  choice: Я обращу лицо Моё против
  rationale: Сохранён антропоморфный библейский образ решительного Божьего противодействия, без сведения его к абстрактному «выступлю против».
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת אֶת הַדָּם
  choice: против того, кто ест кровь
  rationale: В данном правовом контексте נֶפֶשׁ означает отдельного человека; буквальное «душа» могло бы привнести неуместный метафизический смысл.
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: и истреблю его
  rationale: Русское «истреблю из среды народа» воспроизводит устойчивую библейскую формулу כרת, при этом примечание сохраняет неопределённость конкретного способа наказания.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: из среды его народа
  rationale: «Из среды» близко передаёт מִקֶּרֶב и сохраняет достоинство правового регистра; мужское местоимение естественно соотносится с русским «тот».
theological_decisions:
- issue: Точный смысл наказания, выраженного формулой וְהִכְרַתִּי
  choice: Сохранить заветно-правовую формулу «истреблю его из среды его народа», пояснив её неопределённость в сноске.
  alternative: «Предам смерти», «изгоню» или «отлучу».
  rationale: Стих провозглашает суровый Божий суд, но сам по себе не уточняет, идёт ли речь о смерти, изгнании, исключении из общины или ином действии Божьего суда; перевод не должен разрешать эту напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством библейско-правовой речи. Синтаксис сделан естественным для условной нормы; сохранены ключевые образы «дом Израиля», «обращу лицо Моё против» и «из среды его народа». Все примечания отмечены в основном тексте.
