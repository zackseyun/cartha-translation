  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно передаваемое как «Господь».'
    reason: Указание на написание божественного имени и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Форма wayyiqtol от דבר обозначает очередное речевое событие в повествовании; «говорил» естественно передаёт устойчивую библейскую формулу перед прямой речью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל
  choice: Моисею
  rationale: Предлог אֶל при глаголе речи передаётся русским дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени; в данном сочетании употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитивная формула вводит содержание последующей речи. В современном русском её естественно передать двоеточием, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет личное имя и наиболее вероятное произношение, тогда как «Господь» заменяет его титулом, а «Иегова» отражает позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз «И» сохраняет повествовательную связь с предыдущим контекстом; двоеточие естественно вводит речь, начинающуюся в следующем стихе.
