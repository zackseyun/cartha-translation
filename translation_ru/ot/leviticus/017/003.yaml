base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: ru
  text: Если кто-нибудь из дома Израиля зарежет быка, овцу или козу в стане или зарежет вне стана —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: кто-нибудь
  rationale: 'Удвоенное существительное имеет распределительное значение: речь идёт о любом отдельном человеке. Русское «если кто-нибудь» естественно вводит условие закона и не сужает его смысл до взрослых мужчин.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: из дома Израиля
  rationale: Сохранён буквальный заветно-национальный оборот «дом Израиля», понятный в современном литературном русском.
- source_word: יִשְׁחַט
  choice: зарежет
  rationale: Глагол обозначает заклание животного. «Зарежет» естественно и точно передаёт действие, не утверждая само по себе, является ли оно жертвенным.
- source_word: שׁוֹר
  choice: быка
  rationale: В данном перечне жертвенного скота «бык» — естественное русское обозначение отдельной головы крупного рогатого скота; еврейское слово здесь не требует перевода «вол».
- source_word: כֶשֶׂב
  choice: овцу
  rationale: Слово обозначает животное из овечьего стада и не обязательно ягнёнка, поэтому выбрано более широкое «овца».
- source_word: עֵז
  choice: козу
  rationale: Стандартное обозначение этого вида мелкого скота.
- source_word: בַּמַּחֲנֶה
  choice: в стане
  rationale: «Стан» сохраняет библейско-исторический смысл организованного лагеря Израиля и остаётся понятным в литературном русском.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: вне стана
  rationale: Кратко и точно обозначает место за пределами стана.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: если ... или
  rationale: Русская условная конструкция естественно передаёт казуистическую формулу закона; повтор второго глагола сохраняет параллелизм двух мест совершения действия.
- source_word: '[implicit object after second יִשְׁחַט]'
  choice: зарежет их
  rationale: Во второй части объект подразумевается. Местоимение во множественном числе согласуется с перечисленными альтернативными видами животных и делает русский текст ясным.
theological_decisions:
- issue: Относится ли стих только к жертвенному закланию или ко всякому убою перечисленного скота
  choice: Не добавлять слова «в жертву»
  alternative: «принесёт в жертву» или «заколет в жертву»
  rationale: Сам глагол שׁחט означает заклание; культовое применение раскрывается ближайшим контекстом. Добавление «в жертву» разрешило бы имеющуюся в формулировке напряжённость вместо её сохранения.
translation_notes:
  register: Современный литературный русский с умеренно библейским словом «стан». Стих оставлен синтаксически незавершённым и завершается тире, поскольку условие продолжается в следующем стихе. Сноски не требуются.
