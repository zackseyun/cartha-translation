  text: 'Не открывай наготы сестры твоего отца[a]: она — кровная родственница твоего отца[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Открывать наготу» — юридическая формула Левита 18, обозначающая запрещённые сексуальные отношения.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «плоть твоего отца»; то есть его близкая кровная родственница.'
