lexical_decisions:
- source_word: עֶרְוַת
  choice: наготы
  rationale: 'Сохраняет ключевой юридический образ главы: עֶרְוָה обозначает наготу и в сочетании с גלה образует устойчивую формулу о запрещённой сексуальной близости.'
- source_word: תְגַלֵּה
  choice: не открывай
  rationale: Передаёт форму прямого запрета во 2-м лице единственного числа и сохраняет повторяющуюся в Левите 18 формулу «открывать наготу», не заменяя её более узким толкованием.
- source_word: אֲחוֹת אָבִיךָ
  choice: сестры твоего отца
  rationale: Прямо и ясно передаёт указанную степень родства; вариант «тётки по отцу» естественнее разговорно, но менее близок к структуре оригинала.
- source_word: שְׁאֵר אָבִיךָ
  choice: плоть твоего отца
  rationale: Сохраняет телесно-родственный образ שְׁאֵר и намеренную краткость еврейского текста. Смысл близкого кровного родства поясняется в сноске.
- source_word: הִוא
  choice: она —
  rationale: Сохраняет отождествляющую именную конструкцию и её обосновывающую функцию.
theological_decisions:
- issue: Передача юридической формулы עֶרְוָה גלה
  choice: Сохранить в основном тексте выражение «открывать наготу».
  alternative: 'Передать толковательно: «вступать в половую связь».'
  rationale: Формульное выражение связывает стих с остальными запретами главы и не сужает его значение до одной интерпретирующей формулировки.
- issue: Передача שְׁאֵר как обозначения родства
  choice: Сохранить метафору «плоть твоего отца».
  alternative: 'Передать смыслом: «близкая родственница твоего отца» или «его кровная родственница».'
  rationale: «Плоть» точнее отражает исходный образ родственной телесной общности, а сноска обеспечивает понятность без устранения образности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, юридически формульным звучанием. Единственное число «не открывай» соответствует еврейскому обращению во 2-м лице мужского рода единственного числа; необычный образ «плоть твоего отца» намеренно сохранён и пояснён сноской.
