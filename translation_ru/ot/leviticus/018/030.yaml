base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: ru
  text: 'И соблюдайте Моё повеление: не следуйте ни одному из мерзостных обычаев[a], которым следовали до вас, и не оскверняйте себя ими. Я — Яхве, ваш Бог.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мерзостных установлений». Еврейское слово может обозначать установленные практики или обычаи, а не только формальные постановления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי
  choice: И соблюдайте данное Мною повеление
  rationale: Однокоренные формы שׁמר и מִשְׁמֶרֶת передают требование хранить и исполнять вверенное обязательство. Русское «соблюдайте данное Мною повеление» естественно выражает эту правовую и заветную силу без тяжеловесного повтора.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: не следуйте
  rationale: Конструкция выражает цель или предотвращение. В сочетании с обычаями глагол «следовать» естественно передаёт устойчивую практику, а двоеточие сохраняет смысловое отношение к предшествующему повелению.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: ни одному из мерзостных обычаев[a]
  rationale: Предлог מִן имеет разделительно-партитивное значение, переданное словами «ни одному из». חֻקּוֹת может обозначать как установления, так и укоренившиеся обычаи; в данном контексте речь идёт о практиках прежних жителей. תּוֹעֵבֹת сохраняет сильную нравственно-культовую оценку в слове «мерзостных».
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: которым следовали до вас
  rationale: Пассивная форма указывает на практики, существовавшие прежде Израиля. «До вас» передаёт временной смысл выражения לִפְנֵיכֶם, а не пространственный.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: и не оскверняйте себя ими
  rationale: Форма глагола имеет возвратный смысл, а בָּהֶם указывает средство или причину осквернения. Выражение сохраняет как нравственный, так и ритуальный оттенок нечистоты.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Я — Яхве, ваш Бог
  rationale: Сохранено заветное имя יהוה посредством общепринятой русской транслитерации «Яхве» и торжественная формула самоидентификации.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит личное заветное имя Бога. Транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי.
- issue: Нравственно-культовая сила הַתּוֹעֵבֹת
  choice: мерзостных
  alternative: отвратительных
  rationale: «Мерзостных» передаёт резко отрицательную оценку исходного слова и не уточняет сверх текста, относится ли осуждение преимущественно к культовой или нравственной сфере.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным правовым звучанием. Императивное «соблюдайте» естественно передаёт директивную силу еврейской формы; лексическая неоднозначность חֻקּוֹת сохранена в примечании.
