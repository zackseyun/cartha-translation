source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: ru
  text: 'Соблюдайте же Мои постановления и Мои законы: человек[a], исполняющий их, будет жить благодаря им[b]. Я — Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово «человек» стоит в единственном числе, но имеет обобщённый смысл: речь идёт о любом человеке, который исполняет эти предписания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет жить в них». Еврейский предлог может указывать как на средство («благодаря им», «посредством них»), так и на сферу жизни («в них»).'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Соблюдайте же
  rationale: Форма с союзом в данном законодательном контексте имеет повелительное значение. «Соблюдайте» передаёт заветный смысл שמר, а частица «же» естественно связывает стих с предшествующим наставлением.
- source_word: חֻקֹּתַי
  choice: Мои постановления
  rationale: חקות обозначает предписанные установления; «постановления» сохраняет официальный правовой оттенок и отличается от следующего термина.
- source_word: מִשְׁפָּטַי
  choice: Мои законы
  rationale: משפטים здесь означает правовые нормы или установленные законы. Выбор сохраняет юридический смысл и образует естественную для современного русского языка пару с «постановлениями».
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם
  choice: исполняющий их
  rationale: Причастный оборот естественно передаёт краткую еврейскую относительную конструкцию и сохраняет конкретный смысл עשה — исполнять предписания.
- source_word: הָאָדָם
  choice: человек
  rationale: Существительное употреблено в единственном числе как обобщённое обозначение представителя человеческого рода. Русское «человек» сохраняет число и не сужает смысл до одного конкретного мужчины.
- source_word: וָחַי
  choice: будет жить
  rationale: Прямой перевод сохраняет обещание жизни, не уточняя сверх текста, идёт ли речь о земной, заветной или вечной жизни.
- source_word: בָּהֶם
  choice: благодаря им
  rationale: Так передаётся возможное инструментальное значение предлога ב и избегается неестественное или двусмысленное русское «жить ими». Возможное значение сферы — «в них» — отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Смысл выражения «будет жить благодаря им»
  choice: Сохранить широкое обещание жизни без уточнения её вида.
  alternative: Получит вечную жизнь через исполнение законов; будет благополучно жить в земле.
  rationale: Еврейский текст не определяет точный объём понятия жизни. Перевод не должен заранее разрешать богословское напряжение, которое сохраняется и в последующем употреблении стиха.
- issue: Обобщённое значение הָאָדָם
  choice: человек
  alternative: мужчина; всякий; любой человек
  rationale: В контексте это не конкретный мужчина, а единичная форма с представительским значением. «Человек» точно и естественно сохраняет такую обобщённость.
- issue: Значение предлога ב в בָּהֶם
  choice: благодаря им
  alternative: в них
  rationale: Инструментальное прочтение хорошо согласуется с контекстом, но еврейский предлог допускает также понимание законов как сферы жизни; поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис сделан естественным для обычного читателя; ключевые юридические термины разграничены, а неоднозначность בָּהֶם и широкий смысл обещанной жизни сохранены посредством сноски.
