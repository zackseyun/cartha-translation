  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: ru
  text: Не приближайся к женщине во время её менструальной нечистоты, чтобы открыть её наготу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во время её менструальной ритуальной нечистоты». В еврейском тексте употреблена лексика ритуальной чистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה ... לֹא תִקְרַב
  choice: Не приближайся к женщине
  rationale: Сочетание אֶל с קָרַב передаёт направленное приближение; в контексте половых запретов выражение имеет сексуальный смысл, но перевод сохраняет эвфемистическую форму оригинала. אִשָּׁה здесь естественно понимать как обобщённое «женщина», а не обязательно «жена».
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: во время её менструальной нечистоты
  rationale: נִדָּה обозначает связанное с менструацией состояние, а טֻמְאָה — категорию ритуальной нечистоты. Формулировка сохраняет культовую лексику Левита и не сводит её к медицинскому состоянию.
- source_word: לְ/גַלּוֹת עֶרְוָתָהּ
  choice: чтобы открыть её наготу
  rationale: Буквально и последовательно передаёт устойчивый юридический эвфемизм «открыть наготу» в Левите 18, не заменяя его более явным толкованием.
theological_decisions:
- issue: Следует ли передавать טֻמְאָה как ритуальную нечистоту или как чисто физиологическое состояние
  choice: менструальная нечистота
  alternative: менструация; месячные
  rationale: В Левите טֻמְאָה принадлежит языку ритуальной чистоты. «Нечистота» сохраняет категорию исходного текста, не приписывая женщине нравственной вины.
- issue: Нужно ли раскрыть сексуальный эвфемизм לְגַלּוֹת עֶרְוָתָהּ
  choice: сохранить выражение «открыть её наготу»
  alternative: вступить с ней в половую связь
  rationale: Исходный текст выражается эвфемистически. Более прямой перевод устранил бы образность и мог бы сузить или преждевременно разрешить смысловую напряжённость формулировки.
translation_notes:
  register: Современный литературный русский язык с краткой юридической формой повеления. Сохранены характерный для главы эвфемизм «открыть наготу» и ритуальная категория «нечистота».
