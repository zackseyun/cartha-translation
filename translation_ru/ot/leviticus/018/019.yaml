  source_fidelity: 'Текст точно передаёт еврейскую конструкцию запрета: «не приближайся к женщине» соответствует וְאֶל־אִשָּׁה לֹא תִקְרַב; временно-состоянийное «во время её менструальной нечистоты» адекватно בְּנִדַּת טֻמְאָתָהּ; «чтобы открыть её наготу» сохраняет инфинитив цели и устойчивый юридический эвфемизм לְגַלּוֹת עֶרְוָתָהּ. Единственное число повеления («не приближайся») соответствует форме еврейского глагола.'
