source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: ru
  text: Не поступайте так, как поступают в земле Египетской[a], где вы жили, и не поступайте так, как поступают в земле Ханаанской, куда Я привожу вас. Не следуйте их установлениям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по делам земли Египетской»; то же выражение далее употреблено о земле Ханаанской. Речь идёт о принятых у жителей этих земель способах поведения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не живите по их обычаям». Буквально: «не ходите в их установлениях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: так, как поступают
  rationale: Еврейское выражение буквально говорит о «делах» земли, то есть о принятом у её жителей образе действий. Этот перевод естественно передаёт сравнение и не превращает запрет в абстрактное суждение о культуре вообще.
- source_word: אֶרֶץ מִצְרַיִם / אֶרֶץ כְּנַעַן
  choice: земля Египетская / земля Ханаанская
  rationale: Сохраняется географический акцент еврейской конструкции; такая форма понятна и уместна в современном литературном библейском регистре.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: где вы жили
  rationale: Ясно и естественно передаёт относительное предложение и завершённый период пребывания Израиля в Египте.
- source_word: לֹא תַעֲשׂוּ
  choice: не поступайте
  rationale: В контексте запрета глагол означает не отдельное «делать», а действовать определённым образом; повелительная форма естественна для русского законодательного текста.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: куда Я веду вас
  rationale: Передаёт направленность движения и продолжающееся либо близкое действие причастной формы מֵבִיא без излишнего уточнения времени.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: их установлениям
  rationale: «Установления» сохраняет нормативный оттенок חֻקּוֹת и допускает значение закрепившихся обычаев, не сводя слово только к официальным законам.
- source_word: לֹא תֵלֵכוּ
  choice: не следуйте
  rationale: Естественно передаёт еврейскую метафору хождения как образа поведения. Буквальное «не ходите по» в современном русском здесь звучит неясно.
theological_decisions:
- issue: Относится ли запрет к самой земле или к поведению её жителей
  choice: так, как поступают в земле Египетской / Ханаанской
  alternative: по делам земли Египетской / Ханаанской
  rationale: В еврейском тексте «дела» грамматически отнесены к земле, но смыслом являются практики её населения. Перевод раскрывает подразумеваемых деятелей, не добавляя оценки всех сторон их культуры.
- issue: Передача חֻקֹּתֵיהֶם как нормативных предписаний или обычаев
  choice: установления
  alternative: обычаи; постановления
  rationale: «Установления» удерживает юридико-нормативную силу слова и его контраст с Божьими установлениями в ближайшем контексте, сохраняя при этом возможность понимать его как укоренившиеся нормы поведения.
- issue: Сохранение метафоры хождения в לֹא תֵלֵכוּ
  choice: не следуйте
  alternative: не ходите по; не живите по
  rationale: Выбранная формулировка передаёт поведенческий смысл метафоры без неестественной буквальности и не сужает запрет до одного лишь образа жизни.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор исходного текста сохранён ради ритма и силы запрета; синтаксис остаётся доступным обычному читателю.
