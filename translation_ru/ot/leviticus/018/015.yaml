  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: ru
  text: 'Не открывай наготу[a] своей невестки: она — жена твоего сына; не открывай её наготу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «открывать наготу» — повторяющийся в Левите юридический эвфемизм, обозначающий запрещённые половые отношения.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: наготы
  rationale: Существительное עֶרְוָה в устойчивом обороте «открывать наготу» обозначает в Левите 18 запрещённые половые отношения. Буквальный образ сохраняет юридическую формулу и её повторяемость в главе.
- source_word: כַּלָּתְךָ
  choice: своей невестки
  rationale: Форма с суффиксом 2-го лица мужского рода единственного числа прямо означает невестку адресата, то есть жену его сына.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: не открывай
  rationale: Пиэль глагола גלה с עֶרְוָה образует повторяющуюся запретительную формулу. Русское «не открывай наготы» сохраняет как повелительную юридическую силу, так и эвфемистический характер оригинала.
- source_word: אֵשֶׁת בִּנְךָ
  choice: жена твоего сына
  rationale: Пояснительная именная конструкция непосредственно определяет названную женщину через её брачное отношение к сыну адресата.
- source_word: הִוא
  choice: она
  rationale: Местоимение имеет отождествляющую, пояснительную функцию; в русском естественно передаётся конструкцией «она жена твоего сына».
- source_word: עֶרְוָתָהּ
  choice: её наготы
  rationale: Повтор слова «нагота» сохраняет намеренный повтор еврейского юридического стиля и связь с формулой всей главы.
theological_decisions:
- issue: Передача эвфемизма «открывать наготу» в запрете половых отношений
  choice: Сохранить оборот «открывать наготу».
  alternative: «вступать в половые отношения»; «иметь половую связь»
  rationale: Еврейский текст использует устойчивый юридический эвфемизм, повторяющийся по всей главе. Его сохранение не сужает выражение до одной современной формулировки и передаёт взаимосвязь запретов внутри текста.
translation_notes:
  register: Современный литературный русский с сохранением краткого, торжественного языка законодательного текста. Форма «не открывай» естественнее для прямого запрета, чем архаичное «не открывай наготы у». Термин «невестка» уточняется самим текстом как жена сына.
