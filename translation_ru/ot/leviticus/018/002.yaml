source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: ru
  text: '«Обратись к сынам Израиля и скажи им: „Я — Яхве, ваш Бог“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: Императив вводит повеление Моисею обратиться к народу с последующей прямой речью; по-русски «обратись… и скажи» естественнее, чем тавтологическое «говори… и скажи».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено буквальное родственно-заветное выражение «сыны Израиля», которое здесь совокупно обозначает народ Израиля.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Прямо передаёт продолжение повеления и вводит дословно сообщаемые слова.
- source_word: אֲנִי
  choice: Я —
  rationale: Самостоятельное местоимение передано именной конструкцией с тире, естественной для торжественной формулы самоотождествления в русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Форма אֱלֹהִים относится к единому Богу Яхве, а суффикс второго лица мужского рода множественного числа передан словом «ваш».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное заветное имя. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: детям Израиля; израильтянам
  rationale: Сохранён явно мужской родственно-заветный образ исходного текста без устранения его совокупного значения для народа.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Конструкция «обратись… и скажи» устраняет неестественное русское повторение, сохраняя два еврейских глагола. «Сыны Израиля» намеренно оставлено как библейское заветное выражение; «Яхве» передаёт личное имя.
