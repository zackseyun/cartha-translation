  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: ru
  text: И не бери в жёны женщину в дополнение к её сестре, чтобы сделать её соперницей и открыть её наготу при жизни её сестры[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не бери женщину в дополнение к её сестре, чтобы сделать её соперницей». Еврейская фраза очень сжата; речь идёт о том, чтобы при жизни жены взять в жёны также её сестру.'
    reason: Лексико-синтаксическая альтернатива и пояснение компактного еврейского оборота.
lexical_decisions:
- source_word: וְאִשָּׁה אֶל אֲחֹתָהּ
  choice: И не бери в жёны сестру своей жены
  rationale: Буквально сочетание говорит о взятии женщины к её сестре. В контексте брачного запрета естественный русский требует явно выразить брачные отношения, не меняя предмет запрета.
- source_word: לֹא תִקָּח
  choice: не бери
  rationale: Обычная формула законодательного запрета; в сочетании «брать в жёны» сохраняет юридический смысл и звучит естественно по-русски.
- source_word: לִצְרֹר
  choice: делая её соперницей
  rationale: Инфинитив от צרר здесь указывает на создание соперничества между сёстрами. Формулировка сохраняет результативный смысл и компактность еврейского текста.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: не открывай её наготы
  rationale: Сохранён характерный для Левита эвфемистический оборот, обозначающий половую связь, ради последовательности и прозрачности по отношению к оригиналу.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: при жизни сестры
  rationale: Выражение ограничивает запрет временем жизни первой сестры; явное существительное устраняет неясность русского местоимения, не расширяя смысла.
theological_decisions:
- issue: 'Объём запрета: брак с двумя сёстрами и срок его действия'
  choice: Запрещено брать сестру жены в качестве дополнительной жены при жизни первой сестры.
  alternative: Запрещён брак с двумя сёстрами при любых обстоятельствах, в том числе после смерти первой; либо запрещён вообще всякий брак, вызывающий соперничество.
  rationale: Фразы לִצְרֹר и בְּחַיֶּיהָ непосредственно связывают запрет с соперничеством сестёр и временем жизни первой жены. Перевод не распространяет норму за пределы прямо сказанного.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Выражение «брать в жёны» естественно обозначает брак, а традиционный библейский эвфемизм «открывать наготу» сохранён без натуралистической конкретизации.
