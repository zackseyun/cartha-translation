  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: ru
  text: 'Не открывай наготы дочери жены твоего отца, рождённой от твоего отца: она твоя сестра; не открывай её наготы.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть единокровная сестра. Буквально: «она твоя сестра»; предшествующее описание уточняет степень родства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: наготы / её наготы
  rationale: В Левите 18 это устойчивый оборот в формулах запрета половой связи. «Открывать наготу» сохраняет юридико-идиоматическую форму еврейского текста и согласованность внутри главы.
- source_word: בַּת אֵשֶׁת אָבִיךָ
  choice: дочери жены твоего отца
  rationale: Буквальное обозначение родства сохраняет структуру источника. Перевод «дочери твоей мачехи» был бы более истолковывающим и мог бы сузить выражение.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: рождённой от твоего отца
  rationale: Оборот указывает на происхождение по отцу. Такая формулировка естественна по-русски и передаёт биологическое родство без излишней архаичности.
- source_word: אֲחוֹתְךָ הִוא
  choice: она твоя сестра
  rationale: Сохранено прямое наименование из еврейского текста без добавления «единокровная»; точный характер родства уже определён предшествующим описанием.
- source_word: לֹא תְגַלֶּה
  choice: не открывай
  rationale: Естественная русская форма прямого законодательного запрета, соответствующая еврейской конструкции с отрицанием и имперфектом.
theological_decisions:
- issue: Следует ли прямо назвать эту женщину единокровной сестрой
  choice: В основном тексте оставлено «она твоя сестра»
  alternative: «она твоя единокровная сестра»
  rationale: Еврейский текст использует общее слово «сестра», а предшествующее описание уточняет родство. Добавление «единокровная» разъясняет подразумеваемое, но выходит за пределы прямой формулировки источника.
translation_notes:
  register: Современный литературный русский с сохранением краткого, торжественного регистра законодательного текста. Традиционный библейский оборот «открывать наготу» оставлен ради точности и согласованности формул Левита 18; местоименные инверсии умеренно поддерживают достоинство стиля без чрезмерной архаизации.
