  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: ru
  text: Ибо все, кто совершит хотя бы одну из этих мерзостей, будут отсечены из среды своего народа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут преданы смерти» или «будут исключены из общины». В еврейском тексте сказано: «будут отсечены»; точный характер этого наказания не уточняется.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит обоснование предшествующих запретов; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: כָּל אֲשֶׁר
  choice: всякий, кто
  rationale: 'Передаёт неопределённо-универсальное значение сочетания: любой человек, который совершит указанное.'
- source_word: יַעֲשֶׂה
  choice: совершит
  rationale: В контексте поступков «совершит» звучит естественнее буквального «сделает», не добавляя специального богословского смысла.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: какую-либо из всех этих мерзостей
  rationale: Сохраняет как разделительное значение предлога מִן, так и всеохватность כֹּל.
- source_word: תּוֹעֵבוֹת
  choice: мерзостей
  rationale: «Мерзость» сохраняет сильную нравственно-религиозную оценку еврейского существительного и уместно для законодательного контекста.
- source_word: וְנִכְרְתוּ
  choice: будут истреблены
  rationale: Русское библейско-правовое выражение передаёт образ отсечения и не уточняет конкретный способ наказания.
- source_word: הַנְּפָשׁוֹת
  choice: люди
  rationale: В данном правовом контексте נֶפֶשׁ обозначает отдельных людей, а не отделённые от тела «души».
- source_word: הָעֹשֹׂת
  choice: совершающие их
  rationale: Причастная конструкция сохраняет повтор исходного текста и связывает виновных с уже названными мерзостями.
- source_word: מִקֶּרֶב עַמָּם
  choice: из среды своего народа
  rationale: Передаёт устойчивую формулу принадлежности к народу и последующего удаления из его среды; единственное «своего народа» естественно по-русски при собирательном отнесении.
theological_decisions:
- issue: Значение формулы וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: будут истреблены из среды своего народа
  alternative: будут преданы смерти; будут исключены из общины
  rationale: Еврейская формула сама по себе не уточняет, идёт ли речь о прямом Божьем суде, смертной казни, изгнании или ином отсечении. Основной текст сохраняет образную правовую формулу, а примечание обозначает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксический повтор «совершит — совершающие» сохранён как черта оригинала; тире помогает ясно прочитать переход от единственного универсального субъекта к множественному обозначению виновных.
