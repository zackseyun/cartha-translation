revisions:
- from: Ведь всякий, кто совершит какую-либо из всех этих мерзостей, — люди, совершающие их, будут истреблены из среды своего народа.[a]
  to: Ибо все, кто совершит хотя бы одну из этих мерзостей, будут отсечены из среды своего народа.[a]
  rationale: Перевод исправлен для сохранения юридической и богословской неопределённости еврейской формулы «будут отсечены». Одновременно устранены неестественная смена числа и тяжеловесная конструкция с «какую-либо из всех». Сноска привязана к формуле наказания и поясняет варианты, не выдавая ни один из них за единственно установленный смысл.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:55Z'
review_pass:
  verdict: revise
  source_fidelity: Смысловой охват, причинно-пояснительный союз и отсылка к названным деяниям в целом переданы верно. Однако «будут истреблены» в современном русском преимущественно означает физическое уничтожение и тем самым чрезмерно конкретизирует еврейскую формулу וְנִכְרְתוּ, намеренно не уточняющую способ наказания. Это также расходится с примечанием, которое верно отмечает неопределённость формулы.
  naturalness: Исходное построение «всякий, кто совершит…, — люди, совершающие их, будут…» синтаксически тяжеловесно и создаёт неестественный разрыв между единственным и множественным числом. Плюральная конструкция «все, кто…» естественна для современного литературного русского и передаёт универсальность исходного выражения.
  terminology: «Мерзости» уместно передаёт תּוֹעֵבוֹת в данном законодательном контексте. Для כרת следует сохранить образную, нерасшифрованную формулу «будут отсечены», а возможные конкретизации оставить в сноске. «Из среды своего народа» сохраняет общественный аспект еврейской формулы.
  issues:
  - severity: high
    issue: «Будут истреблены» конкретизирует неопределённую формулу наказания.
    rationale: В современном русском «истребить» обычно обозначает уничтожение или умерщвление. Еврейское «будут отсечены» не устанавливает в самом стихе, является ли мерой казнь, изгнание или иной суд.
  - severity: medium
    issue: Синтаксическое несогласование «всякий, кто… — люди…».
    rationale: Фраза не отвечает нормам плавного современного литературного русского; переход к множественному числу лучше передать конструкцией «все, кто…».
  - severity: low
    issue: «Какую-либо из всех этих мерзостей» неестественно по-русски.
    rationale: «Хотя бы одну из этих мерзостей» идиоматично выражает совершение любого отдельного деяния из перечисленных, не сужая объём запрета.
  revised_text: Ибо все, кто совершит хотя бы одну из этих мерзостей, будут отсечены из среды своего народа.[a]
