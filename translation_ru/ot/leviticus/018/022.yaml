  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: ru
  text: 'Не ложись с мужчиной так, как с женщиной[a]: это мерзость.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «ложа женщины» (мн. ч.) — идиоматическое обозначение полового сношения с женщиной.'
