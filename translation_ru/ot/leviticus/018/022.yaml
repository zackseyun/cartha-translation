lexical_decisions:
- source_word: זָכָר
  choice: мужчина
  rationale: Еврейское слово обозначает лицо мужского пола. «Мужчина» — наиболее естественный и достойный русский эквивалент в данном контексте; более буквальное «лицо мужского пола» звучало бы канцелярски и неуместно.
- source_word: תִשְׁכַּב
  choice: не ложись
  rationale: Форма глагола שׁכב в этом законодательном контексте является сексуальным эвфемизмом. «Не ложись» сохраняет образность и лаконизм еврейского текста, а продолжение ясно указывает на половое сношение.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: как ложатся с женщиной
  rationale: Буквально выражение означает «ложами женщины», но это идиома полового сношения с женщиной. Выбранная формулировка естественна по-русски, сохраняет сравнение исходного текста и не делает перевод более узким или более широким.
- source_word: תּוֹעֵבָה
  choice: мерзость
  rationale: «Мерзость» передаёт сильную отрицательную оценку תּוֹעֵבָה в контексте закона о святости и соответствует укоренившейся русской библейской лексике.
- source_word: הִוא
  choice: это
  rationale: Местоимение относится к названному запрещённому действию; русское «это мерзость» естественно выражает данное именное сказуемое.
theological_decisions:
- issue: Объём запрета в контексте закона о святости
  choice: Передать стих как прямой запрет мужчине ложиться с мужчиной так, как ложатся с женщиной, не добавляя отсутствующих в тексте ограничений.
  alternative: Сузить запрет до культовой, насильственной, возрастной или иной особой практики либо обобщить его современной терминологией.
  rationale: Сам еврейский текст не содержит уточнений, ограничивающих запрет конкретным культовым или эксплуататорским случаем. Вместе с тем перевод не должен вводить более широкую современную категорию вместо конкретной формулировки стиха.
translation_notes:
  register: Современный литературный русский язык с лаконичной законодательной формой. Формулировка сохраняет эвфемизм оригинала, но остаётся понятной; двоеточие естественно связывает запрет с его оценкой.
