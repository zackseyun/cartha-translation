source:
  edition: WLC
  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: ru
  text: Так земля осквернилась[a], и Я взыскал с неё за её беззаконие[b], и земля изрыгнула своих жителей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стала нечистой». Еврейский глагол может обозначать как наступление нечистоты, так и осквернение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я посетил её беззаконие на ней» — еврейский оборот, означающий, что Бог призвал её к ответу и подверг суду.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «изрыгнула». Резкий образ рвоты показывает, как земля исторгает своих жителей из-за осквернения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: осквернилась
  rationale: Глагол טמא описывает землю как ставшую нечистой вследствие мерзостей, названных в контексте. «Осквернилась» естественно передаёт как наступившее состояние нечистоты, так и нравственно-ритуальный оттенок.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте Левита 18 речь идёт о конкретной земле, земле Ханаана, а не обо всей земле как мире.
- source_word: וָאֶפְקֹד
  choice: взыскал
  rationale: В сочетании с עָוֹן глагол פקד означает привлечение к ответу и карательное воздаяние. «Взыскал» сохраняет судебный оттенок и прямое действие Бога, не превращая образное выражение в буквальное «посетил».
- source_word: עֲוֺנָהּ
  choice: её беззаконие
  rationale: עָוֹן может обозначать беззаконие, вину или её последствия. «Беззаконие» сохраняет нравственную тяжесть слова и намеренную персонификацию земли.
- source_word: עָלֶיהָ
  choice: с неё
  rationale: В русском оборот «взыскать с кого-либо за что-либо» естественно передаёт значение еврейского сочетания פקד עון על — призвать виновного к ответу и подвергнуть суду.
- source_word: וַתָּקִא
  choice: изрыгнула
  rationale: קיא буквально обозначает рвоту. «Изрыгнула» сохраняет резкую телесную метафору изгнания жителей и при этом соответствует достоинству литературного русского языка.
- source_word: יֹשְׁבֶיהָ
  choice: своих жителей
  rationale: Причастная форма от ישב обозначает живущих в земле людей. Возвратное притяжательное местоимение естественно по-русски соотносит жителей с подлежащим «земля».
theological_decisions:
- issue: Олицетворение земли как осквернённой и изрыгающей жителей
  choice: 'Сохранить конкретный образ: «земля изрыгнула своих жителей».'
  alternative: «Земля изгнала своих жителей».
  rationale: Еврейский текст намеренно представляет землю как телесно реагирующую на осквернение. Сохранение метафоры удерживает связь между грехом, нечистотой, Божьим судом и изгнанием.
- issue: Смысл выражения וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: Передать как «Я взыскал с неё за её беззаконие».
  alternative: '«Я наказал её за её беззаконие»; буквально: «Я посетил её беззаконие на ней».'
  rationale: Выбранный оборот ясно обозначает Божий суд и ответственность, но сохраняет судебно-идиоматический характер исходного выражения, не сводя многозначное עָוֹן исключительно к поступку или исключительно к вине.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Взыскал» сохраняет судебную серьёзность без архаического буквального оборота, а «изрыгнула» передаёт намеренно резкую метафору оригинала.
