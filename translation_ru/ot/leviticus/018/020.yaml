  text: וְ/אֶל אֵ֨שֶׁת֙ עֲמִֽיתְ/ךָ֔ לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/זָ֑רַע לְ/טָמְאָה בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: ru
  text: Не вступай в половую связь[a] с женой своего ближнего, чтобы не оскверниться ею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «не отдавай жене своего ближнего своего излияния как семени».'
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: с женой своего ближнего
  rationale: В данном правовом контексте עָמִית обозначает другого члена общины. «Жена своего ближнего» точно передаёт отношение и естественно звучит в русском библейском тексте.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: Не вступай в половую связь
  rationale: Еврейское выражение буквально описывает передачу семенного излияния, но в контексте служит обозначением полового сношения. Смысловой перевод ясно передаёт запрет, а буквальный образ сохранён в сноске.
- source_word: לְטָמְאָה בָהּ
  choice: чтобы не оскверниться ею
  rationale: Инфинитив выражает связанное с поступком осквернение адресата; русская конструкция сохраняет возможный оттенок цели или следствия, не ограничивая речь исключительно обрядовой нечистотой.
theological_decisions:
- issue: Характер запрета и значение осквернения
  choice: Запрещается половая связь с женой ближнего, влекущая осквернение адресата.
  alternative: Сохранить в основном тексте буквальное упоминание семенного излияния или передать итог только как обрядовую нечистоту.
  rationale: Идиома обозначает половое сношение, тогда как заключительная фраза прямо говорит об осквернении. Перевод не сужает טמא до исключительно ритуальной категории и сохраняет буквальный образ в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским словом «ближний». Формулировка ясная и достойная; эвфемистическая еврейская идиома раскрыта в основном тексте, а её буквальный образ вынесен в сноску.
