  text: עֶרְוַ֥ת אֵֽשֶׁת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/008.yaml
  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: ru
  text: 'Не открывай наготы жены твоего отца[a]: это нагота твоего отца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более прямо: «Не вступай в половую связь с женой твоего отца». Буквально по-еврейски: «не открывай наготы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: наготы
  rationale: В Левите 18 это слово входит в устойчивую юридическую формулу «открывать наготу», служащую эвфемистическим обозначением половой связи. Буквальная передача сохраняет повторяющуюся формулу главы.
- source_word: אֵשֶׁת אָבִיךָ
  choice: жены твоего отца
  rationale: Существительное אֵשֶׁת в сопряжённой конструкции обозначает именно жену отца. Такой порядок слов естественен для современного литературного русского языка и сохраняет юридически значимое родство.
- source_word: לֹא תְגַלֵּה
  choice: не открывай
  rationale: Отрицательная форма глагола в законодательном контексте выражает запрет. Русский запретительный императив звучит ясно и достойно, сохраняя метафору исходного текста.
- source_word: אָבִיךָ
  choice: твоего отца
  rationale: Прямая передача притяжательной конструкции; повтор сохранён в обеих частях стиха.
- source_word: הִוא
  choice: это
  rationale: Местоимение относится к грамматически женскому עֶרְוַת («нагота»). В русском итоговая конструкция «это нагота твоего отца» естественнее, чем личное «она».
theological_decisions:
- issue: Следует ли раскрыть эвфемизм как прямой запрет половой связи
  choice: Сохранить в основном тексте формулу «открывать наготу»
  alternative: Не вступай в половую связь с женой твоего отца
  rationale: Исходный текст использует повторяющуюся в главе юридическую формулу. Её сохранение передаёт эвфемистический регистр и внутреннюю связность текста, а явное истолкование уместно вынести в примечание.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественно-юридической краткости. Формула «открывать наготу» намеренно сохранена как ключевой эвфемизм главы; архаическое «не открывай наготы» здесь остаётся понятным и обеспечивает формальную связность.
