  edition: WLC
  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: ru
  text: Исполняйте Мои законы и соблюдайте Мои постановления, поступая по ним.[a] Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ходя в них» — древнееврейский образ постоянной жизни и поведения согласно этим предписаниям.'
    reason: Сохранить исходную метафору и пояснить её идиоматический смысл.
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: Мои законы
  rationale: מִשְׁפָּט в данном правовом контексте обозначает обязательные правовые нормы или решения. «Законы» естественно передаёт юридическую силу слова и сохраняет отличие от חֻקֹּתַי.
- source_word: תַּעֲשׂוּ
  choice: исполняйте
  rationale: Буквально עשה означает «делать», однако применительно к законам современное русское «исполнять» точно и естественно выражает требование осуществлять их на деле.
- source_word: חֻקֹּתַי
  choice: Мои постановления
  rationale: חֻקָּה обозначает предписанное установление или постановление. Этот вариант сохраняет юридический оттенок и не сливает термин с מִשְׁפָּטַי.
- source_word: תִּשְׁמְרוּ
  choice: соблюдайте
  rationale: שׁמר буквально связано с хранением и обереганием, а в контексте заповедей означает их тщательное соблюдение. «Соблюдайте» — естественное русское соответствие.
- source_word: לָלֶכֶת בָּהֶם
  choice: поступая по ним
  rationale: Буквально выражение означает «ходить в них», но это древнееврейская идиома образа жизни и поведения. «Поступая по ним» передаёт её этический смысл, а исходная метафора отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Форма с суффиксом второго лица множественного числа прямо означает «ваш Бог» и выражает отношения Бога с обращённым к Нему народом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл לָלֶכֶת בָּהֶם
  choice: поступая по ним
  alternative: ходя в них; живя по ним
  rationale: Выражение описывает постоянное поведение в соответствии с Божьими предписаниями. Основной текст передаёт идиоматический смысл без неестественной для современного русского кальки; буквальный образ сохранён в сноске. Вариант «живя по ним» мог бы сильнее сблизить эту фразу с последующим утверждением о жизни в Лев 18:5.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным повелительным тоном. Пара «законы / постановления» сохраняет различие двух правовых терминов; прописные местоимения при обращении к Богу поддерживают традиционный библейский регистр без архаизации.
