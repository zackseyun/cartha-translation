translation:
  language: ru
  text: чтобы земля не извергла вас, когда вы оскверните её,[a] как она извергла народ, живший здесь до вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не изрыгнула вас». Еврейский текст использует яркий образ земли, исторгающей жителей из-за её осквернения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: извергла / извергла
  rationale: Глагол сохраняет яркий образ земли, которая исторгает из себя осквернивших её жителей. «Извергать» передаёт этот образ естественнее для достойного современного русского текста, чем буквальное «вырвать».
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте речь идёт о конкретной земле Ханаана, а не обо всей планете.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: когда вы оскверните её
  rationale: Предлог ב при инфинитиве допускает временное и обстоятельственное понимание. Эта передача естественно выражает предупреждение и сохраняет значение намеренного приведения земли в состояние нечистоты.
- source_word: הַגּוֹי
  choice: народ
  rationale: Собирательное существительное в единственном числе обозначает прежних жителей земли как одну этническую общность. В данном контексте русское «народ» естественнее, чем «нация», и не привносит позднейших оттенков слова «язычники».
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: живший здесь до вас
  rationale: Фраза указывает на народ, населявший эту землю прежде Израиля. Добавленное «здесь» делает пространственно-временную связь ясной без изменения смысла.
- source_word: וְלֹא
  choice: чтобы ... не
  rationale: Хотя формально выражение означает «и не», в контексте оно продолжает предостережение как отрицательное следствие или цель. «Чтобы ... не» естественно передаёт эту связь по-русски.
theological_decisions:
- issue: Олицетворение земли как действующего лица суда
  choice: 'Сохранить землю грамматическим субъектом: она «извергает» жителей.'
  alternative: Передать отвлечённо как изгнание, которое Бог совершает посредством земли.
  rationale: Еврейский текст прямо олицетворяет землю как реагирующую на осквернение. Сохранение образа передаёт богословскую связь между нравственной нечистотой, осквернением земли и изгнанием, не уточняя сверх текста вопрос о непосредственном действующем лице.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Яркая метафора оригинала сохранена, но избегнуто физиологически разговорное «вырвать». Повтор глагола оставлен для соответствия еврейской риторике.
