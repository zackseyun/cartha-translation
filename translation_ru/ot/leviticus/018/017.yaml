id: LEV.18.17
reference: Leviticus 18:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: ru
  text: 'Не открывай наготы женщины и её дочери[a]. Не бери себе ни дочери её сына, ни дочери её дочери, чтобы открыть её наготу: они — её близкие родственницы[b]. Это разврат[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Открыть наготу» — древнееврейское выражение, обозначающее вступление в запрещённые сексуальные отношения.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «они — её плоть», то есть её близкая родня.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможные переводы: «гнусное дело», «бесстыдство» или «злодеяние».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה / לְגַלּוֹת עֶרְוָתָהּ
  choice: открывай наготы / открыть её наготу
  rationale: Сохранён характерный для Левита древнееврейский эвфемистический оборот, обозначающий запрещённые сексуальные отношения. Смысл пояснён в сноске, а повторение оборота поддерживает связь частей стиха.
- source_word: אִשָּׁה
  choice: женщины
  rationale: Слово может означать как женщину, так и жену. Более широкое «женщина» не сужает запрет до формально брачных отношений.
- source_word: וּבִתָּהּ
  choice: и её дочери
  rationale: Прямо передаёт сочетание существительного с притяжательным суффиксом, относящимся к названной женщине.
- source_word: תִקַּח
  choice: не бери себе
  rationale: Глагол буквально означает «брать» и в данном контексте может подразумевать вступление в брак или сексуальный союз. Частица «себе» делает выражение естественнее по-русски, не ограничивая его только браком.
- source_word: בַּת בְּנָהּ
  choice: дочери её сына
  rationale: Сохраняет точную структуру родства, то есть внучку женщины по сыну.
- source_word: בַּת בִּתָּהּ
  choice: дочери её дочери
  rationale: Сохраняет точную структуру родства, то есть внучку женщины по дочери.
- source_word: שַׁאֲרָה הֵנָּה
  choice: они — её кровные родственницы
  rationale: Передаёт значение кровного родства понятным современным русским языком. Женский род множественного числа соответствует упомянутым дочерям потомков.
- source_word: זִמָּה
  choice: разврат
  rationale: Слово обозначает нравственно гнусный поступок, особенно сексуального характера. «Разврат» кратко и ясно передаёт здесь сексуально-нравственную оценку.
theological_decisions:
- issue: К кому относится местоименный суффикс в выражении «открыть её наготу»
  choice: Сохранить форму «её», наиболее естественно связывающую суффикс с первоначально названной женщиной
  alternative: Понимать суффикс распределительно как относящийся к каждой из названных внучек
  rationale: Единственное число оригинала не следует разворачивать в толкование. Русская формулировка сохраняет грамматическую связь и вместе с тем не устраняет полностью возможную смысловую напряжённость.
- issue: Значение глагола «брать» в запрете
  choice: «не бери себе», без уточнения, что речь идёт исключительно о браке
  alternative: «не бери в жёны» или «не вступай в половую связь»
  rationale: Древнееврейский глагол шире формального брака, а последующее выражение указывает на сексуальную природу запрета. Такой перевод не сужает область закона.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественно-правового звучания. Формула «открыть наготу» намеренно сохранена ради межтекстовой последовательности внутри Левита и снабжена ясным пояснением. Родственные обозначения переданы раздельно, а не обобщены словом «внучки», чтобы сохранить юридическую точность оригинала.
