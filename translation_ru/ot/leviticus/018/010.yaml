source:
  edition: WLC
  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: ru
  text: Не открывай наготы дочери твоего сына или дочери твоей дочери[a], потому что они — твоя нагота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть внучки как по сыну, так и по дочери.
    reason: clarity_note
  - marker: b
    text: 'Буквально: «они — твоя нагота». Здесь подчёркивается теснейшее родство. Выражение «открывать наготу» в законах этой главы означает вступать в половые отношения.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: нагота
  rationale: Сохраняет повторяющийся юридический эвфемизм главы и необычную формулировку заключительного обоснования; в данном контексте выражение «открывать наготу» означает вступать в половые отношения.
- source_word: בַּת בִּנְךָ
  choice: дочь твоего сына
  rationale: Точно передаёт линию родства по сыну и сохраняет параллелизм еврейского текста.
- source_word: בַת בִּתְּךָ
  choice: дочь твоей дочери
  rationale: Точно передаёт линию родства по дочери и сохраняет симметричную структуру предписания.
- source_word: לֹא תְגַלֶּה
  choice: не открывай
  rationale: Естественная для библейско-правового регистра форма запрета, сохраняющая устойчивую формулу גלה ערוה.
- source_word: כִּי
  choice: потому что
  rationale: Ясно передаёт причинное значение союза.
- source_word: הֵנָּה
  choice: они
  rationale: Женское множественное местоимение относится к обеим названным внучкам; буквальное предикативное построение сохраняет напряжённую образность оригинала.
theological_decisions:
- issue: Смысл заключительной фразы כִּי עֶרְוָתְךָ הֵנָּה («потому что они — твоя нагота»)
  choice: 'Сохранить буквальное родственно-телесное отождествление: «они — твоя нагота».'
  alternative: «Их нагота — твоя собственная» или «они — твоя плоть».
  rationale: Масоретский текст буквально говорит «они — твоя нагота», а не «их нагота — твоя». Такая формулировка выражает теснейшее родство как основание запрета. Буквальный перевод сохраняет неоднозначность и не подменяет образ поясняющим толкованием.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Формула «не открывай наготы» намеренно сохранена ради лексической и композиционной последовательности Левита 18; местоимение «они» не заменено на более гладкое, но менее точное «их нагота».
