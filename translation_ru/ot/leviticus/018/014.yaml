lexical_decisions:
- source_word: עֶרְוַת
  choice: наготы
  rationale: Сохраняет конкретный образ устойчивой юридической формулы «открыть наготу», которая в Левите 18 обозначает запрещённые половые отношения, не заменяя её разъяснительным пересказом.
- source_word: אֲחִי אָבִיךָ
  choice: брата твоего отца
  rationale: Прямо передаёт родственную связь и уточняет, что речь идёт о брате отца, а не о другом дяде.
- source_word: תְגַלֶּה
  choice: не открывай
  rationale: Передаёт запрет и сохраняет повторяющуюся в главе формулу с глаголом «открывать».
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: не приближайся к его жене
  rationale: Сохраняет сдержанный глагол исходного текста и его эвфемистическую силу; сексуальный смысл в данном законодательном контексте пояснён в сноске.
- source_word: דֹּדָתְךָ
  choice: твоя тётя
  rationale: Естественный современный эквивалент термина родства; предшествующая часть стиха уже уточняет, что имеется в виду жена брата отца.
- source_word: הִוא
  choice: она —
  rationale: Передаёт именное сказуемое без добавления причинного союза «ведь» или «потому что», отсутствующего в еврейском тексте.
theological_decisions:
- issue: Передача юридического эвфемизма о запрещённых половых отношениях
  choice: Сохранить в основном тексте формулу «открывать наготу».
  alternative: 'Передать прямо: «вступать в половые отношения».'
  rationale: Так сохраняются образность, межстиховая связь и юридическая формула оригинала, а её значение определяется контекстом главы.
- issue: Смысл глагола «приближаться»
  choice: Сохранить буквальное «не приближайся» и пояснить его контекстуальную сексуальную силу в сноске.
  alternative: 'Перевести истолковательно: «не вступай с его женой в половую связь».'
  rationale: Еврейский текст использует сдержанный глагол, который в данном контексте имеет сексуальный смысл; перевод не должен ни затемнять этот смысл, ни устранять эвфемизм оригинала.
- issue: Определение родства в заключительной фразе
  choice: «она — твоя тётя».
  alternative: «она — жена брата твоего отца».
  rationale: Оригинал употребляет обычное обозначение родства, тогда как точная связь уже названа в предыдущей части стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис остаётся ясным, а формулы «открыть наготу» и «не приближайся» сохраняют сдержанность и образность еврейского текста.
