base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: ru
  text: Не вступай в половую связь ни с каким животным, чтобы оскверниться им[a]. И женщина не должна становиться перед животным, чтобы оно совокупилось с ней[b]. Это извращение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не давай своего лежания, чтобы оскверниться ею»; выражение может также подразумевать излияние семени.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение означает, что животное покрывает женщину, то есть вступает с ней в половую связь.
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может также передавать смысл смешения, бесчиния или нарушения должного порядка.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: ни с каким животным
  rationale: בְּהֵמָה обозначает животное, нередко домашнее, а כָּל при отрицании придаёт запрету всеохватный смысл. «Ни с каким животным» естественно передаёт это по-русски.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: не вступай в половую связь
  rationale: Буквально выражение говорит «не давай своего лежания», но שְׁכָבָה здесь относится к половому акту и, возможно, к излиянию семени. Функционально точная формулировка ясно передаёт запрет, не воспроизводя непонятную русскую кальку.
- source_word: לְטָמְאָה בָהּ
  choice: оскверняя себя этим
  rationale: Корень טמא выражает осквернение или состояние нечистоты. Русское «оскверняя себя» сохраняет нравственно-культовую ёмкость понятия и естественно связывает его с запрещённым действием.
- source_word: וְאִשָּׁה
  choice: и женщина
  rationale: אִשָּׁה употреблено здесь в общем значении «женщина», а не в специальном значении «жена».
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: не должна становиться перед животным
  rationale: Перевод сохраняет конкретный образ еврейского выражения; цель такого положения раскрывается следующим оборотом.
- source_word: לְרִבְעָהּ
  choice: чтобы оно совокупилось с ней
  rationale: Глагольная форма от רבע в данном контексте обозначает покрытие самки животным; женский объектный суффикс показывает, что действие направлено на женщину. Формулировка передаёт эту направленность без грубости.
- source_word: תֶּבֶל
  choice: извращение
  rationale: תֶּבֶל называет тяжёлое нарушение должного порядка, особенно в половой сфере. «Извращение» передаёт оценочную силу слова лучше, чем современное русское «смешение».
- source_word: הוּא
  choice: это
  rationale: Местоимение подводит итог и характеризует описанное действие в целом.
theological_decisions:
- issue: Передача языка нечистоты без сведения его только к обрядовой категории
  choice: оскверняя себя этим
  alternative: чтобы стать нечистым через него
  rationale: Формулировка сохраняет библейскую категорию осквернения, но не навязывает читателю вывод, будто речь идёт исключительно об обрядовой нечистоте.
- issue: Передача תֶּבֶל как оценки нарушения порядка
  choice: извращение
  alternative: смешение; нарушение порядка
  rationale: «Извращение» сохраняет сильную отрицательную оценку текста. В сноске отмечен диапазон значения, чтобы не скрывать смысловую связь с нарушением или смешением установленного порядка.
- issue: Явное обозначение полового смысла эвфемистических еврейских оборотов
  choice: вступай в половую связь; совокупилось с ней
  alternative: давай своё лежание; покрыло её
  rationale: Прямые, но сдержанные русские выражения делают смысл закона понятным и не усиливают его сверх оригинала; буквальная идиома и более узкий оттенок отмечены в сносках.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанный. Половой смысл передан прямо, без архаической кальки «дать своё лежание» и без натуралистической грубости. Повеление мужчине оформлено во втором лице единственного числа, как в еврейском тексте; относящийся к женщине запрет — в третьем лице.
