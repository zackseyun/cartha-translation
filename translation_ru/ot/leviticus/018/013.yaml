  text: Наготы сестры твоей матери не открывай[a], потому что она — близкая родственница[b] твоей матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более прямо: «Не вступай в половую связь с сестрой твоей матери». Буквально по-древнееврейски: «Не открывай наготы сестры твоей матери».'
    reason: lexical_alternative
  - marker: b
    text: '«Близкая родственница» передаёт древнееврейское שְׁאֵר — термин родства, обозначающий близкую кровную родню; буквально: «плоть».'
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: наготы ... не открывай
  rationale: Сохраняет устойчивый юридический эвфемизм главы и его формальный регистр; сексуальный смысл относится ко всему выражению.
- source_word: אֲחוֹת אִמְּךָ
  choice: сестры своей матери
  rationale: Прямо передаёт родственную связь и звучит естественно в формулировке запрета; слово «тётя» было бы менее точным.
- source_word: שְׁאֵר אִמְּךָ
  choice: близкая родственница твоей матери
  rationale: В законах о родстве שְׁאֵר обозначает близкого кровного родственника, буквально связанную общей плотью родню.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит основание запрета.
- source_word: הִוא
  choice: она
  rationale: Сохраняет явно выраженное местоимение и женский род подлежащего.
theological_decisions:
- issue: Передача юридического эвфемизма, обозначающего запрещённую половую связь
  choice: Сохранить в основном тексте выражение «открывать наготу»
  alternative: 'Передать динамически: «вступать в половую связь»'
  rationale: Повторяющийся древнееврейский оборот формирует юридический и литературный язык Левита 18. Буквальная образность сохраняет его эвфемистическую силу, а сноска разъясняет смысл.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Инверсия «наготы ... не открывай» поддерживает библейский юридический ритм, оставаясь понятной. Маркеры сносок поставлены непосредственно после выражений, которые они поясняют.
