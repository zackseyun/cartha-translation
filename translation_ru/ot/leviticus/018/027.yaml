  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: ru
  text: Ведь все эти мерзости совершили жители земли, жившие до вас, и земля стала нечистой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и земля была осквернена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего запрета или предостережения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: все эти мерзости
  rationale: «Мерзости» сохраняет сильную нравственно-религиозную окраску תּוֹעֵבָה, а «эти» передаёт указательное הָאֵל.
- source_word: עָשׂוּ
  choice: совершали
  rationale: В сочетании с «мерзости» русский глагол «совершать» звучит естественнее буквального «делать», не добавляя специального культового значения.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: жители этой земли
  rationale: Сочетание обозначает прежнее население страны коллективно. «Жители» естественно по-русски и не утверждает, что речь исключительно о взрослых мужчинах; «этой» проясняет конкретную землю из контекста.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: жившие до вас
  rationale: Передаёт временное предшествование прежних жителей и естественно присоединяется к слову «жители».
- source_word: וַתִּטְמָא
  choice: стала нечистой
  rationale: Передаёт наступившее состояние нечистоты и сохраняет связь с библейской категорией чистоты, не сводя её только к ритуальному или метафорическому смыслу.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте имеется в виду конкретная страна или территория, а не весь мир; русское «земля» также сохраняет повтор исходного текста.
theological_decisions:
- issue: Характер нечистоты земли
  choice: земля стала нечистой
  alternative: земля была осквернена
  rationale: Выбранный вариант сохраняет богословскую связь между поступками людей и нечистотой земли, не уточняя сверх текста, является ли эта нечистота ритуальной, нравственной или образной.
translation_notes:
  register: Современный литературный русский язык; достоинство библейского стиля сочетается с ясным синтаксисом. Повтор слова «земля» сохранён, а тяжеловесное буквальное «люди земли» заменено естественным «жители этой земли».
