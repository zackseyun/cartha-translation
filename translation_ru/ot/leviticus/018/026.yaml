    rationale: В варианте «не совершайте ... — ни коренной житель, ни пришелец» названные лица стоят в именительном падеже после глагола второго лица множественного числа и не имеют грамматической функции. Требуется явное нормативное сказуемое для «уроженца» и «пришельца».
  - severity: low
    issue: «Коренной житель» менее идиоматичен, чем «уроженец», для הָאֶזְרָח.
    rationale: «Уроженец» прямо обозначает местнорождённого члена сообщества и лучше сохраняет краткость параллельной пары הָאֶזְרָח / הַגֵּר.
