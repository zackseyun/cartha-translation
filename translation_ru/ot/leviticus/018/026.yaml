  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: ru
  text: Вы же соблюдайте Мои постановления и Мои законы; пусть ни уроженец, ни пришелец, живущий среди вас,[a] не совершает ни одной из этих мерзостей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоянно живущий среди вас чужеземец».'
    reason: Поясняет значение הַגֵּר הַגָּר בְּתוֹכְכֶם как некоренного жителя, проживающего внутри общины.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: А вы соблюдайте
  rationale: Глагол שׁמר в правовом контексте означает «соблюдать», а отдельное местоимение אַתֶּם подчёркивает адресатов. Оборот «А вы» естественно передаёт и связь с предыдущим контекстом, и это смысловое выделение.
- source_word: חֻקֹּתַי
  choice: Мои постановления
  rationale: חֻקִּים обозначает установленные предписания; «постановления» сохраняет юридический оттенок и звучит естественно в современном русском языке.
- source_word: מִשְׁפָּטַי
  choice: Мои законы
  rationale: מִשְׁפָּטִים здесь относится к обязательным правовым нормам. «Законы» ясно передаёт юридический смысл и образует естественную пару с «постановлениями».
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל
  choice: и не совершайте ни одной из
  rationale: 'При отрицании сочетание מִן + כֹּל выражает полный запрет: «ни одной из». «Совершать» по-русски естественно сочетается с запрещёнными деяниями и не добавляет значения повторяемости.'
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: этих мерзостей
  rationale: תּוֹעֵבָה выражает сильную моральную и культовую оценку. «Мерзости» сохраняет эту силу и отсылает к перечисленным ранее действиям.
- source_word: הָאֶזְרָח
  choice: коренной житель
  rationale: אֶזְרָח обозначает уроженца, принадлежащего к местному сообществу; «коренной житель» ясно передаёт противопоставление пришельцу.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: пришелец, живущий среди вас
  rationale: גֵּר — не просто кратковременный путник, а некоренной человек, постоянно живущий внутри общины. Традиционное «пришелец» дополнено поясняющим причастным оборотом, который прямо соответствует еврейскому тексту.
theological_decisions:
- issue: Распространение запрета на коренных жителей и некоренных поселенцев
  choice: Оба названных лица — коренной житель и живущий среди общины пришелец — одинаково включены в запрет.
  alternative: Заключительную конструкцию можно понимать просто как уточняющее перечисление адресатов, не выделяя особо идею равенства их обязанностей.
  rationale: Синтаксически הָאֶזְרָח и הַגֵּר параллельно относятся к запрету; перевод сохраняет эту параллель, не добавляя дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский с достоинством правового наставления. Синтаксическая параллель «ни… ни…» сохранена; традиционное слово «пришелец» остаётся понятным благодаря непосредственно следующему пояснению.
