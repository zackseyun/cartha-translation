  source_fidelity: 'Смысловые соответствия в основном точны: חֻקֹּתַי передано как «Мои постановления», מִשְׁפָּטַי как «Мои законы», а תּוֹעֵבוֹת — как «мерзости». Однако в исходном русском тексте заключительные существительные в форме именительного падежа («ни коренной житель, ни пришелец») синтаксически не могут служить продолжением повелительного обращения «вы ... не совершайте». Еврейский текст явно распространяет запрет на обе названные группы; это следует выразить грамматически.'
  naturalness: Сочетание «коренной житель» допустимо, но в данном юридико-общинном противопоставлении «уроженец» естественнее и компактнее. Формула «пусть ни ... ни ... не совершает» делает русскую фразу нормативной, ясной и сохраняет охват запрета.
  terminology: «Постановления», «законы» и «мерзости» уместны в современном литературном переводе. «Пришелец» сохранён как традиционный термин для גֵּר, а сноска даёт современное пояснение «постоянно живущий среди вас чужеземец» без сведения этого статуса к случайному путешественнику.
