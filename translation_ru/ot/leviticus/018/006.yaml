  text: אִ֥ישׁ אִישׁ֙ אֶל כָּל שְׁאֵ֣ר בְּשָׂר֔/וֹ לֹ֥א תִקְרְב֖וּ לְ/גַלּ֣וֹת עֶרְוָ֑ה אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: ru
  text: Никто из вас не должен приближаться ни к кому из своих близких родственников, чтобы открыть наготу[a]. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Открыть наготу» — употребляемое в этой главе юридическое выражение, обозначающее запрещённое сексуальное обнажение или половые отношения с близким родственником.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Никто из вас
  rationale: 'Удвоенное אִישׁ имеет распределительное значение: запрет относится к каждому человеку. В сочетании с отрицанием естественная русская формулировка «никто из вас» точно передаёт силу предписания.'
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: своих близких родственников
  rationale: Выражение буквально связано с близостью «плоти» и обозначает близкое родство. Русское «близких родственников» ясно передаёт смысл, не сужая его без необходимости до современного термина «кровных родственников».
- source_word: לֹא תִקְרְבוּ
  choice: не должен приближаться
  rationale: Отрицание с имперфектом во втором лице множественного числа выражает юридический запрет. Единственное число согласовано с распределительным «никто», а «приближаться» сохраняет эвфемистическую форму оригинала.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: чтобы открыть наготу
  rationale: Сохранён повторяющийся в главе юридический эвфемизм. Его сексуальный смысл пояснён в сноске, чтобы не заменять образ оригинала однозначной парафразой.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Формула божественного самоотождествления передана прямо; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и соответствует предоставленному решению по спорному термину.
- issue: Степень явности сексуального смысла выражения לְגַלּוֹת עֶרְוָה
  choice: Сохранить в основном тексте выражение «открыть наготу»
  alternative: вступать в половые отношения
  rationale: Еврейская формула допускает более широкий оттенок запрещённого сексуального обнажения или половой связи. Сохранение эвфемизма не устраняет эту смысловую напряжённость, а сноска делает её понятной современному читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-богословского контекста. Формулировка ясна обычному читателю, при этом ключевой древнееврейский эвфемизм и повторяющаяся формула имени Бога сохранены.
