  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: ru
  text: 'Не открывай наготу жены твоего брата[a]: это нагота твоего брата.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более прямо: «Не вступай в половую связь с женой твоего брата». В еврейском тексте употреблён оборот «открывать наготу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: наготы
  rationale: В Левите 18 оборот גלה ערוה — устойчивый юридический эвфемизм, обозначающий запрещённое сексуальное обнажение или связь. Слово «нагота» сохраняет образность, правовой характер и повтор исходного текста.
- source_word: אֵשֶׁת אָחִיךָ
  choice: жены твоего брата
  rationale: Существительное אִשָּׁה в сопряжённой конструкции с «твоего брата» означает именно его жену; более широкое «женщина» здесь было бы неточным.
- source_word: לֹא תְגַלֵּה
  choice: не открывай
  rationale: Сочетание לֹא с имперфектом выражает юридический запрет. Русский повелительный оборот естественно и ясно передаёт его силу.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: это нагота твоего брата
  rationale: Сохранены именная конструкция и повтор слова עֶרְוָה, на которых строится обоснование запрета.
theological_decisions:
- issue: Следует ли раскрыть эвфемистический юридический оборот как прямой запрет половой связи
  choice: Сохранить в основном тексте образное выражение «открывать наготу»
  alternative: Не вступай в половую связь с женой твоего брата
  rationale: В еврейском тексте употреблён устойчивый эвфемизм, а не прямое обозначение полового акта. Его сохранение передаёт форму источника и обеспечивает терминологическую последовательность главы; смысл уточнён в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и юридически выразительной формой. Порядок «жены твоего брата» и «твоего брата» слегка возвышен, но понятен и помогает сохранить параллелизм исходного текста.
