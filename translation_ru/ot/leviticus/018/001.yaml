  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В данной формуле введения прямой речи русское «сказал» естественно передаёт повествовательную последовательность и глагол речи; более буквальное «говорил» здесь звучало бы менее естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно выражает адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря», вводящий содержание речи, в современном русском естественно передаётся двоеточием перед последующей прямой речью.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» прямо передаёт его, не заменяя титулом и не принимая менее вероятную традиционную вокализацию «Иегова».
translation_notes:
  register: Современный литературный русский язык; сохранена краткая торжественная формула введения божественной речи. Двоеточие функционально передаёт לֵאמֹר и связывает стих с последующим высказыванием.
