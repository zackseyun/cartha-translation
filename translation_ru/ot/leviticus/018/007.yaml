base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: ru
  text: Не открывай наготы своего отца и наготы своей матери.[a] Она твоя мать; не открывай её наготы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в пояснительном понимании: «Не открывай наготы своего отца, то есть наготы своей матери». Следующие слова уточняют, что речь идёт о матери: «Она твоя мать».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: наготы
  rationale: Существительное עֶרְוָה в сочетании с גלה образует устойчивую эвфемистическую формулу о запрещённых половых отношениях. «Нагота» сохраняет образность и юридическую формулу еврейского текста, не подменяя её более прямым толкованием.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: не открывай
  rationale: Пиэль глагола גלה с עֶרְוָה буквально означает «открывать наготу» и служит повторяющейся запретительной формулой в этой главе. Повелительная форма с отрицанием естественно передаёт еврейский запрет во втором лице единственного числа.
- source_word: אָבִיךָ
  choice: своего отца
  rationale: Прямой перевод термина родства с суффиксом второго лица единственного числа; возвратное «своего» естественно для современного русского синтаксиса.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: то есть наготы своей матери
  rationale: 'Связка וְ буквально допускает «и», однако последующая фраза «Она твоя мать» указывает на пояснительное отношение: нагота отца здесь соотносится с наготой матери. «То есть» ясно передаёт это понимание, а буквальная координация сохранена в сноске.'
- source_word: אִמְּךָ הִוא
  choice: Она твоя мать
  rationale: Женское местоимение הִוא относится к матери и создаёт эмфатическое пояснение. Такой порядок слов сохраняет краткость и выразительность оригинала.
- source_word: עֶרְוָתָהּ
  choice: её наготы
  rationale: Передаёт существительное с местоименным суффиксом женского рода и сохраняет намеренный повтор ключевой юридической формулы.
theological_decisions:
- issue: Значение выражения «нагота отца» и связь с «наготой матери»
  choice: 'Основной текст передаёт вторую фразу как пояснение: «наготы своего отца, то есть наготы своей матери».'
  alternative: 'Буквальная координация: «наготы своего отца и наготы своей матери».'
  rationale: Фраза «Она твоя мать» поясняет, что непосредственным референтом запрета является мать, а посягательство на неё затрагивает и «наготу отца». Вместе с тем союз וְ формально может быть передан как «и», поэтому эта подлинная синтаксическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и юридически окрашенным построением. Устойчивый библейский эвфемизм «открывать наготу» сохранён, поскольку он понятен из контекста и не делает текст грубее оригинала.
