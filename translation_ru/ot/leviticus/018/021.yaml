  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: ru
  text: И никого из своих потомков[a] не отдавай, чтобы провести его для Молоха[b], и не оскверняй имени твоего Бога. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никого из своих детей». Буквально: «из своего семени».'
    reason: lexical_alternative
  - marker: b
    text: То есть для обряда, связанного с Молохом. Многие понимают это как принесение детей в жертву; в других местах подобный обряд описан как проведение детей через огонь.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: никого из своих потомков
  rationale: Зֶרַע буквально означает «семя», а здесь — потомство; конструкция с מִן имеет разделительное значение. Формулировка передаёт запрет относительно любого из потомков и не сужает значение до определённого возраста.
- source_word: תִתֵּן
  choice: не отдавай
  rationale: Обычное значение נתן — «давать, отдавать». Русский императив с отрицанием естественно передаёт юридический запрет и сохраняет возможный смысл передачи для обряда.
- source_word: לְהַעֲבִיר
  choice: чтобы провести его
  rationale: Hiphil от עבר означает «заставить пройти, провести». Перевод сохраняет каузативный смысл и намеренно не добавляет отсутствующие в стихе слова «через огонь» или «принести в жертву».
- source_word: לַמֹּלֶךְ
  choice: для Молоха
  rationale: Масоретская огласовка и традиционное понимание указывают на имя Молох. Предлог לְ в данном обрядовом контексте естественно передан как «для», без преждевременного уточнения характера обряда.
- source_word: תְחַלֵּל
  choice: не бесчесть
  rationale: Piel חלל означает осквернять, профанировать, бесчестить. Сочетание «бесчестить имя» естественно в современном литературном русском и выражает нанесение ущерба святости и чести Божьего имени.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: имени твоего Бога
  rationale: Сохранено прямое упоминание имени Бога и его заветно-богословская значимость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
theological_decisions:
- issue: Характер запрещённого обряда Молоху
  choice: Сохранить в основном тексте выражение «отдавай, чтобы провести», не называя действие прямо жертвоприношением или проведением через огонь.
  alternative: «Не приноси своих детей в жертву Молоху» или «не проводи своих детей через огонь для Молоха».
  rationale: В самом еврейском тексте этого стиха огонь и жертвоприношение прямо не названы, хотя широкий библейский контекст тесно связывает формулу с таким обрядом. Неопределённость сохранена в тексте, а вероятный смысл пояснён в сноске.
- issue: Референт זרע
  choice: «потомки»
  alternative: «дети» или буквальное «семя»
  rationale: Слово шире возрастно ограниченного «дети», а буквальное «семя» в современном русском здесь звучало бы неестественно и могло бы затемнить смысл.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Отрицательные императивы звучат прямо и понятно. Местоимение «его» выражает единичный объект после «никого» и не уточняет пол потомка; формула «Я — Яхве» сохраняет торжественное самообозначение.
