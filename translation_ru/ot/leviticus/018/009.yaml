  source_fidelity: 'В целом переданы запрет, родственные категории и противопоставление «в доме / вне». Однако заключительное עֶרְוָתָן («их наготы») в черновике не отражено: начальная формула «наготы сестры твоей» передаёт лишь первое עֶרְוַת. Повторение является частью еврейской правовой формулы и должно быть сохранено.'
  naturalness: Фраза написана ясным современным литературным русским и удерживает сдержанный правовой регистр. «Дочери отца твоего» и «дочери матери твоей» естественны в этом регистре. Повтор «не открывай их наготы» несколько тяжеловесен, но оправдан близостью к формуле источника и однозначно передаёт её.
  terminology: «Открывать наготу» — удачная устоявшаяся передача еврейской юридической идиомы. «Сестры твоей» сохраняет адресацию мужскому адресату без ненужного осовременивания. «В доме или вне дома» не навязывает спорное уточнение «в семье», а примечание поясняет возможный социальный оттенок.
