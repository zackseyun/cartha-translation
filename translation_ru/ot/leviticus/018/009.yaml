base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: ru
  text: Не открывай наготы своей сестры — дочери твоего отца или дочери твоей матери, родившейся в доме или вне дома.[a] Не открывай их наготы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рождённой в доме или рождённой вне». Еврейский текст противопоставляет рождение «в доме» рождению «вне»; «дом» может обозначать также домашний круг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: наготы ... / её наготы
  rationale: В Левите 18 это устойчивое правовое выражение, обозначающее сексуальное обнажение в контексте запрещённых связей. Формула «открывать наготу» сохраняет образ и юридико-ритуальный характер оригинала.
- source_word: אֲחוֹתְךָ
  choice: сестры твоей
  rationale: Прямое обозначение родства; мужской род адресата и торжественно-правовой стиль главы сохранены.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: дочери отца твоего / дочери матери твоей
  rationale: Близкая к форме оригинала симметричная передача точно охватывает сестру по отцу или по матери.
- source_word: מוֹלֶדֶת
  choice: родившейся
  rationale: Причастная форма естественно передаёт характеристику по месту или семейной среде рождения, не добавляя отсутствующих в тексте категорий.
- source_word: בַּיִת / חוּץ
  choice: в доме / вне его
  rationale: Сохранено буквальное пространственно-социальное противопоставление «дом — вне», чья точная отсылка допускает оттенки дома и домашнего круга.
- source_word: לֹא תְגַלֶּה
  choice: не открывай
  rationale: Естественная русская форма прямого правового запрета; она сохраняет глагол исходной идиомы.
- source_word: אוֹ ... אוֹ
  choice: или ... или
  rationale: Передаёт перечисление альтернатив в еврейском тексте без логического сужения.
theological_decisions:
- issue: Объём запрещённого родства
  choice: Запрет охватывает сестру по отцу или по матери независимо от того, родилась ли она в доме или вне его.
  alternative: Заключительные определения могут пониматься как различение сестёр, рождённых внутри домашнего круга и вне его, либо косвенно соотноситься с полнородными и неполнородными сёстрами.
  rationale: Еврейская правовая формула расширяет и уточняет категорию «сестра», но не вводит явно более поздние юридические классификации; перевод сохраняет широкий запрет и неоднозначность последнего противопоставления.
translation_notes:
  register: Современный литературный русский с достоинством библейского правового регистра. Инверсия «сестры твоей», «отца твоего» поддерживает ритм закона, оставаясь понятной; архаичные формы вроде «не открывай наготы ея» исключены.
