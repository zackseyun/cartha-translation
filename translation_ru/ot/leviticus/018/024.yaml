  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: ru
  text: Не оскверняйте себя ничем из этого[a], потому что всем этим осквернились народы, которых Я изгоняю перед вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не делайте себя нечистыми ничем из этого… народы… стали нечисты»; возможно также: «были осквернены».'
    reason: Лексическая альтернатива для тִּטַּמְּאוּ и пассивно-результативная альтернатива для нִטְמְאוּ.
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: Не оскверняйте себя
  rationale: Запрет с אַל и формой хитпаэль глагола טמא передаёт прямое запрещение действия, затрагивающего самих действующих. «Оскверняйте себя» естественно по-русски и сохраняет левитскую лексику нечистоты.
- source_word: בְּכָל אֵלֶּה
  choice: ничем из этого
  rationale: При отрицании сочетание естественно передаёт еврейское «всем этим» в значении средства или основания осквернения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного запрета.
- source_word: נִטְמְאוּ
  choice: осквернили себя
  rationale: Нифаль допускает пассивно-результативное понимание («стали нечисты», «были осквернены»). В контексте поступков народов возвратная формулировка звучит естественно, а допустимая пассивная альтернатива сохранена в сноске.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Речь идёт о неизраильских народах, населявших землю; «народы» точно и без анахронизма передаёт גּוֹיִם.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: которых Я изгоняю
  rationale: В контексте суда и удаления жителей земли שׁלח означает высылать, изгонять.
- source_word: מִפְּנֵיכֶם
  choice: перед вами
  rationale: Формально выражение означает «от лица вашего»; с глаголом изгнания русское «перед вами» сохраняет пространственный образ продвижения Израиля.
theological_decisions:
- issue: Лексика ритуально-нравственной нечистоты в Левите 18
  choice: оскверняйте себя / осквернили себя
  alternative: делайте себя нечистыми / стали нечисты; были осквернены
  rationale: «Осквернять себя» в современном литературном русском ясно обозначает реальную нечистоту, вызванную запрещёнными поступками, не сводя её ни только к обрядовой, ни только к субъективно-нравственной категории. Сноска сохраняет пассивно-результативную неоднозначность нифаля.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранены прямой запрет, повтор корня טמא и образ изгнания народов перед Израилем; местоимение «Я» написано с прописной буквы по принятой русской библейской традиции.
