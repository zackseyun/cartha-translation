  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: ru
  text: Когда вы придёте в эту землю и посадите любое плодовое дерево, считайте его плоды необрезанными[a]. Три года они будут для вас необрезанными; есть их нельзя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «необрезанными». Здесь это образное обозначение плодов, которые в первые три года ещё запрещено есть.'
    reason: Пояснение необычной метафоры ערל/ערלה без её устранения из основного текста.
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: Когда вы придёте в эту землю
  rationale: כִּי в предписании вводит будущую ситуацию и естественно передаётся словом «когда». Указательное «эту» по-русски обозначает уже известную из контекста землю, не добавляя названия Ханаан.
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: и посадите какое-либо плодовое дерево
  rationale: Сочетание обозначает любое дерево, выращиваемое ради съедобных плодов. «Плодовое дерево» — естественный современный русский эквивалент; «какое-либо» сохраняет распределительное значение כָּל.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: считайте его плоды необрезанными
  rationale: Причинно-статусное употребление корня ערל требует не буквального действия, а признания плодов имеющими обозначенный законом статус. Формулировка сохраняет намеренно необычную метафору оригинала.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: Три года они будут для вас необрезанными
  rationale: Сохранены временное выделение, выражение לָכֶם «для вас» и повтор корня ערל. Множественное «они» естественно относится к плодам и согласуется с עֲרֵלִים.
- source_word: לֹא יֵאָכֵל
  choice: есть их нельзя
  rationale: Безличная русская конструкция естественно передаёт пассивно-запретительное значение нифаля, не превращая его без необходимости в прямое обращение «не ешьте».
theological_decisions:
- issue: Сохранять ли метафору «необрезанных» плодов или заменить её толкованием «запрещённые»
  choice: Сохранить «необрезанными» в обоих случаях
  alternative: «запрещёнными» / «непригодными в пищу»
  rationale: В еврейском тексте намеренно дважды используется корень ערל, связанный с необрезанностью. Замена на одно лишь практическое следствие устранила бы образ и его заветно-культовый оттенок. Прямой запрет есть плоды выражен отдельно в конце стиха, а сноска поясняет смысл метафоры.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис упрощён до естественного русского, но повтор ключевой метафоры и безличная форма запрета сохранены.
