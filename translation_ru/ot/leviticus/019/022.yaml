revisions:
- from: И священник совершит за него искупление пред Яхве посредством барана жертвы повинности[a] за грех, который тот совершил, и этот совершённый им грех будет ему прощён.
  to: И священник совершит за него искупление пред Яхве с бараном жертвы повинности[a] за его грех, который он совершил, и ему будет прощён этот грех.
  rationale: Исправлена заключительная формула, чтобы сохранить адресата прощения, выраженного в еврейском לוֹ, и при этом оставить божественного деятеля неназванным. «Его грех, который он совершил» передаёт притяжательный суффикс חַטָּאתוֹ и естественно сглаживает еврейскую однокоренную конструкцию. «С бараном» сохраняет инструментальное בְּ и звучит менее канцелярски, чем «посредством барана».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: священник совершает искупительный обряд за человека перед Яхве, используя барана жертвы повинности, вследствие чего следует прощение. Однако заключительный оборот чересчур перестраивает формулу оригинала: в русском тексте именно «грех будет ему прощён», тогда как еврейская формула говорит о прощении человека от/за его грех. Безопаснее сохранить дательный адресата и безлично-пассивное оформление: «ему будет прощён этот грех».'
  naturalness: «Посредством барана» возможно, но в данном культовом контексте «с бараном» естественнее и ближе к инструментальному בְּ. Местоимение «тот» в «который тот совершил» звучит канцелярски и отчуждённо; «его грех, который он совершил» — современно-литературное и ясное решение.
  terminology: «Священник», «совершит искупление», «Яхве», «баран жертвы повинности» и сноска к אָשָׁם приемлемы. Альтернатива «жертва возмещения» корректно отмечает репаративный аспект термина, не отменяя традиционного основного наименования.
  issues:
  - severity: medium
    issue: Заключительная формула делает «грех» грамматическим субъектом прощения.
    rationale: וְנִסְלַח לוֹ מֵחַטָּאתוֹ — стандартная формула, в которой прощение относится к человеку («ему будет прощено/он будет прощён за грех»). Русская конструкция «этот ... грех будет ему прощён» возможна, но менее точно отражает устройство формулы и неоправданно выдвигает грех как субъект.
  - severity: low
    issue: «Который тот совершил» неестественно для современного литературного русского.
    rationale: «Тот» формально снимает референциальную неоднозначность, но создаёт тяжёлый, канцелярский оттенок. Притяжательное «его» и личное «он» яснее связывают грех с человеком, за которого совершается искупление.
  - severity: low
    issue: «Посредством барана» излишне технически звучит в русском библейском тексте.
    rationale: Инструментальное значение בְּ хорошо и естественно передаётся предлогом «с» в сочетании с жертвенным животным.
  revised_text: И священник совершит за него искупление пред Яхве с бараном жертвы повинности[a] за его грех, который он совершил, и ему будет прощён этот грех.
  revised_footnotes:
