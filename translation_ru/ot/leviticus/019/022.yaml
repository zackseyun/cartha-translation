  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: ru
  text: И священник совершит за него искупление пред Яхве с бараном жертвы повинности[a] за его грех, который он совершил, и ему будет прощён этот грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы возмещения». Древнееврейское אָשָׁם может обозначать как вину, так и возместительный характер этой жертвы.'
    reason: Лексическая многозначность названия жертвы.
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: совершит за него искупление
  rationale: В священническом контексте כפר обозначает обрядовое искупление, совершаемое священником ради человека; сочетание «за него» естественно передаёт значение עָלָיו.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное и точное обозначение служителя, совершающего жертвенный обряд.
- source_word: בְּאֵיל הָאָשָׁם
  choice: посредством барана жертвы повинности
  rationale: אֵיל означает именно барана, а בְּ имеет инструментальное значение. «Жертва повинности» — узнаваемое русское наименование אָשָׁם, при этом его возместительный оттенок отмечен в сноске.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» сохраняет культовое значение присутствия перед Богом, а личное имя יהוה передано как «Яхве».
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: за грех, который тот совершил
  rationale: Передаёт основание искупления и естественно сглаживает однокоренную древнееврейскую конструкцию «грех, которым согрешил»; местоимение «тот» устраняет возможную двусмысленность с ближайшим существительным «священник».
- source_word: וְנִסְלַח לוֹ
  choice: будет ему прощён
  rationale: Страдательная форма сохраняет не названного прямо божественного деятеля и формульный характер обещания прощения.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: этот совершённый им грех
  rationale: Указательное «этот» связывает заключительную формулу с уже названным грехом; русский оборот передаёт повтор исходного текста без неестественного дословного дублирования.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Значение אָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения
  rationale: Термин обозначает установленный вид жертвы и одновременно может подчёркивать вину и возмещение; основной текст использует традиционно понятное название, а смысловая альтернатива сохранена в сноске.
- issue: Кто прощает грех
  choice: божественный деятель оставлен неназванным
  alternative: Яхве простит ему
  rationale: Древнееврейская страдательная форма не называет деятеля прямо. Русская пассивная конструкция сохраняет это богословски значимое умолчание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формула «совершить искупление» сохраняет культовую точность, а синтаксис сглажен лишь там, где буквальное воспроизведение древнееврейской однокоренной конструкции звучало бы неестественно.
