    text: 'Или: «жертвы возмещения». Древнееврейское אָשָׁם может обозначать как вину, так и возместительный характер этой жертвы.'
    reason: Лексическая многозначность названия жертвы.
  revision_rationale: Исправлена заключительная формула, чтобы сохранить адресата прощения, выраженного в еврейском לוֹ, и при этом оставить божественного деятеля неназванным. «Его грех, который он совершил» передаёт притяжательный суффикс חַטָּאתוֹ и естественно сглаживает еврейскую однокоренную конструкцию. «С бараном» сохраняет инструментальное בְּ и звучит менее канцелярски, чем «посредством барана».
