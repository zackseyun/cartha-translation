id: LEV.19.32
reference: Leviticus 19:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: ru
  text: Перед сединой вставай[a], старцу оказывай почтение[b] и бойся Бога твоего. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии седины». В еврейском тексте употреблён конкретный образ седины как обозначение старости.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «почитай лицо старца»; это еврейский оборот, означающий оказание почтения пожилому мужчине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: перед сединой
  rationale: 'Сохраняет конкретный еврейский образ седины и пространственный оттенок выражения: вставать перед кем-либо, оказывая уважение.'
- source_word: תָּקוּם
  choice: вставай
  rationale: Форма выражает предписание встать как знак уважения; русский императив естественно передаёт его повелительную силу.
- source_word: וְהָדַרְתָּ פְּנֵי זָקֵן
  choice: старцу оказывай почтение
  rationale: Передаёт значение глагола הדר — оказывать честь, почитать — естественным русским оборотом; буквальное «почитай лицо старца» по-русски звучит неясно.
- source_word: וְיָרֵאתָ
  choice: бойся
  rationale: Сохраняет сильное значение ירא и присущее тексту сочетание страха, благоговения и осознания Божьей власти, не сводя его к простому уважению.
- source_word: מֵאֱלֹהֶיךָ
  choice: Бога твоего
  rationale: Сохраняет личное обращение во втором лице единственного числа и заветный притяжательный оттенок; порядок слов соответствует возвышенному, но понятному русскому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Страх перед Богом
  choice: бойся Бога твоего
  alternative: почитай Бога твоего; благоговей перед Богом твоим
  rationale: «Бойся» сохраняет напряжение между страхом, благоговением и верностью Богу, присутствующее в формуле Кодекса святости.
- issue: Родовое обозначение זָקֵן
  choice: старцу
  alternative: пожилому человеку; старейшине
  rationale: Еврейское слово стоит в мужском роде и в данном контексте обозначает старого мужчину; «старейшина» могло бы необоснованно придать слову значение общественной должности.
- issue: Божественное имя יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет личное заветное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Императивы делают обращение прямым и понятным; конкретный образ «седины» сохранён, а не заменён абстрактной «старостью».
