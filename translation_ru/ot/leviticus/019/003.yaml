  source_fidelity: 'Основной смысл передан верно: сохранены порядок «мать — отец», множественное «субботы», имя «Яхве» и формула «ваш Бог». Однако сноска b, поясняющая глагол ירא, должна быть привязана непосредственно к «почитает», а не к слову «отца». Утверждение в примечании переводчика о смене числа неточно: оба еврейских глагола стоят во 2-м лице множественного числа; распределительное אִישׁ перед ними не создаёт смены числа глагола.'
  naturalness: «Каждый из вас пусть почитает» — естественная литературная формула, а «соблюдайте Мои субботы» хорошо соответствует законодательному регистру. Однако сочетание в одной фразе распределительного единственного «пусть почитает» и прямого множественного повеления «соблюдайте» несколько шероховато в русском и не воспроизводит еврейскую глагольную форму. Формула «Каждый из вас должен почитать ... и соблюдать ...» более плавна и сохраняет распределительный охват.
