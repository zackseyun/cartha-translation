  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: ru
  text: Каждый[a] из вас должен почитать[b] свою мать и своего отца и соблюдать Мои субботы. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый мужчина» или «всякий человек»; еврейская форма мужского рода употреблена распределительно по отношению к общине.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может означать «бояться», «испытывать благоговейный страх» или «глубоко почитать».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Каждый из вас
  rationale: Существительное мужского рода в единственном числе употреблено распределительно по отношению ко всей общине. Оборот «каждый из вас» естественно передаёт это значение по-русски, не ограничивая заповедь только взрослыми мужчинами; буквальная форма отмечена в сноске.
- source_word: אִמּוֹ וְאָבִיו
  choice: свою мать и своего отца
  rationale: 'Сохранены оба отдельных обозначения родителей и необычный для библейских формул порядок: сначала мать, затем отец.'
- source_word: תִּירָאוּ
  choice: пусть почитает
  rationale: Глагол ירא охватывает страх, благоговение и почтение. В отношении родителей русское «почитать» естественно выражает предписанное благоговейное уважение, тогда как буквальное «бояться» без пояснения может ошибочно подразумевать ужас; более буквальный оттенок сохранён в сноске.
- source_word: שַׁבְּתֹתַי
  choice: Мои субботы
  rationale: Сохранены множественное число и притяжательное указание, подчёркивающие принадлежность священных времён Богу.
- source_word: תִּשְׁמֹרוּ
  choice: соблюдайте
  rationale: В сочетании с субботами глагол שׁמר означает внимательно хранить и исполнять установление; «соблюдайте» является естественным современным русским соответствием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: При Яхве форма אֱלֹהִים обозначает единого Бога Израиля; суффикс второго лица множественного числа передан словом «ваш».
theological_decisions:
- issue: Смысл глагола ירא в заповеди об отношении к родителям
  choice: почитает
  alternative: боится; благоговеет перед
  rationale: Контекст требует не ужаса перед родителями, а глубокого уважения с оттенком благоговейного страха. Основной текст использует естественное русское «почитает», а сноска сохраняет более буквальный смысл и присущую еврейскому слову напряжённость.
- issue: Распределительное мужское единственное число אִישׁ
  choice: Каждый из вас
  alternative: Каждый мужчина; всякий человек
  rationale: Грамматически мужская форма обращает заповедь к членам общины по отдельности. Русская формулировка передаёт распределительный охват, а исходная форма не скрыта и указана в сноске.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, присутствующее в еврейском тексте, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Переход от единственного числа («пусть почитает») к множественному («соблюдайте») сохраняет заметную смену числа в еврейском тексте. Прописная буква в «Мои» служит ясности указания на говорящего Бога и соответствует принятому русскому библейскому регистру.
