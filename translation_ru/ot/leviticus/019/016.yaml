  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: ru
  text: Не ходи среди своего народа, распространяя клевету. Не посягай на жизнь своего ближнего[a]. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не стой безучастно, когда проливается кровь твоего ближнего».'
    reason: Еврейское выражение также может запрещать оставаться в стороне, когда жизнь ближнего находится в опасности.
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: ходи… разнося клевету
  rationale: 'Сочетание буквально рисует человека, который ходит среди людей и распространяет вредящие им слухи или обвинения. Такая передача сохраняет образ движения и серьёзный смысл רָכִיל, не прибегая к устаревшему «переносчик». '
- source_word: בְּעַמֶּיךָ
  choice: среди своего народа
  rationale: Предлог בְּ здесь обозначает действие внутри сообщества; «среди своего народа» естественно передаёт этот смысл по-русски.
- source_word: תַעֲמֹד עַל
  choice: выступай против
  rationale: Буквальное «стой на/против» в русском было бы неясным. «Выступай против» сохраняет образ противодействия и не сводит фразу исключительно к прямому убийству; возможное значение безучастного присутствия отмечено в сноске.
- source_word: דַּם
  choice: жизни
  rationale: Буквально слово означает «кровь», но в данном юридико-нравственном контексте кровь метонимически обозначает жизнь, которой угрожает пролитие. «Против крови» по-русски не передаёт понятного смысла, тогда как «против жизни» сохраняет направленность запрета.
- source_word: רֵעֶךָ
  choice: своего ближнего
  rationale: רֵעַ означает другого человека из ближайшего сообщества. «Ближний» — естественный и укоренённый русский библейский эквивалент.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
theological_decisions:
- issue: Значение לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: Запрет выступать против жизни ближнего, то есть действовать так, чтобы поставить её под угрозу.
  alternative: Запрет безучастно стоять в стороне, когда проливается кровь ближнего или его жизнь находится в опасности.
  rationale: Краткая еврейская конструкция допускает понимание как враждебного или губительного действия, так и пассивного безучастия. Основной текст передаёт первое прочтение, а второе сохраняется в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью законодательной речи. Повтор местоимений смягчён естественным для русского употреблением «своего», а параллельные запреты сохранены. Маркер [a] поставлен при неоднозначной второй фразе, к которой относится сноска.
