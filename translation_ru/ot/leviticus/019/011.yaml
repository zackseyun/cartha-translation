source:
  edition: WLC
  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: ru
  text: Не крадите, не обманывайте[a] и не лгите друг другу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не поступайте лживо»; еврейский глагол может также означать ложное отрицание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый по отношению к своему ближнему (сотоварищу)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: не крадите
  rationale: Форма Qal imperfect 2-го лица множественного числа с לֹא выражает прямой запрет. «Красть» — простое и точное соответствие глаголу גנב.
- source_word: תְכַחֲשׁוּ
  choice: не обманывайте
  rationale: Piel глагола כחש может обозначать обман, ложное отрицание или нечестное поведение. «Не обманывайте» естественно передаёт широкий смысл, не сводя запрет только к словесной лжи.
- source_word: תְשַׁקְּרוּ
  choice: не лгите
  rationale: Piel глагола שקר обычно означает ложь или лживое поведение. «Не лгите» ясно передаёт речевой и межличностный характер запрета.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: друг другу
  rationale: Буквально мужская дистрибутивная конструкция имеет здесь взаимное и обобщённое значение. Русское «друг другу» естественно передаёт её смысл без необоснованного ограничения только мужчинами.
- source_word: עֲמִית
  choice: друг другу
  rationale: Слово обозначает ближнего, товарища или другого члена сообщества. В составе всей идиомы его значение естественно выражается взаимным оборотом «друг другу».
theological_decisions:
- issue: Обобщённое мужское выражение אִישׁ ... עֲמִיתוֹ
  choice: Передать взаимным оборотом «друг другу»
  alternative: «Каждый своему ближнему» или «человек своему товарищу»
  rationale: Грамматически мужская форма имеет представительное, а не исключительно мужское значение; перевод должен сохранять общий охват запрета.
- issue: Различение כחש и שקר
  choice: «Не обманывайте» и «не лгите»
  alternative: «Не поступайте лживо» и «не лгите» либо «не отрицайте ложно» и «не лгите»
  rationale: 'Так сохраняются два отдельных запрета: первый шире и охватывает нечестное обращение, второй прямо относится ко лжи. При этом перевод не навязывает узкое толкование כחש.'
translation_notes:
  register: Современный литературный русский язык; краткие параллельные запреты переданы единообразными формами повелительного наклонения. Формулировка прямая, понятная и сохраняет смысловое различие между обманом и ложью.
