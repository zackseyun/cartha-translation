source:
  edition: WLC
  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: ru
  text: Не питай в сердце ненависти к брату твоему. Непременно обличи ближнего твоего и не понеси из-за него греха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не навлеки на себя вины из-за него»; возможно также: «не раздели его греха». Еврейское выражение допускает мысль о виновности человека, который не обличил чужой проступок.'
    reason: Лексическая и синтаксическая неоднозначность идиомы תִשָּׂא עָלָיו חֵטְא.
lexical_decisions:
- source_word: תִשְׂנָא
  choice: питай ненависти
  rationale: Глагол שׂנא прямо обозначает ненависть. В сочетании с «в сердце» выражение «питать ненависть» естественно по-русски и сохраняет нравственную силу запрета.
- source_word: אָחִיךָ
  choice: брату твоему
  rationale: Слово אָח может означать как родного брата, так и соплеменника, члена общины завета. «Брат» сохраняет образ родства и его общинный оттенок.
- source_word: בִּלְבָבֶךָ
  choice: в сердце
  rationale: לֵבָב обозначает внутреннего человека, включая мысли и намерения. Русское выражение сохраняет внутреннюю направленность заповеди.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: непременно обличи
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает повеление. «Непременно» передаёт эмфазу, а «обличи» — открытое указание ближнему на его проступок.
- source_word: עֲמִיתֶךָ
  choice: ближнего твоего
  rationale: עָמִית означает человека из той же общины. «Ближний» естественно для данного этико-правового контекста и перекликается с ближайшим контекстом Левита 19.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: не понеси из-за него греха
  rationale: Оборот נָשָׂא חֵטְא может означать несение греха, вины или наступление виновности; עָלָיו связывает её с другим человеком. Формулировка близка к еврейскому тексту и не устраняет его смысловую неоднозначность.
theological_decisions:
- issue: Объём родственных и общинных обозначений
  choice: Сохранены формы «брат» и «ближний».
  alternative: «соплеменник», «член твоей общины»
  rationale: Мужской род единственного числа соответствует еврейским формам и имеет представительное значение; буквальные relational terms сохраняют семейно-заветный образ, не сужая применение стиха до кровного родства.
- issue: Связь обличения с несением греха
  choice: Сохранена сочинительная конструкция и неоднозначное «понести из-за него грех».
  alternative: «обличи его, чтобы не стать виновным из-за него» или «не участвуй в его грехе»
  rationale: Еврейский оборот допускает понимание личной виновности из-за необличённого проступка, несения вины на счёт другого или причастности к его греху. Основной текст не закрепляет только одно толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «брату твоему / ближнего твоего» сохраняет достоинство и ритм юридико-этической заповеди, оставаясь понятной современному читателю.
