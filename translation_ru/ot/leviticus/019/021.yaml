base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: ru
  text: Он должен принести Яхве[a] свою жертву за вину к входу в шатёр встречи — барана в жертву за вину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою возместительную жертву». Еврейское слово אָשָׁם может обозначать как вину, влекущую возмещение, так и жертву, приносимую в связи с ней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: И пусть он принесёт
  rationale: В законодательном контексте форма выражает предписание; конструкция с «пусть» естественно передаёт это значение в современном русском языке.
- source_word: אֲשָׁמוֹ
  choice: свою жертву повинности
  rationale: Слово אָשָׁם обозначает как вину или повинность, так и жертву, приносимую для устранения этой повинности; жертвенный контекст требует здесь названия приношения.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает на адресата приношения, а личное имя יהוה передано как «Яхве».
- source_word: אֶל פֶּתַח
  choice: ко входу
  rationale: פֶּתַח означает вход или проём; «ко входу» естественно передаёт направление движения.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Буквально и понятно передаёт устойчивое обозначение святилища, где происходила встреча с Богом.
- source_word: אֵיל
  choice: барана
  rationale: אֵיל конкретно обозначает взрослого самца овцы — барана.
- source_word: אָשָׁם
  choice: в жертву повинности
  rationale: Заключительная аппозиция определяет назначение барана и повторяет название жертвенной категории.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблено собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Значение אָשָׁם
  choice: жертва повинности
  alternative: жертва за вину; возместительная жертва
  rationale: Выбор сохраняет связь между состоянием повинности и жертвой, не сводя термин исключительно к внутреннему чувству вины или только к материальному возмещению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным законодательным звучанием. Повтор «жертва повинности» сохранён вслед за еврейским текстом; тире ясно вводит уточнение о жертвенном животном.
