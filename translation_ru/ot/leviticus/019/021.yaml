  rationale: Исправления устраняют современную семантическую двусмысленность слова «повинность», делают предписывающую форму и сочетание с предлогом более естественными и сохраняют повтор אָשָׁם, присутствующий в еврейском тексте. Сноска отражает лексическую многозначность термина, не навязывая спорного толкования.
