  source_fidelity: 'Смысловые компоненты еврейского текста переданы верно: предписывающее действие, адресат Яхве, вход в шатёр встречи и баран, определённый как אָשָׁם. Однако «повинность» в современном русском обычно означает обязанность, а не вину или ответственность за проступок; поэтому «жертва повинности» может неверно восприниматься. «И пусть он принесёт» также слабее и менее естественно для законодательного предписания, чем «он должен принести».'
