  register: Современный литературный русский язык с достоинством законодательной речи. Смена множественного числа во вводном обороте на единственное в выражении «своего поля» отражает переход исходного текста от обращения ко всему народу к типичному отдельному землевладельцу; по-русски такая обобщённая конструкция звучит естественно.
