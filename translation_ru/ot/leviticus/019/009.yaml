base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: ru
  text: Когда будете жать урожай вашей земли, не сжинайте край своего поля до конца и не подбирайте того, что осталось после жатвы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угол своего поля». Еврейское слово может означать край, сторону или угол; здесь имеется в виду внешняя часть поля, которую не следует сжинать полностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: Когда будете жать
  rationale: Сочетание союза, предлога и инфинитива вводит временное обстоятельство; эта формулировка естественна для современного русского языка и сохраняет обращение во множественном числе.
- source_word: קְצִיר אַרְצְכֶם
  choice: урожай на вашей земле
  rationale: קְצִיר здесь обозначает урожай и жатву, а אֶרֶץ — землю в сельскохозяйственном смысле; оборот передаёт смысл естественно, не подразумевая политическую страну.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: не дожинайте до конца
  rationale: Порода пиэль глагола כלה означает довести до завершения, а инфинитив קצר уточняет действие жатвы. Русское «дожинать до конца» точно передаёт запрет убирать эту часть поля полностью.
- source_word: פְּאַת שָׂדְךָ
  choice: края своего поля
  rationale: פֵּאָה может означать край, сторону или угол. В данном сельскохозяйственном законе «край поля» понятно обозначает внешнюю часть поля, которую нельзя сжинать полностью.
- source_word: לֶקֶט קְצִירְךָ
  choice: оставшегося после жатвы
  rationale: לֶקֶט обозначает рассыпавшиеся или оставленные при жатве колосья и иной урожай, который затем подбирают. Описательный перевод понятнее современному читателю, чем редкое специальное существительное.
- source_word: לֹא תְלַקֵּט
  choice: не подбирайте
  rationale: לקט означает собирать или подбирать оставшееся; «подбирать» ясно выражает сбор того, что осталось или упало после основной жатвы.
