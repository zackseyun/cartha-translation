  text: אֶֽת חֻקֹּתַ/י֮ תִּשְׁמֹרוּ֒ בְּהֶמְתְּ/ךָ֙ לֹא תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְ/ךָ֖ לֹא תִזְרַ֣ע כִּלְאָ֑יִם וּ/בֶ֤גֶד כִּלְאַ֨יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: ru
  text: Соблюдайте Мои установления. Не скрещивай свой скот с животными другого вида; не засевай своё поле семенами двух разных видов; и одежда из смешанной ткани — шаатнез[a] — пусть не будет на тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «шаатнез» — специальный термин для запрещённой смешанной ткани; традиционно его понимают как смесь шерсти и льна. Ср. Второзаконие 22:11.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: Мои установления
  rationale: Сохраняет смысл предписанных, обязательных норм и звучит естественно в современном русском юридико-религиозном контексте.
- source_word: תִּשְׁמֹרוּ
  choice: соблюдайте
  rationale: В контексте заповедей שׁמר означает не просто хранить, а исполнять и соблюдать.
- source_word: בְּהֶמְתְּךָ
  choice: своего скота
  rationale: Обозначает домашних сельскохозяйственных животных в целом; «скот» естественнее в данном контексте, чем более широкое «животные».
- source_word: תַרְבִּיעַ
  choice: скрещивай
  rationale: Порода Hiphil выражает побуждение животных к спариванию; в сочетании с כִּלְאַיִם русское «скрещивать» точно и естественно передаёт запрет.
- source_word: כִּלְאַיִם
  choice: два разных вида
  rationale: Передаёт неоднородность смешиваемых категорий, не уточняя сверх текста, идёт ли речь о биологических видах, породах или иных установленных разрядах.
- source_word: שָׂדְךָ
  choice: своё поле
  rationale: Прямой и естественный перевод формы с притяжательным суффиксом.
- source_word: תִזְרַע
  choice: засевай
  rationale: Точно передаёт сельскохозяйственное действие посева и естественно сочетается со словом «поле».
- source_word: בֶגֶד
  choice: одежда
  rationale: Общее название предмета одежды; сохраняет собирательно-правовой характер формулировки.
- source_word: כִּלְאַיִם
  choice: из смешанной ткани
  rationale: В текстильном контексте передаёт идею смешения разных материалов, не вводя в основной текст традиционное уточнение о шерсти и льне.
- source_word: שַׁעַטְנֵז
  choice: шаатнез
  rationale: Редкий технический термин сохранён транслитерацией, поскольку его точное значение не выводится однозначно из самого слова; пояснение дано в сноске.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: пусть не будет на тебе
  rationale: Сохраняет образное «не поднимется/не окажется на тебе», но звучит понятно и естественно по-русски, не сводя выражение исключительно к глаголу «носить».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Начальное множественное «соблюдайте» и последующие формы единственного числа отражают смену числа в еврейском тексте. Повтор понятия כִּלְאַיִם сохранён через формулировки о разных видах и смешанной ткани; технический термин вынесен в транслитерации с пояснением.
