  text: А в четвёртый год все его плоды будут святыней[a] для прославления Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «святыней — хвалами Яхве» или «святыней для хвалы Яхве». Это редкое еврейское выражение, вероятно, подчёркивает праздничное прославление, совершаемое с этими плодами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: А в четвёртый год
  rationale: Союз ו передаёт переход и контраст с первыми тремя годами, а предложная конструкция обозначает время; такая формулировка естественна для русского законодательного контекста.
- source_word: יִהְיֶה כָּל פִּרְיוֹ
  choice: все его плоды будут
  rationale: כָּל с собирательным единственным פִּרְיוֹ охватывает весь урожай дерева; по-русски естественно употребить множественное число «все его плоды».
- source_word: קֹדֶשׁ
  choice: святыней
  rationale: Существительное обозначает не просто качество, а статус плодов как отделённых для священного употребления; творительный предикатив после «будут» сохраняет эту предметно-культовую окраску.
- source_word: הִלּוּלִים
  choice: для прославления
  rationale: Редкое множественное существительное связано с хвалой и праздничным славословием. Перевод передаёт назначение плодов, не вводя отсутствующего в еврейском тексте специального термина «приношение».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל выражает направленность хвалы, а тетраграмматон передан личным covenantным именем «Яхве».
theological_decisions:
- issue: Значение редкого культового выражения קֹדֶשׁ הִלּוּלִים לַיהוָה
  choice: святыней для прославления Яхве
  alternative: святыней — хвалами Яхве; святыней для хвалы Яхве
  rationale: Основной текст ясно передаёт священный статус плодов и их назначение для хвалы, а примечание сохраняет необычную форму и смысловую неоднозначность еврейского выражения, не превращая плоды без достаточного основания в особый вид жертвы.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное Божье имя; транслитерация сохраняет различие между тетраграмматоном и титулом «Господь».
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного библейского стиля. «Святыней» сохраняет культовую точность, а «для прославления» делает редкое выражение понятным без устранения его неоднозначности, отмеченной в сноске.
