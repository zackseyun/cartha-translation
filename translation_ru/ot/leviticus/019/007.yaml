lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Сочетание союза с условной частицей вводит условие, противопоставленное предшествующему предписанию; «но если» естественно передаёт эту связь.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: всё же будут есть
  rationale: Инфинитив абсолютный при личной форме усиливает глагольное действие. «Всё же будут есть» передаёт подчёркнутое нарушение запрета без неестественного буквального удвоения.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Прямой и естественный перевод временного выражения.
- source_word: פִּגּוּל
  choice: скверна
  rationale: В жертвенном контексте слово обозначает ритуально неприемлемую жертву или жертвенное мясо. «Скверна» сохраняет сильную отрицательную и культовую окраску, не отождествляя термин с другими еврейскими словами, обычно переводимыми как «мерзость».
- source_word: הוּא
  choice: она будет
  rationale: Местоимение образует именное сказуемое. Женский род обусловлен восстановленным из контекста словом «жертва»; будущее время естественно для русского условного высказывания, хотя еврейская конструкция буквально означает «она — скверна».
- source_word: לֹא יֵרָצֶה
  choice: жертва не будет принята
  rationale: Нифаль глагола רצה в жертвенном контексте обозначает благоприятное принятие жертвы. Повтор слова «жертва» устраняет неясность русского местоимения и не добавляет нового участника.
theological_decisions:
- issue: Статус жертвы, мясо которой едят на третий день
  choice: Жертва объявляется культово осквернённой и неприемлемой.
  alternative: Речь лишь о физически испорченном мясе либо о «мерзости» как общей нравственно-метафизической категории.
  rationale: Контекст регулирует сроки употребления мяса мирной жертвы, а заключительное לֹא יֵרָצֶה прямо указывает на жертвенную приемлемость. Перевод сохраняет культовый смысл, не сводя его к порче пищи и не расширяя до иной категории запретов.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Местоимение «её» восстанавливает из ближайшего контекста жертву мирной жертвы; «всё же» передаёт усилительную конструкцию без тяжеловесной кальки.
