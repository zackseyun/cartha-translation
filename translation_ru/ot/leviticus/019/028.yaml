  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: ru
  text: Не делайте на теле надрезов ради умершего[a] и не наносите на себя татуировок[b]. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради умершего человека». Еврейское выражение обычно связано с трауром по умершим.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «начертанных знаков». Редкое еврейское выражение, вероятно, обозначает постоянную отметину на теле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: надрезов
  rationale: Существительное обозначает порез или надрез на теле; русское «надрезов» естественно передаёт конкретное телесное действие, не уточняя его глубину или орудие.
- source_word: לָנֶפֶשׁ
  choice: ради умершего
  rationale: В данном правовом и траурном контексте נֶפֶשׁ обозначает умершего человека; «ради умершего» сохраняет целевое значение предлога ל и связь с погребальным обычаем.
- source_word: בִּבְשַׂרְכֶם
  choice: на теле
  rationale: Буквально речь идёт о «вашей плоти», однако в современном русском «на теле» ясно и естественно обозначает место нанесения надрезов без изменения смысла.
- source_word: כְתֹבֶת קַעֲקַע
  choice: татуировок
  rationale: Редкое сочетание называет нанесённую на тело надпись или постоянный знак. «Татуировок» наиболее естественно передаёт вероятный референт, а сноска сохраняет лексическую неопределённость.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: не наносите на себя
  rationale: נתן с ב здесь означает нанесение знака на тело; «наносите на себя» идиоматично по-русски и сохраняет прямой запрет.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Передача личного имени формой «Яхве» сохраняет его как имя в формуле божественного самообозначения и соответствует консультационному тексту POB.
theological_decisions:
- issue: Объём запрета на телесные знаки и его связь с траурными обрядами
  choice: Первый запрет прямо связан с умершим; второй передан как самостоятельный запрет на татуировки без добавочного ограничения.
  alternative: Отнести оба запрета исключительно к языческому трауру либо сформулировать универсальный запрет на любые современные татуировки во всех культурах.
  rationale: Еврейский текст явно присоединяет לָנֶפֶשׁ к надрезам, но не повторяет это уточнение при כְתֹבֶת קַעֲקַע. Перевод не должен ни искусственно сужать, ни расширять сферу второго запрета.
translation_notes:
  register: Современный литературный русский язык; краткая и прямая форма законодательного запрета. «Надрезов» звучит естественно и конкретно, «татуировок» понятно современному читателю, а сноски сохраняют идиоматичность первого выражения и редкость второго.
