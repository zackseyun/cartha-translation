source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: ru
  text: А в пятый год можете есть его плоды, чтобы оно давало вам больший урожай. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: А в пятый год
  rationale: Сочетание союза и предлога продолжает последовательность установлений, одновременно обозначая переход от ограничений предыдущих лет к разрешению пятого года.
- source_word: תֹּאכְלוּ
  choice: можете есть
  rationale: В данном правовом контексте форма выражает разрешение после прежнего запрета; «можете есть» естественно передаёт эту силу по-русски.
- source_word: אֶת־פִּרְיוֹ
  choice: его плоды
  rationale: פְּרִי здесь означает плоды дерева; местоимение сохраняет отсылку к дереву, о котором говорится в контексте.
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: чтобы урожай его для вас умножился
  rationale: Инфинитив с לְ передаёт цель или ожидаемый результат. «Урожай» естественно выражает תְּבוּאָה, а формулировка сохраняет образ увеличения и местоименную отсылку оригинала.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Я — Яхве, ваш Бог
  rationale: Сохранено торжественное заветное самоименование, а тетраграмматон передан как личное имя «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст непосредственно употребляет тетраграмматон; форма «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Связь соблюдения установления с увеличением урожая
  choice: сохранена целевая формулировка «чтобы… умножился»
  alternative: «и тогда оно будет давать вам больше плодов»
  rationale: Конструкция לְהוֹסִיף допускает оттенок цели или результата. Перевод не уточняет сверх текста механизм этой связи и сохраняет богословское напряжение между повелением и обещанным плодородием.
translation_notes:
  register: Современный литературный русский язык с ясной правовой модальностью и торжественным, но понятным завершением. Архаизмы и конфессионально закреплённая замена личного имени титулом не используются.
