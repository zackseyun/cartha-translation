id: LEV.19.37
reference: Leviticus 19:37
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: ru
  text: Итак, соблюдайте все Мои установления и все Мои постановления[a] и исполняйте их. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все Мои предписания и все Мои правила». В еврейском тексте употреблены два разных правовых термина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Итак, соблюдайте
  rationale: Глагол שׁמר в правовом и заветном контексте означает «соблюдать». Союз ו в заключительном стихе главы естественно передан как «итак», что выражает итоговый характер повеления.
- source_word: כָּל
  choice: все
  rationale: Сохраняет всеохватный смысл обоих употреблений еврейского слова.
- source_word: חֻקֹּתַי
  choice: Мои установления
  rationale: Слово חֻקִּים обозначает предписанные установления; этот перевод сохраняет отличие от следующего правового термина מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: Мои постановления
  rationale: Слово מִשְׁפָּטִים может обозначать судебные решения, нормы или постановления. «Постановления» передаёт правовой регистр и не смешивает термин с חֻקִּים.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: и исполняйте их
  rationale: Глагол עשה применительно к законам означает исполнять или осуществлять; «исполняйте» звучит естественно и точно в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В исходном тексте стоит тетраграмматон как личное имя. Форма «Яхве» прямо передаёт имя и не подменяет его титулом.
- issue: Соотношение חֻקֹּתַי и מִשְׁפָּטַי
  choice: «Мои установления» и «Мои постановления» как два различных правовых термина
  alternative: Передать оба слова общим словом «законы»
  rationale: Исходный текст намеренно употребляет два разных термина; их различие следует сохранить, не приписывая им более узкого богословского разграничения, чем позволяет контекст.
translation_notes:
  register: Современный литературный русский язык с dignified правовым регистром. Императив передаёт предписывающую силу древнееврейских форм 2-го лица множественного числа. Заглавная буква в притяжательном местоимении отражает принятую русскую библейскую типографическую традицию.
