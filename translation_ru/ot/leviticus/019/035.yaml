  text: לֹא תַעֲשׂ֥וּ עָ֖וֶל בַּ/מִּשְׁפָּ֑ט בַּ/מִּדָּ֕ה בַּ/מִּשְׁקָ֖ל וּ/בַ/מְּשׂוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: ru
  text: Не поступайте несправедливо в суде, при измерении длины, веса или объёма.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: Не поступайте
  rationale: Форма второго лица множественного числа выражает запрет. «Не поступайте» естественно сочетается с наречием «несправедливо» и сохраняет нормативный тон.
- source_word: עָוֶל
  choice: несправедливо
  rationale: Слово обозначает неправду, несправедливость или нечестность; наречная передача создаёт естественную русскую конструкцию с глаголом עשה.
- source_word: בַּמִּשְׁפָּט
  choice: при суде
  rationale: מִשְׁפָּט может означать суд, судебное решение или правосудие. Буквально близкое «при суде» сохраняет широту значения и связь с последующим перечнем практических областей справедливости.
- source_word: בַּמִּדָּה
  choice: при измерении длины
  rationale: מִדָּה — мера или измерение, нередко длины либо размера. Уточнение «длины» отличает эту категорию от отдельно названных веса и вместимости.
- source_word: בַּמִּשְׁקָל
  choice: веса
  rationale: מִשְׁקָל означает вес или взвешивание. В сочетании «измерение… веса» русский текст звучит ясно и отражает торговый контекст.
- source_word: וּבַמְּשׂוּרָה
  choice: объёма
  rationale: מְשׂוּרָה обозначает меру вместимости или отмеренное количество. «Объём» — понятный современный термин, не сужающий значение только до жидкостей или сыпучих веществ.
