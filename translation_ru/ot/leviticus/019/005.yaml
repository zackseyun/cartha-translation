  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: ru
  text: Когда будете приносить Яхве мирную жертву, приносите её так, чтобы вы были приняты благосклонно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для вашего принятия».'
    reason: Более буквальная передача לִרְצֹנְכֶם; основная формулировка выражает в современном русском целевой смысл благосклонного принятия.
lexical_decisions:
- source_word: וְכִי
  choice: Когда
  rationale: В данном законодательном контексте כִּי вводит обстоятельство, при котором действует предписание. Русское «когда» естественно передаёт условно-временной смысл.
- source_word: תִזְבְּחוּ / תִּזְבָּחֻהוּ
  choice: будете приносить / приносите её
  rationale: Глагол זבח обозначает жертвенное заклание или принесение жертвы. «Приносить» естественно звучит по-русски в культовом контексте, а повтор глагола сохраняет структуру и предписывающую силу еврейского текста.
- source_word: זֶבַח שְׁלָמִים
  choice: мирную жертву
  rationale: Это традиционное и понятное русское обозначение данной категории жертв. Оно сохраняет связь שְׁלָמִים с идеей мира и благополучия, не сводя значение только к общению или совместной трапезе.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает посвящение и адресата жертвы; русская конструкция с глаголом «приносить» допускает дательный падеж без отдельного предлога. Имя יהוה передано как «Яхве».
- source_word: לִרְצֹנְכֶם
  choice: чтобы обрести благоволение
  rationale: В жертвенном законодательстве רָצוֹן указывает на благосклонное принятие Богом. Эта формулировка естественна по-русски и сохраняет связь между правильным принесением жертвы и принятием приносящих, не превращая выражение в указание на их личное желание.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Смысл לִרְצֹנְכֶם в жертвенном контексте
  choice: чтобы обрести благоволение
  alternative: чтобы вы были приняты; по вашей воле
  rationale: Контекст требует смысла благосклонного принятия Богом, а не совершения жертвы по желанию приносящих. Сноска сохраняет более буквальную и несколько неоднозначную форму выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного предписания. Форма множественного числа сохранена. Термин «мирная жертва» употреблён как узнаваемое библейское название жертвенной категории.
