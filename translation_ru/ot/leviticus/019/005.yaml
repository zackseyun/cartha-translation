review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: כִּי имеет условно-временное значение, זֶבַח שְׁלָמִים — установленное наименование «мирная жертва», а Яхве сохранено как личное имя. Однако «обрести благоволение» несколько смещает фокус к приобретению расположения, тогда как לִרְצֹנְכֶם в данном жертвенном контексте говорит о принятии/приемлемости приносящих (и их жертвы) перед Богом.'
  naturalness: «Когда будете приносить… приносите её…» — естественная для современного литературного русского законодательная формула. «Чтобы вы были приняты благосклонно» ясно и естественно передаёт целевой смысл без излишнего толкования.
  terminology: '«Мирная жертва» — устойчивый и понятный термин. «Яхве» соответствует указанному решению по передаче тетраграмматона. Имеющаяся сноска нуждается в исправлении: «для вашего благоволения» по-русски означает благоволение, исходящее от самих адресатов, и потому не передаёт требуемого значения.'
  issues:
  - severity: medium
    issue: Сноска ошибочно предлагает вариант «для вашего благоволения».
    rationale: Русское выражение естественно понимается как «для благоволения, которое принадлежит вам/исходит от вас», тогда как רָצוֹן здесь относится к благосклонному принятию перед Богом. Это создаёт смысл, которого в еврейском тексте нет.
  - severity: low
    issue: «Обрести благоволение» менее точно, чем формулировка о принятии.
    rationale: Эта фраза может звучать как заслуживание Божьей милости; целевая конструкция לִרְצֹנְכֶם и английский аудит точнее отражаются формой «чтобы вы были приняты благосклонно».
  revised_text: Когда будете приносить Яхве мирную жертву, приносите её так, чтобы вы были приняты благосклонно.[a]
