lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В формуле введения прямой речи глагол דבר естественно передаётся по-русски как «сказал»; форма с וַ־ обозначает следующий эпизод повествования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и отличает имя от титула «Господь».
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного еврейским предлогом אֶל.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Формульное לֵאמֹר вводит последующую прямую речь; в современном русском его функцию естественно выражает двоеточие без избыточного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное божественное имя. «Яхве» прямо передаёт тетраграмматон; традиционное «Господь» заменяет имя титулом, а «Иегова» отражает более позднюю гибридную форму произношения.
translation_notes:
  register: Современный литературный русский; формульность исходного текста сохранена без неестественного буквального оборота «говоря».
