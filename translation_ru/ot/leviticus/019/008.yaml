id: LEV.19.8
reference: Leviticus 19:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: ru
  text: Кто ест его, тот понесёт свою вину[a], потому что осквернил святое, принадлежащее Господу[b]; тот человек будет отсечён от своего народа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понесёт наказание за свою вину». Еврейский оборот может подразумевать и виновность, и её последствия.'
    reason: lexical_alternative
  - marker: b
    text: «Святое, принадлежащее Господу» — то, что посвящено Господу; здесь имеется в виду жертвенное мясо.
    reason: cultural_note
  - marker: c
    text: Формула «будет отсечён от своего народа» не уточняет, идёт ли речь о смерти, исключении из общины или непосредственном Божьем суде.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: Кто станет есть его
  rationale: Причастная форма с местоименным суффиксом обозначает любого, кто ест упомянутое ранее жертвенное мясо; оборот сохраняет обобщённое значение и естественно звучит по-русски.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: понесёт свою вину
  rationale: Еврейская идиома охватывает как виновность, так и связанные с ней последствия; буквальный образ сохранён без сужения смысла до одного лишь наказания.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание наказания; «потому что» ясно передаёт причинную связь.
- source_word: קֹדֶשׁ יְהוָה
  choice: святыню Господа
  rationale: קֹדֶשׁ здесь означает посвящённое Господу святое, в контексте — жертвенное мясо. «Святыня» сохраняет компактность и не добавляет отсутствующего в этой фразе слова «жертва».
- source_word: יְהוָה
  choice: Господа
  rationale: В русской библейской литературной традиции тетраграмматон естественно передаётся титулом «Господь»; это обеспечивает достоинство и понятность текста без спорной реконструкции произношения в основном тексте.
- source_word: חִלֵּל
  choice: осквернил
  rationale: Пиэль от חלל означает обращение со святым как с обычным, то есть его профанацию; «осквернил» — понятный современный эквивалент с надлежащей сакральной окраской.
- source_word: וְנִכְרְתָה
  choice: истребится
  rationale: Форма передаёт традиционную формулу заветного наказания. Возвратная форма оставляет исполнителя и конкретный способ кары неуточнёнными.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: тот человек
  rationale: נֶפֶשׁ в правовом контексте обозначает человека как целое, а не отделённую от него «душу»; выбран естественный современный русский эквивалент.
- source_word: מֵעַמֶּיהָ
  choice: из своего народа
  rationale: Суффикс женского рода согласуется с נֶפֶשׁ, однако относится к нарушителю; возвратное «своего» естественно передаёт эту соотнесённость.
theological_decisions:
- issue: Смысл формулы наказания וְנִכְרְתָה
  choice: Сохранить формулу как «истребится … из своего народа», не уточняя способ исполнения.
  alternative: «будет казнён», «будет изгнан из общины» или «будет устранён непосредственным Божьим судом»
  rationale: Стих не определяет однозначно, означает ли формула смерть, исключение из общины или непосредственный Божий суд. Перевод сохраняет эту богословскую и правовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для обычного читателя; ключевые правовые и культовые идиомы сохранены там, где их конкретизация устранила бы подлинную неоднозначность.
