revisions:
- from: Кто станет есть его, тот понесёт свою вину[a], потому что осквернил святыню Господа[b]; истребится тот человек из своего народа[c].
  to: Кто ест его, тот понесёт свою вину[a], потому что осквернил святое, принадлежащее Господу[b]; тот человек будет отсечён от своего народа[c].
  rationale: Правка устраняет невыраженный начинательный оттенок, точнее передаёт кֹדֶשׁ как посвящённое Господу святое и, главное, сохраняет спорную юридическую формулу כרת без её истолкования как физического истребления. Сноска к формуле сохраняет необходимую историко-правовую неоднозначность.
