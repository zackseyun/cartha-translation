  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: ru
  text: Не творите несправедливости на суде. Не оказывай предпочтения бедному и не выказывай особого почтения знатному[b]; по справедливости[a] суди своего ближнего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по правде».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально еврейские обороты: «поднимать лицо бедного» и «почитать лицо знатного»; в судебном контексте они означают оказывать предпочтение или проявлять пристрастие.'
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: несправедливости на суде
  rationale: Сочетание обозначает несправедливое действие в сфере судебного разбирательства. «На суде» естественно передаёт юридический контекст.
- source_word: תִשָּׂא פְנֵי דָל
  choice: проявляй пристрастия к бедному
  rationale: Еврейская идиома «поднимать лицо» означает оказывать предпочтение; в данном контексте речь идёт о пристрастности при вынесении решения.
- source_word: דָל
  choice: бедному
  rationale: Слово может означать бедного, слабого или человека низкого положения; «бедный» прямо и ясно передаёт основной социальный смысл.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: оказывай особого почтения знатному
  rationale: Передаёт параллельную идиому и запрещённую почтительную пристрастность к человеку высокого общественного положения, не ограничивая значение богатством.
- source_word: בְּצֶדֶק
  choice: по правде
  rationale: Русское выражение сохраняет морально-судебную широту צֶדֶק и звучит естественнее буквального «с праведностью»; судебное значение уточнено в сноске.
- source_word: תִּשְׁפֹּט
  choice: суди
  rationale: Прямая передача юридического глагола שׁפט и его предписывающей силы.
- source_word: עֲמִיתֶךָ
  choice: своего ближнего
  rationale: Обозначает другого члена сообщества. «Ближний» соответствует контексту Левита 19 и не сводит отношение к географическому соседству.
theological_decisions:
- issue: Передача צֶדֶק в нравственно-правовом контексте
  choice: по правде
  alternative: справедливо; по справедливости
  rationale: Основной вариант сохраняет одновременно нравственный и судебный оттенки слова, а сноска указывает на более явно юридическое прочтение, не устраняя смысловую напряжённость.
- issue: Беспристрастие к бедному и знатному
  choice: одинаково ясно запретить предпочтение обеим сторонам
  alternative: понять первую часть как общее сострадание к бедному, а вторую как уважение к великому
  rationale: Параллельные судебные идиомы запрещают пристрастность независимо от социального положения и не разрешают ни классовое предпочтение, ни подобострастие.
translation_notes:
  register: Современный литературный и достойный законодательный стиль. Сохранён заметный в еврейском тексте переход от множественного числа («не творите») к обращению в единственном числе («не проявляй… суди»). «Знатный» обозначает человека высокого положения, а не обязательно богатого. Все сносочные маркеры включены в основной текст.
