source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: ru
  text: Не обирай свой виноградник дочиста[a] и не подбирай упавшие ягоды[b] в своём винограднике; оставь их бедному и пришельцу[c]. Я — Яхве, Бог ваш.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не собирай оставшихся гроздей». Еврейский глагол означает снова пройти по лозам и собрать то, что осталось после основного сбора.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оставшиеся виноградины». Еврейское слово относится к виноградинам, отделившимся или упавшим во время сбора урожая.'
    reason: lexical_alternative
  - marker: c
    text: То есть некоренному жителю, постоянно живущему среди израильтян.
    reason: lexical_clarification
lexical_decisions:
- source_word: כַרְמְךָ
  choice: свой виноградник / в своём винограднике
  rationale: כֶּרֶם обозначает виноградник; русский эквивалент точен, естественен и сохраняет сельскохозяйственный контекст.
- source_word: תְעוֹלֵל
  choice: не обирай ... до конца
  rationale: В данном контексте глагол означает повторно пройти по лозам и собрать то, что осталось после основного сбора. Формулировка ясно передаёт запрет на исчерпывающий сбор урожая.
- source_word: פֶּרֶט
  choice: осыпавшиеся ягоды
  rationale: Слово обозначает отделившиеся или упавшие при сборе виноградины. «Осыпавшиеся ягоды» конкретно и естественно передаёт смысл в контексте виноградника.
- source_word: תְלַקֵּט
  choice: подбирай
  rationale: לקט означает собирать или подбирать отдельные упавшие предметы; «подбирать» точно описывает действие по отношению к осыпавшимся ягодам.
- source_word: לֶעָנִי
  choice: бедному
  rationale: עָנִי здесь обозначает бедного, нуждающегося человека; дательный падеж естественно сочетается с повелением оставить урожай ему.
- source_word: וְלַגֵּר
  choice: и пришельцу
  rationale: גֵּר — не коренной житель, постоянно живущий среди Израиля. «Пришелец» сохраняет библейско-правовой оттенок, а сноска уточняет значение для современного читателя.
- source_word: תַּעֲזֹב אֹתָם
  choice: оставь их
  rationale: עזב в данном контексте означает намеренно оставить остатки урожая для других; краткая форма естественно передаёт предписание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени, выраженного тетраграмматоном, сохраняет различие между именем Бога и титулом.
- source_word: אֱלֹהֵיכֶם
  choice: Бог ваш
  rationale: Сохраняется формула завета и множественное число местоименного суффикса, обращённого ко всему народу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. «Яхве» непосредственно передаёт тетраграмматон и сохраняет богословскую силу заключительной формулы.
- issue: Социально-правовое значение גֵּר
  choice: пришелец
  alternative: чужеземец; постоянно живущий иноземец
  rationale: Термин обозначает некоренного жителя, поселившегося среди Израиля, а не всякого иностранца вообще. Основной текст сохраняет традиционно понятный термин, сноска раскрывает его объём.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием правового предписания. Повтор слова «виноградник» сохранён в соответствии с еврейским текстом; формы единственного числа в заповедях и множественного числа в формуле «Бог ваш» также сохранены.
