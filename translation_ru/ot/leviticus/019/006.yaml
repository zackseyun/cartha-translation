  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: ru
  text: В день принесения вашей жертвы её следует есть и на следующий день; то, что останется к третьему дню, должно быть сожжено в огне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: В день, когда вы принесёте эту жертву
  rationale: Временное בְּיוֹם передано естественным русским оборотом «в день». Отглагольная форма זִבְחֲכֶם допускает смысл «вашего жертвоприношения» или «когда вы принесёте жертву»; придаточное предложение яснее в современном русском и сохраняет культовый контекст.
- source_word: יֵאָכֵל
  choice: её следует есть
  rationale: Нифаль выражает пассивное предписание. Русское «следует есть» естественно передаёт нормативный характер закона; местоимение «её» восстановлено из контекста и согласовано со словом «жертва».
- source_word: וּמִמָּחֳרָת
  choice: а также на следующий день
  rationale: מָחֳרָת обозначает следующий день. Хотя מִן буквально может означать «с/от», в данной временной последовательности речь идёт о допустимом употреблении и на следующий день.
- source_word: וְהַנּוֹתָר
  choice: оставшееся же
  rationale: Причастная форма обозначает то, что осталось. Частица «же» естественно отмечает переход к противопоставленному предписанию, не усиливая его сверх еврейского текста.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: до третьего дня
  rationale: Прямо сохраняется временная граница, выраженная עַד; формулировка не уточняет сверх текста, наступил ли уже третий день или остаток сохранялся к нему.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: нужно сжечь в огне
  rationale: Пассивный нифаль в юридическом контексте передан безличным предписанием. «В огне» сохраняет конкретный образ еврейского выражения.
