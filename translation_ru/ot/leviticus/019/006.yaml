  rationale: Исправлена русская синтаксическая связь двух разрешённых дней, устранено невыраженное в оригинале «эту», а временная граница для остатка передана ясным оборотом «к третьему дню». Сохранены культовый термин «жертва», нормативный регистр и пассивное предписание о сожжении.
