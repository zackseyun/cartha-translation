  verdict: revise
  source_fidelity: 'Основной смысл передан верно: два запрета на обращение к запрещённым практикам, последующее разыскивание и осквернение через них, затем заветная формула с личным именем Бога. Однако «вызыватели духов» чрезмерно конкретизирует первый неоднозначный термин как активное вызывание духов; более нейтральное «медиумы» лучше сохраняет его возможное обозначение практикующих лиц и соответствует параллелизму.'
  naturalness: Фраза краткая и в целом естественная. «Ведуны» понятно, но имеет фольклорно-разговорный оттенок; в сочетании с «медиумами» оно всё же может служить различающим переводом второго термина. Оборот «чтобы не оскверниться через них» возможен, но «и не оскверняйтесь через них» яснее передаёт запретительную функцию инфинитива в русском законодательном стиле.
  terminology: «Оскверняться» удачно сохраняет неуточнённую широту טמא. «Яхве, ваш Бог» точно передаёт тетраграмматон и форму второго лица множественного числа. Для אֹבוֹת предпочтительно «медиумы»; сноска должна прямо фиксировать, что оба еврейских названия лексически спорны и могут указывать как на практиков, так и в отдельных толкованиях на духов/связанные с ними средства.
  issues:
