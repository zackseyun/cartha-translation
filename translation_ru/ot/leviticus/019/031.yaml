    issue: «Вызыватели духов» сужает значение אֹבוֹת.
    rationale: Термин может обозначать не только того, кто вызывает духов, но и медиума либо, в иных анализах, самого духа или средство общения с ним. «Медиумы» точнее передаёт выбранное понимание как категории практиков, не навязывая способ их действия.
  - severity: low
    issue: Связка «не ищите их, чтобы не оскверниться» несколько ослабляет прямую запретительную функцию последнего оборота.
    rationale: Русское «и не оскверняйтесь через них» естественно для законодательного контекста и передаёт следствие/цель еврейского инфинитива, не уточняя характер осквернения.
