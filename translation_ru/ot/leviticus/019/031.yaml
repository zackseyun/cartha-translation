source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: ru
  text: Не обращайтесь к медиумам и к ведунам[a]; не ищите их и не оскверняйтесь через них. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские названия неоднозначны. Первое может относиться к медиумам, вызывающим духов, к духам умерших или к средству общения с ними; второе — к ведунам, прорицателям или людям, связанным с духами-помощниками.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: обращайтесь
  rationale: Глагол פנה буквально означает «поворачиваться, обращаться к». В контексте запрета «обращаться к» естественно передаёт направленность к таким людям, не сужая значение до одного лишь формального совета или обряда.
- source_word: הָאֹבֹת
  choice: вызывателям духов
  rationale: Слово אוֹב может обозначать дух умершего, средство его вызывания либо человека, который к нему обращается. В данном параллельном перечислении естественнее понимать его как обозначение практикующих лиц; перевод передаёт связь с вызыванием духов, сохраняя пояснение об исходной неоднозначности в сноске.
- source_word: הַיִּדְּעֹנִים
  choice: ведунам
  rationale: יִדְּעֹנִי обозначает связанного с тайным знанием и духами человека. Современное русское «ведун» сохраняет смысл оккультного знатока и не вызывает сказочных ассоциаций, свойственных слову «волшебник».
- source_word: תְּבַקְשׁוּ
  choice: не ищите их
  rationale: בקש означает «искать, разыскивать». Прямой перевод сохраняет усиление запрета после «не обращайтесь» и не добавляет отсутствующего в форме глагола уточнения «совета» или «помощи».
- source_word: לְטָמְאָה בָהֶם
  choice: чтобы не оскверниться через них
  rationale: Инфинитив טמא с предлогом ל выражает цель или результат, а בָהֶם — средство либо причину. «Оскверниться» сохраняет как обрядовую, так и нравственную сторону нечистоты; «через них» не делает одну из них исключительной.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Передаёт форму второго лица множественного числа и заветное самоопределение Бога.
theological_decisions:
- issue: Характер осквернения
  choice: Не уточнять, является ли нечистота исключительно обрядовой или исключительно нравственной.
  alternative: «стать ритуально нечистыми» либо «нравственно оскверниться»
  rationale: В книге Левит корень טמא способен охватывать обрядовое и нравственное измерения. Формулировка «оскверниться» сохраняет эту широту и напряжение текста.
- issue: Кого обозначают אוֹב и יִדְּעֹנִי
  choice: В основном тексте понимать оба слова как обозначения запрещённых практиков.
  alternative: Понимать их как самих духов или духов-помощников.
  rationale: Формы множественного числа и повеления обращаться к ним и искать их хорошо согласуются с обозначением людей, однако лексическая неоднозначность не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом законодательного текста. «Вызыватели духов» понятно называет запрещённую практику, а «ведуны» различает два еврейских термина без сказочного оттенка слова «волшебники». Личное имя передано как «Яхве».
