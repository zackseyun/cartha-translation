base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: ru
  text: Не оскверняй свою дочь, вовлекая её в блуд[a], чтобы земля не предалась блуду[b] и не наполнилась развратом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставляя её блудодействовать»; возможно также: «делая её проституткой». Еврейская форма глагола имеет каузативное значение, но не уточняет способ вовлечения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы земля не блудодействовала». Земля олицетворена как охваченная развратом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «порочностью», «мерзостью». Еврейское слово обозначает вопиющую нравственную порочность, часто сексуального характера.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: оскверняй
  rationale: Глагол חלל в породе пиэль обозначает обращение с кем-либо как с нечистым или лишённым святости. «Оскверняй» сохраняет характерную для Левита связь со святостью и профанацией и звучит естественнее, чем буквальное «делай несвятой».
- source_word: בִּתְּךָ
  choice: своей дочери
  rationale: Передаёт существительное в единственном числе с суффиксом 2-го лица мужского рода единственного числа; возвратное «своей» естественно в русском повелительном предложении.
- source_word: לְהַזְנוֹתָהּ
  choice: вовлекая её в блуд
  rationale: 'Инфинитив породы хифиль от זנה имеет каузативное значение: отец становится причиной её участия в блуде. «Вовлекая» сохраняет причинный смысл, но не добавляет отсутствующей в еврейском тексте конкретики о способе — принуждении, продаже или ином действии.'
- source_word: תִזְנֶה הָאָרֶץ
  choice: земля не предалась блуду
  rationale: 'Сохраняется олицетворяющая метафора: земля сама оказывается охвачена блудом. Формулировка естественна по-русски и не сводит образ к абстрактному «нравственному упадку».'
- source_word: וּמָלְאָה הָאָרֶץ
  choice: и не наполнилась
  rationale: Перфект с союзом выражает следствие в предостережении; русская конструкция после «чтобы» естественно передаёт предупреждаемое последствие.
- source_word: זִמָּה
  choice: развратом
  rationale: В данном контексте слово обозначает вопиющую нравственную порочность с явным сексуальным оттенком. «Разврат» сохраняет этот оттенок и понятен современному читателю, не сужая значение до одного юридически определённого проступка.
theological_decisions:
- issue: Передача образа земли, которая «блудодействует»
  choice: Сохранить метафору в выражении «земля не предалась блуду».
  alternative: «Чтобы жители земли не погрязли в безнравственности».
  rationale: Еврейский текст называет субъектом именно землю и применяет к ней глагол זנה. Сохранение олицетворения удерживает риторическую силу и коллективное измерение предупреждения, не вводя дополнительных богословских категорий.
- issue: Передача חלל в контексте святости
  choice: «Оскверняй».
  alternative: «Бесчесть» или «позорь».
  rationale: В книге Левит חלל принадлежит смысловому полю святого и осквернённого. «Осквернять» сохраняет эту связь, тогда как «бесчестить» преимущественно описывает общественный позор.
- issue: Степень конкретизации каузативного действия отца
  choice: «Вовлекая её в блуд».
  alternative: «Делая её проституткой» или «принуждая её к проституции».
  rationale: Каузатив указывает, что отец вызывает или допускает её участие в блуде, но сам по себе не уточняет ни коммерческий характер, ни способ принуждения. Основной текст поэтому не разрешает эту неоднозначность без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Лексема «блуд» несколько возвышенна, но остаётся понятной и позволяет единообразно передать повтор корня זנה в обеих частях стиха. Синтаксис краткий и сохраняет причинно-следственную структуру еврейского текста.
