  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: ru
  text: Если мужчина вступит с женщиной в половую связь с излиянием семени, а она — рабыня, предназначенная мужчине[a], но не выкуплена и не получила свободы, дело подлежит разбирательству[b]. Их не следует предавать смерти, потому что она не была освобождена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «обручённая с мужчиной» или «обещанная мужчине». Еврейское слово, вероятно, означает, что рабыня была закреплена за мужчиной или обещана ему, хотя её правовое положение отличалось от положения свободной обручённой женщины.'
    reason: lexical_alternative
  - marker: b
    text: 'Редкое еврейское слово имеет не вполне ясное значение; возможно также: «должно последовать наказание» или «должна быть выплачена компенсация».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: мужчина
  rationale: В казуистической правовой формуле речь идёт именно о взрослом человеке мужского пола; это прямое соответствие еврейскому слову.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: ляжет с женщиной и произойдёт излияние семени
  rationale: Перевод сохраняет как обозначение полового акта, так и юридически значимую подробность об излиянии семени, выраженную еврейским оборотом.
- source_word: שִׁפְחָה
  choice: рабыня
  rationale: Слово прямо обозначает женщину в несвободном, рабском положении; более мягкое «служанка» затемнило бы существенный для закона правовой статус.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: предназначенная мужчине
  rationale: Редкое причастие, вероятно, указывает, что рабыня закреплена за мужчиной или обещана ему, однако не позволяет уверенно приравнять её положение к полному статусу обручённой свободной женщины.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: ещё не выкупленная
  rationale: Сочетание абсолютного инфинитива с личной формой подчёркивает, что выкуп фактически не состоялся. «Выкупленная» естественно передаёт правовой и имущественный смысл.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: не получившая свободы
  rationale: Формулировка естественна по-русски и сохраняет юридический смысл освобождения от рабского статуса.
- source_word: בִּקֹּרֶת
  choice: дело подлежит разбирательству
  rationale: Редкое и спорное существительное может обозначать официальное рассмотрение дела. Такая формулировка не навязывает конкретного вида взыскания, а неопределённость отражена в сноске.
- source_word: לֹא יוּמְתוּ
  choice: их нельзя предавать смерти
  rationale: Множественное число относится к обоим участникам, а пассивная юридическая конструкция указывает на судебное лишение жизни.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: потому что она не была освобождена
  rationale: Причина прямо связывается с тем, что женщина по-прежнему оставалась в рабском статусе.
theological_decisions:
- issue: Правовой статус נֶחֱרֶפֶת לְאִישׁ
  choice: предназначенная мужчине
  alternative: обручённая с мужчиной; обещанная мужчине
  rationale: Стих отличает положение этой невыкупленной и неосвобождённой рабыни от положения свободной обручённой женщины. Выбранная передача сохраняет наличие обязательства перед мужчиной, не утверждая более полного правового статуса, чем допускает еврейский текст.
- issue: Значение בִּקֹּרֶת
  choice: дело подлежит разбирательству
  alternative: должно последовать наказание; должна быть выплачена компенсация
  rationale: Поскольку слово встречается редко и его точное значение спорно, основной текст оставляет характер юридического последствия открытым, а возможные значения приводятся в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского стиля. Формулировки достаточно ясны для обычного читателя; рабский статус назван прямо, а подлинная лексическая неопределённость сохранена в сносках. Маркеры сносок поставлены непосредственно при тех выражениях, к которым относятся.
