source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: ru
  text: Не мсти своим соплеменникам и не таи на них злобы, а люби своего ближнего, как самого себя. Я — Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִקֹּם
  choice: не мсти
  rationale: Краткая и естественная русская передача запрета на возмездие из личной мести; сохраняет активный смысл еврейского глагола נקם.
- source_word: תִטֹּר
  choice: не таи злобы
  rationale: Передаёт продолжительное удерживание обиды или враждебного чувства, выраженное глаголом נטר, естественным современным русским оборотом.
- source_word: בְּנֵי עַמֶּךָ
  choice: на сынов своего народа
  rationale: Сохраняет буквальный мужской образ исходного выражения «сыны твоего народа» и его указание на членов собственного народа; более идиоматическое понимание дано в сноске.
- source_word: וְאָהַבְתָּ
  choice: но люби
  rationale: В правовом контексте форма имеет повелительно-обязывающую силу. Русское повелительное наклонение ясно и естественно продолжает ряд предписаний; союз передан как «но», поскольку положительная заповедь противопоставлена двум запретам.
- source_word: לְרֵעֲךָ
  choice: ближнего твоего
  rationale: «Ближний» — точная, устоявшаяся и контекстуально уместная передача רֵעַ, которое может обозначать товарища, другого человека или соплеменника.
- source_word: כָּמוֹךָ
  choice: как самого себя
  rationale: Естественная русская передача сравнительного оборота, сохраняющая самого адресата как меру любви к ближнему.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Объём круга людей, к которым относится повеление
  choice: Сохранить конкретное выражение «сыны своего народа» в первом запрете и отдельное слово «ближний» в положительной заповеди.
  alternative: Обобщить оба выражения как относящиеся ко всем людям или, напротив, явно ограничить оба только соплеменниками.
  rationale: Еврейский текст использует два разных выражения. Перевод сохраняет это различие и не вносит в основной текст ни позднейшего универсального расширения, ни жёсткого ограничения.
- issue: Передача Божьего имени
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה; его транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского предписания. Формы «не мсти», «не таи», «люби» звучат ясно и непосредственно; порядок «ближнего твоего» слегка возвышен и сохраняет узнаваемость ключевой формулы без архаической перегруженности.
