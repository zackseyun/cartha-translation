revisions:
- from: Не мсти и не таи злобы на сынов своего народа[a], но люби ближнего твоего, как самого себя. Я — Яхве.
  to: Не мсти своим соплеменникам и не таи на них злобы, а люби своего ближнего, как самого себя. Я — Яхве.
  rationale: Правка устраняет русскую синтаксическую неоднозначность, сохраняя общий объект обоих запретов и различие исходного текста между «сынами твоего народа» и «ближним». Идиоматическое «соплеменники» сопровождается буквальной сноской; богословских или интерпретационных ограничений в текст не добавлено.
