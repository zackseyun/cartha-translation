    rationale: Вариант «не мсти и не таи злобы на сынов своего народа» не позволяет естественно отнести оборот «на сынов» к глаголу «мстить». В еврейском тексте объект относится к обоим запретам; по-русски это следует выразить раздельно.
  - severity: low
    issue: Не вполне нейтральный порядок слов «ближнего твоего»
    rationale: Он понятен и допустим в высоком библейском стиле, но «своего ближнего» более естественно для современного литературного русского без потери смысла.
  revised_text: Не мсти своим соплеменникам и не таи на них злобы, а люби своего ближнего, как самого себя. Я — Яхве.
