  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: ru
  text: Если у тебя, в вашей земле, поселится пришелец[a], не притесняйте его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Пришелец» передаёт еврейское гер: пришлый житель, живущий среди народа Израиля; также может переводиться как «чужеземец» или «переселенец».'
    reason: cultural_note
  - marker: b
    text: 'Или: «не обижайте его», «не угнетайте его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Вводит предусмотренный законом случай; русское «если» естественно передаёт условно-ситуативную конструкцию.
- source_word: יָגוּר
  choice: поселится
  rationale: Глагол גור обозначает проживание неуроженца среди местного населения; «поселится» ясно передаёт начало или факт такого проживания.
- source_word: אִתְּךָ
  choice: у тебя
  rationale: Сохраняет единственное число еврейского обращения и естественно звучит в сочетании с глаголом «поселится».
- source_word: גֵּר
  choice: пришелец
  rationale: Обозначает не просто незнакомца или путника, а неуроженца, постоянно живущего среди Израиля; значение пояснено в сноске.
- source_word: בְּאַרְצְכֶם
  choice: в вашей земле
  rationale: Сохраняет множественное число обращения и библейское значение земли, принадлежащей всему народу.
- source_word: לֹא תוֹנוּ
  choice: не притесняйте
  rationale: Hiphil глагола ינה означает причинять несправедливость, обижать или угнетать; «притеснять» передаёт социально-правовой оттенок без чрезмерного сужения.
- source_word: אֹתוֹ
  choice: его
  rationale: Мужское местоимение единственного числа прямо отсылает к גֵּר.
theological_decisions:
- issue: Значение גֵּר в законодательстве о святости
  choice: пришелец
  alternative: чужеземец; переселенец; иноземец
  rationale: Термин обозначает неуроженца, живущего внутри израильского общества и находящегося под защитой его закона. «Пришелец» сохраняет традиционную библейскую окраску, а сноска предотвращает понимание слова как случайного путника.
- issue: Смена числа в обращении
  choice: сохранить «в вашей земле… у тебя… не притесняйте»
  alternative: выровнять всё обращение по единственному или множественному числу
  rationale: Еврейский текст действительно переходит от единственного числа в אִתְּךָ к множественному в בְּאַרְצְכֶם и תוֹנוּ. Сохранение этой особенности не устраняет подлинное напряжение текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой. Сохранена заметная в еврейском тексте смена единственного и множественного числа обращения; оба маркера сносок стоят непосредственно в основном тексте.
