base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: ru
  text: Не ешьте над кровью[a]. Не гадайте и не толкуйте знамения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ешьте с кровью». Древнееврейское выражение неясно; речь может идти о мясе, в котором остаётся кровь, или об участии в связанной с кровью обрядовой трапезе.'
    reason: alternative_reading
  - marker: b
    text: 'Возможные переводы: «не занимайтесь прорицанием», «не ворожите»; традиционно также: «не наблюдайте времена». Точное значение древнееврейского глагола неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: Не ешьте
  rationale: Отрицание с формой имперфекта в законодательном контексте выражает запрет. Русский отрицательный императив естественно и ясно передаёт его силу.
- source_word: עַל הַדָּם
  choice: над кровью
  rationale: Буквальная передача предлога עַל сохраняет неясность древнееврейского выражения и не сводит запрет без достаточных оснований лишь к употреблению мяса с кровью или к определённому обряду.
- source_word: תְנַחֲשׁוּ
  choice: гадайте
  rationale: Глагол נחשׁ в данной породе обозначает гадательную практику. «Гадать» — понятное современному читателю и достаточно широкое русское соответствие.
- source_word: תְעוֹנֵנוּ
  choice: занимайтесь прорицанием
  rationale: Точное значение редкого глагола спорно; оно связано с предсказательной или колдовской практикой. «Заниматься прорицанием» сохраняет отличие от предыдущего глагола, не утверждая слишком узкий способ предсказания.
theological_decisions:
- issue: Конкретный смысл запрета עַל הַדָּם
  choice: Сохранить в основном тексте относительно буквальное «над кровью»
  alternative: «с кровью»; «пока в мясе остаётся кровь»; «за обрядовой трапезой при крови»
  rationale: Неясно, запрещается ли употребление мяса с кровью, участие в ритуальной трапезе у крови или иная связанная с кровью практика. Буквальная формулировка сохраняет подлинную неоднозначность, а возможные толкования вынесены в сноску.
- issue: Соотношение двух запретов на предсказательные практики
  choice: 'Передать их различными, но близкими выражениями: «гадать» и «заниматься прорицанием»'
  alternative: «толковать знамения»; «ворожить»; традиционное «наблюдать времена»
  rationale: Два древнееврейских глагола обозначают близкие практики, однако их точное разграничение неясно. Перевод сохраняет два отдельных запрета, не вводя искусственно точной классификации.
translation_notes:
  register: Современный литературный русский язык с краткими, прямыми формулами законодательного запрета. Намеренно необычное выражение «над кровью» удержано ради смысловой неопределённости оригинала и разъяснено в сноске.
