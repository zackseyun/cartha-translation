base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: ru
  text: Не подстригайте волосы по краям головы, закругляя линию стрижки[a][b], и не повреждайте края бороды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не закругляйте край (или стороны) головы». Еврейское слово означает «край», «сторона» или «угол».'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеется в виду остригание или сбривание волос по краям головы так, чтобы линия шла кругом.
    reason: cultural_note
  - marker: c
    text: 'Или: «не губите», «не портите» или «не обезображивайте края бороды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: стригите ... кругом
  rationale: Порода hифиль глагола נקף в этом контексте обозначает круговое остригание волос по краю головы. Формулировка передаёт конкретное действие, не сводя его непременно к бритью.
- source_word: פְּאַת
  choice: по краям / края
  rationale: פֵּאָה означает край, сторону или угол. «По краям головы» и «края бороды» естественны в современном русском и сохраняют пространственный образ исходного текста.
- source_word: רֹאשְׁכֶם
  choice: головы
  rationale: Еврейский текст обращён ко множеству людей и использует суффикс множественного числа; русская обобщённая конструкция с единственным числом естественно выражает распределительное значение.
- source_word: תַשְׁחִית
  choice: повреждайте
  rationale: Hифиль שׁחת означает губить, портить или повреждать. «Повреждайте» сохраняет силу глагола, но не уточняет способ воздействия на бороду.
- source_word: זְקָנֶךָ
  choice: своей бороды
  rationale: Обычное значение זָקָן здесь — «борода»; возвратное «своей» естественно соотносит её с каждым адресатом.
- source_word: לֹא ... וְלֹא
  choice: Не ... и не ...
  rationale: Отрицательный императив в современном русском ясно и достойно передаёт два законодательных запрета без архаичного оборота.
theological_decisions:
- issue: Характер запрета
  choice: Конкретный запрет определённого остригания волос на голове и повреждения краёв бороды без указания мотива
  alternative: Запрет исключительно языческого траурного обряда либо более широкий запрет связанных с окружающими народами причёсок
  rationale: Сам стих называет запрещённые действия, но не объясняет их обрядовую или культурную причину; перевод не должен вносить такую причину в основной текст.
translation_notes:
  register: Современный литературный русский, ясный законодательный стиль. Повелительное множественное число передаёт обращение ко всему народу; «своей бороды» сохраняет распределительный смысл внезапного перехода еврейского текста к форме единственного числа.
