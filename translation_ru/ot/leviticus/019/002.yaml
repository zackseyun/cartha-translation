base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: ru
  text: 'Обратись ко всей общине сынов Израиля[a] и скажи им: «Будьте святы[b], потому что Я, Яхве, ваш Бог, свят».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко всему собранию израильтян».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Вы должны быть святы»; также возможно: «Вам надлежит быть святыми».'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: Пиэль, повелительное наклонение. В сочетании с אֶל и последующим «скажи им» русское «обратись к…» естественно передаёт приказ говорить к собранию и избегает тяжеловесного повтора «говори… и скажи».
- source_word: כָּל עֲדַת
  choice: всему обществу
  rationale: עֵדָה обозначает собранную общину Израиля; «общество» сохраняет собирательный и официальный смысл, а «всему» явно передаёт כָּל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранена буквальная родственная и грамматически мужская форма еврейского выражения; более идиоматичный корпоративный вариант дан в сноске.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Прямо передаёт обычную последовательность повелений в законодательной речи.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: Будьте святы
  rationale: Сочетание прилагательного с имперфектом имеет предписывающую силу. Русский императив естественно и ясно передаёт её, тогда как оттенок долженствования сохранён в сноске.
- source_word: קָדוֹשׁ
  choice: свят
  rationale: «Свят» — устоявшийся и содержательно полный эквивалент, сохраняющий связь Божьей святости с требуемой святостью народа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Естественно передаёт существительное с суффиксом второго лица множественного числа и сохраняет формулу отношений завета.
theological_decisions:
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Основной текст сохраняет явно родственную и мужскую форму оригинала, не сужая при этом её корпоративное значение; идиоматичный вариант указан в сноске.
- issue: Сила выражения קְדֹשִׁים תִּהְיוּ
  choice: Будьте святы
  alternative: Вы должны быть святы / Вам надлежит быть святыми
  rationale: Еврейский имперфект в данном наставлении выражает обязательное требование и допускает как императивную, так и модально-долженствовательную передачу. Основной вариант звучит естественно по-русски, а альтернативы сохраняют грамматико-богословское напряжение между повелением и обязательным состоянием народа.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Повтор корня «свят» сохранён как смысловой стержень стиха. Порядок заключительной части сделан естественным для русского языка без устранения прямого отождествления говорящего с Яхве, Богом Израиля.
