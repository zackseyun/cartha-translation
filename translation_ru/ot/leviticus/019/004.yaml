id: LEV.19.4
reference: Leviticus 19:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: ru
  text: Не обращайтесь к идолам[a] и не делайте себе литых богов[b]. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к ничтожным идолам»; еврейское слово может иметь уничижительный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «богов из литого металла»; речь идёт о богах-изображениях, изготовленных литьём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: обращайтесь
  rationale: Глагол פנה с אֶל означает «поворачиваться, обращаться к». Русское «обращаться к» сохраняет возможные оттенки направленности, внимания и религиозного упования, не сужая смысл до одного лишь поклонения.
- source_word: אֱלִילִים
  choice: идолам
  rationale: «Идолы» — ясный и естественный русский эквивалент; возможный уничижительный оттенок еврейского слова отмечен в сноске.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: литых богов
  rationale: Сочетание обозначает богов или изображения, изготовленные литьём. Перевод сохраняет множественное число אֱלֹהֵי и способ изготовления, выраженный מַסֵּכָה.
- source_word: תַעֲשׂוּ לָכֶם
  choice: не делайте себе
  rationale: Дательный «себе» естественно передаёт значение изготовления для собственного употребления или обладания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени транслитерацией сохраняет употреблённое в еврейском тексте имя, не заменяя его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Несмотря на морфологически множественную форму, здесь слово обозначает единого Бога Израиля в формуле завета.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» передаёт личное имя, а не заменяет его титулом.
- issue: Следует ли уточнять, что обращение к идолам означает поклонение
  choice: Не обращайтесь к идолам
  alternative: Не поклоняйтесь идолам; не ищите помощи у идолов
  rationale: Глагол פנה сам по себе не называет поклонение; буквальная направленность к идолам шире, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Параллельные запреты переданы симметрично; тире в формуле «Я — Яхве» естественно для русского именного сказуемого и подчёркивает самоидентификацию.
