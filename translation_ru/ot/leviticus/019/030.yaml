  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: ru
  text: Соблюдайте Мои субботы и чтите Моё святилище[a]. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бойтесь Моего святилища». Еврейский глагол может означать и страх, и благоговейное почтение; здесь речь идёт о должном отношении к святому месту Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: Мои субботы
  rationale: Сохранено явно выраженное в еврейском тексте множественное число, обозначающее установленные Яхве субботние дни и их соблюдение.
- source_word: תִּשְׁמֹרוּ
  choice: соблюдайте
  rationale: Глагол שׁמר в контексте заповеди означает хранить и исполнять предписание; «соблюдайте» естественно сочетается с «субботы» в современном русском языке.
- source_word: מִקְדָּשִׁי
  choice: Моё святилище
  rationale: מִקְדָּשׁ обозначает святое место, святилище; перевод не уточняет его как скинию или храм, поскольку исходный текст этого не делает.
- source_word: תִּירָאוּ
  choice: чтите
  rationale: ירא может выражать страх или благоговейное почтение. В отношении святилища «чтите» передаёт требование относиться к святому месту с должным благоговением, не сводя смысл к испугу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Краткая именная фраза сохраняет торжественную формулу божественного самоотождествления и естественно звучит по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон; передача личного имени сохраняет его отличие от титула.
- issue: Смысл ירא применительно к святилищу
  choice: чтите Моё святилище
  alternative: бойтесь Моего святилища; благоговейте перед Моим святилищем
  rationale: Контекст требует святого почтения к месту присутствия Бога. Основной текст передаёт это естественным русским выражением, а сноска сохраняет более буквальную лексическую возможность «бояться».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием заповеди. Формы «соблюдайте» и «чтите» понятны широкому читателю и не архаичны; структура и параллелизм еврейского текста сохранены.
