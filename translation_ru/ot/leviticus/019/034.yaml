base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: ru
  text: Пусть переселенец, живущий среди вас, будет для вас как один из коренных жителей[a]. Люби его, как самого себя, ведь вы были переселенцами в земле Египта. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземец», «пришелец», «постоянно живущий иноземец». Еврейское слово обозначает некоренного человека, поселившегося среди Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: как коренной житель среди вас
  rationale: אֶזְרָח обозначает коренного жителя, уроженца страны или полноправного члена местной общины; сравнительная частица כְּ передана словом «как».
- source_word: הַגֵּר הַגָּר אִתְּכֶם
  choice: переселенец, живущий у вас
  rationale: גֵּר здесь — не случайный путник, а некоренной человек, постоянно проживающий среди Израиля. Буквальный однокоренной повтор по-русски звучал бы неестественно, поэтому причастие גָּר передано как «живущий».
- source_word: יִהְיֶה לָכֶם
  choice: пусть ... будет для вас
  rationale: Конструкция выражает нормативное требование о том, как община должна относиться к переселенцу.
- source_word: וְאָהַבְתָּ לוֹ
  choice: люби его
  rationale: Форма обращена к собирательному Израилю во втором лице единственного числа и в данном законодательном контексте имеет повелительную силу.
- source_word: כָּמוֹךָ
  choice: как самого себя
  rationale: Естественный русский эквивалент, сохраняющий словесную связь с Лев 19:18.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: ведь и вы были переселенцами
  rationale: Повтор слова «переселенцы» сохраняет лексическую связь с началом стиха; частица כִּי вводит основание заповеди.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохранена полная библейская формула «земля Египетская» в dignified, но понятном русском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Прямая передача формулы завета с суффиксом второго лица множественного числа.
theological_decisions:
- issue: Значение גֵּר в правовом и этическом контексте
  choice: переселенец
  alternative: чужеземец; пришелец; постоянно живущий иноземец
  rationale: Речь идет о некоренном жителе, поселившемся среди Израиля и находящемся под защитой его закона. «Переселенец» понятно современному читателю и не привносит конкретных категорий современного миграционного права; альтернативы отмечены в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация «Яхве» сохраняет это, не заменяя имя титулом.
- issue: Число адресата в заповеди любви
  choice: «Люби» — единственное число, затем «вы были» — множественное
  alternative: Унифицировать обращение во множественном числе
  rationale: 'Смена числа присутствует в еврейском тексте: וְאָהַבְתָּ — единственное число, הֱיִיתֶם — множественное. Она сохранена как значимая особенность обращения к народу одновременно как к единому целому и как к общине.'
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Переселенец» избрано как понятное обозначение постоянного некоренного жителя; архаизирующий оборот «земля Египетская» сохранен ради устойчивой библейской формулы. Смена единственного и множественного числа в обращении намеренно следует еврейскому тексту.
