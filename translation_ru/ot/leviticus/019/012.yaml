  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: ru
  text: Не клянитесь ложно Моим именем[a] — так ты осквернишь[b] имя своего Бога. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не клянитесь Моим именем для лжи» или «ради лжи».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте обращение здесь переходит от множественного числа («не клянитесь») к единственному («ты осквернишь», «твоего Бога»).
    reason: source_form
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: не клянитесь
  rationale: Нифаль глагола שׁבע в правовом контексте означает «клясться, приносить клятву»; форма второго лица множественного числа передана прямым запретом.
- source_word: בִשְׁמִי
  choice: Моим именем
  rationale: Предлог ב при слове «имя» указывает на имя, которым клянутся; творительный падеж естественно передаёт это значение по-русски.
- source_word: לַשָּׁקֶר
  choice: ложно
  rationale: Буквально выражение означает «для лжи / ради лжи», но в сочетании с глаголом клятвы естественный русский эквивалент — «клясться ложно». Более буквальная форма сохранена в сноске.
- source_word: וְחִלַּלְתָּ
  choice: так ты осквернишь
  rationale: Пиэль глагола חלל означает «осквернять». «Так» передаёт вероятную связь следствия между ложной клятвой и осквернением Божьего имени, а единственное число «ты» сохраняет смену числа в еврейском тексте.
- source_word: שֵׁם
  choice: имя
  rationale: 'Слово сохранено буквально: здесь речь об имени Бога как о выражении Его явленной личности и чести.'
- source_word: אֱלֹהֶיךָ
  choice: своего Бога
  rationale: Несмотря на формально множественный облик אֱלֹהִים, согласование и контекст указывают на единого Бога Израиля. Возвратное местоимение естественно связывает Бога с адресатом второй части фразы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Связь второй части с запретом ложной клятвы
  choice: 'следствие: «так ты осквернишь»'
  alternative: 'простое соединение: «и осквернишь»; продолжение запрета: «и не оскверняй»'
  rationale: Союз ו допускает простое соединение, однако в данном контексте осквернение имени естественно понимается как результат ложной клятвы. Формулировка не превращает вторую часть в отдельный запрет, которого еврейская отрицательная частица прямо не повторяет.
- issue: Смена числа адресата
  choice: сохранить множественное «клянитесь» и единственное «ты осквернишь»
  alternative: согласовать обе части в одном числе ради гладкости
  rationale: Еврейский текст действительно переходит от второго лица множественного числа תִשָּׁבְעוּ к единственному וְחִלַּלְתָּ и אֱלֹהֶיךָ. Эта особенность сохранена, а не устранена редакционно.
translation_notes:
  register: Современный литературный русский язык с достоинством правового наставления. Порядок слов «клянитесь ложно Моим именем» выбран ради ясности; тире обозначает связь следствия. Прописные буквы в «Моим» следуют принятому благоговейному оформлению речи Бога.
