id: LEV.19.13
reference: Leviticus 19:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: ru
  text: Не притесняй ближнего своего и не грабь его. Плата наёмному работнику не должна оставаться у тебя до утра.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: притесняй
  rationale: Глагол обозначает притеснение, в том числе злоупотребление властью и удержание должного; «притеснять» сохраняет широкую нравственно-правовую силу выражения.
- source_word: רֵעֲךָ
  choice: ближнего своего
  rationale: В правовом и этическом контексте слово обозначает другого члена сообщества; традиционное и понятное русское «ближний» уместно также в ближайшем контексте Лев 19.
- source_word: תִגְזֹל
  choice: грабь
  rationale: Глагол указывает на насильственное или неправомерное завладение чужим; «грабить» точнее передаёт эту силу, чем общее «красть».
- source_word: תָלִין
  choice: не должна оставаться
  rationale: Форма согласуется с существительным женского рода «плата» и буквально описывает её пребывание у нанимателя на ночь; выбран естественный русский оборот.
- source_word: פְּעֻלַּת
  choice: плата
  rationale: Хотя слово может обозначать работу или вознаграждение за неё, сочетание с наёмным работником и запретом задержки ясно указывает на заработанную плату.
- source_word: שָׂכִיר
  choice: наёмному работнику
  rationale: Слово обозначает человека, нанятого за плату; эта формулировка современна, ясна и не сужает значение до физического труда.
- source_word: אִתְּךָ
  choice: у тебя
  rationale: В данном контексте предлог указывает, что заработанная плата остаётся во владении нанимателя; по-русски естественно «у тебя».
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Передаёт конкретный временной предел задержки выплаты без замены его более общим «на ночь».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством правовой заповеди. Сохранены три параллельных запрета; формулировка ясна обычному читателю и не добавляет конфессиональных толкований.
