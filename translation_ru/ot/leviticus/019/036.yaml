base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: ru
  text: У вас должны быть верные[a] весы, верные гири, верная эфа[b] и верный гин[c]. Я — Яхве, ваш Бог, который вывел вас из земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант: «справедливые весы, справедливые гири…» Во всех четырёх сочетаниях повторено еврейское צֶדֶק — «праведность, справедливость»; здесь оно относится к честности и правильности торговых мер.'
    reason: lexical_alternative
  - marker: b
    text: Эфа — древняя мера объёма сыпучих веществ.
    reason: cultural_note
  - marker: c
    text: Гин — древняя мера объёма жидкостей.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: верные весы
  rationale: מֹאזְנַיִם — весы для торговли; צֶדֶק здесь указывает на соответствие справедливости и правильной мере. «Верные весы» естественно передаёт и точность, и нравственную честность.
- source_word: אַבְנֵי צֶדֶק
  choice: верные гири
  rationale: Буквально «верные камни»; камни служили гирями. Передача «гири» ясно выражает подразумеваемое назначение и сохраняет повтор определения.
- source_word: אֵיפַת צֶדֶק
  choice: верная эфа
  rationale: אֵיפָה — древняя мера объёма сыпучих веществ. Транслитерация сохраняет историческую конкретность; значение пояснено в сноске.
- source_word: וְהִין צֶדֶק
  choice: и верный гин
  rationale: הִין — древняя мера объёма жидкостей. Транслитерация сохраняет единицу исходной культуры; значение пояснено в сноске.
- source_word: יִהְיֶה לָכֶם
  choice: у вас должны быть
  rationale: Буквально «будут/должны быть у вас». Такая формулировка естественно передаёт обязательный характер предписания во множественном числе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: В формуле завета форма обозначает единственного Бога Израиля; местоимение относится ко всему народу.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: Который вывел вас из Египетской земли
  rationale: Сохраняется исходная формула исхода, включая упоминание земли Египта, в понятной и торжественной русской форме.
theological_decisions:
- issue: Повторное употребление צֶדֶק применительно к торговым средствам измерения
  choice: верные
  alternative: справедливые; честные; правильные
  rationale: «Верные» применимо ко всем четырём предметам, сохраняет повтор и одновременно выражает точность и честность. Сноска отмечает более широкий смысл справедливости, не сводя слово только к технической точности.
- issue: Передача древних мер
  choice: сохранить названия «эфа» и «гин»
  alternative: мера сыпучих веществ; мера жидкостей; приблизительные современные эквиваленты
  rationale: Транслитерация сохраняет историческую конкретность и не вводит неточных современных пересчётов; краткие сноски обеспечивают понятность.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано транслитерацией, без подмены титулом.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Повтор «верные» воспроизводит четырёхкратное צֶדֶק без тяжеловесного «справедливые» перед названиями мер; древние единицы сохранены и пояснены.
