reference: Leviticus 19:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: ru
  text: Не проклинай глухого и не клади перед слепым препятствие; бойся своего Бога. Я — Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְקַלֵּל
  choice: проклинай
  rationale: Порода пиэль глагола קלל здесь обозначает проклятие или злословие; «проклинай» прямо передаёт словесную и нравственную силу запрета.
- source_word: חֵרֵשׁ
  choice: глухого
  rationale: Субстантивированное прилагательное мужского рода единственного числа сохранено как конкретный типичный случай в правовой норме.
- source_word: לִפְנֵי
  choice: перед
  rationale: Сохраняет пространственное значение предлога и естественно сочетается с глаголом «класть».
- source_word: עִוֵּר
  choice: слепым
  rationale: Форма мужского рода единственного числа передана буквально как представитель типичного случая.
- source_word: תִתֵּן
  choice: клади
  rationale: Хотя основное значение נתן — «давать», в данном сочетании по-русски естественно «класть».
- source_word: מִכְשֹׁל
  choice: препятствия, о которое он может споткнуться
  rationale: Передаёт конкретный образ предмета, вызывающего падение, не ограничивая его словом «камень», которого в еврейском тексте нет.
- source_word: וְיָרֵאתָ
  choice: Бойся
  rationale: Сочинительный союз допускается не выражать отдельным словом в русском; повелительная форма естественно передаёт обязательную силу древнееврейского перфекта с нормативным значением.
- source_word: מֵאֱלֹהֶיךָ
  choice: Бога твоего
  rationale: После ירא предлог מן вводит объект страха; русская конструкция требует родительного падежа без отдельного предлога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Типичные формы мужского рода в правовой норме
  choice: 'Сохранить формы единственного числа мужского рода: «глухого», «слепым»'
  alternative: «глухих», «слепых» или гендерно нейтральная описательная формулировка
  rationale: Еврейский текст формулирует норму через конкретные типичные случаи в мужском роде единственного числа; примечание поясняет их представительный характер.
- issue: Связь призыва бояться Бога с запретами
  choice: 'Передать отдельным нормативным предложением: «Бойся Бога твоего»'
  alternative: «но бойся Бога твоего» или «и бойся Бога твоего»
  rationale: ו может обозначать простое присоединение, тогда как контраст здесь выводится из контекста. Перевод не усиливает союз словом «но», сохраняя возможность понимать фразу и как основание запретов, и как присоединённое повеление.
- issue: Образ מִכְשֹׁל
  choice: Сохранить буквальный образ физического препятствия с поясняющей относительной конструкцией
  alternative: Переносное «не вводи в соблазн»
  rationale: В ближайшем контексте речь естественно идёт о злоупотреблении уязвимостью слепого; переносный смысл не следует навязывать вместо конкретного образа.
translation_notes:
  register: Современный литературный русский язык с краткой, строгой формой правового наставления. Порядок «Бога твоего» слегка возвышенный, но понятный и уместный для библейского регистра. Развёрнутое обозначение препятствия сохраняет точность и не добавляет отсутствующего в оригинале «камня».
