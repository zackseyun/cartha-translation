base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: ru
  text: 'Священник принесёт их: одну из них как жертву за грех[a], а другую — как всесожжение. Так священник совершит за него искупление перед Яхве из-за его истечения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как очистительную жертву». Еврейское חַטָּאת может обозначать жертву, посредством которой устранялась ритуальная нечистота, а не только жертву за нравственный грех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: принесёт их
  rationale: В контексте жертвоприношения עשה означает ритуально совершить, принести жертву; местоимение относится к двум птицам из предыдущего стиха.
- source_word: אֶחָד חַטָּאת
  choice: одну птицу — в жертву за грех
  rationale: חַטָּאת — традиционное название жертвы за грех, хотя в законах о чистоте она также служит очищению от ритуальной нечистоты; этот оттенок отмечен в сноске.
- source_word: וְהָאֶחָד עֹלָה
  choice: а другую — во всесожжение
  rationale: עֹלָה обозначает жертву, целиком сжигаемую на жертвеннике; «всесожжение» — устоявшийся и точный русский термин.
- source_word: וְכִפֶּר עָלָיו
  choice: совершит за него искупление
  rationale: Формулировка сохраняет культово-богословскую ёмкость כפר и не сводит действие лишь к очищению или заглаживанию.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Краткое и dignified соответствие выражению «перед лицом / в присутствии»; личное имя передано как «Яхве» в соответствии с проектным употреблением.
- source_word: מִזּוֹבוֹ
  choice: из-за его истечения
  rationale: מן здесь указывает на причину или состояние, в связи с которым требуется искупительный обряд; «из-за» естественно передаёт эту связь по-русски.
theological_decisions:
- issue: Значение חַטָּאת в контексте ритуальной нечистоты
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Основной текст сохраняет узнаваемое традиционное название, а сноска показывает, что здесь жертва связана с устранением ритуальной нечистоты, а не обязательно с личным нравственным проступком.
- issue: Передача כפר
  choice: совершить искупление за него
  alternative: очистить его посредством обряда; совершить умилостивление за него
  rationale: «Совершить искупление» сохраняет широту древнееврейского культового термина и не навязывает одну теорию действия жертвы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. «Пред Яхве» сохраняет достоинство библейского регистра; добавление «птицу» ясно обозначает референт двух жертвенных птиц из предыдущего стиха.
