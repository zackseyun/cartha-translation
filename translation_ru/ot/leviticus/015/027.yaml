base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: ru
  text: И всякий, кто прикоснётся к ним[a], станет нечистым; пусть выстирает свою одежду, омоется в воде и будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть к предметам, связанным с её нечистотой и упомянутым выше, например к тому, на чём она лежала или на чём сидела.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: И всякий, кто прикоснётся
  rationale: Сочетание כָּל с субстантивированным причастием выражает неопределённую всеобщность. Русская конструкция естественна и сохраняет полный охват предписания.
- source_word: בָּ/ם
  choice: к ним
  rationale: Местоименный суффикс мужского рода множественного числа отсылает к упомянутым ранее предметам. Местоимение сохраняет референциальную неоднозначность исходного текста, а с глаголом «прикоснуться» нормативно употребляется предлог «к».
- source_word: יִטְמָא
  choice: станет нечистым
  rationale: В контексте Левита טמא обозначает приобретение состояния ритуальной нечистоты. «Станет нечистым» точно передаёт результат прикосновения и не придаёт выражению нравственного смысла.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: он должен выстирать свою одежду
  rationale: Глагол כבס означает стирку одежды. Единственное собирательное «одежду» звучит естественно в современном русском; модальная конструкция передаёт предписывающую силу последовательных форм с וְ.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: омыться водой
  rationale: רחץ здесь относится к омовению тела. Возвратный глагол ясно выражает это без добавления отсутствующего в еврейском тексте объекта.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: и будет нечист до вечера
  rationale: Конструкция сообщает продолжительность состояния ритуальной нечистоты. «До вечера» — естественное современное русское соответствие.
theological_decisions:
- issue: Характер нечистоты в законодательстве Левита
  choice: Передать טמא как «нечистый» в смысле ритуального состояния.
  alternative: «осквернённый»
  rationale: Контекст касается обрядовой чистоты, а не нравственной виновности. «Нечистый» сохраняет установленную текстом категорию и не привносит идеи морального осквернения.
- issue: Референт местоимения בָּם
  choice: Сохранить в основном тексте местоимение «к ним», пояснив его вероятный референт в сноске.
  alternative: Развернуть в тексте как «к этим предметам»
  rationale: Еврейский текст использует местоимение, отсылающее к предшествующему контексту. Развёртывание в основном тексте устранило бы присущую оригиналу анафорическую краткость.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Термин «нечистый» последовательно сохраняет ритуально-культовый смысл; синтаксис упрощён ровно настолько, чтобы стих был понятен обычному читателю.
