  terminology: «Истечение» — сдержанный и пригодный для ритуально-правового контекста эквивалент. «Нечисто» верно передаёт טָמֵא применительно к истечению; оно не вносит утверждения о нравственной виновности человека. Сноска должна ограничиться лексической альтернативой и не добавлять недоказуемое уточнение о половом органе.
