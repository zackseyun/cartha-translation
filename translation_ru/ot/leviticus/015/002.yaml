base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: ru
  text: '«Обратитесь к сынам Израиля и скажите им: когда у какого-либо мужчины будет истечение из его тела[a], его истечение нечисто».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из его плоти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Обратитесь
  rationale: Форма множественного числа повелительного наклонения обращена к Моисею и Аарону. «Обратитесь» естественно вводит официальное предписание, адресованное народу.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный образ и традиционное обозначение народа, не заменяя мужскую форму нейтральной.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: и скажите им
  rationale: Передаёт последовательную повелительную формулу еврейского правового наставления.
- source_word: אִישׁ אִישׁ
  choice: у какого-нибудь мужчины
  rationale: Повтор существительного имеет распределительное значение «любой мужчина»; мужской род существенен в данном телесном контексте.
- source_word: כִּי יִהְיֶה
  choice: если … будет
  rationale: כִּי вводит предусмотренный законом случай. Русская условная конструкция естественно передаёт казуальную формулу, не утверждая, что такой случай непременно наступит.
- source_word: זָב מִבְּשָׂרוֹ
  choice: будет истечение из тела
  rationale: «Истечение» точно и сдержанно передаёт זוב в ритуально-медицинском контексте; «из тела» ясно выражает контекстуальное значение בשר, буквальное «плоть» отмечено в сноске.
- source_word: זוֹבוֹ טָמֵא הוּא
  choice: из-за своего истечения он нечист
  rationale: Местоимение הוּא грамматически указывает на мужчину, а не на существительное женского рода זוֹב; поэтому перевод сохраняет утверждение о ритуальном состоянии человека и выражает связь с истечением.
theological_decisions:
- issue: Характер нечистоты
  choice: нечист
  alternative: ритуально нечист
  rationale: טָמֵא обозначает культовую нечистоту, а не обязательно нравственную вину. В контексте книги Левит слово «нечист» сохраняет установленную терминологию без добавления отсутствующего в тексте уточнения.
- issue: К чему относится טָמֵא הוּא
  choice: из-за своего истечения он нечист
  alternative: его истечение нечисто
  rationale: Мужское הוּא согласуется с אִישׁ, тогда как זוֹב имеет женский род. Выбранный вариант сохраняет грамматическое указание на нечистоту мужчины, одновременно связывая её с истечением.
translation_notes:
  register: Современный литературный русский язык с официально-правовым оттенком, соответствующим левитскому предписанию. Формулировка сдержанна и понятна без излишне медицинской конкретизации.
