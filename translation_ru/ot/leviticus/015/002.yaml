  source_fidelity: 'Заключительная часть черновика меняет субъект сказуемого: в еврейском זוֹבוֹ טָמֵא הוּא говорится, что нечисто «его истечение», а не что мужчина нечист «из-за» него. Личное местоимение הוּא не требует отнести טָמֵא к אִישׁ; кроме того, утверждение о женском роде זוֹב в обосновании неверно. Условно-казуальное «если» допустимо, хотя «когда» хорошо передаёт законодательную формулу כִּי יִהְיֶה.'
