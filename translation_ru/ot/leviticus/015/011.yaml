  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: ru
  text: И всякий, к кому прикоснётся страдающий истечением, не ополоснув рук водой, должен выстирать свои одежды и омыться водой; до вечера он будет нечист.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזָּב
  choice: страдающий истечением
  rationale: Причастное существительное обозначает мужчину с телесным истечением; такая формулировка естественна по-русски и сохраняет связь с терминологией законов о чистоте.
- source_word: יִגַּע בּוֹ
  choice: к кому прикоснётся
  rationale: Глагол נגע с предлогом ב обозначает физическое прикосновение; русская конструкция передаёт личный объект без тяжеловесности.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: не ополоснув рук водой
  rationale: 'Оборот передаёт сопутствующее обстоятельство: страдающий истечением касается другого, предварительно не ополоснув рук. «Ополоснув» отличает שׁטף от последующего רחץ.'
- source_word: וְכִבֶּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: כּבס означает стирку одежды; «должен» естественно выражает предписание в русском юридико-ритуальном контексте.
- source_word: וְרָחַץ בַּמָּיִם
  choice: омыться водой
  rationale: רחץ здесь относится к омовению тела; возвратная форма ясно отличает его от стирки одежды.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: и будет нечист до вечера
  rationale: טמא обозначает состояние ритуальной нечистоты, а не нравственную вину; временной предел передан прямо.
- source_word: כֹל אֲשֶׁר
  choice: всякий, к кому
  rationale: Сочетание имеет распределительное личное значение; этот вариант звучит естественно и сохраняет широкий охват.
theological_decisions:
- issue: Характер нечистоты в законах Левита
  choice: «нечист» в ритуально-культовом смысле
  alternative: «осквернён»
  rationale: Контекст говорит о передаваемой через контакт ритуальной нечистоте, устраняемой омовением и истечением установленного времени, а не о нравственной виновности.
- issue: К кому относится условие о неополоснутых руках
  choice: К страдающему истечением, который касается другого человека
  alternative: 'Понимать фразу как самостоятельное условие: «если он не ополоснул рук водой»'
  rationale: Местоименные суффиксы мужского рода естественно отсылают к הַזָּב, но синтаксис допускает более явно условное прочтение; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией закона. Сохранены различия между ополаскиванием рук, стиркой одежды и омовением тела; термин «нечист» употреблён в ритуальном смысле.
