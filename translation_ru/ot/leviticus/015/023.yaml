  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: ru
  text: Если же что-либо находится на постели или на предмете[a], на котором она сидит, то тот, кто прикоснётся к этому, будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вещи», «утвари» или «сосуде». Еврейское כְּלִי — широкое обозначение предмета, орудия, утвари или сосуда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Передаёт условие и связь с предшествующим постановлением; частица «же» естественна для русского законодательного изложения.
- source_word: עַל הַמִּשְׁכָּב
  choice: на постели
  rationale: מִשְׁכָּב обозначает место для лежания, обычно постель; это ясный и уместный вариант в данном контексте.
- source_word: הוּא
  choice: это будет
  rationale: Местоимение мужского рода относится не к мужчине, а к подразумеваемому предмету или состоянию из контекста. Нейтральное русское «это» сохраняет некоторую неявность еврейской формулировки.
- source_word: עַל הַכְּלִי
  choice: на предмете
  rationale: כְּלִי — широкое обозначение вещи, орудия, утвари или сосуда; «предмет» не сужает значение до одного типа вещи.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: на котором она сидит
  rationale: Прямо и естественно передаёт относительное придаточное и значение причастной формы יֹשֶׁבֶת.
- source_word: בְּנָגְעוֹ בוֹ
  choice: прикоснувшийся к нему
  rationale: Инфинитивная конструкция с בְּ выражает обстоятельство времени. Субстантивированное причастие по-русски естественно обозначает человека, совершающего действие, не утяжеляя фразу.
- source_word: יִטְמָא
  choice: будет нечист
  rationale: В контексте закона форма обозначает наступающий статус ритуальной нечистоты; будущее время естественно передаёт результат условия.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Устойчивая и ясная русская передача повторяющейся левитской формулы.
theological_decisions:
- issue: Характер нечистоты, обозначенной טָמֵא
  choice: будет нечист
  alternative: будет ритуально нечист
  rationale: Контекст говорит о ритуальном статусе, а не обязательно о нравственной вине. Добавление «ритуально» верно поясняет контекст, но отсутствует в самом еврейском выражении, поэтому в основном тексте сохранена простая формула.
- issue: Референт местоимения הוּא
  choice: это будет
  alternative: он будет / она будет
  rationale: Мужское местоимение в синтаксически трудной формулировке указывает на подразумеваемую сущность или предмет, а не требует отождествления с мужчиной. Нейтральное «это» не устраняет исходную неявность.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой, подходящей для законодательной прозы. Сохранена смысловая неявность местоимения הוּא; терминология не связывает ритуальную нечистоту с нравственной виной.
