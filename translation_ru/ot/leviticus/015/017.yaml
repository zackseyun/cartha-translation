  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: ru
  text: Всякая одежда и всякое кожаное изделие, на которых будет семяизвержение, должны быть вымыты водой и будут нечисты до вечера.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякая одежда и всякая кожа»; под «кожей», вероятно, подразумевается предмет, сделанный из шкуры или кожи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: одежда
  rationale: Широкое обозначение предмета одежды; естественный современный русский эквивалент, сохраняющий конкретность исходного текста.
- source_word: עוֹר
  choice: изделие из кожи
  rationale: В данном контексте речь, вероятнее всего, идёт не о коже живого существа, а о предмете из шкуры или кожи; контекстуальный перевод устраняет ненужную двусмысленность, не уточняя вид изделия.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: на которых окажется
  rationale: Передаёт местное значение конструкции и её правовой, условно-предписывающий оттенок естественным русским выражением.
- source_word: שִׁכְבַת זָרַע
  choice: излияние семени
  rationale: Передаёт устойчивое древнееврейское выражение как обозначение выделившейся семенной жидкости; «излияние» сохраняет событие выделения, а не только вещество.
- source_word: וְכֻבַּס
  choice: должны быть вымыты
  rationale: Пассивная форма в законодательном контексте выражает обязательное предписание; множественное число согласовано с двумя однородными предметами в русском предложении.
- source_word: בַּמַּיִם
  choice: водой
  rationale: Творительный падеж естественно выражает средство омовения и точно передаёт функцию предлога בְּ.
- source_word: וְטָמֵא
  choice: и останутся нечистыми
  rationale: Передаёт сохраняющееся после омовения состояние ритуальной нечистоты до указанного срока; множественное число обусловлено русским синтаксисом.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Устойчивое и естественное русское выражение, точно обозначающее предел состояния.
theological_decisions:
- issue: Характер нечистоты в законах Левита
  choice: Передать טָמֵא словом «нечистыми» как категорию ритуального состояния.
  alternative: «осквернёнными» или «ритуально нечистыми»
  rationale: «Нечистый» — традиционный и понятный эквивалент, не приписывающий человеку или предмету нравственной вины. Добавление «ритуально» было бы пояснением, отсутствующим в стихе.
- issue: Относится ли состояние нечистоты к предметам после омовения
  choice: «останутся нечистыми до вечера»
  alternative: «будут нечисты до вечера»
  rationale: Контекст и последовательность предписания показывают, что омовение не прекращает состояние немедленно; «останутся» ясно передаёт эту временную последовательность, не добавляя богословской оценки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. Терминология ясная и прямая; сохранено различие между физическим омовением и продолжающимся до вечера ритуальным состоянием.
