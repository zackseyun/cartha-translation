- from: А на восьмой день пусть он возьмёт себе двух горлиц или двух молодых голубей и придёт пред Яхве ко входу в шатёр встречи, и отдаст их священнику.
  to: А на восьмой день пусть он возьмёт себе двух горлиц или двух молодых голубей и предстанет перед Яхве[a] у входа в шатёр встречи, и передаст их священнику.
  rationale: Правка делает синтаксис современного русского естественным, не меняя последовательности предписанных действий и не добавляя богословского толкования. Сноска перенесена к имени, к которому она относится.
