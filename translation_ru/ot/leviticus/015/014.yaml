base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: ru
  text: А на восьмой день пусть он возьмёт себе двух горлиц или двух молодых голубей и предстанет перед Яхве[a] у входа в шатёр встречи, и передаст их священнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH), традиционно передаваемое как «ГОСПОДЬ»; «Яхве» — одна из передач этого имени.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: А на восьмой день
  rationale: Союз и предлог сохраняют последовательность предписаний; «а на» естественно звучит в современном русском повествовании закона.
- source_word: יִקַּח לוֹ
  choice: пусть он возьмёт себе
  rationale: Форма выражает предписание, а местоименное לוֹ передано словом «себе», поскольку оно указывает на самого приносящего.
- source_word: שְׁתֵּי תֹרִים
  choice: двух горлиц
  rationale: תֹרִים обозначает горлиц; это обычное и точное русское наименование жертвенных птиц.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: или двух молодых голубей
  rationale: Буквальное «сыновей голубя» является еврейским обозначением молодых голубей; выбран естественный русский эквивалент.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: и придёт пред Яхве
  rationale: Последовательная форма продолжает ряд предписанных действий; «пред» кратко и достойно передаёт לִפְנֵי, а имя יהוה транслитерировано как «Яхве».
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в шатёр встречи
  rationale: אֶל указывает направление к входу; конструкция אֹהֶל מוֹעֵד передана прозрачно как «шатёр встречи».
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: и отдаст их священнику
  rationale: נתן с объектным суффиксом означает непосредственную передачу птиц священнику; «отдаст» естественно выражает это по-русски.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не заменяя его титулом и не навязывая конфессиональное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксическая последовательность еврейского юридического предписания сохранена, но фраза остаётся понятной обычному читателю.
