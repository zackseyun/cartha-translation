id: LEV.15.5
reference: Leviticus 15:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: ru
  text: И мужчина, который прикоснётся к его постели[a], должен выстирать свою одежду и омыться водой; он будет нечист до вечера[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к месту, где он лежал». Еврейское слово может обозначать не только кровать, но и вообще место для лежания.'
    reason: lexical_alternative
  - marker: b
    text: То есть ритуально нечист согласно предписаниям о чистоте.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: И мужчина
  rationale: Сохранено мужское единственное число אִישׁ; союз וְ передан как «и», связывая предписание с предыдущим контекстом.
- source_word: אֲשֶׁר יִגַּע
  choice: который прикоснётся
  rationale: Относительная конструкция передана естественно по-русски; נגע означает физическое прикосновение или соприкосновение.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: к его постели
  rationale: מִשְׁכָּב обозначает место, где лежат, часто постель; суффикс третьего лица сохранён как «его».
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: должен выстирать свою одежду
  rationale: Пиэль כִּבֵּס обозначает стирку одежды. «Должен» естественно выражает обязательность предписания; возвратное «свою» однозначно соотносит одежду с субъектом.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: и омыться водой
  rationale: רחץ здесь относится к омовению тела; творительный «водой» естественно передаёт средство омовения и сохраняет допустимую семантику предлога ב.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: он будет нечист до вечера
  rationale: טָמֵא передано традиционным термином «нечист», без добавления идеи нравственной вины; временной предел выражен естественным оборотом «до вечера».
theological_decisions:
- issue: Характер нечистоты в законах Левита
  choice: В основном тексте сохранено «нечист», а ритуальный характер статуса пояснён в сноске.
  alternative: Вставить в основной текст «ритуально нечист».
  rationale: Контекст говорит о статусе в рамках предписаний о чистоте, а не о нравственной виновности. Сноска предотвращает неверное понимание, не расширяя формулировку оригинала в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным регистром правового предписания. «Должен» передаёт обязательность без архаического «пусть»; «омыться» ясно отличает мытьё тела от стирки одежды.
