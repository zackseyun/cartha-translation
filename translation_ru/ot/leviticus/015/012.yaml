source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁר יִגַּע בּ֥/וֹ הַ/זָּ֖ב יִשָּׁבֵ֑ר וְ/כָל כְּלִי עֵ֔ץ יִשָּׁטֵ֖ף בַּ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: ru
  text: Глиняный сосуд[a], которого коснётся человек с истечением[b], нужно разбить, а всякий деревянный сосуд — ополоснуть водой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуд из обожжённой глины», «керамический сосуд».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «истекающий»; это особое обозначение человека с телесным истечением в законах о ритуальной чистоте.'
    reason: cultural_note
  - marker: c
    text: 'Или: «вымыть в воде».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: глиняный сосуд
  rationale: Сочетание обозначает сосуд из обожжённой глины. Перевод сохраняет существенное для закона различие материалов и естественно звучит по-русски.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: которого коснётся
  rationale: Глагол נגע в породе qal имеет прямое значение «касаться»; формулировка без расширительного толкования передаёт относительное придаточное оригинала.
- source_word: הַזָּב
  choice: человек с истечением
  rationale: Субстантивированная форма обозначает человека, страдающего телесным истечением, в терминологии законов о ритуальной нечистоте. Выражение передаёт состояние ясно, не вводя специального конфессионального термина.
- source_word: יִשָּׁבֵר
  choice: нужно разбить
  rationale: Пассивная форма в законодательном контексте выражает обязательное предписание. Русская конструкция «нужно разбить» естественно передаёт эту нормативную силу.
- source_word: כָל כְּלִי עֵץ
  choice: всякий деревянный сосуд
  rationale: Сочетание обозначает сосуд или предмет утвари из дерева; «деревянный сосуд» сохраняет параллель с глиняным сосудом и различие материалов.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: ополоснуть водой
  rationale: Глагол שטף указывает на промывание или ополаскивание водой. Этот вариант естественен применительно к сосуду и не смешивает действие с терминами, обозначающими стирку.
