  source_fidelity: 'Перевод точно передаёт еврейскую конструкцию: глиняный сосуд, которого касается זָב, подлежит разбитию; всякий деревянный сосуд подлежит ополаскиванию водой. Нормативная сила форм «нужно разбить» и «ополоснуть» соответствует законодательному контексту пассивных форм оригинала. Неопределённая широта כְּלִי («сосуд/предмет утвари») приемлемо передана словом «сосуд» с сохранением параллелизма, как и в английском контрольном варианте.'
