  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве[a] Моисею и Аарону:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Яхве» (יהוה, YHWH); традиционно передаётся как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма wayyiqtol продвигает повествование; в русской библейской прозе естественно передаётся сочетанием «И сказал». Глагол «сказать» вместе с последующим לֵאמֹר не требует тяжеловесного «говорил… говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно передаёт адресатов речи; повтор предлога אֶל не нуждается в буквальном воспроизведении.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Формула вводит прямую речь, начинающуюся в следующем стихе; в современном русском её функцию ясно и естественно выражает двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, то есть личное имя, а не титул. «Яхве» — распространённая научная реконструкция произношения; вариант «Господь» отмечен в сноске как традиционная замена.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным библейским звучанием. Синтаксическая формула לֵאמֹר передана пунктуационно, без неестественного оборота «говоря».
