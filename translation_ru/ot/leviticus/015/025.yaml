id: LEV.15.25
reference: Leviticus 15:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: ru
  text: Если у женщины кровотечение продолжается много дней не во время её месячной нечистоты[a] или продолжается сверх срока её месячной нечистоты[b], то во все дни её нечистого истечения она будет нечиста, как в дни её месячной нечистоты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вне времени её менструации». Еврейское слово обозначает не только само кровотечение, но и связанное с ним состояние ритуальной нечистоты.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в дополнение к её месячной нечистоте», то есть если кровотечение продолжается дольше обычного срока.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב דָּמָהּ
  choice: кровотечение продолжается / нечистое истечение
  rationale: Сочетание глагола и существительного от זוּב обозначает телесное истечение; при упоминании крови естественное русское «кровотечение» ясно передаёт смысл, а «истечение» во второй половине сохраняет связь с юридико-ритуальной терминологией.
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Прямо и естественно передаёт длительность, не превращая конкретное временное выражение в неопределённое «долгое время».
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: не во время её месячной нечистоты
  rationale: Сохраняет как временное значение עֵת, так и ритуальный аспект נִדָּה, который шире самого физиологического кровотечения.
- source_word: עַל נִדָּתָהּ
  choice: сверх срока её месячной нечистоты
  rationale: В данном контексте עַל указывает на продолжение сверх обычного периода; слово «срока» делает временной смысл ясным, не устраняя возможного оттенка добавления.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: во все дни её нечистого истечения
  rationale: Передаёт и продолжительность истечения, и связанный с ним статус ритуальной нечистоты.
- source_word: טְמֵאָה
  choice: нечиста
  rationale: Традиционный и понятный термин для ритуального статуса в книге Левит; он не означает здесь нравственной вины.
- source_word: כִּימֵי נִדָּתָהּ
  choice: как в дни её месячной нечистоты
  rationale: Сохраняет прямое сравнение статуса женщины при аномальном кровотечении с её статусом во время обычной месячной нечистоты.
theological_decisions:
- issue: Передача ритуальной нечистоты без намёка на нравственную вину
  choice: Использовать «нечиста» и «месячная нечистота» как обозначения ритуального статуса
  alternative: Передать только физиологическими словами «менструация» или «месячные»
  rationale: Контекст устанавливает культово-правовой статус, а не утверждает личную греховность женщины.
- issue: Значение עַל נִדָּתָהּ
  choice: «сверх срока её месячной нечистоты»
  alternative: «в дополнение к её месячной нечистоте»
  rationale: Основной смысл в контексте — кровотечение, продолжающееся за пределами обычного периода, однако примечание сохраняет близкую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной правовой интонацией. Термины «месячная нечистота» и «нечиста» последовательно обозначают ритуальный, а не нравственный статус. Формулировка избегает как медицинской перегруженности, так и разговорного слова «месячные».
