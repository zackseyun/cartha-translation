base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: ru
  text: Если у мужчины произойдёт семяизвержение[a], то он должен омыть водой всё своё тело и будет нечист до вечера[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «истечение семени».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «нечист» означает состояние ритуальной нечистоты по законам книги Левит и не обязательно подразумевает нравственную вину.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: у мужчины
  rationale: Мужской род сохранён, поскольку речь идёт именно о физиологическом выделении у мужчины.
- source_word: כִּי
  choice: если
  rationale: В казуистической правовой формуле вводит условный случай.
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: у мужчины произойдёт излияние семени
  rationale: Естественно передаёт буквальный смысл «выйдет из него излияние семени», сохраняя нейтральный и достойный регистр.
- source_word: וְרָחַץ בַּמַּיִם
  choice: то он должен омыть водой
  rationale: Передаёт предписание в последовательности правовой нормы; «омыть» уместно для полного телесного омовения.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: всё своё тело
  rationale: В данном контексте еврейское «вся его плоть» означает всё тело; современный русский вариант понятнее без потери смысла.
- source_word: וְטָמֵא
  choice: и будет нечист
  rationale: Сохраняет традиционный термин законодательства о чистоте, не добавляя в основной текст толкование о нравственной виновности.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Естественный русский эквивалент временного предела.
theological_decisions:
- issue: Характер состояния טָמֵא в законах о чистоте
  choice: нечист
  alternative: ритуально нечист; осквернён
  rationale: Основной текст сохраняет краткое библейское понятие, а сноска уточняет, что в контексте главы речь идёт о состоянии ритуальной нечистоты, а не обязательно о нравственной вине.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная, сдержанная и достойная. Правовой характер выражен конструкциями «если… то» и «должен». Все сноски отмечены в основном тексте.
