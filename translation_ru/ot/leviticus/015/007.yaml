base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ru
  text: Кто прикоснётся к телу[a] мужчины, у которого истечение, тот должен выстирать свою одежду, омыться водой и будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к плоти того, у кого истечение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: Кто прикоснётся
  rationale: Субстантивированное причастие с артиклем имеет обобщающее значение; такая конструкция естественно передаёт общий характер предписания.
- source_word: בִּבְשַׂר
  choice: к телу[a]
  rationale: Буквальное значение בָּשָׂר — «плоть», но здесь слово конкретно обозначает тело человека. «Тело» звучит естественно в современном русском; буквальный вариант сохранён в сноске.
- source_word: הַזָּב
  choice: мужчины, страдающего истечением
  rationale: Форма мужского рода указывает на мужчину с патологическим телесным истечением. «Страдающего истечением» передаёт состояние без излишней медицинской конкретизации.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Глагол обозначает стирку одежды, а модальная конструкция «должен» ясно передаёт обязательность законодательного предписания.
- source_word: וְרָחַץ בַּמַּיִם
  choice: омыться водой
  rationale: В данном контексте רָחַץ означает телесное омовение; возвратная форма естественно выражает подразумеваемое омовение самого себя.
- source_word: וְטָמֵא
  choice: и будет нечист
  rationale: «Нечист» сохраняет устойчивую лексику левитской обрядовой нечистоты и не приписывает человеку моральной вины.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Кратко и естественно обозначает установленный срок состояния нечистоты.
theological_decisions:
- issue: Характер нечистоты
  choice: Передать טָמֵא как «нечист», то есть состояние обрядовой нечистоты.
  alternative: «осквернён» или «нечистый в нравственном смысле»
  rationale: Контекст Левита 15 касается установленной законом ритуальной нечистоты, а не моральной виновности от самого прикосновения.
translation_notes:
  register: Современный литературный русский язык с ясным предписывающим тоном. Термин «истечение» сохраняет связь с контекстом закона о телесных выделениях и не уточняет их природу сверх текста.
