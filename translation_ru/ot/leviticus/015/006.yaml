  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ru
  text: И тот, кто сядет на предмет[a], на котором сидел мужчина с истечением, должен выстирать свою одежду и омыться в воде; он будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вещь», «утварь», «сосуд»; древнееврейское слово имеет широкое значение и обозначает предмет или изделие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: И тот, кто сядет
  rationale: Субстантивированное причастие с союзом и артиклем буквально означает «и сидящий». В русском законодательном контексте оборот «и тот, кто сядет» естественно передаёт обобщённое предписание и сохраняет связь с предыдущим стихом.
- source_word: הַכְּלִי
  choice: предмет
  rationale: כְּלִי — широкое обозначение предмета, утвари, сосуда или изделия. Здесь речь идёт о том, на чём можно сидеть, поэтому «предмет» сохраняет широту значения без неоправданного сужения до сосуда.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: на котором сидел
  rationale: Относительное придаточное указывает на предшествующее соприкосновение предмета с мужчиной, имеющим истечение. Прошедшее время по-русски естественно выражает эту контекстуальную последовательность.
- source_word: הַזָּב
  choice: мужчина с истечением
  rationale: Субстантивированное причастие обозначает человека мужского пола с телесным истечением; раздел Лев 15:2–15 прямо относится к мужчине. «Мужчина с истечением» точно передаёт пол референта и не добавляет диагноза.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Глагол כבס обычно обозначает стирку одежды. «Должен» ясно передаёт предписывающую силу формы, а «свою одежду» естественно воспроизводит местоименный суффикс.
- source_word: וְרָחַץ בַּמַּיִם
  choice: и омыться водой
  rationale: В законах о чистоте רחץ обозначает омовение тела. Возвратное «омыться» выражает это точнее, чем общее «умыться», а творительный «водой» естественно передаёт בַּמַּיִם.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: он будет нечист до вечера
  rationale: Фраза устанавливает состояние ритуальной нечистоты и его временный предел. Будущее «будет нечист» естественно для русского правового изложения и не превращает нечистоту в моральную вину.
theological_decisions:
- issue: Характер нечистоты
  choice: «нечист» без уточняющего слова
  alternative: «ритуально нечист»; «осквернён»
  rationale: Контекст относится к левитской ритуальной нечистоте, а не обязательно к нравственной вине. Простое «нечист» сохраняет библейскую категорию; добавление «ритуально» истолковывает текст, тогда как «осквернён» может чрезмерно усилить смысл.
- issue: Пол лица, обозначенного הַזָּב
  choice: «мужчина с истечением»
  alternative: «человек с истечением»; «тот, у кого истечение»
  rationale: Данный раздел главы говорит о мужском истечении, а еврейская форма имеет мужской род. Явное «мужчина» сохраняет контекстуальную и грамматическую определённость.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным регистром, подходящим для законодательного текста. Синтаксис остаётся близким к еврейской последовательности, но звучит естественно. Слово «предмет» сохраняет широкий смысл כְּלִי; отдельная сноска не требуется, поскольку вариант не создаёт существенной смысловой неоднозначности в русском тексте.
