id: LEV.15.4
reference: Leviticus 15:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָ֑א וְ/כָֽל הַ/כְּלִ֛י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: ru
  text: Всякая постель, на которой лежит мужчина с истечением, будет нечиста; и всякий предмет[a], на котором он сидит, будет нечист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякая вещь». Еврейское слово имеет широкое значение и может обозначать предмет, утварь, орудие или сосуд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: постель
  rationale: Слово обозначает место, где лежат; «постель» естественно передаёт его в данном контексте и сохраняет отличие от более широкого כְּלִי во второй части стиха.
- source_word: הַזָּב
  choice: мужчина с истечением
  rationale: Субстантивированное причастие мужского рода относится здесь к мужчине, у которого происходит телесное истечение. Формулировка ясна и не смягчает указание на пол.
- source_word: יִשְׁכַּב עָלָיו
  choice: на которой лежит
  rationale: Настоящее время естественно для общего правила, а сочетание с предлогом «на» точно передаёт עַל.
- source_word: יִטְמָא
  choice: будет нечист / будет нечиста
  rationale: Передаёт установленный законом статус ритуальной нечистоты, не добавляя идеи нравственной вины; форма согласована с родом русского существительного.
- source_word: הַכְּלִי
  choice: предмет
  rationale: כְּלִי может обозначать сосуд, утварь, орудие или иной предмет. Поскольку на нём сидят, широкое «предмет» естественнее русского «сосуд» и не сужает значение без основания.
- source_word: יֵשֵׁב עָלָיו
  choice: на котором он сидит
  rationale: Прямо и естественно передаёт ישׁב с עַל в общем предписании.
theological_decisions:
- issue: Характер нечистоты
  choice: нечист
  alternative: ритуально нечист; осквернён
  rationale: Контекст говорит о левитском статусе ритуальной нечистоты, а не обязательно о нравственной вине. Слово «нечист» сохраняет термин текста без поясняющей вставки.
- issue: Пол человека с истечением
  choice: мужчина с истечением / он
  alternative: человек с истечением
  rationale: Мужской род еврейских форм и ближайший контекст указывают на мужчину; перевод сохраняет это указание.
translation_notes:
  register: Современный литературный русский язык с лаконичным юридическим строем. «Будет нечист(а)» сохраняет традиционную и понятную лексику законов о ритуальной чистоте; точка с запятой отражает параллелизм двух предписаний.
