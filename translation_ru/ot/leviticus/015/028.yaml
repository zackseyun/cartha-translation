  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: ru
  text: Но если она очистится от своего истечения,[a] пусть отсчитает себе семь дней, и после этого будет чиста.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если её истечение прекратится…». В еврейском тексте в обеих частях употреблён один и тот же корень: сначала о выходе из состояния, связанного с истечением, затем — о наступлении ритуальной чистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Передаёт условие с оттенком перехода и противопоставления предшествующему случаю.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: её истечение прекратится
  rationale: В данном контексте сочетание с מן описывает освобождение от истечения, то есть его прекращение; такая формулировка естественна по-русски и не смешивает этот момент с последующим обретением ритуальной чистоты.
- source_word: וְסָפְרָה לָּהּ שִׁבְעַת יָמִים
  choice: пусть она отсчитает для себя семь дней
  rationale: «Пусть» передаёт предписывающую силу формы, «для себя» сохраняет выраженное местоимение לָהּ, а «отсчитает» ясно обозначает установленный период.
- source_word: וְאַחַר תִּטְהָר
  choice: и после этого будет чиста
  rationale: Передаёт итоговый ритуальный статус после семидневного срока, сохраняя отличие от прекращения истечения.
theological_decisions:
- issue: Терминология ритуальной чистоты
  choice: будет чиста
  alternative: очистится / будет очищена
  rationale: Стих говорит о ритуальном статусе, а не о нравственной виновности. «Будет чиста» прямо и понятно передаёт этот статус, не добавляя идеи морального очищения.
- issue: Два употребления корня טהר
  choice: В первой части передать контекстуальный смысл как прекращение истечения, во второй — как состояние чистоты.
  alternative: В обоих случаях повторить «очистится/чиста», сохранив корневой повтор.
  rationale: 'Разные русские формулировки ясно отражают последовательность: сначала прекращается телесное истечение, затем по истечении семи дней наступает ритуальная чистота. Сноска сохраняет сведения о повторе одного еврейского корня и подлинной лексической неоднозначности.'
translation_notes:
  register: Современный литературный русский язык с ясным юридико-обрядовым оттенком. Слово «истечение» согласуется с терминологией раздела о телесных выделениях; «чиста» понимается как обозначение ритуального, а не нравственного состояния.
