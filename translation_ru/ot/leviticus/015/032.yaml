  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: ru
  text: 'Вот закон о том, у кого истечение, и о том, у кого происходит выделение семени, так что он становится нечистым от него:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Вот закон
  rationale: Устойчивая вводная формула к сводному постановлению. «Закон» естественно передаёт תּוֹרָה в данном юридико-обрядовом контексте; возможное «наставление» здесь менее привычно.
- source_word: הַזָּב
  choice: имеющий истечение
  rationale: Причастная форма обозначает человека, страдающего телесным истечением. Перевод сохраняет терминологическую связь с контекстом главы и не добавляет определения, которого нет в самой форме.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ
  choice: и о том, у кого происходит
  rationale: Относительная конструкция вводит второй случай и по-русски естественно связывается с формулой «закон об… и о…».
- source_word: שִׁכְבַת זֶרַע
  choice: излияние семени
  rationale: Идиома означает выделение семени. «Излияние семени» ясно и достаточно близко к конкретному образу исходного выражения, не прибегая к архаическому «семяизвержение» в стилистически тяжёлой форме.
- source_word: לְטָמְאָה בָהּ
  choice: вследствие чего он становится нечистым
  rationale: Инфинитивная конструкция допускает оттенок результата или цели; в данном контексте выражен итог обрядового осквернения. Формулировка естественна по-русски и соотносит нечистоту с названным излиянием.
theological_decisions:
- issue: Характер нечистоты
  choice: становится нечистым
  alternative: оскверняется
  rationale: Перевод сохраняет обрядово-правовую категорию טמא и не придаёт ей автоматически нравственного смысла.
translation_notes:
  register: Современный литературный русский язык с сохранением юридико-обрядового регистра Левита. Двоеточие оставлено, поскольку стих вводит продолжающийся в следующих стихах итоговый перечень.
