base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: ru
  text: и о женщине во время её менструальной нечистоты,[a] и об имеющем истечение, будь то мужчина или женщина, и о мужчине, который ляжет с нечистой женщиной.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально употреблённое здесь слово может обозначать женщину, испытывающую недомогание; в данном контексте речь идёт о женщине во время менструации.
    reason: lexical_alternative
  - marker: b
    text: Здесь «нечистая» означает ритуально нечистую согласно закону Левита, а не нравственно нечистую.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: женщине во время её менструальной нечистоты
  rationale: В данном контексте сочетание обозначает женщину в состоянии менструальной ритуальной нечистоты. Русская формулировка передаёт смысл естественно и не добавляет спорного указания на болезнь.
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: имеющем истечение
  rationale: Однокоренная еврейская конструкция идиоматически передана обозначением человека с телесным истечением; краткая формулировка соответствует языку законов о чистоте.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: мужчине или женщине
  rationale: Пара уточняет, что предписание об истечении распространяется на оба пола.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: который ляжет с
  rationale: Сохранён сдержанный эвфемизм оригинала, обозначающий половое сношение.
- source_word: טְמֵאָה
  choice: нечистой женщиной
  rationale: Традиционный и понятный термин для ритуальной нечистоты в контексте Левита; он не подразумевает нравственной порочности.
theological_decisions:
- issue: Ритуальная, а не нравственная нечистота
  choice: «менструальная нечистота» и «нечистая женщина»
  alternative: «осквернённость», «грязная женщина» или нравственно окрашенное понимание
  rationale: Контекст касается установленного законом ритуального состояния, а не нравственной ценности или вины человека.
- issue: Значение הַדָּוָה
  choice: Не воспроизводить отдельное указание на болезнь в основном тексте
  alternative: «женщина, страдающая во время своей менструальной нечистоты»
  rationale: В контексте термин относится к женщине при менструации; буквальное добавление «больная» в современном русском может ошибочно представить нормальное физиологическое состояние как заболевание. Лексическая особенность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичностью законодательного перечня. Начальное «и» сохранено, поскольку стих завершает предшествующее перечисление. Термин «истечение» выбран как понятный библейско-правовой термин без ненужной медицинской конкретизации.
