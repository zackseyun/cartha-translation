source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ru
  text: Всякий, кто прикоснётся к её постели[a], должен выстирать свою одежду и омыться водой; он будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к месту, где она лежала», либо: «к её ложу». Еврейское слово обозначает место, на котором лежат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Всякий, кто прикоснётся
  rationale: Сочетание כָּל с субстантивированным причастием выражает общее правило. Такая формулировка естественна для современного русского языка и сохраняет всеобщий охват предписания.
- source_word: בְּמִשְׁכָּבָהּ
  choice: к её постели
  rationale: מִשְׁכָּב обозначает место, где лежат, в том числе постель. «Постель» ясно и естественно передаёт конкретный предмет в данном контексте; более буквальный диапазон значения отражён в сноске.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Глагол כבס означает стирку одежды, а не просто омовение. «Должен» передаёт предписывающую силу формы, а «выстирать» отличает действие над одеждой от последующего омовения тела.
- source_word: וְרָחַץ בַּמַּיִם
  choice: и омыться водой
  rationale: רחץ здесь относится к мытью тела. Возвратное «омыться» ясно передаёт это значение и соответствует возвышенному, но понятному регистру текста закона.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: он будет нечист до вечера
  rationale: «Нечист» сохраняет установленную в книге Левит категорию ритуальной нечистоты, а «до вечера» точно обозначает её длительность.
theological_decisions:
- issue: Характер нечистоты
  choice: Передать טמא словом «нечист» как обозначение ритуального состояния, не добавляя идеи нравственной вины.
  alternative: «осквернён» или «нечист перед Богом»
  rationale: Контекст главы регулирует обрядовую чистоту. Более нагруженные формулировки могли бы необоснованно приписать человеку нравственную вину, которой данный стих прямо не утверждает.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром, подходящим для правового текста Пятикнижия. Синтаксис сделан ясным без устранения последовательности предписанных действий и состояния нечистоты.
