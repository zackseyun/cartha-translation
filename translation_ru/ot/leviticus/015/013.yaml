- from: Когда у мужчины прекратятся истечения и он станет чист от них, пусть отсчитает семь дней для своего очищения, выстирает одежду и омоет тело проточной водой[a]. Тогда он будет чист.
  to: Когда мужчина избавится от истечения, он должен отсчитать семь дней для своего очищения, выстирать одежду и омыть тело проточной водой[a]. Тогда он будет чист.
  rationale: 'Устранено избыточное раздвоение еврейского יִטְהַר и сохранена временная и ритуальная последовательность стиха: избавление от истечения является условием для семидневного срока и омовения, а окончательная обрядовая чистота объявляется после них. Примечание оставляет буквальный образ «живой воды» и даёт нейтральное лексическое пояснение без излишнего сужения.'
