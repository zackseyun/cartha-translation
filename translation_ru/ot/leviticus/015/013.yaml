    issue: 'Начальная условная конструкция расширена до двух действий: «прекратятся истечения и он станет чист от них».'
    rationale: В еврейском тексте имеется одно сказуемое יִטְהַר с дополнением «от своего истечения». Добавление отдельного прекращения истечений и предварительного «станет чист» размывает различие между начальным условием и заключительным «тогда он будет чист».
  - severity: low
    issue: Примечание определяет «живую воду» как воду «из источника».
    rationale: Выражение означает свежую/проточную воду; связь с природным источником возможна в контексте, но не должна подаваться как единственно заданное стихом значение.
