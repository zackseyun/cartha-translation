  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: ru
  text: Когда мужчина избавится от истечения, он должен отсчитать семь дней для своего очищения, выстирать одежду и омыть тело проточной водой[a]. Тогда он будет чист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живой водой», то есть свежей, проточной водой, а не стоячей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: мужчина, у которого истечения
  rationale: Причастное существительное обозначает мужчину с телесными истечениями, описанными в данном разделе; формулировка сохраняет мужской род и понятна современному читателю.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: у мужчины прекратятся истечения и он станет чист от них
  rationale: В контексте подразумеваются прекращение состояния, вызывающего нечистоту, и переход к обрядовой чистоте. Развёрнутая формулировка естественно передаёт еврейскую конструкцию, не смешивая прекращение выделений с завершением всего очистительного обряда.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: пусть отсчитает семь дней
  rationale: Императивное значение последовательности предписаний передано современно и без излишней архаизации.
- source_word: לְטָהֳרָתוֹ
  choice: для своего очищения
  rationale: Существительное относится к процессу обрядового очищения, а не к нравственному исправлению.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: выстирает одежду
  rationale: Порода piel глагола כּבס обычно обозначает стирку одежды; «выстирает» точнее простого «вымоет».
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: омоет тело
  rationale: בשר буквально означает «плоть», но здесь обозначает всё тело при обрядовом омовении. «Омоет» поддерживает достойный законодательный регистр.
- source_word: בְּמַיִם חַיִּים
  choice: проточной водой
  rationale: Буквально «живой водой»; в законодательном контексте выражение означает свежую воду из действующего источника, прежде всего текущую, а не стоячую. В основном тексте выбран понятный функциональный эквивалент, буквальная форма сохранена в примечании.
- source_word: וְטָהֵר
  choice: Тогда он будет чист
  rationale: Финальная форма обозначает результат предписанной последовательности — состояние обрядовой чистоты.
theological_decisions:
- issue: Обрядовая чистота и нравственная вина
  choice: Термины «чист», «очищение» употреблены в обрядовом смысле
  alternative: Передать как нравственное или духовное очищение
  rationale: Глава говорит о статусе, связанном с телесными истечениями и установленными обрядами, и сама по себе не приписывает мужчине нравственной вины.
- issue: Соотношение прекращения истечений и окончательной чистоты
  choice: В начале отражены прекращение истечений и переход к очищению, а окончательная чистота поставлена после семи дней и омовения
  alternative: Одинаково перевести начальное יִטְהַר и заключительное וְטָהֵר как уже завершившуюся полную чистоту
  rationale: 'Так сохраняется напряжение текста: мужчина избавился от истечения, но ещё должен пройти установленный срок и омовение, после чего объявляется чистым.'
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Избегнуты как разговорно-медицинская грубость, так и тяжёлая церковнославянская архаика; последовательность обрядовых действий выражена ясно.
