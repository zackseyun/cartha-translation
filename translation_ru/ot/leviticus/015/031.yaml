- from: Так предостерегайте сынов Израиля от их нечистоты[a], чтобы они не умерли в своей нечистоте, осквернив Моё жилище, которое среди них.
  to: Итак, предупреждайте сынов Израиля об их нечистоте[a], чтобы они не умерли в своей нечистоте, оскверняя Мою скинию, которая среди них.
  rationale: Правка уточняет конкретный культовый термин «скиния», передаёт обстоятельственный инфинитив «оскверняя» без добавления временной последовательности и сохраняет лексическую неоднозначность начального предписания через сноску. Смысл ритуальной нечистоты не морализуется.
