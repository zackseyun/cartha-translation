language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: ru
  text: Итак, предупреждайте сынов Израиля об их нечистоте[a], чтобы они не умерли в своей нечистоте, оскверняя Мою скинию, которая среди них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удерживайте сынов Израиля от их нечистоты».'
    reason: Форма וְהִזַּרְתֶּם с מִן допускает как значение предупреждения о нечистоте, так и оттенок отделения или удержания от неё.
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: Так предостерегайте
  rationale: Форма выражает предупредительное действие, направленное на предотвращение смертельного осквернения святилища. «Предостерегайте» естественно передаёт этот смысл; возможный оттенок удаления от нечистоты отмечен в сноске.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено традиционное и формально точное обозначение народа Израиля, соответствующее древнееврейскому мужскому множественному выражению.
- source_word: מִטֻּמְאָתָם
  choice: от их нечистоты
  rationale: 'Предлог מִן естественно передан как «от»: предостережение должно удерживать израильтян от состояния и последствий обрядовой нечистоты.'
- source_word: טֻמְאָה
  choice: нечистота
  rationale: В контексте Левита слово обозначает прежде всего обрядовую нечистоту, а не нравственную порочность; русский термин сохраняет эту культовую категорию.
- source_word: וְלֹא יָמֻתוּ
  choice: чтобы они не умерли
  rationale: Целевая конструкция ясно передаёт предупредительный результат предписания.
- source_word: בְּטֻמְאָתָם
  choice: в своей нечистоте
  rationale: Предлог ב передаёт состояние, в котором им угрожает смерть. Возвратное «своей» естественно по-русски соотносит нечистоту с подлежащим.
- source_word: בְּטַמְּאָם
  choice: осквернив
  rationale: Деепричастие передаёт обстоятельство или средство, связывающее угрозу смерти с осквернением Божьего жилища.
- source_word: מִשְׁכָּנִי
  choice: Моё жилище
  rationale: מִשְׁכָּן буквально связано с пребыванием и здесь обозначает скинию как место Божьего обитания. «Жилище» сохраняет этот образ, а контекст указывает на конкретную скинию.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: которое среди них
  rationale: Кратко и близко к источнику передано Божье присутствие посреди Израиля.
theological_decisions:
- issue: Характер нечистоты
  choice: «нечистота» как обрядовое состояние
  alternative: Понимать её как нравственный грех или порочность
  rationale: Контекст законов о телесных истечениях и угроза осквернения Божьего жилища требуют сохранить культовый, а не исключительно нравственный смысл.
- issue: Связь смерти с осквернением жилища
  choice: Сохранить формулировку, при которой смерть грозит им в нечистоте при осквернении Божьего жилища
  alternative: Однозначно представить нечистоту саму по себе как непосредственную причину смерти
  rationale: Древнееврейские конструкции с ב допускают оттенки состояния, обстоятельства и средства; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранены библейское выражение «сыны Израиля» и культовый термин «нечистота»; местоимение «Моё» написано с прописной буквы как обращённое к Богу.
