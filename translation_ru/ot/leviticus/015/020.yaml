    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: менструальная нечистота
  rationale: В контексте Левита 15 слово обозначает не только менструацию как физиологическое явление, но и связанное с ней состояние ритуальной нечистоты. Перевод сохраняет оба смысловых компонента.
- source_word: תִּשְׁכַּב
  choice: будет лежать
  rationale: Глагол означает «лежать» или «ложиться» и здесь описывает положение на каком-либо предмете, не обязательно сон.
- source_word: תֵּשֵׁב
  choice: будет сидеть
  rationale: Прямо передаёт обычное значение глагола в данном контексте.
- source_word: עָלָיו
  choice: на чём
  rationale: Естественно передаёт пространственное значение предлога с местоименным суффиксом внутри русского относительного оборота.
- source_word: יִטְמָא
  choice: будет нечисто
  rationale: В законодательном контексте обозначает состояние ритуальной нечистоты; форма среднего рода согласована с «всё» и не подразумевает нравственной вины.
- source_word: וְכֹל אֲשֶׁר
  choice: и всё, на чём
  rationale: Сохраняет всеохватный смысл еврейской конструкции и естественно звучит по-русски.
theological_decisions:
- issue: Характер нечистоты в законах Левита
  choice: Передать טמא и נִדָּה как категории ритуальной нечистоты, не приписывая нравственной вины
  alternative: Использовать выражения, способные представить менструацию как грех или нравственное осквернение
  rationale: Стих относится к системе ритуальной чистоты Израиля и не утверждает, что менструация является нравственным проступком.
translation_notes:
  register: Современный литературный русский язык с ясной юридической формулировкой. Повтор исходного текста сохранён ради точности и ритма; термин «нечистота» понимается в ритуальном, а не нравственном смысле.
