  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: ru
  text: И всякий, кто прикоснётся к чему-либо, что было под ним, будет нечист до вечера[a]. А тот, кто понесёт их[b], должен выстирать свою одежду, омыться водой и будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что находится под ним». Еврейский текст допускает настоящее время, однако прошедшее лучше соответствует контексту, где речь идёт о предметах, прежде находившихся под этим человеком.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их». Местоимение, вероятно, собирательно относится к упомянутым предметам, находившимся под ним.'
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: всякий, кто прикоснётся
  rationale: Причастие от נגע обозначает физическое прикосновение; в законодательном контексте обобщающая конструкция «всякий, кто…» естественно передаёт его силу.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: к чему-либо, что было под ним
  rationale: Оборот указывает на предметы, прежде находившиеся под человеком с истечением. Прошедшее время естественно связано с процедурным контекстом, хотя еврейская форма допускает более буквальное настоящее время.
- source_word: יִטְמָא
  choice: будет нечист
  rationale: В законах о ритуальной чистоте טמא обозначает состояние нечистоты; будущее время по-русски естественно выражает нормативное следствие.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Это обычная и ясная русская формула для обозначения срока ритуальной нечистоты.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: тот, кто понесёт это
  rationale: נשא здесь значит «нести». Еврейское местоимение имеет форму множественного числа и, вероятно, собирательно относится к упомянутым предметам; русское «это» естественно отсылает ко всему названному ранее без искусственного уточнения рода и числа.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: «Выстирать одежду» точно и современно передаёт формулу очищения; «должен» ясно выражает предписание.
- source_word: וְרָחַץ בַּמַּיִם
  choice: омыться водой
  rationale: Возвратный глагол показывает, что речь идёт об омовении тела, а не только рук или отдельного предмета.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: и будет нечист до вечера
  rationale: Сохранено указание, что после омовения состояние нечистоты продолжается до вечера.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным законодательным ритмом. Термин «нечист» сохранён как устойчивое обозначение ритуального состояния; синтаксис упрощён без устранения неоднозначности еврейских временных форм и местоименной отсылки.
