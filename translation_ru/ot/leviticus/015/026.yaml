source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: ru
  text: Всякая постель, на которую она ложится во все дни своих выделений, будет для неё как постель во время месячных; и всякий предмет[a], на который она садится, будет нечист, как при нечистоте её месячных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякая вещь (или утварь)». Еврейское כְּלִי обозначает широкий круг предметов, а не только сосуд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: постель
  rationale: Обозначает место, на котором лежат; «постель» естественно звучит по-русски и подходит к контексту законов о ритуальной чистоте.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: во все дни своих выделений
  rationale: זוֹבָהּ указывает на продолжающиеся телесные выделения женщины; множественное «выделения» является ясным и современным медицинским обозначением.
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: как постель во время месячных
  rationale: נִדָּה здесь относится к менструальному состоянию и связанной с ним ритуальной нечистоте; перевод называет конкретный телесный процесс, не добавляя моральной оценки.
- source_word: כְּלִי
  choice: предмет
  rationale: כְּלִי — широкое обозначение вещи или принадлежности; в данном контексте речь идёт о предмете, на который можно сесть, а не обязательно о сосуде.
- source_word: טָמֵא / טֻמְאָה
  choice: нечист / нечистота
  rationale: Эти слова обозначают ритуальный статус в системе левитской чистоты, а не нравственную виновность; однокоренные русские слова сохраняют лексическую связь оригинала.
theological_decisions:
- issue: Характер нечистоты
  choice: Передать טָמֵא / טֻמְאָה словами «нечист / нечистота» как обозначение ритуального статуса.
  alternative: «осквернён / осквернение» или «нечистый» в нравственном смысле
  rationale: Стих регулирует обрядовую чистоту и не утверждает нравственной виновности женщины.
- issue: Значение נִדָּה
  choice: Передать конкретно как «месячные».
  alternative: «менструальная нечистота» или «период отделения»
  rationale: В ближайшем контексте имеется в виду менструальное состояние; выбранный вариант понятен современному читателю, а упоминание нечистоты во второй части сохраняет ритуальный аспект.
- issue: Смысл יִהְיֶה לָּהּ
  choice: Сохранить формальное «будет для неё».
  alternative: «будет считаться»
  rationale: Еврейская конструкция допускает буквальное обозначение статуса относительно женщины; перевод не уточняет невыраженный глагол «считаться» и сохраняет некоторую формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксический параллелизм двух частей сохранён; терминология ритуальной чистоты передана традиционными словами «нечист / нечистота», а телесные процессы названы ясно и без эвфемистической неясности.
