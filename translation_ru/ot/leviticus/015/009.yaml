  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: ru
  text: И всякое седло, на котором ездит мужчина с истечением, будет нечисто[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, на чём ездят верхом»; еврейское слово может обозначать не только седло в узком смысле, но и вообще то, на чём ездят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: И всякое
  rationale: Союз וְ связывает предписание с предыдущими постановлениями, а כָּל имеет распределительное значение; сочетание «и всякое» естественно передаёт обе черты.
- source_word: הַ/מֶּרְכָּב
  choice: седло
  rationale: מֶרְכָּב обозначает то, на чём ездят верхом. В данном контексте закона о ритуальной нечистоте «седло» — наиболее конкретное и естественное обозначение, однако более широкий смысл сохранён в сноске.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: на котором ездит
  rationale: Передаёт относительную конструкцию и пространственное значение עַל; настоящее время по-русски естественно выражает общее правило.
- source_word: הַ/זָּב
  choice: мужчина с истечением
  rationale: Субстантивированное причастие мужского рода обозначает мужчину, имеющего телесное истечение, которое в контексте главы влечёт ритуальную нечистоту.
- source_word: יִטְמָא
  choice: будет нечисто
  rationale: Форма глагола устанавливает ритуальный статус предмета. Выражение «будет нечисто» подходит для юридического предписания и не добавляет идеи нравственной вины.
theological_decisions:
- issue: Характер нечистоты в книге Левит
  choice: Передать טמא словом «нечисто» в ритуально-правовом смысле, не связывая его автоматически с нравственной виной.
  alternative: «осквернено» или «ритуально нечисто» непосредственно в основном тексте
  rationale: Стих говорит о статусе, возникающем в связи с телесным истечением, а не утверждает нравственную виновность. Традиционное «нечисто» сохраняет краткость и смысловую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой, подходящей для правового контекста. Терминология понятна широкому читателю; мужской референт и ритуальный характер нечистоты сохранены без конфессиональных уточнений.
