  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: ru
  text: Если у женщины будет кровянистое истечение[a], то семь дней она будет находиться в состоянии менструальной нечистоты[b]. Всякий, кто коснётся её, будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «истечение; кровь будет её истечением в её плоти (теле)».'
    reason: lexical_alternative
  - marker: b
    text: Здесь речь идёт о ритуальной нечистоте в законах книги Левит, а не обязательно о нравственной вине.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: будет истечение / это истечение
  rationale: Глагольная форма и родственное существительное обозначают телесное истечение; повтор сохраняет лексическую связь исходного текста, а выражение остаётся понятным современному читателю.
- source_word: דָּם
  choice: кровь
  rationale: 'Прямое соответствие: кровь уточняет характер истечения.'
- source_word: בִּבְשָׂרָהּ
  choice: из её тела
  rationale: Буквально предлог בְּ означает «в», а בָּשָׂר — «плоть, тело»; по-русски применительно к истечению естественнее сказать «из её тела». Более буквальная форма отмечена в сноске.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое и естественное числовое выражение.
- source_word: בְנִדָּתָהּ
  choice: в состоянии менструальной нечистоты
  rationale: В законодательстве Левита נִדָּה обозначает связанное с менструацией состояние ритуальной нечистоты, а не только физиологическое явление.
- source_word: כָל־הַנֹּגֵעַ בָּהּ
  choice: всякий, кто прикоснётся к ней
  rationale: Передаёт обобщённое значение причастной конструкции и звучит естественно в русском законодательном изложении.
- source_word: יִטְמָא
  choice: будет нечист
  rationale: Традиционное и точное обозначение ритуального статуса в законах о чистоте; оно не подразумевает само по себе нравственной вины.
- source_word: עַד־הָעָרֶב
  choice: до вечера
  rationale: Устойчивое и естественное русское соответствие временной границе исходного текста.
theological_decisions:
- issue: Передача терминов ритуальной нечистоты без приписывания нравственной вины
  choice: «в состоянии менструальной нечистоты» и «будет нечист» как обозначения ритуального статуса
  alternative: «осквернена» / «осквернится»
  rationale: Контекст Левита 15 регулирует обрядовый статус. Слова об «осквернении» могли бы ошибочно придать тексту оттенок нравственного проступка, которого данный стих прямо не утверждает.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным тоном, уместным для правового раздела Пятикнижия. Синтаксис упрощён для ясности, но повтор слова «истечение», временной срок и ритуальная терминология сохранены.
