  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: ru
  text: 'И вот в чём состоит его нечистота при истечении: выделяет ли его тело[a] истечение или тело его закупорено, так что истечение не выходит, — это его нечистота.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его плоть»; здесь это слово обозначает тело или ту его часть, с которой связано истечение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: его нечистота
  rationale: В контексте законов Левита слово обозначает ритуальную нечистоту; «нечистота» сохраняет установленную культовую категорию и не подразумевает нравственной вины.
- source_word: זוֹב
  choice: истечение
  rationale: Существительное обозначает патологическое телесное, в данном контексте половое, истечение. «Истечение» точно, сдержанно и уместно для законодательного текста.
- source_word: רָר
  choice: течёт
  rationale: Глагол передаёт продолжающееся выделение жидкости и сохраняет образ течения, выраженный в еврейском тексте.
- source_word: בְּשָׂרוֹ
  choice: его тело
  rationale: Буквально «его плоть», но здесь слово указывает на тело или соответствующий телесный орган. «Тело» естественнее в современном русском языке и не привносит посторонних богословских ассоциаций.
- source_word: הֶחְתִּים
  choice: закупорено
  rationale: Форма описывает закрытое или перекрытое состояние тела в противопоставлении свободно текущему истечению. «Закупорено» ясно передаёт физиологическую обструкцию.
- source_word: מִזּוֹבוֹ
  choice: из-за истечения
  rationale: Предлог допускает понимание отделения от истечения или обусловленности им. В сочетании с «закупорено» причинная формулировка звучит по-русски естественно, не устраняя образ обструкции.
- source_word: וְזֹאת תִּהְיֶה
  choice: И вот в чём будет
  rationale: Передаёт соединительный союз, указательную формулу и будущую форму, сохраняя законодательный регистр.
- source_word: אוֹ
  choice: ли ... или
  rationale: Конструкция ясно представляет два альтернативных состояния, к которым относится одно и то же постановление.
theological_decisions:
- issue: Характер нечистоты
  choice: Передать טֻמְאָה словом «нечистота» без нравственной квалификации.
  alternative: «Осквернение» или формулировка, подразумевающая грех.
  rationale: Стих устанавливает состояние ритуальной нечистоты вследствие телесного истечения, а не утверждает нравственную виновность.
translation_notes:
  register: Современный литературный русский язык с ясным законодательным строем. Сохранены повтор «истечение» и заключительное «это его нечистота», поскольку они структурируют юридическое определение в еврейском тексте. Терминология сдержанно-клиническая, без эвфемизма и без излишней анатомической конкретизации.
