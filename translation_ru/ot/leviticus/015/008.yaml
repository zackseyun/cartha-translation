base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: ru
  text: А если мужчина с истечением плюнет на чистого человека[a], тот должен выстирать свою одежду, омыться водой и будет нечист до вечера[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на чистого». То есть на человека, который был ритуально чист.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о ритуальной нечистоте, а не обязательно о нравственном осквернении.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: А если
  rationale: Передаёт связь с предшествующим рядом постановлений и вводит условный случай.
- source_word: יָרֹק הַזָּב
  choice: мужчина, у которого истечение, плюнет
  rationale: Глагол означает «плевать», а субстантивированное причастие обозначает человека с истечением; мужской род уточняется ближайшим контекстом главы.
- source_word: בַּטָּהוֹר
  choice: на человека, который чист
  rationale: Предлог ב здесь передаёт направленность действия («на»), а субстантивированное טָהוֹר обозначает ритуально чистого человека.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: то тот должен выстирать свою одежду
  rationale: 'Смена подлежащего естественно раскрыта словом «тот»: стирать одежду должен человек, на которого плюнули; כבס обычно обозначает стирку одежды.'
- source_word: וְרָחַץ בַּמַּיִם
  choice: омыться водой
  rationale: В данном обрядовом контексте речь идёт об омовении тела; русская возвратная форма естественно передаёт подразумеваемый объект действия.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: и будет нечист до вечера
  rationale: Сохраняет стандартную левитскую формулу временной ритуальной нечистоты без придания ей значения нравственной вины.
theological_decisions:
- issue: Термины ритуальной чистоты
  choice: «чист» / «нечист» с пояснением в сносках
  alternative: «ритуально чист» / «ритуально нечист» непосредственно в тексте
  rationale: Традиционная и понятная пара сохраняет краткость древнееврейского текста, а сноски предотвращают ошибочное понимание как физической чистоты или нравственной порочности.
- issue: Кто должен совершить омовение
  choice: Явно обозначить пострадавшего словом «тот»
  alternative: Сохранить цепочку местоименных форм без явного указания подлежащего
  rationale: В древнееврейской правовой формуле подлежащим последующих глаголов является ритуально чистый человек, на которого плюнули; явное «тот» устраняет возможную русскую двусмысленность, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным правовым строем. «Истечение» сохраняет принятую библейскую медицинско-ритуальную лексику; «омыться» уместно для полного телесного омовения. Все сноски отмечены в основном тексте.
