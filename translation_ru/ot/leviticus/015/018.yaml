  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: ru
  text: Если мужчина ляжет с женщиной и у него будет семяизвержение[a], оба должны омыться водой и будут нечисты[b] до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально означает «излияние семени» и относится к семяизвержению.
    reason: lexical_clarification
  - marker: b
    text: То есть ритуально нечисты до вечера.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר יִשְׁכַּב אִישׁ אֹתָהּ
  choice: Если мужчина ляжет с женщиной
  rationale: В контексте казуистического закона относительная конструкция имеет условный смысл. Оборот «ляжет с женщиной» сохраняет сдержанный библейско-правовой регистр и ясно обозначает половое сношение.
- source_word: שִׁכְבַת זָרַע
  choice: и произойдёт излияние семени
  rationale: Еврейское сочетание обозначает половое сношение с семяизвержением. Безличная конструкция естественна по-русски, точно передаёт телесную конкретность текста и не добавляет не выраженных в нём подробностей.
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: пусть оба омоются водой
  rationale: Множественное число относится к обоим участникам. «Омоются водой» передаёт предписанное омовение в достойном, но понятном современном регистре.
- source_word: וְטָמְאוּ
  choice: будут нечисты
  rationale: Перевод сохраняет обычную лексику левитской чистоты и не подменяет временное состояние ритуальной нечистоты утверждением о нравственной вине.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Прямой и естественный русский эквивалент установленной в законах о чистоте временной границы; «до захода солнца» было бы более толковательным.
theological_decisions:
- issue: Характер нечистоты после полового сношения
  choice: будут нечисты
  alternative: будут ритуально нечисты
  rationale: Сам еврейский текст употребляет общее для книги Левит слово טמא без добавочного определения. Краткий перевод сохраняет формулировку источника, а примечание поясняет, что речь идёт о ритуальном статусе, а не о нравственной виновности.
translation_notes:
  register: Современный литературный русский язык со сдержанным правовым и библейским оттенком. Формулировка остаётся ясной для обычного читателя, не становится ни излишне клинической, ни эвфемистически расплывчатой.
