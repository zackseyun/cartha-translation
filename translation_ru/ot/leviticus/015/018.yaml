  rationale: Правка делает обозначение שִׁכְבַת זָרַע естественным и однозначным в современном русском, сохраняя связь с мужчиной и не добавляя подробностей. Предписание об омовении передано нормативной формой «должны». Смысл, временная граница и различие между ритуальной нечистотой и нравственной виной сохранены.
