base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ru
  text: И всякий, кто прикоснётся к любому предмету[a], на котором она сидит, должен выстирать свою одежду и омыться водой; он будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вещи», «сосуду» или «утвари». Еврейское כְּלִי — широкое обозначение предмета, вещи или утвари.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: И всякий, кто прикоснётся
  rationale: Субстантивированное причастие обозначает любого человека, подпадающего под общее предписание; «всякий, кто» естественно передаёт всеобщий охват.
- source_word: בְּכָל כְּלִי
  choice: к какому-либо предмету
  rationale: כְּלִי — широкое обозначение вещи, предмета, утвари или сосуда. В данном контексте «предмет» не сужает значение до ёмкости.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: на котором она сидит
  rationale: Относительное предложение относится к כְּלִי, а местоименно подразумеваемое подлежащее женского рода указывает на женщину из предшествующего контекста. Настоящее время по-русски естественно передаёт обобщённое условие.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Глагол כִּבֵּס применительно к одежде означает стирку; «должен» ясно передаёт предписывающую силу формы.
- source_word: וְרָחַץ בַּמַּיִם
  choice: и омыться водой
  rationale: В законах о чистоте רָחַץ обозначает омовение тела. Возвратная форма устраняет возможное понимание, будто человек должен мыть иной предмет.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: он будет нечист до вечера
  rationale: «Нечист» сохраняет специальную категорию ритуальной нечистоты, а «до вечера» передаёт установленный срок её действия.
theological_decisions:
- issue: Характер нечистоты в законах Левита
  choice: Передать טָמֵא словом «нечист» как обозначение ритуального состояния.
  alternative: «осквернён» или «виновен»
  rationale: Нечистота здесь возникает вследствие прикосновения и не представлена как личная нравственная вина; перевод не должен привносить такую оценку.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, нормативным звучанием. Формулировка сохраняет краткость законодательного текста и остаётся понятной без специальной терминологии.
