  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: ru
  text: И священник принесёт одну как жертву за грех[a], а другую — во всесожжение, и священник совершит за неё искупление перед Яхве из-за её нечистого истечения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительную жертву». Еврейское חַטָּאת в данном обрядовом контексте может подчёркивать очистительную функцию жертвы.'
    reason: Лексическая альтернатива сохраняет значимый ритуальный оттенок термина.
lexical_decisions:
- source_word: וְעָשָׂה
  choice: принесёт
  rationale: Хотя глагол буквально означает «сделает», в контексте жертвоприношения естественное русское соответствие — «принесёт».
- source_word: הָאֶחָד חַטָּאת
  choice: одну птицу в жертву за грех
  rationale: חַטָּאת обозначает установленный вид жертвы; традиционное и понятное выражение «жертва за грех» сохранено, а очистительный оттенок отмечен в сноске. Слово «птицу» восстановлено из непосредственного контекста стиха 29.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: а другую — во всесожжение
  rationale: עֹלָה — жертва, целиком сжигаемая на жертвеннике; «всесожжение» является точным и устоявшимся русским обозначением.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: совершит за неё искупление
  rationale: Передаёт культово-богословский смысл כפר, не сводя его исключительно к очищению; עָלֶיהָ естественно передано как «за неё».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняются значение присутствия перед Богом и личное заветное имя יהוה.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: из-за её нечистого истечения
  rationale: זוֹב означает телесное истечение, а טֻמְאָה характеризует его как ритуально нечистое. «Из-за» естественно передаёт причинно-исходное значение מִן после כפר, не превращая ритуальную нечистоту в нравственную вину.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Тетраграмматон передан как личное заветное имя, а не заменён титулом.
- issue: Значение חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Основной текст сохраняет привычное название жертвенной категории, а сноска указывает на существенную очистительную функцию термина в книге Левит.
- issue: Характер нечистоты женщины
  choice: нечистое истечение
  alternative: истечение её нечистоты
  rationale: Формулировка обозначает ритуальную телесную нечистоту и не приписывает женщине нравственной вины.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром. Повтор слова «священник» сохранён вслед за еврейским текстом; второе предложение введено словом «так», чтобы естественно выразить последовательность обряда. Термин «всесожжение» оставлен как общепринятое библейское культовое обозначение.
