  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: ru
  text: Если же мужчина ляжет с ней[a] и её менструальная нечистота перейдёт на него, он будет нечист семь дней, и всякая постель, на которую он ляжет, станет нечистой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть вступит с ней в половую связь. Буквально еврейская идиома усилена: «если мужчина непременно ляжет с ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: ляжет
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагольную идею. В русском условном предложении отдельная передача усиления словами «действительно» или «непременно» звучала бы неестественно; идиома «лечь с ней» ясно указывает на половую близость, а примечание раскрывает её смысл.
- source_word: אִישׁ
  choice: мужчина
  rationale: Существительное обозначает взрослого человека мужского пола; «мужчина» точно и естественно передаёт форму единственного числа.
- source_word: אֹתָהּ
  choice: с ней
  rationale: Местоимение относится к женщине из предшествующего контекста; при русском идиоматическом выражении требуется предлог «с».
- source_word: נִדָּתָהּ
  choice: её менструальная нечистота
  rationale: В контексте Левита слово обозначает состояние ритуальной нечистоты, связанное с менструацией, а не только физиологическое явление.
- source_word: וּתְהִי ... עָלָיו
  choice: перейдёт на него
  rationale: Буквально — «будет на нём». Выражение «перейдёт на него» естественно передаёт контекстуальную идею распространения ритуальной нечистоты, сохраняя образ направленности на мужчину.
- source_word: וְטָמֵא
  choice: он будет нечист
  rationale: В условно-правовом контексте форма сообщает наступающее состояние как следствие названного действия. «Будет нечист» сохраняет ритуальный, а не моральный смысл.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое и обычное соответствие числовому выражению.
- source_word: הַמִּשְׁכָּב
  choice: постель
  rationale: Слово обозначает место, на котором лежат. «Постель» естественно для данного бытового и ритуального контекста и несколько шире предметного «кровать».
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: на которую он ляжет
  rationale: Относительное придаточное непосредственно определяет постель и сохраняет временную перспективу правового предписания.
- source_word: יִטְמָא
  choice: станет нечистой
  rationale: 'Форма обозначает результат: постель приобретает состояние ритуальной нечистоты. Женский род согласован с существительным «постель».'
theological_decisions:
- issue: Передача терминов ритуальной нечистоты без приписывания моральной вины
  choice: «нечист», «нечистой» и «менструальная нечистота» как термины ритуальной чистоты
  alternative: «осквернён», «запятнан» или формулировки, подразумевающие нравственную порочность
  rationale: Левит 15 описывает культово-ритуальное состояние. Текст этого стиха сам по себе не отождествляет его с личной нравственной виной, поэтому перевод не должен вносить такое толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном, подходящим для правового раздела Пятикнижия. Синтаксис близок к еврейскому, но естественен по-русски; терминология последовательно отличает ритуальную нечистоту от моральной вины.
