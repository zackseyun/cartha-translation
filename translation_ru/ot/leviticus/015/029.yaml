base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: ru
  text: А на восьмой день пусть она возьмёт себе двух горлиц или двух молодых голубей и принесёт их священнику ко входу в шатёр встречи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: А на восьмой день
  rationale: Союз ו перед временным оборотом продолжает последовательность предписаний; «а на восьмой день» естественно передаёт этот переход в современном русском.
- source_word: תִּקַּח לָהּ
  choice: пусть она возьмёт себе
  rationale: Имперфект в законодательном контексте выражает предписание, а לָהּ имеет бенефактивно-рефлексивный оттенок, сохранённый словом «себе».
- source_word: שְׁתֵּי תֹרִים
  choice: двух горлиц
  rationale: «Горлица» — обычное и точное русское название תֹר; форма винительного падежа соответствует управлению глагола «возьмёт».
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: двух молодых голубей
  rationale: Конструктивное сочетание буквально означает птенцов голубя; «молодые голуби» — естественная русская формулировка для жертвенных птиц.
- source_word: וְהֵבִיאָה אֹתָם
  choice: и принесёт их
  rationale: Форма продолжает цепь ритуальных предписаний; будущее совершенного вида после «пусть возьмёт» звучит естественно и сохраняет обязательный характер действия.
- source_word: אֶל הַכֹּהֵן
  choice: священнику
  rationale: Направление передачи естественно выражается русским дательным падежом; определённость обозначает исполняющего обряд священника.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в шатёр встречи
  rationale: Повторённый אֶל прямо обозначает направление «ко входу». «Шатёр встречи» ясно передаёт אֹהֶל מוֹעֵד и сохраняет образ переносного святилища.
