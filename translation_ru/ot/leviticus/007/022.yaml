lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Форма וַיְדַבֵּר вводит новый фрагмент прямой речи; «говорил» соответствует торжественной повествовательно-законодательной формуле и естественно сочетается с последующим двоеточием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: Направление речи, выраженное предлогом אֶל, естественно передаётся в русском языке беспредложным дательным падежом после глагола «говорить».
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма библейского личного имени; в контексте употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Формула לֵאמֹר вводит содержание следующей прямой речи. В современном русском её функцию естественно и точно выполняет двоеточие; буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יְהוָה. Передача «Яхве» сохраняет имя и не подменяет его титулом, при этом сноска сообщает традиционный вариант.
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейской формулы. «И говорил» поддерживает связь с предшествующим контекстом, а двоеточие естественно вводит речь, начинающуюся в следующем стихе.
