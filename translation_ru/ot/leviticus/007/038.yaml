  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: ru
  text: который Яхве заповедал Моисею на горе Синай, в день, когда Он повелел сынам Израиля[a] приносить свои приношения Яхве в Синайской пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам» или «народу Израиля». Буквально: «сынам Израиля».'
    reason: Лексическая альтернатива поясняет буквальную семейно-родовую форму и её идиоматическое значение.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительное местоимение связывает стих с перечисленными ранее установлениями; форма множественного числа естественно согласуется с русским контекстом.
- source_word: צִוָּה
  choice: заповедал
  rationale: Передаёт властный характер повеления в законодательном и культовом контексте, сохраняя возвышенный, но понятный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּהַר סִינָי
  choice: на горе Синай
  rationale: Естественная русская передача географического выражения с сохранением значения предлога.
- source_word: בְּיוֹם צַוֺּתוֹ
  choice: в тот день, когда Он повелел
  rationale: Еврейская конструкция с инфинитивом и местоименным суффиксом развёрнута в естественное русское придаточное времени; прописная буква ясно указывает на Яхве как субъекта.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально сохраняет родственное выражение оригинала и его мужскую форму; более идиоматические варианты отмечены в сноске.
- source_word: לְהַקְרִיב
  choice: представлять
  rationale: В породе хифиль глагол означает подносить или представлять приношение; этот выбор избегает неуклюжего повтора «приносить приношения».
- source_word: קָרְבְּנֵיהֶם
  choice: свои приношения
  rationale: «Приношения» охватывает различные виды жертв, суммируемые в данном разделе; возвратное «свои» естественно соотносит их с сынами Израиля.
- source_word: בְּמִדְבַּר סִינָי
  choice: в Синайской пустыне
  rationale: Естественная современная русская форма названия местности, передающая מִדְבָּר как пустынную область.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал употребляет личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля
  rationale: Основной текст сохраняет семейно-родовую форму еврейского выражения, не исключая его общеэтнического значения, которое отражено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным законодательным регистром. Синтаксис сохраняет связь с предыдущим стихом, поскольку еврейский текст начинается относительным предложением.
