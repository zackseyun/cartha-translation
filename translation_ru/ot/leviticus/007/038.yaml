  rationale: Исправлено число относительного местоимения в соответствии с синтаксической связью с «законом» в предыдущем стихе. Глагол «представлять» заменён на более естественное для русского библейского и культового контекста «приносить». Убрано необязательное «тот»; временная конструкция при этом полностью сохраняет значение בְּיוֹם. Смысл, имя Яхве и сноска сохранены.
