    issue: Несогласование относительного местоимения с контекстуальным антецедентом
    rationale: Еврейское אֲשֶׁר не маркирует число, но в Лев 7:37 ближайший антецедент — «закон» (תּוֹרָה, ед. ч.). Поэтому по-русски нужно «который», а не «которые».
  - severity: low
    issue: «Представлять» в жертвенно-культовом контексте
    rationale: Глагол не неверен, но имеет бюрократический оттенок. «Приносить» — обычная и ясная современная передача לְהַקְרִיב в сочетании с «приношениями».
  revised_text: который Яхве заповедал Моисею на горе Синай, в день, когда Он повелел сынам Израиля[a] приносить свои приношения Яхве в Синайской пустыне.
