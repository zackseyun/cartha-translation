base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: ru
  text: Священник сожжёт жир на жертвеннике[a], а грудная часть будет принадлежать Аарону и его сыновьям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предаст жир сожжению на жертвеннике, чтобы он поднялся дымом».'
    reason: 'Лексическая альтернатива передаёт присущий הִקְטִיר каузативный оттенок: жир сжигается так, что восходит дымом.'
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: пусть сожжёт
  rationale: В породе хифиль глагол קטר в жертвенном контексте означает сжигание на жертвеннике, при котором приношение восходит в дыму. Формулировка естественна для современного русского языка, а оттенок дыма сохранён в сноске.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное соответствие כֹּהֵן в контексте богослужения; единственное число оригинала сохранено.
- source_word: הַחֵלֶב
  choice: жир
  rationale: В жертвенных предписаниях книги Лев обозначает предназначенные для жертвенника жировые части.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительное окончание допускает буквальное «к жертвеннику», однако в сочетании с הִקְטִיר речь идёт о сжигании жира на жертвеннике.
- source_word: וְהָיָה
  choice: будет принадлежать
  rationale: Буквально «будет», но конструкция здесь выражает установленное право на долю; перевод ясно передаёт юридический смысл контекста.
- source_word: הֶחָזֶה
  choice: грудная часть
  rationale: В жертвенном законодательстве חָזֶה означает определённую часть туши — грудину или грудную часть; выбранное выражение понятно и не смешивается с обозначением человеческой груди.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Аарону и его сыновьям
  rationale: Предлог לְ выражает передачу или принадлежность установленной священнической доли.
