source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: ru
  text: Ибо всякий, кто ест жир животного, из которого приносят Господу жертву, сжигаемую на огне[a], будет отсечён от своего народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огненную жертву». Еврейский термин обозначает жертвенное приношение, обращаемое огнём на жертвеннике.'
    reason: lexical_alternative
  - marker: b
    text: '«Будет отсечён» — древнееврейская правовая формула. Точный вид наказания неясен: она может подразумевать изгнание, смерть или Божий суд.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание для предшествующего запрета и сохраняет связь стиха с контекстом.
- source_word: כָּל אֹכֵל
  choice: всякий, кто ест
  rationale: Передаёт универсальный характер правового предписания естественным современным русским оборотом.
- source_word: חֵלֶב
  choice: жир
  rationale: Речь идёт о животном жире, особенно о жировых частях, отведённых для жертвенника; простое слово «жир» точно и последовательно передаёт термин.
- source_word: מִן הַבְּהֵמָה
  choice: животного
  rationale: В данном жертвенном контексте בְּהֵמָה обозначает животное из числа пригодных для жертвоприношения; «животное» понятно и не архаично.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: из которого приносят
  rationale: Еврейский глагол стоит в единственном числе с неопределённым деятелем. Русская неопределённо-личная конструкция передаёт это без введения конкретного субъекта.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Термин обозначает жертву, обращаемую в дым на огне жертвенника. Такой перевод сохраняет связь с огнём и не сужает смысл до пищи.
- source_word: לַיהוָה
  choice: Господу
  rationale: Традиционное русское обозначение тетраграмматона; дательный падеж передаёт направленность и посвящение жертвы Яхве.
- source_word: וְנִכְרְתָה
  choice: будет отсечён
  rationale: Сохраняет устойчивую древнееврейскую формулу наказания, не уточняя спорный способ её исполнения.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: всякий, кто ест его
  rationale: נֶפֶשׁ в правовом контексте означает человека. Повтор сохранён ради юридического акцента, а местоимение «его» относится к жиру.
- source_word: מֵעַמֶּיהָ
  choice: от своего народа
  rationale: Форма женского рода согласуется грамматически с נֶפֶשׁ, но относится к любому нарушителю; русское возвратное местоимение естественно сохраняет обобщённый смысл.
theological_decisions:
- issue: Значение формулы וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: будет отсечён от своего народа
  alternative: будет изгнан из своего народа; будет предан смерти
  rationale: 'Точный характер кары остаётся спорным: формула может указывать на исключение из общины, смерть, Божий суд либо сочетание этих смыслов. Перевод сохраняет образ и не разрешает неоднозначность за текст.'
- issue: Передача имени יהוה
  choice: Господу
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской традиции и не меняет референта собственного Божьего имени; альтернативная передача произношением возможна, но в основном тексте не требуется.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и культового контекста. Синтаксический повтор намеренно сохранён для передачи подчёркнутой юридической формулировки оригинала; архаическое «душа, которая ест» заменено естественным обозначением человека.
