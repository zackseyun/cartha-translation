  source_fidelity: 'Смысл исходного текста в целом передан верно: речь идёт о всяком, кто ест חֵלֶב животного, от которого приносят жертву, посвящённую יהוה, и о наказании «отсечения от народа». Однако повтор «всякий, кто ест» в русском тексте избыточен и создаёт неестественную, хотя и мотивированную оригиналом, конструкцию. Формулу אִשֶּׁה точнее передать описательно, не создавая впечатления, что «огненная жертва» является особым современным термином или что сжигается непременно вся жертва.'
