  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: ru
  text: Если он приносит её как благодарственную жертву[a], то вместе с благодарственной жертвой пусть принесёт пресные хлебы, замешанные на масле, пресные лепёшки, смазанные маслом, и хлебы из муки тонкого помола, тщательно приготовленные и смешанные с маслом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву благодарения». Еврейское תּוֹדָה означает «благодарение»; в данном жертвенном контексте — жертву, приносимую в знак благодарности.'
    reason: lexical_alternative
  - marker: b
    text: Точный способ приготовления, обозначенный еврейским словом מֻרְבֶּכֶת, неясен; возможно, речь идёт о тщательно обработанном или вымешанном тесте. Следующее слово отдельно указывает, что хлебы были смешаны с маслом.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: благодарственная жертва
  rationale: В контексте мирной жертвы слово обозначает её особый вид, приносимый в благодарность; этот вариант ясен современному русскому читателю.
- source_word: יַקְרִיבֶנּוּ
  choice: приносит её
  rationale: Порода глагола Hiphil от קרב в жертвенном контексте означает представлять или приносить жертву.
- source_word: זֶבַח הַתּוֹדָה
  choice: благодарственная жертва
  rationale: Естественно передаёт сочетание, в котором תּוֹדָה определяет вид жертвы.
- source_word: חַלּוֹת מַצּוֹת
  choice: пресные хлебы
  rationale: Передаёт как форму хлебных изделий, так и отсутствие закваски.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: замешанные на масле
  rationale: В контексте приготовления теста естественно передаёт смешивание муки с маслом.
- source_word: רְקִיקֵי מַצּוֹת
  choice: пресные лепёшки
  rationale: רְקִיקִים обозначает тонкие хлебные изделия; «лепёшки» звучит естественно и сохраняет отличие от хлебов.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: смазанные маслом
  rationale: Буквальное значение связано с намазыванием или помазанием, но здесь речь идёт о приготовлении пищи, поэтому «смазанные» избегает неуместного ритуального оттенка.
- source_word: סֹלֶת
  choice: тонкая мука
  rationale: Обозначает тонко смолотую, высококачественную муку, употреблявшуюся в приношениях.
- source_word: מֻרְבֶּכֶת
  choice: хорошо вымешанные
  rationale: Точный способ приготовления неясен; осторожный перевод указывает на тщательную обработку смеси, не утверждая более конкретного кулинарного процесса.
- source_word: חַלֹּת
  choice: хлебы
  rationale: Передаёт хлебные изделия и сохраняет связь с первым употреблением того же существительного в стихе.
theological_decisions:
- issue: Характер תּוֹדָה в данном предписании
  choice: Передано как особый вид жертвы — «благодарственная жертва».
  alternative: «жертва благодарения» или более общее «приношение в благодарность».
  rationale: Контекст жертвенного законодательства требует сохранить техническое значение, не сводя слово только к внутреннему чувству благодарности.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. «Масло» выбрано вместо архаичного «елей», а кулинарные действия переданы обычными современными словами; неопределённость редкого термина מֻרְבֶּכֶת сохранена в примечании.
