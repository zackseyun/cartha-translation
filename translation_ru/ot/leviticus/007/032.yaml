  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: ru
  text: Правое бедро отдавайте священнику как приношение из ваших мирных жертв[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как выделенную долю». Традиционно: «как возношение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из ваших жертв общения»; возможный вариант: «из ваших жертв благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: бедро
  rationale: Слово обозначает часть ноги животного, вероятно верхнюю; «бедро» точно и естественно передаёт жертвенно-анатомический термин.
- source_word: הַיָּמִין
  choice: правое
  rationale: В еврейском тексте прямо указана правая сторона; это существенное обозначение установленной доли.
- source_word: תִּתְּנוּ
  choice: отдавайте
  rationale: Форма 2-го лица множественного числа в юридическом предписании передана современным русским повелительным выражением с нормативным значением.
- source_word: תְרוּמָה
  choice: приношение
  rationale: Термин обозначает выделенную и переданную долю. «Приношение» понятно современному читателю и не навязывает спорную идею буквального ритуального возношения.
- source_word: לַכֹּהֵן
  choice: священнику
  rationale: Сохранены дательное значение и единственное число еврейского текста.
- source_word: מִזִּבְחֵי שַׁלְמֵיכֶם
  choice: из ваших мирных жертв
  rationale: Предлог מִן указывает на источник выделяемой доли, суффикс сохраняет значение «ваших», а традиционное «мирные жертвы» остаётся узнаваемым русским названием данного вида жертв.
- source_word: וְאֵת
  choice: прямо не выражено
  rationale: Знак прямого дополнения не переводится; начальный союз не воспроизведён отдельным «и», поскольку в русском самостоятельное предписание естественно начинается с вынесенного дополнения, а связь с контекстом сохраняется последовательностью стихов.
theological_decisions:
- issue: Значение שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Еврейский термин допускает смысловые оттенки мира, благополучия и общения. В основном тексте использовано традиционно узнаваемое название, а альтернативы отмечены в сноске, чтобы не сужать семантический диапазон.
translation_notes:
  register: Современный литературный русский язык; краткая и ясная формулировка законодательного предписания. Порядок слов подчёркивает назначенную часть жертвы без архаического «и давайте».
