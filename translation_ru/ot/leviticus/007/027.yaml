  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: ru
  text: Всякий, кто ест какую бы то ни было кровь, — тот человек будет отсечён от своего народа[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякая душа»; здесь еврейское нефеш означает отдельного человека.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «будет отсечён» — установленная формула заветного наказания. Она может подразумевать удаление из общины или Божий суд; точный способ наказания здесь не указан.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: всякий / человек
  rationale: В данном правовом контексте נֶפֶשׁ обозначает отдельного человека, а не нематериальную «душу». В первой части по-русски естественно употребить субстантивированное «всякий», а при повторном упоминании — «тот человек», сохраняя эмфатическое возобновление подлежащего.
- source_word: תֹּאכַל
  choice: станет есть
  rationale: Имперфект в относительной конструкции выражает общий правовой случай. «Станет есть» естественно передаёт условно-обобщённый смысл, не ограничивая действие единичным будущим событием.
- source_word: כָּל דָּם
  choice: какую-либо кровь
  rationale: 'כָּל при неисчисляемом существительном имеет распределительное значение: речь идёт о крови любого рода, а не обо всей крови как совокупности.'
- source_word: וְנִכְרְתָה
  choice: будет отсечён
  rationale: Сохранена стандартная заветно-судебная формула כרת в нифале и её неопределённость относительно конкретного способа наказания.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: тот человек
  rationale: Повтор существительного с указательным местоимением подчёркнуто возвращает к названному нарушителю; «тот человек» сохраняет это юридическое ударение.
- source_word: מֵעַמֶּיהָ
  choice: от своего народа
  rationale: Женский суффикс согласован с грамматически женским נֶפֶשׁ и не указывает на пол нарушителя. Возвратное «своего» естественно и гендерно нейтрально обозначает принадлежность человека к его народу.
theological_decisions:
- issue: Значение заветной санкции «будет отсечён»
  choice: Сохранить формулу «будет отсечён», не уточняя способ наказания.
  alternative: «будет предан смерти»; «будет исключён из общины»; «будет уничтожен Богом»
  rationale: 'Еврейская формула кратка и допускает разные толкования: удаление из общины, смерть или непосредственный Божий суд. Перевод не должен устранять эту сохраняемую исходным текстом неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с лаконичным и строгим правовым звучанием. Тире перед санкцией передаёт подчёркнутое возобновление «тот человек». Формула «будет отсечён» намеренно несколько буквальна, чтобы сохранить устойчивый образ и смысловую неоднозначность еврейского текста.
