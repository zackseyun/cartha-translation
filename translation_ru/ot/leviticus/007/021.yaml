id: LEV.7.21
reference: Leviticus 7:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: ru
  text: Если человек прикоснётся к чему-либо нечистому — к человеческой нечистоте, к нечистому животному или к какой-либо нечистой мерзости — а затем съест мясо мирной жертвы, принадлежащей Господу, то этот человек будет отсечён от своего народа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Будет отсечён от своего народа» — формула наказания за нарушение завета. Здесь не уточняется, означает ли она исключение из общины, смерть или непосредственный Божий суд.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: кто-нибудь / тот человек
  rationale: В законодательном контексте слово обозначает отдельного человека, а не нематериальную «душу»; такая передача естественна по-русски.
- source_word: תִגַּע
  choice: прикоснётся
  rationale: Сохраняет прямое значение физического соприкосновения и его ритуальные последствия.
- source_word: בְּכָל טָמֵא
  choice: к чему-либо нечистому
  rationale: Передаёт широкий и неопределённый охват еврейского выражения.
- source_word: טֻמְאַת אָדָם
  choice: к нечистоте человека
  rationale: Речь идёт о ритуальной нечистоте, связанной с человеком; родовое «человека» не ограничивает норму мужчинами.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: к нечистому животному
  rationale: Общее «животное» ясно передаёт широкое значение בְּהֵמָה в данном перечне.
- source_word: שֶׁקֶץ טָמֵא
  choice: к какому-либо нечистому мерзкому существу
  rationale: «Существо» естественно в ряду объектов прикосновения, а «мерзкое» сохраняет оттенок ритуального отвращения слова שֶׁקֶץ, не сужая его до пресмыкающихся или роящихся существ.
- source_word: וְאָכַל מִבְּשַׂר
  choice: и съест мясо
  rationale: Русский глагол «съест» допускает частичное количество без неестественного «часть мяса»; речь идёт о мясе жертвы.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: жертвы мирной
  rationale: Традиционный и узнаваемый русский термин сохраняет особое наименование жертвы, не сводя его к одному истолкованию как трапезы общения.
- source_word: אֲשֶׁר לַיהוָה
  choice: которая принадлежит Господу
  rationale: Ясно выражает посвящённость и принадлежность жертвы Яхве.
- source_word: יהוה
  choice: Господь
  rationale: Литературная русская передача тетраграмматона, соответствующая принятому библейскому регистру.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: будет истреблён из своего народа
  rationale: Сохраняет тяжесть формулы כרת и её связь с народом, а примечание предупреждает, что конкретный способ наказания текстом не определён.
theological_decisions:
- issue: Точный смысл санкции וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: передать формулой «будет истреблён из своего народа», не уточняя механизма наказания
  alternative: «будет исключён из своего народа» или «будет предан смерти»
  rationale: Формула может подразумевать исключение, смерть либо непосредственный Божий суд; еврейский текст здесь не уточняет способ исполнения, поэтому перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным законодательным регистром. Синтаксис перечня сохранён, но оформлен тире для ясности. Грамматически женская форма местоименного суффикса в מֵעַמֶּיהָ обусловлена женским родом נֶפֶשׁ и не указывает на пол нарушителя.
