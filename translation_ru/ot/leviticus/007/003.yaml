  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: ru
  text: 'И пусть он принесёт из неё весь жир: курдюк[a] и жир, покрывающий внутренности.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Курдюк — жирный хвост овцы.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: её жир / жир
  rationale: В контексте жертвоприношений חֵלֶב обозначает предназначенные для принесения жировые части; слово «жир» передаёт это прямо и естественно.
- source_word: יַקְרִיב
  choice: пусть представит
  rationale: Форма глагола קרב в породе хифиль в жертвенных предписаниях означает ритуально представить или принести Богу; «представит» сохраняет этот смысл, не уточняя сверх текста стадию обряда.
- source_word: מִמֶּנּוּ
  choice: из неё
  rationale: Местоименный суффикс относится к жертвенному животному; женский род согласован с подразумеваемой жертвой и естественен в русском контексте.
- source_word: הָאַלְיָה
  choice: курдюк
  rationale: אַלְיָה — жирный хвост курдючной овцы, особая жировая часть жертвенного животного. Русское «курдюк» анатомически точно и лаконично.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: покрывающий внутренности
  rationale: קֶרֶב здесь относится к внутренним органам животного; «внутренности» — понятное и уместное современное соответствие.
- source_word: כָּל
  choice: весь
  rationale: כָּל подчёркивает полноту предназначенного для принесения жира; «весь» непосредственно сохраняет это значение.
