  terminology: «Яхве» последовательно передаёт тетраграмматон. «Огненные приношения» является приемлемым современным эквивалентом אִשֵּׁי; сноска даёт ясный традиционный вариант. Термины «священники», «помазание» и «посвящение» употреблены точно и без конфессионально обусловленного истолкования.
