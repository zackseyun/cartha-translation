id: LEV.7.35
reference: Leviticus 7:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: ru
  text: Вот доля[a] Аарона и доля его сыновей из огненных приношений Яхве[b] — в тот день, когда он представил их, чтобы они служили священниками Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доля, связанная с помазанием». Еврейское слово родственно слову «помазывать» и здесь, вероятно, обозначает долю, положенную священникам при их посвящении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из жертвенной пищи Яхве». Традиционный перевод: «из приношений, сжигаемых для Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: доля
  rationale: В данном контексте слово, связанное по происхождению с помазанием, обозначает положенную священникам долю от приношений. «Доля» естественно передаёт предметный смысл, а связь с помазанием сохраняется в сноске.
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: доля Аарона и доля его сыновей
  rationale: Повтор существительного в еврейском тексте сохранён, а местоимение ясно отнесено к Аарону.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: из огненных приношений Яхве
  rationale: Передаёт традиционное культовое значение אִשֶּׁה как приношения, возносимого на огне, и сохраняет исходный предлог «из».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Сохраняет временную конструкцию оригинала и звучит естественно по-русски.
- source_word: הִקְרִיב אֹתָם
  choice: он представил их
  rationale: Порода хифиль глагола קרב означает «приблизить, привести, представить». Поскольку дополнение — люди, «принёс их в жертву» было бы ошибочно.
- source_word: לְכַהֵן לַיהוָה
  choice: чтобы они служили священниками Яхве
  rationale: Передаёт цель их представления и значение глагола כהן — исполнять священническое служение для Яхве.
theological_decisions:
- issue: Значение מִשְׁחַת в постановлении о священнической доле
  choice: доля, связанная с посвящением
  alternative: помазание; доля помазания; помазанная доля
  rationale: Контекст говорит о причитающейся Аарону и его сыновьям части приношений, однако этимологическая связь слова с помазанием реальна и потому отмечена, а не устранена.
- issue: Неуказанный субъект формы הִקְרִיב
  choice: сохранено местоимение «он» без уточнения личности
  alternative: Моисей представил их
  rationale: В самом стихе субъект не назван. Контекст позволяет понимать Моисея, но перевод не должен делать подразумеваемое имя явным без необходимости.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Повтор «доля… доля» сохраняет структуру оригинала; тире помогает естественно присоединить временное обстоятельство без добавления отсутствующего в еврейском тексте сказуемого.
