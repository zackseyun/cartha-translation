  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: ru
  text: Но тот, кто ест мясо мирной жертвы, принадлежащей Господу, при том что он нечист, — тот будет отсечён от своего народа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет исключён из своего народа». Выражение «будет отсечён» может подразумевать изгнание или смерть, однако здесь еврейский текст не уточняет, каким именно образом это произойдёт.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: тот, кто / тот
  rationale: В данном правовом контексте נֶפֶשׁ обозначает отдельного человека, а не нематериальную душу. Такая конструкция естественно передаёт обобщённый характер предписания.
- source_word: תֹּאכַל
  choice: ест
  rationale: Имперфект формулирует общий случай казуистического закона; русское настоящее время в придаточном «кто ест» передаёт это естественно.
- source_word: בָּשָׂר
  choice: мясо
  rationale: В контексте употребления жертвенной пищи современное «мясо» яснее буквального «плоть» и не меняет смысла.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: мясо мирной жертвы
  rationale: «Мирная жертва» — узнаваемое и достаточно точное русское обозначение жертвенной категории שְׁלָמִים; единственное число соответствует форме זֶבַח.
- source_word: אֲשֶׁר לַיהוָה
  choice: принадлежащей Господу
  rationale: Фраза указывает на посвящённость и принадлежность жертвы YHWH. Передача «Господу» следует принятому русскому способу отображения тетраграмматона.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: когда на нём нечистота
  rationale: Сохранён еврейский пространственный образ нечистоты, находящейся «на» человеке, при этом оборот остаётся понятным по-русски.
- source_word: וְנִכְרְתָה
  choice: будет отсечён
  rationale: Формальная передача глагола כרת сохраняет суровость юридико-заветной формулы и не уточняет не названный в тексте способ наказания.
- source_word: מֵעַמֶּיהָ
  choice: от своего народа
  rationale: Возвратное местоимение естественно по-русски передаёт принадлежность к народу и избегает ошибочного вывода о биологическом поле из грамматически женского суффикса при נֶפֶשׁ.
theological_decisions:
- issue: Значение формулы וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: будет отсечён от своего народа
  alternative: будет исключён из своего народа; будет предан смерти
  rationale: Еврейская формула обозначает суровое удаление из сообщества завета, но данный стих не уточняет, совершается ли оно посредством изгнания, смерти или иным образом. Основной текст сохраняет эту неоднозначность, а варианты пояснены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис сделан доступным, но ключевой образ «нечистота на нём» и неоднозначная формула наказания сохранены.
