base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/028.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма с последовательным ו вводит новый речевой раздел. В данной формуле по-русски естественно «сказал»; отдельное לֵאמֹר перед прямой речью передано двоеточием, без тяжеловесного «говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи; имя дано в принятой русской форме.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формула вводит последующую прямую речь; в современном русском её функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя YHWH. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом; традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский, краткая и достоинственная формула введения речи. Двоеточие уместно, поскольку высказывание продолжается в следующем стихе.
