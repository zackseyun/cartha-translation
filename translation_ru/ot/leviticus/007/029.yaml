base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: ru
  text: '«Скажи сынам Израиля[a]: „Тот, кто приносит Господу свою мирную жертву[b], пусть принесёт Господу своё приношение из своей мирной жертвы“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Израиля»; также возможно: «израильтянам» или «детям Израиля». Это выражение обозначает народ Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское название этой жертвы связано со словами «мир», «благополучие», «целостность»; также переводят: «жертва благополучия» или «жертва общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... לֵאמֹר
  choice: Скажи ...
  rationale: Императив и вводная формула естественно передаются по-русски одним глаголом с последующей прямой речью; отдельное «говоря» было бы неестественным гебраизмом.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный мужской образ и традиционное заветное обозначение общины, не сводя его без пояснения к более общему «израильтянам».
- source_word: הַמַּקְרִיב
  choice: тот, кто приносит
  rationale: Hiphil от קרב в культовом контексте означает представление или принесение жертвы; «приносит» ясно и естественно по-русски.
- source_word: זֶבַח שְׁלָמָיו
  choice: свою мирную жертву
  rationale: «Мирная жертва» — понятное традиционное название данной жертвенной категории; слово «жертва» передаёт זֶבַח, а «мирная» сохраняет связь שְׁלָמִים с миром и благополучием.
- source_word: לַיהוָה
  choice: Господу
  rationale: Передаёт священное имя יהוה принятой русской формой «Господь»; дательный падеж соответствует направленности приношения.
- source_word: יָבִיא
  choice: пусть принесёт
  rationale: В законодательном контексте имперфект выражает предписание; конструкция с «пусть» звучит в современном русском естественнее, чем архаичное «да принесёт».
- source_word: קָרְבָּנוֹ
  choice: своё приношение
  rationale: «Приношение» отличает общее קָרְבָּן от конкретной жертвы זֶבַח и сохраняет культовый смысл того, что подносят Богу.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: из своей мирной жертвы
  rationale: Предлог מִן указывает, что требуемое приношение берётся из самой мирной жертвы; «из» точно выражает отношение части к целому.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Форма «Господь» следует устойчивой русской библейской традиции и отличает имя Бога контекстуально, не вводя спорную реконструкцию произношения в основной текст.
- issue: Передача שְׁלָמִים
  choice: мирная жертва
  alternative: жертва благополучия; жертва общения
  rationale: Выбрана традиционная и лексически прозрачная русская формула. Она не сужает значение до одного возможного аспекта, например общения, а альтернативные оттенки отмечены в сноске.
- issue: Гендерно маркированное обращение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Основной текст сохраняет мужскую форму исходного выражения и его заветный характер; корпоративный охват поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным законодательным звучанием. Прямая речь позволяет не воспроизводить тяжеловесное буквальное «говоря». Повтор «мирная жертва» сохранён, поскольку он присутствует в еврейском тексте и связывает приношение с конкретной жертвенной категорией.
