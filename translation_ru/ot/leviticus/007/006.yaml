lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: Всякий мужчина из священников
  rationale: Сочетание כָּל с זָכָר имеет распределительный смысл и прямо указывает на мужской пол; בַּכֹּהֲנִים обозначает принадлежность к группе священников.
- source_word: יֹאכְלֶנּוּ
  choice: может есть её
  rationale: В контексте жертвенного законодательства имперфект выражает дозволенное право на вкушение, а местоименный суффикс отсылает к жертве женского рода в предшествующем контексте.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: на святом месте
  rationale: Неопределённая конструкция обозначает место, обладающее святостью, без обязательного отождествления со Святилищем; по-русски применительно к месту естественен предлог «на».
- source_word: יֵאָכֵל
  choice: есть её следует
  rationale: Пассивный нифаль задаёт нормативное требование. Безличная русская конструкция естественно передаёт предписание и сохраняет объект из контекста.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Еврейская усилительная конструкция буквально означает высшую степень святости. «Великая святыня» — ясное и традиционно уместное русское обозначение особо святой жертвы, не смешивающее её со Святым святых как частью святилища.
- source_word: הוּא
  choice: Она —
  rationale: Местоимение относится к подразумеваемой жертве; в русском род согласован с существительным «жертва», восстанавливаемым из ближайшего контекста.
theological_decisions:
- issue: Ограничение права вкушения мужчинами из числа священников
  choice: Всякий мужчина из священников может есть её
  alternative: Всякий священник может есть её
  rationale: В еврейском тексте прямо стоит זָכָר, «мужчина / лицо мужского пола»; обобщение до всех священников устранило бы выраженное в тексте ограничение.
- issue: Степень святости жертвы
  choice: Она — великая святыня
  alternative: Она — святыня святынь
  rationale: Конструкция קֹדֶשׁ קָדָשִׁים является идиомой превосходной степени. Смысловая передача показывает категорию особой святости и не создаёт ложной ассоциации с внутренним помещением святилища.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным стилем правового предписания. Формулировка сохраняет различие между разрешением вкушать и обязательным местом вкушения; архаизмы и конфессионально специфические термины избегаются.
