base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: ru
  text: Тому из сыновей Аарона, кто приносит кровь мирных жертв[a] и жир, будет принадлежать правое бедро как его доля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертв общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: кто приносит
  rationale: Причастие породы hифиль от קרב означает ритуальное принесение или представление жертвы; конструкция «кто приносит» естественно передаёт причастное значение.
- source_word: דַּם
  choice: кровь
  rationale: Прямой и устойчивый эквивалент в контексте жертвоприношений.
- source_word: הַשְּׁלָמִים
  choice: мирных жертв
  rationale: Традиционный русский термин сохраняет связь названия жертвы с миром и благополучием; возможное толкование как жертвы общения вынесено в примечание.
- source_word: הַחֵלֶב
  choice: жир
  rationale: Буквальное обозначение предназначенных для жертвенника жировых частей в священническом законодательстве.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: из сыновей Аарона
  rationale: Сохраняет значение выбора одного человека из числа сыновей Аарона и конкретно мужское обозначение священников.
- source_word: לוֹ תִהְיֶה
  choice: будет дана
  rationale: 'В сочетании с «как его доля» естественно выражает установленное законом получение этой части; буквальнее: «будет принадлежать ему».'
- source_word: שׁוֹק הַיָּמִין
  choice: правая ляжка
  rationale: שׁוֹק обозначает часть ноги животного; «ляжка» является точным и понятным термином для соответствующего отруба и избегает слишком широкого «нога».
- source_word: לְמָנָה
  choice: как его доля
  rationale: Передаёт назначенную священнику долю при распределении жертвы.
theological_decisions:
- issue: Передача בְּנֵי אַהֲרֹן в священническом законодательстве
  choice: сыновей Аарона
  alternative: потомков Аарона; рода Аарона
  rationale: Еврейское выражение прямо называет сыновей Аарона и в данном контексте обозначает мужчин-священников; конкретность исходного текста сохранена.
- issue: Значение названия שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения
  rationale: Этимология и точный оттенок названия допускают разные объяснения. Основной текст сохраняет традиционное название без сведения значения исключительно к общению, а альтернатива отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством законодательного текста. Синтаксис перестроен естественно для русского: получатель вынесен в начало, при этом сохранены условие служения и юридически установленная доля.'
