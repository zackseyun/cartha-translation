  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: ru
  text: Священник должен сжечь их на жертвеннике как огненную жертву для Яхве; это жертва повинности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва за вину»; также возможно: «жертва возмещения». Еврейское слово אָשָׁם обозначает особую жертву, связанную с виновностью и, в ряде случаев, с возмещением ущерба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: пусть сожжёт
  rationale: Порода hифиль глагола קטר в жертвенном контексте означает предать части жертвы огню на жертвеннике, чтобы они восходили в дыме. «Сожжёт» естественно и ясно по-русски.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения отсылает к частям жертвы, названным в предшествующем контексте.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Определённое существительное в единственном числе; стандартное обозначение служителя в культовом законодательстве.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс буквально указывает движение к жертвеннику, но по смыслу жертвенного действия части сжигаются на нём.
- source_word: אִשֶּׁה
  choice: огненную жертву
  rationale: Технический культовый термин обозначает приношение, предаваемое огню. Это сохраняет явную связь с огнём и звучит естественнее, чем буквальное «приношение огнём».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог обозначает посвящение жертвы Яхве; русская конструкция «жертва Яхве» естественно передаёт адресата посвящения.
- source_word: אָשָׁם
  choice: жертва повинности
  rationale: В книге Левит это техническое название категории жертвы, связанной с виной и возмещением. «Жертва повинности» сохраняет идею виновности и отличается от «жертвы за грех».
- source_word: הוּא
  choice: это
  rationale: 'Местоимение образует именное предложение, категорически определяя данный обряд: «это жертва повинности».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Передача технического термина אָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения; жертва за вину
  rationale: Выбранный вариант передаёт формальную жертвенную категорию, не сводя её исключительно ни к внутреннему чувству вины, ни к материальному возмещению. Альтернативы указаны в примечании, поскольку термин включает оба смысловых аспекта.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой законодательной формы. «Пусть… сожжёт» естественно передаёт еврейское предписание; технические жертвенные термины выражены последовательно и без архаизации.
