  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: ru
  text: А священнику, приносящему всесожжение мужчины, пусть достанется кожа[a] всесожжения, которое он принёс.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шкура».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: священнику
  rationale: Стандартное обозначение священника в культовом законодательстве; определённость передана контекстом и конструкцией предложения.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: приносящему / принёс
  rationale: Hiphil глагола קרב здесь означает ритуально принести жертву; русский глагол «приносить» естественен в данном контексте и сохраняет повтор исходного корня.
- source_word: עֹלַת אִישׁ
  choice: всесожжение какого-либо человека
  rationale: עֹלָה передано традиционным и ясным термином «всесожжение», а אִישׁ — как неопределённое обозначение отдельного человека; такая формулировка не утверждает без необходимости, что жертвователь непременно мужчина.
- source_word: עֹור
  choice: кожа
  rationale: В контексте жертвенного животного означает снятую кожу; «кожа» — естественный современный русский эквивалент.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: священнику … пусть достанется
  rationale: Передаёт принадлежность кожи именно совершившему приношение священнику и сохраняет предписывающую силу формы יִהְיֶה.
theological_decisions:
- issue: Значение אִישׁ в сочетании עֹלַת אִישׁ
  choice: всесожжение какого-либо человека
  alternative: всесожжение мужчины
  rationale: В законодательной формуле אִישׁ может обозначать отдельного представителя народа без акцента на поле. Русское «какого-либо человека» сохраняет неопределённость и не вносит более узкого ограничения, чем требует контекст.
- issue: Культовый термин עֹלָה
  choice: всесожжение
  alternative: жертва возношения
  rationale: «Всесожжение» — укоренившийся и понятный русский термин для полностью сжигаемой жертвы; этимологический оттенок восхождения дыма не превращён в отдельное толкование.
translation_notes:
  register: Современный литературный русский с традиционной, понятной культовой терминологией. Порядок слов перестроен естественно для русского языка; относительное придаточное отнесено к всесожжению, как и в еврейском тексте. Единственный маркер [a] помещён непосредственно после слова «кожа».
