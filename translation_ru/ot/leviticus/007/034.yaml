reference: Leviticus 7:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: ru
  text: Ибо грудь потрясания и бедро возношения[b] Я взял у сынов Израиля[a], из их мирных жертв[c], и отдал их священнику Аарону и его сыновьям как вечную установленную долю, получаемую от сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у израильтян». Буквально: «у сынов Израиля» — это устойчивое заветное наименование народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бедро, отделённое как приношение». Еврейское слово обозначает часть, выделенную и вознесённую в дар.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жертв общения». Так называется особая категория жертвоприношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: грудь потрясания
  rationale: Сохраняет обозначение конкретной части жертвенного животного и отличительный термин ритуального движения; формулировка согласуется с культовым контекстом Левита.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: бедро возношения
  rationale: «Бедро» точно обозначает выделяемую часть животного, а «возношение» передаёт приношение, отделённое и поднятое перед Богом.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт буквальную форму устойчивого заветного наименования; в косвенных падежах употреблено «сынов/сынами Израиля».
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: их мирные жертвы
  rationale: Естественная русская формула сохраняет как идею жертвы, так и название особой категории שְׁלָמִים, не сужая её до одного аспекта общения.
- source_word: לָקַחְתִּי ... וָאֶתֵּן
  choice: я взял ... и отдал
  rationale: Русское прошедшее время естественно передаёт завершённые действия, которыми объясняется установленная доля священников.
- source_word: לְחָק עוֹלָם
  choice: как вечное установление
  rationale: Передаёт непреходящий характер юридически установленного порядка понятным современным языком.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: данное сынами Израиля
  rationale: Повторное מֵאֵת указывает на тех, от кого поступает постоянная священническая доля; причастная конструкция избегает двусмысленного русского «от сынов Израиля» при слове «установление».
theological_decisions:
- issue: Передача заветного наименования בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Формальная передача сохраняет устойчивое родовое и заветное обозначение исходного текста, а примечание указывает естественный современный эквивалент.
- issue: Передача названия жертв שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения
  rationale: «Мирные жертвы» сохраняют традиционное название особой жертвенной категории и не превращают возможный оттенок общения в единственное толкование.
- issue: Смысл заключительного מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: данное сынами Израиля
  alternative: от сынов Израиля
  rationale: Выражение понято как указание на источник постоянной доли Аарона и его сынов; при этом сохранена связь установления с обязанностью сынов Израиля.
translation_notes:
  register: Современный литературный русский с сохранением необходимых культовых терминов. Синтаксис упрощён для ясности, но параллелизм двух священнических долей и повторное указание на сынов Израиля сохранены. Местоимение божественного говорящего набрано со строчной буквы, поскольку прописная форма не выражена еврейским текстом.
