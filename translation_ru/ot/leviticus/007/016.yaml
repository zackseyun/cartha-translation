  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: ru
  text: Если же его жертва — по обету или добровольное приношение[a], то её следует есть в день, когда он приносит свою жертву; и на следующий день можно есть то, что от неё осталось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва во исполнение обета». Еврейский текст различает жертву, связанную с обетом, и добровольное приношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: по обету
  rationale: В данном контексте слово обозначает жертву, связанную с обетом или принесённую во исполнение обета; оборот «по обету» естественно передаёт категорию жертвы и сохраняет отличие от добровольного приношения.
- source_word: נְדָבָה
  choice: добровольное приношение
  rationale: Слово обозначает приношение, совершаемое добровольно, а не в силу обязательства; этот перевод ясен современному читателю и уместен в культовом контексте.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: его жертва
  rationale: Буквально сочетание близко к «жертва его приношения», однако в русском это звучит тяжеловесно и избыточно. «Его жертва» естественно передаёт смысл в контексте, где далее повторяется זִבְחוֹ.
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: в день, когда он приносит
  rationale: Порода hифиль глагола קרב здесь означает ритуально представить или принести жертву; «приносит» — естественный русский культовый эквивалент.
- source_word: יֵאָכֵל
  choice: её следует есть
  rationale: Нифаль допускает безлично-пассивное понимание «должна быть съедена»; русская безличная конструкция сохраняет предписывающий характер закона без стилистической тяжеловесности.
- source_word: וּמִמָּחֳרָת
  choice: и на следующий день
  rationale: מָחֳרָת указывает на следующий день; предложный оборот с מִן в данном контексте естественно передаётся временным выражением «на следующий день».
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: то, что от неё осталось
  rationale: Причастная форма обозначает оставшуюся часть жертвы; русский оборот ясно и естественно передаёт остаток жертвенного мяса.
- source_word: יֵאָכֵל
  choice: можно есть
  rationale: Во втором употреблении та же форма в контексте выражает разрешение употребить остаток на следующий день. «Можно есть» делает эту функцию явной, не меняя содержания предписания.
theological_decisions:
- issue: Различие между жертвой по обету и добровольным приношением
  choice: 'Сохранить две отдельные категории: «по обету» и «добровольное приношение».'
  alternative: Объединить их общим выражением «добровольная жертва».
  rationale: Еврейский текст противопоставляет נֶדֶר и נְדָבָה; объединение устранило бы значимое различие между обязательством, возникшим из обета, и свободным добровольным даром.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным законодательным тоном. Термины ритуального контекста переданы без архаизации; синтаксис слегка упрощён ради естественности, при этом различие двух видов приношения и смена предписывающего оттенка на разрешительный сохранены.
