base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: ru
  text: 'Как жертва за грех, так и жертва повинности: для них один закон[a]. Священник, совершающий искупление ею[b], получит её.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предписание». Евр. тора́.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «совершающий искупление ею». Местоимение относится к жертве; она предназначается священнику, совершающему искупление.'
    reason: source_clarification
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: Что жертва за грех, что жертва повинности
  rationale: Повторённый сравнительный предлог כְּ передаёт сопоставление двух жертв. Русская конструкция «что…, что…» естественно выражает одинаковое правило для обеих, не превращая первую часть в утверждение о полном тождестве жертв.
- source_word: חַטָּאת
  choice: жертва за грех
  rationale: В данном жертвенном контексте слово обозначает не сам грех, а установленный вид жертвы.
- source_word: אָשָׁם
  choice: жертва повинности
  rationale: В книге Левит это название особой жертвы, связанной с виной и возмещением; «жертва повинности» сохраняет её отличие от жертвы за грех.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: закон для них один
  rationale: תּוֹרָה здесь означает предписание, регулирующее порядок жертвоприношения; порядок слов сохраняет смысловое ударение на единстве правила для обеих жертв.
- source_word: אֲשֶׁר יְכַפֵּר בּוֹ
  choice: который совершает ею искупление
  rationale: Глагол כפר сохраняет жертвенно-богословский смысл искупления, а בּוֹ указывает на жертву как средство его совершения. Женский род местоимения обусловлен русским словом «жертва».
- source_word: לוֹ יִהְיֶה
  choice: Она будет принадлежать священнику
  rationale: Еврейская конструкция выражает принадлежность жертвы тому священнику, который совершает обряд; явное повторение «священнику» делает русский текст ясным.
theological_decisions:
- issue: Значение כפר в жертвенном законодательстве
  choice: совершает искупление
  alternative: совершает очищение; умилостивляет
  rationale: «Совершает искупление» сохраняет широкий культовый и богословский смысл глагола, не ограничивая его одной теорией действия жертвы.
- issue: Референт בּוֹ и принадлежность жертвы
  choice: жертва служит средством искупления и принадлежит совершающему обряд священнику
  alternative: священник совершает искупление за конкретного человека, не названного в стихе
  rationale: Предлог בְּ с местоименным суффиксом естественно указывает здесь на жертву как средство; объект, за кого совершается искупление, в еврейском тексте этого стиха прямо не выражен.
translation_notes:
  register: Современный литературный русский с ясной юридико-культовой формулировкой. Конструкция «что…, что…» передаёт еврейское сопоставление естественно и кратко; ключевые термины «жертва за грех», «жертва повинности» и «искупление» выдержаны в традиционном, но понятном регистре.
