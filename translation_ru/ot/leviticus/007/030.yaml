  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: ru
  text: 'Своими руками пусть он принесёт приношения, сжигаемые для Господа: жир на грудине пусть он принесёт, чтобы совершить перед Господом потрясание грудины[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Потрясание» — название ритуального действия (евр. тенуфа). Точный характер движения в данном месте не уточняется.
    reason: Поясняет специальный культовый термин תְּנוּפָה, не отождествляя его с возношением и не утверждая спорную реконструкцию жеста.
lexical_decisions:
- source_word: יָדָיו
  choice: своими руками
  rationale: Передаёт эмфатическое требование, чтобы приносящий лично принёс эти части жертвы.
- source_word: אִשֵּׁי יְהוָה
  choice: огненные приношения Господу
  rationale: Сохраняет культовый термин אִשֶּׁה, обозначающий приношение, сжигаемое на жертвеннике; форма множественного числа отражена.
- source_word: הַחֵלֶב עַל־הֶחָזֶה
  choice: жир вместе с грудиной
  rationale: Предлог עַל здесь естественно указывает на совместное принесение жира и грудины, не обязательно на их точное физическое расположение.
- source_word: לְהָנִיף ... תְּנוּפָה
  choice: совершить ... обряд возношения
  rationale: Передаёт сочетание глагола и родственного существительного как установленное ритуальное действие, избегая неясного буквального «поколебать колебанием».
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, соответствующая регистру данного издания.
theological_decisions:
- issue: Характер תְּנוּפָה
  choice: обряд возношения
  alternative: приношение потрясания / потрясать
  rationale: Текст описывает ритуальное действие перед Господом, но не уточняет его точную траекторию; выбранная формулировка не вводит спорной реконструкции жеста.
translation_notes:
  register: Современный литературный русский с сохранением достоинства культового законодательства. «Грудина» выбрана как понятное анатомическое и жертвенное обозначение הֶחָזֶה; синтаксис слегка перестроен ради естественности без устранения повторов исходного текста.
