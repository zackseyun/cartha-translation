base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: ru
  text: которую Яхве повелел давать им от сынов Израиля[a] в день, когда он помазал их, — вечное установление во все их поколения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от израильтян». Буквально: «от сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «постоянное установление»; «непреходящее установление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: которую
  rationale: Относительное местоимение связывает стих с долей священников, названной в предыдущем контексте; женский род соответствует слову «доля».
- source_word: צִוָּה
  choice: повелел
  rationale: Передаёт властный характер Божьего предписания и естественно звучит в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לָתֵת לָהֶם
  choice: давать им
  rationale: Сохраняет значение инфинитива «давать» и ясно указывает на священников как получателей.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: в день, когда помазал их
  rationale: Сохраняет конкретное временное выражение и специальный обрядовый глагол «помазал». Нулевой субъект в придаточном не вводит имени, отсутствующего в еврейском тексте.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: от сынов Израиля
  rationale: Близко передаёт буквальное заветное обозначение народа; более обычный русский вариант дан в сноске.
- source_word: חֻקַּת עוֹלָם
  choice: вечное установление
  rationale: Передаёт устойчивую юридико-культовую формулу, не превращая её в отвлечённое философское утверждение о вечности.
- source_word: לְדֹרֹתָם
  choice: во все их поколения
  rationale: Выражает непрерывную обязательность установления в последующих поколениях и сохраняет образность оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Сила выражения חֻקַּת עוֹלָם
  choice: вечное установление
  alternative: непреложное установление; постоянное установление
  rationale: Выбранный вариант сохраняет заветно-правовой смысл длительной обязательности, а указание «во все их поколения» очерчивает данный самим текстом горизонт.
- issue: Субъект помазания в מָשְׁחוֹ אֹתָם
  choice: когда помазал их
  alternative: когда Он помазал их; когда их помазали
  rationale: Еврейская форма указывает на субъект в третьем лице мужского рода, но не называет его заново. Русская конструкция с опущенным местоимением сохраняет эту связность и не усиливает толкование типографическим «Он».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, юридико-культовым регистром. Синтаксис сохраняет зависимость от предыдущего стиха, поскольку стих начинается относительным местоимением. Все сноски отмечены в основном тексте.
