base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: ru
  text: Вот закон о всесожжении, о хлебном приношении, о жертве за грех[a], о жертве повинности[b], об обрядах посвящения[c] и о мирной жертве[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об очистительной жертве». Еврейское слово может указывать как на грех, так и на очищение от осквернения, связанного с грехом или ритуальной нечистотой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о жертве возмещения». Еврейское слово подчёркивает виновность и ответственность, иногда требующую возмещения ущерба.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «о посвящении» или «о жертве посвящения». В еврейском тексте употреблено множественное число; речь идёт об обрядах поставления священников.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «о жертве общения» или «о жертве благополучия». Еврейское название может выражать мир, целостность, благополучие и общение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Вот закон
  rationale: Формула вводит итоговое перечисление установлений. «Закон» естественно передаёт תּוֹרָה в данном культово-правовом контексте; связка «вот» соответствует указательному זֹאת.
- source_word: לָעֹלָה
  choice: о всесожжении
  rationale: עֹלָה обозначает жертву, целиком восходящую в огне; «всесожжение» — точный и устойчивый русский термин.
- source_word: לַמִּנְחָה
  choice: о хлебном приношении
  rationale: В книге Левит מִנְחָה обозначает приношение из зерновых продуктов. «Хлебное приношение» понятно по-русски и охватывает не только цельное зерно, но также муку и выпечку.
- source_word: וְלַחַטָּאת
  choice: о жертве за грех
  rationale: חַטָּאת может обозначать как грех, так и жертву, устраняющую последствия греха или ритуальной нечистоты. В основном тексте сохранён узнаваемый термин, а смысловая альтернатива вынесена в сноску.
- source_word: וְלָאָשָׁם
  choice: о жертве повинности
  rationale: אָשָׁם связано с виновностью, ответственностью и в ряде случаев возмещением ущерба. «Жертва повинности» сохраняет отдельное название этой категории и не смешивает её с חַטָּאת.
- source_word: וְלַמִּלּוּאִים
  choice: о посвящении
  rationale: Множественное מִלּוּאִים относится к обрядам поставления священников, буквально к «наполнению рук». Обобщённое «посвящение» сохраняет возможность понимать термин как весь комплекс обрядов, а не только одну жертву.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: о мирной жертве
  rationale: זֶבַח — жертва, а שְׁלָמִים — традиционно «мирная», с оттенками благополучия, целостности и общения. Устойчивое русское название оставлено в тексте, а иные смысловые передачи приведены в сноске.
theological_decisions:
- issue: Значение חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Основной вариант сохраняет традиционную связь с грехом, но сноска не скрывает того, что жертва также очищает от ритуальной нечистоты.
- issue: Значение אָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения
  rationale: Текст не сводит эту жертву исключительно к денежному возмещению, однако альтернативный вариант отмечает присущий термину оттенок ответственности и компенсации.
- issue: Объём значения מִלּוּאִים
  choice: посвящение
  alternative: жертва посвящения
  rationale: Еврейская форма множественного числа может охватывать обряды поставления в целом, поэтому перевод не ограничивает её одной жертвой.
- issue: Значение שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Традиционный термин не разрешает однозначно широкую семантику корня; сноска сохраняет оттенки совместной трапезы, общения и благополучия.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного резюме. Повтор предлога «о» делает длинный перечень ясным. Термины «всесожжение», «хлебное приношение», «жертва за грех», «жертва повинности» и «мирная жертва» сохраняют узнаваемость, а сноски передают существенные лексические альтернативы без конфессионального истолкования.
