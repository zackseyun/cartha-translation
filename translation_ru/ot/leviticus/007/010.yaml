  text: וְ/כָל מִנְחָ֥ה בְלוּלָֽה בַ/שֶּׁ֖מֶן וַ/חֲרֵבָ֑ה לְ/כָל בְּנֵ֧י אַהֲרֹ֛ן תִּהְיֶ֖ה אִ֥ישׁ כְּ/אָחִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: ru
  text: А всякое хлебное приношение, смешанное с маслом или сухое, должно принадлежать всем сыновьям Аарона — каждому наравне с его братом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В культовом контексте Левита слово обозначает приношение из зерновых продуктов, а не дар вообще. «Хлебное приношение» — понятный и укоренившийся русский термин, не ограничивающий форму приношения только цельным зерном.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: смешанное с маслом
  rationale: Причастная конструкция описывает способ приготовления; этот вариант точно передаёт смысл и естественно звучит по-русски.
- source_word: חֲרֵבָה
  choice: сухое
  rationale: Сохраняет краткий лексический контраст с приношением, смешанным с маслом, не подменяя его толкованием «без масла».
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: должно принадлежать всем сыновьям Аарона
  rationale: Сочетание предлога לְ с глаголом היה здесь выражает принадлежность или назначение доли; русская формулировка ясно передаёт правовой характер установления.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновьям Аарона
  rationale: Сохранено прямо выраженное мужское родственное обозначение, уместное в контексте священнического законодательства.
- source_word: אִישׁ כְּאָחִיו
  choice: каждому наравне с его братом
  rationale: Еврейский распределительный оборот указывает на равную долю каждого; русский вариант сохраняет образ брата и делает равенство распределения ясным.
theological_decisions:
- issue: Гендерно маркированное обозначение священников
  choice: сыновьям Аарона — каждому наравне с его братом
  alternative: потомкам Аарона — всем поровну
  rationale: В еврейском тексте стоят мужские термины родства в контексте священнического закона. Их следует сохранить, не заменяя нейтральным обозначением.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного культового текста. Синтаксис достаточно близок к еврейскому оригиналу, но естественен для обычного читателя; союз «или» ясно связывает два вида хлебного приношения.
