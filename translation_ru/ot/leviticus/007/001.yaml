lexical_decisions:
- source_word: וְזֹאת
  choice: Вот
  rationale: Так естественно вводится новый раздел наставлений и передаётся указательное значение זֹאת; союз ו не требует отдельного «и» в русском заголовочном зачине.
- source_word: תּוֹרַת
  choice: закон о
  rationale: В данном контексте תּוֹרָה обозначает установленное предписание о порядке жертвоприношения. «Закон о» сохраняет традиционную формулировку и остаётся понятным современному читателю.
- source_word: הָאָשָׁם
  choice: жертва за вину
  rationale: אָשָׁם называет особый вид жертвы, связанный как с виной, так и с возмещением ущерба. «Жертва за вину» ясно передаёт основное значение, а оттенок возмещения отмечен в сноске.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Это еврейская усилительная конструкция, обозначающая высшую степень святости. «Великая святыня» естественно передаёт установленную ритуальную категорию и не создаёт путаницы со Святая святых как помещением святилища.
- source_word: הוּא
  choice: она —
  rationale: Местоимение употреблено как связка при классификации жертвы. В русском согласование следует за существительным женского рода «жертва», а тире естественно заменяет отсутствующую глагольную связку.
theological_decisions:
- issue: Передача названия жертвы אָשָׁם
  choice: жертва за вину
  alternative: жертва повинности; жертва возмещения
  rationale: Основной вариант сохраняет связь жертвы с виной и понятен современному читателю, не сводя её значение исключительно к материальной компенсации. Связанный с возмещением оттенок сохранён в сноске.
- issue: Передача категории קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  alternative: святыня святынь; величайшая святыня
  rationale: Фраза обозначает высшую степень ритуальной святости. Выбранный вариант сохраняет классификационный смысл, не отождествляя жертву с помещением «Святая святых».
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой законодательного предписания. Терминология понятна неспециалисту, при этом ритуальная категория и смысловая широта אָשָׁם сохранены.
