  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: ru
  text: Вот закон о мирной жертве, которую приносят Яхве:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертве благополучия»; традиционное название — «мирная жертва».'
    reason: Лексическая альтернатива для многозначного специального термина שְׁלָמִים.
lexical_decisions:
- source_word: וְזֹאת
  choice: Вот
  rationale: Указательное «вот» естественно вводит новый раздел и передаёт זֹאת; отдельное «и» по-русски здесь необязательно.
- source_word: תּוֹרַת
  choice: закон о
  rationale: В священническом контексте תּוֹרָה обозначает установленное ритуальное предписание; «закон о» сохраняет юридический характер выражения и естественно звучит по-русски.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: мирной жертве
  rationale: זֶבַח означает жертвоприношение, обычно связанное с закланием, а שְׁלָמִים — специальный жертвенный термин. Традиционное «мирная жертва» понятно русскому читателю; более смысловой вариант отмечен в сноске.
- source_word: אֲשֶׁר יַקְרִיב
  choice: которую приносят
  rationale: Hiphil глагола קרב в жертвенном контексте означает «представлять, приносить». Форма 3-го лица мужского рода единственного числа имеет обобщённое значение; русское неопределённо-личное «приносят» естественно передаёт общее ритуальное предписание без ненужного указания пола.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает направленность или посвящение жертвы, а тетраграмматон передан как личное имя «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господу; Иегове
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Передача термина שְׁלָמִים
  choice: мирная жертва
  alternative: жертва благополучия; жертва общения
  rationale: Термин допускает оттенки мира, целостности, благополучия и общения. Основной текст сохраняет укоренившееся русское наименование, а сноска предупреждает, что значение шире современного узкого понимания слова «мирный».
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой, подходящей для заголовочного предписания. Сохранён технический культовый термин, а его смысловой диапазон пояснён в сноске.
