  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: ru
  text: Жир павшего животного[a] и жир животного, растерзанного зверем, можно использовать для любых нужд, но есть его ни в коем случае нельзя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть животного, умершего без надлежащего заклания; возможный перевод: «животного, найденного мёртвым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: жир
  rationale: Обычное и понятное русское обозначение животного жира в контексте жертвенных постановлений и пищевых запретов.
- source_word: נְבֵלָה
  choice: павшее животное
  rationale: Передаёт животное, умершее без надлежащего заклания; слово «павшее» естественно для современного русского языка и не ограничивает причину смерти только естественной.
- source_word: טְרֵפָה
  choice: животное, растерзанное зверем
  rationale: Передаёт образ животного, разорванного хищником, и делает подразумеваемого деятеля ясным без изменения основного смысла.
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: можно использовать для любых нужд
  rationale: Нифаль выражает разрешённое практическое применение; такая формулировка естественно передаёт широкий круг непищевых способов использования.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: но есть его ни в коем случае нельзя
  rationale: Оборот с абсолютным инфинитивом усиливает запрет; «ни в коем случае нельзя» ясно сохраняет эту эмфазу.
theological_decisions: []
