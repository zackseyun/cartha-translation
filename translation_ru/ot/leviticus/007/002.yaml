base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: ru
  text: На месте, где закалывают жертву всесожжения, пусть закалывают и жертву повинности[a], а её кровью пусть обрызгает жертвенник со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также можно перевести: «жертву возмещения». Еврейский термин связан как с виной, так и с возмещением ущерба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: На том месте, где
  rationale: Естественно передаёт конкретное место совершения обряда и относительное אֲשֶׁר.
- source_word: יִשְׁחֲטוּ
  choice: закалывают / пусть заколют
  rationale: В контексте жертвоприношения שׁחט означает ритуальное заклание; «закалывать» точно и привычно для русского библейского языка.
- source_word: הָעֹלָה
  choice: жертва всесожжения
  rationale: Устоявшееся русское обозначение жертвы, полностью сжигаемой на жертвеннике.
- source_word: הָאָשָׁם
  choice: жертва повинности
  rationale: Сохраняет традиционное название данной жертвенной категории и связь אָשָׁם с виной; оттенок возмещения отмечен в сноске.
- source_word: דָּמוֹ
  choice: её кровью
  rationale: Местоимение относится к животному, принесённому как жертва повинности; женский род согласован с русским словом «жертва».
- source_word: יִזְרֹק
  choice: пусть обрызгают
  rationale: В жертвенном обряде זָרַק обозначает нанесение крови броском или выплескиванием; «обрызгать» точнее передаёт действие, чем способное подразумевать мелкие капли «окропить».
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: жертвенник со всех сторон
  rationale: Русская конструкция с «обрызгать» естественно передаёт нанесение крови на поверхности жертвенника по всей окружности.
theological_decisions:
- issue: Значение жертвенного термина אָשָׁם
  choice: жертва повинности
  alternative: жертва возмещения
  rationale: Основной вариант сохраняет узнаваемую жертвенную категорию и связь с виной, не сводя значение только к денежному или имущественному возмещению; восстановительный оттенок сохранён в сноске.
- issue: Смена числа у глаголов יִשְׁחֲטוּ и יִזְרֹק
  choice: 'Оба предписания переданы неопределённо-личными формами: «пусть заколют… пусть обрызгают»'
  alternative: «пусть заколют… а он пусть обрызгает»
  rationale: В еврейском тексте первый глагол стоит во множественном числе, а второй — в единственном, вероятно подразумевая священника. В русском явное «он» без названного предшествующего лица звучит неестественно; неопределённо-личная конструкция сохраняет процедурный смысл, не добавляя субъекта.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной жертвенной терминологией. Формулировка процедурная, ясная и пригодная для публичного чтения; архаизмы по возможности исключены.
