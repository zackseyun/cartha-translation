base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: ru
  text: Пусть он принесёт из всего этого по одному от каждого приношения как священный дар Господу[a]. Эта доля будет принадлежать священнику, который разбрызгивает[b] кровь мирных жертв[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «как отделённое приношение Господу». Еврейское слово обозначает долю, посвящённую Богу и назначенную священнику.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бросает» либо «кропит». Еврейский глагол описывает ритуальное нанесение крови броском или разбрызгиванием.'
    reason: lexical_alternative
  - marker: c
    text: «Мирные жертвы» можно также перевести как «жертвы общения» или «жертвы благополучия».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: пусть он принесёт
  rationale: Hiphil от קרב в жертвенном контексте означает «поднести, представить как приношение». «Принесёт» естественно звучит по-русски и сохраняет культовый контекст.
- source_word: מִמֶּנּוּ
  choice: из этого
  rationale: Местоименный суффикс единственного числа отсылает к описанному ранее комплексу приношений как к единому целому.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: по одному от каждого приношения
  rationale: 'Передаёт распределительное значение: по одной части или одному изделию от каждого из перечисленных видов, не добавляя в основной текст отсутствующее существительное.'
- source_word: תְּרוּמָה
  choice: священный дар
  rationale: Обозначает долю, отделённую для Бога и переданную священнику. Такое выражение понятно современному читателю и не навязывает спорную реконструкцию обряда поднятия.
- source_word: לַיהוָה
  choice: Господу
  rationale: Традиционное русское обозначение тетраграмматона в основном тексте; дательный падеж передаёт посвящение дара.
- source_word: הַזֹּרֵק
  choice: разбрызгивает
  rationale: זרק обозначает бросание или разбрызгивание крови в ходе обряда. Выбор сохраняет энергичный характер действия и не добавляет прямо не названный в стихе объект, например жертвенник.
- source_word: דַּם הַשְּׁלָמִים
  choice: кровь мирной жертвы
  rationale: «Мирная жертва» — узнаваемое русское название данного вида жертвоприношения; единственное число употреблено как название категории.
- source_word: לוֹ יִהְיֶה
  choice: будет принадлежать священнику
  rationale: Ясно передаёт древнееврейскую конструкцию принадлежности и законное право священника на отделённую долю.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует укоренившейся русской библейской практике и при этом не утверждает спорную реконструкцию произношения тетраграмматона.
- issue: Передача שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Традиционный термин сохраняет название самостоятельной жертвенной категории, не сводя её смысл только к общению или благополучию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности; повтор «этот дар» устраняет неясность местоименной отсылки. Технические культовые термины переданы доступно, а существенные лексические альтернативы сохранены в сносках.
