  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: ru
  text: и обе почки, и жир на них, у поясницы, и придаток печени[a], который он должен отделить вместе с почками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доля печени»; еврейское название этой части тела является специальным анатомическим термином, и его точное значение остаётся предметом споров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: обе почки
  rationale: В описании частей жертвенного животного כְּלָיוֹת однозначно обозначает почки; «обе» естественно передаёт парность и числительное «две».
- source_word: הַחֵלֶב
  choice: жир
  rationale: В жертвенных предписаниях חֵלֶב обозначает предназначенные для приношения жировые части; современное русское «жир» ясно и не сужает значение до конкретного вида жировой ткани.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: на них
  rationale: Предлог עַל прямо выражает расположение жира на почках; более пояснительное «покрывающий их» вносило бы отсутствующую в тексте конкретизацию.
- source_word: הַכְּסָלִים
  choice: у поясницы
  rationale: כְּסָלִים обозначает область поясницы или боков возле почек. Формулировка «у поясницы» сохраняет анатомическую локализацию и звучит естественно по-русски.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: придаток печени[a]
  rationale: יוֹתֶרֶת — специальный анатомический термин с не вполне установленным референтом. «Придаток печени» передаёт выступающую или прилегающую часть, не утверждая спорную точную идентификацию.
- source_word: עַל הַכְּלָיֹת
  choice: вместе с почками
  rationale: В данной жертвенной формуле выражение указывает, что названную часть печени отделяют совместно с почками; это естественнее по-русски, чем сугубо пространственное «у почек».
- source_word: יְסִירֶנָּה
  choice: пусть отделит
  rationale: Порода hifil глагола סור здесь обозначает ритуальное удаление части туши. Побудительная конструкция «пусть отделит» передаёт нормативный характер предписания, а местоименная связь сохранена относительным «который».
