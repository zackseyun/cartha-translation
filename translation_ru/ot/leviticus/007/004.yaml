translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Начальное «и» сохранено, поскольку стих продолжает перечень предыдущего стиха. Повтор союзов отражает структуру еврейского перечисления; конструкция с «который» сохраняет грамматическую связь глагола прежде всего с придатком печени, не устраняя напряжение между перечнем частей и заключительным указанием.
