  language: ru
  text: А то, что останется от мяса[a] жертвы, на третий день должно быть сожжено в огне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плоти».'
    reason: 'Лексическая альтернатива: בָּשָׂר буквально может означать «плоть», хотя в контексте пищи по-русски естественнее «мясо».'
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: То же, что останется
  rationale: Сочетание союза с субстантивированным причастием обозначает оставшуюся часть и продолжает предписание предыдущего стиха; русский оборот естественно передаёт этот смысл.
- source_word: מִבְּשַׂר
  choice: от мяса
  rationale: В контексте жертвенной пищи בָּשָׂר естественно передаётся словом «мясо»; буквальное «плоть» сохранено в сноске как допустимая лексическая альтернатива.
- source_word: הַזָּבַח
  choice: жертвы
  rationale: זֶבַח здесь обозначает жертвенное животное или жертвоприношение; «жертва» кратко и точно соответствует культовому контексту.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Это прямой и обычный русский эквивалент еврейского временного выражения без внесения значения предельного срока.
- source_word: בָּאֵשׁ
  choice: в огне
  rationale: Сохраняет конкретный образ уничтожения посредством сожжения и прямо соответствует конструкции с предлогом בְּ.
- source_word: יִשָּׂרֵף
  choice: должно быть сожжено
  rationale: Пассивная форма и модальность предписания переданы русской конструкцией, подходящей для нормативного текста.
