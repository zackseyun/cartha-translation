  text: К благодарственной мирной жертве[a] пусть он принесёт своё приношение вместе с лепёшками из квасного хлеба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертве общения»; или: «жертве благополучия».'
    reason: Лексические альтернативы для технического жертвенного термина שְׁלָמִים.
lexical_decisions:
- source_word: עַל
  choice: вместе с
  rationale: В начале стиха предлог указывает на сопровождение или добавление к перечисленным ранее хлебным приношениям, а не на положение сверху.
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: лепёшки из квасного теста
  rationale: חַלּוֹת обозначает хлебы или лепёшки, а חָמֵץ — тесто, подвергшееся закваске. Формулировка естественна для современного русского языка и сохраняет ритуальное противопоставление пресным изделиям в предыдущем стихе.
- source_word: יַקְרִיב
  choice: пусть он принесёт
  rationale: Каузативная форма קרב в жертвенном контексте означает представить или принести Богу; «принесёт» ясно передаёт действие без тяжеловесной культовой лексики.
- source_word: קָרְבָּנוֹ
  choice: своё приношение
  rationale: קָרְבָּן — общее обозначение дара, приносимого Богу. «Приношение» сохраняет отличие этого существительного от названия самой жертвы.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  choice: при благодарственной мирной жертве
  rationale: Конструктивная цепочка обозначает мирную жертву, совершаемую как благодарственную. Русская атрибутивная конструкция передаёт это отношение естественно, не превращая благодарение в отдельный вид приношения.
- source_word: שְׁלָמָיו
  choice: мирной жертве
  rationale: שְׁלָמִים — техническое название класса жертв, связанное с миром, целостностью и совместной трапезой. Традиционное «мирная жертва» узнаваемо, а другие возможные смысловые акценты сохранены в сноске.
theological_decisions:
- issue: Передача технического термина שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Основной вариант сохраняет традиционную связь слова с миром и целостностью, но не исчерпывает всех оттенков древнееврейского термина; поэтому жизнеспособные альтернативы указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Избегаются архаичные «квасные хлебы» и специализированное «облатка»; синтаксис остаётся ясным для обычного читателя.
