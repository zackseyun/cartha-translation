  source_fidelity: 'Повторяющийся עַל в стихе выражает добавление/сопровождение: приношение хлеба приносится вместе с жертвой. Вариант «при благодарственной мирной жертве» может означать лишь обстоятельство времени или обряда («во время жертвы») и поэтому ослабляет это отношение. Конструкция «к ... жертве» ясно передаёт добавочное приношение. «Лепёшки из квасного хлеба» точнее передаёт חַלֹּת לֶחֶם חָמֵץ, где חָמֵץ характеризует хлеб, а не обязательно тесто как исходный материал.'
