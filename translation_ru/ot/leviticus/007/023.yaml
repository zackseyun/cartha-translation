  register: Современный литературный русский язык с достоинством законодательной речи. Буквальное «сынам Израиля» сохранено как значимый традиционный образ, а более идиоматичный вариант вынесен в сноску; לֵאמֹר передано естественным русским оформлением прямой речи.
