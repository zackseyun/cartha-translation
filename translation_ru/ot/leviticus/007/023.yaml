base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: ru
  text: 'Скажи сынам Израиля[a]: «Не ешьте никакого жира — ни вола, ни овцы, ни козы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «израильтянам». Буквально: «сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Скажи
  rationale: Пиэль, повелительное наклонение, 2-е лицо мужского рода единственного числа; естественно передаёт прямое повеление Моисею.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный образ еврейского выражения и его собирательное обозначение народа; более идиоматичный вариант дан в сноске.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современной русской речи стандартная формула введения последующих слов естественно передаётся пунктуацией, без тяжеловесного «говоря».
- source_word: כָּל חֵלֶב
  choice: никакого жира
  rationale: В отрицательной конструкции «никакого» естественно выражает полный охват כָּל; «жир» сохраняет широкое обозначение жировых частей животного.
- source_word: שׁוֹר
  choice: вола
  rationale: Передаёт единичное обозначение крупного рогатого животного в ряду домашних животных, не сужая значение до некастрированного самца.
- source_word: כֶשֶׂב
  choice: овцы
  rationale: Общее видовое обозначение животного из мелкого скота; не уточняет возраст или пол без основания в контексте.
- source_word: עֵז
  choice: козы
  rationale: Естественное родовое обозначение козы в перечне домашнего скота.
- source_word: לֹא תֹאכֵלוּ
  choice: Не ешьте
  rationale: Отрицательная форма с имперфектом выражает обязательный запрет; по-русски повелительная форма ясно и естественно передаёт его силу.
