review_pass:
  verdict: revise
  source_fidelity: 'Основная структура и юридико-жертвенная терминология переданы верно. Однако «она станет негодной для жертвоприношения» несколько смещает смысл פִּגּוּל: речь о статусе уже принесённой жертвы (или её мяса), признанной неприемлемой, а не о её пригодности для последующего жертвоприношения. Пассивная конструкция «будут есть» также менее точно воспроизводит усиленный пассив еврейского текста, чем «будет съедено».'
  naturalness: Текст в целом литературный и ясный. «Если на третий день всё же будет съедено мясо…» естественнее согласует условную конструкцию и сохраняет безлично-пассивный характер исходного выражения.
  terminology: «Мирная жертва», «не будет принята», «не зачтётся» и «понесёт свою вину» удачны. Для פִּגּוּל предпочтительно «будет считаться негодной» с поясняющей сноской, без добавления «для жертвоприношения».
  issues:
  - severity: medium
    issue: Уточнение «для жертвоприношения» при передаче פִּגּוּל
    rationale: Оно может создать впечатление, что жертва ещё только предназначается к принесению. В контексте уже принесённая жертва вследствие нарушения становится неприемлемой/негодной.
  - severity: low
    issue: Неопределённо-личное «будут есть»
    rationale: Еврейская форма является усиленным пассивом; безличное «будет съедено» точнее и лучше сочетается с условным запретом.
  revised_text: Но если на третий день всё же будет съедено мясо его мирной жертвы, жертва не будет принята и не зачтётся тому, кто её принёс. Она будет считаться негодной[a], и тот, кто будет есть её мясо, понесёт свою вину.
