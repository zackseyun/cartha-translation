  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: ru
  text: Но если на третий день всё же будет съедено мясо его мирной жертвы, жертва не будет принята и не зачтётся тому, кто её принёс. Она будет считаться негодной[a], и тот, кто будет есть её мясо, понесёт свою вину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово — специальный жертвенный термин, обозначающий жертву или её мясо, ставшие неприемлемыми; возможные переводы: «мерзость», «осквернённое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Передаёт условие и его противопоставление предшествующему предписанию.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: всё же будут есть
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагольное значение; «всё же» естественно выражает это усиление в русском условном предложении.
- source_word: מִבְּשַׂר זֶבַח שְׁלָמָיו
  choice: мясо его мирной жертвы
  rationale: «Мирная жертва» сохраняет традиционное название особого вида жертвы; конструкция с «мясо» естественно передаёт партитивное מן в русском контексте.
- source_word: לֹא יֵרָצֶה
  choice: жертва не будет принята
  rationale: В жертвенном контексте רצה обозначает принятие жертвы; явное «жертва» устраняет возможную неясность местоимения.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: не зачтётся тому
  rationale: Сохраняет оттенок учёта или вменения и звучит естественно в современном русском.
- source_word: פִּגּוּל
  choice: негодной для жертвоприношения
  rationale: 'Передаёт специальное культовое значение: жертва стала неприемлемой и осквернённой, не сводя слово лишь к эмоциональному «отвратительная».'
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: и тот, кто будет есть её мясо
  rationale: נפש в юридическом контексте означает человека; формулировка естественна и сохраняет единичный обобщённый референт.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: понесёт свою вину
  rationale: Близко передаёт устойчивое выражение «нести вину», не устраняя его возможного оттенка ответственности за наказание.
theological_decisions:
- issue: Название זֶבַח שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: «Мирная жертва» узнаваема, кратка и связана с семантическим полем целостности и мира, тогда как альтернативы подчёркивают лишь отдельные стороны данного вида жертвы.
- issue: Значение עון в выражении נשא עון
  choice: понесёт свою вину
  alternative: понесёт наказание за свою вину
  rationale: Основной текст сохраняет неоднозначность между несением самой вины и вытекающей из неё ответственностью, не добавляя явно не названного наказания.
- issue: Статус жертвы при вкушении на третий день
  choice: сама жертва не будет принята и не зачтётся принесшему её
  alternative: только съеденное на третий день мясо становится неприемлемым
  rationale: Синтаксис связывает непринятие с жертвой и её принесшим; перевод не сужает последствие до одной порции мяса.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Сохранены жертвенная терминология, условная структура и неоднозначность выражения о несении вины; архаизмы и конфессионально окрашенные уточнения не вводятся.
