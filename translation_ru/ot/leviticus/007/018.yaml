revisions:
- from: Но если мясо его мирной жертвы всё же будут есть на третий день, жертва не будет принята и не зачтётся тому, кто её принёс. Она станет негодной для жертвоприношения[a], и тот, кто будет есть её мясо, понесёт свою вину.
  to: Но если на третий день всё же будет съедено мясо его мирной жертвы, жертва не будет принята и не зачтётся тому, кто её принёс. Она будет считаться негодной[a], и тот, кто будет есть её мясо, понесёт свою вину.
  rationale: Исправлена передача פִּגּוּל, чтобы не приписывать тексту идею последующего использования жертвы в жертвоприношении; уточнена форма первого условия как пассивная. Смысл о непринятии, незачтении принесшему и несении вины сохранён.
