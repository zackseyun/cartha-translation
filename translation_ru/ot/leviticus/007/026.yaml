  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: ru
  text: И никакой крови не ешьте во всех местах, где вы живёте, — ни крови птиц, ни крови животных.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всех ваших местах проживания» или «во всех ваших поселениях».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально с еврейского: «для птицы и для животного»; по смыслу речь идёт о крови птиц и животных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל דָּם
  choice: И никакой крови
  rationale: Союз וְ связывает запрет с предыдущими предписаниями; כָּל при отрицании естественно передаётся по-русски как «никакой». דָּם прямо означает «кровь».
- source_word: לֹא תֹאכְלוּ
  choice: не ешьте
  rationale: Форма 2-го лица множественного числа в законодательном контексте выражает прямой запрет; современное «не ешьте» ясно передаёт его силу без архаизации.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: ни в одном из мест, где вы живёте
  rationale: מוֹשָׁב обозначает место проживания или поселение. При отрицательном сказуемом такая формулировка естественно выражает всеобщую территориальную применимость запрета.
- source_word: לָ/עוֹף וְ/לַ/בְּהֵמָה
  choice: ни крови птиц, ни крови животных
  rationale: Предлог לְ здесь указывает на категории существ, которым принадлежит или от которых происходит кровь. Повтор слова «кровь» проясняет связь, а конструкция «ни… ни…» естественна после отрицательного запрета. בְּהֵמָה передано широким «животные», без необоснованного сужения до домашнего скота.
theological_decisions:
- issue: Объём запрета на употребление крови
  choice: Запрещено употреблять любую кровь птиц и животных во всех местах проживания адресатов.
  alternative: 'Более буквально: «крови — у птицы и у животного» или «для птицы и для животного».'
  rationale: Еврейская конструкция естественно обозначает категории существ, чья кровь имеется в виду. Перевод не добавляет объяснений причины запрета и не переносит в стих позднейшие богословские выводы.
translation_notes:
  register: Современный литературный русский язык с ясной законодательной интонацией. Сохранён начальный союз, связывающий стих с контекстом; тяжеловесная буквальность устранена без изменения объёма запрета.
