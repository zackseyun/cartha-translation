base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: ru
  text: И всякое хлебное приношение, испечённое в печи, а также всякое, приготовленное в горшке[a] или на сковороде, принадлежит священнику, который приносит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские названия двух сосудов различаются; вероятно, первый обозначает более глубокую посуду, а второй — более плоскую жарочную поверхность.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В жертвенном законодательстве это слово обозначает приношение из муки или зерна, а не дар вообще. Традиционное русское «хлебное приношение» понятно в контексте и не ограничивает состав цельным зерном.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: испечённое в печи
  rationale: Пассивная форма глагола естественно передаётся причастием; «печь» соответствует древнему приспособлению без ненужной модернизации.
- source_word: נַעֲשָׂה
  choice: приготовленное
  rationale: Контекст требует значения приготовления пищи, однако способ приготовления глагол сам по себе не уточняет.
- source_word: מַרְחֶשֶׁת
  choice: глубокая сковорода
  rationale: Точный вид древней утвари не вполне известен, но этот сосуд, вероятно, отличался большей глубиной от מַחֲבַת; перевод сохраняет предполагаемое различие.
- source_word: מַחֲבַת
  choice: плоская сковорода
  rationale: Вероятно, речь идёт о более плоской жарочной поверхности или посуде; сочетание с предлогом «на» естественно передаёт конструкцию оригинала.
- source_word: הַמַּקְרִיב אֹתָהּ
  choice: который его приносит
  rationale: В жертвенном контексте Hiphil от קרב означает ритуально представить или принести приношение. «Приносит» звучит естественно и сохраняет культовый смысл.
- source_word: לוֹ תִהְיֶה
  choice: пусть принадлежит
  rationale: Конструкция выражает установленное законом право священника на приношение; «пусть принадлежит» сохраняет нормативную силу без архаичного оборота.
theological_decisions:
- issue: Получатель хлебного приношения
  choice: конкретный священник, совершающий приношение
  alternative: священство или священники вообще
  rationale: Единственное число и оборот הַמַּקְרִיב אֹתָהּ прямо связывают принадлежность с тем священником, который приносит данное приношение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным правовым оттенком. Синтаксический параллелизм еврейского текста сохранён; названия двух видов утвари переданы различно, но без специальной сноски, поскольку их вероятное различие выражено непосредственно в тексте.
