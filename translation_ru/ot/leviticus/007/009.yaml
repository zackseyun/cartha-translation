  - severity: medium
    issue: «И всё приготовленное»
    rationale: В оригинале второе «всякое» эллиптически продолжает категорию хлебного приношения. Русское «всё» может охватывать любую приготовленную пищу; повтор «всякое» сохраняет ограничение контекста.
