  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: ru
  text: Мясо его благодарственной мирной жертвы следует съесть в день её принесения; ничего от него нельзя оставлять до утра.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשַׂר
  choice: Мясо
  rationale: בשר в контексте жертвенного животного естественно означает мясо; русское «плоть» здесь звучало бы менее естественно.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  choice: жертвы его благодарственной мирной жертвы
  rationale: Сохраняется זבח как «жертва», а плотная конструкция понимается как мирная жертва благодарственного типа. Повтор «жертвы» отражает различие между жертвоприношением и названием категории, хотя по-русски несколько тяжеловесен.
- source_word: תּוֹדַת
  choice: благодарственной
  rationale: תודה указывает на благодарение и определяет разновидность мирной жертвы.
- source_word: שְׁלָמָיו
  choice: его ... мирной жертвы
  rationale: «Мирная жертва» — устойчивый и сравнительно нейтральный термин для שלמים; единственное число по-русски соответствует конкретному приношению в данном предписании.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: в день её принесения
  rationale: קרבן с суффиксом допускает буквальное «его приношения», но в русском местоимение естественно соотнести с жертвой; смысл действия выражен без предположения о личности приносящего.
- source_word: יֵאָכֵל
  choice: следует съесть
  rationale: Страдательная форма выражает обязательное предписание; безличная русская конструкция естественна и сохраняет нормативную силу.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: нельзя оставлять от него
  rationale: Передаёт запрет не оставлять никакой части мяса; «от него» грамматически относится к мясу.
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Прямой и естественный эквивалент временного выражения.
theological_decisions:
- issue: Передача названия категории שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения
  rationale: «Мирная жертва» сохраняет традиционный термин и не навязывает толкование обряда исключительно как общения.
- issue: Связь תּוֹדָה с שְׁלָמִים
  choice: благодарственная мирная жертва
  alternative: мирная жертва в благодарность
  rationale: Выбранное сочетание ясно обозначает благодарственную разновидность мирной жертвы, не устраняя семантики благодарения.
translation_notes:
  register: Современный литературный русский с сохранением жертвенной терминологии. Формулировка намеренно близка к структуре еврейского текста; нормативность передана естественными русскими конструкциями «следует» и «нельзя».
