  source_fidelity: Сочетание זֶבַח תּוֹדַת שְׁלָמָיו обозначает мясо жертвы, относящейся к благодарственной разновидности мирной жертвы. В исходном русском тексте это передано с неоправданным повтором «жертвы», который может создать впечатление двух жертв. Исправленный вариант передаёт одну благодарственную мирную жертву. בְּיוֹם קָרְבָּנוֹ естественно передано как «в день её принесения»; запрет относится к тому, чтобы никакая часть мяса не оставалась до утра.
  naturalness: «Мясо его благодарственной мирной жертвы» — естественная современная литературная формулировка с сохранением установленного жертвенного термина. «Ничего от него нельзя оставлять» яснее и нормативно точнее, чем «нельзя оставлять от него».
  terminology: «Мирная жертва» сохраняет нейтральную терминологическую преемственность для שְׁלָמִים; «благодарственная» передаёт תּוֹדָה как характеристику этой разновидности. «Мясо» уместно для בשר в данном ритуальном контексте.
