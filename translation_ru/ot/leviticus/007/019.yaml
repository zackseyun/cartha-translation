base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: ru
  text: Но мясо, которое прикоснётся к чему-либо нечистому[a], нельзя есть; его следует сжечь в огне. А мясо может есть всякий, кто чист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть к чему-либо ритуально нечистому; еврейское выражение имеет широкое значение.
    reason: Поясняет культовое значение «нечистого» и сохраняет широту כָּל טָמֵא, не ограничивая его конкретным предметом.
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: Но мясо
  rationale: בָּשָׂר в контексте жертвы означает предназначенное в пищу жертвенное мясо. Союз וְ передан как «но», поскольку предложение противопоставляет осквернённое мясо мясу, разрешённому для употребления.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: которое прикоснётся к чему-либо нечистому
  rationale: Глагол נגע обозначает соприкосновение, а כָּל טָמֵא широко охватывает всё ритуально нечистое, не уточняя предмет или источник нечистоты.
- source_word: לֹא יֵאָכֵל
  choice: нельзя есть
  rationale: Страдательная форма с отрицанием выражает юридический запрет; безличная русская конструкция естественна и сохраняет его силу.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: его следует сжечь в огне
  rationale: Страдательная форма сообщает предписанный способ уничтожения; «в огне» непосредственно и естественно передаёт בָּאֵשׁ.
- source_word: וְהַבָּשָׂר
  choice: А это мясо
  rationale: 'Повтор существительного возвращает речь к жертвенному мясу и вводит противопоставление: если оно не осквернено, его могут есть ритуально чистые.'
- source_word: כָּל טָהוֹר
  choice: всякий, кто чист
  rationale: Прилагательное употреблено субстантивно и обозначает любого человека, находящегося в состоянии ритуальной чистоты.
- source_word: יֹאכַל בָּשָׂר
  choice: может есть
  rationale: В контексте форма выражает разрешение, а не обязанность. Дополнение по-русски естественно отнесено к уже названному «этому мясу», что избегает тяжеловесного повтора.
theological_decisions:
- issue: Значение טָמֵא и טָהוֹר в законе о жертвах
  choice: «нечистому» и «чист» как обозначения ритуального состояния
  alternative: «осквернённому» и «чист» либо «нечистому» и «ритуально чист»
  rationale: В данном контексте слова прежде всего обозначают установленный законом ритуальный статус, а не нравственную порочность или безгрешность. Основной текст сохраняет традиционные краткие термины, а сноска поясняет их область значения.
translation_notes:
  register: Современный литературный русский язык с ясным правовым оттенком. Сохранён повтор слова «мясо», значимый для структуры еврейского текста, но заключительное дополнение не повторено ради естественности русской фразы.
