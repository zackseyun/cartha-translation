  source_fidelity: 'Текст верно передаёт исключительный характер אַךְ («Однако»), пару מַעְיָן / בּוֹר («источник или водосборный колодец»), статус ритуальной чистоты и последствие прикосновения к туше/мёртвому телу животных. «Останется чистым» — допустимое контекстуальное раскрытие יִהְיֶה טָהוֹר: в предыдущем стихе речь идёт об осквернении предметов падением трупа. Единственное число «трупу» при множественном суффиксе в «их» удачно сохраняет собирательный характер נִבְלָתָם.'
