base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: ru
  text: Однако источник или водосборный колодец[a] останется чистым; но тот, кто прикоснётся к их трупу, станет нечистым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «источник или колодец — скопление воды». Еврейское выражение מִקְוֵה מַיִם может также передаваться как «собрание воды» или «водоём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Однако
  rationale: Союз отмечает исключение из изложенного перед этим правила о нечистоте; «однако» ясно передаёт противопоставление без ограничительного оттенка слова «только».
- source_word: מַעְיָן
  choice: источник
  rationale: Обозначает естественный источник воды; это обычный и точный современный русский эквивалент.
- source_word: בּוֹר
  choice: водосборный колодец
  rationale: В данном контексте речь идёт об искусственном углублении или вместилище для накопления воды. Определение «водосборный» отличает его от колодца, питаемого подземными водами.
- source_word: מִקְוֵה מַיִם
  choice: водосборный
  rationale: Буквально выражение означает «скопление/собрание воды» и характеризует место, где вода собирается. В основном тексте смысл передан естественным русским определением, а буквальная конструкция сохранена в примечании.
- source_word: יִהְיֶה טָהוֹר
  choice: останется чистым
  rationale: Формально — «будет чистым»; в контексте это исключение означает, что источник воды не становится нечистым по правилу предыдущего стиха, поэтому «останется» естественно выражает подразумеваемую непрерывность состояния.
- source_word: נֹגֵעַ
  choice: тот, кто прикоснётся
  rationale: Причастие употреблено субстантивно и обобщённо; эта конструкция естественна по-русски и сохраняет общее применение предписания.
- source_word: נִבְלָתָם
  choice: их трупу
  rationale: Существительное обозначает мёртвое тело животного и стоит в единственном числе с местоименным суффиксом множественного числа; перевод сохраняет это собирательное согласование.
- source_word: יִטְמָא
  choice: станет нечистым
  rationale: Глагол обозначает приобретение состояния ритуальной нечистоты; «станет нечистым» ясно передаёт наступивший результат.
theological_decisions:
- issue: Терминология ритуальной чистоты
  choice: чистый / нечистый
  alternative: чист / осквернён; ритуально чистый / ритуально нечистый
  rationale: В Левите речь идёт о культово-ритуальном статусе, а не обязательно о нравственной оценке. Традиционная и понятная пара «чистый / нечистый» сохраняет эту категорию без внесения дополнительных толкований.
- issue: Сохранение чистоты водного источника
  choice: останется чистым
  alternative: будет чистым
  rationale: Контекст подразумевает, что названное вместилище воды представляет исключение и не приобретает нечистоты; «останется» делает эту связь явной, не меняя ритуального смысла.
translation_notes:
  register: Современный литературный русский язык с традиционной, но общепонятной лексикой ритуальной чистоты. Синтаксис сделан плавным, при этом сохранены противопоставление, собирательное единственное число слова «труп» и лексическая неоднозначность выражения מִקְוֵה מַיִם в примечании.
