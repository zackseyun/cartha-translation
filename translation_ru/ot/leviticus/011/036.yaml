  terminology: Пара «чистый / нечистый» последовательно передаёт ритуальную терминологию טָהוֹר / טָמֵא, не превращая её в моральную оценку. «Источник» для מַעְיָן и «труп» для נְבֵלָה приемлемы; примечание корректно отмечает буквальную конструкцию и возможные передачи מִקְוֵה מַיִם.
