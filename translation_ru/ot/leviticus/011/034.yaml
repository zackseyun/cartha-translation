  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: ru
  text: Всякая пища, которую можно есть[a], если на неё попадёт вода, станет нечистой; и всякий напиток, пригодный для питья, в любом сосуде станет нечистым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «которую едят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: всякая пища
  rationale: Сочетание מִן с כָּל в данном контексте обозначает любой предмет из общего разряда пищи. «Всякая пища» естественно передаёт обобщающий характер предписания.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: которую можно есть
  rationale: 'Нифаль имперфекта допускает квалифицирующий смысл: пища, предназначенная или пригодная для еды. Формулировка сохраняет эту модальность; более буквальный вариант отмечен в сноске.'
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: если на неё попадёт вода
  rationale: 'Буквально: «на которую придёт вода». Условная конструкция естественна для русского законодательного контекста и не добавляет указания на действующее лицо.'
- source_word: יִטְמָא
  choice: станет нечистой / станет нечистым
  rationale: Глагол обозначает переход в состояние ритуальной нечистоты; «станет нечистым» точнее передаёт результативность, чем простое «будет нечистым».
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: напиток, пригодный для питья
  rationale: מַשְׁקֶה — то, что пьют, а Нифаль имперфекта в относительном обороте квалифицирует напиток как предназначенный или пригодный для питья. Русская формулировка избегает тяжеловесного «который можно пить» рядом с первым оборотом.
- source_word: בְּכָל כְּלִי
  choice: в любом сосуде
  rationale: כְּלִי здесь имеет широкое значение сосуда или ёмкости. «Сосуд» соответствует лексике ритуально-правового контекста, а «в любом» передаёт распределительное значение כָּל.
theological_decisions:
- issue: Характер нечистоты
  choice: нечистый
  alternative: осквернённый; ритуально нечистый
  rationale: Текст говорит о культово-ритуальном статусе, но добавление слова «ритуально» в основной текст было бы пояснением. Традиционное и понятное «нечистый» сохраняет терминологическую связь с контекстом Левита.
translation_notes:
  register: Современный литературный русский с ясной правовой формулировкой. Сохранён параллелизм пищи и напитка, а также переход в состояние нечистоты. Условный оборот с водой передаёт функцию еврейского относительного предложения естественно для русского языка.
