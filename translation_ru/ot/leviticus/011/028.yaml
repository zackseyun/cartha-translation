  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: ru
  text: Кто несёт их тушу, должен выстирать свою одежду и будет нечист до вечера[a]. Они нечисты для вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их туши». Древнееврейское выражение можно понимать распределительно — как относящееся к туше каждого из упомянутых животных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: Кто понесёт
  rationale: 'Субстантивированное причастие с артиклем выражает общее правило: «тот, кто несёт». В русском законодательном контексте естественно звучит «кто понесёт».'
- source_word: נִבְלָתָם
  choice: их тушу
  rationale: נְבֵלָה обозначает мёртвое тело животного, то есть тушу. Единственное число сохранено, а множественный суффикс «их» относится к животным из предшествующего контекста; возможное распределительное понимание отмечено в сноске.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Имперфект в правовом предписании имеет обязательную силу. «Должен выстирать» ясно передаёт предписание, а «свою одежду» естественно соотносит בְּגָדָיו с действующим лицом.
- source_word: וְטָמֵא
  choice: и будет нечист
  rationale: Форма описывает наступающий вследствие прикосновения ритуальный статус. Будущее время естественно передаёт результат действия.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Это устойчивое и естественное русское соответствие временного предела; наличие артикля в древнееврейском не требует неестественного «до этого вечера».
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: Они нечисты для вас
  rationale: Формулировка сохраняет множественное число и местоименную отсылку к обсуждаемым животным, а также передаёт לָכֶם без избыточного толкования.
theological_decisions:
- issue: Терминология ритуальной нечистоты
  choice: нечист / нечисты
  alternative: осквернён / ритуально нечист
  rationale: טמא здесь обозначает установленный законом ритуальный статус, а не обязательно нравственную вину. Традиционный и понятный термин «нечист» сохраняет эту категорию и лексическую последовательность.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Сохранены краткость, повтор ключевого термина «нечист» и неоднозначность числа у נִבְלָתָם; тяжеловесные архаизмы не использованы.
