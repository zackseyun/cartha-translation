source:
  edition: WLC
  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: ru
  text: Тот, кто съест что-либо от её туши[a], должен выстирать свою одежду и будет нечистым[b] до вечера. Тот, кто понесёт её тушу, должен выстирать свою одежду и будет нечистым до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от её туши»; еврейское выражение имеет партитивный смысл, то есть указывает на некоторую часть туши.'
    reason: lexical_alternative
  - marker: b
    text: То есть нечистым согласно законам Израиля о ритуальной чистоте.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: тот, кто съест
  rationale: Субстантивированное причастие обозначает любого человека, совершающего это действие. Такая передача естественна для современного русского языка и сохраняет обобщённо-правовой характер формулировки.
- source_word: מִנִּבְלָתָהּ
  choice: что-либо от её туши
  rationale: 'Предлог מִן имеет здесь партитивный смысл: речь идёт о поедании некоторой части туши. Формулировка сохраняет этот смысл, не определяя размер или количество съеденного.'
- source_word: נִבְלָתָהּ
  choice: её туша
  rationale: В данном постановлении נְבֵלָה обозначает мёртвое тело животного; «туша» точнее контекстуальных вариантов «тело» или «труп».
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Имперфект в законодательном контексте выражает предписание. «Должен» ясно передаёт обязательность, а «свою одежду» звучит естественно и сохраняет единственное число.
- source_word: וְטָמֵא
  choice: и останется нечистым
  rationale: Форма описывает сохраняющийся до вечера статус нечистоты. «Останется» естественно связывает омовение одежды с последующим периодом нечистоты, не добавляя в основной текст определения «ритуально».
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Обычная русская формула точно передаёт временной предел и не требует неестественного воспроизведения еврейского артикля.
- source_word: הַנֹּשֵׂא
  choice: тот, кто понесёт
  rationale: Субстантивированное причастие имеет обобщённое значение и образует параллель с «тот, кто съест».
- source_word: אֶת נִבְלָתָהּ
  choice: её тушу
  rationale: Прямое дополнение с местоименным суффиксом естественно и точно передаётся как «её тушу».
theological_decisions:
- issue: Характер нечистоты
  choice: В основном тексте употреблено «нечистым» без поясняющего определения.
  alternative: «ритуально нечистым»
  rationale: Контекст законов о чистоте указывает на ритуально-культовый статус, однако слова «ритуально» в еврейском тексте нет. Пояснение вынесено в сноску, чтобы не расширять основной текст.
- issue: Род и число в правовой формуле
  choice: Сохранена единичная конструкция «тот, кто… свою одежду».
  alternative: Множественная или явно гендерно-нейтральная формулировка
  rationale: Еврейский текст использует мужской род единственного числа в обобщённо-правовом значении. Русская конструкция «тот, кто» сохраняет это число и юридическую форму, не ограничивая предписание конкретным лицом.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным тоном правового предписания. Повторение второй формулы сохранено ради параллелизма оригинала; архаизмы и конфессионально окрашенные термины не использованы.
