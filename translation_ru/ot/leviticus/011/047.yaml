  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: ru
  text: чтобы отличать нечистое от чистого и животное, которое можно есть, от животного, которое есть нельзя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «животное, которое едят, — от животного, которое не едят».'
    reason: Еврейская форма допускает более буквальное описание того, что едят или не едят, хотя в законодательном контексте подразумеваются разрешение и запрет.
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: чтобы отличать
  rationale: Инфинитив указывает на цель, связанную с предшествующим контекстом; «отличать» естественно передаёт требуемое законом распознавание категорий.
- source_word: בֵּין ... וּבֵין
  choice: от ... и ... от
  rationale: Русская конструкция «отличать одно от другого» естественно передаёт обе параллельные пары противопоставлений.
- source_word: הַטָּמֵא ... הַטָּהֹר
  choice: нечистое ... чистого
  rationale: Слова сохранены как установленные законом категории ритуальной чистоты, без придания им значения нравственного зла или добра.
- source_word: הַחַיָּה
  choice: животное
  rationale: В данном сводном положении слово обозначает животное вообще; этот вариант понятен современному читателю и не сужает значение до диких зверей.
- source_word: הַנֶּאֱכֶלֶת
  choice: которое можно есть
  rationale: Страдательное причастие в контексте пищевых предписаний выражает разрешённость употребления в пищу, а не только физическую съедобность.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: которое есть нельзя
  rationale: Формулировка ясно и естественно передаёт запрет, сохраняя противопоставление разрешённому животному.
theological_decisions:
- issue: Категории ритуальной чистоты в законе Левита
  choice: «нечистое» и «чистое»
  alternative: «осквернённое» и «чистое»; «нечистое» и «очищенное»
  rationale: Еврейские определения обозначают культово-правовые категории. Выбранная пара не превращает ритуальную классификацию в утверждение о внутренней нравственности животных.
- issue: Характер различия между животными
  choice: «можно есть» и «есть нельзя»
  alternative: «съедобное» и «несъедобное»
  rationale: Контекст говорит прежде всего о дозволенности и запрете по закону, а не о физической пригодности животного в пищу.
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет лаконичность заключительного целевого оборота и параллелизм двух различий.
