  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: ru
  text: 'И дамана[a]: ибо он жуёт жвачку, но копыто не раздваивает; он нечист для вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское название обычно относят к скалистому (капскому) даману.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: дамана
  rationale: Еврейское שָׁפָן обычно обозначает небольшое живущее среди скал животное, отождествляемое с даманом. «Даман» — современное и зоологически точное русское название.
- source_word: כִּי
  choice: хотя
  rationale: В составе всего обоснования частица вводит первый признак, который сам по себе допускал бы животное в пищу, но затем противопоставляется отсутствию раздвоенного копыта. Русское «хотя…» естественно передаёт эту уступительно-причинную связь.
- source_word: מַעֲלֵה גֵרָה
  choice: жуёт жвачку
  rationale: Устойчивый русский эквивалент древнееврейского выражения, буквально означающего «поднимает жвачку»; сохраняет терминологию пищевых предписаний.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: копыта у него не раздвоены
  rationale: Естественно передаёт отсутствие разделённого копыта, сохраняя категорию, по которой животные классифицируются в контексте главы.
- source_word: טָמֵא
  choice: нечист
  rationale: В контексте Левита это установленный статус ритуальной нечистоты, а не характеристика нравственного зла.
- source_word: לָכֶם
  choice: для вас
  rationale: Сохраняет прямое указание на то, что данный статус относится к общине, к которой обращён закон.
theological_decisions:
- issue: Характер нечистоты, обозначенной словом טָמֵא
  choice: ритуально-правовой статус, переданный словом «нечист»
  alternative: нравственно порочный или внутренне скверный
  rationale: В пищевых предписаниях Левита 11 термин обозначает ритуальную классификацию. Перевод не приписывает животному нравственного качества.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Инверсия «нечист он для вас» сохраняет выразительность заключительной правовой формулы; двоеточие и точка с запятой ясно показывают ход обоснования.
