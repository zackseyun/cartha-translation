  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: ru
  text: Не делайте себя мерзкими из-за каких бы то ни было кишащих существ[a] и не делайте себя нечистыми через них, чтобы не стать нечистыми через них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какими бы то ни было ползающими существами». Еврейское выражение обозначает более широкую категорию существ, которые кишат или снуют; перевод «кишащие существа» не ограничивает её только ползающими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: делайте себя мерзкими
  rationale: Передаёт значение корня שׁקץ — «быть мерзким, отвратительным» — и сохраняет отличие от терминов корня טמא далее в стихе.
- source_word: נַפְשֹׁתֵיכֶם
  choice: себя
  rationale: В этой возвратной конструкции נפש обозначает самого человека, а не отдельно понимаемую «душу»; по-русски естественно «себя».
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: никакими кишащими существами
  rationale: Форма с «никакими» естественно зависит от отрицания; «кишащие существа» передаёт широкую категорию мелких существ и отзвук еврейского корня שׁרץ, не сужая её только до ползающих.
- source_word: תִטַּמְּאוּ
  choice: не делайте себя нечистыми
  rationale: Возвратное значение формы передано явно, а термин «нечистыми» сохраняет лексику ритуальной нечистоты книги Левит.
- source_word: בָּהֶם
  choice: через них
  rationale: Предлог указывает на средство или посредство, посредством которого человек становится нечистым.
- source_word: וְנִטְמֵתֶם
  choice: чтобы не стать нечистыми
  rationale: После двух запретов заключительная форма естественно передаётся как предостережение о результате; формулировка сохраняет повтор корня טמא.
- source_word: בָּם
  choice: из-за них
  rationale: Передаёт причинно-инструментальную связь с упомянутыми существами и позволяет избежать тяжёлого дословного повтора предлога.
theological_decisions:
- issue: Терминология ритуальной нечистоты в законах о святости
  choice: нечистыми
  alternative: осквернёнными; ритуально нечистыми
  rationale: «Нечистыми» — понятный и устойчивый эквивалент טמא, сохраняющий категорию ритуальной нечистоты и не добавляющий утверждения о нравственной вине.
- issue: Связь заключительной формы וְנִטְמֵתֶם с предшествующими запретами
  choice: чтобы не стать нечистыми
  alternative: и станете нечистыми; иначе станете нечистыми
  rationale: Еврейское соединение допускает оттенок результата или предостережения. В контексте запретов отрицательная целе-результативная формулировка наиболее естественна по-русски, не превращая нечистоту в отдельное нравственное осуждение.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранены повтор слова «нечистыми» и смысловое различие между שׁקץ («мерзкими») и טמא («нечистыми»); еврейская корневая фигура שׁרץ передана настолько, насколько это естественно по-русски.
