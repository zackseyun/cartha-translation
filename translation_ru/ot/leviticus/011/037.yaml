lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: В контексте казуистического закона сочетание вводит условие; отдельное «и» по-русски необязательно и утяжеляло бы фразу.
- source_word: יִפֹּל
  choice: упадёт
  rationale: Имперфект в условной правовой формулировке естественно передаётся русским будущим временем.
- source_word: מִנִּבְלָתָם
  choice: что-либо от их трупов
  rationale: Предлог מִן передаёт партитивное значение («что-либо от»), а נְבֵלָה здесь обозначает мёртвое тело животного; множественное «трупов» естественно соотносится с суффиксом 3-го лица множественного числа.
- source_word: עַל כָּל
  choice: на зерно
  rationale: В условной конструкции כָּל имеет обобщающе-дистрибутивный смысл; по-русски неопределённость достаточно выражена самим условием, без тяжеловесного «на любое».
- source_word: זֶרַע זֵרוּעַ אֲשֶׁר יִזָּרֵעַ
  choice: зерно, предназначенное для посева
  rationale: 'Формулировка естественно передаёт однокоренное сочетание и перспективный смысл относительного придаточного: речь идёт о зерне, которое будут сеять.'
- source_word: טָהוֹר הוּא
  choice: оно чисто
  rationale: «Чисто» сохраняет терминологию законов о ритуальной чистоте; «остаётся чистым» было бы более истолковывающим переводом.
