  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: ru
  text: 'Не ешьте их мяса и не прикасайтесь к их тушам[a]: они нечисты для вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к их мёртвым телам». Еврейское слово обозначает тушу мёртвого животного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: их мяса
  rationale: 'Предлог מִן при слове «плоть, мясо» имеет здесь партитивное значение: запрещается есть мясо этих животных. По-русски «не ешьте их мяса» естественно передаёт и значение, и юридическую силу выражения.'
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Отрицание с имперфектом в законодательном контексте выражает прямой запрет; современная русская форма повелительного наклонения ясна и достаточно категорична.
- source_word: וּבְנִבְלָתָם
  choice: к их трупам
  rationale: נְבֵלָה обозначает мёртвое тело, падаль или тушу животного. «Трупы» точно передаёт телесную смерть животных и естественно сочетается с запретом прикасаться; возможный оттенок «падаль» отмечен в сноске.
- source_word: לֹא תִגָּעוּ
  choice: не прикасайтесь
  rationale: Глагол נגע означает «касаться, входить в соприкосновение». «Не прикасайтесь» прямо передаёт запрет без добавочного толкования его ритуальных последствий.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: они нечисты для вас
  rationale: «Нечисты» сохраняет установленную категорию ритуальной нечистоты в книге Левит, а «для вас» передаёт относительное לָכֶם, не превращая его в моральную оценку.
theological_decisions:
- issue: Характер нечистоты в законах о пище
  choice: нечисты
  alternative: ритуально нечисты / осквернены
  rationale: Текст называет животных нечистыми в системе законов Израиля о чистоте. Перевод сохраняет эту категорию, не добавляя слова «ритуально» в основной текст и не делая выводов о моральном зле или дальнейшем применении закона.
translation_notes:
  register: Современный литературный русский язык с краткой, ясной формой законодательного запрета. Синтаксис близок к еврейскому оригиналу, но не архаичен; двоеточие естественно выражает основание запрета.
