lexical_decisions:
- source_word: חֲסִידָה
  choice: аист
  rationale: Традиционное и наиболее широко признанное соответствие; в данном перечне слово служит названием птицы.
- source_word: אֲנָפָה
  choice: цапля
  rationale: Точная зоологическая идентификация не вполне достоверна, но «цапля» — наиболее вероятное и общепринятое современное соответствие.
- source_word: לְמִינָהּ
  choice: по роду её
  rationale: Сохраняет классификационный смысл еврейского выражения и его отнесённость к предыдущему названию птицы.
- source_word: דּוּכִיפַת
  choice: удод
  rationale: Современные лексикографические и зоологические данные убедительнее поддерживают значение «удод», а не традиционное в некоторых переводах «чибис».
- source_word: עֲטַלֵּף
  choice: летучая мышь
  rationale: Надёжно установленное значение; сохраняется древняя феноменологическая группировка среди летающих существ без привнесения современной таксономии.
- source_word: וְאֵת / וְאֶת
  choice: и
  rationale: Союз передаётся по-русски, тогда как непереводимый показатель прямого дополнения отдельно не выражается.
