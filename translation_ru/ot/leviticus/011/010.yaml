base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: ru
  text: Но всё, у чего нет плавников и чешуи, в морях и водных потоках[a], среди всех водных кишащихся существ и всех живых существ, обитающих в воде, — для вас мерзость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «реках», «ручьях» либо «вади»; еврейское слово широко обозначает водные потоки и русла.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для вас отвратительны». Здесь еврейское существительное обозначает то, что считается ритуально отвратительным и недопустимым в контексте пищевых предписаний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Но всё
  rationale: Союз וְ в контексте вводит противопоставление разрешённым водным животным из предыдущего стиха; «всё» сохраняет всеохватность כֹל.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: у чего нет
  rationale: Естественно передаёт относительную конструкцию, обозначающую отсутствие требуемых признаков.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: плавников и чешуи
  rationale: Сохраняет оба совокупно требуемых анатомических признака; форма множественного числа у «плавников» естественна по-русски.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: в морях и водных потоках
  rationale: '«Моря» прямо передаёт יַמִּים, а «водные потоки» достаточно широко охватывает значение נְחָלִים: реки, ручьи и сезонные русла с текущей водой.'
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: из всех кишащих в воде существ
  rationale: «Кишащих» сохраняет образ множащихся или снующих водных существ в שֶׁרֶץ; «из всех» передаёт разделительное מִן.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: и из всех живых существ
  rationale: Естественно передаёт широкое обозначение одушевлённой жизни נֶפֶשׁ הַחַיָּה, не сужая его до человека и не вводя здесь слово «душа».
- source_word: אֲשֶׁר בַּמָּיִם
  choice: обитающих в воде
  rationale: Идиоматично выражает нахождение живых существ в водной среде.
- source_word: שֶׁקֶץ
  choice: мерзость
  rationale: Передаёт сильную ритуально-правовую оценку существ как отвратительных и недопустимых для пищи; альтернативное «нечто отвратительное» отмечено в сноске.
- source_word: הֵם לָכֶם
  choice: для вас мерзость
  rationale: Сохраняет именную конструкцию и адресованность Израилю без добавления явно будущего значения.
theological_decisions:
- issue: Термин ритуального статуса в законах о пище
  choice: для вас мерзость
  alternative: для вас отвратительны
  rationale: שֶׁקֶץ обозначает в данном контексте сильное ритуальное отвращение и запретность, а не непременно универсальную нравственную оценку самих животных. «Мерзость» сохраняет силу существительного и юридическую категоричность текста.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной формулировкой. Тире разграничивают две охватываемые категории водных существ и итоговую правовую оценку. Все маркеры сносок помещены непосредственно после соответствующих выражений.
