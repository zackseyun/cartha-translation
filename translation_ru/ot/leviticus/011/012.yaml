id: LEV.11.12
reference: Leviticus 11:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: ru
  text: Всё, что в воде не имеет плавников и чешуи, — мерзость для вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечто отвратительное для вас». Древнееврейское שֶׁקֶץ здесь обозначает то, что считается ритуально отвратительным и недопустимым в пищу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Всё
  rationale: Передаёт всеобъемлющий характер категории и естественно звучит по-русски.
- source_word: אֲשֶׁר
  choice: что
  rationale: Естественно вводит относительное придаточное, определяющее данную категорию.
- source_word: אֵין לוֹ
  choice: не имеет
  rationale: Идиоматично передаёт древнееврейскую отрицательную конструкцию обладания.
- source_word: סְנַפִּיר
  choice: плавников
  rationale: Хотя в древнееврейском употреблено единственное число с собирательным значением, в русском описании водных существ естественно множественное число.
- source_word: קַשְׂקֶשֶׂת
  choice: чешуи
  rationale: Русское собирательное существительное «чешуя» естественно передаёт родовой признак водных существ.
- source_word: בַּמָּיִם
  choice: в воде
  rationale: Древнееврейское מַיִם имеет форму множественного числа, но обычно соответствует русскому неисчисляемому «вода»; здесь сохраняется локативное значение.
- source_word: שֶׁקֶץ
  choice: мерзость
  rationale: Сильное оценочное существительное передаёт ритуально отвратительное и недопустимое в контексте пищевых предписаний, сохраняя именную форму исходного сказуемого.
- source_word: הוּא
  choice: —
  rationale: Самостоятельное местоимение поддерживает именное сказуемое; в русском настоящего времени эта связь естественно выражена тире без явной связки.
- source_word: לָכֶם
  choice: для вас
  rationale: Передаёт направленность установления на адресатов — Израиль — и естественно сочетается с русским существительным «мерзость».
theological_decisions:
- issue: Передача שֶׁקֶץ в контексте пищевых предписаний
  choice: мерзость
  alternative: нечто отвратительное; скверна
  rationale: «Мерзость» сохраняет сильную оценочную и ритуальную окраску слова, не смешивая его с более общей терминологией нечистоты. Сноска поясняет контекстуальный оттенок, не сводя значение исключительно к эмоциональному отвращению.
translation_notes:
  register: Современный литературный русский язык; краткая законодательная формулировка с сохранением именного сказуемого и сильной оценки исходного текста.
