source:
  edition: WLC
  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֣ל אֲשֶׁר ל/וֹ֩ סְנַפִּ֨יר וְ/קַשְׂקֶ֜שֶׂת בַּ/מַּ֗יִם בַּ/יַּמִּ֛ים וּ/בַ/נְּחָלִ֖ים אֹתָ֥/ם תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: ru
  text: Из всего, что есть в воде, вы можете есть всякое существо, имеющее плавники и чешую и обитающее в воде, в морях и потоках[a]. Такое вы можете есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «реках». Еврейское слово נְחָלִים может обозначать потоки, речные русла или сезонные водотоки.'
    reason: Лексический диапазон слова допускает несколько близких обозначений внутренних водотоков.
lexical_decisions:
- source_word: אֶת זֶה
  choice: вот кого / тех
  rationale: В контексте перечисления водных существ указательное выражение вводит разрешённую категорию. По-русски естественно передать его через конструкцию «можете есть тех», не сохраняя формально единственное число.
- source_word: תֹּאכְלוּ
  choice: можете есть
  rationale: Имперфект 2-го лица множественного числа в данном законодательном контексте выражает разрешение, а не предписание обязательно употреблять этих животных в пищу.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: из всего, что обитает в воде
  rationale: «Из всего» сохраняет партитивное значение מִן, а «обитает в воде» ясно и естественно обозначает водных существ.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: плавники и чешуя
  rationale: Оба существительных употреблены как собирательные обозначения признаков вида; в современном русском нормативны «плавники» и собирательное «чешуя».
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: в морях и потоках
  rationale: «Моря» непосредственно передаёт יַמִּים, а «потоки» сохраняет широту נְחָלִים, способного обозначать текущий водный поток или русло.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: Их вы можете есть
  rationale: Отдельное заключительное предложение сохраняет возобновление объекта и эмфатический повтор разрешения в еврейском тексте.
theological_decisions:
- issue: Модальность пищевого постановления
  choice: можете есть
  alternative: ешьте / будете есть
  rationale: Контекст противопоставляет разрешённых и запрещённых животных; разрешительная формулировка не превращает дозволение в обязанность.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис упрощён ради естественности, при этом сохранены партитивная конструкция, признаки разрешённых водных существ и заключительный эмфатический повтор.
