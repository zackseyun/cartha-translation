revisions:
- from: Из всего, что обитает в воде — в морях и потоках[a], — вы можете есть тех, у кого есть плавники и чешуя. Их вы можете есть.
  to: Из всего, что есть в воде, вы можете есть всякое существо, имеющее плавники и чешую и обитающее в воде, в морях и потоках[a]. Такое вы можете есть.
  rationale: Перестроена первая фраза, чтобы ясно отразить как начальное «из всего, что есть в воде», так и повторное уточнение «в воде, в морях и потоках». Добавленное «существо» — естественное русское носительное слово для эллиптического «всё, что» в данном классификационном контексте; оно не сужает референцию. Заключительное «Такое вы можете есть» сохраняет эмфатическое возобновление объекта без неестественного повтора «их».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:07:28Z'
