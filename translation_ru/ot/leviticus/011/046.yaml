  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: ru
  text: Вот закон[a] о животных, птицах, обо всяком живом существе[b], движущемся в воде, и обо всяком существе, кишащем на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление». Еврейское תּוֹרָה может означать как закон, так и авторитетное наставление.'
    reason: lexical_alternative
  - marker: b
    text: Буквально сочетание можно передать как «всякая живая душа», но здесь оно означает живое существо, а не отдельно существующую нематериальную душу.
    reason: lexical_clarification
lexical_decisions:
- source_word: תּוֹרַת
  choice: закон о
  rationale: В данном заключительном обобщении תּוֹרָה обозначает установленный свод предписаний; «закон о» естественно передаёт связь со всеми перечисленными разрядами существ.
- source_word: הַבְּהֵמָה
  choice: животных
  rationale: בְּהֵמָה здесь обозначает наземных четвероногих как широкую категорию, включая не только домашний скот; поэтому «животных» точнее, чем более узкое «скота».
- source_word: הָעוֹף
  choice: птицах
  rationale: В контексте пищевых предписаний обычное русское «птицы» естественно передаёт категорию עוֹף, хотя само еврейское слово может охватывать летающих существ шире.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: всяком живом существе
  rationale: Сочетание נֶפֶשׁ הַחַיָּה означает живое, одушевлённое существо; буквальное «живая душа» в современном русском могло бы ошибочно навести на мысль о нематериальной душе.
- source_word: הָרֹמֶשֶׂת
  choice: движущемся
  rationale: Причастие от רמש описывает передвижение существ; применительно к обитателям воды широкое «движущемся» звучит естественнее, чем «ползающем».
- source_word: בַּמָּיִם
  choice: в воде
  rationale: Еврейское слово имеет форму множественного числа, но в современном русском родовое обозначение среды «в воде» естественнее и не меняет смысла.
- source_word: וּלְכָל נֶפֶשׁ
  choice: и обо всяком существе
  rationale: 'Повторное נֶפֶשׁ передано как «существе» без повторения слова «живом»: значение сохраняется, а фраза остаётся ясной и плавной.'
- source_word: הַשֹּׁרֶצֶת
  choice: кишащем
  rationale: שׁרץ обозначает кишение или роение множества мелких существ; «кишащем» сохраняет характерный оттенок этого глагола и отличает его от רמש в предыдущей части стиха.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: «На земле» естественно передаёт אָרֶץ и сохраняет контраст с водной средой, не вынуждая выбирать между значениями «земля», «суша» и «почва».
theological_decisions:
- issue: Значение נֶפֶשׁ применительно к животным
  choice: живое существо / существо
  alternative: живая душа
  rationale: В этом зоологическом перечне נֶפֶשׁ обозначает живое существо, а не формулирует учение о нематериальной душе; перевод не должен вносить отсутствующее в контексте антропологическое различение.
translation_notes:
  register: Современный литературный русский, с достоинством заключительной законодательной формулы. Синтаксический параллелизм перечня сохранён; чрезмерно архаичные «скот», «пернатые» и «пресмыкающееся» не использованы.
