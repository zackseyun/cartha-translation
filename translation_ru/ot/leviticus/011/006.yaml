  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: ru
  text: 'и зайца[a], потому что он жуёт жвачку, но копыта у него не раздвоены: он нечист для вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кролика». Еврейское слово אַרְנֶבֶת традиционно понимается как «заяц», хотя иногда его относят к кролику или понимают шире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: зайца
  rationale: Еврейское אַרְנֶבֶת в библейских перечнях животных традиционно и наиболее вероятно обозначает зайца; «кролик» остаётся возможной, но менее точной идентификацией.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание, по которому животное признаётся нечистым.
- source_word: מַעֲלַת גֵּרָה
  choice: жуёт жвачку
  rationale: Это естественный русский эквивалент древнееврейского выражения, буквально означающего поднятие или возвращение жвачки.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: но копыта у него не раздвоены
  rationale: Формулировка ясно передаёт отрицательный признак и естественно выражает противопоставление; множественное «копыта» соответствует обычному русскому описанию животного.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: он нечист для вас
  rationale: Сохраняется ключевой библейский термин «нечист» и обращённость установления к израильтянам без добавления отсутствующего в тексте пояснения.
theological_decisions:
- issue: Характер нечистоты в законах о пище
  choice: Сохранить выражение «нечист для вас»
  alternative: «ритуально нечист для вас» или «нравственно нечист»
  rationale: Контекст указывает на обрядово-пищевую классификацию, а не на нравственную порочность животного. При этом основной текст не добавляет поясняющего слова «ритуально», которого нет в еврейском оригинале.
translation_notes:
  register: Современный литературный русский язык; синтаксис естественный, но сохраняет причинную структуру и юридико-культовый термин «нечист». Начальное «и» оставлено как связь с предыдущим перечнем.
