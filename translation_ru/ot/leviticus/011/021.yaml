base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: ru
  text: Но из всех крылатых кишащих существ, передвигающихся на четырёх ногах, вы можете есть тех, у которых есть[a] ноги для прыжков[b] над ступнями, чтобы с их помощью скакать по земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В записанном согласном тексте стоит буквально «у которых нет ног»; традиционное чтение, согласующееся с контекстом и древними переводами, — «у которых есть ноги».
    reason: textual_variant
  - marker: b
    text: 'Или: «суставчатые ноги»; еврейское слово здесь обозначает особые задние конечности, предназначенные для прыжков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Союз вводит исключение из запрета предыдущего стиха; «но» ясно и естественно передаёт противопоставление.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: вы можете есть тех
  rationale: В правовом контексте форма глагола выражает разрешение, а формально единственное «это» обозначает разрешённый класс существ.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: из всех летающих существ, которые кишат
  rationale: Передаёт широкий класс мелких роящихся или кишащих летающих существ, не сужая значение до птиц.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: передвигаются на четырёх ногах
  rationale: Естественная русская передача описания способа движения при сохранении необычной библейской классификации.
- source_word: אֲשֶׁר לא כְרָעַיִם
  choice: у которых есть прыгательные ноги
  rationale: Следует традиционному чтению לוֹ, поддержанному контекстом и древними переводами; כְרָעַיִם обозначает специализированные конечности для прыжков.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: над ступнями
  rationale: Сохраняет пространственно-анатомическое описание оригинала, не отождествляя особые прыгательные конечности с обычными ступнями.
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: чтобы с их помощью скакать по земле
  rationale: Передаёт назначение этих конечностей и явную отсылку местоимения к ним.
