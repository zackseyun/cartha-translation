source:
  edition: WLC
  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: ru
  text: 'Вот кто для вас нечист среди мелких животных, кишащих по земле: слепыш[a], мышь и крупная ящерица во всех её разновидностях.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное значение слов חֹלֶד и צָב неизвестно. חֹלֶד традиционно переводят также как «ласка» или «крот», а צָב — как «черепаха» или просто «ящерица».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Вот кто
  rationale: Формально указательное местоимение стоит в единственном числе, но вводит перечень животных. Русское «вот кто» естественно вводит такой ряд, не требуя искусственного согласования по числу.
- source_word: לָכֶם
  choice: для вас
  rationale: 'Предлог указывает на отношение этих животных к адресатам закона: они считаются нечистыми для Израиля.'
- source_word: הַטָּמֵא
  choice: нечист
  rationale: «Нечист» — ясный и традиционно понятный термин для ритуальной нечистоты в законодательном контексте Левита.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: среди мелких животных, кишащих
  rationale: Существительное שֶׁרֶץ обозначает мелких кишащих или снующих существ, а причастие повторяет тот же корень. Перевод передаёт категорию и сохраняет корневой образ хотя бы в глагольной части.
- source_word: עַל הָאָרֶץ
  choice: по земле
  rationale: В данном контексте выражение описывает поверхность земли как среду передвижения этих существ; «по земле» звучит по-русски естественнее, чем буквальное «на земле» после «кишащих».
- source_word: הַחֹלֶד
  choice: слепыш
  rationale: Точная зоологическая идентификация не установлена. «Слепыш» соответствует вероятному мелкому роющему грызуну, однако иные традиционные толкования отмечены в сноске.
- source_word: הָעַכְבָּר
  choice: мышь
  rationale: Обычное и наиболее надёжное соответствие עַכְבָּר, хотя еврейское слово может охватывать мышевидных грызунов шире.
- source_word: הַצָּב
  choice: крупная ящерица
  rationale: Точный вид неясен; в данном перечне наземных мелких животных вероятно имеется в виду крупная ящерица. Традиционная альтернатива указана в сноске.
- source_word: לְמִינֵהוּ
  choice: во всех её разновидностях
  rationale: Оборот относится к непосредственно предшествующему названию животного и указывает на включение всех существ соответствующего вида или рода. Такая формулировка естественно передаёт классификационный смысл по-русски.
