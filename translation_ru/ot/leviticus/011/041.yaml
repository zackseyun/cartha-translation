id: LEV.11.41
reference: Leviticus 11:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: ru
  text: И всякое существо, кишащее на земле[a], отвратительно[b]; его нельзя есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ползающее существо». Еврейское выражение широко обозначает мелких существ, которые кишат или передвигаются близко к земле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мерзость». Здесь имеется в виду то, что ритуально отвратительно и потому неприемлемо в пищу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: И всякое
  rationale: Союз וְ связывает запрет с предшествующими постановлениями, а כָּל придаёт ему всеохватный характер.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: существо, кишащее
  rationale: Однокоренные существительное и причастие обозначают широкий разряд мелких существ, движущихся множеством или близко к земле. Русское «кишащее» передаёт характер движения, хотя неизбежно ослабляет еврейский этимологический повтор.
- source_word: עַל הָ/אָ֑רֶץ
  choice: на земле
  rationale: В контексте главы אָרֶץ обозначает земную сферу обитания в отличие от воды и воздушного пространства.
- source_word: שֶׁ֥קֶץ
  choice: отвратительно
  rationale: В Левите 11 слово указывает на ритуально неприемлемое в пищу; «отвратительно» сохраняет оценочную силу, не превращая её без пояснения в нравственное осуждение.
- source_word: ה֖וּא
  choice: — выражено сказуемым «отвратительно»
  rationale: Самостоятельное местоимение подчёркивает предикацию; в естественном русском это достаточно передаётся именной конструкцией.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: его нельзя есть
  rationale: Страдательная форма выражает категорический запрет. Такая формулировка естественна для современного русского и сохраняет юридическую силу текста.
theological_decisions:
- issue: Характер обозначенной словом שֶׁקֶץ отвратительности
  choice: В основном тексте — «отвратительно», с пояснением ритуально-пищевого контекста в сноске
  alternative: «мерзость»
  rationale: Контекст непосредственно касается допустимости пищи. Перевод не должен ни ослаблять запрет, ни представлять его без уточнения как общее нравственное осуждение этих существ.
translation_notes:
  register: Современный литературный русский с краткой, категоричной формой запрета. Лексика понятна обычному читателю; сноски сохраняют широту еврейского обозначения и ритуально-пищевой смысл оценки.
