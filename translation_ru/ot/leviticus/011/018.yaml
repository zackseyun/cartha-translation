  text: the owl, the pelican, and the carrion vulture;
translation:
  language: ru
  text: сову[a], пеликана[b] и стервятника[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точный вид птицы, обозначенной этим древнееврейским словом, неизвестен; возможно, одна из разновидностей сов.
    reason: Сохраняет зоологическую неопределённость исходного термина.
  - marker: b
    text: Точное определение птицы неизвестно; традиционно — пеликан.
    reason: Предупреждает, что привычное соответствие не является бесспорным.
  - marker: c
    text: Вероятно, обыкновенный стервятник — птица-падальщик.
    reason: Указывает вероятный вид, не выдавая его определение за несомненное.
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (tinshemet)
  choice: сову
  rationale: Точный вид птицы не установлен; общее «сова» сохраняет традиционное отнесение к ночным хищным птицам, не создавая ложной зоологической точности.
- source_word: הַקָּאָת (qa’at)
  choice: пеликана
  rationale: «Пеликан» — наиболее распространённое соответствие древнееврейскому названию птицы, хотя точное определение вида остаётся спорным.
- source_word: הָרָחָם (racham)
  choice: стервятника
  rationale: Слово обычно связывают с птицей-падальщиком, вероятно обыкновенным стервятником; родовое название естественно по-русски и не переуточняет вид.
