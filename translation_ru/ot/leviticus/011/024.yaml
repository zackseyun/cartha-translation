base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: ru
  text: 'И от этих[a] вы станете нечисты: всякий, кто прикоснётся к их туше[b], будет нечист до вечера.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что же касается этих, вы станете нечисты». Начальные слова могут не указывать строго на причину нечистоты, а вводить следующую категорию в более общем смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к их туше»; в еврейском тексте существительное стоит в единственном числе с местоименным суффиксом множественного числа. По смыслу возможно: «к их тушам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: И от них
  rationale: Предлог לְ при указательном местоимении здесь допускает как значение причины/средства («от них»), так и более общее тематическое введение («что касается их»). В контексте последующего прикосновения «от них» естественно передаёт наступление ритуальной нечистоты.
- source_word: תִּטַּמָּאוּ
  choice: вы станете нечисты
  rationale: Форма 2-го лица множественного числа обозначает переход в состояние ритуальной нечистоты, а не нравственную вину; «станете нечисты» сохраняет это различие.
- source_word: כָּל הַנֹּגֵעַ
  choice: всякий, кто прикоснётся
  rationale: Причастная конструкция с כָּל имеет обобщающее значение. Совершенный вид по-русски естественен для условия в законодательном предписании.
- source_word: בְּנִבְלָתָם
  choice: к их мёртвому телу
  rationale: נְבֵלָה означает тело умершего животного. Единственное число существительного с местоименным суффиксом множественного числа сохранено; «мёртвое тело» современнее и понятнее, чем стилистически более узкая «туша».
- source_word: יִטְמָא
  choice: будет нечист
  rationale: Форма 3-го лица единственного числа согласуется с обобщённым «всякий» и обозначает состояние ритуальной нечистоты.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Устойчивое и естественное русское обозначение предела времени, точно передающее продолжительность ритуальной нечистоты.
theological_decisions:
- issue: Характер нечистоты в законах о святости
  choice: Передать טמא словами «нечист / станете нечисты» как обозначение ритуального состояния
  alternative: «осквернитесь / будет осквернён»
  rationale: Контекст говорит о культовой нечистоте вследствие соприкосновения с мёртвым животным, а не о нравственной виновности; выбранная формулировка не вносит моральной оценки.
- issue: Значение начального וּלְאֵלֶּה
  choice: «И от них»
  alternative: «Что же касается их»
  rationale: Основной текст передаёт вероятный причинный оттенок, но более общее тематическое понимание остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Терминология ритуальной нечистоты сохранена без архаического «оскверниться». Все сносочные маркеры включены в основной текст; маркер [a] относится к начальному обороту, хотя по требованиям разметки размещён в конце предложения, а [b] — непосредственно после соответствующей фразы.
