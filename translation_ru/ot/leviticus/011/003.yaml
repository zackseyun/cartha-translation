lexical_decisions:
- source_word: כֹּל
  choice: всякое
  rationale: Слово употреблено дистрибутивно и охватывает любое животное, отвечающее названным признакам.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: у которого копыто раздвоено
  rationale: Естественно передаёт физический признак, буквально описанный как разделение копыта.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: и полностью разделено надвое
  rationale: Вторая родственная формула уточняет, что копыто действительно разделено на две части; перевод сохраняет усиление без тяжеловесного повтора.
- source_word: מַעֲלַת גֵּרָה
  choice: жуёт жвачку
  rationale: Это общепонятное современное русское обозначение пережёвывания возвращённой пищи; буквальный образ пояснён в сноске.
- source_word: בַּבְּהֵמָה
  choice: животное
  rationale: В контексте пищевых предписаний слово обозначает наземных животных; «скот» было бы неоправданно узким.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: вы можете есть
  rationale: В данном законодательном контексте форма выражает разрешение, а не повеление непременно употреблять такое животное в пищу.
