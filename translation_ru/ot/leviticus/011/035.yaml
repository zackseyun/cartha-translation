base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: ru
  text: 'И всё, на что упадёт какая-либо часть их туши, станет нечистым[a]. Печь или очаг[b] следует разрушить: они нечисты и будут нечистыми для вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их мёртвого тела» либо «их туш». Еврейское слово обозначает тушу нечистого животного в контексте законов о ритуальной чистоте.'
    reason: lexical_alternative
  - marker: b
    text: «Очаг» — сооружение или приспособление для приготовления пищи; еврейское слово может обозначать плиту, подставку под сосуды или устройство наподобие очага.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: их туши
  rationale: נְבֵלָה обозначает мёртвое тело животного, особенно в контексте законов о чистоте. «Туша» естественно передаёт это значение; сочетание с «какая-либо часть» сохраняет собирательный оттенок еврейской формы.
- source_word: יִפֹּל
  choice: упадёт
  rationale: Имперфект выражает типичный случай в формулировке постоянного правового предписания.
- source_word: עָלָיו יִטְמָא
  choice: на что… станет нечистым
  rationale: Передаёт возникновение состояния ритуальной нечистоты вследствие соприкосновения с частью туши.
- source_word: תַּנּוּר
  choice: печь
  rationale: Слово обозначает печь для выпечки; «печь» — ясный и естественный современный эквивалент.
- source_word: כִירַיִם
  choice: очаг
  rationale: Термин обозначает приспособление или сооружение для приготовления пищи, возможно плиту, подставку под сосуды либо очаг; «очаг» не вносит излишней технической точности.
- source_word: יֻתָּץ
  choice: следует разрушить
  rationale: Пассивная форма выражает обязательное разрушение осквернённого сооружения; «следует» ясно передаёт предписание.
- source_word: טְמֵאִים הֵם
  choice: они нечисты
  rationale: Сохраняется ключевой термин законов о ритуальной чистоте без расширительного истолкования в основном тексте.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: должны быть для вас нечистыми
  rationale: 'Сохраняет обращённость לָכֶם к израильтянам и нормативный смысл: эти предметы должны считаться для них нечистыми.'
theological_decisions:
- issue: Характер нечистоты в законах Левита
  choice: Передавать טמא словом «нечистый», не добавляя в основной текст «ритуально».
  alternative: «ритуально нечистый» или «обрядово нечистый»
  rationale: Контекст говорит о ритуальной, а не нравственной нечистоте, однако традиционный ключевой термин «нечистый» сохраняет лексическую последовательность и не перегружает текст толкованием.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Сохранены юридическая категоричность, термин «нечистый» и повтор заключительной формулы оригинала; древняя кухонная реалия пояснена в сноске.
