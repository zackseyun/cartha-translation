source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: ru
  text: Ибо Я — Яхве, ваш Бог. Поэтому освятите себя и будьте святы, потому что Я свят. Не оскверняйте себя никаким кишащим существом, которое движется по земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никаким роем кишащих существ, движущихся по земле».'
    reason: Еврейские שֶׁרֶץ («кишащее, роящееся существо») и רֹמֵשׂ («движущееся») имеют частично перекрывающиеся значения; возможна более буквальная передача с образом роя.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: В формуле завета форма относится к единственному Богу — Яхве.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: освящайте себя
  rationale: Возвратная форма выражает сознательное отделение себя для святости; несовершенный вид естественно передаёт предписание.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: и будьте святы
  rationale: Сохраняет требуемое состояние и связь с последующим утверждением о святости Бога.
- source_word: קָדוֹשׁ
  choice: свят
  rationale: Стандартно передаёт богословски значимое קדושׁ и сохраняет повтор корня святости.
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: не оскверняйте себя
  rationale: Идиоматично выражает причинение нечистоты самим себе, не навязывая антропологического значения «души».
- source_word: שֶּׁרֶץ הָרֹמֵשׂ
  choice: мелким существом, копошащимся
  rationale: שׁרץ обозначает мелких кишащих существ, а רמשׂ — их движение по поверхности; сочетание избегает неестественного буквального повтора.
- source_word: עַל הָאָרֶץ
  choice: по земле
  rationale: В контексте передвижения существ естественное русское соответствие выражению «на земле/по земле».
theological_decisions:
- issue: Святость Бога как основание святости народа
  choice: Сохранить однокоренные «освящайте», «святы», «свят»
  alternative: Передать первое слово как «посвящайте себя» или «отделяйте себя»
  rationale: Так сохраняются лексическая связь группы קדשׁ и богословское основание повеления в святости самого Бога.
- issue: Значение נַפְשֹׁתֵיכֶם
  choice: себя
  alternative: свои души
  rationale: Здесь נֶפֶשׁ обозначает самих людей, а не утверждает техническое различение души и тела.
- issue: Вид запрета וְלֹא תְטַמְּאוּ
  choice: Не оскверняйте себя
  alternative: И не оскверните себя / и не должны осквернять себя
  rationale: Русский отрицательный императив естественно передаёт контекстуальную запретительную силу формы, не превращая её в простое предсказание.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. «Ведь» передаёт обосновывающее כִּי в начале, «поэтому» — следственный оттенок союза перед повелением. Личное имя передано как «Яхве»; местоимение «Я» написано с прописной буквы в обращённой к широкому русскоязычному читателю библейской традиции.
