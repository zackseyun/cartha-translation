  text: כֹּ֚ל שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: ru
  text: Всякое роящееся крылатое существо[a], передвигающееся на четырёх ногах[b], — мерзость для вас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякое роящееся летающее существо». Еврейское עוֹף может обозначать летающих существ вообще, а не только птиц.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «передвигающееся на четырёх». Имеется в виду передвижение с помощью четырёх ног; в следующих стихах для некоторых прыгающих насекомых делается исключение.'
    reason: cultural_note
  - marker: c
    text: 'Или: «отвратительно для вас». В пищевых законах это слово обозначает ритуально неприемлемое, вызывающее отвращение существо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: всякое
  rationale: 'Передаёт всеохватный распределительный смысл предписания: речь идёт о каждом существе данного разряда.'
- source_word: שֶׁרֶץ
  choice: роящееся существо
  rationale: Слово обозначает мелких существ, кишащих или образующих рои; этот вариант точнее традиционного «ползающее» в данном контексте, где речь идёт о крылатых насекомых.
- source_word: הָעוֹף
  choice: крылатое
  rationale: עוֹף может обозначать летающих существ шире, чем только птиц. Определение «крылатое» не создаёт ложного впечатления, будто стих говорит исключительно о птицах.
- source_word: הַהֹלֵךְ
  choice: передвигающееся
  rationale: Причастие описывает обычный способ движения; «передвигающееся» естественно применимо к насекомым и не сужает значение до человеческой походки.
- source_word: עַל אַרְבַּע
  choice: на четырёх
  rationale: Сохраняет буквальную форму еврейского выражения без внесения отсутствующего в тексте слова «ногах»; примечание разъясняет смысл.
- source_word: שֶׁקֶץ
  choice: отвратительно
  rationale: Передаёт сильную отрицательную оценку в контексте пищевых законов, не отождествляя этот термин с более общим понятием нечистоты.
- source_word: לָכֶם
  choice: для вас
  rationale: Передаёт отношение этих существ к Израилю как адресату закона.
theological_decisions:
- issue: Характер обозначенной отвратительности
  choice: Сохранена формулировка «отвратительно для вас» с пояснением ритуально-пищевого контекста в сноске.
  alternative: «нечисто для вас» или «мерзость для вас»
  rationale: «Нечисто» смешало бы שֶׁקֶץ с отдельной терминологией нечистоты, а «мерзость» в современном русском может быть воспринята преимущественно как нравственная оценка. Перевод сохраняет силу слова, не превращая установленную законом пищевую неприемлемость в общее моральное осуждение.
translation_notes:
  register: Современный литературный русский язык с ясной юридико-предписывающей формулировкой. Порядок определений сохраняет структуру еврейского текста, но остаётся естественным для русского. Терминология не ограничивает עוֹף птицами и не смешивает שֶׁקֶץ с общим понятием ритуальной нечистоты.
