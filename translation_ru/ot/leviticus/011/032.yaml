  to: 'И всё, на что упадёт одно из них после их смерти, станет нечистым: деревянная утварь, одежда, кожа или мешковина — всякий предмет, используемый для работы. Этот предмет следует внести в воду[a], и он будет нечист до вечера; затем он станет чистым.'
  rationale: Исправлена грамматическая связь между затронутой вещью и последующими предписаниями. «Всё» естественно передаёт כֹּל в обобщающей конструкции, а «этот предмет» однозначно связывает второе предложение с предметами из перечня. «После их смерти» передаёт בְּמֹתָם без добавления технического слова «труп». Смысл, ритуально-правовой регистр и сохранённая в примечании неоднозначность יוּבָא сохранены.
