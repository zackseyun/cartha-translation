  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: ru
  text: 'И всё, на что упадёт одно из них после их смерти, станет нечистым: деревянная утварь, одежда, кожа или мешковина — всякий предмет, используемый для работы. Этот предмет следует внести в воду[a], и он будет нечист до вечера; затем он станет чистым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «этот предмет следует внести в воду»; возможный перевод: «погрузить в воду».'
    reason: 'Лексическая альтернатива: בַּמַּיִם יוּבָא буквально говорит о внесении предмета в воду; степень погружения прямо не уточняется.'
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: И всякая вещь, на которую упадёт какое-либо из них, когда они мертвы
  rationale: Передаёт всеохватность כֹּל, относительную конструкцию и связь осквернения с падением одного из ранее названных существ в мёртвом состоянии. Формулировка не подменяет множественное בְּמֹתָם словом «труп».
- source_word: יִטְמָא
  choice: станет нечистой
  rationale: Глагол обозначает переход в состояние ритуальной нечистоты, а не моральную вину.
- source_word: מִכָּל כְּלִי עֵץ
  choice: будь то деревянный предмет
  rationale: מִן здесь вводит разновидности затронутых вещей. כְּלִי шире, чем «сосуд», и может означать предмет или принадлежность; «предмет» естественно подходит к последующему обобщению.
- source_word: בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: одежда, кожа или мешковина
  rationale: בֶגֶד в данном перечне передано обычным «одежда»; עוֹר не уточняет степень обработки кожи; שָׂק обозначает грубую ткань, поэтому «мешковина» здесь точнее, чем готовый «мешок».
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: любой предмет, используемый для работы
  rationale: Сохраняет обобщающий характер фразы и пассивную семантику, но выражает её естественно по-русски. «Работа» не сужает מְלָאכָה до какого-либо отдельного ремесла.
- source_word: בַּמַּיִם יוּבָא
  choice: Его следует поместить в воду
  rationale: Хофал глагола בוא буквально означает «быть внесённым/принесённым». В данном предписании «поместить в воду» понятно и не утверждает определённый способ омовения сверх сказанного.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: и он будет нечист до вечера, а затем станет чистым
  rationale: Передаёт продолжительность нечистоты и последующее восстановление чистого статуса; «затем» естественно выражает временную последовательность.
theological_decisions:
- issue: Характер нечистоты и чистоты
  choice: нечист / чист
  alternative: осквернён / очищен; ритуально нечист / ритуально чист
  rationale: טמא и טהר здесь обозначают установленный законом статус. Обычная библейская пара «нечист/чист» сохраняет юридико-ритуальный смысл, не вводя понятия моральной вины и не добавляя отсутствующее в стихе пояснение «ритуально».
- issue: Способ помещения в воду
  choice: поместить в воду с примечанием о буквальном выражении
  alternative: погрузить в воду
  rationale: Еврейский текст говорит, что предмет должен быть «внесён в воду», но не употребляет специального глагола со значением полного погружения. Поэтому перевод не разрешает эту возможную неоднозначность без оговорки.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным нормативным звучанием. Перечень оформлен через «будь то», чтобы естественно передать трудную конструкцию с מִן; тире отмечает последующее обобщение. Термины «нечист» и «чист» сохраняют традиционный язык левитского законодательства без конфессиональных добавлений.
