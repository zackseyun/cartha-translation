  source_fidelity: 'Смысл передан верно: Яхве представлен как Тот, кто вывел Израиль из Египта, чтобы быть его Богом; повеление быть святыми обосновано Божьей святостью. Однако еврейское הַמַּעֲלֶה — причастная форма, допускающая более буквальное настоящее («выводит»), и английский audit trail обоснованно сохраняет это в сноске. Русский текст также должен отметить этот вариант.'
