base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: ru
  text: Ибо Я — Яхве, который вывел[а] вас из земли Египта, чтобы быть вашим Богом. И будьте святы[б], ибо Я свят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Или: «который выводит вас из земли Египта». В еврейском тексте употреблено причастие; хотя исход относится к прошлому, форма может передаваться более буквально как действие в настоящем.'
    reason: lexical_alternative
  - marker: б
    text: 'Или: «потому что Я свят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, сохраняя его отличие от титула «Господь».
- source_word: הַמַּעֲלֶה
  choice: Который вывел
  rationale: Причастие буквально обозначает «поднимающего/выводящего», но здесь указывает на уже совершившийся исход; прошедшее время естественно по-русски, а глагол «вывел» сохраняет образ выхода из Египта.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет явно названную «землю» и торжественное звучание формулы исхода.
- source_word: לִהְיֹת לָכֶם לֵאלֹהִים
  choice: чтобы быть вашим Богом
  rationale: Естественно передаёт стандартную формулу отношений завета без добавочного истолкования.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: Будьте же святы
  rationale: В контексте форма имеет предписывающую силу; повелительное выражение ясно и естественно передаёт требование, а «же» связывает его с предшествующим основанием.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: потому что Я свят
  rationale: Передаёт причинное основание призыва к святости и сохраняет краткость исходного текста.
theological_decisions:
- issue: Основание святости Израиля
  choice: Требование святости основано на личности Яхве, Его избавлении Израиля из Египта и отношениях, выраженных словами «вашим Богом».
  alternative: Понимать стих лишь как узкое предписание о ритуальной чистоте.
  rationale: Хотя ближайший контекст касается пищи и чистоты, сам стих связывает святость с исходом, заветными отношениями и святостью Бога; перевод не сужает и не расширяет эту связь.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан естественным для обычного читателя; личное имя передано как «Яхве». В тексте нет сносок, поэтому маркеры не требуются.
