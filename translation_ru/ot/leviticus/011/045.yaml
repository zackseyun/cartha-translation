  terminology: «Яхве», «Бог» и «святы» выбраны удачно и сохраняют ключевые термины. Транслитерация личного имени согласуется с проектным решением. Формула «быть вашим Богом» точно передаёт לִהְיוֹת לָכֶם לֵאלֹהִים.
