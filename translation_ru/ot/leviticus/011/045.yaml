- from: Ведь Я — Яхве, Который вывел вас из земли Египетской, чтобы быть вашим Богом. Будьте же святы, потому что Я свят.
  to: Ибо Я — Яхве, который вывел[а] вас из земли Египта, чтобы быть вашим Богом. И будьте святы[б], ибо Я свят.
  rationale: 'Перевод уточнён для современного литературного русского и более прямого соответствия синтаксису оригинала: «ибо» передаёт כִּי в обоих случаях, «И будьте» сохраняет союз перед повелением, а «из земли Египта» заменяет архаичную форму. Добавлена сноска к «вывел» для сохранения аспектуальной неоднозначности еврейского причастия, отмеченной в английском audit trail; также отражён допустимый русский союзный вариант для заключительного כִּי.'
