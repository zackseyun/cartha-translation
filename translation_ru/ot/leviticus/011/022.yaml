base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: ru
  text: 'Вот кого из них вы можете есть: саранчу — по её виду, солам — по его виду, харгол — по его виду и кузнечика — по его виду.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное соответствие еврейских названий «солам» и «харгол» современным видам насекомых неизвестно. В традиционных переводах солам иногда передают как «лысую саранчу», а харгол — как «сверчка» или «кузнечика».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: Вот кого из них
  rationale: Оборот вводит разрешённую группу из упомянутых ранее крылатых роющихся существ; такая передача близка по смыслу к еврейскому тексту и естественна по-русски.
- source_word: תֹּאכֵלוּ
  choice: вы можете есть
  rationale: В контексте пищевого закона имперфект выражает разрешение, а не повеление или обязанность.
- source_word: הָאַרְבֶּה
  choice: саранчу
  rationale: Это обычное и наиболее надёжное значение данного еврейского названия.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: всех её/его видов
  rationale: Повторяющаяся в Торе классификационная формула означает принадлежность к соответствующему виду или разновидности; данная передача сохраняет её таксономический смысл и звучит естественно по-русски.
- source_word: הַסָּלְעָם
  choice: солама
  rationale: Точное зоологическое соответствие неизвестно. Транслитерация не создаёт ложной уверенности, будто речь идёт о достоверно установленном современном виде насекомого.
- source_word: הַחַרְגֹּל
  choice: харгола
  rationale: Точное зоологическое соответствие неизвестно. Транслитерация сохраняет отдельное название из исходного текста, не отождествляя его без достаточных оснований со сверчком или иным конкретным насекомым.
- source_word: הֶחָגָב
  choice: кузнечика
  rationale: Слово обозначает прыгающее прямокрылое насекомое, обычно отличаемое здесь от саранчи; «кузнечик» — понятная современная передача.
