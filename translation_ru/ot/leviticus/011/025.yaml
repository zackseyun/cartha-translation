  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: ru
  text: И всякий, кто понесёт тушу кого-либо из них[a], должен выстирать свою одежду и будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от их туши». В сочетании с глаголом «нести» этот оборот может передавать распределительное значение: «тушу кого-либо из них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: И всякий, кто понесёт
  rationale: Союз וְ связывает предписание с предыдущим контекстом; כָּל с причастием имеет обобщённо-распределительное значение. «Всякий, кто» естественно передаёт универсальный охват, а «понесёт» отражает נשׂא в значении переноса останков.
- source_word: מִ/נִּבְלָתָ/ם
  choice: что-либо от их трупов
  rationale: נְבֵלָה в законах о чистоте обозначает труп животного. Оборот с מִן допускает значение неопределённой части или количества; «что-либо от их трупов» сохраняет эту особенность и звучит понятнее, чем буквальное сочетание с единственным числом.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: должен выстирать свою одежду
  rationale: Имперфект выражает обязательное предписание. «Выстирать» естественно для одежды, а возвратное «свою» точно соотносит её с представительным лицом мужского рода.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: и будет нечист до вечера
  rationale: טָמֵא обозначает ритуальную, а не нравственную нечистоту. Фраза «до вечера» ясно передаёт установленный срок её продолжительности.
theological_decisions:
- issue: Мужской род единственного числа в общем правовом предписании
  choice: 'Сохранить представительное единственное число мужского рода: «всякий… будет нечист»'
  alternative: Передать множественным или гендерно-нейтральным оборотом
  rationale: Еврейский текст формулирует общее правило посредством форм мужского рода единственного числа; русский представительный оборот сохраняет грамматическую форму и универсальный смысл без добавления богословских уточнений.
- issue: Характер нечистоты
  choice: Передать как «нечист», не поясняя в основном тексте «ритуально»
  alternative: «Будет ритуально нечист»
  rationale: Контекст главы однозначно относится к обрядовой чистоте, однако добавление слова «ритуально» отсутствует в исходном тексте и излишне снимает его лаконичность.
translation_notes:
  register: Современный литературный русский с достоинством правового текста. «Должен выстирать» передаёт обязательность без архаического «да вымоет»; «одежда» употреблена как собирательное существительное. Маркер сноски помещён непосредственно после соответствующего оборота.
