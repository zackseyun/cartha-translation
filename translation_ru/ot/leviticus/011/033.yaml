  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: ru
  text: 'И всякий глиняный сосуд[a], в который упадёт один из них: всё, что в нём, станет нечистым, а сам сосуд разбейте.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сосуд из обожжённой глины»; то есть керамический сосуд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: глиняный сосуд
  rationale: כְּלִי обозначает предмет или вместилище, а חֶרֶשׂ уточняет материал — обожжённую глину. «Глиняный сосуд» естественно звучит по-русски и сохраняет существенное для постановления указание на материал.
- source_word: יִפֹּל מֵהֶם
  choice: упадёт один из них
  rationale: Местоимение во множественном числе отсылает к упомянутым ранее мелким существам, точнее к их мёртвым телам. «Один из них» естественно передаёт распределительный смысл, не добавляя отсутствующего в этой фразе существительного.
- source_word: אֶל תּוֹכוֹ
  choice: в который
  rationale: תּוֹךְ указывает на внутренность сосуда; русская относительная конструкция «в который» ясно и естественно передаёт падение внутрь.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: всё, что находится в нём
  rationale: Формулировка сохраняет всеохватность כֹּל и прямо относится ко всему содержимому сосуда.
- source_word: יִטְמָא
  choice: станет нечист
  rationale: В контексте законов Левита «нечист» обозначает ритуальную нечистоту, а «станет» передаёт наступление состояния вследствие осквернения.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: сам же сосуд разбейте
  rationale: Вынесенное вперёд дополнение אֹתוֹ подчёркивает именно сосуд. «Сам же сосуд» воспроизводит это выделение, а «разбейте» естественно передаёт обязательное предписание.
theological_decisions:
- issue: Характер нечистоты
  choice: нечист
  alternative: осквернён / нечист ритуально
  rationale: Традиционный и понятный термин «нечист» сохраняет культово-правовой смысл текста, не сводя его ни к физической грязи, ни к нравственной вине.
- issue: Синтаксическая область действия יִטְמָא
  choice: сосуд станет нечист, как и всё его содержимое
  alternative: только всё содержимое станет нечистым
  rationale: Масоретская пунктуация допускает прочтение, при котором יִטְמָא завершает главное высказывание о сосуде, а следующая фраза уточняет охват нечистоты. Перевод сохраняет это естественное понимание; двоеточие связывает содержимое с тем же состоянием.
translation_notes:
  register: Современный литературный русский язык с краткой, нормативной формулировкой. Сохранены юридико-ритуальный тон, материальная специфика сосуда и подчёркивание обязанности разбить именно его.
