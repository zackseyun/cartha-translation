  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: ru
  text: Из всех кишащих существ эти нечисты для вас[a]. Всякий, кто прикоснётся к ним, когда они мертвы[b], будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди всех мелких существ, которые кишат». Еврейское слово широко обозначает небольших существ, которые кишат, ползают или роятся.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в их смерти»; имеется в виду прикосновение к ним в мёртвом состоянии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Эти
  rationale: Указательное местоимение во множественном числе отсылает к существам, перечисленным непосредственно перед этим стихом.
- source_word: הַטְּמֵאִים לָכֶם
  choice: нечисты для вас
  rationale: Сохраняет предикативную конструкцию и указывает на установленный для Израиля статус ритуальной нечистоты, не подменяя его нравственной оценкой.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: среди всех кишащих существ
  rationale: שֶׁרֶץ — широкое обозначение небольших существ, которые кишат, ползают или роятся; «среди» естественно передаёт классифицирующее значение предлога בְּ.
- source_word: כָּל הַנֹּגֵעַ
  choice: Всякий, кто прикоснётся
  rationale: Передаёт обобщённо-распределительное значение конструкции и звучит естественно в русском законодательном контексте.
- source_word: בְּמֹתָם
  choice: когда они мертвы
  rationale: Фраза обозначает прикосновение к существам в их мёртвом состоянии, а не только в момент их смерти.
- source_word: יִטְמָא
  choice: будет нечист
  rationale: Передаёт наступающий ритуальный статус; формулировка ясна и сохраняет юридический тон главы.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Естественно и точно обозначает временную границу состояния нечистоты.
theological_decisions:
- issue: Характер нечистоты
  choice: нечист
  alternative: осквернён / морально нечист
  rationale: В данном законодательном контексте речь идёт о ритуальном статусе вследствие прикосновения к мёртвому существу, а не о нравственной вине.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, законодательным звучанием. Термин «нечист» последовательно сохраняет лексику ритуальной чистоты книги Левит; громоздкие зоологические уточнения не вводятся.
