  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Названия птиц в этом стихе в нескольких случаях определяются неуверенно. Среди традиционных вариантов: «сова» вместо «страуса», «сова» или «козодой» вместо «ястреба», «кукушка» вместо «чайки» и «ястреб» вместо «сокола».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: страуса
  rationale: Буквально выражение означает «дочь яаны», однако в перечне животных служит названием птицы. «Страус» соответствует наиболее вероятному современному отождествлению, хотя точность определения не бесспорна.
- source_word: הַתַּחְמָס
  choice: сокола
  rationale: Точный вид птицы неизвестен. Общее обозначение хищной птицы передаёт вероятный смысл и позволяет отличить это слово от נֵץ далее в стихе.
- source_word: הַשָּׁחַף
  choice: чайку
  rationale: Отождествление не вполне достоверно, но «чайка» широко поддерживается современной лексикографией и звучит естественно по-русски.
- source_word: הַנֵּץ
  choice: ястреба
  rationale: Слово обозначает хищную птицу типа ястреба или сокола. Выбор «ястреб» сохраняет вероятный смысл и отличает эту птицу от תַּחְמָס.
- source_word: לְמִינֵהוּ
  choice: по роду его
  rationale: Формулировка сохраняет классификационный смысл и мужской род местоименного суффикса единственного числа в еврейском тексте; она относится ко всем разновидностям названной птицы.
- source_word: וְאֵת / וְאֶת
  choice: и
  rationale: Повторяющийся союз продолжает перечень предыдущего стиха; показатель прямого дополнения отдельно не переводится.
