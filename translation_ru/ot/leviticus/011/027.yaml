  source_fidelity: 'Смысл передан в целом верно: речь о животных, передвигающихся на четырёх, которые ходят на лапах; они ритуально нечисты, а прикоснувшийся к их трупу нечист до вечера. Однако начальное «И всякое животное ... из всех животных» синтаксически неудачно: оборот «из всех животных» оказывается присоединённым к уже завершенному определению и затрудняет понимание сферы ограничения בְּכָל הַחַיָּה.'
