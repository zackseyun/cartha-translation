base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: ru
  text: Все животные, которые среди животных, передвигающихся на четырёх ногах,[a] ходят на лапах, нечисты для вас. Всякий, кто прикоснётся к их трупу,[b] будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «ходящих на четырёх».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте существительное «труп» стоит в единственном числе с суффиксом множественного числа и употреблено собирательно.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: И всякое животное, которое ходит на лапах
  rationale: Субстантивированное «всякое ходящее» по контексту относится к животным; «лапы» естественно передаёт כַּפִּים применительно к четвероногим.
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: из всех животных, передвигающихся на четырёх ногах
  rationale: חַיָּה здесь обозначает наземных животных, а выражение עַל אַרְבַּע буквально указывает на передвижение на четырёх конечностях.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: нечисто для вас
  rationale: «Нечисто» сохраняет терминологию ритуальной чистоты; согласование в единственном числе соответствует русскому собирательно-дистрибутивному «всякое животное», несмотря на еврейское множественное сказуемое.
- source_word: כָּל הַנֹּגֵעַ בְּנִבְלָתָם
  choice: Всякий, кто прикоснётся к их трупу
  rationale: נְבֵלָה означает мёртвое тело животного; форма в еврейском — существительное единственного числа с местоименным суффиксом множественного числа.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: будет нечист до вечера
  rationale: Имперфект в правовом предписании выражает наступающий статус; по-русски естественно передаётся будущим временем.
theological_decisions:
- issue: Терминология ритуальной чистоты
  choice: нечисто / нечист
  alternative: осквернено / осквернится
  rationale: Корень טמא в данном законодательном контексте обозначает ритуальный статус, а не обязательно нравственную вину; «нечист» сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным правовым звучанием. Формулировка сохраняет ритуальную терминологию и собирательные особенности исходного текста, не делая синтаксис неестественным.
