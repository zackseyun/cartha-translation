source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: ru
  text: 'Всё, что передвигается на брюхе[a], всё, что передвигается на четырёх ногах, вплоть до всякого многоногого среди всех кишащих по земле существ[b], — не ешьте: они — мерзость[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ползает на брюхе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из всех кишащих, которые кишат»; повтор однокоренных слов подчёркивает этот класс существ.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «они отвратительны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: всё, что
  rationale: Передаёт распределительное и всеохватное значение в перечне категорий существ и естественно звучит по-русски.
- source_word: הוֹלֵךְ עַל גָּח
  choice: передвигается на брюхе
  rationale: Сохраняет буквальный образ способа передвижения, не сужая значение до одного конкретного вида ползания.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: передвигается на четырёх ногах
  rationale: Ясно и близко передаёт еврейское выражение с числительным; слово «ногах» добавлено ради естественности русского языка.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: а также всё многоногое
  rationale: עַד здесь расширяет охват перечня вплоть до существ со множеством ног; «а также» естественно выражает включающее значение, а «многоногое» сохраняет конкретный образ.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: из всех мелких существ, снующих
  rationale: Передаёт обозначение класса небольших движущихся существ без чрезмерно узкого отождествления только с насекомыми; однокоренная эмфатическая конструкция поясняется в сноске.
- source_word: עַל הָאָרֶץ
  choice: по земле
  rationale: В контексте движения существ русское «по земле» естественно передаёт пространственное значение выражения.
- source_word: לֹא תֹאכְלֻם
  choice: не ешьте
  rationale: Прямая форма запрета в современном русском языке сохраняет юридическую силу еврейской отрицательной конструкции.
- source_word: שֶׁקֶץ
  choice: отвратительны
  rationale: Передаёт сильную оценку ритуально неприемлемого и вызывающего отвращение, не добавляя позднейших богословских оттенков.
theological_decisions:
- issue: Характер запрета в законодательстве о чистоте
  choice: Передать как прямой пищевой запрет в рамках текста Левита, не комментируя его дальнейшую применимость.
  alternative: Представить запрет как вневременную нравственную норму либо ослабить его до культурного табу.
  rationale: Еврейский текст прямо формулирует запрет, но сам этот стих не разрешает более широкие канонические и богословские вопросы.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным законодательным тоном. Синтаксис перечня сохранён, но упорядочен для естественного русского чтения; лексическая и богословская неоднозначность вынесена в краткие сноски.
