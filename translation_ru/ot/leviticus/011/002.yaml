  terminology: «Сынам Израиля» сохраняет значимую формулу оригинала и корректно пояснено. Различение «живых существ» (הַחַיָּה) и «животных» (הַבְּהֵמָה) последовательно; «на земле» в основном тексте не подменено спорно более узким «на суше», которое вынесено в сноску.
