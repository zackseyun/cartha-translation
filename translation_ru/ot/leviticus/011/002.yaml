source:
  edition: WLC
  text: דַּבְּר֛וּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֤את הַֽ/חַיָּה֙ אֲשֶׁ֣ר תֹּאכְל֔וּ מִ/כָּל הַ/בְּהֵמָ֖ה אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: ru
  text: 'Скажите сынам Израиля[a]: «Вот какие живые существа[b] вам можно есть из всех животных, обитающих на земле[c].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Израиля»; то есть израильтянам, народу Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально стоит единственное число: «вот живое существо»; здесь оно имеет собирательный смысл и вводит перечень разрешённых в пищу животных.'
    reason: source_form
  - marker: c
    text: 'Возможный перевод: «на суше». Эта фраза выделяет наземных существ среди других категорий, рассматриваемых далее в главе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Скажите
  rationale: Форма повелительного наклонения во множественном числе обращена в контексте к Моисею и Аарону. «Скажите» естественно передаёт поручение сообщить последующие установления.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено буквальное родственное выражение исходного текста; в данном контексте оно обозначает народ Израиля.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Стандартная древнееврейская формула введения прямой речи естественно передаётся в современном русском языке двоеточием, без тяжеловесного «говоря».
- source_word: זֹאת הַחַיָּה
  choice: Вот какие живые существа
  rationale: Формально сочетание стоит в единственном числе, однако имеет собирательно-классифицирующий смысл и вводит перечень разрешённых видов. Русская конструкция «вот какие» естественно выражает этот смысл.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: вам можно есть
  rationale: В контексте пищевых предписаний имперфект выражает разрешение; эта формулировка яснее простого будущего времени.
- source_word: מִכָּל הַבְּהֵמָה
  choice: из всех животных
  rationale: Предлог מִן при כֹּל передаёт выбор из более широкой совокупности. Здесь בְּהֵמָה обозначает наземных животных в широком смысле.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: обитающих на земле
  rationale: Определение отделяет наземных существ от последующих категорий; «обитающих» естественно выражает локативное значение в русском языке.
theological_decisions:
- issue: Единственное число זֹאת הַחַיָּה и собирательный смысл
  choice: Вот какие живые существа
  alternative: Вот живое существо, которое
  rationale: Сохранён классифицирующий охват вводимого перечня, но формальная особенность еврейского единственного числа отмечена в сноске, чтобы не скрывать неоднозначность формы.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Архаичное «говоря» заменено естественным введением прямой речи; буквальное «сынам Израиля» сохранено как значимая библейская семейно-народная формула и пояснено в сноске.
