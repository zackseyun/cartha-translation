base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: ru
  text: 'Но среди животных, которые жуют жвачку или имеют раздвоенные копыта, не ешьте вот кого: верблюда, потому что он жуёт жвачку, но копыта у него не раздвоены; он нечист для вас.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть он не должен употребляться в пищу Израилем согласно этим предписаниям о чистых и нечистых животных.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Передаёт ограничительно-противительное значение частицы и естественно вводит исключение из правила предыдущего стиха.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: из животных, которые жуют жвачку
  rationale: Еврейское выражение буквально говорит о поднятии жвачки, но по-русски обычное и точное обозначение этого признака — «жевать жвачку».
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: или имеют раздвоенные копыта
  rationale: В данном перечислении речь идёт о животных, обладающих лишь одним из двух требуемых признаков; союз «или» ясно передаёт смысловое отношение, не меняя критериев классификации.
- source_word: הַגָּמָל
  choice: верблюда
  rationale: Прямое современное соответствие названию животного.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: потому что он жуёт жвачку
  rationale: Сохраняет причинную связь и передаёт еврейскую идиому естественным русским выражением.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: но копыто у него не раздвоено
  rationale: Передаёт противопоставление двух классификационных признаков и сохраняет единственное число еврейского слова «копыто».
- source_word: טָמֵא הוּא לָכֶם
  choice: он нечист для вас
  rationale: Сохраняет ключевой левитский термин «нечист» и обращённость правового предписания к Израилю, не сужая значение в основном тексте до «ритуально нечист».
theological_decisions:
- issue: Характер нечистоты в пищевых предписаниях Левита
  choice: нечист
  alternative: ритуально нечист / церемониально нечист
  rationale: Термин טָמֵא здесь обозначает установленную для Израиля категорию нечистоты. Основной текст сохраняет более широкий библейский термин, а примечание поясняет его контекст, не вводя конфессиональной терминологии.
translation_notes:
  register: 'Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Синтаксис упрощён ровно настолько, чтобы показать: далее перечисляются животные, отвечающие только одному из двух критериев.'
