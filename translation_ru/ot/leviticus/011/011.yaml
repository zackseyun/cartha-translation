source:
  edition: WLC
  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: ru
  text: И они будут для вас мерзостью; мяса их не ешьте, и трупами их гнушайтесь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «считайте их трупы мерзостью». Еврейский глагол однокоренной со словом «мерзость» в начале стиха и означает считать что-либо отвратительным, гнушаться им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: мерзость
  rationale: Существительное обозначает нечто вызывающее сильное отвращение и недопустимое в обрядово-пищевом контексте. «Мерзость» сохраняет силу исходного слова и естественно сочетается с конструкцией «будут для вас»; «нечистыми» было бы слабее и смешивало бы этот термин с иной еврейской лексикой нечистоты.
- source_word: יִהְיוּ לָכֶם
  choice: будут для вас
  rationale: Сохранена дательная конструкция לָכֶם, указывающая, как израильтяне должны относиться к этим существам.
- source_word: מִבְּשָׂרָם
  choice: мяса их
  rationale: 'Предлог מִן при отрицании имеет партитивный смысл: нельзя есть ничего из их мяса. В русском запрет «мяса их не ешьте» естественно передаёт этот смысл без обязательного добавления слова «никакого».'
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Отрицательная форма в правовом тексте передана прямым повелительным запретом, естественным для современного русского языка.
- source_word: נִבְלָתָם
  choice: трупами их
  rationale: נְבֵלָה означает мёртвое тело животного. «Трупы» точно и кратко передаёт значение; форма творительного падежа обусловлена русским управлением глагола «гнушаться».
- source_word: תְּשַׁקֵּצוּ
  choice: гнушайтесь
  rationale: Глагол, однокоренной с שֶׁקֶץ, велит считать объект отвратительным и сторониться его. «Гнушайтесь» сохраняет сильную оценку и предписываемое отношение, а не сводит её к простому эмоциональному неприятию.
theological_decisions:
- issue: Характер отрицательной оценки в законах о пище
  choice: Передать שֶׁקֶץ и תְּשַׁקֵּצוּ словами «мерзость» и «гнушайтесь», сохранив обрядово-правовой контекст.
  alternative: Перевести как «нечистые» либо повторить прилагательное «отвратительные».
  rationale: В стихе речь идёт о предписанных Израилю пищевых различиях. Выбранные слова сохраняют сильную отрицательную оценку, но сам перевод не объявляет её отдельной универсальной нравственной категорией и не смешивает с иной терминологией ритуальной нечистоты.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, пригодным для Писания синтаксисом. Союз «И» и точка с запятой сохраняют связь с предыдущим контекстом и единство структуры стиха. Постпозиция местоимения в сочетаниях «мяса их», «трупами их» придаёт достоинство без чрезмерной архаизации.
