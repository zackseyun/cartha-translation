  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: ru
  text: Если умрёт какое-либо животное из тех, которых вам разрешено употреблять в пищу, то тот, кто прикоснётся к его туше, будет нечист до вечера.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Сочетание вводит условный случай, связанный с предыдущими предписаниями; в русском языке связь естественно передаётся последовательностью текста без обязательного начального «и».
- source_word: יָמוּת
  choice: умрёт
  rationale: Имперфект в условной конструкции обозначает возможное событие; будущее время естественно для русского законодательного условия.
- source_word: מִן הַבְּהֵמָה
  choice: какое-либо животное из тех
  rationale: Так передаётся партитивное значение מִן — одно животное из соответствующей группы. «Животное» здесь яснее и естественнее, чем более узкое «скот», поскольку далее группа определяется пригодностью в пищу.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: которых вам можно употреблять в пищу
  rationale: Оборот обозначает животных, разрешённых и пригодных в пищу. Формулировка сохраняет категориальный смысл и звучит естественно по-русски.
- source_word: הַנֹּגֵעַ
  choice: прикоснувшийся
  rationale: Субстантивированное причастие обозначает всякого человека, совершившего прикосновение; русское причастие близко форме и смыслу оригинала.
- source_word: בְּנִבְלָתָהּ
  choice: к его туше
  rationale: נְבֵלָה означает мёртвое тело животного, особенно павшего; «туша» — точный и понятный термин в контексте законов о ритуальной чистоте.
- source_word: יִטְמָא
  choice: будет нечист
  rationale: Глагол выражает состояние ритуальной нечистоты, наступающее вследствие прикосновения. Формула не добавляет нравственного осуждения.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Устойчивая и естественная русская передача установленного срока ритуальной нечистоты.
theological_decisions:
- issue: Характер нечистоты
  choice: будет нечист
  alternative: осквернится
  rationale: Нейтральная формулировка сохраняет ритуально-правовой смысл טמא и не придаёт ему дополнительного нравственного оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис сделан естественным, но условная структура, партитивность и ритуально-правовая терминология оригинала сохранены.
