  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: ru
  text: Но если на семя попала вода и на него упадёт какая-либо из их туш, то оно нечисто для вас.[а]
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Или: «какой-либо из их мёртвых тел». Еврейское נְבֵלָה обозначает тушу, то есть мёртвое тело животного; в данном контексте «туша» передаёт термин точнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Но если
  rationale: Передаёт условие и его противопоставление предыдущему постановлению.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: на семена попадёт вода
  rationale: Сохраняет условный смысл пассивной формы נתן и естественно описывает попадание воды на собирательно понимаемое זֶרַע.
- source_word: וְנָפַל מִנִּבְלָתָם עָלָיו
  choice: и на них упадёт что-нибудь от их туш
  rationale: Частичный смысл מִן передан оборотом «что-нибудь от»; נְבֵלָה в контексте животных означает тушу, то есть мёртвое тело животного.
- source_word: טָמֵא הוּא לָכֶם
  choice: то семена будут нечисты для вас
  rationale: Явно восстанавливает референт местоимения и сохраняет установленную категорию ритуальной нечистоты.
theological_decisions:
- issue: Характер нечистоты
  choice: ритуальная нечистота («нечисты» для вас)
  alternative: осквернены; морально порочны
  rationale: Контекст устанавливает левитский статус ритуальной нечистоты, а не утверждает нравственную вину.
translation_notes:
  register: Современный литературный русский язык; юридическое условие выражено естественно и ясно. Собирательное «семя» передано множественным «семена», поэтому местоименная отсылка также дана во множественном числе.
