lexical_decisions:
- source_word: הַדָּאָה
  choice: коршуна
  rationale: Название хищной птицы точно не установлено. «Коршун» — естественный современный русский эквивалент, соответствующий вероятному значению; неопределённость отражена в сноске.
- source_word: הָאַיָּה
  choice: сокола
  rationale: Слово обозначает хищную птицу, которую могут отождествлять с соколом или коршуном. «Сокол» позволяет различить два еврейских названия, не выходя за пределы вероятного значения.
- source_word: לְמִינָהּ
  choice: по роду его
  rationale: Передаёт классификационное значение выражения «согласно его виду/роду» и сохраняет форму единственного числа с местоименным суффиксом.
- source_word: וְאֶת ... וְאֶת
  choice: и ... и ...
  rationale: Показатель прямого дополнения отдельно не переводится; повтор союзов сохранён как часть продолжающегося перечня.
