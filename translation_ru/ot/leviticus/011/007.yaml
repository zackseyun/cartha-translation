  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: ru
  text: 'И свинья: поскольку копыта у неё раздвоены и рассечены, но жвачки она не жуёт, нечиста она для вас.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: свинья
  rationale: Обычное современное русское название животного; еврейское слово обозначает вид в целом.
- source_word: כִּי
  choice: хотя
  rationale: В данном перечислении признак раздвоенного копыта противопоставлен отсутствию жевания жвачки; русское «хотя» естественно передаёт уступительно-противительный смысл в контексте, не меняя основания классификации.
- source_word: מַפְרִיס פַּרְסָה
  choice: копыта у неё раздвоены
  rationale: Естественно передаёт состояние расщеплённого копыта, описанное еврейским выражением.
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: и на копытах есть расщелина
  rationale: Сохраняет второе, усиливающее описание расщепления копыта, не сливая две еврейские формулы в одну.
- source_word: גֵּרָה לֹא יִגָּר
  choice: жвачки она не жуёт
  rationale: Общепонятное и точное русское обозначение данного физиологического признака; буквально выражение связано с подниманием жвачки.
- source_word: טָמֵא הוּא לָכֶם
  choice: нечиста она для вас
  rationale: Сохраняет ритуально-пищевую категорию и обращённость постановления к адресатам, не придавая слову значения нравственного зла.
theological_decisions:
- issue: Значение טָמֵא в пищевом законодательстве
  choice: нечиста в ритуально-пищевом смысле
  alternative: осквернена; нечистоплотна; нравственно порочна
  rationale: В Левите 11 речь идёт об установленном для Израиля различении животных по чистоте, а не о нравственной порочности самого животного.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Сохранены оба параллельных описания раздвоенного копыта и финальная конструкция «для вас».
