base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/030.yaml
  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: ru
  text: геккон[a], варан, ящерица, песчаная ящерица и хамелеон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное определение нескольких животных в этом стихе неизвестно. הָאֲנָקָה также понимают как хорька или землеройку; הַכֹּחַ — как хамелеона; הַחֹמֶט — как сцинка или, по старой традиции, улитку; הַתִּנְשָׁמֶת — как крота либо другой вид ящерицы.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: геккон
  rationale: Точное определение животного неизвестно. В контексте перечня мелких ползающих существ вероятнее пресмыкающееся; «геккон» — понятное современное соответствие, а неопределённость отмечена в сноске.
- source_word: הַכֹּחַ
  choice: варан
  rationale: Слово, вероятно, обозначает крупную ящерицу. «Варан» естественно передаёт это значение и отличает животное от других ящериц в перечне.
- source_word: הַלְּטָאָה
  choice: ящерица
  rationale: Общее название сохраняет предполагаемое зоологическое значение, не создавая ложной видовой точности.
- source_word: הַחֹמֶט
  choice: песчаная ящерица
  rationale: В данном перечне пресмыкающихся это вероятнее устаревшего толкования «улитка»; точная идентификация, включая возможность сцинка, остаётся спорной.
- source_word: הַתִּנְשָׁמֶת
  choice: хамелеон
  rationale: Хотя в другом контексте это еврейское слово обозначает птицу, здесь оно входит в перечень ползающих существ. «Хамелеон» — распространённое контекстуальное соответствие, но не бесспорное.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая структура еврейского перечня сохранена. Союз «и» перед последним элементом соответствует естественной русской норме, тогда как многократный וְ перед каждым названием не воспроизводится механически.
