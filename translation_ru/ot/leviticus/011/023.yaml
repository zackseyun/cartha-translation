id: LEV.11.23
reference: Leviticus 11:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף אֲשֶׁר ל֖/וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: ru
  text: А всякое крылатое роящееся существо[a], у которого четыре ноги[b], мерзость для вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ползающее существо, которое летает». Еврейское выражение широко обозначает мелких летающих существ, особенно насекомых.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «четыре ноги»; еврейское слово может также обозначать ступни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: А всякое
  rationale: Союз וְ здесь возвращает речь от разрешённого исключения в предыдущем стихе к общему запрету; русское «а» естественно передаёт это противопоставление, а «всякое» — распределительное значение כֹל.
- source_word: שֶׁרֶץ הָעֹוף
  choice: крылатое роящееся существо
  rationale: Сочетание обозначает мелких летающих существ, особенно насекомых. «Роящееся существо» передаёт категориальное значение שֶׁרֶץ, а «крылатое» — значение הָעֹוף, не сужая выражение до современной зоологической классификации.
- source_word: אֲשֶׁר לוֹ
  choice: у которого
  rationale: Естественная русская передача относительной конструкции со значением обладания.
- source_word: אַרְבַּע רַגְלָיִם
  choice: четыре ноги
  rationale: רַגְלַיִם может обозначать ноги или ступни; применительно к таким существам современное русское «ноги» звучит естественнее и сохраняет прямой смысл текста.
- source_word: שֶׁקֶץ
  choice: мерзость
  rationale: В пищевом и ритуальном контексте слово обозначает нечто отвратительное и запретное. «Мерзость» сохраняет сильную именную формулировку еврейского текста, не подменяя её общим термином «нечистое».
- source_word: הוּא לָכֶם
  choice: мерзость для вас
  rationale: 'Именное предложение буквально выражает: «оно — мерзость для вас». Русская конструкция без связки естественна в настоящем времени и сохраняет обращённость нормы к адресатам.'
theological_decisions:
- issue: Характер оценки שֶׁקֶץ
  choice: «мерзость для вас»
  alternative: «нечисто для вас»
  rationale: Источник употребляет שֶׁקֶץ, а не обычный термин ритуальной нечистоты טָמֵא; поэтому более сильная оценка сохранена без сведения её только к технической категории нечистоты.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественно-правовой формулировкой. Сохранены образность «роящееся» и сильная оценка «мерзость», а пояснения вынесены в сноски.
