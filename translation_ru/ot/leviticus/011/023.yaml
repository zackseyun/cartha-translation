  source_fidelity: 'Перевод точно передаёт все основные элементы еврейского текста: противопоставительное «А», всеохватность כֹל, категорию שֶׁרֶץ הָעוֹף без неоправданного сужения, относительное определение, буквально сохранённые «четыре ноги» и именную оценку שֶׁקֶץ לָכֶם. Неоднозначность древней классификации летающих мелких существ не устраняется искусственно.'
