  text: сыча[a], баклана и филина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точная идентификация этих птиц остаётся неопределённой. «Сыч», «баклан» и «филин» — вероятные традиционные или научные соответствия; כּוֹס можно также передать как «сова» или «сплюшка», שָׁלָךְ — как «пеликан», а יַנְשׁוּף — как «рогатая сова» или «сова-филин».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: сыча
  rationale: Еврейское слово обозначает одну из нечистых птиц, вероятно небольшую сову, однако точный вид неизвестен. «Сыч» естественно передаёт вероятную идентификацию как небольшой совы, не превращая название в слишком широкую категорию.
- source_word: הַשָּׁלָךְ
  choice: баклана
  rationale: Точная идентификация спорна; «баклан» — традиционное и правдоподобное соответствие для ныряющей водной птицы. Неопределённость и вариант «пеликан» отмечены в сноске.
- source_word: הַיַּנְשׁוּף
  choice: филина
  rationale: Слово, вероятно, обозначает крупную ночную птицу из совиных. «Филин» конкретнее общего «сова» и соответствует распространённой идентификации, хотя установить точный вид невозможно.
- source_word: וְאֶת
  choice: и
  rationale: Повторяющиеся союз וְ и показатель прямого дополнения אֶת продолжают перечень. По-русски естественно поставить запятые и сохранить союз перед последним элементом.
