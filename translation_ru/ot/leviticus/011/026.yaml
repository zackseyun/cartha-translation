base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: ru
  text: Все животные, у которых копыто раздвоено, но не полностью[a], и которые не жуют жвачку, нечисты для вас. Всякий, кто прикоснётся к ним, станет нечист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не рассекает расщелину»; однокоренная еврейская конструкция подчёркивает, что копыто раздвоено не полностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: Все животные
  rationale: Предлог לְ вводит рассматриваемую категорию, а собирательно-дистрибутивное единственное число далее согласуется с местоимениями во множественном числе. По-русски это естественно передаётся формой «все животные».
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: у которых копыто разделено
  rationale: Еврейское сочетание обозначает наличие разделённого копыта; выбранная формулировка ясна и сохраняет связь с последующим уточнением о полном раздвоении.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: но не раздвоено полностью
  rationale: Сочетание однокоренных существительного и глагола уточняет, что копыто не имеет полного расщепления. «Раздвоено полностью» естественно передаёт этот смысл, не вводя лишней зоологической конкретизации.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: не жуют жвачку
  rationale: Буквально речь идёт о поднимании жвачки, но «жевать жвачку» — общепринятый и точный русский эквивалент данного физиологического действия.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: нечисты для вас
  rationale: «Нечисты» сохраняет установленную лексику обрядовой чистоты в Левите, а «для вас» передаёт לָכֶם и правовую направленность предписания.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Всякий, кто прикоснётся к ним
  rationale: Причастная конструкция с כָּל имеет обобщающее значение. Будущая форма совершенного вида естественно выражает отдельный случай прикосновения и его последствие.
- source_word: יִטְמָא
  choice: станет нечист
  rationale: Имперфект указывает на юридически установленное последствие прикосновения. «Станет нечист» ясно выражает переход в состояние ритуальной нечистоты.
theological_decisions:
- issue: Терминология чистоты в законах Левита
  choice: нечист / нечисты
  alternative: осквернён / ритуально нечист
  rationale: Еврейское טָמֵא здесь обозначает категорию обрядовой нечистоты, а не обязательно нравственную вину. Традиционное и понятное «нечист» сохраняет сакрально-правовой смысл, не добавляя толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Множественное число в первой фразе естественно передаёт переход исходного текста от собирательного единственного числа к местоимениям множественного числа; различие между разделённым и полностью раздвоенным копытом сохранено.
