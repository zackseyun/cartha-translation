  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֥ר אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: ru
  text: 'И сказал Яхве[a] Моисею и Аарону, говоря им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится как «Господь».'
    reason: Указывает еврейскую форму имени и общеизвестный традиционный вариант перевода.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма wayyiqtol вводит новое событие повествования; «сказал» естественно передаёт формулу божественной речи по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно обозначает адресатов речи; повтор предлога перед вторым именем не требует механического воспроизведения.
- source_word: לֵאמֹר אֲלֵהֶם
  choice: говоря им
  rationale: Сохранены и формула введения прямой речи, и явное указание на обоих адресатов, хотя оборот имеет слегка приподнятый библейский характер.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. «Яхве» прямо передаёт тетраграмматон, тогда как «Господь» отражает традицию замещения; вариант «Иегова» основан на более позднем смешанном чтении.
translation_notes:
  register: Современный литературный русский с сохранением торжественной формулы прямой божественной речи. Оборот «говоря им» намеренно сохраняет формальную избыточность еврейского текста.
