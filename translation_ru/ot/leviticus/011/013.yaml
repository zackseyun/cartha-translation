  source_fidelity: 'Перевод точно передаёт структуру и смысл еврейского текста: предписание считать перечисленных птиц отвратительными, запрет употреблять их в пищу, повторную квалификацию שֶׁקֶץ и три наименования птиц. Разделительное «из птиц» адекватно передаёт מִן־הָעוֹף. Повтор «считайте отвратительными ... они отвратительны» обоснованно сохраняет повтор корня שׁקץ, не подменяя его термином «нечистый».'
  naturalness: Текст звучит естественно на современном литературном русском. Конструкция «Из птиц считайте отвратительными следующих» несколько формальна, но уместна для законодательного перечня и ясно вводит последующие названия. «Их нельзя есть» — современная и нормативно ясная передача пассивного запрета.
  terminology: «Орёл», «бородач» и «чёрный гриф» являются допустимыми рабочими соответствиями, а существенная зоологическая неопределённость всех спорных названий надлежащим образом оговорена в сносках. «Бородач» и пояснение «ягнятник» современны и понятны. Сноски привязаны к соответствующим словам и не навязывают спорную идентификацию как несомненную.
