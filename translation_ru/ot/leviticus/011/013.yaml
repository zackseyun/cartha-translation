source:
  edition: WLC
  text: וְ/אֶת אֵ֨לֶּה֙ תְּשַׁקְּצ֣וּ מִן הָ/ע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת הַ/נֶּ֨שֶׁר֙ וְ/אֶת הַ/פֶּ֔רֶס וְ/אֵ֖ת הָ/עָזְנִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: ru
  text: 'Из птиц считайте отвратительными следующих: их нельзя есть, они отвратительны — орёл[a], бородач[b] и чёрный гриф[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейские названия птиц в этом перечне не всегда удаётся определить точно. Слово, переведённое как «орёл», могло обозначать крупную хищную птицу вообще или даже грифа.
    reason: lexical_alternative
  - marker: b
    text: Точное отождествление этой птицы не вполне достоверно. Возможно, имеется в виду бородач, называемый также ягнятником.
    reason: lexical_alternative
  - marker: c
    text: Отождествление этой птицы спорно. В переводах и исследованиях предлагались также скопа, орлан и один из видов грифов.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: считайте отвратительными
  rationale: Порода Piel передаёт не только чувство отвращения, но и предписанное отношение к данным птицам как к недопустимой пище. Формулировка сохраняет оценочную и правовую силу глагола.
- source_word: מִן הָעוֹף
  choice: из птиц
  rationale: 'Предлог מִן имеет здесь разделительное значение: перечисляются отдельные виды из общего разряда птиц. В данном контексте עוֹף естественно передать словом «птицы».'
- source_word: לֹא יֵאָכְלוּ
  choice: их нельзя есть
  rationale: Страдательная форма выражает запрет на употребление этих птиц в пищу. Безличная русская конструкция звучит современно и сохраняет нормативную силу.
- source_word: שֶׁקֶץ
  choice: отвратительны
  rationale: Слово обозначает предмет установленного отвращения, особенно в пищевых предписаниях. Перевод сохраняет повтор с однокоренным глагольным выражением и не сводит значение только к ритуальной нечистоте.
- source_word: הַנֶּשֶׁר
  choice: орёл
  rationale: Традиционное и лексически допустимое соответствие, хотя древнееврейское название могло охватывать крупных хищных или питающихся падалью птиц; неопределённость отмечена в сноске.
- source_word: הַפֶּרֶס
  choice: бородач
  rationale: Название часто отождествляют с бородачом, то есть ягнятником (Gypaetus barbatus). Это современное русское название, но ввиду неуверенности идентификация вынесена также в сноску.
- source_word: הָעָזְנִיָּה
  choice: чёрный гриф
  rationale: Такое отождествление встречается в современной научной традиции и соответствует контексту крупных птиц-падальщиков, однако точный вид неизвестен; это оговорено в сноске.
theological_decisions:
- issue: Характер обозначения שֶׁקֶץ в пищевом постановлении
  choice: «отвратительны» с сохранением повтора
  alternative: «нечисты» или «мерзость»
  rationale: Исходный текст употребляет שׁקץ, а не обычный термин טמא «нечистый». Поэтому перевод сохраняет особую лексику отвращения и не подменяет её более широким понятием нечистоты.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным тоном правового предписания. Начальная конструкция «Из птиц… следующих» естественно передаёт разделительное מִן; повтор «отвратительными — отвратительны» намеренно сохраняет лексический повтор оригинала. Названия птиц даны в общепонятной форме, а зоологическая неопределённость раскрыта в сносках.
