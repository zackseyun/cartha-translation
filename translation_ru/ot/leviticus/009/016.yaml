  text: וַ/יַּקְרֵ֖ב אֶת הָ/עֹלָ֑ה וַֽ/יַּעֲשֶׂ֖/הָ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: ru
  text: И он принёс жертву всесожжения и совершил её по установленному порядку[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как было предписано».'
    reason: 'Лексическая альтернатива: כַּמִּשְׁפָּט может быть передано либо существительным, подчёркивающим установленный порядок, либо более краткой формулировкой о предписании.'
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: принёс
  rationale: Порода hифиль от קרב означает «приблизить, поднести, представить». В контексте жертвоприношения «принёс» естественно передаёт поднесение жертвы, не смешивая его с последующим совершением обряда.
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: עֹלָה — устойчивое обозначение жертвы, целиком сжигаемой на жертвеннике. «Жертва всесожжения» — точный и общепонятный русский библейский термин.
- source_word: וַיַּעֲשֶׂהָ
  choice: совершил её
  rationale: Глагол עשה имеет широкое значение «делать, совершать»; здесь речь идёт об исполнении жертвенного обряда. «Совершил её» сохраняет эту широту и ритуальный смысл, не сужая значение до приготовления или сожжения.
- source_word: כַּמִּשְׁפָּט
  choice: по установленному порядку
  rationale: מִשְׁפָּט здесь обозначает предписанную норму или установленный способ совершения обряда. Этот перевод сохраняет нормативный и процедурный смысл и звучит естественно по-русски.
