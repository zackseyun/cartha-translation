  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: ru
  text: Он омыл внутренности и голени и сжёг их[a] на жертвеннике поверх всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскурил их». В жертвенном контексте глагол указывает на ритуальное сожжение приношения на жертвеннике, при котором оно обращается в дым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: омыл
  rationale: Глагол רחץ обозначает омовение водой; «омыл» естественно передаёт ритуальное действие в возвышенном, но понятном регистре.
- source_word: הַקֶּרֶב
  choice: внутренности
  rationale: В контексте жертвоприношения קֶרֶב обозначает внутренние части животного; «внутренности» точно и естественно передаёт этот конкретный смысл.
- source_word: הַכְּרָעָיִם
  choice: голени
  rationale: Двойственное число כְּרָעַיִם указывает на нижние части ног животного; «голени» сохраняет анатомическую конкретность без громоздкого пояснения.
- source_word: וַיַּקְטֵר
  choice: воскурил
  rationale: В породе хифиль глагол קטר в священническом контексте означает предать жертву огню на жертвеннике, чтобы она восходила дымом. «Воскурил» сохраняет культовый оттенок, в отличие от общего «сжёг».
- source_word: עַל הָעֹלָה
  choice: поверх всесожжения
  rationale: Предлог עַל здесь указывает на размещение этих частей над уже находившимся на жертвеннике всесожжением; «поверх» ясно передаёт пространственное отношение.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» является точным и узнаваемым русским библейским термином.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс -ה вместе с контекстом движения к месту сожжения естественно передаётся русским предложным оборотом «на жертвеннике».
