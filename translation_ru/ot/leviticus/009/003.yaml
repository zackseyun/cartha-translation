source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: ru
  text: 'А сынам Израиля скажи: «Возьмите козла в жертву за грех[a], а также телёнка и ягнёнка, годовалых, без изъяна, во всесожжение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в жертву очищения» — так можно передать еврейское חַטָּאת в священнических жертвенных установлениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: А сынам Израиля
  rationale: Союз и предлог переданы естественной русской связкой «а» с дательным адресата; «сынам Израиля» сохраняет форму древнееврейского мужского множественного числа и корпоративное обозначение народа.
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: скажи
  rationale: В контексте предписания форма имеет побудительную силу. Русское «скажи» естественно объединяет глагол речи и формулу введения прямой речи, не меняя адресата.
- source_word: קְחוּ
  choice: Возьмите
  rationale: Форма является повелительным наклонением во множественном числе; «возьмите» прямо передаёт основное значение לקח без добавления идеи принесения к определённому месту.
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Сочетание обозначает самца козы; русское «козёл» ясно сохраняет указание на пол животного.
- source_word: לְ/חַטָּאת
  choice: в жертву за грех
  rationale: В священническом жертвенном контексте חטאת обозначает вид жертвы. Традиционное русское выражение понятно читателю, а возможный акцент на очищении сохранён в сноске.
- source_word: וְ/עֵגֶל וָ/כֶבֶשׂ
  choice: а также телёнка и ягнёнка
  rationale: עגל и כבש переданы их обычными видовыми обозначениями; «а также» естественно присоединяет два животных, предназначенных для другого вида жертвы.
- source_word: בְּנֵי שָׁנָה
  choice: годовалых
  rationale: Форма множественного числа относится и к телёнку, и к ягнёнку; русское множественное определение сохраняет это распределённое согласование.
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: В жертвенном законодательстве слово обозначает отсутствие телесного дефекта; «без изъяна» точно и естественно передаёт это требование.
- source_word: לְ/עֹלָה
  choice: во всесожжение
  rationale: עֹלָה — жертва, целиком сжигаемая на жертвеннике. «Всесожжение» является точным и узнаваемым русским наименованием этой жертвенной категории.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; детям Израиля
  rationale: Основной текст сохраняет мужскую форму и образ родства оригинала, не нейтрализуя его и не сужая корпоративное обращение до частной группы.
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: жертва очищения
  rationale: Термин называет установленную жертвенную категорию и допускает как связь с грехом, так и акцент на очищающей функции. В основном тексте использовано наиболее узнаваемое обозначение, а содержательно важная альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественной прямой речи, при этом сохранены адресат, перечень животных, их возраст, отсутствие изъяна и различие жертвенных категорий.
