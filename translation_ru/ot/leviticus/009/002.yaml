  terminology: '«Яхве», «жертва за грех» и «всесожжение» уместны и последовательно передают соответственно יהוה, חַטָּאת и עֹלָה. Имя «Аарон» передано нормативно. Сноску следует исправить: выражение «сын крупного скота» по-русски семантически и стилистически неудачно; буквальный образ лучше пояснить как «сын стада».'
