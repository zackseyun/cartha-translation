base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: ru
  text: 'И сказал он Аарону: «Возьми себе тельца из стада[a] для жертвы за грех и барана для всесожжения, и того и другого без изъяна, и представь их перед Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «телец, сын стада», то есть молодое животное крупного рогатого скота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Сохраняет обычное для еврейского повествования присоединение следующего действия, не усиливая временную последовательность словом «тогда».
- source_word: קַח לְךָ
  choice: Возьми себе
  rationale: Передаёт личную направленность дательного לְךָ и естественно звучит по-русски.
- source_word: עֵגֶל בֶּן בָּקָר
  choice: тельца из крупного скота
  rationale: Естественно обозначает молодое животное крупного рогатого скота, а буквальное приложение сохранено в сноске.
- source_word: לְחַטָּאת
  choice: для жертвы за грех
  rationale: В данном жертвенном контексте חַטָּאת обозначает вид жертвы, а не только грех как отвлечённое понятие.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: «Всесожжение» — ясный и устоявшийся русский термин для жертвы עֹלָה.
- source_word: תְּמִימִם
  choice: обоих без изъяна
  rationale: Форма множественного числа относится к обоим животным; «обоих» делает эту связь явной.
- source_word: וְהַקְרֵב
  choice: и представь их
  rationale: Порода Hiphil глагола קרב означает «приблизить, представить». Выбор «представь» не смешивает доставление животных с последующим совершением жертвы.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Передаёт культовое значение пребывания перед Божьим лицом и сохраняет личное имя יהוה.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; форма «Яхве» передаёт личное имя, не заменяя его титулом.
- issue: Значение חַטָּאת в названии жертвы
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Традиционное и понятное выражение «жертва за грех» сохраняет связь термина с грехом; альтернативное название подчёркивает очистительную функцию обряда, но в основном тексте могло бы чрезмерно сузить многозначность термина.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейскому, но формулировки понятны современному читателю; технические жертвенные термины переданы устоявшимися русскими соответствиями.
