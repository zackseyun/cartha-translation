  verdict: revise
  source_fidelity: 'Смысл жертвенных терминов передан точно: חַטָּאת — «жертва за грех», עֹלָה — «всесожжение», תְּמִימִם относится к обоим животным, а הַקְרֵב означает представить/привести перед Яхве. Однако «из крупного скота» в основном тексте несколько неудачно передаёт конструкцию עֵגֶל בֶּן־בָּקָר: это не выделение животного «из» некоторого множества, а устойчивое обозначение молодого животного КРС.'
