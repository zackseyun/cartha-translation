source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: ru
  text: 'И сказал Моисей: «Вот что Яхве повелел вам сделать, и явится вам слава Яхве».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вам явилась слава Яхве».'
    reason: Еврейскую заключительную часть можно понимать не только как последующее обещание, но и как указание на цель или результат исполнения повеления.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой продвигает повествование; обычная русская библейская формула естественно передаёт связь с предшествующим контекстом.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма имени.
- source_word: זֶה הַדָּבָר
  choice: Вот что
  rationale: Естественная современная русская передача буквально более конкретного «вот это дело/слово»; она сохраняет указание на предписанное действие без тяжеловесности оборота «вот то, что».
- source_word: צִוָּה
  choice: повелел
  rationale: Передаёт совершённое властное предписание и хорошо сочетается с инфинитивом «сделать».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: תַּעֲשׂוּ
  choice: вам сделать
  rationale: Передаёт обращение во множественном числе как содержание повеления.
- source_word: וְיֵרָא
  choice: и тогда явится
  rationale: Передаёт возможное последовательное или результативное значение формы, не превращая явление славы в ещё одно повеление.
- source_word: אֲלֵיכֶם
  choice: вам
  rationale: С глаголом «явиться» это естественная русская передача адресата явления.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: Прямо и традиционно передаёт сочетание, обозначающее явленное величие и присутствие Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; форма «Яхве» наиболее непосредственно передаёт его в современном русском переводе.
- issue: Смысл заключительной части וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה
  choice: 'последовательность/результат: «и тогда явится вам слава Яхве»'
  alternative: 'цель: «чтобы вам явилась слава Яхве»'
  rationale: Еврейский союз и глагольная форма допускают как координативное обещание будущего явления, так и оттенок цели или результата. Основной текст сохраняет прямую последовательность, а сноска фиксирует альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка краткая и доступная; личное имя «Яхве» сохранено. Маркер сноски поставлен после всей цитаты, к которой относится альтернативное прочтение.
