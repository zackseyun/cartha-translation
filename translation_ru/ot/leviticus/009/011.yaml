  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: ru
  text: А мясо и шкуру он сжёг в огне вне стана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И мясо и шкуру он сжёг в огне за пределами лагеря».'
    reason: Начальный союз וְ может передаваться как «И»; «за пределами лагеря» — современный вариант для «вне стана».
lexical_decisions:
- source_word: וְ/אֶת
  choice: А
  rationale: Союз וְ продолжает повествование и одновременно допускает лёгкий контраст с предыдущим стихом, где части жертвы были сожжены на жертвеннике; русское «А» естественно передаёт обе функции. אֵת — показатель прямого дополнения и отдельно не переводится.
- source_word: הַ/בָּשָׂר
  choice: мясо
  rationale: בָּשָׂר обозначает плоть или мясо животного; в конкретном описании частей жертвенного животного современное русское «мясо» звучит естественно и точно.
- source_word: הָ/עוֹר
  choice: шкуру
  rationale: עוֹר здесь обозначает снятый кожный покров животного; «шкура» точнее для жертвенного животного, чем более общее «кожа».
- source_word: שָׂרַף
  choice: он сжёг
  rationale: Глагол означает «жечь, сжигать»; совершенный вид передаёт завершённое действие в последовательности повествования.
- source_word: בָּ/אֵשׁ
  choice: на огне
  rationale: Сочетание предлога בְּ с «огнём» обозначает средство или среду сожжения; «на огне» — естественное русское выражение, не добавляющее отсутствующих деталей.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: вне стана
  rationale: Фраза указывает на место за пределами израильского лагеря; «вне стана» сохраняет ритуально-пространственный оттенок и остаётся понятным в библейском контексте.
theological_decisions:
- issue: Ритуальное уничтожение частей жертвы
  choice: Передать буквально как сожжение мяса и шкуры вне стана, не добавляя символического толкования.
  alternative: Встроить в перевод позднейшие типологические ассоциации.
  rationale: Древнееврейский текст описывает конкретное священническое действие; богословские связи не должны становиться частью самого перевода.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Стан» сохраняет ритуальный контекст, а сноска предлагает более общеупотребительное «лагерь».
