lexical_decisions:
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: «Всесожжение» — устоявшийся и точный русский термин для жертвы, целиком сжигаемой на жертвеннике; добавление слова «жертва» делает фразу понятнее в современном русском.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: ему подали
  rationale: В данном обрядовом контексте форма глагола מצא означает, что части жертвы доставили и передали Аарону. «Подали» естественно передаёт последовательную передачу частей служителю.
- source_word: לִנְתָחֶיהָ
  choice: часть за частью
  rationale: נֶתַח обозначает отдельную часть разделанной туши, а конструкция указывает на передачу жертвы по частям. Выражение сохраняет распределительное значение и звучит естественно.
- source_word: הָרֹאשׁ
  choice: голову
  rationale: Голова прямо выделена в исходном тексте среди остальных частей животного, поэтому это различие сохранено.
- source_word: וַיַּקְטֵר
  choice: сжёг всё это
  rationale: В жертвенном контексте קטר означает сжечь на жертвеннике, вознося в дыму. «Всё это» естественно выражает подразумеваемый совокупный объект — части и голову — без устранения грамматической сжатости исходника.
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Стандартное и ясное русское соответствие культовому выражению.
