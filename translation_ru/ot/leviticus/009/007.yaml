base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: ru
  text: 'И сказал Моисей Аарону: «Подойди к жертвеннику, принеси свою жертву за грех[a] и своё всесожжение и соверши искупление за себя и за народ. Затем принеси жертву народа и соверши искупление за них, как повелел Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою очистительную жертву». Еврейское слово חַטָּאת может обозначать жертву за грех, причём в некоторых контекстах подчёркивается очищение от ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב
  choice: Подойди
  rationale: Императив в культовом контексте означает приблизиться к жертвеннику; «подойди» естественно и точно передаёт прямое повеление.
- source_word: הַמִּזְבֵּחַ
  choice: к жертвеннику
  rationale: Стандартное обозначение культового жертвенника; определённость ясна из контекста.
- source_word: וַעֲשֵׂה
  choice: принеси
  rationale: Хотя глагол буквально значит «сделай», при названии жертвы он обозначает совершение жертвоприношения; по-русски естественно «принеси».
- source_word: חַטָּאתְךָ
  choice: свою жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает приношение, связанное с грехом и очищением; основное традиционное значение сохранено, а вариант отмечен в сноске.
- source_word: עֹלָתֶךָ
  choice: своё всесожжение
  rationale: Устоявшийся точный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: וְכַפֵּר
  choice: соверши искупление
  rationale: Передаёт широкий ритуально-богословский смысл כפר, не навязывая единственной теории искупления.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: за себя и за народ
  rationale: Предлог בְּעַד выражает действие ради кого-либо или от его имени; краткое русское «за» естественно сохраняет этот смысл.
- source_word: קָרְבַּן הָעָם
  choice: жертву народа
  rationale: קרבן — общее обозначение приношения; в данном контексте «жертва народа» звучит ясно и сохраняет конструкцию принадлежности.
- source_word: בַּעֲדָם
  choice: за них
  rationale: Сохраняет тот же представительский смысл предлога בְּעַד, что и ранее в стихе.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: как повелел Яхве
  rationale: Передаёт соответствие Божьему повелению; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может акцентировать как грех, так и ритуальное очищение. Основной текст сохраняет привычное и контекстуально верное обозначение, а возможный очистительный акцент указан в сноске.
- issue: Передача כפר
  choice: совершить искупление
  alternative: совершить очищение
  rationale: Формулировка сохраняет богословскую и ритуальную ёмкость еврейского глагола, не сводя его к одной узкой модели.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, непосредственно представленное в еврейском тексте, вместо замены его титулом.
