  terminology: «Шатёр встречи» является допустимой точной передачей אֹהֶל מוֹעֵד в данном проектном варианте. «Народ», «слава» и «Яхве» последовательны, естественны и не вносят конфессионального истолкования. Божественное имя передано в соответствии с указанным решением и еврейским текстом.
