base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: ru
  text: Моисей и Аарон вошли в шатёр встречи, а выйдя, благословили народ. И явилась всему народу слава Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Естественная и достаточно точная передача устойчивого культового наименования; «шатёр» соответствует переносному святилищу, а «встречи» сохраняет смысл назначенного места встречи.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: вошли ... выйдя
  rationale: Согласование по смыслу с составным подлежащим «Моисей и Аарон» поддерживается последующими формами множественного числа; деепричастие естественно передаёт тесную последовательность выхода и благословения.
- source_word: וַיְבָרֲכוּ
  choice: благословили
  rationale: Прямой русский эквивалент, не уточняющий сверх текста форму или содержание благословения.
- source_word: הָעָם / כָּל הָעָם
  choice: народ / всему народу
  rationale: В контексте обозначает собравшуюся общину Израиля; «народ» звучит естественно и сохраняет широту еврейского слова.
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: «Слава» сохраняет смысл зримого проявления Божьего величия, а личное имя передано как «Яхве».
- source_word: וַיֵּרָא
  choice: явилась
  rationale: Форма нифаль обозначает видимое проявление; «явилась» естественно сочетается со словом «слава» и сохраняет теофанический оттенок.
- source_word: אֶל כָּל הָעָם
  choice: всему народу
  rationale: Дательный падеж после «явилась» естественно передаёт направленность явления ко всему народу без добавления толкования.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерационная форма сохраняет личное заветное имя и соответствует предоставленному доктринальному решению, несмотря на внутреннее расхождение в английском консультационном слое.
- issue: Связь заключительной фразы с предшествующими действиями
  choice: И явилась всему народу слава Яхве
  alternative: Тогда всему народу явилась слава Яхве
  rationale: Простой союз сохраняет последовательность еврейских форм wayyiqtol, не вводя более явного временного или причинного оттенка, чем выражено в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Порядок слов в последнем предложении слегка приподнят, но остаётся понятным; он выделяет явление славы как кульминацию стиха. Прописные буквы не используются для нарицательного культового наименования.
