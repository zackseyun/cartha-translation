  source_fidelity: 'Русский текст точно передаёт последовательность еврейского повествования: Моисей и Аарон входят в אֹהֶל מוֹעֵד, выходят, благословляют народ, после чего всему народу является слава Яхве. Составное подлежащее обоснованно передано множественным числом. «Явилась» удачно отражает нифаль וַיֵּרָא без излишнего объяснения характера явления.'
