  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: ru
  text: Аарон совершил перед Яхве обряд потрясания грудных частей и правого бедра, как повелел Моисей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: грудные части
  rationale: В жертвенном контексте חָזֶה обозначает грудную часть животного; множественное число связано с несколькими жертвенными животными. «Грудные части» по-русски точнее и естественнее, чем анатомическое «груди».
- source_word: שׁוֹק הַיָּמִין
  choice: правое бедро
  rationale: שׁוֹק обозначает часть ноги, в данном жертвенном контексте традиционно и понятно передаваемую как «бедро»; הַיָּמִין — «правое».
- source_word: הֵנִיף ... תְּנוּפָה
  choice: совершил обряд возношения
  rationale: Сочетание однокоренных глагола и существительного обозначает ритуальное представление частей жертвы перед Яхве посредством особого движения. Формулировка сохраняет культовый смысл и избегает неясного буквального «потрясал потрясанием».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי передано прямо как «перед», а личное имя יְהוָה — как «Яхве», что сохраняет выраженное в еврейском тексте имя Бога.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: как повелел Моисей
  rationale: Краткая естественная формулировка передаёт точное соответствие действия ранее данному повелению Моисея.
- source_word: וְאֵת ... וְאֵת
  choice: грудных частей и правого бедра
  rationale: Повторяющийся показатель прямого дополнения координирует два объекта и не требует отдельного воспроизведения в русском.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога, поэтому транслитерация сохраняет различие между именем Яхве и титулом «Господь».
- issue: Характер действия הֵנִיף ... תְּנוּפָה
  choice: совершил обряд возношения
  alternative: потряс перед Яхве как потрясаемую жертву
  rationale: Точная кинематика обряда остаётся предметом обсуждения; перевод передаёт несомненный ритуальный характер действия, не навязывая конкретную реконструкцию движения.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Технический культовый оборот дан понятно, но без чрезмерного упрощения; подлинная неопределённость характера ритуального движения сохранена.
