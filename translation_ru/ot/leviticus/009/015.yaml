base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: ru
  text: Затем он представил приношение народа, взял козла для жертвы за грех, предназначенного для народа, заколол его и принёс его как жертву за грех[a] — так же, как первую жертву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил с ним очистительный обряд». Еврейский глагол в священническом контексте может обозначать очищение от осквернения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: принёс
  rationale: В породе хифиль глагол קרב в жертвенном контексте означает поднести или представить приношение. «Принёс» естественно передаёт ритуальное действие, не отождествляя его со всем процессом жертвоприношения.
- source_word: קָרְבַּן הָעָם
  choice: жертву народа
  rationale: קָרְבָּן — общее обозначение приношения, подносимого Богу; конструкция указывает на приношение от имени народа.
- source_word: שְׂעִיר הַחַטָּאת
  choice: козла для жертвы за грех
  rationale: שָׂעִיר обозначает козла, а חַטָּאת в данном жертвенном контексте — жертву за грех. Оборот с «для» естественен по-русски и ясно указывает на назначение животного.
- source_word: אֲשֶׁר לָעָם
  choice: предназначенного за народ
  rationale: 'Предлог ל выражает здесь предназначение и представительство: козёл приносится за народ, а не просто принадлежит ему.'
- source_word: וַיִּשְׁחָטֵהוּ
  choice: заколол его
  rationale: שחט — обычный глагол ритуального заклания животных; «заколол» сохраняет жертвенный оттенок точнее, чем общее «убил».
- source_word: וַיְחַטְּאֵהוּ
  choice: совершил над ним обряд жертвы за грех
  rationale: Пиэль от חטא в священнической речи обозначает действие, связанное с очищением или совершением обряда жертвы за грех. Формулировка не создаёт ложного впечатления, будто очищали самого козла, и не вводит отсутствующего здесь отдельного термина «искупление».
- source_word: כָּרִאשׁוֹן
  choice: как и над первым
  rationale: Выражение отсылает к первой жертве за грех в этой главе и указывает, что с козлом поступили тем же образом.
theological_decisions:
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: грех
  rationale: В Левите 9 слово обозначает установленный вид жертвы, а не абстрактный грех.
- issue: Значение וַיְחַטְּאֵהוּ
  choice: совершил над ним обряд жертвы за грех
  alternative: очистил его; принёс его за грех
  rationale: Еврейская форма допускает ритуально-очистительный оттенок. Основной перевод передаёт исполнение обряда, сохраняя неоднозначность и не утверждая, что очищению подвергался сам козёл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. «Заколол» и «жертва за грех» сохраняют ритуальную точность; синтаксис упрощён относительно еврейской цепочки предложений для естественного русского звучания.
