  source_fidelity: 'Перевод точно передаёт перечень: бык и баран предназначены для мирных жертв и принесения в жертву перед Яхве; отдельно названо хлебное приношение, смешанное с маслом. Причинно-временная фраза «Ведь сегодня Яхве явится вам» адекватно отражает כִּי הַיּוֹם и ожидаемое, ближайшее будущее נִרְאָה. Не добавлено упоминание «славы Яхве», которого в данном стихе нет.'
