  terminology: «Баран», «мирные жертвы» и «хлебное приношение» — точные, устоявшиеся и понятные термины для левитской жертвенной терминологии. «Яхве» последовательно передаёт тетраграмматон. Сноска к «мирным жертвам» корректно даёт жизнеспособные смысловые альтернативы.
