  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: ru
  text: и быка, и барана для мирных жертв[a], чтобы принести их в жертву перед Яхве, и хлебное приношение, смешанное с маслом. Ведь сегодня Яхве явится вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертв общения»; или: «жертв благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: бык
  rationale: Общее обозначение крупного рогатого скота в данном перечне естественно передаётся как «бык»; контекст требует жертвенного животного, но не даёт оснований добавлять иные характеристики.
- source_word: אַיִל
  choice: баран
  rationale: Слово обозначает взрослого самца овцы; «баран» — точный и обычный русский эквивалент в жертвенном контексте.
- source_word: שְׁלָמִים
  choice: мирные жертвы
  rationale: Традиционный русский культовый термин сохраняет связь корня с целостностью, благополучием и миром; допустимые смысловые варианты указаны в сноске.
- source_word: לִזְבֹּחַ
  choice: принести их в жертву
  rationale: В контексте обряда глагол означает жертвенное заклание; выбранная формулировка передаёт ритуальный смысл и естественно связывает инфинитив с названными животными.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: «Перед» кратко и точно передаёт пространственно-религиозный смысл לִפְנֵי, а личное имя יהוה передано как «Яхве».
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В книге Левит это установленный вид бескровного приношения из муки или зерновых продуктов; «хлебное приношение» — понятный и сложившийся русский библейский термин.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: смешанное с маслом
  rationale: Причастная конструкция описывает приготовление приношения путём смешивания с маслом; перевод современен и точен.
- source_word: כִּי הַיּוֹם
  choice: ведь сегодня
  rationale: כִּי вводит основание данного повеления, а הַיּוֹם подчёркивает время; «ведь сегодня» естественно выражает обе функции.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: явится вам
  rationale: Хотя форма глагола — перфект нифаля, в контексте ожидаемого в этот день явления она имеет предстоящее, близкое будущее значение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл утверждения о богоявлении
  choice: Яхве явится вам
  alternative: слава Яхве явится вам; Яхве явился вам
  rationale: Этот стих называет непосредственно Яхве, а не «славу Яхве», упомянутую далее. Контекст предстоящего события поддерживает будущее время без добавления отсутствующих в тексте слов.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной жертвенной терминологией. Синтаксис сохраняет продолжение перечня из предыдущего стиха. Имя Яхве передано единообразно; двусмысленность термина שְׁלָמִים отмечена сноской.
