  choice: Затем он заколол
  rationale: В контексте жертвоприношения שׁחט означает ритуальное заклание; «затем» естественно передаёт последовательность повествования.
- source_word: הָעֹלָה
  choice: жертву всесожжения
  rationale: Устоявшееся русское обозначение жертвы, полностью сжигаемой на жертвеннике; оно точно передаёт культовый термин עֹלָה.
- source_word: וַיַּמְצִאוּ
  choice: подали
  rationale: В данном обрядовом контексте сыновья Аарона доставили и передали кровь Аарону для нанесения на жертвенник; «подали» естественно описывает это действие.
- source_word: בְּנֵי אַהֲרֹן
  choice: Сыновья Аарона
  rationale: Прямое и естественное обозначение участников обряда в современном русском языке.
- source_word: אֵלָיו אֶת הַדָּם
  choice: подали ему кровь
  rationale: Сохраняется направление действия к Аарону и определённый обрядовый предмет — кровь жертвы.
- source_word: וַיִּזְרְקֵהוּ
  choice: он плеснул ею
  rationale: Глагол זרק при нанесении жертвенной крови обозначает энергичное бросающее движение, а не лёгкое разбрызгивание; «плеснул» понятно современному читателю и передаёт силу действия.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: на жертвенник со всех сторон
  rationale: Фраза указывает на нанесение крови вокруг жертвенника; «со всех сторон» ясно передаёт распределительное значение סָבִיב.
