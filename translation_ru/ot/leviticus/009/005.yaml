  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: ru
  text: Они принесли то, что повелел Моисей, перед шатёр встречи. Вся община приблизилась и встала перед Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное четырьмя еврейскими согласными יהוה (ЙХВХ).
    reason: Кратко поясняет непривычную для части русскоязычных читателей передачу тетраграмматона.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: принесли
  rationale: Хотя לקח обычно означает «взять», указание места назначения делает «принесли» естественным и контекстуально точным переводом.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: то, что повелел Моисей
  rationale: Относительное сочетание указывает на ранее названные предметы, которые Моисей велел принести; формулировка сохраняет лаконичность оригинала.
- source_word: אֶל־פְּנֵי
  choice: на место перед
  rationale: Выражение имеет пространственный смысл и обозначает направление к площадке перед шатром; этот перевод естественнее буквального «к лицу» и отличает оборот от последующего לִפְנֵי יְהוָה.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прозрачно передаёт оба элемента еврейского словосочетания и избегает менее понятного современному читателю традиционного термина «скиния».
- source_word: וַיִּקְרְבוּ
  choice: приблизилась
  rationale: Глагол קרב обозначает приближение; единственное число согласовано с собирательным существительным «община».
- source_word: כָּל־הָעֵדָה
  choice: вся община
  rationale: В священническом контексте עֵדָה обозначает собранное сообщество Израиля; «община» естественно передаёт коллективный и культовый смысл.
- source_word: וַיַּעַמְדוּ
  choice: встала
  rationale: Передаёт действие עמד и грамматически согласуется в русском языке с собирательным существительным «община».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняет одновременно пространственный и богослужебный смысл выражения, а личное имя передаёт непосредственно употреблённый в тексте тетраграмматон.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя Бога. Форма «Яхве» широко отражает принятую научную реконструкцию произношения и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-торжественным звучанием. Синтаксис близок к последовательности еврейского повествования; устранена неестественная буквальность пространственного оборота.
