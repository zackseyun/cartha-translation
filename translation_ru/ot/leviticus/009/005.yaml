  source_fidelity: 'В целом перевод точно передаёт последовательность действий и различает принесение предметов к шатру и приближение общины перед Яхве. Однако оборот «на место перед шатром» добавляет в текст существительное «место», которого в еврейском нет; пространственное значение אֶל־פְּנֵי можно передать по-русски прямо: «перед шатёр».'
