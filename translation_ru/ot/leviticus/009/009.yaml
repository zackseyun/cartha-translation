source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: ru
  text: Сыновья Аарона принесли ему кровь[a]. Он обмакнул палец в кровь и нанёс её на рога жертвенника[b], а затем вылил кровь у основания жертвенника[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднесли ему кровь». Употреблённый здесь еврейский глагол в обрядовом контексте может означать «поднести» или «представить».'
    reason: lexical_alternative
  - marker: b
    text: Рога жертвенника — выступы, находившиеся по его углам.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «к основанию жертвенника»; «основание» также может быть передано как «фундамент».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: принесли
  rationale: В породе хифиль глагол קרב означает «приблизить, поднести, представить». В данном повествовании «принесли» естественно передаёт действие сыновей Аарона, а ритуальный оттенок отмечен в сноске.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновья Аарона
  rationale: Прямой и естественный перевод сопряжённой конструкции, сохраняющий семейное и священническое обозначение.
- source_word: הַדָּם
  choice: кровь
  rationale: Речь идёт о конкретной крови принесённой жертвы; в русском языке определённость передаётся контекстом.
- source_word: אֵלָיו
  choice: ему
  rationale: Местоимение сохранено; из ближайшего контекста его наиболее естественным референтом является Аарон.
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  choice: обмакнул палец
  rationale: טבל обозначает погружение или обмакивание; для краткого погружения пальца в кровь современное русское «обмакнул» точно и естественно.
- source_word: וַיִּתֵּן עַל
  choice: нанёс её на
  rationale: Буквально נתן — «дал, положил», однако в данном обрядовом действии сочетание означает нанесение крови на жертвенник. Местоимение «её» ясно восстанавливает подразумеваемый объект — кровь.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: рога жертвенника
  rationale: Сохранён традиционный буквальный образ выступов по углам жертвенника; их устройство поясняется в сноске.
- source_word: יָצַק
  choice: вылил
  rationale: Глагол означает «лить, выливать»; форма «вылил» ясно передаёт намеренное излитие крови.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: к основанию жертвенника
  rationale: יְסוֹד означает «основание, фундамент», а предлог אֶל обычно выражает направление к цели. Перевод сохраняет эту направленность, не исключая пространственного понимания «у основания».
theological_decisions:
- issue: Референт местоимения אֵלָיו («ему»)
  choice: Кровь принесли Аарону.
  alternative: Кровь принесли к жертвеннику или к иному подразумеваемому объекту.
  rationale: В непосредственном контексте Аарон совершает обряд, а его сыновья помогают ему; поэтому Аарон — наиболее естественный референт местоимения. Само местоимение в переводе сохранено, и имя не подставлено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным и последовательным; культовые термины «рога жертвенника» и «основание жертвенника» сохранены без конфессионального истолкования. Добавленное для связности «а затем» обозначает последовательность действий, выраженную цепочкой еврейских повествовательных форм.
