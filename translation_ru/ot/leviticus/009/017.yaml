  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: ru
  text: Затем он поднёс хлебное приношение, набрал из него полную пригоршню[a] и сжёг её на жертвеннике сверх утреннего всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнил свою ладонь из него»; то есть взял рукой часть хлебного приношения, чтобы сжечь её на жертвеннике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: поднёс
  rationale: В породе хифиль глагол קרב в жертвенном контексте означает «приблизить, поднести, представить». «Поднёс» естественно передаёт ритуальное действие, не добавляя значения, которого нет в еврейском тексте.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В законодательстве Левита מִנְחָה обозначает установленное приношение из муки или зерновых продуктов, а не дар вообще. Традиционный русский термин «хлебное приношение» понятен и уместен в данном контексте.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: набрал из него полную пригоршню
  rationale: Буквальный образ — «наполнил свою ладонь из него». Русское выражение «набрал полную пригоршню» естественно передаёт действие и сохраняет указание на взятую рукой порцию; буквальная форма приведена в сноске.
- source_word: וַיַּקְטֵר
  choice: сжёг
  rationale: Хифиль глагола קטר в жертвенном контексте означает сжечь приношение на жертвеннике, обращая его в дым. «Сжёг» ясно и без лишней архаичности передаёт действие; местоимение «её» указывает на взятую пригоршню.
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Прямое и устойчивое обозначение места совершения жертвенного действия.
- source_word: מִלְּבַד
  choice: сверх
  rationale: Здесь предлог указывает, что хлебное приношение было сожжено в дополнение к регулярному утреннему всесожжению. «Сверх» кратко и ясно выражает добавочное значение.
- source_word: עֹלַת הַבֹּקֶר
  choice: утреннего всесожжения
  rationale: עֹלָה — установленная жертва всесожжения; определение הַבֹּקֶר указывает на регулярное утреннее жертвоприношение.
