    rationale: Термин традиционный, но в современном литературном русском без пояснения непрозрачен; «жировые части» точнее и доступнее передаёт культовое значение חֲלָבִים.
  - severity: low
    issue: Неудачны «пожрал» и повтор субъекта «весь народ… люди»
    rationale: «Поглотил» лучше соответствует русскому описанию действия огня, а устранение повтора делает фразу естественной.
  revised_text: И огонь вышел из присутствия Яхве[a] и поглотил на жертвеннике всесожжение и жировые части. Увидев это, все люди радостно воскликнули и пали ниц.
