base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: ru
  text: И огонь вышел из присутствия Яхве[a] и поглотил на жертвеннике всесожжение и жировые части. Увидев это, все люди радостно воскликнули и пали ниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица Яхве»; также возможно: «из присутствия Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: вышел огонь
  rationale: Сохраняет яркую картину движения огня наружу и естественно звучит в русском повествовании.
- source_word: מִלִּפְנֵי יְהוָה
  choice: от Яхве
  rationale: Передаёт источник огня естественным русским оборотом; буквальная пространственная идиома пояснена в сноске, а личное имя יהוה сохранено.
- source_word: וַתֹּאכַל
  choice: пожрал
  rationale: Глагол буквально связан с поеданием; применительно к огню «пожрал» сохраняет образность еврейского текста и остаётся понятным.
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Прямой и общепринятый русский эквивалент предложного оборота.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: הַחֲלָבִים
  choice: тук
  rationale: Традиционный и точный культовый термин для предназначенных к сожжению жировых частей жертвы.
- source_word: וַיַּרְא כָּל הָעָם
  choice: весь народ увидел это
  rationale: Естественно передаёт коллективного субъекта; добавленное «это» ясно отсылает ко всему увиденному событию.
- source_word: וַיָּרֹנּוּ
  choice: люди воскликнули от радости
  rationale: Передаёт звонкий ликующий возглас, не превращая его в формальное пение; повтор субъекта устраняет неестественное согласование собирательного «народ» с множественным числом.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: пали ниц
  rationale: Краткий, dignified и общеупотребительный русский оборот, обозначающий падение лицом к земле в благоговении.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Характер реакции народа в וַיָּרֹנּוּ
  choice: воскликнули от радости
  alternative: издали ликующий возглас; возликовали
  rationale: Корень רנן допускает оттенки радостного крика и ликования. Перевод сохраняет явную радость, не уточняя без основания, было ли это пением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Термины «всесожжение», «тук» и оборот «пали ниц» сохраняют точность культового контекста; личное имя передано как «Яхве».
