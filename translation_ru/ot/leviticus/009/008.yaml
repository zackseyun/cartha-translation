  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: ru
  text: Тогда Аарон подошёл к жертвеннику и заколол телёнка для собственной жертвы за грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительной жертвы». Еврейское слово может обозначать жертву, связанную с устранением греха и ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: подошёл
  rationale: Глагол קרב обозначает приближение; «подошёл к жертвеннику» естественно передаёт конкретное движение в данном обрядовом контексте.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшееся и точное русское обозначение מזבח в контексте жертвоприношения.
- source_word: וַיִּשְׁחַט
  choice: заколол
  rationale: В жертвенном контексте שחט означает ритуальный убой животного; «заколол» точно и естественно передаёт это действие.
- source_word: עֵגֶל
  choice: телёнка
  rationale: עגל обозначает молодое животное крупного рогатого скота; «телёнок» — прямой русский эквивалент и соответствует ближайшему контексту.
- source_word: הַחַטָּאת
  choice: в жертву за грех
  rationale: В данном контексте חטאת обозначает категорию жертвы. Формулировка «жертва за грех» ясна современному читателю и сохраняет связь термина с грехом, не отрицая его очистительной функции.
- source_word: אֲשֶׁר לוֹ
  choice: предназначенную за него самого
  rationale: Оборот указывает, что эта жертва приносилась за самого Аарона, в отличие от последующих жертв за народ; «самого» ясно выражает контраст.
theological_decisions:
- issue: Передача חטאת в священническом жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин обозначает установленную категорию жертвы и связан как с грехом, так и с устранением ритуальной нечистоты. В основном тексте сохранено традиционное и понятное обозначение, а очистительный оттенок отмечен в сноске без разрешения дискуссионного вопроса в пользу одной функции.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified обрядовой лексикой. Синтаксис близок к последовательности еврейского текста, но естественен по-русски; местоименное уточнение подчёркивает, что жертва приносилась за самого Аарона.
