source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁמִינִ֔י קָרָ֣א מֹשֶׁ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו וּ/לְ/זִקְנֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: ru
  text: На восьмой день Моисей позвал Аарона, его сыновей и старейшин Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «созвал»; еврейский глагол в данном контексте допускает оба значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: На
  rationale: Еврейская повествовательная формула вводит новый эпизод. В современном русском её функцию естественно передаёт начало «На восьмой день» без тяжеловесного буквального «И было».
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: на восьмой день
  rationale: Прямая передача временного оборота без добавления отсутствующего в тексте пояснения о семи днях посвящения.
- source_word: קָרָא
  choice: позвал
  rationale: Глагол означает «позвать, призвать, созвать». «Позвал» звучит естественно в данном повествовательном контексте, а возможный более официальный оттенок отмечен в сноске.
- source_word: לְאַהֲרֹן
  choice: Аарона
  rationale: Традиционная русская форма личного имени; винительный падеж обусловлен управлением глагола «позвал».
- source_word: וּלְבָנָיו
  choice: его сыновей
  rationale: В священническом контексте בנים обозначает именно сыновей Аарона; местоимение ясно передаёт еврейский суффикс.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: и старейшин Израиля
  rationale: Устойчивое и понятное обозначение признанных руководителей и представителей Израиля.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным синтаксисом. Буквальная формула «И было» не воспроизведена, поскольку по-русски она звучит архаично; последовательность событий сохранена временным оборотом. Маркер сноски поставлен после всего предложения.
