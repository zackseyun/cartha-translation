base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: ru
  text: 'и жирные части от быка и от барана: курдюк, жир, покрывающий внутренности, почки и долю печени.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: и жирные части
  rationale: Множественное число חֲלָבִים в контексте жертвоприношения обозначает предписанные для сожжения жирные части, а не жир вообще.
- source_word: מִן הַשּׁוֹר
  choice: быка
  rationale: שׁוֹר обозначает животное из крупного рогатого скота; в данном контексте речь идёт о быке, принесённом в жертву за мир (Лев 9:4, 18).
- source_word: וּמִן הָאַיִל
  choice: и барана
  rationale: אַיִל в жертвенном контексте однозначно означает барана.
- source_word: הָאַלְיָה
  choice: курдюк
  rationale: Термин обозначает жирный хвост курдючной овцы; «курдюк» — точное и понятное современное русское анатомическое название.
- source_word: וְהַמְכַסֶּה
  choice: жир, покрывающий внутренности
  rationale: Субстантивированное причастие от כסה, «покрывать», в жертвенных перечнях относится к жиру, покрывающему внутренности; дополнение делает выражение ясным по-русски.
- source_word: וְהַכְּלָיֹת
  choice: почки
  rationale: Обычное анатомическое значение термина в жертвенных перечнях.
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: и долю печени
  rationale: יֹתֶרֶת הַכָּבֵד обозначает определённую часть печени или прилегающий к ней придаток; «доля печени» естественно передаёт традиционное понимание, не вводя излишней анатомической конкретизации.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; стих представляет собой продолжение предложения предыдущего стиха. Сохранён лаконичный перечень жертвенных частей. Термин «курдюк» предпочтён описательному «жирный хвост» как точный и общеупотребительный в данном значении.
