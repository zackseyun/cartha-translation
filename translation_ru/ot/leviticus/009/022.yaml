id: LEV.9.22
reference: Leviticus 9:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: ru
  text: Затем Аарон поднял руки[a] к народу и благословил его. Совершив жертву за грех[b], всесожжение и мирные жертвы[c], он сошёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «руку»; в еврейском тексте употреблено единственное число, но здесь, вероятно, имеется в виду жест поднятых для благословения рук.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очистительную жертву».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жертвы общения»; возможный смысл: «жертвы благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: поднял
  rationale: Глагол נשׂא в сочетании с «рукой/руками» обозначает поднятие; это естественно передаёт жест благословения.
- source_word: יָדוֹ
  choice: руки
  rationale: Масоретская форма грамматически стоит в единственном числе («его руку»), однако здесь она обозначает жест благословения, по-русски естественно выражаемый множественным числом; буквальный вариант отмечен в сноске.
- source_word: אֶל הָעָם
  choice: к народу
  rationale: Предлог אֶל выражает направленность жеста в сторону народа.
- source_word: וַיְבָרְכֵם
  choice: и благословил его
  rationale: Пиэль глагола ברך прямо означает «благословлять»; местоимение относится к собирательному существительному «народ».
- source_word: וַיֵּרֶד
  choice: он сошёл
  rationale: ירד означает движение вниз; «сошёл» кратко и естественно передаёт уход с возвышенного места у жертвенника.
- source_word: מֵעֲשֹׂת
  choice: совершив
  rationale: Конструкция מן с инфинитивом указывает на переход после завершённого действия; деепричастие естественно передаёт эту временную связь, не уточняя сверх текста устройство жертвенника.
- source_word: הַחַטָּאת
  choice: жертва за грех
  rationale: Устойчивый русский термин для данного вида левитской жертвы; функциональная передача «очистительная жертва» сохранена в сноске.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Традиционный и точный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: הַשְּׁלָמִים
  choice: мирные жертвы
  rationale: Устоявшееся обозначение категории שׁלמים; варианты, подчёркивающие общение или благополучие, указаны в сноске.
theological_decisions:
- issue: Передача жертвенной терминологии
  choice: В основном тексте употреблены термины «жертва за грех», «всесожжение» и «мирные жертвы».
  alternative: «Очистительная жертва»; для שׁלמים — «жертвы общения» или «жертвы благополучия».
  rationale: Устоявшиеся термины обеспечивают узнаваемость и последовательность в Левите, а сноски сохраняют функциональные оттенки спорных названий.
- issue: Число в выражении יָדוֹ
  choice: «руки» в основном тексте
  alternative: «руку»
  rationale: Единственное число исходной формы сохранено как реальная лексическая альтернатива в сноске, тогда как множественное число естественнее передаёт понимаемый жест священнического благословения.
translation_notes:
  register: 'Современный литературный русский язык с сохранением достоинства культового повествования. Порядок последней части слегка перестроен ради ясной русской синтаксической связи: сначала завершение жертвоприношений, затем нисхождение. Все смысловые элементы еврейского текста сохранены.'
