    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: жир
  rationale: В контексте жертвоприношения речь идёт о предназначенных для жертвенника жировых частях; «жир» прямо и естественно передаёт еврейское слово.
- source_word: כְּלָיֹת
  choice: почки
  rationale: Прямое анатомическое обозначение, сохраняющее конкретную деталь обряда.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: придаток печени
  rationale: Еврейское выражение обозначает добавочную часть или придаток при печени; этот вариант точен и привычен для русского описания жертвенного обряда.
- source_word: חַטָּאת
  choice: жертва за грех
  rationale: Традиционное и понятное обозначение данной категории жертвы; возможный функциональный смысл очищения сохранён в сноске.
- source_word: הִקְטִיר
  choice: воскурил
  rationale: В жертвенном контексте глагол означает предать огню на жертвеннике так, чтобы жертва восходила дымом; «воскурил» передаёт этот специальный культовый смысл.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительная форма в сочетании с глаголом воскурения естественно передаётся по-русски местом совершения действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
theological_decisions:
- issue: Передача חַטָּאת в священническом законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Слово связано как с грехом, так и с устранением ритуальной нечистоты. В основном тексте сохранено широко понятное название категории, а функциональный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Специальное слово «воскурил» сохранено ради точного обозначения жертвенного действия; синтаксис остаётся ясным для современного читателя.
