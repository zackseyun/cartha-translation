  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: А жир, почки и долю печени от жертвы за грех[a] он воскурил на жертвеннике, как и повелел Яхве Моисею.
  philosophy: optimal-equivalence
  footnotes:
