base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: ru
  text: Затем он заколол быка и барана — мирную жертву, предназначенную для народа. Сыновья Аарона поднесли ему кровь, и он окропил ею жертвенник со всех сторон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Затем он заколол
  rationale: Последовательная форма с וַ продвигает повествование; «затем» естественно передаёт ход действий, а «заколол» является точным русским глаголом для ритуального умерщвления жертвенного животного.
- source_word: הַשּׁוֹר
  choice: быка
  rationale: שׁוֹר обозначает животное крупного рогатого скота; в данном жертвенном контексте «бык» — естественное и традиционное русское соответствие.
- source_word: הָאַיִל
  choice: барана
  rationale: אַיִל точно обозначает взрослого самца овцы; «баран» прямо передаёт значение.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: жертву мирную
  rationale: Сохраняется устоявшееся русское библейское наименование, связанное с семантическим полем мира, целостности и благополучия; сноска отмечает возможные смысловые оттенки.
- source_word: אֲשֶׁר לָעָם
  choice: за народ
  rationale: Кратко и естественно выражает предназначение жертвы для народа или от его имени, не перегружая русскую фразу буквальным относительным оборотом.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: поднесли ему
  rationale: В ритуальном контексте глагол означает доставить или представить кровь совершающему служение; «поднесли» естественно передаёт церемониальное действие.
- source_word: וַיִּזְרְקֵהוּ
  choice: окропил ею
  rationale: זָרַק обозначает направленное нанесение крови на жертвенник, вероятно более сильное, чем лёгкое кропление. Однако «окропил» — понятный и принятый русский ритуальный термин; он не подразумевает простого разливания.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: жертвенник со всех сторон
  rationale: Передаёт нанесение крови на жертвенник по его периметру; «со всех сторон» естественно выражает distributive значение סָבִיב.
theological_decisions:
- issue: Значение названия שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Основной текст сохраняет широко узнаваемый русский термин, а сноска не сводит многозначное еврейское название лишь к одному богословскому оттенку.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным и компактным; традиционный культовый термин «мирная жертва» сохранён, но его более широкий смысл раскрыт в сноске.
