  source_fidelity: 'Перевод точно передаёт последовательность действий и смену числа подлежащего: «они положили» (וישימו), затем «он сжёг» (ויקטר). «Куски жира» уместно передаёт ритуальные жировые части во множественном числе; «на грудные части» соответствует על החזות в жертвенном контексте. «На жертвеннике» верно передаёт идиоматическое направление/место действия.'
