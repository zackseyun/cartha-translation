source:
  edition: WLC
  text: וַ/יָּשִׂ֥ימוּ אֶת הַ/חֲלָבִ֖ים עַל הֶ/חָז֑וֹת וַ/יַּקְטֵ֥ר הַ/חֲלָבִ֖ים הַ/מִּזְבֵּֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/020.yaml
  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: ru
  text: Они положили куски жира на грудные части, а он сжёг жир на жертвеннике.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «превратил жир в дым на жертвеннике».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Они положили
  rationale: Глагол שׂים означает «класть, помещать»; форма множественного числа сохранена без уточнения названных в контексте лиц.
- source_word: הַחֲלָבִים
  choice: куски жира / жир
  rationale: Множественное число обозначает отделённые жировые части жертвы. В первой части стиха «куски жира» передаёт эту конкретность, а при повторе естественное русское «жир» избегает тяжеловесности без изменения смысла.
- source_word: עַל הֶחָזוֹת
  choice: на грудные части
  rationale: В жертвенном контексте חָזֶה — грудная часть туши; такой перевод точнее и естественнее русского анатомического «груди» применительно к жертвенным животным.
- source_word: וַיַּקְטֵר
  choice: он сжёг
  rationale: В священническом ритуальном употреблении קטר означает сжигать жертвенную часть на жертвеннике с образованием дыма. Основной текст передаёт действие ясно, а буквальный дымовой оттенок отмечен в сноске.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительная форма после קטר идиоматически указывает место ритуального сожжения — на жертвеннике.
theological_decisions:
- issue: Смена подлежащего с множественного числа на единственное
  choice: «Они положили… а он сжёг»
  alternative: Уточнить подлежащие как «сыновья Аарона… Аарон»
  rationale: Еврейский текст сохраняет местоименные подлежащие неявными; перевод передаёт грамматическую смену, не добавляя имён из контекста.
translation_notes:
  register: Современный литературный русский язык с ясной ритуальной терминологией. Сноска [a] поставлена после выражения, к которому относится лексическая альтернатива, а не после «грудные части».
