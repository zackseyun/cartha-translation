  terminology: «Жертвенник» — устойчивый и точный термин. Глагол «сжёг» является нейтральной современной передачей культового הקטיר; сноска надлежащим образом сообщает более буквальный оттенок действия, связанный с дымом. Имена и богословские интерпретации не добавлены.
