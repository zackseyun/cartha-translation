  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: ru
  text: Пусть он не проверяет, хорошее оно или плохое[a], и не заменяет его. Но если всё же заменит его, то оно и животное, поставленное вместо него, будут святыней[b]; оно не подлежит выкупу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не исследует между хорошим и плохим». Имеется в виду, что при отделении десятины нельзя оценивать животных и выбирать их по качеству.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол усилен: «если действительно заменит». В таком случае святыней становятся оба животных — первоначальное и поставленное вместо него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר בֵּין טוֹב לָרַע
  choice: не разбирает, хорошее животное или плохое
  rationale: Пиэль בקר вместе с идиомой «между хорошим и плохим» означает качественный отбор животных; «разбирать» естественно передаёт оценивание и выбор в данном контексте.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: не заменяет его другим / если же всё-таки заменит
  rationale: Корень מור здесь обозначает замену одного животного другим; сочетание абсолютного инфинитива с личной формой передано усилительным «всё-таки».
- source_word: תְמוּרָתוֹ
  choice: заменившее его животное
  rationale: Речь идёт о другом животном, поставленном вместо первоначального; развёрнутая формулировка исключает неясность местоименной связи.
- source_word: קֹדֶשׁ
  choice: святыней
  rationale: В юридико-культовом контексте Левита слово обозначает посвящённость Богу; русское «святыня» сохраняет сакральный статус и хорошо сочетается со сказуемым в единственном числе еврейского текста.
- source_word: לֹא יִגָּאֵל
  choice: выкупить их нельзя
  rationale: Нифаль גאל обозначает невозможность выкупа из посвящённого статуса. Множественное «их» проясняет, что после незаконной замены священный статус имеют оба животных.
theological_decisions:
- issue: Юридико-культовый смысл посвящения и выкупа
  choice: «будут святыней; выкупить их нельзя»
  alternative: «будут священными; их нельзя купить обратно»
  rationale: Выбранная формулировка сохраняет богословски значимый культовый регистр קדש и גאל, не привнося более поздних доктринальных смыслов.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Императивная юридическая сила передана конструкциями «пусть не…» и «нельзя»; технические культовые понятия сохранены без архаизации.
