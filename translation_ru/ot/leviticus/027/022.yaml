source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: ru
  text: Если же он посвятит Яхве поле, купленное им[a], которое не относится к его наследственному владению,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приобретённое им поле»; то есть поле, купленное в отличие от земли, входящей в его родовое наследственное владение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Передаёт условие и одновременно обозначает переход к отличному от предыдущего случаю.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: поле, купленное им
  rationale: Естественно по-русски передаёт поле, приобретённое покупкой, и сохраняет противопоставление наследственной земле.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: которое не относится к его наследственному владению
  rationale: אֲחֻזָּה здесь обозначает наследственное земельное владение; оборот передаёт принадлежность к этой категории без неестественной русской кальки «не из поля».
- source_word: יַקְדִּישׁ
  choice: посвятит
  rationale: В данном культово-правовом контексте глагол означает отделение имущества как священного для Бога; «посвятит» звучит ясно и достойно.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, сохраняя предложное значение направления при глаголе «посвятить».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Характер земельного владения אֲחֻזָּה
  choice: наследственное владение
  alternative: собственность
  rationale: В законодательном контексте Левита речь идёт не просто о любой собственности, а о родовом земельном наделе, противопоставленном купленному полю.
translation_notes:
  register: Современный литературный русский язык с ясным юридико-культовым оттенком. Синтаксис сохраняет незавершённость условного предложения, продолжающегося в следующем стихе; запятая в конце соответствует структуре отрывка.
