  terminology: «Посвятит» удачно передаёт יַקְדִּישׁ в контексте обета и освящённого имущества. «Яхве» последовательно передаёт тетраграмматон. «Наследственное владение» корректно отражает אֲחֻזָּה как родовое земельное держание, противопоставленное купленному полю. Сноска привязана к «купленное им» и уместно поясняет юридическое противопоставление.
