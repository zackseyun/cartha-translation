base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: ru
  text: Если кто посвятит свой дом Яхве как святыню, священник оценит его — хорош он или плох[a]. Как священник оценит его, так и будет установлено[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между хорошим и плохим»; речь идёт о состоянии или качестве дома, учитываемом при оценке.'
    reason: cultural_note
  - marker: b
    text: 'Или: «так и останется в силе»; имеется в виду установленная священником оценка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Если кто
  rationale: Формула вводит случай из правовой практики. Русское «если кто» естественно передаёт условность и применимость нормы к любому человеку, не искажая мужскую форму единственного числа.
- source_word: יַקְדִּשׁ
  choice: посвятит
  rationale: В породе hифиль глагол означает отделить имущество для священного назначения. «Посвятит» ясно и естественно для современного русского языка.
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: Речь идёт о принадлежащем человеку доме как оцениваемом имуществе; возвратное «свой» соответствует русской норме.
- source_word: קֹדֶשׁ לַיהוָה
  choice: как святыню Яхве
  rationale: Сохраняется предикативный смысл священного статуса дома и непосредственно передаётся личное имя יהוה.
- source_word: וְהֶעֱרִיכוֹ / יַעֲרִיךְ
  choice: оценит
  rationale: Повтор одного русского глагола отражает повтор ערך и обозначает официальное установление стоимости священником.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: хорош он или плох
  rationale: Передаёт еврейскую формулу оценки качества или состояния дома без искусственной буквальности «между хорошим и плохим».
- source_word: כֵּן יָקוּם
  choice: так и останется
  rationale: В данном юридическом контексте установленная священником оценка сохраняет силу; формулировка понятна и одновременно удерживает образ устойчивости решения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя. «Яхве» сохраняет это различие и согласуется с указанным обновлённым решением проекта.
- issue: Статус посвящённого дома
  choice: как святыню Яхве
  alternative: святым для Яхве
  rationale: Существительное קֹדֶשׁ может быть передано как обозначение священного статуса или как «святыня». Выбранная формулировка ясно показывает, что дом отделяется Яхве, не уточняя сверх текста характер последующего пользования им.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, юридико-культовым регистром. Синтаксис упрощён для ясности, но повтор ключевого глагола «оценит» и двусмысленность формулы כֵּן יָקוּם сохранены.
