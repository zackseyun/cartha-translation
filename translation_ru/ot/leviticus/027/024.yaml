  terminology: «Юбилейный год» — устоявшаяся и понятная передача הַיּוֹבֵל. «Земельный надел» адекватно передаёт אֲחֻזַּת הָאָרֶץ как владение землёй; наследственный/родовой аспект остаётся в сноске как контекстуальное уточнение, а не как добавление к основному тексту.
