base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: ru
  text: В юбилейный год поле вернётся к тому, у кого оно было куплено, — к тому, кому принадлежит этот земельный надел[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к тому, чей это наследственный надел». Еврейское אֲחֻזַּת הָאָרֶץ означает земельное владение или надел; в данном контексте речь идёт о первоначальном родовом наделе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: В юбилейный год
  rationale: Естественная русская передача временной конструкции с בְּ и термина יוֹבֵל в контексте установлений о юбилейном годе.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: поле вернётся
  rationale: Глагол שׁוב выражает предусмотренное законом возвращение, а שָׂדֶה прямо означает «поле».
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: к тому, у кого он купил его
  rationale: 'Сохранена активная форма еврейского קָנָהוּ: подразумеваемый из контекста покупатель купил поле у прежнего владельца. Местоимение «его» согласуется с существительным «поле».'
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: к тому, чьим владением является эта земля
  rationale: אֲחֻזָּה обозначает владение или земельное держание. Формулировка сохраняет юридический смысл и не делает наследственный характер владения явным сверх текста стиха.
theological_decisions:
- issue: Характер אֲחֻזַּת הָאָרֶץ в законе юбилейного года
  choice: «чьим владением является эта земля»
  alternative: «чьим наследственным владением является эта земля»
  rationale: Контекст книги Левит связан с родовыми земельными владениями, однако само слово אֲחֻזָּה в данном стихе означает владение или держание. Наследственный оттенок отмечен в сноске, но не внесён в основной текст как безусловно выраженный.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным юридическим оттенком. Тире проясняет, что вторая конструкция «к тому» поясняет первую, а не обозначает другого человека.
