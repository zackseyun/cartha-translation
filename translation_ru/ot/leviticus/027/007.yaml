base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: ru
  text: Если же человеку шестьдесят лет или больше[a], то установленная тобою оценка для мужчины — пятнадцать шекелей, а для женщины — десять шекелей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «от шестидесяти лет и выше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: человеку шестьдесят лет или больше
  rationale: Еврейский оборот обозначает возраст от шестидесяти лет включительно; современная русская формулировка ясно передаёт этот порог без неестественной буквальности.
- source_word: זָכָר
  choice: за мужчину
  rationale: В данном возрастном и оценочном контексте речь идёт о лице мужского пола; «мужчина» звучит естественнее русского субстантивированного «самец» применительно к человеку.
- source_word: עֶרְכְּךָ
  choice: назначенная тобой стоимость
  rationale: Сохранено обращение во втором лице и технический смысл установленной оценки в законодательстве об обетах.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: пятнадцать шекелей
  rationale: Прямая передача числительного и единицы веса, служащей денежной мерой.
- source_word: לַנְּקֵבָה
  choice: за женщину
  rationale: Параллельно «за мужчину» обозначает лицо женского пола и естественно звучит по-русски.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: десять шекелей
  rationale: Прямая передача числа и единицы меры.
