base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: ru
  text: Если же это животное относится к числу нечистых[a], его можно выкупить по твоей оценке, прибавив к ней пятую часть; а если его не выкупят, оно будет продано по твоей оценке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть животное, принадлежащее к разряду ритуально нечистых животных.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: животное из нечистых
  rationale: Сочетание обозначает животное, принадлежащее к разряду ритуально нечистых; перевод сохраняет классифицирующий смысл предлога ב и естественно звучит по-русски.
- source_word: וּפָדָה
  choice: его следует выкупить
  rationale: פדה означает «выкупить». В условно-правовой формулировке форма описывает предусмотренный порядок действия; «следует» передаёт нормативный оттенок, не делая выкуп безусловной обязанностью, поскольку далее прямо предусмотрена возможность, что животное не будет выкуплено.
- source_word: בְעֶרְכֶּךָ
  choice: по твоей оценке
  rationale: עֵרֶךְ в Лев 27 обозначает установленную оценочную стоимость. Сохранено обращение во втором лице единственного числа к священнику, заданное контекстом.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: прибавив к ней пятую часть
  rationale: Еврейская идиома означает прибавление одной пятой к оценочной стоимости. Местоимение «к ней» ясно соотнесено с оценкой и передаёт смысл без тяжеловесной буквальности.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: а если его не выкупят
  rationale: Нифаль глагола גאל оставляет деятеля неопределённым; русская неопределённо-личная конструкция сохраняет это и звучит естественнее буквального пассива.
- source_word: וְנִמְכַּר
  choice: то пусть оно будет продано
  rationale: Нифаль имеет здесь значение правового предписания. Конструкция с «пусть» естественно передаёт нормативный пассив в современном русском языке.
theological_decisions:
- issue: Степень обязательности выкупа
  choice: его следует выкупить
  alternative: его можно выкупить / его надлежит выкупить
  rationale: Контекст допускает неосуществлённый выкуп, поэтому перевод не представляет выкуп как неизбежную безусловную обязанность, но сохраняет нормативный характер установленной процедуры.
translation_notes:
  register: Современный литературный русский язык с умеренно правовым оттенком. Синтаксис упрощён ради ясности, при этом сохранены условная структура, обращение к священнику во втором лице и неопределённость деятеля при выкупе.
