lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит условие, противопоставленное порядку, изложенному в предыдущем стихе.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: он всё же выкупит его
  rationale: Сочетание абсолютного инфинитива с личной формой глагола подчёркивает действие; «всё же выкупит» естественно передаёт эту эмфазу. Местоимение относится к нечистому животному из предыдущего стиха.
- source_word: וְיָסַף
  choice: то должен прибавить
  rationale: В данном законодательном контексте форма выражает обязательное следствие условия.
- source_word: חֲמִישִׁתוֹ
  choice: пятую часть
  rationale: Передаёт установленную надбавку в размере одной пятой; объект, от которого исчисляется доля, в еврейском тексте явно не повторён.
- source_word: עַל עֶרְכֶּךָ
  choice: к назначенной тобой стоимости
  rationale: עֵרֶךְ здесь обозначает установленную оценку, а суффикс второго лица мужского рода единственного числа обращён к священнику, который её назначает.
