  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: ru
  text: Если же он посвятит своё поле после юбилея[a], то священник рассчитает для него сумму сообразно числу лет, остающихся до юбилейного года, и она будет вычтена из твоей оценки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после юбилейного года».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твоя оценка будет уменьшена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: после юбилея
  rationale: Оборот указывает на время после наступления юбилея; «юбилей» в контексте Левита обозначает установленный юбилейный год.
- source_word: יַקְדִּישׁ
  choice: посвятит
  rationale: В данном культово-правовом контексте глагол означает отделить имущество как святыню; «посвятит» естественно передаёт это действие в современном русском языке.
- source_word: שָׂדֵהוּ
  choice: своё поле
  rationale: Возвратное притяжательное местоимение естественно передаёт принадлежность поля подлежащему.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: то священник рассчитает для него сумму
  rationale: חשב означает произвести расчёт, а הכסף здесь обозначает денежную сумму, определяемую священником.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: сообразно числу лет, остающихся
  rationale: Идиома עַל־פִּי выражает основание или пропорцию расчёта; добавление «числу» делает смысл естественным по-русски, не меняя содержания.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: до юбилейного года
  rationale: Фраза называет конечную точку периода, по которому производится пропорциональный расчёт.
- source_word: וְנִגְרַע
  choice: и она будет вычтена
  rationale: Нифаль глагола גרע выражает уменьшение или вычитание; женское местоимение соотнесено с русским словом «сумма».
- source_word: מֵעֶרְכֶּךָ
  choice: из установленной тобой оценки
  rationale: Суффикс второго лица единственного числа сохранён через «тобой»; «оценка» передаёт установленную в предшествующем законе оценочную величину.
theological_decisions:
- issue: Культовый смысл יַקְדִּישׁ
  choice: посвятит
  alternative: освятит
  rationale: «Посвятит» ясно обозначает передачу поля в священную сферу и не создаёт впечатления изменения внутренних качеств самого поля.
- issue: Суффикс второго лица единственного числа в מֵעֶרְכֶּךָ
  choice: из установленной тобой оценки
  alternative: из оценки
  rationale: Выбранный вариант сохраняет прямое обращение еврейского правового текста и не устраняет грамматически выраженного адресата.
- issue: Отнесение וְנִגְרַע
  choice: сумма будет вычтена из оценки
  alternative: оценка будет уменьшена
  rationale: Еврейская конструкция допускает описание уменьшения расчётной величины; основной текст сохраняет буквальную направленность «вычтена из», а сноска отмечает естественную смысловую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством культово-правового текста. Термины выбраны так, чтобы сохранить священный и денежно-оценочный аспекты без архаической тяжеловесности. Прямое обращение во втором лице единственного числа сохранено.
