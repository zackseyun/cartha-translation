  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: ru
  text: Тогда священник рассчитает для него сумму твоей оценки до юбилейного года, и в тот же день тот внесёт эту сумму как святыню для Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «святое для Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: тогда … рассчитает
  rationale: Порода piel глагола חשׁב здесь означает вычисление установленной суммы; «тогда» естественно передаёт последовательность предписаний.
- source_word: לּוֹ
  choice: ему
  rationale: Дательный суффикс указывает на человека, для которого священник производит расчёт.
- source_word: מִכְסַת
  choice: долю суммы
  rationale: מִכְסָה обозначает установленную долю или соответствующую часть; добавление «суммы» ясно выражает пропорциональный денежный расчёт до юбилея.
- source_word: הָעֶרְכְּךָ
  choice: суммы по твоей оценке
  rationale: עֵרֶךְ — технический термин главы для установленной оценки; форма сохраняет суффикс второго лица единственного числа и остаётся понятной по-русски.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: до юбилейного года
  rationale: Фраза задаёт конечный срок, относительно которого рассчитывается пропорциональная сумма.
- source_word: וְנָתַן
  choice: он отдаст
  rationale: נתן имеет широкое значение «дать, отдать». Местоимение сохраняет невыраженность субъекта в еврейском тексте, тогда как контекст указывает на посвятившего поле человека.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот же день
  rationale: Естественная русская передача временного выражения, подчёркивающая немедленное внесение суммы.
- source_word: קֹדֶשׁ לַיהוָה
  choice: как святыню Яхве
  rationale: Передаёт культовое посвящение суммы Богу; «святыня» естественнее буквального предикативного оборота, а более формальная передача приведена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Неявный субъект וְנָתַן
  choice: «он отдаст» — по контексту речь о человеке, посвятившем поле
  alternative: священник отдаст
  rationale: Священник рассчитывает сумму, но в контексте Левита 27 платит человек, посвятивший или выкупающий поле. Неуточнённое «он» не добавляет в основной текст отсутствующего существительного.
- issue: Передача קֹדֶשׁ לַיהוָה
  choice: «как святыню Яхве»
  alternative: «святое для Яхве»
  rationale: Оборот обозначает принадлежность и посвящённость Яхве. Основной вариант звучит естественно по-русски, а буквальная конструкция сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением юридико-культового характера предписания. Техническое значение עֵרֶךְ передано последовательно как «сумма по твоей оценке»; синтаксис остаётся ясным без излишнего разъяснения подразумеваемого субъекта.
