revisions:
- from: Тогда священник рассчитает ему долю суммы по твоей оценке до юбилейного года, и в тот же день он отдаст сумму по твоей оценке как святыню Яхве[a].
  to: Тогда священник рассчитает для него сумму твоей оценки до юбилейного года, и в тот же день тот внесёт эту сумму как святыню для Яхве[a].
  rationale: Исправлены неестественная конструкция о «доле суммы», потенциально неверная русская отсылка местоимения «он» к священнику и менее ясное оформление посвящения. Сохраняются адресное «твоей», временная формула «в тот же день», термин «юбилейный год» и буквальная альтернатива в сноске.
