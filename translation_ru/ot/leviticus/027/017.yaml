id: LEV.27.17
reference: Leviticus 27:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם מִ/שְּׁנַ֥ת הַ/יֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑/הוּ כְּ/עֶרְכְּ/ךָ֖ יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: ru
  text: Если он посвятит своё поле начиная с юбилейного года, твоя оценка останется в силе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Обычный условный союз, вводящий правовой казус.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: начиная с юбилейного года
  rationale: Предлог מִן обозначает исходную временную точку; формулировка естественно связывает оценку со сроком, отсчитываемым от юбилейного года.
- source_word: יַקְדִּישׁ
  choice: посвятит
  rationale: В данном культовом контексте глагол означает отделить имущество как святыню; «посвятит» по-русски передаёт это без тяжеловесности.
- source_word: שָׂדֵהוּ
  choice: своё поле
  rationale: Возвратное притяжательное местоимение естественно указывает на принадлежность поля субъекту действия.
- source_word: כְּעֶרְכְּךָ
  choice: твоя оценка
  rationale: Речь идёт об установленной адресатом денежной оценке; притяжательная конструкция сохраняет обращение второго лица.
- source_word: יָקוּם
  choice: останется в силе
  rationale: В правовом контексте קום выражает действительность и сохранение установленной оценки; это естественный современный русский юридический оборот.
theological_decisions:
- issue: Культовый смысл посвящения имущества
  choice: посвятит
  alternative: освятит
  rationale: «Посвятит» ясно передаёт передачу поля в священное назначение, тогда как «освятит» может создать впечатление изменения внутреннего качества предмета.
translation_notes:
  register: Современный литературный русский с лаконичным правовым тоном. Сохранено обращение во втором лице; архаические и конфессионально окрашенные формулы не использованы.
