  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно переводится как «Господь».'
    reason: Указывает исходную форму божественного имени и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма глагола דבר с последовательным ו вводит обычную повествовательную формулу речи. Русское «сказал» естественно передаёт её и не требует тяжеловесного «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל; имя מֹשֶׁה дано в принятой русской форме «Моисей».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейский инфинитив вводит содержание последующей речи. В современном русском перед прямой речью эту функцию естественно выполняет двоеточие, избегая буквального и стилистически тяжёлого «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное божественное имя, поэтому оно сохраняется в транслитерации. «Господь» заменяет имя титулом, а «Иегова» отражает позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейской повествовательной формулы. Двоеточие естественно связывает вводную формулу с речью в следующем стихе.
