  text: וְ/אִם נְקֵבָ֖ה הִ֑וא וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ שְׁלֹשִׁ֥ים שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: ru
  text: Если же это женщина, то назначенная тобой оценочная сумма составляет тридцать шекелей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Сочетание союза с условной частицей вводит противопоставленный предыдущему стиху случай; «если же» естественно передаёт и условие, и контраст.
- source_word: נְקֵבָה הִוא
  choice: это лицо женского пола
  rationale: נְקֵבָה обозначает женский пол и не ограничивается значением «женщина»; слово «лицо» ясно указывает на оцениваемого человека и позволяет естественно передать классифицирующую формулу.
- source_word: וְהָיָה
  choice: то ... —
  rationale: В законодательной формуле глагол вводит следствие условия; русская конструкция с «то» и именным сказуемым передаёт это естественно.
- source_word: עֶרְכְּךָ
  choice: назначенная тобой стоимость
  rationale: עֶרֶךְ в контексте Левита 27 — установленная оценочная сумма, а суффикс второго лица мужского рода единственного числа сохранён оборотом «тобой».
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: тридцать шекелей
  rationale: После числительного еврейское существительное стоит в единственном числе, но по-русски нормативна форма родительного множественного; упоминание серебра в этом стихе отсутствует.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной юридической формулировкой. Выражение «лицо женского пола» несколько официально, но точно и уместно в контексте установленной законом оценки; оно не сужает значение до взрослой женщины.
