  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: ru
  text: Но если тот, кто посвятил поле[a], выкупит его, то он должен прибавить к сумме твоей оценки ещё пятую часть[b], и поле останется за ним[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отделил поле как святыню».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пятую часть серебра твоей оценки».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поле будет принадлежать ему»; буквально: «оно будет стоять за ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Продолжает условное законодательное предписание и обозначает переход к иному случаю; «но если» естественно передаёт связь с предыдущим стихом.
- source_word: גָּאֹל יִגְאַל
  choice: всё же выкупит
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагольное действие. «Всё же выкупит» передаёт это усиление естественно для русского контекста, не добавляя отсутствующего в еврейском тексте глагола желания.
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Речь идёт о конкретном поле, упомянутом в предшествующем законодательстве; «поле» здесь точнее общего слова «земля».
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: тот, кто посвятил поле
  rationale: Причастие обозначает человека, отделившего поле для священного употребления. Повтор существительного вместо местоимения устраняет неясность русской конструкции.
- source_word: וְיָסַף
  choice: он должен прибавить
  rationale: В законодательном контексте форма выражает предписание, поэтому русское «должен» яснее передаёт обязательную силу нормы, чем простой глагол будущего времени.
- source_word: חֲמִשִׁית כֶּסֶף עֶרְכְּךָ
  choice: прибавить к сумме твоей оценки пятую часть
  rationale: Передаёт требование доплатить одну пятую от оценочной суммы; обращение во втором лице сохранено.
- source_word: וְקָם לוֹ
  choice: поле останется за ним
  rationale: Еврейская правовая идиома указывает на закрепление поля за выкупившим его человеком. Формулировка естественна по-русски и сохраняет итоговый статус владения.
theological_decisions:
- issue: Культовое значение הקדישׁ
  choice: посвятил
  alternative: освятил
  rationale: «Посвятил» ясно обозначает передачу или отделение имущества для священной цели и не создаёт впечатления, будто само поле подверглось обряду освящения.
- issue: Нормативная сила וְיָסַף
  choice: он должен прибавить
  alternative: он прибавит
  rationale: Контекст главы представляет правовое предписание, а не повествование или простое предсказание; модальная конструкция сохраняет эту силу.
- issue: Правовой результат וְקָם לוֹ
  choice: поле останется за ним
  alternative: оно будет принадлежать ему
  rationale: Выражение описывает закрепление поля за тем, кто его посвятил и затем выкупил. Выбранный вариант сохраняет связь с его прежним владением, не превращая идиому в богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с ясной правовой модальностью. Сакральная лексика сохранена без архаизации; еврейские идиомы переданы естественными русскими соответствиями, а их буквальная форма отмечена в сносках.
