source:
  edition: WLC
  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: ru
  text: Оценка, назначенная тобой за мужчину в возрасте от двадцати до шестидесяти лет, должна составлять пятьдесят шекелей серебра[a], по шекелю святилища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по священному шекелю». Речь идёт о священном нормативном стандарте веса шекеля.'
    reason: Лексическая альтернатива для בְּשֶׁקֶל הַקֹּדֶשׁ и краткое пояснение мерного значения выражения.
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: назначенная тобой оценка
  rationale: עֵרֶךְ здесь обозначает установленную в связи с обетом культово-правовую оценку, а суффикс второго лица сохранён оборотом «тобой»; речь не идёт о внутренней ценности человека.
- source_word: הַזָּכָר
  choice: мужчина
  rationale: В данной возрастной категории слово обозначает лицо мужского пола. «Мужчина» естественнее в современном русском, чем субстантивированное «мужского пола», и не нейтрализует половое различие текста.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: от двадцати до шестидесяти лет
  rationale: Так естественно и точно передаётся еврейская формула возрастного диапазона; пределы сохранены без добавочного толкования.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: пятьдесят серебряных шекелей
  rationale: Сочетание ясно передаёт количество, весовую единицу и металл, сохраняя древний термин «шекель».
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Предлог בְּ обозначает здесь мерный стандарт. «По священному шекелю» сохраняет связь с сакральной нормой и звучит естественно; «священный» передаёт הַקֹּדֶשׁ без излишнего уточнения «святилища».
- source_word: וְהָיָה ... וְהָיָה
  choice: должна составлять
  rationale: В законодательном контексте конструкция выражает установленное предписание, а не простое предсказание.
theological_decisions:
- issue: Половая категория оценки
  choice: мужчина
  alternative: лицо мужского пола; человек
  rationale: Текст прямо различает категории по полу и возрасту. Выбранная передача сохраняет мужской референт и не превращает его в общее обозначение человека.
- issue: Характер עֵרֶךְ в Левите 27
  choice: назначенная оценка
  alternative: ценность; стоимость
  rationale: Это установленная для обета сакрально-правовая сумма, а не утверждение о человеческом достоинстве или рыночной стоимости.
- issue: Стандарт священного шекеля
  choice: по священному шекелю
  alternative: по шекелю святилища
  rationale: Еврейское выражение указывает на нормативный сакральный вес. Более буквальная связь со «святилищем» возможна, поэтому она отмечена в сноске, без разрешения лексической неоднозначности в основном тексте.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Условная начальная конструкция делает длинную еврейскую именную категорию естественной по-русски; термин «шекель» сохранён, а культово-правовой смысл оценки выражен без канцелярской тяжеловесности.
