base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: ru
  text: Если же он беден и не может внести назначенную тобой сумму[a], пусть его поставят перед священником, и священник определит для него сумму. Священник определит её сообразно достатку давшего обет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «беден по сравнению с назначенной тобой суммой». Речь идёт о невозможности уплатить установленную сумму.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сообразно тому, чего достигнет рука давшего обет» — древнееврейское выражение, означающее его материальные возможности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ ... מֵעֶרְכֶּךָ
  choice: беден и не может внести назначенную тобой сумму
  rationale: מָךְ обозначает бедность, а сочетание с מִן и עֵרֶךְ в данном контексте указывает на неспособность уплатить установленную сумму. Развёрнутая формулировка естественна по-русски и сохраняет обращение во 2-м лице единственного числа.
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: пусть его поставят перед священником
  rationale: Неопределённо-личная конструкция передаёт каузативное «поставят» и не уточняет не названного в еврейском тексте исполнителя.
- source_word: וְהֶעֱרִיךְ אֹתוֹ ... יַעֲרִיכֶנּוּ
  choice: определит сумму за него ... определит её
  rationale: ערך в Левите 27 — технический термин установления денежной оценки человека по обету. «Определить сумму» яснее современному читателю, чем буквальное «оценить его», которое может восприниматься как оценка личных качеств.
- source_word: עַל פִּי אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  choice: сообразно достатку давшего обет
  rationale: Идиома «чего достигнет рука» обозначает материальные возможности. «Сообразно достатку» кратко и естественно передаёт финансовый смысл.
- source_word: הַנֹּדֵר
  choice: давшего обет
  rationale: Причастие обозначает человека, который дал обет; эта форма точна и естественна в русском юридико-культовом контексте.
