lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: оценит
  rationale: Глагол ערך в породе хифиль здесь означает установление денежной оценки посвящённого животного. «Оценит» естественно и точно передаёт юридически значимое действие священника.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычный русский эквивалент כֹּהֵן в левитском законодательстве; определённость понятна из контекста.
- source_word: אֹתָהּ
  choice: его
  rationale: Еврейское местоимение женского рода относится к животному; в русском род местоимения согласован с существительным «животное».
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: хорошее оно или плохое
  rationale: Так естественно передаётся еврейская конструкция «между хорошим и плохим», обозначающая оценку качества животного.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: как оценит священник
  rationale: Форма буквально содержит суффикс второго лица единственного числа («по твоей оценке»), за которым следует «священник»; контекст указывает, что обязательной является именно священническая оценка. Необычность еврейской формы отмечена в сноске.
- source_word: כֵּן יִהְיֶה
  choice: так и будет
  rationale: Формула утверждает окончательность и обязательную силу установленной священником оценки.
