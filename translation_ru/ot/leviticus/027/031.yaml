  text: וְ/אִם גָּאֹ֥ל יִגְאַ֛ל אִ֖ישׁ מִ/מַּֽעַשְׂר֑/וֹ חֲמִשִׁית֖/וֹ יֹסֵ֥ף עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/031.yaml
  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: ru
  text: Если же человек выкупит часть своей десятины[a], он должен прибавить к ней пятую часть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выкупая, выкупит»; это усилительная конструкция.'
    reason: Передаёт необычное сочетание инфинитива абсолютного с личной формой того же еврейского глагола, не приписывая условию смысл обязательности выкупа.
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Сочетание союза с условной частицей вводит частный случай внутри последовательности правовых предписаний; «если же» естественно передаёт и условность, и переход к иной ситуации.
- source_word: גָּאֹל יִגְאַל
  choice: непременно выкупит
  rationale: Инфинитив абсолютный перед личной формой того же глагола усиливает действие. Наречие «непременно» передаёт эту эмфазу, не приписывая человеку прямо не выраженного желания или намерения.
- source_word: אִישׁ
  choice: человек
  rationale: В данном правовом контексте существительное мужского рода обозначает отдельного человека; «человек» сохраняет форму единственного числа и звучит естественно в современном русском языке.
- source_word: מִמַּעַשְׂרוֹ
  choice: часть своей десятины
  rationale: 'Предлог מִן имеет здесь партитивное значение: выкупается некоторая часть из того, что составляет его десятину. «Часть своей десятины» ясно и естественно выражает этот смысл.'
- source_word: חֲמִשִׁיתוֹ
  choice: пятую часть
  rationale: Существительное обозначает одну пятую; в русском правовом предписании форма «пятую часть» точна и естественна.
- source_word: יֹסֵף עָלָיו
  choice: пусть прибавит к ней
  rationale: Каузативная форма יסף означает «прибавить», а עַל указывает на прибавление к основной сумме или стоимости. Местоимение «к ней» относится к выкупаемой части десятины.
