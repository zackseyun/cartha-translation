  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: ru
  text: 'И всякая десятина из крупного и мелкого скота[a]: каждое десятое животное, проходящее под жезлом[b], будет святыней для Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякая десятина крупного и мелкого скота». Далее уточняется, что десятиной считается каждое десятое животное при подсчёте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «под посохом». Животных по одному пропускали под пастушеским жезлом, чтобы пересчитать их.'
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מַעְשַׂר
  choice: И всякая десятина
  rationale: מַעְשֵׂר — установленный термин для десятой доли, отделяемой Богу; «всякая» естественно передаёт всеохватное וְכָל.
- source_word: בָּקָר וָצֹאן
  choice: из крупного и мелкого скота
  rationale: בָּקָר обозначает крупный рогатый скот, а צֹאן — коллективно мелкий скот, прежде всего овец и коз. Такое сочетание точно передаёт обе категории и естественно звучит по-русски.
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: каждое ... животное, прошедшее под посохом
  rationale: Оборот описывает последовательный пропуск животных под пастушеским посохом при подсчёте; «каждое» сохраняет распределительное значение כֹּל אֲשֶׁר.
- source_word: הָעֲשִׂירִי
  choice: каждое десятое животное
  rationale: Буквально это субстантивированное «десятое»; слово «животное» явно выражает подразумеваемое существительное и делает юридический смысл прозрачным.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: будет святыней
  rationale: Предикативное קֹדֶשׁ обозначает не просто нравственное качество, а принадлежность к сфере священного; «будет святыней» естественно передаёт эту культовую категорию.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל выражает посвящение и принадлежность, а тетраграмматон передан личным именем «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон. «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение קֹדֶשׁ в формуле посвящения
  choice: будет святыней для Яхве
  alternative: будет свято для Яхве; будет посвящено Яхве
  rationale: «Святыней» сохраняет культово-правовой статус отделённого Богу, тогда как «посвящено» несколько свободнее передаёт результат, а «свято» может восприниматься лишь как качество.
- issue: Уточнение подразумеваемого существительного при הָעֲשִׂירִי
  choice: каждое десятое животное
  alternative: десятое
  rationale: Контекст однозначно указывает на животных, проходящих при подсчёте; экспликация не устраняет содержательной неоднозначности и делает норму понятной современному читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и богослужебного контекста. Синтаксис сохраняет пояснительную структуру еврейского стиха; тире помогает ясно связать «десятину» с каждым десятым животным.
