  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: ru
  text: 'Если же человеку от пяти до двадцати лет, то установленная тобой оценка составляет: для мужчины — двадцать шекелей, а для женщины — десять шекелей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Передаёт условие и одновременно связывает этот случай с предыдущими предписаниями; в современном русском юридико-повествовательном контексте звучит естественнее буквального «и если».
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: человеку от пяти до двадцати лет
  rationale: Естественно передаёт еврейскую возрастную конструкцию; слово «человеку» эксплицирует подразумеваемое лицо, чья оценка определяется.
- source_word: וְהָיָה
  choice: должна составлять
  rationale: Передаёт предписывающую силу формы в нормативном контексте и естественно сочетается с суммой оценки.
- source_word: עֶרְכְּךָ
  choice: назначенная тобой оценка
  rationale: Сохраняет обращение во втором лице и специальное значение установленной суммы в контексте обетов, не сводя её к утверждению о человеческой ценности вообще.
- source_word: הַזָּכָר
  choice: мужчины
  rationale: Передаёт мужскую половую категорию в единственном числе в рамках таблицы оценок; родительный падеж обусловлен русской конструкцией «оценка мужчины».
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: двадцать шекелей
  rationale: Прямо сохраняет историческую единицу веса и расчёта без анахроничного пересчёта.
- source_word: וְלַנְּקֵבָה
  choice: а женщины
  rationale: Передаёт соответствующую женскую категорию и контраст с предыдущей суммой; эллипсис слова «оценка» естественен по-русски.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: десять шекелей
  rationale: Прямо передаёт число и историческую единицу, сохраняя установленное в тексте различие сумм.
theological_decisions:
- issue: Передача различающихся по полу категорий оценки в культово-правовом тексте
  choice: оценка мужчины… а женщины
  alternative: оценка лица мужского пола… а лица женского пола; за мужчину… за женщину
  rationale: Формулировка сохраняет две половые категории исходного текста как элементы нормативной шкалы, но не расширяет их до общего утверждения о достоинстве мужчин и женщин. Вариант «за мужчину» мог бы ошибочно внушить мысль о купле или выкупной цене.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным нормативным оттенком. Синтаксис упрощён ради ясности, при этом сохранены условная связь, возрастной диапазон, второе лицо адресата и обе суммы.
