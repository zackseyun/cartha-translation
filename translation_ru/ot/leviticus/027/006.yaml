- from: Если же возраст — от одного месяца до пяти лет, то твоя оценка для мужского пола должна составлять пять серебряных шекелей, а для женского пола твоя оценка — три серебряных шекеля.
  to: Если же человеку от одного месяца до пяти лет, то твоя оценка за лицо мужского пола должна составлять пять серебряных шекелей, а за лицо женского пола — три серебряных шекеля.
  rationale: Исправлена русская синтаксическая связь между установленной оценкой и лицом соответствующего пола; сохранены возрастной интервал, предписывающий характер, второе лицо в «твоя оценка» и все денежные величины. Сноски не требуются.
