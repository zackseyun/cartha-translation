  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: ru
  text: Если же человеку от одного месяца до пяти лет, то твоя оценка за лицо мужского пола должна составлять пять серебряных шекелей, а за лицо женского пола — три серебряных шекеля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ
  choice: от одного месяца
  rationale: Еврейское возрастное выражение буквально означает «от сына месяца»; по-русски естественно и точно передаётся как нижняя граница возраста — «от одного месяца».
- source_word: וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: до пяти лет
  rationale: Сохраняет верхнюю границу установленной законом возрастной категории, не добавляя отсутствующего в исходном тексте уточнения о включительности предела.
- source_word: עֶרְכְּךָ
  choice: твоя оценка
  rationale: В Лев 27 обозначает установленную денежную оценку при исполнении обета; местоименная форма сохраняет суффикс второго лица единственного числа.
- source_word: הַזָּכָר
  choice: для мужского пола
  rationale: Исходное слово указывает на пол, а не на возрастную или социальную категорию; эта формулировка применима ко всему диапазону от месяца до пяти лет.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: пять серебряных шекелей
  rationale: Прямо передаёт сумму и материал денежной меры; прилагательное «серебряных» звучит естественно в современном русском языке.
- source_word: וְלַנְּקֵבָה
  choice: для женского пола
  rationale: Сохраняет параллельную правовую классификацию по полу и не вводит возрастное обозначение вроде «девочка».
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: три серебряных шекеля
  rationale: Точно передаёт установленную сумму и сохраняет последовательность терминологии.
- source_word: וְהָיָה
  choice: должна составлять
  rationale: Передаёт предписывающую силу формы в законодательном контексте естественным современным русским оборотом.
theological_decisions: []
