base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: ru
  text: Он не должен заменять его или обменивать его[a] — хорошее на плохое или плохое на хорошее. Если же он всё-таки обменяет одно животное на другое[b], то оба животных станут святыней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте употреблены два близких, но разных глагола со значениями «заменять» и «обменивать».
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская конструкция усиливает глагол: «если всё-таки обменяет» или «если непременно обменяет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: не заменяет его
  rationale: Глагол חלף в породе hифиль здесь обозначает замену посвящённого животного другим; «заменяет» естественно передаёт это значение и сохраняет отличие от следующего глагола מוּר.
- source_word: יָמִיר אֹתוֹ
  choice: не обменивает
  rationale: מוּר в данном правовом контексте означает обмен одного животного на другое. «Обменивает» передаёт действие ясно и позволяет сохранить два разных глагола оригинала.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: хорошее на плохое или плохое на хорошее
  rationale: Прилагательные употреблены как существительные, а предлог ב обозначает предмет, получаемый при обмене; краткая русская формула сохраняет симметричный правовой контраст.
- source_word: וְאִם הָמֵר יָמִיר
  choice: если же он всё-таки обменяет
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение. «Всё-таки обменяет» естественно передаёт подчёркнутую фактичность действия, совершённого вопреки запрету.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: одно животное на другое
  rationale: Эта идиоматичная русская формулировка ясно выражает замену одного животного другим.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: и первоначальное животное, и заменившее его
  rationale: Местоимение указывает на исходное животное, а תְּמוּרָה — на животное, данное ему взамен. Формулировка явно показывает, что речь идёт об обоих.
- source_word: קֹדֶשׁ
  choice: будут святыней
  rationale: קֹדֶשׁ обозначает священный статус, принадлежность Богу. «Будут святыней» прямо передаёт этот статус и хорошо соответствует языку культового закона.
theological_decisions:
- issue: Статус первоначального и заменившего его животных после запрещённого обмена
  choice: Оба животных будут святыней.
  alternative: Святыней становится только животное, данное взамен, либо фраза лишь объявляет обмен недействительным.
  rationale: Фраза הוּא וּתְמוּרָתוֹ прямо называет и первоначальное животное, и его замену, а сказуемое קֹדֶשׁ присваивает священный статус обоим.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Повелительно-запретная конструкция «пусть не…» сохраняет личную форму оригинала; «будут святыней» передаёт культово-правовой статус без конфессионального уточнения.
