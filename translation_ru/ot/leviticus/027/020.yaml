source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: ru
  text: Но если он не выкупит поле или если он продал поле другому мужчине[a], то его уже нельзя будет выкупить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другому человеку». Буквально: «другому мужчине».'
    reason: Лексема אִישׁ буквально обозначает мужчину, но в правовом контексте может употребляться в обобщённом значении.
lexical_decisions:
- source_word: וְאִם
  choice: но если / или
  rationale: Первая частица продолжает условное постановление с оттенком противопоставления, а повторная конструкция естественно передаётся по-русски союзом «или».
- source_word: יִגְאַל / יִגָּאֵל
  choice: выкупит / нельзя будет выкупить
  rationale: В данном правовом контексте גאל обозначает выкуп посвящённой собственности. «Выкупить» точно и естественно передаёт как активную, так и пассивную формы.
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Речь идёт о конкретном поле, рассматриваемом в установлениях об оценке посвящённой собственности.
- source_word: מָכַר
  choice: продаст
  rationale: В русском условном предложении совершенный вид будущего времени естественно выражает завершённую продажу, влекущую указанное правовое последствие.
- source_word: לְאִישׁ אַחֵר
  choice: другому мужчине
  rationale: Передаёт явную мужскую форму существительного אִישׁ; возможное обобщённое значение отмечено в сноске.
- source_word: עוֹד
  choice: после этого… уже
  rationale: Сочетание ясно выражает прекращение возможности дальнейшего выкупа после продажи и естественно звучит по-русски.
theological_decisions:
- issue: Обобщённая мужская форма в правовом предписании
  choice: другому мужчине
  alternative: другому человеку
  rationale: Еврейский текст употребляет אִישׁ, существительное мужского рода. Основной текст сохраняет эту форму, а сноска отмечает возможное обобщённое понимание.
- issue: Правовой и сакральный смысл גאל
  choice: выкупить
  alternative: вернуть себе
  rationale: «Выкупить» сохраняет технический смысл возвращения посвящённой собственности за установленную плату, не добавляя посторонних богословских выводов.
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет достоинство законодательного текста, но избегает тяжеловесной пассивной конструкции. Местоимение «он» оставлено без уточнения, поскольку еврейский текст не называет субъект повторно.
