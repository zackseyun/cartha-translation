  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: ru
  text: А если тот, кто посвятил свой дом, выкупит его, он прибавит к оценённой тобой сумме серебра пятую часть[b], и дом будет принадлежать ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «пятую часть серебра твоей оценки». В контексте этой главы оценку устанавливает священник.'
    reason: Поясняет, что доплата составляет одну пятую оценённой суммы, сохраняя буквальное упоминание серебра и контекст оценки.
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: посвятивший дом
  rationale: Причастие от קדשׁ обозначает человека, который отделил дом как святыню для Господа; «посвятивший» естественно передаёт культово-правовой смысл по-русски.
- source_word: יִגְאַל
  choice: захочет выкупить
  rationale: В этом сакрально-правовом контексте גאל означает вернуть имущество посредством выплаты; условная конструкция естественно передаётся словами «захочет выкупить».
- source_word: בֵּיתוֹ
  choice: дом
  rationale: בַּיִת здесь означает недвижимое имущество, подлежащее оценке; «дом» точнее, чем более эмоциональное «жилище».
- source_word: וְיָסַף חֲמִישִׁית
  choice: пусть он прибавит ... пятую часть
  rationale: Последовательная форма выражает предписанное действие после условия, а חֲמִישִׁית буквально означает одну пятую.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: к назначенной тобой стоимости ... серебром
  rationale: עֶרְכְּךָ — оценка, назначенная адресатом закона, то есть священником в контексте главы; כֶּסֶף сохраняется как конкретное средство платежа — серебро.
- source_word: וְהָיָה לוֹ
  choice: дом снова станет его
  rationale: Клауза обозначает восстановление принадлежности дома после выкупа; «снова» ясно выражает подразумеваемое возвращение собственности, не меняя правового результата.
theological_decisions:
- issue: Культовый термин для имущества, отделённого Богу
  choice: посвятивший
  alternative: освятивший
  rationale: «Посвятивший» сохраняет сакральный смысл действия и при этом в современном русском яснее описывает передачу дома Господу; «освятивший» может быть понято как обряд освящения, а не правовое посвящение имущества.
translation_notes:
  register: Современный литературный русский с умеренно торжественным правовым оттенком. Синтаксис упрощён ради ясности, но культовая терминология и конкретное упоминание серебра сохранены.
