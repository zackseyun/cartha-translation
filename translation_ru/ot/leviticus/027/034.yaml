  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: ru
  text: Вот заповеди, которые Яхве заповедал Моисею для сынов Израиля на горе Синай.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые Яхве заповедал Моисею, чтобы передать сынам Израиля».'
    reason: 'Лексико-синтаксическая неоднозначность אֶל: предлог может обозначать предназначение заповедей для Израиля или направленность поручения Моисею к сынам Израиля.'
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: Вот заповеди
  rationale: Заключительная формула естественно передаётся по-русски конструкцией «Вот заповеди»; «заповеди» сохраняет юридическую силу מִצְוֺת.
- source_word: אֲשֶׁר צִוָּה
  choice: которые … дал
  rationale: В русском сочетание «дал заповеди» звучит естественнее, чем тавтологическое «заповедал заповеди», при этом передаёт смысл צִוָּה и связь с существительным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: Хотя אֶת формально отмечает прямое дополнение, русское управление в выражении «дать заповеди Моисею» требует дательного падежа.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: «Для» естественно выражает направленность заповедей к Израилю; буквальное «сынов Израиля» сохраняет образ и грамматическую форму исходного выражения.
- source_word: בְּהַר סִינָי
  choice: на горе Синай
  rationale: Обычная русская форма обозначения места при названии горы; соответствует בְּ в данном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя; транслитерация «Яхве» сохраняет его и не подменяет титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Формулировка сохраняет родовой образ еврейского выражения; по смыслу оно обозначает общину Израиля в целом, а не только мужчин.
- issue: Отношение אֶל к адресатам заповедей
  choice: для сынов Израиля
  alternative: сынам Израиля
  rationale: Предлог допускает понимание направленности к адресатам или предназначения для них; основной текст выбирает естественное русское «для», а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством заключительной законодательной формулы. Синтаксис сделан естественным для русского, при этом сохранены личное имя Яхве и выражение «сыны Израиля».
