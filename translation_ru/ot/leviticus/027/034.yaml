  naturalness: Предлагаемая формулировка литературна и понятна в современном русском, сохраняя торжественно-юридический регистр заключительной формулы. «Заповедал Моисею» несколько книжно, но уместно для данного жанра и точнее, чем «дал Моисею».
  terminology: '«Заповеди», «Яхве», «Моисей», «сыны Израиля» и «гора Синай» переданы последовательно. Сноска переформулирована, поскольку вариант «сынам Израиля» нельзя механически подставить в русское предложение с «заповедал Моисею»: два дательных падежа создают синтаксическую неясность.'
