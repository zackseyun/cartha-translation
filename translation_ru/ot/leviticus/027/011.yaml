id: LEV.27.11
reference: Leviticus 27:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: ru
  text: Если же это какое-либо нечистое животное, из которого нельзя принести приношение Яхве[a], то пусть он поставит животное перед священником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из которого не приносят приношения Яхве». В еврейском тексте стоит глагол во множественном числе с обобщённо-безличным значением.'
    reason: Сохраняет буквальную синтаксическую возможность и поясняет безличную силу формы יַקְרִיבוּ.
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Передаёт условие и одновременно противопоставляет этот случай чистым животным, о которых говорилось ранее.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: какое-либо нечистое животное
  rationale: כָּל при существительном в единственном числе имеет здесь неопределённое значение; «нечистое» обозначает ритуальный статус, а не физическую загрязнённость.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: из которого нельзя принести приношение
  rationale: Сохраняется значение מִמֶּנָּה («из него/которого») и культовый смысл הקריב и קָרְבָּן. Безличная конструкция с «нельзя» естественно передаёт обобщённое множественное число еврейского глагола.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не титулом.
- source_word: וְהֶעֱמִיד
  choice: то пусть он поставит
  rationale: Каузативная форма от עמד означает «поставить, заставить стоять»; частица «то» ясно обозначает следствие условия в русском законодательном изложении.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: перед священником
  rationale: Прямо и естественно передаёт формальное представление животного священнику для последующей оценки.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Характер нечистоты животного
  choice: нечистое
  alternative: непригодное для жертвы
  rationale: Сохранён культовый термин טמא без сведения его значения лишь к практической непригодности; относительное предложение отдельно поясняет невозможность такого приношения.
translation_notes:
  register: Современный литературный русский язык с ясным законодательным строем фразы. Культовые термины переданы последовательно и без архаизмов; формулировка сохраняет связь с последующей священнической оценкой животного.
