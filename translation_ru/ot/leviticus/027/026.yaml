  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: ru
  text: 'Но первенца из скота — того, который уже принадлежит Яхве как первенец, — никто не вправе посвящать: будь то бык или животное из мелкого скота[a], он принадлежит Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שֶׂה может означать овцу или козу.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: 'Передаёт ограничительно-противительный смысл: первенцы составляют исключение из предшествующих правил о посвящении.'
- source_word: בְּכוֹר
  choice: первенца
  rationale: Обозначает первое рождённое животное; современное и естественное русское соответствие.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: который как первенец принадлежит Яхве
  rationale: Пассивная форма בכר указывает здесь на статус первенца, а не на человеческое действие; формулировка выражает уже существующее право Яхве на животное.
- source_word: בִּבְהֵמָה
  choice: из скота
  rationale: בהמה выступает как собирательное обозначение домашнего скота; сочетание «первенец из скота» естественно по-русски.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: никто не должен посвящать
  rationale: Hiphil קדש имеет культовый смысл посвящения. אִישׁ употреблено обобщённо, поэтому «никто» точно и естественно передаёт запрет без ненужного ограничения по полу.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: будь то бык или животное из мелкого скота
  rationale: Конструкция означает «будь то… или…». שֶׂה может обозначать овцу либо козу, поэтому более широкая формулировка сохраняет объём еврейского слова.
- source_word: לַיהוָה הוּא
  choice: он принадлежит Яхве
  rationale: Дательный оборот выражает принадлежность или законное право; глагол «принадлежит» ясно передаёт юридическую логику стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией согласно принятому в проекте подходу.
theological_decisions:
- issue: Почему первенца нельзя посвящать по обету
  choice: Его нельзя заново посвящать, потому что он уже принадлежит Яхве как первенец.
  alternative: Статус первенца сам по себе является освящением, без акцента на принадлежности.
  rationale: 'Заключительное לַיהוָה הוּא прямо поддерживает смысл принадлежности: человек не вправе посвятить в качестве особого дара то, на что Яхве уже имеет право.'
translation_notes:
  register: Современный литературный русский язык с сохранением культового термина «посвящать». «Животное из мелкого скота» несколько описательно, но точно сохраняет широту שֶׂה и не сужает смысл до одной овцы.
