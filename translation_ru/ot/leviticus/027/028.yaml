id: LEV.27.28
reference: Leviticus 27:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: ru
  text: Однако всё заклятое[a], что человек предаст Господу из принадлежащего ему — будь то человек, животное или поле, входящее в его наследственное владение, — нельзя ни продавать, ни выкупать. Всё заклятое — величайшая святыня Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Заклятое» (евр. хе́рем) — техническое обозначение того, что безвозвратно отдано Господу и потому не может быть продано или выкуплено; в некоторых контекстах это слово означает также находящееся под запретом или обречённое на уничтожение.
    reason: Сохраняет широкий и контекстно значимый смысл термина חֵרֶם, не сводя его к одному из возможных оттенков.
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Передаёт ограничительно-противительный переход от установлений о посвящённом по обету имуществе, которое можно выкупить, к безвозвратно преданному Господу.
- source_word: חֵרֶם / יַחֲרִם
  choice: заклятое / предаст Господу
  rationale: «Заклятое» сохраняет традиционный технический смысл חֵרֶם и его возможную связь с запретом или уничтожением; глагольная форма передана естественнее как «предаст Господу», а связь однокоренных форм разъясняется сноской.
- source_word: אִישׁ
  choice: человек
  rationale: В русском юридическом контексте обозначает отдельное лицо и не требует неестественного гендерного уточнения.
- source_word: לַיהוָה
  choice: Господу
  rationale: Передаёт тетраграмматон принятой русской библейской формой «Господь».
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: из принадлежащего ему
  rationale: Кратко и точно выражает принадлежность всего перечисляемого данному человеку.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: будь то человек, животное
  rationale: Сохраняет противопоставление человеческой и животной категорий без преждевременного истолкования правового статуса человека.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: или часть поля в его наследственном владении
  rationale: Предлог מִן указывает на нечто взятое из поля; אֲחֻזָּה обозначает наследственное земельное владение.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: нельзя ни продавать, ни выкупать
  rationale: Естественно передаёт две юридические пассивные формы и сохраняет техническое значение выкупа в контексте главы.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: великая святыня
  rationale: Передаёт еврейскую превосходную степень как высшую меру святости и звучит естественно в современном литературном русском.
- source_word: הוּא לַיהוָה
  choice: Господня
  rationale: Сжато передаёт принадлежность и посвящённость Господу, выраженную еврейской конструкцией.
theological_decisions:
- issue: Значение חֵרֶם в данном правовом контексте
  choice: В основном тексте — «заклятое», со сноской о безвозвратном посвящении Господу и возможном значении запрета или обречения на уничтожение.
  alternative: «посвящённое» или «обречённое на уничтожение»
  rationale: Контекст подчёркивает неотчуждаемость и высшую святость, но семантический диапазон חֵרֶם нельзя свести только к нейтральному посвящению или только к уничтожению.
- issue: Упоминание человека среди предметов חֵרֶם
  choice: Сохранено прямое «будь то человек» без пояснения в основном тексте.
  alternative: Истолковать как раба, зависимого человека или человека, обречённого на смерть.
  rationale: Сам стих говорит אָדָם и не уточняет ни статус человека, ни последствия; перевод сохраняет напряжённость текста, не навязывая толкования.
- issue: קֹדֶשׁ קָדָשִׁים как превосходная степень
  choice: «великая святыня»
  alternative: «святыня святынь» или «всесвято»
  rationale: Русская формула ясно выражает высшую степень святости, не создавая ошибочной предметной ассоциации со Святым святых скинии.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис упрощён для ясности, но сохранены перечисление, юридическая категоричность и богословская неоднозначность ключевого термина.
