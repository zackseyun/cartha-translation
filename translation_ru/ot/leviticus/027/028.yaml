revisions:
- from: Но всё заклятое[a], что человек предаст Господу из принадлежащего ему — будь то человек, животное или часть поля в его наследственном владении, — нельзя ни продавать, ни выкупать. Всё заклятое — великая святыня Господня.
  to: Однако всё заклятое[a], что человек предаст Господу из принадлежащего ему — будь то человек, животное или поле, входящее в его наследственное владение, — нельзя ни продавать, ни выкупать. Всё заклятое — величайшая святыня Господа.
  rationale: Убрано не имеющее основания в оригинале слово «часть». Формула о высшей святости уточнена с «великая святыня» до «величайшая святыня», чтобы яснее передать еврейскую превосходную конструкцию, без внесения конфессионального толкования. Сноска сохранена, поскольку она адекватно объясняет технический термин חֵרֶם.
