language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: ru
  text: А поле, когда оно освободится в юбилейный год, станет святыней Господа, как поле, преданное заклятию[a]; оно будет владением священника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как поле под заклятием». Еврейское слово означает нечто безвозвратно посвящённое Господу и изъятое из обычного человеческого пользования; в некоторых контекстах оно также связано с уничтожением.'
    reason: Сохраняет более буквальную альтернативу и широкий смысл еврейского חֵרֶם, не разрешая его контекстуальную неоднозначность.
lexical_decisions:
- source_word: וְהָיָה הַשָּׂדֶה
  choice: А поле ... станет
  rationale: Союз продолжает правовое установление и вводит следствие из предыдущего условия; «станет» естественно передаёт будущий результат.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: когда оно освободится в юбилейный год
  rationale: Буквально выражение означает «при его выходе», но в контексте юбилейного законодательства речь идёт об освобождении имущества в юбилейный год.
- source_word: קֹדֶשׁ לַיהוָה
  choice: святыней Господа
  rationale: Передаёт посвящённость поля YHWH и естественно звучит в современном русском языке; имя יהוה передано традиционным русским «Господь».
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: как поле, преданное заклятию
  rationale: '«Заклятие» сохраняет особый правовой и сакральный смысл חֵרֶם: неотменимое посвящение Богу с изъятием из обычного человеческого пользования, не сводя значение в данном контексте исключительно к физическому уничтожению.'
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: оно будет владением священника
  rationale: אֲחֻזָּה обозначает земельное владение, а конструкция с לַכֹּהֵן указывает на принадлежность или передачу священнику.
theological_decisions:
- issue: Значение חֵרֶם в законе о посвящённом поле
  choice: поле, преданное заклятию
  alternative: поле, обречённое на уничтожение; поле под заклятием
  rationale: В этом месте акцент лежит на безвозвратном посвящении поля Господу и его изъятии из обычного пользования. Формулировка «преданное заклятию» сохраняет строгость термина, но не утверждает, что именно это поле подлежит физическому уничтожению.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-сакрального установления. «Юбилейный год», «святыня», «заклятие» и «владение» сохраняют терминологические связи раздела и остаются понятными без архаического синтаксиса.
