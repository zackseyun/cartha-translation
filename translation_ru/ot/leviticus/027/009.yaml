  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: ru
  text: И если это животное, из которого приносят жертву Яхве[a], то всё, что от него дадут Яхве, будет святыней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из которого можно принести жертву Яхве». Еврейскую фразу можно понимать либо как указание на животное, пригодное для принесения из него жертвы, либо как описание животного, из которого жертву действительно приносят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет соединительную силу ו и условный характер продолжения закона.
- source_word: בְּהֵמָה
  choice: животное
  rationale: Современное общее обозначение животного; контекст уточняет его жертвенное назначение.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: из которого приносят жертву
  rationale: Передаёт жертвенное значение Hiphil יַקְרִיבוּ и исходное значение מִמֶּנָּה, не устраняя двусмысленность относительно пригодности или фактического принесения.
- source_word: קָרְבָּן
  choice: жертва
  rationale: В данном культовом контексте это наиболее естественный и понятный русский эквивалент.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя יהוה.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: всё, что от него отдадут
  rationale: Безлично-обобщённая русская конструкция естественно передаёт неопределённого деятеля и сохраняет отсылку к животному.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: будет святыней
  rationale: Именное קֹדֶשׁ обозначает не просто качество «святое», а предмет, посвящённый Богу; «святыней» точно и естественно передаёт юридико-культовый смысл.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация сохраняет эту особенность исходного текста.
- issue: Смысл описания животного
  choice: Сохранена формулировка «из которого приносят жертву»
  alternative: «которое можно приносить в жертву»
  rationale: Еврейская конструкция допускает понимание как животного, пригодного для такого приношения, так и животного, из которого действительно приносят жертву; основной текст и примечание сохраняют напряжение.
translation_notes:
  register: Современный литературный русский язык с достойным правовым и богослужебным оттенком. «Будет святыней» выбрано вместо менее естественного «будет святым», поскольку речь идёт о посвящённом предмете.
