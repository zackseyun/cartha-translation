  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: ru
  text: Никто из людей, преданный заклятию[a], не может быть выкуплен[b]; он непременно должен быть предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский термин обозначает то, что безвозвратно отдано под заклятие; здесь контекст указывает на человека. В некоторых контекстах он связан с обречением на уничтожение.
    reason: lexical_alternative
  - marker: b
    text: 'Возможен более буквальный перевод: «Всё, преданное заклятию из числа людей, не может быть выкуплено; оно непременно должно быть предано смерти».'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרֶם / יָחֳרַם
  choice: преданный заклятию
  rationale: 'Сохраняет повтор корня חרם и его особый сакрально-правовой смысл: человек безвозвратно отдан под заклятие. Формулировка не сводит термин заранее только к смертному приговору, хотя заключительная часть стиха прямо требует смерти.'
- source_word: מִן הָאָדָם
  choice: из людей
  rationale: В данном контексте указывает, что речь идёт о человеке, а не о неодушевлённой вещи. Русское «из людей» естественно передаёт категориальное значение еврейского оборота.
- source_word: יִפָּדֶה
  choice: не может быть выкуплен
  rationale: Глагол פדה обозначает выкуп или освобождение посредством выкупа; такой перевод соответствует правовому и сакральному контексту главы.
- source_word: מוֹת יוּמָת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает категоричность предписания. Страдательная конструкция исходного текста сохранена.
theological_decisions:
- issue: Значение חרם применительно к человеку
  choice: преданный заклятию
  alternative: обречённый на уничтожение; безвозвратно посвящённый
  rationale: Техническое выражение сохраняет связь между сакральным посвящением, запретом на выкуп и требованием смерти, не устраняя напряжения между этими сторонами понятия.
- issue: Грамматическое оформление человеческого референта
  choice: Никто из людей… он
  alternative: Всё заклятое, что предано заклятию из людей… оно
  rationale: Хотя חֵרֶם формально является существительным, дальнейшее מִן הָאָדָם уточняет, что здесь имеется в виду человек. Личная конструкция точнее и естественнее по-русски, а более буквальная структура отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством правового предписания. «Преданный заклятию» сохраняет библейский сакрально-юридический термин, а конструкция «никто из людей» делает человеческий референт ясным без громоздкой кальки.
