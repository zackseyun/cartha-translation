source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: ru
  text: 'Если человек посвятит Яхве часть своего наследственного поля[a], то твоя оценка должна определяться количеством семян, необходимым для его засева: участок, для которого требуется хомер ячменных семян, оценивается в пятьдесят серебряных шекелей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «часть поля из своего наследственного владения». Речь идёт о земле, закреплённой за родом как наследственное владение; предлог «из» показывает, что посвящается часть поля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: часть своего наследственного поля
  rationale: Предлог מִן указывает на часть поля, а אֲחֻזָּה обозначает земельное владение, обычно наследственное. Формулировка передаёт оба элемента естественным русским языком.
- source_word: יַקְדִּישׁ
  choice: посвятит
  rationale: В контексте Лев 27 глагол означает отделить имущество как святыню для Бога; «посвятит» естественно передаёт культово-правовой смысл.
- source_word: אִישׁ
  choice: человек
  rationale: В законодательном контексте существительное мужского рода имеет обобщённое значение; русское «человек» сохраняет единственное число и не сужает норму до взрослых мужчин.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה, прямо присутствующее в еврейском тексте.
- source_word: עֶרְכְּךָ
  choice: твоя оценка
  rationale: Сохранено обращение во втором лице единственного числа и специальное значение установленной оценки в контексте главы.
- source_word: לְפִי זַרְעוֹ
  choice: должна определяться количеством семян, необходимым для его засева
  rationale: Фраза устанавливает оценку по посевной вместимости поля, то есть по количеству требуемого семенного зерна. Развёрнутая передача исключает ошибочное понимание как урожайности.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: участок, для которого требуется хомер ячменных семян
  rationale: Передана техническая сельскохозяйственная мера площади через количество семенного ячменя объёмом в один хомер.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: оценивается в пятьдесят серебряных шекелей
  rationale: Предлог בְּ вводит установленную денежную оценку; формулировка ясна в современном русском и сохраняет древнюю единицу веса.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация сохраняет его отличие от титула «Господь».
- issue: Обобщённое אִישׁ в правовой норме
  choice: человек
  alternative: мужчина
  rationale: В данном условном законодательном предписании אִישׁ обозначает отдельное лицо как типичного участника ситуации; «человек» естественно сохраняет обобщённую юридическую силу, не вводя дополнительного ограничения по полу.
translation_notes:
  register: Современный литературный русский с достоинством законодательного текста. Синтаксис слегка развёрнут ради ясной передачи древней оценки площади по количеству семенного зерна; меры «хомер» и «шекель» сохранены без замены современными единицами.
