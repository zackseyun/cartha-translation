    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: назначенная тобой стоимость
  rationale: В Левите 27 עֵרֶךְ обозначает установленную оценочную стоимость при обетах и посвящениях; формулировка сохраняет технический смысл и суффикс 2-го лица мужского рода единственного числа.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному сиклю
  rationale: Предлог בְּ выражает меру или норматив, а שֶׁקֶל הַקֹּדֶשׁ — официальный священный весовой стандарт, применяемый при храмовых расчётах.
- source_word: גֵּרָה
  choice: гера
  rationale: Название древней малой единицы веса передано традиционной русской транслитерацией; после числительного «двадцать» употреблён родительный падеж множественного числа «гер».
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: в сикле должно быть двадцать гер
  rationale: Формулировка ясно передаёт определение установленного соотношения единиц и сохраняет предписывающую силу יִהְיֶה.
- source_word: וְכָל
  choice: И всякая
  rationale: 'Сохранены соединительный союз и распределительное значение כָּל: правило относится к каждой назначенной стоимости.'
- source_word: יִהְיֶה
  choice: должна определяться / должно быть
  rationale: В правовом контексте имперфект имеет предписывающую силу; «должна/должно» естественно передаёт её по-русски.
