source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: ru
  text: И всякая десятина с земли — от посевов и от плодов деревьев — принадлежит Яхве; она святыня Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: И всякая десятина с земли
  rationale: כָּל при существительном в единственном числе имеет распределительное значение «всякая». וְ передано союзом «и», поскольку стих продолжает законодательную речь. В сельскохозяйственном контексте הָאָרֶץ обозначает землю как источник урожая; русское «с земли» естественно связывает десятину с последующим перечислением.
- source_word: מַעְשַׂר
  choice: десятина
  rationale: Устоявшийся русский термин для десятой части урожая, отдаваемой в культовом контексте.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: от семян земли
  rationale: Сохраняется конкретный образ еврейского זֶרַע — «семя»; множественное число по-русски естественнее для собирательного обозначения посевного урожая.
- source_word: מִפְּרִי הָעֵץ
  choice: от плодов деревьев
  rationale: Еврейское единственное число имеет собирательное значение. Русское множественное число ясно выражает плоды плодовых деревьев и не меняет смысла.
- source_word: לַיהוָה הוּא
  choice: принадлежит Яхве
  rationale: Предлог לְ здесь выражает принадлежность или посвящение. «Принадлежит» ясно и естественно передаёт эту функцию, а הוּא относится к десятине.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не замещающий его титул.
- source_word: קֹדֶשׁ לַיהוָה
  choice: она святыня Яхве
  rationale: 'Краткая именная конструкция сохраняет культовый смысл: десятина отделена и посвящена Яхве. «Святыня» здесь естественнее и точнее предметного значения, чем прилагательное «свята».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение קֹדֶשׁ לַיהוָה
  choice: она святыня Яхве
  alternative: она свята для Яхве; она посвящена Яхве
  rationale: «Святыня» сохраняет одновременно идею святости и культовой отделённости, не сводя выражение только к принадлежности и не усиливая его до «великая святыня».
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксические тире выделяют поясняющее перечисление двух видов урожая; термин «десятина» сохранён как общеизвестный библейский культовый термин.
