base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: ru
  text: '«Говори сынам Израиля[b] и скажи им: „Когда мужчина даёт особый обет Яхве, согласно твоей оценке людей[a],“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна для точной передачи. Возможный более буквальный перевод: «когда мужчина даёт особый обет Яхве по твоей оценке людей». По-видимому, речь идёт о людях, для которых в следующих стихах устанавливается оценочная стоимость.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сынам Израиля»; это обычное обозначение народа Израиля как общины завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: Императив в формуле поручения. «Обратись… и скажи» звучит естественно по-русски и сохраняет два глагола исходного текста.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено буквальное родственное обозначение народа завета; более идиоматическое «израильтянам» дано в примечании как смысловой эквивалент.
- source_word: אִישׁ
  choice: мужчина
  rationale: Сохранена мужская форма единственного числа в юридической формулировке, хотя она может иметь типовой, представительский характер.
- source_word: יַפְלִא נֶדֶר
  choice: даст особый обет
  rationale: Hiphil от פלא указывает на необычный, особо выделенный обет; сочетание передано современным и понятным русским выражением.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: с оценкой людей по установленной тобой мере
  rationale: Формулировка сохраняет обращение во втором лице единственного числа и передаёт נפשות как людей, а не как бесплотные «души». Связь слов в еврейской фразе трудна, поэтому неопределённость отмечена в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя Бога передано как «Яхве», а направленность посвящения выражена связью всего обета с этим именем.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Мужская юридическая формула אִישׁ
  choice: мужчина
  alternative: кто-либо
  rationale: Мужской род исходного текста сохранён без отрицания того, что юридическая формула может иметь представительское применение.
- issue: Предмет обета и оценка людей
  choice: обет, связанный с оценкой людей по установленной тобой мере
  alternative: обет о людях по твоей оценке для Яхве
  rationale: Выбранный вариант не превращает людей в жертву и не уточняет сверх текста способ их посвящения; он сохраняет связь обета с установленной далее денежной оценкой.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис оставлен незавершённым запятой, поскольку условное предложение продолжается в следующем стихе; трудная еврейская конструкция не сведена к одной бесспорной интерпретации.
