base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: ru
  text: Царь Ахаз срезал обрамления подставок и снял с них чашу[a]. Затем он снял Море[b] с бронзовых быков[c], стоявших под ним, и поставил его на каменный настил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеется в виду сосуд для омовений при храмовом служении; традиционный перевод — «умывальник».
    reason: lexical_alternative
  - marker: b
    text: «Море» — название большой чаши, изготовленной для храма Соломона (см. 3 Цар. 7:23–26).
    reason: cross_reference
  - marker: c
    text: 'Или: «медных волов». Еврейское слово может обозначать крупный рогатый скот вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: срезал
  rationale: Глагол קצץ означает отсекать или срезать; здесь речь идёт о разборке частей храмового убранства.
- source_word: הַמִּסְגְּרוֹת
  choice: обрамления
  rationale: מִסְגְּרוֹת обозначает рамочные или окаймляющие элементы; «обрамления» естественно передаёт архитектурный смысл без излишней конкретизации.
- source_word: הַמְּכֹנוֹת
  choice: подставки
  rationale: В данном контексте מְכֹנוֹת — храмовые основания-подставки для чаш; «подставки» понятно современному читателю.
- source_word: וַיָּסַר מֵעֲלֵיהֶם וְאֶת הַכִּיּוֹר
  choice: снял с них чаши
  rationale: כִּיּוֹר — чаша для омовений при храмовом служении. Хотя в масоретском тексте существительное стоит в единственном числе, местоименный суффикс «с них» относится к множественным подставкам, а параллельное описание храмовой утвари предполагает чаши на подставках; множественное число по-русски устраняет неестественное рассогласование.
- source_word: הַיָּם
  choice: Море
  rationale: Это традиционное название большой храмовой чаши; прописная буква показывает, что слово употреблено как название предмета.
- source_word: הוֹרִיד
  choice: спустил
  rationale: Побудительная форма ירד означает переместить вниз, в данном случае снять большой сосуд с его опор.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: медных быков
  rationale: בָּקָר может обозначать крупный рогатый скот вообще; в описании храмовых фигур естественно «быки». נְחֹשֶׁת в контексте храмовой утвари передано традиционным «медь».
- source_word: אֲשֶׁר תַּחְתֶּיהָ
  choice: которые служили ему опорой
  rationale: Буквально «которые были под ним»; функциональная формулировка ясно передаёт расположение фигур под Морем.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: поставил
  rationale: נתן здесь обозначает размещение предмета; «поставил» естественно для большой чаши.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: на каменный настил
  rationale: מַרְצֶפֶת — мощёная или выложенная поверхность; «каменный настил» сохраняет смысл, не подразумевая непременно возвышенной платформы.
