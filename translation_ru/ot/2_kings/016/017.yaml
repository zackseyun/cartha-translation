  - severity: low
    issue: «Которые служили ему опорой» добавляет функциональное истолкование вместо прямого пространственного указания.
    rationale: אֲשֶׁר תַּחְתֶּיהָ означает «которые были под ним/под ним находились». Функция опоры вероятна по контексту, но не должна заменять формулировку исходного текста.
  - severity: low
    issue: «Медных» менее точно передаёт материал в этом контексте, чем «бронзовых».
    rationale: נְחֹשֶׁת может широко обозначать медь/бронзу, но для литых фигур храмовой утвари «бронзовые» — нейтральное современное обозначение; традиционный вариант сохранён в сноске.
