  text: בָּ/עֵ֣ת הַ/הִ֗יא הֵ֠שִׁיב רְצִ֨ין מֶֽלֶךְ אֲרָ֤ם אֶת אֵילַת֙ לַֽ/אֲרָ֔ם וַ/יְנַשֵּׁ֥ל אֶת הַ/יְהוּדִ֖ים מֵֽ/אֵיל֑וֹת ו/ארמים בָּ֣אוּ אֵילַ֔ת וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: ru
  text: В то время Рецин, царь Арама, вернул Элат Араму[a] и изгнал иудеев из Элата[b]. Арамеи пришли в Элат и живут там до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском масоретском тексте здесь стоит «Араму», а далее — «арамеи». Некоторые древние свидетельства и толкователи предпочитают чтение «Эдому» и «эдомитяне»; оно лучше согласуется с историческим контекстом и параллельным рассказом во 2 Пар. 28:17.
    reason: textual_variant
  - marker: b
    text: Во втором упоминании название Элат имеет в еврейском тексте другую форму — «Элот».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: вернул
  rationale: Каузативная форма глагола שׁוב указывает на возвращение Элата под прежнюю власть; «вернул» естественно передаёт политико-военный смысл без лишнего уточнения.
- source_word: אֵילַת / אֵילוֹת
  choice: Элат
  rationale: В стихе употреблены две формы названия города. В основном тексте последовательно используется привычная русская передача «Элат», а вариант формы отмечен в сноске.
- source_word: לַאֲרָם
  choice: Араму
  rationale: Предлог обозначает переход владения или контроля. Сохраняется древнее собственное имя «Арам», а не более позднее обозначение «Сирия».
- source_word: וַיְנַשֵּׁל
  choice: изгнал
  rationale: Глагол означает лишение владения и удаление людей из места; «изгнал» ясно и естественно передаёт насильственное вытеснение.
- source_word: הַיְהוּדִים
  choice: иудеев
  rationale: В контексте эпохи царств это жители или подданные Иудеи. Форма «иудеи» сохраняет этноним и остаётся понятной современному читателю.
- source_word: וארמים
  choice: арамеи
  rationale: Масоретский согласный текст указывает на арамеев. Вариант «эдомитяне», поддерживаемый рядом древних свидетельств и историческим контекстом, вынесен в сноску.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: живут там до сего дня
  rationale: Еврейская формула выражает продолжающееся от описанного события проживание вплоть до времени повествователя; настоящее время естественно передаёт этот смысл по-русски.
theological_decisions:
- issue: Текстологическая трудность с названием народа и страны
  choice: Араму; арамеи пришли в Элат
  alternative: Эдому; эдомитяне пришли в Элат
  rationale: Основной текст следует масоретскому чтению, не устраняя возникающее историческое напряжение. Вариант «Эдом/эдомитяне», согласующийся с рядом древних свидетельств и параллельным повествованием во 2 Пар. 28:17, сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской окраской. Формула «до сего дня» сохранена как ясный и узнаваемый повествовательный оборот; синтаксис сделан простым и естественным.
