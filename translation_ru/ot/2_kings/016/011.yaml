revisions:
- from: И священник Урия построил жертвенник по всему тому, что царь Ахаз прислал из Дамаска. Так священник Урия и сделал до возвращения царя Ахаза из Дамаска.
  to: И священник Урия построил жертвенник согласно всему, что прислал царь Ахаз из Дамаска; так священник Урия и сделал до прибытия царя Ахаза из Дамаска.
  rationale: Заменено «по всему тому, что» на более естественное «согласно всему, что», сохраняющее значение полного соответствия. «До возвращения» заменено на «до прибытия», чтобы не добавлять к исходному тексту подразумеваемое возвращение. Имена, титулы, термин «жертвенник» и повторная формула сохранены.
