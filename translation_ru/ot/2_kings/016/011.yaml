  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: ru
  text: И священник Урия построил жертвенник согласно всему, что прислал царь Ахаз из Дамаска; так священник Урия и сделал до прибытия царя Ахаза из Дамаска.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Стандартное соответствие глаголу בנה; естественно описывает сооружение жертвенника.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: священник Урия
  rationale: Сохраняет имя, звание и их повтор во второй части стиха.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычное русское библейское обозначение сооружения для жертвоприношений; определённость ясна из контекста.
- source_word: כְּכֹל אֲשֶׁר
  choice: по всему тому, что
  rationale: Передаёт полное соответствие присланному царём образцу или указаниям, не уточняя того, что еврейский текст оставляет подразумеваемым.
- source_word: שָׁלַח
  choice: прислал
  rationale: Приставка «при-» естественно выражает направление отправки из Дамаска к Урии; подразумеваемый объект не добавлен.
- source_word: מִדַּמֶּשֶׂק
  choice: из Дамаска
  rationale: Предлог מן обозначает источник или исходную точку.
- source_word: כֵּן עָשָׂה
  choice: Так ... и сделал
  rationale: Естественная русская конструкция, подчёркивающая точное исполнение того, что было прислано.
- source_word: עַד בּוֹא
  choice: до возвращения
  rationale: В данном контексте בוא обозначает прибытие Ахаза обратно из Дамаска; «до возвращения» естественно передаёт временной предел действия.
- source_word: הַמֶּלֶךְ אָחָז
  choice: царь Ахаз
  rationale: Нормальный для современного русского порядок титула и имени.
