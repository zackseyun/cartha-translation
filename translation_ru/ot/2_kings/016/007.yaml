base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: ru
  text: 'И послал Ахаз послов к Тиглатпаласару, царю Ассирии, сказать: «Я твой слуга и твой сын.[a] Приди и спаси меня от руки царя Арама[b] и от руки царя Израиля[c], которые восстают против меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «твой слуга и твой сын» — дипломатический язык подчинения; по смыслу: «твой вассал».'
    reason: lexical_alternative
  - marker: b
    text: Арам традиционно также называют Сирией.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «от руки»; здесь это означает «от власти» или «от силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычный повествовательный эквивалент формы wayyiqtol от שׁלח.
- source_word: מַלְאָכִים
  choice: послов
  rationale: В политическом контексте речь идёт о человеческих посланниках; «послы» естественно передаёт официальный характер миссии.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: Тиглатпаласару
  rationale: Устоявшаяся русская форма имени ассирийского царя.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: твой слуга и твой сын
  rationale: Буквально сохраняет дипломатический язык подчинения и не заменяет образность техническим термином «вассал».
- source_word: עֲלֵה
  choice: приди
  rationale: В обращении к адресату передаёт направленность движения к говорящему; военный смысл ясен из контекста без добавления слова «войско».
- source_word: וְהוֹשִׁיעֵנִי
  choice: спаси меня
  rationale: Передаёт каузативную форму от ישׁע и сохраняет библейскую лексическую связь; здесь контекст указывает на военно-политическое избавление.
- source_word: מִכַּף
  choice: от руки
  rationale: Сохраняет конкретную еврейскую метафору власти и контроля.
- source_word: אֲרָם
  choice: Арама
  rationale: Передаёт древнее название прямо, избегая возможного отождествления с современной Сирией.
- source_word: הַקּוֹמִים עָלָי
  choice: которые выступили против меня
  rationale: Естественная современная русская формулировка для враждебного выступления; причастие описывает актуальное противостояние.
theological_decisions:
- issue: Дипломатическое самоуничижение Ахаза
  choice: «твой слуга и твой сын»
  alternative: «твой вассал»
  rationale: Текст использует образы служения и сыновства. Их сохранение передаёт политическое подчинение, не вводя в основной текст более узкий технический термин.
- issue: Военно-политический смысл глагола ישׁע
  choice: «спаси меня»
  alternative: «избавь меня» / «выручи меня»
  rationale: «Спаси» сохраняет лексическую связь с более широким библейским употреблением, тогда как контекст ясно показывает, что речь идёт о военной помощи.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для обычного читателя; ключевые древнееврейские образы сохранены, а их дипломатический и идиоматический смысл пояснён в примечаниях.
