  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: ru
  text: И крытое сооружение для субботы, которое построили в храме[a], и внешний вход царя[b] он отвёл от храма Яхве[c] из-за царя Ассирии[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крытый павильон для субботы», «субботний навес» или «субботний портик». Точный архитектурный смысл редкого еврейского слова неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внешний вход для царя» или «царский внешний вход».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «изменил», «переместил» или «убрал». Еврейский глагол может обозначать отведение в сторону либо изменение расположения, а не обязательно полное удаление.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «ради царя Ассирии»; возможно: «из страха перед царём Ассирии».'
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: крытую галерею для субботы
  rationale: Редкое слово מיסך обозначает некое крытое архитектурное сооружение; «крытая галерея» естественно звучит по-русски, а точный вид сооружения оставлен неопределённым и пояснён в сноске.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: которую построили при храме
  rationale: Сохранён неопределённый субъект множественного числа «построили». בַבַּיִת здесь относится к храмовому комплексу; «при храме» не создаёт впечатления, будто сооружение находилось внутри храмового здания.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: внешний царский вход
  rationale: מְבוֹא означает вход или проход; формулировка сохраняет связь входа с царём и определение «внешний», не уточняя сверх текста его устройство.
- source_word: הֵסֵב
  choice: перенёс
  rationale: Каузативная форма глагола סבב может означать поворот, изменение направления или местоположения. «Перенёс» подходит архитектурному контексту, не утверждая полного уничтожения или удаления объектов.
- source_word: בֵּית יְהוָה
  choice: храм Яхве
  rationale: В данном контексте «дом Яхве» обозначает храм. Функциональный русский эквивалент «храм» ясен современному читателю, а личное имя יהוה передано как «Яхве».
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: из-за царя Ассирии
  rationale: 'Широкое причинное выражение сохраняет неопределённость мотива: речь может идти о давлении, требовании или страхе перед ассирийским царём.'
theological_decisions:
- issue: Степень конкретизации мотива Ахаза и характера изменений в храмовом комплексе
  choice: Сохранить широкое «из-за царя Ассирии» и передать הֵסֵב как «перенёс»
  alternative: «из страха перед царём Ассирии»; «убрал», «изменил» или «отвёл»
  rationale: Еврейский текст не устанавливает однозначно ни страх как конкретный мотив, ни полное удаление сооружений. Перевод сохраняет историческую и смысловую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет два вынесенных вперёд однородных объекта еврейского предложения, но остаётся понятным. Терминология не привязана к конфессиональной традиции; имя יהוה передано как «Яхве».
