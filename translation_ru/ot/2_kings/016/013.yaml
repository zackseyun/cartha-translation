base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: ru
  text: И он сжёг своё всесожжение и своё хлебное приношение, вылил своё возлияние и окропил жертвенник кровью своих мирных жертв.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертв общения»; или: «жертв благополучия». Еврейское слово обозначает особую категорию жертв (שְׁלָמִים).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: сжёг на алтаре
  rationale: В породе хифиль глагол קטר в жертвенном контексте означает превращать приношение в дым на алтаре. Выражение «сжёг на алтаре» естественно по-русски и ясно передаёт ритуальное действие.
- source_word: עֹלָתוֹ
  choice: своё всесожжение
  rationale: עֹלָה — установленное обозначение жертвы всесожжения; традиционный русский термин точен и понятен в библейском контексте.
- source_word: מִנְחָתוֹ
  choice: своё хлебное приношение
  rationale: В культовом контексте מִנְחָה обозначает приношение из зерна или муки. «Хлебное приношение» сохраняет особую категорию жертвы и звучит естественнее, чем буквальное «зерновое приношение».
- source_word: וַיַּסֵּךְ
  choice: вылил
  rationale: Глагол נסך здесь обозначает ритуальное излияние жидкости; «вылил» прямо и естественно передаёт действие.
- source_word: נִסְכּוֹ
  choice: своё возлияние
  rationale: נֶסֶךְ — жидкое приношение, совершаемое путём излияния. «Возлияние» является точным и устоявшимся русским обозначением этой жертвенной категории.
- source_word: וַיִּזְרֹק
  choice: выплеснул
  rationale: זרק обозначает бросание или резкое нанесение крови на жертвенник, а не лёгкое окропление. «Выплеснул» передаёт направленное движение жидкости естественнее, чем буквальное «бросил кровь».
- source_word: דַּם הַשְּׁלָמִים
  choice: кровь своих мирных жертв
  rationale: שְׁלָמִים — особая жертвенная категория, традиционно называемая по-русски «мирными жертвами». Возможные смысловые варианты отмечены в сноске.
- source_word: אֲשֶׁר לוֹ
  choice: своих
  rationale: Оборот אֲשֶׁר לוֹ указывает, что мирные жертвы принадлежали ему или были принесены им; русское возвратное притяжательное местоимение кратко сохраняет этот смысл.
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвенник
  rationale: При זרק предлог עַל описывает нанесение крови на жертвенник, возможно на его боковые поверхности. «На жертвенник» сохраняет допустимую пространственную широту оригинала, не уточняя «на» или «о стенки» сверх текста.
theological_decisions:
- issue: Значение названия жертв שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Еврейский термин обозначает конкретную категорию жертв, а его точная смысловая мотивация допускает разные передачи. В основном тексте сохранён устоявшийся русский термин, а альтернативы приведены в сноске без навязывания одного богословского толкования.
translation_notes:
  register: Современный литературный русский с умеренно традиционной жертвенной терминологией. Синтаксис сохраняет последовательность ритуальных действий оригинала; повтор притяжательного значения передан естественными русскими формами.
