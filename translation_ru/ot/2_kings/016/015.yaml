  source_fidelity: Перевод точно передаёт структуру царского повеления, различает всесожжение, хлебное приношение, возлияние и жертву, а также верно относит «на него» к большому жертвеннику. Императивы «сжигай» и «выплёскивай» адекватно передают ритуальные глаголы הַקְטֵר и תִּזְרֹק. Неясное לְבַקֵּר не истолковано чрезмерно определённо и снабжено уместным примечанием.
  naturalness: Текст звучит естественно для современного литературного русского при сохранении необходимого библейско-культового регистра. Перечень приношений читается ясно; «хлебное приношение», «всесожжение» и «возлияния» употреблены последовательно. «Будет служить мне для вопрошания» несколько книжно, но соответствует жанру, функции выражения и не является неестественным.
