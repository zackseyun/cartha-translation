  text: ו/יצו/הו הַ/מֶּֽלֶךְ אָ֠חָז אֶת אוּרִיָּ֨ה הַ/כֹּהֵ֜ן לֵ/אמֹ֗ר עַ֣ל הַ/מִּזְבֵּ֣חַ הַ/גָּד֡וֹל הַקְטֵ֣ר אֶת עֹֽלַת הַ/בֹּקֶר֩ וְ/אֶת מִנְחַ֨ת הָ/עֶ֜רֶב וְֽ/אֶת עֹלַ֧ת הַ/מֶּ֣לֶךְ וְ/אֶת מִנְחָת֗/וֹ וְ֠/אֵת עֹלַ֞ת כָּל עַ֤ם הָ/אָ֨רֶץ֙ וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֔ם וְ/כָל דַּ֥ם עֹלָ֛ה וְ/כָל דַּם זֶ֖בַח עָלָ֣י/ו תִּזְרֹ֑ק וּ/מִזְבַּ֧ח הַ/נְּחֹ֛שֶׁת יִֽהְיֶה לִּ֖/י לְ/בַקֵּֽר־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: ru
  text: 'Царь Ахаз повелел священнику Урии: «На большом жертвеннике сжигай утреннее всесожжение и вечернее хлебное приношение, всесожжение царя и его хлебное приношение, а также всесожжение всего народа страны, их хлебные приношения и возлияния. На него выплёскивай всю кровь всесожжений и всю кровь жертв. А медный жертвенник будет служить мне для вопрошания[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для осмотра», «для рассмотрения»; возможно также: «чтобы искать через него указания». Еврейское выражение трудно для понимания, и какую именно функцию Ахаз отводил медному жертвеннику, неизвестно.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז אֶת אוּרִיָּה הַכֹּהֵן
  choice: Царь Ахаз повелел священнику Урии
  rationale: Сохраняется властная сила глагола צוה, а порядок слов и управление именем приведены к естественной современной русской речи.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: на большом жертвеннике
  rationale: Буквально передаёт пространственное отношение и прилагательное הַגָּדוֹל, отличающее новый жертвенник от медного.
- source_word: הַקְטֵר
  choice: сжигай
  rationale: В породе hифиль глагол קטר обозначает возжигание приношения на жертвеннике с восхождением дыма; «сжигай» ясно передаёт практическое жертвенное действие.
- source_word: עֹלַת הַבֹּקֶר
  choice: утреннее всесожжение
  rationale: עֹלָה передано традиционным и точным русским культовым термином «всесожжение».
- source_word: מִנְחַת הָעֶרֶב
  choice: вечернее хлебное приношение
  rationale: В жертвенном контексте מִנְחָה означает приношение из продуктов земли; «хлебное приношение» понятно и точнее общего слова «дар».
- source_word: עֹלַת הַמֶּלֶךְ וְאֶת מִנְחָתוֹ
  choice: всесожжение царя и его хлебное приношение
  rationale: Сохранены обе притяжательные связи, причём местоимение естественно относится к царю.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: всесожжение всего народа страны
  rationale: Выражение עַם הָאָרֶץ оставлено в его широком общественном значении без сужения до простонародья.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: их хлебные приношения и возлияния
  rationale: Переданы множественные суффиксы и различие между хлебными приношениями и жидкими возлияниями.
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: всю кровь всесожжений и всю кровь жертв
  rationale: Сохранён параллелизм и различие между всесожжением עֹלָה и более общим זֶבַח.
- source_word: עָלָיו תִּזְרֹק
  choice: на него выплёскивай
  rationale: זרק обозначает бросание или выплёскивание крови на жертвенник; формулировка избегает неточного представления о лёгком окроплении.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת יִהְיֶה לִּי לְבַקֵּר
  choice: А медный жертвенник будет служить мне для вопрошания
  rationale: Формулировка сохраняет принадлежность функции царю и возможный смысл обращения за указанием, не уточняя способ и не скрывая трудность еврейского выражения.
theological_decisions:
- issue: Значение לְבַקֵּר в указании о медном жертвеннике
  choice: для вопрошания
  alternative: для осмотра; для рассмотрения; чтобы искать через него указания
  rationale: Точная функция медного жертвенника остаётся неясной. Выбранный вариант сохраняет вероятный совещательно-культовый оттенок, но примечание открыто указывает на лексическую неоднозначность и не утверждает конкретную форму гадания.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной жертвенной терминологией. Синтаксис сделан ясным для обычного читателя; повторения исходного текста сохранены там, где они поддерживают ритуальный перечень. Маркер примечания помещён при спорном выражении לְבַקֵּר, а не при имени священника.
