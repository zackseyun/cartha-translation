base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: ru
  text: Когда царь прибыл из Дамаска, он увидел жертвенник; царь подошёл к жертвеннику и взошёл на него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил на нём жертвоприношение». Это выражение иногда понимают как краткое указание на начало жертвоприношения; при более буквальном прочтении еврейский текст говорит о восхождении на жертвенник.'
    reason: Альтернативное контекстуальное понимание выражения וַיַּעַל עָלָיו.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: прибыл
  rationale: Глагол בוא в повествовательной форме обозначает прибытие царя; «прибыл» естественно передаёт движение из Дамаска к месту действия.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное в еврейском тексте повторено трижды. В русском переводе существительное сохранено в начале обеих частей, а одно повторение заменено местоимением ради естественности без утраты акцента на личных действиях царя.
- source_word: מִדַּמֶּשֶׂק
  choice: из Дамаска
  rationale: Предлог מִן указывает на исходный пункт движения; название города передано в принятой русской форме.
- source_word: וַיַּרְא
  choice: увидел
  rationale: ראה здесь выражает обычное зрительное восприятие.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: מִזְבֵּחַ — обычное обозначение жертвенника; определённость понятна из контекста и формы винительного падежа.
- source_word: וַיִּקְרַב עַל הַמִּזְבֵּחַ
  choice: подошёл к жертвеннику
  rationale: קרב означает приближение, а עַל при глаголе движения указывает на направленность к объекту. Русское выражение естественно передаёт это движение.
- source_word: וַיַּעַל עָלָיו
  choice: взошёл на него
  rationale: 'Форма עלה с עַל и местоименным суффиксом допускает прямое пространственное понимание: царь поднялся на жертвенник. Контекст допускает также жертвенное значение, поэтому оно отмечено в сноске, а не внесено безоговорочно в основной текст.'
theological_decisions:
- issue: Описывает ли וַיַּעַל עָלָיו физическое восхождение или совершение жертвоприношения
  choice: «взошёл на него»
  alternative: «принёс на нём жертву»
  rationale: Пространственное значение непосредственно соответствует сочетанию עלה с עַל, тогда как жертвенное понимание хорошо согласуется с контекстом следующего стиха. Основной текст сохраняет более буквальный образ, а сноска — реальную смысловую возможность, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «царь» частично сохранён, но смягчён местоимением, чтобы фраза не звучала неестественно. Точка с запятой удерживает последовательность действий одного повествовательного предложения.
