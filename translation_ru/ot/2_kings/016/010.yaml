base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: ru
  text: И отправился царь Ахаз в Дамаск навстречу Тиглатпаласару, царю Ассирии, и увидел жертвенник, который был в Дамаске. Царь Ахаз послал священнику Урии изображение жертвенника и его чертёж со всеми подробностями его устройства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Передаёт обычное значение выражения без уточнения не названной в тексте цели встречи.
- source_word: דְּמוּת הַמִּזְבֵּחַ
  choice: изображение жертвенника
  rationale: דמות обозначает подобие или наглядное изображение; «изображение» естественно по-русски и не предполагает непременно объёмную модель.
- source_word: תַּבְנִיתוֹ
  choice: его чертёж
  rationale: В данном ремесленно-строительном контексте слово означает план или конструктивную схему, дополняющую изображение.
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: со всеми подробностями его устройства
  rationale: Передаёт полноту описания изготовления и конструкции жертвенника естественным современным русским языком.
