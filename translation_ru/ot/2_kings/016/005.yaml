source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: ru
  text: Тогда Рецин, царь Арама, и Факей, сын Ремалии, царь Израиля, двинулись к Иерусалиму, чтобы воевать. Они осадили Ахаза, но не смогли сражаться.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: После слова «сражаться» в еврейском тексте объект не назван. По контексту может подразумеваться Ахаз или Иерусалим.
    reason: Сохраняет невыраженный объект и связанную с ним контекстуальную неоднозначность, не подменяя «сражаться» значением «одолеть».
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной повествовательный маркер и естественно связывает событие с предшествующим контекстом.
- source_word: יַעֲלֶה
  choice: выступили
  rationale: Глагол עלה обозначает движение вверх, здесь — военный поход к Иерусалиму; русское «выступили» естественно передаёт военное движение без неуместного буквального «поднялись».
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Рецин, царь Арама
  rationale: Сохраняет еврейское этногеографическое название Арам, не подменяя его более поздним названием Сирия.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: и Факей, сын Ремалии, царь Израиля
  rationale: Передаёт имя, отчество и царский титул в ясной для русского читателя аппозиционной конструкции.
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: войной против Иерусалима
  rationale: Передаёт направление и военную цель похода естественным русским оборотом.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: Они осадили Ахаза
  rationale: צור על в военном контексте означает осадить; необычный личный объект сохранён, поскольку масоретский текст прямо называет Ахаза.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: но не смогли одолеть его
  rationale: Буквально выражение означает «не смогли сражаться» без повторённого объекта. «Одолеть» естественно передаёт неудачу военного предприятия, а местоимение следует ближайшему явному объекту, Ахазу; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Неуказанный объект при לְהִלָּחֵם
  choice: «одолеть его», то есть Ахаза
  alternative: «одолеть его», где имеется в виду Иерусалим; либо буквальнее «вести бой» без названного объекта
  rationale: В еврейском после «сражаться» объект не повторён. Ближайший грамматически выраженный объект — Ахаз, однако контекст осады допускает отнесение к Иерусалиму. Основной текст следует ближайшему антецеденту, а сноска сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена переданы в привычной русской библейской форме; «Арам» сохраняет форму исходного этногеографического названия. Синтаксис разделён на два предложения ради ясности.
