  naturalness: «Выступили войной против Иерусалима» естественно, но несколько сглаживает исходную конструкцию с направлением к городу. «Двинулись к Иерусалиму, чтобы воевать» современно и ясно. «Не смогли сражаться» несколько лаконично, но в повествовательном регистре приемлемо и намеренно сохраняет эллипсис подлинника.
