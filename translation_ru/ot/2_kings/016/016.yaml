  text: וַ/יַּ֖עַשׂ אוּרִיָּ֣ה הַ/כֹּהֵ֑ן כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֥לֶךְ אָחָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/016.yaml
  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: ru
  text: И священник Урия сделал всё так, как повелел царь Ахаз.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Глагол עשה имеет широкое значение «делать, совершать»; здесь он описывает исполнение последовавшего ранее распоряжения.
- source_word: אוּרִיָּה
  choice: Урия
  rationale: Имя передано в принятой русской библейской форме.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Определённое существительное называет служение Урии; по-русски определённость естественно передаётся контекстом.
- source_word: כְּכֹל אֲשֶׁר
  choice: всё так, как
  rationale: Оборот выражает полное соответствие действию, предписанному царём; выбран естественный русский эквивалент без ослабления значения всеохватности.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол צוה означает властное приказание. «Повелел» сохраняет его силу и подходит к речи о царе; предшествование приказа исполнению ясно из синтаксиса и не требует отдельной временной формы.
- source_word: הַמֶּלֶךְ אָחָז
  choice: царь Ахаз
  rationale: Естественная русская конструкция с титулом перед личным именем.
theological_decisions:
- issue: Оценка подчинения Урии
  choice: Передать событие описательно, не добавляя прямой нравственной оценки.
  alternative: Использовать формулировку, которая сама по себе выражала бы одобрение или осуждение поступка Урии.
  rationale: Еврейский текст лишь сообщает, что Урия полностью исполнил повеление Ахаза. Более широкий контекст допускает отрицательную оценку, но данный стих прямо её не высказывает.
translation_notes:
  register: Современный литературный русский язык; краткий, сдержанный повествовательный стиль. Союз «И» сохраняет связь с предыдущим рассказом. Формулировка понятна широкому читателю и не привносит отсутствующей в стихе оценки.
