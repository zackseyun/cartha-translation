  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: ru
  text: Он приносил жертвы и воскурял благовония на высотах, на холмах и под каждым зелёным деревом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под каждым свежим деревом», «под каждым пышным деревом» или «под каждым густолиственным деревом». Еврейское определение может означать «зелёный», «свежий», «пышный» или «густолиственный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Он приносил жертвы
  rationale: Глагол זבח обозначает принесение жертвы. Русское выражение естественно передаёт культовое действие и не уточняет вид жертвы.
- source_word: וַיְקַטֵּר
  choice: воскурял благовония
  rationale: Пиэль קטר в культовом контексте может означать воскурение благовоний либо превращение приношения в дым. Выбран традиционно понятный русский культовый оборот без дополнительного толкования.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: במות — местные культовые места, часто расположенные на возвышенностях. «Высоты» сохраняет устойчивый библейский термин и отличие от следующих далее обычных холмов.
- source_word: וְעַל הַגְּבָעוֹת
  choice: на холмах
  rationale: גבעות прямо обозначает холмы; перевод сохраняет различие между культовыми «высотами» и топографическими возвышенностями.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: и под каждым раскидистым деревом
  rationale: רענן может означать зелёный, свежий, пышный или густолиственный. «Раскидистым» естественно описывает дерево с пышной кроной, но подлинная лексическая вариативность отмечена в сноске.
theological_decisions:
- issue: Передача формулы о недозволенном культе
  choice: 'Сохранены конкретные действия и места: принесение жертв и воскурение на высотах, холмах и под деревьями.'
  alternative: Истолковать формулу как «совершал языческие обряды в святилищах».
  rationale: Сам стих перечисляет культовые действия и места, но прямо не называет их языческими или недозволенными. Негативную оценку даёт контекст, поэтому в перевод она не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской культовой лексикой. «Высоты» и «воскурял» сохранены как точные и узнаваемые термины; синтаксис прост и доступен.
