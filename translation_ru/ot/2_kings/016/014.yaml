  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: ru
  text: Бронзовый жертвенник[a], который был перед Яхве, он перенёс от передней части Дома, от места между жертвенником и Домом Яхве[b], и поставил его с северной стороны жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «медный жертвенник».'
    reason: lexical_alternative
  - marker: b
    text: То есть храм Яхве.
    reason: clarification
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: бронзовый жертвенник
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; в контексте храмовой утвари традиционное и вероятное значение — «бронза», при этом вариант «медный» отмечен в сноске.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: который стоял перед Яхве
  rationale: לִפְנֵי передаёт пространственное положение «перед»; глагол «стоял» естественно выражает подразумеваемое местонахождение жертвенника, не устраняя культового оттенка пребывания перед Богом.
- source_word: וַיַּקְרֵב
  choice: он перенёс
  rationale: Хотя קרב буквально связано с приближением, здесь форма описывает перемещение уже названного жертвенника; «перенёс» ясно и естественно передаёт действие в данном контексте.
- source_word: מֵאֵת פְּנֵי הַבַּיִת
  choice: с места перед домом
  rationale: Выражение пространственно указывает на место перед зданием; такой перевод естественнее буквального «от лица дома» и сохраняет слово «дом».
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: между жертвенником и домом Яхве
  rationale: Повтор מִבֵּין уточняет исходное местоположение бронзового жертвенника. Слово «дом» сохраняет храмовую терминологию еврейского текста.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: и поставил его
  rationale: В контексте размещения тяжёлого культового предмета «поставил» естественно передаёт широкое значение נתן «положить, поместить, поставить».
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: с северной стороны жертвенника
  rationale: יֶרֶךְ означает бок или сторону, а צָפוֹנָה задаёт направление к северу; русский оборот точно и идиоматично выражает положение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение выражения «перед Яхве»
  choice: сохранено пространственно-культовое выражение
  alternative: в присутствии Яхве
  rationale: Фраза может указывать и на физическое положение перед святилищем, и на культовое пребывание перед Богом; буквальное и естественное «перед Яхве» сохраняет оба оттенка.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства повествования и еврейского храмового термина «дом Яхве». Тире выделяют уточнение местоположения и помогают ясно передать сложную пространственную конструкцию оригинала.
