  source_fidelity: 'Основной смысл передан точно: нравственное следование примеру царей северного Израиля, усиление «и даже», сохранение идиомы «провёл ... через огонь», сравнение с мерзостями народов и изгнание этих народов Яхве. «Пошёл путём» допустимо, однако в русском может прежде всего обозначать разовое физическое движение; «следовал путём» яснее передаёт древнееврейскую идиому поведения.'
