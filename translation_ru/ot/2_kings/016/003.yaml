source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ru
  text: Он следовал путём царей Израиля и даже провёл своего сына через огонь[a], подражая мерзостям народов, которых Яхве изгнал перед сынами Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принёс своего сына в жертву в огне». Буквально: «провёл своего сына через огонь» — выражение, связанное с осуждаемым языческим обрядом.'
    reason: Сохраняет возможное жертвенное понимание, не делая его единственным переводом неоднозначной древнееврейской формулы.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: пошёл путём
  rationale: Сохраняет еврейскую метафору образа жизни и поведения, оставаясь естественным по-русски.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Прямая передача родительной конструкции и нравственного сопоставления с правителями Северного царства.
- source_word: וְגַם
  choice: и даже
  rationale: Передаёт усиление и нарастание обвинения, а не простое добавление.
- source_word: אֶת־בְּנוֹ הֶעֱבִיר בָּאֵשׁ
  choice: провёл своего сына через огонь
  rationale: Сохраняет традиционную древнееврейскую формулу обряда, не уточняя сверх текста, означала ли она непременно завершённое жертвоприношение.
- source_word: כְּתֹעֲבוֹת הַגּוֹיִם
  choice: следуя мерзким обычаям народов
  rationale: Контекстуально раскрывает כְּ как соответствие практике, а תֹּועֵבוֹת — как отвратительные культовые обычаи; буквальное «по мерзостям» по-русски неестественно.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: которых … прогнал
  rationale: В данном историческом контексте Hiphil ירשׁ означает изгнать или лишить владения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: перед сынами Израиля
  rationale: Сохраняет образ изгнания перед Израилем и формальное выражение «сыны Израиля».
theological_decisions:
- issue: Следует ли прямо обозначить действие как принесение ребёнка в жертву
  choice: В основном тексте сохранить идиому «провёл своего сына через огонь»
  alternative: «принёс своего сына в жертву на огне»
  rationale: Еврейская формула несомненно относится к осуждаемому языческому обряду, но сама по себе не описывает все его детали. Буквально-идиоматическая передача сохраняет эту неопределённость, а толковательная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Метафора «пошёл путём» и этноним «сыны Израиля» сохранены; неестественное буквальное «по мерзостям» передано яснее как «следуя мерзким обычаям».
