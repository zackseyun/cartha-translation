    rationale: Фраза «как Давид, его отец» не содержит сказуемого и в современном русском воспринимается как синтаксически неполная. Добавление «делал» эксплицирует подразумеваемый из предыдущей части глагол, не добавляя нового смысла.
  - severity: low
