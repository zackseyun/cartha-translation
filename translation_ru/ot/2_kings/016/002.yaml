  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: ru
  text: Ахазу было двадцать лет, когда он стал царём, и шестнадцать лет он царствовал в Иерусалиме. Он не делал того, что было правильным в глазах Яхве, его Бога,[b] как делал Давид, его отец[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «отец» означает предка Ахаза по царской линии, а не его непосредственного отца.
    reason: cultural_note
  - marker: b
    text: 'Или: «не поступал праведно пред Яхве, своим Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: Ахазу было двадцать лет
  rationale: Естественная русская передача стандартного древнееврейского оборота, обозначающего возраст.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Форма указывает на время вступления на престол; эта передача ясна и естественна по-русски.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти, а не только обладание титулом.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места царствования.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: не делал того, что было правильным
  rationale: Сохраняет нравственную оценку исходной формулы и звучит понятно на современном русском языке.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохраняет прозрачный древнееврейский образ оценки с чьей-либо точки зрения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהָיו
  choice: его Бога
  rationale: Сохраняет местоименный суффикс мужского рода, относящийся к Ахазу, и формулу отношений с Богом.
- source_word: כְּדָוִד אָבִיו
  choice: как Давид, его отец
  rationale: Сохраняет слово «отец» и порядок смысловых компонентов исходного текста; примечание разъясняет его династическое значение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Значение выражения «Давид, его отец»
  choice: Сохранить слово «отец» с пояснением
  alternative: Давид, его предок
  rationale: Слово אָב может обозначать не только непосредственного отца, но и предка, особенно в царском и династическом контексте. Основной текст сохраняет форму источника, а примечание предотвращает фактическое недоразумение.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской образностью. Формула «в глазах Яхве» сохранена ради близости к древнееврейскому тексту; синтаксис остаётся ясным для обычного читателя.
