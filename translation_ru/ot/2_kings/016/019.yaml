  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Остальные деяния Ахаза, которые он совершил, разве не записаны в книге летописей[a] царей Иудеи?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книге анналов царей Иудеи».'
    reason: Лексическая альтернатива для דִּבְרֵי הַיָּמִים, обозначающего летописную, анналистическую запись.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Остальные деяния
  rationale: יֶתֶר означает «остаток, остальное», а דִּבְרֵי в устойчивой формуле о царствовании обозначает дела и деяния царя, а не только его слова. Начальный союз וְ естественно передаётся связностью контекста без отдельного «и».
- source_word: אָחָז
  choice: Ахаза
  rationale: Имя передано в принятой русской библейской форме.
- source_word: אֲשֶׁר עָשָׂה
  choice: совершённые им
  rationale: Передаёт относительную конструкцию «которые он совершил», избегая тяжеловесного повтора и сохраняя формальный смысл.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны
  rationale: הֲלֹא вводит риторический вопрос, предполагающий утвердительный ответ; «записаны» естественно передаёт כְּתוּבִים в контексте письменного исторического источника.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Хотя עַל буквально значит «на», при ссылке на письменный источник по-русски естественно «в книге».
- source_word: דִּבְרֵי הַיָּמִים
  choice: летописи
  rationale: Устойчивое обозначение хронологической записи событий; «анналы» сохранено в сноске как допустимая лексическая альтернатива.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: לְ здесь выражает принадлежность или отнесённость архивного источника; современная русская конструкция «царей Иудеи» ясна и естественна.
