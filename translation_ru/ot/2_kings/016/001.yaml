base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: ru
  text: В семнадцатый год правления Факея, сына Ремалии, воцарился Ахаз, сын Иоафама, царь Иудеи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: В семнадцатый год правления
  rationale: Предлог ב с датировочной формулой обозначает время события, а числительное в данном контексте имеет порядковое значение. Добавление «правления» естественно передаёт подразумеваемый отсчёт царских лет.
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: Факея, сына Ремалии
  rationale: Предлог ל указывает, к чьему царствованию относится отсчитываемый год; патронимическая конструкция передана обычным русским приложением.
- source_word: מָלַךְ
  choice: воцарился
  rationale: В хронологической формуле форма глагола מלך обозначает вступление на престол. «Воцарился» кратко и точно передаёт начало царствования.
- source_word: אָחָז בֶּן יוֹתָם
  choice: Ахаз, сын Иоафама
  rationale: Имена переданы в традиционной русской библейской форме, а патроним — посредством приложения.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Приложение сохраняет титул и территориальную принадлежность; по ближайшему синтаксическому присоединению титул относится к Ахазу.
