  - severity: medium
    issue: «Переселил его жителей в Кир»
    rationale: Глагол גלה обозначает отправление в изгнание, то есть принудительное перемещение. «Переселил» в русском может быть нейтральным или добровольным; «увёл в изгнание» точнее передаёт военный и насильственный контекст.
