  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: ru
  text: И внял ему царь Ассирии[a]. Царь Ассирии выступил против Дамаска, захватил его, увёл его жителей в изгнание в Кир[b], а Рецина предал смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «послушал его». Еврейский глагол может означать, что услышанное повлекло ответное действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «увёл его в изгнание в Кир»; город обозначает его жителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: послушал его
  rationale: Сочетание שׁמע с אֶל означает не просто услышать, а выслушать и откликнуться действием; «послушал его» естественно передаёт оба оттенка.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Прямая передача генитивной конструкции; повтор во втором предложении сохраняет повествовательный акцент еврейского текста.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: выступил против Дамаска
  rationale: В военном контексте עלה с אֶל обозначает поход против города; «выступил против» ясно выражает враждебное продвижение без лишней конкретизации.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: захватил его
  rationale: Глагол תפשׂ здесь означает овладение городом; местоимение относится к Дамаску.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: переселил его жителей в Кир
  rationale: Формально объектом назван город, но он метонимически представляет население. «Переселил» передаёт насильственное перемещение, а жителей делает явными ради естественности русского языка.
- source_word: קִירָה
  choice: в Кир
  rationale: Название места передано принятой русской транслитерацией; направительный суффикс выражен предлогом «в».
- source_word: וְאֶת רְצִין הֵמִית
  choice: а Рецина предал смерти
  rationale: המית буквально означает «умертвил, причинил смерть»; «предал смерти» сохраняет каузативный и казённо-карательный оттенок контекста.
